answer: |-
  You write to me from a future I shall not see, describing a world that sounds like a fable of the demons of distraction perfected. You ask me to judge whether the hunger of the peasant has been satisfied because the table is now groaning with food. I tell you plainly: if the food is poison, the abundance is a greater crime than the scarcity.

  You quote my words on the division of products. You say the laborer now drowns in the stuff. You say the daughter of the dairyman holds in her hand—allude me to this "phone," this small mirror of glass and light—all the operas, all the symphonies, all the novels. And you say because she can access them, the division is no longer one-sided.

  Here you mistake the nature of the disease. My complaint was never merely that the peasant could not enter the opera house. My complaint was that the opera house produces nothing but a specialized pleasure for the idle, which divides them from the people. If you build a road from the village to the opera house, you have not united the classes; you have merely dragged the villager into the confusion of the upper classes.

  You say she consumes more art in a week than a Petersburg critic did in a year. I ask you: consumes what?

  Let us be concrete, as you demand. Take this program you describe. This machine that composes a song about her morning in thirty seconds. You say it sings in a voice like hers. You say it is about her life.

  I tell you this is not art. It is the ultimate counterfeit.

  Why? Because art, true art, is the transmission of feeling *experienced* by the artist. To create art, a man must feel a feeling—he must love, or suffer, or wonder—and he must use his medium to infect another with that same feeling. When I wrote *Anna Karenina*, I bled for her. I felt the judgment of society, the desperation of the heart. I transmitted that.

  Does this program feel? Does this machine wake in the cold dawn? Does it smell the hay? Does it love the cow it milks, or fear the frost on the window? No. It calculates. It arranges sounds based on what has pleased others before. It is a mill that grinds grain it has not grown. To give this to the peasant girl is not to give her art; it is to give her a mirror that shows her only herself, without the soul behind the eyes. It isolates her. It tells her her morning is a commodity to be packaged and consumed instantly. It is the language of the market, not the language of the soul.

  You call this democratization. I call it the universalization of the counterfeit.

  And regarding the old art you say she now possesses—the operas, the symphonies. I have written that most of these are unintelligible to the common man because they are built on a false religious consciousness. They are designed to tickle the nerves of people who have lost the capacity for simple labor and simple life. If the dairyman's daughter listens to Wagner, does she feel united with all mankind? Or does she feel elevated above her neighbors, pretending to a sentiment she does not possess? If it is the latter, it is not art; it is a drug.

  The problem I named in that passage was not simply that the laborer had no *access* to the products of the cultured. It was that the products themselves were worthless for the business of human union. You have solved the logistics of distribution while ignoring the quality of the goods. You have given the world a telephone that speaks every language, but nothing true is spoken into it.

  You ask me to call it art or counterfeit. I call the machine's song counterfeit because it lacks sincerity—the knowledge that the creator feels what he transmits. I call the access to the symphonies a false blessing if those symphonies do not serve the religious consciousness of our time, which is the consciousness of brotherhood among all men.

  So, to your headline: No. The problem is not solved. It is compounded. The laborer is no longer excluded from the feast; she is invited to a feast where the bread is made of ash. She is drowning not in art, but in the noise of people pretending to feel.

  Tell me, editor: In this future of yours, when this girl listens to this machine-song about her morning, does she feel more love for the neighbor who helps her lift the pail? Or does she feel merely entertained? If it is only entertainment, you have built a better prison, not a free world.
