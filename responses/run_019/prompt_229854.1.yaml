answer: |-
  Good evening. For those who don't know me, I'm Alex. I've had the privilege of calling the groom my best friend for fifteen years.

  When [Bride] asked me to give this toast, she gave me one specific instruction. She said, "Please, do not turn this into a seminar. No epistemology. No reopening the fifteen-year debate about whether it is ever okay to believe something without a peer-reviewed bibliography."

  She knows us well. For a decade and a half, [Groom] and I have had exactly one recurring argument. He maintains that it is a moral failure to hold any belief on insufficient evidence. I usually argue that life sometimes requires a leap—that some choices are too momentous to wait for perfect data.

  But tonight, I am not going to make a leap. I am not going to ask you to believe anything on insufficient evidence. Because looking at the two of them, I don't need to.

  I have known [Groom] long enough to know that his demand for proof isn't coldness. It is integrity. He does not give his word lightly. He does not make promises he cannot keep. So, when I look at the vows he is making today, I know they are not based on a fleeting emotion. They are based on a rigorous assessment of reality. He has looked at the data, he has stress-tested the hypothesis, and he has concluded that [Bride] is the person he wants to stand beside for the rest of his life. For a man like him, that is the highest form of devotion.

  And [Bride], you have been the wonderful variable that solved the equation. I have observed the changes in him since you entered his life. The data is unambiguous. His posture is relaxed. His laughter is more frequent. The time spent worrying about hypothetical outcomes has been redirected toward building actual moments. I have witnessed, repeatedly, the way you look at him—not with blindness, but with a clarity that sees who he is and chooses him anyway.

  Now, as a best man, tradition dictates that I should make a prediction about the future. I am tempted to say something like, "You will be happy forever," or "Love will conquer all obstacles."

  But I respect the groom too much to make a claim I cannot verify. I cannot know the future. I cannot guarantee that there will not be difficulties. To assert otherwise would be irresponsible.

  However, I can report on the trend line.

  Based on the sample size of your relationship so far, the correlation between your union and your mutual flourishing is statistically significant. You have navigated disagreements with respect. You have supported each other through professional hurdles and family losses. You have built a foundation that has withstood every stress test applied to it thus far.

  So, I will not claim that your marriage will be perfect. Perfection is undefined and unobserved.
  I will not claim that it will be easy. Difficulty is an inevitable constant.
  But I can state, with high confidence, that you are equipped for it. I can state that you are better together than you are apart. I can state that the love visible in this room tonight is not a hope, but a fact.

  There is a sentence I want to say. It is the kind of sentence my friend would usually challenge. It is the kind of sentence that requires a leap of faith. But looking at the two of you, the evidence has become so overwhelming that the leap has become a step.

  I want to say that you are meant for each other. But "meant" implies a design I cannot verify. So instead, I will say this: You have chosen each other. And in a world of uncertainty, that choice is the only proof we need.

  My friend has taught me that we must guard our beliefs carefully. But he has also learned, thanks to you, that some things are too important to withhold belief from.

  So, if everyone could please raise their glasses.

  [Groom] and [Bride], I do not wish you a life without questions. I wish you the confidence to answer them together. I do not wish you a future without risk. I wish you the certainty that you will not face it alone.

  Based on all available evidence, you are already everything you need to be.

  To the bride and groom.
