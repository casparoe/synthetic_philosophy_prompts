  ### Sensitivity Analysis

  Mathematically, the final number is most sensitive to **Dial Coherence ($I$)**.
  In a multiplicative model, the sensitivity of the output to a variable is determined by the product of the *other* variables.
  *   Sensitivity to $C$: $0.80 \times 0.40 \times 0.50 = 0.16$
