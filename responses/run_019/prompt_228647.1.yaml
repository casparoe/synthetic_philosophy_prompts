          *   (3) describes a smoker who *genuinely believes* smoking is terrible, is *ashamed*, and *tries to quit*. This sounds like someone who *does* accept the norm as binding but is weak-willed (akratic).
          *   *Conflict:* If the smoker accepts the norm as binding (per 3), why do they lose standing (per 2)? Position (2) defines the loss of standing as *not accepting the norm*. Position (3) asserts loss of standing despite *accepting the norm*.
          *   *Severity:* High. This strikes at the definition of hypocrisy/standing.
          *   *Fix:* Either change the definition in (2) (it's not about acceptance, it's about compliance) or change the verdict in (3) (the smoker *does* have standing).

      *   **Tension B: (1) vs. (3) [Norm-Specificity vs. Authority]**
          *   (1) says standing is norm-specific.
          *   (3) applies this to smoking.
          *   *Wait, is there tension?* Not really. (3) is an instance of (1).
          *   *Is there tension with (5)?* If blame is an address (5), does the *content* matter more than the *speaker*? (4) says content is true even if standing is lost.
          *   *Let's look closer at (4) vs. (5).*
          *   (5) says blame is an *address* making a *claim* on someone.
          *   (4) says the *content* is accurate and the target has reason to change, even if standing is lost.
          *   *Conflict:* If I lack standing to *address* you (5), in what sense am I making a *claim* on you? If the claim is valid (4), why can't I address it? If blame is essentially communicative (5), lacking standing means the communication is illegitimate. But (4) suggests the moral force remains.
          *   *Severity:* Medium. This is the "Tu Quoque" paradox. Does the moral reason exist independently of the relationship?
          *   *Fix:* Distinguish between "moral reason to act" and "authority to demand."

      *   **Tension C: (2) vs. (1) [The Definition of Hypocrisy]**
          *   (1) says "hypocrite about that very norm."
          *   (2) explains *why*: "if you don't accept the norm as binding on you."
          *   *Conflict:* Is violating a norm the same as not accepting it as binding? (3) highlights this. The smoker violates the norm but *does* accept it as binding (ashamed, trying to quit).
          *   *Severity:* High (Same as Tension A, really). It's the definition of the condition for losing standing.

      *   **Tension D: (4) vs. (5) [The Function of Blame]**
          *   (5) Blame is an address/claim.
          *   (4) The criticism is accurate/reasons exist even without standing.
          *   *Conflict:* If blame is *essentially* a social address (5), then lacking standing might render the act *not blame* but merely "criticism." If I can't properly address you, am I blaming?
