answer: |-
  The Everettian or Many-Worlds Interpretation (MWI) of quantum mechanics offers a parsimonious ontology: the universe is described solely by a universal wavefunction evolving deterministically according to the Schrödinger equation. There is no wavefunction collapse, no hidden variables, and no special status for observers. However, this ontological clarity comes at a steep conceptual price: the problem of probability. In standard quantum mechanics, the Born rule assigns probabilities to unique outcomes of measurements. In MWI, all possible outcomes occur. This essay argues that while the quantitative problem of probability is often the focus of technical debate, the deeper incoherence problem reveals that probability in MWI can only be salvaged through a functionalist revision of what probability *is*. By analyzing the strategies available to the Everettian, specifically decision-theoretic derivations, I will defend the verdict that coherent sense can be made of probability in a branching universe, provided we abandon the notion of probability as objective chance in favor of probability as a normative guide for rational action.

  To diagnose the issue, one must distinguish between two distinct difficulties: the incoherence problem and the quantitative problem. The incoherence problem is metaphysical and semantic. In a branching universe, every outcome permitted by the wavefunction is actualized on some branch. If an agent knows the theory is true, they know that outcome $A$ will occur and outcome $B$ will occur. Probability, classically understood, requires uncertainty regarding which outcome will obtain. If there is no ignorance of the outcome (since both obtain), talk of probability appears to lack a truth-maker. It seems incoherent to assign a probability less than one to an event that is guaranteed to happen.

  The quantitative problem arises even if one grants that probability talk is somehow meaningful. Why should the probabilities track the squared amplitudes of the wavefunction (the Born rule, $P = |\psi|^2$)? In a discrete branching structure, a naive intuition suggests the "principle of indifference": if a measurement causes the world to split into two branches, the probability of finding oneself on either should be $1/2$, regardless of the amplitude. However, quantum mechanics predicts probabilities based on amplitude squared, which can be unequal (e.g., $1/3$ and $2/3$). Since the number of branches is not a well-defined quantity in continuous Hilbert space, branch counting is ill-defined, yet the Everettian must explain why rational credences align with amplitude measures rather than a simple count of distinct outcomes.

  Consider a hypothetical scenario to disentangle these problems: suppose we discovered that nature only ever produces equal-amplitude splittings. In this "Equal-World," every quantum event splits the universe into branches of identical weight. Here, branch counting and the Born rule would always agree. The quantitative problem would vanish; there would be no conflict between counting branches and weighing amplitudes. However, the incoherence problem would remain fully intact. An agent in Equal-World still faces a future where both outcomes occur. Knowing the theory, they know they will experience outcome $A$ and they will experience outcome $B$. The question "What is the probability of $A$?" remains puzzling because there is no fact of the matter about which outcome is *the* outcome.

  This hypothetical diagnoses the core of the probability problem: it is not primarily about the *numbers* (the quantitative problem), but about the *nature of uncertainty* in a deterministic multiverse (the incoherence problem). The quantitative problem is merely a symptom of the deeper difficulty of grounding uncertainty when exclusivity is absent. If the incoherence problem is not solved, the quantitative problem is moot; if the incoherence problem is solved, the quantitative problem becomes a matter of deriving the correct weights for that uncertainty. Therefore, any viable strategy must first establish how uncertainty is possible, and second, why that uncertainty is weighted by amplitude.

  Three main strategies have been advanced to address these issues. The first is the **Subjective Uncertainty (SU)** approach, championed by Saunders and Wallace. This view argues that despite the objective determinism of the multiverse, a pre-measurement agent is subjectively uncertain about which branch they will occupy. They rely on a semantics of identity where personal identity is indeterminate across fission. The agent knows the global outcome but is ignorant of their local perspective.

  The strongest objection to SU is that it misconstrues the metaphysics of fission. As Parfit argued in personal identity cases, if I split into two successors, it is false that I will be only one of them. To say "I don't know which one I will be" implies I will be only one, which contradicts the MWI ontology where both successors are equally "me." Critics like Kent argue this is a form of self-deception; the agent knows everything there is to know about the future physical state, so claiming ignorance is linguistically misleading.

  The second strategy is the **Caring Measure** approach, associated with Vaidman and Tappenden. This view sidesteps uncertainty by redefining probability not as a prediction of what will happen, but as a measure of how much a pre-branching agent should *care* about their future successors. Probability becomes a weighting of ethical concern.

  The objection here is that this severs the link between probability and frequency. Standard probability is used to predict relative frequencies of outcomes. If probability is merely about how much I care, it becomes unclear why experimental statistics should match the Born rule in a way that constrains scientific theory confirmation. It risks making probability solipsistic, detached from the empirical data that physics aims to explain.

  The third and most robust strategy is the **Decision-Theoretic (DT)** program, developed by Deutsch and Wallace. This approach does not try to find "uncertainty" in the metaphysics. Instead, it asks: how should a rational agent act in a branching universe? By imposing axioms of rationality (such as ordering, diachronic consistency, and measurement neutrality) on an agent's preferences over quantum games, Deutsch and Wallace claim to prove that a rational agent must maximize expected utility using the Born rule weights.

  The strongest objection to the DT program is circularity. Critics like Albert and Price argue that the axioms required to derive the Born rule, particularly "Measurement Neutrality" (the idea that the physical implementation of a measurement shouldn't affect preferences if the payoffs are the same), implicitly presuppose the structure of the Born rule. If the axioms only make sense if one already accepts that branches have weights, the derivation is question-begging. Furthermore, Greaves raises the "Why be rational?" objection: even if the DT argument works, why should an agent care about this specific notion of rationality? If I prefer to maximize branch count rather than amplitude-squared utility, am I truly irrational, or just different?

  Weighing these strategies against the diagnosis provided by the Equal-World hypothetical, we can reach a verdict. The Equal-World case showed that the core issue is the lack of exclusivity. The SU approach tries to restore exclusivity semantically but fails metaphysically. The Caring Measure accepts the lack of exclusivity but risks detaching probability from empirical prediction. The DT program is the most promising because it accepts the ontology (all branches exist) and treats probability functionally. It argues that probability is whatever quantity plays the "probability role" in rational decision-making.

  The circularity objection to DT is serious but not fatal. It relies on a classical intuition that rationality must be grounded in objective chance. However, if objective chance does not exist in MWI, rationality must be grounded in the structure of the agent's existence within the wavefunction. The Hilbert space structure provides a natural measure (amplitude squared) that is conserved under unitary evolution, unlike branch count. A rational agent who ignores this measure risks making decisions that are unstable across time or inconsistent with the physical symmetries of their universe. Thus, the axioms are not circular; they are constraints on agency within a specific physical geometry.

  Therefore, I defend the verdict that coherent, non-circular sense *can* be made of probability in a branching universe, but only if we accept a functionalist definition of probability. The problem arises only if we insist that probability requires "objective single-outcome chance." If we instead define probability by its functional role—guiding belief and action in the face of multiple future possibilities—then the Everettian program succeeds. The quantitative problem is solved by the Deutsch-Wallace theorem, which shows that the Born rule is the unique measure that satisfies rational coherence in Hilbert space. The incoherence problem is dissolved by recognizing that subjective uncertainty is not required for the probability role to be filled; what is required is a normative link between the present agent and their future successors.

  In conclusion, the probability problem in MWI is not a refutation of the interpretation but a demand for conceptual revision. The Equal-World hypothetical demonstrates that the difficulty lies in the meaning of uncertainty, not the arithmetic of weights. By adopting the decision-theoretic strategy, the Everettian shows that rational agents in a multiverse are compelled to act *as if* the Born rule governs objective chances. This does not restore the classical metaphysics of chance, but it recovers the empirical and normative utility of probability. Thus, probability in the Everettian universe is coherent, provided we understand it not as a measure of what *will* happen, but as a measure of what *matters* for rational action.
