answer: |-
  The slogan "If you don't vote, you can't complain" is a rhetorical shutdown, not a rigorous argument. It relies on the ambiguity of the word "can't" (physical impossibility vs. normative permission) and the word "complain" (venting vs. claiming political authority). To evaluate it, we must separate the distinct logical claims hiding inside the phrase.

  Here is the breakdown of the precise claims, their validity, their implications for compulsory voting, and what the "excluded voter" test reveals about the slogan's true meaning.

  ### 1. The Four Readings of the Slogan

  **A. The Causal Claim (Responsibility)**
  *   **The Claim:** By abstaining, you materially contributed to the election outcome. Therefore, the result is partly your doing, and you bear responsibility for it.
  *   **Verdict:** **Substantive but often empirically false.**
  *   **Analysis:** This is defensible *only* if the election was close enough that your vote (or the block of abstentions you belong to) would have changed the result. In a safe seat or a landslide, a non-voter is causally inert. Furthermore, it assumes the non-voter would have voted for the loser. If they would have voted for the winner, or voted third-party, their abstention didn't "cause" the victory they dislike. Blaming non-voters for the winner is usually a post-hoc assumption.

  **B. The Moral Claim (Forfeiture of Standing)**
  *   **The Claim:** Political standing (the right to be heard or to object to governance) is a transactional right earned through participation. By opting out of the mechanism of consent, you forfeit the moral standing to object to the output.
  *   **Verdict:** **Substantive and defensible (within specific frameworks), but not universal.**
  *   **Analysis:** This aligns with "fair play" theories of political obligation (Hart, Rawls). If you benefit from the system, you must share the burden of maintaining it. However, it clashes with liberal human rights views, where the right to criticize power is inherent to personhood, not contingent on civic duty. It treats governance as a club rather than a jurisdiction.

  **C. The Expressive Claim (Hypocrisy)**
  *   **The Claim:** Complaining signals that you care about the outcome; not voting signals that you do not. Doing both simultaneously expresses a contradiction in your values (akrasia).
  *   **Verdict:** **Platitude.**
  *   **Analysis:** This is the most common usage. It points out an integrity gap. It is "true" in the sense that the behavior is inconsistent, but it is logically weak because hypocrisy does not make the *content* of the complaint false. A hypocrite can still be right about the policy.

  **D. The Pragmatic Claim (Efficacy)**
  *   **The Claim:** Complaining is a tool for political change. If you did not use the primary tool (voting), your secondary tool (complaining) is useless.
  *   **Verdict:** **False.**
  *   **Analysis:** Complaining serves functions other than immediate reversal: it signals dissatisfaction to future candidates, mobilizes others, or vents social pressure. Abstaining in one election does not render future advocacy useless.

  ---

  ### 2. Implications for Compulsory Voting

  If we take the slogan seriously, does it argue for compulsory voting (as in Australia or Belgium)? The answer depends entirely on which reading you adopt.

  **Support for Compulsory Voting:**
  *   **The Expressive Reading:** If the problem is hypocrisy/inconsistency, compulsory voting solves it. If everyone *must* vote, then everyone *can* complain. The condition is satisfied universally. It creates a society where the slogan no longer applies to anyone, legitimizing universal dissent.
  *   **The Moral Reading (Standing):** If standing is granted by voting, compulsory voting ensures universal standing. It prevents a scenario where an elite voting class silences a non-voting underclass.

  **Compulsory Voting as Pointless or Counterproductive:**
  *   **The Causal Reading:** If the goal is to ensure the "right" outcome, compulsory voting is risky. If non-voters are uninformed or indifferent, forcing them to vote may introduce noise (random voting) or amplify populism, potentially making the outcome *worse*. If the slogan implies "You caused this bad thing," forcing people to vote might make them cause *more* bad things.
  *   **The Moral Reading (Consent):** If voting is a meaningful signal of consent, compelling it cheapens the signal. A forced vote is not an exercise of agency. If the slogan is about "earning" standing through voluntary participation, compulsory voting turns voting into a tax, not a civic act. You can't "forfeit" standing if you were never given the choice to participate.

  **The Paradox:** If the slogan means "Only voters have standing," and we make voting compulsory, then **everyone has standing.** This means **no one is silenced.** Paradoxically, if the slogan's goal is to shut people up, compulsory voting defeats the purpose. If the goal is to legitimize complaints, compulsory voting supports it.

  ---

  ### 3. The "Excluded Voter" Test (Minors and Non-Citizens)

  The slogan implies a conditional: *If Not-Vote $\rightarrow$ Then Not-Complain.*
  Let us test this against groups who legally *cannot* vote: sixteen-year-olds, non-citizen residents, disenfranchised felons.

  **Does the slogan apply to them?**
  *   **Intuition:** Most people would agree that a sixteen-year-old *can* complain about climate change policy, or a non-citizen resident *can* complain about local policing, even though they cannot vote.
  *   **The Slogan's Logic:** If we apply the slogan literally, these groups have no standing to complain. This leads to a morally repugnant conclusion (taxation without representation, law without consent).

  **What this tells us about the "Right" Reading:**
  The fact that we exempt these groups from the slogan reveals that the slogan is not actually about **Voting** as the source of standing. It is about **Opportunity** and **Reciprocity**.

  1.  **It kills the Moral/Standing Reading:** If standing were strictly derived from the act of voting, minors would have no political rights. Since we grant them moral standing despite their inability to vote, standing must be inherent or based on *affectedness*, not just ballot-casting.
  2.  **It refines the Causal Reading:** Minors can't causally influence the election via voting. Therefore, they cannot be blamed for the outcome. The slogan only applies to those who *could have* acted but *didn't*.
  3.  **It confirms the "Fair Play" Reading:** The slogan is actually shorthand for: *"If you have the privilege of influence and refuse to use it, you cannot claim the burden of the outcome is unfair."*

  **Conclusion on the Edge Case:**
  The existence of non-voters who *should* be allowed to complain proves that the slogan is not a universal principle of political philosophy. It is a specific rebuke regarding **civic negligence among equals.**

  ### Summary Verdict

  *   **Which reading is the "Right" one?** The **Expressive/Hypocrisy** reading is what the friend meant, but the **Fair Play (Moral)** reading is the only one that holds philosophical water. The slogan is really about *wasted opportunity*, not the metaphysics of rights.
  *   **Is the slogan true?** As a universal rule, **False.** As a specific rebuke to a capable citizen who is indifferent to the consequences of their indifference, it is **Defensible.**
  *   **Compulsory Voting:** The slogan supports compulsory voting only if you view voting as a duty required to legitimize dissent (Expressive/Moral). It opposes compulsory voting if you view voting as a signal of voluntary consent (Causal/Agency).
  *   **The Friend's Error:** Your friend treated a nuanced claim about civic reciprocity as a silencing mechanism. They used a claim about *responsibility* ("you helped cause this") to enforce a claim about *rights* ("you are not allowed to speak"). The "Excluded Voter" test shows that the right to complain is not bought with a ballot; it is bought with personhood. The vote only buys you the right to claim you tried to stop it.

  You can complain without voting. But you cannot claim the outcome is *illegitimate* without voting. Your friend confused **criticism** (which is always allowed) with **authority** (which is earned).
