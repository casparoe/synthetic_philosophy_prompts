      *   **Psi-Epistemic:** $\psi$ is knowledge/belief/information about an underlying reality (ontic state $\lambda$). Collapse is Bayesian updating. Challenge: PBR theorem (requires Preparation Independence), explaining interference without physical waves, explaining why $\lambda$ isn't directly accessible.

