answer: |-
  ### The Scene

  The apartment smelled of turpentine and new drywall. Mara stood in the center of the room, arms wide, as if measuring the air. She was fifty-two, wearing linen that cost too much to be truly carefree. By the door, a single hard-shell suitcase stood upright, handle extended, ready to roll.

  Toby sat on the only unpacked box, holding a paper cup of tea. He was twenty-four. He watched her watch the light moving across the floorboards.

  "It's good, Mom," he said. "The light."

  "It's Mara," she corrected, without turning. Her voice was warm, devoid of sting. "And it's not just light, Toby. It's possibility. Most people walk into a room and see walls. I walk in and I see where the walls *aren't*."

  She turned to him. She looked rested. She looked like someone who had never been tired a day in her life.

  "I'm glad you came," she said. "I want you to understand. This isn't running away. Running implies there's something behind you that's chasing you. There's nothing. There's just... gravity. And I'm learning to float."

  Toby took a sip of tea. "You sold the house in Portland."

  "I released the house," Mara said. She walked over to the kitchen counter. It was bare, except for a knife block and a stack of Tupperware containers. "Do you see? I am not a homeowner. I am not a resident of Portland. I am not even 'your mother' in the way you think I am. Those are statues. People carve statues of themselves and then wonder why they can't move. I am not a statue. I am the hand that holds the chisel."

  "Right," Toby said. "But you're still my mom."

  Mara smiled. It was a beatific smile, the kind you see on brochures for wellness retreats. "I am a woman who gave birth to you. That is a fact, like the color of my eyes. But it is not a definition. I am under no obligation to keep telling the story of the mother. The past is just a story we tell ourselves to make the present feel inevitable. I refuse the inevitability."

  She opened a Tupperware container. She began slicing an apple. The knife work was precise, efficient, the knuckles tucked, the wrist snapping. She cut the apple into uniform wedges, no larger than a thumb.

  "I read that," Toby said. "About the stories. It sounds... freeing."

  "It is freedom," Mara said. "Authenticity is owning that you are nothing but what you do *now*. If I stop doing 'mother,' I am not a mother. If I stop doing 'accountant,' I am not an accountant. I am pure project. I am pure transcendence."

  She placed the apple wedges into the container. She snapped the lid shut. The sound was sharp in the empty room. She placed the container into a reusable canvas bag. She added a protein bar. She added a napkin, folded into a triangle.

  Toby looked at the bag. "I'm not staying for dinner, Mom. Mara. I have a train in an hour."

  "I know," she said. "You always get hungry on the train. Your blood sugar drops around forty-five minutes in. You get irritable."

  She zipped the bag. She checked the zipper pull to make sure it was flush with the side.

  "I packed you a snack," she said. "Not because I am your mother. But because I am a human being who chooses to care for another human being in this moment. It's a free choice. It has no weight."

  She handed him the bag. Her fingers brushed his. She noticed a loose thread on his coat sleeve. Without breaking the flow of her sentence, without looking down, she pinched the thread and pulled it free, flicking it onto the floor.

  "You have to understand," she said, her hand moving back to her side, empty now. "I'm not leaving you. There is no 'leaving' because there is no tie to sever. I am just... moving. Like water."

  Toby held the bag. It was warm from her hands. He looked at the suitcase by the door. It was the same brand as the one she'd had in Portland. The same brand as the one she'd had in Chicago.

  "Okay," Toby said. "Water."

  "Exactly," Mara said. She turned back to the window. "Don't look back, Toby. Statues crumble."

  Toby stood up. He put the bag over his shoulder. He walked to the door. He paused by the suitcase. He didn't touch it. He just looked at the tag. It was blank.

  "Bye, Mara," he said.

  "Be free, Toby," she said to the glass.

  He opened the door. He stepped out into the hallway. He heard the lock click behind him. It was a heavy, mechanical sound. It sounded like a promise kept.

  ***

  ### The Walkthrough

  **1. Why this is Bad Faith (The Transcendence Pole)**
  In Sartre's ontology, human reality is a tension between **facticity** (what we are: our past, our body, our situation, our "thrownness") and **transcendence** (what we are not yet: our freedom, our projects, our future). Authenticity is holding both in mind simultaneously: acknowledging I am *both* free *and* burdened by what I have been.

  Mara is in bad faith because she is trying to dissolve her facticity entirely into transcendence. She claims to be "pure project," "water," "the hand not the statue." She treats her past (motherhood, career, location) as if it has no ontological weight. But Sartre argues facticity *is* the coefficient of adversity against which freedom plays. You cannot be free *from* your facticity; you can only be free *in relation* to it.

  By claiming "If I stop doing 'mother,' I am not a mother," she is denying the sedimentation of her choices. She *made* a human being. That is an irreversible fact of the world, regardless of her current internal narrative. She is trying to be a pure consciousness (a "For-itself") without a body or history (an "In-itself"). Sartre calls this the "dream of the angel"—wanting to be God, fully free but without the mess of existence.

  **2. The Beats Carrying the Weight**
  *   **The Suitcase:** It is by the door, ready to go. She claims to be "fully present" ("I walk in and I see"), but her body is already prepared for exit. Her facticity (the habit of leaving) contradicts her transcendence (the claim of being here).
  *   **The Apple Cutting:** She claims to be "new," "floating," "water." But her knife skills are sedimented. You cannot learn that wrist snap in a week. It is the muscle memory of a thousand domestic meals she claims to have abandoned. Her body remembers the role her mouth denies.
  *   **The Thread:** This is the crucial leak. She says, "I am not your mother." But when she sees the loose thread, she fixes it. She cannot help herself. The care is ingrained. It happens *without breaking the flow of her sentence*. This proves the facticity is alive and active, even as she narrates its death.
  *   **The Tupperware:** She frames packing the lunch as a "free choice" with "no weight." But the specificity (blood sugar, 45 minutes) reveals a deep, historical knowledge. She is using her history to perform her freedom. She is relying on the "mother" data to execute the "non-mother" act.

  **3. Difference from the Waiter**
  The famous waiter in *Being and Nothingness* is in bad faith because he plays *too much* at being a waiter. He over-identifies with his facticity. He says, "I *am* a waiter." He flees his freedom to choose otherwise by becoming the role.

  Mara is the inverse. She under-identifies with her facticity. She says, "I am *not* a mother." She flees her facticity by pretending she is pure freedom.
  *   **Waiter:** "I am a thing." (Denies Transcendence).
  *   **Mara:** "I am nothing but freedom." (Denies Facticity).
  Both are fleeing the anguish of being *both*. The waiter flees the responsibility of creating himself; Mara flees the responsibility of what she has already created.

  ***

  ### The Attack: "Isn't this just changing her mind?"

  **The Objection:**
  A critic might say: "You're pathologizing reinvention. People change. People leave marriages and careers. Sartre can't draw a line between 'authentic conversion' and 'bad faith flight.' If she believes she's free, she's free. Who are we to say she's lying to herself?"

  **The Defense:**
  Sartre *does* have a line, though it is subtle. It lies in the **acknowledgment of anguish**.
  *   **Authentic Reinvention:** "I am leaving this life. I know this will hurt my son. I know I am carrying the habits of my past into the future. I accept the weight of this choice and the guilt of abandoning my old roles. I am choosing to be a stranger, and that is a heavy thing to be."
  *   **Mara's Bad Faith:** "I am leaving, and therefore the past never happened. There is no hurt because there is no tie. I am not a stranger, I am *nothing*."

  The distinction is not in the *action* (leaving), but in the *ontology of the action*. Mara denies the **resistance** of the world. She claims her choices have no gravity ("It has no weight"). Authenticity requires admitting that choices *do* have weight, that facticity *does* resist, and that freedom is the struggle against that resistance, not the magic wand that makes it vanish. If she admits the cost, she is authentic. By claiming there *is* no cost because she has redefined reality, she is in bad faith.

  **Does the case survive?**
  Yes. Because the scene shows her *failing* to escape. The thread, the knife, the suitcase—these prove the world is resisting her definition. She says "I am water," but the world treats her like stone. If she were merely changing her mind, she wouldn't need to insist so loudly on the metaphysics of it. The over-explanation ("I am not a statue") is the tell. Authenticity is usually quieter; it doesn't need to convince the room.

  ***

  ### The "Noticing" Scenario

  **What if she notices the pattern out loud?**
  Suppose in a later chapter, Mara says to Toby: "I see it now. I pack the same suitcase. I cut the apples the same way. I can't seem to stop."

  **Does the structure collapse?**
  No. In fact, it can get *worse*.
  If she says, "I can't seem to stop," she has simply swapped one bad faith identity for another.
  *   **Old Bad Faith:** "I am Pure Freedom."
  *   **New Bad Faith:** "I am A Person With A Pattern / An Addict To Reinvention."

  She has turned her behavior into a *thing* (a psychological profile, a "pattern") that determines her actions. She is saying, "The Pattern makes me do it." This is still fleeing responsibility. She is treating her freedom as a victim of her own psychology.

  **When does it help?**
  It only moves toward authenticity if she notices the pattern and *accepts the tension without resolving it*.
  She would have to say: "I pack the same suitcase. I claim I am free. I am lying to myself, and I am doing it freely. I am choosing to lie. I am responsible for this lie."
  That is authenticity: owning the bad faith.
  But if she uses the insight to say, "Well, that's just my trauma/pattern," she has just found a new cage. For Sartre, there is no "unconscious" to blame. If she notices it, she must own it as a *choice*, not a *symptom*. If she treats it as a symptom, the structure holds firm. She remains the angel dreaming of being a thing, even if the thing she dreams of being is "a broken record."
