      *   *Conciliationism:* Requires demotion of confidence because the peer's disagreement is evidence of error. Implies I can't just trust my reasoning when a peer says I'm wrong.
      *   *Steadfastness:* Allows maintaining confidence because I have access to my reasons. Implies I must trust my reasoning unless I have a specific defeater.
      *   *Toy Cases:* Mental math makes reasoning transparent. Real policy debates make reasoning opaque (judgment-heavy).
      *   *Peerhood:* Treated as static in literature, dynamic in reality.

  3.  **Evaluate the Positions (Testing the Hypothesis):**

      *   **Conciliationism:**
          *   *Standard Argument:* The "Uniqueness Thesis" (evidence supports only one doxastic attitude) + "Equal Weight" (peer status implies equal likelihood of error).
          *   *User's Claim:* It relies on an internalist premise (can't trust reasoning without certification).
          *   *Counter/Refinement:* Actually, Conciliationism often relies on *Externalist* logic about reliability. If a peer disagrees, my reliability *in this instance* is called into question objectively. It's not necessarily that I *can't* trust my reasoning, but that the *fact* of disagreement lowers the probability that my reasoning produced truth. However, the *pressure* to conciliate feels internalist (I need a reason to think I'm right *despite* the disagreement).
          *   *Self-Defeat Objection:* If peers disagree about conciliationism, conciliationists should be less confident in conciliationism. This suggests the principle applies to itself.
          *   *Verdict on Hypothesis:* The hypothesis holds water but might need nuance. It's less about "certifying reasoning" and more about "access to the total evidence." If the peer is truly a peer, they have the same evidence. If we differ, one of us is mishandling it. Why think it's me? The Conciliationist says "No special access to my own correctness." The Steadfaster says "I have access to my reasoning process."

      *   **Steadfastness:**
