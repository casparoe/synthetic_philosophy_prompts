answer: |-
  **Exam Question**

  Expectation-based theories locate the wrong of promise-breaking in the disappointment of reliance, yet they face puzzling cases where the promisee forms no expectation, such as promises made to the dying. Diagnose whether these cases refute expectation-based theories or merely require adjustment, and explain whether rival accounts grounded in the exercise of normative powers successfully avoid circularity when grounding the obligation.

  ***

  **Model Answer**

  Expectation-based accounts posit that the moral force of a promise derives from the expectations it creates in the promisee. On this view, breaking a promise is wrong primarily because it disappoints reliance or manipulates the promisee's anticipatory states. This explanation aligns well with standard commercial or social promises, where harm is measured by the frustration of induced expectations. However, this mechanism fails when the necessary psychological state is absent.

  Consider the deathbed promise: a agent promises a dying friend to care for their pet, knowing the friend will perish moments later without understanding or remembering the commitment. Similarly, consider a promise made to a hardened cynic who explicitly expects to be betrayed. In both instances, the promisee forms no reliance-based expectation. If the wrongness of promise-breaking were strictly identical to the disappointment of reliance, breaking these promises would be morally neutral. Yet, intuition strongly suggests that breaking them remains a wrong. The promisor violates a duty owed to the promisee, regardless of the promisee's psychological state. Therefore, these are not merely awkward edge cases requiring ad hoc adjustment; they are genuine counterexamples that refute the necessity of reliance for promissory obligation. Expectation accounts cannot be saved without ceasing to be expectation accounts.

  To explain the wrong in these cases, we must turn to accounts treating promising as the exercise of a normative power. Here, the act of promising is not merely predicting behavior but changing the normative landscape: the promisor voluntarily creates an obligation where none existed before. The wrong of breaking the promise is thus the violation of a self-imposed constraint, independent of the promisee's mental state. This successfully captures the deathbed case, as the obligation exists regardless of the promisee's awareness.

  However, this rival account faces a serious charge of circularity. To claim that an utterance creates an obligation presupposes that the agent has the power to create obligations via such utterances. But where does this power come from? If the power is grounded in a social convention, we must ask why that convention is binding. If the convention is binding because it generates expectations, we have silently smuggled the expectation account back in, restoring the original problem. If the convention is binding brutely, the account avoids circularity but loses explanatory depth, merely asserting that agents have a mysterious capacity to bind themselves.

  The strongest objection to the normative power view is that it offers no reason why this power exists other than to solve the very problem it addresses. It risks being a formal trick rather than a moral explanation. Nevertheless, this objection does not settle the matter in favor of expectation accounts. The expectation account is demonstrably false in no-expectation cases; it cannot explain the data. The normative power account, while potentially relying on a brute normative fact, at least accommodates the full range of promissory phenomena. We are thus forced to choose between a false theory with clear mechanics and a potentially brute theory with correct extension. The latter is preferable. We must accept that agents possess a normative capacity to bind themselves, even if the ultimate ground of that capacity remains a foundational moral fact rather than a derivative psychological one.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Identification of the Expectation Mechanism (4 marks)**
  *   **Full marks:** Clearly articulates that expectation accounts ground the wrong in the disappointment of reliance or manipulated anticipatory states.
  *   **Weakness note:** Weaker candidates often conflate this with general utilitarian harm or treat it as simply "making someone sad," missing the specific reliance mechanism.

  **2. Diagnosis of No-Expectation Cases (4 marks)**
  *   **Full marks:** Argues that deathbed/cynic cases are fatal counterexamples because the intuition of wrongness persists without reliance.
  *   **Weakness note:** A common error is claiming the promisee's heirs rely on the promise, thereby missing the point of the specific counterexample provided.

  **3. Explanation of Normative Power (4 marks)**
  *   **Full marks:** Describes the rival view as the volitional creation of normative relations (obligations) rather than psychological states.
  *   **Weakness note:** Students often describe this as mere "willpower" or resolve, failing to distinguish between intending to do something and obligating oneself to do it.

  **4. Analysis of Circularity Risk (4 marks)**
  *   **Full marks:** Explains that grounding the power in convention risks reintroducing expectations, while grounding it brutely lacks depth.
  *   **Weakness note:** Candidates frequently assert the account is circular without showing *where* the obligation is presupposed (e.g., in the validity of the convention).

  **5. Definite Verdict and Weighing (4 marks)**
  *   **Full marks:** Takes a clear stance on which theoretical cost is acceptable (e.g., accepting brute power over false expectation claims) and justifies it.
  *   **Weakness note:** Lower marks are awarded for sitting on the fence or concluding that both accounts are equally viable without weighing the refutation of the expectation account.
