  ### TA Note for Improvement
  For future assignments, pay close attention to the **antecedents** (the "if" conditions) of axioms. In bargaining theory, the distinction between "the set expands" (Unrestricted Monotonicity) and "the set expands *holding the ideal point constant*" (KS Individual Monotonicity) is the single most important technical distinction between the Nash and KS approaches. Memorizing the intuition ("players shouldn't lose from new options") is not enough; you must specify the conditions under which that intuition is axiomatically enforced.
