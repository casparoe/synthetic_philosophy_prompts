prompt: |-
  I got into a stupidly heated argument at Thanksgiving about whether my cousin is obligated to vote. She says her one vote is astronomically unlikely to swing anything so she might as well stay home, and my uncle shut her down with "what if everyone did that?" She shot back that everyone *isn't* doing that and won't, so who cares, and then everyone just talked past each other for twenty minutes. I keep running into this move — people deploy it about littering, free-riding on public transit, eating meat, whatever — and I've also noticed it gets treated as if it's just Kant for the masses, but then I took a philosophy course a few years back and remember Kant's actual universalizability tests being much weirder and more specific than "imagine everyone doing it and see if things go badly."

  So: can you lay out the distinct precise principles that "what if everyone did that?" could be standing for? I can gesture at some candidates — something like a genuinely Kantian test where the problem is a contradiction in willing or conceiving the universalized maxim, a more consequentialist generalization argument where the problem is just that bad results would follow if everyone did it, a fairness principle about not making an exception of yourself when you're counting on others to do their part, and maybe a causal claim that your behavior actually influences what others do — but I'm sure there are more and I'm sure I've mangled the Kant one. For each reading, say what kind of "what if" it's asking (logical, counterfactual, predictive?), whether it's a platitude, a substantive-but-defensible claim, or just false, and whether it actually delivers the conclusion my uncle wanted — i.e., that *this one person*, holding everyone else's actual behavior fixed, has a reason to vote. Please pay special attention to the objection my cousin would raise if she were cleverer: that for lots of these cases "everyone doing it" is either harmless, impossible, or so far-fetched that the thought experiment seems rigged, and that you can redescribe the maxim ("everyone whose vote has a less than one-in-a-billion chance of mattering stays home") to make any universalization come out fine.

  End by telling me which reading you think people who reach for the slogan in arguments like ours actually mean — maybe different people mean different ones — and whether the slogan is doing any real work or is just a rhetorical shortcut for something weaker.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A Thanksgiving argument about voting obligation.
      *   **Core Conflict:** Cousin says "my vote doesn't matter" (instrumental insignificance). Uncle says "what if everyone did that?" (universalization). Cousin retorts "everyone *isn't* doing that" (empirical reality).
      *   **User's Observation:** This slogan ("what if everyone did that?") is used everywhere (littering, free-riding, meat-eating). It's often treated as "Kant for the masses," but the user knows Kant's actual Categorical Imperative (CI) is more complex.
      *   **Task:** Lay out distinct precise principles that the slogan could stand for.
      *   **Specific Requirements for Each Principle:**
          *   What kind of "what if" is it? (Logical, counterfactual, predictive?)
          *   Status: Platitude, substantive-but-defensible, or false?
          *   Does it deliver the uncle's conclusion? (i.e., Does it obligate *this one person*, holding others' behavior fixed?)
          *   Address the "clever cousin" objection (harmless/impossible universalization, redescription of the maxim).
      *   **Conclusion:** Identify what people *actually* mean when they use the slogan and whether it's doing real work or is just rhetoric.

  2.  **Deconstruct the Slogan ("What if everyone did that?"):**
      The slogan is ambiguous. It conflates several distinct ethical arguments. I need to separate them clearly.

      *   *Candidate 1: Kantian Universalizability (Formula of Universal Law).*
          *   Focus: Contradiction in conception/willing.
          *   "What if": Logical/Conceptual possibility.
          *   Cousin's Objection: Maxim redescription ("free-riding when safe").
      *   *Candidate 2: Rule Utilitarianism / Generalization Argument.*
          *   Focus: Consequences of general compliance vs. general non-compliance.
          *   "What if": Counterfactual world comparison.
          *   Cousin's Objection: My act doesn't cause the general non-compliance.
      *   *Candidate 3: Fairness / Principle of Fair Play.*
          *   Focus: Free-riding on a cooperative scheme.
          *   "What if": Hypothetical condition of the scheme's stability.
          *   Cousin's Objection: Is voting a cooperative scheme? Is my contribution necessary?
      *   *Candidate 4: Expressive / Symbolic Significance.*
          *   Focus: What the act says about the agent or norms.
          *   "What if": Social norm signaling.
          *   Cousin's Objection: Private acts don't signal much.
      *   *Candidate 5: Causal/Contagion Effect (Empirical).*
          *   Focus: My act influences others.
          *   "What if": Predictive/Empirical claim.
          *   Cousin's Objection: My vote is secret/isolated; no causal link.

  3.  **Drafting the Analysis (Iterative Process):**

      *   *Refining the Kantian Point:* The user is right; Kant isn't just "bad outcomes." It's about the *maxim*. If the maxim is "I will not vote because my vote won't matter," can this be universalized without contradiction?
          *   *Contradiction in Conception:* If no one votes, democracy collapses. So the *institution* of voting disappears. If the institution disappears, the maxim "I won't vote because my vote won't matter" becomes incoherent (you can't choose not to vote if there's no voting).
          *   *Contradiction in Will:* Even if voting exists, could a rational agent will a world where no one votes? Probably not, as they rely on the government voting produces.
          *   *The "Clever Cousin" Objection:* She can refine the maxim: "I will not vote *when the probability of being pivotal is negligible*." In a world where *everyone* follows *that* maxim, voting still happens (because some elections *are* close). So no contradiction. This is the "Free Rider Exception" problem for Kant.
          *   *Verdict:* Substantive but vulnerable to maxim tweaking. Doesn't strictly bind the individual *if* others comply enough to keep the system going.

      *   *Refining the Generalization Argument (Rule Consequentialism):*
          *   Focus: If everyone did $X$, outcome $Y$ (bad) would happen. Therefore, don't do $X$.
          *   *The "What if":* Counterfactual comparison (World A: Everyone votes vs. World B: No one votes).
          *   *Problem:* The "Marginalist" objection. Just because the *general* practice is good doesn't mean the *marginal* act is required. (The "Paradox of Voting").
          *   *Does it bind the individual?* Only if you accept the "Generalization Principle" (act only on maxims that produce good consequences if universalized). But the cousin is right: the bad consequences only arise if *others* actually do it too.
          *   *Verdict:* Substantive, but logically distinct from individual obligation in a non-universalized context.

      *   *Refining Fairness (Principle of Fair Play):*
          *   Focus: You benefit from the system (democracy), others bear the cost (voting). It's unfair to take the benefit without the cost.
          *   *The "What if":* Implicit condition of the cooperative scheme.
          *   *Does it bind the individual?* Yes, even if others do their part. In fact, it *requires* others to do their part to generate the benefit you're free-riding on.
          *   *Cousin's Objection:* "I'm not free-riding; I'm just opting out of a pointless act." Or "The system works fine without me."
          *   *Verdict:* Strongest case for individual obligation *given* others' compliance.

      *   *Refining the Causal/Contagion Claim:*
          *   Focus: If I don't vote, I normalize not voting.
          *   *The "What if":* Predictive/Empirical.
          *   *Does it bind the individual?* Yes, because your act *changes* the "everyone else" variable.
          *   *Cousin's Objection:* "My vote is secret. No one knows."
          *   *Verdict:* Empirically shaky for secret ballots, stronger for public acts (littering).

  4.  **Addressing the "Clever Cousin" (Maxim Redescription):**
      *   This is crucial. The user specifically asked for it.
      *   For Kant: The maxim can always be indexed to conditions ("...when it's inconvenient," "...when it won't matter").
      *   For Consequentialism: The threshold problem. At what point does my abstention tip the scale?
      *   For Fairness: The "non-necessary contribution" problem. If the public good is produced regardless of *my* specific contribution, am I really free-riding? (The "imperceptible harm" debate).

  5.  **Synthesizing the Conclusion:**
      *   What do people *mean*? Usually a muddle of Fairness and Generalization.
      *   Is it rhetorical? Yes. It shuts down the "my vote doesn't matter" instrumentalism by shifting the frame from *causal efficacy* to *moral consistency*.
      *   Does it work? It works to shame, not necessarily to prove logical obligation.

  6.  **Review against Constraints:**
      *   Distinct precise principles? Yes (Kant, Rule Util, Fairness, Causal).
      *   Kind of "what if"? (Logical, Counterfactual, etc.)
      *   Status (Platitude, Substantive, False)?
      *   Delivers Uncle's conclusion? (Obligation holding others fixed).
      *   Address Clever Cousin's redescription objection?
      *   Final verdict on actual usage?

  7.  **Polishing the Tone:**
      *   Keep it philosophical but accessible (like the user's prompt).
      *   Acknowledge the user's insight (they know Kant isn't just "bad outcomes").
      *   Ensure the distinction between "holding others fixed" vs. "varying others" is clear, as that's the crux of the Uncle/Cousin dispute.

  8.  **Self-Correction/Nuance Check:**
      *   *Kant:* Make sure to distinguish Contradiction in Conception vs. Contradiction in Will. The "redescription" objection is strongest against Conception.
      *   *Fairness:* This is the only one that truly holds "others' behavior fixed" (because fairness matters *most* when others are cooperating). I need to highlight this.
      *   *Generalization:* Be clear that this is often criticized as the "Fallacy of Composition."
      *   *Voting Specifics:* Acknowledge the "secret ballot" issue for the Causal argument.

  9.  **Final Structure:**
      *   Intro: Validate the user's frustration.
      *   Principle 1: Kantian Universal Law (Logical/Conceptual).
      *   Principle 2: Generalization Argument (Rule Consequentialism).
      *   Principle 3: Principle of Fair Play (Reciprocity).
      *   Principle 4: Causal/Contagion (Empirical).
      *   The "Clever Cousin" Problem (Maxim Redescription).
      *   Conclusion: What people actually mean.

  (Proceed to draft response based on these points.)
answer: |-
  You have correctly identified that "What if everyone did that?" is a philosophical Rorschach test. It sounds like a single argument, but it actually conflates at least four distinct ethical principles, each with different logical structures and vulnerabilities. Your cousin and uncle were talking past each other because they were operating on different versions of the principle.

  Here is the breakdown of the distinct principles hiding behind the slogan, evaluated against your criteria.

  ### 1. The Kantian Formula of Universal Law (FUL)
  This is the one you studied in class. It is not about bad consequences; it is about **rational coherence**.

  *   **The Principle:** Act only according to that maxim whereby you can at the same time will that it should become a universal law.
  *   **The "What If":** **Logical/Conceptual.** It asks: "Is it possible to conceive of a world where everyone acts on my specific rule without the rule destroying itself or the rational agency required to follow it?"
  *   **Status:** **Substantive-but-defensible.** It is not a platitude; it requires rigorous analysis of the maxim. However, it is vulnerable to the "maxim redescription" problem (see below).
  *   **Does it deliver the Uncle's conclusion?** **No.**
      *   *Why:* Kantian universalization tests the *rule*, not the *act* in isolation. If your cousin's maxim is "I will not vote when my probability of being pivotal is negligible," a world where *everyone* follows that rule still has elections (because some elections *are* close). Therefore, the institution of voting survives. There is no contradiction in conception.
      *   *Contradiction in Will:* One might argue a rational agent cannot *will* a world where no one votes, because they rely on the government voting produces. But this requires the cousin to will the *end* (good government) while rejecting the *means* (voting) which is only irrational if voting is the *only* means. She can claim she supports democracy in other ways.
  *   **The Clever Cousin's Objection:** She redescribes the maxim. Instead of "I won't vote," the maxim is "I won't vote *in non-swing states*." If everyone does *that*, democracy functions fine. The universalization test passes, so Kant offers no obligation.

  ### 2. The Generalization Argument (Rule Consequentialism)
  This is the "Kant for the masses" version you suspected. It focuses on outcomes, not logic.

  *   **The Principle:** If the consequences of everyone doing $X$ would be disastrous, then you ought not to do $X$, even if your individual act causes no harm.
  *   **The "What If":** **Counterfactual Comparison.** It compares World A (everyone votes) vs. World B (no one votes). Since A is better than B, you must vote.
  *   **Status:** **False (Logically).** Philosophers generally regard this as the **Fallacy of Composition**. Just because a property holds for the group doesn't mean it holds for the individual margin. (Example: If everyone stands at a parade, everyone sees better. If one person stands, they see better. But if *only* you stand, you see better while others see worse. The generalization argument ignores the marginal case).
  *   **Does it deliver the Uncle's conclusion?** **No.**
      *   *Why:* This argument fails to hold "everyone else's behavior fixed." It implicitly assumes that *your* action determines *their* action. If the cousin says, "Everyone else is voting anyway," the Generalization Argument loses its grip. It proves that *collective* abstention is bad, not that *individual* abstention is wrong when the collective is intact.
  *   **The Clever Cousin's Objection:** "You are asking me to solve a collective action problem single-handedly. My staying home does not cause everyone else to stay home. The disaster only happens if *they* copy me, and they won't."

  ### 3. The Principle of Fair Play (Fairness)
  This is often the strongest argument for political obligation, though it is rarely articulated clearly in Thanksgiving arguments.

  *   **The Principle:** When you benefit from a cooperative scheme that requires sacrifices from others, you are obligated to make your fair contribution, even if your specific contribution is not causally necessary for the scheme's success.
  *   **The "What If":** **Hypothetical Condition of the Scheme.** It asks: "Are you accepting benefits produced by the restraint/cooperation of others while refusing to share the burden?"
  *   **Status:** **Substantive-and-Defensible.** This avoids the fallacy of composition. It acknowledges that the scheme works *because* others are voting, and argues that this success creates a debt of fairness.
  *   **Does it deliver the Uncle's conclusion?** **Yes.**
      *   *Why:* This principle specifically applies when **others are doing their part**. It obligates *you*, holding *their* behavior fixed. If everyone stayed home, there would be no scheme to free-ride on, so the obligation would vanish. The obligation arises precisely because "everyone *isn't* doing that" (as your cousin said).
  *   **The Clever Cousin's Objection:** She must attack the "benefit" or the "necessity."
      *   *Benefit:* "I don't benefit from this specific election outcome."
      *   *Necessity:* "Is voting really a 'sacrifice' or a 'burden' comparable to paying taxes?"
      *   *The "Non-Necessary Contribution" Problem:* If the public good (democracy) is produced regardless of *my* specific vote (because the margin is huge), am I really free-riding? Some philosophers argue yes (you're taking the security the system provides); others argue no (you aren't causally implicated).

  ### 4. The Causal/Contagion Claim (Empirical)
  This is a sociological claim disguised as ethics.

  *   **The Principle:** Your behavior influences the behavior of others. If you don't vote, you lower the social norm of voting, causing others to not vote.
  *   **The "What If":** **Predictive/Empirical.** It asks: "Does your action increase the probability that others will do the same?"
  *   **Status:** **Contingently True/False.** It depends on the act. For littering or public transit fare-dodging, this is empirically strong (broken windows theory). For secret-ballot voting, it is empirically **False**.
  *   **Does it deliver the Uncle's conclusion?** **Only if true.**
      *   *Why:* If your cousin's vote is secret, her abstention cannot causally influence her neighbors' voting habits. If she posted on social media "I'm not voting," the obligation might return because she is actively degrading the norm.
  *   **The Clever Cousin's Objection:** "My ballot is secret. My staying home is invisible. I am not setting an example."

  ---

  ### The "Clever Cousin" Problem: Maxim Redescription
  You asked for special attention to the objection that "everyone doing it" is harmless or that the maxim can be tweaked. This is the **Problem of Relevant Descriptions**.

  In ethics, any action can be described in infinite ways.
  *   **Description A:** "Not voting." (Universalizing this kills democracy).
  *   **Description B:** "Not voting when the probability of being pivotal is < 0.00001%." (Universalizing this leaves democracy intact).
  *   **Description C:** "Not voting on Tuesdays when it rains." (Universalizing this is harmless).

  If the agent gets to choose the description, they can always universalize their selfishness without contradiction. To defeat the cousin, the Uncle must argue that **Description A** is the morally relevant one. He must argue that "being pivotal" is not a morally relevant condition for the duty of citizenship, just as "being the only one littering" is not a morally relevant condition for the duty of cleanliness.

  However, logically, the cousin wins this round. Unless you can prove *why* Description A is the correct one independent of the consequences, the "What if everyone did that?" test is manipulable.

  ---

  ### Conclusion: What is actually happening at Thanksgiving?

  When your uncle deployed the slogan, he was almost certainly **not** doing Kantian analysis. He was likely mixing **The Generalization Argument** (bad outcomes if everyone does it) with **The Principle of Fair Play** (don't be a jerk to the rest of us who are trying).

  **Is the slogan doing real work?**
  Mostly, it is a **rhetorical shortcut for the Principle of Fair Play.**

  The slogan is an attempt to shift the frame from **Instrumental Rationality** (Does my vote change the outcome?) to **Expressive/Relational Rationality** (What kind of citizen am I, and how do I relate to my community?).

  *   **Your Cousin** is arguing from *Instrumental Rationality*: "My vote has 0 expected utility."
  *   **Your Uncle** is arguing from *Relational Obligation*: "You are a member of this club; members pay dues."

  The slogan "What if everyone did that?" is a clumsy way of saying: "You are treating the stability of the system as a fixed background resource that you can consume without maintaining, which is parasitic."

  **Verdict:**
  The slogan is **philosophically imprecise but pragmatically useful.** It fails as a logical proof (because of the Generalization Fallacy and Maxim Redescription), but it succeeds as a **normative shaming device**. It forces the cousin to admit that she is making an exception for herself.

  If you want to win the argument (or at least clarify it), tell your uncle to drop the "What if everyone did that?" line. It invites the cousin's empirical rebuttal ("But they won't!"). Instead, he should argue **Fairness**: *"It doesn't matter if everyone does it. It matters that you are benefiting from the fact that enough others **do** do it, while you refuse to share the cost. That is free-riding, regardless of the election outcome."*

  That is the only argument that holds the cousin's behavior fixed while obligating her to vote.
