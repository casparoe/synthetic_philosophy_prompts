answer: |-
  # Q&A Prep Sheet: Non-Human "Actors" in Environmental History

  **Context:** You are arguing for a *deflationary* definition of "actor" (causal power without intention) to improve historical mechanism specification.
  **Audience:** Skeptical social/cultural historians (fear determinism/absolution) + Sympathetic environmental historians (fear anthropomorphism).

  ---

  ### 1. The "Moral Hazard" Objection (Most Likely / Most Damaging)
  **Who:** Social/Cultural Historian
  **The Question:** "If we call a pathogen or a drought an 'actor,' aren't we risking a slide back into determinism? Specifically, in cases like colonial epidemics, doesn't this language let human agents—administrators, slave traders, policymakers—off the hook? If the smallpox virus is an 'actor' alongside the colonizer, aren't you diluting the moral responsibility of the colonizer?"

  **Your Reply (2 mins):**
  "That's the exact risk I'm trying to avoid, which is why the 'deflationary' distinction is crucial. Calling a pathogen an actor doesn't put it on the same *moral* plane as a human; it puts it on the same *causal* plane. Think of it like a firearm in a murder trial. The gun has causal power—it determines trajectory, velocity, lethality. We can narrate what the gun 'did.' But acknowledging the gun's causal role doesn't absolve the shooter; it actually clarifies *how* the shooter exerted power.
  In the colonial epidemic example, treating smallpox as a background 'condition' often hides how specific human decisions (quarantine policies, troop movements, trade routes) *amplified* the pathogen's trajectory. By treating the pathogen as an actor with its own transmission logic, we are forced to show exactly where human choices intersected with that logic to produce disaster. It doesn't dilute responsibility; it specifies the mechanism of harm. The virus acts, but humans decide whether to build the levee or break it."

  **🚩 Soft Spot:** The gun analogy is risky because humans manufacture guns, whereas they don't manufacture viruses. If pressed, concede that non-human actors lack *culpability* but retain *efficacy*.

  ### 2. The "Terminological Inflation" Objection (High Likelihood / Moderate Damage)
  **Who:** Sympathetic Environmental Historian
  **The Question:** "I agree we need to take non-human forces seriously. But 'actor' is a loaded term that implies intentionality to most readers outside this room. Why fight a semantic battle that alienates the social historians you need to convince? Why not just call them 'dynamic causal forces' and save the word 'actor' for beings with goals?"

  **Your Reply (2 mins):**
  "I understand the hesitation. 'Force' or 'factor' is safer, but it's also static. A 'factor' is something you control for in a regression; an 'actor' is something that surprises you. My argument is that 'actor' does specific methodological work that 'force' doesn't. When we say a volcano is a 'force,' we tend to look at the eruption as a single event. When we treat it as an 'actor,' we are compelled to follow its *trajectory* over time—the dust veil, the cooling, the harvest failure three years later, the migration.
  'Actor' implies a narrative arc, not just a variable. I'm not trying to smuggle in intention; I'm trying to smuggle in *unpredictability*. If we use softer language, we risk falling back into treating the environment as a stage set rather than a participant that pushes back. I'd rather fight for a word that forces us to specify mechanisms than use a safe word that lets us gesture at 'context.'"

  **🚩 Soft Spot:** They might argue you can have "dynamic forces" without the baggage of ANT (Actor-Network Theory). Be prepared to admit "actant" is the technical term but "actor" is the pedagogical one.

  ### 3. The "So What?" Objection (Moderate Likelihood / High Damage)
  **Who:** Pragmatic Social Historian
  **The Question:** "Let's say we accept this. Does this actually change how you read the archive? Or is this just a theoretical label you slap on at the end of a chapter? If I'm looking at tax records or parish registers, how does calling the plague an 'actor' change my methodology?"

  **Your Reply (2 mins):**
  "It changes where you look and what counts as evidence. If the plague is just 'context,' you look for human responses: laws, prayers, flight patterns. If the plague is an 'actor,' you have to reconstruct its *capabilities* independent of those records. You need to look at entomological data for flea populations, climate data for grain storage conditions, or genetic data on bacterial strains.
  It stops us from assuming the human record is the complete record of the event. For example, if parish records show a spike in deaths, a 'context' approach says 'people died.' An 'actor' approach asks, 'What was the pathogen doing that made it resistant to the quarantine measures listed in the city council minutes?' It forces interdisciplinary synthesis. It moves non-human evidence from the footnotes to the main argument."

  **🚩 Soft Spot:** If your paper doesn't actually *do* this (i.e., if you only used human archives), they will call you out on the gap between theory and practice.

  ---

  ### 4. The "Hope Nobody Asks" Question (The Theory Trap)
  **Who:** The Theory-Skeptic (Anyone)
  **The Question:** "This sounds like a watered-down version of Actor-Network Theory (Latour). Are you actually engaging with ANT, or are you just using the buzzword without the ontological commitment? Because if you reject the symmetry of ANT but keep the vocabulary, aren't you just confusing everyone?"

  **Why you hope they don't ask:** It requires you to position yourself within a dense theoretical debate that might overshadow your specific historical argument.
  **Brief Defense if asked:** "I'm borrowing the *heuristic* of ANT without the *ontology*. Latour asks us to treat non-humans as symmetric to humans. I'm asking us to treat them as *causal* but not *moral* equals. It's a methodological tool, not a philosophical system."

  ---

  ### Field Status: Settled vs. Contested
  *Use this to calibrate your confidence during the Q&A.*

  **✅ Settled Consensus:**
  *   **Non-humans matter:** No serious environmental historian argues that climate, disease, or geography are irrelevant.
  *   **Determinism is bad:** Everyone agrees that "climate caused the fall of Rome" (simple determinism) is insufficient explanation.
  *   **Interaction is key:** The consensus is that history happens in the *interaction* between human systems and ecological systems.

  **⚔️ Genuinely Contested:**
  *   **The Vocabulary of Agency:** Whether to use "agency," "actor," "actant," or "force" is highly debated. Many social historians reserve "agency" strictly for intentional resistance or choice.
  *   **The Weight of Causality:** *How much* explanatory weight should be given to the non-human vs. the human? (e.g., Did the Little Ice Age cause the French Revolution, or just make it worse? There is no consensus on the ratio).
  *   **Anthropomorphism:** Where is the line between useful metaphor ("the virus attacked") and misleading attribution ("the virus wanted to spread")?

  ### Strategic Advice for the Seminar
  1.  **Don't defend "Agency":** If they attack the word "agency," concede it immediately. Say, "I am arguing for *causal efficacy*, not moral agency." Do not die on the hill of the word "agency."
  2.  **Anchor in Disease:** Since this is a disease seminar, keep your examples biological. Pathogens are easier to defend as "non-intentional actors" than, say, "the ocean."
  3.  **Validate the Fear:** When the social historians worry about absolving humans, validate that fear. "You are right to worry about that. That is why the 'deflationary' limit is necessary." This makes you an ally, not an opponent.
