answer: |-
  Reply
  You mistake a reflective spiral for a vicious circle. CEV does not freeze your current flawed preferences as the immutable standard; rather, it leverages your existing capacity for self-correction as the engine of idealization. When we say "better by your own lights," we refer to the meta-preferences you already hold about how to revise first-order desires upon reflection. You already distinguish between impulsive urges and considered judgments; CEV simply extends this native discriminative ability across greater knowledge and reasoning power. The process isn't arbitrary because it relies on the convergence of these reflective equilibria, not a single static snapshot. If your current self rejects a bias upon gaining information, that rejection is authorized by your volition, not an external moral theory. The standard is internal to the architecture of agency itself—the drive to coherence—not an imported ethical axiom. Thus, we avoid importing biases by allowing the idealized process to overwrite them using the very tools you currently use to critique yourself, merely amplified. The circle is only vicious if agency lacks any internal resources for self-improvement, which empirically it does. We are not defining "good" externally; we are following the gradient of your own reflective approval.

  Counter-question
  If you reject this internal reflective standard, what non-arbitrary external metric do you propose to measure personal improvement without imposing alien values?
