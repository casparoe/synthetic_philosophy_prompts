  2.  **Deconstruct Bertrand's Paradox for a Physical Activity:**
      *   *The Problem:* What is the probability that a "random chord" of a circle is longer than the side of an inscribed equilateral triangle?
      *   *The Solutions:*
          1.  **Random Endpoints:** Pick two random points on the circumference. $P = 1/3$.
          2.  **Random Radius/Midpoint (Distance from Center):** Pick a random radius, then a random point on that radius for the midpoint. $P = 1/2$.
          3.  **Random Midpoint (Area):** Pick a random point inside the circle as the midpoint. $P = 1/4$.
      *   *Physical Implementation:*
          *   *Method 1 (Endpoints):* Spinners or throwing darts at the rim? Spinning a pointer twice is easiest.
          *   *Method 2 (Radius/Distance):* Pick a random angle, then a random distance from center along that line.
          *   *Method 3 (Midpoint Area):* Throw a dot randomly inside the circle (e.g., dropping a bead or marking a spot blindly).
      *   *Constraint:* 10 students. 3 groups of 3-4 works best to cover the three methods.
      *   *Measurement:* They need to know the length of the side of the inscribed equilateral triangle ($\sqrt{3}R$). Providing a template or a physical stick of that length is crucial for speed and accuracy.

