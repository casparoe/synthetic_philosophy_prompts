answer: |-
  Here is the specification for a theory of joint action. It is organized by functional requirement rather than by theorist, distinguishing between **Non-Negotiable** constraints (any theory claiming to describe joint action must meet these) and **Camp Commitments** (specific to normative, psychological, or sociological approaches).

  ### I. The Desiderata Spec

  #### A. Extensional Adequacy (Boundary Conditions)
  *The theory must correctly include clear cases of joint action and exclude clear cases of parallel action.*

  1.  **The Parallel Action Filter (Non-Negotiable)**
      *   **Requirement:** Must distinguish joint action from merely coinciding individual actions.
      *   **Case:** *The Protest.* Two people on opposite sidewalks heading to the same protest. They share a goal (protest) and knowledge of the other's presence, but they are not acting *together*.
      *   **Why:** A theory that counts this as joint action is too broad. There must be a relational glue beyond shared content.

  2.  **The Spontaneity Condition (Non-Negotiable)**
      *   **Requirement:** Must account for joint action without prior agreement, negotiation, or explicit promise.
      *   **Case:** *The Car Lift.* Strangers heaving a car off a cyclist. No time for talk, no prior plan.
      *   **Why:** Theories requiring explicit "joint commitment" (in the contractual sense) or complex prior planning fail here.

  3.  **The Hierarchy Independence Condition (Non-Negotiable)**
      *   **Requirement:** Must account for joint action without a designated leader or explicit instruction.
      *   **Case:** *The Hunting Party.* Flushing game where each knows their role but no one issues orders.
      *   **Why:** Rules out purely hierarchical or command-based models of collective behavior.

  4.  **The Integrity/Continuity Condition (Non-Negotiable)**
      *   **Requirement:** Must determine if an action remains "joint" if one participant secretly intends to undermine it.
      *   **Case:** *The Table Carry.* One person privately intends to drop the table at the truck.
      *   **Why:** Tests whether jointness is a matter of *current* psychological state or *normative* binding. If it's joint only so long as the deception holds, the theory is fragile.

  #### B. Intensional Adequacy (The Structure of the 'We')
  *The theory must specify the mental or normative architecture connecting the agents.*

  5.  **The Content Alignment Constraint (Non-Negotiable)**
      *   **Requirement:** Must specify how much overlap in understanding is required for the action to count as joint.
      *   **Case:** *The Walk to Station.* One thinks it's a date, the other a job interview escort. They walk together successfully.
      *   **Why:** Tests the granularity of the "shared goal." Is the goal "walk to station" (shared) or "walk to station *as a date*" (not shared)? A theory must say where the jointness breaks.

  6.  **The Flexibility/Improvisation Constraint (Non-Negotiable)**
      *   **Requirement:** Must explain how agents adjust to each other in real-time without breaking the joint frame.
      *   **Case:** *The Jazz Duo.* Never played together, no score, yet they make a tune work.
      *   **Why:** Rules out rigid "plan-execution" models. The 'we' must be dynamic, not static.

  7.  **The Cognitive Load Constraint (Non-Negotiable)**
      *   **Requirement:** Must not require cognitive capacities (e.g., full Theory of Mind, recursive intentionality) that are absent in agents clearly capable of joint action.
      *   **Case:** *The Toddlers.* 14-month-olds pulling a lever together to get a toy.
      *   **Why:** Empirical consensus is that pre-verbal children coordinate intentionally before they pass false-belief tasks. A theory requiring "I intend that you intend that we J" is empirically falsified by this.

  #### C. Normative and Phenomenological Features
  *These are often where camps diverge.*

  8.  **The Normative Binding Constraint (Camp Commitment: Normativists)**
      *   **Requirement:** Participants must be entitled to rebuke each other for non-participation.
      *   **Case:** *The Table Carry (again).* If the deceiver drops the table, does the other have a right to complain, or just be surprised?
      *   **Status:** **Camp Commitment (Gilbert-style).** Psychological accounts (Searle/Bratman) often treat this as a byproduct, not a constituent.

  9.  **The Phenomenological Constraint (Camp Commitment: Phenomenologists)**
      *   **Requirement:** There must be a distinct "we-experience" or sense of agency.
      *   **Case:** *Flow states.* When the Jazz Duo is "in the zone," the boundary between self and other blurs.
      *   **Status:** **Camp Commitment.** Cognitivists often reject this as unnecessary folk psychology.

  10. **The Asymmetry Tolerance (Non-Negotiable)**
      *   **Requirement:** Must handle cases where contribution or understanding is unequal.
      *   **Case:** *Expert/Novice.* A master carpenter and an apprentice building a cabinet.
      *   **Why:** Joint action does not require equal contribution or identical knowledge of the plan.

  ---

  ### II. Incompatible Desiderata (The Tensions)

  There are pairs of requirements that are extremely difficult to satisfy simultaneously. A theory usually sacrifices one to save the other.

  **Tension 1: High-Fidelity Content vs. Mismatched Understanding**
  *   **Conflict:** If you require the *content* of the intention to be identical (Bratman), you fail *The Walk to Station* (Date vs. Interview). If you allow the content to diverge significantly to save that case, you risk failing *The Parallel Action Filter* (Protesters).
  *   **The Trade-off:** You must decide if jointness lies in the *description* of the action (thin content) or the *reasons* for the action (thick content).

  **Tension 2: Recursive Intentionality vs. Developmental Reality**
  *   **Conflict:** To distinguish joint action from parallel action philosophically, you want complex interlocking intentions ("I intend that we J because you intend..."). To satisfy *The Cognitive Load Constraint* (Toddlers), you cannot require this.
  *   **The Trade-off:** This is the biggest fault line in the literature. Either you accept that toddlers aren't truly acting jointly (counter-intuitive/empirically risky) or you accept that joint action doesn't require full recursive mindreading (which weakens the distinction from parallel action).

  **Tension 3: Normative Obligation vs. Spontaneity**
  *   **Conflict:** *The Car Lift* requires immediate action without agreement. *The Normative Binding Constraint* usually requires a commitment mechanism (like a promise or agreement) to generate obligations.
  *   **The Trade-off:** If you ground obligation in commitment, you lose spontaneity. If you ground it in psychology, the "ought" feels weaker.

  ---

  ### III. The Nature of the 'We'

  Your theory must explicitly choose one of the following architectures. You cannot have it both ways.

  1.  **Singularist/Reductive:** The 'we' is a heuristic. There are only 'I's with interlocking intentions and common knowledge. (Bratman).
  2.  **Primitive/Non-Reductive:** The 'we' is a sui generis psychological mode. "We-intend" is not analyzable into "I-intend." (Searle).
  3.  **Normative/Plural Subject:** The 'we' is a new entity created by joint commitment. Individuals become parts of a plural subject. (Gilbert).
  4.  **Ecological/Enactive:** The 'we' is a dynamic system emerging from sensorimotor coupling, not mental states. (Hutto, Gallagher).

  **What cannot count as joint:**
  Regardless of the architecture, a theory must exclude **Aggregate Action** (Protesters) and **Coerced Coordination** (Slave rowing a galley under threat of whip, unless the theory allows purely external binding).

  ---

  ### IV. The Knockout Requirement

  **The Single Requirement that Knocks Out the Most Standard Views:**
  **The Cognitive Load Constraint (specifically regarding Recursive Intentionality).**

  *   **Why:** This is the empirical hammer.
  *   **Bratman:** Heavily damaged. His account relies on interlocking intentions ("I intend that we J *because* you intend..."). This requires representing the other's mental state about the joint action. Developmental psychology suggests children coordinate jointly *before* they have the capacity for this level of recursive meta-representation.
  *   **Gilbert:** Damaged. Her "joint commitment" implies a level of conceptual sophistication regarding obligation and agreement that strangers lifting a car or toddlers pulling a lever do not possess.
  *   **Searle:** Partially spared, but vulnerable. By making "we-intention" primitive, he bypasses the recursion problem. *However*, he struggles to explain how this primitive mode arises in strangers (Car Lift) without prior social context, and he offers no account of the normative force (why should I care if you stop?).

  *Current Trend:* This constraint is why the field is moving toward **Enactive** or **Minimalist** accounts (e.g., Michael Tomasello's "Shared Intentionality" as a biological adaptation, or Kineological accounts) that rely on perception-action coupling rather than high-level belief attribution.

  ---

  ### V. Brief Scorecard: Searle, Bratman, Gilbert

  | Desideratum | **Searle (Primitive We-Intention)** | **Bratman (Interlocking I-Intentions)** | **Gilbert (Joint Commitment)** |
  | :--- | :--- | :--- | :--- |
  | **Parallel Filter** | **Weak.** Struggles to distinguish "We intend" from "I intend + You intend" without circularity. | **Strong.** The interlocking structure filters out parallel protesters well. | **Strong.** Commitment distinguishes it from coincidence. |
  | **Spontaneity** | **Strong.** Primitive mode can arise instantly. | **Weak.** Requires time to establish interlocking intentions/common knowledge. | **Weak.** Requires a process of commitment (even if tacit). |
  | **Cognitive Load** | **Moderate.** Avoids recursion, but posits a mysterious psychological capacity. | **Fail.** Too cognitively demanding for toddlers/animals. | **Fail.** Too conceptual/normative for spontaneous cases. |
  | **Normativity** | **Weak.** No inherent obligation to rebuke; purely psychological. | **Weak.** Normativity is derived from consistency, not obligation. | **Strong.** Best account of rebuke/entitlement. |
  | **Mismatched Content**| **Moderate.** Depends on the level of description of the "We." | **Weak.** Requires meshing sub-plans; Date/Interview case is problematic. | **Strong.** Commitment binds even if understandings differ slightly. |
  | **The 'We' Ontology** | Psychological Primitive. | Fiction/Heuristic (Singularist). | Plural Subject (New Entity). |

  **Summary Verdict:**
  *   **Bratman** wins on **precision** and distinguishing joint from parallel, but loses on **empirical reality** (toddlers/spontaneity).
  *   **Gilbert** wins on **normativity** (obligation), but loses on **psychological plausibility** (spontaneity/cognitive load).
  *   **Searle** wins on **phenomenology** and **spontaneity**, but loses on **explanatory power** (it's a black box) and **normativity**.

  **The Gap:** No current standard view fully satisfies the **Cognitive Load Constraint** while maintaining the **Parallel Action Filter** and the **Normative Binding Constraint**. You generally have to pick two. Most contemporary work sacrifices the Normative Binding Constraint to save the Cognitive Load Constraint (moving toward naturalized/enactive accounts).
