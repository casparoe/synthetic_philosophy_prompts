      *   *Non-Negotiable:* Things any theory *must* explain to count as a theory of *joint* action (e.g., distinguishing it from parallel action).
      *   *Camp Commitments:* Things specific to normative vs. psychological approaches.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Distinction 1: Joint vs. Parallel.* The protest case. Two people going to the same place isn't joint. The theory needs a filter. (Non-negotiable).
      *   *Distinction 2: Joint vs. Coerced/Deceptive.* The table carrying case. One intends to quit. Is it joint *now*? (Non-negotiable).
      *   *Distinction 3: Understanding Mismatch.* The date vs. interview walk. Can it be joint if the *meaning* differs? (Tension point).
      *   *Distinction 4: Spontaneity.* The car lifting case. No prior agreement. Theories relying on prior agreement fail here. (Non-negotiable).
      *   *Distinction 5: Hierarchy/Instruction.* The hunting party. No leader. Theories requiring explicit negotiation fail. (Non-negotiable).
      *   *Distinction 6: Cognitive Load.* The kids/jazz case. High-level recursive mindreading is too heavy for toddlers or improvisers. (Empirical constraint).
      *   *Distinction 7: Normativity.* Gilbert's angle. Obligation to rebuke. Is this essential? (Camp Commitment).
      *   *Distinction 8: The 'We'.* What constitutes the subject? (Core theoretical question).

  4.  **Identifying the "Killer" Constraint:**
      *   Searle requires primitive "we-intentions" (psychological).
      *   Bratman requires interlocking intentions + common knowledge (cognitive load).
      *   Gilbert requires joint commitment (normative).
      *   *The Killer:* The **Developmental/Spontaneity Constraint** (Toddlers/Car Lift).
      *   *Why?* Bratman's interlocking intentions require Theory of Mind (ToM) capabilities toddlers don't have. Searle's primitive we-intention is arguably too magical or fails to explain the *normative* pull. Gilbert's explicit commitment is too intellectualized for spontaneous car lifting.
      *   *Actually, the strongest tension is between Cognitive Sophistication (Bratman) and Developmental Reality (Toddlers).* But the prompt asks for a *single requirement* that knocks out the most.
      *   *Candidate:* **The Spontaneity + Low-Cognitive-Load Requirement.** This hits Bratman (too complex), Gilbert (too normative/explicit), and potentially Searle (if 'we-intention' implies conceptual capacity).
      *   *Refinement:* Let's look at the "Mismatched Understanding" case (Date vs. Interview). If the content of the intention differs, is it joint? Bratman says content must mesh. Gilbert says commitment binds. Searle says psychological mode matters.
      *   *Decision:* The **Developmental/Pre-Reflective Constraint** is the hardest empirical hurdle. It knocks out strong cognitivist views (Bratman) and strong normative views (Gilbert) unless heavily modified.

  5.  **Addressing Incompatible Desiderata:**
      *   *Tension 1:* High-Fidelity Shared Content vs. Mismatched Understanding. (Date/Interview). If they think different things, is the content shared?
      *   *Tension 2:* Normative Obligation vs. Developmental Simplicity. Todlers coordinate but don't seem to feel *obligated* to rebuke.
      *   *Tension 3:* Recursive Mindreading vs. Cognitive Parsimony. Bratman requires "I intend that we J because you intend..." Toddlers can't do this.

  6.  **Scoring the Big Three:**
      *   *Searle:* Good on spontaneity, bad on normativity and distinctness from parallel action (the "protest" problem).
      *   *Bratman:* Good on distinctness, bad on cognitive load (toddlers) and spontaneity (car lift).
      *   *Gilbert:* Good on normativity, bad on cognitive load and spontaneity (requires agreement/commitment).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration with "example waving."
