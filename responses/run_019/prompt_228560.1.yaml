          *   So the Second Law is *saved*, not violated. The process is reversible overall, but you cannot *repeat* it indefinitely without resetting the tape.
          *   The violation claim rests on the idea that this can continue forever without cost. But the "fuel" is the negentropy of the blank tape. Once the tape is full of random data, the engine stops.
