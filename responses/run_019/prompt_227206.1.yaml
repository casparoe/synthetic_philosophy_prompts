  ### Mapping the Logical Space

  Before traversing the decision tree, we map the logical combinations of answers to the diagnostic questions. The tree below forces a choice at every junction, but not every theoretical combination is occupied by a stable philosophical position.

  *   **Unoccupied Region 1:** *Machian Relationism + Concavity in Empty Universe.* This combination is logically incoherent. If inertia is wholly constituted by relations to actual matter (Mach), and no matter exists (Empty Universe), there can be no inertial effects.
  *   **Unoccupied Region 2:** *Traditional Substantivalism + Denial of the Shift Argument.* This position is technically unstable. If space consists of identifiable points (Substantivalism), shifting matter to new points must create a distinct world unless one adopts a "sophisticated" equivalence class view, which abandons the traditional label.
  *   **Unoccupied Region 3:** *Point-free Structuralism + Manifold Point Identity.* This is incoherent by definition. If individual points have physical identity, the view collapses into substantivalism.
  *   **Underexplored Region:** *Dynamicalism + Fixed Background Geometry.* It is rare to claim inertial structure is merely a codification of laws (Dynamicalism) while simultaneously insisting those laws could not have varied across possible worlds. This region is usually absorbed by Modal Relationism or Necessitarianism.

  ### The Decision Tree

  **Start:** Observe that the water's surface becomes concave even when the water is not rotating relative to the bucket.

  **Node 1:** In a universe containing *only* the bucket and water, would the water's surface still become concave if the bucket were spun? (Diagnostic Case 1)
  *   **No:** Inertia depends on the presence of other matter. (Go to Node 2)
  *   **Yes:** Inertia exists independently of the current material content. (Go to Node 6)

  **Node 2:** If the bucket is stationary but a massive shell containing all other matter rotates around it, does the water become concave? (Diagnostic Case 2)
  *   **Yes:** Inertial effects are generated by the motion of distant matter. (Go to Leaf A)
  *   **No:** Inertial effects are not generated by the actual motion of distant matter. (Go to Node 3)

  **Node 3:** Consider two worlds with identical distances between all particles. In one, the particles accelerate; in the other, they do not. Are these distinct physical possibilities? (Diagnostic Case 3)
  *   **Yes:** There are facts about acceleration beyond actual material relations. (Go to Node 4)
  *   **No:** Acceleration is nothing over and above changing relations between actual bodies. (Go to Leaf B)

  **Node 4:** If all matter were removed, would there still be a fact determining which trajectories *would have been* inertial? (Diagnostic Case 6)
  *   **Yes:** Inertial structure exists as a modal fact about possible matter. (Go to Leaf C)
  *   **No:** Inertial structure is not a fact independent of actual matter. (Go to Node 5)

  **Node 5:** Is the choice of which frame counts as "non-rotating" merely a matter of linguistic or calculational convenience? (Diagnostic Case 6)
  *   **Yes:** There is no physical fact of the matter regarding absolute rotation. (Go to Leaf D)
  *   **No:** (Return to Node 4; this path suggests an inconsistency in the relationist framework).

  **Node 6:** If we built a sealed box containing an inertial compass, could it register rotation without observing external objects? (Diagnostic Case 5)
  *   **No:** (This contradicts the "Yes" at Node 1 in a Newtonian setting; assume **Yes**).
  *   **Yes:** Absolute rotation is locally detectable. (Go to Node 7)

  **Node 7:** Does the explanation require the water to be rotating relative to specific, identifiable locations in a background manifold? (Diagnostic Case 4)
  *   **Yes:** Space is composed of individual points that matter occupies. (Go to Node 8)
  *   **No:** Space is a structure or set of relations, not a collection of points. (Go to Node 10)

  **Node 8:** If we shifted the entire material content of the universe 5 meters to the left, would the physical world be different? (Diagnostic Case 4)
  *   **Yes:** Locations have intrinsic identity independent of matter. (Go to Leaf E)
  *   **No:** Locations are only identifiable via the matter occupying them. (Go to Node 9)

  **Node 9:** If we permute the manifold points in a region where no matter is present, does the physical state change? (Diagnostic Case 4)
  *   **Yes:** Manifold points exist independently of fields or matter. (Return to Leaf E; this reveals the position is Traditional).
  *   **No:** The physical world is an equivalence class of manifold-matter mappings. (Go to Leaf F)

  **Node 10:** Is the inertial structure (e.g., straight lines, affine connection) a physical entity existing over and above the laws governing matter? (Diagnostic Case 6)
  *   **Yes:** Geometry is a real physical object distinct from dynamics. (Go to Node 11)
  *   **No:** Geometry is merely a codification of the behavior of matter and laws. (Go to Leaf G)

  **Node 11:** Do the individual points of the manifold underlying this structure have independent physical identity? (Diagnostic Case 4)
  *   **Yes:** (Contradicts Node 7 "No"; return to Node 7).
  *   **No:** The structure is real, but the points constituting it are not ontologically prior. (Go to Leaf H)

  **Node 12:** Could the laws of motion have been different while the material distribution remained the same? (Diagnostic Case 6)
  *   **Yes:** Laws are contingent; geometry encodes them. (Confirm Leaf G).
  *   **No:** Laws are necessary; geometry is fixed by logic. (Merge with Leaf C).

  *(Note: In General Relativity, Node 1 becomes ambiguous because the metric field is both a physical object and the definition of inertia. This tends to collapse the distinction between Leaf G [Dynamicalism] and Leaf H [Structuralism], as the metric is a dynamic field rather than a fixed background.)*

  ---

  ### Classification Leaves

  **Leaf A: Machian Relationism**
  *   **Characterization:** Inertial forces are caused by the gravitational interaction with the bulk distribution of matter in the universe. Absolute space is eliminated in favor of relations between actual material bodies.
  *   **Awkward Commitment:** It requires instantaneous action-at-a-distance to explain how rotating distant stars immediately affect local water, conflicting with relativistic causality.

  **Leaf B: Strict Relationism (Unstable)**
  *   **Characterization:** Motion is defined strictly by changing distances between actual bodies; there are no inertial facts beyond these changes.
  *   **Awkward Commitment:** It cannot account for the rotating bucket in a universe with only two bodies, as there is no third reference to define rotation, rendering the concavity inexplicable.

  **Leaf C: Modal (Leibnizian) Relationism**
  *   **Characterization:** Inertia is determined by relations to possible matter, not just actual matter, preserving a form of relationism without requiring a material plenum.
  *   **Awkward Commitment:** It commits to the physical reality of non-existent objects (possible matter) to ground facts about the actual world.

  **Leaf D: Conventionalism (Deflationary)**
  *   **Characterization:** The distinction between rotating and non-rotating frames is a matter of descriptive convenience rather than physical fact.
  *   **Awkward Commitment:** It must treat the tension in the water's surface as a linguistic artifact rather than a dynamical effect requiring a physical cause.

  **Leaf E: Traditional Manifold Substantivalism**
  *   **Characterization:** Space is a substance composed of individual points that exist independently of matter and confer identity to locations.
  *   **Awkward Commitment:** It implies radical indeterminism (via the Hole Argument), where shifting points in a vacuum creates a distinct physical world without observational difference.

  **Leaf F: Sophisticated Substantivalism**
  *   **Characterization:** Spacetime is a real substance, but physical reality is invariant under permutations of manifold points (Leibniz equivalence).
  *   **Awkward Commitment:** It posits the existence of a manifold of points while simultaneously denying that these points have any physical identity or haecceity.

  **Leaf G: Dynamicalism**
  *   **Characterization:** Inertial geometry is not a physical background but a codification of the symmetries and constraints of the laws of motion themselves.
  *   **Awkward Commitment:** It struggles to explain why the geometry is so rigid and universal if it is merely a summary of contingent material behaviors.

  **Leaf H: Point-free Inertial Structuralism**
  *   **Characterization:** Affine or inertial structure is physically real and objective, but the manifold points serving as the "substrate" are not ontologically fundamental.
  *   **Awkward Commitment:** It requires a mathematics of structure that does not rely on set-theoretic points, which is technically demanding and less intuitive than standard manifold theory.

  ---

  ### Observational Indistinguishability Flags

  **Sophisticated Substantivalism (Leaf F) vs. Point-free Structuralism (Leaf H):**
  The bucket experiment alone cannot distinguish these positions. Both agree that the water climbs the walls due to rotation relative to a real inertial structure, and both deny that shifting the entire universe creates a new world. The difference is purely ontological: whether the structure *supervenes* on a manifold of points (which lack identity) or exists *without* such points.

  **Machian Relationism (Leaf A) vs. Modal Relationism (Leaf C):**
  In our actual universe, these make nearly identical predictions regarding the rotating shell (Case 2). They only diverge in the counterfactual Empty Universe (Case 1). Since we cannot create an empty universe, the bucket experiment in our world cannot empirically decide between inertia caused by *actual* stars (Mach) versus *possible* stars (Modal).

  **Dynamicalism (Leaf G) vs. Structuralism (Leaf H):**
  Observationally, these are identical in a Newtonian setting. Both predict the same concave water surface. The distinction lies in whether one views the geometric objects (like the connection) as "physical fields" (Structuralism) or "mathematical representations of laws" (Dynamicalism). General Relativity tends to favor Structuralism, as the metric becomes a dynamic field interacting with matter, blurring the line between "law" and "object."
