answer: |-
  **Bottom Line:** The package does not hang together. Points (2) and (3) are formally incompatible: you cannot maintain a single Archimedean utility scale while asserting lexical priorities.

  **Audit of Tensions**

  **1. Common Currency (3) vs. Lexical Threshold (2) [Severity: Critical]**
  This is a formal contradiction. A "common currency" measured on a single welfare scale implies the **Archimedean property**: for any two amounts of value $A$ and $B$, there exists some quantity of $A$ that outweighs $B$. Your lexical threshold explicitly denies this for severe suffering. If one instance of peak agony outweighs *any* amount of happiness, they are not measurements on the same real-valued scale. You are attempting to combine a weighted sum model (3) with a lexicographic ordering (2).

  *   **Cheapest Fix:** Abandon the claim that pain and pleasure are the *same kind* of quantity. Adopt a **vector view** of welfare (e.g., $\langle Suffering, Happiness \rangle$) where suffering takes precedence until a threshold is met, after which trade-offs occur. This preserves the intuition of (2) without falsely claiming a single scalar currency.

  **2. No Ad Hoc Discontinuities (4) vs. Lexical Threshold (2) + Vagueness (5) [Severity: High]**
  You request an error theory for discontinuities (4) but posit a vague lexical threshold (5). A lexical break is a discontinuity in the marginal rate of substitution. If the threshold is vague (Sorites-prone), the utility function is undefined at the boundary, violating the "well-defined EV reasoning" claimed in (3). Without a principled distinction, the threshold looks like the gerrymandering (4) warns against.

  *   **Cheapest Fix:** Ground the discontinuity in a **qualitative change** rather than a quantitative one. For example, define the threshold as suffering that destroys the capacity for agency or coherent experience ("phenomenal collapse"). This provides the error theory required by (4): the discontinuity exists because the *subject* of the value is fundamentally altered, not because you drew an arbitrary line on a continuum.

  **3. EV Reasoning (3) vs. Vague Threshold (5) [Severity: Medium]**
  You endorse "shut-up-and-multiply" (3) but admit the threshold is vague (5). In expected value calculations, if there is a non-zero probability that an action crosses a lexical threshold, the expected utility becomes unstable or undefined (lexical values dominate any finite probability). Vagueness makes calculating that probability impossible, undermining the precision EV requires.

  *   **Cheapest Fix:** Treat the vagueness as **epistemic** rather than ontic. The threshold is sharp in reality, but you are uncertain where it lies. This allows you to assign probabilities to crossing the threshold and run EV calculations on the *risk* of lexical violation, preserving formal decision theory.

  **Recommendation**

  **Single Revision:** Drop **Point (3) (Common Currency)**.

  Retaining a single scalar scale is the root cause of the inconsistency. Formal axiology dictates that if you want lexical priorities (2), you must abandon the Archimedean property inherent in a single common currency. By moving to a **lexical utility function** (or a multi-dimensional vector space), you resolve the conflict between (2) and (3) immediately.

  This revision also alleviates pressure on (4). Discontinuities are features of lexical orderings, not bugs, provided they track qualitative distinctions (as suggested in the fix for Tension 2). It forces you to refine (5): instead of a vague line on a scale, you are identifying a phase change in the nature of experience.

  **Summary**
  Your intuitions (1, 2, 5) describe a **lexical negative prioritarian** view. Your formalism (3) describes a **classical utilitarian** view. These frameworks are mathematically distinct. To make the package coherent, you must update the formalism to match the intuitions. Accept that welfare is not a single scalar quantity; once you do, the lexical threshold becomes a structural feature rather than a paradoxical exception, and your error theory can focus on justifying the qualitative break rather than defending a impossible mathematical hybrid.
