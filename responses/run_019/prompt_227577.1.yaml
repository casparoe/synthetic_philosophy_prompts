answer: |-
  In a third-generation family hardware store, a longstanding policy requires the manager to physically initial every cash refund over $50. The current owner, the founder's grandson, knows perfectly well that this rule was originally instituted sixty years ago to prevent employee theft, but he argues that modern POS software tracks discrepancies far more effectively than handwritten initials ever did. Satisfied that he understands the original anti-fraud rationale and deems it obsolete, he abolishes the initialing requirement to speed up customer service. However, unbeknownst to him, the ritual of walking to the manager's desk for an initial had organically become the only moment in the day when floor staff verbally flagged low-stock items to leadership; without this forced interruption, inventory blind spots accumulate silently until critical supply chains break.

  The standard principle licenses the removal because the reformer has satisfied the specific condition of knowing the original intent (fraud prevention) and has judged it superseded by technology. The removal is nonetheless a mistake because the rule developed an **emergent systemic dependency**—a secondary function (staff-manager communication) that arose from habit rather than design. A defender of the original principle would likely resist by arguing that the reformer didn't truly know "why the fence was there," insisting that the current function is part of the "why." This resistance amounts to smuggling the refinement back in under another name: it redefines "why it was put up" (a historical question about intent) as "what function it currently serves" (a systemic question about utility), thereby abandoning the original principle's focus on historical ignorance in favor of a demand for complete systemic knowledge.
