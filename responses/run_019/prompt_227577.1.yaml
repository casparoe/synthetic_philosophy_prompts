      *   *Why Removal is a Mistake:* The rule acquired a second function (inventory communication) via emergent behavior over time.
      *   *Single Feature:* *Functional Drift* or *Emergent Secondary Utility*. The system evolved a new dependency unrelated to the design intent.
      *   *Resistance:* A defender might say "You didn't know the *full* reason." They might argue the "reason" includes all current functions, not just original intent.
      *   *Smuggling:* Yes, this redefines "why it was put up" to mean "what function it currently serves," which abandons the historical focus of the original principle.

