      *   *Let's try the "ecosystem" angle.* A hedge between two properties.
      *   *Original Purpose:* Privacy from the road.
      *   *Reformer:* Wants more light. Knows it was for privacy.
      *   *New Function:* It now holds back a slow soil slip that developed over decades.
      *   *Critique:* Too geological.
      *   *Let's try a social norm.* A weekly Sunday dinner at a specific time.
      *   *Original Purpose:* Grandmother wanted everyone together before she got too tired.
      *   *Reformer:* Grandmother is gone. Kids know this. Want to change time.
      *   *New Function:* The specific time aligns with a bus schedule for a non-family member who relies on the leftovers/ride. Or, it coordinates with the neighbor's quiet hours to avoid noise complaints.
      *   *Let's go with the Family Business Invoice idea.* It's clean.
