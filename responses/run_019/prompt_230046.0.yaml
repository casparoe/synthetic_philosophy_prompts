answer: |-
  You have stumbled directly into one of the most famous, debated, and technically difficult problems in the philosophy of science. Your intuition is correct: there is a distinction there, but articulating it rigorously has kept philosophers busy for decades.

  Here are the names for the puzzle and the distinction, followed by an analysis of where the line is drawn and whether it holds up.

  ### 1. The General Puzzle: "The Problem of Old Evidence"

  The specific logical puzzle you described—how can known facts confirm a new theory if we already knew the facts?—is formally known as **The Problem of Old Evidence**.

  It was named and formalized by the philosopher Clark Glymour in 1980, though it dates back to discussions about Bayesian confirmation theory.

  **The Logic Trap:**
  In standard Bayesian reasoning, evidence ($E$) confirms a hypothesis ($H$) only if learning $E$ increases the probability of $H$. But if $E$ is "old evidence" (like Mercury's orbit), we already assign it a probability of 100% ($P(E) = 1$). Mathematically, if you already know $E$ is true, learning that $H$ explains $E$ cannot logically increase your confidence in $H$.

  Yet, historically, Einstein's ability to explain Mercury's orbit *did* increase confidence in General Relativity. This creates a paradox: our mathematical models of confirmation say it shouldn't count, but our scientific intuition says it counts a lot.

  ### 2. The Distinction: "Accommodation vs. Prediction" (or "Use Novelty")

  The distinction you are feeling between your Case A (Relativity/Mercury) and Case B (Reverse-engineering) is most commonly called **Accommodation vs. Prediction**.

  However, because your Case A involves *old* facts, philosophers refine this further into **Temporal Novelty vs. Use Novelty**.

  *   **Temporal Novelty:** The theory predicts a fact *discovered after* the theory was made. (Easy to understand, but doesn't cover the Mercury case).
  *   **Use Novelty:** The fact was known, but it was **not used** in the construction of the theory. (This covers the Mercury case).

  In your **Case A**, the theory possesses **Use Novelty**. The fact was "held in reserve."
  In your **Case B**, the theory is **Accommodating** the data. The fact was "used up" during construction.

  ### 3. Where is the Line? (Why Case A is valuable and Case B is cheap)

  You asked for the principled difference. Why does it matter if the data was used to build the theory? There are three main arguments for why the line matters, drawn from philosophy, statistics, and logic.

  #### A. Degrees of Freedom (The Overfitting Argument)
  This is the strongest argument, and it comes from statistics and machine learning.
  *   **Case B (Cheap):** If you build a model specifically to fit a pile of facts, you can almost always do it if you have enough "knobs to turn" (parameters). You can draw a squiggly line through any set of dots. This is called **overfitting**. The theory fits the noise, not the signal. It has high *flexibility* but low *truth-value*.
  *   **Case A (Valuable):** General Relativity was derived from principles about gravity, space, and time. It had very few "knobs." It was a rigid structure. When you drop a rigid structure onto the data and it fits, it is highly improbable that it fit by accident. The theory *risked* being wrong.

  #### B. Independent Testability (The Ad Hoc Argument)
  Philosopher Karl Popper focused on this.
  *   **Case B:** If you tweak a theory just to save a specific fact, that tweak is often **ad hoc**. It explains *only* that fact and nothing else. (Example: "Planets move in circles, except Mercury, which moves in a loopy-spiral because... well, just because.")
  *   **Case A:** The "tweak" or the mechanism that explains the old fact usually has other consequences. General Relativity didn't just fix Mercury; it also predicted light bending around the sun and gravitational time dilation. The explanation for the old fact is **unified** with explanations for other phenomena. This is called **Consilience** (a term coined by William Whewell).

  #### C. The Counterfactual Test
  To tell the difference, philosophers suggest asking a counterfactual question:
  *   *"If the data had been slightly different, would the theory have been different?"*
  *   **Case B:** Yes. If Mercury's orbit were off by a different amount, the reverse-engineered theory would have different numbers. The data *caused* the theory.
  *   **Case A:** No. Einstein would have published the same equations regardless of Mercury. The theory *constrained* the data.

  ### 4. Is the Line Sharp?

  You asked if the distinction holds up or if it slips away. The honest answer is: **It is porous.**

  There is a spectrum between "Pure Prediction" and "Pure Accommodation."

  **The "Neptune" Problem:**
  In the 19th century, Uranus's orbit was off (an old anomaly). Scientists didn't throw out Newton; they tweaked the *initial conditions* (postulating a new planet, Neptune) to make Newton fit.
  *   Is this Case A or Case B?
  *   It looks like Case B (fixing Newton to fit Uranus).
  *   But it turned out to be Case A (because the existence of Neptune was independently testable).

  This shows that "fitting known facts" isn't always cheap. It is only cheap if the adjustment is **isolated** and **untestable**. If the adjustment opens up new avenues of testing (like looking for Neptune), it retains scientific value.

  **The "Research Program" View:**
  Philosopher Imre Lakatos argued that you can't judge a single theory in isolation. You have to look at the **Research Program**.
  *   **Progressive Program:** The theory accommodates old facts *and* predicts new ones. (Keep it).
  *   **Degenerating Program:** The theory constantly adds "patches" to accommodate old facts but never predicts anything new. (Discard it).

  So, the distinction isn't always about a single moment of discovery; it's about the trajectory of the theory over time.

  ### Summary

  1.  **The Puzzle:** **The Problem of Old Evidence.** (How can known facts confirm new theories?)
  2.  **The Distinction:** **Accommodation vs. Prediction**, specifically **Use Novelty**. (Was the data *used* to build the theory?)
  3.  **The Principled Difference:**
      *   **Risk:** Case A risked falsification; Case B guaranteed success.
      *   **Flexibility:** Case B likely has too many degrees of freedom (overfitting); Case A is rigid.
      *   **Unification:** Case A usually explains other things too (Consilience); Case B is often isolated (Ad Hoc).
  4.  **Is it Sharp?** No. It is a spectrum. The key is **independent testability**. If the explanation for the old fact allows you to make *new* tests, it is valuable. If it only explains the past, it is suspect.

  Your intuition is spot on. The difference isn't about *time* (when the fact was found); it's about *dependency* (whether the theory was bent to fit the fact, or the fact bent to fit the theory).
