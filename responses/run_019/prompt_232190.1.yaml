answer: |-
  You are asking for a functional specification rather than a metaphysical one, which is the right move if your goal is to decide whether to step into the machine. You want to know what jobs a theory of survival needs to perform to be useful to you as an agent making decisions. The first and most non-negotiable requirement is that the theory must align with your intuitions about ordinary survival and ordinary death. If a theory tells you that you die every time you fall asleep or that you survive the total destruction of your brain without any transfer of information, it is useless for practical planning. It has to deliver the verdict that you are the same person tomorrow as you are today under normal biological continuity, and it has to deliver the verdict that you do not survive being vaporized with no backup. These are the fixed points. If a theory gets these wrong, it fails because it disconnects from the very concept of survival that guides your daily fears and hopes. You are not looking for a theory that revolutionizes your understanding of Tuesday morning; you are looking for one that clarifies the edge cases without breaking the center.

  The second requirement concerns the standard teletransporter case where you are destroyed on Earth and rebuilt on Mars from new matter. Here, a theory is allowed to give a verdict that differs from common intuition, but it must give a verdict. It cannot simply say the question is meaningless if you are trying to decide whether to feel fear. If the theory says you survive, it must explain why the destruction of the original body does not matter. If it says you die, it must explain why the person on Mars is not you in the sense that matters for anticipation. This is a test case, not necessarily a fixed point like ordinary survival, but the theory must be decisive. You need to know if the machine is a vehicle or a suicide booth. The requirement here is explanatory power regarding the transfer of psychological states. If the theory says psychological continuity is what matters, it should say you survive. If it says physical continuity is what matters, it should say you die. What it cannot do is waffle, because your fear depends on a binary outcome regarding whether your future experiences will be yours.

  The third requirement deals with the branching case, where the machine malfunctions and the original you survives on Earth while a copy is created on Mars. This is where things get difficult. A theory must respect the logic of identity insofar as you cannot be strictly identical to two different people at once. However, since you care about what matters in survival rather than strict identity, the theory needs to explain how your rational concern divides. If psychological continuity is what matters, you should care about both successors equally. But this creates a tension with the way we anticipate the future. We usually anticipate being one person in one place. A theory needs to explain whether you should anticipate being the Earth person, the Mars person, both, or neither. This is a case where a theory is allowed to treat the verdict as a puzzle rather than a fixed intuition, because our intuitions here are conflicted. However, the theory must explain why the existence of the second person does not negate the survival of the first, or vice versa. It cannot say that because there are two, neither is you, if both have equal claim to your psychology.

  The fourth requirement is about the accidental duplicate. Imagine a molecule-for-molecule copy of you forms on Mars by cosmic coincidence, with no causal link to your current state. You have every reason to believe this person will live a life just like yours would have. The theory must explain why you should not care about this person's future in the same way you care about your own, or why this person is not you. This is non-negotiable. If a theory says that mere similarity is enough for what matters in survival, then you should be indifferent between stepping into the teletransporter and waiting for a random copy to appear in the universe. But you are not indifferent. You care about the causal connection. Therefore, an adequate theory must include a causal requirement. Psychological continuity alone is not enough; it must be continuity caused in the right way. This distinguishes survival from mere replication. If the theory collapses this distinction, it fails to capture why you care about your future specifically rather than just the future of someone like you.

  The fifth requirement covers amnesia and gradual replacement. If you lose all your episodic memories but keep your habits, skills, and commitments, the theory should generally say you survive. This is a strong intuition. We do not treat amnesiacs as dead strangers; we hold them to their promises and care for their well-being. Similarly, if your brain cells are replaced gradually over years, you survive. The theory must allow for some degree of psychological discontinuity or physical change without declaring death. This is largely non-negotiable because if the theory requires perfect memory or original matter for survival, it implies you die far too often in ordinary life. However, there is some room for taste here regarding how much change is too much. A theory can draw a line somewhere, but it must draw it far enough out to include standard medical cases of memory loss or cellular turnover.

  Now we need to look at the distinctions the theory must maintain. It cannot collapse strict identity with what you rationally care about. There may be cases where identity holds but what matters is gone, or vice versa. For your purposes, what matters is the priority. However, the theory must also distinguish between surviving and having a duplicate. As mentioned in the accidental copy case, having someone exactly like you exist is not the same as you surviving. The theory must articulate the difference, usually through the causal link. It must also distinguish between connectedness, continuity, and mere similarity. Connectedness is the sharing of psychological states like memories and intentions. Continuity is the overlapping chain of connectedness over time. Similarity is just looking or acting the same. The theory must say that continuity backed by causation is what matters, not similarity. If it treats similarity as sufficient, it fails the accidental duplicate test. If it treats connectedness as sufficient without continuity, it might allow you to survive jumping directly into a future state without a path, which seems wrong.

  There are pairs of desiderata here that I suspect cannot be jointly satisfied, and this is the most important part for you to consider. The first tension is between the requirement that what matters must guide rational anticipation and the requirement that what matters can be one-to-many in the branching case. If what matters is psychological continuity, then in the branching case you survive as both people. But rational anticipation seems to be one-to-one. You cannot anticipate experiencing two different streams of consciousness simultaneously. If the theory says you survive as both, it must explain what you should anticipate. If you say you should anticipate being both, that seems incoherent. If you say you should anticipate being neither, that contradicts the claim that psychological continuity is what matters. So you have a conflict between the intuition that psychological continuity is sufficient for survival and the intuition that survival involves a unique future perspective. You might have to give up the idea that survival always grounds a unique anticipation.

  The second tension is between the causal requirement and the psychological continuity requirement. If psychological continuity is what matters, why does the cause matter? In the accidental duplicate case, the psychology is identical. The internal experience of the duplicate would be indistinguishable from a teletransported you. If what matters is the psychological connection, the lack of a causal chain should not matter to the duplicate's status as a survivor. But intuitively, it does matter to you. You care that your future states are caused by your current states. This suggests that what matters is not just the psychological content but the process. A theory struggles to explain why the process matters if the outcome is identical. It risks becoming a fetishization of history over present state. You might have to accept that what matters is not just the psychological overlap but the specific physical or causal history, which brings us back closer to a physicalist view of identity, which might then fail the teletransporter case where matter is replaced.

  Regarding which requirements are non-negotiable versus taste, the ordinary survival and death cases are non-negotiable. If a theory fails there, it is broken. The causal requirement is also non-negotiable because without it, you cannot distinguish yourself from a random twin. The teletransporter verdict is a matter of taste or philosophical camp; you can accept a theory that says you die there as long as it explains why the Mars person is not you in the sense that matters. The branching case is also a place where theories can diverge, but they must handle the logic consistently. The amnesia case is mostly non-negotiable in favor of survival, but the degree of memory loss allowed is a matter of degree.

  At the end, you asked what would change my mind about this list. The thing that would make me demote a requirement is a compelling argument that anticipation itself is an incoherent concept in these edge cases. If it can be shown that the feeling of anticipating a future self is just a heuristic evolved for ordinary biology and has no purchase in cases of fission or teleportation, then the requirement that the theory must tell me what to anticipate would be misplaced. I would have to accept that the question what should I fear has no answer in those cases, not because the theory is weak, but because the question presupposes a unity of self that does not exist there. Another argument that would change my mind is if it could be demonstrated that the causal requirement is arbitrary. If someone can show that from the perspective of the future person, the lack of causal history makes no difference to their experience or claims, then insisting on causation might be a form of selfishness rather than rationality. I might have to accept that the accidental duplicate is someone I should care about just as much as a teletransported successor, which would radically change the desiderata regarding similarity versus causation.

  The place where my reasoning is most likely to fail is in assuming that my current intuitions about ordinary survival are reliable data. I am treating ordinary survival as a fixed point, but it is possible that my sense of continuing as the same person from day to day is an illusion generated by memory and habit. If ordinary survival is actually a series of deaths and replacements just like the teletransporter, then using ordinary survival as a benchmark to judge the teletransporter case is circular. I might be demanding that the theory preserve an illusion rather than reveal the truth. If that is the case, then the requirement to align with ordinary intuitions is a bug, not a feature. I would need a theory that tells me the truth about survival even if it implies I die every night, provided that truth offers a better way to live than the illusion. So the weakest link in this list is the demand that the theory must validate my everyday sense of continuity. If that sense is wrong, the whole list of desiderata collapses into a request for comforting fiction rather than practical guidance.
