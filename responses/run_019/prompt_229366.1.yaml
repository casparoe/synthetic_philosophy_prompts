answer: |-
  In this opening passage, Montaigne establishes a hierarchy of judgment that privileges rational observation over cultural habit. To determine which reading fits best, we must examine the specific work done by the key terms.

  **"Barbarian"** functions here not as an objective description of savagery, but as a label of exclusion. The text notes that Greeks called *all* other nations "barbarians." Thus, the term represents a linguistic habit rather than a moral truth. Pyrrhus overrides this label by observing the "order" of the Roman army. This implies that "barbarism" is a real quality (disorder, irrationality) that can be absent even in those labeled as such.

  **"Vulgar opinion"** (or "common report") represents the uncritical acceptance of these labels. It is the epistemic error of trusting cultural bias over direct evidence. Montaigne argues we must be "cautious" of this, implying it is a barrier to truth.

  **"The eye of reason"** is posited as the corrective to vulgar opinion. Crucially, Montaigne does not say "judge by the eye of *another* custom." He contrasts reason *against* common report. This suggests reason is a faculty capable of transcending local custom to perceive universal qualities (like military "order").

  **Comparing the Readings**
  The **code-relativist** reading struggles with this hierarchy. If morality is only relative to societal norms, then "reason" is merely the observer's own customs dressed up. Under this view, Pyrrhus's judgment would just be "Greek custom prefers order," carrying no more weight than the initial label of "barbarian." Relativism cannot explain why Montaigne explicitly instructs us to prefer reason *over* opinion; if reason is just another code, the instruction is arbitrary.

  The **custom-skeptic** reading aligns with the text's structure. It acknowledges that initial labels ("barbarian") and reactions (revulsion) are products of custom and ignorance. However, it maintains that reason is a universal faculty capable of evaluating practices once the veil of custom is lifted. This explains why Pyrrhus can recognize virtue in an enemy: reason sees the "order" that custom obscures. It preserves the possibility of cross-cultural judgment, which is essential to Montaigne's broader project of critiquing European cruelty by comparing it to indigenous practices.

  **Application to the Cannibalism Case**
  This distinction determines how we handle the two scenarios:

  1.  **Funerary Cannibalism vs. Embalming:** Montaigne's opening commits him to the view that **both sides should distrust revulsion until they understand what the practice means.** Revulsion is "vulgar opinion." Once the Europeans understand the practice is an act of honor (incorporating the dead) rather than malice, the "eye of reason" may validate it, just as Pyrrhus validated the Roman army despite the "barbarian" label. The Europeans' embalming might conversely be judged as "barbarous" (neglecting the dead) by the standard of reason/nature, despite being their custom.
  2.  **Humiliation Cannibalism:** If the practice involves eating enemies solely to humiliate them, the custom-skeptic reading **does not block condemnation.** Reason can distinguish between honor (funerary) and cruelty (humiliation). Montaigne later in the essay condemns European torture and religious wars; he does not refrain from judgment entirely. He argues that some acts are truly barbarous regardless of who commits them. Code-relativism would forbid this condemnation if the act fits the aggressor's norms. Custom-skepticism allows it, because reason identifies cruelty as a violation of natural order, independent of local code.

  Therefore, the text supports a skepticism of *customary bias*, not a relativism of *moral truth*.

  \answer{custom-skepticism}
