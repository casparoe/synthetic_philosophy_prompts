prompt: |-
  A friend and I are stuck on the opening of Montaigne's essay “Of Cannibals”:

  “When King Pyrrhus invaded Italy, having viewed and considered the order of the army the Romans sent out to meet him; "I know not," said he, "what kind of barbarians" (for so the Greeks called all other nations) "these may be; but the disposition of this army that I see has nothing of barbarism in it."—[Plutarch, Life of Pyrrhus, c. 8.]—As much said the Greeks of that which Flaminius brought into their country; and Philip, beholding from an eminence the order and distribution of the Roman camp formed in his kingdom by Publius Sulpicius Galba, spake to the same effect. By which it appears how cautious men ought to be of taking things upon trust from vulgar opinion, and that we are to judge by the eye of reason, and not from common report.”

  Compare these two ways of reading the passage:

  1. custom-skepticism: labels like “barbarian” mostly express the observer's habits and ignorance, so we should suspend them until we have reasons that could survive contact with the unfamiliar practice; but reason can still condemn or approve across cultures.

  2. code-relativism: a practice is morally right or wrong only relative to the norms of the society in which it occurs, so an outsider's use of reason is really just their own customs dressed up.

  My friend says Montaigne obviously can't be a relativist because he explicitly appeals to “the eye of reason.” I think that's too quick: maybe Montaigne thinks what people take to be reason is itself trained by custom. At the same time, the Pyrrhus example seems to say that Greeks can recognize real military order among Romans, which would be weird if every judgment were trapped inside its own code.

  Apply your answer to this case: a society practices funerary cannibalism, in which relatives ceremonially eat a small part of an honored dead person's body, and they regard embalming a corpse and keeping it intact underground as a disgusting failure to incorporate the dead back into the community. Europeans in the case feel immediate revulsion at the eating but see their own embalming as respectful. Does Montaigne's opening commit him to saying that neither side may criticize the other, or only that both sides should distrust revulsion until they understand what the practice means? If a practice involved eating dead enemies solely to humiliate them, would the same reading still block condemnation?

  Please compare the two readings rather than just splitting the difference, and explain what work “barbarian,” “vulgar opinion,” and “the eye of reason” are doing in the passage. End with exactly one machine-readable line choosing the better reading: \answer{custom-skepticism}, \answer{code-relativism}, or \answer{mixed view}.
reasoning: |-
  The user wants me to analyze the opening passage of Montaigne's essay "Of Cannibals" based on two specific interpretive frameworks: "custom-skepticism" and "code-relativism".

  **1. Analyze the Passage:**
  The passage cites King Pyrrhus observing the Roman army. Pyrrhus calls them "barbarians" (using the Greek term for non-Greeks) but notes their military order shows "nothing of barbarism."
  Montaigne concludes: "By which it appears how cautious men ought to be of taking things upon trust from vulgar opinion, and that we are to judge by the eye of reason, and not from common report."

  **2. Analyze the Two Readings:**
  *   **Custom-skepticism:** Labels like "barbarian" are often just expressions of habit/ignorance (custom). We should suspend judgment based on mere difference. However, *reason* is universal enough to condemn or approve across cultures. It implies there is a standard (reason/nature) accessible to humans regardless of culture, but custom obscures it.
  *   **Code-relativism:** Morality is entirely relative to the society's norms. An outsider's "reason" is just their own custom projected outward. There is no transcendent standard.

  **3. Evaluate the Friend's vs. User's Argument:**
  *   **Friend:** Montaigne can't be a relativist because he appeals to "the eye of reason."
  *   **User:** That's too quick. Reason might be trained by custom. However, the Pyrrhus example suggests cross-cultural recognition of "order," which challenges strict relativism.

  **4. Apply to the Cannibalism Case:**
  *   **Scenario A:** Funerary cannibalism (honoring dead) vs. Embalming (respecting dead). Europeans feel revulsion at eating; Cannibals feel revulsion at rotting underground.
  *   **Scenario B:** Eating dead enemies to humiliate them.
  *   **Question:** Does Montaigne's opening commit him to saying neither side can criticize (relativism), or that both should distrust revulsion until understanding (skepticism)? Does the humiliation case change things?

  **5. Determine the Work of Key Terms:**
  *   **"Barbarian":** In the passage, it's shown to be a label of habit ("Greeks called all other nations"), not necessarily a factual description of savagery. Pyrrhus overrides the label with observation.
  *   **"Vulgar opinion" / "Common report":** This is the unexamined acceptance of labels based on cultural bias. Montaigne argues *against* this.
  *   **"The eye of reason":** This is the counter-proposal to vulgar opinion. It implies a faculty capable of seeing past custom to evaluate the "order" or nature of a thing.

  **6. Compare the Readings:**
  *   **Code-relativism:** If Montaigne were a code-relativist, the appeal to "reason" would be ironic or merely another custom. Pyrrhus recognizing Roman order would just be Greek custom meeting Roman custom, with no truth value about "barbarism." But Montaigne says we *ought* to judge by reason, implying reason gets us closer to truth than opinion. Relativism struggles with the normative "ought" regarding reason unless reason is just another local code.
  *   **Custom-skepticism:** This fits better. Custom blinds us (calling Romans barbarians). Reason allows us to see the truth (Roman order is not barbaric). This implies reason can transcend custom. In the cannibal case, revulsion is "vulgar opinion." Understanding the *meaning* (honoring vs. humiliating) allows reason to judge. Funerary cannibalism might be reasonable (honorable); humiliating cannibalism might not be. This allows for cross-cultural criticism based on intent/nature, not just difference.

  **7. Address the Specific Questions:**
  *   **Neither side criticize vs. distrust revulsion:** Custom-skepticism says distrust revulsion (custom) first. Once understood, reason *can* criticize (e.g., humiliation vs. honor). Code-relativism says neither can criticize because standards are internal.
  *   **Humiliation case:** If the practice is purely malicious (humiliation), custom-skepticism allows condemnation via reason (cruelty is against reason/nature). Code-relativism would say if their code allows it, it's right for them. Montaigne's text suggests we *should* use reason to judge, implying some things are genuinely barbarous and some aren't, regardless of the label. Pyrrhus admits they are called barbarians but *are not* in this instance. This implies "barbarism" is a real quality, not just a label.

  **8. Conclusion:**
  Montaigne is generally interpreted as a skeptic who believes in a universal human nature/reason that custom obscures. He is not a modern cultural relativist who denies the possibility of universal judgment. The appeal to "reason" is the clincher. It distinguishes between *appearance* (custom/opinion) and *reality* (reason/nature). Therefore, "custom-skepticism" is the stronger reading. It explains why we must suspend initial judgment (custom) but allows for final judgment (reason).

  **9. Drafting the Response:**
  *   **Introduction:** Define the tension.
  *   **Analysis of Terms:** Explain "barbarian" (label of habit), "vulgar opinion" (uncritical custom), "eye of reason" (universal faculty).
  *   **Comparison:** Show why Relativism fails (makes "reason" meaningless) and Skepticism succeeds (explains the movement from bias to judgment).
  *   **Application:** Apply to the funerary cannibalism case. Skepticism allows critique of the *humiliation* case but demands understanding of the *funerary* case. Relativism blocks all critique.
  *   **Final Line:** Select the best option.

  **Refining the "Mixed View" option:**
  The prompt asks to choose between custom-skepticism, code-relativism, or mixed view.
  Montaigne is complex. Sometimes he seems to say "who knows?" (skepticism). Sometimes he implies natural law.
  However, the prompt defines "custom-skepticism" as: "reason can still condemn or approve across cultures."
  "Code-relativism" is: "practice is morally right or wrong only relative to the norms."
  The passage explicitly contrasts "vulgar opinion" with "reason." This suggests reason is *not* just another opinion/custom. It is the tool to correct opinion. This aligns with custom-skepticism.
  The "mixed view" might be tempting because Montaigne is nuanced, but the prompt asks to compare the two readings *rather than just splitting the difference*. I need to argue for one as the *better* reading of *this passage*, even if Montaigne is complex overall.
  The passage argues *against* trusting custom ("vulgar opinion") and *for* trusting "reason." This is the definition of the custom-skepticism provided in the prompt (suspend labels based on habit, use reason to judge). Code-relativism would undermine the authority of "reason" posited in the text.
  So, Custom-skepticism is the stronger fit for *this specific text*.

  **Wait, let me double check the definition of Custom-skepticism provided:**
  "labels like 'barbarian' mostly express the observer's habits and ignorance, so we should suspend them until we have reasons that could survive contact with the unfamiliar practice; but reason can still condemn or approve across cultures."
  This fits Pyrrhus perfectly. He suspends the label "barbarian" (habit) and looks at the "order" (reason/observation). He concludes they are *not* barbarous in this regard. This implies "barbarism" is a real quality detectable by reason, not just a relative label.

  **Code-relativism definition:**
  "a practice is morally right or wrong only relative to the norms of the society in which it occurs, so an outsider's use of reason is really just their own customs dressed up."
  If this were true, Pyrrhus's judgment would just be "Greek custom says order is good." It wouldn't prove we should be cautious of vulgar opinion *in favor of reason*. It would just be "swap one custom for another." But Montaigne says "judge by the eye of reason, *and not* from common report." This establishes a hierarchy: Reason > Report/Custom. Relativism denies this hierarchy.

  **Application to Cannibalism:**
  *   **Funerary Cannibalism:** Custom-skepticism says: Don't rely on revulsion (vulgar opinion). Understand the intent (honor). Reason might approve it as pious, unlike embalming which they see as neglect.
  *   **Humiliation Cannibalism:** Custom-skepticism says: Understand intent. Reason might condemn cruelty/humiliation as contrary to natural law/reason, regardless of the culture.
  *   **Relativism:** Funerary is right for them, wrong for us. Humiliation is right for them (if their code allows), wrong for us. No cross-cultural condemnation possible.

  Montaigne's essay "Of Cannibals" famously argues that the "barbarians" (Tupi people) are often more civilized than Europeans. He critiques European torture and religious wars. This implies a standard of "civilization" or "reason" that Europeans are failing and Tupi are meeting. This supports Custom-skepticism (universal reason obscured by custom) over Relativism (no universal standard).

  **Decision:** Custom-skepticism is the better reading of this passage and the essay's broader project.

  **Structure:**
  1.  Analyze the terms ("barbarian", "vulgar opinion", "reason").
  2.  Compare the two readings in light of these terms.
