prompt: |-
  I'm a program officer at a small family foundation making around forty grants a year, mostly $20k to $200k, and my board has started pressing me on why I fund one thing and not another. I keep seeing the importance/tractability/neglectedness framework waved around, but never as an actual procedure I can run in the hour I have per application. Please write me a reusable decision procedure (questions in order, what a good enough answer looks like, where it stops with a no, and where it stops with "this is a values call") based on what's actually defensible in that framework—not a version that pretends the three factors just multiply. Then run it on two or three cases: (a) a very neglected cause with low tractability, (b) a crowded but highly tractable cause, and maybe (c) a huge cause already awash in money. Make at least one case come out as a no to something I'd personally love to fund. Be explicit about which steps are settled among people who do cause prioritization and which are contested or judgment calls, and say what the procedure can't handle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Program Officer at a small family foundation (~40 grants/year, \$20k-\$200k).
      *   **Problem:** Board wants justification for funding choices. User sees "Importance/Tractability/Neglectedness" (ITN) but needs a practical, hourly procedure, not a theoretical model.
      *   **Task:** Write a reusable decision procedure based on ITN (but realistic, not just multiplying factors). Run it on three specific cases (a, b, c). Ensure at least one "no" to something desirable. Explicitly mark settled vs. contested steps and limitations.
      *   **Constraints:** Needs to be defensible, practical (1 hour/app), and honest about the framework's limits.

  2.  **Deconstruct the ITN Framework for Practical Use:**
      *   *Standard Theory:* Impact = Importance $\times$ Tractability $\times$ Neglectedness.
      *   *Reality:* These aren't independent variables. They interact. You can't quantify them precisely in an hour.
      *   *Adaptation:* Turn them into a funnel or a scoring rubric with hard gates.
      *   *Scale:* Small foundation (\$20k-\$200k). This means "marginal dollar" thinking is crucial. We aren't solving the whole problem; we are funding *our slice*.
      *   *Board Pressure:* Needs clear "No" criteria and clear "Values Call" criteria.

  3.  **Drafting the Procedure (The "1-Hour ITN Filter"):**
      *   *Goal:* Move from "Is this good?" to "Is this the *best* use of *our* money?"
      *   *Structure:*
          1.  **Fit & Legality (Gate 0):** Quick elimination.
          2.  **Importance (Scale):** Is the problem big enough?
          3.  **Tractability (Leverage):** Will *this* grant actually move the needle? (Crucial for small grants).
          4.  **Neglectedness (Marginal Value):** Is there room for us?
          5.  **Values/Strategy (The Tie-Breaker):** Where the board's specific mission comes in.
      *   *Refinement:* Avoid multiplication. Use "Thresholds." If Importance is huge but Tractability is near zero, it's a no. If Neglectedness is high but Importance is tiny, it's a no.
      *   *Time Management:* Assign minutes to each section.

  4.  **Developing the Test Cases:**
      *   *Case A (Neglected, Low Tractability):* Maybe something like "Preventing AI Misalignment via philosophical research" or "Ending aging." Let's go with something more tangible for a family foundation. *Idea:* Preserving an endangered indigenous language with no speakers left under 50. High cultural importance, very neglected, but is \$50k tractable to save it? Probably not.
      *   *Case B (Crowded, High Tractability):* *Idea:* Local food bank or disaster relief. Very tractable (money = food), very crowded. Why fund? Because of local values. This should be a "Values Call" or a "No" depending on the foundation's mandate. Let's make it a "No" based on marginal impact to satisfy the prompt's requirement for a hard "no" to something likable. *Revision:* Let's make it a "No" on *marginal* grounds. A generic disaster relief fund where every dollar is matched but the need is already fully met by government.
      *   *Case C (Huge Cause, Awash in Money):* *Idea:* Cancer Research (specifically a well-funded subtype) or Climate Change (general awareness). Let's go with "General Climate Awareness Campaign in a developed nation." Huge problem, lots of money.
      *   *Selection:* I need to ensure one is a "No" to something the PO would love. Let's make Case A the "Passion Project" that fails the Tractability test.

  5.  **Refining the Procedure Steps (Iterative Process):**
      *   *Step 1: Importance.* Don't ask "Is this important?" Ask "If solved, how much suffering/opportunity is restored?"
      *   *Step 2: Tractability.* Crucial distinction: "Is the *problem* solvable?" vs. "Is *this grant* effective?" Focus on the grant.
      *   *Step 3: Neglectedness.* Focus on "Funding Gap." Is there a specific niche others are missing?
      *   *Step 4: The "Small Funder" Reality Check.* Can \$20k-\$200k actually change the trajectory?
      *   *Step 5: Values.* If ITN is ambiguous, defer to Board Mission.

  6.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Marginal impact matters more than average impact. Counterfactuals matter.
      *   *Contested:* How to weigh suffering vs. existence. How to compare vastly different causes (animals vs. humans). Time horizon (now vs. long-term).

  7.  **Addressing "What the Procedure Can't Handle":**
      *   Black swan events.
      *   Relationship building (sometimes you fund a person, not a project).
      *   Board politics (sometimes you fund to keep a board member happy).
      *   Learning grants (funding to *learn* if something works).

  8.  **Drafting the Content (incorporating the prompt's tone):**
      *   Tone: Professional, pragmatic, slightly cynical about theory but respectful of rigor.
      *   Format: Clear headings, bullet points, time estimates.
      *   The "No": Make sure the reasoning is sharp.

  9.  **Review against Constraints:**
      *   *Reusable?* Yes, structured as a checklist.
      *   *1 Hour?* Yes, time-boxed.
      *   *ITN based?* Yes, but adapted.
      *   *3 Cases?* Yes.
      *   *One "No" to a passion?* Yes (Case A).
      *   *Explicit on contested/settled?* Yes, included in a dedicated section.
      *   *Limitations?* Yes, included.

  10. **Final Polish:** Check the math/logic on the cases. Ensure the distinction between "Values Call" and "No" is clear. (Self-Correction: Make sure Case B isn't just a flat no, but a "No unless values override." Actually, prompt asks for a "No" to something I'd love. Let's make the "Passion Project" the one that gets cut hard.)

      *   *Case A (Passion):* Restoring a specific wetland ecosystem. (Love it, but maybe too late/expensive). Let's go with "Art Therapy for Refugees." High empathy, low tractability evidence, crowded NGO space.
      *   *Case B (Crowded/Tractable):* Vaccines in developing countries. High tractability, crowded.
      *   *Case C (Huge/Awash):* University Endowment for Climate.
      *   *Decision:* Let's stick closer to the prompt's specific archetypes.
      *   (a) Neglected/Low Tractability: *Preventing a specific low-probability existential risk (e.g., engineered pandemic).* Hard to measure, low tractability for small grant.
      *   (b) Crowded/High Tractability: *Local Homeless Shelter Expansion.*
      *   (c) Huge/Awash: *Broad Cancer Research.*

      *Wait, I need to make sure the procedure is the star.* I will design the "1-Hour ITN Funnel."

      *Revised Plan for Cases:*
      1.  **Case A (The Passion Trap):** A project to preserve a dying dialect. (Neglected, Important to culture, but \$50k won't save it -> Low Tractability). **Verdict: NO.**
      2.  **Case B (The Efficient Crowd):** A proven malaria net distribution partner. (High Importance, High Tractability, Low Neglectedness). **Verdict: VALUES CALL (Fund if local/global alignment exists, otherwise pass).**
      3.  **Case C (The Money Pit):** A new wing for a well-funded hospital. (High Importance, Low Neglectedness, Unclear Tractability of *marginal* dollar). **Verdict: NO.**

      *Wait, prompt asks for:* (a) neglected/low tractability, (b) crowded/high tractability, (c) huge/awash.
      Okay, I will follow that exactly.

      *Let's refine the "No" logic.* The prompt asks for "where it stops with a no."
      I need to make sure the procedure explicitly says "If Tractability < Threshold, STOP."

      *Let's write.*

      *(Self-Correction during drafting)*: Ensure I explicitly mention that ITN isn't multiplicative. It's more like a chain. If one link is broken, the impact is zero.

      *(Final check on "Settled vs Contested")*: Be careful not to sound like an EA evangelist. Acknowledge that "Importance" is subjective.

      *(Final check on "1 Hour")*: Break down the minutes. 10 mins fit, 15 mins Importance, 20 mins Tractability, 15 mins Neglectedness/Marginal, 10 mins Values/Write-up.

      *Let's go.*
answer: |-
  ## The 1-Hour ITN Funnel: A Decision Procedure for Small Foundations

  **Context:** You are not a billionaire solving global optimization. You are a small funder (\$20k–\$200k) making ~40 grants. Your goal is not to maximize global utility in the abstract, but to ensure your specific marginal dollars do something that wouldn't otherwise happen, aligned with your board's mission.

  **The Core Insight:** Importance, Tractability, and Neglectedness (ITN) are not multipliers (where a high score in one saves a zero in another). They are a **chain**. If any link is broken, the impact is zero.
  *   If it's not important, why do it?
  *   If it's not tractable (your money won't change the outcome), why do it?
  *   If it's not neglected (someone else is already fully funding it), why do it?

  **Time Budget:** 60 Minutes per application (after initial eligibility check).

  ---

  ### Phase 1: The Hard Gates (10 Minutes)
  *Goal: Eliminate mismatches before analyzing impact.*

  1.  **Legal/Geographic Fit:** Does this fall within our IRS 501(c)(3) constraints and geographic mandate?
      *   *Stop:* If No.
  2.  **Grant Size Fit:** Can this project meaningfully advance with \$20k–\$200k?
      *   *Good Enough Answer:* "This \$50k bridges a specific gap," or "This \$200k funds a pilot."
      *   *Stop:* If the project budget is \$10M and you are offering 2%. (You are a drop in the bucket; your marginal impact is invisible).

  ### Phase 2: Importance (Scale & Severity) (15 Minutes)
  *Goal: Determine if the problem matters enough to occupy foundation resources.*

  **Question:** If this project succeeds perfectly, how many lives are improved, how much suffering is reduced, or how much opportunity is created?
  *   **Settled Consensus:** Scale matters. Saving 1,000 lives is more important than saving 1, *ceteris paribus*.
  *   **Contested/Judgment:** How do you weigh quality of life vs. existence? (e.g., Art vs. Food). *This is where your Foundation Mission dictates the weight.*

  **Threshold for "Yes":**
  *   Does the outcome align with the Board's stated values (e.g., "Children," "Environment," "Arts")?
  *   Is the scope larger than a single individual's benefit (unless that individual is a test case for a broader solution)?

  **Stop with a NO if:** The problem is trivial in scale *and* does not align with a specific Board passion area.

  ### Phase 3: Tractability (Leverage) (20 Minutes)
  *Goal: Determine if **your** check changes the outcome. This is where most small funders fail.*

  **Question:** Is there a clear causal link between *this* grant and the solution?
  *   **Settled Consensus:** Correlation is not causation. "Awareness" is rarely tractable without a specific behavioral mechanism.
  *   **Contested/Judgment:** How much evidence do you need? (RCTs vs. anecdotal).

  **The "Small Funder" Test:**
  1.  **Is the bottleneck money?** If the problem is lack of policy will, your \$50k won't fix it. If the problem is lack of seed capital, it might.
  2.  **Is there a feedback loop?** Will you know in 12 months if this worked?
  3.  **Counterfactual:** If you don't fund this, will the project simply not happen? (See Phase 4).

  **Threshold for "Yes":**
  *   The applicant can articulate exactly what the money buys (e.g., "hires 1 researcher for 1 year," "buys 500 nets").
  *   There is evidence (past performance or pilot data) that this intervention works.

  **Stop with a NO if:** The project is "raising awareness" without a metric for behavior change, OR the problem is structural/political and the grant is too small to influence it. **(This is the most common defensible "No".)**

  ### Phase 4: Neglectedness (Marginal Value) (15 Minutes)
  *Goal: Determine if you are duplicating effort.*

  **Question:** Who else is funding this, and is there a gap?
  *   **Settled Consensus:** Diminishing returns apply. The 100th million dollars into a cause does less than the first million.
  *   **Contested/Judgment:** What counts as "crowded"? (Global vs. Local).

  **The "Crowding" Check:**
  1.  **Government:** Is this a core government responsibility (e.g., road repair, basic public health)?
      *   *If Yes:* You are only funding if the government is failing *and* you can fix the failure.
  2.  **Other Philanthropy:** Are there 10 other foundations funding this exact niche?
  3.  **The Niche:** Can you identify a specific sub-component that is underfunded? (e.g., Not "Cancer Research," but "Pediatric Rare Cancer Data Standardization").

  **Threshold for "Yes":**
  *   You can identify a specific funding gap your grant fills.
  *   OR, the cause is crowded, but this specific organization is uniquely effective (Top 1% exception).

  **Stop with a NO if:** The project is fully funded by government/other donors and your money would simply displace theirs (supplantation).

  ### Phase 5: The Values Call (Final Decision) (Remaining Time)
  *Goal: Resolve ties and align with Board Mission.*

  If an application passes Phases 1–4, you have a **viable** grant. You now choose based on:
  1.  **Board Passion:** Does this excite the family?
  2.  **Learning Value:** Will this teach us something for future grants?
  3.  **Relationship:** Is this a partner we want for 10 years?

  **Explicitly mark this step:** "This is a Values Call." This protects you when the Board asks why you funded X instead of Y (both viable). The answer is: "X aligned closer with our specific strategic pillar."

  ---

  ### What This Procedure Cannot Handle
  1.  **Black Swans:** High-risk, high-reward moonshots often fail the Tractability test (no evidence they work). You need a separate "Risk Capital" bucket for these.
  2.  **General Operating Support:** Hard to evaluate via ITN because the money is fungible. Evaluate the *organization's* ITN instead of the *project's*.
  3.  **Board Politics:** If a Board member demands a grant to their alma mater, this procedure will say "No." You will need a separate "Board Discretion" line item to manage that without corrupting your main data.

  ---

  ### Running the Procedure on Three Cases

  #### Case A: The Passion Project (Neglected / Low Tractability)
  **Proposal:** Preserving a specific indigenous dialect with fewer than 20 fluent speakers remaining.
  **Request:** \$50,000 for recording and archival.
  **PO Personal Feeling:** *I love this. It's culturally vital and heartbreaking.*

  1.  **Fit:** Yes, fits "Culture/Arts." Size is appropriate.
  2.  **Importance:** High cultural value, but low scale (20 speakers). *Passes on Values grounds.*
  3.  **Tractability:** **FAIL.**
      *   *Analysis:* The goal is "preservation." Archiving helps, but does \$50k reverse language death? Unlikely. The bottleneck is intergenerational transmission, not recording equipment. The causal link between \$50k and "language survival" is weak.
      *   *Small Funder Test:* Is money the bottleneck? No, lack of speakers is.
  4.  **Neglectedness:** High. No one else is doing this.
  5.  **Decision:** **NO.**
      *   *Defensible Reason:* "While highly neglected and culturally important, the intervention lacks tractability. Funding archival does not solve the bottleneck of speaker transmission. Our marginal dollar will not change the outcome of language extinction."
      *   *Note:* This is the hard "No" to something you love. It protects the foundation from funding "nice to haves" that don't move the needle.

  #### Case B: The Efficient Crowd (Crowded / High Tractability)
  **Proposal:** Local Food Bank Expansion. Buying refrigerated trucks to deliver fresh produce to food deserts.
  **Request:** \$150,000 (cost of 2 trucks).
  **PO Personal Feeling:** *It's boring. Everyone funds food banks.*

  1.  **Fit:** Yes, fits "Poverty/Health." Size is appropriate.
  2.  **Importance:** High. Hunger is immediate suffering.
  3.  **Tractability:** **PASS.**
      *   *Analysis:* Money = Trucks = Food delivered. Clear causal chain. Evidence is robust (food banks work).
      *   *Small Funder Test:* Yes, \$150k buys the specific assets needed.
  4.  **Neglectedness:** **LOW.**
      *   *Analysis:* This is a crowded space. Government and major United Ways fund this.
      *   *The Nuance:* Are the trucks the specific gap? The applicant shows that government funds cover food costs, but logistics are the current bottleneck.
  5.  **Decision:** **VALUES CALL.**
      *   *Defensible Reason:* "This passes the ITN threshold on Tractability and Importance, despite low Neglectedness. Because the logistics bottleneck is verified, this is a viable grant. The decision to fund rests on whether 'Local Direct Service' is a higher priority than 'Systemic Change' for this year's portfolio."
      *   *Why not a No?* Sometimes high tractability overrides neglectedness if the need is acute and local (your Board's backyard).

  #### Case C: The Money Pit (Huge Cause / Awash in Money)
  **Proposal:** New Research Wing at a Major University Hospital for Common Cancer Types.
  **Request:** \$200,000 (naming opportunity on a lab room).
  **PO Personal Feeling:** *Prestigious. Looks good on the annual report.*

  1.  **Fit:** Yes, fits "Health."
  2.  **Importance:** **HIGH.** Cancer is a massive problem.
  3.  **Tractability:** **UNCLEAR/LOW.**
      *   *Analysis:* Does a new room accelerate research? Or does it just house researchers who would have been hired anyway? The marginal impact of *bricks* vs. *people* is often low.
  4.  **Neglectedness:** **FAIL.**
      *   *Analysis:* This institution has a \$5B endowment. Common cancers are heavily funded by NIH and pharma.
      *   *Small Funder Test:* Your \$200k is 0.004% of their budget. You have zero leverage. You are donating to their general fund with extra steps.
  5.  **Decision:** **NO.**
      *   *Defensible Reason:* "While Importance is high, Neglectedness is near zero. This institution has ample capital. Our \$200k grant would be supplanting existing budget rather than enabling new work. We cannot demonstrate marginal impact."
      *   *Why this matters:* This stops the Board from chasing prestige. It forces the question: "Are we buying a plaque, or are we buying progress?"

  ---

  ### Summary of Settled vs. Contested Steps

  | Step | Settled Consensus (among analysts) | Contested / Judgment Call (Your call) |
  | :--- | :--- | :--- |
  | **Importance** | Scale matters (1M lives > 1 life). | How to weigh "quality of life" (Arts) vs. "existence" (Food). |
  | **Tractability** | Evidence > Hope. Marginal dollar must move the needle. | How much evidence is enough? (Pilot vs. Proven). |
  | **Neglectedness** | Diminishing returns exist. Don't duplicate. | What counts as "crowded"? (Global pool vs. Local niche). |
  | **Values** | N/A | **Entirely your call.** This is where the Family Mission overrides the math. |

  ### Final Advice for the Board
  When the Board asks, "Why did we fund the Food Bank (Case B) but not the Language (Case A)?"
  *   **Your Answer:** "The Language project failed the **Tractability** gate. Our money wouldn't have saved the language. The Food Bank passed Tractability but was low on Neglectedness. We funded it as a **Values Call** because local hunger aligns with our family's history, even if it's a crowded space. We rejected the Hospital Wing (Case C) because it failed **Neglectedness**; our money wouldn't have been marginal there."

  This frames your decisions not as personal preference, but as **stewardship of marginal impact.**
