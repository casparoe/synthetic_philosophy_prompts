answer: |-
  This is a classic problem in decision theory known as the **St. Petersburg Paradox**. It has puzzled mathematicians and economists for over 300 years. Your confusion is entirely justified: you are standing exactly where the paradox is designed to put you, caught between abstract mathematical expectation and practical human reality.

  Here is how you should think through this decision, breaking down why your first friend is theoretically right but practically wrong, and why your second friend is intuitively correct.

  ### 1. The "Infinite Value" Argument is Broken by Reality
  Your mathematically inclined friend is calculating the **Expected Value (EV)** based on the assumption that the entrepreneur has infinite money.
  *   **The Math:** $(1/2 \times \$2) + (1/4 \times \$4) + (1/8 \times \$8) + \dots = \$1 + \$1 + \$1 \dots = \infty$.
  *   **The Reality:** The entrepreneur is not a central bank. You stated he has roughly **$500,000** in liquid assets. This creates a "hard cap" on the game.

  Once we introduce a bankroll limit, the infinite series truncates.
  *   $2^{18} = \$262,144$
  *   $2^{19} = \$524,288$

  The entrepreneur cannot pay you if the game reaches the 19th toss. He can at best pay out roughly 18 rounds before he is insolvent. If we recalculate the Expected Value with this $500,000 cap:
  *   For tosses 1 through 18, the expected contribution is $1 per toss ($18 total).
  *   For toss 19 and beyond, he pays his max ($500,000) with a probability of roughly 1 in 262,144. This adds roughly $1.90 to the value.
  *   **Revised Expected Value:** Approximately **$19.90**.

  Even ignoring your risk aversion and looking purely at the cold math of *his* bankroll, the ticket is overpriced at $30. It is mathematically worth about $20.

  ### 2. The Probability of Losing Money
  Expected Value is an average over millions of trials. You stated this is a **one-time purchase**. You will not get the "average" result; you will get *one* result.
  *   To break even or profit ($\ge \$30$), you need a payout of at least $32.
  *   This requires the first heads to appear on toss #5 or later.
  *   The probability of this is $1/2^4$, or **1 in 16 (6.25%)**.
  *   Conversely, there is a **93.75% chance** you will receive less than $30 back (payouts of $2, $4, $8, or $16).

  In a single trial, the "median" outcome is much more relevant than the "mean" outcome. The median payout of this game is **$2**. You are paying $30 for a 94% chance to lose money.

  ### 3. Utility and Risk Aversion
  This is where your personal context matters most. Economics distinguishes between the *value of money* and the *utility of money*.
  *   **Diminishing Marginal Utility:** The first $1,000 you save is more valuable to your survival than the 100th $1,000.
  *   **Loss Aversion:** You noted you would feel the loss of $30 more strongly than a gain of $30. This is a standard psychological trait.
  *   **Your Bankroll:** With $6,000 in savings, $30 represents **0.5% of your net worth**. While not catastrophic, losing it provides no utility. Winning $2 (the most likely outcome) provides negligible utility.

  To determine a fair price for *you*, we must look at the **Certainty Equivalent**. This is the amount of cash you would accept instead of playing the game. Given your savings level and risk aversion, the utility of a 94% chance to lose $30 outweighs the tiny sliver of hope for a massive payout that the entrepreneur likely couldn't pay anyway.

  ### 4. Counterparty Risk
  There is a final, practical constraint: **Default Risk.**
  You mentioned the entrepreneur has "no realistic way to raise much more." If the coin lands on tails 19 times (a 1 in 524,288 chance), he owes $524,288 but only has $500,000.
  *   Will he pay you the remaining $24,288 from future earnings?
  *   Will he declare bankruptcy?
  *   Will he disappear?

  Every toss beyond #18 introduces the risk that the prize exists on paper but not in your bank account. This further reduces the value of the ticket below the $20 theoretical cap.

  ### Recommendation and Fair Price

  **Do not buy the ticket for $30.**
  Your second friend is right. The "infinite value" argument collapses once you account for the entrepreneur's finite bankroll, the single-trial nature of the bet, and your own risk aversion.

  **Is there a price at which it makes sense?**
  *   **The "Math" Limit:** Given his $500k cap, the ticket is never worth more than **~$20** in pure expected value.
  *   **The "Personal" Limit:** Given your savings ($6k) and loss aversion, you should value the ticket much lower. You are essentially buying a lottery ticket where the most likely prize is $2.
  *   **Fair Price:** A rational price for you, balancing the tiny chance of a life-changing win against the high probability of a small loss, would be in the range of **$5 to $8**.

  At $5, the loss is negligible ($6k savings $\to$ $5,995), but you retain the "dream" of the payout. At $30, you are paying a premium for a mathematical abstraction that cannot exist in the real world.

  **Verdict:** Politely decline the $30 offer. If he is willing to sell for $5, you might consider it as entertainment, but treat the money as spent the moment you hand it over.
