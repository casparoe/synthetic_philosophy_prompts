answer: |-
  I reject step (4). It looks fine because it extrapolates Hume's accurate description of a *one-off* shock to a *continuous* process, assuming agents suffer from permanent money illusion. In reality, expectations adjust. If money injection is continuous, workers and merchants learn to anticipate inflation. They demand higher wages and raise prices immediately upon receiving new funds, closing Hume's window. The real output gain vanishes, leaving only higher inflation. This is the Friedman-Phelps critique: you cannot permanently trade inflation for output.

  Rejecting (4) costs you the hope of permanent monetary stimulus. You must accept the Natural Rate Hypothesis: monetary policy can smooth short-run fluctuations but cannot lift long-run output above its structural limit determined by technology and institutions. The "free lunch" disappears because the lunch was never there to begin with once expectations equilibrate.

  Your flatmate also glosses over step (5). Even if output stayed high, inflation isn't welfare-neutral. It distorts price signals, creates menu costs, and arbitrarily redistributes wealth between creditors and debtors. Hume's neutrality applies to static levels, not dynamic instability. But the primary break is (4): the mechanism in (2) fails because people learn. You don't need to abandon "no free lunch"; you just need to recognize that agents aren't perpetually naive. The temporary gain exists (validating 1), but perpetuating it requires ever-accelerating inflation, not constant injection, eventually causing hyperinflation rather than prosperity. Thus, the argument collapses not because money isn't real in the short run, but because the short run cannot be made permanent without destroying the currency.
