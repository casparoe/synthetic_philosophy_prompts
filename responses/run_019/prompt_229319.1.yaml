answer: |-
  This is the right place to start. Too much of the literature jumps straight to defending a primary or remedial account without establishing the *conditions of adequacy* that any such account must meet to be philosophically robust and practically applicable. If we treat this as a specification problem, we can see where existing theories fail not because they are "wrong" in the abstract, but because they violate constraints they implicitly accepted.

  Here is the brainstorming, pruning, and specification process, treating you as a colleague.

  ### Part 1: Brainstorming and Pruning Candidate Requirements

  You listed several candidate requirements you were unsure about. We need to separate *moral prerequisites for a right* from *pragmatic conditions for recognition* or *parochial institutional preferences*. A theory of the *right* to secede is a normative account of moral claim-rights; it is not necessarily a blueprint for international law or a cost-benefit analysis of state viability.

  | Candidate Requirement | Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **Economic Viability** | **Prune** | This confuses the *right* to secede with the *wisdom* of secession. A group may have a moral right to exit an oppressive union even if the resulting state is poor (e.g., Bangladesh 1971). Viability is a condition for *recognition* or *prudence*, not the existence of the right itself. |
  | **Respect for Parent Constitution** | **Prune (as a moral condition)** | This is the critical tension. If the theory is moral, it cannot be bound by the positive law of the oppressor. In remedial cases (e.g., Kosovo), the constitution is often the tool of suppression. A theory requiring constitutional permission collapses the remedial right into a constitutional privilege. |
  | **Supermajority (>50%+1)** | **Prune** | This is an institutional design choice, not a theoretical necessity. Unless one argues that secession is a fundamental constitutional change requiring higher thresholds (a specific primary-right variation), there is no *a priori* moral reason to privilege the status quo minority over the secessionist majority. |
  | **Distinct Language/History** | **Prune** | This is a substantive commitment of *nationalist* primary-right theories, not a requirement for *any* adequate theory. A territorial plebiscite theory explicitly rejects this. Including it as a universal requirement begs the question against civic/territorial accounts. |
  | **External Recognition** | **Prune** | Recognition is a constitutive element of *statehood* in international law, not the *right to secede*. A group can have the moral right to leave but be denied recognition (e.g., Somaliland). The theory must explain the right *prior* to the diplomatic outcome. |

  **What survives the prune?**
  We are left with requirements that ensure the theory is logically coherent, morally consistent, and applicable across the hard cases you mentioned (recursive cases, unjust states, democratic contexts).

  ### Part 2: The Specification (Criteria of Adequacy)

  For a theory of the right to secede to be adequate, it must satisfy the following five requirements. These are not preferences; they are structural constraints.

  #### 1. The Non-Circularity Constraint (The Demos Problem)
  *   **Consideration:** In the Quebec and Scotland cases, the question "Who votes?" is pre-judged. If the unit is defined by the existing border, the status quo wins. If defined by the nationalist group, the secessionist wins.
  *   **Requirement:** The theory must provide a non-circular method for defining the *unit of self-determination* (the "people" entitled to vote) that does not presuppose the outcome of the secession claim. It cannot simply say "the people within the existing administrative border" without justifying why *that* border is the morally relevant one.
  *   **Status:** **Non-Negotiable.** Failure here renders the theory question-begging (as Buchanan argues against plebiscitary theories).

  #### 2. The Recursivity Constraint (The Nested Groups Problem)
  *   **Consideration:** If Quebec has a right to leave Canada based on a distinct national identity or a majority vote, do the Cree in Northern Quebec have the same right to leave Quebec? If yes, infinite fragmentation looms. If no, why does the right apply at the provincial level but not the indigenous territorial level?
  *   **Requirement:** The theory must specify a principle for adjudicating claims by sub-units within the seceding territory that is consistent with the principle used for the primary secession. It cannot arbitrarily stop the regress at the current administrative border.
  *   **Status:** **Non-Negotiable.** This is the primary failure point for primary-right theories when applied to cases like the Cree or Catalonia's internal municipalities.

  #### 3. The Internal Minority Protection Constraint
  *   **Consideration:** Secession changes the jurisdiction over everyone in the territory, including those who voted to remain (e.g., Unionists in Northern Ireland, Anglophones in a hypothetical independent Quebec).
  *   **Requirement:** The theory must account for the moral status of residents within the seceding territory who oppose secession. It must specify whether they are forced to join the new state, entitled to stay with the rump state (border adjustment), or granted specific minority rights. A theory that treats the territory as a monolithic block fails this.
  *   **Status:** **Non-Negotiable.** Ignoring this violates basic liberal commitments to individual autonomy and consent.

  #### 4. The Distinction Constraint (Right vs. All-Things-Considered)
  *   **Consideration:** A group might have a *right* to secede (just claim) but it might be *unwise* (economic collapse, war). Conversely, secession might be beneficial but not a *right* (e.g., a wealthy region wanting to avoid redistribution).
  *   **Requirement:** The theory must clearly distinguish between the *existence of the right* (deontological/claim-based) and the *all-things-considered permissibility* (consequentialist/pragmatic). It must explain when consequences override the right, if ever.
  *   **Status:** **Non-Negotiable.** Collapsing these leads to the "economic viability" error pruned above.

  #### 5. The Unilateral/Negotiated Threshold Constraint
  *   **Consideration:** Scotland (negotiated/consensual) differs from Kosovo (unilateral/remedial). A theory must specify when a group is obligated to negotiate and when they are permitted to exit unilaterally.
  *   **Requirement:** The theory must define the conditions under which the parent state's consent is *necessary* versus when it is *dispensable*. It cannot simply assume all secession must be consensual (which rules out remedial rights) or all secession can be unilateral (which rules out stability).
  *   **Status:** **Non-Negotiable.** This determines the theory's applicability to democratic vs. authoritarian contexts.

  ### Part 3: Joint Unsatisfiability (The Trilemma)

  You asked to identify if a subset of these requirements is jointly unsatisfiable. There is a profound tension, specifically regarding **Constitutional Legality**, **Remedial Justice**, and **State Sovereignty**.

  While I pruned "Respect for Parent Constitution" as a *moral* requirement, it remains a *political* reality. Here is the trilemma that emerges when we try to make the theory action-guiding in the real world:

  1.  **Moral Consistency:** The theory must grant a remedial right to secede when serious injustice occurs (e.g., Bangladesh, Kosovo).
  2.  **Legal Positivism:** The theory must respect the parent state's constitutional order to maintain international stability (e.g., Spain/Catalonia, US/Civil War).
  3.  **Effective Sovereignty:** The parent state retains a monopoly on the legitimate use of force and legal adjudication within its borders.

  **The Conflict:**
  In remedial cases (1), the parent state is often the perpetrator of the injustice. Therefore, the parent state's constitution (3) will almost certainly forbid secession to protect its integrity (2).
  *   If you prioritize **Moral Consistency**, you must authorize unilateral secession that violates domestic law (Kosovo).
  *   If you prioritize **Legal Positivism**, you deny the remedial right in the exact cases where it is most needed (Catalonia).
  *   If you prioritize **Effective Sovereignty**, you rely on the abuser to grant permission to leave.

  **Conclusion:**
  We must conclude that **a moral theory of secession cannot require adherence to the parent state's constitution in remedial cases.** To do so would make the right to secede contingent on the permission of the violator.
  *However*, this creates a gap between the *moral right* and *international recognition*. The adequate theory must acknowledge that a group can have the *right* to secede (moral) without having the *right* to recognition (legal) until the political reality shifts. The theory must be bifurcated: one standard for the *ethics of exit*, another for the *politics of entry* into the state system.

  ### Part 4: The Single Most Discriminating Requirement

  If you want to know which requirement does the most work in knocking out candidate theories, it is **Requirement #1: The Non-Circularity Constraint (The Demos Problem).**

  **Why?**
  1.  **It kills naive Plebiscitary Theories:** A simple "majority vote within existing borders" theory fails because it cannot explain why *those* borders are the voting unit without referencing the very state authority being challenged. Why does the vote happen at the level of Catalonia and not the province of Barcelona, or the whole of Spain? If the answer is "because that's the administrative border," the theory is circular (the state defines the unit that decides the state's fate).
  2.  **It pressures Remedial Theories:** Even remedial theories must define the jurisdiction of the injustice. Does the injustice apply to the individual, the cultural group, or the territory? If a group claims a right to secede because of injustice, they must define who constitutes the "victim group" entitled to the remedy without simply drawing a map that maximizes their resources.
  3.  **It forces the "National" vs. "Territorial" choice:** To solve non-circularity, a theory usually has to commit to either *nationality* (which risks exclusion/ethnic nationalism) or *prior administrative units* (which risks arbitrariness). This forces the theorist to reveal their foundational commitments early.

  **Implication for your work:**
  When you evaluate Scotland, Catalonia, or Quebec, do not start by asking "Was the vote fair?" Start by asking "Who decided who got to vote, and on what moral basis was that boundary drawn?"
  *   **Scotland:** The UK Parliament granted the Section 30 order. The unit was pre-agreed. This bypasses the non-circularity problem via *consent*, but only works in consensual contexts.
  *   **Catalonia:** The Spanish Constitutional Court ruled the unit (the "whole Spanish people") is sovereign. The circularity is explicit: the state defines the demos to prevent the demos from leaving.
  *   **Quebec:** The Supreme Court Reference (1998) tried to split the difference (no unilateral right, but obligation to negotiate if clear majority). This acknowledges the circularity problem by refusing to solve it procedurally, pushing it to politics.

  **Summary for your Dissertation:**
  Don't let your theory rest on "democratic will" until you have solved the "who is the demos" problem. Don't let it rest on "justice" until you have solved the "who is the victim" problem. The Non-Circularity Constraint is the filter that separates political philosophy from political advocacy.
