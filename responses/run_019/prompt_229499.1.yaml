answer: |-
  # DECISION TREE: WHAT TO DO WITH THE PAST

  **1. Does the ultimate meaning of human life depend on events unfolding in time, or on something timeless (like art, religion, or essence)?**
  *   **Something Timeless** → **LEAF: The Suprahistorical Stance**
  *   **Events in Time** → Go to Question 2.

  **2. Is knowing the truth about the past valuable even if it paralyzes your ability to act or be happy?**
  *   **Yes** → **LEAF: Objective History**
  *   **No (Life/Action comes first)** → Go to Question 3.

  **3. To act effectively in the present, do you need to remember the past or forget it?**
  *   **Forget It** → **LEAF: The Unhistorical Stance**
  *   **Remember It** → Go to Question 4.

  **4. When you remember the past, is it sacred in itself (a foundation) or instrumental (a tool)?**
  *   **Sacred Foundation** → **LEAF: The Antiquarian Mode**
  *   **Instrumental Tool** → Go to Question 5.

  **5. If the past is a tool, do you use it to imitate greatness, break chains, or just understand it accurately?**
  *   **Imitate Greatness** → **LEAF: The Monumental Mode**
  *   **Break Chains** → **LEAF: The Critical Mode**
  *   **Just Understand Accurately** → **LEAF: [UNINHABITED]** (Incoherent: You already rejected "truth over action" at Question 2, so seeking accuracy without utility contradicts your prior commitment.)

  ***

  ### AWKWARD COMMITMENTS (Inhabited Leaves)

  *   **Suprahistorical:** Must explain why historical suffering and injustice don't matter if everything eternal is already complete.
  *   **Objective History:** Must defend why a knowledge that cripples the will is still considered a virtue.
  *   **Unhistorical:** Must explain how to maintain a coherent identity while deliberately erasing the source of that identity.
  *   **Antiquarian:** Must justify why mere age confers value, even when the old things are rotten or oppressive.
  *   **Monumental:** Must admit that inspiring examples often require simplifying or distorting the actual past to make them imitable.
  *   **Critical:** Must explain where you get the standard of justice used to judge the past, if not from history itself.

  ***

  ### INDISTINGUISHABLE LEAVES

  **The Unhistorical Stance** and **The Suprahistorical Stance**.
  The tree separates them by *metaphysical reason* (time vs. eternity), but in practice, both look identical: a refusal to engage in historical inquiry. Without asking *why* someone is ignoring the past, you cannot tell if they are doing so to act boldly (Unhistorical) or to contemplate art/essence (Suprahistorical).

  ***

  ### NOTE ON NIETZSCHE'S POSITION

  Nietzsche does not occupy a single leaf. He argues that a healthy culture requires **all three historical modes (Monumental, Antiquarian, Critical)** in dynamic balance, bounded by the **Unhistorical** and **Suprahistorical** horizons. He rejects **Objective History** entirely. Because this tree forces a single choice at every branch, it cannot represent his view; his position is a **meta-claim** about how to dose the inhabited leaves rather than a leaf itself.
