  ### The case for Mara

  Mara argues that epistemic value outweighs moral purity. Her core claim is that the utility of exposing fraud protects the community, regardless of the messenger's history. She steelmans the tu quoque objection: logically, a false premise does not invalidate a true conclusion. If we enforce a clean-hands rule, we create a perverse incentive where only those without experience in fraud can identify it, shrinking the pool of capable watchdogs. Furthermore, she contends that the moral defect here is hypocrisy, not falsehood. Hypocrisy is remedied by transparency; if Daniel discloses his past, the deception vanishes, leaving only the useful truth. For Mara, standing is a rhetorical shield used to protect wrongdoers from exposure, not a legitimate moral barrier. She prioritizes the outcome (investor safety) over the process (moral authority).

  ### The case for Tomas

  Tomas argues that blame is a speech act requiring moral authority, not merely information transmission. He distinguishes between reliability (credibility of facts) and standing (authority to demand accountability). A witness can testify truthfully without having the standing to prosecute. Tomas contends that Daniel's unacknowledged past creates a normative imbalance: he demands accountability from Leo without having submitted to it himself. This forfeits his right to blame. Disclosure fixes the deception but not the imbalance; standing requires submitted accountability, not just transparency. For Tomas, standing is load-bearing because it validates the demand for sanction. Without it, the call-out is an act of aggression rather than justice, undermining the normative structure of the community itself. He prioritizes the integrity of the accountability mechanism over the immediate exposure of fraud.

  ### Move-by-move adjudication

  (1) Mara: 3/5. She is logically sound regarding truth conditions; a proposition's validity is independent of its source. However, she mischaracterizes the speech act. A call-out is not just a fire alarm; it is a social sanction. By treating it purely as information transfer, she ignores the reputational harm inflicted by the accuser, which requires legitimacy. She assumes the only value is investor protection, ignoring the communal cost of illegitimate sanctioning. Her definition of blame is too thin; she treats blame as data, not a sanction.

  (2) Tomas: 5/5. He correctly identifies that the factual dispute is closed. The argument is entirely about the legitimacy of the speaker. This isolates the variable: standing. He rightly notes that truth does not confer authority. This move successfully shifts the debate from epistemology to ethics, forcing Mara to defend the right to blame, not just the right to speak. He defines standing as authority, not just credibility. This makes standing load-bearing for the ethical claim.

  (3) Mara: 3/5. Her slippery slope argument is potent: restricting critics to the pure eliminates most critics. This is a strong utilitarian defense. However, she fails to address why standing matters normatively. Calling it a "label" dismisses the social contract underlying public accountability. She protects the pool of critics but sacrifices the legitimacy of the criticism itself. She treats standing as a barrier to truth, not a requirement for justice. This undermines her utilitarian claim by ignoring long-term trust.

  (4) Tomas: 5/5. This is the strongest philosophical move. He separates epistemic credibility from normative authority. Blame is doing load-bearing work here as a specific social transaction requiring moral credit. Daniel has no credit to spend. Tomas clarifies that being a reliable witness does not grant the power to prosecute. This distinction holds the weight of his entire argument. Standing is the license to sanction. Without this distinction, the argument collapses into mere fact-checking. This is the load-bearing pillar.

  (5) Mara: 3/5. She correctly identifies hypocrisy as the root irritation. Disclosure solves the deception element. However, she assumes transparency grants authority. It does not; it only removes lying. She treats the audience's perception as the only metric, ignoring the objective imbalance in accountability between Daniel and Leo. She conflates honesty with moral equity. This fails to address the standing requirement. Transparency is not absolution.

  (6) Tomas: 5/5. He closes the loop. Standing requires submitted accountability. Daniel wants Leo to pay a price Daniel never paid. This imbalance invalidates the blame, regardless of disclosure. Tomas correctly identifies that blame is a demand for accountability, not just a statement of fact. This confirms standing is not a label, but a precondition for justice. Blame requires reciprocal submission. This solidifies standing as a precondition. Overall, Tomas's moves are more robust because they address the normative structure.

  ### What neither side isolated

  Neither side isolates the procedural mechanism that could resolve the tension: **automatic reciprocal scrutiny**. Mara assumes disclosure is enough; Tomas assumes past submission is required. Both miss that the act of accusing should *trigger* accountability for the accuser. If Daniel's call-out automatically invited an audit of his own history, the standing objection dissolves. The stalemate exists because they treat standing as a static precondition rather than a dynamic consequence. This approach reframes the public post not as a verdict but as an opening of a case file that includes the accuser. It transforms the social dynamic from hierarchical judgment to mutual exposure. This resolves the hypocrisy charge without silencing the witness. It acknowledges that in a transparent ecosystem, the accuser is always also a suspect. This consideration was absent from both frameworks, which treated standing as a binary status rather than a relational dynamic. They argue about permission, not consequence. If the norm is "accusations trigger audits," Daniel's history becomes relevant data, not a disqualifier. This shifts the burden from moral purity to procedural fairness.

  ### My verdict

  Tomas is more right overall. The dispute turns on the definition of **blame**. Mara treats blame as information; Tomas treats it as a sanction. In a professional community, a call-out is a sanctioning act that damages reputation, not merely a data point. Therefore, it requires moral authority. Daniel's failure to submit to accountability forfeits that authority. While Mara is correct that truth is valuable, Tomas correctly identifies that illegitimate sanctioning erodes trust in the accountability system itself. The verdict rests on Move 4: reliability does not grant prosecutorial power. Daniel can share evidence privately, but public blame requires standing. Tomas's framework preserves the integrity of social norms, whereas Mara's risks weaponizing truth without responsibility. The core error is Mara's conflation of speaking truth with demanding justice.
