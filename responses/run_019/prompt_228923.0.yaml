answer: |-
  # Maxwell's Demon: Diagnostic Flowchart

  ```text
  START: You accept Maxwell's setup allows sorting molecules. How is the Second Law saved?
  │
  ├─ Q1: Is the demon exorcised by a universal information-thermodynamics principle, 
  │      or by auditing specific mechanical failures (friction, thermal noise) in each device?
  │      │
  │      ├─ Specific Mechanical Failures ───────────────────────────────────────┐
  │      │                                                                      ▼
  │      │                                                           LEAF 1: Earman-Norton (Deflationary)
  │      │                                                           Commitment: No general exorcism exists, leaving 
  │      │                                                           the Second Law vulnerable to novel designs.
  │      │
  │      └─ Universal Information Principle ──────────────────────────────────┐
  │                                                                           ▼
  ├─ Q2: Is thermodynamic entropy fundamentally identical to information-theoretic entropy?
  │      │
  │      ├─ No (Merely Analogous) ────────────────────────────────────────────┐
  │      │                                                                    ▼
  │      ├─ Q3: Does the system require an external agent to reset memory, 
  │      │      or can it run autonomously on a resource stream (e.g., low-entropy tape)?
  │      │      │
  │      │      ├─ External Reset (Info-Flow Tracking) ──────────────────────┐
  │      │      │                                                            ▼
  │      │      │                                                  LEAF 2: Fluctuation-Theorem View
  │      │      │                                                  Commitment: The Second Law is only statistically 
  │      │      │                                                  valid, allowing transient individual violations.
  │      │      │
  │      │      └─ Autonomous Resource (No Reset) ───────────────────────────┐
  │      │                                                                   ▼
  │      │                                                         LEAF 3: Autonomous Tape-Driven
  │      │                                                         Commitment: Information is fuel, requiring a 
  │      │                                                         pre-existing low-entropy input stream.
  │      │
  │      └─ Yes (Identical) ────────────────────────────────────────────────┐
  │                                                                         ▼
  ├─ Q4: In a cyclic process, where is the mandatory entropy increase located?
  │      │
  │      ├─ During Measurement (Acquisition) ───────────────────────────────┐
  │      │                                                                  ▼
  │      │                                                        LEAF 4: Szilard's Original Answer
  │      │                                                        Commitment: Passive observation necessarily 
  │      │                                                        dissipates heat, even without recording.
  │      │
  │      └─ During Memory Reset (Erasure) ──────────────────────────────────┐
  │                                                                         ▼
  ├─ Q5: Does the erasure cost arise from classical phase-space compression 
  │      or quantum state manipulation (decoherence/collapse)?
  │      │
  │      ├─ Classical Phase-Space ──────────────────────────────────────────┐
  │      │                                                                  ▼
  │      │                                                        LEAF 5: Landauer-Bennett Orthodoxy
  │      │                                                        Commitment: Logical irreversibility physically 
  │      │                                                        mandates heat dissipation regardless of substrate.
  │      │
  │      └─ Quantum State Manipulation ─────────────────────────────────────┐
  │                                                                         ▼
  │                                                               LEAF 6: Quantum-Mechanical Resolution
  │                                                               Commitment: Thermodynamic accounting depends on 
  │                                                               the unresolved measurement problem in QM.
  ```

  ---

  ### Stress Test: Running Devices Through the Tree

  **1. One-shot Szilard Engine (Used once, discarded)**
  *   **Path:** Q1 (Universal) → Q2 (Yes) → Q4 (Measurement).
  *   **Landing:** **Leaf 4 (Szilard).**
  *   **Reasoning:** Since the device is not cyclic, no erasure occurs. If one insists the Second Law holds for this single shot without erasure, one must claim the measurement itself incurred the cost. (Note: Landauer-Bennett proponents would argue the Second Law is not violated here *until* reset is attempted, forcing a loop back to Q1 or Q4 depending on whether they view the single-shot as a "violation" needing exorcism).

  **2. Cyclic Szilard Engine (Finite memory tape that fills)**
  *   **Path:** Q1 (Universal) → Q2 (Yes) → Q4 (Erasure) → Q5 (Classical).
  *   **Landing:** **Leaf 5 (Landauer-Bennett).**
  *   **Reasoning:** The cycle cannot close without clearing the memory. The entropy debt is explicitly located in the reset of the finite tape to its blank state.

  **3. Feynman's Ratchet-and-Pawl**
  *   **Path:** Q1 (Specific Mechanical Failures).
  *   **Landing:** **Leaf 1 (Earman-Norton).**
  *   **Reasoning:** The device fails due to thermal fluctuations at the pawl allowing backward slip. No information processing is explicitly modeled, so the resolution lies in mechanical audit, not information principles.

  **4. Autonomous Tape-Driven Demon (No measurement step)**
  *   **Path:** Q1 (Universal) → Q2 (No) → Q3 (Autonomous Resource).
  *   **Landing:** **Leaf 3 (Autonomous Tape-Driven).**
  *   **Reasoning:** The demon consumes a structured input tape (resource) and outputs a randomized one. There is no external measurement or reset; the "cost" is the consumption of the tape's order.

  ---

  ### Critique & Diagnostics

  **Indistinguishable Leaves:**
  *   **Leaf 5 (Landauer-Bennett) vs. Leaf 6 (Quantum):** These collapse for most macroscopic purposes. Both locate the cost in erasure/reset. The distinction relies entirely on whether the substrate *must* be treated quantum mechanically to derive the cost. If Landauer's principle holds universally regardless of substrate (as Bennett argues), Leaf 6 is merely a specific instance of Leaf 5, not a distinct philosophical position.
  *   **Leaf 2 (Fluctuation) vs. Leaf 3 (Autonomous):** Both treat information as a resource/balance term rather than identical to entropy. The boundary is fuzzy: a fluctuation theorem can describe an autonomous tape demon. The tree forces a split on "External Reset," but modern resource theories often treat the tape as part of the system, blurring the "external" distinction.

  **Unoccupied Combinations:**
  *   **Q2 (No: Info ≠ Entropy) + Q4-path (Yes: Erasure Cost):** *Diagnosis: Incoherent.* If information is not thermodynamic entropy, there is no principled reason why erasing a memory register (a logical operation on information) must incur a thermodynamic heat cost. This position accepts the Landauer conclusion without the Landauer premise.
  *   **Q1 (Specific Mechanical) + Q2 (Yes: Info = Entropy):** *Diagnosis: Unattractive/Redundant.* If one believes Info = Entropy, one usually seeks a universal principle (Q1-Universal). Claiming the identity holds but only exorcising demons case-by-case defeats the purpose of the identity, rendering it a post-hoc label rather than an explanatory law.
