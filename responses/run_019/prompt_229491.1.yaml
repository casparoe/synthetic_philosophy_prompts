          *   *Option B (Different Line):* If DNA is *just* chemistry, then isolating gDNA *also* changes its chemical environment (breaking covalent bonds to remove it from the chromosome). A strict chemist might argue *both* are new chemical compositions (isolated vs. in situ). Or, a strict chemist might argue *neither* are inventions because the sequence is determined by nature, regardless of the lab technique.
      *   *Would the line move?*
          *   If the focus is purely on *structural novelty*: cDNA is structurally distinct from genomic DNA. So the line holds.
          *   If the focus is on *origin*: Both originate from natural templates. The line might vanish (nothing patentable).
          *   If the focus is on *isolation*: Isolating gDNA creates a molecule that doesn't exist freely in nature (it's usually chromosomal). A pure chemistry view might actually support patenting isolated gDNA *more* than the Supreme Court did, because the chemical bonds were broken to isolate it.
      *   *Conclusion on this point:* A "just chemistry" view creates tension. The Supreme Court actually rejected the "chemistry" argument for gDNA (saying isolation doesn't make it new) but accepted a "chemistry/structure" argument for cDNA (saying removing introns makes it new). This is arguably inconsistent if viewed purely through a chemical lens.

  5.  **Synthesize and Structure the Argument:**
