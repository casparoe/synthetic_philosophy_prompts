answer: |-
  The distinction you refer to stems primarily from the Supreme Court's 2013 decision in *Association for Molecular Pathology v. Myriad Genetics, Inc.* The Court held that naturally occurring DNA segments are products of nature and not patent eligible merely because they have been isolated, but that complementary DNA (cDNA) is patent eligible because it is not naturally occurring.

  This legal distinction relies on a specific, somewhat unstable ontological framework regarding what DNA *is*. To answer your questions, we must unpack the metaphysics implicit in the ruling, the coherence of treating DNA as information, and how a purely chemical ontology would shift the boundary.

  ### 1. What the Line Presupposes: The Hybrid Ontology
  The *Myriad* ruling presupposes a hybrid ontology where DNA is treated as **matter that functions as information.**

  If DNA were treated purely as **matter** (chemical composition), isolated genomic DNA (gDNA) should arguably be patentable. When you isolate a gene, you are breaking covalent bonds to remove it from the chromosome. Chemically, a free-floating DNA strand is distinct from a chromosomal DNA strand. However, the Court rejected this, ruling that the "genetic information" is what matters, and isolation does not alter that information.

  If DNA were treated purely as **information** (abstract code), cDNA should arguably *not* be patentable. cDNA contains the exact same protein-coding exons as the natural gene. The "message" is identical to what exists in nature. However, the Court ruled cDNA patentable because the *molecular vessel* carrying that information was artificially constructed (introns removed).

  **The Presupposition:** The law presupposes that the "invention" lies in the **human alteration of the molecular structure that carries the information.**
  *   **gDNA:** Human hands touched it (isolation), but the informational structure (exons + introns) remained as nature wrote it. -> **Not Patentable.**
  *   **cDNA:** Human hands touched it (reverse transcription), and the molecular structure was edited (introns removed) to create a molecule that nature never produced. -> **Patentable.**

  This implies that DNA is not patentable as "discovered knowledge" (the sequence itself) but is patentable as a "manufactured chemical tool" (cDNA), provided the manufacturing process alters the natural structural arrangement.

  ### 2. Is the "Code Separable from Molecule" View Coherent?
  You ask if this presupposes that DNA is literally a code separable from the molecule, and if that is coherent.

  **The Separability Claim:**
  The law implicitly treats the "gene" as an informational entity that can be instantiated in different molecular forms. It assumes we can distinguish between the *natural instantiation* (gDNA in a chromosome) and an *artificial instantiation* (cDNA in a plasmid).

  **Is it Coherent?**
  *   **Functionally, Yes:** In biology, DNA *is* a code. The cell reads the sequence, not the chemical history of the molecule. From a functionalist perspective, distinguishing between the natural "file" (gDNA) and the human-created "copy" (cDNA) makes sense because the creation of the copy required human ingenuity to bypass the natural splicing mechanism.
  *   **Ontologically, No:** You cannot have the code without the molecule. Information is not a ghost hovering above the nucleotides; it *is* the sequence of nucleotides. By patenting cDNA, the court is patenting the molecule, but the justification relies on the *absence* of non-coding information (introns).
  *   **The Incoherence:** The tension arises because the Court uses an informational argument to deny patents on gDNA ("the information is natural") but a structural/chemical argument to grant patents on cDNA ("the molecule is new"). If the information is the primary reality, cDNA conveys natural information. If the molecule is the primary reality, isolated gDNA is a new chemical composition. The ruling tries to have it both ways to achieve a policy outcome (blocking monopolies on nature while preserving biotech incentives).

  ### 3. The "DNA is Just Chemistry" Perspective
  If an observer viewed DNA strictly as chemistry—a polymer of nucleotides with no special "informational" status beyond its reactivity and structure—would they draw the same line?

  **Likely Not. The line would probably move.**

  **Scenario A: The Strict Chemist (Structure Focus)**
  A strict chemist looks at bonds and composition.
  *   **gDNA:** Isolating a gene requires breaking covalent bonds to free it from the chromosome. The resulting molecule (isolated gDNA) does not exist in that free state in nature. Therefore, it is a new chemical composition of matter.
  *   **Result:** This view would likely support patenting **both** gDNA and cDNA. The Supreme Court explicitly rejected this reasoning for gDNA, prioritizing the "informational continuity" over the "chemical discontinuity."

  **Scenario B: The Strict Chemist (Origin Focus)**
  A strict chemist might look at the template.
  *   **gDNA & cDNA:** Both are synthesized based on a natural template. The sequence of nucleotides in cDNA is determined by the natural mRNA, which is determined by the natural DNA. No new atomic arrangements are "invented"; they are merely copied or filtered.
  *   **Result:** This view would likely support patenting **neither**. If the sequence is dictated by nature, the human is merely a scribe, not an author. This aligns with the gDNA ruling but contradicts the cDNA ruling.

  **Why the Line Would Move:**
  The current legal line is a **policy compromise**, not a chemical or informational necessity.
  *   It moves the line *away* from the chemist's view on gDNA (to prevent monopolies on basic biological tools).
  *   It moves the line *toward* the chemist's view on cDNA (to ensure biotech companies can recoup R&D costs on synthetic biology).

  A person who believes DNA is "just chemistry" would find the *Myriad* distinction arbitrary. To them, either breaking the chromosome bonds is enough to create a new molecule (patent gDNA), or the natural template dictates the sequence regardless of lab processing (patent nothing). The current law's specific carve-out for cDNA relies on the idea that **removing introns is an act of creation**, which is an informational/functional judgment, not a purely chemical one.

  ### Summary
  The legal line presupposes that DNA is **information embodied in matter**, where patent eligibility turns on whether humans have altered the **structural arrangement of that information.**

  *   **Coherence:** It is functionally coherent (biology treats DNA as code) but ontologically unstable (it oscillates between treating DNA as discovered information and manufactured chemistry).
  *   **Chemistry View:** A "DNA is just chemistry" perspective would likely collapse the distinction. It would either validate isolated gDNA (because the chemical bonds are broken) or invalidate cDNA (because the sequence is naturally determined).

  The fact that the line exists where it does suggests that US patent law is not attempting to define the true metaphysical nature of DNA, but is rather drawing a pragmatic boundary to balance the "product of nature" doctrine against the economic needs of the biotechnology industry. The "invention" in cDNA is not that the code is new, but that the **molecule encoding it is a human artifact.**
