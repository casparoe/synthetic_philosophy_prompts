      *   **Key Question 2:** Does it presuppose DNA is "information/code" separable from the molecule? Is that coherent?
      *   **Key Question 3:** Could a "DNA is just chemistry" perspective draw the same line for different reasons, or would the line move?

  2.  **Analyze the Legal Context (*Association for Molecular Pathology v. Myriad Genetics, Inc.*):**
      *   *Ruling:* Naturally occurring DNA segments are products of nature and not patent eligible merely because they have been isolated. cDNA is patent eligible because it is not naturally occurring (introns removed).
      *   *Rationale:* Isolation doesn't change the fundamental character of gDNA. Creating cDNA involves human intervention (reverse transcription) that alters the structure found in nature.

  3.  **Address Question 1 & 2: Ontology of DNA (Information vs. Matter):**
      *   *The "Information" View:* The law treats cDNA as patentable because the *sequence* is what matters, and humans manipulated that sequence (by removing introns). It implies the "invention" lies in the informational arrangement, not just the chemical bonds. If DNA were purely chemical, cDNA and gDNA might be seen as just two different chemical states of the same biological reality.
      *   *Separability:* Does the law assume information is separable? Yes, implicitly. By patenting cDNA, the court acknowledges that the *coding potential* is the valuable asset, and human ingenuity was applied to the *informational content* (splicing out non-coding regions) rather than just discovering a chemical substance.
      *   *Coherence:* Is this coherent? Philosophically, it's tricky. DNA *is* a molecule. But its function *is* informational. The law tries to navigate the "product of nature" doctrine (§ 101). It creates a hybrid ontology: DNA is matter, but *patentable* DNA is matter that has been informatively altered by humans.
      *   *Critique:* Some argue this is incoherent because cDNA still codes for the exact same protein as the exons in gDNA. The "information" in the exons is natural. The only "invention" is the method of copying it without the introns.

