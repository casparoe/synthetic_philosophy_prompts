answer: |-
  **To:** Professor of Philosophy
  **From:** Legal Theory Consultant
  **Re:** Private Law Translation of Historical Reparations Claims
  **Date:** 24 May 2024

  ### Part I: The Private Law Restatement

  Here is the strongest backward-looking philosophical argument for reparations restated strictly within the vocabulary of private law. Where standard doctrine blocks the claim, I have introduced explicit fictional mechanisms to render the claim expressible.

  **1. The Cause of Action: Unjust Enrichment and Constructive Trust**
  We abandon Tort. A tort requires a breach of duty actionable at the time (*injuria*). Since slavery and colonial expropriation were often lawful *ex tunc*, a tort claim fails on the merits. Instead, we plead **Unjust Enrichment**.
  *   **The Enrichment:** The capital accumulation of the defendant (State or Corporation) derived from labour or assets taken without consent.
  *   **The At-The-Expense-Of:** The claimants' ancestors provided the value.
  *   **The Unjust Factor:** Here we require an invention. Standard private law requires the enrichment to be unjust *at the time of receipt* or *at the time of suit*. We introduce the **Retroactive Juristic Defect**. This fiction posits that while the positive law of the 18th century permitted the retention of benefits, the *natural law* basis for property (self-ownership) was violated, rendering the juristic reason for the enrichment void *ab initio* in equity, even if valid at common law.
  *   **The Remedy:** A **Constructive Trust** over the traceable proceeds. The defendant is not a debtor but a trustee *ex maleficio* holding assets that in conscience belong to the claimants.

  **2. Corporate Personality and Successor Liability**
  To link modern entities to historical actors, we apply the **Corporate Continuity Fiction**.
  *   **The Mechanism:** We treat the modern State (or chartered corporation) not as a sovereign power but as a *corporation sole* or a continuing legal person analogous to a company that has undergone multiple mergers and reconstructions.
  *   **Successor Liability:** Just as a successor company inherits the liabilities of a merged entity, the modern institution inherits the proprietary obligations of its predecessor. We bypass the rule that statutory bodies are not liable for *ultra vires* acts of predecessors by asserting that the *trust obligation* runs with the land and the capital, regardless of changes in constitutional structure.

  **3. Standing and Intergenerational Transmission**
  Private law generally adheres to *actio personalis moritur cum persona* (a personal action dies with the person). To transmit the claim across generations, we utilise the **Perpetual Fiduciary Continuum**.
  *   **The Mechanism:** We treat the ancestral group as a **Class of Beneficiaries** under a trust that never vested in the original trustees (the perpetrators).
  *   **Standing:** Current claimants are not heirs suing for a tort suffered by ancestors; they are residual beneficiaries of the constructive trust suing for the misappropriation of *their* equitable interest, which was held in suspense since the original wrong. The property right never passed; it remained in the class.

  **4. Causation and Tracing**
  Strict "but-for" causation is impossible over centuries. We substitute **Equitable Tracing**.
  *   **The Mechanism:** We do not need to prove specific dollars from specific slaves bought specific roads. We rely on the rule in *Re Hallett's Estate*: where mixed funds are used, the beneficiary can trace into the mixture and claim a charge over the acquired assets.
  *   **Application:** The national infrastructure and capital reserves are treated as a mixed fund containing the proceeds of the historical injustice. The claimants assert an equitable charge over the current asset base proportional to the input value.

  **5. Limitation Periods**
  Standard limitation statutes bar claims after 6–12 years. We invoke **Latent Equity**.
  *   **The Mechanism:** We argue the fraud was concealed by the structure of the law itself. Time does not run against a beneficiary where the trustee has concealed the breach. Since the "trustees" (the State) defined the law to conceal the unjust nature of the retention, the limitation period is suspended indefinitely until the juridical defect is recognised.

  ***

  ### Part II: The Residue Report

  This section analyses what survives the translation, what distorts, and what evaporates.

  #### 1. Clean Translations
  **Unjust Enrichment and Tracing.**
  This is the strongest fit. The philosophical intuition that "wealth held today is built on stolen value yesterday" maps neatly onto the law of unjust enrichment and equitable tracing. Private law is comfortable with the idea that title does not pass if the transfer lacks a juristic reason, and that value can be traced through mixed funds into current assets.
  *   **Verdict:** Private law is adequate here. The philosophical claim is essentially a proprietary claim disguised as a moral one.

  **Successor Liability (Corporate Continuity).**
  Private law already handles complex corporate succession. Treating the State as a continuing legal person is a stretch, but not a category error. It is analogous to a company changing its name or articles of association while retaining liability.
  *   **Verdict:** Private law is adequate, provided one accepts the State can be treated as a private legal person for this purpose.

  #### 2. Distorted Translations
  **(a) Wrongs Lawful When Committed.**
  *   **The Problem:** Private law is positivist. A duty must exist to be breached. If slavery was lawful, there was no breach of duty, and thus no "unconscionable" retention in the eyes of the court *at the time*. The **Retroactive Juristic Defect** invention is required to fix this. It essentially asks the court to apply a higher-order natural law to invalidate positive law transactions retrospectively.
  *   **Verdict:** **Private law reveals the philosophical vagueness.** The philosophical argument often conflates "morally wrong" with "legally actionable." Private law shows that without the *Retroactive Juristic Defect* fiction, there is no claim. The philosophy is trading on the ambiguity between *malum in se* and *malum prohibitum*. Private law is not missing a concept; it is correctly identifying that retrospective invalidation of lawful transactions destroys legal certainty, a core private law value.

  **(b) Intergenerational Persistence (Death of Parties).**
  *   **The Problem:** The **Perpetual Fiduciary Continuum** is a significant invention. In private law, trusts for persons not yet born are restricted by rules against perpetuities. Personal injury claims die with the victim. The philosophical claim insists the *harm* persists, but private law distinguishes between harm to the person (extinguished at death) and harm to the estate (transmissible).
  *   **Verdict:** **Private law is the wrong tool, but the philosophy is also suspect.** Private law lacks a mechanism for transmitting *personal* dignity harms across generations because it recognises the legal person as finite. However, the philosophical claim that a descendant suffers the *same* wrong as an ancestor is metaphysically dubious. Private law's refusal to transmit personal claims highlights that the "harm" being claimed is not a private law harm (loss to the individual) but a collective status harm.

  #### 3. No Private Law Counterpart
  **(c) The Expressive or Acknowledgement Function.**
  *   **The Problem:** Philosophers often argue reparations are about "acknowledgement," "dignity," or "moral repair." Private law remedies are *in personam* (compensation) or *in rem* (restitution). There is no private law action for "an apology" or "truth-telling" unless tied to defamation or specific contract terms. Damages are quantifiable; acknowledgement is not.
  *   **Verdict:** **Private law shows the philosophical claim is category-confused.** If the goal is acknowledgement, this is a public law or political aim, not a private right. Private law's failure to express this does not indicate a gap in private law; it indicates that the philosophical claim is not actually a claim for *justice between individuals* (corrective justice) but for *social recognition* (distributive or political justice). Using private law vocabulary here is a category error.

  ### Summary Conclusions

  1.  **On Unjust Enrichment:** The translation succeeds best here. If the philosophical case is grounded in the *retention of ill-gotten gains*, private law (specifically Equity) provides a robust vocabulary. The residue suggests the philosophical argument is strongest when framed as property restitution, not moral wrongdoing.
  2.  **On Legality and Time:** The translation fails without explicit fictions (*Retroactive Juristic Defect*, *Latent Equity*). This suggests the philosophical claim relies on a natural law override of positive law that private law systems explicitly reject to maintain certainty. The failure is not private law's deficiency, but a collision with the Rule of Law.
  3.  **On Expression:** The translation fails completely. Private law cannot accommodate "acknowledgement" as a remedy. This suggests that much of the philosophical discourse on reparations is actually political theory masquerading as corrective justice.

  **Final Verdict:** Private law acts as a rigorous filter. It validates the proprietary/restorative core of the reparations argument (via Trusts and UE) but strips away the expressive and retrospective punitive elements, revealing them as public law ambitions incompatible with private law's structure of bilateral, time-bound obligations. If the philosopher wishes to retain the expressive element, they must abandon private law vocabulary entirely. If they wish to use private law, they must accept the loss of the "acknowledgement" function and the constraint of lawful title at the time of receipt.
