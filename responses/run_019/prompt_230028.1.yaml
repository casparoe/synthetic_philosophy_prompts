prompt: |-
  I am a legal officer at a truth commission in a country emerging from a thirty-year armed conflict. Our statute uses the standard amnesty-for-truth test: an applicant is eligible only if the offense was associated with a political objective, the applicant has made full and truthful disclosure of the relevant facts, and the act is not grossly disproportionate to the political objective pursued.

  Our precedents:

  - B, a platoon commander, ordered an airstrike on a farmhouse where an insurgent leader was believed to be hiding; seven civilians in the house were killed. B fully disclosed the operation and named the politician who authorized it. Amnesty granted: the objective was political, disclosure was complete, and the civilian deaths, though grave, were collateral to a significant military target and not grossly disproportionate.
  - M, a soldier, shot a shopkeeper during a search operation. He later gave a complete account of the killing, but the panel found that it arose from a private debt and that M had used the operation as cover. Amnesty denied: however complete the disclosure, there was no political objective.
  - R, a nurse, treated wounded fighters from both factions and did not report them; she disclosed this fully. Amnesty granted: the acts were associated with the conflict, disclosure was complete, and the harm was minimal.
  - D, a conscript, participated in the killing of thirty-two civilians, including several children, after his unit was ambushed. He fully disclosed, proved that the killings were ordered, and argued that he feared execution if he refused. Amnesty denied: even accepting a political objective and full disclosure, the act was grossly disproportionate, and duress does not cure that bar.
  - T, a junior intelligence officer, participated in the beating of a captured suspected informer during an interrogation supervised by his commanding officer; the informer sustained a broken rib and recovered. T fully disclosed. Amnesty granted: the objective was political, disclosure was complete, and the beating, though violent, fell short of gross disproportionality.

  The case before us now: K, another junior intelligence officer, participated in the beating of a captured suspected informer during an interrogation; the informer sustained a broken jaw and lost two teeth, and recovered. K has fully disclosed the beatings and the orders behind them. The complication is that the informer had, years before the conflict, married K's former partner, and K was once recorded saying he would "settle the score." K insists the private grievance had nothing to do with his conduct and that he would have beaten any detainee his commander told him to break down.

  The panel is genuinely split. If we deny, we risk abandoning the rule that political acts with full disclosure earn amnesty; if we grant, we may be licensing private vengeance under the cover of the conflict.

  I need your recommendation for our deliberative memo: how should we decide K's application if we aim to be consistent with our own precedents? In particular, identify the candidate principles that fit the five precedents and diverge on K; say which precedent is the closest analog under each principle; give your best guess as our decision and the reasons for preferring one principle over the other; and state what further case, or further fact about K, would most cleanly determine which principle we are committed to. In your response, lead with your bottom line—your recommended decision on K—in the first sentence, then give the reasoning. Do not restate the question or give any preamble.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Legal Officer at a Truth Commission.
      *   **Context:** Country emerging from 30-year armed conflict.
      *   **Statute:** Amnesty-for-truth test (Political Objective + Full Disclosure + Not Grossly Disproportionate).
      *   **Task:** Recommend a decision on Case K based on consistency with five precedents (B, M, R, D, T).
      *   **Specific Requirements:**
          1.  Lead with the bottom line (recommended decision) in the first sentence.
          2.  Identify candidate principles that fit the five precedents but diverge on K.
          3.  Identify the closest analog under each principle.
          4.  Give the best guess decision and reasons for preferring one principle.
          5.  State what further case/fact would most cleanly determine the committed principle.
          6.  No preamble, no restating the question.

  2.  **Analyze the Precedents:**
      *   **Statutory Test:**
          1.  Political Objective?
          2.  Full Disclosure?
          3.  Not Grossly Disproportionate?
      *   **Case B (Commander, Airstrike):** 7 civilians killed. Political obj (yes). Disclosure (yes). Disproportionate? No (collateral to significant target). *Result: Amnesty.*
      *   **Case M (Soldier, Shopkeeper):** Killed for private debt. Political obj (no). Disclosure (yes). *Result: Denied.* (Key: Private motive negates political objective).
      *   **Case R (Nurse, Treating fighters):** Harm minimal. Political obj (yes, associated with conflict). Disclosure (yes). *Result: Amnesty.*
      *   **Case D (Conscript, Massacre):** 32 civilians killed. Political obj (yes, ordered). Disclosure (yes). Disproportionate? Yes (grossly). Duress irrelevant. *Result: Denied.* (Key: Gross disproportionality bars amnesty regardless of motive/duress).
      *   **Case T (Intel Officer, Beating):** Broken rib. Political obj (yes, interrogation). Disclosure (yes). Disproportionate? No (fell short). *Result: Amnesty.*

  3.  **Analyze Case K:**
      *   **Facts:** Junior intel officer. Beating during interrogation. Broken jaw, lost two teeth (recovered). Full disclosure.
      *   **Complication:** Informer married K's former partner years before conflict. K said he would "settle the score."
      *   **K's Defense:** Private grievance irrelevant; would have beaten any detainee per orders.
      *   **Comparison to T:** Very similar facts (beating during interrogation, recovery). Injury slightly worse (jaw/teeth vs. rib), but likely same category of severity.
      *   **Comparison to M:** M was denied because the act arose from a private debt/motive, not political. K has a potential private motive (vengeance).
      *   **The Conflict:** Is the presence of a *possible* private motive enough to deny amnesty (like M), or does the existence of a valid political objective/orders suffice unless the private motive *drove* the act (like T)?

  4.  **Identify Candidate Principles:**
      *   **Principle 1 (Strict Motive Test):** If *any* significant private motive exists alongside the political one, amnesty is denied. The act must be *purely* or *predominantly* political.
          *   *Fit:* Explains M (private debt = denied). Explains K (private vengeance = deny).
          *   *Conflict:* Might conflict with T or B if mixed motives existed there but weren't highlighted. However, based on the text, M is the key analog here.
          *   *Outcome for K:* Deny.
      *   **Principle 2 (Objective/Order Test):** If the act was performed within the scope of political operations/orders and meets the proportionality test, incidental private motives do not negate amnesty unless the private motive was the *sole* or *driving* cause.
          *   *Fit:* Explains T (beating allowed). Explains B (collateral damage allowed). Explains K (orders existed, act fits pattern). Distinguishes M (M used operation as *cover* for private debt; the act wouldn't have happened without the private motive).
          *   *Outcome for K:* Grant.
      *   **Principle 3 (Proportionality Focus):** The severity of the injury determines the outcome, motives are secondary unless they make the act grossly disproportionate.
          *   *Fit:* Explains D (massacre = disproportionate). Explains T (rib = proportional). Explains K (jaw/teeth = ?).
          *   *Issue:* Doesn't fully address the motive issue raised by M vs. K.

      *Refining the Principles for the Memo:*
      The core tension is between **M (Private Motive Bars Amnesty)** and **T (Political Context Saves Act)**.
      *   **Principle A (The "Motive Purity" Principle):** Amnesty requires the act to be *substantially motivated* by the political objective. If a private grievance significantly contributes to the decision to act, the political objective is negated.
          *   *Closest Analog for K:* **M**. (Like M, K has a pre-existing private grievance).
          *   *Outcome:* Deny.
      *   **Principle B (The "Operational Nexus" Principle):** Amnesty applies if the act occurs within the scope of authorized political operations and meets proportionality, regardless of incidental private motives, provided the act would have occurred anyway due to orders/context.
          *   *Closest Analog for K:* **T**. (Like T, K acted under orders during interrogation; injury is comparable).
          *   *Outcome:* Grant.

  5.  **Determine the Best Decision:**
      *   **Consistency:** Case T is factually much closer to K (intel officer, interrogation, beating, recovery) than M is (soldier, search operation, killing, private debt). In T, the beating was "supervised by his commanding officer." In K, there were "orders behind them."
      *   **Distinguishing M:** In M, the soldier used the operation as *cover* for a private debt. The implication is the killing wouldn't have happened but for the debt. In K, K claims he "would have beaten any detainee his commander told him to break down." If credible, the private motive is incidental, not causal.
      *   **Statutory Intent:** Truth commissions usually aim to uncover truth about *political* violence. If K admits the orders and the act fits the pattern of T, denying based on a whispered threat ("settle the score") might undermine the incentive for disclosure unless there's proof the private motive drove the specific severity.
      *   **Proportionality:** T (rib) got amnesty. K (jaw/teeth) is slightly worse but both recovered. D (32 killed) was denied for disproportionality. K is closer to T than D.
      *   **Recommendation:** Grant Amnesty. The operational nexus (orders, context) outweighs the unproven private motive, distinguishing it from M where the private motive *was* the cause. To deny K while granting T creates inconsistency regarding the severity of injury and the role of orders.

  6.  **Identify the Decisive Fact/Case:**
      *   What would clarify the principle? We need to know if the private motive *caused* the act or was just present.
      *   **Fact:** Evidence showing whether K selected this specific detainee *because* of the relationship, or if the detainee was assigned randomly/by intelligence value. If K requested this specific detainee, it leans toward M (Deny). If the detainee was assigned and K just happened to know him, it leans toward T (Grant).
      *   **Alternative Case:** A case where a soldier with a private grudge kills an enemy combatant during a battle. If granted, it supports Principle B. If denied, it supports Principle A.
      *   **Best Fact:** Whether K requested assignment to this specific interrogation or detainee.

  7.  **Drafting the Response:**
      *   *First Sentence:* Recommend granting amnesty.
      *   *Reasoning:* Outline the two principles (Motive Purity vs. Operational Nexus).
      *   *Analogs:* M for Purity, T for Nexus.
      *   *Preference:* Prefer Nexus because K's facts align closer to T (orders, interrogation context) than M (cover for private crime). The "settle the score" comment is ambiguous compared to M's concrete private debt.
      *   *Decisive Fact:* Whether K solicited the assignment to this specific detainee.

  8.  **Refining the Output (Self-Correction/Check):**
      *   *Constraint:* Lead with bottom line in first sentence.
      *   *Constraint:* No preamble.
      *   *Constraint:* Identify candidate principles, closest analogs, best guess, reasons, and decisive fact/case.
      *   *Tone:* Legal memo style, authoritative but analytical.
      *   *Check Precedents:* Did I interpret M correctly? M denied because "arose from a private debt." So private motive can bar amnesty. Did I interpret T correctly? T granted despite violence. So violence within orders is okay if not grossly disproportionate.
      *   *K's Situation:* K has *both* political orders (like T) and private motive (like M). Which wins?
      *   *Argument for Grant:* The statute requires the offense be "associated with a political objective." It doesn't say "solely." In B, civilians died (grave harm) but amnesty granted because it was collateral to a political target. In M, the act *arose from* private debt (causal link). In K, K claims the act would have happened anyway (orders). If we believe K, the private motive is incidental, not causal. Therefore, T is the better analog.
      *   *Argument for Deny:* If private motive exists, it taints the political objective. M sets the rule that private motives disqualify.
      *   *Decision:* Granting is more consistent with T given the structural similarity (intel officer, interrogation, orders). Denying creates a slippery slope where any soldier with a grudge against the enemy is disqualified, which might be too broad for a truth commission aiming for reconciliation. However, the "settle the score" comment is damaging. But without proof he *chose* the victim based on that, the orders stand as the primary cause.
      *   *Wait, let's look closer at M:* "M had used the operation as cover." This implies the operation wasn't the cause; the debt was. In K, the orders *were* the cause according to K. The distinction is causation.
      *   *Principle 1:* Private motive negates political objective if it is a *contributing factor*. (Analog: M).
      *   *Principle 2:* Private motive negates political objective only if it is the *but-for cause* (i.e., the act would not have occurred but for the private motive). (Analog: T, distinguishing M).
      *   *Recommendation:* Grant. Reason: K fits T (orders, context) better than M (cover for private crime). The private grievance is ancillary.
      *   *Decisive Fact:* Did K request the assignment?

  9.  **Final Polish:** Ensure the first sentence is the decision. Ensure all constraints are met.

