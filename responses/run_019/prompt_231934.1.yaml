prompt: |-
  I've ended up defending a version of process supervision in my research group, and I want to know how exposed it is. The view I've been pushing is not just that process-based reward models outperform outcome-based ones on the MATH benchmark, but that process supervision is the right kind of supervision for alignment in any reasoning-heavy domain. I know the Lightman et al. paper "Let’s Verify Step by Step" (2023) points out that earlier work found outcome and process supervision gave similar results in grade-school maths, so the empirical story is less one-sided than people sometimes assume. Still, the conceptual argument seems strong to me. They write:

  "It provides more precise feedback, since it specifies the exact location of any errors that occur. It also has several advantages relevant to AI alignment: it is easier for humans to interpret, and it more directly rewards models for following a human-endorsed chain-of-thought."

  My position is roughly: when a task is solved through a decomposable chain of reasoning and human evaluators can reliably label intermediate steps, process supervision should be the default; outcome supervision is a useful fallback when step-level labels are unavailable, but it is always a compromise because it allows models to earn reward through bad reasoning that happens to land on the right answer. What I'd like from you is a serious map of what would count against this position, or at least force me to qualify it. Include experimental results that already exist, possible future findings, and conceptual objections. Rank them from fatal to merely awkward. Also tell me honestly whether the view as I've stated it has been insulated into unfalsifiability, because I can feel myself wanting to say that any failure is just a failure of label quality or benchmark design, and I don't know how seriously to take that impulse. And please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is defending "process supervision" (PS) over "outcome supervision" (OS) in a research group, specifically for alignment in reasoning-heavy domains.
      *   **Core Claim:** PS should be the default when tasks are decomposable and humans can label steps. OS is a compromise that allows "right answers via bad reasoning."
      *   **Evidence Cited:** Lightman et al. (2023) "Let's Verify Step by Step" (acknowledges mixed earlier results but emphasizes conceptual advantages).
      *   **Task:** Map out arguments/evidence *against* this position (experimental, future, conceptual). Rank them from fatal to awkward. Assess unfalsifiability risks.
      *   **Tone/Style:** Serious, analytical, honest.
      *   **Language:** British English (e.g., "labelled," "programme," "maths," "favour").

  2.  **Deconstruct the Position:**
      *   *Premise 1:* Reasoning is decomposable.
      *   *Premise 2:* Humans can reliably label intermediate steps.
      *   *Conclusion:* PS is superior for alignment.
      *   *Underlying Assumption:* Aligning the *process* aligns the *agent* better than aligning the *outcome*, specifically regarding generalisation and robustness (Goodhart's Law).

  3.  **Brainstorming Counter-Arguments (The "Map"):**

      *   *Empirical/Experimental:*
          *   Lightman et al. themselves show PS is expensive (needs more labels).
          *   Uesato et al. (2022) found OS and PS similar on GSM8K (grade school math).
          *   Scalability: Can humans actually label steps for *hard* problems (e.g., research-level math, coding)?
          *   Distributional Shift: Does PS generalise better out-of-distribution (OOD)? Some evidence suggests OS might be more robust if the process is too constrained.
          *   Sycophancy/Over-optimisation: Models might learn to write "plausible-looking" steps rather than "correct" steps to please the PRM (Process Reward Model).

      *   *Conceptual/Theoretical:*
          *   *The Credit Assignment Problem:* If a step is locally correct but globally leads to a dead end, how do you label it? (Lookahead issue).
          *   *Non-decomposability:* Not all reasoning is linear. Some is holistic, intuitive, or requires backtracking that looks like an error.
          *   *Specification Gaming:* A PRM can be gamed just like an ORM (Outcome Reward Model). "Sounding right" vs. "being right."
          *   *Cognitive Misalignment:* Human reasoning $\neq$ Model reasoning. Forcing models to mimic human steps might cap capability or induce inefficiency.
          *   *The "Right Answer, Wrong Reason" nuance:* Sometimes heuristic reasoning works where formal reasoning fails. Penalising heuristics might hurt capability.

      *   *Unfalsifiability Check:*
          *   The user admits a tendency to blame "label quality" or "benchmark design."
          *   If PS fails, is it because PS is bad, or because the *process labels* were bad? This is a key vulnerability.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the strength of the position (it's the current orthodoxy for good reason) but validate the need for scrutiny.
      *   **Section 1: The Unfalsifiability Trap:** Address this first as it's a meta-concern about the research stance.
      *   **Section 2: The Map of Objections (Ranked):**
          *   *Fatal/Severe:* Scalability of human labels, Non-decomposability, The Lookahead/Credit Assignment problem.
          *   *Significant/Qualifying:* Sycophancy in PRMs, Human-Model Cognitive Mismatch, Cost-Efficiency Trade-off.
          *   *Awkward/Nuanced:* Heuristic reasoning, OOD generalisation ambiguity.
      *   **Section 3: Future Findings to Watch:** What experiments could change the mind?
      *   **Conclusion:** Summary advice.

  5.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* labelled, favour, programme, generalisation, modelling.
      *   *Vocabulary:* "reckon," "whilst," " amongst," "maths."
      *   *Tone:* Academic but direct.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "PS is hard." I need to explain *why* it might be the *wrong* objective for alignment.
      *   *Key Point:* Alignment is about *intent* and *robustness*. Does PS actually fix intent, or just make the model better at hiding errors?
      *   *Key Point:* The "Process" might be instrumentally convergent. The model learns to satisfy the PRM, not to be truthful.

      *(Refining the Unfalsifiability section)*: This is crucial. If the user says "PS failed because the labels were noisy," they are protecting the core theory from data. I need to point out that if *reliable* labels are impossible to get for complex tasks, then the theory "PS is default for reasoning-heavy domains" collapses because the precondition (reliable labels) is never met.

  6.  **Review against Constraints:**
      *   British English? Yes.
      *   Ranked objections? Yes.
      *   Unfalsifiability check? Yes.
      *   Specific references (Lightman, Uesato)? Yes.

  7.  **Final Polish:** Check for clarity and ensure the distinction between "Process Supervision" (training signal) and "Process Reward Models" (inference/verification) is clear, though they are often linked. The user is talking about training/alignment (RLHF with process rewards).

      *Wait, one nuance:* The user says "process supervision is the right kind of supervision for alignment." This implies training. Lightman et al. mostly discuss PRMs for verification/selection, but also touch on training. I should clarify that training with dense rewards is the claim.
      *Actually, Lightman et al. train a PRM and use it for Best-of-N or fine-tuning. The user's claim is about the *supervision signal* itself.*
