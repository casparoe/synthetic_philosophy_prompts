answer: |-
  **MEMORANDUM**

  **TO:** The Collections Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Restitution of the Benin Plaque (Accession No. 1898.45)

  **1. Introduction and Context**

  Two years ago, this committee commissioned an independent provenance review regarding our single Benin Bronze plaque. The findings are unequivocal: the object was removed during the 1897 British Punitive Expedition and acquired by our founder via auction in 1898. We have accepted the Director's premise that the object was looted and that our moral obligation is to "make things right."

  However, "making things right" has revealed complex fault lines. We face competing external claims (the Nigerian Federal Government vs. the Oba of Benin's Court) and conflicting internal pressures (immediate unconditional return vs. retained access via loan). This memo outlines a course of action that satisfies our legal charter, adheres to the principles of corrective justice, and navigates the competing claims of the wronged community's heirs.

  **2. The Question of Corrective Justice: Who is the Rightful Recipient?**

  We must not treat the choice of recipient as merely a diplomatic formality. In restitution ethics, the identity of the recipient is the substance of the justice being served. If we return an object to the wrong entity, we may cure the theft but commit a new erasure.

  *The Federal Claim:* The National Commission for Museums and Monuments (NCMM) asserts state ownership based on Nigerian national law (Decree 77 of 1979). Their proposal ensures the object remains in the public sphere, aligning with museum standards of accessibility and curation.
  *The Royal Claim:* The Oba's Court argues that the bronzes were dynastic property, integral to the spiritual and political continuity of the Kingdom of Benin. The modern Nigerian state did not exist in 1897; the Kingdom did. To transfer title to the state is to validate the colonial erasure of the Kingdom's sovereignty.

  *Assessment:* The principle of corrective justice requires restoring the victim to the position they would have occupied had the wrong not occurred. The victim in 1897 was the Kingdom of Benin, embodied by the Oba. Therefore, moral priority lies with the Oba's Court. However, we operate within a modern legal framework where the NCMM is the recognized legal successor for cultural heritage. To ignore the NCMM risks legal impasse; to ignore the Oba risks moral failure.

  **3. Engagement with Internal Stakeholders**

  Before proposing a solution, I wish to articulate the strongest versions of the opposing views circulating within our university community, as they highlight genuine ethical risks in my recommendation.

  *The Student and Faculty Coalition:*
  Their position is that "process is delay." They argue that because the theft is admitted, any deliberation regarding *how* to return the object is a continuation of colonial control. They contend that conditional restitution—where the returner sets terms regarding the recipient or future display—re-centers European authority over African heritage. For them, justice is binary: the object is stolen, therefore it must leave immediately, with no stipulations.
  *Why this must be set aside:* While morally urgent, an unstructured immediate handover exposes the transfer to legal challenge under our own national laws and charter. If a transfer is deemed illegal *ex post facto*, it could be reversed, causing greater instability for the recipients. We must ensure the return is permanent and legally unassailable. Speed cannot compromise finality.

  *The Senior Donor:*
  The donor argues that restitution should not equate to the "erasure" of our museum's educational mission. They propose a permanent loan and digitization project, allowing us to retain the physical object for our public while funding access in Nigeria. They posit that our local students also deserve access to world heritage and that emptying European museums solves nothing if it creates empty galleries there.
  *Why this must be set aside:* A permanent loan presupposes continued ownership. We cannot ethically claim ownership of looted property. To offer a loan is to imply we have the right to lend what we do not rightfully own. Furthermore, digitization is a valuable tool for partnership, but it cannot substitute for physical sovereignty. We can fund digitization *after* transfer as partners, not as owners conditioning the return.

  **4. The Charter Constraint**

  Our founding charter forbids deaccessioning into "private hands." This is the primary legal hurdle regarding the Oba's Court. However, classifying the Oba's Court as a "private collector" is a category error. The Court functions as a public cultural trust and a sovereign traditional institution. In the context of restitution, transfers to recognized traditional authorities are increasingly viewed in international law as transfers to public institutions, distinct from private commercial sales. Nevertheless, to mitigate risk, the transfer should be executed through the recognized state authority.

  **5. Recommendation: Structured Title Transfer**

  I recommend that the committee vote to **transfer full legal title to the Federal Republic of Nigeria (via the NCMM), with a binding, public agreement that physical custody and curatorial authority be vested in the Oba of Benin's Palace (or the Edo Museum of West African Art acting on its behalf).**

  This "State-to-State, Custody-to-Community" model offers the following advantages:

  1.  **Charter Compliance:** By transferring title to the NCMM, we satisfy the charter's prohibition on private transfer. The NCMM is a public body.
  2.  **Corrective Justice:** By contractually stipulating that custody resides with the Oba, we acknowledge the historical victim and the cultural lineage of the object. We respect the Oba's sovereignty without violating the modern state's legal framework.
  3.  **Diplomatic Stability:** This aligns with the recent "Benin Dialogue Group" precedents, where European museums transfer title to the Nigerian state, which then allocates objects to the Edo Museum of West African Art (EMOWAA).
  4.  **Educational Continuity:** We can negotiate a partnership agreement (separate from ownership) that allows for high-resolution digitization and potential long-term loans of *other* materials, preserving our educational mission without retaining stolen property.

  **6. Motion for Vote**

  I propose the committee vote on the following resolution at next month's meeting:

  > *Resolved, that the Collections Committee authorizes the Director to initiate the unconditional transfer of legal title of Accession No. 1898.45 to the National Commission for Museums and Monuments of the Federal Republic of Nigeria.*
  >
  > *Be it further resolved, that this transfer is contingent upon a written agreement between the NCMM and the Museum ensuring that physical custody of the plaque is vested in the Oba of Benin's Court or its designated public cultural institution (e.g., EMOWAA), and that the Museum shall pursue a separate partnership agreement for digitization and educational exchange post-transfer.*

  **7. Conclusion**

  This path rejects the donor's attempt to retain ownership and rejects the notion that bureaucratic caution should halt restitution. It acknowledges that while the students are right about the urgency, they are wrong to assume that legal precision is an obstacle rather than a safeguard. It recognizes that while the Oba is the moral heir, the State is the legal heir, and we must bridge that gap to ensure the plaque returns home to stay.

  I look forward to discussing this framework with the committee.
