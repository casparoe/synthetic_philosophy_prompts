answer: |-
  You have put your finger on one of the oldest and most robust findings in social choice theory. The phenomenon you are describing is called **Agenda Control** (or **Agenda Setting Power**), occurring within a system of **Sequential Pairwise Voting**.

  While your intuition about "gaming" is correct, the specific theorem you are recalling likely conflates two different ideas. The theorem about voters lying is the **Gibbard-Satterthwaite Theorem**. The phenomenon you are witnessing, however, does not require voters to lie. It relies entirely on the structure of the voting method itself.

  Here is an explanation of what is happening, why it differs from the theorems you recall, and precisely where the limits of this power lie.

  ### 1. The Mechanism: Why Order Matters
  The phenomenon occurs because your committee's collective preferences are **intransitive**. In everyday language, this means the group's will forms a cycle rather than a straight line.

  Imagine three voters (1, 2, 3) and three candidates (A, B, C).
  *   Voter 1 prefers: A > B > C
  *   Voter 2 prefers: B > C > A
  *   Voter 3 prefers: C > A > B

  If you hold a head-to-head vote between any pair, the majority wins:
  *   **A vs. B:** A wins (Voters 1 and 3 prefer A).
  *   **B vs. C:** B wins (Voters 1 and 2 prefer B).
  *   **C vs. A:** C wins (Voters 2 and 3 prefer C).

  This is known as the **Condorcet Paradox**. There is no single candidate who can beat everyone else. Because there is no clear "best" candidate, the *path* taken to reach the decision determines the destination. This is often called **Path Dependence**.

  If the chair sets the agenda as **(A vs. B), then Winner vs. C**:
  1.  A beats B.
  2.  C beats A.
  3.  **C wins.**

  If the chair sets the agenda as **(B vs. C), then Winner vs. A**:
  1.  B beats C.
  2.  A beats B.
  3.  **A wins.**

  Every voter voted sincerely in both scenarios. No rules were broken. Yet the chair, simply by choosing the order, selected the winner. In the literature, this is often discussed under the heading of **Manipulation of the Agenda**.

  ### 2. How This Differs from Arrow and Gibbard-Satterthwaite
  You mentioned a "famous theorem" about gaming. It is important to distinguish the phenomenon you see from the two major impossibility theorems in this field.

  **The Gibbard-Satterthwaite Theorem**
  This theorem states that for any ranked voting system, one of three things must be true:
  1.  One person is a dictator.
  2.  Only two options are available.
  3.  Voters can sometimes benefit by **lying** about their preferences (strategic voting).

  You correctly noted that this theorem focuses on voters misrepresenting their wants. In your committee, voters are *not* doing this. They are voting sincerely. Therefore, Gibbard-Satterthwaite explains why your system *could* be gamed by voters, but it does not explain why it is being gamed by the chair.

  **Arrow's Impossibility Theorem**
  Arrow's theorem concerns the difficulty of aggregating individual rankings into a consistent group ranking. One of Arrow's criteria is **Independence of Irrelevant Alternatives (IIA)**. This criterion essentially says that the group's preference between A and B should not depend on whether C is also in the race.
  Your voting method violates IIA. By introducing C in the second round, the outcome between A and B changes. Arrow proves that no ranking system can satisfy all reasonable criteria simultaneously. Your sequential voting method is one of the systems that fails this test, allowing the agenda setter to exploit that failure.

  **The Phenomenon You Describe: Agenda Control**
  The specific literature you are looking for falls under **Social Choice Theory** and **Legislative Voting Procedures**. The key insight here is that when preferences cycle (Condorcet Paradox), the **agenda setter acts as a de facto dictator**, even if they have no vote themselves.
  A famous result in this specific area is **McKelvey's Chaos Theorem** (1976). It demonstrates that in a multidimensional policy space (like budget plans or hiring criteria), if there is no Condorcet Winner, an agenda setter can construct a sequence of votes that leads from *any* starting point to *any* desired outcome, even with sincere voting.

  ### 3. The Edges: When Order Does Not Matter
  You asked for the precise conditions where this power vanishes. There are two main scenarios where the chair's sequencing cannot change the outcome.

  **Scenario A: Existence of a Condorcet Winner**
  A **Condorcet Winner** is a candidate who would beat every other candidate in a head-to-head matchup.
  *   If a Condorcet Winner exists, they will win *any* sequential pairwise tournament, regardless of the order.
  *   *Why?* Because they cannot be eliminated. They will defeat whoever they face in the final round, and they will defeat whoever they face in earlier rounds.
  *   *The Edge:* The chair's power exists **if and only if** there is **no** Condorcet Winner. If your committee agrees strongly enough on one candidate that they beat everyone else one-on-one, the agenda order is irrelevant.

  **Scenario B: Single-Peaked Preferences**
  This is a more subtle but common constraint. Preferences are **single-peaked** if all options can be arranged along a single spectrum (e.g., Left to Right, or Low Budget to High Budget), and every voter prefers options closer to their ideal point.
  *   *Example:* If the choice is a budget size ($10k, $20k, $30k), and no voter prefers $10k over $30k *and* $30k over $20k (i.e., no one wants extremes over the middle), preferences are single-peaked.
  *   **Black's Median Voter Theorem:** If preferences are single-peaked, a Condorcet Winner always exists (it is the median voter's ideal point).
  *   *The Edge:* If your committee's preferences align along a single dimension, cycles cannot form, and the agenda setter loses their power. The chaos arises when preferences are multidimensional (e.g., weighing "experience" against "diversity" against "cost" simultaneously).

  ### 4. Summary and Terminology
  To summarize your situation for the committee:

  1.  **The Name:** You are experiencing **Agenda Control** within a **Sequential Pairwise Voting** system.
  2.  **The Cause:** The group has **Cyclical Preferences** (a **Condorcet Paradox**), meaning there is no consensus candidate who beats all others head-to-head.
  3.  **The Distinction:** This is not **Strategic Voting** (Gibbard-Satterthwaite), where voters lie. This is **Procedural Manipulation**, where the rules allow the order of operations to dictate the result despite sincere voting.
  4.  **The Limit:** The chair's power disappears if a **Condorcet Winner** exists. This is guaranteed if preferences are **Single-Peaked** (align on one spectrum).

  ### 5. Practical Implications
  If you wish to mitigate this, you have three options derived from the literature:

  *   **Check for a Condorcet Winner first:** Run all pairwise comparisons. If one candidate beats everyone else, select them immediately. This neutralizes the agenda setter.
  *   **Change the Voting Method:** Use a system less susceptible to agenda manipulation, such as the **Borda Count** (ranking candidates by points) or **Approval Voting**. Note that Gibbard-Satterthwaite implies these can still be gamed by *voters* lying, but they remove the *chair's* power to set the sequence.
  *   **Randomize the Agenda:** If the order must be sequential, randomize the voting tree. This prevents the chair from engineering a specific path.

  You have correctly identified that in the absence of a clear consensus, procedure is substance. The chair is not breaking the rules; they are exploiting the fact that the rules do not produce a unique solution when the group is deeply divided.
