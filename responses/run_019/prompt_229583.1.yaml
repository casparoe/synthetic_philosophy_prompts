          5.  Tone: American English, explanatory, not just a label.

  2.  **Identify the Core Concept:**
      *   The phenomenon is **Agenda Control** or **Agenda Setting Power** within the context of **Sequential Pairwise Voting**.
      *   The specific theoretical underpinning is the **Condorcet Paradox** (cyclical majorities).
      *   The specific manipulation is **Manipulation of the Agenda** (distinct from manipulation of votes).
      *   The relevant theorem regarding the *voters* lying is the **Gibbard-Satterthwaite Theorem**.
      *   The relevant theorem regarding the *system's* consistency is **Arrow's Impossibility Theorem**.
      *   The specific result about the chair controlling the outcome via order is often associated with **McKelvey's Chaos Theorem** (in spatial voting) or simply the properties of **Path Dependence** in social choice.
      *   However, the most direct label for the *phenomenon* described is **Agenda Manipulation** or the **Power of the Agenda Setter**. In the context of sequential pairwise voting, it's often illustrated via the **Condorcet Cycle**.

  3.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the observation. It's astute and well-documented. Give the name immediately: **Agenda Control** (or Agenda Setting Power) in the context of **Sequential Pairwise Voting**.

      *   **The Mechanism (How it works):** Explain *why* this happens. It requires **Cyclical Preferences** (Condorcet Paradox).
          *   Example: A > B > C > A.
