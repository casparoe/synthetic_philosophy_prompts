  | :--- | :--- | :--- | :--- | :--- |
  | **Cinema** | A more potent poison than theater, perfecting the illusion to paralyze the will. | Pity at a distance (emotional catharsis without moral action). | The illusion is technologically perfect, making the "wake up" to reality harder than leaving a playhouse. | High (The structural passivity matches his critique exactly). |
  | **Streaming TV** | The atomization of the citizen; luxury brought into the bedroom to destroy the family. | Civic passivity & Luxury (intemperance/lack of self-regulation). | Consumption is private and asynchronous, dissolving the "shared time" required for a public sphere. | High (Aligns with his fears of domestic isolation and loss of common mores). |
  | **VR Roleplay** | A dangerous mimicry of the Civic Festival; activity without consequence feeds vanity. | The Actor's self-alienation (living as another) & Amour-propre. | The spectator becomes the actor, mimicking his praised *Fête*, but the action is simulated, not real. | Medium (He praised participation, but would likely reject virtual action as "false"). |
