      *   *Instability:* Newton genuinely believed gravity alone would cause the solar system to collapse or disperse over time. Comets needed guidance; planets needed stabilization. This wasn't just a gap in his math; it was a theological feature.
      *   *Will vs. Nature:* For Newton, laws of nature are not necessary truths (like logic); they are decrees of God's will. They could have been otherwise.

  3.  **Analyze the "Fine-Tuning" Concept through Newton's Eyes:**
      *   *The Appeal:* Fine-tuning shows the universe isn't self-explanatory. It requires a Chooser. This aligns with Newton's view that laws are contingent on God's will.
      *   *The Tension:* Fine-tuning usually implies a "set and forget" mechanism. If the constants are set perfectly at $t=0$, does the universe run autonomously? If so, where is God's *present* dominion?
      *   *Leibniz's Critique:* Leibniz argued for a perfect God who creates a perfect machine needing no repair. Newton rejected this. If fine-tuning makes the universe a perfect machine, Newton might reject the *implication*, even if he likes the *evidence*.

  4.  **Identify the Specific Tensions (The "Conflicting Pressures"):**
