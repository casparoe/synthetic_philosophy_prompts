answer: |-
  # Desiderata for a Formal Theory of Simplicity and Priors

  **Context:** Graduate Seminar in Formal Epistemology
  **Subject:** Specification of Requirements for Simplicity-Based Prior Probabilities

  The following document specifies the job description for any adequate theory linking simplicity to prior probability. It is designed to evaluate candidate accounts (e.g., Solomonoff Induction, Minimum Description Length, Objective Bayesianism) by clarifying what problems they must solve, which trade-offs they must acknowledge, and where logical tensions render a "perfect" theory impossible.

  ---

  ## I. Core Desiderata

  ### 1. The Normative/Epistemic Gap (Truth-Tracking vs. Pragmatic Utility)
  An adequate account must explicitly distinguish between two claims:
  *   **(A) The Assignment Rule:** The theory provides a formal rule for assigning higher prior probability to simpler hypotheses (e.g., $P(H) \propto 2^{-K(H)}$).
  *   **(B) The Truth-Tracking Justification:** The theory explains *why* nature should be expected to conform to this assignment rule (i.e., why simpler hypotheses are more likely to be *true*, not just more useful).

  **Requirement:** The theory must state whether it offers a pragmatic justification (simplicity minimizes expected loss/coding length) or an epistemic justification (simplicity correlates with objective chance/truth). It must clarify if (A) can be rationally adopted without (B).
  *   *Status:* **Non-negotiable.** A theory that assigns priors without clarifying their normative force is merely an algorithm, not an epistemology.

  ### 2. The Language Relativity Constraint (The Additive Constant Problem)
  Any complexity measure $K(x)$ is defined relative to a reference machine or language $L$. The Kolmogorov Invariance Theorem guarantees that for two universal machines $U_1, U_2$, $|K_{U_1}(x) - K_{U_2}(x)| \leq c$, where $c$ depends on $U_1, U_2$ but not $x$.

  **Requirement:** The theory must address the impact of $c$ on finite data. Since $c$ can be arbitrarily large, it can swamp the complexity difference between competing hypotheses for any finite evidence set $E$. The theory must either:
  *   (A) Provide a principled method for selecting a "natural" reference machine (breaking the invariance).
  *   (B) Demonstrate why the constant is negligible for the domain of interest.
  *   (C) Accept that prior probabilities are relative to a conceptual scheme and deny objective simplicity.
  *   *Status:* **Non-negotiable.** Ignoring the additive constant renders the theory vacuous for finite agents.

  ### 3. The Computability Constraint
  Kolmogorov complexity is uncomputable (no algorithm can determine $K(x)$ for arbitrary $x$).

  **Requirement:** The theory must specify its stance on agency:
  *   **(Idealization):** Is the theory a norm for omniscient agents, leaving finite agents to approximate?
  *   **(Approximation):** Does the theory provide a computable proxy (e.g., compression algorithms, restricted model classes)?
  *   **(Price of Computability):** If computability is demanded, the theory must quantify the loss in optimality or truth-conduciveness incurred by restricting the hypothesis space.
  *   *Status:* **Contested.** Formal epistemology often tolerates idealization, but a theory for scientific practice cannot.

  ### 4. The Pathological Case Constraint
  The theory must handle specific classes of hypotheses that threaten to break the simplicity/truth link:
  *   **(A) Gerrymandered Disjunctions:** Hypotheses of the form $H = E_1 \lor E_2 \lor \dots \lor E_n$ that fit the data perfectly but lack predictive power. The theory must explain why these are penalized as "complex" despite potentially short encodings in ad-hoc languages.
  *   **(B) Hidden Complexity:** Hypotheses that appear simple in a language but encode complex parameters (e.g., a "simple" law with a constant defined by the digits of $\pi$).
  *   **(C) Overfitting:** The theory must distinguish between fitting noise and capturing signal, ensuring that a hypothesis fitting a finite sample perfectly does not receive a posterior probability of 1 if it generalizes poorly.
  *   *Status:* **Non-negotiable.** Failure here implies the measure captures syntax, not structure.

  ---

  ## II. The Incompatibility Thesis (The "No Free Lunch")

  This is the critical section for seminar discussion. The suspicion that "every live account quietly sacrifices one" is correct. There is a **Trilemma** involving three desirable properties. No theory can satisfy all three simultaneously.

  **The Trilemma:**
  1.  **Language Invariance:** Priors are objective and do not depend on arbitrary choices of coding scheme (up to negligible constants).
  2.  **Computability:** The prior probabilities can be calculated by a finite agent in finite time.
  3.  **Finite-Sample Reliability:** The theory provides decisive guidance on which hypothesis to prefer given *finite* evidence (i.e., the additive constant does not dominate).

  **The Incompatibility Claim:**
  *   **(1) + (3) $\rightarrow$ Not (2):** To achieve language invariance and finite-sample reliability, you need a measure like Kolmogorov complexity. But $K$ is uncomputable. (This is the **Solomonoff** horn).
  *   **(2) + (3) $\rightarrow$ Not (1):** To achieve computability and finite-sample reliability, you must restrict the hypothesis space or choose a specific coding language (e.g., linear models, specific compression algorithms). This breaks language invariance; your results depend on the model class chosen. (This is the **MDL/Statistical** horn).
  *   **(1) + (2) $\rightarrow$ Not (3):** If you demand computability and invariance (e.g., using a computable approximation of $K$ that claims objectivity), you lose reliability on finite data because the approximation error or the inherent constant $c$ will dominate the signal for small $n$.

  **Verdict:** An adequate theory must explicitly acknowledge which vertex of this triangle it is sacrificing. A theory claiming to satisfy all three is mathematically incoherent.

  ---

  ## III. Scoring Candidate Accounts

  ### 1. Solomonoff Induction (SI)
  *   **Normative/Epistemic Gap:** **Pass.** Explicitly links priors to truth-conduciveness (convergence to truth) *assuming* the environment is computable.
  *   **Language Relativity:** **Fail (with caveat).** Acknowledges the constant $c$, but argues it washes out *in the limit*. For finite data, it offers no resolution on how to choose the UTM. It bites the bullet that priors are relative to the UTM.
  *   **Computability:** **Fail.** Explicitly uncomputable. It is a normative ideal, not a usable algorithm.
  *   **Pathological Cases:** **Pass.** By summing over all programs, gerrymandered disjunctions are naturally penalized by their program length. Overfitting is penalized because longer programs (fitting noise) have exponentially lower priors.
  *   **Trilemma Sacrifice:** Sacrifices **Computability**. Retains Invariance (asymptotically) and Reliability (asymptotically).

  ### 2. Minimum Description Length (MDL)
  *   **Normative/Epistemic Gap:** **Mixed.** Often framed pragmatically (compression = understanding) rather than ontologically (compression = truth). Some versions claim epistemic force via Bayesian links.
  *   **Language Relativity:** **Fail.** Heavily dependent on the choice of model class (the "code"). There is no "Universal" MDL; there is only MDL relative to a chosen family of distributions.
  *   **Computability:** **Pass.** Designed specifically to be computable and applicable to real data.
  *   **Pathological Cases:** **Pass.** The "two-part code" (model + data given model) explicitly penalizes overfitting. Gerrymandering is handled by the cost of encoding the model parameters.
  *   **Trilemma Sacrifice:** Sacrifices **Language Invariance**. Retains Computability and Finite-Sample Reliability.

  ---

  ## IV. Meta-Evaluation of the Desiderata

  **Confidence in the Desiderata:**
  I am **highly confident** (90%+) that this list accurately captures the structural problems facing formal accounts of simplicity. The distinction between truth-tracking and prior assignment, the problem of the additive constant, and the tension between computability and optimality are well-documented in the literature (e.g., Li & Vitányi, Kelly, Sterkenburg).

  **Least Certain Claim:**
  I am **least sure** (60% confidence) of the strong formulation of the **Incompatibility Thesis** regarding **Language Invariance**.
  *   *Reason for Uncertainty:* There is ongoing debate about whether a "natural" UTM exists (e.g., based on physical laws or cognitive architecture) that could resolve the constant $c$ problem without begging the question. If a physically privileged reference frame exists (e.g., the complexity of the universe itself), then Language Invariance might be recoverable without sacrificing Computability (if we restrict to physically computable functions). However, this moves the problem from mathematics to metaphysics/physics.
  *   *Alternative Uncertainty:* It is also possible that "Finite-Sample Reliability" is too strong a demand. If we relax the requirement to "Asymptotic Reliability," Solomonoff Induction satisfies the Trilemma better, but at the cost of rendering the theory useless for actual scientific inference (which is always finite). I have flagged Finite-Sample Reliability as non-negotiable for an *epistemology of science*, but a pure *logic of confirmation* might reject it.

  **Recommendation for Seminar:**
  Use the **Trilemma** as the central discussion engine. Ask students to propose a modification to SI or MDL that attempts to recover the sacrificed vertex, and then demonstrate why it fails. This will illuminate why the "sacrifice" is necessary rather than accidental.
