      *   Wolpert's No Free Lunch theorems are relevant but specific to supervised learning.
      *   In formal epistemology, the tension is often between *Objectivity* (Language Invariance) and *Effectiveness* (Computability/Finite Data).
      *   *Claim:* It is impossible to satisfy (1) Language Invariance (up to trivial constants), (2) Computability, and (3) Convergence to Truth for all computable sequences *in finite time*.
      *   Actually, the strongest tension is between **Language Invariance** and **Finite Data Guidance**. If the constant $c$ can be arbitrarily large, the theory gives no guidance on *this* dataset, only in the limit.
      *   Let's formulate the "Trilemma": (A) Objectivity (Language Independence), (B) Computability, (C) Finite-Sample Reliability. You can pick two.
