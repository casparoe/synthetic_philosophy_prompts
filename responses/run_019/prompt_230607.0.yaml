          4.  Specific cases (gerrymandered disjunctions, hidden complexity in coding, overfitting).
          5.  Flag non-negotiable vs. optional/contested requirements.
          6.  Identify joint unsatisfiability (the "no free lunch" aspect).
          7.  Score Solomonoff Induction (SI) and Minimum Description Length (MDL) against the list.
          8.  Express confidence in the desiderata and identify the least certain claim.

  2.  **Deconstruct the Desiderata (Drafting the Requirements):**

      *   *Requirement 1: The Normative/Descriptive Gap.* A theory needs to say if it's just a heuristic for priors or a truth-conducive principle. Can we have high priors for simplicity without claiming simplicity = truth? (Pragmatic vs. Epistemic).
      *   *Requirement 2: Language Relativity.* Kolmogorov complexity $K(x)$ depends on the Universal Turing Machine (UTM). $K_1(x) \leq K_2(x) + c$. For finite data, $c$ matters. An adequate theory must address this "reference class problem."
      *   *Requirement 3: Computability.* $K(x)$ is uncomputable. A usable theory for agents must address this. Is it an ideal norm? Or must it be approximated (like MDL)?
      *   *Requirement 4: Pathological Cases.*
          *   *Gerrymandering:* $H = E_1 \lor E_2 \lor ...$ (fits data perfectly but complex).
          *   *Hidden Complexity:* A simple string in Language A is complex in Language B.
          *   *Overfitting:* Perfect fit on training data, fails on test data.
      *   *Requirement 5: Joint Unsatisfiability.* This is the crux. Usually, you can't have Language Invariance + Computability + Truth-Conduciveness (for finite data).

  3.  **Refining the "Joint Unsatisfiability" Claim:**
      *   This is the "No Free Lunch" theorem territory.
      *   If you demand *language invariance* (objective simplicity), you usually need a specific UTM, which breaks invariance.
      *   If you demand *computability*, you can't use pure Kolmogorov complexity.
      *   If you demand *truth-conduciveness* (convergence to truth), you need assumptions about the world (e.g., the world is computable), which isn't guaranteed.
      *   *Key Insight:* You cannot simultaneously satisfy: (A) Strict Language Invariance, (B) Computability, and (C) Guaranteed Convergence to Truth for *all* computable environments without prior assumptions about the bias of the UTM.
      *   Actually, a stronger tension exists: *Language Invariance* vs. *Finite Data Sensitivity*. The additive constant swamps the signal for small $n$.

  4.  **Scoring SI and MDL:**
      *   *Solomonoff Induction (SI):*
          *   Pros: Theoretically optimal convergence (if world is computable), formalizes Occam's Razor via $2^{-K}$.
          *   Cons: Uncomputable, language dependent (constant matters for finite time), assumes world is computable.
      *   *Minimum Description Length (MDL):*
          *   Pros: Computable (practical), handles overfitting well (two-part code).
          *   Cons: No single "best" language (model class dependence), lacks the strong convergence guarantees of SI without caveats, more pragmatic than foundational.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the stage. This is a specification for a theory of *epistemic* simplicity.
      *   **Desideratum 1: The Truth-Tracking Justification.** Distinguish *assigning* priors from *justifying* them. Is simplicity instrumental or indicative of truth?
      *   **Desideratum 2: The Language Relativity Constraint.** Address the UTM choice. The additive constant $c$ is fatal for finite data if not constrained.
      *   **Desideratum 3: The Computability Constraint.** Ideal agents vs. real agents.
      *   **Desideratum 4: The Pathological Case Constraint.** Disjunctions, grue-like predicates, overfitting.
      *   **The Incompatibility Thesis:** This needs to be sharp. You can't have Language Invariance + Computability + Strong Truth-Tracking.
      *   **Scoring:** Table or bulleted comparison.
      *   **Confidence & Uncertainty:** Meta-commentary on the list itself.

