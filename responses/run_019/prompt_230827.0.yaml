          *   *Liability:* The FCC fined them. This works *after the fact*. Dennett wants preventative measures.
          *   *Effectiveness:* Would watermarking stop this? Probably not, voice cloning bypasses watermarks easily. Liability works better here because a human company was behind it.

  5.  **Refining and Polishing:**
      *   *Tone:* Academic but accessible (Gov class project).
