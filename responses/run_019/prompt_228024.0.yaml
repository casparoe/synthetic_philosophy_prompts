answer: |-
  # PREP SHEET: CONDORCET JURY THEOREM (CJT) DEFENCE
  **Context:** 20-min talk, Q&A defence. **Audience:** Deliberative theorists, 1 Formalist, 2 Empiricists. **Opponent:** Tom.

  ---

  ## 1. LIKELY OBJECTIONS (In Order of Appearance)

  **A. The Empiricists (Opening Salvo)**
  *   **Phrasing:** "On many policy questions—tax rates, welfare levels—there is no fact of the matter about the 'right' answer. If there's no truth to track, doesn't the theorem collapse?"
  *   **Concede:** Many political questions are matters of preference, not truth.
  *   **Hold Firm:** Some are truth-apt (e.g., 'Will this policy cause recession?'), and CJT applies there.
  *   **Reply:** "You're right that not every vote tracks truth, but many instrumental questions do—like whether a policy will achieve its stated aim. CJT doesn't need to justify every vote, only show that where facts matter, majority rule has epistemic value."

  **B. The Formal Theorist (The Mathematical Check)**
  *   **Phrasing:** "The theorem requires voter independence. In reality, voters share media ecosystems and party cues. Doesn't systematic correlation destroy the convergence guarantee?"
  *   **Concede:** Strict independence is rare; correlated error is a genuine risk.
  *   **Hold Firm:** Conditional independence (given common evidence) is sufficient, and diversity can mitigate correlation.
  *   **Reply:** "Strict independence is indeed idealised, but the theorem holds under conditional independence given common evidence. Furthermore, diverse perspectives can break correlation clusters, preserving the convergence effect even without perfect independence."

  **C. The Deliberative Democrats (The Normative Pushback)**
  *   **Phrasing:** "This reduces citizenship to a statistical aggregation. It ignores the value of reasoning together, legitimacy, and the transformative power of debate."
  *   **Concede:** CJT is not a complete theory of democracy; legitimacy matters.
  *   **Hold Firm:** Epistemic value is *one* crucial reason to value democracy, compatible with deliberation.
  *   **Reply:** "I'm not suggesting statistics replace deliberation, but that deliberation often serves to raise the very competence CJT relies upon. We can value the process of reasoning *and* acknowledge that voting aggregates that reasoning reliably."

  **D. Tom (The Epistocracy Trap)**
  *   **Phrasing:** "Even if CJT works, it favours weighting votes by competence. Why democracy rather than epistocracy-by-lottery?"
  *   **Concede:** In principle, weighted voting tracks truth better *if* competence is known.
  *   **Hold Firm:** Competence cannot be identified neutrally without political disagreement.
  *   **Reply:** "Weighted voting only works if we can agree on who is competent without bias. Since any test of competence is itself a political choice, democracy remains the only fair way to decide who decides."

  **E. The "Competence < 0.5" Fear (Your Quiet Worry)**
  *   **Phrasing:** "If the average voter is worse than chance (p < 0.5), the theorem proves majority rule leads to the *wrong* answer with certainty. How do you guarantee competence?"
  *   **Concede:** If voters are systematically misinformed, majority rule fails.
  *   **Hold Firm:** This is an argument for education and deliberation, not against the voting mechanism.
  *   **Reply:** "That's precisely why we need robust public discourse and education to ensure competence stays above chance. The theorem doesn't guarantee success; it guarantees that *if* we are competent, democracy utilises that competence better than alternatives."

  ---

  ## 2. FORCE ASSESSMENT

  | Objection | Force | Notes |
  | :--- | :--- | :--- |
  | **Empiricist (No Truth)** | **Low** | Easily contained. Limit scope to instrumental/ factual claims. |
  | **Formalist (Independence)** | **High** | **The biggest technical threat.** Don't deny correlation; argue it's not fatal. |
  | **Deliberative (Reductionism)** | **Medium** | Rhetorical heat, but compatible. Position CJT as *complementary*. |
  | **Tom (Epistocracy)** | **High** | **The biggest normative threat.** Needs the "who guards the guardians" reply. |
  | **Competence < 0.5** | **Medium** | Standard objection. Turn it into a plea for better civic education. |

  ---

  ## 3. THE "QUIET HOPE" OBJECTION
  **Your suspicion:** Competence dipping below 0.5.
  **Verdict:** **Valid, but not the worst.**
  **The Worse One:** The **Common Interest Assumption**. CJT assumes voters are trying to answer the *same* question about the *common good*. If politics is purely about conflicting interests (I want lower taxes, you want higher spending), there is no "right answer" to converge on, only a power struggle.
  **Prep:** If raised, concede CJT applies to *common interest* questions (justice, security) but not pure preference aggregation.

  ---

  ## 4. STRATEGY ON IDEALISATION
  **Question:** Does conceding CJT only works under idealised conditions lose you the argument?
  **Answer:** **No. Concede early.**
  **Why:** All models are idealised (including economic models they likely use). The value is in showing the *mechanism*.
  **Line to use:** "Physics models frictionless planes; political theory models competent voters. The point isn't that the world is perfect, but that the mechanism reveals why scale matters when competence is present."

  ---

  ## 5. SPECIFIC REPLY TO TOM (EPISTOCRACY)
  *This is the killer point. Use the **Estlund Move**.*

  **The Argument:** Epistocracy requires identifying the competent.
  **The Problem:** Any test of competence is contestable. Who writes the test?
  **The Reply:** "Tom's right that *identifiable* competence justifies weighting. But competence isn't publicly identifiable without controversy. Any exam we devise to weight votes would itself be subject to political bias. Democracy is the only system that doesn't require us to agree on who the experts are before we start."

  ---

  ## 6. QUICK TIPS FOR THE ROOM
  *   **The Formalist:** Look them in the eye during the Independence question. Don't waffle on the math.
  *   **The Deliberative Crowd:** Use words like "complementary," "ecosystem," "deliberative phase." Avoid "aggregation" where possible.
  *   **Tom:** Don't get drawn back into the 1am argument. Treat his point as a serious theoretical challenge (because it is), then deploy the Estlund reply calmly.
  *   **General:** If stuck, pivot to **Citizen Assemblies**. They are deliberative *and* sortitive (random), which mitigates correlation and raises competence. It's the perfect bridge between your view and theirs.

  **Good luck. Don't let the git see you sweat.**
