  # Where Do You Actually Stand on the Lottery and Preface?
  ### A Diagnostic Flowchart for Epistemology Graduates

  **Instructions:** Start at **Q1**. Answer based on your immediate verdict about the cases described, not on which theory you think you *should* hold. Follow the arrows to your position.

  ---

  ### **Q1: The Ontology Check**
  **When you say the author "believes" her first sentence is true, is that a distinct mental state from merely having 99% confidence?**
  *   **No, it's just high confidence:** $\rightarrow$ **Leaf 1: Reductive Credence (Eliminativist)**
  *   **Yes, it's a distinct state:** $\rightarrow$ Go to **Q2**.

  ### **Q2: The Lottery Barrier**
  **Consider a lottery ticket with a 1-in-a-million chance of winning. Based *only* on those odds, is it rational to hold that distinct "belief" state that it will lose?**
  *   **Yes:** $\rightarrow$ **Lockean Track** (Go to **Q3**).
  *   **No:** $\rightarrow$ **Non-Lockean Track** (Go to **Q4**).

  ### **Q3: The Lockean Aggregation**
  **You believe Sentence 1 is true. You believe Sentence 2 is true. Do you thereby believe the conjunction "Sentence 1 & 2 are true"?**
  *   **No:** $\rightarrow$ **Leaf 2: Kyburg-Style (Non-Adjunction)**
  *   **Yes:** $\rightarrow$ Go to **Q3b**.

  ### **Q3b: The Lockean Contradiction**
  **You believe every sentence is true (via aggregation). You also believe "At least one sentence is false." Is holding both beliefs rational?**
  *   **Yes:** $\rightarrow$ **Leaf 3: Lockean Dialetheism**
  *   **No:** $\rightarrow$ **Leaf 4: Lockean Consistency** *(See Stress Test)*

  ### **Q4: The Preface Permission**
  **Even if lottery odds aren't enough, is the author's verification of each sentence enough to *believe* each individual sentence is true?**
  *   **No:** $\rightarrow$ **Leaf 5: Hard Skepticism**
  *   **Yes:** $\rightarrow$ Go to **Q4b**.

  ### **Q4b: The Asymmetric Contradiction**
  **She believes every sentence is true (via verification). She also believes "At least one sentence is false." Is holding both beliefs rational?**
  *   **Yes:** $\rightarrow$ **Leaf 6: Knowledge-First Dialetheism**
  *   **No:** $\rightarrow$ **Leaf 7: Knowledge-First Consistency** *(See Stress Test)*

  ---

  ### **The Logical Space: Unoccupied & Diagnosed Leaves**
  *The following combinations of answers generate no major known position. Use this to check if your view is truly unique or merely unmotivated.*

  *   **Leaf 8 (Q1=Belief, Q2=Yes, Q3=No, Q4=Yes):** *Kyburg variant who also denies Preface Individuals.* **Diagnosis:** Unmotivated. (Why accept lottery belief but reject verified book belief?)
  *   **Leaf 9 (Q1=Belief, Q2=No, Q3=Yes, Q4=No):** *Believes Conjunction but not Individuals.* **Diagnosis:** Incoherent. (Belief in $A \land B$ without belief in $A$ violates containment.)
  *   **Leaf 10 (Q1=Belief, Q2=No, Q3=No, Q4=Yes):** *Skeptic about Individuals, Believer in Error.* **Diagnosis:** Incoherent. (Belief that "not all are true" without belief in any specific truths.)
  *   **Leaf 11 (Q1=Credence, Q2-Q4=Any):** *Credence views that distinguish Lottery from Preface.* **Diagnosis:** Category Mistake. (If belief is just credence, the paradoxes dissolve into threshold settings.)
  *   **Leaf 12 (Contextualist/Two-Notions):** *Positions where Q2/Q3 answers depend on stakes or context.* **Diagnosis:** **Unmapped.** (This tree assumes invariant norms; if your answer to Q2 is "Sometimes," you are a Contextualist.)

  ---

  ### **Position Summary & Irrationality Flags**

  | Leaf | Position | Modest Author Irrational? | Notes |
  | :--- | :--- | :--- | :--- |
  | **1** | **Eliminativist** | No (No beliefs exist) | Paradoxes are artifacts of folk psychology. |
  | **2** | **Kyburg-Style** | No | Rational acceptance isn't closed under conjunction. |
  | **3** | **Lockean Dialetheist** | No | Inconsistency is the honest price of fallibilism. |
  | **4** | **Lockean Consistent** | **Yes** | Must deny either individual claims or the error claim. |
  | **5** | **Hard Skeptic** | **Yes** | Verification never yields outright belief. |
  | **6** | **Knowledge Dialetheist** | No | Knowledge norm allows inconsistent belief set. |
  | **7** | **Knowledge Consistent** | **Yes** | Must deny error claim (Optimist) or individual claims (Pessimist). |
  | **12** | **Contextualist** | Depends | Rationality shifts with conversational context. |

  **⚠️ Indistinguishable Leaves:** This tree cannot separate **Leaf 2 (Kyburg)** from **Leaf 3 (Lockean Dialetheist)** if the Kyburgian admits their belief set is *implicitly* inconsistent (believing $P_1...P_n$ and $\neg \diamond (P_1...P_n)$). Both answer "Yes" to rational inconsistency. See Stress Test (c) to split them.

  ---

  ### **The Three-Case Stress Test**
  *Run your leaf through these cases. If your view contradicts its own verdict, you may be in the wrong leaf.*

  **(a) The Archivist**
  *An archivist checks 1,000,000 records. She believes of each that it is accurate. She believes "At least one record is misfiled."*
  *   **Pass:** Leaf 2 (Kyburg), Leaf 3 (Lockean Dial), Leaf 6 (Know Dial).
  *   **Fail:** Leaf 4, 5, 7 (Must call her irrational).
  *   **Diagnosis:** If you passed the Preface but fail the Archivist, you are a **Secret Contextualist** (stakes matter).

  **(b) The Two-Author Preface**
  *Author A writes Ch 1-5. Author B writes Ch 6-10. A believes her chapters are error-free. B believes his chapters are error-free. Both believe "The book contains an error."*
  *   **Pass:** Leaf 2 (Kyburg), Leaf 6 (Know Dial).
  *   **Fail:** Leaf 3 (Lockean Dial). *Why?* If belief aggregates, A believes Ch 1-5 are perfect, B believes Ch 6-10 are perfect. Together they believe the whole book is perfect. But they also believe the book has an error. This distributes the inconsistency across agents.
  *   **Diagnosis:** If you fail this but pass the standard Preface, you rely on **Single-Agent Closure**.

  **(c) The Conjunction Probe (Custom Case)**
  *You believe $P_1$... $P_{100}$. You believe $\neg(P_1 \land ... \land P_{100})$. I ask: "Do you believe the long conjunction is false?"*
  *   **Answer "No" (I suspend on the conjunction):** $\rightarrow$ You are **Leaf 2 (Kyburg)**.
  *   **Answer "Yes" (I believe it's false):** $\rightarrow$ You are **Leaf 3 (Lockean Dialetheist)**.
  *   **Diagnosis:** This splits the **Indistinguishable Leaves**. If you answered "Yes" to Q3b but "No" here, you are a Kyburgian who landed in Leaf 3 by accident.
