answer: |-
  **Scenario**

  A clinical pharmacologist is designing a loading dose protocol for a new antibiotic with a narrow therapeutic index. The laboratory assay report indicates that the steady-state plasma concentration $C$ in the target patient population lies somewhere between 1 mg/L and 10 mg/L, but provides no further distributional data due to a calibration error in the mass spectrometer. The pharmacologist must determine the probability that the concentration is below the toxicity threshold of 4 mg/L to assess safety. In clinical pharmacokinetics, practitioners routinely model drug behavior using linear concentration ($C$) because assay readouts are linear, but they equally routinely model receptor binding and efficacy using log-concentration ($L = \log_{10} C$) because biological response scales logarithmically (e.g., Hill equations). The agent possesses symmetric expertise in both modeling traditions and has no access to external frequency data or a "true" physical prior that privileges one scale over the other; relative to her current knowledge, both the linear magnitude of the molecules and the logarithmic magnitude of the biological signal are atomic, measurable properties of the system.

  ***

  **Demonstration of Specifications**

  **Description 1 (Linear Concentration):**
  The agent treats the possible values of $C$ as the set of indivisible alternatives. Given the range $[1, 10]$ and the Principle of Indifference (POI), she assigns a uniform density $f(C) = 1/9$ for $1 \le C \le 10$.
  *Derivation:* The probability that $C < 4$ is the integral of the density from 1 to 4.
  $$P(C < 4) = \int_{1}^{4} \frac{1}{9} \, dC = \frac{3}{9} = \frac{1}{3}.$$

  **Description 2 (Log-Concentration):**
  The agent treats the possible values of $L = \log_{10} C$ as the set of indivisible alternatives. The range for $L$ is $[\log_{10} 1, \log_{10} 10] = [0, 1]$. Given POI, she assigns a uniform density $g(L) = 1$ for $0 \le L \le 1$.
  *Derivation:* The toxicity threshold $C = 4$ corresponds to $L = \log_{10} 4 \approx 0.602$. The probability that $L < 0.602$ is:
  $$P(L < \log_{10} 4) = \int_{0}^{0.602} 1 \, dL = 0.602.$$

  **The Contradiction:**
  The event "Concentration is below 4 mg/L" is identical in physical reality under both descriptions. However, Description 1 yields a probability of $\approx 0.33$, while Description 2 yields $\approx 0.60$. The agent assigns contradictory probabilities to the same event based solely on the choice of parameterization.

  ***

  **Analysis of Keynes's Restriction**

  Keynes's repair stipulates that POI applies only to alternatives that are "indivisible relative to everything we know." In this scenario, that restriction fails to resolve the contradiction for the following reasons:

  1.  **Epistemic Indivisibility:** To the pharmacologist, "The concentration is $x$" is not known to be composite. It is a direct readout from a mass spectrometer. Similarly, "The log-concentration is $y$" is a direct readout from a calibrated potency meter (or a standard transformation treated as primitive in pharmacodynamics). Neither description offers the agent a *reason* to subdivide the alternatives further. There is no "hidden" structure available to her knowledge that reveals $C$ to be made of smaller logical parts that $L$ is not, or vice versa.
  2.  **No Regeneration of Ambiguity:** Attempting to subdivide either parameter (e.g., splitting the range $[1, 10]$ into $[1, 5]$ and $[5, 10]$) merely recreates the original problem: one must decide whether to divide the *linear* intervals equally or the *logarithmic* intervals equally. The ambiguity is not solved by going deeper; it is inherent in the metric choice itself.
  3.  **The Core Feature:** The contradiction arises from **non-linear parameterization invariance**. The mapping between $C$ and $L$ is non-linear ($L = \log C$). A uniform distribution is not invariant under non-linear transformation. Keynes's restriction assumes that "indivisibility" is a property of the *hypotheses* themselves, independent of the language used to describe them. This case shows that indivisibility is language-relative: $C$-intervals look atomic in linear language, while $L$-intervals look atomic in log language.

  **Steelmanning the Keynesian Defense**

  A defender of Keynes might attack the case on **Constraint 3** (naturalness) or the **indivisibility** claim.
  *   *The Attack:* They would argue that Concentration ($C$) is ontologically prior. Mass per volume is the physical reality; log-concentration is a derived mathematical convenience. Therefore, $C$ represents the true "indivisible alternatives," while $L$ represents composite alternatives (functions of $C$). Keynes would insist that POI must be applied to the fundamental physical magnitude, not the transformed scale.
  *   *The Counter:* In the specific context of *pharmacology*, biological response is often causally linked to the logarithm of concentration (Weber-Fechner law, receptor occupancy). A competent practitioner has equal warrant to view the "biological signal" ($L$) as the fundamental reality and the assay readout ($C$) as the derived measurement. Since the agent's knowledge includes both physical chemistry (favoring $C$) and physiology (favoring $L$), her ignorance is truly symmetric. To privilege $C$ is to appeal to an oracle of "true physics" outside the agent's epistemic state, violating **Constraint 5**.

  **Conclusion**

  This case satisfies all five constraints. It is realistic (clinical dosing), the descriptions are equally natural to a practitioner, the probabilities are derived (not stipulated), and ignorance is symmetric. Consequently, it demonstrates that Keynes's restriction is insufficient. The restriction fails because "indivisibility" cannot be defined independently of a choice of measure in continuous spaces. If the feature of **non-linear metric equivalence** is removed (e.g., if the only available scales were linear transformations of each other, like Celsius and Fahrenheit), the contradiction disappears. Since realistic scientific practice invariably involves competing non-linear scales (pH, Decibels, Richter, Magnitude), Keynes's repair cannot dissolve the paradoxes of the Principle of Indifference in applied settings.
