      "It's just verb morphology," Priya said, swirling her pint. "You're reifying a grammatical mood."

      Marcus leaned forward. "Reifying? When I say 'If the butler didn't poison the Count, someone else did,' I'm stating a fact about the actual world. When I say 'If the butler *hadn't* poisoned him, someone else *would have*,' I'm claiming there was a backup plan. One is true because the Count is dead. The other is false because the butler acted alone."

      "Exactly," Priya said. "But the logical core is identical. Both say: in the relevant scenarios where the antecedent holds, the consequent follows. The difference is which scenarios we're looking at. For the indicative, we hold fixed that the Count is dead. For the counterfactual, we unwind the past to before the poison was poured."

      "But that 'unwinding' isn't just pragmatic," Marcus countered. "It changes the truth conditions. Look at the card case. We're both looking at the same face-down card. I know it's red. You know it's a heart. I say, 'If it's black, it's a spade.' You say, 'If it's black, it's a club.' We're both right."

      "Because our information states differ," Priya said. "The conditional content is stable; the context shifts."

      "But try that with counterfactuals," Marcus pressed. "If I say, 'If it had been black, it would have been a spade,' and you say, 'If it had been black, it would have been a club,' we can't both be right. The card's suit isn't dependent on my ignorance. That suggests counterfactuals track objective dependencies, while indicatives track epistemic gaps. They're different beasts."

      Priya paused. "Okay, that stings. If counterfactuals are insensitive to epistemic state in a way indicatives aren't, my unified story needs a complex account of what gets 'fixed.' I can't just say it's all information."

      "And I'll concede the 'might' cases give me trouble," Marcus admitted. "If I say, 'If he'd bet on red, he might have won,' that seems compatible with 'If he'd bet on red, he wouldn't have won' being false, but not with 'If he'd bet on red, he would have lost.' If counterfactuals were strict truth-conditions, 'might' should just be the dual of 'would.' But it feels like 'might' opens a door 'would' slams shut."

      "So you admit the logic isn't classical?" Priya pounced.

      "I admit it's messy," Marcus said. "But your view collapses when the antecedent is impossible. 'If 2+2 were 5, math would collapse.' There's no pragmatic shifting there. There's no world where 2+2=5. You need a different logic for impossible antecedents than for epistemic possibilities."

      "Not necessarily," Priya said. "We just fix different logical constraints. But look, here's where we actually diverge. Consider this pair: 'If Shakespeare didn't write Hamlet, someone else did' versus 'If Shakespeare hadn't written Hamlet, someone else would have.' My view says the difference is purely what we assume about history's inevitability. Your view says the second asserts a causal mechanism the first doesn't."

      "Right," Marcus said. "So the test isn't the Butler or the cards. It's whether denying the second implies denying a causal backup, or just denying the historical assumption."

      "Exactly," Priya said. "If I can show you accept the indicative while rejecting the counterfactual without positing new causal facts, just by shifting what we take for granted, I win. If you need a new truth-condition to explain why the second feels stronger, you win."

      "Then that's the homework," Marcus said, signaling for the bill. "Find the case where shifting context doesn't change the verdict."

