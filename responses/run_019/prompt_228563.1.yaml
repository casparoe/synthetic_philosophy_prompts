  ### 1. The Predicted Verdict
  **Verdict:** **Yes, she still knows how to play the violin.**

  **Reasoning:** This case is structurally identical to her **Gymnastics Coach** verdict. In both scenarios, the subject lacks the physical capacity to execute the action (ruined knee vs. paralyzed hands) but retains the high-level capacity to monitor, evaluate, and correct the performance of others. Since she ruled that the coach *knows how* to somersault despite being unable to jump, consistency demands she rule that the violinist *knows how* to play despite being unable to move her hands. For her, know-how resides in the **normative grip** on the activity (understanding what counts as success/failure), not in the muscular ability to produce it.

  ### 2. The Governing Rule (Her Theory)
  **The "Normative Guidance" Condition.**

  Her verdicts suggest she defines know-how as **the capacity to intelligently guide, monitor, and correct an activity**, independent of both propositional articulation (theory) and physical execution.

  *   **Why it fits the trail:**
      *   **Pianist (Amnesia):** Retains guidance capacity (plays correctly), loses theory. -> **YES.**
      *   **Chick Sexer:** Retains guidance capacity (sorts correctly), loses articulation. -> **YES.**
      *   **Physics Kid:** Retains articulation, lacks guidance capacity (falls over). -> **NO.**
      *   **Gymnast:** Retains guidance capacity (spots errors), loses execution. -> **YES.**
      *   **Violinist:** Retains guidance capacity (hears/corrects), loses execution. -> **YES.**

  She is effectively arguing that know-how is a **cognitive state of understanding standards**, not a behavioral disposition to move one's own body.

  ### 3. The Alternative Rule (The Rival Theory)
  **The "Intact Motor Program" Condition.**

  A rival philosopher could agree with all four of her original verdicts but disagree on the violinist. This rule states: **Know-how requires an intact neural pathway to the relevant muscles, even if structural injuries prevent movement.**

  *   **Why it fits the original four:**
      *   **Pianist:** Neural pathways intact (amnesia is memory, not motor). -> **YES.**
      *   **Chick Sexer:** Neural pathways intact (fingers work). -> **YES.**
      *   **Physics Kid:** No motor program ever formed. -> **NO.**
      *   **Gymnast:** *Crucial Distinction:* A ruined knee is a **structural** impediment (bones/ligaments), but the neural signal to jump is still firing. -> **YES.**
      *   **Violinist:** *Divergence Point:* A spinal injury is a **neural** impediment (the signal is severed). -> **NO.**

  This rival theory preserves the intuition that know-how is tied to *ability*, but refines "ability" to mean "intact motor command" rather than "successful performance." It treats the Gymnast as "able but blocked" and the Violinist as "unable."

  ### 4. The Tie-Breaker Case
  If the philosopher hedges on the violinist (e.g., arguing that spinal injury is "structural enough" or "neural enough" to suit her needs), you need a case that severs the link between **Guidance** and **Own-Body Motor Signals** entirely.

  **The Case: The Surrogate Hands**
  > A virtuoso violinist suffers total neural severance (like the retired violinist) but enters an experiment where her brain signals are wirelessly linked to a **surrogate pair of robotic hands** (or another person's anesthetized hands). When she "intends" to play, the surrogate hands play perfectly. She produces music, but her own body remains still.

  *   **Her Verdict (Normative Guidance):** **YES.** She is successfully guiding the activity to a successful conclusion. The location of the muscles is irrelevant; the locus of control is her mind.
  *   **Rival Verdict (Intact Motor Program/Embodiment):** **NO.** Know-how is essentially embodied. Moving a robot or another person is *causing* music, not *playing* the violin. Her own motor program is disconnected from the instrument.

  **Why this pins it down:**
  The Violinist case allows the rival to argue about the *nature of the injury* (neural vs. structural). The Surrogate Hands case removes the injury from the equation and asks a harder question: **Is know-how essentially tied to *your* body moving?** If she says **Yes** to the Surrogate, she is a pure Intellectualist/Guidance theorist (know-how is purely mental). If she says **No**, she is an Embodied Cognition theorist (know-how requires specific bodily engagement), and you can press her on why the Gymnast counted but the Surrogate doesn't.
