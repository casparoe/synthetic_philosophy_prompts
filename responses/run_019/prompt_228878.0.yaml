answer: |-
  # Colloquium Prep Sheet: Strong Longtermism (Trajectory-vs-Content)

  **Thesis:** In high-consequence decisions, value is dominated by effects on the long-run future.
  **Core Strategy:** Trajectory-vs-Content (focus on avoiding irreversible losses like extinction/lock-in without predicting future content or relying on totalist aggregation).
  **Goal:** Defend the *dominance* claim without the standard totalist/epistemic crutches.

  ---

  ## 1. The Philosopher of Science (Deep Uncertainty)
  **Likelihood:** High (First or Second Question)
  **Phrasing:** "You argue we can predictably alter the probability of extinction without predicting the future's content. But complex systems exhibit non-linear dynamics. An intervention that lowers existential risk today might stabilize a trajectory that leads to a slower, more painful collapse later, or foreclose a necessary 'reset.' Given 'complex cluelessness,' how can you assign a positive expected value to risk-reduction interventions if the sign of the long-term effect is unknowable?"

  *   **Damage to Argument:** **High.** Directly targets the "predictably alter" premise. If the sign is unknown, the dominance claim fails.
  *   **Concede:** Acknowledge that specific *policy* interventions are often subject to complex cluelessness. Do not claim to know the effects of specific geopolitical maneuvers.
  *   **Hold:** Distinguish between *tactical* interventions (unclear sign) and *structural* safeguards (clear sign).
  *   **90-Second Reply:**
      > "That is the central epistemic challenge, and I concede it applies to many tactical interventions. However, my claim rests on a distinction between *tactical* maneuvers and *structural* safeguards. Complex cluelessness is severe when we try to steer the content of the future. It is less severe when we address structural risks that preclude *any* future agency.
      >
      > For example, unaligned artificial general intelligence represents a structural threat to the condition of agency itself, not just a shift in trajectory. We don't need to predict the content of the future to know that a system which permanently disempowers its operators closes the possibility space for all future value. I am not arguing we can predict the downstream effects of specific treaties; I am arguing we can identify mechanisms that irreversibly destroy the capacity for moral progress. The sign is positive because preserving the capacity for choice is a precondition for any positive value, regardless of what that value turns out to be."

  ## 2. The Political Philosopher (Present Suffering)
  **Likelihood:** High (Often follows the Science objection)
  **Phrasing:** "This framework functions ideologically to rationalize deprioritizing present-day suffering. 'Avoiding lock-in' is abstract; starvation and oppression are concrete. By framing the future as the dominant determinant, aren't you structurally biasing resources toward speculative tech elites and away from tangible justice? Doesn't this view treat living people as mere means to the existence of future people?"

  *   **Damage to Argument:** **Medium.** Attacks the normative implications and credibility rather than the logic. Risks alienating the room.
  *   **Concede:** Acknowledge that longtermism has historically been vulnerable to this critique and that ignoring present suffering is morally indefensible.
  *   **Hold:** Deny the zero-sum framing. Existential security is a prerequisite for justice.
  *   **90-Second Reply:**
      > "I appreciate the force of that concern, and I concede that any moral framework used to justify neglecting acute, solvable suffering today is morally bankrupt. However, I reject the zero-sum framing. The claim isn't that we should ignore present suffering to fund space colonization; it's that certain forms of present suffering are inextricably linked to existential risk.
      >
      > Institutional lock-in and geopolitical instability drive both present injustice and existential risk. Strengthening democratic resilience and reducing extreme inequality are robust 'trajectory changes' that serve both ends. My argument is that we cannot secure justice for future generations if there are no future generations to bear it. Treating people as ends requires ensuring they have a future in which to exercise that status. I am arguing for a floor beneath which we must not fall, not a ceiling that justifies ignoring those currently below it."

  ## 3. The Population Ethicist (Committed Totalist)
  **Likelihood:** Medium (Will wait to see if you survive the epistemic challenges)
  **Phrasing:** "You've jettisoned the totalist view that gives longtermism its mathematical force. Without the vast numbers of potential lives, does avoiding extinction really *dominate* present concerns? If the future is just 'more of the same' rather than 'astronomical value,' isn't the cost of preventing extinction bounded? You want the strong conclusion without the engine that drives it."

  *   **Damage to Argument:** **High.** Challenges whether the "weakened" premises can actually support the "Strong" conclusion (dominance).
  *   **Concede:** Admit that the *magnitude* of value is lower without totalism.
  *   **Hold:** Argue that *irreversibility* creates a lexical priority, not just a sum.
  *   **90-Second Reply:**
      > "You are right that I am not relying on the sum of lives to generate the value. I am relying on the structure of the choice. My argument is not that the future contains *more* value in aggregate, but that the *loss* of the future is qualitatively different from setbacks within a trajectory.
      >
      > Think of it as a lexical priority rather than a summation. If an option leads to irreversible closure of the moral community, it renders all other value claims moot. We don't need the totalist multiplier to see that permanent extinction is a unique category of harm. It is the destruction of the vessel of value itself. Even on a person-affecting view, or a view that discounts the future, the finality of extinction imposes a cost that outweighs non-existential trade-offs. The dominance comes from the finality of the loss, not the magnitude of the gain."

  ## 4. The Contractualist (Aggregation/Rights)
  **Likelihood:** Low/Medium
  **Phrasing:** "You speak of 'losses,' but losses to whom? If you cannot predict the content of the future, you cannot identify the specific individuals who will be harmed by extinction (due to the non-identity problem). You are still aggregating small risks across time to justify overriding the rights of identifiable people today. How do you ground this duty without consequentialist aggregation?"

  *   **Damage to Argument:** **Medium.** Challenges the deontic structure.
  *   **Concede:** Acknowledge the non-identity problem makes person-affecting claims tricky.
  *   **Hold:** Ground the duty in the preservation of *conditions for agency*, not specific individuals.
  *   **90-Second Reply:**
      > "I am not grounding the duty in harm to specific, identifiable future individuals. I am grounding it in the preservation of the conditions necessary for moral agency to exist at all. Contractualism requires principles that no one could reasonably reject.
      >
      > A principle that allows the current generation to permanently foreclose the possibility of future moral communities is one that future people—if they could speak—would reasonably reject. It is not about aggregating interests; it is about the violation of the standing of humanity as a continuing project. We have a duty to leave the 'door open' for moral agents, even if we cannot name them. To lock the door permanently is to assert a tyranny of the present over the very possibility of the future."

  ## 5. Graduate Students (Broad/Foundational)
  **Likelihood:** High (End of session)
  **Phrasing:** "If we can't predict the content of the future, how do we know it's worth saving? Maybe extinction is neutral. Why is 'continuation' a good in itself?"

  *   **Damage to Argument:** **Medium-High.** Hits the axiological foundation.
  *   **Concede:** We cannot know if the future is *net positive* with certainty.
  *   **Hold:** The *potential* for value imposes a duty of preservation.
  *   **90-Second Reply:**
      > "That is the fundamental axiological question. My claim isn't that we know the future is guaranteed to be good. It's that the *potential* for value, combined with the irreversibility of loss, creates a presumption in favor of continuation.
      >
      > Extinction is not just a neutral end; it is the destruction of all future opportunities for moral progress, joy, and understanding. Unless we are pessimists who believe the future is guaranteed to be net negative—a claim that is arguably just as epistemically unsupported as optimism—we must treat the preservation of option value as a primary good. We save the book not because we have read every page, but because burning it guarantees we never can."

  ---

  ## Strategic Analysis

  ### The Weakest Joint: The "Valence Assumption"
  **Location:** The intersection of **Trajectory-vs-Content** and **Strong Dominance**.
  **The Problem:** You argue we can't predict the *content* of the future, but you assert that losing the future is an *irreversible loss*. This smuggles in an assumption that the future has positive expected value (valence).
  **Why it's weak:** If you cannot predict content, you cannot rule out a future of net suffering (e.g., permanent dystopian lock-in). If the future is likely net negative, then extinction is a *gain*, not a loss. Your argument relies on "avoiding bad lock-in," but without predicting content, how do you know your intervention avoids bad lock-in rather than causing it?
  **Preparation:** You must be ready to defend the claim that **"Openness" has intrinsic value.** You need to argue that a future with *agency* is presumptively better than no future, even if we can't predict the outcomes of that agency. Do not let this slide as obvious; it is the linchpin.

  ### The Question You Secretly Hope No One Asks
  **The Question:** "If you strip away the astronomical value of future lives (Totalism) and the ability to predict future goods (Content), what mathematical or normative weight remains to justify **dominance** over present urgent needs? Doesn't this argument only support *Moderate* Longtermism (the future matters significantly) rather than *Strong* Longtermism (the future is the dominant determinant)?"

  **Why:** This forces you to admit that your "weakened" premises might not support your "Strong" conclusion. Without the totalist multiplier, the "irreversibility" of extinction must carry immense weight on its own to outweigh *all* present suffering. If you concede this, your thesis shifts from "Strong Longtermism" to "Significant Longtermism," which changes the scope of your paper's contribution.
  **Defense:** You must argue that **Lexical Priority** replaces **Mathematical Dominance**. The claim is not that the sum of future value > sum of present value, but that *irreversible loss* trumps *reversible loss* regardless of magnitude. Stick to the "Lexical" framing to save the "Strong" label.
