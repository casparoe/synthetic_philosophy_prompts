answer: |-
  There is no single, canonical term in the philosophical literature that lexicalizes this precise structural pattern (e.g., no equivalent to "The Is-Ought Problem"). However, the objection is a standard and well-understood critique of the "Freedom of Association" defense of border controls, most prominently associated with the work of Christopher Wellman and Michael Walzer. In contemporary debates, it is typically categorized under the tension between **Individual vs. Collective Freedom of Association**.

  If we are to name the pattern itself to capture the specific justificatory imbalance you describe, the most precise descriptive term is **The Associative Reciprocity Gap**.

  Below is an analysis of this gap, its distinction from neighboring concepts, the strongest defense available to those who maintain it, and the conditions required to close it without abandoning the club analogy.

  ### 1. Conceptual Characterization

  **The Associative Reciprocity Gap** occurs when a political principle (freedom of association) is invoked to justify a macro-level power (state exclusion) but is simultaneously suppressed at the micro-level (individual inclusion) where it would generate contradictory outcomes.

  *   **The Exclusionary Claim:** The state is a collective agent analogous to a private club. Just as a club has the right to deny membership to non-members to preserve its character, resources, or purpose, the state has the right to deny entry/residence to non-citizens.
  *   **The Inclusionary Suppression:** If the analogy holds, individual members of the club (citizens) should possess the derivative right to sponsor or invite guests, just as members of a private club can often bring guests or propose new members. However, in the immigration context, the state reserves the veto power, rendering the individual's associative right to *include* subordinate to the collective's right to *exclude*.

  **Distinction from Neighboring Ideas:**

  *   **Vs. The Right to Exclude:** The "Right to Exclude" is the *conclusion* of the argument. The Associative Reciprocity Gap is the *structural flaw* in the premise used to reach that conclusion. One can defend a right to exclude based on property rights or welfare preservation without invoking association; the Gap only appears when *association* is the specific justification.
  *   **Vs. Exit vs. Entry Asymmetry:** The exit/entry asymmetry (often associated with Albert Hirschman) concerns the mobility of the agent (I can leave, but I cannot enter). The Associative Reciprocity Gap concerns the *locus of authority* (The collective can say no, but the individual cannot say yes).
  *   **Vs. The Boundary Problem:** The Boundary Problem asks *who* constitutes the demos to decide on membership. The Reciprocity Gap assumes the demos is already constituted and asks why the internal associative rights of that demos do not translate into external admission rights.

  ### 2. The Strongest Defense of the Gap

  Proponents of the state's right to exclude (e.g., Wellman, Miller) are aware of this gap. Their defense does not deny the asymmetry but argues it is **necessary and non-arbitrary**. To maintain the Gap without contradiction, one must argue that the "Club Analogy" is imperfect in a specific way: **The State is a Sovereign Club, not a Voluntary Club.**

  The strongest defense rests on three pillars:

  **A. The Constitutive vs. Voluntary Distinction**
  In a private club, membership is voluntary. In a state, membership is often coercive and constitutive of the legal order itself. If individual citizens had an unconditional right to invite outsiders into residency, the collective's ability to maintain the legal, cultural, or economic framework that makes individual association *possible* would be undermined. The collective right is prior to the individual right because the collective sustains the jurisdiction in which individual rights operate.
  *   *Boundary Case:* Family reunification. Most exclusionists grant this. Why? Because the associative interest of the family is deemed weightier than the general associative interest of the citizenry, *unless* the volume threatens the system. This admits that the Gap is a matter of weighting, not absolute principle.

  **B. The Aggregation Problem (The "Swamping" Objection)**
  Even if every individual has a right to invite, the *sum* of individual invitations may exceed the state's capacity to integrate or sustain. In a private club, if every member invites a guest, the club becomes overcrowded and loses its character. Therefore, the "Club" (the state) must retain a veto to manage the *aggregate* impact of individual associative choices. The asymmetry is justified as a traffic-control mechanism, not a denial of the underlying right.
  *   *Boundary Case:* Employment visas. Here, the state acknowledges the individual (employer) right to associate economically but attaches quotas. This validates the critique: the right to include exists but is capped.

  **C. Jurisdiction vs. Association**
  This is the most technical defense. It argues that inviting someone onto private property (individual association) is distinct from granting them political membership or permanent residency (state association). The state controls the *political* boundary, not the *physical* boundary.
  *   *The Defense:* A citizen can invite a foreigner to dinner (physical inclusion) but cannot unilaterally grant them the right to access the welfare state or vote (political inclusion). The "Right to Exclude" is actually a "Right to Control Political Membership."
  *   *The Weakness:* Long-term residency inevitably leads to claims for political membership. If the individual can invite the outsider to stay indefinitely, the state's control over political membership erodes. Thus, the state must restrict the *duration* of individual association, which looks like a restriction on association itself.

  ### 3. Closing the Gap: A Proposal

  To avoid the Associative Reciprocity Gap without giving up the club analogy, a position must shift from a **Gatekeeper Model** to a **Sponsorship Model**.

  **Proposed Term:** **Associative Subsidiarity**

  **Definition:** A framework where the state retains the right to set the *capacity* and *criteria* of the club (the macro-association), but the selection of specific members is delegated to individual members (the micro-association).

  **Requirements to Claim This Position:**
  To claim Associative Subsidiarity while maintaining the club analogy, one must commit to the following:

  1.  **Quotas, Not Vetoes:** The state may determine *how many* people enter (to preserve the "club's" resources or character), but it cannot arbitrarily reject specific individuals sponsored by citizens if those individuals meet neutral criteria (e.g., background checks, financial solvency). The state manages the *volume*, citizens manage the *selection*.
  2.  **Presumption of Validity:** An individual's invitation creates a prima facie claim to entry. The burden of proof shifts to the state to demonstrate why a specific sponsorship threatens the collective association, rather than the burden being on the citizen to justify the invitation.
  3.  **Decoupling Presence from Membership:** The system must allow for robust rights of physical presence and economic association (work, property ownership) without immediate automatic claims to full political citizenship. This allows the individual's right to include to be satisfied without immediately triggering the state's fear of losing control over the "demos."

  **How this avoids the asymmetry:**
  In this model, freedom of association does the same justificatory work on both sides.
  *   **State:** "We associate to set the limits of our capacity."
  *   **Individual:** "We associate to fill that capacity with people we choose."
  The asymmetry vanishes because the state no longer claims a monopoly on the *decision* to associate, only on the *conditions* under which association occurs.

  ### 4. Summary of the Conceptual Stakes

  The Associative Reciprocity Gap reveals that when defenders of border control use "freedom of association," they are often smuggling in a premise of **State Personhood**. They treat the state as a singular agent with interests distinct from the sum of its citizens.

  *   **If the State is a Fiction:** If the state is merely an agent of the citizens, the Gap is indefensible. The citizens' right to associate should trump the agent's instruction to exclude.
  *   **If the State is a Real Entity:** If the state has interests (survival, culture, solvency) that transcend current citizens, the Gap is defensible, but the "Club Analogy" becomes strained. Private clubs do not have sovereign powers over territory; they only control access to private property.

  **Conclusion:**
  There is no established single word for this, but it is the central tension in the **Associative Defense of Border Control**. To close the **Associative Reciprocity Gap** without abandoning the analogy, one must adopt **Associative Subsidiarity**: the state acts as the board of directors setting the budget and bylaws, while the citizens act as the voting members who actually select the new inductees. Any position that grants the board the power to veto specific members selected by the shareholders, without cause, is guilty of the asymmetry you identified.
