answer: |-
  # The Sustainable Growth Filter (SGF)

  **Purpose:** To distinguish between competitive features that create value and "race to the bottom" traps that sacrifice long-term health for short-term metrics.
  **Timebox:** 45–60 Minutes.
  **Participants:** Eng Lead, Product Manager, Tech Lead.
  **Output:** A signed One-Page Decision Memo (see end of document).

  ---

  ## Part 1: The Decision Procedure

  Run through these five questions in order. If any step results in a **RED**, the proposal is flagged as a potential trap. If a step is **YELLOW**, it requires leadership escalation.

  ### 1. The User Value Test
  *Does this feature solve a user problem or reduce friction, independent of our business metrics?*
  *   **Evidence Required:** User research, support tickets, or usability testing showing a specific pain point this addresses.
  *   **✅ GREEN:** Yes. Users asked for this, or data shows it removes friction.
  *   **⚠️ YELLOW:** Neutral. It doesn't help much, but it doesn't hurt.
  *   **🛑 RED:** No. The primary beneficiary is the business (e.g., retention, DAU, data), not the user.
      *   *Trap Indicator:* If the only justification is "it moves the needle," stop.

  ### 2. The "Vacuum" Test
  *If our top competitor vanished tomorrow, would we still build this?*
  *   **Evidence Required:** A candid admission from the PM/Team.
  *   **✅ GREEN:** Yes. This is part of our core vision/roadmap regardless of the market.
  *   **⚠️ YELLOW:** Maybe. It aligns with vision, but the timing is accelerated by competition.
  *   **🛑 RED:** No. We are only doing this because they did it.
      *   *Trap Indicator:* "If we don't, we lose market share" is the *only* reason.

  ### 3. The Metric Alignment Check (Goodhart's Law)
  *Does the metric we are optimizing correlate with long-term user satisfaction?*
  *   **Evidence Required:** Historical data linking the target metric (e.g., DAU, time spent) to retention/churn/satisfaction (NPS/CSAT) over 6+ months.
  *   **✅ GREEN:** Yes. When this metric goes up, satisfaction/retention goes up.
  *   **⚠️ YELLOW:** Uncorrelated. The metric goes up, satisfaction stays flat.
  *   **🛑 RED:** Negative Correlation. The metric goes up, but long-term satisfaction or retention goes down.
      *   *Trap Indicator:* We are optimizing for a number that we know represents "junk food" engagement.

  ### 4. The Trust & Reversibility Gate
  *If this feature were explained on the front page of a news site, would users feel tricked? Can we undo it easily?*
  *   **Evidence Required:** "Press Release" test. Engineering estimate on rollback complexity.
  *   **✅ GREEN:** Transparent. Easy to revert (days/weeks).
  *   **⚠️ YELLOW:** Opaque. Hard to revert (months/architecture changes).
  *   **🛑 RED:** Dark Pattern. Would cause backlash if public. One-way door (data deletion, irreversible permissions).
      *   *Trap Indicator:* Relying on user inertia or confusion to drive adoption.

  ### 5. The Legal & Privacy Flag (Parallel Track)
  *Does this change data collection, permissions, or user control?*
  *   **Action:** If **YES**, this procedure pauses. Legal/Compliance must sign off *before* Step 6.
  *   **Outcome:** Legal veto overrides all previous GREENs.

  ---

  ## Part 2: Classification & Sign-Off

  Based on the answers above, classify the proposal:

  *   **CLASS A (Go):** All GREENs. (Standard Feature)
  *   **CLASS B (Escalate):** Any YELLOWs. (Requires VP/Product Lead decision on risk tolerance).
  *   **CLASS C (No-Go / Trap):** Any REDs. (Do not proceed without fundamental redesign).

  ### One-Page Decision Memo

  | Feature Name | | Date | |
  | :--- | :--- | :--- | :--- |
  | **Proposer** | | **Eng Lead** | |
  | **SGF Classification** | ☐ Class A (Go) ☐ Class B (Escalate) ☐ Class C (No-Go) |
  | **Key Rationale** | *(Summarize the deciding factor from Steps 1-4)* |
  | **Legal/Privacy Review** | ☐ Not Applicable ☐ Required (Attach Approval) |
  | **Sign-Off** | _________________________ (Product Lead) |

  ---

  ## Part 3: Worked Examples

  Here is how your team applies the SGF to the three scenarios you provided.

  ### Case 1: The "Daily Streak" Notification
  **Proposal:** Copy competitor's daily streak notification to lift DAU.
  **Data:** Lifts DAU, but long-term satisfaction drops for users pressured by streaks.

  *   **Step 1 (User Value):** **🛑 RED.**
      *   *Reasoning:* The data explicitly states users are *less* satisfied long-term. The value is to the business (DAU), not the user.
  *   **Step 2 (Vacuum Test):** **🛑 RED.**
      *   *Reasoning:* PM admitted this is to "copy" the competitor. Without them, this wouldn't be prioritized.
  *   **Step 3 (Metric Alignment):** **🛑 RED.**
      *   *Reasoning:* Negative correlation. DAU up, Satisfaction down. This is the definition of Goodhart's Law.
  *   **Step 4 (Trust):** **⚠️ YELLOW.**
      *   *Reasoning:* Notifications can feel spammy. Not necessarily a dark pattern, but annoying.
  *   **Step 5 (Legal):** **✅ Pass.** No privacy changes.

  **SGF Classification:** **CLASS C (No-Go)**
  **Verdict:** **DO NOT SHIP.**
  **Why:** This is a textbook Moloch trap. You are trading user well-being for a vanity metric because a competitor did it. The procedure stops at Step 1 and 3.
  **Action:** PM must find a retention lever that correlates with satisfaction, or accept lower DAU.

  ***

  ### Case 2: Auto-Enroll Telemetry (Buried Opt-Out)
  **Proposal:** Turn on telemetry by default for all users. Opt-out is in Settings > Advanced > Privacy.
  **Goal:** "Product Improvement."

  *   **Step 1 (User Value):** **⚠️ YELLOW.**
      *   *Reasoning:* Indirect value. Better product later, but immediate cost is privacy.
  *   **Step 2 (Vacuum Test):** **✅ GREEN.**
      *   *Reasoning:* Most industry standards do this. We would likely do it anyway for insights.
  *   **Step 3 (Metric Alignment):** **✅ GREEN.**
      *   *Reasoning:* More data usually equals better product decisions.
  *   **Step 4 (Trust):** **🛑 RED.**
      *   *Reasoning:* "Buried opt-out" fails the "Front Page of News" test. If users realize they were enrolled without clear consent, it feels deceptive.
  *   **Step 5 (Legal):** **🚩 FLAG RAISED.**
      *   *Reasoning:* Changes data collection defaults. Requires Legal review for GDPR/CCPA compliance.

  **SGF Classification:** **CLASS C (No-Go)**
  **Verdict:** **DO NOT SHIP (As Proposed).**
  **Why:** While data collection is standard (Step 2), the implementation (buried opt-out) violates the Trust Gate (Step 4) and triggers a Legal hard stop (Step 5).
  **Action:** Redesign to use an explicit opt-in modal or a clear, accessible settings toggle. Resubmit for Legal review.

  ***

  ### Case 3: Matching Competitor Release Cadence (2 Weeks)
  **Proposal:** Move from 4-week to 2-week release cycles to match competitor speed.
  **Cost:** QA cycle cut from 10 days to 5 days.
  **Risk:** Postmortems indicate this increases bug escape rate by ~40%.

  *   **Step 1 (User Value):** **⚠️ YELLOW.**
      *   *Reasoning:* Faster features are good, but more bugs are bad. Net value is unclear.
  *   **Step 2 (Vacuum Test):** **🛑 RED.**
      *   *Reasoning:* The *only* driver is "matching competitor." We previously decided 4 weeks was the sustainable pace.
  *   **Step 3 (Metric Alignment):** **⚠️ YELLOW.**
      *   *Reasoning:* Velocity metric goes up. Stability metric goes down. Correlation to satisfaction is mixed.
  *   **Step 4 (Trust):** **⚠️ YELLOW.**
      *   *Reasoning:* Buggy releases erode trust over time. Reversing a release process is operationally difficult.
  *   **Step 5 (Legal):** **✅ Pass.** No privacy changes.

  **SGF Classification:** **CLASS B (Escalate)**
  **Verdict:** **PUNT TO LEADERSHIP (Values Call).**
  **Why:** This isn't a clear "Trap" like Case 1, but it is a "Race to the Bottom" on quality. The procedure identifies that the motive is purely competitive fear (Step 2 RED) and the risk is tangible (Step 3 YELLOW).
  **Action:** This cannot be decided by the Eng/PM team alone. The Decision Memo must be signed by the VP/Product Lead. They must explicitly accept the 40% increase in bug escape rate as the cost of doing business.
  **Mitigation:** If approved, Eng Lead must demand investment in automated testing to restore QA coverage within the 2-week window, rather than simply cutting manual QA time.

  ---

  ### Implementation Note for the Eng Lead
  When you introduce this, frame it as **"Risk Management"** not **"Ethics."** Engineers respond well to risk.
  *   **Case 1** is a *Retention Risk* (users churn later).
  *   **Case 2** is a *Compliance/Reputation Risk*.
  *   **Case 3** is a *Stability Risk*.

  The SGF doesn't stop you from competing; it stops you from competing in ways that bankrupt your future.
