          *   *Analysis:* Classic engagement trap. Metric gaming.
          *   *Verdict:* Likely "No" or "Heavy Caution." Let's make it a "No" to satisfy the prompt's requirement for at least one "Don't Do It."
      *   *Case 2: Auto-enroll Telemetry.*
