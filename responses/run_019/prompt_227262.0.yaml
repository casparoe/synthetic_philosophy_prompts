answer: |-
  This is a classic formulation of what philosophers call the **Luck Argument** (specifically, a version of Galen Strawson's "Basic Argument"). Your roommate has distilled a very powerful challenge to moral responsibility. It feels airtight because it relies on a principle that seems undeniable: *you can't be responsible for what you didn't control.*

  Here is the breakdown you asked for: three places to attack, a defense of the strongest one with a "cost account," and a verdict on your intuitions (a) and (b).

  ### Three Distinct Attack Points

  1.  **Attack Premise 1 (The Control Principle):** Argue that blame is not essentially a "verdict" about metaphysical control. Instead, following P.F. Strawson, argue that blame is a **reactive attitude** (like resentment or gratitude) inherent to human relationships. It doesn't require "could have done otherwise" in a cosmic sense; it only requires that the agent participated in the interpersonal community.
      *   *The Move:* Change the definition of blame from "cosmic justice" to "social relationship."
  2.  **Attack Premise 5 (The Definition of "Up To You"):** Argue that "up to you" does not require **Ultimate Responsibility** (choosing your own nature). It only requires **Ownership** and **Reasons-Responsiveness**. Even if you didn't choose your character, if your actions flow from *your* reasoning process and *you* endorse them, they are "up to you" in the only sense that matters for agency.
      *   *The Move:* Stop the regress. Admit luck created the agent, but insist the agent still acts.
  3.  **Attack Premise 4 (The Equivalence of Luck):** Argue that **Constitutive Luck** (who you are) is fundamentally different from **Resultant Luck** (what happens). We shape our character over time through smaller choices. The "cold-blooded planner" had opportunities to reform their character that the "lucky driver" didn't need.
      *   *The Move:* Deny that character is purely luck; argue it is "slow-grown" responsibility.

  ---

  ### The Strongest Attack: Rejecting Premise 5 (The "Ultimacy" Requirement)

  I recommend attacking **Premise 5**: *"If you didn't choose the thing, it wasn't up to you in the sense (1) requires."*

  This is the engine of the "shrinking target." It assumes that for something to be "up to you," you must be the **ultimate origin** of it (i.e., you must have chosen your own psychology). This is an impossibly high bar. It demands that you pull yourself up by your own bootstraps *before* you have boots.

  **The Defense:**
  You can argue that "up to you" should mean **"governed by your agency,"** not **"created by your agency."**
  Consider a computer. You didn't build the hardware (your brain/genetics), and you didn't write the base code (your upbringing/temperament). But when the computer processes data, the output is still determined by its internal logic, not just external force. If the computer is functioning properly, the output is "up to" the computer.
  Similarly, when you make a choice, even if your preferences were influenced by luck, the *process* of weighing those preferences and acting is an exercise of your agency. As long as you are **reasons-responsive** (you would have acted differently if there were a good reason to), the action is "up to you," even if the *you* that acted was partly shaped by luck.

  **The Cost Account (What you lose):**
  If you take this route (which makes you a **Compatibilist**), you pay a significant metaphysical price.
  1.  **No Ultimate Responsibility:** You must admit that, in a cosmic sense, the agent *is* lucky. You cannot claim the agent is the *uncaused cause* of their action. You are conceding that if you rewound the universe to the Big Bang, the agent would inevitably make the same choice.
  2.  **Retribution is Harder to Justify:** You lose the cleanest justification for **punitive desert**. If the agent didn't ultimately choose their nature, can you really say they *deserve* to suffer purely for past wrongs? You can still justify punishment for safety, rehabilitation, or moral communication, but the "eye for an eye" retributive instinct loses its logical foundation. You can no longer say, "He deserves pain because he could have been otherwise in an absolute sense."

  **Verdict on (a) and (b):**
  If you accept this cost, **you can keep both (a) and (b).**
  *   **(a) Drunk Drivers:** Both displayed the same reckless will. The outcome was luck, but the *agency* was identical. Equal blame.
  *   **(b) Cold-Blooded Planner:** The planner's will was responsive to reasons (they chose cruelty for gain). Even if their capacity for cruelty was partly luck, the *exercise* of it was an act of their agency. They are blameworthy.
  *   **The Catch:** You must accept that "blameworthy" no longer means "metaphysically guilty in the eyes of the universe." It means "appropriately targeted for moral sanction within a community of agents."

  ---

  ### The Runner-Up: Attacking Premise 1 (The Control Principle)

  **The Move:** Argue that Premise 1 is false. Blame is *not* a verdict on control. Blame is a demand for accountability within a relationship.
  **The Cost:** This is more expensive than attacking Premise 5.
  1.  **You Redefine Blame:** You are no longer talking about the same thing your roommate is. To them, blame is about *fairness*. To you, blame is about *social norms*. This often feels like a verbal victory rather than a substantive one.
  2.  **The "Innocent" Problem:** If blame doesn't require control, it becomes harder to explain why we *don't* blame people who are clearly out of control (e.g., the insane or coerced). You have to draw a new line somewhere, and it often ends up looking arbitrary compared to the "control" line.

  **Verdict on (a) and (b):**
  You can keep both, but they feel thinner. Blame becomes less about "justice" and more about "maintenance of social order."

  ---

  ### The Hard Truth About (a) and (b)

  You wrote: *"I suspect I can't cleanly have both."*

  You are right, **but only if you accept your roommate's definition of "Fairness."**

  Your roommate is operating with a **Retributivist/Incompatibilist** framework. In *that* framework, (a) and (b) are indeed incompatible.
  *   If you insist on (a) (outcomes don't matter), you focus on the Will.
  *   If you then analyze the Will, you see it is determined by luck (Premise 4).
  *   If you demand "Fairness" means "No Luck," you must abandon blame for the Will too.
  *   So you lose (b).

  **To keep both (a) and (b), you must drop the idea that "Fairness" requires "Freedom from Luck."**
  You have to accept a world where **luck is everywhere**, but **agency is still real.**
  *   The drunk driver was lucky no kid was there.
  *   The murderer was lucky to be born with a temperament that allowed cruelty.
  *   **Both are lucky.** But only one *acted* on a bad will.

  **My Recommendation:**
  Drop the demand for **Ultimate Fairness**. It is a fantasy. No one chooses their parents, their genes, or their neural chemistry. If "fair blame" requires choosing your own soul, then blame is indeed impossible.

  But if "fair blame" means **"holding people accountable for the choices that issue from their own minds,"** then you can keep both (a) and (b).
  *   **The Cost:** You must stop viewing blame as a cosmic balancing of scales. You must view it as a tool for navigating a world where we are all, to some degree, products of luck, but still capable of choice.

  Tell your roommate: *"You're right that we don't choose our nature. But 'up to me' doesn't mean 'created by me.' It means 'governed by me.' I didn't build my brain, but I'm the one driving it. That's enough for blame, even if it's not enough for cosmic justice."*
