answer: |-
  Here is a sequence of 10 questions designed to corner the argument without losing the thread. The tone is direct and skeptical, assuming you've done the reading and aren't impressed by deflection.

  **1. The Darwin Inference**
  "In *The Formation of Vegetable Mould*, Darwin opens by announcing a book about dirt. But a few chapters in, he's watching worms drag leaves into burrows by the narrow end, handling paper triangles, and he concludes this shows intelligence rather than blind instinct. He's inferring mentality from flexible behavior. Is your argument basically the same inference Darwin made, just with fancier tools? Or do you think you're doing something fundamentally different than he was?"

  *   **Likely Answer:** He'll say it's the same *kind* of inference but vastly stronger because we now have neurobiology, not just behavior.
  *   **Follow-up:** "Okay, but Darwin didn't have nociceptors. He had behavior. You have behavior *plus* neural mechanisms. But mechanisms aren't feelings. A thermostat has a feedback loop, but it doesn't suffer. When you point to a nociceptor firing in a fruit fly, what exactly are you pointing to that proves *felt* pain rather than just a very clever reflex? Where is the line, and do you think Darwin was over it, under it, or is the line itself the problem?"

  **2. The Probability Number**
  "Your scale argument relies on expected value. You're multiplying the moral weight of suffering by the number of insects. But to get an expected value, you need a probability. You need a number. Do you actually assign a specific credence to insect sentience? Is it 1%? 10%? 50%? Or is it just 'non-zero'?"

  *   **Likely Answer:** He'll avoid a specific number and say something like, "Any reasonable person should assign at least some non-negligible probability."
  *   **Follow-up:** "I want to pin down 'non-negligible.' In your calculation, is that probability doing any real work, or is it just a vibe dressed up as a probability? Because if you change that number by a factor of ten, does your conclusion about insect suffering dwarfing factory farming still hold?"

  **3. The Justification for Credence**
  "Let's say you stick with 'non-negligible.' How do you justify that number? In probability theory, you usually conditionalize on data, or you have a frequency model. Here we have no frequency, no model, and we can't ask the insects. What makes a probability 'reasonable' when there's literally nothing to conditionalize on?"

  *   **Likely Answer:** He'll lean on 'precautionary principle' or 'structural similarity to humans.'
  *   **Follow-up:** "But structural similarity is how people used to argue women or other races had lesser capacity for reason. If you're building a moral framework on a probability you can't derive from data, aren't you just importing your own intuition and calling it math?"

  **4. The Nematode Reductio**
  "Let's follow the numbers down. Nematodes outnumber insects by orders of magnitude. *C. elegans* has 302 neurons and a fully mapped connectome. They react to damage. Does your argument extend to them? To rotifers? If the logic is 'low probability times huge numbers,' nematodes should dwarf insects in expected suffering."

  *   **Likely Answer:** He might hesitate, then say there's likely a complexity threshold where sentience drops off.
  *   **Follow-up:** "Okay, a threshold. But what is that threshold that isn't gerrymandered to land conveniently on insects? If you draw the line at 100,000 neurons, is that because of evidence, or because that's where the bugs you care about live?"

  **5. The Microbiology of Ethics**
  "If you bite the bullet and say yes, nematodes count too—have you received the memo that this now sounds like a worldview where microbiology is the main branch of ethics? If the moral calculus is dominated by microscopic organisms, does the concept of 'moral action' even survive? How do you live a life where stepping on grass is potentially worse than factory farming?"

  *   **Likely Answer:** He'll say we can't know about nematodes yet, or that we must act on the best available evidence (which points to insects).
  *   **Follow-up:** "But if the *risk* is what drives the argument, the risk is higher with nematodes because there are more of them. So why aren't you advocating for a halt to all soil tillage? If the answer is 'we don't know enough,' why is that excuse good for nematodes but not for insects?"

  **6. The Fanaticism Problem**
  "Any framework where a tiny chance of an astronomical stake dominates everything seems exploitable. If I come to you with a cause that has a one-in-a-million chance of saving a quadrillion beings, your framework says I win over saving a billion certain lives. You'll say your probabilities aren't *that* tiny. But so there's a probability below which the argument fails. Where is it?"

  *   **Likely Answer:** He'll say insect sentience is well above that cutoff based on the biological evidence.
  *   **Follow-up:** "Is insect sentience actually above that cutoff by a method you'd accept from someone else? If a religious group said there's a 5% chance embryos feel pain from conception, would you accept their probability? If not, why is your 5% better than theirs?"

  **7. Aggregation and Weighting**
  "Even granting pain, is one bee's bad minute the same kind of moral unit as one chicken's bad minute? A chicken has a cortex, a bee has a ganglion. The experiences might be qualitatively different. Are you smuggling in equal weight per individual while your opponents weight by capacity for experience?"

  *   **Likely Answer:** He'll say "Suffering is suffering," implying a binary moral status.
  *   **Follow-up:** "If you weight even slightly by richness of experience—by the depth of the suffering—does the numbers advantage survive? Or does the math only work if you treat a bee's nervous system as morally equivalent to a mammal's?"

  **8. The Policy Question**
  "Let's get concrete. What would you actually have us do tomorrow? Fewer pesticides? Different crop science? Stop eating sugar? You have a book arguing this is the biggest moral problem on earth. What is the policy?"

  *   **Likely Answer:** He tends to retreat to "We're just raising the question," or "We need more research."
  *   **Follow-up:** "If the stakes are as big as you say, isn't inaction on your own framework a catastrophe? If you know there's a 10% chance of a catastrophe, you don't just 'raise the question.' You act. So if you're not calling for specific bans, was the framework ever doing anything other than generating anxiety?"

  **9. The Cost of Retreat**
  "You often say we need to stay humble. But humility has a cost. If you're right, billions of chickens are suffering needlessly, but quintillions of insects are suffering worse. If you retreat to 'we need more research,' you're effectively choosing the status quo. On your own expected value terms, isn't that retreat a moral failure?"

  *   **Likely Answer:** He will argue that premature action could cause more harm (e.g., switching to crops that hurt more insects).
  *   **Follow-up:** "Then we're back to calculation. And if the calculation is too hard to act on, why is it robust enough to claim this is the *biggest* moral problem? You can't have it both ways: too uncertain to act, but certain enough to rank."

  **10. Falsification**
  "Last question. What evidence could count *against* the view? I don't mean weaken it. I mean, what finding would make you shelve the whole project? Is there a scan, a behavior, or a neural map that would convince you insects are definitely *not* sentient?"

  *   **Likely Answer:** He might say finding a purely mechanical explanation for all pain behavior.
  *   **Follow-up:** "But we can give mechanical explanations for human pain behavior too. If the standard of proof required to shelve the project is impossible to meet for insects but not for humans, isn't that a double standard?"

  ***

  ### Where to let the silence work

  The two questions most likely to produce a genuinely newsworthy answer are **Question 3 (The Justification for Credence)** and **Question 6 (The Fanaticism Problem)**.

  *   **Question 3** attacks the mathematical engine of his argument. If he admits the probability is a "vibe" or intuition rather than a derived number, it undermines the "Expected Value" claim that makes the book controversial. If he hesitates here, let the silence sit. It highlights that the "math" is philosophical posturing.
  *   **Question 6** forces him to confront the *Pascal's Mugging* structure without you using the dorky jargon. If he cannot define where the probability cutoff is without sounding arbitrary, he admits his framework is vulnerable to any crazy cause with a big enough number. This is the soundbite that critics will use.
