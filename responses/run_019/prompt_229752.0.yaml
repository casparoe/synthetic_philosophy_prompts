answer: |-
  # Diagnostic Decision Tree: The Boundary of the Demos

  **Instructions:** Start at **Node 1**. Answer the question based on your intuition about the case described. Follow the arrow corresponding to your answer until you reach a **Leaf**. Read the leaf to see which principle of democratic membership matches your judgments.

  ***

  ### Node 1: The Opener (Fixed Status vs. Causal Impact)
  **Case:** A city votes on a **rent-control ordinance**. Long-distance commuters work in the city daily and pay local taxes, but live outside the city limits and cannot vote.
  **Question:** Should these commuters have a **vote** in the ordinance?
  *   **YES** (Their presence/impact matters more than their address) → Go to **Node 2**.
  *   **NO** (Voting is tied to residency/citizenship status) → Go to **Node 5**.

  ***

  ### Node 2: The Scope of Impact (Affected vs. Subjected)
  **Case:** An **upwind factory** emits pollution that crosses a national border, harming health in a neighboring country. The neighbors are not citizens of the factory's country and are not subject to its laws.
  **Question:** Should the foreign neighbors have a **vote** in regulating the factory?
  *   **YES** (Harm grants standing, even without legal subjection) → Go to **Node 3**.
  *   **NO** (Only those bound by the law should decide it) → Go to **Leaf: All-Subjected Principle**.

  > **⚠️ Diagnostic Note on Convergence:** You have arrived at the **All-Subjected Principle**. Be aware that in most *domestic* cases (like Node 1), this principle yields the same result as the All-Affected Principle. They diverge only in cross-border or extraterritorial cases like this one. To split them cleanly, we rely on this specific "upwind" scenario; in standard elections, they often overlap.

  ***

  ### Node 3: The Threshold of Impact (Binary vs. Intensity)
  **Case:** A large country proposes a **carbon tax**. The tax slightly inconveniences its own voters but prevents the total inundation of a **low-lying island state**.
  **Question:** Does *any* causal effect grant a vote, or must the interest be **decisively intense**?
  *   **ANY EFFECT** (Even small impacts grant standing) → Go to **Node 4**.
  *   **INTENSE EFFECT ONLY** (Standing scales with stakes) → Go to **Leaf: Stakeholder Principle**.

  ***

  ### Node 4: The Temporal Boundary (Participation vs. Consideration)
  **Case:** A site for **long-term nuclear waste** is chosen now. It will remain dangerous for 10,000 years, binding people **not yet born**.
  **Question:** Can future people have standing without collapsing into proxy representation?
  *   **THEY GET A VOTE** (We must institutionalize proxy representation for them) → Go to **Leaf: All-Affected (Radical)**.
  *   **INTERESTS COUNT, NO VOTE** (Living trustees must protect their interests, but they cannot vote) → Go to **Leaf: All-Affected (Moderate)**.

  ***

  ### Node 5: The Status Boundary (Territory vs. Membership)
  **Case:** Consider **permanent residents** who are not citizens, and **citizens** living permanently abroad.
  **Question:** Should **non-citizen residents** be allowed to vote in national elections?
  *   **YES** (Presence on the territory is what matters) → Go to **Node 6**.
  *   **NO** (Legal citizenship is required) → Go to **Node 7**.

  ***

  ### Node 6: The Expatriate Check (Territorial vs. Cultural)
  **Case:** Using the same logic as Node 5, should **citizens living permanently abroad** retain their vote?
  *   **YES** (Residents vote, Expats vote → Membership follows the person/culture) → Go to **Leaf: Cultural/National Demos**.
  *   **NO** (Residents vote, Expats do not → Membership follows the soil) → Go to **Leaf: Territorial Principle**.

  ***

  ### Node 7: The Citizenship Check (Status Quo vs. Exclusion)
  **Case:** Using the same logic as Node 5 (Non-citizens cannot vote), should **citizens living permanently abroad** retain their vote?
  *   **YES** (Citizens vote regardless of location) → Go to **Leaf: Citizenship Status Quo**.
  *   **NO** (Only present citizens vote) → Go to **Leaf: Unnamed (Exclusionary)**.

  ***

  ### Leaf Definitions

  *   **All-Subjected Principle:** The demos includes everyone coerced by the law. (Reached via Node 2).
  *   **Stakeholder Principle:** The demos includes everyone whose vital interests are intensely affected. (Reached via Node 3).
  *   **All-Affected (Radical):** Everyone causally impacted gets a vote, including future generations via proxy. (Reached via Node 4).
  *   **All-Affected (Moderate):** Everyone causally impacted must have their interests counted, but voting is limited to the living. (Reached via Node 4).
  *   **Cultural/National Demos:** The demos is defined by shared identity or membership, regardless of territory. (Reached via Node 6).
  *   **Territorial Principle:** The demos is defined by physical presence within the jurisdiction. (Reached via Node 6).
  *   **Citizenship Status Quo:** The demos is defined by current legal citizenship rules. (Reached via Node 7).
  *   **Unnamed (Exclusionary):** Only present citizens vote; residents and expats are excluded. *Why nobody is here:* This combination is rarely defended in theory because it arbitrarily disenfranchises residents subject to coercion while enfranchising expats unaffected by local policy.

  ***

  ### Confidence Note (For the Instructor)

  **Overall Confidence:** High. The tree successfully sorts students into the major normative camps (Affected, Subjected, Status-based) using the required cases without requiring prior knowledge of the labels. The distinction between Participation and Consideration (Node 4) effectively isolates the "proxy representation" problem inherent in the All-Affected principle.

  **Least Certain Branch:** I am least confident in the stability of the split between **All-Subjected** and **All-Affected** at **Node 2**. While the "Upwind Factory" case is the standard theoretical wedge, empirically, many students may answer "No" to the foreign neighbors voting not because they hold the All-Subjected principle, but because they hold a *Territorial* view (Node 5 logic) that they applied prematurely at Node 1. If a student believes "Voting is for residents" (Territorial) but "Comuters are effectively residents" (Node 1 Yes), they might still say "No" to foreign neighbors at Node 2 for territorial reasons, not subjection reasons. This could misclassify a Territorial thinker as All-Subjected.

  **Recommendation:** If a student lands on **All-Subjected**, ask them a follow-up: "If a foreigner moved to the city tomorrow, would they get a vote?" If yes, they are likely Territorial, not All-Subjected. The tree treats these as distinct paths, but student intuitions often blend Territory and Subjection.
