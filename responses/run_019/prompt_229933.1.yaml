  **Submission Guidelines & Stylistic Conventions**

  1.  **Terminological Precision:** Manuscripts must not employ phrases such as "what-it-is-like," "phenomenal character," or "qualia" except within quotation marks when citing opposing literature. Authors must rewrite such claims as assertions regarding introspective states that systematically misrepresent physical processes as possessing non-physical properties. (The journal does not publish ontological commitments to properties that do not exist.)

  2.  **Usage of "Seems":** The verb "seems" is permitted only where the seeming can be cashed out functionally in terms of input-output dispositions or cognitive access. An ineffable seeming is indistinguishable from a phenomenal property and is therefore disallowed. (If it seems ineffably thus, you have smuggled in a ghost.)

  3.  **The Meta-Problem:** Papers addressing the meta-problem of consciousness must explain why humans are disposed to judge that experience has phenomenal character without allowing that disposition to inherit the character it misdescribes. The explanation must remain wholly physicalist. (Explaining the error is the goal; validating the error is grounds for rejection.)

  4.  **Pain and Negative Affect:** Descriptions of pain must characterize it as a state whose representational content outruns anything actually instantiated in the subject's ontology. Authors should avoid language implying the painfulness is intrinsic to the state rather than represented as such. (The hurt is real, the hurting property is not.)

  5.  **Regress of Seemings:** Manuscripts may acknowledge that it may seem that it seems, but authors must maintain that the second seeming is as merely representational as the first. Appeals to "a certain je ne sais quoi" or "residual presence" to halt the regress are prohibited. (Infinite regress of representations is preferable to finite regress of realities.)

  6.  **Self-Refutation Objections:** The editorial board maintains a standing house policy for the recurring letter-to-the-editor arguing that illusionism is self-refuting because an illusion of consciousness would itself have to be conscious. Authors need not engage this objection in full unless offering a novel dissolution. (See *Frankish 2016* for the standard deflationary response; citations suffice.)

