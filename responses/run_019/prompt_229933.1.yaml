  8.  **Introspective Authority:** Do not appeal to the undeniable nature of experience as premise. The undeniability is itself the target of explanation. (Certainty is a feature of the module, not the world.)

  9.  **Abstract Requirements:** Abstracts must explicitly state which physical or functional mechanism generates the user-illusion of phenomenality. Papers proposing non-physical mechanisms will be desk-rejected. (Magic is not a mechanism.)

  10. **Reference Formatting:** When citing dualist literature, prepend "[Erroneous]" to the title of the work in your bibliography. (Optional, but encouraged for clarity.)
