answer: |-
  Dear Colleague,

  It is a pleasure to engage with your considered view on biological function, and I appreciate the opportunity to serve as a sounding board before you present this to your colleagues. You have assembled a set of commitments that reflect the most pressing intuitions in the field, namely the desire to preserve the normativity of the etiological account while accommodating the phenomenological reality of novel traits and the epistemic practices of biologists. However, in auditing these five theses for consistency, I must be direct: while each thesis is defensible in isolation, they do not form a coherent web as currently stated. There are deep structural tensions here, particularly between your metaphysical commitments and your epistemic or modal commitments. I will walk you through these tensions, rank them by severity, and outline the costs of the revisions required to resolve them.

  The most severe tension exists between your first and fourth theses. Your first thesis asserts an etiological account where selection history is what distinguishes genuine function from accidental effect. This is a metaphysical claim about the nature of function itself. Your fourth thesis, however, claims that whether a part has a function should be determinable from the organism's current organization without first settling its selection history. If function is constituted by selection history, as thesis one claims, then it is metaphysically impossible to determine function without settling that history, unless current organization is a perfect and infallible proxy for history, which it is not. You cannot have it both ways: either function is historical, in which case thesis four is false because you cannot determine a historical fact from a synchronic snapshot, or function is determinable from current organization, in which case thesis one is false because history is not constitutive. This is not merely an epistemic difficulty but a metaphysical contradiction. To resolve this, you would need to revise thesis four to claim only that function is often inferred from current organization as a heuristic, acknowledging that such inferences are fallible proxies for the historical reality posited in thesis one. The cost of this revision is that you lose the strong claim that biologists are directly accessing function when they look at structure; instead, they are making educated guesses about history. Alternatively, you could revise thesis one to allow that function is constituted by current organizational properties that typically indicate selection, but this moves you closer to the systemic accounts you wish to avoid.

  The second most severe tension lies between your first and second theses. This is the classic problem of novel traits for etiological accounts. Thesis one states that a trait's function is the effect for which it was selected. Thesis two states that a fresh mutation can have a function in the first generation, before selection has acted. Strictly speaking, if no selection has occurred, there is no selection history, and thus on the definition provided in thesis one, there is no function. You are attempting to grant normative status to a trait before it has earned that status through the filtering process of natural selection. To keep both, you must revise thesis one to accommodate prospective function or revise thesis two to claim that novel traits have only a proto-function or service until selected. If you revise thesis one to include effects that are potentially selectable, you blur the line between function and mere beneficial effect, which threatens your fifth thesis. If you revise thesis two to deny function to the first generation, you contradict the strong intuition you wish to capture, namely that a working heart pumps blood regardless of its lineage. The cost here is either logical consistency or intuitive coverage of novel cases.

  A moderate tension exists between your fourth and fifth theses. You reject the causal-role account in thesis five because it is too permissive, counting incidental effects like heart sounds as functions. Yet, in thesis four, you insist that function is determinable from current organization. The primary advantage of the causal-role account is precisely that it relies on current organization. The primary disadvantage is the permissiveness you note in thesis five. If you abandon selection history as the filter (as implied by thesis four) but still want to avoid permissiveness (as required by thesis five), you need a new filter located within current organization. Usually, philosophers introduce a contribution to fitness or survival as this filter. However, appealing to fitness contribution often smuggles in forward-looking etiological considerations or collapses into a systemic account that struggles to distinguish function from incidental beneficial effects without a normative history. To resolve this, you would need to specify exactly which features of current organization distinguish functional effects from incidental ones without appealing to history. The cost of this revision is significant theoretical labor to define a synchronic normativity that does not collapse into the causal-role account you reject.

  Finally, there is a tension between your second and third theses regarding explanation. Thesis three holds that function attributions explain the presence or maintenance of the trait. Thesis two grants function to novel traits that have not yet been selected. If a trait has not been selected, its function cannot explain its presence or maintenance in the population, because it is not yet being maintained by selection. It might explain why the trait is retained in the future, but not why it is here now. To reconcile these, you must revise thesis three to allow that function explanations are sometimes prospective, explaining why a trait will be maintained rather than why it is currently present. The cost of this revision is that you weaken the explanatory link between function and etiology, as the explanation no longer tracks the actual causal history of the trait's presence but rather its potential future history.

  In ranking these tensions, the conflict between the metaphysical definition of function as history and the epistemic claim that it is readable from current structure is the most damaging, as it strikes at the core of what function is. The novelty problem is second, as it is a well-known boundary condition for etiological accounts. The permissiveness problem is third, as it concerns the boundaries of the concept rather than its existence. The explanatory scope is fourth, as it can be adjusted by tweaking the notion of explanation.

  To keep all five theses in something resembling their current form, you would need to adopt a hybrid view that distinguishes between the metaphysics of function and the epistemology of function attribution. You could argue that function is indeed etiological, satisfying thesis one and five, but that we are justified in attributing function to novel traits based on current organization because such organization is reliable evidence of future selection, satisfying thesis two and four as epistemic claims rather than metaphysical ones. Thesis three would then need to be adjusted to acknowledge that in novel cases, the explanation is prospective. However, you must be aware that this moves you away from a pure etiological account toward a dual-concept view, where what biologists call function in the lab might differ from what philosophers define as function in metaphysics. If you are willing to pay the cost of admitting that biologists are sometimes speaking loosely about proto-functions when they analyze novel traits, you can preserve the core etiological commitment. If you are unwilling to make that concession, you must loosen the historical requirement in thesis one, which risks losing the normative force that motivated your rejection of the causal-role account in thesis five. I hope this audit helps you refine your position for your colleagues, as these are precisely the objections they will raise.

  Sincerely,

  Your Colleague
