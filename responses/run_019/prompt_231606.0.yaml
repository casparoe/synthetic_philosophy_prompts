answer: |-
  # Joint Statement on the Status of Grounding Discourse

  **Signed:** The Grounding Realists & The Grounding Deflationists  
  **Date:** October 26, 2023  
  **Subject:** Outcomes of Adversarial Collaboration on Metaphysical Grounding

  Following a period of adversarial collaboration, the undersigned parties submit this joint statement to clarify the extent of our agreement, the precise locus of our remaining disagreement, and the empirical or conceptual tests that might adjudicate our differences. We acknowledge that while we utilize the same vocabulary ("grounds," "in virtue of," "because"), we have historically diverged on the ontological commitments required to license that vocabulary. This document records our convergence on the formal features of grounding discourse and isolates our disagreement to the metaphysical interpretation of those features.

  ### I. Shared Commitments regarding Grounding Discourse

  Both parties affirm that grounding discourse, when used in its central metaphysical sense, adheres to the following formal constraints. We agree that any adequate account of grounding must respect these features:

  1.  **Factivity:** Grounding claims are factive. If it is true that $A$ grounds $B$, then both $A$ and $B$ obtain (are true/exist). Falsehoods or non-obtaining states of affairs cannot serve as grounds or grounded items.
  2.  **Asymmetry and Irreflexivity:** In central cases, grounding is asymmetric and irreflexive. If $A$ grounds $B$, then $B$ does not ground $A$; and nothing grounds itself. We acknowledge that apparent counterexamples (e.g., mutual dependence) are best analyzed as distinct grounding chains or circularity errors rather than violations of this structural constraint.
  3.  **Hyperintensionality:** Grounding is hyperintensional. Necessarily equivalent facts are not interchangeable *salva veritate* in grounding contexts. That $A$ is necessarily equivalent to $B$ does not entail that $A$ grounds $B$, nor does it allow $A$ to substitute for $B$ as a ground for some $C$.
  4.  **Non-Reduction:** Grounding cannot be reduced to material conditionals, strict conditionals, or bare necessary covariation. The claim "$A$ grounds $B$" entails more than $\square(A \to B)$; it entails a specific direction of determination or explanation that modal profiles alone do not capture.
  5.  **Explanatory Power:** Grounding claims license and back distinctively metaphysical explanations. To say "$B$ obtains in virtue of $A$" is to provide an answer to the question "Why does $B$ obtain?" that is distinct from causal or nomological explanation.

  ### II. Statement of Residual Disagreement

  While we agree on the *logic* and *utility* of grounding discourse, we disagree on its *ontology*. The disagreement is not about whether grounding claims are true (both sides accept many as true), but about what makes them true and what their truth implies about the structure of reality.

  **1. On the Unity of the Relation**
  *   **Grounding Realists:** Maintain that there is a unified, sui generis (or small systematic family of) non-causal dependence relation(s) in the world. The various uses of "in virtue of" succeed by picking out this real relation or its determinates.
  *   **Grounding Deflationists:** Maintain that there is no single worldly relation corresponding to all grounding talk. "Grounding" is a functional term that regimentsexplanatory priority. Different cases (metaphysical, normative, logical) involve different underlying mechanisms unified only by their role in our explanatory practices.

  **2. On the Fact of the Matter**
  *   **Grounding Realists:** Hold that there is a fact of the matter about which facts ground which, over and above our best explanatory theories. The world possesses a mind-independent hierarchical structure; our theories succeed by mapping onto this structure.
  *   **Grounding Deflationists:** Hold that there is no fact of the matter about ground *over and above* the facts regarding explanatory priority and inferential license. Grounding is exhausted by its role in theory organization; there is no "hidden structure" waiting to be discovered beyond the limits of ideal explanation.

  **3. On the Contribution of "Fundamental"**
  *   **Grounding Realists:** Define the "fundamental" as that which is ungrounded in the worldly dependence structure. A fact is fundamental only if no real dependence relation terminates on it.
  *   **Grounding Deflationists:** Define the "fundamental" as a status within the explanatory enterprise. A fact is fundamental if it functions as an axiom or terminus in our best systematization of knowledge, regardless of whether a mind-independent "bottom" exists.

  **4. On "What Grounds the Grounding Facts?"**
  *   **Grounding Realists:** Generally hold that grounding facts (e.g., *that Socrates grounds {Socrates}*) themselves obtain in virtue of the essences of the relata or the obtaining of the relation itself. This may lead to a regress that must be halted by brute structural facts.
  *   **Grounding Deflationists:** Generally hold that asking what grounds the grounding facts is a category mistake. Once the relata ($A$ and $B$) obtain and the explanatory connection is licensed, there is no further fact "the grounding" that requires grounding.

  ### III. Crux Table

  The following table identifies specific sub-questions where our theoretical commitments yield different predictions or methodological stances. We agree that settling these cases would significantly alter the plausibility of one or both positions.

  | Sub-Question | Concrete Case | Grounding Realist Prediction | Grounding Deflationist Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Truthmakers for Grounding Claims** | **Socrates and his Singleton:** The claim "Socrates exists grounds {Socrates} exists" is true. What *makes* this grounding claim true? | **Requires a Further Fact:** The truth of the grounding claim requires a worldly relational fact (or essence-based fact) distinct from the mere existence of Socrates and {Socrates}. | **Requires No Further Fact:** The truth of the grounding claim is exhausted by the existence of Socrates and {Socrates} plus the explanatory license connecting them. No relational entity is added. |
  | **2. Metaphysical Possibility of Infinite Descent** | **Non-Well-Founded Chains:** A possible world where every fact $F_n$ is grounded by $F_{n+1}$, with no ungrounded base. | **Impossible:** Such a world is metaphysically incoherent. Reality must be well-founded because dependence relations require a terminal node in the worldly structure. | **Possible:** Such a world is metaphysically coherent provided the explanatory chain is internally consistent. Well-foundedness is a regulative ideal of theory, not a constraint on reality. |
  | **3. Fundamentality under Epistemic Limits** | **The Simulation Scenario:** We discover our universe is a simulation, but the "base reality" code is permanently inaccessible to our physics. Are our physical laws fundamental? | **No:** Fundamentality is mind-independent. Even if inaccessible, our laws are grounded in the base reality's code. We are not fundamental. | **Yes (Provisionally):** Fundamentality is explanatory status relative to a cognitive agent. If the code is explanatorily inaccessible, our laws function as fundamental within our enterprise. |

  ### IV. Closing Note on Verbal Disputes

  During this collaboration, we identified several areas of previous friction that we now conclude were merely verbal or conflated distinct issues.

  Specifically, we set aside the **Statue and Lump of Clay** case from our initial Crux Table. We determined that debates over this case often conflated *grounding* with *constitution* and *identity*. Disagreements here frequently turned on whether "the statue" and "the lump" refer to the same object under different sorts (a semantic issue) or distinct coincident objects (an ontological issue). We agreed that these issues can be settled independently of the grounding debate. Consequently, we replaced this row with the **Simulation Scenario** (Row 3 above), which more cleanly isolates the disagreement over whether fundamentality is a worldly status (Realist) or an explanatory status (Deflationist).

  Furthermore, we acknowledge that our previous disagreements regarding the "existence" of grounding relations were often verbal. The Grounding Deflationists do not deny that grounding *claims* are true; they deny that truth requires a robust relational ontology. The Grounding Realists do not claim grounding relations are "entities" in the sense of concrete particulars; they claim they are structural features of reality. We agree to future discourse wherein "existence" claims regarding grounding are explicitly qualified as either *ontological* (Realist concern) or *discursive* (Deflationist concern) to prevent talking past one another.

  ***

  **For the Grounding Realists:**  
  *Dr. Elena Vance*

  **For the Grounding Deflationists:**  
  *Dr. Julian Thorne*
