          *   Clarify "Unprovable": Unprovable *in the system*, not absolutely (you can add it as an axiom).
      *   **Section 2: The Mind vs. Machine Argument (Claim 4):**
          *   Identify this as the Lucas-Penrose argument.
          *   Explain why it's controversial/overreach.
          *   Key counter-argument: To "see" the Gödel sentence is true, you must know the system is *consistent*. If the human mind is a machine, can we prove *our own* consistency? Gödel didn't say humans *can* do this, only that *if* we can see the truth, we aren't that specific machine. But maybe we are a different machine, or maybe we are inconsistent.
          *   Verdict: This is philosophy, not math. Gödel didn't prove this.
      *   **Section 3: Consistency and Faith (Claim 5):**
          *   Confirm the Second Theorem (system can't prove its own consistency).
