answer: |-
  You have put your finger on a structural rot in the philosophy of mind debate that is pervasive but rarely named. You are correct that while the *components* of the argument (derived vs. intrinsic intentionality, functionalism vs. biological naturalism) are well-trodden, the specific rhetorical maneuver of swapping between them opportunistically does not have a canonical label.

  It is not quite *equivocation* (using the same word with two meanings), because both sides usually agree on the definition of "meaning" or "intentionality" in the abstract. It is not simple *inconsistency*, because the arguer isn't contradicting themselves in a way that collapses their argument; rather, they are maintaining a stable conclusion ("Humans yes, AI no") by rotating the support beams.

  Since there is no existing term, I will coin one for you.

  ### The Term: **The Etiological-Functional Toggle**

  **Definition:**
  A rhetorical maneuver in which an arguer assesses the presence of a mental property (e.g., intentionality, understanding, agency) in two distinct systems (typically Humans and AI). The arguer possesses two distinct criteria for attribution:
  1.  **Etiological:** Based on the history of the system's formation (e.g., designer intent, evolutionary selection, biological substrate).
  2.  **Functional:** Based on the system's current causal role, behavioral competence, or internal processing state.

  The **Toggle** occurs when the arguer applies the Etiological criterion to System A to *deny* the property, but applies the Functional criterion to System B to *affirm* the property, despite both criteria being applicable to both systems. Crucially, when the inconsistency is challenged, the arguer does not abandon the failed criterion but treats it as a valid "backup" standard, switching back to it if the debate focus shifts.

  **Distinctions:**
  *   **Vs. Plain Inconsistency:** In plain inconsistency, the arguer contradicts themselves (e.g., "Origins don't matter" ... "Origins matter"). In the Toggle, the arguer maintains that *both* criteria are valid measures of the property, but implies that the *weight* of each criterion shifts depending on the target. It is a claim of **contextual relevance** rather than logical error.
  *   **Vs. Equivocation:** Equivocation changes the meaning of the term (e.g., "Meaning" refers to syntax in premise 1, semantics in premise 2). The Toggle keeps the term constant ("Real Understanding") but changes the **conditions of satisfaction**.
  *   **Vs. Changing One's Mind:** Changing one's mind admits the previous standard was insufficient. The Toggle treats both standards as simultaneously sufficient, deploying them strategically to protect a pre-existing conclusion (usually Human Exceptionalism).

  ***

  ### Bonus: Mapping the Sticks to Searle vs. Critics

  You asked which measuring stick actually belongs to which side of the Searle debate. This is where the Toggle gets its traction, because it blurs the actual theoretical battle lines.

  **1. The Functional Stick (Causal Role)**
  *   **Official Owners:** **Searle's Critics (Functionalists/Computationalists).**
  *   **The Theory:** If a system processes information, responds to inputs, and maintains internal states that correlate with the world in the right way, it has intentionality. Substrate doesn't matter; organization matters.
  *   **The Toggle Usage:** AI Defenders use this to say, "The chatbot functions like it understands, so it understands." However, when the Evolutionary Point is raised ("Humans were also built by a process"), Functionalists sometimes awkwardly reach for the Etiological stick to say, "Evolution is blind, so human meaning is also derived," trying to level the playing field. This is a weakness in their armor; strict Functionalism shouldn't care about evolution, only current function.

  **2. The Etiological/Substrate Stick (Causal Powers)**
  *   **Official Owners:** **Searle (Biological Naturalism).**
  *   **The Theory:** Intentionality is a biological phenomenon caused by specific causal powers of the brain. Syntax (function) is not sufficient. You need the right "stuff" (biology).
  *   **The Toggle Usage:** Searle-adjacent Skeptics use this to say, "AI is silicon/code, so it has no meaning." However, this creates a vulnerability: if biology is the key, why does a brain created by *blind evolution* count, but a brain created by *intelligent design* (if we ever engineered one) not?
  *   **The Specific Move You Noticed:** When the Skeptic says, "The chess engine doesn't *want* to win, it was built to," they are using a **Teleological-Etiological** argument (Derived Intentionality). When they defend human pain as "real," they are implicitly switching to a **Phenomenological-Functional** argument (Intrinsic Intentionality/Qualia).

  **The Verdict:**
  The **Etiological-Functional Toggle** is essentially a confusion of **Searle's Biological Naturalism** with **Intentional Stance Pragmatism**.

  *   **Searle** wants to say: Only Biology (Origin/Substrate) grants Intrinsic Intentionality.
  *   **The Skeptic in your example** wants to say: Only Non-Designed systems (Origin) have Real Meaning.
  *   **The Contradiction:** If the Skeptic were truly Searlean, they should admit that a biologically engineered human (designed by scientists) would lack intentionality. If they admit that designed humans *would* have intentionality, they have abandoned the Etiological stick for the Functional/Biological stick.

  The reason the Toggle feels so slippery is that neither side wants to fully commit to the implications of their own stick. The Functionalists don't want to admit that a perfect functional duplicate of a human (a "Philosophical Zombie") might count as conscious. The Skeptics don't want to admit that if we found aliens created by a designer, they would lack souls/meaning. So they keep the Toggle handy to patch the holes.

  **Summary:** You have identified a **Systematic Criterion Switching** fallacy. It allows debaters to maintain **Human Exceptionalism** without committing to a metaphysics that can't survive contact with evolutionary theory or engineering. I recommend using **The Etiological-Functional Toggle**; it is precise enough to shut down the move when you see it. ("You are toggling between etiology and function to protect the conclusion; pick one and apply it to both systems.")
