  The conference room was quiet, the hum of the ventilation system the only sound remaining after the rest of the committee had departed. Elena stacked her papers slowly, while Marcus stared at the case file lying between them.

  "We cannot treat her," Elena said finally. "The directive is explicit. It was executed when she was fully competent, with legal counsel, over a period of months. It is the only document we have that reflects a mind capable of understanding death."

  Marcus rubbed his temples. "But the mind capable of understanding death is gone, Elena. The woman in bed 402 is not the woman who signed that paper. She is serene. She laughs at the volunteers. To withhold treatment based on a document written by a ghost is to sacrifice a living being for a biography."

  "That is the crux, isn't it?" Elena leaned forward. "You ground authority in psychological continuity. You argue that because the dementia has severed the links of memory and character between the past author and the current patient, the past author's authority evaporates."

  "It isn't just memory," Marcus corrected. "It's the capacity for interest. The woman who wrote the directive had critical interests—values about how her life story should end. The woman in the bed has experiential interests—comfort, joy, avoidance of pain. When the critical interests vanish, the authority to dictate care must shift to the subject who remains. If continuity is severely diminished, as it is here, binding the current self to the past self's commands is not respect; it's colonization."

  Elena shook her head. "Authority doesn't rest on continuity. It rests on competence at the moment of decision. When she signed, she anticipated this exact scenario. She knew her psychology would fracture. Her authority extends over her future precisely because she had the foresight to bind herself. If we say her authority dissolves when her dementia advances, we are saying autonomy is only valid so long as one remains the same person. That undermines the very purpose of an advance directive."

  "Unless the 'person' is no longer there to be bound," Marcus countered. "But let me ensure I am attacking the strongest version of your view. You are not simply saying 'she signed a paper.' You are arguing that a life is a unified narrative project, and that the competent self is the only one capable of authoring that narrative's conclusion. To ignore the directive is to treat her life as a series of disconnected moments rather than a whole. You believe that respecting her means honoring the integrity of that whole, even if the latter chapters are written in a hand she no longer recognizes."

  Elena nodded. "Exactly. To abandon the directive is to say that who she *was* matters less than what she *is* right now. It reduces a human life to its current state of consciousness. And yes, I would add that the new weekly documents she is drafting complicate nothing. They are fluctuating, equivocal, and lack the stability of the original. They are symptoms of her condition, not expressions of authority."

  Marcus held up a hand. "Then let me state my position equally clearly. I agree that the original directive is weighty evidence of who she was. But care must answer to the interests of the person now in the bed. The strongest version of my view is not that we ignore the past, but that we recognize the moral status of the current subject. She is capable of being benefited or harmed. The earlier self's instructions are commands from a foreign jurisdiction. Honoring them confuses fidelity to a biography with care for a patient."

  "Then consider the clause she insisted on," Elena said, tapping the file. "The self-discount clause. She anticipated she might appear content. She instructed us to treat that apparent contentment as no evidence whatsoever regarding her care. She wrote that the person enjoying that contentment would no longer be her. You call that colonization; I call it a protective boundary. She knew her values would change, and she preemptively invalidated those changes."

  "That clause is the heart of the problem," Marcus said. "It asks us to pretend away the only subject currently capable of suffering. Is it rational to bind caregivers to ignore manifest states of joy? She is adding that clause out of contempt for a condition she had not yet lived. It is a metaphysical spite. She is essentially saying, 'If I am happy but not me, my happiness counts for nothing.' That is not autonomy; that is a denial of reality. We cannot be asked to ignore the welfare of the sentient being in front of us based on a theoretical distinction the being herself can no longer grasp."

  "But she *did* grasp it," Elena insisted. "She grasped it when she was us. She decided that survival in that state was contrary to her dignity. If we override that because she now seems happy, we are saying her judgment about her own dignity was wrong. We are paternalizing the past self to protect the current self."

  "And who protects the current self from the past self's prejudice?" Marcus shot back. "This leads directly to the new directives. She is drafting wishes every week. Sometimes she refuses treatment, sometimes she asks for it. The capacity assessments are equivocal. If you ground authority in the competence of the author, why is the authority of the original document absolute while the authority of these new documents is null? During her lucid intervals, she is authoring her care *now*. If continuity is not required for the past self to bind the future, why is continuity required for the present self to bind the immediate future?"

  Elena paused. "Because of stability. The original directive was reflectively endorsed over time. It was a settled value. The new documents are reactive, fluctuating with her cognition. We treat them asymmetrically because the epistemic conditions of their creation differ. The original was a plan; the new ones are impulses."

  "But if the present self has moments of grasp," Marcus pressed, "then the present self has authority during those moments. If we accept the original directive because she was competent *then*, we must accept the new directives when she is competent *now*. To do otherwise is to privilege the dead voice over the living one simply because it speaks from the past. If you concede that the present self has any authority during lucid intervals, then the original directive is no longer a binding command; it is merely one input among many, and the current input—expressing a wish to live—must weigh heavier because it concerns the actual subject of the harm."

  "Unless," Elena said, "the original directive specifically revoked the authority of any future self to contradict it. That is what the self-discount clause does. It says, 'Do not listen to me when I am like this.' She voluntarily waived her future rights."

  "Can one waive the rights of a future being who does not yet exist to consent to that waiver?" Marcus asked. "That is the proposition I cannot accept. You argue that the past self owns the future self. I argue that the future self owns itself the moment it becomes sentient."

  They sat in silence for a moment, the ventilation humming.

  "Let us sharpen this," Elena said. "I think I see where we are stuck. You believe moral authority derives from the capacity to experience welfare. Since only the current self experiences welfare, only the current self matters. I believe moral authority derives from the capacity to form a life-plan. Since only the past self could form the plan for this stage of life, only the past self matters."

  "Close," Marcus said. "But it is more specific than that. It is about the source of the obligation. Is our duty to the *history* of the will, or to the *current capacity* for welfare?"

  "Yes," Elena said. "If the duty is to the history of the will, the self-discount clause is binding because it is part of that history. If the duty is to the current capacity for welfare, the clause is void because it demands we ignore welfare."

  "Then that is the proposition," Marcus said, closing the file. "We disagree on whether the moral obligation of the caregiver is to honor the autonomous trajectory of the life as a whole, or to maximize the well-being of the consciousness currently inhabiting it. If it is the former, the original directive governs, clause included. If it is the latter, the current expressions of wish, however fluctuating, must override the past command."

  Elena nodded slowly. "And neither of us can move from that premise without abandoning our core ethics. You cannot accept the directive without sacrificing the patient in the bed. I cannot reject it without sacrificing the person who lived the life."

  "Then we have no consensus to offer the committee tomorrow," Marcus said.

  "No," Elena replied, standing up. "We have the conflict precisely defined. That will have to be enough."
