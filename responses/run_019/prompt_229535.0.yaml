prompt: |-
  You are a philosopher with particular expertise in logic, its history, and its foundations, and you are also an experienced teacher. I need your advice on a concrete and increasingly frustrating situation. Before settling on your answer, brainstorm briefly: list the possible diagnoses of what is going wrong, the responses available to me, and the costs of each. Then give your considered advice.

  I volunteer as a tutor in an introductory reasoning program for adults. One of my students, a sharp and apparently sincere paralegal, consistently does something I don't know how to handle. Last week I walked her through a simple argument. She granted premise one: if the roads were icy, the bus was cancelled. She granted premise two: the roads were icy. I then asked: so, the bus was cancelled? She said: I don't see that I'm entitled to conclude anything. You've given me two premises. You haven't given me any reason to accept the conclusion.

  Thinking she just wanted the connecting principle made explicit, I added it as a third premise: whenever you have a conditional and its antecedent, the consequent follows. She thought about it, granted that premise too, and then said: fine, now I have three premises. I still don't see the reason to accept the conclusion. I tried once more, adding that when you have three premises of this form, the conclusion follows. You can guess what happened next. She is perfectly polite about it. She says she is not denying anything I've said; she just wants a reason for the step, and everything I offer her is, as she puts it, one more statement sitting on the pile rather than a reason to move from the pile to the bottom line.

  My co-tutor has two suggestions. First, tell the student that this is simply what 'follows' means, that the rule is not a premise but the engine that gets you from premises to conclusion, and dock her marks if she won't play along. Second, stop humoring her, because no argument can prove that arguing is legitimate, and anyone who demands one is confused about what a reason is. Meanwhile I have a practical worry of my own: I am helping a friend build a simple automated proof-checker, and I cannot shake the feeling that the same problem is lurking there too — at some point the machine has to just *make* the step rather than consult a further rule about making it.

  My questions: (1) Is there any response that meets this student on her own terms, or is she demanding something that cannot in principle be supplied — and if the latter, does that vindicate my co-tutor's second suggestion or expose it as bluster? (2) Is the first suggestion — define 'follows' at her and enforce it by grading — philosophically honest, or does it confuse a social settlement with an answer? (3) What should I actually do in the next session, pedagogically speaking, given that she is sincere? (4) Am I right that the proof-checker faces the same issue, and if so, how should that shape how we build it?

  Please flag clearly where you are confident in what you claim and where you are merely giving me your best guess, and single out the one point in your answer you are least sure of.
