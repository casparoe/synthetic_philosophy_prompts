answer: |-
  This is a fantastic philosophy puzzle. You have spotted a genuine tension in the data, but I'm going to argue that **neither of the two rules you identified actually fits all of her past verdicts.**

  If you walk into class assuming it's a battle between "Function" vs. "Material," you might get trapped. Here is the breakdown of why those rules fail, what rule she is *actually* using, the prediction, and the question that will expose her hand.

  ### 1. Why your two rules don't fit the data

  **Rule A: "It only matters how it works" (Functionalism)**
  *   **Fits:** Human/Pig Heart, Lab Cell/Natural Cell.
  *   **Fails:** Pendulum/Quartz Clock. Both keep time perfectly (same function), but she says they are **not** the same mechanism.
  *   **Fails:** Bird/Airplane Wing. Both produce lift (same function), but she says they are **not** the same mechanism.
  *   *Conclusion:* She cares about more than just the output. She cares about the *internal causal process*.

  **Rule B: "It matters what it's made of" (Materialism)**
  *   **Fits:** Pendulum/Quartz (different stuff), Bird/Airplane (different stuff).
  *   **Fails:** The Ship of Theseus. Every single plank (material) was replaced, yet she says it **is** the same mechanism.
  *   **Fails:** Human/Pig Heart. These are made of different tissue, different DNA, and different atoms, yet she says they **are** the same mechanism.
  *   *Conclusion:* She is not a strict materialist. Atoms don't define the mechanism for her.

  ### 2. The Real Rule: Homology vs. Analogy

  Your teacher is likely distinguishing between **Homologous Mechanisms** (same origin/nature) and **Analogous Mechanisms** (same result, different origin).

  *   **Human Heart vs. Pig Heart:** These are **Homologous**. They share an evolutionary history, the same biological "blueprint," and the same causal power (muscle contraction driven by electrochemical signals). Even though the atoms differ, the *nature* of the thing is the same.
  *   **Bird Wing vs. Airplane Wing:** These are **Analogous**. They do the same job, but one is evolved bone/feather and the other is engineered metal. They rely on different physical principles (flapping/morphing vs. rigid aerodynamics).
  *   **Pendulum vs. Quartz:** **Analogous**. One uses gravity and mass; the other uses electricity and crystal vibration. Different physical principles.
  *   **Ship of Theseus:** This is about **Continuity**. For artifacts, identity is preserved through the *history* of the object, not just its parts.
  *   **Lab Cell vs. Natural Cell:** **Homologous**. Even though one is grown in a vat, it is built of the same biological machinery (organelles, proteins) operating on the same biological principles.

  **The Rule:** Two things are the "same mechanism" if they share the same **causal nature** (biology or physics), not just the same output. Biological things are defined by their biological nature; artifacts are defined by their structural continuity.

  ### 3. The Prediction: NOT the Same Mechanism

  **Verdict:** She will say the Artificial Heart is **NOT** the same mechanism as a real heart.

  **Why?**
  Even though the artificial heart mimics the *cycle* (chambers filling, valves opening), it lacks the **causal nature** of a heart.
  *   A real heart pumps via **muscular contraction** and **electrochemical signaling**.
  *   The artificial heart pumps via **motors, pneumatics, or hydraulics** (titanium/plastic).

  To her, an artificial heart is to a real heart what an **airplane wing is to a bird wing**. It is an *analogy*, not a *homology*. It achieves the same result through a fundamentally different causal power. The fact that it is made of titanium rather than muscle places it in the category of "Artifact mimicking Nature," which she has already rejected in the Bird/Plane case.

  ### 4. The Test Case: How to settle it

  You want a question that forces her to choose between "Causal Structure" (how it works) and "Biological Essence" (what it is). The Artificial Heart case is muddy because it mixes both.

  Ask her this:

  > **"If we replaced a single neuron in a human brain with a silicon chip that fired electrical signals in the exact same pattern as the neuron, would the brain still contain the same mechanism?"**

  **Why this settles it:**
  *   **If she says YES:** She prioritizes **Causal Structure**. If a silicon chip can be the "same mechanism" as a neuron, then the Artificial Heart (which mimics the heart's structure) should also be the same mechanism. This would contradict her likely verdict on the heart.
  *   **If she says NO:** She prioritizes **Biological Essence**. This confirms that for natural kinds (hearts, brains, cells), the material *must* be biological to count as the same mechanism. This confirms the Artificial Heart is **not** the same.

  **Bonus Follow-up:**
  If she hesitates, ask: *"Is that different from the Ship of Theseus? Why can we replace all the wood on a ship but not even one neuron in a brain?"*

  This forces her to explain the boundary between **Artifacts** (where continuity matters) and **Natural Kinds** (where biological essence matters). That is almost certainly the philosophical distinction she is trying to teach you.
