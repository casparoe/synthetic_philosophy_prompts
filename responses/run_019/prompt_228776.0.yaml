answer: |-
  I understand your frustration because Query 5 is arguably the most cited and least scrutinized line in the Querist, and it functions as a Rorschach test for whatever monetary theory the reader brings to it. To make sense of why your reading group is talking past one another, you need to separate the grammatical structure from the economic content and then grade the economic content on a scale from tautology to substantive causal claim. The first thing to acknowledge is that while the query is phrased interrogatively, the convention of the Querist is that these are rhetorical questions expecting an affirmative answer, so we can treat it as an assertion for the sake of economic analysis. The weakest possible reading, which aligns with the colleague who called it anodyne, is that Berkeley is merely defining money as a medium of exchange. On this view, the phrase enabling men mutually to participate the fruits of each other's labour is simply a description of trade facilitated by a common denominator, and stirreth up industry is just a flourish meaning that trade encourages specialization. This reading is trivially true and consistent with almost any monetary theory from Aristotle to Milton Friedman, because nobody denies that money facilitates exchange better than barter. However, this reading cannot support the heavy lifting your group members are attempting, because if money is just a veil for exchange, it offers no argument against the quantity theory of money, nor does it suggest that spending creates output rather than just facilitating the swap of existing output.

  A slightly stronger reading moves from the static function of exchange to the dynamic function of circulation, which is where the anti-mercantilist weight lies. Here, the emphasis falls on the words only so far useful, implying that money has no intrinsic utility and that hoarding it destroys its usefulness. This is a substantive and defensible claim in the context of 1735 Ireland, where bullionism was still influential. If this is all Berkeley means, he is arguing against the mercantilist identification of wealth with stock, positing instead that wealth is the flow of goods accessed via the flow of money. This supports the idea that policy should aim at circulation rather than accumulation, but it still does not necessarily refute the quantity theory. A quantity theorist can agree that velocity matters and that hoarding is bad without conceding that an increase in the money supply will permanently increase real output rather than prices. Therefore, if your colleague is using this query to wave away quantity-theoretic reasoning entirely, this intermediate reading is insufficient because it is compatible with the equation of exchange where velocity is variable but long-run neutrality still holds.

  The reading that actually supports the proto-Keynesian claim and the dismissal of quantity theory is the strongest and most contentious interpretation, where stirreth up industry is read as a causal mechanism rather than a facilitative condition. On this view, Berkeley is claiming that the presence or circulation of money actively calls forth labor and production that would otherwise remain idle, implying a short-run non-neutrality of money where increases in the money supply lead to increases in real output rather than just prices. This is economically substantive and contestable because it depends on the assumption of underemployed resources, which was certainly true in depopulated and underdeveloped eighteenth-century Ireland but is not a universal law. If Berkeley is making this causal claim, then he is indeed anticipating a Keynesian demand-side logic where spending drives employment, and he is complicating the quantity theory by suggesting that the denominator in the price equation includes variable output driven by monetary stimuli. However, this reading risks anachronism if it implies Berkeley had a full macroeconomic model of aggregate demand, and it is textually precarious because Berkeley often focuses on the moral hazard of luxury and the importance of frugality alongside circulation, which muddies the water on whether he thinks unlimited spending is the solution.

  You also asked whether the second half of the sentence does separate work, and on the strongest reading, it does. The clause enabling men mutually to participate the fruits of each other's labour describes the distributional outcome of the industry stirred up by the first clause. If the first clause is the engine (monetary stimulus creates work), the second clause is the transmission mechanism (wages allow workers to buy goods). This distinguishes Berkeley from a simple mercantilist who might think industry is stirred up for the sake of export surplus; here the end goal is mutual participation, or domestic consumption. This reinforces the Keynesian reading because it emphasizes domestic demand over external bullion accumulation, but it also reinforces the trivial reading if one assumes participation just means exchange. The ambiguity lies in whether participate implies a net increase in the fruits available or just a redistribution of existing fruits, and Berkeley does not explicitly resolve this in Query 5 alone.

  Regarding your specific suspicion that only the strongest readings support the uses your group is putting the query to, you are almost certainly correct. The colleague who claims Berkeley refuted the quantity theory framework needs the strong causal reading where money determines output levels significantly enough to dampen price effects, but Berkeley does not establish the limits of this effect or distinguish between short-run and long-run neutrality in this single query. The colleague claiming Berkeley is a proto-Keynesian needs the strong reading where idle resources are activated by spending, which is plausible given Berkeley's Irish context but requires corroborating evidence from elsewhere in the Querist about underemployment rather than just this line. The colleague calling it a platitude is safe from error but misses the rhetorical force Berkeley intended against the bullionists. The problem is that Query 5 is a normative and functional definition of money's utility rather than a positive theory of price determination, so using it to refute a positive theory like the quantity theory is a category mistake unless one assumes Berkeley believes the utility function completely overrides the quantity mechanism.

  Ultimately, the query is best understood as a claim about the velocity of money and the opportunity cost of hoarding rather than a full denial of monetary neutrality or a complete theory of employment. It establishes that money is a public good of sorts that requires circulation to function, which is a powerful policy recommendation for Ireland, but it does not logically entail that printing money will always increase wealth without inflationary consequence. If you want to push back in your group, the most productive angle is to concede that Berkeley identifies the transmission mechanism of monetary stimulus correctly for a depressed economy but to insist that Query 5 does not contain the necessary constraints to refute the quantity theory in a fully employed economy or to serve as a standalone macroeconomic model. This validates the insight that money matters for real activity without accepting the sloganized version that quantity theory is irrelevant, allowing you to acknowledge Berkeley's sophistication without granting him anachronistic omniscience.
