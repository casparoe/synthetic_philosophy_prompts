  3.  **Evaluate the Aristotle Reading (Commitment 1):**
      *   *Standard Interpretation:* The "Traditional" or "Standard" interpretation holds that Aristotle denies Bivalence for FCs.
      *   *Alternative Interpretation:* The "Ockhamist" or "Boethian" reading suggests Aristotle keeps Bivalence but denies *Necessity*. (i.e., It is true there will be a battle, but not *necessarily* true).
