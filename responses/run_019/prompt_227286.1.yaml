answer: |-
  It is good to hear from you, and I must say the image of you and your old labmates debating methodology over beers is one I cherish. There is something deeply fitting about a condensed matter physicist spending forty years wrestling with the behavior of solids only to retire and start wrestling with the solidity of arguments themselves. Your chemist friend's invocation of the spherical cow is the standard retort, the defensive reflex of the practicing scientist who feels the philosopher breathing down their neck, but your intuition that there is something fishy about equating the frictionless plane with the rational economic agent is not just a hunch. It is a sophisticated philosophical insight that cuts to the heart of what models do versus what they say they do. You have hit upon a distinction that much of the literature glosses over, and while it is tempting to dismiss it as a matter of degree, I believe it holds enough water to sink Friedman's ship, or at least spring a significant leak in it.

  Let us start by granting your chemist friend his due, because Friedman's argument in that 1953 essay is seductive for a reason. He was pushing back against a kind of naive descriptivism that demanded every assumption be a literal truth before a theory could be entertained. In physics, we certainly do not demand that. When you calculated band structures, you did not worry about the surface atoms of the crystal unless you were specifically studying surface states. You assumed an infinite lattice because it made the math tractable and because you knew, via physical intuition and later via renormalization group techniques, that the bulk properties were insensitive to the boundary conditions. This is what you call an idle idealization. It is a simplification that prunes away noise to reveal the signal. If you added the boundary conditions back in, the band gap might shift slightly, but the insulator would not suddenly become a conductor. The phenomenon survives the relaxation of the assumption. Friedman is absolutely correct that for this class of idealizations, predictive success licenses the falsehood. We do not care if the gas molecule is truly a point mass; we care that the ideal gas law tells us how the pressure will change when we heat the container.

  But your wrinkle concerns the other kind, the load-bearing idealization, and this is where the physics analogy starts to fray when applied to economics. A load-bearing idealization is one where the mechanism of the model relies essentially on the falsehood. If you relax the assumption, the phenomenon does not drift; it vanishes. In economics, the classic example is perfect information or perfect rationality used to derive market equilibrium. If you introduce realistic bounded rationality or asymmetric information into many standard models, the equilibrium often dissolves or becomes indeterminate. The prediction of stability exists only because the agents are assumed to be something they are not. Now, you asked if this distinction collapses under pressure, if everything is load-bearing once you look closely enough. It is true that idealizations exist on a spectrum. There are cases where neglecting air resistance changes the landing spot by a meter, and cases where it changes it by a kilometer. But there is a qualitative difference between a perturbative error and a constitutive one. In physics, when we use mean-field theory, we know it is load-bearing in the sense that it ignores fluctuations that are crucial near critical points. But here is the key difference: we know when it fails. We have a theory of errors. We know that near the critical temperature, the mean-field exponents are wrong, and we have the renormalization group to tell us why. We have a bridge back to reality.

  The problem with Friedman's defense in the load-bearing case is that it conflates predictive success with explanatory validity. He argues that if the theory predicts well, we should act as if the assumptions are true. But if the assumption is load-bearing, the prediction is often fragile. It works only so long as the background conditions remain stable enough that the false mechanism mimics the real one. This is the Lucas Critique in macroeconomics, though you do not need to be an economist to see the physics parallel. If you have a model that predicts the strength of a material based on a false assumption about atomic bonding, it might work for tensile stress but fail catastrophically under shear stress because the false assumption captured the symmetry of one force but not the other. Predictive success in a limited domain does not license indifference to the assumptions if those assumptions are doing the heavy lifting. It licenses indifference only to the literal truth of the assumptions for the specific purpose of that specific prediction. It does not license the belief that the model captures the causal structure of the world.

  This brings us to the explanatory side of science, and here is where Nancy Cartwright's complaints become vital. You mentioned her view on the laws of physics, and it applies squarely here. Cartwright argues that fundamental laws often hold only in highly idealized, ceteris paribus conditions that rarely obtain in the messy world. She suggests that what we really have are capacities or tendencies, not universal laws. If an economic model relies on a load-bearing idealization, it is not merely describing a capacity; it is often fabricating one. If the equilibrium exists only because agents are perfectly rational, and agents are not perfectly rational, then the equilibrium is not a tendency of the market waiting to be uncovered; it is an artifact of the mathematics. When Friedman says we should not care if the assumptions are realistic, he is severing the link between prediction and understanding. We want predictions, yes, but we also want to know how to intervene. If you want to change the outcome of a physical system, you need to know which levers are real. If your model says a lever exists because of a load-bearing falsehood, pulling it in the real world will do nothing.

  So, does the distinction collapse? I do not think so. It maps onto the difference between approximations and abstractions that generate artifacts. An idle idealization is an approximation; it simplifies the geometry of the problem but respects the causal topology. A load-bearing idealization often alters the causal topology. It creates pathways for influence that do not exist in reality. In physics, we are usually aware of this. When we treat electrons as non-interacting in a Fermi gas, we know we are ignoring interactions, but we have perturbation theory to add them back in. We know the idealization is a starting point, not the whole story. In economics, too often, the idealization is the whole story. The verdict I reach, then, is that Friedman's instrumentalism is safe only for idle idealizations. For load-bearing ones, predictive success is a necessary but not sufficient condition for scientific validity. If a model predicts well using load-bearing falsehoods, it is likely fitting parameters to noise or relying on stable background conditions that mask the false mechanism. It is a black box that works until it doesn't.

  Your suspicion is well-founded because indifference to false assumptions in the load-bearing case is dangerous. It leads to what we might call ontological complacency. If we accept that agents behave as if they are rational because the model predicts prices, we stop looking for the actual psychological or sociological mechanisms that determine prices. We mistake the map for the territory. In physics, we never made that mistake with the infinite lattice. We knew the crystal was finite. We knew the phonons were quasiparticles, not real particles. We maintained a realist stance about the underlying ontology even while using instrumentalist tools for calculation. Friedman's error was to suggest that the instrumentalist success justifies abandoning the realist quest for the load-bearing structures. It does not. It justifies using the tool, but it does not justify believing the tool describes the machinery.

  Ultimately, the distinction you have drawn saves us from a kind of scientific pragmatism that devolves into magic. If everything is just a tool that works, then we cannot distinguish between a model that works because it captures a truth and a model that works because of a compensating error. The idle versus load-bearing distinction allows us to categorize our ignorance. With idle idealizations, we know what we are ignoring and why it doesn't matter. With load-bearing ones, we are often guessing. Your chemist friend is right that we use spherical cows, but he is wrong to imply that we don't care that they are cows. We care deeply. We care because we want to know when the cow will tip over. Friedman's essay is a defense of using models, which is fine, but it is often read as a defense of ignoring their limitations, which is not. You have articulated the difference between a simplification that aids computation and a fiction that generates the result. The former is the bread and butter of physics; the latter is the sin of bad economics. So keep digging down that rabbit hole. Your labmates may laugh, but you are asking the question that separates the engineers from the alchemists, and after forty years of condensed matter, you have earned the right to demand to know which is which.
