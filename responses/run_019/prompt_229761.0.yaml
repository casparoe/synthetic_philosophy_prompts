  Your five commitments are logically consistent, but the concession to partitioned minds in (3) creates theoretical friction with the deflationary accounts in (1) and (2) that risks fragmenting your definition of self-deception.

  Pairs (1) and (5), as well as (2) and (5), only look as though they are in tension. You might worry that describing self-deception as a bias-driven process (1) while denying intentional deceit (2) undermines moral responsibility (5), but this is an apparent tension only. Your view employs a standard tracing strategy: responsibility attaches to the prior cultivation of vices rather than the moment of belief formation. This judgment relies on the assumption that epistemic vices are voluntarily cultivated; I would change my mind if you presented evidence that the relevant biases are hardwired and immune to voluntary control, which would sever the link required for responsibility in (5).

  The genuine tensions arise from integrating the split-brain exception in (3) with your unified-agent assumptions elsewhere. I rank them by severity as follows:

  **1. Commitments (1) and (2) versus (3) [High Severity]**
  Commitments (1) and (2) argue that self-deception is best explained as non-literal motivated belief because literal self-deception is incoherent for a single system. Commitment (3) concedes that literal deception between subsystems is possible in split-brain cases. The tension is theoretical: if literal self-deception is possible in partitioned minds, the claim in (2) that it is "incoherent" becomes contingent on mental unity rather than conceptual necessity, weakening your deflationary stance. To resolve this, you must clarify whether "self-deception" names a single natural kind or functions as an umbrella term for two distinct mechanisms. The cheapest revision is to explicitly restrict (1) and (2) to "unified agents," but this costs theoretical elegance by suggesting ordinary and pathological self-deception are fundamentally different phenomena. My judgment that this is the highest severity tension assumes that a unified theory is preferable; I would change my mind if empirical evidence suggested that ordinary cognition is as modular and partitioned as split-brain cases, which would make (3) the rule rather than the exception.

  **2. Commitment (4) versus (3) [Moderate Severity]**
  Commitment (4) states that in ordinary cases, the person does not simultaneously believe $p$ and not-$p$, while (3) implies that subsystems in split-brain patients can hold conflicting informational states. The tension is ontological: if subsystems are parts of "the person," then (3) implies the person does hold conflicting states, contradicting (4). To resolve this, you must define "the person" in (4) strictly as the unified conscious agent, excluding sub-personal systems. The cheapest revision is to add a qualifier to (4) such as "In ordinary cases involving a unified consciousness...", but this costs explanatory power by requiring a robust metaphysical account of personal unity to distinguish ordinary from split-brain cases. My judgment that this tension is manageable relies on the standard view that split-brain patients exhibit two streams of consciousness; I would change my mind if research demonstrated that ordinary agents routinely maintain simultaneous, contradictory first-order beliefs at the personal level, such as through robust implicit-explicit belief dissociation.
