  Here is an analysis of your convenor's decision rule, a prediction for the new case, and a proposal for a test case to settle the matter.

  ### 1. Analysing the Existing Verdicts

  Your convenor's four calls are remarkably consistent, provided we interpret them through a specific lens of contractualist reasoning. They do not appear to be in tension; rather, they map neatly onto a **Strongest Individual Complaint** model with a **Numbers Tie-Break**.

  Let us break down the logic she appears to be applying:

  *   **Case 1 (Power Station):** *Bad Burns (1) vs. Mild Spoilage (10m).*
      *   **Verdict:** Save the 1.
      *   **Logic:** The individual complaint of "I will be badly burned" is strictly stronger than "My evening is mildly spoiled". The sheer number of viewers does not aggregate to outweigh the severity of the technician's harm.
  *   **Case 2 (Lifeboat):** *Death (1) vs. Death (5).*
      *   **Verdict:** Save the 5.
      *   **Logic:** The individual complaint on both sides is identical ("I will die"). Since the strength of the complaint is equal, the numbers act as a tie-breaker. Saving the greater number respects the equal weight of each complaint without dismissing any individual's claim.
  *   **Case 3 (Drug):** *Death (A) vs. Death + Blindness (B).*
      *   **Verdict:** Save B.
      *   **Logic:** *Note: The phrasing of this case is slightly ambiguous, but for her verdict to cohere with the others, we must assume B's individual complaint is stronger.* If B faces a fate worse than A (perhaps a more painful death, or the blindness is an imminent prelude to death), then B has the stronger complaint. She prioritises the individual with the gravest personal stake.
  *   **Case 4 (Tram: Life vs. Arms):** *Death (1) vs. Loss of Arm (20).*
      *   **Verdict:** Sacrifice the 20 arms (Kill the 1).
      *   **Logic:** The complaint "I will die" is categorically stronger than "I will lose an arm". Even though there are twenty arms, the harms are not identical (unlike Case 2). Therefore, aggregation is not permitted. The single life outweighs the twenty limbs.

  **The Deduced Rule:**
  An act is permissible if it minimises the strength of the *strongest individual complaint* against it. Numbers (aggregation) are only permitted to break a tie when the individual complaints are of *identical* kind and severity. If the harms differ in kind or severity, the single strongest complaint trumps any number of weaker complaints.

  ### 2. Candidate Rules for the New Case

  You have identified two competing hypotheses. Let us formalise them:

  *   **Rule A: Strict Pairwise Comparison.**
      *   Compare the strongest complaint on Side X against the strongest complaint on Side Y.
      *   Aggregation is *never* allowed to outweigh a stronger complaint.
      *   Numbers only matter if the complaints are exactly equal (a tie).
  *   **Rule B: Threshold Aggregation.**
      *   Compare the strongest complaints.
      *   If the harms are "close enough" in kind or severity (within the same moral neighbourhood), numbers *do* count.
      *   If the harms are categorically different (e.g., Life vs. Arm), numbers do not count.

