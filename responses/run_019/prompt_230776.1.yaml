  3.  **Estimate Component Probabilities:**

      *   **Component 1: Feasibility of Low-Cost Inflation.**
          *   *Question:* Probability that students/teachers find low-cost, hard-to-verify ways to inflate logs without outright fabrication triggering review.
          *   *Analysis:* The app relies on self-reported start/stop timers and title entry. There is no verification mechanism described (like quizzes, page checks, etc.). Running a timer while doing homework or watching TV is trivial. Logging a book skimmed is hard to verify without testing.
          *   *Estimate:* Very high. The system is inherently vulnerable.
          *   *Value:* 0.95

      *   **Component 2: Incentive Strength.**
          *   *Question:* Probability that incentives (funding loss/stipends) motivate widespread inflation, not just a few.
          *   *Analysis:* School funding loss is a strong collective pressure. Teachers getting stipends creates direct personal incentive. Principals facing evaluation pressure will likely encourage "compliance." High school juniors know how to game systems. The pressure cascades down.
          *   *Estimate:* High. Financial and reputational stakes usually drive behavior in organizations.
          *   *Value:* 0.85

      *   **Component 3: Oversight Failure.**
          *   *Question:* Probability that oversight/audits/norms fail to detect/correct inflation within 2 years.
          *   *Analysis:* Districts often lack resources for deep audits of individual student logs. Professional norms might discourage "snitching" on colleagues or students. Two years is enough time for norms to shift ("everyone does it").
          *   *Estimate:* Moderate-High. Oversight is usually lagging and superficial in ed-tech contexts.
          *   *Value:* 0.80

      *   **Component 4: Dominance of Gaming over Real Gain.**
          *   *Question:* Probability that if inflation occurs, it accounts for >= 50% of the *increase* (not total minutes).
