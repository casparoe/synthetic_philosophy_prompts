      *   Component 3 (Oversight) is also uncertain.
      *   Let's pick Component 4. It's the hardest to verify empirically beforehand.

  6.  **Most Decisive Evidence:**
      *   Data from other districts using similar apps with incentives. If a nearby district did this and saw huge spikes with no comprehension gain, credence goes up. If they did it and reading scores improved proportionally, credence goes down.

  7.  **Safeguard Evaluation:**
      *   **Safeguard:** Two metrics (logged minutes + unannounced comprehension checks).
      *   **Probability:** Does this keep gaming share below 50%?
      *   **Analysis:** Comprehension checks are harder to game but introduce new pressures (teaching to the test, anxiety). However, linking minutes to comprehension makes inflating minutes risky if comprehension doesn't match. It reduces the *profitability* of gaming minutes.
      *   **Estimate:** 0.65. It helps, but teachers might coach specifically for the checks, or checks might be infrequent enough to still allow gaming in between. It reduces gaming but might not keep it below 50% of the *increase* if the target is aggressive.
      *   **Reasoning:** Adding a verification layer raises the cost of gaming, but unless the comprehension checks are frequent and high-stakes themselves, students may still inflate minutes hoping checks are rare or manageable.

