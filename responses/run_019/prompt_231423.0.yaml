answer: |-
  # Quiz: How Do You Settle a Disputed Question?

  **Instructions:** Below are eight scenarios involving claims about health, behavior, and the physical world. For each, select the response that best matches what you would *actually do*, not what you think you ought to do. There are no right answers; the goal is to map your habitual method for fixing belief.

  **1. The Dietary Reversal**
  You have followed a specific dietary guideline (e.g., low-fat, low-carb) for a decade because it aligned with major health recommendations. A new, large meta-analysis in a top journal suggests the guideline has no measurable effect on long-term health.
  *   A. I set the study aside. I know how I feel when I eat this way, and one paper doesn't change my routine.
  *   B. I wait to see if the major health organizations update their official guidelines before I change anything.
  *   C. I read the analysis to understand the sample size and methods, then adjust my habits proportionally to the new evidence.
  *   D. I reject the study. If the logic of nutrition is sound, this result must be an outlier or error.

  **2. The Shifting Consensus**
  A scientific consensus on a topic you care about (e.g., climate sensitivity, virus transmission) shifts significantly within a decade. How do you regard the earlier consensus?
  *   A. It was knowledge at the time; we updated our maps as our tools improved.
  *   B. It was never true knowledge. If it changes, the earlier experts were negligent or misled.
  *   C. It doesn't matter what the past was; I follow the current position of the leading professional bodies.
  *   D. I suspect the shift is driven by funding or politics rather than data.

  **3. The Intuitive Impossibility**
  A well-conducted study reports a result in behavioral science that feels "obviously wrong" to you based on your own reflection and reasoning.
  *   A. I assume the study has a hidden flaw. Reality must conform to basic reason.
  *   B. I accept the result tentatively but look for independent replication before believing it.
  *   C. I check what the leading figures in the field say about the finding.
  *   D. I disregard it. My own experience of human nature is more reliable than a survey.

  **4. The Failed Replication**
  A famous, long-standing psychological finding you have cited in arguments fails to replicate in a large, pre-registered trial.
  *   A. The original finding is likely still valid in specific contexts; the concept remains useful.
  *   B. The finding is dead. We must update our understanding of the field immediately.
  *   C. I will continue to use the finding until the professional association issues a retraction or correction.
  *   D. This proves the field is broken; I no longer trust these kinds of studies.

  **5. The Personal Exception**
  A medical board recommends against a supplement you have taken for years. However, you personally feel significantly worse when you stop taking it.
  *   A. I stop immediately. They have data I don't.
  *   B. I continue taking it. My body is a sample size of one, and I trust its signal.
  *   C. I bring the board's data to my doctor to discuss risk mitigation while monitoring my symptoms.
  *   D. I assume the board's recommendation is based on population averages that don't apply to my specific constitution.

  **6. The Charismatic Outlier**
  A well-credentialed researcher argues against the field's consensus on a technical point. Their math looks sound, but 95% of their peers reject the conclusion.
  *   A. I side with the consensus. Science is a collective enterprise, not a solo act.
  *   B. I evaluate the argument on its internal logic and elegance, regardless of the headcount.
  *   C. I examine the raw data they provide to see if it withstands scrutiny.
  *   D. I ignore the outlier. Disruption is usually a sign of crankery, not genius.

  **7. The Meaning of "Settled"**
  When scientists describe a fact as "settled," what do you understand that to mean?
  *   A. The evidence is so overwhelming that it would be irrational to bet against it, though it is technically falsifiable.
  *   B. The debate is over. To question it is to deny reality.
  *   C. It means the relevant authority has issued a final ruling on the matter.
  *   D. It means the majority of researchers have agreed to stop investigating it.

  **8. The Contrary Friend**
  A friend sends you a link contradicting a belief you hold. The source looks credible, but the conclusion upends your view.
  *   A. I read it openly, acknowledging I might need to change my mind.
  *   B. I check if the source is approved by the institutions I trust.
  *   C. I skim it to find the flaw so I can maintain my current position.
  *   D. I weigh the argument against what seems reasonable to me, independent of the source.

  ***

  # Scoring Key & Methodology

  **Mapping Responses**
  Each option corresponds to a specific epistemic commitment. Note that "Science" is split into two categories: *Fallibilist* (open to revision) and *Infallibilist* (treats current findings as dogma).

  *   **Q1:** A=Tenacity, B=Authority, C=Science-Fallibilist, D=A Priori
  *   **Q2:** A=Science-Fallibilist, B=Science-Infallibilist, C=Authority, D=Tenacity
  *   **Q3:** A=A Priori, B=Science-Fallibilist, C=Authority, D=Tenacity
  *   **Q4:** A=Science-Infallibilist (protects the 'truth' of the concept), B=Science-Fallibilist, C=Authority, D=Tenacity
  *   **Q5:** A=Authority, B=Tenacity, C=Science-Fallibilist, D=A Priori (reasoning from constitution)
  *   **Q6:** A=Authority, B=A Priori, C=Science-Fallibilist, D=Tenacity
  *   **Q7:** A=Science-Fallibilist, B=Science-Infallibilist, C=Authority, D=Tenacity
  *   **Q8:** A=Science-Fallibilist, B=Authority, C=Tenacity, D=A Priori

  **Scoring Rule**
  Tally the number of times you selected each category.
  1.  **Primary Sort:** The category with the highest score is your dominant method.
  2.  **Tie-Breaker (Authority vs. Science-Infallibilist):** These two often cluster. If tied, look to **Question 2** and **Question 7**. If you chose the "update" or "overwhelming evidence" options (A), lean **Science-Fallibilist**. If you chose the "negligent experts" or "debate is over" options (B), lean **Science-Infallibilist**. If you chose "follow the body" (C), lean **Authority**.
  3.  **Tie-Breaker (Tenacity vs. A Priori):** Both rely on internal states. If tied, look to **Question 3**. If you rejected the study because it violated *logic/reason*, you are **A Priori**. If you rejected it because of *personal experience/feeling*, you are **Tenacity**.

  **Why This Rule?**
  Simple summation assumes these methods exist on a single scale (e.g., "bad" to "good" thinking). They do not. They are distinct vectors. A person can be highly rigorous (A Priori) but empirically unmoored. The tie-breaker rules prioritize *behavioral commitment to revision* (the core of Peirce's distinction) over general attitudes. This prevents the "Mixed" outcome by forcing a resolution based on the most diagnostic questions regarding the *status of truth*.

  ***

  # Commentary on Instrument Design

  **Unoccupied Combinations**
  The scoring key leaves certain theoretical combinations empty because they are behaviorally incoherent.
  *   *Tenacity + Science-Fallibilist:* One cannot genuinely invite evidence that might prove one wrong (Fallibilism) while simultaneously shielding a belief from contrary exposure (Tenacity). If a respondent scores high on both, they are likely misinterpreting the questions or engaging in self-deception.
  *   *Authority + A Priori:* These are functionally opposite regarding the source of truth (external institution vs. internal reason). A tie here usually indicates a respondent who defers to authority *until* the authority violates their sense of reason, at which point they defect. The quiz forces a choice based on the *initial* impulse.

  **Hard-to-Separate Pairs**
  *   *Authority vs. Science-Infallibilist:* This is the instrument's weakest distinction. Both defer to external findings. The difference is that Authority defers to the *institution* (the CDC, the University), while the Infallibilist defers to the *current finding* as if it were a law of physics. In modern practice, these look identical until the institution changes its mind. The quiz uses Question 2 (Consensus Shift) to pry them apart: the Authority follower trusts the *new* ruling; the Infallibilist views the *change* itself as a failure of the previous science.
  *   *Tenacity vs. A Priori:* Both reject empirical data in favor of an internal state. Tenacity is affective ("I feel this is true"); A Priori is rationalist ("This *must* be true"). Question 3 attempts to separate them, but in a short quiz, they may blur. A longer test would require scenarios where reason and feeling contradict each other.

  **Peirce's Taxonomy vs. Modern Consensus**
  Peirce wrote in the 19th century, before "scientific consensus" became a distinct epistemic object. For Peirce, the "Method of Authority" was state or church dogma, and the "Method of Science" was individual investigation of nature. Today, individual scientists (and laypeople) cannot verify all data; we *must* defer to consensus. This creates a hybrid: the **Science-Infallibilist**. This user adopts the idiom of science ("the data says") but treats the consensus with the rigidity of Peirce's "Authority." The quiz reports this as a distinct leaf rather than forcing it into "Authority" because the user's self-conception is scientific, not institutional. To force them apart would be dishonest; the hybrid is a real, stable epistemic stance in the 21st century.

  ***

  # What Your Result Means

  **Tenacity:** You fix belief by protecting your current understanding from disturbance. This offers great psychological stability and allows you to act decisively without being paralyzed by new data. However, it risks isolating you from information that could improve your outcomes.

  **Authority:** You fix belief by deferring to established institutions or communities. This is efficient and socially cohesive, allowing you to benefit from collective expertise without mastering every detail. The risk lies in institutional lag; if the authority shifts slowly, your beliefs may update too late.

  **A Priori:** You fix belief by what seems reasonable, elegant, or logically consistent. This allows you to spot errors that data might miss and maintain intellectual independence. However, the world is not always reasonable; nature often violates human intuition.

  **Science-Infallibilist:** You fix belief by adopting current scientific findings as fixed truths. You value precision and evidence, but you treat the current consensus as the final word. This gives you a robust framework for navigating the world, though it may leave you frustrated when science inevitably corrects itself.

  **Science-Fallibilist:** You fix belief by following evidence while acknowledging that any conclusion could be revised. You treat knowledge as a probability rather than a possession. This offers the highest accuracy over time, but it requires tolerating uncertainty and resisting the comfort of absolute answers.
