answer: |-
  This is a sophisticated starting point. You have correctly identified that the 'Great Divergence' debate is currently stalled not by a lack of data, but by a disagreement over how to frame the problem. Many popular accounts rush to answer 'why' before agreeing on 'what' or 'when'.

  To construct a defensible agenda for your year of thinking, we must arrange your inquiries logically. Some questions are **upstream**: if you answer them one way, certain downstream questions become irrelevant or must be radically reformulated. For instance, if the divergence did not occur until 1800, explanations relying on medieval property rights (1200) are logically suspect. If the comparison between 'Britain' and 'China' is methodologically flawed, searching for a causal factor is futile.

  Here is a prioritised agenda of five open questions, ordered by logical dependency, with a defence of the sequencing.

  ### 1. The Validity of the Contrastive Frame
  **Question:** *Is 'Why Britain and not China?' a teleological trap, and if so, how should the question be reformulated?*

  **Position in Agenda:** Upstream (Foundational).
  **Defence of Ordering:** This is the most upstream question because it determines whether the rest of your inquiry is valid. Traditional historiography often treats industrialisation as the 'goal' of economic history. This implies China 'failed' to reach a destination it was never aiming for. If you accept this framing, you will inevitably look for what China *lacked* (rights, science, culture). If you reject it, you must look for the specific, contingent conjuncture that allowed Britain to access a new energy regime.
  **What to look for:** Arguments regarding 'Eurocentrism' (e.g., the California School). Does framing the issue as a 'divergence' implicitly normalise the European path?
  **Findings that would reprioritise:** If you conclude the question is irredeemably biased, you must stop looking for 'causes of divergence' and start studying 'global economic polycentrism'. This would move Question 4 (Causality) down significantly, as 'cause' implies a single outcome rather than multiple paths.

  ### 2. The Timing and Magnitude of the Gap
  **Question:** *When did living standards and productive capacity actually diverge, and how wide was the gap?*

  **Position in Agenda:** Upstream (Empirical Hinge).
  **Defence of Ordering:** You cannot select a cause until you know when the effect occurred. This is the critical empirical hinge of the entire debate.
  *   **The Early Divergence View:** Argues Europe pulled ahead in wages and productivity by 1600 or earlier. If true, causes must be internal and long-term (institutions, culture, rule of law).
  *   **The Late Divergence View:** Argues core regions (e.g., Yangtze Delta vs. South-East England) were comparable until c. 1750–1800. If true, causes must be external or contingent (coal, colonies, global trade).
  **What to look for:** Quantitative historical data (real wages, GDP per capita, height/nutrition data). Compare the work of Stephen Broadberry (early divergence) against Kenneth Pomeranz (late divergence).
  **Findings that would reprioritise:** If convincing new data proves the Yangtze Delta was significantly poorer than England in 1700, the 'Late Divergence' theories (coal/colonies) lose their explanatory power. You would then need to move upstream to investigate institutional differences (Question 4) much earlier in your schedule.

  ### 3. The Unit of Analysis
  **Question:** *Is it methodologically sound to compare a nation-state (Britain) with a continental empire (China)?*

  **Position in Agenda:** Midstream (Methodological).
  **Defence of Ordering:** Once you know *when* the divergence happened, you must define *what* is being compared. Comparing the UK to the Qing Empire is comparing apples to oranges. The UK was a small, highly commercialised island; the Qing Empire was a vast continent with high internal transport costs. A more rigorous comparison is South-East England vs. the Yangtze Delta.
  **What to look for:** Discussions on 'regional' vs. 'national' accounts. Does aggregating data for all of China mask prosperous regions that were actually comparable to Europe?
  **Findings that would reprioritise:** If you conclude that only specific regions are comparable, you must discard 'national culture' or 'national institutions' as primary causes. This would demote 'Culture' (see Overrated Factors below) significantly.

  ### 4. The Locus of Causality: Internal vs. Global
  **Question:** *Was the breakthrough driven by internal European innovations or by the global extraction of resources?*

  **Position in Agenda:** Downstream (Causal).
  **Defence of Ordering:** Only after settling the timing (Q2) and the units (Q3) can you weigh specific causes. If the divergence is late (c. 1800), the 'Ghost Acreage' hypothesis (that colonies provided the land and resources to bypass ecological constraints) becomes a primary candidate. If the divergence is early, internal institutions take precedence.
  **What to look for:** The role of the Atlantic economy, slavery, and cotton vs. the role of domestic technological innovation and patent laws.
  **Findings that would reprioritise:** If evidence suggests the Atlantic economy contributed less to British capital formation than previously thought, you must move back to internal explanations (energy prices, labour costs).

  ### 5. The Role of Contingency vs. Structural Necessity
  **Question:** *Was industrialisation an inevitable outcome of specific conditions, or a low-probability accident?*

  **Position in Agenda:** Downstream (Synthesis).
  **Defence of Ordering:** This is the philosophical synthesis of the previous four. If the divergence was late, regional, and dependent on global resources, it suggests high contingency (it could have happened elsewhere, or not at all). If it was early, national, and institutional, it suggests structural necessity (Europe was 'destined' to win).
  **What to look for:** Counterfactual history. Would the Industrial Revolution have happened without American silver or Welsh coal?
  **Findings that would reprioritise:** If you become convinced that contingency is paramount, the search for 'laws of economic growth' becomes less valuable than the study of specific historical conjunctures.

  ---

  ### Overrated Factors to Set Aside Early

  To save time, you should treat the following with scepticism until the upstream questions are settled. They are often used as 'magic bullets' that bypass the hard methodological work.

  1.  **Culture and Religion (The 'Weberian' Hangover):** Explanations relying on the 'Protestant Ethic', 'Confucian stagnation', or 'European rationality' are difficult to measure and often suffer from selection bias (assuming the winner had the better culture). Set this aside until you have ruled out material factors (coal, trade).
  2.  **Pure Science:** The link between the Scientific Revolution (Newton) and the Industrial Revolution (Watt) is tenuous in the early phase. Many early industrial innovations were tinkering by practical men, not applications of high theory. Do not prioritise the history of science over the history of technology and energy.
  3.  **Monocausal Geography:** While coal was crucial, 'geographical determinism' often ignores why China (which had coal) did not exploit it in the same way. Geography sets the stage, but it does not write the script.

  ### Triggers for Reprioritisation

  Your agenda is a hypothesis about how to learn. You should be prepared to shuffle the order if you encounter specific evidence:

  *   **Move Question 2 (Timing) to #1:** If you find the meta-debate (Question 1) too abstract, anchor yourself immediately in the data. Sometimes the numbers force a philosophical conclusion more effectively than argumentation.
  *   **Move Question 4 (Global Causality) Up:** If you read accounts of the Atlantic slave trade and global cotton networks that demonstrate their sheer scale, you may find you cannot understand British growth without understanding global extraction. This would make the 'Internal vs. Global' question the primary lens.
  *   **Demote Question 5 (Contingency):** If you find the evidence for structural divergence (institutions, property rights) overwhelming, the question of 'contingency' becomes less urgent.

  ### Summary of the Strategy

  Your intuition is correct: the meta-dispute is not a distraction; it is the key. Most popular literature begins at Question 4 (Causes) without answering Questions 1, 2, or 3.

  By prioritising the **Validity of the Frame** and the **Timing of the Gap**, you protect yourself from reading explanations that solve a problem that does not exist. If the divergence is late and regional, you save yourself months of reading about medieval English common law. If the question is teleological, you save yourself from accepting 'failure' as a historical category.

  Spend the first third of your year on Questions 1 and 2. Do not proceed to specific causes until you have decided *when* the race started and *who* was actually running it.
