prompt: |-
  I have no academic training, but over the past year I have been reading popular books about the "Great Divergence" — the question of why industrialisation took off in north-western Europe, and Britain in particular, rather than in China or India, which looked at least as prosperous a few centuries earlier. I keep running into a meta-dispute that interests me more than any particular answer: some writers treat "why Britain and not China?" as a perfectly good explanatory question, while others argue it is badly posed — that it smuggles in the assumption that Europe was destined to industrialise and that China somehow "failed", or that it invites a futile hunt for a single decisive factor (coal, colonies, institutions, culture) when the outcome may have been contingent. I have decided to spend the next year thinking this through properly, but I cannot read everything. Which open questions in this debate should I prioritise, and in what order? Please defend the ordering: I want to know which questions are upstream of which (for instance, whether one must first settle when Europe actually pulled ahead before asking why, or whether the contrastive question itself needs reformulating before any causal inquiry can begin), which alleged causes are overrated enough to be set aside early, and what findings would move a question up or down the list. My aim is a defended agenda for my own thinking, not a survey of the literature. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested reading agenda:

  1.  **Analyze the User and Request:**
      *   **User Profile:** No academic training, but well-read in popular history/economics regarding the "Great Divergence." Intelligent, critical thinker interested in historiography and methodology (the "meta-dispute") rather than just facts.
      *   **Topic:** The Great Divergence (why Industrial Revolution in NW Europe/Britain vs. China/India).
      *   **Core Interest:** The *framing* of the question itself (Is "Why Britain and not China?" valid? Is it teleological? Is it searching for a monocausal explanation?).
      *   **Task:** Create a prioritized agenda of open questions for a year of thinking.
      *   **Requirements:**
          *   Defend the ordering (upstream/downstream logic).
          *   Identify overrated causes to set aside early.
          *   Specify findings that would reprioritize questions.
          *   British English spelling and phrasing.
          *   Not a literature survey, but a *defended agenda*.

  2.  **Deconstruct the Meta-Dispute:**
      *   *Side A (Traditional/Neo-Malthusian/Institutionalist):* The divergence is real, deep, and requires explanation (e.g., Jones, North, Mokyr). Europe had unique traits.
      *   *Side B (California School/Revisionist):* The divergence is late, contingent, and the question is Eurocentric (e.g., Pomeranz, Wong, Goldstone). China was comparable until c. 1750.
      *   *Side C (Contingency/Globalist):* It's about global conjunctures, not internal traits (e.g., Beckert, Riello).
      *   *The "Meta" Issue:* Is the question teleological? Does it assume a race where Europe won and China lost?

  3.  **Determine the Logical Flow (Upstream vs. Downstream):**
      *   *Upstream:* Definitional and methodological. Before asking *why*, we must ask *what*, *when*, and *if*.
      *   *Midstream:* Structural conditions (resources, geography, global context).
      *   *Downstream:* Specific causal mechanisms (culture, institutions, policy).
      *   *Reasoning:* If the divergence didn't happen until 1800, explanations relying on medieval property rights (1200) are suspect. If the question is teleological, the whole inquiry might need reframing from "failure" to "contingency."

  4.  **Drafting the Agenda - Step-by-Step:**

      *   **Phase 1: The Framing (The "If" and "When").**
          *   *Question:* When did the divergence actually occur? Was it a "Great Divergence" or a "Great Convergence" followed by a spike?
          *   *Why First?* Because timing dictates causality. If it's 1800, look at coal/colonies. If it's 1500, look at culture/institutions.
          *   *Key Debate:* Pomeranz (late divergence) vs. Broadberry/Van Zanden (early divergence).
          *   *Overrated to set aside:* Long-term cultural determinism (Weberian stuff) *until* timing is settled.

      *   **Phase 2: The Unit of Analysis (The "Where").**
          *   *Question:* Are we comparing nations, regions, or empires? Britain vs. China is apples vs. oranges. Britain vs. Yangtze Delta is better.
          *   *Why Second?* Once we know *when*, we need to know *what units* are actually comparable.
          *   *Key Debate:* National accounts vs. regional welfare.

      *   **Phase 3: The Nature of the Gap (The "What").**
          *   *Question:* Was it income per capita, life expectancy, energy capture, or technological capacity?
          *   *Why Third?* "Prosperity" is multidimensional. China might have been richer in calories but poorer in mechanical innovation.
          *   *Key Debate:* Welfare ratios vs. GDP estimates.

      *   **Phase 4: Causality and Contingency (The "How").**
          *   *Question:* Was the outcome structural (inevitable given conditions) or contingent (luck, geography, global conjuncture)?
          *   *Why Fourth?* Only after defining the gap can we weigh causes.
          *   *Key Debate:* Institutions (North) vs. Ghost Acreage (Pomeranz) vs. Global Cotton (Beckert).
          *   *Overrated:* "Science" as a direct cause (need to distinguish scientific revolution from industrial application).

      *   **Phase 5: The Normative/Meta Question (The "So What").**
          *   *Question:* Does framing this as a "failure" of China distort the history?
          *   *Why Last?* This is the philosophical synthesis of the empirical findings.

  5.  **Refining the Ordering and Defences:**
      *   *Critique:* Is Phase 5 really last? Actually, the user is *most* interested in the meta-dispute. I should integrate the meta-critique into Phase 1. The validity of the question *is* the first question.
      *   *Revision:* Let's make Question 1 about the validity of the contrastive framing itself.
      *   *Revised Order:*
          1.  Validity of the Contrast (Is the question teleological?)
          2.  Timing and Magnitude (When and how big?)
          3.  Unit of Comparison (Nation vs. Region)
          4.  Structural vs. Contingent Causes (Coal/Colonies vs. Institutions)
          5.  The Role of the Global Economy (Extraction vs. Innovation)

  6.  **Addressing "Overrated Causes":**
      *   *Culture/Protestant Ethic:* Too hard to measure, often post-hoc.
      *   *Science:* The link between Newton and the steam engine is tenuous in the early phase.
      *   *Pure Geography:* Deterministic but ignores human agency.

  7.  **Addressing "Findings that Move Questions":**
      *   If new data shows Chinese wages were much lower earlier -> Move Timing up.
      *   If evidence shows global trade was negligible -> Move Global Economy down.

  8.  **Tone and Language:**
      *   British English (industrialisation, labour, programme, defence, prioritise).
      *   Respectful but rigorous. Acknowledge the user's non-academic status but treat them as an intellectual equal.
      *   Focus on *thinking strategy* rather than book titles (though some references help anchor the points).

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "upstream/downstream"? Yes, the ordering defence must explicitly state this.
      *   *Check:* Did I avoid a literature survey? Yes, focus on *questions*, not just authors.
      *   *Check:* Is the meta-dispute central? Yes, Question 1 addresses the framing directly.

  10. **Final Polish:** Ensure the distinction between "early divergence" (Broadberry) and "late divergence" (Pomeranz) is clear as it's the pivotal empirical hinge. Ensure the distinction between "internalist" and "globalist" explanations is clear.

  *(Self-Correction on British English)*: Make sure to use "s" instead of "z" in words like "industrialisation", "prioritise", "analyse". Use "labour" not "labor".

  *(Final Plan Structure)*:
  *   Introduction: Acknowledge the sophistication of the query.
  *   The Logical Map: Explain the upstream/downstream concept.
  *   The Agenda (5 Questions):
      1.  The Validity of the Counterfactual (Meta).
      2.  The Timing (Empirical hinge).
      3.  The Unit of Analysis (Methodological).
      4.  The Locus of Causality (Internal vs. External).
      5.  The Role of Contingency (Philosophical synthesis).
  *   Overrated Factors.
  *   Triggers for Reprioritisation.
  *   Conclusion.

