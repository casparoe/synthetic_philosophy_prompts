          *   *Analysis:* Similar to #4 but weaker. Consistency for consistency's sake isn't always rational. However, internal credibility matters. It's borderline between #4 and #6.
          *   *Verdict:* Moderate. Internal reputation matters, but less than external (#3) or skill (#5).

