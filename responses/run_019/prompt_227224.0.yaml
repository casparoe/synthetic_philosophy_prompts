answer: |-
  The principle that captures your verdicts is **Normative Interdependence**.

  Here is the theory: **Joint action occurs when participants regulate their behavior not just in response to one another (causal responsiveness), but in obedience to a shared standard that creates mutual obligations (normative responsiveness).**

  The "rebuke" you identified in the walking case is not just a symptom; it is the diagnostic test. If I can legitimately hold you accountable for how you perform your part, we are acting together. If I can only be surprised or annoyed by what you do, we are merely acting in parallel.

  Here is how this principle organizes your cases, solves the Jazz/Riot problem, and predicts the outcome for the couple.

  ### 1. How the Principle Fits Your Verdicts

  *   **Strangers Pushing Car:** **Fail.** There is causal coordination (the car moves), but no normative interdependence. If one stops, the other is surprised, but cannot say, "You violated our agreement." There is no shared standard binding them.
  *   **Walking Together:** **Pass.** You explicitly noted the rebuke. By walking *together*, you implicitly adopt a shared standard (maintain proximity/pace). Deviation is a breach of obligation, not just a physical separation.
  *   **Committee:** **Pass.** This distinguishes *Intention* from *Motive*. The members share a procedural standard (the voting rules) and a collective goal (passing a resolution). They are normatively bound to accept the outcome of the vote, even if their private motives (self-interest) differ. The obligation is to the *procedure*, not the *motivation*.
  *   **Flash Mob:** **Pass (with a caveat).** The "viral post" functions as the explicit shared plan/standard. Even without talking at the event, participants are normatively bound to the choreography. If you dance off-beat, you are failing *us*, not just yourself. The prior commitment to the post substitutes for ongoing communication.

  ### 2. Solving the Jazz Duo vs. The Riot

  This is the crux of your problem. Both involve high mutual responsiveness and no explicit verbal agreement. Why is one joint and the other not?

  **The Distinction: Constitutive vs. Aggregative Goals.**

  *   **The Jazz Duo (Constitutive):** The goal (making coherent music) is *constituted* by the coordination itself. I cannot play "in tune" or "in time" alone; those qualities only exist in the relation between us. Therefore, I am **normatively bound** to listen and adjust to you. If I ignore you and play out of key, I have violated a shared standard of musical coherence. I owe it to you to fit my notes to yours.
  *   **The Riot (Aggregative):** The goal (destruction/catharsis) is *aggregative*. I can smash a window alone. Your smashing makes me feel bolder (causal stimulation), but I do not owe you a smashed window. There is no shared standard of "correct smashing" that we are mutually accountable to. If I stop smashing, you might be disappointed, but you cannot legitimately rebuke me for failing *our* project, because there is no *our* project—only a crowd of *my* projects happening to align.

  **Why this doesn't overturn your verdicts:**
  It preserves the Jazz verdict because musicians implicitly accept the normative standards of the genre and the ensemble. It preserves the Riot verdict because, as you noted, "nobody aims at anything shared." The egging-on is emotional contagion, not normative commitment.

  ### 3. Prediction: The Long-Term Couple

  **The Case:** A couple whose habits and finances have slowly converged over decades into a shared way of life that neither ever explicitly chose.

  **The Prediction:** **It depends entirely on the presence of the "Rebuke."**

  Normative Interdependence suggests that explicit choice is not required (as seen in the Jazz duo). Habits can harden into norms. However, mere similarity is not joint action (like the strangers pushing the car).

  *   **Scenario A (Parallel Lives):** If one partner suddenly changes a habit (e.g., starts spending money differently) and the other says, "Oh, that's inconvenient for me," but acknowledges the partner had every right to do it, they are **not** acting jointly. They are two individuals with aligned trajectories.
  *   **Scenario B (Joint Agency):** If one partner changes the habit and the other says, "Wait, that's not how *we* do things," or feels a sense of betrayal rather than just inconvenience, then they **are** acting jointly.

  **Verdict:** Given your description ("shared way of life"), it is highly likely this counts as **Joint Action**.

  Over decades, implicit norms solidify. The "shared way of life" becomes the **Shared Standard**. Even without an initial explicit agreement, the longevity of the convergence creates a legitimate expectation of continuity. If one deviates, the other has standing to feel that a "we" has been violated.

  **The Theory's Nuance:**
  This theory predicts that the couple is in a fragile state compared to the Committee or the Flash Mob. Because the commitment was never explicit, the *scope* of the obligation is fuzzy. In a Committee, the rules are written. In a Jazz duo, the song structure is known. In the Couple, the "rules" are unspoken.

  Therefore, they are a **Joint Agent by Habit**, but they are at high risk of "Normative Drift." If one partner decides the implicit norm no longer binds them, the other's rebuke ("But we always do it this way!") carries less weight than it would in a marriage with explicit vows. They are acting together, but the "together" is held together by inertia rather than active commitment.

  ### Summary of the Principle

  **Joint Action = Mutual Responsiveness + Shared Standard + Mutual Accountability.**

  *   **Responsiveness** rules out the Strangers.
  *   **Shared Standard** rules out the Riot (no standard of "joint smashing").
  *   **Accountability (The Rebuke)** rules out mere coincidence and confirms the Walking, Jazz, and Committee cases.

  You don't need to overturn any of your verdicts. You just need to recognize that the "glue" in joint action isn't communication or even shared goals per se—it's the **mutual obligation to uphold a shared standard.**
