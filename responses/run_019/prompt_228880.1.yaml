  # Taxonomy of Positions on Qualia Coherence

  **Root Datum:** Adult humans can ordinarily report changes in what their experiences are like (e.g., the taste of coffee).

  *   **Branch 1: The Chase-and-Sanborn Diagnostic**
      *   *Question:* When a subject reports a change in "how it tastes," can independent testing dissociate sensory discrimination (e.g., sorting blends) from hedonic reaction (e.g., preferring one over the other)?
      *   *Commitments:*
          *   **Yes:** Accepts that phenomenological reports can diverge from behavioral capacities, suggesting experience might be more than just discrimination.
          *   **No:** Accepts that experience is inextricably linked to behavioral disposition; a change in "feel" must track a change in function or preference.
      *   **If Yes → Go to Branch 2.**
      *   **If No → Go to Branch 5.**

  *   **Branch 2: The Non-Functional Property Test**
      *   *Question:* If discrimination remains fixed but the subject insists the "intrinsic quality" changed (Inverted Spectrum case), is there a fact of the matter beyond the functional state?
      *   *Commitments:*
          *   **Yes:** Commits to the existence of properties that are not defined by their causal roles (Realism).
          *   **No:** Commits to the view that the subject is misdescribing a functional shift or that no such fact exists (Deflationism).
      *   **If Yes → Go to Branch 3.**
      *   **If No → Go to Branch 5.**

  *   **Branch 3: The Ontological Status of the Extra Property**
      *   *Question:* Is this non-functional property ontologically distinct from physical brain states, or is it a higher-order physical state?
      *   *Commitments:*
          *   **Distinct:** Commits to Property Dualism; mental properties are not physical properties.
          *   **Higher-Order Physical:** Commits to Non-Reductive Physicalism; mental properties are physical but not reducible to microphysics.
      *   **If Distinct → Go to Branch 4.**
      *   **If Higher-Order Physical → Leaf: Non-Reductive Physicalism.**

  *   **Branch 4: The Fundamentality Fork**
      *   *Question:* If the property is distinct from standard physical states, is it a fundamental feature of all matter or specific to complex systems?
      *   *Commitments:*
          *   **Fundamental:** Commits to Panpsychism; experience is a basic constituent of reality.
          *   **Specific:** Commits to Property Dualism; experience emerges only in specific substances.
      *   **If Fundamental → Leaf: Panpsychism.**
      *   **If Specific → Leaf: Property Dualism.**

  *   **Branch 5: The Content vs. Role Fork**
      *   *Question:* For subjects where experience tracks function (Branch 1 No / Branch 2 No), is the experience defined by what the state *represents* about the world or what it *does* within the system?
      *   *Commitments:*
          *   **Represents:** Commits to Representationalism; qualia are identical to representational content.
          *   **Does:** Commits to Functionalism; qualia are identical to causal roles.
      *   **If Represents → Leaf: Representationalism.**
      *   **If Does → Go to Branch 6.**

  *   **Branch 6: The Substrate Independence Test**
      *   *Question:* Consider an artificial system behaviorally indistinguishable from the human taster. If experience is a causal role, does the AI have the same experience?
      *   *Commitments:*
          *   **Yes:** Commits to Substrate Independence; physical makeup is irrelevant to experience.
          *   **No:** Commits to Substrate Dependence; biological machinery is necessary for experience.
      *   **If Yes → Leaf: Functionalism.**
      *   **If No → Leaf: Biological Naturalism.**

  *   **Branch 7: The Introspective Authority Test**
      *   *Question:* If an archived memory log conflicts with a present introspective report, and independent evidence shows one record is corrupted, is the introspective report incorrigible?
      *   *Commitments:*
          *   **Yes:** Commits to First-Person Authority; introspection cannot be overruled by third-person data.
          *   **No:** Commits to Fallibilism; introspection is a cognitive process subject to error.
      *   **If Yes → Go to Branch 8.**
      *   **If No → Go to Branch 9.**

  *   **Branch 8: The Decidability Fork**
      *   *Question:* If introspection is incorrigible but conflicts with physical data, is the truth of the matter empirically decidable in principle?
      *   *Commitments:*
          *   **Decidable (but currently unknown):** Commits to Epistemic Humility; the answer exists but is beyond current reach.
          *   **Undecidable:** Commits to Quietism; the question itself lacks a determinate truth value.
      *   **If Decidable → Leaf: Epistemic Humility.**
      *   **If Undecidable → Leaf: Quietism.**

  *   **Branch 9: The Error Ontology Fork**
      *   *Question:* If introspection is fallible and reports "intrinsic qualities" that do not exist, is the *seeming* of the quality a real mental state?
      *   *Commitments:*
          *   **Real Seeming:** Commits to Illusionism; the experience is real, but its intrinsic nature is illusory.
          *   **No Real Seeming:** Commits to Eliminativism; the concept of "seeming" is itself a theoretical error.
      *   **If Real Seeming → Leaf: Illusionism.**
      *   **If No Real Seeming → Go to Branch 10.**

  *   **Branch 10: The Pragmatic Utility Fork**
      *   *Question:* If the concept of qualia is a theoretical fiction, is it a useful fiction to retain or one to discard?
      *   *Commitments:*
          *   **Retain:** Commits to Pragmatic Instrumentalism; qualia-talk is valid for prediction/social coordination.
          *   **Discard:** Commits to Hard Eliminativism; qualia-talk should be purged from scientific ontology.
      *   **If Retain → Leaf: Pragmatic Instrumentalism.**
      *   **If Discard → Leaf: Eliminativism.**

  ---

  ### Leaf Positions

  1.  **Non-Reductive Physicalism**
      *   *Formulation:* Qualia are real, higher-order physical properties that cannot be reduced to microphysical descriptions.
      *   *Awkward Consequence:* It posits "brute" psychophysical laws that connect physical states to experience without explaining *why* they connect.
  2.  **Panpsychism**
      *   *Formulation:* Qualia are fundamental features of matter, present even in elementary particles.
      *   *Awkward Consequence:* It implies that thermostats or electrons have some form of primitive experience, which strains credulity.
  3.  **Property Dualism**
      *   *Formulation:* Qualia are non-physical properties that emerge from complex physical systems.
      *   *Awkward Consequence:* It violates the causal closure of the physical world, suggesting mental events can cause physical actions without physical energy.
  4.  **Representationalism**
      *   *Formulation:* Qualia are nothing over and above the representational content of perceptual states.
      *   *Awkward Consequence:* It struggles to explain non-representational sensations (e.g., free-floating anxiety or afterimages) that lack external objects.
  5.  **Functionalism**
      *   *Formulation:* Qualia are defined entirely by their causal roles within a cognitive system.
      *   *Awkward Consequence:* It implies that a perfectly simulated mind (e.g., in software) feels pain exactly as a biological human does.
  6.  **Biological Naturalism**
      *   *Formulation:* Qualia are biological features caused by brain processes but not replicable by non-biological systems.
      *   *Awkward Consequence:* It risks "carbon chauvinism," arbitrarily denying experience to functionally identical non-biological systems.
  7.  **Epistemic Humility**
      *   *Formulation:* Qualia exist, but the relationship between experience and physical data is currently unknowable.
      *   *Awkward Consequence:* It renders the philosophy of mind scientifically stagnant by placing the core datum beyond investigation.
  8.  **Quietism**
      *   *Formulation:* The debate over qualia rests on linguistic confusion rather than factual disagreement.
      *   *Awkward Consequence:* It dismisses the intense subjective reality of pain or joy as merely a "confusion," which feels dismissive to the sufferer.
  9.  **Illusionism**
      *   *Formulation:* We really have experiences, but they do not have the intrinsic, ineffable properties we think they do.
      *   *Awkward Consequence:* It requires explaining how a system can be wrong about its own current state without positing a "real" state to be wrong about.
  10. **Pragmatic Instrumentalism**
      *   *Formulation:* Qualia do not exist ontologically, but talking as if they do is socially and predictively useful.
      *   *Awkward Consequence:* It forces a double-speak where scientists deny qualia in the lab but acknowledge them in the courtroom.
  11. **Eliminativism**
      *   *Formulation:* "Qualia" is a folk-psychological term that refers to nothing real, like "phlogiston."
      *   *Awkward Consequence:* It denies the existence of the very data (conscious experience) that motivated the inquiry in the first place.

  *(Note: To meet the 8-12 leaf constraint, "Eliminativism" is split across Branch 9 and 10 outcomes, but functionally represents the same hard line. For the purpose of this taxonomy, **Leaf 11** is **Eliminativism** (from Branch 9 "No Real Seeming" if one skips pragmatics) and **Leaf 12** is **Pragmatic Instrumentalism**.)*
  *Correction for Count:* I will count **Leaf 11** as **Eliminativism** (from Branch 9 "No Real Seeming" → Discard) and **Leaf 12** as **Pragmatic Instrumentalism** (from Branch 9 "No Real Seeming" → Retain). Wait, Branch 9 leads to Branch 10.
