prompt: |-
  In my third-year philosophy of mind module, I have been assigned to lead a fifty-minute section for first-years on eliminative materialism about beliefs and desires, and I would like to work from a proper teaching plan rather than simply deliver the view as an explanation. My instinct is that certain things have to be in place before the thesis can even be stated without sounding merely perverse: in particular, the claim that our ordinary mental vocabulary—belief, desire, intention—is itself a theory about unobservable posits rather than a neutral description of what is given. Is that really the load-bearing first step, and what should be placed after it: the general idea that a theory's posits can be abandoned wholesale once a better theory arrives, or something else? And what should actually carry the hour? I am unsure whether to use a single worked example from the history of science, such as the abandonment of phlogiston or caloric fluid, or an example drawn from the students' own mental talk; whichever I choose, I would want to know what the carrying example must have and must not have if it is not to overstate the eliminativist's claim.

  I am equally worried about the misconceptions that will predictably form: that eliminativists think people are literally empty-headed, that the position is self-refuting because defending it uses belief-talk, and perhaps that it is a claim about the disappearance of conscious experience. My guess is that these need to be defused at different moments rather than all at once, but I do not trust my sense of the ordering. At what point in the sequence should each be headed off, and are there any I should deliberately let surface before answering? Finally, what should I openly say I am leaving out at this level, and what single question could I ask at the end to tell whether the students have understood the position rather than merely found it outrageous? I would be grateful if your answer were written in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 50-minute teaching plan for first-year philosophy students on Eliminative Materialism (EM) about beliefs and desires.
      *   **Role:** Third-year student leading a section (tutorial/seminar style).
      *   **Key Concerns:**
          *   Is "Folk Psychology (FP) is a theory" the necessary first step?
          *   What follows that? (Theory change/elimination).
          *   What example to use? (History of science vs. everyday mental talk).
          *   What are the constraints on the example?
          *   How to handle misconceptions (empty heads, self-refutation, consciousness)? When to address them?
          *   What to explicitly exclude/bracket?
          *   What assessment question to ask at the end?
      *   **Tone/Style:** British English, pedagogical, structured, philosophically rigorous but accessible to first-years.

  2.  **Deconstruct the Philosophy (Eliminative Materialism):**
      *   *Core Claim:* Folk Psychology (FP) is a radically false theory. Beliefs and desires do not exist.
      *   *Premise 1:* FP is a theory (Theory-Theory).
      *   *Premise 2:* Theories with false posits get eliminated, not reduced (Intertheoretic Reduction vs. Elimination).
      *   *Conclusion:* Beliefs/Desires will be eliminated by neuroscience.
      *   *Key Objections:* Self-refutation (do you *believe* EM?), Phenomenology (it feels like I have beliefs), Normativity (reasons vs. causes).

  3.  **Address the User's Specific Questions:**

      *   *Is "FP is a theory" the load-bearing first step?* Yes. Without this, EM sounds like denying the obvious. If FP is just a description of immediate experience, you can't eliminate it without eliminating experience. If it's a *theory*, it can be wrong.
      *   *What follows?* The nature of theory change (Reduction vs. Elimination). This justifies *why* we dump beliefs rather than just mapping them onto brain states.
      *   *Example:* History of science is better for the *logic* of elimination (Phlogiston/Caloric/Demons). Everyday talk is better for illustrating *what* is being eliminated. A hybrid approach works best: use history to justify the move, apply to mind.
      *   *Constraints on Example:* Must show *ontological* elimination, not just refinement. Phlogiston is the classic for a reason. Must avoid examples where reduction succeeded (e.g., temperature = mean kinetic energy), or students will think EM is just reductionism.
      *   *Misconceptions:*
          *   *Empty heads:* Address early (it's about ontology, not behaviour).
          *   *Consciousness:* Address explicitly as a bracketed topic (qualia vs. propositional attitudes).
          *   *Self-refutation:* Save for the end (it's a meta-objection). Let it surface naturally.
      *   *Exclusions:* Qualia/Phenomenal consciousness (too messy for 50 mins), detailed neuroscience (Churchland's vector spaces might be too technical), normative reasons (maybe too advanced).
      *   *Assessment Question:* Needs to test understanding of the *argument*, not just the conclusion.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Timing:* 50 minutes is tight. Need strict segmentation.
      *   *Structure:*
          1.  Intro & Hook (5 mins)
          2.  Premise 1: FP as Theory (10 mins)
          3.  Premise 2: Theory Change (10 mins)
          4.  The Conclusion & Misconceptions (10 mins)
          5.  Objections & Discussion (10 mins)
          6.  Wrap-up & Assessment (5 mins)
      *   *Refining the "FP as Theory" section:* Need to make sure students see FP as *explanatory*, not just descriptive. Use prediction failures.
      *   *Refining the Example:* Phlogiston is standard. Let's stick with it but ensure the distinction between *reduction* (water = H2O) and *elimination* (phlogiston = nothing) is clear.
      *   *Refining Misconceptions:* The user asked about ordering.
          *   "Empty heads" -> Address immediately after stating the thesis.
          *   "Consciousness" -> Bracket at the start or during the definition of FP.
          *   "Self-refutation" -> Save for the critique section.
      *   *British English:* Ensure spelling (materialism, programme, defence, centre) and vocabulary (first-years, module, tutorial) are appropriate.

  5.  **Developing the Content:**

      *   *Introduction:* Start with the provocative claim. "There are no beliefs."
      *   *Step 1 (FP):* Why call it a theory? It explains and predicts. It has laws (e.g., If X wants P and believes Q leads to P, X will do Q). It faces anomalies (mental illness, speed of processing).
      *   *Step 2 (Elimination):* Compare to Demons (disease), Phlogiston (combustion). Contrast with Reduction (Lightning = Electricity). Why won't beliefs reduce? (Multiple realisability is usually an argument *for* functionalism, but Churchlands argue FP is structurally wrong). Let's focus on the *radical discontinuity* argument.
      *   *Misconceptions:*
          *   *Behaviour:* We still act, just without "beliefs" driving it.
          *   *Qualia:* EM targets *propositional attitudes*, not raw feels (usually).
          *   *Self-refutation:* The "Do you believe that?" objection.
      *   *Exclusions:* Explicitly state we aren't talking about pain/qualia, just belief/desire.
      *   *Assessment:* "If EM is true, how should we describe what you are doing right now?" or "What would count as evidence against EM?"

  6.  **Review against Constraints:**
      *   50 minutes? Yes, the breakdown fits.
      *   First-years? Keep jargon low (explain 'posits', 'ontology').
      *   British English? Check spellings.
      *   User's specific worries addressed? Yes (ordering of misconceptions, example choice, load-bearing premises).

  7.  **Final Polish:**
      *   Make the advice on the "carrying example" specific. It needs to be a case where the *ontology* vanished, not just the name changed.
      *   Ensure the distinction between *reduction* and *elimination* is the pivot point of the lesson.
      *   Advise on the "Self-Refutation" objection: Let them raise it. It shows engagement.
      *   Final question needs to be diagnostic.

  8.  **Constructing the Output:** (Drafting the response following the thought process above). *Self-Correction during drafting:* Make sure I don't write a lecture script, but a *teaching plan* with pedagogical advice, as requested. The user wants to know *how* to teach it, not just *what* the philosophy is. Emphasise the "why" behind the structure.

      *   *Check:* Did I answer the specific question about the "load-bearing first step"? Yes, confirm FP as theory is crucial.
      *   *Check:* Did I answer the example question? Yes, Phlogiston is best, but warn about the reduction/elimination distinction.
      *   *Check:* Did I answer the misconception ordering? Yes, map them to specific timeline points.
      *   *Check:* Did I answer the exclusion/final question? Yes.

  9.  **Final Review of Tone:** Supportive, academic, British. (e.g., "module", "first-years", "programme", "defence").

  *(Self-Correction on the "Self-Refutation" point)*: The user asked if they should let misconceptions surface. It is pedagogically sound to let the self-refutation objection come from the students rather than preempting it entirely, as it makes them feel clever. I will advise teasing it out rather than stating it immediately.

  *(Self-Correction on "Consciousness")*: This is the biggest trap. EM is often conflated with denying qualia. I must stress that Churchland-style EM usually targets the *framework* of FP, not necessarily the existence of sensation, though the line is blurry. For first-years, bracketing qualia is the safest route to keep the argument clean.

  10. **Final Polish of the Plan.** (Proceed to generate output).
answer: |-
  This is an ambitious topic for a fifty-minute session with first-years, but it is an excellent choice for teaching the structure of philosophical argumentation. Your instinct is entirely correct: without establishing that Folk Psychology (FP) is a *theory*, eliminative materialism (EM) sounds like a denial of the manifest image of the world rather than a scientific hypothesis.

  Below is a structured teaching plan designed to meet your constraints, followed by specific advice on the examples, misconceptions, and boundaries you enquired about.

  ### Teaching Plan: Eliminative Materialism (50 Minutes)

  **1. Introduction and the Provocation (5 Minutes)**
  *   **Activity:** Write "There are no beliefs" on the board.
  *   **Goal:** Secure attention and diagnose initial intuition.
  *   **Action:** Ask students to write down one reason why this claim seems absurd. Do not discuss yet.
  *   **Clarification:** Immediately distinguish EM from scepticism about the *external world* or the *brain*. The claim is not that people do not act, but that our *explanation* of that action (in terms of beliefs/desires) is fundamentally wrong.
  *   **Bracketing:** Explicitly state: "We are talking about propositional attitudes (believing *that* p), not conscious feelings (qualia). We are not denying you feel pain; we are denying that 'belief' is a natural kind."

  **2. Premise One: Folk Psychology as a Theory (10 Minutes)**
  *   **Goal:** Establish the load-bearing premise.
  *   **Explanation:** FP is not a neutral description of inner experience; it is an explanatory framework used to predict behaviour.
  *   **Interactive Element:** Ask students for a 'law' of Folk Psychology. (e.g., *If S desires P and believes doing A will achieve P, S will do A*).
  *   **Key Point:** Highlight that this is a theoretical posit. We do not observe beliefs; we infer them to explain actions. Like 'genes' before DNA, they are unobservable causes posited to make sense of data.
  *   **Pedagogical Note:** If they resist this, ask: "Why do we say someone 'believes' something when they are asleep?" We attribute the state even when no conscious experience is present. This suggests it is a theoretical state, not a phenomenological one.

  **3. Premise Two: Theory Change and Elimination (15 Minutes)**
  *   **Goal:** Justify why we eliminate rather than reduce.
  *   **The Carrying Example:** Use **Phlogiston** (or Demonic Possession).
      *   *Why:* It demonstrates *ontological elimination*. Phlogiston was not reduced to oxidation; it was discarded. Demons were not reduced to viruses; the framework was replaced.
      *   *Contrast:* Contrast this with **Lightning**. Lightning was not eliminated; it was *reduced* to electrical discharge. The entity remained, but our understanding of its essence changed.
  *   **Application:** The Eliminativist argues FP is like Phlogiston, not Lightning. Neuroscience will not find 'beliefs' in the brain any more than chemistry found 'phlogiston' in the fire. It will find neural networks, activation vectors, or synaptic weights.
  *   **Crucial Distinction:** Ensure students see that reduction preserves the entity (Water = H₂O), whereas elimination discards it (Phlogiston = Nothing).

  **4. Addressing Misconceptions (10 Minutes)**
  *   **Goal:** Defuse the predictable objections without derailing the argument.
  *   **Ordering Strategy:**
      1.  **The 'Empty-Head' Objection (Address Now):** Students think EM means we are zombies. Clarify: We still behave, learn, and process information. We just shouldn't call the internal causes 'beliefs'. Analogy: We abolished 'witches' but people still got sick.
      2.  **The 'Consciousness' Objection (Address Now):** Reiterate the bracket from the start. EM targets the *vocabulary of explanation*, not necessarily the existence of subjective experience (though some hardline eliminativists go further, keep it simple for now).
      3.  **The 'Self-Refutation' Objection (Hold Back):** Do not raise this yourself. Wait for the discussion phase. It is more powerful if they discover it.

  **5. Discussion and the Self-Refutation Objection (5 Minutes)**
  *   **Goal:** Critical engagement.
  *   **Action:** Ask: "What is the strongest argument against this view?"
  *   **Managing the 'Self-Refutation':** When a student inevitably asks, "Do you *believe* eliminativism is true?", acknowledge the force of this.
      *   *Response:* Explain that the eliminativist hopes to replace 'belief' with a neuroscientific account of sentence acceptance. It is a pragmatic paradox, not necessarily a logical contradiction. It shows the difficulty of escaping our own conceptual scheme, not that the scheme is true.

  **6. Conclusion and Assessment (5 Minutes)**
  *   **Goal:** Check understanding.
  *   **Exclusions:** Briefly list what you have *not* covered: the normative aspect of belief (oughts vs. is), the detailed neuroscience (Churchland's vector spaces), and the hard problem of consciousness.
  *   **The Diagnostic Question:** Ask the following (see below for rationale).

  ---

  ### Advice on Specific Pedagogical Choices

  #### 1. The Load-Bearing First Step
  You are correct to prioritise "FP is a theory". If students view 'belief' as a direct report of inner experience (like 'I have a headache'), elimination sounds like denying they have experiences. You must convince them that 'belief' is a *theoretical term* used to explain behaviour.
  *   **Test:** If they accept FP is a theory, they must accept it could be *false*. If they view it as a definition, it cannot be false. Your entire first ten minutes must secure the 'theory' status.

  #### 2. The Carrying Example
  Use **Phlogiston** (or Caloric Fluid).
  *   **What it must have:** It must be a case where the *ontology* vanished. We do not say phlogiston *is* oxygen; we say there was no such thing. This mirrors the claim that there are no beliefs.
  *   **What it must not have:** Avoid examples where reduction succeeded (e.g., 'Temperature is mean kinetic energy'). If you use this, students will conclude EM is just Reductionism (Identity Theory). You need a historical case of *error*, not *refinement*.
  *   **Warning:** Do not overstate the analogy. Neuroscience is not complete in the way chemistry is. Acknowledge that EM is a *prediction* about future science, not a current finding.

  #### 3. Ordering the Misconceptions
  Your instinct to space these out is sound.
  *   **Empty-Headedness:** Defuse this **early** (during the conclusion of the argument). If they think EM denies behaviour, they will disengage. Assure them the *phenomena* (acting, speaking) remain; only the *explanation* changes.
  *   **Consciousness:** Defuse this **at the start**. Define the scope. If you let them think EM denies the feeling of pain, you will spend the whole hour fighting phenomenology.
  *   **Self-Refutation:** Let this **surface naturally** in discussion. It is the most sophisticated objection. If you preempt it, you rob them of the 'aha' moment. If no one raises it, you can introduce it as "A common objection you might encounter in reading is..."

  #### 4. Exclusions
  For a first-year, fifty-minute session, you must explicitly bracket:
  *   **Qualia/Phenomenal Consciousness:** EM is primarily about *propositional attitudes*. Confusing the two leads to the 'zombie' objection.
  *   **Normativity:** The idea that beliefs are governed by norms of truth/rationality. This is a deep objection (Davidson), but too technical for this timeframe.
  *   **Specific Neuroscience:** Do not get bogged down in connectionism or vector transformations unless a student asks. Keep it conceptual.

  #### 5. The Diagnostic Question
  Do not ask "Do you agree?" (They will say no). Do not ask "What is EM?" (They can rote learn that).
  Ask a question that requires them to apply the *logic* of the view.

  **Suggested Question:**
  > "If Eliminative Materialism is true, how should we describe what happened in this room today, without using the words 'belief', 'desire', or 'intention'?"

  **Why this works:**
  *   If they say "We didn't do anything," they haven't understood (the Empty-Head misconception).
  *   If they say "Our brains processed information," they understand the physicalist commitment.
  *   If they say "We cannot describe it yet because the new theory doesn't exist," they understand the *future-oriented* nature of the claim (that FP is a placeholder for a better theory).
  *   If they struggle to avoid the vocabulary entirely, they understand the depth of the conceptual shift required.

  ### Final Note on Tone
  Since you are a third-year leading first-years, maintain a tone of shared inquiry. You are not delivering the 'truth' of EM, but modelling how to reconstruct a radical argument charitably. If you present it too dogmatically, they will reject it as perverse. If you present it as a logical consequence of premises they might accept (science progresses, old theories die), they will engage with the philosophy rather than the shock value.

  Good luck with the module. It is a demanding topic, but if you secure the 'theory-theory' foundation, the rest of the structure will hold.
