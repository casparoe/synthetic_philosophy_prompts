answer: |-
  You have stumbled onto one of the most commonly misremembered sections of Turing's 1950 paper, *"Computing Machinery and Intelligence."*

  The short answer is: **Your understanding is incorrect, and the LessWrong-adjacent hints are right.** Turing does *not* hand-wave ESP away as unscientific nonsense. In fact, he does the opposite: he explicitly accepts the statistical evidence for ESP as convincing, at least for the sake of argument.

  Here is a breakdown of what Turing actually wrote, why he wrote it that way, and whether it holds up philosophically.

  ### 1. What Turing Actually Said
  In Section 7 ("The Argument from Extrasensory Perception"), Turing addresses the objection that if telepathy exists, a human interrogator could use it to distinguish a human from a machine (e.g., by reading the human contestant's mind).

  Turing's response is surprisingly open-minded. He writes:

  > *"The statistical evidence, at least for telepathy, is overwhelming."*

  He does not dismiss ESP as pseudoscience. He acknowledges that the experimental data available at the time (largely from J.B. Rhine's parapsychology experiments at Duke University) was statistically significant enough that a scientist could not simply ignore it.

  His solution to the problem is not to deny ESP, but to **control for it**. He suggests:

  1.  **Telepathy-Proofing:** We can place the human contestant in a "telepathy-proof room" (he suggests lead-lined walls, though he notes this is a physics problem, not a logic problem).
  2.  **The Machine Might Have ESP Too:** This is the more profound point. Turing speculates that if ESP is real, there is no reason a machine couldn't utilize it. He imagines a scenario where the machine uses psychokinesis to influence its own random number generator, or the interrogator uses telepathy to read the machine's state.

  He concludes the section by saying that if ESP is admitted, the test becomes more complicated, but it doesn't invalidate the concept of machine intelligence. He essentially argues: *If a machine can mimic ESP, then ESP isn't a uniquely human trait that defines intelligence.*

  ### 2. Why the Misconception Exists
  You are not alone in thinking he dismissed it. Most modern readers skim this section because, from a 21st-century perspective, ESP is considered debunked pseudoscience. We project our current scientific consensus back onto Turing.

  However, in 1950, parapsychology was a subject of legitimate, if controversial, scientific debate. Turing was an empiricist; if the data said "overwhelming statistical evidence," he felt compelled to treat it as a variable that needed controlling, rather than an impossibility to be mocked.

  ### 3. Does His Response Hold Up?
  This is where it gets interesting. Depending on how you look at it, this section is either the paper's biggest dated quirk or one of its strongest philosophical moments.

  **The "Weak Point" Argument:**
  *   **Dated Science:** Obviously, the premise is shaky by modern standards. Since we now generally regard ESP as non-existent, spending space on "telepathy-proof rooms" looks quaint.
  *   **Distraction:** Some critics argue it distracts from the core computational arguments.

  **The "Strong Point" Argument (The LessWrong View):**
  *   **Behavioral Consistency:** Turing's core thesis is that intelligence is defined by *output*, not internal mechanism. By admitting a machine might theoretically exhibit ESP, he reinforces this. If the machine produces the same "telepathic" output as the human, the machine passes the test. This strips ESP of any mystical "soul" status.
  *   **Intellectual Honesty:** Turing demonstrates a high degree of rationalist integrity. He doesn't move the goalposts to protect his hypothesis. He admits the evidence for ESP looks strong and adjusts his experimental design to account for it.
  *   **The "Black Box" Nature:** Turing recognizes that the Imitation Game is a black-box test. It doesn't matter *how* the answer is derived (neurons, silicon, or psychic waves); it matters that the answer is indistinguishable.

  ### 4. Why LessWrong Readers Highlight This
  The rationalist community (LessWrong, etc.) often highlights this section because it serves as a case study in **updating on evidence**.

  Turing is often viewed as a hard-nosed materialist. Finding him say "the evidence for telepathy is overwhelming" is shocking to modern materialists. Rationalists point this out to show that Turing was willing to follow the data wherever it led, even if it led to "spooky" conclusions, provided the statistics supported it. It underscores that his test was designed to be robust even against supernatural objections.

  ### Summary
  *   **Did he dismiss ESP?** No. He called the statistical evidence "overwhelming."
  *   **Did he try to protect the test?** Yes, but by suggesting experimental controls (telepathy-proofing) rather than denying the phenomenon.
  *   **Is it a weak point?** Scientifically, it looks dated today. Philosophically, it is actually quite strong because it reinforces that the Turing Test measures *behavior*, not the underlying substrate (biological or supernatural).

  You didn't just skim too fast; you read it through a modern lens. Turing read it through a 1950s lens, where ESP was a live scientific hypothesis that had to be accounted for.
