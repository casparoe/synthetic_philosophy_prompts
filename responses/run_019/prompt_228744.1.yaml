  Commitment (3) has to go. The most severe tension exists between (2) and (3): (2) claims the Deutsch–Wallace (DW) decision-theoretic program settles the Born-rule problem, implying it yields genuine probability, while (3) asserts that decision-theoretic constraints alone produce only "serviceable fictions" absent objective chance. Since the DW program derives credences precisely from decision-theoretic rationality within unitary mechanics without invoking primitive chance, (3) directly contradicts the success claim in (2), undermining the core solution to the Everettian probability problem. The second most severe tension is between (1) and (3): (1) posits a deterministic, unitary dynamics, whereas (3) demands objective chance for genuine probability; maintaining both implies that probability is impossible in your ontology, rendering (2) vacuous. The third genuine tension, though less severe, lies between (4) and (5): (4) relies on self-locating uncertainty regarding specific branches, while (5) admits branches are vaguely individuated; if branch identity is indeterminate, the object of self-locating uncertainty is ill-defined, though this is manageable by treating branches as emergent vague objects akin to ordinary macroscopic entities. The least costly revision is to modify (3) to accept a functionalist account of chance, wherein the rational credences derived in (2) constitute rather than merely track objective chance. This costs you a robust, non-reductive realism about chance (such as Lewis's), requiring you to view chance as defined by its role in rational decision-making rather than as a primitive metaphysical anchor. Revising (3) in this manner restores the most coherence, as it aligns your metaphysical constraints with the decision-theoretic solution you endorse, allowing (1), (2), (4), and (5) to stand as a consistent Everettian package.
