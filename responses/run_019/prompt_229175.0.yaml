  **Goal:** To isolate the specific assumption in standard Newcomb problems that drives CDT's two-boxing verdict.

  ---

  ## 1. The Scenario: "The Biometric Lock"

  **The Setup**
  You are invited to participate in a present-day experiment run by a behavioral economics lab. You stand before two boxes:
  *   **Box A:** Transparent. Contains **$1,000**.
  *   **Box B:** Opaque. Made of reinforced steel with a digital biometric lock.

  **The Predictor**
  Yesterday, an AI algorithm analyzed your digital footprint, social media history, and past purchasing behavior. Based on this data, it predicted whether you would attempt to take **Only Box B** (One-Box) or **Both Boxes** (Two-Box).
  *   If it predicted **One-Box**, it authorized a transfer of **$1,000,000** into Box B.
  *   If it predicted **Two-Box**, it left Box B **empty**.
  *   The AI is a "sharp human judge" equivalent: it is correct **90%** of the time.

  **The Twist (The Lock)**
  Box B is not opened by a key or a code. It is opened by a **physiological sensor**.
  *   To unlock Box B, you must place your hand on the sensor and maintain a "calm state" (low heart rate variability, steady galvanic skin response) for 5 seconds while the box audits your intent.
  *   **Crucial Mechanism:** The lab has established a causal fact known to you: **The decision to Two-Box causally induces a stress response.**
      *   Subjects who decide to reach for Box A experience a measurable spike in arousal/greed-anxiety *during* the decision process.
      *   This spike triggers the biometric lock to **permanently seal**, even if the $1,000,000 is physically inside.
      *   Subjects who decide to One-Box remain physiologically calm. The lock opens, granting access to the contents.

  **The Choice**
  You know all of this. You stand before the boxes. Do you take **Only Box B** or **Both Boxes**?

  ---

  ## 2. Decision Theoretic Analysis

  ### Causal Decision Theory (CDT)
  **Verdict:** **One-Box.**

  **Reasoning:**
  CDT evaluates actions based on their causal consequences. It calculates the expected utility of an action $A$ by summing the utility of outcomes in each state $S$, weighted by the probability of the state *given the action is performed* ($P(S | do(A))$).

  1.  **States:** The money is either in Box B ($M$) or not ($\neg M$). This was determined yesterday.
  2.  **Causal Leverage:** In standard Newcomb, your choice cannot causally affect whether $M$ is true. Here, your choice *can* causally affect whether you *access* $M$.
      *   $do(\text{One-Box}) \rightarrow \text{Calm} \rightarrow \text{Lock Opens} \rightarrow \text{You get contents of B}$.
      *   $do(\text{Two-Box}) \rightarrow \text{Stress} \rightarrow \text{Lock Seals} \rightarrow \text{You get \$0 from B}$.
  3.  **Calculation:**
      *   If you $do(\text{One-Box})$: You get Box B's contents. Since $P(M) = 0.9$, Expected Value $\approx \$900,000$.
      *   If you $do(\text{Two-Box})$: You get Box A ($1,000) + Box B's contents *only if the lock opens*. But $do(\text{Two-Box})$ causally ensures the lock stays shut. So you get $\$1,000 + \$0 = \$1,000$.
  4.  **Conclusion:** $\$900,000 > \$1,000$. CDT recommends One-Boxing.

  ### Evidential Decision Theory (EDT)
  **Verdict:** **One-Box.**

  **Reasoning:**
  EDT evaluates actions based on the news they bring. It weights outcomes by the conditional probability of the state given the action ($P(S | A)$).

  1.  **Evidence:** Choosing One-Box is strong evidence that you are the "calm type" the AI predicted (90% chance). Choosing Two-Box is strong evidence you are the "greedy type" the AI predicted against.
  2.  **Calculation:**
      *   $P(M | \text{One-Box}) \approx 0.9$. Payoff $\approx \$900,000$.
      *   $P(M | \text{Two-Box}) \approx 0.1$. Payoff $\approx \$1,000 + (0.1 \times \$1,000,000) = \$101,000$. (Note: Even if the lock didn't exist, EDT one-boxes here. With the lock, the Two-Box payoff drops to just $1,000).
  3.  **Conclusion:** EDT recommends One-Boxing.

  ### Do They Agree?
  **Yes, they agree on the action, but NOT for the same reasons.**
  *   **EDT** one-boxes because One-Boxing is *good news* about the past prediction (and potentially the lock).
  *   **CDT** one-boxes because One-Boxing is *causally effective* at opening the lock.
  *   *Note:* In standard Newcomb, CDT two-boxes because it sees no causal leverage. Here, CDT sees causal leverage over *access*, even if the money's presence is fixed.

  ---

  ## 3. The Pivot: Why the Standard Move Fails

  In standard Newcomb problems, the CDT proponent argues:
  > *"The money is already in the box or it isn't. Your choice cannot change the past. Therefore, Two-Boxing dominates: if the money is there, you get \$1,001,000 vs \$1,000,000. If it's empty, you get \$1,000 vs \$0. You're better off taking both either way."*

  **In the Biometric Lock case, this dominance argument breaks.**
  The premise "You get the money if it is there" is false. The correct premise is "You get the money if it is there **AND** the lock opens."

  Because your choice *causally influences* the lock, the dominance principle does not apply across the states of the box's content.
  *   **State: Money is Present.**
      *   One-Box $\to$ Lock Opens $\to$ **\$1,000,000**.
      *   Two-Box $\to$ Lock Seals $\to$ **\$1,000**.
      *   *(One-Box wins)*.
  *   **State: Money is Absent.**
      *   One-Box $\to$ Lock Opens $\to$ **\$0**.
      *   Two-Box $\to$ Lock Seals $\to$ **\$1,000**.
      *   *(Two-Box wins)*.

  Because One-Boxing wins in the high-probability state (Money Present) and the payoff difference in that state (\$999k) vastly outweighs the difference in the low-probability state (\$1k), CDT maximizes expected utility by One-Boxing. The "Take Both" strategy is no longer a dominant strategy because it causally sabotages the payout in the best-case scenario.

  ---

  ## 4. Stripping the Feature

  **What if we remove the Biometric Lock?**
  If Box B is a standard steel box with no sensor, and the money is physically accessible regardless of your stress levels:
  *   $do(\text{Two-Box})$ no longer causes the money to become inaccessible.
  *   The dominance argument is restored: If the money is there, you get more by taking both. If it's empty, you get more by taking both.
  *   **CDT reverts to Two-Boxing.**

  This confirms that the **causal link between Choice and Access** was the sole driver of the CDT verdict flip.

  ---

  ## 5. Honest Assessment: Is This Still Newcomb?

  **The Hard Truth:**
  Strictly speaking, **no**. This is not a pure Newcomb Problem. It is a **Newcomb Problem with a Causal Barrier.**

  In a canonical Newcomb Problem, the correlation between your choice and the box's content is purely *evidential* (or based on a common cause in the past). There is *no causal path* from your choice to the money. In the Biometric Lock case, we have introduced a forward-looking causal path from Choice $\to$ Physiology $\to$ Access $\to$ Payoff.

  **The Committed Two-Boxer's Response:**
  A staunch defender of CDT would say:
  > *"This case doesn't show that CDT is flexible or that Newcomb is solved. It shows that if you add a causal penalty to Two-Boxing (the lock), CDT correctly avoids the penalty. In standard Newcomb, there is no lock. The money is there to be taken. By adding the lock, you've changed the payoff matrix so that Two-Boxing is no longer dominant. You haven't fixed CDT's 'flaw' in Newcomb; you've just built a different game where the flaw doesn't trigger."*

  **Pedagogical Value:**
  Despite this, the case is valuable. It forces students to articulate *exactly* why CDT two-boxes in the standard case. It reveals that CDT's two-boxing relies on the **Causal Independence Assumption**: the belief that the agent's action has no causal influence on the state of the opaque box (or access to it). When that assumption is violated—even by a plausible, non-magical mechanism like a biometric lock—CDT behaves exactly like EDT. This clarifies that the disagreement between CDT and EDT in standard Newcomb is not about utility maximization per se, but about the **causal structure of the world**.
