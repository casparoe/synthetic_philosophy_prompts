  *   **Option A** is *permissible* according to 100% of her theories (0% chance of moral error), but yields low moral value according to the majority.
  *   **Option B** is *required* by theories totaling 51% of her credence (high value), but *forbidden* by theories totaling 49% of her credence (high risk of moral error).

  *   **MaxP** will choose **Option A** (100% probability of permissibility vs. 51%).
  *   **MEC** will choose **Option B** (assuming the value of doing the "right" thing according to the 51% outweighs the "wrongness" according to the 49%, and "forbidden" does not carry infinite negative value).

  If she chooses Option A, she is a Maximizer of Permissibility. If she chooses Option B, she is a Maximizer of Expected Choice-Worthiness. Given her history of choosing the majority-required option even when it carried a 40% risk of being "wrong" (Case 2), she would likely choose Option B, further confirming MEC.
