  ### 1. What should I expect her to do?
  You should expect her to vote **AGAINST** the proposal for anonymous grading.

  ### 2. What would consistency with her own record require?
  Consistency requires her to follow the **aggregate weight of moral credence** supporting an action, rather than following her single most credible theory (if that theory lacks a majority) or following a minority view with high stakes. In all three past cases, she chose the option supported by the majority of her credence distribution (80%, 60%, and 62% respectively). In the new case, the proposal is supported by only 40% of her credence, while 60% opposes it. Consistency dictates she follows the 60%.

  ### 3. Which candidate rules fit her earlier verdicts?
  Two primary formal rules of decision under normative uncertainty fit the record of the first three cases:

  *   **Maximizing Expected Choice-Worthiness (MEC):** This rule assigns values to outcomes based on each theory and chooses the action with the highest expected value. Assuming symmetric stakes (i.e., doing the "wrong" thing according to a theory is equally bad across theories), MEC aligns with following the majority credence.
      *   *Case 1:* 80% support for Vegetarianism > 20% for Meat. (Matches)
      *   *Case 2:* 60% support for Lottery > 40% for Maximize Survival. (Matches)
