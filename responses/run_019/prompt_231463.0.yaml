  ### 6. Which rule is best supported by the record as a whole?
  **Maximizing Expected Choice-Worthiness (MEC)** is best supported.

  While MaxP fits the past cases, it relies on the assumption that the theories agree on what is "permissible." In Cases 2 and 3, the theories were in direct conflict about what was *required*, implying that the minority view considered the majority's choice *wrong*. Your colleague consistently acted as if satisfying the majority of her moral credence was the priority, even when it meant acting against her favorite theory (Case 2).

