  *Refining the "Sphex" part:* The wasp acts mechanically because it cannot learn. The engineer *can* learn. Did he fail to learn? The evidence says he followed code. The experts say he *could* have thought more. The gap between "could have" and "should have" is where liability lives. Here, it's too thin for discipline.

