answer: |-
  **Scenario**
  Consider a roommate selection platform where users post profiles to find compatible living partners. A high-quality signal emerges: explicitly stating in one's bio, "I leave dirty dishes in the sink for days and will not change this habit." Writing this sentence is costless in terms of time, effort, or resources (cheap to fake), and there are no external penalties for lying (no leases or fines). Yet, the signal remains reliably honest: only those who actually leave dishes in the sink post this warning. Clean-living individuals do not fake this signal to appear "laid back" or to secure a housing slot, because doing so would successfully attract roommates who are tolerant of filth. A clean-living faker would thus secure a match, but would then be forced to live in the squalor they claimed to produce, suffering a utility loss from the environment itself. The dishonest signal succeeds in acquiring a partner but fails to acquire a *compatible* partner, rendering the deception self-defeating.

  **Diagnostics**
  The feature replacing production cost as the honesty-enforcer is **endogenous preference matching**. The signal alters the pool of receivers who accept the sender, creating an environment that is beneficial to the truth-teller (who wants to live in filth without conflict) but hostile to the faker (who wants cleanliness). The honesty is maintained not because the signal is expensive to produce, but because the *consequence of a successful signal* is utility-negative for the low-quality type. If you remove this feature—for example, if roommates were assigned randomly regardless of profile content, or if "messy" profiles were algorithmically boosted to the top of the queue regardless of match compatibility—deception becomes profitable again. A clean person would then signal "messy" to gain the algorithmic boost or secure a slot, knowing they can simply clean the dishes privately once matched without altering the receiver's acceptance.

  **The Hard Part**
  A defender of the Handicap Principle will argue that the anticipated disutility of living in squalor *is* a cost, merely shifted from the production of the signal to the consumption of its outcome. They will claim that the "ex-ante expected cost" of sending the signal includes the future mismatch, preserving the theory. This response is legitimate only if we accept that *any* deterrent to deception counts as a "handicap," but doing so renders the theory unfalsifiable and tautological: it reduces to "signals are honest when low-types choose not to send them," ignoring the specific mechanism of *wasteful expenditure* that Zahavi proposed. The Handicap Principle is distinct from general game-theoretic separation because it posits that the signal itself must be a net drain on fitness/resources to prove surplus capacity. A genuinely cost-free honest signal that the theory cannot accommodate would be a case where the low-type faces **identical** production and consumption costs as the high-type, yet still does not fake the signal because the signal conveys indexical information that cannot be decoupled from the state (e.g., a specific linguistic shibboleth that requires a developmental history to pronounce, not just effort). In my scenario, the cost is in the *match*, not the *message*; conflating the two dissolves the Handicap Principle into a general theory of incentives, stripping it of its explanatory power regarding why organisms evolve *wasteful* traits rather than just *informative* ones.
