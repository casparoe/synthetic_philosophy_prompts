answer: |-
  ### Final Exam: Philosophy of Biology (Seminar 404)
  **Topic:** The Function of the New
  **Word Limit:** 1,500 words
  **Total Marks:** 20

  **The Prompt**

  Imagine *Chimera-7*, a synthetic microbe assembled entirely *de novo* in a laboratory yesterday. It contains no DNA inherited from a reproducing lineage; its genome was printed from scratch. Among its components is a molecular pump that actively exports cadmium, a heavy metal toxic to the cell's internal machinery. This pump keeps the cell alive in contaminated environments. However, because *Chimera-7* has no ancestors, this pump has never been "selected for" in the past. It exists only now, and it contributes causally to the cell's survival capacity.

  Write an essay addressing the following:
  1.  Determine whether the pump has a "function" according to the **etiological account** and the **causal-role account**.
  2.  Explain why the verdict of each account feels intuitively unsatisfying in this specific case.
  3.  Argue what the real fault line is between these two accounts. Is function a matter of history, or is it a matter of current explanatory utility?

  Do not simply define the accounts. Use the case of *Chimera-7* to stress-test them.

  ***

  ### Model Answer (Excerpt/Structure)

  *Note to students: The following is a model of how to argue, not a template to copy. Notice how it applies the concepts immediately rather than pausing to define them in a vacuum.*

  **Title:** The Ghost in the Machine: Function Without History

  If we ask whether the cadmium pump in *Chimera-7* has a function, we are not asking if it works. It clearly does; without it, the cell dies. We are asking if the pump is *there for* a reason. This distinction collapses when we look at natural organisms, where history and utility usually align. In *Chimera-7*, they are severed.

  Under the **etiological account**, function is backward-looking. A trait has a function only if it exists now because ancestors possessing it survived and reproduced better than those who did not. The function is the effect that explains the trait's presence. Applied to *Chimera-7*, the verdict is stark: the pump has no function. There is no selection history. There were no ancestors who survived because of the pump. The pump is merely a fortunate accident of engineering, a beneficial trait without a teleological pedigree. To call it a "function" would be to lie about the history of the organism.

  This verdict feels unsatisfying because it renders the pump biologically inert in terms of explanation. If a biologist asks, "Why does *Chimera-7* have this structure?" the etiological account forces us to say, "It doesn't have a function, it just has effects." This ignores the obvious design logic. The pump is doing exactly what a function is supposed to do: it maintains the system's viability. Denying it functionhood seems like fetishizing the past at the expense of the present.

  Conversely, the **causal-role account** looks forward. It defines function as the contribution a component makes to the capacity of a containing system. If the system survives heavy metal exposure, and the pump contributes to that survival, the pump has a function. Here, the verdict is affirmative. The pump functions to export cadmium because that is its role in the system's current economy.

  Yet this verdict also chafes. If function is merely "causal contribution," the scope becomes dangerously wide. The pump also vibrates when it operates, generating heat. That heat contributes to the ambient temperature of the petri dish. Is warming the dish a function of the pump? Under a loose causal-role reading, yes. By detaching function from history, we risk losing the distinction between what a trait is *for* and what a trait merely *does*. In *Chimera-7*, we want to say the pump is *for* detoxification, not just that it *causes* detoxification.

  The conflict reveals the true fault line: **Normativity versus Description.** The etiological account tries to preserve the normative force of function—the idea that a trait can malfunction. If the pump breaks, it fails to do what it is supposed to do. But without history, "supposed to" loses its grip; the pump is just broken matter. The causal-role account preserves the descriptive utility for scientists studying the system *now*, but it sacrifices the normativity. Everything that happens becomes a function, and nothing is ever truly "broken," only different.

  In the case of synthetic life, the etiological account suggests that *Chimera-7* is a philosophical zombie: it acts alive, but lacks the historical grounding for biological teleology. The causal-role account suggests it is fully alive, but risks diluting the meaning of function until it applies to rocks as easily as cells (since rocks contribute to the capacity of a landscape).

  Ultimately, the *Chimera-7* case suggests that "function" is not a single natural kind. When we speak of function in engineering, we mean causal role (what is it designed to do now?). When we speak of function in evolution, we mean etiology (why is it here?). *Chimera-7* is an engineered organism living in an evolutionary context. The unsatisfying verdicts arise because we are trying to use one map for two different territories. The pump has a causal role absolutely, but it acquires an etiological function only if *Chimera-7* begins to reproduce and the pump is selected in future generations. Until then, the pump is a purpose without a past.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Application of the Etiological Account (4 Marks)**
  *   **Criteria:** Correctly identifies that the etiological account denies function to the pump due to the lack of selection history/ancestry.
  *   **4 Marks:** Clear verdict (No Function) linked explicitly to the "no ancestor/no selection" constraint of the prompt.
  *   **3 Marks:** Verdict correct, but the link to selection history is vague.
  *   **1-2 Marks:** Defines the account but fails to apply the verdict to *Chimera-7*.
  *   **0 Marks:** Incorrect verdict or ignores the account.
  *   **Typical Fluff:** *"The etiological account says function is about history, so maybe it has a function if the engineer selected it."* (Confuses human design with natural selection).

  **2. Application of the Causal-Role Account (4 Marks)**
  *   **Criteria:** Correctly identifies that the causal-role account affirms function based on the pump's current contribution to system capacity.
  *   **4 Marks:** Clear verdict (Has Function) linked explicitly to the "current utility/contribution" aspect.
  *   **3 Marks:** Verdict correct, but fails to mention the "system capacity" element.
  *   **1-2 Marks:** Defines the account but treats it as identical to the etiological one.
  *   **0 Marks:** Incorrect verdict or ignores the account.
  *   **Typical Fluff:** *"The causal-role account says it functions because it helps the cell survive, which is the same as the other account."* (Misses the divergence).

  **3. Analysis of Intuitive Dissatisfaction (4 Marks)**
  *   **Criteria:** Explains *why* both verdicts feel wrong (Etiological ignores obvious utility; Causal-Role is too permissive/loses normativity).
  *   **4 Marks:** Articulates the specific tension: History denies obvious purpose; Systemic view allows too much "noise" as function.
  *   **3 Marks:** Notes they feel wrong but only explains one side of the dissatisfaction.
  *   **1-2 Marks:** States they are unsatisfying without explaining why (e.g., "It just feels weird").
  *   **0 Marks:** Claims one verdict is perfectly satisfying.
  *   **Typical Fluff:** *"Both accounts are unsatisfying because biology is complicated and we need more research."* (Procrastination disguised as analysis).

  **4. Identification of the Fault Line (4 Marks)**
  *   **Criteria:** Identifies the core philosophical disagreement (History/Origin vs. Current Explanatory Power/Normativity).
  *   **4 Marks:** Clearly distinguishes between "why it is here" (history) and "what it does" (capacity), linking this to the concept of normativity or explanation.
  *   **3 Marks:** Identifies History vs. Current Utility but misses the deeper implication (normativity/explanation).
  *   **1-2 Marks:** Vague reference to "past vs. future" without philosophical grounding.
  *   **0 Marks:** Fails to identify a fault line.
  *   **Typical Fluff:** *"The fault line is that one philosopher is old and one is new."* (Biographical error).

  **5. Argumentative Coherence & Style (4 Marks)**
  *   **Criteria:** Essay flows logically, avoids excessive definition-dumping, and maintains a clear thesis.
  *   **4 Marks:** Concepts are woven into the argument; the case study drives the analysis.
  *   **3 Marks:** Clear structure, but relies too heavily on defining terms before using them.
  *   **1-2 Marks:** Disjointed paragraphs; the case study is forgotten after the intro.
  *   **0 Marks:** Incoherent or significantly under word count.
  *   **Typical Fluff:** *"In conclusion, as I said in the introduction, there are two views."* (Circular padding).
