  Third, the *sacred*. Economic substitution assumes fungibility. If religious norms are sacred, they are non-fungible; no secular incentive can substitute them without violating the constraint. This creates a kink in the indifference curve that standard optimization smooths over. Finally, the debate often concerns *truth claims*. Economists treat beliefs as priors. For believers, the efficacy of the treatment depends on its objective truth, not just subjective belief. An RCT on prayer assumes the mechanism is psychological; believers argue the mechanism is supernatural. This epistemic clash cannot be resolved by better identification. The question isn't just whether belief produces trust, but whether the object of belief is real, which lies outside the scope of empirical social science entirely.

  - **Residue report: their problem or mine (~150 words)**
  This is largely a category error, not a flaw in either framework. Economics is methodologically naturalistic; it cannot evaluate supernatural mechanisms or ontological transformations. When the debate hinges on divine action or sacred value, my vocabulary hits a hard boundary. However, much of the sociological debate *does* make empirical claims about behavior and social cohesion that should be translatable. When theologians argue secular societies will collapse, they are making a falsifiable prediction about $Y_{agg}$.

  The residue exists because the debate straddles two domains: the empirical (social trust) and the metaphysical (salvation). My framework captures the former but must ignore the latter. If the interlocutors insist the empirical effects depend on the metaphysical truth, then the problem is theirs: they are making an empirical claim contingent on an untestable axiom. If they are only claiming functional equivalence, my framework suffices. The non-translatable elements are usually the ones doing the heavy lifting in their argument, suggesting their claims are less well-defined than they sound.
