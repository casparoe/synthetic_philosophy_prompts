      *   Kim's argument is a reductio. It starts with assumptions non-reductive physicalists want to hold and shows they lead to contradiction (epiphenomenalism).
      *   *Logical Flow:*
          1.  Mental properties are distinct from physical properties (Non-Reductive Physicalism).
          2.  Mental properties have causal efficacy (Mental Causation).
          3.  Physical effects have sufficient physical causes (Causal Closure/Completeness).
          4.  No systematic overdetermination (Exclusion Principle).
          5.  *Result:* If the physical cause is sufficient, and the mental is distinct, the mental is excluded.
      *   *Teaching Order:* To make the trap snap shut, I need to establish the physical sufficiency first, then the mental distinctness, then the conflict.
      *   *Required Order:* Causal Closure $\rightarrow$ Realization/Supervenience (to link M to P) $\rightarrow$ Property Distinctness (to separate M from P) $\rightarrow$ Causal Efficacy (the claim being tested) $\rightarrow$ Exclusion (the hammer).
      *   *Wait, let's refine:* Kim's argument relies on the structure of *realization*.
          1.  **Causal Closure:** Physical effects have physical causes. (Sets the stage).
          2.  **Realization/Supervenience:** Mental states depend on physical states. (Links M to P).
          3.  **Property Distinctness:** M is not identical to P. (The Non-Reductive commitment).
          4.  **Causal Efficacy:** M causes P*. (The intuition we want to save).
          5.  **Exclusion:** If P causes P*, and M $\neq$ P, M is excluded.
      *   *Dependency:* You can't argue exclusion without closure (otherwise M could be the sole cause). You can't argue exclusion without distinctness (otherwise M just *is* P). You can't argue exclusion without efficacy (otherwise there's no problem).

