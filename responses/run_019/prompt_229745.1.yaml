  *Correction:* In the ICU case, the "100 people" aren't dying, they are just uncomfortable. In the Vaccine case, the "tiny benefits" prevent death/disease across the population. So the ICU case is Non-Aggregation of *lesser* harms vs *greater* harm. The Vaccine case is Aggregation of *lesser* benefits vs *costs*.
  Actually, the prompt says: "Vaccine... justification is summing up thousands of tiny benefits... where no single individual's stake comes close to the costs being imposed." This implies a specific individual might bear a cost (side effect) that outweighs *their* personal benefit, but the *population* benefit outweighs it.
  Okay, the core conflict is: **Individual Complaint Strength (ICU)** vs. **Net Social Utility (Vaccines)**.

  Let's structure the response around this core conflict.

  10. **Final Plan:**
