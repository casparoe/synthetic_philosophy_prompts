      *   **Problem:** Perceived inconsistency in the committee's ethical reasoning.
          *   *Case A (ICU Triage):* Non-aggregation. One person dying outweighs 100 people losing a week of ventilation. (Prioritizes the worst-off individual).
          *   *Case B (Public Health/Screening):* Aggregation. Thousands of tiny benefits outweigh costs imposed on individuals (e.g., side effects, false positives, resource use).
      *   **My Role:** Moral philosopher expert in T.M. Scanlon's contractualism, but also pragmatic about institutional realities.
      *   **Task:**
          1.  Brainstorm candidate implicit theories behind the practice.
          2.  Analyze consistency (Scanlonian vs. Utilitarian).
          3.  Identify potential principled lines (identified vs. statistical, ex ante vs. ex post).
          4.  Evaluate the consequences of "going full contractualist" (banning aggregation everywhere) and institutional feasibility.
      *   **Tone:** Philosophical rigor, nuanced, practical, empathetic to the institutional context.

  2.  **Deconstruct the Ethical Tension:**
      *   *The Triage Rule:* Looks like a "Save the Identifiable Life" heuristic or a strict prioritarianism. It rejects summing small burdens to override a catastrophic loss for one. This aligns with Scanlon's rejection of aggregation in *What We Owe to Each Other* (the "Numbers" problem).
      *   *The Public Health Rule:* Looks like classic cost-benefit analysis (Utilitarianism/QALYs). It sums small benefits across a population to justify interventions. This aligns with standard policy economics.
      *   *The Conflict:* How can you reject aggregation in the bedside context but embrace it in the policy context?

  3.  **Brainstorm Candidate Implicit Theories:**
      *   *Theory 1: Contextual Dualism.* Bedside ethics = Deontological/Contractualist (duties to specific patients). Policy ethics = Consequentialist/Utilitarian (maximizing population health).
      *   *Theory 2: Ex Ante vs. Ex Post.* Triage is *ex post* (fates are already sealed, we are choosing who dies). Vaccines are *ex ante* (everyone faces a small risk/benefit probability before anyone is harmed).
      *   *Theory 3: Identified vs. Statistical Lives.* We have a special duty to the person in front of us (identified) that we don't have to abstract future patients (statistical).
      *   *Theory 4: Threshold Deontology.* Aggregation is allowed *unless* a threshold of harm (death) is reached.
      *   *Theory 5: Institutional Division of Labor.* Clinicians owe fidelity to the present patient; Administrators owe stewardship to the community.

  4.  **Analyze Through a Scanlonian Lens:**
      *   *Scanlon's Core:* An act is wrong if it violates principles no one could reasonably reject.
      *   *Aggregation:* Scanlon generally rejects aggregating small benefits to override a significant loss for one person *in cases of rescue*. (The "Transparency" condition).
      *   *Application to Triage:* The dying patient has a strong complaint ("I will die"). The ventilated patients have weak complaints ("I will be uncomfortable for a week"). Reasonable rejection favors the dying patient.
      *   *Application to Vaccines:* This is trickier. Scanlon allows for *probabilistic* harm/benefit analysis in institutional rules. If a rule benefits everyone *ex ante* (including the one who might suffer side effects), it might be justifiable.
      *   *The "Ex Ante" Defense:* A contractualist can justify public health measures if the principle governing them is one that everyone, behind a veil of ignorance regarding their specific outcome, could accept.

  5.  **Evaluate Consistency (The "Principled Line"):**
      *   Is it inconsistent? Superficially, yes. Deeply, maybe not.
      *   *The Ex Ante/Ex Post Distinction:* This is the strongest philosophical bridge.
          *   Triage: *Ex post*. Specific individuals are already in harm's way. We are choosing *who* suffers the catastrophe.
          *   Vaccines: *Ex ante*. We are setting a rule for a population where everyone has a chance of benefit and a small risk of harm. No specific individual is *targeted* for sacrifice.
      *   *Identified vs. Statistical:* This is psychologically potent but philosophically shaky (Schelling's point). However, institutionally, it's very real.
      *   *Scanlon's View on Institutions:* Scanlon acknowledges that institutional rules operate differently than individual rescue cases. Principles for institutions can be general and probabilistic.

  6.  **Consequences of "Full Contractualism" (Banning Aggregation):**
      *   If we ban aggregation everywhere (strict Scanlonian rescue model applied to policy):
          *   No more vaccine mandates if *anyone* has a severe reaction (unless their consent is explicit).
          *   No more screening programs (false positives harm specific individuals).
          *   Resource allocation becomes impossible (cannot sum small efficiencies to save a life elsewhere).
      *   *Institutional Viability:* The hospital would collapse. It cannot function without some form of aggregative cost-benefit analysis for budgeting and policy.
      *   *Modification:* We need a "Two-Tier" Contractualism.
          *   Tier 1 (Micro/Clinical): Strict non-aggregation regarding catastrophic harm to identified patients.
          *   Tier 2 (Macro/Policy): Ex ante contractualism. Rules must be justifiable to each person as a *participant in the system*, not just as a specific victim.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sharpness of the observation. Validate the tension.
      *   *Section 1: Diagnostic Brainstorming.* Lay out the implicit theories (Dualism, Ex Ante/Post, Identified/Statistical).
      *   *Section 2: The Scanlonian Analysis.* Explain how Scanlon handles aggregation (The "Numbers" problem). Distinguish between *individual rescue* and *institutional rules*.
      *   *Section 3: The Principled Line.* Argue for the Ex Ante/Ex Post distinction as the most robust justification.
      *   *Section 4: The "Full Contractualist" Scenario.* Walk through the chaos of banning aggregation. Show why it's unworkable.
      *   *Section 5: Recommendations.* How to refine the committee's reasoning to be consistent without breaking the hospital. (Adopt a hybrid model).

  8.  **Refining the Argument (Self-Correction during drafting):**
