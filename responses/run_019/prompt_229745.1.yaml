      *   *Institutional Reality:* Emphasize that hospitals are fiduciaries for the community *and* the patient. Pure bedside ethics bankrupts the hospital; pure public health ethics violates trust.

  9.  **Final Polish:** Ensure the tone is collegial (fellow ethicist) but authoritative. Use clear headings. Make sure the "What would change" section is concrete.

