answer: |-
  This is an exceptionally sharp observation. You have put your finger on the central tension in modern bioethics: the clash between the **fiduciary duty to the identifiable patient** and the **stewardship duty to the population**.

  Most committees glide over this because the contexts feel different. But philosophically, you are right to press them. If aggregation is morally illegitimate in the ICU, why does it become legitimate in the clinic's vaccination policy?

  As a Scanlonian who has also sat on IRBs and allocation committees, I will walk you through the diagnostic landscape, analyze the consistency through a contractualist lens, and then give you the hard truth about what happens if you try to "purify" the system.

  ### 1. Brainstorming the Implicit Theories

  Before we judge the committee, let's charitable reconstruct what moral machinery they are likely using, often without realizing it. Here are the four candidate theories hiding in your committee's practice:

  *   **Theory A: Contextual Dualism (The "Hat Switching" Model).**
      *   *Premise:* Clinical ethics and Public Health ethics are distinct moral domains.
      *   *Logic:* In the ICU, I am a clinician/fiduciary. My duty is to *this* patient. Aggregation is forbidden because it treats the patient as a means to social welfare. In Public Health, I am a policymaker. My duty is to the community. Aggregation is required because the goal is population utility.
      *   *Verdict:* Pragmatically common, philosophically unstable. It risks hypocrisy unless you can explain *why* the moral status of the agent changes the moral status of the math.

  *   **Theory B: The Identified vs. Statistical Life Distinction.**
      *   *Premise:* We owe more to "Identified Lives" (the person in Bed 4) than "Statistical Lives" (the future people who might get flu).
      *   *Logic:* The psychological and moral pull of a specific person in peril overrides abstract sums.
      *   *Verdict:* Schelling famously noted this is psychologically real but morally dubious. Why does being *known* make you matter more? Scanlonians generally reject this as a fundamental moral ground, though they acknowledge its institutional utility.

  *   **Theory C: Threshold Deontology.**
      *   *Premise:* Aggregation is permissible *up to a point*.
      *   *Logic:* We can sum up weeks of discomfort (vaccines), but we cannot sum up small benefits to override a catastrophic loss (death in ICU).
      *   *Verdict:* This aligns closest with common intuition. It suggests there is a "lexical priority" to avoiding catastrophic harm that small benefits cannot trump.

  *   **Theory D: Ex Ante vs. Ex Post Contractualism.**
      *   *Premise:* The timing of the moral justification matters.
      *   *Logic:* Triage is *ex post* (harm is already occurring; we are choosing who suffers). Vaccines are *ex ante* (we are setting rules for a system where everyone has a probabilistic chance of benefit and risk).
      *   *Verdict:* This is the strongest philosophical candidate for consistency.

  ### 2. The Scanlonian Analysis: Is the Committee Inconsistent?

  To answer this, we must look at how T.M. Scanlon handles aggregation in *What We Owe to Each Other* and his later work on risk.

  **The ICU Case (Ex Post):**
  Scanlon is famously skeptical of aggregation in rescue cases. In his "Numbers" discussion, he argues that if you must choose between saving one person from death or saving many people from broken arms, you save the one from death. Why? Because the single person has a **complaint** that is stronger than any individual complaint in the other group.
  *   *The Committee's Rule:* Prioritizing the one dying patient over 100 uncomfortable patients is **highly Scanlonian**. The dying patient can reasonably reject a principle that sacrifices their life to spare others minor discomfort. The uncomfortable patients cannot reasonably reject a principle that asks them to endure a week of misery to save a life.
  *   *Utilitarian Justification?* A utilitarian *could* justify this, but only if they argue that the disutility of death is so astronomically high that 100 weeks of misery never mathematically catches up. But if the numbers changed (1 death vs. 1,000,000 weeks of misery?), the utilitarian would switch. The Scanlonian would not. Your committee is acting like implicit Scanlonians here.

  **The Vaccine Case (Ex Ante):**
  Here is where it gets tricky. If we apply the strict ICU logic to vaccines, we run into the "Individual Vetoes" problem. If no aggregation is allowed, a vaccine program could be blocked by the few individuals who suffer severe side effects, even if millions benefit.
  *   *Scanlon's Institutional Escape:* Scanlon distinguishes between **individual transactions** and **institutional rules**. In *The Significance of Choice*, he acknowledges that we live in systems where we cannot eliminate all risk.
  *   *The Justification:* A vaccine policy is justifiable if it is based on a principle that no one could reasonably reject *from an ex ante position*. That is: "Would you agree to a system where everyone takes a tiny risk of side effects to gain a high probability of protection?"
  *   *Consistency Check:* The committee is consistent **IF** they view the ICU as a site of *specific rescue* and the Vaccine program as a site of *general rule-making*.
      *   In the ICU, we are not making a rule for the future; we are adjudicating a specific conflict of claims *right now*.
      *   In Vaccines, we are establishing a general policy where the "losers" (side effect victims) are not targeted; they are unfortunate participants in a scheme that benefits them *probabilistically* before the fact.

  **The Verdict:** The committee is not necessarily inconsistent, but they are likely unable to articulate the **Ex Ante / Ex Post** distinction that saves them. They are applying "Rescue Ethics" to the ICU and "Policy Ethics" to vaccines, without realizing these require different justificatory frameworks.

  ### 3. The Principled Line: Ex Ante vs. Ex Post

  If you want to defend the committee's practice without calling it hypocrisy, this is the line you draw:

  1.  **In the ICU (Ex Post):** The harms are **certain and concentrated**. We know exactly who will die. To sacrifice that person is to use them as a means to relieve others. Their complaint is "I am being killed to save others." This is reasonably rejectable.
  2.  **In Public Health (Ex Ante):** The harms are **probabilistic and dispersed**. No specific individual is *chosen* to suffer. The person who gets the side effect was not singled out; they entered a lottery where the odds were in their favor. Their complaint is "I lost the lottery." This is harder to reasonably reject, provided the odds were fair and the system is mutually beneficial.

  **The "Identified Life" factor** is actually a proxy for this. Identified lives are usually *ex post* cases. Statistical lives are *ex ante* cases.

  ### 4. What If We Went "Full Contractualist"?

  Now, let's play out your thought experiment. Suppose the committee reads Scanlon strictly and decides that **aggregation is morally illegitimate everywhere**, not just in triage. They decide that no individual can be asked to bear a cost that outweighs their personal benefit, regardless of the population gain.

  **Concrete Consequences:**
  1.  **End of Screening Programs:** Mammograms and PSA tests create false positives. Specific individuals suffer biopsies, anxiety, and over-treatment. For *those specific individuals*, the burden outweighs the benefit (since they didn't have cancer). A strict non-aggregation rule bans screening because you cannot sum the lives saved to override the harm to the false-positives.
  2.  **No Infectious Disease Control:** Quarantines or mask mandates impose burdens on specific individuals (loss of liberty, income) to protect the population. If the individual's burden is high enough, they can "veto" the policy.
  3.  **Resource Allocation Collapse:** You cannot move money from a low-yield department to a high-yield one if it harms the specific patients in the low-yield department. Cost-effectiveness analysis (QALYs) becomes immoral because it aggregates small gains across many to justify denying care to one.
  4.  **Research Halts:** IRBs would struggle to approve any study with more than minimal risk, even if the knowledge gained would save millions. The specific subject's risk cannot be outweighed by societal benefit.

  **Institutional Viability:**
  Could a hospital live with this? **No.**
  A hospital is a finite resource pool operating in a world of scarcity. To function, it *must* make trade-offs that benefit the many at a cost to the few (e.g., stocking flu vaccines instead of rare antivenom). A "Full Contractualist" ban on aggregation leads to paralysis. It treats the hospital as if it were a state of nature where no cooperative schemes are permissible.

  ### 5. Recommendation: How to Fix the Reasoning

  You don't need to change the *rules*, but you do need to change the *rationale* to avoid the inconsistency charge. Here is how I would frame this to your committee:

  **1. Adopt "Two-Tier Contractualism."**
  Explicitly acknowledge that there are two modes of ethical reasoning in the hospital:
  *   **Micro-Allocation (Bedside):** Governed by **Strong Non-Aggregation**. When specific, identified patients compete for immediate resources, we do not sum burdens. The strongest individual complaint wins. (This protects the vulnerable patient from being sacrificed for the greater good).
  *   **Macro-Allocation (Policy):** Governed by **Ex Ante Contractualism**. When setting general rules (vaccines, screening, staffing), we ask: "Is this a system everyone could accept *before knowing their specific outcome*?" Here, aggregation is permitted because it is part of a mutually beneficial cooperative scheme.

  **2. The "Reasonable Rejection" Test for Policy.**
  For the vaccine programs, don't justify them by saying "The total benefit is higher." Justify them by saying: "No individual could reasonably reject a principle that requires small risks for large probabilistic benefits, provided we minimize those risks and compensate those who are harmed."
  *   *Crucial Add-on:* If you ban aggregation, you must introduce **compensation**. If you are going to impose costs on individuals for the public good (like vaccine injury), a contractualist system requires a safety net (e.g., vaccine injury compensation funds). This makes the burden "reasonable."

  **3. Stop using "Identified vs. Statistical" as the Moral Ground.**
  It's too shaky. Use **Certainty vs. Probability**.
  *   ICU: Certainty of death for Patient A.
  *   Vaccines: Probability of benefit for All, Probability of harm for Some.

  ### Summary for Your Committee
  You can tell them: *"We are not being inconsistent, but we are being imprecise. We are rightly treating bedside triage as a rescue scenario where aggregation is forbidden, and public health as a cooperative scheme where ex ante aggregation is required. Our error is trying to use the justification for one to explain the other. We need to codify that distinction so we don't accidentally apply bedside ethics to budgeting, or budgeting ethics to the bedside."*

  If you ban aggregation everywhere, the hospital closes. If you allow it everywhere, the ICU becomes a slaughterhouse of the vulnerable. The art of institutional ethics is knowing which door keeps which wolf out.
