  A friend in my phil of mind reading group hit me with this and it seems to prove way too much, but I cant find the weak joint. (1) You can only ascribe beliefs to a creature at all against a background where most of what it believes comes out true -- error is only intelligible as local failure against a mostly-true whole, so any interpreter worth the name must assign mostly-true beliefs (call this ascription universality). (2) There's nothing more to what someone believes than what the best overall interpretation of them would assign; belief facts don't float free of interpretability. (3) Between two rival interpretations of the same person, the one that makes her beliefs mostly true strictly dominates the one that makes them mostly false, since it explains the same behavior without positing gratuitious error. (4) So every believer's beliefs are mostly true, full stop. (5) But take someone raised inside a totalizing cult: her beliefs about history, biology, outsiders, even her own family seem riddled with systematic error -- she looks mostly wrong about entire domains of her life. (6) Given (4), that's impossible: there is no such thing as being mostly wrong about a domain, only being mostly right in a way we haven't charitably reconstructed yet. That can't be right -- it makes mass propaganda and cult indoctrination conceptually impossible rather than just morally bad. My friend says one of (1)-(3) has to go but won't say which. Which step do I reject, and what does rejecting it cost? I'd like to keep the anti-skeptical punch this style of argument has against brain-in-a-vat scenarios if I can, since that's what drew me to it. Also tell me how confident you are in your diagnosis, and flag the specific step or claim in your own answer that you're least sure about.
