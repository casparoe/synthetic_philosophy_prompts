answer: |-
  # Workshop Design: Six and Six
  **A 90-Minute Seminar on Inference, Convention, and Underdetermination**

  ## 1. Facilitator Briefing: Theoretical Status & Limitations
  *Read this before running the session. This section is for you, not the participants.*

  **The Core Claim:** The workshop demonstrates that a finite set of examples cannot logically guarantee a single rule (underdetermination). It posits that successful communication relies on shared "salience" (what features we agree matter) rather than explicit definition.

  **Settled vs. Contested:**
  *   **Settled:** It is a logical fact (Hume, Goodman) that finite data underdetermines infinite hypotheses. Multiple rules can always fit the same data points.
  *   **Contested:** The extent to which this logical problem translates to *actual* literary misunderstanding is debated. Some cognitive linguists argue context usually resolves ambiguity so efficiently that underdetermination is rarely a practical failure. Others argue it is the engine of all interpretation.
  *   **Bongard Specifics:** Classic Bongard problems assume a "correct" solution exists. In this workshop, we subvert that by treating the "correct" solution as contingent on shared bias. If a participant argues that "meaning is stable," the activity remains sound: it demonstrates the *risk* of instability, not the inevitability of chaos.
  *   **Limit:** A novel is not 12 sentences. Real reading involves cumulative constraint (later chapters rule out earlier misreadings). The debrief must explicitly correct for this compression, or writers may leave believing precision is impossible.

  **Facilitator Stance:** Do not lecture on this theory before the game. Let the frustration of the game produce the data. In the debrief, present the theory as a "model" for what happened in the room, not as absolute law.

  ---

  ## 2. Materials List
  *   **Timer:** Visible to the room.
  *   **Tokens:** 50 poker chips, coins, or slips of paper (for scoring).
  *   **Handout A:** "Warm-Up Problems" (3 Bongard problems: 2 geometric, 1 narrative).
  *   **Handout B:** "Scorecard" (Columns for Designer Name, Intended Rule, Guessed Rule, Points).
  *   **Whiteboard/Flipchart:** For tallying scores and listing "Alternative Rules."
  *   **Paper/Pens:** For all participants.

  ---

  ## 3. Run Sheet (90 Minutes)

  ### Part I: The Warm-Up (15 Minutes)
  *Goal: Establish the mechanic without explaining the theory.*

  **0:00 – 0:05 | Introduction**
  **Facilitator Script:** "Welcome. We are going to play a pattern-recognition game called 'Six and Six.' There is no lecture today. There are only puzzles. On Handout A, you will see three problems. Each problem has a Left Side (six items) and a Right Side (six items). The Left Side obeys a rule. The Right Side violates it. Your job is to write down the rule for each problem. You have five minutes. Go."

  **0:05 – 0:10 | The Reveal**
  Ask the room for solutions.
  *   *Problem 1 (Geometric):* Left: Shapes with curved lines. Right: Shapes with only straight lines.
  *   *Problem 2 (Geometric):* Left: Shaded shape is larger. Right: Shaded shape is smaller.
  *   *Problem 3 (Narrative):*
      *   *Left:* "The king died." / "The glass broke." / "The leaf fell." (Intransitive/Passive experience).
      *   *Right:* "John killed the king." / "Mary broke the glass." / "Wind blew the leaf." (Transitive/Active agency).
      *   *Trap:* Participants may guess "Left has fewer words" or "Left uses 'The'." Acknowledge these if they fit.

  **0:10 – 0:15 | The Pivot**
  **Facilitator Script:** "Notice that for Problem 3, some of you guessed rules about grammar, others about meaning, and others about word count. If your rule fit all six examples on the Left and none on the Right, you are correct. There is no 'more correct' answer in logic, only in convention. Keep that feeling. Now we make our own."

  ### Part II: The Middle Game (55 Minutes)
  *Goal: Create the conditions for underdetermination and social negotiation of meaning.*

  **0:15 – 0:35 | Construction (20 Minutes)**
  **Instruction:** "You are now the Designer. You must create a 'Six and Six' set using narrative material.
  1.  Choose a Rule. It can be grammatical, thematic, or stylistic (e.g., 'Sentences where the protagonist lies,' 'Sentences in past perfect,' 'Sentences ending in a noun').
  2.  Write 12 micro-scenes. Maximum 15 words per scene.
  3.  Six must obey the rule (Left). Six must violate it (Right).
  4.  Write your **Intended Rule** on a separate slip of paper. Fold it. Do not show anyone.
  5.  You may use lines from your own work or invent them."

  *Facilitator Note:* Circulate. If someone writes a rule that is impossible to distinguish (e.g., "Left is sad, Right is sad but less so"), encourage them to make it binary. If someone makes it too obvious ("Left has the word 'apple'"), tell them to aim for a rule that requires interpretation.

  **0:35 – 0:50 | The Swap & Guess (15 Minutes)**
  **Instruction:** "Pair up. Exchange your 12 examples. Do **not** exchange the folded rule slip.
  1.  The Guesser has 5 minutes to study the 12 examples.
  2.  The Guesser must write down the Rule they think governs the Left Side.
  3.  **Scoring:**
      *   **Guesser:** You get 1 Token if your rule fits all 12 examples perfectly. You get 2 Tokens if your rule matches the Designer's Intended Rule.
      *   **Designer:** You get 2 Tokens if the Guesser finds your Intended Rule. You get 0 Tokens if the Guesser finds a *different* rule that fits all 12 examples.
      *   **Crucial:** If the Guesser finds a rule that fits the examples but is *not* what you intended, the Guesser wins the tokens, and you lose them. Your examples failed to specify your meaning."

  *Facilitator Note:* This scoring is the engine of the lesson. It punishes the Designer for under-specification. It rewards the Guesser for finding *any* consistency, even if it's a "misreading."

  **0:50 – 0:55 | The Harvest (5 Minutes)**
  **Instruction:** "Stay in pairs. Look at cases where the Designer lost points (the Guesser found a different valid rule). Write that 'Alternative Rule' on the whiteboard. We want to see how many ways a single set of examples can be read."

  ### Part III: The Debrief (20 Minutes)
  *Goal: Map the game mechanics onto literary craft and address limitations.*

  **0:55 – 1:05 | Mapping the Mechanics**
  **Facilitator Script:** "Look at the whiteboard. Look at the tokens.
  *   **The Examples:** These are your opening chapters, your character descriptions, your genre markers.
  *   **The Intended Rule:** This is the concept in your head (e.g., 'This is a noir,' 'This character is sympathetic').
  *   **The Guessed Rule:** This is what the reader actually constructs.
  *   **The Lost Tokens:** This is the gap. When the Guesser found a rule you didn't intend, you experienced underdetermination. Your examples supported a meaning you did not authorize.
  *   **The Winning Tokens:** When the Guesser found your rule, it wasn't because the examples *forced* it. It was because you and the Guesser share a tacit sense of what features are 'salient.' You both ignored the word count and looked at the grammar. That shared bias is what makes reading possible."

  **1:05 – 1:15 | Troubleshooting the Room (Meta-Commentary)**
  **Facilitator Script:** "I need to address what might have gone wrong in here, because it mirrors what goes wrong in drafting.
  *   **Embarrassment:** If you felt exposed when your rule was 'beaten,' that is the feeling of a manuscript returning from an editor with notes saying, 'I thought this was a comedy.'
  *   **Gerrymandering:** If you wrote examples that barely fit your rule just to win, you created a 'technical' truth that feels false. This is 'writing to the prompt' rather than writing to the truth of the story.
  *   **Obviousness:** If your rule was too easy, you didn't learn anything. In fiction, if your themes are too obvious, the reader disengages.
  *   **Handling Conflict:** If a Guesser insisted their rule was right despite the Designer's protest, that is a book club argument. Both are logically valid; the tie-breaker is always *convention*."

  **1:15 – 1:20 | Limitations & Correction**
  **Facilitator Script:** "Finally, a warning. This game compresses a novel into 12 sentences.
  *   **Novels are not Bongard Problems:** A novel has 80,000 words. Later chapters rule out earlier misreadings. You have more space to correct the reader than you did in this game.
  *   **Readers are not Guessers:** Real readers do not come in looking to beat you. They come in wanting to collaborate.
  *   **The Lesson:** Do not leave here thinking communication is impossible. Leave knowing that precision is not about adding more rules; it is about curating examples that trigger the *right* shared salience. You cannot force the reader to think your thought. You can only arrange the evidence so that thinking your thought is the most natural path."

  **1:20 – 1:30 | Q&A / Close**
  Open floor for participants to share specific "Alternative Rules" that surprised them.

  ---

  ## 4. Handout A: Warm-Up Problems
  *(Print this sheet for each participant)*

  **Problem 1**
  *Left:* [Circle], [Oval], [Spiral], [Semicircle], [Wavy Line], [Donut]
  *Right:* [Square], [Triangle], [Rectangle], [Pentagon], [Straight Line], [Star]
  *What is the rule?*

  **Problem 2**
  *Left:* [Large Black Circle next to Small White Square], [Large Black Triangle next to Small White Circle]... (6 examples where Black shape is larger)
  *Right:* [Small Black Circle next to Large White Square], [Small Black Triangle next to Large White Circle]... (6 examples where Black shape is smaller)
  *What is the rule?*

  **Problem 3 (Narrative)**
  *Left:*
  1. The window shattered.
  2. A scream was heard.
  3. The money vanished.
  4. Darkness fell.
  5. The phone rang.
  6. Silence followed.

  *Right:*
  1. John shattered the window.
  2. Mary heard a scream.
  3. The thief stole the money.
  4. Night covered the city.
  5. Someone rang the phone.
  6. The guard enforced silence.

  *What is the rule?* (Note: Multiple answers may fit.)

  ---

  ## 5. Facilitator Troubleshooting Guide
  *Keep this handy during the session.*

  **Issue: Participants write rules that are too vague (e.g., "Left is sadder").**
  *   **Fix:** Intervene during the Construction phase. Ask: "Can I test that objectively against sentence 4?" If not, ask them to tighten the rule to a observable feature (syntax, imagery, agency).

  **Issue: A Guesser finds a rule that fits, but the Designer says "No, that's not it."**
  *   **Fix:** Enforce the scoring rules strictly. If the rule fits all 12 examples logically, the Guesser gets the point. This is the core lesson. Say: "The text supports their reading. Your intention didn't make it onto the page."

  **Issue: Participants feel the game is "gotcha" or hostile.**
  *   **Fix:** In the Debrief, emphasize that this is a *model* of risk, not a judgment of talent. "We are testing the medium, not the writer."

  **Issue: The group fixates on the "Correct" Bongard solution in the Warm-Up.**
  *   **Fix:** Interrupt. "If your rule fits the data, it is valid. We are not looking for the author's intent here; we are looking for consistency."

  **Issue: Running out of time.**
  *   **Fix:** Cut the "Harvest" (whiteboard) phase short. Move directly to Debrief. The pair-swap is the critical experience; the group discussion is secondary.

  ---

  ## 6. Theoretical Note for the Facilitator (Expanded)
  *Refer to this if participants challenge the premise during Q&A.*

  **If a participant says:** "But in a real novel, context makes the meaning clear. This game is artificial."
  **You say:** "You are right. That is why the Debrief emphasizes that novels have more constraints than 12 sentences. However, the *mechanism* is the same. Even in a novel, you rely on the reader sharing your sense of what details matter. If you describe a gun in Act 1, you rely on the reader knowing guns are salient. If they think 'decor' is the salient feature, Chekhov's gun becomes a set dressing. This game isolates that risk."

  **If a participant says:** "Meaning is subjective anyway. Why try to control it?"
  **You say:** "That is one philosophical stance. Another is that meaning is a contract. This game shows how easily the contract can be broken if the terms (examples) are loose. Whether you want to control meaning or liberate it, you need to know how the inference engine works."

  **If a participant says:** "Bongard problems have one right answer. You changed the rules."
  **You say:** "Classic Bongard problems assume a shared cultural context between designer and solver. In this room, we exposed that context as fragile. We didn't change the rules of logic; we exposed the hidden rule of 'shared assumption' that usually goes unnoticed."
