answer: |-
  # Seminar Prep Sheet: Nāgārjuna, Tetralemma, and Negation
  **Context:** 2nd-Year Seminar | Logic & Religion Reading Group
  **Thesis:** Tetralemma corners are *declined* (prasajya/illocutionary), not *denied* (paryudasa/truth-functional). Nāgārjuna is a conceptual anti-realist, not a dialetheist.

  ---

  ## Wave 1: The Formal Logicians
  *These objections will come early. They want to know if Nāgārjuna is a "case study" for their systems (LP, K3, FDE) or if you've removed the toy from their sandbox.*

  ### Objection 1: The "Boring Nāgārjuna" Challenge
  **Phrasing:** "If you defuse the contradictions via *prasajya* negation, you've made Nāgārjuna logically benign. On your reading, he isn't challenging classical logic; he's just opting out of the game. So why should logicians care? You've turned a radical metaphysician into a proto-Wittgensteinian quietist."
  *   **Damage:** High. If the audience thinks your reading makes the text irrelevant to *their* research interests, you lose the room.
  *   **Concede:** Concede that he is not offering an *alternative formal system* (like a 4-valued logic).
  *   **Reply:** Argue that he offers a *critique of the applicability* of formal systems to ontology. He isn't doing logic; he's doing the philosophy of logic. The lesson for logicians is the limit of formalization when applied to *svabhāva*-laden concepts.
  *   **Shaky Bit:** If they press on whether "limits of formalization" is itself a logical claim, you risk circularity.

  ### Objection 2: The Truth-Value Gap vs. Glut
  **Phrasing:** "You say he declines the corners. But when he says 'emptiness is empty,' isn't that a truth-claim? If 'All dharmas are empty' is true, and it applies to itself, don't you still need a paraconsistent framework to handle the self-reference without collapsing?"
  *   **Damage:** Medium. This targets the "Emptiness of Emptiness" (XXIV.18).
  *   **Concede:** Admit that *conventionally*, the statement functions as true.
  *   **Reply:** Distinguish levels. The statement "All things are empty" is a therapeutic tool (medicine), not a description of reality (ontology). Once the cure works, the medicine is discarded. It doesn't need a truth-value in the ultimate sense.
  *   **Shaky Bit:** Logicians hate "it depends on the level" answers unless the levels are formally defined. You need to be careful not to sound like you're hiding a truth-value gap behind the word "conventional."

  ---

  ## Wave 2: The Sanskrit/Buddhism Scholars
  *These objections will come once the logicians settle down. They worry you are colonizing the text with analytic categories.*

  ### Objection 3: The "Hidden View" (Dṛṣṭi) Trap
  **Phrasing:** "You claim Nāgārjuna has no position. But 'global anti-realism about concepts' *is* a position. By explaining *why* he declines the corners (because the conceptual scheme is broken), you've attributed a metaphysical commitment to him. Doesn't this violate MMK XIII.8 ('I have no thesis')?"
  *   **Damage:** High. This is the classic "Mādhyamika self-refutation" objection.
  *   **Concede:** Concede that *ultimately*, attributing any view is problematic.
  *   **Reply:** Frame your reading as *prasaṅga* (reductio) all the way down. You aren't saying "Nāgārjuna believes anti-realism." You're saying "Nāgārjuna shows that *any* realism leads to absurdity." Your "anti-realism" is just the shadow cast by the rejection of realism, not a positive doctrine.
  *   **Shaky Bit:** It is very hard to maintain this distinction without slipping into a "negative dogmatism." If you say "concepts are broken," that sounds like a claim about concepts.

  ### Objection 4: The *Prasajya/Paryudāsa* Overreach
  **Phrasing:** "You're leaning heavily on the *prasajya/paryudāsa* distinction. But that distinction is codified by later Navya-Nyāya and Buddhist logicians (Dharmakīrti), not necessarily Nāgārjuna. Are you anachronistically imposing a later grammatical distinction onto the MMK to solve a logical problem?"
  *   **Damage:** Medium-High. This attacks your textual philology.
  *   **Concede:** **FLAG:** The Sanskrit does not decisively settle this. The grammatical distinction exists in Pāṇini, but its philosophical application in MMK is interpretive.
  *   **Reply:** Argue for charitable reconstruction. Even if the *terminology* is later, the *logical behavior* of the negations in the text functions non-implicatingly. The distinction is the best tool we have to formalize what he is *doing*, even if he didn't name it.
  *   **Shaky Bit:** If a Sanskritist in the room knows the specific verses better than you, they can point to a *na* that looks implicating. Do not fake certainty here.

  ---

  ## Wave 3: The "Secret Fear" & Internal Consistency
  *This is the objection you are worried about. It usually comes from a senior faculty member who has read both sides.*

  ### Objection 5: The Dependent Origination Assertion (Your "Secret Fear")
  **Phrasing:** "If the tetralemma is declined because concepts presuppose *svabhāva* and are therefore broken, how do you account for Chapter I on Causation? Nāgārjuna asserts dependent origination (*pratītyasamutpāda*). Is that not an assertion with content? If concepts are broken, how can 'dependence' be coherent? If 'dependence' is coherent, why are the tetralemma concepts broken?"
  *   **Damage:** Critical. If you can't answer this, your "global anti-realism" collapses into self-refutation.
  *   **Concede:** Concede that *pratītyasamutpāda* is asserted, but deny it has the same ontological weight as the tetralemma corners.
  *   **Reply:** Rely on the Two Truths. The tetralemma targets *ultimate* existence (*svabhāva*). Dependent origination is the structure of *conventional* reality (*saṃvṛti*). Nāgārjuna asserts dependence *precisely because* there is no independence. It is a description of how the illusion works, not a claim about what exists ultimately.
  *   **Shaky Bit:** The line between "describing the illusion" and "making a claim about reality" is razor-thin. If dependent origination is true, in what sense is it "empty"? If it's empty, is it true? This is the "Emptiness of Emptiness" problem again.
  *   **Prep:** Have MMK XXIV.18 ready ("We state that dependent origination is emptiness"). Emphasize that emptiness is not a *thing*, it's a *property* of things (lack of svabhāva).

  ### Objection 6: The "Less Charitable" Claim
  **Phrasing:** "You argued that dialetheist readings are *less* charitable because they make Nāgārjuna a logical heretic. But isn't it more charitable to assume he knew what he was doing and *intended* the contradictions, rather than assuming he was just confused about negation types? Maybe the 'scandal' is the point."
  *   **Damage:** Medium. Attacks your motivation/charity principle.
  *   **Concede:** Concede that Priest/Garfield are brilliant logicians and their reading is internally consistent.
  *   **Reply:** Argue that charity should be directed at the *soteriological goal*, not just logical consistency. If the goal is liberation from conceptual proliferation (*prapañca*), a dialetheist reading reifies the contradictions as true, which might trap the mind in logic rather than freeing it. Your reading makes him more consistent with the *goal* of the text.
  *   **Shaky Bit:** This moves the goalposts from logic to soteriology. Logicians might resent this move.

  ---

  ## Wave 4: Textual Indeterminacy (Where you can't fake certainty)
  *Be prepared to admit uncertainty here. It builds credibility.*

  1.  **The Scope of Negation:** In some verses, the negation seems to apply to the predicate; in others, to the copula. The Sanskrit syntax allows ambiguity.
      *   *Strategy:* "The syntax underdetermines the logical scope. I am arguing for the *prasajya* reading based on the *argumentative context*, not purely on grammar."
  2.  **The Fourth Corner (Neither):** Some scholars argue the fourth corner is the "mystical" option that *is* affirmed.
      *   *Strategy:* "I am treating the fourth corner as structurally identical to the first three for the sake of this argument. If the fourth is affirmed, my reading requires modification, but the *prasajya* logic still holds for the first three."
  3.  **Nāgārjuna's Intent:** We do not have Nāgārjuna's commentary on his own logic.
      *   *Strategy:* "We are reconstructing a coherent philosophy from the text. I am not claiming access to his psychological intent, but to the logical commitments of the text."

  ---

  ## Strategic Concessions & "Out" Clauses

  *   **If cornered on the "Boring" charge:** Pivot to "Therapeutic Logic." Compare to Wittgenstein or Carnap. Logic isn't just about truth-preservation; it's about conceptual clarity. Nāgārjuna is doing conceptual hygiene.
  *   **If cornered on the "Dependent Origination" charge:** Use the "Fire and Fuel" analogy (MMK X). Dependence is relational, not substantial. It doesn't require *svabhāva* to exist, it explains the *absence* of *svabhāva*.
  *   **If a Sanskritist corrects your translation:** Do not defend the Sanskrit. Say: "That's a fair point on the grammar. My argument relies on the philosophical coherence of the *prasajya* reading, but I welcome the philological correction."
  *   **If a Logician asks for a formalization:** Do not try to formalize *prasajya* negation in LP on the fly. Say: "Standard formalizations treat negation as truth-functional. *Prasajya* is illocutionary. Formalizing it requires a logic of assertion/rejection, not just truth-values. That's the next stage of the project." (This buys you time).

  ## Summary of Weak Points
  1.  **The "Anti-Realism is a View" problem:** You haven't fully solved how to state your thesis without violating the thesis.
  2.  **The Sanskrit Anachronism:** The *prasajya/paryudāsa* distinction is clearer in later texts than in MMK.
  3.  **The Utility for Logicians:** If you succeed, you might prove Nāgārjuna isn't doing logic, which might make the logicians leave early.

  **Final Advice:** When the "Secret Fear" objection comes (Dependent Origination), pause. Take a breath. Acknowledge the gravity of the question. It shows you understand the stakes. Then deploy the Two Truths distinction carefully, emphasizing that *pratītyasamutpāda* is the *name* for the lack of *svabhāva*, not a competing theory of existence.
