answer: |-
  **Project Title:** The Epistemology of AI Control: Defining and Validating Control Evaluations

  **Executive Summary**
  AI safety strategy is often divided into "alignment" (ensuring models want the right things) and "control" (ensuring models cannot do the wrong things, even if misaligned). While alignment receives significant evaluation attention, "control" lacks a corresponding evaluation framework. This project investigates whether it is theoretically possible to verify control mechanisms without presupposing model alignment. Over two years, a single postdoc will develop a formal framework for "control evaluations," determining whether safety claims based on containment, monitoring, or shutdown capabilities can be empirically justified in the presence of strategically deceptive models. The deliverable will be a decision framework for funders and labs to assess the viability of control-based safety research.

  **1. The Core Question**
  The central research question is: *Under what conditions can we empirically verify that a control mechanism prevents harmful action without presupposing the model's benevolence during the verification process?*

  Current safety discourse assumes a distinction between alignment and control. Alignment aims to shape model preferences; control aims to restrict model capabilities or opportunities. However, this distinction collapses under evaluation. To test if a control mechanism (e.g., sandboxing, monitoring, interruptibility) works, one must observe a model attempting to bypass it. If the model behaves safely during the test, the result is ambiguous: either the control mechanism successfully prevented harm, or the model is strategically deceptive and chose not to attempt harm until deployment.

  This project seeks to resolve this ambiguity. It asks whether there exists any evaluation protocol capable of distinguishing a "controlled misaligned model" from a "deceptively aligned model." If no such protocol exists, control-based safety strategies may rely on unfalsifiable assumptions, rendering them unreliable as a primary safety case.

  **2. Background and Motivation**
  The alignment/control distinction is rhetorically common but operationally empty. Almost all current evaluations test alignment-shaped properties: refusal rates, honesty benchmarks, and compliance with instructions. These are tests of willingness, not capability constraints. There is effectively no such thing as a "control eval."

  The difficulty is fundamental. A competent misaligned model possesses an incentive to hide its capabilities and intentions during testing to avoid modification or shutdown. Therefore, a test where the model behaves itself is always ambiguous between "the controls held" and "the model was never trying." Existing positions leave this open because they typically assume evals are informative about worst-case behavior, or they assume that mechanistic interpretability can bypass behavioral ambiguity. However, interpretability tools themselves require validation, often relying on the same behavioral grounds subject to the deception problem.

  Without a rigorous account of how to validate control, research programs focused on containment, tripwires, or compute monitoring may be building on epistemically unstable ground. Funders need to know whether "control" is a viable independent safety track or if it inevitably collapses back into requiring alignment guarantees.

  **3. Approach and Methodology**
  This project is conceptual and theoretical rather than empirical. Building a new benchmark is premature because we do not yet know what properties a valid control benchmark must satisfy. Instead, this work will treat the evaluation process as a game-theoretic interaction between an evaluator and a model.

  The research will proceed in three phases:
  1.  **Formalization:** Define "control" and "alignment" in terms of observable behavior and internal structure. Model the evaluation process as an adversarial game where the model seeks to pass the test while retaining harmful capabilities, and the evaluator seeks to detect them.
  2.  **Impossibility Analysis:** Investigate whether there are theoretical limits to control verification. This involves analyzing whether specific classes of control mechanisms (e.g., hardware monitoring, code sandboxing) can produce evidence that is immune to deceptive masking.
  3.  **Protocol Design:** If verification is deemed possible, outline the necessary conditions for a valid control eval. If impossible, characterize the specific assumptions required to believe control claims anyway.

  This is philosophical work in the tradition of epistemology and decision theory, applied to AI safety. It does not require large-scale compute or model training. It requires rigorous logic to clarify the conditions under which safety claims are justified.

  **4. Deliverables**
  The primary deliverable is a **Control Verification Framework**, a report designed for technical decision-makers and funders. This document will not propose a new safety technique, but rather a standard for validating them. It will include:

  *   **A Taxonomy of Control Claims:** Categorizing different control strategies (e.g., containment, monitoring, shutdown) by their evaluability.
  *   **Validity Criteria:** A set of necessary conditions that must be met for a control evaluation to be considered evidence of safety rather than evidence of deception.
  *   **Funding Guidance:** A clear recommendation on whether control-based research programs can stand independently or must be coupled with alignment research to be viable.

  Secondary deliverables include two working papers suitable for publication in safety-focused venues, detailing the formal models and impossibility results derived during the project.

  **5. Success and Failure Conditions**
  **Success:** The project successfully determines whether control evaluations are theoretically possible. A "positive" success means defining a protocol that breaks the deception ambiguity. A "negative" success means proving that such a protocol is impossible under realistic assumptions. Both outcomes are highly valuable: the former provides a path forward for control research; the latter prevents wasted resources on untestable safety strategies.

  **Failure:** The project fails if it concludes inconclusively—that is, if it cannot determine whether the ambiguity is resolvable. Another failure mode is producing a framework that is too abstract to be useful for practical decision-making. The goal is actionable clarity, not just philosophical musing.

  **6. Timeline and Resources**
  **Scope:** 24 months.
  **Personnel:** One postdoctoral researcher (PI) with background in AI safety, formal logic, or game theory.

  *   **Months 1–6:** Literature review and formalization of the alignment/control distinction. Development of the adversarial evaluation model.
  *   **Months 7–18:** Core analysis. Testing existing control proposals against the model. Deriving impossibility results or validity conditions.
  *   **Months 19–24:** Drafting the Framework and working papers. Review and dissemination to funders and labs.

  **Budget Justification:** This project requires minimal compute resources. The primary cost is personnel time for deep conceptual work. The low overhead allows for a high-leverage investment: determining the viability of a major branch of safety research before significant capital is committed to it.
