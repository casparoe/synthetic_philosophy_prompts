      *   **The Pivot (Step 5):** Explain why (5) is false. The Criteria are not the only tools. Introduce Inference to the Best Explanation (IBE).
      *   **The Epistemological Pivot (Step 3):** Address the "variance implies no warrant" claim. Peer disagreement doesn't entail skepticism.
      *   **The Socrates Analogy:** Use this to show how general historiography works without the Criteria.
      *   **Conclusion:** Summarize the cost. We lose certainty/algorithmic simplicity, but we keep fallible knowledge.

  7.  **Final Review against User Constraints:**
      *   PhD level? Yes, keep it rigorous.
      *   Epistemology of testimony focus? Tie in testimonial chains and social memory.
      *   Address the classmate's attachment to (2)? Acknowledge (2) is mostly correct, which makes attacking (5) easier.
      *   Explain the cost? Yes.

  8.  *(Self-Correction during drafting)*: Make sure not to get too bogged down in NT specifics. Keep it philosophical. The user cares about the *structure of warrant*, not whether Jesus cleared the Temple.

