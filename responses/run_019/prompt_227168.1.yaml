  ### Where My Reasoning Goes Wrong

  Your worry stems from a crucial misinterpretation of the intuitionist stance. You wrote that intuitionists showed LEM "had been shown to be false," implying they proved $\neg(P \vee \neg P)$ for some specific $P$. This is incorrect. Intuitionists do not assert the negation of LEM; doing so would lead to absurdity even within their own system. Instead, they argue that LEM lacks universal *justification*. For Brouwer, mathematical truth requires a mental construction. Since we cannot always construct a proof for a proposition $P$ nor a refutation $\neg P$, we cannot assert $P \vee \neg P$ as a universal logical law. They reject LEM as an unwarranted assumption about infinite totalities, not as a falsehood proven within classical logic. Consequently, classical mathematics isn't "unsound" in the sense of containing contradictions; it is viewed as operating under different semantic assumptions about what constitutes existence and truth. The conflict isn't that one side proved the other wrong within a shared framework, but that they disagree on the framework itself. You are treating the disagreement as a factual dispute within one logic, rather than a divergence in logical standards. Classical logic assumes truth is binary; intuitionism assumes truth is constructed. Therefore, classical proofs remain valid within their own distinct framework. This resolves the apparent contradiction between the two schools.

  ### What Rejection Amounts To

  Within intuitionistic mathematics, the Law of Excluded Middle is not an axiom, nor is it a derivable theorem. Its status is that of an unprovable principle. It is vital to distinguish between rejecting a principle and proving its negation. Intuitionistic logic (formalized as Heyting Arithmetic) does not prove $P \vee \neg P$ for all $P$. However, it also does not prove $\neg(P \vee \neg P)$. In fact, intuitionistic logic proves $\neg\neg(P \vee \neg P)$, meaning it is impossible to prove that LEM is false. The rejection is methodological: one simply refuses to use inference rules that rely on LEM without a constructive justification. When intuitionists say LEM is "false," they often mean it is not universally valid in their semantic models, such as Kripke models or topological interpretations, where truth is temporal or spatial rather than binary. Thus, the law is not "disproved" in the sense of generating a contradiction; it is merely excluded from the toolbox of acceptable proofs. It remains a consistent addition if one wishes to add it as an axiom, but doing so moves one back to classical logic. The intuitionist stance is that adding it adds content not warranted by constructive evidence, rendering it inadmissible rather than contradictory. This ensures the system remains coherent without the law.

  ### How Constructivists Regard Classical Mathematics

  Constructivists do not view classical mathematics as a tower of falsehoods. Instead, they regard it as a coherent system consistent relative to constructive logic. Through the Gödel-Gentzen double-negation translation, every classical theorem can be translated into a constructive theorem. Essentially, a classical proof of $P$ becomes a constructive proof of $\neg\neg P$. Therefore, classical results are seen as stating that certain situations are not impossible, rather than asserting direct constructions. Constructivists engage with classical results because they contain deep structural insights valuable even if the ontological commitment to platonic existence is dropped. They study classical theorems to understand what additional constructive content is needed to upgrade them or to appreciate the boundaries of constructive reasoning. Classical mathematics is treated as a useful, consistent fragment of reasoning about ideal objects, worthy of respect but distinct from mathematics grounded in mental construction. It is not refuted; it is interpreted differently. Thus, both traditions coexist peacefully.

  ### A Concrete Illustration

  Consider the Intermediate Value Theorem. Classically, if a continuous function crosses from negative to positive, there exists a root $c$ where $f(c)=0$. The proof uses LEM to assert existence without providing a method. Constructively, this claim is rejected because we cannot always compute such a zero. However, constructivists prove that for any $\epsilon > 0$, we can find $c$ such that $|f(c)| < \epsilon$. The classical theorem asserts static existence; the constructive version asserts an approximable process. Both are meaningful, but only the latter provides an algorithm. The classical result claims more than constructive evidence supports. This exemplifies how classical existence differs from constructive finding.
