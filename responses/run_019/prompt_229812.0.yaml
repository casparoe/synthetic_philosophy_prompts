answer: |-
  ### 1. Sequence and Dependencies

  **Phase 1: The Gap in Functionalism (15 mins)**
  *   **Setup:** Briefly recap functionalism (mental states typed by causal role).
  *   **The Pivot:** Acknowledge that functionalism explains *type-identity* but leaves *content* (aboutness) unexplained. A state can play the "belief role" without specifying *what* it is a belief *of*.
  *   **The Causal Proposal:** Introduce the simplest naturalistic theory: $State\ S$ represents $Object\ O$ if $O$ causes $S$.
  *   **Board Work:** Draw a simple arrow: $World \rightarrow Brain\ State$.
  *   **Dependency:** Students must accept that naturalism requires content to be grounded in physical relations (like causation) before they can see why causation fails.

  **Phase 2: The Disjunction Problem (20 mins)**
  *   **The Problem:** Introduce error. Sometimes $S$ fires when $O$ is absent (illusion/hallucination).
  *   **The Dilemma:**
      1.  If content is *only* actual causes, error is impossible (every firing is veridical).
      2.  If we include error-causes in the content, content becomes disjunctive ($O \lor Error\text{-}Cause$).
  *   **The Normative Requirement:** To solve this, we need to distinguish between $S$ firing *correctly* and $S$ firing *incorrectly*.
  *   **Crucial Distinction:** You must establish the difference between **statistical regularity** (what *does* happen) and **normative standard** (what *should* happen). Without this, "misrepresentation" is just "rare representation," which is not error.
  *   **Board Work:** Expand the arrow to a fork: $Bat \rightarrow S$ (Good) vs. $Wind \rightarrow S$ (Bad?). If content is causal, content = $Bat \lor Wind$.

  **Phase 3: Etiological Function as the Norm (25 mins)**
  *   **The Move:** Introduce etiological function. A trait's function is what it was *selected for* by ancestral history.
  *   **Application:** $S$ represents $Bat$ because ancestors with $S$ survived *due to* detecting $Bats$.
  *   **Solving Disjunction:** When $Wind$ causes $S$, $S$ is malfunctioning. It is doing what it was not selected to do. The content is fixed by the *success conditions* of the past, not the *causal conditions* of the present.
  *   **Board Work:** Add a time dimension. $Past\ Selection \rightarrow Function \rightarrow Content\ Norm$.
  *   **Dependency:** This only works if students accept that "function" is historical, not dispositional.

  **Phase 4: The Price and Conclusion (15 mins)**
  *   **The Cost:** Content is now history-dependent. A molecule-for-molecule duplicate (Swampman) or a clone in a different environment might lack content or have different content.
  *   **Wrap-up:** Reiterate that "content is what it's for" works only because "what it's for" is fixed by history, creating the room for error.

  ---

  ### 2. The Carrying Example: The Moth's Evasive Dive

  **The Example:** A specific species of nocturnal moth possesses an auditory neuron ($N$) that triggers an evasive dive ($D$).
  *   **Normal Cause:** Bat echolocation calls ($B$).
  *   **Abnormal Cause:** Loud wind rustling or cricket chirps ($W$).
  *   **Outcome:** If $N$ fires at $B$, moth survives. If $N$ fires at $W$, moth wastes energy (or dives into danger).

  **Why this example:**
  1.  **Binary and Mechanical:** It isolates the *detector* mechanism from complex cognition. It is easy to draw on a whiteboard (Ear $\rightarrow$ Neuron $\rightarrow$ Wings).
  2.  **Clear Survival Value:** The link between the state and fitness is direct, making the "selection story" intuitive.
  3.  **Clear False Positives:** Wind/Crickets provide an obvious non-predator cause for the same neural firing.

  **Why avoid the standard candidates:**
  *   **Avoid Magnetotactic Bacteria:** Too microscopic and physics-heavy; students struggle to intuit "representation" in a single-celled organism aligning with magnetic fields. It feels more like physics than semantics.
  *   **Avoid Honeybee Waggle Dance:** Too complex. It involves communication semantics (sender/receiver) which introduces Gricean complications that distract from the core metaphysical problem of *individual* content.
  *   **Avoid the Frog (Fly Detector):** While classic, students often conflate the frog's visual "feature detection" with modern computer vision (causal correlation). The Moth example emphasizes *defense/survival* over *tracking*, making the normative "ought" (survive vs. die) sharper than the frog's "eat vs. don't eat."

  ---

  ### 3. Likely Misconceptions and Corrections

  **Misconception 1: "Proper function means what the trait usually does." (Statistical vs. Normative)**
  *   **When it appears:** Immediately upon introducing "function" in Phase 3.
  *   **How to head it off:** Before applying function to the moth, use a medical analogy on the board. *Heart:* Pumps blood (Function) vs. Makes thumping sounds (Side effect). Even if a heart makes more sound than pumps (pathology), its function remains pumping.
  *   **Correction:** Explicitly write on the board: **Function $\neq$ Frequency.** Function = Selected Effect.

  **Misconception 2: "Normal conditions are statistically average conditions."**
  *   **When it appears:** When discussing why Wind causing $N$ is an error. Students will argue, "But if wind happens 50% of the time, isn't it normal?"
  *   **How to head it off:** During the Phase 3 selection story. Emphasize the *ancestral* environment.
  *   **Correction:** "Normal" means *conditions under which the trait contributed to reproduction in the past*, not conditions as they are today. A sugar craving represents energy even if you are currently eating artificial sweetener.

  **Misconception 3: "The moth needs to know its history to have content."**
  *   **When it appears:** At the end, when discussing the "price" of the theory.
  *   **How to head it off:** Frame the history as something *we* (the theorists) use to fix the content, not something the moth accesses.
  *   **Correction:** "The history determines what the state *is*, not what the moth *thinks* about the history. The moth doesn't need a genealogy book; it needs the mechanism produced by that genealogy."

  ---

  ### 4. Final Assessment Question

  **The Question:**
  "Imagine we take a fertilized egg from our moth species and raise it in a sealed lab where there are **no bats**, only **wind** that triggers the neuron, and the moth survives to reproduce solely because the dive avoids lab fans. Its offspring inherit the neuron. According to the teleosemantic view we just discussed, what does the neuron represent in the *third generation* of these lab moths, and why?"

  **What a successful answer looks like:**
  The student must identify that the content remains **Bat** (or "Predator"), not Wind. They must explain that content is fixed by the *original* selection history (the ancestors in the wild), not the current utility or causal regularity in the lab. If they say "Wind" or "Nothing," they have lapsed into a causal or current-dispositional theory.

  ---

  ### 5. What to Refuse to Settle

  **The Indeterminacy of Selection:**
  *   **What to say:** "You might ask: Was the neuron selected for detecting *bats*, *ultrasonic sounds*, or *predators* generally? This is the 'Indeterminacy Problem.' It is a serious objection, but today we are assuming we *can* identify the function to see if it solves Disjunction. We are testing the engine, not the fuel."
  *   **Why:** Resolving this requires deep dive into genetics and levels of selection, which will consume the session and obscure the core link between function and normativity.

  **Novel Content (The Plastic Fly Problem):**
  *   **What to say:** "Does this theory allow us to represent things that didn't exist in the ancestral past, like plastic flies or smartphones? Teleosemantics has to work hard to explain this via 'derived functions.' We will park that for now to focus on how function handles *error*."
  *   **Why:** This is the most common student objection ("I can think about unicorns!"). Acknowledging it validates their intuition without derailing the specific lesson on the Disjunction Problem.

  ---

  ### Spine of the Sequence

  Etiological function solves the disjunction problem by using evolutionary history to establish a normative standard, allowing a state to be causally triggered yet representationally false.
