      *   **Tone:** Professional, precise, leveraging the user's domain expertise to illuminate the philosophical concepts.

  2.  **Deconstruct Austin (The Command Theory):**
      *   *Concept:* Sovereign issues a command -> Subject has a duty -> Sanction follows if duty is breached. They are one relation.
      *   *DB Analogy:*
          *   Sovereign = Database Administrator (DBA) / System Owner.
          *   Command = `INSERT/UPDATE` statement or Schema Definition.
          *   Duty = The state the data *must* be in.
          *   Sanction = Transaction Rollback / Exception Throw.
          *   One Relation = The Constraint Definition itself (e.g., `CHECK` constraint).
      *   *Refinement:* Austin says law *is* the command. In DB terms, the DDL (Data Definition Language) *is* the law. The execution is the conduct. The error is the sanction.

  3.  **Deconstruct Hart (The Concept of Law):**
      *   *Critique 1: Gunman Situation (Coercion).* Austin says law is force. Hart says law is authority.
          *   *DB Analogy:* A script that force-kills connections vs. a schema that applications *agree* to use.
      *   *Critique 2: Power-Conferring Rules.* Not all laws forbid things; some enable things (wills, contracts).
          *   *DB Analogy:* Stored Procedures or Views that *enable* complex operations rather than just blocking bad data. `GRANT` privileges.
      *   *Critique 3: Obligated vs. Obliged.* "Obliged" = forced (gunman). "Obligation" = rule-based.
          *   *DB Analogy:* A hardware failure forces a stop (obliged) vs. a Foreign Key constraint stops you because of a rule (obligation).
      *   *Critique 4: Internal Aspect.* Rules are accepted as standards of conduct.
          *   *DB Analogy:* This is the tricky one. Applications *coding against* the schema vs. the schema just existing. The ORM layer "believing" in the schema.
      *   *Critique 5: Primary vs. Secondary Rules.* Primary = conduct. Secondary = rules about rules (change, adjudicate, recognize).
          *   *DB Analogy:* Primary = Data Constraints. Secondary = Migration Scripts, Permission Tables, System Catalog metadata.

  4.  **Deconstruct Fuller (The Internal Morality):**
      *   *Concept:* Law must meet 8 procedural criteria to be "law." If it fails, it's not just bad law, it's not law.
      *   *DB Analogy:* System Reliability / API Contract / Schema Hygiene.
      *   *Mapping:*
          *   Generality = Applied to all rows/tables.
          *   Promulgation = Schema is published/accessible (`\d` in psql).
          *   Non-retroactivity = Migrations run forward, not rewriting history without versioning.
          *   Clarity = Column names/types are unambiguous.
          *   Non-contradiction = No conflicting `CHECK` constraints.
          *   Possibility of Compliance = Constraints must be satisfiable (no `CHECK (x > 5 AND x < 3)`).
          *   Constancy = Schema doesn't change every millisecond.
          *   Congruence = The DB enforces what the docs say it does.

  5.  **Drafting the Translation (Iterative Process):**

      *   *Austin:* Focus on the `TRIGGER` or `CONSTRAINT`. The "Command" is the DDL. The "Sanction" is the `RAISE EXCEPTION`. The "Duty" is the valid state.
      *   *Hart:* Focus on the difference between a `FOREIGN KEY` (constraint) and a `STORED PROCEDURE` (power conferring). Focus on the *System Catalog* as secondary rules. The "Internal Point of View" is the Application Logic trusting the Schema.
      *   *Fuller:* Focus on *Schema Design Best Practices* as constitutive of a working DB. If you violate them, the DB becomes unusable (not a DB).

  6.  **The Residue Report (Critical Analysis):**
      *   *What works:* Constraints, sanctions (errors), secondary rules (metadata/migrations).
      *   *What distorts:* The "Internal Point of View." A database doesn't "accept" rules; it executes code. The *users* (apps) accept them.
      *   *What fails:* Normativity. Why *ought* we obey? A DB just *does*. Legal theory is about justification; DB engineering is about mechanics.
      *   *User's Instinct:* Austin = `NOT NULL` trigger. Hart = "Wait, there are also `GRANT` statements and Migration Versioning." Yes, this is accurate.

  7.  **Refining the Vocabulary:**
      *   Ensure terms like "Transaction," "Rollback," "Schema," "Migration," "Constraint," "Trigger," "Privilege," "Catalog" are used correctly.
      *   Avoid philosophical jargon without DB translation.

  8.  **Final Review against Constraints:**
