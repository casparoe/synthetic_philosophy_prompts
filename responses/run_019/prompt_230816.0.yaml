      *   Did I cover Fuller? Yes (8 desiderata).
      *   Did I do the Residue Report? Yes.
      *   Did I answer the specific instinct question? Yes.

  9.  **Self-Correction/Nuance Check:**
      *   *Hart's Internal Aspect:* This is the hardest to map. A database has no consciousness. I need to frame this as the *Application Layer* or the *DBA* treating the schema as a standard, not just a physical barrier. It's the difference between a wall you hit and a rule you follow. In DB terms, it's the difference between a physical network partition (force) and a Permission Denied error (rule).
      *   *Fuller's "Not Law":* If a DB schema is too broken, is it still a schema? Yes, technically. But functionally it's noise. I need to make sure the analogy holds: If you violate Fuller's principles, the system ceases to function as a *reliable* system.

  10. **Final Polish:** Organize with clear headings. Use code blocks for DB examples to make it concrete. Ensure the tone is respectful of the user's expertise. (Proceed to generate output).

