  | **Prendick (Protagonist)** | Fully human capacities; fluctuating self-command (nearly reverts psychologically). | Psychological horror; isolation; fear of being eaten; existential dread. | Initially prey, then observer, then exile; alienated from both beasts and humans. | High; the moral center of the book, though his judgment is compromised by fear. | **Widens:** Prendick's suffering validates his humanity, but his empathy for the beasts widens his moral circle. | Prendick's revulsion often overrides his ethics; he admits he cannot look at the beasts without loathing, resisting a clean ethical stance. |
  | **The Reverted (Post-Moreau)** | Loss of speech; loss of upright posture; return to animal instincts. | Continued physical vulnerability; fear of Prendick; pain from injuries. | Hunted/Feared by Prendick; no longer governed by Law. | Ambiguous; they remain objects of pity but are treated as threats. | **Vindicates:** Their suffering persists despite the loss of "human" capacities, securing their status. | Prendick treats them with less moral weight once they revert, suggesting standing *does* drop with cognitive loss, contradicting Bentham. |
  | **London Humans (Ending)** | Full human capacities; social restraint. | Implicit suffering (war, poverty, struggle) seen through Prendick's eyes. | Prendick isolates himself from them; sees them as beasts in disguise. | High, but destabilized; their "humanity" is revealed as a performance. | **Widens:** If humans are just beasts holding back reversion, the moral boundary between species dissolves completely. | The ending suggests human status is a fragile construct, challenging Bentham's idea of a stable "insuperable line" based on sentience alone. |
