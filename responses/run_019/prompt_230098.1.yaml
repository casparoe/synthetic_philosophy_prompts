      *   *Modern Authenticity:* Charles Taylor's *The Ethics of Authenticity*. Inner voice, self-determination, shedding social masks.
      *   *The Clash:* Authenticity says "Look inward." Confucianism says "Look outward/relational."
      *   *Nuance:* Confucius *does* care about sincerity (*Cheng*). But *Cheng* isn't "being true to an inner essence"; it's "being true to the demands of the relationship."
      *   *The "Deforming Role" Problem:* If I am my roles, and a role is abusive (e.g., tyrannical father, oppressive minister), how do I justify leaving? Confucius does advocate remonstrance and even withdrawal (*Dao* not prevailing). How does that fit role ethics?

  3.  **Drafting the Argument - Section by Section:**

