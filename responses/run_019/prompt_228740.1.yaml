answer: |-
  ### Flowchart: Which View of Persistence Do You Hold?

  **Node 1 (The Hume Anchor):** Read the passage from Hume's *Treatise*. He claims we confuse "identity" (one thing staying the same) with "succession" (a series of related but different things). When you think about yourself yesterday versus yourself today, is that **one real thing persisting**, or just **a mental habit connecting two different moments**?
  *   **A:** It's a mental habit; strict identity over time is a fiction. → **Go to Leaf 1**
  *   **B:** It's one real thing; persistence is genuine. → **Go to Node 2**

  **Node 2 (The Changing Person):** You are sitting at noon and standing at 1 PM. How is this possible?
  *   **A:** The *whole* you is present at both times, simply changing properties. → **Go to Node 3**
  *   **B:** Different *parts* of you are present; the "noon-part" sits, the "1pm-part" stands. → **Go to Node 4**

  **Node 3 (The Statue and the Clay):** A lump of clay is shaped into a statue, then squashed. The clay survives, the statue does not. Are there **two objects** in the same place (statue + clay), or just **one object** described differently?
  *   **A:** Two objects (they have different survival conditions). → **Go to Leaf 2 (Endurantism)**
  *   **B:** One object (identity is strict). → **Go to Leaf 2 (Endurantism)**
  *(Note: Both routes land on Endurantism, though A is Constitution View and B is Dominant Kind.)*

  **Node 4 (The Road Analogy):** A road is straight in the valley and bent on the hill. Is the *whole road* bent and straight, or are *parts of the road* bent and straight? (Apply this to time).
  *   **A:** Parts have the properties; the whole road is just the collection. → **Go to Node 5**
  *   **B:** The whole road has the properties relative to locations. → **Go to Leaf 2 (Endurantism)**
  *(Note: If you chose Parts in Node 2 but Whole here, you may be an Endurantist using temporal modifiers.)*

  **Node 5 (The Existence of Past Parts):** Consider your baby-self. Does that part of you **exist right now** (located in the past), or did it **cease to exist** once you grew up?
  *   **A:** It exists now, just located in the past (Block Universe). → **Go to Leaf 3 (Worm Theory)**
  *   **B:** It ceased to exist; only the current slice is real (Presentism). → **Go to Leaf 4 (Stage Theory)**

  **Node 6 (The Fission Check):** If your brain halves are transplanted into two bodies, both waking with your memories, do **you** survive as both?
  *   **A:** No, identity cannot branch; survival is a matter of relation, not identity. → **Go to Leaf 4 (Stage Theory)**
  *   **B:** Yes, or one is chosen; the whole timeline determines identity. → **Go to Leaf 3 (Worm Theory)**

  ---

  ### The Leaves

  **Leaf 1: Humean Deflationist**
  *   **View:** Persistence is a fiction imposed by the mind on a succession of distinct existences.
  *   **Awkward Commitment:** You must explain why we plan for the future and fear death if the "person" who experiences those things won't strictly exist.

  **Leaf 2: Endurantism**
  *   **View:** Objects are wholly present at every moment of their existence.
  *   **Awkward Commitment:** You must explain how one thing can hold incompatible properties (sitting and standing) without contradiction, usually by adding invisible "at time t" modifiers.

  **Leaf 3: Perdurantism (Worm Theory)**
  *   **View:** Objects are extended spacetime worms composed of temporal parts.
  *   **Awkward Commitment:** You must accept that your birth and your death exist simultaneously in the block universe, making "change" an illusion of perspective.

  **Leaf 4: Stage Theory (Exdurantism)**
  *   **View:** Only the current instantaneous stage of an object exists; talk of persistence is about counterpart relations.
  *   **Awkward Commitment:** You must admit that you cease to exist every instant and are replaced by a new, numerically distinct entity who merely resembles you.

  ---

  ### Instrument Notes

  **Inseparable Leaves:**
  *   **Worm Theory vs. Stage Theory:** This tree struggles to separate them cleanly because they agree on the truth conditions of almost all ordinary sentences (e.g., "I was hungry yesterday"). The difference is purely ontological (what exists *now*), which intuitions often gloss over. Node 5 and Node 6 attempt to pry them apart, but students often slide between them.

  **Coherent but Unoccupied Combination:**
  *   **Perdurantism + Presentism:** Answering "Parts" (Node 2) but insisting "Only the present exists" (Node 5) without adopting Stage Theory's counterpart semantics. This is coherent but unstable; if only the present temporal part exists, you are effectively a Stage Theorist, yet many try to hold this view while keeping Worm Theory's identity conditions, leading to contradictions in fission cases.

  **Hume Analysis:**
  *   **Hume's Leaf:** Hume lands squarely in **Leaf 1 (Humean Deflationist)**. He explicitly calls the idea of identity over time a confusion ("confounded with each other") and argues the reality is merely a "succession of related objects."
  *   **Closet Perdurantist?** Calling the succession idea "as perfect a notion of diversity" makes him a **proto-Stage Theorist** rather than a perdurantist. Perdurantists typically want to *save* the concept of persistence by redefining it as a worm of parts; Hume thinks calling it "identity" or "persistence" is the error itself. He accepts the ontology of succession (stages) but rejects the semantics of persistence, so he is a closet eliminativist about persistence, not a closet perdurantist.

  This instrument sorts metaphysical intuitions into four canonical persistence views using concrete cases while flagging the ontological slimness between worm and stage theories.
