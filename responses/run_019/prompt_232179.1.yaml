  0.28

  In offering this figure, I attach the credence to the following specific reading: for any vague predicate $F$ and any object $x$ in a sorites series, the proposition $Fx$ possesses a determinate truth-value (true or false) fixed by the actual patterns of linguistic use, and our inability to identify the transition point is constitutively incapable of being remedied by further empirical or conceptual investigation.

  ### Decomposition of Credence

  To arrive at the final figure of 0.28, I have decomposed the proposition into four necessary conditions. I treat these as probabilistically independent for the sake of this calculation, multiplying the assigned probabilities.

  **1. The Logical Constraint ($P_L$): 0.90**
  *   **Question:** Is the preservation of classical logic and the principle of bivalence a theoretical virtue strong enough to override strong counter-intuitive consequences?
  *   **Justification:** Classical logic remains the default setting for formal semantics. Abandoning bivalence incurs significant costs regarding the T-schema and the behaviour of negation. While some paracomplete or paraconsistent approaches exist, the theoretical elegance of retaining classical logic provides a strong prior. However, I do not assign 1.0 because the cost of accepting sharp boundaries is high enough that one might reasonably reject bivalence as the lesser evil.

  **2. The Metasemantic Claim ($P_M$): 0.65**
  *   **Question:** Could the totality of our actual linguistic use and non-linguistic facts fix a sharp boundary for a vague predicate, even if no speaker is aware of it?
  *   **Justification:** This is the crux of the Williamsonian defence. It relies on a causal or externalist metasemantics where reference is determined by factors potentially opaque to the speaker (e.g., reliability constraints on knowledge). While coherent, it conflicts with the internalist intuition that meaning is determined by our normative dispositions to apply terms. If meaning is grounded in communal agreement or assertibility conditions, a sharp boundary fixed beyond our ken is metaphysically impossible. I assign a moderate probability because externalist metasemantics is viable, but far from established.

  **3. The Higher-Order Vagueness Advantage ($P_H$): 0.75**
  *   **Question:** Does epistemicism handle higher-order vagueness (the vagueness of the boundary itself) better than semantic-indecision accounts?
  *   **Justification:** Epistemicism has a distinct advantage here. If vagueness is ignorance, higher-order vagueness is simply ignorance about where the boundary lies, which is of the same kind as first-order ignorance. Supervaluationism, conversely, struggles to define the set of 'admissible precisifications' without invoking a sharp boundary for admissibility, risking a regress. Epistemicism avoids this regress more cleanly, warranting a higher probability.

  **4. The Failure of Alternatives ($P_A$): 0.65**
  *   **Question:** Are the primary rivals (supervaluationism, degree theories, contextualism) sufficiently flawed to make epistemicism the best remaining option?
  *   **Justification:** Supervaluationism faces the 'truth-value gap' problem (it renders 'Either $x$ is a heap or $x$ is not a heap' true, but neither disjunct true, which is awkward). Degree theories struggle with the 'connectivity' problem (why does truth drop by exactly this amount?). Contextualism explains away the paradox but often fails to account for the stability of vague terms across contexts. However, these rivals are not definitively refuted, preventing a higher probability.

  **Calculation:**
  $$0.90 \times 0.65 \times 0.75 \times 0.65 = 0.2851875 \approx 0.28$$

  ### Sensitivity Analysis

  My credence is most sensitive to **$P_M$ (The Metasemantic Claim)**.

  If one concludes that linguistic use *cannot* fix a sharp boundary without speakers being able, in principle, to recognise it, epistemicism collapses immediately regardless of the advantages in logic or higher-order vagueness. This is the upstream constraint.

  **Evidence to move the credence:**
  *   **Upward:** A robust derivation of sharp boundaries from a naturalistic theory of content (e.g., a successful integration of teleosemantics or causal reference theory) that demonstrates how usage patterns mathematically necessitate a cutoff point without appealing to speaker knowledge.
  *   **Downward:** A convincing argument that normative constraints on meaning (e.g., that to mean something by a term one must be able to distinguish its extension from its complement in borderline cases) are constitutive of intentionality. If meaning is essentially tied to discriminative ability, $P_M$ drops towards zero.

  ### Locating the Disagreement

  The gap between your assessment (0.15) and your colleague's (0.7) most plausibly lives in **$P_M$ (The Metasemantic Claim)**, closely followed by **$P_L$ (The Logical Constraint)** regarding bivalence specifically.

  To explain your colleague's 0.7, she must be assigning probabilities near 0.9 across all four terms ($0.9^4 \approx 0.65$). She likely views the metasemantic claim not as a contingent possibility but as a consequence of a correct theory of reference, and she likely views bivalence as non-negotiable.

  To explain your 0.15, you are likely assigning a very low probability to **$P_M$**. As a supervaluationist, you presumably hold that 'semantic indecision' is the correct description of vagueness; this entails that use *does not* fix a sharp boundary. If you assign $P_M \approx 0.2$ (believing it is highly unlikely use fixes a sharp line), the calculation drops precipitously ($0.9 \times 0.2 \times 0.75 \times 0.65 \approx 0.08$), requiring you to be slightly more optimistic about the failure of alternatives or logic to reach 0.15.

  While you might also differ on $P_L$ (since supervaluationists reject bivalence while preserving validity), the *reason* you reject bivalence is that you reject the metasemantic claim that boundaries are sharp. Therefore, the fundamental divergence is metasemantic: your colleague believes use determines a sharp cutoff; you believe use determines a range of admissible precisifications. Resolving whether linguistic practice can fix a boundary unknown to speakers is the key to bridging your disagreement.
