  I am a doctoral student in philosophy of language, and I have been arguing with a colleague about what a satisfying resolution of the sorites must look like. My working view is that some supervaluationist account is probably correct: a sentence containing a vague predicate such as 'heap' or 'bald' is true just in case it is true on every admissible precisification, so borderline predications are neither true nor false, even though classical tautologies and inferences are still validated. My colleague is drawn instead to epistemicism: she takes it that 'heap' has a fully sharp boundary fixed by our actual use, that every sorites series contains a last heap followed immediately by a first non-heap, and that our inability to locate the boundary is a matter of irremediable ignorance rather than semantic or metaphysical indeterminacy. I would currently put my credence in epistemicism at about 0.15 and in the supervaluationist family at about 0.6, with the remainder spread over degree-theoretic and contextualist options; she would put her credence in epistemicism at about 0.7.

  What I would like from you is a number, not a survey of the landscape. Consider the proposition that epistemicism about vagueness is true in roughly this sense: for any vague predicate F and any candidate object x, either Fx is true or Fx is false, so that every sorites series has a sharp last-F/first-not-F transition, and any failure on our part to locate that transition is purely epistemic. If you find the proposition ambiguous in a respect that matters, specify the reading to which your credence attaches. Please decompose your credence: identify the main sub-questions it rests on—for instance, the prior that classical logic and bivalence should be preserved; whether a use-based metasemantics could fix a sharp boundary no speaker could in principle locate; whether higher-order vagueness tells more heavily against semantic-indecision views than against epistemicism; and how much weight should go to the alternatives—assign a rough probability to each with a line of justification, and show how you combine them into the final figure. Then tell me which single sub-question your credence is most sensitive to, and what argument or evidence would move it most, and in which direction.

  Finally, given the gap between my assessment and my colleague's, try to locate where our disagreement most plausibly lives: which term in the decomposition would have to differ between us to explain her 0.7 and my 0.15? Please answer in British English.
