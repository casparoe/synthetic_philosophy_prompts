prompt: |-
  I'm on the finance committee of a mid-sized city council, and we've been handed a plan for a new light rail line: consultants project 4 years and 900 million, and their report dismisses comparisons to other cities' cost overruns as "not applicable to our local context." I've been reading about reference class forecasting -- the idea that you should anchor your estimate on what actually happened in similar past projects, not on the plan sitting in front of you -- and I'm inclined to push back, since our own last three big projects all came in at least 60% over budget and a year late. Write the short memo I'll circulate before the vote: recommend whether we approve the budget as proposed, approve a re-based budget built from the reference class of comparable rail projects, or send it back for more study. Include a concrete standing procedure the committee could adopt going forward (something like an "optimism premium" that gets added to every future proposal unless the proposer can argue their way out of it), and take the consultants' "our project really is different" argument seriously rather than just brushing it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Finance Committee of a mid-sized city council.
      *   **Audience:** Other committee members and potentially the City Council.
      *   **Topic:** New light rail line proposal ($900M, 4 years).
      *   **Conflict:** Consultants claim no cost overruns ("not applicable to local context"), but local history shows 60% overruns + 1 year delay on last three big projects.
      *   **Concept:** Reference Class Forecasting (RCF).
      *   **Task:** Write a short memo recommending a course of action (Approve, Re-base, or Send Back) + Include a concrete standing procedure for future projects (e.g., "optimism premium").
      *   **Tone:** Professional, persuasive, fiscally responsible, respectful but firm.
      *   **Specific Constraint:** Take the consultants' "our project is different" argument seriously (don't just dismiss it).

  2.  **Determine the Recommendation:**
      *   *Option A (Approve as proposed):* Too risky given local history and RCF principles. Irresponsible for a Finance Committee.
      *   *Option B (Re-base budget immediately):* Difficult to do without more data. What are the "comparable rail projects"? Need to define the reference class first.
      *   *Option C (Send back for more study/adjustment):* This is the most prudent path. It allows for RCF application without killing the project outright. It forces the consultants to justify the deviation from the norm.
      *   *Decision:* Recommend conditional approval pending a risk-adjusted budget based on Reference Class Forecasting. Effectively, "Send back for re-basing with specific guidelines."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the value of the project but highlight the fiscal risk.
      *   **The Core Argument (RCF vs. Inside View):** Explain Reference Class Forecasting simply. Contrast the consultants' "inside view" (project specifics) with the "outside view" (historical data).
      *   **Addressing the Consultants' Claim:** This is a key constraint. I need to acknowledge that *maybe* this project *is* different. How? By shifting the burden of proof. If they say it's different, they must quantify *why* and provide evidence, not just assertions.
      *   **Local Context:** Bring in the city's own track record (60% over, 1 year late). This makes it personal and immediate, not just abstract theory.
      *   **Recommendation:** Don't approve the $900M. Approve a *range* or require a *risk-adjusted* figure. Let's go with requiring a risk-adjusted budget before final appropriation.
      *   **Standing Procedure:** The "Optimism Premium" or "Risk Contingency." Let's call it a "Reference Class Contingency." It starts high (based on history) and can be reduced only with evidence.
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
      *   Avoid accusatory language ("The consultants are lying").
      *   Use collaborative language ("We need to ensure," "Fiduciary duty," "Robust planning").
      *   Ensure the "our project is different" point is handled fairly. *Argument:* "We welcome the argument that we are different, but it requires evidence, not just assertion."

  5.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Recommendation on Light Rail Budget & Forecasting Protocol."
      *   *Intro:* We need to talk about the $900M figure.
      *   *The Problem:* The consultants say no overruns. Our history says 60% overruns. RCF says trust history.
      *   *The "Different" Argument:* I need to write a paragraph specifically validating their point but demanding proof. "Uniqueness is a claim, not a guarantee."
      *   *The Procedure:* Let's propose a "Base + Risk" model. Base is the engineer's estimate. Risk is the RCF percentage (e.g., 40-60% based on local history).
      *   *Recommendation:* Do not vote on the $900M today. Vote to require a Risk-Adjusted Budget.

  6.  **Review against Constraints:**
      *   Short memo? Yes, keep it under 2 pages equivalent.
      *   Recommend one of the three options? Yes (Send back/Re-base).
      *   Include standing procedure? Yes (The "Optimism Premium").
      *   Take consultants' argument seriously? Yes (Burden of proof section).

  7.  **Final Polish:** Check for clarity, impact, and political viability. (Self-Correction: Make sure I don't sound like I'm killing the rail line. I'm saving it from becoming a budget black hole.) *Adjustment:* Emphasize that accurate budgeting protects the project from cancellation mid-stream.

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Finance Committee & City Council
  **FROM:** [Your Name], Finance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Light Rail Budgeting & Future Forecasting Protocol

  **Purpose**
  This memo outlines my recommendation regarding the proposed $900 million budget for the new Light Rail Line. While I support the strategic goal of expanding transit, I cannot recommend approving the current budget figure. Instead, I propose we return the proposal for a risk-adjusted re-basing and adopt a new standing procedure for capital project forecasting.

  **The Forecasting Discrepancy**
  The consultants' report projects a 4-year timeline and $900 million cost, explicitly dismissing historical cost overruns from other cities as "not applicable to our local context." This relies on an "inside view" focused on project specifics. However, **Reference Class Forecasting (RCF)** dictates we anchor estimates on the "outside view"—the actual outcomes of similar past projects.

  We must take the consultants' claim seriously: it is possible our project management, geology, or procurement processes have improved. However, uniqueness is a claim that requires evidence, not an assumption that grants immunity from history. Currently, the burden of proof is reversed. We are asked to assume this project is exceptional without data proving why the systemic risks that affected peer cities (and our own city) have been neutralized.

  **Local Context**
  We cannot ignore our own track record. Our last three major capital projects exceeded budgets by an average of 60% and missed timelines by at least one year. To approve a $900 million budget without accounting for this local variance is fiscally irresponsible. It sets the project up for failure, risking mid-construction stoppages or emergency appropriations that crowd out other essential services.

  **Recommendation**
  I move that we **return the budget for re-basing** using a Reference Class Forecasting model. We should not vote on the $900 million figure. Instead, we should authorize a **Risk-Adjusted Budget** that includes a contingency derived from the performance of comparable rail projects and our own municipal history.

  **Proposed Standing Procedure: The "Optimism Premium"**
  To prevent this issue in future capital planning, I propose the committee adopt the following forecasting protocol effective immediately:

  1.  **Dual-Track Budgeting:** All major capital proposals (> $50M) must submit two figures: the *Engineered Estimate* (current standard) and the *Risk-Adjusted Estimate*.
  2.  **Default Optimism Premium:** The *Risk-Adjusted Estimate* must automatically include a contingency percentage based on the reference class of similar projects (e.g., if similar rail projects average 40% overruns, the baseline premium is 40%).
  3.  **Burden of Proof for Reduction:** Proposers may argue for a lower premium, but they must provide quantitative evidence of specific risk mitigations (e.g., fixed-price contracts, completed geotechnical surveys) that demonstrably lower the risk profile below the historical average.

  **Conclusion**
  Adopting RCF does not mean we reject the light rail line; it means we commit to funding a project that actually gets finished. By approving a re-based budget and institutionalizing the "Optimism Premium," we protect the city's credit rating and ensure that when we break ground, we have the funds to cross the finish line.

  I look forward to discussing this framework at the next session.
