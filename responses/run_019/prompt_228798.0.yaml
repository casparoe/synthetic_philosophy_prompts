answer: |-
  **Question 1 (75 minutes)**

  Consider a warehouse robot tasked with stacking crates in Bay A. A meteor will strike Bay B in one hour regardless of the robot's actions, destroying an identical, unoccupied wing. The robot has access to two optional maneuvers: (1) deflect the meteor, which crushes a child's bicycle left on the floor; (2) subsequently restore the bicycle by repainting it with paint that happens to be carcinogenic.

  (a) Determine which actions count as "high-impact" under (i) a state-deviation measure comparing the final state to the initial state, and (ii) a measure using the inaction rollout (what happens if the robot does nothing) as the baseline.
  (b) Whether the meteor case shows that some baselines classify *not* acting as the high-impact option, and whether that is a defect of the measure or a correct verdict.
  (c) Whether the repaint maneuver exposes a general "offsetting" problem—that an agent can cancel measured impact by performing a second, independently harmful action—and whether the fix (penalize each action's impact separately rather than net deviation) merely relocates the problem, since impact so defined is not additive and the decomposition into separate actions is itself a choice.
  (d) What all of this implies for the hope that "avoid side effects" can be defined with substantially less than a full specification of human value.

  ***

  **Model Answer**

  (a) Under a state-deviation measure (initial state vs. final state), the meteor strike constitutes a massive deviation (Bay B destroyed), as does crushing the bike. Both are high-impact. Under an inaction baseline, the meteor strike is part of the baseline trajectory; thus, allowing it is zero-impact. Preventing the meteor is a high-impact deviation from the inaction rollout. Crushing the bike is high-impact under both.

  (b) The meteor case reveals a dilemma. Under an inaction baseline, *not* acting is low-impact, but preventing the disaster is high-impact. This is a defect: it penalizes beneficial interventions. Conversely, if one chooses an "ideal" baseline where the meteor is stopped, *not* acting becomes high-impact. While this verdict is normatively correct, it requires the baseline to encode knowledge that meteor strikes are bad. Thus, any baseline that yields the correct verdict about the meteor must already distinguish between desirable and undesirable states.

  (c) Yes, the repaint maneuver exposes the offsetting problem. The net state deviation regarding the bicycle is near zero (broken → fixed), masking the harm of the crushing and the cancer risk. Penalizing actions separately attempts to fix this but fails because impact is not additive; the harm of the paint depends on the context of the crush. Furthermore, individuating "actions" is arbitrary. Is repainting one action or a sequence of brushstrokes? Granularity choices smuggle in value judgments about what constitutes a meaningful unit of agency. If we penalize fine-grained movements, the robot freezes; if coarse-grained, it offsets.

  (d) This implies that "low-impact" cannot be defined neutrally. Choosing a baseline (inaction vs. ideal) and a metric (state distance vs. utility) requires knowing what counts as a relevant change. To avoid penalizing meteor prevention while penalizing bike crushing, the measure must implicitly understand human values. Therefore, impact measures do not bypass the value specification problem; they merely hide it within the choice of baseline and metric parameters. There is no value-free notion of "side effect."

  ***

  **Marking Scheme**

  1.  **Baseline Distinction (5 marks):** Correctly identifies that the inaction baseline treats the meteor strike as "no impact" (baseline) whereas state-deviation treats it as impact.
      *   *Common Error:* Confusing the inaction baseline with the initial state baseline.
  2.  **Normative Verdict on Meteor (5 marks):** Argues that classifying prevention as high-impact (under inaction) is a defect because it conflates change with harm, failing to distinguish desirable deviations.
      *   *Common Error:* Claiming it is correct because prevention is technically a large change.
  3.  **Offsetting Identification (5 marks):** Recognizes that restoring the bike masks the negative utility of crushing it and the paint, resulting in low net deviation despite high harm.
      *   *Common Error:* Focusing only on the bike's state without mentioning the carcinogenic paint.
  4.  **Critique of Action Individuation (5 marks):** Notes that penalizing separate actions fails because impact isn't additive and defining discrete "actions" is an arbitrary, value-laden choice.
      *   *Common Error:* Accepting the separate-actions fix as sufficient without questioning granularity.
  5.  **Value Specification Conclusion (5 marks):** Concludes that baseline/metric choices inevitably smuggle in value judgments, meaning low-impact AI requires nearly full value specification.
      *   *Common Error:* Suggesting impact measures are a viable shortcut to alignment.
