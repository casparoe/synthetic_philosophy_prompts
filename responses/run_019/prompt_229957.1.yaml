      *   *Tone:* Academic, precise, helpful for a seminar setting.

  9.  **Final Polish:** Check against specific constraints: "how possible worlds get compared," "whether each local evil has to be necessary," "best overall vs. best in every part," "description vs. demand." Ensure each is addressed in the menu items. (I will integrate these dimensions into the menu items rather than making them separate headers, to make the "menu" more usable).

