      *   Group A: Full Info, No Pressure.
      *   Group B: Full Info, High Pressure.
      *   Group C: Bad Info, High Pressure.
      *   This might be too complex to manage in 25 mins.
      *   *Simpler:* Two Groups. "Privileged" and "Precarious."
      *   Privileged: Start Round 3 with 20 tickets.
      *   Precarious: Start Round 3 with 5 tickets.
      *   Rule: If you end with <10 tickets, you get 0 prizes.
      *   Choice: Gamble (50/50 +/- 10) or Stay.
      *   Precarious *must* gamble to have a chance. Privileged gamble for fun.
      *   Both lose. Vote on compensation.
      *   This works. It uses the "Carry Over" from previous rounds to create the status difference naturally.

      *Okay, locking in the "Carry Over" design.* It creates a narrative arc.
      *   Round 1: Random loss (Creates Precarious class).
      *   Round 2: Voluntary Gamble (Everyone chooses).
      *   Round 3: Reveal the link.
      *   *Wait, I need the destabilization to happen IN the game, not just in the reveal.*
      *   Okay, Round 3 needs to be a *new* decision where the constraints are visible *before* the vote.
      *   Okay:
      *   Round 1: Random Loss. (Some lose 10 points). Vote on Tax.
      *   Round 2: Voluntary Gamble. (All can choose). Vote on Tax.
      *   Round 3: "The Recovery Round." Those who lost in Round 1 are offered a "Recovery Gamble" (High risk). Those who didn't lose are offered a "Growth Gamble" (Low risk). Both lose. Vote on Tax.
      *   *Critique:* Too complicated.
      *   *Back to the "Information/Constraint" asymmetry.*
      *   Round 1: Brute Luck.
      *   Round 2: Option Luck.
      *   Round 3: The "Fairness" Check. Before the gamble, distribute "Handicap Cards." Some say "You must gamble." Some say "Odds are 40/60." Keep it secret until after the loss.
      *   *Yes.* Secret constraints revealed *after* the outcome but *before* the compensation vote. This forces the re-evaluation.

      *Final Plan Structure:*
      1.  **Intro:** No theory. Just rules.
      2.  **Round 1 (The Storm):** Random loss. Vote. (Intuition: Compensate).
      3.  **Round 2 (The Casino):** Voluntary risk. Vote. (Intuition: Don't Compensate).
      4.  **Round 3 (The Rigged Table):** Voluntary risk, *but* reveal hidden constraints after the loss (e.g., some were forced, some had bad odds). Vote. (Intuition: Conflict).
      5.  **Debrief:** Map to Dworkin/Critique.

      *Let's write it.*
answer: |-
  # Session Plan: The Luck Egalitarianism Simulation
  **Course:** Upper-Level Political Philosophy Seminar  
  **Class Size:** 15 Students  
  **Duration:** 90 Minutes  
  **Topic:** Luck Egalitarianism (Dworkin's Distinction and its Critiques)  
  **Pedagogical Goal:** To viscerally experience the intuitive appeal of the brute/option luck distinction, and then experience its instability when background conditions are scrutinized.

  ---

  ## 1. Materials & Setup
  *   **Currency:** 150 Poker Chips or printed "Credit Slips" (value doesn't matter, only relative amount).
  *   **Prize:** A tangible reward for the end of class (e.g., a $20 coffee gift card, a box of high-quality chocolates, or 5 bonus points on the final paper). Inform students that chips convert to raffle tickets/points at the end.
  *   **Dice:** 3 six-sided dice.
  *   **Handouts:** 
      *   15 "Private Status Cards" (sealed envelopes) for Round 3.
      *   Whiteboard/Projector for tracking total class wealth.
  *   **Room:** Chairs arranged in a single circle or U-shape to facilitate debate.

  ---

  ## 2. Session Sequence (90 Minutes)

  ### Introduction (5 Minutes)
  *   **Facilitator Script:** "Welcome. Today is not a lecture. It is a simulation of a society. You are citizens. Your goal is to maximize your personal wealth (chips), which will be converted into [Prize] at the end. However, this society has a democratic mechanism: after every economic round, you will vote on whether to tax the winners to compensate the losers. There are no right answers, only collective decisions. I will not explain the philosophy until the very end. Do not discuss strategy during the voting phases."
  *   **Distribution:** Give every student **10 Chips** as a starting endowment.

  ### Phase 1: The Storm (Brute Luck Intuition) — 20 Minutes
  *   **The Event:** Tell the class: "A natural disaster has struck this society. It is random and unavoidable."
  *   **Mechanism:** Ask every student to roll one die. 
      *   **Roll 1 or 2:** You lose 5 chips (The Victims).
      *   **Roll 3–6:** No change (The Unaffected).
  *   **The Vote:** Ask the class to vote on a **Tax Rate** (0% to 50%). 
      *   *Rule:* The tax is taken from those who *did not* lose chips (The Unaffected) and distributed equally among those who *did* lose chips (The Victims).
      *   *Process:* Facilitator asks for a show of hands for 0%, 10%, 20%... up to 50%. Take the plurality. Execute the transfer immediately.
  *   **Expected Outcome:** Most students will vote for significant redistribution. The loss was unchosen.
  *   **Facilitator Note:** Do not comment on *why* they voted that way. Simply record the result and distribute chips.

  ### Phase 2: The Casino (Option Luck Intuition) — 20 Minutes
  *   **The Event:** Tell the class: "The economy has opened a new investment market. This is purely voluntary."
  *   **Mechanism:** Each student chooses **Safe** or **Risky**.
      *   **Safe:** Keep your current chips.
      *   **Risky:** Roll one die. 
          *   **Roll 1–3:** Gain 5 chips.
          *   **Roll 4–6:** Lose 5 chips.
  *   **Action:** Students declare choice publicly (raise hand). Then rollers execute.
  *   **The Vote:** Ask the class to vote on a **Tax Rate** to compensate the *Risky Losers*. 
      *   *Rule:* Tax is taken from *Risky Winners* and *Safe* players, distributed to *Risky Losers*.
  *   **Expected Outcome:** Resistance to redistribution. Students will argue the losers chose the risk.
  *   **Facilitator Note:** If the vote is close, ask one student from each side for a *one-sentence* justification before finalizing the rate. (e.g., "Why tax?" "Why not?"). Record the rate, execute transfer.

  ### Phase 3: The Rigged Table (Destabilizing the Distinction) — 25 Minutes
  *   **The Setup:** Tell the class: "We enter a new economic phase. Again, you may choose Safe or Risky. The stakes are higher: +/- 10 chips."
  *   **The Hidden Variable:** Before they choose, hand out the **Private Status Cards** (sealed). 
      *   **Group A (5 students):** Card says *"Standard Citizen. Odds are 50/50. Choice is fully voluntary."*
      *   **Group B (5 students):** Card says *"Precarious Citizen. If you choose Safe, you are fined 5 chips automatically. You must gamble to avoid loss. Odds are 50/50."*
      *   **Group C (5 students):** Card says *"Disadvantaged Citizen. Choice is voluntary. However, your odds are 30% Win / 70% Lose. You are not told this."*
  *   **Action:** Students make their choice (Safe/Risky) privately on a slip of paper to hide Group B's coercion. Collect slips. Execute rolls for those who chose Risky.
  *   **The Reveal:** Before the vote, announce: "Before you vote on compensation, I must reveal the background conditions of this round." Read the contents of the three cards aloud to the whole class.
  *   **The Vote:** Vote on a **Tax Rate** to compensate the *Losers*.
      *   *Crucial Tension:* Group B losers were coerced (necessity). Group C losers were deceived (unfair odds). Group A losers took a fair gamble.
      *   *Complication:* The pot for compensation comes from *everyone* (including Group A winners).
  *   **Expected Outcome:** Conflict. The clean "Choice = No Compensation" rule from Phase 2 breaks down. Some "choices" look like brute luck.
  *   **Facilitator Note:** Allow 2 minutes of open debate before the vote. Let them struggle with the categorization. Execute the transfer.

  ### Debrief & Theoretical Mapping (20 Minutes)
  *   **Transition:** "Stop the simulation. We are no longer citizens; we are philosophers. What just happened?"
  *   **Step 1: Naming the Intuition (5 mins)**
      *   Ask: "Why did you vote to help in Phase 1 but not Phase 2?"
      *   **Theory:** Introduce **Ronald Dworkin**. Explain **Brute Luck** (Phase 1: unchosen misfortune) vs. **Option Luck** (Phase 2: deliberate gamble).
      *   **Point:** Luck Egalitarianism argues justice requires neutralizing brute luck, but respecting option luck. This preserves equality while respecting responsibility.
  *   **Step 2: The Destabilization (10 mins)**
      *   Ask: "What changed in Phase 3? Why was it harder to vote?"
      *   **Theory:** Introduce the Critique (e.g., **Elizabeth Anderson, Samuel Scheffler**).
      *   **Point:** The boundary between brute and option luck is not a brute fact; it is a normative judgment. 
          *   *Group B (Necessity):* Was it a "choice" if the alternative was a penalty? (The "Real Option" problem).
          *   *Group C (Information):* Was it a "fair gamble" if the odds were hidden? (The "Epistemic" problem).
          *   *Group A (Risk Tolerance):* Even if everything was fair, is the *taste for risk* itself a matter of luck? (The "Endowment" problem).
      *   **Conclusion:** To call something "Option Luck" is to say the background conditions were *just enough* to hold the person responsible. That judgment relies on prior normative commitments about what counts as a fair starting place.
  *   **Step 3: Closing (5 mins)**
      *   Summarize: Luck egalitarianism tries to separate choice from circumstance. The simulation shows that circumstance permeates choice.
      *   Distribute the Prize (raffle or equal split depending on class mood).

  ---

  ## 3. Scoring & Payout Scheme
  *   **Participation:** All students receive full participation credit regardless of chip count (to avoid grade anxiety skewing the philosophy).
  *   **The Prize:** 
      *   *Option A (Egalitarian):* Ignore chip counts. Raffle all chips for one prize. 
      *   *Option B (Meritocratic):* Top 3 chip holders get a small candy bar.
      *   *Recommendation:* Use **Option A** but announce it *after* the game. If students think chips = grade, they will act defensively. If chips = raffle tickets, they play more naturally.
      *   *Alternative:* Simply destroy the chips at the end. "The simulation is over." This emphasizes the theoretical point over the material stake. (Recommended for philosophy seminars to reduce noise).

  ---

  ## 4. Predictable Failure Modes & Steering
  **Failure Mode 1: The Hard Egalitarians.**
  *   *Symptom:* The class votes to redistribute 50% in Phase 2 (The Casino), arguing "everyone should end equal."
  *   *Steer:* Do not correct them. In the debrief, ask: "If you voted to compensate the gamblers in Phase 2, does responsibility matter at all? If I burn my own house down for fun, should insurance pay me?" This highlights the cost of ignoring the choice/circumstance cut.

  **Failure Mode 2: The Hard Libertarians.**
  *   *Symptom:* The class votes 0% tax in Phase 1 (The Storm).
  *   *Steer:* In the debrief, ask: "In Phase 1, did the victims choose the dice roll? If justice is only about non-interference, why do we have disaster relief in the real world?" This highlights the cost of ignoring brute luck.

  **Failure Mode 3: Phase 3 Confusion.**
  *   *Symptom:* Students focus on the math of the transfer rather than the fairness of the choice.
  *   *Steer:* During the Phase 3 debate, intervene only to ask: "Does Group B's card change whether their loss was a 'choice'?" Keep the focus on agency, not arithmetic.

  **Failure Mode 4: Running Long.**
  *   *Steer:* If Phase 2 debate drags, cut the voting options. "We are voting on 0% or 30%. Show of hands." Keep the momentum toward Phase 3, which is the pedagogical core.

  ---

  ## 5. Limitations & Facilitator Notes
  **What the Game Cannot Reproduce:**
  1.  **Structural Oppression:** The game simulates inequality as discrete "cards." Real-world brute luck (race, class, gender) is continuous, systemic, and interacts with social stigma in ways chips cannot capture.
  2.  **The "Cut" is Not Binary:** In reality, brute and option luck are entangled (e.g., smoking is a choice, but addiction and stress are circumstances). The game presents them as distinct rounds to make the point, which risks oversimplifying the critique.
  3.  **The "Taste for Risk" Problem:** The game hints at this in Phase 3 (Group C), but it doesn't fully explore whether being a "risk-taker" is itself bad brute luck (genetic/psychological). You must supply this in the debrief.

  **Facilitator Responsibility:**
  *   **Neutrality:** You must not signal which vote is "correct" during the game. Your silence is the canvas for their intuition.
  *   **The Pivot:** The success of the session rests entirely on the Debrief. You must explicitly connect their frustration in Phase 3 to the philosophical literature. Without the debrief, it is just a card game.
  *   **Ethical Check:** Ensure students know the chips are not real money and their grade is not at risk. Anxiety kills philosophical reflection.

  **Post-Game Assignment (Optional):**
  *   "In 500 words, identify one moment in the simulation where you changed your mind about what counted as a 'choice.' Connect this to Dworkin's distinction and one critique discussed in class."
