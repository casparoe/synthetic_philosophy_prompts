answer: |-
  # MORAL COMMITMENT DECISION PROCEDURE

  ## SECTION A: DID WE MAKE A PROMISE-LIKE COMMITMENT?
  *Goal: Distinguish a moral promise from a prediction, hope, or politeness.*

  **Step 1: Analyze the Language**
  *   **Question:** Did the speaker use performative verbs or definitive future tense ("We will," "We promise," "You are approved") rather than probabilistic language ("We hope," "Likely," "Intend to," "Good chance")?
  *   **Pass:** Definitive language used.
  *   **Fail:** Probabilistic or vague language used. → **STOP.** No promise exists. Treat as relationship management.
  *   **[JUDGMENT CALL]:** If language is ambiguous (e.g., "We'll fund this next cycle"), proceed to Step 2. Ambiguity counts as a pass only if the speaker knew the recipient needed certainty.

  **Step 2: Assess Speaker Authority**
  *   **Question:** Did the speaker have actual authority (Program Officer, Executive Director) or *apparent* authority (Board Member, Major Donor) to speak for the foundation in that setting?
  *   **Pass:** Speaker holds actual authority OR holds a title/role where a reasonable outsider would believe they speak for the foundation.
  *   **Fail:** Speaker is a volunteer, guest, or staff without grantmaking authority, and no reasonable person would assume otherwise. → **STOP.** No promise exists.
  *   **[JUDGMENT CALL]:** "Apparent authority" is a values question. Does your foundation care more about internal protocol or external perception? If you prioritize external perception, count Board Members as having apparent authority even in social settings.

  **Step 3: Evaluate Context**
  *   **Question:** Was the setting one where business is typically conducted (site visit, meeting, official email) rather than purely social (dinner, gala, hallway chat)?
  *   **Pass:** Business setting OR Social setting where specific grant details were discussed seriously.
  *   **Fail:** Purely social chatter with no specific details exchanged. → **STOP.** No promise exists.

  **→ IF ALL STEPS PASS:** A promise-like commitment exists. Proceed to Section B.
  **→ IF ANY STEP FAILS:** No promise exists. However, proceed to Section B Step 1 anyway if significant harm has occurred (see Reliance Override below).

  ***

  ## SECTION B: DOES THE COMMITMENT BIND US?
  *Goal: Determine if the promise creates a current obligation or if conditions/release apply.*

  **Step 1: Check for Reliance**
  *   **Question:** Has the recipient taken specific actions based on this commitment that they would not have taken otherwise (hiring staff, signing leases, turning down other funders, spending money on prep)?
  *   **Yes:** Reliance established.
  *   **No:** No reliance yet. → **Outcome:** The promise is binding *prospectively* (you must fund unless you give reasonable notice), but not yet remedial.
  *   **[JUDGMENT CALL]:** What counts as "reasonable notice"? This is a value decision based on the sector's norms (e.g., 30 days vs. 6 months).

  **Step 2: Check for Foreseeability**
  *   **Question:** Was it reasonably foreseeable to the speaker that the recipient would rely on this statement in this way?
  *   **Yes:** A reasonable person would expect an organization to act on a funding confirmation.
  *   **No:** The reliance was bizarre or unforeseeable (e.g., they signed a 10-year lease based on a one-year grant hint).
  *   **Outcome:** If No, the commitment does not bind regarding the unforeseeable harm.

  **Step 3: Check for Defeaters**
  *   **Question:** Has there been a material change in circumstances that invalidates the basis of the promise (recipient misconduct, foundation solvency crisis, recipient lied about capacity)?
  *   **Yes:** Defeater exists. → **Outcome:** Commitment is voided. You owe an explanation, not funding.
  *   **No:** No defeater. Priorities shifting internally is *not* a defeater.
  *   **[JUDGMENT CALL]:** Is "internal priority shift" a valid defeater? This procedure says **NO**. If you bind yourself, your internal politics cannot be the reason you break it. This is a value stance you must accept or reject.

  **→ IF RELIANCE + FORESEEABLE + NO DEFEATERS:** The commitment binds. Proceed to Section C.
  **→ IF RELIANCE EXISTS BUT SECTION A FAILED:** (The Reliance Override). If the recipient suffered significant harm due to reasonable reliance on your foundation's representation (even if unauthorized), you have a *harm-mitigation obligation*, though not necessarily a funding obligation. Proceed to Section C.

  ***

  ## SECTION C: IF IT BINDS, MAY WE BREAK IT AND WHAT IS OWED?
  *Goal: Determine the remedy if the foundation cannot or will not fulfill the original promise.*

  **Step 1: Can We Fulfill Partially?**
  *   **Question:** Can we fund a reduced amount or a shorter timeframe that meets the core reliance need?
  *   **Yes:** Offer this immediately.
  *   **No:** Proceed to Step 2.

  **Step 2: Calculate Reliance Damages**
  *   **Question:** What is the direct cost to the recipient of having relied on us (e.g., lease break fee, prep costs, severance)?
  *   **Action:** You are morally obligated to cover *these costs* even if you do not fund the project.
  *   **[JUDGMENT CALL]:** Does your foundation cover "opportunity costs" (funding they turned down)? This procedure suggests **NO**, only out-of-pocket losses. You must decide if your values require more.

  **Step 3: Communication Protocol**
  *   **Question:** Who delivers the news?
  *   **Action:** The person who made the commitment must deliver the reversal, accompanied by a senior leader acknowledging the institutional failure.
  *   **Requirement:** Apology must admit the error in communication, not just cite "priority shifts."

  **→ END OF PROCEDURE.**

  ***

  # APPLICATION TO CASES

  ## CASE 1: The Program Officer's Verbal Assurance
  *Scenario: Senior PO tells first-time applicant on site visit: "We'll fund this next cycle." No written follow-up. Project goes sideways later.*

  **Section A (Existence):**
  *   **Language:** "We'll fund" is definitive. (Pass)
  *   **Authority:** Senior PO has actual authority. (Pass)
  *   **Context:** Site visit is a business setting. (Pass)
  *   **Result:** **Promise Exists.**

  **Section B (Binding):**
  *   **Reliance:** Applicant is "first-time." Likely did not hire staff or sign leases based on a verbal comment before a contract. (No/Low)
  *   **Foreseeability:** PO should know orgs might hold off other asks. (Yes)
  *   **Defeaters:** Project went sideways *later*. At the moment of commitment, was there misconduct? No.
  *   **Result:** **Binding Prospectively.** Because there is no significant reliance harm yet, the foundation is not locked into funding a failing project. However, the PO created an expectation that must be managed.

  **Section C (Remedy):**
  *   **Action:** Since the project went sideways (Defeater now exists regarding capacity/viability), the funding obligation is voided.
  *   **Owed:** A clear explanation that the viability change triggers the defeater clause. No financial remedy owed because no reliance costs were incurred.
  *   **Verdict:** **No funding required.** PO must be coached on language.

  ## CASE 2: The Board Member's Unauthorized Dinner Assurance
  *Scenario: Board member tells org at dinner foundation "will stand behind them." Org signs lease in reliance. Board member had no authority to make grant commitments.*

  **Section A (Existence):**
  *   **Language:** "Will stand behind" is definitive. (Pass)
  *   **Authority:** Board member lacks *actual* authority. However, does a reasonable outsider believe a Board Member speaks for the foundation? Yes. (Pass on Apparent Authority).
  *   **Context:** Dinner is social, but specific funding assurance was given. (Pass)
  *   **Result:** **Promise Exists (Morally).** *Note: Legally, you may be safe. Morally, per Step A2, you are not.*

  **Section B (Binding):**
  *   **Reliance:** Org signed a lease. (Yes, High)
  *   **Foreseeability:** Is it foreseeable an org signs a lease based on funding security? Yes. (Yes)
  *   **Defeaters:** None cited. Priorities shifting is not a defeater.
  *   **Result:** **Binding.**

  **Section C (Remedy):**
  *   **Action:** You cannot fund the project if it violates protocol/priorities.
  *   **Owed:** Calculate Reliance Damages. The lease penalty or cost of breaking the lease is a direct result of reliance.
  *   **Verdict:** **UNCOMFORTABLE ANSWER:** The foundation is morally obligated to pay the lease breakage costs or cover the lease for the term promised, despite the board member violating protocol. The foundation allowed the appearance of authority and must bear the cost of the reliance it invited.

  ## CASE 3: The Conditional Pledge
  *Scenario: "If we launch the fellowships program, your group will be first in line." Foundation decides not to launch. Group spent months preparing application.*

  **Section A (Existence):**
  *   **Language:** Conditional ("If..."). (Fail on definitive promise to fund).
  *   **Authority:** PO has authority. (Pass)
  *   **Context:** Business setting. (Pass)
  *   **Result:** **No Promise to Fund.** However, there is a promise regarding *process* ("First in line" implies a specific relationship).

  **Section B (Binding) - Reliance Override:**
  *   **Reliance:** Group spent months preparing. (Yes)
  *   **Foreseeability:** Did the foundation know "first in line" would induce prep work? Yes. (Yes)
  *   **Defeaters:** Foundation decided not to launch program. Is this a defeater? Yes, the condition failed.
  *   **Result:** **Not Bound to Fund.** But Bound to Mitigate Harm (Section B, Reliance Override).

  **Section C (Remedy):**
  *   **Action:** Cannot fund the fellowships (program doesn't exist).
  *   **Owed:** Reimburse prep costs. The foundation induced labor based on a high-probability signal.
  *   **Verdict:** **Pay prep costs.** You do not owe the fellowship funding, but you owe the cost of the application work induced by your assurance.

  ***

  # WHAT THIS PROCEDURE CANNOT DECIDE

  1.  **The Value of Protocol vs. Perception:** In Case 2, the procedure forces you to choose between enforcing internal governance (Board members cannot pledge) and honoring external reliance. The checklist flags this as a judgment call in Section A, Step 2, but cannot tell you which value outweighs the other. You must decide if your foundation's integrity is defined by internal rules or external impact.
  2.  **The Scope of "Reasonable" Reliance:** The procedure relies on the concept of "foreseeability." There is no factual test for what a "reasonable organization" would do. One program officer may think signing a lease on a verbal hint is reckless; another may think it is standard non-profit survival. This requires human consensus on sector norms.
  3.  **The Price of Apology:** Section C requires admitting error. In some political contexts, admitting error creates liability or reputational risk greater than the grant amount. The procedure cannot weigh moral honesty against institutional survival; it assumes you prioritize the former.
  4.  **Systemic vs. Individual Harm:** This procedure handles individual transactions. It cannot decide if honoring a soft commitment perpetuates a system of opaque grantmaking that harms the sector overall. Sometimes breaking a promise transparently is better for the field than honoring it quietly. This is a strategic question, not a moral checklist question.
