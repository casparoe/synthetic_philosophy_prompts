          2.  **Symmetry of Ignorance:** We don't know the sign of downstream effects, but we often have no reason to think they are systematically negative rather than positive (or vice versa). Expected value of unknown unknowns might net to zero.
          3.  **Satisficing/Bounding:** We don't need exact numbers to rank. We need robustness.
      *   **What the Critic Must Accept/Give Up:**
