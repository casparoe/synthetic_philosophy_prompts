          *   *Accept:* That we must use heuristics for diffuse effects (e.g., cause neutrality, institutional resilience) rather than ignoring them.
      *   **Reconciling the Critique:** The original critique still holds water *if* modified. It's not that we *can't* measure diffuse effects, but that EA *methodology* currently lacks good tools for them, leading to systematic bias. The friend's argument shows we can't demand perfection, but it doesn't prove the current bias is justified.

