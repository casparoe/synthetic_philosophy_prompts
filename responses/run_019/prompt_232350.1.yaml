      So, rejecting P3 shows the friend's *argument against the critique* fails. It doesn't necessarily prove the critique is true, but it stops the friend from dismissing it via *reductio*.
      However, the prompt asks: "Where exactly should one push back? ... say what a defender of the measurability critique would have to accept, or give up, in order to avoid the conclusion that no intervention can ever justifiably be ranked above another."
