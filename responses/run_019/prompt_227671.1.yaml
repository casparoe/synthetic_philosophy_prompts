      *   *Ranking:*
          1.  **Formal Coherence (Non-Identity):** This is the structural engine. If the engine breaks, the car stops. If the principle that says "harming possible people is wrong" cannot be distinguished from "benefiting possible people is good" without arbitrariness, the asymmetry is unjustified. *Status:* Potentially fatal. *Defender Concession:* They admit needing a coherent person-affecting view. *Critic Claim:* They claim no such view exists.
          2.  **Proving Too Much (Benatar):** If the asymmetry entails antinatalism. *Status:* Forces retreat. *Defender Concession:* They usually deny antinatalism, so they must qualify the asymmetry (e.g., threshold views). *Critic Claim:* The qualification is ad hoc.
          3.  **Unwelcome Verdicts:** *Status:* Uncomfortable. *Defender Concession:* They accept some counterintuitive results (e.g., no duty to create happy children). *Critic Claim:* These results are absurd.
          4.  **Empirical Findings:** *Status:* Uncomfortable. *Defender Concession:* Intuitions have messy origins. *Critic Claim:* Debunking removes justification.

      *   *Unfalsifiability:* If every qualification is justified by "reflective equilibrium," it risks unfalsifiability. But normative ethics often resides there. It is a defect if it becomes purely immunising stratagems.
