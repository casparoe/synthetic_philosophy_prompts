          4.  Empirical Debunking.

      *   *Analysis of Unfalsifiability:* If the view requires constant tweaking to avoid Benatarism or Totalism, it risks becoming ad hoc. However, fundamental normative commitments often look like this.

      *   *Mind Changer:* A proof that no coherent person-affecting view can sustain the asymmetry without contradiction.

  5.  **Review against Constraints:**
