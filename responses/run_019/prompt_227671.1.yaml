  2.  **Deconstruct the Procreation Asymmetry:**
      *   Core claim: Existence can be bad for someone (reason not to create), but existence cannot be good for someone in a way that generates a reason to create (no reason to create).
      *   Key philosophical tension: Person-affecting views vs. Impersonal views. The asymmetry relies heavily on a specific person-affecting constraint (you can't benefit someone who doesn't exist to be benefited), but often struggles to explain why harming someone who doesn't exist is possible without benefiting them being possible (the Non-Identity Problem).
      *   Key rival: Total Utilitarianism (rejects asymmetry), Negative Utilitarianism (accepts asymmetry but often strengthens it to Benatar's antinatalism).

  3.  **Evaluate Candidate Defeaters:**

      *   **1. Formal Collapse into Incoherence (Non-Identity/Person-Affecting View):**
          *   *Issue:* The asymmetry needs a principle that says "harming possible people matters" but "benefiting possible people doesn't." Standard person-affecting views (like Parfit's) struggle to make this distinction without arbitrariness. If the principle relies on "wronging someone," who is wronged in the bad life case if they wouldn't otherwise exist? If the answer is "the child who exists," why doesn't the child who exists benefit in the good life case?
          *   *Threat Level:* High. If the underlying axiology is incoherent, the asymmetry floats without foundation.
          *   *User Preference:* User is moved by "formal collapse into an unacceptable rival position." This aligns perfectly.
          *   *Verdict:* Most threatening. Potentially fatal if no coherent person-affecting view can sustain it.

      *   **2. Proving Too Much (Benatar/Antinatalism):**
          *   *Issue:* If the reason not to create suffering is strong, and the reason to create happiness is zero, does any risk of suffering outweigh any amount of happiness? Benatar argues yes.
          *   *Threat Level:* Medium-High. If the asymmetry logically entails antinatalism, many find that a *reductio*. However, the user says they accept the asymmetry and survive standard attempts to reduce to absurdity. They might accept a qualified version that avoids strict antinatalism.
          *   *Verdict:* Forces retreat/qualification. Not necessarily fatal if one can draw a non-arbitrary line between "bad life" and "life with some pains."

      *   **3. Unwelcome Verdicts (The "Mildly Unhappy" or "Negligible Cost" cases):**
          *   *Issue:* Creating a life with net suffering but worth living? Creating a genius at no cost?
          *   *Threat Level:* Medium. These are intuitive pumps. If the asymmetry says "indifferent to creating genius at no cost," many find that counterintuitive. But the user accepts the asymmetry as "ordinary intuition."
          *   *Verdict:* Merely uncomfortable. Defenders often bite the bullet here.

      *   **4. Empirical/Psychological Debunking:**
          *   *Issue:* If the intuition is just framing effects (loss aversion).
          *   *Threat Level:* Low-Medium. Moral intuitions often have messy etiologies. Doesn't prove the normativity wrong, just the psychological origin.
          *   *Verdict:* Merely uncomfortable. Requires further normative argument to be fatal.

      *   **5. Unfalsifiability:**
          *   *Issue:* If every objection is met with a qualification.
          *   *Verdict:* A defect if it becomes ad hoc.

  4.  **Drafting the Response (incorporating constraints):**

      *   *First Sentence:* Must state the single most serious threat and its status.
      *   *Language:* British English (e.g., "defence," "programme," "centre").
