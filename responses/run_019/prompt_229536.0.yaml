  *(Self-Correction during drafting)*: I need to be careful about the "circularity" claim. The blog says *ceteris paribus* clauses are circular. The Lewisian response is to replace the *ceteris paribus* clause with a reference to the "causal base." I need to explain that this avoids circularity *if* you accept categorical bases. If you are a dispositional monist, you can't do that. So the "dead end" claim depends on prior metaphysical commitments. I should highlight this dependency.

