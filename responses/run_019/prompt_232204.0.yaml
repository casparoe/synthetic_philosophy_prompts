      *   **Core Observation:** Clinical pain assessment treats patient self-report as both authoritative ("gold standard") and suspect (checked against behavior/affect). In medicolegal contexts, it's treated as highly suspect (feigning).
      *   **Hypothesis:** This practice presupposes a "private language picture" (pain = private object, report = description of inner state).
      *   **Philosophical Framework:** Wittgenstein's *Philosophical Investigations* (Private Language Argument, Beetle in the Box, pain as expressive behavior).
      *   **Key Questions:**
          1.  What does the practice *actually* presuppose? (Modest epistemic privilege vs. full private-language picture?)
          2.  Does reliance on the 0-10 scale commit it to the private-language picture?
