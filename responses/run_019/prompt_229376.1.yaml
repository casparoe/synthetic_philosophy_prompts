answer: |-
  First off, commiserations on the move. It is perfectly understandable that you feel a bit of friction here. You are paying your council tax, your child is integrated into the system, and yet you are told you have no say in who runs the local council. Your intuition—that being subject to the law should grant you a voice in making it—is morally powerful. It is the same principle that underpinned the American Revolution, after all.

  However, your friend is technically correct, albeit perhaps a bit pedantic about it. In political philosophy, this is known as the 'boundary problem' or the 'constitutive problem' of democracy. While your solution (often called the 'All-Subjected Principle') feels obvious, philosophers and legal theorists argue it is surprisingly difficult to implement without running into logical contradictions or practical impossibilities.

  Here is what is actually left to argue about, and why it remains unresolved.

  ### 1. The Problem of Definition
  Your principle is: everyone subject to the laws should vote. The immediate question is: what does 'subject to' actually mean?

  If we take it literally, a tourist visiting for a week is subject to the local laws (they cannot murder or steal, they must obey traffic signals), yet no country grants them voting rights. Conversely, children are subject to the laws but cannot vote. Prisoners are subject to the laws but often lose the vote.

  So, in practice, no society actually follows the 'All-Subjected Principle' strictly. They all draw a line elsewhere, usually at citizenship or permanent residence. But on what moral basis do we draw that line? If taxation is the trigger, should children of taxpayers vote? If residence is the trigger, how long must one reside? Six months? Five years? There is no natural, philosophical consensus on where that threshold lies, only political compromises.

  ### 2. The 'All-Affected' Alternative
  Some theorists argue the boundary should be drawn around everyone 'affected' by a decision, rather than just those subject to the laws. But this opens a rather large can of worms.

  Almost every political decision has ripple effects. If your local council decides to build a new incinerator, it affects the air quality of the next town over. If your country sets interest rates, it affects investors abroad. If we grant voting rights to everyone affected, the *demos* (the people) becomes potentially global.

  If the *demos* is global, then the nation-state ceases to be the unit of democracy. While some cosmopolitan theorists argue this is exactly what should happen, most people still believe in national self-determination. Therefore, we must exclude some affected parties. But who decides which affected parties count? You are back to the original problem.

  ### 3. The Circular Logic
  This is the trickiest bit, and the core of why theorists say it is 'unresolved'.

  To decide the boundaries of the voting population, you need a democratic decision. But to make a democratic decision, you first need a defined voting population.
  *   Who decides who gets to vote?
  *   The voters.
  *   But who are the voters?
  *   The ones decided by the decision.

  It is a logical circle. You cannot use democracy to define the boundaries of democracy without presupposing those boundaries already exist. Usually, this is solved by history, force, or inherited citizenship laws, none of which are particularly 'democratic' in origin. As the political theorist Robert Dahl noted, the boundaries of the democratic state are almost never determined democratically.

  ### 4. Citizenship vs. Residence
  Your situation highlights the tension between two different views of political membership.
  *   **The Civic Nationalist view:** Voting is tied to citizenship. It implies a long-term commitment and shared identity beyond just living somewhere. This protects the stability of the political community but excludes people like you.
  *   **The Resident view:** Voting is tied to presence. If you live here, you are part of the community. This is more inclusive but raises questions about transient populations. Should someone here for a six-month work contract change the government?

  Different countries strike this balance differently. In the UK, for instance, Commonwealth citizens and Irish citizens can vote in general elections, but other foreigners cannot. In some countries, non-citizens can vote in local elections but not national ones. This inconsistency proves there is no single agreed-upon principle; there are only varying political settlements.

  ### The Verdict
  So, is your friend right? Yes. While the moral intuition of 'no taxation without representation' is clear, the mechanism for implementing it without undermining the concept of a distinct political community is not.

  We argue about it because any line we draw seems arbitrary to someone. If we draw it at citizenship, we exclude residents like you. If we draw it at residence, we risk instability or include people with no long-term stake. If we draw it at 'affected', the boundary dissolves entirely.

  For now, the world muddles through with a mix of citizenship laws and reciprocal treaties (like EU citizens voting in local elections in other member states). It is a pragmatic fix, not a philosophical solution. You are living in the gap between the moral ideal and the political reality, which is precisely why the problem remains unresolved.

  Fair dos to you for grappling with it, though. It is a proper philosophical quandary to have whilst unpacking boxes.
