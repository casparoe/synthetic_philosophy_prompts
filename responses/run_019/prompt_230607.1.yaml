answer: |-
  # Desiderata for a Formal Theory of Simplicity and Priors

  **Context:** Graduate Seminar in Formal Epistemology
  **Subject:** Specification of Requirements for Simplicity-Based Prior Assignment

  The following specification outlines the job description for any adequate formal account of how simplicity constrains prior probability. This is not merely a list of features but a set of constraints intended to expose the structural tensions inherent in formalizing Occam's Razor.

  ---

  ## I. The Desiderata

  ### 1. The Epistemic/Pragmatic Distinction (Truth-Tracking vs. Efficiency)
  The theory must explicitly distinguish between two distinct jobs simplicity might do:
  *   **(A) Epistemic Justification:** Explaining why simpler hypotheses are *more likely to be true* (or converge to truth faster).
  *   **(B) Pragmatic/Methodological Justification:** Explaining why simpler hypotheses are *more useful* for prediction, compression, or decision-making, regardless of ontological truth.
  *   **Requirement:** The account must state whether it aims for (A), (B), or both. It must clarify if one can be had without the other. (e.g., Can we justify high priors for simplicity merely as a betting strategy without claiming the world is simple?)

  ### 2. The Language Relativity and Finite Data Constraint
  Any complexity measure $C(h)$ is defined relative to a description language $\mathcal{L}$ or reference machine $U$. The Kolmogorov Invariance Theorem guarantees that for two universal machines $U_1, U_2$, $|K_{U1}(h) - K_{U2}(h)| \leq c_{12}$.
  *   **Requirement:** The theory must address the status of the additive constant $c_{12}$.
  *   **Specific Constraint:** Since scientific inference occurs on **finite evidence** $n$, the theory must explain why $c_{12}$ does not swamp the likelihood ratio when $n < c_{12}$. An account that relies solely on asymptotic convergence ($n \to \infty$) fails to guide actual inference where $n$ is small relative to the complexity of the hypothesis space.

  ### 3. Effective Evaluability (Computability)
  Kolmogorov complexity is uncomputable (halting problem). A prior distribution based directly on uncomputable measures cannot be implemented by a finite agent.
  *   **Requirement:** The theory must specify its stance on idealization.
      *   If **Idealized:** It must explain the normative force of a standard no agent can meet.
      *   If **Computable:** It must specify the cost paid in terms of restricted hypothesis spaces or approximation errors.
  *   **Constraint:** The account cannot simply ignore uncomputability; it must treat it as a bug to be solved or a feature to be acknowledged.

  ### 4. Robustness Against Pathological Hypotheses
  The theory must yield intuitively correct posterior rankings in the following specific cases:
  *   **(A) Gerrymandered Disjunctions:** Hypotheses of the form $H_1 \lor H_2$ where $H_1$ fits past data and $H_2$ is arbitrary but makes the disjunction complex. The prior must penalize the disjunctive complexity, not just the fit.
  *   **(B) Hidden Complexity (The "Grue" Problem):** Hypotheses that appear simple in a gerrymandered language (e.g., where "grue" is primitive) but complex in natural predicates. The theory must have a mechanism for privileging "natural" predicates or show why language choice doesn't matter.
  *   **(C) Overfitting:** Hypotheses that fit finite noise perfectly (zero training error) but have high description length. The prior must penalize complexity sufficiently to prevent posterior dominance by overfitted models.

  ---

  ## II. Classification of Requirements

  ### Non-Negotiable (Hard Constraints)
  *   **Finite Data Sensitivity (from Desid 2):** An epistemology for finite agents cannot rely on wash-out conditions that require infinite data. If the constant $c$ matters, the theory must specify how to fix it.
  *   **Overfitting Protection (from Desid 4C):** A theory of simplicity that allows a polynomial of degree $n-1$ to dominate a linear fit on $n$ points is functionally useless for induction.
  *   **Explicit Stance on Truth (from Desid 1):** Ambiguity here renders the theory philosophically inert. It must claim whether simplicity is a guide to truth or merely utility.

  ### Optional / Contested
  *   **Strict Language Invariance:** Many argue we must accept a "natural" language (e.g., grounded in physics or perception) rather than demanding invariance across *all* UTMs.
  *   **Full Computability:** Some (e.g., Hutter, Rathmanner) argue that idealized norms (Solomonoff) are valid even if uncomputable, serving as a gold standard for approximations.
  *   **Objective Truth-Tracking:** Constructive empiricists or instrumentalists may reject Desid 1(A) entirely, accepting only Desid 1(B).

  ---

  ## III. Joint Unsatisfiability Claims (The Trilemma)

  It is my contention that the following three requirements are **jointly unsatisfiable** for any single formal framework:

  1.  **Strong Language Invariance:** Priors are invariant (up to a negligible constant) across all reasonable universal Turing machines.
  2.  **Finite-Sample Reliability:** The "negligible constant" does not swamp the evidence for any realistically sized dataset $n$.
  3.  **Computability:** The prior can be calculated by a finite algorithm.

  **The Sacrifice:**
  *   **Solomonoff Induction** sacrifices (3) to keep (1) and (2) asymptotically.
  *   **MDL/BIC** sacrifices (1) (by fixing a model class/language) to keep (2) and (3).
  *   **Subjective Bayesianism** sacrifices (1) (by fixing priors via subjective judgment) to keep (2) and (3).

  **The Incompatibility Argument:** To achieve computability, one must restrict the hypothesis space or the machine class. This restriction introduces a bias that is not invariant under all transformations of the language. To achieve invariance, one must allow all UTMs, which introduces the uncomputable halting problem. To ensure the constant doesn't swamp finite data, one must fix the machine *a priori*, which violates invariance. **Every live account quietly sacrifices one.** Usually, it is Language Invariance that is sacrificed in practice (via "natural" predicates) while Invariance is claimed in principle.

  ---

  ## IV. Scoring Candidate Accounts

  | Desideratum | **Solomonoff Induction (SI)** | **Minimum Description Length (MDL)** |
  | :--- | :--- | :--- |
  | **1. Truth vs. Utility** | **Pass.** Proven to converge to truth (if computable). Strong epistemic claim. | **Mixed.** Focuses on predictive efficiency. Truth-tracking depends on model class containing truth. |
  | **2. Language/Constant** | **Partial Pass.** Invariant up to constant $c$. **Fail** on finite data if $c > n$. | **Fail.** Heavily dependent on the chosen model class and coding scheme. No invariance theorem. |
  | **3. Computability** | **Fail.** Uncomputable. Purely idealized. | **Pass.** Computable (given restricted model classes). Usable by humans/machines. |
  | **4. Pathological Cases** | **Pass.** Penalizes disjunctions and overfitting via length. | **Pass.** Explicitly designed to penalize overfitting (complexity penalty). |
  | **Overall Verdict** | **Normative Gold Standard, Practically Useless.** Defines the target but cannot be hit. | **Pragmatic Workhorse, Philosophically Contingent.** Works, but relies on subjective model selection. |

  ---

  ## V. Meta-Assessment and Confidence

  **Confidence in Desiderata:**
  I am **highly confident** (0.9) that this list accurately captures the structural problems faced by formal epistemologists. These are the standard fault lines in the literature (Kelly, Sober, Hutter, Grünwald).

  **Least Sure Requirement/Incompatibility:**
  I am **least sure** (0.6 confidence) of the claim that **Strong Language Invariance** is a necessary desideratum (Desid 2).

  **Reason for Doubt:**
  The incompatibility claim rests on the assumption that we *need* invariance across *all* UTMs. However, recent work in "naturalized epistemology" and cognitive science suggests that agents are not abstract UTMs but embodied systems with specific sensory-motor constraints. If we restrict the "allowed" reference machines to those physically realizable or cognitively natural for the agent, the constant $c$ may become small enough to be negligible for finite data, and the measure may become computable.
  If "Language Invariance" is replaced by "Physical/Cognitive Naturalness," the trilemma might dissolve. However, this moves the problem from formal epistemology to empirical psychology/metaphysics, which may be outside the scope of a *formal* theory. Thus, while I flag it as the weak link, it remains the pivot point on which the impossibility result turns.

  **Final Note for the Seminar:**
  When presenting this, emphasize that the "sacrifice" identified in Section III is not a bug but a feature of the landscape. The choice between SI and MDL is not a choice between right and wrong, but a choice between **idealized truth-tracking** (SI) and **feasible predictive stability** (MDL). The seminar should focus on whether formal epistemology is in the business of defining the ideal or guiding the agent.
