answer: |-
  (1) We agree that moral trade is distinct from mere compromise, requiring divergent final ends but convergent instrumental interests, and we accept that some cooperative acts, such as standard vote-swapping between allies, are morally unproblematic. We both acknowledge that agents have a pro tanto duty to improve outcomes according to their own values, provided this does not violate strict negative duties against harming others. Consequently, we concur that the burden of proof lies on showing why certain mutually beneficial exchanges constitute impermissible harm rather than legitimate cooperation.

  (2) Our residual disagreement centers on whether enabling a partner's immoral project renders an agent complicit in that project, even when the enablement is exchanged for a greater good by both parties' lights. The Moral Trader asserts that net welfare gains justify the instrumental facilitation of disvalued acts, while the Clean-Hands Deontologist asserts that integrity constraints forbid using wrongdoing as a means to good ends. We therefore disagree on whether the moral cost of complicity is aggregable with the benefits of the trade.

  (3) The first crux is whether complicity attaches to intentional facilitation of a harmful act or only to direct participation in the harm itself. The second crux is whether trading with an agent whose values one opposes constitutes subsidizing a wrongdoer or merely cooperating with a moral peer. We identify these as decisive because the first determines the scope of forbidden actions, and the second determines the moral status of the trading partner.

  (4) Regarding the complicity crux, in a case where an activist pays a factory farm to close a unit early, the Moral Trader verdict is permissible due to net suffering reduced, whereas the Clean-Hands Deontologist verdict is impermissible as it funds ongoing wrongdoing. Regarding the partner status crux, in a vote-swap with an ideological opponent on unrelated issues, the Moral Trader verdict is obligatory to maximize influence, while the Clean-Hands Deontologist verdict is permissible because the opponent is not deemed a wrongdoer merely for voting differently. Both sides agree these cases isolate the variables of material cooperation versus political disagreement.

  (5) We conclude that the dispute is not merely verbal, as it persists even when definitions of "harm" and "benefit" are standardized across both frameworks. However, we acknowledge that differing conceptions of agency and causal responsibility contribute significantly to the divergence in verdicts. Clarifying whether "facilitation" counts as "action" or "omission" would likely reduce the scope of the disagreement.
