answer: |-
  # Instrument: Which Account of Aesthetic Testimony Do You Actually Hold?

  **Introduction for Readers:**
  We readily accept a meteorologist's word about rain or a mechanic's word about our brakes. But tell a friend a movie is a masterpiece without them seeing it, and they might bristle. Why do we treat aesthetic judgment differently? This instrument does not ask what you *think* you believe about art criticism. It asks what you would *do* in ten concrete situations. Your answers will locate your intuitive position in the logical space of taste.

  ***

  ## The Questions

  **1. The Trusted Review**
  You trust a film critic whose taste aligns with yours. They tell you a new movie is a masterpiece. At a dinner party, can you truthfully say, "That movie is a masterpiece"?
  *   **A.** Yes. If their judgment is reliable, the fact is transferred to me.
  *   **B.** No. I can only say, "I'm told it's a masterpiece."
  *   **C.** I can say, "It's likely a masterpiece," but I shouldn't present it as my own judgment.

  **2. The Exhibition Choice**
  You have time to visit only one of two museums. A friend whose taste you respect tells you Exhibition A is aesthetically superior to Exhibition B. Do you go to A?
  *   **A.** Yes. Their word is sufficient reason to choose the better experience.
  *   **B.** No. I cannot know which is better until I stand before the works myself.
  *   **C.** Yes, I'll go to A, but I acknowledge I'm acting on a tip, not a verified judgment.

  **3. The Sommelier's Description**
  A sommelier gives you a detailed description of a wine's balance, finish, and complexity. You do not taste it. Do you now *know* the wine's aesthetic merits?
  *   **A.** Yes. I possess knowledge of its merits, just not the sensory sensation.
  *   **B.** No. I know *that* it has merits, but I don't know the merits themselves.
  *   **C.** I know what features to attend to, but "knowing the merits" requires the tasting.

  **4. The Armchair Connoisseur**
  Imagine a person who has read every description of the *Mona Lisa* but never seen it. When they finally stand before it, what exactly do they gain?
  *   **A.** Nothing factual. They already knew everything about the painting.
  *   **B.** They gain the experience, which is the only thing that matters aesthetically.
  *   **C.** They gain the ability to verify the descriptions and see how the features connect.

  **5. The Reasoned Argument**
  A critic writes a column listing three specific reasons why a novel is profound. You haven't read the novel. Do these reasons give you a reason to believe the novel is profound?
  *   **A.** Yes. Good reasons support the conclusion regardless of who reads them.
  *   **B.** No. The reasons only make sense once you have read the book.
  *   **C.** They give me a reason to read the book, not to believe the conclusion yet.

  **6. The Disagreement**
  You read a book based on a friend's recommendation. They say it's moving; you find it boring. Who is wrong about the book's value?
  *   **A.** Possibly me. They might have perceived something I missed.
  *   **B.** Neither. Aesthetic value is relative to the experiencer.
  *   **C.** Neither, but my judgment overrides theirs regarding my own experience.

  **7. The Restaurant vs. The Gallery**
  Is recommending a restaurant based on a guidebook fundamentally different from recommending a painting based on a guidebook?
  *   **A.** No. Both are recommendations about quality based on expert testimony.
  *   **B.** Yes. Food is functional; art requires personal perception.
  *   **C.** Yes, but only because art aims to provoke a unique attentional state.

  **8. The Honest Friend**
  If you knew a friend never lied about art and had perfect vision, would their word alone be enough to settle your belief about a painting's beauty?
  *   **A.** Yes. Perfect testimony yields perfect knowledge.
  *   **B.** No. Honesty isn't the issue; the issue is my own acquaintance with the object.
  *   **C.** It would settle my belief, but not my aesthetic appreciation.

  **9. Learning Appreciation**
  Can you learn to appreciate jazz solely through lectures and reading, without listening?
  *   **A.** Yes. If the lectures explain the structure and history sufficiently.
  *   **B.** No. Appreciation is a skill of the ear, not the intellect.
  *   **C.** You can learn the theory of appreciation, but not the appreciation itself.

  **10. The Function of Criticism**
  When a critic praises a work, what is their primary goal?
  *   **A.** To inform the public of the work's objective value.
  *   **B.** To persuade the public to experience the work for themselves.
  *   **C.** To record their own subjective response for the record.

  ***

  ## Scoring Key

  Tally your answers. You will likely have a mix, but one column should dominate.

  *   **Mostly A: The Transmissionist (Full Optimist)**
      *   *View:* Aesthetic testimony works just like scientific or historical testimony. Reliable sources transmit knowledge and justify assertion.
      *   *Core Belief:* "If the source is good, the knowledge is mine."

  *   **Mostly B: The Acquaintance Purist (Strict Pessimist)**
      *   *View:* Aesthetic judgment requires first-hand perception. Testimony provides information *about* the work, but never aesthetic knowledge *of* the work.
      *   *Core Belief:* "You had to be there."

  *   **Mostly C: The Evidentialist (Moderate)**
      *   *View:* Testimony provides *some* evidence (probability), enough to guide action (like choosing an exhibition), but not enough to justify full aesthetic assertion or belief.
      *   *Core Belief:* "I have reason to think it's good, but I can't judge it yet."

  *   **Mostly B/C Mix with emphasis on Q5 & Q10: The Attentional Guide (Deflationary)**
      *   *View:* Aesthetic talk isn't about truth-claims at all. It is advice on where to direct attention. Testimony is a scaffold for experience, not a substitute.
      *   *Core Belief:* "Don't believe me; look where I'm pointing."

  *(Note: If you scored evenly between C and the B/C Mix, see the "Logical Space Analysis" below. Your intuition lies in a zone philosophers struggle to separate.)*

  ***

  ## Editor's Notes: The Logical Space Analysis
  *(For the Journalist's Background Material)*

  This instrument maps four occupied positions in the philosophy of aesthetic testimony. However, the logical space contains combinations that are unoccupied, incoherent, or indistinguishable by this method.

  ### 1. The Occupied Positions
  *   **Strict Acquaintance (The Purist):** Corresponds to **Mostly B**. Holds that aesthetic properties are response-dependent. Testimony fails because it cannot transmit the *experience* required for the property to exist for the subject.
  *   **Full Transmission (The Optimist):** Corresponds to **Mostly A**. Holds that aesthetic properties are objective (or at least inter-subjective) facts. Testimony succeeds because reliability is the only condition for knowledge transmission.
  *   **Evidentialist (The Moderate):** Corresponds to **Mostly C**. Holds that testimony provides *probabilistic* justification. It justifies belief ("It is probably good") and action (going to the museum), but violates the norm of assertion ("It *is* good") because the evidence is second-hand.
  *   **Attentional/Deflationary (The Guide):** Corresponds to **B/C Mix (specifically Q5 & Q10)**. Holds that aesthetic statements are not truth-apt propositions but tools for coordinating attention. Testimony doesn't "justify belief" because there is no belief to justify; it offers "scaffolding."

  ### 2. Unoccupied or Problematic Combinations
  The following logical combinations are theoretically possible but practically unoccupied or flagged as problematic:

  *   **Assertion Without Belief (Incoherent):**
      *   *Position:* Testimony justifies *asserting* "This is good" but does not justify *believing* "This is good."
      *   *Status:* **Incoherent.** This violates the Moorean paradox ("It is good, but I don't believe it"). Norms of assertion generally require belief. No respondent consistently chose options that validated assertion while invalidating belief.
  *   **Knowledge Without Action (Unattractive):**
      *   *Position:* Testimony gives you *knowledge* that Exhibition A is better, but you are not justified in *going* to Exhibition A.
      *   *Status:* **Unattractive/Unoccupied.** If one knows A is better than B, pragmatic rationality dictates choosing A. This combination implies a disconnect between aesthetic knowledge and practical reasoning that few endorse.
  *   **Reasons Without Experience (Unexplored):**
      *   *Position:* Critical *reasons* (e.g., "the lighting creates irony") transmit knowledge, but simple *verdicts* (e.g., "it's good") do not.
      *   *Status:* **Unexplored/Niche.** This is a subset of the Evidentialist view. The quiz groups these together (Option C in Q5), but a finer instrument might separate "Verdict Pessimism" from "Reason Optimism."

  ### 3. Indistinguishable Positions (The "Blur")
  *   **Evidentialism vs. Attentionalism:**
      *   *The Problem:* Both positions advise against asserting aesthetic judgments based on testimony. Both encourage seeking first-hand experience.
      *   *Why they blur:* The Evidentialist says, "You lack sufficient *evidence* to assert." The Attentionalist says, "You lack the *attentional state* to understand the assertion." In a quiz format, both result in "Don't say it's good yet."
      *   *Diagnostic Limit:* Questions 5 and 10 attempt to separate them (Reasons as evidence vs. Reasons as pointers), but a reader's intuition may not distinguish between "weak evidence" and "non-evidential advice." If your score was split between C and the B/C Mix, you occupy this borderland.

  ### 4. Required Scenario Coverage
  *   **Relying on trusted reviews to assert:** Covered in **Q1**.
  *   **Choosing between exhibitions:** Covered in **Q2**.
  *   **Wine tasting notes/knowledge:** Covered in **Q3**.
  *   **Second-hand descriptions vs. first-hand lack:** Covered in **Q4**.

  ### 5. Why This Structure?
  The instrument avoids abstract labels (e.g., "Do you believe in aesthetic realism?") because lay readers often hold inconsistent views across domains (e.g., Optimist about wine, Purist about painting). By forcing concrete choices, the instrument reveals the *functional* commitments of the reader's taste. The scoring key acknowledges that most people are not pure philosophers; they are "Moderates" (Evidentialists) who treat testimony as a reason to look, rather than a reason to believe.
