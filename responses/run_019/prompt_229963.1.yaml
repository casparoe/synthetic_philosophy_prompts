answer: |-
  You have accurately identified the central fault line in **Experimental Philosophy (X-Phi)** over the last two decades. The pattern you describe is the primary engine of the "Restrictionist" vs. "Traditionalist" debate.

  There is an established term for the *defense*, but the specific *fallacious instantiation* of it you're describing is often discussed under a few different labels.

  ### The Established Terminology

  In the academic literature, this move is standardly called **The Expertise Defense** (or sometimes **The Competence Objection**).

  *   **The Claim:** Philosophical intuitions are like technical skills (e.g., physics or math). Just as you wouldn't poll undergraduates on quantum mechanics, you shouldn't poll them on reference or knowledge. Only "competent" speakers (usually defined as trained philosophers or native speakers with full linguistic command) possess the reliable intuition.
  *   **The Critics:** Philosophers like Jonathan Weinberg, Stephen Stich, and Edouard Machery argue this is ad hoc. They point out that philosophers rarely test *for* expertise independently; they simply assume expertise correlates with agreement with the traditional view.

  When the defense relies specifically on cross-cultural linguistic data (as in your examples), it is often called **The Distinct Concept Reply** or **The Misunderstanding Hypothesis**. The argument is: "They aren't giving a different answer to the *same* question; they are answering a *different* question because their concept (e.g., KNOWING or REFERENCE) is subtly different."

  ### A sharper label for the fallacy

  While "Expertise Defense" is the neutral academic term, the specific *fallacious* version you described—where competence is defined *solely* by agreement with the target intuition—doesn't have a single universally agreed-upon pejorative.

  However, in rationalist-adjacent circles, the most precise coinage for this is **Epistemic Gerrymandering**.

  **Definition:** *Epistemic Gerrymandering* occurs when the boundaries of a relevant epistemic population (e.g., "competent speakers," "rational agents," "those who understand the concept") are drawn post-hoc to include only the data points that support the hypothesis, without independent criteria for membership in that population.

  It is a specific subtype of **No True Scotsman** applied to epistemic authority rather than group identity.

  ### The Carve: Legitimate vs. Illegitimate

  You asked for the boundary conditions. When is a competence objection a valid methodological control, and when is it immunization? Here is the carve, based on standards from psycholinguistics and Bayesian epistemology.

  #### 1. Independent Competence Measures (The Gold Standard)
  *   **Legitimate:** You can measure "competence" or "understanding" *without* measuring the target intuition.
      *   *Example:* In the cross-cultural Gettier cases, researchers run comprehension checks. "If John believes X, but X is false, does John know X?" If the participants fail basic logic checks or definition checks unrelated to the specific vignette, excluding them is valid.
      *   *Example:* In translation, using **back-translation** (English -> Language X -> English) to verify semantic equivalence before running the study.
  *   **Illegitimate (Epistemic Gerrymandering):** The only test for whether a participant "understands the concept" is whether they give the "correct" answer to the vignette.
      *   *Signal:* "They answered 'No', which shows they don't grasp the stipulative definition of knowledge." (This is circular: The answer is the evidence for the lack of competence, and the lack of competence is the explanation for the answer.)

  #### 2. A Generative Theory of Error
  *   **Legitimate:** The defender offers a specific, testable mechanism for *why* the other group fails, independent of the result.
      *   *Example:* "In Language X, the word for 'know' pragmatically implicates 'morally justified.' We predict they will also reject knowledge claims in cases where the belief is immoral but epistemically sound." (This makes a new prediction).
      *   *Example:* "Philosophers are trained to suppress pragmatic implicatures. We predict trained novices will shift toward the philosophical answer after 30 minutes of training."
  *   **Illegitimate:** The explanation is purely retrospective. "They got it wrong because they lack the relevant competence." No mechanism is offered for *how* that competence manifests elsewhere.

  #### 3. Convergent Validity
  *   **Legitimate:** The "competent" group shows consistency across *multiple* different cases testing the same concept.
      *   *Example:* If Westerners agree on Gettier Case A, B, and C, and Group X disagrees on all three, it suggests a stable conceptual difference. If Group X agrees on A and B but disagrees on C, it looks more like noise or vignette-specific confounds.
  *   **Illegitimate:** The "competent" group is defined by a single data point (the classic case). If the intuition is truly universal among the competent, it should hold across a battery of isomorphic cases.

  #### 4. Prior Specification (The Bayesian Check)
  *   **Legitimate:** The criteria for exclusion are pre-registered or stated before the data is analyzed.
  *   **Illegitimate:** The criteria for "competence" are tightened *after* the data comes in.
      *   *Signal:* "Well, obviously we have to exclude anyone who didn't take a logic class," *after* seeing that logic students disagree with the professor.

  ### Summary for your mental model

  If you encounter this move, run this diagnostic:

  1.  **Is "Competence" operationalized independently of the intuition?** (If No $\rightarrow$ Epistemic Gerrymandering).
  2.  **Is there a predictive theory of error?** (If No $\rightarrow$ Ad Hoc Rescue).
  3.  **Does the "competent" label travel?** (Does being "competent" in Case A predict being "competent" in Case B?)

  In the specific cases you mentioned (Gettier and Kripke), the consensus in X-Phi has largely shifted against the Universalists. The variation appears robust even when translation is carefully controlled. The "Expertise Defense" has weakened because studies show that **professional philosophers' intuitions vary by culture and training background just as much as undergraduates**, they just vary *less* on the specific cases they teach constantly (a familiarity effect, not a competence effect).

  So, if you need a term to use in conversation: call it **The Expertise Defense** when being charitable, and **Epistemic Gerrymandering** when pointing out the circularity.

  *(Note: If you want to dive deeper, look up the "Restrictionist Program" in experimental philosophy, specifically the work of Weinberg, Nichols, and Stich (2001) "Normativity and Epistemic Intuitions," which kicked off this exact debate.)*
