          6.  General: "Extrinsic Dispositions?" (Common follow-up).
          7.  Causal Modelers: "Circularity of Basis?" (Technical but manageable).
          8.  Phil Language: "Context sensitivity?" (Nuance).
      *   *Low Damage/Low Likelihood (Specialist traps):*
          *   Specific counter-examples from Johnston or Bird (too technical).
          *   Deep dive into specific possible world semantics (they only know classics).

      *Selection:* I need 8-10. I'll prioritize the "Why should we care?" and "Is this new?" questions, as those kill job talks in non-specialist departments.

  5.  **Drafting the Content (Iterative refinement for tone and brevity):**

      *   *Objection 1 (Causal Modelers):* "Interventionism already does this."
      *   *Objection 2 (Modal):* "Lewis already did this (RCA)."
      *   *Objection 3 (Language):* "Meaning vs. Property."
