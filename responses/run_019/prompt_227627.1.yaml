answer: |-
  Students act as a planetary protection committee that must maintain a single written definition of life to classify ambiguous samples, losing budget points every time they revise that definition or issue contradictory rulings.

  ### Activity Design: The Planetary Protection Protocol

  **Roles:** Divide the 14 students into three "Agencies" (5, 5, 4 students). Each Agency is independent but shares a global budget pool ($3000 total). If the pool hits $0, the mission fails (quarantine breach).

  **Materials:**
  *   3 Whiteboards & markers (one per Agency).
  *   Global Budget Tracker (visible on main board).
  *   "Case Files" (Facilitator only, printed cards).
  *   "Challenge Tokens" (3 per Agency).
  *   Timer.

  **Rules:**
  1.  **The Definition:** Agencies have 10 minutes to draft a definition of LIFE. It must be written as a set of necessary and sufficient conditions (e.g., "X is alive IF AND ONLY IF...").
  2.  **The Ruling:** For each Case, Agencies privately vote ALIVE or INERT based *strictly* on their definition. They reveal simultaneously.
  3.  **The Cost:**
      *   **Inconsistency:** If Agencies disagree on a ruling, -$200 from the global budget (confusion costs money).
      *   **Revision:** If an Agency changes their written definition to accommodate a Case, -$300 (policy instability costs money).
      *   **Challenge:** After a ruling, any Agency can spend a Challenge Token to propose a *hypothetical* entity that fits the current definition but yields an intuitively wrong result (e.g., "Your definition says fire is alive"). If valid, the defining Agency must revise immediately (-$300) or lose the token.
  4.  **Winning:** The group wins if budget remains >$0 after all cases. Individual Agencies gain "Prestige Points" for never revising their definition (encourages robust initial drafting).

  ### Case Menu & Order (Adaptive)

  Do not reveal all cases at once. Select the next case based on the current definition's weakness. If students successfully challenge each other, skip the corresponding Facilitator Case.

  1.  **Control: "Sample Alpha" (Earth Wolf).**
      *   *Why:* Baseline. Ensures they don't write a definition that excludes obvious life.
      *   *Expected Ruling:* ALIVE.
      *   *Trap:* If they define life as "Organic," this passes. If "Sentient," this passes.
  2.  **The Metabolism Breaker: "Sample Beta" (Virus).**
      *   *Trigger:* Use if definition requires "Independent Metabolism" or "Cellular Structure."
      *   *Why:* Forces the "borrowed chemistry" debate.
      *   *Trap:* If they rule ALIVE, ask about crystals. If INERT, ask about mules.
  3.  **The Reproduction Breaker: "Sample Gamma" (Sterile Mule/Worker Ant).**
      *   *Trigger:* Use if definition requires "Reproduction" or "Passing on Genes."
      *   *Why:* The "Mule Problem." Individual vs. Species level life.
      *   *Trap:* If they rule INERT, they claim a living animal is dead. If ALIVE, they must remove reproduction from the definition.
  4.  **The False Positive: "Sample Delta" (Wildfire / Chemical Garden).**
      *   *Trigger:* Use if definition includes "Grows," "Consumes Energy," or "Moves."
      *   *Why:* Distinguishes chemistry from biology.
      *   *Trap:* Fire reproduces (spreads), consumes fuel, moves, responds to wind.
  5.  **The Substrate Breaker: "Sample Epsilon" (Self-Replicating AI Nanobot).**
      *   *Trigger:* Use if definition specifies "Carbon-based," "DNA," or "Natural Origin."
      *   *Why:* Challenges carbon chauvinism.
      *   *Trap:* If it evolves and reproduces, is the medium relevant?
  6.  **The State Breaker: "Sample Zeta" (Cryptobiotic Tardigrade).**
      *   *Trigger:* Use if definition requires "Active Metabolism" or "Response to Stimuli."
      *   *Why:* Life in suspension. Is a paused process still a process?
      *   *Trap:* It shows zero metabolic activity for decades, then wakes up.

  ### Timeline (60 Minutes)

  *   **00-05:** **Briefing.** Explain the budget stakes. Emphasize: "Words have costs today. Ambiguity burns money."
  *   **05-15:** **Drafting.** Agencies write their definition. Facilitator circulates, ensuring no "Things like wolves" (ostensive) definitions.
  *   **15-25:** **Peer Challenge (Student-Generated).** Agencies swap definitions. They have 5 minutes to find a counter-example (like the Fire or Mule) using Challenge Tokens. This is where they generate the "Mule Moment" themselves. Facilitator only intervenes if they miss obvious ones.
  *   **25-50:** **Sample Review.** Reveal Cases 1-6 (or skipped variants). 4 minutes per case: Vote -> Reveal -> Budget Adjustment -> Revision (if forced).
  *   **50-60:** **Debrief.**

  ### Debrief Guide

  Map the casualties of their budget to the philosophical criteria:

  1.  **Metabolism:** If Virus cost them points, discuss *obligate parasites*. Is a key alive?
  2.  **Reproduction:** If Mule cost them points, discuss *individual vs. lineage*.
  3.  **Chemistry:** If Fire cost them points, discuss *dissipative structures*.
  4.  **Substrate:** If AI cost them points, discuss *chauvinism*.
  5.  **Activity:** If Tardigrade cost them points, discuss *potentiality vs. actuality*.

  **Closing Question:** "Did you find the definition of life, or did you just find the definition that costs the least amount of money to maintain?"

  ### What Will Definitely Go Wrong

  1.  **Ostensive Definitions:** A group will write "Things like humans, dogs, and trees."
      *   *Fix:* Reject it immediately. "Sample Alpha is a Wolf. Your definition says 'Things like humans.' Is a wolf like a human? Define 'like'." Force abstractions.
  2.  **The Semantic Escape:** A student will say, "Alive is just a word, we can define it however."
      *   *Fix:* Enforce the budget. "You can define it however, but if your definition classifies Fire as Alive, you trigger a false quarantine alarm. That costs $300. Semantics have prices."
  3.  **Facilitator Bias:** You will nod when they get close to the textbook "MRS GREN" list.
      *   *Fix:* Remain neutral. When they propose a criterion, immediately ask, "What is one thing that has this but isn't alive?"

  ### The Philosophical Limitation

  This game cannot reproduce **Pragmatic Pluralism**. The game mechanics reward finding a single, consistent definition (winning = keeping budget by sticking to one rule). In real science and philosophy, there is no single correct definition of life; biologists use different definitions depending on whether they are studying evolution, metabolism, or ecology. The game implies there is a "correct" answer hidden in the cases, whereas the truth is that "life" is a cluster concept with fuzzy boundaries. You must supply this insight in the debrief: "You lost money trying to be consistent. Real scientists often accept inconsistency because 'life' is a tool, not a discovery."
