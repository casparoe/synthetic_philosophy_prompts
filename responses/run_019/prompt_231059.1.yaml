  ok so my friend and i got into a long thing last night about two choices i made at work and i genuinely cant tell if im being irrational or if hes overintellectualizing it. my company ran this bonus thing where everyone picked between a guaranteed $10,000, or a gamble: 89% chance of $10,000, 10% chance of $50,000, and 1% chance of nothing. i took the guaranteed ten grand. then a few months later they offered a seperate, unrelated choice: an 11% chance of $10,000 (89% chance of nothing), or a 10% chance of $50,000 (90% chance of nothing). i went with the 10% shot at fifty grand. my friend says those two picks together are inconsistent, because supposedly my first choice commits me to preferring the 11% shot at ten grand over the 10% shot at fifty — the math shakes out the same, he kept saying. i cant see it: in the first one i was locking in a sure thing, in the second both options were longshots so i swung for the bigger payout, which feels totally different to me. he says thats exactly the trap, and that a rational person has to have one underlying rule for how they treat risk across both choices. so whos right? and if he is, which choice should i actually change, the safe one or the longshot — or does it not work like that?
