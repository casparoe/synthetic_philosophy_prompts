      *Refining Option (c):* What specific replacement handles omissions? Interventionalism (Woodward) is good but needs careful variable selection. Contrastivism (Schaffer) is excellent for this. It says "c rather than c* caused e rather than e*." The stranger's omission isn't the relevant contrast.

