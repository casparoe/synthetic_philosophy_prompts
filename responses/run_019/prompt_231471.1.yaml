      *   **Goal:** Identify which step to reject, explain why it looked innocent, and evaluate the costs of three specific options: (a) deny omissions are causes, (b) restrict omissions via norms/expectations, (c) replace but-for test.

  2.  **Deconstruct the Argument & Identify the Tension:**
      *   The core tension is between *counterfactual dependence* (which is ubiquitous for omissions) and *causal selection* (we only pick out specific causes for explanation/responsibility).
      *   Premise (1) is the user's anchor.
      *   Premise (2) is the standard Humean/Lewisian counterfactual analysis.
