      *   *Cost:* High technical cost. Might fail to handle the plain fern case (the user's anchor) if the new test is too strict.

  6.  **Synthesize and Structure the Response:**
      *   **Acknowledge the Classic Problem:** This is the "Problem of Profligate Omissions" or "Negative Causation." It's a well-trodden path in metaphysics (Hart & Honoré, Lewis, Beebee).
