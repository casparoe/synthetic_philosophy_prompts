  3.  **Evaluate Option (a): Omissions aren't literally causes.**
      *   *View:* Omissions are "causally relevant" or figure in explanations, but aren't ontological causes (events).
      *   *Pro:* Solves the overgeneration immediately. No event = no cause.
      *   *Con:* Violates the user's desire to keep (1). It feels counterintuitive to say "My not watering didn't cause the death" when clearly the fern died *because* I didn't water it. It creates a gap between legal/moral responsibility and metaphysical causation.
      *   *Philosophers:* Beebee, Dowe (process theories).
      *   *Cost:* High intuitive cost. Requires redefining "cause" in a way that disconnects from ordinary language and moral practice.

  4.  **Evaluate Option (b): But-for is fine, but restrict omissions via norms/expectations.**
      *   *View:* Counterfactual dependence is necessary but not sufficient. We need a pragmatic or normative filter (Hart & Honoré, McGrath).
      *   *Pro:* Keeps (1) and (2) mostly intact. Explains why *I* am a cause (duty/expectation) but the *stranger* is not (no duty/expectation).
      *   *Con:* Makes causation partly normative or context-dependent. Is causation a feature of the world or our description of it? Risks conflating "cause" with "blame."
