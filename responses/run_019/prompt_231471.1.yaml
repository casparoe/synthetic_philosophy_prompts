      *   *View:* Counterfactual dependence is too weak. Need something like "process connection," "intervention," or "proportionality."
      *   *Pro:* Aims for a more objective metaphysical criterion.
      *   *Con:* Hard to formulate without ruling out legitimate omission cases. Process theories struggle with omissions (no energy transfer). Interventionist accounts (Woodward) might still let the stranger in unless restricted by variables.
