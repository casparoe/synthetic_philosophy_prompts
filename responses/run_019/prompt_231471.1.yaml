          *   *(b) Restrict via Norms/Expectations:* This is the most popular solution for those keeping (1). Discuss Hart & Honoré. Explain why it works for the stranger vs. friend. Discuss the cost (normativity in metaphysics).
          *   *(c) Replace But-For:* Discuss Process theories (fail omissions) vs. Interventionalism (might help). Discuss Proportionality (Yablo).
      *   **Recommendation:** Given the desire to keep (1), Option (b) is the most robust "middle way," but Option (c) (specifically Contrastivism or Proportionality) is the most metaphysically rigorous without invoking norms directly.
