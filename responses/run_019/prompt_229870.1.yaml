answer: |-
  You are quite right that diachronous does not mean absent, and I concede freely that the early-anthropogenic signal is a robust hypothesis for when human forcing began to perturb Earth systems. The rise in methane and CO2 during the Holocene, and the megafaunal extinctions, are genuine geological events. However, you are conflating the onset of a process with the definition of a boundary. Stratigraphy requires correlation; if I drill a core in Greenland and you drill one in the Great Barrier Reef, we must be able to identify the same moment in time. The early carbon anomalies are gradual and regionally variable—agriculture spreads at different rates, extinctions occur over millennia depending on continent and climate. They are smears, not spikes. To place a Golden Spike there would be to drive it into a fog. The plutonium-239 signal, by contrast, is physically instantaneous on a geological timescale and globally synchronous. It is not a preference for a military signal, but a recognition that this specific isotope provides the only chemostratigraphic marker from the human era that meets the rigorous criteria we apply to the Cambrian or the Pleistocene.

  Regarding your point on jurisdiction: it is true that Earth-system scientists popularized the term, but the Geological Time Scale is a specific technical construct with its own code of rules, managed by stratigraphers. If a term is to be embedded in that scale, it must survive the same scrutiny as any other epoch, regardless of its cultural resonance. Calling the mid-twentieth-century boundary a "calendar date dressed in stratigraphic clothing" misses the physical reality of the radionuclide layer. We are not selecting 1950 because it is a round number, but because the stratigraphic record itself shows a sharp inflection there across multiple proxies—plutonium, fly ash, nitrogen isotopes, and concrete particulates. The Great Acceleration is not an abstract verdict; it is a lithostratigraphic fact. To choose an older, messier boundary would be to prioritize a narrative about human history over the actual recoverability of the signal in the rock, which ultimately undermines the utility of the time scale for future geologists.
