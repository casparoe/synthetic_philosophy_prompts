answer: |-
  # Seminar Handout: Which Situated Cognition View Do You Actually Hold?

  **Instructions:** Start at **Question 1**. Answer **YES** or **NO** based on your intuition about the Otto case (Otto uses a notebook to store information he cannot remember biologically). Follow the arrows to the next question number or to a **Position Leaf**.

  ### The Decision Tree

  **1. The Constitution Question**
  When Otto retrieves information from his notebook, is the notebook *part of* the memory process itself, or is it merely a *tool* that causes a memory process inside his head?
  *   **YES (It is part of the process):** Go to **Question 4**.
  *   **NO (It is just a tool):** Go to **Question 2**.

  **2. The "Mark of the Cognitive" Question**
  Do biological brain states have a special property (e.g., original meaning, intrinsic intentionality) that notebooks and phones *necessarily* lack, regardless of how they are used?
  *   **YES:** Go to **Leaf A**.
  *   **NO:** Go to **Question 3**.

  **3. The Independence Question**
  Could Otto's brain, in principle, perform the exact same cognitive task without the notebook (perhaps more slowly or with more effort), or does the notebook fundamentally change *what* kind of thinking is possible?
  *   **YES (The brain could do it alone):** Go to **Leaf B**.
  *   **NO (The thinking is fundamentally changed):** Go to **Leaf C**.

  **4. The Parity Question**
  To count as part of the mind, must the external resource (notebook) function in roughly the same way as biological memory (e.g., constantly available, automatically trusted, easily accessible)?
  *   **YES:** Go to **Question 5**.
  *   **NO:** Go to **Question 6**.

  **5. The Bloat Check**
  If you accept the notebook is part of Otto's mind because it functions like memory, would you also accept that a website you consult for two minutes becomes part of your mind while you are looking at it?
  *   **YES:** Go to **Leaf D**.
  *   **NO:** Go to **Leaf F (Unstable Position)**.

  **6. The Complementarity Question**
  Does the external resource count as cognitive because it *mimics* the brain, or because it does something the brain *cannot* do on its own (working together as a coupled system)?
  *   **YES (Mimics the brain):** Go to **Leaf F (Unstable Position)**.
  *   **NO (Does what brain cannot):** Go to **Question 7**.

  **7. The Representation Question**
  Is the primary job of this coupled system to construct and manipulate internal models or representations of the world?
  *   **YES:** Go to **Leaf E**.
  *   **NO:** Go to **Question 8**.

  **8. The Unit of Analysis Question**
  Is the "thinking agent" the human being using the tool, or is it the dynamic system of human-plus-environment taken as a whole?
  *   **YES (The Human):** Go to **Leaf E**.
  *   **NO (The System):** Go to **Leaf G**.

  ---

  ### Position Leaves

  **Leaf A: Robust Internalism**
  *   **View:** Cognition is strictly brain-bound; external tools are merely causal inputs.
  *   **Awkward Commitment:** You must explain why heavy reliance on technology (like Otto's notebook) doesn't fundamentally alter the nature of the cognitive process, treating the environment as secondary.

  **Leaf B: Embedded Internalism (Scaffolded)**
  *   **View:** Cognition is brain-bound, but the structure of thinking is essentially dependent on environmental resources.
  *   **Awkward Commitment:** You must draw a sharp metaphysical line between "causal scaffolding" and "constitution" even when the dependency is total.

  **Leaf C: Embedded Internalism (Transformative)**
  *   **View:** Cognition is inside, but external tools enable cognitive types that are biologically impossible.
  *   **Awkward Commitment:** *Warning:* This view often collapses into Enactivism (Leaf G) in practice, as both claim the environment transforms the cognitive capacity.

  **Leaf D: First-Wave Extended Mind (Parity Principle)**
  *   **View:** External resources are cognitive if they play the same functional role as internal processes.
  *   **Awkward Commitment:** You are exposed to "Cognitive Bloat"—your phone's contact list, or a website you visit, becomes literally part of your memory.

  **Leaf E: Second-Wave Extended Mind (Complementarity)**
  *   **View:** External resources are cognitive because they complement internal processes in a coupled system, without needing to mimic them.
  *   **Awkward Commitment:** The boundary of the mind becomes vague; it is difficult to specify exactly where the cognitive system ends.

  **Leaf F: Unstable Position (Gap)**
  *   **Diagnosis:** You want the external resource to be part of the mind (Q1=Yes) but want to reject the consequences of Parity (Q5=No) or Complementarity (Q6=Yes).
  *   **Status:** **Unattractive.** You claim the notebook is "part of the mind" but deny the functional reasons (Parity) or systemic reasons (Complementarity) that justify that claim.

  **Leaf G: Enactivism**
  *   **View:** Cognition is not information processing but the adaptive regulation of sensorimotor coupling between organism and environment.
  *   **Awkward Commitment:** You must explain complex abstract thought (like philosophy) without relying on the idea that the brain processes internal representations of the world.

  ---

  ### Logical Space Analysis (For Tutors)

  The tree above maps the logical combinations of answers. Below is the diagnosis of the space, including occupied positions and empty gaps.

  | Q1 (Part) | Q2 (Mark) | Q3 (Independence) | Q4 (Parity) | Q5 (Bloat) | Q6 (Complement) | Q7 (Rep) | Q8 (Unit) | **Position / Diagnosis** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **NO** | **YES** | - | - | - | - | - | - | **Leaf A (Robust Internalism)** |
  | **NO** | **NO** | **YES** | - | - | - | - | - | **Leaf B (Embedded Internalism)** |
  | **NO** | **NO** | **NO** | - | - | - | - | - | **Leaf C (Embedded Transformative)** |
  | **YES** | - | - | **YES** | **YES** | - | - | - | **Leaf D (First-Wave Extended)** |
  | **YES** | - | - | **YES** | **NO** | - | - | - | **Leaf F (Gap: Parity without Bloat)** |
  | **YES** | - | - | **NO** | - | **YES** | - | - | **Leaf F (Gap: Mimicry denial)** |
  | **YES** | - | - | **NO** | - | **NO** | **YES** | **YES** | **Leaf E (Second-Wave Extended)** |
  | **YES** | - | - | **NO** | - | **NO** | **YES** | **NO** | **Leaf E (Second-Wave Extended)** |
  | **YES** | - | - | **NO** | - | **NO** | **NO** | **NO** | **Leaf G (Enactivism)** |

  **Diagnosis of Gaps (Leaf F):**
  The combinations leading to Leaf F are logically possible but philosophically **unattractive**. They accept external constitution (Q1=YES) but reject the two main justifications for it: functional parity (Q4/Q5) and systemic complementarity (Q6). This leaves the claim "it is part of the mind" without a mechanism, rendering the position incoherent.

  **Diagnosis of Collapse (Leaf C vs. Leaf G):**
  There is a significant risk that **Leaf C (Embedded Transformative)** and **Leaf G (Enactivism)** will collapse in student responses. Both views assert that the environment is not just a helper but transforms the cognitive capacity (Q3=NO). The tree attempts to separate them via Q1 (Constitution) and Q7 (Representation). However, students who believe the environment transforms cognition often slide into accepting constitution (Q1=YES) without realizing it. If a student lands on Leaf C but agrees that the boundary of the agent is fuzzy, they are effectively an Enactivist.

  ---

  ### ⚠️ Warning: The Embedded/Enactive Collapse

  **For Seminar Discussion:**
  Be aware that **Leaf B/C (Embedded Internalism)** and **Leaf G (Enactivism)** are the hardest to distinguish in practice.
  *   **Theoretically:** Embedded Internalism keeps cognition inside the skull (Q1=NO); Enactivism spreads it across the dynamic system (Q1=YES/Q8=NO).
  *   **Practically:** Both agree that you cannot understand the mind by looking at the brain alone.
  *   **Diagnostic Tip:** If a student says "The notebook changes what thoughts Otto can think" (Leaf C) but also says "Otto is still the thinker, not the Otto-Notebook system" (Leaf B), press them on *where* the thinking happens. If they hesitate, they are likely oscillating between Embedded Internalism and Enactivism.
