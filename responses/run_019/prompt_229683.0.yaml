answer: |-
  Dear Selection Committee, I am writing to propose a twelve-month fellowship project resulting in a book-length essay that interrogates the conceptual foundations of democratic backsliding. While the term has become ubiquitous in political science and journalism, its analytical rigor remains unproven. The central question driving this inquiry is whether the concept of democratic backsliding possesses analytical content independent of the political commitments of the observer, or whether it functions primarily as a partisan label doing rhetorical work under the guise of measurement. This is not a request to produce another country-by-country scorecard ranking nations on a slide toward authoritarianism. Instead, I intend to treat the countries usually named in this debate, such as Hungary, Poland, Turkey, and more recently the United States, as examples of what is at stake in the definition itself, not as cases to be scored in sequence. The goal is to determine if there is a neutral vantage point from which one can declare a democracy to be in decline, or if every such declaration inevitably imports a specific vision of what democracy ought to be, thereby rendering the accusation of backsliding indistinguishable from political opposition.

  Existing discussion leaves this conceptual question open even while standard democracy indices are cited as if they settled it. Organizations like Freedom House or V-Dem produce annual reports that are treated as empirical data, yet their methodologies rely on coding decisions that embed normative assumptions about the proper scope of democratic governance. When an index scores a country down because of restrictions on civil society or judicial independence, it assumes a liberal democratic baseline that populists or illiberal democrats explicitly reject. They argue that true democracy is about majoritarian will, not constraints on it. Consequently, when journalists or scholars cite these indices to prove backsliding is occurring, they are often talking past the actors they are criticizing. The indices measure deviation from a liberal ideal, but they do not prove that the liberal ideal is the only valid metric for democratic health. This creates a situation where the diagnosis of backsliding is accepted as fact within one epistemic community and dismissed as propaganda within another. The conceptual work remains undone because we have mistaken measurement for definition. We have numbers, but we do not have agreement on what is being counted, leaving the core question of whether backsliding is an objective phenomenon or a subjective judgment unresolved.

  To make progress on this stalemate, I propose testing the hypothesis that backsliding is parasitic on an unstated baseline of full democracy. The term implies a movement away from a stable point of health, but if that point of health is contested, the movement cannot be objectively verified. My approach will be to ask what, if anything, could anchor that baseline without importing one side of the political dispute. I will investigate whether there are procedural minima, such as the capacity to remove leaders via elections or the absence of political violence, that command broad enough consensus to serve as a neutral anchor. If such a baseline exists, then backsliding can be defined as the erosion of these specific mechanisms regardless of the ideological direction of the government. If no such baseline exists, then the concept collapses into a partisan weapon. This approach is superior to the obvious alternatives of either defending the indices as they are or dismissing the concept as mere rhetoric. Defending the indices uncritically ignores the legitimate philosophical dispute about the nature of democracy and alienates the very populations whose democratic commitment we hope to understand. It privileges a technocratic view that is increasingly viewed with suspicion. Conversely, dismissing the concept as mere rhetoric is intellectually lazy and potentially dangerous, as it risks normalizing genuine erosions of accountability by labeling all criticism as partisan. By treating the baseline as the variable to be solved rather than the assumption to be enforced, this project offers a path through the polarization that currently paralyzes the discourse.

  The methodology will involve conceptual analysis supported by illustrative references to the aforementioned nations. For instance, when examining Hungary, I will not ask how much its democracy score has dropped, but rather whether the changes there violate a procedural baseline that a Fidesz supporter could theoretically accept. Similarly, regarding the United States, the inquiry will not focus on polarization metrics but on whether institutional changes constitute a breach of neutral democratic rules or merely a shift in policy outcomes. This distinction is crucial. If a government consolidates power but maintains the mechanism for its own removal, is it backsliding or just governing decisively? The project will trace where the line is drawn by different observers and test whether that line holds up under philosophical scrutiny. The aim is to produce a taxonomy of backsliding claims that separates those with analytical content from those that are purely expressive.

  There are three possible conclusions to this inquiry. The first is that a neutral baseline can be established, validating the concept of backsliding as an analytical tool independent of ideology. The second is that no such baseline exists, revealing the term as inherently normative and requiring journalists to stop using it as if it were empirical. The third, and most likely, is a hybrid conclusion where certain core elements are neutral while others are contested, requiring a more nuanced vocabulary than currently exists. What will decide between these conclusions is the ability to construct a definition of democratic health that survives counterfactual testing. If I can define a baseline that a committed illiberal democrat must accept as democratic, yet show how current regimes violate it, the concept holds. If every proposed baseline is rejected by a significant faction of democratic theorists or practitioners as too liberal or too majoritarian, the concept fails. Failure for this project would be defined as an inability to move beyond the stalemate, resulting in a manuscript that merely restates the conflict without offering a conceptual resolution. It would also be a failure if the work devolves into a disguised defense of liberal democracy rather than a genuine interrogation of the concept's validity.

  Regarding feasibility, completing a book-length essay within a twelve-month fellowship is ambitious but achievable given the conceptual nature of the work. Unlike empirical projects requiring extensive fieldwork or data collection, this inquiry relies on synthesis, philosophical analysis, and existing case literature. The primary risk is scope creep, as the literature on democratic erosion is vast. To mitigate this, I will strictly adhere to the conceptual focus, using country examples only when they illuminate the definitional problem. I anticipate spending the first three months on literature review and framework construction, the next six months on drafting and testing arguments against counterexamples, and the final three months on revision and refinement. While a full commercial book might require more time for marketing and polishing, the research and drafting of the core manuscript are well-suited to a one-year timeline. I am confident that this period is sufficient to produce a rigorous draft that answers the determinate question posed.

  This project matters because the language we use to describe political change shapes the remedies we propose. If backsliding is a technical failure, the solution is institutional repair. If it is a partisan label, the solution is political persuasion. Confusing the two leads to ineffective interventions and deepened distrust. As a journalist covering science and ideas, I am positioned to translate these philosophical distinctions for a broader public audience that is weary of expert consensus that feels disconnected from their political reality. By clarifying whether democratic backsliding is a measurable phenomenon or a political argument, this essay will provide readers with the tools to evaluate claims of democratic crisis without surrendering their own judgment to indices they do not understand. I believe this fellowship would provide the necessary time and intellectual community to execute this work with the rigor it demands, ultimately contributing a clearer framework to one of the most urgent debates of our time. Thank you for considering this proposal.
