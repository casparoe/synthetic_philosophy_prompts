  I have awarded this essay a mark of 11 out of 20. You have produced a clearly structured response that engages directly with the prompt, and your explanation of Appiah captures the core intuition of his work in The Honor Code reasonably well. However, the mark is limited by a significant misrepresentation of Bernard Williams' position, which undermines the comparative conclusion you draw. While you have grasped the general theme of moral revolutions, the specific philosophical attributions need much greater care, particularly regarding the causal role of argument and the specific mechanisms each philosopher proposes.

  Your account of Appiah is the stronger half of the essay. You correctly identify that Appiah rejects the idea that moral argument alone is sufficient to end practices like duelling or slavery. Your use of the honor code as the driving mechanism is accurate, and you rightly note that practices end when they become incompatible with social identity. However, you oversimplify his view on moral argument when you claim that for Appiah arguments were never the engine of change. Appiah does not dismiss argument entirely; rather, he argues that arguments are necessary to redefine what honor requires, but they are not sufficient to motivate compliance without the social pressure of honor. For example, arguments about the brutality of duelling helped shift the meaning of courage, but it was the loss of social standing that actually stopped gentlemen from fighting. Similarly, your point about wage labour and slavery is slightly imprecise. Appiah focuses more on how slave ownership became seen as incompatible with British national honor and liberty, rather than specifically on the dignity of wage labour for working people. These are nuances that distinguish a good answer from a great one, but your basic exegesis of Appiah is passable.

  The major issue with this essay lies in your interpretation of Bernard Williams. You attribute to Williams the view that slavery was abolished because philosophers articulated better moral arguments which then collapsed the practice under their weight. This is a serious misreading of Williams' work. Williams is generally skeptical of the idea that moral history is a story of rational progress driven by philosophical argument. In discussions such as The Idea of Equality, Williams suggests that the principle of equality was always available, but the empirical beliefs about who counted as equal changed over time. He does not argue that philosophers provided the conceptual resources that caused abolition; rather, he argues that historical and social changes altered the application of existing concepts. Williams is known for emphasizing historical contingency and the limits of rational justification in ethics, so portraying him as a proponent of the view that better arguments drive moral revolutions contradicts his broader meta-ethical stance. You have likely conflated Williams with the rationalist view that Appiah critiques, which is a fundamental error in a comparative essay.

  Because your understanding of Williams is incorrect, your concluding comparison inevitably falters. You conclude that moral progress is a matter of having better arguments plus social factors, based on the synthesis of Williams (arguments) and Appiah (honor). Since Williams does not actually hold the view that better arguments drive progress, this synthesis is built on a false premise. A more accurate comparison would note that both philosophers are skeptical of pure rationalism, but they differ on what fills the gap. Appiah points to honor and social identity, while Williams points to historical changes in ethical concepts and the role of luck or contingency. Correcting this distinction is crucial for understanding the debate about moral progress.

  Despite these errors, you have shown that you can engage with complex material and construct a coherent narrative. You clearly understand the stakes of the question and have made a genuine attempt to differentiate the two thinkers. For future essays, I would advise you to be more cautious when attributing specific causal claims to philosophers, especially when those claims seem to align too neatly with a simple narrative of progress. Check whether the philosopher is describing how change happened or critiquing the idea that change happened that way. If you can tighten your exegesis of Williams and add more nuance to the role of argument in Appiah's work, your subsequent answers will improve significantly.
