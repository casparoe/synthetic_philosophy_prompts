answer: |-
  ### Essay Question

  **Course:** HIST 450: The Boundaries of Historical Inquiry
  **Assessment:** Final Take-Home Essay
  **Time Limit:** 72 Hours
  **Word Limit:** 1,200 words (+/- 10%)

  **Prompt:**
  Select **two** of the following pseudohistorical claims: (1) The Atlantis hypothesis (an advanced civilization whose memory was transmitted to later cultures); (2) Ancient Astronaut hypotheses (monumental sites/texts as records of extraterrestrial contact); or (3) Anatoly Fomenko's New Chronology (the compression of classical antiquity into the medieval period).

  First, articulate and defend a specific **demarcation criterion** that distinguishes legitimate historical revisionism from pseudohistory. This criterion must move beyond "accuracy" (since legitimate historians can be wrong) to address *methodological integrity*.

  Second, apply this criterion to your two chosen cases to demonstrate how they fail. Finally, apply the same criterion to the **Thera Eruption Chronology Debate**. In this "hard case," mainstream archaeologists and radiocarbon scientists disagree on whether the eruption occurred in the late 17th century BCE (scientific dating) or the late 16th century BCE (textual/archaeological dating). Explain why this disagreement constitutes legitimate historical inquiry rather than pseudohistory, despite involving conflicting timelines and challenges to established narratives.

  ***

  ### Model Answer

  **Title:** Immunization vs. Risk: Demarcating Historical Inquiry

  The distinction between pseudohistory and legitimate revisionism does not rest on the correctness of a conclusion, but on the relationship between the claimant and the evidence. A historian may be wrong about the date of a battle; a pseudohistorian constructs a system where the date cannot be proven wrong. To demarcate these modes of inquiry, I propose the criterion of **Non-Immunization**: legitimate historical inquiry exposes its core claims to potential falsification through consilient evidence, whereas pseudohistory employs ad hoc hypotheses to insulate core claims from refutation. This criterion, rooted in Lakatos's concept of research programmes, prioritizes methodological vulnerability over factual certainty.

  Applying this to the **Atlantis hypothesis** reveals a classic immunizing strategy. The core claim is that a prehistoric advanced civilization existed and influenced later cultures. When archaeologists fail to find material evidence of this civilization in the proposed timeframe (e.g., the Holocene), proponents do not abandon the hypothesis. Instead, they shift the goalposts: the evidence was destroyed by the cataclysm, or the knowledge was transmitted orally without material trace, or the location is elsewhere. By attributing the lack of evidence to the very cataclysm that defines the theory, the hypothesis becomes unfalsifiable. It creates a closed loop where absence of evidence is treated as evidence of the cataclysm, which in turn proves the theory. This violates Non-Immunization because no possible archaeological finding could disprove the claim; negative evidence is reinterpreted as positive confirmation of destruction.

  Similarly, **Anatoly Fomenko's New Chronology** fails the criterion through the systematic rejection of independent dating methods. Fomenko argues that conventional chronology is artificially extended, compressing Greece, Rome, and Egypt into the medieval period. To sustain this, he must dismiss dendrochronology, radiocarbon dating, and astronomical records as forged or misunderstood. When confronted with the sheer volume of cross-cultural synchronisms (e.g., eclipses recorded in both Babylonian and Chinese texts that fit conventional chronology but break under New Chronology), Fomenko posits a global conspiracy of falsification. This is an ad hoc hypothesis designed solely to protect the core claim. A legitimate historical programme would adjust the core theory to accommodate the anomaly; Fomenko's programme adjusts the evidence to accommodate the core theory. The methodology is immunized against the consilience of independent scientific and textual data.

  In contrast, the **Thera Eruption Chronology Debate** exemplifies legitimate revisionism that adheres to Non-Immunization. The dispute centers on a discrepancy between radiocarbon dating (suggesting c. 1620 BCE) and Egyptian textual chronology (suggesting c. 1525 BCE). Like the pseudohistorical cases, this involves a challenge to established timelines and the potential rewriting of Mediterranean history. However, the methodological handling of the discrepancy is fundamentally different. Both sides accept the validity of the opposing evidence types; radiocarbon specialists do not claim the Egyptian texts are forgeries, and archaeologists do not claim physics is wrong. Instead, they propose testable mechanisms for the anomaly: perhaps the radiocarbon calibration curve is flawed for this period, or perhaps the Egyptian chronology has a "ghost century."

  Crucially, these explanations are risky. If new ice-core data or a precisely dated tree-ring sequence contradicts the radiocarbon adjustment, the scientific side must concede. If a newly discovered Egyptian king list solidifies the 16th-century date, the archaeological side must concede. Neither side insulates its claim from future discovery. They are actively seeking the "anomaly that kills the theory," whereas Fomenko and Atlantis proponents seek to explain away the anomaly to save the theory. The Thera debate is driven by the expectation of consilience—the hope that physics and philology will eventually align—rather than the assertion that one must be discarded to save a narrative.

  Therefore, the demarcation lies in the treatment of dissonance. Pseudohistory treats dissonant evidence as a threat to be neutralized via ad hoc maneuvering (conspiracy, loss, destruction). Legitimate history treats dissonant evidence as a problem to be solved via methodological refinement. The Atlantis and New Chronology claims are pseudohistorical not because they are false, but because they are structurally incapable of being proven false by their authors. The Thera debate is legitimate not because it is resolved, but because it remains vulnerable to resolution. In historical inquiry, the willingness to be wrong is the only guarantee that one might eventually be right.

  ***

  ### Marking Scheme

  **Total Marks:** 20

  | Point | Criteria | Marks | Common Student Failure (Underlying Confusion) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Definition & Defense of Demarcation Criterion:** Clearly defines a methodological standard (e.g., falsifiability, consilience, immunization) and argues *why* it distinguishes history from pseudohistory. | **5** | *Confuses truth with method:* Assumes a claim is pseudohistory simply because it is factually incorrect, rather than methodologically flawed. |
  | **2** | **Analysis of Pseudohistorical Case 1:** Identifies specific ad hoc strategies (e.g., conspiracy, lost evidence) used to protect the core claim from refutation. | **3** | *Cataloguing errors:* Lists factual mistakes in the theory rather than analyzing the argumentative structure used to sustain them. |
  | **3** | **Analysis of Pseudohistorical Case 2:** Demonstrates how the second case fails the criterion in a manner comparable to the first (synthesis rather than isolation). | **3** | *Siloed analysis:* Treats the two cases as unrelated errors rather than instances of a shared epistemological failure. |
  | **4** | **Differentiation of Mechanism:** Explicitly contrasts the "immunizing" move of pseudohistory with the "risk-taking" move of legitimate inquiry. | **3** | *Surface-level comparison:* Focuses on the topics (aliens vs. volcanoes) rather than the underlying logic of evidence handling. |
  | **5** | **Application to Hard Case (Thera):** Correctly identifies why the Thera debate remains "open" and "vulnerable" rather than "closed" and "protected," despite the chronological conflict. | **4** | *False equivalence:* Argues Thera is pseudohistory because it challenges consensus, or dismisses it as settled science rather than active revisionism. |
  | **6** | **Clarity & Constraint:** Argument is coherent, follows the prompt structure, and adheres to the word limit without sacrificing depth. | **2** | *Scope creep:* Writes a general history of the cases rather than a focused philosophical argument about demarcation. |
