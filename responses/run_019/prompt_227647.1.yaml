          *   *Defense:* Defended by the **Global Welfarist** logic of Expected Value under Moral Uncertainty.
          *   *Procedure:* Annual "Moral Confidence" calibration, but with a floor for minority views to prevent total exclusion (addressing the deadlock).
          *   *Rejection of Pure Proportional:* It ignores the *magnitude* of impact (Welfarist concern).
