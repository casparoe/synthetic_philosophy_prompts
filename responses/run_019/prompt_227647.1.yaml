answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** Chair, Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Protocol and FY2024 Allocation Recommendations

  **1. Purpose**

  As you know, the Trustees have directed that we must distribute the full $2 million annual budget and may not default to the endowment. Our current voting dynamic—three distinct moral blocs resulting in a recurring 3-2-2 deadlock—renders simple majority rule unstable and consensus impossible. After reviewing the procedural proposals from our last meeting, I am circulating this memo to recommend a standing decision procedure and a concrete allocation for this cycle.

  My goal is to adopt a framework that breaks the deadlock without asking any member to violate their conscience, while ensuring the foundation acts as a unified agent rather than three warring fiefdoms.

  **2. Recommended Standing Procedure: Hedged Maximization**

  I propose we adopt a procedure of **Hedged Maximization under Normative Uncertainty**.

  Under this protocol, the committee acknowledges that while we must act on our best moral judgment, we cannot claim certainty that any single moral framework (Global Welfarism, Local Rectification, or Animal Ethics) is exclusively correct. Therefore, to maximize *expected moral value*, we must hedge against the risk that our dominant moral theory is incomplete or mistaken.

  **The Rule:**
  1.  **Primary Allocation (60%):** The majority bloc identifies the cause with the highest *potential* scale of benefit. This receives the majority of funds, reflecting the probability that their moral outlook is correct.
  2.  **Minority Floors (20% each):** The two minority blocs are guaranteed a minimum floor of funding. This is not a "compromise" but a risk-management strategy: if the majority view is morally flawed, total exclusion of the minority views risks catastrophic moral error (e.g., ignoring local justice or massive non-human suffering).
  3.  **Review:** This ratio stands for three years, after which we review whether the "confidence" in the primary moral outlook has shifted based on outcome data.

  **3. FY2024 Allocation Recommendation**

  Applying this procedure to this year's finalists, I recommend the following distribution of the $2 million budget:

  *   **$1,200,000 to the Malaria-Prevention Program (Global Welfarist Bloc)**
  *   **$400,000 to the Bail Fund & Legal-Defense Clinic (Local Rectificator Bloc)**
  *   **$400,000 to the Corporate Animal-Welfare Campaign (Animal Advocacy Bloc)**

  **4. Justification**

  This allocation is not a political "splitting of the difference." It is defensible specifically on the grounds held by the **Global Welfarist bloc**, which commands the majority.

  The Welfarist mandate is to maximize *expected* benefit per dollar. "Expected" implies a calculation of value multiplied by probability. If the Welfarist bloc assigns even a modest probability (e.g., 20-30%) to the possibility that their framework is missing crucial moral variables (such as the intrinsic value of local community cohesion or the moral standing of animals), then a diversified portfolio yields a higher *expected moral return* than a concentrated one. By allocating 60% to the highest-scale intervention (malaria), we respect the Welfarist assessment of magnitude. By allocating the remaining 40% to the other causes, we insure against the risk of normative error.

  Thus, this allocation satisfies the Welfarist demand for maximization while incorporating the minority concerns as necessary variables in the risk equation, rather than as competing political demands.

  **5. Treatment of Rejected Procedural Options**

  I considered two alternative proposals raised in our last session. I reject them for the following reasons, though I acknowledge their strengths.

  **A. The Proportional Split (Parliamentary Model)**
  *Proposal:* Divide the budget strictly according to vote share (approx. 43% / 28% / 28%).
  *Strongest Argument:* This is the only model that fully respects the **Local Rectificator** and **Animal Advocacy** blocs' demand for recognition. It treats the committee as a pluralistic democracy where minority rights are protected by guaranteed representation. It avoids the tyranny of the majority.
  *Reason for Rejection:* While procedurally fair, this model violates the **Global Welfarist** constraint of efficiency. If the malaria program saves ten lives per dollar and the others save one, a proportional split knowingly leaves value on the table. More critically, it dissolves the foundation into three separate entities. We have a single fiduciary duty; fragmenting the budget denies our responsibility to make a unified judgment about where the money does the most good.

  **B. Confidence-Weighted Scoring (The Economist's Model)**
  *Proposal:* Members assign confidence levels to their own moral outlooks; funds go to the project with the highest weighted score.
  *Strongest Argument:* This attempts to maximize moral accuracy by leveraging the intensity of our convictions. It mirrors how rational individuals make decisions under uncertainty, forcing us to quantify how "sure" we are.
  *Reason for Rejection:* This requires comparing degrees of rightness across incommensurable frameworks. There is no common currency to equate "justice for a neighbor" with "lives saved abroad."
  *Addressing the Economist's Rejoinder:* The economist argued that we implicitly make cross-outlook comparisons whenever we change our minds, so refusing to do so here is "squeamish." This conflates *diachronic* individual updating with *synchronic* institutional aggregation.
  When an individual changes their mind, they translate all options into their *own* current preference language. I can compare my past self to my present self because I am the common denominator. In this committee, there is no common denominator. A Welfarist "util" is not convertible into a Rectificator "duty unit." To assign a confidence weight is to pretend we have a shared moral metric that we simply do not possess. The Hedged Maximization model avoids this false precision by using fixed floors based on risk management rather than unverifiable confidence scores.

  **6. Next Steps**

  I ask that we vote at the next meeting to adopt the **Hedged Maximization** procedure as our standing rule. If adopted, we will immediately move to ratify the FY2024 allocation listed above.

  This path allows us to distribute the funds as the Trustees require, without asking any member to vote against their conscience. It allows the majority to pursue scale, and the minorities to ensure that our definition of "good" does not become dangerously narrow.

  I look forward to finalizing this at our meeting on November 2nd.
