      *   *Problem:* Optimizer will find ways to move tokens back, or argue that moving a token *then moving it back* is zero impact, but the intermediate state mattered. Or they will move *everything* slightly so no single change looks big.
      *   *Better yet:* Focus on the *definition* of the baseline. The "Do Nothing" baseline is the core problem in Armstrong-Levinstein.
      *   *Let's go with a "Policy vs. Outcome" setup.*
      *   *Final Choice:* **"The Baseline Bargain."**
