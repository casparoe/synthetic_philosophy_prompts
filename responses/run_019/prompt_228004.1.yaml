      *   **Goal:** Design a classroom *activity* (not just discussion) that makes students *feel* the problem before discussing it.
      *   **User's Idea:** Toy world (grid/tokens), one group writes impact rules, another plays AI trying to achieve a goal while satisfying rules.
      *   **Persona:** Expert in AI safety literature + experienced classroom game facilitator (knows how groups *actually* behave, incentive structures, predictable failures).
