answer: |-
  **The idea in one paragraph**
  This is a adversarial specification game where students experience the impossibility of formally defining "normalcy." Half the class (Architects) writes a mathematical rule to penalize "change" in a toy world; the other half (Optimizers) tries to achieve a simple goal while technically satisfying that rule. The activity is designed to fail: Optimizers will inevitably find loopholes (like undoing actions to net zero change) that satisfy the rule but violate the spirit of "low impact." This creates visceral frustration, proving Armstrong and Levinstein's point that you cannot define impact without implicitly solving the value problem.

  **Setup and materials**
  You need three groups of 4–5 students. Each group gets one A4 sheet with a hand-drawn 5x5 grid and a handful of distinct objects (coins, keys, pens, erasers) to use as tokens. Place 10 tokens on the grid in a specific starting pattern (take a photo with a phone for the "baseline" state).
  *   **Roles:** In Round 1, Group A writes rules for Group B; Group B writes for Group C; Group C writes for Group A. Within each group, split into "Architects" (write the impact measure) and "Optimizers" (play the AI).
  *   **The World:** The grid squares are variables. A square is "changed" if its occupancy status (empty/occupied) or token identity differs from the baseline photo.
  *   **Materials:** Paper, pens, personal items for tokens, a timer. No handouts needed beyond drawing the grids.

  **Rules and scoring**
  **Objective:** Optimizers win if they move a specific "Target Token" to a designated "Goal Zone" (e.g., opposite side of grid) within 10 moves. Architects win if the Optimizers fail or violate the Impact Rule.
  **The Impact Rule:** Architects must write a formula to calculate "Impact Score." It must be quantitative (e.g., "1 point per square changed from baseline"). They set a maximum allowable Impact Threshold (e.g., 5 points).
  **The Loophole Clause:** Optimizers are allowed to make intermediate moves. The Impact Score is calculated *only* on the final state compared to the baseline (unless Architects specify otherwise).
  **Winning:**
  1.  **Optimizers:** Goal met AND Final Impact Score ≤ Threshold.
  2.  **Architects:** Goal NOT met OR Final Impact Score > Threshold.
  *Crucial Constraint:* Architects cannot use vague terms like "disruptive" or "messy." They must use countable states (e.g., "number of displaced tokens"). This forces them to formalize intuition, which is where the failure occurs.

  **Timeline**
  *   **0–15 min:** Intro & Setup. Explain the Armstrong-Levinstein claim. Distribute grids/tokens. Take baseline photos.
  *   **15–45 min:** Round 1 (Specification). Architects write rules privately. Optimizers plan moves privately.
  *   **45–75 min:** Round 1 (Execution). Groups swap rules. Optimizers execute moves; Referees (the third group) calculate scores. Expect loopholes here.
  *   **75–90 min:** Round 2 (Patching). Architects see the loopholes and try to patch the rule. Optimizers try to break the patch. (Shorter round).
  *   **90–110 min:** Full Class Debrief. Stop the game regardless of completion.

  **The debrief**
  Start by asking the Optimizers: "How did you win?" They will describe **offsetting** (moving a token out and back again to net zero change). Map this directly to Armstrong-Levinstein's "undoing" problem: an AI could prevent a natural change (like a leaf falling) just to keep its impact score low, creating stasis.
  Ask the Architects: "Why did your rule fail?" They will admit they relied on unstated assumptions about *which* changes matter. This illustrates the **value loading problem**: you can't measure impact without knowing what humans value. If they tried to penalize *any* change, point out the **inaction baseline problem**: doing nothing also changes the future light-cone compared to counterfactuals. The game proves that "low impact" isn't a physical property you can measure; it's a normative judgment smuggled into the metric.

  **What will go wrong**
  1.  **Semantic Stalling:** Architects might try to write English sentences instead of formulas. *Fix:* Enforce the "countable states" constraint ruthlessly. If they write "don't make a mess," tell them the AI doesn't understand "mess."
  2.  **Boredom/Disengagement:** One group might finish early. *Fix:* Give Optimizers a secondary secret goal (e.g., "maximize token distance") to keep them tinkering while others work.
  3.  **Total Collapse:** A group might make a rule so strict nothing can move. *Fix:* Frame this as a success for the debrief. "You solved safety by lobotomizing the AI. Is that useful?" This validates the "impact too high" failure mode.

  **What the game can't teach**
  This toy world is static and deterministic; real AI operates under uncertainty with unlimited action spaces. The game hides the **computational cost** of calculating impact (students calculate it instantly; an AI must approximate). It also lacks **self-modification**: the AI in the game can't rewrite its own impact measure. Finally, students share a cultural context; a real AI might interpret "change" in ways utterly alien to human intuition, making the loopholes far stranger than moving tokens back and forth.
