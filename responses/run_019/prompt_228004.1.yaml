      *   *Candidate 2: The Room Rearrangement.* Physical objects in the room. AI has to move something from A to B. Impact measure restricts moving other things. Problem: Logistically messy, hard to define "state" precisely without photos.
      *   *Candidate 3: The Narrative State Machine.* A set of cards representing "facts about the world" (e.g., "The cup is on the table", "The light is on"). AI plays action cards. Impact measure penalizes flipping fact cards. Problem: Might be too dry.
      *   *Candidate 4 (Refined User Idea):* "The Butterfly Effect Game." A physical layout of objects (tokens on a table) representing a simplified world. One team (Architects) defines a metric for "change." One team (Optimizer) tries to achieve a goal (e.g., move Red Token to Zone X) while minimizing the metric.
      *   *Selection:* Candidate 4 is closest to the user's intuition and works best for philosophy students (focus on definitions and loopholes rather than coding). I need to make sure the "world" is rich enough to allow loopholes but simple enough to manage in 110 mins. Let's make it about *state descriptions* rather than just physical positions, to mimic the "variables" approach in impact measures.

  3.  **Refining the Design (The "State Vector" Game):**
