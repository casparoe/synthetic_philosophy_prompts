      *   Reversal confirmed.

      *   *Causal Explanation:* Treatment causes Normal BP. Normal BP causes Recovery. Treatment also has direct toxicity. Aggregate captures Total Effect (Benefit via BP + Toxicity). Subgroups condition on BP, blocking the benefit path, revealing only Toxicity. Since we choose Treatment, not BP, we care about Total Effect.

      *   *Minimal Change:* Variable is "Baseline BP" (pre-treatment). Imbalance (T group happened to have healthier BP initially) caused the aggregate illusion?
