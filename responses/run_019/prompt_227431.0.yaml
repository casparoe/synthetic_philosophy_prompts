answer: |-
  **Scenario: Hypertension Clinic Trial**

  A clinic tests a new drug (Treatment) against standard care (Control) for recovery from a vascular condition. The partitioning variable is **Post-Treatment Blood Pressure Status** (Normalized vs. Elevated), measured after treatment begins. Recovery is the outcome.

  | Group | Normalized BP | Recovered | Total | Recovery Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Treatment** | Yes | 72 | 80 | 90% |
  | | No | 4 | 20 | 20% |
  | | **Total** | **76** | **100** | **76%** |
  | **Control** | Yes | 19 | 20 | 95% |
  | | No | 48 | 80 | 60% |
  | | **Total** | **67** | **100** | **67%** |

  **Decision Rule**
  The decision-maker should trust the aggregated table and administer the Treatment.

  **Arithmetic of the Reversal**
  In the aggregated data, Treatment yields a 76% recovery rate versus 67% for Control (+9% benefit). However, within the "Normalized BP" subgroup, Treatment yields 90% versus 95% for Control (−5% harm), and within the "Elevated BP" subgroup, Treatment yields 20% versus 60% for Control (−40% harm). The trend reverses completely upon conditioning.

  **Causal Structure**
  Blood Pressure Status is a **mediator**, not a confounder: the Treatment causally influences Blood Pressure (pushing 80% of patients to "Normalized" versus only 20% in Control), and Blood Pressure influences Recovery. Conditioning on this mediator blocks the indirect pathway through which the Treatment exerts its primary benefit (lowering blood pressure), isolating only the direct toxic side effects of the drug. Since a physician assigns Treatment, not Blood Pressure status, the total effect (aggregate) is the relevant quantity for policy.

  **Minimal Change to Flip Verdict**
  If the partitioning variable were changed to **Baseline Blood Pressure Severity** (measured *before* treatment assignment), the disaggregated table becomes the correct guide. In this version, the imbalance (Treatment group having mostly mild cases) represents selection bias rather than a causal mechanism, meaning the aggregate table is confounded and the subgroups reveal the true harmful effect of the drug.

  **Causal Criteria**
  In the original mediator version, the **Total Effect** criterion ($P(Y|do(T))$) settles the question, forbidding conditioning on post-treatment variables. In the modified confounder version, the **Backdoor Criterion** settles the question, requiring conditioning on pre-treatment common causes to identify the causal effect.
