  **0.58**

  **Decomposition**

  1.  **Cognitivism (0.90):** Moral judgments must function as truth-apt beliefs for "testimony" to be coherent rather than mere influence.
  2.  **Autonomy Failure (0.60):** The core defect is agential (loss of understanding/agency) rather than purely evidential, making it distinct from scientific deference.
  3.  **No Moral Experts (0.45):** Moral expertise is sufficiently rare or uncalibrated compared to empirical domains to make default deference uniquely risky.
  4.  **Principle vs. Case (0.55):** Deferring on general principles is distinctly problematic, whereas case-deference often collapses into factual deference, weakening the universal claim.

  **Combination**
  I treat these as weighted contributions to the hypothesis "Distinctive Problem Exists" (DPE).
  $P(DPE) \approx (P_{Cog} \times 0.15) + (P_{Aut} \times 0.50) + (P_{NoExp} \times 0.25) + (P_{Scope} \times 0.10)$
  $P(DPE) \approx (0.90 \times 0.15) + (0.60 \times 0.50) + (0.45 \times 0.25) + (0.55 \times 0.10)$
  $P(DPE) \approx 0.135 + 0.30 + 0.1125 + 0.055 = \mathbf{0.6025}$
  *(Adjusted downward to 0.58 to account for unmodeled covariance between expertise and autonomy.)*

  **Single Biggest Lever**
  **Factor 2 (Autonomy vs. Epistemic).** If you convince me the failure is purely epistemic (I just lack evidence), my credence drops to ~0.20 because it becomes identical to historical/scientific testimony; if you convince me it is constitutively agential (I lose moral worth by not reasoning), my credence rises to ~0.85.

  **Diagnosis of Disagreement (0.6 vs 0.25)**
  You (0.6) likely weight **Factor 2** heavily, viewing moral reasoning as a personal responsibility that cannot be outsourced without loss. Your friend (0.25) likely treats morality as **Factor 2 (Epistemic)** and **Factor 3 (Experts)**: she probably believes moral knowledge is truth-apt and cumulative (like science), meaning if an expert exists, deference is rational and carries no *distinctive* penalty beyond standard error risk.
