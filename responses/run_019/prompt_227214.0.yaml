answer: |-
  This is a classic reconstruction of the challenge posed by the **Knobe Effect** (or the Side-Effect Effect) to traditional Action Theory. You have built a very tight argument. It is tight because it mirrors the actual philosophical debate: if the data is real, and the cases are truly identical in psychology, then moral valence *must* be doing the work.

  To save the practice of criminal law and action theory from your "insane" conclusion (Step 8), you need to break the chain before it reaches the metaphysical claim about intentionality.

  Here is the diagnosis: **You should reject Step (2).**

  ### Why Step (2) Looked Fine
  Step (2) claims: *"The harm and help cases differ in exactly one respect: whether the side effect is bad or good. The chairman's mental states are identical."*

  This looks undeniable because the **vignette text** stipulates it. The story says the chairman has the same beliefs, the same desires (profit), and the same attitude ("I don't care") in both cases. As a TA, you are grading papers based on the text provided. From the perspective of the *surface grammar* of the vignette, the mental states are identical. It feels like a controlled variable in an experiment.

  ### Why You Should Reject It
  You should reject (2) because the vignette text is not a complete inventory of the agent's psychology. While the *explicit* propositional attitudes (belief that $X$ will happen, desire for profit) are identical, the **normative quality of the will** is not.

  In the **Harm** case, the agent is exhibiting **indifference to a prohibitory norm** (do not harm). This manifests a specific psychological state: a willingness to violate a duty, or recklessness regarding a protected interest.
  In the **Help** case, the agent is exhibiting **indifference to a commendatory norm** (help when you can). This manifests a different psychological state: a lack of supererogatory motivation, but not a willingness to violate a duty.

  Philosophers like **Nomy Arpaly**, **Michael Smith**, or **Holly Smith** argue that "mental states" are not just belief/desire pairs; they include the agent's sensitivity to moral reasons. To be indifferent to harm is to have a different *quality of will* than to be indifferent to help. One involves a negative regard for rights/welfare; the other involves a neutral regard for welfare.

  Therefore, the psychologies are **not** identical. The moral valence of the outcome reveals a difference in the psychological state that the vignette text was too blunt to capture.

  ### The Cost of Rejecting (2)
  1.  **Richer Psychology:** You must commit to a "thicker" theory of mental states. You can't just count beliefs and desires; you have to count attitudes toward norms. This makes Action Theory more complex, but not confused.
  2.  **Vignette Limitations:** You have to admit that the standard Knobe vignettes are philosophically naive descriptions of mental states. They control for *explicit* psychology but fail to control for *implicit* normative attitudes.
  3.  **Saving the Data:** You keep the data (people judge differently) but explain it differently. They judge differently *because* they detect a psychological difference (quality of will), not because they are letting morality override psychology.

  ### Addressing Your Specific Question: Can you keep (4) and deny (6)?
  You asked: *"Especially whether I can keep a strong reading of (4) while denying (6), or whether those two stand or fall together."*

  **They effectively stand or fall together, mediated by (5).**

  *   **Step (4)** says: The truth of "intentionally" depends partly on moral status, not just psychology.
  *   **Step (5)** says: If a concept's application depends on moral status, it is a moral concept.
  *   **Step (6)** says: "Intentionally" is a moral concept.

  If you want to keep **(4)** (Morality determines intentionality) but deny **(6)** (It's a moral concept), you **must reject Step (5)**.
  You would have to argue that "intentionally" is a **thick concept** (like "cruel" or "brave") that is *both* descriptive and evaluative simultaneously, without collapsing into *just* a moral concept.

  **However, this does not save you from Step (8).**
  Even if you reject (5) and call it a "thick descriptive concept," Step (8) still looms. Step (8) is insane because it implies **identical psychologies yield different liability.**
  *   If you keep **(4)**, you admit that two agents with identical psychologies (as per the vignette) differ in whether they acted intentionally based *only* on the outcome's morality.
  *   If that is true, then criminal liability *does* depend on moral luck/outcome valence, not just the agent's mind.
  *   Rejecting (5) changes the *label* of the concept, but it doesn't change the *truth conditions*. The law would still be punishing based on moral valence, not psychological fact.

  **Therefore, to truly avoid the "insane" conclusion (8), you cannot keep (4).**
  You must reject (4). To reject (4), you must reject (2).

  ### Summary for Your Grading
  If you reject **(2)**, the argument dissolves like this:
  1.  People judge the cases differently (Data stays).
  2.  **But** the mental states are *not* identical (Reject 2). Indifference to harm is psychologically distinct from indifference to help.
  3.  Therefore, the difference in judgment is driven by the difference in psychology, not directly by the moral status of the outcome (Reject 4).
  4.  Therefore, "intentionally" remains a descriptive, psychological concept (Reject 6).
  5.  Therefore, Action Theory and Criminal Law are not confused; they are tracking the subtle psychological difference that the folk (and the TA) initially missed (Reject 8).

  This allows you to respect the data, teach the Knobe Effect as a challenge to *simplistic* models of psychology, and still tell your students that "doing it on purpose" is about what's in the head, not just whether the outcome was good or bad.
