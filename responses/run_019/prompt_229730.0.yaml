prompt: |-
  A guy in my game theory discord posted this summary of the program equilibrium result (the Tennenholtz thing where players in a prisoner's dilemma submit programs that can read each other's source code) and it's been bugging me:

  'Program equilibrium solves the prisoner's dilemma. The setup is that instead of picking cooperate or defect, each player submits a computer program, and the programs get to see each other's source code before deciding. Since defection is no longer hidden, cheating becomes impossible, so both players' programs cooperate and the dilemma dissolves. The trick is that each program simulates the other one, sees that it's going to cooperate, and cooperates back -- so cooperation turns out to be the rational move in the prisoner's dilemma after all, not just in the repeated version. The catch is that this only works if the two programs are exact copies of each other.'

  I have a feeling a couple of things in there are off -- the 'cheating becomes impossible' bit especially, and I thought the original construction did require identical programs but wasn't the interesting version of the idea. But I'm not confident enough to call him out. Can you audit this? Go through it claim by claim: what's an accurate statement of the result, what's a defensible simplification for a casual audience, and what's actually wrong or conflates program equilibrium with something else (like the folk theorem for iterated games, or Newcomb-style reasoning). Also: does anything true in the summary actually support his closing claim that this 'solves' the prisoner's dilemma, or does the corrected version support something weaker?

  One thing I care about: please keep separate what I'd call the settled math (the equilibrium result itself and what it does and doesn't establish) from stuff that's genuinely contested or open among people who work on this -- like how robust the cooperative equilibria are, whether the equilibrium-selection problem undermines the whole thing, and whether this tells us anything about real agents. Don't present a contested take as the consensus, and if a common criticism of the result is actually a misunderstanding, say so rather than crediting it.
