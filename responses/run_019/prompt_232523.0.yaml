          *   Case 1: Insider trading (illegal) vs. Quant/Alternative Data (legal). Both profit from informational asymmetry.
          *   Case 2: Sports betting (legal) vs. Election betting (restricted). Both aggregate information/probabilities.
          *   Case 3: No-Trade Theorem (Grossman-Stiglitz/Milgrom-Stokey). If markets are purely for information aggregation, rational agents shouldn't trade based on information alone because the trade *signal* reveals the information.
      *   **The Question:** What theory of information/market purpose underlies these practices? Is there a coherent line, or is it a mess of competing values (fairness, property rights, price discovery)? What would change if markets were *actually* run to aggregate information, and how does the no-trade theorem fit?
      *   **Constraint:** Separate what rules *strictly presuppose* from what they *merely fit well with*.

  2.  **Deconstruct the Three Cases:**

      *   **Insider Trading vs. Quant Research:**
          *   *Legal/Regulatory View:* Insider trading violates fiduciary duty and property rights over information. It undermines trust in the market's integrity (fairness).
          *   *Economic View:* Both incorporate information into price. Insider trading might be *more* efficient at price discovery but destroys participation (adverse selection).
          *   *Coherence:* The distinction rests on *property rights* and *fiduciary duty*, not on the epistemic status of the information.

      *   **Sports vs. Election Betting:**
          *   *Legal/Regulatory View:* Sports are "clean" (mostly). Elections involve governance, potential manipulation, and integrity of the democratic process.
          *   *Economic View:* Both are prediction markets. Election markets might be better at aggregating political sentiment.
          *   *Coherence:* The distinction rests on *social stability* and *moral hazard* (incentives to corrupt the outcome), not on information theory.

      *   **No-Trade Theorem:**
          *   *Theory:* Common Knowledge of Rationality + Informational Motivation = No Trade.
          *   *Reality:* Trade happens.
          *   *Resolution:* People trade for liquidity, hedging, or differences in priors/models (not just private info). Or, agents aren't perfectly rational/common knowledge.

  3.  **Synthesize the "Theory of Information":**
      *   Current practice doesn't have a *single* theory of information. It has a *pragmatic* theory mixed with *legal* and *moral* constraints.
      *   It treats information as **Property** (who owns it?) and **Risk** (does it destabilize the system?).
      *   It does *not* treat information purely as a **Public Good** to be maximized (which would favor insider trading and election betting).

  4.  **Address the "Coherent Line" Question:**
      *   Is there a coherent line? *Strictly speaking, no, not if the goal is purely information aggregation.*
      *   Is there a coherent line if the goal is *market participation + stability*? *Yes.*
      *   The "Fairness" argument (level playing field) is often a proxy for "Market Participation." If small investors think the game is rigged (insiders), they leave. Liquidity dries up.
      *   Quant funds are seen as "work" (earning the alpha) rather than "theft" (breaching duty).

  5.  **Address the No-Trade Theorem:**
      *   This is crucial for a scientist. It's a "frictionless vacuum" model.
      *   In reality, trade happens because of *noise traders*, *liquidity needs*, and *heterogeneous priors*.
      *   If markets were run *strictly* for information aggregation, we would need to subsidize noise or mandate participation to prevent the unraveling.

