      *   The core tension: You can't have perfect semantic fidelity + perfect formal fidelity + perfect naturalness in a target language (the "Translation Trilemma").

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Feature Identification:* A theory needs to know *what* counts as form. Is it meter? Rhyme? Lexical repetition (like the "room/rain/bloom" chain)? Syntax?
