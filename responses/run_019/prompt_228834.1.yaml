          *   Scoring four approaches (Literal, Formal Equivalence, Free/Adaptive, Constraint-Satisfaction) against the list.
      *   **Constraints:** No citations/bibliography needed. Focus on criteria.

  2.  **Deconstruct "Form-Preserving Translation":**
