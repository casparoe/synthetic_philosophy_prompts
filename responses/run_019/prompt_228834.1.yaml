      *   *Distinctions:* Don't say "it sounds nice" when you mean "it rhymes." Don't confuse "I used a constraint" with "the reader feels the constraint."
      *   *Form/Semantic Overlap:* In the user's poem, "Bloom is my word for pain" links the flower image to the emotion. If you change "bloom," you lose the link. The theory must address this fusion.
      *   *Deviation/Compensation:* If I lose a rhyme in line 2, do I add one in line 3? Is that cheating or art?
      *   *Nature of Preservation:* Am I preserving the *rule* (e.g., "last word = first word") or the *effect* (a sense of linking)?
      *   *Necessary vs. Prejudice:* Is "literal meaning" actually necessary? Or is that just a 20th-century bias?
      *   *Impossibility:* Some things can't coexist. Perfect form + perfect meaning is usually impossible.

  4.  **Refining the Desiderata List (Structuring for the User):**

