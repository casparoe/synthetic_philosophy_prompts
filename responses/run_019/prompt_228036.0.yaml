          *   *Verdict:* Logically potent. It presses the intuition that truth doesn't change, only our access to it.

      *   **Move (3) Ola:** Distinguishing "Truthmaker" from "Truth Value".
          *   *Claim:* The *event* makes it true, not the prior state of the universe.
          *   *Reasoning:* Truth supervenes on being. No being (battle) yet $\rightarrow$ no truth.
          *   *Assessment:* This is a presentist/growing block defense. It challenges Dan's implicit eternalism.
          *   *Verdict:* Metaphysically consistent if you reject eternalism. But Dan can argue that the *proposition* still had a value, even if the truthmaker didn't exist yet.

      *   **Move (4) Dan:** The "Soft Fact" / Ockhamist Challenge.
