          *   *Claim:* Propositions exist independently of utterances.
          *   *Reasoning:* Even if no one bets, the state of affairs (battle or no battle) obtains or doesn't. The fatalist argument targets the *proposition*, not the *speech act*.
          *   *Assessment:* This is the standard Platonist/Realist rebuttal. Philosophy of logic usually deals with propositions, not just sentences/utterances.
