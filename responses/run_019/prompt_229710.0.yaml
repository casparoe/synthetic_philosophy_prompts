answer: |-
  **Setting:** *The coffee station in the hallway outside the main lecture hall. A banner reads "Causation & Culpability: Tort Law Workshop." Two philosophers, ELENA and MARCUS, are waiting for the espresso machine.*

  **Elena:** That was a brave presentation, Marcus. Claiming omissions aren't causes in a room full of tort scholars is like waving a red flag at a bull.

  **Marcus:** *(Smiling)* Better a bull than a zombie, Elena. If we're going to talk about what makes the world tick, we have to talk about energy, processes, events. "Nothing" doesn't tick. "Nothing" doesn't transfer momentum. When the gardener fails to water the plant, the plant dies because of evaporation and cellular decay, not because of the gardener's absence.

  **Elena:** But that's just physics, not causation. Causation is about difference-making. If the gardener *had* watered the plant, it would have lived. If he *hadn't* failed to water it, it would have lived. The absence of water is the difference between the living world and the dead world. Why privilege the physiological process over the counterfactual dependence?

  **Marcus:** Because if you privilege counterfactual dependence without a physical process, you get an explosion of causes. I didn't water the plant either. The rain didn't fall. The sun shone too brightly. All of those are counterfactually necessary conditions for the death. We single out the gardener because he had a *duty*. That's normative, not metaphysical. You're smuggling the blame into the causation.

  **Elena:** I'm not smuggling it; I'm acknowledging that causation is contrastive. We don't ask "What caused the death?" in a vacuum. We ask "Why did the plant die *now* rather than *later*?" or "Why did it die *under this care* rather than *under competent care*?" The gardener's omission is a cause relative to the expected background. That's not just blame; that's how we carve up reality.

  **Marcus:** Okay, let's push that. Take the bystander and the drowning swimmer. I'm standing on the shore. You're drowning. I don't throw the rope. You die. On your view, my standing still caused your death.

  **Elena:** Yes.

  **Marcus:** But physically, I am inert. The water filled your lungs. The current dragged you under. Those are the positive events. If I say my standing still caused your death, I imply I exerted some influence on you. I didn't. I just… wasn't helpful.

  **Elena:** You're conflating "influence" with "physical pushing." If I shoot you, I alter your trajectory. If I promise to catch you and then step aside, I alter your trajectory just as surely, by removing the safety net you were relying on. In the swimmer case, if there's a specific relationship—say, I'm your lifeguard—my stillness is the salient reason you died.

  **Marcus:** There it is again! "Salient." "Lifeguard." That's all normative. Let's strip the norm away. If I'm just a stranger, do you still say I caused your death?

  **Elena:** *(Pauses)* Counterfactually, yes. Legally, no, because there's no duty. But I want to say the causal relation exists even if the liability doesn't. It's a cause without culpability.

  **Marcus:** That's where we break. I think it's culpability without causation. And here's why it matters: The Doctor Case. Triage. One ventilator, two patients. Doctor gives it to Patient A. Patient B dies because the doctor *withheld* the machine.

  **Elena:** The doctor caused Patient B's death by omission.

  **Marcus:** If you say that, you say the doctor *killed* Patient B. Metaphysically, you make the doctor the agent of death. On my view, the virus killed Patient B. The doctor allowed the virus to run its course. We might blame the doctor for the allocation, or praise him for it, but we shouldn't say he caused the death in the same way he would have if he'd injected Patient B with potassium chloride.

  **Elena:** But the outcome is identical. The body stops functioning at T-minus-10 because of the doctor's decision. If we say "the virus caused it," we let the doctor off the hook metaphysically. It feels like a euphemism.

  **Marcus:** It's not a euphemism; it's precision. If we conflate letting die with killing, we lose the ability to distinguish between active euthanasia and palliative care. Both result in death. Both involve omissions somewhere in the chain. But the physical processes are radically different.

  **Elena:** Let's try a case where the physics looks identical. The Floodgates. Imagine a reservoir. Scenario One: I actively open Gate A. The water rushes through. Scenario Two: Gate B is supposed to be closed by a mechanism. I fail to engage the mechanism. The gate remains open. The water rushes through. The volume of water, the speed, the damage downstream is identical.

  **Marcus:** Okay.

  **Elena:** In Scenario One, you agree I caused the flood. In Scenario Two, you say I didn't cause the flood; the water pressure did. But at the moment the water passes the threshold, the physical state of the world is indistinguishable. Why is there a causal fact in one world and not the other?

  **Marcus:** Because the history is different. In one, I initiated a motion. In the other, I failed to prevent one. The causal chain in the first originates in my muscles. In the second, it originates in the hydrostatic pressure of the dam.

  **Elena:** But my failure to engage the mechanism is part of the history too. It's a negative fact. "The lever was not pulled." That fact, combined with the pressure, entails the flood.

  **Marcus:** You're treating negative facts as ontological peers with positive facts. I don't buy it. "The lever was not pulled" is just a shorthand for "No event of pulling occurred." Absences aren't events. They don't have locations or durations in the same way.

  **Elena:** They have durations. I didn't pull the lever for ten seconds.

  **Marcus:** *(Laughs)* You're measuring the duration of a non-event. That's like measuring the weight of a hole.

  **Elena:** Holes have causal powers! If there's a hole in my boat, the boat sinks. Is the hole a positive entity? Or is it the absence of hull?

  **Marcus:** The hole is the arrangement of the surrounding hull. The water enters because of the pressure differential and the lack of barrier. The *lack* isn't doing the work; the *pressure* is.

  **Elena:** This brings us to the law, Marcus. Does this metaphysical nitpicking change anything for tort liability?

  **Marcus:** It should. If we keep causation pure—positive processes only—then we can be clear about where the duty kicks in. In the floodgate case, for the open gate, we prove causation. For the failed-to-close gate, we prove duty and breach, and we say the breach *allowed* the cause to operate. It keeps the "but-for" test from becoming a "but-for-everything-that-didn't-happen" test.

  **Elena:** But the law treats them the same. Strictly. If I fail to close the floodgate when I have a duty to do so, I am liable for the damage just as if I opened it. If your metaphysics says "no causation" in the second case, then the law is systematically false about causation.

  **Marcus:** Or the law uses "cause" pragmatically. It means "legally relevant condition."

  **Elena:** Exactly! So why fight for a metaphysics that contradicts the pragmatic usage? If the law needs omissions to be causes to assign liability, and our best theory of causation says they aren't, maybe our theory is too narrow.

  **Marcus:** Because if we expand the theory to include omissions, we lose the constraint. If omissions are causes, then everyone who didn't send money to famine relief caused the famine.

  **Elena:** No, because of the contrast I mentioned earlier. We select causes based on what was abnormal or expected. In the famine case, my not sending money is background. In the gardener case, the not-watering is foreground. The metaphysics of causation includes the context.

  **Marcus:** So you admit it's context-dependent?

  **Elena:** I admit it's interest-relative.

  **Marcus:** And I say that proves it's not purely metaphysical. Metaphysics is how the world is, not what we're interested in.

  **Elena:** *(Sips coffee)* Here's the rub. If we adopt your view—that omissions aren't causes—we create a gap between liability and causation. We say, "You are liable for the harm, even though you didn't cause it." That seems to break the core intuition of tort law: that you pay for what you break.

  **Marcus:** I don't break it. I fail to mend it. There is a moral difference.

  **Elena:** Is there? If I unplug your ventilator, I kill you. If I see it's unplugged and don't plug it back in, knowing you'll die, I kill you. The moral weight feels the same. The causal structure feels the same. Your view requires us to say, "In case one, he caused death. In case two, he didn't cause death, but he's just as blameworthy."

  **Marcus:** Yes. Because in case two, his blameworthiness comes from the violation of a duty to aid, not from the production of a harm.

  **Elena:** But the harm is the same.

  **Marcus:** The harm is the state of the victim. The *production* of that state is different.

  **Elena:** *(Thinks for a moment)* Okay. Let's locate the disagreement. You think the world is made of positive events and processes. I think the world includes absences as real difference-makers.

  **Marcus:** Roughly.

  **Elena:** But we both agree that for legal purposes, the gardener, the doctor, and the floodgate operator should be liable.

  **Marcus:** Yes.

  **Elena:** So the dispute isn't about who pays. It's about whether we describe the payment as "repairing a cause" or "answering for a failure."

  **Marcus:** Precisely. And I think it matters. If we call omissions causes, we risk inflating the power of agents. We become responsible for everything we don't stop.

  **Elena:** And I think if we *don't* call them causes, we risk mystifying the connection between the agent and the harm. We turn causation into a physicalist fetish that ignores how humans actually interact with the world—by planning, expecting, and failing.

  **Marcus:** So, is this a disagreement about the world? Or about which contrasts we care about for legal purposes?

  **Elena:** I think it's about whether "causation" is a tool for describing physics or a tool for describing responsibility.

  **Marcus:** I want it to be physics, so the law can layer responsibility on top of it cleanly.

  **Elena:** I want it to be responsibility, because the law doesn't care about physics unless it serves justice.

  **Marcus:** *(Gestures toward the door)* Well, the next panel is "Counterfactuals and Preemption."

  **Elena:** *(Smiles)* Shall we go see if they preempt the need for us to agree?

  **Marcus:** Lead the way. But I still maintain the gardener didn't kill that plant.

  **Elena:** And I maintain your refusal to water it is why it's dead.

  **Marcus:** Semantics, Elena.

  **Elena:** Metaphysics, Marcus.
