prompt: |-
  Anglo-American criminal law generally refuses to punish bystanders who fail to rescue: a stranger who watches a child drown in a shallow pond, doing nothing, commits no crime, while someone who pushes the child in commits murder. Yet the same legal system treats certain omissions as full causes of death -- a parent who refuses to feed an infant, or a nurse who disconnects a ventilator out of spite, is guilty of homicide, not merely of failing to prevent a death. Meanwhile the civil law of negligence routinely holds defendants liable for harms they failed to prevent when a duty of care existed. What theory of causation, or of moral responsibility, does this pattern of doctrines presuppose? Reconstruct the implicit view: does the practice assume that omissions are not really causes (with the special-duty cases as pragmatic exceptions), or that omissions cause but normally do not ground responsibility, or something else, such as a view on which causation itself is duty-relative? Say whether the three parts of the practice -- no bystander liability, homicide by omission under special duties, negligence liability for failures to act -- presuppose consistent commitments or pull in different directions, and what would have to change in the doctrine if we instead adopted either a purely moralized view (an omission is a cause whenever a reasonable person would have acted) or a purely metaphysical one (omissions are never causes, full stop).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** Anglo-American criminal law distinguishes sharply between acts (pushing a child) and omissions (watching a child drown), generally punishing the former but not the latter *unless* a special duty exists (parent, nurse). Civil negligence, however, often liabilities omissions based on a duty of care.
      *   **Key Question:** What theory of causation or moral responsibility does this pattern presuppose?
      *   **Specific Options to Evaluate:**
          1.  Omissions aren't causes (special duties are pragmatic exceptions).
          2.  Omissions cause but don't ground responsibility (normally).
          3.  Causation is duty-relative.
      *   **Consistency Check:** Do the three parts (no bystander liability, homicide by omission, negligence) presuppose consistent commitments or pull in different directions?
      *   **Counterfactual Analysis:** What would change if we adopted:
          1.  A purely moralized view (omission = cause if reasonable person would act).
          2.  A purely metaphysical view (omissions are never causes).

  2.  **Analyze the Current Legal Landscape (The "Pattern"):**

      *   *Criminal Law (General Rule):* No duty to rescue strangers. Act/omission distinction is strong. Causation is usually required for result crimes (homicide).
      *   *Criminal Law (Exception):* Special relationships (parent/child, contractual duties like nurses). Here, omission = homicide.
      *   *Tort Law (Negligence):* Duty of care is central. If a duty exists, failure to act (omission) can be the proximate cause of harm.
      *   *Implicit Theory:* The law seems to treat causation not as a brute metaphysical fact but as a *normative* concept tied to duty. If I have no duty, my inaction isn't legally "causal." If I have a duty, my inaction *is* legally "causal."

  3.  **Evaluate the Theoretical Options:**

      *   *Option 1: Omissions aren't causes (Metaphysical View).*
          *   If omissions aren't causes, how do we punish parents/nurses for homicide? We'd have to say they didn't cause the death but are punished for a status or a separate duty violation. But the law labels it "homicide" (causing death). So, this doesn't fit well unless we treat the special duty cases as legal fictions.
      *   *Option 2: Omissions cause but don't ground responsibility (Moral/Policy View).*
          *   This suggests the physics of causation are present (not feeding *causes* starvation), but policy restricts liability. This fits the bystander rule well (liberty vs. welfare). But it struggles to explain why the *label* changes from "non-criminal" to "homicide" based on duty.
      *   *Option 3: Causation is Duty-Relative (Normative View).*
          *   This is the strongest fit for the *legal* practice. Legally, "cause" implies "legally sufficient cause." An omission is only a legal cause if there was a duty to act. This unifies the criminal and civil sides: Duty creates the causal link.

  4.  **Assess Consistency:**

      *   *Criminal vs. Civil:* Are they consistent?
          *   Criminal: High bar for duty (status, contract).
          *   Civil: Broader duty (foreseeability, proximity).
          *   *Tension:* They pull in different directions regarding *scope* of duty, but agree on the *structure* (No Duty = No Liability for Omission).
          *   *Act/Omission Distinction:* Both maintain it, but civil law erodes it more easily via "duty of care."
      *   *Conclusion:* Structurally consistent (Duty is the switch), but normatively divergent (Criminal law values liberty more; Tort law values compensation/risk allocation).

  5.  **Counterfactual Analysis (Changing the Doctrine):**

      *   *Scenario A: Purely Moralized View (Omission = Cause if Reasonable Person Would Act).*
          *   *Impact:* Collapses the act/omission distinction. The bystander becomes a murderer.
          *   *Problem:* Over-criminalization. Infinite liability. Violates liberal autonomy (you are your brother's keeper).
          *   *Doctrinal Change:* Need a "Bad Samaritan" statute. Homicide statutes expanded.
      *   *Scenario B: Purely Metaphysical View (Omissions are Never Causes).*
          *   *Impact:* Parents/nurses cannot be guilty of homicide for starving/disconnecting.
          *   *Workaround:* Create specific crimes for "failure to perform duty" (misdemeanors) rather than result crimes (homicide).
          *   *Problem:* Moral intuition rebels. A starving baby is the parent's fault. Punishment would be disproportionately light compared to the harm.

  6.  **Synthesize and Structure the Argument:**

      *   **Introduction:** State the thesis. The law presupposes a *normative* theory of causation, where legal causation is contingent on the breach of a prior duty. It is not purely metaphysical nor purely moral, but *institutional*.
      *   **Reconstructing the Implicit View:** Argue for the "Duty-Relative Causation" model. Explain why the other two (metaphysical negation vs. moral causation) fail to explain the *special duty* exception.
      *   **Consistency Check:** Analyze the triad (Bystander, Special Duty, Negligence).
          *   *Consistency:* All rely on Duty as the gateway.
          *   *Tension:* Criminal law restricts duty (liberty); Tort law expands it (loss spreading).
      *   **Counterfactual 1 (Moralized View):** Discuss the "Bad Samaritan" shift. Expansion of liability. Erosion of liberty.
      *   **Counterfactual 2 (Metaphysical View):** Discuss the "Status Crime" shift. Homicide charges disappear for omissions. Punishment mismatch.
      *   **Conclusion:** Summarize. The current system is a pragmatic compromise between metaphysical skepticism about omissions and moral demands for accountability in relationships.

  7.  **Refine the Philosophy:**
      *   Need to reference key legal philosophers implicitly or explicitly (Hart & Honoré on causation, Moore on metaphysics, Husak on overcriminalization).
      *   Ensure the distinction between *factual cause* (but-for) and *legal/proximate cause* is clear. The prompt asks about the theory presupposed by the *doctrines*.
      *   *Self-Correction during drafting:* Be careful not to say Tort law *always* punishes omissions. It requires a duty of care. The prompt notes this ("when a duty of care existed"). So the structural parallel holds.

  8.  **Final Polish:** Check tone (analytical, philosophical, legal). Ensure all parts of the prompt are answered. (Theory reconstruction, Consistency check, Counterfactual analysis).

      *(Self-Correction on "Causation is Duty-Relative"):* Is it that causation *itself* is relative, or that *responsibility* is relative to causation + duty? The prompt asks if the practice assumes omissions aren't causes, or cause but no responsibility, or causation is duty-relative. The most accurate legal description is that *legal* causation is duty-relative, even if *factual* causation is debated. I will argue the law treats legal causation as normative.

  9.  **Drafting the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  The pattern of doctrines in Anglo-American law presupposes a **normative theory of legal causation**, specifically one in which causal responsibility for omissions is contingent upon the breach of an antecedent legal duty. The law does not treat causation as a brute metaphysical fact independent of legal status, nor does it treat it as a purely moral judgment of reasonableness. Instead, it adopts a hybrid view: an omission is treated as a legal cause of harm *if and only if* the actor stood in a relationship to the victim that imposed an affirmative duty to act.

  Here is the reconstruction of the implicit view, an analysis of its internal consistency, and the doctrinal consequences of shifting to purely moral or metaphysical theories.

  ### 1. Reconstructing the Implicit View: Duty-Relative Causation

  The legal practice rejects the **purely metaphysical view** (that omissions are never causes) because it routinely convicts parents and nurses of homicide for omissions. If omissions were metaphysically incapable of causing death, these convictions would require legal fictions that the law does not openly acknowledge; the law insists the parent *caused* the death, not merely that they violated a rule.

  The practice also rejects the **purely moralized view** (that an omission is a cause whenever a reasonable person would have acted) because it refuses to punish the bystander at the pond. A reasonable person would save the drowning child; yet the law says the bystander did not legally cause the death.

  Therefore, the system presupposes that **legal causation is duty-relative.** In this framework, "cause" in the legal sense is not a description of physical mechanics but a conclusion of imputation.
  *   **The Bystander:** Has no duty $\rightarrow$ Inaction is not a legal cause $\rightarrow$ No liability.
  *   **The Parent/Nurse:** Has a duty $\rightarrow$ Inaction is a breach $\rightarrow$ Inaction becomes a legal cause of the result $\rightarrow$ Homicide liability.
  *   **The Negligent Defendant:** Has a duty of care $\rightarrow$ Failure to act is a breach $\rightarrow$ Liability for resulting harm.

  This view treats the act/omission distinction not as a metaphysical boundary but as a **limiting principle of liability**. It assumes that while physical events (starvation, drowning) occur regardless of human intervention, *responsibility* for those events attaches to omissions only when the law has specifically assigned the risk of non-intervention to a specific agent.

  ### 2. Consistency of the Three Doctrinal Parts

  Do the three parts of the practice (no bystander liability, homicide by omission, negligence) presuppose consistent commitments? **Structurally, yes; normatively, they pull in different directions.**

  *   **Structural Consistency:** All three doctrines rely on the same logical operator: **Duty**. In criminal law (bystander vs. parent) and tort law (negligence), the presence of a duty is the switch that turns an omission into a culpable cause. There is no contradiction in saying "Omissions are not punishable unless a duty exists," whether in tort or crime.
  *   **Normative Tension:** The tension lies in *how* that duty is generated.
      *   **Criminal Law (Liberty-Protecting):** Restricts duties to specific statuses (parent, contract) or voluntary assumptions of care. It prioritizes individual liberty and fears the "slippery slope" of general moral enforcement.
      *   **Tort Law (Loss-Spreading):** Generates duties more broadly based on foreseeability and proximity. It prioritizes compensation and risk allocation.
      *   **The Pull:** The criminal law treats the duty as a rare exception to the rule of non-liability, while tort law treats the duty as a common tool for justice. This creates a friction where a nurse might be civilly liable for a broader range of omissions than she is criminally liable for, yet both systems claim to be tracking "responsibility for harm."

  However, they do not contradict the core theory. Both systems agree that without a duty, the omission is legally inert. They merely disagree on the policy thresholds for creating that duty.

  ### 3. Counterfactual Analysis: Shifting the Theory

  If we were to abandon the current duty-relative compromise in favor of a purely moral or purely metaphysical theory, the doctrine would require radical reconstruction.

  #### A. Adopting a Purely Moralized View
  *Theory:* An omission is a cause whenever a reasonable person would have acted (moral expectation creates causation).
  *Doctrinal Changes:*
  1.  **Collapse of the Act/Omission Distinction:** The bystander at the pond becomes a murderer. The distinction between killing and letting die vanishes in result crimes.
  2.  **General Duty to Rescue:** Criminal codes would need a "Bad Samaritan" statute, likely elevating failure to rescue to a felony if death results.
  3.  **Expansion of Homicide:** Homicide statutes would no longer require a special relationship. Any failure to prevent a foreseeable death where intervention was possible could constitute manslaughter or murder.
  4.  **Constitutional Crisis:** This would likely violate principles of legality and fair notice in many jurisdictions. It imposes affirmative obligations on citizens that conflict with liberal conceptions of negative liberty (freedom *from* interference rather than freedom *to* be protected).

  #### B. Adopting a Purely Metaphysical View
  *Theory:* Omissions are never causes (nothing comes from nothing; only positive forces cause events).
  *Doctrinal Changes:*
  1.  **Abolition of Homicide by Omission:** A parent who starves a child could not be charged with murder or manslaughter, as they did not "cause" the death (the lack of food or the child's metabolism did).
  2.  **New Category of "Status" or "Duty" Crimes:** To maintain accountability, legislatures would need to create specific offenses like "Failure to Provide Care" or "Dereliction of Duty," distinct from result crimes.
  3.  **Sentencing Disparity:** These new crimes would likely carry lower penalties than homicide. This creates a moral absurdity where the parent who starves the child is punished less severely than the stranger who poisons them, despite the identical outcome and perhaps greater moral turpitude in the parent.
  4.  **Tort Law Disruption:** In negligence, plaintiffs could no longer argue that the defendant's failure to act *caused* the injury. They would have to argue the defendant created a risk, shifting torts closer to strict liability or regulatory violation models rather than compensatory causation models.

  ### Conclusion

  The current Anglo-American pattern presupposes that **causation is a normative concept inseparable from duty.** It is a pragmatic compromise that acknowledges the metaphysical oddity of omissions (nothing happened) while satisfying the moral intuition that specific relationships create binding obligations to act.

  The doctrine is internally consistent regarding the *mechanism* of liability (Duty triggers Causation), even if Criminal and Civil law diverge on the *scope* of that duty. Moving to a purely moralized view would obliterate individual liberty in favor of collective welfare, while moving to a purely metaphysical view would obliterate moral accountability in favor of physicalist precision. The current "duty-relative" theory survives because it balances the metaphysical skepticism about omissions with the moral necessity of punishing those who betray specific trusts.
