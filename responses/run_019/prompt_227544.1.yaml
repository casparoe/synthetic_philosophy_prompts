answer: |-
  You have identified one of the most famous tensions in social choice theory, and your intuition is sharp. However, the literature you are observing is not resting on a mistake. Rather, your understanding of the Gibbard–Satterthwaite (G-S) theorem contains a subtle but crucial overstatement regarding the *frequency* and *nature* of manipulability.

  The short answer is: **Gibbard–Satterthwaite proves that manipulability is possible, not that it is pervasive, easy, or equally costly across all systems.**

  While the theorem establishes a binary property (a rule is either strategy-proof or it is not), the *extent* of manipulability is a continuous variable. Researchers compare voting rules not on *whether* they are manipulable (G-S says they all are), but on *how, how often, and how easily* they can be manipulated.

  Here is a detailed breakdown of why the comparative literature remains coherent and vital despite the theorem.

  ### 1. The Logical Nuance: Existence vs. Universality
  Your summary of the theorem states: *"at every election, some voter can always secure a better outcome..."*

  This is the pivot point. The Gibbard–Satterthwaite theorem does **not** prove that at every election profile manipulation is possible. It proves that for any non-dictatorial rule, **there exists at least one** preference profile where a voter has an incentive to misrepresent their preferences.

  *   **Rule A** might be manipulable in only 1% of possible election scenarios.
  *   **Rule B** might be manipulable in 90% of possible election scenarios.

  Both rules satisfy the G-S definition of "manipulable." However, from a design perspective, Rule A is vastly superior to Rule B. Much of the literature you mention (comparing Instant-Runoff Voting vs. Plurality, etc.) is dedicated to estimating these frequencies, often using probabilistic models (like the "Impartial Culture" assumption) to calculate the likelihood that a random election profile presents an opportunity for successful manipulation.

  ### 2. Computational Complexity: Can Voters Find the Lie?
  Even if a manipulation exists mathematically, can a real voter (or a political party) find it?

  In the 1980s and 90s, researchers like Bartholdi, Tovey, and Trick introduced **computational complexity** into social choice. They showed that for some voting rules, determining *how* to vote strategically to achieve a better outcome is computationally intractable (NP-hard).

  *   **Plurality voting** is trivial to manipulate: You simply vote for your favorite viable candidate rather than your true favorite if the latter is trailing.
  *   **Certain ranked systems** may require a voter to solve a complex optimization problem involving the predicted votes of thousands of others to find a successful strategic ballot.

  If finding the manipulation requires more computing power than is available in the universe, the rule is "computationally strategy-proof" for all practical purposes. This is a major axis of comparison that survives G-S.

  ### 3. Information Requirements: What Do Voters Know?
  The G-S theorem generally assumes voters have **complete information** about the preferences of other voters. In the real world, voters operate under uncertainty.

  A voting rule might be theoretically manipulable, but only if you know exactly how everyone else is voting. If a rule is highly sensitive to small errors in prediction (i.e., if you guess wrong about another voter, your strategic vote backfires and gives you your *worst* outcome), voters will be risk-averse and vote sincerely.

  Researchers compare rules based on their **robustness to uncertainty**. Some systems invite strategic voting only when you have perfect knowledge; others invite it even when you are guessing. This makes the latter "more manipulable" in a practical sense.

  ### 4. Domain Restrictions: Single-Peaked Preferences
  The G-S theorem applies to the **unrestricted domain** of preferences. It assumes voters can have any ordering of candidates (e.g., $A \succ C \succ B$).

  However, in many political contexts, preferences are **single-peaked** (e.g., on a Left-Right spectrum, a voter prefers the candidate closest to their ideology). If preferences are single-peaked, the Median Voter Theorem applies, and certain rules (like majority rule on pairs) become strategy-proof.

  Comparative literature often analyzes how different rules perform when preferences are *mostly* single-peaked versus when they are fractured. A rule that is strategy-proof on single-peaked domains but manipulable otherwise might be preferred in a cohesive society over a rule that is manipulable everywhere.

  ### 5. The "Degree" of Manipulation (Impact)
  Not all manipulations are equal.
  *   In **System X**, a strategic voter might change the winner from their 2nd choice to their 1st choice.
  *   In **System Y**, a strategic voter might change the winner from their 2nd choice to their 1st choice, *or* they might accidentally cause their 5th choice to win.

  Furthermore, some systems limit the **gain** from manipulation. If the maximum utility gain from voting insincerely is negligible, the system is functionally robust. Researchers measure the "magnitude" of manipulation, not just its existence.

  ### 6. Cardinal vs. Ordinal Voting (A Side Note)
  You mentioned Approval Voting. It is worth noting that Gibbard–Satterthwaite specifically applies to **ordinal** voting rules (where voters rank candidates).
  *   **Approval Voting** and **Score Voting** ask for **cardinal** information (intensity of preference).
  *   Technically, this changes the domain of the function, so G-S does not apply directly in the same way. (Though Gibbard's 1978 theorem extends impossibility results to broader classes of games).
  *   Nevertheless, even within cardinal systems, strategic incentives exist (e.g., "bullet voting" in Approval). Comparing the *strength* of these incentives is still a valid and necessary inquiry.

  ### Summary: Impossibility vs. Engineering
  The Gibbard–Satterthwaite theorem is an **impossibility result**, similar to the Heisenberg Uncertainty Principle in physics or Arrow's Impossibility Theorem in welfare economics.

  *   **Heisenberg** says you cannot measure position and momentum perfectly simultaneously.
  *   **G-S** says you cannot design a perfect voting rule immune to strategy.

  Does Heisenberg stop engineers from building microscopes? No. It tells them the fundamental limit, so they can try to minimize uncertainty within that bound.

  Similarly, G-S tells social choice theorists that **perfection is impossible**. It does not tell them that **all imperfections are equal**. The literature you are puzzled by is essentially "engineering within the bounds of impossibility." They are asking: *"Since we must accept some manipulability, which system minimizes the frequency, complexity, and impact of strategic voting in realistic scenarios?"*

  So, the practice is not a mistake. It is a shift from asking "Is it perfect?" (answered by G-S: No) to "Is it better?" (answered by comparative analysis: Yes, some are).

  ### Recommended Reading
  If you wish to explore this specific nuance further, look for papers on:
  1.  **The "Frequency of Manipulation":** Work by Nicolaus Tideman or Robert Ware.
  2.  **Computational Complexity of Manipulation:** The seminal paper by Bartholdi, Tovey, and Trick (1989), "Voting Schemes for Which It Can Be Difficult to Tell Who Won."
  3.  **Quantitative Social Choice:** The work of Bezembinder or Pritchard regarding the probability of manipulability under different culture assumptions.
