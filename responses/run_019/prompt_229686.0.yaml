answer: |-
  As a physicist, you are looking for a boundary condition—a set of criteria that separates a solvable problem from an ill-posed one. Your frustration stems from the fact that history, unlike physics, lacks controlled experiments. You cannot rerun the Bronze Age Collapse. However, there is a methodological principle that aligns with scientific rigor and separates legitimate historical speculation from pseudohistory.

  I propose the principle is **Consilience without Ad Hoc Immunization.**

  In physics, a new theory must not only explain the anomaly; it must reproduce the successful predictions of the old theory in the limit where the old theory works (the Correspondence Principle), and it must do so without adding arbitrary constants for every new data point.

  In history, **legitimate speculation** seeks *consilience*: it attempts to make the historical claim fit with independent lines of evidence (archaeology, linguistics, genetics, climatology, geology). **Pseudohistory** achieves fit by *immunizing* the claim: it dismisses independent lines of evidence as "wrong" or "part of a conspiracy" specifically when they contradict the hypothesis, while accepting them when they support it.

  Here is how this principle applies to your cases, the Runestone, and which verdict you may need to adjust.

  ### 1. The Principle Applied to Your Cases

  **Atlantis (Literal vs. Garbled)**
  *   **Literal:** Requires a continent-sized landmass vanishing in 24 hours. This violates geology and physics (plate tectonics, displacement volumes). To maintain this, you must assume geologists are universally wrong about how the crust works *specifically* to hide Atlantis. This is **Ad Hoc Immunization**.
  *   **Garbled (Thera):** Accepts that Plato's timeline and scale might be distorted by oral transmission (a known variable). It aligns with geological evidence (Thera eruption), archaeological evidence (Minoan collapse), and textual analysis (Egyptian records of chaos). This seeks **Consilience**.
  *   **Verdict:** Consistent.

  **Troy (Schliemann vs. Fomenko)**
  *   **Schliemann:** He did not treat the *Iliad* as a factual logbook. He treated it as a heuristic map with high noise. He dug at Hisarlik because the geography matched, not because he believed in Achilles' divine armor. When the dirt didn't match the poem, he trusted the dirt.
  *   **Fomenko:** His *New Chronology* claims that radiocarbon dating, dendrochronology, textual cross-referencing from China to Rome, and astronomy are *all* simultaneously wrong or forged to create a fake timeline. This requires a conspiracy of such magnitude that it violates sociological probability. It immunizes the claim by declaring all independent calibration methods invalid.
  *   **Verdict:** Consistent. The difference isn't that Schliemann was right; it's that Schliemann allowed the evidence to falsify his interpretation of Homer. Fomenko does not allow evidence to falsify his chronology.

  **Ancient Aliens (Von Däniken vs. Wegener)**
  *   **Von Däniken:** Uses "Argument from Ignorance." *We don't know how they moved this stone -> Aliens.* This hypothesis has infinite degrees of freedom. If you find a tool, he says "Aliens took it." If you don't find a tool, he says "Aliens used anti-gravity." It cannot be falsified.
  *   **Wegener:** Continental drift was rejected initially because he lacked a *mechanism* (plate tectonics wasn't understood yet). However, his hypothesis was tightly constrained. The continents had to fit; fossils had to match; climate data had to align. He couldn't just say "continents move wherever." He made specific predictions that could have proven him wrong.
  *   **Verdict:** Consistent. Wegener invited falsification; Von Däniken evades it.

  **Menzies (1421) vs. Norse (L'Anse aux Meadows)**
  *   **Norse:** The claim is localized (Newfoundland). The evidence is localized (sod houses, iron nails, butternuts). It fits the "saga" texts without requiring global trade. It leaves a small footprint consistent with the evidence.
  *   **Menzies:** Claims a global Chinese fleet. A fleet of that size implies trade, disease exchange, genetic markers, and material culture. The absence of these is a **null result** that should falsify the claim. Menzies treats the absence of evidence as "they hid it well" or "we haven't looked everywhere." This is **Ad Hoc Immunization**.
  *   **Verdict:** Consistent.

  ### 2. The Test Case: The Kensington Runestone

  Applying **Consilience without Ad Hoc Immunization**:

  *   **The Claim:** Norse explorers reached Minnesota in 1362.
  *   **The Constraints:**
      1.  **Linguistics:** The runes mix forms from different centuries and include anomalies not seen in 14th-century Scandinavia.
      2.  **Archaeology:** A trans-Atlantic expedition capable of reaching Minnesota implies a sustained presence or trade. There are no Norse artifacts in the Midwest, no DNA traces, no impact on indigenous material culture, and no equivalent of L'Anse aux Meadows (which was abandoned quickly and left *some* trace).
      3.  **Geography:** The route from the coast to Minnesota is arduous.
  *   **The "Pseudohistory" Defense:** Proponents argue that linguists don't know everything about dialects, that weathering is inconclusive, and that "absence of evidence isn't evidence of absence."
  *   **The Analysis:**
      *   To accept the Runestone, you must break the consilience of linguistics (runes evolved differently than we think), archaeology (Norse left no other trace in a region they colonized), and ecology (no exchange of species).
      *   To maintain the claim, you must introduce ad hoc parameters: "They were a small secret group," "They used biodegradable tools," "The locals hid their influence."
      *   **Verdict:** This is **Pseudohistory**. Not because it is impossible for a Norseman to walk to Minnesota, but because the *claim* (a dated inscription implying a party of explorers) carries a burden of proof regarding the *context* of that exploration that is not met. The hypothesis is being immunized against the null results of the surrounding archaeological record.

  ### 3. Which Verdict Must You Give Up?

  You mentioned: *"Before Schliemann, using Homer as a source for a real city looked like the same move... But a Bronze Age city at Hisarlik really was destroyed more than once. So rejecting expert consensus can't be what makes something pseudohistory."*

  You need to refine your verdict on **Pre-Schliemann Troy**.

  Believing Troy was a literal, historical city *based solely on Homer* **was** pseudohistory (or at least pre-scientific myth-making) before the digging started. The *Iliad* contains gods, monsters, and impossible timelines. To treat it as a history book is to ignore the genre constraints.

  **The Correction:**
  Schliemann did not succeed because he treated myth as history. He succeeded because he treated myth as **data containing signal and noise**.
  *   **Legitimate Speculation:** "The *Iliad* is a poem, but poems often reference real places. If there is a signal, where would the geography place it? Let's dig there and see if the dirt confirms or refutes the text."
  *   **Pseudohistory:** "The *Iliad* is history. If the dirt doesn't match, the dirt is wrong, or we are digging in the wrong spot because of a conspiracy."

  You should stop viewing the *outcome* (Schliemann found a city) as the validator. You should view the *method* as the validator. If Schliemann had found nothing at Hisarlik, his approach would still have been legitimate speculation because he subjected the claim to falsification. Fomenko, conversely, structures his argument so that finding nothing is consistent with his theory (they hid it).

  ### Summary for the Physicist

  Think of history as a system of equations.
  *   **Variables:** Events, dates, locations.
  *   **Constraints:** Radiocarbon, linguistics, stratigraphy, texts, genetics.
  *   **Legitimate History:** Solves the system by finding values that satisfy the maximum number of independent constraints. If a constraint doesn't fit, it adjusts the variables or acknowledges the error margin.
  *   **Pseudohistory:** Solves the system by declaring certain constraints "invalid" or "forged" specifically when they prevent the desired solution, while adding arbitrary variables (lost technologies, secret societies) to force the fit.

  **The Principle:** A historical claim is pseudohistory if it maintains its validity by **reducing the weight of independent constraints** rather than **increasing the quality of its own evidence.**

  By this metric, the Kensington Runestone remains pseudohistory, because accepting it requires downgrading the reliability of linguistics and regional archaeology without upgrading the evidence of the stone itself beyond its mere existence.
