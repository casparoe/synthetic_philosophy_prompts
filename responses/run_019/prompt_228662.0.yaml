answer: |-
  This is a sophisticated predicament. You have correctly identified that the "Great Divergence" literature is often less about history and more about the philosophy of social science. The dispute is not merely over facts, but over what constitutes a valid explanation.

  Since your aim is to construct a defended agenda for your own thinking rather than to master the bibliography, I propose a four-stage programme. The logic of this ordering is strictly **upstream/downstream**. You cannot profitably analyse causes (downstream) until you have defined the effect (upstream). You cannot assess the validity of the narrative (teleology) until you understand the causal architecture.

  Here is your prioritised agenda for the coming year.

  ### 1. The Measurement Problem: *What* diverged and *when*?
  **Priority:** Critical / First Quarter
  **The Question:** Before asking why Britain industrialised and China did not, you must establish if and when they became different. Did living standards diverge in 1500, 1700, or 1850? Did GDP per capita diverge before or after life expectancy and wages?

  **Defence of Ordering:**
  This is the most upstream question. If the divergence occurred in 1850 (the "Late Divergence" view associated with Kenneth Pomeranz and the 'California School'), then explanations focusing on 16th-century property rights or the Protestant Reformation are chronologically incoherent. If the divergence occurred in 1300 (the "Early Divergence" view associated with Gregory Clark or David Landes), then contingent factors like New World coal become irrelevant. You cannot evaluate a cause if you do not know when the effect began.

  **What would move this down?**
  If you find a consensus that the timing is irrelevant because the *type* of growth was fundamentally different regardless of timing (e.g., extensive vs. intensive growth), you might move this to a background assumption. However, currently, the dating is the primary fault line in the literature.

  **What would move this up?**
  It is already at the top. However, if you discover that quantitative data (real wages, GDP estimates) is too unreliable to ever yield a conclusion, you must shift immediately to Stage 2 (Qualitative Comparison).

  ### 2. The Unit of Analysis: Is "Britain vs. China" valid?
  **Priority:** High / Second Quarter
  **The Question:** Is it methodologically sound to compare a nation-state (Britain) with a continent-sized empire (China)? Should we compare England with the Yangtze Delta? Or Europe with Asia? Does treating "China" as a single actor smuggle in assumptions about state capacity that obscure regional variations?

  **Defence of Ordering:**
  This follows measurement because once you know *when* things diverged, you must define *who* is diverging. Comparing Britain to all of China is often criticised as comparing apples to oranges. Britain was a small, competitive island; China was a vast, unified agrarian empire. A more fair comparison might be England vs. Jiangnan, or Europe vs. Asia. If the comparison is flawed, the search for causes is a "garbage in, garbage out" exercise. This addresses your concern about the question being "badly posed."

  **What would move this down?**
  If you conclude that global macro-history necessarily requires broad aggregation to be meaningful, and that regional nuances average out over centuries.

  **What would move this up?**
  If you find that the "Great Divergence" was actually a "Great Convergence" followed by a localised spike. If industrialisation was a freak occurrence in Lancashire rather than a European trend, the "Europe vs. China" framework collapses entirely, making this the most important question.

  ### 3. Causal Architecture: Contingency vs. Necessity
  **Priority:** Medium / Third Quarter
  **The Question:** Was industrialisation the inevitable result of long-term structural developments (institutions, culture, science), or was it a contingent "escape" from Malthusian traps caused by accidental factors (coal location, access to colonies)?

  **Defence of Ordering:**
  Now that you have defined the *when* (Stage 1) and the *who* (Stage 2), you can address the *how*. This is the bridge between empirical data and theoretical explanation. This directly addresses your interest in the "single decisive factor" dispute. You need to decide if you are looking for a "lock-in" model (once X happens, Y must follow) or a "conjunctural" model (X, Y, and Z happened to align at one specific moment).

  **Overrated Causes to Set Aside Early:**
  *   **Pure Culture:** Be wary of explanations relying solely on "mindset" or "religion" (e.g., Weberian arguments) unless they are tied to specific economic incentives. They are often unfalsifiable and used as a catch-all when data fails.
  *   **Geography as Destiny:** Explanations that claim Europe's climate *made* industrialisation inevitable ignore the fact that similar latitudes exist elsewhere.
  *   **Patents/IP Law:** While important, treating the patent system as a primary cause often confuses a symptom of innovation with the cause.

  **What would move this up?**
  If Stage 1 and 2 reveal that the divergence was extremely sharp and localised (e.g., only in textiles in Lancashire, 1780–1820), contingency becomes the dominant framework, and this question becomes the key to the whole puzzle.

  ### 4. The Teleology Trap: Narratives of "Failure" and "Destiny"
  **Priority:** Reflective / Fourth Quarter
  **The Question:** Does framing the issue as "Why did China fail?" impose a European endpoint as the natural goal of history? How do we analyse the divergence without assuming industrialisation was the superior or intended outcome?

  **Defence of Ordering:**
  This is placed last deliberately. It is tempting to start here, but it is difficult to identify teleological bias without knowing the empirical stakes. If you decide industrialisation was accidental (Stage 3), the charge of teleology is strengthened. If you decide it was the result of deep structural advantages, the charge is weakened. You need the evidence from the first three stages to properly critique the narrative structure. This addresses your meta-interest in whether the question itself is "badly posed."

  **What would move this up?**
  If you find that the primary sources you are reading are explicitly ideological (e.g., justifying colonialism or asserting Western superiority), you should analyse the narrative bias immediately to inoculate yourself against their conclusions.

  ### Summary of the Agenda

  | Order | Focus | Key Question | Why Upstream? |
  | :--- | :--- | :--- | :--- |
  | **1** | **Measurement** | When did the gap open? | You cannot explain a gap if you don't know when it started. |
  | **2** | **Comparison** | Are the units comparable? | Invalid comparisons yield invalid causes. |
  | **3** | **Causality** | Structural or Contingent? | Determines whether you look for deep roots or accidents. |
  | **4** | **Narrative** | Is the question teleological? | Requires empirical understanding to critique the story. |

  ### A Note on "Findings" that Disrupt the Plan

  You asked what findings would move a question up or down. Here are the specific "shock" findings that would require you to reorder your thinking:

  1.  **The "Reversal" Finding:** If you encounter robust evidence that Chinese living standards were *higher* than Britain's as late as 1800 (the Pomeranz thesis), **Stage 2 (Unit of Analysis)** becomes the most critical. It implies that deep cultural or institutional explanations for European success are wrong, and the focus must shift to why the Yangtze Delta *stopped* growing, rather than why Britain *started*.
  2.  **The "Data Void" Finding:** If you conclude that economic data for pre-1800 China is too speculative to support any claim (a criticism often levelled at GDP estimates), you must abandon **Stage 1** as a quantitative exercise and move **Stage 4 (Narrative)** up. You would then be analysing the *history of the debate* rather than the history of the economy.
  3.  **The "Multiple Divergences" Finding:** If you find that there was not one divergence, but several (e.g., a divergence in science, then a divergence in wages, then a divergence in energy), **Stage 3 (Causal Architecture)** moves up. You would need to stop looking for *the* cause and start looking for a chain of distinct causes.

  ### Final Advice for the Independent Scholar

  Since you lack academic training, you are vulnerable to two traps: getting bogged down in technical economic debates (econometrics of real wages) or getting lost in abstract theory.

  To avoid this, use the **"Counterfactual Test"** for every book you read. When an author claims X caused the divergence, ask: "If X had been different, would the divergence still have happened?"
  *   If the author says "No, industrialisation was impossible without coal," they are arguing for **Contingency**.
  *   If the author says "No, but we would have found a substitute eventually," they are arguing for **Necessity**.

  This simple heuristic will allow you to map the meta-dispute without needing to master the underlying econometrics. Prioritise the logic of the argument over the precision of the data. Your goal is to understand the structure of the debate, not to settle it.
