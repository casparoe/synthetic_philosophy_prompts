prompt: |-
  I have no academic training, but over the past year I have been reading popular books about the "Great Divergence" — the question of why industrialisation took off in north-western Europe, and Britain in particular, rather than in China or India, which looked at least as prosperous a few centuries earlier. I keep running into a meta-dispute that interests me more than any particular answer: some writers treat "why Britain and not China?" as a perfectly good explanatory question, while others argue it is badly posed — that it smuggles in the assumption that Europe was destined to industrialise and that China somehow "failed", or that it invites a futile hunt for a single decisive factor (coal, colonies, institutions, culture) when the outcome may have been contingent. I have decided to spend the next year thinking this through properly, but I cannot read everything. Which open questions in this debate should I prioritise, and in what order? Please defend the ordering: I want to know which questions are upstream of which (for instance, whether one must first settle when Europe actually pulled ahead before asking why, or whether the contrastive question itself needs reformulating before any causal inquiry can begin), which alleged causes are overrated enough to be set aside early, and what findings would move a question up or down the list. My aim is a defended agenda for my own thinking, not a survey of the literature. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Request:**
      *   **User Profile:** No academic training, but well-read in popular literature on the "Great Divergence" (Pomeranz, Mokyr, Landes, etc.) over the past year.
      *   **Interest:** Less interested in specific answers (coal vs. institutions) and more interested in the *meta-dispute* about how the question is framed (teleology, contingency, contrastive validity).
      *   **Goal:** A one-year thinking agenda (prioritized open questions).
      *   **Requirements:**
          *   Defend the ordering (upstream/downstream logic).
          *   Identify overrated causes to set aside.
          *   Specify findings that would reprioritize questions.
          *   Format: British English.
          *   Tone: Analytical, structured, advisory (not a literature survey).

  2.  **Deconstruct the Meta-Dispute:**
      *   *The Problem:* The question "Why Britain and not China?" assumes a binary outcome, implies a race, risks teleology (Europe was destined to win), and seeks monocausal explanations.
      *   *The Upstream Issues:* Before asking "why," we must ask "what," "when," and "is this comparison valid?"
      *   *The Downstream Issues:* Specific causal mechanisms (coal, culture, colonies) only make sense if the upstream framing is solid.

  3.  **Drafting the Agenda - Step-by-Step:**

      *   **Phase 1: Framing and Validity (The "Upstream" Work)**
          *   *Question 1: Is the contrast valid?* (The "California School" critique). If China and Europe were similar until 1800, asking why they diverged *before* then is wrong. If they were different much earlier, the question changes.
          *   *Question 2: When did the divergence happen?* Is it 1500, 1700, or 1850? This dictates which causes are relevant.
          *   *Question 3: Is "industrialisation" the right metric?* Maybe we should look at energy, wages, or state capacity.
          *   *Decision:* The *validity of the comparison* is the most upstream. If the comparison is nonsense, the rest is waste.

      *   **Phase 2: Structural vs. Contingent (The "Mechanism" Work)**
          *   *Question 4: Deep structures vs. Accident.* Is this about long-term institutions (North/Weber) or contingent factors (Pomeranz's coal/colonies)?
          *   *Question 5: The "Single Factor" trap.* How to think about conjunctural causality.

      *   **Phase 3: Normative and Teleological Hazards (The "Meta" Work)**
          *   *Question 6: Teleology.* Are we reading history backwards?
          *   *Question 7: Normative implications.* Does this imply European superiority?

  4.  **Refining the Order (The "Defence"):**
      *   *Priority 1: The Timing and Nature of the Gap.* You can't explain a gap if you don't know when it opened. (Broadberry vs. Pomeranz).
      *   *Priority 2: The Validity of the Contrast.* Is "China" a single unit? Is "Europe" a single unit? Is the comparison apples-to-apples?
      *   *Priority 3: Causal Architecture.* Once the gap is established, is it structural or contingent?
      *   *Priority 4: Specific Factors.* (Coal, Culture, etc.) - These are downstream.
      *   *Priority 5: Teleology.* This permeates everything but is best tackled after understanding the empirical claims.

      *Correction:* Actually, the *framing* (Validity of Contrast) is more upstream than the *Timing*. If the comparison is flawed, timing doesn't matter. However, timing often *determines* validity (e.g., if divergence is 19th century, comparing 15th century institutions is useless). Let's group them: **Definition & Measurement** first, then **Causal Logic**, then **Specifics**.

      *Revised Order:*
      1.  **Measurement & Timing:** When and what diverged? (Wages? GDP? Energy?)
      2.  **Unit of Analysis:** Is "Britain vs. China" the right comparison? (England vs. Yangtze Delta?)
      3.  **Causal Logic:** Contingency vs. Necessity.
      4.  **Specific Drivers:** (Coal, Institutions, etc.) - *Set aside for now.*
      5.  **Teleology:** The narrative structure.

  5.  **Identifying Overrated Causes:**
      *   *Culture/Protestant Ethic:* Often too vague, hard to measure, risks circularity.
      *   *Pure Geography:* Deterministic, ignores human agency.
      *   *Monocausal "Silver Bullets":* Patents alone, Coal alone.

  6.  **Developing "Trigger Conditions" (What moves questions up/down):**
      *   If new data shows Chinese wages were equal to British in 1750 -> Timing moves up.
      *   If data shows divergence in 1300 -> Institutional questions move up.

  7.  **Drafting the Content (incorporating British English):**
      *   Use "industrialisation", "labour", "programme", "defence", "prioritise".
      *   Maintain a scholarly but accessible tone.
      *   Ensure the "Defence of Ordering" is explicit for each section.

  8.  **Review against Constraints:**
      *   *No academic training?* Keep jargon explained (e.g., "teleology", "counterfactual").
      *   *Meta-dispute focus?* Ensure the emphasis is on *how* to ask, not just *what* the answer is.
      *   *Defended agenda?* Explicitly state *why* this order.
      *   *British English?* Check spelling and idioms.

  9.  **Final Polish:**
      *   Make sure the distinction between the "California School" (Pomeranz) and "Traditionalists" (Landes/Mokyr) is clear but not the focus (the focus is the *question*, not the *school*).
      *   Ensure the advice on "overrated causes" is firm.
      *   Check the logic flow: Measurement -> Comparison -> Causality -> Narrative.

      *(Self-Correction during drafting)*: I need to be careful not to just list topics. The user wants an *agenda for thinking*. I should frame them as active inquiries. I also need to make sure I don't get bogged down in the specific economic data debates (Allen vs. Broadberry) but keep it on the *methodological* implication of those debates.

      *Refining the "Overrated" section:* Be careful not to dismiss culture entirely (McCloskey etc.), but highlight why it's a *later* stage question due to measurement issues.

      *Refining the "Teleology" section:* This is the user's main interest. It should be the capstone, because you can only identify teleology once you know the empirical facts.

