prompt: |-
  Two people in my circle have been arguing for months about whether current LLMs have beliefs and goals. One is a committed Dennettian: on her reading of the real-patterns criterion, a posit is real if the stance that posits it buys you compression and predictive power you cannot get more cheaply otherwise, and since the intentional stance toward frontier LLMs routinely out-predicts the physical and design stances for everyday purposes, these systems literally have beliefs and goals -- being a believer just is being a system reliably predictable that way. Her opponent thinks this is stance-dependence run amok: the intentional stance is a user-side heuristic, the underlying computation is next-token prediction with no internal states that answer to belief-talk, and the vocabulary will actively mislead safety work on deception and goal-directedness.

  Draft the joint statement these two could sign after a serious adversarial collaboration: (1) a numbered list of claims both accept, covering what the three stances are, what calling a pattern real commits you to, and what current LLM behavior actually demonstrates; (2) a disagreements table where each side's position is phrased so that side would accept the wording; (3) the cruxes -- I suspect one is whether predictive compression suffices for realism about the posits, and another is whether stance-independent evidence from interpretability work could adjudicate -- and for each crux, a case or observation both agree bears on it, with each side's prediction recorded in advance. If part of their dispute turns out to be verbal, say which part and why. Close with a note on how confident you are that each position is stated fairly, and flag the single attribution you are least sure both parties would actually sign.
