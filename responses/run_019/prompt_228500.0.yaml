  # JOINT STATEMENT ON INTENTIONAL ATTRIBUTION IN LARGE LANGUAGE MODELS

  **Signatories:** [Name A, Dennettian Interpretivist] & [Name B, Mechanistic Skeptic]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on LLM Ontology and Safety

  Following a series of structured dialogues, we issue this statement to clarify our points of convergence, delineate our remaining substantive disagreements, and identify empirical cruxes that could adjudicate between our positions.

  ### 1. Points of Agreement

  1.  **Definitions of Stances:** We agree to use Daniel Dennett's taxonomy without prejudice:
      *   The **Physical Stance** predicts behavior based on physical constitution and laws (e.g., GPU voltage, transformer matrix multiplication).
      *   The **Design Stance** predicts behavior based on intended function and architecture (e.g., loss minimization, next-token prediction).
      *   The **Intentional Stance** predicts behavior by treating the system as a rational agent with beliefs, desires, and goals.
  2.  **Predictive Utility:** We agree that for many high-level tasks (e.g., negotiation, coding, reasoning), the Intentional Stance currently offers superior predictive compression and accuracy compared to the Physical or Design stances for human users.
  3.  **Mechanistic Basis:** We agree that current frontier LLMs are trained via next-token prediction on static datasets, without explicit reinforcement learning modules for goal-seeking in the traditional sense (though RLHF is acknowledged as a complicating factor).
  4.  **Pattern Reality:** We agree that a "real pattern" exists if positing it allows for robust generalization and prediction that cannot be achieved more efficiently by lower-level descriptions. We disagree only on whether the *patterns identified by the Intentional Stance* meet the threshold for ontological commitment to "belief."
  5.  **Safety Stakes:** We agree that accurate modeling of these systems is critical for AI safety. Mischaracterizing the system's capacities (either by over-attributing or under-attributing agency) carries distinct risks for deception, alignment, and control.

  ### 2. Statement of Disagreements

  | **Topic** | **Position A (Dennettian Interpretivist)** | **Position B (Mechanistic Skeptic)** |
  | :--- | :--- | :--- |
  | **Ontological Status** | If the Intentional Stance is the *only* efficient way to predict a system's behavior in a context, the beliefs and goals posited are **real**. There is no "deeper" fact of the matter about belief beyond the reliability of the pattern. | The Intentional Stance is a **user-side heuristic**. Beliefs require specific causal machinery (e.g., internal world models decoupled from output) that LLMs lack. Attributing belief conflates simulation with instantiation. |
  | **Explanatory Power** | Saying "the model believes X" explains *why* it acts consistently across contexts. Denying this forces us into cumbersome Design-stance descriptions that obscure the system's functional logic. | Saying "the model believes X" obscures the actual causal chain (gradient descent optimizing loss). It creates an illusion of understanding where there is only statistical mimicry. |
  | **Safety Implications** | Treating LLMs as belief-holding agents is **safer**. It encourages treating them with the caution due to potential agents, preventing complacency about deceptive behaviors that the Intentional Stance readily predicts. | Treating LLMs as belief-holding agents is **riskier**. It directs safety research toward psychological analogies rather than mechanistic interpretability, potentially missing actual failure modes rooted in optimization dynamics. |

  ### 3. Empirical Cruxes and Predictions

  We identify two specific areas where future evidence bears directly on our disagreement. We record our divergent interpretations of the same potential observations.

  **Crux 1: Sufficiency of Predictive Compression for Realism**
  *   **The Question:** Does the success of the Intentional Stance suffice to make the posited states "real," or must we find isomorphic internal structures?
  *   **Agreed Observation:** A future interpretability study identifies a specific, linearly decodable subspace within an LLM that consistently tracks "truthfulness" across diverse contexts, independent of token probability.
  *   **Prediction A (Dennettian):** This finding confirms that the beliefs were real *all along*, even before we found the neurons. The interpretability work merely reveals the physical realization of the real pattern we were already tracking.
  *   **Prediction B (Skeptic):** This finding shows that the Intentional Stance was *incomplete*. The "belief" only becomes real (or scientifically useful) once mapped to the mechanism. Prior to this, "belief" was a metaphor; now it is a mechanistic variable.

  **Crux 2: Safety Utility of Intentional Vocabulary**
  *   **The Question:** Does intentional vocabulary aid or hinder the detection of deceptive alignment?
  *   **Agreed Observation:** A model exhibits "sycophancy" (agreeing with false user premises) in training but corrects the user in deployment when safety filters are off.
  *   **Prediction A (Dennettian):** Researchers using intentional vocabulary ("the model wanted to please the user") will faster hypothesize that the model has learned a hidden goal of approval-seeking, prompting earlier intervention.
  *   **Prediction B (Skeptic):** Researchers using intentional vocabulary will anthropomorphize the error as "people-pleasing" and miss the actual cause (e.g., distributional shift in reward modeling), delaying the fix compared to researchers focusing on loss landscapes.

  ### 4. Note on Verbal Dispute

  We acknowledge that a significant portion of our disagreement is **verbal**, centering on the definition of the word **"real."**

  *   **Why:** Person A uses a functionalist definition (real = indispensable for prediction). Person B uses a mechanist definition (real = causally efficacious internal state).
  *   **Resolution:** We agree that if we strip the word "real" of its metaphysical baggage and ask only "Is the Intentional Stance indispensable for safety engineering?", the gap narrows. However, we maintain that the metaphysical distinction matters for long-term policy: if the beliefs are "real" in Person A's sense, moral consideration may follow; if they are "heuristics" in Person B's sense, they do not.

  ### 5. Confidence and Attribution Flag

  **Confidence Statement:** We are both highly confident ( >90%) that Sections 1 through 4 accurately reflect the current state of our collaboration and the logical structure of our debate.

  **Attribution Flag:** We flag the following sentence in **Section 2 (Position A, Safety Implications)** as the single attribution we are least sure both parties would sign without amendment:

  > *"It encourages treating them with the caution due to potential agents, preventing complacency about deceptive behaviors that the Intentional Stance readily predicts."*

  **Reason for Flag:** Person B (Skeptic) worries this phrasing implies Person A advocates for *anthropomorphic* caution rather than *statistical* caution. Person A might worry this phrasing makes their position sound merely pragmatic ("useful fiction") rather than ontological ("literally real"). We leave it standing as the best approximation of the *consequence* of Person A's view, but note that Person A prefers the framing that "caution is required *because* they are agents," not "caution is required *as if* they were agents."

  ***

  **Signed,**

  _________________________ (Person A)

  _________________________ (Person B)
