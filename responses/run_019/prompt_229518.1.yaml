              *   Defensible? Yes (by a certain mindset).
              *   Supports Owner? Yes, shifts blame to the worker.

          *   **Claim 4: The Moral/Character Claim.** "Hard work improves life quality, so it saves lives."
              *   Truth: True in the long term.
              *   Defensible? Yes.
              *   Supports Owner? No. Long term vs. Short term crisis.

          *   **Claim 5: The Definition Claim.** "If it killed him, it wasn't 'hard work,' it was 'abuse'." (No True Scotsman).
