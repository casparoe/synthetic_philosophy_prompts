      *   I need to break it down into semantic interpretations.
      *   *Interpretation 1: Literal/Biological.* Does physical exertion cause death? Yes (rhabdomyolysis, heart attack).
      *   *Interpretation 2: Economic/Social.* Does working hard lead to poverty/ruin? No, usually the opposite.
      *   *Interpretation 3: Moral/Character.* Does hard work corrupt the soul? No, it builds character.
      *   *Interpretation 4: Causality.* Is "hard work" the *proximate cause* of death, or is it underlying conditions?
      *   *Interpretation 5: Comparative.* Is hard work *more* dangerous than laziness?

  3.  **Drafting the Categories (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Literal truth (False).
          2.  Metaphorical truth (True).
          3.  Risk assessment (Debatable).
          4.  Systemic vs. Individual (The gap).

      *   *Attempt 2 (Refining for the User's needs):*
          The user wants to know *which readings support the owner* and *which create the gap*.
          Let's categorize by "Claim Type."

          *   **Claim 1: The Literal/Biological Claim.** "Physical exertion cannot cause biological failure."
