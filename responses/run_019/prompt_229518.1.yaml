      *   **Goal:** The user wants to understand the *logic* behind this phrase to write a compelling pushback character. They want to avoid a simple "you're lying" confrontation and instead expose the *gap* between the statement's truth and its applicability.
      *   **Specific Task:** Lay out distinct claims the phrase might make (from true to false), evaluate if a reasonable person could defend them, and determine if they support the owner's dismissal of the collapse.
      *   **Key Preference:** Focus on readings where the line is "true-ish" but *doesn't do the work the owner needs it to do* (the logical gap).
      *   **Constraint:** No sources or reading lists (for dialogue, not an essay).

  2.  **Deconstruct the Phrase ("Hard work never killed anybody"):**
