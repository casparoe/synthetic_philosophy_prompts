answer: |-
  Here is a breakdown of the distinct logical claims embedded in "hard work never killed anybody," ranging from the literally false to the contextually misleading. For each, I've outlined whether a reasonable person could defend the premise, whether it supports the owner's dismissal of the fainting, and specifically where the logical gap lies for your pushback character to exploit.

  ### 1. The Literal/Biological Claim
  **The Claim:** Physical and mental exertion cannot directly cause biological failure or death.
  **Truth Value:** Plainly False.
  **Reasonable Defense:** No. A reasonable person knows that extreme exertion leads to heart attacks, strokes, rhabdomyolysis, and accidents caused by fatigue.
  **Supports Owner's Dismissal?** Yes, but only if the owner is willing to be factually wrong.
  **The Gap:** This is the easiest target, but perhaps too obvious. If your pushback character uses this, the owner looks ignorant, not manipulative.
  **How to Expose It:** The character doesn't need to cite medical journals; they just need to point to the body on the floor. "His heart stopped. He was working. Connect the dots."

  ### 2. The Comparative/Socio-Economic Claim
  **The Claim:** Working hard is statistically safer than the alternative (poverty, unemployment, laziness).
  **Truth Value:** True-ish.
  **Reasonable Defense:** Yes. Poverty is correlated with higher mortality rates, lower life expectancy, and worse health outcomes. In a broad actuarial sense, having a job and working hard keeps you alive longer than being destitute.
  **Supports Owner's Dismissal?** No. This is the strongest "True-ish but useless" angle.
  **The Gap:** This claims that work prevents death *in the long run*, not that it is safe *in the moment*. The owner is using a long-term survival statistic to justify an immediate safety hazard. It's like saying "Seatbelts cause accidents" because people who drive (and wear seatbelts) crash more than people who stay home.
  **How to Expose It:** "You're saying poverty kills. I'm saying *this shift* killed. Don't trade his life for a statistic."

  ### 3. The Threshold/Constitution Claim
  **The Claim:** The work didn't kill him; his lack of capacity did. The work is a constant; the worker is the variable.
  **Truth Value:** Debatable (Philosophically defensible, medically shaky).
  **Reasonable Defense:** Yes, from a management perspective. If two people do the same task and one collapses, the owner can argue the task wasn't lethal, the person was unfit. It shifts the blame to the worker's health, diet, or genetics.
  **Supports Owner's Dismissal?** Yes. It absolves the environment by blaming the individual.
  **The Gap:** This ignores the concept of "universal limits." There is a weight too heavy for *any* human to lift. The owner is pretending the threshold for collapse is infinite or purely individual, ignoring that the environment pushed *everyone* near that edge.
  **How to Expose It:** "It's not that he was weak. It's that you loaded the camel until the straw mattered. You're testing the straw instead of weighing the load."

  ### 4. The Definitional Claim (No True Scotsman)
  **The Claim:** If it killed him, it wasn't "hard work." It was "abuse," "mismanagement," or "negligence." Therefore, the statement remains true by definition.
  **Truth Value:** Tautologically True (but linguistically slippery).
  **Reasonable Defense:** Yes, linguistically. We often distinguish between "working hard" (virtuous effort) and "grinding" (destructive exploitation).
  **Supports Owner's Dismissal?** Yes, but it requires redefining the event immediately after it happens. It allows the owner to keep the slogan while ignoring the body.
  **The Gap:** The owner is using the colloquial meaning (long hours, high stress) to demand labor, but the technical meaning (sustainable effort) to deny liability. They want the output of "hard work" without the responsibility of "unsafe conditions."
  **How to Expose It:** "You call it hard work when you profit. You'll call it negligence when the lawyers arrive. Pick one definition."

  ### 5. The Moral/Character Claim
  **The Claim:** Hard work builds the resilience that keeps people alive. To stop working is to weaken the spirit, which leads to ruin.
  **Truth Value:** True-ish (in a psychological sense).
  **Reasonable Defense:** Yes. Purpose and routine are linked to mental health and longevity. Stopping work can lead to decline.
  **Supports Owner's Dismissal?** No. This argues for the *value* of work, not the *safety* of specific conditions.
  **The Gap:** This conflates "having a job/purpose" with "working until fainting." The owner is arguing that work is good for the soul, using that to justify work that is bad for the body. It confuses *meaning* with *mechanics*.
  **How to Expose It:** "He loved the work. That's why he stayed. You're using his dedication to break him."

  ### Summary for Your Scene
  If you want the pushback character to be sharp, avoid attacking the **Literal Claim** (Claim 1). It makes the owner look stupid, which is satisfying but simple.

  Instead, attack the **Comparative Claim** (Claim 2) or the **Threshold Claim** (Claim 3).
  *   **The Comparative Attack:** Acknowledge that work is necessary for life, but distinguish between *sustenance* and *exhaustion*. "Work keeps a roof over his head. This shift put him on the floor. One saves him, the other broke him."
  *   **The Threshold Attack:** Acknowledge the worker's body failed, but pin the responsibility on the environment that tested the limit. "A bridge collapsed. You're blaming the cars."

  This allows your protagonist to agree that "hard work is good" (making them reasonable) while arguing that "this specific application is lethal" (making the owner's usage of the phrase the error).
