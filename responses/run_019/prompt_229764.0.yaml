  # Specifications for an Adequate Theory of Vagueness

  The following list distinguishes between data that any theory must save (**Non-negotiable**), questions any theory must answer even if the answer is negative (**Structural**), and commitments that reflect specific philosophical allegiances (**Parochial**).

  ### 1. Sorites Susceptibility
  *   **Requirement:** The theory must explain why the Sorites argument (e.g., "If n grains is a heap, n+1 is a heap") appears valid and why competent speakers hesitate to reject the inductive premise.
  *   **Forces:** The universal psychological and linguistic reaction to Sorites series; the fact that the argument is not immediately dismissed as fallacious by lay speakers or philosophers.
  *   **Status:** **Non-negotiable.** A theory that simply declares the argument invalid without explaining its persuasive force fails to describe the phenomenon.

  ### 2. Competence Without Resolution
  *   **Requirement:** The theory must explain why full semantic competence with a vague term (e.g., "bald") does not enable a speaker to settle the status of borderline cases.
  *   **Forces:** The observation that experts and native speakers alike reach an impasse on borderline cases despite knowing the meaning of the terms perfectly.
  *   **Status:** **Non-negotiable.** If competence entailed knowledge of the boundary, vagueness would be merely ignorance, which contradicts the phenomenology of semantic indecision.

  ### 3. The Borderline/Ignorance Distinction
  *   **Requirement:** The theory must distinguish between a case being *borderline* (indeterminate) and a case being *determinate but unknown*.
  *   **Forces:** The felt difference between "I don't know if he is bald" (epistemic) and "It is unclear if he is bald" (semantic/ontic).
  *   **Status:** **Structural.** Epistemicists will argue the distinction collapses (borderline *is* unknown); others will argue it is robust. The theory must take a stance.

  ### 4. The Appearance of Smoothness (No Sharp Boundaries)
  *   **Requirement:** The theory must account for the strong intuition that there is no specific hair whose removal turns a non-bald man into a bald man.
  *   **Forces:** The implausibility of arbitrary cutoffs; the semantic intuition that vague predicates do not carve reality at specific joints.
  *   **Status:** **Parochial.** Epistemicists reject this intuition (boundaries exist but are unknowable). Supervaluationists and Degree Theorists accept it (globally). A theory must address it, but need not satisfy it.

  ### 5. Higher-Order Vagueness
  *   **Requirement:** The theory must model the vagueness of the boundary itself (i.e., the transition from "definitely bald" to "borderline bald" must not be sharp).
  *   **Forces:** The intuition that there is no first borderline case, just as there is no first bald case.
  *   **Status:** **Non-negotiable.** Any theory that posits a sharp boundary between the definite and the borderline merely relocates the Sorites problem.

  ### 6. Penumbral Connections
  *   **Requirement:** The theory must preserve logical relations between related vague predicates (e.g., "If Jack is bald, Jack is not hairy") even in borderline regions.
  *   **Forces:** The semantic intuition that "bald" and "hairy" are contraries; a borderline bald man cannot be a borderline hairy man in a way that violates this relation.
  *   **Status:** **Non-negotiable.** Degree theories often struggle here (assigning 0.5 to both violates the connection).

  ### 7. Logical Behavior (Negation, Truth, Determinacy)
  *   **Requirement:** The theory must specify the behavior of vague sentences under negation, the truth predicate, and the determinacy operator ("Definitely").
  *   **Forces:** The need for a coherent logic of discourse; the existence of sentences like "This is borderline bald."
  *   **Status:** **Structural.** A theory must define these operators, even if it rejects classical definitions.

  ### 8. Classical Logical Constraints
  *   **Requirement:** The theory must state its position on Bivalence, Excluded Middle, Classical Validity, and the T-Scheme ($T(\ulcorner A \urcorner) \leftrightarrow A$).
  *   **Forces:** The utility of classical logic in science and daily life vs. the pressure from paradox.
  *   **Status:** **Parochial.** Epistemicists retain all. Supervaluationists retain validity but drop Bivalence locally. Revisionists drop validity.

  ---

  ### Task 1: The Incompatible Family of Requirements

  The standard Sorites triad (Tolerance, Modus Ponens, Clear Endpoints) is well-known. However, a deeper incompatibility lies in the metaphysics of meaning and truth. Consider the following four requirements, each individually compelling:

  1.  **Semantic Determinacy:** The truth conditions of a sentence are fully determined by its meaning.
  2.  **Usage Determinacy:** The meaning of a term is fully determined by linguistic usage and convention.
  3.  **Tolerance of Usage:** Actual linguistic usage does not distinguish between adjacent items in a Sorites series (no usage fact dictates a cutoff).
  4.  **Bivalence:** Every declarative sentence is either true or false.

  **The Conflict:** If Meaning is determined by Usage (1 & 2), and Usage is Tolerant (3), then Meaning cannot determine a sharp cutoff. If Meaning cannot determine a sharp cutoff, but Bivalence holds (4), then there must be a truth value (True/False) without a meaning-fact to ground it.
  *   **Epistemicists** reject (2) or (3) implicitly: they argue meaning determines a cutoff that usage does not reveal (semantic facts outstrip usage).
  *   **Supervaluationists** reject (4) locally: they argue that without a usage-dictated cutoff, there is no truth value.
  *   **Degree Theorists** reject (4) structurally: they replace binary truth with degrees.

  This family is larger than the Sorites triad because it implicates the theory of meaning itself, not just the validity of an argument. You cannot have a usage-based semantics, tolerant usage, and classical bivalence simultaneously.

  ### Task 2: The Single Exclusionary Requirement

  **Requirement:** **The Ban on Arbitrary Cutoffs (Non-Arbitrariness).**
  *Stipulation:* A theory must not posit a sharp boundary in the extension of a vague predicate at any order of vagueness.

  If enforced uncompromisingly, this requirement excludes **Epistemicism** entirely and places severe structural pressure on **Supervaluationism** and **Degree Theory**. It is the most exclusionary *intuition* because it targets the core metaphysical commitment of the only theory that preserves classical logic (Epistemicism), while forcing the other major theories into complex maneuvers to avoid hidden cutoffs.

  **Cost Allocation:**
  *   **The Epistemicist** locates the cost in **rejecting the requirement**. They argue the intuition is mistaken. The cost they pay is an *error theory*: they must explain why competent speakers are systematically wrong about the nature of their own language (believing there is no cutoff when there is one). Their burden is metaphysical and psychological (explaining the ignorance).
  *   **The Supervaluationist** locates the cost in **satisfying the requirement via semantic complexity**. They accept the ban on global cutoffs but admit that every *precisification* (sharpening) has a sharp cutoff. The cost they pay is *technical and logical*: they must explain why truth is not defined at the cutoff despite every precisification having one. They sacrifice Bivalence to save Non-Arbitrariness.

  Thus, the Epistemicist pays in *plausibility* (sharp boundaries exist), while the Supervaluationist pays in *logic* (truth value gaps).

  ### Task 3: The Omitted Requirement

  **Requirement:** **The Identity Constraint on Sharpening.**
  *Stipulation:* A theory must explain how a vague term can be sharpened (precisified) without changing its meaning. Sharpening must be distinguished from stipulative redefinition or disambiguation.

  **Defense:**
  This is often omitted in favor of truth-conditional criteria, but it is vital for the coherence of Supervaluationism and Contextualism. If "bald" is vague, and we sharpen it to "having fewer than 10,000 hairs," we are ostensibly analyzing the truth conditions of "bald." However, if the sharpened term has a different extension than the original (which it must, to resolve borderline cases), in what sense is it the *same* term?
  *   If sharpening *changes* meaning, then Supervaluationism is not a theory of vague truth, but a theory of how to replace vague terms with precise ones. It fails to tell us the truth value of the original vague sentence.
  *   If sharpening *preserves* meaning, the theory must identify a semantic core that remains constant across precisifications.
  *   **Why it is a requirement:** Without this, the "admissible precisifications" are arbitrary substitutes. A theory of vagueness must explain the *continuity* between the vague term and its sharpenings to ensure it is actually analyzing vagueness rather than advocating for linguistic engineering. Epistemicists satisfy this easily (meaning is constant, extension is fixed). Supervaluationists must work hard to show the "penumbra" is part of the meaning that allows variation without change.

  ---

  ### Brief Scoring of Main Views

  *   **Epistemicism:** Scores highest on **Logic** and **Identity Constraint** (meaning is stable). Scores lowest on **Non-Arbitrariness** and **Competence Without Resolution** (requires massive error theory).
  *   **Supervaluationism:** Scores highest on **Non-Arbitrariness** (globally) and **Sorites Susceptibility**. Scores lower on **Higher-Order Vagueness** (standard models collapse) and **Identity Constraint** (struggles to explain meaning continuity).
  *   **Degree Theory:** Scores well on **Smoothness** and **Higher-Order Vagueness**. Scores poorly on **Penumbral Connections** (fuzzy logic often violates classical relations) and **Bivalence**.
  *   **Contextualism:** Scores well on **Competence** (context shifts resolve uncertainty). Scores poorly on **Stability** (meaning shifts across contexts).

  No theory satisfies the Non-negotiable and Structural requirements without incurring significant Parochial costs. The choice of theory is ultimately a choice of which cost one is willing to bear.
