          *   *Genuine Intransitivity:* The metaphysical relation itself fails.
      *   **Defences of Transitivity:**
          *   *Rational Choice:* Money pumps. If betterness guides choice, intransitivity leads to irrational cycles.
          *   *Vagueness/Sorites:* The argument is a moral Sorites. Transitivity holds for precise values; the problem is semantic/epistemic vagueness.
          *   *Lexical/Threshold Views:* Reject the Small Difference Principle. At some point, severity trumps duration.
          *   *Unreliability of Marginal Judgements:* We cannot reliably discern value differences at the limit.
      *   **Evaluation:** Weigh the options. Intransitivity is too costly for normative theory (decision theory collapses). Vagueness or Lexical views preserve transitivity while explaining the intuition.
      *   **Conclusion:** Definite conclusion. The argument reveals vagueness or epistemic limits, not genuine intransitivity. Transitivity must be preserved for normative coherence.

