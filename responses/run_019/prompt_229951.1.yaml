      *   *Vagueness View:* The concept 'better than' is vague. Sorites paradox applies. There is no sharp cutoff, but transitivity holds for precise comparisons.
      *   *Threshold/Lexical View:* There is a point where intensity matters lexically. Once pain passes a certain threshold, duration doesn't matter enough to outweigh it. (Kagan, Anderson).
      *   *Epistemic/Reliability View:* Our intuitions about adjacent pairs are unreliable due to 'just noticeable differences'. We *think* $A > B$, but they are actually equal, or we can't tell.
      *   *Aggregation View:* Maybe intensity and duration aren't linearly tradeable.

  4.  **Structuring the Essay:**
