      *   **Required Defences of Transitivity:**
          *   Role of betterness in rational choice.
          *   Unreliability of pairwise comparisons at small margins.
      *   **Language:** British English.
      *   **Outcome:** Reach a definite conclusion and justify it.

  2.  **Deconstruct the Argument (The Spectrum/Continuum Argument):**
      *   *Premise 1:* Adjacent comparability (Small Difference Principle). For any adjacent pair $x_i, x_{i+1}$, $x_i$ is better than $x_{i+1}$.
      *   *Premise 2:* Transitivity. If $x$ is better than $y$ and $y$ is better than $z$, then $x$ is better than $z$.
      *   *Premise 3:* Non-cyclicity/Endpoint intuition. The last item (long mild discomfort) is worse than the first item (short sharp pain).
