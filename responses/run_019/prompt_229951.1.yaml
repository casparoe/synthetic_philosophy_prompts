answer: |-
  **The Transitivity of Betterness: An Assessment of the Spectrum Argument**

  The question of whether the relation 'all things considered better than' is transitive lies at the heart of normative theory. Transitivity—the principle that if $A$ is better than $B$, and $B$ is better than $C$, then $A$ must be better than $C$—is a cornerstone of rational choice theory and classical axiology. However, spectrum arguments, most notably associated with Derek Parfit and Larry Temkin, pose a formidable challenge to this orthodoxy. By constructing a chain of outcomes ranging from a brief, severe pain to an extremely long, mild discomfort, these arguments suggest that while each adjacent link in the chain preserves betterness, the endpoints reverse the relation. This essay will assess whether such arguments succeed in demonstrating that betterness is genuinely intransitive. It will argue that while the spectrum argument successfully exposes inconsistencies in our ordinary pairwise judgements and highlights the vagueness of evaluative concepts, it fails to prove that the underlying betterness relation is intransitive. Preserving transitivity is necessary for the coherence of rational agency, and the paradox is best resolved by viewing betterness as either threshold-structured or by acknowledging the epistemic unreliability of marginal comparisons.

  To understand the force of the spectrum argument, one must first distinguish between distinct claims regarding intransitivity. The strongest claim is ontological: that the value relation itself is genuinely intransitive. On this view, reality permits cycles of betterness; $A$ can be better than $B$, $B$ better than $C$, and $C$ better than $A$, without contradiction. A weaker claim is psychological: that our ordinary evaluative judgements are jointly inconsistent, even if the underlying relation is transitive. A third possibility is that betterness is transitive but vague, akin to the concept 'tall', leading to Sorites-style paradoxes where no sharp boundary exists between 'better' and 'not better'. Finally, one might argue that the spectrum rests on an illicit aggregation of value factors, such as intensity and duration, implying a lexical or threshold structure where transitivity holds but the 'Small Difference Principle' (that small changes cannot reverse value) fails.

  Proponents of genuine intransitivity, such as Temkin, argue that we should trust our intuitions about the cases. In the pain spectrum, the intuition that a slightly shorter but slightly more intense pain is better than its neighbour seems robust for every adjacent pair. Yet, the intuition that a lifetime of mild discomfort is worse than a minute of agony is equally robust. If we accept both sets of intuitions, logic dictates that transitivity must fail. Temkin suggests that 'better than' is not a single, unified relation but a cluster of different respect-specific comparisons that do not aggregate transitively across a spectrum. This view respects the phenomenology of our moral experience, refusing to sacrifice strong intuitions at the altar of formal consistency.

  However, accepting genuine intransitivity comes at a prohibitive theoretical cost, primarily concerning the role of betterness in guiding rational choice. In decision theory, 'better than' is standardly analysed as 'ought to be chosen over'. If betterness is intransitive, an agent's preferences are vulnerable to a 'money pump'. If an agent prefers $A$ to $B$, $B$ to $C$, but $C$ to $A$, they could be induced to trade $A$ for $B$ (paying a small fee), then $B$ for $C$ (paying a fee), and finally $C$ for $A$ (paying a fee), ending up with their original option but less wealth. This cycle can be repeated indefinitely, draining the agent's resources without improving their outcome. If 'all things considered better than' is to serve as a guide for action, it must rule out such cycles. Therefore, even if our intuitions suggest intransitivity, the functional role of value in practical reasoning demands that the relation itself remains transitive. This suggests that the spectrum argument reveals a flaw in our judgements or concepts, rather than in the logic of value itself.

  A more plausible defence of transitivity appeals to the vagueness of evaluative terms. The spectrum argument is structurally identical to the Sorites paradox. If we remove one grain from a heap, it remains a heap; repeat this, and eventually, we have no grains, yet presumably no heap. Similarly, if each step down the pain spectrum is 'not worse' than the previous, the endpoint should not be worse. The solution to the Sorites is generally not to accept that 'heap' is an incoherent concept, but to acknowledge that vague predicates lack sharp boundaries. Applied to axiology, this suggests that there are zones of indeterminacy where it is neither true nor false that $A$ is better than $B$. In these zones, the transitivity of 'better than' is not violated because the relation does not obtain determinately. Thus, the chain of 'better than' relations is broken not by a reversal, but by a gap where comparability fails or becomes indeterminate. This preserves the transitivity of the relation where it is determinate, while explaining why the inference from start to finish feels compelling yet false.

  Alternatively, one might defend transitivity by rejecting the Small Difference Principle via a threshold or lexical view. Philosophers such as Shelly Kagan have argued that certain values are lexical. It may be that once pain crosses a threshold of severity, no amount of duration of a milder pain can outweigh it. On this view, the adjacent comparisons in the middle of the spectrum are genuine, but at some specific point in the chain, the intensity drops below a critical threshold (or rises above it), causing a discontinuous jump in value. While this posits a seemingly arbitrary boundary, it is less damaging than intransitivity. It maintains that 'better than' is transitive, but that the *features* contributing to betterness (intensity and duration) do not trade off linearly. The spectrum argument fails here because it assumes a continuous trade-off where none exists.

  Furthermore, we must consider the epistemic reliability of pairwise judgements at very small margins. The spectrum argument relies on the premise that we can reliably judge that $A_i$ is better than $A_{i+1}$. However, when differences in intensity and duration become minute, they may fall below the threshold of discriminability. If two outcomes are phenomenologically indistinguishable to the evaluator, asserting that one is 'better' is epistemically unjustified. If $A_i$ and $A_{i+1}$ are in fact of equal value, the chain of strict betterness is broken immediately. The illusion of a continuous chain of improvements is a cognitive error resulting from our inability to detect equality at the margins. We mistake 'not noticeably worse' for 'better'. If the chain contains links of equality rather than strict betterness, transitivity is preserved, and the paradox dissolves.

  Weighing these defences, the claim that the spectrum argument proves genuine intransitivity is the least tenable. To abandon transitivity is to abandon the possibility of coherent maximisation in rational choice, rendering the concept of 'all things considered better than' practically useless. The cost of saving our intuitions about the pain spectrum is too high if it requires collapsing the framework of rational agency.

  The most supported interpretation is that the spectrum argument exposes the vagueness of our evaluative concepts and the limits of our discriminative faculties, rather than a failure of transitivity in the value relation itself. The 'better than' relation is transitive, but our access to it is mediated by concepts that admit of degrees and indeterminacy. The apparent contradiction arises because we treat a vague relation as if it were precise. Either there are thresholds of intensity that disrupt the linear aggregation of duration, or there are zones of indeterminacy where 'better than' does not obtain. In either case, the chain of strict betterness required to generate a contradiction is illusory.

  In conclusion, the spectrum argument does not succeed in showing that 'all things considered better than' is intransitive. While it powerfully demonstrates that our ordinary pairwise judgements are jointly inconsistent when aggregated over long chains, this inconsistency is best attributed to the vagueness of value predicates or the unreliability of marginal comparisons. To maintain the normative force of axiology and the coherence of rational choice, we must uphold the transitivity of betterness. The lesson of the spectrum is not that logic fails in ethics, but that our intuitive grasp of value is insufficiently precise to track transitive relations across vast qualitative distances without error. We should therefore reject genuine intransitivity and instead refine our understanding of how intensity and duration aggregate, likely acknowledging lexical thresholds or zones of indeterminacy that break the problematic chain.
