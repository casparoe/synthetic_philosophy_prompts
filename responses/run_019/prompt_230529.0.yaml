      *   *Clarification:* Ensure the distinction between *Weak AI* (tool) and *Strong AI* (mind) is clear.
      *   *Nuance:* Acknowledge that Searle isn't saying machines *can't* think, just that *computation* isn't the *definition* of thinking. He allows for brain machines.
