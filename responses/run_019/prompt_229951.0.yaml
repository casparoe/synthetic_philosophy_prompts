answer: |-
  **The Transitivity of Betterness: A Defence Against the Spectrum Argument**

  In the study of axiology, few principles appear as foundational as the transitivity of the 'all things considered better than' relation. If outcome $A$ is better than $B$, and $B$ is better than $C$, it seems logically necessary that $A$ is better than $C$. Yet, as raised in our seminar, spectrum arguments pose a formidable challenge to this intuition. By constructing a chain of outcomes ranging from short, severe pain to long, mild discomfort, where each adjacent step seems preferable to the last, but the endpoint seems worse than the start, one appears to derive a contradiction. This essay assesses whether such arguments succeed in demonstrating that 'better than' is intransitive. I shall argue that they do not. While the spectrum argument effectively highlights the vagueness of our evaluative concepts and the difficulties of aggregation, it fails to prove that the underlying betterness relation is genuinely intransitive. The most plausible interpretation is that 'better than' remains transitive, and the argument fails because the premise claiming strict betterness between every adjacent pair is false, owing to phenomena of imprecise equality or lexical thresholds.

  To evaluate the argument, we must first distinguish between distinct claims regarding intransitivity. The first is a psychological claim: that our ordinary pairwise *judgements* are jointly inconsistent. This is undeniable; the spectrum argument demonstrates that our intuitive responses to adjacent cases conflict with our response to the endpoints. However, this does not entail the second, metaphysical claim: that the *relation* of betterness itself is intransitive. Larry Temkin, a prominent defender of intransitivity, argues for the latter. He suggests that 'better than' is essentially comparative and context-dependent, such that $A$ can be better than $B$ relative to the choice set $\{A, B\}$, yet fail to be better than $B$ in a chain leading to $Z$. A third possibility is that betterness is transitive but our access to it is obscured by vagueness, threshold structures, or lexical orderings. Finally, one might argue the spectrum rests on an illicit aggregation of intensity and duration, rendering the comparison category mistakes. To determine if the argument succeeds, we must weigh these interpretations against the normative role of betterness.

  The strongest reason to preserve transitivity lies in the connection between value and rational choice. The concept of 'better than' is not merely descriptive; it is action-guiding. If an agent judges $A$ better than $B$, rationality typically demands a preference for $A$ over $B$. If 'better than' were intransitive, an agent could prefer $A$ to $B$, $B$ to $C$, and $C$ to $A$. This creates the possibility of a 'money pump': an agent could be induced to pay a small sum to switch from $C$ to $A$, then from $A$ to $B$, then from $B$ to $C$, returning to their original state but with less wealth. Such behaviour is paradigmatically irrational. If 'all things considered better than' is to serve as the cornerstone of practical rationality, it must be transitive. To concede intransitivity is to sever the link between value and coherent choice, rendering the concept axiologically inert. Therefore, the burden of proof lies heavily on those who would abandon transitivity.

  Given this burden, how might we defuse the spectrum argument while maintaining transitivity? The argument relies on two substantive premises: first, that for every adjacent pair in the spectrum, the slightly shorter but more intense pain is better than the longer, milder one; and second, that the final long, mild discomfort is worse than the initial short, severe pain. If transitivity holds, one of these premises must be false.

  The most sophisticated defence of transitivity appeals to vagueness and the notion of 'imprecise equality', a concept developed by Derek Parfit and Ruth Chang. The spectrum argument functions as a Sorites paradox. It assumes that because the difference between adjacent cases is small, the evaluative ranking must remain strict and constant ($A > B > C \dots$). However, value concepts are often vague. Between two very similar outcomes, it may be indeterminate which is better, or they may be 'on a par'. If $A$ and $B$ are imprecisely equal, it is false that $A$ is strictly better than $B$. Consequently, the chain of strict betterness is broken. If there is even one link in the chain where $x_i$ is not strictly better than $x_{i+1}$, the transitivity of strict betterness is not violated, because the antecedent condition ($x_i > x_{i+1}$) is not met. This preserves the transitivity of the relation while accommodating the intuition that we cannot pinpoint exactly where the shift occurs.

  Alternatively, one might defend a lexical threshold view. This position holds that certain qualitative features, such as the severity of pain, trump quantitative features like duration once a certain threshold is crossed. On this view, a 'severe' pain is lexically worse than any amount of 'mild' discomfort, regardless of duration. The spectrum argument assumes a continuous trade-off between intensity and duration. If there is a discontinuity—a point where intensity becomes lexically significant—then the claim that every adjacent step is better than the last is false. At the point where intensity crosses the threshold of severity, the trade-off halts. While this view saves transitivity, it is theoretically costly, as it implies a rigid structure to value that may not match our nuanced intuitions about trade-offs in other contexts. Nevertheless, it remains a logically valid defence against the spectrum argument.

  A further consideration concerns the aggregation of intensity and duration. The spectrum argument assumes that intensity and duration are commensurable on a single scale of 'badness'. However, one might argue that the experience of severe pain involves a qualitative rupture in consciousness that mild discomfort does not. If the two endpoints belong to different evaluative categories, the comparison may be flawed. However, this defence is weaker than the vagueness argument. It seems plausible that duration can eventually outweigh intensity; a millennium of mild annoyance may well be worse than a second of sharp pain. The issue is not necessarily incommensurability, but rather the reliability of our judgements at the margins.

  We must also consider the reliability of pairwise judgements at very small margins. In the seminar, it was noted that 'nearly everyone judges the slightly shorter but slightly more intense episode to be better'. This consensus may be an illusion born of the 'focus effect'. When comparing $A$ and $B$ in isolation, the difference in intensity is salient, while the difference in duration seems negligible. However, this does not guarantee that $A$ is objectively better than $B$ in a way that sustains a long chain. Our cognitive apparatus is not calibrated to detect value differences at the limit of perceptibility. To build a metaphysical conclusion about the structure of value on the basis of intuitions about marginally different cases is epistemologically risky. It is more reasonable to suppose that our judgements in these marginal cases are unreliable than to suppose that the logic of rationality itself is flawed.

  Having weighed these defences, I conclude that the spectrum argument fails to show that 'better than' is intransitive. The interpretation best supported is that the betterness relation is transitive, but the premise asserting strict betterness between every adjacent pair is false due to vagueness and imprecise equality. This conclusion is superior to accepting genuine intransitivity because it preserves the normative force of 'better than' in rational choice. If we accept Temkin's view that betterness is intransitive, we must accept that rational agents can be trapped in cycles of preference, which undermines the very purpose of axiological inquiry.

  Furthermore, the vagueness defence respects the phenomenology of the puzzle without collapsing into contradiction. It acknowledges that while we feel pulled towards the adjacent judgements, we are not compelled to affirm them as strict truths. We can admit that $A$ is not worse than $B$, and $B$ is not worse than $C$, without being forced to say $A$ is strictly better than $C$ in a way that contradicts the endpoint intuition, because the relation between the intermediates is one of imprecise equality rather than strict inequality. The 'chain' is not a ladder of strict steps, but a slope of overlapping regions of comparability.

  In conclusion, the spectrum argument serves as a valuable heuristic for understanding the complexity of value aggregation and the limits of our intuitive judgements. It reveals that 'better than' is a vague predicate and that small differences do not always generate strict rankings. However, it does not succeed in demonstrating that the relation itself is intransitive. To maintain the coherence of rational choice and the normative guidance of axiology, we must uphold transitivity. The error lies not in the logic of betterness, but in the assumption that a continuum of small differences guarantees a continuum of strict preference. Thus, the relation 'all things considered better than' remains transitive, and the apparent paradox is dissolved by recognising the vagueness inherent in our evaluative concepts.
