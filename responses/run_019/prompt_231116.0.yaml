      *   *Nuance:* Don't say Descartes is "wrong." Say the *framework* is wrong for this text.

  8.  **Final Polish:**
      *   Check tone (academic, philosophical).
      *   Ensure specific terms (*wu hua*, *fen*, *bu zhi*) are used correctly.
      *   Verify the prompt's requirement to discuss "what the text licenses" vs. "leaves open."

