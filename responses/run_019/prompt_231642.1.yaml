answer: |-
  **Tutorial Plan: Harsanyi's Aggregation Theorem**

  **1. The Anchor Example: "The Disaster Relief Lottery"**
  Use a single running example: Two survivors (A and B) and a limited aid package. There are three policies (Lotteries) determining who receives aid.
  *   **Features Required:** Risk (probabilities), distinct agents, cardinal payoffs (utilities).
  *   **Features to Lack:** Any natural unit of measurement (e.g., do not use dollars or "hedons"). Utilities must be abstract numbers to prevent intuitive interpersonal comparison.
  *   **Function:** This example will be calculated at every stage. Students will assign arbitrary VNM utilities to outcomes for A and B, then observe how social rankings shift when weights or scales change.

  **2. Sequence and Dependencies (120 Minutes)**

  *   **Phase 1: Individual Rationality (30 mins)**
      *   **Content:** Define alternatives as lotteries. Elicit VNM utility functions $u_i$ for A and B using the example.
      *   **Dependency:** Establish **cardinality up to positive affine transformation** here.
      *   **Misconception Defusal:** When students assign numbers (e.g., A=10, B=5), explicitly state these are *ordinal representations of risk attitudes*, not measures of happiness. If A rescales to $2u_A + 3$, preferences remain unchanged. This preempts the "utility = happiness" error.

  *   **Phase 2: The Social Condition (30 mins)**
      *   **Content:** Introduce the Social Welfare Function (SWF). State the **Pareto Condition**: If all individuals prefer lottery $L$ to $M$, society must prefer $L$ to $M$.
      *   **Dependency:** Explain that while Pareto is defined on preferences, the theorem concludes about *utility functions*. We need the VNM representation (Phase 1) to translate Pareto on preferences into constraints on utility functions. Without VNM, we cannot move from orderings to linear combinations.
      *   **Misconception Defusal:** Clarify that Pareto is a consistency requirement, not a moral justification.

  *   **Phase 3: The Aggregation Theorem (45 mins)**
      *   **Content:** Present the result: If individual and social preferences satisfy VNM axioms and Pareto, then $W = \sum a_i u_i$ (where $a_i \geq 0$).
      *   **Dependency:** This relies entirely on the affine properties established in Phase 1.
      *   **Misconception Defusal (Weights):** Immediately highlight that $a_i$ are **arbitrary non-negative constants**. The theorem does *not* prove $a_A = a_B$. To get equal weights, you must add an **Anonymity** axiom (swapping individuals doesn't change social welfare). Do not let them assume utilitarianism implies equality.
      *   **Misconception Defusal (Comparability):** Revisit the rescaling from Phase 1. If $u_A$ is rescaled, $a_A$ must adjust to keep $W$ constant. Since there is no natural link between $u_A$'s unit and $u_B$'s unit, the weights $a_i$ absorb the incomparability. The theorem assumes no interpersonal comparability; it merely aggregates indexed functions.

  *   **Phase 4: Normative Limits (15 mins)**
      *   **Content:** Summarize what the theorem is (a representation result) and is not (a moral proof).
      *   **Misconception Defusal:** Flag that the theorem is conditional ("*If* you accept VNM and Pareto..."). It does not force you to accept utilitarianism if you reject VNM (e.g., due to risk aversion over social states) or Pareto (e.g., due to fairness concerns).

  **3. Check for Understanding**
  Do not ask for a proof sketch. Instead, present this scenario:
  *"Student X claims Harsanyi proves we should maximize total utility with equal weights. Student Y changes Person A's utility scale by multiplying by 100. According to the theorem, what must happen to the weight on Person A to maintain the same social ordering? Does this change require new moral information?"*
  *   **Correct Answer:** The weight on A must be divided by 100. No new moral information is needed; it is a mathematical necessity of the representation. This confirms they understand the underdetermination of weights and the lack of interpersonal comparability.

  **4. Scope Limits: What to Refuse**
  Explicitly state you will **not** cover:
  *   **Harsanyi's Veil of Ignorance Argument:** This is a distinct argument for utilitarianism based on rational choice under uncertainty, often conflated with the Aggregation Theorem. Keep them separate to avoid confusing *aggregation of known preferences* with *choice behind a veil*.
  *   **Variable Populations:** Do not discuss critical-level utilitarianism or repugnant conclusions.
  *   **Non-VNM Preferences:** Do not entertain rank-dependent or ambiguity-averse models yet.

  **5. Pedagogical Map of Misconceptions**
  *   **"Utilities are comparable happiness":** Defuse in Phase 1 (Affine Transformation).
  *   **"Theorem proves Equal Weights":** Defuse in Phase 3 (Arbitrary Constants).
  *   **"Theorem justifies Utilitarianism unconditionally":** Defuse in Phase 4 (Conditional Character).
  *   **"Pareto is moral truth":** Defuse in Phase 2 (Consistency Requirement).

  By anchoring the math in the "Disaster Relief" numbers and forcing them to manipulate the scales, you make the abstraction of "no interpersonal comparability" concrete. They will see that without a rule for fixing weights, the "social welfare" number is meaningless across different scalings.
