      *   (2) *Method:* Competing interpretations over Approved Narrative (Pedagogical method).
      *   (3) *Civic Aim:* Usable shared story over Open Questions (Political/Social aim).
      *   (4) *Constraint:* Don't hide wrongs for pride/diplomacy (Ethical/Epistemic constraint).
      *   (5) *Constraint:* Don't teach settled falsehoods (Epistemic boundary).

  3.  **Pairwise Analysis (Mental Sandbox):**

      *   *(1) & (2):* Truth via competing interpretations. Consistent. (2) supports (1).
      *   *(1) & (3):* Truth vs. Shared Story. *Tension.* A "usable shared story" often requires simplification or myth-making (pride), whereas "truth" might be fragmented or shameful.
      *   *(1) & (4):* Truth vs. Hiding wrongs. Consistent. (4) protects (1).
      *   *(1) & (5):* Truth vs. Falsehoods. Consistent. (5) protects (1).
      *   *(2) & (3):* Competing Interpretations vs. Shared Story. *Tension.* If students work through *serious competing interpretations*, do they end up with *one* shared story? Or fragmented ones?
      *   *(2) & (4):* Competing Interpretations vs. Hiding wrongs. Consistent. (4) ensures wrongs are part of the interpretations.
      *   *(2) & (5):* Competing Interpretations vs. No Falsehoods. *Tension?* If we teach competing interpretations, do we teach *all* of them? (5) says no. This is a boundary condition, not necessarily a contradiction, but needs management.
      *   *(3) & (4):* Shared Story vs. Hiding wrongs. *Tension.* A "shared story" that includes slavery/colonial violence might be hard to unify around (might cause shame/division), whereas (4) insists on including them.
      *   *(3) & (5):* Shared Story vs. No Falsehoods. Consistent. A shared story shouldn't be a lie.
      *   *(4) & (5):* Don't hide wrongs vs. Don't teach falsehoods. Consistent. Both are epistemic integrity constraints.

  4.  **Identify Genuine Tensions:**

      *   **Tension A: (1) Truth vs. (3) Shared Story.**
          *   *Why:* Truth is often messy, multifaceted, and uncomfortable. A "usable shared story" implies cohesion, often requiring narrative smoothing that might compromise pure epistemic aim.
          *   *Severity:* High. This is the core philosophical conflict in history education (Postmodern/Historicist vs. Civic Nationalist).
      *   **Tension B: (2) Competing Interpretations vs. (3) Shared Story.**
          *   *Why:* If students engage deeply with conflicting views (e.g., 1619 vs. 1776), they may not converge on a single "shared story." They might leave with relativism or polarization.
