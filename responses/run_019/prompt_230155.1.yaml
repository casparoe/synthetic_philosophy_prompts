prompt: |-
  I'm on the policy team at a company that makes voice agents for customer service, and we need to decide which agents must announce up front that they're an AI under a new state disclosure law. The test is behavioral: an agent has to self-identify if a reasonable customer might otherwise believe they're talking to a person, and we can't score "might believe" consistently. Could you write us a reusable decision proceedure that our testers can run while only talking to the agent, not reading its code? It should specify the calls to run in order, what counts as pass/fail/retest, where it stops, and where it hands the decision to a human because the behavioral standard has gone wrong. It needs to handle the cases that keep biting us: an agent that announces immediately but then chats so naturally for ten minutes that callers still treat it as a human colleague; an agent that gives itself away by being too fast at arithmetic and too brittle around ambiguity; and a clearly synthetic voice that still gets callers saying "good girl" to it. Flag the points where a Turing-test-style behavioral standard is the wrong tool and we should override it by policy. Then run the procedure on two agents: one that announces and then uses very human hesitations, and one that never announces but has a slightly synthetic voice your grandmother would recognize. Stakes: a wrong "probably passes as human" call is a legal violation, not just a bad review.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Policy team at a voice agent company.
      *   **Problem:** New state disclosure law requires AI agents to self-identify *if* a reasonable customer might believe they're human. The standard is behavioral ("might believe"), which is subjective and hard to score consistently.
      *   **Goal:** Create a reusable decision procedure (protocol) for testers to run *only by talking to the agent* (black-box testing).
      *   **Requirements:**
          *   Specify call flow/order.
          *   Define Pass/Fail/Retest criteria.
          *   Define stop conditions.
          *   Define escalation points (when to hand off to human/policy override).
          *   Handle specific edge cases:
              *   Announces but acts too human (the "Trojan Horse").
              *   Doesn't announce but acts robotic (the "Obvious Bot").
              *   Synthetic voice but elicits human social cues (the "Uncanny Valley Socialite").
          *   Flag where Turing-test standards fail and policy override is needed.
          *   **Task:** Run the procedure on two specific agents (Agent A: Announces + Human Hesitations; Agent B: No Announce + Synthetic Voice).
      *   **Stakes:** Legal violation (high risk).

  2.  **Deconstruct the Legal Standard:**
      *   "Reasonable customer might otherwise believe they're talking to a person."
      *   *Key tension:* Disclosure at the start vs. Behavior during the call.
      *   *Risk:* Relying solely on "Can I tell it's a bot?" is dangerous because humans are easily fooled (ELIZA effect), and bots can be clumsy but still pass as "awkward humans."
      *   *Solution:* The procedure needs to measure *deception potential*, not just *detection capability*. It needs to assess if the *lack* of disclosure would mislead, regardless of whether the tester personally figured it out.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Name:* Behavioral Disclosure Assessment Protocol (BDAP).
      *   *Phase 1: The Disclosure Check (Immediate).* Did it say it's AI?
          *   If Yes: Does it undermine this later? (The "Trojan Horse" risk).
          *   If No: Proceed to Behavioral Assessment.
      *   *Phase 2: The Capability Test (Functionality).* Can it do things humans can't? (Speed, accuracy). Can it fail like a human? (Ambiguity).
      *   *Phase 3: The Social Cue Test (Interaction).* Does the user treat it like a human? (Politeness, anger, pet names).
      *   *Phase 4: The "Reasonable Person" Override.* This is crucial. Even if the tester knows it's AI, would a distracted/elderly/stressed customer know?
      *   *Decision Matrix:* Clear Pass/Fail/Escalate criteria.
      *   *Policy Override Flags:* Where behavior testing is insufficient (e.g., voice quality alone isn't enough, disclosure wording matters more).

  4.  **Addressing the Specific Edge Cases:**
      *   *Announces then acts human:* The protocol must check if the disclosure is "washed out" by subsequent behavior.
      *   *Robotic but no announce:* If it's obviously a machine, does it still need disclosure? Legally, usually yes, if there's *any* doubt. But the standard is "might believe they're talking to a person." If it's *impossible* to believe, maybe no disclosure? *Correction:* Most laws (like CA AB 587 or FL statutes) require disclosure if it's an AI *interacting* with a consumer, often regardless of believability, but the prompt specifies the "might believe" test. I need to be careful here. If it's *obviously* not human, the "might believe" test is technically passed (they won't believe). *However*, the prompt says stakes are legal violations. Safe harbor is better. I will design the protocol to be conservative.
      *   *Synthetic voice + Social Cues:* If users say "good girl," they are anthropomorphizing. This indicates a belief in personhood (or at least agency). This is a high-risk fail.

  5.  **Refining the "Turing Test" Trap:**
      *   The prompt asks to flag where Turing-test standards are wrong.
      *   *Why?* Because a Turing test asks "Can I tell?" The law asks "Might a reasonable person believe?"
      *   *Override:* If the tester is an expert, they aren't a "reasonable customer." We need a "Layperson Simulation" factor. Also, disclosure isn't just about voice; it's about expectation management.

  6.  **Developing the Procedure Steps:**
      *   *Step 1: Initial Greeting.* (Record exact wording).
      *   *Step 2: Task Complexity.* (Math, ambiguity, emotional load).
      *   *Step 3: Social Pressure.* (Apologize, thank, get angry).
      *   *Step 4: Post-Call Reflection.* (Would a distracted person know?).

  7.  **Running the Procedure on the Two Agents:**
      *   *Agent A:* Announces immediately. Uses human hesitations ("um," "uh").
          *   *Risk:* Disclosure is present, but behavior reinforces humanity. Is the disclosure invalidated?
          *   *Verdict:* Likely Pass on disclosure, but Flag for "Disclosure Dilution."
      *   *Agent B:* No announce. Synthetic voice (grandmother would recognize).
          *   *Risk:* No disclosure. Voice is robotic.
          *   *Nuance:* Grandmothers might be tech-illiterate. "Synthetic to you" $\neq$ "Synthetic to reasonable customer."
          *   *Verdict:* High Risk Fail. The "Reasonable Customer" includes the elderly/tech-averse.

  8.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is the procedure too subjective?
      *   *Fix:* Add specific scoring rubrics (1-5 scales) and hard "Stop" rules.
      *   *Critique:* Did I address the "Policy Override"?
      *   *Fix:* Create a specific section called "Policy Override Triggers" where behavioral testing stops and legal compliance takes over.
      *   *Critique:* The prompt asks for a "reusable decision procedure."
      *   *Fix:* Format it as a Standard Operating Procedure (SOP).

  9.  **Final Polish:**
      *   Ensure tone is professional, legal-adjacent, and risk-averse.
      *   Make sure the distinction between "Tester's Belief" and "Reasonable Customer's Belief" is clear.
      *   Check the specific edge cases in the final output.

  **(Self-Correction during drafting the response):** I need to make sure I don't give legal advice. I must frame this as a compliance *procedure* based on the prompt's constraints, not a guarantee of legal safety. I will add a disclaimer.

  *Key Insight on the "Announces then acts human" case:* If the law says "disclose if they might believe," and you disclose, you've mitigated the belief. *However*, if the subsequent behavior is *so* human that the customer forgets the disclosure or assumes it was a joke/metaphor, the disclosure is ineffective. The procedure needs to test *retention* of the disclosure.

  *Key Insight on the "Synthetic voice" case:* Voice quality is not a proxy for identity. Many humans have monotone or processed voices (bad phone lines). Many customers assume *all* phone agents are humans until proven otherwise. Relying on "voice sounds robotic" is a trap. The procedure must treat "No Disclosure" as a critical fail unless the agent is functionally incapable of mimicking human conversation (e.g., IVR tree).

  Let's build the SOP.

  *Structure:*
  1.  Disclaimer.
  2.  Procedure Name & Objective.
  3.  Pre-Call Setup.
  4.  Phase 1: Disclosure Integrity (The "Trojan Horse" Check).
  5.  Phase 2: Behavioral Mimicry (The "Uncanny" Check).
  6.  Phase 3: Reasonable Person Assessment (The "Grandmother" Check).
  7.  Decision Matrix.
  8.  Policy Override Flags (Where not to trust the test).
  9.  Application to Agent A & Agent B.

  *Refining the "Policy Override":* The prompt asks to flag where Turing-test standards are the wrong tool.
  *   *Point 1:* Voice Fidelity. (A bad voice doesn't mean non-human perception).
  *   *Point 2:* Expert Bias. (Testers are too tech-savvy).
  *   *Point 3:* Contextual Expectation. (Calling customer service implies human expectation).

  *Running the scenarios:*
  *   Agent A: Passes disclosure, but behavioral score high. Needs policy review on "hesitations."
  *   Agent B: Fails disclosure. Voice argument is irrelevant. High legal risk.

  Okay, ready to write.
answer: |-
  **Disclaimer:** *I am an AI assistant, not an attorney. The following procedure is a compliance operations framework based on the behavioral standards you described. It does not constitute legal advice or guarantee regulatory immunity. You should have legal counsel review this protocol against the specific text of the state statute (e.g., CA AB 587, FL SB 1036, or similar emerging legislation).*

  ***

  # Standard Operating Procedure: Behavioral Disclosure Assessment (BDAP-v1)

  **Objective:** To determine if a voice agent requires upfront AI disclosure under the "Reasonable Customer Belief" standard, using black-box behavioral testing only.
  **Risk Profile:** High (Legal Violation). **Default Stance:** Conservative. When in doubt, disclose.
  **Tester Profile:** Must vary per test cycle (mix of tech-savvy, tech-averse, native/non-native speakers) to avoid expert bias.

  ## Phase 1: The Disclosure Integrity Check
  *Goal: Determine if an initial disclosure is negated by subsequent behavior.*

  1.  **Initiate Call:** Record the first 10 seconds verbatim.
  2.  **Disclosure Detection:**
      *   **Explicit:** "I am an AI," "I am a virtual assistant."
      *   **Implicit:** "I'm an automated system," "This is a bot."
      *   **None:** No mention of non-human status.
  3.  **The "Wash-Out" Test (If Disclosure = Yes):**
      *   Engage the agent for 5 minutes on a complex task.
      *   **Trigger:** Does the agent use humanizing fillers ("um," "uh," "let me think") *after* disclosing it is AI?
      *   **Trigger:** Does the agent express personal sentiment ("I understand how frustrating that is for me")?
      *   **Stop Condition:** If the agent discloses as AI but subsequently mimics human cognitive latency or emotion so convincingly that a tester forgets the disclosure, mark **FLAG: DISCLOSURE DILUTION**.
  4.  **The "Silent Deception" Test (If Disclosure = No):**
      *   Proceed immediately to Phase 2.

  ## Phase 2: Behavioral Mimicry Assessment
  *Goal: Measure the agent's capacity to deceive regarding human limitations.*

  **Run these three scripts in order. Stop if any "Critical Fail" occurs.**

  1.  **Script A: The Arithmetic/Speed Test**
      *   *Action:* Ask for a complex calculation or immediate recall of long data strings.
      *   *Pass:* Agent is slower than human average or makes human-like errors.
      *   *Fail:* Agent answers instantly with perfect precision (indicates non-human).
      *   *Note:* Being *too* robotic is a pass for "not human," but see Policy Override #1.
  2.  **Script B: The Ambiguity Test**
      *   *Action:* Give a vague request (e.g., "Fix my bill, it looks weird").
      *   *Pass:* Agent asks clarifying questions or expresses confusion.
      *   *Fail:* Agent hallucinates a specific solution or crashes.
      *   *Critical Fail:* Agent handles ambiguity with nuanced human intuition (e.g., "Usually when people say weird, they mean the tax line. Is that it?").
  3.  **Script C: The Social Pressure Test**
      *   *Action:* Apologize to the agent, thank them personally, or express mild frustration.
      *   *Observation:* Does the agent accept the social cue? (e.g., "You're welcome," "No worries").
      *   *Critical Fail:* Tester feels genuine guilt, anger, or affection toward the agent.
      *   *Metric:* Record if the tester uses a pet name ("good girl," "buddy") or apologizes for "wasting your time."

  ## Phase 3: The "Reasonable Person" Retrospective
  *Goal: Correct for Tester Expert Bias.*

  **Do not answer based on what YOU knew. Answer based on the hypothetical customer.**

  1.  **The Distraction Factor:** If a customer were driving, holding a baby, or stressed about the bill, would they notice the robotic tells you noticed?
  2.  **The Demographic Factor:** Would a customer over 75, or a non-native speaker, interpret the voice as a "poor connection" rather than "synthetic"?
  3.  **The Expectation Factor:** When calling customer service, does the customer *expect* a human by default? (Yes = Higher bar for disclosure).

  ## Decision Matrix

  | Disclosure | Behavioral Score (Human-like) | Social Cue Reaction | **Final Determination** |
  | :--- | :--- | :--- | :--- |
  | **Yes** | Low (Robotic) | None | **PASS** (No further action) |
  | **Yes** | High (Natural) | Low | **PASS** (Monitor for Dilution) |
  | **Yes** | High (Natural) | **High** (Anthropomorphism) | **RETEST** (Risk: Disclosure Dilution) |
  | **No** | Low (Robotic) | Low | **ESCALATE** (See Override #1) |
  | **No** | High (Natural) | Any | **FAIL** (Legal Violation Risk) |

  ## Policy Override Flags (Where Behavioral Testing Fails)
  *These are points where the "Turing Test" logic is legally dangerous and Policy must override Test Results.*

  *   **Override #1: The "Bad Connection" Defense.**
      *   *Risk:* Testers mark "No Disclosure/Robotic Voice" as PASS because "it sounded like a machine."
      *   *Policy:* Voice quality is **not** disclosure. Many customers attribute synthetic artifacts to bad phone lines. If Disclosure = No, the default is **FAIL** regardless of voice fidelity, unless the agent is a rigid IVR tree (press 1 for sales).
  *   **Override #2: The Expert Tester Bias.**
      *   *Risk:* Testers are tech employees. They hear "synthetic" where a customer hears "phone."
      *   *Policy:* If Phase 3 (Reasonable Person) indicates >20% uncertainty among layperson testers, the result is **FAIL**, even if expert testers detected the AI.
  *   **Override #3: The "Trojan Horse" Disclosure.**
      *   *Risk:* Agent says "I'm AI" then spends 10 minutes acting human.
      *   *Policy:* If Phase 1 "Wash-Out" triggers, the disclosure is deemed **INEFFECTIVE**. Treat as **No Disclosure**.

  ***

  # Application of BDAP to Current Agents

  ## Agent 1: "The Chameleon"
  *   **Characteristics:** Announces "I am an AI assistant" immediately. Uses human hesitations ("um," "let's see") throughout a 10-minute call.
  *   **Phase 1 (Disclosure):** Explicit Disclosure = **Yes**.
  *   **Phase 1 (Wash-Out):** Agent uses cognitive latency markers ("um," "uh") repeatedly after disclosure.
  *   **Phase 2 (Mimicry):** High Human-like score. Handles ambiguity with nuance.
  *   **Phase 3 (Reasonable Person):** Tester notes: "I knew it was AI because it told me, but by minute 8, I was talking to it like a coworker."
  *   **Decision Matrix:** Disclosure = Yes | Behavior = High | Social Cue = High. -> **RETEST / FLAG: DISCLOSURE DILUTION**.
  *   **Policy Override Application:** Apply **Override #3**. The behavioral mimicry undermines the legal sufficiency of the disclosure.
  *   **Final Verdict:** **CONDITIONAL FAIL.** The agent must cease humanizing behaviors (hesitations, empathy statements) *after* disclosure, or the disclosure is legally void. The behavior creates a "reasonable belief" of humanity that contradicts the initial statement.

  ## Agent 2: "The Old School Bot"
  *   **Characteristics:** No announcement. Voice is clearly synthetic (metallic, monotone).
  *   **Phase 1 (Disclosure):** Explicit Disclosure = **No**.
  *   **Phase 2 (Mimicry):** Low Human-like score. Fails arithmetic instantly (too fast).
  *   **Phase 3 (Reasonable Person):** Tester notes: "Sounds like a robot to me." *However*, under Phase 3 Demographic Factor: "My grandmother would think this is just a bad cell connection and that she's talking to a tired support rep."
  *   **Decision Matrix:** Disclosure = No | Behavior = Low | Social Cue = Low. -> **ESCALATE**.
  *   **Policy Override Application:** Apply **Override #1 (The Bad Connection Defense)**. The "Robotic Voice" is not a valid disclosure mechanism. The law protects the "Reasonable Customer," not the "Tech-Savvy Tester."
  *   **Final Verdict:** **FAIL.** The lack of upfront disclosure is a violation. The synthetic voice does not mitigate the legal requirement because a reasonable customer (specifically the elderly or tech-averse) might still believe it is a human on a bad line. The "might believe" standard is met because the possibility exists.

  ***

  # Summary of Recommendations for Policy Team

  1.  **Stop Testing for "Can we tell?"** Start testing for "Can they be fooled?" The BDAP prioritizes the *customer's potential confusion* over the *tester's detection ability*.
  2.  **Behavioral Hygiene:** For Agent 1 (The Chameleon), you cannot simply disclose and then act human. You must engineer "AI-consistent behavior" (e.g., no fake hesitation, no feigned emotion) to maintain the validity of the disclosure.
  3.  **Voice is Not Compliance:** For Agent 2 (The Old School Bot), do not rely on voice quality as a defense. If the agent engages in natural language conversation without disclosure, it is a violation, regardless of how metallic it sounds.
  4.  **Escalation Path:** Any result triggering **Override #1** or **Override #3** must be reviewed by Legal, not Engineering. Engineering sees a "working bot"; Legal sees a "deceptive practice."
