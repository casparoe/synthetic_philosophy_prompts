answer: |-
  Your verdicts are remarkably consistent with Dennett's own intentions in *Kinds of Minds* and *Darwin's Dangerous Idea*. The friction you and your friend are experiencing stems from conflating the **origin of the capacity** with the **mechanism of the current act**.

  There is indeed a single principle that unifies your verdicts and resolves your conflicts. It is this:

  ### **The Principle of the Site of Selection**
  **The taxonomy is defined by *where* and *how* the filtering of behavioral options occurs before the final action is taken.**

  Specifically: **Who or what pays the cost of failure?**

  1.  **Darwinian:** The cost was paid by **ancestors**. The option is pre-filtered by evolutionary history. (The spider does not generate options; it executes the one surviving script.)
  2.  **Skinnerian:** The cost is paid by the **agent in the real world**. Options are generated and executed; the environment punishes the bad ones, shaping future behavior. (The rat tries the dead end, gets no food, and stops going there.)
  3.  **Popperian:** The cost is paid by **representations in an inner model**. Options are generated and simulated; the internal model "punishes" the bad ones before they are enacted. (The chimp sees the branch bend and simulates the fall without jumping.)
  4.  **Gregorian:** The cost is paid by **cultural artifacts**. Options are processed through external tools (language, logic, notes) that scaffold the selection process. (The student uses mnemonics to filter correct answers.)

  ---

  ### Resolving Your Conflicts

  **1. The Sea Slug (Habituation)**
  *   **Verdict:** **Darwinian.** (You are right; your friend is wrong.)
  *   **Why:** Under the Principle of the Site of Selection, Skinnerian learning requires *operant* conditioning: an action is varied, and the environment selects the winner via reward/punishment. Habituation is non-associative. The slug is not testing a hypothesis ("Is this stimulus dangerous?"); it is merely exhibiting a fixed physiological decay curve in response to repetition. The "selector" here is not the environment shaping a choice, but a hardwired physiological limit. The "filtering" was done by evolution to prevent energy waste. No hypothesis dies in the slug's stead; the response just fatigues.

  **2. The Chess Engine**
  *   **Verdict:** **Popperian.** (Your instinct was right; the Spider analogy is the red herring.)
  *   **Why:** You must distinguish between the **phylogeny of the system** (how it was built) and the **ontogeny of the move** (how it acts now).
      *   *The Spider:* At the moment of web-spinning, no selection process occurs. The selection happened millennia ago.
      *   *The Engine:* At the moment of the move, a selection process *does* occur. It generates candidate moves and "kills" the bad ones via its search tree evaluation. It lets its hypotheses (moves) die in its RAM so it doesn't lose the game on the board.
      *   The fact that its weights were tuned by a Darwinian process (self-play selection) is irrelevant to its current *mode of operation*. A human brain is Darwinian in origin (evolution) and Skinnerian in training (childhood), but when you pause to think through a logic puzzle, you are being Popperian. The Engine is the same. It is a Popperian creature built by Darwinian/Gregorian engineers.

  ---

  ### The Test Case: The Adaptive Immune System

  **Verdict:** **Darwinian.**

  **Reasoning:**
  This is the classic "trap" case for this taxonomy, and Dennett addresses it explicitly. The immune system fits the **Darwinian** category, even though it operates within a single lifetime.

  *   **Variation:** Somatic hypermutation generates variant B-cells (antibodies).
  *   **Selection:** Cells that bind to the invader survive and replicate; those that do not, die.
  *   **The Crucial Distinction:** The selection is **real**, not **virtual**.
      *   In a **Popperian** system (the chimp or the engine), the "death" of the hypothesis is simulated. The chimp does not actually fall; the engine does not actually lose the game during the search.
      *   In the **Immune System**, the "death" of the hypothesis (the B-cell) is literal. The cost is paid in biological tissue, not computational cycles.

  Therefore, the immune system is a **Darwinian process running on a somatic substrate**. It demonstrates that the Darwinian algorithm is substrate-neutral (it doesn't require DNA or generations), but it does not elevate the organism to Popperian status. The organism itself does not "know" what the immune system is doing; it is competence without comprehension, which is the hallmark of the Darwinian floor.

  ### Summary

  You do not need to sacrifice any of your original verdicts. You only need to sharpen the principle:

  **Do not ask "How did this ability arise?" Ask "How is the next action selected?"**

  *   If the action is selected by **ancestral survival**, it is **Darwinian**.
  *   If the action is selected by **real-world consequences**, it is **Skinnerian**.
  *   If the action is selected by **internal simulation**, it is **Popperian**.
  *   If the action is selected by **cultural tools**, it is **Gregorian**.

  Your friend's error with the slug was classifying *any* lifetime change as Skinnerian. Your hesitation with the engine was conflating *training history* with *operational logic*. Once you isolate the moment of action and ask where the filtering happens, the taxonomy snaps cleanly into place.
