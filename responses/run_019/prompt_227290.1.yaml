answer: |-
  You have identified a genuine and significant problem in historiography, and your intuition is correct: while the *mechanism* you describe is widely discussed, there is no single, canonical noun (comparable to "anachronism" or "Whiggism") that universally denotes this specific phenomenon of a pejorative, retrospective label outliving its polemic.

  However, you are working within a well-defined theoretical space. The phenomenon you describe sits at the intersection of **Conceptual History** (*Begriffsgeschichte*) and **Critical Periodization Studies**.

  Here is the breakdown of the existing terminology, the scholars who have mapped this territory, and, per your request, a proposal for a precise term to carve out this specific phenomenon.

  ### 1. The Existing Theoretical Framework

  While there is no single word, there are two established concepts that, when combined, describe exactly what you are seeing.

  **A. The Mechanism: Asymmetrical Counter-Concepts**
  The German historian and theorist **Reinhart Koselleck**, in *Futures Past* (1979), coined the term **"asymmetrical counter-concepts"** (*ungleiche Gegenbegriffe*).
  *   **Definition:** These are pairs of concepts where one side defines itself by negating the other, often claiming a monopoly on virtue or humanity (e.g., *Hellene/Barbarian*, *Christian/Heathen*, *Human/Civilized*).
  *   **Application to Periods:** Koselleck and his successors (like **Joachim-Felix Leonhard**) apply this to temporal categories. The "Modern" defines itself against the "Medieval"; the "Enlightenment" against the "Dark Ages." The later period constitutes its own identity by positing the earlier period as its negative foil.
  *   **Limit:** This term captures the *naming mechanism* (the foil), but it does not inherently capture the *persistence* of the label after the value judgment is abandoned.

  **B. The Persistence: Conceptual Sedimentation & Path Dependence**
  Koselleck also argues that historical concepts contain **"sediments of meaning"** (*Sedimente*). A concept accumulates layers of usage over time; even when the top layer (the pejorative judgment) is scraped away by revisionist historians, the underlying structure of the concept remains.
  *   **Sociological Parallel:** In historical sociology, this is often called **"path dependence."** Once a categorization is institutionalized (in university departments, library classifications, job markets), it creates a "lock-in" effect.
  *   **Critical Periodization:** The historian **Kathleen Davis**, in *Periodization and Sovereignty* (2008), argues exactly what you observe: that periodization is not a neutral discovery but a "technology of power." She demonstrates how the "Middle Ages" label persists not because it is accurate, but because it serves a political function in defining the "Modern."

  ### 2. Is There an Established Term?

  **No.** There is no single noun in English historiography that means "a period label coined as a pejorative foil by a successor period which persists after the pejorative meaning is rejected."

  Scholars typically describe this using phrases like:
  *   "Negative periodization" (descriptive, but not a fixed concept).
  *   "Retrospective stigmatization."
  *   "The myth of the [X]" (e.g., *The Myth of the Middle Ages*).
  *   "Historiographical inertia."

  If you use "Whig history," you will be corrected (correctly) that Whiggism is about *teleology* (progress toward the present), whereas your phenomenon is about *identity formation via negation*. They often overlap, but they are not identical.

  ### 3. Proposed Term: "Sedimented Polemic"

  Since you asked for a proposal if no term exists, I suggest adopting the term **"Sedimented Polemic"** (or **"Sedimented Counter-Periodization"**).

  **Definition:**
  A **Sedimented Polemic** is a historiographical period label that meets four criteria:
  1.  **Retrospective:** Coined by a later era to describe an earlier one.
  2.  **Constitutive:** The later era uses the label to define its own identity (the "foil" mechanism).
  3.  **Normative:** The label originally encodes a negative value judgment (darkness, stagnation, superstition).
  4.  **Inertial:** The label persists in scholarly usage *after* the normative judgment has been empirically refuted, continuing to structure research questions.

  ### 4. The Carving: Boundary Cases

  You asked specifically where this phenomenon ends and ordinary period-naming begins. Here is the boundary analysis using the definition above.

  | Case | Label | Origin | Value Judgment | Judgment Rejected? | Label Retained? | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Core Phenomenon** | *Dark Ages / Middle Ages* | Renaissance Humanists / 15th C. | Negative (Interruption/Decay) | Yes (by modern medievalists) | Yes | **Sedimented Polemic** |
  | **2. The Core Phenomenon** | *Scientific Revolution* | 18th/19th C. Philosophers | Positive (for Science), Negative (for Predecessors) | Yes (by Shapin, etc.) | Yes | **Sedimented Polemic** |
  | **3. Neutral Retrospection** | *19th Century* | Contemporaries / Later | Neutral (Chronological) | N/A | Yes | **Ordinary Periodization** |
  | **4. Self-Designation** | *Enlightenment* | 18th C. Thinkers | Positive (Self-aggrandizing) | Partially | Yes | **Not a Sedimented Polemic** (It is a *self*-label, not a foil imposed by a successor). |
  | **5. Corrective Labeling** | *Late Antiquity* | 20th C. (Brown et al.) | Positive/Neutral (Escape from "Darkness") | N/A | Yes | **Anti-Polemic** (Specifically coined to *break* the Sedimented Polemic). |
  | **6. Abandoned Polemic** | *Age of Faith* | 19th C. Secularists | Negative (Implies irrationality) | Yes | **No** (Now rarely used) | **Failed Polemic** (Did not achieve inertia). |

  **Key Boundary Distinctions:**

  *   **Successor vs. Distant Later:** Does the label have to come from the *immediate* successor (e.g., Humanists naming the Middle Ages)?
      *   *Analysis:* No. The "Scientific Revolution" was packaged in the 18th and 19th centuries, not immediately by the 17th century's end. The crucial factor is not temporal proximity, but **identity dependence**. The label must be necessary for the *later* period's self-definition.
  *   **The "Late Antiquity" Problem:** You asked about labels coined to escape older foils.
      *   *Analysis:* "Late Antiquity" is explicitly **not** a Sedimented Polemic. It is a **Corrective Periodization**. It is an attempt to dissolve the binary (Rome vs. Middle Ages) that the Sedimented Polemic created. However, beware: if "Late Antiquity" eventually becomes a foil for "The Medieval" (e.g., "Late Antiquity was cosmopolitan, the Medieval was insular"), it risks becoming a new Sedimented Polemic.
  *   **The "Renaissance" Exception:**
      *   *Analysis:* "Renaissance" began as a metaphor (rebirth), became a period label, and is now contested. Is it a Sedimented Polemic? Yes, because "Rebirth" implies "Death" preceded it. It relies on the "Middle Ages" foil. If scholars keep the term "Renaissance" but deny the "rebirth" narrative (e.g., calling it "Early Modern"), they are attempting to shed the Sedimented Polemic.

  ### 5. How Scholars Handle the Persistence

  You asked how users have handled the persistence of the label after the value judgment is abandoned. There are three main strategies in current scholarship:

  1.  **Reclamation (The "Empty Signifier" Strategy):**
      *   Scholars admit the label is polemical but argue it has become a useful "empty signifier." We keep "Middle Ages" not because it means "middle," but because it is a stable coordinate for communication.
      *   *Risk:* It subtly reinforces the period's boundaries, making it hard to study continuities across the "divide."

  2.  **Abandonment (The "Early Modern" Strategy):**
      *   Scholars drop the polemical label entirely. Medievalists often prefer "Late Antique" or "Early Medieval." Historians of science prefer "Early Modern Science" over "Scientific Revolution."
      *   *Risk:* It fragments the field and makes public communication difficult.

  3.  **Exposure (The Critical Strategy):**
      *   Scholars like **Kathleen Davis** and **Jacques Le Goff** (*The Birth of Europe*) keep the label but constantly prefix it with "so-called" or explicitly theorize its construction in their introductions. They make the *history of the label* part of the *history of the period*.
      *   *Verdict:* This is currently the most rigorous approach in doctoral work. It treats the "Sedimented Polemic" not as an error to be fixed, but as a primary source to be analyzed.

  ### Summary for Your Work

  If you need to cite this in your dissertation:
  1.  Acknowledge there is no single noun.
  2.  Cite **Reinhart Koselleck** on **"asymmetrical counter-concepts"** for the *mechanism* of the foil.
  3.  Cite **Kathleen Davis** (*Periodization and Sovereignty*) for the *politics* of the label's persistence.
  4.  If you need a shorthand, propose **"Sedimented Polemic"** with the definition provided above. It is precise, theoretically grounded in Koselleck's "sedimentation," and clearly distinguishes the phenomenon from ordinary periodization or Whig history.

  This framing will demonstrate to your committee that you are not just noticing a pattern, but that you are fluent in the historiographical theory surrounding the construction of time itself.
