answer: |-
  ### The Principle of Differential Epistemic Burden

  Your verdicts are governed by a coherent epistemic rule that I call the **Principle of Differential Epistemic Burden**. This principle holds that the quantity and quality of evidence required to establish a claim are not fixed, but scale exponentially according to the claim's **nomological status**—that is, its relationship to established laws of nature. Your intuition correctly distinguishes between events that are *statistically rare* (anomalies), *historically distant* (ordinary past events), and *nomologically impossible* (miracles).

  The tension you feel between Case 5 (Roman General) and Cases 2/3 (Miracles) dissolves under this principle. Case 5 describes an event that, while historically distant and supported by partisan texts, violates no laws of nature. Armies march across rivers routinely; the prior probability is high. Therefore, even weak testimony suffices. Cases 2 and 3 describe events that violate uniform experience (statues do not bleed; blindness is not instantly reversed by will). The prior probability is effectively zero. Therefore, no amount of human testimony—honest friends or devoted villagers—suffices, because the probability of human error or deception is always higher than the probability of a law violation.

  The tension between Case 1 (Tumor) and Case 2 (Statue) rests on the distinction between **medical ignorance** and **physical impossibility**. In Case 1, you accept that a biological mechanism exists that you do not yet understand (spontaneous remission is a known, if rare, category). In Case 2, the claim implies a physical violation (inanimate matter producing blood). You treat "unexplained" in medicine as a gap in knowledge, but "unexplained" in physics as a gap in reality.

  #### Predictions for New Cases
  1.  **Synchronized Smartphone Video (100 Strangers):** Even with high-quality video from many sources, if the content depicts a violation of natural law (e.g., levitation), the principle dictates rejection. Video is encoded testimony, subject to fabrication, deepfakes, or coordinated hoax. Unless the video data itself can be physically verified to preclude manipulation (which is rarely possible for the public), the nomological burden remains unmet. **Verdict: Reject as hoax/artifact.**
  2.  **Sensor Network (Non-Human Witnesses):** If a sensor network reports data contradicting a well-confirmed theory (like Case 4), the principle dictates the same verdict as Case 4. Sensors are instruments subject to calibration error, environmental interference, or software bugs. The uniformity of physical law outweighs the output of any finite network of devices. **Verdict: Reject as instrument error.**

  #### Required Revision
  You must revise **Case 1**. Your verdict ("accept that an unexplained remission occurred") is inconsistent with the rigor you apply in Case 4. In Case 4, you assume instrument error *before* a fault is located because the data contradicts physics. In Case 1, if a tumor "disappeared overnight" with "no trace," this likely violates conservation of mass/energy as much as the faster-than-light particles. To accept it as a fact rather than a measurement anomaly is an ad hoc exemption for biology. To remain consistent with Case 4, you should accept the *report* of the disappearance but withhold ontological commitment until the mass is accounted for.

  #### Relation to Hume
  This principle **vindicates** Hume's maxim on miracles but **modifies** its application to modern science. It affirms Hume's core argument that testimony cannot establish a violation of uniform experience, but it refines the definition of "miracle" to distinguish between statistical anomalies within natural law (which testimony can establish) and true nomological violations (which it cannot).

