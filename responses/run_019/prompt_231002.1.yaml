      *Refining the Nietzsche point:* Nietzsche's materialism is often overlooked. He believed great thoughts require a healthy nervous system. So the user is right there. But Nietzsche also despised dogmatism. If the diet becomes dogmatic, it fails the Nietzschean test.

      *Refining the Girlfriend point:* She says he was losing his grip. That's historically debatable but psychologically relevant. The *intensity* matters more than the historical fact.

      *Refining the "Self-Righteousness":* This is the key. If you feel superior, you've lost the plot.

