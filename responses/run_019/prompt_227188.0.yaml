answer: |-
  This is an exceptionally sharp reading of the texts. You have correctly identified that the "good vs. bad" slogan obscures a deeper structural agreement on the necessity of cultivation. However, your suspicion that the dispute is *purely* definitional risks underestimating the metaphysical and soteriological stakes involved. The disagreement is not just about how to slice the pie of human psychology, but about the relationship between Humanity (*Ren*) and Heaven (*Tian*).

  Here is an analysis of your four questions, followed by a critique of your framing as requested.

  ### 1. Empirical Disagreement or Definitional Partitioning?

  It is primarily a **teleological vs. causal definitional dispute**, not a modern empirical one. Asking for "evidence about human psychology" is slightly anachronistic because neither philosopher is doing descriptive psychology in the modern sense; they are doing normative cosmology.

  *   **Mencius's Definition:** *Xing* (nature) is teleological. It refers to the *direction* in which a thing grows when unimpeded. Just as the nature of water is to flow downward, the nature of a human is to grow toward goodness. The fact that you can splash water over a mountain doesn't mean water's nature is to go up; similarly, the fact that humans do evil doesn't mean their *xing* is evil.
  *   **Xunzi's Definition:** *Xing* is causal/material. It refers to the raw data present at birth before any conscious activity. Since spontaneous impulses (hunger, lust, envy) lead to conflict without intervention, *xing* is "bad." *Wei* (conscious artifice) is the only source of goodness.

  **Is there a discriminating observation?**
  Not in the modern scientific sense. You cannot settle this with fMRI scans because they disagree on what the scan *means*.
  *   If you found a universal neural correlate for compassion, Mencius says: "See, that is *xing*." Xunzi says: "That is a biological reflex, not morality. Morality is the ritual regulation of that reflex."
  *   If you found no such correlate, Mencius says: "The sprouts are subtle and easily starved." Xunzi says: "See, morality is constructed."

  **The Real Disagreement:** The dispute is about **moral ontology**. Mencius believes the cosmos (*Tian*) is morally generative and implants that generativity in us. Xunzi believes *Tian* is amoral (a blind force of nature) and humans must *create* morality to survive. The "evidence" they appeal to is not data, but the authority of the Sages and the coherence of their cosmological systems.

  ### 2. The Child at the Well: Does it Do the Work?

  You are right to be skeptical. Xunzi has absorptive moves, but Mencius has a specific counter-move regarding the *source* of the reaction.

  *   **Xunzi's Critique:** Xunzi distinguishes between *xing* (nature) and *qing* (emotions/reactions). He might grant the "alarm and distress" (*ce yin zhi xin*) but categorize it as *qing*. For Xunzi, an unmediated reflex is not virtue; it is raw material. Virtue requires knowing *what to do* with that distress. If I feel distress but save the child only to get a reward, I am not good. If I feel distress but let the child die because I am cowardly, I am not good. The reflex proves nothing about *moral capacity*, only emotional reactivity.
  *   **Mencius's Defense:** Mencius does not claim the reflex *is* virtue. He claims it is the *duan* (sprout/thread-end) of virtue. His point is about **directionality**. The reaction is *disinterested* (not for praise, not for noise). It reveals that the heart-mind (*xin*) is not morally neutral; it has a default orientation toward the good.
  *   **Textual Defensibility:** Mencius's reading is more textually robust *within his own system* because he ties the reflex to the specific moral virtue of *Ren* (benevolence). Xunzi's "conditioning" argument is weaker here because Mencius specifies the reaction happens *before* there is time for calculation or conditioning to kick in ("sudden" alarm).
  *   **The Crux:** Mencius wins on the **origin** of the impulse; Xunzi wins on the **sufficiency** of the impulse. Mencius shows the seed is there; Xunzi argues a seed is not a harvest, and without the farmer (Sage/Ritual), the seed dies.

  ### 3. Models of Moral Failure: Stunting vs. Straightening

  This is where your claim of "convergence on practice" is most vulnerable. While both prescribe study and ritual, the **phenomenology of cultivation** differs radically.

  *   **Mencius (Ox Mountain):**
      *   **Model:** Recovery/Restoration.
      *   **Education:** Therapeutic. The teacher helps you remove obstacles (desire, bad environment) so your internal signal can grow.
      *   **Feeling:** Cultivation should eventually feel "right" and joyful (*le*). If you are forcing it too hard, you are "pulling the sprout" (a famous Mencian warning against excessive effort).
      *   **The Outsider:** A person raised outside ritual still has the sprouts. They are morally *disabled* but not morally *alien*. They can be reached by appealing to their own heart.
  *   **Xunzi (Warped Wood):**
      *   **Model:** Construction/Remaking.
      *   **Education:** Disciplinary. The teacher imposes form from the outside. You must "accumulate" (*ji*) goodness until it becomes second nature.
      *   **Feeling:** Cultivation is arduous. It involves suppressing immediate desires. The "joy" comes only after mastery, not during the process.
      *   **The Outsider:** A person raised outside ritual is a beast. Their impulses are not guides; they are enemies. You cannot appeal to their internal signal because there is no moral signal, only biological noise. You must coerce or train them into the ritual form.

  **Cash Out:** In a classroom, a Mencian teacher asks, "How does this make you feel?" to gauge moral alignment. A Xunzian teacher asks, "Did you perform the ritual correctly?" to gauge behavioral alignment.

  ### 4. Sanity Check: Internal Signal vs. External Standard

  This gloss is **fair as a heuristic but metaphysically incomplete.**

  *   **Mencius:** "Internal signal" is correct, but it implies subjectivity. For Mencius, the internal signal is objective because it is a fragment of *Tian*. It is not "my truth"; it is "Heaven's truth inside me."
  *   **Xunzi:** "External standard" is correct, but it implies arbitrariness. For Xunzi, the external standard (Ritual/*Li*) is not random; it is the accumulated wisdom of the Sage Kings who figured out how to order society efficiently. It is objective, just not innate.

  **Better Mapping:**
  *   **Mencius:** Moral Realism via **Intuitionism**. (Value is discovered within).
  *   **Xunzi:** Moral Realism via **Constructivism**. (Value is built without).

  ### Critique of Your Framing

  You asked me to be plain if your premises are confused. Here are three points where your framing needs adjustment:

  **1. The "Convergence on Practice" is Overstated.**
  You write: *"both think ordinary people can become good, both think this requires sustained effort and the right environment."*
  While true that both believe sagehood is *possible* (unlike some later Confucians who thought only elites could achieve it), the **mechanism** is so different that it changes the practice.
  *   For Mencius, effort is primarily *negative* (removing obstacles, preserving the night air).
  *   For Xunzi, effort is *positive* (accumulating knowledge, forcing compliance).
  *   **Why this matters:** If you tell a Mencian student to "force yourself to follow ritual," you might crush their sprouts. If you tell a Xunzian student to "follow your heart," you invite chaos. The convergence is on the *goal* (Sagehood), not the *method*.

  **2. The "Empirical vs. Definitional" Question is Malformed for Warring States Texts.**
  You ask: *"Is there a genuine disagreement here that could in principle be settled by evidence?"*
  This imports a modern positivist framework. For Mencius and Xunzi, "facts" about human behavior are theory-laden.
  *   When Mencius sees a man save a child, he sees *Nature*.
  *   When Xunzi sees a man save a child, he sees *Artifice* (perhaps the man was trained, or perhaps the reflex is irrelevant to the moral worth of the act).
  *   They would look at the same world and see different things because their **categories of perception** differ. The dispute is not resolvable by evidence because they disagree on what counts as evidence of *morality*.

  **3. You Underestimate the Cosmological Stake.**
  You frame this as a dispute about human psychology. It is actually a dispute about **Heaven (*Tian*)**.
  *   **Mencius:** If human nature is good, Heaven is good. The cosmos is on the side of morality. This provides metaphysical comfort and confidence.
  *   **Xunzi:** If human nature is bad, Heaven is indifferent. Humans are alone in the universe and must save themselves through culture. This provides a grim, heroic humanism.
  *   **Why this matters:** This isn't just labeling. It dictates how one faces death, fate, and political failure. Mencius can trust the process; Xunzi must control the process.

  ### Summary
  You are correct that the "good vs. bad" label is largely a fight over the definition of *xing* (teleological potential vs. raw material). However, this is not a mere semantic quibble. It drives a wedge between two distinct moral psychologies: one of **trust and recovery** (Mencius) and one of **distrust and construction** (Xunzi). The "convergence" you see is at the level of political outcome (both want a Confucian order), but the internal experience of getting there is fundamentally incompatible.
