answer: |-
  The prosecution of East German border guards following reunification presents a paradigmatic case study for the debate between legal positivism and natural law theory. To answer your question directly: **Convicting the guards does not strictly presuppose a natural-law thesis.** While the courts' rhetoric relied heavily on natural-law reasoning (specifically the "Radbruch Formula"), the *practice* of conviction is fully compatible with a sophisticated legal positivist framework.

  Here is an analysis of what the practice presupposes, how a positivist accounts for it, and how the reasoning can be described neutrally.

  ### 1. Does the Practice Strictly Presuppose Natural Law?

  **No.** The practice does not logically necessitate the truth of natural law theory.

  Natural law theory (in this context) posits a necessary connection between law and morality: if a rule is sufficiently unjust, it lacks the status of law (*lex iniusta non est lex*). The German courts' statement that a directive violating fundamental justice "never had the status of law" sounds explicitly like this thesis.

  However, for the conviction to be legally valid, the court does not *need* to establish that the GDR directive was "not law" due to its immorality. It only needs to establish that the guards committed a crime under *some* valid legal norm applicable at the time. If a positivist can identify a source-based rule valid in the GDR at the time of the shooting that criminalized the act (overriding the border directive), the conviction stands without denying the "legalness" of the border directive based on moral merit. Therefore, the outcome is consistent with the Separation Thesis (that the existence of law is one thing, its merit another).

  ### 2. The Positivist Reconstruction

  If a legal positivist accepts the result, they must reconstruct the legal landscape of the GDR without relying on the claim that "immorality invalidates law." Here is what the positivist must say about the directive and the basis of prosecution:

  **About the Earlier Directive:**
  The positivist must concede that the border directive *was* a valid law of the GDR according to the GDR's own rule of recognition at the time. It was enacted by the proper authority and followed the correct procedures. The positivist cannot say it was "no law." Instead, the positivist must argue that it was **legally overridden** by other positive laws also in force in the GDR.

  **About the Basis of Prosecution:**
  The positivist bases the prosecution on a conflict of norms within the GDR's own positive legal system, resolved by hierarchical rules. Specifically:
  1.  **The GDR Constitution:** The GDR Constitution formally guaranteed the inviolability of human dignity and the right to life.
  2.  **International Treaties:** The GDR had ratified international human rights covenants (e.g., the International Covenant on Civil and Political Rights) which, under GDR law, held superior status to ordinary statutes.
  3.  **The Argument:** The border guard directive was a lower-order statute that conflicted with higher-order positive law (Constitution and Treaties). Under standard legal principles (*lex superior derogat legi inferiori*), the higher law trumps the lower law. Therefore, the guards were not following "the law"; they were violating the supreme law of their own state.

  By framing it this way, the positivist avoids the claim that the directive was invalid *because* it was unjust. It was invalid (or inapplicable) because it was **ultra vires** or unconstitutional according to source-based criteria. The "injustice" is evidence of the conflict with the Constitution, but the *validity* of the Constitution rests on its social source, not its moral content.

  ### 3. Strict Presupposition vs. Mere Fit

  It is crucial to distinguish between what the practice *requires* and what it *suggests*.

  *   **What it Strictly Presupposes:** The practice strictly presupposes only that there was a **normative basis for criminal liability** that survived the transition of regimes. It presupposes that the principle of *nullum crimen sine lege* (no crime without law) was satisfied. It does *not* presuppose that moral validity is a condition of legal validity.
  *   **What it Merely Fits Well With:** The practice fits very well with **Natural Law theory** (specifically Gustav Radbruch's post-WWII jurisprudence). The courts' explicit reasoning—that extreme injustice deprives a statute of legal character—is a direct application of the Radbruch Formula. This rhetoric makes the natural law explanation the most *intuitive* and *textually supported* reading of the judgments. It fits the *language* of the courts perfectly, even if it is not logically required by the *outcome*.

  ### 4. A Neutral Description (Leaving the Dispute Unresolved)

  There is a way to describe the courts' reasoning that allows both a positivist and a natural lawyer to accept the description without settling their metaphysical dispute. This description focuses on **interpretive continuity** rather than **moral invalidation**.

  **The Neutral Description:**
  > "In the reunified Federal Republic, courts were tasked with determining the content of the law that was in force in the GDR at the time of the acts. In doing so, they applied standard jurisprudential methods of interpretation, which presume that a legal system is a coherent hierarchy of norms. The courts interpreted the GDR's statutory border directives in light of the GDR's Constitutional commitments and international obligations. They concluded that a correct interpretation of the GDR's own legal order at the time did not authorize lethal force in these instances, as such force contradicted higher-ranking norms within that same order. Consequently, the defendants acted without legal justification under the law applicable at the time."

  **Why this leaves the dispute unresolved:**
  *   **The Natural Lawyer** reads this and thinks: "The courts correctly identified that the moral defects were so severe they erased the legal character of the order."
  *   **The Positivist** reads this and thinks: "The courts correctly identified that the source-based hierarchy of GDR law placed the Constitution above the Border Statute."

  Both agree on the **result** (conviction) and the **method** (interpreting the GDR system as a whole). They disagree only on *why* the Constitution trumps the Statute in this specific instance: the positivist says "because the Rule of Recognition says Constitutions trump Statutes," while the natural lawyer says "because the Constitution reflects moral truths that the Statute violated." By focusing on the **internal coherence of the GDR legal system** rather than the **external moral judgment of the FRG courts**, the description remains neutral regarding the ultimate nature of law.

  ### Summary

  The conviction of the border guards does not strictly presuppose natural law. While the courts' *rhetoric* embraced the natural-law Radbruch Formula, a positivist can justify the convictions by arguing that the guards violated higher-ranking *positive* laws (the GDR Constitution and International Treaties) that were in force at the time. The practice strictly presupposes only that a valid legal prohibition existed; it merely *fits well* with the natural law thesis that unjust laws are not laws. A neutral description focuses on the judicial interpretation of the GDR's internal normative hierarchy, allowing both theories to claim the result as consistent with their view of the law-morality relationship.
