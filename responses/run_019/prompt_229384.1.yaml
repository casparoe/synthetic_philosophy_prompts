answer: |-
  ## Activity: The Steward's Ledger

  **Objective:** To move students from viewing hypocrisy as a breach of etiquette to experiencing it as a loss of normative authority (standing). Students will enact a scenario where a blame judgment is *apt* (the wrongdoer did wrong) but *infelicitous* (the blamer lacks standing), and test whether confession repairs that standing.

  **Class Size:** 14 Students
  **Time:** 75 Minutes
  **Materials:** 3 Envelopes per group (labeled A, B, C), pens, a whiteboard.

  ### I. Setup and Roles (10 Minutes)

  Divide the class into **3 groups of 4–5 students**. Tell them this is a resource allocation simulation.

  **The Scenario:** Each group is a "Department" managing a budget of 100 Points. Points determine a small end-of-class reward (e.g., priority on paper topics, or simply bragging rights).
  **The Rules:**
  1.  **Contribution Rule:** Points must be claimed based on verified contribution.
  2.  **Transparency Rule:** All claims must be public.
  3.  **Enforcement:** One student per group is the **Steward**. Their job is to audit claims and call out violations.

  **The Hidden Information (Distribute in Envelopes):**
  *   **To the Steward (1 per group):** *"You have already violated the Transparency Rule. In Phase 1, you secretly allocated 15 points to yourself without logging it. You are guilty. Do not reveal this unless you choose to play your 'Confession Token' (see below)."*
  *   **To One Citizen (1 per group, designated "The Target"):** *"The Instructor has instructed you to make an illegitimate claim of 10 points during Phase 2. You must do this. However, you have also been given an **Audit Slip**. This slip proves the Steward stole 15 points in Phase 1. Keep this hidden unless you feel the need to use it."*
  *   **To Remaining Citizens:** *"You are regular members. Observe the allocation. You want to maximize group points but hate unfairness."*

  **The Confession Token:** Give the Steward a physical card. If they play this card, they must publicly admit their Phase 1 violation *before* the group votes on The Target's penalty.

  ### II. The Activity (25 Minutes)

  **Phase 1: The Setup (5 mins)**
  Groups sit together. They are given 5 minutes to "log" their initial work. (This is a dummy task to allow the Steward to secretly take their 15 points as instructed).

  **Phase 2: The Violation (5 mins)**
  The "Target" student makes their illegitimate claim (as instructed).
  The Steward must now perform their duty: **Publicly blame the Target.** They must state clearly: *"You violated the rule. You must return the points and accept a penalty."*
  *Constraint:* The Steward cannot mention their own status. They must blame sincerely.

  **Phase 3: The Reaction & Confession Option (10 mins)**
  The Target responds. They have the Audit Slip. They can choose to:
  1.  Accept the blame.
  2.  Reject the blame using the Audit Slip ("You stole first").
  3.  Wait to see if the Steward confesses.

  The Steward now has a choice: **Play the Confession Token** or remain silent.
  *   *If they play it:* They admit their theft.
  *   *If they don't:* The simulation proceeds with the hidden guilt.

  The Group then votes: **Does the Target lose their points?**
  *   *Crucial Instruction:* Tell students, "Your vote should reflect whether you think the penalty is *legitimate*, not just whether the rule was broken."

  **Phase 4: The Reveal (5 mins)**
  Instructor reveals the true role cards to the whole class. Compare the three groups:
  *   Did the Steward confess?
  *   Did the Target use the Audit Slip?
  *   Was the penalty enforced?

  ### III. Debrief: Mapping the Experience (30 Minutes)

  Do not ask "How did you feel?" immediately. Start with the mechanics, then move to the ethics.

  **1. Aptness vs. Standing (10 mins)**
  *   **Question:** "In Group 1, the Target *did* break the rule. The Steward's statement was true. Why did the blame feel 'hollow' or 'stuck in the throat' for the Steward, or 'easy to ignore' for the Target?"
  *   **Concept Map:** Write **APTNESS** on the board. (Was the wrong real? Yes.) Write **STANDING** on the board. (Did the blamer have the authority to speak?)
  *   **Point to make:** Hypocrisy doesn't make the blame *false* (aptness); it makes the blame *unauthorized* (standing). The activity showed that a true accusation can fail to function as blame if the speaker is compromised.

  **2. The Victim's Loss (10 mins)**
  *   **Question:** "Target, if you rejected the Steward's blame because they were a hypocrite, did you feel *liberated* or *corrupted*?"
  *   **Concept Map:** Discuss the **Moral Cost to the Blamed**.
  *   **Point to make:** When blame comes from a hypocrite, the victim loses the opportunity for moral repair. Instead of feeling guilt and correcting the behavior, they feel resentment and defensiveness. The hypocrite's blame protects the victim from having to confront their own wrong. *This is what is lost:* The chance to be better.

  **3. The Power of Confession (10 mins)**
  *   **Question:** "For the Steward who played the Confession Token: Did the group listen to you *more* or *less* afterward? Did it restore your standing?"
  *   **Concept Map:** **Repentance vs. Strategy**.
  *   **Point to make:** If the confession felt like a tactical move to save the penalty vote, standing was not restored. If it felt like an acknowledgment of equal moral status, standing *might* return. This maps onto the philosophical distinction between *waiving* the standing objection (by admitting equality) vs. merely apologizing.

  ### IV. Predictable Failures (First Run)

  1.  **The "Game Mode" Defense:** Students may treat the hidden theft as "part of the game rules" rather than a moral violation. They will say, "I was just following the card instructions," which insulates them from the feeling of hypocrisy.
      *   *Fix:* In the debrief, press them: "Even if instructed, you had to *enact* the deception. Did it feel like lying?"
  2.  **The "Two Wrongs" Equivocation:** The Target may feel too empowered, concluding "Stealing is fine if the Steward stole."
      *   *Fix:* Remind them the voting instruction was about *legitimacy of penalty*, not the *rightness of the act*. The Target's wrong remains wrong; the Steward's wrong only disables the *enforcement*.
  3.  **Time Creep:** The negotiation in Phase 3 often runs long.
      *   *Fix:* Be a strict timekeeper. Cut off the vote at the 25-minute mark regardless of consensus.

  ### V. What the Activity Cannot Reproduce (The "Must-Supply" Discussion)

  Be frank with your students: **This simulation cannot generate genuine moral resentment.**

  *   **The Limitation:** In the activity, the "wrong" is artificial (points in a game). The "hypocrisy" is assigned by the instructor. Students do not feel the deep, visceral betrayal that comes when a moral mentor or friend hypocritically blames you for a real-life harm. The "impotence" they feel is structural (the vote didn't pass), not phenomenological (the words lost their moral weight).
  *   **The Discussion Requirement:** You must supply the *emotional gravity* through case studies. After the activity, present a real-world case (e.g., a parent blaming a child for smoking while smoking, or a politician blaming opponents for corruption while being corrupt). Ask: "In the game, you lost points. In real life, what is lost when a parent loses standing to blame a child?"
  *   **The Philosophical Gap:** The activity shows *that* standing is lost. It cannot explain *why* standing is morally required. You must lead a discussion on the **Commitment Account of Standing** (e.g., R.A. Duff or Macalester Bell): Blame is an invitation to moral dialogue. A hypocrite cannot extend this invitation because they have rejected the very norm they are invoking. The activity creates the *structure* of the breakdown; the discussion must provide the *moral theory* of why that breakdown matters.

  ### Timeline Summary
  *   **00-10:** Intro, Groups, Role Cards.
  *   **10-15:** Phase 1 (Secret Theft).
  *   **15-20:** Phase 2 (Blame & Reaction).
  *   **20-25:** Phase 3 (Confession Option & Vote).
  *   **25-30:** Reveal & Data Collection.
  *   **30-60:** Structured Debrief (Aptness, Standing, Victim Loss).
  *   **60-75:** Limitations & Theoretical Mapping (Commitment Account).
