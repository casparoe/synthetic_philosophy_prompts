      *   **Topic:** Standing to Blame (specifically, the "tu quoque" or hypocrisy problem).
      *   **Problem:** Students treat it as mere etiquette ("don't be a hypocrite") rather than a normative loss of authority/standing. They think the *content* of the blame remains valid even if the *blamer* is compromised.
      *   **Goal:** Design a structured activity where students *experience* blame becoming impotent due to lack of standing.
      *   **Key Mechanics:** Roles, hidden information, rules, timeline.
      *   **Specific Feature:** Allow a participant to "come clean" mid-activity to test if confession restores standing.
      *   **Debrief:** Map activity moments to philosophical concepts (aptness vs. standing, victim's loss).
      *   **Meta-Analysis:** Predict what will go wrong and identify what the activity *cannot* simulate (requiring discussion).

  2.  **Deconstruct the Philosophical Concept:**
      *   *Standing to Blame:* The right or authority to hold someone accountable.
      *   *Hypocrisy:* Blaming someone for $X$ while being guilty of $X$ (without adequate repentance).
      *   *The Intuition:* Hypocritical blame feels "hollow," "gaslighty," or "unfair," not just rude. It shifts the focus from the wrongdoer to the blamer.
      *   *The Victim's Perspective:* Being blamed by a hypocrite feels different than being blamed by a clean-handed authority. It feels like manipulation.

  3.  **Brainstorming the Activity:**
      *   *Constraint:* 75 minutes is tight. 14 students is a good size for small groups.
      *   *Need:* A scenario where rules are broken, blame is issued, and then the blamer's own violation is revealed.
      *   *Idea 1: The Prisoner's Dilemma.* Too abstract. Doesn't capture moral blame well.
      *   *Idea 2: Resource Allocation.* Someone steals points. Others blame. Then reveal the blamer stole too.
      *   *Idea 3: The "Secret Rule" Game.* A game where students enforce rules on each other, but some are secretly exempt or violating them.
      *   *Selected Concept:* "The Trust Pool." A collaborative task where integrity is the currency.
      *   *Refinement:* Let's make it about a shared resource or a collaborative grade/point system. If I blame you for taking too much, but I took too much, my blame should feel illegitimate.
      *   *Better Refinement:* "The Compliance Audit." Students act as auditors. They check each other's work. But some auditors are falsifying their own work.
