answer: |-
  Here is the disambiguation of "What if everybody did that?" (WIEDT) into four distinct ethical principles. This menu allows you to isolate exactly what your flatmate is claiming and test whether that specific claim holds water.

  ### The Menu of Principles

  #### 1. The Empirical Cascade (Consequentialist)
  *   **The Principle:** An act is wrong if, were it *actually* performed by everyone in similar circumstances, the aggregate consequences would be catastrophic.
  *   **Precision:** This is a factual claim about the world. It requires evidence that a threshold exists where the practice collapses (e.g., the company goes bankrupt, trust evaporates).
  *   **Plausibility:** Moderate. It correctly identifies that some practices (like promising, or paid leave) rely on statistical regularity to function.
  *   **Verdict on Your Sick Day:** **Inconclusive.** It condemns you *only if* your action contributes to a trend that will actually reach the catastrophic threshold. If you are the only one, or if burnout days are rare, the cascade never triggers.

  #### 2. The Fairness Principle (Free-Riding)
  *   **The Principle:** An act is wrong if you benefit from a cooperative practice (like employer trust) that is sustained by the restraint of others, while you exempt yourself from that restraint.
  *   **Precision:** This is not about consequences, but about equity. It asks: "Are you taking advantage of the fact that your colleagues *don't* do what you're doing?"
  *   **Plausibility:** High. This is the strongest ethical intuition behind WIEDT. It captures the sense of "cheating" even when no one gets hurt.
  *   **Verdict on Your Sick Day:** **Condemns You.** Even if no one else fakes sick days, you are benefiting from a system of trust that relies on general restraint. You are making an exception for yourself.

  #### 3. The Kantian Test (Universalizability)
  *   **The Principle:** An act is wrong if you cannot coherently *will* your reason for acting (your maxim) to become a universal law of nature without contradicting the very purpose of the act.
  *   **Precision:** This is a logical test, not a prediction. It asks: "If everyone *necessarily* acted on this rule, would the concept become meaningless?" (e.g., If everyone lied when convenient, "truth" would cease to exist, making the lie impossible).
  *   **Plausibility:** Low to Moderate. It is philosophically robust but often misapplied to empirical situations.
  *   **Verdict on Your Sick Day:** **Depends.** If your maxim is "I will claim illness when I need rest," universalizing this might destroy the concept of "sick leave" (collapsing it into "paid time off"). If the company distinguishes between the two, you are arguably undermining the definition of the benefit you are claiming.

  #### 4. The Rule-Absolutist (Deontological)
  *   **The Principle:** An act is wrong if it violates a stated rule or duty, regardless of consequences, fairness, or universalizability.
  *   **Precision:** "The rule says X. You did not-X. Therefore, wrong." The WIEDT slogan is just rhetorical dressing for "Rules must be followed."
  *   **Plausibility:** Low. This is "rule worship." It ignores context and nuance.
  *   **Verdict on Your Sick Day:** **Condemns You.** You violated the policy (physical illness required). The reason doesn't matter.

  ---

  ### The "Nobody Else Does It" Test
  You asked which readings condemn you even if we stipulate that **almost nobody else will ever fake a sick day**, meaning the bad consequences never materialize.

  *   **The Empirical Cascade:** **Exonerates You.** If nobody else does it, the system doesn't collapse. The "what if" never happens. This reading fails to condemn you in your specific scenario.
  *   **The Fairness Principle:** **Condemns You.** It doesn't matter if others *will* do it; it matters that they *don't*. You are free-riding on their restraint.
  *   **The Kantian Test:** **Condemns You.** Kantianism isn't about what people *will* do, but what you can *will*. If you can't logically universalize the rule, the act is wrong even if you're the only one who ever attempts it.
  *   **The Rule-Absolutist:** **Condemns You.** The rule is the rule. Others' behavior is irrelevant.

  **Takeaway:** If your flatmate insists you are wrong even though you're the only one doing it, he is not actually making a Consequentialist argument (Reading 1). He is secretly arguing from Fairness (Reading 2) or Rule-Absolutism (Reading 4).

  ---

  ### Where the Readings Collapse
  Two of these readings often look different but secretly rely on each other to function in casual argument.

  **The Empirical Cascade collapses into The Fairness Principle.**
  When people argue "If everyone did that, the system would break," they are usually assuming that the system is currently held together by people *not* doing that. If you reply, "But not everyone *is* doing that," the Consequentialist argument loses its teeth. To recover, the arguer usually shifts to, "But you're relying on the fact that others *don't*." That is no longer a claim about consequences; it is a claim about fairness. Most people using WIEDT think they are making a prediction about the future (Cascade), but they are actually making a claim about current equity (Fairness).

  ---

  ### The Divergence Case (Opposite Verdicts)
  To prove these are genuinely different principles, consider this case: **Speeding on a deserted highway at 3:00 AM.**

  *   **Scenario:** You are the only car for miles. The speed limit is 60; you drive 80. There is zero risk of accident, zero wear on the road, and no one observes you.
  *   **The Empirical Cascade Verdict:** **Permissible.** If *everyone* sped on this specific stretch at this specific time, there might be risk, but since empirically no one else is there, the "everyone" condition is counterfactual. The actual consequences are neutral.
  *   **The Rule-Absolutist Verdict:** **Impermissible.** You broke the law. The context is irrelevant.
  *   **The Fairness Principle Verdict:** **Impermissible.** You benefit from a road system maintained by others' compliance, while exempting yourself from the restraint.

  *Result:* The Empirical Cascade says "Go," while Fairness and Rule-Absolutism say "Stop." This proves they are not the same argument.

  ---

  ### Diagnosis: What Your Flatmate Actually Means
  Given that he deployed the slogan to **end** the argument rather than to start one, he is almost certainly not using **Reading 1 (Empirical Cascade)**.

  If he were genuinely concerned about consequences, he would be open to your data point (i.e., "I am the only one doing this"). The fact that he repeated it "louder" suggests he treats the slogan as a **conversation-stopper**, not a hypothesis to be tested.

  **He is using Reading 4 (Rule-Absolutism) disguised as Reading 1 (Empirical Cascade).**
  He wants the moral authority of "preventing disaster" (Cascade) without having to prove a disaster will happen. He knows that "Because rules are rules" (Absolutism) sounds petty, so he dresses it up as "Because society would collapse" (Cascade).

  **Your Ammunition:**
  Call out the collapse. Tell him: *"If you think I'm wrong even when nobody else is doing it, then you don't actually care about the consequences of 'everybody doing it.' You care about fairness or rule-following. Say that. Don't hide behind a hypothetical disaster that isn't happening."*
