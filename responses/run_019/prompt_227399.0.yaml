prompt: |-
  So I had a long, kind of heated argument with my flatmate last night that ended with him deploying "what if everybody did that?" at me, and I want ammunition for round two.

  The setup: I called in sick to work when I was actualy fine, just completely burned out and needing a day. He says that's wrong, full stop, and his entire case is that slogan. When I said that one person taking one fake sick day harms nobody and the company won't notice, he just repeated it louder, like it settles everything.

  What I want: lay out the different precise principles the slogan could stand for, as a menu I can pick from. Some candidates I'm guessing at: (a) a straight consequences claim -- if everyone did it, things would go badly; (b) a fairness or free-riding claim -- I'm profiting from a practice (sick leave, employers trusting sick calls) that only works because most people don't abuse it; (c) something more Kant-flavored where universalizing my rule somehow destroys the very practice my lie depends on, so I couldn't even coherently will it as a universal policy; (d) maybe just rule-worship dressed up as an argument.

  For each reading: state it precisely enough that it actually has implications (I don't want vague vibes about "society"), say whether it's plausible on its own merits, and say whether it actually delivers his verdict on my sick day. The part I most care about: which readings still condemn me even if we stipulate that almost nobody else will ever fake a sick day, so the bad consequences he imagines never materialize? And which of the readings secretly collapse into each other once you look closely? Also, to check the readings are genuinely different, give me one case (not my sick day) where two of them deliver opposite verdicts.

  Last thing: tell me which reading he probably means, given that he used the slogan to end the argument rather than to start one. No bibliography or anything, just the disambiguation and the verdicts.
