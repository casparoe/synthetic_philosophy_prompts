          3.  The "Present" Problem (The core dispute).
          4.  Residue Report (Translation fidelity).
          5.  The Verdict (Who is right?).

      *   *Refining the Analogy:*
          *   Need to distinguish between the *Back Buffer* (potential experience) and the *Save Game/Log* (memory/report).
          *   Stalinesque: The frame rendered is *already* the illusion.
          *   Orwellian: The frame rendered is the truth, but the *save file* is corrupted.
          *   Dennett's critique: If you can't query the buffer without corrupting it, or if the "buffer" is distributed, the distinction collapses.

      *   *Addressing the Friend's Claim:*
          *   Friend says: "Privileged presentation moment doesn't exist."
          *   Graphics reality: `Present()` *is* a privileged moment in the API.
          *   Brain reality: There is no `Present()`. There are multiple "drafts" in parallel.
          *   So, the friend is right about the brain, but wrong if he thinks the analogy implies the engineering distinction is meaningless. The engineering distinction *is* meaningful, which is why the brain analogy breaks down.

  6.  **Final Polish:**
