      *   *Epistemic/Evidential:* Simplicity *is* evidence. A simpler theory is more likely to be true, ceteris paribus. (Needs justification).
      *   *Metaphysical/Ontological:* The world *is* simple. Nature abhors a vacuum (of complexity). (Historically popular, now dubious).
