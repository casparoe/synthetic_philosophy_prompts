prompt: |-
  I write firmware and compiler internals for a living, so I live in opcodes, symbol tables, serialization formats, error-correcting codes, and the rule that a bit pattern means nothing until a decoder interprets it. I keep running into the philosophy-of-biology argument over whether DNA is literally a code, and to me it sounds like a non-problem: codon-to-amino-acid is just a lookup table, tRNA is just the decoder, and if the mapping is arbitrary rather than physically necessary that makes it more code-like, not less. But aparently the other side says DNA is not a code in the way ASCII or machine code is, because nothing in the cell assigns semantics to the sequence, or because the decoder is itself specified by the sequence, or something like that.

  Restate that whole debate in my vocabulary as faithfully as you can: encoders and decoders, instruction sets, lookup tables, bootstrapping and self-hosting compilers, symbol resolution, lossless vs lossy mappings — whatever actually fits. Don't fall back on vague talk about 'information'. Then give me the residue report: which claims from each side map cleanly onto things I reason about every day, which ones you had to bend to fit, and which ones have no counterpart at all in my vocabulary. Is there a real point on the 'DNA is not literally a code' side that my vocabulary can't express? And if so, is that because software talk is missing a concept, or because their point only looks deep until you translate it? I want to know whether my it's-just-a-lookup-table intuition survives.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Firmware and compiler internals engineer. Lives in opcodes, symbol tables, serialization, ECC, decoding logic.
      *   **Core Question:** Is DNA *literally* a code (like machine code/ASCII), or is that a metaphor?
      *   **User's Stance:** It *is* a code. Codon->AA is a lookup table (LUT), tRNA is the decoder. Arbitrary mapping = code.
      *   **Opposing Stance:** DNA isn't code like ASCII because semantics aren't assigned externally, the decoder is encoded *within* the data, etc.
      *   **Task:** Restate the debate using the user's vocabulary (encoders, decoders, ISAs, bootstrapping, etc.). Then provide a "residue report" (what maps cleanly, what bends, what has no counterpart). Finally, evaluate if the "it's-just-a-lookup-table" intuition survives.
      *   **Constraint:** No vague talk about "information." Be technical and precise.

  2.  **Deconstruct the Debate into Technical Terms:**

      *   *The "DNA is Code" Side (User's view):*
          *   Sequence = Instruction Stream / Binary Blob.
          *   Codons = Opcodes.
          *   Genetic Code (Codon Table) = ISA Specification / Decode LUT.
          *   Ribosome/tRNA = CPU/Decoder Unit.
          *   Amino Acids = Micro-ops / Control Signals / Data Values.
          *   Arbitrariness = Proof of convention (like ASCII vs. EBCDIC).

      *   *The "DNA is Not Code" Side (Critics' view):*
          *   *Argument 1: No External Semantics.* In software, a human/compiler assigns meaning. In biology, chemistry *is* the meaning.
          *   *Argument 2: Self-Hosting/Bootstrapping.* The decoder (ribosome/proteins) is built by the code itself. In software, the CPU exists *before* the code runs.
          *   *Argument 3: Direct Chemical Affinity.* It's not just a lookup; it's stereochemical interaction (though this is weaker scientifically, it's part of the philosophical argument).
          *   *Argument 4: Context Dependence.* An opcode means the same thing everywhere in x86. A gene's effect depends on epigenetic state, folding, environment (non-deterministic execution).

  3.  **Drafting the Translation (Iterative Process):**

      *   *Attempt 1 (Mental):* DNA is the binary. Ribosome is the CPU. But the CPU is built by the binary. That's like a self-extracting archive that builds the hardware.
      *   *Refining for User:* Use "Von Neumann architecture" vs. "Harvard architecture" or "Self-modifying code." The key is the *decoder dependency*.
      *   *Key Concept:* **Bootstrapping.** In compilers, you need a compiler to build the compiler. In cells, you need proteins to read DNA to make proteins.
      *   *Key Concept:* **Semantic Grounding.** In firmware, `0x90` is `NOP` because Intel said so. In DNA, `UGC` is Cysteine because... chemistry? Or because evolution said so?
      *   *Key Concept:* **Execution Model.** Firmware is deterministic (mostly). Biology is stochastic and analog.

  4.  **Developing the "Residue Report":**

      *   *Clean Maps:* Codon Table = ISA. tRNA = Microcode/LUT. Ribosome = Execution Unit.
      *   *Bent Maps:* "Semantics." In software, semantics are functional (what does this instruction *do* to the state?). In biology, semantics are structural/chemical (what does this peptide *fold* into?).
      *   *No Counterpart:* The "Origin of Semantics" problem. In software, we assume an external designer or a previous boot stage. In biology, there is no "Stage 0" hardware that isn't also data. This is the **Von Neumann Bottleneck** applied to origin of life.

  5.  **Addressing the Core Intuition ("It's just a LUT"):**

      *   Does it survive? Yes, functionally.
      *   Is it sufficient? No, because it ignores the *causal closure* problem.
      *   Is the opposing point deep or just confusion? It's deep regarding *origin*, but shallow regarding *mechanism*. Mechanistically, it *is* a LUT. Ontologically, it's a closed loop.

  6.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the user's expertise and set the tone (technical, no fluff).
      *   **Part 1: The Translation:** Map the biological entities to firmware/compiler concepts.
          *   The "It Is Code" Argument (The ISA View).
          *   The "It Is Not Code" Argument (The Bootstrapping/Semantics View).
      *   **Part 2: The Residue Report:**
          *   Clean Mappings.
