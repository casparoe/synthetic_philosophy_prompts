          *   The Null Set (No Counterpart).
      *   **Part 3: The Verdict:** Does the intuition survive?
          *   Distinguish between *Runtime* (Yes, it's code) and *Compile/Link Time* (No, it's a closed loop).
          *   Address the "Missing Concept" question.

  7.  **Refining the Vocabulary (Self-Correction during drafting):**
      *   *Correction:* Don't say "software." Say "firmware" or "machine code."
      *   *Correction:* Instead of "meaning," use "semantic binding" or "symbol resolution."
      *   *Correction:* Instead of "environment," use "runtime state" or "side-channel input."
      *   *Crucial distinction:* The critics often argue about *semiotics* (signifier vs. signified). I need to translate this to *symbol resolution*. In C, `printf` resolves to a library function. In DNA, `AUG` resolves to Methionine. Why?
      *   *The "Decoder is Specified by Sequence" point:* This is the strongest counter-argument. In a CPU, the decoder is hardwired silicon. In a cell, the decoder (ribosome) is made of rRNA and proteins, which are encoded by the DNA. This is a **Self-Hosting Compiler** scenario where the source code compiles the compiler that compiles the source code.

  8.  **Final Polish:** Check against constraints.
