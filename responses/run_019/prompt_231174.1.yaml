      *Drafting Section 2:* Winner's core thesis is that artifacts can embody specific forms of power and authority, but this embodiment is fundamentally a result of human agency, not technological inevitability. In the Moses example, the low bridges were not a necessary feature of parkway engineering; they were a deliberate choice to exclude specific demographics. Similarly, the tomato harvester wasn't an unavoidable evolution of agricultural efficiency; it was developed through specific funding decisions to reshape labor relations and break unions. For Winner, politics enters the artifact through design choices made by engineers, corporations, or state actors who anticipate how the machine will be used. He distinguishes between technologies that are inherently compatible with certain political systems (like nuclear power requiring authoritarian control) and those where politics are inserted during development. Crucially, Winner locates the source of political change in the social decisions surrounding the technology, not in the technology itself acting as an independent historical force. He is arguing that we must look closely at design because those are where political battles are fought and settled, often invisibly.

