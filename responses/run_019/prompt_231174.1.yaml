answer: |-
  You aren't wrong to sense a tension, but it isn't a genuine contradiction. The confusion stems from conflating technology *influencing* society with technology *autonomously driving* history. Winner rejects the latter while affirming the former.

  ### The apparent tension
  Your intuition identifies a causal link: the bridge design caused segregation. This looks like technological determinism, which posits that technology drives social change. However, your professor classifies Winner as a critic because determinism typically implies technological autonomy—that tech develops independently of society and forces adaptation. Winner's argument creates tension because he shows technology shaping politics, yet insists this shaping is a result of human choice. The confusion lies in conflating "technology has political consequences" with "technology determines political outcomes independent of human will." Winner accepts the former but rejects the latter.

  ### What Winner is actually claiming
  Winner's actual claim is that artifacts embody power relations because humans put them there, not because the machines demand it. He distinguishes between two ways artifacts have politics. First, some technologies are inherently compatible with specific political relationships, like nuclear power requiring hierarchical authority. Second, and more commonly, politics are accommodated into design through deliberate choices, like Moses' bridges. In both cases, Winner emphasizes human agency over technological autonomy. The tomato harvester wasn't an inevitable march of progress; it was funded by specific interests to dismantle labor unions. The technology served as a tool for existing political goals. Winner argues that we often mistake these human decisions for technological necessities. By saying artifacts have politics, he isn't saying machines rule us; he is saying powerful people use machines to rule us. The politics are embedded during the design phase by engineers and patrons who anticipate social outcomes. Thus, the technology is the medium of power, not the source. Winner wants us to scrutinize design choices as political acts, revealing that what looks like technical requirement is often social preference. This aligns him with social constructivists who argue technology reflects society, rather than determinists who argue society reflects technology.

  ### Why built-in politics need not be determinism
  Built-in politics avoid determinism because determinism implies inevitability, whereas Winner emphasizes contingency. If the bridges were technologically determined, high bridges would be impossible. They weren't; they were just unfunded. Determinism suggests society must adapt to the machine's logic. Winner suggests the machine adapts to the designer's logic. Recognizing politics in artifacts actually empowers us to change them. If the harvester's labor effects were purely deterministic, resisting them would be futile Luddism. But if those effects are the result of specific design choices, we can demand different designs. Winner shifts the locus of causality from the artifact to the design process. The "determination" happens upstream, in the boardroom or legislature, not downstream in the machine's operation. Therefore, acknowledging built-in politics is a call for democratic oversight rather than resignation. It transforms technology from an external force of nature into a site of political struggle. We aren't victims of the machine; we are victims of the choices frozen into the machine. This preserves the possibility of alternative technological futures, which hard determinism denies.

  ### Does the distinction hold up
  The distinction holds up theoretically, though practical entrenchment can mimic determinism. Critics argue that once a technology like the harvester is adopted, it creates path dependence that constrains future choices, functioning *as if* it were deterministic. This is sometimes called "soft determinism." However, Winner's point remains that this constraint originated in human choice, not technological essence. While the distinction can blur in retrospect, Winner successfully avoids hard determinism by locating agency in design. He is best understood as a social constructivist who takes material consequences seriously. He doesn't say technology drives history; he says humans drive history using technology.
