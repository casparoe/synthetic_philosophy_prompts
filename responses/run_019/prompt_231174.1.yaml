      *   **Section 3: Why built-in politics need not be determinism (~250 words):** Focus on contingency and choice. Determinism implies inevitability. Winner implies contingency. We could have built high bridges. We could have picked different harvesting tech. The politics are frozen human decisions, not intrinsic technological laws. Therefore, criticizing the tech is criticizing the humans who designed it, not submitting to the tech's will.
