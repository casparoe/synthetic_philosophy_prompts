  2.  **Deconstruct the Philosophical Issue:**
      *   **Technological Determinism (TD):** Usually implies technology develops autonomously (independent of social forces) and *then* causes social change. It suggests inevitability ("we had no choice but to adapt").
      *   **Winner's Argument:** Artifacts can embody political relationships *because humans put them there*. The Moses bridges weren't an inevitable outcome of bridge technology; they were a choice by Moses to enforce segregation/classism. The tomato harvester wasn an inevitable evolution of farming; it was funded by specific interests to reshape labor relations.
      *   **The Key Distinction:** Determinism says technology *drives* history independently. Winner says humans *use* technology to drive history. The politics are in the design choices, not in the essence of the machine itself. Therefore, it's social determinism *via* technology, not technological determinism.

