answer: |-
  This is a classic formulation of the **Aggregation Objection** to Scanlonian contractualism, often discussed in the literature surrounding *What We Owe to Each Other*. Your classmate has constructed a *reductio ad absurdum* intended to show that the Individualist Restriction (Premise 3) forces the theory into counterintuitive verdicts (saving one over a million), thereby proving the theory untenable.

  You are right to feel that Premise (3) is the heart of the view; abandoning it entirely collapses contractualism into a form of weighted consequentialism. However, the error in your classmate's argument does not lie in (3) itself, but in the **inference from (3) to (4)**.

  Here is the diagnosis of the error, the pricing of the alternatives, and the path forward for a consistent contractualist.

  ### 1. Locating the Error: Premise (4)

  You should reject **Premise (4)**: *"To choose between principles, then, one compares the strongest complaint on each side."*

  **Why it looked plausible:**
  This premise seems to follow directly from the Individualist Restriction (3). If we cannot sum complaints, it feels as though we must isolate the single strongest grievance on Side A and compare it to the single strongest grievance on Side B. This model is often called **Pairwise Comparison**. It looks like the only way to respect the separateness of persons.

  **Why it is wrong:**
  Premise (4) assumes that the *only* factor relevant to "reasonable rejection" is the *magnitude* of the individual burden. It ignores the **scope** of the rejection. While contractualism forbids *aggregating welfare* (summing the pain), it does not forbid *counting persons* when assessing the justifiability of a principle.

  A principle that imposes a burden on 10,000 people requires a stronger justification than a principle that imposes the same burden on one person, even if we do not sum the burdens. Why? Because a central tenet of contractualism is **mutual recognition**. To adopt a principle that sacrifices 10,000 people to save one is to fail to show equal concern for those 10,000. It treats their standing as moral agents as negligible. The "reasonableness" of Mara's rejection depends not just on her harm, but on whether she can demand that sacrifice *from* the 10,000. When the number of sacrificers is large, the demand becomes unreasonable, not because their pain is summed, but because the *fairness* of the arrangement collapses.

  ### 2. The Pure Tie Case: The Wedge

  You asked what a consistent contractualist should say about the pure tie case: **Mara's life vs. Two Strangers' lives.**

  Scanlon and most contractualists agree: **You must save the two.**
  This is the crucial wedge. If the Individualist Restriction meant "numbers never matter," you would have to flip a coin between the one and the two (since the strongest complaint on both sides is "I will die"). But contractualists argue that saving the one is rejectable by *each* of the two strangers. Each can say, "Why was my life not counted?"

  If numbers matter in the **1 vs. 2 Life** case, they must be able to matter in the **1 Life vs. 10,000 Paralysis** case, provided the paralysis is sufficiently severe. The classmate's argument fails because it assumes a binary switch: either we aggregate (Utilitarianism) or numbers are irrelevant (Classmate's Contractualism). The true contractualist position is a middle ground: **Numbers count for fairness, not for summing value.**

  ### 3. Pricing the Alternatives

  You asked to price the main alternatives for fixing the theory. Here is the cost-benefit analysis of the three routes you identified.

  #### A. Dropping or Softening the Individualist Restriction
  *   **The Move:** Allow complaints to be aggregated directly (e.g., 10,000 paralyzes > 1 death).
  *   **The Cost:** This collapses contractualism into **Pluralist Consequentialism**. You lose the distinctiveness of the view, which is grounded in the idea that we owe justifications *to individuals*, not to the "greater good." If you allow aggregation, you lose the powerful contractualist explanation for why we cannot sacrifice one innocent person to harvest organs for five, even if the "sum of complaints" favors the five.
  *   **Verdict:** Too high a cost. It saves the verdict but kills the theory.

  #### B. Scanlon's "Relevantly Similar" Tie-Breaking
  *   **The Move:** Scanlon suggests numbers break ties only when claims are *relevantly similar* (e.g., life vs. life). In your case, Death vs. Paralysis is dissimilar.
  *   **The Cost:** This route **cannot reach your case** without modification. If you stick strictly to Scanlon's 1998 formulation, you might be forced to admit the classmate is right about the paralysis case (save Mara). To fix this, you must expand the notion of "similarity." You must argue that severe paralysis and death are *close enough* in terms of life-ruining impact that numbers should break the tie.
  *   **Risk:** This risks "smuggling in aggregation." If you stretch "similarity" too far, the Individualist Restriction becomes vacuous. However, if you define similarity by "thresholds of catastrophic loss," it remains viable.
  *   **Verdict:** Viable, but requires expanding Scanlon's original text. It preserves the theory's structure but requires careful boundary drawing.

  #### C. Building More into "Reasonable Rejection" (The Best Route)
  *   **The Move:** Argue that what it is "reasonable" to bear depends on the *number of others* who would otherwise bear the burden. This is the route taken by defenders like Rahul Kumar and Michael Otsuka.
  *   **The Mechanism:** Mara's complaint is strong. But a principle is only valid if it can be justified to *everyone*. A principle that saves Mara at the cost of 10,000 paralyzed residents cannot be justified to the residents because it fails to show them **equal concern**. The "reasonableness" standard encodes a requirement of fairness that is sensitive to numbers without summing welfare.
  *   **The Circularity Worry:** You asked if this makes the theory circular (encoding the verdict into the standard).
      *   *Risk:* Yes, if you simply define "reasonable" as "what yields the right answer."
      *   *Defense:* It is not circular if "reasonable" is grounded in the **ideal of mutual recognition**. We can independently argue that a system of rules that ignores the claims of 10,000 people to satisfy one is not a system of mutual recognition. The verdict flows from the *ideal*, not from an intuition about the specific case.
  *   **Verdict:** This is the most robust defense. It keeps the Individualist Restriction (burdens don't merge) but rejects the classmate's inference that burdens don't *multiply* the justificatory burden.

  ### 4. How to Articulate the Reply

  Here is how you should frame your objection in the seminar:

  > "The error lies in Premise (4). The Individualist Restriction forbids us from *summing* the disvalue of paralysis across the 10,000 residents. It does not forbid us from considering the *number of people* who have a valid complaint when assessing whether a principle is reasonable.
  >
  > In the '1 Life vs. 2 Lives' case, contractualists agree we save the two. This proves that numbers matter to contractualism, not by aggregation, but by **fairness**. To save the one is to tell the second person their standing does not count.
  >
  > Applied to the fire case: Mara has a stronger *individual* complaint (Death > Paralysis). However, a principle that sacrifices 10,000 people to save one fails the test of **equal concern**. Mara cannot reasonably demand a principle that imposes catastrophic burdens on 10,000 others when an alternative exists that imposes a lesser (though still severe) burden on a much larger group. The 'strength' of a rejection is not just a function of the harm to the rejecter, but the harm to the rejecter *relative to the cost of avoiding it for others*. When the 'others' are 10,000 strong, the cost of avoiding their harm becomes morally decisive, not because we summed their pain, but because we counted their persons."

  ### Summary
  *   **Reject:** Premise (4) (The method of comparison).
  *   **Keep:** Premise (3) (The Individualist Restriction), but clarify that it blocks aggregation of *value*, not counting of *persons*.
  *   **Justification:** Appeal to the **Pure Tie Case** (1 vs. 2 lives) to show numbers already matter in contractualism. Extend this via the **Equal Concern** constraint to the dissimilar harm case.
  *   **Risk:** Circularity.
  *   **Mitigation:** Ground "reasonableness" in the independent ideal of mutual recognition, not case-specific intuitions.

  This allows you to save the 10,000 residents without becoming a utilitarian. You maintain that Mara's death is a tragedy, and her complaint is weightier *individually*, but the *principle* that saves her is one that no community of equals could accept.
