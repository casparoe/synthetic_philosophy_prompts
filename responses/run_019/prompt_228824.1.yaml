answer: |-
  I commit to the argument that **there is no single principle.** Your friend's deflationism wins, but it requires a specific refinement: the left/right distinction is not *merely* a historical accident we mistakenly project structure onto; it is a historical accident that *crystallized* into a coalitional identity, which now masks a two-dimensional reality. The distinction tracks real sociological tribes, but it fails to track a coherent philosophical axis.

  To insist on a single principle (Equality, Hierarchy, Change, Tradition) is to paper over the seams you correctly identified in cases 2, 5, 6, and 8. If I were to force a single principle upon your list, I would have to abandon your verdict on **Case 6 (The Distributist)** and **Case 2 (The Hayekian Libertarian)**, and I would defend abandoning them only by admitting that the resulting map is useless for modern politics.

  Here is the argument for why the single-axis model is broken, why your intuitions in the "tension" cases are correct, and what this implies for your unlisted cases.

  ### 1. The Diagnosis: Correlated Axes, Not One Axis
  In 1791 (Case 1), the left/right distinction worked as a single principle because the underlying axes of political conflict were perfectly correlated.
  *   **Economic:** Mercantilist/Privilege (Right) vs. Market/Property (Left).
  *   **Cultural:** Tradition/Church (Right) vs. Reason/Secularism (Left).
  *   **Authority:** Monarchy (Right) vs. Republic (Left).

  In the National Assembly, if you opposed the King, you likely opposed the Church, opposed aristocratic privilege, and favored market liberalization. The "Left" was the party of Enlightenment Universalism. The "Right" was the party of Particularist Tradition.

  Your list demonstrates that these axes have decoupled.
  *   **Case 2 (Hayek):** Economically Right (Property), Culturally Left (Abolish marriage law).
  *   **Case 5 (Stalinist):** Economically Left (State control), Culturally Right (Nationalist/Conservative).
  *   **Case 6 (Distributist):** Economically Left (Anti-usury/Big Capital), Culturally Right (Catholic/Tradition).

  If a single principle existed, Case 6 would not be "suspicious of any account that places him easily." He would have a home. The fact that he is the quintessential "unplaceable" figure proves the spectrum is not a line. He is not an anomaly; he is evidence that the map is two-dimensional.

  ### 2. The Cost of the Single-Principle View
  If you insist on a single principle, you must choose which axis defines the terms. Both choices force you to abandon your own verdicts.

  **Option A: The Economic Principle (Property)**
  *   *Definition:* Left = Collective/State ownership; Right = Private ownership.
  *   *Verdicts Abandoned:* You must move **Case 3 (Bismarck)** and **Case 4 (Fascism)** to the Left. Both utilized state direction and welfare to subordinate capital to the nation. If "state intervention" makes you Left, Bismarck is a Leftist. This contradicts your (and standard) usage.
  *   *Verdicts Abandoned:* You must move **Case 6 (Distributist)** to the Left. He opposes usury and concentrated capital. This feels wrong because his cultural telos is pre-modern, not progressive.

  **Option B: The Cultural Principle (Tradition vs. Progress)**
  *   *Definition:* Left = Universalist/Progressive; Right = Particularist/Traditional.
  *   *Verdicts Abandoned:* You must move **Case 2 (Hayek)** to the Left. Abolishing marriage law and open borders are radical progressive stances against tradition. Your insistence that he is "Right" relies on his economic stance, not this cultural one.
  *   *Verdicts Abandoned:* You must move **Case 5 (Stalinist)** to the Right. If nationalism and social conservatism define the Right, the late Soviet bloc fits there. You insist he is Left, relying on his economic lineage.

  Since neither principle can generate your verdicts without contradiction, the single-axis hypothesis is falsified by your own data. The "Left" and "Right" are now names for **coalitions**, not philosophies. You are "Left" if you ally with the Left party, which currently bundles economic redistribution with social liberalism. You are "Right" if you ally with the Right party, which bundles market protection (or capitalism) with social conservatism.

  ### 3. Analysis of Your "Tension" Cases
  Your intuitions in the difficult cases are actually the strongest evidence for the two-dimensional view.

  *   **Case 6 (Distributist):** You are right to be suspicious. He is the control group. He proves that Economic Left + Cultural Right is a coherent position that the 1D spectrum cannot display. He is not "center"; he is off the line.
  *   **Case 8 (Communist Anti-Immigration):** You feel the pull that he is "drifting right." This is because he is prioritizing the *Particularist* axis (Nation/Wages) over the *Universalist* axis (Class/Solidarity). He is economically Left, culturally Right. In a 1D world, this is a contradiction. In a 2D world, it is a specific quadrant (often called "National Left" or "Paleo-Left").
  *   **Case 7 (Technocrat):** You and your friend have low confidence because he is a pure **Managerial Liberal**. He is economically Center-Right (Free trade) but socially Center-Left (Abortion/Carbon). He is the establishment consensus. The Left/Right fight is often fought *over* him, which is why he is hard to place. He is the status quo.

  ### 4. Predictions for New Cases
  If we accept the two-dimensional model (Economic Left/Right × Cultural Traditionalist/Progressive), we can place your new cases precisely, whereas the 1D model would fail.

  **A. The Market Socialist**
  *   *Profile:* Social ownership of capital, but allocated via market mechanisms; likely socially progressive.
  *   *Placement:* **Left.**
  *   *Reasoning:* Economic Left (Social ownership) + Cultural Left (Progressive). This is one of the few positions that still aligns both axes, which is why "Democratic Socialism" fits comfortably on the 1D line today.

  **B. The Eco-Monarchist**
  *   *Profile:* Rewilding enforced on Crown Land.
  *   *Placement:* **Right (with ambiguity).**
  *   *Reasoning:* Culturally Right (Monarchy/Tradition/Hierarchy). Economically ambiguous, but "Crown Land" implies aristocratic stewardship rather than democratic redistribution. Environmentalism is often coded Left, but when framed as "stewardship of heritage" by a Monarch, it codes Right. He falls into the same quadrant as the Distributist (Case 6) but with more emphasis on hierarchy than dispersion. He is a **Reactionary**.

  **C. The Theocrat who Abolishes Inheritance**
  *   *Profile:* Religious law (Traditional) + Radical Redistribution (Anti-accumulation).
  *   *Placement:* **Unplaceable on 1D; Quadrant: Auth-Left / Trad-Left.**
  *   *Reasoning:* This is the strongest test. Economically, abolishing inheritance is a far-Left policy (more radical than most social democrats). Culturally, Theocracy is far-Right.
  *   *Prediction:* In a 1D system, this figure is claimed by both sides and rejected by both. The economic Left rejects the theology; the cultural Right rejects the redistribution. This confirms your suspicion in Case 6: **Coherent philosophies exist that the Left/Right distinction cannot categorize.**

  ### 5. Conclusion
  Your friend is right that the distinction is a historical accident, but you are right that it tracks something real. It tracks **coalitional alignment**, not **philosophical essence**.

  *   **1791:** The axes aligned. The distinction was philosophical.
  *   **2024:** The axes cross-cut. The distinction is tribal.

  To settle your argument: Stop asking "Is X Left or Right?" as if it reveals a hidden essence. Ask "Which coalition does X join?" The Distributist (Case 6) and the Theocrat (Case C) have no home because the current coalitions are stapled together in a way that excludes their specific combination of values. The distinction is real as a map of *power*, but false as a map of *truth*. Abandon the search for a single principle; it does not exist.
