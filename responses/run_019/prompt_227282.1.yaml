answer: |-
  # Specification for a Regulatory Fairness Criterion: The Audit Standard for Statistical Risk Scores

  ## I. Desiderata List

  The following requirements constitute the necessary conditions for a risk scoring system to be deemed "Fair" under this regulatory framework. Each requirement includes the motivating intuition, a canonical case, and its binding status.

  **1. Auditability and Transparency**
  *   **Intuition:** A fairness claim is meaningless if it cannot be independently verified by a third party without access to proprietary weights or trade secrets.
  *   **Motivating Case:** Proprietary credit scoring models (e.g., FICO variations) where denied applicants cannot ascertain which variables drove the decision, making disparate impact analysis impossible for the public.
  *   **Status:** **Genuinely Binding.** Without this, no other criterion can be enforced. It is a procedural prerequisite, not a normative outcome.

  **2. Error Balance (Equalized Conditional Errors)**
  *   **Intuition:** Individuals who share the same true underlying status (e.g., both would repay the loan, or both would not reoffend) should face the same rate of error regardless of group membership. The burden of mistake should not fall disproportionately on a protected class.
  *   **Motivating Case:** The COMPAS recidivism dispute (ProPublica, 2016). Black defendants were nearly twice as likely as White defendants to be falsely labeled high-risk (False Positive), while White defendants were more likely to be falsely labeled low-risk (False Negative).
  *   **Status:** **Genuinely Binding (Normative Core).** This is the primary substantive fairness constraint. It maps directly to the distribution of harm.
  *   **Exclusionary Power:** **High.** This requirement excludes the largest number of candidate models in real-world deployments where base rates differ across groups.

  **3. Validity (Within-Group Calibration)**
  *   **Intuition:** A risk score of $X\%$ must correspond to an observed event rate of $X\%$ within each group. If a score means "20% risk" for Group A but "40% risk" for Group B, the score is semantically unstable and undermines rational decision-making.
  *   **Motivating Case:** Medical triage algorithms where a "high risk" flag triggers resource allocation. If the flag is calibrated for the general population but miscalibrated for a specific demographic, resources are misallocated relative to actual need.
  *   **Status:** **Conditionally Binding.** It is binding as a requirement of *utility* and *truthfulness*, but subordinate to Error Balance when the two conflict (see Section II).

  **4. Cost-Sensitivity**
  *   **Intuition:** False Positives (FP) and False Negatives (FN) are not morally equivalent. A fairness criterion must weight errors according to the specific harm of the domain (e.g., liberty vs. profit).
  *   **Motivating Case:** Pretrial detention. A False Positive (detaining an innocent person) violates liberty rights; a False Negative (releasing a reoffender) risks public safety. Treating these errors as equally "unfair" ignores the asymmetry of rights.
  *   **Status:** **Genuinely Binding.** A generic fairness metric that does not account for domain-specific harm weights is ethically blind.

  ---

  ## II. Resolution of Impossibility Results

  **The Conflict:**
  As established by Chouldechova (2017) and Kleinberg et al. (2016), absent perfect prediction or equal base rates across groups, a score cannot satisfy **Within-Group Calibration** (Desideratum 3) and **Error Balance** (Desideratum 2) simultaneously. Specifically, if base rates differ, enforcing equal False Positive Rates and False Negative Rates necessitates that the positive predictive value (and thus calibration) differs across groups.

  **The Sacrifice:**
  This framework mandates the sacrifice of **Within-Group Calibration** in favor of **Error Balance** when the two are mathematically incompatible.

  **The Principle:**
  *Fairness as Distributive Justice overrides Fairness as Information Quality.*
  Calibration ensures the *score* is accurate; Error Balance ensures the *consequences* are distributed equally. A regulator's primary mandate is the prevention of disparate harm, not the preservation of semantic consistency in probability estimates. If a model is calibrated but generates disparate false positive rates, it is accurately predicting risk while systematically subjecting one group to higher rates of punitive error. If a model balances errors but is miscalibrated, it is treating similar cases similarly, even if the probability label attached to them is inconsistent. The former is discriminatory; the latter is statistically noisy but distributively equitable.

  **Implication:**
  This choice acknowledges that every deployable criterion chooses whom to wrong. By prioritizing Error Balance, we accept that risk scores will lose their universal interpretability (a score of 0.7 means different things for different groups). This is the cost of ensuring that the *burden of error* does not track with protected characteristics.

  ---

  ## III. Assessment of Smuggled Requirements

  **1. Fairness as a Property of the Score vs. The Process**
  *   **The Claim:** Fairness can be audited solely by examining the input-output behavior of the deployed score, ignoring the data lineage or development process.
  *   **Assessment:** **Necessary Fiction.** For a regulatory standard, this requirement is pragmatically binding. Regulators cannot audit the "soul" of the training data or the intent of the developers; they can only audit the observable artifact. However, this is philosophically incomplete. A score can satisfy Error Balance on a test set while encoding historical injustices (e.g., using "arrests" as a proxy for "crime" in over-policed neighborhoods).
  *   **Verdict:** The standard must treat this as a *proxy* for fairness. It is sufficient for compliance, but not sufficient for justice. The framework accepts this limitation to maintain auditability (Desideratum 1).

  **2. Invariance Under Relabeling**
  *   **The Claim:** A fairness criterion should yield the same verdict regardless of which outcome is coded as "positive" (e.g., predicting "Default" vs. predicting "Repayment").
  *   **Assessment:** **False Dogma.** This requirement is often smuggled in from machine learning theory (where loss functions are often symmetric) but fails in normative contexts.
  *   **Reasoning:** In lending, "Default" is the harm to the bank; "Denial of Credit" is the harm to the applicant. Swapping the label swaps the False Positive and False Negative. Because the moral cost of denying credit (Desideratum 4) differs from the cost of funding a default, the fairness verdict *should* change. A criterion that is invariant under relabeling ignores the asymmetry of harm.
  *   **Verdict:** **Rejected.** An adequate criterion must be sensitive to the direction of the prediction relative to the allocation of benefit and burden.

  ---

  ## IV. Brief Scoring of Existing Contenders

  *   **Demographic Parity:** Fails **Error Balance** and **Cost-Sensitivity**. It mandates equal selection rates regardless of qualification, effectively requiring quotas. It sacrifices validity and utility for a superficial equity. **Rejected.**
  *   **Calibration (Within-Group):** Satisfies **Validity** but fails **Error Balance** when base rates differ. It allows disparate false positive rates, which permits disparate harm. Under this framework, it is a validity constraint, not a fairness sufficient condition. **Subordinate.**
  *   **Equalized Odds:** Satisfies **Error Balance** and accommodates **Cost-Sensitivity** (via weighted error rates). It conflicts with Calibration (as resolved in Section II). It is the closest existing mathematical formulation to this regulatory standard. **Accepted as the operational metric.**

  ---

  ## V. Confidence and Uncertainty

  **Confidence in Framework:** **High (85%).**
  The logic holds together as a regulatory instrument. It prioritizes auditability and harm reduction over statistical elegance, which aligns with the mandate of civil rights enforcement. The rejection of label invariance is robust in asymmetric domains (law, medicine, finance).

  **Point of Least Certainty:** **The Sacrifice of Calibration.**
  I am least certain about the decision to prioritize Error Balance over Within-Group Calibration in *medical triage* contexts. In criminal justice, the binary decision (detain/release) makes error rates the primary vehicle of harm. In medicine, a risk score often informs a continuum of care rather than a binary threshold. If a score is miscalibrated across groups (e.g., a risk score underestimates kidney failure risk for Black patients, as found in the Obermeyer et al. 2019 study), clinicians may withhold necessary care even if error rates at a specific threshold are balanced. In continuous-care domains, Calibration may be the more salient proxy for "need," and sacrificing it could lead to systematic under-treatment that Error Balance fails to catch. This framework assumes binary decision thresholds; its applicability degrades as decisions become more continuous.
