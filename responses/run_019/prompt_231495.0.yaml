      *   *Search Algorithm?* (Hill climbing vs. Simulated Annealing).
      *   *Navigation/Mapmaking:* You have a map (theory). You encounter terrain (data). If the map is wrong, you draw a new contour (belt). If the projection is wrong, you change the map type (core).
