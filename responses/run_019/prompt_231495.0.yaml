      *(Final Polish)*: Ensure the distinction between *degenerating* (adding patches) and *refactoring* (improving core) is clear. In Lakatos, you *can't* refactor the core without starting a new program. In SE, refactoring the core is often the solution to degeneration. This is a critical disanalogy.

      Let's assemble the response.

