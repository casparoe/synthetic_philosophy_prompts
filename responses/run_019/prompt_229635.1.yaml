answer: |-
  **Case 1**
  Dr. Aris watches Patient Leo's vitals plummet on his screen. He knows pressing 'Enter' releases epinephrine, saving Leo instantly. It costs him nothing. Harboring a grudge against Leo's family, Aris stares at the cursor, consciously decides against pressing it, and lets the timer expire. Leo dies. Aris logs the event and leaves. The causal chain runs directly through Aris's withheld command; his decision is the only variable that changed. He prevented survival by refusing the keystroke he alone controlled. His inaction functioned as a deliberate barrier to life. The system registers his conscious override of the safety protocol.

  **Case 2**
  Patient Leo is under Dr. Aris's supervision. Leo's vitals plummet. Protocol requires Aris to press 'Enter' to release epinephrine. Aris harbors a grudge against Leo's family. He remains at his desk. He does not press 'Enter'. The timer expires. Leo dies. Aris logs the event and leaves. No drug entered Leo's body. Aris did not touch Leo. He merely failed to act while nature took its course. The record shows death by arrest. Aris's hands remained still throughout the incident. His inaction was a continuation of the status quo. The system registers no input.

  ***

  **Analysis**

  **Presentational Mechanism:** The shift is produced by *Event Individuation*. Case 1 frames the omission as a positive event ("withheld command," "override," "barrier"), while Case 2 frames it as a nullity ("failed to act," "hands remained still," "no input").

  **Normative Inertia:** This mechanism is normatively inert because the metaphysical facts of causation and intent are identical. Whether a non-event is linguistically categorized as a "withholding" or a "non-occurrence" alters nothing in the world state; therefore, the conflicting verdicts cannot both be correct responses to the facts.

  **Collapse:** Stripped of framing, the pair collapses into: "Aris, motivated by a grudge, knowingly failed to press a life-saving key he controlled, causing Leo's death."

  **Defense of Case 1:** A defender might argue the *Volitional Transparency* Defense: Case 1 is not merely pumping intuition but revealing the moral reality that wrongness tracks the *exercise of will*, not muscle movement. The "active" description accurately captures the agent's mental engagement, making the intuition reliable because it responds to the *choice*, which Case 2 obscures.

  **Principle:** Presentation-driven shifts should influence moral judgment only when they clarify the agent's *volitional engagement* with the outcome, rather than merely redescribing identical physical behaviors.
