  A friend who recently took a course in Renaissance political thought gave me the following summary of Machiavelli on fortune and virtù: "Machiavelli thinks fortune governs roughly half of what befalls us, and the wise prince should treat fortune as a river in flood—it cannot be stopped once it is raging, but its damage can be contained by building dikes and channels in advance. Virtù is therefore the foresight to prepare for bad times while times are still good, and the practical lesson is that a prince should be prudent and cautious, never exposing himself to fortune through rash action, because preparation, not boldness, is what keeps rulers in power." I have the sense this is partly right and partly misleading. I vaguely remember that Machiavelli, in the same discussion, says something rather different about whether a prince should be cautious or impetuous, but I do not trust my memory. I would like an accuracy audit of my friend's summary: which parts would a careful reader of Machiavelli accept, which are imported or overstated, and does the concluding advice about the cautious prince actually follow from the accurate parts? Please write this as continuous prose, the way you would in a letter or email, with no headings, bullet points, bold text, or tables.
