answer: |-
  This is a sophisticated meta-ethical question that cuts to the heart of the debate between consequentialism (specifically utilitarianism/welfarism) and deontological or contractualist constraints. You are correct that while the *objection* (the separateness of persons) is canonical, the specific *defensive maneuver* you describe rarely receives a distinct proper name. It is usually subsumed under general responses to Rawls's objection in *A Theory of Justice* (§5).

  However, the maneuver is distinct enough to be taxonomized. In the absence of a canonical term, I propose calling this **"The Bookkeeping Defense"** (or sometimes **"The Formalist Defense"**).

  Below is a breakdown of how to taxonomize this move, how to distinguish it from related fallacies, and an analysis of when a defender might be entitled to use it.

  ### 1. Taxonomy and Naming

  **Proposed Name:** **The Bookkeeping Defense**
  **Structure:**
  1.  **Objection:** Aggregation violates the separateness of persons (moral distinctness).
  2.  **Defense:** Our formalism records each person's utility separately (representational distinctness).
  3.  **Counter:** Recording separately but summing functionally erases the moral weight of that separation.
  4.  **Rejoinder:** Summation is the definition of aggregation; separate recording satisfies the requirement of distinctness.

  **Why "Bookkeeping"?**
  The term highlights the defender's reliance on the *accounting method* (separate variables) to satisfy a *moral requirement* (respect for persons), while treating the *accounting operation* (summation) as morally neutral. It isolates the mismatch between the ontology of the model (many entries) and the axiology of the model (one total).

  **Literature Context:**
  While unnamed, this exchange is the engine of the **Rawls-Nozick-Scanlon** critique of utilitarianism.
  *   **Rawls:** Accuses utilitarianism of extending the principle of choice for one man to all men. The Bookkeeping Defense denies this extension, claiming it chooses for *all men* by counting *each man*.
  *   **Scanlon:** In *What We Owe to Each Other*, he identifies this as the failure to satisfy the "Individualist Restriction." The defender claims the restriction is met by the input; Scanlon argues it is violated by the output.
  *   **John Broome:** In *Weighing Goods*, Broome analyzes the "addition" of goodness. He acknowledges that addition requires a common metric (commensurability), which is where the moral work is actually happening, not in the separate entries.

  ### 2. Distinguishing the Maneuver

  You asked how to distinguish this from question-begging, motte-and-bailey, and mere clarification.

  #### A. vs. Motte-and-Bailey
  This is the strongest fit. The Bookkeeping Defense is often a structural **Motte-and-Bailey**.
  *   **The Motte (Defensible):** "We represent each person as a distinct variable in our equation. We do not merge their souls." (This is trivially true of almost all welfare economics).
  *   **The Bailey (Controversial):** "Therefore, our calculation respects the moral distinctness of persons sufficiently to justify imposing the loss."
  *   **The Shift:** When challenged on the Bailey (that summation cancels distinctness), the defender retreats to the Motte ("But we *did* count them separately!").
  *   **Distinction:** It counts as Motte-and-Bailey *if* the defender implies that separate representation *entails* moral permissibility. If they admit separate representation is necessary but not sufficient, it is not a fallacy, but a stalemate.

  #### B. vs. Question-Begging
  It is not strictly circular (question-begging) because it offers a premise: *Respect for persons requires only separate representation.*
  *   **Why it feels like Q-begging:** The premise is the exact point in dispute. The objector defines "respect" as *non-substitutability*; the defender defines "respect" as *recognition*.
  *   **Distinction:** Question-begging assumes the conclusion in the premise. This maneuver assumes a *definition* in the premise. It is better classified as **Equivocation on "Respect."** The defender uses a thin, formal definition of respect (counting); the objector uses a thick, substantive definition (constraints on trade-offs).

  #### C. vs. Mere Clarification
  Sometimes the objector *does* misunderstand the math (e.g., thinking the utilitarian literally merges consciousness).
  *   **Clarification:** "You think we merge persons; we don't, we sum utilities." (Legitimate).
  *   **Bookkeeping Defense:** "We don't merge persons; we sum utilities, and that's fine." (The maneuver you identified).
  *   **Distinction:** A clarification corrects a factual error about the theory. The Bookkeeping Defense corrects a moral interpretation of the theory by insisting the formalism settles the moral question. If the objector understands the math but objects to the *moral significance of summation*, and the defender replies only about the math, it is the Bookkeeping Defense, not clarification.

  ### 3. When is the Defender Entitled to this Move?

  Is the Bookkeeping Defense always fallacious? No. There are contexts where the move is legitimate. Distinguishing these is crucial for your thesis.

  **Case 1: Prudential Aggregation (Legitimate)**
  If the calculation is happening *within* a single life (e.g., I endure a dentist visit now for less pain later), the Bookkeeping Defense is valid. The "separate entries" are time-slices of one person. Summation here does not violate distinctness because there is no distinctness to violate.
  *   *Relevance:* Defenders often argue that if aggregation is okay intra-personally, the Bookkeeping Defense shows there is no *relevant* difference inter-personally. (Parfit's *Reasons and Persons* attacks this).

  **Case 2: Purely Economic/Commensurable Goods (Legitimate)**
  If the "loss" and "gain" are purely financial and reversible (e.g., a tax adjustment), the Bookkeeping Defense holds. Money is fungible; persons are not. If the currency of the calculus is fungible, the separate entry + summation model is appropriate.
  *   *The Limit:* The maneuver fails when the currency is **rights, integrity, or bodily status**. You cannot sum "minutes of waiting time" against "a year of severe pain" without implicitly claiming they are fungible. The Bookkeeping Defense hides this claim to fungibility behind the veil of "separate entries."

  **Case 3: Impartiality Requirements (The Strongest Defense)**
  The defender is entitled to this move if they can argue that *not* aggregating violates the equal moral worth of persons.
  *   *Argument:* "If I refuse to sum, I am privileging the identified victim over the scattered many. By counting everyone separately and summing, I am giving everyone's welfare equal weight."
  *   *Taxonomy:* This shifts the debate from **Separateness** to **Impartiality**. Here, the Bookkeeping Defense is not a shield against the separateness objection, but a positive argument that aggregation is the *only* way to respect persons equally.
  *   *Literature:* See **John Broome** or **Utilitarian Prioritarians**. They argue that "separateness" shouldn't block the moral arithmetic of equal consideration.

  ### 4. Suggested Terminology for Your Work

  Since you are writing a PhD thesis, you have the license to stipulate a term if it clarifies the literature. I recommend:

  **"The Formalist Retreat"**
  This captures the movement from the moral objection to the formal description.
  *   *Usage:* "The utilitarian employs the **Formalist Retreat**, conceding the ontological distinctness of persons in the model's inputs while maintaining the moral permissibility of summation in the outputs."

  **"The Commensurability Shield"**
  This highlights that the real work is being done by the assumption that the losses and gains are measurable on a common scale.
  *   *Usage:* "The **Commensurability Shield** allows the defender to treat the separateness objection as a technical accounting issue rather than a moral constraint."

  ### 5. Key References for Your Bibliography

  To ground this taxonomy, you should look at how these authors handle the "summation" step specifically:

  1.  **T.M. Scanlon, *What We Owe to Each Other*:** Look for his discussion of the "Individualist Restriction." He explicitly rejects the Bookkeeping Defense, arguing that justification must be acceptable to each person *individually*, not just counted individually.
  2.  **Frances Kamm, *Intricate Ethics*:** She distinguishes between "aggregation" and "non-aggregation" principles. She would classify the Bookkeeping Defense as a failure to recognize "claims" vs. "goods."
  3.  **John Broome, *Weighing Good*:** He is sympathetic to the defender. He argues that "goodness" is inherently additive. For Broome, the Bookkeeping Defense isn't a defense; it's just the truth about value.
  4.  **Alex Voorhoeve, *Conversations on Ethics*:** Specifically the dialogues on aggregation. He explores when the "separate entries" argument holds water (e.g., in prioritarianism) and when it fails.
  5.  **Michael Otsuka, "Rights and the Functions of Morality":** Discusses when we can trade off rights. He would argue the Bookkeeping Defense fails when rights are at stake because rights are not entries in a sum.

  ### Summary for Your Thesis

  The maneuver lacks a canonical name but is a recognizable pattern in post-Rawlsian meta-ethics. I recommend labeling it **"The Bookkeeping Defense."**

  *   **Classification:** It is best analyzed as a **Motte-and-Bailey** regarding the definition of "respect for persons" (Recognition vs. Inviolability).
  *   **Differentiation:** It is distinct from clarification because it addresses moral disagreement, not mathematical misunderstanding. It is distinct from simple question-begging because it relies on an equivocation of terms rather than circularity.
  *   **Legitimacy:** It is legitimate only in contexts of **fungibility** (money, minor preferences) or **impartiality arguments** (equal weight), but illegitimate when applied to **incommensurable goods** (rights, bodily integrity, life vs. convenience).

  This taxonomy should allow you to pin down the maneuver without mischaracterizing the sophisticated defenders (like Broome) who genuinely believe the summation operator is morally neutral, while critiquing those who use the bookkeeping formalism to shield the operation from moral scrutiny.
