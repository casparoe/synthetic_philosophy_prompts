  Consider Elena, a habituated chili enthusiast, eating a ghost pepper wing. She describes the sensation on her tongue as "searing," "sharp," and "burning," locating it precisely to the tip and sides, and rates the intensity 9/10 on a standard pain scale, acknowledging it matches the sensation of a minor thermal burn. Yet, she smiles, continues chewing without reaching for water, and explicitly states she wants the sensation to persist because she values the flavor profile it unlocks. She exhibits no withdrawal reflex, no facial grimacing associated with distress, and treats the burning as a desirable feature of the meal rather than a signal to stop eating.

  **Intrinsic-Badness View:** The verdict is that Elena is not in pain. The forcing feature is her lack of aversion and her explicit desire for the sensation to continue; since unpleasantness is constitutive of pain on this view, an experience lacking unpleasantness cannot be pain. The diagnosis diverges from the separable-response view by reclassifying the sensory event as intense nociception or irritation that is being masked by pleasure, rather than genuine pain.

  **Separable-Response View:** The verdict is that Elena is in genuine pain but without suffering. The forcing feature is her sensory report (sharp, burning, 9/10), which matches the phenomenological profile of pain exactly. The diagnosis diverges from the intrinsic-badness view by treating the affective-motivational layer as a contingent addition that has been successfully dissociated from the sensory core through habituation and contextual framing.

  **Mechanics:** The single load-bearing feature is the **contextual valuation of the sensation as culinary reward**, which repurposes the nociceptive signal from a warning into a welcome intensity. If this feature is removed—for example, if Elena bites the pepper accidentally expecting sweetness—the aversion returns immediately, and the case collapses back into an ordinary painful episode. A defender of the intrinsic-badness view would best attack the case by arguing for **masking**: the unpleasantness is still present constitutively but is merely outweighed by the anticipatory pleasure of the flavor, meaning the badness hasn't been peeled off, only netted out.

  Summary: The scenario hinges on a contextual framing that inverts the motivational response to a nociceptive signal without altering its sensory character.
