answer: |-
  # Joint Statement on the Representational Status of Learned Features in Modular Arithmetic Transformers

  **Date:** October 26, 2023
  **Collaborators:** Dr. Elena Vance (Representational Realist) & Dr. Samir Kato (Strict Instrumentalist)
  **Subject:** Adversarial Collaboration on Interpretability Claims in a 2-Layer Transformer Trained on $\pmod{97}$ Addition

  ## Preamble

  After six months of adversarial collaboration, we have analyzed a 2-layer transformer trained to perform modular addition ($a + b \pmod{97}$). We utilized two distinct interpretability methods: a supervised linear probe trained to predict the congruence class of the inputs, and an unsupervised Sparse Autoencoder (SAE) trained on the residual stream activations. Both methods identified a subspace (specifically, a pair of orthogonal directions) that correlates strongly with the inputs mapped onto the unit circle (the "clock" representation).

  While we remain divided on the metaphysical status of these features, we have isolated our empirical agreements and precisely localized our disagreements. This document serves as a public record of our consensus and our pre-registered plan to resolve the remaining divergence.

  ---

  ## Part I: Points of Empirical Agreement

  We both affirm the following claims as factually true descriptions of the model, the methods, and the observations. We agree that any valid theory of interpretability must account for these data points.

  1.  **Model Performance:** The model achieves >99% accuracy on the validation set for $\pmod{97}$ addition after "grokking" (extended training beyond zero training error).
  2.  **Probe Success:** A linear probe trained on the residual stream (post-attention, layer 1) to predict the angle $\theta = 2\pi a / 97$ achieves $R^2 > 0.95$. This probe generalizes to unseen input pairs.
  3.  **SAE Convergence:** An SAE trained independently on the same activations, without access to angle labels, learns a dictionary element (feature) that activates periodically with respect to the input $a$, matching the probe's direction with a cosine similarity of $> 0.92$.
  4.  **Causal Leverage:** Intervening on the activations by projecting out the subspace identified by the probe/SAE causes a specific, predictable degradation in performance. The model does not fail randomly; it fails in ways consistent with losing access to the phase information (e.g., output distribution becomes uniform over the modulus).
  5.  **Robustness:** This structure appears across 5 different random seeds with varying initialization, though the specific orientation of the vectors varies.
  6.  **Method Dependence:** The exact sparsity and orientation of the identified direction depend on hyperparameters (e.g., SAE dictionary size, probe regularization). There is no single "God's eye" vector; there is a stable *subspace*.

  ---

  ## Part II: Ontological Disagreements

  We disagree on how to interpret the facts listed above. The table below phrases the *topic* of disagreement neutrally, followed by our respective positions.

  | Topic of Disagreement | Realist Position (Vance) | Instrumentalist Position (Kato) |
  | :--- | :--- | :--- |
  | **1. The Nature of the Direction** | The direction *is* a feature of the network. The network physically stores information in this geometry because the task demands it. The statement "This direction encodes angle" is truth-apt and true. | The direction is a *description* of the network. The network stores weights; we project a coordinate system onto them. "Encodes angle" is a shorthand for "This coordinate system makes the behavior intelligible to humans." |
  | **2. Uniqueness** | The circular representation is the *unique* efficient solution to this problem. Any model solving this task must contain this structure. It is discovered, not chosen. | The circular representation is *one* of many valid bases. We prefer it because humans understand circles. A different basis could explain the weights equally well but would be unintelligible to us. |
  | **3. Truth Conditions** | A feature is real if it is **causally isolated**. If ablating *only* this direction breaks *only* the angle-dependent behavior, the feature exists independently of the observer. | A feature is real if it is **compressionally useful**. If describing the model in terms of this feature reduces the complexity of predicting its behavior, the feature is valid. Causality is necessary but not sufficient for "reality." |

  ---

  ## Part III: Cruxes and Pre-Registered Experiments

  We have identified two specific cruxes. Settling these will not necessarily convert one of us to the other's camp, but it will force an update in our credences regarding the "Reality" of features.

  ### Crux 1: Basis Invariance vs. Functional Equivalence
  **Question:** Is the geometry of the representation forced by the mathematics of the task, or is it an artifact of the optimization path that we merely prefer?

  *   **Experiment:** Train 50 models on the same task.
      1.  Measure the pairwise cosine similarity of the "angle direction" (found via probe) across all models.
      2.  Measure the pairwise functional similarity (output logits correlation) across all models.
      3.  **Crucial Step:** Apply a random orthogonal rotation to the residual stream of a trained model, then fine-tune the unembedding layer *only* to restore performance (preserving function but scrambling geometry). Re-run the SAE.

  *   **Predictions:**
      *   **Vance (Realist):** The cosine similarity of the directions across seeds will be high (mean $> 0.8$). In the rotation experiment, the SAE will fail to find the original "angle" feature or will find a rotated version that is mathematically equivalent, indicating the geometry is locked to the computation.
      *   **Kato (Instrumentalist):** The cosine similarity across seeds will be low (mean $< 0.4$), while functional similarity remains high. In the rotation experiment, the SAE will find a *new* feature that explains the variance in the new basis, proving the "angle" was just a convenient coordinate choice, not a physical constraint.

  ### Crux 2: The "Alien Concept" Test
  **Question:** Can the model represent a concept that is computationally useful but for which humans have no intuitive "map"?

  *   **Experiment:** Train a model on a task where the optimal internal representation is known to be high-dimensional and non-geometric (e.g., parity over a specific subset of inputs with no circular symmetry). Apply the SAE.
      *   If the SAE finds sparse, monosemantic features that humans can label, the Realist claims victory (features are universal).
      *   If the SAE finds features that are only interpretable via another model (a "translator"), the Instrumentalist claims victory (features are relative to the interpreter).

  *   **Predictions:**
      *   **Vance (Realist):** Even in complex tasks, there exist "natural features" that are human-interpretable. If we can't label them, our SAE isn't powerful enough yet.
      *   **Kato (Instrumentalist):** Most features will be "alien." Interpretability is a property of the *interface* between the model and the human, not the model alone. We expect the SAE features to be opaque without a secondary translation layer.

  ---

  ## Part IV: Assessment: Words or World?

  After extensive debate, we classify the remaining disagreement as **70% about the World, 30% about Words.**

  *   **Words (30%):** We agree on the math. We agree on the causal interventions. We disagree on whether the word "real" applies to the vector. Vance uses "real" to mean *causally distinct and robust*. Kato uses "real" to mean *mind-independent*. This is a semantic boundary dispute.
  *   **World (70%):** The core disagreement rests on **Crux 1**. If the geometry of the solution is unique (high cosine similarity across seeds), then the "map" is constrained by the "territory" to the point where the distinction collapses. If the geometry is arbitrary (low similarity), then the "angle" is genuinely a projection we impose. This is an empirical question about the loss landscape of neural networks, not just philosophy.

  We commit to running the **Basis Invariance Experiment (Crux 1)** within 30 days. We agree that if the mean cosine similarity across seeds is $< 0.3$, Vance will publicly update her statement from "The network contains the angle feature" to "The network contains a subspace that admits an angle interpretation." Conversely, if similarity is $> 0.8$, Kato will update from "Features are projections" to "Features are attractors in weight space."

  **Signed,**

  *Dr. Elena Vance*
  **Representational Realist**

  *Dr. Samir Kato*
  **Strict Instrumentalist**
