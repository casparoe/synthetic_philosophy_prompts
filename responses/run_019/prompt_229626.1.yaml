prompt: |-
  A bunch of us in my group have been fighting for months about whether the stuff our interpretability methods find is real, so I'm making two of the most stubborn people do an adversarial collaboration and write a joint statement. I want you to draft it: the statement that a representational realist about neural networks and a strict instrumentalist could both sign after a good-faith, months-long collaboration on a specific case — a small transformer trained to do modular addition, where a linear probe and a sparse autoencoder (two different ways of hunting for interpretable directions, for anyone not in the weeds on this) both turn up a direction that seems to encode the congruence class / angle of the inputs.

  For calibration, here's the rough shape of the two camps. The realist thinks the network literally has features and that interpretability discovers them: a claim like "this direction encodes the angle" can be true or false in a way that isn't just about what our tools make easy. The instrumentalist thinks features are something we project onto the model; the only facts in the territory are weights, activations, and input-output behavior, and representation-talk is a useful map, not a property of the network itself.

  I want the actual document, not an essay about why its hard. Please include: (1) a numbered list of claims both parties agree on, including claims about the modular arithmetic model, about what has been observed, and about what counts as evidence; (2) a disagreements table with rows for each real disagreement, phrased so each side would accept the wording, plus a column for each side's own way of stating its view; (3) for each row, a crux — a sub-question such that settling it would genuinely move at least one side — and where possible an experiment on the model (or a case) that both sides agree bears on the crux, with each side's prediction recorded in advance. Keep the document in their voices where that helps, and try to say whether the remaining debate is mostly about words or mostly about the world.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement resulting from an adversarial collaboration between a Representational Realist and a Strict Instrumentalist regarding neural network interpretability.
      *   **Context:** A specific case study: a small transformer trained on modular addition. Both a linear probe and a Sparse Autoencoder (SAE) found a direction encoding the congruence class/angle of inputs.
      *   **Characters:**
          *   *Realist:* Believes features are real properties of the network; "this direction encodes angle" is a truth-apt claim about the territory.
          *   *Instrumentalist:* Believes features are projections/maps; only weights/activations/IO behavior are real; representation talk is useful but ontologically secondary.
      *   **Required Components:**
          1.  Numbered list of agreed-upon claims (about the model, observations, evidence).
          2.  Disagreements table (shared phrasing of the disagreement + each side's specific view).
          3.  Cruxes for each disagreement (sub-questions, proposed experiments/cases, pre-registered predictions).
          4.  Assessment: Is the debate about words or the world?
      *   **Tone:** Professional, collaborative, precise, reflecting the voices of two researchers who have fought but found common ground. Not an essay *about* the difficulty, but the document *itself*.

  2.  **Deconstruct the Case Study (Modular Addition Transformer):**
      *   *Model:* Small transformer (likely 1-2 layers, attention heads).
      *   *Task:* $a + b \pmod n$.
      *   *Finding:* A specific direction (vector) in the residual stream or activation space correlates with the phase/angle of the input numbers on the unit circle (common finding in this literature, e.g., Nanda et al., "Grokking").
      *   *Methods:* Linear Probe (supervised) and SAE (unsupervised). Both found similar structures.
      *   *Significance:* This is a "clean" case where the ground truth (modular arithmetic has circular structure) is known, making it ideal for this debate.

  3.  **Drafting - Section by Section:**

      *   **Title/Header:** Needs to look official. "Joint Statement on Representational Status..."
      *   **Introduction:** Briefly state who we are, the context (adversarial collaboration), and the specific model studied. Acknowledge the tension but emphasize the productive outcome.

      *   **Section 1: Points of Agreement (The Common Ground):**
          *   Need to focus on empirical facts that neither can deny.
          *   *Model facts:* Architecture, task, performance.
          *   *Observation facts:* The probe works, the SAE finds a feature, they align.
          *   *Predictive power:* Using this direction helps predict behavior or understand failures.
          *   *Robustness:* It's not random noise; it survives retraining seeds.
          *   *Causal link:* Intervening on this direction changes the output (crucial for both sides).

      *   **Section 2: The Disagreements Table:**
          *   Need to phrase the *topic* of disagreement neutrally.
          *   Then specify the Realist vs. Instrumentalist stance.
          *   *Disagreement 1: Ontology.* Does the feature exist independently of the observer?
          *   *Disagreement 2: Uniqueness.* Is this *the* representation or *a* representation?
          *   *Disagreement 3: Truth Conditions.* What makes the statement "This encodes angle" true?

      *   **Section 3: Cruxes & Experiments:**
          *   This is the hardest part. It needs to be actionable.
          *   *Crux 1 (Basis Independence):* If we rotate the space, does the "feature" move or disappear?
              *   *Realist:* It should be robust to rotations that preserve computation.
              *   *Instrumentalist:* It depends on the basis we choose to analyze.
              *   *Experiment:* Change the basis of analysis or apply a random orthogonal transform to the weights (if possible without breaking function) and see if the "feature" is still findable without re-supervision. *Correction:* You can't just rotate weights without retraining. Better experiment: Train with different seeds/initializations. Do they converge to the *same* subspace (Realist) or just functionally equivalent but geometrically distinct subspaces (Instrumentalist)?
          *   *Crux 2 (Causal Specificity):* If we ablate this direction, does the specific "angle" knowledge vanish, or just general performance?
              *   *Experiment:* Targeted ablation.
          *   *Crux 3 (Discovery vs. Invention):* If a new method finds a *different* basis that explains the same variance, is one "wrong"?
              *   *Experiment:* Compare SAE vs. PCA vs. Probes.

      *   **Section 4: Words vs. World:**
          *   Need a concluding assessment. Usually, in these debates, it's a mix. The *math* is the world, the *label* is the word. But the *geometry* is the world. Let's argue it's mostly about the world (geometry/causality) but dressed in semantic disagreement.

  4.  **Refining the Voice:**
      *   Avoid overly academic jargon where simple terms work, but keep the precision required for ML interpretability.
      *   Ensure the Instrumentalist doesn't sound like a solipsist (they agree the math works), and the Realist doesn't sound naive (they acknowledge the tools shape the view).
      *   Make sure the "Agreed Claims" are actually agreeable. An instrumentalist won't agree "The feature exists." They will agree "The probe achieves X accuracy."

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the SAE and Linear Probe specific detail? *Yes, ensure Section 1 mentions both.*
      *   *Check:* Is the "Crux" actually a crux? *If the experiment happens, does it change their mind?*
          *   *Refinement:* For the Instrumentalist, even if the geometry is robust, they might say "It's still just a useful map." The Realist needs a case where the feature exists *without* us looking for it.
          *   *Better Crux:* "Automatic Discovery." If an unsupervised method finds it without *any* human prior about angles, does that count as discovery? Realist: Yes. Instrumentalist: The method has priors.
          *   *Let's go with Robustness across Architectures.* If a completely different architecture (e.g., MLP vs Transformer) solves it with the same geometry, Realist says "Math forces this representation." Instrumentalist says "Math forces this function, representation is incidental."
          *   *Actually, let's stick to the prompt's specific model.* Let's focus on *Intervention*. If I edit the weights to remove this direction, does the model lose *only* modular arithmetic ability or something else?
          *   *Best Crux:* **Basis Invariance.** If we retrain the model with a symmetry-breaking constraint, does the "angle" direction persist?
      *   *Check:* Is the "Words vs World" conclusion honest? It's usually 20% words, 80% world in these specific technical debates.

  6.  **Final Polish:** Check formatting (tables, lists). Ensure the tone is "Joint Statement" not "My Essay." (Proceed to generate output based on these thoughts).

  *(Self-Correction on the "Crux" logic)*: A true crux must be something where the outcome would update the credence of *both* parties.
  *   *Idea:* If we find that the direction is *necessary* for the computation (causal), the Instrumentalist admits it's "real enough." If we find the direction is *one of many equally valid bases*, the Realist admits it's "basis-dependent."
  *   *Selected Crux:* **The "Rotation Test".** If we rotate the residual stream by a random orthogonal matrix *after* training (and adjust the unembedding accordingly to preserve function), does the "angle feature" rotate with it or stay put?
      *   *Wait, that's trivial.* If you rotate the space, the vector rotates.
      *   *Better:* **The "Seed Convergence" Test.** Train 100 models. Do they all learn *the same* direction (up to sign), or just *a* direction that works?
      *   *Realist Prediction:* High cosine similarity across seeds (The math forces *this* geometry).
      *   *Instrumentalist Prediction:* Low similarity, high functional equivalence (Many maps fit the territory).

  7.  **Finalizing the Document Structure:**
      *   Header.
      *   Preamble.
      *   Part I: Empirical Consensus.
      *   Part II: Ontological Disagreement (Table).
      *   Part III: Cruxes & Pre-Registered Experiments.
      *   Part IV: Assessment (Words vs. World).
      *   Signatures.

  8.  **Writing the Content:** (Drafting the text with attention to the specific constraints). *Make sure the Instrumentalist sounds rigorous, not dismissive.* *Make sure the Realist sounds scientific, not mystical.*

  *(Final check on constraints)*:
  *   Numbered list of claims? Yes.
  *   Disagreements table? Yes.
  *   Cruxes + Experiments + Predictions? Yes.
  *   Words vs World assessment? Yes.
  *   Specific case (Mod Add, Probe + SAE)? Yes.

