  The argument goes wrong in **the assumption that Douglass's principle commits him to the result described in Step (6)**.

  **Why the Argument Fails**
  The friend's *reductio ad absurdum* relies on an equivocation between **constitutional sanction** and **political concession**. Douglass's textualist principle (Steps 1–4) is designed to show that the Constitution does not *legally establish* slavery as a national institution or guarantee a federal right to "property in man." However, this legal conclusion does not require denying the historical reality that the Three-Fifths, Fugitive Slave, and Slave Trade clauses were *political compromises* made to accommodate slaveholding states.

  Douglass can consistently maintain that:
  1.  **Textually:** The Constitution does not use the word "slavery" or recognize humans as "property," so it confers no *right* to hold slaves (Step 5 is true regarding legal sanction).
  2.  **Historically:** These clauses were nevertheless concessions to the *fact* of slavery, granting slaveholders political advantages (Step 6's claim that they had "no proslavery character" is false).

  The friend's error is assuming that if the text does not *sanction* slavery as a principle, the clauses cannot be understood as having a *pro-slavery character* in practice. Douglass distinguishes between the Constitution as a *legal instrument* (which he argues is liberty-oriented) and the Constitution as a *political treaty* (which included concessions to slave power). His textualism protects the former without erasing the latter.

  **The Cost to Douglass**
  If Douglass rejects the friend's assumption (i.e., clarifies that his textualism does not deny the pro-slavery *political nature* of the compromises), he incurs a significant **rhetorical and strategic cost**:

  1.  **Loss of Moral Sanctity:** Douglass's strategy in 1860 was to persuade white Northerners by appealing to their reverence for the Founding Fathers. By admitting that the compromises were explicitly "pro-slavery" concessions (even if not constitutional sanctions), he undermines the narrative of the Founders as purely anti-slavery heroes. He is forced to concede that the Founders made deals with "the devil" of slavery, which complicates his appeal to patriotic originalism.
  2.  **Vulnerability to Garrisonians:** Douglass's main rival, William Lloyd Garrison, argued that because the Constitution *accommodated* slavery, it was a "covenant with death." If Douglass admits the clauses were pro-slavery concessions, he blurs the sharp line he draws between his position (the Constitution is an anti-slavery *tool*) and Garrison's (the Constitution is a pro-slavery *compact*). He must perform a delicate balancing act: admitting the history was tainted while insisting the law is clean. This requires a more sophisticated audience than the simple slogan "The word slavery is not in the Constitution!" allows.
  3.  **Weakened Certainty:** Douglass's textualism offers a clear, binary test: if the word isn't there, the right doesn't exist. Admitting that clauses can have a "pro-slavery character" without using the word "slavery" introduces ambiguity. It opens the door to interpreting other "plain" texts based on their political context, which weakens the rigid textualist shield he uses to protect his anti-slavery interpretation from pro-slavery theorists who argued the "context" clearly implied property rights.

  In short, to defeat the friend's argument, Douglass must sacrifice the moral purity of the Founding era to save the legal liberality of the Constitution.
