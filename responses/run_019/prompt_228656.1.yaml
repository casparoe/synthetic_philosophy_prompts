      *   **Shift the frame:** In General Relativity (GR), time travel isn't about "moving back"; it's about the shape of the universe allowing a path to return to its own past.
      *   **Address the "Logical Impossibility":** A contradiction implies the *scenario* is impossible, not necessarily the *geometry*.
