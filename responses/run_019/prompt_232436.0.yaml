answer: |-
  Your instincts are excellent. Your friend's summary captures the *spirit* of Galen Strawson's "Basic Argument" (often called the Impossibility Argument), but it blurs several crucial philosophical distinctions that Strawson is very careful to maintain. Specifically, the summary conflates **free will** with **ultimate moral responsibility**, and it treats a **metaphysical conclusion** as if it automatically dictates a **specific normative policy**.

  Here is a breakdown of what Strawson would accept, what he would correct, and how to evaluate the practical recommendation.

  ### 1. Free Will vs. Ultimate Moral Responsibility
  **Friend's Claim:** "Strawson showed that free will and moral responsibility are impossible..."
  **Strawson's View:** **Conflation.**

  Strawson is precise about terminology. He argues that **Ultimate Moral Responsibility (UMR)** is impossible. He is less committed to the claim that "free will" is impossible *simpliciter*, because "free will" is a contested term.
  *   **Compatibilists** define free will as the ability to act according to your desires without external coercion. Strawson admits we might have *this* kind of freedom.
  *   **Strawson's Target:** He argues that this compatibilist freedom is not enough to justify *true desert* (praise or blame). To truly deserve praise or blame, you must be the *ultimate source* of your actions.
  *   **Correction:** Strawson would say: "I have shown that the kind of free will required for *ultimate moral responsibility* is impossible." He leaves open the possibility that we have a weaker, compatibilist form of agency, but he insists that form cannot ground retributive justice.

  **Verdict:** Your doubt here is correct. The argument proves the impossibility of *ultimate responsibility*, not necessarily every definition of free will.

  ### 2. The Regress and *Causa Sui*
  **Friend's Claim:** "To be responsible for what you do, you have to be responsible for the kind of person you are... nobody can be the cause of themselves..."
  **Strawson's View:** **Accurate.**

  This is the accurate core of the Basic Argument. Strawson argues that to be responsible for an action, you must be responsible for the mental nature (character, motives, preferences) that produced the action. To be responsible for that nature, you must have chosen it. But to choose it, you must have had a *prior* nature that guided that choice. This leads to an infinite regress.
  *   Since humans cannot be *causa sui* (self-caused), we cannot be ultimately responsible.
  *   Strawson emphasizes this holds true **whether determinism is true or false**. If determinism is true, you are determined by the past. If indeterminism is true, your actions involve randomness, which does not grant you *control* or *responsibility*.

  **Verdict:** Your friend summarizes this step well, and your intuition that this is the persuasive core is shared by most philosophers who engage with the argument.

  ### 3. The Practical Recommendation (The "Disease" Leap)
  **Friend's Claim:** "...we should stop being retributive and start treating wrongdoing the way we treat disease."
  **Strawson's View:** **Non-Sequitur / Overstatement.**

  This is the biggest leap in your friend's summary. Strawson's argument is **metaphysical**, not **normative**.
  *   **The Gap:** Even if we accept that no one *ultimately deserves* punishment (metaphysical claim), it does not automatically follow that we must adopt a "disease model" (normative claim). There are other non-retributive justifications for punishment, such as deterrence, incapacitation, or moral education, which do not rely on ultimate desert.
  *   **Strawson's Caution:** Interestingly, Galen Strawson (unlike some hard incompatibilists like Derk Pereboom) is often cautious about prescribing social policy based solely on this argument. He acknowledges that while UMR is impossible, our **reactive attitudes** (feelings of resentment, gratitude, blame) are psychologically ingrained.
  *   **Psychological Inevitability:** Strawson often notes that even if we know UMR is impossible, we cannot simply turn off our human tendency to hold people responsible. We live in a "participant stance" (a term from his father, P.F. Strawson). Therefore, while retribution is *metaphysically unjustified*, it may be *psychologically unavoidable* in daily life.

  **Verdict:** You are right to see this as a leap. The argument undermines retributivism (punishment because they *deserve* it), but it does not logically mandate a specific alternative like the disease model. That requires additional ethical premises about the goal of justice (e.g., "the only goal of justice is rehabilitation").

  ### 4. Summary of Corrections
  If you were to correct your friend's summary to align strictly with Galen Strawson's published views, it would look like this:

  | Friend's Claim | Strawson's Actual Position | Status |
  | :--- | :--- | :--- |
  | "Free will is impossible." | "The kind of free will required for **Ultimate Moral Responsibility** is impossible." | **Conflation** |
  | "Determinism doesn't matter." | **Correct.** The argument works against both determinism and indeterminism. | **Accurate** |
  | "Nobody is responsible for anything." | "Nobody is **ultimately** responsible." (We may still be agents in a weaker sense). | **Overstatement** |
  | "Treat wrongdoing like disease." | "Retributive punishment is unjustified, but we cannot necessarily abandon reactive attitudes." | **Normative Leap** |

  ### Conclusion: Does the Recommendation Follow?
  Does the practical recommendation follow from the argument's accurate core? **No, not strictly.**

  1.  **Metaphysics $\neq$ Ethics:** Proving that desert is impossible removes the justification for *retribution*, but it does not prove that *consequentialist* measures (like quarantine, deterrence, or rehabilitation) are the only alternative.
  2.  **Psychology:** Strawson himself suggests that even if the argument is true, human beings are built to hold each other responsible. We might intellectually accept the Basic Argument while emotionally continuing to blame people. Strawson does not necessarily advocate for a radical overhaul of the legal system based solely on this; he is often more interested in the truth of the human condition than in policy reform.

  **Advice for your course:**
  You can confidently argue that your friend has correctly identified the **regress argument** (which is Strawson's main contribution) but has incorrectly extended it into a **policy prescription** that Strawson does not explicitly endorse. You can also sharpen the distinction between "free will" (capacity to choose) and "ultimate responsibility" (being the original source of the choice), which is the key to understanding why Strawson thinks the debate changes once this distinction is made.
