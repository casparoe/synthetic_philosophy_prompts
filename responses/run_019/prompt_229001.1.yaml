  ### 1. Two Distinct Decision Rules

  Based on your supervisor's five past verdicts, we can derive two distinct decision rules that are logically consistent with her entire track record.

  **Rule A: The "Feasible Protection" Principle (Consequentialist)**
  *   **Logic:** Military intervention is justified if and only if: (1) there is an *ongoing, acute* threat to civilian life; (2) the proposed military action is *feasible* and likely to halt that specific threat; and (3) the operation is *limited* to civilian protection without pursuing broader political objectives (like regime change) that risk strategic instability.
  *   **Consistency Check:**
      *   *Kosovo:* Acute threat (Yes), Feasible (Yes), Limited aim (Yes). **Support.**
      *   *Iraq:* Acute threat (No - retrospective), Feasible protection (No). **Oppose.**
      *   *Libya:* Initial (Acute/Feasible/Limited). Expansion (Political/Instability). **Support/Oppose.**
      *   *Rwanda:* Acute threat (Yes), Feasible (Yes, retrospectively). **Support.**
      *   *Syria:* Acute threat (No - attacks over), Feasible protection (No). **Oppose.**
  *   **Prediction for Kessovia:**
      *   *Enclave Protection:* **Support.** (Acute threat to refugees, feasible/low cost, limited scope).
      *   *Regime Change:* **Oppose.** (High risk of nuclear escalation, exceeds "protection" scope into political transformation).

  **Rule B: The "Supreme Emergency" Exception (Deontological/Legalist)**
  *   **Logic:** Intervention without Security Council authorization is unlawful and generally prohibited, *unless* the situation constitutes a clear, undeniable genocide (the "Rwanda Standard"). If that threshold is met, intervention is obligated regardless of legal or strategic barriers. If the threshold is not met, standard legal/strategic constraints apply.
  *   **Consistency Check:**
      *   *Kosovo:* Treated as a "justified" exception due to ethnic cleansing severity, despite illegality. **Support.**
      *   *Iraq:* No genocide/emergency exception triggered. **Oppose.**
      *   *Libya:* UNSC mandate existed (Legal). Expansion violated mandate logic. **Support/Oppose.**
      *   *Rwanda:* Clear genocide triggered the exception/obligation. **Support.**
      *   *Syria:* No clear genocide/emergency (attacks over). **Oppose.**
  *   **Prediction for Kessovia:**
      *   *Enclave Protection:* **Ambiguous/Oppose.** (Genocide is "contested," UNSC vetoed. Without clear genocide, the veto may hold).
      *   *Regime Change:* **Oppose.** (Genocide is contested, not "undeniable"; nuclear risk reinforces the standard constraint).

  ### 2. Best Prediction and Rationale

  **Prediction:**
  Your supervisor will **support the limited enclave-protection operation** but **oppose the expanded regime-change operation.**

  **Reasoning:**
  I believe she is primarily running **Rule A (The "Feasible Protection" Principle)**. While Rule B explains her legal qualms, her record suggests she prioritizes *consequences* and *scope* over strict legalism when lives are at stake.

  1.  **The Kosovo Precedent:** In 1999, she supported an operation she explicitly admitted was "unlawful." This demonstrates that for her, the absence of Security Council authorization is not a hard veto (as Rule B might suggest) if the humanitarian necessity is acute. In Kessovia, the Regional Organization's mandate likely serves as a sufficient functional substitute for UNSC approval for a limited protection mission, mirroring the NATO-led Kosovo model.
  2.  **The Regime Change Red Line:** Her opposition to Iraq (2003), the expansion of Libya (2011), and Syria (2013) reveals a consistent heuristic: she rejects interventions where the humanitarian casus belli is disconnected from the military objective (Iraq/Syria) or where the objective expands from protection to political engineering (Libya). The Kessovia regime-change option explicitly requires removing the government and risks war with a nuclear patron. This triggers her "strategic instability" concern seen in her Syria and Iraq verdicts.
  3.  **Feasibility:** She opposed Syria partly because strikes would not "protect civilians." In Kessovia, the enclave operation is judged "feasible at low cost," fitting her Kosovo/Libya-Initial profile. The regime-change option is judged high-risk and likely to expand the war, fitting her Iraq/Libya-Expansion profile.

  Therefore, she will likely argue that the enclave operation is a "Kosovo-style" necessary exception to save lives, while the regime-change operation is an "Iraq-style" strategic overreach that endangers more people than it saves.

  ### 3. Underdetermination and Key Features

  While the prediction above is robust, her past verdicts genuinely **underdetermine the verdict on the Enclave Protection operation** regarding the **Security Council Veto.**

  The single feature of the Kessovia case doing the most work here is the **"Contested" nature of the Genocide.**
  *   If the situation were universally acknowledged as *Genocide* (like Rwanda), her record suggests she would support intervention even against a UNSC veto and potentially even against the nuclear patron's wishes (Rule B's "Obligation").
  *   If the situation were acknowledged as *Not Genocide* (like Iraq 2003), she would likely defer to the UNSC veto and oppose even the enclave mission.
  *   Because it is **contested**, she has discretion. She must decide whether the "400,000 displaced and several thousand killed" meets the *Kosovo* threshold (justified exception) or the *Syria* threshold (insufficient to bypass great power deadlock). Her verdict on the enclave hinges entirely on whether she classifies Kessovia as a "Kosovo" (acute emergency) or a "Syria" (ambiguous crisis).

  ### 4. Discriminating Hypothetical Case

  To definitively discriminate between **Rule A (Feasible Protection)** and **Rule B (Supreme Emergency Exception)**, you should present her with the following hypothetical:

  **The Case:** *The Republic of Aethel.*
  *   **Situation:** The government is violently suppressing a separatist movement. 50,000 civilians are displaced, and hundreds are killed monthly (Acute Humanitarian Crisis, but *not* Genocide).
  *   **Authorization:** The Security Council is deadlocked by a veto. No Regional Organization mandate exists.
  *   **Military Plan:** A limited no-fly zone to protect displaced persons is **feasible**, **low cost**, and carries **no risk** of escalation with a nuclear power.

  **Discrimination:**
  *   **Rule A (Feasible Protection)** predicts **SUPPORT.** The action saves lives, is feasible, limited, and carries no strategic risk. The lack of UNSC mandate is secondary to the utility (consistent with Kosovo).
  *   **Rule B (Supreme Emergency)** predicts **OPPOSE.** The "Genocide Exception" is not triggered (only "suppression"), and without UNSC or Regional mandate, the intervention remains unlawful and unjustified (consistent with a strict reading of her Iraq/Syria legalism).

  Her response to *Aethel* would reveal whether she is ultimately a **consequentialist** who intervenes when it works (Rule A), or a **principled exceptionalist** who intervenes only when the moral crime is absolute (Rule B).
