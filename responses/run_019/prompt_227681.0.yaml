answer: |-
  The only principle that respects your intuitions without collapsing into relativism or presentism is the Principle of Accessible Moral Critique, though it forces you to accept that future generations may rightly condemn our meat-eating.

  Here are three candidate principles tested against your cases, leading to the settled view.

  **Candidate 1: The Epistemic Possibility Principle**
  *Precision:* An agent is blameworthy only if the factual consequences of their actions were knowable given the science of their time.
  *Motivation:* Saves the Medieval Surgeon (Case 2) and explains why we don't blame people for unintended consequences.
  *Verdicts:*
  *   **Surgeon:** Excused (germs unknowable).
  *   **Jefferson:** Condemned (suffering visible).
  *   **Peasant:** Condemned (wife's suffering visible).
  *   **Failure:** This collapses your distinction between Jefferson (Case 1) and the Peasant (Case 3). Both saw suffering. If "knowable" means "observable harm," the peasant is blameworthy. If "knowable" means "moral framework available," this principle is too vague on its own. It saves the surgeon but fails to split the moral agents from the embedded conformists.

  **Candidate 2: The Cultural Conformity Principle**
  *Precision:* An agent is blameworthy only if they violated the dominant moral norms of their own society.
  *Motivation:* Saves the Peasant (Case 3) and the Roman Father (Case 6) by acknowledging they followed the rules of their world.
  *Verdicts:*
  *   **Peasant:** Excused (normative).
  *   **Roman Father:** Excused (legal/normative).
  *   **Jefferson:** Excused (slavery was normative in Virginia).
  *   **Failure:** This fails your hardest cases. Jefferson (Case 1) and the Factory Owner (Case 4) both operated within societies where their actions were largely legal and common. If conformity excuses, Jefferson slips out, and you lose the ability to condemn historical evils that were socially sanctioned. It saves the peasant but sacrifices Jefferson.

  **Candidate 3: The Accessible Moral Critique Principle (Settled)**
  *Precision:* An agent is blameworthy if a coherent moral critique of their practice was *socially intelligible* and *actionable* within their linguistic and social community, and they rejected it to preserve their own advantage.
  *Motivation:* This splits Jefferson from the Peasant based not on "books nearby" but on whether a live alternative worldview existed that they could have adopted without social suicide.
  *Verdicts on Your Cases:*
  *   **Jefferson (Case 1):** Condemnable. Abolitionist arguments were intelligible in Enlightenment discourse; he had the agency to manumit (actionable); he rejected this for economic/social comfort.
  *   **Surgeon (Case 2):** Not blameworthy. No intelligible critique of hygiene existed (germ theory wasn't just unknown, it was unimaginable).
  *   **Peasant (Case 3):** Not blameworthy. A critique of patriarchy was not socially intelligible in a 13th-century village; acting against it would be seen as insanity, not morality.
  *   **Factory Owner (Case 4):** Condemnable. Reformers made the critique intelligible; paying wages was actionable; rejection was for profit.
  *   **Aristotle (Case 5):** View wrong, man not bad. The critique was intelligible (some Sophists), but as a theorist describing *physis* (nature), he wasn't necessarily preserving personal privilege in the same way a slaveholder is. We can condemn the theory without condemning the character.
  *   **Roman Father (Case 6):** Not blameworthy. While some Stoics questioned exposure, it was not a socially intelligible moral imperative for a paterfamilias; rejecting it would threaten the family's economic survival.

  **Predictions for New Cases:**
  *   **5th Century BC Athenian Democrat:** Excused. While some dissent existed, the concept of universal human rights was not socially intelligible; slavery was constitutive of their democracy.
  *   **Today's Fast Fashion Buyer:** Condemnable (with nuance). The critique is highly intelligible and actionable (buy less, buy ethical), but structural constraints matter. If the principle focuses on *individual* action, they are blameworthy; if it accounts for *structural* lack of alternatives (poverty), blame mitigates.
  *   **1690 Witchcraft Judge:** Not blameworthy. While skeptics existed (e.g., Reginald Scot), the epistemic framework of witchcraft was dominant. If they sincerely believed the metaphysics, the moral critique wasn't fully intelligible to them as *justice* vs. *murder*.

  **The Cost: Future Generations and Meat**
  Does this commit you to thinking future generations are right to condemn us for eating meat? **Yes.**
  The ethical critique of industrial animal agriculture is currently intelligible (philosophically robust) and actionable (plant-based alternatives exist). If future generations view speciesism as akin to racism, our failure to adopt the critique despite its availability makes us blameworthy by this principle. You must accept that moral progress renders past privileges vicious in retrospect; if you find this unacceptable, you must weaken the principle to "Dominant Norms," which forces you to excuse Jefferson.

  **Which Verdict to Drop?**
  If you cannot live with the meat conclusion, you must tighten "Accessible" to "Dominant Consensus." But doing so forces you to **drop the condemnation of Jefferson.** You cannot have it both ways: you cannot condemn Jefferson for ignoring minority abolitionist voices while excusing ourselves for ignoring minority vegan voices. The principle is consistent; the discomfort is the price of moral realism. If you must drop one verdict to save your conscience, drop the condemnation of the 1840 Factory Owner instead of Jefferson, arguing that structural economic coercion limits "actionability" more than Jefferson's personal debt did—but this is a weaker distinction. The strongest philosophical line holds Jefferson, the Factory Owner, and the Modern Meat-Eater in the same category of blameworthy agents.
