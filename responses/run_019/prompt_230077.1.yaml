      *   *Audience:* Science/design readers love typography + cognitive science. It's a classic combo (e.g., *The Psychology of Reading*).
      *   *Verdict:* Interesting, provided it doesn't just rehash *Gödel, Escher, Bach* or *Surfaces and Essences*. The ML critique is the value-add.

  7.  **Identify Expert Wince Points:**
