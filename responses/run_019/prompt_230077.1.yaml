      *   *Source:* Hofstadter's *Letter Spirit* project.
      *   *Extension:* Critique of current ML (vision/LLMs) – do they learn roles/style or just texture/stats?
      *   *Goal:* Show letterforms as a test case for concept learning.

  3.  **Address Question 1: Feature-List Strawman?**
      *   *Cognitive Science Context:* Classical categorization (necessary and sufficient conditions) *is* largely dead in psychology (Rosch's prototype theory, exemplar theory).
      *   *Nuance:* However, in *computational* vision and some ML contexts, feature-based approaches (SIFT, HOG, early CNN layers) are still effectively "feature lists."
      *   *Verdict:* It's a strawman in *psychology* but a valid target in *engineering/ML*. The essay needs to clarify this distinction so it doesn't look like the journalist hasn't read Rosch (1970s).
      *   *British English Check:* "Categorisation," "behaviour," "modelling."

  4.  **Address Question 2: Letter Spirit & Role Networks?**
      *   *Hofstadter's Work:* *Letter Spirit* is about grid-based glyphs and "quanta" of style. It posits a "deep level" of abstract roles.
      *   *Critique:* Hofstadter is often seen as philosophical/poetic rather than empirically rigorous in cognitive science. His "roles" are intuitive but hard to formalize.
      *   *Verdict:* It supports the argument *philosophically*, but empirical evidence for "role networks" in human perception is mixed. Connectionist models (PDP) do something similar but distributed. Don't over-claim Hofstadter as settled science.
      *   *Wince Point:* Typographers might argue that specific shapes *do* carry load (e.g., the aperture of the 'a' is crucial for legibility).

  5.  **Address Question 3: ML Connections?**
      *   *Current State:* CNNs are texture-biased (Geirhos et al.). Transformers attend to patches. Do they understand "roles"? Not really. They understand statistical co-occurrence.
      *   *Generative AI:* Diffusion models *do* learn style constraints to some extent (concept sliders, LoRA), but is it "role-based"? Debatable.
      *   *Verdict:* The critique is valid but needs nuance. Don't say they learn *nothing* about structure. Say they learn structure *implicitly* via statistics, whereas humans seem to do it *explicitly* via roles.
