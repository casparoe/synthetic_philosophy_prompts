answer: |-
  Yes, there is a single principle that saves all your verdicts. It is a refined version of the idea you were groping toward, often discussed in moral philosophy as the **Principle of Unresolved Normative Hypocrisy**.

  To make it precise enough to handle Dave's two cases and the others, we need to define two specific conditions: **Normative Identity** and **Moral Resolution**.

  ### The Principle of Unresolved Normative Hypocrisy

  **An agent lacks the standing to blame another person if and only if:**
  1.  **Normative Identity:** The agent's own wrongdoing violates the *same core moral norm* as the wrongdoing they are blaming (not just "bad behavior" generally, but the specific value being breached, e.g., honesty, fidelity, safety).
  2.  **Unresolved Status:** The agent has not morally resolved their own violation through appropriate means (such as confession, restitution, reform, or repentance).

  If either condition is missing—if the norms are different, or if the blamer has fixed their own wrong—they retain standing.

  ### How It Saves Your Verdicts

  *   **Ben (No Standing):** Matches **Normative Identity** (both are infidelity/betrayal of marital vows) and **Unresolved Status** (by never telling her, his deception is ongoing; he has not made amends).
  *   **Priya (Has Standing):** Matches **Normative Identity** (infidelity), but fails **Unresolved Status**. She confessed and they rebuilt; the wrong was morally resolved, restoring her standing.
  *   **Teenager (Has Standing):** Matches **Normative Identity** (shoplifting/property rights), but fails **Unresolved Status**. They felt awful and stopped (repentance and reform), resolving the past wrong.
  *   **Dave Case B (No Standing):** Matches **Normative Identity** (tax cheating/civic honesty) and **Unresolved Status** (he brags about it, indicating no repentance or reform).
  *   **Dave Case A (Has Standing):** Fails **Normative Identity**. Drunk driving violates norms of *public safety and non-endangerment*. Embezzlement violates norms of *fiduciary trust and property*. Because the core values breached are different, Dave's driving does not undermine his standing to blame theft.

  ### The New Case: Expense Reports vs. Car Accident

  **The Scenario:** A man padded expense reports for years (never caught) vs. a neighbor lying about a car accident.

  **Application:**
  1.  **Normative Identity:** Both acts are violations of **financial honesty and fraud**. While the victims differ (employer vs. insurance company/other driver), the core moral norm being breached is the same: do not lie to secure money you are not entitled to. This is much closer than Dave's drunk driving vs. embezzlement; it is functionally equivalent to Dave's tax cheating case.
  2.  **Unresolved Status:** The man padded reports for years and was never caught. There is no indication of confession, restitution, or reform. The wrongdoing is effectively ongoing or at least unaddressed.

  **Verdict:** According to the principle, **he does not have standing to blame the neighbor.** His unaddressed commitment to financial dishonesty undermines his authority to condemn the same vice in another.

  ### Is Any Verdict Cheap to Give Up?

  Strictly speaking, the principle above saves all five of your original verdicts without contradiction. However, in moral philosophy, the "cheapest" verdict to give up—the one most vulnerable to theoretical pressure—is **Dave Case A (Drunk Driving vs. Embezzlement).**

  **Why?**
  Your intuition relies on a sharp distinction between "Safety/Recklessness" and "Trust/Property." However, many philosophers argue that habitual drunk driving demonstrates a **general disregard for the rule of law and the welfare of others** that corrodes *general* moral authority, not just specific authority.

  If a critic argued that "serious criminal negligence undermines standing to blame *any* serious moral failing," Dave Case A would be the first to fall. It is the only case where you grant standing despite the blamer being a *habitual* offender of a serious public norm. By contrast, your other verdicts rely on the much clearer distinctions of "Same vs. Different Norm" (Dave B) or "Resolved vs. Unresolved" (Ben/Priya/Teen). If you ever feel the pressure to harmonize your view with a "General Moral Character" theory, Dave's ability to blame the embezzler is the most expendable intuition.
