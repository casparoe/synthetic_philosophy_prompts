answer: |-
  Good morning. Welcome to the Department of Statistics. For those of you I haven't met yet, I'm [Name].

  Looking around this room, I see a somewhat volatile mixture. We have methodologists who spend their lives worrying about error rates, psychologists who have spent their careers building theories on top of data, and journalists whose job is to tell the public which of those theories are actually true. Usually, these groups meet at press conferences or in retractions. Here, we are trying to meet in the middle of the process.

  I want to begin by invoking a ghost. Not a malicious one, but a warning one. R. A. Fisher.

  In *The Design of Experiments*, Fisher made a statement that is often quoted but rarely obeyed. He wrote that no isolated experiment, however significant its results, can by itself demonstrate a natural phenomenon. His reasoning was cold and mathematical: a chance result that ought to occur rarely will still occur with its proper frequency across repeated attempts. If you define "significant" as a 1-in-20 event, then in the long run, 1-in-20 of your significant results are noise. Fisher's conclusion was that scientific knowledge does not reside in the single study. It resides in the *method of verification* over time.

  I want to propose that this workshop is necessary because we have spent the last decade trying to solve a Fisherian problem with non-Fisherian solutions.

  To the psychologists in the room: I know the frustration. You ran an experiment. The effect was striking. The $p$-value was 0.03. You published. Five years later, it doesn't hold up. The narrative that followed was often one of moral failure. Sloppiness. Questionable research practices. Sometimes, yes. But Fisher's constraint suggests something more uncomfortable. It suggests that even if you did everything perfectly—no p-hacking, no HARKing, pristine lab conditions—an isolated significant result is still just a lottery ticket that happened to win. It is not proof. It is a suggestion that warrants expensive further investigation. The crisis is not that you were sloppy; the crisis is that the institution of science treats the lottery win as the jackpot.

  To the journalists: This is why your job is so difficult. You are asked to report on isolated experiments as if they are established facts. When a headline reads "Study Proves X," it is committing a category error. Fisher told us that a single study cannot prove X. It can only say that X is worth looking at again. When we treat the singular as the universal, we guarantee a replication crisis.

  Now, to my colleagues in methodology, both Frequentist and Bayesian. This is where I need you to listen closely, because I am not offering you a truce. I am offering you a shared problem that neither of your standard toolkits fully resolves.

  The Frequentists here know that $p$-values describe the long-run behavior of the test, not the probability that the specific hypothesis is true. You know Fisher's warning better than anyone. Yet, the academic incentive structure demands that you treat the specific instance as the general truth. You are asked to make a binary decision—reject or fail to reject—on a single dataset, and then that decision is cemented as knowledge. You are being asked to act as if the "long run" has already happened after only one iteration.

  The Bayesians here might argue that this is why we need priors. If we properly weight the prior probability of a phenomenon, a single significant result won't swing the posterior so wildly. But Fisher's constraint bites here, too. If the likelihood function is derived from an experiment that is underpowered or noisy, no amount of prior sophistication can fully rescue the inference. Furthermore, where do those priors come from? They come from previous isolated experiments, which are subject to the same Fisherian constraint. If the foundation is built of sand, a better architectural blueprint doesn't make it stone.

  So, we have a stalemate. The Frequentists are guarding error rates in a system that demands certainty. The Bayesians are updating beliefs based on data that may be structurally ephemeral. And the result is that we are all arguing about the calculation, while ignoring the structure.

  This brings me to why this is a crisis of *inference*, not merely of conduct. If the problem were just fraud, we could fix it with policing. If it were just sloppiness, we could fix it with checklists. But Fisher's insight tells us that the problem is inherent to the logic of induction under uncertainty. We are trying to extract universal laws from particular instances, and probability theory explicitly tells us that this extraction is never complete in a single step.

  The replication crisis is the bill coming due for ignoring that limit. We have built a career system, a funding system, and a publishing system that rewards the *discovery* of the isolated effect, rather than the *verification* of the phenomenon. We reward the lottery win. We do not reward the auditing of the lottery machine.

  This is why I am not going to stand here and tell you that pre-registration is the savior. It helps. It aligns the analysis with the design. But a pre-registered isolated experiment is still an isolated experiment. A registered report is still a single data point in the history of a phenomenon.

  I am not going to tell you that switching to Bayesian estimation solves it. A posterior distribution based on a single noisy study is still a distribution centered on noise.

  And I am certainly not going to tell you that we just need to be more rigorous. Rigor is a virtue, but it is not a method of aggregation. You can be rigorously wrong about the stability of an effect if you treat one study as the final word.

  So, what are we doing here for the next two days?

  We are here to confront what is genuinely hard. It is hard to build a system that values the second, third, and tenth study of a phenomenon as much as the first. It is hard to convince funding agencies to pay for verification when verification doesn't look like novelty. It is hard to explain to the public that science is a process of narrowing uncertainty, not a sequence of breakthrough announcements.

  For the methodologists: I challenge you to stop designing tools that optimize the single study. Design tools that optimize the *sequence* of studies. How do we meta-analyze in real-time? How do we quantify the stability of an effect across labs, not just the significance within a lab? Give us a mathematics of aggregation that is as sophisticated as our mathematics of isolation.

  For the psychologists: I challenge you to resist the temptation to claim you have found a "phenomenon" after one successful experiment. Frame your work as Fisher intended: as an invitation for verification, not a declaration of truth. This is professionally risky. I know that. But it is intellectually necessary.

  For the journalists: I challenge you to change the vocabulary. Stop asking "Is this true?" after one study. Start asking "How much does this shift the weight of evidence?"

  We are not here to solve the replication crisis in ten minutes, or in two days. We are here to acknowledge that Fisher was right, and we have been wrong. We have been trying to build a cathedral of knowledge using bricks that were only meant to be scaffolding.

  The hard truth is this: Replication is not a failure of science. It is the mechanism of science. The crisis is that we stopped viewing it as a mechanism and started viewing it as a verdict.

  Over the next two days, I ask that we avoid the easy reassurances. Let us not pretend that better software or clearer guidelines will fix a structural epistemological problem. Let us argue about the hard things. Let us argue about how to incentivize the boring work of verification. Let us argue about how to communicate uncertainty without inducing paralysis.

  Fisher told us that a chance result will occur with its proper frequency. We have let those chance results accumulate into a literature that is now trembling under its own weight. It is our job, in this room, to figure out how to bear that weight without collapsing into cynicism or retreating into dogma.

  Thank you. Let's get to work.
