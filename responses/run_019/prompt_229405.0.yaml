          *   Against the *summary's* description? Yes, because the summary describes a view that sounds like it violates Pareto.
      *   **Conclusion:** Summary is useful for laypeople but technically flawed on the two most critical distinctions (Pareto efficiency and LDO immunity).

  9.  **Refining the "Proportional Drop" point:**
