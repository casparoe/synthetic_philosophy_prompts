      *   *Concept: "Contingent"*
          *   Physics equivalent: Dependent on initial conditions/parameters. Could have been otherwise (different coupling constants, different vacuum state).
      *   *Concept: "Necessary Being"*
          *   Physics equivalent: A state or law that *cannot* be otherwise. A unique vacuum? A unique solution to the wavefunction of the universe?
          *   Problem: Physics deals with models. "Necessity" is modal, not empirical.

  4.  **Drafting the Translations (Iterative Refinement):**

      *   *KCA Translation:*
          1.  Any state with a finite past boundary requires a prior dynamical input or boundary condition.
