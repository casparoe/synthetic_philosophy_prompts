          3.  Therefore, the current configuration requires an explanation in terms of a broader state space or selection mechanism.
          4.  (The Leap) This chain terminates at a state/law fixed by symmetry or mathematical consistency alone (no free parameters).

  5.  **Analyzing the "Residue" (The Mismatch):**
      *   *Causal Principle:* In physics, "cause" is local (light cones). Extending it to the universe itself is a category shift.
      *   *Actual Infinite:* Physicists treat infinities as signaling "theory breakdown." KCA treats them as "ontologically impossible." This is a crucial divergence.
      *   *Necessary Being:* Physics has no "necessity" in the metaphysical sense. Laws are descriptive. A "unique solution" is the closest analog, but it's still a model.
      *   *Contingency:* In physics, this maps to "free parameters" or "symmetry breaking."

  6.  **Addressing the Specific Questions:**
