      *   **User Persona:** Working physicist, no formal philosophy training.
      *   **Vocabulary:** Initial conditions, dynamical laws, symmetries, conservation laws, vacuum, arrow of time. Skeptical of metaphysical terms like "necessary being" (views them as category mistakes).
