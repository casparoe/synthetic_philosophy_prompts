answer: |-
  To legitimately invoke Gödel outside mathematics, you must prove the target system is a consistent, recursively axiomatizable formal system capable of encoding elementary arithmetic, a burden almost all popular arguments fail to meet.

  ### 1. Mathematical Preconditions (Non-Negotiable)
  These are hard constraints of the theorem itself; if any are missing, the theorem does not apply, and the argument is mathematically void.

  *   **Formal Syntax:** The target must operate on defined symbols and manipulation rules independent of meaning (syntax over semantics).
      *   **Why:** Gödel numbering relies on mapping syntactic strings to numbers; without discrete syntax, there is nothing to encode.
      *   **Status:** **Non-Negotiable.**
  *   **Recursive Axiomatizability:** There must be an algorithmic procedure to decide whether any given statement is an axiom of the system.
      *   **Why:** If you cannot mechanically list the rules, you cannot construct the self-referential "liar" sentence required for the proof.
      *   **Status:** **Non-Negotiable.**
  *   **Consistency:** The system must not derive contradictions (specifically, it must be $\omega$-consistent or simply consistent depending on the variant used).
      *   **Why:** In an inconsistent system, everything is provable, so no statement is "unprovable."
      *   **Status:** **Non-Negotiable.**
  *   **Arithmetic Strength:** The system must be sufficiently strong to represent primitive recursive arithmetic (essentially, basic number theory).
      *   **Why:** Weak systems (like Presburger arithmetic) are complete; incompleteness only emerges once the system is complex enough to encode its own syntax via numbers.
      *   **Status:** **Non-Negotiable.**

  ### 2. Interpretive Bridge Premises (Non-Negotiable for Validity, Often Debate Preferences)
  These premises connect the math to the real-world target. They are logically required for the argument to hold, but their truth is often where the debate lies.

  *   **Target Isomorphism:** You must demonstrate that the target (mind, physics, AI) is structurally identical to the formal system described above.
      *   **Why:** The theorem applies to formal systems, not neurons, particles, or silicon chips unless they are proven to instantiate such a system.
      *   **Status:** **Debate Preference.** (Materialists may argue minds are formal systems; dualists deny it. Physicists debate if nature is axiomatic.)
  *   **Truth vs. Provability Distinction:** You must maintain that "true" means something distinct from "provable within the system."
      *   **Why:** Gödel shows a sentence is *true* (in the standard model) but *unprovable* (in the system); if you define truth as merely provability, the result vanishes.
      *   **Status:** **Non-Negotiable for Logic.** (Ignoring this reduces the argument to a definition error.)
  *   **Agent vs. System Distinction:** You must distinguish the limits of the *formal system* from the limits of the *agent* using it.
      *   **Why:** A system being incomplete does not mean the user cannot know the truth via outside reasoning; conflating the two commits the "fallacy of composition."
      *   **Status:** **Debate Preference.** (Penrose assumes humans stand outside the system; skeptics argue humans are bound by it.)

  ### 3. Where Popular Uses Die
  *   **The Human Mind (Lucas-Penrose Argument):** Dies on **Recursive Axiomatizability** and **Target Isomorphism**. There is no evidence human thought is generated by a finite, decidable set of axioms; if the mind is not a formal system, Gödel does not apply. If the mind *is* a formal system, the argument fails to prove we can see the truth of the Gödel sentence without assuming we are inconsistent.
  *   **Physics (Theory of Everything):** Dies on **Arithmetic Strength** and **Formal Syntax**. Physical theories model continuous quantities and empirical data, not necessarily number theory; a "ToE" might be complete because it lacks the arithmetic complexity required for incompleteness, or because nature is not an axiomatic system.
  *   **AI Rationality:** Dies on **Agent vs. System Distinction**. Showing an AI (a formal system) cannot prove its own consistency does not mean it is "irrational," only that consistency proofs require a stronger meta-system; this is a feature of logic, not a bug of intelligence.
