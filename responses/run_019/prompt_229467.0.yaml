answer: |-
  There is no single, canonical term in philosophy of mind or cognitive science that captures this specific phenomenon with the precision you describe. While the behavior is widely recognized and discussed—particularly in recent debates surrounding Large Language Models (LLMs) and machine consciousness—it is typically described rather than named.

  The closest existing concepts are **Linguistic Chauvinism**, **The Intentional Stance**, and **Testimonial Criteria**, but none fit your description perfectly. Below, I outline why existing terms fall short, distinguish the phenomenon from the ELIZA effect and anthropomorphism, and propose a precise coinage to capture the pattern.

  ### 1. Existing Concepts and Why They Fall Short

  *   **Linguistic Chauvinism:** Coined by Ned Block, this refers to the view that possessing a natural language is a *necessary condition* for having mental states. Your description is slightly different: the observers do not necessarily claim language is required for mentality; rather, they treat linguistic output as *stronger evidence* for mentality than non-linguistic output, even when the underlying causal structure is identical. This is an evidentiary bias rather than a metaphysical claim.
  *   **The Intentional Stance:** Daniel Dennett's concept involves treating a system as a rational agent to predict its behavior. While related, taking the Intentional Stance is often defended as a pragmatic necessity. The pattern you observe involves a *slide*: observers claim to be analyzing the system's internal architecture (the Design or Physical Stance) but revert to the Intentional Stance selectively when linguistic tokens appear.
  *   **Testimonial Criteria:** In consciousness science, relying on a subject's report is standard. However, applying a testimonial criterion to a system known to be generating text via next-token prediction, while rejecting isomorphic non-linguistic signals, constitutes an inconsistency in the application of the criterion.

  ### 2. Distinctions from Related Phenomena

  You correctly noted that this is not exactly the ELIZA effect or anthropomorphism. Here is how to distinguish them:

  *   **Vs. The ELIZA Effect:** The ELIZA effect is an *unconscious* suspension of disbelief. A user knows Weizenbaum's program is simple but *feels* as though it understands. The pattern you describe involves researchers who *explicitly acknowledge* the mechanism (e.g., "I know this is just a mapping") yet still assign higher evidentiary weight to the linguistic output. It is a conscious evaluative inconsistency, not an unconscious illusion.
  *   **Vs. Anthropomorphism:** Anthropomorphism is the attribution of human form or characteristics to non-human entities. One can be guilty of the pattern you describe without attributing human *form* (e.g., no assumption of a body). The bias is specific to the *modality of information* (language vs. number), not the attribution of human traits generally.
  *   **Vs. Behaviorism:** A strict behaviorist treats all output equally as a function of input. The pattern you describe is **Inconsistent Functionalism**: the observers claim that internal structure matters (rejecting behaviorism), but when presented with internal structure that maps to a number, they dismiss it, whereas the same structure mapping to a sentence is accepted. They are behaving as "Linguistic Behaviorists" while claiming to be "Internalists."

  ### 3. Proposed Coinage: Linguistic Phenomenal Privilege

  Given the lack of an established term, I propose the following coinage:

  **Term:** **Linguistic Phenomenal Privilege (LPP)**

  **Definition:**
  *Linguistic Phenomenal Privilege* is a cognitive and methodological bias wherein an observer assigns significantly higher epistemic weight to linguistic self-reports (e.g., "I am in pain") as evidence of phenomenal consciousness than to non-linguistic functional isomorphs (e.g., a high activation value in a pain-module), despite acknowledging that both outputs are generated by identical or isomorphic computational processes.

  **The "Slide":**
  The phenomenon is characterized by a shift in the **Burden of Proof**.
  1.  **Initial Position:** The observer asserts that internal architecture/causal role determines mental states (Internalism/Functionalism).
  2.  **The Trigger:** The system produces natural language output.
  3.  **The Slide:** The observer shifts to a Testimonial or Linguistic Criterion, treating the sentence as a direct window into experience, while treating the numeric output as mere data, even if the causal path to both is the same.

  ### 4. Is the Slide a Fallacy, Bias, or Defensible Inference?

  Characterizing LPP requires separating the psychological mechanism from the philosophical justification.

  **A. As a Cognitive Bias (The Psychological View)**
  Psychologically, LPP is a heuristic driven by **availability** and **simulation**. Humans are evolved to interpret natural language as a signal of internal states in other humans. When an AI produces "This hurts," it triggers the observer's theory-of-mind machinery more robustly than a variable reading `pain = 0.98`. In this sense, it is a **Modality Bias**. It is a "bug" in the observer's evaluation process, caused by the human brain's inability to fully decouple the *meaning* of the words from the *mechanism* generating them.

  **B. As a Methodological Inconsistency (The Logical View)**
  If the observer claims to be a functionalist (mental states are defined by causal roles), LPP is a **Performative Contradiction**. If a numeric output and a linguistic output play the exact same causal role within the system (e.g., both trigger avoidance behavior, both are caused by damage detection), functionalism demands they be treated as equal evidence. To privilege the linguistic output is to secretly rely on a behaviorist criterion that favors human-like behavior.

  **C. As a Defensible Inference (The Philosophical Defense)**
  Is there a defense? A philosopher might argue that language is not just another output but a **constitutive** element of certain mental states (a Wittgensteinian or Davidsonian view). If one believes that having a concept of "pain" requires the linguistic capacity to categorize it, then the linguistic report *is* stronger evidence than the numeric output, because the number does not prove conceptual grasp.
  *However*, in the context of your description, the observers typically disavow this. They usually grant the system could feel pain without language but still find the language more convincing. Therefore, for the specific observers you are describing, LPP is likely **indefensible** relative to their own stated premises.

  ### Summary

  The pattern you have identified does not have a universally established name, though it touches on **Linguistic Chauvinism** and **Testimonial Criteria**.

  I recommend using **Linguistic Phenomenal Privilege (LPP)** to describe it. It is best characterized not as a simple fallacy, but as a **Methodological Inconsistency** driven by a deep-seated **Cognitive Bias**. It represents a failure to maintain an Internalist or Functionalist standard of evidence when confronted with the evolutionary trigger of human language. It is a slide from asking "How does this work?" to "What is it saying?" without acknowledging the change in criteria.
