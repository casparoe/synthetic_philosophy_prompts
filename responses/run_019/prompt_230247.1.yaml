  2.  **Determine the Bottom Line:**
      *   What is the core truth about using Gödel outside math?
      *   *Draft:* Most extra-mathematical uses of Gödel fail because they cannot establish that the target system meets the strict formal criteria required for the theorem to apply.
      *   *Refinement:* For a Gödelian argument to hold outside mathematics, the target system must be rigorously demonstrable as a consistent, recursively axiomatizable formal system capable of expressing elementary arithmetic, a condition almost no physical or mental phenomenon satisfies.

  3.  **Identify the Theorem's Actual Conditions (The "Math" Side):**
      *   Gödel's First Incompleteness Theorem (G1) applies to:
          1.  **Formal System:** A set of symbols and rules for manipulation (syntax).
          2.  **Recursively Axiomatizable:** There must be an algorithm to decide if a statement is an axiom.
          3.  **Consistent:** No contradictions can be derived (no statement $P$ such that both $P$ and $\neg P$ are provable).
          4.  **Sufficiently Strong:** Capable of representing primitive recursive arithmetic (enough to encode self-reference via Gödel numbering).
      *   *Note:* Completeness vs. Consistency trade-off.

  4.  **Identify the Bridge Premises (The "Application" Side):**
      *   To apply G1 to $X$ (Mind, AI, Physics), one must argue:
          1.  $X$ is equivalent to/is modeled by a formal system $F$.
          2.  $F$ meets conditions 1-4 above.
          3.  The "truth" in the domain of $X$ corresponds to provability in $F$.
          4.  The "knowledge/capacity" of $X$ corresponds to the set of theorems in $F$.

  5.  **Identify Skipped Steps/Usual Failures:**
      *   Equating "truth" with "provability" (semantic vs. syntactic).
      *   Assuming consistency without proof (G1 assumes consistency; if inconsistent, everything is provable).
      *   Assuming the system is fixed/static (brains evolve, physics theories change).
      *   Assuming the system is recursively axiomatizable (human intuition might not be algorithmic).
      *   Confusing "unprovable in system $F$" with "unknowable by agent $A$."

  6.  **Categorize Requirements (Non-negotiable vs. Debate Preferences):**
      *   *Non-negotiable:* Formal structure, recursive axiomatizability, consistency, arithmetic strength. These are mathematically required for G1 to hold.
      *   *Debate Preferences/Interpretive:* What counts as "truth" in physics, whether the mind is closed under deduction, whether "knowing" equals "proving."

  7.  **Evaluate Specific Targets (Mind, AI, Physics):**
      *   *AI (Digital Computer):* Meets formal system criteria. But G1 doesn't imply irrationality, just limits on formal proof within that specific system. Can always extend the system.
      *   *Mind (Lucas-Penrose):* Fails on "recursively axiomatizable." Human math production isn't shown to be a fixed algorithm. Also assumes human consistency (humans contradict themselves).
      *   *Physics (Theory of Everything):* Fails on "formal system." Physical reality isn't a set of syntactic strings. A theory *of* physics is formal, but reality isn't bound by the theory's incompleteness necessarily (unless reality *is* the theory).

  8.  **Drafting the Content (Iterative refinement for constraints):**
