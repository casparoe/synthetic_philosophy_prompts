answer: |-
  For any non-mathematical argument invoking Gödel to be logically valid rather than metaphorical, it must rigorously demonstrate that the target phenomenon constitutes a consistent, recursively axiomatizable formal system capable of encoding elementary arithmetic, a burden of proof almost universally unmet in philosophy and physics.

  ### 1. Theorem Conditions (The Math Gate)
  These are non-negotiable mathematical prerequisites. If the target system does not satisfy these, Gödel's Incompleteness Theorems (GIT) do not apply.

  *   **Formal Syntax:** The system must operate on discrete symbols governed by explicit syntactic rules, independent of meaning.
      *   **Why:** GIT is a theorem about syntax and derivability, not semantics or physical causality.
      *   **Status:** **Non-negotiable.**
  *   **Recursive Axiomatizability:** There must be an effective procedure (algorithm) to decide whether any given statement is an axiom of the system.
      *   **Why:** Gödel numbering requires the set of axioms to be computably enumerable; if you can't algorithmically list the rules, you can't construct the self-referential Gödel sentence.
      *   **Status:** **Non-negotiable.**
  *   **Consistency:** The system must not prove contradictions (i.e., it cannot prove both $P$ and $\neg P$).
      *   **Why:** GIT assumes consistency; if a system is inconsistent, it proves everything (triviality), and incompleteness vanishes. GIT does not *prove* consistency; it requires it as a premise.
      *   **Status:** **Non-negotiable.**
  *   **Arithmetic Strength:** The system must be strong enough to represent primitive recursive arithmetic (essentially, basic number theory).
      *   **Why:** Weak systems (like Presburger arithmetic) are complete; incompleteness only arises when the system is complex enough to encode self-reference via arithmetic.
      *   **Status:** **Non-negotiable.**

  ### 2. Bridge Premises (The Application Gate)
  These are the philosophical or empirical claims required to map the math onto the real-world target. Most are highly contested.

  *   **Identity Claim:** The target (mind, physics, AI) is accurately modeled as a single, fixed formal system $F$.
      *   **Why:** GIT applies to $F$, not to reality directly. If the target is not $F$, the theorem is irrelevant.
      *   **Status:** **Non-negotiable for validity** (but often where arguments fail).
  *   **Truth-Provability Equivalence:** "Truth" in the target domain corresponds to "provability" within $F$.
      *   **Why:** GIT distinguishes truth from provability. If the target's "knowledge" isn't bound by formal proof, incompleteness doesn't limit it.
      *   **Status:** **Debate Preference.** (Platonists accept this; empiricists often reject it).
  *   **Closure Claim:** The target's capacity is limited to the theorems derivable within $F$.
      *   **Why:** If the target can step outside $F$ to adopt new axioms (as mathematicians do), the limitation is temporary, not fundamental.
      *   **Status:** **Debate Preference.** (Critical for Lucas-Penrose arguments against AI).
  *   **Consistency Assurance:** The target system is demonstrably consistent.
      *   **Why:** Since GIT assumes consistency, arguing a mind or physics is "incomplete" requires assuming it isn't contradictory.
      *   **Status:** **Non-negotiable** (but practically impossible to prove for minds/physics).

  ### 3. Failure Points by Target
  Here is where popular uses die based on the requirements above.

  *   **The Human Mind (Lucas-Penrose Argument):**
      *   **Claim:** Humans can see the truth of the Gödel sentence that a machine cannot, so minds are not machines.
      *   **Failure Point:** **Recursive Axiomatizability & Consistency.**
      *   **Reason:** There is no evidence the human mind operates via a fixed, finitely specifiable algorithm. Humans contradict themselves (inconsistent) and evolve their logical rules over time (not a fixed formal system). If the mind isn't a recursively axiomatizable system, GIT doesn't apply.
  *   **Artificial Intelligence (Digital Computers):**
      *   **Claim:** AI can never be fully rational or complete because of GIT.
      *   **Failure Point:** **Closure Claim.**
      *   **Reason:** While AI runs on formal systems that meet GIT criteria, incompleteness does not imply irrationality or incapacity. An AI can be extended to a stronger system $F'$ that proves the old Gödel sentence. The limitation is relative to a specific static system, not to intelligence generally.
  *   **Physics (Theory of Everything):**
      *   **Claim:** A complete Theory of Everything is impossible because physical laws will be incomplete.
      *   **Failure Point:** **Formal Syntax & Identity Claim.**
      *   **Reason:** Physical reality is not a set of syntactic strings; it is a causal structure. A *theory* of physics is formal, but reality itself is not bound by the provability limits of the theory describing it. Furthermore, it is unknown if physical laws require arithmetic strength sufficient for GIT.
  *   **General Truth (Postmodern/Philosophical):**
      *   **Claim:** Some truths are unprovable full stop, so objective truth is inaccessible.
      *   **Failure Point:** **Truth-Provability Equivalence.**
      *   **Reason:** GIT shows there are statements undecidable *within a specific system*. It does not prove they are undecidable in *all possible systems* or absolutely unknowable. It is a limit on formalization, not a limit on truth itself.
