prompt: |-
  I keep seeing Gödel dragged into arguments way outside mathematics — that AI can't be fully rational, that the mind isn't a machine, that physics can't have a theory of everything, that some truths are just unprovable, full stop — and half the time the person has only borrowed the word incompleteness. Before I evaluate any of these, I want the full spec: what does an argument that invokes Gödel outside math have to get right for the appeal to do real work rather than just be a vivid analogy? Give me the requirements list — the theorem's actual conditions (a formal system, recursively axiomatizable, consistent, able to represent enough arithmetic), the bridge premises needed to get from a theorem about formal systems to a conclusion about minds, machines, or physical theories, and the usual skipped steps — with why each is a requirement, and mark which are non-negotiable and which are just preferences of a particular debate. If a requirement can't be met for a given target (say, a human capacity that isnt a finitely specified formal system), say which one and whether any popular use dies on it. Lead with your bottom line in the first sentence, then give the list and reasoning. No preamble, no restating the question.
