  *Re-reading carefully:* "In five of our six clinics... Yet when the figures are pooled... Programme A comes out ahead". "Programme A was chosen disproportionately at our two specialist sports-injury clinics".
  *Interpretation:* There are 6 clinics total. 2 are sports specialists. 4 are general.
  *Data:* B > A in 5 clinics. This likely means B > A in the 4 general + 1 sports clinic. A > B in 1 sports clinic.
  *Or:* The "5 of 6" refers to the administrative divisions. The "2 specialist" might be a subset description.
  *Actually, it doesn't matter for the logic.* The core is: Stratified = B wins mostly. Pooled = A wins. Reason = Confounding (Patient Type).
  *Logic holds:* Stratified is the causal truth. Pooled is the biased association.

