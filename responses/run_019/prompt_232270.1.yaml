prompt: |-
  Act as an expert in formal epistemology, specifically accuracy-first epistemology and epistemic utility theory. Think carefully and avoid survey-style generality: I want a precise conceptual explanation.

  I am a PhD student working through the foundations of accuracy-first arguments for probabilism, and I want to understand the relationship between ascription universality and epistemic dominance. As I understand it, ascription universality says, roughly, that a genuinely epistemic norm applies to all agents regardless of their evaluative attitudes toward accuracy. Epistemic dominance, by contrast, supports norms by showing that a credence function is dominated by another relative to every member of some specified class of legitimate accuracy measures. The dominance argument for probabilism treats that class as fixed: if different agents were permitted to score accuracy in different ways, the same credence function could be dominated for one agent but not for another, and the norm would lose its universal character.

  Please explain the conceptual fault line here. In particular: what exactly must be universal—the scoring rule, the set of admissible scoring rules, or only the norm that dominance reasoning is supposed to underwrite? What happens to the dominance argument if we allow agents to favor different strictly proper scoring rules? Is there a coherent position that accepts ascription universality but denies that any single scoring rule is rationally required, and if so, what kind of epistemic norm can it still ground? I am less interested in proof details than in mapping the conceptual space clearly and identifying where the real theoretical pressure is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** PhD student in philosophy/epistemology.
      *   **Topic:** Formal Epistemology, specifically Accuracy-First Epistemology and Epistemic Utility Theory (EUT).
      *   **Specific Focus:** The relationship between *Ascription Universality* and *Epistemic Dominance* in arguments for Probabilism.
      *   **Constraint:** "Think carefully and avoid survey-style generality." "I want a precise conceptual explanation." "Less interested in proof details than in mapping the conceptual space clearly and identifying where the real theoretical pressure is."
      *   **Key Questions to Answer:**
          1.  What exactly must be universal (scoring rule, set of rules, or the norm)?
          2.  What happens to the dominance argument if agents favor different strictly proper scoring rules?
          3.  Is there a coherent position accepting Ascription Universality but denying a single required scoring rule? What norm does it ground?

  2.  **Deconstruct the Core Concepts:**
      *   **Accuracy-First Epistemology:** The view that accuracy (closeness to the truth) is the fundamental epistemic value.
      *   **Epistemic Utility Theory (EUT):** Assigns utility values to credence functions based on their accuracy relative to the world.
      *   **Dominance Argument for Probabilism:** If a credence function is non-probabilistic, there exists a probabilistic function that is strictly more accurate (has higher epistemic utility) regardless of which world is actual, *given a specific class of accuracy measures*.
      *   **Ascription Universality:** Epistemic norms apply to an agent in virtue of their epistemic situation, not their contingent goals or values. (Joyce's term). If $C$ is irrational for $S$, it's irrational regardless of $S$'s non-epistemic desires.
      *   **The Tension:** Dominance relies on a specific measure (or class of measures) of accuracy. If accuracy measures are subjective (agent-relative), dominance might not hold universally. If accuracy measures are objective (fixed), does that violate the spirit of subjective credences?

  3.  **Address Question 1: What must be universal?**
      *   *The Norm:* Definitely the norm (e.g., "Be Probabilistic"). Ascription universality demands the norm applies regardless of the agent's attitudes.
      *   *The Scoring Rule:* This is the crux. Joyce (1998, 2009) argues for a *class* of legitimate scoring rules (strictly proper, continuous, etc.). He doesn't pick *one* (like Brier score) as the *only* legitimate one.
      *   *The Set:* The *set* of admissible measures must be fixed objectively. If Agent A thinks Brier is the only measure and Agent B thinks Log is the only measure, and they have different dominance relations, universality fails.
      *   *Conclusion:* The *legitimacy conditions* on the scoring rules must be universal. The specific rule used to calculate utility in a decision problem might vary, but for a *normative* argument, the set of rules relative to which dominance is established must be common to all agents.

  4.  **Address Question 2: What if agents favor different strictly proper scoring rules?**
      *   *Scenario:* Agent A uses Brier ($B$). Agent B uses Log ($L$). Both are strictly proper.
      *   *Dominance:* De Finetti's theorem (and Joyce's generalization) shows that for *any* strictly proper scoring rule, non-probabilistic credences are dominated by probabilistic ones.
      *   *The Catch:* This works for Probabilism. It might *not* work for other norms (e.g., Conditionalization, or specific credal values).
      *   *The Pressure:* If the goal is just Probabilism, varying proper rules doesn't break the argument because the geometric structure of the probability simplex ensures dominance for the whole class.
      *   *The Deeper Issue:* If we move beyond Probabilism (e.g., to Principal Principle or Reflection), the choice of scoring rule matters immensely. If agents can pick their own "epistemic values" (scoring rules), then epistemic rationality becomes instrumental rationality relative to those values. This threatens Ascription Universality. If I don't care about the Brier score, why does Brier-dominance bind me?
      *   *Resolution:* The EUT proponent must argue that *all* strictly proper scoring rules capture the *same* underlying epistemic value (accuracy). If they are just different metrics for the same value, dominance relative to *all* of them is required.

  5.  **Address Question 3: Coherent position accepting Universality but denying single rule?**
      *   *Yes:* This is essentially Joyce's position (and Pettigrew's).
      *   *The Norm:* It grounds "Weak Probabilism" or "Class Probabilism." You must be probabilistic because *no matter which legitimate measure of accuracy you use*, you are dominated if you aren't.
      *   *The "Real Theoretical Pressure":* The pressure shifts from "Why this rule?" to "Why this *class*?"
      *   *The Problem of Extension:* If the class is too broad, dominance results vanish. If too narrow, it looks dogmatic.
      *   *The Problem of Individuation:* Are different proper scoring rules just different units of measurement (like meters vs. feet) or different values (like truth vs. error avoidance)? If the latter, Ascription Universality is threatened because an agent might value truth-avoidance differently than error-avoidance (Leitgeb/Pettigrew discussions).

  6.  **Synthesize and Structure the Argument:**
      *   **Introduction:** Define the tension precisely. Dominance is a mathematical relation relative to a measure; Universality is a normative status independent of attitudes.
      *   **The Locus of Universality:** It's not the specific rule, but the *admissibility conditions*. The set of legitimate measures $\mathcal{S}$ must be objective.
      *   **The Dominance Argument's Stability:** Explain why Probabilism survives agent-relative rule selection (because *all* proper rules agree on Probabilism), but note where it fractures (norms beyond Probabilism).
      *   **The "Epistemic Value" Monism vs. Pluralism:** This is the deep philosophical pressure point. If scoring rules represent different trade-offs (e.g., risk aversion regarding truth), then allowing agent choice turns epistemic rationality into instrumental rationality. To save Ascription Universality, one must argue that strictly proper rules are merely representational variants of a single underlying epistemic value structure.
      *   **The Coherent Position:** "Robust Dominance." The norm is: "Adopt a credence function that is not dominated relative to *any* admissible accuracy measure." This preserves universality without fixing a single rule.
      *   **Conclusion:** Summarize the fault line. It lies in the justification of the *class* of measures, not the measures themselves.

  7.  **Refine the Tone:**
      *   Avoid "Some philosophers say..."
      *   Use precise terminology (admissibility, representational invariance, instrumental vs. constitutive).
      *   Focus on the *structure* of the argument.
      *   Ensure the distinction between *evaluative attitudes* (which Ascription Universality excludes) and *epistemic values* (which EUT defines) is clear.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I need to be careful not to conflate "scoring rule" with "utility function." In EUT, the scoring rule *is* the epistemic utility function.
      *   *Nuance:* Joyce's 1998 argument didn't require a single rule, but it required the norm to hold for *all* legitimate rules. This is "Strong Justification."
      *   *Nuance:* The user asks about agents *favoring* different rules. If an agent *favors* a rule that isn't strictly proper, EUT says they are epistemically irrational. If they favor a different *strictly proper* rule, does it matter? For Probabilism, no. For updating norms, yes. I need to highlight this distinction.
      *   *Key Insight:* The threat to Ascription Universality isn't that agents pick different proper rules; it's if the justification for the norm depends on the agent *caring* about that rule. The EUT move is to say accuracy is the *only* epistemic goal. The scoring rule measures that goal. If the goal is fixed, the measure must track it.

  9.  **Final Polish:** Check against the prompt's specific questions one last time.
      *   What must be universal? (The admissibility criteria).
      *   What happens if agents favor different proper rules? (Probabilism holds, other norms might not).
      *   Coherent position? (Yes, Robust Dominance/Class Probabilism).
      *   Where is the pressure? (Justifying the class of admissible measures without smuggling in pragmatic/evaluative attitudes).

  10. (Drafting response based on these points.)
answer: |-
  The conceptual fault line you have identified lies in the distinction between the **objectivity of epistemic value** and the **relativity of epistemic measurement**. To resolve this, we must distinguish between the *norm* being justified, the *mathematical relation* (dominance) doing the justifying, and the *parameters* (scoring rules) relative to which that relation holds.

  Here is the precise mapping of the conceptual space.

  ### 1. The Locus of Universality: Admissibility Conditions, Not Specific Rules

  You ask what exactly must be universal: the scoring rule, the set of admissible rules, or the norm.

  **The Norm:** Ascription Universality (AU) demands that the norm itself (e.g., "Be Probabilistic") applies to an agent in virtue of their epistemic situation, independent of their non-epistemic goals or their contingent attitudes toward accuracy.

  **The Scoring Rule:** Accuracy-first epistemology (specifically the Joycean tradition) does **not** require that a single specific scoring rule (e.g., the Brier score) is universally binding. Requiring a single rule would be implausibly dogmatic, as different rules encode different sensitivities to distance from the truth (e.g., penalizing extreme error more heavily).

  **The Set of Admissible Rules:** This is the critical locus. For AU to hold, the **criteria for admissibility** must be universal. There must be an objective fact of the matter about which functions count as legitimate measures of *epistemic* utility.

  If the set of admissible scoring rules $\mathcal{S}$ were agent-relative (i.e., Agent $A$ can legitimately adopt $s_1 \in \mathcal{S}$ while Agent $B$ adopts $s_2 \notin \mathcal{S}$ because they "value" accuracy differently), then epistemic rationality collapses into instrumental rationality relative to subjective epistemic values. This would violate AU. Therefore, the **class of legitimate accuracy measures** must be fixed objectively for all agents.

  ### 2. The Stability of Dominance Under Rule Variation

  You ask what happens to the dominance argument if we allow agents to favor different strictly proper scoring rules. This depends on whether we are arguing for Probabilism or for more specific norms (like Conditionalization).

  **For Probabilism:** The dominance argument is **robust** to variation within the class of strictly proper scoring rules.
  *   **Theorem:** If $c$ is non-probabilistic, there exists a probabilistic $c^*$ such that $c^*$ strictly dominates $c$ relative to **every** strictly proper scoring rule.
  *   **Implication:** It does not matter which specific proper rule an agent "favors" or which one is the "true" measure of accuracy. As long as the agent is bound by *any* legitimate epistemic utility function (which must be strictly proper to respect the truth-directedness of belief), non-probabilistic credences are dominated.
  *   **Result:** AU is preserved. The norm applies regardless of which specific proper metric captures the agent's accuracy, because the dominance relation holds across the entire admissible class.

  **For Norms Beyond Probabilism:** The argument becomes **fragile**.
  *   If we attempt to derive norms for belief revision (Conditionalization) or specific credal values (e.g., the Principal Principle), dominance results often depend on the specific functional form of the scoring rule (e.g., additivity, differentiability, or specific risk profiles).
  *   **The Fault Line:** If Agent $A$ uses a Brier-like measure and Agent $B$ uses a Log-like measure, they might agree on Probabilism but disagree on whether a specific update rule is dominant. If the "correct" update norm depends on which proper scoring rule is the *true* measure of accuracy, and there is no fact of the matter about which proper rule is the true one, then the norm loses its universal force.

  ### 3. A Coherent Position: Robust Dominance and Epistemic Value Monism

  Is there a coherent position that accepts AU but denies a single required scoring rule? **Yes.** This is the standard Joycean/Pettigrewian position. It grounds a norm of **Robust Probabilism**.

  **The Position:**
  1.  **Epistemic Value Monism:** Accuracy is the sole fundamental epistemic good.
  2.  **Representational Invariance:** Different strictly proper scoring rules are not different *values*; they are different *representations* or *scales* of the same underlying value structure. Just as measuring temperature in Celsius vs. Fahrenheit does not change the thermal facts, measuring inaccuracy via Brier vs. Log does not change the epistemic facts, provided both are strictly proper.
  3.  **The Norm:** A credence function is epistemically irrational if it is dominated relative to **all** admissible scoring rules. (Or, stronger: if it is dominated relative to **any** admissible scoring rule, though the former is the standard Joycean requirement for Probabilism).

  **How this preserves AU:**
  The norm does not depend on the agent's *attitude* toward the scoring rule. The agent does not get to "choose" their scoring rule based on their preferences. Rather, the scoring rules are fixed by the nature of epistemic value itself. The agent is bound by the norm because they are an epistemic agent, and this is what epistemic value requires.

  ### 4. Where the Real Theoretical Pressure Lies

  The pressure is not on the dominance mathematics; it is on the **justification of the admissibility class**.

  **The Problem of Individuation:**
  To maintain AU, you must argue that all strictly proper scoring rules are merely "notational variants" of a single epistemic value. However, different proper rules encode different trade-offs between **Truth-Aim** (getting close to 1 when true) and **Error-Avoidance** (getting close to 0 when false).
  *   The Log score penalizes assigning 0 to a truth infinitely; the Brier score does not.
  *   If these represent genuinely different axiological trade-offs, then an agent who cares more about avoiding extreme error than maximizing truth-proximity might rationally prefer Brier over Log.
  *   **The Threat:** If agents can rationally prefer different trade-offs based on their "epistemic risk attitudes," then epistemic rationality is no longer universal; it is relative to the agent's epistemic risk profile. This violates AU.

  **The Pressure Point:**
  The accuracy-first theorist must argue that **epistemic risk attitudes are not rationally permissible.** They must claim that there is a single, objective way to value accuracy that all rational agents must share, even if that value can be represented by multiple mathematical functions.

  If they fail to do this, the dominance argument for Probabilism remains secure (since all proper rules agree there), but the project of expanding accuracy-first epistemology to other norms (updating, evidence, etc.) collapses into a form of epistemic relativism where norms are conditional on the agent's chosen accuracy measure.

  ### Summary of the Conceptual Map

  1.  **Universality:** Applies to the **criteria of admissibility** for scoring rules, not the specific rule instance.
  2.  **Dominance Stability:** Holds for Probabilism across all strictly proper rules; fails for more specific norms unless the admissible class is narrowed.
  3.  **Coherent Position:** **Robust Dominance.** A credence is irrational if dominated across the board. This requires treating proper scoring rules as representational variants of a single value.
  4.  **Theoretical Pressure:** The burden is on proving that **epistemic value is monistic** enough that different proper scoring rules do not represent incompatible axiological commitments. If different proper rules represent incompatible values, Ascription Universality is untenable for any norm beyond Probabilism.

  The fault line is ultimately metaphysical: Is "Accuracy" a single, determinate property that admits of multiple measurements, or is it a determinable that admits of different determinates (risk profiles) which agents might legitimately instantiate differently? Accuracy-first epistemology requires the former to sustain Ascription Universality.
