      *   *Of the Balance of Trade:* Focuses on specie-flow mechanism, but also argues against hoarding and for the benefits of trade surplus leading to money inflow.
      *   *Of Interest:* "Nothing is more usual... than to hear people complain of the dearness of money... but they should consider that the rate of interest depends on the demand and supply of loanable funds, not the quantity of money." This is the user's Achilles' heel.
      *   *Modern Macro Translation:* Short-run non-neutrality (Phillips Curve-ish, sticky prices/wages) vs. Long-run neutrality (Classical Dichotomy). The user is arguing Hume anticipates the short-run trade-off and advocates for *inflation targeting* (slow, steady expansion).

  3.  **Brainstorm Fault Lines:**
      *   *Exposed:* "Of Interest" explicitly decouples money stock from real interest rates. If money doesn't affect interest, does it affect investment? If it doesn't affect investment, where does the growth come to?
