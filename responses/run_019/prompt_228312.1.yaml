      2.  *Grumpy Smith Scholar:* You're making Hume a interventionist. He was a skeptic. You're projecting modern stabilization policy onto a mercantilist critic.
      3.  *Modern Macro:* Where are the expectations? If agents know prices will rise, the interval vanishes (Lucas Critique avant la lettre).
