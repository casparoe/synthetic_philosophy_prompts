answer: |-
  This is a fantastic philosophical standoff. You are witnessing a clash between two of the greatest skeptics of causal power in history: **David Hume** (18th-century Scotland) and **Abu Hamid al-Ghazali** (11th-century Persia).

  They sound identical on the surface because they use the same weapons (empiricism, the invisibility of "power"), but they are building very different houses.

  Here is the breakdown of your friend's position, her likely verdict on the healer case, and the specific follow-up that will force her to reveal her hand.

  ### 1. Diagnosis: Is she Humean or Occasionalist?

  She is almost certainly an **Occasionalist channeling al-Ghazali**, but she is using **Humean epistemology** to get there.

  *   **The Humean:** Says there is no necessary connection *anywhere*. Causation is a psychological habit. We see A, then B, enough times that our brain creates a feeling of "must." There is no "oomph" in the world, and there is no "oomph" in God. It's just regularity + human expectation.
  *   **The Occasionalist (al-Ghazali):** Agrees there is no "oomph" in *created things* (fire, balls, arms). However, they insist there **is** real "oomph" in the world—it just belongs exclusively to God. Created things are merely "occasions" for God to act.

  **Why she leans Ghazali:**
  You mentioned you were arguing about *al-Ghazali*. The specific examples she uses (fire/cotton, billiard balls) are the exact examples Ghazali uses in *The Incoherence of the Philosophers*. Ghazali's point wasn't that "nothing causes anything," but that "only God causes anything." If she were a pure Humean, she would say *nothing* has power. If she is a Ghazalian, she says *created things* lack power, but *Divine Will* is the ultimate power.

  ### 2. The Healer Case: What will she say?

  **The Case:** A healer prays, a fever breaks instantly. One-off. No pattern.

  **The Humean Verdict:**
  A strict Humean will be skeptical. For Hume, our idea of causation is built on *constant conjunction*. If there is no pattern (no prior instances of this prayer working), we have no empirical basis to call it a cause. A Humean would likely say: *"This is a coincidence. To call it causation is superstition because it violates the uniform experience of how fevers break."*

  **The Occasionalist (Ghazali) Verdict:**
  This is the home-field advantage for your friend. Ghazali explicitly allows for miracles (*kharq al-‘adah*, or "the breaking of habit"). Since fire doesn't *really* burn cotton (God usually makes it burn when fire touches cotton), God can choose to make cotton cool when fire touches it.
  She will likely say: *"God chose to heal the patient at that occasion. The prayer didn't have power, and the biology didn't have power, but God acted directly. The lack of pattern proves it wasn't nature; it was Will."*

  **Prediction:**
  If she accepts the healer case as a **real causal event** (despite the lack of regularity), she is an **Occasionalist**.
  If she dismisses it as **coincidence** (because of the lack of regularity), she is a **Humean**.

  Given her enthusiasm for Ghazali, bet on her accepting it as a miracle.

  ### 3. The Tie-Breaker Case

  If she hedges on the healer case (e.g., "Well, maybe God did it, but we can't know"), you need to find out where she thinks the "order" of the universe comes from.

  The fundamental difference is this:
  *   **Hume:** The "glue" of the universe is in **our minds** (psychological expectation).
  *   **Ghazali:** The "glue" of the universe is in **God's will** (ontological consistency).

  **The Follow-Up Case: "The Last Human"**

  > **Ask her this:** "Imagine the last human being on earth dies. There are no minds left to observe anything. A volcano erupts and melts a rock.
  >
  > **Question:** Did the lava *cause* the rock to melt? Or was it just a sequence of events with no 'causation' attached?"

  **Why this settles it:**

  *   **If she says "No real causation, just sequence":** She is a **Humean**.
      *   *Reasoning:* For Hume, causation is a category of human understanding. Without a mind to form habits and expectations, there is no causation, only brute facts.
  *   **If she says "Yes, real causation occurred":** She is an **Occasionalist**.
      *   *Reasoning:* For Ghazali, causation is the active Will of God. God is still present even if humans aren't. The lava didn't melt the rock; God melted the rock on the occasion of the lava. The causal power is ontological (real in the world/God), not psychological (in the mind).

  ### Summary Strategy

  1.  **Throw the Healer Case:** If she calls it a miracle (God acting outside habit), she's Ghazali. If she calls it a coincidence (lack of data), she's Hume.
  2.  **Throw the Last Human Case:** If she says causation disappears without observers, she's Hume. If she says causation remains (because God remains), she's Ghazali.

  **One warning:** Be prepared for her to say, "Both Hume and Ghazali agree that *observable* power is an illusion." That is true. Your job is to press her on what lies *behind* the illusion: **Human Psychology** (Hume) or **Divine Agency** (Ghazali). That is the fault line.
