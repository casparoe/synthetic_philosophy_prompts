      *   **The Structuralism vs. Quine Conflict (2 vs. 3+4).**
          *   Ante Rem Structuralism (Shapiro) is often motivated by the need to avoid reducing numbers to sets, but it posits "structures" as abstract objects.
          *   Quine (4) is famously parsimonious. He accepts sets (via NF or ZFC as useful) but is wary of "structures" as distinct ontological categories if they aren't reducible to sets.
