      *   *Recommendation:* Drop or significantly weaken (4) and modify (3). Move towards a "Mathematical Naturalism" or "Rationalist Realism" where math justifies itself, rather than relying on physics. This aligns (1), (2), (5), and (6).

  7.  **Drafting the Audit:**

      *   *Tone:* Professional, analytical, audit-style. No lecturing.
