      *   Single change for most coherence? Yes.
      *   No lectures? Keep it focused on the logic of the set.

      *(Self-Correction during drafting)*: Make sure to distinguish between Ante Rem Structuralism and Quinean Naturalism clearly. Quine is a realist about sets, but his criterion is scientific indispensability. Shapiro (Ante Rem) is a realist about structures, often justified by mathematical practice itself. The clash is on the *criterion* for existence.

      *Severity Ranking:*
