          *   *Best Fix:* Modify (4). Allow that mathematical justification can be internal to mathematics, not just via physics. This keeps (1), (2), (5), (6) intact. It requires downgrading (3).

  8.  **Final Review against Constraints:**
      *   Audit the set? Yes.
