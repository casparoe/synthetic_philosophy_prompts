  What the theorem actually licenses:
  Good's Theorem states that for a single Bayesian agent facing a fixed decision problem, the expected value of sample information is non-negative. If you can observe a signal before acting, and that signal is costless, your expected utility cannot decrease by looking at it. The critical assumptions are that the information is truly free—meaning no time, attention, or opportunity cost—and the agent updates beliefs rationally without cognitive load. Furthermore, the decision context must be non-strategic, with no opponents who react to your knowledge. The theorem compares the expected utility of acting *after* seeing the signal versus acting *now*, averaging over all possible signal outcomes. It does not guarantee every specific piece of information will help, only that the *procedure* of looking before leaping is optimal in expectation, provided the looking itself consumes no resources that could have been used elsewhere. Crucially, it is an ex ante claim about expectations, not an ex post guarantee of satisfaction, and it relies on the agent having the option to ignore the information if it proves irrelevant.

  The survivors:
  Claim 1 ("Never avoid free information") and Claim 4 ("Science/tests in expectation worth it") are the only ones that survive scrutiny, provided you enforce the definition of "free." Claim 1 ranks highest because it is the direct behavioral translation of the theorem: if a piece of data costs nothing and could change your mind, ignoring it is literally leaving utility on the table. In practice, this licenses checking a reference line item or a contract clause if it takes seconds, but it does not license three weeks of forum reading. Claim 4 ranks second because it correctly identifies that experimentation, like a job trial or probation period, has positive expected value *if* the cost of the test is accounted for in the utility calculation. These two change your behavior by encouraging low-cost verification while forcing you to explicitly price the "test." They rank high because they align with the math without ignoring the resource constraints that define real life. You should take them seriously as a check against ignoring obvious, cheap data, but not as a mandate to maximize data volume. The practical license is narrow: use them to justify quick checks, not deep dives. They serve as a shield against ignoring red flags, not a sword for endless research. Effectively, they demand you treat information gathering as a purchase: if the price is zero, buy it; if the price is time, budget it.

  The overrated rest:
  Claims 2, 3, 5, and 6 collapse under real-world friction. Claim 2 ("Default to one more datapoint") is the engine of your paralysis; while EVSI is non-negative, marginal *net* benefit turns negative once search costs exceed decision improvement. Claim 6 ("Stopping is secondary") inverts reality: because information is never truly free, determining when to stop is the primary decision problem, not finding more data. Claim 3 ("No ex post regret") confuses ex ante expectation with ex post experience; you can absolutely regret learning truth that causes pain without changing the outcome, violating the utility stability assumption. Claim 5 ("Strategic settings") fails because in negotiations, knowing too much can limit your bargaining power or signal weakness to adversaries, making information negatively valuable in game-theoretic contexts. These claims should not change your behavior because they rely on assumptions—zero cost, single agent, emotional neutrality—that are violated in your job search. Following them justifies hoarding rather than deciding. They are overrated because they sound rigorous but ignore the binding constraints of time and psychology. In your specific case, Claim 6 is the most harmful, as it suggests your current struggle is a search problem rather than a stopping problem.

  What would change my mind:
  I would reorder this list if you could demonstrate that your information gathering has zero opportunity cost—for example, if the job offers never expire and reading reviews consumes no mental energy that affects your interview performance. Similarly, if the decision were fully reversible without penalty, the cost of being wrong drops, making additional information relatively more valuable. Finally, if you could prove that your current anxiety is purely due to missing data rather than the inherent risk of the choice, then Claim 2 might move up. But until search costs are negligible, the stopping rule remains the dominant constraint. If you found that additional data consistently changed your decision rather than just reinforcing uncertainty, the value of information would rise, but three weeks of research suggests diminishing returns have already set in.
