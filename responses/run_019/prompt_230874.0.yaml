prompt: |-
  Okay so I've got a decision problem that's turning into a personality flaw. I've been choosing between two jobs for the last three weeks and I've read every review site, forum thread, and how-to-decide essay I can find, and I keep generating more things to look up. A friend who does decision theory nudged me toward Good's theorem — the idea that, in a standard expected-utility setup, a free signal about the state of the world can't have negative expected value, so you should weakly prefer to look at it before choosing. Fine. But I've noticed I'm now using that as a blanket justification for basically all my information-hoovering, and I suspect some of the things people (including me) claim on it's behalf don't actually follow.

  Take the candidate implications below — some are mine, some I've seen floating around — and rank them by how much they should actually change how I make real-life decisions. The point is to end up with a personal checklist for how much information to seek before deciding, so rank by practical impact on behavior, not by how interesting the edge case is.

  - You should never avoid free information; actively not looking at the evidence is irrational.
  - More information is always weakly better, so defaulting to one more datapoint is usually the right move.
  - You can never ex post regret acquiring information.
  - The theorem shows that doing more science, or running more tests before acting, is in expectation always worth it.
  - Free information helps just as much in negotiations and other strategic settings, since those are just another decision problem.
  - Since free information is always weakly beneficial, the main practical question is finding more of it; when to stop searching is a secondary problem.

  I keep hearing these from smart people and I need to know which ones survive contact with the theorem's actual assumptions and which ones are overrated or don't follow at all. I want a defended ranking, not a survey.

  Use these sections, in this order:

  - Bottom line (2–3 sentences): the final ranking and the one-line reason.
  - What the theorem actually licenses (about 200 words): the precise claim and which assumptions are doing the real work.
  - The survivors (about 350 words): the two or three implications I should genuinely take seriously, what they'd license in practice, and why they rank where they do.
  - The overrated rest (about 350 words): the ones that fall apart once you look at the assumptions — Bayesian updating actually happening, the information being about a fixed decision with fixed options, strategic or adversarial settings, anticipation and attention costs, ex ante versus ex post.
  - What would change my mind (about 150 words): what I'd have to learn about my own situation or the theorem's edge cases to reorder the list.

  No citations or references needed; I'll fill those in later if I show this to anyone.
