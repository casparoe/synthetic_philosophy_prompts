prompt: |-
  A friend of mine keeps saying we might be living at the most important time in history, and he uses it to justify telling everyone -- including me -- to abandon their career plans and work on existential risk instead. When I push back he just repeats that this century is "the hinge of history" as if that settles it. I'm sure the phrase is doing a lot of hidden work, but I can't pin down where.

  Can you spell out the different precise claims it could be making? I mean things like: a claim about the probability of extinction or permanent lock-in being higher now than in the past, a claim about how much an average person's actions can influence the far future now versus at other times, a claim about the total value at stake in the long-run future, a claim about us having unusual knowledge that earlier generations lacked, or something else entirely. For each reading, say whether it's close to trivial, genuinely substantive and defensible, or probably false, and -- this is the part I actually need -- which readings would actually have to be true for his career advice to follow. If none of them get him there without extra premises, say what those extra premises are.

  Answer in American English, 600 words max. A list of the readings with short verdicts is fine, but end with a clear bottom line on whether the slogan, on its best reading, supports his argument.
