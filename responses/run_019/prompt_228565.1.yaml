          *   *Schabowski's Role:* Schabowski isn't the butterfly that *caused* the storm; he's the perturbation that determined *which path* the system took to reach the attractor. He accelerated the transition to the attractor state. Without him, the system likely still falls into the "collapse" attractor, but maybe via a different trajectory (slower, bloodier).
