      *   *Ruling (2013):* Isolated genomic DNA is *not* patent-eligible under 35 U.S.C. § 101 because it's a "product of nature." cDNA *is* patent-eligible because it is synthetically created (introns removed).
      *   *Rationale:* gDNA exists in the body (even if isolated). cDNA does not exist in nature in that exact form (exons only).
      *   *Implicit Ontology:* The court distinguishes based on *structural difference* resulting from human intervention, but acknowledges the *informational identity* (they code for the same protein).

  3.  **Address Question 1 & 2: Information vs. Matter:**
