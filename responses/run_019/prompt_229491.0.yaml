      *   *Presupposition:* The law treats DNA as *both* matter and information, but prioritizes the *material history* for eligibility.
      *   *Information Separability:* Does the law assume information is separable?
          *   *Argument for Yes:* By patenting cDNA, they are patenting the coding sequence (the information) embodied in a specific chemical form.
          *   *Argument for No:* The Court explicitly said they aren't patenting the *idea* of the gene, just the specific synthetic molecule.
      *   *Coherence:* It's legally coherent (bright line rule based on synthesis) but ontologically messy. It relies on a "human intervention" threshold. If you touch it enough (splice introns), it becomes "man-made."
      *   *Critique:* If DNA is purely information, the distinction collapses (same code). If DNA is purely chemistry, the distinction holds (different molecules). The law tries to have it both ways: acknowledging the informational function (why we care) while relying on the chemical distinction (why it's patentable).

