          *   *Scenario B (Purification as Chemistry):* If "isolation" is seen as a chemical purification process (like isolating adrenaline in *Parke-Davis*), one could argue isolated gDNA is a new chemical composition of matter. -> *The line moves (gDNA becomes patentable).*
          *   *Scenario C (Functional Equivalence):* If the chemistry view emphasizes that both perform the same chemical function (hybridization/coding), one could argue cDNA is too similar to gDNA. -> *The line moves (cDNA becomes unpatentable).*
      *   *Conclusion on this point:* A strict chemistry view actually supports the *Myriad* distinction *better* than an information view. In information theory, gDNA and cDNA are functionally identical regarding the protein output. In chemistry, they are distinct molecules. Therefore, the "chemistry" view justifies the line *more* coherently than the "information" view, contrary to the prompt's implication.

