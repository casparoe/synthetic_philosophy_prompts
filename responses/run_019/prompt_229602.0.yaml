answer: |-
  Here is the breakdown of how each candidate rule handles your four test cases, followed by an evaluation of which rule best explains your friend's psychology, and a proposal for a decisive test case.

  ### 1. Predictions for the Four Cases

  | Case | **Rule 1: Centralized Nervous System** | **Rule 2: Cognition + Human Override** | **Rule 3: Behavioral Pain Evidence** | **Rule 4: Vertebrate + Octopus** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Farmed Shrimp** | **Ambiguous.** Shrimp have ganglia (CNS), but less centralized than octopuses. Depends on where she sets the "centralized-enough" threshold. | **No.** Low individual cognitive sophistication; not human. | **Ambiguous/Yes.** Evidence for nociception in crustaceans is growing. If she accepts the evidence, they count. | **No.** Invertebrate (and not an octopus). |
  | **Oyster** | **No.** Nervous system is too diffuse/simple. | **No.** No cognition; not human. | **No.** Little behavioral evidence of pain. | **No.** Invertebrate. |
  | **Human Newborn** | **Yes.** Full human CNS. | **Yes.** Human Override applies regardless of current cognition. | **Yes.** Clear pain behavior. | **Yes.** Vertebrate/Human. |
  | **Ant Colony** | **No.** No single centralized nervous system. | **Ambiguous.** The *colony* solves problems (cognition), but the *individual* does not. Depends on if she values collective or individual mind. | **No.** No unified pain behavior. | **No.** Invertebrate. |

  ### 2. Evaluation of Fit

  **Rule 3 (Pain Evidence) is the weakest fit.**
  It is directly contradicted by the fish case. She acknowledges fish feel pain ("fish can feel pain") but assigns them low moral weight ("eats fish"). If behavioral evidence of pain were the primary rule, fish would be filed with pigs, not food. It also mischaracterizes her insect view: she doesn't say insect pain evidence is *weak*; she says they "probably don't count at all."

  **Rule 1 (CNS) is a strong contender but requires fine-tuning.**
  It handles the octopus well (they have complex brains) and the dementia patient well. However, it struggles to distinguish insects from octopuses without appealing to *complexity*. Insects have centralized ganglia; if the rule is just "CNS," insects should count. To make this work, the rule has to become "Complex CNS," which essentially smuggles in Rule 2 (Cognition) because we judge complexity by cognitive output.

  **Rule 4 (Vertebrate + Octopus) is descriptively perfect but explanatorily empty.**
  This rule predicts every single one of her known verdicts and your predicted verdicts perfectly. However, it treats the octopus as an arbitrary exception. It tells us *what* she thinks, but not *why*. It fails to explain why the octopus is the chosen invertebrate exception rather than, say, a crab or a spider.

  **Rule 2 (Cognition + Human Override) is the best explanatory fit.**
  This rule captures the nuance of her "weighting" system.
  *   **The Octopus Exception:** Octopuses aren't counted because of a biological loophole; they are counted because they are **smart** (tool use, problem-solving). This explains why they are filed with pigs rather than fish.
  *   **The Fish Verdict:** Fish are vertebrates, but their cognitive sophistication is lower than pigs/chickens, hence they get "less weight" and are edible.
  *   **The Dementia Patient:** This is the key. A dementia patient lacks cognitive sophistication. The *only* reason they count fully is the **Human Override** (species membership/essence).
  *   **The Insects:** Dismissed because their individual cognitive sophistication is negligible.

  ### 3. The Verdict: Rule 2 Wins

  Your friend is operating on a **Hybrid Capacity/Species View**. She values **Cognitive Sophistication** generally (which grants status to pigs, dogs, octopuses), but she holds a **Human Essentialist** exception (which grants full status to humans regardless of capacity).

  This explains the "weighting" she assigns. Pigs > Chickens > Fish is a cognitive hierarchy. Humans are off the chart due to species membership. Octopuses are promoted up the hierarchy due to surprising cognitive capacity.

  ### 4. The Decisive Test Case

  To distinguish Rule 2 (Cognition + Human Override) from Rule 4 (Vertebrate + Octopus) and Rule 1 (CNS), you need a case that is **biologically similar to her protected mammals but cognitively impaired, and crucially, not human.**

  **The Case: A Chimpanzee with Severe Dementia (or profound cognitive impairment).**

  *   **The Scenario:** Describe a non-human primate that has the cognitive capacity of a chicken due to age or injury, but is biologically a mammal.
  *   **Rule 4 (Vertebrate Bias) predicts:** **Counts.** It is a mammal/vertebrate, similar to dogs and pigs. The taxonomy matters most.
  *   **Rule 1 (CNS) predicts:** **Counts.** It has a mammalian CNS, even if damaged.
  *   **Rule 2 (Cognition + Human Override) predicts:** **Does Not Count.** It lacks the cognitive sophistication of a pig, and it does not qualify for the Human Override.

  **Why this works:**
  If she says the chimp counts, she is a **Taxonomist** (Rule 4/1). She values the biological hardware (mammal/vertebrate) over the software (mind).
  If she says the chimp does *not* count (or counts less than a healthy pig), she is a **Cognitivist with Human Exceptionalism** (Rule 2). This confirms that "Human" is the only magic word that bypasses the cognitive requirement, and that the octopus exception was indeed about intelligence, not just biological classification.

  **Secondary Test (if you want to target Rule 1 specifically):**
  **An Anencephalic Human Infant** (born without a cortex/capacity for consciousness).
  *   **Rule 2 (Human Override):** Counts fully (because Human).
  *   **Rule 1 (CNS/Experience):** Does not count (no hardware for subjective experience).
  *   *Note:* This is emotionally charged and might be harder to ask casually, but it cleanly separates the "Human Override" from the "Nervous System" requirement.
