      *   *Logical Impossibility vs. Physical Impossibility:* Even if the lamp scenario is problematic, does it prove *all* supertasks are impossible? Most philosophers distinguish between logical possibility (coherence of concepts) and physical possibility (laws of nature). The book claims *logical* impossibility.
