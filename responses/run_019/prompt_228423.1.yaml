answer: |-
  **Graduate Seminar: Functions and Teleology in Biology**
  **Final Examination**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Your response should demonstrate command of the standard etiological and causal-role frameworks, their application to non-standard cases, and the current state of the debate regarding normativity.

  ***

  ### Exam Question

  Consider the following case constructed for this seminar:

  > **The Consortium Case:** A bioengineered microbial consortium consists of two strains, A and B, inhabiting a shared medium. Strain A expresses Gene *X*, which produces Protein *P*. Historically, Gene *X* was selected in Strain A's lineage solely for intracellular metabolic stability. However, in this specific engineered environment, Protein *P* incidentally diffuses out of Strain A and chemically neutralizes a toxin in the medium, thereby preventing the death of Strain B. Strain A's lineage has **never** undergone selection for this detoxification effect, nor has the consortium itself undergone a history of differential reproduction as a unit. The detoxification effect is currently vital for the persistence of the consortium system.

  Write an essay addressing the following three prompts:

  1.  **Verdicts:** According to a standard Etiological (Selected-Effects) account and a standard Causal-Role (Cummins) account, does Protein *P* have the *function* of detoxifying the medium? Justify each verdict based on the core criteria of the respective theory.
  2.  **Theoretical Costs:** Explain how this case illuminates the classic "collisions with intuition" for each account. Specifically, discuss how the Causal-Role verdict risks **liberalism/function-accident conflation**, and how the Etiological verdict risks the **first-token/novel-trait problem**.
  3.  **Normativity and Malfunction:** Suppose a mutation arises in Strain A such that a "broken" copy of Protein *P* is produced which fails to detoxify the medium. Can either account license the claim that this protein is *malfunctioning* (rather than merely absent or different)? Explain the resources each account has to ground this normative distinction.

  ***

  ### Model Answer

  **Introduction**
  The dispute between Etiological (Selected-Effects, or SE) and Causal-Role (CR) accounts centers on whether functions are defined by historical origins or current contributions to capacity. The Consortium Case serves as a stress test for both, isolating the variables of selection history and current systemic benefit.

  **1. Verdicts on the Consortium Case**
  Under a standard **Etiological Account** (e.g., Millikan, Neander), a trait has a function only if it exists *because* it performed that effect in the past, leading to the reproduction of the trait. In the Consortium Case, Protein *P*'s detoxification effect is incidental; Strain A's lineage was not selected for this effect, and the consortium lacks a reproduction history. Therefore, the SE account must verdict that detoxification is **not a function** of Protein *P*. It is, at best, a beneficial side effect.

  Under a standard **Causal-Role Account** (e.g., Cummins), a function is a capacity of a trait that contributes to the capacity of a containing system. If we define the "system" as the consortium, and the "capacity" as persistence in the toxic medium, Protein *P* contributes causally to this capacity. Therefore, the CR account verdicts that detoxification **is a function** of Protein *P* relative to the consortium system.

  **2. Theoretical Costs and Intuition Collisions**
  This case highlights the specific theoretical costs each account accepts to maintain internal consistency.

  The CR verdict illustrates the charge of **liberalism**. By counting any causal contribution to a system's capacity as a function, CR accounts struggle to distinguish functions from mere beneficial accidents. Intuitively, because the detoxification was not the reason *P* exists (even in the engineered context), calling it a "function" conflates teleology with mere causality. The CR theorist must accept that "function" is a relativized, explanatory label rather than a marker of genuine teleology.

  The SE verdict illustrates the **first-token or novel-trait problem**. Because SE requires a history of selection, it cannot ascribe functions to novel traits or traits in new environments before selection has had time to act. Intuitively, if the detoxification is *vital* for the consortium's survival now, it seems teleological to say the protein lacks that function simply because the history is too short. The SE theorist must accept that genuine function lags behind current utility, denying teleological status to the "first tokens" of a potentially adaptive trait.

  **3. Normativity and Malfunction**
  The question of malfunction tests the normative resources of each account. If a broken copy of Protein *P* fails to detoxify, is it malfunctioning?

  The **SE account** handles this robustly. Normativity is grounded in the historical standard. Since the *type* P was selected for metabolic stability (its proper function), a token that fails to perform its structural role is malfunctioning relative to that history. However, regarding detoxification specifically, SE cannot call the failure to detoxify a "malfunction," because detoxification was never the proper function. The broken protein is simply failing to do something it was never supposed to do.

  The **CR account** faces a well-known difficulty here. Standard CR analysis is descriptive; it maps capacities. A broken protein simply has a different causal role (or no role). To ground "malfunction," CR theorists often must augment the view. Some appeal to **dispositional accounts** (the trait is disposed to contribute but is prevented), while others appeal to **organizational accounts** (the trait contributes to the self-maintenance of the system, and failure threatens organizational closure). However, it is contested whether these variants successfully recover normativity without smuggling in historical conditions. Thus, while SE grounds malfunction in history, standard CR requires additional theoretical machinery to distinguish malfunction from mere variation.

  **Conclusion**
  The Consortium Case demonstrates that the choice between SE and CR is not merely empirical but conceptual. SE preserves a strong distinction between function and accident but excludes novel utility. CR captures current systemic utility but dilutes the concept of function. Regarding normativity, SE offers a clearer ground for malfunction, whereas CR remains contested on whether it can generate normativity from current organization alone. There is no consensus on which cost is preferable; the choice depends on whether the philosopher prioritizes historical genuineness or explanatory utility in current systems.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Correct SE Verdict & Justification (4 Marks)**
  *   **Requirement:** Candidate must state SE denies the function status because there is no selection history for the detoxification effect in the relevant lineage.
  *   **Typical Error:** Treating the current benefit to the consortium as sufficient for SE, or confusing the selection history of Gene *X* (metabolic stability) with the effect in question (detoxification).

  **2. Correct CR Verdict & Justification (4 Marks)**
  *   **Requirement:** Candidate must state CR affirms the function status because the protein contributes to the capacity of the containing system (consortium).
  *   **Typical Error:** Failing to specify the "system" boundary (e.g., arguing CR denies function because it's not a function for Strain A *individually*, missing the systemic relativization).

  **3. Analysis of Intuition Collisions (4 Marks)**
  *   **Requirement:** Candidate must identify that CR risks "liberalism" (counting accidents as functions) and SE risks the "novelty/first-token" problem (excluding vital new traits).
  *   **Typical Error:** Swapping the objections (attributing novelty problems to CR) or treating these as settled refutations rather than acknowledged theoretical costs.

  **4. Malfunction and Normativity (4 Marks)**
  *   **Requirement:** Candidate must explain that SE grounds malfunction in historical standards (easy for proper function, impossible for accidental effects), while standard CR struggles to distinguish malfunction from variation without augmentation (dispositional/organizational).
  *   **Typical Error:** Assuming causal-role accounts *simply have no resources* for malfunction (ignoring dispositional/organizational variants) or claiming SE automatically labels the failure to detoxify as a malfunction.

  **5. Philosophical Status & Consensus (4 Marks)**
  *   **Requirement:** Candidate must distinguish between settled objections (e.g., SE excludes novel traits) and contested solutions (e.g., whether organizational closure solves normativity). Must not declare one view the "winner."
  *   **Typical Error:** Presenting a contested position (e.g., "Organizational accounts have solved the normativity problem") as settled consensus, or concluding the essay by declaring one theory objectively correct.
