answer: |-
  ### The Specification for Judgment Aggregation

  You are asking for the formal constraints of **Judgment Aggregation Theory**. The "discursive dilemma" is the symptom; the disease is the incompatibility of logical consistency with standard democratic aggregation on interconnected agendas.

  Below is the full spec. It categorizes requirements by **Cases** (edge conditions), **Distinctions** (conceptual boundaries), and **Results** (logical constraints).

  | Requirement | Category | Definition & Why It Bites | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Collective Consistency** | Result | The group's judgment set must be logically consistent (no $P, Q, \neg(P \land Q)$).<br>**Why it bites:** Proposition-wise majority voting fails this in the 3-judge doctrinal paradox. | **Non-negotiable** (Rational Agency) |
  | **2. Agenda Completeness** | Case | The procedure must output a judgment (Yes/No) on every proposition in the agenda, handling ties and abstentions without stalling.<br>**Why it bites:** Incomplete sets prevent action; ties require a tie-breaking rule that doesn't violate other constraints. | **Non-negotiable** (Decision Capacity) |
  | **3. Premise-Conclusion Integrity** | Case | The procedure must resolve the conflict where majority premises imply a minority conclusion (or vice versa).<br>**Why it bites:** You cannot simultaneously satisfy majority rule on premises *and* conclusion when they diverge. | **Non-negotiable** (Logical Coherence) |
  | **4. Path Independence** | Case | Adding an irrelevant proposition or changing voting order must not alter the judgment on core propositions.<br>**Why it bites:** Sequential voting allows agenda manipulation (cycling); the group's view shouldn't depend on the order of questions. | **Non-negotiable** (Stability) |
  | **5. Ontological Clarity** | Distinction | Must distinguish **Group Belief** (truth-tracking) from **Group Preference** (will-formation).<br>**Why it bites:** Aggregating beliefs requires logical consistency; aggregating preferences requires fairness. Mixing them creates category errors. | **Non-negotiable** (Conceptual) |
  | **6. Aggregation Scope** | Distinction | Must choose between **Premise-Based** (aggregate reasons, derive conclusion) vs. **Conclusion-Based** (vote on outcome, ignore reasons).<br>**Why it bites:** Collapsing these hides accountability. PBP ensures consistency; CBP ensures responsiveness to outcome preferences. | **Taste** (Epistemic vs. Democratic) |
  | **7. Agency Status** | Distinction | Must distinguish **Collective Judgment** (the group as a singular agent) vs. **Practical Decision** (a compromise to allow coexistence).<br>**Why it bites:** A compromise isn't a belief. If the group "believes" $P$, it must act on $P$, not just agree to tolerate $P$. | **Non-negotiable** (Definition of Group) |
  | **8. Voter Symmetry (Anonymity)** | Case | All members' judgments count equally, regardless of expertise or stakes.<br>**Why it bites:** Experts may be right more often, but weighting votes violates democratic equality. | **Taste** (Democratic Norm) |
  | **9. Systematicity (Independence)** | Result | The rule for aggregating proposition $A$ must be the same as for $B$, and depend *only* on votes for $A$ and $B$ respectively.<br>**Why it bites:** This forbids using logical links between $A$ and $B$ to decide the vote. It is the mathematical source of the impossibility theorem. | **Taste** (Methodological) |
  | **10. Unanimity Preservation** | Result | If every individual accepts $P$, the group must accept $P$.<br>**Why it bites:** Rules out random dictatorship or arbitrary overrides of consensus. | **Non-negotiable** (Pareto Principle) |

  ---

  ### The Killer Requirement

  **Collective Consistency** is the requirement that rules out the most standard aggregation rule (**Proposition-Wise Majority Voting**).

  *   **Why:** Standard voting treats every proposition as an isolated binary choice. In the discursive dilemma (the 3-judge case), this mechanically produces a logically inconsistent set (Accept $P$, Accept $Q$, Reject $P \land Q$).
  *   **Consequence:** If you demand Consistency (which you must for a rational group agent), you must abandon standard proposition-wise voting.

  *Note:* **Systematicity** is the requirement that makes finding *any* replacement rule impossible if you also demand Anonymity and Universal Domain. It forces you to treat logically connected propositions as if they were independent.

  ### Joint Satisfiability of Non-Negotiables

  **Are the non-negotiable requirements jointly satisfiable?**

  **YES**, but only if you classify **Systematicity** as "Taste" (which it is).

  *   **The Impossibility Theorem (List & Pettit, 2002):** You cannot satisfy Consistency, Completeness, Anonymity, Unanimity, *and* Systematicity simultaneously on a connected agenda.
  *   **The Solution:** You must drop **Systematicity**.
      *   If you allow the aggregation rule to treat premises differently from conclusions (e.g., **Premise-Based Procedure**), you satisfy Consistency, Anonymity, Unanimity, and Completeness.
      *   If you insist on Systematicity (treating all propositions the same way), the non-negotiables are **NOT** jointly satisfiable. You are forced into a Dictatorship (violating Anonymity) or Inconsistency.

  ### Scoring of Existing Rules

  | Rule | Consistency | Anonymity | Unanimity | Systematicity | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Proposition-Wise Majority** | ❌ | ✅ | ✅ | ✅ | **Fails Rationality** (The Dilemma) |
  | **Premise-Based Procedure (PBP)** | ✅ | ✅ | ✅ | ❌ | **Standard Fix** (Sacrifices direct vote on conclusion) |
  | **Conclusion-Based Procedure (CBP)** | ✅ | ✅ | ❌* | ❌ | **Democratic Risk** (Can override unanimous premises) |
  | **Dictatorship** | ✅ | ❌ | ✅ | ✅ | **Fails Democracy** (One person decides all) |
  | **Super-Majority Rules** | ⚠️ | ✅ | ❌ | ✅ | **Fails Unanimity** (Can block consensus) |

  *\*CBP can violate unanimity on premises if the majority conclusion contradicts unanimous premises.*

  **Summary:** To build a working group agent, you must accept **Premise-Based Aggregation** (or a distance-based minimization rule). This satisfies all non-negotiable rationality and democratic constraints, provided you accept that **logical structure matters more than procedural uniformity** (dropping Systematicity).
