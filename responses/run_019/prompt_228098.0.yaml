answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 15, 2023
  **SUBJECT:** Decision Framework for the Bequest Distribution Mechanism

  **Purpose**
  At our quarterly meeting in three weeks, we must vote on the distribution of the $1,000,000 bequest stipulated to "reward collective restraint." Staff propose the "Perseid Prize," a mechanism where the fund is divided by total entries to determine a prize value, with one entry drawn to win. Two board members prefer equal shares. This memo assesses the design integrity of the proposal to guide our vote.

  **The Case for the Perseid Prize and the Pilot**
  The strongest argument for the Perseid Prize is its theoretical alignment with the donor's intent. Unlike equal shares, which reward mere membership, the Perseid Prize structurally links individual gain to collective behavior. Staff argue it creates a Schelling point: since every member knows that flooding the system dilutes the prize to zero, rational actors will restrain themselves to preserve value. In this view, the mechanism relies on common knowledge of rationality to enforce cooperation without external policing.

  However, the pilot study undermines this claim. While 211 of 240 volunteers submitted one entry, demonstrating baseline goodwill, the remaining 26 submitted over 10,000 entries each, utilizing scripts to exploit the unlimited entry rule. The result was a payout of 1.7 cents. Staff argue this proves the membership is "overwhelmingly cooperative" and that a cap (e.g., 100 entries) would suffice. This interpretation is optimistic. The pilot actually demonstrates that the mechanism is vulnerable to minority defection. When 10% of participants defect strategically, they capture the majority of the probability space while destroying the value for the 90% who cooperated. The pilot does not show self-regulation; it shows that without hard constraints, the incentive to defect outweighs the incentive to restrain.

  **Institutional Design and Convergence**
  This raises a fundamental design question: May an institution legitimately build a mechanism whose success depends on every participant, being identically situated, arriving at the same conclusion?

  My position is that such a mechanism is legitimate only if it *harnesses* convergence rather than *hopes* for it. A mechanism harnesses convergence when the identical conclusion (restraint) is the dominant strategy for every actor regardless of what others do. It hopes for convergence when restraint is only optimal if everyone else also restrains (a coordination game or Prisoner's Dilemma).

  The Perseid Prize hopes for convergence. It assumes members will reason identically about the social good of the prize value. But members are not identically situated in risk tolerance or technical capability. A member with scripting skills faces a different payoff matrix than one without. An institution cannot ethically distribute donor funds using a mechanism that rewards technical exploitation over the stipulated virtue of restraint. If the mechanism requires identical reasoning to function, it must enforce that reasoning through incentive compatibility, not rely on it as a precondition.

  **Assessment of Alternatives and Caps**
  The junior staffer's variant—awarding $100,000 only if exactly one member claims it—is elegant but hazardous. It relies on a mixed-strategy Nash equilibrium where every member calculates a specific probability of entering. With 3,800 members, the margin for error is nonexistent. If the collective probability shifts slightly, the payout drops to zero. This risks violating the donor's intent to distribute funds to the membership by potentially distributing nothing at all. It substitutes the hope of restraint with the hope of precise probabilistic coordination, which is operationally fragile at our scale.

  Regarding the staff's proposed cap on the Perseid Prize: this does not solve the incentive problem; it renames it. If the cap is set at 100 entries, the rational strategy shifts from "submit infinite entries" to "submit 100 entries." The defectors still dilute the prize for the cooperators, merely within a bounded range. The cooperators (submitting 1 entry) are still exploited by those maxing the cap. The cap prevents software overflow, but it does not align individual incentives with collective restraint. It treats a symptom (server load) rather than the disease (misaligned incentives).

  **Recommendation**
  We have a fiduciary duty to honor the donor's stipulation while ensuring the mechanism is robust against exploitation. The Perseid Prize, even with a cap, rewards volume over restraint. The junior variant risks total non-distribution. Equal shares ignore the stipulation entirely.

  Therefore, I propose the following motion:

  **Move to reject the staff proposal for the Perseid Prize and the junior staffer's variant. Direct the Executive Director to convene a design task force to develop a distribution mechanism where individual restraint is the dominant strategy (incentive-compatible), rather than a cooperative hope. If no compliant mechanism is validated by a second pilot within six months, the Board shall reconsider equal distribution with a formal legal opinion on stipulation compliance.**

  This ensures we do not deploy a flawed system while respecting the donor's intent to reward restraint through design, not just hope.
