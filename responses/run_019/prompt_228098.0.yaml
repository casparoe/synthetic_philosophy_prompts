      *   **Constraint 4 (Content - Task 2):** Take a position on whether an institution may legitimately build a mechanism dependent on identical reasoning/convergence among participants, and distinguish harnessing convergence vs. hoping for it.
      *   **Constraint 5 (Content - Task 5):** Assess the junior staffer's variant (sole claimant gets $100k, else nothing) on merits, and assess whether the proposed entry cap (100 entries) solves the problem or renames it.

  2.  **Deconstruct the Proposals:**
