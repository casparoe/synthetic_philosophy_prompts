      *   *Fact:* Inequality is universal ("in all times some must be rich, some poore...").
      *   *Reason 1 (Conformity/Wisdom/Power/Greatness):*
          *   "Conformity with the rest of his world": Variety reflects creation.
          *   "Glory of his wisdom": Variety shows off God's mind.
          *   "Glory of his power": Ordering differences preserves the "whole."
          *   "Glory of his greatness": Princes have officers; God has stewards.
          *   *Key Mechanism:* God is "more honoured in dispensing his gifts to man by man, than if he did it by his owne immediate hands."

  3.  **Address the Tension (Inequality vs. Unity):**
      *   The user sees a contradiction: If God wants inequality, why demand radical unity/love?
      *   *Resolution:* The inequality is the *condition* that makes the charity *necessary*. If everyone were equal, there would be no need for "mercy" or "giving." The hierarchy isn't there to justify oppression, but to create the *occasion* for Christian love to operate.
      *   *The "Steward" Concept:* The rich aren't owners; they are "stewards." They hold resources to distribute them to the poor. This transforms wealth from a status symbol into a responsibility.

  4.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the user's close reading. Validate that the tension they feel is real but resolvable. State the thesis: The opening isn't boilerplate; it's the *foundation* for the ethics of charity that follow.

      *   **Why Inequality Exists (The Three Reasons):**
