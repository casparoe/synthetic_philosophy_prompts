          *   2. *Functional:* Ordering differences preserves the "whole" (interdependence).
          *   3. *Relational/Theological:* God uses humans to help humans ("gifts to man by man"). This is the crucial one. It makes humans agents of God's grace.

      *   **What This Commits Winthrop To (The Social Contract):**
          *   It commits him to a society based on *interdependence*, not independence.
          *   It redefines wealth: Wealth is not for hoarding; it's a tool for distribution.
          *   It redefines poverty: Poverty is not a moral failure; it's an opportunity for the rich to exercise grace.
          *   *Crucial Point:* Hierarchy is functional, not just status-based. The "high" serve the "low" by distributing resources.

      *   **Addressing the "American Exceptionalism" Question:**
          *   *Popular Reading:* "City upon a Hill" = We are better/special/successful.
          *   *Textual Reality:* The opening complicates this. It's not about individual success. It's about collective survival through mutual obligation.
          *   *Nuance:* It supports the idea of a "special mission" (glory of God), but undermines the idea of "individual meritocracy." The exceptionalism is corporate and conditional on charity, not inherent.

      *   **Synthesizing the Tension (Inequality vs. The Body):**
