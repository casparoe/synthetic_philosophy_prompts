  # Ontology of Time After Special Relativity: A Diagnostic Instrument

  ## I. The Diagnostic Cases
  Before beginning, ensure you have the following two scenarios fixed in mind. These provide the concrete physical situations for the questions below.

  **Case 1: The Andromeda Walkers**
  Two people, Alice and Bob, pass each other on Earth. Alice walks toward the Andromeda galaxy; Bob walks away from it. An Andromedan invasion fleet is preparing to launch. Because of their relative motion, Alice's "now-slice" (her plane of simultaneity) cuts through Andromeda at a later time than Bob's "now-slice." For Alice, the fleet has already launched. For Bob, the decision to launch is still in the future.

  **Case 2: The Three-Event Relay**
  Alice and Bob are in relative motion and pass each other at Event G1. Alice's "now-slice" includes two spacelike separated events: G1 (the meeting) and G2 (a distant supernova). Bob's "now-slice" includes G1 but places G2 in his future.
  *   **Premise:** G1 and G2 are both real for Alice.
  *   **Premise:** G1 is real for Bob (since he is there).
  *   **Question:** Is G2 real for Bob?

  ## II. The Decision Tree
  Answer the following four questions in order. Follow the branches to your diagnostic leaf.

  **Q1 (Transitivity of Co-reality):** In the Three-Event Relay, given that G1 and G2 are both real for Alice and G1 is real for Bob, is G2 *also* real for Bob right now?
  *   **YES** → Go to Q2.
  *   **NO** → Go to Q3.

  **Q2 (Andromeda Fact):** In the Andromeda Walkers case, is there a single, frame-independent fact about whether the fleet has launched *at the moment the walkers pass*?
  *   **YES** → Go to Q4.
  *   **NO** → **Leaf A**.

  **Q3 (Andromeda Fact):** In the Andromeda Walkers case, is there a single, frame-independent fact about whether the fleet has launched *at the moment the walkers pass*?
  *   **YES** → Go to Q4.
  *   **NO** → Go to Q5 (Past Existence).

  **Q4 (Physics & Global Present):** Does the physics of Special Relativity require us to posit an objective global present not visible in the standard equations?
  *   **YES** → **Leaf B** (if from Q2) or **Leaf C** (if from Q3).
  *   **NO** → **Leaf D (Unoccupied)**.

  **Q5 (Past Existence):** Do events that have already happened (like your birth) continue to exist?
  *   **YES** → **Leaf E**.
  *   **NO** → **Leaf F**.

  *(Note: Q4 is skipped for NO branches of Q2/Q3 where a global present is logically excluded by the previous answer.)*

  ## III. Diagnostic Leaves

  **Leaf A: The Block Universe (Eternalism)**
  *   **Path:** Q1=YES, Q2=NO.
  *   **Position:** All events exist tenselessly; "now" is merely a perspective within the block.
  *   **Awkward Commitment:** There is no objective passage of time, meaning your experience of the present is no more ontologically privileged than the memory of the past.

  **Leaf B: The Moving Spotlight**
  *   **Path:** Q1=YES, Q2=YES, Q4=YES.
  *   **Position:** All times exist, but there is an objective, moving property of "presentness" along a privileged slice.
  *   **Awkward Commitment:** Physics cannot detect the "spotlight," requiring a metaphysical property that tracks time without interacting with matter.

  **Leaf C: Presentism (Privileged Foliation)**
  *   **Path:** Q1=NO, Q3=YES, Q4=YES, Q5=NO.
  *   **Position:** Only the privileged present slice exists; the future is unreal and the past is gone.
  *   **Awkward Commitment:** You must accept a hidden, undetectable preferred frame of reference that contradicts the democratic spirit of Special Relativity.

  **Leaf D: Unoccupied (Incoherent)**
  *   **Path:** Q1=YES/NO, Q2/Q3=YES, Q4=NO.
  *   **Status:** **Incoherent.**
  *   **Reasoning:** If there is a single frame-independent fact (Q2/Q3=YES), Special Relativity requires a hidden structure to define it. Denying this structure (Q4=NO) while asserting absolute facts leaves the ontology without a physical basis.

  **Leaf E: The Growing Block (Privileged Edge)**
  *   **Path:** Q1=NO, Q3=YES, Q4=YES, Q5=YES.
  *   **Position:** The past and present exist, but the future does not; reality grows along a privileged edge.
  *   **Awkward Commitment:** The "edge" of reality must move faster than light to remain simultaneous across space, yet remains physically undetectable.

  **Leaf F: Deflationary / Indexical Presentism**
  *   **Path:** Q1=NO, Q3=NO, Q5=NO.
  *   **Position:** "Existence" is frame-relative; only events in an observer's immediate present are "real for" them.
  *   **Awkward Commitment:** Reality is fragmented, such that two observers at the same point may disagree on what exists without either being wrong.

  **Leaf G: The Open Future (Relativistic)**
  *   **Path:** Q1=NO, Q3=NO, Q5=YES.
  *   **Position:** The past is fixed and exists, but the future lacks determinate truth values and is frame-relative.
  *   **Awkward Commitment:** Logical bivalence fails for future events, complicating causation and truth across different reference frames.

  **Leaf H: Unoccupied (Unattractive)**
  *   **Path:** Q1=YES, Q2=YES, Q4=NO. (Mapped to Leaf D logic).
  *   **Status:** **Unattractive.**
  *   **Reasoning:** Asserting all events exist (Q1=YES) and a single fact exists (Q2=YES) but denying the physics requires a global present (Q4=NO) creates a dualism where metaphysics contradicts physical ontology without necessity.

  ## IV. Instrument Limitations
  **Flagged Indistinguishability:**
  This tree separates Presentism (Leaf C) and the Growing Block (Leaf E) using Q5 (Past Existence). However, it does not distinguish between the **Deflationary view (Leaf F)** and a **Relativistic Open Future** variant where the past also ceases to exist. To separate these, an additional case involving **memory traces** would be needed: *If an observer remembers an event, does that event still exist?* A "No" answer would confirm Leaf F; a "Yes" answer would confirm a variant of Leaf G.

  ## V. Three-Question Sorting Quiz
  *For quick classification without the full logical tree.*

  **Instructions:** Answer Yes or No to the following three questions. Match your pattern to the Key.

  1.  **Relay Question:** In the Three-Event Relay, if G2 is real for Alice and Alice meets Bob at G1, is G2 also real for Bob?
  2.  **Andromeda Question:** Is there a single, frame-independent fact about whether the Andromeda fleet has launched?
  3.  **Past Question:** Do events that happened yesterday still exist?

  **Scoring Key:**

  *   **Yes / No / (Any):** **Block Universe (Eternalism).** (You accept transitivity but reject absolute facts).
  *   **Yes / Yes / (Any):** **Moving Spotlight.** (You accept transitivity and absolute facts).
  *   **No / Yes / No:** **Presentism.** (You reject transitivity, demand absolute facts, and deny past existence).
  *   **No / Yes / Yes:** **Growing Block.** (You reject transitivity, demand absolute facts, but affirm past existence).
  *   **No / No / No:** **Deflationary / Indexical.** (You reject transitivity, reject absolute facts, and deny past existence).
  *   **No / No / Yes:** **Open Future.** (You reject transitivity and absolute facts, but affirm past existence).
  *   **Any / Any / No (with Physics=Yes):** If you answered "No" to Q3 but believe physics *requires* a global present, your position is **Incoherent**.
