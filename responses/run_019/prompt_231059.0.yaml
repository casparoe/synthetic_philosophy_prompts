answer: |-
  You and your friend have accidentally recreated one of the most famous problems in the history of economics.

  You are describing the **Allais Paradox**, named after the French economist Maurice Allais, who won the Nobel Prize in part for identifying this exact behavior in 1953.

  Here is the breakdown of who is right, why it feels the way it does, and what it actually means for your decision-making.

  ### 1. The Verdict: Who is right?
  **Technically, your friend is right.**
  **Psychologically, you are right.**

  *   **Your Friend (The Economist's View):** Under standard **Expected Utility Theory** (the mathematical framework for rational decision-making), your choices are inconsistent. If you prefer the sure thing in the first scenario, logic dictates you should prefer the safer odds in the second scenario. By switching your preference, you violated the "Independence Axiom."
  *   **You (The Human View):** Your intuition is shared by the vast majority of people, including professional traders and economists when they aren't looking at a whiteboard. Your brain processes "certainty" (100%) fundamentally differently than it processes "probability" (89% vs. 11%). This is a documented cognitive bias called the **Certainty Effect**.

  ### 2. Why your friend says the "math shakes out the same"
  Your friend is looking at the *structure* of the gamble, not just the dollar amounts. Here is how they are seeing it:

  **Choice 1:**
  *   **A:** 100% chance of $10k.
  *   **B:** 89% chance of $10k + 10% chance of $50k + 1% chance of $0.

  **Choice 2:**
  *   **C:** 11% chance of $10k + 89% chance of $0.
  *   **D:** 10% chance of $50k + 90% chance of $0.

  Your friend's argument is that **89% of the outcome is identical in both scenarios.**
  In Choice 1, 89% of the time, both options give you $10k.
  In Choice 2, 89% of the time, both options give you $0.

  If you strip away that common 89% chunk (because it cancels out logically), you are left comparing the remaining slices:
  *   **From Choice 1:** You are comparing an **11% chance of $10k** (the remainder of Option A) vs. a **10% chance of $50k + 1% chance of $0** (the remainder of Option B). You chose the 11% chance.
  *   **From Choice 2:** You are comparing an **11% chance of $10k** (Option C) vs. a **10% chance of $50k** (Option D). You chose the 10% chance.

  Your friend is pointing out that you preferred the 11% chance in the first math problem, but the 10% chance in the second math problem, even though the core comparison is effectively the same.

  ### 3. Why it feels different to you (The Certainty Effect)
  You aren't irrational; you are human. Expected Utility Theory assumes we treat a 1% drop from 100% to 99% the same as a 1% drop from 50% to 49%. But we don't.

  *   **In Choice 1:** The move from 100% to 89% feels catastrophic. You are introducing the possibility of walking away with *nothing*. The pain of potentially getting $0 (regret) outweighs the gain of potentially getting $50k. You bought "peace of mind."
  *   **In Choice 2:** Both options are longshots. You expect to get $0 in either case. Since the "safety" is already gone, you might as well swing for the fences. The difference between an 11% chance and a 10% chance feels negligible compared to the difference between $10k and $50k.

  This is rational from an emotional standpoint (minimizing regret), even if it is inconsistent from a mathematical standpoint.

  ### 4. So, which choice should you change?
  If you want to be "consistent" (which matters if you make these kinds of decisions repeatedly, like in investing), you need to align your risk tolerance. You currently have **Risk Aversion** in Choice 1 and **Risk Seeking** in Choice 2. You need to pick one lane.

  **Lane A: The Risk-Averse Approach (Protect the Downside)**
  *   **Philosophy:** "I hate the idea of getting nothing."
  *   **Choice 1:** Keep the Guaranteed $10k.
  *   **Choice 2:** Switch to the 11% chance at $10k.
  *   **Cost:** In Choice 2, you are accepting a lower Expected Value ($1,100 vs $5,000) to maintain consistency in your aversion to risk.

  **Lane B: The Expected Value Approach (Play the Odds)**
  *   **Philosophy:** "I care about the average outcome over time."
  *   **Choice 1:** Switch to the Gamble. (Expected Value: $13,900 vs $10,000).
  *   **Choice 2:** Keep the Gamble. (Expected Value: $5,000 vs $1,100).
  *   **Cost:** In Choice 1, you have to be emotionally okay with a 1% chance of walking away with nothing despite having a "sure thing" on the table.

  ### 5. Does it actually matter?
  For a one-off bonus at work? **No.**

  The Allais Paradox proves that human beings do not naturally follow Expected Utility Theory. We have evolved to value certainty highly because, in the wild, a 99% chance of food might still mean starvation, while 100% means survival.

  **My advice:**
  Tell your friend he wins the argument on **logic**, but you win the argument on **psychology**.
  *   If that $10,000 was life-changing money (rent, debt, bills), your first choice was the correct *human* choice, regardless of the math.
  *   If that $10,000 was "fun money," you probably should have taken the gamble in the first instance, because the math was heavily in your favor ($13.9k expected value vs $10k).

  Don't lose sleep over it. You fell for a paradox that fooled Nobel Prize winners for decades. That's not irrational; that's standard issue for the human brain.
