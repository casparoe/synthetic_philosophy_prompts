answer: |-
  # The Demon's Commitment Quiz

  You argue about demons. Do you know why they fail? Answer concrete cases. No physics jargon required. Your choices reveal hidden assumptions about information and entropy.

  ## The Cases

  1. **Szilard Engine:** One molecule pushes a piston. You insert a partition. Work is extracted. Gas entropy drops. When does the universe pay?
     A. When you measure the molecule.
     B. When you reset the partition.
     C. It doesn't; entropy fluctuates.

  2. **Finite Memory:** A demon sorts molecules until its memory fills. To continue, it must overwrite old data. What happens?
     A. Heat dissipates during overwrite.
     B. Heat dissipated during initial measurement.
     C. It stops working; no heat needed.

  3. **Reversible Tape:** A demon writes measurements to an infinite tape, never erasing. Can it extract work indefinitely?
     A. Yes, entropy moves to the tape.
     B. No, measurement costs energy.
     C. No, thermal noise jams the tape.

  4. **Feynman Ratchet:** A pawl rectifies Brownian motion to lift a weight. Both parts are same temperature. Does it lift?
     A. Yes, briefly, then stops.
     B. No, pawl fluctuates too.
     C. Yes, if the pawl is light.

  5. **Quantum Probe:** Measuring an atom's position disturbs its momentum. Is this disturbance the entropy cost?
     A. Yes, uncertainty prevents free lunch.
     B. No, correlation is the cost.
     C. No, only erasure costs energy.

  6. **Correlated Gas:** Demon knows every molecule's position. Gas entropy is low relative to demon. Is this physical?
     A. Yes, information is physical.
     B. No, entropy is subjective ignorance.
     C. Yes, but only until reset.

  7. **Thermalizing Demon:** The demon's internal state equilibrates with the gas. What breaks the cycle?
     A. Loss of correlation.
     B. Heat dissipation to environment.
     C. Nothing; it works forever.

  8. **Infinite Memory:** If the demon has infinite memory and never resets, does the Second Law hold?
     A. Yes, globally including tape.
     B. No, locally violated forever.
     C. Yes, measurement prevents it.

  9. **Poincare Return:** Given infinite time, the gas returns to low entropy spontaneously. Is the demon just speeding this up?
     A. Yes, it's a fluctuation manager.
     B. No, it creates order actively.
     C. No, measurement blocks return.

  ## Logical Space & Scoring

  **Underlying Dimensions**
  1. *Cost Location:* Measurement (A) vs. Erasure (B) vs. None/Fluctuation (C).
  2. *Entropy Nature:* Objective/Physical (A) vs. Subjective/Coarse-grained (B).
  3. *System Boundary:* Local (Demon) vs. Global (Demon+Tape+Gas).

  **Position Mapping**
  1. **Erasure-cost:** Predominantly B on Q1, Q2, Q5. Entropy pays when information is lost physically.
  2. **Measurement-cost:** Predominantly A on Q1, Q2, Q5. Acquiring info requires energy dissipation.
  3. **Statistical-fluctuation:** Predominantly C on Q1, Q4, Q9. Second Law is probabilistic; demons work briefly.
  4. **Phase-space/Liouville:** Predominantly B on Q6, Q8. Entropy is coarse-graining; dynamics are reversible.
  5. **Whole-system:** Predominantly A on Q3, Q6, Q7. Demon+Gas entropy constant until decoupling; correlations store negentropy.

  **Diagnostic Notes**
  *Incoherent:* Claiming measurement costs energy (Q1A) but infinite tape works without cost (Q3A) is inconsistent unless distinguishing acquisition vs. storage. Claiming entropy is subjective (Q6B) but erasure costs heat (Q2A) requires Landauer's bridge (physical information).
  *Unexplored:* Q7C (Works forever) is generally ruled out by thermodynamics but tests dogmatism.
  *Leaf-pairs:* Hard to distinguish Phase-space vs. Whole-system on Q3; both agree global entropy holds. Distinguish via Q6 (Subjective vs. Physical correlation). Erasure vs. Measurement distinguished by Q3 (Reversible tape).
