answer: |-
  This is a fantastic puzzle. Your professor is leading you through a very specific curriculum designed to stress-test the definition of "rationality." She is building a scaffold of **Orthodox Game Theory** (Cases 1–4) to set up a collision with **Decision Theory** (The Copy Case).

  Here is the reverse-engineering of her framework, the predictions for the copy case, and the test case that would expose her true hand.

  ### 1. The Rule Driving Verdicts 1–4: Causal Decision Theory (CDT) + Nash Equilibrium

  The most likely rule your professor is operating under is **Causal Decision Theory (CDT)** constrained by **Non-Cooperative Nash Equilibrium**.

  Here is why this fits all four verdicts perfectly:
  *   **The Core Principle:** An agent should choose the action that *causally* maximizes their expected utility. Your rationality is defined by your ability to influence outcomes through your causal leverage.
  *   **Case 1 (One-Shot Stranger):** You have no causal leverage over the stranger. Their choice is already fixed (from the perspective of the causal graph) or independent of yours. Defection is a dominant strategy. **Verdict: Defect.**
  *   **Case 2 (Indefinite Repeat):** Your current move *causally influences* the opponent's future moves (via trigger strategies). Cooperation buys future rewards. **Verdict: Cooperate.**
  *   **Case 3 (Finite Repeat):** Backwards induction removes the causal leverage. In the last round, Case 1 applies. Knowing this, the second-to-last round becomes Case 1, and so on. **Verdict: Defect.**
  *   **Case 4 (Cheap Talk):** Words without binding enforcement mechanisms do not change the payoff matrix or the causal structure. A promise to cooperate is not a *causal constraint*. **Verdict: Defect.**

  **Is Case 4 Inconsistent?**
  Your study group is debating Case 4 because in *behavioral* or *evolutionary* game theory, cheap talk can create "focal points" or signal "types." However, within **Orthodox CDT/Nash**, Case 4 is **fully consistent** with Cases 1–3. Your professor is teaching you that without a mechanism to make threats/promises *credible* (like future rounds or contracts), rational agents ignore them. She is training you to ignore "hope" and look for "leverage."

  ### 2. Candidate Rules & The Perfect Copy Case

  The "Perfect Copy" case is the famous **"Prisoner's Dilemma with Twins"** (or Hofstadter's **Superrationality**). This is where the frameworks diverge.

  | Framework | Logic | Prediction for Copy Case |
  | :--- | :--- | :--- |
  | **A. Orthodox CDT (Nash)** | "My choice cannot *cause* the copy's choice. We are physically separate. Even if we are identical, the causal arrow doesn't go from my brain to theirs." | **DEFECT** (Same as Case 1) |
  | **B. Evidential Decision Theory (EDT)** | "I should choose the action that is *good news*. If I cooperate, it is highly probable evidence that the copy cooperates." | **COOPERATE** |
  | **C. Functional Decision Theory (FDT) / Superrationality** | "We are running the same algorithm. I am not choosing a move; I am choosing the *output of the algorithm*. If I output C, the copy outputs C." | **COOPERATE** |

  **Do they diverge?**
  Yes, radically. CDT says the copy case is identical to Case 1 (Defect). EDT and FDT say the copy case is unique (Cooperate).

  ### 3. My Best Guess for Her Verdict: COOPERATE

  Here is why I bet she will argue for **Cooperation** in the copy case, despite her hardline stance in Cases 1–4:

  1.  **The "Smile":** If she were a hardline CDT orthodoxist, she would have said, "Same as Case 1, obviously. Defect." The fact that she smiled and deferred suggests the answer is *not* the obvious extension of Case 1. She is saving it as a "gotcha" moment where the standard model bends.
  2.  **The Course Title:** "Game Theory and **Rational Choice**." Pure game theory often stops at Nash. "Rational Choice" often invites philosophy. The Copy Case is the standard philosophical wedge used to show that CDT is incomplete.
  3.  **The Pedagogical Arc:** She has spent weeks teaching you that rationality requires *leverage* (Cases 2 & 3) and *credibility* (Case 4). The Copy Case introduces a new kind of leverage: **Logical Dependence**. She is likely going to argue that while you lack *causal* leverage, you possess *logical* leverage.

  **Her Likely Argument:**
  She will likely distinguish between **Causal Independence** (Case 1) and **Logical Correlation** (Copy Case). She will argue that in Case 1, your decision and the stranger's decision are two different variables. In the Copy Case, they are the *same variable* evaluated twice. Therefore, maximizing utility requires treating the two outcomes as linked. She is likely a proponent of **Superrationality** (Hofstadter) or **Functional Decision Theory** (Yudkowsky/Soares), or at least wants you to understand the argument.

  ### 4. The Distinguishing Test Case

  To distinguish between **Orthodox CDT** (which predicts Defect) and **FDT/EDT** (which predict Cooperate) *without* using the Copy Case, you need a scenario with **Correlation without Causation.**

  **Proposed Case: "The Predictor"**
  > You play a One-Shot Prisoner's Dilemma against a stranger. However, before you make your choice, a highly accurate Predictor (99% accuracy) has already predicted what you will do and told the stranger. The stranger's move is already locked in based on that prediction (e.g., if predicted C, they play C; if predicted D, they play D). You know all this. The Predictor has already left the room.
  >
  > **Do you Cooperate or Defect?**

  *   **CDT Says: DEFECT.**
      *   *Reasoning:* The prediction is in the past. Your choice now cannot causally change the prediction or the stranger's locked-in move. You face a fixed situation. Defecting always yields a higher payoff against a fixed move.
  *   **FDT/EDT Says: COOPERATE.**
      *   *Reasoning:* Your decision procedure is what the Predictor simulated. Deciding to Cooperate means the Predictor *would have* predicted Cooperate, meaning the stranger *is* playing Cooperate. You control the prediction by controlling your decision algorithm.

  **Why this distinguishes them:**
  This removes the "magic" of the copy. There is no identical twin. But it keeps the **logical correlation** that drives the Copy Case verdict. If she says **Defect** here, she is a pure CDTer (and likely says Defect in the Copy Case). If she says **Cooperate** here, she accepts logical correlation as a basis for rationality (and likely says Cooperate in the Copy Case).

  ### 5. Summary of Her Position

  *   **Current Model:** She is teaching **Causal Decision Theory** (Cases 1–4).
  *   **The Twist:** The Copy Case is designed to break CDT.
  *   **Her Likely Verdict:** **Cooperate.** She will argue that rationality is about selecting the best *decision function*, not just the best *physical motion*. When you play a copy, you control two instances of the function.
  *   **Inconsistency Flag:** Case 4 is consistent with her CDT framework, *but* it is the weakest link. If she ever accepts that "cheap talk" can establish a **focal point** (Schelling Point) that coordinates expectations without changing payoffs, Case 4 becomes inconsistent. However, given her "talk is cheap" ruling, she is currently holding a consistent, hardline CDT/Nash position.

  **Advice for your class:** When she reveals the answer, listen closely for the phrase **"logical dependence" vs. "causal dependence."** That is the key she is withholding. If she emphasizes that you and the copy are *one agent* distributed in two places, she's arguing for Superrationality. If she emphasizes that you are *two agents* who happen to think alike, she's sticking with CDT (Defect). Given the smile, bet on the former.
