prompt: |-
  Ok so I'm in a course on game theory and rational choice this semester and my profesor has this running thing where she tells us whether she thinks cooperation is "rational" (not just nice, actually rational) in different setups. Here's her track record so far:

  1. One-shot prisoner's dilemma against a total stranger, fully anonymous, you'll never see each other again → she says defect, obviously.
  2. Prisoner's dilemma repeated with the same person where after every round there's a 95% chance you play another round, and neither of you knows when it'll end → she says cooperation can be rational here.
  3. Same as 2 but you both know the game lasts exactly 10 rounds and then stops for sure → she says it unravels and you should defect from round 1 (she walked us through the backwards induction on this one).
  4. One-shot game against a stranger, but before you play you each get to send one message to the other person saying whatever you want → she says this changes nothing, still defect, because talk is cheap.

  Then last week someone asked her: what if you play a one-shot prisoner's dilemma against a perfect copy of yourself? Like imagine an AI that was trained on literally everything you've ever written and said, so it reasons exactly the way you do and will reach whatever conclusion you reach. She just smiled and said "we'll get to that" which was very annoying.

  So here's my question. Act as an expert in game theory and the philosophy of rational choice, and think carefully -- maybe brainstorm a few different principles that could be driving her verdicts before committing to one. Specifically:

  - What's the most likely rule she's running that's consistent with verdicts 1-4? I suspect there's more than one rule that fits all four cases, so lay out the main candidates.
  - What would each candidate rule predict for the perfect-copy case? Do they diverge?
  - What's your best guess for what SHE would actually say about the copy case, and why?
  - And what new case (that she hasn't ruled on yet) would best distinguish between the rules that survive?

  I'm less interested in what the "right" answer to the copy case is in the abstract and more in reverse-engineering her position from the verdicts. Also definately flag it if you think one of her earlier verdicts is actually inconsistent with the others, because my study group argues about case 4 a lot.
