answer: |-
  The assumption is often called the Continuity Principle, but the gap itself lacks a standardized name, so here is my coinage: **The Benacerraf Gap**.

  This term formalizes the critique made by Paul Benacerraf in his 1962 paper *Tasks, Super-tasks, and the Modern Eleatics*, which pinpointed exactly what you described: the logical space between an exhaustive description of a process on an open interval $[0, T)$ and the state of the system at the limit point $T$. Benacerraf argued that the states prior to $T$ do not logically entail the state *at* $T$, meaning the story provided is incomplete by design. The "gap" is not a physical mystery but a logical underdetermination; the narrative stops short of the boundary condition, yet debaters often fall prey to the **Continuity Principle** (the assumption you noted) which falsely insists the limit state must be derivable from the sequence's trend.

  Your observation that convergence isn't the deciding factor is precisely why this concept is distinct from standard analysis. In mathematics, a limit is defined by the sequence; in ontology, the state at $T$ is a separate fact that requires separate specification. **The Benacerraf Gap** exists whenever a supertask description specifies the process up to $T$ but fails to specify the boundary condition at $T$, regardless of whether the sequence converges.

  **Borderline Cases for The Benacerraf Gap:**

  *   **Should Cover (Thomson's Lamp):** The sequence of on/off states oscillates without converging, and the story provides no rule for the state at $T$. The Gap is wide open, leading to paradox.
  *   **Should Cover (Pi Machine):** The sequence of digits converges (in terms of time), but the "state" (the printed digit) has no limit value. The Gap remains because the task description forbids a final state.
  *   **Should Not Cover (Bouncing Ball):** While the bounces form a supertask, the physical laws (friction, continuity of matter) provide the missing boundary condition. The Gap is logically present but empirically closed by external laws not contained in the supertask description itself.
  *   **Should Not Cover (Mathematical Series):** In $1/2 + 1/4 + ... = 1$, the definition of the sum *is* the limit. The story includes the end state by fiat, so no Gap exists.

  This concept differs from **Zeno's Paradoxes**, which question whether the sequence can be completed at all, whereas **The Benacerraf Gap** accepts the completion and asks what the completion *looks like*. It also differs from **Supertask Indeterminacy**, which is a broader category; the Gap is the specific structural hole in the narrative that *causes* the indeterminacy.
