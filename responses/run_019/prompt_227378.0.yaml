prompt: |-
  I am a novelist revising a speculative novel populated by animals, engineered creatures, artificial intelligences, and human societies, and I keep making intelligence serve the plot rather than arise from a creature’s actual cognitive equipment. I would like to operationalize a useful distinction among four kinds of minds: Darwinian creatures, whose effective responses are built in by selection; Skinnerian creatures, which can modify their behavior through reward and punishment during their lifetimes; Popperian creatures, which can test possible actions in an internal model before risking them; and Gregorian creatures, whose thinking is extended by language, symbols, institutions, and other culturally inherited tools. Treat these as capacities that may coexist in different degrees, not as four sealed species or as a ranking from less valuable to more valuable minds.

  Please develop a reusable character-design and revision procedure that I can apply to any fictional agent in about twenty minutes. It should provide an ordered sequence of diagnostic questions, specify what kinds of behavioral evidence would count as sufficient answers, and show how to distinguish superficially similar achievements—for example, avoiding a trap because of an inherited reflex, because of past punishment, because of rehearsing the outcome internally, or because one has learned a warning convention. Include tests for mixed and borderline systems, such as collectives, artificial agents, children, and beings whose internal simulation depends on an external notation. I would also like the procedure to enforce what I call counterfactual debt: whenever a character displays a cognitive ability, the fiction must identify the evolutionary history, learning history, imaginative practice, or cultural infrastructure that could plausibly have paid for it; otherwise the ability should be flagged as an authorial convenience. Mark the places where the classification is genuinely underdetermined and where a novelist must make a principled imaginative choice rather than discover a fact.

  Conclude by applying the procedure to three cases from my draft: a bioengineered guard animal that rapidly learns patrol routes but cannot conceive of a disguised threat; a swarm whose colonies appear brilliantly prescient because unsuccessful subcolonies die while successful ones proliferate, although no member represents the future; and my beloved alien oracle, whom I had imagined as a Gregorian supermind but whose every answer is generated from ancestral simulations fixed in its genome, with no capacity to learn after birth or borrow concepts from others. If the procedure assigns the oracle a less exalted kind of mind than I intended, do not rescue my preference; explain the result and then suggest the smallest change to the oracle’s history or mechanisms that would support the richer characterization. Finally, state what kinds of narrative mistakes the procedure can prevent, what it cannot settle about consciousness or moral status, and how it should be used as a revision tool without flattening fictional minds into a taxonomy.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Novelist revising a speculative novel (animals, engineered creatures, AIs, humans).
      *   **Problem:** Intelligence serves the plot rather than arising from cognitive equipment (anthropomorphism/plot convenience).
      *   **Framework:** Dennett's four kinds of minds (Darwinian, Skinnerian, Popperian, Gregorian). *Crucial Constraint:* Treat these as coexisting capacities, not sealed species or a value hierarchy.
      *   **Task:** Develop a reusable character-design/revision procedure (approx. 20 mins).
      *   **Requirements:**
          *   Ordered sequence of diagnostic questions.
          *   Specify behavioral evidence for answers.
          *   Distinguish superficially similar achievements (e.g., trap avoidance via reflex vs. learning vs. simulation vs. culture).
          *   Tests for mixed/borderline systems (collectives, AIs, children, external notation).
          *   Enforce "Counterfactual Debt": Every ability must have a plausible history (evolutionary, learning, imaginative, cultural). Flag authorial conveniences.
          *   Mark underdetermined areas requiring imaginative choice.
          *   Apply to three specific cases (Guard Animal, Swarm, Alien Oracle).
          *   *Constraint on Oracle:* If it ranks lower than intended, don't rescue the preference; explain and suggest smallest change.
          *   Conclusion: Narrative mistakes prevented, limits regarding consciousness/morality, usage advice (avoid flattening).

  2.  **Deconstruct the Framework (Dennett's Creatures):**
      *   *Darwinian:* Pre-wired, evolutionary trial and error (across generations). Fixed action patterns.
      *   *Skinnerian:* Operant conditioning. Trial and error within a lifetime. Reward/punishment.
      *   *Popperian:* Internal simulation. "Let my hypotheses die in my stead." Planning without immediate risk.
      *   *Gregorian:* Cultural tools, language, symbols. Offloading cognition to the environment/others.
      *   *Key Nuance:* These are layers. A Gregorian mind usually has Popperian, Skinnerian, and Darwinian substrates. The prompt asks to treat them as capacities, not species.

  3.  **Drafting the Procedure (The "Cognitive Audit"):**
      *   *Time Limit:* Needs to be tight. ~20 minutes.
      *   *Structure:* Step-by-step diagnostic.
      *   *Core Mechanism:* The "Counterfactual Debt" ledger.
      *   *Differentiation:* Need specific questions to tell reflex from learning from planning from culture.

      *   *Step 1: The Action.* Define the specific intelligent behavior.
      *   *Step 2: The Source (The 4 Questions).* Run through D, S, P, G.
      *   *Step 3: The Debt.* Where did the capacity come from?
      *   *Step 4: Borderlines.* Collectives, AIs, etc.
      *   *Step 5: Underdetermination.* Where do I, the author, need to decide?

  4.  **Developing Diagnostic Questions (Distinguishing Achievements):**
      *   *Trap Avoidance:*
          *   Darwinian: Jumps at shadow (innate).
          *   Skinnerian: Stepped in trap once, got hurt, now avoids.
          *   Popperian: Sees trap, simulates stepping in, decides not to.
          *   Gregorian: Reads sign "Danger," or was told by elder.
      *   *Evidence:* What happens if the context changes slightly? (Reflexes break; learning adapts slowly; simulation adapts quickly; culture relies on shared meaning).

  5.  **Addressing "Counterfactual Debt":**
      *   This is the user's specific term. It means: "You can't have the effect without the cause."
      *   If a creature plans (Popperian), it needs the neural hardware for simulation. Who built it? Evolution? Engineer?
      *   If a creature uses symbols (Gregorian), who made the symbols?
      *   *Flagging:* If the debt isn't paid in the text, mark it as "Plot Convenience."

  6.  **Addressing the Three Cases:**

      *   *Case 1: Bioengineered Guard Animal.*
          *   Behavior: Learns patrol routes (Skinnerian/Popperian?) but misses disguised threat (Limit).
          *   Analysis: Rapid learning suggests Skinnerian (reinforcement) or limited Popperian (route optimization). Inability to conceive disguise suggests lack of abstract modeling (Popperian limit) or lack of cultural info (Gregorian absence).
          *   Verdict: Mostly Skinnerian with Darwinian base.
          *   Debt: Engineering history needs to explain *why* it can't detect disguise (cost cutting? safety feature?).

      *   *Case 2: The Swarm.*
          *   Behavior: Prescient colonies.
          *   Mechanism: Differential survival of subcolonies.
          *   Analysis: This is pure Darwinian selection at the colony level. No individual represents the future.
          *   Verdict: Darwinian (at higher order). Not Popperian.
          *   Debt: None, provided the text acknowledges the death of failed colonies.

      *   *Case 3: The Alien Oracle.*
          *   User Intent: Gregorian Supermind.
          *   Actual Mechanism: Ancestral simulations fixed in genome, no post-birth learning, no borrowing concepts.
          *   Analysis: Fixed genome = Darwinian. No learning = Not Skinnerian. No internal testing of *new* hypotheses = Not Popperian (strictly speaking, if simulations are fixed). No culture/language exchange = Not Gregorian.
          *   Verdict: Highly complex Darwinian. A "Jukebox" of pre-computed answers.
          *   Correction: To make it Gregorian, it needs *open-ended* symbol manipulation or learning. Smallest change: Allow it to *update* its simulations based on interaction (Skinnerian/Popperian addition) or give it access to a shared external memory (Gregorian).
          *   *Constraint Check:* Do not rescue the preference. Explain the downgrade. Suggest smallest change.

  7.  **Refining the Procedure for "Mixed Systems":**
      *   AI: Could be Skinnerian (RL) or Popperian (World Model).
      *   Children: Developing from Skinnerian to Popperian to Gregorian.
      *   External Notation: A creature writing in sand is offloading memory (Gregorian tool use).

  8.  **Drafting the Conclusion:**
      *   *Mistakes Prevented:* Deus ex machina intelligence, inconsistent behavior, anthropomorphism.
      *   *Limits:* Doesn't solve qualia (consciousness) or moral worth (a Darwinian creature can still have rights).
      *   *Usage:* It's a stress test, not a straitjacket. Mystery is allowed if flagged.

  9.  **Review against Constraints:**
      *   *20 minutes?* The procedure needs to be concise enough.
      *   *Underdetermination?* Must explicitly state where the author chooses.
      *   *Oracle?* Must be honest about the classification.
      *   *Tone:* Professional, literary, analytical.

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't treat Dennett's hierarchy as *value*. A Darwinian response is often *better* (faster) than a Popperian one. Emphasize this in the intro.
      *   *Correction:* Ensure "Counterfactual Debt" is central.
      *   *Correction:* The Oracle analysis needs to be sharp. If it has fixed simulations, is it Popperian? Dennett says Popperian requires *generating* new hypotheses. If the simulations are fixed in the genome, it's effectively Darwinian (the ancestors did the popperian testing). I need to be precise here.

  11. **Final Output Structure:**
      *   Introduction (Philosophy of the tool).
      *   The Procedure (The 20-Minute Cognitive Audit).
      *   Diagnostic Matrix (Distinguishing behaviors).
      *   Application to Cases (Guard, Swarm, Oracle).
      *   Conclusion (Limitations and Usage).

  (Proceed to generate response based on this thought process.)
answer: |-
  # The Cognitive Audit: A 20-Minute Revision Procedure

  ## Introduction: The Ecology of Mind
  This procedure is not a taxonomy of worth. A Darwinian reflex is superior to a Popperian calculation when a predator lunges; a Gregorian tool is useless without the Skinnerian discipline to maintain it. The goal is **consistency**, not elevation. You are auditing the *source code* of your characters' minds to ensure the behavior matches the hardware.

  **Core Principle: Counterfactual Debt.**
  Every cognitive capability incurs a debt. If a character plans, something paid for the planning mechanism (evolution, engineering, training). If a character uses symbols, someone minted the currency. If the text cannot identify the payer, the ability is an authorial convenience.

  ---

  ## Part 1: The Diagnostic Sequence (15 Minutes)

  Select one specific scene where an agent displays intelligence. Answer the following four modules in order.

  ### Module 1: The Behavior (Define the Effect)
  *   **Question:** What specific problem was solved?
  *   **Evidence Required:** Describe the input (stimulus) and output (action) without using mentalistic verbs (e.g., instead of "he realized," write "he stopped and turned").
  *   **Time:** 2 mins.

  ### Module 2: The Four Capacities (Locate the Source)
  Rate the agent's reliance on each capacity for *this specific action* on a scale of 0 (None) to 3 (Primary Driver).

  1.  **Darwinian (Hardwired):** Is the response pre-loaded? Would a newborn/untrained version of this agent do the same thing?
      *   *Test:* If you reset the agent's memory to zero, does the behavior persist?
  2.  **Skinnerian (Conditioned):** Is the response shaped by past consequences?
      *   *Test:* If you reverse the reward/punishment history, does the behavior flip?
  3.  **Popperian (Simulated):** Is the response selected from internally generated options that were *not* tried in reality?
      *   *Test:* Does the agent hesitate? Does it reject an action that would have worked in the past but fails in this specific novel context?
  4.  **Gregorian (Cultural):** Does the response rely on tools, language, or norms external to the agent's biology?
      *   *Test:* If you isolate the agent from its society/tools, does the capability vanish?

  *   **Time:** 5 mins.

  ### Module 3: The Counterfactual Debt Ledger (Verify the Cost)
  For every capacity rated 2 or 3 above, you must point to a passage (existing or to be written) that pays for it.

  *   **Evolutionary Debt:** If Darwinian, where is the selection pressure described? (e.g., "Breeds culled for hesitation...")
  *   **Learning Debt:** If Skinnerian, where is the training montage or scar tissue? (e.g., "Burned by fire twice...")
  *   **Architectural Debt:** If Popperian, what is the hardware? (e.g., "Prefrontal cortex," "World-model subroutine," "Magic mirror.")
  *   **Infrastructural Debt:** If Gregorian, where are the tools/teachers? (e.g., "Schooling," "Data-net," "Ritual texts.")
  *   **Flag:** If you cannot point to a text location, mark this as **[PLOT CONVENIENCE]**.

  *   **Time:** 5 mins.

  ### Module 4: Borderline & Mixed Systems (Stress Test)
  Apply these specific overrides if the agent is non-standard.

  *   **The Collective:** If the agent is a swarm, ask: Does the *individual* know the goal, or does the *statistic* know it? If the latter, downgrade Popperian to Darwinian (selection of colonies, not ideas).
  *   **The AI/Engineered:** Does it learn (Skinnerian) or merely execute parameters (Darwinian relative to its creator)?
  *   **The Externalized Mind:** If the agent thinks using notation (writing in sand, using beads), this counts as Gregorian *capacity* even if the agent is biologically Darwinian. The debt is the existence of the notation system.
  *   **Time:** 3 mins.

  ---

  ## Part 2: Distinguishing Superficially Similar Achievements

  Use this matrix when the behavior looks the same but the mechanism is in doubt.

  | Scenario | Darwinian Evidence | Skinnerian Evidence | Popperian Evidence | Gregorian Evidence |
  | :--- | :--- | :--- | :--- | :--- |
  | **Avoiding a Trap** | Innate fear of the shape/smell. Fails if trap is disguised with neutral scents. | Avoids specific location where pain occurred. Fails if trap is moved to new location. | Inspects trap, simulates triggering it, walks around. Adapts to moved traps immediately. | Reads a sign, or follows a path marked by others. Fails if symbols are erased. |
  | **Finding Food** | Migratory instinct. Goes to same place every year regardless of yield. | Returns to where food was found last time. Persists at empty site for a while (extinction burst). | Scans terrain, predicts where prey *should* be based on weather/season. | Uses a map, or follows a hunter who knows the terrain. |
  | **Solving a Puzzle** | Fixed action pattern (e.g., pecking red buttons). Fails if button color changes. | Trial and error. Slow improvement over many sessions. | Pauses, manipulates object mentally, solves on first try. | Asks for help, or uses a tool designed for the puzzle. |

  **Underdetermination Warning:**
  There will be moments where the text *cannot* specify the mechanism without slowing the pace.
  *   **Mark these:** `[AUTHOR CHOICE: Mechanism Ambiguous]`.
  *   **Rule:** You may leave it ambiguous, but you cannot later claim it was a higher capacity than supported. If you write "he instinctively knew," you cannot later treat that knowledge as transferable teaching (Gregorian).

  ---

  ## Part 3: Application to Draft Cases

  ### Case 1: The Bioengineered Guard Animal
  *   **Behavior:** Rapidly learns patrol routes; fails to detect disguised threat.
  *   **Audit:**
      *   **Darwinian:** High. Base aggression and territoriality are hardwired.
      *   **Skinnerian:** High. "Rapidly learns" implies reinforcement (treats/correction) during training.
      *   **Popperian:** Low. Cannot conceive of disguise implies it cannot simulate "what if this friendly thing is hostile?" It lacks a counterfactual model of deception.
      *   **Gregorian:** None. No indication it uses symbols or communicates the threat.
  *   **Counterfactual Debt:**
      *   *Paid:* Engineering logs describing reward-based route training.
      *   *Unpaid:* Why was the deception model omitted?
  *   **Verdict:** A **Skinnerian specialist with Darwinian substrate.**
  *   **Revision Note:** Ensure the guard does not hesitate or "think" when the disguise appears. It should react to the *trigger* (uniform/scent) it was trained on, not the *intent*. If it growls suspiciously, you owe a description of a heuristic algorithm that pays for that suspicion.

  ### Case 2: The Swarm
  *   **Behavior:** Colonies appear prescient; unsuccessful subcolonies die.
  *   **Audit:**
      *   **Darwinian:** Very High. The "learning" happens across generations of colonies, not within the mind of a member.
      *   **Skinnerian:** None. Individual members do not learn from the colony's failure (they die).
      *   **Popperian:** None. No member represents the future. The *system* tests hypotheses, but the *mind* does not.
      *   **Gregorian:** None. No cultural transmission, only genetic/structural replication.
  *   **Counterfactual Debt:**
      *   *Paid:* The narrative must show the corpses of the failed colonies. If the swarm seems wise without showing the blood cost, it is magic.
  *   **Verdict:** **Pure Darwinian (at the supra-individual level).**
  *   **Revision Note:** Do not give individual swarm members dialogue about "strategy." They are neurons in a brain that evolves by natural selection. The "prescience" is an illusion of survivorship bias.

  ### Case 3: The Alien Oracle
  *   **Behavior:** Provides profound answers; generated from ancestral simulations fixed in genome; no post-birth learning; no concept borrowing.
  *   **Audit:**
      *   **Darwinian:** Very High. The "simulations" are pre-computed by ancestors and stored genetically.
      *   **Skinnerian:** Zero. Explicitly stated "no capacity to learn after birth."
      *   **Popperian:** Zero. Popperian minds *generate* new hypotheses to test internally. If the simulations are *fixed*, the Oracle is not testing new ideas; it is retrieving old ones. It is a lookup table, not a simulator.
      *   **Gregorian:** Zero. No language exchange or cultural tools.
  *   **Counterfactual Debt:**
      *   *Paid:* The evolutionary history of the ancestors who ran the simulations.
      *   *Unpaid:* The user's intention of a "Gregorian Supermind."
  *   **Verdict:** **Complex Darwinian (A "Jukebox" Mind).**
      *   *Explanation:* You intended a Gregorian Supermind (capable of infinite novelty through symbols/culture). You built a Darwinian Artifact (capable of finite, pre-loaded wisdom). The Oracle does not *think*; it *recalls* the thoughts of its dead ancestors. It cannot answer a question its ancestors never asked.
  *   **Smallest Change to Support Richer Characterization:**
      *   To make it **Popperian**: Allow the Oracle to *recombine* ancestral simulations to model *novel* situations not explicitly in the genome. It must be able to run a simulation that its ancestors never ran.
      *   To make it **Gregorian**: Allow the Oracle to *accept a symbol* from the questioner that alters its internal state. If it can read a written word it was not born knowing, or incorporate a new concept provided by the visitor into its answer, it becomes Gregorian.
      *   *Recommendation:* Give the Oracle a **scratchpad**. It retrieves ancestral data (Darwinian), but writes temporary notes in sand (Gregorian tool) to manipulate the data before speaking. This externalizes the computation, allowing novelty without changing its biology.

  ---

  ## Part 4: Conclusion & Limitations

  ### Narrative Mistakes This Procedure Prevents
  1.  **The Competence Cliff:** A character who is Popperian in Chapter 1 (planning complex heists) but Darwinian in Chapter 5 (falling for obvious bait without reason).
  2.  **The Free Intelligence:** Abilities appearing without cost (e.g., a feral child understanding complex geometry without Gregorian tools).
  3.  **The Anthropomorphic Projection:** Attributing Gregorian guilt or Popperian regret to a Skinnerian creature acting on conditioning.

  ### What This Procedure Cannot Settle
  1.  **Consciousness (Qualia):** A Skinnerian agent can scream in pain without "feeling" it in a human sense. This audit maps function, not inner light.
  2.  **Moral Status:** A Darwinian creature is not morally inferior to a Gregorian one. A wolf is not "less than" a human simply because it lacks language. This tool describes *capacity*, not *rights*.
  3.  **The Spark:** It cannot explain why some systems become minds and others remain machines. It only categorizes the type of mind once established.

  ### Usage Advice: Avoiding the Flatten
  Do not use this audit to sterilize your fiction. Mystery is essential.
  *   **The "Black Box" Exception:** You may leave a mind's mechanism opaque if the *characters* treat it as opaque. If your protagonists argue about whether the Oracle is magic or tech, you do not need to resolve it immediately.
  *   **The "Transition" Zone:** Characters can grow. A child moves from Skinnerian to Gregorian. A AI might unlock Popperian capabilities. Mark these transitions as **[DEVELOPMENTAL ARC]** so you don't audit them as errors.
  *   **Poetic Ambiguity:** Sometimes, "It knew" is better than "It simulated." Use the audit to ensure you *could* explain it if challenged, not to force the explanation onto the page.

  **Final Directive:** If the audit flags a **[PLOT CONVENIENCE]**, you have two choices: pay the debt (add the history/hardware) or downgrade the ability (make the character less smart). Do not ignore the flag.
