answer: |-
  The practice presupposes the Church–Turing thesis holds the epistemic status of a constitutive methodological norm justified by empirical convergence, rather than a mere definition or a falsifiable hypothesis. The field cannot get by with a purely stipulative reading of "effectively computable" because practitioners accept informal algorithms as computable without demanding formal translations into Turing machines, implying a substantive belief that the intuitive notion of effective calculation coincides with the formal model rather than merely defining it away. While viewing the thesis as a physical law fits well with the dismissal of hypercomputation, the practice does not rely on it being falsifiable; it relies on the thesis functioning as a stable boundary for what counts as an algorithm, treating the halting problem as a logical impossibility rather than a contingent physical limitation. However, the treatment of complexity classes and physical computation does commit the field to an empirical claim, as asserting that polynomial time is robust across models presupposes that these abstract models accurately bound physical reality, not just mathematical consistency. If the thesis were treated as an open empirical hypothesis, the conduct of the field would shift from treating the halting problem as an absolute barrier to viewing it as an engineering challenge, necessitating active research into hypercomputation and requiring every algorithm to specify its physical model rather than assuming a canonical universal standard. Consequently, computability would become model-relative, dissolving the current distinction between what is uncomputable in principle versus what is merely infeasible in practice.
