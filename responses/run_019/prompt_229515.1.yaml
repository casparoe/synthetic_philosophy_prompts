prompt: |-
  I run the grantmaking side of a mid-sized family foundation. A surprising share of our commitments never reach a signed grant agreement: a program officer tells an applicant on a site visit that "we'll fund this next cycle," someone sends a one-line email saying we are "on board," a board member tells an organization at a dinner that the foundation "will stand behind them." Later the project goes sideways, or our priorities shift, or the organization turns out to have problems, and I have to decide which of these soft commitments we are morally bound to honor. These cases come up roughly monthly, the sums are small to midsize but large for the recipients, we usually have only a day or two to decide, and I cannot pull in counsel or a philosopher for each one. The people who would use the procedure are program officers without legal or philosophical training.

  From what I have read, philosophers treat promising as a distinctive kind of obligation and disagree about why it binds: some locate the wrong in breaking the act of assurance itself, some in the expectations the promisor knowingly invited, and some mainly in the reliance or harm that follows. I want that theory turned into a reusable decision procedure, not an essay. The procedure should be a checklist to run in order, with guidance on what counts as a sufficiently good answer to move to the next step. It should keep three questions strictly separate: (a) did we make a promise-like commitment at all, as opposed to a prediction, a statement of current intention, a hope, or fundraising politeness; (b) does that commitment bind us in the particular case; and (c) if it binds, may we still break or revise it, and what do we then owe the counterparty. It should also say clearly which steps are judgment calls that no checklist can eliminate, and where the procedure should stop and hand the decision to a person because it is a question of values rather than facts.

  Then apply the procedure to three cases: a senior program officer's verbal "we'll fund you next cycle" to a first-time applicant she met on a site visit; a board member's unauthorized dinner-table assurance that the foundation "will stand behind" an organization, after which the organization signs a lease in reliance; and a conditional pledge — "if we launch the fellowships program, your group will be first in line" — where we decide not to launch the program but the group spent months preparing an application because of the pledge. Make sure at least one case yields an answer I will not like. Please begin with the procedure itself, with no preface or commentary, then run the cases through it, and close with what the procedure cannot decide for us.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Runs grantmaking side of a mid-sized family foundation.
      *   **Problem:** Frequent "soft commitments" (verbal assurances, emails, board member comments) that don't reach signed agreements but create moral ambiguity. Need to decide which to honor.
      *   **Constraints:**
          *   Turn philosophical theory of promising into a reusable decision procedure (checklist).
          *   No preface or commentary before the procedure.
          *   Keep three questions strictly separate: (a) Was it a promise? (b) Does it bind? (c) If it binds, may we break/revise it & what is owed?
          *   Identify judgment calls/value questions where the procedure stops.
          *   Users are program officers (no legal/philosophical training).
          *   Time-sensitive (day or two).
          *   Apply to three specific cases.
          *   At least one case must yield an unwelcome answer.
          *   Close with what the procedure cannot decide.
      *   **Tone:** Practical, clear, actionable, ethically rigorous but not academic.

  2.  **Drafting the Procedure (The Checklist):**
      *   *Goal:* Translate philosophical theories (assurance, expectation, reliance) into steps.
      *   *Structure:*
          *   Phase 1: Identification (Was it a promise?).
          *   Phase 2: Binding Force (Does it bind?).
          *   Phase 3: Release/Remedy (Can we break it? What do we owe?).
          *   *Meta-layer:* Flagging judgment calls.
      *   *Content:*
          *   Phase 1 needs to distinguish promise from prediction/intention/politeness. Key criterion: Did the speaker intend to invite reliance/expectation of performance?
          *   Phase 2 needs to assess validity. Key criteria: Authority, Clarity, Conditions, Change of Circumstances.
          *   Phase 3 needs to assess overriding factors. Key criteria: Harm to foundation mission, Harm to recipient, Proportionality of remedy.
      *   *Formatting:* Numbered steps, Yes/No gates, "Stop and Escalate" points.

  3.  **Drafting the Case Applications:**
      *   *Case 1: PO verbal "we'll fund you next cycle" (Site Visit).*
          *   Analysis: Likely a prediction or intention, not a formal promise. PO authority? Usually limited.
          *   Outcome: Probably not binding.
      *   *Case 2: Board member unauthorized dinner assurance ("stand behind"), org signs lease.*
          *   Analysis: Board member authority? Usually no individual authority. "Stand behind" is vague. But reliance (lease) is high.
          *   Outcome: This is the tricky one. Philosophically, reliance creates obligation even if authority was lacking (negligence in allowing reliance). But foundation policy usually voids unauthorized commitments. To meet the "answer you will not like" constraint, I should probably argue that despite lack of authority, the reliance creates a moral debt, OR argue that the foundation is bound because the board member appeared authoritative. Let's aim for: It binds morally due to reliance, even if legally void. Or perhaps: It doesn't bind as a grant, but creates a duty to mitigate harm. Let's make the unwelcome answer be that the foundation *is* morally bound to cover the lease penalty or fund the grant despite the lack of authorization, because they allowed the reliance.
      *   *Case 3: Conditional pledge ("if we launch... you're first"), program not launched, group prepped.*
          *   Analysis: Condition failed (program not launched). So promise not triggered? But reliance occurred (prep work).
          *   Outcome: Promise not binding regarding the grant, but duty to compensate for reliance costs.
      *   *Selection for "Unwelcome Answer":* Case 2 is the best candidate. Foundations hate being bound by rogue board members. If the procedure says "You owe them because they relied on your agent," that's unwelcome. Or Case 1 where a PO's offhand comment creates a obligation. Let's make Case 2 the one where the foundation owes something significant despite the "unauthorized" status.

  4.  **Refining the Procedure (Iterative Polish):**
      *   Ensure the distinction between (a), (b), and (c) is sharp.
      *   Ensure "Judgment Call" flags are visible.
      *   Ensure it's usable by non-philosophers.
      *   *Self-Correction on Theory:* Need to incorporate the three theories mentioned (assurance, expectation, reliance) without getting bogged down.
          *   Step 1 (Assurance/Intent): Did they mean to commit?
          *   Step 2 (Expectation/Reliance): Did the recipient reasonably believe and act?
          *   Step 3 (Harm/Utility): What happens if we break it?
      *   *Constraint Check:* "No preface or commentary" before the procedure. Start directly with the title/checklist.

  5.  **Finalizing the Case Outcomes:**
      *   *Case 1 (PO):* Not a promise. No binding obligation. (Welcome/Neutral answer).
      *   *Case 2 (Board/Lease):* This needs to be the hard one. The board member lacked authority (usually), but the reliance is severe. The procedure should flag that while legal authority is missing, moral authority via reliance exists. Result: Moral obligation to mitigate harm (pay lease break fee), even if not the full grant. This might be unwelcome because it sets a precedent of paying for unauthorized acts.
      *   *Case 3 (Conditional):* Condition failed. No grant owed. But reliance costs (prep work) might be owed. Result: No grant, but offer stipend for prep time. (Moderate answer).
      *   *Wait, I need one answer the user "will not like".* The user runs the foundation. They probably want to avoid paying for unauthorized commitments. So Case 2 concluding "You must pay the lease penalty" is unwelcome. Or Case 1 concluding "You must fund them" because the PO had apparent authority. Let's go with Case 2: The procedure concludes the foundation is morally bound to cover the reliance costs (lease) despite the lack of authorization. This is unwelcome because it penalizes the foundation for a board member's rogue action.

  6.  **Review against Constraints:**
      *   Begin with procedure? Yes.
      *   No preface? Yes.
      *   Three questions separate? Yes (Phase 1, 2, 3).
      *   Identify judgment calls? Yes.
      *   Apply to three cases? Yes.
      *   At least one unwelcome answer? Yes (Case 2).
      *   Close with limitations? Yes.

  7.  **Final Polish of Procedure Text:**
      *   Make it look like a tool.
      *   Use bolding for steps.
      *   Ensure the "Stop and Escalate" points are clear for value judgments.

      *(Self-Correction during drafting)*: Make sure I don't sound like a lawyer. This is a *moral* procedure, not legal. Emphasize "Moral Obligation" vs "Legal Liability".

      *(Refining Case 2)*: To make it truly unwelcome, the procedure should suggest that the foundation should honor the *spirit* of the commitment (fund the org) or at least cover the specific harm (lease), despite the "unauthorized" label, because the foundation failed to control the board member's signaling. Let's go with covering the reliance harm (lease penalty) as a minimum moral duty.

      *(Refining Case 1)*: PO says "we'll fund this next cycle". This is often interpreted as "I will recommend," not "We will give." The procedure should clarify this distinction. Outcome: Not binding.

      *(Refining Case 3)*: Conditional pledge. Condition failed. But reliance happened. Outcome: No grant, but duty to compensate for wasted labor.

      *(Closing)*: What can't it decide? Trade-offs between mission and fidelity.

  8.  **Final Output Generation** (incorporating all thoughts).
answer: |-
  # MORAL COMMITMENT DECISION PROCEDURE

  **User:** Program Officers and Foundation Leadership
  **Purpose:** To determine moral obligation arising from informal commitments.
  **Note:** This procedure assesses *moral* duty, not legal liability. Legal counsel must be consulted separately for contract law.

  ---

  ## PHASE 1: IDENTIFICATION (Did we make a promise?)
  *Goal: Distinguish a moral promise from a prediction, intention, or politeness.*

  **Step 1.1: The Assurance Test**
  Did the speaker use language that invited the recipient to expect performance as a matter of right, rather than hope?
  *   **Yes:** Phrases like "We will," "You can count on," "We are committed to."
  *   **No:** Phrases like "We hope to," "I intend to recommend," "Looks promising," "We'll see."
  *   **Action:** If **No**, stop. There is no promise. (Record as "Expression of Interest"). If **Yes**, proceed to 1.2.

  **Step 1.2: The Authority Check**
  Did the speaker have actual or apparent authority to bind the foundation at that moment?
  *   **Actual:** Board-approved authority, written delegation, or established role capacity (e.g., ED making public statements).
  *   **Apparent:** Would a reasonable person in the recipient's position believe this person could commit the foundation? (Consider setting, title, past history).
  *   **Action:** If **No** on both, proceed to 1.3 (Caution). If **Yes**, proceed to 1.3.

  **Step 1.3: The Condition Check**
  Was the commitment explicitly conditional on future events (e.g., "if board approves," "if budget allows")?
  *   **Yes:** Identify the condition. If the condition failed, the promise was not triggered. Proceed to Phase 2, Step 2.4.
  *   **No:** Treat as unconditional. Proceed to Phase 2.

  > **JUDGMENT CALL FLAG:** Step 1.2 (Authority) and 1.3 (Conditions) often depend on context not captured in text. If the speaker's authority is ambiguous, **STOP** and escalate to Executive Director. Do not proceed until authority status is resolved.

  ---

  ## PHASE 2: BINDING FORCE (Does the commitment bind us?)
  *Goal: Determine if the promise creates a current moral obligation.*

  **Step 2.1: The Reliance Test**
  Did the recipient change their position based on this commitment?
  *   **Yes:** They incurred costs, turned down other funding, signed leases, hired staff.
  *   **No:** They merely felt hopeful or continued business as usual.
  *   **Action:** If **No**, the obligation is weak (based only on expectation). Proceed to 2.2. If **Yes**, the obligation is strong (based on harm prevention). Proceed to 2.2.

  **Step 2.2: The Reasonableness Test**
  Was the recipient's reliance reasonable given the foundation's usual processes?
  *   **Yes:** It is standard practice for your foundation to fund after such assurances, or the speaker is senior enough that reliance is standard.
  *   **No:** The foundation clearly states "no funding without signed agreement," or the assurance was explicitly marked "unofficial."
  *   **Action:** If **No**, the foundation is likely not bound. **STOP**. If **Yes**, proceed to 2.3.

  **Step 2.3: The Integrity Test**
  Would breaking this commitment damage the foundation's reputation for honesty among peers and applicants?
  *   **Yes:** The commitment was public, or known to many stakeholders.
  *   **No:** The commitment was private and obscure.
  *   **Action:** This is a weighting factor. High reputational risk increases binding force. Proceed to 2.4.

  **Step 2.4: The Condition Failure Check (If Step 1.3 was Yes)**
  If the condition failed (e.g., program not launched), did the foundation cause the failure in bad faith to avoid the promise?
  *   **Yes:** You canceled the program specifically to avoid funding them.
  *   **No:** Strategic shift, budget cuts, external factors.
  *   **Action:** If **Yes**, the promise binds despite the condition. If **No**, the grant promise is void, *but* proceed to Phase 3 to assess reliance costs.

  > **JUDGMENT CALL FLAG:** Step 2.2 (Reasonableness) is a value question. What is "reasonable" depends on your foundation's culture. If the PO is unsure, **STOP** and consult the ED. This is where policy meets practice.

  ---

  ## PHASE 3: RELEASE AND REMEDY (May we break it, and what do we owe?)
  *Goal: Determine if overriding factors allow release, and calculate damages.*

  **Step 3.1: The Harm Comparison**
  Compare the harm to the recipient if you break the promise vs. the harm to the foundation mission if you keep it.
  *   **Recipient Harm:** High (org closure, layoffs) vs. Low (inconvenience).
  *   **Foundation Harm:** High (mission drift, financial instability) vs. Low (budget variance).
  *   **Action:** If Foundation Harm > Recipient Harm, you may seek release. If Recipient Harm > Foundation Harm, you should honor the commitment.

  **Step 3.2: The Mitigation Duty**
  If you break the commitment (either because it doesn't bind or because Step 3.1 allows release), what do you owe?
  *   **If Phase 1 failed (Not a promise):** You owe courtesy and transparency (explain why not).
  *   **If Phase 2 failed (Unreasonable reliance):** You owe transparency and perhaps referral assistance.
  *   **If Phase 2 passed (Binding) but Step 3.1 allows release:** You owe **Reliance Damages**. You must compensate them for costs incurred *because* of your promise (e.g., non-refundable deposits, wasted staff time), even if you do not fund the full project.
  *   **If Phase 2 passed and Step 3.1 forbids release:** You owe **Performance**. You must fund the commitment.

  **Step 3.3: The Communication Requirement**
  Any decision to break a commitment requires a direct conversation (not email) explaining the reasoning, acknowledging the reliance, and offering the remedy identified in 3.2.

  > **JUDGMENT CALL FLAG:** Step 3.1 (Harm Comparison) is ultimately a value decision. The procedure identifies the stakes, but cannot weigh them. **STOP** and hand to Board/ED for final value judgment on mission drift vs. moral fidelity.

  ---

  ## CASE APPLICATIONS

  ### Case 1: The Program Officer's Verbal Assurance
  **Scenario:** Senior PO tells first-time applicant on site visit: "We'll fund this next cycle."
  **Phase 1:**
  *   1.1 (Assurance): "We'll fund" sounds like a promise, but context matters. In grantmaking, POs usually recommend, Boards decide. Ambiguous.
  *   1.2 (Authority): POs typically lack actual authority to commit funds without Board/Committee approval. Apparent authority? Maybe, to a first-time applicant.
  *   1.3 (Condition): Implicit condition exists ("next cycle" implies standard process).
  *   *Result:* Weak promise. Likely an expression of intention to recommend.
  **Phase 2:**
  *   2.1 (Reliance): Did the org spend money based *only* on this? Unlikely for a first-time applicant familiar with standard processes.
  *   2.2 (Reasonableness): Is it reasonable to rely on a PO without a letter of intent? No, standard practice requires written notice.
  *   *Result:* Commitment does not bind.
  **Phase 3:**
  *   3.2 (Remedy): Since Phase 2 failed, no reliance damages owed.
  *   *Action:* PO must clarify immediately that funding is not guaranteed until Board approval.
  **Outcome:** **No moral obligation to fund.** (Welcome/Neutral)

  ### Case 2: The Board Member's Dinner Assurance
  **Scenario:** Board member tells org at dinner: "Foundation will stand behind you." Org signs lease in reliance. Member had no authority to commit funds individually.
  **Phase 1:**
  *   1.1 (Assurance): "Stand behind" is vague but implies support.
  *   1.2 (Authority): No actual authority (individual board members cannot commit). *However*, apparent authority is high (Board members represent the foundation).
  *   *Judgment Call:* The foundation allowed this member to speak publicly without guardrails.
  **Phase 2:**
  *   2.1 (Reliance): High. Org signed a lease.
  *   2.2 (Reasonableness): Was it reasonable? Yes, because Board members are assumed to know foundation capacity. The foundation failed to signal otherwise.
  *   *Result:* Commitment binds morally due to negligent allowance of reliance, even if legally void.
  **Phase 3:**
  *   3.1 (Harm Comparison): Recipient Harm (lease liability, potential closure) is High. Foundation Harm (paying for unauthorized act) is Moderate (financial cost) but High (precedent risk).
  *   3.2 (Remedy): Since reliance was reasonable and induced by the foundation's agent, you owe **Reliance Damages**.
  *   *Action:* You are not necessarily bound to fund the full program (since "stand behind" is vague), but you are bound to cover the costs incurred due to the assurance (lease penalty or first year rent).
  **Outcome:** **Foundation must cover the lease costs.** (Unwelcome Answer: You must pay for a rogue board member's mistake).

  ### Case 3: The Conditional Pledge
  **Scenario:** "If we launch fellowships, you're first." Program not launched. Group spent months prepping application.
  **Phase 1:**
  *   1.1 (Assurance): Clear promise of priority.
  *   1.3 (Condition): Explicit ("If we launch").
  *   *Result:* Conditional promise.
  **Phase 2:**
  *   2.4 (Condition Failure): Did foundation cancel in bad faith? Assume No (strategic shift).
  *   *Result:* Grant promise is void.
  *   2.1 (Reliance): Group spent months preparing.
  *   2.2 (Reasonableness): Was it reasonable to prep fully before launch confirmation? Yes, if encouraged by the foundation to be "first in line."
  **Phase 3:**
  *   3.2 (Remedy): Grant not owed. However, reliance costs (staff time for prep) were induced by the foundation's encouragement.
  *   *Action:* Offer a stipend to cover the cost of the application preparation labor.
  **Outcome:** **No grant, but owe preparation costs.** (Moderate)

  ---

  ## WHAT THIS PROCEDURE CANNOT DECIDE

  This checklist isolates facts and logical steps, but it cannot resolve the following value conflicts. These must be decided by human leadership (ED or Board):

  1.  **Mission vs. Fidelity:** In Case 2, if covering the lease costs forces a reduction in grants to higher-priority beneficiaries, the procedure identifies the harm but cannot weigh whether fidelity to this one organization outweighs fidelity to the foundation's core mission.
  2.  **Precedent vs. Mercy:** The procedure may indicate a moral debt (Case 2), but paying it may set a precedent that encourages future reliance on unauthorized statements. The decision to absorb that systemic risk is a strategic value judgment, not a moral calculation.
  3.  **Defining "Reasonable":** Step 2.2 relies on a cultural norm. What is "reasonable reliance" changes based on how much the foundation values transparency versus relationship-building. The procedure flags this but cannot define the norm for you.
