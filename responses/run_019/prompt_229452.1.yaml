answer: |-
  Your instincts are excellent. You have spotted a genuine tension in the text, and the handout contains one major philosophical error regarding Moore's core methodology.

  Here is an audit of the handout based on *Principia Ethica* (1903), broken down by claim.

  ### 1. The Claim: "The only things good for their own sake are... friendship... and the enjoyment of beautiful objects."
  **Verdict: Mostly Accurate (with a caveat).**

  *   **What Moore says:** In Chapter VI ("The Ideal"), Moore explicitly writes: "By far the most valuable things, which we know or can imagine, are certain states of consciousness, which may be roughly described as the pleasures of human intercourse and the enjoyment of beautiful objects."
  *   **The Nuance:** Moore is careful to say these are the *greatest* goods we know of, not necessarily the *only* goods. He leaves the door open for other intrinsic goods, but these two are the heavy lifters in his system. The handout's use of "only" is a slight overstatement, but for a one-page summary, it is acceptable shorthand.

  ### 2. The Claim: "Beauty itself... is not intrinsically good... a great painting sealed in a vault... is no better than a blank canvas."
  **Verdict: Contested (You are right to remember the "Beautiful World" argument).**

  *   **What Moore says:** Generally, Moore argues that intrinsic value attaches to *states of consciousness*. A thing cannot be good unless there is a mind to appreciate it. This supports the handout's "vault" analogy.
  *   **The Contradiction:** However, in **Section 111** of *Principia Ethica*, Moore proposes the exact thought experiment you remember. He asks us to imagine two worlds: one exceedingly beautiful, one utterly filthy (a "heap of filth"). He specifies that **no human beings exist in either world to see them.**
  *   **Moore's Conclusion:** He writes, "I cannot help thinking that the world would be better... if it contained... beautiful things." He admits it is *better* that the beautiful world exist than the ugly one, even without observers.
  *   **The Audit:** The handout takes a hardline stance ("no better than a blank canvas") that ignores Moore's specific concession in the "Two Worlds" passage. Moore's position is actually inconsistent here: he generally ties value to consciousness, but admits the existence of beauty adds *some* value to the universe even unobserved. The handout simplifies this into a hard rule that Moore himself wavered on.

  ### 3. The Claim: "Knowledge and virtue are at best means to these two goods, never good in themselves."
  **Verdict: Accurate.**

  *   **What Moore says:** Moore is very strict here. He argues that knowledge is only good if the thing known is good (or if the *consciousness* of knowing it is pleasant). Virtue is defined as a disposition to do good; since the "good" is the outcome (the intrinsic goods), virtue is instrumental.
  *   **The Audit:** This is a fair summary. Moore rejects the idea that "Truth" or "Duty" are intrinsic goods independent of the conscious experience they produce.

  ### 4. The Claim: "Moore is wonderfully additive... the value of a whole is just the sum of the values of its parts."
  **Verdict: False. This is a major misrepresentation.**

  *   **What Moore says:** This is the most significant error in the handout. Moore is famous for the **Principle of Organic Unities**. In Chapter I, Section 18, he explicitly states: **"The value of a whole must not be assumed to be the same as the sum of the values of its parts."**
  *   **Why it matters:** Moore argues that when you combine two things (e.g., consciousness of beauty + the beauty itself), the resulting whole has a value that is not merely the arithmetic sum of the parts. Sometimes the whole is greater; sometimes the value of a part changes depending on the context of the whole.
  *   **The Audit:** To say Moore is "wonderfully additive" is to attribute to him the exact view he spent a significant portion of his book arguing *against*. While Moore is a utilitarian (he believes we should maximize the good), he believes the calculation is complex because of organic unities. You cannot simply "total the friendship and aesthetic enjoyment" as if they were independent coins in a jar; their value depends on the context of the whole experience.

  ### 5. The Claim: "Sizing up a possible world means totaling the friendship and aesthetic enjoyment it would contain."
  **Verdict: Misleading (due to the Additivity error).**

  *   **The Audit:** Because Moore rejects simple additivity, "sizing up a world" is not a matter of simple arithmetic. It requires judging the *wholes*. For example, Moore argues that feeling pleasure at something *evil* is a negative good (a bad thing), even though pleasure is usually good. You cannot just count the "pleasure units"; you have to evaluate the complex whole of "pleasure-taken-in-suffering." The handout implies a simple utilitarian calculus that Moore explicitly complicated.

  ### Summary for Your Class Context

  **Is the handout a fair compression?**
  It is a *pedagogical* compression, but it sacrifices accuracy on two key points to make the view easier to digest.

  1.  **The "Vault" vs. "Two Worlds":** The professor has chosen to emphasize Moore's "consciousness requirement" and ignore the "Two Worlds" exception. This is a common way to teach Moore to avoid confusing students with his inconsistency, but your memory of the text is correct: Moore did say the uninhabited beautiful world was better.
  2.  **Organic Unities:** The handout is objectively wrong here. Describing Moore as "additive" contradicts his central doctrine of Organic Unities.

  **How to approach this:**
  If you bring this up in class, you will look very well-prepared. You might ask:
  > "The handout describes Moore as additive, but I recall his Principle of Organic Unities argues that the value of a whole isn't the sum of its parts. Is the handout simplifying his utilitarianism, or is there a sense in which he treats these specific goods as additive?"

  And regarding the painting:
  > "In Section 111, Moore suggests the beautiful world is better than the ugly one even without observers. Does the handout's 'sealed vault' example override that passage, or is Moore's view that unobserved beauty has *some* value, just far less than observed beauty?"

  **Conclusion:** The handout gets the *list* of goods right (friendship/beauty) and the *status* of virtue right (instrumental), but it gets Moore's *metaphysics of value* (Organic Unities) backwards and oversimplifies his view on unobserved beauty. Your vague memory is serving you better than the handout.
