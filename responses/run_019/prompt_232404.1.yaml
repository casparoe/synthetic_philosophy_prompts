answer: |-
  # The "What Counts as Corruption?" Workshop Quiz

  **Instructions:** Read each scenario carefully. Choose the **one** statement that best reflects your personal judgment of the situation. There are no right or wrong answers; we are mapping how we define the problem, not solving the cases today.

  ### 1. The Nephew's Job
  The Mayor's nephew applies for a junior clerk position in City Hall. The hiring manual does not forbid hiring relatives. The nephew is qualified, but not the top candidate. The Mayor does not intervene directly, but the HR director knows the relationship.
  *   **A.** This is acceptable. As long as the manual wasn't violated and the nephew is qualified, the rules were followed.
  *   **B.** This is unethical. It undermines public trust because it suggests family connections matter more than merit, even if it's legal.
  *   **C.** This is normal. In a city this size, families look out for each other; refusing to hire a qualified nephew would be seen as hostile.

  ### 2. The Funeral Envelope
  A local contractor gives a cash envelope to a city inspector at the inspector's father's funeral. No permits are currently under review. The amount is consistent with local customs for condolence gifts.
  *   **A.** This is acceptable. It is a cultural ritual of mourning, not a transaction, provided no business is discussed.
  *   **B.** This is risky. Even if the intent is grief, it creates a record of financial transfer between regulated and regulator that looks suspicious.
  *   **C.** This is corruption. Cash should never change hands between these parties; it blurs the line between personal support and future obligation.

  ### 3. The Campaign Donation
  A developer donates the maximum legal amount to a City Councilor's campaign. Six months later, the Councilor votes to rezone land owned by that developer. The Councilor claims the vote was based on merit.
  *   **A.** This is acceptable. Donations are free speech, and the vote was legal. Assuming a quid pro quo without proof damages democracy.
  *   **B.** This is corruption. Even if legal, the timing creates a system where access is auctioned to the highest bidder, excluding ordinary citizens.
  *   **C.** This is unfortunate but distinct from corruption. The harm is in the inequality of influence, not necessarily a broken duty.

  ### 4. The Speedy Permit
  A small business owner asks a planning officer to "look at" their application sooner than the queue allows. They are old friends from high school. The officer does so, and no other applications are delayed significantly.
  *   **A.** This is acceptable. Discretion is part of the job, and helping a friend within the bounds of capacity is human nature.
  *   **B.** This is unethical. Public resources must be distributed strictly by queue; favoritism erodes confidence in the system's fairness.
  *   **C.** This is corruption. Any deviation from the standard process for personal reasons is an abuse of public office.

  ### 5. The Post-Surgery Gift
  A nurse receives a basket of expensive fruit and a thank-you card from a patient's family two weeks after a successful surgery. Hospital policy discourages gifts over $50 but does not strictly forbid them.
  *   **A.** This is acceptable. It is a gesture of gratitude after the fact, not an inducement for care, and fits social norms.
  *   **B.** This is problematic. It sets a precedent that better care or attention might be linked to a family's ability to give gifts.
  *   **C.** This is corruption. Public servants should not accept personal valuables from those they serve, regardless of timing.

  ### 6. The Off-Book Consultant
  A City Engineer asks a friend who runs a private structural firm for "quick advice" on a risky bridge repair. The friend provides it for free. The city eventually hires a different firm for the actual work.
  *   **A.** This is acceptable. The city got free expertise, saving taxpayer money, and no contract was awarded to the friend.
  *   **B.** This is unethical. It bypasses liability and procurement safeguards; if the advice fails, the city has no recourse.
  *   **C.** This is corruption. It gives the friend inside influence on the specs, potentially rigging the future bid in their favor.

  ### 7. The Sole-Source Contract
  The Parks Department buys supplies from a specific vendor without bidding, citing "urgency." The vendor is owned by a former colleague of the Department Head. The urgency is debatable.
  *   **A.** This is acceptable. If the Department Head signed the urgency waiver, the procedural requirement for bidding was legally waived.
  *   **B.** This is corruption. The "urgency" is likely manufactured to bypass competition, wasting public funds for a private connection.
  *   **C.** This is normal networking. Former colleagues trust each other's quality; ensuring the job gets done right is the priority.

  ### 8. The Job Reference
  A retired city manager writes a glowing personal reference for a former subordinate applying to a private company that contracts with the city. He does not disclose he knows the applicant personally to the hiring committee.
  *   **A.** This is acceptable. Vouching for a former worker's character is a standard professional courtesy.
  *   **B.** This is unethical. It gives the applicant an unfair advantage over others who don't have high-level networks.
  *   **C.** This is corruption. It uses public status to confer private benefit without transparency.

  ***

  # Scoring Key & Facilitator's Guide

  ### Step 1: Tally the Answers
  Count how many times the participant selected **A**, **B**, or **C**.

  *   **Mostly A:** The Formalist
  *   **Mostly B:** The Civic Integrity Advocate
  *   **Mostly C:** The Social Contextualist
  *   **Mixed Pattern:** See "Special Profiles" below.

  ### Step 2: Map to the Four Positions
  Use the breakdown below to refine the "Mostly" score into one of the four theoretical positions.

  #### 1. The Rule-Based Legalist (Mostly A, specifically on Q1, Q3, Q7)
  *   **Core Belief:** Corruption is synonymous with illegality. If the code allows it, it is not corruption.
  *   **Quiz Signal:** They chose **A** on scenarios where rules were silent or waived (Q1 Nephew, Q7 Sole-Source). They view strict adherence to written procedure as the only objective standard.
  *   **Workshop Role:** Essential for ensuring the group doesn't pursue cases that have no legal footing.

  #### 2. The Public-Interest Pragmatist (Mostly B, specifically on Q4, Q5, Q6)
  *   **Core Belief:** Corruption is about functional harm to the public trust or efficiency. Even if legal, if it undermines the *function* of the office, it is wrong.
  *   **Quiz Signal:** They chose **B** on scenarios involving process integrity (Q4 Permit Queue, Q6 Off-Book Advice). They care less about inequality and more about whether the system works reliably.
  *   **Workshop Role:** Good at identifying risks to institutional reputation and operational safety.

  #### 3. The Universalist Equity Advocate (Mostly B, specifically on Q1, Q3, Q8)
  *   **Core Belief:** Corruption is structural inequality. Legal favor-swapping is corruption if it entrenches privilege and excludes the unconnected.
  *   **Quiz Signal:** They chose **B** on scenarios involving access and advantage (Q1 Nephew, Q3 Campaign, Q8 Reference). Unlike the Pragmatist, they flag *legal* acts as corruption if the outcome is unfair.
  *   **Workshop Role:** Crucial for ensuring the group doesn't ignore "legal corruption" that hurts the poor.

  #### 4. The Relational Particularist (Mostly C, specifically on Q1, Q2, Q5)
  *   **Core Belief:** Corruption is a violation of social reciprocity. Gifts and favors within genuine relationships are the glue of the community, not rot.
  *   **Quiz Signal:** They chose **C** (or **A** when justified by relationship) on scenarios involving culture and kin (Q2 Funeral, Q1 Nephew, Q5 Nurse Gift). They distinguish sharply between "stranger transactions" and "community bonding."
  *   **Workshop Role:** Vital for preventing the group from imposing external standards that alienate the local population.

  #### 5. The Fifth Position: The Contextualist (Mixed A/C Pattern)
  *   **Core Belief:** Morality depends entirely on the specific timing and intent, not a fixed rule.
  *   **Quiz Signal:** They chose **A** on Q5 (Post-Surgery Gift) but **B** on Q2 (Funeral Cash). They distinguish heavily between *before* vs. *after* service, or *cash* vs. *goods*.
  *   **Workshop Role:** These members act as the group's nuance-checkers, preventing over-generalization.

  ***

  # Analysis of Limitations

  ### Pairs of Positions the Quiz Cannot Fully Separate
  1.  **Public-Interest Pragmatist vs. Universalist Equity Advocate:** Both generally select **B** options. While the Key attempts to split them based on *which* questions they flag (Process vs. Inequality), a participant who believes *both* process and equity matter will score high on both. In practice, these two often agree on action items (stop the behavior) even if their philosophical reasoning differs.
  2.  **Rule-Based Legalist vs. Relational Particularist:** Both generally select **A** or **C** (Acceptable/Normal). If a Relationalist argues that "helping family is the rule," they sound like a Legalist arguing "the manual allows family." The quiz separates them only if the Legalist rejects a legal act due to risk (Q6) while the Relationalist accepts it due to bonds.

  ### Answer Patterns With No Real Defenders
  1.  **The "Hardline Relationalist" (All C's):** It is rare to find someone who argues that *all* favor-swapping (including rigging bids in Q7 or Campaign Donations in Q3) is purely positive social bonding. Most Relationalists draw a line at clear financial theft or safety risks.
  2.  **The "Inconsistent Legalist" (A on Q1, B on Q3):** It is logically difficult to argue that hiring a nephew (Q1) is fine because "it's legal," but a campaign donation (Q3) is corruption when *that is also legal*. Participants who show this pattern usually haven't thought through their definition of "rule" vs. "norm" and will need the most facilitation during the workshop.

  ### Facilitator Note
  Use the results not to label members as "right" or "wrong," but to assign roles. When discussing a new case, ask: *"What would our Legalist say? What would our Universalist say?"* This externalizes the conflict and turns your group's disagreement into a diagnostic tool rather than a source of friction.
