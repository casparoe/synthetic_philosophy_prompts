answer: |-
  **SEMINAR HANDOUT: SUPPLEMENTARY READING**
  **Course:** PHIL 540 – Philosophies of History
  **Week:** 4 – The Covering-Law Model
  **Text:** Dialogue on Hempel's "Explanation Sketch"

  **Note to Students:** *For next week, please read Carl Hempel's "The Function of General Laws in History" (1942). Pay close attention to Section II, where Hempel addresses the objection that historians do not actually cite universal laws. He introduces the concept of the "explanation sketch." The following dialogue between a philosopher of science (Elena) and a social historian (Marcus) dramatizes the tension in that specific passage. Use this to prepare your discussion posts.*

  ***

  **Elena:** Can we look at page three again? This is the pivot point. Hempel admits that if you pick up a standard history book, you won't find formulas. You won't see "For all polities *p*, if condition *C* obtains, then revolution *R* occurs." He grants that. But look at how he frames it. He says the general regularities are "presupposed," "familiar," or "vague." He calls the historian's work an *explanation sketch*. To me, that's a diagnosis, not a concession. He's saying the difference between a narrative and a full explanation is just a matter of explicitness.

  **Marcus:** A diagnosis implies the patient is sick. He's treating historical writing as a pathology of incomplete science. When he says the laws are "presupposed," he's annexing territory that doesn't belong to him. He's assuming that the background knowledge I rely on when I explain the French Revolution is a set of general laws that I'm just too lazy to write down.

  **Elena:** Not lazy. *Pragmatic.* Think about the audience. If I explain why the glass broke by saying "I dropped it," I don't also cite the laws of brittle fracture and gravity. It's understood. Hempel is saying historians do the same. They rely on psychological or sociological regularities that are so well-known they don't need stating. The "sketch" indicates the direction; a full explanation would just fill in the details.

  **Marcus:** But that's exactly where the category error happens. When I write that the Directory fell because of its corruption and military dependence, I am not relying on a tacit law that "all corrupt military-dependent regimes fall." I'm relying on a specific understanding of French political culture in the 1790s, the precedent of the Jacobins, and the specific ambitions of Bonaparte. If you ask me to make my "laws" explicit, I can't, because my explanation doesn't work by subsumption. It works by connection.

  **Elena:** Connection is vague, Marcus. If you say A is connected to B, I have to ask: *why* that connection and not another? If you can't state the regularity that makes the connection necessary—or at least probable—you haven't explained the event. You've just described it. Hempel's point is that the "sketch" is only valuable insofar as it *could* be filled out with empirical regularities. If there are no laws to be found, even in principle, then the sketch isn't an incomplete explanation; it's no explanation at all.

  **Marcus:** So, let's press that. You say the sketch needs to be filled out to be complete. What, exactly, does the finished product look like? If I take my chapter on the fall of the Directory and "complete" it according to Hempel's specifications, do I still have history? Or do I have sociology?

  **Elena:** That's a boundary dispute. But to answer you: the complete explanation would specify the initial conditions—the specific state of the French economy, the army, the political factions—and it would couple them with general hypotheses about how groups act under scarcity, how legitimacy erodes, how military actors intervene in civilian politics. If you can't formulate those hypotheses, even roughly, then you're asking your reader to take your word for it based on their own intuition.

  **Marcus:** I am asking the reader to use their historical imagination. And that imagination isn't scanning a mental database of universal laws. It's simulating a context. When Hempel says the background regularities are "vague," he thinks that's a defect. I think that vagueness is essential. The "law" that "leaders seek to maintain power" is too trivial to explain anything. The "law" that "leaders in 1790s France sought to maintain power in *this specific way*" is too specific to be a law. It's a particular.

  **Elena:** But if it's too specific to be a law, how does it explain? If I say "Bonaparte acted this way because he is Bonaparte," that's identity, not explanation. Explanation requires showing that the event was to be *expected*, given certain conditions. That's what the laws do. They provide the warrant for the expectation. Hempel is arguing that the "sketch" works *because* we intuitively supply those warrants. We nod along because we tacitly believe in the regularity.

  **Marcus:** We nod along because the narrative makes sense, not because we've silently verified a universal generalization. Think about the "tacit background" Hempel mentions. He thinks it's a list of conditionals. I'm telling you it's a repertoire of plots. It's knowing what a "restoration" looks like, knowing what "betrayal" signifies in a revolutionary context, knowing the institutional know-how of the Directory. These aren't laws of nature. They're norms, conventions, and precedents. They are rule-governed, sure, but not law-governed.

  **Elena:** Rules imply regularities. If actors follow norms, then there is a regularity: "Agents in context *C* tend to follow norm *N*." Why resist formulating that?

  **Marcus:** Because formulating it strips away the very thing that does the explanatory work. The "tendency" isn't what explains Bonaparte's coup. The explanation lies in the *contingency* of the moment—the specific misstep by Sieyès, the weather on the day of the coup, the specific text of the constitution. If I turn that into "In constitutional crises, military intervention is probable," I've gained generality but lost the explanation of *this* event. Hempel wants to trade the texture of history for the security of logic.

  **Elena:** He wants to trade the *illusion* of understanding for actual understanding. Look, I agree that historians care about contingency. But contingency isn't an explanation; it's the object of explanation. If you say "It happened because of this unique confluence of factors," you've told me *what* happened. You haven't told me *why* that confluence produced *this* outcome rather than another. To do that, you need to appeal to something stable across cases. Hempel is saying the "sketch" is a promise that such stability exists.

  **Marcus:** But what if the stability is an artifact of the philosopher's need for order? Let's go back to the text. Hempel says the historian offers a sketch "rather than a fully explicit explanation." He treats the narrative as a shell. I'm arguing the narrative is the substance. When you ask me to make the laws explicit, you aren't asking me to complete my explanation. You're asking me to translate it into a different language—a sociological language—that cannot capture historical time.

  **Elena:** Why not? If the sociological generalization is true, it applies to the historical case.

  **Marcus:** Because history isn't just about what applies; it's about what matters. The "laws" Hempel wants are usually trivial ("people act to achieve goals") or false ("revolutions happen when living standards drop"). The real explanatory weight is carried by the *plot*—the way I arrange the events to show how one led to the other. That arrangement isn't a deduction from laws. It's a construction of meaning. Hempel's "explicitness" demands I strip the meaning out and leave only the causal skeleton.

  **Elena:** But without the skeleton, the meaning is just poetry. It might be persuasive, it might be illuminating, but is it *explanatory* in the sense of giving objective grounds? Hempel is worried about subjectivity. If the explanation relies on the reader's "sense of how people characteristically behave," that sense varies. One reader's "characteristic behavior" is another's anomaly. The covering-law model is an attempt to make the grounds of explanation public and testable.

  **Marcus:** And I'm saying that making them "testable" in that way makes them useless for history. We test historical explanations not by checking them against universal laws, but by checking them against the archive, against coherence, against counterfactuals that are historically plausible, not nomologically possible. When Hempel says the difference is one of explicitness, he assumes that if I just tried harder, I could produce the law. I'm saying if I try harder, I produce more history, not more laws.

  **Elena:** So you see the "explanation sketch" as a misleading picture?

  **Marcus:** I see it as a category mistake. It treats history as a science that hasn't quite grown up yet. It assumes the tacit background is a set of laws waiting to be dragged into the light. I'm telling you the background is a web of interpretations. You can't make that explicit in the form of a law without breaking the web.

  **Elena:** And I see it as an idealization. Maybe historians never fully state the laws. Maybe they can't. But the *logic* of what they are doing—the reason their explanations satisfy us—is that they are pointing toward those laws. The sketch is a blueprint. Even if the building is never fully constructed, the blueprint shows the structure. Without the blueprint, you just have a pile of bricks.

  **Marcus:** But what if the building isn't the goal? What if the goal is to understand the bricks themselves, in their specific arrangement? If the covering-law model is the blueprint, it might be a blueprint for a skyscraper when the historian is trying to build a cathedral. The materials are the same, but the logic of construction is entirely different.

  **Elena:** Then we're left with a stalemate. Either history is a rough draft of sociology, or sociology is an irrelevant abstraction to history. Hempel wants to bridge that gap with the "sketch." He wants to say they are on a continuum.

  **Marcus:** And I'm saying the continuum is an illusion. The gap isn't a matter of degree. It's a matter of kind. One seeks subsumption under the general; the other seeks comprehension of the particular. Hempel's passage concedes that historians don't state laws, but he refuses to concede that this might be because laws aren't what they're looking for.

  **Elena:** Or, perhaps, they are looking for laws but don't realize it. That's the force of the diagnosis.

  **Marcus:** Or, perhaps, philosophers are looking for history but refuse to accept it unless it looks like physics.

  **Elena:** *(pauses)* Well. The seminar starts in five minutes. I suppose we can let the students decide if the sketch is a blueprint or a mirage.

  **Marcus:** As long as they don't decide by voting. This isn't a matter of preference. It's a matter of what we think understanding *is*.

  **Elena:** Agreed. Shall we?

  **Marcus:** After you.

  ***

  **Discussion Questions for Seminar:**
  1. Hempel argues that the "tacit" regularities in historical explanation are merely *unspoken*, not *absent*. Does Marcus successfully challenge this, or does he simply assert that narrative is different without proving it isn't law-based?
  2. If the "explanation sketch" is an idealization (as Elena suggests), is it a useful one? Does positing a "complete" covering-law explanation help clarify historical practice, or does it distort it (as Marcus suggests)?
  3. Consider a specific historical explanation you have encountered in your own research. Can it be reconstructed as a covering-law explanation without losing its explanatory power? Where does the reconstruction fail?
