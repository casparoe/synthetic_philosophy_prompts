      *   *Drafting:*
          1.  *Actor Categories:* Does "Renaissance" self-identification prove a break, or is it marketing?
          2.  *Quantitative Clustering:* Do innovation metrics spike at boundaries or flow smoothly?
          3.  *Scientific Revolution:* Is it one causal chain or a retrospective bundle?
          4.  *Precedent Renaissances:* Do earlier "renaissances" invalidate the 15th-century one or show a recurring pattern?

  5.  **Drafting Section 4: Tests/Evidence:**
      *   *Constraint:* For each crux, identify evidence both accept. Record predictions. Admit if no test exists.
      *   *Drafting:*
          1.  *Actor Categories:* Evidence: Private correspondence vs. public manifestos. Realist predicts private belief matches public. Constructivist predicts divergence (rhetoric vs. reality).
          2.  *Quantitative Clustering:* Evidence: Publication rates, patent-like privileges, manuscript survival. Realist predicts spikes. Constructivist predicts noise/smooth curves.
          3.  *Sci Rev:* Evidence: Cross-citation networks between astronomers, anatomists, natural philosophers. Realist predicts dense cross-talk. Constructivist predicts siloed communities linked only by later historians.
          4.  *Precedent Renaissances:* Evidence: Structural outcomes of Carolingian/12th-century revivals vs. 15th-century. Realist argues 15th was qualitatively different (permanent). Constructivist argues they are structurally identical (cyclical).

  6.  **Drafting Closing Judgment:**
      *   *Constraint:* Judge if verbal/emphasis or substantive. Say which part and why.
      *   *Analysis:* Is it just semantics? No, because it affects how we weigh evidence. But there is a verbal component regarding the word "real."
