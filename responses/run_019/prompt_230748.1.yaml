      *   *Self-Correction during drafting:* Make sure the "Agreed Claims" don't sound like "We agree to disagree." They need to be positive assertions about the nature of historical work. Ensure the "Tests" aren't anachronistic (e.g., don't suggest "econometric analysis" for the 14th century without qualifying it as proxy data).

  8.  **Final Polish:** Check for clarity and flow. Ensure the distinction between Realist and Constructivist remains sharp in the disagreement section but bridges in the agreement section. (Proceed to generate output).

  *(Self-Correction Note on Section 4)*: The prompt asks for "a test or body of evidence both sides accept as bearing on it." I need to be careful not to propose something one side would reject as irrelevant. For example, a Realist might reject "word frequency" as shallow, while a Constructivist might love it. I need to find evidence both value, like "institutional records" or "correspondence networks."

