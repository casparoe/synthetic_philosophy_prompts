          1.  Agreed Claims (Numbered, substantive).
          2.  Disagreements (Table: Matter, Realist Formulation, Constructivist Formulation).
          3.  Cruxes (Specific sub-questions, at least four).
          4.  Tests/Evidence (For each crux, accepted evidence + predictions from both sides).
          5.  Closing Judgment (Verbal vs. Substantive dispute).

  2.  **Drafting Section 1: Agreed Claims:**
      *   *Constraint:* No vacuous restatements. Must cover: effect on attention (selection/foregrounding/compression), uneven change, retrospective ordering, practical utility.
      *   *Drafting ideas:*
