          *   Claim 4: Utility exists regardless of ontological status. They are necessary for pedagogy and archival organization.
      *   *Refining:* Make them sound like joint findings, not compromises that dilute the argument.

  3.  **Drafting Section 2: Disagreements (Table):**
      *   *Constraint:* Three columns. Formulations must be acceptable to the respective sides (no strawmanning).
      *   *Rows:*
          *   Ontological status of the periods (Real entities vs. Narrative tools).
          *   Weight of discontinuity vs. continuity.
          *   The "Scientific Revolution" specifically (Unified event vs. Historiographical bundle).
      *   *Drafting:* Ensure the Realist sounds like they believe in structural breaks, and the Constructivist sounds like they believe in the *power of the story* rather than the *reality of the break*.

  4.  **Drafting Section 3: Cruxes:**
      *   *Constraint:* At least four specific sub-questions. Settling one must move a side.
