          *   Actually, looking closer: In Case 1 & 2, the promisee *released* the promisor ("wasn't missed", "says it's fine"). Lena said "Doesn't matter." In the deathbed case, the promisee *cannot* release the promisor. If Lena thinks the promisee's *ability to release* is irrelevant (as per 1 & 2), then death is definitely irrelevant.
