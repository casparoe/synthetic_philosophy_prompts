answer: |-
  Based on her track record, Lena is running a specific, rigorous ethical framework. Here is the breakdown of her rule, the verdict on the deathbed case, and the philosophical machinery behind it.

  ### 1. Lena's Rule: The "Integrity of Commitment" Principle
  Lena is **not** a consequentialist (outcomes don't matter, see Sam/Priya/Loan), nor is she a reliance theorist (expectations don't matter, see Sam/Priya). She is also not purely social-practice focused, because she voids promises that lack valid agency (Drunk/Coercion).

  Lena is a **Voluntarist Deontologist**.
  Her rule can be summarized as: **A promise creates an objective moral obligation if and only if it is entered into voluntarily by a competent agent. Once formed, that obligation is intrinsic to the promisor and cannot be dissolved by changed circumstances, lack of harm, or the promisee's forgiveness.**

  *   **Formation Conditions:** Cases 4 (Drunk) and 5 (Coercion) show that *valid consent* is the gatekeeper. No valid consent = no promise.
  *   **Persistence Conditions:** Cases 1 (Airport), 2 (Dogsit), and 3 (Loan) show that once the gate is passed, the obligation is "sticky." It does not depend on the promisee's need, the promisor's convenience, or the promisee's subsequent release of the debt.

  ### 2. The Verdict on the Deathbed Case
  **Lena would say he is bound to scatter the ashes.**

  According to her framework:
  1.  **Validity:** The promise was made voluntarily by a competent agent (the man) to a competent agent (the friend, presumably lucid on her deathbed). Cases 4 and 5 do not apply; the promise was validly formed.
  2.  **Persistence:** The fact that the promisee is now dead, unaware, or unable to enforce the promise is irrelevant. In Cases 1 and 2, the promisees were alive and explicitly indicated the promise didn't matter ("wasn't missed," "says it's fine"). Lena ruled that their subjective assessment did not void the obligation. Therefore, the promisee's *actual death* (the ultimate inability to assess) certainly cannot void it.
  3.  **Conflict:** The family's desire for a church funeral is a competing preference, not a prior valid promise. In Lena's system, a valid promise trumps convenience, preference, or even the "greater good" of family harmony.

  ### 3. Closest Analog
  **Case 2 (Priya/Dogsit)** is the strongest analog.

  *   **Similarity:** In Priya's case, the promisee explicitly released the promisor ("says it's fine"). In the deathbed case, the promisee *cannot* release the promisor.
  *   **Why it fits:** Lena ruled that the promisee's release was ineffective. If a living person saying "I don't need you to do this" doesn't cancel the debt, then a dead person's inability to say it certainly doesn't cancel the debt. The obligation resides in the *promisor's integrity*, not the *promisee's expectation*.

  **Case 3 (Loan/Rich Lender)** is a close second. The lender didn't *need* the money (just as the deceased doesn't *experience* the ash scattering), but the debt existed regardless of utility.

  ### 4. Competing Ethical Rules
  Here is how other common promise-theories would judge the deathbed case, contrasting with Lena's view:

  | Ethical Framework | Core Principle | Verdict on Deathbed Case | Why it differs from Lena |
  | :--- | :--- | :--- | :--- |
  | **Reliance Theory** (e.g., Scanlon) | Promises bind because we create expectations others rely on. | **Not Bound.** | The friend is dead; she has no expectations. No living person relies on the promise. Lena rejects this because she ruled Sam/Priya broke promises even when reliance was nullified. |
  | **Consequentialism** | Promises bind because keeping them maximizes overall well-being. | **Not Bound (likely).** | Fighting the family causes drama; the deceased feels no joy. The utility cost outweighs the benefit. Lena rejects this (see Sam's "better invite" ruling). |
  | **Social Practice** (e.g., Rawls) | Promises bind because they sustain the institution of promising. | **Bound (with caveats).** | Keeping it upholds the practice, *unless* violating it prevents greater social harm (family trauma). Lena is stricter; she doesn't weigh social harm (see Sam's roommate). |
  | **Lena's Voluntarism** | Promises bind because you willed a duty into existence. | **Bound.** | The duty was created at the moment of speech. Nothing subsequent can erase it. |

  ### 5. Is the Track Record Underdetermined?
  Technically, **yes**, there is one variable Lena has not yet tested: **The Ontological Status of the Promisee.**

  In all five previous cases, the promisee was a living person with moral standing.
  *   In Cases 1 & 2, the promisee *could* have held the promisor accountable but chose not to.
  *   In the Deathbed Case, the promisee *cannot* hold the promisor accountable.

  It is possible Lena believes promises are binding *relations* between living agents. If the relation is severed by death, the obligation might dissolve in her view, whereas she views "forgiveness" (Cases 1 & 2) as an act *within* the relation that she deems insufficient to dissolve the duty.

  **The Test Case to Settle It:**
  To determine if she is a **Pure Voluntarist** (Duty exists in the void) or a **Relational Voluntarist** (Duty exists only between moral agents), present her with this case:

  > "You promise a friend you will read their private diary after they die to ensure no secrets leak. They die. You realize reading it would violate their general privacy, and no one else knows you promised to read it. Are you bound to read it?"

  *   **If she says YES (Bound):** She is a **Pure Voluntarist**. The act of promising creates a freestanding duty that survives the relationship and even contradicts the promisee's likely broader interests. The Deathbed Ash promise is definitely binding.
  *   **If she says NO (Not Bound):** She is a **Relational Voluntarist**. She believes promises serve the *promisee's agency*. If keeping the promise no longer serves the promisee (or violates their broader dignity), the duty lapses when they die. In this scenario, the Deathbed Ash promise becomes **underdetermined**: she might rule he is *not* bound if scattering the ashes violates the friend's broader wish for family harmony, despite the specific promise.

  **Prediction:** Given her harshness on Sam and Priya, I bet she's a Pure Voluntarist. He's buying a plane ticket upstate.
