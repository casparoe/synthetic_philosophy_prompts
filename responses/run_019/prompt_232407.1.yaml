  The principle that best captures your pattern of verdicts is **Contextual Integrity**.

  **The Principle:** Privacy is maintained when information flows (including observation, inference, and transmission) adhere to the entrenched normative expectations governing a specific social context. A privacy violation occurs when an agent extracts, infers, or disseminates information in a way that breaches these expectations, specifically by converting incidental or entrusted data into targeted knowledge or leverage without a contextually recognized justification.

  **Precision and Application to Tensions:**
  This principle relies on two clauses to handle your hard pairs. First, the **Normative Expectations Clause** dictates that what is permissible depends on the relationship and setting, not merely on visibility or consent. Second, the **Targeted Scrutiny Clause** distinguishes between generalized, passive observation (which is often permissible) and systematic, targeted extraction (which is often a violation).

  *   **Cases 3 vs. 4 (Inference):** Both involve inference without consent. Case 3 violates the consumer context norm (transactions for discounts, not profiling), whereas Case 4 aligns with the medical research context norm (aggregate data for public welfare).
  *   **Cases 5 vs. 6 (Visibility):** Both involve seeing property. Case 5 violates the residential norm (a fenced yard signals an expectation of seclusion despite technical visibility), whereas Case 6 fits the public mapping norm (street-facing exteriors are expected to be recorded).
  *   **Cases 8 vs. 9 (Public Photos):** Both use public images. Case 8 fits the social norm of incidental capture, whereas Case 9 breaches the civic norm by using state power to convert public presence into systematic identification.
  *   **Cases 10 vs. 3 (Human vs. Algorithm):** Both involve inference. Case 10 fits the interpersonal norm where human social cognition is expected, whereas Case 3 breaches the commercial norm where algorithmic mining is not mutually understood.

  **The Strain:**
  The principle cannot accommodate your instability in **Case 11** without forcing a revision. Contextual Integrity treats private communications (diaries, texts) as protected by the norms of the relationship. In Case 1, you ruled that reading the diary was wrong regardless of consequences. To maintain consistency, you must revise Case 11 to a **violation**. The suspicion of an affair may provide a moral justification for breaking the rule, but it does not negate the privacy violation itself. Dropping the "not a violation" half of your ambivalence is the right price to pay because allowing suspicion to negate privacy rights erodes the protection of private channels entirely, making the right contingent on the innocence of the content.

  **Defense Against the Alternative:**
  The most plausible alternative is the **Public Visibility Principle**, which holds that anything visible or audible in a public or semi-public space is fair game. This fails your verdicts on Case 5 (the neighbor's platform) and Case 9 (police face recognition). In both instances, the subject was technically visible, yet you correctly identified a violation. Contextual Integrity succeeds where Visibility fails because it recognizes that social norms can create expectations of privacy even within line-of-sight, protecting against targeted scrutiny that exceeds the purpose of the visibility.

  **Where It Fails Next:**
  This principle will struggle with **Large Language Model training**. When AI scrapes publicly available text (blogs, code, forums), it breaches the original context of creation (personal expression, technical help) for a new context (commercial model training). Because the internet lacks entrenched norms for this specific flow, Contextual Integrity offers no clear verdict, revealing a weakness in handling novel technological contexts where norms have not yet crystallized.

  **Applications:**

  (a) **Verdict: Violation.** Selling health data to an insurer breaches the context of personal wellness tracking by converting it into commercial risk assessment without appropriate safeguards.

  (b) **Verdict: Violation.** Reading the note breaches the normative expectation of confidential peer communication within the school context absent an immediate safety threat.

  (c) **Verdict: Violation.** Photographing the kitchen interior breaches the sanctity of the home context by using technology to bypass physical barriers designed to ensure seclusion.

  (d) **Verdict: Violation.** Systematically recording conversations breaches the public space norm by converting ephemeral sound into retained data without the contextual justification limited to gunshot detection.
