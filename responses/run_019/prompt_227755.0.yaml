answer: |-
  Your current practice strictly presupposes that credences, rather than binary beliefs, are the primary bearers of epistemic value. It assumes accuracy is gradable: a 70% prediction of a true event is epistemically superior to a 50% prediction. By insisting on strict propriety, you presuppose that epistemic norms must incentivize sincerity; a scoring rule that rewards shading probabilities is defective because it decouples reported confidence from actual belief. This rules out rival views where only full belief is rationally assessable (classical doxasticism) or where justification, rather than truth-conduciveness, constitutes epistemic goodness. It sits comfortably with Bayesianism, but does not strictly require it; frequentist interpretations also satisfy the accuracy condition.

  Your colleague's proposal strictly presupposes that epistemic value is instrumental and discontinuous. It assumes confidence thresholds track actionability: an 89% confidence is pragmatically worthless compared to 90%. This view privileges boldness over calibration. It rules out the notion that humble uncertainty has intrinsic value. It sits comfortably with pragmatic encroachment—the idea that knowledge depends on stakes—but strictly requires that business utility outweighs pure accuracy.

  The tension lies in your organization functioning as a fallibilist internally while projecting infallibilism externally. Internally, you measure nuance; externally, you demand decisiveness. If you adopted the view that only binary belief is epistemically evaluable, the tournament would need to shift from scoring probabilities to measuring classification accuracy (sensitivity and specificity). Analysts would be rewarded for correct calls, not calibrated uncertainty. You would lose the ability to distinguish between a lucky guess and a well-calibrated 51% belief. Conversely, if you took the scoring-rule picture fully seriously, public communications would need to abandon categorical predictions in favor of confidence intervals or probabilistic statements, acknowledging that certainty is rarely epistemically justified. You would lose the ability to give clear directives without qualifiers.

  Currently, you treat uncertainty as an object of measurement; your colleague treats it as an obstacle to action. The philosophical dispute is whether the firm's epistemic goal is to mirror the world's uncertainty (accuracy) or to overcome it for decision-making (utility). Maintaining both systems without acknowledgment creates a schizophrenic epistemic culture: analysts are trained to hedge internally but punished for hedging externally. To resolve this, you must decide whether the firm is a truth-seeking institution or a decision-making machine. If the latter, the Brier score is a distraction; if the former, the 90% threshold is epistemically vicious. The Brier score strictly presupposes truth-approximation is the goal; the threshold strictly presupposes decision-readiness is the goal. They can sit comfortably together only if you accept that internal truth-seeking and external decision-making are separate domains, but this risks decoupling knowledge from action.
