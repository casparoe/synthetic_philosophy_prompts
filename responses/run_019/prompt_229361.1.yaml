  The split between 0.2 and 0.75 almost certainly lives in the second sub-question: behavioural inference. You (0.2) likely view the optimism bias data as compatible with unconscious computational heuristics. To you, a bee can be a sophisticated zombie, processing risk without feeling the anxiety. Your friend (0.75) likely employs an inference to the best explanation, arguing that positing felt valence is the most parsimonious way to explain the flexibility of the behaviour. They see the functional complexity and assume the phenomenology comes free. I suspect you demand a closer neural match to vertebrates before granting sentience, whereas your friend grants sentience based on behavioural homology. The substrate question matters less here; you both likely agree the brain is complex enough for *something*, but you disagree on whether that something includes a 'glow'. Your friend weighs evolutionary continuity heavily, assuming valence is an ancient trait. You weigh the explanatory gap heavily, refusing to bridge function and feel without stricter neural criteria. This is a classic structural vs functional debate.

