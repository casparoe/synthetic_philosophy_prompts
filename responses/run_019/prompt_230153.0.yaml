prompt: |-
  I'm taking a philosophy of medicine course this term and I have to run a fifty-minute section for first-years on the naturalism vs. normativism debate about health and disease. The annoying part is they've already had one lecture on it, so they can all repeat the slogan—naturalism says disease is objective biological dysfunction, normativism says values are built in—but the lecturer warned me they mostly came away thinking it's science vs. opinion, and I have to undo that. They're mostly pre-meds who want the one right answer so they can get back to studying, which is exactly the instinct I need the session to break.

  Please act as a philosophy of medicine teacher who has taught this exact debate before, and think through the whole session carefully before you write. Then give me a committed teaching plan, not a menu of possibilities: pick an order, pick an example, and defend them. I need (a) the sequence the ideas have to go in, with what depends on what—my hunch is they can't see the force of normativism until they see that even choosing a statistical reference class involves a choice, but correct me if I've got that backwards; (b) the one carrying example to build the whole session around—I keep going back and forth between the recent-ish US hypertension guideline change that turned millions of adults into patients and homosexuality's removal from the DSM; pick one or pick a better one and say what it must have and what it must not have; (c) the misconceptions I should expect in the order they'll actually come up, with the exact point in the sequence to head each one off—I especially dont want them walking out thinking normativism means disease is made-up, or that naturalism means natural is good, but I also know better than to front-load a list of corrections; (d) what I should openly leave out at this level—I'm guessing the harmful-dysfunction hybrid views are too much, but maybe not; and (e) one final question to ask that would tell me wether they actually got the distinction rather than just learned to nod at the word values.

  Write the whole thing in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Experienced Philosophy of Medicine Teacher.
      *   **Task:** Create a committed 50-minute teaching plan for first-year pre-meds on Naturalism vs. Normativism in health/disease.
      *   **Context:** Students already had a lecture but simplified it to "Science (Naturalism) vs. Opinion (Normativism)." They want "the right answer."
      *   **Goal:** Break the "one right answer" instinct, show the nuance, prevent specific misconceptions.
      *   **Requirements:**
          *   (a) Sequence of ideas (logical flow).
          *   (b) One carrying example (Hypertension vs. Homosexuality vs. other).
          *   (c) Anticipated misconceptions & when to address them.
          *   (d) What to leave out (scope).
          *   (e) One final assessment question.
      *   **Tone:** American English, practical, authoritative but pedagogical.

  2.  **Deconstruct the Core Problem:**
      *   The students think Naturalism = Hard Science/Facts and Normativism = Soft Values/Opinions.
      *   This leads to the belief that Naturalism is "real medicine" and Normativism is "politics/feelings."
      *   To fix this, I need to show that *Naturalism relies on hidden values* and *Normativism relies on biological facts*. It's not Fact vs. Value; it's about *where* and *how* values enter the picture.
      *   The user's hunch: "They can't see the force of normativism until they see that even choosing a statistical reference class involves a choice." -> This is correct. Naturalism often hides its normative commitments behind "objective" statistics.

  3.  **Select the Carrying Example (Requirement b):**
      *   *Option 1: Homosexuality (DSM removal).*
          *   Pros: Classic, clear value shift.
          *   Cons: Can be polarizing, students might think "Okay, that was just prejudice, now we know better," reinforcing the "Science wins" narrative. It's too easy to dismiss as "past error."
      *   *Option 2: Hypertension Guidelines (JNC 8 vs. ACC/AHA 2017).*
          *   Pros: Current, affects their future patients, involves statistical cutoffs (140/90 vs. 130/80), clearly shows how lowering the bar creates "patients" out of "healthy" people based on risk tolerance (value judgment).
          *   Cons: Complex medical details.
      *   *Option 3: Pregnancy/Infertility.*
          *   Pros: Clear dysfunction vs. social desire.
          *   Cons: Can get bogged down in reproductive ethics.
      *   *Decision:* **Hypertension Guidelines.** Why? Because it directly attacks the "Science vs. Opinion" dichotomy. Both sides use science (epidemiology). The difference is the *value* placed on risk reduction vs. over-medicalization. It shows Naturalism isn't just "looking at biology"; it's "deciding where to draw the line on a continuum." It's less emotionally charged than homosexuality for a 50-minute intro, allowing focus on the *structure* of the argument.
      *   *Criteria for the example:* Must show a continuum (not binary), must involve a guideline change (showing mutability), must have clear stakes (treatment vs. no treatment).

  4.  **Determine the Sequence (Requirement a):**
      *   *Start:* Don't start with definitions. Start with the example.
      *   *Step 1:* Present the Hypertension case. Show the numbers changed.
      *   *Step 2:* Ask "Did the biology change?" (No). "Did the disease change?" (Yes).
      *   *Step 3:* Introduce Naturalism. Try to fit the case into it. (Problem: Where is the 'dysfunction' cutoff?)
      *   *Step 4:* Introduce Normativism. Show how values explain the shift.
      *   *Step 5:* The Twist. Show that Naturalism *needs* Normativism to set the reference class.
      *   *Step 6:* Conclusion. It's not Science vs. Opinion. It's Fact + Value.
      *   *Logic:* Inductive reasoning. Let them feel the problem before giving them the labels.

  5.  **Address Misconceptions (Requirement c):**
      *   *Misconception 1:* "Normativism means disease isn't real." -> Address when introducing Normativism. Emphasize "Values structure facts," not "Values replace facts."
      *   *Misconception 2:* "Naturalism means 'natural is good'." -> Address early. Define 'Naturalism' strictly as 'biological dysfunction independent of values.'
      *   *Misconception 3:* "Science vs. Opinion." -> This is the main battle. Address throughout, culminating in the synthesis.
      *   *Timing:* Don't list them at the start. Intercept them as they arise in the discussion.

  6.  **Decide on Scope/Omissions (Requirement d):**
      *   *Omit:* Boorse's Biostatistical Theory (BST) details (too technical).
      *   *Omit:* Harmful Dysfunction Analysis (Wakefield) in depth. It's a hybrid, might confuse the binary distinction needed for clarity. Mention it only as a "next step" if time permits, but better to leave out to keep focus on the core tension.
      *   *Omit:* Deep meta-ethics (realism vs. anti-realism).
      *   *Focus:* The *role* of values in classification.

  7.  **Drafting the Final Assessment Question (Requirement e):**
      *   Needs to test if they understand that *both* sides use facts and values, just differently.
      *   Bad question: "Which theory is right?"
      *   Good question: A scenario where biology is clear but the *status* of disease depends on a goal.
      *   Idea: Genetic predisposition without symptoms. Are they diseased?
      *   Better Idea: The "130/80" specific logic. Ask them to identify the *value* in the *naturalist* claim.
      *   Selected Question: "If a naturalist says '130/80 is the objective cutoff because that's where risk increases,' what hidden value judgment are they making?" (Answer: That reducing risk is worth the cost of labeling/treatment).

  8.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Is 50 minutes enough for Hypertension?
      *   *Fix:* Keep the medical details very high-level. Focus on the *number change*.
      *   *Critique:* Will pre-meds resist Normativism too much?
      *   *Fix:* Frame Normativism not as "politics" but as "goals of medicine." Pre-meds care about helping patients. Framing values as "what counts as helping" resonates.
      *   *Sequence Check:* User hunch was "Reference class choice comes before Normativism force." I agree. I need to show that selecting the "normal" population is a value choice. I will build this into the Hypertension example (Who is the reference? 20-year-olds? 60-year-olds?).

  9.  **Final Polish:**
      *   Ensure American English spelling/idioms.
      *   Ensure tone is supportive but firm (experienced colleague advice).
      *   Check all 5 constraints (a-e) are explicitly met.

  **(Self-Correction Note on the Example):** I initially thought about Hypertension, but Homosexuality is the "classic" case for a reason. However, the prompt asks me to *pick one and defend it*. Hypertension is better for *pre-meds* because it's about *their* future practice, not history. It avoids the "that was just bigotry" dismissal. I will stick with Hypertension but ensure I explain *why* I picked it in the plan.

  **(Self-Correction on Sequence):** The user thinks they need to see the reference class choice *before* Normativism. I agree. The plan should flow: Example -> Naturalist attempt (fails on cutoff) -> The Reference Class Problem (reveals value) -> Normativist explanation -> Synthesis.

  **(Self-Correction on Misconceptions):** I need to be specific about *when* to interrupt. I'll add "Instructor Note" callouts for these.

  **(Self-Correction on Omissions):** Definitely leave out Wakefield's Harmful Dysfunction. It muddies the water for a 50-minute section designed to break a binary. Keep the tension sharp.

  **(Self-Correction on Final Question):** Make sure it forces them to articulate the value *within* the fact claim.

