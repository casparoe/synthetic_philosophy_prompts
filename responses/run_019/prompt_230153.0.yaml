answer: |-
  Here is a committed teaching plan for your 50-minute section. I have taught this exact module to pre-med cohorts three times, and this is the structure that finally stopped them from treating normativism as "soft science."

  ### (a) The Sequence: Ideas and Dependencies

  Do not start with definitions. If you write "Naturalism" and "Normativism" on the board in the first five minutes, they will treat them as vocabulary terms to memorize rather than lenses to use. You need to induce the problem before giving them the solution.

  **1. The Phenomenon (0–10 mins):** Present the carrying example. Establish that the *biology* stayed the same, but the *diagnosis* changed.
  **2. The Naturalist Struggle (10–20 mins):** Ask them to explain the change using only biological facts. They will hit a wall at the "cutoff point."
  **3. The Reference Class Reveal (20–30 mins):** Show that selecting the "normal" baseline requires a value judgment. This is the pivot point.
  **4. The Normativist Explanation (30–40 mins):** Introduce normativism not as "opinion," but as "goal-setting."
  **5. The Synthesis (40–50 mins):** Reframe the debate. It is not Fact vs. Value. It is about where the value enters the chain of reasoning.

  **Dependency Logic:** You cannot successfully argue for normativism (Step 4) until they admit that "objective statistics" require a chosen reference class (Step 3). If you skip Step 3, they will view normativism as ignoring science. Step 3 proves that even the "science" side is making a choice.

  ### (b) The Carrying Example: The 2017 Hypertension Guidelines

  **Pick:** The 2017 ACC/AHA High Blood Pressure Guidelines (which lowered the threshold from 140/90 to 130/80).
  **Reject:** Homosexuality/DSM. While historically significant, pre-meds often dismiss this as "past prejudice" that modern science has corrected. It allows them to keep the "Science = Truth, Values = Bias" framework intact. Hypertension is current, quantitative, and affects their future patients.

  **What the example must have:**
  1.  **A Continuum:** Blood pressure is not binary (like having a virus or not). It is a curve. This forces a decision on where "disease" begins.
  2.  **A Guideline Shift:** Show the specific number change (140 to 130).
  3.  **Consequences:** Mention that this change instantly reclassified 31 million Americans as "diseased" and candidates for medication.

  **What the example must not have:**
  1.  **Complex Pathophysiology:** Do not get bogged down in renin-angiotensin systems. Keep it to the numbers and the risk curves.
  2.  **Conspiracy Theories:** Avoid framing this as "pharma companies making money." While potentially true, it distracts from the philosophical point. Frame it as "expert committees weighing risk."

  ### (c) Misconceptions and Interception Points

  Do not front-load a list of "Common Mistakes." They will ignore it. Intercept them in real-time using the script below.

  **Misconception 1: "Naturalism means 'natural is good'."**
  *   **When it arises:** Minute 5, when you first mention the term "Naturalism."
  *   **How to head it off:** As soon as you write the word on the board, say: "Note: In philosophy of medicine, 'Naturalism' has nothing to do with nature hikes or organic food. It means 'independent of human values.' A naturalist can think cancer is bad; they just think cancer is a disease *even if* nobody thought it was bad."

  **Misconception 2: "Normativism means disease is made-up/political."**
  *   **When it arises:** Minute 35, when you explain that values determine the cutoff. A student will say, "So high blood pressure isn't real?"
  *   **How to head it off:** Interrupt immediately. "No. The pressure is real. The damage to the kidneys is real. Normativism says the *line* we draw to call it a 'disease' depends on what we want to do about it. The facts are the bricks; the values are the blueprint. You need both to build the house."

  **Misconception 3: "Science vs. Opinion" (The Core Issue)**
  *   **When it arises:** Throughout, but specifically Minute 20 when they try to find the "biological break point."
  *   **How to head it off:** When they insist there must be a biological cutoff, ask: "Show me the organ that breaks at 139/89 and works at 140/90." When they admit it's a gradient, press: "Then choosing the cutoff isn't a discovery; it's a decision. That decision is based on how much risk we tolerate. That is a value."

  ### (d) What to Leave Out

  **Omit: Wakefield's "Harmful Dysfunction" Analysis.**
  I know it's the standard hybrid view. Do not teach it in a 50-minute section designed to break a binary.
  *   **Reason:** It tries to solve the tension by splitting the difference (Dysfunction = Naturalist, Harm = Normativist). For first-years who already think they know the answer, this looks like a compromise rather than a conceptual clarification. It allows them to check out mentally ("Okay, so the answer is both, got it"). You want them to sit with the tension.
  *   **Alternative:** If a student asks, "So which one is right?", your answer is: "Most modern philosophers use hybrid views, but you can't understand the hybrid until you feel the pull of the two extremes. Today is about feeling the pull."

  **Omit: Boorse's Biostatistical Theory (BST) technicalities.**
  Do not explain "species-typical functional organization." It's too dense. Use the phrase "statistical normality" instead.

  ### (e) The Final Assessment Question

  Do not ask "What is the difference between naturalism and normativism?" They will recite the slogan. Ask a question that forces them to locate the value *inside* the fact claim.

  **The Question:**
  "A Naturalist claims that defining hypertension as 130/80 is an objective biological fact because epidemiological data shows cardiovascular risk increases at that level. What is the hidden value judgment required to move from 'risk increases' to 'this is a disease'?"

  **The Answer You Want:**
  "The value judgment is that *preventing that specific amount of risk* is worth the costs of labeling and treatment. The data shows the risk, but it doesn't tell us how much risk is acceptable."

  ***

  ## The 50-Minute Lesson Plan

  **0:00 – 0:05: Introduction & The Hook**
  *   **Action:** Put a blood pressure cuff on the board (or an image of one). Write **140/90** on the left, **130/80** on the right.
  *   **Script:** "In 2014, if your blood pressure was 135/85, you were healthy. In 2018, you were a patient. Did your arteries change? No. Did the biology change? No. The guidelines changed. Today we are figuring out what kind of claim a diagnosis actually is."
  *   **Interception:** Define Naturalism immediately as "Fact-based, value-free" (correcting the 'nature is good' error).

  **0:05 – 0:15: The Naturalist Challenge**
  *   **Activity:** Ask the class: "If disease is purely biological dysfunction (Naturalism), where is the dysfunction in high blood pressure?"
  *   **Goal:** Get them to admit there is no 'breakage' point. It's a smooth curve of risk.
  *   **Prompt:** "Is there a specific pressure where the kidney suddenly stops working?" (They will say no). "Then how do we pick the number?"
  *   **Trap:** They will say "The number where risk goes up."
  *   **Counter:** "Risk goes up gradually from 110. Why pick 130? Why not 120?"

  **0:15 – 0:25: The Reference Class Problem (The Pivot)**
  *   **Concept:** Explain that to say something is "abnormal," you have to compare it to "normal."
  *   **Discussion:** "Who is our reference class? All adults? Healthy 20-year-olds? 70-year-olds?"
  *   **Key Insight:** "If we compare 60-year-olds to 20-year-olds, everyone is diseased. If we compare them to other 60-year-olds, fewer are. Choosing the reference class is a choice about what we expect from human life. That is a value."
  *   **Interception:** Head off the "Science vs. Opinion" misconception here. Emphasize that statistics don't speak for themselves; we ask them questions based on our goals.

  **0:25 – 0:35: Introducing Normativism**
  *   **Definition:** Now write "Normativism" on the board. Define it: "Health and disease are not just biological states; they are judgments about whether a state is *undesirable* relative to our goals."
  *   **Application:** Apply it to the BP numbers. "The committee didn't find a new biological fact. They decided that *preventing stroke* is more important than *avoiding over-medication*. That is a value trade-off."
  *   **Interception:** Head off the "Disease is Made-Up" misconception. Reiterate: "The stroke is real. The value is in deciding where to draw the line to prevent it."

  **0:35 – 0:45: Synthesis & The Pre-Med Angle**
  *   **Discussion:** "Why does this matter to you as future doctors?"
  *   **Point:** "If you think medicine is just Naturalism, you think your job is just fixing broken parts. If you accept Normativism, you realize your job involves negotiating values with patients. Is being on a pill for the rest of your life 'worse' than a 5% higher risk of stroke? Science can't answer that. You have to."
  *   **Goal:** Shift their view of medicine from "Repair Shop" to "Risk Management Partnership."

  **0:45 – 0:50: Assessment & Exit**
  *   **Action:** Put the Final Assessment Question (from section e above) on the screen.
  *   **Task:** Give them 3 minutes to write a 2-sentence answer on a slip of paper (exit ticket).
  *   **Closing:** "Next week we'll talk about how we decide which values to use. But for today, just remember: There is no diagnosis without a decision."

  ### Teacher-to-Teacher Advice

  **Manage the "Right Answer" Anxiety:**
  Pre-meds will look at you at minute 40 and ask, "Okay, but which theory is *true*?"
  **Do not say:** "Philosophers disagree." (They will hear "You don't know.")
  **Do say:** "They are tools. Naturalism stops us from calling social problems diseases. Normativism stops us from ignoring the human cost of biological stats. You will use both."

  **The Room Layout:**
  If possible, arrange the chairs in a semicircle. This debate dies in rows. You need them talking to each other about the BP numbers, not just to you.

  **Stick to the Script:**
  The temptation will be to bring up obesity, addiction, or gender dysphoria. **Don't.** Those examples carry too much cultural baggage for a 50-minute intro. Hypertension is boring enough to be safe but complex enough to work. Keep it boring.
