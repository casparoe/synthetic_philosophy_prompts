          *   Let's design 9 questions.

      *   *Refining the "Authority vs. Science-Infallibilist" problem:*
          *   Authority: "I believe it because the Institution says so."
          *   Science-Inf: "I believe it because the Data says so (and the Data is final)."
          *   In practice, these look similar. The quiz needs to probe *why* they defer. Is it the *source* or the *method*?
          *   Question on Consensus Shift (Case 5) is key here.
          *   Authority: "The new consensus is now the truth."
          *   Science-Inf: "The old consensus was bad science; the new one is the Truth."
