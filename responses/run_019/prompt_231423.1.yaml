      *   *Case 5: Consensus shifts within a decade.* (Required)
          *   Tenacity: I stick to the first one.
          *   Authority: Follow the current official line.
          *   A Priori: The new one is more elegant.
          *   Science-Fallibilist: Knowledge evolves; previous was best available then.
          *   Science-Infallibilist: The previous one was a mistake/fake science.

      *   *Case 6: Charismatic outlier.* (Required - let's use this one).
          *   Tenacity: I like his style.
          *   Authority: Ignore him, he's not mainstream.
          *   A Priori: His argument is logically sound.
          *   Science: Check if data holds up against peer review.

      *   *Need to ensure Science-Fallibilist vs. Infallibilist distinction.*
          *   This usually comes down to *revision*. Infallibilists treat current science as Authority. Fallibilists treat it as provisional.
