  2.  **Deconstruct Peirce's Methods (for internal clarity):**
      *   *Tenacity:* Holding onto belief because letting go is uncomfortable. Ignoring counter-evidence. "I know what I know."
      *   *Authority:* Deferring to an institution, state, church, or established dogma. "They say it's so."
      *   *A Priori:* Believing what seems agreeable to reason, elegant, or plausible. "It makes sense to me."
      *   *Science:* Belief determined by external permanency (reality), open to revision, public verification.
      *   *Science-Infallibilist:* Uses scientific language/consensus but treats current findings as dogma (cannot be revised).
      *   *Science-Fallibilist:* Uses scientific method, accepts revision based on new evidence.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Need 8-10 questions.*
      *   *Need 5 of 6 specific cases.*
      *   *Need to distinguish Science-Fallibilist from Science-Infallibilist.*
