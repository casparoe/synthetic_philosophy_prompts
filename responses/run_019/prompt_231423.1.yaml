      *   *Q1 (Diet/Meta-analysis):* T: Stick to plan. A: Wait for gov update. AP: Does the biochemistry make sense? S: Adjust intake based on new risk profile.
      *   *Q2 (Replication):* T: The first one resonated. A: Wait for journal retraction. AP: The theory was always shaky. S: Discard the effect size.
      *   *Q3 (Experience vs Expert):* T: My body knows. A: Follow the prescription. AP: Anecdotes are logically weak. S: Log symptoms, discuss with doctor.
      *   *Q4 (Intuition vs Study):* T: Study is nonsense. A: Study must be right if published. AP: Study violates common sense. S: Scrutinize methodology.
