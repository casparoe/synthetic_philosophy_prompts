      *   *Verdict:* It's not just a wording trick, but it requires defining free will. If free will requires "could have done otherwise" (Principle of Alternative Possibilities), the Block kills it. If free will means "actions stem from me," the Block allows it. The user feels it's a trick because the "fixity" feels coercive, even if the block doesn't "force" anything.

