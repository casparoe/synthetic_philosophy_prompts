answer: |-
  Your instincts are coherent and align with a robust school of thought in formal epistemology known as **Imprecise Probabilism** (associated with figures like Isaac Levi, Peter Walley, and James Joyce). Your draft principle is close, but it conflates *objective chance* with *evidential support* and fails to account for the pragmatic shift in Case 7.

  To earn the distinction you seek, you need a principle that ties the *structure of your belief* to the *structure of your evidence*. The distinction is not about how confident you feel, but about whether your evidence rules out alternative probability assignments.

  Here is the principle that captures your verdicts, the necessary correction to one of them, and the answer to your final philosophical question.

  ### The Principle of Evidential Determinacy

  **Statement:**
  An agent's credal state should be represented by a set of probability functions (a *representor*) compatible with their evidence. A **sharp** (single-value) credence is licensed **if and only if** that set contains exactly one function. This occurs in exactly two conditions:

  1.  **Physical Determinacy:** The evidence specifies a unique, known stochastic mechanism (objective chance) that fixes the probability value.
  2.  **Epistemic Convergence:** The evidence, while not specifying a physical mechanism, is sufficient to rule out all but one probability function among the set of rationally permissible priors/models.

  **Otherwise, the credal state must remain imprecise (a proper set of functions).**

  ---

  ### Mapping the Cases to the Principle

  This principle validates six of your seven intuitions directly and requires a reinterpretation of the seventh.

  *   **Case 1 (Tested Coin):** **Sharp.** Satisfies *Physical Determinacy*. Your testing provides evidence that the physical setup is a fair chance mechanism ($P=0.5$). The set of compatible functions collapses to a singleton.
  *   **Case 2 (Stranger Coin):** **Imprecise.** Fails both clauses. You lack knowledge of the mechanism (fails Physical Determinacy) and symmetry is not evidence that rules out biased priors (fails Epistemic Convergence). The compatible set remains $[0, 1]$.
  *   **Case 3 (Lottery):** **Sharp.** Satisfies *Physical Determinacy*. The "known random draw" is a specified stochastic mechanism.
  *   **Case 4 (Ellsberg Urn):** **Mixed.**
      *   *Red:* **Sharp.** Satisfies *Physical Determinacy* (30/90 is known constitution).
      *   *Black:* **Imprecise.* Fails *Physical Determinacy*. The constitution for black/yellow is unknown, leaving a range of compatible frequency functions ($0$ to $60/90$).
  *   **Case 5 (Conflicting Models):** **Imprecise.** Fails *Epistemic Convergence*. You have two admissible models yielding different values. Your evidence does not rule one out. The representor is the interval $[0.3, 0.7]$. (If both said 30%, Convergence is met, and you go sharp).
  *   **Case 6 (Letter Frequency):** **Dynamic.** This case illustrates the *shrinking of the representor*.
      *   *No opinion:* The set is all functions.
      *   *Ordinary prose:* Evidence rules out extreme frequencies, shrinking the set to an interval.
      *   *Tally:* Evidence rules out all but one frequency, shrinking the set to a singleton.
      *   *Note:* This validates your intuition that imprecision is often a stage on the way to exactness, but only when *new evidence* arrives. In Case 2, no amount of reflection shrinks the set; only empirical data would.

  ### The Necessary Sacrifice: Case 7 (Stakes)

  **The Verdict to Replace:**
  You wrote: *"In small-stakes choices I am content to pick a single number... In a one-off high-stakes decision I refuse to do this."*

  **The Correction:**
  Your **credal state** (belief) should not change based on stakes; only your **decision rule** should.
  According to the Principle of Evidential Determinacy, if your evidence is imprecise (as in the high-stakes scenario), your belief *is* imprecise, regardless of the stakes. In low-stakes scenarios, you are not actually forming a sharp belief; you are employing a **pragmatic proxy**. You are *acting as if* you have a sharp belief because the cost of calculating with the interval outweighs the risk of error.

  **Replacement Principle for Case 7:**
  *   **Belief:** Fixed by evidence (Imprecise in ambiguity).
  *   **Action:**
      *   *Low Stakes:* Maximize Expected Utility using a proxy (e.g., the midpoint). The risk of "ambiguity loss" is negligible.
      *   *High Stakes:* Use **E-Admissibility** or **Maximin**. A wager is acceptable only if it is optimal across *all* functions in your representor.

  **Why this change?** If you allow stakes to change your *belief representation*, you violate the norm that belief aims at truth/evidence, not utility. By keeping the belief imprecise but changing the decision rule, you preserve the integrity of Case 2 and 5 while explaining why you feel comfortable being "sloppy" when little is on the line.

  ---

  ### Application: The New Case

  **Case:** A coin is either biased 2:1 toward heads ($P(H)=2/3$) or 2:1 toward tails ($P(H)=1/3$). Exactly one obtains. You know nothing about which.

  **Analysis:**
  1.  **Physical Determinacy?** No. You do not know which physical mechanism obtains.
  2.  **Epistemic Convergence?** No. You have two hypotheses compatible with your evidence. Neither is ruled out.
  3.  **Symmetry?** You have no evidence favoring Heads-bias over Tails-bias. However, per your intuition in Case 2, symmetry of ignorance does not license a sharp number.

  **Verdict:**
  **Imprecise Interval $[1/3, 2/3]$.**
  You should *not* assign one-half sharp. To do so would be to claim evidence you do not possess (namely, that the coin is fair or that the bias is equally likely to be one way or the other in a way that averages out). Your state of belief is that the chance is *either* $1/3$ *or* $2/3$, and since you must prepare for either reality, your credence spans the gap.

  *Note:* If you were forced to bet, a precise probabilist would bet at 1:1 odds. An imprecise probabilist (you) would refuse a bet on Heads at odds that imply $P > 2/3$ and refuse a bet against Heads at odds that imply $P < 1/3$. In the middle zone, you might have no determinate choice without further pragmatic rules.

  ---

  ### Kind or Degree?

  You asked: *Is the boundary between precise and imprecise belief a difference in kind or only a difference in degree?*

  **Answer:** It is a **difference in kind of evidential relation**, which often manifests as a **difference in degree of information**.

  1.  **Difference in Kind (Structure):**
      Precise belief asserts that the world (or your evidence) has ruled out all alternatives but one. Imprecise belief asserts that the world (or your evidence) leaves a specific set of alternatives open. These are structurally distinct states of commitment. One is a **point**; the other is a **region**. In decision theory, they behave differently (e.g., violating the Sure Thing Principle in Ellsberg cases).

  2.  **Difference in Degree (Process):**
      As Case 6 shows, the *process* of learning is continuous. As evidence accumulates, the set of compatible probability functions shrinks. The transition from "interval" to "point" happens when the set's diameter reaches zero.

  **Synthesis:**
  Do not view imprecise belief as "fuzzy" precise belief. View precise belief as a **degenerate case** of imprecise belief (where the set size is one).
  *   **Imprecise:** "My evidence is compatible with this *set* of probabilities."
  *   **Precise:** "My evidence is compatible with this *set* of probabilities, and the set happens to contain only one member."

  This earns the distinction: You are not merely "less sure" in the imprecise cases; you are **structurally committed** to a plurality of possibilities. In Case 2 (Stranger Coin), you aren't just unsure if it's 0.5; you are sure that 0.5 is not uniquely mandated. That is a qualitative difference in your epistemic stance.
