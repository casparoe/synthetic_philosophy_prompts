answer: |-
  ### Temporal Ontology Decision Tree for Fiction

  **Instructions:** Answer the following questions based strictly on what happens in the story or what the narrator explicitly states. Do not guess the author's intent; look for evidence in the text.

  **Question 1:** Can a character access the past as a place that still *exists* (e.g., by traveling there, or viewing it on a device where events are described as "still happening" rather than "recorded")?
  *   **No:** Go to Question 2.
  *   **Yes:** Go to Question 3.

  **Question 2:** (If the past is inaccessible) Can a character access the future as a place that *exists*, or do specific predictions about the future always come true even if characters try to stop them?
  *   **No:** **Presentism**. (Only the present moment exists; the past is gone and the future is not yet real.)
  *   **Yes:** **Shrinking Block**. (The future is fixed and real, but the past has ceased to exist. *Note: This is a rare setting, often implying the universe is being 'consumed' from the past forward.*)

  **Question 3:** (If the past is accessible) Can a character access the future as a place that *exists*, or do specific predictions about the future always come true even if characters try to stop them?
  *   **No:** **Growing Block**. (The past and present exist and are fixed, but the future does not exist yet and is open.)
  *   **Yes:** Go to Question 4.

  **Question 4:** (If both past and future are accessible/fixed) If a character alters an event in the past, does the timeline split into branches, or does the original future remain unchanged?
  *   **Branches/Unchanged:** Go to Question 5.
  *   **Rewrites Single Timeline:** **The Dynamic Block Paradox**. (*Empty Node:* This combination is logically incoherent. If the future already exists to be visited, the past leading to it is fixed. Changing the past without branching implies the future did not exist yet, contradicting the answer to Question 3. Stories often hand-wave this, but it holds no stable ontology.)

  **Question 5:** (If both past and future exist and are consistent) Does the narration explicitly describe the "present moment" as having a unique, objective quality (e.g., "the light of now," "the moving edge") that distinguishes it from past and future times, even when characters are visiting those other times?
  *   **No:** **Eternalism (Block Universe)**. (All times exist equally; "now" is just a perspective.)
  *   **Yes:** **Moving Spotlight**. (All times exist, but the present is objectively privileged.)
      *   *Writer's Note:* Unless your narrator explicitly describes the "movement" or "privilege" of the present, readers cannot distinguish this from Eternalism. If the plot mechanics are identical, treat them as the same setting.

  ***

  ### Test Cases

  **Capsule 1:** *A historian visits ancient Rome, participates in events the history books already record, and realizes on returning that her own interventions were in the books all along.*

  1.  **Q1 (Past Access):** **Yes.** She visits Rome and interacts; it is treated as a place she can go.
  2.  **Q3 (Future Access/Fixity):** **Yes.** The history books (future relative to Rome) already recorded her actions; the future is fixed.
  3.  **Q4 (Change/Branch):** **N/A (Consistent).** She did not change the timeline; she fulfilled it. (Path defaults to "Unchanged/Consistent").
  4.  **Q5 (Spotlight):** **No.** There is no mention of the "present" being metaphysically unique compared to Rome.
      *   **Result:** **Eternalism (Block Universe).**
      *   *Analysis:* Correct. The story treats all times as equally real and fixed.

  **Capsule 2:** *A woman watches her deceased husband through a device that shows the past as it was, and the narrator insists the husband is not merely recorded but still there, living those days, while nothing whatsoever of next year exists to be viewed.*

  1.  **Q1 (Past Access):** **Yes.** The narrator insists he is "still there, living those days," not just a recording.
  2.  **Q3 (Future Access/Fixity):** **No.** "Nothing whatsoever of next year exists."
      *   **Result:** **Growing Block.**
      *   *Analysis:* Correct. The past is real and fixed ("still there"), but the future is non-existent ("nothing... exists").

  ***

  ### Revisions and Notes

  **Revision Log:**
  During the testing of Capsule 2, the initial draft of Question 1 asked only about "physical travel." This would have incorrectly classified Capsule 2 as *Presentism* because the woman only *watches* via a device. I revised Question 1 to include observation where the narration confirms the past is "still happening" or "still there." This ensures the tree sorts by *ontology* (what exists) rather than *technology* (how they get there).

  **Indistinguishable Positions:**
  As noted in Question 5, **Eternalism** and the **Moving Spotlight** theory cannot be separated by plot mechanics alone. In both models, a time traveler can visit the past and future, and in both, the past is usually fixed. The only difference is whether the "Now" has a special metaphysical status. Unless the manuscript contains narration explicitly describing this status (e.g., "The spotlight of consciousness moved to 1920"), a writer should assume these are functionally identical for storytelling purposes.

  **Empty Node Diagnosis:**
  The **Dynamic Block Paradox** (Question 4, "Rewrites Single Timeline") is marked as empty because it combines contradictory premises. It asserts the future exists (Question 3 = Yes) while simultaneously asserting the past is mutable in a way that erases that future (Question 4 = Rewrites). In a true Block Universe, the traveler's presence in the past is already part of the block. If the past changes, the block must branch (Many Worlds) or the future couldn't have been visited in the first place (Growing Block/Presentism). Stories using this mechanic (e.g., *Back to the Future*) rely on the audience ignoring the ontological contradiction.
