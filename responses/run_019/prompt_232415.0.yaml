answer: |-
  ### 1. Examination Question

  **Module:** Moral Responsibility and the Reactive Attitudes
  **Assessment:** Take-Home Essay (Time allowance: 90 minutes)
  **Word Limit:** 1,000 words maximum

  **Question:**

  Consider the following case:
  *Casey submits a report late, violating a clear team norm. Alex, who has never submitted a late report, criticises Casey. Blake, who has frequently submitted late reports, also criticises Casey.*

  Most people intuit that while Alex's criticism is appropriate, Blake's is vulnerable to the objection: "Look who's talking." However, Casey's lateness is equally blameworthy regardless of who points it out.

  Write an essay that addresses the following:
  1.  Explain the concept of **standing to blame**. Distinguish it clearly from the truth of the moral judgement and the offender's desert.
  2.  Outline and distinguish two different explanations for why hypocrisy (like Blake's) might undermine standing: one focusing on the **sincerity or commitment** expressed by blame, and one focusing on **fairness or reciprocity** between blamer and blamed.
  3.  Test these accounts against a harder case: Suppose Blake has not reformed but struggles with weakness of will, versus a scenario where Blake has reformed and made amends. Which account better explains whether Blake retains standing in these variations?
  4.  Conclude by arguing whether the force of the "look who's talking" objection is best explained by one of these accounts alone, or by both working together.

  ***

  ### 2. Model Answer

  **Standing, Hypocrisy, and the Authority to Blame**

  To evaluate Blake's position, we must first define standing. Standing to blame is not about the correctness of the moral claim; Casey's lateness is objectively wrong regardless of the critic. Nor is it about Casey's desert; Casey deserves blame irrespective of the source. Standing is rather a normative authority or permission to *hold* another responsible through reactive attitudes like resentment or moral criticism. It is a relational status that licenses the expression of blame. Without standing, the blame may be accurate, but its expression is inappropriate, akin to a stranger interfering in a family dispute. The intuition that Blake lacks standing suggests that one's own conduct affects one's authority to demand compliance from others.

  Two primary accounts explain why hypocrisy undermines this authority. The first is the **Commitment Account**. Blame is not merely a judgement; it is a communicative act that expresses the blamer's commitment to the moral norm. When Blake criticises Casey for lateness while being late himself, Blake's actions contradict the commitment his words profess. This renders the blame insincere or expressive of a faulty moral understanding. On this view, Blake lacks standing because his blame is a lie about his own values; he claims to care about punctuality in a way his life denies. The defect is internal to the act of blaming: it fails to properly express the requisite moral regard.

  The second is the **Fairness Account**. This locates the problem not in the expression of commitment, but in the power dynamic between blamer and blamed. To blame someone is to claim a form of moral authority over them, demanding they adhere to a standard. If Blake demands Casey follow a rule Blake himself flouts, Blake claims an exemption from the shared norm. This is unfair. It treats Casey as a subordinate subject to rules that do not bind the blamer. Here, the defect is relational. Blake's history of wrongdoing creates a debt or a barrier that makes it unjust for him to occupy the moral high ground. The "look who's talking" objection is essentially a charge of unfair dominance, not necessarily insincerity.

  These accounts diverge when tested against harder cases. Consider first a **weak-willed Blake**, who hates being late, tries to be on time, but frequently fails due to weakness of will. The Commitment Account suggests Blake retains standing. He is sincere; he truly values punctuality and his blame expresses that genuine commitment, even if he fails to live up to it. His criticism is not a lie. The Fairness Account, however, suggests Blake still lacks standing. Regardless of his internal struggle, he is still demanding Casey adhere to a standard he currently violates. The unfairness of the exemption remains, even if unintentional.

  Now consider a **reformed Blake**, who was previously late but has corrected his behaviour and made amends. The Commitment Account grants standing easily; his current actions align with his words, showing sincere commitment. The Fairness Account is more complex. If the unfairness lies in claiming an exemption, reformation removes the exemption, restoring standing. However, if the unfairness lies in the history of benefiting from non-compliance while punishing others, some residual lack of standing might remain until the 'debt' is fully paid. Generally, reformation restores standing more robustly on the Fairness Account than weakness of will does, because it removes the unequal application of the norm.

  Which account best explains the force of "look who's talking"? The Commitment Account explains why hypocritical blame feels hollow or manipulative. However, it struggles to explain why we object to a weak-willed blamer who is genuinely distressed by their own failures. We still feel they should 'sort themselves out' before criticising others. This suggests the Fairness Account is more fundamental to the specific intuition of standing. The core objection to Blake is not that he is lying about his values, but that he is asserting authority he has forfeited through unfair conduct.

  Nevertheless, the strongest explanation relies on both accounts working together. The Fairness Account explains the *right* to blame (the authority), while the Commitment Account explains the *force* of blame (the moral communication). Blake's hypocrisy undermines standing because it simultaneously treats Casey unfairly and communicates a fractured moral commitment. The "look who's talking" objection lands hardest when both conditions are met: when the blamer claims an exemption and when their actions betray a lack of genuine regard for the norm they enforce. Therefore, while fairness provides the structural basis for standing, the expressive commitment provides the moral weight; losing either weakens the blame, but losing both destroys standing entirely.

  **What would change this answer**
  This answer assumes standing is primarily determined by the blamer's moral conduct relative to the blamed. If the **Relational Account** of standing were true—where standing is derived solely from specific interpersonal relationships (e.g., parent-child, friend-friend) rather than general moral reciprocity—the central claim would fail. On a strict Relational Account, Blake might retain standing to blame Casey if they are close friends, regardless of Blake's hypocrisy, because the authority stems from the relationship's history of care, not moral clean hands. If standing is a function of intimacy rather than moral parity, the fairness and commitment arguments become secondary, and the "look who's talking" objection loses its normative force in favour of relational privilege.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  | Move | Requirement | Marks | Typical Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Define Standing:** Clearly distinguish standing from the truth of the judgement and the offender's desert, identifying it as a normative authority to express blame. | 5 | Candidates often conflate standing with the correctness of the blame, arguing the hypocrite is 'wrong' rather than 'unauthorised'. |
  | **2** | **Account 1 (Commitment):** Articulate the view that blame expresses sincerity/commitment to norms, and hypocrisy undermines this expression. | 5 | Students frequently describe this vaguely as 'being a good person' rather than focusing on the expressive nature of the blaming act. |
  | **3** | **Account 2 (Fairness):** Articulate the view that blame claims authority, and hypocrisy constitutes an unfair exemption or dominance over the blamed. | 5 | Candidates often reduce this to simple 'tit-for-tat' revenge rather than a structural claim about moral authority and reciprocity. |
  | **4** | **Test Hard Cases:** Apply both accounts to the weak-willed vs. reformed variations to show where the accounts yield different results. | 5 | Essays often ignore the variation, treating all hypocrisy as identical without testing the limits of the two accounts. |
  | **5** | **Synthesis:** Conclude on whether 'look who's talking' is best explained by one or both accounts, providing a reasoned justification. | 5 | Candidates typically pick one side dogmatically without acknowledging the explanatory power the alternative account holds. |
