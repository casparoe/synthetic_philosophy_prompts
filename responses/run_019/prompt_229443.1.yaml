      *   *Req 4: Fallibilist Acceptance.* The system must accept claims with probability < 1. (Motivation: Otherwise the system is useless in uncertain worlds).
      *   *Req 5: Preface Compatibility.* The system must represent the rationality of accepting individual claims while acknowledging global fallibility. (Motivation: Preface paradox).

      *Wait, Req 2 and Req 3 conflict with Req 1 & 4 in Lottery.*
      *   If I accept Req 2 (Consistency) and Req 3 (Closure), I must reject Req 1 (Simple Threshold) or Req 4 (Fallibilism).
      *   Actually, the prompt asks for requirements an *adequate* theory must meet.
      *   So, if a theory fails Lottery, it's inadequate.
      *   So the requirements should be framed as "The system must handle Lottery without contradiction" rather than "The system must have Closure".
      *   Better: Frame requirements as functional needs.
      *   *Req 1: Non-Triviality.* Must accept some claims with p < 1.
