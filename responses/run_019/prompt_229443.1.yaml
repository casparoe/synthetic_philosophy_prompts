      *   5. **Credence Alignment:** Acceptance status must supervene on underlying probabilistic credences. (Motivation: Evidence base is probabilistic).

      *Tensions:* Req 2 (Consistency) + Req 3 (Closure) + Req 1 (Fallibilism) + Req 5 (Alignment/Threshold) = Impossible (Lottery).
      *   So one must be "partially-negotiable" or the reconciliation must explain how to break the triad.
