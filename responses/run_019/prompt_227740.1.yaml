answer: |-
  **Joint Statement on Alternative Possibilities and Moral Responsibility**

  **The Undersigned:** [Name Redacted] (Defender of Frankfurt Cases) and [Name Redacted] (Defender of PAP)

  **I. Common Ground**
  We agree to the following foundational claims to ensure our disagreement is precise:
  1.  **Actual Sequence Integrity:** In the standard Frankfurt case, the counterfactual intervener (Black) remains idle in the actual sequence; the agent's decision is causally produced by the agent's own psychology, not the intervener.
  2.  **Intervention Condition:** The intervener acts only if the agent shows a prior sign of choosing otherwise; otherwise, the device does nothing.
  3.  **Definition of Moral Responsibility:** We both define moral responsibility as the appropriateness of reactive attitudes (blame or praise) directed at the agent for the action.
  4.  **Scope of Debate:** We agree the debate concerns whether the *ability to do otherwise* is a necessary condition for moral responsibility, not whether it is sufficient.
  5.  **Fair Setup:** We agree that for a Frankfurt case to be persuasive, the prior sign must be reliably connected to the subsequent choice, though we disagree on what that reliability implies about determinism.

  **II. Table of Disagreements and Cruxes**
  The following table outlines our remaining disagreements. Each row identifies a crux, a concrete argument/case we both accept as relevant, and our respective predictions regarding intuitions or implications.

  | Crux | Position A (Anti-PAP) | Position B (Pro-PAP) | Shared Test Case & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Prior Sign Dilemma** | The causal status of the prior sign is irrelevant to responsibility in the actual sequence. | If the sign is deterministic, the case begs the question against incompatibilists; if indeterministic, alternative possibilities remain. | **Case:** A neural precursor guarantees the choice.<br>**Pred A:** Responsibility holds regardless of determinism.<br>**Pred B:** If deterministic, responsibility fails; if not, PAP is satisfied. |
  | **2. Significance of Flickers** | Alternative possibilities too trivial to be acted upon (e.g., signing a millisecond later) cannot ground responsibility. | Any alternative possibility, however thin, satisfies the Principle of Alternative Possibilities (PAP). | **Case:** Jones could have signed at *t* or *t+1*.<br>**Pred A:** Intuition of responsibility persists even if *t+1* is removed.<br>**Pred B:** Responsibility vanishes if *t+1* is removed, proving PAP holds. |
  | **3. Sourcehood vs. Leeway** | Responsibility tracks actual sequence sourcehood (how the action was produced), not leeway (what else could have happened). | Responsibility tracks leeway; sourcehood is only relevant insofar as it preserves alternative possibilities. | **Case:** Manipulation cases where sourcehood is preserved but leeway is removed.<br>**Pred A:** Responsibility remains if sourcehood is intact.<br>**Pred B:** Responsibility fails if leeway is removed. |

  **III. Application: The Ulysses Case**
  We apply our views to the specific case constructed by the reading group: *Jones installs a device to force his hand if he wavers. He does not waver. He signs deliberately.*

  **1. Is Jones responsible for the signing?**
  *   **Position A:** Yes. Jones is responsible because the actual sequence of deliberation and action was entirely his own. The presence of the device is irrelevant because it remained idle.
  *   **Position B:** Yes. However, Jones is responsible *because* he retained the ability to waver. The device removed the ability to *not sign*, but the ability to waver constitutes a sufficient "flicker" of freedom to satisfy PAP.

  **2. Does it matter that Jones installed the intervener himself?**
  *   **Position A:** No. Self-installation is historically interesting but metaphysically irrelevant to responsibility at the time of action. What matters is the current actual sequence.
  *   **Position B:** Yes. Self-installation demonstrates a prior exercise of control that preserves responsibility even if current leeway is restricted. It distinguishes this from a "manipulation" Frankfurt case.

  **3. Does the answer change if Jones wavers and the device signs?**
  *   **Position A:** Yes. Jones is not responsible for the *signing* (since he did not do it), though he may be responsible for setting up the device.
  *   **Position B:** Yes. Jones is not responsible for the *signing*. The actual sequence was interrupted by the device, breaking the link of control required for both sourcehood and leeway.

  **IV. Conclusion**
  We acknowledge that while our verdicts on the Ulysses case converge, our justifications remain mutually exclusive. Position A maintains that alternative possibilities are epiphenomenal to responsibility; Position B maintains that they are constitutive. We agree to cease arguing over the standard Frankfurt setup and instead focus future inquiry on the metaphysics of the "prior sign" and the normative significance of "flickers."

  **Signed,**
  **[Name Redacted] & [Name Redacted]**
