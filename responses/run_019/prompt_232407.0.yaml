  **The Principle Stated Precisely:**
  A privacy violation occurs when information about a person is accessed, inferred, or used in a manner that breaches the **normative expectations of the specific context** in which the information arose, particularly when the actor leverages **technology, aggregation, or positional power** to create an asymmetry that precludes reciprocal accountability.

  This principle rejects the idea that privacy is merely secrecy (Case 6, 8) or absolute control (Case 4, 10). Instead, it locates privacy in the *relationship* between the subject, the observer, and the purpose of the interaction.

  **How It Resolves the Hard Pairs:**
  *   **Cases 3 vs. 4 (Supermarket vs. Epidemiology):** Both involve inference without consent. Case 3 violates the principle because the data is repurposed for commercial profiling, creating a power asymmetry between corporation and consumer. Case 4 does not violate it because the context shifts to public health research, the data is de-identified (reducing asymmetry), and the purpose aligns with a social good that does not target individual agency.
  *   **Cases 5 vs. 6 (Neighbor vs. Street View):** Both expose the home. Case 5 violates the principle because the neighbor's *intent* is targeted surveillance, breaching the normative expectation of seclusion within a residential relationship. Case 6 is permissible because the mapping is general, incidental, and lacks targeted intent, preserving the "human scale" of observation.
  *   **Cases 8 vs. 9 (Photo vs. Face Recognition):** Both use public images. Case 8 is human-scale, incidental capture. Case 9 violates the principle because automated face recognition transforms incidental presence into systematic identification, creating a state-citizen power asymmetry that chills participation in public life.
  *   **Cases 10 vs. 3 (Colleague vs. Supermarket):** Both infer hidden states. Case 10 is permissible because it occurs within a peer-to-peer human relationship where empathy is a normative expectation, not a commercial exploitation. Case 3 is algorithmic and commercial, lacking reciprocal human judgment.

  **Resolution of Case 11 (The Unstable Verdict):**
  Your principle forces you to verdict **Case 11 as a violation**.
  Consistency with Case 1 (the diary) demands this. The wrongness lies in the *access*, not the *outcome*. Reading text messages is a breach of the normative expectation of confidentiality within a partnership. While suspicion of infidelity may justify ending the relationship or demanding transparency, it does not justify unilateral surveillance. To rule otherwise is to say that ends justify means, which contradicts your firm stance in Cases 1 and 2 that the intrusion itself is the harm.

  **The Strain: Case 6 (Street View)**
  The principle cannot accommodate **Case 6** without strain.
  If Case 5 establishes that the home is a zone of seclusion where targeted observation is wrong even from a visible vantage point, then systematic photographing and publishing of that same home by a corporation (Case 6) should also be a violation. It breaches the expectation that one's home is not part of a searchable global database.
  **Why revise this verdict?** You should accept that Case 6 *is* a privacy violation, even if a minor one. Acknowledging this preserves the integrity of the "Home as Seclusion" norm established in Case 5. The current verdict ("not a violation") concedes too much to technological convenience and weakens the boundary against the instrumentalization of private space. The price to pay is admitting that modern navigation tools come with a privacy cost that should be acknowledged, if not always prohibited.

  **Application to New Cases:**

  (a) **Verdict: Violation.** Selling health data to an insurer repurposes information beyond the context of personal wellness tracking, creating a harmful power asymmetry.

  (b) **Verdict: Violation.** A teacher reading a private note breaches the normative expectation of confidentiality between students, regardless of the school setting.

  (c) **Verdict: Violation.** A drone photographing a kitchen interior violates the reasonable expectation of seclusion in the home, exceeding the bounds of incidental public observation.

  (d) **Verdict: Violation.** While the intent is safety, incidentally recording private conversations constitutes systematic surveillance that captures information beyond the scope of the sensor's stated purpose.

  **Defense and Limitations:**
  The most plausible alternative is **Privacy as Secrecy**, which holds that anything visible or public is fair game. This fails because it cannot explain why Case 5 (visible yard) is wrong while Case 6 (visible house) is mostly okay, nor why Case 9 (public photos) is a violation. Your verdicts clearly show that visibility does not equal consent.

  I would bet this principle fails next in the face of **AI-driven behavioral inference**. As algorithms become capable of inferring intimate states (like Case 10) from purely public data (like Case 8) at scale, the distinction between "human-scale empathy" and "systematic profiling" will collapse. The principle relies on a gap between human and machine judgment that technology is rapidly closing, forcing a future reckoning where even public behavior may require protection from algorithmic interpretation.
