answer: |-
  # Handout Case Study: The Biometric Newcomb

  ## The Scenario
  You are invited to participate in a high-stakes decision experiment run by a behavioral economics lab. You stand before a table with two items:

  1.  **A Transparent Box:** Contains a visible **$1,000**.
  2.  **An Opaque Box:** Made of reinforced steel. It is either empty or contains **$1,000,000**.

  **The History:**
  Yesterday, an AI predictor analyzed your psychological profile, social media history, and past decision data. Based on this, it predicted whether you would take *only* the Opaque Box (One-Box) or *both* boxes (Two-Box).
  *   If it predicted **One-Box**, it deposited $1,000,000 into the Opaque Box.
  *   If it predicted **Two-Box**, it left the Opaque Box empty.
  The AI is not infallible, but it is highly reliable (90% accuracy in pilot studies).

  **The Mechanism (The Twist):**
  The Opaque Box is equipped with a **Haptic Intent Sensor**. To open the Opaque Box, you must place your hand on its handle. The sensor measures micro-tremors and grip tension associated with your motor intent *during the reach*.
  *   If your motor intent aligns with taking **only** the Opaque Box, the lock disengages, and you keep the contents.
  *   If your motor intent aligns with taking **both** boxes (e.g., your hand moves to grab the Opaque Box while your eyes/body orient toward the Transparent Box, or you attempt to grab both simultaneously), the sensor classifies this as a "Two-Box Reach." It instantly triggers an internal incinerator, shredding the contents of the Opaque Box before you can remove them.

  You know all of this. The money is already in the box (or not), but the box reacts to *how* you try to take it.

  **The Choice:**
  Do you commit to a **One-Box Reach** (taking only the Opaque Box) or a **Two-Box Reach** (taking both)?

  ---

  ## Decision Theory Analysis

  ### 1. Causal Decision Theory (CDT)
  **Verdict:** **One-Box.**

  **Reasoning:**
  CDT evaluates actions based on their causal consequences. It asks: "If I *do* this act, what outcomes will I *cause*?"
  *   **State of the World:** The box is either Full ($F$) or Empty ($E$). This was determined yesterday. My choice now cannot causally change the past prediction. So, $P(F | \text{do}(1\text{-Box})) = P(F | \text{do}(2\text{-Box})) = P(F)$.
  *   **Causal Consequence of Choice:** However, my choice *does* causally determine whether the money *survives*.
      *   If I **do(1-Box)**: The sensor allows access. Payoff = $\$1,000,000$ (if $F$) or $\$0$ (if $E$).
      *   If I **do(2-Box)**: The sensor incinerates the contents. Payoff = $\$1,000$ (from Transparent Box) regardless of whether $F$ or $E$.
  *   **Expected Utility Calculation:**
      *   $EU(\text{1-Box}) = P(F) \times \$1,000,000 + P(E) \times \$0$
      *   $EU(\text{2-Box}) = \$1,000$
  *   **Conclusion:** As long as the predictor is better than 0.1% accurate ($P(F) > 0.001$), CDT recommends One-Boxing. The causal link between the *act of reaching* and the *destruction of the money* overrides the independence of the past prediction.

  ### 2. Evidential Decision Theory (EDT)
  **Verdict:** **One-Box.**

  **Reasoning:**
  EDT evaluates actions based on the news they bring. It asks: "If I choose this, what is the probability the box is full, and what is my total payout?"
  *   **Evidence:** Choosing One-Box is strong evidence that the predictor anticipated this, so $P(F | \text{1-Box}) \approx 0.9$. Choosing Two-Box is strong evidence the predictor anticipated that, so $P(F | \text{2-Box}) \approx 0.1$.
  *   **Payoff Structure:** EDT also accounts for the incinerator.
      *   $EU(\text{1-Box}) = P(F | \text{1-Box}) \times \$1,000,000$
      *   $EU(\text{2-Box}) = P(F | \text{2-Box}) \times \$0 + \$1,000$ (Since the money burns if you two-box).
  *   **Conclusion:** EDT strongly recommends One-Boxing, driven by both the correlation with the prediction *and* the certainty of keeping the money.

  ### 3. Do They Agree?
  **Yes, they agree on the action (One-Box), but for different reasons.**
  *   **CDT** one-boxes because it fears *causing* the money to burn. It treats the prediction as fixed but the *access* as mutable.
  *   **EDT** one-boxes because it fears the *news* that the box is empty, compounded by the risk of burning the money.
  *   **Key Difference:** If you removed the incinerator but kept the prediction, CDT would switch to Two-Boxing, while EDT would stay One-Boxing. In *this* specific case, the incinerator forces CDT into line with EDT.

  ---

  ## The "Flip" Feature: Why CDT Changed Its Mind

  **The Feature:** **Causal Dependence of Payout Retention.**
  In standard Newcomb problems, the Opaque Box is a passive container. Once the prediction is made, the money's existence is causally independent of your choice.
  In this **Biometric Newcomb**, the Opaque Box is an *active mechanism*. Your choice (the specific motor intent of your reach) is a *cause* of whether the money remains in your possession.

  **Why the Standard Move Fails:**
  The standard CDT argument relies on the **Dominance Principle**:
  > "The money is either there or it isn't.
  > If it's there: Two-Boxing gets $\$1,001,000$ vs One-Boxing $\$1,000,000$.
  > If it's empty: Two-Boxing gets $\$1,000$ vs One-Boxing $\$0$.
  > Either way, Two-Boxing is better."

  **This fails here because the payoff matrix is different.**
  In the Biometric case, the "If it's there" row for Two-Boxing does *not* yield $\$1,001,000$. It yields $\$1,000$ because the act of Two-Boxing *causes* the $\$1,000,000$ to vanish. The states of the world (Full/Empty) are independent of your choice, but the *outcome* is not. The standard move assumes you can separate the *state of the box* from the *consequences of your interaction with it*. This scenario binds them together causally.

  ---

  ## Reversion Test: Stripping the Feature

  **What happens if we remove the Haptic Sensor?**
  If the box is a standard passive container (you can take the money out regardless of your intent):
  1.  **CDT:** Reverts to **Two-Boxing**. The money is already there. Your choice cannot causally affect the contents. Dominance applies.
  2.  **EDT:** Stays **One-Boxing**. Your choice is still evidence of the prediction.
  3.  **Result:** We return to the standard Newcomb divergence.

  This confirms that the *only* reason CDT one-boxed in the Biometric case was the introduction of a forward-looking causal link between the choice and the payout retention.

  ---

  ## Honest Assessment: Is This Still Newcomb?

  **Verdict:** **No, it is a hybrid.**
  This is not a pure Newcomb Problem. It is a **Newcomb Setup grafted onto a Causal Trap.**
  *   **Newcomb Element:** The prediction based on past data creates an evidential correlation.
  *   **Non-Newcomb Element:** The incinerator creates a *causal* penalty for Two-Boxing.

  In philosophical terms, this scenario conflates the *prediction problem* (epistemic correlation) with a *commitment mechanism* (causal constraint). A pure Newcomb problem tests how you handle correlations without causal leverage. This scenario gives CDT causal leverage.

  ### The Committed Two-Boxer's Best Response
  A staunch defender of CDT would reject this case as irrelevant to the core debate. Their response would be:

  > "You haven't shown that CDT is wrong about Newcomb's Problem; you've just changed the problem. In the classic Newcomb Problem, the box is inert. Your choice cannot reach back in time to empty it, nor does it trigger a bomb.
  >
  > In your 'Biometric' case, Two-Boxing *causes* you to lose the million dollars. Of course CDT says don't do that! That's like asking, 'Should I shoot myself in the foot to get $1,000?' CDT says no.
  >
  > This case doesn't prove CDT should one-box in *Newcomb's* Problem. It proves CDT says you shouldn't trigger self-destruct mechanisms. The interesting question remains: When the box is truly passive and the money is truly fixed, why would you leave the extra $1,000 on the table? Your handout dodges that question by making the $1,000,000 contingent on your behavior."

  ### Teaching Point for the Group
  Use this case to isolate the **Dominance Argument**.
  1.  Show that CDT *can* one-box if the causal graph allows it.
  2.  Highlight that the controversy in standard Newcomb isn't about whether to avoid causal self-sabotage (everyone agrees on that).
  3.  The controversy is strictly about whether **correlations without causation** should influence rational choice. This case "solves" the Newcomb problem for CDT by adding causation, thereby revealing that the heart of the original paradox is the *absence* of such causal links.
