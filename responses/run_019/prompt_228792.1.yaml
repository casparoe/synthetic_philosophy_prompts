  **Verdict:** Ms. Okafor will classify the Global Droughts of the 1870s as **Background Conditions**, not historical actors.

  **The Rule:** Ms. Okafor is not actually running the "changes who wins" test; she is running the **"Ontological Agency" Rule**. Under this system, a non-human force only counts as an "actor" if its ability to alter history stems from its own biological or ecological nature interacting directly with human bodies (like a pathogen), rather than from humans failing to mitigate a static environmental force (like weather or geology).

  **Why This Rule Fits All Her Calls:**
  You noted two conflicting explanations: the "changes who wins" comment and the "germ vs. volcano" comment. The "changes who wins" metric is a red herring—it describes the *result* of an actor, but not the *definition*. We know this because the 1815 Tambora eruption absolutely changed who won in various local struggles (it sparked religious revivals, crop failures, and migration), yet she still labeled it "background." If "changing who wins" were the real rule, Tambora would be an actor.

  The only rule that consistently separates her "Actors" from her "Background" cases is the **Ontological Agency** distinction:
  *   **Actors (Smallpox, Black Death, Yellow Fever):** These are biological systems. They "respond" to human movement (trade routes, troop encampments) and exploit inherent human vulnerabilities (immunity gaps). The asymmetry comes from *within* the human population (some bodies resist, some don't).
  *   **Background (Tambora, Little Ice Age):** These are geological/climatological forces. They do not adapt; they simply occur. The asymmetry of their impact depends entirely on *external* human infrastructure (who had grain stores, who had warm clothes), not on the force itself "choosing" a side.

  **Application to the 1870s Droughts:**
  The 1870s El Niño droughts fit the **Background** category. Like Tambora, a drought is a meteorological event; it does not biologically target specific bodies. The reason Europe survived while India, China, and Brazil suffered millions of deaths was not because the drought "spared" Europe (the weather patterns were global), but because Europe had **railroads and grain markets** to mitigate the effect. The asymmetry was created by human policy (colonial export laws), not by the drought itself. In Ms. Okafor's system, the drought is the scenery; the British grain policy is the actor. The drought is a "volcano," not a "germ."

  **The Case Doing the Most Work:**
  The **1815 Tambora eruption** is the linchpin of this prediction. It is the closest analog to the 1870s droughts (a global climate shock causing famine). By marking Tambora as "background," Ms. Okafor signaled that environmental catastrophes, no matter how deadly, are merely the stage upon which humans act unless they possess biological agency. If you argue the 1870s drought is an actor, you have to explain why Tambora isn't, and there is no consistent logical ground to do so.

  **The Future Test Case:**
  To definitively settle whether her "changes who wins" comment was ever the real rule, watch how she handles the **2004 Indian Ocean Tsunami**.
  *   **The Scenario:** The tsunami killed 230,000 people and temporarily halted the civil war in Sri Lanka as rebels and government forces paused to deal with the disaster.
  *   **The Test:** If she calls the Tsunami an **Actor**, she is secretly using the "changes who wins" rule (it altered a war's trajectory). If she calls it **Background**, she is committed to the "Ontological Agency" rule (it is geology/water, not biology). Given her Tambora ruling, she should call it Background, but this case would force her to reveal if political impact can ever override ontology in her grading scheme.
