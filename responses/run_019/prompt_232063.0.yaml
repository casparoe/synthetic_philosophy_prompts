          *   *Refinement:* Focus on the *penalty*. If I can predict better with individuals, why keep the macro?
          *   *Follow-up:* Block the "abstraction is useful" move. Distinguish utility from truth.

      *   *Q2: Multiple Realizability (MR).* This is the holist's favorite shield.
          *   *Idea:* If inflation is realized by many different individual beliefs, does "inflation" explain anything?
          *   *Refinement:* Challenge whether MR supports *explanation* or just *description*.
          *   *Follow-up:* Is the pattern in the world or in our labeling?

      *   *Q3: Supervenience/Causal Closure.* The heavy metaphysics.
          *   *Idea:* If individuals fix the social facts, what's left for social facts to do?
          *   *Refinement:* Use the "causal exclusion" argument.
          *   *Follow-up:* Block the "different granularity" excuse. Ask about overdetermination.

      *   *Q4: Circularity (Norms/Roles).* The chicken-and-egg problem.
          *   *Idea:* Norms shape individuals, individuals make norms.
          *   *Refinement:* How does the norm get *in* the first place without presupposing it?
          *   *Follow-up:* Demand a temporal or mechanistic account of the feedback loop's origin.

      *   *Q5: Intervention/Manipulation.* Data people love this (causal inference).
