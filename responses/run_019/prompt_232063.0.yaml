      *   *Q7: The "Canned Reply" Trap.* Specifically targeting the "causal relevance vs. machinery" distinction he likes.
          *   *Idea:* He says macro is relevant even if micro is the machinery.
          *   *Refinement:* When does relevance become an illusion?
          *   *Follow-up:* Force a distinction between *epistemic* relevance (for us) and *ontic* relevance (in the world).

      *   *Q8: Emergence and Downward Causation.*
          *   *Idea:* Does the whole constrain the parts?
          *   *Refinement:* How does the constraint transmit physically?
          *   *Follow-up:* If it transmits via individuals, isn't the individual the real cause?

