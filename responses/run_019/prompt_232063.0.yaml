  2.  **Deconstruct the Philosophical Position (Explanatory Holism):**
      *   *Core Claim:* Social phenomena cannot be fully explained by reducing them to individual psychology/action. Social entities have causal powers or explanatory indispensability.
      *   *Common Defense:* Functional autonomy, multiple realizability, causal relevance at higher levels.
      *   *Common Objections:* Methodological individualism, causal closure of the physical/individual, circularity.

  3.  **Drafting the Sequence (Iterative Process):**

      *   *Q1: Warm-up/Microfoundations.* Start with the demand for mechanisms.
