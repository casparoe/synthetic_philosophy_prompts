prompt: |-
  On a rationality forum I read, people defend cooperating in a one-shot prisoners dilemma with what they call the mirror argument: if your opponent is an exact copy of you -- same values, same reasoning, same everything -- then choosing is like raising your hand in front of a mirror. Whatever you do, the reflection does too, so the only outcomes on the table are both-cooperate and both-defect, and cooperate obviously wins. They use this to say defecting against a copy is just irrational, no enforcement or repetition needed, and they extend it to voting: if it makes sense for me to stay home because one vote never decides anything, then it makes sense for everyone who thinks like me to stay home, so the mirror says go vote.

  Something feels off to me. A mirror's arm moves because yours moved -- nobody thinks the copy's choice is *caused* by mine, we're in seperate rooms deciding independently. So can you audit the analogy? Give me the correspondence table (what plays the role of the mirror, the reflection, the causal link between me and the glass), say which disanalogies actually matter for the conclusions its being asked to carry and which are just cosmetic, and tell me whether cooperate still wins once the "my choice moves theirs" picture is stripped out -- i.e. whether correlation-without-causation can do the same argumentative work. And if the mirror is the wrong image, what's a better analogy for whatever the symmetry of two identical reasoners actually buys you? Finally, does the voting extension survive, given that there the "copies" are merely similar people rather than exact duplicates?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** The "Mirror Argument" (or Logical Decision Theory/Superrationality) applied to the One-Shot Prisoner's Dilemma (PD) and Voting.
      *   **User's Skepticism:** The user feels the mirror analogy is misleading because there's no *causal* link between the player and the "reflection" (opponent). They are in separate rooms.
      *   **Tasks:**
          1.  Audit the analogy (create a correspondence table).
          2.  Identify which disanalogies matter vs. are cosmetic.
          3.  Determine if "cooperate" still wins without the causal picture (correlation vs. causation).
          4.  Propose a better analogy if the mirror is wrong.
          5.  Evaluate the voting extension (similar people vs. exact duplicates).

  2.  **Analyze the "Mirror Argument" (Superrationality/Logical Decision Theory):**

      *   *Premise:* If two agents are identical in reasoning and information, they will output the same decision for the same problem.
      *   *Mechanism:* It's not physical causation (A pushes B). It's logical correlation (A and B run the same algorithm $f(input)$, so $output_A = output_B$).
      *   *PD Application:* Since $Action_A = Action_B$, the only possible outcomes are (C, C) and (D, D). Since (C, C) > (D, D), a rational agent chooses C.
      *   *Voting Application:* If I reason "my vote doesn't matter," all identical reasoners reason the same. If we all stay home, the outcome changes. Therefore, I should vote to influence the cohort of identical reasoners.

  3.  **Task 1: Correspondence Table (Auditing the Analogy):**

      *   *Mirror:* The logical structure/algorithm shared by both agents.
      *   *Reflection:* The opponent's decision.
      *   *Arm:* The agent's own decision.
      *   *Causal Link (Physical):* Light bouncing off glass (absent in PD).
      *   *Causal Link (Logical):* Mathematical identity of the reasoning process.

  4.  **Task 2: Disanalogies (Matter vs. Cosmetic):**

      *   *Cosmetic:* Physical separation, time delay, lack of photons. These don't affect the logical identity.
      *   *Matter:* The *certainty* of identity. In a real mirror, identity is physical law (100% guaranteed). In PD, identity is a psychological/algorithmic assumption (probabilistic). If there's even a tiny chance the other person reasons differently, the "mirror" cracks.
      *   *Matter:* Causality vs. Correlation. The user is right that there is no *causal* power. But does the argument *need* causality? This is the crux of Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT).

  5.  **Task 3: Correlation without Causation (Does Cooperate Win?):**

      *   *CDT View:* No. My choice doesn't cause theirs. I should defect regardless.
      *   *EDT/LDT View:* Yes. My choice is *evidence* of theirs. If I choose C, it is highly probable they chose C. I maximize expected utility based on this correlation.
      *   *The "Newcomb" Connection:* This is essentially Newcomb's Problem. The "mirror" is Omega's prediction.
      *   *Conclusion:* Cooperate wins *only if* you accept that rational choice should account for logical correlations (Logical Decision Theory) rather than just physical causal levers (Causal Decision Theory). The user's intuition aligns with CDT. The forum posters align with LDT/EDT.

  6.  **Task 4: Better Analogy:**

      *   Mirror implies passivity/reflection.
      *   Better: **Running the same source code on two different computers.**
      *   Or: **Two calculators computing $2+2$.**
      *   Why? It emphasizes the *algorithm* rather than the *image*. It highlights that the output is determined by the function, not by one machine signaling the other.

  7.  **Task 5: The Voting Extension:**

      *   *PD:* Exact copies (hypothetically).
      *   *Voting:* Merely *similar* people.
      *   *The Leak:* The correlation is much weaker. If I stay home, does a million others definitely stay home? No. Maybe only 10% think like me.
      *   *The Math:* Expected Utility = (Probability my cohort shifts) * (Value of outcome) - (Cost of voting).
      *   *Survival:* The argument survives *in principle* but weakens *in practice*. It becomes a calculation of "how similar are they?" rather than "they are me." It shifts from "I determine the outcome" to "I am a sample of a bloc."
      *   *Kantian Imperative:* It's essentially a secular, game-theoretic version of the Categorical Imperative.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, philosophical, respectful of the user's skepticism (which is standard CDT).
      *   *Structure:* Follow the user's requested points (Table, Disanalogies, Causation, Better Analogy, Voting).
      *   *Key Distinction:* Must clearly distinguish between Causal Decision Theory (CDT) and Evidential/Logical Decision Theory (EDT/LDT). The user's objection *is* the CDT objection.
      *   *Refining the "Mirror":* The mirror is actually bad because it implies the reflection happens *after* the action. In logic, the decision is simultaneous. The "Source Code" analogy is much stronger.
      *   *Refining Voting:* Be careful not to overstate the voting case. The PD case relies on *identity*. The Voting case relies on *similarity*. The leap is significant.

  9.  **Self-Correction/Nuance Check:**
      *   *Did I answer the "correlation without causation" part clearly?* I need to explain *why* correlation matters to some rationality frameworks (LDT) but not others (CDT). The user asks if it "can do the same argumentative work." The answer is "Yes, but only if you change your definition of rational choice."
      *   *Is the voting argument sound?* Many economists say no (pivot probability is too low). The "mirror" argument says yes (logical correlation). I need to present the tension.
      *   *Make sure to validate the user's intuition:* Their feeling that "no causal link" exists is physically correct. The philosophical leap is whether *logical* links count for decision making.

  10. **Final Polish:** Check against the prompt requirements one last time.
      *   Correspondence table? Yes.
      *   Disanalogies (matter vs cosmetic)? Yes.
      *   Correlation without causation work? Yes.
      *   Better analogy? Yes.
      *   Voting extension survive? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a classic debate in decision theory, pitting **Causal Decision Theory (CDT)** against **Evidential Decision Theory (EDT)** or the newer **Logical Decision Theory (LDT)**. Your intuition that "my choice doesn't cause theirs" is the exact foundation of CDT, which is the standard view in economics and classical game theory. The forum posters are arguing from LDT/EDT.

  Here is the audit of the mirror analogy, the breakdown of the logic, and the verdict on whether the argument holds water.

  ### 1. The Correspondence Table

  To audit the analogy, we must map the physical mirror scenario to the game-theoretic scenario.

  | Mirror Scenario | Prisoner's Dilemma Scenario | Function in Argument |
  | :--- | :--- | :--- |
  | **You** | **Agent A (You)** | The decision-maker. |
  | **The Reflection** | **Agent B (Opponent)** | The "other" player whose move matters. |
  | **The Mirror Glass** | **Logical Identity / Source Code** | The mechanism ensuring outputs match. |
  | **Light/Physics** | **Mathematical Truth** | The medium of the link. |
  | **Arm Movement** | **Choosing "Cooperate" or "Defect"** | The output of the reasoning process. |
  | **Visual Feedback** | **None (Simultaneous Choice)** | *Major Disanalogy.* |

  ### 2. Disanalogies: Cosmetic vs. Critical

  You noted that "nobody thinks the copy's choice is *caused* by mine." This is the crux of the audit.

  **Cosmetic Disanalogies (Do not break the argument):**
  *   **Physical Separation:** Being in different rooms doesn't matter if the reasoning is internal and identical.
  *   **Time Delay:** In a mirror, the reflection moves *after* you (at the speed of light). In the PD, moves are simultaneous. However, since logical truth is timeless, the "order" of calculation doesn't matter. $2+2=4$ is true regardless of when you calculate it.
  *   **Sensory Feedback:** You can see the mirror; you can't see the opponent. This doesn't matter because the argument relies on *predicting* the opponent via self-knowledge, not observing them.

  **Critical Disanalogies (Where the argument bleeds):**
  *   **Physical Necessity vs. Psychological Contingency:** A mirror reflection is physically guaranteed by the laws of optics. An opponent's identical choice is only guaranteed if they are *truly* identical in reasoning, information, and state. If there is even a 1% chance they reason differently (e.g., they have a different risk tolerance, or they made a random error), the "mirror" is cracked.
  *   **Causality vs. Logical Correlation:** This is your main objection. In the mirror, your arm moving is the *cause* of the reflection moving (via photons). In the PD, your choice is not the cause of their choice. They are both effects of a common cause: **the shared algorithm.**
      *   *Why this matters:* If you believe rationality is about pulling levers that *cause* outcomes (CDT), the mirror argument fails. If you believe rationality is about selecting the output that provides the best *evidence* of a desirable world (EDT/LDT), the mirror argument holds.

  ### 3. Does Cooperate Win Without Causation?

  You asked: *Can correlation-without-causation do the same argumentative work?*

  **The Short Answer:** Yes, but only if you accept a specific definition of "rationality."

  **The Long Answer:**
  In standard Causal Decision Theory (your intuition), the answer is **No**.
  *   **Reasoning:** The outcome is already fixed by the opponent's choice. My choice cannot change a fixed past/simultaneous event. Therefore, I face a fixed column in the payoff matrix. Defecting always yields a higher payoff against a fixed column.
  *   **Verdict:** Defect.

  In Logical Decision Theory (the forum's view), the answer is **Yes**.
  *   **Reasoning:** I am not choosing an action in a vacuum; I am choosing the output of a logical algorithm. Since the opponent runs the same algorithm, choosing "Cooperate" logically entails that the opponent's algorithm outputs "Cooperate." I am not *causing* their move; I am *selecting* the logical reality where we both cooperate.
  *   **Analogy:** Imagine two calculators in separate rooms. Both are set to compute $2+2$. If I press "equals" on mine and get "4", I know with certainty the other calculator displays "4". Did my calculator *cause* the other to display 4? No. But can I reason about the other calculator's display by looking at mine? Yes.
  *   **Verdict:** Cooperate.

  **The Audit:** The mirror argument strips out causation correctly, but it hides the cost. It works *only* if you treat your decision as a logical variable that binds both agents simultaneously. If you view your decision as a local physical event, the argument collapses.

  ### 4. A Better Analogy: The Source Code

  The mirror is a bad image because it implies passivity and visual reflection. A better analogy is **Distributed Computing.**

  **The Image:**
  Imagine you and your opponent are two distinct servers running the exact same open-source software (version 1.0) with the exact same input data.
  *   **The Decision:** The software outputs a command.
  *   **The Link:** You don't need to network the servers. Because the code is identical, `Output_Server_A` will mathematically equal `Output_Server_B`.
  *   **The Choice:** You have access to the source code (your own mind). You can patch the code to output "Cooperate" instead of "Defect."
  *   **The Result:** By patching your local code, you know the remote server's output changes too, not because of a signal, but because $f(x) = f(x)$.

  **Why this is better:**
  It removes the "spooky action at a distance" feeling of the mirror. It clarifies that the link is **mathematical identity**, not physical influence. It validates the user's skepticism about causality while preserving the logical correlation.

  ### 5. Does the Voting Extension Survive?

  This is where the argument faces its steepest climb.

  **The PD Case:** Requires **Identity**. (I am facing *me*).
  **The Voting Case:** Requires **Similarity**. (I am facing *people like me*).

  **The Breakdown:**
  1.  **Weakening the Link:** In the PD mirror argument, the correlation is near 1.0 (if we are truly identical copies). In voting, the correlation is probabilistic. If I decide to vote, does every other rational person who *might* think like me also vote? No. Some will be tired, some will be slightly different, some will reason differently.
  2.  **The "Pivot" Problem:** In PD, your choice switches the outcome from (D,D) to (C,C). In voting, your choice (and your "logical cohort's" choice) only matters if the election is close.
  3.  **The Calculation:**
      *   **PD:** $Utility(Cooperate) > Utility(Defect)$ because $Reward_{mutual} > Punishment_{mutual}$.
      *   **Voting:** $Utility(Vote) = (Probability\_Cohort\_Shifts \times Probability\_Election\_Close \times Value\_Of\_Win) - Cost\_Of\_Voting$.

  **Verdict on Voting:**
  The mirror argument **survives in principle but weakens in practice.**
  *   **Principle:** It successfully counters the "my one vote doesn't matter" claim. If you are one of 10,000 identical reasoners, and you stay home, the model predicts the other 9,999 stay home too. The bloc matters.
  *   **Practice:** Because the "copies" are merely similar, the correlation is leaky. You cannot assume *all* similar people follow your logic. You must estimate the size of your "logical cohort."

  However, the argument does transform voting from a "waste of time" into a **Kantian Categorical Imperative**: *Act only according to that maxim whereby you can, at the same time, will that the same maxim should become a universal law among people who reason like you.*

  ### Summary Audit

  1.  **Your Intuition:** You are correct that there is no *causal* link. The mirror analogy obscures this.
  2.  **The Forum's Logic:** They are relying on *logical* correlation (LDT). If you accept LDT, their conclusion is valid. If you hold to CDT, their conclusion is invalid.
  3.  **The Analogy:** Replace "Mirror" with "Identical Source Code." It removes the magical thinking and highlights the mathematical constraint.
  4.  **Voting:** The logic extends, but the certainty drops from "Mathematical Truth" to "Statistical Probability." It justifies voting as a duty to your "logical cohort," but it doesn't guarantee your vote will decide the election.

  **Final Verdict:** The mirror argument is a poetic way of describing **Logical Decision Theory**. It is not a physical claim about causality. If you reject the premise that "my choice is evidence of a logical truth binding others," the argument fails. If you accept that premise, the argument is sound, and the mirror is just a slightly misleading illustration of a mathematical identity.
