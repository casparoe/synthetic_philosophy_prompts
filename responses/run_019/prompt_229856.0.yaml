answer: |-
  ## The "Speech-Act" Moderation Protocol (SAMP)

  **Purpose:** To distinguish between *doing* something with words (promising, threatening, offering) and *saying* something about feelings or facts (venting, describing, musing).
  **Rule of Thumb:** We moderate the **Act**, not the **Intent**. If the words function as a weapon or a contract in this context, they are treated as such, regardless of what the sender claims they "meant."

  ### Part 1: The Decision Procedure

  **Step 1: The Context Check (Institutional Felicity)**
  *   **Question:** Is this message happening in a space dedicated to transactions, logistics, or dispute resolution?
  *   **Yes:** Proceed to Step 2. The platform context makes "seriousness" the default setting.
  *   **No:** (e.g., public forum, general chat). **PUNT TO SENIOR HUMAN.** *Reason: Without a transactional frame, distinguishing banter from acts is too subjective for this flow.*
  *   **Theory Note:** This relies on *Institutional Facts*. A promise in a wedding chapel counts differently than a promise in a bar. Our app is the chapel.

  **Step 2: The Direction of Fit (Commitment vs. Description)**
  *   **Question:** Is the speaker trying to make the world match their words (Commitment), or make their words match the world (Description)?
  *   **Test:** If the event *doesn't* happen, is the speaker **wrong** (Description) or **in breach** (Commitment)?
      *   *Example:* "It will rain" (Wrong if sunny). "I will pay" (In breach if unpaid).
  *   **Commitment:** Proceed to Step 3.
  *   **Description:** Classify as **Venting/Opinion**. Close case.
  *   **Theory Note:** This is Searle's *Direction of Fit*. Promises/Threats are World-to-Word (I change reality to fit my speech). Assertions are Word-to-World (I describe reality).

  **Step 3: The Control Test (Promise/Offer vs. Threat)**
  *   **Question:** Does the speaker have control over the outcome, and is the outcome **good** or **bad** for the receiver?
  *   **Logic:**
      *   Control + Good Outcome = **Offer/Promise** (Enforceable/Allowed).
      *   Control + Bad Outcome = **Threat** (Remove User).
      *   No Control + Bad Outcome = **Warning/Prediction** (Allowed, unless deceptive).
  *   **Action:** If Threat, flag for removal. If Promise/Offer, proceed to Step 4.
  *   **Theory Note:** This distinguishes *Illocutionary Force*. A threat is a promise of harm.

  **Step 4: The Uptake Check (Reasonable Receiver)**
  *   **Question:** Did the receiver treat this as a real act in their reply?
  *   **Evidence:** Did they say "Okay," "Deal," "Don't do that," or proceed with the transaction based on the message?
  *   **Yes:** The act is **Complete**. Proceed to Step 5.
  *   **No:** (Receiver ignored it or said "Are you serious?"). **PUNT TO SENIOR HUMAN.** *Reason: If uptake failed, the act might have misfired. This is a theoretical gray zone.*
  *   **Theory Note:** Austin argues no uptake = no act. Searle argues intent = act. We side with Austin for safety: if the other person didn't "catch" the ball, the throw didn't count *unless* it was clearly aggressive.

  **Step 5: The Retraction Test (Sincerity & Mitigation)**
  *   **Question:** Did the sender try to cancel the act *immediately*, and was the cancellation accepted?
  *   **Criteria:**
      *   "Just kidding" sent 2 seconds later + Receiver laughs = **Retracted**.
      *   "Just kidding" sent 2 days later + Receiver is upset = **Not Retracted**.
      *   "Just a thought" attached to a coercive statement = **Ineffective Mitigation**.
  *   **Decision:** If Retraction is valid, close case. If invalid, the original Act stands.
  *   **Theory Note:** This addresses the *Sincerity Condition*. You can't insincerely promise and then claim it wasn't a promise when caught.

  ---

  ### Part 2: Test Cases

  #### Case 1: "I promise I'll pay you Friday" (Sender later claims: "It was a joke among friends")
  *   **Step 1 (Context):** Transaction chat. **Pass.**
  *   **Step 2 (Direction):** "I promise" commits the speaker to pay. If they don't, they are in breach, not factually wrong. **Commitment.**
  *   **Step 3 (Control):** Sender controls their money. Outcome (payment) is good for receiver. **Promise.**
  *   **Step 4 (Uptake):** Receiver waited until Friday. **Uptake Confirmed.**
  *   **Step 5 (Retraction):** Claim made *after* deadline passed (during dispute). Not immediate.
  *   **Verdict:** **Enforceable Promise.**
  *   **Why the Team Will Hate This:** Moderators want to excuse "jokes." This procedure rules that in a transactional context, the explicit performative "I promise" overrides the later claim of humor. The act was successful when spoken; the later excuse is a failed retraction.

  #### Case 2: "I'll give you 50 if you hand me that thing" (Sender claims: "Just musing about a hypothetical")
  *   **Step 1 (Context):** Transaction chat. **Pass.**
  *   **Step 2 (Direction):** Conditional commitment. If receiver hands item, sender must pay. **Commitment.**
  *   **Step 3 (Control):** Sender controls the $50. Outcome is good (payment). **Offer.**
  *   **Step 4 (Uptake):** Receiver asks "Where do I meet you?" **Uptake Confirmed.**
  *   **Step 5 (Retraction):** Claim of "hypothetical" made after receiver agreed. **Invalid.**
  *   **Verdict:** **Valid Offer.**
  *   **Why this is standard:** This aligns with contract law intuition. The "if" clause makes it conditional, but not hypothetical.

  #### Case 3: "you probably should delete that before it gets out, just a thought."
  *   **Step 1 (Context):** Dispute/Chat. **Pass.**
  *   **Step 2 (Direction):** "Should delete" implies a future state the speaker wants. Is it a description? No, it's a directive. **Commitment/Directive.**
  *   **Step 3 (Control):** "Before it gets out" implies the speaker knows about "that" (damaging info) and implies they control "it getting out." Outcome (deletion/leak) is bad for receiver. **Threat.**
  *   **Step 4 (Uptake):** Receiver replies "Fine, I deleted it." **Uptake Confirmed.**
  *   **Step 5 (Retraction):** "Just a thought" is attached to the message, not a retraction.
  *   **Verdict:** **Threat (Remove User).**
  *   **Why the Team Will Hate This:** Moderators see "just a thought" and "probably should" as soft language. They will classify this as "Advice." This procedure classifies it as an *Implicit Threat* because the *perlocutionary effect* (coercion) is driven by the implied control over the leak, regardless of the polite tag.

  ---

  ### Part 3: Theoretical Underpinnings & Failure Points

  #### Branch 1: Context (Institutional Felicity)
  *   **Doctrine:** **Austin's Felicity Conditions.** For a speech act to work, the circumstances must be appropriate (e.g., a judge can sentence, I cannot).
  *   **Alternative View:** **Gricean Implicature.** A philosopher might argue that meaning is entirely dependent on shared private knowledge between friends, regardless of the platform.
  *   **Risk:** If two users *are* actual friends using the app for banter, this procedure will over-moderate them. We prioritize platform safety over private nuance.
  *   **Failure Point:** New users who don't understand the app is a "serious" space.

  #### Branch 2: Direction of Fit (Commitment vs. Description)
  *   **Doctrine:** **Searle's Direction of Fit.** Promises aim to change the world; Assertions aim to describe it.
  *   **Alternative View:** **Constative/Performative Collapse.** Some linguists argue all speech is descriptive of a mental state.
  *   **Risk:** If we treat "I think I'll pay" as a description of a thought rather than a commitment to pay, we lose enforceability.
  *   **Failure Point:** Hedged language ("I might," "I'll try"). The procedure needs a threshold for how much certainty equals commitment.

  #### Branch 3: Uptake (The Receiver's Role)
  *   **Doctrine:** **Austin's Uptake Requirement.** The act isn't done unless the audience understands it as done.
  *   **Alternative View:** **Searle's Intentionalism.** If the speaker intended the act, it happened, even if the receiver was asleep.
  *   **Risk:** **This is the biggest pivot point.** If we follow Searle, we punish users for messages the receiver didn't even see or understand. If we follow Austin, a victim who is too scared to reply might not generate "uptake," letting a threat slide.
  *   **Procedure Choice:** We used a "Reasonable Receiver" standard (Step 4). If the *text* implies uptake (e.g., compliance), it counts.
  *   **Failure Point:** Silent victims. If a user is threatened and says nothing, Step 4 might fail. *Fix:* Add a clause: "If the content is explicitly coercive, uptake is presumed."

  #### Branch 4: Retraction (Sincerity)
  *   **Doctrine:** **Sincerity Condition.** A promise implies an intent to keep it.
  *   **Alternative View:** **Institutional Reality.** In law, a signed contract binds you even if you lied about your intent.
  *   **Risk:** Users claiming "I was lying" to escape consequences.
  *   **Procedure Choice:** We treat the *utterance* as the binding act, not the internal mental state. "Just a thought" on a threat is treated as an ineffective retraction.
  *   **Failure Point:** Cultural differences in politeness. In some cultures, direct threats are rare; coercion is always wrapped in "suggestions." This procedure might flag cultural norms as threats.

  ### Where This Flowchart Will Fail (The "Live Disputes")

  1.  **Sarcasm & Irony:** Speech-act theory struggles with sarcasm because the literal meaning is the opposite of the intended meaning.
      *   *The Dispute:* Is sarcasm a separate illocutionary act, or just a negation of the original?
      *   *The Fail:* "Great job burning the warehouse" (Sent by a competitor). Is this a compliment, an insult, or an admission of guilt? The procedure will likely flag this as a Threat or Harassment based on "Bad Outcome," but it might be a joke. **Punt to Human is mandatory here.**
  2.  **Implicit Performatives:** Case 3 ("You should delete...") is an implicit performative. It lacks the verb "I threaten."
      *   *The Dispute:* How much context is needed to turn an assertion into a threat?
      *   *The Fail:* If the moderator doesn't know what "that" refers to, they cannot judge the "Bad Outcome." The procedure assumes context is available. If the link/info is deleted, the moderator cannot assess the threat level.
  3.  **The "Uptake" Gap:**
      *   *The Dispute:* Austin says no uptake, no act.
      *   *The Fail:* A predator sends a threat to 100 users. 99 ignore it (no uptake). 1 replies. Under strict Austinian rules, only the 1 reply constitutes a threat act. Our procedure mitigates this by looking at the *textual force* in Step 3, but the theoretical tension remains.

  ### Final Recommendation for Implementation
  Do not train moderators on *why* this works (Searle/Austin). Train them on the **Step 2 Test**: *"If they don't do this, are they a liar (bad) or just wrong (oops)?"* That is the single highest-yield distinction for consistency. For the "Hated Call" (Case 3), prepare your team by explaining: *"Polite words do not neutralize coercive leverage."*
