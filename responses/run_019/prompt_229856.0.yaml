prompt: |-
  The marketplace app I run trust and safety for makes users do their deals in plain chat messages, and we have to decide whether a flagged message is a promise or offer we'll enforce, a threat we remove the user for, or just someone venting. The moderators making these calls are contractors with no philosophy background and about ten minutes a case, and every week decisions get reversed because two people read the same sentence differently. I've been told speech-act theory is the right lens here — that saying something can do something, that promises and threats are acts rather than descriptions — but I've never seen it turned into something my team can actually run. Write me a decision procedure for a flagged message: the questions in order, what counts as a sufficient answer to move to the next step, where a message fails to be a promise/offer/threat rather than merely reporting the speaker's state of mind, and where the procedure has to stop and punt to a human because the theory itself has a live dispute underneath it. Keep it grounded in the real distinctions — explicit vs implicit performatives, felicity conditions, uptake, sincerity, direction of fit, the difference between the act succeeding and its perlocutionary effects — but translate them into moderator language, no jargon dumps.

  Then run the procedure on three test cases: (1) "I promise I'll pay you Friday" where the sender later says it was a joke among friends; (2) "I'll give you 50 if you hand me that thing" where the sender claims they were just musing about a hypothetical, not making an offer; (3) "you probably should delete that before it gets out, just a thought." Make sure one of your worked examples reaches a call my team would hate, because a procedure that always agrees with my moderators isn't doing work.

  Finally, for each major branch, tell me which bit of speech-act doctrine it leans on and what alternative view would flip that branch — say, whether uptake is necessary for a promise, or whether an insincere performative still performs — and be explicit about where your flowchart is most likely to fail or what would have to be true for you to draw the boxes differently.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A marketplace app Trust & Safety team.
      *   **Problem:** Moderators (contractors, non-experts, 10 mins/case) are inconsistent in classifying messages (Promise/Offer vs. Threat vs. Venting/Description). Decisions get reversed.
      *   **Goal:** Create a decision procedure (flowchart/checklist) based on Speech-Act Theory (SAT) but translated into plain moderator language.
      *   **Requirements:**
          *   Order of questions.
          *   Sufficient answers to proceed.
          *   Distinction between acts (promises/threats) and reports of state of mind.
          *   "Punt to human" points where theory is disputed.
          *   Translate jargon (felicity conditions, uptake, direction of fit, perlocutionary) into operational terms.
          *   Run the procedure on three specific test cases.
          *   One test case must yield a counter-intuitive/hated result (to show the procedure does work).
          *   Explain the underlying theory for each branch and alternative views that would change the outcome.
          *   Identify failure points/limitations.

  2.  **Deconstruct Speech-Act Theory for Moderation:**
      *   *Core Concept:* Words = Actions.
      *   *Key Distinction:* Constative (describing) vs. Performative (doing).
      *   *Illocutionary Act:* The intent/force (promising, threatening, offering).
      *   *Perlocutionary Effect:* The result (buyer feels safe, seller feels scared). *Crucial:* Moderation should focus on Illocution (the act), not Perlocution (the feeling), though Perlocution helps evidence.
      *   *Felicity Conditions:* What makes the act "valid"? (Authority, context, sincerity, uptake).
      *   *Direction of Fit:* World-to-Word (Promise/Threat) vs. Word-to-World (Assertion).
      *   *Uptake:* Did the receiver understand it as that act?

  3.  **Drafting the Decision Procedure (The "Moderator Flowchart"):**
      *   *Goal:* Simple, binary questions.
      *   *Step 1: Context Check.* Is this a transaction space? (Filters out pure venting).
      *   *Step 2: The "Action" Test (Direction of Fit).* Is the speaker committing to *make* something happen, or just saying what *is*?
      *   *Step 3: The "Control" Test.* Does the speaker control the outcome? (Distinguishes Promise/Offer from Threat).
      *   *Step 4: The "Receiver" Test (Uptake).* Did the other person treat it as binding/scary?
      *   *Step 5: The "Retraction" Test.* Can they take it back easily? (Distinguishes Joke/Musing from Act).
      *   *Punt Points:* Ambiguous context, sarcasm detection, power dynamics.

      *Refining the Jargon Translation:*
      *   "Felicity Conditions" -> "Does this fit the situation?"
      *   "Uptake" -> "Did the other person act like it was real?"
      *   "Direction of Fit" -> "Changing the future vs. Describing the future."
      *   "Perlocutionary" -> "The emotional fallout."

  4.  **Developing the Test Cases:**
      *   *Case 1:* "I promise I'll pay you Friday" (Later: "Just a joke").
          *   *Analysis:* Explicit performative ("I promise"). Context matters. If it's a marketplace deal, jokes are risky.
          *   *Desired Outcome:* Enforceable Promise (Moderators might hate this if they value "intent" over "wording").
      *   *Case 2:* "I'll give you 50 if you hand me that thing" (Claim: "Hypothetical").
          *   *Analysis:* Conditional offer. "If" clause. Context: Marketplace.
          *   *Desired Outcome:* Valid Offer.
      *   *Case 3:* "you probably should delete that before it gets out, just a thought."
          *   *Analysis:* Implicit threat? Or advice? "Before it gets out" implies knowledge of damaging info.
          *   *Desired Outcome:* Threat (Coercion). This is the "hated" one. Moderators often see "just a thought" as safe. SAT says the *force* is coercive regardless of the tag.

  5.  **Mapping Theory to Branches:**
      *   *Branch 1 (Action vs. Description):* Austin's Constative/Performative distinction. *Alternative:* Searle's Propositional Content.
      *   *Branch 2 (Control/Direction):* Searle's Direction of Fit. *Alternative:* Gricean Implicature (maybe they implied control?).
      *   *Branch 3 (Uptake):* Austin's Uptake requirement. *Alternative:* Searle (Intent is enough, uptake is just effect). *Crucial dispute point.*
      *   *Branch 4 (Sincerity/Retraction):* Sincerity condition. *Alternative:* Institutional facts (If you say it in a bank, it counts, even if lying).

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the pain point. Set the tone (pragmatic, not academic).
      *   *The Procedure:* Use bold headers, yes/no logic. Define "Pass/Fail" clearly.
      *   *The Test Cases:* Apply the logic strictly. Ensure Case 3 hits the "Threat" bucket despite the "just a thought" tag.
      *   *The Theory & Disputes:* Be honest about where SAT is messy. Highlight the "Uptake" debate as the biggest risk.
      *   *Failure Modes:* Where will this break? (Sarcasm, cultural nuance, power dynamics).

  7.  **Review and Refine:**
      *   *Check:* Did I avoid jargon dumps? *Yes, defined them in context.*
      *   *Check:* Is one result "hated"? *Case 3 is the best candidate. Moderators hate flagging "advice" as threats.*
      *   *Check:* Did I explain the "Punt"? *Yes, specifically on sarcasm and power dynamics.*
      *   *Check:* Is the distinction between "Act" and "Effect" clear? *Yes, emphasized in Step 4.*
      *   *Self-Correction on Case 1:* If the user says "it was a joke among friends," but it's a marketplace app, the "Institutional Context" overrides the "Friend Context." I need to make sure the procedure captures that *Platform Context* trumps *User Claim*.
      *   *Self-Correction on Theory:* Make sure to distinguish Searle vs. Austin on Uptake. Austin says no uptake = no act. Searle says intent = act. This is a huge pivot point for moderation. I will side with Austin/Institutional for safety (if the receiver felt threatened, it counts), but note the dispute.

  8.  **Final Polish:** Ensure the tone is authoritative but helpful. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, the prompt asks for *one* of the worked examples to reach a call the team would hate.
  *   *Case 1 (Promise/Joke):* Moderators might hate enforcing a "joke."
  *   *Case 3 (Implicit Threat):* Moderators might hate flagging "advice."
  *   *Decision:* Case 3 is stronger for "Threat" classification because "just a thought" is a classic mitigator that SAT strips away. I will make Case 3 the "Hated Call."
  *   *Wait, looking at Case 1:* If the procedure says "It's a promise" despite the "joke" claim, that's also hated. Let's make Case 1 the "Hated Call" regarding *enforceability*. Actually, Case 3 is more dangerous for Trust & Safety (missing a threat). Let's make Case 3 the "Threat" call, which moderators often miss. But the prompt says "a call my team would hate." Moderators hate false positives (flagging safe stuff). So Classifying Case 3 as a Threat is a False Positive risk. That fits.
  *   *Actually, let's look at Case 1 again.* "I promise... later says joke." If the procedure says "Valid Promise," moderators hate it because they feel they are punishing humor. If it says "Not a Promise," Safety hates it. Let's aim for the Procedure overruling the "Joke" defense. That creates friction.
  *   *Better yet:* Case 3. "Just a thought." Moderators see "thought." Procedure sees "Threat." That is a classic friction point. I will stick with Case 3 as the controversial one.

  *Refining the Theory Section:* Need to be specific. "Uptake" is the big one. If the receiver didn't see it, did it happen? Austin says No. Searle says Yes. For T&S, we usually care about impact, so Austin is safer, but Searle is easier to moderate (look at sender intent). I need to pick a lane for the procedure but acknowledge the other. I'll pick "Reasonable Receiver" (Austin-adjacent) because it protects the platform.

  *Let's finalize the Procedure Steps:*
  1.  **Context:** Is this a deal space?
  2.  **Commitment:** Is the speaker changing the future or describing it?
  3.  **Control:** Can they make it happen?
  4.  **Uptake/Reaction:** How did the receiver take it?
  5.  **Mitigation:** Do words like "just kidding" actually work here?

