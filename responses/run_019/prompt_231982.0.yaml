      *   *Option 5 (Verifiable Artifact):* Formal verification is robust against gaming *if* the translation to formal language is correct. However, models might learn to generate valid-looking formal proofs that don't match intuition or cheat the translator. Still, mathematical formalism is the gold standard for correctness. Grade: S.

