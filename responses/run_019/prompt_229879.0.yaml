answer: |-
  ### Preliminary Analysis: Underlying Principles

  Before adjudicating the specific moves, we must excavate the philosophical architecture supporting each speaker. Both rely on explicit claims, but their disagreement rests on deeper, often unstated commitments.

  **Elena's Underlying Principles:**
  1.  **The Surviving Interest Principle:** Persons possess interests (in reputation, narrative integrity, fidelity) that survive biological death.
  2.  **Narrative Identity:** A life is not merely a sum of events but a coherent story; altering the conclusion alters the meaning of the antecedent life.
  3.  **Deontological Restraint:** Certain duties (non-defamation, fidelity) are owed *to* the person, regardless of consequences to the living.
  4.  **The "Ghostly Wellbeing" Denial:** (Implicitly clarified in Move 7) One can be wronged without experiencing the wronging; harm is not identical to felt suffering.

  **Marcus's Underlying Principles:**
  1.  **The Existence Requirement:** (Epicurean) One cannot be harmed or wronged if one does not exist to experience the setback.
  2.  **Epistemic Communalism:** Memory is a public good; falsification degrades the shared epistemic environment necessary for the living to navigate reality.
  3.  **Contextual Severity:** The moral weight of a falsehood depends on the medium's claim to truth (e.g., biography vs. dramatization).
  4.  **Forward-Looking Consequentialism:** The value of truth-telling about the dead is instrumental to the moral and intellectual health of the future.

  **Strongest Restatements (Principle of Charity):**

  *   **Elena:** We owe the dead respect not because they feel pain, but because they were persons capable of commanding respect. To treat a human life as raw material for a satisfying narrative arc is to use that person as a mere means to an aesthetic end. If we deny that duties survive death, we undermine the coherence of antemortem commitments (wills, deathbed promises). The wrong is located in the *violation of standing*, not the *experience of harm*.
  *   **Marcus:** Attributing rights to the non-existent is metaphysical confusion that obscures the real stakes. The stakes are the living community's relationship with truth. When we falsify the past, we rob the living of accurate precedents and corrupt the practice of history. We must distinguish between a scholarly lie (which breaks the contract of inquiry) and an artistic license (which operates under different norms); Elena's view flattens this necessary distinction.

  ---

  ### Move-by-Move Adjudication

  **(1) Elena: The invented scene wrongs R. herself... Falsifying the ending is not merely inaccurate; it is a wronging of the person the story is about.**
  *   **Rating:** *Defensible but Metaphysically Contested.*
  *   **Justification:** Elena correctly identifies that narrative integrity matters to how we value a life. However, she asserts the conclusion ("wrongs R.") without yet defending the possibility of posthumous wrongs against the "no subject" objection. It is a strong intuition pump, but philosophically premature.

  **(2) Marcus: The dead are no longer subjects... Whatever is wrong with the scene must therefore be a wrong to the living...**
  *   **Rating:** *Metaphysically Standard, Ethically Reductionist.*
  *   **Justification:** Marcus is logically consistent with the "Existence Requirement," which is the dominant view in analytic metaphysics regarding harm. However, he moves too quickly from "cannot experience harm" to "cannot be wronged." He conflates *harm* (setback to interest) with *wrong* (violation of duty), a distinction Elena will later exploit.

  **(3) Elena: If the wrong were only to misled viewers, then a version clearly labeled as fiction... would be beyond criticism. But I would still object... The error is directed at R., not merely at the audience's beliefs.**
  *   **Rating:** *Strong.*
  *   **Justification:** This is a effective reductio of Marcus's initial position. It highlights that our moral discomfort persists even when the epistemic harm to the audience is neutralized by labels. It suggests the source of the wrong is relational (between creator and subject), not just informational (between creator and viewer).

  **(4) Marcus: The problem isn't only that this or that viewer is fooled; it's that the shared story the living tell about R. has been corrupted. A culture that retouches the past manufactures a false inheritance.**
  *   **Rating:** *Very Strong.*
  *   **Justification:** Marcus upgrades his argument from individual viewer confusion to structural epistemic harm. This avoids the "labeled fiction" trap in (3) by arguing that even fictionalized distortions contribute to a cultural atmosphere where truth is malleable. It grounds the wrong in social practice rather than metaphysical status.

  **(5) Elena: Imagine the invention were flattering... On your account, no one is wronged if the living welcome the story. But I don't think you believe that is fine—and if it isn't, the dead person's standing is doing work you refuse to name.**
  *   **Rating:** *Very Strong (The "Noble Lie" Test).*
  *   **Justification:** This is Elena's strongest move. It exposes a weakness in purely consequentialist accounts of memory. If the only wrong is to the living, and the living are comforted by a lie, Marcus should have no objection. Most people intuitively feel that sanitizing a cruel person's history is still a wrong, suggesting the duty is owed to the truth of the life, not just the utility of the memory.

  **(6) Marcus: We owe truthfulness about the dead because dishonest memory corrupts later inquiry and leaves vulnerable people's own stories shaped by false precedents. That's an epistemic and social duty to the living...**
  *   **Rating:** *Strong.*
  *   **Justification:** Marcus successfully parries the "Noble Lie" test by arguing that flattering lies *do* harm the living (by creating false precedents). However, he doubles down on the claim that the duty is *only* to the living. He accurately identifies Elena's risk: treating a life story as "property" the dead retain, which can lead to censoriousness.

  **(7) Elena: I am not postulating ghostly wellbeing. Person-directed duties—fidelity, recognition, non-defamation—do not simply expire with the heartbeat... The duties run to her, not only to the archive or to the audience.**
  *   **Rating:** *Clearly Right (Philosophically Precise).*
  *   **Justification:** This is the crucial philosophical pivot. Elena clarifies that "wronging" does not require "ghostly wellbeing." She shifts the framework from *harm-based* (consequentialist) to *duty-based* (deontological). This validates the intuition that we can violate someone's rights without them feeling pain (analogous to breaking a promise to someone who never finds out).

  **(8) Marcus: Then consider the difference in gravity between a scholarly biography that lies... and an openly fictionalized film. My account explains why the first is usually worse... On your account the central wrong—a wrong to R. herself—is the same in both cases...**
  *   **Rating:** *Strong (Contextual Nuance).*
  *   **Justification:** Marcus identifies a practical weakness in Elena's view. If the primary wrong is to R.'s narrative integrity, does it matter if the lie is in a textbook or a movie? Marcus's account better explains why we tolerate more fiction in art than in history. However, he may be overstating Elena's position; she could argue the *degree* of wrong varies by reach, even if the *type* of wrong remains constant.

  ---

  ### Overall Verdict

  **Specific Claims Elena is Right About:**
  1.  **The Insufficiency of Labels:** Merely labeling a distortion as "fiction" does not automatically absolve the creator of moral debt regarding real people (Move 3).
  2.  **The "Noble Lie" Intuition:** Flattering falsehoods are still morally problematic even if the living prefer them; this cannot be fully explained by harm to the living alone (Move 5).
  3.  **The Nature of Posthumous Duty:** One can owe duties to the dead (fidelity, non-defamation) without positing that the dead have "interests" in the sense of experiential wellbeing. The duty is a residue of the respect owed to them while alive (Move 7).

  **Specific Claims Marcus is Right About:**
  1.  **The Metaphysical Constraint:** The dead cannot experience harm or possess current preferences. Any talk of "their interest" must be metaphorical or derivative (Move 2).
  2.  **Social Epistemic Harm:** The primary tangible damage of historical falsification is to the living community's understanding of reality and moral precedents (Move 4 & 6).
  3.  **Contextual Severity:** The moral gravity of a falsehood depends heavily on the medium's implied contract with the audience (biography vs. biopic). Elena's focus on the subject risks flattening this distinction (Move 8).

  **Which Side is More Right Overall?**
  **Elena is more right on the fundamental moral question; Marcus is more right on the social application.**

  Elena wins the theoretical debate. Her distinction in Move 7 between *experiencing harm* and *being wronged* successfully neutralizes Marcus's metaphysical objection. We accept that we can wrong the dead (e.g., breaking a deathbed promise, desecrating a grave) without claiming they "feel" it. Marcus's attempt to reduce all such wrongs to harms to the living feels like a contortion to save a materialist metaphysics.

  However, Marcus wins the pragmatic debate. His framework better accounts for why we treat biopics differently than biographies. If Elena's view were absolute, all fictionalization might be equally suspect regardless of genre. Marcus correctly identifies that the *practice* of remembering is a social institution with variable norms.

  **What Both Are Missing (The Stalemate Breaker):**
  Both speakers ignore the most significant ethical stakeholder mentioned in your preamble: **the living daughter.**

  1.  **The Survivor's Harm:** The film invents a reconciliation that never happened. This does not just wrong R. or the "public record"; it actively gaslights the daughter. It appropriates her grief and rewrites her relational reality. A "redemptive shape" for the audience often comes at the cost of the surviving family's truth.
  2.  **The Contract of "Dramatization":** Neither fully analyzes the audience's consent. Viewers accept "dramatization" as a contract that *some* truth will be sacrificed for *narrative coherence*. The ethical breach occurs not when truth is sacrificed, but when the sacrifice fundamentally alters the *moral valence* of the subject (making an estranged mother loving) in a way that exploits the subject's vulnerability.
  3.  **The Function of Redemption:** Marcus mentions "redemptive shape" but dismisses it. Elena treats it as falsification. A deeper analysis would ask: Does the culture *need* redemptive arcs more than it needs accurate ones? Marcus says no (truth is paramount); Elena implies yes (truth about the person is paramount). But the missing piece is whether art has a license to offer *consolation* that history cannot.

  **Final Adjudication:**
  Elena provides the better account of *why* we feel unease (surviving duties of respect). Marcus provides the better account of *how* we should regulate that unease (distinguishing contexts of truth-telling). To resolve the stalemate, one must adopt Elena's deontological baseline (we owe the dead respect) but apply Marcus's contextual filter (the degree of obligation varies by medium), while adding a third constraint: **the rights of surviving kin to not have their relational history publicly falsified for aesthetic comfort.**
