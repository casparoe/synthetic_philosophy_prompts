  (v) Closest analog is **Case 3 (Sarcasm)**. Both involve asserting $P$ to convey $\neg P$. This choice presupposes that sarcasm is exempted due to mutual convention, whereas the interrogation case lacks a shared linguistic convention, remaining a psychological manipulation.

  (vi) A discriminating case: A **spy using a pre-arranged code** (asserting falsehoods mapped to truths). If she verdicts "Not a lie," she privileges convention (Conventionalism). If "Lie," she privileges mental state (Formalism).

  (vii) Her record **genuinely commits** her to the passage. Verdicts 2 and 5 separate the will to deceive from the definition of lying (true statements with deceptive intent are not lies). Verdict 1 separates the will to tell falsehood from justification (false statements are lies even if justified). The passage mirrors this: form defines species, effect defines perfection.

  (viii) I would change my prediction if she verdicts **"Not a lie"** based on the interrogator's true belief. My reconstruction fails if she treats the interrogator's known bias as a **linguistic convention** equivalent to sarcasm or acting, rather than a psychological quirk exploited by the speaker.
