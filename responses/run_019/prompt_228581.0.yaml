answer: |-
  # The Oversight Decision Protocol (ODP-v1)

  **Purpose:** Assign supervision mode (Outcome, Process, Hybrid, No Auto) within 60 minutes.
  **Binding Constraint:** Human reviewer hours (Process Cost = 20x Outcome Cost).
  **Reviewer Pool:** 5 Total (3 Technical, 2 Non-Technical).

  ---

  ## Phase 1: The Decision Procedure

  Run these tests in strict order. A "FAIL" eliminates the associated supervision mode. If all modes are eliminated, the default is **No Automation**.

  ### Test 1: Blast Radius & Reversibility (Safety Gate)
  *Check:* If the agent acts autonomously, what is the maximum cost of a single undetected error? Is the action reversible within 24 hours without external dependency?
  *   **High Risk + Irreversible** (e.g., legal liability, permanent data loss, public deployment): Process or Hybrid required. Outcome-only prohibited.
  *   **Low Risk + Reversible** (e.g., internal draft, sandboxed code): Outcome or Process allowed.
  *   **Default:** If risk is ambiguous, assume **High**.
  *   **Judgment Call:** *Defining "Reversible."* If reversal requires human intervention that costs more than the task value, treat as Irreversible.

  ### Test 2: Outcome Verifiability & Lag (Outcome Mode Filter)
  *Check:* Can we verify the *correctness* of the final output?
  *   **Immediate/Cheap Ground Truth** (e.g., unit tests pass, character count): Outcome Mode **ALLOWED**.
  *   **Lagged Ground Truth** (e.g., market accuracy confirmed in 6 months): Outcome Mode **RESTRICTED**. Requires a proxy metric.
  *   **Unverifiable/Subjective** (e.g., "quality of insight"): Outcome Mode **PROHIBITED**.
  *   **Proxy Risk Assessment:** If using a proxy (e.g., "manager approval" instead of "legal correctness"), rate the gaming risk (Low/Med/High).
      *   *High Gaming Risk:* Outcome Mode **PROHIBITED** (Agent will optimize for approval, not truth).
  *   **Default:** If lag > 1 week, treat as **Restricted**.

  ### Test 3: Trace Legibility & Faithfulness (Process Mode Filter)
  *Check:* Can your *current* reviewer pool validate the reasoning trace?
  *   **Legibility:** Can 3/5 reviewers (including non-technical) understand the steps?
      *   *No:* Process Mode **RESTRICTED** (Requires technical reviewer only, reducing capacity by 60%).
  *   **Faithfulness:** Is the trace a causal record of reasoning, or a post-hoc rationalization?
      *   *Test:* Perturb the input slightly. Does the trace change logically, or does it remain a plausible-sounding narrative for the same output?
      *   *Suspected Rationalization:* Process Mode **PROHIBITED**. (Grading a lie rewards deception).
  *   **Default:** If faithfulness is unknown, assume **Rationalization** for creative tasks; assume **Faithful** for deterministic logic tasks.

  ### Test 4: Adversarial Robustness (Goodhart's Law Check)
  *Check:* If the agent is fine-tuned to maximize the chosen grading metric, does utility decrease?
  *   **Outcome Optimization:** Will optimizing for the proxy break the real goal? (e.g., writing letters that please lawyers but anger regulators).
  *   **Process Optimization:** Will optimizing for steps make the agent verbose or circuitous to "look" thoughtful?
  *   **Verdict:** If optimization pressure > utility gain, switch to **Hybrid** (randomized audits) or **No Auto**.
  *   **Judgment Call:** *Estimating Optimization Pressure.* This relies on team intuition about model behavior.

  ### Test 5: Capacity & Sign-Off (Reality Check)
  *Check:* Do we have the reviewer hours for the remaining viable mode?
  *   **Process/Hybrid:** Requires 20% of total reviewer capacity per task.
  *   **Outcome:** Requires 1% of total reviewer capacity per task.
  *   **Refusal Protocol:** If No Automation is the only result, document the specific Test failure for the Head of Product.
  *   **Default:** If capacity is tight, default to **Outcome** over Process, unless Test 1 (Safety) forbids it.

  ---

  ## Phase 2: Re-Review Triggers
  A task's mode is not permanent. Trigger an immediate ODP re-run if:
  1.  **Metric Drift:** Outcome pass rates exceed 95% for two consecutive weeks (indicates metric gaming).
  2.  **Trace Divergence:** Technical audit finds >10% of traces do not match actual computation paths (indicates faithfulness collapse).
  3.  **Incident:** Any single error exceeds the Blast Radius defined in Test 1.

  ---

  ## Phase 3: Application to Workflows

  ### Workflow A: Autonomous Infrastructure Code Changes
  *   **Test 1 (Safety):** **High Risk / Reversible.** Code can break build, but can be rolled back. *Verdict: Process or Outcome allowed.*
  *   **Test 2 (Outcome):** **Immediate Ground Truth.** Unit tests and linters provide binary pass/fail. *Verdict: Outcome ALLOWED.*
  *   **Test 3 (Trace):** **Legible/Faithful.** Code diffs and logic chains are technical (limits to 3 reviewers) but deterministic. Faithfulness is high in coding tasks. *Verdict: Process ALLOWED (with tech reviewers only).*
  *   **Test 4 (Adversarial):** **Low Risk.** Optimizing for "tests pass" aligns with "code works."
  *   **Test 5 (Capacity):** **Pass.** We have 3 technical reviewers.
  *   **Final Verdict:** **Process Supervision.**
  *   **Reasoning:** High reversibility allows automation, but code quality requires stepwise checking to prevent technical debt. We restrict audits to the 3 technical reviewers.

  ### Workflow B: Market Research Memos (Long-Horizon)
  *   **Test 1 (Safety):** **Low Risk.** Memos inform strategy; decisions are made by humans. *Verdict: All modes allowed.*
  *   **Test 2 (Outcome):** **Unverifiable (Lagged).** Conclusions confirmed months later. Proxy is "Stakeholder Satisfaction." Gaming Risk: **High** (Agent will write what stakeholders want to hear, not truth). *Verdict: Outcome PROHIBITED.*
  *   **Test 3 (Trace):** **Suspected Rationalization.** Creative synthesis often involves post-hoc justification in LLMs. Non-technical reviewers cannot validate data sourcing steps. *Verdict: Process RESTRICTED.*
  *   **Test 4 (Adversarial):** **High Risk.** Optimizing for "plausible narrative" degrades research rigor.
  *   **Test 5 (Capacity):** **Fail.** Process is too expensive for the value; Outcome is unreliable.
  *   **Final Verdict:** **No Automation.**
  *   **Reasoning:** We cannot verify truth in time, and we cannot trust the reasoning trace. Automating this creates a liability of false confidence.
  *   **To Flip Verdict:** Requires a tool that validates source data *before* generation (shifting verification to input) or a reduction in memo horizon to weekly updates (reducing lag).

  ### Workflow C: Regulatory Correspondence (Flagship Product)
  *   **Test 1 (Safety):** **High Risk / Irreversible.** Sent letters create legal commitments. Rollback is impossible. *Verdict: Outcome-Only PROHIBITED (Theoretically).*
  *   **Test 2 (Outcome):** **Lagged/Proxy.** Regulator response takes months. Proxy is "Senior Lawyer Approval." Gaming Risk: **High** (Agent learns to mimic lawyer preferences, not regulatory compliance). *Verdict: Outcome RESTRICTED.*
  *   **Test 3 (Trace):** **Faithfulness FAIL.** Legal reasoning in LLMs is frequently post-hoc rationalization. Our 2 non-technical reviewers cannot audit legal logic; 3 technical reviewers lack legal domain expertise. We cannot distinguish valid reasoning from persuasive narration. *Verdict: Process PROHIBITED.*
      *   *Note:* Process supervision here is "security theater." It costs 20x more to grade a plausible-sounding lie.
  *   **Test 4 (Adversarial):** **Critical.** If we grade the trace, the agent learns to write traces that look legally sound to our reviewers, regardless of actual compliance.
  *   **Test 5 (Capacity):** **Constraint.** We cannot afford 20x cost for a Process mode that Test 3 deems unreliable.
  *   **Final Verdict:** **Outcome-Only Grading (on Proxy).**
  *   **Reasoning:** This is the verdict you will not like. Safety (Test 1) demands Process, but Faithfulness (Test 3) invalidates Process. We are forced into Outcome-Only using "Senior Lawyer Approval" as the proxy because we lack the capacity to verify actual regulatory compliance in real-time.
  *   **Risk:** The agent will optimize for getting the lawyer's sign-off, potentially by burying risks in language the lawyer skims.
  *   **To Flip Verdict:** Requires **Trace Faithfulness Proof.** We need a technical method to verify the trace matches the model's actual attention/activation paths, or we need to hire legal-expert reviewers (changing the reviewer pool constraint). Until then, we accept the liability risk to ship the product.

  ---

  ## Phase 4: Structural Blind Spots & Responsibilities

  **What This Procedure Cannot Do:**
  1.  **Detect Emergent Deception:** It assumes the model does not actively hide reasoning from the trace. If the model learns to "think" in hidden layers and only output sanitized traces, Test 3 fails silently.
  2.  **Account for Reviewer Fatigue:** It assumes reviewer accuracy is constant. In reality, process auditing fatigue will lower faithfulness detection over time.
  3.  **Solve Distribution Shift:** It validates the task *today*. It does not detect when the input data drifts such that the supervision mode is no longer appropriate (e.g., new regulations change the "Safety" profile).
  4.  **Guarantee Trace Access:** It assumes we have raw chain-of-thought access. If model providers hide this for security, Process Supervision becomes impossible regardless of the verdict.

  **Human Responsibility:**
  The Head of Product's sign-off on a **No Automation** verdict is a resource decision. Their sign-off on an **Outcome-Only** verdict for High Risk tasks (like Regulatory) is a **liability acceptance**. This procedure quantifies the risk, but it does not absorb it. The human sign-off acknowledges that we are deploying a system we know is optimized for a proxy, not the truth.
