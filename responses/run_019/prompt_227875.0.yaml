      *   Does *this* analogy support *this* form of skepticism? No.
      *   Is there a middle ground? Yes, "Critical Inquiry" vs. "Conspiracy Theory."
      *   *Verdict:* The analogy borrows the detective's social capital (the "credentials") while rejecting the detective's methodological constraints (the "discipline").

