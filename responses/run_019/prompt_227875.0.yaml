      *   **Core Claim:** Conspiracy theorists (CTs) are epistemically similar to detectives/journalists (skeptical of authority, look for patterns, history shows real conspiracies exist). Therefore, dismissing CTs is irrational deference to authority.
      *   **Professor's Stance:** Dismisses it as the "just asking questions" move but hasn't explained *why* it fails.
      *   **Task:** Audit the analogy.
          *   Lay out explicit correspondence mapping (suspicion, evidence, proof).
          *   Identify where the mapping breaks (response to missing evidence, corrective institutions).
          *   Separate relevant disanalogies from superficial ones.
          *   Evaluate if any epistemic respectability of suspicion survives.
          *   Determine if the analogy borrows credentials without discipline.

  2.  **Deconstruct the Analogy (The Mapping):**
