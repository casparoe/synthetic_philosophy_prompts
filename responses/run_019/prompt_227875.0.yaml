          *   Precedent: Real conspiracies happen (Watergate, etc.).
      *   *Intended Conclusion:* CTs are rational investigators; dismissing them is dogmatic.

  3.  **Identify the Breaks (The Disanalogies):**
      *   *Evidence Gathering:* DIJs seek falsifiable data, chain of custody, corroboration. CTs often rely on ambiguity, lack of evidence as evidence ("cover-up"), and circular reasoning.
      *   *Response to Negative Evidence:* DIJ: Hypothesis rejected or modified significantly. CT: Hypothesis protected (ad hoc hypotheses, "they planted that").
      *   *Standards of Proof:* DIJ: Beyond reasonable doubt / Publishable standard (editors, editors, legal system). CT: Internal coherence / "Awakening" / Community validation only.
      *   *Institutional Correction:* DIJ: Editors, police oversight, courts, peer review. CT: Echo chambers, unfalsifiable core beliefs.
      *   *Scope:* DIJ: Specific crime/event. CT: Often totalizing (everything is connected).

  4.  **Evaluate Epistemic Relevance:**
