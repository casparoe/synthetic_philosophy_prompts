answer: |-
  # Seminar Decision Tree: The Identity of the Letter 'a'

  **Instructions for the Facilitator:**
  Present the following questions sequentially to the respondent. Do not reveal the names of the philosophical positions. Record the path taken to reach the final leaf. The questions rely on imagined glyph cases; encourage the respondent to visualise the forms clearly before answering.

  ### Node 1: The Question of Degree
  **Probe:** Visualise a standard double-storey printed 'a'. Now, imagine a handwritten 'a' where the bowl is open at the top, just slightly, like a hook rather than a loop.
  **Question:** Is this open-bowl mark simply *not* an 'a', or is it an 'a' to a lesser degree than the printed one?
  *   **If the respondent says it is an 'a' to a lesser degree (membership admits of degree):** Proceed to **Node 2**.
  *   **If the respondent says it is either an 'a' or not (membership is all-or-nothing):** Proceed to **Node 3**.

  ### Node 2: The Source of Comparison
  **Probe:** Consider the single-storey handwritten 'a' alongside the double-storey printed 'a' mentioned previously.
  **Question:** When you judge how well the handwritten form fits the category, do you compare it against one single, idealised summary image of an 'a' stored in your mind, or do you compare it against a cloud of many particular 'a's you remember encountering?
  *   **If they cite a single summary representation:** Classify as **Prototype Theory**.
  *   **If they cite a set of remembered instances:** Classify as **Exemplar Theory**.

  ### Node 3: Structural Sufficiency
  **Probe:** Visualise an 'a' rendered only as a dotted or outlined silhouette, and contrast this with a heavily flourished blackletter 'a' where the core shape is obscured by ornament. Now consider a simplified mark shaped like an 'o' with a short right-hand stem attached.
  **Question:** If the dotted silhouette preserves the topological skeleton of the letter, is it fully an 'a' based on that geometry alone, even if the blackletter or the 'o'-shape are rejected?
  *   **If they say geometry/topology is sufficient for full membership:** Classify as **Skeletal Structuralism**.
  *   **If they say geometry is not sufficient (something else is needed):** Proceed to **Node 4**.

  ### Node 4: The Role of Function
  **Probe:** Imagine a deliberately novel mark that a small community resolves to use, and thereafter unhesitatingly reads, as the letter 'a'. However, suppose this mark is difficult to distinguish from other letters and frequently causes reading errors in their practice.
  **Question:** Given that it fails to perform the reading role smoothly, is it still an 'a' simply because the community treats it as one, or must it successfully play the proper functional role to count?
  *   **If they say it must successfully play the proper functional role:** Classify as **Functional Contextualism**.
  *   **If they say community treatment/stipulation is sufficient despite functional failure:** Proceed to **Node 5**.

  ### Node 5: Intention versus Sorting
  **Probe:** Consider the same novel mark from the previous question, but suppose it appeared by accident (a spill of ink, a glitch) with no maker's intention, yet the community adopted it into their norms and sorts it as an 'a'.
  **Question:** Can this accidental mark truly be an 'a' based on sorting practice alone, or does it require a maker's intention together with community norms to constitute the letter?
  *   **If they say sorting practice alone is sufficient (no maker needed):** Classify as **Deflationism**.
  *   **If they say maker's intention and norms are required:** Classify as **Normative Artefactualism**.

  ***

  ## The Six Positions and Their Awkward Commitments

  **1. Skeletal Structuralism**
  *   **Definition:** A glyph is an 'a' just in case it instantiates the right part–whole skeleton, with only those alterations that preserve the topology and relations of the letter.
  *   **Awkward Commitment:** This position struggles to account for historical glyphs that are universally read as 'a' despite violating the proposed topological invariants.

  **2. Prototype Theory**
  *   **Definition:** Membership is graded by similarity to a single stored summary representation of the category.
  *   **Awkward Commitment:** It cannot easily explain how readers instantly recognise novel typefaces that bear little resemblance to the stored average prototype.

  **3. Exemplar Theory**
  *   **Definition:** The category standard is a cloud of remembered particular 'a's and membership is graded by similarity to those stored instances.
  *   **Awkward Commitment:** This view requires an implausibly vast memory capacity to store the sheer number of instances required for robust categorisation.

  **4. Functional Contextualism**
  *   **Definition:** A glyph is an 'a' when it plays the proper role in a community's writing and reading practice.
  *   **Awkward Commitment:** It risks conflating the letter itself with any substitute that happens to function in the same slot, potentially erasing the identity of the glyph.

  **5. Normative Artefactualism**
  *   **Definition:** Membership rests on the maker's intentions together with the norms of a typographic community, so that not just any functional substitute suffices.
  *   **Awkward Commitment:** This position cannot categorise anonymous historical glyphs where the maker's intention is irretrievably lost.

  **6. Deflationism**
  *   **Definition:** The sameness across tokens is projected by our sorting practice and there is no further robust essence to capture.
  *   **Awkward Commitment:** It struggles to explain why some sorting practices feel objectively mistaken or erroneous rather than merely different.

  ***

  ## Logical Space

  This section diagnoses combinations of branch answers that no actual position in the tree occupies.

  **1. Graded Structuralism (Yes to Degree + Yes to Structure)**
  *   **Diagnosis:** *Incoherent.* Structuralism relies on the presence or absence of invariant topological features. A skeleton is either intact or broken; there is no logical space for a topology to be "partially" instantiated in a way that generates graded membership without collapsing into similarity-based theories.

  **2. Graded Artefactualism (Yes to Degree + Yes to Intention)**
  *   **Diagnosis:** *Unexplored.* While one might argue an intention can be partially fulfilled, the normative status of an artefact is typically binary in philosophical discourse (it is either the intended kind or it is a mistake). No major theory occupies this space as it complicates the normativity essential to artefactualism.

  **3. Functional Structuralism (No to Degree + No to Structure + Yes to Function + Yes to Structure)**
  *   **Diagnosis:** *Redundant.* If structural properties are sufficient (Node 3), the functional role (Node 4) becomes irrelevant. A position claiming both are independently sufficient conditions without priority is unstable, as the structural condition would already secure membership.

  **4. Intentional Gradedness (Yes to Degree + No to Structure + No to Function + Yes to Intention)**
  *   **Diagnosis:** *Unattractive.* This would imply that a glyph is "more or less" an 'a' based on how strongly the maker intended it, regardless of its shape or use. This divorces the category from both perception and practice, leaving no public criterion for verification.

  ***

  ## Separation Limits

  This section flags pairs of leaves the tree cannot genuinely separate with the available probes and identifies what would be needed to distinguish them.

  **1. Prototype Theory vs. Exemplar Theory**
  *   **Limitation:** The tree relies on introspective reports regarding memory (Node 2). However, cognitively, a "summary representation" and a "cloud of instances" can produce identical behavioural outputs in a seminar setting.
  *   **Required Consideration:** To separate these genuinely, one would need reaction-time experiments testing typicality effects. Exemplar theory predicts specific interference from recent instances, whereas prototype theory predicts stability based on the long-term average, a distinction unavailable through verbal questioning alone.

  **2. Functional Contextualism vs. Deflationism**
  *   **Limitation:** Both positions often yield the same verdicts on concrete cases (Node 4 and 5). A functionalist says the role makes it an 'a'; a deflationist says our treating it as playing the role makes it an 'a'. In practice, "playing the role" and "being treated as playing the role" are indistinguishable to an observer.
  *   **Required Consideration:** Separation requires a meta-ontological probe rather than a case judgment. One must ask whether the success of the reading practice is a *discovery* about the mark (Functionalism) or a *projection* onto the mark (Deflationism). Without asking directly about the nature of the "fact of the matter," the tree sorts them by their tolerance for functional failure, which is a proxy measure at best.

  **3. Normative Artefactualism vs. Deflationism**
  *   **Limitation:** Node 5 attempts to separate these via the "accidental mark" probe. However, a sophisticated deflationist might argue that community adoption *creates* the norm, effectively mimicking the artefactualist requirement for norms without the maker.
  *   **Required Consideration:** A clearer separation would require a case where community norms and sorting practices diverge. If a community sorts a mark as 'a' but their explicit norms forbid it, the Artefactualist must deny it is an 'a' (norms win), while the Deflationist might accept it (sorting wins). The current tree assumes norms and sorting align.
