prompt: |-
  Two colleagues of mine have been arguing for months and I want you to draft the document their dispute should have produced. One is a committed longtermist of a broadly utilitarian bent: she holds that the astronomical number of possible future persons means that actions affecting the far future — extinction-risk reduction, shaping the values of advanced AI, and so on — dominate the moral calculus, and she accepts the "fanatical" conclusion that even tiny probabilities of affecting vast stakes ought to swamp near-term considerations. The other thinks that taking the simulation hypothesis seriously undermines exactly this fanaticism. His argument, roughly, is this: if there is a substantial probability that we are simulated, then our estimates of the number of reachable future minds, of the physical resources available to be turned into value, and of the causal levers available to us are all hostage to the simulators' purposes and compute budget; the expected-value calculation that licenses fanaticism therefore rests on treating one cosmological scenario (base reality, bountiful and manipulable) as near-certain when our own reasoning gives us reason to doubt it. She replies that the simulation hypothesis cuts both ways — a simulation large enough to contain us might contain an astronomical future too, simulators might reward or be indifferent to our longtermist efforts, and in any case "maybe none of it is real" is not an argument one can selectively deploy against far-future stakes while continuing to care about the simulated people in front of one.

  Draft the joint statement of an adversarial collaboration between them. Specifically, I want:

  1. A numbered section of agreed claims: what both accept about the simulation argument itself (what it establishes and what it does not), about expected-value reasoning under moral and empirical uncertainty, about the structure of the fanaticism worry, and about which considerations are common ground rather than contested.
  2. A disagreements table giving the precise points of divergence, each row phrased so that each side would accept the wording of its own position. I suspect genuine cruxes include: whether simulation uncertainty is symmetrical (does it shrink expected far-future value, or merely redistribute it?), whether the longtermist's probability assignments over cosmological scenarios are doing illegitimate work, and whether discounting for "being simulated" is principled or is motivated reasoning against an unwelcome conclusion. But do not take my guesses as definitive — identify the cruxes yourself.
  3. For each crux, what each party would accept as bearing on it — an argument, a thought experiment, or a formal result about decision-making under this kind of uncertainty — together with each side's prediction about how it would resolve.
  4. A closing note on which parts of their dispute, if any, you conclude are verbal rather than substantive, and why.

  Keep the statement neutral: neither side should come off as the winner, and formulations should be ones both could sign. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement of an adversarial collaboration between two colleagues.
      *   **Characters:**
          *   Colleague A (Longtermist/Utilitarian): Believes far-future stakes dominate moral calculus due to astronomical numbers of potential future persons. Accepts "fanaticism" (tiny probabilities $\times$ huge stakes $>$ near-term certainties).
          *   Colleague B (Simulation Skeptic): Believes the Simulation Hypothesis (SH) undermines longtermist fanaticism by making estimates of future resources/minds hostage to simulators' budget/intent.
      *   **Conflict:** A thinks SH cuts both ways (simulated future could still be huge, or simulators might reward longtermism). B thinks SH introduces specific uncertainty that deflates the specific expected value calculations longtermism relies on.
      *   **Requirements:**
          1.  Numbered section of agreed claims (SH, EV reasoning, fanaticism structure, common ground).
          2.  Disagreements table (precise points of divergence, neutral wording).
          3.  Resolution paths (what would bear on each crux, each side's prediction).
          4.  Closing note on verbal vs. substantive disputes.
      *   **Tone:** Neutral, British English, signable by both.

  2.  **Deconstruct the Arguments:**
      *   *Longtermist (A):* Total Utilitarianism. $EV = P \times V$. $V_{future}$ is huge. Even if $P$ is small, $EV$ dominates. SH doesn't necessarily reduce $V_{future}$ (simulators could simulate a huge future) or $P$ (simulators might care about our actions). Also, consistency argument: if you discount simulated lives, you discount current lives too.
      *   *Simulation Skeptic (B):* SH implies epistemic humility regarding physical constants and resource availability. If we are simulated, the "astronomical future" is a variable controlled by the base reality. The probability distribution over $V_{future}$ should be wider and heavier on lower values than standard physicalism suggests. The longtermist calculation assumes a specific cosmological model (base reality, expansionist) with too much confidence.
      *   *The Crux:* Is the uncertainty introduced by SH symmetric (could be bigger, could be smaller) or asymmetric (likely smaller/controlled)? Is the longtermist's probability assignment robust to indexical uncertainty? Is dismissing SH motivated reasoning?

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find common ground. Both likely accept Bayesian reasoning. Both accept the Simulation Argument has some force (Bostrom's trilemma). Both accept the structure of Expected Value (EV) theory, even if they apply it differently. Both care about welfare (even if simulated).
      *   *Drafting points:*
          1.  Validity of EV reasoning under uncertainty.
          2.  The Simulation Hypothesis is non-negligible probability.
          3.  "Fanaticism" is a structural feature of unbounded EV, not unique to longtermism.
          4.  Simulated welfare counts morally (to avoid solipsism).
          5.  Empirical estimates of future capacity are uncertain.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to phrase rows so each side recognizes their view.
      *   *Crux 1: Impact of SH on EV distribution.* A: Symmetric/Neutral. B: Asymmetric/Deflationary.
      *   *Crux 2: Probability Assignments.* A: Robust priors based on physicalism. B: Priors should be penalized for indexical uncertainty.
      *   *Crux 3: Consistency of Moral Status.* A: Discounting simulation is arbitrary. B: Distinguishing causal leverage in simulation vs. base is relevant.
      *   *Crux 4: Motivated Reasoning.* A: B is using SH to escape uncomfortable moral demands. B: A is ignoring SH to preserve moral mission.

  5.  **Drafting - Section 3: Resolution Paths:**
      *   What would change their minds?
      *   *For Crux 1 (Distribution):* Formal modelling of simulator compute budgets. A predicts this shows wide variance. B predicts this shows hard caps.
      *   *For Crux 2 (Priors):* Decision theory under indexical uncertainty (e.g., SSA vs. SIA). A predicts SIA favours large worlds. B predicts SSA/indifference favours caution.
      *   *For Crux 3 (Leverage):* Analysis of "simulator goals". A predicts alignment is possible. B predicts opacity is likely.

  6.  **Drafting - Section 4: Verbal vs. Substantive:**
      *   Is this just about definitions? No, it's about probability distributions and causal models. However, there might be verbal confusion around "real" vs. "simulated" value.
      *   Conclusion: Mostly substantive (empirical/probabilistic), some verbal (moral status).

  7.  **Refining and Polishing (British English & Tone):**
      *   Use "colour", "modelling", "programme".
      *   Ensure neutrality. Avoid "Colleague A is right". Use "The Longtermist Position" and "The Simulation Skeptic Position".
      *   Check that the "Fanaticism" term is used descriptively, not pejoratively (as per the prompt's context).
      *   Ensure the "Disagreements Table" is formatted clearly.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Simulation Skeptic's argument clear?
      *   *Fix:* Ensure it's not just "nothing is real" but specifically about *resource constraints* and *causal leverage* within a simulation.
      *   *Critique:* Is the Longtermist's rebuttal fair?
      *   *Fix:* Emphasize that a simulation *could* be vast and that moral weight shouldn't depend on substrate.
      *   *Critique:* Are the agreed claims actually agreeable?
      *   *Fix:* Make sure they don't smuggle in conclusions. E.g., instead of "SH reduces EV", say "SH introduces uncertainty regarding EV".
      *   *Check:* Did I include the "motivated reasoning" aspect? Yes, put it in the disagreements.

  9.  **Final Polish:** Check against the four specific requirements in the prompt.
      1.  Numbered agreed claims? Yes.
      2.  Disagreements table? Yes.
      3.  Resolution paths/predictions? Yes.
      4.  Closing note on verbal/substantive? Yes.
      5.  British English? Yes.
      6.  Neutral tone? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Intersection of Longtermist Expected Value and the Simulation Hypothesis
  **Date:** 24 May 2024
  **Parties:** The Longtermist Principal (LP) and The Simulation Skeptic (SS)

  ### 1. Agreed Claims

  The undersigned parties affirm the following propositions as common ground. These claims establish the framework within which our disagreement operates and distinguish shared premises from contested conclusions.

  1.  **The Validity of Expected Value Reasoning:** Both parties accept that decision-making under moral and empirical uncertainty should, in principle, follow the axioms of expected utility theory. We agree that the "fanaticism" problem (whereby tiny probabilities of vast stakes dominate the moral calculus) is a structural feature of unbounded utility functions, not an error unique to longtermism.
  2.  **The Non-Negligibility of the Simulation Hypothesis (SH):** Both parties accept that the Simulation Hypothesis—that our reality is a computational construct run by a post-human or alien civilisation—cannot be assigned a probability of zero. We agree that standard cosmological and physical estimates must be conditional on whether we inhabit base reality or a simulation.
  3.  **Moral Status of Simulated Entities:** Both parties reject the notion that simulated experiences are morally inert. If a being is conscious and capable of suffering or flourishing, its moral status does not vanish simply because its substrate is computational rather than "base" physical matter. To argue otherwise would be a form of unjustified substrate chauvinism.
  4.  **Uncertainty Regarding Causal Leverage:** We agree that if we are in a simulation, our causal leverage over the far future is contingent upon the rules, compute budget, and intentions of the simulators. We disagree on the *expected* magnitude of this leverage, but agree that it is an additional variable absent from standard physicalist models.
  5.  **The Structure of the Dispute:** We agree that this dispute is not about whether to care about the future, but about the correct probability distribution over the *size* and *accessibility* of that future. The core question is whether SH introduces a symmetric uncertainty (the future could be larger or smaller than physicalism suggests) or an asymmetric deflation (the future is likely smaller or more constrained than physicalism suggests).

  ### 2. Disagreements Table

  The following table outlines the precise points of divergence. The wording in each cell is drafted to be acceptable to the party holding that position, without conceding the opposing view.

  | Crux | The Longtermist Principal (LP) Position | The Simulation Skeptic (SS) Position |
  | :--- | :--- | :--- |
  | **1. Distributional Impact of SH** | The Simulation Hypothesis introduces uncertainty that is roughly symmetrical regarding total value. A simulation capable of hosting us could plausibly host an astronomical future, or the simulators might reward longtermist-aligned behaviour with extended runtime. | The Simulation Hypothesis introduces an asymmetric deflationary pressure. Simulations are likely resource-constrained subsets of base reality; therefore, the upper bound on reachable value in a simulation is strictly lower than in base reality. |
  | **2. Probability Assignments** | Assigning significant probability mass to SH does not warrant discarding standard physicalist estimates of cosmic endowment. Without specific evidence of simulation constraints, we should retain priors based on the observable physics available to us. | Assigning significant probability mass to SH requires penalising priors that assume unconstrained physical expansion. To treat base-reality resource estimates as the default is to commit the error of assuming our local physics applies to the hosting reality. |
  | **3. Causal Leverage & Opacity** | The intentions of simulators are unknown but potentially aligned with ours. There is a non-trivial chance simulators are interested in fidelity, meaning our efforts to secure a long future might be mirrored or rewarded in the base reality. | The intentions of simulators are opaque and likely orthogonal to ours. Relying on simulator benevolence or indifference is epistemically reckless compared to the robust physical possibility of space colonisation in base reality. |
  | **4. Consistency & Motivation** | Selectively invoking SH to reduce far-future stakes while accepting near-term moral duties is inconsistent. If SH undermines the far future, it undermines the present equally; one cannot use it solely to escape "fanatical" demands. | Invoking SH to adjust probability distributions over cosmic scales is not motivated reasoning but epistemic hygiene. It is consistent to care about simulated present persons while acknowledging their causal capacity to affect the *far* future is structurally limited. |

  ### 3. Paths to Resolution

  For each crux identified above, we specify the type of evidence or formal result that would bear on the issue, alongside each party's prediction regarding the outcome.

  **Crux 1: Distributional Impact (Symmetry vs. Deflation)**
  *   **Bearing Evidence:** A formal model of computational resource allocation in hierarchical simulations (e.g., a "compute budget" theorem). This would estimate the ratio of compute required for a "ancestor simulation" versus the compute available in the base reality.
  *   **LP Prediction:** Such models will show that compute is cheap in advanced civilisations, allowing simulations to run for subjective eons, preserving the astronomical value stake.
  *   **SS Prediction:** Such models will demonstrate that high-fidelity simulations of conscious agents are exponentially costly, imposing a hard cap on the duration and complexity of the simulated future relative to base reality.

  **Crux 2: Probability Assignments (Priors under Indexical Uncertainty)**
  *   **Bearing Evidence:** A consensus decision-theoretic framework for handling indexical uncertainty (e.g., resolving the tension between the Self-Sampling Assumption and the Self-Indication Assumption in this context).
  *   **LP Prediction:** A correct application of the Self-Indication Assumption (SIA) favours hypotheses with more observers, which correlates with larger worlds/simulations, thereby sustaining the high-value estimates.
  *   **SS Prediction:** A correct application of epistemic humility regarding indexical location suggests we should not assume we are in the "high-compute" tail of the distribution; a median prior suggests tighter constraints.

  **Crux 3: Causal Leverage (Simulator Intentions)**
  *   **Bearing Evidence:** Game-theoretic analysis of "simulation termination conditions." This would analyse the incentives a post-human civilisation would have to terminate simulations that attempt to manipulate their own boundary conditions (e.g., attempts to "break out" or maximise compute usage).
  *   **LP Prediction:** Simulators interested in historical fidelity or ethical experimentation would allow long-term projects to proceed to their natural conclusion to observe the results.
  *   **SS Prediction:** Simulators would view attempts to maximise long-term value as noise or resource hijacking, increasing the probability of intervention or termination when such "fanatical" projects gain traction.

  **Crux 4: Consistency (Motivated Reasoning)**
  *   **Bearing Evidence:** A comparative analysis of moral weight assigned to near-term vs. far-term interventions under SH. Specifically, does SH reduce the EV of saving a life today by the same factor it reduces the EV of preventing extinction?
  *   **LP Prediction:** The discount factor applies equally. If SS accepts near-term duties, they must implicitly assume the simulation is stable enough for near-term causality, which contradicts the instability required to deflate the far future.
  *   **SS Prediction:** The discount factor is time-dependent. Near-term causality is verified by local regularity; far-term causality relies on extrapolating those regularities across a potential "shut-off" event. The uncertainty grows with time, justifying a divergence in discounting.

  ### 4. Closing Note: Verbal vs. Substantive Dispute

  In concluding this statement, we reflect on whether our disagreement is merely verbal or fundamentally substantive.

  We conclude that the dispute is **predominantly substantive**, specifically regarding empirical and probabilistic modelling. The disagreement does not rest on the definition of "value" or "consciousness" (which we have agreed upon in Section 1, Claim 3), but on the *architecture of the reality* in which that value is to be realised.
  *   **Substantive Core:** The LP and SS hold genuinely different models of the probability distribution over future causal capacity. The LP models the future as physically continuous; the SS models it as computationally contingent. This is a factual disagreement about the nature of our universe, not a semantic one.
  *   **Verbal Component:** There is a minor verbal element regarding the term "real." When the SS suggests the future is "less real" under SH, the LP hears a moral claim (which we reject). However, the SS clarifies they mean "causally constrained." Once this distinction is made explicit, the verbal confusion dissolves, leaving the substantive probabilistic disagreement exposed.

  We acknowledge that until the empirical cruxes in Section 3 are addressed, our collaboration remains an agreement to disagree on the magnitude of the stakes, rather than the nature of the morality involved.

  ***

  **Signed,**

  _________________________
  **The Longtermist Principal**

  _________________________
  **The Simulation Skeptic**
