          *   *Crux 2: Listener Agency.* Does the listener doing the "work" of inferring reduce the deceiver's culpability?
          *   *Crux 3: Kind vs. Degree.* Is it a different *type* of wrong or just a *lighter* version of the same wrong?

      *   **Section 4: Tests and Predictions:**
          *   Need specific scenarios where their theories predict different intuitive judgments or moral weights.
          *   *Case 1: The Blatant Lie vs. Subtle Mislead.* (User raised this). If lying is about authority, a believed lie is worse. If it's about outcome, a successful mislead might be worse.
          *   *Case 2: The Murderer at the Door.* (Kant's classic). Does the "truthful mislead" absolve more responsibility than the lie?
          *   *Case 3: The Car Sale.* (Economic harm). Does the method change the restitution required?
          *   *Predictions:* Need to write what each side expects the intuition to be.

      *   **Refining the Terminology Issue:**
