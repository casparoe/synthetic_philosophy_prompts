      *   *Correction:* Ensure the "Cruxes" section actually lists *questions*, not just topics.
      *   *Correction:* Make sure the "Tests" include specific predictions. E.g., "Maya predicts intuition X, User predicts intuition Y."

  5.  **Final Output Generation:** (Proceeding to generate the document based on these thoughts.)
