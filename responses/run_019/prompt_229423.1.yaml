      *   *Check Formatting:* Numbered sections, table format for disagreements.
      *   *Check Positions:* Ensure Maya's view isn't strawmanned (she's not saying deception is good, just that the *method* doesn't change the *moral valence* much) and User's view isn't exaggerated (they admit misleading is bad, just distinct).

  4.  **Final Polish (Self-Correction during drafting):**
