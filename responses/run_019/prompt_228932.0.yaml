      *   *Key Distinction:* Distinguish between *ontological incommensurability* (the thing doesn't exist) and *epistemic friction* (measuring is hard). The friend argues the former; the user needs to defend the latter.
      *   *The "Disease" Analogy:* Use the user's own example. Tuberculosis was "consumption" (moral/constitutional) vs. bacterial infection. We still say TB rates dropped. Why? Because the *bacillus* is the anchor, not the *concept*. For violence, the anchor is *bodily integrity*.

