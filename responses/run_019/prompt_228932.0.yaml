          *   *Weakness:* It sets an impossibly high bar for "sameness." In science, we compare things that are *functionally* equivalent even if conceptually distinct (e.g., "fever" in 1800 vs. "infection" today).
          *   *Cost of Rejection:* You have to admit that "rough comparison" is possible even without perfect conceptual identity. You move from "identity" to "analogy" or "functional equivalence."

      *   **Premise (2):** *What is counted as violence is not stable across history.* (User wants to keep this).
          *   *Status:* Historically accurate. Dueling was honorable; now it's assault.

      *   **Premise (3):** *Therefore any long-run statistics on violence pair numbers generated under our present classification with numbers generated under past classifications.*
          *   *Status:* Logically follows from (2). If we use modern data (coded by modern standards) and historical data (coded by old standards or interpreted by us), there's a mismatch.

      *   **Premise (4):** *Quantities produced under different classificatory schemes are incommensurable. No amount of statistical care can repair a mismatch in what is being measured in the first place.*
          *   *Strength:* Strong philosophical claim about incommensurability (Kuhn/Foucault vibes).
          *   *Weakness:* This is the weakest link scientifically. We do this all the time. GDP, life expectancy, literacy—all involve changing definitions. We use "bridging concepts."
