      *   *Alternative:* Nuance Premise (1). It's not that the *same thing* must be counted, but that a *comparable harm* must be tracked.

      *   *Decision:* The strongest philosophical leverage is on **Premise (4)**, with a significant adjustment to **Premise (1)** to make it compatible. The friend's argument relies on a rigid "conceptual essentialism" (if the concept changes, the thing doesn't exist). A "functional realist" approach defeats this.

