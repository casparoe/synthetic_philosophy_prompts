answer: |-
  Your friend has constructed a sophisticated version of a philosophical position known as **conceptual incommensurability**. It draws heavily from the work of thinkers like Michel Foucault (on how power defines knowledge) and Ian Hacking (on "making up people"). It is not a silly argument; it is the standard skeptical counter to quantitative history (like Steven Pinker's *The Better Angels of Our Nature*).

  However, your intuition is correct: if this argument holds, it dissolves not just violence, but epidemiology, economics, and climate science. It leads to a solipsism where no trend across time can be spoken of.

  To escape without surrendering historical nuance, you should **reject Premise (4)**, while simultaneously **softening Premise (1)**.

  Here is the breakdown of why, what it costs you, and how it preserves Premise (2).

  ### The Cut: Reject Premise (4)

  **Premise (4):** *Quantities produced under different classificatory schemes are incommensurable. No amount of statistical care can repair a mismatch in what is being measured in the first place.*

  This is the linchpin. Your friend asserts that because the *label* and the *moral justification* change, the *underlying phenomenon* cannot be tracked. This conflates the **map** (the classification) with the **territory** (the physical and social reality).

  **Why reject it?**
  In almost all sciences, definitions shift without rendering past data useless.
  *   **Disease:** In 1800, "fever" was a humoral imbalance; today it is an immune response. The *theory* changed completely. Yet, we can confidently say mortality from infectious disease has dropped. Why? Because we anchor the measurement not in the *theory of the disease*, but in the *physical symptoms and outcomes* (death, temperature, pathogen presence).
  *   **Poverty:** The "poverty line" is arbitrary and shifts. But "caloric intake" or "access to shelter" provides a stable anchor beneath the shifting policy definition.

  **The Alternative:**
  You must adopt a view of **Functional Realism**. This holds that while *concepts* are socially constructed, they often cluster around a **stable core of material reality**.
  *   For violence, that core is **intentional bodily harm or death**.
  *   Whether that harm is called "honor" (dueling), "justice" (execution), or "violence" (assault) is a change in *moral valence*, not necessarily a change in the *physical event*.

  By rejecting (4), you assert that we can construct "bridging concepts" that translate past categories into present ones without total loss of meaning. We are not measuring "Violence-as-defined-in-2024" vs. "Violence-as-defined-in-1724." We are measuring "Incidents of Intentional Physical Harm," using the available records from both eras, acknowledging the noise.

  ### The Adjustment: Soften Premise (1)

  **Premise (1):** *Comparing the level of violence in two eras is meaningful only if the same thing is counted as violence in both.*

  This sets an impossibly high bar: **Strict Identity**. It demands that the *concept* be identical. You should replace this with **Functional Equivalence**.

  **The Revision:**
  Comparison is meaningful if we can identify a **common denominator of harm** that persists across the classificatory shift.
  *   We do not need to count "exactly the same things."
  *   We need to count "things that serve the same function in a theory of harm."

  If you keep Premise (1) as written, you concede the argument immediately. If you modify it to require *comparability* rather than *identity*, the argument collapses.

  ### The Cost: What Picture of Measurement Are You Committing To?

  You asked what it costs to reject (4) and modify (1). It is not free. By taking this exit, you commit yourself to three specific philosophical positions:

  **1. Pragmatic Realism (vs. Strong Constructivism)**
  You are committing to the view that there is a mind-independent reality (bodies breaking, people dying) that anchors our definitions. You are asserting that "violence" is not *only* a label we paste on the world, but a response to something real in the world.
  *   *The Cost:* You must admit that our current definition is not "God's eye truth." It is simply a *more useful tool* for tracking harm across time. You are privileging the modern category not because it is metaphysically superior, but because it is analytically more robust for global comparison.

  **2. The Etic/Emic Distinction**
  You mentioned wanting to keep the thought that "what contemporaries took their own practices to be matters." You can keep this, but you must relegate it to a different domain.
  *   **Emic (Insider view):** We acknowledge that the 18th-century duelist saw himself as upholding honor, not committing violence. This explains *why* the act happened.
  *   **Etic (Outsider view):** We, as modern analysts, categorize the duel as violence to track the rate of lethal conflict. This explains *what* happened in a comparative framework.
  *   *The Cost:* You must accept a degree of **presentism**. You are imposing our moral framework on the past to generate the statistic. You are effectively saying, "Regardless of what they thought they were doing, they were killing each other, and we count that as bad." This can feel like a slight injustice to historical actors, but it is necessary for the trend line.

  **3. Measurement as Approximation, Not Precision**
  If you reject (4), you cannot claim the statistics are precise. You must treat historical violence data like climate data from the 19th century: sparse, proxy-based, and error-prone.
  *   *The Cost:* You lose the ability to say "Violence has declined by 50%." You can only say "The weight of evidence suggests a substantial decline." You move from **arithmetical certainty** to **inference to the best explanation**. Your friend demands a proof; you are offering a robust estimate.

  ### How This Saves "Disease" and "Poverty"

  Your friend's *reductio ad absurdum* (that disease and poverty also cannot be measured) actually becomes your strongest weapon once you reject (4).

  *   **Disease:** We reject the idea that "consumption" (1800) and "tuberculosis" (2000) are incommensurable. We link them via the *bacillus* and the *symptom*.
  *   **Violence:** We reject the idea that "dueling" (1800) and "homicide" (2000) are incommensurable. We link them via the *bullet* and the *corpse*.

  If your friend insists that we cannot measure the decline of disease because "disease" is a shifting category, they have moved from philosophy into denialism. By standing with the epidemiologists, you stand with the historians of violence.

  ### Summary of the Exit

  1.  **Keep Premise (2):** Yes, classifications change. Honor became violence.
  2.  **Reject Premise (4):** Changing classifications do not make quantities incommensurable *if* there is a stable material core (harm/death).
  3.  **Modify Premise (1):** Comparison requires *functional equivalence*, not *conceptual identity*.
  4.  **Accept the Cost:** You are a **Pragmatic Realist**. You admit that measuring long-run trends involves imposing modern categories on the past (presentism) and that the resulting numbers are estimates with wide error bars, not precise truths.

  This allows you to tell your friend: *"You are right that the categories have changed, and wrong that this makes comparison impossible. We compare the harm, not the label. If we can track the decline of plague without a perfect 18th-century germ theory, we can track the decline of violence without a perfect 18th-century penal code."*
