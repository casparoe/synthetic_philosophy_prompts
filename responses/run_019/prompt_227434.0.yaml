answer: |-
  **Joint Statement of Adversarial Collaboration on the Origins and Nature of the French Revolution**

  **1. Points of Consensus**
  1.  **Economic Findings:** We agree that revisionist economic history successfully disproved a strict dichotomy between a "feudal" nobility and a "capitalist" bourgeoisie. Many nobles were commercially active, and many bourgeoisie sought venal offices rather than industrial investment. However, this data does not prove the absence of social tension.
  2.  **Event Chronology:** Both sides agree on the factual sequence: the fiscal crisis forcing the Estates-General (1789), the abolition of feudal privileges (August 4), the flight to Varennes (1791), the execution of Louis XVI (1793), and the Reign of Terror (1793–94).
  3.  **Mutual Concessions:** The social historian concedes that Enlightenment ideology was not merely a superstructural mask for material interests but an independent variable shaping action. The revisionist concedes that social friction between elite groups exacerbated the political deadlock and that the Revolution ultimately resulted in the political dominance of property owners.

  **2. Remaining Disagreements**
  1.  **Structural Necessity vs. Political Contingency:** The social historian maintains that long-term structural contradictions between productive forces and legal relations made a revolution inevitable by the late 18th century. The revisionist maintains that the Revolution was not inevitable but resulted from a contingent collapse of state legitimacy and political language; without the specific deadlock of 1788–89, reform might have occurred without revolution.
  2.  **Class Formation:** The social historian argues the bourgeoisie acted *as* a class, possessing shared interests that preceded political action. The revisionist argues "bourgeoisie" is a retrospective label; deputies identified as "patriots" or "nationals" first, and class cohesion was a result, not a cause, of revolutionary polarization.
  3.  **Definition of Cause:** We acknowledge a semantic divergence. The social historian defines "cause" as deep structural precondition. The revisionist defines "cause" as immediate agential trigger. We agree this terminological difference accounts for approximately 30% of our apparent disagreement.

  **3. Cruxes and Adjudicating Evidence**
  1.  **The Origin of the Terror:**
      *   *Question:* Was the Terror a defensive response to external war and counter-revolution (circumstance), or an inherent outcome of Jacobin democratic discourse (ideology)?
      *   *Adjudication:* If evidence shows Terrorist measures were consistently proposed *before* specific military emergencies by key ideologues, the revisionist must concede ideology drove violence. If measures correlate strictly with invasion fronts, the social historian must concede the Terror was situational, not structural.
      *   *Agreed Evidence:* Committee of Public Safety minutes cross-referenced with military dispatch dates and private correspondence of Robespierre/Saint-Just.
  2.  **Timing of Class Consciousness:**
      *   *Question:* Did Third Estate deputies identify their interests as distinct from and opposed to the nobility *before* the convening of the Estates-General?
      *   *Adjudication:* If *cahiers de doléances* show universalist demands rather than class-specific economic grievances, the social historian must concede class identity was forged during the Revolution. If they show coherent bourgeois economic programming, the revisionist must concede a pre-existing class project.
      *   *Agreed Evidence:* Quantitative linguistic analysis of the *cahiers* regarding property rights, trade regulations, and noble privilege.

  We sign this statement acknowledging that while our interpretations differ, our commitment to evidentiary rigor is shared.
