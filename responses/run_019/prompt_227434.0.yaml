          *   Historian B: Revisionist Interpretation (Furet/Baker style: political crisis, ideology, contingency, not a coherent class project).
      *   **Structure:**
          1.  Numbered list of agreed claims (economic findings, event consensus, concessions).
          2.  Remaining disagreements (precisely stated, no strawmanning, clarifying terminology).
          3.  Cruxes (sub-questions where evidence could force ground shifting, including agreed evidence).
      *   **Constraints:** Max 750 words. No strawmanning. Acknowledge semantic disputes (e.g., definition of "cause").

  2.  **Drafting - Section 1: Agreed Claims:**
      *   Need common ground. Both agree the Ancien Régime ended. Both agree the bourgeoisie benefited eventually. Both agree economic data complicates the classic view.
      *   *Drafting points:*
          1.  Economic data (Cobban, Taylor) shows no clear capitalist/feudal dichotomy in 1789 elites; many nobles were capitalist, many bourgeoisie bought offices.
          2.  Events consensus: Convocation of Estates-General, Tennis Court Oath, Storming of Bastille, abolition of feudal privileges (August 4), execution of Louis XVI, Reign of Terror.
          3.  Concessions: Socialists admit ideology mattered; Revisionists admit social tensions exacerbated political breakdown.

  3.  **Drafting - Section 2: Remaining Disagreements:**
      *   Need to isolate the *real* conflict. It's often about "cause" and "class."
      *   *Socialist view:* Structural social矛盾 (contradictions) made revolution inevitable; bourgeoisie acted *as* a class eventually.
      *   *Revisionist view:* Political deadlock + discursive shift made revolution contingent; "bourgeoisie" is an ex-post label, not an ex-ante actor.
      *   *Wording:* Avoid saying "Revisionists deny economics." Say "Revisionists deny economics was the *primary driver*." Avoid saying "Socialists ignore ideas." Say "Socialists view ideas as superstructural to material interests."

  4.  **Drafting - Section 3: Cruxes:**
      *   What evidence would change minds?
      *   *Crux 1:* The Terror. Was it circumstantial (war/counter-revolution) or inherent to Jacobin ideology?
      *   *Crux 2:* Class consciousness. Did deputies identify as "bourgeois" against "nobles" *before* 1789, or was this identity forged during the conflict?
      *   *Evidence:* Parliamentary archives, cahiers de doléances, correspondence.

  5.  **Refining and Editing (Word Count & Tone Check):**
      *   Tone: Academic, collaborative, precise.
      *   Constraint: Max 750 words.
      *   Check for strawmanning: Ensure the Revisionist isn't painted as denying reality, and the Socialist isn't painted as dogmatic.
      *   Check semantic issues: Explicitly mention the definition of "cause."

