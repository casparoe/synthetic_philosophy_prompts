answer: |-
  UNITED STATES DISTRICT COURT
  DISTRICT OF COLUMBIA

  UNITED STATES OF AMERICA,
  Plaintiff,

  v.

  MARCUS HENDERSON,
  Defendant.

  **SENTENCING MEMORANDUM**

  **I. Preliminary Finding on Culpability**
  Before assessing the penalty, the Court must address the ontological status of the defendant's agency. It is settled beyond reasonable dispute that ultimate moral responsibility is impossible. To be truly responsible for an action, one must be responsible for the character, motives, and dispositions that produced it. To be responsible for those traits, one must be responsible for the heredity, upbringing, and circumstances that formed them. This requires responsibility for the conditions that formed those conditions, regressing backward without ever reaching a first self-caused starting point. As no individual creates themselves *ex nihilo*, no individual is the ultimate author of their conduct. Consequently, retributive desert—the notion that the defendant morally deserves suffering because he *could have done otherwise* in an ultimate sense—is an illusion. The Court rejects retribution as a justification for sentencing.

  **II. Factual Background and Procedural Status**
  On June 14, 2023, the defendant, Marcus Henderson, discharged a firearm during the course of an armed robbery, causing grievous bodily injury to a civilian witness. The jury found the defendant guilty on all counts. The evidence satisfies the standard of proof beyond a reasonable doubt regarding the *actus reus*: the defendant's body performed the prohibited acts, and the requisite mental state accompanied the conduct. The Court does not dispute that the defendant committed the crime. The Court merely notes that the defendant did not, and could not, originate the causal chain that resulted in the crime.

  **III. Sentencing Considerations**
  While ultimate culpability is a fiction, the state retains the authority and obligation to impose consequences based on consequentialist grounds. Punishment is not imposed because the defendant is evil, but because the defendant is dangerous. The Court identifies four permissible grounds for sentencing:

  1.  **Incapacitation:** The defendant has demonstrated a high probability of future violence. Confinement is necessary to physically prevent further harm.
  2.  **Specific Deterrence:** The conditions of confinement may alter the defendant's future cost-benefit analysis, conditioning avoidance of prohibited conduct.
  3.  **General Deterrence:** Public knowledge of this sentence will influence the behavior of other causal systems similarly constituted to refrain from violence.
  4.  **Norm Expression:** The sentence communicates the community's serious commitment to safety and order, reinforcing the social structures that mitigate harmful causation.

  **IV. Sentence and Address to Defendant**
  Accordingly, the defendant is committed to the custody of the Bureau of Prisons for a term of one hundred twenty months.

  Mr. Henderson, look at the Court. You did not choose your parents, your neurochemistry, or the environment that hardened your responses to stress. You are not morally guilty in the eyes of the universe. However, you are functionally hazardous. We do not lock you away to balance a cosmic scale; there is no scale. We lock you away because you are a loaded weapon in a populated room. You will receive vocational training and psychological intervention, not to absolve you, but to recalibrate the mechanisms that led to June 14. You are not being punished because you deserve it. You are being managed because you are dangerous.

  The Court acknowledges the tragedy of your determinism, but it must prioritize the safety of those equally determined to live without fear. The motion for downward departure based on lack of free will is denied, not because you are free, but because such a departure would increase the risk of recidivism.

  **V. Conclusion**
  Judgment is entered accordingly. The ritual of sentencing proceeds not as an attribution of blame, but as a maintenance of order within a causal network. The defendant is remanded to custody immediately.

  **SO ORDERED.**

  */s/ Judge Eleanor Vance*
  UNITED STATES DISTRICT JUDGE
