      This supports Claim 5 strongly.
      It challenges Claim 3 ("should never have happened"). If the *intercourse* is potentially beneficial and consequential, wishing it "never happened" is anti-Smithian. Wishing the *injustice* never happened is Smithian. Claim 3 needs to be precise about "Empire" = "Domination."
      But Claim 1 vs 2 is a structural conflict in the argument's architecture.

