      *   **Observation:** The debate has been ongoing for over a decade. Even within the "Criteria" camp, there's massive disagreement (apocalyptic vs. wisdom teacher) despite using the same tools.
      *   **Core Question:** What *kind* of disagreement is this? (Empirical/psychological? Semantic/definitional? Epistemological/priors?)
      *   **Requirements:**
          *   Provide a diagnosis with reasons.
