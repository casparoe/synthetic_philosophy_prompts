      *   **Strongest Counter-Argument:** The "Embarrassment" criterion *does* work in other historical fields. If early Christians preserved something embarrassing (like baptism by John), it's likely because it happened. The Memory critics sometimes overcorrect into skepticism.
      *   **Falsification Condition:** If a new manuscript turned up (e.g., a Q-like source dated to 40 CE with specific sayings), the Criteria side would be vindicated that kernels exist. OR, if cognitive studies of *specific* oral traditional cultures showed high-fidelity transmission of *content* (not just gist) over 40 years without writing, the Criteria side would gain ground.

