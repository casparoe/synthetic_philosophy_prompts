  2.  **Deconstruct the Debate:**
      *   **Side A (Criteria of Authenticity):** Assumes traditions can be stratified. There's an original layer (Jesus) and a secondary layer (Church). Tools (Dissimilarity, Embarrassment, etc.) help peel back the layers. Goal: Find the *ipsissima verba* (very words) or *ipsissima vox* (very voice) of the historical individual.
      *   **Side B (Memory Studies/Social Memory):** Assumes memory is reconstructive, not reproductive. Tradition is shaped by the community's needs from the start. No "pure kernel" exists. Goal: Understand the *impact* of Jesus on the movement, not necessarily specific utterances.
      *   **The Stalemate:** Side A says Side B leads to agnosticism. Side B says Side A leads to illusionary certainty. Both have been arguing for 15+ years (Third Quest vs. Post-Third Quest/Memory Turn).
      *   **The Internal Contradiction:** Side A uses the same tools but gets radically different Jesuses (Crossan's sage vs. Sanders' apocalypticist). This suggests the tools aren't constraining results enough.

  3.  **Evaluate the Types of Disagreement:**
      *   *Empirical (Cognitive Science):* Does memory work reconstructively? Yes, generally accepted in psychology (Loftus, etc.). But does this apply to *oral tradition* in 1st-century Jewish contexts specifically? Maybe, maybe not. But both sides generally accept memory isn't a video recorder. The dispute is about the *implications* of that fact for historiography. So, it's not primarily an empirical dispute about psychology anymore.
      *   *Semantic (Definition of "Authentic"):* Side A defines it as "what Jesus literally did/said." Side B defines it as "what accurately reflects his influence/character." This is part of it, but not the whole thing. Even if they agreed on definitions, they'd disagree on *access*.
      *   *Epistemological (Priors/Thresholds):* This feels like the core. How much uncertainty is tolerable? Side A accepts probabilistic inference despite noise. Side B thinks the noise drowns the signal entirely. This is a dispute about the *limits of historical knowledge* given the sources.

  4.  **Formulate the Diagnosis:**
      *   **Primary Diagnosis:** It is an **Epistemological Standoff regarding Underdetermination**, masked as a methodological dispute.
      *   **Reasoning:** The sources (Gospels) are underdetermined relative to the hypotheses (Specific sayings of Jesus). The Criteria attempt to overdetermine the data, but fail to produce consensus (as the user noted: apocalyptic vs. wisdom). The Memory critics point out the underdetermination is structural, not just a lack of better tools.
      *   **Secondary Aspect:** It is partly **Semantic** ("Authenticity" vs. "Historical Impact"), but changing the words won't fix the epistemic gap.
      *   **Tertiary Aspect:** It is *not* primarily Empirical anymore. Cognitive science has largely sided with the Memory critics (memory is reconstructive), yet Criteria proponents persist. This means the dispute isn't about *how memory works*, but *what historiography can do given how memory works*.

  5.  **Determine What Progress Looks Like:**
      *   If it's epistemological underdetermination, "new methods" won't help (they've tried).
      *   Progress looks like **Bayesian Calibration** or **Scope Restriction**.
      *   Acknowledging that specific sayings are likely unrecoverable, but broad contours (e.g., baptism, crucifixion, association with sinners) are high-probability.
      *   Shift from "Authenticity" (binary) to "Plausibility" (spectrum).
      *   Controlled comparison: Look at other charismatic leaders in oral cultures where we *do* have contemporary records (e.g., Hasidic rebbes, modern oral poets) to see how much distortion occurs in 40-60 years.

  6.  **Assess Confidence & Counter-Arguments:**
