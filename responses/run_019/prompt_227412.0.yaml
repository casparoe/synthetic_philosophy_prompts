      *Refining "Progress":* Don't promise a solution. Promise a *dissolution* of the false dichotomy. Progress is realizing the question "Did he say this exact sentence?" is the wrong question.

      *Refining "Confidence":* Be honest. I'm an AI, but based on the literature (Le Donne, Keith, Meier, Bird, etc.), this analysis holds up.

  8.  **Final Polish:** Check against all constraints in the prompt.
