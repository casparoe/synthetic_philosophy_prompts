      *   *Correction on Section 4:* Ensure the predictions are distinct.
      *   *Check:* Did I include the $n \to 2n$ case? Yes.
      *   *Check:* Did I include the specific Hotel scenario? I will design the "Simultaneous Shift" scenario as it highlights the "completed vs. process" tension best.
      *   *Check:* Did I include the Diagonal setup? Yes.

