  7.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Signability:* Would a strict finitist sign this? They might balk at "Agreed Claims" if it implies the infinite exists. I must phrase agreements as agreements about *rules* and *syntax*, not ontology.
      *   *Specific Constraint:* "written so that both parties would sign it as an accurate record."
      *   *Formatting:* Use clear headings, tables, and numbered lists.

  8.  **Final Polish (Self-Correction during drafting):**
