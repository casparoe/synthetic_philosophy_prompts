answer: |-
  **The Economic Possibilities Quiz**

  **Instructions:** Read each scenario and select the statement that best reflects your intuitive judgement. Do not worry about consistency; answer honestly.

  **1. The Saturated Economy**
  Imagine a wealthy nation where every citizen has a secure home, excellent healthcare, and ample food. The government proposes continuing to prioritise GDP growth above all else.
  *   **A.** We should keep growing; there is always more to achieve and better things to build.
  *   **B.** We should stop targeting growth and focus on distributing what we have fairly.
  *   **C.** We should grow only until we can guarantee this comfort for everyone globally, then stop.

  **2. The Automation Dividend**
  New technology means half the current workforce is no longer needed to maintain living standards. The state must decide how to handle the surplus labour.
  *   **A.** Reduce everyone's working hours so all share the remaining meaningful work.
  *   **B.** Let half retire fully on a generous income to pursue leisure and arts.
  *   **C.** Keep them working; idleness is dangerous, and we can find new things to produce.

  **3. The Intergenerational Trade-off**
  A policy would slightly lower living standards for the current poor to invest in infrastructure that will make the very distant future vastly wealthier.
  *   **A.** Reject it; we cannot sacrifice the vulnerable now for people who do not exist yet.
  *   **B.** Accept it; the sheer number of future people outweighs our current discomfort.
  *   **C.** Accept it temporarily, but only until a specific threshold of wealth is reached.

  **4. The Moral Cost of Ambition**
  To achieve rapid accumulation, a society decides to culturally encourage aggressive self-interest and envy as useful drivers of productivity.
  *   **A.** Embrace it; these motives are useful tools we can discard once we are rich enough.
  *   **B.** Reject it; cultivating vice corrupts the society permanently, regardless of wealth.
  *   **C.** Reject it; striving should be celebrated for its own sake, not treated as a dirty tool.

  **5. The Ecological Limit**
  Continued economic expansion risks severe environmental damage, though technology might mitigate this in fifty years.
  *   **A.** Halt expansion immediately; the planet cannot sustain infinite accumulation.
  *   **B.** Push through; innovation will solve the environmental constraints eventually.
  *   **C.** Slow down; we need growth to build the tech that will save us, but cautiously.

  **6. The Time Horizon**
  Keynes suggests a century is enough to solve the economic problem. You are asked to set the planning horizon for national strategy.
  *   **A.** One hundred years is sufficient; beyond that, problems are unknowable.
  *   **B.** We must think in millennia; the potential future population is too vast to ignore.
  *   **C.** Focus on the present generation; the future will manage its own affairs.

  **7. The Inequality Tolerance**
  During the accumulation phase, wealth inequality rises sharply, though everyone's absolute income grows.
  *   **A.** Tolerate it; inequality is the engine that drives the accumulation we need.
  *   **B.** Resist it; justice requires fairness now, not just abundance later.
  *   **C.** Ignore it; inequality does not matter if everyone is getting richer.

  **8. The Purpose of Leisure**
  Once economic necessity is abolished, what is the primary goal of human life?
  *   **A.** To enjoy freedom from work and cultivate the arts of living.
  *   **B.** To find new challenges and struggles to give life meaning.
  *   **C.** To ensure everyone has access to work that feels meaningful to them.

  ***

  **Scoring Key and Positional Mapping**

  This quiz does not yield a single score but rather a profile. Tally which option you selected most frequently to identify your dominant leaf. Note that mixed results indicate tension between values.

  *   **Mostly 1C, 3C, 6A:** **The Keynesian.** You view growth as a instrumental means with an expiry date. Once comfort is secured, the economic problem is solved, and we retire to leisure.
  *   **Mostly 1A, 4C, 8B:** **The Growth-Optimist.** You believe striving and accumulation are intrinsic goods. The good life is found in the climb, not the summit.
  *   **Mostly 1B, 5A, 7B:** **The Degrowth/Steady-State.** You reject the premise that more is better. Ecological or social limits require us to stop accumulating now.
  *   **Mostly 3A, 7B, 1C:** **The Egalitarian.** You cannot bracket the short run. Justice for the currently living outweighs future abundance or aggregate growth.
  *   **Mostly 3B, 6B:** **The Longtermist.** Your horizon extends beyond a century. The welfare of the far future justifies significant present sacrifice and continued accumulation.
  *   **Mostly 2A, 8C:** **The Fulfilling-Work Advocate.** You reject the leisure ideal. Work is where meaning resides; the goal is to distribute it, not abolish it.
  *   **Mostly 4B:** **The Character Critic.** You doubt the psychological feasibility of Keynes's plan. Instrumental vice becomes actual virtue; you cannot switch off greed on schedule.

  **Structural Notes on the Logical Space**

  Two leaves require flagging regarding discriminative reliability. **The Growth-Optimist and the Longtermist** are difficult to distinguish purely through policy preferences, as both advocate continued accumulation. The quiz separates them via motivation (intrinsic striving vs. duty to distant future), but in practice, their political programmes often converge.

  Additionally, **The Keynesian and The Fulfilling-Work Advocate** both advocate reducing labour hours, but for opposing reasons. Keynes seeks freedom *from* work; the Fulfilling-Work advocate seeks freedom *in* work. The quiz isolates this in Question 8, but respondents may conflate leisure with meaningful non-labour activity.

  No positions were added or collapsed. The seven leaves represent distinct coherent clusters within the debate surrounding Keynes's essay.

  **Awkward Commitments**

  **The Keynesian:** You must believe a society can cultivate greed for a century and then successfully purge it without moral residue.
  **The Growth-Optimist:** You must accept that the struggle for accumulation is meaningful even when basic needs are universally met.
  **The Degrowth/Steady-State:** You must justify denying future generations higher material living standards to preserve current ecological boundaries.
  **The Egalitarian:** You must accept that prioritising current redistribution may slow the technological progress that could eventually help the poor most.
  **The Longtermist:** You must be willing to impose significant hardships on living people for the sake of beings who may never exist.
  **The Fulfilling-Work Advocate:** You must define 'meaningful work' broadly enough to include everyone, risking the dilution of the concept.
  **The Character Critic:** You must argue that we should potentially remain poorer to avoid the risk of becoming morally corrupted by wealth.
