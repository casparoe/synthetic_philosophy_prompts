  **The Principle**
  The principle underlying your intuitions is the **Principle of Instrumentality and Specific Custodianship**. It states: *It is impermissible to intend a person's death as a means to an end, or to fail to prevent a specific, imminent death when you occupy a unique position of custodianship (exclusive knowledge and capacity); all other foreseen deaths resulting from neutral acts or general inaction are permissible side effects.* This hybridizes Aquinas's Double Effect (focusing on intent vs. foresight) with a duty-based constraint on omissions, explaining why some inactions (Charity) are permissible while others (Toddler, Poisoned Water) are morally equivalent to killing.

  **Case by Case**
  This principle cleanly adjudicates your six verdicts. In **Transplant** and **Lethal Injection**, death is the *means* to save the five or end suffering; you intend the death, violating the Instrumentality clause. In **Bystander Trolley**, the worker's death is a foreseen side effect of redirecting an existing threat, not a means, and you have no prior custodial duty to that specific worker, so it is permissible. The **Ventilator** case turns on the same distinction: unplugging is withdrawing an intrusion (death is a side effect of respecting autonomy), whereas injection intends death as the method.

  The principle does heavy lifting in the omission cases. For **Charity**, you lack *specific custodianship*; the need is general, and you are not the unique barrier to harm, so keeping the money is a neutral act with foreseen bad effects. However, in the **Drowning Toddler** and **Poisoned Water** cases, you possess exclusive knowledge and capacity in the face of an imminent, specific threat. Here, the Custodianship clause triggers, making your inaction functionally identical to a commission. *Flag:* The distinction between Charity and Toddler relies on the "Specific Custodianship" clause. Critics might call this ad hoc (why does physical proximity create duty?), but it is necessary to save your intuition that distance matters. Without this clause, the principle collapses into utilitarianism, forbidding the ski weekend.

  **The Verdict to Drop**
  Strictly speaking, the principle can save all six verdicts, but the **Charity** verdict is the most philosophically vulnerable. If you accept the logic of the Toddler and Poisoned Water cases—that exclusive capacity to prevent death creates a duty—the moral relevance of distance becomes hard to defend. To make your ethical framework universally consistent rather than locally intuitive, you should drop the Charity verdict. If failing to save a child in front of you is monstrous, failing to save a child for $200 remotely is arguably the same failure of custodianship, merely obscured by geography. Dropping this verdict aligns your actions with the severity of your own Custodianship clause.

  **Stress Test**
  Consider the **Sleeping Lifeguard**: A lifeguard intends only to rest (neutral act) and foresees a risk that swimmers might drown if he sleeps, but does not intend their death. Aquinas's Double Effect might permit this (act is neutral, death is foreseen, not intended). Your principle, however, forbids it: the lifeguard has *Specific Custodianship*. This test reveals that you likely believe roles and duties matter more than mere intention, validating the Custodianship clause over pure Thomistic intent.
