      *   **Core Question:** Compare Bongard Problems (BP) and Raven's Progressive Matrices (RPM) as tests of *concept induction* vs. *memorization/lookup*.
      *   **Specific Sub-questions:**
          *   What exactly does each ask the solver to do?
          *   Do they measure different abilities or the same ability dressed up differently?
          *   Which is harder to fake via pattern-matching/prior exposure?
