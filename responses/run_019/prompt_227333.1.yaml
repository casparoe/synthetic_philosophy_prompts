          *   Declare a "winner" for probing genuine abstraction (if applicable) and defend it.
          *   Acknowledge what the "loser" still captures that the "winner" misses.

  2.  **Analyze Bongard Problems (BP):**
      *   *Structure:* 12 images. 6 on the left (positive examples), 6 on the right (negative examples). Task: Find the rule that distinguishes left from right.
      *   *Cognitive Demand:* Hypothesis generation, rule formulation, handling novelty. The rule is often semantic or topological (e.g., "concave vs. convex," "inside vs. outside," "number of elements").
      *   *Exposure:* High novelty. It's very hard to memorize specific BPs because the space of possible rules is vast and combinatorial.
      *   *Format:* Open-ended (usually verbal description of the rule).
      *   *Weakness:* Can be solved by feature extraction if the feature space is predefined (hard for humans, easier for specific CNNs if trained on the specific dataset, but hard for generalization).

  3.  **Analyze Raven's Progressive Matrices (RPM):**
      *   *Structure:* 3x3 grid (usually). 8 panels filled, 1 missing. Multiple choice options (usually 8). Task: Select the panel that completes the pattern.
      *   *Cognitive Demand:* Analogical reasoning, rule progression (e.g., rotation, addition, subtraction of shapes), working memory.
      *   *Exposure:* High familiarity. The format is standardized. People can learn *how* to take RPMs (test-wiseness).
      *   *Format:* Closed-ended (multiple choice).
      *   *Weakness:* Susceptible to "test-taking strategies" and brute-force feature matching if the distractor options are weak. Deep learning models (like ResNets) have achieved high scores on specific RPM datasets (e.g., PGM) by learning statistical regularities rather than abstract rules.

  4.  **Compare: Concept Induction vs. Memorization:**
      *   *BP:* Forces *rule synthesis*. You can't just match features; you have to articulate the boundary condition between two sets. It's a "one-shot" or "few-shot" learning scenario per problem.
      *   *RPM:* Forces *rule extrapolation*. You see a sequence, you predict the next step. It's often solvable by detecting trends (linear, XOR, etc.).
      *   *Memorization:* RPM is more vulnerable because the *structure* of the test is constant. BP is less vulnerable because the *nature* of the rule changes wildly (geometry, topology, count, semantics).

  5.  **Address the "Physicist" Angle:**
      *   Use terms like "phase space," "degrees of freedom," "signal-to-noise," "basis functions."
      *   Focus on the *information theoretic* aspect. How much information is needed to specify the solution?
      *   Discuss the "inverse problem" nature of BP vs. the "forward prediction" nature of RPM.

  6.  **Drafting the Comparison (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. It's about the "Chinese Room" argument applied to psychometrics.
      *   *Task Definition:*
          *   BP: Binary classification of sets -> Rule description. (Inverse problem).
          *   RPM: Sequence completion -> Selection from options. (Forward prediction).
      *   *Ability Measured:*
          *   BP: Concept formation, semantic grounding, hypothesis space search.
          *   RPM: Fluid intelligence ($G_f$), working memory, analogical mapping.
          *   *Verdict:* They overlap (both require abstraction) but BP is more about *discovery*, RPM is more about *application*.
      *   *Vulnerability to Memorization/Pattern Matching:*
          *   RPM: High vulnerability. The "grammar" of RPM is fixed. A machine can learn the grammar without understanding the semantics. Prior exposure helps significantly (practice effects).
          *   BP: Low vulnerability. The "grammar" is open. Prior exposure helps less because the specific rule is likely novel. Fewer examples per rule (6 vs 8) makes statistical learning harder.
      *   *The "Winner":* Bongard Problems are the better probe for *genuine* abstraction/induction.
          *   *Reasoning:* RPM can be hacked by high-dimensional correlation. BP requires symbolic grounding (usually).
          *   *Caveat:* RPM captures *processing speed* and *working memory load* better. BP is timeless (until solved).
      *   *Nuance:* Mention "Bongard-LOGO" or modern variants. Mention that deep learning has struggled more with BP than RPM.

  7.  **Refining the Argument (Self-Correction):**
      *   *Correction:* Wait, are BPs really harder for machines? Early AI struggled with both. Modern transformers do okay on RPM. BPs are still very hard for AI because they require natural language grounding often.
      *   *Correction:* Is RPM just memorization? No, novel RPMs still test fluid intelligence. But the *format* is learnable.
      *   *Key Distinction:* RPM is multiple choice. This allows elimination strategies. BP is open generation. This requires constructive reasoning.
