      *   However, the *condemnation* of tyranny comes from the higher order, not the lower.
      *   Reason cannot bridge this gap. The heart perceives the higher justice.
      *   I must not concede that reason/custom can ground true justice. I must maintain that human justice is fundamentally flawed but necessary for peace, while true justice is supernatural.

