      *   *Letter to d'Alembert on Spectacles:* Rousseau argues against professional theater because it fosters passivity, isolates individuals in the dark, promotes imitation/acting (inauthenticity), and cultivates pity for fictional characters rather than active virtue for real neighbors.
      *   *Civic Festivals:* He praises open-air festivals where people are both spectators and actors, seeing themselves in others, fostering genuine community bonds without artifice or mediation.
