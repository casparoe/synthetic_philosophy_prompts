      *   *Point 4 (Counter-argument/Alternative):* Proponents might argue that collective plot influence creates active participation, but Rousseau would counter that manipulating a simulation is not the same as openly gathering as oneself in the public square.
      *   *Point 5 (Final Defense):* Ultimately, the professional studio's design imposes an external will on the populace, substituting the spontaneous unity of a festival with a engineered spectacle that keeps citizens spectators of their own avatars.

