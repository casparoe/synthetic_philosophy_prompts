  2. Even though roles are generative, the act of adopting a personalized fictional persona remains a corrupting imitation that prioritizes self-display over authentic civic virtue.
  3. Algorithmic personalization designed to maximize engagement replicates the commercial theater's dangerous cultivation of private appetite rather than public moral duty.
  4. Although proponents argue that shaping the plot eliminates passive spectatorship, Rousseau would insist that interacting with a machine-mediated fiction remains a form of isolation distinct from genuine social communion.
  5. Ultimately, the professional studio's design imposes an external will on the populace, substituting the spontaneous unity of a festival with an engineered spectacle that keeps citizens spectators of their own avatars.
