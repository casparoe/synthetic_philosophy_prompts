      *   Concrete changes for full contractualism.

      *(Self-Correction during drafting)*: Make sure to explicitly mention the "Individualist Restriction" as that is the core Scanlonian technical term relevant here.

      *(Refining the "Inconsistency" verdict)*: It's not necessarily inconsistent if the *context of choice* differs. I should argue for the "Principled Line" via Ex Ante/Ex Post.

      *(Institutional Reality Check)*: Hospitals are hybrid institutions. They are fiduciaries to patients (Contractualist leanings) AND stewards of finite resources (Utilitarian leanings). The inconsistency is a feature, not a bug, of the hybrid nature.

      *Let's structure the response.*
      1. Introduction: Validate the intuition.
      2. Candidate Theories (Utilitarian, Contractualist, Hybrid).
      3. Deep Dive on Triage (Scanlonian Rescue).
      4. Deep Dive on Vaccines (Ex Ante Mutual Advantage).
