prompt: |-
  I recently ended up on the ethics advisory group at my local hospital (long story) and I keep bumping into something that feels philosophically inconsistent, so I want you to act as a moral philosopher who knows Scanlon's contractualism inside out but also understands how actual institutions work. Think it through carefully -- brainstorm the candidate implicit theories first before committing to one.

  Here's the practice. In ICU triage, the committee's standing rule is basically: compare patients one at a time and prioritize whoever stands to lose the most. If it comes down to one person who'll die versus a hundred people who'd each be spared a week of misery on a ventilator, the one person wins -- the smaller burdens never get added up across people. But the same committee signs off on vaccine and screening programs whose entire justification is summing up thousands of tiny benefits and burdens across the population, where no single individual's stake comes close to the costs being imposed.

  So: what does each half of this practice presuppose about whether burdens and benefits can be aggregated across persons? Is the triage rule secretly committed to something like Scanlon's individualist picture, where only the strength of each person's separate complaint counts, or can a boring utilitarian justify it too on some other grounds? And is the committee just being inconsistent, or is there a principled line -- maybe about identified vs statistical lives, or ex ante vs ex post -- that makes both rules hang together? Finally, if the committee went full contractualist and banned aggregation everywhere, what concretely would have to change, and is there any version of that policy a hospital could actually live with?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Member of a local hospital ethics advisory group.
      *   **Problem:** Perceived philosophical inconsistency in hospital policy.
          *   *Policy A (ICU Triage):* Non-aggregative. One person's life trumps many people's minor burdens (e.g., week on ventilator). Prioritizes the "strongest complaint."
          *   *Policy B (Public Health/Screening/Vaccines):* Aggregative. Many small benefits justify costs/risks, even if no single individual's benefit outweighs the cost to a specific individual.
      *   **My Role:** Moral philosopher expert in T.M. Scanlon's contractualism, but also pragmatic about institutional realities.
      *   **Task:**
          1.  Brainstorm candidate implicit theories behind each practice.
          2.  Analyze consistency (is it inconsistency or a principled distinction?).
          3.  Explore specific distinctions (identified vs. statistical, ex ante vs. ex post).
          4.  Determine concrete consequences if the committee went "full contractualist" (banned aggregation everywhere).
          5.  Assess institutional viability.

  2.  **Deconstruct the Two Practices:**

      *   **Practice 1: ICU Triage (The "One vs. Many" Case)**
          *   *Action:* Save the one dying patient over sparing 100 patients a week of discomfort.
          *   *Implicit Logic:* The complaint of the dying person ("I will die") is stronger than the complaint of the others ("I will be uncomfortable"). Aggregation is rejected.
          *   *Scanlonian Fit:* High. This looks like the "Rescue Principle" or the rejection of utilitarian aggregation in favor of individual claims. The "greater burden" principle.
          *   *Utilitarian Fit:* Low (unless you argue death is infinitely worse than discomfort, but the prompt implies the *number* doesn't matter, just the severity).

      *   **Practice 2: Vaccine/Screening Programs (The "Population Health" Case)**
          *   *Action:* Implement a program where costs/risks are imposed (taxes, side effects, false positives) to generate tiny benefits for thousands.
          *   *Implicit Logic:* Small benefit $\times$ Many People > Large Cost $\times$ Few People (or even One Person). Aggregation is accepted.
          *   *Scanlonian Fit:* Low. Scanlon generally rejects aggregating small complaints to override a large individual complaint *in direct conflict cases*. However, contractualism allows for general rules that benefit everyone ex ante.
          *   *Utilitarian Fit:* High. Classic cost-benefit analysis / QALY maximization.

  3.  **Brainstorm Candidate Implicit Theories:**

      *   *Theory A: Pure Utilitarianism.* (Rejected for Triage).
      *   *Theory B: Pure Scanlonian Contractualism.* (Rejected for Vaccines, ostensibly).
      *   *Theory C: Dual-System / Contextual Ethics.* Different spheres require different logics (Clinical vs. Public Health).
      *   *Theory D: Ex Ante vs. Ex Post Contractualism.* (The key potential reconciler).
      *   *Theory E: Identified vs. Statistical Lives.* (The psychological/policy distinction).

  4.  **Analyze the Consistency (The Core Philosophical Work):**

      *   *Is it inconsistent?* On the surface, yes. One aggregates, one doesn't.
      *   *Can Scanlon save it?* Scanlon distinguishes between *direct competition* (Triage) and *general policy* (Vaccines).
      *   *The "Ex Ante" Move:* In vaccination, everyone is at risk *before* the policy. Everyone agrees to the rule because it benefits them probabilistically. In ICU triage, the patients are already *in* the bed. The competition is ex post.
      *   *Scanlon's "Individualist Restriction":* You can't aggregate small complaints to override a large one *when deciding between specific individuals*. But you *can* agree to a policy that imposes small risks on all to save lives generally, provided no one is singled out for sacrifice.
      *   *The "Identified vs. Statistical" Distinction:* This is often criticized philosophically (Schelling), but institutionally it's robust. Triage deals with *identified* lives. Vaccines deal with *statistical* lives. Contractualism might respect this if the "reasonable rejection" criterion changes based on identifiability (though Scanlon is wary of this).
      *   *Better Distinction:* **Direct Conflict vs. General Rule.**
          *   Triage: A zero-sum game between specific individuals *right now*.
          *   Vaccines: A cooperative scheme where everyone is a potential beneficiary and a potential bearer of cost.

  5.  **Develop the "Full Contractualist" Scenario:**

      *   If we ban aggregation *everywhere* (strict Scanlonianism):
      *   *Vaccines:* Could be challenged. If a vaccine causes severe anaphylaxis in 1 in 1 million, but saves 1 million people from a mild cold, strict contractualism might say the one person can reasonably reject the policy.
      *   *Screening:* If a screening program causes false positives (anxiety/biopsy risk) for 1000 people to find 1 cancer, can the 1000 reject it?
      *   *Concrete Changes:* Need higher thresholds for intervention. Focus on "worst-off" protection rather than "max total good." Informed consent becomes even more critical (individual opt-out).
      *   *Institutional Viability:* Hospitals would collapse. Public health relies on aggregation. You can't run a hospital system without some utilitarian calculus in resource allocation (budgeting, staffing, stocking).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, philosophical, empathetic to the institutional constraints.
      *   *Structure:*
          1.  Acknowledge the tension (it's a classic problem).
          2.  Brainstorm the implicit theories (Utilitarian vs. Contractualist vs. Hybrid).
          3.  Analyze the Triage Rule (Scanlonian rescue).
          4.  Analyze the Vaccine Rule (Ex Ante agreement).
          5.  The Reconciliation (Ex Ante vs. Ex Post / Direct Conflict).
          6.  The "Full Contractualist" Counterfactual (What breaks?).
          7.  Final Verdict (Principled line exists, but don't go full purist).

      *   *Refining the Scanlonian Analysis:* I need to be careful not to misrepresent Scanlon. Scanlon *does* allow some aggregation (relevant to the "greater burden" principle). But he rejects *summing* small burdens to outweigh a large one in a direct choice.
      *   *Key Scanlonian Concept:* "Reasonable Rejection."
      *   *Triage:* The dying person can reasonably reject a principle that sacrifices them for minor comforts of others.
      *   *Vaccines:* Can an individual reasonably reject a vaccine mandate? Only if the risk to them is disproportionate compared to the benefit. If the risk is tiny and the benefit is tiny but widespread, Scanlon might actually allow it under a "mutual benefit" clause, *provided* the risk isn't catastrophic for the individual.
      *   *Wait, the prompt says:* "no single individual's stake comes close to the costs being imposed." This implies the cost to the individual (e.g., tax, minor side effect) is *higher* than the benefit to any single recipient? Or that the benefit to one recipient is too small to justify the cost to one payer?
      *   *Correction:* Usually, vaccine justification is: Small cost to me $\times$ Many = Large total benefit. But for any *specific* other person, my cost might outweigh their benefit. The justification relies on the *sum*.
      *   *Scanlon's view on this:* Scanlon is wary of this. However, he allows for "institutional rules" that are mutually beneficial ex ante.
      *   *The "Ex Ante" Defense:* This is the strongest philosophical bridge. In public health, we are all behind a veil of ignorance regarding who gets the disease. We would all agree to the rule. In ICU, the veil is lifted. We know who is who.

  7.  **Final Polish:** Ensure the distinction between *clinical ethics* (fiduciary duty to the patient in front of you) and *public health ethics* (population welfare) is clear, as this maps onto the philosophical distinctions.

      *   *Self-Correction on "Full Contractualism":* If the hospital banned aggregation, they couldn't do cost-effectiveness analysis (QALYs). They'd have to treat every request that isn't futile. This leads to bankruptcy. I need to highlight this pragmatic impossibility.

  8.  **Final Review against constraints:**
      *   Act as moral philosopher expert in Scanlon.
