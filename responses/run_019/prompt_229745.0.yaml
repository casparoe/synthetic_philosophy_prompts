answer: |-
  This is a classic problem in non-ideal theory, and your intuition is sharp: on the surface, this looks like a glaring contradiction. You have a committee that refuses to aggregate burdens in the **ex post** clinical context (ICU triage) but happily aggregates them in the **ex ante** policy context (public health/screening).

  As a philosopher who has spent too much time reading *What We Owe to Each Other* and too many hospital bylaws, I can tell you that this tension is the daily bread of bioethics committees. Let's break this down systematically, brainstorming the implicit theories before diagnosing the consistency and the practical implications.

  ### 1. Brainstorming Candidate Implicit Theories

  To understand what the committee is doing, we need to articulate the moral machinery driving each rule.

  **Candidate A: Pure Utilitarianism (Maximizing Aggregate Welfare)**
  *   **The Theory:** Right action maximizes total net benefit (e.g., QALYs).
  *   **Fit with Vaccines:** Perfect. We impose small costs on many to generate large aggregate benefits.
  *   **Fit with Triage:** Poor, unless modified. A pure utilitarian *should* save the 100 people from a week of misery if the aggregate disutility of that misery outweighs the disutility of one death. (Though most utilitarians would argue death is lexically worse than discomfort, the prompt implies the *number* doesn't matter, which is anti-utilitarian).
  *   **Verdict:** The committee is not running a pure utilitarian shop.

  **Candidate B: Strict Scanlonian Contractualism (The Individualist Restriction)**
  *   **The Theory:** An act is wrong if it violates principles that no one could reasonably reject. Crucially, Scanlon's "Individualist Restriction" generally forbids aggregating many small complaints to override one large complaint in a direct choice.
  *   **Fit with Triage:** Perfect. The dying patient has a "greater burden" complaint. They can reasonably reject a principle that sacrifices their life to spare others minor discomfort.
  *   **Fit with Vaccines:** Problematic. If a screening program imposes a risk of severe harm on Patient X to provide a tiny benefit to Patients Y, Z, and A... Patient X can reasonably reject that principle. Strict contractualism struggles with policies where the *sum* of benefits justifies the cost, but no *individual* benefit justifies it.
  *   **Verdict:** The committee is not strict contractualists either.

  **Candidate C: The "Two Worlds" Hybrid (Clinical Fiduciary vs. Public Steward)**
  *   **The Theory:** Hospitals operate in two distinct moral spheres.
      1.  **Clinical Sphere:** The physician owes a fiduciary duty to the *identified* patient in front of them. Aggregation is forbidden because it violates trust.
      2.  **Policy Sphere:** The institution acts as a steward of population health. Aggregation is required because resources are finite and risks are probabilistic.
  *   **Fit:** Explains the practice perfectly.
  *   **Verdict:** This is likely the *actual* sociological explanation, but it lacks philosophical unity. It begs the question: *Why* do the rules change?

  ### 2. Diagnosing the Inconsistency: Is there a Principled Line?

  Is the committee being hypocritical, or is there a philosophical bridge? I argue there is a principled line, but it requires moving from a static view of contractualism to a dynamic one. The key distinction is **Ex Post Direct Conflict vs. Ex Ante Mutual Advantage.**

  #### The Triage Rule (Ex Post Direct Conflict)
  In the ICU, the "veil of ignorance" has been lifted. We know exactly who is in Bed 1 and who is in Bed 2.
  *   **Scanlonian Analysis:** This is a case of **direct competition**. Patient A says, "If you don't treat me, I die." Patient B (and C through Z) say, "If you don't treat us, we suffer for a week."
  *   **Reasonable Rejection:** Patient A can reasonably reject any principle that allows their death to be traded for others' temporary comfort. The "strength" of A's complaint overwhelms the others. Aggregation is irrelevant here because the claims are competing for the *same* resource at the *same* time.
  *   **Utilitarian Defense:** Even a utilitarian can justify this if they accept a **threshold deontology** or a **lexical priority of life**. If death is infinitely worse than a week on a vent, the math still works without aggregation. So, the triage rule isn't necessarily anti-utilitarian, but it *is* pro-individualist.

  #### The Vaccine/Screening Rule (Ex Ante Mutual Advantage)
  In public health, we are not choosing between Identified Person A and Identified Person B. We are choosing a rule for *everyone* before we know who will get sick.
  *   **Scanlonian Analysis:** This is not direct competition; it is **scheme participation**. Scanlon allows for principles that impose risks on everyone if everyone benefits *ex ante*.
  *   **The Justification:** "We all agree to a system where we pay taxes/accept minor side effects because, statistically, we are all more likely to benefit from herd immunity/early detection than we are to be harmed by the intervention."
  *   **The Line:** Aggregation is permissible here because no specific individual is being *singled out* for sacrifice. The burdens are distributed generally, and the benefits are distributed generally. The "reasonable rejection" criterion is met because, from behind the veil of ignorance, it is rational to accept the risk.

  #### The Verdict on Consistency
  The committee is **not inconsistent**, provided they accept the **Ex Ante/Ex Post distinction**.
  *   **Triage:** Ex post, identified lives. Aggregation forbidden (Individualist Restriction applies).
  *   **Vaccines:** Ex ante, statistical lives. Aggregation permitted (Mutual Advantage applies).

  However, there is a danger zone. If a screening program is known to cause severe harm to a *specific, identifiable* minority (e.g., a genetic test that helps 99% but kills 1% due to a specific reaction), and you run it anyway based on aggregate benefit, you have crossed back into forbidden territory. The committee must ensure public health policies remain truly probabilistic for all participants.

  ### 3. The Counterfactual: What if They Went "Full Contractualist"?

  Suppose your committee gets infected by strict Scanlonian purism. They decide that **aggregation is never permissible**, even in policy. They adopt a strict "Greatest Burden" principle across the board. Here is what concretely breaks:

  **1. The End of Cost-Effectiveness Analysis (CEA)**
  *   **Current Practice:** Hospitals use QALYs (Quality-Adjusted Life Years) to decide which drugs to stock. Drug A costs \$100k for 1 year of life; Drug B costs \$100k for 5 years. They buy Drug B.
  *   **Full Contractualist Change:** You cannot compare the "sum" of life years. If Patient X needs Drug A to live, and Patient Y needs Drug B to live, you cannot deny X just because Y gets more time. You would have to fund every treatment that offers *any* significant benefit to an individual, regardless of cost.
  *   **Institutional Result:** Bankruptcy within 18 months. The hospital cannot be a fiduciary to every individual simultaneously when resources are finite.

  **2. Screening Programs Collapse**
  *   **Current Practice:** Mammograms cause false positives (anxiety, unnecessary biopsies) in hundreds of women to find one cancer. The aggregate benefit justifies the aggregate harm.
  *   **Full Contractualist Change:** The hundreds of women with false positives have a complaint (pain, anxiety, cost). The one woman with cancer has a complaint (death). Strictly speaking, if the harm to the hundreds is significant enough, they could reasonably reject the program if their burdens are not outweighed by *their own* benefit (which is zero, they didn't have cancer).
  *   **Institutional Result:** You can only screen if the risk to the individual is negligible compared to the benefit *to that same individual*. This raises the threshold for intervention so high that preventative medicine vanishes.

  **3. Triage Becomes a Lottery (or First-Come, First-Served)**
  *   **Current Practice:** Prioritize the sickest (greatest burden).
  *   **Full Contractualist Change:** Actually, Scanlon supports prioritizing the worst off. So triage might stay the same. *However*, if you have two patients with equal "greatest burden" (both will die without a ventilator), contractualism struggles to choose between them. Aggregation (saving the younger one who has more life to lose?) is suspect.
  *   **Institutional Result:** You likely move to a random lottery for ties. This is ethically defensible but operationally chaotic and emotionally devastating for families ("Why did the coin flip kill my dad?").

  **4. Infectious Disease Control Paralysis**
  *   **Current Practice:** Mask mandates or isolation protocols impose small burdens on many to protect the vulnerable.
  *   **Full Contractualist Change:** If the burden on the individual (loss of liberty, discomfort) is deemed "significant" by that individual, and the benefit to them personally is low (they are young and healthy), they can reasonably reject the mandate.
  *   **Institutional Result:** The hospital loses the ability to enforce population-level safety protocols, relying entirely on voluntary compliance.

  ### 4. Can a Hospital Live with "Full Contractualism"?

  **Short Answer:** No.

  **Long Answer:** A hospital is a **hybrid institution**. It is part **fiduciary** (doctor-patient relationship) and part **utility manager** (insurance contracts, budget constraints, public health mandate).

  *   **The Fiduciary Role** aligns with Contractualism: "I will not sacrifice you for the greater good."
  *   **The Utility Role** aligns with Utilitarianism: "We must ensure this ward is sustainable so we can treat patients next year."

  If you ban aggregation everywhere, you destroy the Utility Role. The hospital ceases to be a public institution and becomes a series of isolated dyads (doctor-patient) fighting over a common pool of resources with no rules for distribution.

  ### 5. Recommendation for the Ethics Committee

  You don't need to fix the inconsistency because it isn't a true contradiction; it's a **contextual shift in moral framework**. However, to make the committee's reasoning robust, I recommend adopting the following **Principled Distinction** in your bylaws:

  1.  **Adopt the "Ex Post Non-Aggregation" Rule for Clinical Care:** When specific, identified patients compete for immediate, life-saving resources, do not aggregate minor burdens to override a catastrophic loss (Death > Discomfort). This honors the fiduciary duty.
  2.  **Adopt the "Ex Ante Mutual Advantage" Rule for Policy:** When setting general rules (vaccines, screening, staffing ratios), aggregation is permitted *only if* the risk/benefit profile is shared generally. No subgroup can be singled out to bear the cost for the benefit of others without their consent.
  3.  **The "Safety Valve":** If a policy (like a screening program) is discovered to impose a *catastrophic* burden on a specific identifiable minority (e.g., a specific genetic group suffers severe side effects), the policy must be halted or modified, even if the aggregate math works. This prevents the "Ex Ante" justification from being used to sacrifice vulnerable minorities.

  **Philosophical Bottom Line:**
  Your committee is effectively practicing **Rule Contractualism** for policy (what rules would we all agree to beforehand?) and **Act Contractualism** for triage (what do we owe this specific person right now?). This is not inconsistency; it is the only way a moral institution can function in a world of scarce resources. Don't let the purists talk you into bankrupting the hospital, but keep a close eye on any policy that tries to use "aggregate benefit" to justify singling out an identifiable person for sacrifice. That is the line you cannot cross.
