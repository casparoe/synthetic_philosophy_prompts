answer: |-
  Good morning.

  Thank you for being here. Looking out at this room, I see the full measure of what we do. I see the faces of those who are here because an organ became available. I see the families who gave those organs, living with a generosity that defies description. And I see the families who are here to remember those who did not make it.

  Five years ago, this network changed the way we allocate one of our scarcest organs. We moved away from a system designed to maximize the total number of successful transplants. Under the old rules, we prioritized candidates who were most likely to survive the longest. We counted on the future. We tried to make the math work out to the highest number of lives saved.

  The new system is different. It uses a weighted lottery. When multiple patients are in need and medically eligible, we do not automatically choose the one with the best prognosis or the youngest age. We give each of them a chance.

  I know that for some of you, this change is abstract. For others, it is the reason you are breathing today. And for others, it is the reason you are grieving a loss that feels preventable.

  I stand before you as the chair of the ethics committee that proposed this change. I was the principal author of the policy. And because I asked this network to take this direction, I owe you an explanation of why we did it, and an acknowledgment of what it costs.

  When we debated this change, we argued about numbers. But the reason for the change was not about numbers. It was about the person standing at the bottom of the list.

  Under the old policy, if we had to choose between one patient who was very sick and older, and five patients who were younger and healthier, the system told us to save the five. It told us that saving five was the right thing to do because five is more than one. It sounds undeniable. But we began to ask: more than one *what*?

  To the one patient, their life is not one-fifth of a total. It is everything they have. It is every memory, every hope, every relationship they hold. To that person, losing their life is a total loss. It is not a partial loss that can be outweighed by the partial losses of others.

  We realized that when we aggregate lives—when we add them up to see which side is heavier—we are treating human beings as containers of value that can be pooled together. But grief does not pool. A mother does not grieve less because her son died while five others lived. Her loss is complete.

  So, we changed the policy to reflect a different truth: that no single person's claim to life can be cancelled out by the combined claims of a group. We decided that fairness requires giving every candidate a genuine chance, rather than telling some that their lives count for less because they are fewer, or older, or sicker.

  I want to speak directly to the families in this room who lost a loved one while this policy was in effect. I know that under the old rules, your husband, your wife, your child might have been prioritized. I know that the lottery did not go their way.

  I cannot stand here and tell you that their death was a price worth paying. It was not. Their death is not a down payment on the survival of the recipients sitting behind me. To say that would be to commit the very error we sought to avoid. It would be to treat your loved one's life as a currency we spent to buy time for someone else.

  We refuse to do that. Your loved one's life was not a means to an end. It was an end in itself. The fact that the system did not save them does not diminish the wholeness of their claim to life. It does not make their loss smaller.

  I know this is not a comfort that fills the hole left by grief. I know that for you, the fairness of the process does not bring them back. I only ask that you understand that the policy was not designed to weigh their life against others and find it lighter. It was designed to acknowledge that their life was too heavy to be placed on a scale against anyone else's.

  This reasoning is not without its critics. Five years ago, two members of my committee resigned rather than implement this policy. They are good people. They are dedicated clinicians and ethicists. They believed that by not maximizing the number of survivors, we were failing in our duty to the community. They believed that if we have the power to save more lives, we are obligated to use it.

  I respect their resignation. I respect their integrity. They looked at the same reality and saw a different moral obligation. They saw a duty to the future total of human life. We saw a duty to the individual standing before us in the present.

  Reasonable people can disagree on where the greater wrong lies: in letting more people die overall, or in telling specific people that they are less likely to be saved because of who they are. We chose the latter path. We accepted the risk that fewer people might survive, in order to ensure that no one was told they were less worthy of the attempt.

  This brings me to the burden I carry, and the burden this committee carries.

  There is a difference between arguing for a principle in a journal and enforcing it in a hospital. In a journal, a wrong argument leads to a correction in the next issue. In a transplant network, a wrong argument leads to a death that did not need to happen.

  I am acutely aware that if our philosophical reasoning is flawed, the cost is not theoretical. If John Taurek's argument—that numbers should not count across persons—is wrong, then I have advocated for a system that allows preventable deaths. I have to live with the possibility that my commitment to fairness has come at the expense of life itself.

  To the bioethicists in the room: this is the reality of applied ethics. We do not have the luxury of uncertainty. We must act. We must choose a rule. And we must own the consequences of that rule, even the ones that keep us awake at night. We cannot hide behind the complexity of the debate. We made a choice. We bet on the idea that how we treat the individual matters more than the sum of the outcomes.

  To the recipients: You are here because the lottery favored you. You know that your survival is not a reward for merit. It is not a sign that you were more deserving than the person who died waiting. It is a gift, contingent on chance. I ask you to carry that knowledge not as guilt, but as a recognition of the fragility of the system that saved you. You are living proof that the network believes every life is worth the gamble.

  To the donor families: You gave without condition. You trusted us to distribute your gift fairly. We have tried to do that not by calculating the best return on investment, but by honoring the dignity of every recipient.

  We are five years into this experiment. The data will continue to be analyzed. The debate will continue in the literature. But for this network, the policy stands.

  I want to close by returning to the widow I imagined earlier. The woman whose husband died waiting, who might have lived under the old rules.

  I cannot tell her that the system worked. For her, it failed.

  But I can tell her this: We did not decide that her husband mattered less. We did not decide that his years were worth fewer minutes than someone else's. We decided that his life was so singular, so complete, that we could not justify trading it away to save others.

  We failed to save him. But we refused to devalue him.

  That is the promise of this policy. It is not a promise of survival. We cannot promise that. It is a promise that when you come to us, you are not a number in a sum. You are a person with a claim to life that stands on its own.

  We will continue to refine the medical thresholds. We will continue to improve the matching. But we will not return to a system that asks us to count heads to decide who is worth saving.

  Thank you for your trust, thank you for your grief, and thank you for your lives. We will carry this responsibility with the humility it demands.
