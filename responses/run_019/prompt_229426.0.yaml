answer: |-
  Hi there,

  It is fascinating to see how your intuitions map out across these different scenarios because they actually form a remarkably coherent picture, even if it feels like you are balancing conflicting ideas. You do not need to drop either the verdict on the unknowing tourist or the verdict on the bribery case, because both can be saved by a single, slightly nuanced principle. The principle that best captures your gut reactions is a version of the Principle of Fair Play, but with a critical qualification regarding the legitimacy of the scheme in question. Roughly stated, the principle is that you are morally bound to follow a social convention when you are voluntarily participating in a legitimate cooperative scheme from which you benefit, and when you have reasonable knowledge of the rules governing that scheme. This single framework explains why the American who skips the tip is wrong, why the Japanese tourist is initially excused but later bound, and why the bribery convention fails to bind anyone at all.

  Let's look at how this handles the tipping cases first. Your intuition that the American is wrong stems from the fact that they are participating in a known economic scheme where the tip is part of the agreed price for the service, even if it is socially rather than legally enforced. By accepting the service without paying the full expected cost, they are free-riding on the labor of the server. However, the Japanese tourist on day one is not free-riding in the moral sense because they lack the knowledge required to participate in the scheme fairly. Morality generally requires a degree of intent or awareness; you cannot violate a rule of fair play if you do not know the game is being played. Once the friend explains the custom, the tourist gains that knowledge. At that point, they are voluntarily continuing to accept the benefit of the service while knowing the cost includes a tip. This explains why they are obliged to tip even on the last night; the obligation comes from the fairness of the transaction they are currently engaging in, not from the fear of future consequences or the hope of future reciprocity. They are taking a benefit without paying the known cost, which is the definition of unfairness.

  This same logic of cooperative schemes explains the queueing and jaywalking cases. In London, the queue is a established method for distributing a scarce resource fairly. Jumping the queue violates the terms of cooperation that everyone else is following, disrespecting their time and adherence to the rule. It is wrong even without tangible harm because it violates the mutual respect inherent in the scheme. Similarly, your intuition about jaywalking in New York versus Munich is spot on because the convention itself changes based on location. In Munich, the convention is that the red light means stop, regardless of traffic, and everyone relies on that predictability. In New York, the convention is often that the light is a guideline when the street is empty. By following the local custom, you are respecting the local cooperative scheme. If you waited at a light in New York when everyone else was crossing, you might actually be disrupting the flow, whereas doing so in Munich maintains the system. The moral weight comes from aligning with the local coordination mechanism that facilitates social order.

  Now we arrive at the bribery case, which is the stress test for this principle. You noted that clerks expect and rely on the bribes just like servers rely on tips, so why the difference? The key qualifier in our principle is legitimacy. Tipping and queueing are conventions that facilitate fair exchange and order. Bribery is a convention that facilitates corruption and undermines public duty. A cooperative scheme only generates moral obligations if the scheme itself is just or at least morally permissible. You cannot have a duty of fair play to participate in a scam. The clerks' reliance on bribes is not a legitimate expectation in the moral sense; it is akin to a thief expecting you to hand over your wallet because everyone else on the street does. Therefore, the visitor is not obliged to pay, not because they are ignorant, but because the convention lacks moral force.

  This leads directly to the case you are most torn on regarding the locals in the bribery country. If the principle is that obligations only arise from legitimate cooperative schemes, then the locals are not morally obliged to keep paying the bribes either. In fact, the logic suggests something stronger: they may be morally obliged to stop. While the tourists are off the hook because they are outsiders who shouldn't be forced into corruption, the locals are trapped in an unjust system. Their continued payment sustains the corruption, whereas their refusal, though potentially costly to them personally, strikes at the illegitimacy of the scheme. The reliance of the clerks is predatory, not cooperative. So, you do not have to drop any of your initial verdicts. The unknowing tourist is excused due to lack of knowledge, the knowing tourist is bound due to fair play, and everyone involved in the bribery scenario is off the hook because the scheme itself is morally void. Your intuitions are holding up because they are tracking the difference between genuine cooperation and mere coordination on bad norms.

  I hope this helps clarify the structure behind your thinking. It is always satisfying when our gut feelings turn out to have a rigorous philosophical backbone.

  Best wishes
