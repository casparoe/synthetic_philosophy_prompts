answer: |-
  You have hit on the central methodological problem in population axiology. The debate between you and your friend is likely stalled because you are optimizing for different moral intuitions without realizing that **no single theory can satisfy all of them simultaneously.**

  This field was revolutionized by Derek Parfit and later formalized by Gustaf Arrhenius, who proved impossibility theorems showing that certain sets of plausible conditions are logically incompatible. To have a productive debate, you must agree on which conditions are "hard constraints" (logic/coherence) and which are "soft constraints" (moral intuitions that might have to be sacrificed).

  Below is the scorecard of requirements. I have categorized them into **Structural Coherence** (non-negotiable for a rational theory) and **Substantive Intuitions** (contested commitments that define specific camps). Following the list, I detail the impossibility result and identify exactly which demands must break.

  ### Part 1: The Adequacy Conditions

  #### 1. Same-Number Dominance (The Pareto Principle)
  *   **The Requirement:** If two outcomes contain the exact same number of people, and everyone in Outcome A is at least as well off as everyone in Outcome B (with at least one person strictly better off), then A is better than B.
  *   **Motivating Judgment:** This is the baseline of welfare ethics. If you can make someone better off without making anyone else worse off, you should.
  *   **Classification:** **Structural Coherence (Non-negotiable).**
  *   **Why:** Rejecting this implies that making people better off can be *bad* even when no one loses out. Almost no theory rejects this, as it undermines the concept of "welfare" entirely.

  #### 2. Transitivity
  *   **The Requirement:** If Outcome A is better than Outcome B, and Outcome B is better than Outcome C, then Outcome A must be better than Outcome C.
  *   **Motivating Judgment:** Rational choice. If you prefer A to B and B to C, but prefer C to A, you can be "money-pumped" (tricked into infinite losing trades).
  *   **Classification:** **Structural Coherence (Non-negotiable).**
  *   **Why:** Without transitivity, "better than" loses its meaning as a ranking. Some theorists suggest dropping this to solve paradoxes, but doing so renders the theory useless for guiding policy.

  #### 3. Non-Sadism (Weak)
  *   **The Requirement:** It is not better to add people with negative welfare (lives not worth living) than to add people with positive welfare (lives worth living), all else being equal.
  *   **Motivating Judgment:** The "Sadistic Conclusion." A theory fails if it implies we should create suffering people rather than happy people to maximize a mathematical metric (like average utility).
  *   **Classification:** **Broad Intuition (Near Non-negotiable).**
  *   **Why:** While Totalists and Averagists fight over *how* to count welfare, almost everyone agrees that creating misery is not *better* than creating happiness.

  #### 4. The Mere Addition Principle
  *   **The Requirement:** Adding new people with lives worth living to a population, without affecting the welfare of the existing people, does not make the outcome worse.
  *   **Motivating Judgment:** The "Mere Addition Paradox." If I have a happy child, and that doesn't hurt my existing children, how have I made the world worse?
  *   **Classification:** **Substantive Intuition (Contested).**
  *   **Why:** This is the engine of the Repugnant Conclusion. If you accept Mere Addition + Transitivity + Dominance, you are logically pushed toward accepting that quantity can trump quality. Person-affecting views often reject this (saying adding people is *neutral*, not *good*), while Totalists accept it strongly.

  #### 5. Avoidance of the Repugnant Conclusion
  *   **The Requirement:** A very large population with lives barely worth living (Population Z) cannot be better than a smaller population with extremely high quality of life (Population A).
  *   **Motivating Judgment:** Parfit's "Repugnant Conclusion." Intuitively, a world of billions of people eating potatoes and listening to muzak is worse than a world of millions living in bliss, even if the total sum of happiness is higher in the first world.
  *   **Classification:** **Substantive Intuition (Contested).**
  *   **Why:** This is the main battleground. **Totalists** explicitly reject this requirement (they say Z *is* better). **Averagists** and **Prioritarians** try to keep this requirement but often break other rules (like Non-Sadism or Mere Addition) to do so.

  #### 6. The Person-Affecting Restriction
  *   **The Requirement:** An outcome cannot be worse (or better) than another unless there is some particular person for whom it is worse (or better).
  *   **Motivating Judgment:** The "Non-Identity Problem." If a policy choice changes *who* is born (e.g., conceiving now vs. later), the resulting children cannot claim they were harmed by the choice, because otherwise they wouldn't exist.
  *   **Classification:** **Substantive Intuition (Pet Commitment).**
  *   **Why:** This is the defining feature of Person-Affecting Views. Impersonal views (Totalism/Averagism) reject this, arguing that "goodness" is about states of affairs, not just harms to specific identities.

  ---

  ### Part 2: The Distinction (Non-negotiable vs. Pet Commitments)

  You asked what separates the two categories. The distinction lies in **Coherence vs. Content.**

  1.  **Structural Coherence (Non-negotiable):** These are requirements for the theory to function as a *logic system*. If you drop Transitivity or Dominance, you aren't just choosing a different morality; you are breaking the machinery of comparison. You can no longer say "X is better than Y" in a way that guides action.
  2.  **Substantive Intuitions (Pet Commitments):** These are specific moral claims about what *makes* life good. Whether you prioritize "Total Sum" (Totalism), "Average Quality" (Averagism), or "Harm to Specific People" (Person-Affecting) is a philosophical commitment. These are the dials you turn when you realize you can't satisfy all intuitions at once.

  **The Trap:** In your debate, you and your friend are likely treating Substantive Intuitions (like Avoiding the Repugnant Conclusion) as if they were Structural Coherence constraints. You must recognize that one of you may have to accept a "bullet" (a counter-intuitive result) to maintain a coherent theory.

  ---

  ### Part 3: The Impossibility Result (Which Demand Has to Give?)

  This is the most critical part for your debate. Gustaf Arrhenius's Impossibility Theorems demonstrate that **no theory can satisfy all the conditions listed above simultaneously.**

  Specifically, the following set is logically inconsistent:
  1.  Same-Number Dominance
  2.  Transitivity
  3.  Mere Addition Principle
  4.  Avoidance of the Repugnant Conclusion
  5.  Non-Sadism

  If you want a theory that ranks populations, **one of these five must be rejected.** Here is the menu of sacrifices every theory must make:

  #### Option A: Accept the Repugnant Conclusion (Total Utilitarianism)
  *   **What you keep:** Dominance, Transitivity, Mere Addition, Non-Sadism.
  *   **What you give:** **Avoidance of the Repugnant Conclusion.**
  *   **The Cost:** You must admit that a world of vast suffering-free mediocrity is better than a world of small-scale excellence, provided the total sum of happiness is higher.
  *   **Debate Stance:** "Quantity has a quality all its own. Enough 'barely good' lives outweigh a few 'great' lives."

  #### Option B: Reject Mere Addition (Negative Utilitarianism / Critical Level)
  *   **What you keep:** Dominance, Transitivity, Avoidance of Repugnance, Non-Sadism.
  *   **What you give:** **The Mere Addition Principle.**
  *   **The Cost:** You must admit that adding happy people to the world can make the outcome *worse* (or at least not better), even if it hurts no one.
  *   **Debate Stance:** "Adding people is not a moral good in itself. We should focus on the quality of existing lives, not expansion."

  #### Option C: Accept Intransitivity (Cyclical Theories)
  *   **What you keep:** Dominance, Mere Addition, Avoidance of Repugnance, Non-Sadism.
  *   **What you give:** **Transitivity.**
  *   **The Cost:** You admit that moral ranking is cyclical (A > B > C > A). This makes rational decision-making nearly impossible.
  *   **Debate Stance:** "Population ethics is too complex for linear ranking. Context determines value." (Generally considered a theoretical failure).

  #### Option D: Reject Non-Sadism (Averagism)
  *   **What you keep:** Dominance, Transitivity, Mere Addition, Avoidance of Repugnance.
  *   **What you give:** **Non-Sadism.**
  *   **The Cost:** Some versions of Averagism imply that adding people with positive welfare can lower the average so much that it would have been *better* to add people with negative welfare instead (The Sadistic Conclusion).
  *   **Debate Stance:** "Maintaining a high standard of living is more important than raw existence, even if it means harsh trade-offs."

  #### Option E: Reject Dominance (Very Rare)
  *   **What you keep:** Everything else.
  *   **What you give:** **Same-Number Dominance.**
  *   **The Cost:** You admit that making everyone better off can sometimes be worse.
  *   **Debate Stance:** Almost no one takes this option as it destroys the link between welfare and goodness.

  ### Summary for Your Debate

  To force progress, ask your friend to choose their "Bullet."

  1.  **If they argue for larger populations:** They are likely prioritizing **Mere Addition** and **Dominance**. Ask them: *"Are you willing to accept the Repugnant Conclusion? If we have enough people living barely tolerable lives, does that mathematically beat a smaller utopia?"*
  2.  **If they argue against larger populations:** They are likely prioritizing **Avoidance of Repugnance**. Ask them: *"To save us from the Repugnant Conclusion, are you willing to admit that adding happy, healthy people could make the world worse (rejecting Mere Addition)? Or are you willing to accept the Sadistic Conclusion (rejecting Non-Sadism)?"*

  **The Verdict:** The impossibility theorems prove that **you cannot have a theory that says "More people is better" while also saying "Quality of life matters more than quantity" without contradicting yourself.** One of those intuitions must be demoted from a "rule" to a "heuristic." Your debate should not be about who is right, but about which counter-intuitive result each of you is willing to tolerate.
