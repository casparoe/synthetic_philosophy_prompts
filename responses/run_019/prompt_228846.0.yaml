answer: |-
  # PREP SHEET: DISSERTATION CHAPTER TALK
  **Topic:** The New Riddle of Induction & Test-Procedure Relativization
  **Time:** 40 mins Q&A
  **Stakes:** High (Central Chapter, Department Seminar)

  ## I. HONEST ASSESSMENT: THE WEAKER LINK
  **The "Theoretical Grue" Critique (against Natural Kinds) is the weaker link.**
  *   **Why:** A sophisticated metaphysician can bite the bullet and say, "Fine, 'grue charge' isn't a natural kind *because* natural kinds must be time-invariant." They will argue that time-indexing is *constitutive* of unnaturalness. Your argument assumes naturalness is about *intrinsic properties* independent of temporal indexing, but many neo-Aristotelians or Humeans about laws define naturalness precisely to exclude time-dependent gerrymanders.
  *   **Strategy:** Do not die on this hill. Use this argument to motivate the need for your positive view, but be ready to concede that natural kinds *might* rule out grue-charge *if* we already know the laws. Your point is that induction is needed *to find* the laws, so we can't rely on law-defined naturalness to solve the riddle of induction.
  *   **The Stronger Link:** The **Test-Procedure Positive Account**. This is your original contribution. It faces the circularity charge, but it offers a tangible epistemic mechanism. Protect this core.

  ---

  ## II. KEY OBJECTIONS (IN EXPECTED ORDER)

  ### 1. The Goodman Scholar (Exegetical/Historical)
  **The Objection:**
  "You're treating the New Riddle as a problem waiting for a solution, but Goodman's point in *Fact, Fiction, and Forecast* was that confirmation is *irreducibly* relative to a conceptual scheme. By proposing 'test procedures' as a ground, you're just offering a new vocabulary to relativize to. You haven't solved the relativity; you've just relocated it from 'entrenched predicates' to 'accepted testing practices.' Isn't this exactly the language-relativity Goodman said we had to accept, rather than cure?"

  *   **Damage:** High. Undermines the novelty of your positive proposal.
  *   **Concede:** Goodman is right that there is no *absolute*, scheme-independent justification for induction.
  *   **Hold:** There is a difference between *linguistic* relativity (entrenchment) and *practical* relativity (causal interaction).
  *   **Reply (2 mins):**
      "Goodman is right that there is no 'view from nowhere' for induction. But there is a crucial difference between relativizing to *language* (entrenchment) and relativizing to *practice* (testing). Entrenchment is historical and accidental; test procedures are causal and constraint-based.
      My claim isn't that we escape relativity, but that we ground it in something more stable than usage. A test procedure is a physical interaction with the world, not just a linguistic habit. If 'grue' fails, it's not because we haven't said the word enough, but because the physical setup required to test 'green before $t$' is distinct from the setup to test 'blue after $t$.' That's an epistemic constraint, not just a linguistic one. I'm accepting Goodman's anti-foundationalism but rejecting his linguistic idealism."
  *   **Soft Spot:** You must be able to cash out "physical interaction" without smuggling in projectible predicates (see Circularity below).

  ### 2. The Metaphysician (Natural Kinds Defender)
  **The Objection:**
  "You argue that 'grue charge' defeats the natural kinds reply because theoretical terms can be grue-ified. But natural kinds aren't just about predicates; they're about *laws*. A property that switches behavior at time $t$ without a causal mechanism is, by definition, not a natural kind. Your 'grue charge' violates the principle of temporal uniformity inherent in lawhood. So the natural kinds reply *does* work, provided we understand naturalness as law-governed, not just lexical."

  *   **Damage:** Medium-High. Threatens the motivation for your positive view.
  *   **Concede:** If we *already know* the laws, grue-charge is ruled out.
  *   **Hold:** Induction is prior to knowing the laws. We need projectibility to *discover* which kinds are natural.
  *   **Reply (2 mins):**
      "I agree that 'grue charge' is not a natural kind *in our actual world*. But the New Riddle is about how we *identify* natural kinds in the first place. If naturalness is defined by lawhood, and lawhood is established by induction, you cannot use naturalness to solve the riddle of induction without circularity.
      My 'grue charge' example shows that syntax alone doesn't rule out the predicate. We need an epistemic filter *before* we confirm the laws. Test procedures provide that filter. We rule out 'grue charge' not because we know it violates laws, but because we lack a single experimental setup that can verify charge across the time boundary $t$. The epistemology of testing must precede the metaphysics of kinds."
  *   **Soft Spot:** If they press that "laws" are known a priori or via inference to the best explanation (IBE) that already assumes naturalness, you need to insist IBE relies on the very projectibility you're analyzing.

  ### 3. The Bayesians (Formal Epistemologists)
  **The Objection:**
  "This seems like unnecessary metaphysics. In a Bayesian framework, 'grue' hypotheses just receive low prior probabilities because they are complex/gerrymandered. As evidence comes in, the posterior for 'green' dominates. Why do we need a non-formal account of 'test procedures'? Doesn't your account just describe what the likelihood functions are already doing mathematically?"

  *   **Damage:** Medium. Makes your project look like a re-description of standard formalism.
  *   **Concede:** Bayesians can model the *result* of the exclusion.
  *   **Hold:** Bayesians cannot justify the *priors* without your account.
  *   **Reply (2 mins):**
      "Bayesianism can model the *consequence* of ruling out grue, but it cannot justify the *prior assignment* without begging the question. If you say 'grue gets a low prior because it's gerrymandered,' you need an account of what counts as gerrymandering.
      My test-procedure account provides the objective ground for those priors. A hypothesis gets a low prior *because* it requires disjoint test procedures across time $t$. The formalism handles the updating; my account explains why the starting distribution isn't arbitrary. You're treating the priors as the input; I'm explaining where the inputs come from."
  *   **Soft Spot:** They may argue that 'simplicity' in priors is primitive. You must insist simplicity is derived from testability.

  ---

  ## III. THE HARD SPECIFICS

  ### A. The Circularity Worry
  **The Worry:** "To define a 'uniform test procedure,' don't you have to use predicates that are themselves projectible? If I describe the apparatus using 'grue' terms, the test looks uniform. Haven't you just pushed the grue problem back to the description of the test?"

  *   **Damage:** Critical. If this lands, the positive account collapses.
  *   **Strategy:** Distinguish between *describing* the test and *performing* the test.
  *   **Reply:**
      "This is the most important objection. My response is to distinguish linguistic description from causal capacity. A test procedure is a causal interaction—a pointer moving, a click occurring.
      While I can *describe* that interaction using 'grue' language, the *causal structure* of the interaction remains invariant or not. If the mechanism required to detect 'green' before $t$ physically differs from the mechanism required after $t$ (e.g., different calibration, different interaction type), then the procedure is not uniform, regardless of how I describe it.
      I am not defining projectibility via predicates; I am defining it via the stability of the measurement interaction. The circularity is avoided because the 'uniformity' is a matter of physical continuity, not linguistic consistency."
  *   **Soft Spot:** You must be prepared to give an example where the physical continuity is clear. (e.g., A scale measures mass the same way tomorrow; a 'grue-scale' would require recalibration at $t$ without physical cause).

  ### B. The Language-Relativity Worry (Goodman Scholar Follow-up)
  **The Worry:** "If test procedures are 'physical,' how do we individuate them? Isn't individuating a 'procedure' just as language-relative as individuating a 'kind'?"

  *   **Reply:**
      "Individuation is constrained by causal breakdown. If a machine stops working at $t$ and requires a new part to function, that is a physical break in the procedure, not just a linguistic one. We can agree on the breakdown even if we describe it differently. Goodman's relativity was about *meaning*; mine is about *method*. Science can tolerate meaning variance, but it cannot tolerate methodological discontinuity without losing predictive power."

  ---

  ## IV. THE QUESTION YOU HOPE NOBODY ASKS
  **"If projectibility is relative to test procedures, what happens when technology changes? If we invent a new device at time $t$ that *can* test 'grue' uniformly, does 'grue' suddenly become projectible? If so, isn't projectibility just a function of our current technological limitations, not a feature of the world or logic?"**

  *   **Why it's dangerous:** It makes your account instrumentalist and contingent. It suggests 'green' is only projectible because we haven't built the 'grue-meter' yet.
  *   **Prep for this:**
      *   *Response:* "No. A 'grue-meter' would have to detect a physical difference at $t$ without a causal trigger. If such a device existed, it would imply a physical law changing at $t$. If the law changes, induction is indeed impossible *across* that boundary. My account doesn't say grue becomes projectible; it says if a uniform test exists, the property isn't truly 'grue' (time-indexed without cause), it's a disjunction of two natural properties. The impossibility is in the physics, not the technology."

  ---

  ## V. STRATEGIC ADVICE FOR THE SESSION
  1.  **Manage the Metaphysician Early:** If they attack the "Theoretical Grue" point hard in the first 10 minutes, concede the metaphysical point quickly ("I agree natural kinds likely exclude time-indexing") and pivot to the epistemic priority ("But we need induction to find those kinds"). Do not let the talk become a debate about the definition of natural kinds.
  2.  **Don't Alienate the Bayesians:** Acknowledge their formalism is correct *as far as it goes*. Position your view as the "philosophical foundation" for their priors, not a competitor to their math.
  3.  **Watch the Clock:** The Goodman Scholar will want to debate history. Politely bracket exegetical questions ("That's a fascinating reading ofFFF, but for this project I'm treating the riddle as a live epistemic problem...").
  4.  **Tone:** You are proposing a *dissolution* of the metaphysical mystery into an epistemic constraint. Sound confident that the "mystery" of grue is actually just a confusion about measurement.

  **Good luck. This is a solid chapter, but the circularity objection is the one that will keep you up at night. Prepare your "causal interaction" examples carefully.**
