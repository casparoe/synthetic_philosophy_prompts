      *   **Role:** Philosophy of mind professor experienced with teaching scientists.
      *   **Task:** Create a 40-minute lesson plan on Ned Block's Access vs. Phenomenal Consciousness (A/P) and its connection to Global Workspace Theory (GWT).
      *   **Audience:** Small interdisciplinary reading group (neuroscience postdocs, linguist, computer scientist, user). Smart, zero philosophy background.
      *   **Goal:** Explain the distinction, connect to GWT, correct misconceptions (GWT = all of consciousness), provide a concrete example, anticipate misconceptions, suggest a closing exercise, and define boundaries (what to avoid).
      *   **Constraints:** Under 600 words. Sketch two orderings first, then commit to the better one.

  2.  **Drafting - Step 1: Consider Orderings:**
      *   *Ordering A (Definition First):* Define A and P -> Give Example -> Connect to GWT -> Discuss Misconceptions -> Exercise.
      *   *Ordering B (Phenomenology First):* Start with the "what it's like" (P) -> Introduce the functional role (A) -> Show they can come apart (Example) -> Connect to GWT (as A-theory) -> Exercise.
      *   *Evaluation:* Ordering B is better for scientists. Starting with abstract definitions bores them. Starting with the *experience* (phenomenology) grounds it in their data (neuroscience/linguistics). Then introducing the functional limit (access) makes the distinction empirical rather than purely conceptual.

  3.  **Drafting - Step 2: Develop the Plan (incorporating constraints):**
      *   *Example:* Sperling's iconic memory task is better than the fridge light. Fridge light is about existence when unobserved; Sperling is about capacity limits vs. experience. It fits neuro/comp sci minds.
      *   *Misconceptions:* "Access = Attention", "P = Vividness", "GWT explains P", "Unfalsifiable".
      *   *Boundaries:* Hard Problem, HOT, Overflow evidence details.
      *   *Exercise:* Something testing the dissociation.

