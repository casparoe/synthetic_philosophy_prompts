      *   *Sketch:*
          1.  Order A: Define -> Example -> GWT. Risk: Too abstract.
          2.  Order B: Experience -> Function -> Dissociation -> GWT. Risk: Needs careful framing.
          *Decision:* Go with B. It mirrors the scientific method (observe phenomenon, measure function).

