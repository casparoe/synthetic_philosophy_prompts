          *   **GWT Connection (10 mins):** GWT explains A (global broadcasting). It does *not* necessarily explain P. Block says GWT is a theory of A, not P.
          *   **Misconceptions (10 mins):** Address "GWT explains P" (category error). Address "Unfalsifiable" (we look for dissociations, like blindsight or sperling).
          *   **Exercise (5 mins):** "The Masked Prime." Show subliminal image. Did it affect behavior (Access-ish)? Did it feel like anything (P)? Wait, better: Ask them to design an experiment where A and P dissociate.
          *   **Boundaries:** Hard Problem (metaphysical, we're doing conceptual/empirical), HOT (too layered), Overflow evidence details (too technical).

