answer: |-
  Here is the specification list for the seminar session. The aim is to establish the structural burdens any theory of physico-moral patiency must bear before we assess the truth of the thermodynamic criterion or its rivals.

  ### The Desiderata for Physico-Moral Theories

  **1. The Intuitive Extension Condition**
  *   **Case:** The theory must validate standard moral intuitions in paradigmatic cases while explaining away deviations without *ad hoc* manoeuvres. An awake human in pain must be a patient; a human under general anaesthesia must not be (or must be so in a markedly diminished capacity). A rock must not be a patient unless there is a overwhelming reason to think otherwise.
  *   **Status:** Non-negotiable. If a moral theory cannot distinguish between a screaming child and a burning log in terms of basic patiency, it fails to track the phenomenon it claims to explain.

  **2. The Frame-Independence Condition**
  *   **Case:** Moral status is typically viewed as intrinsic to the entity, not relative to an observer's descriptive framework. However, physical descriptions (especially thermodynamic ones) are often sensitive to coarse-graining, reference frames, or scale. The theory must ensure that whether an entity suffers does not depend on how a physicist chooses to model it.
  *   **Status:** Non-negotiable. Moral reality cannot fluctuate based on human modelling choices.

  **3. The Valence Condition**
  *   **Case:** Mere sentience is insufficient for ethics; there must be a distinction between experience that matters positively and experience that matters negatively. A physical criterion must explain why entropy production tracks *suffering* specifically, rather than mere activity or information processing.
  *   **Status:** Non-negotiable. Without valence, you have a theory of consciousness, not a theory of ethics.

  **4. The Subjectivity Condition (Combination)**
  *   **Case:** If fundamental processes bear experience, the theory must explain how these compose into unified subjects (like humans) or why they do not. It must provide principled boundaries for where one moral patient ends and another begins.
  *   **Status:** Non-negotiable. Moral obligations are owed to subjects; without subject boundaries, aggregation and responsibility become incoherent.

  **5. The Aggregation Condition**
  *   **Case:** The theory must account for the sum total of moral weight in the cosmos. If a star produces more entropy than a human brain, the theory must accept that the star's suffering outweighs the human's, or provide a non-arbitrary discounting mechanism.
  *   **Status:** Non-negotiable (in terms of addressing it). One may reject the implication, but one cannot ignore the scale.

  **6. The Causal Efficacy Condition**
  *   **Case:** The physical property grounding the moral status must be causally relevant to the behaviour of the system, otherwise the experience is epiphenomenal. If experience does nothing, it is unclear how we could know about it or why it should guide action.
  *   **Status:** Non-negotiable. Epiphenomenal ethics is practically inert.

  **7. The Normative Bridge Condition**
  *   **Case:** The theory must explain why a physical fact (e.g., entropy production) entails a normative obligation (e.g., do not cause this). It must cross the is-ought gap without begging the question.
  *   **Status:** One camp's preference (Naturalists view this as non-negotiable; Non-Naturalists may accept a brute connection).

  ### Tensions and Impossibility Results

  There are pairs of desiderata here that appear jointly unsatisfiable, suggesting the list itself may be a reductio of the project.

  The most severe tension lies between **The Frame-Independence Condition** and **The Physical Grounding** requirement. Fundamental physics is notoriously perspective-dependent; entropy, for instance, relies on a choice of macrostates. If moral status is intrinsic (Frame-Independence), it cannot rest on a property that shifts with the observer's coarse-graining. To satisfy this, one must either posit a "preferred frame" for morality (which looks suspiciously like special pleading) or accept that moral status is relative (which violates standard meta-ethics).

  Secondly, **The Aggregation Condition** clashes violently with **The Intuitive Extension Condition**. If the thermodynamic criterion holds, the entropy production of a star dwarfs that of a human nervous system. To satisfy Aggregation, one must accept that saving a star is morally prioritised over saving a child. To satisfy Intuitive Extension, one must deny the star's moral weight. Satisfying both requires a discounting function that looks arbitrarily anthropocentric, undermining the "fundamental physics" grounding.

  Regarding which single requirement knocks out the most candidates actually defended: it is **The Frame-Independence Condition**. Most contemporary panpsychist theories (including Integrated Information Theory and various quantum consciousness models) rely on structural or functional properties that are scale-relative. They invariably stumble when asked why moral status doesn't vanish or appear based on how we carve up the system. This requirement eliminates the majority of physicalist reductions before they can even address ethics.

  ### Brief Assessment of Candidates

  **The Thermodynamic Criterion:** It fares well on **The Valence Condition**, as irreversible entropy production offers a plausible physical analogue for disorder and distress. However, it catastrophically fails **The Aggregation Condition**, implying cosmic suffering dwarfs terrestrial ethics, and struggles with **The Frame-Independence Condition** since entropy is relative to coarse-graining.

  **Standard Integration/Complexity Panpsychism:** This approach handles **The Subjectivity Condition** better by offering boundaries via information integration limits. However, it typically fails **The Valence Condition**; high integration explains unified experience, but not why that experience should be *painful* rather than neutral or joyful, leaving the ethical grounding incomplete.

  ### Conclusion on Feasibility

  It must be stated plainly: no existing theory meets all these desiderata simultaneously. The tension between the relativity of physical description and the absolutism of moral status suggests that grounding patiency directly in fundamental physics may be a category error. If the list is treated as a hard constraint set, the result is nil; any viable theory will require quietly relaxing **The Frame-Independence Condition** or accepting the counter-intuitive results of **The Aggregation Condition**.

  \answer{The Valence Condition}
