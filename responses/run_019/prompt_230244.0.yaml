      *   *The Cost:* You have to accept that intuitions are fallible and require calibration (reflective equilibrium). You can't treat them as atomic data points. You have to do the hard work of explaining *why* the framing matters.
      *   *British English Check:*
          *   "Analyze" -> "Analyse"
          *   "Color" -> "Colour"
          *   "Defense" -> "Defence"
          *   "Program" -> "Programme" (unless computing)
