prompt: |-
  I started as a program officer at a family foundation six months ago, and the same fight keeps happening in our grant meetings. We make maybe thirty or forty grants a year, mostly $25k to $200k, in global health and farmed animal welfare. A proposal will have a clear, well-evidenced near-term benefit: bednets in a malarial region, or better water quality on a salmon farm. Then somebody raises the long-run ripple effects. The bednet program could cut childhood mortality and thereby shift population growth, labor markets, and migration over the next thirty years, and we can't even sign those effects. The salmon-farm work could lower the price of farmed fish, shift consumer demand, and expand or contract total aquaculture over decades, and we have no idea whether its good or bad on net. A board member has started calling this cluelessness and says it means we should stop pretending we can compare total consequences and just fund whatever has the best measurable near-term outcomes. Another staff member says that's giving up and smuggling in a preference for the near term.

  I gather philosophers call this issue consequentialist cluelessness. I don't need a literature review or citations; I need a working procedure. Please write a decision procedure my program staff can run on each proposal in about twenty minutes, without philosophy backgrounds. It should include: the questions to ask in order and what counts as a good-enough answer before moving on; how to tell when we're in a situation where we can at least bound the far-future effects versus one where we can't guess the sign, and what to do differently in each; where the procedure should default to near-term measurable outcomes and where it shouldn't; and which steps are really value judgments dressed up as analysis, so we flag those for the board instead of pretending the checklist decided them. Then run the procedure on two proposals: (1) a bednet distribution program with good evidence on short-term mortality reduction but unknown demographic knock-ons over thirty years, and (2) a corporate cage-free egg campaign that, if it succeeds, could change the economics of egg farming in ways that might either improve or worsen long-run aggregate farmed-animal welfare depending on factors we can't observe. Finally, say honestly where the procedure will let us down.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Program Officer at a family foundation (6 months tenure).
      *   **Context:** Grant meetings (30-40 grants/year, $25k-$200k), focus on Global Health and Farmed Animal Welfare.
      *   **Problem:** Recurring conflict over "consequentialist cluelessness" (near-term measurable benefits vs. unknown long-term ripple effects).
      *   **Stakeholders:**
          *   Board Member A: "Cluelessness means we should just fund best near-term outcomes."
          *   Staff Member B: "That's giving up and biasing towards the near term."
      *   **Task:** Create a 20-minute decision procedure for program staff.
      *   **Requirements:**
          *   No philosophy jargon/literature review.
          *   Specific questions in order.
          *   Criteria for "good enough" answers.
          *   Distinction between "bounded effects" vs. "unknown sign."
          *   Defaults (when to use near-term vs. when not to).
          *   Flagging value judgments vs. analysis.
          *   Apply procedure to two specific cases (Bednets, Cage-Free Campaign).
          *   Honest limitation assessment.

  2.  **Deconstruct the Core Conflict:**
      *   The tension is between *Expected Value Maximization* (trying to account for everything) and *Tractability/Epistemic Humility* (admitting we don't know).
      *   The "Cluelessness" argument suggests that if long-term effects are unknowable, they should be ignored or treated as noise.
      *   The "Giving Up" argument suggests ignoring long-term effects is a value judgment (prioritizing the present) disguised as epistemic modesty.
      *   *Solution Strategy:* A triage system. Most grants shouldn't require deep long-term forecasting. Only specific types of interventions trigger the "long-term risk" flag. The procedure needs to separate *empirical uncertainty* from *value weighting*.

  3.  **Drafting the Decision Procedure (The "20-Minute Triage"):**
      *   *Goal:* Keep it practical. 20 minutes means ~4-5 steps, 4-5 minutes each.
      *   *Step 1: The Near-Term Baseline.* Establish the solid ground. What do we *know*?
      *   *Step 2: The Sign Check.* Can we guess the direction of long-term effects? (Positive, Negative, or Zero/Unknown).
      *   *Step 3: The Magnitude/Bound Check.* If the sign is unknown, can we bound the harm? Is there a catastrophic downside?
      *   *Step 4: The Reversibility/Option Value.* Can we undo this? Does this learn something for later?
      *   *Step 5: The Value Flag.* Explicitly state where the board needs to weigh in.

      *Refining the "Bounded vs. Unbounded" distinction:*
      *   *Bounded:* We don't know the exact number, but we know it won't be worse than X (e.g., won't cause extinction).
      *   *Unbounded/Unknown Sign:* We don't know if it's net good or net bad (e.g., population changes affecting total welfare).

      *Refining the "Default":*
      *   Default to near-term *unless* there is a credible mechanism for significant long-term harm (negative sign) or the intervention is structural/systemic rather than direct aid.

  4.  **Developing the Test Cases:**

      *   *Case 1: Bednets.*
          *   Near-term: High confidence, positive (lives saved).
          *   Long-term: Population growth, migration. Sign unknown (more people = more welfare? more suffering?).
          *   Application: Passes Step 1. Step 2 flags "Unknown Sign." Step 3 asks "Is there catastrophic risk?" (No). Step 4 "Reversible?" (No, but low risk). Decision: Fund based on near-term, flag the population ethics question for the board.

      *   *Case 2: Cage-Free Campaign.*
          *   Near-term: Welfare improvement for existing hens.
          *   Long-term: Economic efficiency, demand shifts, potential expansion of industry. Sign unknown (could increase total suffering if industry grows).
          *   Application: Passes Step 1. Step 2 flags "Unknown Sign." Step 3 "Catastrophic risk?" (Maybe not catastrophic, but systemic). Step 4 "Reversible?" (Hard to undo market shifts). Decision: Higher scrutiny. Might need a "systemic change" override.

      *Wait, I need to make sure the procedure distinguishes these two correctly.* The prompt implies the Bednet case is the classic "cluelessness" example, and the Cage-Free one is the "market feedback" example. The procedure should treat them differently if the risk profile differs.
      *   *Correction:* In EA circles, bednets are often treated as "robustly good" despite population effects because saving a life is intrinsically good regardless of population size (unless one holds specific total utilitarian views). Cage-free is riskier because it might *increase* total animal suffering if demand elasticity is high.
      *   *Procedure Adjustment:* Step 2 needs to ask: "Is there a plausible mechanism where this makes things *worse* on net?"
      *   Bednets: Unlikely to make things *worse* (death is bad).
      *   Cage-Free: Plausible mechanism to make things *worse* (more birds in cages overall).
      *   This distinction is crucial for the "Default" rule.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Set the tone (pragmatic, not philosophical).
      *   **The Procedure (The "Cluelessness Triage"):**
          *   Timebox: 20 mins.
          *   Step 1: Solid Ground (Near-term).
          *   Step 2: The Sign Test (Good, Bad, or Unknown?).
          *   Step 3: The Ceiling/Floor (Bounding).
          *   Step 4: The Value Flag (Board decision).
      *   **Application to Cases:** Walk through Bednets and Cage-Free using the steps.
      *   **Limitations:** Where does this fail? (Black swans, value drift, cumulative effects).

  6.  **Refining the "Value Judgments" Aspect:**
      *   The prompt asks to identify where analysis ends and values begin.
      *   *Key Insight:* Deciding *how much* uncertainty is acceptable is a value judgment. Deciding whether "potential population growth" is a risk or a benefit is a value judgment (person-affecting vs. total utilitarianism).
      *   *Action:* Add a specific "Board Flag" section in the procedure.

  7.  **Review against Constraints:**
      *   20 minutes? Yes, 4 steps.
      *   No philosophy background? Yes, plain English.
      *   Questions in order? Yes.
      *   Good-enough answers? Yes, defined as "plausible mechanism."
      *   Bounded vs. Unknown Sign? Addressed in Step 2 & 3.
      *   Defaults? Addressed in Step 4.
      *   Value Judgments? Flagged explicitly.
      *   Run on two proposals? Yes.
      *   Honest limitations? Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is 20 minutes realistic for a grant meeting?
      *   *Fix:* Frame it as a pre-meeting checklist or a strict agenda item. Let's call it the "Pre-Meeting Triage."
      *   *Critique:* The Bednet case is controversial in EA (longtermism). I need to be careful not to take a side but show how the *procedure* handles it.
      *   *Fix:* The procedure should highlight *why* it's controversial (the value judgment on population) rather than solving the controversy.
      *   *Critique:* Make sure the distinction between "cluelessness" (we don't know) and "risk" (we know it could be bad) is clear.
      *   *Fix:* Step 2 is the Sign Test. If sign is unknown, go to Step 3. If sign is likely positive, proceed.

  9.  **Final Polish:** Check tone. Needs to be professional, empathetic to the staff/board conflict, and actionable. (Ensure the distinction between "unknown magnitude" and "unknown sign" is the pivot point).

  *(Self-Correction on the Cage-Free Case)*: The prompt says "might either improve or worsen long-run aggregate farmed-animal welfare." This is the definition of unknown sign. Bednets also have unknown sign on population ethics (more people = more total welfare or more total suffering?). I need to ensure the procedure treats them consistently but allows for different *defaults* based on the foundation's mandate. Actually, the prompt asks me to decide where the procedure defaults to near-term. I should set the default to "Near-term dominates UNLESS there is a plausible negative long-term mechanism." This favors the Bednet case (no plausible negative mechanism usually) over the Cage-Free case (plausible negative mechanism via expansion).

  Let's write it.cw
answer: |-
  # The "Cluelessness Triage" Procedure
  **Time Required:** 20 Minutes per proposal
  **Goal:** Separate empirical uncertainty from value judgments so the board can vote on values, not guesswork.

  This procedure does not solve the philosophical problem of long-term uncertainty. It manages the risk. It forces the team to agree on *what* we don't know before arguing about *what to do*.

  ### Step 1: The Solid Ground (5 Minutes)
  **Question:** What is the specific, measurable near-term outcome (1–3 years), and how confident are we in the evidence?
  **Good-Enough Answer:** A specific metric (e.g., "5,000 nets distributed," "10% reduction in ammonia") backed by RCTs, pilot data, or strong historical precedent. Confidence must be rated High, Medium, or Low.
  **Stop Condition:** If confidence is "Low" on near-term effects, reject the proposal immediately. Do not pass go. We do not fund speculation.

  ### Step 2: The Sign Test (5 Minutes)
  **Question:** Is there a *plausible mechanism* by which this intervention causes significant long-term harm (negative sign), or is the uncertainty only about the *magnitude* of the good?
  **Good-Enough Answer:**
  *   **Positive/Negative Sign:** "We have reason to think this increases/decreases X in the long run."
  *   **Unknown Sign:** "We can construct a logical story where this ends up net bad, and a logical story where it ends up net good."
  *   **Bounded:** "We don't know the exact number, but we know it won't be catastrophic."
  **Decision Rule:**
  *   If the long-term sign is **Positive or Bounded Positive**: Move to Step 4.
  *   If the long-term sign is **Unknown** (could be net bad): Move to Step 3.

  ### Step 3: The Reversibility & Option Value Check (5 Minutes)
  **Question:** If the long-term effects turn out negative, can we stop or reverse the intervention? Does funding this buy us information that helps future decisions?
  **Good-Enough Answer:**
  *   **Reversible:** "We can stop funding next year; the effect dissipates."
  *   **Irreversible:** "This changes laws, market structures, or demographics permanently."
  *   **High Option Value:** "Even if it fails, we learn crucial data for the field."
  **Decision Rule:**
  *   If **Irreversible** AND **Unknown Sign**: This is a "Red Flag" proposal. It requires Board approval specifically on risk tolerance.
  *   If **Reversible** OR **High Option Value**: Proceed to Step 4, but note the risk.

  ### Step 4: The Value Flag (5 Minutes)
  **Question:** Which part of this decision is a value judgment disguised as analysis?
  **Good-Enough Answer:** A written sentence for the Board Memo.
  **Examples:**
  *   "Choosing this grant assumes saving a life now is more important than potential population changes later."
  *   "Choosing this grant assumes reducing intensity of suffering is more important than the risk of increasing the total number of sufferers."
  **Decision Rule:** If Step 2 or 3 flagged uncertainty, the Staff Recommendation must explicitly state: *"We recommend funding based on near-term outcomes, acknowledging the Board accepts the long-term uncertainty."*

  ---

  # Application to Proposals

  ### Case 1: Bednet Distribution Program
  **Context:** Distributing insecticide-treated nets in a high-malaria region. Evidence shows immediate mortality reduction. Concerns exist about population growth and migration over 30 years.

  *   **Step 1 (Solid Ground):** **Pass.** High confidence. RCTs exist. Metric: Malaria cases averted / lives saved.
  *   **Step 2 (Sign Test):** **Unknown Sign.**
      *   *Mechanism:* Saving children reduces mortality. This may increase population size.
      *   *Conflict:* Is a larger population net good (more happy lives) or net bad (more strain/suffering)? We cannot sign this effect.
      *   *Harm Check:* Is there a plausible mechanism where this causes *catastrophic* harm? Generally, no. It is "Bounded."
  *   **Step 3 (Reversibility):** **Irreversible.** A life saved cannot be "un-saved." However, the program itself is recurring; we can stop distributing nets next year.
  *   **Step 4 (Value Flag):**
      *   *Flag for Board:* "Funding this grant prioritizes the 'Person-Affecting View' (saving specific existing people is good) over 'Total Utilitarianism' (where changing population size complicates the math). We are treating the demographic ripple effects as outside our mandate."
  *   **Recommendation:** **Fund.**
      *   *Why:* The uncertainty is "Bounded." There is no plausible mechanism for *net harm* unless one holds the specific philosophical view that adding lives is inherently negative or resource-strain is catastrophic. The default to near-term outcomes applies here because the long-term risk is theoretical, not mechanistic.

  ### Case 2: Corporate Cage-Free Egg Campaign
  **Context:** Advocacy to get a major retailer to switch to cage-free eggs. Near-term welfare improvement for hens. Concerns that efficiency gains lower prices, increase demand, and expand the total industry, potentially increasing total animal suffering.

  *   **Step 1 (Solid Ground):** **Pass.** Medium-High confidence. We have evidence from other regions that campaigns shift corporate policy. Metric: Number of hens moved to cage-free systems.
  *   **Step 2 (Sign Test):** **Unknown Sign.**
      *   *Mechanism:* Better welfare per bird (Good). Lower costs/higher demand -> more birds bred into existence (Bad, if lives are net negative).
      *   *Conflict:* Unlike bednets, there is a credible economic model where this *increases* total suffering. The sign is genuinely unknown.
  *   **Step 3 (Reversibility):** **Irreversible.** Once supply chains shift and breeding stock changes, it is hard to revert. Market structures are sticky.
      *   *Option Value:* Medium. We learn about elasticity of demand, but the intervention itself locks in a market shift.
  *   **Step 4 (Value Flag):**
      *   *Flag for Board:* "Funding this grant accepts the risk that expanding the industry size may outweigh welfare gains per animal. This is a bet on 'Intensity of Suffering' mattering more than 'Number of Sufferers.'"
  *   **Recommendation:** **Board Review Required (Red Flag).**
      *   *Why:* This hits the "Irreversible + Unknown Sign" condition in Step 3. Unlike bednets, there is a plausible mechanism for *net negative* long-term consequences. Staff cannot default to near-term outcomes here without explicit Board risk tolerance.

  ---

  # Where This Procedure Will Let You Down

  Be honest with your team. This checklist is a tool for governance, not a truth machine. Here are its failure modes:

  1.  **The "Slow Burn" Problem:** This procedure works for discrete grants. It fails on cumulative effects. Thirty "safe" bednet grants might collectively shift a region's demographics significantly, even if one grant doesn't. The procedure treats grants in isolation.
  2.  **Value Drift:** The "Value Flag" in Step 4 assumes the Board's values are static. They aren't. In five years, the Board might decide that population ethics *do* matter. You will have funded a portfolio based on a value set they no longer hold.
  3.  **False Precision in Step 1:** Staff may inflate "Near-Term Confidence" to bypass the harder questions in Steps 2 and 3. You need a culture where admitting "Medium Confidence" is safe.
  4.  **The "Unknown Unknowns":** This procedure handles "known unknowns" (we know we don't know the population effect). It cannot handle black swans (e.g., a bednet material inadvertently harms soil quality in a way that collapses local agriculture).
  5.  **It Kicks the Can:** Ultimately, this procedure does not solve the fight between your Board Member and Staff Member. It formalizes it. It forces the Board to admit: *"Yes, we are ignoring long-term ripple effects because we choose to, not because they don't exist."* That honesty may be uncomfortable for a Board that wants to feel purely rational.

  **Final Advice:** Use the "Value Flag" output from Step 4 as the first item on the Board's agenda for the grants that trigger it. Do not let them vote on the money until they vote on the sentence you wrote. That is the only way to stop the same fight from happening every meeting.
