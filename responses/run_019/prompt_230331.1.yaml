answer: |-
  You cut to the quick, and I do not dull the blade. In the order of bodies and politics, you are correct: there is no standing. Justice without force is powerless, so we made force just. We are so corrupted that we could not make the just powerful, so we made the powerful just. Custom is the queen of the world, and reason is her servant. If I seek to condemn tyranny using only the tools of human law, I am a fool, for those tools are forged by the very power I would judge. You say I lose the standing. In the court of men, I do. The tyrant rewrites the code, and the custom shifts like sand. We need force plus custom to live together at all, for reason alone is too weak to bind us.

  But you stop at the mind and miss the heart. I do not condemn tyranny because it breaks a human rule, which is indeed mutable wind, but because it contradicts the order of charity. True justice exists, but it is supernatural. Reason cannot supply the foundation, no; we are too fallen for that. Yet we feel the void. We know we are wretched because we know we have lost a true good. I call it tyranny because God calls it so, even if men call it law. You see only the force; I see the sin. We must submit to force to live, but we must know it is force to be saved.
