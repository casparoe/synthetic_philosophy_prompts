          4.  Identify breakdown points/misleading assumptions (separate consequential disanalogies from incidental ones).
          5.  Evaluate legitimacy: Is the analogy argumentative or merely rhetorical? If it fails, suggest better routes.

  2.  **Deconstruct Mill's Distinction (Brainstorming Readings):**
      *   *Reading 1: Ontological Emergence.* Chemical compounds literally possess properties that are not derivable from the elements. This suggests a break in causal closure. (Problem: Modern physics/chemistry suggests this is false; quantum mechanics explains bonding).
      *   *Reading 2: Epistemic Emergence.* The properties *appear* novel because we lack the computational power or theoretical bridge to derive them easily. It's about predictability, not metaphysics.
      *   *Reading 3: Configurational/Structural.* It's not the *stuff* but the *arrangement*. The "chemical mode" is really about non-linear interactions where the whole depends on the specific structural relation, not just additive aggregation.
      *   *Reading 4: Ceteris Paribus Laws.* Chemical laws hold only under specific conditions (isolation), whereas social laws might be even more context-dependent. Mill might be pointing to the failure of simple superposition principles.

  3.  **Construct the Correspondence Table:**
      *   Need to map Physical Chemistry $\rightarrow$ Social/Mental Sciences.
      *   *Elements:* Atoms/Molecules $\rightarrow$ Individuals/Psychological states.
      *   *Mixture:* Physical blend $\rightarrow$ Aggregate/Crowd (pre-social).
      *   *Compound:* Chemical bond $\rightarrow$ Social Structure/Institution/Conscious Mind.
      *   *Emergent Property:* Color/Reactivity $\rightarrow$ Norms/Inflation/Qualia.
      *   *Levels:* Micro-physics $\rightarrow$ Macro-sociology.

  4.  **Analyze Breakdown Points (The Critical Phase):**
      *   *Conservation:* In chemistry, mass/energy is conserved. In society, "social energy" isn't a conserved quantity in the same way.
      *   *Reversibility:* Chemical reactions can often be reversed (equilibrium). Social changes are often path-dependent/historical (hysteresis).
