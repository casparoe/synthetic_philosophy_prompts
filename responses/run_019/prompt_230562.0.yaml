      *   *Mill Check:* Mill distinguishes the "Geometric/Abstract" method (Deductive) vs. the "Chemical/Empirical" method. In the chapter on Composition of Causes, he argues that social phenomena *do* follow the mechanical mode (individual actions add up), but the complexity makes it *look* like the chemical mode. Actually, Mill argues that social science *should* be deductive (like mechanics), not empirical (like chemistry of his day). He warns *against* treating sociology like chemistry.
      *   *Correction:* The user says Mill "draws consequences for the sciences of mind and society." I need to be careful not to attribute the *modern* usage of the analogy to Mill himself. Modern emergentists use Mill's distinction *against* Mill's own methodological preference. Mill thought the "Chemical" mode was a limit to prediction, but he hoped social science could be mechanical. The *analogy* the user is asking about is how *contemporary* philosophers use the Chem/Phys relation to defend Soc/Psych autonomy. I must clarify that modern usage often inverts Mill's methodological hope.
