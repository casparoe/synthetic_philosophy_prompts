  9.  (Self-Correction on Mill): Mill actually argues that social phenomena *are* mechanical (effects of causes add up), but the causes are so numerous it *appears* chemical. He warns against the "Chemical Method" in sociology (purely empirical correlation without deductive basis). I must point out that using Mill to support *emergence* in sociology might be ironic given his actual text, but the *concept* of chemical composition is what matters for the analogy. I will focus on the conceptual analogy rather than strict Mill exegesis, but note the tension.

      *Wait, looking at System of Logic, Book III, Ch VI, Section 7:* Mill says: "It is not true that the phenomena of society are... analogous to chemical actions." He explicitly rejects the analogy for *methodology*. However, the prompt asks about the analogy used *by others* who reach for Mill. I will clarify this tension. It adds depth to the answer.

