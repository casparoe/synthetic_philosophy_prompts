      *   *Key Insight:* The biggest problem for the analogy is that Chemistry *has* been largely reconciled with Physics (via QM), whereas Sociology has not been reconciled with Psychology. If you use Chemistry to defend Sociology, you are using a science that *was* successfully reduced (in the eyes of many physicalists) to defend one that hasn't. That's a strategic blunder.

  8.  **Finalizing the Plan:**
      *   **Intro:** Acknowledge expertise, validate the question.
      *   **Step 1: Readings of Mill:** Ontological, Epistemic, Structural.
      *   **Step 2: Table:** Clear mapping.
