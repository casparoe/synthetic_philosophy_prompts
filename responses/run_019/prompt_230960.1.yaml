      *   *Case 1 (Standard):* A workspace arrangement. Easy to resolve. Shows the screen working to prevent a conflict.
      *   *Case 2 (The Hard One):* Weekend on-call norm.
          *   *Setup:* Co-op needs weekend coverage.
          *   *Conflict:* Alice has sovereignty over her weekends. Bob has sovereignty over his. The Group unanimously prefers "Alice works Sat, Bob works Sun" over "Random Lottery."
          *   *Paradox:* The Group Preference (Unanimity) dictates Alice's weekend (violating Sovereignty). Or, respecting Sovereignty means Alice opts out, violating the Group Preference for coverage.
