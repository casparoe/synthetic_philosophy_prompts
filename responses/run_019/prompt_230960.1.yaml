          *   *Scenario:* Alice has right over Schedule. Group (including Alice?) prefers Schedule A. But Schedule A was arrived at by pressure, or the definition of "Personal" is blurry.
          *   *Actually, the prompt says:* "everyone gets final say over a few things that are purely theirs... and if every single person prefers X over Y, we go with X."
          *   *The Paradox in practice:* Person A has right over [My Schedule]. Person B has right over [My Schedule]. The Group prefers [A works Sat, B works Sun]. But A prefers [A works Sun]. If the Group rule overrides A, A's right is violated. If A's right overrides Group, Unanimity is violated (assuming B prefers the original plan).
