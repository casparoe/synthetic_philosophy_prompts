answer: |-
  ### Pre-Vote Liberty & Consensus Screen

  **Purpose:** To detect collisions between Individual Sovereignty (Personal Zones) and Group Unanimity (Pareto Rule) before a vote creates a paradox or rights violation.
  **Timebox:** 30 Minutes max.
  **Owner:** Meeting Chair.

  | Step | Question to Ask | What Counts as a Pass | What to Do on a Fail | Stop or Continue | Requires Chair Judgment? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Scope** | "Does this proposal decide an outcome inside anyone's Protected Zone (schedule, workspace, travel)?" | **No:** It is purely a group matter.<br>**Yes:** It touches at least one person's personal domain. | If **Yes**, list the specific person(s) and the specific domain (e.g., "Alice's Tuesday shift"). | **Continue** to Step 2. | **No** (Factual check against bylaws). |
  | **2. Rights Holder** | "For each person identified in Step 1: Do they intend to exercise their personal veto/right on this specific issue?" | **Yes:** They claim their right to decide alone.<br>**No:** They voluntarily yield this decision to the group. | If **No**, remove them from the "Protected" list. If **Yes**, keep them on the list. | **Continue** to Step 3. | **Yes** (Interpreting intent vs. pressure). |
  | **3. Consensus Check** | "Excluding the vote itself: Does *every single member* (including the rights-holder) currently prefer Proposal X over the Status Quo?" | **No:** There is disagreement.<br>**Yes:** There is unanimous preference for X. | If **No**, proceed to normal voting (no paradox risk).<br>If **Yes**, flag as "High Risk." | **Continue** to Step 4 (if High Risk). | **Yes** (Gauging true preference vs. compliance). |
  | **4. The Collision** | "If we enact Proposal X based on unanimity, does it force the Rights-Holder to act against their own Protected Zone rule?" | **No:** The unanimous choice aligns with their personal right.<br>**Yes:** The group choice dictates their personal zone. | If **Yes**, **STOP**. Do not vote. This is a Liberal Paradox trigger. | **Stop** (Move to Resolution). | **No** (Logical check). |
  | **5. Resolution Path** | "Since we cannot satisfy both rules, which rule will we suspend for this specific case, or do we need to negotiate a new option Z?" | **Decision:** Group explicitly agrees to prioritize Rights *or* Unanimity for this instance. | **Fail:** If the group refuses to choose, the meeting adjourns on this topic. | **Stop** (Record decision for minutes). | **Yes** (Facilitating the trade-off). |

  ***

