  2.  **Deconstruct Sen's Liberal Paradox for this Context:**
      *   *Sen's Theorem:* No social welfare function can satisfy Unrestricted Domain, Pareto Efficiency (if everyone likes X > Y, society likes X > Y), and Minimal Liberalism (at least two people have decisive power over at least one pair of outcomes each) simultaneously.
      *   *Co-op Translation:*
          *   Pareto = "If everyone prefers X over Y, we go with X."
          *   Liberalism = "You decide your own schedule/workspace."
          *   The Clash: Person A cares deeply about their own schedule (Liberal right). Person B cares deeply about Person A's schedule (maybe because it affects coverage). If A prefers Work, B prefers A Rest (for coverage balance), but *everyone* prefers a specific global outcome that violates A's right.
          *   Actually, the classic paradox structure is: A prefers X over Y (personal), B prefers Y over X (personal), but there's a third option Z where everyone agrees Z > W, but implementing Z violates someone's personal domain.
          *   *Simpler Co-op version:* Person A has right over Schedule. Person B has right over Schedule. The group prefers a specific *pattern* of schedules (Unanimity). But that pattern violates A's specific choice.
      *   *The Screen:* Needs to identify when a "Group Preference" steps on a "Personal Domain."

