prompt: |-
  In the ethics seminar I’m TAing, we’re comparing the usual broad-brush picture of European countries as prohibitionist about surrogacy with the more commercial American market. One student keeps arguing that the moral issue is simple: surrogacy is “renting a womb,” and egg donation is “selling a body part,” so paid arrangements turn women’s bodies into property and children into products. The analogy is doing real work for them — they think it explains why bans are justified and why American-style contracts are objectionable even when everyone consenting is an adult.

  Audit the analogy rather than just accepting or rejecting it. Give the correspondence table: what is supposed to be the property, the owner, the tenant or buyer, the rental payment or purchase price, and the thing ultimately transferred? Then separate gestational surrogacy from egg donation and point out where the same metaphor fits the two cases differently. I’m especially interested in disanalogies involving bodily labor versus detached tissue, payment for time/risk versus payment for the child or gamete itself, the possibility of ongoing relationships, and whether regulation could protect people without pretending the arrangement is morally identical to leasing an apartment. Which objections survive once the sloppy property language is cleaned up, and could a better analogy — organ donation, adoption, sex work, military service, professional caregiving, or something else — do the argumentative work more honestly?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Ethics seminar TAing, comparing European prohibitionist views on surrogacy vs. American commercial markets.
      *   **Student's Argument:** Surrogacy = "renting a womb" (property), Egg Donation = "selling a body part" (property). Paid arrangements = turning bodies/children into property/products. Justifies bans/objections.
      *   **Task:** Audit the analogy (don't just accept/reject).
      *   **Specific Requirements:**
          1.  Create a correspondence table (Property, Owner, Tenant/Buyer, Payment, Thing Transferred).
          2.  Separate Gestational Surrogacy from Egg Donation (show where the metaphor fits differently).
          3.  Highlight specific disanalogies: Bodily labor vs. detached tissue, Payment for time/risk vs. payment for child/gamete, Possibility of ongoing relationships.
          4.  Discuss regulation vs. prohibition (can we protect without accepting the property metaphor?).
          5.  Identify surviving objections once "property language" is cleaned up.
          6.  Propose better analogies (organ donation, adoption, sex work, military service, caregiving, etc.).

  2.  **Deconstruct the Student's Analogy ("Renting a Womb" / "Selling Parts"):**
      *   *Core Claim:* Commodification of the self.
      *   *Underlying Ethical Framework:* Kantian (treating humanity as an end, not merely a means) or Marxist (alienation/commodification).
      *   *Weakness:* "Womb" isn't a separate object; "Egg" is tissue but regenerative. "Renting" implies control over the space, but pregnancy involves the whole person.

  3.  **Drafting the Correspondence Table:**
      *   Need to map the Real World Scenario to the Property/Market Scenario.
      *   *Surrogacy:*
          *   Property: Uterus/Womb (or bodily autonomy during pregnancy).
          *   Owner: Surrogate.
          *   Tenant/Buyer: Intended Parents (IPs).
          *   Payment: Fee/Compensation.
          *   Thing Transferred: Custody of the child (allegedly), or use of the womb.
      *   *Egg Donation:*
          *   Property: Oocytes/Eggs.
          *   Owner: Donor.
          *   Buyer: Clinic/IPs.
          *   Payment: Compensation.
          *   Thing Transferred: Genetic material.

  4.  **Analyzing Disanalogies (Surrogacy vs. Egg Donation):**
      *   *Surrogacy:* It's a *process* (labor), not just a *thing*. The "womb" isn't detached. It involves 9 months of life, risk, hormonal changes. It's more like a service contract than a lease.
      *   *Egg Donation:* It *is* detached tissue (like blood or plasma). However, eggs are finite (unlike blood) and regenerative (unlike kidneys). It's closer to tissue donation but with hormonal stimulation risks.
      *   *The "Child as Product" issue:* In surrogacy, the "result" is a child. In egg donation, the result is *potential* for a child. This is a crucial distinction for the "commodification of children" argument.

  5.  **Addressing Specific Disanalogies (Labor vs. Tissue, Payment, Relationships):**
      *   *Labor vs. Tissue:* Surrogacy is embodied labor. Egg donation is tissue transfer + medical procedure.
      *   *Payment:* Surrogacy pay is often framed as "compensation for time/risk/inconvenience" (to avoid baby-selling laws). Egg donation pay is for "time and discomfort." If it's payment for the *outcome* (baby/egg), it looks more like sales.
      *   *Relationships:* Surrogacy often involves ongoing contact (open agreements). Egg donation is often anonymous or limited. A lease usually ends; a service contract might have follow-up.

  6.  **Regulation vs. Prohibition (Cleaning up the Property Language):**
      *   If we reject "renting a womb," what remains? Exploitation, coercion, inequality.
      *   Regulation can focus on *consent quality*, *independent advocacy*, *health safeguards*, and *post-birth rights* without needing to declare the womb "property."
      *   The "property" metaphor blocks nuance. You can regulate labor without owning the worker.

  7.  **Surviving Objections (Once Property Talk is Gone):**
      *   *Exploitation:* Economic desperation driving consent.
      *   *Stratified Reproduction:* Wealthy people using poorer women's bodies.
      *   *Medical Risk:* Informed consent is hard when hormones affect mood/judgment.
      *   *Parental Identity:* Psychological impact on the child (knowing they were "contracted").
      *   *Social Meaning:* Does paying for this degrade the social value of motherhood/parenthood?

  8.  **Evaluating Alternative Analogies:**
      *   *Organ Donation:* Too strong (permanent loss). Kidney is non-regenerative. Egg is regenerative. Womb is not removed.
      *   *Adoption:* Closer on the "child" aspect. But adoption happens *after* birth; surrogacy contracts are *before* conception/birth. Adoption prohibits payment for the child; surrogacy pays for the service leading to the child.
      *   *Sex Work:* Bodily autonomy, intimacy, stigma, payment for use of body. Strong on "commodification of self," weak on "creation of life."
      *   *Military Service:* High risk, bodily sacrifice, contract-based, state-regulated. Good for "risk for pay," bad on "intimacy/creation."
      *   *Professional Caregiving (Nursing/Daycare):* Paid care for another's dependent. Good for "labor," bad on "bodily intrusion."
      *   *Clinical Trial Participant:* High risk, medical intervention, payment for time/risk. Very strong for egg donation and surrogacy (medicalization).

  9.  **Synthesizing and Refining:**
      *   *Tone:* Academic, analytical, helpful for a TA guiding a seminar.
      *   *Structure:* Follow the prompt's requirements step-by-step.
      *   *Key Insight:* The "property" metaphor is a rhetorical shortcut that obscures the actual ethical tensions (labor rights vs. commodification).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish gestational surrogacy from traditional? (Prompt asks for gestational specifically). *Correction:* Ensure I emphasize the genetic distinction in gestational surrogacy (surrogate is not genetic mother).
      *   *Check:* Did I address the "child as product" claim? *Correction:* Make sure to note that in gestational surrogacy, the child is genetically unrelated to the surrogate, which complicates the "selling a part of oneself" claim.
      *   *Check:* Is the table clear? *Correction:* Use markdown for readability.

  11. **Final Polish:** Ensure the distinction between "altruistic" (often European model) and "commercial" (US model) is acknowledged but keep the focus on the *analogy audit*. (Proceed to generate output).

