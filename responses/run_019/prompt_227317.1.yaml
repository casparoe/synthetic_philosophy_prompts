  *(Refining the Alternative Analogies)*: Clinical trial participation is probably the strongest for the medical risk aspect. Caregiving is strong for the labor aspect. Adoption is strong for the parental rights aspect. I should weigh these.

  *(Final Plan)*:
  1. Introduction: Acknowledge the student's intuition (commodification) but flag the metaphorical sloppiness.
