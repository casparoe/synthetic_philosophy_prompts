answer: |-
  1. "What we both accept"

  1. The asymmetry is robust: agents bringing about bad side-effects are judged to act intentionally significantly more often than those bringing about good side-effects, holding desire and belief constant.
  2. This effect persists across variations of the chairman vignette, diverse cultures, and ages, though developmental timelines vary.
  3. Moral valence correlates with intentionality judgments even when epistemic states are controlled.
  4. Neither side claims moral judgment overrides all other factors; skill, knowledge, and control remain relevant constraints on intentionality attributions for both camps. We agree that an agent cannot act intentionally without basic agency and capacity.
  5. Standard survey methods reliably elicit the effect, regardless of whether it reflects competence or performance.
  6. We agree that folk psychology is sensitive to normative considerations, differing only on whether this sensitivity is constitutive of the concept or external to it.
  7. Both camps accept that the effect is not merely a linguistic confusion regarding the word "intentional," but reflects a deeper cognitive pattern in how people process actions.
  8. We acknowledge replication successes across laboratories and agree the phenomenon is not an artifact of a single vignette structure or specific wording regarding side-effects versus means.

  2. "Where we really disagree"

  Our core dispute concerns the cognitive architecture of folk psychology. Camp M argues moral considerations are constitutive of the concept INTENTIONAL. For us, the truth conditions of "X intentionally did Y" shift based on Y's moral status; the harming chairman literally satisfies the folk concept. We maintain this is compatible with skill constraints because the concept is multi-faceted, not solely moral; luck still excludes intentionality even in moral cases. Camp P argues the concept is neutral, but performance factors distort application. For us, participants attribute intentionality to harm to express blame or signal character violations via pragmatic implicature, not because the concept itself changed. This is not mere confusion; it is rational communication shaped by social stakes.

  We acknowledge some literature debates are verbal (e.g., defining "concept" vs. "application"). However, the substantive disagreement lies in mechanism: is moral processing integral to action individuation (M), or does it modulate the output of a neutral action-individuation module (P)? Camp M must explain why skill constraints remain intact despite moralization. Camp P must explain why pragmatic pressures seem automatic and resistant to debriefing. We agree the asymmetry is real; we disagree on whether it reveals the shape of the concept or the pressures of communication. The dispute is whether morality enters the input or the output of the intentionality detector. Specifically, Camp P denies that moral valence changes the *representation* of the action, while Camp M insists it changes the *categorization* of the action.

  3. "Cruxes"

  1. **Non-Moral Norm Violations:** We will test vignettes where side-effects violate etiquette or aesthetic norms without moral blame (e.g., wearing mismatched socks).
     *   *Camp M:* Predicts asymmetry. Any norm violation triggers the concept, as the concept is broadly normative.
     *   *Camp P:* Predicts no asymmetry. Without blame/praise stakes, pragmatic pressure to signal character vanishes.
  2. **Cognitive Load:** Participants judge cases under high working-memory load while performing a secondary task.
     *   *Camp P:* Predicts reduced asymmetry. Pragmatic inference is effortful and secondary; load disrupts it, revealing the neutral concept.
     *   *Camp M:* Predicts stable asymmetry. Conceptual application is automatic and constitutive; load should not alter truth conditions.
  3. **Agency Elimination (Convergence):** We acknowledge both camps predict the asymmetry disappears if the agent lacks control (e.g., coerced action or reflex).
     *   *Prediction:* Both agree intentionality drops to baseline regardless of moral valence.
     *   *Significance:* This confirms shared boundaries regarding agency, but fails to distinguish competence from performance. We include this to highlight that some "tests" merely confirm shared assumptions rather than resolving the core dispute. It shows we agree on the necessary conditions for agency, even if we disagree on the sufficient conditions for intentional attribution.
  Settling 1 or 2 would force theoretical revision; 3 confirms common ground but leaves the mechanism unresolved. We commit to preregistering these designs to prevent post-hoc interpretation of null results. For Crux 1, we will use a scale measuring perceived norm violation severity to ensure equivalence across conditions. For Crux 2, we will validate the load manipulation ensures reduced cognitive resources. If Crux 1 shows asymmetry for etiquette, Camp P must expand their theory to include non-moral norms. If Crux 2 shows load effects, Camp M must concede performance factors play a role.

  4. "What would change our minds"

  **Camp M:** We would revise if asymmetry persists equally in tasks stripped of all communicative context (e.g., private diary entries) where blame signaling is impossible. If people still call it "intentional" when no one is watching, pragmatics fails, but if the effect *vanishes* there, our constitutive claim collapses. We need evidence that the judgment persists without an audience to rule out signaling.

  **Camp P:** We would revise if neuroimaging shows moral processing occurs *before* action individuation processing during intentionality judgments. If moral valence structurally precedes action parsing rather than modulating its output, the concept itself is moralized. Temporal precedence in neural activation would indicate constitutive integration rather than downstream modulation.
