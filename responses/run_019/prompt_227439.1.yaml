      *   **Constraints:**
          *   Time limit: 75 minutes.
          *   Core Topic: Compatibility of "contingency/lock-in" (path dependence) vs. "overdetermination/inevitability" (structural determinism).
          *   Specific Claims to Analyze: (1) Specific technical standard was accidental/locked-in (contingent micro); (2) Industrialization itself was overdetermined (inevitable macro).
          *   Required Student Moves:
              1.  State claims/evidence/counterfactuals precisely.
              2.  Explain the "level of description" compatibility *and* why it's insufficient (disagreement relocates).
              3.  Propose a criterion for *substantive* path dependence (not trivial).
              4.  Apply criterion to a *fresh* case (not from class).
              5.  Reach a verdict on joint substantiveness.
          *   Model Answer Requirements: Clean statement, level-of-description nuance, explicit criterion + objection handling, original case application, definite verdict. ~700 words.
          *   Marking Scheme: Out of 25 marks, allocated by component, with common mistake notes.
          *   Differentiation Note: Explain what separates a First-Class answer from a 2:1.

  2.  **Drafting the Exam Question:**
      *   Need to frame the prompt clearly so students know exactly what is expected.
      *   Must include the two claims (Rail gauge/standard vs. Industrialization inevitability).
      *   Must list the specific tasks (State, Explain compatibility/limits, Propose criterion, Apply to new case, Verdict).
      *   *Drafting thought:* Make sure the instruction about "fresh case" is bolded or emphasized so they don't reuse lecture examples (like QWERTY or the Spanish Armada).

  3.  **Drafting the Model Answer:**
