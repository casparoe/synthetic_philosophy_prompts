answer: |-
  **FINAL EXAMINATION: TECHNOLOGY AND POLITICAL ORDER**
  **Time Allowed: 80 Minutes**

  **Essay Question**

  Langdon Winner argues that artifacts have politics via two routes: specific design choices that settle community affairs, and inherent technological requirements for social organization. However, later historical scrutiny (e.g., Joerges) suggests Winner's canonical example—the Moses low-overpass bridges—is empirically flawed. Does this empirical failure invalidate Winner's thesis, or does the theory survive independent of the example? Take a stand on what function the bridge story served (evidence, illustration, or something else) and state which version of Winner's claim, if any, survives in defensible form.

  Test your repaired thesis against the following case: A university housing office adopts an algorithm that assigns first-year students to dormitories by clustering questionnaire responses about tastes and habits, in the stated service of building community; because tastes and habits track family income, the algorithm reliably sorts students by class, although no one intended this and the office is dismayed by the outcome. Does this artifact have politics on your reading, and does the absence of intention matter?

  ***

  **MODEL ANSWER**

  The debunking of the Moses bridge story by Joerges and others forces a crucial distinction between Winner's historical evidence and his theoretical logic. The bridge story functioned not as the sole empirical proof of Winner's thesis, but as a vivid illustration of how technical arrangements can enforce social hierarchy. While the specific history was contested, the structural mechanism Winner identified remains valid. Therefore, Winner's thesis survives, but only if decoupled from the requirement of conscious conspiratorial intent. The theory collapses only if one insists that "politics" requires a malicious actor like Moses; it survives if "politics" is defined by the *consequence* of ordering human relations, regardless of the designer's state of mind.

  This repair strengthens Winner's first route. Originally, the bridge example suggested that artifacts have politics because designers embed specific social outcomes into hardware. The critique showed that designers often do not know or care about these outcomes. However, if we shift the locus of politics from the *moment of design* to the *moment of operation*, the thesis holds. An artifact has politics if its arrangement settles public affairs in a way that benefits some groups over others, irrespective of whether that settlement was intended. This moves Winner away from a "great man" theory of technological politics toward a structuralist analysis. The bridge may not have been built to exclude buses, but if it excludes them, it produces a political effect. The empirical failure of the anecdote does not negate the phenomenological reality of technical exclusion.

  Applying this repaired thesis to the university housing algorithm clarifies its political nature. The algorithm clusters students by tastes that correlate with income, resulting in class segregation. On the repaired Winnerian reading, this artifact absolutely has politics. It settles a community affair—who lives with whom—in a way that reproduces existing class stratification. The stated goal was "community building," but the operational reality is socioeconomic sorting. The technology acts as a gatekeeper, determining social access and proximity based on data proxies for wealth. This fits the first route: the design arrangement becomes a way of settling community affairs, creating a specific form of social order (class homogeneity) rather than another (class integration).

  The absence of intention is irrelevant under this repaired framework. In the original bridge story, the controversy hinged on whether Moses *intended* to keep buses out. In the algorithm case, the office is "dismayed" by the outcome. If politics required intent, this algorithm would be neutral. However, if politics resides in the *authority* exercised by the system, the lack of intent changes nothing. The algorithm still wields authority over student life and enforces a distribution of resources (housing proximity) along class lines. To claim it lacks politics because no one meant to segregate students is to confuse morality with ontology. The system functions politically even if the operators are morally innocent.

  Ultimately, the Joerges critique saves Winner from himself. By removing the reliance on the Moses conspiracy, we are left with a more robust claim: technologies are political because they structure human interaction, not because engineers are secret legislators. The housing algorithm proves this. It demonstrates that artifacts can have politics precisely when no one is trying to make them political. The settlement of affairs happens through the logic of the system itself, not the mind of the creator. Winner's thesis survives, provided we accept that artifacts can legislate without a legislator.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  | Required Move | Marks | Characteristic Weakness in Lower-Grade Answers |
  | :--- | :---: | :--- |
  | **1. Diagnose the Bridge Story:** Explicitly identify the story's function (e.g., illustration vs. foundational evidence) relative to the theory. | 4 | Treats the bridge story as the only proof, claiming the theory dies with the fact. |
  | **2. Stand on Viability:** Take a clear position on whether Winner's thesis survives the empirical critique. | 4 | Hedges indefinitely or claims the theory is partially true without explaining why. |
  | **3. Formulate Repaired Thesis:** Articulate a defensible version of Winner's claim (e.g., shifting focus from intent to consequence/ordering). | 4 | Recites Winner's original two routes without modifying them to account for the critique. |
  | **4. Apply to Algorithm:** Determine whether the housing algorithm has politics based on the repaired thesis. | 4 | Applies the original thesis rigidly, failing to see the politics without malicious intent. |
  | **5. Address Intention:** Explicitly state whether the absence of intention matters and justify why within the argument. | 4 | Dismisses intention without linking it back to the definition of "politics" or "ordering." |

  **Distinction between A and B Answers:**
  An **A answer** synthesizes the critique and the theory to produce a novel, defensible formulation (e.g., "politics as consequence") and applies it consistently to the algorithm case, treating the lack of intent as theoretically significant. A **B answer** correctly identifies the critique and applies the theory but treats the "repair" as merely dropping the bridge example rather than refining the definition of technological politics, often struggling to explain why the algorithm is political without intent.

  Verdict: The model answer argues that Winner's thesis survives the debunking of the bridge story if politics is redefined as the structural consequence of technical arrangements rather than the intended outcome of designers.
