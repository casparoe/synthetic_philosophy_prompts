answer: |-
  # CIVICS CLUB WORKSHOP: THE ELECTORAL SYSTEMS SORTER
  **Goal:** Don't pick a label. Pick your trade-offs. Follow the arrows to find the system that matches your values.

  ### STEP 1: THE UNIT OF REPRESENTATION
  **When you cast a vote, what are you primarily choosing?**
  *   **[A] A Person:** I want a specific neighbor accountable to my geographic community.
  *   **[B] A Party:** I want a team accountable to my ideological views nationwide.

  ### STEP 2: THE 49% RULE
  **If a group wins 49% of the national vote but loses every local district, should they elect *anyone*?**
  *   **[A] No:** Winning the district is the only thing that matters; losers get nothing.
  *   **[B] Yes:** The legislature must mirror the national vote share, even if local races were lost.

  ### STEP 3: THE GOVERNING COST
  **Is a single-party majority government worth distorting the vote count to achieve?**
  *   **[A] Yes:** I prefer clear accountability and stability over perfect vote matching.
  *   **[B] No:** I prefer accurate representation even if it requires coalition negotiation *after* the election.

  ### STEP 4: THE SIMPLICITY CONSTRAINT
  **Does a complex ballot (ranking candidates, multiple votes) make a system too risky for ordinary voters?**
  *   **[A] Yes:** Simplicity is an independent requirement; complex ballots invite error.
  *   **[B] No:** Complexity is acceptable if it produces a fairer outcome.

  ---

  ## YOUR RESULTS: FIND YOUR PATH

  **PATH 1: A — A — A — A**
  *   **System:** **First-Past-The-Post (Plurality)**
  *   **The Awkward Commitment:** You must accept that a party can win 100% of the power with only 40% of the vote, leaving minorities permanently unrepresented.

  **PATH 2: B — B — B — B**
  *   **System:** **Party List Proportional Representation**
  *   **The Awkward Commitment:** You must accept that party bosses, not voters, often decide which specific candidates fill the seats won by the party.

  **PATH 3: A — B — B — B**
  *   **System:** **Mixed-Member Proportional (MMP) or STV**
  *   **The Awkward Commitment:** You must accept a legislature with two classes of representatives or a counting system voters cannot easily verify themselves.

  **PATH 4: A — B — A — A**
  *   **System:** **The Unicorn System**
  *   **Diagnosis:** **Incoherent.** You cannot have local winners, perfect proportionality, single-party stability, and simple ballots simultaneously; the math forbits it.

  **PATH 5: B — A — [Any]**
  *   **System:** **The Contradiction**
  *   **Diagnosis:** **Unattractive.** Choosing party representation but accepting zero seats for 49% of voters defeats the purpose of choosing parties over people.

  **PATH 6: [Any] — [Any] — B — A**
  *   **System:** **The Reformers' Dilemma**
  *   **Diagnosis:** **Underexplored.** Wanting coalition accuracy but refusing the complex ballots required to count it suggests a need for better voter education, not different rules.

  ---

  ### DISCUSSION PROMPT
  Compare your result with your neighbor. Did you land on the same system? If not, which specific question (1–4) caused the split? That split is where the real political debate lives.

  Verdict: Your ideal system is not a destination but a prioritization of which democratic flaws you are willing to tolerate.
