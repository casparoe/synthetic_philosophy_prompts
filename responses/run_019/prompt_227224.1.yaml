answer: |-
  Your intuitions map remarkably well onto a specific framework in the philosophy of action, primarily associated with **Michael Bratman's Theory of Shared Intention**, with a touch of **Margaret Gilbert's Plural Subject Theory** to account for the "rebuke" aspect.

  The principle that captures your verdicts is this: **Joint action requires interlocking intentions directed at a shared goal, which generate mutual obligations.**

  Here is how this principle organizes your cases, resolves the Jazz/Riot tension, and where it requires us to adjust one of your verdicts.

  ### 1. The Core Principle: Interlocking Commitments
  For an action to be "joint" rather than merely "parallel," three conditions must be met:
  1.  **Interlocking Intentions:** I intend that *we* J, and you intend that *we* J. My intention is conditional on yours (I won't do it if you don't).
  2.  **Meshing Subplans:** We coordinate our individual actions to serve the shared goal (not just coincidentally aligning).
  3.  **Normative Force:** Because we have formed this shared intention, we are now accountable to each other (which makes the rebuke possible).

  ### 2. Solving the Jazz vs. Riot Problem
  This is the crux of your inquiry. Both involve responsiveness, but the *object* of the intention differs.

  *   **The Jazz Duo (Joint):** The musicians intend *the music* as a shared product. My intention is "I will play a riff *so that* we create a harmony." If you stop playing, I must adjust or stop to preserve *our* performance. Our subplans mesh to constitute a single activity.
  *   **The Riot (Not Joint):** You specified "nobody aiming at anything shared." In a riot, my intention is "I will smash this window." Your smashing encourages me (causal influence), but I do not intend *our* smashing as a unified project. If you stop, I might keep smashing. We are individually aiming at similar targets, influenced by the same atmosphere, but we lack the **interlocking commitment to a shared end**.

  **The Distinction:** In the Jazz duo, the responsiveness is *constitutive* (I react to keep *us* on track). In the Riot, the responsiveness is *causal* (I react because your action fuels *my* anger).

  ### 3. The Verdict That Must Be Overturned: The Flash Mob
  To make this theory robust, I have to challenge your verdict on the **Flash Mob**.

  *   **Your Verdict:** Joint.
  *   **The Theory's Verdict:** **Not Joint** (or at best, borderline).
  *   **Why:** You specified they "never communicate" and just showed up due to a post. If I show up and dance, and you show up and dance, but we do not adjust to each other, rely on each other, or hold each other accountable during the act, we are **parallel agents triggered by a common cause**.
  *   **The Test:** If half the mob didn't show up, would the remaining participants feel the *activity itself* was compromised in a way that violates an agreement between *them*? Or would they just think "Oh, fewer people than expected"? In a true joint action (like the walking pair), the absence of the other invalidates the activity ("I can't walk *with* you if you aren't here"). In a flash mob of strangers following a script, they are all acting jointly with the *organizer*, but not necessarily with each other. They are a crowd, not a team.

  ### 4. Explaining the Other Cases
  *   **Strangers Pushing Car:** Fails Condition 1. No interlocking intention. I push because the car moves; I don't care if *you* specifically are pushing.
  *   **Walking Together:** Fits perfectly. The possibility of the rebuke ("Hey, I thought we were...") proves Condition 3 (Normative Force). We are bound by a plural subject.
  *   **The Committee:** Fits Condition 1 & 2. Bratman calls this "Modest Sociality." We can share an intention ("We resolve X") even if our underlying *motives* differ (Self-interest vs. Altruism). The group forms an agent distinct from the individuals' private desires.

  ### 5. Prediction: The Couple with Converged Habits
  **The Case:** A couple whose habits and finances have slowly converged over decades into a shared way of life that neither ever actually chose.

  **The Prediction:** **This is not Joint Action; it is Aligned Habit.**

  According to the principle of Interlocking Intentions, joint action requires an active (even if tacit) intention to do something *as a pair*.
  *   **Why it fails:** If the convergence happened "slowly" and was "never actually chosen," it lacks the **commitment** element. It is a coincidence of history, not an exercise of shared agency. They are two trains running on parallel tracks that have slowly bent toward each other, not a single train with two engines.
  *   **The Nuance:** It *becomes* joint action the moment they recognize the pattern and endorse it. If one says, "This is how we do things now," and the other accepts, the habit transforms into a **norm**. Until that recognition happens, they are merely **aligned individuals**, not a **plural subject**.

  ### Summary
  Your intuitions describe a world where **Shared Agency** is defined not by what we do, but by **how we intend what we do.**
  *   **Jazz vs. Riot:** Distinguished by whether the goal is *ours* (Jazz) or *mine + yours* (Riot).
  *   **Flash Mob:** Must be reclassified as parallel action to preserve the requirement of interdependence.
  *   **The Couple:** Predicted to be non-joint until the habit is consciously adopted as a shared norm.

  This theory preserves the special "glue" you sensed in the walking case (the rebuke) while explaining why mere synchronization (the riot or the car) isn't enough to bind us together.
