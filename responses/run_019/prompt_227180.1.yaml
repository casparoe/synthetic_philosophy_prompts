      *(Self-Correction during drafting)*: I need to be careful not to validate the friend's conclusion (that the framing collapses) while acknowledging the logical force of their *reductio*. The goal is to show the *reductio* fails because it ignores moral relevance distinctions.

      *Key Distinction:* The difference between *allocating risk* (traffic) and *withdrawing sustenance* (famine).
