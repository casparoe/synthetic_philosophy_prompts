answer: |-
  # Sidebar: The Continuity Quiz

  **Instructions:** Read each scenario and select the option that best matches your *practical expectation* of what you would experience or how you would bet. Do not overthink the metaphysics; go with your gut instinct about what happens *to you*.

  ### 1. The Coin-Flip Gun
  A device is rigged to a quantum measurement. If the result is "Up," a gun fires and kills you instantly. If "Down," it clicks harmlessly. The odds are exactly 50/50. You pull the trigger.
  *   **A.** I will definitely hear the click. I cannot experience the branch where I am dead.
  *   **B.** I will probably hear the click, but I should be genuinely afraid of the silence.
  *   **C.** There is a 50% chance my experience ends forever.

  ### 2. The Long Shot
  Same setup as above, but the device is tuned so there is only a 1% chance of the "Click" (survival) and a 99% chance of the "Bang" (death).
  *   **A.** I will still find myself alive. The odds don't change the fact that I must experience *something*.
  *   **B.** I will likely find myself alive, but I should bet my life savings that I won't be.
  *   **C.** I should expect to die. Surviving would be a miracle, not an expectation.

  ### 3. The Sleeping Brancher
  You are given a sleeping pill. While unconscious, a quantum event occurs. If "Heads," you are woken gently. If "Tails," you are painlessly euthanized in your sleep. You do not witness the measurement.
  *   **A.** When I open my eyes, I will know the result was Heads. I cannot wake up dead.
  *   **B.** If I wake up, it was Heads. But I shouldn't expect to wake up given the odds.
  *   **C.** I might not wake up at all. My stream of consciousness could terminate in the dark.

  ### 4. The Teleporter
  A machine scans your body, destroys it, and reconstructs an atom-for-atom duplicate on Mars using new matter. The duplicate has all your memories up to the scan.
  *   **A.** I will step out on Mars. The destruction on Earth is irrelevant to my continuity.
  *   **B.** I will step out on Mars, but I acknowledge the "measure" of my existence has shifted.
  *   **C.** The person on Mars is a copy. *I* cease to exist on Earth.

  ### 5. The Quantum Lottery
  You can buy a ticket for $100. A quantum draw determines the winner. 1 in 1,000,000,000 win $1 billion; everyone else dies instantly.
  *   **A.** I should buy the ticket. I will experience winning. The dead branches don't count.
  *   **B.** I should buy the ticket to survive, but I shouldn't expect to be rich in my future memory.
  *   **C.** This is suicide. The odds of death are effectively 100%.

  ### 6. The Friend in the Room
  You play the 50/50 Quantum Gun (Question 1) while a friend watches from behind bulletproof glass.
  *   **A.** My friend will see me die in half the worlds, but *I* will only experience the worlds where I live.
  *   **B.** My friend will see me die in half the worlds, and I should expect to be in one of those dead worlds.
  *   **C.** My friend will see me die half the time because I *do* die half the time.

  ### 7. The Fading World
  You survive a sequence of 100 quantum branching events. In each step, the branch where you survive has only 50% of the "measure" (weight) of the previous one. Physically you feel fine, but the universe is technically "thinner."
  *   **A.** Everything feels normal. Measure doesn't affect subjective intensity.
  *   **B.** I survive, but the world should feel increasingly improbable or "dreamlike."
  *   **C.** Eventually, the measure becomes too low to support consciousness, and I vanish.

  ### 8. The Heat Death
  Trillions of years in the future, the universe reaches heat death. However, there is a non-zero quantum probability of a "Boltzmann Brain" fluctuating into existence with your memories.
  *   **A.** My consciousness continues via that fluctuation. I am effectively immortal.
  *   **B.** My consciousness continues, but such a low-probability existence is negligible.
  *   **C.** My consciousness ends with the heat death. Fluctuations are new entities, not me.

  ---

  # Scoring Key & Analysis

  Tally your answers. While human intuition is messy, your pattern likely clusters around one of the five positions below.

  ### Position 1: The Full Everettian (Mostly A)
  **View:** *Measure doesn't matter; subjective continuity is guaranteed.*
  You believe that as long as there is a non-zero amplitude for a branch where you exist, that is where you will find yourself. Probability is only relevant to external observers, not to your first-person stream of consciousness.
  *   **Coherence Check:** This position is internally consistent but leads to the "Quantum Suicide" paradox where you expect to survive impossible odds (Question 5). It requires accepting that you will eventually find yourself in increasingly bizarre, low-measure worlds (Question 7).

  ### Position 2: The Measure-Sensitive Immortalist (Mostly B)
  **View:** *You survive, but probability still guides expectation.*
  You accept branching and continuity, but you believe "measure" (amplitude squared) correlates with the likelihood of *finding yourself* in a specific branch. You survive death, but you shouldn't expect to survive *unlikely* death.
  *   **Coherence Check:** This is a popular "middle ground" but faces a technical challenge: if you *always* survive (Position 1 logic), why does measure affect expectation? If measure affects expectation, does that mean some branches are "more real" than others? This position is attractive but theoretically unstable.

  ### Position 3: The Standard Realist (Mostly C, specifically Q1, Q2, Q5)
  **View:** *Collapse or Objective Risk.*
  You believe death is the end of experience. Whether due to wavefunction collapse or a pragmatic interpretation of the Born rule, you treat quantum risk exactly like classical risk.
  *   **Coherence Check:** Highly coherent and matches standard scientific practice. It rejects the premise that quantum mechanics alters personal identity.

  ### Position 4: The Deflationary Skeptic (Mostly C, specifically Q4, Q8)
  **View:** *Copies are not You.*
  You might accept Many-Worlds physically, but you reject the idea that a duplicate copy carries *your* identity. If the "original" stream stops, you are dead, regardless of how many copies exist elsewhere.
  *   **Coherence Check:** Coherent, but relies on a specific definition of "self" that prioritizes causal continuity over psychological similarity. It renders Quantum Immortality arguments moot.

  ### Position 5: The Single-Threader (Mostly C, specifically Q3, Q6)
  **View:** *One Branch is Chosen.*
  You believe all branches might physically exist, but your consciousness "rides" only one thread, selected randomly according to the Born rule.
  *   **Coherence Check:** Ontologically distinct from Position 3 (Collapse), but behaviorally identical. You bet as if you will die.

  ---

  # Diagnostic Notes for the Journalist

  ### Incoherent or Unattractive Patterns
  *   **The "Rich Immortal" (A on Q5, C on Q1):** If a reader expects to survive the 1-in-a-billion lottery (Q5-A) but admits they might die on a 50/50 coin flip (Q1-C), their view is **incoherent**. If survival is guaranteed by branching, it applies to all non-zero amplitudes. If risk is real, it applies to both.
  *   **The "Fading Ghost" (A on Q1, C on Q7):** Expecting to survive a gun (Q1-A) but expecting to vanish due to low measure (Q7-C) is **unattractive** theoretically. It implies there is a "threshold" of reality where consciousness turns off, which lacks a clear physical mechanism in standard Everettian QM.

  ### Unseparated Pairs
  *   **Position 3 (Collapse) vs. Position 5 (Single-Thread):** This quiz **cannot separate** these two positions. Both result in the same betting behavior (Option C). The difference is purely ontological (do the other branches exist physically?), which a first-person experience quiz cannot probe. Readers landing here should be grouped as "Mortalists."
  *   **Position 3 (Collapse) vs. Position 4 (Deflationary):** These are also **behaviorally identical** in this quiz (both choose C). Separation requires asking *why* they chose C: does the wavefunction collapse (Pos 3), or does the copy fail to inherit identity (Pos 4)? A sidebar quiz cannot easily distinguish ontology from identity theory without becoming too technical.
  *   **Position 1 (Full QI) vs. Position 2 (Measure QI):** These are separated by Question 2 and Question 5. However, if a reader answers **B** to Q2 but **A** to Q5, they are in an **unexplored** logical space. Why does measure matter at 1% but not at 0.0000001%? This suggests an intuitive discomfort with QI rather than a worked-out philosophical position.

  ### Recommendation for the Sidebar
  When presenting this, emphasize that Positions 3, 4, and 5 all lead to the same practical advice: *Don't play Quantum Russian Roulette.* The debate between them is about the nature of reality, not survival strategy. Positions 1 and 2 are the only ones that change how a reader should bet with their life.
