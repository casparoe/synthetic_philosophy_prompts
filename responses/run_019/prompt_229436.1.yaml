answer: |-
  You mistake my intent, Sir, if you suppose I wish to turn a gentleman into a mechanic by profession. I propose such employments—gardening, turning, joinery—only as recreations from study, to guard against the idleness that breeds vice and melancholy. A mind constantly bent upon books becomes dull and unfit for the world, whereas manual exercise strengthens the constitution and gives a man a proper esteem for the labour of those beneath him. It is not that he should live by his hands, but that he should not be ashamed to understand how things are made, lest he remain a stranger in his own estate and dependent upon the honesty of servants for his very maintenance.

  As for Cicero and Latin, I do not banish learning, but I insist it must be secondary to virtue and wisdom. What profit is there in a head stuffed with classical phrases if the heart is corrupt or the judgment weak? A gentleman's business is to govern himself and his affairs with prudence, not to dispute like a schoolman. If he must choose, let him be virtuous and useful rather than merely learned; for a learned fool is still a fool, but a virtuous man is an ornament to his country.
