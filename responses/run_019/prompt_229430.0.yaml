prompt: |-
  I am leading a two-hour seminar for a reading group of quantitative master's students in computer science and statistics. They are comfortable with probability, conditioning, expected utility, and basic causal graphs, but they have never worked through decision theory beyond Newcomb's problem, and most of them treat Newcomb's problem as a parlour trick rather than as a diagnostic instrument. I want the session to get them to see what counterfactual mugging and XOR blackmail jointly establish: that the genuine choice point in such cases is between selecting an act and selecting a policy or decision procedure, and that once that distinction is in place, updatelessness — acting on branches of reality one knows one is not in — stops looking like superstition and begins to look like a stable stopping point.

  For reference, the two scenarios are, in compressed form. In counterfactual mugging, a perfect predictor flips a fair coin; if the coin lands tails it asks you for $100, and if it lands heads it pays you $10,000 just in case it predicted you would have paid had it landed tails. You are asked, so you know you are in the tails branch. In XOR blackmail, the predictor sends you a message just in case exactly one of the following holds: your house is infested with termites, or you will pay it $1,000; an infestation would cost you $1,000,000.

  I do not want you to write the explanation itself. I want a teaching plan: the order in which components must be introduced and why each depends on the previous one, the single worked example the session should return to, the misconceptions this audience will predictably form and where in the sequence each should be headed off, the closing check that would show the idea has landed rather than merely been tolerated, and what should be left out and openly flagged as omitted.

  Specifically, give me:

  1. The prerequisite idea that must be secured before either problem is intelligible — the thing which, if it is not in place, will make the students experience both cases as conjuring tricks rather than arguments.

  2. An ordering for the session. Should counterfactual mugging come before XOR blackmail, or the reverse? In what precise sense should the first case stage a problem for reasoning about acts, and the second a different problem for reasoning about evidence and correlation? Which intermediate notions (for example, pre-commitment as legitimate but unavailable in the posted choice; the difference between the probability of an act and the probability of a policy; prediction as correlation with the decision procedure rather than with the surface action) need to be built between the two cases, and why?

  3. One carrying example. Decide which of the two scenarios should serve as the spine of the session, and state what features it must have and must lack for the pedagogical point to survive — for instance, a fair coin rather than a logical fact, perfect prediction rather than merely statistical prediction, a one-shot choice rather than a repeated game, and a mixed-upside structure in which the benefit lands in the branch the agent knows it is not in. If the cleanest spine is a simplified common core of both scenarios rather than either standard version, specify that core.

  4. A misconception map. For each of the following predictable moves — and for any others you judge as pressing — say at which point in the sequence it should be addressed and how to address it without dismissing it: 'the predictor is impossible, so the problem floats on a false presupposition'; 'this is just Newcomb's problem with the labels changed'; 'I would pay only because it buys me a reputation as a cooperator'; 'XOR blackmail is simply correlation rather than causation, so the causal decision theorist is obviously right and that closes the matter'; 'the two problems are the same problem described twice'. Be specific about whether each misconception is best pre-empted by an example, by a modification of the carrying example, or by pausing the sequence and extending the current case.

  5. A closing check of understanding. Design a short exercise or question, answerable in five minutes without new machinery, that would distinguish a student who has genuinely grasped why the two problems push in opposite directions from a student who has merely learned to say 'choose the policy, not the act'. Say what a correct-but-shallow answer looks like and what a correct-and-deep answer adds.

  6. A conscious omission list. State which neighbouring topics — logical counterfactuals, proof-based decision theory, the formal differences among updateless, timeless, and functional decision theories, reflective oracles, or anything similar — you would explicitly decline to cover, and explain how drawing that boundary can itself reinforce the main point rather than deflate the session.

  Do not provide a reading list or citations; the plan should be built from the two scenarios themselves.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** Quantitative Master's students (CS/Stats). Comfortable with prob, conditioning, EU, basic causal graphs. *Not* comfortable with deep decision theory (beyond Newcomb's as a parlor trick).
      *   **Goal:** Show that Counterfactual Mugging (CM) and XOR Blackmail (XOR) jointly establish the Act vs. Policy distinction, making Updatelessness look stable rather than superstitious.
      *   **Constraint:** Do *not* write the explanation. Write a *teaching plan*.
      *   **Specific Deliverables:**
          1.  Prerequisite idea.
          2.  Session ordering (CM vs. XOR, intermediate notions).
          3.  One carrying example (spine).
          4.  Misconception map (addressing specific predictable moves).
          5.  Closing check (5-min exercise, shallow vs. deep answer).
          6.  Conscious omission list (what to leave out and why).

  2.  **Deconstruct the Core Argument:**
      *   The core tension is between Causal Decision Theory (CDT) / Evidential Decision Theory (EDT) and Updateless Decision Theory (UDT) / Functional Decision Theory (FDT).
      *   CM attacks CDT/EDT by showing that conditioning on being in the "bad" branch (Tails) leads to losing the "good" branch (Heads) payoff *ex-ante*. It highlights the time-inconsistency of updating.
      *   XOR Blackmail attacks EDT (specifically) and highlights the danger of conditioning on evidence that is *caused* by your decision procedure in a specific logical way. It shows that acting on evidence can be harmful when the evidence is correlated with the *action* via a predictor, not the *state*.
      *   Together, they show that you need to optimize the *source code* (policy), not the *output* (act) given current knowledge.
      *   For quant students, the key is framing this as an optimization problem over functions vs. optimization over values given fixed inputs.

  3.  **Drafting - Section by Section:**

      *   **1. Prerequisite Idea:**
          *   What makes these look like tricks? The idea that "I am here now, so I only care about this branch."
          *   Need to secure the distinction between *ex-ante* expected utility (before the coin flip/prediction) and *ex-post* expected utility (after updating).
          *   Actually, deeper: The distinction between *optimizing an output* vs. *optimizing the function that produces the output*. In CS terms: `optimize(action)` vs. `optimize(policy_function)`.
          *   *Decision:* The "Algorithm vs. Execution" distinction. They are CS students. They understand code. The agent is a program. The predictor predicts the program, not the specific run's randomness (if any).

      *   **2. Session Ordering:**
          *   CM first or XOR first?
          *   CM is conceptually simpler (coin flip). It attacks the "update on evidence" intuition directly. "I know it's tails, why pay?"
          *   XOR is more complex (logical correlation). It attacks the "evidential" intuition.
          *   *Decision:* CM first. It sets up the "Policy vs. Act" tension regarding *time* (ex-ante vs. ex-post). XOR second. It sets up the "Policy vs. Act" tension regarding *information* (correlation vs. causation).
          *   *Intermediate:* Need to bridge from "I wish I pre-committed" (CM) to "I must act *as if* I pre-committed even without the ability" (Updatelessness). Then move to XOR to show that even with causal graphs, standard conditioning fails if the node is "Decision Procedure."

      *   **3. Carrying Example:**
          *   The prompt asks to choose one or a simplified core.
          *   CM is better for the "Act vs. Policy" spine because the payoff structure is cleaner (Pay 100 to get 10k in the other branch). XOR involves a large loss ($1M) vs small loss ($1k), which distracts with risk aversion or magnitude comparisons.
          *   *Decision:* Use a unified "Predictor Protocol" spine. A generic setup where Omega simulates the agent's source code.
          *   *Refinement:* Let's stick to Counterfactual Mugging as the spine because it isolates the *update* problem most clearly. XOR can be introduced as a variation that breaks EDT specifically.
          *   *Wait, re-reading prompt:* "If the cleanest spine is a simplified common core... specify that core."
          *   *Better Decision:* Create a "Canonical Prediction Game."
              *   Agent has policy $P$.
              *   Predictor simulates $P$.
              *   Payoff depends on $P$'s output in specific counterfactuals.
              *   This abstracts away the "coin" vs "termites" flavor text and focuses on the dependency graph.
              *   *Actually, for teaching:* Flavor text helps. CM is the better spine. It's the standard introduction to Updatelessness. XOR is the "hard mode" that kills EDT. Let's use CM as the primary spine, but parameterize it so XOR fits into the same structure later.
              *   *Revised Decision:* Use Counterfactual Mugging as the spine. It directly targets the "I know I'm in Tails" intuition which is the biggest barrier to Updatelessness. XOR is the second case to show that causal graphs don't save you if you don't treat the decision as a logical fact.

      *   **4. Misconception Map:**
          *   "Predictor impossible": Address immediately. Treat as limit case / thought experiment about logical dependence.
          *   "Newcomb relabeled": Distinguish. Newcomb is about *box choice* (correlation with state). CM is about *payment* (causal action in one branch affecting payoff in another).
          *   "Reputation": Address in CM. It's one-shot. No reputation.
          *   "XOR is just correlation": This is the crux. Address in XOR section. CDT says "My paying doesn't cause termites." UDT says "My policy determines if the letter is sent."
          *   "Same problem twice": Distinguish. CM breaks CDT (causal links exist but are counterfactual). XOR breaks EDT (evidential links are spurious/manipulated).

      *   **5. Closing Check:**
          *   Need a 5-min exercise.
          *   Scenario: A variation where the coin is biased or the payoff changes.
          *   Better: A "Pre-commitment Test." Ask them to calculate EU *before* the coin flip vs *after*.
          *   *Idea:* Give them a modified CM where the coin is 99% Tails. CDT says "Don't pay" (obviously). UDT says "Pay" (if 1% of 10k > 99% of 100).
          *   *Deep vs Shallow:* Shallow says "Maximize ex-ante EU." Deep says "Because the predictor simulates my source code, my decision now *is* the decision in the counterfactual, so the probability of the payoff is conditional on my policy, not my current knowledge state."

      *   **6. Omission List:**
          *   Logical Counterfactuals (too technical).
          *   FDT vs UDT formalism (too semantic).
          *   Reflective Oracles (too advanced).
          *   *Why:* Keeps focus on the *motivation* for Updatelessness, not the *implementation*.

  4.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Prerequisite:* Make sure it's framed in CS terms. "Source Code" is the key metaphor.
      *   *Ordering:* CM -> Policy Distinction -> XOR -> Updatelessness.
      *   *Example:* Stick to CM as the main driver, but ensure the "Predictor" mechanism is defined identically for both to show the structural link.
      *   *Misconceptions:* Be specific on *how* to head them off. E.g., for "Impossible Predictor," use the "Limit of 99.9% accuracy" argument.
      *   *Closing Check:* Needs to be sharp. The "99% Tails" variant is good. It forces the math to show CDT fails even when the "magic" is rare.
      *   *Omissions:* Explicitly state that we are not solving *how* to compute logical counterfactuals, only *why* we need to.

  5.  **Final Review against Constraints:**
      *   No reading list? Check.
      *   No explanation text? Check.
      *   Address all 6 points? Check.
      *   Tone appropriate for Quant Masters? Yes, use terms like "objective function," "conditioning," "dependency graph."

  6.  **Writing the Output:** (Proceeding to generate the response based on these thoughts.)
      *   *Correction on Prerequisite:* The prompt asks for *the* prerequisite idea. I need to be singular and sharp. "The Agent as a Fixed Function."
      *   *Correction on Ordering:* Ensure the transition from CM to XOR is logical. CM shows why updating loses money. XOR shows why conditioning on evidence loses money. Both point to Policy.
      *   *Correction on Example:* I will define a "Canonical Prediction Structure" that encompasses both, but use CM as the primary walkthrough.
      *   *Correction on Misconceptions:* Ensure I address the "CDT is right on XOR" point carefully. CDT *is* right on XOR in the standard causal graph *unless* you node the decision procedure. That's the teaching point.
      *   *Correction on Closing:* Make sure the distinction between shallow and deep is clear. Shallow = "Precommitment is good." Deep = "My current output *is* the counterfactual output."

  7.  **Final Polish:** Check tone. Needs to be authoritative, structured, and pedagogical. Avoid fluff.

  *(Self-Correction during drafting Section 3)*: The prompt asks for *one* carrying example. I should decide if it's CM or XOR. CM is generally better for "Updatelessness" specifically. XOR is better for "EDT vs CDT". Since the goal is Updatelessness (acting on branches you know you aren't in), CM is the stronger spine. I will specify a "Parameterized Mugging" that can morph into XOR if needed, but primarily stay as CM. Actually, the prompt says "If the cleanest spine is a simplified common core... specify that." I think the "Common Core" is best. A generic "Predictor pays based on Policy Output in Counterfactual World" schema. This allows both to be instances. I will recommend this "Abstract Prediction Game" as the spine.

  *(Wait, reconsidering)*: Abstract might be too dry. CM is more intuitive for the "I know I'm in Tails" feeling. I'll stick with CM as the *primary* spine but define the Predictor mechanism such that XOR is clearly a sibling case. I'll specify CM as the spine for simplicity, as requested "Decide which of the two...". I'll choose CM.

  *(Re-evaluating Section 5)*: The closing check needs to distinguish "grasped why they push in opposite directions." CM pushes against CDT (causal link exists counterfactually). XOR pushes against EDT (evidential link is manipulated). A student who gets it sees that *both* require ignoring current indexical information.
  Okay, let's refine the closing check. A scenario where CDT and EDT disagree with each other, but UDT agrees with one of them for a different reason? No, keep it simple. A variant of CM where the probability is extreme.

  Okay, ready to write.
answer: |-
  1. **The Prerequisite Idea: The Agent as a Fixed Function**
     Before introducing either scenario, you must secure the conceptual shift from "Agent as a Momentary Decider" to "Agent as a Fixed Function." Quantitative students understand objects and methods. You must establish that the Predictor does not predict *what you will do* in the metaphysical sense; it simulates *the function you are*.
     
     If this is not in place, students will treat the Predictor as a magic box that guesses outputs, allowing them to argue that "my current choice is free from the simulation." You must define the agent $A$ as a deterministic (or stochastic) function $A(obs) \rightarrow act$. The Predictor has access to the source code of $A$. Therefore, the output of $A$ in the counterfactual branch is logically fixed by the same source code running in the actual branch. Without this "source code identity" premise, Counterfactual Mugging collapses into a request to pay for a past event, and XOR Blackmail collapses into a correlation fallacy. This prerequisite transforms the problem from "guessing a coin" to "optimizing a function."

  2. **Session Ordering and Intermediate Notions**
     **Order:** Counterfactual Mugging (CM) first, XOR Blackmail second.
     
     **Reasoning:**
     *   **CM (The Time/Update Problem):** CM attacks the validity of *conditioning on current knowledge*. It forces the student to confront the conflict between *ex-ante* expected utility (before the coin flip) and *ex-post* expected utility (after observing Tails). It establishes that updating on indexical information ("I am in the Tails branch") destroys value. This sets up the need for **Updatelessness**.
     *   **Intermediate Notion 1 (Pre-commitment vs. Updatelessness):** In CM, students will suggest "I should have pre-committed." You must pivot this to: "You cannot pre-commit now, but you can *act as if* you did." This distinguishes a binding contract (unavailable) from a decision procedure that outputs the same action in both branches (available).
     *   **XOR (The Evidence/Correlation Problem):** Once they accept that they should optimize the policy across branches (from CM), introduce XOR. XOR attacks the validity of *conditioning on evidence* even when causal graphs are clear. In XOR, CDT says "Don't Pay" (paying doesn't cause termites), and EDT says "Pay" (paying is evidence of no termites). Both fail. XOR shows that even if you accept the policy view from CM, you must treat your decision as a *logical fact* that influences the Predictor's message, not just a causal act.
     *   **Intermediate Notion 2 (Logical Correlation):** Between the cases, introduce the idea that the Predictor's output is correlated with the *decision procedure*, not the *action*. In CM, the correlation is across possible worlds. In XOR, the correlation is between the action and the state of the world *via the predictor*.
     *   **Synthesis:** CM shows why you must ignore *which world you are in*. XOR shows why you must ignore *what evidence you have*. Together, they establish that the only stable optimization target is the policy function itself, evaluated over the prior distribution of all logical possibilities.

  3. **The Carrying Example: Parameterized Counterfactual Mugging**
     Use **Counterfactual Mugging** as the spine, but strip it to a "Canonical Prediction Game" to allow XOR to be discussed as a structural variant without changing the setup language.
     
     **Features it Must Have:**
     *   **A Fair Coin (or Known Prior):** Essential to calculate the *ex-ante* EV clearly. If the probability is vague, students will hide behind ambiguity.
     *   **Perfect Prediction:** Do not start with 99% accuracy. Start with perfect simulation to establish the logical link. (You will relax this later for misconceptions).
     *   **One-Shot Interaction:** Explicitly forbid reputation arguments. This is a single function call.
     *   **Mixed-Upside Structure:** The payoff *must* occur in the branch the agent knows they are *not* in (Heads payoff collected while in Tails). This is the critical friction point. If the payoff were in the current branch, it becomes a standard investment problem.
     
     **Features it Must Lack:**
     *   **No "Termites" or Physical State:** Avoid the XOR flavor text for the spine. Keep the uncertainty purely about the coin and the Predictor's simulation. This isolates the "Update" problem from the "Causal Graph" problem.
     *   **No Repeated Games:** Prevents the "learning" or "training" heuristic.
     
     **Pedagogical Point:** This example survives because it isolates the *temporal* inconsistency of updating. XOR will be introduced later as a case where the *causal* graph is insufficient, but the spine remains the Mugging because the "I know I'm in Tails" intuition is the strongest barrier to Updatelessness.

  4. **Misconception Map**

     *   **'The predictor is impossible...'**
         *   **When:** Immediately after defining the spine.
         *   **How:** Do not argue metaphysics. Reframe as a limit case. "Assume the predictor is a copy of your source code running on a server. Is that impossible?" If they resist, offer a 99.9% accurate predictor. The math remains identical; the 'magic' is just high-fidelity simulation. This heads off the dismissal of the problem as fantasy.
     
     *   **'This is just Newcomb's problem with labels changed.'**
         *   **When:** During the CM analysis, when comparing EVs.
         *   **How:** Modify the carrying example. In Newcomb, the money is *already* in the box (past cause). In CM, the money is *created* conditional on the counterfactual action (logical dependency). Have them draw the causal graph. In Newcomb, the arrow goes Predictor $\rightarrow$ Box. In CM, the arrow goes Policy $\rightarrow$ Payoff (in both branches). This distinction is vital for understanding why CDT fails differently in each.
     
     *   **'I would pay only because it buys me a reputation...'**
         *   **When:** During the initial intuition pump for CM.
         *   **How:** Pre-empt this by explicitly defining the scenario as "One-Shot, Anonymous, No Recursion." If raised, pause and ask: "If I delete the reputation variable from your utility function, does the math change?" Force them to engage with the single-instance expected utility calculation.
     
     *   **'XOR blackmail is simply correlation... CDT is obviously right.'**
         *   **When:** Introducing XOR as the second case.
         *   **How:** Extend the carrying example. Show that if they apply the "Policy" logic from CM to XOR, they must Pay. Then ask: "Does paying *cause* the termites to vanish?" (No). "Does paying *cause* the letter?" (No, the letter is already sent). "Then why Pay?" The answer must be: "Because my Policy determines whether the letter was sent in the first place." This forces them to see that CDT's causal graph is missing the node "Decision Procedure."
     
     *   **'The two problems are the same problem described twice.'**
         *   **When:** Closing synthesis.
         *   **How:** Pause and extend the current case. Point out that CM breaks CDT because of *counterfactual* causality (across worlds), while XOR breaks EDT because of *manipulated* evidence (within a world). They converge on the same solution (Policy Optimization) but attack different failure modes of standard theories. This validates the need for a unified theory (UDT/FDT) rather than a case-by-case fix.

  5. **Closing Check of Understanding**
     **Exercise:** "The Biased Mugger."
     Present a modified Counterfactual Mugging. The coin is biased: 99% Tails, 1% Heads. Payoff is still \$100 (Tails) vs \$10,000 (Heads). The Predictor is perfect. You are in the Tails branch.
     **Question:** "Calculate the Expected Utility of the Policy 'Always Pay' vs. 'Never Pay' from the *ex-ante* perspective. Then, explain why a CDT agent in the Tails branch refuses to pay, and why that refusal is mathematically inconsistent with the *ex-ante* calculation."
     
     **Correct-but-Shallow Answer:** "Ex-ante, 'Always Pay' yields $0.99(-100) + 0.01(10000) = -99 + 100 = +1$. 'Never Pay' yields 0. So you should pre-commit. But in the Tails branch, CDT says the Heads money is gone, so paying costs 100 for nothing. The shallow student stops here, viewing it as a 'time inconsistency' tragedy."
     
     **Correct-and-Deep Answer:** Includes the shallow math but adds: "The CDT agent fails because it treats its current action as independent of the Heads branch. The deep answer recognizes that the agent *is* the policy function. The output of the function in the Tails branch *is* the output in the Heads branch because the source code is identical. Therefore, refusing to pay in Tails *causes* the loss of the Heads payoff logically, not causally. The inconsistency isn't just a regret; it's a calculation error where the agent ignores the logical dependency of the payoff on its own source code."

  6. **Conscious Omission List**
     **Omit:**
     *   **Logical Counterfactuals / Proof-Based Decision Theory:** Do not explain *how* to compute the counterfactual "If I paid, then Heads..." formally (e.g., via modal logic or proof length).
     *   **FDT vs. UDT vs. TDT Semantics:** Do not distinguish between Functional, Updateless, or Timeless Decision Theory. Treat them as a single cluster of "Policy-Based Decision Theory."
     *   **Reflective Oracles:** Do not discuss how to handle predictors that are smarter than the agent or infinite loops.
     
     **Reasoning:**
     *   **Reinforcement:** Including these would shift the session from "Why do we need this?" to "How do we build this?" Your goal is to sell the *necessity* of the policy distinction, not the *implementation*.
     *   **Boundary:** Explicitly state: "We are not solving the halting problem today. We are assuming the dependency exists and asking how to optimize given that assumption." This reinforces the main point: the conceptual shift (Act vs. Policy) is the hard part; the formalism is just engineering. It prevents students from getting bogged down in technical impossibility proofs and keeps the focus on the decision-theoretic instability of standard updating.
