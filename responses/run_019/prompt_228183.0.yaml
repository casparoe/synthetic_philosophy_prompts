prompt: |-
  So I had this huge argument with a mate last Saturday that went on until about 2am. It started with her saying she'd recently gone off coffee she'd loved for years, and I (smugly, regrettably) brought up Dennett's Chase and Sanborn — the two coffee tasters in his "Quining Qualia" essay, one of whom says the coffee tastes exactly the same as ever but his preferences have changed, while the other insists his preferences are unchanged and it's the taste itself that's shifted. My friend was adamant she'd just *know* which one she was, from the inside, no further question. I said that's precisely the intuition Dennett thinks won't survive scrutiny. We went round in circles and I'm not sure either of us argued it brilliantly, tbh.

  Annoyingly, the timing is terrible, because I've now got to run our department's reading group for second-year philosophy students next week, and the topic is basically this: whether qualia are an incoherent posit. The students have done a first-year mind module, so they've met Mary and the inverted spectrum and mostly come away qualia-friendly. I don't need the argument explained to me — I need a plan for how to teach it in ninety minutes. What has to be in place first before the Chase and Sanborn case can do any work (I'm guessing they need the naive picture of qualia as the way things seem to you, cleanly separable from your judgements and reactions to those seemings, but maybe something needs to come even before that?). Then: which example should carry the session. Should I lead with both tasters or just one of them, or is there a better everyday case to build the whole thing around — and what does the carrying case need to have and to lack so students don't dodge it? Also the misconceptions I should expect and where in the sequence to head each one off: my guess is they'll first hear Dennett as denying that experience exists at all, then dismiss him as a reheated verificationist, then decide the whole thing just trades on fallible memory (which I think misses Sanborn, whose memory is meant to be fine). Tell me at which point in the plan each of those gets defused rather than letting them fester.

  Finally, I want one question to ask at the end that shows whether the idea has actually landed — something like getting them to construct a case where "my qualia changed" and "my reaction to my qualia changed" come apart, where success is them realising they can't, but maybe you have a better suggestion. And tell me what I should openly refuse to cover at this level (the later replies, the inverted spectrum, heterophenomenology?) and say so, rather than letting the session sprawl. Basically: help me teach this better than I argued it at 2am.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy instructor (likely university level, given "department's reading group for second-year philosophy students").
      *   **Context:** Had a personal argument about Dennett's "Quining Qualia" (specifically the Chase and Sanborn case) with a friend. Lost the argument (or felt it was unresolved). Now needs to teach this topic.
      *   **Task:** Create a 90-minute lesson plan on "whether qualia are an incoherent posit," focusing on Dennett's approach.
      *   **Specific Needs:**
          *   Prerequisites needed before Chase & Sanborn works.
          *   Which example to use (Chase/Sanborn vs. others).
          *   Handling misconceptions (Dennett denies experience, verificationism, fallible memory).
          *   Timing of defusing misconceptions.
          *   Final assessment question.
          *   What to explicitly exclude (scope creep).
      *   **Tone:** Professional, pedagogical, slightly empathetic about the 2am argument, rigorous but practical.

  2.  **Deconstruct the Philosophical Content:**
      *   **Topic:** Dennett's "Quining Qualia."
      *   **Core Argument:** Qualia (as traditionally defined: ineffable, intrinsic, private, directly apprehensible) are incoherent.
      *   **Key Case:** Chase and Sanborn (coffee tasters).
          *   Chase: Taste same, preference changed.
          *   Sanborn: Preference same, taste changed.
          *   Dennett's Point: There is no fact of the matter distinguishing them *if* we strip away behavioral/dispositional evidence. The "inner glow" is a myth.
      *   **Target Audience:** 2nd-year students. They know Mary (Knowledge Argument) and Inverted Spectrum. They are "qualia-friendly."
      *   **Goal:** Move them from "Qualia are obvious" to "Qualia might be incoherent."

  3.  **Drafting the Lesson Plan - Section by Section:**

      *   **Phase 1: Setup & Prerequisites (0-15 mins):**
          *   *Problem:* Students think qualia = "what it's like." Dennett attacks a specific *definition*.
          *   *Action:* Define the "Traditional View" (The Four Marks: Ineffable, Intrinsic, Private, Directly Apprehensible). This is crucial. If they don't accept this definition, Dennett misses.
          *   *Misconception Check:* Dennett isn't denying consciousness (eliminativism about *experience*), just the *philosophical construct* of qualia. Address this early.

      *   **Phase 2: The Core Case - Chase & Sanborn (15-45 mins):**
          *   *Decision:* Use *both* tasters. The tension between them is the point.
          *   *Setup:* Need to isolate them from external verification.
          *   *The Trap:* Students will say "Ask them!" or "Scan their brains!"
          *   *The Constraint:* Must stipulate that all physical/functional facts are identical or inaccessible. The distinction must be *purely* phenomenological.
          *   *Misconception Check:* Memory. Sanborn isn't forgetting. It's about the *nature* of the judgment, not the reliability of memory. Address this when they raise the "maybe he just forgot" objection.

      *   **Phase 3: The Argumentative Move (45-65 mins):**
          *   *The Pivot:* If there's no behavioral difference, and no physical difference (ex hypothesi), is there a *fact*?
          *   *Verificationism Charge:* Students will call Dennett a verificationist.
          *   *Defense:* It's not "meaningless if unverifiable," it's "incoherent if it makes no difference to the subject's own narrative." It's about the *authority* of the first-person perspective crumbling.
          *   *Activity:* Breakout groups? Or guided discussion? Let's go with guided Socratic dialogue to keep control.

      *   **Phase 4: Assessment & Wrap-up (65-90 mins):**
          *   *Final Question:* Needs to test if they understand the *inseparability* of judgment and experience.
          *   *Exclusions:* Heterophenomenology (too technical), Inverted Spectrum (they know it, but Dennett reinterprets it, don't get bogged down), Hard Problem (distinct issue).

  4.  **Refining the Misconception Strategy:**
      *   *Denial of Experience:* Address in Intro. "Dennett loves consciousness, hates qualia."
      *   *Verificationism:* Address during the Chase/Sanborn analysis. Distinguish between "unverifiable by others" vs. "no fact of the matter even for the subject."
      *   *Memory:* Address specifically regarding Sanborn. It's not memory failure; it's the instability of the "seeming."

  5.  **Developing the Final Question:**
      *   User suggestion: "Construct a case where qualia changed vs reaction changed."
      *   Critique: Good, but might be too abstract.
      *   Improvement: Make it concrete. "The Wine Test." Ask them to describe a change in taste that *doesn't* involve a change in discrimination or preference. If they can't, the point lands.
      *   Better Idea: The "Instant Qualia Swap." If qualia are intrinsic, could they swap without you noticing? If you can't notice, do they exist?
      *   Best Idea (aligned with user's intuition): Ask them to define the difference between "The coffee tastes different" and "I react differently to the coffee" *without* referencing behavior or judgment. The silence that follows is the win.

  6.  **Review against Constraints:**
      *   90 minutes? Yes, timing looks tight but doable.
      *   2nd year level? Yes, assumes prior knowledge of Mary/Inversion.
      *   Address the 2am argument? Acknowledge it in the tone (empathize with the difficulty).
      *   What to exclude? Explicitly list Heterophenomenology, Neurophilosophy details, and the Hard Problem.

  7.  **Final Polish:**
      *   Structure the output clearly (Pre-requisites, Timeline, Misconception Map, Exclusions, Final Question).
      *   Ensure the tone is supportive ("You didn't argue badly, the material is hard").
      *   Make sure the "Chase and Sanborn" mechanics are clear (why both are needed).

  8.  *(Self-Correction during drafting)*: Wait, I need to make sure I don't just summarize Dennett. The user asked for a *teaching plan*. I need to give them *instructions* on what to do, not just what to say. I need to highlight *when* to stop them from going down rabbit holes.
      *   *Adjustment:* Add "Instructor Notes" for each section.
      *   *Adjustment:* Be specific about the "Definition of Qualia" handout/slide. That's the linchpin.

  9.  *(Final check on the 2am argument)*: The user's friend said "I'd just know." Dennett says "No you wouldn't." The lesson needs to show *why* "just knowing" fails. The "Judgment vs. Experience" collapse is the key.

  10. **Finalizing the Output Structure:**
      *   Introduction (Validating the struggle).
      *   Pre-requisites (The Definition).
      *   The 90-Minute Arc (Breakdown by time).
      *   Misconception Defusal Map (Where to kill the zombies).
      *   The Final Question (The "Trap").
      *   The "Do Not Enter" Zone (Exclusions).

