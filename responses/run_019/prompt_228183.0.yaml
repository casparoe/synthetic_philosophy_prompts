answer: |-
  First, commiserations on the 2am argument. The reason you didn't "win" isn't that you argued poorly; it's that Dennett's position is designed to feel like a category error to anyone who hasn't already surrendered the Cartesian Theater. Your friend's intuition ("I'd just know") is exactly the intuition Dennett is trying to dissolve. You can't dissolve an intuition in a pub; you need a seminar room.

  Here is a 90-minute lesson plan designed to move second-years from "Qualia are obvious" to "Qualia might be a philosophical fiction," without triggering the usual defensive reflexes.

  ### 1. The Pre-Requisites (What must be on the board first)

  You are correct that they need the "naive picture," but it needs to be more specific than "the way things seem." If you let them define qualia as "conscious experience," Dennett looks like a lunatic. You must lock them into the **Traditional Four Marks** of qualia early.

  **Slide 1: The Target Definition**
  Before mentioning Dennett, write this up. Tell them: *"When philosophers attack qualia, they aren't attacking consciousness. They are attacking a specific theoretical construct defined by these four properties."*
  1.  **Ineffable:** Cannot be fully communicated.
  2.  **Intrinsic:** Non-relational properties (they are what they are, regardless of context).
  3.  **Private:** Interpersonal comparisons are impossible.
  4.  **Directly Apprehensible:** To have them is to know you have them (incorrigibility).

  **Why this matters:** If they don't accept this definition, Chase and Sanborn won't work. Dennett's argument is: *If* qualia are these four things, *then* they are incoherent. He is granting the definition to show it breaks.

  ### 2. The 90-Minute Arc

  **00:00 – 00:15: Setup & Distinction**
  *   **Activity:** Briefly recap Mary and Inverted Spectrum. Ask: *"What work are qualia doing in these arguments?"* (Answer: They are the 'leftover' fact that physicalism misses).
  *   **The Pivot:** Introduce Dennett's distinction: **Consciousness vs. Qualia.**
  *   **Key Script:** "Dennett is not an eliminativist about consciousness. He thinks we are conscious. He is an eliminativist about *qualia* as a philosophical posit. Think of it like 'phlogiston.' Heat exists; phlogiston doesn't. Experience exists; qualia (as defined above) might not."
  *   **Defuse Misconception #1 (Denial of Experience):** Stop them here. If anyone says "But I *feel* things," reply: "Dennett agrees. He feels things too. The question is whether that feeling has the four properties above."

  **00:15 – 00:45: The Chase and Sanborn Case**
  *   **Decision:** Use **both** tasters. Using one allows the students to treat it as a simple case of change. Using both creates a paradox of authority.
  *   **The Setup:** Present the case carefully.
      *   *Chase:* "The coffee tastes the same (qualia unchanged), but I don't like it anymore (preference changed)."
      *   *Sanborn:* "I like coffee as much as ever (preference unchanged), but it tastes different now (qualia changed)."
  *   **The Constraint:** This is where students will try to dodge. You must stipulate: *"Assume there is no physical difference in their tongues, no difference in their brain states, and no difference in their behavioral discrimination (they sort the beans exactly the same way)."*
  *   **The Question:** "Is there a fact of the matter about which one is right?"
  *   **Discussion:** Let them wrestle. They will want to say "Ask them!" Remind them: They *are* being asked. Chase says X, Sanborn says Y. Their reports are identical (both report a change in the total situation), but they *interpret* the locus of change differently.
  *   **Defuse Misconception #2 (Memory):** When they say "Sanborn just forgot what coffee used to taste like," shut it down. *"Dennett stipulates memory is perfect. The point is that even with perfect memory, the distinction between 'the taste changed' and 'my reaction to the taste changed' has no anchor."*

  **00:45 – 01:05: The Argumentative Squeeze**
  *   **The Move:** Explain Dennett's *Judgment vs. Experience* collapse.
  *   **Concept:** We think there is a "Seeming" (Qualia) and then a "Judgment about the Seeming." Dennett argues the Seeming *just is* the Judgment (or a disposition to judge).
  *   **Activity:** Ask the class: *"Describe the difference between 'The coffee tastes bitter' and 'I am disposed to say the coffee tastes bitter' without using the word 'taste' or 'experience'."*
  *   **Defuse Misconception #3 (Verificationism):** They will say: "This is just verificationism. Just because we can't measure it doesn't mean it's not there."
      *   *Response:* "It's not about *other people* measuring it. It's about whether the subject can make sense of it. If the 'inner glow' makes no difference to how you judge, remember, or act, in what sense is it 'there'? Dennett isn't saying 'unverifiable = false,' he's saying 'explanatorily idle = incoherent'."

  **01:05 – 01:20: Application & Pushback**
  *   Allow them to try to save qualia. Common moves: "What about pain?" "What about red?"
  *   Guide them to apply the Four Marks. "Is pain ineffable? No, we talk about it. Is it intrinsic? Or is it a signal to withdraw?"
  *   Keep the focus on the *structure* of the claim, not the specific sensation.

  **01:20 – 01:30: The Final Assessment**
  *   (See below for the specific question).

  ### 3. Misconception Defusal Map

  | Misconception | When it arises | How to head it off (The Script) |
  | :--- | :--- | :--- |
  | **"Dennett denies experience exists."** | **Intro (00:00-00:15).** | "Dennett calls himself a 'realist about consciousness.' He denies the *infrastructure* we usually build around it. Don't let him off the hook by thinking he's a zombie." |
  | **"It's just bad memory."** | **Chase/Sanborn (00:30).** | "Sanborn remembers perfectly. The issue is whether 'taste' is a stable object that memory tracks, or whether the 'taste' is constituted by the current reaction." |
  | **"This is just Verificationism."** | **Argument (00:50).** | "Verificationism says 'If *others* can't check it, it's meaningless.' Dennett says 'If *you* can't distinguish it from a judgment, it's not a separate thing.' It's about ontology, not semantics." |
  | **"He's ignoring the Hard Problem."** | **Wrap up (01:15).** | "He's dissolving the Hard Problem by denying the 'Easy' problems leave a remainder. We won't solve Chalmers today; we're looking at whether the 'remainder' is coherent." |

  ### 4. The Final Question (The "Trap")

  You suggested asking them to construct a case where qualia change but reactions don't. That is good, but students might waffle. Here is a sharper version designed to force the collapse.

  **The Question:**
  > "Imagine a pill that swaps your qualia for coffee with your qualia for tea, but leaves all your discriminatory abilities, memories, and preferences exactly as they are. You still reach for coffee in the morning, say 'this is coffee,' and enjoy it.
  >
  > **Did the pill do anything?**
  >
  > If you say **Yes**: What difference does it make, given that every physical and functional fact is identical?
  > If you say **No**: Then in what sense were 'coffee qualia' ever a distinct thing from 'disposition to drink coffee'?"

  **Why this works:**
  *   If they say **Yes**, they are committed to epiphenomenal qualia (which they usually hate).
  *   If they say **No**, they have conceded Dennett's point (that qualia add nothing to the functional story).
  *   **Success Condition:** You want them to realize they *cannot* describe the difference without smuggling in a behavioral or dispositional difference. The silence *is* the understanding.

  ### 5. The "Do Not Enter" Zone (Scope Control)

  To keep this to 90 minutes, you must explicitly bracket the following. Put this on a slide at the start.

  1.  **Heterophenomenology:** Do not explain Dennett's positive method. It's too methodological and will distract from the ontological argument about qualia. Tell them: *"We are looking at his critique, not his alternative methodology."*
  2.  **The Inverted Spectrum (Deep Dive):** They know it from Year 1. Do not let them re-litigate whether inversion is possible. Use it only as a foil: *"Dennett thinks the Inverted Spectrum is impossible for the reasons we just discussed with Chase and Sanborn. We aren't debating inversion today; we're debating the premises that make inversion seem possible."*
  3.  **Neuroscience:** Do not let them retreat to "Brain scans will tell us." Dennett's point is conceptual. Even a perfect brain scan wouldn't show "intrinsic qualia" if qualia are incoherent.
  4.  **The Hard Problem:** Explicitly state: *"We are not solving the Hard Problem. We are asking if the 'gap' physicalism is supposed to bridge is actually a mirage."*

  ### Instructor Note for the 2am Feeling
  When you teach this, acknowledge the frustration. Tell the students: *"This argument feels like it's missing the point. That feeling is the resistance of your own intuition fighting the argument. Dennett wants you to feel that tension."*

  If you frame the discomfort as part of the lesson, you validate their confusion without validating their rejection of the argument. Good luck. You'll do better than 2am.
