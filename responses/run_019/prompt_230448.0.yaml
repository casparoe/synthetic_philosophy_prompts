      *Re-evaluating Dan 3:* Is it *mistaken* to say it borrows moral weight? No, it does. Is it *mistaken* to say we should resist? That's normative. Let's call it "In Between" because it highlights a genuine danger (apology as absolution without repair) even if his semantic claim is weak.

      *Re-evaluating Maya 2:* Is it *Clearly Right*? It's the standard view in transitional justice. I'll stick with "Mostly Right" to allow for nuance.

      *Refining the "Missing" section:* Need to mention the concept of "Intergenerational Justice" explicitly. Also the distinction between *Guilt* and *Responsibility*. Dan conflates them; Maya separates them.

      *Refining the "Verdict Changer":* The strongest counter to Maya is if the apology is used to *foreclose* further claims. If the PM says "We apologized, stop asking for land back," Dan is vindicated.

  8.  **Final Polish:** Check tone. Ensure all constraints of the prompt are met. (Move by move, overall verdict, missing pieces, uncertainty).

