  7.  **Final Polish:** Organize with clear headings corresponding to the user's four questions for readability. (Proceed to generate output based on this structure.)

      *(Self-Correction Note: Make sure to emphasize that Einstein's essay is short and somewhat unsystematic, which invites misreading, but the warnings about bureaucracy are explicit.)*

