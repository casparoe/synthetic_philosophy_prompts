      *Wait, C1 says "catastrophe of the first order."* If the badness is only about *our* disappointed hopes, is it a catastrophe of the first order? Or just a sadness for us? C1 implies the loss is objective, not just subjective disappointment. If I revise C5, I might weaken C1.
