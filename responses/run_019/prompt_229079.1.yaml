answer: |-
  This is not an odd observation at all. In fact, you have independently rediscovered one of the central debates in the philosophy of mind and affective neuroscience. You are asking about the relationship between **cognition** (what we think/believe) and **affect** (what we feel).

  Here is the breakdown of the name, the split, the theory, and the definition you asked for.

  ### 1. The Name: "Recalcitrant Emotions"

  There is a settled term in philosophy for exactly what you are describing. It is called a **Recalcitrant Emotion**.

  A recalcitrant emotion is defined as an emotional experience that persists despite the subject holding a sincere, conscious judgment that contradicts the content of that emotion.
  *   **Your Case:** You judge "Flying is safe," but you feel "Flying is dangerous."
  *   **The Conflict:** The emotion refuses to align with the judgment.

  In psychology, you might hear this referred to as a lack of **cognitive penetrability**, or described through **Dual-Process Theory** (System 1 vs. System 2). But "Recalcitrant Emotion" is the specific label for the phenomenon where the feeling stubbornly ignores the fact.

  ### 2. The Split: Why did the anger vanish but the fear stay?

  You asked where the line falls. The line falls between **Propositional Emotions** and **Perceptual/Associative Emotions.**

  **The Anger (Propositional/Cognitively Penetrable)**
  Your anger at your sister was based on a narrative judgment: *"She disregarded me."* This is a high-level cognitive interpretation of intent.
  *   **Mechanism:** This relies on your Prefrontal Cortex (PFC). It processes language, logic, and narrative.
  *   **The Switch:** When you received the new fact ("She was in hospital"), your PFC updated the narrative instantly. *"She did not disregard me; she was incapacitated."* Because the emotion was tethered to that specific thought, when the thought died, the emotion died.
  *   **Verdict:** This emotion was **cognitively penetrable**. It allowed facts to penetrate and change it.

  **The Fear (Perceptual/Cognitively Impenetrable)**
  Your fear of flying is not based on a calculation of odds. It is based on evolutionary hardware.
  *   **Mechanism:** This relies heavily on the Amygdala and the insula. These are older brain structures designed for survival, not statistics. They process *visceral cues* (enclosed space, lack of control, engine noise, turbulence) rather than *propositional truths* (statistical safety).
  *   **The Stubbornness:** To your amygdala, being 30,000 feet in a metal tube violates a primal safety heuristic: *"Heavy things should not be in the air without support."* No amount of statistical data convinces the amygdala, because the amygdala doesn't speak "statistics." It speaks "sensory association."
  *   **Verdict:** This emotion is **cognitively impenetrable** (to a degree). It operates on a different channel than your conscious beliefs.

  ### 3. Can Emotions Still Be "Judgments"?

  You asked if the stubbornness proves emotions *aren't* judgments.
  Strict **Cognitivism** (the theory that emotions *are* judgments) struggles here. If fear *is* the judgment "This is dangerous," you shouldn't be able to judge "This is safe" and feel fear simultaneously. That would be holding two contradictory beliefs at once.

  However, philosophers have rescued the idea by shifting the analogy. The most successful rescue is the **Perceptual Theory of Emotion.**

  **The Optical Illusion Analogy**
  Consider the Müller-Lyer illusion: two lines of equal length, one with arrows pointing in, one with arrows pointing out.
  *   **The Judgment:** You measure them. You *know* (judge) they are the same length.
  *   **The Perception:** They *look* different lengths.
  *   **The Conflict:** Does your visual perception vanish because you know the truth? No. The illusion persists despite the knowledge.

  Recalcitrant emotions work the same way.
  *   **Anger** is like looking at a map. If you erase a road on the map (the fact about your sister), the route changes.
  *   **Fear** is like the optical illusion. Even if you know the lines are equal (the plane is safe), they still *look* unequal (the plane feels dangerous).

  So, emotions are not necessarily *judgments* (active conclusions); they are more like *perceptions of value*. You can perceive danger (fear) even while judging safety (statistics), just as you can perceive unequal lines while judging equality.

  ### 4. A Sharp Definition (and the Guilt Test)

  You asked for a definition sharp enough to test other cases, specifically guilt. Here is a operational definition of a **Recalcitrant Emotion**:

  > **Definition:** An emotional state is recalcitrant if and only if:
  > 1. The subject consciously and sincerely holds a belief that negates the "formal object" of the emotion (e.g., safety negates fear; lack of responsibility negates guilt).
  > 2. The emotional response persists with significant intensity.
  > 3. The persistence is not due to a lack of understanding of the belief, but due to a disconnect between the belief system and the affective system.

  **The Test Case: Guilt over something not your fault.**
  *   *Scenario:* You survive a car accident; the other driver dies. You feel guilty.
  *   *Belief:* "I did not cause this. It was not my fault." (Conscious judgment).
  *   *Emotion:* "I am responsible/I am bad." (Guilt).
  *   *Application:*
      *   Does the belief negate the formal object of guilt? Yes (Guilt requires responsibility; you judge you have none).
      *   Does the emotion persist? Yes (Survivor's guilt).
      *   **Verdict:** This **is** a Recalcitrant Emotion.

  **Counter-Test: Guilt over something you *did* do.**
  *   *Scenario:* You steal a candy bar.
  *   *Belief:* "I stole this."
  *   *Emotion:* Guilt.
  *   **Verdict:** This is **not** recalcitrant. The emotion matches the judgment.

  ### Summary

  1.  **Name:** **Recalcitrant Emotion.**
  2.  **The Split:** The line falls between emotions driven by **narrative evaluation** (anger at sister, penetrable by facts) and emotions driven by **associative/evolutionary conditioning** (fear of flying, impenetrable by facts).
  3.  **Judgment Theory:** Emotions are better understood as **perceptions** (like optical illusions) rather than **judgments** (like math problems). This explains why knowledge doesn't always dissolve feeling.
  4.  **Guilt:** Yes, irrational guilt fits the definition of recalcitrance perfectly.

  Your intuition was spot on. The fact that your anger vanished proves some emotions *are* thoughts. The fact that your fear stayed proves some emotions *are not*. The human mind is not a single unified system; it is a coalition of different systems that don't always talk to each other.
