      *   *The "Announcement" Trap:* An early disclaimer ("I am an AI") might satisfy the letter of the law, but if the subsequent behavior is indistinguishable from a human for 10 minutes, does the disclaimer hold? (The prompt suggests this is a risk case).
      *   *The "Obvious Robot" Trap:* If it sounds robotic but doesn't announce, is it a violation? If a reasonable person *wouldn't* believe it's human, maybe no disclosure is needed. But if Grandma thinks it's human, disclosure is needed.
