  *(Refining the "Grandma" aspect)*: If Grandma recognizes it, it suggests it's *not* passing as human. But the law says "reasonable customer." Is Grandma the reasonable customer? Usually, "reasonable person" is an objective standard. If the voice is clearly robotic, the standard isn't met. I will classify Agent 2 as a "Pass" on the behavioral test but a "Fail" on the Safety Policy because voice tech improves and today's "obvious" is tomorrow's "convincing." Actually, better to be safe: If it *can* complete tasks without the user questioning it, it needs disclosure. I'll lean towards requiring disclosure to be safe.

