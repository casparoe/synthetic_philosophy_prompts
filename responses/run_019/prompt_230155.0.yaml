          *   *Analysis:* No disclosure. Voice is synthetic. But would a "reasonable customer" believe it's human? If Grandma recognizes it, maybe not. But what about a non-tech-savvy user?
          *   *Verdict:* Fail (Violation). "Grandma test" is anecdotal. If the voice is convincing enough to complete a task without triggering suspicion, it's a risk. Better to force disclosure.

