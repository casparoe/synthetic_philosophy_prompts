answer: |-
  # Handout: Decision Architecture Self-Assessment
  **Week 1: Mapping Your Intuitions**

  **Instructions:** Read each scenario carefully. Choose the option that best matches what you would actually do (not what you think is "rational" in the abstract). There are no right answers yet; we are mapping your starting position.

  ***

  ### 1. The Predictor's Boxes
  A being with a near-perfect track record has placed money in two boxes based on a prediction of your choice made yesterday. Box A is opaque. Box B is transparent and contains $1,000.
  *   If the being predicted you would take **only Box A**, they put $1,000,000 in it.
  *   If they predicted you would take **Both Boxes**, they left Box A empty.
  You do not know what is in Box A. Do you take only Box A, or both boxes?
  *   **A)** Take only Box A.
  *   **B)** Take both boxes.
  > *Note: Choosing A suggests you treat your choice as evidence of the past prediction; Choosing B suggests you treat the money as fixed regardless of your choice.*

  ### 2. The Pleasure Drug
  A genetic factor causes both a lethal disease and a strong craving for a specific drug. The drug itself is harmless and feels wonderful, but people with the gene die young. You have not been tested yet. Do you take the drug?
  *   **A)** No, taking it increases the likelihood I have the gene.
  *   **B)** Yes, taking it doesn't cause the gene, and I want the pleasure.
  > *Note: Choosing A suggests you avoid actions correlated with bad outcomes; Choosing B suggests you only avoid actions that cause bad outcomes.*

  ### 3. The Stranded Traveler
  You are stranded in a desert. A driver offers a ride to the city, but only if they predict you will pay them $100 once you arrive. The driver is highly accurate at reading people. Once you are safely in the city, the driver asks for the money. Do you pay?
  *   **A)** No, I am safe now and paying gains me nothing.
  *   **B)** Yes, I pay because that is what I committed to doing to get rescued.
  > *Note: Choosing A suggests you optimize based on your current situation; Choosing B suggests you optimize based on the policy required to get the ride.*

  ### 4. The Coin Flip Offer
  A being flips a fair coin. If it lands Heads, they ask you for $100. If it lands Tails, they give you $10,000, but *only if* they predicted beforehand that you *would have given* the $100 had the coin landed Heads. The coin landed Heads. Do you pay the $100?
  *   **A)** No, the coin is already Heads, so I can't get the $10,000.
  *   **B)** Yes, because being the kind of person who pays is the only way to win in the Tails world.
  > *Note: Choosing A suggests you ignore counterfactual scenarios that didn't happen; Choosing B suggests you value consistency across possible worlds.*

  ### 5. The Glass Boxes
  Same setup as Question 1, but the boxes are made of glass. You can see that Box A contains $1,000,000. The being predicted your choice before filling the boxes. Do you take only Box A, or both boxes?
  *   **A)** Take both boxes (the million is already there).
  *   **B)** Take only Box A (taking both would mean the million was never there).
  > *Note: Choosing A suggests you act on the visible evidence; Choosing B suggests you act on the policy that determines what evidence is visible.*

  ### 6. The Mirror Match
  You are playing a one-round game against an exact copy of yourself, created from the same source code and given the same information. You both choose "Cooperate" or "Defect" simultaneously. If both Cooperate, you both get $1,000. If one Defects, the defector gets $1,500 and the cooperator gets $0. If both Defect, you both get $100. What do you choose?
  *   **A)** Defect (my choice doesn't causally change theirs).
  *   **B)** Cooperate (since we reason identically, my choice determines theirs).
  > *Note: Choosing A suggests you view yourself as causally isolated; Choosing B suggests you view your decision as a logical output shared by duplicates.*

  ### 7. The Precommitment Fee
  You know that tomorrow you will be offered a temptation that will cost you $1,000 in the long run. Today, you can pay a $50 fee to bind yourself so you cannot accept the temptation tomorrow. Do you pay the fee?
  *   **A)** No, tomorrow I will make the best choice in the moment.
  *   **B)** Yes, my future self cannot be trusted to stick to the optimal plan.
  > *Note: Choosing A suggests you trust sequential optimization; Choosing B suggests you trust a global policy over local optimization.*

  ### 8. The Threat Response
  A blackmailer sends you a letter: "I will release damaging information unless you pay me. I only sent this letter because I predicted you would pay." Do you pay?
  *   **A)** Yes, paying prevents the damage.
  *   **B)** No, paying confirms the prediction and invites future threats.
  > *Note: Choosing A suggests you minimize immediate loss; Choosing B suggests you minimize loss by managing your reputation as a target.*

  ***

  ## Scoring Key

  Tally your answers. Be honest—this is for your own diagnostic.

  **The Correlationist (Evidential Profile)**
  *   **Primary Answers:** 1(A), 2(A), 3(A), 4(A), 5(A), 6(B), 7(A), 8(A).
  *   **Pattern:** You generally avoid actions that are *bad news* (Q1, Q2) but you optimize based on the evidence currently available to you (Q3, Q4, Q5). You see decision-making as updating probabilities based on your act.
  *   **Key Trait:** You One-Box in standard cases but Two-Box when you can see the money.

  **The Causalist (Causal Profile)**
  *   **Primary Answers:** 1(B), 2(B), 3(A), 4(A), 5(A), 6(A), 7(A), 8(A).
  *   **Pattern:** You only care about what your action physically *causes* in the world. You ignore correlations that aren't causal (Q2) and you ignore predictions made in the past (Q1, Q3, Q4).
  *   **Key Trait:** You Two-Box in almost everything and refuse to pay for past predictions or counterfactual consistency.

  **The Architect (Policy/Updateless Profile)**
  *   **Primary Answers:** 1(A), 2(B), 3(B), 4(B), 5(B), 6(B), 7(B), 8(B).
  *   **Pattern:** You choose the *rule* or *algorithm* that produces the best outcomes globally, even if it requires sacrificing local gains. You decide as if you are choosing before you know the specific details of the scenario (Q3, Q4, Q5).
  *   **Key Trait:** You One-Box even when you can see the money, and you pay in counterfactual scenarios to maintain a winning policy.

  ***

  ## Caveats & Limitations

  **1. The "Architect" Leaf Merges UDT and FDT**
  This quiz classifies "Updateless" and "Functional" decision theories under the same leaf (The Architect). While Functional Decision Theory (FDT) makes specific technical claims about logical counterfactuals and source code that Updateless Decision Theory (UDT) does not always specify, both diverge from Causal and Evidential theories in the exact same ways on *these* specific questions (specifically Q3, Q4, and Q5). Separating them would require scenarios involving logical uncertainty rather than physical prediction, which is beyond the scope of a Week 1 diagnostic.

  **2. Indistinguishable Pairs**
  Be aware that in many standard real-world situations, all three theories give the same advice. For example, in Question 2 (The Drug), The Causalist and The Architect agree (Take the drug), while The Correlationist disagrees. Conversely, in Question 1 (Opaque Boxes), The Correlationist and The Architect agree (One-box), while The Causalist disagrees. The quiz only successfully separates them in "precommitment wedge" cases (Q3, Q4, Q5) where the optimal action depends on what you *would have done* before seeing the evidence. If you found yourself agreeing with The Architect on Q1 but The Causalist on Q5, your intuitions may be inconsistent or context-dependent.

  **3. The Empty Leaf**
  You may notice there is no scoring path for someone who answers 1(B) [Two-Box] but 3(B) [Pay Hitchhiker]. This combination is theoretically unstable: if you believe your choice can influence a past prediction enough to pay the Hitchhiker, you should also One-Box in Question 1. If you occupy this space, you likely hold a hybrid view that requires further examination to resolve the contradiction between your treatment of physical causation and logical prediction. Almost nobody naturally occupies the "Pure Policy" leaf (The Architect) without study; it is often an acquired taste because it requires acting against immediate self-interest to satisfy a global constraint.
