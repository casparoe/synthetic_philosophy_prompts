answer: |-
  **Project Title:** Counterfactual Robustness as a Constraint on Moral Implementation

  **Research Question**
  Functionalist accounts of moral status depend on physical systems implementing specific computations. However, the "implementation triviality" argument suggests that any physical system (e.g., a stone) can be mapped onto any finite-state machine given a sufficiently gerrymandered interpretation. If implementation is this cheap, attributions of moral status based on computational structure become vacuous. My project asks: **Does imposing a requirement of counterfactual robustness on the implementation relation successfully distinguish morally relevant computations from trivial mappings?**

  I am not attempting to solve the hard problem of consciousness or defend functionalism itself. Rather, I aim to determine if a modal constraint—specifically, that a system must support appropriate counterfactual state transitions rather than merely actual ones—can rescue functionalist ethics from the triviality objection within the scope of one semester.

  **The Gap in Existing Approaches**
  Current literature offers three families of responses to implementation triviality, all of which leave the ethical question unresolved. First, purely behavioral criteria fail to distinguish between a system that processes information and a lookup table that merely retrieves pre-computed outputs; both are behaviorally identical, yet intuitively differ in moral status. Second, standard causal-role functionalism without further constraints remains vulnerable to triviality arguments: if causal roles are defined only over actual events, a stone's physical states can be mapped to computational states post-hoc. Third, deflationary or interpretivist responses suggest implementation is always observer-relative. While metaphysically coherent, this makes moral status observer-dependent, implying that a system's suffering exists only relative to an interpreter's mapping choice—a conclusion ethically untenable for welfare policy regarding AI or organoids. None of these approaches successfully isolate a physical property that grounds moral status independent of arbitrary mapping.

  **Method and Work Plan**
  I will employ conceptual analysis through the construction of formalized thought experiments. The grant funds will buy out my teaching obligations for one semester, allowing full-time focus on argument construction and drafting. I will not conduct empirical surveys or fieldwork.

  *   **Month 1: Formalizing the Criterion.** I will define the "Counterfactual Robustness Criterion" (CRC). The core task is to specify exactly what kind of counterfactual support is required. Does the system need to respond correctly to *all* possible inputs, or only those within a relevant neighborhood? I will produce a 15-page working paper defining the CRC and distinguishing it from standard dispositionalism.
  *   **Month 2: Test Case 1 (Lookup Tables vs. Algorithms).** I will construct paired cases: a standard algorithmic agent and a behaviorally equivalent lookup table. I will argue that the lookup table fails the CRC because it lacks internal states that would vary correctly under counterfactual inputs not actually received. The output will be a draft section demonstrating how CRC excludes lookup tables while retaining standard agents.
  *   **Month 3: Test Case 2 (Scattered and Intermittent Systems).** I will test the CRC against systems where computation is spatially scattered (e.g., states implemented by distinct rocks thrown at different times) or intermittently active. This tests whether CRC prevents "gerrymandered" physical realizations. The output will be a draft section analyzing whether spatial/temporal continuity is required for counterfactual support.
  *   **Month 4: Test Case 3 (Grain Size) and Full Draft.** I will examine systems that implement the same function at different physical grain sizes (e.g., neural vs. silicon). I will integrate the previous sections into a complete manuscript draft (approx. 8,000 words).
  *   **Month 5: Revision and Submission.** I will refine the argument against potential objections (e.g., that counterfactuals are themselves mapping-relative) and prepare the paper for submission to a peer-reviewed journal.

  **Justification of Approach**
  This conceptual approach is necessary because empirical surveys of ordinary intuitions cannot resolve metaphysical implementation questions. Lay intuitions about whether a robot is "really" thinking are inconsistent and often track surface behavior rather than underlying causal structure. Similarly, simply stipulating a criterion and defending it by intuition begs the question against the triviality argument; the stipulation must do argumentative work to block the mapping objection. By focusing on the modal structure of the system itself, rather than observer interpretations or actual behavior, this project targets the specific logical漏洞 (loophole) that makes functionalist ethics vulnerable to triviality.

  **Risk and Failure Conditions**
  The primary risk is that the Counterfactual Robustness Criterion collapses into one of the failed approaches it aims to replace.
  1.  **Collapse into Behaviorism:** If the counterfactuals are defined solely by potential outputs rather than internal state transitions, the criterion fails to distinguish lookup tables from algorithms.
  2.  **Circularity:** If defining the "relevant" counterfactuals requires prior knowledge of which systems are sentient, the criterion is circular.
  3.  **Persistence of Triviality:** If a mapping can be constructed that makes a stone satisfy the CRC (e.g., by treating every physical micro-state as a counterfactual branch), the project fails to solve the implementation problem.

  In the event of failure, the project will still yield a salvageable negative result: a rigorous demonstration that modal constraints alone are insufficient to ground moral implementation. This would clarify that functionalist ethics requires a non-computational physical constraint (e.g., biological naturalism or specific causal powers), narrowing the search space for future work. The final paper would be reframed as a proof of the inadequacy of modal functionalism for ethics.
