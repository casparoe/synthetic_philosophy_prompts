      *(Refining the Inconsistency)*: The prompt asks to identify desiderata that appear jointly unsatisfiable. The classic tension is between **Determinacy** (fixing specific content like 'fly' vs 'dark spot') and **Pure Historical Selection** (selection is often blind to the specific distinction). Also, **Historical Necessity** vs. **Learned Novelty**. I will focus on the History vs. Learning tension as it's central to the "Star" and "Swampman" cases.

      *(Refining the Scorecard)*: Keep definitions tight. One or two sentences.

