          *   Info+Func: Good on determinacy, bad on error (false positives).
          *   Learning: Good on novelty, bad on historical necessity (Swampman).

  6.  **Review against Constraints:**
      *   *No citations:* Check.
      *   *Numbered desiderata:* Check.
