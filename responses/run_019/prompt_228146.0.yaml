  # Specification for a Teleosemantic Theory of Mental Content

  ## Introduction
  This document specifies the adequacy conditions for a teleosemantic theory of mental representation. The goal is to naturalize content by grounding it in biological function without relying on unreduced intentional notions. The following desiderata are not a survey of existing views but a set of constraints any robust theory must address. Each desideratum includes a philosophical motivation, a concrete test case, and a classification of its status within the project of naturalization.

  ---

  ## Desiderata

  ### 1. The Determinacy Constraint (Distal vs. Proximal)
  *   **Motivation:** A naturalistic theory must explain how a mechanism comes to represent a specific state of affairs rather than any of the causally correlated conditions sufficient to trigger it. Without this, content collapses into a disjunction of all causes, eliminating the possibility of error.
  *   **Test Case:** A frog's visual neuron fires for small, dark, moving specks and triggers a snap. Evolutionarily, snapping at flies aided survival; snapping at shadows or pellets did not. The causal trigger is "dark moving spot," but the biological target is "fly."
  *   **Requirement:** The theory must assign the content *fly* (or *food*) rather than *dark moving spot*, and it must explicitly rule out the disjunctive content *fly-or-shadow-or-pellet*. It must distinguish the proximal stimulus from the distal object of consumption.
  *   **Classification:** **Non-negotiable.** Any theory claiming to explain representation must solve the disjunction problem; otherwise, it explains nothing more than causal covariance.

  ### 2. The Misrepresentation Constraint (Adaptive Error)
  *   **Motivation:** Representation entails the possibility of falsehood. However, biological systems are often selected for reliability, not truth. A theory must distinguish between a system functioning correctly but yielding a false signal (due to environmental noise) and a system malfunctioning.
  *   **Test Case:** An animal possesses a "danger detector" selected because false alarms were metabolically cheap while missed dangers were fatal. The mechanism frequently fires in the absence of predators (false positives), yet this high error rate is adaptive.
  *   **Requirement:** The theory must classify these false positives as misrepresentations (representing *predator* when none is present) despite their adaptive value. It cannot define content such that the signal is veridical whenever it contributes to fitness.
  *   **Classification:** **Non-negotiable.** If adaptive success guarantees truth, the concept of representation becomes redundant with the concept of fitness.

  ### 3. The Historical Individuation Constraint
  *   **Motivation:** Teleosemantics grounds meaning in etiology. If content is determined by selection history, then identical mechanisms with different histories should possess different contents.
  *   **Test Case:** Two lineages possess physically indistinguishable heat-sensitive mechanisms. In Lineage A, the mechanism was selected because warm rocks indicate shelter. In Lineage B, it was selected because body heat indicates prey. Current causal profiles overlap substantially.
  *   **Requirement:** The theory must assign different contents (e.g., *shelter* vs. *prey*) based on the distinct selection histories, even if current operations and causal covariations are identical.
  *   **Classification:** **Distinctive Commitment.** This is specific to teleosemantics. Causal or functional role theories would deny this, but a teleosemantic theory must embrace historical individuation to maintain its core thesis.

  ### 4. The Acquired Content Constraint (Learning)
  *   **Motivation:** Organisms represent novel features of their environment within their lifetimes. A theory restricted solely to phylogenetic history cannot account for the flexibility of mind.
  *   **Test Case:** An animal learns to use the position of a specific star for navigation. Neither the animal nor its lineage has an evolutionary history of representing that specific star.
  *   **Requirement:** The theory must explain how this state acquires representational content. It must either show how this derives from evolutionarily established functions (e.g., a general learning mechanism) or explain how ontogenetic processes can generate new teleofunctions.
  *   **Classification:** **Methodological Preference.** Hardline teleosemanticists may treat this as derived content, but a comprehensive theory of mind should account for the novelty of learned representation without reducing it to mere causal association.

  ### 5. The Historical Necessity Constraint (The Swampman)
  *   **Motivation:** If content is constituted by history, an entity without history cannot have content. This tests the strength of the externalist commitment.
  *   **Test Case:** A perfect molecular duplicate of an organism is produced accidentally (e.g., by quantum fluctuation). It has no ancestors and no selection history. Its internal states guide behavior identically to the original.
  *   **Requirement:** The theory must decide whether the duplicate possesses representational states. If it says "no," it must accept that intrinsic duplicates can differ in mental content. If it says "yes," it must identify a non-historical basis for content, potentially abandoning pure teleosemantics.
  *   **Classification:** **Distinctive Commitment.** Standard teleosemantics dictates the duplicate has no content. Accepting this consequence is required for theoretical consistency, even if counterintuitive.

  ### 6. The Structural Complexity Constraint
  *   **Motivation:** Human and animal thought involves relations, negations, and modalities, not just simple stimulus detection. A theory limited to "detectors" is insufficient for a general theory of mind.
  *   **Test Case:** An organism acts on contents such as *same individual as before*, *enough food*, *predator absent*, or *permissible action*.
  *   **Requirement:** The theory must provide a combinatorial or structural account that allows for negative content (*predator absent*), relational content (*same as*), and normative content (*permissible*). It cannot rely solely on the presence of a stimulus.
  *   **Classification:** **Non-negotiable.** A theory that only explains simple perception fails to naturalize thought.

  ### 7. The Normative Distinction Constraint (Error vs. Malfunction)
  *   **Motivation:** Not all failures of behavior are representational errors. A system can represent accurately but fail to act, or act successfully via a non-representational reflex.
  *   **Test Case:** Distinguish between: (a) A mechanism misrepresenting a shadow as a fly (representational error); (b) A mechanism failing to fire due to damage (malfunction); (c) A mechanism successfully guiding behavior via a purely causal reflex arc without representation (non-representational success).
  *   **Requirement:** The theory must provide criteria to distinguish representational norms (conditions of satisfaction) from biological norms (health/efficiency) and mere causal success.
  *   **Classification:** **Non-negotiable.** Without this distinction, the theory cannot isolate the specific phenomenon of intentionality.

  ---

  ## Substantive Inconsistency: The Novelty-Etiology Tension

  A critical analysis of the desiderata reveals a tension between **Desideratum 3 (Historical Individuation)**, **Desideratum 5 (Historical Necessity)**, and **Desideratum 4 (Acquired Content)**.

  1.  **The Conflict:** If content is strictly constituted by phylogenetic selection history (Desideratum 3 & 5), then novel learned content (Desideratum 4) is problematic. For the star-navigation case, there is no specific selection history for *that star*.
  2.  **The Dilemma:**
      *   *Option A:* Claim the content is not *that star* but rather *reliable navigational cue*, derived from an ancient learning mechanism. This preserves Historical Necessity but sacrifices the intuition that the animal represents the specific star (violating the spirit of Desideratum 4).
      *   *Option B:* Allow ontogenetic learning to create new teleofunctions. This satisfies Desideratum 4 but weakens Desideratum 5, as it allows content to arise without ancestral selection, edging closer to use-based theories.
  3.  **Result:** A teleosemantic theory cannot simultaneously maintain a **strict ancestral history requirement** (Swampman has no content) and a **robust account of novel learned content** (Star navigation is genuinely new content) without modifying the definition of "function." The theory must either accept that learned content is always derivative (limiting cognitive novelty) or admit that selection history can be generated within a lifetime (blurring the line between teleosemantics and functional role semantics). This is not a flaw to be stipulated away but a substantive boundary condition of the naturalization project.

  ---

  ## Scorecard of Approaches

  The following evaluates four distinct teleosemantic strategies against the specification above.

  **1. Producer-Selection Account**
  *Definition:* Content is determined by the conditions under which the producing mechanism was historically selected to indicate states of affairs.
  *   **Determinacy:** Pass. Can distinguish *fly* from *spot* based on what was consumed.
  *   **Misrepresentation:** Pass. False signals are errors if they deviate from selected conditions.
  *   **Historical Individuation:** Pass. Twin lineages have different contents based on different selection pressures.
  *   **Acquired Content:** Fail. Struggles to assign content to novel learned associations without ancestral history.
  *   **Historical Necessity:** Pass. Swampman lacks content (consistent).
  *   **Complexity:** Weak. Difficult to generate negative or relational content from simple producer functions.
  *   **Normative Distinction:** Pass. Clear distinction based on proper function of the producer.

  **2. Consumer- (Success-) Based Account**
  *Definition:* Content is determined by the conditions required for the downstream consuming mechanism to successfully perform its selected function.
  *   **Determinacy:** Weak. Can struggle with distal content if the consumer succeeds with proximal cues (e.g., snapping at shadows works sometimes).
  *   **Misrepresentation:** Pass. Handles adaptive error well; false alarms are errors if they don't meet consumer conditions for success.
  *   **Historical Individuation:** Pass. Depends on the history of the consumer system.
  *   **Acquired Content:** Moderate. Can accommodate learning if the consumer's success conditions shift via plasticity.
  *   **Historical Necessity:** Pass. Swampman lacks consumers with history, thus no content.
  *   **Complexity:** Moderate. Better at handling action-oriented content (e.g., *permissible action*).
  *   **Normative Distinction:** Pass. Norms are set by the success conditions of the consumer.

  **3. Informational Account + Biological Function**
  *Definition:* Content is established when a causal covariation (information) is locked in by a biological function to carry that information.
  *   **Determinacy:** Pass. Function selects which covariation constitutes the content.
  *   **Misrepresentation:** Weak. Struggles with the "Danger Detector" case; if the function is to alarm, frequent false alarms may look like the system is functioning correctly.
  *   **Historical Individuation:** Pass. History locks the specific information relation.
  *   **Acquired Content:** Moderate. Learning can lock in new information relations if guided by reward functions.
  *   **Historical Necessity:** Pass. No history means no locking, so Swampman has no content.
  *   **Complexity:** Weak. Negation and modality are difficult to model as information carriers.
  *   **Normative Distinction:** Pass. Malfunction is failure to carry the locked information.

  **4. Learning- (Use-) Based Account**
  *Definition:* Content is derived from reward systems that reinforce specific neural pathways, allowing individual history to generate new functions.
  *   **Determinacy:** Moderate. Depends on what the reward system tracks; risks collapsing into behavioral success.
  *   **Misrepresentation:** Pass. Can model error as failure to secure reward despite signal.
  *   **Historical Individuation:** Fail. May assign identical content to twin lineages if current learning histories match, violating strict teleosemantic externalism.
  *   **Acquired Content:** Pass. Best suited for the star-navigation case.
  *   **Historical Necessity:** Fail. Likely grants content to Swampman if it can learn, violating the etiology constraint.
  *   **Complexity:** Pass. Flexible enough to model complex, relational thought via cognitive architecture.
  *   **Normative Distinction:** Weak. Norms are based on reinforcement, which may blur the line between "true" and "rewarding."

  ### Summary Evaluation
  *   **Producer-Selection** is the most historically consistent but fails on cognitive novelty.
  *   **Consumer-Based** offers the best handling of error norms but risks indeterminacy.
  *   **Informational+Function** provides strong determinacy but struggles with adaptive false positives.
  *   **Learning-Based** solves the novelty problem but sacrifices the historical necessity that defines the teleosemantic project.

  **Conclusion:** No single approach satisfies all desiderata without trade-off. The **Novelty-Etiology Tension** identified above is confirmed: approaches that satisfy Historical Necessity (1, 2, 3) fail Acquired Content, while the approach that satisfies Acquired Content (4) fails Historical Necessity. A complete theory must explicitly resolve this trade-off.
