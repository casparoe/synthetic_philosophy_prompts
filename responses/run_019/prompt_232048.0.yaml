  after the poem, give me a json object with these fields:
  - "form": the form and rhyme scheme you used
  - "refrain_lines": the two refrain lines as they first appear
  - "turn": which stanza is the volta, and what the repetition does at that point
  - "two_senses_of_can": the two senses and which refrain belongs to which
  - "heaviest_line": the single line that best carries the resolution
  - "possible_quibble": one thing a lewisian might say is slightly off or oversimplified
