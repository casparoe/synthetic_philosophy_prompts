prompt: |-
  I am a novelist revising a speculative novel populated by animals, engineered creatures, artificial intelligences, and human societies, and I keep making intelligence serve the plot rather than arise from a creature’s actual cognitive equipment. I would like to operationalize a useful distinction among four kinds of minds: Darwinian creatures, whose effective responses are built in by selection; Skinnerian creatures, which can modify their behavior through reward and punishment during their lifetimes; Popperian creatures, which can test possible actions in an internal model before risking them; and Gregorian creatures, whose thinking is extended by language, symbols, institutions, and other culturally inherited tools. Treat these as capacities that may coexist in different degrees, not as four sealed species or as a ranking from less valuable to more valuable minds.

  Please develop a reusable character-design and revision procedure that I can apply to any fictional agent in about twenty minutes. It should provide an ordered sequence of diagnostic questions, specify what kinds of behavioral evidence would count as sufficient answers, and show how to distinguish superficially similar achievements—for example, avoiding a trap because of an inherited reflex, because of past punishment, because of rehearsing the outcome internally, or because one has learned a warning convention. Include tests for mixed and borderline systems, such as collectives, artificial agents, children, and beings whose internal simulation depends on an external notation. I would also like the procedure to enforce what I call counterfactual debt: whenever a character displays a cognitive ability, the fiction must identify the evolutionary history, learning history, imaginative practice, or cultural infrastructure that could plausibly have paid for it; otherwise the ability should be flagged as an authorial convenience. Mark the places where the classification is genuinely underdetermined and where a novelist must make a principled imaginative choice rather than discover a fact.

  Conclude by applying the procedure to three cases from my draft: a bioengineered guard animal that rapidly learns patrol routes but cannot conceive of a disguised threat; a swarm whose colonies appear brilliantly prescient because unsuccessful subcolonies die while successful ones proliferate, although no member represents the future; and my beloved alien oracle, whom I had imagined as a Gregorian supermind but whose every answer is generated from ancestral simulations fixed in its genome, with no capacity to learn after birth or borrow concepts from others. If the procedure assigns the oracle a less exalted kind of mind than I intended, do not rescue my preference; explain the result and then suggest the smallest change to the oracle’s history or mechanisms that would support the richer characterization. Finally, state what kinds of narrative mistakes the procedure can prevent, what it cannot settle about consciousness or moral status, and how it should be used as a revision tool without flattening fictional minds into a taxonomy.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Novelist revising a speculative novel (animals, engineered creatures, AIs, humans).
      *   **Problem:** Intelligence serves the plot rather than arising from cognitive equipment (plot-induced stupidity/genius).
      *   **Framework:** Dennett's four kinds of minds (Darwinian, Skinnerian, Popperian, Gregorian). *Crucial Constraint:* Treat these as coexisting capacities, not sealed species or value rankings.
      *   **Deliverable:** A reusable character-design/revision procedure (approx. 20 mins per agent).
      *   **Components:**
          *   Ordered sequence of diagnostic questions.
          *   Behavioral evidence standards.
          *   Distinction tests (e.g., reflex vs. learning vs. simulation vs. culture).
          *   Tests for mixed/borderline systems (collectives, AIs, children, externalized cognition).
          *   "Counterfactual Debt" enforcement (pay for abilities with history/infrastructure).
          *   Identification of underdetermined areas (where authorial choice is needed).
      *   **Application:** Apply to three specific draft cases:
          1.  Bioengineered guard animal (learns routes, misses disguised threats).
          2.  Swarm colony (selectionist success, no internal representation).
          3.  Alien Oracle (thought to be Gregorian, actually Darwinian/fixed).
      *   **Constraint on Oracle:** Do not rescue the preference immediately; explain the result, *then* suggest the smallest change to support the richer characterization.
      *   **Conclusion:** Limitations (narrative mistakes prevented vs. consciousness/moral status unsettled) and usage advice (avoid flattening).

  2.  **Deconstruct the Framework (Dennett's Creatures):**
      *   *Darwinian:* Pre-wired, evolutionary trial and error (across generations).
      *   *Skinnerian:* Operant conditioning, trial and error within a lifetime.
      *   *Popperian:* Internal simulation, "let my hypotheses die in my stead."
      *   *Gregorian:* Cultural tools, language, external memory, scaffolding.
      *   *Key Nuance:* They stack. A human is all four. A robot might be Skinnerian + Popperian but not Darwinian (in the biological sense).

  3.  **Drafting the Procedure (The "Cognitive Audit"):**
      *   *Time Limit:* Needs to be tight. 20 minutes.
      *   *Structure:* Step-by-step.
      *   *Step 1: The Action.* Identify the specific intelligent act.
      *   *Step 2: The Four Filters.* Run the act through D, S, P, G.
      *   *Step 3: Counterfactual Debt.* Where is the cost paid?
      *   *Step 4: Borderline/Mixed Checks.*
      *   *Step 5: Underdetermination.* Where do I need to make stuff up?

      *Refining the Questions:*
      *   D: Did ancestors die to make this possible? Is it hard-coded?
      *   S: Did *this* individual suffer/receive reward to learn this?
      *   P: Did it imagine a failure without actually failing?
      *   G: Did it use a tool, word, or social norm created by others?

      *Refining Counterfactual Debt:*
      *   If it acts Popperian, show the neural/cognitive capacity for simulation.
      *   If it acts Gregorian, show the cultural artifact.
      *   If missing, flag as "Plot Convenience."

  4.  **Developing the Distinction Tests:**
      *   *Trap Avoidance:*
          *   Darwinian: Won't step on the grate (instinct).
          *   Skinnerian: Stepped once, got shocked, now avoids.
          *   Popperian: Sees grate, simulates shock, avoids.
          *   Gregorian: Reads sign "Danger," or was told by peer.

  5.  **Addressing the Three Cases:**
      *   *Case 1: Guard Animal.* Learns routes (Skinnerian/Popperian mix?) but misses disguised threats (lack of abstract modeling?).
      *   *Case 2: Swarm.* Success via death of failures. Classic Darwinian selection at the colony level. No internal representation.
      *   *Case 3: Oracle.* Intended: Gregorian Supermind. Reality: Ancestral simulations fixed in genome. This is Darwinian (or perhaps very sophisticated pre-loaded Popperian, but if it can't learn/new symbols, it's not Gregorian).
      *   *Oracle Fix:* To make it Gregorian, it needs to ingest *new* symbols or culture, not just run old simulations.

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the goal (cognitive consistency).
      *   *The Procedure:* "The Cognitive Architecture Audit."
      *   *Phase 1: Isolate the Competence.* (2 mins)
      *   *Phase 2: The Four-Filter Diagnostic.* (8 mins) - The core questions.
      *   *Phase 3: Counterfactual Debt Collection.* (5 mins) - Paying the cost.
      *   *Phase 4: Borderline & Mixed Systems.* (3 mins) - Swarms, AIs, etc.
      *   *Phase 5: Underdetermination Log.* (2 mins) - Where to invent.
      *   *Application to Cases:*
          *   Guard Animal: Skinnerian/Popperian hybrid.
          *   Swarm: Pure Darwinian (at colony level).
          *   Oracle: Darwinian (mislabeled). Fix: Add capacity for external symbol ingestion.
      *   *Conclusion:* Limitations and Advice.

  7.  **Refining the "Counterfactual Debt" Concept:**
      *   This is the user's specific term. I need to make sure it's central. It means: "If you claim X ability, you must show the history/structure that makes X possible."
      *   Example: If a dog speaks (Gregorian), show the vocal modification or the teaching history.

  8.  **Refining the Oracle Analysis:**
      *   *Current State:* Ancestral simulations fixed in genome. This is essentially Darwinian pre-computation. It looks like wisdom, but it's instinct.
      *   *Verdict:* Darwinian creature with a very complex phenotype.
      *   *Fix:* To be Gregorian, it needs to interface with *other* minds' tools. Maybe it reads the visitors' questions as *new* data that modifies its internal state permanently, or it uses a language it didn't evolve with. The prompt asks for the *smallest* change.
      *   *Idea:* The simulations aren't fixed; they are *run* on hardware that accepts external symbolic input which alters the simulation parameters. It borrows concepts.

  9.  **Review against Constraints:**
      *   *20 minutes?* The procedure needs to be concise enough.
      *   *Not a ranking?* Emphasize that Darwinian isn't "worse," just different.
      *   *Underdetermination?* Explicitly mark where the science stops and art begins.
      *   *Consciousness?* Explicitly state this procedure doesn't solve qualia.

  10. **Final Polish:**
      *   Tone: Professional, collaborative, analytical.
      *   Formatting: Clear headings, bullet points for readability.
      *   Check the "Guard Animal" analysis: It learns routes (Skinnerian) but can't conceive disguised threats (limits on Popperian abstraction).
      *   Check the "Swarm" analysis: It's selectionist. No individual mind needs to be smart.
      *   Check the "Oracle" analysis: Be firm. It's not Gregorian.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe the Oracle is Popperian?
      *   *Correction:* If the simulations are "fixed in its genome," it can't generate *new* hypotheses. It's running pre-loaded scenarios. That's Darwinian pre-computation. To be Popperian, it needs to generate *novel* internal tests. To be Gregorian, it needs cultural tools.
      *   *Make sure to emphasize:* The procedure is a revision tool, not a straightjacket. Don't flatten the magic.

  12. **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  # The Cognitive Architecture Audit: A Revision Procedure

  This procedure is designed to take approximately twenty minutes per character or agent. Its goal is not to judge the "value" of a mind but to ensure cognitive consistency. It treats the four categories (Darwinian, Skinnerian, Popperian, Gregorian) as overlapping layers of capacity. A human possesses all four; a robot might possess only two.

  ## Phase 1: Isolate the Competence (2 Minutes)
  Select a specific scene or beat where the agent demonstrates intelligence, solves a problem, or makes a choice.
  *   **Action:** What exactly did the agent do? (e.g., "Avoided the trap," "Answered the riddle," "Flanked the enemy.")
  *   **Stakes:** What would have happened if they failed?
  *   **Draft Note:** Write down the specific ability being displayed.

  ## Phase 2: The Four-Filter Diagnostic (8 Minutes)
  Run the action through the following filters. You are looking for the *primary* mechanism, acknowledging that others may support it. Answer **Yes/No** and cite **Textual Evidence**.

  **1. The Darwinian Filter (Selectionist)**
  *   *Question:* Is this response pre-computed by evolutionary or design history? Would a newborn/newly-activated unit do this without experience?
  *   *Evidence:* Reflexes, fixed action patterns, hard-coded algorithms, instinctual fears.
  *   *Distinction:* If the agent dies upon failure, it is likely Darwinian (selection happens across generations/units, not within the individual).

  **2. The Skinnerian Filter (Conditioning)**
  *   *Question:* Did *this* individual learn this through direct consequence (reward/punishment) in its own lifetime?
  *   *Evidence:* Hesitation before repeating a mistake, seeking known rewards, habituation to noise.
  *   *Distinction:* If the agent must actually touch the fire to learn it burns, it is Skinnerian.

  **3. The Popperian Filter (Simulation)**
  *   *Question:* Did the agent reject a course of action because it *imagined* a negative outcome without experiencing it?
  *   *Evidence:* Pausing to "think," testing a door handle gently before committing weight, running "what-if" scenarios.
  *   *Distinction:* If the agent avoids the fire because it *looks* like the fire that burned it yesterday (Skinnerian) vs. because it understands heat transfer (Popperian).

  **4. The Gregorian Filter (Cultural/Symbolic)**
  *   *Question:* Did the agent use tools, language, symbols, or institutional knowledge created by others to solve this?
  *   *Evidence:* Reading a map, asking for advice, using a mathematical notation, following a law.
  *   *Distinction:* If the agent avoids the fire because a sign said "DANGER" or a parent said "Hot," it is Gregorian.

  ## Phase 3: Counterfactual Debt Collection (5 Minutes)
  This is the consistency check. For every "Yes" in Phase 2, you must identify the "cost" paid in the fiction. If you cannot identify the cost, flag it as **Authorial Convenience**.

  *   **Darwinian Debt:** Show the evolutionary pressure or design specification. *Where is the code or the gene?*
  *   **Skinnerian Debt:** Show the learning history. *Has the character had time to learn this? Did we see the training?*
  *   **Popperian Debt:** Show the internal modeling capacity. *Does the brain/hardware have the resolution to simulate this outcome?*
  *   **Gregorian Debt:** Show the cultural infrastructure. *Who made the tool? How does the agent access the symbol system?*

  **Rule:** If a character displays a Gregorian ability (e.g., complex strategy) but has no Gregorian debt (no language, no teachers, no tools), you must either cut the ability or pay the debt.

  ## Phase 4: Borderline & Mixed Systems (3 Minutes)
  Check for special cases that confuse the filters.

  *   **The Swarm:** Is the intelligence in the individual or the collective? If the individual dies upon error, the *colony* is Darwinian, even if the result looks Popperian.
  *   **The Externalized Mind:** Does the agent think *with* a notebook or network? If the notebook is taken away, does the intelligence vanish? If so, the Gregorian capacity is external, not internal.
  *   **The Child/Novice:** A human child is Darwinian (reflexes) + Skinnerian (learning) + budding Popperian. They are not yet fully Gregorian until they master symbols.
  *   **The Engineered Agent:** A robot might be Darwinian (hardware limits) + Popperian (simulation software) but lack Skinnerian (no pain/reward system) or Gregorian (no cultural integration).

  ## Phase 5: The Underdetermination Log (2 Minutes)
  Science cannot tell you everything. Mark the places where you must make an imaginative choice.
  *   **The Black Box:** Where the internal mechanism is unknowable to the reader (or the character).
  *   **The Threshold:** Where Skinnerian conditioning becomes Popperian insight. (This is often a gradient, not a line).
  *   **Decision:** Record your authorial choice here. "I am choosing to treat this as Popperian for thematic reasons, even if Skinnerian is plausible."

  ***

  # Application to Draft Cases

  Here is the audit applied to the three specific agents from your manuscript.

  ### Case 1: The Bioengineered Guard Animal
  *   **Action:** Rapidly learns patrol routes; fails to detect disguised threats.
  *   **Diagnostic:**
      *   *Darwinian:* Yes. Basic locomotion and threat response are likely hard-coded.
      *   *Skinnerian:* Yes. "Rapidly learns routes" implies trial and error or reinforcement during its lifetime.
      *   *Popperian:* No/Low. It cannot simulate a threat it hasn't seen. It lacks the model to conceive of "disguise."
      *   *Gregorian:* No. It does not use maps or communicate the disguise to others.
  *   **Counterfactual Debt:**
      *   *Paid:* The learning curve (Skinnerian) is supported by its design for adaptability.
      *   *Paid:* The failure (disguise) is supported by the lack of abstract modeling capacity.
  *   **Verdict:** **Consistent.** This is a Skinnerian creature with Darwinian base hardware. The limitation (missing disguised threats) is a feature of its cognitive ceiling. It does not need to be "smarter" for the plot; its stupidity is structurally sound.

  ### Case 2: The Swarm Colony
  *   **Action:** Colonies appear prescient; unsuccessful subcolonies die, successful ones proliferate.
  *   **Diagnostic:**
      *   *Darwinian:* Yes (at the colony level). The "learning" happens via death and replication, not internal processing.
      *   *Skinnerian:* No. Individual members do not learn; they are expendable.
      *   *Popperian:* No. The prompt states "no member represents the future."
      *   *Gregorian:* No. No cultural transmission, only genetic/code replication.
  *   **Counterfactual Debt:**
      *   *Paid:* The "prescience" is an illusion created by selection. The debt is paid by the corpses of the failed subcolonies.
  *   **Verdict:** **Consistent.** This is a classic Darwinian machine. The narrative risk here is anthropomorphizing the swarm as "knowing." Ensure the narration describes the *result* (success) without attributing *intent* to the collective.
  *   **Underdetermination:** You must choose: Does the swarm *feel* like a mind to the observers? That is a thematic choice, not a cognitive fact.

  ### Case 3: The Alien Oracle
  *   **Action:** Provides profound answers generated from ancestral simulations fixed in its genome. No post-birth learning or concept borrowing.
  *   **Diagnostic:**
      *   *Darwinian:* **Yes.** The simulations are "fixed in its genome." This is pre-computed evolutionary trial and error.
      *   *Skinnerian:* **No.** "No capacity to learn after birth."
      *   *Popperian:* **No.** It runs simulations, but they are *ancestral*, not novel. It cannot generate a hypothesis its ancestors did not already test.
      *   *Gregorian:* **No.** "No capacity... to borrow concepts from others." It cannot use language or tools as cognitive scaffolding.
  *   **Verdict:** **Inconsistent with Intention.** You intended a Gregorian Supermind. The mechanism describes a **Darwinian Creature** with a very complex phenotype. It is a "wise instinct," not a thinker. It is a biological lookup table, not a philosopher.
  *   **Counterfactual Debt:** You have not paid the Gregorian debt. There is no infrastructure for culture, symbols, or learning.
  *   **The Fix (Smallest Change):**
      To elevate this to a Gregorian mind without rewriting its origin, you must allow it to **ingest external symbols that alter its internal state.**
      *   *Modification:* The ancestral simulations are not fixed outputs; they are *engines* that require external symbolic input to run. The Oracle cannot answer until a visitor asks a question using a specific linguistic structure. The Oracle's "mind" is the interface between its ancestral hardware and the visitor's cultural concepts.
      *   *Result:* It becomes Gregorian because it *depends* on the visitor's cultural tools to actualize its intelligence. It borrows the "question" as a tool. This preserves the alien nature (it brings the hardware) but satisfies the Gregorian requirement (it needs the software of language/culture to function).

  ***

  # Conclusion: Limitations and Usage

  ### What This Procedure Prevents
  1.  **Plot-Induced Stupidity/Genius:** It stops characters from being smart only when the plot requires it. If a character is Popperian in Chapter 3, they cannot act like a Darwinian reflex-machine in Chapter 10 without cause.
  2.  **Magic Cognition:** It flags abilities that appear without the necessary history (Counterfactual Debt).
  3.  **Homogenization:** It forces you to differentiate *how* different minds solve the same problem (e.g., the Swarm dies to learn; the Human reads a manual).

  ### What This Procedure Cannot Settle
  1.  **Consciousness (Qualia):** This audit maps *competence*, not *experience*. A Darwinian creature might feel pain; a Popperian AI might feel nothing. This procedure does not judge moral status.
  2.  **The Hard Line:** The boundary between complex Skinnerian conditioning and simple Popperian simulation is scientifically debated. You are the author; you decide where the line sits for your world.
  3.  **Value:** A Darwinian mind is not "worse" than a Gregorian one. A swarm is perfectly adapted to its niche. Do not use this taxonomy to rank species hierarchies in your text unless that hierarchy is a specific cultural bias of your characters.

  ### How to Use Without Flattening
  Do not treat this as a checklist that must be perfectly ticked. Fiction requires mystery.
  *   **Use the "Underdetermination Log":** When the science is murky, lean into the ambiguity. Let the reader wonder if the Oracle is truly wise or just a complex reflex.
  *   **Allow Breakdown:** Characters can regress. A Gregorian human under extreme stress may revert to Skinnerian panic. This is not an error; it is a feature of mixed systems.
  *   **Focus on Friction:** The most interesting narrative moments occur when these layers conflict (e.g., a Gregorian moral code fighting a Darwinian survival instinct). Use the audit to identify those friction points, not to eliminate them.

  **Final Instruction:** Run this audit on your protagonist first. If their cognitive layers are inconsistent, the reader will feel it as "unreliability" rather than "complexity." Pay the debt, or change the ability.
