      *   *Key Insight:* Don't get bogged down in metaphysics. Focus on community health. If builders feel unsafe, the city dies. If rolling back hurts others more, don't rollback. Make Kasper pay (in game terms).

  8.  **Self-Correction/Edge Case Check:**
