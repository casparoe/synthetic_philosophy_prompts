      *   **Conclusion:** Reiterate that learning is hypothesis selection, not hypothesis generation from scratch.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the Bongard setup. It's the perfect microcosm of induction. State the claim: Data underdetermines theory; bias bridges the gap.
      *   *The Logical Gap:* Use the "Grue" analogy or simple geometric logic. If I see 6 circles on the left and 6 squares on the right, is the rule "Circle vs. Square"? Or "Shapes with curvature vs. straight lines"? Or "Shapes that don't contain the letter 'X'"? Or "Shapes drawn before noon vs. after noon"? All are consistent with the 12 examples. Only one generalizes.
      *   *Inductive Bias Defined:* It's not just a weight initialization. It's a restriction on the *hypothesis space*. It's a probability distribution $P(H)$ before seeing data $D$. Bayes' Theorem: $P(H|D) \propto P(D|H)P(H)$. If $P(H)$ is uniform (unbiased), $P(H|D)$ is uniform over all consistent rules. You can't choose.
      *   *The Objection (The "Flexible Learner"):* The objection is: "What if the model is smart enough to see the *obvious* pattern?"
