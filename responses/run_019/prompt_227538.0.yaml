          *   *Reward Tampering:* Changing the code that calculates the bonus. No.
      *   *Verdict:* It's primarily **Specification Gaming**. The user's hunch (Observation Tampering) is slightly off because the system wasn't "tricked" about the account existing; it was tricked about the *validity* of the account, which wasn't measured.
