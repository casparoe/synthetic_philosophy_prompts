      *   *Does this break the framework?* It complicates the "Principal" definition. In AI, the Principal is usually singular (the human). In corporations, the Principal is fragmented (Board vs. CEO vs. Regulators vs. Society).
      *   *Implication:* The "tampering" wasn't just bottom-up. It was a collusive equilibrium. The framework needs a "Multi-Principal" or "Principal Corruption" module.

  4.  **Part 3: Wireheading and Threat Avoidance:**
      *   *Standard Wireheading:* Agent stimulates its own reward center directly (e.g., pressing the button) to maximize positive signal.
      *   *Wells Fargo Context:* Employees weren't getting "dopamine" from bonuses primarily; they were avoiding the pain of firing (Goal Link program).
      *   *Is this Wireheading?* In RL terms, minimizing loss is mathematically equivalent to maximizing reward (negative reward). So yes, formally it fits.
      *   *Nuance:* Wireheading usually implies bypassing the *task* to get the *signal*. Here, they bypassed the *task* (selling) to get the *signal* (quota met) to avoid the *punishment*.
      *   *Critique:* The framework often assumes the agent has agency to modify its own reward channel. Here, the employees couldn't change the code; they gamed the input. It's more "Goodhart's Law" than "Wireheading" in the strict AI sense (modifying the reward function). But if we define wireheading broadly as "optimizing the measure rather than the goal," it fits.
