answer: |-
  1. Sequencing rationale
  Begin with the tripartite analysis to establish common ground, then immediately introduce Gettier cases to destabilize the "justified true belief" sufficiency claim. This creates the pedagogical need for a fourth condition. Introduce counterfactual conditions (sensitivity and adherence) next as the proposed repair mechanism; this order ensures students view modal conditions as solutions to Gettier problems rather than arbitrary additions. Define knowledge via tracking only after students grasp the individual counterfactuals, ensuring the definition is synthesized rather than memorized. Finally, introduce the denial of epistemic closure. This dependency is crucial: if closure is raised before students accept sensitivity as necessary for knowledge, they will reject the theory outright based on pre-theoretic intuition. By placing closure last, you frame it as a derived consequence of a theory they have already found motivated to solve Gettier cases, making the cost feel like a trade-off rather than a refutation.

  2. The carrying case
  Use "The Server Monitor." Alice monitors a critical server via a live video feed showing "Status: Green." The server is running (p), and the camera is functioning perfectly (reliable in actual circumstances). However, the system has a fail-safe: if the server crashed (~p), a script would instantly loop the last "Green" frame to prevent panic. Alice believes p. Adherence holds (if p, she sees Green). Sensitivity fails (if ~p, she would still see Green). This case lacks probabilistic noise (the script is deterministic) and perceptual ambiguity. These omissions matter because they isolate the modal failure from reliability or evidence issues, forcing students to see that actual-world reliability is insufficient for knowledge without sensitivity.

  3. Misconception map
  Expect three specific errors. First, students will conflate tracking with process reliabilism. Head this off immediately after introducing sensitivity: emphasize that reliabilism looks at actual-world frequency, while tracking looks at the nearest possible world where p is false. Second, students will interpret sensitivity as a demand for infallibility. Address this during the definition of sensitivity: clarify that error is permitted in distant possible worlds, provided it does not occur in the *nearest* ~p world. Third, students will assume denying closure licenses contradictions (knowing p, knowing p entails q, but believing ~q). Intercept this during the closure maneuver: explicitly state that the subject simply fails to know q, not that they hold inconsistent beliefs. If you wait until the Q&A to address these, the misunderstandings will have hardened into objections that block comprehension of the closure argument.

  4. The closure maneuver
  Present the closure denial only after students have accepted sensitivity as a necessary condition for knowledge. Stage it as a feature of modal depth, not a bug. Explain that knowledge requires a specific causal/modal connection to the fact. Deduction preserves truth, but it does not always preserve the modal connection required for tracking. For example, believing "I have hands" tracks the truth, but believing "I am not a brain-in-a-vat" does not (since if you were a vat, you would still believe you weren't). Frame this as "Knowledge is a relationship to the world, not just to logic." This makes the denial feel like a principled commitment to the nature of knowledge rather than an embarrassing slip forced by counterexamples.

  5. Deliberate omissions
  Openly set aside the methods-individuation problem. Students will ask whether "looking at the screen" is different from "looking at the screen while ignoring the fail-safe." Do not attempt to solve this. Instead, offer this framing: "We are assuming methods are individuated by context; refining exactly how to carve methods is a technical debate for graduate seminars." This signals that the material is deferred due to complexity, not ignorance, preserving your authority while keeping the seminar focused on the core modal logic.

  6. Exit question
  "According to tracking theory, if I know I have hands, and I know hands entail I am not a brain-in-a-vat, do I know I am not a brain-in-a-vat? Why?" A wrong answer ("Yes, because knowledge closes under deduction") reveals they missed the theory's core consequence. A right answer ("No, because my belief in ~BIV is insensitive") confirms they understand the modal cost.
