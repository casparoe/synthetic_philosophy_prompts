answer: |-
  ### My Credence
  **0.35**

  This is my credence in the specific precisification you provided: *For most paradigm cases of human skill, the difference between someone who knows how to X and someone who merely knows lots of propositions about X-ing is fully explained by which propositions they know (including tacit, indexical, or demonstration-involving ones), not by any non-propositional state or ability.*

  I am more sympathetic to intellectualism than you (0.25), but significantly more skeptical than your officemate (0.8). I view strong intellectualism as a powerful regulatory ideal for cognitive science that fails as a metaphysical description of embodied skill.

  ---

  ### Decomposition of the Credence

  I treat the final probability as a weighted average of the probability that Intellectualism holds true *given* specific domains of evidence. The weights reflect how central each domain is to the core thesis of "no non-propositional state."

  **1. Semantics/Linguistics of 'Knows How' Ascriptions**
  *   **Weight:** 0.20
  *   **P(Intellectualism | Semantics):** 0.50
  *   **Reasoning:** Stanley and Williamson's argument that 'knows how' is a species of 'knows that' under a practical mode of presentation is linguistically robust *within* the confines of standard analytic epistemology. However, it relies on contentious assumptions about the uniformity of knowledge ascriptions across contexts. Phenomenological and pragmatic analyses suggest 'knows how' often functions performatively rather than attributively. The linguistic data is a wash; it supports intellectualism only if you already accept a propositionalist semantics for attitude reports.

  **2. The Inarticulate Expert (The Cyclist/Pianist Case)**
  *   **Weight:** 0.30
  *   **P(Intellectualism | Inarticulacy):** 0.30
  *   **Reasoning:** This is the classic "Rylean regress" territory. Intellectualism survives here only by positing *tacit* propositions. My low probability here reflects the suspicion that positing unconscious propositions to explain non-reflective action is an ad hoc rescue device. If the agent cannot access the content even under ideal reflection, calling it "propositional" stretches the definition of 'proposition' until it loses its explanatory power (i.e., guiding inference).

  **3. Coherence of "Tacit Propositional Knowledge"**
  *   **Weight:** 0.20
  *   **P(Intellectualism | Coherence):** 0.40
  *   **Reasoning:** This is the metaphysical bottleneck. Is "tacit propositional knowledge" a genuine theoretical posit, or merely a redescription of reliable disposition? If the "proposition" has no causal role distinct from the neural circuitry that produces the behavior, it is an epiphenomenal redescription. I assign a 0.4 because while computationalism allows for sub-symbolic propositions, the mapping from motor dynamics to propositional content is often lossy.

  **4. Empirical Dissociation (Motor vs. Declarative Memory)**
  *   **Weight:** 0.30
  *   **P(Intellectualism | Empirics):** 0.20
  *   **Reasoning:** This is the strongest evidence against the thesis. The dissociation between medial temporal lobe systems (declarative) and basal ganglia/cerebellar systems (procedural) isn't just about storage; it's about *format*. Procedural memory often operates via gain-scheduling, dynamical coupling, and error-correction loops that do not resemble truth-evaluable content. While an intellectualist can argue these are "sub-personal propositions," this moves the goalposts so far that the claim becomes unfalsifiable.

  **Calculation:** $(0.5 \times 0.2) + (0.3 \times 0.3) + (0.4 \times 0.2) + (0.2 \times 0.3) = 0.10 + 0.09 + 0.08 + 0.06 = \mathbf{0.33}$ (Rounded to **0.35** to account for potential future unification in cognitive science).

  **Most Sensitive Term:** The **Empirical Dissociation** term. If neuroscience demonstrated that procedural memory systems encode information in a combinatorial, truth-apt syntax isomorphic to language (a "language of thought" in the cerebellum), my credence would skyrocket. Currently, the evidence points toward dynamical systems, not symbolic logic.

  ---

  ### The Robot Wrinkle

  **The Case:** An LLM-driven robot with perfect verbal theory of kneading but zero motor competence.
  **My Verdict:** It does **not** know how to knead dough.
  **Weight Relative to Classic Cases:** This case should carry **double** the weight of the classic cyclist example.

  **Why:** The cyclist case is ambiguous because we assume the cyclist *has* the skill. We argue about whether that skill *contains* propositions. The Robot case isolates the variables: we *know* it has the propositions (we can inspect the code/weights) and we *know* it lacks the skill.
  *   **Intellectualist Counter:** They must argue the robot knows how *in principle*, but lacks the ability to *manifest* it due to peripheral failure.
  *   **My Rebuttal:** This severs the internal connection between knowledge and action. If the "knowledge" cannot guide the motor controller even in principle without a separate training phase on *dough*, then the "knowledge" was not of the kneading, but of the *theory* of kneading.

  **The Simulation Stipulation:** If the robot can simulate perfect kneading in a physics engine ("in its head"), does it know how?
  *   **Verdict:** Closer, but still **No**.
  *   **Reasoning:** Simulation is still a form of representation detached from the proprioceptive feedback loop essential to the skill. Kneading isn't just moving arms in a pattern; it's responding to resistance, texture, and elasticity in real-time. A simulation models these; a skill *couples* with them. If the "knowledge" doesn't include the coupling mechanism, it's a map, not the territory. This case suggests that for embodied skills, the "non-propositional state" (the sensorimotor loop) is constitutive of the knowledge, not just an execution add-on.

  ---

  ### Diagnosing the Divergence (You vs. Officemate)

  Given your credences (0.25 vs. 0.8), your disagreement is not primarily about the **Semantics** (Factor 1). Most philosophers who have read Stanley/Williamson grant that the *linguistic* surface favors intellectualism.

  **The Divergence is in Factor 3 (Tacit Coherence) and Factor 4 (Empirics).**

  *   **Your Officemate (0.8):** Likely views "tacit propositional knowledge" as a coherent, robust theoretical posit (Factor 3 ~ 0.8). They probably interpret the empirical dissociation (Factor 4) as merely distinct *storage systems* for the same *kind* of content (like RAM vs. Hard Drive). They are willing to intellectualize the sub-personal level: if a neural state carries information and guides action, it can be modeled *as if* it were propositional, and that's sufficient for the claim.
  *   **You (0.25):** Likely view "tacit propositions" as a redescription of ability (Factor 3 ~ 0.2). You probably read the empirical dissociation (Factor 4) as evidence of distinct *kinds* of cognitive architecture (symbolic vs. dynamical). You likely feel that if the "propositions" are so tacit they look like dynamical attractors, the label "propositional" is doing no work.

  **The Pivot Point:** The definition of "Proposition." Your officemate is likely using a liberal, information-theoretic definition (content-bearing state). You are likely using a stricter, logical definition (truth-evaluable, combinatorial structure). The debate often stalls because you are arguing past each other on what counts as a "proposition" at the sub-personal level.

  ---

  ### The "Shift" Argument

  **To shift my credence UP (toward Intellectualism):**
  A successful reduction of **Predictive Processing** models to explicit propositional formats. If the "Bayesian Brain" hypothesis could demonstrate that motor control is literally inference over hypothesis spaces with truth conditions (e.g., "my hand is at location X"), rather than just minimization of error signals in a dynamical system, intellectualism becomes viable. Currently, predictive processing is compatible with intellectualism, but doesn't demand it. A proof that the "priors" are propositional would shift my number to ~0.6.

  **To shift my credence DOWN (toward Anti-Intellectualism):**
  A definitive demonstration of **non-representational skill acquisition**. If embodied cognitive science could show a skill being learned and executed where *no* information-bearing state (even sub-symbolic) is maintained between actions—e.g., pure dynamical coupling where the environment does the "computing"—this would break the intellectualist claim that knowledge is an internal state. This would push my number to ~0.15.

  ---

  ### State of the Field: What is Contested?

  Be wary of anyone telling you this is settled. It is not.

  1.  **The "Consensus" Myth:** In analytic **epistemology**, Intellectualism (post-2001) became the dominant default. If you submit a paper to *Philosophical Studies* assuming Anti-Intellectualism, you will face an uphill battle. However, in **philosophy of action**, **phenomenology**, and **cognitive science**, Anti-Intellectualism (or "Hybrid Views") remains extremely robust. The "consensus" is disciplinary, not universal.
  2.  **Live Debate:** The live debate has moved away from "Is KH KT?" to "**What kind of KT is KH?**"
      *   *Moderate Intellectualism:* KH is KT, but requires a specific "practical mode of presentation" (Stanley).
      *   *Pluralism:* There are multiple kinds of knowing-how; some are propositional, some are not (e.g., Habgood-Coote).
      *   *Embodied Cognition:* Rejects the representationalist framework entirely (e.g., Hutto, Myin).
  3.  **The Stalemate:** The debate is currently stuck on the **individuation of mental states**. Intellectualists individuate by content (what is represented); Anti-Intellectualists individuate by functional role (how it is used). Until there is a agreed-upon metaphysics of mental content that bridges sub-personal neuroscience and personal-level epistemology, the 0.25 vs. 0.8 split will remain the standard distribution.

  **Summary:** Your officemate is betting on the unity of cognitive science (everything is computation/representation). You are betting on the irreducibility of embodiment (some things are dynamics, not computation). My 0.35 reflects a bet that the truth is a messy hybrid, but the "propositional" label is doing too much heavy lifting in the Intellectualist camp.
