answer: |-
  To the Grants Committee, regarding the operationalization of Lakatosian criteria for renewal decisions

  Our trustee's suggestion to apply Imre Lakatos's methodology of scientific research programmes to our renewal process is intellectually compelling, but as you know, Lakatos wrote for historians of science looking backward, not programme officers looking at interim reports. To make this defensible in writing to disappointed applicants and our own board, we need a procedure that translates his philosophical concepts into auditable questions without pretending science is an algorithm. The following memo outlines a decision procedure that respects the trustee's insight while acknowledging the practical constraints of our timeline and expertise.

  The first step is defining what counts as a programme for our purposes. A grant programme is not merely the budget line or the personnel list but the specific theoretical framework proposed in the initial application. You must identify the hard core, which consists of the fundamental assumptions the team refuses to abandon even when faced with anomalies, and the protective belt, which comprises the auxiliary hypotheses, experimental methods, and initial conditions they are willing to adjust. In your review packet, the hard core is usually found in the central hypothesis or paradigm statement, while the protective belt is visible in the specific aims and methodological adjustments described in annual reports. If you cannot distinguish the core from the belt because the applicants shift their fundamental claims whenever data contradicts them, the programme lacks the coherence required for this test and should be flagged for immediate scrutiny regarding its scientific integrity.

  Once the structure is identified, the procedure moves to the progress test. You must ask whether adjustments to the protective belt have led to the prediction of novel facts that were subsequently confirmed. A good answer here requires evidence that a prediction was made before the data was collected. A stop condition occurs if all adjustments are purely ad hoc, meaning they only explain past failures without generating new testable implications. Here is where gaming is most likely. A smart applicant will claim after the fact that a result was a novel prediction all along. To counter this, require timestamps on pre-registrations, lab notebook entries, or internal memos that predate the data collection. If the only evidence for a prediction is the final publication discussing the result, you must treat it as accommodation rather than prediction. Another gaming strategy involves dumping every failure into the protective belt while keeping the core safe. This is legitimate science only if the belt adjustment increases the empirical content of the programme. If the adjustment makes the theory less testable or more complex without opening new lines of inquiry, it is degenerating.

  To illustrate how this works in practice, consider three invented files from our current cycle. Programme Alpha is in high-energy physics and looks exciting because it produces a steady stream of publications. However, upon applying the test, you see their hard core is the existence of a specific dark matter particle. Every year the detector comes up empty, and every year they adjust the protective belt by claiming the interaction cross-section is lower than previously thought. They have not predicted a new phenomenon or a new way to detect the particle; they have only moved the goalposts to explain null results. Despite the high publication volume, this is a degenerating shift. The procedure tells you to cut funding, even though the lab is popular and productive. Programme Beta is in neuroscience and looks stalled. They have few publications and admitted to two years of failed experiments. However, their reports show that after a major anomaly, they adjusted their model of synaptic transmission to predict a specific inhibitory mechanism that was previously unknown. They tested this last quarter and confirmed it. This is a progressive shift despite the low output. The procedure tells you to renew, even though the lab looks inefficient compared to Alpha. Programme Gamma is in behavioral psychology and presents a harder case. They have adjusted their belt to account for cultural variables after failing to replicate their own results. This looks like shielding, but it has opened a new comparative methodology. Here the procedure hands the decision back to you. There is no fact of the matter yet on whether this is progressive or degenerating; it is a judgment call on the potential of the new heuristic.

  You must also understand where this procedure cannot take you and where my additions to the theory begin. Lakatos himself admitted that his methodology is a rational reconstruction meant for history, not a immediate decision rule, and this is the most contested area among philosophers of science. There is no settled consensus on how long a programme must be allowed to degenerate before it is abandoned. Some philosophers argue for a long leash because progressive shifts often follow periods of crisis, while others argue that continuous ad hoc adjustments signal a dead end. For our purposes, we must set a fixed horizon, such as two funding cycles, after which a lack of novel confirmed predictions triggers a presumption of degeneration. This is not Lakatosian dogma but an administrative necessity. Furthermore, Lakatos assumes we can objectively measure empirical content and novelty, but in practice, these are theory-laden judgments. When an applicant claims a result is novel, you are relying on peer review to validate that claim, which means you are outsourcing the Lakatosian test to the very community that may be invested in the programme's core.

  Finally, distinguish between the settled and contested parts of this framework to protect yourself during appeals. It is settled and defensible to ask applicants to distinguish their core assumptions from their auxiliary hypotheses and to demand evidence that predictions preceded data. It is genuinely contested to declare a programme dead solely because it has not produced a novel fact in three years, as some fields move slower than others. Therefore, your written decisions should not say this programme is falsified but rather that it has not demonstrated a progressive problem shift relative to the opportunity cost of funding. You are not judging truth but momentum. By framing the decision this way, you honor the trustee's theoretical insight without falling into the trap of pretending philosophy can replace scientific judgment. Use the procedure to structure your inquiry and flag risks, but reserve the final verdict for the committee's collective wisdom, acknowledging that sometimes we fund people rather than programmes, and that is a variable Lakatos did not account for.
