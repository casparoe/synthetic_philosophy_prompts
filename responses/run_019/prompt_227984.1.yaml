      *   *V7 (Pond vs. 2 Abroad):* Save local child (1 vs. 2 lives). *Principle: Proximity/Immediate Emergency priority over maximizing numbers.*

      *Tension Points:*
      *   V3/V4 vs. V5: You must give your *own* money (V3/4), but you cannot *take* someone else's money (V5), even for the same end.
      *   V3/V4 vs. V7: You should save statistical lives abroad (V3/4), *unless* there is an immediate emergency in front of you (V7). This suggests a "Special Duty to the Present" or "Emergency Priority."
      *   V1 vs. V2: Cost/Risk matters. £800 is okay; 10% death risk is not.

  3.  **Drafting Principles (Requirement 1):**
      *   *Principle A: The Agent-Relative Sacrifice Constraint.* You are required to sacrifice your own resources (money, time, comfort) to save lives up to a point of significant hardship/risk, but you are forbidden from violating negative rights (property, bodily autonomy) of others to do so. (Fits V1, V3, V4, V5).
      *   *Principle B: The Emergency Proximity Priority.* When faced with competing lives, an immediate, identifiable emergency in one's presence takes precedence over saving a greater number of statistical or distant lives, provided the cost to the agent is not prohibitive. (Fits V7, supports V1/V6).
      *   *Principle C: The Assigned Claim Constraint.* Resources already allocated to a specific rescue mission create a stronger moral claim than unallocated resources. Interfering with an existing rescue plan is worse than failing to initiate a new one. (Fits V5 implicitly, needs to be tested against V7).
      *   *Refining Principle C:* Let's look closer at V5. Stealing is wrong. Why? Because it violates property rights. In the Drone case, the drone is "en route." It's arguably "assigned" to Child B. Diverting it is like stealing from Child B to give to Child A.
      *   *Alternative Principle C (The Non-Interference Principle):* One may not actively worsen one person's situation to improve another's, even if the net utility rises, whereas failing to help (omission) is treated differently than harming (commission). (Fits V5, distinguishes from V3).

      *Let's try to make them distinct enough to generate different predictions.*
      *   *Principle 1: Moderate Altruism with Rights Constraints.* (Focus on V1, V3, V5). Duty to give own resources, duty not to violate rights.
      *   *Principle 2: The Priority of the Present.* (Focus on V7). Proximity/Immediacy trumps numbers.
      *   *Principle 3: The Sanctity of Assigned Expectations.* (Focus on V5 + Drone context). Once a rescue is in motion, it acquires a right not to be thwarted.

      *Wait, I need to ensure they fit ALL seven.*
      *   *Principle 1 (Singer-Plus):* Agents are required to prevent bad outcomes up to the point of comparable moral significance (money/time), but forbidden from using impermissible means (theft/violence). (Fits 1, 3, 4, 5, 6). Handles V2 (risk is comparable significance). Handles V7? V7 is the outlier for pure Singer. Singer says save the 2. She says save the 1. So Principle 1 needs a "Proximity Clause."
      *   *Let's try again.*
      *   *Principle I: The Threshold of Sacrifice.* Duty to aid exists until cost/risk becomes "serious" (V1, V2, V3, V4, V6).
      *   *Principle II: The Means Constraint.* Negative duties (do not steal/harm) trump positive duties (save lives) when means are involved (V5).
      *   *Principle III: The Emergency Privilege.* Immediate, face-to-face emergencies override abstract maximization (V7).

      *Do these predict the Drone Case differently?*
      *   *Case:* Divert drone. Child A (10% $\to$ 90%). Child B (70% $\to$ 20%).
      *   *Net Utility:*
