      *   *V3 (Charity/Identifiable):* Required to donate (money = life, distance irrelevant). *Principle: Equivalence of money and life; impartiality regarding distance.*
      *   *V4 (Charity/Statistical):* Required to donate (statistical lives count same as identifiable). *Principle: Identifiability doesn't change obligation.*
