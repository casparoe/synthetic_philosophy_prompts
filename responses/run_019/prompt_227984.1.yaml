      *   *If she says No:* It's about Assigned Claims (even her own prior commitment?).
      *   *Let's try:* She finds an unattended, unlocked medical kit owned by a hospital (not a specific person). She can use it on Local Child (1 life) or send it to Remote Clinic (2 lives).
      *   *Sharp Distinction:* **The "Lost Wallet" Rescue.** She finds a lost wallet with £800. A local child needs £800 now to escape traffickers. A charity abroad needs £800 to save 2 children. She can keep the wallet (finders keepers? No, V5 says no stealing).
      *   *Let's go with:* **The Unattended Boat.** She sees a lifeboat tethered to a dock (owner absent). Local child drowning. Remote distress signal received by owner earlier, boat was being prepped for them. If she takes the boat, local child saved (90%), remote child dies (0%). If she leaves it, remote child saved (90%), local dies.
      *   *Actually, the prompt asks for a case that distinguishes the two **leading principles**.*
      *   Leading Principles in my analysis: 1. Constraint on Means (V5) vs. 2. Priority of Presence (V7).
