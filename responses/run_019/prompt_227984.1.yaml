          4.  Give a "best guess" verdict and explain why it fits the pattern.
          5.  Describe a further rescue case that would distinguish the two leading principles.
          6.  Explain what each verdict reveals about the difference between *sacrificing own resources* vs. *commandeering owed resources*.

  2.  **Analyze the Seven Verdicts (The Data Set):**
