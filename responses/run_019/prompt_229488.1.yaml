answer: |-
  You have asked me to step into the role of the critic, to press against the standard Bernoulli resolution not by rehearsing the usual introductory objections that are easily parried, but by identifying the structural vulnerabilities that threaten to collapse the position entirely. I take your request seriously, because while the expected utility resolution is the orthodox response to the St. Petersburg paradox, its dominance often masks significant philosophical and mathematical fissures. The core of your defense rests on the claim that diminishing marginal utility of wealth dissolves the paradox by rendering the expected utility of the game finite, thereby justifying a finite entry fee. This is a compelling narrative, but it is not immune to failure. To understand what would count against this position, we must distinguish between objections that merely complicate the application of the theory and those that strike at its normative necessity.

  The most decisive threat to your position comes from the possibility of unbounded utility functions, a problem rigorously articulated by Karl Menger. Your defense assumes that a rational agent's utility function must exhibit diminishing marginal returns sufficient to converge the series of expected utilities. However, standard axiomatizations of rational choice, such as those by von Neumann and Morgenstern, do not strictly require utility functions to be bounded. If a rational agent is permitted to have an unbounded utility function, then for any such function, one can construct a modified St. Petersburg game, often called a super-St. Petersburg game, where the payoffs grow rapidly enough to make the expected utility diverge to infinity. If the payoffs are scaled to outpace the growth of the utility function, the expected utility becomes infinite once again, and the paradox returns in full force. This is not a mere complication; it is a decisive failure of the resolution as a general account of rationality. It implies that Bernoulli's solution does not solve the paradox of infinite expectation per se, but rather solves it only for agents who happen to have sufficiently concave utility functions. If rationality does not mandate bounded utility, then the Bernoulli resolution is contingent rather than universal, leaving open the possibility that a rational agent with unbounded utility should indeed be willing to pay an arbitrarily large entry fee.

  This leads directly to the worry that the resolution is merely a relabeling of the original problem. You argue that diminishing marginal utility explains why an infinite expected monetary value is unacceptable, but one might ask why an infinite expected utility should be considered unacceptable if it arises. If the only reason expected utility remains finite is that we impose a utility function that forces it to be finite, then the theory risks becoming tautological. We observe that people will not pay infinite money, so we posit a utility function that ensures they do not, and then we claim the utility function explains the behavior. The explanatory power is weakened if the utility function is adjusted post hoc to fit the intuition rather than derived from independent principles of rationality. The hard work is not in showing that a logarithmic function converges, but in justifying why a rational agent must possess a utility function that converges for this specific gamble. If the resolution relies on the empirical observation that humans saturate in their capacity to enjoy wealth, it becomes a descriptive claim about human psychology rather than a normative claim about rational pricing. This shifts the ground beneath your feet, because a theory of rational decision-making should ideally prescribe how agents ought to reason, not merely describe how they happen to feel about ducats.

  The distinction between the descriptive and normative claims is where the position risks becoming insulated from criticism. Bernoulli begins with the descriptive observation that a poor man values a ducat differently than a rich man, but he concludes with the normative prescription that one ought to price lotteries by expected utility. If this shift is not carefully bridged, the theory becomes unfalsifiable. If an agent refuses to pay a high price, we say their utility function is concave; if another agent accepts a high price, we say their utility function is linear or less concave. If every possible behavior can be rationalized by positing a suitable utility function, then the theory loses its risk of exposure. You asked honestly whether the position risks anything at all, and I must tell you that in its most flexible formulations, it risks nothing because it can accommodate any outcome by adjusting the utility curve. But this lack of exposure is itself a profound problem for a claim of this kind. A normative theory that cannot be wrong cannot guide action, because it offers no constraint on what one ought to do. If the Bernoulli resolution is to be robust, it must assert that there are utility functions that are irrational, yet the standard expected utility framework struggles to condemn unbounded utility functions without importing external constraints.

  Furthermore, there is the observation regarding transcendent payoffs or very small chances of immense value. If the utility function is bounded, there is a ceiling to value, which implies that beyond a certain point, additional wealth adds nothing to the agent's well-being. This leads to counterintuitive results where an agent should be indifferent between a guaranteed maximum utility and a gamble that offers a tiny chance of vastly more money that cannot be utilized. While this might be mathematically consistent, it clashes with the intuition that more resources should always be potentially preferable, even if marginally. If the resolution requires us to accept that utility must saturate to avoid the paradox, it forces us to accept a cap on rational desire that many find philosophically unpalatable. This is not necessarily a falsification, but it is a significant cost of the theory. It suggests that the Bernoulli resolution solves the mathematical paradox at the expense of creating a philosophical one regarding the nature of value and preference.

  So, which of these should move you? The super-St. Petersburg objection should move you the most, because it demonstrates that the mathematical mechanism of diminishing marginal utility is not sufficient to guarantee a finite price unless boundedness is assumed. If you cannot justify why rationality requires bounded utility, then the paradox is not dissolved but merely postponed. The descriptive versus normative worry should also move you, because it challenges the authority of the resolution. If Bernoulli is only telling us how people do value things, he is not telling us how a rational agent must value them, and thus the paradox remains for the idealized rational agent who does not share human psychological limitations. The lack of exposure is indeed a problem; if the theory is protected from refutation by the flexibility of the utility function, it ceases to be a rigorous standard for decision theory and becomes a descriptive modeling tool. To defend the position successfully, you must do more than cite the diminishing marginal utility of wealth; you must argue why a rational agent is compelled to have a bounded utility function, and why expected utility is the normative standard rather than a descriptive fit. Without that stronger foundation, the resolution remains vulnerable to the charge that it solves the problem only by defining the problem away.
