answer: |-
  # Joint Statement of Adversarial Collaboration: Bet Sizing in Multiplicative Environments

  **Parties:**
  *   **Camp 1 (Expected Utility):** Proponents of the Von Neumann-Morgenstern expected utility framework.
  *   **Camp 2 (Geometric Rationality):** Proponents of growth-optimal betting and ergodicity economics.

  **Date:** October 26, 2023
  **Subject:** Normative standards for bet sizing in repeated favorable gambles with compounding returns.

  ---

  ### (i) Agreed Claims: Mathematics of Compounding and Growth

  Both camps agree on the following mathematical properties regarding repeated betting with compounding returns. We distinguish these mathematical facts from their normative interpretations.

  1.  **Divergence of Means:** In a multiplicative process with volatility, the arithmetic expected value (ensemble average) of wealth grows faster than the median wealth (time average) of a single trajectory. The gap widens as volatility increases.
  2.  **Asymptotic Growth Rate:** For a fixed-fraction betting strategy repeated indefinitely, the wealth trajectory converges almost surely to an exponential growth rate determined by the geometric mean of the returns.
  3.  **Kelly Optimality:** The betting fraction that maximizes this asymptotic geometric growth rate is the Kelly fraction. This is mathematically equivalent to maximizing the expected value of the logarithm of wealth ($E[\ln W]$).
  4.  **Ruin under Max-Expected-Wealth:** A strategy that maximizes arithmetic expected wealth ($E[W]$) in each step generally prescribes betting the entire bankroll (or leveraging up) whenever the expected return is positive. In any environment where a total loss is possible (non-zero probability of ruin), this strategy leads to wealth approaching zero with probability 1 as the number of trials approaches infinity.
  5.  **Utility Equivalence:** Maximizing the geometric growth rate is mathematically identical to maximizing expected utility under a logarithmic utility function $U(W) = \ln W$.
  6.  **Finite Horizon Sensitivity:** For a finite number of bets $N$, the optimal fraction depends on $N$. As $N \to \infty$, the optimal fraction for log-utility converges to the Kelly fraction. For non-log utility functions, the optimal fraction may differ from Kelly even as $N$ grows large, depending on the boundary conditions (e.g., subsistence levels).

  ---

  ### (ii) Disagreements Table

  The following table outlines the residual normative and philosophical disagreements. Each statement is phrased to be acceptable to the respective camp as an accurate representation of their position.

  | Topic | Camp 1 (Expected Utility) Position | Camp 2 (Geometric Rationality) Position |
  | :--- | :--- | :--- |
  | **Source of Normativity** | Rationality is defined by internal consistency of preferences (axioms of choice). If an agent prefers a lower growth path to avoid short-term volatility, that preference is rational by definition. | Rationality is defined by fit with the environmental structure. In multiplicative environments, the "preference" for survival and growth is imposed by the mathematics of compounding, not chosen by the agent. |
  | **Status of Log Utility** | Logarithmic utility is one specific risk profile among many. An agent with $U(W) = -1/W$ or $U(W) = \sqrt{W}$ is equally rational to deviate from the Kelly fraction to suit their specific risk aversion. | Logarithmic utility is not a "preference" but the unique function that aligns individual optimization with the time-average growth of the system. Other utility functions in this context represent cognitive errors regarding probability or time. |
  | **The "Ruin" Constraint** | Ruin is a subjective boundary defined by the agent's utility function (e.g., marginal utility approaches infinity at a specific subsistence level). It is not necessarily $W=0$. | Ruin is an objective absorbing barrier (exiting the game). Any strategy that accepts a non-zero probability of absorbing ruin when a growth-optimal alternative exists is irrational. |
  | **Scope of Application** | The expected utility framework is universal. It applies to one-off bets and repeated bets alike; the repetition simply updates the state space and probabilities. | Repeated multiplicative exposure constitutes a distinct category of decision-making requiring specific heuristics (like Kelly) that do not apply to additive or one-off decisions. |
  | **Evolutionary Argument** | Market selection does not define rationality. An agent can be rational and still go broke if their utility function valued consumption prior to ruin higher than long-term survival. | Market selection *reveals* rationality. Strategies that do not maximize geometric growth will eventually be outcompeted and eliminated from the population; thus, survival requires Kelly-like behavior. |

  ---

  ### (iii) Cruxes: Sub-Questions and Predictions

  We identify three empirical or theoretical cruxes. Settling these would move at least one camp toward the other's position.

  #### Crux 1: The Evolutionary Survival Threshold
  **Question:** In a competitive market of agents with fixed strategies, does the population share of non-Kelly bettors necessarily vanish over time, even if they have "reasonable" non-log utility functions (e.g., CRRA with $\gamma \neq 1$)?

  *   **Evidence Required:** Long-run simulation of heterogeneous agent markets where agents are eliminated upon hitting a subsistence barrier, tracking the market share of different betting fractions over $10^4+$ periods.
  *   **Camp 1 Prediction:** Non-Kelly agents (e.g., half-Kelly) will survive indefinitely if their lower volatility prevents them from hitting the subsistence barrier during drawdowns that wipe out full-Kelly agents. Survival depends on the *location* of the barrier, not just growth rate.
  *   **Camp 2 Prediction:** Any strategy with a lower geometric growth rate than the Kelly strategy will see its relative wealth share approach zero almost surely. Lower volatility does not compensate for lower drift in the long run; only the growth-optimal strategy dominates.

  #### Crux 2: The Ergodicity Justification
  **Question:** Does the non-ergodic nature of multiplicative wealth processes (where time average $\neq$ ensemble average) invalidate the use of ensemble-average expected utility maximization for individual decision-making?

  *   **Evidence Required:** A formal proof or counter-example demonstrating whether an agent maximizing ensemble expected utility can be "money-pumped" or systematically dominated in a single lifetime trajectory by a time-average maximizer.
  *   **Camp 1 Prediction:** No. An agent maximizing ensemble averages is not irrational; they are simply valuing parallel possibilities (which may matter for heirs, insurance, or social welfare) over their single timeline. There is no "pump" if the agent willingly accepts the risk.
  *   **Camp 2 Prediction:** Yes. Relying on ensemble averages in a non-ergodic system leads to systematic failure for the individual. The "willing acceptance of risk" is often a miscalculation of the time-probability of ruin. A time-average maximizer will extract wealth from an ensemble-maximizer in repeated bilateral trades.

  #### Crux 3: Finite Horizon Convergence
  **Question:** As the investment horizon extends (e.g., a 30-year retirement fund vs. a 100-year endowment), does the optimal utility function for a human investor naturally converge to Log Utility regardless of stated preferences?

  *   **Evidence Required:** Behavioral data or revealed preference studies of long-term institutional investors (endowments, sovereign wealth funds) comparing their actual leverage/bet sizing against Kelly and against their stated risk mandates.
  *   **Camp 1 Prediction:** No. Long-term institutions will continue to use utility functions reflecting their specific liabilities (e.g., needing to pay out 5% annually). This often results in betting fractions significantly below Kelly, which is rational given their liability structure.
  *   **Camp 2 Prediction:** Yes. Institutions that survive for centuries (e.g., university endowments, family offices) will be observed to cluster around growth-optimal sizing. Those that deviate significantly (either too conservative or too aggressive) will either fail to meet goals or suffer ruin, selecting them out of the long-term sample.

  ---

  ### (iv) Closing Note on Verbal Disputes

  We acknowledge that a portion of this dispute is verbal, specifically regarding the definition of **"Rationality."**

  *   **Camp 1** uses *Instrumental Rationality*: Rationality is the efficient satisfaction of whatever preferences the agent holds, even if those preferences lead to extinction.
  *   **Camp 2** uses *Ecological Rationality*: Rationality is the alignment of decision rules with the statistical structure of the environment to ensure persistence.

  If Camp 1 accepts that "survival" is a lexicographic preference for almost all agents (i.e., you must survive to enjoy utility), the prescriptions converge. If Camp 2 accepts that "growth" is not the only objective (e.g., smooth consumption paths matter independently of terminal wealth), the prescriptions diverge.

  However, we agree the dispute is **not entirely verbal**. The disagreement over **Crux 1 (Evolutionary Survival)** is empirical. If it can be proven that non-Kelly strategies systematically retain market share in the long run due to volatility drag on the Kelly strategy itself (e.g., in markets with fat tails where Kelly over-leverages), Camp 2's normative claim weakens. Conversely, if non-Kelly strategies are mathematically guaranteed to lose relative market share regardless of risk aversion, Camp 1 must concede that EUT requires specific constraints in multiplicative environments to avoid dynamic inconsistency.
