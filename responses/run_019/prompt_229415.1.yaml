      *   *Camp 2 (Geo):* In the long run, the geometric mean dominates the arithmetic mean. Almost sure convergence to the growth rate. Maximizing arithmetic expected value ($E[W]$) leads to betting everything, which leads to zero wealth with probability 1 as $N \to \infty$ (if there's any risk of ruin). Therefore, rationality *in this specific context* demands growth optimization.

