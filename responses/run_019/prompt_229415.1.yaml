      *   *Crux 3: The meaning of "Ruin".* Is ruin $W=0$ or $W < \text{subsistence}$?
          *   Camp 1: Ruin is defined by the utility function (marginal utility goes to infinity).
          *   Camp 2: Ruin is exiting the game (absorbing barrier).

  6.  **Drafting Section (iv): Verbal Disputes:**
      *   Is "Rationality" the sticking point?
