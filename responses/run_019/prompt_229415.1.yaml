      *   Math fact 3: Full betting (max $E[W]$) leads to almost sure ruin in infinite sequences with downside risk.
      *   Math fact 4: Kelly is equivalent to Log Utility.
      *   Math fact 5: Finite horizons change the optimization landscape.

  4.  **Drafting Section (ii): Disagreements Table:**
