          *   Camp 1 Prediction: Non-log agents still prefer their specific optimal fraction, even if it grows slower, because it satisfies their specific risk constraints.
          *   Camp 2 Prediction: Non-log agents will eventually be outcompeted/eliminated in an evolutionary market setting.
      *   *Crux 2: Evolutionary/Market Selection.* Does the market punish non-Kelly bettors?
          *   Evidence: Long-term fund survival data.
          *   Camp 1 Prediction: Funds survive based on matching investor utility (liabilities), not just raw growth.
