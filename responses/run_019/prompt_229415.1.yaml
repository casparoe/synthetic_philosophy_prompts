      *   *Issue 1: Normative Status.* Camp 1: It's a preference parameter. Camp 2: It's an objective constraint of the environment.
      *   *Issue 2: Definition of Rationality.* Camp 1: Internal consistency. Camp 2: Survival/Thriving in multiplicative environments.
      *   *Issue 3: Single vs. Repeated.* Camp 1: Same principle applies (just update probabilities/state). Camp 2: Repeated multiplicative exposure creates a distinct category requiring specific rules.

  5.  **Drafting Section (iii): Cruxes:**
      *   What would change minds?
      *   *Crux 1: The "One-Shot" vs. "Many-Shot" boundary.* If a bet is repeated 1000 times, does EUT converge to Kelly naturally for *any* reasonable utility, or only Log?
