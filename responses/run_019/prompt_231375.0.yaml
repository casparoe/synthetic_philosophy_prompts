      *   *Verdict:* Tax it heavily. It's the epitome of unearned dynastic advantage.

  8.  **Structuring the Response:**
      *   **Name the Principle:** Give it a catchy, descriptive title (e.g., "The Anti-Dynastic Merit Principle").
