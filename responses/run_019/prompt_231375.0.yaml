      *   *Check:* Did I explain the lottery? Yes, focus on the *source* (family power vs. state/random).
      *   *Check:* Is the business relief clear? Yes, distinguish between asset protection and passive income.
      *   *Critique:* The £15m caregiver is the biggest weak point. £15m is not a wage. I need to point out that consistency requires capping that exemption.

