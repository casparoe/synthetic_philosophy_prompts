answer: |-
  ### Graduate Seminar Final Examination: Philosophy of Biology
  **Topic:** Biological Functions and Teleology
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 1,500 – 2,000 words

  ---

  #### Exam Question

  Consider the following case, **SynCons** (Synthetic Consortium):

  > Researchers engineer a microbial consortium consisting of Strain A and Strain B. Strain A possesses a gene that produces Protein X. In Strain A's ancestral lineage, Protein X was selected solely for metabolic efficiency internal to A; it was never selected for environmental interaction. However, in the engineered SynCons environment, Protein X incidentally binds to a toxin in the shared medium, detoxifying it. This detoxification is necessary for Strain B's survival, and Strain B provides a nutrient back to A. Thus, the detoxification effect contributes to the persistence of the *consortium* as a whole. However, Strain A's lineage has not undergone selection *for* this detoxification effect, nor has the consortium lineage existed long enough to undergo selection.

  Write an essay addressing the following:

  1.  **Verdicts:** According to a standard Etiological (Selected-Effects) account and a standard Causal-Role (Cummins-style) account, does Protein X have the *function* of detoxifying the medium in SynCons? Justify each verdict based on the specific criteria of the account.
  2.  **Theoretical Costs:** Identify the specific theoretical cost each account incurs in this case. Specifically, explain how the Causal-Role verdict risks **liberalism** (conflating function with accident) and how the Etiological verdict risks the **novel-trait (first-token) problem**.
  3.  **Normativity:** Can either account successfully distinguish between a *malfunctioning* copy of Protein X (which fails to detoxify) and a *non-detoxifying variant* that simply lacks the capacity? Explain which account handles this distinction more naturally and why.

  *In your response, clearly distinguish between claims that represent the consensus in the literature and those that remain philosophically contested.*

  ---

  #### Model Answer

  **Introduction**
  The SynCons case is designed to drive a wedge between the two dominant accounts of biological function: the Etiological (Selected-Effects, or SE) account and the Causal-Role (CR) account. The case isolates a trait that contributes to a system's capacity (favoring CR) but lacks a specific history of selection for that contribution (challenging SE). A rigorous analysis requires applying the strict criteria of each account, acknowledging the theoretical costs regarding intuition and novelty, and evaluating their resources for grounding normative claims like malfunction.

  **1. Verdicts on Function Ascription**
  *Settled Consensus:* It is standard in the literature to apply these accounts as follows.
  Under a standard **Etiological Account** (e.g., Millikan 1984; Godfrey-Smith 1994), a trait has a function only if it was historically selected for that specific effect. In SynCons, Protein X's detoxification effect is incidental to Strain A's history and the consortium lacks a selection history of its own. Therefore, the SE verdict is that detoxification is **not a function**; it is a mere beneficial side effect. The SE account prioritizes the historical origin of the trait over its current utility.

  Under a standard **Causal-Role Account** (e.g., Cummins 1975), a function is a causal contribution a trait makes to the capacity of a containing system. Here, the "system" can be defined as the consortium. Protein X causally contributes to the consortium's capacity for persistence by detoxifying the medium. Therefore, the CR verdict is that detoxification **is a function**. The CR account prioritizes current causal organization over history.

  **2. Theoretical Costs: Liberalism and Novelty**
  *Settled Consensus:* Both accounts face well-documented objections in cases like SynCons.
  The CR verdict incurs the cost of **liberalism**. If any causal contribution to a system's capacity counts as a function, it becomes difficult to distinguish functions from mere effects. For example, if Protein X also incidentally changes the pH of the medium, and that pH change helps Strain B, is pH modulation also a function? Critics argue CR accounts conflate *function* with *accidental benefit*. In SynCons, calling detoxification a "function" feels intuitive, but the CR criteria might also validate effects we intuitively regard as spurious, lacking the normative force of "proper function."

  The SE verdict incurs the cost of the **novel-trait (or first-token) problem**. If SE requires prior selection, then new traits (or new uses of old traits) cannot have functions until they have been selected over generations. In SynCons, the consortium is engineered and new. If we accept the SE verdict, the detoxification is not a function *now*, even if it is crucial for survival. This clashes with the intuition that engineers can design functions and that evolution can produce functional novelties that are functional immediately, not just after selection acts.

  *Contested Area:* Whether these costs are fatal is contested. Some SE proponents (e.g., Godfrey-Smith) argue the "first-token" problem is a bullet worth biting to preserve the link between function and reproduction. Some CR proponents argue liberalism is managed by restricting the relevant "system" or "capacity," but there is no consensus on how to non-arbitrarily restrict these without reintroducing historical criteria.

  **3. Normativity and Malfunction**
  *Settled Consensus:* The SE account handles malfunction more naturally. Because SE defines function via a historical standard (what the trait was selected *to do*), a trait that fails to perform that effect is objectively failing to meet its standard. A broken copy of Protein X is malfunctioning because it fails to do what ancestors did.

  The CR account struggles with normativity. On a pure CR view, a broken protein simply lacks the disposition to cause the effect. It is not "failing" in a normative sense; it is merely different. To distinguish a *malfunctioning* detoxifier from a *variant* that never detoxified, CR accounts often must appeal to the expectations of the analyst or the design of the system.

  *Contested Area:* Whether CR accounts can recover normativity is a major site of current debate. **Organizational** or **Dispositional** accounts (e.g., Mossio et al.; Bigelow & Pargetter) attempt to ground normativity in the self-maintaining organization of the system rather than history. They argue that if the trait is required for the system's self-maintenance, its absence constitutes a normative failure. However, critics argue these views either collapse back into SE (by implicitly relying on stability conditions akin to selection) or fail to distinguish malfunction from mere destruction. There is no consensus that CR-style accounts have successfully solved the normativity problem without historical appeal.

  **Conclusion**
  In SynCons, the SE account preserves the distinction between function and accident but denies function to novel, beneficial traits. The CR account captures the current utility of novel traits but risks over-ascribing functions to incidental effects. While SE offers a more robust account of malfunction, recent organizational variants of CR attempt to bridge this gap. The choice between accounts often depends on whether the philosopher prioritizes the historical grounding of norms (SE) or the explanatory utility of current causal roles (CR).

  ---

  #### Marking Scheme (Total: 20 Marks)

  **1. Correct Application of Etiological (SE) Account (4 Marks)**
  *   **Criteria:** Candidate identifies that SE denies the function status because there is no history of selection *for* detoxification in Strain A or the consortium.
  *   **Typical Error:** Treating the benefit to the consortium as sufficient for SE, ignoring the requirement for *historical selection* of that specific effect (conflating current benefit with evolutionary history).

  **2. Correct Application of Causal-Role (CR) Account (4 Marks)**
  *   **Criteria:** Candidate identifies that CR affirms the function status because the protein contributes to the capacity (persistence) of the containing system (the consortium).
  *   **Typical Error:** Failing to specify the "containing system" (e.g., attributing the function to Strain A alone rather than the consortium), which makes the causal role inexplicable within Strain A's internal economy.

  **3. Identification of Specific Theoretical Costs (4 Marks)**
  *   **Criteria:** Candidate explicitly names and explains **Liberalism** (for CR) and the **Novel-Trait/First-Token Problem** (for SE) as they arise in this specific case.
  *   **Typical Error:** Vaguely stating "one is too broad and one is too narrow" without using the specific terminology or explaining *why* the case triggers these specific objections (e.g., failing to note that SynCons is a *new* system).

  **4. Analysis of Malfunction and Normativity (4 Marks)**
  *   **Criteria:** Candidate explains that SE handles malfunction easily via historical standards, while CR struggles to distinguish malfunction from mere absence without additional theoretical machinery.
  *   **Typical Error:** Asserting dogmatically that CR accounts *cannot* account for malfunction at all, ignoring dispositional or organizational variants (e.g., Mossio) that attempt to solve this, even if contested.

  **5. Distinction Between Settled and Contested Claims (4 Marks)**
  *   **Criteria:** Candidate clearly demarcates what is standard textbook philosophy (e.g., Cummins vs. Millikan definitions) from what is live debate (e.g., whether organizational accounts succeed, or if history is strictly necessary).
  *   **Typical Error:** Presenting a contested position (e.g., "History is necessary for all genuine functions") as settled fact, or failing to acknowledge that the "solution" to the malfunction problem in CR is not universally accepted.
