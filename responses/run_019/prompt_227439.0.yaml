  *(Self-Correction on Marking Scheme)*: Make sure the "Common Mistake" is truly common (e.g., thinking levels of description solves everything).

  *(Final Check on Prompt Requirements)*: "Cannot be answered by reciting standard vocabulary." The question design forces synthesis. "Model answer... roughly 700 words." "Marking scheme out of 25." "One-line note on mistake." "Paragraph on First-Class distinction."

