answer: |-
  **TO:** Student Conduct Board
  **FROM:** Faculty Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Draft Sanctioning Framework

  Colleagues,

  The impasse regarding the Dean's draft policy requires us to clarify the philosophical foundations of our conduct system. We are tasked with balancing fairness, efficacy, and our institution's educative mission. After reviewing the arguments, I recommend we **reject the Dean's draft in its current form and adopt a modified framework** that retains language of accountability and censure while integrating rehabilitative supports.

  The Dean's proposal, inspired by Gregg Caruso's public health-quarantine model, offers a compelling ethical advantage: it seeks to minimize suffering and avoids metaphysically fraught claims about desert. We should agree that inflicting pain for pain's sake is unjustifiable. However, applying a quarantine model to academic misconduct is a category error. Unlike a pathogen, plagiarism is not a danger to those who take reasonable care with their own work. A chronic plagiarist does not inadvertently infect others; they violate a normative agreement. When we treat this violation solely as a risk to be managed through "protective measures," we obscure the coercive nature of the sanction. Restricted enrollment is incapacitation. Without the justificatory framework of blame, this incapacitation becomes merely retribution in disguise—inflicting restrictions on liberty without the moral transparency of acknowledging why those restrictions are warranted. We cannot euphemize coercion as healthcare without undermining trust.

  This brings me to my colleague's objection regarding responsibility. She argues that abandoning blame erodes the incentive structure of accountability. I support this conclusion, but I must refine the justification. We need not presuppose libertarian free will to legitimize blame. We can adopt a compatibilist view: blame is not metaphysical payback for having could-have-done-otherwise powers in a causal vacuum. Rather, blame is a communicative practice within a community of reasons. To hold a student responsible is to acknowledge their capacity to understand and respond to normative expectations. When we censure a plagiarist, we are not claiming they are uncaused causers; we are signaling that their actions failed to meet the standards of membership in our scholarly community. Removing this vocabulary treats students as broken objects to be fixed rather than agents capable of answering for their conduct.

  Regarding our educative mission, both camps claim this mantle. The Dean's model emphasizes habit- and skill-building (e.g., citation workshops). The desert-based model emphasizes moral instruction regarding the norms of scholarship. I find the latter more plausible for our context. While skills are necessary, the core violation of plagiarism is ethical, not merely technical. A student who knows how to cite but chooses not to does not need only training; they need to understand the breach of trust. Therefore, sanctions must be described to students not merely as "supportive interventions" but as **consequences that acknowledge harm and rebuild integrity.**

  **Concrete Recommendations:**

  1.  **Language:** We must purge the draft of "public health," "quarantine," and "protective measures." Instead, we will use "Accountability Measures" and "Integrity Violations." We will retain language stating that sanctions are imposed because a student *violated* community standards, not because they *pose a risk*.
  2.  **Sanctions:** For repeat offenders, we will implement a hybrid sanction.
      *   **Rehabilitative Component:** Mandatory supervised study sessions and citation workshops (as the Dean proposed).
      *   **Censure Component:** A formal disciplinary notation on the internal student record for three years. This serves as the deserved censure my colleague defends, signaling the seriousness of the violation without necessarily expelling the student.
  3.  **Communication:** When notifying students, we will state: "This sanction is imposed because your actions violated the community's trust. While these measures include educational components to support future success, they remain disciplinary consequences for a breach of integrity."

  This modification respects the Dean's concern for student development without abandoning the normative clarity required for academic integrity. It allows us to hold students responsible without relying on libertarian metaphysics, treating them as agents capable of answering to reasons. I hope this framework allows us to move forward united.

  Respectfully,

  Faculty Chair
