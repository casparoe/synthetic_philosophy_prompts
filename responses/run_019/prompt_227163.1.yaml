prompt: |-
  I run compliance for a mid-sized charity that funds health and education projects in twelve countries, and my staff keep bringing me borderline cases that our anti-bribery policy doesn't settle: a village committee gives our country director a goat at a farewell ceremony; a ministry clerk hints that our registration will sit in a drawer unless we pay a 'processing fee' that appears on no schedule; a local partner proposes hiring the regional governor's niece, who is genuinely the best-qualified candidate; a mayor we work with has steered a sanitation project towards wards that voted for him, which he describes as keeping faith with his supporters. Write me a decision procedure my field officers can actually run -- a sequence of questions with stopping points -- that distinguishes gifts from bribes, facilitation payments from legitimate fees, and patronage from ordinary political responsiveness. The procedure should be philosophically literate about the debate over whether corruption is a universal notion or a Western export: I want it to take seriously the possibility that some judgements are culturally relative (hospitality norms, obligations to kin and clan, the expectation that officials look after their own) while identifying where, if anywhere, the relativity runs out and a practice is corrupt on any reasonable account -- and it should say what the procedure should do with cases where those two deliver conflicting verdicts. Specify which distinctions the procedure treats as doing the real work (e.g., whether the benefit targets the person or the office, whether a specific quid pro quo is understood, whether the arrangement could survive publicity) and which familiar rules of thumb it should discard as culturally parochial. Then run the procedure on the four cases above, including a clear verdict on each, and identify at least one verdict my staff will find uncomfortable in each direction -- one clearance that will look bad to our European donors and one prohibition that local staff will find obtuse. Finally, mark the points where the procedure has to hand the decision up to me because the question is one of values rather than of classifiable fact. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Compliance Officer for a mid-sized charity (health/education projects, 12 countries).
      *   **Problem:** Staff face borderline cases not covered by standard anti-bribery policy.
      *   **Task:** Create a decision procedure (sequence of questions with stopping points) for field officers.
      *   **Key Requirements:**
          *   Distinguish gifts vs. bribes, facilitation payments vs. fees, patronage vs. political responsiveness.
          *   Philosophically literate: Acknowledge the debate on corruption (universal vs. Western export/cultural relativism).
          *   Identify where relativity ends and universal corruption begins.
          *   Handle conflicts between cultural norms and universal standards.
          *   Specify which distinctions do the "real work" (e.g., publicity test, target of benefit) and which to discard (culturally parochial rules of thumb).
          *   Apply the procedure to the four specific cases provided (goat, processing fee, governor's niece, mayor's wards).
          *   Identify "uncomfortable verdicts" (one clearance donors dislike, one prohibition locals dislike).
          *   Mark points where escalation to the Compliance Officer (user) is needed (values vs. facts).
          *   **Language:** British English.

  2.  **Deconstruct the Philosophical Framework:**
      *   *Universalism vs. Relativism:* The procedure needs to avoid ethical imperialism (assuming Western norms are default) but also avoid ethical nihilism (anything goes if it's local custom).
      *   *Core Harm:* What makes corruption *corruption*? Usually, it's the subversion of public duty for private gain, undermining trust in institutions.
      *   *Key Distinctions:*
          *   *Intent/Quid Pro Quo:* Is there an expectation of specific favour?
          *   *Publicity:* Would this look wrong if published?
          *   *Target:* Is the benefit for the *office* (institutional) or the *person* (private)?
          *   *Systemic Impact:* Does this undermine the mission or local rule of law?
      *   *Discarded Heuristics:* "Zero tolerance on all gifts" (ignores hospitality), "It's legal locally so it's okay" (ignores universal standards), "Value thresholds only" (ignores intent).

  3.  **Drafting the Decision Procedure (The "Flowchart" Logic):**
      *   Need a step-by-step guide.
      *   *Step 1: Nature of the Act.* Is it a transfer of value?
      *   *Step 2: Cultural Context (The Relativism Check).* Is this a recognised local custom?
      *   *Step 3: The Quid Pro Quo.* Is there an expectation of specific action?
      *   *Step 4: The Publicity Test.* Would we be ashamed to publish this?
      *   *Step 5: Institutional vs. Personal.* Who benefits?
      *   *Escalation Points:* Where cultural norms clash with mission values.

  4.  **Refining the Philosophical Nuance:**
      *   Need to explicitly state that *some* practices are culturally embedded (kinship, hospitality) and not inherently corrupt.
      *   However, the *charity's mission* sets a boundary. If a practice undermines the *purpose* of the charity (e.g., equitable health access), it must stop, regardless of local custom.
      *   *The "Conflict" Clause:* If local custom says "yes" but universal mission says "no," the mission wins, but the *manner* of refusal must be culturally sensitive.

  5.  **Applying to the Four Cases:**
      *   *Case 1: The Goat.* Farewell gift. Cultural norm? Yes. Quid pro quo? No (farewell). Publicity? Likely fine. *Verdict: Acceptable (with registration).*
      *   *Case 2: The Processing Fee.* Ministry clerk. Unofficial fee. Quid pro quo? Yes (release registration). Publicity? No (hidden). *Verdict: Prohibited (Facilitation Payment/Bribe).*
      *   *Case 3: The Niece.* Best qualified. Nepotism vs. Merit. Quid pro quo? Implicit (favour to Governor). Publicity? Risky. *Verdict: High Risk/Escalate.* (Need to be careful here. If genuinely best qualified, is it corrupt? It creates an *obligation*. Best to escalate.)
      *   *Case 4: The Mayor.* Sanitation project. Political responsiveness vs. Equitable need. Target: Voters (political gain). Mission impact: Skews health equity. *Verdict: Prohibited (Mission Drift/Corruption of Purpose).*

  6.  **Identifying Uncomfortable Verdicts:**
      *   *Donor Uncomfortable Clearance:* The Goat. Donors hate *any* gifts. But culturally, refusing is an insult.
      *   *Local Uncomfortable Prohibition:* The Mayor's Wards. Locals see this as "delivering for supporters." The charity sees it as violating equitable distribution. Or the Processing Fee (locals see it as "greasing wheels," charity sees it as illegal). Let's go with the Mayor case for locals (political reality vs. idealism) and the Goat for donors (zero tolerance vs. relationship). Actually, the Prompt asks for *one clearance donors dislike* and *one prohibition locals find obtuse*.
          *   *Clearance donors dislike:* The Goat (looks like a benefit to an individual).
          *   *Prohibition locals find obtuse:* The Mayor's Wards (locals understand politicians need to show results to voters; stopping this hampers cooperation) OR The Processing Fee (seen as necessary bureaucracy). Let's choose the Mayor case for locals because it challenges the *political logic* they live by, whereas the fee is just illegal. Actually, the "Niece" case is a good candidate for local friction (hiring kin is expected). Let's stick to the Mayor case for the "obtuse" prohibition because it frames political accountability as corruption.

  7.  **Identifying Escalation Points (Values vs. Facts):**
      *   Determining "Best Qualified" (Niece case).
      *   Determining "Equitable Need" (Mayor case).
      *   Determining if a custom is "Coercive" vs. "Voluntary".

  8.  **Drafting the Content (incorporating British English and Tone):**
      *   Tone: Professional, pragmatic, ethically robust.
      *   Structure: Introduction (Philosophy), The Procedure (Steps), Application (Cases), Uncomfortable Truths, Escalation Matrix.

  9.  **Review against Constraints:**
      *   *British English:* Check spelling (programme, centre, authorised), idioms.
      *   *Philosophically Literate:* Ensure the relativism/universalism tension is explicit in the intro and steps.
      *   *Distinctions:* Highlight Publicity, Quid Pro Quo, Institutional vs. Personal.
      *   *Discarded Heuristics:* Mention value limits and local legality.
      *   *Four Cases:* All analysed.
      *   *Uncomfortable Verdicts:* Explicitly identified.
      *   *Escalation:* Marked clearly.

  10. **Refining the Procedure Steps (Self-Correction during drafting):**
      *   *Initial thought:* Just ask "Is it a bribe?"
      *   *Correction:* Too circular. Need to break it down.
      *   *Step 1:* Is there a transfer of value?
      *   *Step 2:* Is it culturally embedded? (The Relativism Filter).
      *   *Step 3:* Is there a specific *quid pro quo*? (The Corruption Core).
      *   *Step 4:* The Publicity Test (The Universal Standard).
      *   *Step 5:* Mission Alignment (The Charity's Boundary).
      *   *Wait, I need to make sure I address the "Western Export" debate.* I should add a preamble explaining that we reject the idea that *all* local custom is corrupt, but also reject the idea that *no* local custom can be corrupt. The "Harm Principle" is the universal anchor.

  11. **Final Polish:** Check the "Niece" case. If she is genuinely the best qualified, hiring her isn't technically nepotism in a meritocratic sense, but it creates an *obligation*. The procedure needs to flag the *appearance* of impropriety. I will classify this as an "Escalate" because it requires judgement on "best qualified" which is subjective.
      *   *Mayor Case:* This is about resource allocation. If the charity's goal is *need-based*, steering to voters is corrupt relative to the *mission*, even if politically normal locally. This is a strong example of where universal mission overrides local political norms.

  12. **Final check on "Uncomfortable Verdicts":**
      *   Clearance donors dislike: The Goat (looks like personal gain).
      *   Prohibition locals find obtuse: The Mayor's Wards (locals view political patronage as legitimate governance; charity views it as inequitable).

  13. **Writing.** (Proceeding to generate response based on these thoughts).

  *(Self-Correction during final review)*: Make sure I explicitly mention which rules of thumb to discard. E.g., "De minimis value thresholds" and "Local legality".
  Make sure the escalation points are clear.
  Ensure British spelling (programme, authorised, centre, favour).

