answer: |-
  **TO:** Field Operations and Country Directors
  **FROM:** Head of Compliance
  **SUBJECT:** Decision Procedure for Borderline Ethical Cases (The 'Integrity & Context' Protocol)

  ### 1. Preamble: On Universalism and Relativism

  This procedure is designed to navigate the grey zone between cultural respect and institutional integrity. We reject the ethical imperialist view that all Western compliance norms apply universally without modification. We also reject the nihilist view that 'local custom' justifies any practice.

  Corruption is not merely a legal category; it is a moral one. While forms of hospitality, kinship obligation, and political patronage vary by culture, the *core harm* of corruption is universal: the subversion of public or institutional duty for private gain, which undermines trust and equitable outcomes.

  This procedure prioritises three distinctions that do the 'real work' in identifying corruption, regardless of culture:
  1.  **The Target:** Does the benefit accrue to the *office* (institutional) or the *person* (private)?
  2.  **The Quid Pro Quo:** Is there an understood expectation of a specific favour in return?
  3.  **The Publicity Test:** Could this decision withstand full public disclosure without damaging the charity's reputation or mission?

  **Discarded Heuristics:**
  *   **Value Thresholds:** Do not rely solely on monetary limits. A small gift with a specific *quid pro quo* is a bribe; a large gift with no expectation of return may be hospitality.
  *   **Local Legality:** Just because a payment is common or unpunished locally does not make it compliant with our universal mission standards.
  *   **Zero-Tolerance Rigidity:** Refusing all gifts can be as damaging as accepting too many, as it severs the social fabric required to work.

  ---

  ### 2. The Decision Procedure

  Field officers should run potential issues through the following five steps. Stop at the first definitive verdict. If a step requires a judgement call on values rather than facts, **ESCALATE** to the Head of Compliance.

  #### Step 1: The Nature of the Transfer
  **Question:** Is there a transfer of value (money, goods, services, employment, preferential treatment)?
  *   **No:** Proceed with activity.
  *   **Yes:** Proceed to Step 2.

  #### Step 2: The Cultural Embedding Test (Relativism Filter)
  **Question:** Is this practice a recognised, longstanding social norm in this specific community (e.g., wedding gifts, funeral contributions, ceremonial hospitality) that applies generally, not just to NGO workers?
  *   **No:** This is likely a commercial or bureaucratic transaction. Treat as high risk. Proceed to Step 3.
  *   **Yes:** This is a cultural practice. It is *prima facie* acceptable **UNLESS** it violates Step 3. Proceed to Step 3.

  #### Step 3: The Quid Pro Quo Test (The Corruption Core)
  **Question:** Is there an explicit or implicit understanding that this transfer secures a specific action, decision, or omission that would not otherwise occur?
  *   **Yes:** **STOP.** This is a Bribe or Facilitation Payment. **PROHIBITED.**
  *   **No:** Proceed to Step 4.
      *   *Note:* Distinguish between 'general goodwill' (acceptable) and 'specific influence' (unacceptable).

  #### Step 4: The Publicity and Mission Test (Universal Standard)
  **Question:** If this transaction were published on the front page of a local newspaper *and* in our European donor newsletter, would it:
      (a) Undermine trust in our neutrality?
      (b) Contradict our mission of equitable distribution (e.g., helping the neediest, not the loudest)?
  *   **Yes to either:** **STOP.** **PROHIBITED** (or requires Mitigation).
  *   **No:** Proceed to Step 5.

  #### Step 5: The Personal vs. Institutional Test
  **Question:** Does the benefit primarily enrich the individual official or their kin, or does it support the office/function they hold?
  *   **Individual/Kin:** High Risk. **ESCALATE** to Head of Compliance.
  *   **Office/Function:** Acceptable with documentation.

  ---

  ### 3. Application to Current Cases

  Here is how the procedure applies to the four borderline cases currently pending.

  #### Case A: The Farewell Goat
  *   **Context:** Village committee gives Country Director a goat at a farewell ceremony.
  *   **Step 1:** Yes, transfer of value.
  *   **Step 2:** Yes, ceremonial gift-giving is a recognised norm for departures in this region.
  *   **Step 3:** No *quid pro quo*. The Director is leaving; no future favour can be expected.
  *   **Step 4:** Publicity is unlikely to damage reputation; it signals good relationships.
  *   **Step 5:** Benefit is to the person, but it is a one-off cultural marker.
  *   **Verdict:** **CLEARANCE (with conditions).** The gift must be registered, declared, and ideally shared (e.g., consumed at a staff farewell or donated to a community project) rather than taken home privately.
  *   **Escalation:** None required if shared/consumed.

  #### Case B: The 'Processing Fee'
  *   **Context:** Ministry clerk hints registration will stall unless an unofficial fee is paid.
  *   **Step 1:** Yes, transfer of value.
  *   **Step 2:** No. While common, this is not a 'social norm' like a wedding gift; it is an informal tax.
  *   **Step 3:** **Yes.** The *quid pro quo* is explicit: pay to release the drawer.
  *   **Verdict:** **PROHIBITED.** This is a facilitation payment.
  *   **Escalation:** None. Hard stop.

  #### Case C: The Governor's Niece
  *   **Context:** Local partner proposes hiring the regional governor's niece; she is genuinely the best-qualified candidate.
  *   **Step 1:** Yes, employment is value.
  *   **Step 2:** Yes, kinship hiring is a common local expectation.
  *   **Step 3:** Ambiguous. Even if she is qualified, is the *offer* made to secure the Governor's continued support?
  *   **Step 4:** Publicity risk is high. It looks like patronage.
  *   **Step 5:** Benefit is to kin (Individual).
  *   **Verdict:** **ESCALATE.** This requires a values judgement on whether the appearance of impropriety outweighs the meritocratic gain.
  *   **Instruction:** Do not proceed until Compliance reviews the recruitment audit trail.

  #### Case D: The Mayor's Wards
  *   **Context:** Mayor steers sanitation project towards wards that voted for him to 'keep faith with supporters'.
  *   **Step 1:** Yes, preferential treatment in resource allocation.
  *   **Step 2:** Yes, political patronage is a standard local governance model.
  *   **Step 3:** Yes. The 'favour' is the project; the 'return' is political capital/loyalty.
  *   **Step 4:** **Yes.** This contradicts our mission of equitable health access based on *need*, not political affiliation.
  *   **Verdict:** **PROHIBITED.** We cannot partner on a project where allocation is politically skewed.
  *   **Escalation:** Head of Compliance to lead negotiation on re-allocation criteria.

  ---

  ### 4. Uncomfortable Verdicts

  This procedure will generate friction. We must anticipate where it will feel wrong to different stakeholders.

  **1. The Clearance Donors Will Dislike (Case A: The Goat)**
  *   **The Friction:** European donors often operate on a 'zero-gift' policy. They will view accepting a goat as a slippery slope towards personal enrichment.
  *   **Our Stance:** Refusing the goat would be a profound cultural insult, signalling that the Director views themselves as above the community. We prioritise the *relationship* over the *asset value*, provided the *quid pro quo* is absent. We accept the reputational risk to maintain local access.

  **2. The Prohibition Locals Will Find Obtuse (Case D: The Mayor's Wards)**
  *   **The Friction:** Local staff and the Mayor will argue that politicians *must* deliver for their supporters to remain in power. They will view our refusal as naive Western idealism that ignores the reality of how change is achieved locally.
  *   **Our Stance:** While politically logical locally, this violates the universal principle of *equity* central to our charitable mission. If we fund based on votes rather than health need, we are not a charity; we are a campaign donor. We must hold this line even if it slows project rollout.

  ---

  ### 5. Escalation Matrix: Values vs. Facts

  Field officers are authorised to make factual determinations (e.g., "Is there a fee schedule?"). However, the following questions are matters of **values** and must be referred to the Head of Compliance:

  1.  **Merit vs. Obligation (Case C):** When a candidate is qualified *and* connected, can we prove the hiring decision was driven *solely* by merit? (Requires audit of interview scores).
  2.  **Mission Drift (Case D):** When does 'political responsiveness' become 'discriminatory allocation'? (Requires assessment of needs data vs. project map).
  3.  **Coercion vs. Custom (Step 2):** Is a 'customary gift' actually voluntary, or is it a coerced expectation that functions as a tax? (Requires assessment of power dynamics).

  **Instruction:** In all escalated cases, operations must pause. Do not assume that 'getting the job done' justifies bypassing this protocol. The integrity of the process is part of the deliverable.

  ***

  **Approved by:** Head of Compliance
  **Date:** 24 May 2024
  **Review Date:** 24 May 2025
