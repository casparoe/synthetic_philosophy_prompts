answer: |-
  This is one of the deepest puzzles in legal and political theory, often framed as the problem of the "dead hand" of the past. You have correctly identified that the standard Ulysses analogy breaks down when the agent binding themselves and the agent bound are not the same biological entities.

  To answer your question, we need to reconstruct the metaphysical and political assumptions that allow constitutionalism to claim legitimacy despite this generational gap. The practice of constitutional entrenchment presupposes a specific view of political identity, authority, and time.

  Here is a reconstruction of the implicit theory, the rival views it excludes, the consistency of the practice, and the design implications of taking your critique seriously.

  ### 1. The Implicit Theory: "The People" as a Trans-Temporal Corporation

  The practice of constitutional entrenchment relies on a distinction between **the electorate** (the collection of living voters at time *T*) and **the People** (a corporate, trans-temporal political entity).

  **A. The Continuing Agent Hypothesis**
  Constitutional theory generally presupposes that "The People" is a single, continuing agent that exists across time, much like a corporation or a trust.
  *   **Metaphysics:** Just as a corporation survives the turnover of its employees and shareholders, the Polity survives the turnover of its citizens.
  *   **Implication:** When a Constitutional Assembly ratifies a document, it is not *Generation A* binding *Generation B*. It is *The People* (at time 1) issuing standing orders to *The People* (at time 2). Since it is the same agent, the Ulysses analogy is restored, but at the collective level.
  *   **Authority:** This view grants the Constitution a higher democratic pedigree than ordinary legislation. Ordinary laws are the will of the *government* (agents); the Constitution is the will of the *Principal* (The People).

  **B. Hierarchy of Wills (Constituent vs. Constituted Power)**
  This resolves the tension you noted regarding "no parliament can bind its successors."
  *   **Ordinary Legislation:** This is the act of *constituted power* (the legislature). Since the legislature is merely an agent of the current majority, it cannot bind future agents. To allow it to do so would allow agents to usurp the Principal's authority.
  *   **Constitutional Law:** This is the act of *constituent power* (The People). Because this power is superior to the legislature, it *can* bind the legislature.
  *   **Consistency:** The system is internally consistent only if you accept that the Legislature $\neq$ The People. If you believe a simple parliamentary majority *is* the full embodiment of the popular will (as in the British Diceyan tradition), then constitutional entrenchment is indeed illegitimate. But in most constitutional democracies, the Parliament is a subordinate body.

  **C. Epistemic Privilege of the "Constitutional Moment"**
  Why is the past judgment privileged over the present? The implicit theory argues that the conditions under which Constitutions are made are epistemically superior to ordinary lawmaking.
  *   **Deliberative Quality:** Constitutional moments (foundings, reconstructions) are assumed to be periods of heightened public engagement, cooler deliberation, and broader consensus (Bruce Ackerman's "dualist democracy").
  *   **Ordinary Politics:** Day-to-day legislation is prone to factionalism, short-termism, and passion.
  *   **The Bet:** The entrenchment is a bet that the "sober past" is a better guardian of fundamental rights than the "tempted present."

  ### 2. Rival Views Ruled Out

  By adopting the Continuing Agent theory, constitutional entrenchment quietly rules out several rival conceptions of political community:

  **A. Generational Sovereignty (The Jeffersonian View)**
  Thomas Jefferson famously argued that "the earth belongs in usufruct to the living." He calculated that a generation lasts about 19 years; therefore, no debt or law should bind a society longer than that.
  *   **The View:** Each generation is a distinct sovereign agent. Consent cannot be inferred across time.
  *   **Ruled Out:** This view renders "eternity clauses" (like Germany's) morally incoherent. It views hard amendment procedures not as stability, but as inter-generational tyranny.

  **B. Actualist Consent Theory**
  This view holds that legitimacy requires the actual consent of the governed.
  *   **The View:** Since future people cannot consent to a constitution drafted before they were born, the constitution lacks legitimacy unless ratified by each generation.
  *   **Ruled Out:** Constitutionalism relies on *hypothetical* or *tacit* consent (e.g., "by staying here, you agree to the rules"). The practice rules out the requirement for explicit, periodic re-ratification.

  **C. The Legislature as Supreme Democratic Organ**
  In systems like the UK (traditionally), Parliament is sovereign.
  *   **The View:** The current elected majority is the highest expression of democracy.
  *   **Ruled Out:** Strong-form judicial review and unamendable clauses. If the current majority is supreme, a judge striking down a law based on a 200-year-old text is anti-democratic.

  ### 3. Is the Practice Internally Consistent?

  You asked if the practice is consistent given it pairs entrenchment with the "no-binding-successors" doctrine.

  **It is consistent *if* you accept the Dualist Democracy model.**
  If there are two tracks of politics—*constitutional politics* (high stakes, rare, supermajoritarian) and *normal politics* (low stakes, frequent, majoritarian)—then the rules logically differ.
  *   Normal politics: Simple majority can repeal (agents changing instructions).
  *   Constitutional politics: Supermajority required (Principal changing the corporate charter).

  **It is inconsistent *if* you view democracy as purely majoritarian.**
  If democracy is defined strictly as "the current majority gets what it wants," then *any* entrenchment is inconsistent. The "no-binding-successors" rule for ordinary law is just a weaker version of the same principle that should apply to constitutions. The fact that we apply it to one but not the other reveals a tension: we want the stability of the past when it protects rights we like, but the freedom of the present when we want to change things.

  ### 4. Design Implications: Taking the "Distinct Generations" View Seriously

  If we dropped the Continuing Agent picture and adopted the Jeffersonian "Distinct Generations" view, constitutional design would change radically:

  **A. Sunset Clauses**
  Constitutions would have expiration dates. Jefferson suggested 19 years; modern theorists might suggest 30 or 50. The constitution would lapse unless explicitly re-ratified by the living generation.

  **B. Easier Amendment Procedures**
  Article V of the US Constitution is notoriously difficult. A distinct-generations view would require amendment thresholds closer to simple majorities, acknowledging that the current majority should not be held hostage by a supermajority of the dead.

  **C. Abolition of "Eternity Clauses"**
  Provisions that place certain principles beyond amendment (like human dignity in the German Basic Law) would be eliminated. No principle could be immune to the will of the current living generation.

  **D. Periodic Constitutional Conventions**
  Instead of relying on courts to interpret old text, there would be mandated periodic conventions to rewrite the foundational charter, ensuring the "Ulysses" binding himself is actually the same person currently steering the ship.

  **E. Debt and Obligation Limits**
  Following Jefferson's logic, long-term sovereign debt or environmental obligations that burden future generations without their consent would face stricter constitutional hurdles or require trust-fund collateralization.

  ### 5. Underdetermination: Multiple Theories License the Practice

  Finally, as you requested, I must note that the practice is underdetermined. Different constitutional systems justify entrenchment using different theories, none of which are universally accepted:

  1.  **The Contractarian View (US Style):** The Constitution is a social contract. Contracts bind successors because property and rights are transferred across time. *Critique:* You can't sign a contract for someone else.
  2.  **The Objective Value Order (German Style):** The Constitution isn't just the will of the people; it embodies objective moral truths (human dignity) that are discoverable by reason, not just voted on. Therefore, even a current majority cannot violate them. *Critique:* This is anti-democratic and relies on moral realism.
  3.  **The Common Law Constitution (UK/Canada Style):** The constitution isn't a fixed text but an evolving tradition. Entrenchment exists but is flexible. *Critique:* This blurs the line between ordinary and constitutional law, returning to the "binding successors" puzzle.
  4.  **The Pre-commitment Strategy (Elster/Holmes):** We bind ourselves not because the past is wiser, but because we know our future decision-making procedures will be flawed (e.g., panic, tyranny of the majority). *Critique:* This accepts your critique that it *is* binding others, but argues it is a necessary evil for coordination.

  ### Summary

  The practice of constitutional entrenchment presupposes that **"The People" is a fictional, trans-temporal corporation** rather than a collection of living individuals. It privileges the **constituent power** of the past over the **constituted power** of the present, assuming that the *process* of constitutional founding was more democratic and rational than daily legislation.

  It rules out the view that **democratic legitimacy requires the actual consent of the currently living.**

  If you take the "distinct generations" view seriously, constitutions become temporary operating agreements rather than sacred charters, requiring periodic renewal, easier amendment, and the elimination of unamendable clauses. The current practice remains stable only as long as citizens accept the fiction that they are the same agent as their ancestors. When that fiction frays (as in periods of intense polarization or generational conflict), the legitimacy of the "dead hand" is exactly what comes under fire.
