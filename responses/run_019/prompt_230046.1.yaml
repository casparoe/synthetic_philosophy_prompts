answer: |-
  You have hit upon one of the most famous and persistent puzzles in the philosophy of science. Your intuition is spot-on: logically, it seems like the timing of the evidence shouldn't matter, yet scientifically, it matters immensely.

  Here are the names for the concepts you are grappling with, followed by an explanation of where the line is drawn and whether it holds up.

  ### 1. The General Puzzle: "The Problem of Old Evidence"
  The specific paradox you described—where known facts seem unable to confirm a new theory under strict logical models, yet clearly do so in practice—is called **The Problem of Old Evidence**.

  It was famously articulated by the philosopher Clark Glymour in the 1980s. It arises primarily in **Bayesian confirmation theory**. In Bayesian math, for evidence ($E$) to confirm a hypothesis ($H$), learning $E$ must increase your probability of $H$. But if $E$ is already known (like Mercury's orbit), its probability is already 100%. You can't learn something you already know. Therefore, mathematically, old evidence shouldn't be able to boost a new theory's credibility. Yet, historically, Mercury's orbit *did* boost General Relativity. Resolving this discrepancy is the "Problem of Old Evidence."

  ### 2. The Distinction: "Prediction vs. Accommodation"
  The distinction you feel between the two cases is known as **Prediction vs. Accommodation** (sometimes discussed under the label **Use-Novelty**).

  *   **Prediction (Case 1):** The theory entails the fact, but the fact was *not used* in the construction of the theory. (Even if the fact was known temporally, it was not used *heuristically*).
  *   **Accommodation (Case 2):** The theory was constructed or adjusted *specifically* to ensure it matched the fact.

  ### 3. Where is the Line? (The Principled Difference)
  You asked: *If the facts were already in hand, how can they boost a new theory at all? And what makes the second case cheap?*

  The difference is not in the **logic** (the relationship between theory and fact); it is in the **genealogy** (how the theory was built).

  #### A. Degrees of Freedom and Overfitting
  The best way to understand this is through statistics. Imagine you have a scatter plot of 10 points (the facts).
  *   **Case 2 (Accommodation):** You draw a squiggly line that passes through every single point. You can always do this if you make the equation complex enough. This is called **overfitting**. The line fits the past data perfectly but will likely fail to predict the *next* point because it captured the noise, not the signal.
  *   **Case 1 (Prediction):** You draw a straight line based on a completely different dataset. When you overlay it on the 10 points, it fits them surprisingly well. This is shocking. A simple model shouldn't fit old data perfectly unless it has captured the underlying reality.

  In the Mercury example, Einstein did not add a "Mercury parameter" to General Relativity. He derived the field equations from principles of equivalence and geometry. When he solved those equations for the solar system, the Mercury anomaly popped out automatically. The theory had no "degrees of freedom" left to tweak to make it fit. It risked being wrong.

  #### B. The "No Miracles" Argument
  The philosophical justification is often called the **No Miracles Argument**.
  *   If you build a theory to fit the data (Accommodation), it is no miracle that it fits. You built it to do that.
  *   If you build a theory for Reason A, and it turns out to explain Fact B (which you didn't use), it would be a **miracle** if the theory were false. The only non-miraculous explanation is that the theory is actually true (or approximately true).

  ### 4. Is the Line Sharp?
  You asked if the distinction holds up or if it slips away. This is where it gets messy. The line is **conceptually sharp but historically fuzzy.**

  #### The Fuzzy History (The Einstein Nuance)
  Historians of science actually debate the Mercury case. Einstein *knew* about the Mercury anomaly before he finished General Relativity. Some argue he subconsciously tweaked his theory to ensure it matched Mercury. If he did, then logically, Mercury should count as "Accommodation," not "Prediction."
  However, most philosophers argue that because the mathematics of General Relativity were so constrained by fundamental principles, he *couldn't* have tweaked it easily. The "fit" was a consequence of the structure, not a parameter adjustment.

  #### The "Use-Novelty" Criterion
  To fix the fuzziness, philosophers like John Worrall argue for **Use-Novelty** rather than **Temporal Novelty**.
  *   **Temporal Novelty:** The fact was discovered *after* the theory was published. (Easy to verify, but not strictly necessary).
  *   **Use-Novelty:** The fact was *not used* in the construction of the theory. (Harder to verify, but logically more sound).

  The distinction holds up **if** you can prove the theorist did not use the data to tune the model. In modern science, we try to enforce this via **pre-registration**. In medicine or psychology, researchers must state their hypothesis and analysis plan *before* looking at the data. If they look at the data first, then "predict" it, it is considered "p-hacking" or "HARKing" (Hypothesizing After Results are Known). This is the institutional enforcement of the Prediction vs. Accommodation distinction.

  ### Summary
  *   **The Puzzle:** The Problem of Old Evidence.
  *   **The Distinction:** Prediction vs. Accommodation (or Use-Novelty).
  *   **The Difference:** It lies in the **independence of the theory's construction**. Did the theory *risk* being falsified by the data, or was it *guaranteed* to fit?
  *   **Does it hold up?** Yes, but it requires honesty about how the theory was generated. In the absence of transparency (like in historical cases), it can be difficult to prove whether a fit was a genuine prediction or a clever accommodation.

  You are drawing a distinction that is fundamental to the scientific method. The feeling that the second case is "cheap" is the feeling of detecting **overfitting**. The feeling that the first case is "strong" is the detection of **robustness**.
