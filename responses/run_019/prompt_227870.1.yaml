answer: |-
  # DECISION TREE: EPISTEMIC STATUS OF NUMBER-THEORETIC HEURISTICS

  **Instructions:** Start at **Q1**. Follow the path corresponding to your intuitive answer. Read the position at the leaf. Compare your result with your peers to locate disagreements.

  ### THE TREE

  **Q1. Can a rational agent hold a credence strictly between 0 and 1 in an unproven conjecture (e.g., Twin Primes)?**
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to **Q2**.

  **Q2. If a heuristic (e.g., Cramér's model) predicts correctly 20 times, does this transfer warrant to the 21st prediction?**
  *   **No:** Go to **Leaf B**.
  *   **Yes:** Go to **Q3**.

  **Q3. When the model fails (e.g., Maier's Theorem on short intervals), does this undermine the *general method* or just the *specific parameters*?**
  *   **General Method (Global Defeat):** Go to **Leaf C**.
  *   **Specific Parameters (Local Defeat):** Go to **Q4**.

  **Q4. The "independence presumption" (that divisibility by $p$ and $q$ are unrelated): Does this track a feature of the primes themselves, or merely our lack of knowledge?**
  *   **Feature of the Primes (Ontic):** Go to **Leaf D**.
  *   **Lack of Knowledge (Epistemic):** Go to **Q5**.

  **Q5. Does a successful heuristic primarily justify *believing* the conjecture is true, or *investing time* in proving it?**
  *   **Believing (Truth-Tracking):** Go to **Leaf E**.
  *   **Investing (Action-Guiding):** Go to **Leaf F**.

  **Q6. (For Leaf F only) If two distinct heuristics support the same conjecture, do their warrants sum?**
  *   **Yes:** **Leaf F (Aggregating)**.
  *   **No:** **Leaf F (Redundant)**.
  *(Note: For the purpose of this handout, we treat these as a single position class.)*

  ---

  ### THE POSITIONS (LEAVES)

  **Leaf A: The Deductive Purist**
  *   **Core View:** Mathematics is binary; heuristics are psychological aids with no epistemic weight.
  *   **Most Awkward Commitment:** Must explain why mathematicians' calibrated confidence (e.g., in Riemann Hypothesis) tracks truth so well if heuristics confer zero justification.

  **Leaf B: The Local Skeptic**
  *   **Core View:** We can be uncertain, but heuristic success is coincidental; each conjecture stands alone.
  *   **Most Awkward Commitment:** Must explain why we never treat a heuristic that has failed 1,000 times the same as one that has succeeded 1,000 times, if no warrant transfers.

  **Leaf C: The Fragile Realist**
  *   **Core View:** Heuristics track truth, but the "randomness" of primes is brittle; one failure (Maier) breaks the whole probabilistic framework.
  *   **Most Awkward Commitment:** Must explain why we continue to use probabilistic models successfully in cryptography and physics if a number-theoretic counterexample destroys their general reliability.

  **Leaf D: The Probabilistic Realist**
  *   **Core View:** Primes genuinely behave like random variables; independence is a structural fact about $\mathbb{N}$, not just ignorance.
  *   **Most Awkward Commitment:** Must explain how objective probabilities attach to necessary truths (the primes *are* what they are, they aren't "generated" by a dice roll).

  **Leaf E: The Instrumentalist Bayesian**
  *   **Core View:** Heuristics update rational credence, but "randomness" is just a model for human ignorance; failures are local model errors.
  *   **Most Awkward Commitment:** Must define the "logic" of this ignorance without collapsing into Leaf A (saying the ignorance is irrelevant) or Leaf D (saying the ignorance reflects reality).

  **Leaf F: The Research Pragmatist**
  *   **Core View:** Heuristics do not make conjectures *true*, they make them *profitable* targets for proof.
  *   **Most Awkward Commitment:** Must explain why a heuristic-backed conjecture feels *different* to work on than a whim, if the likelihood of truth is unchanged.

  ---

  ### UNOCCUPIED LOGICAL SPACE

  **The Dogmatic Realist (Ontic + No Local Defeat)**
  *   *Path:* Q1(Yes) → Q2(Yes) → Q3(Local) → Q4(Ontic).
  *   *Status:* **Unattractive.** This view claims primes are objectively random but that counterexamples (Maier) don't undermine the randomness claim. This looks like immunizing a theory against falsification.

  **The Incoherent Fallibilist (No Transfer + Belief)**
  *   *Path:* Q1(Yes) → Q2(No) → Q5(Belief).
  *   *Status:* **Incoherent.** If past success confers no warrant for future predictions, there is no rational basis for updating credence in the conjecture's truth.

  **The Global Skeptic (No Credence + Action Guide)**
  *   *Path:* Q1(No) → Q5(Investing).
  *   *Status:* **Neglected.** One could argue we have no credence but still use heuristics to allocate resources. This is rarely defended explicitly, as it mimics Leaf F without the Bayesian machinery.

  ---

  ### NOTE ON PHENOMENOLOGY

  **Do distinct attitudes map to distinct leaves?**
  Mostly yes, but there is a **phenomenological overlap** between **Leaf E (Instrumentalist Bayesian)** and **Leaf F (Research Pragmatist)**.
  *   *The Overlap:* Both answer "Yes" to credence and "Yes" to warrant transfer. Both treat failures as local.
  *   *The Difference:* A student at Leaf E feels their *belief* in the Twin Prime Conjecture has strengthened (e.g., from 50% to 90%). A student at Leaf F feels their *willingness to work* has strengthened, but they refuse to assign a probability to the truth itself.
  *   *Diagnostic:* If you answer Q5 with "Both," you are straddling E and F. The tree forces a choice, but your intuition may not.

  ---
