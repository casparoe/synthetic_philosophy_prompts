answer: |-
  An HR Director, authorized to terminate staff and following every company protocol for dismissal, drafts a formal letter stating "Your employment is ended effective immediately," signs it digitally, and clicks send from her official account, which generates an automated delivery receipt. She intends to fire the employee at that moment and believes the process is complete. However, due to an unknown server glitch, the email is diverted to a quarantine folder and never reaches the employee's inbox, nor is any notification sent to the employee's phone; the employee arrives at work the next day expecting to clock in, completely unaware of the message.

  **Austin's Verdict:** The act of firing was **not performed**. For Austin, the securing of "uptake"—the hearer's understanding that the procedure is being invoked—is a necessary condition for the illocutionary act to be successfully secured. Since the employee never received or understood the declaration, the conventional procedure was not fully executed between the parties, and the act misfires or remains incomplete.

  **Searle's Verdict:** The act of firing **was performed**. For Searle, the illocutionary act is constituted by the speaker's intention to impose an obligation or status, expressed via constitutive rules. The Director expressed the intention to fire using the correct conventional means; the failure of the email to arrive is a failure of *communication* (perlocution), not a failure of the *act* itself (illocution). The normative change occurred when the intention was expressed, regardless of the hearer's ignorance.

  **The Feature Doing the Work:** The necessity of **uptake** (hearer understanding/receipt) for the completion of the speech act.

  **Removing the Feature:** If the email successfully arrives and is read by the employee, both accounts agree the firing was performed (Austin's uptake condition is met; Searle's intention is successfully communicated).

  **Best Reply for the Counter-Intuitive Account (Searle):** Searle can distinguish between the *illocutionary act* (the expression of the intention to fire) and the *institutional fact* (the actual change in employment status). He might argue that while the speech act was performed by the Director, company policy imposes a further *regulative* rule requiring receipt for the institutional fact to take hold. This saves the intention-based account of the act while conceding the practical outcome.

  **Ordinary Practice:** Actual HR departments and employment law side with **Austin**. Termination generally requires effective notice; a firing letter that is never received does not legally terminate employment, as the employee cannot be bound by a directive they could not possibly know. Practice treats uptake as constitutive of the valid act, not merely its effect.
