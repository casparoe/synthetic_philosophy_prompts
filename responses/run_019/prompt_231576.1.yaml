  **Prediction:** She will rule that the student is **not** engaged in real self-deception.

  **Best-Guess Criterion:**
  She does **not** require the person to have believed the truth at some point (the "twisted" jealous husband case rules that out). Instead, her criterion for "real" self-deception requires **active cognitive contact with specific counter-evidence**.

  To count as self-deception on her narrow view, the agent must have encountered *some* specific, threatening content and then motivatedly suppressed, stopped looking, or reinterpreted *that specific content*. Mere motivated avoidance of *access* to evidence (willful ignorance), without ever registering the specific threat, falls into the category of anxiety-driven wishful thinking or strategic ignorance, but not self-deception proper.

  **Closest Analog:**
  **The Lottery Player.**
  Like the student, the lottery player maintains a belief ("I will win" / "I passed") despite a known statistical risk, without having encountered any *specific* evidence regarding the particular outcome (the specific ticket / the specific email content). In both cases, the belief is insulated from specific counter-evidence because that evidence was never cognitively processed, only avoided or statistically outweighed by hope/fear.

  **Test Vignette:**
  To cleanly settle whether **access avoidance** is enough or if **content contact** is required, consider this case:

  > A heavy smoker keeps his cigarettes in a drawer so he never sees the graphic health warnings on the pack. He tells himself, "Smoking isn't that bad for me."
  > *Versus:*
  > A heavy smoker takes a cigarette out, sees the graphic health warning, feels a pang of fear, puts it back in the pack, and tells himself, "Smoking isn't that bad for me."

  If she rules the first case **not self-deception** and the second **real self-deception**, it confirms that her narrow criterion demands **prior cognitive registration of the specific threat**, not just motivated avoidance of the source.
