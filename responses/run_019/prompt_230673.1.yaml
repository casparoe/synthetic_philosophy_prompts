answer: |-
  This is a fantastic philosophical standoff. You've correctly identified that your friend is occupying a space where **Al-Ghazali (Occasionalism)** and **David Hume (Regularity Theory)** look identical from the outside, but are fundamentally different on the inside.

  Both agree that you cannot *observe* a necessary connection between created things (fire and cotton, ball and ball). Both deny that created things have intrinsic causal power.

  However, they diverge on **what replaces that power.**

  Here is the breakdown of where she likely stands, what she will say about your healer case, and the specific follow-up that will force her to reveal her hand.

  ### 1. The Diagnosis: Humean vs. Ghazalian
  Based on her rhetoric ("smuggling in something you can't observe"), she sounds much more like a **Humean Regularity Theorist** than a Ghazalian Occasionalist.

  *   **The Ghazalian (Occasionalist):** Denies that fire burns cotton, but **affirms** that God burns the cotton. For Ghazali, causation is real, but it is *vertical* (from God to world), not *horizontal* (from thing to thing). He replaces "natural power" with "Divine Will."
  *   **The Humean (Regularity):** Denies that fire burns cotton and **stops there.** He argues that since we can't observe the power, we shouldn't posit *any* agent. Causation is just a psychological habit we form when we see Event B follow Event A repeatedly. There is no "oomph" anywhere, not even from God.

  **Why she sounds like Hume:** When you press her on the "oomph," she says you can't observe it. Ghazali would agree you can't observe *natural* oomph, but he would insist we know *Divine* oomph through reason and revelation. If she refuses to posit *any* agent and rests entirely on observability, she is an empiricist skeptic (Hume), not a theological occasionalist (Ghazali).

  ### 2. The Verdict on the Healer Case
  You throw the case: *A healer prays, the fever breaks instantly. It never happens before or since.*

  **If she is a Humean (Most Likely):**
  She will call it a **coincidence.**
  *   **Reasoning:** For a Humean, causation *is* constant conjunction. By definition, a one-off event cannot be a cause. If there is no pattern, there is no causation. To say the prayer *caused* the healing would be to commit the very error she accuses you of: assuming a connection without observational evidence of regularity.
  *   **Her Line:** "Correlation isn't causation. Without a pattern, it's just a lucky sequence of events."

  **If she is a Ghazalian (Less Likely):**
  She will call it a **miracle (Divine Causation).**
  *   **Reasoning:** For Ghazali, regularity is just the "Habit of God." God usually makes fire burn cotton, but He is not bound by it. If the fever breaks on the occasion of the prayer, God chose to create the health *at that moment*. The lack of prior pattern doesn't matter because God's Will is free, not mechanical.
  *   **Her Line:** "God chose to heal the patient on the occasion of the prayer. The lack of pattern just shows God isn't bound by nature's habits."

  **Prediction:** Given her "you can't observe it" stance, she will almost certainly call it a **coincidence.** She is treating the lack of regularity as a disqualifier for causation, which is a Humean move, not a Ghazalian one.

  ### 3. The Tie-Breaker Case
  If she hedges on the healer case (e.g., "Who knows?"), you need to ask about the **source of regularity.**

  The core difference is this: **Does the universe run on autopilot, or is it being piloted?**

  **Throw this case at her:**
  > "Imagine you put cotton in the fire tomorrow, and instead of burning, it **turns to ice.** No explosion, no trickery. It just freezes.
  >
  > **Question:** Is this impossible because it violates a law of nature? Or is it possible because God just decided to change His habit?"

  **How to read her answer:**

  *   **The Humean Answer:** "It's logically possible, but physically impossible. It would mean our understanding of the laws of physics was wrong. It's just a **brute fact** that the universe usually behaves one way and not the other."
      *   *Why:* Humeans believe in the "Uniformity of Nature" as a pragmatic assumption. There is no *Agent* choosing the habit; there are just patterns.

  *   **The Ghazalian Answer:** "It is fully possible. There is no 'law of nature' forcing the fire to burn. God creates the burning every time. If He creates freezing instead, that's just Him acting differently. The 'law' is just a description of God's **custom**."
      *   *Why:* Ghazali argues that what we call "laws" are just God's consistent habits (*adat Allah*). God is not compelled by logic or nature to burn the cotton; He chooses to.

  ### Summary of Strategy
  1.  **Current Read:** She is a **Humean**. She denies secondary causes (like Ghazali) but refuses to affirm a Primary Cause (unlike Ghazali).
  2.  **Healer Prediction:** She will say it's a **coincidence** because it lacks regularity.
  3.  **Killer Follow-up:** Ask about the **Fire-Freezing Case.**
      *   If she talks about "violating laws" or "brute facts," she's a **Humean**.
      *   If she talks about "God's Will" or "Divine Habit," she's a **Ghazalian**.

  If she admits she doesn't believe in God but still holds the "no necessary connection" view, you can gently point out that she's essentially running **Atheistic Occasionalism**—which is philosophically precarious, because if there's no God holding the moments together, and no necessary connection between them, it becomes very hard to explain why the sun rose this morning at all!
