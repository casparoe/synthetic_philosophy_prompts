      *   *Truth-Conduciveness:* This is the hardest philosophical hit. If $P(E|p)$ is fixed, how does justification change? *Reply:* Justification isn't just probability; it's sufficiency for closure of inquiry. *Soft spot:* Risks severing justification from truth.

  5.  **Drafting the "Hope Nobody Asks":**
      *   *What is it?* The "Knowledge-Action Principle" (KAP) tension. If the Manager doesn't know, she shouldn't act. But she *must* act (or is rational to act based on the Inspector's word). If MPE says she doesn't know, does it imply she acts irrationally? Or does it break the link between Knowledge and Rational Action?
