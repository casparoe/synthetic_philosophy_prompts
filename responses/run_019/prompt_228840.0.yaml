answer: |-
  # Q&A PREP SHEET: Moderate Pragmatic Encroachment & The Delegation Problem

  **Status:** High Risk. The Delegation Problem is your strongest intuitive lever, but it exposes the metaphysical cost of the view. The audience is hostile to the core mechanism (stakes affecting justification).
  **Strategy:** Do not defend the *term* 'knowledge' at all costs. Defend the *structure of the norm* governing reliance. If you must retreat, retreat to "Knowledge is the norm of practical reasoning," not necessarily action.

  ---

  ### 1. The Invariantist (Norms of Assertion)
  **Likely Questioner:** Orthodox Invariantist (Senior Faculty).
  **Objection:** "I grant your intuitions about the Inspector and the Manager. The Inspector is fine asserting the scaffold is secure; the Manager should hesitate. But why diagnose this as a difference in *knowledge*? Why not say both know, but the norms of *assertion* or *practical reasoning* shift with stakes? You're positing a metaphysical shift in epistemic status to explain a pragmatic shift in propriety. That's Occam's Razor violation."

  *   **Concede:** The behavioral data (assertion/reliance) is the same on both views.
  *   **Hold:** Knowledge is the norm of assertion/practical reasoning. If the norm shifts, the satisfaction condition (knowledge) shifts.
  *   **2-Minute Reply:** "If knowledge is the norm of assertion, as many invariantists agree, then a shift in the propriety of assertion *just is* a shift in knowledge. To say 'She knows but shouldn't assert' severs the tight link between knowledge and action that motivates epistemology in the first place. My view preserves the unity of the norm: you can assert/act iff you know. Your view preserves the definition of knowledge but breaks the norm. I prefer breaking the definition to breaking the link between knowing and acting."
  *   **Soft Spot:** If they deny Knowledge is the *sole* norm of assertion (e.g., justified belief is enough), your leverage vanishes.

  ### 2. The Decision Theorist (Action Thresholds)
  **Likely Questioner:** Decision Theorist (Science/Philosophy of Action).
  **Objection:** "This is all redundant. The Manager has the same credence as the Inspector. The difference is her utility function. Standard decision theory handles this: she requires a higher expected utility to act. Why layer a stakes-sensitive *knowledge* predicate on top of credence + utility? What explanatory work is 'knowledge' doing here that credence isn't?"

  *   **Concede:** Credence + Utility explains the *action*.
  *   **Hold:** It does not explain the *epistemic evaluation* of the agent or the *testimony* structure.
  *   **2-Minute Reply:** "Decision theory tells us what the Manager should *do*. It doesn't tell us whether she is *epistemically entitled* to rely on the Inspector without further check. If we say she 'knows' but shouldn't act, we lose the ability to criticize her epistemic position when she acts rashly. We need a concept that tracks the *sufficiency of evidence for closure of inquiry*. 'Knowledge' marks the point where inquiry stops. In high stakes, the Inspector's report doesn't stop the Manager's inquiry. My view explains *why* inquiry re-opens without denying the evidence."
  *   **Soft Spot:** If they argue "closure of inquiry" is just a heuristic for expected utility maximization, you are back to redundancy.

  ### 3. The Contextualist (The Delegation Problem)
  **Likely Questioner:** Contextualist (Epistemology Specialist).
  **Objection:** "You present the Delegation Problem as a bug for invariantism and a feature for your view. But it's a feature for *contextualism*. The Inspector says 'I know' (true in her low-stakes context). The Manager's colleague says 'She doesn't know' (true in the high-stakes context). No metaphysical change in the Inspector's state is required. You're adding gratuitous metaphysics to solve a linguistic problem."

  *   **Concede:** Contextualism predicts the truth-values of the *sentences* uttered.
  *   **Hold:** It fails to explain the *institutional friction* in the transfer of authority.
  *   **2-Minute Reply:** "Contextualism explains the words, but not the workflow. If the Inspector *really knows* (in her context), why is the Manager epistemically irresponsible to simply sign off without independent verification? On your view, the Manager is ignoring a known truth. On my view, the Manager faces a new epistemic requirement generated by her own position. The 'shift' isn't just in the attributor's context; it's in the subject's practical environment. The institution requires the Manager to *know*, not just to be able to truthfully say 'The Inspector knows'."
  *   **Soft Spot:** Contextualists can argue the Manager's context makes the attribution 'The Inspector knows' false, so the Manager isn't ignoring a known truth. This is a stalemate over the location of the context.

  ### 4. The Invariantist (Truth-Conduciveness)
  **Likely Questioner:** Orthodox Invariantist (Truth-Tracker).
  **Objection:** "You say stakes affect how much evidence is *needed*. But evidence is evidence because it raises the probability of truth. If the evidence is fixed, the probability is fixed. How can practical stakes change the *justificatory power* of evidence without changing its relation to the truth? You're making justification non-truth-conducive."

  *   **Concede:** Stakes do not change the probabilistic relation between evidence and $p$.
  *   **Hold:** Justification is not merely probability; it is *sufficiency for reliance*.
  *   **2-Minute Reply:** "Justification is not just a probability score; it's a status that permits reliance. A 95% probability might be sufficient for a bet of $1, but not for a bet of your life. The *evidence* hasn't changed, but the *sufficiency condition* has. We do this elsewhere: a 'passing grade' depends on the course requirements, not just the raw score. I am arguing knowledge is a pass/fail status relative to a practical threshold, not a pure probability metric."
  *   **Soft Spot:** This risks severing justification from truth entirely. If a 95% probability isn't enough for knowledge in high stakes, does knowledge track truth or prudence?

  ### 5. The Contextualist (Disagreement)
  **Likely Questioner:** Contextualist.
  **Objection:** "Suppose the Inspector and Manager argue. Inspector: 'I know it's safe.' Manager: 'No, you don't.' On your view, the Inspector is speaking falsely (or truthfully?) relative to what? If knowledge is subject-sensitive, they are talking past each other. But it feels like a genuine disagreement. Contextualism handles this by saying they disagree about the *standard*, not the fact."

  *   **Concede:** It sounds like a disagreement.
  *   **Hold:** It is a disagreement about whether the *current evidence meets the required standard*.
  *   **2-Minute Reply:** "It is a genuine disagreement about whether the epistemic position is *sufficient for action*. The Inspector claims sufficiency for her context; the Manager denies sufficiency for hers. It's not merely verbal; it's a conflict about whether the inquiry is closed. My view captures the friction: the Manager is effectively saying, 'Your evidence is insufficient *for what we need to do*.' That is a substantive claim about the evidence's adequacy, not just a context switch."
  *   **Soft Spot:** If the Inspector replies "But *I* know," she is right on your view (relative to her stakes). The Manager's denial looks like an error about the Inspector's state, not a correction of the standard.

  ### 6. The Decision Theorist (Skepticism)
  **Likely Questioner:** Decision Theorist.
  **Objection:** "If stakes raise the bar, don't you invite skepticism? In a high-stakes world (climate change, nuclear policy), do we ever know anything? If knowledge is required for policy, and stakes are always high, you've made knowledge impossible for the things that matter most."

  *   **Concede:** Knowledge is harder to come by in high stakes.
  *   **Hold:** This is a feature, not a bug. It explains caution.
  *   **2-Minute Reply:** "Skepticism is only a problem if we assume we *must* know to act. Sometimes we shouldn't act. In high-stakes scenarios, my view recommends gathering more evidence before claiming knowledge. That isn't skepticism; it's epistemic responsibility. If we can't meet the bar, we shouldn't claim to know. Better to admit ignorance and investigate than to claim knowledge and risk catastrophe."
  *   **Soft Spot:** If the stakes are *always* high (e.g., everyday driving involves risk of death), this collapses into global skepticism. You need a baseline for "normal" stakes.

  ### 7. The Invariantist (Value of Knowledge)
  **Likely Questioner:** Orthodox Invariantist (Value Theory).
  **Objection:** "Knowledge is supposed to be valuable. If I lose knowledge because the stakes went up (even though my evidence didn't change), knowledge becomes fragile and less valuable. Why value a state that vanishes when the situation gets tough?"

  *   **Concede:** Knowledge is more fragile on this view.
  *   **Hold:** It is *more* valuable because it tracks action-guiding sufficiency.
  *   **2-Minute Reply:** "The value of knowledge lies in its role as a marker for safe reliance. A state that vanishes when reliance becomes dangerous is *more* valuable, not less, because it protects us from error. A 'knowledge' state that persists even when reliance would be catastrophic is useless. My view makes knowledge a more reliable tool for navigation, even if it is harder to hold onto."
  *   **Soft Spot:** This redefines the value of knowledge from "contact with truth" to "safety for action." Invariantists may reject this instrumentalization.

  ### 8. The Generalist (Ad Hocery)
  **Likely Questioner:** Junior Faculty / Generalist.
  **Objection:** "This looks stipulated. You define 'knowledge' such that it solves the Delegation Problem. Is there independent motivation for stakes affecting justification, other than saving these specific intuitions?"

  *   **Concede:** The view is motivated by cases.
  *   **Hold:** The cases reveal a pre-theoretical structure of our epistemic practices.
  *   **2-Minute Reply:** "It's not stipulation; it's explanation. We already accept that 'enough evidence' is context-sensitive in law ('beyond reasonable doubt' vs. 'preponderance'). I'm arguing ordinary knowledge functions similarly. The Delegation Problem isn't a puzzle I created to solve; it's a structural feature of institutions that invariantism ignores. My view systematizes a practice we already engage in."
  *   **Soft Spot:** Legal standards are explicit conventions; knowledge is supposed to be natural. The analogy might not hold.

  ### 9. The Invariantist (The 'Sleeping Subject')
  **Likely Questioner:** Orthodox Invariantist.
  **Objection:** "Suppose the Manager goes home and sleeps. While she sleeps, a crisis raises the stakes. Does she lose knowledge while unconscious? If knowledge depends on stakes, and stakes change, her epistemic state fluctuates without her awareness. That's absurd."

  *   **Concede:** Epistemic status can change without the subject's awareness.
  *   **Hold:** Knowledge is a relational property between subject, evidence, and environment.
  *   **2-Minute Reply:** "We accept this in other domains. I can become a 'debtor' without my awareness if a bill arrives. Knowledge is a status relative to the environment. If the environment changes such that my evidence is no longer sufficient for safe reliance, I no longer know. It's not about my internal feel; it's about my license to act."
  *   **Soft Spot:** This makes knowledge externalist in a very strong, almost uncomfortable way. It risks making knowledge too unstable.

  ---

  ### THE "HOPE NOBODY ASKS" OBJECTION

  **The Objection:** **"The Rational Action Dilemma."**
  *Phrasing:* "If the Manager does *not* know the scaffold is secure, then (by your own view) she is not epistemically positioned to act. But she *must* act to keep the project moving, and relying on the Inspector is rational. If she acts without knowledge, she violates the Knowledge Norm of Action. If she doesn't act, the institution fails. Does your view imply that in high-stakes delegation, rational action is impossible? Or do you sever the link between Knowledge and Rational Action?"

  **Why it is Dangerous:**
  This strikes the heart of the motivation for Pragmatic Encroachment. We adopted encroachment to *save* the link between Knowledge and Action (i.e., you know iff it's rational to act).
  *   If you say she **can** act rationally without knowledge: You destroy the Knowledge-Action Principle (KAP). If KAP is false, why do we need stakes in knowledge? We could just put stakes in the norms of action (back to Objection #1 & #2).
  *   If you say she **cannot** act rationally: You imply that institutional delegation in high-stakes environments is inherently irrational. This is a bullet too bitter to bite. It makes your epistemology incompatible with organized human activity.

  **Best Available Answer:**
  "I distinguish between *acting on knowledge* and *acting on trusted authority*. The Manager does not know *p* directly. She knows *that the Inspector knows p*. In high stakes, the Manager needs to know *that the Inspector knows*. If the Inspector's sign-off counts as sufficient evidence for the Manager's stakes, then the Manager *does* know (via testimony). If it doesn't, she needs more. The Delegation Problem arises only if we assume the Manager inherits the Inspector's *exact* epistemic state. She doesn't. She inherits the *report*. My view says she needs to verify the report meets *her* stakes. If she can't, she shouldn't act. If the institution forces her to act without that verification, the institution is epistemically corrupt, not my theory."

  **Candid Assessment:**
  This answer is weak. It pushes the problem back to "Is the Inspector's report enough evidence?" If the report *is* enough evidence, she knows. If it *isn't*, she doesn't. But the setup says the evidence is *identical* (Report + Sign-off). If that evidence is enough for the Inspector (Low Stakes) but not the Manager (High Stakes), then the Manager is forced to act on less than knowledge.
  **Verdict:** If this question is asked, **retreat**. Concede that Knowledge might not be the *strict* norm of action in institutional settings, but rather "Sufficient Justification for Context." Admit that 'Knowledge' might be the ideal, but 'Institutional Reliance' is a distinct, lower bar. Do not die on the hill that the Manager *cannot* act. Die on the hill that the Manager *does not know*. Sacrifice the KAP to save the Encroachment.
