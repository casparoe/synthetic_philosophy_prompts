      *Re-evaluating the "Hope Nobody Asks":* A better candidate might be the "Reversal Problem." If stakes go down, do you gain knowledge instantly? Or the "Subject-Sensitivity" issue: Does the Manager know *relative to the Inspector's stakes*? No, the prompt says the Manager's stakes matter. The real killer is usually: *If the Manager doesn't know, can she assert it to the workers?* If she can't assert it, the institution breaks. If she can, the Knowledge Norm of Assertion is false. This ties into the Invariantist objection but is more specific to the Delegation case. Let's go with the **Knowledge-Action-Assertion Triangle**. Specifically: If the Manager doesn't know, is she irrational to build? If she is rational to build without knowledge, why do we need knowledge for anything?

