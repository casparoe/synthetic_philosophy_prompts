      *Gradient Clean:* This maps cleanly to control theory where moral status scales with the dimensionality of the error vector and the bandwidth of the feedback loop. A thermostat has a scalar error signal, while a bee has a high-dimensional state estimation with predictive modeling and multiple competing objectives.
