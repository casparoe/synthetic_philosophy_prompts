          3.  If $\neg p$, $S$ wouldn't believe $p$ via $M$ (Variation).
          4.  If $p$, $S$ would believe $p$ via $M$ (Adherence).
      *   *The Problem:* Conditions 3 and 4 are counterfactuals. To evaluate "If $\neg p$, would $S$ believe $p$ via $M$?", we need to hold $M$ fixed while changing $p$. But what does it mean to hold $M$ fixed?
      *   *Gerrymandering:*
