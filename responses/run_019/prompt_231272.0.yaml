prompt: |-
  Alright, here's what I want. You know the Williams line that utilitarianism gives people one thought too many — the husband who has to run the impartial calculus before he saves his drowing wife. I want a thought experiment where the tables are turned: the utilitarian acts smoothly out of a trained disposition with no occurrent calculation, and the integrity-theorist in the same position is the one who pauses and has one thought too many, because their own view makes them check whether the commitment their about to act on really counts as a ground project rather than a passing inclination.

  Constraints: ordinary life (a family situation, friendship, job — no trolleys, no war), the scenario itself in one paragraph, both characters working from exactly the same facts, and they have to end up doing the same thing. The reversal must come out of the internal structure of the two views, not from making the utilitarian a saint or the integrity person neurotic — a utilitarian who has internalized an indirect decision procedure versus someone who has to identify which commitments are identity-constituting before acting is fine, but don't stipulate that one of them is just bad at living. After the scenario, walk through what each theory says about the case and why, say which feature of the case is doing the real work, what happens if you remove it, and how a Williams-style defender would try to block the case. This is for a short essay arguing that the one-thought-too-many objection cuts both ways, so it needs to be a case both sides would recognize as fair. Hard cap: 450 words, and open with the scenario.
