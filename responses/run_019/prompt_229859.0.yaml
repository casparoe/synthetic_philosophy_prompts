answer: |-
  This is a remarkably precise diagnosis of a stalemate that has indeed characterized the literature since the early 1990s (roughly from Walzer's *Spheres of Justice* through Carens's *The Ethics of Immigration*). Your hypothesis about the **baseline** is not only well-formed; it is likely the most accurate structural description of the impasse.

  To answer your questions directly: This is a **foundational disagreement about political ontology** (what a state *is*), which manifests as a **lexical priority dispute** (which value trumps which), sustained by **empirical indeterminacy**.

  Here is a breakdown of why the dialectic is stationary, what kind of disagreement this actually is, and what could constitute progress.

  ### 1. What Kind of Disagreement Is This?

  It is not merely empirical, verbal, or analogical, though it contains elements of all three. It is best understood as a conflict over **Political Ontology and Jurisdiction.**

  **A. The Ontological Clash (What is the State?)**
  The stalemate persists because the two sides are describing different objects using the same word ("state").
  *   **The Open-Borders Ontology:** The state is an administrative instrument for protecting individual rights within a specific territory. The earth belongs to humanity collectively; states are merely managers. Therefore, the default is common ownership, and exclusion is a proprietary claim that requires justification.
  *   **The Exclusionist Ontology:** The state is a constitutive community. It is not just a manager of rights but the *source* of political agency. Without boundaries, there is no "self" to determine, no "we" to associate, and no specific beneficiary of justice. Therefore, the default is bounded agency, and inclusion is an act of extension that requires justification.

  Because one side views the border as a *fence* (an impediment to natural movement) and the other views it as a *frame* (a constitutive condition of political existence), they talk past one another.

  **B. The Lexical Priority Dispute**
  You noted that both sides grant the same values (freedom, self-determination, obligation). The disagreement is not about the existence of these values but their **lexical ordering** in cases of conflict.
  *   **Cosmopolitans** treat individual liberty as lexically prior to collective self-determination. (You cannot have a "self" to determine if you violate the basic liberties of outsiders.)
  *   **Statists/Nationalists** treat collective self-determination as lexically prior to individual mobility. (Individual liberty is only meaningful *within* a political context that guarantees it; if the context collapses, liberty is lost.)

  This is a "bedrock conflict," as you suggested. It is difficult to argue someone out of a lexical priority without appealing to a higher-order value, but in this debate, the lexical priorities *are* the highest-order values for each side.

  **C. The Role of Empirical Indeterminacy**
  Empirical disagreements are not the *cause* of the stalemate, but they are the **shield** that allows it to persist.
  *   If it were empirically certain that open borders would collapse the welfare state and destroy democratic trust, the exclusionist case would become overwhelming even for many liberals.
  *   If it were empirically certain that open borders would double global GDP without destabilizing institutions, the exclusionist case would look like pure prejudice.
  *   Because the empirical outcomes are probabilistic and contested, each side retreats to their normative baseline. The exclusionist says, "We cannot risk the framework of justice." The open-borders advocate says, "We cannot risk the certainty of severe harm." Empirical uncertainty allows both to claim the "precautionary principle."

  ### 2. Evaluating the Baseline Hypothesis

  Your hypothesis is correct: **The dispute is about the presumption.**

  *   **Open Borders:** Presumes a Lockean "common ownership of the earth." The burden of proof lies on the restrictor. (Why may we stop you?)
  *   **Right to Exclude:** Presumes a Hobbesian or Republican "constitution of a people." The burden of proof lies on the claimant. (Why must we admit you?)

  This is why the analogies fail to resolve the debate.
  *   When the open-borders side uses the **marriage analogy** (you can't choose your spouse, but you can't imprison them), the exclusionist replies that the state is not a marriage but a **club** (freedom of association).
  *   When the exclusionist uses the **club analogy**, the open-borders side replies that the state controls the *territory*, not just the membership, and no one owns the earth like a private club.

  The baseline determines which analogy feels intuitive. If you start with the individual, the club analogy seems absurd (I didn't join this club; I was born in its building). If you start with the community, the territorial analogy seems absurd (A community without the ability to define its membership is not a community).

  ### 3. What Would Count as Progress?

  If the disagreement is foundational and lexical, **theoretical convergence is unlikely.** We should not expect a "proof" that convinces Michael Huemer to become a nationalist or David Miller to become an open-borders advocate.

  However, **policy convergence** and **conceptual refinement** are possible. Progress would look like one of the following:

  **A. Shifting from "Binary" to "Gradient" (The Distinction)**
  Progress lies in abandoning the "Open vs. Closed" binary. The most fruitful recent work (e.g., by Sarah Song or Joseph Carens in his later work) focuses on **degrees of membership**.
  *   *Progress:* Acknowledging that "admission" is not a single event but a bundle of rights (entry, residence, work, welfare, voting).
  *   *Result:* A consensus that while *entry* might be restricted, *rights once present* must be robust, and *paths to regularisation* must exist. This moves the debate from the border line to the interior structure.

  **B. The "Externalities" Reframe (The Model)**
  Instead of asking "Do we have a right to exclude?", ask "What duties attach to the act of exclusion?"
  *   *Progress:* Accepting the exclusionist baseline (states may exclude) but attaching heavy **compensatory obligations** to that right. If a state closes its border to protect its welfare model, it may incur obligations to aid development, accept refugees, or allow temporary labor migration to offset the harm imposed on the excluded.
  *   *Result:* This satisfies the exclusionist's need for boundary control and the cosmopolitan's need to mitigate the harm of birthright lottery. It turns a right to exclude into a *privileged position that must be paid for.*

  **C. The Democratic Boundary Problem (The Reframed Question)**
  Focus on *who decides* the baseline.
  *   *Progress:* Investigating the "Boundary Problem" in democratic theory. If the people decide the border, but the border decides the people, there is a circularity.
  *   *Result:* This shifts the debate toward **global governance mechanisms** or **regional free movement zones** (like the EU) where the "self" determining the border is larger than the nation-state. It dissolves the nation-state baseline without requiring full open borders globally.

  **D. Accepting "Modus Vivendi" (The Reason to Expect No Convergence)**
  We may need to accept that this is a permanent tension in liberal theory.
  *   *Progress:* Acknowledging that the tension between **Universal Rights** and **Particular Communities** is a feature, not a bug, of the international system.
  *   *Result:* A shift toward procedural justice. We cannot agree on the *outcome* (how many people move), but we can agree on the *process* (asylum procedures must be fair, detention must be minimized, deportation must be humane). This is a retreat from ideal theory to non-ideal theory, but it is where actual human suffering is alleviated.

  ### Summary

  The debate is stationary because it is a **clash of political ontologies** shielded by **empirical uncertainty**. Your baseline hypothesis is the key: one side sees the border as a deviation from natural liberty; the other sees it as the precondition for political liberty.

  **Progress will not come from proving one baseline correct.** It will come from:
  1.  **Unbundling rights** (separating entry from membership).
  2.  **Linking exclusion to obligation** (if you close the door, you must open a window or send aid).
  3.  **Moving to non-ideal theory** (focusing on the humane administration of restriction rather than the moral justification of the restriction itself).

  The most productive path forward is likely the **Compensatory Model**: Granting states a presumptive right to exclude *only if* they discharge robust duties to those they exclude, thereby bridging the gap between collective self-determination and global impartiality.
