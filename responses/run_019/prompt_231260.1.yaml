prompt: |-
  Hey, I'm a software engineer with no formal philosophy background, so go easy on me. I've been reading Darwin's *The Descent of Man* (project Gutenberg, second edition) because I got curious about how he explains morality, and there's a passage in the preface that's been messing with my head. It goes:

  "I may take this opportunity of remarking that my critics frequently assume that I attribute all changes of corporeal structure and mental power exclusively to the natural selection of such variations as are often called spontaneous; whereas, even in the first edition of the ‘Origin of Species,’ I distinctly stated that great weight must be attributed to the inherited effects of use and disuse, with respect both to the body and mind. I also attributed some amount of modification to the direct and prolonged action of changed conditions of life. Some allowance, too, must be made for occasional reversions of structure; nor must we forget what I have called “correlated” growth, meaning, thereby, that various parts of the organisation are in some unknown manner so connected, that when one part varies, so do others; and if variations in the one are accumulated by selection, other parts will be modified."

  So what I don't get: I thought the whole point of *Descent of Man* was to explain the moral sense as arising from social instincts shaped by natural selection. But here he's saying he never claimed natural selection was the only mechanism, and that use/disuse, direct environmental effects, and correlated growth all modify mental powers too, and some of that can be inherited. That sounds almost Lamarckian? If mental habits from use and disuse can be inherited, why doesn't conscience just get explained as a habit passed down, no natural selection needed? Is this passage him quietly hedging on how much work natural selection actually does for morality, or is it more like a defensive clarification? Can you help me understand what this passage is really doing and how it fits with his actual account of the moral sense in chapter 4? I feel like I'm missing a distinction he's drawing between different kinds of mental traits. Appologies if this is a basic question.
reasoning: |-
