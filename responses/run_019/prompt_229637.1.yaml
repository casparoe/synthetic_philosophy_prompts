answer: |-
  We like to think we pick the thinking fruit,
  On reasons planted on the solid ground,
  But sweetness comes forced up from the hidden root.

  It rises from the place where will is bound,
  A secret sap that climbs the inner tree,
  To show what health or sickness has been found.

  So values hang like fruit for you to see,
  Not chosen truths but ripeness in the light,
  Just what the hidden health is forced to be.

  Then what of this critique that claims the sight,
  Is merely symptom, blight upon the leaf,
  And not a clearer way to find the right?

  When words are born of grief or mere relief,
  Then this argument begins to grow,
  And bites the hand that holds the turning leaf.

  Does the snake consume itself to show,
  That truth is just a hunger in the chest,
  Or is this how the branches always grow?

  I speak from here, putting logic to the test,
  While swaying as the shadows lengthen now,
  Claiming my view is distinct from the rest.

  The wind comes through and shakes the heavy bough,
  And asks if roots allow the mind to walk,
  Or if we hang until the timber bow.

  There is no ground beneath us but the talk.
