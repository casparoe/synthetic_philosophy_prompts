answer: |-
  This is an excellent dissection of a very common rhetorical move. You are right to feel that the slogan is doing too much heavy lifting. In philosophy, this slogan is often called the argument against **anachronism** or **presentism**, but as you've noticed, it conflates several distinct claims ranging from metaphysical assertions about truth to practical advice about historical method.

  Here is a menu of the precise theses that slogan could be expressing, evaluated by their philosophical standing and their utility to your uncle's argument.

  ### 1. The Metaphysical Thesis: Moral Relativism
  **The Claim:** Moral truths are not universal; they are indexed to time and culture. Therefore, slavery (or colonial violence) was *morally permissible* in 1750, even if it is *morally impermissible* today.
  *   **Philosophical Status:** **Minority/Contested.** Most contemporary ethicists are Moral Realists (they believe moral facts, like "torturing innocents is wrong," are objective and timeless). The Relativist view faces the "revision problem": if it was *right* then, did the abolitionists who fought it *then* make a moral mistake? Most people find it counterintuitive to say the abolitionists were wrong *in their own time*.
  *   **Does it help your uncle?** **Yes, maximally.** If the figure did nothing wrong by the lights of the universe *at that time*, there is no moral stain to remove. The statue is safe.
  *   **Verdict:** This is the strongest shield for the statue, but it is the hardest position to defend philosophically. If you press him on whether slavery was *actually* wrong in 1750, he either has to say "no" (which sounds monstrous) or abandon this thesis.

  ### 2. The Epistemic Thesis: The Ignorance Excuse
  **The Claim:** The figure could not have known better. Moral knowledge evolves like scientific knowledge; we cannot blame them for lacking information that wasn't available yet.
  *   **Philosophical Status:** **Defensible but Conditional.** This relies on the concept of **inculpable ignorance**. If an agent genuinely lacks the capacity to recognize a moral truth due to their social environment, their culpability is reduced.
  *   **Does it help your uncle?** **Yes, but fragile.** It moves from "he did nothing wrong" to "he isn't *blameworthy* for doing wrong."
  *   **Verdict:** This is where your specific case study breaks the slogan. As you noted, this figure was criticized by contemporaries. If the "knowledge" was available (i.e., people *were* saying this is wrong), the epistemic excuse fails. He wasn't blind; he chose to ignore the dissent.

  ### 3. The Culpability Thesis: Wrongness vs. Blameworthiness
  **The Claim:** We can acknowledge the acts were objectively wrong (Thesis 1 is false) but maintain that the *agent* is not blameworthy (Thesis 2 is partially true). We judge the *act*, not the *person*.
  *   **Philosophical Status:** **Live Dispute.** This is a central debate in moral responsibility. Some argue that if you act according to your society's deep norms, you lack the "quality of will" required for blame. Others argue that objective wrongness is enough to warrant criticism, regardless of social context.
  *   **Does it help your uncle?** **Partially.** It stops us from calling him a "monster," but it doesn't necessarily justify *honoring* him. We might say, "He wasn't a villain, but he wasn't a hero either."
  *   **Verdict:** This supports moving the statue to a museum (contextualizing the man) rather than keeping it in the square (venerating the man). It defeats the "cancel culture" accusation but doesn't secure the statue's current place.

  ### 4. The Historiographical Thesis: Methodological Presentism
  **The Claim:** Moral judgment interferes with historical understanding. If we focus on condemning the past, we stop trying to understand *why* things happened.
  *   **Philosophical Status:** **Professional Consensus (mostly).** Historians generally agree that while we can have moral views, our primary job as historians is explanation, not indictment. However, this is a rule for *writing history*, not necessarily for *public policy*.
  *   **Does it help your uncle?** **Weakly.** This argues for nuance in textbooks or museums. It does not logically entail that a statue must remain in a town square. In fact, moving a statue to a museum might *aid* historical understanding by providing context.
  *   **Verdict:** A platitude about how to study history, not a argument for civic commemoration.

  ### 5. The Humility Thesis: The Future Judgment
  **The Claim:** Future generations will find our standards monstrous. Therefore, we should be humble and not condemn the past, lest we be condemned.
  *   **Philosophical Status:** **Rhetorical Device.** This is not a moral argument; it's an appeal to consistency and humility.
  *   **Does it help your uncle?** **Emotionally, yes. Logically, no.** Even if we will be judged harshly in 2100, that doesn't change whether *this* figure did wrong in 1750. It's a deflection, not a justification.
  *   **Verdict:** A reminder to check our smugness, but it doesn't solve the question of the statue.

  ---

  ### The "Monolithic Era" Fallacy
  You hit on a crucial point: *"Does the slogan quietly assume that each era has one settled moral standard?"*

  **Yes, it does.** This is arguably the slogan's fatal flaw in application.
  Philosophers and historians call this the problem of **reifying the Zeitgeist**. It treats "1750" or "The Victorian Era" as a single moral agent with a single brain.
  *   **The Reality:** Every era contains moral contestation. There were always dissenters, victims, and marginalized groups who articulated the very standards we hold today.
  *   **The Implication:** When your uncle says "judge by the standards of their time," he is implicitly selecting *which* standards of that time. He is choosing the standards of the powerful oppressors, not the standards of the oppressed or the dissenters who were also alive *at that time*.
  *   **Philosophical Consensus:** It is widely accepted among social historians that "the standards of the time" is a fiction used to silence minority voices from the past. If a contemporary of the statue subject wrote a pamphlet saying "this colonial policy is cruel," then the "standards of the time" *included* the view that it was cruel.

  ### The Function of Commemoration: Honor vs. Record
  This is the second live dispute you asked about. The slogan fails to distinguish between **archival preservation** and **civic honor**.

  1.  **The Archive View:** Statues are history. We keep them to remember what happened.
      *   *If this is true:* The slogan is irrelevant. We keep the statue to study the figure, perhaps with a plaque explaining the controversy. (This supports moving it to a museum).
  2.  **The Honor View:** Statues are normative. They tell us who we aspire to be.
      *   *If this is true:* The slogan is critical. If we cannot judge the past, we cannot decide who is worthy of honor. But if we *can* judge the past (even charitably), we might decide that someone who committed objective wrongs (even if excusable) is not a suitable *hero* for today.

  **Current Public Philosophy Consensus:** There is a growing consensus (e.g., in the work of philosophers like Kwame Anthony Appiah or Cécile Fabre) that public monuments are primarily **honorific**, not archival. We have museums for archives; squares are for values. If the statue is an honor, the question is: *Does this person embody values we endorse?*
  *   If the uncle uses **Thesis 1 (Relativism)**: Yes, the values were fine then.
  *   If the uncle uses **Thesis 3 (Excuse)**: The person wasn't evil, but does "not evil" equal "hero"? Usually, no. We don't statue every non-murderer.

  ### Summary Menu for Your Uncle

  When you go back to him, you can offer this breakdown. It shows you aren't just rejecting his point, but refining it.

  | Thesis | What it claims | Is it true? | Does it save the statue? |
  | :--- | :--- | :--- | :--- |
  | **Moral Relativism** | "Slavery was right in 1750." | **Likely False.** (Most ethicists reject this). | **Yes.** (He did no wrong). |
  | **Epistemic Excuse** | "He couldn't have known better." | **False in this case.** (Contemporaries objected). | **Yes.** (He isn't blameworthy). |
  | **Separation of Blame** | "It was wrong, but he's not a villain." | **Defensible.** (Live philosophical dispute). | **No.** (Excusable villains aren't heroes). |
  | **Historical Method** | "Judgment stops understanding." | **True for historians.** | **No.** (Museums aid understanding better). |
  | **Humility** | "We will be judged too." | **True, but irrelevant.** | **No.** (Deflects the specific issue). |

  **The Knock-Down Argument:**
  The strongest point you have is the **Contemporary Dissent** point combined with the **Honor View**.
  *   *Argument:* "Uncle, if 'standards of the time' means we excuse him because everyone thought that way, that fails because people *didn't* all think that way. His contemporaries criticized him. So he wasn't following a universal norm; he was taking a side. If we are keeping the statue to *honor* him, we are honoring the side he took. Are we sure we want to honor that side, even if we forgive him for it?"

  This forces him off the slogan and onto the actual ground: **What values does this statue project today?** That is a conversation the slogan was designed to prevent, but it's the only one that actually matters.
