  ### 1. Candidate Mappings

  Before translating the theorem, I considered two ways to map "Liberalism" and "Pareto" into a backend architecture.

  **Candidate 1: The Permission Model (ACLs)**
  *   **Liberalism:** Write permissions. User A has `WRITE` on `config.A`, User B has `WRITE` on `config.B`.
  *   **Pareto:** If all users submit the same value for a key, the system commits it.
  *   **Critique:** This fails to capture the paradox. In a standard permissioned system, if I own `config.A`, your preference on `config.A` is ignored by the access layer. The spheres are disjoint. The conflict never arises because the "nosy" preferences are filtered out at the API gateway. This models a *dictatorship of ownership*, not a liberal paradox.

  **Candidate 2: The Reconciliation Model (Merge Logic)**
  *   **Liberalism:** Decisiveness. If the global state differs only in User A's "owned" keys, the global ranking must respect User A's preference on that pair.
  *   **Pareto:** Unanimity. If all users rank State $X$ above State $Y$, the global ranking must reflect $X > Y$.
  *   **Unrestricted Domain:** The merger must accept any valid preference ordering submitted by the nodes.
  *   **Selection:** I am choosing **Candidate 2**. Sen's theorem is not about write-access; it is about *social welfare functions*. It assumes everyone's preferences count toward the global ranking, even over keys they don't "own." This maps to a system where nodes submit *preference lists over global states*, not just key-value updates. This is closer to a consensus protocol (like Paxos with ranked proposals) than a simple CRUD app.

  ---

  ### 2. The Theorem in Merge Logic

  **The System:** A configuration reconciliation engine.
  **The Goal:** Produce a single, transitive global ranking of all possible system states (or select a single winner).
  **The Constraints:**
  1.  **Unrestricted Domain:** The engine must accept any valid preference ordering from any node. It cannot reject a config because the preferences look "weird" or "meddlesome."
  2.  **Weak Pareto (Consensus Optimization):** If every node prefers State $X$ over State $Y$, the global ranking must place $X$ above $Y$.
  3.  **Minimal Liberalism (Ownership Authority):** There exist at least two users, Alice and Bob, and at least one "personal" key each (e.g., `alice.theme`, `bob.theme`). If two states differ *only* in Alice's key, the global ranking must respect Alice's preference between them. Same for Bob.

  **The Impossibility:**
  No reconciliation function can guarantee a transitive global ranking (no cycles) while satisfying all three constraints simultaneously. If you enforce Ownership and Consensus, you will encounter input profiles that force the system into a logical loop ($A > B > C > A$), making it impossible to select a "best" config without violating one of the constraints.

  ---

  ### 3. Worked Example: The "Nosy Config"

  Let's define a minimal system with two boolean flags.
  *   `alice_flag`: Owned by Alice.
  *   `bob_flag`: Owned by Bob.

  **Possible Global States:**
  *   **State $x$:** `{alice: ON, bob: OFF}`
  *   **State $y$:** `{alice: OFF, bob: OFF}`
  *   **State $z$:** `{alice: OFF, bob: ON}`

  **The Preferences (Input Payloads):**
  *Note: In social choice, preferences are orderings over the **entire** global state, not just local keys.*

  *   **Alice's Preference:** $z \succ x \succ y$
      *   *Interpretation:* She prefers Bob having his flag ON ($z$) over her having hers ON ($x$). She hates the "all off" state ($y$) the most.
      *   *Liberal Claim:* On the pair $(x, y)$, only `alice_flag` changes. Alice prefers $x$.
  *   **Bob's Preference:** $y \succ z \succ x$
      *   *Interpretation:* He prefers "all off" ($y$) best. If someone must be ON, he prefers himself ($z$). He hates Alice being ON ($x$) the most.
      *   *Liberal Claim:* On the pair $(y, z)$, only `bob_flag` changes. Bob prefers $y$.

  **The Reconciliation Step-by-Step:**

  1.  **Apply Liberalism (Alice):**
      *   Compare $x$ vs $y$. Difference is only `alice_flag`.
      *   Alice prefers $x$.
      *   **Global Constraint:** $x \succ y$.

  2.  **Apply Liberalism (Bob):**
      *   Compare $y$ vs $z$. Difference is only `bob_flag`.
      *   Bob prefers $y$.
      *   **Global Constraint:** $y \succ z$.

  3.  **Apply Pareto (Unanimity):**
      *   Compare $z$ vs $x$.
      *   Alice prefers $z \succ x$ (her #1 vs #2).
      *   Bob prefers $z \succ x$ (his #2 vs #3).
      *   **Global Constraint:** $z \succ x$.

  **The Resulting Cycle:**
  $$x \succ y \quad \text{(from Alice's Liberty)}$$
  $$y \succ z \quad \text{(from Bob's Liberty)}$$
  $$z \succ x \quad \text{(from Pareto)}$$

  **System Status:** **Liveness Failure.** The merger cannot output a coherent config. It is logically impossible to satisfy the ownership rules and the consensus rule simultaneously for this input.

