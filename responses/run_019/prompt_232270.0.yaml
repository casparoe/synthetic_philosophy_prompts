      *   *Dominance Argument (Joyce 1998, 2009):* If $c$ is non-probabilistic, there exists a probabilistic $c^*$ that is strictly more accurate than $c$ in every possible world, regardless of which *legitimate* scoring rule is used (under certain conditions).
      *   *Ascription Universality (implied context):* This term isn't standard jargon like "Immodesty" or "Propriety," but the user defines it: "a genuinely epistemic norm applies to all agents regardless of their evaluative attitudes toward accuracy." This sounds like a constraint on the *objectivity* of the epistemic goal. It implies the norm shouldn't depend on the agent's subjective preference for how to measure accuracy.
