      *   The core tension is between *Normative Universality* (the rule applies to everyone) and *Evaluative Pluralism* (agents might value different epistemic virtues captured by different scoring rules).
      *   *Dominance Relies on Intersection:* For a dominance argument to prove probabilism universally, the dominating function $c^*$ must dominate $c$ relative to *all* admissible scoring rules. If Agent A uses Score $S_1$ and Agent B uses Score $S_2$, and $c^*$ dominates $c$ on $S_1$ but not $S_2$, then probabilism is not a universal norm derived from dominance *unless* we restrict the admissible set of scores.
      *   *What must be universal?* It's not the specific scoring rule (Brier vs. Log, etc.). It's the *class* of admissible scoring rules (e.g., the class of continuous, strictly proper scoring rules). The *norm* (Probabilism) must be universal.
      *   *The Pressure Point:* If we allow agents to pick *any* strictly proper scoring rule as their personal epistemic utility function, does dominance still force probabilism?
          *   *Joyce's Result:* Yes, provided the class of admissible rules is broad enough (e.g., all strictly proper rules). If $c$ is non-probabilistic, it is dominated by some $c^*$ relative to *every* strictly proper scoring rule. This is the crucial mathematical fact (De Finetti, Joyce, Predd et al.).
          *   *Wait, check that:* Is a non-probabilistic credence function dominated by a probabilistic one relative to *every* strictly proper scoring rule?
          *   *Correction/Nuance:* Standard dominance arguments (Joyce 1998) show that for any non-probabilistic $c$, there is a probabilistic $c'$ that is closer to the truth in every world. But does this hold for *every* legitimate scoring rule simultaneously?
          *   *Theorem:* If $c$ is not a probability function, there exists a probability function $p$ such that $p$ dominates $c$ relative to *any* Bregman divergence (which corresponds to strictly proper scoring rules). So, yes, the dominance holds across the *class*.
          *   *The User's Worry:* "If different agents were permitted to score accuracy in different ways, the same credence function could be dominated for one agent but not for another."
          *   *Resolution:* This worry is mathematically unfounded *if* the class is "all strictly proper scoring rules." The dominance of probabilism over non-probabilism is robust across the entire class of strictly proper rules.
          *   *However,* the pressure point shifts to *why* restrict the class to strictly proper rules? That restriction itself needs justification. If an agent says, "I don't care about propriety, I care about X," does the norm apply? This is where Ascription Universality bites.

  4.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Define the terms precisely in the context of Epistemic Utility Theory (EUT).
      *   **The Universality Object:** Clarify what is universal. It is not the specific metric (Brier vs. Spherical). It is the *structural constraint* on the metric (Strict Propriety) and the resulting *Norm* (Probabilism).
