answer: |-
  This is a precise and critical juncture in the foundations of accuracy-first epistemology. To map the conceptual space correctly, we must distinguish between three layers of universality that are often conflated in the literature: **Metric Universality**, **Class Universality**, and **Normative Universality**. The tension you identify regarding ascription universality arises because epistemic utility theory (EUT) secures Normative Universality only by enforcing Class Universality, which in turn relies on a substantive conception of the epistemic goal that may conflict with a strong reading of Ascription Universality.

  Here is the breakdown of the fault line.

  ### 1. What Must Be Universal?

  In the dominance argument for probabilism (following Joyce 1998, 2009), **Metric Universality is not required.** It is not necessary that all agents employ the same specific scoring rule (e.g., the Brier score). If the argument required a unique, rationally mandated scoring rule, it would be vulnerable to the objection that there is no non-arbitrary way to select one legitimate measure of accuracy over another (the "problem of many measures").

  Instead, the dominance argument relies on **Class Universality**. The argument requires that there be a fixed class of admissible scoring rules $\mathcal{S}$ (typically, the continuous, strictly proper scoring rules) such that:
  1.  Every rational agent must utilize a scoring rule $S \in \mathcal{S}$ to evaluate epistemic utility.
  2.  For any non-probabilistic credence function $c$, there exists a probabilistic $c^*$ such that $c^*$ dominates $c$ relative to **every** $S \in \mathcal{S}$.

  **Normative Universality** is the target: the claim that *Probabilism* applies to all agents.

  **The Conceptual Fault Line:** The dominance argument secures Normative Universality *only if* Class Universality holds. If agents are permitted to step outside the class $\mathcal{S}$ (e.g., by adopting an improper scoring rule), the dominance relation dissolves. Therefore, the pressure point is not the choice *within* the class, but the boundary *of* the class.

  ### 2. Dominance and Divergent Proper Rules

  You asked: *What happens to the dominance argument if we allow agents to favor different strictly proper scoring rules?*

  Mathematically, the dominance argument is robust to this variation. This is due to the geometric structure of the probability simplex.
  *   Let $\mathcal{P}$ be the set of probability functions (the convex hull of the truth-value vectors).
  *   Let $c$ be a non-probabilistic credence function (lying outside $\mathcal{P}$).
  *   Strictly proper scoring rules correspond to Bregman divergences.

  A key theorem in this domain (relating to the separating hyperplane theorem) establishes that if $c \notin \mathcal{P}$, there exists a $c^* \in \mathcal{P}$ that is strictly closer to the truth than $c$ in every possible world, regardless of which Bregman divergence is used to measure "closeness."

  **Consequence:** If Agent A uses the Brier score and Agent B uses the Log score (both strictly proper), they will agree that a specific non-probabilistic $c$ is dominated by some probabilistic $c^*$. They may disagree on *how much* $c^*$ dominates $c$ (the magnitude of the utility difference), but they will not disagree on the *direction* of the dominance.

  Therefore, allowing agents to favor different strictly proper rules **does not threaten the universality of the probabilism norm.** It preserves Ascription Universality *relative to the class of proper measures*.

  ### 3. The Real Pressure: Ascription Universality vs. The Class Boundary

  Here is where your specific definition of Ascription Universality creates theoretical friction. You defined it as: *"a genuinely epistemic norm applies to all agents regardless of their evaluative attitudes toward accuracy."*

  There are two ways to read this, and they yield different results for EUT:

  **Reading A: Attitudes toward specific measures of accuracy.**
  *   *Interpretation:* The norm applies even if the agent prefers the Log score over the Brier score.
  *   *Verdict:* EUT satisfies this. As shown above, dominance holds across the class of proper rules. The norm is universal regardless of which proper measure the agent adopts.

  **Reading B: Attitudes toward accuracy as a goal (or the constraints on measuring it).**
  *   *Interpretation:* The norm applies even if the agent does not value *strict propriety* or does not view accuracy as the sole epistemic good.
  *   *Verdict:* EUT **fails** this. This is the conceptual fault line.

  If an agent adopts an **improper** scoring rule (e.g., a rule that incentivizes extreme confidence regardless of evidence, or a rule that values closeness to a specific theory rather than truth), the dominance argument for probabilism collapses. A non-probabilistic credence function might *not* be dominated by any probabilistic function relative to that improper rule.

  **The Tension:**
  If Ascription Universality requires that the norm of Probabilism bind an agent who rejects the constraint of Strict Propriety, then the accuracy-first dominance argument cannot ground that norm. The dominance argument is essentially a *hypothetical imperative*: "If you seek to minimize inaccuracy (measured by a proper rule), you ought to be probabilistic."

  To get a *categorical imperative* (one that binds regardless of the agent's evaluative attitudes toward accuracy/propriety), one must add a premise that it is *irrational* to adopt an improper scoring rule. This is usually grounded in an **Immodesty** principle (a rational epistemic utility function must expect itself to be optimal). However, Immodesty itself is a normative constraint on evaluative attitudes.

  ### 4. Is There a Coherent Position Accepting Universality but Denying a Single Rule?

  Yes. This position is **Structural Pluralism**.

  *   **The View:** There is no single rationally required scoring rule (Metric Universality is false). However, there is a rationally required *structure* for any admissible scoring rule (Class Universality is true). Specifically, any admissible rule must be strictly proper.
  *   **The Grounded Norm:** This position grounds a **conditional epistemic norm**. It asserts that *epistemic rationality consists in coherence with one's epistemic goals, provided those goals satisfy the structural constraints of truth-directedness (propriety).*
  *   **Ascription Universality Status:** It satisfies Ascription Universality only in the weak sense (Reading A). It claims that *given* the nature of belief (which aims at truth), any agent who understands their own epistemic state must adopt a proper measure. If an agent refuses to adopt a proper measure, the Structural Pluralist argues the agent is no longer playing the "epistemic game"; they are optimizing for something else (e.g., pragmatic utility masquerading as epistemic utility).

  ### 5. Mapping the Theoretical Pressure

  If you are working through the foundations, these are the specific pressure points where the argument is most vulnerable to critique regarding universality:

  1.  **The Justification of the Class Boundary:** Why is the class restricted to *strictly proper* rules? If this restriction is justified by appeal to the "nature of belief" (e.g., belief aims at truth), then Ascription Universality (Reading B) is preserved by definition, but at the cost of making the argument analytic or conceptual rather than decision-theoretic. If the restriction is justified by decision-theoretic means (e.g., Immodesty), then it relies on a normative premise that an agent might reject.
  2.  **The "Ought Implies Can" Constraint:** Dominance arguments show that a better option *exists*. They do not always show that the agent can *identify* it without already being probabilistic. If the agent cannot calculate the dominating function, does the norm apply? This pressures the link between objective dominance and subjective rationality.
  3.  **The Gap Between Dominance and Obligation:** Even if $c^*$ dominates $c$ relative to all proper scores, does this entail the agent is *irrational* for holding $c$? Or merely that $c$ is *suboptimal*? To move from "suboptimal" to "forbidden" (which is required for Probabilism as a synchronic norm), one needs a bridge principle (e.g., "It is irrational to hold a dominated option"). This bridge principle is where the universality of the norm is ultimately secured, not in the scoring rule itself.

  ### Summary

  The conceptual fault line lies in the **justification of the admissible class of scoring rules**.

  *   **Dominance** works across the class of strictly proper rules.
  *   **Ascription Universality** (strong reading) demands the norm hold even for agents outside that class.
  *   **EUT** cannot satisfy strong Ascription Universality without begging the question. It can only argue that agents *ought* to be inside that class.

  Therefore, the coherent position is **Structural Pluralism**: The specific scoring rule is agent-relative (or context-relative), but the requirement of Strict Propriety is agent-invariant. The norm grounded is not "Maximize Accuracy" (which is indeterminate without a specific rule) but "Be Probabilistic" (which is determinate because it is the intersection of requirements imposed by all proper rules). The theoretical pressure remains on proving why a rational agent is forbidden from adopting an improper measure of epistemic value.
