      *   *Mathematical Check:* The set of probability functions is the convex hull of the truth-valued vectors. Non-probabilistic functions lie outside. By the separating hyperplane theorem, there is a hyperplane separating the non-probabilistic point from the convex set. This geometric fact underlies the dominance for *any* Bregman divergence (strictly proper rule). So, yes, the dominance is robust across the class of strictly proper rules.
      *   *User's specific worry:* "the same credence function could be dominated for one agent but not for another."
      *   *Response:* This is only possible if one agent uses a proper rule and the other uses an improper one. If both use proper rules, the dominance holds for both. Therefore, the "universality" relies on the universality of the *requirement to use a proper rule*.
