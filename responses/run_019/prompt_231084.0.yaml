answer: |-
  This is an excellent choice for a graduate seminar. It forces students to step back from the substantive arguments (consent, fairness, natural duty) and interrogate the *possibility* of the project itself.

  However, before you assign it, there is a crucial bibliographic correction you should make to ensure your seminar's accuracy. The passage you quoted comes not from *"Of Civil Liberty"* (Essay XII in the standard Eugene Miller edition), but from **"That Politics May Be Reduced to a Science" (Essay III)**.

  While both essays deal with political methodology, this specific line is the thesis statement of Essay III. Citing it correctly will bolster your authority, but more importantly, the title *"That Politics May Be Reduced to a Science"* frames the tension perfectly: Hume is asking if political *science* (empirical, predictive) is possible, which is a prerequisite for political *philosophy* (normative, prescriptive).

  Here is a breakdown of how to articulate the sharpness of this passage to your students, addressing your specific interpretive questions.

  ### 1. Unpacking "Fix" and "Too Young"
  Your students will likely read "fix" as "identify." You want them to read it as **"establish permanently."**

  *   **To Fix:** In the 18th-century scientific context (think Newton), to "fix" a truth is to anchor it so it does not move. It implies a law of nature that is trans-historical and trans-cultural.
  *   **The World is Too Young:** This is not just a claim about the calendar. It is a claim about **data density**. Hume is an empiricist. He believes moral and political reasoning must be grounded in observation of cause and effect in human society. If human history is short, and recorded history is shorter, and reliable history shorter still, we lack the sample size to derive universal laws.

  **The Point for Students:** Hume is arguing that political life is a *developing phenomenon*. Institutions, commerce, and social norms evolve. Therefore, a theory that claims to be true for "the latest posterity" assumes a static human condition that does not exist.

  ### 2. Historical Variability vs. Empirical Immaturity
  You asked if this is a claim about historical variability or empirical immaturity. For Hume, **these are the same thing.**

  *   **The Empiricist Link:** Normative theories of political obligation (like Social Contract theory) usually rely on causal claims. *Example:* "If citizens consent, they are obligated." Or, "If a regime is just, stability follows."
  *   **The Humean Critique:** To know if those causal claims hold, we need to observe many instances of consent and justice across time. If the "world is too young," our causal models are speculative.
  *   **The Consequence:** If we cannot reliably predict the *consequences* of obedience or disobedience (because we lack general truths about how politics works), we cannot confidently assert a *duty* based on those consequences (utility) or those structures (contract).

  **Sharpening the Argument:** Tell your students that Hume is attacking the **timelessness** of normative theory. If a theory of civil disobedience claims to tell us what a citizen in 2024, 1824, and 2224 ought to do, Hume suspects it is dogma, not science.

  ### 3. Implications for Civil Disobedience and Obligation
  This is where you connect the methodology to your course content. Hume's skepticism suggests three specific methodological constraints for theories of obligation and disobedience:

  **A. Context over Axiom**
  Contemporary theories (e.g., Rawls) often seek criteria that are universally applicable (e.g., "disobedience is justified when basic liberties are violated"). Hume suggests this is premature.
  *   *Discussion Question:* Is the duty to obey the law in a modern liberal democracy the *same kind of duty* as in a feudal monarchy or a fragile post-colonial state? If the "world is young" and political forms change, perhaps the *obligation* changes with the regime type. A general theory might obscure these vital distinctions.

  **B. Prudence over Principle**
  If we cannot "fix general truths," then political action cannot be guided by rigid principles alone. It must be guided by **prudence** (phronesis).
  *   *Application:* Consider the standard criteria for civil disobedience (public, nonviolent, accept punishment). Hume would ask: Is this a universal truth, or a heuristic that worked in 1960s America? In a totalitarian regime, being "public" might be suicidal and useless. In a fragile democracy, "accepting punishment" might martyr a cause unnecessarily. Hume's skepticism demands we ask if our theories of disobedience are **context-sensitive** or **universalist**.

  **C. The Danger of "General Truths"**
  Hume warns that when we pretend to have fixed truths, we create ideology.
  *   *Relevance:* If we teach students that "there is a defeasible general duty to obey," they may apply that duty in contexts where the state is predatory. Hume's skepticism is a safeguard against legitimizing unjust regimes by subsuming them under a "general theory" of obligation that assumes a baseline of legitimacy.

  ### 4. Should We Lower Our Ambitions?
  This is the most provocative question for graduate students. They want to write dissertations that "solve" the problem of obligation. Hume tells them they can't.

  **Do not frame this as "stop theorizing." Frame it as "change the kind of theory you build."**

  *   **From Legislative to Navigational:** A "fixed general truth" attempts to legislate morality from the armchair. A Humean theory attempts to navigate contingent waters.
  *   **Modesty, not Defeat:** We can still have theories, but they should be **comparative** and **conditional**. Instead of "When must one obey?", the question becomes "Under what historical and institutional conditions does obedience tend to produce utility, and when does resistance?"
  *   **The Unjust Regime Problem:** You asked if this skepticism applies to unjust regimes. Paradoxically, Hume's skepticism *helps* here. A general theory of obligation often struggles to explain why we *don't* have to obey tyrants (unless it builds in complex exceptions). Hume's approach allows us to say: "The generalization 'obey the law' works well in commercial republics; it does not hold in tyrannies." It allows for a **typology of regimes** rather than a monolithic theory of the State.

  ### Suggested Seminar Prompt
  To make this concrete for your students, you might pose this challenge:

  > "Hume suggests that seeking a 'general truth' about political obligation is like seeking a law of physics for a substance that is still changing its chemical composition.
  >
  > If Hume is right, is the project of John Rawls (in *A Theory of Justice*) or A. John Simmons (in *Moral Principles and Political Obligations*) methodologically flawed? Are they trying to 'fix' truths in a world that is 'too young'?
  >
  > Alternatively, is Hume's skepticism self-defeating? If we cannot fix general truths, is Hume's own claim ('we cannot fix general truths') itself a general truth he is trying to fix?"

  ### Summary for Your Lecture Notes
  1.  **Correct the Citation:** Essay III, "That Politics May Be Reduced to a Science."
  2.  **Define "Fix":** To establish permanent, trans-historical laws.
  3.  **The Empirical/Normative Link:** Normative obligations rely on causal predictions; causal predictions require historical data; history is too short for universal laws.
  4.  **Methodological Shift:** Move from **Universalism** (principles for all times) to **Contextualism** (principles for specific regime types/historical moments).
  5.  **Relevance to Disobedience:** Standard criteria (nonviolence, publicity) may be contingent heuristics, not universal moral requirements.

  This passage is a "stop and think" moment. It prevents the seminar from becoming a mere catalog of who agrees with whom, and turns it into an inquiry about whether the catalog itself is possible.
