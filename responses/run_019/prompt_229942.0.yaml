  TO: University Academic Integrity Board
  FROM: Adjudicative Committee
  DATE: October 26, 2023
  SUBJECT: Decision Memorandum regarding Case #2023-G4 (Graduate Seminar Collusion)

  The Board recommends finding all four students responsible for collusion based on the evidence that their contributions to the shared document during the examination period constitute joint action under a functional coordination test. Although the students deny an explicit agreement, the policy definition of collusion as "acting jointly to obtain an unfair academic advantage" does not require a formal contract or verbal pact; rather, it requires a demonstration that individual efforts were interdependent and directed toward a shared outcome that bypassed the individual cognitive labor the assessment was designed to measure. In this case, the shared document ceased to function as a repository of independent notes and became a workspace for strategic division of labor during the 48-hour final window. The presence of meta-commentary such as "we can't all use this opening" and "someone should push back on this objection" provides definitive proof that the students were not merely editing in parallel, but were actively managing each other's contributions to construct a unified exam strategy. Consequently, the three students who edited the document engaged in direct coordination, while the fourth student, by adhering to the coordinated plan despite claiming passive readership, ratified the joint enterprise and secured the unfair advantage generated by the group's coordination.

  To resolve the ambiguity in our policy regarding explicit agreements, the Board articulates the following standard for future cases: the "Functional Coordination Test." Under this test, joint action is established when three conditions are met: (1) the assessment requires individual cognitive labor; (2) communications or shared artifacts during the assessment period demonstrate mutual responsiveness regarding the structure or content of the submission; and (3) the final submissions exhibit structural or strategic identity that exceeds the probability of convergent thinking. Explicit agreement is not necessary; rather, the test looks to the functional reality of the collaboration. If contributions are made with the reasonable expectation that they will be integrated into a shared strategy to solve an individual assessment, joint action exists. This test distinguishes permissible study groups, which occur prior to the assessment window and focus on content mastery, from impermissible collusion, which occurs during the assessment window and focuses on answer construction.

  The strongest argument against this recommendation is the hypothesis of "Convergent Intellectual Evolution," posited by the defense. This argument suggests that four students in the same graduate seminar, exposed to the same lectures and prompts, might independently arrive at the same structural conclusions and examples, and that the shared document was merely a coincidental gathering place for these independent thoughts. Under this view, the comment "we can't all use this opening" could be interpreted as a retrospective observation rather than a coordinating instruction, and the fourth student's reliance on the document could be seen as legitimate use of shared course materials. This argument relies on the presumption of innocence and the high level of specialized knowledge in graduate cohorts, where convergent thinking is more plausible than in undergraduate contexts.

  However, this argument fails to account for the temporal and functional context of the document's usage. Convergent thinking explains similarity in ideas, but it does not explain the logistical coordination required to avoid detection or maximize coverage, as evidenced by the directive "we can't all use this opening." This comment is not an observation of similarity; it is a rule for distribution, proving that the students viewed their submissions as a portfolio to be managed rather than individual works to be authored. Furthermore, the timing is dispositive: the document was populated *during* the 48-hour exam window. In a graduate context, the assessment measures the individual's ability to synthesize and structure arguments under time constraints. By using a pre-structured plan developed collaboratively during the exam period, all four students, including the passive reader, bypassed the structural synthesis component of the assessment. To accept the defense of convergent thinking would require ignoring the meta-communicative evidence of coordination and would render the policy against collusion unenforceable in any case where students deny a verbal pact. Therefore, the finding of joint action for all four students is necessary to maintain the integrity of the individual assessment standard.
