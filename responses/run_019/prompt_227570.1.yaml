          *   Full specification (not a sales pitch).
          *   Cover constructions (negation, embedding, etc.).
          *   Cover inference patterns (Modus Ponens, inconsistency vs. disagreement).
          *   Cover ordinary practice data (truth, belief, revision).
          *   For each desideratum: State the motivation, distinguish genuine constraints from cognitivist prejudices.
          *   Identify if any subset is jointly unsatisfiable on structural grounds.
          *   Assess main families of response against the list (Simple Expressivism, Gibbard, "Being For", Hybrids, Minimalism).
          *   Process: Brainstorm first, then prune/organize, then write the final output.
      *   **Audience:** Graduate seminar preparation (needs precision, depth, and clarity).
      *   **Tone:** Analytical, rigorous, neutral, pedagogical.

  2.  **Brainstorming Desiderata:**
      *   *Embedding:* Can we say "It is not the case that stealing is wrong"? Can we say "If stealing is wrong, then lying is wrong"?
      *   *Logic:* Does Modus Ponens work? If $A$ is wrong, and if $A$ is wrong then $B$ is wrong, does $B$ follow?
      *   *Inconsistency:* Why is "Stealing is wrong and stealing is not wrong" contradictory? Why is "Stealing is wrong and eating meat is wrong" not contradictory (usually)?
      *   *Truth:* Can we say "It is true that stealing is wrong"?
      *   *Belief:* Can I believe stealing is wrong? Or do I only "accept" it?
      *   *Disagreement:* If I say "X is good" and you say "X is bad", are we disagreeing or just different?
      *   *Quantification:* "Everything he did was wrong."
      *   *Attitude Verbs:* "John believes that stealing is wrong."
      *   *Frege-Geach Core:* The meaning of a sentence must be constant across asserted and unasserted contexts.
      *   *Cognitive Prejudices:* Do we *really* need robust truth? Do we need propositional content in the realist sense?
      *   *Structural Tension:* Expressivism wants to ground meaning in non-cognitive states (desires, plans). Logic usually operates on propositions (truth-apt). Bridging this gap without collapsing into cognitivism is the hard part.

  3.  **Pruning and Organizing:**
      *   *Group 1: Compositional Semantics (The Syntax-Semantics Interface).* Needs to handle logical operators.
      *   *Group 2: Logic and Inference.* Needs to validate standard valid arguments without equivocation.
      *   *Group 3: Phenomenology of Practice.* Needs to match how we talk (truth, belief, disagreement).
      *   *Group 4: Metaphysical/Explanatory Constraints.* Needs to remain distinct from cognitivism (i.e., don't just sneak in realist truth conditions).
      *   *Distinction:* Separate "Hard Constraints" (logic, compositionality) from "Soft Constraints" (truth-talk, belief-talk, which might be deflationary).
      *   *The "Hard Problem":* The tension between *expressive function* (guiding action/attitude) and *logical form* (propositional structure).

  4.  **Drafting the Desiderata (Iterative refinement):**
      *   *Constraint 1: Compositionality.* Meaning of complex sentences determined by parts. Motivation: Productivity of language. Status: Non-negotiable.
      *   *Constraint 2: Logical Validity.* Modus Ponens must hold. Motivation: We reason morally. Status: Non-negotiable.
      *   *Constraint 3: Consistency/Inconsistency.* Must explain why $P$ and $\neg P$ clash, but $P$ and $Q$ don't. Motivation: Rationality. Status: Non-negotiable.
      *   *Constraint 4: Truth-Aptness (Surface).* We say "It's true." Motivation: Ordinary usage. Status: Negotiable (Deflationism allowed).
      *   *Constraint 5: Propositional Attitudes.* We "believe" moral claims. Motivation: Psychology/Folk. Status: Negotiable (Expressivists can redefine 'belief').
      *   *Constraint 6: Disagreement.* Must explain genuine conflict, not just clashing desires. Motivation: Phenomenology of debate. Status: Non-negotiable (but explanation varies).
      *   *Constraint 7: The Frege-Geach Constraint.* Content stability across contexts. Motivation: Semantics. Status: Non-negotiable (This *is* the problem).
      *   *Constraint 8: Expressivist Fidelity.* Don't solve it by becoming a cognitivist. Motivation: The point of the theory. Status: Internal constraint.

      *Refining the "Joint Unsatisfiability" point:* The tension is between *Constraint 8* (keep the expressive core) and *Constraints 1-3* (standard logic requires propositions). If you make the content propositional enough to satisfy logic, do you lose the expressivist insight? This is the "Collapse Problem."

  5.  **Assessing the Families of Response:**
      *   *Simple Expressivism (Ayer/early Stevenson):* Fails embedding/logic.
      *   *Gibbard (Norm-Expressivism/Plans):* Handles logic via consistency of plans. Good on embedding. Maybe struggles with 'truth' robustness.
      *   *Blackburn (Quasi-Realism):* Tries to earn the right to truth-talk. Good on phenomenology. Risk of collapsing into realism.
      *   *Hybrid Views:* Split content. Solves embedding, but complicates the psychology.
      *   *Minimalism/Deflationism:* "True" just means "I agree." Solves truth-talk, but does it solve the *logic* of the embedding? (Schroeder's worry).

  6.  **Writing the Response:**
      *   *Introduction:* Acknowledge the fragmentation of the FG problem. Set the neutral tone.
      *   *Section 1: The Desiderata.* Group them logically. Label constraints as "Hard" (Logical/Semantic) vs. "Soft" (Phenomenological/Linguistic). Explicitly mark the "Cognitivist Prejudice" warnings.
      *   *Section 2: The Structural Tension.* Address the "Joint Unsatisfiability" request directly. Focus on the Propositionality vs. Expression tension.
      *   *Section 3: Assessment of Families.* Briefly run them against the list.
      *   *Conclusion:* Summary for the seminar leader.

  7.  **Review against Constraints:**
      *   *Did I cover negation, conditionals, modals, quantification?* Yes, under Compositionality.
      *   *Did I cover Modus Ponens/Equivocation?* Yes, under Logical Validity.
      *   *Did I cover Truth/Belief/Retraction?* Yes, under Phenomenology.
      *   *Did I distinguish genuine constraints from prejudices?* Yes, explicitly labeled.
      *   *Did I identify structural tensions?* Yes, the "Collapse" tension.
      *   *Did I assess the families?* Yes.
      *   *Is it neutral?* Yes, avoiding advocacy.

  8.  **Final Polish:** Ensure terminology is precise (e.g., distinguishing *sentence meaning* from *speaker meaning*, *logical validity* from *rational acceptability*). Make sure the distinction between "solving FG" and "solving the embedding problem" is clear. (Self-Correction: Ensure I emphasize that 'belief' for an expressivist might not be the same relation as for a cognitivist, which is a key point of contention).

  9.  *(Self-Correction during drafting)*: I need to make sure I don't just list the FG problem but the *desiderata for a solution*. The prompt asks for "desiderata that any adequate expressivist semantics... must meet." So, focus on what the *theory* must achieve.

  10. *(Final check on "Joint Unsatisfiability")*: The strongest candidate for this is the tension between *Expressivist Fidelity* (meaning is constituted by non-cognitive attitudes) and *Logical Form* (meaning must be proposition-like to enter logical relations). If meaning *is* the attitude, and attitudes aren't truth-apt, how do they enter logic? If they are made truth-apt, are they still just attitudes? This is the "Quasi-Realist's Dilemma." I will highlight this.

  11. *(Final check on Families)*: Make sure to mention Schroeder's "Being For" as distinct from Gibbard. Mention Hybrid views clearly.

  12. *Proceed to generate output.*
answer: |-
  This is a crucial exercise. The literature often conflates the *embedding problem* (syntax/semantics), the *logical problem* (validity/inference), and the *phenomenological problem* (truth/belief/disagreement). While they are related, a theory might solve one while failing another.

  Below is a structured specification of the desiderata for an expressivist semantics, followed by an analysis of structural tensions and a brief assessment of current families of solutions.

  ---

  # Part I: Desiderata for an Adequate Expressivist Semantics

  I have categorized these into **Hard Constraints** (logical and semantic requirements necessary for any viable theory of language) and **Soft Constraints** (phenomenological requirements regarding how we talk and think). I have explicitly flagged where a desideratum may rely on cognitivist assumptions that an expressivist might legitimately reject or reinterpret.

  ## A. Hard Constraints (Logic and Semantics)

  These are non-negotiable. If a theory fails these, it fails to account for normative language as a language capable of reasoning.

  ### 1. The Compositionality Desideratum
  *   **Requirement:** The semantics must provide a recursive account of how the meaning of complex normative sentences is determined by the meanings of their parts and their mode of combination.
  *   **Specific Constructions to Handle:**
      *   **Negation:** "Stealing is not wrong." (Must distinguish this from "It is not the case that stealing is wrong" if the logic requires it, but minimally must account for the truth-conditions or acceptance-conditions of the negation).
      *   **Conditionals:** "If stealing is wrong, then getting your little brother to steal is wrong." (The antecedent is not asserted; the expressivist cannot say the speaker is expressing an attitude toward stealing here).
      *   **Disjunction:** "Either stealing is wrong or lying is permissible."
      *   **Quantification:** "Everything John did was wrong."
      *   **Attitude Verbs/Modals:** "Sarah believes that stealing is wrong" or "Stealing might be wrong."
  *   **Motivation:** Productivity of language. We understand novel complex sentences we have never encountered before.
  *   **Status:** **Genuine Constraint.** Even a non-cognitivist must explain how language works compositionally.

  ### 2. The Logical Validity Desideratum (The Frege-Geach Core)
  *   **Requirement:** The semantics must validate standard logical inferences involving normative terms without committing the fallacy of equivocation.
  *   **Specific Pattern:** Modus Ponens.
      *   P1: Stealing is wrong.
      *   P2: If stealing is wrong, then getting your little brother to steal is wrong.
      *   C: Getting your little brother to steal is wrong.
  *   **Motivation:** We reason morally. If the meaning of "stealing is wrong" shifts between P1 (asserted) and P2 (embedded), the argument is fallacious. But the argument is intuitively valid.
  *   **Status:** **Genuine Constraint.** Denying the validity of Modus Ponens in moral contexts is a last resort that renders moral reasoning impossible.

  ### 3. The Inconsistency Desideratum
  *   **Requirement:** The semantics must explain why certain combinations of normative judgments are inconsistent (logically contradictory) while others are merely distinct.
  *   **Specific Data:**
      *   "Stealing is wrong" + "Stealing is not wrong" = **Inconsistent.**
      *   "Stealing is wrong" + "Lying is wrong" = **Consistent.**
      *   "Stealing is wrong" + "I don't care about stealing" = **Inconsistent (in a practical sense)?** (This is trickier; see below).
  *   **Motivation:** Rationality. We criticize people for holding contradictory moral views, not just different ones.
  *   **Status:** **Genuine Constraint.** A theory that cannot distinguish contradiction from mere difference of attitude fails to capture the normativity of logic.

  ## B. Soft Constraints (Phenomenology and Practice)

  These are requirements derived from how we *use* the language. An expressivist may meet these by *earning the right* to use the terms (Quasi-Realism) rather than by accepting their realist metaphysical implications.

  ### 4. The Truth-Aptness Desideratum
  *   **Requirement:** The semantics must accommodate the practice of calling moral sentences "true" or "false."
  *   **Motivation:** We say, "It is true that genocide is wrong."
  *   **Cognitivist Prejudice Warning:** The requirement is **not** that moral sentences correspond to mind-independent facts. The requirement is only that the *predicate* "is true" can be applied without category error. An expressivist can meet this via deflationism (e.g., "True" is just a device for disquotation).
  *   **Status:** **Negotiable.** An expressivist can reject robust correspondence truth, but cannot reject the *grammatical legitimacy* of truth-talk.

  ### 5. The Propositional Attitude Desideratum
  *   **Requirement:** The semantics must accommodate reports of moral "belief."
  *   **Motivation:** We say, "I believe abortion is permissible," not just "I hurray abortion."
  *   **Cognitivist Prejudice Warning:** The requirement is **not** that belief is a single, uniform relation to a proposition that is the same for moral and descriptive domains. An expressivist may argue "moral belief" is a different mental state type that plays a similar functional role.
  *   **Status:** **Negotiable.** The expressivist must explain the *role* of belief, not necessarily accept the realist ontology of belief content.

  ### 6. The Disagreement Desideratum
  *   **Requirement:** The semantics must explain why moral debates feel like genuine disagreements rather than clashes of taste (e.g., "I like broccoli" / "I hate broccoli").
  *   **Motivation:** When we argue about justice, we think one of us is mistaken, not just that we have different preferences.
  *   **Status:** **Genuine Constraint (with caveats).** If expressivism reduces moral disagreement to "I desire X" vs. "I desire not-X," it risks making disagreement impossible (since both reports can be true simultaneously). The theory must locate the incompatibility in the *content* or the *attitudes* themselves.

  ### 7. The Revisability Desideratum
  *   **Requirement:** The semantics must explain how moral judgments are revisable in light of argument and new information.
  *   **Motivation:** We change our minds based on reasoning, not just causal persuasion.
  *   **Status:** **Genuine Constraint.** If moral judgments are mere brute desires, rational revision is hard to explain. The theory must show how logic impacts the non-cognitive states.

  ## C. Internal Constraint (The Expressivist Fidelity)

  ### 8. The Anti-Collapse Desideratum
  *   **Requirement:** The solution must not solve the above problems by simply positing realist truth-conditions or cognitive belief states as the primary semantic value.
  *   **Motivation:** If the theory posits that "Stealing is wrong" means "Stealing has the property of wrongness," it is no longer expressivism; it is cognitivism.
  *   **Status:** **Internal Constraint.** This is what keeps the project distinct.

  ---

  # Part II: Structural Tensions and Joint Unsatisfiability

  You asked to identify if any subset of these desiderata looks jointly unsatisfiable on purely structural grounds. There is one major tension that threatens the coherence of the entire expressivist project.

  ### The Propositionality vs. Expression Tension
  **The Conflict:**
  *   **From Desiderata 1, 2, & 3 (Logic/Semantics):** To handle embedding, compositionality, and logical validity (specifically Modus Ponens), the semantic content of a sentence must behave like a **proposition**. It must be the kind of thing that can be the argument of a function (negation, conditional) and stand in relations of consistency/inconsistency. Standard logic is defined over truth-apt propositions.
  *   **From Desideratum 8 (Expressivist Fidelity):** The fundamental semantic value of a normative sentence must be a **non-cognitive state** (a plan, a norm-acceptance, a desire-like state). These states are traditionally understood as *not* having truth conditions and *not* being the kind of thing that enters into logical relations in the same way propositions do (you can't negate a desire in the same way you negate a proposition).

  **The Structural Problem:**
  If you make the semantic content robust enough to satisfy Desiderata 1–3 (e.g., by giving normative sentences truth conditions or treating them as propositions), you risk violating Desideratum 8 (Collapsing into Cognitivism).
  If you keep the semantic content purely expressive to satisfy Desideratum 8, you risk violating Desiderata 1–3 (Failing to explain logic/embedding).

  **Is it Unsatisfiable?**
  It is not *logically* unsatisfiable (expressivists exist), but it is **explanatorily unstable**.
  *   **The "Equivocation" Risk:** To avoid collapse, the expressivist often argues that moral sentences have *different* content than descriptive sentences (e.g., they express plans, not beliefs). But then Desideratum 2 (Logic) becomes hard: How can Modus Ponens hold if the antecedent in the conditional has a different semantic type than the asserted premise? (Mark Schroeder's "A-Sentence/B-Sentence" problem).
  *   **The "Inconsistency" Risk:** To explain inconsistency (Desideratum 3) without truth conditions, the expressivist must define inconsistency in terms of clashing attitudes (e.g., "being for" and "being against"). But explaining why *complex* attitudes clash (e.g., "being for if P then Q" + "being for P" but *not* "being for Q") requires a logic of attitudes that mirrors propositional logic so closely it becomes indistinguishable from a logic of propositions (threatening Desideratum 8).

  **Verdict:** The tension is not a proof of impossibility, but it suggests that any successful theory will look like a "quasi-realist" theory that mimics cognitivism so closely that the distinction becomes metaphysically thin. The cost of satisfying 1–3 is often making 8 look like a verbal distinction rather than a substantive one.

  ---

  # Part III: Assessment of Response Families

  Here is how the main families of expressivist solutions stack up against the desiderata.

  ### 1. Simple Attitude-Expressivism (Ayer, early Stevenson)
  *   **Strategy:** Normative sentences express emotions/attitudes directly.
  *   **Performance:**
      *   *Fails Hard Constraints (1, 2, 3).* Cannot handle embedding (you can't "boo" inside a conditional). Cannot explain Modus Ponens without equivocation.
      *   *Passes Soft Constraints (4, 5).* Treats truth/belief as misleading surface grammar.
      *   *Passes Fidelity (8).* Pure expressivism.
  *   **Verdict:** Dead on arrival for a semantics seminar. It treats the FG problem as a mistake rather than a problem to be solved.

  ### 2. Gibbard-Style Norm-Expressivism (Plans/Consistency)
  *   **Strategy:** Meaning is analyzed in terms of ruling out combinations of plans/norms. Logic is preserved via consistency of planning states.
  *   **Performance:**
      *   *Passes Hard Constraints (1, 2, 3).* Gibbard provides a formal semantics where logical operators map onto operations on sets of norm-world pairs. Modus Ponens is valid because planning to do X and planning to do Y if X logically commits one to planning Y.
      *   *Passes Soft Constraints (4, 5, 6).* Uses deflationary truth; explains disagreement as inconsistency in plans.
      *   *Risks Fidelity (8).* Critics argue that "consistency of plans" is structurally isomorphic to "consistency of beliefs," making the distinction between planning and believing metaphysically obscure.
  *   **Verdict:** Strongest on logic and embedding. The main vulnerability is whether "plan-consistency" is sufficiently distinct from "belief-consistency" to satisfy Desideratum 8.

  ### 3. "Being For"-Style Approaches (Schroeder)
  *   **Strategy:** Take inconsistency as primitive. "Being for" is a single attitude type. "Stealing is wrong" = Being for blaming for stealing. Logic is handled by analyzing the types of attitudes expressed by complex sentences.
  *   **Performance:**
      *   *Passes Hard Constraints (1, 2, 3).* Explicitly designed to solve the "negation problem" and Modus Ponens by ensuring the attitude in the premise matches the attitude in the antecedent.
      *   *Passes Soft Constraints.* Handles truth/belief deflationarily.
      *   *Risks Fidelity (8).* To make the logic work, the types of attitudes become incredibly granular (e.g., a specific attitude for conditionals). This risks losing the psychological realism expressivism promises. It solves the logic by stipulation rather than psychological explanation.
  *   **Verdict:** Technically precise, but psychologically implausible. It solves the structural tension by making the "expressive" side look like a syntactic mirror of the propositional side.

  ### 4. Hybrid Views (e.g., Copp, Ridge)
  *   **Strategy:** Normative sentences have *two* contents: a descriptive proposition (truth-apt) and an expressive state (non-cognitive).
  *   **Performance:**
      *   *Passes Hard Constraints (1, 2, 3).* The descriptive content handles the logic and embedding (since propositions embed easily).
      *   *Passes Soft Constraints (4, 5).* Truth applies to the descriptive content.
      *   *Fails Fidelity (8).* This is the biggest criticism. If the logical work is done by the descriptive content, isn't this just cognitivism with an added emotional flourish? It solves the FG problem by conceding the cognitivist's main point (that there is propositional content).
  *   **Verdict:** Solves the structural tension by dissolving expressivism. Good for students to see as a "limit case."

  ### 5. Minimalism / Deflationary Quasi-Realism (Blackburn, Wright)
  *   **Strategy:** Earn the right to talk of truth, facts, and belief without positing robust metaphysical correspondents. "True" is just a device for agreement.
  *   **Performance:**
      *   *Passes Soft Constraints (4, 5, 6).* Excellent at explaining why we *talk* as if we are realists.
      *   *Risks Hard Constraints (2, 3).* Deflationism about truth does not automatically yield a logic of embedding. Just because we can *say* "It is true that P" doesn't explain the semantics of "If P, then Q." Blackburn tries to bridge this with a logic of commitments, but it often loops back to Gibbard-style planning.
      *   *Passes Fidelity (8).* Maintains the anti-realist metaphysics.
  *   **Verdict:** Best on phenomenology, but often relies on a separate semantic theory (like Gibbard's) to handle the hard logical constraints.

  ---

  # Summary for Seminar Preparation

  When presenting this to your students, I recommend framing the Frege-Geach problem not as a single puzzle, but as a **trilemma** arising from the Desiderata above:

  1.  **Logic requires Propositions.** (Desiderata 1–3)
  2.  **Expressivism requires Non-Cognitive States.** (Desideratum 8)
  3.  **Non-Cognitive States are not Propositions.** (Traditional Assumption)

  Every solution involves denying or modifying one of these three claims.
  *   **Hybrids** deny (3) by saying moral states *do* have propositional content.
  *   **Gibbard/Schroeder** deny (3) by constructing a logic of non-cognitive states that *mimics* propositions.
  *   **Error Theorists** deny (1) by saying moral logic is systematically flawed (not recommended for this seminar, but worth noting).
  *   **Quasi-Realists** try to deny the significance of the distinction in (3), arguing that "proposition" is just a functional label we earn.

  The most fruitful discussion for your students will likely center on whether the "mimicry" strategies (Gibbard/Schroeder) successfully satisfy Desideratum 8, or whether they satisfy Desiderata 1–3 only by silently abandoning the expressivist insight.
