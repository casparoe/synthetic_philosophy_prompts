answer: |-
  This is a **values dispute wearing an empirical mask, compounded by a conceptual incoherence regarding aggregation.**

  Your "trench coat" hypothesis is the closest to the truth, but it needs specific layering. The debate stalls not because the ecology is too hard (though it is), but because the two camps are operating within incompatible ethical frameworks that *pretend* to be sharing a common metric (welfare) while actually measuring different things.

  Here is the diagnosis of the fight, the load-bearing assumptions, and the verdict on fixability.

  ### 1. The Diagnosis: Three Layers of Incommensurability

  The debate looks empirical because both sides use the language of "welfare," "suffering," and "outcomes." However, the stalemate is caused by three distinct layers of disagreement that are rarely disentangled.

  **Layer 1: Axiological (The "Currency" Problem)**
  *   **Camp A (WAS/Interventionists):** Operates on a form of **hedonistic utilitarianism**, often skewed toward negative utilitarianism (suffering reduction is lexically prior to pleasure creation). They assume individual sentient experience is the *only* locus of moral value.
  *   **Camp B (Conservation/Skeptics):** Operates on **value pluralism** or **ecocentrism**. They assign intrinsic value to processes (evolution, predation, ecosystem integrity), species existence, or "wildness," independent of the moment-to-moment hedonic states of the individuals within them.
  *   **The Clash:** Camp A sees Camp B's values as fetishizing "nature" at the cost of real suffering. Camp B sees Camp A's values as a reductionist flattening of complex goods into a single, crude metric.

  **Layer 2: Conceptual (The "Aggregation" Problem)**
  *   **The Core Issue:** You hit this in your hypothesis. For Camp A's calculation ("total suffering > total pleasure") to work, welfare must be **cardinal** (measurable on a scale) and **interpersonally comparable** (my pain unit = your pain unit).
  *   **The Denial:** Many critics (Camp B, but also some philosophers) argue that welfare is **ordinal** (I prefer A to B) or context-dependent. There is no "hedonic balance sheet" for a rabbit. A life containing terror and starvation might still be "worth living" from the animal's perspective (evolutionary drive), or the concepts might be incommensurable (you can't subtract pain from pleasure).
  *   **The Stall:** Camp A argues as if the "net negative" claim is a discovery waiting for data. Camp B argues as if the claim is a category error. They cannot meet because one is holding a calculator and the other is saying "numbers don't apply here."

  **Layer 3: Epistemic (The "Prediction" Problem)**
  *   **Camp A:** Assumes we can model second-order effects well enough to know that reducing populations reduces suffering (ignoring potential ecological collapse that causes *more* suffering).
  *   **Camp B:** Assumes complex systems are unknowable (the "Precautionary Principle").
  *   **The Stall:** This is the only truly empirical layer, but it's held hostage by the first two. Camp B uses epistemic uncertainty as a shield for their values; Camp A uses empirical optimism as a spear for theirs.

  ### 2. Load-Bearing Assumptions

  To see why nothing moves, look at what each side must assume to keep their position standing.

  **Camp A (The "Net Negative" / Interventionist Camp)**
  1.  **Atomism:** Moral value resides *only* in individual subjective experiences, not in collectives (species, ecosystems).
  2.  **Commensurability:** Pain and pleasure can be weighed on a single scale, and "non-existence" is a valid baseline for comparison (i.e., it is better not to be born than to live a net-negative life).
  3.  **Linearity:** Reducing population size linearly reduces total suffering (ignoring density-dependent welfare effects or the suffering caused by the reduction method itself).
  4.  **Neutrality of Nature:** Nature has no moral agency or intrinsic value; it is merely a machine producing experiences that we should optimize.

  **Camp B (The "Wildness" / Conservation Camp)**
  1.  **Holism:** Ecosystems, species, or evolutionary processes have value independent of the welfare of current inhabitants.
  2.  **Epistemic Humility:** We cannot reliably measure wild welfare, nor can we predict the cascading effects of intervention.
  3.  **The "Right to Exist":** Wild animals have a claim to their niche and life that is not overridden by our calculation of their hedonic balance (a deontological constraint).
  4.  **Positive Presumption:** In the absence of proof, we must assume wild lives are worth living (or at least, that we have no right to judge them otherwise).

  **Where they talk past each other:**
  When Camp A says, "Look at this parasitic worm," they are offering **evidence of suffering**.
  When Camp B hears it, they hear **an irrelevant data point**. They do not deny the suffering; they deny that *suffering is the only thing that matters* or that *we are allowed to act on it*.
  Conversely, when Camp B says, "Biodiversity is valuable," Camp A hears **irrational prejudice**.

  ### 3. Why the Debate Stalls

  The debate is unresolvable in its current form because it is a **category error**.

  Camp A is asking a **consequentialist calculation question**: *"What action minimizes the sum of negative experiences?"*
  Camp B is answering a **virtue/deontological identity question**: *"What kind of relationship should humans have with the wild?"*

  Camp A treats the "net negative" claim as a factual premise that, once proven, compels action. But for Camp B, even if you proved conclusively that wild lives are net negative, it would not compel them to support habitat destruction. They would simply say, "That is tragic, but destroying their world is worse."

  Because Camp A believes their premise *should* compel Camp B, they keep trying to find better data. Because Camp B knows the data won't change their values, they keep rejecting the methodology. It is a loop.

  ### 4. Can Progress Be Made?

  **Honest Verdict:** The core debate is **unfixable** because it is a fundamental clash of axiologies (Negative Utilitarianism vs. Pluralism/Ecocentrism). You cannot empirically resolve a disagreement about what counts as "good."

  However, **strategic progress** is possible if the question changes.

  **What won't work:**
  *   **More Welfare Science:** Measuring cortisol in deer will not convince an ecocentrist that culling is good.
  *   **Philosophical Arguments on Aggregation:** Proving welfare is additive won't convince someone who values "wildness" over welfare.

  **What might work (Shifting the Overton Window):**
  1.  **Decouple Intervention from Destruction:** Camp A's association with "habitat destruction" is a PR death sentence. Progress requires focusing on **welfare-friendly conservation**. Example: Vaccinating wild animals against disease, sterilizing to prevent overpopulation without culling, or rescuing animals from natural disasters. This allows Camp B to keep their "preserve nature" value while Camp A reduces suffering.
  2.  **Reframe the Metric:** Stop asking "Is life net negative?" (which invites the aggregation fight). Start asking "Are there specific, intense pockets of suffering we can alleviate without systemic collapse?" (e.g., botfly larvae). This moves the debate from *existential* to *tactical*.
  3.  **Acknowledge the Value Conflict:** Camp A needs to admit that "biodiversity" is a genuine human value, not just a mistake. Camp B needs to admit that "suffering" is a genuine moral cost, not just "nature's way." If both admit they are trading off two genuine goods (Welfare vs. Wildness), the conversation shifts from "Who is right?" to "What is the acceptable trade-off ratio?"

  ### Summary

  The fight is a **values disagreement disguised as an empirical one**.
  *   **Camp A** assumes welfare is the only currency and is additive.
  *   **Camp B** assumes wildness/integrity is a currency and welfare is unknowable/incommensurable.

  The stall persists because Camp A keeps trying to win a values war with ecology data. Progress requires abandoning the hope that "net negative" is a factual claim that will settle the debate. Instead, the field must move toward **pluralistic compromise**: reducing specific suffering where possible without violating the constraint of ecosystem integrity. If the debate remains focused on "Is wild life hell?", it will never end.
