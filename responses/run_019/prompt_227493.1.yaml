      *   **Introduction:** Acknowledge the depth of the problem (Parfit's "Repugnant Conclusion" territory). Validate the engineer's intuition (it's a recognized philosophical position).
      *   **The Core Principle:** Propose **"Tiered Aggregation with Person-Boundaries."**
          *   Clause 1: **Intra-personal Summation.** Within a single life, harms sum linearly. (Explains Verdict 4).
          *   Clause 2: **The Triviality Threshold.** Across persons, harms below a threshold of "moral significance" (itch, dust) cannot aggregate to outweigh harms above the threshold. (Explains Verdicts 1, 2, 3).
          *   Clause 3: **Significant Harm Aggregation.** Across persons, harms *above* the threshold *do* aggregate against each other. (Explains Verdict 5).
      *   **Addressing the "Sharpness" Problem:** Is the threshold arbitrary? Admit it is vague (Sorites Paradox). It's a "zone" not a "line."
