      *   *Prioritarianism:* Weight harms to the worse off. Doesn't necessarily solve the aggregation problem.
      *   *The "Repugnant Conclusion" / "Torture vs. Dust Specks":* This is Parfit's problem. The user is intuitively a *Non-Aggregativist* regarding severe harms but an *Aggregativist* regarding mild harms or within-person cases.
      *   *Key Concepts:*
          *   **Lexical Thresholds (Lexical Prioritarianism):** Harms above a certain severity cannot be outweighed by any number of harms below that severity.
