          *   Itch/Dust = Trivial. Never aggregates against Non-Trivial.
          *   Sleep = Non-Trivial. Aggregates against other Non-Trivial.
          *   Migraine = Non-Trivial.
          *   Wait, if Migraine and Sleep are both Non-Trivial, why does Migraine beat 10M Itches (Trivial) but Back Pain lose to 100M Sleeps (Non-Trivial)?
          *   This holds together!
          *   **The Principle:** Trivial harms do not aggregate to outweigh significant harms across persons. Significant harms *do* aggregate against other significant harms across persons. Within a person, all harms aggregate.

