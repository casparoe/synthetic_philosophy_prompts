answer: |-
  Here is the full specification for a theory of joint action. This is not a summary of existing literature, but a requirements document derived from the phenomenological, empirical, and conceptual pressure points the field has identified.

  ### I. The Desiderata List

  I have categorized these into **Non-Negotiable** (conditions without which the phenomenon ceases to be joint action) and **Camp Commitments** (theoretical preferences that distinguish specific schools of thought).

  #### A. Structural & Conceptual Requirements

  **1. The Parallel Action Distinction (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish *joint* action from *parallel* action where agents merely happen to do the same thing at the same time.
  *   **Case:** **Protest Walkers.** Two people on opposite sidewalks heading to the same protest are not acting jointly. Two people heaving a car are.
  *   **Why:** Without this, "collective intentionality" collapses into aggregate individual intentionality. The theory must identify the "glue" that binds the agents beyond spatial/temporal coincidence.

  **2. The Mismatched Content Tolerance (Non-Negotiable)**
  *   **Requirement:** The theory must allow for joint action even when participants have divergent conceptualizations of the *same* activity, provided the physical coordination holds.
  *   **Case:** **The Date/Interview Walk.** A walks B to the station. A thinks it's a date; B thinks it's a job interview prep. They are still "walking together."
  *   **Why:** If the theory requires identical propositional content ("We intend to walk-for-romance" AND "We intend to walk-for-career"), it rules out too much ordinary social interaction. The "We" must be robust enough to survive interpretive divergence.

  **3. The Private Defection Resilience (Non-Negotiable)**
  *   **Requirement:** The theory must account for the status of the joint action *during* the performance, even if one agent secretly intends to abandon the joint goal later.
  *   **Case:** **The Table Carriers.** Two people carry a table. One privately intends to drop it the moment they reach the truck.
  *   **Why:** Intuitively, they are carrying the table together *until* the moment of defection. A theory that says "they were never acting jointly because one lacked sincerity" fails to capture the ongoing reality of the coordination. Jointness is a current state, not a guarantee of future completion.

  **4. The Spontaneity Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must explain joint action that arises without prior negotiation, explicit agreement, or established convention.
  *   **Case:** **Car Heaving / Jazz Duo.** Strangers lift a car to save a cyclist; musicians improvise a tune without rehearsal.
  *   **Why:** Many theories (specifically Bratman and Gilbert) rely on prior planning or explicit commitment formation. If a theory cannot handle immediate, ad-hoc coordination, it treats joint action as a bureaucratic contract rather than a fundamental social capacity.

  **5. The Hierarchy Agnosticism (Non-Negotiable)**
  *   **Requirement:** The theory must accommodate joint action where there is no egalitarian interlocking of plans, but rather asymmetric roles or implicit leadership.
  *   **Case:** **The Hunting Party.** Flushers and shooters perform distinct, non-interchangeable roles without issuing instructions during the act.
  *   **Why:** Requiring symmetrical "interlocking intentions" (Bratman) risks excluding structured cooperative activities where one agent follows the other without necessarily knowing the leader's full plan.

  #### B. Empirical & Developmental Requirements

  **6. The Minimal Cognition Floor (Non-Negotiable)**
  *   **Requirement:** The theory must be consistent with joint action capabilities in agents who lack full Theory of Mind (ToM), complex language, or the ability to represent recursive mental states (e.g., "I intend that you intend...").
  *   **Case:** **Toddler Pulling.** 2-year-olds successfully coordinate pulling two handles simultaneously to retrieve a toy, despite failing false-belief tasks.
  *   **Why:** If joint action requires the cognitive architecture of a rational adult (recursive mindreading), it cannot be the foundation of social development. It must be scalable down to embodied/enactive coordination.

  **7. The Animal Cognition Consistency (Camp Commitment: Naturalists)**
  *   **Requirement:** The theory should not rule out joint action in non-human animals *a priori*.
  *   **Case:** **Wolf Pack Hunting / Chimpanzee Cooperation.**
  *   **Why:** This is a commitment for those who view collective intentionality as an evolutionary adaptation. (Note: Searle rejects this; Gilbert rejects this. It is marked as a Camp Commitment because a strictly linguistic/normative theory can deny it, but at the cost of naturalistic plausibility).

  #### C. Normative & Ontological Requirements

  **8. The Normative Binding Force (Camp Commitment: Gilbertians)**
  *   **Requirement:** The theory must explain why participants feel *entitled* to rebuke a partner for failing to pull their weight.
  *   **Case:** **Table Carriers (again).** If one drops their end early, the other can legitimately complain ("Hey!").
  *   **Why:** This distinguishes joint action from mere causal interdependence. However, demanding strong normative obligations as a *condition* for joint action (rather than a consequence) is a specific theoretical choice that may conflict with the Minimal Cognition Floor.

  **9. The Ontology of the 'We' (Non-Negotiable)**
  *   **Requirement:** The theory must explicitly state what constitutes the subject of the intention. Is it:
      *   (a) A primitive mode of intention (Searle)?
      *   (b) A web of interlocking individual intentions (Bratman)?
      *   (c) A plural subject created by commitment (Gilbert)?
  *   **Why:** Vague appeals to "sharedness" are insufficient. The theory must specify if the "We" is irreducible or reducible.

  **10. The Failure Condition (Non-Negotiable)**
  *   **Requirement:** The theory must specify exactly when joint action *fails* to obtain.
  *   **Case:** **Coercion / Deception.** If A forces B to help carry the table at gunpoint, is it joint action? If A tricks B into helping (false pretenses), is it joint action?
  *   **Why:** A theory that counts coercion as joint action loses the distinctive voluntary character of cooperation. A theory that counts deception as joint action (see Mismatched Content) must explain where the line is drawn.

  ---

  ### II. Incompatible Desiderata (The Trade-Offs)

  There are tensions within this spec that suggest no single theory can satisfy all desiderata without modification.

  **Tension 1: High Normativity vs. Minimal Cognition (D8 vs. D6)**
  *   **Conflict:** To feel *obligated* to a partner (Normativity), one typically needs to understand the partner as an agent with expectations (ToM). Toddlers (D6) coordinate successfully but likely lack the cognitive architecture to grasp "joint commitment" or "entitlement to rebuke" in the full normative sense.
  *   **Implication:** You must either downgrade the normativity (it's not a real obligation, just a behavioral expectation) or upgrade the toddlers (they have more sophisticated social cognition than standard ToM tests suggest).

  **Tension 2: Shared Content vs. Mismatched Understanding (D2 vs. D9b)**
  *   **Conflict:** Bratman-style views require "meshing subplans." If A thinks it's a date and B thinks it's an interview (D2), their subplans regarding the *nature* of the walk do not mesh.
  *   **Implication:** To save the intuition that they are walking together, the theory must define the "Shared Content" very thinly (e.g., "walking to the station") while allowing thick descriptions ("romantic outing") to remain private. This risks making the "Shared Intention" too thin to do any explanatory work.

  **Tension 3: Spontaneity vs. Interlocking Intentions (D4 vs. D9b)**
  *   **Conflict:** Interlocking intentions require knowing (or believing) the other intends their part. In spontaneous car heaving (D4), there is no time to establish mutual knowledge of intentions.
  *   **Implication:** Theories relying on recursive mindreading ("I intend that we J because you intend that we J") struggle to explain split-second coordination. This pushes toward embodied/enactive accounts where the "intention" is in the movement, not the head.

  ---

  ### III. The Knockout Requirement

  The single requirement that knocks out the most of the standard views is:

  **The Minimal Cognition / Spontaneity Constraint (D4 + D6)**
  *Specifically: The theory must explain joint action in cases of immediate coordination without prior agreement and without presupposing high-level recursive mindreading.*

  **Why it knocks out the standard views:**
  1.  **Bratman:** His theory relies on **interlocking intentions** and **mutual knowledge**. This is cognitively expensive (requiring ToM) and temporally expensive (requiring time to establish mutual knowledge). It cannot easily explain the **Car Heaving** (no time for mutual knowledge) or the **Toddler Pulling** (no ToM).
  2.  **Gilbert:** Her theory relies on **Joint Commitment**, which implies a process of agreement (even if tacit) and creates normative obligations. This is too intellectualist for **Toddlers** and too formal for **Spontaneous Rescue** cases where no "commitment" ceremony occurs.
  3.  **Searle:** He survives Spontaneity better (by positing a primitive "We-Intention"), but he fails the **Minimal Cognition** explanatory test. He posits a biological primitive but offers no mechanism for how it scales down to toddlers or up to complex norms. He effectively says "we just have it," which is a placeholder, not an explanation consistent with developmental gradients.

  **Verdict:** This requirement forces a move away from "Standard View" intellectualism toward **Embodied/Enactive** or **Team Reasoning** accounts, which are not part of the classic triad.

  ---

  ### IV. Brief Scorecard: Searle, Bratman, Gilbert

  | Desideratum | **Searle (We-Intentions)** | **Bratman (Shared Intention)** | **Gilbert (Joint Commitment)** |
  | :--- | :--- | :--- | :--- |
  | **Parallel Action (D1)** | **Pass.** Distinguishes via primitive mode. | **Pass.** Distinguishes via interlocking. | **Pass.** Distinguishes via commitment. |
  | **Mismatched Content (D2)** | **Fail.** Requires same intentional content. | **Fail.** Requires meshing subplans. | **Pass.** Can commit to same goal for different reasons. |
  | **Private Defection (D3)** | **Fail.** If I lack we-intention, it's not joint. | **Pass.** Can intend to participate while hiding defection. | **Fail.** Violation of commitment negates the bond. |
  | **Spontaneity (D4)** | **Pass.** We-intention can be immediate. | **Fail.** Requires prior planning/mutual knowledge. | **Fail.** Requires agreement (even tacit). |
  | **Minimal Cognition (D6)** | **Fail.** Posits high-level faculty as primitive. | **Fail.** Too intellectualist (recursive mindreading). | **Fail.** Too normative/linguistic. |
  | **Normativity (D8)** | **Fail.** No account of obligation/rebuke. | **Weak.** Norms derive from rationality of plans. | **Pass.** Central feature (entitlement to rebuke). |
  | **Ontology (D9)** | **Irreducible.** (Biological primitive). | **Reducible.** (Web of individual intentions). | **Plural Subject.** (New entity created). |

  **Summary of Failures:**
  *   **Searle** gets the phenomenology right but fails the **Normativity** and **Developmental** explanations (it's a "black box" faculty).
  *   **Bratman** gets the **Planning/Stability** right but fails **Spontaneity** and **Development** (too cognitively demanding).
  *   **Gilbert** gets the **Normativity** right but fails **Spontaneity** and **Development** (too contractual/intellectual).

  ### V. Conclusion: The Account of the 'We'

  Based on the desiderata above, specifically the pressure from **Spontaneity** and **Minimal Cognition**, the 'We' cannot be:
  1.  A **Special Kind of Intention** (Searle): This is explanatorily empty regarding development.
  2.  A **Web of Ordinary Intentions** (Bratman): This is too cognitively demanding for toddlers/spontaneous cases.
  3.  A **Commitment** (Gilbert): This is too normative/contractual for implicit coordination.

  **The Required Account:**
  To satisfy the full spec, the 'We' must be an **Emergent Dynamic State**.
  It is not a mental object held by individuals, nor a contract between them. It is a **coupled system state** where the agents' motor intentions are regulated by the perception of the other's action in real-time.
  *   **In Toddlers/Animals:** It is embodied coupling (sensorimotor contingency).
  *   **In Adults:** It is layered with normative expectations (Gilbert) and planning structures (Bratman).

  **What it can't count as joint:**
  Any interaction where the agents are causally linked but **insensitive to each other's contribution as a condition of their own continuation**.
  *   **Protest Walkers:** If one stops, the other keeps walking. (Not Joint).
  *   **Table Carriers:** If one stops, the other *must* adjust or drop it. (Joint).
  *   **The Line:** The boundary is **Interdependent Regulation**, not shared content or prior agreement. If my motor control system treats your movement as a constraint on my own possibilities for action, we are in a joint action, regardless of what we tell ourselves about *why* we are doing it.
