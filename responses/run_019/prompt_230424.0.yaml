      *   If we follow RNA strictly: Not Alive.
      *   If we follow Mule strictly: Alive.
      *   *Resolution:* The Mule ruling specifies "for an individual organism." The RNA ruling specifies "capacity for Darwinian evolution was decisive." The Spore ruling links the individual to a "lineage."
