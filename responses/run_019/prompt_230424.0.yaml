      *   If we ruled Protocell **Not Alive** (Evolutionary Context), the next case should be: **A sterile mule clone created synthetically.** If *that* is alive, it confirms Lineage matters more than Origin. If *that* is not alive, it confirms Natural Lineage matters.
      *   *Simpler:* **A self-replicating crystal.** It evolves (errors in stacking) but has no metabolism. Precedent 1 says Alive.
      *   *Let's focus on the tension:* The tension is Metabolism (Mule) vs. Evolution (RNA).
      *   Future Case: **A "Phoenix" Cell.** A cell that metabolizes and maintains homeostasis for 100 years, then dissolves into raw materials which spontaneously reassemble into a new cell (no direct copying, but cyclical continuity).
