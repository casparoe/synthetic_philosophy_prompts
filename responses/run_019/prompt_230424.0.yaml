      *   **Task:** Create a ruling for a new case consistent with existing precedents.
      *   **Existing Precedents:**
          1.  *Self-replicating RNA:* Alive. Reason: Capacity for Darwinian evolution (replication + variation) is decisive. Cell membrane/metabolism *not* required.
          2.  *Bacterial Endospore:* Alive. Reason: Dormant phase of a metabolizing, reproducing lineage. (Implies lineage/history matters, potentiality matters).
          3.  *Sterile Mule:* Alive. Reason: Active self-maintenance (metabolism/homeostasis) matters for an *individual*, even without reproduction.
      *   **New Case:** Synthetic protocell.
          *   *Features:* Imports nutrients, repairs membrane, maintains internal composition (metabolism + homeostasis).
