      *Problem:* In business, "defecting" (Low Price) is often seen as smart.
      *Better:* **The "Server Load."** Two admins. Can run heavy backup (costs resources) or skip it. If both skip, server crashes. If one runs, it's okay. If both run, it's great. Wait, that's Stag Hunt.
      *Let's stick to the PD structure but make it neutral.* **The "Shared Folder."** You and a colleague use a shared drive. You can clean it (costs time) or dump trash (saves time). If both dump, it crashes. If both clean, it works.
      *Actually, the "Algorithm Update" for self-driving cars is the strongest for engineers.* It removes morality entirely. It's about code logic.

