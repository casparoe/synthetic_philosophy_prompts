answer: |-
  Here is the battle plan. You have 15 minutes. Dev is the boss level; the group is the audience. Your goal isn't to convert Dev (he's dug in), it's to make the group see the logic so clearly that Dev's heckling sounds like noise.

  ### 1. The Order of Operations (The "Stack")
  Do not start with the Prisoner's Dilemma. Do not start with "You should cooperate." Start with the *conditions* that make the logic possible. If you skip these, Dev will pounce.

  1.  **Isolation (Minute 0-2):** Establish that there is **no communication** and **no future**. This kills the "iterated game/reputation" objection (Misconception D) before it spawns.
      *   *Say:* "Imagine a decision you make once, in a dark room, against a stranger you'll never see again. No revenge, no reputation, no deals."
  2.  **Symmetry (Minute 2-5):** Establish that the *situation* is identical, not just the people. This sets up the "Calculator" analogy.
      *   *Say:* "You both have the same information. You both want the same thing (to win/maximize gain). You are both rational."
  3.  **Logical Identity (Minute 5-10):** The Core Move. This is where you swap "humans" for "algorithms." This kills the "magic/telepathy" objection (Misconception A).
      *   *Say:* "If two calculators run the same code on the same input, they produce the same output. Not because they talk, but because $2+2=4$ everywhere."
  4.  **The Bridge (Minute 10-13):** Apply it back to humans. Address the "clone" objection (Misconception C).
      *   *Say:* "Brains aren't calculators, but logic is. If we reason the same way, our choices will correlate."
  5.  **The Check (Minute 13-15):** The scenario to test understanding.

  ### 2. The ONE Example: "The Two Calculators"
  **Do not use humans for the core explanation.** Use machines. Engineers respect determinism.

  *   **The Setup:** "Imagine I have a calculator. Dev has an identical calculator. We are in separate rooms. I type `51 * 83`. Dev types `51 * 83`. We both press Enter."
  *   **The Move:** "Before I look at my screen, what are the odds Dev's screen shows a different number than mine? Zero. Why? Did my calculator send a radio signal to his? No. Is it magic? No. It's because the *process* is identical."
  *   **The Pivot:** "Superrationality just says: In a symmetric game, your *decision process* is the calculator. The *choice* is the output. If you run 'Cooperate', and he runs the same logic, he outputs 'Cooperate'. You aren't choosing *for* him. You are choosing which output your shared logic produces."

  **Criteria this example MUST have:**
  *   **Deterministic:** Input A + Code B = Output C. No randomness.
  *   **Isolated:** No Wi-Fi, no cables.
  *   **Identical Code:** This is the non-negotiable premise.

  **Features it must NOT have:**
  *   **NO Payoff Numbers:** Do not say "If you both cooperate you get $5." That makes them do arithmetic instead of logic. Use "Better Outcome" vs "Worse Outcome."
  *   **NO Moral Weight:** Do not use "Good/Bad." Use "Win/Lose" or "Efficient/Inefficient."
  *   **NO "Clone" Language:** Do not say "Imagine a clone of you." Say "Imagine a processor running your algorithm."

  ### 3. Misconception Management (The "Patch Notes")
  Here is when to deploy the counters. If you do it too early, you look defensive. Too late, the idea is infected.

  *   **(d) "It's just iterated cooperation/reputation."**
      *   *When:* **Minute 1 (Pre-emptive).**
      *   *How:* "I need to be clear: This is a one-shot game. You never meet again. Reputation is impossible. If this only worked with reputation, I wouldn't be talking to you."
  *   **(a) "It's telepathy / magical causality." (Dev's Main Weapon)**
      *   *When:* **Minute 6 (During the Calculator analogy).**
      *   *How:* "This is where people think it's magic. It's not. My calculator doesn't *cause* Dev's to match. The *math* causes both to match. Superrationality isn't about causal influence; it's about logical correlation."
  *   **(c) "It only works on literal identical copies."**
      *   *When:* **Minute 11 (The Bridge).**
      *   *How:* "In the real world, you aren't 100% identical. But if you're 90% similar in reasoning, the probability shifts. It's not a binary switch; it's a dial. The more similar the reasoning, the stronger the correlation."
  *   **(b) "It's just Kant's Categorical Imperative."**
      *   *When:* **IGNORE.**
      *   *Why:* If you bring up Kant, you lose the engineers. It becomes ethics, not strategy. Only address this if someone explicitly asks, "Isn't this just morality?" Then say: "Kant says 'do it because it's right.' Superrationality says 'do it because it wins given the symmetry.'"

  ### 4. The Final Check: "The Autonomous Merge"
  Do not ask "Should you vote?" or "Should you cooperate?" That tests morality, not logic. Use a scenario where "defecting" feels smart, to see if they trust the symmetry.

  **The Scenario:**
  "You're coding the AI for a self-driving car. A competitor is coding theirs. You're both using the same open-source logic library. There's a narrow bridge. The cars meet.
  *   **Option A (Yield):** Your car waits. If both yield, traffic stalls (Bad). If one yields and one goes, traffic flows (Good for goer, Bad for yielder).
  *   **Option B (Force):** Your car goes. If both force, crash (Worst).
  *   **The Kicker:** You know the competitor's AI uses the *same decision algorithm* as yours. You can update your code right now. Do you hardcode 'Yield' or 'Force'?"

  **What to listen for:**
  *   **Fail:** "You should yield because crashing is bad." (Moral reasoning).
  *   **Fail:** "You should force, maybe they will yield." (Standard rationality/ignorance of symmetry).
  *   **Pass:** "If I code 'Force', their code outputs 'Force' and we crash. If I code 'Yield', their code outputs 'Yield' and we stall... wait, actually we need a coordination mechanism."
  *   **Better Pass:** "I code 'Yield' *if I know they will too*, but since we are identical, if I choose 'Force', they choose 'Force'. So I must choose the option that is best when *both* do it. So I Yield." (Actually, in this specific Chicken game, superrationality is tricky, but you want them to realize **their choice determines the pair's choice**).
  *   *Correction for you:* The Prisoner's Dilemma is safer for the check. Let's swap to **"The Server Load."**
      *   **Revised Check:** "Two admins. Shared server. Can Run Backup (costs time) or Skip (saves time). If both Skip, Server Crashes (Everyone fired). If both Run, Server Safe (Everyone tired). If one Runs, Server Safe (Runner tired, Skipper relaxed). You know the other admin reasons exactly like you. Do you Run or Skip?"
      *   **Correct Answer:** "I Run. Because if I Skip, he Skips, and we get fired. My choice dictates the pair's choice."

  ### 5. The "Do Not Enter" List (And One-Line Dodges)
  You have 15 minutes. Do not go down these rabbit holes.

  *   **Löbian Cooperation / Formal Proofs:**
      *   *Dodge:* "That's the mathematical proof under the hood. Today we're just driving the car, not building the engine."
  *   **Evidential vs. Causal Decision Theory:**
      *   *Dodge:* "That's the academic label for this argument. The logic stands on its own without the jargon."
  *   **Does this solve Ethics?:**
      *   *Dodge:* "This isn't about being a good person. It's about winning games where your opponent thinks like you."
  *   **Voting (The Dev Trap):**
      *   *Dodge:* "Voting adds noise (irrational voters). Let's master the logic with perfect rationality first, then add noise later."

  ### 6. Handling Dev (The Skeptic)
  Dev will interrupt. He is the engineer. He cares about *causality*.

  *   **Dev's Attack:** "But you aren't *actually* controlling him. If you defect, he still defects because he decided to, not because you did."
  *   **Your Backup Move:** "Agreed. I don't control him. I control *my* code. But because our code is the same, I can't change my output without changing his. I'm not reaching into his brain; I'm recognizing that his output is a function of the same logic I'm using right now."
  *   **Dev's Attack:** "Humans aren't deterministic."
  *   **Your Backup Move:** "True. But we're modeling rationality. If we introduce randomness, we're not playing the superrational game anymore. We're playing 'guess the noise.' Let's assume rationality for the sake of the argument."
  *   **Dev's Attack:** "This is useless in the real world."
  *   **Your Backup Move:** "It's not useless, it's probabilistic. If there's a 50% chance they think like you, superrationality still applies to that 50%. It's not all-or-nothing."

  **Final Advice:**
  Stand near the whiteboard. Draw two boxes labeled "Your Logic" and "Their Logic." Draw an arrow from "Logic" to "Choice" for both. Do **not** draw an arrow between "Your Choice" and "Their Choice." That visual distinction (Common Cause vs. Direct Causation) is the only thing that will stop Dev from calling it magic.

  Good luck. Thursday is going to be fun.
