  Date: October 26, 2023

  To: The Department of Neuroscience and the Office of Research Compliance
  From: The University Animal Research Ethics Committee
  Subject: Decision Regarding Protocol 2023-OCT-NEU

  The Committee on Animal Research Ethics recommends approval of the proposed neuroscience protocol contingent upon specific modifications regarding analgesia and harm mitigation. While the committee acknowledges the scientific merit of the proposed study on octopus learning, we cannot approve the administration of aversive electric shocks without analgesic intervention or equivalent harm-reduction strategies. This decision reflects a consensus that under conditions of moral uncertainty, the institution must prioritize the precautionary principle over scientific convenience, requiring the research team to redesign the protocol as though octopus sentience were established fact. This conditional approval balances the potential value of the research with the imperative to avoid irreversible moral harm, mandating that the lab consult with veterinary staff to identify candidate analgesics or behavioral mitigations even if their efficacy is not yet fully validated in cephalopods.

  The core of our deliberation centered on how an institution should act when the moral status of the research subject is empirically unresolved. Half the committee argued that the evidence for octopus sentience is too thin to warrant the constraints placed on vertebrate research, while the other half argued that the probability of sentience, however modest, multiplied by the moral cost of inflicting suffering, generates an expected disvalue that outweighs the scientific cost of mitigation. We recognize the philosophical sophistication of the objection that this hedging calculation is incoherent because it attempts to multiply a probability by a moral cost that one candidate moral framework refuses to recognize. If octopuses are not sentient, the cost of treating them as such is merely financial and temporal, but if they are sentient, the cost of treating them as insentient is profound suffering. The objection posits that under genuine moral disagreement, committee members should simply vote their conscience rather than follow a hedging rule whose output nobody on the committee actually endorses as a moral truth. However, this view conflates the role of an individual moral agent with that of a public institution. An individual may rightly choose to vote their conscience and accept the risk of moral error as a matter of personal integrity, but a university committee acts as a steward of public trust and institutional liability. The committee's obligation is not to maximize the good according to any single moral theory but to minimize the risk of the institution becoming complicit in a catastrophic moral violation that cannot be undone. Therefore, the hedging argument is appropriate here not because it resolves the metaphysical question of sentience, but because it manages the institutional risk of violating plausible moral norms.

  Furthermore, we must address the concern that adopting a precautionary stance for octopuses creates a slippery slope toward requiring similar protections for fish, insects, or even cell cultures, thereby paralyzing research. This worry assumes that the precautionary principle must be applied uniformly across all biological life, but our decision rests on a principled distinction regarding neuroanatomical complexity. Cephalopods are phylogenetically unique among invertebrates, possessing large, centralized brains and nervous systems that exhibit functional convergence with vertebrates, alongside behavioral evidence of play, problem-solving, and pain-avoidance learning that is absent in insects or cell cultures. Drawing the line at cephalopods is not arbitrary; it is grounded in the best available comparative neuroscience, which suggests that the substrate required for morally relevant suffering is far more likely to exist in an octopus than in a fruit fly. By anchoring our decision in specific biological criteria rather than a vague sanctity of life, we establish a defensible stopping point that prevents the slide toward absurdity while respecting the unique status of these animals.

  We must also state honestly the strongest consideration against this recommendation, which is the possibility that we are imposing significant costs on scientific progress for no moral gain. If the hypothesis of octopus sentience is false, then the requirements for analgesia and protocol redesign will delay valuable knowledge about learning and neural plasticity without preventing any actual suffering. This is a non-trivial harm; knowledge itself is a moral good, and stifling research based on a false positive regarding sentience deprives society of potential benefits ranging from basic cognitive science to medical applications. There is a real danger of anthropomorphizing neural complexity and imposing human-centric welfare standards on organisms that may experience nociception without suffering. The committee acknowledges that this conditional approval may burden the lab with expenses and delays that ultimately protect nothing more than an illusion of sentience. However, given the asymmetry of the errors, the moral cost of inflicting actual suffering is deemed greater than the scientific cost of unnecessary caution.

  Ultimately, the committee's position is dictated by the public-facing obligations of the university. Research institutions operate under a social license that requires transparency and accountability regarding the treatment of animals. If the public were to learn that the university authorized procedures causing potential suffering to highly intelligent animals without attempting mitigation, simply because the science was not yet settled, the reputational damage and erosion of trust would be severe. An institution cannot claim moral agnosticism as a defense against public scrutiny; it must demonstrate that it has erring on the side of care when the stakes involve potential pain. Therefore, while individual members may hold divergent views on the metaphysical likelihood of octopus consciousness, the committee as a body must adopt a unified standard of care that reflects the seriousness of the uncertainty. We urge the neuroscience lab to view these conditions not as an impediment but as an opportunity to lead in the development of welfare standards for cephalopods, ensuring that their important work proceeds with the highest ethical integrity.

  Sincerely,

  The University Animal Research Ethics Committee
