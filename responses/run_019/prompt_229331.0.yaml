          *   Provide a "Residue Report" (what mapped well, what was fudged, what has no counterpart).
          *   Answer the core question: Is the philosopher's claim just about technical choices, or does the DB vocabulary miss something about *power*?
      *   **Tone:** Precise, technical, respectful of both domains, no fluff.

  2.  **Deconstruct the Philosopher's/Historian's Claim:**
      *   *Core Idea:* Archives are not passive containers; they are active constructors of reality.
      *   *Silence/Absence:* What isn't recorded is significant (structural silence).
      *   *Categorization:* How things are labeled determines what fits and what gets excluded.
      *   *Power:* Who decides the schema? Who gets to write? Who gets to delete?

  3.  **Drafting the Translation (DB Vocabulary):**
      *   *Archive -> Database Instance/Cluster.*
      *   *Non-neutrality -> Schema Design & Configuration Choices.*
      *   *Silence/Gaps -> Missing Columns/Tables.* If there's no column for `ethnicity`, that data doesn't exist.
      *   *Unflagged Nulls -> `NULL` without `NOT NULL` constraint or default.* It's not "unknown," it's "irrelevant to the system."
      *   *Categorization -> Enum Types/Check Constraints.* If `role` is an ENUM('admin', 'user'), a 'moderator' cannot exist.
      *   *Retention Policy -> TTL (Time To Live) / Partition Pruning.* Data expires based on rules set by the admin, not the data subject.
      *   *Permissions/Hidden Records -> RBAC (Role-Based Access Control) / Views.* Data exists but is invisible to certain queries.
      *   *Audit Logs -> Transaction Logs.* Who changed the schema? Often only DBAs know.

  4.  **Developing the Residue Report (The Critical Analysis):**
      *   *Clean Maps:* Schema constraints, data types, retention policies, access control. These are literal technical equivalents.
      *   *Fudged Maps:* "Intent." A database doesn't *mean* to exclude; it just enforces logic. Historians talk about *social* intent.
      *   *No Counterpart:* *Context/Meaning.* A DB stores bits; an archive stores *evidence*. The "why" behind the data entry is lost. The *social consequence* of the exclusion. The *physicality* of the archive (decay, loss) vs. bit rot.

  5.  **Addressing the Core Question (Power):**
      *   Is it just dramatic language for technical choices?
      *   *Answer:* No. Technical choices *are* the mechanism of power, but the DB vocabulary misses the *feedback loop*. In a DB, a missing column stops data entry. In society, the missing column stops *recognition*. The DB vocabulary treats the schema as a given; the philosopher questions the *authority* that defined the schema.
      *   *Key Distinction:* Ontology vs. Implementation. DBs implement an ontology; philosophers question who built that ontology and who suffered because of it.

  6.  **Refining the Output (Iterative Polishing):**
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm dismissing the DB engineer's view. Validate their intuition. Use precise terms (DDL, DML, ACLs).
      *   *Emphasis:* Highlight the difference between *technical constraint* and *social erasure*.
      *   *Structure:*
          1.  The Translation (The "Query").
          2.  The Residue Report (Diff check).
          3.  The Verdict (Power analysis).

  7.  **Final Review against Constraints:**
