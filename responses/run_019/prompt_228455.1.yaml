answer: |-
  ### The Verdict
  **She will savage it.** She will likely call it "Unfair" and group it with the "Long-lost twin" incident.

  ### The Rule She Is Actually Running
  Of the three candidate rules you proposed, the one that fits her track record most robustly is:
  **"No new information at the reveal, only reinterpretation."** (Rule B)

  Here is why Rule B fits better than "Deducibility" (Rule A) or "Clue + No Contradiction" (Rule C):

  1.  **The "Fight" Case (Fair):** This is the tie-breaker. A recontextualized fight doesn't necessarily mean the reader could *deduce* the truth beforehand (Rule A), but it does mean the reader possessed all the visual data and simply interpreted it wrong. This aligns perfectly with Rule B (reinterpretation of existing data).
  2.  **The "Twin" Case (Unfair):** A twin reveal often fails Rule A (no clues), but it specifically fails Rule B because the *existence* of the twin is new information introduced at the climax.
  3.  **The "Liar" Case (Unfair):** While this violates Rule C (contradiction), it also violates Rule B. If the narrator lies on page 10, the "information" the reader received on page 10 is retroactively invalidated, effectively functioning as if the *true* information was withheld until the lie was exposed.

  **Why your manuscript fails Rule B:**
  The birth certificate is **new evidentiary material**. In the "Killer" case (Fair), the clues were *in the text* (buried, but present). In your manuscript, the definitive proof (the certificate) is withheld until the reveal. This makes it structurally identical to the "Long-lost twin" scenario, where the existence of the twin is new information. The single "mom" joke is insufficient to offset the introduction of a new physical proof object.

  ### If The Rules Disagree: Which One Wins?
  There is a potential conflict between **Rule A (Deducibility)** and **Rule B (No New Info)** regarding your manuscript.
  *   **Rule A** *might* pass it: A hyper-observant reader *could* theoretically deduce the relationship from the "mom" joke.
  *   **Rule B** *definitely* fails it: The birth certificate is new info.

  **She will follow Rule B.**
  **Why?** Because of the "Fight" verdict. In the fight scenario, the fairness didn't come from the reader *solving* the puzzle early; it came from the reader feeling they weren't *cheated* by new data. She values **narrative integrity** (the text I read contains the truth) over **puzzle solvability** (I could have guessed it). The introduction of a document the reader never saw breaks the contract that "everything you need is in the text."

  ### The Test Case to Distinguish the Rules
  To definitively prove whether she prioritizes **Deducibility (Rule A)** or **No New Info (Rule B)**, ask her about this specific scenario:

  > **"The detective gathers all the clues throughout the book (fingerprints, motive, opportunity), allowing the reader to logically deduce the killer. However, in the final chapter, the detective confirms the guilt by producing a signed confession letter found in the killer's safe that the reader has never seen before."**

  *   **If she says "Fair":** She prioritizes **Rule A (Deducibility)**. As long as the reader *could* have solved it, she doesn't mind if the character uses new evidence to confirm it. (Your manuscript might survive).
  *   **If she says "Unfair":** She prioritizes **Rule B (No New Info)**. Even if the reader could solve it, introducing a new physical object (the letter) to seal the deal is cheating. (Your manuscript is doomed).

  **My prediction:** She will call this test case **Unfair**. She views the "solution" as needing to be constructed entirely from the bricks she was given, not handed a new brick at the finish line.

  ### Recommendation
  To save the manuscript before sending it:
  1.  **Show the Certificate:** Foreshadow the birth certificate earlier. Maybe the character tries to find it in Act 1 and can't, or sees a glimpse of it and misreads the date.
  2.  **Remove the Label:** If the narration refers to her as "sister" objectively, change it to how the POV character *perceives* her (e.g., "The woman everyone called her sister"). This avoids the "Unreliable Narrator/Liar" trap (Case 5).
  3.  **Add Clues:** One joke is "Twin" territory. Three buried clues is "Killer" territory. You need two more subtle indicators of the true relationship before the end.
