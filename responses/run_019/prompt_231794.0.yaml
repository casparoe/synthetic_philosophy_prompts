answer: |-
  Hi there, I have been thinking about your upcoming guest and that Arendt passage she relies on, and I agree completely that you need to pin her down on the text rather than letting her drift into generalities about power and imagination. The passage is dense, and it invites a lot of hand-waving about the human condition, so your best strategy is to treat the specific claims as philosophical premises that need to hold up under scrutiny rather than poetic insights. I have drafted a line of questioning below that flows as a conversation but targets the four weakest points in her argument, including specific follow-ups designed to block the escape route where she claims she is only describing the origin of lying rather than justifying it.

  You should start by challenging the necessity of the mental removal she describes. Arendt claims that in order to make room for action, we must mentally remove ourselves from where we are physically located and imagine things might be different, but you should ask her whether this phenomenological description actually holds up for all political action. Press her on whether habitual, unreflective, or reactive action counts as political action in her view, because if a politician acts on instinct or rigid ideology without imagining alternatives, have they ceased to act politically according to this definition. If she responds by saying that unreflective action is a degraded form of politics or merely behavior, you need to follow up by asking whether this means that the most effective liars are actually the most political actors because they are the most imaginative, and if so, whether her framework inadvertently privileges the liar over the truth-teller who is constrained by reality. This prevents her from saying she is just making a genealogical point about capacities, because it forces her to admit that her ontology of action ranks types of actors in a way that has normative consequences for how we value truthfulness.

  Once you have established that tension, move to the phrase where she says lying and acting owe their existence to the same source. You need to ask her to specify whether this is a conceptual connection, a causal-psychological claim, or merely an analogy, because the passage itself does not decide between those readings. If she argues it is a conceptual connection, ask her whether conceptual identity implies moral equivalence, or if she is willing to grant that two things can share a source yet be morally opposed like a scalpel and a dagger. She will likely try to say she is only tracing a genealogy of capacities to show why lying is inevitable, so your follow-up must be to ask whether identifying inevitability functions as a form of normalization in political theory. Push her on whether saying lying is structurally necessary for action removes the ground for blaming specific lies, because if the capacity is constitutive of action itself, then criticizing the lie looks like criticizing the possibility of politics, and you want to know if she accepts that criticism becomes incoherent on her view.

  The third area to press is her treatment of facts, specifically the idea that things as they were before must be removed or destroyed for action to occur. Ask her whether this implies that factual truth is fragile and needs testimony to be secured, and if so, does that make truth a political achievement rather than something we discover. You want to force her to clarify if truth is something that exists prior to politics or something that is produced within it. If she takes the line that truth is a political achievement secured by institutions, your follow-up should be to ask whether this makes truth contingent on power, because if the stability of facts depends on political action, then the liar who successfully changes the facts has arguably created a new truth. This traps her between admitting that truth is power-dependent, which slides into relativism, or conceding that there is a pre-political reality she is ignoring, which undermines her reading of the Arendt passage.

  Finally, you need to address the political payoff of her argument directly. If moral outrage alone won't make the lie disappear because lying is rooted in the capacity for action, ask her what is left of the criticism of lying and whether her view slides into cynicism about politics. She will likely argue that we can still criticize lies based on their consequences or their damage to the public realm, so you must follow up by asking whether consequences are enough if the lie is successful. Press her on whether a successful lie that stabilizes the public realm is preferable to a truth that destabilizes it, because if the capacity to lie is constitutive of action, then the success of the lie might be evidence of political vitality rather than decay. This prevents her from retreating to the safe ground of saying she is only analyzing structures, because it forces her to take a stand on whether a politics built on successful deception is still a politics we should recognize as legitimate.

  I think these lines of inquiry will keep her from paraphrasing the passage too loosely and force her to defend the philosophical commitments underneath it. Let me know if you want to tweak the tone of any of these, but I think keeping them this direct is necessary given how slippery neo-Arendtian defenses of lying can be. Good luck with the recording.
