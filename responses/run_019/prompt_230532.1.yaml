answer: |-
  # Internal Guide: Technology Retention vs. Migration Decision Procedure

  **To:** Engineering Leadership, Staff Engineers, Architecture Review Board
  **From:** Staff Engineering (Strategy & Systems)
  **Subject:** A Rigorous Procedure for "Stay vs. Switch" Decisions

  ## 1. Executive Summary
  We frequently face decisions on whether to retain an existing technology or migrate to a new one. Currently, these debates polarize into two unhelpful camps:
  1.  **The Sunk Cost Argument:** "We've spent years on this; we can't stop now." (Often irrational).
  2.  **The Clean Slate Argument:** "That's the sunk cost fallacy; we must switch to the rational optimum immediately." (Often ignores reality).

  This guide provides a decision procedure grounded in the economics of **Path Dependence**. It distinguishes between money already spent (irrelevant), the one-time cost of moving (relevant), and self-reinforcing mechanisms that make the current path increasingly valuable or increasingly costly over time (critical).

  **Goal:** Enable a senior engineer to determine if a technology is *locked in* (path dependent) or merely *expensive to leave* (high switching cost), and whether that lock-in is a trap or a feature.
  **Timebox:** 60 minutes per decision.

  ---

  ## 2. Conceptual Grounding (Read Once)
  To use this procedure, you must distinguish three concepts. Do not use them interchangeably.

  | Term | Plain English Definition | Engineering Example | Relevance to Decision |
  | :--- | :--- | :--- | :--- |
  | **Sunk Cost** | Resources already consumed that cannot be recovered. | "We spent 3 years building this." | **Ignore.** Past effort does not change future value. |
  | **Switching Cost** | A one-time penalty paid to change state. | Data migration, rewriting integrations, training. | **Count.** Treat as a line-item cost in the future budget. |
  | **Reinforcing Mechanism** (Increasing Returns) | A process where using the system makes it relatively better (or harder to leave) over time. | Team familiarity grows; ecosystem libraries expand; data gravity increases. | **Critical.** This creates *Path Dependence*. It means the cost of switching *increases the longer you wait*. |

  **The Core Insight:** A rational decision ignores sunk costs. However, if **Reinforcing Mechanisms** are active, the *future* cost of switching is not static—it is rising. Ignoring this is as irrational as respecting sunk costs.

  ---

  ## 3. The Decision Procedure

  ### Step 1: The Sunk Cost Filter (5 Minutes)
  *Goal: Remove emotional attachment to past effort.*

  **Ask:** "If we had acquired this system yesterday via merger, with no development history, would we keep it?"
  *   **If Yes:** Proceed to Step 2.
  *   **If No:** You are likely arguing from Sunk Cost. You must justify retention based *only* on future utility, not past effort.
  *   **Output:** A clear statement: "We are evaluating this based on future payoff, not past investment."

  ### Step 2: The Switching Cost Inventory (15 Minutes)
  *Goal: Quantify the one-time barrier to exit.*

  List every one-time cost required to move to the alternative. Do not include ongoing maintenance costs here.
  *   **Data Migration:** Cost to move/transform state.
  *   **Integration Surfaces:** APIs, CI/CD pipelines, monitoring hooks to rewrite.
  *   **Parallel Run:** Cost of running both systems during transition.
  *   **Downtime/Risk:** Estimated revenue loss or reliability dip during cutover.

  **Sufficient Answer:** A dollar estimate or "Engineer-Months" count.
  *   *Hand-off Point:* If the Switching Cost exceeds the *total remaining budget* for this system's lifecycle, **STOP. Stay.** This is not path dependence; this is simple bankruptcy avoidance.

  ### Step 3: The Reinforcing Mechanism Audit (20 Minutes)
  *Goal: Identify true Path Dependence.*

  Determine if the system exhibits **Increasing Returns** ( Momentum) or **Negative Reinforcement** (Decay).

  **Checklist:**
  1.  **Human Capital:** Does team proficiency grow faster than hiring new experts for the alternative? (e.g., Internal tribal knowledge vs. Public hiring market).
  2.  **Ecosystem Gravity:** Are new libraries/tools being built for this system or the alternative?
  3.  **Data/Integration Gravity:** Does adding more data/users make the current system significantly more efficient or the alternative significantly harder to integrate?
  4.  **Vendor/Contract Lock-in:** Do penalties or technical barriers increase the longer we stay?

  **Evaluation:**
  *   **Positive Reinforcement (Stay Signal):** "The more we use it, the cheaper it is to keep using it compared to switching." (e.g., Deep institutional memory, stable contracts).
  *   **Negative Reinforcement (Go Signal):** "The more we use it, the harder it becomes to find support/talent, increasing future risk." (e.g., Dying language, vendor deprecation).
  *   **Neutral:** Costs are static. This is ordinary Cost-Benefit Analysis (CBA).

  **Output:** Classify the system as **Reinforcing (Locked-In)**, **Decaying (Trapped)**, or **Static**.

  ### Step 4: The Future Payoff Comparison (10 Minutes)
  *Goal: Compare Future(State A) vs. Future(State B).*

  Calculate the *ongoing* annual cost of ownership for both options over a 3-year horizon.
  *   **Option A (Stay):** Maintenance + Risk of Decay (from Step 3).
  *   **Option B (Switch):** Maintenance + Amortized Switching Cost (from Step 2).

  **Crucial Adjustment:** If Step 3 identified **Positive Reinforcement** for Option A, you must apply a "Friction Multiplier" to Option B. Switching isn't just paying the cost once; it's fighting the momentum of the current system. If Step 3 identified **Negative Reinforcement** for Option A, apply a "Risk Premium" to Option A.

  ### Step 5: The Strategic Override (10 Minutes)
  *Goal: Acknowledge Irreducible Value Judgments.*

  The math above cannot decide everything. Leadership must explicitly vote on these three values. There is no "correct" answer, only a chosen stance.

  1.  **Risk Tolerance:** Do we prefer the known devil (Current System) or the unknown angel (New System)?
  2.  **Optionality:** Does staying limit our ability to pivot the business later? (e.g., Staying on a monolith limits M&A activity).
  3.  **Pride vs. Utility:** Are we keeping this because it works, or because we built it? (Refer back to Step 1).

  **Final Verdict:**
  *   **Stay:** If Switching Costs > 3yr Payoff OR Reinforcing Mechanisms favor Current.
  *   **Switch:** If Negative Reinforcement is active OR 3yr Payoff of New > Current + Switching.
  *   **Defer:** If Uncertainty is high. Set a review date. (Note: Deferring active Negative Reinforcement is usually a mistake).

  ---

  ## 4. Case Studies

  ### Case 1: The Ten-Year-Old Monolith
  **Context:** Core revenue system. Senior engineers know it well. Migration estimated at 12 engineer-months. External ecosystem (libraries, hiring) has moved to microservices.
  **Argument for Stay:** "We know it, it works, migration is expensive."
  **Argument for Switch:** "We can't hire juniors for this. We are stuck."

  **Procedure Output:**
  1.  **Sunk Cost Filter:** Pass. (If acquired yesterday, would we run a 10-year-old monolith? Probably not).
  2.  **Switching Cost:** High (12 engineer-months + risk).
  3.  **Reinforcing Audit:** **Negative Reinforcement Detected.**
      *   *Human Capital:* Internal familiarity is high (Positive), but external hiring market is shrinking (Negative). As seniors leave, the cost to maintain skyrockets.
      *   *Ecosystem:* Library support is decaying. Security patches are slower.
  4.  **Future Payoff:**
      *   *Stay:* Low maintenance now, exponentially rising risk/cost in Years 2-3 as seniors retire.
      *   *Switch:* High upfront cost, stable/declining cost thereafter.
  5.  **Strategic Override:** The business plans to acquire smaller startups in 18 months. A monolith reduces M&A integration speed.

  **Verdict: SWITCH.**
  **Reasoning:** While Switching Costs are high, the **Negative Reinforcement** (dying ecosystem/talent pool) means the cost of staying is not static; it is accelerating. The "familiarity" asset is depreciating rapidly. The procedure overrides the instinct to "keep what works" because the *future* reliability is compromised by external path dependence.

  ### Case 2: The Homegrown Message Queue Wrapper
  **Context:** A custom wrapper around a standard MQ, used by 40 services. Includes retry logic, dead-letter handling, and specific ordering guarantees baked into the code. Managed service (e.g., SQS/PubSub) would reduce OpEx by $200k/year. Migration cost: 6 engineer-months.
  **Argument for Stay:** "It's ours, we control it."
  **Argument for Switch:** "Undifferentiated heavy lifting. Buy, don't build."

  **Procedure Output:**
  1.  **Sunk Cost Filter:** Pass. (Ignoring the 3 years spent building it).
  2.  **Switching Cost:** 6 engineer-months *plus* hidden cost.
  3.  **Reinforcing Audit:** **Positive Reinforcement (Hidden).**
      *   *Integration:* Business logic is entangled with the wrapper's specific failure modes. Runbooks are written for *this* wrapper's alerts, not generic MQ alerts.
      *   *Institutional Memory:* On-call engineers know exactly how *this* wrapper fails. A managed service fails differently.
  4.  **Future Payoff:**
      *   *Stay:* $0 OpEx savings. Stability is high.
      *   *Switch:* $200k/year savings. *However*, the "Switching Cost" is underestimated. Moving to a managed service requires rewriting the business logic that depends on the wrapper's quirks. Real cost is likely 18 engineer-months, not 6.
  5.  **Strategic Override:** Reliability is the #1 company OKR this year.

  **Verdict: STAY.**
  **Reasoning:** **This is the unpopular result.** Standard engineering dogma says "never build your own queue." However, the procedure identifies that the **Switching Cost** includes rewriting *product logic*, not just infrastructure. The **Reinforcing Mechanism** is the institutional knowledge of failure modes. The $200k savings does not justify the risk of altering core message handling logic during a reliability-focused year. The lock-in is protective, not pathological.

  ### Case 3: Post-Merger Identity System (IAM)
  **Context:** Company A (us) has a modern, simple IAM. Company B (acquired) has a legacy IAM with 10x more users and policies.
  **Argument for Stay (Us):** "Ours is better tech."
  **Argument for Switch (Them):** "Migrating 10x users is too risky/expensive."

  **Procedure Output:**
  1.  **Sunk Cost Filter:** Pass.
  2.  **Switching Cost:**
      *   *Migrate Them to Us:* High engineering effort, high user disruption.
      *   *Migrate Us to Them:* Low engineering effort, low user disruption (mostly).
  3.  **Reinforcing Audit:** **Negative Reinforcement (Legacy).**
      *   *Complexity:* The legacy system has accumulated policies that conflict. Adding new features requires navigating 10 years of debt.
      *   *Vendor Support:* Legacy system is on a version nearing End-of-Life.
  4.  **Future Payoff:**
      *   *Adopt Legacy:* Low switching cost now, but high ongoing maintenance and security risk.
      *   *Migrate to Modern:* High switching cost now, but enables automated compliance and faster onboarding (Strategic Optionality).
  5.  **Strategic Override:** Security and Compliance are the primary drivers for the merger synergy.

  **Verdict: MIGRATE THEM TO US.**
  **Reasoning:** Ordinary Cost-Benefit Analysis suggests adopting the Legacy system (lower switching cost). However, the **Reinforcing Audit** reveals the Legacy system has **Negative Reinforcement** (complexity debt). Adopting it locks the combined entity into a decaying security posture. The procedure mandates paying the switching cost now to avoid the "Lock-in Trap" of the legacy system.

  ---

  ## 5. Limitations & Responsibilities

  This procedure is a tool for clarity, not a substitute for leadership.

  **1. Theory Describes, It Does Not Prescribe**
  Path dependence theory explains *why* you are stuck. It does not tell you if being stuck is *good*.
  *   **Scenario:** The procedure says "You are Locked In."
  *   **Decision:** You must decide: "Is this lock-in acceptable stability?" or "Is this lock-in unacceptable risk?"
  *   **Action:** If acceptable, stop debating. Invest in mitigating the risks of lock-in (e.g., documentation, abstraction layers). If unacceptable, you must authorize a "Strategic Loss"—spending money specifically to break the lock-in, knowing the ROI is negative in the short term.

  **2. The "Point of No Return" is Fuzzy**
  Step 3 (Reinforcing Audit) requires judgment. Engineers may disagree on whether a hiring market is "dying" or just "niche."
  *   **Responsibility:** When the team disagrees on the Audit, do not average the numbers. Escalate the *uncertainty*. A decision made under false certainty is more dangerous than a decision made under acknowledged risk.

  **3. Path Dependence Can Be Manufactured**
  Sometimes we *want* lock-in (e.g., proprietary data formats to retain customers).
  *   **Responsibility:** Be honest. If the goal is vendor lock-in for business leverage, state it. Do not disguise a business strategy as a technical necessity.

  **4. When the Output is "Stay"**
  If the procedure recommends staying on a technology engineers dislike (like Case 2):
  *   **Action:** Leadership must explicitly validate the "Stay" decision. Do not let the team drift into "Shadow IT" or gradual rewriting. If we choose lock-in, we must maintain it first-class.

  **5. When the Output is "Switch"**
  If the procedure recommends switching despite high costs (like Case 1 or 3):
  *   **Action:** Acknowledge this is a capital investment, not an optimization. Fund it as a project, not as "tax" on the team's velocity.

  ---

  **Final Note:**
  Rationality is not about ignoring history. It is about understanding how history has shaped the costs of the future. Use this procedure to ensure we are not slaves to our past, but not careless of it either.
