prompt: |-
  I'm a staff software engineer with no formal background in philosophy, and I've been asked to write an internal guide for how our engineering organization should make a specific, recurring kind of decision: whether to stay on a technology we are already using, or pay to move to something else. We make this call under pressure — for languages, frameworks, databases, build and CI systems, internal services, data formats, vendors — and right now the two available voices are "that's just the sunk cost fallacy, be rational and switch" and "we're too deep in to change." I've picked up terms like path dependence, lock-in, increasing returns, positive feedback, and contingency from blog posts, but I don't know which of those are rigorous distinctions or how to use them.

  Please act as a professional philosopher and economist of path dependence: someone who can distinguish, for instance, a true self-reinforcing process from a one-time switching cost, and a factual claim about how an outcome came to be from a normative claim about whether we should now escape it. Think carefully, and begin by brainstorming the main distinctions in the field and mapping each onto concrete engineering resources — cumulative team familiarity, tooling written against the old system, runbooks and institutional memory, the hiring market, deprecation risk, contract lock-in, integration surfaces, data migration. Flag the distinctions that have no real engineering counterpart and should be left out, and flag the engineering considerations that are doing the theorist's work under another name.

  The deliverable is a reusable decision procedure, not a one-off recommendation. A senior engineer with no philosophy training should be able to run it in under an hour, so it cannot lean on undefined jargon: any term like increasing returns must be glossed in plain language or dropped. I want it to include, in writing: the questions to ask in order; what counts as a sufficient answer to each; the precise points where the procedure says this consideration is not path dependence and should be handed back to ordinary cost-benefit analysis; the points where it says this is genuinely self-reinforcing and should weigh accordingly; and the steps that are irreducible value judgments — about risk, optionality, and which downstream costs count — that no procedure can make for us. The procedure should enforce the distinction I half-understand from the theory: a sunk cost is gone, while path dependence is about whether the past has changed the future payoff landscape; don't let the guide collapse back into "we spent a lot, so we should keep going."

  Then apply the procedure to three cases, step by step, showing what it would actually output:

  1. A ten-year-old monolith that still works and that most senior engineers know well, but whose tooling, hiring market, and library ecosystem have moved toward smaller services. The main argument for staying is the accumulated familiarity and the cost of a year-long migration.

  2. A homegrown wrapper around our message queue that is hooked into dozens of services, with on-call runbooks and failure modes written around its quirks. A managed queue service would lower per-year operating cost, but the wrapper's integrations and institutional knowledge would have to be rebuilt.

  3. After a merger, we must pick one of two identity and access systems. One is newer and operationally simpler; the other is older but has many more users, integrations, and access policies already attached to it, so the switching burden falls mostly on the larger legacy organization.

  Make at least one of these come out in a way our engineers will not like — for example, the procedure recommends staying with something we were planning to replace, or replacing something people are proud of — to demonstrate that the procedure can override instinct.

  Finish with a short section on what the procedure cannot do: where the theory describes a mechanism but gives no verdict about whether we should stay, and how a team should act differently when the output is "you are locked in, and that is acceptable" versus "you are locked in, and that is costly." I am not looking for a bibliography; I need the concepts made usable without distorting them.
reasoning: |-
  Here's a thinking process that leads to the suggested guide:

  1.  **Analyze the Request:**
      *   **User:** Staff Software Engineer, no philosophy background.
      *   **Task:** Write an internal guide for deciding whether to stay on a technology or migrate (Stay vs. Switch).
      *   **Problem:** Current debate is polarized ("Sunk Cost Fallacy" vs. "Too Deep to Change"). Need nuance based on path dependence theory.
      *   **Role:** Professional Philosopher/Economist of Path Dependence.
      *   **Requirements:**
          *   Distinguish rigorous concepts (self-reinforcing processes vs. one-time switching costs).
          *   Distinguish factual claims (how we got here) vs. normative claims (what we should do).
          *   Deliverable: A reusable decision procedure (checklist/flow) usable by a senior engineer in <1 hour.
          *   Language: Plain English (gloss jargon like "increasing returns").
          *   Content: Questions in order, sufficient answers, hand-off points to ordinary cost-benefit analysis, identification of true self-reinforcing mechanisms, identification of irreducible value judgments.
          *   Application: Apply to 3 specific cases (Monolith, Homegrown MQ Wrapper, Merger IAM).
          *   Constraint: At least one case must yield a counter-intuitive/unpopular result.
          *   Ending: Limitations of the procedure (where theory describes mechanism but gives no verdict).

  2.  **Deconstruct Path Dependence Theory for Engineering:**
      *   *Core Concept:* Path dependence isn't just "history matters." It's specifically about *non-ergodicity* (small events early on lock in a specific outcome that is hard to reverse) and *increasing returns* (the more you use it, the better/cheaper it gets relative to alternatives).
      *   *Sunk Cost vs. Path Dependence:* Sunk cost is money/time already spent (irrelevant to future decision). Path dependence is about the *future* cost structure being altered by the past.
      *   *Key Distinctions:*
          *   **Switching Costs (One-time):** Fixed cost to move. Not path dependence per se, just a barrier.
          *   **Increasing Returns (Self-Reinforcing):** The value of the current path grows as more people use it (network effects, learning curves, ecosystem growth). This *is* path dependence.
          *   **Contingency:** How we got here was accidental/historical, not necessarily optimal.
          *   **Lock-in:** The state where switching costs + loss of increasing returns makes moving irrational even if the alternative is technically superior.
      *   *Engineering Mappings:*
          *   *Team Familiarity:* Increasing returns (human capital).
          *   *Tooling/Integrations:* Switching costs (asset specificity).
          *   *Hiring Market:* Network effects/Increasing returns (ecosystem).
          *   *Data Migration:* Switching costs.
          *   *Vendor Contracts:* Institutional lock-in.
      *   *False Friends:* "We spent a lot" (Sunk Cost). "It's old" (Age isn't a mechanism). "It's buggy" (Quality issue, not path dependence).

  3.  **Drafting the Decision Procedure (The "Guide"):**
      *   *Goal:* Filter out sunk costs, identify true switching costs, identify self-reinforcing mechanisms, then weigh values.
      *   *Structure:*
          1.  **Sanity Check (Sunk Cost Filter):** Remove past spend from the equation.
          2.  **Switching Cost Inventory:** Quantify the one-time pain.
          3.  **Increasing Returns Audit:** Is the current system getting *relatively* better/harder to leave over time?
          4.  **Future Payoff Comparison:** Compare Future(State A) vs. Future(State B).
          5.  **Value Judgment:** Risk tolerance, strategic optionality.
      *   *Tone:* Professional, precise, actionable. Avoid academic fluff.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Monolith):* High familiarity (Increasing Returns), High Migration Cost (Switching Cost), Dying Ecosystem (Negative Increasing Returns for future). *Likely Outcome:* Migrate, but slowly. Or maybe Stay? Let's make it counter-intuitive. If the hiring market is dead, that's a huge future cost. Let's argue for Migration despite the pain, *unless* the business is in maintenance mode. Let's make the procedure recommend *Staying* longer than engineers want because the "Switching Cost" is actually a "Survival Risk." No, let's make it recommend *Leaving* a beloved system because the "Increasing Returns" have turned negative (ecosystem decay).
      *   *Case 2 (Homegrown MQ):* High integration (Switching Cost), High institutional knowledge (Increasing Returns). Managed service is cheaper opex. *Counter-intuitive outcome:* Keep the homegrown junk. Why? Because the "Switching Cost" includes rewriting business logic hidden in the wrapper quirks. The procedure should highlight that the "dumb pipe" assumption is false.
      *   *Case 3 (Merger IAM):* Two systems. One newer/simpler, one older/larger. *Standard outcome:* Pick the larger one to minimize switching cost. *Counter-intuitive outcome:* Pick the newer one. Why? Because the older one has *negative* increasing returns (technical debt accumulation) and the "Switching Cost" is actually an investment in standardizing.
      *   *Selection:* Let's make Case 2 (Homegrown MQ) the unpopular one. Engineers love managed services. The procedure might say "Stay on Homegrown" because the *business logic* is entangled with the *queue quirks*, making the switching cost effectively a rewrite of the product, not just infra.

  5.  **Refining the Theory/Concepts:**
      *   Need to ensure "Increasing Returns" is explained as "The more we use it, the cheaper/better it gets compared to alternatives."
      *   Need to ensure "Sunk Cost" is clearly separated.
      *   Need to highlight where the procedure stops and human judgment begins (Risk/Strategy).

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Set the stage. Acknowledge the two bad voices. Define the goal.
      *   *Conceptual Grounding:* Briefly explain Sunk Cost vs. Switching Cost vs. Increasing Returns.
      *   *The Procedure:* Step-by-step.
          *   Step 1: The Sunk Cost Filter.
          *   Step 2: The Switching Cost Inventory (One-time).
          *   Step 3: The Increasing Returns Audit (Ongoing/Reinforcing).
          *   Step 4: The Future Landscape (Payoff).
          *   Step 5: The Strategic Override (Values).
      *   *Case Studies:* Apply the steps rigorously.
      *   *Limitations:* What the math can't tell you.

  7.  **Review against Constraints:**
      *   *Under 1 hour?* Yes, if the checklist is tight.
      *   *Plain language?* Replace "non-ergodic" with "history locks the door." Replace "increasing returns" with "momentum."
      *   *Counter-intuitive result?* Yes, Case 2 will recommend keeping the homegrown tool.
      *   *Distinction between factual and normative?* Explicitly marked in Step 5.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is "Increasing Returns" too economic?
      *   *Fix:* Call it "Momentum" or "Reinforcement" in the guide, but define it as "Increasing Returns" in the theory section for accuracy. Let's stick to "Reinforcing Mechanisms" for the guide to be clearer.
      *   *Critique:* Make sure I don't just say "calculate costs." That's standard CBA. I need to highlight where path dependence *changes* the calculation (i.e., costs aren't static).
      *   *Refinement:* Emphasize that in path dependence, the cost of switching *increases over time* if you wait. That's the crucial insight.

  9.  **Final Polish:** Check tone. Ensure it sounds like a Staff Engineer wrote it with Philosopher guidance. (Authoritative, structured, nuanced).

  *(Self-Correction on Case 2)*: If I recommend keeping the homegrown MQ, I need to be sure the logic holds. Homegrown wrappers usually *should* be killed. To make the procedure recommend keeping it, the "institutional memory" and "runbooks" must represent a *hidden business logic* that a managed service doesn't support without rewriting the application layer. The "Switching Cost" isn't just moving data; it's re-engineering product behavior. That makes it a valid path dependence lock-in where the lock-in is protective.

  *(Self-Correction on Case 1)*: The Monolith. If the ecosystem is dying, that's *negative* reinforcement. The procedure should flag this. The "Stay" argument is only valid if the business is cash-cow/maintenance. If growth is needed, the "Hiring Market" factor (external increasing returns for the *new* tech) outweighs internal familiarity. I'll make this one a "Migrate" recommendation to balance the "Stay" in Case 2.

  *(Self-Correction on Case 3)*: Merger. Usually, you pick the bigger one. But if the bigger one is technically bankrupt, you pick the smaller one. I'll make this one a "Pick the Smaller/Newer" recommendation to show strategic optionality overrides short-term switching costs.

  Wait, the prompt asks for *at least one* unpopular result. I'll make Case 2 (The Homegrown MQ) the one where we recommend *keeping* the homegrown solution. Engineers hate homegrown infra. This will demonstrate the procedure protects against "Shiny Object Syndrome" when the lock-in is actually valuable stability.

  10. **Finalizing the Structure:**
      *   Title.
      *   Executive Summary (The "Why").
      *   Part 1: Concepts (Sunk Cost vs. Switching Cost vs. Reinforcement).
      *   Part 2: The Decision Procedure (The Checklist).
      *   Part 3: Case Studies.
      *   Part 4: Limitations & Responsibilities.

