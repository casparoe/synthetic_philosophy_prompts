answer: |-
  ### Part 1: The Branching Space of Voting Motivation

  Before administering the diagnostic, it is necessary to map the logical space of possible justifications for voting. The tree below categorizes theories based on the *source* of the utility derived from voting and the *scope* of the welfare considered.

  **Root:** Why does the agent vote?

  *   **Branch A: Instrumental (Value lies in the Outcome)**
      *   *Node A1: Whose welfare counts?*
          *   **Self-Only:** The agent cares only about their personal payoff from the policy win.
              *   *Node A1-i: Probability Assessment.*
                  *   **Realistic ($P \approx 0$):** **The Downsian Skeptic.** (Prediction: Do not vote).
                  *   **Inflated ($P > 0$):** **The Optimistic Statistician.** (Prediction: Vote based on exaggerated pivotality).
          *   **Everyone (Altruistic):** The agent sums the welfare of all affected citizens ($N \times B$).
              *   *Node A1-ii:* **The Utilitarian Calculator.** (Prediction: Vote if $N \times B \times P > C$, even if $P$ is tiny).
  *   **Branch B: Non-Instrumental (Value lies in the Act)**
      *   *Node B1: Nature of the Satisfaction.*
          *   **Normative (Obligation):** Utility comes from satisfying a moral rule or avoiding guilt.
              *   *Node B1-i:* **The Reluctant Citizen (Civic Duty).** (Prediction: Vote even if costly/unpleasant).
          *   **Expressive (Identity):** Utility comes from affirming one's identity or signaling allegiance.
              *   *Node B1-ii:* **The Identity Signaler.** (Prediction: Vote to "stand for" something, regardless of efficacy).
          *   **Consumption (Enjoyment):** Utility comes from the process itself (socializing, atmosphere).
              *   *Node B1-iii:* **The Political Fan.** (Prediction: Vote only if the experience is enjoyable).

  ***

  ### Part 2: Diagnostic Quiz
  **Instructions:** For each scenario, select the option that best describes what you would *actually* do or believe. Do not select the answer you think is "correct" for a citizen; select the one that matches your intuition.

  **1. The Safe Seat**
  In your district, Candidate A is leading Candidate B by 45 percentage points in reliable polls. The election is next week.
  *   A. I do not vote. The result is predetermined, and my time is better spent elsewhere.
  *   B. I vote. Even if the result is fixed, the margin of victory matters for future policy.
  *   C. I vote. It doesn't matter who wins; I just need to cast my ballot.

  **2. The Secret Ballot**
  You are guaranteed that your vote is truly anonymous. No government record, no social pressure, no one will ever know if you voted or how you voted.
  *   A. I am less likely to vote. Without social recognition or accountability, the point is lost.
  *   B. I vote exactly the same. My relationship is with the system, not the audience.
  *   C. I vote exactly the same. I know what I stand for, regardless of who watches.

  **3. The Advisory Referendum**
  A local referendum is held to gauge public opinion. The result has no legal binding power and cannot change any laws.
  *   A. I do not vote. A vote that cannot change a law is a waste of effort.
  *   B. I vote. It is a way to register my opinion on the record.
  *   C. I vote. It feels good to participate in the community ritual.

  **4. The Costly Favor**
  To vote, you must pay a $15 administrative fee (refundable only if the election is contested, which is rare). The candidate you support will lower your taxes by $10 if they win.
  *   A. I do not vote. The cost exceeds my personal benefit.
  *   B. I vote. If everyone like me votes, the collective benefit outweighs the fee.
  *   C. I vote. Paying the fee proves how much I care about this issue.

  **5. The Altruist's Dilemma**
  Your vote costs you $50 in lost wages. It will not change the election outcome. However, if your preferred candidate wins, 10,000 strangers will each receive a $1 benefit.
  *   A. I keep my $50. My sacrifice won't change the outcome, so it helps no one.
  *   B. I vote. The total social benefit ($10,000) vastly outweighs my small cost.
  *   C. I vote. I would feel guilty benefiting from others' voting without contributing myself.

  **6. The Rainy Day**
  It is pouring rain, the line at the polling station is one hour long, and you have a ticket to a movie you've wanted to see for months at the same time.
  *   A. I go to the movie. Voting is a choice, and today the cost is too high.
  *   B. I stand in the rain. Voting is an obligation that supersedes leisure.
  *   C. I stand in the rain. The drama of the long line makes me feel part of history.

  **7. The Pivotal Probability**
  A mathematician shows you a proof that your chance of breaking a tie in this election is 1 in 50 million.
  *   A. I accept this and abstain. The odds are effectively zero.
  *   B. I accept the odds but vote anyway. Someone has to win, and it could be me.
  *   C. I reject the math. If enough people think like me, the odds change.

  **8. The Efficient Donation**
  You have 2 hours free. You can spend them voting (which takes 2 hours) or working a job and donating the earnings to your preferred candidate's campaign.
  *   A. I donate the money. It helps the candidate win more than my single ballot.
  *   B. I vote. My physical presence at the booth matters more than money.
  *   C. I vote. The act of voting is distinct from buying influence; it's about citizenship.

  **9. The Hypocritical Candidate**
  Your preferred candidate aligns with your values but is personally corrupt. The opponent is honest but supports policies you hate.
  *   A. I vote for the corrupt candidate. Policy outcomes are what affect my life.
  *   B. I abstain. Voting for a corrupt person stains my moral record.
  *   C. I vote for the honest opponent. My vote expresses my commitment to integrity.

  **10. The Small Election**
  A homeowners' association election where there are only 200 voters. Your chance of being pivotal is roughly 1 in 20.
  *   A. I definitely vote. The probability is high enough to justify the time.
  *   B. I vote, same as I do in national elections. My principle doesn't change with scale.
  *   C. I vote only if I like the candidates. It's about engagement, not math.

  ***

  ### Part 3: Scoring Key

  To determine your theoretical leaf, follow this decision tree based on your answers.

  **Step 1: The Instrumental Test (Questions 1, 3, 8)**
  *   If you chose **A** on most of these (Abstain in safe seats, non-binding, or when donation is more efficient):
      *   Go to **Step 2**. (You are likely an Instrumentalist).
  *   If you chose **B** or **C** on most of these (Vote regardless of efficacy):
      *   Go to **Step 3**. (You are likely a Non-Instrumentalist).

  **Step 2: Instrumental Branch**
  *   **Question 5 (Altruist's Dilemma):**
      *   If you chose **A** (Keep $50): You are **The Downsian Skeptic**.
          *   *View:* Pure Self-Interested Instrumental.
      *   If you chose **B** (Total social benefit): You are **The Utilitarian Calculator**.
          *   *View:* Altruistic/ethical Instrumental.
  *   **Question 7 (Pivotal Probability):**
      *   If you chose **B** or **C** (Vote despite low odds): You are **The Optimistic Statistician**.
          *   *View:* Rational Overconfidence/Misprediction.

  **Step 3: Non-Instrumental Branch**
  *   **Question 6 (Rainy Day) & Question 10 (Small Election):**
      *   If you chose **A** on Q6 (Movie) or **C** on Q10 (Only if I like them): You are **The Political Fan**.
          *   *View:* Consumption/Entertainment.
      *   If you chose **B** on Q6 (Rain) and **B** on Q10 (Principle doesn't change):
          *   Go to **Step 4**.

  **Step 4: Duty vs. Expression (Questions 2, 4, 9)**
  *   If you chose **A** on Q2 (Less likely if secret) or **C** on Q4 (Proves I care) or **C** on Q9 (Express integrity): You are **The Identity Signaler**.
      *   *View:* Expressive Voting.
  *   If you chose **B** on Q2 (Same if secret) or **C** on Q4 (Guilt/Contribution) or **B** on Q9 (Moral record): You are **The Reluctant Citizen**.
      *   *View:* Civic Duty (D-term).

  ***

  ### Part 4: Meta-Analysis of the Diagnostic

  **1. The Indistinguishable Pair: Civic Duty vs. Expressive Voting**
  This quiz cannot cleanly separate **The Reluctant Citizen** from **The Identity Signaler** in all cases. Both profiles vote in safe seats, secret ballots, and non-binding referendums. The distinction relies on the *phenomenological source* of the utility (avoiding guilt vs. affirming identity), which behavioral choices alone do not reveal. To distinguish them, one would need a question asking, "Do you feel relief after voting (Duty) or pride (Expression)?" but self-reports on emotion are often less reliable than choice data. I have attempted to split them in Step 4 using questions about secrecy and moral staining, but a user who votes for both reasons will score ambiguously.

  **2. The Unoccupied Combination: The Self-Interested Realist Voter**
  There is no leaf for a respondent who answers: **Instrumental** (Q1: Abstain), **Self-Interested** (Q5: Keep $50), **Realistic** (Q7: Accept odds), yet **Votes** (Q1: Vote).
  *   **Why it is empty:** This combination is theoretically incoherent within rational choice. If the value is purely instrumental, the scope is purely self-interested, and the probability is realistically zero, the expected utility of voting is strictly negative (since $C > 0$). Choosing to vote under these specific constraints implies a preference reversal or a misunderstanding of the questions, not a stable theoretical position.

  **3. Awkward Commitments of Each Leaf**

  *   **The Downsian Skeptic:** Must conclude that the vast majority of fellow citizens are behaving irrationally or systematically misunderstanding basic probability.
  *   **The Utilitarian Calculator:** Is obligated to vote in every election globally where the stakes are high, regardless of personal connection or citizenship status.
  *   **The Optimistic Statistician:** Must maintain a belief in their own pivotality that contradicts all available statistical evidence and mathematical modeling.
  *   **The Identity Signaler:** Reduces voting to "cheap talk," implying that the democratic mechanism is merely a stadium for cheering rather than a tool for governance.
  *   **The Reluctant Citizen:** Relies on an internalized norm of "doing one's part" that cannot be justified by the actual consequences of the part being played.
  *   **The Political Fan:** Trivializes the franchise by making participation contingent on the "entertainment value" of the campaign rather than the gravity of the outcome.
