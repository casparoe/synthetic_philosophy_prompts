      *   **Superrationality (Hofstadter):** Assumes players are identical rational thinkers. If I'm rational, you're rational. We face the same problem. We will output the same answer. Therefore, I choose as if I'm choosing for both. This leads to Cooperate.
      *   **The Core Tension:** It's about *correlation* vs. *causation*.
