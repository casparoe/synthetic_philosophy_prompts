answer: |-
  Here's the deal: You two aren't confused about logic; you're confused about **definitions**. You are arguing past each other because you're using two different "operating systems" for what the word "rational" means.

  This is actually a famous debate in philosophy and game theory. It boils down to a clash between **Causal Decision Theory** (your friend) and **Functional Decision Theory** or **Superrationality** (you).

  Here is the breakdown of who is right, who is wrong, and why your friend's "causality" objection is the sticking point.

  ### 1. Your Friend's Position (Causal Decision Theory)
  Your friend is arguing from the standpoint of standard, textbook game theory. This is called **Causal Decision Theory (CDT)**.

  *   **The Logic:** In a one-shot Prisoner's Dilemma, my choice happens *here*, and your choice happens *there*. There is no wire connecting our brains. My choice cannot physically reach across the room and change your mind.
  *   **The Conclusion:** Since my action doesn't *cause* your action, I should treat your action as a fixed fact. Whether you cooperate or defect is already decided (in a probabilistic sense). In that scenario, defecting always yields a better payoff for me.
  *   **The "Telepathy" Claim:** When he says superrationality is "telepathy," he means that for your choice to change his, there would need to be a causal mechanism. Since there isn't one, he thinks you're believing in magic.

  **Is he confused?**
  On standard game theory terms? **No.** He is correctly describing the Nash Equilibrium. If you walk into an economics classroom, the professor will say your friend is right.

  ### 2. Your Position (Superrationality / Functional Decision Theory)
  You are arguing from the standpoint of **Superrationality** (coined by Douglas Hofstadter) or the newer **Functional Decision Theory (FDT)**.

  *   **The Logic:** You aren't claiming your choice *physically causes* his. You're claiming your choice is **logically correlated** with his. If you are both perfectly rational agents facing the same problem, you are essentially running the same "mental algorithm."
  *   **The Math:** If Algorithm A = Algorithm B, and Input A = Input B, then Output A *must* equal Output B. It's not magic; it's math. If you decide "Cooperate," you aren't sending a signal to him; you are simulating him and realizing that *if* you defect, he (being identical to you) would also defect.
  *   **The Conclusion:** You aren't choosing for yourself; you are choosing the output of the algorithm that both of you are running. Since (Cooperate, Cooperate) is better than (Defect, Defect), the rational output is Cooperate.

  **Are you confused?**
  Your logic is internally consistent, **but** it relies on a very strong assumption: that the other player is actually using the same reasoning process as you.

  ### 3. The "Causality" Objection
  This is the specific point you asked about. Your friend says: *"Symmetry only works if my choice causes his choice."*

  **He is wrong here.** This is where he is confused about your argument.

  Superrationality does **not** require causal influence. It requires **logical dependency**.
  *   **Causal:** I push a domino, it falls. (Physical cause).
  *   **Logical:** I calculate $2 + 2$. You calculate $2 + 2$. We both get $4$. Did my calculation *cause* yours? No. But are the results correlated? Yes, absolutely.

  Your friend is insisting that because there is no *causal* link, there can be no *predictive* link. But if you know someone thinks exactly like you, you have a massive predictive link. Superrationality argues that a rational agent should respect logical correlations just as much as causal ones.

  ### The Verdict: Who is actually confused?

  **You are both half-right, but your friend is more confused about the specific mechanism.**

  1.  **Your Friend:** He is right that in the real world, most people are not superrational agents. If you cooperate with him based on superrationality, and he defects based on standard game theory, **you lose**. He is correct that against a standard defector, cooperation is suicide. However, he is wrong to call your logic "telepathy." He is failing to understand that logical correlation exists without physical causation.
  2.  **You:** You are right about the logic of identical agents. If you were playing against a clone of yourself, cooperating is the only rational move. However, you are confused if you think this applies to your friend. Your friend has explicitly told you he is a defector! By arguing for cooperation, you are treating him as a superrationalist when he has identified himself as a causal decision theorist.

  ### How to settle the argument
  Tell him this:

  > "You're right that my choice doesn't *physically cause* yours. That's Causal Decision Theory. But Superrationality isn't about causality; it's about **logical correlation**. It's like us both solving the same math problem. My answer doesn't cause yours, but if we're both rational, our answers will match.
  >
  > **However**, you win the practical argument. Superrationality only works if I know *you* are also a superrationalist. Since you just told me you're going to defect, my 'algorithm' now has different input than yours. So, against you specifically, I should defect too."

  **Summary:**
  *   **On the theory of causality:** You are right. Logical correlation is real; telepathy is not.
  *   **On how to play the game:** He is right. Against a standard defector, you must defect.
  *   **Who is confused:** He is confused about what superrationality claims (it doesn't claim causality). You are confused about whether it applies to him (it doesn't, because he's not playing the same "game").

  Call it a draw, grab a beer, and stop playing Prisoner's Dilemma with people who haven't read Hofstadter.
