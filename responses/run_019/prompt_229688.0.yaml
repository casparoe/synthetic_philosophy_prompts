          *   *Evidential Decision Theory (EDT):* Focuses on what actions *evidence* about the world. (Closer to User's view, but EDT has its own problems like the Smoking Lesion).
          *   *Functional Decision Theory (FDT) / Timeless Decision Theory (TDT):* Modern updates that formalize superrationality. They argue that you should act as if you are choosing the *output of the algorithm*, which is instantiated in both players.

