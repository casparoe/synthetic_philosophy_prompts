      *   *Best Fit:* **The "Introspective Hologram" (or similar).**
      *   *Actually, let's go with the user's instinct check.* If I use the **Phantom Limb** analogy carefully: The pain is real (the state exists), the limb damage is illusory (the property attribution). This maps to: The experience is real (functional state), the 'qualia' (intrinsic non-physical property) is illusory.
