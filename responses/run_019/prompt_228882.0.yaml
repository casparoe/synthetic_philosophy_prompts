      *   *The Illusionist Move:* It's not denying experience; it's denying the *interpretation* of experience as having non-physical/ineffable properties.
      *   *The Trap:* If you say "phenomenal consciousness is an illusion," students hear "there is no experience." You need to clarify *what* is illusory (the *properties*, not the *state*).
      *   *User's Instinct:* Phenomenal/Access distinction first.
      *   *Critique of Instinct:* Actually, leading with Block's P/A distinction might reinforce the idea that there *is* a phenomenal residue to be explained. Illusionists often reject the P/A distinction as part of the folk-psychological error. Starting with the *introspective mechanism* might be safer. However, for 2nd years, they likely know P/A. The trick is using it to isolate the target. Let's refine: Don't start with P/A as established fact. Start with the *intuition* of phenomenality, then show how introspection constructs it.
      *   *Decision:* I will push back slightly on the user's instinct. Don't start with P/A as a given framework. Start with the *introspective act* itself. The P/A distinction is useful later to show what illusionists *keep* (access/report) vs. what they *discard* (ineffable qualia).

