prompt: |-
  I teach a second-year philosophy of mind seminar and next week we hit illusionism about phenomenal consciousness — the Frankish-ish view that phenomenal properties are a kind of introspective illusion. The students have done the standard dualism-to-functionalism tour, so they'll arrive assuming the illusionist is just denying that anyone is conscious, full stop, and I want to break that assumption before it calcifies. Plan the teaching, not the content: the order the pieces have to come in and why (my instinct is the phenomenal/access distinction first, then the introspective misrepresentation move, but push back if that's wrong), the one example the whole session should be built around and what it has to show and crucially what it must not smuggle in, the misconceptions they'll predictably form — I'd bet on "the illusion would itself have to be a phenomenal state, so the view is incoherent" and "this is just physicalism with extra steps" — and exactly where in the sequence each one gets headed off rather than left to fester. Also tell me what to openly leave out at this level, and one question I can ask at the end that seperates students who got it from students who just find it shocking. British English please.
