      *   *Decision:* **The "Desktop Interface" (Keith Frankish's own favourite).** It explains *why* the illusion exists (evolutionary utility) and separates the underlying reality (code/neurons) from the appearance (icons/qualia). It avoids the "nothing is real" trap because the desktop is real, just not a literal picture of the code.
      *   *Wait, I need to be careful.* The prompt asks for *one example the whole session should be built around*. The Desktop Icon is the most robust for Frankish-style illusionism.
