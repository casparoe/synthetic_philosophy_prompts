      *   *Actually, the strongest pedagogical tool:* **The "User Interface" Analogy (Hoffman/Frankish).** Desktop icons. The file icon is real (on the screen), but it doesn't look like the code.
      *   *Decision:* **The Desktop Interface Analogy.** It's distinct, captures the "useful fiction" aspect, and separates the functional reality from the phenomenal appearance.
      *   *Refinement:* Let's stick to something more phenomenological. **Change Blindness / Inattentional Blindness** is good, but maybe **The "Filling-In" of the Blind Spot**.
