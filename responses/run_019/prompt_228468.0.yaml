prompt: |-
  A position I keep returning to, and one that I think is fairly standard in rationalist-adjacent circles, is that Bernard Williams's integrity objection to consequentialism — the business about the chemist George, Jim and the Indians, and the famous complaint that the husband who stops to calculate whether saving his wife is permissible has one thought too many — rests on a confusion between a criterion of rightness and a decision procedure. On this view, consequentialism tells you what makes an action right; it does not instruct anyone to deliberate consequentially in the moment. A sophisticated consequentialist, the reply goes, has excellent consequentialist reasons to cultivate exactly the dispositions Williams valorises: loving partiality, project loyalty, the refusal to run the arithmetic before rescuing one's spouse. The person with one thought too many is simply a bad consequentialist, and Williams has at most refuted a straw version of the theory that no careful defender ever held. The integrity objection, properly understood, is practical advice about moral psychology dressed up as a refutation.

  I want to stress-test this rather than have it applauded. What would actually count against it? Please map the position's exposure honestly, and in particular:

  1. Which objections would its defenders themselves have to concede as damaging, as opposed to objections only its critics find forceful? I am suspicious that the criterion/decision-procedure move is one consequentialists wave through in their own ranks but would never accept from a rival — say, a deontologist who replies to every counterintuitive verdict by distinguishing the criterion of duty from the deliberative process of the virtuous agent. If the move is available to everyone, does it protect anyone?

  2. Is the position falsifiable in any interesting sense? If every apparent counterexample — the man who lets his wife drown after a correct calculation, the agent whose projects are ground to dust by aggregation — can be reabsorbed as a case of suboptimal deliberative policy, has the theory bought immunity at the price of saying nothing? Distinguish, where you can, between consequences that would be decisive defeaters and consequences that would merely be awkward, and be willing to say if you think the position has been insulated past the point where 'awkward' is even a category available to it.

  3. There is a variant of the thought experiment I have never seen discussed and would like you to take seriously rather than dismiss: suppose the deliberation is costless. Imagine an agent with instantaneous, perfect, non-conscious computation of expected consequences — the calculation happens in no time and crowds out no thought, so the wife is saved in exactly the same motion, with the rescue now issuing from the calculation rather than from love. Williams's point, I take it, is meant to survive this amendment; the complaint was never that deliberation is slow. But if that is right, then the criterion/decision-procedure reply cannot be the whole story, since in this variant the criterion and the procedure coincide and the objection is supposed still to bite. Does this show the reply misses Williams's real target — something about the justificatory structure of partial concern, not the psychology of it — or does it instead expose that Williams's intuition itself depends on smuggling in the phenomenology of hesitation?

  4. Finally: what would the position have to look like for you to regard it as having collapsed into a rival? If the sophisticated consequentialist is permitted to be, in the moment, indistinguishable from a virtue ethicist or a deontologist, in what does the disagreement consist — and is there any possible world in which the two theories issue different verdicts, or have we located a dispute with no empirical or normative content?

  The outcome I would personally find most persuasive is not a verdict that Williams wins, but a demonstration that the reply is doing real work somewhere I haven't seen, or conversely that it is pure protective belt. I would rather be told the position is well insulated and that this is a problem than be given a balanced both-sides tour.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Bernard Williams's integrity objection to consequentialism (specifically the "one thought too many" and George/Jim cases) vs. the standard consequentialist reply (Criterion of Rightness vs. Decision Procedure).
      *   **User's Stance:** Skeptical of the standard reply. Wants to stress-test it, not have it applauded. Wants honest mapping of exposure.
      *   **Specific Questions:**
          1.  What objections would *defenders* concede as damaging? (Is the move hypocritical/universalizable?)
          2.  Is the position falsifiable? (Has it bought immunity at the cost of emptiness?)
          3.  The "Costless Deliberation" Variant: If calculation is instantaneous/non-intrusive, does the objection still hold? Does this show the reply misses the point?
          4.  Collapse Conditions: When does sophisticated consequentialism become indistinguishable from virtue ethics/deontology? Is there any normative content left?
      *   **Desired Outcome:** Not a "both sides" tour. A demonstration of where the reply does real work or where it is pure "protective belt" (Lakatosian term implied). Willingness to say if it's *too* insulated.

  2.  **Deconstruct the Standard Reply (Criterion vs. Procedure):**
      *   *Claim:* Consequentialism defines *rightness* (maximize good), not *deliberation* (calculate every act).
      *   *Defense:* Indirect consequentialism. Cultivating non-consequentialist dispositions (love, integrity) yields better consequences.
      *   *Weakness:* It risks making the theory unfalsifiable or purely extensional (matching outcomes) rather than intensional (matching reasons).

  3.  **Address Question 1: Concessions & Hypocrisy:**
      *   *The "Universal Move" Problem:* If a deontologist uses the same move ("Kant says maximize duty, but don't think about it"), does it work?
      *   *Defender Concession:* A sophisticated consequentialist *must* concede that if the *only* reason to have a disposition is instrumental, the disposition is fragile. If the agent *knows* they are only loving their wife *because* it maximizes utility, is it really love? (The problem of "government house" consequentialism or self-effacement).
      *   *Damaging Objection:* The "Self-Effacement" objection. If the theory requires you to *not* believe the theory to act rightly, does it undermine its own authority? Defenders (like Railton) admit this is a tension. If the theory tells you to ignore the theory, is it still your guiding norm?
      *   *Hypocrisy Check:* Deontologists *can* use this (rule worship vs. act evaluation), but Consequentialists rely on it *more* because their criterion is more demanding. If the move protects everyone, it protects no one *specifically*, but it might show that *all* normative theories need a moral psychology layer. The damage is if the criterion becomes irrelevant to the agent's life.

  4.  **Address Question 2: Falsifiability & Immunity:**
      *   *The "Protective Belt" Risk:* If every failure is blamed on "suboptimal deliberative policy," the core is never touched.
      *   *Decisive Defeater:* A case where cultivating the "non-consequentialist disposition" *clearly* leads to worse outcomes, yet the theory says you must keep it, OR a case where the theory says you must drop it, but doing so destroys the "good" being maximized (e.g., genuine friendship requires believing the friend matters *non-instrumentally*).
      *   *The "Awkward" Zone:* It's awkward if the theory requires systematic self-deception.
      *   *Insulation Level:* It is highly insulated. To make it falsifiable, we need a case where the *criterion* demands X, the *best procedure* demands Y, and the conflict is irreconcilable without destroying the agent's integrity *by the theory's own lights*.
      *   *Verdict:* It is bordering on unfalsifiable if "integrity" is defined purely by consequences. If integrity is an independent value, it's not pure consequentialism anymore.

  5.  **Address Question 3: Costless Deliberation (The Crucial Thought Experiment):**
      *   *Scenario:* Instant, non-conscious calculation. Saves wife. No hesitation.
      *   *Williams's Real Point:* It's not about time/psychology. It's about *reasons*. The husband saves the wife *because she is his wife*, not *because saving her maximizes utility*.
      *   *Implication:* The Criterion/Procedure reply fails here. Even if the procedure is perfect, the *justification* is wrong.
      *   *Analysis:* This exposes that Williams is attacking the *source of normativity*, not the *efficiency of action*. The reply treats integrity as a *tool* for good consequences. Williams treats integrity as a *constituent* of a meaningful life.
      *   *Conclusion:* This variant breaks the standard reply. It shows the reply addresses "alienation" (psychological distance) but not "justificatory alienation" (the source of the 'why'). If the calculation drives the action, the relationship is instrumentalized, even if instant.

  6.  **Address Question 4: Collapse Conditions:**
      *   *When does it become Virtue Ethics/Deontology?* When the "optimal decision procedure" becomes so entrenched that the criterion never actually overrides it.
      *   *The Difference:* The "Escape Clause." A sophisticated consequentialist must admit that if saving the wife *didn't* maximize utility (e.g., saving her causes a nuclear war), they *must* let her die. A virtue ethicist/deontologist might say "No, loyalty forbids it."
      *   *Normative Content:* The disagreement exists in *extreme* cases (Jim and the Indians). In everyday life, they converge.
      *   *Collapse:* If the consequentialist says "The disposition is so valuable you should never override it, even if utility demands it," they have ceased to be consequentialists. They have made integrity a side-constraint.
      *   *Empirical Content:* The dispute is about the *structure of justification*, not just outcomes. But if outcomes are the only test, the theories are extensionally equivalent in 99% of cases.

  7.  **Synthesize and Structure:**
      *   *Tone:* Rigorous, philosophical, direct, avoiding "balanced" hedging.
      *   *Structure:* Follow the four questions explicitly.
      *   *Key Insight:* The Criterion/Procedure distinction solves the *psychological* alienation but fails the *justificatory* alienation. This is the core vulnerability.
      *   *Lakatosian Analysis:* Is this a progressive or degenerating research programme? It looks degenerating if it constantly pushes the "real theory" further away from the agent's perspective.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer Q1 about deontologists? *Correction:* Need to be careful. Deontologists don't usually distinguish criterion/procedure in the same way because their criterion *is* often procedural (act on maxims). But Rule Deontologists do. The point is: if the move is too flexible, it trivializes the distinction between theories.
      *   *Check:* Q3 is the strongest point. Emphasize that Williams cares about *grounding*, not *timing*.
      *   *Check:* Q4 needs to define "collapse." It collapses when the criterion becomes "idle."

  9.  **Final Polish:** Ensure the distinction between "psychological alienation" (feeling distant) and "justificatory alienation" (acting for the wrong reason) is clear. This is the crux of why the standard reply fails the "Costless Deliberation" test.

  **(Self-Correction on Q1):** The user asks what *defenders* would concede. Defenders (like Peter Railton) concede that "radical self-effacement" is a cost. They admit the theory might be "esoteric." That is a concession of damage.

  **(Self-Correction on Q2):** Falsifiability. If the theory says "Do whatever produces the best outcome, including adopting a procedure that ignores outcomes," how do we test it? We can't observe the counterfactual. The defeater is when the *adoption* of the procedure is impossible without believing the criterion is false. (The paradox of hedonism applied to morality).

  **(Self-Correction on Q3):** The "Costless Deliberation" case. If the calculation is unconscious, is it still "one thought too many"? Williams would say yes, because the *ground* of the action is the utility, not the relationship. The reply fails here.

  **(Self-Correction on Q4):** Collapse. If the "optimal procedure" is "Never consult utility," then for all human purposes, it is deontology. The only difference is a hypothetical "God's eye view" override. Is that meaningful? Yes, in catastrophic cases. No, in human life.

  10. **Drafting the Response:** (Proceed to generate output based on these structured thoughts.)
answer: |-
  This is a rigorous request that cuts to the methodological core of normative ethics. The "criterion of rightness vs. decision procedure" distinction (often associated with Peter Railton's *Alienation Consequentialism*) is indeed the standard shield. To stress-test it, we must treat it not as a settled solution but as a hypothesis about the structure of moral theory.

  Here is the honest mapping of the position's exposure, adhering to your four constraints.

  ### 1. The "Universal Move" and Defender Concessions

  You ask if defenders would accept this move from a rival. The honest answer is **no**, and this asymmetry reveals a specific vulnerability.

  If a deontologist argued, "The Categorical Imperative is the criterion of rightness, but a virtuous agent should never deliberate using it; they should just follow tradition/instinct," consequentialists would pounce. They would argue that without the deliberative link, the criterion is idle, and the theory cannot explain *why* the tradition is binding other than by covertly appealing to consequences.

  **What defenders must concede:**
  Sophisticated consequentialists (like Railton or Smart) must concede the **Self-Effacement Objection**. They have to admit that for their theory to work, the agent often *cannot believe the theory is true* while acting. If the agent believes "I am cultivating this love for my wife *only because* it maximizes utility," the love becomes instrumental and typically collapses (the paradox of hedonism applied to morality).

  **The Damaging Concession:**
  Defenders must concede that the theory is **esoteric**. It implies a split between the "truth" of morality (maximize utility) and the "lived experience" of morality (act from love/duty).
  *   **Why this is damaging:** It grants Williams's point that consequentialism cannot serve as a *public* moral framework in the way it claims. If the best way to be a consequentialist is to think like a non-consequentialist, the theory loses its action-guiding force for the reflective agent.
  *   **The Hypocrisy Check:** You are right to suspect this move protects no one if universalized. If every theory pushes its criterion into the background and says "real agents don't think this way," then normative ethics becomes purely descriptive psychology. The specific damage to consequentialism is that its criterion is *consequentialist*. If the decision procedure is *non-consequentialist*, the criterion is doing no work in the moment of action. Defenders must concede this makes the criterion **causally inert** in the very situations it purports to judge.

  ### 2. Falsifiability and the "Protective Belt"

  Is the position falsifiable? Currently, it borders on **unfalsifiable**, which is a theoretical vice.

  **The Immunity Problem:**
  If every counterexample (Jim and the Indians, the drowning wife) is met with "That agent had the wrong decision procedure," the core thesis (maximize the good) is never tested against human reality. It becomes a tautology: "The right action is the one that maximizes good, and the way to maximize good is whatever actually maximizes good."

  **Decisive Defeaters vs. Awkwardness:**
  *   **Merely Awkward:** It is awkward if the theory requires systematic self-deception (believing your wife matters intrinsically when she matters instrumentally). Defenders accept this cost.
  *   **Decisive Defeater:** A case where the *optimal decision procedure* is **unavailable** to an agent who knows the criterion.
      *   *Scenario:* Suppose psychological facts dictate that genuine integrity (the kind that sustains projects and relationships) requires believing that some constraints are *absolute*. If an agent knows consequentialism is true, they *cannot* have genuine integrity (because they know the constraints are breakable).
      *   *The Collapse:* If the theory says, "To maximize good, you must believe a falsehood (that constraints are absolute)," it has ceased to be a guide to truth and become a guide to manipulation.
      *   *Falsifiability Condition:* The position is falsified if it can be shown that **knowledge of the criterion systematically degrades the decision procedure.** If knowing consequentialism makes you worse at achieving consequences than knowing deontology, and the theory *still* insists you must know consequentialism, it is practically irrational. If it insists you *shouldn't* know it, it is not a moral theory for reflective agents.

  **Verdict on Insulation:**
  The position is currently insulated past the point of "awkward." It has made the criterion of rightness **normatively idle** for the agent. If the theory never tells you what to think in the moment (because thinking that way is suboptimal), it is not telling you how to live; it is telling you how to judge the dead.

  ### 3. The Costless Deliberation Variant

  This is the strongest stress-test you have proposed. It isolates the **justificatory structure** from the **psychological cost**.

  **The Setup:**
  Agent saves wife. Calculation is instantaneous, non-conscious, costless. Outcome is optimal.
  *   *Standard Reply:* "See? No alienation. The procedure matches the criterion perfectly."
  *   *Williams's Counter:* The objection remains.

  **Why the Reply Fails Here:**
  Williams's "one thought too many" is not about *time* or *cognitive load*; it is about **grounding**.
  *   In the costless variant, the action is still grounded in the *calculation*, not the *relationship*.
  *   The husband saves the wife *because the math said so*, even if the math was instant.
  *   The Criterion/Procedure reply treats integrity as a **tool** for producing good states of affairs. Williams treats integrity as a **constituent** of a meaningful life.

  **The Exposure:**
  This variant demonstrates that the Criterion/Procedure distinction solves **Psychological Alienation** (feeling torn) but fails to solve **Justificatory Alienation** (acting for the wrong reason).
  *   If the reply claims to fully answer Williams, this variant proves it false.
  *   If the reply concedes this variant still feels "off," it admits that consequentialism cannot account for the *value of the motive itself*, only the value of the *outcome produced by the motive*.
  *   **Conclusion:** This shows the reply misses Williams's real target. Williams is arguing that a life lived entirely under the criterion of consequentialism (even indirectly) is alienated because it renders all personal projects **contingent** on their utility. The costless calculation makes that contingency explicit. The reply cannot fix this without ceasing to be consequentialism (i.e., admitting that some actions are right *because* they express love, not *because* love produces good).

  ### 4. Collapse Conditions: When does it become a Rival?

  You ask when sophisticated consequentialism collapses into virtue ethics or deontology.

  **The Collapse Point:**
  It collapses when the "optimal decision procedure" becomes **lexically prior** to the criterion in all humanly possible scenarios.
  *   If the theory dictates: "Adopt a disposition to never sacrifice an innocent, even if doing so would maximize utility," and further dictates: "Never check if this is an exception," then for all human purposes, it is **Rule Deontology**.
  *   The only remaining difference is a "God's Eye View" override: "If you *could* know with certainty that violating the rule saves the universe, you must."

  **Does the Disagreement Have Content?**
  *   **Normative Content:** Yes, but only in **catastrophic** or **idealized** cases. In the messy human world (Jim and the Indians), the sophisticated consequentialist and the deontologist might issue the same verdict (Don't shoot).
  *   **The Dispute:** The dispute is no longer about *what to do*, but **what makes it right**.
      *   Deontologist: "It is wrong to shoot because it violates rights."
      *   Sophisticated Consequentialist: "It is wrong to shoot because cultivating a prohibition on shooting maximizes utility."
  *   **Is this empty?** If the "because" never changes the action, it risks being empty. However, it matters for **moral residue**.
      *   If the deontologist shoots to save the world, they feel guilt (they did wrong to make right).
      *   If the consequentialist shoots, they feel regret (unfortunate necessity), but no guilt (they did the right thing).
      *   **The Empirical Test:** The theories diverge on the **phenomenology of regret** and the **conditions of forgiveness**.

  **Verdict on Collapse:**
  The position collapses into a rival if it admits that the "optimal procedure" is **opaque**. If the agent cannot know *why* the procedure is optimal (only that it is), the criterion is no longer justifying the action; the tradition/habit is. At that point, the "consequentialism" is merely a meta-ethical claim about why the tradition exists, not a normative guide. If you are willing to accept that the normative guide is "Follow the tradition," you are a traditionalist, not a consequentialist. The "consequentialist" label becomes a historical explanation, not a moral command.

  ### Summary of the Stress Test

  The "Criterion vs. Decision Procedure" reply is a **degenerating research programme** in the Lakatosian sense.

  1.  **It protects the core by making it idle.** It saves consequentialism from counterexamples by removing consequentialist deliberation from the agent's mind.
  2.  **It fails the Costless Deliberation test.** It addresses the *efficiency* of deliberation but not the *source* of normativity. Williams's objection survives because the *reason* for the action remains instrumental, even if the *process* is seamless.
  3.  **It risks collapse.** If the optimal procedure is "Never think like a consequentialist," the theory is self-effacing to the point of irrelevance for the agent.
  4.  **The Real Work:** The only real work this reply does is explaining why consequentialists don't walk around calculating utility constantly. It explains *behavioral convergence* with common sense. It does **not** explain *justificatory convergence*.

  **Final Verdict:**
  The reply is pure protective belt. It successfully argues that consequentialists need not be *psychologically* alienated (neurotic calculators), but it fails to show they are not *structurally* alienated (agents whose relationships are ultimately contingent on utility). Williams's integrity objection targets the structural alienation. The Criterion/Procedure distinction does not touch it. To touch it, the consequentialist would have to admit that integrity is a value independent of its consequences, which would cease to be consequentialism.
