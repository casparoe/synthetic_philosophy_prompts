answer: |-
  You have hit on one of the most famous and enduring critiques of utilitarianism. You are reading Bentham very closely, and your intuition is sharp. This is exactly the problem that later utilitarians (like John Stuart Mill) tried to solve, and it is still debated by ethicists today.

  However, Bentham does have a specific utilitarian response to this, and it doesn't necessarily involve "smuggling in" a non-utilitarian principle. To see why he thought he didn't need to "bite the bullet," we have to look at how he calculates the "mischief" (harm) of an act.

  Here is the breakdown of why Bentham thought the math still worked against punishing sodomy, even if the majority got pleasure from the punishment.

  ### 1. Primary vs. Secondary Mischief
  Bentham divides the bad consequences of a crime into two categories:
  *   **Primary Mischief:** The direct harm done to specific individuals (e.g., the pain of the victim).
  *   **Secondary Mischief:** The ripple effects on society, specifically **Alarm** and **Danger**.

  Bentham's argument regarding "paederasty" (his term for sodomy) is that the act itself produces **no primary mischief** if it is consensual. No one is harmed directly.

  The only "pain" coming from the act is the **pain of antipathy** felt by observers who find it disgusting. Bentham admits this pain is real. He doesn't say, "Your disgust doesn't count." He says, "Your disgust counts, but look at the cost of satisfying it."

  ### 2. The Cost of Security
  This is the core of his rebuttal to your point. Bentham argues that the **pain of insecurity** caused by punishing harmless acts outweighs the **pleasure of vengeance** felt by the mob.

  If the state punishes an act that causes no direct harm to others, it undermines the **principle of security**. Citizens can no longer be sure that their actions won't be criminalized based on the whims or prejudices of the majority.
  *   **The Math:** The momentary sadistic pleasure the majority gets from seeing a sodomite punished is finite and fleeting. However, the **anxiety** created in the population by a legal system that punishes private, harmless behavior is widespread and long-term.
  *   Bentham argues that a legal system must prioritize **security of expectation**. If people fear the law might come for them for harmless private acts, the total sum of pain (fear, anxiety, hiding, blackmail) exceeds the pleasure the moralists get from the punishment.

  So, he isn't saying sadistic pleasure counts for zero. He is saying it is **outweighed** by the systemic pain of living in an insecure society.

  ### 3. Pleasures Based on False Beliefs
  Bentham also hints at a distinction regarding the *source* of the pleasure. He was a radical empiricist. He viewed the outrage against sodomy as stemming from superstition, religious dogma, and "prejudice."

  While Bentham is a hedonist (pleasure is the good), he is also a reformer. He often argues that pleasures derived from **errors** (false beliefs about the world) are less stable and often lead to greater pains later.
  *   If the public's pleasure comes from the belief that sodomy "angers God" or "destroys the state," Bentham would argue this is a false calculation.
  *   Satisfying a prejudice reinforces that prejudice, which leads to more irrational laws, which leads to more aggregate pain in the long run.
  *   Therefore, a utilitarian legislator should educate the public to reduce the prejudice rather than cater to it, because a rational society produces more stable happiness than a prejudiced one.

  ### 4. Did he bite the bullet elsewhere?
  You asked why he didn't just bite the bullet. The truth is, **sometimes he did.**

  Bentham was willing to accept unpopular conclusions. For example, he argued against natural rights (calling them "nonsense upon stilts") even though it made him unpopular with revolutionaries. He argued for decriminalizing usury (lending at high interest) even though it was hated by the public.

  In the case of sodomy, however, he genuinely believed the utilitarian calculus was clear:
  1.  The act causes no direct harm.
  2.  The punishment causes severe direct harm (execution, imprisonment, shame).
  3.  The "pleasure" the public gets is based on prejudice and creates long-term insecurity.

  ### 5. Your Critique is Still Valid
  Even with Bentham's defense, your suspicion is philosophically sound. This is known as the **"Glorious Sadist"** objection.

  If 51% of the population derives *enough* intense pleasure from torturing the 49%, classic act utilitarianism *should* theoretically support it. Bentham tries to dodge this by emphasizing **security** and **long-term consequences**, but many philosophers argue this is a shaky defense. If the sadists are numerous enough and the insecurity can be managed (e.g., everyone knows *only* group X will be punished), the math could still tip toward oppression.

  This is exactly why John Stuart Mill later introduced the **Harm Principle** in *On Liberty*. Mill realized that Bentham's pure calculus didn't sufficiently protect minorities from the "tyranny of the majority." Mill essentially "smuggled in" the principle you accused Bentham of using: he argued that **self-regarding actions** (acts that only affect you) are *off-limits* to society, regardless of the utility calculus.

  ### Summary
  Bentham didn't explicitly say "sadistic pleasure counts for zero." He argued that:
  1.  The pain of the punished is intense.
  2.  The pleasure of the punishers is based on prejudice.
  3.  **Crucially:** The long-term pain of living under insecure laws outweighs the short-term pleasure of moralistic vengeance.

  You are right to feel a tension there, though. It is the weak point in strict act utilitarianism, and your reading of Bentham is spot-on for noticing that he is walking a tightrope between pure calculation and liberal principles. Keep reading with that skepticism; it's the best way to understand the evolution of utilitarian thought.
