answer: |-
  Yes, this is known as a random variable with an **undefined expectation** because the underlying series is **conditionally convergent** rather than absolutely convergent.

  In probability theory, an expected value is only well-defined if the sum of the absolute values of the outcomes weighted by their probabilities is finite (absolute convergence). Your calculation sums the terms in a specific order ($n=1, 2, 3\dots$), which yields $\ln(2)$, but the sum of the absolute magnitudes is the harmonic series $\sum \frac{1}{n}$, which diverges to infinity. Because the positive payouts sum to infinity and the negative payouts sum to negative infinity, you have an $\infty - \infty$ situation. In measure-theoretic probability, this renders the expectation undefined, not merely infinite, because the result depends entirely on the arbitrary order in which you group the outcomes rather than the intrinsic properties of the game.

  This explains why your simulation fails to settle. The Law of Large Numbers, which guarantees that a running average converges to the expected value, requires a finite expected value (specifically, $E[|X|] < \infty$). Since your game lacks this, the sample mean does not converge to any number; it will continue to fluctuate wildly indefinitely as rare, extreme outcomes (long runs of tails) occur often enough to reset the average. This behavior is identical to sampling from a **Cauchy distribution**, the continuous analog where the "tails" are too heavy for a mean to exist.

  Your intuition about reordering matches the **Riemann Rearrangement Theorem** from calculus, which states that any conditionally convergent series can be reordered to sum to any value you choose. In the St. Petersburg paradox, the expectation is infinite (one-sided divergence), so there is at least a consistent direction to the divergence. In your game, the divergence is two-sided, making the "fair price" mathematically indeterminate.

  Practically, this means there is no objective fact of the matter about a fair entry fee based on expected value. Rational choice theorists handle this by abandoning expected value in favor of **expected utility**, typically using a logarithmic utility function (like the Kelly criterion) which accounts for risk aversion and ensures convergence. Alternatively, you might price the game based on the **median** payout rather than the mean, which remains stable even when the mean is undefined.
