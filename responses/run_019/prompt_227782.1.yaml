prompt: |-
  Hey, quick one for you. I cover science and ideas for a magazine and I'm working up a piece on whether morality actually has rules -- like real, exceptionless ones -- or whether the whole project of "moral principles" was a mistake. I keep getting pitched on particularism vs generalism and I want the piece to be about what any view in this debate would even have to deliver, not just who wins.

  Act as a professional philosopher who knows the particularism/generalism literature cold (Dancy, Ross, the usual suspects) but who is also fair to the "common sense" side. Think carefully before drafting -- sketch the requirements first, then organize them.

  Write the desiderata: what an adequate theory of moral reasons has to be able to do to count as a serious view. For each requirement give me the motivating case or consideration (e.g. stuff like: whether pain's badness always counts the same way, how it handles Ross-style prima facie duties, why "all else equal" clauses can't just be infinitely patched, the fact that ordinary people seem to reason perfectly well without consulting rules). Mark which requirements are genuinely non-negotiable vs. which are just one camp's hobbyhorse. If you think some pair of desiderata can't be jointly satisfied, say so -- that's probably the most interesting part of the piece. Then, briefly, say how the main contenders do against the list, but keep that part short.

  One thing I really care about: please separate what's basically settled in this literature from what's still genuinely contested, and don't present a contested position as the consensus. Roughly 600-800 words, American English, and pitch it so I can lift structure from it rather than copy it.
