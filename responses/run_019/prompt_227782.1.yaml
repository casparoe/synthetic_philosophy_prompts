          *   Briefly assess main contenders (Particularism, Generalism/Principlism, Rossian Pluralism) against the list.
          *   Separate settled vs. contested issues (don't present contested views as consensus).
      *   **Format/Style:** American English, 600-800 words, structured for a magazine piece (lift structure, not copy).
      *   **Goal:** Help the journalist understand *what* is at stake, not just *who* wins.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Generalism:** Moral principles exist and are necessary for moral reasoning/judgment. (Kantians, Utilitarians, some Intuitionists).
      *   **Particularism:** Moral principles are unnecessary or non-existent; context determines valence. (Dancy is the key figure).
      *   **Rossian Pluralism:** Middle ground? Prima facie duties that aren't exceptionless but still general.
      *   **Key Tensions:** Codifiability vs. Context-sensitivity; Guidance vs. Accuracy; Explanation vs. Epistemology.

  3.  **Drafting the Desiderata (Internal Sketch):**
      *   *Req 1: Action Guidance.* Morality needs to help us decide what to do. (Generalism strength).
      *   *Req 2: Context Sensitivity.* Reasons change valence depending on context (e.g., pain in punishment vs. torture). (Particularism strength).
      *   *Req 3: Explanatory Power.* Why is this act wrong? Because it falls under a principle? Or because of the specific features?
      *   *Req 4: Epistemic Accessibility.* Can ordinary people know these rules?
      *   *Non-negotiable:* Must account for moral judgment happening (phenomenology). Must allow for criticism (normativity).
      *   *Contested:* Whether principles need to be exceptionless.

  4.  **Selecting and Refining Desiderata for the Article:**
      *   *1. The Guidance Constraint:* Morality must guide action. (Mostly non-negotiable, but *how* it guides is contested).
      *   *2. The Holism Constraint:* Reasons can change valence (pain isn't always bad). (Particularists say non-negotiable; Generalists try to accommodate via ceteris paribus).
      *   *3. The Codifiability Constraint:* Can we write it down? (Generalist hobbyhorse vs. Particularist rejection).
      *   *4. The Error Constraint:* Must explain moral mistake without collapsing into skepticism.

  5.  **Identifying Tensions:**
      *   Guidance vs. Holism. If reasons shift constantly (Holism), how do rules guide (Guidance)?
      *   Precision vs. Usability. Exceptionless rules are too complex to use; simple rules have exceptions.

  6.  **Assessing Contenders:**
      *   *Strict Generalism:* Good on guidance, bad on holism (needs infinite clauses).
      *   *Particularism:* Good on holism, bad on guidance (how do we learn?).
      *   *Rossian Pluralism:* Middle ground, but accused of being vague.

  7.  **Drafting - Section by Section (monitoring word count):**
      *   *Intro:* Set the stage (rules vs. context).
      *   *Desiderata 1 (Guidance):* Non-negotiable.
      *   *Desiderata 2 (Holism/Valence):* The big fight.
      *   *Desiderata 3 (Learnability):* Common sense angle.
      *   *The Clash:* Guidance vs. Holism.
      *   *Scorecard:* Brief rundown.
      *   *Settled vs. Contested:* Clarify status.

  8.  **Refining Tone and Constraints:**
      *   *Tone:* Professional but accessible (magazine piece prep).
      *   *Word Count:* 600-800. (Need to be concise).
      *   *Language:* American English.
      *   *Constraint:* Don't present contested views as consensus. (e.g., Don't say "Holism is true," say "Particularists argue holism is required").

  9.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Intro:* You want to know what the job is before hiring the candidate.
      *   *Req 1:* Action Guidance. Morality isn't just description.
      *   *Req 2:* Variable Valence (Holism). Pain example.
      *   *Req 3:* Publicity/Shareability. We argue about morals.
      *   *Tension:* Guidance needs stability; Holism demands instability.
      *   *Contenders:* Generalists (rules), Particularists (context), Rossians (hybrid).
      *   *Status:* Holism is widely accepted *to some degree*, exceptionless principles are contested.

  10. **Review against Word Count:**
      *   If I write too much on Ross, I'll blow the limit. Keep the scorecard tight.
      *   Ensure the distinction between "non-negotiable" and "hobbyhorse" is clear.

  11. **Final Polish:** Check for "settled vs. contested" instruction. Make sure I don't sound like I'm endorsing particularism as the truth, but presenting it as a serious challenger defining the terms.

