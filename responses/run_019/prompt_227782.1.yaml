answer: |-
  **The Job Description for Moral Theory**

  Before deciding whether morality needs rules, we need to agree on what a moral theory is supposed to *do*. If we treat moral philosophy as an engineering problem, we can identify the specific requirements any adequate view must meet. Some are non-negotiable demands of the subject matter; others are theoretical preferences that drive the debate between generalists (who want principles) and particularists (who doubt them).

  **1. The Guidance Constraint (Non-Negotiable)**
  Morality is practical. It isn't just a taxonomy of good and bad things; it's supposed to help agents decide what to do. A theory that renders moral judgment impossible for finite minds fails.
  *   *Motivation:* If a theory says the right action is determined by a rule too complex for humans to compute, it might be metaphysically true, but it's morally useless. Common sense demands that morality be action-guiding.

  **2. The Holism Constraint (Contested Necessity)**
  This is the flashpoint. Does a feature that counts as a reason in one case (e.g., "causing pain") always count as a reason in the same direction?
  *   *Motivation:* Particularists like Jonathan Dancy argue that context changes valence. Pain is bad in torture, but good in dentistry or punitive justice. Generalists try to save principles by adding *ceteris paribus* (all else equal) clauses.
  *   *Status:* Most philosophers accept *some* holism. The contest is whether holism destroys the possibility of general principles entirely, or just complicates them.

  **3. The Publicity Constraint (Common Sense)**
  Moral reasoning is a social activity. We argue, teach, and criticize each other. This requires shareable standards.
  *   *Motivation:* If moral judgment is purely intuitive and ineffable, moral disagreement becomes impossible. We need enough common ground to say, "You missed a rule," or "You misapplied a principle."
  *   *Status:* Generalists treat this as non-negotiable; particularists argue shared sensibility replaces shared rules.

  **The Fatal Tension**
  Here is the structural problem your piece should highlight: **Guidance requires stability; Holism demands instability.**
  To guide action, a principle must hold steady across cases. But if reasons are holistic (Constraint 2), their force shifts with context. To save the principle, the generalist must add exceptions ("Pain is bad, unless..."). But if you add enough exceptions to cover every context, the rule becomes too complex to guide action (violating Constraint 1). If you keep the rule simple, it fails to capture the context (violating Constraint 2). You cannot maximize both precision and usability.

  **The Scorecard**
  *   **Strict Generalism (Utilitarianism/Kantianism):** Aces Guidance and Publicity. Struggles with Holism. Often forced to deny that pain's valence actually changes, or hides the complexity in a "maximize utility" clause that offers little concrete guidance.
  *   **Radical Particularism (Dancy):** Aces Holism. Struggles with Guidance and Publicity. If there are no rules, how do we learn morality? Dancy suggests we learn via perception of salience, but critics argue this looks suspiciously like intuitionism without a check.
  *   **Rossian Pluralism:** The compromise. W.D. Ross argued for *prima facie* duties (e.g., "Don't lie") that are general but not exceptionless. They guide initially but can be overridden. This satisfies Guidance and Holism partially, but critics say it lacks a decision procedure for when duties conflict.

  **Settled vs. Contested**
  Be careful not to present the particularist challenge as a fringe view. The idea that reasons are context-sensitive (Holism) is widely accepted across the literature; even generalists now build defeasibility into their principles. What remains genuinely contested is whether this holism precludes *codifiability*. There is no consensus that exceptionless principles exist, nor is there consensus that they are impossible. The field has moved from asking "Are there rules?" to "What kind of rules can survive the context shift?"

  Your piece shouldn't ask who wins. It should ask whether any theory can satisfy the Guidance and Holism constraints simultaneously without collapsing into vagueness or rigidity. That tension is the engine of the debate.
