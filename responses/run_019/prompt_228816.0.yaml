      *   **Recommendation:** Given the constraints, the "cost" of Primitivism/Non-Reductive Realism is the one to pay. It's the only one that satisfies the user's specific doctoral research interests.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check Premise 1 & 2 again.* The friend argues even *finite* functions aren't computed. This is stronger than Kripke. Kripke focuses on the infinite extension (quus). If I only add numbers up to 100, is there indeterminacy? Yes, because I could mean a function that matches up to 100 but diverges at 101. But do I *compute* the finite function? The friend says "not even the successor function on the first hundred." This implies I don't even have a determinate grasp of the *finite* pattern.
      *   *Correction:* The error is assuming that to compute a function, one must have a fact that *logically entails* the infinite extension. But computing is a capacity.
      *   *Focus:* The "Interpretation Regress" in Premise 3 is the standard Wittgensteinian trap. Wittgenstein himself would reject the idea that an intention needs interpretation *by the subject*.
