      *   (5) Intuition: The bridge case *is* special/pointed.
      *   (6) Inference: The "pointedness" isn't in the generic design features (since stairs also have features).
      *   (7) Inference: The "pointedness" comes from intention/context.
      *   (8) Conclusion: Therefore, design itself doesn't carry the politics (it's the context/intent).
      *   (9) Dilemma: Triviality vs. Abandoning the "in the design" claim.

  3.  **Identify the Weak Link:**
      *   Step (1) is the most vulnerable. It defines "political in design" as *any* opening/closing of action "independently of anyone's intentions."
      *   Step (2) is empirically true (affordance theory).
      *   Step (4) is a normative judgment about the usefulness of the theory.
