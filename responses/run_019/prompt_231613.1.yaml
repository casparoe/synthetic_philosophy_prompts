      *   So, reject Step (1)'s claim that intention doesn't matter for the *definition*, but maintain that the *operation* is independent of intention.
      *   Actually, a better move is to reject the equivalence in Step (3). Just because stairs and bridges both constrain doesn't mean they are political in the *same way*. One is a "natural" constraint (mostly), the other is a "legislative" constraint disguised as nature.
      *   Let's focus on **Step (1)**. It defines politics as "opening/closing courses of action." This is too broad. Politics is about *collective organization* and *power*.
