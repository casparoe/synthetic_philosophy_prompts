      *   *Alternative Insight:* Step (1) says "independently of anyone's intentions." Winner's actual argument often hinges on the fact that the design *embodies* a specific social arrangement, regardless of whether the *current* user intends it. But the *origin* might involve intent. However, the user's premise (1) explicitly excludes intention.
