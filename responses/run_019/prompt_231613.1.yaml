answer: |-
  This is a remarkably clear reconstruction of a classic problem in the philosophy of technology. You have essentially rediscovered the central tension in Langdon Winner's seminal essay, *"Do Artifacts Have Politics?"* (1980), and pushed it to its logical breaking point.

  Your dilemma is genuine: if "politics" means "constraint," everything is political (triviality). If "politics" means "specific social outcome," it seems to depend on context/intent, not the artifact itself (reductionism).

  To save the intuition that the low bridge is genuinely political without calling every staircase a tool of oppression, I recommend rejecting **Premise (1)** and modifying **Premise (6)**.

  Here is the breakdown of why these steps fail and how to restate the thesis to escape the dilemma.

  ### 1. Reject Premise (1): The Definition of "Political"
  **Your Premise (1):** *If an artifact is political in its design, this must consist in something the design itself does: the physical arrangement, independently of anyone's intentions, opens certain courses of action to some people and closes them to others.*

  **Why reject it:** This definition equates **physics** with **politics**. It defines politics merely as "constraint" or "affordance." Under this definition, gravity is political because it prevents me from flying; a heavy door is political because it prevents a child from opening it.

  Politics is not merely about *limitation*; it is about **authority, hierarchy, and the distribution of collective goods.** A constraint becomes political only when it maps onto a *social asymmetry* (class, race, citizenship, ability) rather than a random or universal physical limitation.

  **The Fix:** Redefine "political design" not as "shaping action," but as **"materialized legislation."** An artifact is political when its design *enforces a specific social order* or *distribution of power* that could otherwise be contested by human agents.

  ### 2. Reject Premise (6): The Denial of Specificity
  **Your Premise (6):** *That more pointed character cannot come from the design itself, because by (2) the design itself only ever yields the generic shaping that even a staircase has.*

  **Why reject it:** This step assumes that all design constraints are "generic." They are not. A staircase has a generic height determined by ergonomics and gravity. A bridge clearance of 9 feet is not a generic necessity of "bridgeness"; it is a **specific parameter** chosen from a range of possibilities (it could have been 12 feet, 14 feet, etc.).

  The "pointed character" *does* come from the design, but specifically from the **precision of the constraint.** The politics lies in the *tolerance*. The bridge is not just "a barrier"; it is a barrier calibrated *exactly* to the height of a bus but *above* the height of a car. That calibration is a feature of the design itself, distinct from the generic function of a staircase.

  ### 3. Restating the Thesis
  To keep the bridge without implicating the bench, you need to shift from "Artifacts constrain action" to "Artifacts delegate authority."

  **Revised Principle:**
  > An artifact carries politics in its design when it **stabilizes a power relation** by embedding a social decision into a material form that is difficult to reverse without physical reconstruction.

  **How this solves the dilemma:**

  *   **The Staircase:** A staircase constrains action (you must climb), but it does not typically stabilize a *social hierarchy*. It discriminates based on mobility, which is largely random or biological, not a contested political category (unless we are talking about disability access, in which case the *lack* of a ramp becomes the political artifact). The staircase is a solution to a physical problem (gravity).
  *   **The Low Bridge:** The bridge is a solution to a *social* problem (segregation) disguised as a physical one. It delegates the job of a "No Buses" sign (which can be ignored or legislated against) to concrete (which cannot be argued with).
  *   **The Bench:** A bench with armrests prevents sleeping. Is this political? Under your original argument, yes. Under the revised argument: **Only if** the intent and effect are to exclude a specific class of people (the homeless) from public space. If the armrests are for structural support, it's engineering. If they are to prevent lying down, it is "defensive architecture." The revised thesis allows you to investigate the *function of the constraint* rather than just its existence.

  ### 4. Addressing the "Intention" Problem (Steps 7 & 8)
  Your argument worries that if we admit intention or context, the design is no longer doing the work. This is a false dichotomy.

  Think of the design as a **crystallization** of intention.
  *   **Before construction:** The exclusion of buses is a political debate (intent/context).
  *   **After construction:** The exclusion of buses is a physical fact (design).

  The politics is "in the design" because the design **makes the political decision durable.** A law can be repealed by a vote; a low bridge can only be repealed by a jackhammer. The design *locks in* the politics. Therefore, the design *carries* the politics, even if the politics *originated* in a human mind.

  ### 5. Summary of the Escape Route
  To escape your dilemma, you should argue:

  1.  **Reject (1):** Politics is not mere constraint; it is the encoding of *social authority*.
  2.  **Reject (3):** Staircases and bridges are not political in the "same way." One manages physics; the other manages social access.
  3.  **Reject (6):** Specific design parameters (clearance height) are not "generic shaping"; they are precise calibrations that embody specific choices.

  **The Restated Claim:**
  > "Artifacts have politics not because they limit action (all tools do that), but because they **act as silent legislators**. They enforce specific distributions of power and access that align with broader social hierarchies, and they do so with a rigidity that human laws lack."

  This preserves the "low bridge" as a paradigmatic case (it legislates class segregation via concrete) while exempting the "staircase" (which legislates nothing more than the law of gravity) unless the staircase is specifically designed to exclude wheelchairs in a context where access is a civil right.

  This approach aligns with the work of **Langdon Winner** (who you are channeling), **Bruno Latour** (who speaks of "delegation" to non-humans), and **Madeleine Akrish** (who speaks of the "script" embedded in technology). They would agree with you that the dilemma is real, but they would resolve it by tightening the definition of "politics" to mean **power relations**, not just **physical effects**.
