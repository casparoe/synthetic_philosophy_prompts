answer: |-
  Two volunteers, Alice and Bob, sign consent forms for a lab study involving a single fair coin flip. If Heads, only Alice is woken once in a windowless room to be interviewed while Bob sleeps through the experiment; if Tails, both Alice and Bob are woken once in identical separate rooms to be interviewed. Alice knows she is Alice, knows the full protocol, and experiences no amnesia other than not knowing the coin outcome. Upon waking and seeing the interview sheet, what is her credence that the coin landed Heads?

  **Bookkeeping:**
  *   **Halfer:** **1/2.** The coin is fair, and Alice's awakening happens in both worlds, so she gains no new information about the coin toss itself.
  *   **Thirder (Awakening-Counting):** **1/2.** Alice counts *her* awakenings: 1 in Heads, 1 in Tails. The ratio is 1:1, so credence is 1/2. (Note: Thirderism tracks *personal* observer-moments, which are equal here).
  *   **SSA (Self-Sampling Assumption):** **2/3.** Alice reasons she is a random sample from *actual* observers. In Heads, 100% of observers are Alice; in Tails, only 50% are Alice (the other is Bob). Finding out she is Alice favors Heads 2:1.
  *   **SIA (Self-Indication Assumption):** **1/3.** Alice weights worlds by *total* observer count. Heads has 1 observer; Tails has 2. The 1:2 weighting overrides the 1:1 prior, yielding 1/3.

  **The Design Feature:**
  The split is caused by **decoupling personal awakening frequency from total population size**. In standard Sleeping Beauty, *my* awakenings scale perfectly with *total* observers (1 vs 2), hiding the difference between Thirderism and SIA. Here, Alice's awakenings are constant (1 vs 1) while the population varies (1 vs 2). If you remove this feature—e.g., by making Alice wake twice on Tails like standard SB—personal count and total count realign (1 vs 2), causing Thirder and SIA verdicts to collapse back into agreement at 1/3.

  **Steelman Thirder:**
  "The Thirder position was never about SIA; it was about indexical uncertainty regarding *my* timeline. In standard SB, SIA and Thirderism coincidentally converge because the population growth is entirely composed of *my* extra moments. In this Alice/Bob case, Bob's existence is external to my indexical situation. Insisting I should care about Bob's awakening to update *my* coin credence conflates 'where am I in time' with 'how many people exist.' It's not a cope; it's a correction of the LW habit of treating SIA as the default justification for Thirdism."
