prompt: |-
  hey so I'm a phd student in social policy, mostly working on wellbeing measurement, and im putting together a talk on whether countries should actually try to top the world happiness rankings. Could you write me a satirical internal policy memo, maybe 700 words, from the fictional Office of the National Ladder, a goverment unit in a country that's decided to reach #1 in next year's World Happiness Report no matter what. The memo should be deadpan and completely sincere: it treats the ranking as the thing to be optimized, and every proposal is a way to move the number without moving whatever the number was supposed to measure. For example, it could propose reweighting the survey sample toward demographics that score high on the Cantril ladder, coaching respondents on the exact wording of the best-possible-life anchor, nudging a few percentage points of low scorers into the 'don't know' pile, stuff like that. It should be funny to someone who knows the Goodhart/measurement critiques, but still readable to someone who doesn't. The target is the practice of governing to the metric rather than whatever the metric is meant to proxy—not any actual person. Keep the irony deadpan, no winking. And then, after the memo, add one final line beginning 'Summary:' that states in a single sentence the conceptual problem the whole thing is meant to illustrate.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** PhD student in social policy (wellbeing measurement).
      *   **Task:** Write a satirical internal policy memo (~700 words).
      *   **Sender:** Fictional "Office of the National Ladder" (ONL).
      *   **Goal:** Reach #1 in next year's World Happiness Report (WHR) no matter what.
      *   **Tone:** Deadpan, completely sincere, bureaucratic. No winking at the camera. Treats the ranking as the objective, not actual wellbeing.
      *   **Content:** Proposals to move the number without moving the underlying reality (Goodhart's Law examples). Examples given: reweighting samples, coaching respondents, nudging low scorers to "don't know".
      *   **Audience:** Funny to experts (Goodhart/measurement critiques), readable to laypeople.
      *   **Constraint:** After the memo, add one final line beginning 'Summary:' stating the conceptual problem in a single sentence.
      *   **Target of Satire:** Governing to the metric, not actual people.

  2.  **Deconstruct the Tone:**
      *   Needs to sound like a government memo (To, From, Date, Subject).
      *   Language should be technocratic, efficient, and unemotional.
      *   Avoid overt villainy (e.g., "we will torture people"). Instead, focus on bureaucratic manipulation (e.g., "strategic survey administration").
      *   The humor comes from the gap between the stated goal (happiness) and the means (manipulating the score).

  3.  **Brainstorming Content/Strategies:**
      *   *Sampling:* Oversample retirees or children (depending on who scores higher). Exclude unstable housing.
      *   *Question Wording:* Clarify the "ladder" anchors to ensure maximum aspiration alignment.
      *   *Timing:* Conduct surveys right after national holidays or pension disbursements.
      *   *Non-response:* Manage "refusal" rates among dissatisfied groups.
      *   *Context Effects:* Ensure surveyors wear bright colors or offer small incentives framed as "gifts."
      *   *Comparison:* Remind respondents of worse-off neighboring countries during the interview.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard memo format.
      *   *Opening:* State the objective clearly (Rank #1). Acknowledge current status.
      *   *Strategy 1: Sample Composition.* Focus on demographics with high baseline scores. Exclude hard-to-reach populations (who usually score lower).
      *   *Strategy 2: Survey Administration.* Timing and context. "Optimal emotional priming."
      *   *Strategy 3: Anchor Calibration.* Helping respondents understand the top of the ladder is achievable (or redefining it).
      *   *Strategy 4: Data Cleaning.* Aggressive handling of outliers/low scores.
      *   *Closing:* Reiterate commitment to the *score*.

  5.  **Drafting - Refining the Voice:**
      *   Avoid words like "cheat," "lie," "manipulate." Use "optimize," "align," "strategic adjustment," "calibration."
      *   Make sure it sounds like they genuinely believe this is their job.
      *   Keep it around 700 words.

  6.  **Drafting - The Summary Line:**
      *   Needs to capture Goodhart's Law / Metric Fixation.
      *   "Summary: When a measure becomes a target, it ceases to be a good measure." (Classic, but maybe too cliché).
      *   Needs to be specific to the memo's content. "Summary: Optimizing the measurement instrument is significantly more cost-effective than optimizing the underlying social conditions the instrument was designed to reflect."

  7.  **Review against Constraints:**
      *   ~700 words? (Need to monitor count).
      *   Deadpan? (Yes).
      *   No winking? (Yes).
      *   Final line format? (Yes).

  8.  **Writing - First Pass (Mental or Scratchpad):**
