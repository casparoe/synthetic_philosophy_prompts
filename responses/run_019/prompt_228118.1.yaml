          *   **Hayek:** Shifted the argument. Agreed calculation is hard, but emphasized the *knowledge problem* (tacit, dispersed knowledge). It's not just "too big," it's *unavailable* to a central body.
      *   *Claim 2: Lange answered that a planning board could set prices and adjust them by trial and error, basically solving the equations by hand.*
          *   **Accurate:** This is the core of "Market Socialism." Lange proposed simulating the market.
