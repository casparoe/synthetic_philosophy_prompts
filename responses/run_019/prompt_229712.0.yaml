      *   **Section 1: Non-Negotiable Desiderata (The Hard Constraints):** These are things *any* reading of OC must account for to be faithful to the text and the phenomena.
          *   Ontological Ambiguity (Belief vs. Enactment).
          *   The Regress Stopper (Unjustified Justifiers).
          *   The Dynamics of Change (Drift & Inheritance).
      *   **Section 2: Motivating Cases:** Integrate the requested cases (Moore, Skepticism, etc.) into the explanations of the desiderata.
