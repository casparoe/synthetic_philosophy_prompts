answer: |-
  To settle the dispute between the **substantive hinge epistemologist** (who treats hinges as a distinct epistemic category grounding knowledge) and the **therapeutic deflationist** (who treats hinge talk as a grammatical remark dissolving the urge for grounding), we must establish the criteria any adequate interpretation of *On Certainty* must satisfy.

  The following desiderata distinguish between what the text and phenomena *require* (Non-Negotiable) and what specific interpretive schools *prefer* (Interpretive Preferences). The conclusion identifies the **Aporia of Hinges**: a set of jointly unsatisfiable requirements that explains why the dispute persists.

  ---

  ### I. Non-Negotiable Desiderata
  *Any theory claiming to explicate Wittgenstein's hinges must satisfy these conditions to remain faithful to the text and the phenomenology of doubt.*

  #### 1. The Ontological Ambiguity Requirement
  **Desideratum:** The theory must define hinges as neither standard propositional attitudes (beliefs subject to truth-evaluation) nor mere non-cognitive behavioral dispositions (reflexes). They must occupy a category that allows them to function as the *scaffolding* of thought without being *objects* of thought.
  *   **Motivating Case:** **Moorean Certainty.** When Moore says "Here is a hand," he treats it as a known proposition. Wittgenstein argues this is a misuse; the certainty of the hand is not a super-knowledge but a logical condition of the language-game. A theory that makes hinges "beliefs" invites the skeptic to ask for evidence; a theory that makes them "reflexes" fails to explain their role in reasoning.
  *   **Constraint:** The theory must explain how a hinge can be *expressed* propositionally (e.g., "The earth exists") without functioning propositionally (i.e., without being tested).

  #### 2. The Regress-Termination Requirement
  **Desideratum:** The theory must explain how hinges halt the epistemic regress of justification without functioning as dogmatic, self-evident axioms. They must enable doubt and inquiry precisely by being exempt from them.
  *   **Motivating Case:** **Radical Skepticism.** The skeptic demands justification for the reliability of memory or the external world. If hinges are justified, they are not hinges; if they are arbitrary, they cannot support knowledge.
  *   **Constraint:** The theory must articulate how a commitment can be **epistemically groundless** yet **normatively binding**. It must distinguish "certainty" (subjective/grammatical) from "knowledge" (objective/justified).

  #### 3. The Dynamic Stability Requirement (Drift and Inheritance)
  **Desideratum:** The theory must model how hinge commitments are stable enough to support inquiry but fluid enough to change over time without conscious revision. This requires two specific mechanisms:
  *   **A. Hinge Inheritance:** Explaining how later beliefs acquire their standing from an inherited background without explicit teaching.
      *   *Motivating Case:* **Inductive Practice.** A child learns that fire burns not by verifying the law of causality, but by absorbing it as the background against which specific causal claims are tested.
  *   **B. Hinge Drift:** Explaining how a commitment's role changes gradually from unquestioned scaffolding to contestable claim (or vice versa).
      *   *Motivating Case:* **Gradual Conceptual Change.** The proposition "The sun revolves around the earth" shifted from a hinge (unquestioned framework) to an empirical hypothesis (testable claim) to a falsehood. This shift was not a single revision but a change in the *role* the proposition played.
  *   **Constraint:** Change cannot be modeled as standard belief revision (updating based on evidence), because hinges determine what counts as evidence.

  #### 4. The Immanence Requirement
  **Desideratum:** The theory must explain how rational criticism is possible across different hinge systems without assuming a neutral, "God's-eye" standpoint.
  *   **Motivating Case:** **Deep Disagreement.** When a secular scientist and a religious creationist disagree on the age of the earth, they are not merely disagreeing on facts; they are operating with different hinges.
  *   **Constraint:** The theory must allow for persuasion or conversion without implying one side is irrational *by their own lights*, while avoiding a slide into "anything goes" relativism.

  ---

  ### II. Interpretive Preferences
  *These are not requirements for adequacy, but rather the divergent goals of the competing schools. Recognizing these as preferences clarifies where the dispute is verbal versus substantive.*

  | Feature | **Substantive Epistemology** (e.g., Pritchard, Moyal-Sharrock) | **Therapeutic/Deflationary** (e.g., Stroll, Diamond) | **Naturalistic** (e.g., Stroud, empirical readings) | **Relativist** (e.g., Wright, Kusch) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Goal** | Save knowledge from skepticism by positing a new epistemic category. | Dissolve the philosophical urge to ground language-games. | Explain hinges as biological/cultural evolutionary adaptations. | Explain rationality as local to hinge-communities. |
  | **Preference** | Hinges are *entitlements* or *non-epistemic warrants*. | Hinges are *grammatical rules* disguised as propositions. | Hinges are *animal certainties* (instincts). | Hinges are *arbitrary* community choices. |
  | **Risk** | Reintroduces foundationalism Wittgenstein rejected. | Risks making Wittgenstein silent on normative epistemology. | Risks reducing normativity to causality. | Risks making rational critique impossible. |

  ---

  ### III. The Aporia: Jointly Unsatisfiable Desiderata
  *The dispute between substantive and therapeutic readings persists because the non-negotiable desiderata above generate tensions that cannot be simultaneously resolved. An adequate theory must acknowledge which horn of these dilemmas it accepts.*

  #### 1. The Normativity-Arbitrariness Tension
  *   **Desideratum A:** Hinges must be **exempt from doubt** to function as the framework for inquiry (Regress-Termination).
  *   **Desideratum B:** Hinges must not be **arbitrary** to avoid relativism and allow for rational critique (Immanence).
  *   **The Conflict:** If hinges are exempt from doubt because they are *grammatical* (Therapeutic), they are normative but lack truth-apt content. If they are exempt from doubt because they are *psychologically compelling* (Naturalistic), they are non-arbitrary but merely causal. If they are *entitlements* (Substantive), they claim normative force without evidence, which looks suspiciously like dogmatism.
  *   **Unsatisfiability:** You cannot explain why we *cannot* doubt hinges (necessity) without making them look like arbitrary facts of nature (contingency). To say "we simply do not doubt" describes a fact; to say "we *should* not doubt" prescribes a norm. Wittgenstein oscillates between both.

  #### 2. The Universality-Historicity Tension
  *   **Desideratum A:** Hinges must be **universal enough** to make communication and shared inquiry possible (Ontological Ambiguity).
  *   **Desideratum B:** Hinges must be **historically contingent** to explain Hinge Drift and conceptual change (Dynamic Stability).
  *   **The Conflict:** If hinges are the "scaffolding of our thoughts," they appear universal to humans (e.g., "objects don't vanish when unobserved"). But if they drift (e.g., from geocentric to heliocentric frameworks), they are historical products.
  *   **Unsatisfiability:** A theory cannot fully account for the *necessity* we feel toward our hinges (they feel like logic) while simultaneously accounting for their *mutability* (they change like theories). If they change, they were never truly foundational; if they were foundational, they shouldn't change.

  #### 3. The Criticism-Neutrality Tension
  *   **Desideratum A:** We must be able to **criticize** another's hinge system (e.g., calling a conspiracy theorist irrational) (Immanence).
  *   **Desideratum B:** We cannot assume a **neutral standpoint** outside all hinge systems to launch that criticism (Immanence).
  *   **The Conflict:** To criticize a hinge, you must treat it as a claim. But if you treat it as a claim, you are no longer treating it as a hinge, and you are begging the question against the other system.
  *   **Unsatisfiability:** Rational persuasion across hinge systems requires a shared standard. If the disagreement is *about* the standard (the hinges), there is no shared standard. A theory must either admit that some disagreements are rationally resolvable only by force/conversion (Relativist) or posit a hidden universal rationality (Substantive), both of which strain the text of *On Certainty*.

  ### IV. Conclusion: Settling the Dispute
  To settle the dispute, your friend must acknowledge that **no single theory can satisfy all Non-Negotiable Desiderata without violating the Aporia.**

  *   **If you prioritize the Normativity-Arbitrariness tension:** You must choose between a **Substantive Reading** (hinges are special warrants, risking dogmatism) or a **Therapeutic Reading** (hinges are grammatical, risking quietism).
  *   **If you prioritize the Universality-Historicity tension:** You must choose between a **Naturalistic Reading** (hinges are biological facts) or a **Relativist Reading** (hinges are cultural artifacts).

  **The Verdict:** An adequate theory of hinges is not one that resolves these tensions, but one that **explicitly maps them.** The dispute arises because the Substantive Epistemologist tries to solve the Regress-Termination requirement at the cost of the Dynamic Stability requirement (making hinges too rigid), while the Therapist tries to solve the Ontological Ambiguity requirement at the cost of the Normativity requirement (making hinges too thin).

  To move forward, agree on which desideratum is primary. If the goal is to **save knowledge**, accept Substantive Epistemology and concede that hinges are a unique, non-evidential warrant. If the goal is to **understand Wittgenstein**, accept the Therapeutic reading and concede that "hinge theory" is itself a misunderstanding of the grammatical remarks. You cannot have both a theory of hinges and a dissolution of the need for theory.
