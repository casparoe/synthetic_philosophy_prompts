          *   Case: Conversion (religious/scientific), Conceptual change (geocentric to heliocentric).
          *   Need: Mechanism for "Hinge Drift" and "Inheritance."

      *   *Requirement 4: Normativity (Criticism and Relativism)*
          *   Problem: If hinges are arbitrary, anything goes. If they are universal, how do we explain disagreement?
          *   Case: Deep disagreement (Wright).
          *   Need: Rational criticism without a neutral standpoint.

      *   *Requirement 5: The Tension Check (Joint Unsatisfiability)*
