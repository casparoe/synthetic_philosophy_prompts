      *   *Therapeutic/Deflationary Reading:* Talk of "hinges" is grammatical remarking to show skepticism is nonsense. There is no "hinge theory." (e.g., Stroll, some readings of Cavell).
      *   *The Prompt's Goal:* The prompt asks me to write the desiderata *for the purpose of settling the dispute*. This implies creating a framework that tests whether a theory holds water, potentially revealing why the dispute exists (via the unsatisfiable desiderata).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Ontological Status (What are they?)*
