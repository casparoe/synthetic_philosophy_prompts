answer: |-
  Here is a complete design for your 45-minute session. It is built to be run by you, requires minimal prep, and focuses on experiential learning followed by a structured debrief.

  ### Session Overview
  *   **Title:** "The Bidding War"
  *   **Time:** 45 Minutes
  *   **Participants:** 14 Engineers
  *   **Goal:** To viscerally experience the pressure of escalation of commitment and map it to engineering decision-making without a pre-session lecture.

  ### Materials Needed
  1.  **The Prize:** One tangible item worth roughly $50–$100 (e.g., a nice bottle of whiskey, a gift card, or a "Team Lunch Fund" voucher). *Note: Get budget approval for this beforehand.*
  2.  **Whiteboard & Markers:** To track bids publicly.
  3.  **Play Money (Optional):** You can just write numbers on the board, but handing out 10 sheets of paper labeled "$10" to each person makes the loss feel more real. Let's stick to **Whiteboard Only** to reduce scrounging.
  4.  **Timer:** Your phone.

  ---

  ### Part 1: The Game (15 Minutes)

  **Setup (2 mins)**
  Gather the group. Do **not** mention sunk costs, psychology, or the learning objective yet. Frame it as a "break activity."

  **Script:**
  > "We're going to play a quick auction game. I have this [Prize] here. I'm selling it to the highest bidder. However, there are two special rules:
  > 1. Bids must increase by at least $5.
  > 2. **The top two bidders both pay their final bids.** The highest bidder gets the prize. The second-highest bidder pays their bid and gets nothing. Everyone else pays nothing."

  *Write the rules clearly on the whiteboard.*

  **The Auction (10 mins)**
  *   **Starting Bid:** $5.
  *   **Your Role:** Act as a neutral but slightly energetic auctioneer. Encourage speed. "Do I hear $10? $10 is cheap for this."
  *   **The Trap:** The bidding will likely move fast until it hits the value of the prize (e.g., $50).
  *   **The Climax:** Once bids exceed the prize value (e.g., $55 vs $60), the dynamic shifts. The person at $55 realizes if they stop, they lose $55. If they bid $65, they only lose $5 (if the other person stops).
  *   **Hard Stop:** If they go too long, cut it off at a predetermined limit (e.g., $150 total combined bids) to save debrief time. Say: "Freeze. The market is closed."

  **Settlement (3 mins)**
  *   Announce the winner and the runner-up.
  *   **Crucial:** Do **not** actually collect money. This is a simulation.
  *   **Script:** "Nobody is actually paying anything. This was a simulation. Please take a breath. Look at the numbers on the board."

  ---

  ### Part 2: The Debrief (25 Minutes)

  This is where the learning happens. Move from emotion to analysis.

  **Phase 1: The Gut Check (5 mins)**
  Ask the top two bidders first, then the room.
  *   "For the two of you in the hot seat: What was going through your mind when the bids passed the value of the prize?"
  *   "For the rest of the room: At what point did you realize this was a trap? Why didn't you stop it?"
  *   *Listen for:* "I didn't want to lose what I'd already put in," "I thought they would blink first," "It felt personal."

  **Phase 2: Mapping to Engineering (10 mins)**
  Draw a line down the whiteboard. On the left is "The Game," on the right is "Our Work." Ask the team to map the mechanics.

  | The Game | Engineering Reality |
  | :--- | :--- |
  | **The Prize** | The Feature / Launch / OKR |
  | **The Bid** | Sprints / Dev Hours / Budget |
  | **Rule: 2nd Place Pays** | Political Capital / Reputation / Resume Risk |
  | **The Trap** | "We're 90% done, we can't stop now." |

  *Prompt:* "In the game, the rule was explicit: 2nd place pays. In our work, who enforces that rule? Is it the business? Is it us?"

  **Phase 3: Naming the Theory (5 mins)**
  Now you can introduce the concepts.
  *   **Sunk Cost Fallacy:** Ignoring the fact that past investment cannot be recovered.
  *   **Escalation of Commitment:** Increasing investment in a decision despite negative evidence.
  *   **Key Insight:** "In the game, you kept bidding to minimize *loss*, not to maximize *gain*. Do we do that with legacy code or failing projects?"

  **Phase 4: Mitigation Strategies (5 mins)**
  Ask: "If we played this again, how would you win?"
  *   *Answers:* Don't play. Collude (agree to bid $5 and split). Set a hard limit beforehand.
  *   *Application:* "What is the engineering equivalent of 'Not Playing'? How do we set 'Kill Criteria' for a project before we start?"

  ---

  ### Part 3: The Wrap-Up (5 Minutes)

  Summarize the actionable takeaways.
  1.  **Pre-commitment:** Define success and failure metrics *before* writing code.
  2.  **Psychological Safety:** Ensure engineers feel safe killing a project without being the "second place bidder" (i.e., punished for failure).
  3.  **External Review:** Sometimes you need someone not in the auction to tell you to stop.

  ---

  ### What Will Probably Go Wrong (And How to Fix It)

  **1. The "Fizzle" (No one bids past the prize value)**
  *   **Risk:** The group is too rational or cynical. They stop at $45 for a $50 item. The lesson is lost.
  *   **Fix:** If bidding stalls, nudge the "loss aversion." Ask the second-place bidder: "You're at $40. If you stop now, you pay $40 for nothing. A $50 bid wins you the item. Is it worth $5 to win?"
  *   **Backup:** If it truly fizzles, acknowledge it in the debrief: "You avoided the trap. Why? What conditions in this room made it safe to stop that don't exist in our sprint planning?"

  **2. The "Blow-Up" (Someone gets genuinely angry)**
  *   **Risk:** A participant feels tricked or embarrassed, especially if they are competitive.
  *   **Fix:** Emphasize heavily during settlement: "This is a simulation. No money changes hands. Your performance is not being judged." If someone seems agitated, validate them immediately: "It is designed to feel frustrating. That frustration is the data point."

  **3. The "Hero" (One person bids $500 immediately)**
  *   **Risk:** Someone tries to "break" the game by bidding the max immediately.
  *   **Fix:** Set a rule beforehand: "Bids must increase by exactly $5" or "You have 10 seconds to bid or you're out." This forces the incremental escalation.

  **4. The "Management Trap" Perception**
  *   **Risk:** The team thinks this is a critique of their past performance ("Boss thinks we waste money").
  *   **Fix:** Frame it as a systemic human brain bug, not an engineering incompetence issue. "This happens to CEOs, Generals, and Gamblers. It's a human bug, not an eng bug."

  ---

  ### Limitations of the Analogy (For Your Wrap-Up)

  Be honest about where the game diverges from reality. This builds trust and shows nuance.

  **1. Clear Rules vs. Ambiguous Reality**
  *   **Game:** You know *exactly* what the prize is worth ($50) and *exactly* what the penalty is (2nd place pays).
  *   **Reality:** We rarely know the true value of a feature until it's built. The "cost" of stopping is often vague (e.g., "disappointing the VP" vs. actual dollars).
  *   **Your Job:** You must supply the ambiguity in the debrief. Ask: "In the game, you knew you were losing. In our work, how do we know a project is failing? Is it possible we're just in the 'dip' before success?"

  **2. Individual vs. Collective**
  *   **Game:** Individual bidders making individual choices.
  *   **Reality:** Engineering decisions are collective. Escalation often happens because *no single person* feels empowered to stop the machine.
  *   **Your Job:** Highlight that in real life, the "Second Place Penalty" is often social (loss of status) rather than financial.

  **3. Settled vs. Contested Theory**
  *   **Settled:** Rational decision-making models dictate that sunk costs should be ignored. Empirically, humans consistently fail to ignore them. (This is well-documented).
  *   **Contested:** *Why* we fail is debated.
      *   *Behavioral View:* It's a cognitive bias (loss aversion, framing). We are irrational.
      *   *Signaling View:* It's actually rational. If I quit a project, I signal "quitter" to management. Continuing signals "grit." The cost isn't the money; it's the career capital.
      *   *Organizational View:* It's inertia. Stopping requires more energy (meetings, approvals, explanations) than continuing.
  *   **Your Job:** Don't present the "Bias" view as the only truth. Ask your team: "Is continuing a failing project irrational, or is it a rational response to how we are rewarded?" This opens a safer conversation about company culture.

  ### Facilitator Cheat Sheet (Keep this in your pocket)

  *   **If the room goes silent:** "Remember, the second-highest bidder pays. If you stop now, you lose everything you've bid."
  *   **If they laugh it off:** "Laughing is a defense mechanism. Notice how you're coping with the stress of the loss."
  *   **If they blame the auctioneer:** "I'm just the market. The market doesn't care. You set the bids."
  *   **Key Phrase to use:** "Are you bidding to win, or bidding to avoid losing?"
