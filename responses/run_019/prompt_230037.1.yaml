answer: |-
  To evaluate Lexical Threshold Negative Utilitarianism (LTNU) fairly, we must first establish a set of desiderata that any credible axiology of severe suffering ought to satisfy. These criteria are not merely hurdles for LTNU but represent the broader philosophical pressures that any theory prioritising the mitigation of extreme agony must address. The following table outlines these requirements, the dilemmas that force them, their negotiability for a proponent of LTNU, and the tensions they create.

  ### Desiderata for an Axiology of Severe Suffering

  | Desideratum | Forcing Case / Dilemma | Negotiability for LTNU | Tensions / Incompatibilities |
  | :--- | :--- | :--- | :--- |
  | **1. Intensity Dominance** | *The Torture vs. Dust Specks Case:* Intuition suggests one instance of extreme torture is worse than any number of trivial annoyances. | **Non-negotiable.** This is the core claim of LTNU. Without it, the view collapses into standard aggregative utilitarianism. | Conflicts with **Aggregation Coherence**. If intensity always trumps number, we may be forced to prioritise one victim over millions in borderline cases. |
  | **2. Threshold Non-Arbitrariness** | *The Sorites Paradox:* If suffering is a continuum, drawing a sharp line where lexical priority begins appears metaphysically magical or arbitrary. | **Non-negotiable** for credibility. A theory relying on a magical boundary is vulnerable to charges of superstition or ad hocery. | Conflicts with **Empirical Robustness**. Pain is subjective and vague; a precise threshold may not map onto neurophysiological reality. |
  | **3. Value Structure Clarity** | *The Commensurability Problem:* Can mild pleasure ever cancel mild pain? If severe pain is lexical, are positive and negative welfare on one scale or two? | **Negotiable.** LTNU can posit two separate scales (asymmetry) or one scale with infinite disvalue at the threshold. | Conflicts with **Intuitive Trade-offs**. If scales are separate, it becomes hard to justify risking mild pain for mild pleasure in daily life. |
  | **4. Deontic Distinction** | *The Natural Evil Case:* Is severe suffering bad if caused by an earthquake? Yes. Is it prohibited? No (no agent). The view must distinguish badness from wrongness. | **Non-negotiable.** Failing this leads to absurdities where natural disasters are 'moral violations' or agent-inflicted torture is merely 'unfortunate'. | Conflicts with **Action-Guidance**. If the badness is lexical but the prohibition is not, agents may lack clear directives in triage situations. |
  | **5. Aggregation Coherence** | *The Many vs. One Case:* Can we inflict severe pain on one to prevent mild headaches for a billion people? LTNU says no; intuition often wavers. | **Negotiable** (but costly). LTNU accepts 'intransitivity' here. To be credible, it must explain why saving the many does not override the one. | Conflicts with **Intensity Dominance**. Satisfying this usually requires abandoning lexicality (returning to weighted aggregation). |
  | **6. Empirical Robustness** | *The Adaptation Problem:* Pain intensity fluctuates and adapts. A fixed threshold may not account for psychological habituation or measurement error. | **Non-negotiable.** A moral theory cannot demand the impossible regarding measurement. | Conflicts with **Threshold Non-Arbitrariness**. Vague empirical data makes a precise non-arbitrary threshold impossible to locate in practice. |

  ### Evaluation of Rival Views

  We now test four competing frameworks against these desiderata to see where they falter.

  1.  **Classical Hedonistic Utilitarianism (CHU):**
      *   **Performance:** Fails **Intensity Dominance**. CHU aggregates all welfare on a single scale. Sufficient dust specks *do* outweigh torture.
      *   **Strengths:** Passes **Aggregation Coherence** and **Threshold Non-Arbitrariness** (as it requires no threshold).
      *   **Verdict:** Excluded by the demand that severe suffering possesses a special moral gravity that cannot be summed away.

  2.  **Plain Negative Utilitarianism (PNU):**
      *   **Performance:** Fails **Intensity Dominance** (in the lexical sense). While it prioritises suffering over pleasure, it typically allows the aggregation of mild suffering to outweigh severe suffering (e.g., minimising total units of pain).
      *   **Strengths:** Passes **Value Structure Clarity** (single scale of disvalue).
      *   **Verdict:** Excluded because it treats a lifetime of mild annoyance as potentially worse than a brief period of agony, violating the specific intuition LTNU seeks to capture.

  3.  **Prioritarianism:**
      *   **Performance:** Fails **Intensity Dominance**. It weights the welfare of the worse off more heavily, but the weighting function is continuous, not lexical. Enough mild benefits for the well-off can outweigh severe harms to the worst-off.
      *   **Strengths:** Passes **Aggregation Coherence** better than LTNU; handles **Empirical Robustness** well (no sharp line).
      *   **Verdict:** Excluded because it lacks the 'lexical break' required to absolutely prohibit trading severe agony for mild gains.

  4.  **Rights-Based Anti-Torture View:**
      *   **Performance:** Passes **Intensity Dominance** and **Deontic Distinction**. Torture is prohibited regardless of consequences.
      *   **Weaknesses:** Struggles with **Threshold Non-Arbitrariness** (defining the exact boundary of 'torture' vs. 'interrogation' is notoriously vague) and **Aggregation Coherence** (rights conflicts often lack resolution mechanisms).
      *   **Verdict:** The strongest rival, but vulnerable on the precision of the threshold.

  ### The Most Exclusionary Requirement

  The analysis reveals that the primary fault line in axiologies of suffering is not the measurement of pain or the distinction between badness and prohibition, but the structural relationship between intensity and quantity.

  Classical Hedonistic Utilitarianism, Plain Negative Utilitarianism, and Prioritarianism all share a common structural feature: they are aggregative and continuous. They assume that value differences are matters of degree, not kind. Consequently, they all fail the requirement of **Intensity Dominance**. They cannot accommodate the intuition that a specific intensity of suffering creates a moral 'event horizon' beyond which aggregation ceases to function. Only the Rights-Based view and LTNU attempt to meet this condition.

  While the **Threshold Non-Arbitrariness** requirement is the most damaging to LTNU itself (and the Rights view), it does not exclude the aggregative candidates, as they do not posit a threshold. Therefore, the requirement that filters out the greatest number of competing candidates from the set of plausible axiologies is the demand that severe suffering must take absolute priority over aggregated mild welfare.

  \answer{Intensity Dominance}
