  Concede that metrics can be gamed, but deny that targeting makes them useless. Say: "Goodhart's Law warns us to design robust metrics, not avoid them. We should pair CSAT with quality audits and resolution rates to prevent gaming. Let's discuss mitigation, not abandonment." This shifts the debate from *whether* to measure to *how* to measure, neutralizing the slogan's fatalism while accepting its wisdom. Use this to pivot to solution design.
