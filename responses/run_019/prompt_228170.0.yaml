answer: |-
  Your friend's summary is a solid "elevator pitch" version of Van Fraassen's Reflection Principle, but as you suspected, it glosses over some crucial philosophical nuances. Your intuition about the "drunk" case is actually a famous objection in the literature (often called the problem of **impending irrationality**).

  Here is a breakdown of what a Van Fraassen fan would accept, what they would correct, and where the debates stand.

  ### 1. What a Van Fraassen Fan Would Accept

  **The Core Formulation:**
  Your friend is right about the basic math. Van Fraassen's Reflection Principle states that your current credence in a proposition $A$, *conditional on* your future credence in $A$ being $r$, should be $r$.
  $$C_{now}(A \mid C_{future}(A) = r) = r$$
  If you are certain *now* that you will believe $A$ to degree 0.9 tomorrow, you should believe it to degree 0.9 today.

  **The Dutch Strategy:**
  Your friend is correct that Van Fraassen uses a **diachronic Dutch Book** argument to support this. Unlike a standard Dutch Book (where a bookie makes you lose money on bets placed simultaneously), a Dutch *Strategy* involves bets placed at different times. If you violate Reflection, a clever bookie can construct a strategy where you lose money regardless of how the world turns out, *provided* your future credences are predictable.

  **The Link to Conditionalization:**
  Your friend is right that Reflection is deeply connected to Conditionalization. Van Fraassen argues that Conditionalization (updating by conditioning on new evidence) is actually a special case of Reflection. If you know you will learn evidence $E$ and *nothing else*, Reflection dictates you should update your beliefs as if you have already conditionalized on $E$.

  ### 2. What Gets the Principle/Motivation Subtly Wrong

  **The "Future Self Knows More" Rationale:**
  This is the part that bugged you, and your bug is justified. Van Fraassen does **not** argue that you should defer because your future self objectively *knows more*. He argues you should defer because you currently *endorse* your future self's rationality.

  *   **The Correction:** The principle relies on **current trust**, not future omniscience. It is a constraint on your current state of mind regarding your future state of mind.
  *   **The Drunk Counterexample:** Your "about to get drunk" example is the standard counterexample used by philosophers like David Christensen. If you know you are about to drink a gallon of whiskey, you know your future credences will be wild. Van Fraassen's response is that Reflection only applies when you regard your future self as **rational**. If you know you'll be drunk, you do not satisfy the condition of trusting your future judgment. Therefore, Reflection does not require you to match your drunk future self's credences.
      *   *Nuance:* A strict Van Fraassen fan might say the principle still holds formally, but the antecedent is false (you aren't certain your future credence will be $r$ *via a rational process*). A critic would say the principle needs to be explicitly modified to include a "rationality clause."

  **"Changing Mind Without Evidence is Incoherent":**
  Your friend says violating Reflection shows that "changing your mind without getting new evidence is incoherent." This is slightly imprecise.
  *   **The Correction:** Violating Reflection shows you are **temporally inconsistent**. It implies you think your future self will be wrong, but you have no reason *now* to think they will be wrong (since you haven't seen the evidence they will see). It's not that changing your mind is incoherent; it's that *anticipating* a change in mind without anticipating the *reason* for that change is incoherent.

  ### 3. Does the Punchline About Conditionalization Follow?

  Your friend says: *"Reflection plus conditionalization forces rational agents to only ever update on new evidence."*

  A Van Fraassen fan would correct the direction of the logic. They wouldn't say "Reflection **plus** Conditionalization." They would say **"Reflection entails Conditionalization."**

  *   **Van Fraassen's Argument:** He views Reflection as the more fundamental principle. If you accept Reflection, Conditionalization falls out of it automatically (under the assumption that you know what evidence you will receive).
  *   **Why it matters:** If your friend treats them as two separate tools working together, they miss Van Fraassen's main philosophical move. Van Fraassen wanted to ground the rule of Conditionalization (which can seem arbitrary) in the more intuitive idea of respecting your own future rational judgment.

  ### 4. Contested vs. Settled Issues

  You asked to flag what is contested. In Bayesian epistemology, almost nothing is "settled," but here are the battle lines regarding Reflection:

  **1. The Status of Diachronic Dutch Books (Contested)**
  *   **Friend's Claim:** The Dutch book shows violating Reflection is irrational.
  *   **Contestation:** Many philosophers (e.g., Peter Maher, Brad Armendt) argue that diachronic Dutch Books (losing money over time) do not prove irrationality in the same way synchronic Dutch Books (losing money instantly) do. A synchronic book shows your beliefs are logically inconsistent *now*. A diachronic book shows you might make a series of decisions that look bad in hindsight, but some argue this is a pragmatic failure, not an epistemic one.

  **2. The Problem of Forgotten Evidence (Contested)**
  *   **The Issue:** Suppose you learn $E$ today, update on it, and then tomorrow you forget $E$ but remember that you learned *something*. Your credence changes, but you haven't learned *new* evidence.
  *   **Contestation:** Strict Reflection struggles here. If you know you will forget $E$, your future credence won't match your current conditional credence. This suggests Reflection might be too strong for real human agents who forget things. Some propose "New Reflection" principles to handle this.

  **3. Accuracy vs. Pragmatism (Contested)**
  *   **The Issue:** Your friend focused on the betting (pragmatic) justification.
  *   **Contestation:** Modern epistemologists (like Hilary Greaves and David Wallace) often prefer **Accuracy Arguments** over Dutch Books. They argue you should satisfy Reflection not because you'll lose money, but because doing so minimizes the expected "inaccuracy" of your beliefs. A Van Fraassen fan might accept this, but Van Fraassen himself was famously anti-realist about truth and preferred the pragmatic/Dutch Book justification.

  ### Summary for Your Reply to Your Friend

  You can tell your friend:
  1.  **You're right on the math and the Dutch Strategy:** The formal setup and the betting argument are standard Van Fraassen.
  2.  **You're wrong on the "Knows More" rationale:** It's not that the future self knows more; it's that the current self *trusts* the future self. My "drunk" example proves that if I don't trust my future self, Reflection doesn't apply.
  3.  **The Conditionalization link is stronger than you think:** Van Fraassen doesn't think they are two separate rules; he thinks Reflection *proves* Conditionalization.
  4.  **The Dutch Book argument is controversial:** Many Bayesians today think losing money over time doesn't prove epistemic irrationality, only pragmatic poor planning.

  Your intuition was sharper than your friend's summary! The "drunk" case is the classic way philosophers test the limits of this principle.
