answer: |-
  Mr. Mayor, members of the Town Council, distinguished guests from the astronomical and astrological communities, teachers, students, and citizens of Weil der Stadt.

  It is a profound honor to stand here in 2030, four hundred years after Johannes Kepler left this world. We gather to unveil a monument, but as I look out at this audience, I suspect we are also gathering to negotiate a peace treaty. I see the astronomers, who fear I might give too much credit to the superstitions of the past. I see our friends from the astrological associations, who fear I might erase the very beliefs that kept bread on Kepler's table. And I see the Mayor, who has gently suggested that a dignified silence on these contradictions would be preferable to a noisy truth.

  But silence is not what Kepler gave us. He gave us noise. He gave us arguments. He gave us the friction of a mind rubbing against the universe until it sparked. So, with the Mayor's permission, I will not offer a sanitized Kepler. I will offer you the real one. And to do that, I must answer two difficult questions that hover over this ceremony like the planets themselves.

  The first question is this: How can we honor a man's achievement when the framework he himself thought unified it was false?

  We know the story. Kepler wanted to prove that the five perfect Platonic solids—cubes, tetrahedrons, and the like—were nested inside the spheres of the planets, dictating their distances from the sun. It was a beautiful dream. It was also wrong. We know, too, that he believed the angles of the planets cast geometric rays upon the earth, influencing the weather and the human soul. He sought to rebuild astrology on the laws of harmony. In this, too, he failed to convince his peers or posterity.

  So, why celebrate him? Is it not strange to build a monument to a man whose master plan was a mistake?

  Consider a climber scaling a mountain in the dark. He reaches for a ledge, believing it is solid rock. It turns out to be a branch. It bends. It nearly breaks. But because he grabbed it, he shifted his weight just enough to see a handhold he otherwise would have missed. The branch was not the mountain. The branch was not even solid. But without that reach, without that specific error, he does not find the path.

  Kepler's nested solids were that branch. They were wrong, but they forced him to look for a physical reason for why planets were where they were. He was not satisfied with just describing the motion; he demanded to know the cause. He demanded that the heavens obey a single, intelligible logic. When the data from Tycho Brahe refused to fit the solids, Kepler did not fudge the numbers. He let the beautiful theory break. He kept the truth—the elliptical orbits—even though it shattered his own dream of perfect circles.

  We honor him not because he was right about everything, but because he was willing to be wrong in public, in print, and in detail, provided the universe told him he was wrong. He taught us that a false hypothesis is not a sin if it is used as a tool to dig for a deeper truth. His errors were scaffolding. Once the building was standing, the scaffolding could be removed. We live in the building.

  This leads to the second, sharper question. It is a question for my friends in the astronomical society and our guests from the astrological association alike. What distinguishes being wrong in the way Kepler was wrong from being wrong in the way the astrologers he despised were wrong?

  Let us be clear: Kepler did cast horoscopes. He did believe the heavens touched the earth. He did not believe, as many of us do now, that the cosmos is a cold, distant vacuum unrelated to human life. He believed the sun was a source of power, of light, of force that swept the planets along. He believed that same light interacted with the earth's geometry to influence the weather and, subtly, human temperaments.

  So, where is the line?

  The line is drawn at the word "How."

  The astrology of Kepler's day—and much of ours—operates on the language of symbols. It says: Mars is red, Mars is war, therefore Mars in this sign means conflict. It is a language of correspondence, of meaning. It asks, "What does this signify?"

  Kepler looked at that system and grew frustrated. He asked, "How does this happen?" He wanted a mechanism. He wanted to know how the light of a planet physically altered the air of the earth or the spirit of a man. He called astrology the "foolish daughter" of astronomy not because he denied the relationship, but because he felt she was begging for money without explaining her trade. He thought the astrologers were peddling rules without a cause.

  Kepler's error was a scientific error. He proposed a physical cause—geometry and light acting as forces—that could, in principle, be tested, measured, and disproven. And indeed, much of it was. The astrologers' error, the one Kepler fought, was often a refusal to submit to that test. It was a system of meaning that protected itself from physics.

  We distinguish them not by sincerity. Kepler was sincere. Many astrologers are sincere. We distinguish them by the willingness to follow the physical evidence even when it destroys the meaning. Kepler chose the physics. He chose the hard, cold mechanism over the comforting, warm symbol. That is the difference. One path leads to a system of interpretation that can endure forever because it is flexible. The other path leads to science, which advances only by breaking its own idols.

  I know this is not the simple story a schoolchild might expect. You are taught that heroes are right. But Kepler teaches us something better. He teaches us that you can be deeply, profoundly mistaken about the world, and yet contribute to its understanding, provided you are honest about the mistake when the data reveals it.

  And where better to learn this lesson than here?

  Weil der Stadt. I have walked the streets of this town this morning. I have seen the light catch the red roofs of the old houses, the same light that Kepler watched reflect off the tiles when he was a boy. There is a specific quality to the sky here, in the Swabian hills. It feels close. It feels like a ceiling that one might, with enough effort, touch.

  When Kepler looked up from this valley, he did not see a dead expanse. He saw a machine, a clockwork, a harmony. He felt the pull of it in his bones. He was a man of his place, shaped by the hills that surround us, by the piety of this region, by the struggles of a family that knew war and poverty. He was not a disembodied mind floating in space. He was a son of Weil der Stadt who looked up and refused to look away.

  We erect monuments for two reasons. Sometimes, we erect them to say, "The work is finished. The truth is captured. Here it stands." But if we do that to Kepler, we lie. His work was not finished. The truth was not captured; it was chased.

  So, let this monument stand for the other reason. Let it stand as a marker of the struggle. Let it remind the schoolchildren that you do not need to be perfect to be great. Let it remind the astronomers that our ancestors walked through shadows to find the light. And let it remind the astrologers that Kepler's respect for the stars was so great that he demanded they obey physical laws, not just human stories.

  We are not here to bury the contradictions of Johannes Kepler. We are here to crown them. For it was in the tension between what he believed and what he saw that the modern world was born.

  The monument awaits. It is not a statue of a saint. It is a statue of a questioner. I invite you all to come forward, to touch the bronze, and to look up. Not to find the answers Kepler found, but to ask the questions Kepler asked.

  Thank you.
