  **INTERNAL MEMORANDUM**

  **TO:** Front Desk Team, Night Porterage, Concierge
  **FROM:** Arthur P. Cantor, Duty Manager
  **DATE:** 24 May 2024
  **RE:** Occupancy Management / Transfinite Protocols

  Thank you for your diligence during last night's peak occupancy period. While the arrival of multiple infinite parties alongside a fully booked house presents logistical complexities, our service standards must remain seamless. To ensure consistency in future shifts, please adhere to the following accommodation protocols.

  1.  **Single Late Arrival (Full Occupancy):** When the hotel is fully occupied and a single guest arrives, instruct every current guest in room $n$ to relocate to room $n+1$. This vacates Room 1 for the new arrival. Please assist with luggage; guests often find the concept of simultaneous displacement disorienting.

  2.  **Infinite Coach Arrival (Single):** Should a coach carrying countably infinitely many guests arrive, instruct every current guest in room $n$ to relocate to room $2n$. This clears all odd-numbered rooms. Assign the new guests to rooms $2n-1$, where $n$ represents their position in the boarding queue. This ensures a one-to-one mapping without overlap.

  3.  **Infinite Coaches Arrival (Multiple):** For countably infinitely many coaches, each carrying countably infinitely many guests, existing guests must move to rooms $2^n$. New arrivals are to be accommodated using the standard diagonal enumeration protocol. Specifically, Passenger $j$ of Coach $i$ is assigned to the $k$-th odd-numbered room, where $k$ is calculated via the Cantor Pairing Function: $k = \frac{(i+j)(i+j+1)}{2} + j + 1$. The final room number is $2k-1$. Please have calculators ready at the desk.

  4.  **Continuum Guest Parties:** Occasionally, a coach claiming to carry a continuum of guests (e.g., passengers indexed by real numbers between 0 and 1) will arrive. These parties cannot be accommodated. This is not a matter of inconvenience but of cardinality. The set of rooms is countably infinite ($\aleph_0$), whereas the set of guests on such a coach is uncountably infinite ($\mathfrak{c}$). No bijection exists between the two sets. Politely explain that the hotel physically cannot map their party to our room numbers, regardless of how densely we pack the corridors.

  5.  **Guest Relations – Finitist Impulses:** Be prepared for guests who struggle with the topology of the property. We received the following complaint this morning:
      > "I have walked down the corridor for twenty minutes. I insist there is a last room at the end. I demand you show me the key for Room Infinity so I can sleep without hearing neighbours on one side."
      
      **Manager's Reply:** "Dear Guest, thank you for your feedback. For the avoidance of doubt, Hilbert's Hotel possesses no final room. The corridor extends indefinitely; thus, a 'last room' is a geometric impossibility. We cannot issue a key for Room Infinity as no such integer exists. We trust you will find your current accommodation satisfactory."

  **FOR THE AVOIDANCE OF DOUBT**

  *   **Room Numbers:** All room numbers must remain positive integers. Do not attempt to allocate Room 0, Room $\omega$, or Room $\pi$.
  *   **Relocation Timing:** All guest moves should be conducted simultaneously where possible to prevent guests from encountering one another in the halls during the transition.
  *   **Capacity:** While our capacity is infinite, it is strictly countable. Do not promise availability to uncountable sets.

  Thank you for your continued commitment to infinite hospitality.

  **Arthur P. Cantor**
  Duty Manager
