answer: |-
  You have put your finger on the central problem in the comparative study of corruption. The disagreement in your seminar isn't a bug; it's the feature. Political scientists and sociologists have spent decades trying to draw exactly the lines you are struggling with.

  There is no single English word that perfectly captures the distinction between your Case 1 and Case 2, but there is a established conceptual framework that explains why the room splits. The distinction you are looking for is usually framed as **Private Appropriation vs. Political Exchange**, often analyzed through the lens of **Universalism vs. Particularism**.

  Here is the breakdown of the terminology, the "carving features," and the specific test your classmates are applying.

  ### 1. Naming the Three Cases
  To understand the line, we first need to label the points on either side of it.

  *   **Case 1 (Mayor/Brother-in-law):** This is **Venal Corruption** (or *Kleptocracy*/*Embezzlement*).
      *   *Definition:* The use of public office for **private enrichment**.
      *   *Key Feature:* The benefit is excludable to the official's private sphere (family bank account). There is no public good produced (the meals are overpriced).
  *   **Case 2 (Legislator/Motorway):** This is **Clientelism** (specifically *Pork-Barrel Politics*).
      *   *Definition:* The exchange of public resources for **political support**.
      *   *Key Feature:* The benefit flows to a *constituency* (voters, donors), not just the official's pocket. The official gains *political capital* (votes), not just cash.
  *   **Case 3 (Clerk/Gift):** This is **Gift Exchange** (or *Social Lubrication*).
      *   *Definition:* A transfer meant to establish or maintain a **social relationship**, not necessarily to purchase a specific illegal act.
      *   *Key Feature:* Ambiguous *quid pro quo*. If the rule isn't bent, it functions as a "tip" or a ritual of respect rather than a bribe.

  ### 2. The Feature That Does the "Carving Work"
  You asked what feature separates the "corruption" label from the "representation" label. It is not primarily about whether a rule is broken (Case 2 is often legal). It is about **The Locus of Benefit** and **The Nature of the Return**.

  #### A. Who Captures the Surplus? (Private vs. Political)
  *   **Case 1:** The surplus (the extra money charged) is captured by the **private self**. This violates the *Public-Private Divide*.
  *   **Case 2:** The surplus (the motorway) is captured by the **political group** (constituents). The official gets votes, but the constituents get concrete goods.
  *   **The Test:** Your classmates who defend the legislator are applying a **Public Purpose Test**. They argue that because the money was spent on public infrastructure (even if strategically located), it serves a public end, whereas the mayor's contract served only a private end.

  #### B. Is the Exchange Specific or Diffuse? (Quid Pro Quo)
  *   **Case 1:** Specific exchange. Money for Contract.
  *   **Case 2:** Diffuse exchange. Public Goods for Generalized Loyalty (Votes).
  *   **Case 3:** Relational exchange. Gift for Social Smoothness (no specific decision required).
  *   **The Test:** In political theory, **Bribery** requires a specific *quid pro quo* (money for *this* vote/decision). **Clientelism** (Case 2) is often defended because the exchange is diffuse: "I bring money to the district; you give me a mandate to represent you." It is viewed as the *job description*, not a deviation from it.

  ### 3. The Theoretical Framework: Universalism vs. Particularism
  The deeper academic name for the tangle you are in is the tension between **Universalism** and **Particularism** (derived from Max Weber and Talcott Parsons).

  *   **Universalism:** Rules apply to everyone equally. (The ideal bureaucracy).
  *   **Particularism:** Rules are bent or applied based on relationships.

  All three of your cases are forms of *Particularism*. The disagreement in your room is about **Authorized Partiality**.
  *   **Case 1 (Unauthorized):** The bureaucracy is not authorized to favor family. This is **Deviant Particularism**.
  *   **Case 2 (Authorized):** The electoral system *authorizes* representatives to favor their constituents. This is **Institutionalized Particularism**.
  *   **Case 3 (Culturally Authorized):** The local culture authorizes small gifts to smooth social friction. This is **Embedded Particularism**.

  When half your room says the legislator is "not corrupt," they are arguing that her particularism is **authorized by the electoral mandate**. She was elected specifically to steer resources to her district. To *not* do so would be bad representation.

  ### 4. Why the Disagreement? (Heidenheimer's Classification)
  The reason you can't find a clean line is that "corruption" is not an objective fact; it is a normative judgment. Political scientist Arnold Heidenheimer created a framework specifically for this seminar room disagreement:

  1.  **Black Corruption:** Everyone agrees it is corruption (Case 1).
  2.  **Gray Corruption:** Elites might say it's okay, but the public says it's not (or vice versa). Or, it violates a law but not a norm (Case 2 often falls here).
  3.  **White Corruption:** Most people agree it is *not* corruption, even if it technically bends rules (Case 3 often falls here in its local context).

  The split in your room regarding the legislator exists because she is operating in **Gray Corruption**. To those who prioritize **Universalism** (fairness across all districts), it is corruption. To those who prioritize **Representation** (doing what your voters want), it is duty.

  ### 5. Summary: The "Test" Your Classmates Are Using
  To answer your specific question about what test the "not corrupt" group is applying:

  They are using the **Beneficiary Test** combined with the **Mandate Test**.
  1.  **Beneficiary:** Did the value stay in the official's private pocket (Corruption) or flow to a constituent group (Representation)?
  2.  **Mandate:** Is this behavior prohibited by the office (Corruption) or is it an expected function of the office (Representation)?

  **The Terminology You Need:**
  If you need a label for the distinction between Case 1 and Case 2, the most precise academic phrasing is the distinction between **Venal Corruption** (private enrichment) and **Clientelistic Exchange** (political redistribution).

  If you need a label for why Case 2 and 3 are defended, call it **Authorized Particularism**.

  **Recommendation for your Seminar:**
  Stop asking "Is this corruption?" and start asking **"Whose particularism is authorized here?"**
  *   In Case 1, no one authorized the family's enrichment.
  *   In Case 2, the voters authorized the district's enrichment.
  *   In Case 3, the culture authorized the clerk's gratuity.

  The "tangle" isn't confusion; it's the friction between different systems of legitimacy (Legal-Rational vs. Electoral vs. Traditional).
