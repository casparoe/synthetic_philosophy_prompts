      Mayor, Deputy Lieutenant, families, students, and most importantly, those taking the oath today. Welcome.

      We are gathered to witness a transformation. In a moment, you will pledge allegiance to this country, and in doing so, you will become British citizens. But there is another record we keep here, specific to this borough. Since the 1920s, we have maintained a leather-bound Roll of the Borough. When you leave this room, your names will be entered into it. It is an old custom, but like many old customs, it conceals a complex truth about what we are doing here.

      Recently, there has been discussion about who decides the form of this ceremony. It is a reasonable question. Democracy rests on the idea that people choose the rules by which they are governed. Yet, here we face a difficulty. You did not vote on the requirements that brought you to this chair. The boundary of who counts as 'us'—the people entitled to decide—was settled by those already on this side of it. To pretend otherwise would be dishonest. The rules of entry were not ratified by those seeking entry.

