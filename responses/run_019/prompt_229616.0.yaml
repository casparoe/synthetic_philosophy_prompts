      This Roll does not simply list new names; it records the alteration of the community itself. It acknowledges that the line was drawn unilaterally, yes, but also that crossing it changes the shape of the space on this side. Your presence here revises the story of this place. You are not guests in a house built by others; you are co-authors of the next chapter.

