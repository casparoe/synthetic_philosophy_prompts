prompt: |-
  I'm a science journalist, and my editor's go-to line in story meetings is "we don't publish what we don't know." Last week he spiked a piece because the claim came from a reliable source and was overwhelmingly likely to be true, but he said it wasn't something we knew. I think that slogan is doing more work than it can bear, but I keep losing the argument about exactly which reading I'm objecting to. Can you lay out the distinct precise principles that line could be asserting — knowledge norm, truth norm, belief norm, justification norm, maybe a certainty threshold — and for each tell me whether its independently plausible, whether it's trivial or does real work, and whether it actually licenses his call to spike the story. I'd rather get a menu of readings with verdicts than one true interpretation, and I especially want to know which reading his argument needed to go through.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Science journalist.
      *   **Context:** Editor uses the slogan "we don't publish what we don't know."
      *   **Conflict:** Editor spiked a story based on a reliable source + high likelihood (but not absolute certainty/official confirmation). Editor claims this violates the slogan. User thinks the slogan is being misapplied or is too vague.
      *   **Task:** Break down the slogan into distinct philosophical/epistemological principles (Knowledge Norm, Truth Norm, Belief Norm, Justification Norm, Certainty Threshold, etc.).
      *   **Requirements:** For each principle, assess:
          1.  Independent plausibility.
          2.  Triviality vs. Real Work.
          3.  Whether it licenses the editor's decision to spike the story.
      *   **Goal:** Provide a "menu of readings with verdicts" rather than one true interpretation. Identify which reading the editor's argument *needed* to go through.

  2.  **Deconstruct the Slogan ("We don't publish what we don't know"):**
      *   The core tension is between *knowledge* ($K$) and *publication* ($P$).
      *   The slogan implies a norm: $P(x) \rightarrow K(x)$ (If you publish $x$, you must know $x$).
      *   The specific case: The claim is likely true, source is reliable, but it's not "known" in the editor's strict sense.
      *   Philosophical angle: Epistemology of testimony, assertion norms, journalistic ethics.

  3.  **Brainstorming the Principles/Readings:**

      *   *Reading 1: The Knowledge Norm of Assertion (KNA).* This is the standard philosophical view (Williamson, etc.). You should only assert what you know.
      *   *Reading 2: The Truth Norm.* You should only publish what is true. (But how do we check truth beforehand?)
      *   *Reading 3: The Justification/Evidence Norm.* You should only publish what you have sufficient evidence for. (This is where "reliable source" usually fits).
      *   *Reading 4: The Certainty/Infallibility Threshold.* "Know" is being used colloquially to mean "know for sure beyond any doubt."
      *   *Reading 5: The Institutional/Official Knowledge Norm.* "Know" means "confirmed by official channels/public record," not just epistemic status.
      *   *Reading 6: The Belief Norm.* You should only publish what you believe. (Too weak).

  4.  **Developing the Verdicts for Each Reading:**

      *   *Knowledge Norm (KNA):*
          *   Plausibility: High in philosophy, debated in journalism.
          *   Work: Real work. Distinguishes knowledge from lucky guess.
          *   Licenses Spike? *Maybe.* Does a reliable source + high likelihood constitute knowledge? In standard epistemology, often yes (justified true belief + no defeaters). If the editor says it's *not* knowledge, he might be raising the bar too high.
      *   *Truth Norm:*
          *   Plausibility: High goal, but impractical as a pre-publication constraint (omniscience required).
          *   Work: Trivial/Impossible. We can't know truth beforehand.
          *   Licenses Spike? No, because we never "know" truth beforehand in the absolute sense.
      *   *Justification Norm:*
          *   Plausibility: Very high for journalism.
          *   Work: Real work. Focuses on process.
          *   Licenses Spike? *No.* The prompt says the source was reliable and claim likely true. That *is* justification. So this norm would support *publishing*, not spiking.
      *   *Certainty/Infallibility Norm:*
          *   Plausibility: Low (philosophically), High (colloquially).
          *   Work: Real work (stops speculation).
          *   Licenses Spike? *Yes.* This is likely what the editor means. "Known" = "Confirmed beyond doubt."
      *   *Institutional Verification Norm:*
          *   Plausibility: High for mainstream science journalism.
          *   Work: Real work (protects against rumors).
          *   Licenses Spike? *Yes.* If "know" means "independently verified by us or official record," then a leak (even reliable) isn't "known."

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the tension. Validate the user's frustration (the slogan is ambiguous).
      *   **The Menu:** Present the 4-5 distinct readings clearly.
      *   **Analysis per Reading:** Use the requested criteria (Plausibility, Triviality/Work, Licenses Spike?).
      *   **The "Needed" Reading:** Identify which one the editor actually relied on.
      *   **Counter-Argument Strategy:** Give the user ammo to fight back based on the analysis.

  6.  **Refining the Content (Self-Correction/Nuance):**
      *   *Correction on KNA:* In epistemology, knowledge usually requires truth. If the claim is "overwhelmingly likely," it *might* be false. So strictly speaking, if it turns out false, they didn't know it. But pre-publication, we judge based on evidence. I need to distinguish between *factive* knowledge (must be true) and *professional* knowledge (verified).
      *   *Refining the Editor's Move:* The editor is likely conflating "Justification" with "Truth." Or, more likely, he is using a high-bar definition of Knowledge that requires *independent verification* rather than *testimony*.
      *   *Journalistic Context:* Science journalism often waits for peer review or official press embargoes. A "reliable source" might be a leaker. That's a key distinction. "Knowing" in newsrooms often means "We have confirmed this ourselves," not "Someone told us."

  7.  **Drafting the Sections (Mental Outline):**
      *   **Intro:** The slogan is a "knowledge norm of publication."
      *   **1. The Factive Truth Norm:** Publish only truths. (Impossible to follow strictly).
      *   **2. The Standard Knowledge Norm (KNA):** Publish only what you know (JTB+). (Does reliable source = knowledge? Usually yes).
      *   **3. The Certainty/Infallibility Norm:** Publish only what is indubitable. (Too high a bar, but explains the spike).
      *   **4. The Institutional Verification Norm:** Publish only what the *organization* has verified. (This is the most likely practical reading).
      *   **5. The Justification Norm:** Publish only what is well-supported. (Supports the journalist).
      *   **Diagnosis:** The editor is sliding between KNA and Institutional Verification/Certainty.
      *   **Advice:** How to argue back.

  8.  **Final Polish:** Ensure tone is professional, analytical, and helpful to a journalist. Make sure the "Verdicts" are clear. (Check against prompt requirements: "menu of readings," "verdicts," "which reading his argument needed").

      *(Self-Correction during drafting)*: I need to be careful with the "Knowledge Norm." In philosophy, you can't know a falsehood. So if the editor says "we don't know it," he might mean "we haven't established truth conditions." But in newsrooms, "knowing" is often procedural. I will distinguish between *Epistemic Knowledge* and *Procedural Knowledge*.

      *Let's settle on these 4 key readings:*
      1.  The Factive Truth Norm (Publish $p$ only if $p$ is true).
      2.  The Epistemic Knowledge Norm (Publish $p$ only if the journalist stands in the relation of knowledge to $p$).
      3.  The High-Bar Certainty Norm (Publish $p$ only if $p$ is beyond reasonable doubt).
      4.  The Institutional Verification Norm (Publish $p$ only if the newsroom has independently verified $p$).

      *Wait, I should include the Justification Norm as a contrast because it helps the journalist.*
      Okay, I'll add **The Sufficient Evidence Norm** as the counter-position.

      *Which one did the editor need?* He needed the **Institutional Verification** or **High-Bar Certainty** norm. The Epistemic Knowledge norm is shaky because reliable testimony *can* constitute knowledge.

      *Let's write it.*
answer: |-
  This is a classic conflict between epistemological theory and newsroom practice. Your editor is invoking a **Norm of Publication**, but the slogan "we don't publish what we don't know" is ambiguous enough to hide several different standards.

  In philosophy of language and epistemology, this is usually discussed as the **Knowledge Norm of Assertion (KNA)**: *One should assert that $p$ only if one knows that $p$.* Your editor is adapting this to journalism: *One should publish that $p$ only if one knows that $p$.*

  The problem, as you've sensed, is that "know" is doing too much heavy lifting. Below is a menu of five distinct readings of that slogan. For each, I have assessed its plausibility, whether it is trivial or action-guiding, and whether it actually justifies spiking your story.

  ### 1. The Factive Truth Norm
  **The Principle:** We do not publish claims that are false. (Implicitly: To "know" something is for it to be true).
  *   **Plausibility:** High as an ideal, low as a pre-publication constraint.
  *   **Trivial or Work?** **Trivial/Impossible.** No journalist has access to God's-eye truth before publication. If this norm requires actual truth, it cannot guide decision-making because you cannot check it until after the fact.
  *   **Licenses the Spike?** **No.** If the standard is "don't publish falsehoods," you can't use it to spike a story *now*, because you don't know yet if it's false. You would have to wait until the truth is revealed.

  ### 2. The Standard Epistemic Knowledge Norm (KNA)
  **The Principle:** We do not publish unless we stand in the relation of *knowledge* to the claim (Justified True Belief + no defeaters).
  *   **Plausibility:** Moderately High. This is the standard philosophical view on assertion.
  *   **Trivial or Work?** **Real Work.** It distinguishes between a lucky guess, a hunch, and a warranted claim. It demands justification.
  *   **Licenses the Spike?** **Debatable (Likely No).** In standard epistemology, testimony from a reliable source *can* constitute knowledge. If your source is reliable and there are no defeaters (reasons to doubt them), you arguably *do* know the claim, even without independent verification. If your editor spiked it, he is likely claiming that testimony alone isn't enough for knowledge. This is a controversial philosophical stance (anti-reductionism vs. reductionism about testimony), not a settled fact.

  ### 3. The High-Bar Certainty Norm
  **The Principle:** We do not publish unless we are certain (beyond all reasonable doubt). Here, "know" is used colloquially to mean "know for sure."
  *   **Plausibility:** Low (philosophically), High (psychologically). Skepticism tells us certainty is rare.
  *   **Trivial or Work?** **Real Work (Paralyzing Work).** This sets the threshold for "knowledge" at infallibility.
  *   **Licenses the Spike?** **Yes.** This is the most likely reading your editor is using. Even if the claim is "overwhelmingly likely," if there is a 1% chance it's a leak, a misunderstanding, or a lie, you aren't "certain." This norm licenses spiking anything that isn't officially confirmed.

  ### 4. The Institutional Verification Norm
  **The Principle:** We do not publish unless *the newsroom* has independently verified the claim. "We know" means "We have checked," not "I have a good source."
  *   **Plausibility:** High for mainstream science journalism. It protects against being used as a propaganda conduit.
  *   **Trivial or Work?** **Real Work.** It shifts the locus of knowledge from the individual journalist to the organization's process.
  *   **Licenses the Spike?** **Yes.** This is the strongest practical justification for the spike. Even if *you* know (via your source), the *institution* does not know (because they haven't verified it). The slogan becomes: "The publication doesn't publish what the publication hasn't verified."

  ### 5. The Sufficient Evidence Norm (Your Position)
  **The Principle:** We do not publish unless we have sufficient justification to warrant belief. Here, "know" is a proxy for "well-supported."
  *   **Plausibility:** High. This aligns with professional journalistic ethics (e.g., SPJ Code of Ethics: "Seek truth and report it").
  *   **Trivial or Work?** **Real Work.** It allows for publishing breaking news based on strong testimony without waiting for absolute confirmation.
  *   **Licenses the Spike?** **No.** This is the norm you are arguing for. If the source is reliable and the claim likely, you have sufficient evidence. Under this reading, spiking the story is cowardice or excessive caution, not adherence to a knowledge norm.

  ***

  ### Diagnosis: Which Reading Did His Argument Need?

  To spike the story, your editor's argument **needed** to rely on either **Reading 3 (Certainty)** or **Reading 4 (Institutional Verification)**.

  *   **Why not Reading 2 (Standard KNA)?** If he argued that you literally *don't know* the claim, he enters a philosophical minefield. Testimony from a reliable source is widely accepted as a source of knowledge. If he admits the source is reliable, he concedes you have justification. To say you lack "knowledge" requires him to argue that testimony *never* yields knowledge without independent verification, which is a hard sell.
  *   **Why Reading 3 or 4?** By sliding "know" to mean "certainty" or "institutional verification," he bypasses the epistemological debate. He doesn't have to prove your source is unreliable; he just has to say, "We aren't sure enough" or "We haven't checked it ourselves."

  **The Verdict:** Your editor is likely using **Reading 4 (Institutional Verification)** but disguising it as **Reading 2 (Standard Knowledge)** to make it sound like an objective epistemological constraint rather than a policy choice.

  ### How to Argue Back

  You can now pinpoint the disagreement. You aren't arguing about whether you should publish falsehoods (Reading 1); you are arguing about the **threshold for knowledge**.

  1.  **Challenge the Definition:** Ask him: *"When you say we don't 'know' it, do you mean we aren't certain (Reading 3), or that the institution hasn't verified it (Reading 4)?"*
  2.  **If Certainty:** Point out that science journalism often requires reporting on preliminary findings (pre-prints, conferences) where certainty is impossible. If the norm is certainty, you can never break news.
  3.  **If Institutional Verification:** Acknowledge this is a valid policy, but argue it is a **resource allocation decision**, not an epistemological truth. It's not that "we don't know," it's that "we haven't spent the time to verify." That is a budget/staffing argument, not a slogan about truth.
  4.  **The "Knowledge" Trap:** Remind him that in epistemology, reliable testimony *is* a path to knowledge. If the source is reliable, you *do* know, by most philosophical standards. If he spikes it, he is admitting the slogan is actually "We don't publish what we haven't **double-checked**," which is a different, more conservative policy.

  **Summary for your next meeting:**
  The slogan is ambiguous. If it means "Don't publish lies," it's useless (you can't check beforehand). If it means "Don't publish without justification," your story passes. If it means "Don't publish without independent verification," that is a specific policy choice that should be defended as such, not hidden behind a vague epistemological slogan.
