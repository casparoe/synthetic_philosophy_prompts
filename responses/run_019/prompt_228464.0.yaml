prompt: |-
  Longtime lurker here, posting this because it came up in a thread on priors and I want to sanity-check my reading. I recently reread Hume's essay 'Of Miracles' (from the Enquiry) and his argument as I understand it goes roughly: a miracle is a violation of a law of nature, laws of nature are established by uniform experience, so the evidence for the law will always outweigh any testimony, meaning testimony can never make it rational to believe a miracle report.

  Neat result, but it seems to prove too much? On that logic nobody could ever rationally accept eyewitness reports of something genuinely unprecendented — the first meteorite falls, say, or radioactivity — because prior experience would always count against the report. But clearly we can and did accept such things, and were right to.

  So my question: roughly how many independent eyewitnesses would Hume's argument actually demand before a rational person should accept, e.g., a resurrection? Presumably there's some threshold of witnesses where the likelihood ratio swamps even a very low prior and the balance tips. And is Hume's maxim just an informal anticipation of Bayesian updating with extreme priors — i.e., something like Cromwell's rule applied to testimony — or is there anything in it that doesn't translate into the Bayesian frame? If it's the former, is the only real disagreement between Hume and the believer a disagreement about the size of the prior?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is a "longtime lurker" (implies familiarity with rationalist/philosophical discourse, likely LessWrong or similar communities) posting about Hume's "Of Miracles."
      *   **Core Understanding:** They summarize Hume's argument: Miracle = violation of law of nature; Law = uniform experience; Evidence for law > testimony; Therefore, testimony never suffices for belief.
      *   **Critique:** They identify the "proof too much" objection (e.g., meteorites, radioactivity). If prior experience counts against *any* unprecedented event, we'd never learn anything new.
      *   **Questions:**
          1.  How many witnesses would Hume demand for a resurrection? (Is there a threshold?)
          2.  Is Hume's maxim just informal Bayesian updating with extreme priors (Cromwell's Rule)?
          3.  Is there anything in Hume that *doesn't* translate to Bayes?
          4.  Is the disagreement just about the size of the prior?

  2.  **Deconstruct Hume's Argument (Section X of *An Enquiry Concerning Human Understanding*):**
      *   *Part 1:* The argument from principle. A miracle is a violation of a law of nature. A law of nature is established by "firm and unalterable experience." Therefore, the proof against the miracle is as strong as any argument from experience can possibly be. Testimony is also based on experience. So, it's experience vs. experience. The wise man proportions belief to the evidence. Since the evidence for the law is uniform, and testimony is fallible, the evidence against the miracle always outweighs the testimony *unless* the falsehood of the testimony would be more miraculous than the event itself.
      *   *Part 2:* Practical arguments against miracle reports (human fallibility, love of wonder, religious bias, conflicting religions).
      *   *The "Proof Too Much" Objection:* This is a standard criticism (often attributed to Campbell or later philosophers). Hume defines laws as *uniform* experience. If an event happens, does that break the uniformity? Hume would say a single report doesn't break the uniformity of the *law*. But the user is right: if we apply Hume's logic rigidly, we reject all novel phenomena.
      *   *Hume's Escape Hatch:* Hume actually addresses this slightly. He distinguishes between something *unusual* (which might be believed) and something *impossible* (a violation of a law). A meteorite is unusual; a resurrection is a violation of biological law. But where is the line drawn?

  3.  **Address Question 1: How many witnesses?**
      *   Hume actually gives a thought experiment! He says: "Suppose... the evidence of the miracle... should be such as to amount to an entire proof... I own there may possibly be miracles... but there is no instance of any such testimony."
      *   He specifies conditions: All human kind would have to have an interest in lying, the witnesses would need to be of unquestioned good sense, education, learning, undoubted integrity, reputation, etc., and the event happens in a public manner.
      *   *Bayesian Translation:* He's asking for a likelihood ratio $P(Testimony | Miracle) / P(Testimony | No Miracle)$ so high that it overcomes the prior odds $P(Miracle) / P(No Miracle)$.
      *   *The Number:* Hume doesn't give a number (e.g., "12 witnesses"). He gives qualitative criteria. But logically, if the prior is effectively 0 (or $1 - \epsilon$ where $\epsilon$ is tiny), the likelihood ratio must be astronomical.
      *   *The "Proof Too Much" Rebuttal:* Hume would argue meteorites aren't *miracles* in his sense. They don't violate a known law of nature (physics didn't say rocks can't fall from space; we just hadn't seen it). Resurrection violates the law "dead men stay dead."

  4.  **Address Question 2 & 3: Hume vs. Bayes:**
      *   *Is it Bayesian?* Yes, broadly. Hume is weighing probabilities. "A wise man... proportions his belief to the evidence." This is essentially Bayesian updating.
      *   *Cromwell's Rule:* Cromwell's Rule says "never assign probability 0 or 1." Hume *almost* assigns 0 to miracles. He says the evidence against a miracle is a "full proof." In Bayesian terms, if $P(Miracle) = 0$, no amount of evidence updates it. If $P(Miracle) = 10^{-100}$, you need likelihood ratio $> 10^{100}$.
      *   *Non-Bayesian Elements:* Hume's definition of a law of nature as "uniform experience" is tricky. If experience is truly *uniform* (100%), then the prior is 0. Bayes breaks with a prior of 0. Hume seems to treat the law of nature as having a probability of 1 based on past induction. This is the friction point.
      *   *The "Disagreement":* Is it just the prior?
          *   *Hume:* Prior is effectively 0 because "Law of Nature" = "Exceptionless Regularity."
          *   *Believer:* Prior is non-zero because God exists and intervenes.
          *   *Deep Disagreement:* It's also about the *Likelihood of Testimony*. Hume argues (Part 2) that testimony for miracles is inherently unreliable due to psychological/sociological factors. So he lowers the likelihood ratio $P(Testimony | Miracle)$ as well. It's not just the prior; it's also the reliability of the evidence channel.

  5.  **Synthesize the "Proof Too Much" Objection:**
      *   This is the strongest part of the user's query.
      *   Hume distinguishes between *marvels* (rare but consistent with laws) and *miracles* (violations of laws).
      *   Meteorites: We had no law saying "rocks never fall from sky." We had lack of observation.
      *   Resurrection: We have a law "humans die and do not return to life."
      *   *Problem:* How do we know it's a law and not just a regularity? This is the Problem of Induction. Hume knows this. He relies on the *strength* of the induction.
      *   *So, the threshold:* For a resurrection, the witnesses must be so credible that *their collective delusion or conspiracy* is more improbable than the dead man walking.

  6.  **Drafting the Response:**
      *   **Tone:** Respectful, analytical, acknowledging the user's sophistication (lurker on priors thread).
      *   **Structure:**
          1.  Validate the user's reading (it's the standard interpretation).
          2.  Address the "Proof Too Much" objection (Marvels vs. Miracles).
          3.  Address the Witness Threshold (Hume's specific criteria).
          4.  Bayesian Analysis (Priors, Likelihoods, Cromwell's Rule).
          5.  Where Hume diverges from strict Bayes (The definition of Law).
          6.  Conclusion on the nature of the disagreement.

  7.  **Refining the Bayesian Point:**
      *   Be careful not to say Hume *was* a Bayesian (anachronistic). Say his argument *maps* to Bayesian reasoning.
      *   Highlight that Hume attacks *both* the Prior (uniform experience) and the Likelihood (human nature makes miracle testimony suspect).
      *   The "Disagreement" isn't just the prior. It's also whether the testimony is independent. Hume argues religious testimony is never independent (contagion of enthusiasm).

  8.  **Self-Correction/Nuance Check:**
      *   *Did Hume say probability 0?* He says "proof against it." In Hume's terminology, "proof" is the highest level of probability (alongside "probability" and "presumption"). It's not logically impossible, but evidentially maximal. So it's not strictly $P=0$, but $P \approx 1$ against.
      *   *The Meteorite Example:* John Earman ("Hume's Abject Failure") is the go-to reference here. He argues Hume's argument *is* probabilistic and *does* fail if treated as such because it assigns priors too close to 0. I should mention Earman or the spirit of that critique.
      *   *The "Threshold":* Hume explicitly says he can *conceive* of testimony that would work (8 days of darkness, all historians agree). So he admits a threshold exists.

  9.  **Final Polish:** Ensure the distinction between Part I (in principle) and Part II (in practice) is clear, as this affects the Bayesian mapping (Priors vs. Likelihoods).

  **(Self-Correction during drafting):** I need to make sure I answer the specific question: "How many independent eyewitnesses?" Hume doesn't give a number. I need to explain *why* he doesn't (it's about quality/independence/context, not just N).

  10. **Final Plan:**
      *   Intro: Validate the "proof too much" objection (it's a classic one).
      *   Hume's Distinction: Marvels vs. Miracles (addresses the meteorite point).
      *   The Threshold: Hume's "8 days of darkness" example.
      *   Bayesian Mapping: Priors (Laws of Nature) vs. Likelihood (Testimony reliability).
      *   Cromwell's Rule: Hume violates it by treating laws as near-certain.
      *   The Real Disagreement: Priors + Likelihood (independence of witnesses).
      *   Reference: Mention John Earman's *Hume's Abject Failure*.

