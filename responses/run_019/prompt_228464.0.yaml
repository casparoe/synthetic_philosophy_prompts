answer: |-
  This is a classic objection to Hume, often called the "proof too much" or "novelty" objection. You are reading Hume correctly, but there are some nuances in his text (and in the Bayesian reconstruction of his argument) that address your specific questions.

  Here is a breakdown of how Hume's argument holds up under the Bayesian lens, where the threshold lies, and whether the disagreement is merely about priors.

  ### 1. The "Proof Too Much" Objection: Marvels vs. Miracles
  Your meteorite example is the standard counter-argument (famously pressed by George Campbell in the 18th century and later by John Earman). If uniform experience counts against any unprecedented event, we could never update on new phenomena.

  Hume has a response to this, though whether it satisfies depends on how you define "Law of Nature." Hume distinguishes between:
  *   **Marvels:** Events that are rare or unprecedented but do not contradict established laws (e.g., a man surviving a fall that usually kills, or a meteorite).
  *   **Miracles:** Events that constitute a *violation* of a law of nature (e.g., a dead man coming back to life).

  For Hume, a "Law of Nature" isn't just a regularity we haven't seen broken yet; it is a regularity established by **uniform** experience.
  *   **Meteorites:** Before the first observed fall, we had no law stating "Rocks cannot fall from the sky." We merely had a lack of observation. The prior probability was low, but not effectively zero.
  *   **Resurrection:** We have a law "Dead humans remain dead." This is supported by uniform experience of every human who has ever lived.

  Hume's argument is that the evidence for the *law* (billions of observations of death) constitutes a "full proof" against the miracle. Testimony is also evidence based on experience (our experience that testimony is usually true). So, it is **Experience (for the Law) vs. Experience (for the Testimony).**

  **The Bayesian Translation:**
  *   **Prior:** $P(Miracle)$ is incredibly low because it contradicts a law established by $N$ observations.
  *   **Likelihood:** $P(Testimony | Miracle)$ vs $P(Testimony | \neg Miracle)$.
  *   Hume argues that because the Prior is so heavily weighted by uniform experience, the Likelihood Ratio required to overcome it is astronomical.

  ### 2. How many witnesses would Hume demand?
  Hume actually answers this directly in *Part I* of the essay. He admits there is a theoretical threshold where testimony *could* outweigh the prior. He writes:

  > "I own there may possibly be miracles, or violations of the usual course of nature, of such a kind as to admit of proof from human testimony..."

  He then gives a thought experiment. He says he would believe a miracle if:
  1.  All historians in all languages agreed.
  2.  The event was public and undeniable (e.g., **8 days of total darkness** over the whole earth).
  3.  The witnesses were of unquestioned good sense, education, learning, and integrity.
  4.  They had nothing to gain (reputationally or materially) from the lie.

  **So, what is the number?**
  Hume does not give a specific integer (e.g., "12 witnesses"). He focuses on the **independence** and **quality** of the witnesses.
  *   If you have 1,000 witnesses, but they are all part of the same religious sect, Hume (in *Part II*) argues they are not independent. The "contagion of enthusiasm" makes $P(Testimony | \neg Miracle)$ high (i.e., it is likely they are all deluded or conspiring).
  *   To overcome a prior of effectively $1 - 10^{-100}$, you need a Likelihood Ratio that suggests the probability of *all* those witnesses lying or being mistaken is *less* than $10^{-100}$.

  For a resurrection specifically, Hume implies the bar is effectively unreachable in the real world because human testimony is never that robust. But in principle, if the entire scientific community observed a resurrection under controlled conditions, Hume concedes he would have to accept it.

  ### 3. Is Hume just doing Bayesian Updating with Extreme Priors?
  **Mostly, yes.** Hume's maxim ("No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish") is a verbal formulation of:

  $$ P(Miracle | Testimony) > 0.5 \iff \frac{P(T|M)}{P(T|\neg M)} > \frac{P(\neg M)}{P(M)} $$

  Hume is arguing that $\frac{P(\neg M)}{P(M)}$ (the prior odds against the miracle) is so massive that $\frac{P(T|M)}{P(T|\neg M)}$ (the reliability of the testimony) can never exceed it.

  **Where Hume diverges from strict Bayesianism (Cromwell's Rule):**
  Cromwell's Rule states you should never assign a prior probability of exactly 0 or 1, because then no evidence can update you.
  *   **Hume's Violation:** Hume treats "Laws of Nature" as having a probability so close to 1 that they function as 1. He calls the evidence against a miracle a "full proof." In Bayesian terms, if your prior is $P(M) = 0$, no amount of testimony updates the posterior. Hume hedges slightly ("possibly be miracles"), but his rhetoric treats the induction as complete.
  *   **The "Law" Problem:** The friction point is how we define a Law. If a Law is just "very strong induction," then Bayes applies. If a Law is "metaphysical necessity," then Bayes breaks. Hume is a skeptic about necessity, so he should treat laws as strong induction. If he treats them as strong induction, he *must* admit that sufficient evidence can overturn them. He admits this in theory (the 8 days of darkness) but denies it in practice (resurrections).

  ### 4. Is the disagreement just about the size of the prior?
  **No. It is also about the Likelihood Ratio.**

  This is the part of Hume's argument often missed in the "priors" discussion. In *Part II* of the essay, Hume attacks the reliability of miracle testimony itself. He argues:
  1.  **Psychological Bias:** Humans have a natural love of the wonderful.
  2.  **Social Contagion:** Miracle reports cluster in ignorant/barbarous nations or specific religious groups.
  3.  **Lack of Independence:** Witnesses to religious miracles are rarely independent observers; they are participants in a belief system.

  **In Bayesian terms:**
  *   **The Believer** assumes: $P(Testimony | \neg Miracle)$ is very low (Why would 12 apostles die for a lie? Why would honest people report this?).
  *   **Hume** assumes: $P(Testimony | \neg Miracle)$ is actually quite high (People lie, people are deluded, myths grow, groups reinforce falsehoods).

  So the disagreement is twofold:
  1.  **Priors:** The believer assigns a non-negligible prior to Divine Intervention ($P(M)$). Hume assigns a near-zero prior based on uniform experience of natural law.
  2.  **Likelihoods:** The believer assigns a high reliability to specific testimony ($P(T|M)$ is high, $P(T|\neg M)$ is low). Hume assigns a low reliability to miracle-specific testimony due to sociological factors ($P(T|\neg M)$ is high).

  ### Summary
  *   **The Threshold:** Hume demands a Likelihood Ratio where the falsehood of the testimony is more improbable than the violation of the law. For a resurrection, this likely requires global, public, scientifically verified observation by hostile witnesses, not just religious devotees.
  *   **Bayesian Mapping:** Hume is effectively performing Bayesian updating. His argument is that the Prior Odds against a miracle are so extreme that no real-world Testimony provides a high enough Likelihood Ratio to overcome them.
  *   **Cromwell's Rule:** Hume skirts the edge of violating Cromwell's Rule by treating "uniform experience" as a "full proof" (probability ~1). If he adhered strictly to Cromwell's Rule, he would have to admit that *enough* evidence could prove a miracle (which he technically does in the 8 days of darkness example).
  *   **The Disagreement:** It isn't just the prior. It is also that Hume believes the *channel* of miracle testimony is inherently noisy and biased, whereas the believer thinks the channel is clean enough to transmit the signal.

  **Recommended Reading:** If you want to dive deeper into the Bayesian critique of Hume, look up **John Earman's *Hume's Abject Failure***. Earman argues that Hume's argument *is* probabilistic, and that because it relies on assigning priors close to zero without justification, it fails as a rigorous probabilistic argument. It aligns closely with your intuition about the meteorite problem.
