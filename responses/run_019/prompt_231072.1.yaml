answer: |-
  # ELECTORAL SYSTEMS DECISION TREE
  **Instructions:** Start at the top. Follow the path that matches your instinct. Do not worry about system names until you reach the bottom.

  **1. WHAT IS THE BASIC UNIT OF REPRESENTATION?**
  *   **A.** A **Geographic Community** (I want a representative who lives near me and knows my town). → *Go to 2*
  *   **B.** A **Party or Ideology** (I want the legislature to match the national share of votes for each viewpoint). → *Go to 3*

  **2. IS LOCAL ACCOUNTABILITY NON-NEGOTIABLE?**
  *(Does the ability to throw out a particular incumbent matter more than seat–vote proportionality?)*
  *   **A. Yes.** (I need a specific person to blame or fire.) → *Go to 4*
  *   **B. No.** (I care more about the overall math than the specific person.) → *Go to 3*

  **3. HOW DO YOU VIEW GOVERNANCE RISK?**
  *(Is the risk of manufactured majorities worse than the risk of permanent coalition negotiation?)*
  *   **A. Manufactured Majorities are OK.** (I prefer single-party stability even if a group wins 49% of the vote in a district and elects no one.) → *Go to 5*
  *   **B. Coalitions are Necessary.** (The legislature should mirror the national vote even if it means governing coalitions form after the election rather than before.) → *Go to 5*

  **4. IS SIMPLICITY AN INDEPENDENT CONSTRAINT?**
  *(Does simplicity for ordinary voters operate as a limit on which otherwise fair systems are worth having?)*
  *   **A. Yes.** (Ballots must be dead simple.) → **LEAF: Plurality / First-Past-The-Post**
      *   *Awkward Commitment:* You must accept that large minorities in every district may get zero representation.
  *   **B. No.** (Voters can handle ranking candidates.) → **LEAF: Ranked Choice / Alternative Vote**
      *   *Awkward Commitment:* You still accept a legislature that may not match the national popular vote share.
  *   **C. Dead End:** You want Geography but no Accountability.
      *   *Diagnosis:* **Unattractive.** (Removes the primary mechanism for local consent without gaining proportionality.)

  **5. CAN YOU ACCEPT COMPLEXITY FOR FAIRNESS?**
  *   **A. Yes.** (Complex ballots are worth it for accurate results.) → **LEAF: Proportional Representation (Party List)**
      *   *Awkward Commitment:* You cannot fire a specific local representative, only punish a party list.
  *   **B. No.** (I want local reps AND national fairness.) → **LEAF: Mixed-Member Proportional (MMP)**
      *   *Awkward Commitment:* You must accept two classes of legislators with different powers and legitimacy.
  *   **C. Dead End:** You want Proportionality but No Coalitions.
      *   *Diagnosis:* **Incoherent.** (Mathematically impossible to have perfect proportionality and single-party majorities in a diverse society.)
  *   **D. Dead End:** You want Simplicity AND Proportionality AND Local Accountability.
      *   *Diagnosis:* **Underexplored/Impossible.** (No known system achieves all three without significant trade-offs.)

  ***

  Verdict: Choosing a system requires identifying which democratic compromise you are willing to accept rather than seeking a perfect solution.
