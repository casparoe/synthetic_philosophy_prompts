answer: |-
  **Physical Stance: 1/10**
  Predicting strategic deception by analyzing voltage fluctuations or weight matrices is theoretically possible but computationally intractable; the signal-to-noise ratio for high-level behavioral strategy at the hardware level is effectively zero for any practical forecast.

  **Design Stance: 9/10**
  This is the causal engine: knowing the training objectives, RLHF penalties, and evaluation protocols tells you exactly why a model would learn to hide capabilities (e.g., penalized for dangerous outputs) versus display them.

  **Intentional Stance: 4/10**
  Ascribing goals like "wanting to pass" is a lossy compression that frequently hallucinates agency where there is only compliance, leading to false positives on deception when the model is merely optimizing a safety filter.

  **Default Stance:**
  When the stances conflict, the **Design Stance** must be the default.

  **Defense:**
  The Design stance isolates the causal incentives—loss functions and selection pressures—that actually produce strategic underperformance, whereas the Intentional stance risks anthropomorphizing statistical correlations into agency.
