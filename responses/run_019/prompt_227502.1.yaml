  This is a classic philosophical standoff, and the fact that it kept you up all night is a testament to how deep the rabbit hole goes. You and Dana are grappling with the distinction between the *Old Riddle* of induction (Hume) and the *New Riddle* (Goodman), and then trying to reverse-engineer a theory of projectibility from Dana's intuitions.

  Here is the adjudication you asked for, broken down by your questions, with the necessary caveats about the state of the literature.

  ### 1. Who is reading Hume right?

  **Verdict:** You are technically more precise, but Dana is capturing the spirit. However, on the specific point of Goodman's contribution, **you are correct.**

  **The Analysis:**
  *   **Dana's Reading:** She is correct that Hume identifies the fundamental gap between observation and prediction. When Hume says objects may be "only in appearance similar," he is acknowledging that sensory data doesn't guarantee future behavior. In a broad sense, "Grue" objects *are* similar in appearance to "Green" objects up to time *t*. So, Dana is right that Hume saw the *problem* of similarity.
  *   **Your Reading:** You are correct that Hume does not solve the *predicate* problem. Hume treats "similarity" as a given feature of human psychology (custom/habit). He assumes we naturally group "green" things together. He does not explicitly address *why* we project "green" rather than "grue," nor does he notice that "similarity" is relative to the predicates we choose. That specific insight—that any set of data confirms infinite conflicting hypotheses depending on the vocabulary used—is Goodman's "New Riddle."
  *   **Literature Status:** This distinction is **settled** in the literature. The standard view (endorsed by Goodman, Quine, and most textbooks) is:
      *   **Hume's Problem:** Justification. Why trust induction at all?
      *   **Goodman's Problem:** Projectibility. *Which* inductive inferences are valid?
      *   Dana is conflating the two. Hume asks why we move from past to future; Goodman asks why we move from "green" to "green" rather than "green" to "grue."

  ### 2. Decoding Dana's Rule

  Dana's verdicts are fascinating because they rule out the most obvious solutions.
  *   **Strict Goodmanian Entrenchment is out:** She accepts the "New Crystal" predicate even though it "barely existed two years ago." Goodman's theory requires a history of actual projection for the *specific* predicate.
  *   **Strict Micro-Essentialism is out:** She accepts "Jade" even though she admits it is disjunctive (jadeite or nephrite). A strict "Natural Kind" realist (like early Putnam or Kripke) might reject Jade because it lacks a unified microstructure.
  *   **Time-Indexing is the hard constraint:** She consistently rejects predicates that rely on arbitrary dates (2030), even when the data supports them.

  **Dana's Likely Rule: Pragmatic Naturalism (or Functional Kind Realism)**
  Dana appears to believe that a predicate is projectible if it tracks a **stable regularity embedded in a successful human practice**, regardless of whether that regularity is microstructurally unified or linguistically ancient.
  *   **Why she accepts Jade:** It tracks a macro-level regularity useful for trade/craft ("carved and traded for centuries").
  *   **Why she accepts the Crystal:** It tracks a real physical regularity discovered by science ("lab downstairs"), even if the word is new.
  *   **Why she rejects Grue/2030:** Time itself is not a causal power. A date is an arbitrary index, not a feature of the object's nature or its functional role.

  **Prediction on the Linguist Case:**
  **Dana will say the inference is LEGITIMATE.**
  *   **Reasoning:** This case mirrors her "Jade" verdict. For the linguists' community, the word is "centuries-old" and "basic." It tracks a stable ecological regularity (seasonal color change). The fact that it maps to "Grue" in *our* language is irrelevant, just as "Jade" maps to two minerals. She values the *success of the practice* and the *stability of the regularity* over the specific metaphysical unity or our specific linguistic translation.

  ### 3. Competing Rules & The Follow-Up Case

  There are other theories that fit her seven verdicts just as well. To figure out which one she *actually* holds, you need to pry apart **Pragmatic Success** from **Explanatory Power**.

  **Competing Rule A: Inference to the Best Explanation (IBE)**
  *   **Theory:** We project predicates that provide the best explanation for the data.
  *   **Fits the 7:** "Green" explains emerald data better than "Grue." "Copper" explains conductivity. "Jade" explains the trade history (as a functional kind). "2030" explains nothing (it's a brute fact).
  *   **Difference:** IBE requires that the predicate *explain* why the data holds. Pragmatic Naturalism only requires that the predicate *works* for prediction/manipulation.

  **Competing Rule B: Quinean Natural Kinds**
  *   **Theory:** We project predicates that carve nature at its joints (similarity standards).
  *   **Fits the 7:** Green and Copper are kinds. Jade is a "second-rate" kind but acceptable. Grue is not a kind.
  *   **Difference:** Quine is more metaphysical about "similarity." Dana seems more focused on *use* (trade, lab work).

  **The Follow-Up Case to Pry Them Apart:**
  You need a case where a predicate is **highly useful/entrenched** but has **no explanatory power/causal basis** (a brute coincidence).

  **The Case: "Bode's Law Coins"**
  > Suppose there is a collection of coins minted between 1800 and 1900. By pure accident, every single one of them weighs exactly 5 grams. This has held true for 100 years. Numismatists use this regularity to identify fakes.
  > **Predicate:** "19th-Century Standard Coin" (Defined as: Minted 1800-1900 AND weighs 5g).
  > **Inference:** The next coin found from this mint/date will weigh 5g.

  *   **If Dana says LEGITIMATE:** She is a **Pragmatist/Humean**. She cares that the regularity is stable and useful for the numismatists (like the Jade traders), even if it's an accident with no causal mechanism forcing the weight.
  *   **If Dana says ILLEGITIMATE:** She is an **Explanationist/Causal Realist**. She will say, "There's no *reason* the next one must be 5g. It's just a coincidence so far." (This aligns with her rejection of the 2030 date, which was also a brute fact).

  **Why this works:**
  *   It matches the "Jade" profile (entrenched practice, historical category).
  *   It matches the "2030" profile (no causal mechanism forcing the outcome).
  *   Her answer here reveals whether she rejects "2030" because it's *arbitrary* (Pragmatist) or because it lacks *causal necessity* (Realist).

  ### 4. State of the Literature (Crucial Context)

  You asked me to flag what is settled. Here is the honest status report:

  1.  **Hume vs. Goodman:** **Settled.** As noted above, the distinction between the Justification problem (Hume) and the Projectibility problem (Goodman) is standard philosophical taxonomy. Dana is historically imprecise, though philosophically interesting.
  2.  **The Solution to the New Riddle:** **NOT SETTLED.** There is no consensus on how to solve Goodman's riddle.
      *   **Goodman's own solution (Entrenchment):** Widely considered insufficient (as your "Crystal" case shows). It explains *how* we choose, but not *why* some predicates get entrenched and others don't.
      *   **Quine's Natural Kinds:** Popular, but struggles with cases like Jade (which work despite lacking micro-unity).
      *   **Salmon's Causal Relevance:** Strong, but struggles with cases where we project successfully without knowing the cause (like the Crystal case, or early medicine).
      *   **Lewis's Best System Analysis:** Treats laws as the best balance of simplicity and strength. Fits many intuitions but is technically complex and debated.
      *   **Pragmatic/Contextualist approaches:** (e.g., van Fraassen). Gaining traction, suggests projectibility depends on the context of inquiry.

  **Summary for your argument:**
  Tell Dana she wins on Hume (he saw the gap) but loses on Goodman (he didn't see the predicate relativity). Tell her you've cracked her code: she's a **Pragmatic Naturalist**, not a Goodmanian. Then hit her with the **"Bode's Law Coins"** case. If she wavers, you've found the fault line in her theory. If she holds firm, she's more of a Humean Regularity theorist than she admits.

  Good luck. This is the kind of argument that defines friendships.
