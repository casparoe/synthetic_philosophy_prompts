      *   *Point 3: Quantifier Variance.* (Sider/Hirsch). Do "there exists" mean the same thing? If I say "there exists a table," do I mean a 3D thing enduring or a 4D thing perduring? If the quantifier meaning shifts, they aren't disagreeing.
