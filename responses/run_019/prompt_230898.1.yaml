      *   Key figures to keep in mind (internally): David Lewis (perdurantism), Peter van Inwagen (endurantism), Ted Sider (quantifier variance), Eli Hirsch (verbal disputes), Carnap (frameworks).
      *   The core tension: Is persistence a *fundamental* feature of reality (metaphysics) or a *conceptual* tool we use to navigate reality (language/cognition)?

  3.  **Diagnosing the Disagreement:**
      *   *Is it verbal?* To a significant extent, yes. Both sides describe the same spacetime worm but carve it differently. One says "object $O$ is at $t_1$ and $t_2$," the other says "temporal part $O_{t1}$ and $O_{t2}$ are parts of $O$."
      *   *Is it about standards of evidence?* Yes. Endurantists prioritize phenomenological intuition (I feel like *one* thing). Perdurantists prioritize theoretical elegance (time is like space, relativity favors 4D).
      *   *Is it badly posed?* Possibly. It assumes "object" is a natural kind waiting to be discovered, rather than a category we impose.
      *   *Is there a hidden empirical question?* Special Relativity is the usual suspect. Perdurantists claim SR makes simultaneity relative, hurting "wholly present." Endurantists counter with ad hoc adjustments (relativized instantiation). So, not strictly empirical, but constrained by physics.

