answer: |-
  **The Thirteen-Minute Pause**

  Two identical textile mills, Mill A and Mill B, operate in adjacent valleys. Both employ the "Thirteen-Minute Pause." At exactly 10:13 AM, all looms are idled for five minutes. Workers believe this honors the founder's birth time. Management copies the practice because "morale improves when traditions are kept." The practice originated when a clockmaker accidentally misset the master bell in the original factory; subsequent factories copied the time without checking.

  In Valley A, the regional power grid suffers a predictable voltage spike at 10:18 AM due to a distant hydroelectric switch-over. Idling at 10:13 allows motors to disengage before the surge, preventing cumulative winding damage. In Valley B, the grid is stable; no surge occurs. Workers in both mills hold identical beliefs, intend identical actions, and report identical satisfaction. The practice persists in both due to institutional inertia and the stated (false) morale rationale.

  To reveal the difference, engineers introduce a portable generator to Mill B mimicking Valley A's surge pattern. Mill B's motors begin failing unless the Pause is observed. In Mill A, removing the Pause causes immediate equipment failure. The participants' stated reasons remain unchanged throughout.

  ***

  **Demonstration and Analysis**

  **The Practice:** The 10:13 AM idling ritual.
  **Bearer/Beneficiary:** The institution (machinery longevity/operational continuity).
  **Counterfactuals:** In Mill A, if the Pause stops, machines break. In Mill B, if the Pause stops, machines function normally.
  **Evidence:** The generator intervention isolates the environmental variable while holding agent psychology constant.

  **Distinctions:**
  1.  **Causal Origin:** Clockmaker error (accident).
  2.  **Selection/Maintenance:** Institutional inertia driven by the false morale narrative.
  3.  **Justification (Real Rationale):** Avoiding voltage surge damage (Mill A only).
  4.  **Participant Reasons:** Honoring the founder (false in both).

  **Reliability vs. Reason:** Reliability (the pause happens daily) is insufficient; a superstition can be reliable. The rationale is explanatory because it tracks the *conditional success* of the practice relative to the environment. The false morale rationale is not an unknown true one; it is empirically falsifiable (the founder was not born at 10:13) and causally inert regarding the machinery.

  **The Conceptual Fork:**
  When engineers discover the surge link, the practice does not *acquire* a reason; the reason becomes *represented*. The functional fit existed prior to discovery. Discovery converts a free-floating rationale into a participant's reason, allowing intentional maintenance, but the explanatory power of the rationale existed when it was unrepresented.

  **Objection and Reply:**
  *Objection:* Calling this a "reason" is metaphorical shorthand for a complex causal process (surge → damage → stoppage). Only agents have reasons; structures have causes.
  *Reply:* Pure causal history cannot distinguish Mill A from Mill B regarding the *utility* of the practice. Both have identical causal histories of transmission. Only the functional description ("this prevents surge damage") captures the difference in outcome potential. If "reason" denotes a relationship of fit between action and environment that supports counterfactuals, then reasons exist without reasoners. Denying this reduces functional explanation to mere chronology, losing predictive power.

  **Critical Feature:**
  The **environmental structure** (the predictable voltage surge). If removed, the functional difference between Mill A and Mill B collapses. Both become instances of superstition maintained by inertia. Without this structural constraint, the "rationale" is merely an analyst's projection, not an explanatory factor distinct from the participants' false beliefs. The environmental structure anchors the rationale in reality rather than interpretation.
