          *   I will rank (1) vs (6) as High, and (2) vs (4) as High. Maybe (1)/(6) is slightly more foundational. Let's look at the "Least Costly" revision.
          *   Fixing (1) to allow normative elements is a big philosophical shift (from realism to conventionalism).
