answer: |-
  "Group-level explanations are legitimate only when variance in fitness between groups drives evolutionary change faster than variance within groups, and the trait cannot be explained as a byproduct of individual advantage or kin selection."

  **Notes on Philosophical Distinctions**
  For this procedure, we drop the metaphysical debate over whether Multi-Level Selection (MLS) and Inclusive Fitness (IF) are ontologically identical; they are mathematically equivalent redescriptions, so fighting over which is "true" is verbal. Keep the **Replicator/Vehicle** distinction only to identify what is being copied (genes) versus what is being selected (organisms/groups). Keep **Lewontin's Conditions** (variation, heritability, differential fitness) as the hard gatekeeper for selection at *any* level. Keep the **Byproduct Problem** to distinguish adaptation from side-effects.

  **The Decision Procedure**

  **Step 1: The Lewontin Gate (Group Level)**
  *Question:* Does the proposal demonstrate variation between groups, heritability of that variation (groups split/found new groups), and differential fitness of groups based on the trait?
  *Sufficient Answer:* Yes, the proposal measures group extinction/splitting rates and shows groups with the trait outcompete groups without it.
  *Verdict:* If **No**, terminate. The explanation is not group selection. It is likely individual selection or drift. Fund only if reframed as individual-level adaptation.
  *Judgment Flag:* Determining "heritability" of groups is empirical. If the proposal assumes groups reproduce without evidence, flag for revision.

  **Step 2: The Byproduct Test (Individual Cost)**
  *Question:* Is the trait costly to the individual actor's survival or reproduction in the immediate term?
  *Sufficient Answer:* Yes, the trait reduces individual fitness (e.g., alarm calling increases predation risk).
  *Verdict:* If **No**, terminate. If the trait benefits the group but costs the individual nothing (or benefits the individual too), it is individual selection masquerading as group benefit (e.g., selfish herd). Fund only if reframed as individual advantage.
  *Judgment Flag:* Assessing "cost" is context-dependent. A trait might be costly in one environment and neutral in another.

  **Step 3: The Kinship Reduction**
  *Question:* Are the beneficiaries of the trait genetic relatives of the actor?
  *Sufficient Answer:* Yes, the group is composed of kin, or the proposal accounts for relatedness (r) in the fitness calculation.
  *Verdict:* If **Yes**, terminate as "Group Selection." Reframe as Kin Selection (Inclusive Fitness). While mathematically equivalent to MLS, Kin Selection is the preferred heuristic for genetic systems because it is easier to measure relatedness than group extinction rates. Fund only if the proposal acknowledges kin selection as the primary mechanism.
  *Judgment Flag:* Distinguishing kin selection from group selection is often a choice of heuristic, not fact. If the committee prefers ecological models over genetic ones, this step can be skipped, but kinship must be controlled for empirically.

  **Step 4: The Heuristic Choice (Equivalence Clause)**
  *Question:* If kinship is low (Step 3 = No) and individual cost is high (Step 2 = Yes), does the group-selection model generate different experimental predictions than an individual-level model (e.g., reciprocal altruism)?
  *Sufficient Answer:* Yes, the proposal predicts group extinction events that individual models do not.
  *Verdict:* **Pass.** This is a genuine group-selection candidate. Fund.
  *Judgment Flag:* This is the highest-risk judgment. True group selection requires strong assumptions about group isolation and extinction. If the proposal relies on vague "species survival" arguments without demographic data, reject.

  ***

  **Test Cases**

  **1. Eusociality in Hymenopteran Insects**
  *Analysis:* The proposal argues workers sterile themselves for the good of the colony.
  *Step 1:* Groups (colonies) vary and split. (Pass)
  *Step 2:* Sterility is highly costly to the individual. (Pass)
  *Step 3:* Beneficiaries are sisters (high relatedness due to haplodiploidy). (Fail)
  *Verdict:* **Reframe as Kin Selection.** This needs an individual-level explanation (inclusive fitness).
  *Rationale:* While colony selection exists, the primary driver is genetic relatedness. Funding a "group selection" proposal here ignores the stronger kin-selection heuristic.

  **2. Bird Alarm Calls Attracting Predator Attention**
  *Analysis:* The proposal argues birds call to save the flock, risking themselves.
  *Step 1:* Do flocks vary in calling behavior and do "calling flocks" outsurvive "silent flocks"? (Empirical Question)
  *Step 2:* Calling increases predation risk. (Pass)
  *Step 3:* Are flock members kin? (Empirical Question)
  *Verdict:* **Fund if Reframed.** If the proposal controls for kinship and measures flock-level extinction, it passes Step 4. If it assumes "good of the species" without measuring group variance, Reject.
  *Rationale:* This is the hardest case. If kinship is low, group selection is a valid remaining hypothesis, but it requires rigorous demographic data often missing in behavioral proposals.

  **3. Pathogen Evolving Reduced Virulence**
  *Analysis:* The proposal argues parasites evolve restraint to avoid killing hosts "for the good of the species."
  *Step 1:* Do parasite strains within a host compete as groups? (Usually No)
  *Step 2:* Is reduced replication costly to the individual parasite? (Yes)
  *Step 3:* Is this kin selection? (Often yes, single strain infection)
  *Verdict:* **Reject Group Selection.** Reframe as Individual Trade-Off.
  *Rationale:* Standard evolutionary medicine shows virulence is a trade-off between transmission and host survival. "Prudence" is usually individual optimization, not group altruism.

  ***

  **Managing the Controversy**

  The verdict on **Case 3 (Pathogen Virulence)** will anger the half of the committee that waves "good of the group" proposals through. They intuitively feel parasites *should* evolve to be nice to hosts.

  **What to say to them:**
  "Your intuition that prudent parasites are beneficial is correct, but 'beneficial' is not 'selected for.' Without strict bottlenecks where only one group transmits, selfish strains within a host will always outcompete prudent strains. The proposal assumes group selection without demonstrating the specific demographic conditions (high group extinction, low within-host mixing) required to overcome individual selection. We cannot fund an adaptationist just-so story when a robust individual-level trade-off model exists. Require them to model the within-host competition; if the prudent strain wins without group structure, then it's individual selection, not group selection."

  The verdict on **Case 2 (Alarm Calls)** will anger the half that auto-rejects "group selection."

  **What to say to them:**
  "We are not funding 'group selection' as a metaphysical claim. We are funding a testable hypothesis about variance. If the birds are unrelated and the call is costly, individual selection cannot explain it without reciprocity. If the proposal measures group-level variance explicitly, it meets Lewontin's conditions. Rejecting it solely on the phrase 'group selection' ignores the math. We are funding the experimental design that distinguishes group variance from individual variance, not the label."
