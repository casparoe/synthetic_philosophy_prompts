      *   *What to Drop:* The deep mathematical equivalence debate is often a "verbal" fight for grant purposes. What matters is the *causal mechanism* proposed. If the mechanism relies on group-level variance overriding individual-level variance, it's group selection. If it relies on genetic relatedness, it's kin selection.
