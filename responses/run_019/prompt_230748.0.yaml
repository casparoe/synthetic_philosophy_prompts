          *   *Matter 1: Ontological status of boundaries.* Realist: Boundaries mark causal shifts. Constructivist: Boundaries mark historiographical conventions.
          *   *Matter 2: Weight of actor categories.* Realist: "Renaissance" reflects lived experience of break. Constructivist: "Renaissance" reflects propaganda/myth-making.
          *   *Matter 3: Coherence of "Scientific Revolution".* Realist: A unified epistemic shift. Constructivist: A bundle of disparate timelines.
      *   *Refinement:* Make the language precise. Use terms like "causal clustering" vs. "narrative convenience."

  4.  **Section 3: Cruxes:**
      *   *Constraint:* At least four sub-questions. Settling one moves a side. Specific. Include suggested examples (actor self-description, clustering of change, Scientific Revolution unity, earlier Renaissances).
