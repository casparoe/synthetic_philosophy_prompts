          4.  *Earlier Renaissances:* Does the 12th-century Renaissance invalidate the 15th-century one, or show a pattern of periodic renewal?
      *   *Refinement:* Ensure these are genuine pivot points. If the answer to #2 is "linear," the Realist has a problem. If the answer to #4 is "pattern," the Constructivist has a problem.

  5.  **Section 4: Tests/Evidence:**
