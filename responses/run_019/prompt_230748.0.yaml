          3.  *Sci Rev:* Compare timeline of anatomical discovery vs. celestial mechanics. Realist predicts synchronization; Constructivist predicts decoupling.
          4.  *Earlier Renaissances:* Compare vocabulary of 12th-century writers to 15th-century writers. Realist predicts distinct semantic fields; Constructivist predicts identical tropes.
      *   *Refinement:* Make sure the predictions are distinct.

  6.  **Closing Judgment:**
      *   *Constraint:* Judge if any part is verbal/emphasis vs. substance.
