prompt: |-
  Okay so I'm a novelist, lit-fic midlist type, and I'm stuck on the central character of my next book and I want to outsource the philosophy part to you. Here's the character: a woman in her fifties who every three or four years detonates her life. Quits the career, ends the marriage, moves cities, picks up a new name or a new politics, and tells everyone -- and she means it, she's not performing -- that she's finally free, that the past is just a story she used to tell herself and she's under no obligation to keep telling it. My hunch is that she's in Sartrean bad faith, but at the pole that never gets the famous examples: not the waiter who's over-identified with his role and is fleeing his freedom into thinghood, but the reverse move, fleeing her facticity into pure transcendence, treating her past, her body, her promises as weightless.

  Build me the scene. Specs:

  - One scene, contemporary and realistic, and the two canonical setups are banned: no café, no waiters, no first date.
  - The bad faith has to come through entirely in behavior and dialogue. I can't just narrate "she was in bad faith," and ideally a reader who's never heard of Sartre should still feel that something is off about her without being able to name it.
  - She must be sincere. No con artist, no hypocrite, nobody lying to anyone -- and that's the hard part, because the scene should somehow make palpable the weird structure of bad faith, where there's no liar and no dupe and yet the whole thing is crooked.
  - Her escape should fail not because the world blocks her (no villain, no debt collector at the door) but because her own past choices keep showing up inside what she does, facticity reasserting itself without her noticing. She's carrying the suitcase she claims never to have packed, that kind of thing.
  - Cruellest constraint: the things she says should sound like textbook Sartrean authenticity -- owning her freedom, refusing to be defined by what's given. Her bad faith has to be invisible to the standard "just own your choices" advice. If a life-coach could endorse everything she says out loud, you've got it right.

  After the scene, walk me through it: why this counts as bad faith on Sartre's actual terms rather than healthy reinvention or serial change of mind; which specific beats are carrying the philosophical weight; and how it differs structurally from the waiter case rather than just inverting it. Then the attack: someone tells me this isn't bad faith at all, it's just a person who keeps changing her mind, and Sartre has no principled line between the two -- answer that objection, and tell me honestly whether the case survives it. Also, what happens if I let her, just once in the whole novel, notice the pattern out loud? Does the whole structure collapse, or does it get worse?

  No need for citations or quotes from Being and Nothingness, I'll dig those up myself -- I'd rather you paraphrase than misremember a line.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (lit-fic midlist).
      *   **Task:** Create a scene featuring a specific character (woman in 50s, serial reinventor) demonstrating Sartrean "bad faith" (specifically fleeing facticity into pure transcendence).
      *   **Constraints:**
          *   One scene, contemporary, realistic.
          *   NO café, NO waiters, NO first date.
          *   Bad faith must be shown through behavior/dialogue, not narration.
          *   She must be *sincere* (no lying, no performing).
          *   Failure must come from internal contradiction (facticity reasserting itself), not external blocking.
          *   Her dialogue must sound like "textbook authenticity" (life-coach approved).
          *   Post-scene analysis required: Why it's bad faith, specific beats, difference from the waiter example.
          *   Objection handling: Address the claim that this is just "changing one's mind."
          *   Meta-question: What happens if she notices the pattern?

  2.  **Deconstruct the Philosophy (Sartrean Bad Faith - Fleeing Facticity):**
      *   *Bad Faith (Mauvaise Foi):* Lying to oneself to avoid the anguish of freedom/responsibility.
      *   *The Waiter Example:* Fleeing freedom into facticity (becoming a thing/role).
      *   *The Request's Focus:* Fleeing facticity into transcendence (denying the weight of the past, the body, commitments). Claiming to be pure freedom with no anchor.
      *   *The Trap:* To claim "I am nothing but my future choices" is to deny "I am what I have been." But "what I have been" is real (facticity). Denying it is a denial of reality, which is bad faith.
      *   *Sincerity:* She believes it. That's key. Bad faith isn't conscious lying; it's a structural evasion.

  3.  **Drafting the Scene:**
      *   *Setting:* Needs to be domestic or transitional, but not a café. A storage unit? A moving truck? A real estate closing? Let's go with *packing/decluttering in a new apartment*. It highlights the relationship with objects (facticity). Or better: *A conversation with a daughter or old friend during a move.* Let's choose a daughter. It raises the stakes of "promises" and "history."
      *   *Characters:* Elena (50s, the protagonist) and Mark (her son, 20s).
      *   *Action:* Elena is throwing things away. Mark is trying to save them.
      *   *Dialogue:* Elena needs to sound empowering. "I'm not defined by this." "That was a different person." Mark needs to represent the facticity (the evidence of the past).
      *   *The "Glitch":* She needs to rely on the past she denies. Maybe she uses a skill she claims to have abandoned, or reacts to a trigger she claims doesn't exist.
      *   *Idea:* She's moving into a minimalist space. She's burning bridges. But she keeps organizing things in a specific, old way. Or she references a past trauma as "not real" but reacts physically to it.
      *   *Refinement:* Let's make it about a specific object that embodies a promise. A recipe box? A tool? Let's go with a *professional archive*. She was a lawyer? An architect? Let's say she was a high-powered editor. She's now "a painter." But she edits his speech without thinking.
      *   *Setting:* Her new studio apartment. Boxes everywhere.
      *   *Conflict:* Mark wants to keep a box of her old manuscripts/letters. She wants to shred them.
      *   *The "Bad Faith" Moment:* She claims total freedom from the past, but her *method* of freeing herself is rigid, compulsive, and defined entirely *against* the past, meaning the past still dictates her actions. Also, she relies on the stability she provides to others while claiming to owe them nothing.
      *   *The "Facticity Reasserting":* She claims she doesn't need the money/security from her past, but she's using a credit card from that life to pay for the freedom. Or, she claims she's "new," but she instinctively comforts her son in a way that proves she's still the mother, not a "free spirit."
      *   *Decision:* Let's focus on the *rhythm* of her speech and a physical habit. She claims to be a painter now. She's cleaning brushes. But she organizes them with the precision of the accountant/lawyer she claims to have killed. And she dismisses a commitment she made to him last year as "not binding on the new me."

      *   *Drafting - Step-by-Step:*
          *   Start with the action: Cleaning/packing.
          *   Mark enters. He's worried.
          *   She espouses the philosophy: "I'm not that person anymore."
          *   He brings up a specific promise (money? visit?).
          *   She dismisses it as "history."
          *   The slip: She corrects his grammar or organizes a pile with obsessive precision (the old skill) while talking about chaos/freedom.
          *   The ending: She feels free, he feels abandoned, but she insists she's doing it for *him* too (co-opting his reality).

      *   *Wait, check constraints:* "Life-coach could endorse everything." So she can't sound crazy. She has to sound *wise*.
      *   *Revision:* She shouldn't be cold. She should be warm but unmoored. "I love you, but that promise was made by a ghost."
      *   *The Facticity Slip:* She needs to depend on the identity she rejects. Maybe she uses her old reputation to get the new apartment, then denies the reputation. Or she relies on him to clean up the mess of her "freedom."
      *   *Better Slip:* She claims to live in the moment, but she's anxiously checking a watch or a schedule she claims to have abandoned. Or, she uses a specific phrase her ex-husband used, unconsciously.
      *   *Best Slip:* She claims her past achievements are meaningless, but she derives her confidence *entirely* from the safety net those achievements provided. She treats her savings (accumulated by the "old" her) as if they are manna from heaven, not deferred labor.
      *   *Let's try the "Savings" angle.* She's quitting her job. She says "Money is just energy." But she's living off a severance package she fought hard for *as the old person*.
      *   *Let's try the "Skill" angle.* She's teaching him something. She teaches him with the authority of the old role while denying the role.
      *   *Let's go with the "Name/Identity" angle.* She's changed her name (or nickname). He uses the old one. She corrects him gently. But she answers to the old one instinctively later.
      *   *Actually, the prompt says "treats her past... as weightless."*
      *   *Scene Idea:* She is helping Mark move *his* stuff, while simultaneously destroying *hers*. She treats his attachments as sacred (because they are *his* facticity) but hers as disposable. This shows the inconsistency.
      *   *Wait, the failure must be internal.* "Her own past choices keep showing up inside what she does."
      *   *Okay:* She claims to be starting fresh as a ceramicist. She's packing up her old life as a corporate fixer. She says, "I don't need those skills." But when Mark gets into a trouble (a lease issue), she instinctively solves it using the corporate fixer skills, then immediately dismisses the solution as "nothing," refusing to acknowledge she *has* that power/responsibility now. She exerts influence then denies agency.

      *   *Refining the Scene:*
          *   **Characters:** Claire (52) and Leo (24, son).
          *   **Setting:** Claire's new, sparse loft.
          *   **Action:** Claire is shredding documents. Leo is holding a box of her old things he saved.
          *   **Dialogue:** Claire on flow, freedom, shedding skin. Leo on continuity, memory.
          *   **The Twist/Slip:** Leo mentions a problem with his landlord. Claire instantly diagnoses the legal loophole (old facticity). She solves it in 30 seconds. Then she says, "I don't know how I did that, I'm not a lawyer anymore." She disowns the competence that just saved him. That is the bad faith: claiming the act was accidental/weightless when it was deeply rooted in her facticity.

  4.  **Writing the Scene:**
      *   Focus on the shredder sound. The rhythm.
      *   Claire's voice: Calm, luminous, unburdened.
      *   Leo's voice: Frustrated, grounded.
      *   The moment of competence: Fast, sharp, authoritative.
      *   The immediate disowning: "Must have picked that up somewhere."

  5.  **Analyzing the Scene (Post-Scene Walkthrough):**
      *   *Why Bad Faith?* She denies the *being* of her past (facticity) while simultaneously *using* it. She claims to be pure transcendence (future-oriented), but her transcendence is built on a foundation she refuses to name.
      *   *Specific Beats:* The shredding (ritual of erasure), the legal advice (return of the repressed), the dismissal (the lie).
      *   *Vs. Waiter:* Waiter plays at *being* a waiter (too much facticity). Claire plays at *not being* Claire (too much transcendence). Both deny the synthesis of facticity + transcendence.
      *   *Objection (Just changing mind):* Sartre distinguishes between *project* and *escape*. A project acknowledges the weight of the past to move beyond it. Escape pretends the weight doesn't exist. If she acknowledged, "I am using my past skills to build a new future," that's authenticity. Saying "I have no past, this happened magically," is bad faith.
      *   *Noticing the Pattern:* If she notices, the bad faith is punctured. But Sartre says we can't stay in authenticity permanently. It might collapse into anguish. Or, she might rationalize the pattern ("Even my patterns are free!"), deepening the bad faith.

  6.  **Refining the Output:**
      *   Ensure the tone is literary.
      *   Check constraints: No café, no waiter, no first date. (Check: Loft setting).
      *   Check sincerity: She isn't lying to Leo. She believes she isn't a lawyer.
      *   Check the "Life Coach" test: Her lines should sound like "Live your truth," "Don't let history define you."

  7.  **Final Polish:**
      *   Make sure the legal advice is sharp enough to prove she *is* still that person.
      *   Make sure her dismissal is gentle, not cruel.
      *   Ensure the analysis is clear on the *structure* of bad faith (denial of the synthesis).

  *(Self-Correction during drafting)*: I need to make sure she doesn't sound *delusional*. She knows she *was* a lawyer. She just claims that *person* is dead. The bad faith is in thinking a person can be "dead" while the body and brain remain. The "slip" needs to be her body/brain acting on the old programming while her mouth denies it.

  *Revised Plan for the "Slip":* She solves the problem, then says, "See? The universe provides." No, that's too woo-woo. She should say, "I just looked at it fresh. That's what happens when you aren't clouded by a career." She attributes the skill to her *freedom*, not her *history*. That's the key. She appropriates the fruit of her facticity as a flower of her transcendence.

