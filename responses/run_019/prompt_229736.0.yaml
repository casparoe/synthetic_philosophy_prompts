answer: |-
  **SCENE START**

  The shredder hummed, a low, digestive sound. Claire fed another stack of letterhead into the throat of the machine. The paper vanished, emerging as confetti in the clear bin below.

  Leo stood in the doorway of the loft, holding a cardboard box. He was twenty-four, wearing the same hoodie he'd worn to his high school graduation. Claire had bought that hoodie. She didn't count that as part of her history anymore.

  "You're throwing out the tax returns?" Leo asked.

  "Seven years is the statute of limitations for the IRS," Claire said, not looking up. "Anything older is just paper weight. I'm traveling light, Leo. You know that."

  "Mom. These are from when you were at the firm. You said you might need them for the pension dispute."

  "That was Linda who needed them," Claire said. She paused the shredder. She turned to him, smiling. She looked radiant, the way people do when they've slept twelve hours a night for a month. "Linda doesn't live here. I'm not fighting a pension. I'm making ceramics. I'm breathing."

  Leo stepped into the room, setting the box on the floor. It thudded heavily. "The landlord called. About the noise complaint from downstairs."

  "Oh?"

  "He says the lease prohibits kilns in residential zones. He's threatening eviction if I don't move my equipment by Friday."

  Claire walked over to him. She didn't touch him, but she entered his space with a calm that made him step back. She looked at the lease agreement Leo was clutching. She didn't take it. She just scanned the page while holding her coffee mug.

  "Section 4, paragraph B," Claire said. Her voice dropped an octave. It became precise, clipped, the vowels flattened. "Commercial use is prohibited *unless* ancillary to primary residence and generating under ten thousand gross annually. You're not selling the pieces yet. You're a student. The kiln is educational equipment. It's not a commercial appliance, it's a tool for study. Like a piano."

  Leo blinked. "I didn't see that."

  "It's standard boilerplate. They bluff on enforcement because ninety percent of tenants don't read the ancillary clause. Send an email citing Section 4B. Copy the tenant board. Don't apologize. Just state the compliance."

  Leo stared at her. He reached for his phone, instinctively opening his mail app. "Okay. Okay, I can do that. That's... really specific, Mom."

  Claire blinked. The sharpness vanished from her eyes. She took a sip of coffee and looked around the empty loft as if she'd never seen it before.

  "Is it?" she asked. "I don't know where that came from. I think when you clear out the noise, you just... see things. The answer was right there on the page. I didn't use any training. I just looked at it."

  "You sounded like a lawyer," Leo said.

  "I'm not a lawyer," she said, genuinely confused. "Lawyers bill hours. Lawyers worry about precedent. I just told you what the words said. That's not a skill, Leo. That's just being present."

  She turned back to the shredder. She fed in a framed certificate. The glass cracked in the mechanism.

  "Are you coming to dinner on Sunday?" Leo asked. "We talked about it last month. Dad's birthday."

  "Sunday is a new week," Claire said. "I don't know who I'll be on Sunday. If I promise now, I'm binding a future self who hasn't consented. That's not fair to either of us."

  "So I shouldn't book the table."

  "Book the table for yourself," she said. "If I show up, it'll be because I'm free to be there. Not because I owe you a birthday."

  She pressed the pedal. The shredder roared. The certificate disappeared.

  "Thanks for the lease tip," Leo said. He picked up the box he'd brought in. He didn't open it. "I'll leave these here. In case Linda ever comes back looking for them."

  "There's no Linda," Claire said softly. "There's just the confetti."

  Leo nodded. He backed out of the room. Claire waited until the front door clicked shut. Then she picked up her phone. She opened her contacts, scrolled to 'L', and dialed her old paralegal.

  "Hi, it's Claire. Listen, I need you to verify something for me. Off the books. A lease clause."

  She listened for a moment, looking at the shredder.

  "No, I'm not coming back. I just... I needed to know I was right about the words. Yes. Thanks."

  She hung up. She looked at the phone. She didn't save the number. She let it slide out of her hand onto the sofa cushion, as if the device itself were weightless, as if the call hadn't just anchored her back to the floor she claimed to have left.

  **SCENE END**

  ***

  ### The Walkthrough

  **1. Why this is Bad Faith (on Sartre's terms)**
  Sartre defines human reality as a synthesis of *facticity* (what you are: your past, your body, your social roles) and *transcendence* (what you are not yet: your projects, your freedom, your future). Authenticity is holding these two in tension. Bad faith occurs when you collapse the synthesis into one pole.

  The famous Waiter example is bad faith because the man tries to *be* a waiter in the way an inkwell is an inkwell. He flees his freedom into facticity.

  Claire is doing the inverse. She is fleeing her facticity into pure transcendence.
  *   **The Lie:** She claims her ability to interpret the lease was "just being present" or "seeing the words." That is a lie she tells herself. She interpreted those words because she spent twenty years trained to parse legal boilerplate. That skill is sedimented in her brain. It is facticity.
  *   **The Structure:** By attributing a factical skill (legal expertise) to a transcendent state ("clearing the noise"), she denies the weight of her own history. She wants the *benefit* of her past (the competence, the money funding the loft, the confidence) without the *responsibility* of acknowledging that she built it. She treats her own history as a costume she took off, rather than the skin she grew.
  *   **The Sincerity:** She isn't lying to Leo. When she says, "I don't know where that came from," she believes it. That is the essence of bad faith: it requires a unity of consciousness that believes its own evasion. She has successfully dissociated the *act* from the *agent*.

  **2. Specific Beats Carrying the Weight**
  *   **"Linda doesn't live here."** She speaks of her former self in the third person. This linguistic split allows her to disown obligations ("Linda" owed the pension dispute; "Claire" does not).
  *   **The Lease Diagnosis.** The shift in her voice ("dropped an octave," "clipped") shows the facticity breaking through. Her body remembers what her mind claims to have forgotten.
  *   **"I'm not a lawyer... I just looked at it."** This is the crucial philosophical move. She appropriates the fruit of her facticity as a flower of her freedom. She claims the competence is a result of *not* having a career, when it is clearly a result of *having had* one.
  *   **The Phone Call.** This is the reassertion of facticity. She *needs* the verification. She cannot actually live in pure freedom; she needs the safety net of the old network. But she hangs up and doesn't save the number. She performs the erasure of the dependency immediately after relying on it.

  **3. Difference from the Waiter Case**
  It is not just an inversion; it is structurally distinct in how it treats *time*.
  *   **The Waiter** is stuck in the *Present*. He is trying to coincide with his current role. "I am a waiter, right now, completely."
  *   **Claire** is stuck in the *Future*. She is trying to coincide with what she is *not*. "I am what I will be (free), not what I was."
  *   **The Waiter** denies his freedom to choose otherwise.
  *   **Claire** denies her factical inability to choose otherwise (she cannot choose to *not* know the law).
  *   **The Result:** The Waiter becomes a thing. Claire becomes a ghost. The Waiter is too heavy; Claire is too light. Both fall because human reality requires friction against the ground.

  ***

  ### The Attack: "Isn't this just changing your mind?"

  **The Objection:**
  A critic (or a life coach) would argue: "People evolve. She learned skills, used them, and moved on. Why is it bad faith to say 'I am not defined by my job'? That is the definition of mental health. Sartre is just pathologizing growth."

  **The Defense:**
  The line isn't between "staying" and "leaving." It's between *acknowledging the weight* and *denying the gravity*.
  If Claire said, "I was a lawyer for twenty years. That shaped how I think. I am choosing to stop practicing, but I know I will always see the world through a legal lens, and I accept that burden," that would be authenticity. She would be owning the facticity.

  Bad faith is the claim that the lens *isn't there*. It's the claim that she is a blank slate every morning. Sartre's point is that you *are* your past. You can transcend it, but you cannot *erase* it. If you claim to have erased it, you are lying about your own reality. The "failure" in the scene isn't that she changed her mind; it's that she called on the phone. She couldn't actually function without the past she claimed to have incinerated. If she were truly just "changing her mind," she wouldn't need to secretly verify the clause with the paralegal. She would trust her new self. The secret call proves she knows, on some level, that the "new self" is a fiction dependent on the "old self."

  **Does the case survive?**
  Yes, provided the novel maintains the tension. If she simply becomes a ceramicist and is happy, the reader might side with the life coach. To sustain the Sartrean critique, the narrative must show the *cost* of this denial. The cost is usually borne by others (Leo), or it manifests as a creeping anxiety that the "freedom" is actually a form of amnesia. The bad faith survives if the reader sees that she is *using* her history while *scorning* it.

  ***

  ### The Meta-Question: What if she notices the pattern?

  If Claire has a scene where she says, "I do this every four years. I burn it all down," the structure of bad faith changes, but it does not necessarily collapse.

  **Option A: Collapse into Anguish.**
  If she truly notices, she confronts the fact that her "freedom" is actually a *compulsion*. A compulsion is a form of facticity. If she admits, "I am addicted to reinvention," she is admitting she is not purely free. She is bound by a pattern. This is authenticity. It is painful. It grounds her. She can no longer claim she is "light." She has to carry the weight of the pattern. This is a breakthrough moment.

  **Option B: Deepening the Bad Faith (The Meta-Lie).**
  This is the more interesting literary route. She notices the pattern, but she co-opts *that* into the freedom narrative.
  *"Even my patterns are choices. I choose to reinvent. I choose the cycle."*
  This is bad faith on steroids. It claims that even the compulsive parts of her psyche are acts of free will. It makes her immune to critique because she absorbs the critique into the philosophy. "You say I'm running away? No, running is my way of arriving."
  This makes her terrifying. It makes her unfalsifiable. If she notices the pattern and claims *that* is also freedom, she has sealed herself in a hermetic loop. The novel then becomes about whether reality can break a seal that strong. Usually, in lit-fic, reality wins. The body breaks, or the money runs out, or Leo stops answering the phone. But until then, she is a closed system of self-justification.

  **Recommendation:**
  Go with Option B for the middle of the book, Option A for the end. Let her weaponize the self-awareness. Let her tell Leo, "I know I do this. I choose to do this." That makes her invincible for 200 pages. Then, have the facticity hit her in a way she can't narrate away (a medical diagnosis, a permanent loss, something that doesn't care about her philosophy). That is where the bad faith finally breaks, not because she thought about it, but because the world refused to be transcended.
