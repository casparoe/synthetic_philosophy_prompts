answer: |-
  **MEMORANDUM**

  **TO:** Editorial-Standards Board
  **FROM:** Chair, Editorial-Standards Board
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding *Before the Builders*

  **Recommendation**
  I recommend we adopt the third position: **Air the series contingent upon the addition of an introductory framing segment and a one-hour companion program featuring mainstream archaeological and geological counter-analysis.** Producers must submit a cut of the framing materials within 14 days for board approval prior to scheduling.

  **Rationale and Engagement with Dissenting Views**
  This compromise respects the core validity of the two opposing factions while mitigating their respective risks.

  To the faction advocating **outright rejection**: Your concern is the integrity of our educational mission. You argue that broadcasting conclusions unsupported by the weight of evidence constitutes misinformation, regardless of the presenter's credentials. You are correct that public trust relies on our duty of care; airing the series without context implies institutional endorsement of the "lost civilization" thesis. However, rejection carries the risk of dogmatism. Archaeology *has* overturned consensus before (e.g., the age of Göbekli Tepe itself), and dismissing a credentialed geologist solely because his conclusion is unpopular risks turning the station into a gatekeeper for orthodoxy rather than a forum for inquiry.

  To the faction advocating **airing as submitted**: Your concern is viewer autonomy and the open marketplace of ideas. You argue that dismissing the series is an *ad hominem* attack on the presenter and that viewers should weigh the evidence. This honors the public broadcaster's role in facilitating discourse. However, "viewer autonomy" is compromised when the presentation creates a false equivalence between a fringe synthesis and established consensus. Airing the series unmodified privileges the *narrative cohesion* of the documentary over the *probabilistic weight* of the evidence, potentially misleading viewers who lack the specialized knowledge to distinguish valid data points from invalid inferences.

  **Level of Evaluation**
  In making this decision, the Board must evaluate the **research program as a whole**, specifically the logical bridge between data and conclusion, rather than auditing individual claims or methods in isolation.

  *   **Why not individual claims?** Many specific observations (e.g., water weathering on limestone) are technically accurate and disputed even within mainstream fields. Auditing these would bog us down in technicalities and miss the forest for the trees.
  *   **Why not just methods?** The geological methods cited are often standard; the error lies in their application to historical causality.
  *   **Why the research program?** The failure of *Before the Builders* is not necessarily in its bricks, but in its mortar. It aggregates plausible local anomalies to support a global historical claim that lacks consilience with genetics, linguistics, and broader archaeology. If we evaluate only the claims, we validate the conclusion. If we evaluate the program's coherence, we address the actual editorial risk: the misleading synthesis of accurate data.

  **Future Criterion**
  To prevent ad hoc decisions on future submissions challenging scientific consensus, we will apply the **"Consilience and Synthesis" Criterion**:

  > *When a program utilizes valid data or methods to support a conclusion that contradicts the broader web of established knowledge, the burden of editorial context is proportional to the degree of disconnection from adjacent fields. We may air challenges to consensus conclusions, but we must not air challenges to the methodology of verification itself without explicit contextualization.*

  This allows us to remain open to paradigm shifts without becoming a vehicle for pseudohistory.

  I look forward to your votes on Friday.
