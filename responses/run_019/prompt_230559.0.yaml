prompt: |-
  I chair the editorial-standards board of a public television station. We vote on Friday whether to broadcast a submitted six-part documentary series, Before the Builders, which argues that monuments at Giza, Tiahuanaco, and Göbekli Tepe are several millennia older than mainstream archaeology allows and were built by a lost maritime civilization. The program is not the work of obvious cranks: its presenter holds a doctorate in geology, it cites peer-reviewed papers on weathering and archaeoastronomy, and several of its local observations are the kind mainstream specialists dispute among themselves. What the specialists reject is the global conclusion and the way the series assembles the evidence. The producers argue that a public broadcaster should let viewers weigh contested evidence for themselves, that dismissing the series as pseudohistory is an ad hominem, and that archaeology has overturned its own consensus before. The board is split three ways: one faction would decline outright on the ground that airing is platforming pseudohistory; a second would air the series exactly as submitted; a third would air it only with a framing overlay and a companion program. Draft the short written recommendation I'll circulate before Friday's vote. It must recommend one concrete course of action with a time frame; it must engage the strongest version of the two losing positions rather than caricatures; it must say whether the board should evaluate individual claims, methods, or the research program as a whole, and what turns on that choice; and it should close with a general criterion we can apply to future submissions of this kind so the decision is not ad hoc.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Editorial-Standards Board of a public television station.
      *   **Task:** Draft a short written recommendation to circulate before Friday's vote.
      *   **Subject:** Whether to broadcast *Before the Builders*, a six-part documentary series claiming monuments (Giza, Tiahuanaco, Göbekli Tepe) are much older than accepted, built by a lost maritime civilization.
      *   **Context:**
          *   Presenter has a PhD in geology.
          *   Cites peer-reviewed papers (weathering, archaeoastronomy).
          *   Some local observations are disputed even among specialists.
          *   Mainstream rejection focuses on the *global conclusion* and *assembly of evidence*.
          *   Producers argue for viewer autonomy, against ad hominem dismissal, and note past consensus shifts.
          *   Board is split: (1) Decline outright (pseudohistory), (2) Air as-is (open inquiry), (3) Air with framing/companion (contextualization).
      *   **Requirements:**
          *   Recommend *one* concrete course of action with a time frame.
          *   Engage the strongest version of the two losing positions (steel-manning, not straw-manning).
          *   Specify whether the board should evaluate individual claims, methods, or the research program as a whole, and explain the stakes of that choice.
          *   Close with a general criterion for future submissions (to avoid ad hoc decisions).

  2.  **Determine the Recommendation:**
      *   *Option 1 (Decline):* Risks censorship accusations, ignores the nuance that some data is legitimate, alienates the "open inquiry" faction.
      *   *Option 2 (Air as-is):* Risks misleading the public, violates public broadcaster's duty to accuracy/educational value, ignores the synthesis error.
      *   *Option 3 (Air with framing/companion):* Balances free inquiry with editorial responsibility. Acknowledges the data while contextualizing the conclusion. This is usually the most defensible position for public media (like PBS/NOVA style).
      *   *Decision:* I will recommend Option 3 (Air with framing/companion). It allows for the "viewer weigh evidence" argument while satisfying the "pseudohistory" concern through context.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Recommendation:** Air the series *with* specific editorial framing and a companion program. Set a deadline (e.g., two weeks for edits).
      *   **Engaging the Losing Positions (Steel-manning):**
          *   *Against Outright Rejection:* Acknowledge that science evolves. Dismissing based on conclusion alone risks dogmatism. The presenter has credentials; some data points are valid. Rejection looks like censorship of minority scientific views.
          *   *Against Airing As-Is:* Acknowledge the duty to not mislead. The synthesis of evidence is where the error lies, not necessarily every brick. Airing without context implies institutional endorsement of the *conclusion*, not just the *questions*. Public trust is the stake.
      *   **Evaluation Level (Claims vs. Methods vs. Program):**
          *   Need to decide: Are we judging individual weathering claims? No. Are we judging the method? Partially. Are we judging the research program (the synthesis)? Yes.
          *   *Why:* Individual claims might be sound (geological erosion exists), but the *inference* to a lost civilization is a leap. We must evaluate the *coherence of the argument*, not just the raw data. If we only check individual claims, we miss the misleading narrative. If we only check the program, we might miss valid science. The focus must be on the *logical bridge* between data and conclusion.
      *   **Future Criterion:** Need a rule for "Fringe Science vs. Pseudoscience."
          *   *Idea:* Distinguish between "unsettled science" and "contrarian synthesis lacking predictive power."
          *   *Refinement:* A criterion based on "Consilience." Does the theory fit with established knowledge in adjacent fields, or does it require overturning everything else without new predictive power? Or simpler: "Distinguish between challenging a consensus conclusion vs. challenging the methodology of verification itself."
          *   *Better Criterion:* "The Burden of Synthesis." When a program aggregates valid data points to support a conclusion that contradicts the broader web of established knowledge, it requires proportional contextualization.

  4.  **Refining the Tone:**
      *   Must be authoritative but collegial.
      *   Must be concise (it's a memo for a vote).
      *   Must address the specific constraints of the prompt.

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Did I pick a side?* Yes, Option 3.
      *   *Did I steel-man the others?* Need to make sure I don't say "Rejection is censorship." Instead, "Rejection risks stifling legitimate paradigm shifts." Don't say "Airing as-is is lazy." Instead, "Airing as-is risks breaching our duty of care regarding factual accuracy."
      *   *Evaluation level:* I need to be explicit. "We must evaluate the research program's coherence."
      *   *Future Criterion:* Needs to be punchy.

  6.  **Drafting - Iteration 2 (Writing the content):**
      *   *Subject:* Recommendation regarding *Before the Builders*.
      *   *Action:* Conditional Acceptance.
      *   *Steel-manning:*
          *   Faction 1 (Reject): Concern is public misinformation. Valid. But risk of gatekeeping.
          *   Faction 2 (Air): Concern is open discourse. Valid. But risk of false equivalence.
      *   *Evaluation:* We cannot audit every stone (claims). We cannot just look at the vibe (program). We must look at the *inferential method*.
      *   *Criterion:* "Consilience and Context."

  7.  **Final Polish (checking against constraints):**
      *   *Time frame:* "Edits completed within 14 days."
      *   *Strongest version of losing positions:* Ensure I validate the *principles* behind the reject and air-as-is votes.
      *   *Evaluation level:* Explicitly state "Research Program/Inferential Logic."
      *   *Future Criterion:* Clear sentence at the end.

  8.  **Final Review:** Does this sound like a Board Chair? Yes, formal, decisive, nuanced.

  *(Self-Correction during drafting)*: I initially thought about focusing on "methods." But the prompt says the methods (geology) are partly sound. The issue is the *conclusion*. So the evaluation must be on the *argumentative synthesis*. I need to make sure I distinguish between "data" and "narrative."

