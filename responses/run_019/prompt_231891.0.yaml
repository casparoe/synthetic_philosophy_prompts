      *   Proposed Rule (Dual Theory): $V = \sum_{i=1}^{n-1} [r(P(X \ge x_{i+1}))] \times (x_{i+1} - x_i) + x_1$. Or equivalently, using the survival function $S(x) = P(X \ge x)$.
      *   The prompt states $r(p) < p$ for $0 < p < 1$.
      *   If $r(p) < p$, the decision maker is *risk-averse* in the domain of gains (pessimistic about achieving high outcomes).
      *   The prompt explicitly says: "Because r discounts the better outcomes, unlikely large losses weigh more heavily and unlikely large gains weigh less heavily."
      *   *Correction/Refinement:* In Dual Theory, if $r(p)$ is the weighting on the cumulative probability of *better* outcomes, and $r(p) < p$, you are downweighting the good tail. This creates risk aversion.
      *   *Key Insight:* This is mathematically equivalent to maximizing Expected Utility with a concave utility function *if* the probabilities are fixed, but it separates risk attitude from marginal utility of wealth. However, for an endowment, EMV (Risk Neutral) is usually the baseline because the endowment is a perpetual vehicle. Introducing risk aversion via probability weighting is a significant shift in fiduciary mandate interpretation.

