  **MEMORANDUM**

  **TO:** Investment Committee, University Endowment
  **FROM:** Staff Analyst
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Risk-Weighted Valuation Rule

  ### **Bottom Line Recommendation**

  I recommend that the Committee **reject the proposal** to replace Expected Monetary Value (EMV) with the risk-weighted expected-value rule as a general ranking mechanism. We should retain EMV as the primary objective function for investment selection but augment it with explicit tail-risk constraints (e.g., leverage limits, stress testing, and Value-at-Risk thresholds).

  Adopting the proposed risk-weighted rule would systematically penalize positive skewness, effectively disincentivizing the venture capital and private equity exposures that have historically driven the endowment's outperformance. While the proposal correctly identifies a vulnerability in EMV regarding ruinous tail risk, this vulnerability is better managed through fiduciary constraints than by altering the fundamental valuation metric.

  ### **Context and Proposal Overview**

  The Committee currently ranks investment strategies based on Expected Monetary Value (EMV), which treats a 1% chance of gaining $100 million identically to a 100% chance of gaining $1 million, provided the mathematical expectation is equal. This risk-neutral stance supports our long-term horizon but has drawn criticism for potentially approving strategies with unacceptable downside tails (e.g., "picking up pennies in front of a steamroller").

  The proposed alternative utilizes a risk-transformed probability function, $r(p)$, where outcomes are weighted by a pessimistic transformation of their cumulative probabilities ($r(p) < p$). This creates a risk-averse valuation framework that downweights unlikely gains and upweights the significance of unlikely losses. The intent is to filter out tail-risk-heavy strategies that EMV might otherwise approve.

  ### **Analysis of the Proposal**

  The proposed rule is mathematically consistent with Yaari's Dual Theory of Choice. It separates risk attitude from the utility of wealth, embedding risk aversion directly into probability weighting. While theoretically sound for an individual investor with a finite horizon, it presents three critical operational flaws for a perpetual endowment:

  1.  **Penalization of Positive Skew:** The condition $r(p) < p$ implies that as an outcome becomes less probable, its contribution to value is discounted *more* than its objective probability warrants. This disproportionately devalues assets with high positive skew—specifically Venture Capital (VC) and early-stage Private Equity. These asset classes typically feature a high probability of modest loss (or zero return) and a low probability of massive gain. Under the proposed rule, the "home runs" essential to the endowment model would be mathematically undervalued, likely leading to a strategic drift toward lower-return, bond-like assets.
  2.  **Calibration Subjectivity:** The rule requires the Committee to define the specific function $r(p)$. Unlike EMV, which is objective, the shape of $r(p)$ is subjective. Disagreements over the degree of risk aversion would shift from strategy selection to parameter calibration, potentially obscuring accountability.
  3.  **Portfolio Aggregation Issues:** If we apply different valuation rules to different asset classes (e.g., EMV for public equities, risk-weighted for alternatives), we lose the ability to optimize the portfolio as a cohesive whole. Correlation and diversification benefits cannot be accurately modeled if the numerator of the risk-return equation changes across asset classes.

  ### **The Strongest Counter-Argument: Solvency and Ruin**

  Proponents of the risk-weighted rule argue that EMV fails to account for **gambler's ruin**. They correctly note that a strategy with a positive EMV can still be fiduciarily irresponsible if it carries a non-zero probability of total loss. For example, a leveraged strategy might offer a 99% chance of a 10% return and a 1% chance of a 100% loss. EMV ranks this as positive ($0.99 \times 10\% - 0.01 \times 100\% = 8.9\%$), but a single realization of the loss threatens the endowment's ability to support the university's spending needs.

  The proponents argue that only a rule that intrinsically weights tail losses more heavily can prevent the Committee from approving strategies that jeopardize solvency. They contend that risk constraints are often breached or gamed, whereas embedding risk aversion into the valuation rule makes it unavoidable.

  ### **Rebuttal and Alternative Approach**

  While the concern regarding ruin is valid, embedding it into the valuation rule is a blunt instrument that sacrifices upside potential to mitigate downside risk. A more precise fiduciary approach is to **maximize EMV subject to solvency constraints.**

  We can address the ruin argument without adopting the risk-weighted rule by implementing the following:

  *   **Hard Leverage Limits:** Prevent strategies where a single tail event can wipe out capital.
  *   **Stress Testing:** Require all candidate strategies to pass a "worst-case" scenario analysis (e.g., 2008 financial crisis, 2020 liquidity crunch) regardless of their EMV.
  *   **Spending Rule Protection:** Ensure that the liquidity profile of the portfolio can support the spending rate even if tail-risk strategies underperform.

  This approach preserves the EMV framework, allowing us to capture the premium from positive-skew assets (VC/PE), while creating a "fence" that prohibits strategies threatening institutional solvency. It separates the *goal* (maximize value) from the *guardrails* (preserve capital), which is clearer for governance than conflating the two via $r(p)$.

  ### **Conclusion**

  The proposed risk-weighted rule solves the problem of downside tail risk by creating a new problem: the suppression of upside tail return. For a university endowment, the latter is arguably more dangerous to our long-term mission than the former, provided basic solvency is protected.

  I recommend we retain EMV as our ranking standard to maintain consistency with our asset allocation model and return objectives. To address the Committee's legitimate concerns regarding tail risk, I propose we concurrently draft a "Tail-Risk Policy Statement" that sets explicit limits on leverage, liquidity mismatch, and maximum drawdown tolerance for any single strategy. This achieves the safety the proponents seek without compromising the return engine the endowment requires.
