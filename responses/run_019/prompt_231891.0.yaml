      *   **Effect of Proposal:** Discounts better outcomes, weighs unlikely large losses more heavily, weighs unlikely large gains less heavily. (Essentially, it models risk aversion through probability weighting rather than utility curvature).
      *   **Context:** Dispute over tail-risk-heavy strategies.
      *   **Requirements:** Clear bottom line, engage the strongest counter-argument.

  2.  **Deconstruct the Proposed Rule:**
      *   The description matches *Rank-Dependent Utility (RDU)* or *Dual Theory of Choice* (Yaari, 1987), specifically focusing on the probability weighting function $r(p)$.
      *   Condition: $r(p) < p$ for intermediate probabilities. This implies *pessimistic* weighting. If $p$ is the probability of getting *at least* outcome $x$, and we weight the marginal improvement by $r(p)$, and $r(p) < p$, we are downweighting the likelihood of good outcomes relative to their objective probability.
      *   Wait, let's look closer at the math described: "outcomes are ordered from worst to best, and each step of improvement is weighted by $r(p)$, the risk-transformed probability of achieving *at least* that improved outcome."
      *   Let outcomes be $x_1 < x_2 < ... < x_n$ with probabilities $p_1, p_2, ..., p_n$.
