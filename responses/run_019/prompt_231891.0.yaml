      *   **Strongest Counter-Argument:** The EMV rule allows for "ruin" strategies (gambler's ruin). The proposal prevents this.
      *   **Rebuttal:** We can prevent ruin via constraints (leverage limits, VaR) without distorting the valuation of positive alpha opportunities.
      *   **Recommendation:** Reject the rule. Implement specific tail-risk limits.

  6.  **Refining the Math/Logic:**
      *   The prompt describes $r(p) < p$. In Rank Dependent Utility, if we weight the *good* tail by $r(p)$ and $r(p) < p$, we are pessimistic.
