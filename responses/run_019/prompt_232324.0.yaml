answer: |-
  You are right to be annoyed. The slogan "information never hurts" is a linguistic smuggler. It takes a rigorous, conditional mathematical result (Good's Theorem) and strips away the conditions until it becomes a vague heuristic that often fails in practice.

  The core tension you identified is the gap between **instrumental rationality** (making decisions that maximize your goals) and **epistemic rationality** (holding beliefs that match reality), compounded by the reality of **costs** (money, time, and psychological load).

  Here is the menu of precise claims hiding behind the slogan, categorized by their logical status.

  ### The Menu of Claims

  #### 1. The Strict Good's Theorem Claim
  **Claim:** For a rational agent with fixed preferences, receiving a costless signal that updates their probability distribution over states of the world will never decrease their expected utility regarding a subsequent decision.
  *   **Status:** **The thing the theorem actually proves.**
  *   **Commentary:** This is mathematically true but fragile. It relies on three heavy assumptions: (1) The information is literally free (no time, money, or effort to acquire); (2) The agent updates beliefs perfectly via Bayes' rule; (3) "Utility" is defined strictly over the *outcome* of the decision, not the state of knowing. Crucially, it proves value is $\ge 0$, not strictly $> 0$. Information can be worthless (if it wouldn't change your action), but under these strict conditions, it cannot be harmful.

  #### 2. The Net Value Claim
  **Claim:** The Expected Value of Information (EVI) exceeds the Cost of Information (CI) in this specific instance.
  *   **Status:** **A substantive and defensible claim.**
  *   **Commentary:** This is not a theorem; it is an empirical bet. In the real world, information is never costless. It costs time to read, money to buy, or engineering hours to interview. This claim asserts that $EVI - CI > 0$. This is often true, but often false. It requires estimating the probability that the new data will change your decision *and* the magnitude of that change, then weighing it against the cost of acquisition.

  #### 3. The Epistemic Imperative Claim
  **Claim:** Knowing the truth has intrinsic value independent of any decision it helps you make; therefore, avoiding true beliefs is inherently a loss of utility.
  *   **Status:** **A substantive and defensible claim.**
  *   **Commentary:** This moves outside decision theory into epistemology and ethics. It argues that "being dumber" (having a map that doesn't match the territory) is a harm in itself, regardless of whether that map is used for navigation. This is a philosophical stance (often associated with Mill or Enlightenment ideals), not a mathematical proof. It is defensible, but it is not what Good's Theorem is about.

  #### 4. The Cost-Ignorance Claim
  **Claim:** Because information has non-negative value in theory, we should treat the cost of acquiring it as negligible in practice.
  *   **Status:** **Just false.**
  *   **Commentary:** This is the most common error. It assumes that because $EVI \ge 0$ (in the costless model), then $EVI - Cost \ge 0$ (in reality). This leads to "analysis paralysis," where teams spend \$100k to resolve a \$10k uncertainty. Opportunity costs (delay) are real costs.

  #### 5. The Psychological Neutrality Claim
  **Claim:** Receiving information does not induce negative psychological states (anxiety, paralysis, despair) that function as a "cost" reducing overall utility.
  *   **Status:** **Just false.**
  *   **Commentary:** Human utility functions are not stable fixed points. Learning you have a genetic marker for a disease can induce stress that lowers your quality of life *now*, regardless of future medical decisions. If the distress outweighs the instrumental benefit of planning, the information has negative net utility. Good's Theorem assumes a rational agent who does not suffer from "news shock."

  ---

  ### Application to Your Scenarios

  #### 1. The Project Manager (The Extra Interviews)
  **The Slogan:** "More data can't hurt us, it can only improve the decision."

  **The Required Reading:**
  To justify the extra work, your PM is relying on **Claim #2 (The Net Value Claim)**, but they are speaking as if it were **Claim #1 (The Strict Theorem)**.

  *   **Why it's shaky:** They are implicitly treating the cost of the interviews (engineering delay, designer time, opportunity cost of not shipping) as zero. They are assuming $Cost \approx 0$.
  *   **How to justify it:** For the PM to be correct, they must demonstrate that the **Value of Information** is high. This only happens if:
      1.  There is a significant chance the interviews will change the product direction (if you'd build the same thing regardless, the info is worthless).
      2.  The cost of building the *wrong* thing is massive compared to the cost of the interviews.
  *   **Verdict:** If the interviews cost 2 weeks of delay and the risk of building the wrong feature is \$500k, the PM is right (Claim #2 holds). If the risk is low and the delay is costly, they are falling for Claim #4 (Cost-Ignorance), and the slogan is false.

  #### 2. The Friend (The Genetic Test)
  **The Slogan:** "Refusing to look... is voluntarily making yourself dumber."

  **The Required Reading:**
  Your friend is relying on **Claim #3 (The Epistemic Imperative)**, possibly mixed with a denial of **Claim #5 (Psychological Neutrality)**.

  *   **Why Good's Theorem doesn't apply:** Good's Theorem is about *instrumental* rationality (maximizing outcomes). If knowing the result causes you enough anxiety to lower your life satisfaction, and that knowledge doesn't allow you to take any preventive medical action (or if you wouldn't take it anyway), then instrumentally, *not* looking is the rational choice. The "cost" of the information is the psychological distress.
  *   **The Friend's Actual Argument:** Your friend is arguing that you have a duty to **epistemic** rationality. They are claiming that "accuracy" is a terminal value. They are effectively saying, "Your utility function *should* include truth-seeking, and you are wrong to weigh peace of mind higher than accuracy."
  *   **Verdict:** Your friend is not making a decision-theoretic argument; they are making a moral/philosophical one. Under standard decision theory (where utility includes mental health), refusing the test can be perfectly rational. Under your friend's specific epistemic ethic, it is not.

  ### Summary
  *   **Good's Theorem** proves information is free lunch *only if* the lunch is free.
  *   **Your PM** is ignoring the price of the lunch (time/cost). They need to prove the meal is worth the bill.
  *   **Your Friend** is arguing you should eat the lunch even if it tastes bad, because "eating" (knowing) is a virtue in itself.

  The slogan "information never hurts" is only true if you define "hurt" narrowly as "reducing the expected mathematical payoff of a decision under costless conditions." Once you add cost, psychology, or the value of ignorance, the slogan breaks.
