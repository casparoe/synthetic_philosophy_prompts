prompt: |-
  I run a small policy experimentation unit inside the government of a mid-sized city — about 400,000 residents. My office fields roughly a dozen proposals a year from departments and council members who want to "pilot" something: a new transit fare structure, a participatory budgeting expansion, a congestion charge, a redesigned permitting process. My job is to decide which proposals get piloted, how the pilots are run, and what happens afterwards. The stakes are real but not life-and-death; each pilot costs between tens of thousands and a few million dollars, and any decision to scale a pilot citywide ultimately rests with the elected council, not with me.

  I have been trying to run this office on Deweyan lines — Dewey's experimentalism about inquiry and democracy, the view associated with works like his Logic: The Theory of Inquiry and The Public and Its Problems. I want the translation done properly. Write me a decision procedure I can actually apply to each proposal that lands on my desk: the questions to ask in order, what counts as an adequate answer to each, where the procedure terminates in a clear no, and where it must hand the question over to elected officials or to the affected residents because the matter is one of ends rather than means.

  The procedure has to preserve the parts of Dewey's view that are easiest to lose in practice, so please build in explicit tests for the following:

  - Whether the proposal begins from a genuinely problematic situation — a concrete difficulty experienced by identifiable people — or from a solution in search of a problem, which on Dewey's picture is not inquiry at all.
  - Whether the pilot is designed as a test of a hypothesis, where certain outcomes would count as evidence against the policy and force revision or abandonment, or whether it is pilot-theater: a trial whose design guarantees "success" and functions as marketing for a decision already made. Give me diagnostic questions that distinguish the two, since sponsors rarely admit to the second.
  - How to handle Dewey's claim about ends-in-view: the idea that goals stated in advance of inquiry are provisional and should be revised in light of what the means and consequences turn out to be. Concretely, I need to know what the procedure does when a pilot "fails" against its stated objectives but produces valuable unanticipated consequences, and when it "succeeds" against its stated objectives while generating harms nobody thought to measure.
  - Dewey's account of the public: those indirectly affected by transactions who must organize to have a say over them. My pilots often affect people who are not at the table — shift workers, undocumented residents, commuters from outside the city. Tell me how the procedure should identify the affected public for a given proposal, and at what point a pilot's design is invalid because the people bearing its consequences have no channel into it.
  - Where the procedure has to stop deferring to experimentation altogether. Some proposals are not revisable (a demolition, an irreversible infrastructure commitment), and some questions — how much inequality to tolerate, which neighborhoods matter — are not the kind that evidence settles. Mark these handoff points explicitly.

  Then run the finished procedure on two proposals, showing its work at each step: (1) a six-month congestion pricing pilot in the downtown core, with revenues earmarked for bus service, proposed by a council member who is clearly already committed to a permanent scheme; and (2) a proposal to replace the city's public comment process at council meetings with a standing citizens' assembly of forty randomly selected residents. At least one of these should come out with an answer I will not enjoy defending.

  Close with a candid account of what the procedure cannot do: where Dewey's theory itself gives out or becomes unhelpfully vague when pressed into administrative form, and which steps in my procedure are judgment calls wearing procedural clothing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a policy experimentation unit in a mid-sized city (400k residents).
      *   **Task:** Create a decision procedure based on John Dewey's experimentalism (Logic: The Theory of Inquiry, The Public and Its Problems) for evaluating policy pilot proposals.
      *   **Key Requirements:**
          *   Must be actionable (questions in order, adequate answers, termination points).
          *   Must preserve specific Deweyan concepts:
              *   Problematic Situation (vs. solution in search of a problem).
              *   Genuine Inquiry vs. Pilot-Theater (falsifiability).
              *   Ends-in-View (provisional goals, handling unintended consequences).
              *   The Public (identifying indirectly affected parties, inclusion).
              *   Limits of Experimentation (irreversibility, questions of value/ends).
          *   Must apply the procedure to two specific cases:
              1.  Congestion Pricing Pilot (Council member already committed).
              2.  Citizens' Assembly replacing Public Comment.
          *   At least one outcome must be "unpleasant to defend."
          *   Must close with a candid critique of the procedure's own limitations (where Dewey is vague or where judgment calls are disguised as procedure).

  2.  **Deconstruct Deweyan Experimentalism for Administration:**
      *   *Logic: The Theory of Inquiry:* Inquiry starts with an indeterminate situation. It moves to a problem statement. Ideas (hypotheses) are plans of action. Reasoning elaborates consequences. Observation/Experiment tests them. Judgment settles the warrant.
      *   *The Public and Its Problems:* The Public consists of those indirectly affected by consequences of transactions. Democracy is the method of associated living and communication. Experts serve the public, not rule it.
      *   *Ethics/Democracy:* Ends and means are continuous. Ends-in-view guide action but are revised by consequences. Values are not fixed antecedents but discovered in practice.

  3.  **Drafting the Decision Procedure (The "Deweyan Audit"):**
      *   *Phase 1: The Problematic Situation.* Is there a real trouble? Or just a pet idea?
      *   *Phase 2: The Hypothesis & Falsifiability.* Is this a test or a show? Can it fail?
      *   *Phase 3: The Public.* Who is affected? Are they involved?
      *   *Phase 4: Ends-in-View & Revisability.* Are goals flexible? What about side effects?
      *   *Phase 5: Limits.* Is it irreversible? Is it a value judgment masquerading as technical?
      *   *Decision Nodes:* Go/No-Go/Handoff.

  4.  **Developing the Diagnostic Questions (Iterative Refinement):**
      *   *Problem:* Need to distinguish "traffic is bad" (vague) from "commuters miss work due to bus latency" (specific).
      *   *Theater:* Need to ask "What result would kill this project?" If the answer is "none," it's theater.
      *   *Public:* Need a mechanism to map indirect consequences.
      *   *Ends:* Need a protocol for "successful failure" (good side effects, missed target) and "failed success" (hit target, bad side effects).
      *   *Limits:* Distinguish technical means from moral ends.

  5.  **Applying the Procedure to Case 1: Congestion Pricing:**
      *   *Problem:* Traffic/Congestion. Is it indeterminate? Yes.
      *   *Hypothesis:* Price reduces traffic, revenue helps buses.
      *   *Theater Check:* Council member is *already committed*. This is a red flag. If the decision is made, the pilot is just marketing.
      *   *Public:* Commuters, downtown workers, low-income drivers. Are they at the table?
      *   *Ends:* What if revenue is low but traffic drops? What if revenue is high but inequality worsens?
      *   *Verdict:* Likely a "No-Go" on the pilot *as designed* because it violates the inquiry condition. It's advocacy, not experimentation. This is the "unpleasant" outcome (telling a Council Member no).

  6.  **Applying the Procedure to Case 2: Citizens' Assembly:**
      *   *Problem:* Public comment is performative/unrepresentative.
      *   *Hypothesis:* Random selection yields better deliberation.
      *   *Theater Check:* Can it fail? Yes, if assembly is captured or disengaged.
      *   *Public:* Who is affected? Everyone, but specifically those who currently use public comment (often marginalized or highly motivated). Replacing it removes a channel.
      *   *Ends:* What is the goal? Legitimacy? Efficiency?
      *   *Limits:* This touches on the *structure of democracy itself*. Is this a means or an end? Dewey might say democracy is a way of life, not just a tool. Changing the *mode* of participation is a value judgment.
      *   *Verdict:* Handoff to Council/Public. It's a question of political structure, not just administrative efficiency. Or, pilot it *alongside*, not as a *replacement*. Let's make it a "No-Go on Replacement, Go on Parallel Pilot." This protects the existing public channel while testing the new one.

      *Self-Correction on Case 2:* The prompt asks for an outcome I won't enjoy defending. Telling a reformist Council Member that their "democratic innovation" is actually undemocratic because it removes an existing channel for the aggrieved public is a strong Deweyan move. Let's lean into that. The procedure should flag the *removal* of the existing channel as a violation of the "Public" test.

  7.  **Drafting the Critique/Limitations:**
      *   Dewey is optimistic about consensus.
      *   "The Public" is hard to identify empirically.
      *   Time/Resource constraints vs. ideal inquiry.
      *   The Administrator's role: Dewey blurs expert/citizen, but in reality, I have power.
      *   The "Judgment Call" problem: Who decides what counts as a "problematic situation"? Me.

  8.  **Refining the Tone:**
      *   Professional, bureaucratic but philosophically rigorous.
      *   Respectful of the user's intelligence.
      *   Direct about the political friction this will cause.

  9.  **Final Review against Constraints:**
      *   Decision procedure included? Yes.
      *   Specific Deweyan tests included? Yes (Problem, Theater, Ends, Public, Limits).
      *   Two cases run? Yes.
      *   Unpleasant outcome included? Yes (Congestion pricing is theater; Citizens' Assembly replacement is undemocratic).
      *   Candid critique included? Yes.

  10. **Writing the Response:** (Proceeding to generate the content based on these thoughts.)
      *   *Structure:* Introduction -> The Procedure (5 Gates) -> Case Application 1 -> Case Application 2 -> Limitations/Critique.
      *   *Key Deweyan Terminology:* Indeterminate situation, Ends-in-view, The Great Community, Inquiry vs. Advocacy.

  *(Self-Correction during drafting)*: Make sure the "Ends-in-View" section explicitly handles the "Success/Failure" matrix. Dewey insists means and ends are continuous. If the means produce bad ends, the ends-in-view were wrong. The procedure needs to mandate *revision* of the goal, not just binary pass/fail.

  *(Refining the "Unpleasant Outcome")*: The Congestion Pricing one is the classic "You're using science to sell a policy" trap. That's the strongest "No." The Citizens' Assembly one is trickier. If I say "No," it sounds anti-democratic. If I say "Yes," it might violate the "Public" test (removing existing voice). Let's make the Citizens' Assembly verdict a "Conditional Yes" that requires keeping the old system, which might annoy the proponent who wants to *fix* the broken system. Actually, the Congestion Pricing "No" is stronger because it accuses the Council Member of bad faith (or at least bad epistemology). Let's stick with that as the primary friction point.

  *(Final Polish)*: Ensure the distinction between "Technical Means" and "Moral Ends" is clear in the Limits section. Dewey rejects the dualism, but acknowledges that some conflicts are conflicts of *value*, not just fact.

  Let's write it.cw
answer: |-
  ## The Deweyan Audit: A Decision Procedure for Policy Pilots

  This procedure translates John Dewey's *Logic: The Theory of Inquiry* and *The Public and Its Problems* into an administrative workflow. It treats policy not as the implementation of fixed values, but as **social inquiry**. Its goal is to distinguish between genuine learning (inquiry) and political advocacy (theater), and to ensure that the "Public" constituted by the policy's consequences has a voice in its formation.

  There are five gates. A proposal must pass each to proceed to a pilot. If it fails a gate, the procedure terminates or hands the decision off.

  ### Gate 1: The Problematic Situation
  **Deweyan Principle:** Inquiry begins only with an *indeterminate situation*—a concrete disturbance in the lived experience of specific people. It cannot begin with a pre-packaged solution.
  **Diagnostic Questions:**
  1.  Can the sponsor describe the "trouble" without naming the proposed solution? (e.g., "Bus times are unpredictable" vs. "We need an app.")
  2.  Can the sponsor identify *who* is troubled, specifically? (Not "the public," but "night-shift workers on the Line 4 corridor.")
  3.  Is the trouble observable and shared, or is it a theoretical inefficiency identified only by experts?
  **Adequate Answer:** A narrative describing a specific disruption in habit or function experienced by an identifiable group, verified by data or testimony *prior* to the proposal.
  **Termination (No):** If the "problem" disappears when the proposed solution is removed from the description, the proposal is a **Solution in Search of a Problem**. Reject.
  **Handoff:** If the "trouble" is a fundamental disagreement about values (e.g., "We value density" vs. "We value single-family zoning"), this is not a technical problem. Hand off to Council for legislative debate.

  ### Gate 2: The Hypothesis & Falsifiability
  **Deweyan Principle:** A pilot is an experiment, not a demonstration. It tests a hypothesis where the consequence could logically disprove the idea.
  **Diagnostic Questions:**
  1.  What specific observation would count as evidence *against* continuing this policy?
  2.  Is the sponsor willing to abandon or radically revise the policy if that evidence appears?
  3.  Are the success metrics defined *before* the pilot begins, and do they include negative indicators (harm, cost overruns, displacement)?
  **Adequate Answer:** A clear "If-Then" statement: "If [Metric X] does not improve by [Amount Y], or if [Harm Z] increases, we will not scale this."
  **Termination (No):** If the sponsor cannot name a condition under which they would kill the project, this is **Pilot-Theater**. It is marketing, not inquiry. Reject.
  **Handoff:** If the sponsor admits the pilot is to "build political will" rather than test efficacy, acknowledge this honesty but refuse the "experiment" label. Hand off to Communications/Political Office.

  ### Gate 3: Constitution of the Public
  **Deweyan Principle:** The "Public" consists of all those indirectly affected by the consequences of a transaction. If a pilot creates consequences for people who have no channel to register those consequences, the inquiry is invalid.
  **Diagnostic Questions:**
  1.  Who bears the costs/risks of this pilot who is not in the room proposing it? (e.g., undocumented residents, commuters, neighboring jurisdictions.)
  2.  Does the pilot design include a mechanism for these affected parties to report negative consequences *during* the trial, not just at the end?
  3.  Is the feedback channel accessible to them (language, timing, trust)?
  **Adequate Answer:** A stakeholder map that includes indirect actors, and a budgeted feedback mechanism (e.g., ombudsperson, dedicated hotline, community liaisons) active during the pilot.
  **Termination (No):** If the affected public is structurally excluded from reporting harm (e.g., a policy affecting undocumented residents requiring ID to report issues), the pilot is **Epistemically Blind**. Reject.
  **Handoff:** If the affected public is the entire electorate or a constituency larger than the city's administrative jurisdiction, hand off to Council.

  ### Gate 4: Ends-in-View and Continuity
  **Deweyan Principle:** Ends are not fixed targets; they are *ends-in-view* that guide action but must be revised in light of the means used and consequences produced. Means and ends are continuous.
  **Diagnostic Questions:**
  1.  If the pilot hits its target metric but creates a severe unmeasured harm (e.g., efficiency rises, but equity falls), is the pilot considered a "success"?
  2.  If the pilot misses its target metric but produces a valuable unexpected outcome (e.g., traffic didn't drop, but air quality improved), is the pilot considered a "failure"?
  3.  Does the evaluation plan allow for the *goal itself* to be rewritten based on interim data?
  **Adequate Answer:** A commitment that the final recommendation will evaluate the *totality* of consequences, not just compliance with pre-set KPIs. The sponsor must agree that "Success" is a judgment of value, not just a data point.
  **Termination (No):** If the sponsor insists that missing the primary KPI constitutes failure regardless of other outcomes, they are treating ends as fixed. This violates experimentalism. Reject or require revision.
  **Handoff:** If the trade-off involves fundamental moral weights (e.g., "Is a 10% efficiency gain worth a 5% increase in inequality?"), this is a value judgment. Hand off to Council.

  ### Gate 5: Irreversibility and Scope
  **Deweyan Principle:** Experimentation requires the ability to reconstruct the situation. Some actions foreclose future inquiry.
  **Diagnostic Questions:**
  1.  Can the pilot be undone without significant sunk cost or physical destruction?
  2.  Does the pilot establish a precedent or infrastructure that makes returning to the status quo impossible (lock-in)?
  3.  Is the question one of technical means (how to achieve X) or moral ends (whether we should want X)?
  **Adequate Answer:** The pilot is reversible. The question is primarily about means/consequences, not ultimate values.
  **Termination (No):** If the pilot involves irreversible demolition, long-term contractual lock-ins, or fundamental changes to democratic rights, it is **Not a Pilot**. It is a policy decision. Hand off to Council.
  **Handoff:** Any proposal that fails the reversibility test must go to elected officials for a permanent decision, not an experimental one.

  ***

  ## Application of the Procedure

  ### Case 1: Downtown Congestion Pricing Pilot
  **Proposal:** Six-month fee for vehicles entering downtown. Revenue earmarked for bus frequency. Proposed by Council Member A.
  **Sponsor Stance:** Council Member A has given interviews stating, "Congestion pricing is the only way to save our city," and has drafted legislation for permanent implementation pending the pilot.

  **Gate 1 (Problematic Situation):**
  *   *Analysis:* Traffic congestion is a concrete, shared trouble. Commuters and residents experience delay and pollution.
  *   *Verdict:* **Pass.**

  **Gate 2 (Hypothesis & Falsifiability):**
  *   *Analysis:* I ask the sponsor: "What result would make you vote against permanent implementation?"
  *   *Sponsor Response:* "If revenue is significantly lower than projected, we'd need to adjust the rate. But the principle must stand."
  *   *Diagnostic:* The sponsor is committed to the *principle* regardless of the specific outcome. The pilot is framed as a "demonstration of feasibility" rather than a test of desirability.
  *   *Verdict:* **Fail.** This is **Pilot-Theater**. The decision has been made; the pilot is risk mitigation for the politics, not inquiry into the policy.
  *   *Action:* **Terminate.** I cannot authorize this as an experiment. I must inform the Council Member that my office cannot validate a process where the conclusion precedes the inquiry.
  *   *Defensibility:* This is the outcome I will not enjoy defending. I am telling an elected official that their "compromise" (let's pilot it first) is intellectually dishonest according to the rules of inquiry. They will argue I am obstructing progress. Dewey would argue I am protecting the integrity of social intelligence.

  ### Case 2: Citizens' Assembly Replacing Public Comment
  **Proposal:** Replace the 3-minute public comment period at Council meetings with a standing Citizens' Assembly of 40 randomly selected residents who meet monthly to advise Council.
  **Sponsor Stance:** "Public comment is performative and dominated by loud voices. We need deliberative democracy."

  **Gate 1 (Problematic Situation):**
  *   *Analysis:* The "trouble" is that current participation is unrepresentative and often unproductive. This is a shared frustration among staff and Council.
  *   *Verdict:* **Pass.**

  **Gate 2 (Hypothesis & Falsifiability):**
  *   *Analysis:* Hypothesis: Random selection yields better advice. Can it fail? Yes, if assembly participation is low or advice is ignored.
  *   *Verdict:* **Pass.**

  **Gate 3 (Constitution of the Public):**
  *   *Analysis:* Who is affected? The current users of public comment. These are often marginalized groups, activists, and residents with specific grievances who rely on that 3 minutes as their *only* direct access to power.
  *   *Diagnostic:* The proposal *removes* an existing channel to create a new one. The "Public" affected includes those who lose their voice.
  *   *Sponsor Plan:* The Assembly replaces the comment period.
  *   *Verdict:* **Fail.** By eliminating the existing channel, the pilot prevents the affected public (current commenters) from registering the consequence of the loss. It creates a "blind spot" where the harm of silencing cannot be measured because the microphone is turned off.
  *   *Action:* **Conditional Handoff/Revision.** I cannot approve the *replacement*. I can approve a *parallel* pilot (Assembly exists alongside comment period). If the sponsor insists on replacement, it must go to Council as a permanent structural change, not a pilot, because it alters the rights of access.
  *   *Defensibility:* This is also unpleasant. I am defending the right of the "loud voice" to remain in the room against a "more democratic" random selection. Dewey warns against technocratic definitions of the public. The "Public" is self-organizing; by selecting them, we may be breaking the very association we seek to study.

  ***

  ## Candid Critique: Where the Procedure Breaks

  You asked for a tool you can use, but also for honesty about where Dewey's theory strains against administrative reality. Here is where this procedure is vulnerable:

  **1. The "Problem" is Politically Constructed**
  Gate 1 assumes we can distinguish a "genuine problem" from a "political preference." Dewey believes inquiry can clarify this. In practice, *I* decide what counts as a genuine problem. If a Council Member says "The problem is that people feel unsafe," and I say "That is not an indeterminate situation, that is a feeling," I am using the procedure to silence a political claim. The procedure disguises my judgment as epistemological rigor. Dewey offers no algorithm for distinguishing a "real" trouble from a "perceived" one when the perception *is* the political reality.

  **2. The Identification of "The Public" is Infinite**
  Gate 3 requires mapping the affected public. Dewey admits the Public is often "eclipsed." In a city of 400,000, almost any policy has indirect effects on almost everyone (via tax base, culture, traffic). If I take Gate 3 seriously, I may never find a pilot where the Public is fully constituted. I will be forced to make arbitrary cutoffs on who counts as "affected enough" to deserve a voice. The procedure demands inclusion but provides no limit on it. I will inevitably exclude people and claim they weren't "really" affected.

  **3. The Means/Ends Continuum is Administratively Paralyzing**
  Gate 4 insists ends-in-view are revisable. This is philosophically sound but bureaucratically dangerous. If I tell a department, "You can change your success metrics halfway through based on what you learn," I invite accusations of moving the goalposts to ensure success. Civil service rules and grant requirements demand fixed KPIs. Dewey's continuity of means and ends conflicts with the accountability structures of the modern state. I am asking sponsors to be philosophers when they are being asked to be managers.

  **4. The Illusion of Reversibility**
  Gate 5 assumes we can know what is irreversible. But social interventions create expectations. Even if I tear down a bike lane after a pilot, the *conversation* has changed. The "status quo" is never truly recoverable. Dewey treats inquiry as reconstruction, but in government, every action creates a constituency. My procedure treats policies as technical adjustments, but they are always acts of power that shift alliances.

  **5. My Own Role**
  Finally, Dewey envisions a democracy where experts serve the public's inquiry. But this procedure makes *me* the gatekeeper of inquiry. I decide what is "theater" and what is "science." I decide who counts as "the Public." There is no step in this procedure where *my* power is subjected to the same experimental scrutiny. I am the unexamined variable in the experiment. Dewey would likely warn me that institutionalizing his method risks turning "experimentalism" into just another bureaucratic bureaucracy—a way to say "No" while sounding like a philosopher.

  **Recommendation:** Use the procedure, but publish its outcomes. If you reject a proposal as "Pilot-Theater," make that finding public. Subject your own gatekeeping to the light of the Public you are trying to serve. Otherwise, you are simply building a smarter wall.
