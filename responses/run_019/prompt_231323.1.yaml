answer: |-
  **Elena:** Let's stick with late preemption. Suzy throws, Billy holds back. The window shatters. If Suzy hadn't thrown, Billy would have. So, the shattering doesn't counterfactually depend on Suzy's throw. Your classic problem.

  **Mark:** And my classic solution: structural equations. We model the backup cause as off-switched by the primary cause. We trace the active path. It's not about bare counterfactual dependence; it's about dependence along a complete causal path holding off-path variables fixed.

  **Elena:** But that requires you to know *which* variables are causal relata beforehand. You're smuggling the causal structure into the model to solve the causal problem.

  **Mark:** It's recursive, not circular. We define interventions relative to a graph. But fine, let's talk about the intervention itself. You always claim I define 'intervention' using causal language.

  **Elena:** You define an intervention variable *I* on *X* with respect to *Y* as something that changes *X* without affecting *Y* except through *X*. But "affecting" and "through" are causal notions. You haven't reduced causation to non-causal terms; you've analyzed it in terms of itself.

  **Mark:** I'm not offering a reductive metaphysics. I'm offering an account of causal *explanation*. We need invariant generalizations. If I can't manipulate *X* to change *Y*, there's no causal claim there. But I'll concede the circularity worry bites harder for actual causation than type-level claims. If we can't spell out 'intervention' without causal graphs, token causation rests on type-level assumptions we might not have.

  **Elena:** Exactly. My counterfactuals try to ground the tokens directly in similarity metrics between worlds. Though, I'll concede preemption forced me to abandon simple dependence for chains of dependence. I don't have a reductive analysis of the links either.

  **Mark:** But consider proportionality. Is it the *throw* that caused the break, or the *throw at 5m/s*? If I intervene on the speed, the break still happens. If I intervene on the throw itself, it doesn't. My framework suggests the cause should be proportional to the effect. The specific mass is too detailed; the mere 'throw' is too vague.

  **Elena:** And my similarity metric handles that. Worlds where the throw varies slightly but the break holds are closer than worlds where the throw vanishes. But I see your point. If I say the cause is the *exact microphysical configuration*, it's too specific. If I say 'object moved', it's too broad.

  **Mark:** So you agree granularity matters. But where do you draw the line without pragmatic interests? My interventionism admits pragmatism: variables are chosen based on what we can manipulate.

  **Elena:** That's where we diverge. I want causation to be mind-independent. If no agent exists, Suzy still causes the break. Your reliance on 'manipulation' risks making causation anthropocentric.

  **Mark:** Not manipulation by *humans*, but hypothetical interventions. God could intervene. But look, on actual vs. general causation: you try to build tokens from counterfactuals. I build tokens from instances of invariant types. If the preemption case breaks the type-level invariant, the token claim fails.

  **Elena:** And if the similarity metric is context-sensitive, the token claim fails. We're both struggling with the same gap.

  **Mark:** Then perhaps the consensus isn't on the analysis, but the tools. Counterfactuals are indispensable.

  **Elena:** Agreed. But don't call it reduction.

  ***

  **Note on Field Status**

  **Fairly Established:**
  *   **Regularity theories are insufficient:** Mere constant conjunction (Hume) is widely rejected as a complete account of causation.
  *   **Counterfactuals are central:** Almost all contemporary accounts (including interventionism) rely on counterfactual reasoning to distinguish causation from correlation.
  *   **Preemption is a key test case:** Any viable theory must account for cases where a backup cause is present but inactive.

  **Genuinely Open:**
  *   **Reductivity:** Whether causation can be analyzed in non-causal terms (e.g., defining "intervention" without causal graphs) remains unresolved. Many now accept a non-reductive, primitivist, or pluralist stance.
  *   **Proportionality:** There is no consensus on whether causes must be "proportional" to their effects (Yablo's constraint) or how to formalize the correct grain of causation.
  *   **Actual vs. Type Causation:** The relationship between token (actual) causation and type (general) causation is disputed. Interventionists prioritize type-level invariants; Lewisians prioritize token-level counterfactual chains.
  *   **Anthropocentrism:** Whether manipulability accounts inevitably make causation dependent on agents (or possible agents) is a live metaphysical debate.
