answer: |-
  Here is a structural plan for your two-hour seminar. It is designed to guide the students through a phenomenological experience of induction, moving from naive feature-matching to a structural understanding of rule-constraint.

  ### I. Order of Ideas and Dependency Structure

  Do not begin by defining induction or explaining Bongard problems. The logic of the session must mirror the logic of discovery.

  **Phase 1: The Trap of Positive Evidence (0:00–0:30)**
  *   **Action:** Present only the six **Positive** boxes of your carrying example. Hide the negatives.
  *   **Task:** Ask students to write down the rule.
  *   **Pedagogical Goal:** Induce the "Common Features" misconception. They will list visual properties shared by the six images (e.g., "they are all closed," "they all have straight lines").
  *   **Dependency:** You cannot explain the function of negative examples until they have committed to a hypothesis based solely on positives. They must feel the confidence of a rule that *seems* complete.

  **Phase 2: The Constitutive Role of Negatives (0:30–1:00)**
  *   **Action:** Reveal the six **Negative** boxes.
  *   **Task:** Ask them to test their Phase 1 rules against the new panel.
  *   **Pedagogical Goal:** Wreck the Phase 1 rules. Show that the negatives are not merely a "test" administered after the fact, but constraints that actively shape the hypothesis space. A rule that fits the positives is worthless if it does not exclude the negatives.
  *   **Dependency:** You cannot teach underdetermination yet. First, they must believe that *one* correct rule exists and that the 12 boxes are sufficient to find it.

  **Phase 3: The Underdetermination Leap (1:00–1:30)**
  *   **Action:** Once the class agrees on a rule that fits all 12 boxes, propose a **Rival Rule**. This is a different logical formulation that also perfectly sorts all 12 boxes.
  *   **Task:** Ask: "Data-wise, how do we choose between Rule A and Rule B?"
  *   **Pedagogical Goal:** Demonstrate that the 12 boxes do not logically necessitate the rule. The move from examples to concept is a leap (inference to the best explanation), not a deduction.
  *   **Dependency:** This only lands if they have already struggled to find *a* rule. If they haven't felt the constraint of the data, the freedom of the rule feels like cheating rather than philosophy.

  **Phase 4: Assessment and Open Closure (1:30–2:00)**
  *   **Action:** Generative assessment and meta-discussion.
  *   **Pedagogical Goal:** Verify understanding and prevent premature ontological closure.

  ---

  ### II. The Carrying Example: "The Loose End" Problem

  You need a problem where the visual gestalt misleads the feature-tabulator. Do not use standard geometric properties (color, number of sides). Use topological or structural relations.

  **The Target Rule:** *"Every line segment in the figure terminates at a junction with another line segment."* (Colloquially: "No loose ends.")

  **Design of the Six Positives:**
  1.  A simple triangle.
  2.  A square with a diagonal cross (X) inside.
  3.  A figure-eight curve.
  4.  A 'T' shape (the top bar ends at the stem, the stem ends at the top bar).
  5.  A circle with a diameter line.
  6.  A complex mesh where all lines connect.
  *   **Why:** These look visually diverse. Some are "closed" (1, 3, 5), some are "open" (4). This prevents the rule "It is a closed shape."

  **Design of the Six Negatives (Crucial Step):**
  These must be constructed to kill specific wrong hypotheses, not just fail the target rule.
  1.  **To kill "Closed Shapes":** A square with a single line segment sticking out from one corner. (Visually looks like a closed shape, but has a loose end).
  2.  **To kill "Straight Lines Only":** A curved arc that does not close. (Visually open, fails rule).
  3.  **To kill "Symmetry":** A lopsided 'V' shape. (Fails rule, asymmetric).
  4.  **To kill "Single Component":** A circle next to a disjoint line segment. (The circle is fine, the line has loose ends).
  5.  **To kill "Complexity":** A single straight line. (Simple, but fails).
  6.  **To kill "Intersections":** Two parallel lines. (No intersections, all loose ends).

  **Why this example works:** It forces the student to look at *endpoints*, not global shapes. The negatives are specifically engineered to look like they *should* be positives (e.g., the square with the tail) to break the "Gestalt" shortcut.

  ---

  ### III. Misconception Map

  Here is how to intercept the four specific errors you identified, timed to the sequence above.

  **1. Misconception: "The concept is just the common features of the positives."**
  *   **Where:** Phase 1 (Positives Only).
  *   **Intervention:** When a student proposes a feature (e.g., "They are all polygons"), point to a Positive that lacks it (e.g., the figure-eight or circle). Do not correct them; ask the class to find a counter-example within the Positives. Force them to realize that surface features vary too much. The "commonality" must be relational, not perceptual.

  **2. Misconception: "The negatives are only a check on a rule one has already formed."**
  *   **Where:** Phase 2 (Reveal Negatives).
  *   **Intervention:** When a student says, "I had the right idea, but this box disproves it," correct the language. Say: "You didn't have a rule yet. You had a guess. The negative box is not a test score; it is a boundary wall. You cannot build the house without knowing where the walls are." Emphasize that the negative examples *reduce the hypothesis space* just as much as the positives do.

  **3. Misconception: "One more positive example would settle which of two rival rules is correct."**
  *   **Where:** Phase 3 (Underdetermination).
  *   **Intervention:** Introduce your **Rival Rule**. (e.g., Target: "No loose ends." Rival: "The number of endpoints is zero OR the figure contains a closed loop." *Note: Design the rival rule specifically to fit the existing 12 boxes.*) Ask: "If I give you a 13th Positive box, can it distinguish these?"
  *   **The Point:** Show that a new Positive box will, by definition, fit *both* rules (otherwise it wouldn't be a Positive). To distinguish rules, you need a *Negative* box that one rule accepts and the other rejects. Positives confirm; they do not distinguish.

  **4. Misconception: "The right rule is whichever is simplest."**
  *   **Where:** Phase 3 (Underdetermination).
  *   **Intervention:** Acknowledge that simplicity (Occam's Razor) is a heuristic, not a logical truth. Ask: "Simple for whom? For a computer counting pixels? Or for a human eye?" Show that 'simplicity' is a bias we bring to the data, not a property of the data itself. This prepares them for the cognitive science angle (inductive bias).

  ---

  ### IV. Assessment: The Adversarial Generation

  Do not end by asking "What is the rule?" A student can memorize the rule without understanding its extension.

  **The Task:**
  Ask each student to draw two new boxes on a slip of paper:
  1.  A **New Positive**: A box that fits the rule.
  2.  A **New Negative**: A box that *looks* like it should be a Positive (visually similar to the left panel) but violates the rule.

  **The Criterion for Success:**
  *   **Failure:** The New Negative is obviously wrong (e.g., a completely different category). This shows they are sorting by gestalt, not rule.
  *   **Success:** The New Negative is a "near miss" (e.g., a triangle with a tail). This proves they understand the *boundary conditions* of the concept. They grasp the relation between the examples and the rule, not just the cluster of examples.

  Collect these. If 80% can generate a "near miss" negative, they have grasped the logical structure of the concept.

  ---

  ### V. What to Decline to Settle

  At the end of the seminar, you must explicitly refuse to answer the question: **"Are all human concepts Bongard-style rules?"**

  **Why leave this open?**
  1.  **Philosophical Honesty:** Classical theory (necessary and sufficient conditions) is contested by Prototype Theory and Exemplar Theory. If you assert that concepts *are* rules, you take a side in a 50-year debate in cognitive science that a two-hour seminar cannot resolve.
  2.  **Pedagogical Utility:** If you claim this is how *all* concepts work, students will try to force-fit messy real-world concepts (like "GAME" or "JUSTICE") into rigid Bongard rules and become frustrated.
  3.  **The Lesson's Point:** The goal is to show the *structure of justification* (how we move from cases to rules), not to make an ontological claim about the mind.

  **Closing Statement:**
  "Today we treated concepts as rules because it allowed us to see the logic of induction clearly. Whether the mind actually stores concepts as rules, or as prototypes, or as memories of examples, is the next question. But whatever the mind does, it must solve the Bongard problem: it must decide which similarities matter and which do not. That is the hard part we practiced today."
