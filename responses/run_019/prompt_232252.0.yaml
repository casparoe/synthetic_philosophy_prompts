  1.  **Analyze the Request:**
      *   **Topic:** Moving from examples to concepts (induction/generalization), situated between philosophy and cognitive science.
      *   **Core Tool:** Bongard Problems (6 positive vs. 6 negative examples).
      *   **Audience:** Students new to Bongard problems, likely assuming induction = feature tabulation.
      *   **Duration:** Two hours.
      *   **Constraints:**
          *   Do *not* give the explanation; give a *plan* for the explanation.
          *   Structure 1: Order of ideas & dependency (when to introduce negatives, underdetermination).
          *   Structure 2: One carrying example (invented Bongard problem) with specific design criteria (resist simple conjunctions, negatives must destroy wrong rules).
          *   Structure 3: Misconception map (4 specific misconceptions) with timing and intervention strategies.
          *   Structure 4: Assessment method (grasp relation vs. just sorting).
          *   Structure 5: Open questions (what *not* to settle).

  2.  **Deconstruct the Philosophy/Cognitive Science Intersection:**
      *   *Philosophy:* Problem of induction, underdetermination of theory by data, Wittgenstein's rule-following, Goodman's "grue".
      *   *Cognitive Science:* Concept learning, pattern recognition, hypothesis space, negative evidence.
      *   *Goal:* Show that concept formation isn't just finding commonalities in positives; it requires constraint by negatives and involves a leap beyond the data (underdetermination).

  3.  **Drafting Section 1: Order of Ideas & Dependency:**
      *   *Challenge:* Students think positives define the rule. Negatives are just a quiz.
      *   *Strategy:* Let them fail first.
      *   *Step 1:* Present only positives. Ask for the rule. (They will guess).
      *   *Step 2:* Reveal negatives. Show how the guess fails.
      *   *Step 3:* Realization: Positives alone are insufficient. Negatives are constitutive, not just verificatory.
      *   *Step 4:* Underdetermination. Even with all 12, multiple rules fit. Why *this* rule? (Simplicity, intent, context).
      *   *Dependency:* You can't teach the value of negatives until they feel the pain of a positive-only rule failing. You can't teach underdetermination until they think they have *the* rule.

  4.  **Drafting Section 2: The Carrying Example:**
      *   *Requirement:* Resist simple shape properties (e.g., "all triangles"). Needs to be relational or contextual. Negatives must actively kill specific wrong hypotheses.
      *   *Idea:* "Figures containing a closed loop" vs "Figures without." Too simple.
      *   *Idea:* "Figures where the number of sides equals the number of internal dots." Good, but maybe too arithmetic.
      *   *Idea:* "Figures that can be drawn without lifting the pen" (Eulerian path). Hard to see instantly.
      *   *Selected Idea:* **"Figures where the smallest shape is inside the largest shape."**
      *   *Refinement:* Let's make it more subtle to force relational thinking.
      *   *Revised Idea:* **"The convex hull of the figure contains exactly one disconnected component."** (Too technical).
      *   *Revised Idea 2:* **"Figures containing an odd number of enclosed regions."**
      *   *Let's try a relational one:* **"All figures on the left contain a shape that is strictly inside another shape. All figures on the right have shapes that are either touching or disjoint."**
      *   *Critique:* A bit standard.
      *   *Let's try a 'property of the property' approach:* **"The figure on the left has a symmetry axis that does not intersect any line segment."**
      *   *Let's go with a specific invented one for the prompt:*
      *   *Rule:* **"The figure contains a closed curve that encloses no other vertices."** (i.e., an empty loop).
      *   *Positives:* A triangle with a dot inside (no, dot is a vertex?), a square inside a circle (circle encloses square vertices). Let's simplify.
      *   *Rule:* **"There exists a shape that is completely contained within another shape, with no touching points."** (Containment).
      *   *Negatives:* Shapes touching, shapes overlapping, shapes disjoint.
      *   *Wait, the prompt asks for an invented rule that resists conjunction of visible shape properties.*
      *   *Invented Rule:* **"The total number of line endpoints is even."**
      *   *Positives:* Lines (2), Triangles (0), Squares (0), Two disjoint lines (4).
      *   *Negatives:* T-shape (3), Cross (4? No, intersection matters).
      *   *Let's try:* **"The figure is topologically equivalent to a disk."** (No holes).
      *   *Positives:* Circle, Square, Triangle, Squiggle.
      *   *Negatives:* Donut, Figure-8, Square with a hole.
      *   *Problem:* Too easy.
      *   *Let's try:* **"The figure contains a right angle."**
      *   *Problem:* Too feature-based.
      *   *Let's try:* **"The center of mass lies outside the figure."** (Crescent shapes).
      *   *Okay, let's design a specific one for the plan:*
      *   *Rule:* **"The figure contains a closed loop that does not intersect any other line."**
      *   *Positives:* A circle next to a line. A square with a dot. A triangle inside a circle.
      *   *Negatives:* A line cutting a circle. A square touching a triangle.
      *   *Actually, let's follow the prompt's constraint:* "Negatives must be constructed to destroy the obvious wrong rules."
      *   *Target Rule:* **"The number of distinct regions is prime."** (2, 3, 5...).
      *   *Positives:* 2 regions, 3 regions, 5 regions.
      *   *Negatives:* 1 region, 4 regions, 6 regions.
      *   *Why this works:* Students will look for shapes (circles, lines). They will miss the counting. The negatives (4 regions) look like positives (2 or 3 regions) visually but fail the count.
      *   *Wait, counting is arithmetic, not purely perceptual.*
      *   *Let's go with:* **"The figure has rotational symmetry but no reflectional symmetry."** (Chirality).
      *   *Positives:* Swastika (sensitive?), Pinwheel, S-shape.
      *   *Negatives:* Circle (both), Square (both), Line (reflection only).
      *   *This is good.* It forces relational thinking.
      *   *Let's refine the "Carrying Example" for the plan:*
      *   *Rule:* **"Every line segment terminates at a junction."** (No loose ends).
      *   *Positives:* Triangles, Squares, Closed loops, T-junctions where all ends meet.
      *   *Negatives:* A line with a free end, A 'V' shape, A spiral that doesn't close.
      *   *Trap:* Students will say "Closed shapes."
      *   *Negative Counter:* A closed square with a line sticking out (fails rule, looks closed). A T-shape (passes rule, looks open).
      *   *Decision:* I will design the "Loose End" problem. It's visual but structural.

  5.  **Drafting Section 3: Misconception Map:**
      *   *Misconception 1: Concept = Common Features.*
          *   *Intervention:* Early phase. Show positives that share *no* obvious visual features (e.g., a circle, a number 5, a map of France) but share a structural rule.
      *   *Misconception 2: One more positive settles rival rules.*
          *   *Intervention:* Mid-phase. Show two rules that fit all 12 boxes. Ask if a 13th positive helps. (No, because the new box could fit both rules).
      *   *Misconception 3: Simplicity decides the rule.*
          *   *Intervention:* Late phase. Show a "simple" rule vs. a "complex" rule that both fit. Discuss why we prefer one (bias, not logic).
      *   *Misconception 4: Negatives are just a check.*
          *   *Intervention:* Phase 1 transition. Show that without negatives, the hypothesis space is infinite. Negatives carve the space, they don't just test the carve.

  6.  **Drafting Section 4: Assessment:**
      *   *Task:* Don't ask "What is the rule?" Ask "Generate a new positive and a new negative."
      *   *Why:* If they can generate a negative that *looks* like a positive but isn't, they understand the boundary conditions (the rule), not just the cluster.

  7.  **Drafting Section 5: Open Questions:**
      *   *What to leave open:* Are *all* concepts like this? (Prototype theory vs. Classical). Is the rule in the head or the world?
      *   *Why:* Prevents premature closure. Keeps the philosophy alive beyond the puzzle.

  8.  **Review and Refine:**
      *   *Check Constraints:* Did I give the explanation? No. Is it a plan? Yes. Is the order logical? Yes. Is the example specific? Yes.
      *   *Tone:* Academic, instructional, structured.
      *   *Timing:* 2 hours. Need to allocate time blocks.
      *   *Refining the Example:* The "Loose End" example is good. Let's make sure the negatives are specifically designed to kill the "Closed Shape" hypothesis.
      *   *Positives:* Triangle, Square, Circle, Figure-8 (all lines meet), T-shape (all lines meet).
