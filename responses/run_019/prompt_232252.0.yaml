  12. **Final check on Assessment:** "Generate a negative that looks like a positive." This is the "Adversarial Example" approach. It proves they know the boundary, not just the cluster.

  13. **Final check on Open Questions:** Don't solve the "Nature of Concepts" debate. Use the Bongard problem as a model, not the whole truth.

