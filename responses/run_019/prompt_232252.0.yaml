      *   *Better Negative:* A square with a line segment attached at one end (looks like a closed shape, fails rule). A 'V' shape (looks open, fails rule).
      *   *Wait, I need to ensure the negatives destroy obvious wrong rules.*
      *   *Wrong Rule:* "It's a closed polygon."
      *   *Negative to kill it:* A closed circle with a line sticking out. (Looks closed, is Negative).
      *   *Wrong Rule:* "It has no curves."
      *   *Negative to kill it:* A circle (Positive).
      *   *Okay, I will flesh this out in the final output.*

  9.  **Final Polish:** Check the flow.
      *   Intro (15 min)
      *   Activity 1: Positives only (15 min) -> Misconception 1.
      *   Activity 2: Reveal Negatives (30 min) -> Misconception 4.
      *   Deep Dive: Underdetermination (30 min) -> Misconception 2 & 3.
      *   Assessment (20 min).
      *   Conclusion/Open Questions (10 min).
      *   *Wait, 2 hours = 120 mins.* The breakdown looks reasonable.

  10. **Self-Correction on "Underdetermination":** The prompt says underdetermination should be raised *after* they propose a rule and have it wrecked. So, Step 1 (Positives) -> Guess Rule. Step 2 (Negatives) -> Rule Wrecked. Step 3 (New Rule) -> Fits all 12. Step 4 (Underdetermination) -> Show *another* rule fits all 12. This is crucial. I need to make sure the plan explicitly schedules this "Second Rule" reveal.

