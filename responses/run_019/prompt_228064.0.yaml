prompt: |-
  So my older sister is home from college for break and she's taking a philosophy of mind class, and at dinner she tried to explain Daniel Dennett's "multiple drafts model" to us. What she said, roughly, was this: "Dennett showed there's no single place in the brain where everything comes together for a little audience to watch — he calls that bad idea the Cartesian theater. And since there's no theater and no audience, there's no one moment when something officially becomes conscious, so consciousness is basically an illusion. Your brain is just running a bunch of parallel drafts of what's going on, and which one you 'actually experienced' is indeterminate, there isn't really a fact of the matter. So the feeling of being one unified self watching the world is just a fiction the brain tells itself." She also brought up some experiment where you see two colored dots flashed in different spots and you seem to see the dot move and change color halfway, before the second dot could even have been processed, and she said this proves there's no fact about what you experienced when.

  My dad immediately said "well I'm definately conscious, so that can't be right," and my sister said that's exactly the intuition Dennett is trying to get rid of. I'm stuck in the middle. Some of it sounds like it has to be a distortion — surely Dennett doesn't think nobody ever experiences anything, that would be insane, and I've seen people online argue about whether he's really an "illusionist" or whether that's a misreading. But I can't tell which parts are the distortion, because the "no single place where it all comes together" bit and the "no fact of the matter about what you experienced" bit might genuinely be his view even if the "consciousness is an illusion" conclusion isn't.

  Can you go through her summary claim by claim and tell me what a careful reader of Dennett would accept, what's a common oversimplification, and what's an actual misrepresentation — including whether the dots experiment really shows what she says it shows? And don't just lay out the options and leave me to pick, please actually commit: is the overall summary fair or not, and if not, where exactly does it go wrong? Also settle the dinner argument — if you correct the summary to what Dennett really thinks, does my dad's "I'm obviously conscious" objection survive, or does Dennett have a real answer to it on the fair reading?
