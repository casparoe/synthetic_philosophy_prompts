answer: |-
  Thank you for sending this over. It is always tricky marking work when the students are engaging with dense secondary literature, but I have reviewed the essay against the primary texts and standard interpretations of both philosophers. I would award this essay a mark of 9 out of 20. While the writing is clear and the student demonstrates a reasonable grasp of Appiah, there is a fundamental and catastrophic misrepresentation of Williams that undermines the entire comparison. I have outlined the specific strengths and weaknesses below so you can pass this feedback on directly.

  The student begins on solid ground regarding Appiah. They correctly identify the core thesis of The Honor Code, which is that moral arguments against practices like slavery and duelling existed long before the practices themselves ceased. The claim that arguments were inert until something else moved them is accurate to Appiah's view. They also correctly identify honour as the mechanism Appiah proposes for this change. However, even here there are some simplifications that should be noted. The student claims duelling ended because it was made illegal and gentlemen could not maintain honour by breaking the law. Appiah's argument is more nuanced than this; he suggests that the law became enforceable only because the honour code shifted first. Gentlemen stopped duelling not simply because it was illegal, but because the social meaning of duelling changed such that participating in it became a source of shame rather than honour. Similarly, the explanation of slavery abolition via the dignity of wage labour is a slight conflation. Appiah focuses more on the contagion of shame within the metropolitan centre, where slave-owning came to be seen as dishonourable for the British nation and individual, rather than primarily a conflict with the dignity of labourers. These are minor points of precision, but they matter for a high-grade answer.

  The primary reason for the low mark, however, lies in the treatment of Bernard Williams. The student attributes to Williams the view that slavery was abolished because better moral arguments became available and that people previously lacked the conceptual resources to see it was wrong. This is essentially the opposite of Williams' actual position. Williams is well known for his skepticism about moral progress conceived as the discovery of moral truth or the refinement of moral arguments. In works like Ethics and the Limits of Philosophy and Shame and Necessity, Williams argues against the idea that ethical change is driven by the accumulation of better rational arguments. He would not say the practice collapsed under the weight of arguments; rather, he would suggest that the social and psychological conditions that made the practice intelligible or sustainable eroded. Attributing a rationalist progress narrative to Williams is a severe error because it ignores his meta-ethical skepticism. The student has likely conflated Williams with a standard Enlightenment rationalist or perhaps misunderstood his critique of such views as an endorsement of them.

  This misunderstanding of Williams leads directly to the flawed conclusion. The student concludes that moral progress is essentially a matter of having better arguments plus social factors. Since Williams explicitly rejects the notion that moral progress is a matter of having better arguments or accessing moral truth, this conclusion falsifies his view entirely. A correct answer would have highlighted that while Appiah sees a mechanism for progress through honour codes, Williams is far more agnostic or skeptical about whether we can call these changes progress in any objective sense. For Williams, the change is real, but it is not necessarily a movement toward truth via argument. Because half of the essay question concerns Williams, and the student's explanation of his view is fundamentally incorrect, the essay cannot pass despite the competent handling of Appiah.

  To improve, the student needs to revisit Williams' meta-ethics, specifically his views on moral knowledge and skepticism. They should focus on how Williams distinguishes between ethical change and scientific progress. For Appiah, they should refine their understanding of the causal relationship between law, honour, and social practice, ensuring they do not present legality as the primary driver where Appiah sees it as a secondary effect of shifting honour codes. I hope this detailed breakdown helps you provide them with constructive guidance. It is a promising start on Appiah, but the Williams section needs a complete rewrite based on a closer reading of the primary material.
