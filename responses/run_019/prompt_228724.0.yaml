answer: |-
  **MEMORANDUM**

  **TO:** Small-Grants Committee, Center for Experimental Philosophy
  **FROM:** [Your Name/Committee Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Proposal for Field Test of Superrational Reasoning (Lottery Design)

  **DECISION:** **FUND WITH CONDITIONS**

  The committee is deadlocked on the proposal to test superrational reasoning via a variable-prize lottery. While the objections regarding falsifiability, ethical risk, and experimental design are substantial, they are remediable. The core philosophical question—whether common knowledge of rationality induces correlated action without communication—warrants empirical investigation. However, the current protocol conflates *symmetry* with *secrecy* and risks rendering the data uninterpretable.

  We will release the $12,000 grant contingent on four specific design modifications detailed below. These changes address the financial solvency risk, the falsifiability critique, and the transparency paradox.

  ### 1. The Scientific Merit: Engaging the Symmetry Argument

  The strongest objection raised was that the experiment is unfalsifiable: low entry could signal superrational restraint, simple lack of traffic, or standard expected-value calculations; high entry could signal standard rationality or a "failure" of the participant pool to be truly like-minded.

  This objection is partially correct but overlooks the specific mathematical distinction between **Causal Decision Theory (CDT)** and **Superrationality** in this specific payoff structure.

  *   **The Nash Equilibrium (Standard Rationality):** A standard rational agent enters if their Expected Value (EV) exceeds the $2 cost. With a prize of $50,000/N and a win probability of 1/N, the EV is $50,000/N². A CDT agent enters as long as $50,000/N² > $2. This equilibrium stabilizes at **N ≈ 158**. At this point, the Center breaks even, and the player's expected return is zero.
  *   **The Superrational Outcome:** A superrational agent reasons that their decision is logically correlated with others. They ask, "What if everyone reasons as I do?" If everyone enters, N is massive, and the prize is negligible. To maximize the *group's* utility (Total Prize - Total Cost = $50,000 - $2N), the group should minimize N. The optimal superrational strategy is a mixed strategy where the *expected* number of entrants is far below 158 (ideally N=1, though practically a low number to ensure the game occurs).

  **Therefore, the result is discriminable.** If the participant pool is truly reasoning superrationally, **N should be significantly lower than 158.** If they are reasoning standardly, **N should cluster around 158.** If N is high (>500), rationality has collapsed into impulse.

  **Condition 1 (Pre-registration & Survey):** To prevent post-hoc rationalization (e.g., claiming high N meant the pool wasn't "like-minded" enough), the student must pre-register the analysis plan. Crucially, all entrants must complete a mandatory post-experiment survey asking *why* they entered or abstained. We need to distinguish between "I didn't enter because the odds were bad" (CDT) and "I didn't enter because I hoped others would do the same" (Superrationality). Without this self-report data, the behavioral data alone is ambiguous.

  ### 2. The Transparency Paradox

  The committee is split on whether to display the running entry total. Half argue it is an ethical requirement for informed consent; the other half argue it destroys the simultaneous nature of the game.

  **Decision: The counter must remain hidden until the close.**

  Displaying the running total converts this from a **simultaneous symmetric game** (the Platonia Dilemma) into a **sequential dynamic game**. If participants see N=50, they may enter thinking the prize is still high. If they see N=5,000, they abstain. This creates a feedback loop that artificially stabilizes N around the break-even point (158) regardless of the participants' underlying reasoning architecture. It would measure *herding behavior*, not *superrationality*.

  However, hiding the counter raises ethical concerns regarding odds disclosure.

  **Condition 2 (Informed Consent):** The landing page must explicitly state: *"To preserve the experimental integrity of the decision problem, the entry count will not be displayed in real-time. You are making a decision under uncertainty regarding the total number of participants."* This satisfies the duty of disclosure without compromising the symmetry condition. Participants are not being deceived; they are being informed of the information asymmetry inherent to the design.

  ### 3. Financial Risk and Ethical Duty

  Several members noted that the Center profits only if participants reason "badly" (i.e., enter when N is already too high to make the EV positive). This creates a perverse incentive where the Center's surplus is derived from participant error. Furthermore, there is a discrepancy in the budget: the grant is $12,000, but the liability cap is $50,000. If N=1 (the ultimate superrational success), the Center owes $50,000 against $2 revenue. The grant covers only a fraction of this shortfall.

  **Condition 3 (Solvency & Surplus):**
  1.  **Escrow:** The Center must demonstrate that the full $50,000 prize pool is escrowed or insured before launch. We cannot advertise a $50,000 prize if the grant only covers $12,000 of the risk.
  2.  **Surplus Cap:** If N > 1,000, the Center's profit should be capped. Any revenue exceeding the administrative costs and a reasonable risk premium should be donated to a charity chosen by the participants or returned as a bonus prize pool. This mitigates the ethical concern that we are running a "sting operation" on rational agents. We are researchers, not casino operators.

  ### 4. Steelmanning the Opposition

  Those voting against funding are correct on one vital point: **External Validity.** Even with these fixes, the participant pool (self-selected visitors to rationality forums) is not a representative sample of "rational agents." It is a sample of *people who identify as rational*.

  If N comes in at 158, it may not prove CDT is correct; it may prove that this specific subculture converges on Nash equilibria. If N comes in at 20, it may not prove superrationality; it may prove that the ad didn't reach enough people. The "Just-So Story" risk is real. A superrationalist can always retreat to the claim that "the people who entered weren't *true* superrationalists."

  This is why **Condition 1 (The Survey)** is non-negotiable. We are not just counting heads; we are auditing the reasoning process. If the behavior is superrational but the self-reported reasoning is standard (or vice versa), we have learned something profound about the gap between philosophical theory and cognitive practice.

  ### Summary of Conditions for Release of Funds

  1.  **No Real-Time Counter:** The entry total must be hidden until the lottery closes to preserve simultaneity. This must be explicitly disclosed in the informed consent text.
  2.  **Mandatory Reasoning Survey:** All entrants must answer questions regarding their decision calculus to allow discrimination between CDT and Superrational motivations.
  3.  **Financial Solvency:** Proof of full prize pool escrow ($50k) must be provided. Surplus profits above a fixed threshold must be diverted to charity or participant rebates.
  4.  **Pre-Registration:** The analysis plan, including the specific N-thresholds for "Superrational" vs. "Standard" outcomes, must be publicly registered before the ad campaign begins.

  This project sits at the boundary of game theory, psychology, and philosophy. It is risky, but it is the kind of risk a Center for *Experimental* Philosophy should take, provided the experiment is rigorous enough to survive the result, whatever it may be.

  **Approved.**
