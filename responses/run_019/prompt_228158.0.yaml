answer: |-
  ### The name, if there is one

  The phenomenon you are describing is a direct consequence of **Löb's Theorem** (1955), and in the context of artificial intelligence and self-modifying agents, it is commonly referred to as the **Löb Obstacle** or the problem of **Löbian self-trust**. While Gödel showed that a consistent system cannot prove its own consistency, Löb proved something stronger: if a system proves that "if I prove $\phi$, then $\phi$ is true," it immediately proves $\phi$ itself. Consequently, adding a blanket axiom schema asserting your own soundness ($\text{Prov}(\phi) \to \phi$) for all statements forces the system to prove every statement, rendering it trivial and inconsistent.

  ### Why this is not just Gödel

  Your friend is describing Gödel's Second Incompleteness Theorem, which states that a consistent formal system cannot prove its own consistency ($\text{Con}(T)$). This is indeed a limitation, implying the robot cannot formally validate its own reliability from the inside using its existing rules. However, your intuition about "detonation" is technically more precise regarding the *addition* of the rule. Gödel tells us the system cannot *derive* self-trust; Löb tells us that if you simply *install* self-trust as an axiom schema (asserting $\text{Prov}(\phi) \to \phi$ for all $\phi$ regarding the new system), the system collapses into triviality.

  The distinction lies between inability and inconsistency. Gödel says the robot is too humble to certify its own sanity without stepping outside itself. Löb says that if you force the robot to claim it is sane as a fundamental law, it becomes insane. Specifically, Löb's Theorem proves that for any sentence $\phi$, if the system proves "If I prove $\phi$, then $\phi$," the system proves $\phi$. If you apply this to a falsehood (like $0=1$), the system proves the falsehood, exploding the logic. Thus, the failure isn't just a gap in capability; it is a logical hazard where naive self-trust acts as a logical virus that infects the entire axiom set.

  ### Does it touch ordinary human self-trust?

  This theorem applies strictly to formal systems with specific properties (like Peano Arithmetic), so it does not govern human cognition directly. Humans are not consistent, fixed-axiom proof checkers; we are bounded, heuristic reasoners who frequently hold contradictory beliefs without exploding. We do not possess a precise "proof checker" that operates on a fixed set of axioms, nor do we instantly deduce all consequences of our beliefs, so we do not suffer the immediate logical explosion that a formal machine would.

  However, the pattern serves as a powerful metaphor for dogmatic overconfidence. If a person adopts the rigid policy "Everything I believe is true" without external calibration, they risk insulating themselves from correction, effectively becoming "trivial" in their reasoning by accepting any rationalization that supports their prior beliefs. While we don't suffer logical explosion, we suffer epistemic closure. The theorem warns against hard-coding unconditional self-reliance in any architecture, biological or silicon, that relies on deductive closure for action.

  ### Known escape routes and their costs

  *   **Hierarchical Trust:** The system trusts only a strictly weaker subsystem (e.g., $PA$ trusts $PA-1$). *Cost:* This creates an infinite regress where no version can fully trust its own full power, limiting self-modification.
  *   **Logical Induction:** Replace binary proof with probabilistic confidence that converges over time. *Cost:* The agent sacrifices mathematical certainty and deductive closure, accepting that it may hold inconsistent beliefs temporarily.
  *   **Restricted Reflection Principles:** Assert self-trust only for specific classes of statements, such as $\Pi_1$ sentences. *Cost:* The agent cannot validate its own reasoning for complex existential claims, restricting its planning capabilities.
  *   **Tiling Agents:** Construct agents that verify specific safety properties of their successors rather than general soundness. *Cost:* This requires fragile, highly specialized formal setups that are difficult to generalize to arbitrary goals.
