answer: |-
  ### Referee's Ruling on the Dueling Debate

  Here is the evaluation of the four moves, the surviving insights, and the synthesis both students are missing.

  #### Evaluation of Moves

  **(1) Sam: Mostly Right.**
  This is empirically strong regarding dueling; it correctly identifies the "lag" problem where moral arguments exist long before behavioral change, highlighting that social sanctions matter more than abstract logic.

  **(2) Maya: Partially Right.**
  She correctly notes that redefining honor requires discursive labor, but she risks tautology by stretching the definition of "argument" to include any cultural signal, which dilutes its explanatory power.

  **(3) Sam: Mostly Right.**
  This is his strongest sociological point: it explains *why* the same argument failed in 1720 but worked in 1840 by locating causality in the audience's power to confer status rather than the logic itself.

  **(4) Maya: Mostly Right.**
  This is a successful generalization check; the abolitionist case demonstrates that sustained moral argument can sometimes drive norm change even when honor and economic interests are aligned against it.

  ***

  #### Verdict on Surviving Points

  **Sam's Surviving Insight:**
  Norm change requires a shift in the **cost of compliance**. Moral arguments alone are insufficient if the social penalty for violating the old norm (e.g., being branded a coward) remains high; the "audience" with the power to punish or reward must change before the practice collapses.

  **Maya's Surviving Insight:**
  Norm change requires **discursive reconfiguration**. Even if status shifts are the mechanism, someone must do the work of articulating *why* the status has shifted (e.g., satire, redefining "gentlemanly"), meaning argument is a necessary condition, even if not a sufficient one.

  ***

  #### What Both Are Missing: The Feedback Loop

  Sam and Maya are talking past each other because they treat **arguments** and **honor/interests** as competitors in a zero-sum causal race (i.e., *either* reasons changed minds *or* incentives changed behavior). They are missing the **recursive interaction** between the two.

  1.  **Arguments Constitute Honor:** Honor is not a static barrier (as Sam implies) nor just a rhetorical vessel (as Maya implies); it is a shared expectation that is *built* by arguments. The satire Maya mentions didn't just reflect a status shift; it actively *created* the new status hierarchy by making the old one look ridiculous.
  2.  **Threshold Effects:** They are missing the **tipping point** dynamic. Arguments lower the "threshold" for individuals to defect from a norm, but they only become effective once enough people have defected to lower the social cost (Sam's point). Argument creates the possibility of the shift; status shifts make the argument safe to adopt.

  **Referee's Summary:** Sam is right about the *mechanism* of collapse (incentives), but Maya is right about the *precondition* for that mechanism (persuasion). Norm change happens when arguments successfully re-engineer the honor code enough to alter the social costs of compliance.
