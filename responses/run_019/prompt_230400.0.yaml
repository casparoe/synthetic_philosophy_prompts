      *   *Option A: Ontological Eternalism (The Block).* "Real" means tenselessly existing in the manifold.
      *   *Option B: Presentism (The Flow).* "Real" means existing *now*, and only now.
      *   *Option C: Relativized Presentism (Fragmentalism/Point-Presentism).* "Real" is indexical to a worldline or frame.
