answer: |-
  Elias, a 30-year-old construction worker, is convicted of aggravated assault following a drunken brawl that left a victim with a broken jaw. In Jurisdiction A, an American-style retributive system, statutory guidelines assign a determinate sentence of thirty-six months based strictly on the offense severity and criminal history, guaranteeing release upon completion regardless of institutional behavior. In Jurisdiction B, a Halden-style rehabilitative system, sentencing is indeterminate, with release contingent upon a board's assessment of reduced recidivism risk and demonstrated psychological readiness. Elias is stoic and resistant to therapeutic introspection, viewing mandatory group therapy as intrusive rather than helpful, and thus fails to demonstrate the "insight" required by clinicians. Consequently, Jurisdiction A releases Elias exactly at month thirty-six, while Jurisdiction B retains him for fifty months, not as punishment, but because his unresolved risk profile legally prohibits reintegration until he successfully performs the emotional vulnerability demanded by the treatment protocol.

  **Retributive System:** The sentence is fixed at thirty-six months based on proportional justice; the state's claim on Elias's liberty expires automatically when the time is served. His internal state is irrelevant; the debt is paid via time, not transformation.

  **Rehabilitative System:** The sentence is open-ended based on risk mitigation. Elias is held longer because he has not satisfied the criteria for "readiness." The staff are not vindictive; they are professionally obligated to prevent release until risk is lowered, which they equate with therapeutic compliance.

  **Structural Feature:** The mechanism driving the extra time is **indeterminate sentencing tied to therapeutic compliance**. Liberty is conditional on the inmate's ability to demonstrate internal change according to institutional metrics.

  **Removal Effect:** If you remove the conditionality (making the sentence determinate), Elias is released at thirty-six months regardless of his psychological state. If you remove the rehabilitative logic entirely, the system reverts to pure incapacitation or retribution, eliminating the requirement for "insight" but also the promise of tailored reintegration.

  **Defender's Attack:** A defender would argue that releasing an unrepentant, high-risk individual is not mercy but negligence. The extra fourteen months are an investment in Elias's future safety and autonomy; releasing him before he is ready sets him up to re-offend and return to prison, which is ultimately harsher than a longer, supportive stay.

  **Evaluation:** I do not fully buy the defense. While preventing recidivism is humane, conditioning liberty on the performance of specific emotional states creates a "tyranny of therapy." It penalizes personality types (like stoicism) that do not align with therapeutic norms, turning the prison into a coercive laboratory where freedom is purchased with sincerity rather than time. This individualizes punishment in a way that lacks the transparency of fixed sentencing, potentially making the humane system more intrusive than the punitive one.
