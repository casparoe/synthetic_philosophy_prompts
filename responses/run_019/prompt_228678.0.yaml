answer: |-
  1. Preliminaries and purpose
  The theory sought is fundamentally normative, constituting an account of practical reason rather than a predictive model of behavior. Its purpose is to guide deliberation for temporally extended agents, evaluating not merely outcomes but the rationality of the choices producing them. Consequently, desiderata must balance instrumental success with the internal coherence of agency across time. A theory that recommends actions leading to ruin is inadequate; likewise, a theory that cannot guide action at the moment of choice is merely evolutionary biology, not rationality. We require an account that respects the agent's unity over time without dissolving the distinctiveness of temporal perspectives. It must explain how reason binds the future self without resorting to external pre-commitment devices. The specification must therefore bridge the gap between ex-ante planning and ex-post execution, ensuring that rationality remains action-guiding throughout the temporal sequence.

  2. The desiderata
  1. **Instrumental Adequacy in Prediction-Dependent Cases:** In Hitchhiker scenarios, where outcomes depend on predicted dispositions, the theory must recommend the strategy yielding survival. A theory condemning the agent to death because it forbids the necessary disposition is instrumentally self-defeating. Rationality should not be suicidal; if a principle systematically leads to worse outcomes than an alternative principle in structurally identical cases, it fails a basic pragmatic test.

  2. **Action-Guidance at the Terminal Node:** The theory must provide a rationale for paying the driver *at the moment of payment*. It cannot merely say "you should have been disposed to pay." If rationality forbids the act when the moment arrives, the theory fails to guide actual choice, reducing rationality to pre-commitment mechanics. The agent at the city gate is still a rational agent; the theory must speak to him, not just to his past self.

  3. **Intention-Action Consistency (The Toxin Constraint):** The theory must distinguish between intending to act and acting. In Kavka's Toxin Puzzle, an agent cannot intend to drink a toxin they know they won't drink. A viable theory must explain how one can rationally acquire a disposition to perform a costly act without violating the constraint that intention requires belief in performance. It must navigate the gap between cultivating a disposition and executing the act.

  4. **Non-Self-Effacement:** A true theory of rationality should not recommend that agents believe false theories or ignore its own directives. If rationality requires believing oneself irrational to succeed (as Parfit suggests), the theory risks instability. The ideal theory is transparent: knowing it should not undermine its success. A theory that tells agents "do not follow me" forfeits its claim to be a theory of *rational* choice.

  5. **Dynamic Consistency without Strict Separability:** The theory must ensure plans are executable without regret. However, it must decide whether Strict Separability (choices depend only on the current subtree) is sacrosanct. If Hitchhiker requires violating Separability to ensure Instrumental Adequacy, the theory must explicitly justify this violation rather than hiding it. Dynamic consistency is required, but the mechanism (resoluteness vs. sophistication) must be specified.

  6. **Handling Threats and Promises:** The theory must account for the rationality of deterrence and promising. Where carrying out a threat is costly ex-post but necessary ex-ante for credibility, the theory must validate the execution. Otherwise, communication and cooperation collapse. The theory must explain how empty threats become credible without deception.

  7. **Respect for Agency:** The theory must treat the agent as a single entity over time, not a sequence of distinct selves. Solutions that rely on "tying hands" mechanically avoid the philosophical problem of how reason itself can bind future choice. The binding force must be internal to rationality, not external constraint.

  3. Negotiable versus non-negotiable
  Non-negotiable: Instrumental Adequacy (don't die in the desert) and Action-Guidance (must speak to the now). A theory failing these is practically useless; it either kills the agent or falls silent when choice is required. Negotiable: Strict Separability and Transparency. CDT defenders prioritize Separability; Parfitians accept Self-Effacement. Whether rationality must be transparent is a metaphysical wager, not a functional requirement. Similarly, whether plans bind future selves (Resolute Choice) is a structural choice, not a logical necessity. These define the camps, not the adequacy of the enterprise.

  4. Joint satisfiability
  Instrumental Adequacy and Strict Separability are jointly unsatisfiable in Hitchhiker cases. Separability dictates that at the moment of payment, the agent considers only the current subtree: paying costs utility, riding is already secured. Thus, Separability mandates non-payment. However, the driver predicts this via Separability-based reasoning and refuses the ride. To secure the ride (Instrumental Adequacy), the agent must choose against Separability's directive at the terminal node. Therefore, any theory satisfying Separability fails Instrumental Adequacy in prediction-dependent contexts. One must sacrifice the structural axiom to save the agent's life, or sacrifice the agent to save the axiom. This is not a mere tension but a logical contradiction within the domain of prediction-dependent choice.

  5. Brief scorecard
  **Causal Decision Theory (CDT):** Satisfies Separability and Action-Guidance but fails Instrumental Adequacy. It correctly identifies paying as irrational at the moment of choice, ensuring the agent dies in the desert.
  **Evidential Decision Theory (EDT):** Secures Instrumental Adequacy in Hitchhiker (paying signals trustworthiness) but fails Toxin constraints. It cannot distinguish between causing an outcome and evidencing it, struggling with intention formation.
  **Resolute Choice (McClennen):** Achieves Instrumental Adequacy and Dynamic Consistency by rejecting Separability. It allows agents to stick to plans, but struggles to explain *why* resoluteness is rational at the moment of deviation without circularity.
  **Disposition-Based (Parfit):** Prioritizes Instrumental Adequacy via indirect strategies. It risks Self-Effacement, suggesting rationality requires cultivating dispositions to act against direct rational assessment.
  **Sophisticated Choice:** Maintains Separability by anticipating future irrationality. It fails Instrumental Adequacy, as the agent predicts their own future defection and is thus never picked up.
