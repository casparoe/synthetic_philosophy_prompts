answer: |-
  The distinction you have identified is a central topic in contemporary meta-ethics and epistemology. It is widely recognized, rigorously debated, and has established technical terminology.

  ### The Established Label

  The class of considerations you are describing is most precisely technically named **State-Given Reasons**.

  These are contrasted with **Object-Given Reasons**.

  The broader philosophical puzzle generated by this distinction is known as **The Wrong Kind of Reasons (WKR) Problem**. In the context of this problem, State-Given Reasons are frequently referred to colloquially as **Reasons of the Wrong Kind**, while Object-Given Reasons are **Reasons of the Right Kind**.

  While "Reasons of the Wrong Kind" is the more iconic label for the *problem*, **State-Given Reasons** is the more precise label for the *considerations themselves*, as it describes their structural source rather than judging their normative status (since some philosophers argue they are not the "wrong" kind, just a different kind). In epistemology specifically, these are often called **Pragmatic Reasons** (contrasted with **Evidential Reasons**).

  ### The Carving: Where is the Boundary?

  The boundary between these two classes of considerations is drawn based on the **source** of the reason and what it justifies.

  1.  **Object-Given Reasons (The "Fittingness" Boundary):**
      *   **Source:** These reasons cite properties of the *object* of the attitude.
      *   **Function:** They bear on whether the attitude is **fitting**, **correct**, or **accurate**.
      *   **Test:** If the object changes but the state remains beneficial, does the reason persist? If no, it is object-given.
      *   *Example:* The spider is venomous. This is a property of the spider. It makes fear *fitting*. If the spider were replaced by a harmless rock, the reason vanishes.

  2.  **State-Given Reasons (The "Utility" Boundary):**
      *   **Source:** These reasons cite properties of *having the attitude* (the state itself) or the consequences of being in that state.
      *   **Function:** They bear on whether it is **good**, **beneficial**, or **sensible** to have the attitude, regardless of its fit.
      *   **Test:** If the object changes but the state remains beneficial, does the reason persist? If yes, it is state-given.
      *   *Example:* You get money for fearing the spider. This is a property of the *state of fearing*. If the spider were replaced by a rock, and you still got money for fearing the rock, the reason persists.

  ### Is the Boundary the Same Across Attitudes?

  The structural distinction holds across attitudes (admiration, fear, desire), but the **normative force** of the boundary varies, particularly for belief.

  *   **Emotions/Desires:** It is generally accepted that State-Given Reasons can justify *bringing it about* that you have the emotion (e.g., training yourself to fear the spider to get the money), but they do not make the emotion *fitting*. You can have a reason to induce the state without the state being correct.
  *   **Belief:** This is the contentious frontier. Belief is often argued to be **constitutively aimed at truth**.
      *   **Evidentialism:** Holds that only Object-Given Reasons (evidence) can justify belief *qua belief*. State-Given Reasons (comfort, utility) can justify *acting as if* you believe or *causing* yourself to believe, but cannot make the belief itself rational. To believe *because* it is useful is arguably to corrupt the attitude of belief.
      *   **Pragmatism:** Argues that State-Given Reasons (Pragmatic Reasons) can sometimes justify belief directly (e.g., Pascal's Wager).
      *   **The Consensus:** The majority view in analytic epistemology aligns with your intuition: pragmatic considerations count in favor of the *usefulness* of the belief, but not its *correctness*.

  ### Boundary Cases and Overlaps

  There are plausible arguments and cases that sit on the boundary, suggesting the carving is not always perfectly clean:

  1.  **Self-Fulfilling Beliefs:** If believing I will succeed causes me to succeed, the belief makes itself true. Here, a State-Given reason (success) bleeds into an Object-Given reason (truth). This challenges the strict separation.
  2.  **Moral Emotions:** Some argue there is a moral obligation to feel guilt or gratitude. Is this a State-Given reason (it's good to feel it) or an Object-Given reason (the situation warrants it)? Some philosophers argue moral considerations can make an emotion fitting, blurring the line between "good to have" and "correct response."
  3.  **Hope:** Hope is often analyzed as an attitude that is partially regulated by pragmatic considerations. It may be "correct" to hope in situations where evidence is sparse but stakes are high, suggesting a hybrid normative standard.
  4.  **Reductionist Challenges:** Some consequentialist philosophers argue that *all* reasons are ultimately State-Given (based on the good consequences of holding the attitude). They deny the existence of Object-Given reasons as a fundamental category, arguing "fittingness" is just a label for a specific type of long-term utility.

  ### Neighboring Concepts

  *   **Instrumental Reasons:** Usually apply to *actions*, not attitudes. An instrumental reason explains why an action is a means to an end. State-Given reasons are similar but apply to the *state of mind* itself.
  *   **Prudential Reasons:** A subset of State-Given Reasons. All prudential reasons for attitudes are State-Given (benefit to the self), but not all State-Given reasons are prudential (e.g., a threat to torture *others* unless you admire a being creates a State-Given reason that is moral, not prudential).
  *   **Evidential Reasons:** The epistemological counterpart to Object-Given Reasons. Specifically concerns truth-conducive considerations for belief.

  ### Summary

  You have correctly identified the distinction between reasons that make an attitude **fitting** (Object-Given) and reasons that make an attitude **advantageous** (State-Given). The established technical term for the latter class, which captures the structural source of the consideration across emotions and beliefs, is **State-Given Reasons**.

  \answer{State-Given Reasons}
