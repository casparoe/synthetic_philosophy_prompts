  1. Establish sincerity by asking if the objection causes genuine moral distress regardless of consequences. Pass if consistent history or profound conflict is evidenced by demeanor and history, not fluency; refer for more documentation if uncertainty remains.
  2. Distinguish opposition to war from opposition to all violence by asking if institutional warfare is rejected even if personal self-defense is accepted. Pass if the applicant opposes war despite accepting police protection or family defense; deny if they accept war but oppose only personal violence.
  3. Test generality by asking if the opposition applies to war as an institution rather than merely the current conflict. Pass if the applicant affirms the principle would oppose a different war fought by our country for different reasons; deny if opposition relies solely on the specific injustice of the current campaign.
  4. Exclude taxes, police protection, and hypothetical family defense from disqualification explicitly. Pass if the panel acknowledges these do not negate conscientious objection to war; restart deliberation if any member raises these factors as disqualifying.
  5. Evaluate if alternative service constitutes participation in war by releasing a conscript. Pass if the panel agrees alternative service functionally enables combat participation, granting full exemption; fail if the link is deemed too indirect, requiring civilian service.
  6. Compare written statements against hearing testimony for material contradictions. Pass if minor discrepancies are attributed to nervousness; deny if contradictions suggest fabrication.
  7. Judgment cannot be eliminated in weighing the depth of moral distress against inarticulateness, and in determining whether civilian service complicity is substantive or theoretical.
  8. Grant the fluent applicant exemption because accepting self-defense does not invalidate opposition to war under Step 2, and his generality test passed.
  9. Deny the devout activist because her willingness to support a defensive war fails the Step 3 generality test required by the charter's "war in any form" clause.
  10. Refer the quiet applicant because his halting speech triggers Step 1 uncertainty, though his complicity claim under Step 5 warrants deeper review than the hearing allowed; this is the outcome you will like least.
