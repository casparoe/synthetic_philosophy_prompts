answer: |-
  You have hit on one of the most famous and tricky problems in moral philosophy. Your intuition that "only perfect people could blame anyone" is actually a standard objection philosophers raise against strict views on hypocrisy. However, your teacher was trying to point out a specific distinction that you are blending together.

  Here is the breakdown of what is happening with your dad example, why the "perfect people" worry arises, and exactly what you are conflating.

  ### 1. The Distinction: Truth vs. Standing
  The core issue is the difference between the **content** of the blame and the **authority** of the blamer.

  *   **Content (Is the act wrong?):** When your dad says, "Lying is wrong," he is making a claim about reality. Whether *he* lies or not, the statement "lying is wrong" can still be true. Your lying is still morally problematic regardless of his behavior.
  *   **Standing (Do you have the right to say it?):** "Standing to blame" is about the social and moral relationship between the two people. It asks: "Given your own behavior, are you in a position to hold *me* accountable?"

  When your teacher says your dad's blame "doesn't count," she doesn't mean "You didn't lie" or "Lying is okay." She means your dad has lost the **moral authority** to enforce that rule against you. He is being unfair by holding you to a standard he refuses to follow himself.

  ### 2. Walking Through the Dad Example
  Let's look at the mechanics of the interaction:

  *   **The Act:** You lie to your dad. **Verdict:** This is wrong.
  *   **The Reaction:** Your dad yells at you for lying.
  *   **The Hypocrisy:** Your dad lies to his boss.
  *   **The Result:** Because your dad lies, he is implicitly claiming that *you* must follow rules that *he* exempts himself from. This makes his anger unjustified or inappropriate.

  If you say, "You lie too!", you aren't proving that your lying was okay. You are proving that **his scolding is inappropriate.** The criticism still "works" in the sense that it correctly identifies your fault, but it fails as a moral conversation because the speaker is compromised.

  ### 3. Solving the "Perfect People" Problem
  Your worry is: "If hypocrisy removes standing, only perfect people can criticize anyone." This is where the nuance comes in. Philosophers generally argue that standing is not lost by *any* past mistake, but by **relevant, unacknowledged hypocrisy.**

  *   **Relevance:** A teacher who cheated on a test in 3rd grade still has standing to tell high schoolers not to cheat. The fault is too distant or minor to undermine their current role.
  *   **Acknowledgment:** If your dad said, "I know I lie to my boss, and that's wrong. I'm struggling with it, but I don't want you to make the same mistake," he might retain standing. He isn't claiming superiority; he's offering guidance from experience.
  *   **Commitment:** Standing is lost when the blamer implies they are morally superior while secretly violating the very rule they are enforcing.

  So, moral criticism isn't invalid everywhere; it's only blocked when the critic is being inconsistent in a way that makes their rebuke unfair.

  ### 4. What You Are Conflating
  You are mixing up **the validity of the moral claim** with **the permissibility of the speaker.**

  You interpreted "his blame doesn't count" to mean "his blame is false" (i.e., I didn't do anything wrong). If that were true, then yes, only perfect people could speak morality, because any fault would make their claims false.

  But the teacher means "his blame is inappropriate" (i.e., You did something wrong, but *you* aren't the right person to yell about it). This allows imperfect people to criticize others, as long as they aren't being hypocritical about the specific issue at hand.

  ### Summary
  Your dad's hypocrisy doesn't make your lying okay; it makes his yelling unfair. The moral truth remains, but the messenger is disqualified. You don't need to be perfect to have standing; you just need to be consistent regarding the specific rule you are enforcing.

  Verdict: rests on a confusion (standing vs. correctness)
