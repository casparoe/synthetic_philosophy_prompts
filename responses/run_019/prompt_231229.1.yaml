answer: |-
  # Activity: The Cyclic Market Simulation

  **Course:** Upper-Level Decision Theory Seminar
  **Time:** 75 Minutes
  **Class Size:** 14 Students
  **Goal:** To viscerally demonstrate the money-pump argument, allowing students to experience the tension between *local rationality* (making the best trade available) and *global coherence* (avoiding sure loss), setting the stage for debating your friend's objection.

  ## 1. Materials & Setup
  *   **Tokens:** 140 "Market Dollars" (printed paper slips or poker chips).
  *   **Commodities:** 3 distinct items per group (e.g., Red, Blue, and Green index cards; or three different types of wrapped candy).
  *   **Valuation Sheets:** 12 printed sheets (6 per group) with hidden payoff structures.
  *   **Trader Ledgers:** 2 sheets for the Traders to record fees.
  *   **Stakes:** Real candy or bonus points. Exchange rate: 1 Market Dollar = 1 piece of candy (or 0.1% extra credit) at the end.
  *   **Room:** Arrange desks into two isolated "markets" (7 students per group). Use folders or dividers so Agents cannot see each other's Valuation Sheets.

  ## 2. Roles & Rules (The Cover Story)
  Tell the class this is an experiment on **"Market Liquidity and Individual Valuation."** Do not mention transitivity, rationality, or money pumps.

  *   **The Agents (12 Students, 6 per group):**
      *   **Endowment:** Each starts with 1 Commodity (e.g., Red Card) and 5 Market Dollars.
      *   **Objective:** Maximize your final "Satisfaction Score" (Satisfaction = Cash + Value of Final Commodity).
      *   **Constraint:** You are given a **Valuation Sheet**. This sheet tells you exactly how much you value the *other* commodities relative to what you hold. *You must treat these values as your true preferences for the game.*
      *   **Trading:** You may trade with the Trader if the trade increases your Satisfaction Score.
  *   **The Traders (2 Students, 1 per group):**
      *   **Objective:** Maximize your fee revenue.
      *   **Mechanism:** You hold a stock of all three commodities. You may offer to swap an Agent's commodity for another, charging a **Transaction Fee of 1 Market Dollar** per trade.
      *   **Constraint:** You cannot force trades; Agents must agree. You keep all fees collected.

  **The Hidden Cycle (Valuation Sheets):**
  To ensure the money pump works, the Valuation Sheets are rigged to create intransitivity.
  *   *Sheet A (Holding Red):* "You value Blue at $3. You value Red at $0." (Preference: Blue > Red)
  *   *Sheet B (Holding Blue):* "You value Green at $3. You value Blue at $0." (Preference: Green > Blue)
  *   *Sheet C (Holding Green):* "You value Red at $3. You value Green at $0." (Preference: Red > Green)
  *   *Instruction on Sheet:* "When you acquire a new commodity, swap your Valuation Sheet for the one corresponding to your new holding." (This ensures the cycle persists dynamically).

  ## 3. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute roles. Hand out endowments and Valuation Sheets. Emphasize: "Follow your sheet values strictly. Maximize your score. Do not discuss your values with other Agents." |
  | **10-40** | **The Market** | **Trading Session.** Traders roam their group. They approach an Agent, check their holding, and offer the *preferred* item (per the Agent's sheet) for a $1 fee. <br>*Crucial:* Traders are instructed to be polite but persistent. "I see you have Red. I know you want Blue. I'll swap you for just $1." <br>Agents trade, pay the fee, swap commodities, and swap their Valuation Sheets. |
  | **40-50** | **Settlement** | Trading stops. Agents calculate final scores (Cash + Value of final item). Traders count fees. <br>**The Reveal:** Ask Agents to raise hands if they ended with *less cash* than they started. Ask Traders to announce profits. |
  | **50-60** | **The Map** | Instructor draws the trade cycle on the board using anonymous data from the room. Show how Agent X went Red $\to$ Blue $\to$ Green $\to$ Red and lost $3. |
  | **60-75** | **Debrief** | Structured discussion (see below). |

  ## 4. The Debrief Script
  *Goal: Move from "I lost money" to "Is my preference structure broken?" while addressing your friend's objection.*

  **Step 1: Phenomenology (5 mins)**
  *   "Agents, raise your hand if every single trade you made felt like a good idea *at the moment you made it*." (Most will raise hands).
  *   "Raise your hand if you are unhappy with the final result." (Most will raise hands).
  *   **Point:** You were locally rational but globally ruined.

  **Step 2: Mapping the Argument (5 mins)**
  *   Draw the cycle: $A \succ B$, $B \succ C$, $C \succ A$.
  *   Explain: "The Trader didn't trick you. They just offered you what your own Valuation Sheet said you wanted. The loss came from the *structure* of your preferences, not the Trader's cunning."

  **Step 3: Pressing the Friend's Objection (10 mins)**
  *   **Instructor:** "My colleague argues this game only proves you are *exploitable*, not *irrational*. She says: 'If a predator is in the room, of course you lose money. That doesn't mean your preferences are wrong, it means the environment is hostile.' How would you respond based on what you just felt?"
  *   **Prompt for Students:**
      *   "If your preferences were transitive (A > B > C), could the Trader have constructed this cycle?" (No).
      *   "So, is the vulnerability in the *Trader* or in *You*?"
      *   "If rationality is about achieving your own ends, did you achieve them?" (No, you ended with less value than you started).
  *   **Key Distinction:** Guide them to see that **exploitability is a diagnostic test for incoherence.** If a set of preferences allows a sure loss in a world with *any* opportunity to trade, the preferences are the weak link, not the world.

  **Step 4: The Limit (5 mins)**
  *   Acknowledge the friend's strength: "She is right that one bad trade isn't irrational. But a *system* of preferences that guarantees loss regardless of the starting point? That looks like a definition of incoherence."

  ## 5. Predictable Failures & Solutions

  | Failure Mode | Why it Happens | Solution |
  | :--- | :--- | :--- |
  | **The "Strike"** | Agents realize the cycle after 1-2 trades and refuse to trade again. | **Incentivize the Trader:** Tell Traders privately, "The student with the highest fee revenue gets a bonus prize." They will hunt. <br>**Restrict Info:** Remind Agents they cannot talk to each other. <br>**The "Sunk Cost" Nudge:** If they stall, the Trader says, "You've already spent $1, might as get the item you actually want." |
  | **The "Joke"** | Students treat the dollars as fake and trade recklessly. | **Real Stakes:** Collect the candy/points at the *end* based on final tallies. If they lose dollars, they lose candy. Make this explicit in minute 1. |
  | **Transitivity Creep** | Agents ignore the Valuation Sheet and use real preferences (e.g., they hate Green candy). | **Abstract Commodities:** Use colored cards, not food, for the trading items. The "Value" is purely the points on the sheet. The candy is only for the final cash-out. |
  | **Trader Passivity** | Student Traders are too shy to approach Agents. | **Script the Trader:** Give Traders a checklist: "Approach Agent 1. Offer Swap. Record Fee." Make it a duty, not a choice. |

  ## 6. Honest Note: What This Activity Cannot Do

  You must supply the philosophical heavy lifting in the final discussion. The activity creates a **pragmatic** argument (intransitivity leads to loss), but it does not settle the **normative** argument (intransitivity is inherently irrational).

  **The Gap:**
  The game proves that intransitive agents *can* be pumped. It does not prove they *must* be. A sophisticated agent might anticipate the pump and refuse to trade (pre-commitment). Your friend's objection relies on this: "I am intransitive, but I am smart enough to say 'No' to the third trade."

  **Your Closing Move:**
  You must argue that **rationality is not just about smart strategies, but about consistent valuations.** If you have to adopt a strategy to *protect yourself from your own preferences*, your preferences are the problem. The activity shows the *cost* of incoherence; you must argue why avoiding that cost is a requirement of rationality, not just prudence.

  **Final Tip:**
  If a student raises your friend's objection (and they likely will), validate it. "That is an excellent point. The money pump shows a vulnerability. Whether that vulnerability constitutes a *failure of rationality* or just a *failure of prudence* is exactly what we are debating next week." This keeps the seminar open while securing your pedagogical goal.
