  **CONFIDENTIAL**

  **TO:** Treating Clinical Team; Mr L (Husband); Ms L (Daughter)
  **FROM:** Clinical Ethics Advisory Committee
  **DATE:** 14 October 2023
  **SUBJECT:** Ethics Opinion Regarding Request for Assisted Dying – Mrs L (DOB: 12/03/1949)

  **1. Background and Validity**
  The Committee has reviewed the request to enact the Advance Directive (AD) signed by Mrs L seven years ago. We confirm that the document meets all statutory requirements: it was executed while Mrs L possessed full capacity, it is specific regarding the triggering conditions, and those conditions are now clinically verified. Mrs L no longer recognises her immediate family and is fully dependent for feeding and toileting. The treating psychiatrist confirms she currently lacks the capacity to make medical decisions.

  **2. Ethical Analysis: Competing Interests**
  The Committee acknowledges the profound distress this case causes the family and the team. We have carefully considered the objection raised by Mrs L's daughter and dissenting committee members: that the contented woman currently in our care is distinct from the competent woman who signed the directive, and that ending her life contradicts her current apparent will to live.

  We recognise that Mrs L currently displays signs of contentment. However, the purpose of an Advance Directive in the context of progressive dementia is precisely to govern care when the patient can no longer evaluate their own condition. The "critical interests" established by Mrs L while competent—specifically, her valuation of cognitive identity and independence over mere biological existence—carry greater ethical weight than her current "experiential interests" (moment-to-day comfort). To rule otherwise would be to assert that a person loses the right to determine the boundaries of their life narrative the moment they lose capacity. We cannot privilege the current incapacitated self's inability to comprehend her condition over the prior competent self's explicit refusal of that condition.

  Therefore, respecting Mrs L's autonomy requires honouring the decision made when she was capable of understanding the stakes, even though the person who made that decision no longer exists in the same form. To override the directive based on her current contentment would effectively nullify the legal and ethical function of Advance Directives for dementia.

  **3. Best Interests Assessment**
  We conclude that acting in Mrs L's "best interests" encompasses more than the preservation of biological life or the avoidance of immediate distress. It includes respecting her deeply held values regarding dignity and personhood. Continuing treatment against the directive would perpetuate a state of existence she explicitly deemed unacceptable, thereby violating her integrity.

  **4. Recommendation and Safeguards**
  The Committee recommends that the request be approved, subject to the following safeguards to ensure absolute compliance with legal and ethical standards:

  1.  **Independent Verification:** A second consultant psychiatrist, unconnected to the case, must confirm the irreversibility of the condition and the lack of capacity within 7 days.
  2.  **Family Conference:** A final meeting must be held with the husband and daughter within 14 days to explain the Committee's reasoning and offer pastoral support, ensuring the husband remains resolute and the daughter's concerns are heard, even if not acquiesced to.
  3.  **Cooling-Off Period:** No action should be taken until 14 days after this opinion is issued, allowing time for any new clinical evidence to emerge.
  4.  **Administration:** The procedure must be conducted by a clinician not directly involved in Mrs L's daily care, to preserve the therapeutic relationship of the primary team.

  **5. Conclusion**
  This is not a decision taken lightly. We acknowledge the moral residue this leaves for the daughter and the team. However, the Committee finds that the legal validity of the directive, combined with the ethical imperative to respect prior competent autonomy, necessitates approval.

  **Signed,**

  **Dr [Your Name]**
  **Chair, Clinical Ethics Advisory Committee**

