answer: |-
  ### Desiderata for an Adequate Theory of Population Axiology

  The following list specifies the conditions a theory of population axiology must meet to be considered theoretically adequate. The list distinguishes between **Non-Negotiable Adequacy Conditions** (requirements for logical coherence or basic moral plausibility) and **Contested Preferences** (principles favored by specific schools of thought that may need to be sacrificed to satisfy higher-order constraints).

  #### I. Formal Constraints
  *These conditions ensure the theory functions as a rational ordering system.*

  1.  **Transitivity of the Better-Than Relation**
      *   **Specification:** If Outcome A is better than Outcome B, and Outcome B is better than Outcome C, then Outcome A must be better than Outcome C.
      *   **Motivation:** Without transitivity, the theory cannot guide choice. If a cycle exists (A > B > C > A), an agent could be money-pumped or left with no rational basis for decision.
      *   **Status:** **Non-Negotiable.** While some (e.g., Rachels) suggest intransitivity to avoid the Repugnant Conclusion, this renders the theory incapable of ranking states of affairs definitively, defeating the purpose of axiology.

  2.  **Completeness (Comparability)**
      *   **Specification:** For any two possible outcomes A and B, the theory must assert either that A is better than B, B is better than A, or they are equally good.
      *   **Motivation:** Moral paralysis. If outcomes are incomparable, the theory offers no guidance in trade-off scenarios, which are the primary subject of population ethics.
      *   **Status:** **Non-Negotiable** for a prescriptive axiology, though some pluralists argue for partial orderings. For the purpose of adjudicating rival *ranking* views, completeness is required.

  #### II. Fixed-Population Constraints
  *These conditions apply when the set of individuals is identical across outcomes.*

  3.  **Strong Pareto (Dominance)**
      *   **Specification:** If Outcome A and Outcome B contain the same people, and everyone in A has higher well-being than in B, then A is better than B.
      *   **Motivation:** The "No-Brainer" case. If a policy makes everyone better off and harms no one, it is morally required. Denying this implies that well-being is not a good.
      *   **Status:** **Non-Negotiable.** Denying Pareto is tantamount to denying the value of welfare itself.

  4.  **Sensitivity to Equality (or Priority)**
      *   **Specification:** Given a fixed sum of welfare, an outcome with a more equal distribution (or one that prioritizes the worse off) should not be ranked lower than a highly unequal one, all else being equal.
      *   **Motivation:** The "Leveling Down" intuition. While leveling down (making the rich poorer without helping the poor) is not *better*, a state where everyone is well-off is intuitively better than one where some are destitute and some are ecstatic, even if totals are identical.
      *   **Status:** **Contested Preference.** Total Utilitarianism rejects this (indifferent to distribution). Prioritarianism and Egalitarianism require it. An adequate theory should ideally accommodate this, but strict Total Utilitarianism is often considered "adequate" despite failing this. I classify this as a **High-Priority Adequacy Condition** because a theory that is indifferent to extreme suffering amidst plenty is deeply counter-intuitive.

  #### III. Variable-Population Constraints
  *These conditions apply when the number or identity of people differs.*

  5.  **The Non-Identity Distinction**
      *   **Specification:** The theory must distinguish between (a) making an outcome better *for* the people who exist in it, and (b) making an outcome better *simpliciter* by bringing new people into existence. It must not collapse these into a single metric.
      *   **Motivation:** The Non-Identity Problem. A policy might cause a child to be born with a disability rather than a different child being born healthy. The disabled child is not worse off than they would have been (existence is still worth living), yet the policy seems wrong. A theory that says "no one is harmed, so nothing is wrong" fails to capture the moral residue.
      *   **Status:** **Non-Negotiable.** A theory that cannot distinguish *better for* from *better all-things-considered* cannot solve the Non-Identity Problem.

  6.  **The Sadistic Conclusion Avoidance**
      *   **Specification:** It must never be the case that adding a group of people with *negative* welfare (lives not worth living) is better than adding a group of people with *positive* welfare (lives worth living), assuming the addition does not affect existing people.
      *   **Motivation:** The Sadistic Conclusion. Some Average Utilitarian or Critical-Level views imply that to avoid lowering the average welfare, it is better to add miserable people (if they are less miserable than the current average) than happy people (if they are below the current average). This is morally abhorrent.
      *   **Status:** **Non-Negotiable Adequacy Condition.** This is a stronger intuition than avoiding the Repugnant Conclusion. A theory implying the Sadistic Conclusion is arguably refuted.

  7.  **Mere Addition Principle (Restricted)**
      *   **Specification:** Adding a group of people with positive welfare, without affecting the welfare of existing people, does not make the outcome *worse*.
      *   **Motivation:** The intuition that existence is a gift. If lives are worth living, their creation should not be a negative event.
      *   **Status:** **Contested Preference / Candidate for Relaxation.** This is the engine of Parfit's Repugnant Conclusion. While intuitively strong, it conflicts with Transitivity and Repugnance Avoidance (see Section V).

  #### IV. Negative Constraints (Implications to Avoid)
  *These are verdicts that, if implied, typically disqualify a theory.*

  8.  **Avoidance of the Repugnant Conclusion**
      *   **Specification:** The theory must not imply that a very large population with lives barely worth living (Z) is better than a smaller population with excellent lives (A), provided the total welfare in Z is higher.
      *   **Motivation:** Parfit's original intuition. A world ofmuzak and potatoes is not better than a world of Mozart, even if the former has more total happiness.
      *   **Status:** **High-Priority Adequacy Condition.** While some (Total Utilitarians) accept this, it is widely regarded as a *reductio ad absurdum*. A theory that avoids this without incurring worse penalties (like the Sadistic Conclusion) is superior.

  9.  **Avoidance of the Absurd Conclusion**
      *   **Specification:** The theory must not imply that we have a stronger moral obligation to add a vast number of people with trivial positive welfare than to save a small number of people from extreme suffering.
      *   **Motivation:** Priority of rescue. Preventing agony should lexically outweigh creating mild pleasure.
      *   **Status:** **High-Priority Adequacy Condition.**

  ---

  ### V. The Incompatibility Analysis

  The central problem of population ethics is that the desiderata above form an **inconsistent set**. Gustaf Arrhenius's impossibility theorems demonstrate that no theory can satisfy all intuitive conditions simultaneously. Specifically, there is a tension between **Transitivity**, **Dominance**, **Mere Addition**, and **Avoidance of the Repugnant Conclusion**.

  **The Conflict:**
  1.  Start with Outcome A (High quality, small population).
  2.  Apply **Mere Addition**: A+ (A plus new happy people) is not worse than A.
  3.  Apply **Dominance/Equality**: B (Slightly lower quality than A, but higher than A+, and more equal) is better than A+.
  4.  By **Transitivity**, B is better than A.
  5.  Repeat this sequence. Eventually, you reach Outcome Z (Massive population, lives barely worth living).
  6.  By **Transitivity**, Z is better than A.
  7.  This is the **Repugnant Conclusion**.

  To have an adequate theory, one of these links must be broken.

  **Which Requirement Must Be Relaxed?**
  I argue that the **Mere Addition Principle** (in its unrestricted form) is the first requirement that must be relaxed.

  *   **Why not Transitivity?** Abandoning transitivity destroys the logical structure of rational choice. It makes the axiology useless for decision theory.
  *   **Why not Dominance?** Abandoning Dominance implies that making everyone better off can be bad. This undermines the concept of well-being as a good.
  *   **Why not Avoiding the Sadistic Conclusion?** As noted, this is morally worse than the Repugnant Conclusion.
  *   **Why Mere Addition?** The intuition behind Mere Addition ("adding happy people isn't worse") is strong in isolation but fails in limit cases. We must accept that adding lives *can* make an outcome worse if those lives fall below a certain threshold of quality, even if they are worth living. This allows for **Critical-Level Utilitarianism** or **Lexical Views**. We must accept that there is a "quality floor" for contribution to value; lives above zero welfare but below a "critical level" do not add positive value to the state of affairs, even if they are good *for* the people living them.

  **Which Requirement Eliminates the Most Serious Theories?**
  The **Avoidance of the Sadistic Conclusion** combined with **Avoidance of the Repugnant Conclusion** acts as the strongest filter.

  *   **Total Utilitarianism:** Eliminated. It satisfies Sadistic Avoidance but fails Repugnance Avoidance.
  *   **Average Utilitarianism:** Eliminated. It avoids the Repugnant Conclusion but often implies the Sadistic Conclusion (adding miserable people can raise the average if the existing population is miserable enough) or the "Mere Addition Paradox" (adding happy people makes things worse if they are below average).
  *   **Strict Person-Affecting Views:** Eliminated. They fail to handle Non-Identity cases (cannot say a world with more happy people is better if no *particular* person is better off) and often violate Transitivity or Dominance in variable population cases.

  ### VI. Surviving Families of Views

  Based on the desiderata above—specifically holding Transitivity, Dominance, and Sadistic Avoidance as non-negotiable, while relaxing Unrestricted Mere Addition to save Repugnance Avoidance—the following families of views remain adequate candidates:

  1.  **Critical-Level Utilitarianism:**
      *   **Mechanism:** Adds value only for lives above a specified "critical level" of welfare (set above zero).
      *   **Fit:** Avoids the Repugnant Conclusion (lives barely worth living add no value). Avoids Sadistic Conclusion (negative lives subtract value).
      *   **Cost:** Must accept that adding a life worth living (but below the critical level) makes the outcome *worse*. This is the required relaxation of Mere Addition.

  2.  **Lexical Prioritarianism / Lexical Utilitarianism:**
      *   **Mechanism:** Holds that sufficiently good lives are lexically superior to any number of merely worth-living lives.
      *   **Fit:** Directly blocks the Repugnant Conclusion by denying the trade-off between quality and quantity at the limit.
      *   **Cost:** Violates "Continuity" (the idea that enough small gains can equal one large gain). This is generally more acceptable than accepting the Repugnant Conclusion.

  3.  **Number-Dampened Utilitarianism:**
      *   **Mechanism:** The value of total welfare is divided by a function of population size (not the average, but a dampener).
      *   **Fit:** Balances total and average intuitions. Can be calibrated to avoid RC and SC.
      *   **Cost:** Requires arbitrary parameter selection for the dampening function.

  **Conclusion:**
  An adequate theory of population axiology must prioritize logical coherence (Transitivity) and basic moral constraints (Dominance, No Sadism) over the intuition that "more happy lives is always better." The list of requirements itself reveals that **Total Utilitarianism** is theoretically insufficient due to the Repugnant Conclusion, and **Average Utilitarianism** is insufficient due to the Sadistic Conclusion. The only viable path is a **Critical-Level or Lexical view** that accepts a restriction on Mere Addition: the claim that creating a life worth living is not necessarily a moral improvement if that life does not meet a threshold of substantive quality.
