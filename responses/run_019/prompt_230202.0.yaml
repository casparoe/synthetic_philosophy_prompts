      *   **Section 3: Variable Population Constraints:** Mere Addition, Non-Identity/Person-Affecting distinction.
      *   **Section 4: Negative Constraints (Implications to Avoid):** Repugnant, Sadistic, Absurd.
      *   **Section 5: The Incompatibility Analysis:** The crux of the prompt. Identify the conflict. Choose the sacrifice. Identify the biggest filter.
      *   **Section 6: Surviving Families:** Briefly map the criteria to the theories.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Person-Affecting:* The prompt asks for the distinction not to be collapsed. So the desideratum isn't "Be Person-Affecting," it's "Respect the distinction between 'better for' and 'better simpliciter'."
      *   *Correction on Sadistic Conclusion:* This is when a theory says adding people with *negative* welfare is better than adding people with *positive* welfare (usually to avoid RC). This is widely regarded as worse than RC. I should mark Avoiding SC as Non-Negotiable/High Priority.
      *   *Correction on Mere Addition:* Parfit's Mere Addition Paradox shows A+ is not worse than A, B is better than A+, therefore B is better than A. If we repeat this, we get Z (Repugnant) better than A. To stop this, we must deny Transitivity OR deny Mere Addition (say A+ *is* worse than A).
      *   *Decision:* I will argue that denying the *unrestricted* Mere Addition principle is the most defensible move to save Transitivity and avoid RC.

  7.  **Final Review against Prompt Requirements:**
