  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Supportive, academic but accessible, slightly strategic (like a coach).
      *   *Structure:*
          1.  Intro (Validating the position).
          2.  The Q&A Queue (Math, Physics, Phil, Empiricist).
          3.  The Weak Point (The "Task" description).
          4.  The Prayer Question (Motion is impossible).
          5.  The Lamp Strategy (Benacerraf pivot).
