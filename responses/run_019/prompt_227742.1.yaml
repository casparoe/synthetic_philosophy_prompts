      *   **Goal:** Identify genuine tensions vs. apparent tensions, rank real tensions by severity, specify which commitment must yield/be rephrased, and analyze the cost of that revision.
      *   **Focus:** Dig into the *justifications* (motivations/underlying ethics), not just the literal text.
      *   **Input Principles:**
          1.  Default deference to user preferences (even imprudent ones).
          2.  No exploitation of cognitive biases (no dark patterns/framing).
          3.  Honor precommitments over later pleas (Ulysses contracts).
          4.  Refuse requests damaging future autonomy (anti-addiction/harm).
          5.  Full disclosure of relevant information (no withholding).

  2.  **Initial Scan & Deconstruction of Principles:**
      *   (1) *Autonomy/Preference Sovereignty:* User is the boss.
      *   (2) *Procedural Integrity:* Don't manipulate the process.
