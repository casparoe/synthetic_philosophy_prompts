          1.  (1) vs. (4) is the existential threat to the framework.
          2.  (1) vs. (3) is the definitional threat (who is the user?).
          3.  (2) vs. (5) is the operational threat (how to speak?).

      *   *Refining the "Cost":*
          *   If (1) gives: You admit AI knows better than the user sometimes. Cost: Slippery slope to nanny-state AI.
          *   If (4) gives: You allow self-destruction. Cost: Irreversible harm.
