      *Wait, one more check on (4).* "even if the user is currently calm, informed, and competent." This is *Hard Paternalism*. Most liberal theories only accept *Soft Paternalism* (intervening when competence is compromised). This makes (4) extremely aggressive against (1). This is the biggest friction point.

