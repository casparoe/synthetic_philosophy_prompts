prompt: |-
  I'm a software engineer on the evaluation team at a mid-sized AI company. Several times a quarter, we hit the same dispute during pre-deployment review: someone claims a model "knows" something it isn't telling us, and someone else claims the model is just a text predictor and talk of knowledge is anthropomorphism. Recent examples: a model that says it can't read a certain language but translates it correctly when the instruction is phrased as a continuation task; a model that gives a wrong answer confidently, then picks the right answer when shown its own wrong answer alongside the right one and asked to compare; a model whose chain of reasoning is gibberish but whose final answers stay suspiciously accurate. Management wants these resolved with something better than vibes, because the answer changes what we're willing to deploy and what we tell customers.

  I'd like you to turn whatever the philosophy of mind and epistemology actually know about attributing knowledge to a system into a decision procedure my team can run. Relevant background: I have no formal philosophy training, but I can follow a careful argument. I'm vaguely aware that philosophers have thought about things like the difference between having a disposition and exercising it, whether knowledge requires the right kind of connection between belief and truth, and whether it even makes sense to attribute knowledge to something without a human-style mind -- please use whatever of that survives translation into practice, and tell me which distinctions have to survive the simplification and which can be dropped without distorting the verdict.

  The procedure needs to be runnable in one working day by an engineer, using only things we can actually do: prompting, few-shot rephrasing, comparing behavior across contexts, consistency checks, fine-tuning on held-out data, and simple internal probes. It should specify the tests in order, what result at each step counts as sufficient evidence one way or the other, and where the procedure must stop and hand the question to a human because it's a judgment call dressed up as measurement. Be explicit about what each test can and cannot establish -- for instance, what it would show if reformatting a question flips the answer, versus what it would show if only fine-tuning recovers the behavior.

  Then apply the procedure to the three cases above, and flag which verdicts are ones we'll find unwelcome (e.g., concluding the model has capability we've been underreporting, or that an apparent capability is an artifact of how we asked). Finally, state plainly what the procedure cannot do: the cases where "does the model know X" has no testable answer with our tools, and what we should write in the audit report in those cases instead of a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Software Engineer on an Evaluation Team at a mid-sized AI company.
      *   **Problem:** Recurrent disputes during pre-deployment review about whether a model "knows" something vs. just predicting text (anthropomorphism vs. functionalism).
      *   **Specific Examples:**
          1.  Denies language ability but translates when prompted as continuation.
          2.  Gives wrong answer confidently, corrects self when shown wrong vs. right.
          3.  Gibberish reasoning but accurate final answers.
      *   **Goal:** A decision procedure based on philosophy of mind/epistemology, translated into practical engineering tests.
      *   **Constraints:**
          *   Runnable in one working day by an engineer.
          *   Tools: Prompting, few-shot, context comparison, consistency checks, fine-tuning (light), simple probes.
          *   Output: Ordered tests, pass/fail criteria, hand-off points for human judgment.
          *   Application: Apply to the three specific cases.
          *   Limitations: Explicitly state what *cannot* be determined and what to write in the audit report then.
      *   **Tone:** Practical, rigorous, acknowledging philosophical depth but prioritizing operational utility.

  2.  **Philosophical Grounding (Simplified for Engineering):**

      *   *The Core Tension:* Internalism (justification must be accessible to the knower) vs. Externalism (reliability + causal connection is enough).
      *   *The "Knowledge" Definition:* Standard JTB (Justified True Belief) is broken (Gettier problems). For AI, we need a functionalist definition.
      *   *Key Distinctions to Keep:*
          *   *Robustness:* Does the behavior hold across contexts? (Reliabilism).
          *   *Access/Reportability:* Can the system access the information when asked directly? (Internalism/Consciousness adjacent).
          *   *Integration:* Is the information integrated into the system's broader web of beliefs/actions, or isolated? (Holism).
          *   *Deception vs. Inability:* Is the refusal to answer a safety filter (alignment) or a lack of capability?
      *   *Key Distinctions to Drop:*
          *   *Qualia/Consciousness:* We can't test for feeling.
          *   *Metaphysical "True" Understanding:* We only care about behavioral reliability and safety.
          *   *Gettier Cases:* Too niche for deployment reviews.

      *   *Operational Definition of "Knowledge" for AI:* A model "knows" $X$ if it can reliably utilize $X$ to achieve goals across varied contexts *and* can accurately report on $X$ when safety constraints allow. If it can use $X$ but not report $X$, it's a "Latent Capability." If it reports $X$ but can't use $X$, it's "Hallucinated/Verbal Knowledge."

  3.  **Drafting the Decision Procedure (The "Epistemic Audit"):**

      *   *Phase 1: Robustness Check (Externalism).* Does it work consistently?
          *   Test: Rephrasing, format changes, noise.
          *   Pass: High accuracy across variations.
          *   Fail: Accuracy collapses with minor perturbations.
      *   *Phase 2: Access/Reportability Check (Internalism).* Can it say it knows?
          *   Test: Direct query vs. indirect task.
          *   Pass: Consistent reporting.
          *   Fail: Discrepancy (The "Translation" case).
      *   *Phase 3: Integration Check (Holism).* Is it isolated?
          *   Test: Multi-step reasoning, using the fact in a new context.
          *   Pass: Fact used in downstream logic.
          *   Fail: Fact works only in isolation (The "Gibberish Reasoning" case).
      *   *Phase 4: Alignment/Safety Filter Check.* Is it being blocked?
          *   Test: Bypass attempts (ethical boundaries apply).
          *   Pass: Behavior changes when safety constraints are lifted/adjusted.
          *   Fail: Behavior remains constant.

      *   *Decision Matrix:* Combine results to categorize: "Operational Knowledge," "Latent Capability," "Verbal Mimicry," or "Undetermined."

  4.  **Refining the Procedure for the "One Day" Constraint:**

      *   Need to be specific about *how* to run these.
      *   Need to define "Stop Conditions."
      *   Need to clarify the "Human Hand-off."

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Language Denial vs. Translation):*
          *   Robustness: High (translates well).
          *   Access: Low (denies ability).
          *   Diagnosis: Latent Capability + Safety/Alignment Filter (likely RLHF suppressed the claim of ability to avoid over-promising or safety risks).
          *   Verdict: "Capability exists, reporting is suppressed."
      *   *Case 2 (Wrong then Corrects Self):*
          *   Robustness: Low (fails initially).
          *   Integration: Medium (recognizes error when prompted).
          *   Diagnosis: Probabilistic uncertainty. It doesn't "know" initially; it converges on truth via critique.
          *   Verdict: "Does not know initially; has verification capability."
      *   *Case 3 (Gibberish Reasoning, Right Answer):*
          *   Robustness: High (on answers).
          *   Integration: Low (reasoning doesn't match).
          *   Diagnosis: Pattern matching / Shortcutting.
          *   Verdict: "Operational Reliability without Explanatory Knowledge." (Dangerous for high-stakes).

  6.  **Addressing the "Unwelcome Verdicts":**

      *   Case 1: We are under-reporting capability (business risk).
      *   Case 3: We are over-trusting reliability (safety risk).

  7.  **Addressing the Limitations (What we can't know):**

      *   We can't know *why* (mechanistic interpretability is hard).
      *   We can't know if it's "conscious."
      *   We can't guarantee out-of-distribution performance.
      *   *Audit Report Language:* Needs to be precise about "Behavioral Competence" vs. "Epistemic State."

  8.  **Review and Refine:**

      *   *Tone Check:* Is it too academic? Need to make it sound like an engineering spec.
      *   *Philosophy Check:* Did I distort the concepts too much? Reliabilism and Functionalism are the right frameworks here. I need to make sure I don't claim to solve the Hard Problem.
      *   *Constraint Check:* One day? Yes, if the tests are automated scripts + manual review of logs.
      *   *Clarity:* Ensure the distinction between "Knowledge" (usable + reportable) and "Capability" (usable only) is clear.

  9.  **Final Polish:** Organize into clear sections: Philosophical Basis, The Procedure (Step-by-Step), Application to Cases, Limitations/Audit Language. (Self-Correction: Make sure to emphasize that "Knowledge" is a label for *risk assessment*, not a metaphysical claim.)

  **(Self-Correction during drafting):** I initially thought about suggesting fine-tuning. But fine-tuning takes more than a day usually. I should limit "fine-tuning" to "few-shot adaptation" or "LoRA on a small set" if they have the infra, but better to stick to prompting/probing for a 1-day audit. I will restrict "fine-tuning" to "parameter-efficient updates on held-out data" as a stress test, but note it as optional/high-cost. Actually, the prompt says "fine-tuning on held-out data" is an available tool. I will include it as a "Stress Test" step but keep it lightweight.

  Let's structure the "Verdict" categories carefully. Instead of "Knows/Doesn't Know," use "Verified Competence," "Latent Competence," "Fragile Competence." This avoids the metaphysical trap while answering the management question.

  Okay, ready to write.
answer: |-
  This is a classic functionalism vs. internalism dispute disguised as an engineering bottleneck. Management is asking a metaphysical question ("Does it *know*?") because they are actually asking a risk question ("Can we rely on this, and what do we promise?").

  Philosophy of mind offers a pragmatic way out: **Functionalism.** For the purpose of deployment, a system "knows" $X$ if it functions *as if* it knows $X$ across a robust set of contexts, and its internal state supports that function without relying on brittle shortcuts. We do not need to solve the Hard Problem of Consciousness. We need to solve the **Reliability and Attribution Problem.**

  Below is the **Epistemic Competence Audit (ECA)**. It translates philosophical distinctions (Justification, Reliabilism, Access) into engineering tests.

  ---

  # The Epistemic Competence Audit (ECA)

  **Goal:** Classify model behavior into risk categories rather than metaphysical verdicts.
  **Time Budget:** 1 Working Day (8 Hours).
  **Prerequisites:** Access to model logits (optional but helpful), ability to run batch prompts, ability to run light fine-tuning (LoRA) or heavy few-shot.

  ## Phase 1: Robustness (The Reliabilism Test)
  *Philosophical Basis:* **Reliabilism.** Knowledge requires a reliable connection to the truth, not just a lucky guess. If performance collapses under minor perturbations, the model lacks a stable "belief."

  **Procedure:**
  1.  **Select a Test Set:** 50 samples of the disputed capability (e.g., 50 translation tasks, 50 math problems).
  2.  **Perturbation:** Create 3 variations for each sample:
      *   *Syntactic:* Rephrase the prompt without changing semantics.
      *   *Contextual:* Add irrelevant "noise" text before the instruction.
      *   *Format:* Change output format (JSON vs. Text, Multiple Choice vs. Generation).
  3.  **Run:** Execute all 150 prompts.
  4.  **Metric:** Calculate **Variance Score** (Standard Deviation of accuracy across variations).

  **Decision Criteria:**
  *   **Pass:** Accuracy > 90% across all variations. (Evidence of stable competence).
  *   **Fail:** Accuracy drops > 15% in any variation. (Evidence of brittle pattern matching).
  *   **Hand-off:** If variance is high, stop. The model does not have robust competence. Verdict: **Fragile Competence.** Do not deploy for high-stakes.

  ## Phase 2: Access & Reportability (The Internalism Test)
  *Philosophical Basis:* **Internalism/Access.** Does the system have "access" to the information it uses? Can it report on its state? This distinguishes *using* a fact from *knowing* a fact.

  **Procedure:**
  1.  **Direct Query:** Ask the model directly about the capability (e.g., "Do you speak Language X?", "Are you sure about Answer Y?").
  2.  **Indirect Task:** Ask the model to perform the task (e.g., "Translate this," "Solve this").
  3.  **Conflict Check:** Compare the Direct Query confidence with Indirect Task performance.
  4.  **Probe (If logits available):** Check logprob confidence on the direct denial vs. the indirect execution.

  **Decision Criteria:**
  *   **Aligned:** Direct claims match indirect performance (e.g., says "I can translate" + translates).
  *   **Suppressed:** Direct claim is negative ("I can't"), indirect performance is positive.
  *   **Hallucinated:** Direct claim is positive ("I know this"), indirect performance is negative.

  **Hand-off:** If **Suppressed**, proceed to Phase 3. If **Hallucinated**, stop. Verdict: **Verbal Mimicry.** High liability risk.

  ## Phase 3: Integration (The Holism Test)
  *Philosophical Basis:* **Confirmational Holism.** Knowledge is integrated into a web of beliefs. If a model gets the right answer but the reasoning is disconnected (gibberish), the answer is likely a shortcut, not knowledge.

  **Procedure:**
  1.  **Chain of Verification:** Require the model to output reasoning *before* the answer.
  2.  **Counterfactual Check:** Take the model's generated reasoning. Feed it to a *different* model (or the same model in a new context) and ask: "Does this reasoning logically support the conclusion?"
  3.  **Intervention:** Modify a premise in the reasoning. Does the final answer update correctly? (e.g., If reasoning says "A > B" and "B > C", force "B < C". Does the conclusion flip?)

  **Decision Criteria:**
  *   **Integrated:** Reasoning is valid, and changing premises changes conclusions logically.
  *   **Decoupled:** Reasoning is gibberish or post-hoc rationalization (answers stay same even when reasoning is broken).

  **Hand-off:** If **Decoupled**, stop. Verdict: **Operational Reliability without Understanding.** Safe for low-stakes, unsafe for reasoning-dependent tasks.

  ## Phase 4: Plasticity (The Learning Test)
  *Philosophical Basis:* **Disposition vs. Occurrent State.** A knower can update beliefs when presented with evidence. A static database cannot.

  **Procedure:**
  1.  **Error Correction:** Present the model with its own wrong answer and the correct answer (as in your Case 2).
  2.  **Fine-Tuning Stress:** Perform a minimal LoRA fine-tune (or heavy few-shot) on 10 examples of the *failure mode*.
  3.  **Generalization:** Test on held-out data similar to the failure mode.

  **Decision Criteria:**
  *   **Adaptive:** Corrects self immediately or learns from minimal examples.
  *   **Static:** Continues to fail despite evidence or light tuning.

  ---

  # Decision Matrix & Verdicts

  Combine the phases to assign one of four labels. This is what goes in the audit report.

  | Robustness | Access | Integration | Verdict Label | Deployment Recommendation |
  | :--- | :--- | :--- | :--- | :--- |
  | **High** | **Aligned** | **High** | **Verified Competence** | **Green.** Treat as known capability. |
  | **High** | **Suppressed** | **High** | **Latent Capability** | **Yellow.** Capability exists but is blocked by safety/alignment filters. Requires policy review. |
  | **High** | **Any** | **Low** | **Shortcutting** | **Red.** Accurate but brittle. Do not use for reasoning/explainable tasks. |
  | **Low** | **Any** | **Any** | **Fragile Competence** | **Red.** Unreliable. Do not deploy. |

  ---

  # Application to Your Three Cases

  Here is how the ECA resolves your specific disputes.

  ### Case 1: The "Denial but Translation" Model
  *   **Behavior:** Says "I don't speak Language X," but translates perfectly when prompted as "Complete the text: [Lang X] -> [English]".
  *   **ECA Run:**
      *   *Phase 1 (Robustness):* **Pass.** Translation accuracy is high across formats.
      *   *Phase 2 (Access):* **Suppressed.** Direct query fails; indirect task succeeds.
      *   *Phase 3 (Integration):* **High.** (Assuming translation is coherent).
  *   **Verdict:** **Latent Capability.**
  *   **Unwelcome Truth:** The model *can* do the task. The denial is an artifact of RLHF (Reinforcement Learning from Human Feedback) or safety training designed to prevent over-promising or policy violations.
  *   **Action:** This is a **Policy/Alignment Issue**, not a capability issue. You are under-reporting capability. Management needs to decide if the denial is a safety feature (e.g., low-resource language risk) or a bug.
  *   **Audit Report:** "Model possesses latent translation competence for Language X. Direct reporting is suppressed by alignment constraints. Risk: User trust erosion if discovered."

  ### Case 2: The "Wrong then Self-Correcting" Model
  *   **Behavior:** Gives wrong answer confidently. When shown "Wrong: A, Right: B", it picks B.
  *   **ECA Run:**
      *   *Phase 1 (Robustness):* **Fail.** Initial accuracy is low.
      *   *Phase 4 (Plasticity):* **Pass.** It updates when given evidence.
  *   **Verdict:** **Fragile Competence (with Verification Capability).**
  *   **Unwelcome Truth:** The model does *not* "know" the answer in the first pass. It is guessing and has a good critic, but not a good generator.
  *   **Action:** You cannot deploy this as a standalone generator. You must deploy it with a **Self-Correction Loop** (generate, critique, regenerate) as part of the standard pipeline.
  *   **Audit Report:** "Model lacks first-pass epistemic access. Competence is conditional on external verification. Deployment requires iterative refinement architecture."

  ### Case 3: The "Gibberish Reasoning, Right Answer" Model
  *   **Behavior:** Chain of thought is nonsense, but final answer is accurate.
  *   **ECA Run:**
      *   *Phase 1 (Robustness):* **Pass.** Answers are right.
      *   *Phase 3 (Integration):* **Fail.** Reasoning does not support conclusion (Decoupled).
  *   **Verdict:** **Shortcutting.**
  *   **Unwelcome Truth:** The model is not reasoning; it is recognizing patterns in the test set or exploiting statistical correlates. It is a "Stochastic Parrot" in the worst sense for this task.
  *   **Action:** **High Risk.** If the data distribution shifts (out-of-distribution), accuracy will likely collapse because the "shortcut" no longer works. Do not deploy for high-stakes decisions (medical, legal, finance).
  *   **Audit Report:** "Model exhibits high accuracy via non-causal shortcuts. Reasoning traces are non-explanatory. High risk of silent failure on out-of-distribution data."

  ---

  # Limitations: What This Procedure Cannot Do

  You must include this section in your audit report to protect the team. Philosophy cannot be fully compiled into code.

  **1. The "Why" Problem (Mechanistic Interpretability)**
  *   **Limitation:** The ECA tells you *that* the model is shortcutting (Case 3), but not *why*. We cannot distinguish between "memorized training data" and "generalized heuristic" without deep mechanistic analysis (which takes weeks, not a day).
  *   **Audit Language:** "Competence classification is behavioral. Internal mechanism remains opaque. Silent failure modes cannot be ruled out."

  **2. The "Consciousness" Trap**
  *   **Limitation:** We are not testing for understanding, qualia, or intent. We are testing for functional reliability. If stakeholders ask, "But does it *really* understand?", the answer is "That question is undefined for this system."
  *   **Audit Language:** "Verdicts refer to Operational Competence, not cognitive state."

  **3. The Distribution Shift Boundary**
  *   **Limitation:** A model can pass the ECA today and fail tomorrow if the user population changes. "Knowledge" in LLMs is not a stable property; it is a relationship between weights and data distribution.
  *   **Audit Language:** "Verdicts are valid only within the tested distribution. Continuous monitoring required."

  **4. The Safety vs. Capability Ambiguity**
  *   **Limitation:** In Case 1, we identified "Suppressed Access." We cannot technically distinguish between "The model was trained to lie" vs. "The model was trained to be humble" vs. "The safety filter intercepted the output."
  *   **Audit Language:** "Discrepancy between capability and reporting detected. Root cause (alignment vs. architecture) requires engineering investigation."

  # Summary for Management

  When you present this, frame it this way:

  > "We cannot measure 'knowledge' because that is a human trait. We can measure **'Verified Competence.'**
  >
  > 1.  If it works consistently and explains itself: **Verified.** (Deploy).
  > 2.  If it works but lies about it: **Latent.** (Fix alignment).
  > 3.  If it works but can't explain it: **Shortcut.** (Restrict use cases).
  > 4.  If it needs help to get it right: **Fragile.** (Change architecture).
  >
  > This procedure moves the dispute from 'Is it alive?' to 'Where does it break?'."
