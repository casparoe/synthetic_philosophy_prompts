answer: |-
  The United States intellectual-property scheme is not a monolithic theory of ownership applied to three different subjects; it is a pragmatic assemblage of three distinct legal technologies, each calibrated to a different economic and social problem. To reconstruct the implicit theory, we must distinguish between what the rules *logically require*, what they *accommodate*, and what they *ignore*.

  ### I. Reconstructing the Implicit Theory

  **1. Strict Presuppositions**
  The scheme strictly presupposes that **abstract ideas are not ownable**. This is the "idea/expression dichotomy" in copyright, the prohibition on patenting "laws of nature" or "abstract ideas," and the forfeiture of trade secret status upon public disclosure. The system is structurally committed to a robust public domain; property rights are the exception, not the rule.
  Secondly, the scheme strictly presupposes that **rights are instrumental boundaries, not natural boundaries**. The variation in defenses (independent creation vs. independent invention vs. reverse engineering) proves that the scope of the right is not determined by the metaphysical nature of the "creation" itself, but by the policy cost of granting exclusivity. If ownership were a natural right inhering in the mind's product, the defense of independent creation would be incoherent across all three regimes.

  **2. What Fits Well**
  *   **Labor-Desert (Lockean):** This account fits the *grant* of rights well. In all three regimes, rights originate from an act of human exertion (writing, inventing, maintaining secrecy). However, it fits the *limits* poorly. Lockean theory suggests that if you mix your labor with the commons, the fruit is yours. It struggles to explain why the second independent inventor in patent law, who also mixed labor with the commons, gets nothing.
  *   **Instrumentalism (Utilitarian):** This account fits the *architecture* best. The differences between the regimes map perfectly to incentive structures. Copyright is weak (independent creation allowed) because expression is cheap to produce and hard to prove copying; strong monopoly would stifle culture. Patent is strong (no independent invention defense) because R&D is costly and easy to copy; weak protection would kill investment. Trade Secret is relational because some innovations are best kept private, but competition (reverse engineering) must remain possible to prevent stagnation.

  **3. What is Underdetermined**
  The scheme is philosophically underdetermined regarding the **moral status of the creator**. The U.S. system largely rejects the "Personhood" account (dominant in European *droit d'auteur*) in favor of economic rights. While copyright protects "expression," it allows alienation and lacks strong inalienable moral rights (like the right of attribution or integrity) compared to civil law systems. The system does not commit to the view that a work is an extension of the self; it treats the work as a commodity to be traded, licensed, or sold.

  **4. Do they commit to "Ideas are never owned"?**
  Yes, strictly. Even in patent, one owns the *application* of the idea, not the idea itself. In trade secret, one owns the *secrecy*, not the information once decoded. The system is committed to the view that the raw material of thought must remain free for others to use, even if the specific labor applied to it is protected.

  **5. Which Account Prevails?**
  The scheme licenses Labor-Desert as the *origin story* (you get rights because you made it) but commits to Instrumentalism as the *architectonic principle* (you keep rights only insofar as it helps society). Personhood is a ghost in the machine, present in the rhetoric of "authorship" but absent in the mechanics of infringement.

  ---

  ### II. The Concrete Test: Pure Labor-Desert

  If we apply a pure Labor-Desert account consistently—where rights are earned solely by the expenditure of labor and priority is secondary to the act of creation—the **Patent** regime creates the starkest contradiction.

  *   **The Rule to Discard:** The rule that **"independent invention is no defense to infringement."**
  *   **The Replacement Rule:** Independent invention **would become a complete defense**, or alternatively, the law would grant **concurrent patents** to all independent inventors.
  *   **Reasoning:** Under pure Labor-Desert, property rights attach when an individual mixes their labor with the commons. If Inventor A labors in Lab A to create a chemical process, they own it. If Inventor B labors in Lab B to create the *same* process without knowledge of A, Inventor B has also mixed their labor with the commons. To deny B rights because A filed a paper earlier is to punish B's labor for A's benefit. A consistent Labor-Desert theory cannot justify extinguishing the second laborer's claim solely due to temporal priority. (Note: This would likely leave Copyright and Trade Secret rules largely intact, as independent creation and reverse engineering both respect the labor of the second actor).

  ### III. The Concrete Test: Pure Personhood

  If we apply a pure Personhood account consistently—where property is an extension of the creator's will, dignity, and private sphere—the **Trade Secret** regime creates the starkest contradiction.

  *   **The Rule to Discard:** The rule that **"reverse engineering is lawful."**
  *   **The Replacement Rule:** Reverse engineering **would be unlawful** (tortious), treated as an intrusion upon the creator's personal sphere, regardless of whether the product was purchased on the shelf.
  *   **Reasoning:** In a Personhood framework, a trade secret is not merely a commercial asset; it is a zone of privacy and a projection of the creator's will that they have chosen *not* to alienate. While selling a bottle transfers ownership of the physical object, it does not necessarily consent to an invasion of the intellectual privacy contained within. Reverse engineering treats the secret as a puzzle to be solved (Instrumental) or a reward for the reverse engineer's labor (Labor-Desert). A Personhood view treats it as an x-ray of a locked diary: the method of access (buying the bottle) does not negate the violation of the creator's integrity and private sphere. While Personhood theory might also challenge Patent's exclusion of independent inventors (denying the second inventor's self-expression), the violation inherent in *decoding a secret* is a more direct affront to the concept of a "private self" than the economic exclusion of a public patent.

  ### Summary
  The U.S. IP scheme is a utilitarian engine painted with Lockean colors. It strictly presupposes that ideas must remain free, uses labor to justify the initial grant, but uses social welfare to justify the limits. A pure Labor theory would break the Patent monopoly to protect the second inventor's work; a pure Personhood theory would break the Trade Secret defense to protect the original creator's privacy. The fact that the current system does neither confirms that its true commitment is not to the creator's natural rights, but to the calibrated optimization of innovation.
