answer: |-
  This is a precise and demanding translation task. You are asking to map a philosophical account grounded in rational choice and epistemic logic onto a framework grounded in selection dynamics and population statistics. The tension lies between *reasons for action* (Lewis) and *causes of proliferation* (Evolutionary Game Theory, EGT).

  Here is the translation, the test case, and the residue report.

  ### 1. Translation of Lewis's Account into EGT Vocabulary

  To translate Lewis faithfully, we must treat the "agents" not as deliberating minds but as strategy-carrying replicators, and "knowledge" not as mental states but as information structures available to the selection process.

  *   **The Recurring Situation:**
      *   *Lewis:* A repeated coordination problem facing a population.
      *   *EGT Translation:* A **repeated symmetric (or asymmetric) game** played within a population. The payoff matrix exhibits the structure of a **coordination game** (e.g., Stag Hunt or Battle of the Sexes), where payoffs are maximized when strategies match or correlate, rather than when one strategy dominates regardless of opponent.
  *   **Multiplicity of Solutions:**
      *   *Lewis:* At least one alternative regularity could have served.
      *   *EGT Translation:* The game possesses **multiple Evolutionarily Stable Strategies (ESS)** or, more weakly, multiple **Nash Equilibria**. Crucially, these equilibria must be **payoff-comparable**; if one equilibrium strictly Pareto-dominates the other, selection pressure usually drives the population to the dominant one, reducing the "arbitrariness." For Lewisian convention, we require a landscape with multiple fitness peaks of roughly similar height.
  *   **Conformity as Conditional Preference:**
      *   *Lewis:* I prefer to conform conditional on others conforming.
      *   *EGT Translation:* The strategy $S_{conv}$ is a **best response to itself**. Formally, $E(S_{conv}, S_{conv}) > E(S_{mut}, S_{conv})$. This is the definition of a strict Nash Equilibrium, which is a prerequisite for ESS. The "preference" is translated into **fitness differential**: a mutant playing $S_{mut}$ obtains lower fitness in a population fixed on $S_{conv}$.
  *   **Expectation and Common Knowledge:**
      *   *Lewis:* Everyone expects others to conform, and everyone knows that everyone knows...
      *   *EGT Translation:* This is the point of maximum distortion. In replicator dynamics, agents do not hold expectations.
          *   *Expectation* translates to the **population frequency** ($p \approx 1$). An individual "expects" conformity because the statistical probability of encountering a conformist is near unity.
          *   *Common Knowledge* translates to **public observability of the population state** or **correlated signals**. For the equilibrium to be stable against invasion, the regularity must be detectable. If the strategy is conditional on a signal (e.g., "drive on the left"), that signal must be publicly observable (a **correlated equilibrium**). In models with **assortment**, the "knowledge" is replaced by the structural probability of interacting with like-types. CK effectively drops out as a mental state and becomes a condition on the **information set** of the game: the cue triggering the strategy must be reliable and public.
  *   **Arbitrariness:**
      *   *Lewis:* The convention is arbitrary; another would have done.
      *   *EGT Translation:* **Path Dependence**. The final equilibrium is determined by initial conditions (historical frequency) or stochastic drift, not by intrinsic payoff superiority. If the basin of attraction for Equilibrium A and Equilibrium B are both accessible from the initial population state, the selection of A over B is arbitrary in the Lewisian sense.
  *   **Precedent and Salience:**
      *   *Lewis:* How the convention started and why this solution was picked.
      *   *EGT Translation:* **Historical Contingency** and **Focal Points**.
          *   *Precedent* is the **trajectory of the replicator dynamics** from a specific initial distribution.
          *   *Salience* maps to **correlated signals** that break symmetry. In biological terms, this is an **asymmetric contest** cue (e.g., size, ownership) that allows the population to coordinate on one specific equilibrium among the multiple available without explicit negotiation.

  ### 2. Test Case: The Owner-Intruder (Bourgeois) Convention

  **The Scenario:** In territorial contests, individuals play "Bourgeois": If Owner, escalate (Hawk); If Intruder, retreat (Dove). This avoids costly fights. The alternative is "Anti-Bourgeois": If Owner, retreat; If Intruder, escalate. Both are ESSs in the standard Hawk-Dove model with ownership asymmetry (Maynard Smith & Parker 1976).

  **Does it count as a Lewisian Convention under the translation?**

  *   **Regularity/Conditional Preference:** Yes. Bourgeois is an ESS. $E(Bourgeois, Bourgeois) > E(Mutant, Bourgeois)$.
  *   **Multiplicity/Arbitrariness:** Yes. Anti-Bourgeois is also an ESS. Ownership is an arbitrary asymmetry (randomly assigned); there is no intrinsic fitness advantage to being the owner other than the coordination benefit.
  *   **Expectation/Common Knowledge:** Here is the friction. The animals hold no mental expectations.
      *   *Translation Verdict:* Under the EGT translation, the "expectation" is satisfied by the **reliability of the asymmetry cue**. The "common knowledge" condition is satisfied if the ownership status is **publicly observable** (no private information about who arrived first).
      *   *The Bite:* If we insist on Lewis's original epistemic definition (agents must *know* that others *know*), the Bourgeois strategy is **not** a convention; it is a mere behavioral regularity driven by selection. However, if we accept the EGT translation where "knowledge" is functionalized as "public information available to the selection mechanism," then it **is** a convention.

  **Loose Biologists or Strict Lewis?**

  Your field is using the word *functionally*, while Lewis used it *constitutively*.
  *   **Lewis:** A convention requires a specific epistemic structure to distinguish it from a coerced regularity or a instinctual reflex. The "arbitrariness" must be recognized by the agents to sustain the equilibrium against doubt.
  *   **EGT:** The "arbitrariness" is recognized by the *selection process*. If the environment changes (e.g., ownership becomes hard to detect), the strategy collapses.

  **Verdict:** The translation suggests biologists are correct to call it a convention *structurally*, but Lewis is correct that it lacks the *normative* layer. The Bourgeois strategy is a **correlated equilibrium** sustained by an external signal (ownership). It fits the *logic* of convention (arbitrary coordination on one of multiple equilibria) without the *psychology*. The translation reveals that "convention" in biology is a **selection-stable correlation**, whereas in Lewis it is a **reason-stable correlation**.

  ### 3. The Residue Report

  Here is the accounting of what survives the translation, what distorts, and what vanishes.

  #### A. Clean Translations
  1.  **Regularity $\rightarrow$ Population State:** The mapping of "everyone does X" to "frequency of strategy X is $\approx 1$" is lossless.
  2.  **Conditional Preference $\rightarrow$ Nash/ESS Condition:** The mapping of "I prefer X if you do X" to "X is a best response to X" is robust. This is the strongest bridge between the frameworks.
  3.  **Arbitrariness $\rightarrow$ Multiple Equilibria/Path Dependence:** The concept that "another solution was possible" maps cleanly to the existence of alternative ESSs with comparable basins of attraction.

  #### B. Distorted Translations
  1.  **Common Knowledge $\rightarrow$ Public Signals/Information Sets:**
      *   *The Distortion:* Lewis uses CK to solve the regress of expectations (I do it because I think you will, you will because you think I will...). In EGT, this regress is short-circuited by history. The population is *already* at the equilibrium.
      *   *Verdict:* Lewis's CK is a **stabilizing mechanism for rational agents** who could otherwise reason their way out of the equilibrium. In EGT, stability is provided by the **fitness valley** separating equilibria. The epistemic layer is replaced by a dynamic layer. This is not a loss of explanatory power for biology, but it is a loss of explanatory power for *human* normativity where reasoning allows rapid switching without genetic change.
  2.  **Precedent $\rightarrow$ Initial Conditions:**
      *   *The Distortion:* Lewis's precedent implies a history of *choices*. Replicator precedent is a history of *survival*.
      *   *Verdict:* This distorts the notion of "keeping" a convention. In Lewis, we keep a convention because we recognize its utility. In EGT, the population "keeps" it because mutants die.

  #### C. The Missing Residue (No Expression in Framework)
  1.  **Normativity (The "Ought"):**
      *   *Residue:* Lewis's account allows for the judgment that one *should* conform, even if one could get away with deviating secretly. It captures the *normative force* of convention.
      *   *EGT Status:* **Absent.** Replicator dynamics describe what *is*, not what *ought* to be. An ESS describes stability, not obligation.
      *   *Verdict:* **Your framework is missing this.** If you wish to model human social behavior where agents punish deviators (second-order selection) or feel guilt (internalized norms), standard replicator dynamics are insufficient. You need to model **norms as strategic constraints** or include **meta-strategies** (e.g., "punish those who deviate from R"). Lewis's epistemic conditions are a proxy for this normative layer; by stripping them, you gain generality across species but lose the specific mechanics of human social enforcement.
  2.  **Deliberative Switching:**
      *   *Residue:* Lewis allows that agents can reflect and collectively agree to switch from Convention A to Convention B (e.g., metric vs. imperial) without a long period of selection.
      *   *EGT Status:* **Absent.** Switching equilibria in EGT requires traversing a fitness valley (unstable intermediate states) or a massive shock to initial conditions.
      *   *Verdict:* **Lewis's scaffolding was earning its keep here.** The epistemic layer allows for **tipping points** driven by shared belief rather than shared genetics. If your models aim to capture cultural evolution or rapid social change, the pure biological framework underestimates the speed of convention change. You would need to incorporate **belief dynamics** (e.g., replicator dynamics on beliefs rather than just behaviors) to recover this.

  ### Summary Verdict

  Does the evolutionary reconstruction show convention was never epistemically loaded, or does it reveal what Lewis could see and you cannot?

  **It reveals what your framework cannot see.**

  Lewis's epistemic conditions are not merely philosophical ornamentation; they are the mechanism by which rational agents solve the **equilibrium selection problem** in real-time. In your framework, equilibrium selection is solved by **history and drift**.

  *   **Lewis:** Convention is a **solution to a reasoning problem**.
  *   **EGT:** Convention is a **solution to a stability problem**.

  For non-human animals, the EGT translation is superior; the epistemic layer is indeed superfluous baggage. The "Owner-Intruder" case is a convention *functionally*, and demanding common knowledge for a wasp is anthropomorphic error.

  However, for human social behavior (which I assume is part of your broader interest given the vocabulary of signaling and assortment), the EGT translation is incomplete. It captures the **structure** of convention (arbitrary, stable coordination) but misses the **mechanism of maintenance** (shared expectation and normative enforcement). If you treat human conventions purely as ESSs, you will fail to model phenomena like **rapid norm collapse** or **legislative coordination**, where the "common knowledge" is updated by announcement rather than by selection.

  **Recommendation:** Use the EGT translation for the *architecture* of convention (multiple equilibria, conditional stability), but recognize that for human agents, the "common knowledge" parameter must be modeled as a **dynamic variable** (public information/belief state) rather than a fixed background condition. This hybridizes Lewis's insight with your dynamics, allowing you to model both the biological roots and the cultural superstructure of social behavior.
