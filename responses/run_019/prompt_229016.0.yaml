answer: |-
  Your suspicions are well-founded. Your friend has captured the *destructive* half of Russell's argument with reasonable accuracy but has largely invented the *constructive* half. The summary presents Russell as a moral nihilist or a radical libertarian, whereas the text presents him as a utilitarian reformer.

  Here is an audit of your friend's summary, breaking down the accuracies, distortions, and the specific points you raised.

  ### 1. Accurate Representations (The Historical Critique)
  Your friend is correct regarding Russell's sociological and historical diagnosis.
  *   **Paternity and Property:** Russell does argue that the "double standard" of sexual morality (strict for women, lenient for men) was historically an economic device to ensure legitimate heirs for the transmission of private property. He views the Victorian emphasis on female chastity as fundamentally rooted in the father's desire to know which children were his.
  *   **Religious Superstition:** Russell argues that religious dogma piled onto this economic structure, transforming a property arrangement into a cosmic virtue. He contends that the church sanctified this system to maintain authority, often demonizing sex itself as "sinful" regardless of consequences.
  *   **Contraception:** Russell identifies reliable contraception as the technological pivot point. He argues that once sex is separated from procreation, the old justification for restricting sex (illegitimate children) evaporates.

  ### 2. Distortions and Overstatements (The Positive View)
  This is where your friend's summary collapses. Russell does not argue that morality becomes obsolete; he argues that the *basis* of morality must shift.

  *   **"Sexual ethics has no work left to do":** This is directly contradicted by Chapter 1, as you noted. Russell argues that we need a *new* sexual ethic, not *no* ethic. The old ethic was based on dogma and property; the new ethic should be based on **psychological health, mutual affection, and the welfare of children.** He believes people still need to behave ethically toward one another; they just shouldn't use "sin" as the metric.
  *   **"Purely private matter... state has no legitimate say":** This is the most significant distortion. Russell is not a libertarian absolutist. He explicitly carves out a massive exception: **Children.**
      *   Russell argues that while the state has no right to regulate sex between childless adults, the moment a child is born, the matter becomes of public concern.
      *   He advocates for state support for mothers and children, and he believes the state has a legitimate interest in ensuring children are raised in stable environments. He even suggests that parents who neglect their children's welfare due to sexual irresponsibility should face legal consequences.
  *   **"Neither morality... has any legitimate say":** Russell distinguishes between *law* and *public opinion*. He wants to stop public opinion from persecuting unmarried couples or adulterers *if no harm is done*, but he still believes individuals have moral obligations to be honest and caring partners. He is arguing against *social tyranny*, not against *interpersonal responsibility*.

  ### 3. Auditing Your Specific Questions

  **Does the paternity-and-property story exhaust the functions he assigns to sexual morality?**
  *   **Mostly, but not entirely.** While Russell emphasizes the economic/patriarchal origin, he also acknowledges a psychological function: the channeling of instinct to maintain social stability. However, he argues that the *specific form* this took (lifelong indissoluble marriage, chastity) was excessive and harmful. He does not think property was the *only* factor, but he views it as the dominant historical engine that religious morality served.

  **Does his critique of traditional ethics actually entail the libertarian conclusion my friend draws?**
  *   **No.** Russell's critique is utilitarian, not deontological libertarianism. He opposes traditional rules not because "freedom is a right," but because "repression causes unhappiness."
  *   Therefore, if a sexual act causes harm (e.g., spreading disease, neglecting children, psychological cruelty), Russell believes there *is* a legitimate ground for moral criticism or state intervention. Your friend's summary implies a "right to do wrong"; Russell argues for a "freedom to do what causes no harm."

  **How does he in fact treat jealousy?**
  *   Your friend simplifies this significantly. Russell does view jealousy as largely rooted in the concept of property (treating a spouse as an owned asset) and insecurity.
  *   However, he does not treat it as a "mere social convention" that one can simply switch off. He acknowledges it as a powerful, painful passion. His argument is that rational people *should endeavor* to overcome it because it poisons love, and that in a world without economic dependence, jealousy would naturally diminish. He advocates for "trial marriages" and openness not because jealousy doesn't matter, but because possessiveness kills the spontaneous affection he values. He admits this requires emotional maturity, not just intellectual assent.

  ### 4. What Would Russell Object To Most Strongly?
  If Russell read your friend's summary, his strongest objection would be to the claim that **ethics is obsolete.**

  Russell wrote *Marriage and Morals* because he was worried that the collapse of religious authority would lead to chaos *unless* a rational, humane ethic replaced it. He feared that without a new framework, people would treat each other callously.
  *   **The Friend's View:** "Do what you want; morality is dead."
  *   **Russell's View:** "Do what fosters love and minimizes harm; morality is alive but must be redefined."

  Russell would also object to the erasure of the **child**. To Russell, the child is the only valid justification for social interference in private life. Ignoring this makes his philosophy look selfish, whereas he intended it to be protective of the vulnerable.

  ### 5. Final Verdict: Does the Summary Survive Correction?
  **No.** The friend's verdict is a caricature of Russell's radicalism.

  *   **The Friend's Verdict:** Russell argues for the abolition of sexual morality and state interest in favor of total private autonomy.
  *   **The Corrected Verdict:** Russell argues for the abolition of *religious and proprietary* sexual morality, to be replaced by a *utilitarian* ethic centered on psychological health and child welfare. The state should exit the bedroom of childless adults but must enter the nursery.

  Your friend has correctly identified Russell's hammer (the critique of patriarchy and religion) but failed to identify what Russell intended to build with the rubble (a rational ethic of love and child welfare). The summary captures the *iconoclasm* of the book but misses its *humanism*.

  **Recommendation:** Tell your friend that they have summarized the first half of the book (the diagnosis) but skipped the second half (the prescription). The title of Chapter 1 is indeed the smoking gun that disproves the idea that Russell thought ethics had "no work left to do." He thought it had *different* work to do.
