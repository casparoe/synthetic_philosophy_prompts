  8.  *(Self-Correction during drafting)*: Make sure to mention that Russell distinguishes between *legal* interference and *moral* judgment. The friend conflates them. Russell thinks the state shouldn't punish, but people should still act ethically.

  9.  *(Final Review against User Prompt)*: Did I answer "does the paternity-and-property story exhaust..."? Yes. "does his critique... entail the libertarian conclusion..."? Yes. "how does he in fact treat jealousy..."? Yes. "does my friend's overall verdict survive..."? Yes.

