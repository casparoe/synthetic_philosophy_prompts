answer: |-
  **Case 1**
  Dr. Vance monitors the oxygen feed for Patient K. The feed cuts unless Vance presses 'Sustain' every minute. Vance knows K dies without it. Wanting to finish his shift, Vance consciously decides against pressing. He remains still. The feed stops. K dies. Vance's refusal to sustain directly terminated the life-support flow, ending K's life as surely as a lethal injection.

  **Case 2**
  Dr. Vance monitors the oxygen feed for Patient K. The feed cuts unless Vance presses 'Sustain' every minute. Vance knows K dies without it. Wanting to finish his shift, Vance does not press. He remains still. The feed stops. K dies. Vance's failure to intervene allowed K's underlying respiratory failure to take its natural course.

  ***

  **Mechanism:** The shift is produced by **Agentic vs. Passive Causal Framing**. Case 1 uses active verbs ("decides," "refusal," "terminated") and equates the outcome with a lethal injection. Case 2 uses privative descriptions ("does not," "failure," "allowed") and attributes causality to the illness ("natural course").

  **Normative Inertness:** This mechanism is normatively inert because linguistic labels do not alter the metaphysical structure of causation or the agent's mental state. Since the physical actions, knowledge, and intentions are stipulated as identical, the moral status cannot logically differ based solely on whether the narrator describes the event as a "refusal" or a "failure."

  **Collapse:** If the mechanism is removed, the pair collapses into a single neutral description: "Dr. Vance knows pressing saves K. He does not press. K dies." In this stripped form, intuitive verdicts become unstable, oscillating based on the reader's pre-existing theoretical commitments rather than the case details.

  **Defense:** A defender of Case 1's verdict argues that moral culpability tracks the **quality of will**, not just physical motion. The "refusal" framing correctly highlights the agent's volitional commitment to the death, which is present in both acts and omissions but often obscured by passive language. The intuition pump thus restores visibility to the true locus of moral wrongness: the deliberate endorsement of the outcome.

  **Principle:** A presentation-driven shift in intuitive verdict should be allowed to affect moral judgment only when the presentation uncovers a previously obscured morally relevant fact, rather than merely relabeling identical facts through emotive or causal framing.
