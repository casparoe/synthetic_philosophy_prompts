answer: |-
  Felix Brandt: You realize, Amara, that if your moral budget view holds water, you have effectively abolished the category of the supererogatory. You haven't refined it; you have dissolved it. If every act of heroism is merely the performance of a duty that was latent in the community, then there is no such thing as going beyond the call of duty. There is only doing what someone, somewhere, was obliged to do.

  Amara Voss: I haven't abolished the phenomenon, Felix, only the metaphysical baggage we attach to it. The act remains the same. The kidney is still donated. The child is still pulled from the ice. What changes is our understanding of the moral landscape surrounding the act. You treat duty as a fence around the individual agent. I treat it as a load distributed across the community. When a hero steps forward, they aren't leaping over a fence; they are picking up a load that was resting on all of us, but which no one else was willing to lift.

  Felix Brandt: But that distinction is crucial. If the load was resting on all of us, why was no one else blameworthy for leaving it there? In the orthodox view, I am not blameworthy for failing to dive into that frozen lake because the duty to do so was never mine to begin with. The cost was too high, the risk too great. Duty has limits grounded in reasonable sacrifice. If your view implies that the duty existed collectively, then surely it existed individually for me, merely waiting for a trigger. If I walk away, and someone else dives in, you say they discharged my duty. But if they hadn't dived, and the child died, would I be morally culpable for walking away?

  Amara Voss: That is the precise pressure point, isn't it? On my view, culpability is conditional. The duty is real, but its assignment is dynamic. If no one dives, the collective failure becomes an individual failure for everyone who could have acted. The budget of moral need—the child's life—remains unpaid. The hero prevents that collective default. By acting, they saturate the moral requirement. They make it the case that no one else is culpable. So you are right that you are not blameworthy after the fact, but not because the duty was nonexistent. You are not blameworthy because the debt was paid by another.

  Felix Brandt: This strikes me as a semantic sleight of hand. You are conflating the moral need of the patient with the moral obligation of the agent. Yes, the child needs saving. That is an objective fact. But morality is not just about states of affairs; it is about agency. To say I had a duty that was discharged by someone else implies I was in deficit until the moment they acted. But phenomenologically, that is not how it feels. I feel relief, not the relief of a debt cleared, but the relief of a danger passed that was never mine to face. If you tell me I was morally indebted to that child and a stranger paid my bill, you transform my gratitude into guilt.

  Amara Voss: And perhaps that transformation is necessary. We are too comfortable with gratitude that costs us nothing. We praise the saint because it allows us to categorize their action as exceptional, which in turn licenses our own mediocrity. If we accept that the saint did what was morally necessary, and that the necessity was ours too, then our praise must be tinged with shame. You worry that this makes morality too demanding. I worry that your view makes morality too convenient. It allows us to treat the hero's sacrifice as a gift rather than a correction of a moral imbalance we tolerated.

  Felix Brandt: But does it actually correct the imbalance? If I owe a debt, and you pay it, I am indebted to you. But if the moral law says I never owed the debt because the cost to me was too high, then I am merely grateful. Your view suggests that the hero's excellence purchases our indulgence. It implies that we are living on borrowed moral credit. But this undermines the very praiseworthiness you seek to preserve. If the hero was simply doing what was required of the community, and merely happened to be the one to do it, are they truly heroic? Or are they just the most efficient moral accountant?

  Amara Voss: They are heroic precisely because they accepted a burden that was technically shareable but practically avoided by everyone else. The voluntariness remains. I am not saying the hero was coerced. I am saying that the moral work was waiting, and they chose to absorb the cost that the rest of us evaded. The heroism lies in the willingness to actualize a latent collective duty. Your view isolates the hero, making them a moral alien who operates by different rules than the rest of us. My view integrates them. They are us, but functioning as the community's moral immune system.

  Felix Brandt: Integration comes at the price of clarity. You ask whether a duty that no one person in particular bears can still be called a duty. I say no. A duty must be actionable by an agent. If I cannot be held to account for it until someone else voluntarily takes it on, it is not a duty I hold; it is a hope I harbor. You argue that the intuition that heroes exceed obligation is an artifact of bookkeeping. I argue it is an insight into the structure of agency. We recognize supererogation because we recognize that there is a limit to what can be demanded of a person. When someone crosses that limit, we call it supererogatory not because the need wasn't there, but because the demand would have been unjust.

  Amara Voss: Unjust to whom? To the agent, certainly. But justice is also a matter of distribution. If the demand is unjust for one, it might be just for ten. The hero effectively says, I will bear the unjust demand so that the ten do not have to. But that doesn't mean the demand wasn't real. It means the hero absorbed the injustice of the situation. Your orthodox view protects the individual from the claim, but it leaves the claim itself hanging in the air, unmet. My view says the claim is met, but the cost was borne disproportionately. That is a tragedy, not a metaphysical surplus.

  Felix Brandt: I concede that there is a tragic element here that my view sometimes glosses over. We do rely on the goodness of others to make the world bearable. But if we adopt your budget view, we risk resentment. If I perceive the hero as someone who has paid my moral bill, I may feel compelled to pay them back, or worse, feel that their existence highlights my own failure. The orthodox view allows for pure gratitude. I can honor the hero without feeling that I have been let off the hook for something I was supposed to do. It preserves the integrity of my own moral standing.

  Amara Voss: But is your moral standing intact if it relies on the silence of the need? You say the duty wasn't yours because the cost was too high. But the cost was the same for the hero. They paid it. If the cost negates the duty, then the hero did nothing required. If the cost does not negate the duty, then you were in deficit. You cannot have it both ways. You want to say the hero did something wonderful that wasn't required, while simultaneously acknowledging the world was better for it. My view aligns the value of the act with the necessity of the outcome. The act was necessary. The agent was not fixed. The hero fixed themselves to the task.

  Felix Brandt: The agent is the only thing that matters, Amara. Morality is first-personal. I cannot live in your collective budget. I can only live in my own choices. When I see the hero, I see someone who chose to suffer for a good I chose not to pursue at that cost. To say they did my duty is to colonize their agency with my obligations. It diminishes their gift by calling it a payment. It diminishes my gratitude by calling it relief from liability. I want to look at the hero and see someone who gave me something I had no right to expect. You want me to look at them and see someone who took something I was trying to avoid.

  Amara Voss: And I want you to look at them and see what they really are: a mirror. They show us what the moral budget requires. If we treat them as exceptions, we can ignore the budget. If we treat them as agents who fulfilled a collective requirement, we have to ask why the requirement fell on them alone. Your view comforts the bystander. Mine honors the truth of the need. But I will concede this: if my view induces paralysis through guilt, it fails pragmatically. If telling people they are living on borrowed moral credit makes them less likely to act, then the theory is self-defeating.

  Felix Brandt: And I will concede this: if my view encourages complacency by labeling all difficult sacrifices as optional, it fails morally. We agree that the world needs more heroes. We disagree on whether calling their actions supererogatory helps produce them. I believe celebrating the surplus encourages emulation. You believe exposing the deficit compels it.

  Amara Voss: So we are left with the status of the unassigned duty. For you, a duty that cannot be pinned to a specific agent until the moment of action is not a duty at all. It is a wish.

  Felix Brandt: Exactly. Obligation requires ownership. Without ownership, there is no blame, and without the possibility of blame, there is no duty.

  Amara Voss: And for me, obligation exists wherever there is a moral deficit that agents have the capacity to fill. Ownership is secondary to the need. The duty floats until it is claimed.

  Felix Brandt: Then I suppose we have reached the bedrock. You see morality as a ledger of needs to be met. I see it as a contract of agents to be respected.

  Amara Voss: And until we agree on whether the ledger or the agent is primary, we will not agree on whether the hero is a saint or a creditor.

  Felix Brandt: Or perhaps whether the rest of us are beneficiaries, or debtors.

  Amara Voss: Precisely. And that is a difference no amount of dialogue can reconcile, only clarify.

  Felix Brandt: Then let us leave it clarified. The hero dives. The child lives. You see a balance restored. I see a gift received.

  Amara Voss: And the water remains cold, regardless of how we count the cost.
