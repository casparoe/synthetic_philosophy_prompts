answer: |-
  **I. The Endpoints**

  Behold the circle drawn upon the plane,
  A triangle inscribed within the space.
  We ask the chance a chord exceeds its side.
  Let fingers trace the rim to find two points,
  And join them with a straight and narrow line.
  Fix one vertex, let the other roam,
  Only one third of arc yields greater length.
  So one in three is here the counted chance,
  When endpoints rule the random choice we trace.
  Geometry seems clear and distinct.

  **II. The Radius**

  Behold the circle drawn upon the plane,
  A triangle inside.
  We ask the chance a chord exceeds its side,
  By new design described.
  Take any radius line you please,
  And pick a point along,
  Draw perpendicular through there,
  To make the chord belong.
  If point falls close to center point,
  The chord will stretch out wide,
  Half way along the radius,
  The chance is one in two.

  **III. The Midpoint**

  Behold the circle drawn upon the plane,
  a triangle inside.
  We ask the chance
  a chord exceeds its side,
  but look at the area.
  Choose a point anywhere
  within the disk
  to be the middle of the line.
  If the point lands in the smaller concentric ring
  near the heart the chord is long.
  The area scales as the square, one quarter is the share.

  **Envoi**

  Three answers rise from one identical phrase,
  Because "random" conceals the measure's ways.
  Indifference needs a partition defined,
  By ignorance alone it is not decided.
  The paradox lies not in geometry,
  But underdetermined uncertainty.
