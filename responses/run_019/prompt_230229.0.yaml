      *   *Alternative:* Violate Risk Neutrality/Aversion? No, prompt says "not risk-sharing". But if they have different risk tolerances, is it speculation or risk-sharing? Usually, if the underlying asset is risky, taking the other side is risk-sharing. To make it *purely speculative*, the bet must be on an event that doesn't correlate with their endowment. But even then, if they agree on probabilities, one must be wrong about EV.
      *   *Best Path:* Violate **Common Priors**. This is the standard textbook exception to No-Trade theorems. Agents are rational (Bayesian updaters), have identical *new* information, but start with different priors.

