      *   *Uncertainty:* The prompt asks for "rational agents". In some strict game-theoretic definitions, having different priors is sometimes considered a form of irrationality or "inconsistent planning" if the priors aren't derived from a common super-prior. However, in standard economic modeling (e.g., Harrison-Kreps), heterogeneous priors are the standard way to model speculation. I need to be careful about how I define "rational" here. Rationality usually means internal consistency (Bayesian updating), not necessarily having the "true" prior.
