prompt: |-
  Give a concrete example—stylized or realistic—of a purely speculative trade (not driven by risk-sharing, hedging, or liquidity needs) in which two rational agents with identical information each rationally expects the trade to have positive expected value. Identify which assumption of the standard no-trade theorem your example violates, briefly say why the theorem would forbid the trade if that assumption were restored, and draw one lesson the example suggests about what market prices can and cannot tell an outside observer. In your answer, say how confident you are in the key claims and single out the point you are least sure of.
