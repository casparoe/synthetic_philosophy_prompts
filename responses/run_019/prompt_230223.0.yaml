      2. Interaction Matrix (Brainstorming).
      3. Apparent Tensions (Dissolved).
      4. Genuine Tensions (Ranked & Analyzed).
      5. Recommendations for Revision.

      *Tone:* Collegial, precise, analytical.

      *Key Distinction to highlight:* Synchronic vs. Diachronic norms. (Crucial for D/E).
