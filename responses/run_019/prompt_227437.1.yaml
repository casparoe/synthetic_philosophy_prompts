      *   *Refining Candidate 1:* The worry is that if you have sharp boundaries for 'definitely', you lose the phenomenon of higher-order vagueness. But Williamson argues higher-order vagueness *is* just iterated ignorance. The threat is if the logic of 'definitely' collapses.
      *   *Refining Candidate 2:* If cutoffs drift, does the proposition change? Epistemicism says 'Tall' refers to a property. If usage drifts, reference drifts. This is compatible.

