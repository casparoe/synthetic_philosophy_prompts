          *   *Wait, one nuance:* The prompt says "larger share of first-generation students who did return gets flagged." This means more first-gen stayers are bothered. Is that unfair? Yes, it's a disparity in treatment. But it stems from the base rate.
          *   *Final Decision:* I will recommend **Adopt with the single calibrated threshold**, but with a specific condition/safeguard regarding the *nature* of the outreach to mitigate the FPR burden. This aligns with the mathematical truth (you can't have it all) and the ethical priority (truthful risk assessment for support).

