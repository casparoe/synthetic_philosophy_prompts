      *   *Camp 1 (Calibration):* Prioritizes "risk meaning the same thing." If a score says 80% risk, it means 80% chance of leaving, regardless of group. This supports individual accuracy/truthfulness. *Downside:* Disparate impact on errors. First-gen students who *stay* are flagged more often (stigma/resource waste). Continuing-gen students who *leave* are missed more often (missed intervention).
      *   *Camp 2 (Equalized Errors):* Prioritizes "equal burden of mistake." FPR and FNR equalized. *Downside:* Requires different thresholds. A first-gen student with risk score $X$ might be flagged, while a continuing-gen student with score $X$ is not. This violates "individual fairness" (similar individuals treated similarly) and potentially calibration (if thresholds shift, the meaning of "flagged" changes relative to the raw score).
      *   *Camp 3 (Equal Selection Rates):* Prioritizes "equal access to resources." Flag top 20% of Group A and top 20% of Group B. *Downside:* This ignores the actual risk distribution. If Group A is genuinely higher risk, limiting flags to 20% might miss high-risk students. If Group B is lower risk, flagging 20% might waste resources on low-risk students. This is essentially demographic parity in selection.
