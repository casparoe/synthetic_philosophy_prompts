prompt: |-
  Bit of background: I'm a self-taught programmer, no degree, and I help run a meetup for other self-taught devs in my city, mostly people who can code fine but bounced off math early. I got obsessed this year with Kolmogorov complexity and Solomonoff induction from messing around on my own, and I volunteered to do a 45-minute session on the idea that "prefer the simpler explanation" isn't just a rule of thumb, it actually falls out of something like a formal argument. Now I'm worried I'm going to botch it, because my own path to understanding it was super nonlinear and involved a lot of unlearning.

  I want you to act as someone who's taught theoretical CS ideas to smart non-mathematical audiences for years. Think carefully, and brainstorm a couple of candidate carrying examples before commiting to one. Then plan the session for me -- don't just explain the material at me. Specifically:

  - The order the pieces have to come in, and what depends on what. My instinct is to start with "your data is a string and a theory is a program that outputs it," but I suspect something has to be in place even before that or they'll hear it as a metaphor.
  - The one example that carries the whole talk -- probably a sequence-prediction setup, but you tell me -- and what it needs to have and what it needs to NOT have (e.g. if the pattern is too clean they'll think the point is trivial).
  - The misconceptions they'll walk in with or form on the spot: that this is just about file compression / zip size, that shortest program means fewest characters of Python, that the universal prior is something a fast enough computer could actually run, and that Occam's razor is being proved to be a law of nature rather than something subtler. For each one, tell me exactly where in the sequence to head it off, because I think some of them are fatal if they survive past a certain point.
  - What I should openly refuse to touch at this level (the incomputability stuff? machine-dependence?) and how to flag it as a deliberate skip without killing their trust.
  - One question to ask at the end that shows whether they got the actual idea, not just the compression vibes.

  Lead with the single load-bearing idea the whole session hangs on in your first sentence, then give the plan. No preamble, no restating my question back at me.
