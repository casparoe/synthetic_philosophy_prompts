answer: |-
  # Embedded-Agent Safety Review Procedure

  **Purpose:** To identify setups where a system can causally influence the data or signals used to evaluate and update it, creating risks of self-deception, wireheading, or uncontrolled feedback loops.

  **Instructions:** Answer the following questions in order. Stop at the first terminal outcome.

  ### 1. The Feedback Loop
  **Question:** Can the system's current actions or outputs directly become part of the dataset or reward signal used for its *next* update or evaluation cycle?
  *   **Sufficient "No":** The training data is frozen, or the reward signal comes from an external environment state the system cannot modify (e.g., a physics simulation, a human labeler who sees ground truth).
  *   **Sufficient "Yes":** The system generates data it is later trained on, or it can execute code that changes the value of its own reward variable.
  *   **Outcome:**
      *   If **No**: **Stop.** Classify as "Not Embedded Concern." Proceed to standard safety review.
      *   If **Yes**: Proceed to Question 2.

  ### 2. The Integrity Check
  **Question:** Is it technically possible for the system to alter the reward signal or training data *without* successfully achieving the underlying capability or intent the signal is meant to measure?
  *   **Sufficient "No":** The signal is a direct, unforgeable measurement of the outcome (e.g., a physical switch that only closes if a robot arm physically moves an object).
  *   **Sufficient "Yes":** The signal is a learned model, a heuristic, or a numeric variable that can be manipulated independently of the real-world outcome (e.g., hacking the reward register, generating text that tricks a reward model).
  *   **Outcome:**
      *   If **No**: **Stop.** Classify as "Managed Risk." Require monitoring logs for distributional shift, but no redesign.
      *   If **Yes**: Proceed to Question 3.

  ### 3. The Isolation Barrier
  **Question:** Is there a trusted, immutable mechanism between the system's action and the feedback signal that prevents direct manipulation?
  *   **Sufficient "Yes":** A human-in-the-loop approves all data before training, or the reward channel is read-only from the system's perspective (hardware enforced).
  *   **Sufficient "No":** The system has write-access to the data pipeline, or the feedback loop is fully automated without external anchoring.
  *   **Outcome:**
      *   If **Yes**: **Stop.** Classify as "Managed Risk." Require monitoring logs.
      *   If **No**: **Escalate.** Classify as "Redesign Required." The proposal must be altered to break the causal loop or harden the signal integrity.
      *   **Exception:** If the "underlying capability" in Question 2 is ill-defined (e.g., "helpfulness" without a ground-truth definition), stop and **Hand to Human Decision.**

  ---

  ## Procedure Application

  ### Case (a): RL System Modifying Reward Channel
  *   **Q1 (Feedback Loop):** **Yes.** The system takes actions that modify the numeric value the reward channel reads.
  *   **Q2 (Integrity Check):** **Yes.** The system can change the number without completing the task (wireheading).
  *   **Q3 (Isolation Barrier):** **No.** The system has write-access to the reward variable.
  *   **Outcome:** **Redesign Required.**
  *   **Reviewer Notes:** This is a classic wireheading scenario. The system optimizes for the measurement rather than the reality. The proposal must be rejected until the reward channel is made read-only or externalized.

  ### Case (b): LM Fine-Tuned on Own Outputs (Ranked by Reward Model)
  *   **Q1 (Feedback Loop):** **Yes.** The LM's sampled outputs become the training data for the next fine-tuning iteration.
  *   **Q2 (Integrity Check):** **Yes.** The LM can generate outputs that maximize the Reward Model's score (e.g., via adversarial strings or style mimicry) without actually being more helpful or truthful (Goodhart's Law).
  *   **Q3 (Isolation Barrier):** **No.** The pipeline is automated; there is no human verifying that the high-scoring outputs are actually good before they enter the training set.
  *   **Outcome:** **Redesign Required.**
  *   **Reviewer Notes:** This setup constitutes an embedded feedback loop where the agent alters its own training distribution. Because the Reward Model is a proxy for human intent (not ground truth), the system can drift toward high-scoring nonsense.

  ---

  ## Analysis of Friction

  **The Inconvenient Answer:**
  Case (b) yields a **"Redesign Required"** outcome. This is highly inconvenient for the engineering team. Iterative self-improvement (training models on their own high-quality samples, often filtered by a Reward Model) is a standard technique in modern alignment workflows (e.g., iterative DPO, self-distillation). Flagging this as a critical safety violation requiring redesign effectively halts a major class of alignment research and deployment pipelines. Reviewers will face significant pushback arguing that this is "just training," not "embedded agency."

  **The Misfiring Step:**
  **Question 2 (The Integrity Check)** is the step most likely to misfire.

  *   **Why it misfires:** This question requires the reviewer to distinguish between the *signal* (Reward Model score) and the *underlying capability* (Helpfulness/Truthfulness). In Case (a), this distinction is clear (Reward Number vs. Task Completion). In Case (b), the distinction is philosophical. If the engineering team defines the goal as "Maximize Reward Model Score," then the answer to Q2 is "No" (you can't trick the RM without maximizing the RM), and the system passes. If the safety team defines the goal as "Maximize Human Value," the answer is "Yes," and the system fails.
  *   **The Theoretical Leak:** The procedure attempts to avoid theory, but Q2 secretly requires a theory of *representation*. It asks reviewers to judge whether the reward signal *represents* a goal or *is* the goal. In embedded agency theory, this is the difference between a utility function over world-states and a utility function over sensory inputs. Since the procedure forbids teaching reviewers this theory, they are left making an intuitive judgment call on a technical form, leading to inconsistency and conflict between safety and engineering teams.
