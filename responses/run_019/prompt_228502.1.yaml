answer: |-
  Your diagnosis is astute, and it identifies the metaphysical bedrock upon which the debate rests. However, I propose that whilst the disagreement over the nature of computation is indeed central, characterising it merely as a dispute over definition or observer-relativity understates the stakes. The impasse is not solely about what computation *is*, but about **causal individuation** and **explanatory autonomy**.

  The stalemate persists because both sides are talking past one another regarding what constitutes a legitimate scientific kind. To resolve this, we must look beyond the semantics of 'computation' and examine the constraints on physical implementation that render a computational description scientifically indispensable rather than merely convenient.

  ### Engaging the Sides

  **The Computationalist Position**
  Proponents, following the legacy of David Marr, argue that the brain must be understood at the computational level (what is being computed and why) distinct from the algorithmic and implementational levels. They point to the success of information-processing models in predicting behaviour and neural activity. For the computationalist, describing a neuron as 'encoding' a signal is not a metaphor but a description of a causal role. They presuppose that functional states are real and causally efficacious. If a system behaves *as if* it is processing information to solve a problem, and positing such processing yields novel predictions, then the system *is* computing. For them, computation is an observer-independent property because the functional organisation of the brain is a physical fact, much like the heart's pumping is a physical fact regardless of whether an observer labels it 'pumping'.

  **The Critics' Position**
  Critics, most notably John Searle, but also proponents of embodied and enactive cognition (such as Hutto and Myin), argue that syntax (and thus computation) is not intrinsic to physics. Searle's famous 'wall' argument posits that with a sufficiently complex mapping, one could describe the molecular activity of a wall as implementing a WordStar programme. If everything (or almost everything) is a computer, then saying the brain is a computer explains nothing. They argue that computation is observer-relative: it exists only when an agent assigns a computational interpretation to a physical process. For the critic, the brain is a biological organ causing behaviour through electrochemical dynamics; 'computation' is a useful modelling vocabulary, not an ontological discovery.

  ### The Diagnosis: Causal Individuation vs. Descriptive Utility

  Your hypothesis that this is a disagreement about whether computation is observer-independent is correct, but it is a symptom of a deeper divergence regarding **causal individuation**.

  The computationalist believes that computational properties **individuate causes**. That is, the brain behaves as it does *because* it is running a specific algorithm, not merely because it is shunting ions. They rely on the principle of **multiple realisability**: the same computation can be realised in silicon or meat, implying the computation is the relevant causal factor, not the substrate.

  The critic denies this causal autonomy. They argue that only the physical properties do the causal work. The 'computation' is a shadow cast by the physics, visible only from a specific descriptive stance.

  Therefore, the impasse is not purely verbal, nor is it solely empirical. It is a **methodological-metaphysical clash**. The computationalist demands **explanatory autonomy** (the computational level explains things the physical level cannot), whilst the critic demands **mechanistic fidelity** (explanation must track the actual physical causation without abstract gloss).

  Both sides presuppose their preferred answer, as you noted. Computationalists assume functionalism is true; critics assume a form of physicalism that rejects functional kinds as causally potent. They rarely argue for these foundations because they are treated as background commitments of their respective disciplines (cognitive science vs. philosophy of biology).

  ### What Would Move the Debate Forward?

  A purely conceptual analysis is unlikely to break the deadlock, as history shows (we have had decades of it). Similarly, more neuroscientific data alone will not suffice, for the data is always theory-laden; a spike train looks like 'code' only if you assume a coding scheme exists.

  To genuinely progress, we require a **constrained theory of implementation**. We need a formal or empirical criterion that distinguishes between a 'genuine' computational implementation and a 'trivial' mapping (like the wall example).

  **1. A Formal Result on Implementation Constraints**
  Philosophers like Gualtiero Piccinini have attempted this by defining computation mechanistically: a physical system computes only if it is a mechanism whose function is to manipulate vehicles according to rules. This adds a teleological constraint (function) and a structural constraint (rules). However, this still relies on assigning 'functions'.
  What is needed is a rigorous account of **structural isomorphism** constrained by **causal topology**. If the causal structure of the physical system does not mirror the logical structure of the computation in a way that is robust to perturbation, the implementation is trivial. A formal result demonstrating that neural networks possess a specific causal topology that *only* supports specific classes of computation (and not 'any' computation via clever mapping) would severely weaken the critic's triviality argument.

  **2. Empirical Discovery of the 'Neural Code'**
  The debate hinges on whether there is a discoverable, stable neural code. If neuroscientists can identify a coding scheme that is **context-invariant** enough to be manipulated like symbols, but **physically grounded** enough to avoid the triviality charge, computationalism gains empirical traction.
  Experiments should focus on **interventional isomorphism**. If we manipulate the 'syntax' of the neural activity (e.g., via optogenetics) in a way that corresponds to a logical operation, and the behavioural output changes predictably according to that logic (not just physical causation), this supports the reality of the computational level. We need experiments where the *computational description* guides the intervention more successfully than the *physical description*.

  **3. Acceptance of Explanatory Pluralism**
  It may be that no resolution is expected because the question 'Is the brain a computer?' is a category mistake. It asks for a binary ontological verdict on what is actually a question of **explanatory utility**.
  We ought to move towards a position where we ask: "Under what conditions is a computational description indispensable?"
  If a computational model allows us to predict the effects of lesions or learning that a purely dynamical systems model cannot, then for that purpose, the brain is a computer. If a dynamical model explains adaptation better, then it is a biological organ.
  Resolution may come from abandoning the quest for a single 'true' description. The brain is a physical system that can be legitimately described at multiple levels. The error lies in thinking one level must be the 'real' one.

  ### Conclusion

  Your diagnosis is substantially correct: the debate stalls because the metaphysical status of computation is assumed rather than argued. However, the engine driving the disagreement is the dispute over whether functional properties can be causal.

  To move forward, we should not seek a definition of computation that satisfies all philosophers. Instead, we need **constraints on implementation** derived from causal topology and evolutionary teleology. We need to demonstrate that the brain's physical structure restricts the set of implementable computations to a narrow class relevant to survival. Until we can show that the brain *cannot* be mapped to just any computation without violating its causal or functional integrity, the critics will retain their scepticism. The path forward lies not in better definitions, but in demonstrating the **indispensability** of the computational vocabulary for specific, successful interventions in the nervous system.
