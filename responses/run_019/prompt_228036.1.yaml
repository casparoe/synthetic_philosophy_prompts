          *   **Branching Time (Ockhamism vs. Peirceanism):** They don't explicitly use the semantic frameworks (Supervaluationism, Branching Time) that modern logic uses to solve this.
          *   **Eternalism vs. Presentism:** The metaphysics of time is the elephant in the room. If the future exists (Eternalism), Dan wins. If only the present exists (Presentism), Ola has a better shot.
          *   **Aristotle's Actual View:** Aristotle might not have denied bivalence entirely but rather denied that the *mode* of truth is necessary.

