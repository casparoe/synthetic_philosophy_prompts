answer: |-
  ### Exam Question: Realism in Interpretability

  **Time Allowed:** 2 Hours
  **Total Marks:** 25

  **Prompt:**
  Interpretability research often oscillates between two extremes: the *instrumentalist* view (features are useful fictions for human understanding) and the *realist* view (features are genuine components of the model's cognitive architecture). Consider the following two hypothetical results from interpretability papers:

  1.  **The Random Probe:** Researchers take a transformer model with completely random, untrained weights. They train a linear probe on the model's activations to decode a linguistic property of the input (e.g., whether a sentence is in the past tense). The probe achieves accuracy significantly above chance.
  2.  **The Unstable Dictionary:** A separate team applies a Sparse Autoencoder (SAE) to a *trained* model. They find that the inventory of features extracted changes substantially depending on the sparsity penalty and dictionary size chosen. A feature corresponding to "past tense" appears at high sparsity but vanishes or merges with "future tense" at low sparsity.

  Write an essay evaluating the ontological status of "representations" in these cases. **You must take a definite position on at least one of the two hypotheticals.** Does the Random Probe result imply the untrained network represents tense? Does the instability in the SAE result imply there is no fact of the matter about what features the trained network contains?

  In your answer, distinguish between information being *decodable* from activations versus information being *used* by the network. Defend your position by articulating what criteria (e.g., causal role, robustness, functional isolation) would be necessary to warrant a realist claim about neural network representations, drawing on general principles of representation in cognitive science.

  ***

  ### Model Answer

  The tension between interpretability as discovery and interpretability as projection hinges on the criteria for representation. A robust realism about neural network features cannot rest merely on the decodability of information from activations, nor can it be dismissed entirely due to methodological sensitivity. To determine when a network *itself* represents a concept, we must distinguish between the presence of information and the functional role that information plays in the system's computation.

  Regarding the **Random Probe** hypothetical, a realist claim is unwarranted. High probe accuracy on untrained weights demonstrates only that the input data contains linearly separable information regarding tense, or that the probe itself is capable of learning the mapping from input to label using the random projections as a high-dimensional basis. It does not demonstrate that the network *represents* tense. In classical cognitive science, representation is not merely a correlation between state and world; it requires a causal role. For a state to represent "past tense," that state must be invoked by the system to influence downstream processing—such as selecting the correct verb form or answering a query about time. In the random network, the "tense information" is causally inert. The network does not use this structure to compute its output; the structure is a byproduct of the input geometry mapped through random matrices. To claim the network represents tense here is to confuse the map (the probe) with the territory (the network's computational mechanism). The philosopher's suspicion of "sophisticated curve-fitting" is correct in this instance: the probe is fitting the input, not discovering the model's internal semantics.

  The **Unstable Dictionary** hypothetical presents a deeper challenge to realism, but one that does not necessitate instrumentalism. The fact that feature inventories shift with hyperparameters suggests that features are not atomic, pre-existing entities waiting to be counted, like particles in a box. However, this does not imply there is *no* fact of the matter about the network's computations. Rather, it suggests that features are approximate descriptions of a continuous, high-dimensional vector space. The variability indicates that our *tools* for carving nature at its joints are imperfect, not necessarily that the joints do not exist.

  To defend realism here, we must shift the criterion from *existence* to *causal efficacy*. A feature is real if intervening on it produces predictable changes in behavior. If activating the "past tense" feature in the trained model consistently shifts the model's output toward past tense completions (via activation patching or steering), then the feature has a causal role, regardless of whether the SAE dictionary splits or merges it based on sparsity. The instability of the SAE inventory is a measurement problem, not necessarily an ontological one. If multiple different decompositions yield features that support the same causal interventions, we have grounds for realism.

  Therefore, the distinction between decodability and usage is the critical boundary for representation. Decodability is necessary but insufficient; it shows information is present in the activation vector. Usage (causal mediation) is sufficient to show the information is part of the network's algorithm. In the Random Probe case, we have decodability without usage. In the Unstable Dictionary case, we potentially have both, obscured by measurement noise.

  I argue for a **causal-realist position**: a network represents a concept if and only if there exists an activation subspace that carries information about that concept *and* manipulating that subspace systematically alters the model's behavior in semantically coherent ways. This avoids the ML student's error of treating any correlational pattern as a representation, and the philosopher's error of demanding a level of symbolic discreteness that connectionist systems may not possess. Representations in neural networks are likely fuzzy and overlapping, but they are not fictional if they bear the weight of causal intervention.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Analysis of the Random Probe (Decodability vs. Presence)**
  *   **Marks:** 5
  *   **Requirement:** Explicitly argues that probe accuracy on random weights reflects input structure or probe capacity, not network representation.
  *   **Mediocre Fumble:** Treats high probe accuracy as sufficient evidence that the network "knows" or represents the linguistic property.

  **2. Distinction Between Information Presence and Causal Usage**
  *   **Marks:** 5
  *   **Requirement:** Clearly distinguishes between information being *decodable* from a state versus that state being *used* downstream to compute outputs.
  *   **Mediocre Fumble:** Conflates the existence of an activation pattern with the network's functional use of that pattern.

  **3. Analysis of SAE Instability (Ontological Vagueness)**
  *   **Marks:** 5
  *   **Requirement:** Addresses whether hyperparameter sensitivity disproves realism or merely indicates measurement imprecision/approximation.
  *   **Mediocre Fumble:** Dismisses the features as "just matrix multiplication" or "fake" solely because the inventory changes, without analyzing why.

  **4. Proposal of Realist Criteria (Causal/Functional)**
  *   **Marks:** 5
  *   **Requirement:** Proposes a specific criterion for warranted realism (e.g., robustness across methods, successful causal intervention/patching).
  *   **Mediocre Fumble:** Remains agnostic ("it depends on your definition") without arguing for a specific operational definition of representation.

  **5. Integration of Cognitive Science Concepts**
  *   **Marks:** 5
  *   **Requirement:** Applies general concepts of representation (causal role, function, misrepresentation, or content) to the NN context without needing specific author name-drops.
  *   **Mediocre Fumble:** Treats neural networks as entirely *sui generis*, failing to connect the problem to broader philosophical debates about mental representation.
