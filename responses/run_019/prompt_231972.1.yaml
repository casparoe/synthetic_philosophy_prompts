      *   Knowing the other sock $\rightarrow$ Correlation.

  4.  **Identifying the Breakdown (The Crucial Part):**
      *   *The "One Setting" Trap:* The sock analogy assumes only one way to measure (look at the sock).
      *   *The "Choice" Factor:* In Bell tests, Alice and Bob choose *angles* (settings $a$ and $b$). Socks don't have angles. You can't look at a sock "at 30 degrees."
      *   *The "Pre-determination" Factor:* Socks are definitely Left or Right *before* opening. QM says the state is undefined (superposition) until measured *relative to the chosen axis*.
      *   *The Math:* Bell's Inequality is a constraint on correlations *across different settings*. Socks satisfy the inequality trivially. QM violates it.

