      *   *Scenario:* A pair of socks (Left/Right) is packed. One goes to Alice, one to Bob.
      *   *Measurement:* Alice opens her box. She sees "Left". She instantly knows Bob has "Right".
      *   *Claim:* This explains correlation without communication.
      *   *Bell's Point:* This works for *one* setting (opening the box). It fails when Alice and Bob can choose *how* to look (e.g., polarizer angles).

  3.  **Drafting the Correspondence Table:**
      *   Socks $\rightarrow$ Particles (photons/electrons).
