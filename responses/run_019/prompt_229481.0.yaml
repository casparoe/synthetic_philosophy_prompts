answer: |-
  Your diagnosis is substantially correct, but it requires sharpening to capture why the impasse is so resistant to standard policy analysis. You have identified the normative and counterfactual layers, but the deadlock is deeper: it is an **ontological-instrumental** disagreement masquerading as a purely empirical one.

  The dispute is not merely about *which* data counts (evidentiary), nor solely about *what* we want (normative). It is about *what the phenomenon is* (ontological) and *how law interacts with it* (instrumental). Because the two camps define the fundamental nature of "prostitution" differently, they generate incommensurable empirical predictions that no amount of cross-sectional data can reconcile.

  Here is an assessment of the disagreement's structure, grounded in the claims and concessions of the opposing literatures, followed by concrete proposals for progress.

  ### 1. Assessment: The Three Layers of the Deadlock

  Your hypothesis identifies the normative prior and the counterfactual baseline. I argue there is a third, antecedent layer: ontology.

  #### A. The Ontological Disagreement (The "What")
  This is the load-bearing structure underneath the empirical dispute.
  *   **Abolitionist/Nordic Camp:** Ontologically defines prostitution as *violence* or *subordination*. Even if a transaction appears consensual, the structural power imbalance renders true consent impossible or irrelevant.
      *   *Claim:* The harm is inherent to the exchange.
      *   *Concession:* They often concede that some individuals report satisfaction or agency, but frame this as "false consciousness," survival strategy, or a privileged exception that does not invalidate the structural rule.
  *   **Sex Work/Decriminalization Camp:** Ontologically defines prostitution as *labor* or *service*.
      *   *Claim:* The harm is extrinsic, caused by stigma, criminalization, and lack of labor rights.
      *   *Concession:* They concede that exploitation and trafficking exist within the industry but argue these are crimes *against* sex workers, not inherent *to* sex work.

  **Why this stalls empirical debate:** If Group A believes the act *is* the harm, then a reduction in the *volume* of transactions is a success metric (even if safety per transaction remains static). If Group B believes the *conditions* are the harm, then an increase in volume coupled with increased safety is a success metric. When both sides cite "reduced harm," they are measuring different variables.

  #### B. The Counterfactual Baseline (The "Compared to What")
  You are correct that baselines are mismatched, but the distortion is more specific than "ideal vs. real." It is a **temporal and contextual mismatch**.
  *   **Nordic Proponents:** Often compare the *long-term cultural goal* of the Nordic model (a society with reduced demand) against the *short-term operational reality* of legalization (e.g., Germany's red-light districts). They treat the disruption caused by criminalizing buyers as a temporary cost for a long-term gain.
  *   **Decriminalization Proponents:** Compare the *immediate safety outcomes* of decriminalization (access to police, health services) against the *immediate dangers* of criminalization (violence, stigma). They treat the market size as morally neutral or secondary to worker safety.

  **The Empirical Consequence:** When a study shows the Nordic model drives sex work underground, Nordic proponents may cite this as evidence of *deterrence* (success), while Decrim proponents cite it as evidence of *increased vulnerability* (failure). The same data point confirms both theories because the baseline expectation of where sex work *should* be differs.

  #### C. The Epistemological Disagreement (The "How We Know")
  This is where the "methodologically compromised" accusations arise.
  *   **Nordic Camp:** Tends to rely on macro-level data (trafficking estimates, prevalence rates) and police records. They prioritize the perspective of the "exit" (former workers) to define the experience of the work.
  *   **Decrim Camp:** Tends to rely on micro-level data (worker surveys, ethnographic engagement) and health outcomes. They prioritize the perspective of the "current" worker.

  **The Impasse:** Each side views the other's primary data source as biased. Nordic proponents argue current workers are coerced into saying they are happy; Decrim proponents argue former workers have an incentive to narrate a trauma story to access support services, or that police data reflects enforcement priorities rather than prevalence.

  ### 2. Will Better Data Resolve This?

  **No.** A "perfect" dataset would not settle this because the disagreement is not primarily about the *values* of the variables, but the *definition* of the variables.

  If you produced a study proving that the Nordic model reduces the total number of sex acts by 20% but increases the homicide rate per sex act by 10%, the camps would simply retreat to their normative priors:
  *   **Nordic:** "We reduced the scale of exploitation. The violence is a regrettable transition cost."
  *   **Decrim:** "You sacrificed individual safety for a moralistic reduction in volume."

  Therefore, the expectation that the debate will resolve through better causal identification (e.g., a perfect natural experiment) is misplaced. The disagreement is **incommensurable** at the level of ultimate ends.

  ### 3. Concrete Paths for Progress

  If the debate cannot be "settled," it can be **managed** or **reframed** to produce useful policy knowledge. Progress requires moving away from "Which Regime is Best?" toward "Which Mechanisms Mitigate Specific Harms?"

  Here are three concrete shifts in research design and conceptualization that would constitute progress:

  #### A. Disaggregate "Trafficking" from "Migration" and "Exploitation"
  The most contentious empirical claim is that legalization increases trafficking. This metric is currently unusable because "trafficking" is often conflated with consensual irregular migration for sex work.
  *   **Progress:** A study design that strictly separates *coerced* trafficking (force/fraud) from *consensual* migration for sex work.
  *   **Metric:** Instead of "Trafficking Rates," measure "Incidence of Contract Violation" or "Freedom of Movement." This allows both sides to agree on measuring coercion without agreeing on the morality of the transaction.

  #### B. Shift from Regime Comparison to Mechanism Analysis
  Country-level comparisons (Sweden vs. Germany vs. NZ) are confounded by culture, welfare state capacity, and policing norms. A Swedish street market is not comparable to a German brothel market solely due to law.
  *   **Progress:** Stop comparing *regimes* and start comparing *institutional mechanisms*.
  *   **Study Design:** Quasi-experimental designs that look at specific policy levers across jurisdictions regardless of the overarching regime. For example:
      *   Does access to justice (ability to report violence without arrest) correlate with reduced violence, regardless of whether buying is legal?
      *   Does third-party involvement (working for a manager) correlate with exploitation, regardless of whether that third party is licensed?
  *   **Why this helps:** It bypasses the ontological fight. Both sides want to reduce violence. Identifying that "ability to screen clients without fear of police confiscation" reduces violence is a finding both sides can utilize, even if they disagree on the ultimate goal.

  #### C. Participatory Epistemology (The "Nothing About Us Without Us" Standard)
  The current stalemate is fueled by each side accusing the other of ignoring the subjects' voices.
  *   **Progress:** Adopt a standard where sex worker-led organizations are co-investigators, not just subjects, in safety studies.
  *   **Metric:** Consensus on a "Safety Index" defined by current workers.
  *   **Why this helps:** It forces the Abolitionist camp to engage with the stated preferences of current workers as data, not just as false consciousness. It forces the Decrim camp to engage with workers who *want* to exit as a legitimate policy demand. It moves the debate from "What is done to them" to "What do they report."

  ### 4. Conclusion: Expectation Management

  You should expect the **macro-debate** (Nordic vs. Legalization vs. Decrim) to stay stalled. It is a proxy war for broader cultural conflicts regarding gender, sexuality, and the role of the state. The normative priors are too strong to be moved by data.

  However, you can make a doctoral contribution by demonstrating that the **micro-debate** is solvable. If your dissertation can show that specific *mechanisms* (e.g., decoupling immigration enforcement from labor inspections, or allowing collective bargaining) improve safety metrics regardless of the overarching legal regime, you bypass the ontological deadlock.

  **Your diagnosis is correct:** The empirical dispute is not load-bearing; it is a symptom of the normative/ontological split.
  **Your implication is correct:** More of the same studies will not settle it.
  **The modification:** Progress is possible, but only by abandoning the question "Which regime is best?" and asking "Which specific legal mechanisms reduce specific harms for specific subgroups?" This does not solve the moral disagreement, but it renders it less relevant to immediate harm reduction.
