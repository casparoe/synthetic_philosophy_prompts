      *   *Is it evidentiary/methodological?* Yes. Selection bias, hidden populations, definition of "trafficking."
      *   *Is it conceptual?* Yes. What counts as "coercion"? What counts as "sex work" vs. "trafficking"?

      *   *Synthesis:* It's a **theory-laden empirical dispute**. The normative framework dictates *which* empirical questions are asked and *how* data is interpreted. This aligns with the user's hypothesis but needs nuance. It's not *just* baselines; it's about ontology (what is sex work?) and epistemology (how do we know?).

  4.  **Analyze the "Sides" (Claims and Concessions):**
