          *   View 1 (Constitution View): Statue $\neq$ Lump (different persistence conditions; lump survives squashing, statue doesn't).
          *   View 2 (Identity View): Statue $=$ Lump (one object, two names).
      *   *Tables vs. Particles:*
          *   View 1 (Realism): Tables exist as composite objects.
          *   View 2 (Nihilism/Eliminativism): Only simple particles exist arranged "tablewise."

  4.  **Drafting the Correspondence Table:**
      *   Need to map elements of the Glass Case to the Ontological Case.
      *   *Rows:* Physical state, Propositions, Truth conditions, Practical consequence, Underlying reality.
