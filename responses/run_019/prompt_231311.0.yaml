      *   *Cost/Benefit:* "Half-full" vs. "Half-empty" has no theoretical cost. Choosing "Tables exist" vs. "No tables" has massive ripple effects on logic, physics, and semantics.
      *   *Paraphraseability:* You can easily translate "half-full" to "half-empty." Can you easily translate "The statue was destroyed" into "The lump remains but is no longer statue-arranged" without loss? (Sometimes yes, sometimes no).
      *   *Normativity:* One phrasing might be *better* in context (optimism vs. pessimism). In ontology, one view might be *truer* or more *fundamental*.

