      *   *Refinement:* Need to ensure the "Substantive vs. Verbal" column is used wisely. Some disagreements might be partly verbal (e.g., definition of "principle").
      *   *Refinement on Polarity:* This is the biggest metaphysical split. Generalists usually argue pain is *always* a pro tanto reason against, even if outweighed. Particularists say in surgery, it's not a reason against at all (or is a reason for healing). I need to phrase this carefully.

  5.  **Drafting Section 3 (Remaining Disagreement):**
      *   *Goal:* Identify the "Load-Bearing" issues.
      *   *Selection:* Polarity and Codifiability are usually the core. Education often follows from these.
      *   *Falsification Conditions:* What would change a mind?
          *   For Generalist: If every attempt to codify leads to vacuous ceteris paribus clauses.
          *   For Particularist: If a finite set of principles successfully predicts novel cases better than intuition.
      *   *Concessions:* Be specific.

  6.  **Review and Refine:**
      *   *Check Tone:* Is it too aggressive? Too soft? Needs to sound like philosophers who respect each other but disagree deeply.
      *   *Check Constraints:* Did I cover all specific examples requested (pain, humiliation)? Did I cover all specific table rows? Is the preamble clear on context sensitivity?
      *   *Self-Correction on "Pro Tanto":* In Section 1, I need to make sure they agree on the *distinction* even if they disagree on the *application*. They agree the concepts exist, just not which one describes reality.
      *   *Self-Correction on Preamble:* Make sure to explicitly state that Generalists *do* acknowledge context (via weighting or exception clauses), otherwise it's a strawman.

  7.  **Final Polish:** Check formatting (headers, numbered lists, table structure). Ensure the language is precise (e.g., "valence," "holism," "atomism," "codifiability").

  *(Self-Correction during drafting Section 2)*: For the "Default Reasons" row, I need to be careful. A particularist might accept "defaults" as empirical generalizations, while the generalist sees them as normative principles. I should highlight that distinction.
  *(Self-Correction during drafting Section 3)*: Make sure I don't solve the problem. The prompt says "Do not resolve the dispute."

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # JOINT STATEMENT ON THE STRUCTURE OF MORAL REASONS
  **An Adversarial Collaboration between a Moral Particularist and a Moral Generalist**

  ## PREAMBLE

  We, the undersigned, have engaged in a semester-long dialectical exchange regarding the nature of moral reasons and the possibility of moral principles. This document records the points of convergence and the precise locus of our remaining disagreements.

  **On the Characterization of Positions**
  The **Moral Generalist** maintains that morality is fundamentally principled. On this view, the normative status of an action is determined by its relationship to general truths (principles) that hold across contexts. A feature's status as a reason is grounded in its subsumption under these principles. The Generalist holds that without such principles, moral thought would lack coherence, communicability, and justification.

  The **Moral Particularist** maintains that morality is fundamentally contextual. On this view, the normative status of an action is determined by the specific configuration of features in a situation, not by their subsumption under exceptionless or ceteris paribus laws. A feature's status as a reason is sensitive to the holistic context in which it appears. The Particularist holds that the attempt to codify morality into principles distorts moral phenomenology and misrepresents the nature of moral competence.

  **On the Scope of the Debate**
  We explicitly agree on what this debate is *not* about.
  1.  **Context Sensitivity:** We both agree that context matters. The Generalist does not claim that circumstances are irrelevant; rather, they claim circumstances affect the *weight* of reasons or trigger *exception clauses* within principles. The Particularist claims circumstances affect the *very existence* or *valence* of reasons.
  2.  **Moral Realism:** We bracket the question of whether moral truths are mind-independent. Both views are compatible with realism or constructivism.
  3.  **Action Guidance:** We both agree that agents ought to do what is right. We disagree on whether knowing what is right requires grasping a principle.

  We agree that the core dispute concerns **Holism vs. Atomism** regarding reasons, and the **Codifiability** of moral truth. The following sections detail our shared commitments and our structured disagreements.

  ***

  ## SECTION 1: AGREED CLAIMS

  The following propositions are endorsed by both parties. Each claim represents a substantive commitment that either party might have reasonably rejected prior to this collaboration, but which we now accept as necessary constraints on any adequate moral theory.

  1.  **The Variability of Phenomena:** Any adequate theory must account for the fact that the normative significance of a natural feature varies across cases without implying that the feature is irrelevant.
      *   *Example:* The fact that an act causes physical pain is a reason against the act in a case of torture; it is not a reason against (or is silenced) in a necessary medical procedure; and it may be a reason *for* the act in a consensual endurance practice.
      *   *Example:* The fact that an agent takes pleasure in an act is a reason for the act in cases of benign enjoyment; it is a reason against the act when the pleasure is taken in another's humiliation.
  2.  **Contributory vs. Overall:** Both parties accept the distinction between *contributory reasons* (considerations that count in favor of or against an action) and the *overall verdict* (what ought to be done all-things-considered). A feature can be a reason for an act even if the act is ultimately wrong.
  3.  **Pro Tanto vs. Prima Facie:** Both parties accept the conceptual distinction between a *pro tanto* reason (a reason with invariant valence that retains its force even when outweighed) and a *prima facie* reason (a reason that has a default valence but may lose its status as a reason entirely in specific contexts). We disagree on which model best describes reality, but we agree these are distinct logical categories.
  4.  **Invariant vs. Default:** We agree there is a distinction between a feature that is *invariantly* a reason (always counts in the same direction) and a feature that is *merely treated as a default* (usually counts in a direction due to statistical regularity or presumption, but lacks metaphysical fixity).
  5.  **Explanation vs. Restatement:** We agree that a moral principle must do more than restate a verdict. To say "Act X is wrong because it falls under Principle P" is explanatory only if P provides information independent of the verdict on X. A principle that merely says "Do what is right" is vacuous.
  6.  **Methodological Constraint (The Complexity Limit):** The Generalist concedes that if the only way to save a principle is to add an infinite number of *ceteris paribus* clauses or exception conditions that effectively list every possible case, the formulation ceases to function as a principle and becomes a gerrymandered summary.
  7.  **Methodological Constraint (The Error Possibility):** The Particularist concedes that if moral competence consistently correlates with the ability to articulate and apply systematic rules, and if learners fail systematically when denied such rules, this constitutes evidence against strong particularism.

  ***

  ## SECTION 2: DISAGREEMENTS TABLE

  | Issue | Particularist Formulation | Generalist Formulation | Substantive or Verbal? | The Crux | Concrete Case / Argument & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Polarity of Reasons** | **Holism of Reasons:** A feature (e.g., causing pain) can change its *valence* (polarity) depending on context. In surgery, pain is not a reason against; it may be a reason for (as part of healing). | **Atomism of Reasons:** A feature has a fixed *valence*. Pain is always a *pro tanto* reason against. In surgery, it remains a reason against but is overwhelmingly outweighed by the reason for health. | **Substantive.** This is not merely about weight. It is about whether the feature contributes negative force in all contexts or no force/positive force in some. | **Intrinsic Normativity:** Is the normative force intrinsic to the feature itself, or does it arise from the configuration of the whole situation? | **Case:** Sadistic Pleasure.<br>**Particularist:** In sadism, pleasure is a reason *against* the act. In benign joy, it is a reason *for*. Polarity flips.<br>**Generalist:** Pleasure is always a reason *for*. In sadism, the *object* of the pleasure (humiliation) provides a massive counter-reason. The pleasure's valence remains positive. |
  | **2. Default Reasons** | **Heuristic Defaults:** "Default reasons" are psychological generalizations about how agents usually react. They have no normative standing independent of the case. Calling lying a "default wrong" is a shorthand for "lying is usually wrong." | **Principled Defaults:** "Default reasons" reflect a standing normative principle. Lying is *prima facie* wrong. The burden of proof lies on the agent to justify the exception. The default has normative force, not just statistical frequency. | **Partly Verbal / Partly Substantive.** Verbal: What we mean by "default." Substantive: Whether the burden of proof is metaphysical or epistemic. | **Normative Force:** Does the "default" status exert a pull on the agent even when the verdict goes the other way, or is it merely an epistemic shortcut? | **Case:** Lying to save a life.<br>**Particularist:** The lie is simply right. The "wrongness of lying" does not linger as a remainder.<br>**Generalist:** The lie is overall right, but there is a "moral residue" or regret because a *prima facie* duty was infringed, even if justified. |
  | **3. Codifiability** | **Uncodifiability:** No finite set of true principles can cover the moral terrain. Any attempt to codify will either be false (due to exceptions) or vacuous (due to "unless circumstances require" clauses). | **Codifiability:** In principle, the moral truth can be captured in a finite set of principles. Complexity does not imply uncodifiability. A principle with *ceteris paribus* conditions is still a principle if the conditions are specifiable. | **Substantive.** Turns on the definition of "principle" and the limits of human language/cognition regarding infinite contexts. | **The Exception Clause:** At what point does adding an exception clause turn a principle into a disguised list of cases? | **Case:** The "Unless" Game.<br>**Particularist:** For every principle offered (e.g., "Do not lie"), I can construct a case where it fails. You will add "unless..." until the principle is longer than the list of cases.<br>**Generalist:** I can posit a higher-order principle that governs the exceptions (e.g., "Maximize well-being"). The base principle need not list every exception. |
  | **4. Moral Knowledge** | **Perceptual Model:** Competent judgment is a form of moral perception or sensitivity to the particular. It does not require conscious or unconscious subsumption under a major premise. | **Subsumption Model:** Competent judgment involves (implicitly or explicitly) subsuming the case under a universal. To judge is to recognize the case as an instance of a kind. | **Substantive.** Concerns the cognitive architecture of moral deliberation. | **Priority:** Is the grasp of the particular prior to the principle, or is the grasp of the principle prior to the particular? | **Case:** The Virtuous Agent's Deliberation.<br>**Particularist:** The virtuous agent sees *this* person suffering and helps. They do not think "This falls under the principle of beneficence."<br>**Generalist:** Even if not conscious, the agent's competence is constituted by their grasp of the principle of beneficence which structures their perception. |
  | **5. Moral Education** | **Case-Based:** Improvement comes from exposure to diverse cases, mentorship, and cultivating sensitivity (phronesis). Rules are training wheels that must eventually be discarded to avoid rigidity. | **Principle-Based:** Improvement requires learning the rules that govern the domain. Sensitivity is the ability to apply rules accurately. Without rules, education is mere indoctrination into subjective preference. | **Partly Substantive.** Turns on whether "sensitivity" can be systematized. | **Transferability:** Can moral wisdom be transferred without transmitting principles? | **Case:** Teaching a Child.<br>**Particularist:** We teach "Don't hit" but must later teach them to see when hitting is permissible (self-defense). If they stick to the rule, they fail.<br>**Generalist:** We teach "Don't hit" as a principle with implicit exception conditions. As they mature, they learn the conditions explicitly. The principle remains the scaffold. |

  ***

  ## SECTION 3: REMAINING DISAGREEMENT AND LOAD-BEARING ISSUES

  Following our collaboration, we regard Rows 1 (Polarity) and 3 (Codifiability) as the **load-bearing disagreements**. Rows 2, 4, and 5 are largely downstream consequences of how one resolves the metaphysical status of reasons (Row 1) and the structure of moral truth (Row 3).

  We regard the disagreement on **Default Reasons (Row 2)** as partly dissolved; we agree that agents experience "moral residue," but disagree on whether this residue proves the persistence of a *pro tanto* reason (Generalist) or is merely a psychological artifact of living in a world where features usually behave regularly (Particularist).

  ### Conditions for Theoretical Movement

  **1. Regarding Polarity (Row 1)**
  *   **Observation Required:** A phenomenological or conceptual analysis of "regret" and "justification."
  *   **To Move the Generalist:** The Particularist must demonstrate a case where a feature (e.g., pain in surgery) is not merely outweighed but is *constitutively* part of the good, such that calling it a "reason against" distorts the description of the act.
      *   *Concession:* If successful, the Generalist must concede that *pro tanto* reasons are not universal and that valence is context-dependent.
  *   **To Move the Particularist:** The Generalist must demonstrate that without fixed valence, moral argumentation becomes impossible (e.g., we cannot explain why we rejected an act if the reasons themselves vanish).
      *   *Concession:* If successful, the Particularist must concede that reasons have invariant valence, even if their contribution to the overall verdict is non-linear.

  **2. Regarding Codifiability (Row 3)**
  *   **Observation Required:** The construction of a candidate principle set.
  *   **To Move the Generalist:** The Particularist must show that any proposed principle set either fails to cover novel cases or requires so many *ceteris paribus* clauses that the "principle" contains no more information than the set of decided cases itself.
      *   *Concession:* If successful, the Generalist must concede that while morality is principled in nature, it is not *codifiable* by finite human minds, rendering "principle" a regulative ideal rather than a practical tool.
  *   **To Move the Particularist:** The Generalist must produce a finite set of principles that successfully predicts verdicts in novel, complex cases better than the intuitive judgments of competent agents.
      *   *Concession:* If successful, the Particularist must concede that moral competence is indeed a form of rule-following, even if the rules are complex.

  ### Final Statement of Status
  We sign this document acknowledging that we have not resolved the dispute. We have, however, isolated the precise points of friction. The Generalist remains committed to the **invariance of valence** and the **in-principle codifiability** of morality. The Particularist remains committed to the **holism of reasons** and the **uncodifiability** of moral truth. We agree that future work must focus not on restating these positions, but on testing the specific predictions outlined in Section 2 regarding moral residue, novel cases, and the structure of moral deliberation.

  **Signed,**

  _________________________
  *The Moral Particularist*

  _________________________
  *The Moral Generalist*
