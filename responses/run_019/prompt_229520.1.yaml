answer: |-
  The world pours in through this wet **eye**,
  Unblurred by any pane of **glass**.
  I stand before the garden **window**,
  Too young to answer to a **name**.
  I do not know I am but **one**,
  Among the many who must **sleep**.

  The bed is wide enough for **sleep**,
  The lid falls heavy on the **eye**.
  What matter if I was many or **one**?
  The mirror clouds its silver **glass**.
  No doctor calls me by a **name**,
  Only the light remains the **window**.

  I sight him through the rifle's **window**,
  A target drifting into **sleep**.
  I never learned his given **name**,
  Yet I see the fear in his **eye**.
  The scope is polished clear as **glass**,
  Knowing the stranger is but **one**.

  He wrote that mind is truly **one**,
  Though it looks through many a **window**.
  The text is transparent as **glass**,
  Yet words induce a kind of **sleep**.
  I rub the tired dryness of my **eye**,
  And lose the writer's **name**.

  You worry for my life, my **name**,
  Whether I am many or **one**.
  I close within myself my **eye**.
  There is no box, no outer **window**,
  I am the dark inside your **sleep**,
  I am the seer behind the **glass**.

  I meet your gaze in the shop **glass**,
  But you are wearing my **name**.
  We rise from the same deep **sleep**,
  Though we pretend we are not **one**.
  You look through your own **window**,
  I look through this same **eye**.

  There is no frame upon the **glass**,
  No owner left to claim the **name**.
  This waking ends the dream of **sleep**,
  Revealing all things are but **one**.
  Let fall the wall, remove the **window**,
  To see with the single **eye**.
