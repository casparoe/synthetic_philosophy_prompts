answer: |-
  It is a pleasure to meet a colleague from the field. Your intuition about "uptake cost" is spot on; in the literature, we often call this **transparency**. When a tool is transparent, you look *through* it at the world (like glasses); when it is opaque, you look *at* the tool itself (like a broken compass).

  To build a working rubric for this, I propose we expand your "uptake cost" into four specific dimensions. If we treat the "cognitive system" as a control loop, we need to know how tightly the external resource is coupled to that loop.

  ### The Rubric: Four Criteria for Extension

  1.  **Fluency (Your "Uptake Cost"):** How much translation is required between the external state and your internal reasoning? Low friction scores high. If you have to "decode" the tool, it's less like memory and more like a library.
  2.  **Cognitive Trust (Endorsement):** When the resource provides information, do you accept it as a belief immediately, or do you verify it? Otto trusts his notebook as much as Inga trusts her biological memory. Constant verification suggests a tool, not a mind.
  3.  **Manipulative Reciprocity:** Can you manipulate the external resource to *generate* new thoughts, or does it only store/retrieve existing ones? Writing to figure out what you think scores high; looking up a fact scores low.
  4.  **Coupling Reliability:** Is the resource available when the cognitive demand arises? If the resource is sporadic or socially contingent, it functions more like a lucky break than a constitutive part of the system.

  ***

  ### The Scoring

  **1. The Paper Field Notebook**
  *   **Score: 9/10**
  *   **Reasoning:** High fluency (your own handwriting/shorthand), high trust (losing it was losing *reasoning*, not just data), high reciprocity (writing *was* thinking), and high reliability (constant companion). It loses a point only because physical degradation or loss is a risk biological memory doesn't share in the same way.

  **2. The Handheld GPS**
  *   **Score: 7/10**
  *   **Reasoning:** High fluency and trust (you treat the coordinates as fact), and high reliability. However, it scores lower on reciprocity. You cannot "argue" with the GPS or manipulate its internal state to explore a hypothesis; it is an oracle, not a partner. It extends your *senses*, but perhaps not your *reasoning*.

  **3. The Printed Tide Table**
  *   **Score: 4/10**
  *   **Reasoning:** High trust, but low fluency (lookup required) and very low reciprocity. It is a static reference. You consult it to inform a decision, but the table itself does not participate in the cognitive processing of *why* the tide matters. It is a database, not a processor.

  **4. The Field Colleague**
  *   **Score: 5/10**
  *   **Reasoning:** This is the trickiest. High trust and high reciprocity (you can discuss and reason together). However, it fails the Coupling Reliability test ("wasn't always around") and has high Fluency costs (social friction/"mildly irritating"). A mind that goes home at night is hard to count as *your* extended mind, even if it's brilliant.

  **5. Map Conventions (Vocabulary/Symbols)**
  *   **Score: 10/10**
  *   **Reasoning:** You noted you "literally saw terrain through them." This is perfect fluency; the external symbols have reshaped your internal perception. It is high reciprocity (you use the symbols to categorize and predict) and high reliability (once learned, they are always "on"). This is the deepest form of extension: the tool has become the lens.

  **6. The Precomputed Spreadsheet**
  *   **Score: 6/10**
  *   **Reasoning:** Similar to the GPS but slightly lower. High trust and fluency, but it is task-specific rather than environmentally integrated. It offloads *calculation*, which is cognitive, but it feels more like a prosthetic calculator than a part of the reasoning loop itself. It's a "black box" step in the chain.

  ***

  ### The Tiers

  **Top Tier (Constitutive): Cases 1 & 5**
  *These resources are not just used by the thinker; they actively structure the thinking process itself, functioning as integral components of the cognitive loop.*

  **Middle Tier (Prosthetic): Cases 2 & 6**
  *These tools reliably offload specific cognitive burdens (calculation, localization) and are trusted, but they function more as high-efficiency oracles than partners in reasoning.*

  **Bottom Tier (Referential): Cases 3 & 4**
  *These are external resources that inform cognition but lack the constant, frictionless integration required to be considered part of the thinking system itself.*

  ***

  ### The Case I'd Most Want to Argue About

  I would take **Case 5 (Map Conventions)** to the seminar room immediately.

  Here is why: It threatens to collapse the distinction between "Extended Mind" and "Embodied Mind." Clark and Chalmers argue for resources *outside* the skull. But if you "see terrain through" the symbols, those conventions have been internalized into your neural wiring. At that point, is the *external* map still doing the work, or is it just your *internalized training*?

  If I argue it's a 10, I risk saying that *language itself* is an extended mind technology (which some do argue), but that makes the "extended" label so broad it might lose its bite. If I argue it's a 4, I ignore your phenomenological report that the symbols changed *how you see*. Deciding whether a learned public language counts as an "external resource" or an "internal capacity" is where the real battle lines of cognitive science are drawn today.
