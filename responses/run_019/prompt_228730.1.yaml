      *   **The Cost of Rejection (Compatibilism):** To reject (4), you must accept that "influence" is compatible with "prior determination." You must accept that your choice is a *link* in the chain, not an interruption of it. You must accept a counterfactual analysis of causation: "If I had chosen otherwise, the outcome would have been otherwise," even if "I could not have chosen otherwise given the past."
