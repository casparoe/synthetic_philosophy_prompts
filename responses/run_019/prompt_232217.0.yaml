answer: |-
  Your intuitions are remarkably consistent with the most sophisticated frameworks in legal theory and moral philosophy regarding sexual consent. You are implicitly distinguishing between different *kinds* of deception and different *kinds* of pressure.

  Here is an analysis of the principles underlying your verdicts, how to resolve the tensions you feel, and how to apply this framework to your final test case.

  ### 1. The Underlying Principles

  Your verdicts are captured by three distinct principles. If you adopt these explicitly, your cases cohere without contradiction.

  **Principle A: The "Nature and Risk" Test (Deception)**
  *   **Rule:** Deception invalidates consent if it concerns the **physical nature of the act** or **significant biological risks** inherent to the act (pregnancy, disease, barrier methods). Deception does *not* invalidate consent if it concerns **collateral motivations** (love, status, wealth, future intent).
  *   **Legal Term:** This maps to the distinction between *fraud in the factum* (lie about what is happening) and *fraud in the inducement* (lie about why you should do it).
  *   **Matches your cases:**
      *   *Invalid:* Vasectomy, Pill, Stealthing (all change the biological risk profile).
      *   *Valid:* Love lie, Gallery Owner lie (these change the emotional/social context, not the physical act).

  **Principle B: The "Structural Power" Test (Coercion)**
  *   **Rule:** Coercion invalidates consent if it exploits a **structural power imbalance** or threatens **basic security/rights** (livelihood, physical safety, liberty). Coercion does *not* invalidate consent if it threatens **relational consequences** (breakups, emotional distance), provided there is no dependency akin to employment or custody.
  *   **Rationale:** We recognize a right to end a relationship, even for bad reasons. We do not recognize a right to fire someone for refusing sex.
  *   **Matches your cases:**
      *   *Invalid:* Boss threat (exploits economic dependency and institutional power).
      *   *Valid:* Partner ultimatum (exploits emotional attachment, but exercises the autonomy to set relationship boundaries).

  **Principle C: The "Capacity" Test (Competence)**
  *   **Rule:** Consent is invalid if the agent lacks the cognitive capacity to understand the decision or communicate refusal, regardless of verbal agreement.
  *   **Matches your cases:**
      *   *Invalid:* Intoxication (capacity is compromised).

  ---

  ### 2. Resolving the Tensions

  You identified two specific friction points. Here is how the principles above resolve them.

  **Tension 1: Vasectomy Lie (Invalid) vs. Love Lie (Valid)**
  *   **The Conflict:** Both are lies told to secure sex. Why is one rape/assault and the other just a breakup waiting to happen?
  *   **The Resolution:** Apply **Principle A**.
      *   The Vasectomy lie alters the **consequences of the biology**. Sex with a vasectomized man is physically different in terms of risk than sex with a fertile man. By lying, he has unilaterally changed the physical parameters of the act she agreed to.
      *   The Love lie alters the **emotional context**. The physical act and its biological risks remain exactly as she understood them.
      *   *Why this matters:* If we invalidate consent for *any* lie (including "I love you"), we risk making almost all sex legally precarious, as people often exaggerate feelings to attract partners. Drawing the line at *physical risk* creates a bright, enforceable boundary.

  **Tension 2: Boss Threat (Invalid) vs. Partner Ultimatum (Valid)**
  *   **The Conflict:** Both say "Sleep with me or I take something away."
  *   **The Resolution:** Apply **Principle B**.
      *   The Boss threatens **livelihood**. In a capitalist society, losing a job threatens housing, food, and future employability. This is a coercive environment where "no" is not a reasonable option.
      *   The Partner threatens **the relationship**. While painful, adults generally have the right to end relationships for any reason, including lack of sex. If a partner says "Sex is a requirement for me to stay," they are stating a boundary. It is toxic, perhaps, but it respects their autonomy to leave.
      *   *Revision Check:* Do you need to revise this? **No.** If you revise this to make the Partner Ultimatum "non-consensual," you run into the "Paradox of Romantic Coercion." If saying "I will leave if you don't sleep with me" invalidates consent, then *any* conditional sex in a relationship is problematic ("If you loved me, you would..."). To preserve sexual autonomy within relationships, we must allow partners to set conditions, even hurtful ones.

  ---

  ### 3. The Test Case: Exclusivity and Cheating

  **The Scenario:** A man tells his partner they are exclusive. She says she would not have sex if he were seeing others. They use condoms and he has been tested. He is secretly seeing someone else.
  **Question:** Is her consent valid?

  **Applying Your Framework:**

  1.  **Check Principle A (Nature and Risk):**
      *   Is exclusivity a physical characteristic of the act? No.
      *   Is there a significant biological risk? You specified **condoms and testing**. This is the crucial detail. In the *Vasectomy* and *Pill* cases, the deception removed protection against pregnancy. In *Stealthing*, it removed protection against pregnancy/STDs.
      *   Here, the physical safeguards remain in place. The deception is not about the *safety of the act*, but the *fidelity of the partner*.
      *   *Verdict:* This aligns with the **Love Lie** and **Gallery Owner Lie**. It is a lie about the social/emotional context, not the physical mechanism or direct biological risk.

  2.  **Check Principle B (Coercion):**
      *   There is no threat here, only deception. This principle doesn't apply.

  3.  **Check Principle C (Capacity):**
      *   Both are sober. This principle doesn't apply.

  **The Verdict:**
  Under the principles derived from your other verdicts, **her consent is valid.**

  **Why this feels uncomfortable:**
  It feels like a violation because it *is* a violation of trust and relationship contracts. However, under your framework (and most legal frameworks), a violation of trust is not automatically a violation of *sexual consent*.
  *   **The Distinction:** He has committed moral wrong (cheating/breach of agreement). He has not necessarily committed sexual assault.
  *   **The Caveat:** If you discovered he *knew* he had an STD and hid it, your **Principle A** would kick in, and consent would become **Invalid** (matching the Vasectomy/Pill cases). The mitigation of risk (condoms/testing) is what keeps this in the "Valid Consent / Moral Wrong" category rather than the "Invalid Consent / Assault" category.

  ### 4. Summary of Recommendations

  You do not need to revise your verdicts to make them coherent. They form a robust, liberal account of consent that balances protection from harm with personal autonomy.

  *   **Keep the Vasectomy/Love distinction.** It protects people from biological harm without policing romantic exaggeration.
  *   **Keep the Boss/Partner distinction.** It protects people from economic coercion without criminalizing relationship breakups or boundaries.
  *   **On the Test Case:** Accept that this is a case of **Valid Consent + Moral Betrayal**. It is distinct from the Vasectomy case because the physical risk was mitigated. If you want the Test Case to be "Invalid Consent," you would have to revise your Vasectomy verdict to be about "Conditions of Agreement" rather than "Physical Risk," but that would force you to classify the Love Lie and Gallery Owner Lie as assault as well, which you rightly rejected.

  **Final Principle Statement:**
  > Consent is valid when given by a competent agent, regarding the specific physical act and its biological risks, without coercion that threatens basic security or rights. Deception regarding emotional context or relationship status, and pressure regarding the continuation of the relationship, may be immoral, but they do not vitiate consent.
