      *   *Correction:* The "Verdict" needs to be clear. I'll argue he was a "proof of concept."
      *   *Anecdote:* Let's use the "Vampire" one and a "Movie Option" one. Everyone understands movies.

  10. **Final Review against Prompt:**
      *   5 minutes? Yes.
      *   Explain idea simply? Yes ("the dance everyone hates").
      *   Take a position? Yes ("He didn't kill the machine, he built a shelter").
