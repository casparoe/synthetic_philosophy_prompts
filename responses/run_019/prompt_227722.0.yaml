answer: |-
  Good evening. For those of you I haven't met, I'm [Name]. I've been writing novels for thirty years, and for thirty of those years, Martin has been the person standing between me and the rest of the world.

  Looking around this room, I see a split. Half of you know exactly how publishing works. The other half—mostly Martin's family—probably think books just appear on tables, like bread in a basket. I'm going to try to bridge that gap, because to understand why Martin is special, you have to understand the pressure he resisted.

  In publishing, there is a current. It pulls everyone in the same direction. If vampires sell, everyone writes vampires. If a book is described as "Harry Potter meets The Godfather," everyone buys it. If a movie option is on the table, everyone tells you to change the ending to suit Hollywood. It's a race where everyone runs faster, but no one actually likes where they're going. Editors hate chasing trends. Authors hate selling out. But nobody stops, because if you step off the treadmill alone, you disappear.

  I read an essay once that described this perfectly. It said: *Everyone hates the system, but for lack of a way to agree to stop, the system endures.*

  Martin's superpower wasn't that he sold books. It was that he talked us *out* of them.

  In 2007, when Twilight was everywhere, one of his clients had a quiet literary novel. A publisher offered a massive deal to turn the lead character into a vampire. The money was life-changing. Martin said no. He didn't make a counter-offer. He just said, "We're not doing that."

  Another time, during an acquisitions meeting at a major house, an editor suggested we pitch my next book as "The Great Gatsby meets The Da Vinci Code." It was a terrible idea. My book was neither of those things. Before I could stammer a reply, Martin laughed. Actually laughed. He told her, "If you need two other books to understand this one, we've failed." He walked out with the manuscript.

  Now, the puzzle I've been turning over in my head is: How did he get away with this?

  Did Martin beat the system? Or did the system just tolerate him because he had two bestsellers that paid the rent? Is he a hero who broke the machine, or just a rich man who could afford to ignore it?

  I think the answer is darker, but also warmer. Martin didn't break the machine. The machine is still here; in some ways, it's louder than ever. Moloch—the monster of bad incentives—wasn't slain.

  But Martin proved that you could build a room where the monster couldn't fit.

  He used the cover his success gave him not to buy a bigger boat, but to carve out a sanctuary. He was a coordination mechanism for a very small group: his authors. He told us, "You don't have to run the race. You can just write the book." He absorbed the risk so we didn't have to. He let us be defectors, together.

  For the family: Imagine everyone at a party is dancing a dance they hate, but they're too afraid to stop. Martin didn't stop the music for the whole party. But he found a corner of the room, turned down the volume, and let us sit down and talk.

  That is a rare thing. In an industry of short-term deals, he was a long-term promise. In a business of noise, he was a quiet "no."

  Martin, you didn't save the industry. But you saved us. And for that, we are endlessly grateful.

  To Martin.
