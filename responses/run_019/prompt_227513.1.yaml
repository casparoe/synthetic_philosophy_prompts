      *   *Tone:* Colleague-to-colleague email, practical, honest.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't sound like I'm lecturing on philosophy. Keep it grounded in mediation practice.
      *   *Correction:* The prompt asks for "roughly three buckets." I need to ensure the third bucket (normative/stipulative) is clearly distinguished from the substantive one. The substantive one is about facts (X happened), the normative one is about rules (We should call X "Y").
      *   *Correction:* The hard cases need to be integrated naturally, not as a separate list.
      *   *Correction:* The examples need to show the *reasoning*, not just the outcome.
      *   *Correction:* Ensure the "10 minutes" constraint is respected in the description of the procedure (keep it snappy).
      *   *Correction:* Watch out for accidental formatting like bolding key terms.

  6.  **Writing - First Pass (Mental or Scratchpad):**
      Start by saying "I hear you." Then describe the "Ban the Word" technique. Explain that you listen for the hot word. Then ask them to rephrase without it. If they agree, it's verbal. If not, it's substantive. But wait, there's the third case where they agree on facts but fight on the label. That's the normative case. Then discuss the hard cases. Then the examples.
      *Critique:* Need to make sure the flow is smooth. No lists.

  7.  **Writing - Second Pass (Focusing on Flow and Constraints):**
      (Drafting the text...)
      "It is refreshing to hear someone say out loud what most of us in the field suspect but rarely formalize..."
