      Explain the three outcomes.
      Outcome 1: Agreement on restatement. Action: Translate and close.
      Outcome 2: Disagreement on restatement. Action: Dig into evidence.
      Outcome 3: Agreement on facts, disagreement on label utility. Action: Negotiate convention.
      Weave in the hard cases. Borderline cases are tricky (vagueness). Load-bearing words (contractual) mean the verbal dispute has real stakes. Identity investment means resistance to the test.
      Example 1: Algorithm bias. One means statistical disparity, one means malicious intent. Test reveals they agree on the stats but disagree on the label. Action: Clarify definitions for the report.
