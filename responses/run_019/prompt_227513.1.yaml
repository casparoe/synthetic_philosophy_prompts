  8.  **Final Polish:**
      Check against "no bold, no bullets, no headings." Ensure the tone is empathetic but professional. Make sure the distinction between substantive and normative is clear. Ensure the limitations are highlighted honestly.

      *Self-Correction on "No numbered steps set off on their own lines":* I can use numbers within a sentence (e.g., "step one is...") but not a vertical list. I will avoid numbers entirely to be safe and use transition words like "first," "next," "finally."

