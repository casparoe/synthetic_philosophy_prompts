      *Refining the "Third Bucket":* The prompt describes it as "the fight isn't about facts at all but about which meaning of the word ought to be the standard one going forward." This is a dispute over convention or stipulation. I need to make sure the mediator knows how to handle this (it's a negotiation over rules, not facts).

      *Refining the Hard Cases:*
      1. Borderline: Same definition, different application. This is usually substantive (facts about the borderline case) or vagueness (needs a precisification).
      2. Load-bearing: The word triggers a contract clause. The dispute is verbal, but the stakes are real. Don't dismiss it as "just verbal."
