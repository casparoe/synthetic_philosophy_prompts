answer: |-
  It is refreshing to hear someone say out loud what most of us in the field suspect but rarely formalize, because you are absolutely right that half the heat in academic disputes comes from people shouting past each other about definitions while pretending they are fighting about facts. The procedure you need is essentially a structured translation test that you can run in about ten minutes, and it starts the moment you identify the pivot word, which is usually the term that gets repeated with increasing volume and decreasing clarity. Once you have spotted that word, whether it is discrimination, authorship, or validity, you need to interrupt the cycle and ask each party to state their central claim without using the contested term or any synonyms of it. This is the crucial move, because it forces them to cash out the concept into observable facts or specific conditions rather than hiding behind the label. If they can do this, you write down both restatements side by side and compare them. If the restatements are compatible or identical, you have found a purely verbal dispute, and your job is to act as a translator who confirms that both parties agree on the underlying reality but have been applying different labels to it. In this case, you do not try to resolve the conflict by finding more evidence, because there is no factual disagreement to resolve, but instead you facilitate an agreement on how to translate between their vocabularies for the sake of the record. You might ask them to agree that for the purposes of this paper or grant, we will use definition A, while acknowledging that party B was using definition B, and then you move on to the actual work they were supposed to be doing.

  However, if the restatements contradict each other even after the banned word is removed, you are in the second bucket, which is a genuinely substantive dispute. Here the procedure instructs you to stop talking about definitions and start talking about evidence, because the disagreement is now visible as a conflict over what happened or what the data shows. The third bucket is the trickiest one and often gets misdiagnosed as substantive when it is actually a normative dispute over convention. This happens when both parties agree on the restated facts but disagree on which label ought to be attached to them going forward, usually because one definition carries more prestige or legal weight than the other. In this scenario, the procedure tells you to stop acting like a fact-finder and start acting like a legislator, because the question is not what is true but what rule we should adopt. You need to shift the conversation from who is right to what usage serves the community best, perhaps by asking them to consider the downstream consequences of adopting one definition over the other for future collaborations or for the field at large.

  You asked about the hard cases, and I want to be honest that the procedure breaks down when the word is load-bearing in a contract or when identity is invested in the usage. If the dispute is about whether a specific task counts as authorship because the university rules say authors get ten percent of the patent revenue, then telling them it is merely verbal will not help, because the verbal distinction controls a material resource. In these cases, you have to acknowledge that while the conceptual disagreement might be verbal, the stakes are real, and you must treat the definition itself as the object of negotiation rather than something to be dissolved. Similarly, if one party feels that accepting a new definition invalidates their past work, the restatement step will meet resistance that looks like obstinacy but is actually self-preservation. Here you cannot simply ban the word; you have to allow them to keep their definition for their past work while agreeing to a stipulated definition for the current project, effectively creating a temporal boundary that protects their identity while allowing the collaboration to proceed. There is also the borderline case where both sides accept the same definition but disagree on whether a specific instance falls under it, which often looks verbal but is actually a dispute about vagueness. The procedure handles this by asking them to specify the threshold, so if they agree that discrimination means unfair treatment but disagree on whether a specific algorithm is unfair, you push them to define the threshold of unfairness, which usually reveals a substantive disagreement about values or risk tolerance rather than just language.

  Let us work through the algorithm example you mentioned, where one researcher claims the model discriminated and the other denies it. You hear the word discrimination repeated until it loses meaning, so you intervene and ask the accuser to state their claim without using the word discriminate or bias. They say the model rejects loan applications from group X at twice the rate of group Y despite identical credit scores. You then ask the defender to state their claim without using the word fair or discriminate. They say the model uses only credit scores and income data, with no input variable for group membership, and predicts default risk accurately for both groups. You look at your notes and see that they agree on the statistics, the inputs, and the outcomes, so the restatements are compatible. This diagnoses the dispute as purely verbal, where one side is using a disparate impact definition and the other is using a disparate treatment definition. Your move here is to point out the agreement on the facts and ask them to decide which definition the paper will use, perhaps suggesting they report the statistical disparity while noting the lack of intent, thereby satisfying both descriptions without fighting over the label.

  Now consider the case where the procedure gives an answer you will not like, which is when the test says verbal but the parties are still furious. Imagine two lab heads fighting over whether a graduate student is a collaborator or a technician. You run the test and they agree on exactly what the student did, how many hours they worked, and what intellectual input they provided, so the restatements match. The procedure classifies this as verbal, suggesting you just agree on a label and move on. But you notice they are not relieved; they are angrier. This is because the label controls the student's visa status and the lab's overhead rate, so the fight is actually about resources and status disguised as a definition. If you dissolve this as merely verbal, you will fail because you have ignored the material stakes. In this instance, you have to override the procedure and acknowledge that while the concept is contested verbally, the consequence is substantive. You tell them that since the definition triggers different administrative outcomes, we are not going to decide which definition is true, but rather which administrative category we will apply for this specific case, effectively bypassing the conceptual fight to solve the resource allocation problem.

  There are limits to where this checklist works, and you need to trust your judgment when the emotional temperature does not drop after the restatement. If you ban the word and they still cannot agree on the restatement, do not keep pushing the linguistic angle, because you have likely found a substantive conflict that requires evidence or compromise. If they agree on the restatement but refuse to accept the diagnosis, it means the word itself has become a symbol of victory, and you will need to negotiate a face-saving formula rather than a logical solution. The procedure is a diagnostic tool, not a cure-all, and its greatest value is saving you from spending an hour mediating a dictionary argument when you could be mediating a resource allocation or a trust repair. Use it early in the session to clear the underbrush, but be ready to abandon it if you sense that the word is standing in for something deeper like power, safety, or identity, because no amount of semantic precision will resolve a fight about who gets to be in charge. Ultimately, your goal is not to prove the philosophers right about verbal disputes but to get the academics back to work, and sometimes that means letting them keep their definitions as long as they agree on the next step.
