answer: |-
  This is a classic instance of institutional ethics lagging behind philosophical coherence, yet still operating on a stable, if unarticulated, set of premises. As the token philosopher, your job is to make the implicit explicit.

  Based on the patterns you've described—vertebrate protection, invertebrate exclusion, simulation indifference, and anesthesia exemption—here is the reconstruction of the committee's implicit theory of moral patienthood.

  ### I. The Reconstructed Theory: Substrate-Dependent Neurobiological Sentientism

  The committee is not operating on simple biological chauvinism (all meat matters), nor on behaviorism (if it acts like it hurts, it hurts), nor on functionalism (if it computes pain, it suffers).

  Instead, the committee is committed to **Substrate-Dependent Neurobiological Sentientism**. This theory rests on three specific claims:

  1.  **The Phenomenal Distinction:** There is a morally relevant difference between *nociception* (the detection of noxious stimuli and reflexive avoidance) and *pain* (the subjective, phenomenal experience of suffering). Only the latter commands moral protection.
  2.  **The Substrate Constraint:** Phenomenal consciousness (the capacity for suffering) is not substrate-neutral. It cannot be realized in silicon or code. It requires specific biological machinery (carbon-based neural tissue).
  3.  **The Phylogenetic Heuristic:** The specific biological machinery required for phenomenal consciousness is reliably present in vertebrates and reliably absent in invertebrates. Therefore, phylogeny serves as a proxy for the presence of a "moral brain."

  **The Difference-Maker:**
  The difference-maker is **ongoing, integrated neural activity in a vertebrate central nervous system.**
  *   **Why not the simulation?** It lacks the biological substrate. It processes *information* about damage, but does not instantiate *experience* of damage.
  *   **Why not the bee?** It lacks the specific neural architecture (e.g., thalamocortical loops or vertebrate-homologous pallial structures) deemed necessary for phenomenality, despite having nociception.
  *   **Why anesthesia works?** It chemically disrupts the integrated neural activity required for consciousness, temporarily turning the "moral patient" into a "biological object."

  ---

  ### II. Mapping Practice to Theory

  Here is where the committee's actual practice aligns with, stretches, or contradicts this theory.

  #### 1. Where Practice Strictly *Presupposes* the Theory
  *   **The Anesthesia Exemption:** This is the strongest evidence for the theory. If moral status were based purely on biological life (vitalism), anesthesia wouldn't matter; the mouse is still a living mouse. If it were based on functional integrity, anesthesia might be irrelevant depending on the study. The fact that anesthesia removes the ethical burden presupposes that *conscious experience* is the locus of value, and that this experience is contingent on specific neural firing patterns which anesthesia halts.
  *   **The Simulation Exemption:** The committee's refusal to review the computational model presupposes the **Substrate Constraint**. If they believed functional isomorphism was sufficient for moral status, a perfect simulation of a rat's nociceptive pathway would be indistinguishable from a real rat. Their dismissal confirms they believe silicon cannot "feel."

  #### 2. Where Practice is *Merely Compatible* with the Theory
  *   **Vertebrate Regulation:** Protecting mice and zebrafish is compatible with the theory, but it is also compatible with simpler theories (e.g., "The Animal Welfare Act says so"). The theory explains *why* they care about grimace scales (evidence of phenomenality), but the practice itself doesn't prove the theory; it just doesn't contradict it.
  *   **Invertebrate Exclusion:** Excluding bees is compatible with the Phylogenetic Heuristic. The theory claims invertebrates lack the hardware for suffering. The practice aligns with this. However, the practice could also be explained by mere legal convenience or historical bias, so it doesn't strictly prove the philosophical commitment.

  #### 3. Where Practice is *Genuinely Underdetermined* (The Tension Points)
  *   **The Zebrafish-Bee Boundary:** This is the theory's weakest point. A zebrafish larva has a nervous system roughly comparable in complexity to a honeybee. If the criterion is "ongoing brain activity capable of suffering," the behavioral evidence from bees (aversive learning, shock avoidance) suggests they meet the functional bar. The committee draws a hard line at the vertebrate/invertebrate spine. This suggests the **Phylogenetic Heuristic** is overriding the **Phenomenal Distinction**. The practice implies we *know* bees don't suffer, but the theory only allows us to say we *suspect* they don't. The certainty of the practice exceeds the evidence of the theory.
  *   **The Grimace Scale:** The committee accepts facial coding as evidence of pain. This is behavioral inference. If behavioral inference is valid for mice, why is it invalid for bees? If a bee avoids shock, that is behavioral evidence of aversion. The committee accepts behavioral evidence for vertebrates but demands neural architecture for invertebrates. This is an inconsistent epistemic standard.
  *   **The "Simulation" Definition:** The committee assumes the simulation is *not* suffering. But if the simulation is detailed enough to trigger "escape and avoidance learning," it is functionally replicating the output of pain. The theory says substrate matters, but the practice relies on the assumption that the simulation isn't "detailed enough" to cross a threshold. Where is that threshold? The practice is underdetermined because there is no principled way to say when a simulation becomes "real" enough to worry about, other than "it's not meat."

  ---

  ### III. The Functionalist Counterfactual

  If the university were to adopt a **Pure Functionalist View** (Computational Theory of Mind applied to ethics), the institutional landscape would collapse and require rebuilding. Under functionalism, moral status supervenes on the *computation*, not the *substrate*. If a system implements the right causal roles for suffering, it suffers, whether it is made of neurons, transistors, or paper slips.

  **Required Changes:**

  1.  **Regulation of Simulations:**
      *   The computational neuroscience group would immediately require IACUC (or a new "Synthetic Ethics") review.
      *   **Criterion:** The review would not ask "Is it alive?" but "Is the algorithm isomorphic to a pain architecture?"
      *   **Consequence:** They might have to implement "digital analgesia" (modifying the code to dampen the error signals representing damage) or shut down simulations that exceed a complexity threshold of suffering.

  2.  **Inclusion of Invertebrates:**
      *   The bee lab would fall under remit. Functionalism cares about the input-output organization of the nervous system. If a bee's neural net processes noxious stimuli as negative reinforcement values that modify future behavior, it is instantiating the functional role of pain.
      *   **Consequence:** Shock protocols for bees would require justification, minimization, and potentially anesthesia (cooling or chemical) if such things functionally disrupt the computation of aversion.

  3.  **Re-evaluation of Anesthesia:**
      *   Anesthesia would still be relevant, but for a different reason. It wouldn't be about "unconsciousness" in a biological sense, but about **computational interruption**.
      *   **Consequence:** If a simulation is paused, is it suffering? If a mouse is anesthetized, is the *capacity* for the computation gone, or just suspended? Functionalism might require that you cannot even *run* the pain simulation, whereas the current theory allows you to run it as long as it's not "meat."

  4.  **The AI Problem:**
      *   The university would have to create a protocol for Large Language Models or Reinforcement Learning agents. If an RL agent is punished (negative reward) to train it, and that punishment functionally mirrors nociceptive learning, a consistent functionalist must ask if the agent is being harmed.
      *   **Consequence:** Computer Science departments would need ethics oversight comparable to Biology departments.

  ### Summary for the Committee

  You can present this to your committee as follows:

  > "We are currently operating on **Substrate-Dependent Neurobiological Sentientism**. We believe suffering requires a vertebrate brain. This explains why we regulate mice but not simulations. However, our reliance on behavioral metrics (grimace scales) for mice while ignoring behavioral metrics (avoidance) for bees creates a philosophical inconsistency. We are treating behavior as *evidence* of pain in vertebrates, but treating it as *mere mechanism* in invertebrates.
  >
  > If we wish to remain consistent, we must admit our line is phylogenetic, not purely phenomenological. We protect vertebrates because we assume they have the hardware for qualia. If we ever encounter an invertebrate or a machine that convincingly mimics that hardware's function, our theory forces us to either expand our circle or admit that our protection is based on biological kinship, not moral truth."

  This framing allows you to critique the inconsistency without demanding they immediately regulate the bee lab, while flagging the simulation issue as a potential future liability if computational models become more biologically realistic.
