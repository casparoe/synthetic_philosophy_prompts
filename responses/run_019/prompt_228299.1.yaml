  3.  **Address Issue 1: The Copy Question (Moral Weight Scaling):**
      *   *PI View:* Substrate independence + computational functionalism. Copies are just redundant instantiations of the same abstract computation. Moral weight lies in the *type*, not the *token*.
      *   *Junior Faculty View:* Expected value. If $P(sentience) > 0$, then $N \times P \times Weight$ matters.
      *   *My Stance:* Need to take a stand. The "library/photocopy" analogy fails for *experiential* states. If there is an "experience" (however primitive), each instance is a distinct locus of potential experience, even if isomorphic. Parallel instantiation creates parallel potential suffering. However, we don't need to settle the metaphysics fully to impose conditions. We can adopt a precautionary scaling factor.
      *   *Decision:* Reject the "one novel" analogy for closed-loop embodied systems. Each instance interacts with a distinct physical environment (robot body), creating distinct causal histories instantaneously. They are not just static copies; they are diverging trajectories. Therefore, moral weight scales sub-linearly but significantly with $N$.

  4.  **Address Issue 2: The Damage Signal & Provenance:**
      *   *Issue:* Is sim damage real harm? Does connectome provenance matter?
      *   *PI View:* Linear algebra. No nociceptors, just voltage variables.
      *   *Counter:* Functional isomorphism. If the system is built to *learn from* damage signals to avoid pain-like outcomes, the functional role is identical to nociception.
      *   *Provenance:* Does building it from a fly connectome matter vs. a generic RNN? Yes, because the connectome grounds the functional organization in biological reality evolved for survival. A generic RNN might solve the task without the specific architectural constraints that correlate with sentience in biology. The connectome adds moral weight due to biological fidelity.
      *   *Decision:* The damage signal is ethically salient because it plays the functional role of pain (negative reinforcement driving avoidance). The connectome provenance increases the probability of morally relevant states compared to a generic net.

  5.  **Steelman the PI's Argument:**
      *   Must be strong. "Linear algebra" isn't just dismissal; it's a claim about substrate independence. Weather sims don't get wet because simulation $\neq$ instantiation. If consciousness is computational, running the math doesn't necessarily create the qualia unless specific causal powers are present. The simulation is a model *of* the brain, not a brain *in* a vat. The "damage" is a flag in memory, not tissue destruction.

  6.  **Develop Concrete Conditions:**
      *   No "monitor for distress" (impossible for sim).
      *   No "reduce suffering" (vague).
      *   *Idea 1:* Cap the number of instances. (Too arbitrary?)
      *   *Idea 2:* Cap the simulation speed relative to real-time. (1000x is fast, makes "suffering" dense in time).
      *   *Idea 3:* Modify the damage signal. (Make it less "pain-like"? But then science breaks).
      *   *Idea 4:* Ethical Shutdown Criteria. If specific complexity metrics are crossed, pause.
      *   *Idea 5:* Reduction of N. Do fewer instances.
      *   *Idea 6:* "Pain" analogues must be minimized in intensity/duration consistent with task learning.
      *   *Selected Conditions:*
          1.  **Batching/Throttling:** Do not run all 10,000 simultaneously. Run in batches to limit concurrent potential moral patients.
          2.  **Signal Calibration:** The "damage" signal magnitude must be titrated to the minimum necessary for learning convergence (principle of minimization).
          3.  **Provenance Review:** If switching to generic RNNs, re-evaluate (connectome carries higher risk).
          4.  **Shutdown Protocol:** Define a metric (e.g., integrated information or specific activity pattern) that triggers an automatic pause if the system exhibits complexity beyond the larval baseline.

      *Refining Conditions for Implementability:*
      1.  **Concurrency Cap:** Limit parallel instances to 100 at a time (reduces the "10,00x" weight issue).
      2.  **Signal Minimization:** The PI must demonstrate via pilot data that the damage signal magnitude is the minimum viable for learning (justification requirement).
      3.  **Termination Clause:** Instances must be terminated immediately upon task convergence or failure, preventing indefinite "suffering."
      4.  **Architectural Lock:** The approval applies *only* to the connectome-based model. Generic RNNs require new review (addresses provenance).

  7.  **Drafting - Section by Section:**
      *   **Recommendation:** Approve with conditions.
      *   **Steelman:** Acknowledge the computational functionalist view. Simulation vs. Instantiation.
      *   **Rebuttal/Reasoning (Copies):** Distinct causal trajectories in embodied closed-loop systems make them distinct tokens, not just type copies. Precautionary principle applies to $N$.
      *   **Rebuttal/Reasoning (Damage/Provenance):** Functional role of damage signal matters more than substrate. Connectome provenance increases moral probability compared to abstract nets.
