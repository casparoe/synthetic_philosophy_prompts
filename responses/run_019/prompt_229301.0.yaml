      *   *The "Workhorse":* Which one kills the naive views? Likely the Independence Constraint or the Granularity Distinction. Let's go with the **Independence Constraint** because it directly attacks the "Real Troy = Historical Iliad" fallacy.

  6.  **Refining the "Workhorse" Argument:**
      *   Naive view 1: "Troy exists, therefore Iliad is history." (Fails independence).
      *   Naive view 2: "It's poetry, therefore it's fiction." (Fails genre neutrality).
      *   The Independence Constraint is the strongest filter because it demands external corroboration for specific claims, not just background setting.

  7.  **Addressing the "Conflicts":**
