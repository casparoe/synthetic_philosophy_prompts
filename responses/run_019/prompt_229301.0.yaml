          6.  No reading lists or citations; focus on conceptual criteria.

  2.  **Deconstruct the Problem (Legend-to-History Threshold):**
      *   The core issue is the relationship between *narrative form* (myth, legend, saga) and *historical referent* (actual past events).
      *   Key epistemological tensions: Verification vs. Falsification, Continuity vs. Discontinuity, Core vs. Periphery, Testimony vs. Material Evidence.
      *   The user wants *meta-criteria* for evaluating theories, not the theories themselves. What makes a theory *good* at solving this problem?

  3.  **Brainstorming Candidate Criteria:**
      *   *Correspondence:* Does the story match the facts? (Too simple, begs the question).
      *   *Independence:* Can we verify the story without using the story itself? (Crucial).
      *   *Granularity:* Do we need event-level match or just context-level match? (Troy: War happened? Specific duel happened?).
      *   *Transmission:* How much distortion is allowed in oral transmission?
      *   *Genre:* Does poetry equal fiction? (Need to avoid genre determinism).
      *   *Burden of Proof:* Who has to prove what? (Presumption of innocence for the text vs. presumption of guilt).
      *   *Explanatory Power:* Does treating it as history explain the evidence better than treating it as myth?
      *   *Continuity:* Is there a chain of testimony?
      *   *Negative Evidence:* Does absence of evidence count as evidence of absence? (Especially for Exodus).

  4.  **Selecting and Refining the Requirements (The "Standards of Adequacy"):**
      *   I need to select the most philosophically robust criteria that a theory *must* address to be taken seriously in this field.
      *   *Requirement 1: The Independence Constraint.* (Avoids circularity).
      *   *Requirement 2: The Granularity Distinction.* (Distinguishes "something happened" from "this happened").
      *   *Requirement 3: The Negative Evidence Protocol.* (Handles the Exodus problem).
      *   *Requirement 4: The Transmission Mechanism.* (Handles the Arthur/Oral problem).
      *   *Requirement 5: The Genre Neutrality.* (Handles the "Poetry isn't history" bias).

  5.  **Drafting the Content (Iterative refinement):**

