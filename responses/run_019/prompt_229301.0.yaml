answer: |-
  As a philosopher of history, I appreciate your methodological caution. Before asking *whether* a tradition is historical, one must establish *what it means* for a theory to successfully answer that question. You are asking for the meta-epistemological conditions of adequacy. If a theory cannot meet these standards, it is logically flawed, regardless of its conclusion.

  Here is the brainstorming process, followed by the formal specification of requirements.

  ### Phase 1: Brainstorming Candidate Criteria

  To determine when a legend becomes history, we are essentially trying to bridge the gap between *narrative content* (what the text says) and *past actuality* (what happened). The following conceptual problems arise during brainstorming:

  *   **The Circularity Problem:** We often use the legend to find the site (Schliemann and Troy), and then use the site to validate the legend. A theory must forbid this epistemic loop.
  *   **The Resolution Problem:** Does "historical" mean the war happened, or that Achilles existed? A theory must distinguish between background context and specific narrative claims.
  *   **The Silence Problem:** If we don't find evidence of Israelites in Sinai, does that mean they weren't there, or that nomads leave no trace? A theory must define the weight of negative evidence.
  *   **The Medium Problem:** Does the fact that a story is a poem (Homer) or a romance (Malory) automatically disqualify it as a carrier of historical data? A theory must address genre without prejudice.
  *   **The Transmission Problem:** For Arthur, there is a centuries-long gap. A theory must account for how information degrades or persists in oral/written transmission.

  From these problems, we can distill the necessary requirements for an adequate theory.

  ***

  ### Phase 2: Specification of Requirements

  Here are the five requirements any adequate theory of the legend-to-history threshold must satisfy.

  **1. The Independence Constraint**
  *   **Specification:** The verification of a narrative claim cannot rely solely on evidence that was identified or interpreted using the narrative itself. There must be an external anchor.
  *   **Motivating Consideration:** This addresses the **Circularity Problem**. If we identify a layer of destruction at Hisarlik *because* we read the *Iliad*, we cannot use that destruction layer to prove the *Iliad* is historically accurate without independent dating or contextual markers.
  *   **Status:** **Non-negotiable.** Without this, the theory commits the fallacy of begging the question.

  **2. The Granularity Distinction**
  *   **Specification:** The theory must distinguish between *contextual historicity* (the setting, technology, geopolitical landscape) and *event historicity* (specific actions, agents, and outcomes described in the narrative).
  *   **Motivating Consideration:** This addresses the **Resolution Problem**. It prevents the slide from "The Bronze Age collapsed" to "Agamemnon led the coalition." A theory that conflates the two fails to explain why specific narrative details might be fictional while the setting is real.
  *   **Status:** **Non-negotiable.** It is a logical category error to treat background conditions as equivalent to specific narrative assertions.

  **3. The Negative Evidence Protocol**
  *   **Specification:** The theory must explicitly state the conditions under which an absence of evidence constitutes evidence of absence. It must account for the expected "archaeological visibility" of the claimed events.
  *   **Motivating Consideration:** This addresses the **Silence Problem** (crucial for Exodus). If a theory claims the Exodus is unhistorical because we found no campsites, it must demonstrate that a group of that size *would* have left detectable campsites.
  *   **Status:** **Non-negotiable.** An argument from silence is logically invalid unless the silence is "deafening" (i.e., evidence should be there but isn't).

  **4. The Genre Neutrality Clause**
  *   **Specification:** The theory cannot a priori exclude historical referents based solely on the literary form (poetry, saga, miracle story) of the source.
  *   **Motivating Consideration:** This addresses the **Medium Problem**. It counters the view that "poetry equals fiction." Historical truth can be encoded in non-historical genres. However, the theory must explain *how* the genre shapes the data (e.g., compression, embellishment).
  *   **Status:** **Camp Preference.** (Mostly). Strict positivists might reject this, demanding documentary prose for history. However, in modern epistemology, rejecting a source purely on genre is considered methodologically unsound. I flag this as a preference because some analytic philosophers of history still hold that "history" as a discipline requires specific truth-claim structures that poetry lacks.

  **5. The Transmission Continuity Requirement**
  *   **Specification:** The theory must provide a plausible mechanism for how information survived from the event time to the recording time without total distortion.
  *   **Motivating Consideration:** This addresses the **Transmission Problem** (crucial for Arthur). If 400 years pass between the event and the text, the theory must explain the vector of preservation (oral formula, written fragments, cultural memory).
  *   **Status:** **Non-negotiable.** Without a mechanism of continuity, the link between event and text is severed, rendering the text folklore rather than history.

  ***

  ### Phase 3: Conflicting Pairs (Tensions)

  You asked to flag pairs of requirements that suspect cannot be jointly satisfied. In historical epistemology, these tensions are where the real philosophical work happens.

  **Conflict A: The Independence Constraint vs. The Transmission Continuity Requirement**
  *   **The Tension:** For cases like Arthur or the Exodus, independent contemporary evidence is often nonexistent (violating Independence). The only evidence is the tradition itself, transmitted over time (relying on Continuity).
  *   **The Implication:** A theory that strictly enforces *Independence* will almost necessarily fail the *Continuity* test for deep-time oral traditions, because there is no external anchor to verify the transmission chain. You often have to relax Independence to allow Continuity to do the work, which risks circularity.

  **Conflict B: The Granularity Distinction vs. The Negative Evidence Protocol**
  *   **The Tension:** If you demand high *Granularity* (specific battles, specific numbers), the *Negative Evidence* becomes overwhelming (we don't find bones for specific battles). If you lower Granularity (a "migration" rather than an "invasion"), Negative Evidence loses its bite, but the history becomes so vague it is trivial.
  *   **The Implication:** A theory must find a "sweet spot." If it demands too much specificity, it falsifies everything. If it demands too little, it verifies everything.

  ***

  ### Phase 4: The Workhorse Requirement

  You asked for the single requirement that does the most work in excluding popular positions.

  **The Winner: The Independence Constraint.**

  **Why it excludes popular positions:**
  1.  **It excludes the "Real Troy" Fallacy:** Many popular accounts argue: "Schliemann found Troy; therefore, the *Iliad* is history." The Independence Constraint blocks this immediately. Finding the *city* (Contextual Historicity) does not verify the *war* or the *heroes* (Event Historicity) unless the evidence for the war is independent of the poem. It prevents the background setting from validating the foreground plot.
  2.  **It excludes the "Pure Fiction" Fallacy:** Conversely, it blocks the view that "Because the *Iliad* contains gods and monsters, it contains no history." The Constraint demands we look for independent evidence of *something* (e.g., Hittite records of Ahhiyawa) without letting the poetic elements dictate the search. It forces the historian to separate the *referent* from the *representation*.

  **Philosophical Justification:**
  The Independence Constraint is the epistemic gatekeeper. It is the only requirement that strictly governs the *logic of justification* rather than the *content of the claim*. Without it, you are not doing history; you are doing literary criticism or apologetics. It forces the student to realize that finding a place, or even a name, is not the same as verifying a narrative.

  ### Summary for your Study
  When you read further on this problem, test every theory you encounter against these five requirements. If a theory claims the Exodus is history but cannot explain why the archaeological silence isn't fatal (violating **Negative Evidence Protocol**), or if it claims Arthur is myth simply because the sources are poetic (violating **Genre Neutrality**), you have identified a methodological weakness.

  The hardest part of your course will likely be navigating the tension between **Independence** and **Continuity**. That is where the debate between the "skeptics" and the "traditionalists" actually lives.
