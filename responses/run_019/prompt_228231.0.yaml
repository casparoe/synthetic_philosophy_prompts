  Money, creditworthiness, race, gender, mental disorder, planet, species, and quark rank from most to least socially constructed. To resolve the feedback problem, I treat looping effects as increasing constructedness because if the classificatory belief vanishes, the behavioral reality sustaining the kind dissolves; to distinguish substance from cut-lines, I weight the grouping logic over the substrate, so if the reason for clustering is human-dependent, the kind is constructed even if the physical stuff remains.

  Money tops the list because its value and function vanish entirely without collective intentionality, leaving only worthless paper or digits. Creditworthiness follows closely, separated from money by the fact that it tracks real past behaviors, though the metric itself dissolves without lending institutions. Race ranks third because its biological substrate is clinal and shallow, relying heavily on social feedback loops to maintain discrete groupings. Gender sits fourth, distinguished from race by a bimodal biological anchor in sex characteristics that persists even if social roles vanish. Mental disorder is fifth, as neurological dysfunction exists independently of diagnosis, though the normative categorization and symptom looping are belief-dependent. Planet ranks sixth because while orbital mechanics are mind-independent, the distinction between planet and dwarf planet is a conventional cut-line on a continuum. Species is seventh, being less constructed than planets because reproductive isolation creates natural, causal clusters rather than arbitrary size thresholds. Quarks are least constructed, as their properties and groupings are fundamental to physical reality regardless of any observer.
