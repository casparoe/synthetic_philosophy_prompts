      *   *Formal Constraints:* Transitivity is crucial. If A > B and B > C, then A > C. Without this, rational choice is impossible. *Status: Non-negotiable.*
      *   *Fixed Population:* If population is fixed, we need standard welfarism. Pareto (if everyone is better off, the state is better). Egalitarian concerns (maybe). Let's stick to Pareto and Dominance as core. *Status: Mostly Non-negotiable.*
      *   *Mere Addition:* Adding a life worth living without harming others shouldn't make things worse. This is the heart of the Repugnant Conclusion debate. *Status: Highly intuitive, but leads to RC.*
