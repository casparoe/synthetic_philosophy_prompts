answer: |-
  This is a request for a meta-axiological framework. You are asking for the criteria by which we judge the criteria. Given the seminal work of Gustaf Arrhenius and others in formal population ethics, we know that no theory can satisfy all plausible desiderata simultaneously. Therefore, an "adequate" theory is not one that meets every condition, but one that transparently prioritizes them.

  Below is a specification of the desiderata for a theory of population axiology, categorized by their function, followed by an analysis of their incompatibility and a recommendation for adjudication.

  ### I. Formal Constraints
  *These conditions ensure the theory functions as a rational guide for choice.*

  **1. Transitivity of the Better-Than Relation**
  *   **Specification:** If Outcome A is at least as good as Outcome B, and Outcome B is at least as good as Outcome C, then Outcome A must be at least as good as Outcome C.
  *   **Motivating Consideration:** Without transitivity, rational choice is impossible. If a theory yields cycles (A > B > C > A), an agent could be money-pumped or left without a determinate recommendation.
  *   **Status:** **Non-negotiable.** While some philosophers (e.g., Rachels) suggest our intuitions might be intransitive, a *theoretical system* intended to guide policy or moral judgment must resolve these cycles to function.

  **2. Completeness (Comparability)**
  *   **Specification:** For any two possible outcomes A and B, the theory must rank them as A better than B, B better than A, or equally good.
  *   **Motivating Consideration:** In non-identity cases or long-term policy planning, we often face choices between distinct populations. A theory that declares them "incomparable" offers no guidance.
  *   **Status:** **Non-negotiable** for a decision-guiding theory, though some pluralists argue for partial orderings.

  ### II. Fixed-Population Constraints
  *These conditions ensure the theory aligns with standard welfare ethics when population size is held constant.*

  **3. The Pareto Principle (Strong Dominance)**
  *   **Specification:** If Outcome A and Outcome B contain the exact same people, and everyone in A has higher well-being than in B, then A is better than B.
  *   **Motivating Consideration:** This is the bedrock of welfarism. If a change makes everyone better off and harms no one, it is an improvement.
  *   **Status:** **Non-negotiable.** Violating this undermines the link between well-being and value.

  **4. Egalitarian Sensitivity (Optional/Preference)**
  *   **Specification:** Given a fixed population and fixed total welfare, a more equal distribution of well-being is preferable to a less equal one.
  *   **Motivating Consideration:** The "Levelling Down" objection suggests pure egalitarianism is flawed, but most agree that, ceteris paribus, equality has some value (prioritarianism).
  *   **Status:** **Camp Preference.** Total Utilitarianism rejects this; Prioritarianism and Egalitarian Utilitarianism accept it.

  ### III. Variable-Population Constraints
  *These conditions address the core difficulty of changing population sizes.*

  **5. Non-Identity Solvency**
  *   **Specification:** The theory must yield a verdict in cases where different choices bring different people into existence (e.g., the "Risky Policy" case where a policy causes a future generation to exist with lower welfare than an alternative generation would have had).
  *   **Motivating Consideration:** Person-Affecting Views often struggle here, implying that creating a miserable child is not worse than creating a happy child if they are different individuals. An adequate theory must explain why we have reasons to prefer the happy generation even if no *particular* person is harmed by the choice.
  *   **Status:** **Non-negotiable.** A theory that falls silent on intergenerational justice is inadequate.

  **6. Weak Non-Sadism (Avoidance of the Sadistic Conclusion)**
  *   **Specification:** Adding a life with negative welfare (suffering > happiness) cannot make an outcome better, regardless of how many lives with positive welfare are also added.
  *   **Motivating Consideration:** The "Sadistic Conclusion" implies that adding a million lives of torture could be an improvement if it accompanies enough lives that are barely worth living. This violates the basic intuition that suffering is bad *for the sufferer*.
  *   **Status:** **Non-negotiable.** This is widely regarded as a stronger intuition than avoiding the Repugnant Conclusion.

  **7. Mere Addition (The Non-Elitism Condition)**
  *   **Specification:** Adding a group of people with lives worth living to a population, without affecting the welfare of the existing people, does not make the outcome worse.
  *   **Motivating Consideration:** If the new lives are good for those who live them, and no one else is harmed, it seems churlish to say the world is now worse. This is the intuition that drives the Total View.
  *   **Status:** **Contested.** This is the primary casualty in impossibility theorems.

  ### IV. Outcome Constraints (Conclusions to Avoid)
  *These are specific verdicts that serve as "reductio ad absurdum" tests.*

  **8. Avoidance of the Repugnant Conclusion**
  *   **Specification:** A very large population with lives barely worth living (Z) should not be ranked as better than a smaller population with excellent lives (A).
  *   **Motivating Consideration:** Intuitively, a world of flourishing beings is better than a world of masses merely scraping by, even if the total sum of welfare is higher in the latter.
  *   **Status:** **High Priority, but potentially incompatible.** Most philosophers desire this, but satisfying it often violates Transitivity or Mere Addition.

  **9. Avoidance of the Absurd Conclusion**
  *   **Specification:** A theory should not imply that a small loss in welfare for a large population is worse than the extinction of that population (or massive torture), simply to preserve a lexical threshold.
  *   **Motivating Consideration:** Lexical views (which prioritize quality over quantity absolutely) risk implying we should prevent minor headaches for billions even if it costs existence itself.
  *   **Status:** **Preference.** Lexical theorists argue this is a price worth paying; others view it as a dealbreaker.

  ### V. The Incompatibility Analysis

  You suspected that attractive desiderata cannot be jointly satisfied. You are correct. This is the substance of **Arrhenius's Impossibility Theorems**.

  **The Core Conflict:**
  It is formally impossible for a theory to satisfy **Transitivity**, **Mere Addition**, **Weak Non-Sadism**, and **Avoidance of the Repugnant Conclusion** simultaneously.

  *   **The Path to the Repugnant Conclusion:** If you accept **Transitivity** and **Mere Addition**, you are logically forced toward the **Repugnant Conclusion**. (If A+ is not worse than A, and B is not worse than A+, eventually a massive Z is better than A).
  *   **The Path to Intransitivity:** If you insist on **Avoiding the Repugnant Conclusion** and keeping **Mere Addition**, you often must sacrifice **Transitivity** (accepting that A > B, B > C, but C > A in long chains).
  *   **The Path to the Sadistic Conclusion:** Some Average Utilitarian variants avoid the Repugnant Conclusion but imply that adding lives with negative welfare can raise the average (if the existing average is lower), violating **Weak Non-Sadism**.

  **The "Killer" Constraint:**
  The requirement that eliminates the most theories is **Weak Non-Sadism** combined with **Transitivity**.
  *   **Average Utilitarianism** is eliminated because it can violate Non-Sadism (adding miserable people can raise a very low average).
  *   **Total Utilitarianism** is eliminated because it entails the Repugnant Conclusion.
  *   **Person-Affecting Views** are often eliminated because they fail **Non-Identity Solvency** (they cannot say creating a happy child is better than creating a miserable child if they are different people).

  ### VI. Recommendation: What to Relax

  To construct an adequate theory, one constraint must be relaxed.

  **Recommendation: Relax "Mere Addition."**

  **Reasoning:**
  1.  **Transitivity** is the foundation of rationality; without it, the theory cannot guide action.
  2.  **Weak Non-Sadism** is a moral floor; a theory that counts suffering as a potential good is fundamentally broken.
  3.  **Non-Identity Solvency** is required for the theory to apply to real-world policy (climate change, genetic selection).
  4.  **Mere Addition** is the weakest link. While intuitive in isolation, it relies on the assumption that value is strictly additive without diminishing marginal significance or critical thresholds. Relaxing it allows us to avoid the Repugnant Conclusion while maintaining rationality and basic moral safeguards.

  By relaxing Mere Addition, we accept that adding lives worth living *can* make an outcome worse if those lives are below a certain threshold of quality, even if existing people are unaffected. This blocks the slide toward the Repugnant Conclusion.

  ### VII. Adequate Families of Views

  Based on the desiderata above (prioritizing Transitivity, Non-Sadism, and Non-Identity Solvency, while relaxing Mere Addition to avoid the Repugnant Conclusion), the following families of views count as adequate:

  1.  **Critical-Level Utilitarianism (CLU):**
      *   **Mechanism:** Adds value only for lives above a "critical level" of welfare (set above "barely worth living").
      *   **Performance:** Satisfies Transitivity, Non-Sadism, and Non-Identity Solvency. Avoids the Repugnant Conclusion.
      *   **Cost:** Violates Mere Addition (adding a life worth living but below the critical level makes the outcome worse).

  2.  **Lexical Views (with soft thresholds):**
      *   **Mechanism:** Sufficiently good lives are lexically superior to lives merely worth living.
      *   **Performance:** Strongly avoids the Repugnant Conclusion. Satisfies Transitivity.
      *   **Cost:** Risks the Absurd Conclusion (minor losses to high-welfare people outweigh massive gains to lower-welfare people) and violates Mere Addition.

  3.  **Variable Critical-Level Views:**
      *   **Mechanism:** The critical level rises as the population grows or as average welfare rises.
      *   **Performance:** Attempts to balance the intuitions of CLU while mitigating the "Sadistic Conclusion" risk inherent in fixed high critical levels.
      *   **Cost:** Complexity and potential violation of Separability (independence of irrelevant alternatives).

  **Inadequate Views (based on this specification):**
  *   **Total Utilitarianism:** Fails due to the Repugnant Conclusion.
  *   **Average Utilitarianism:** Fails due to the Sadistic Conclusion and Non-Identity issues.
  *   **Strict Person-Affecting Views:** Fail due to Non-Identity Solvency (cannot condemn creating miserable people if they wouldn't otherwise exist).

  ### Summary for Adjudication
  When evaluating rival axiological views, do not ask if they avoid the Repugnant Conclusion *and* satisfy Mere Addition. Ask which constraint they sacrifice. An adequate theory must explicitly acknowledge that **Mere Addition** is false in the limit. If a proponent insists on Mere Addition, they must accept the Repugnant Conclusion. If they insist on avoiding the Repugnant Conclusion, they must accept that adding worthwhile lives can sometimes be value-neutral or negative. The former is a bullet many bite (Total View); the latter is the foundation of the most structurally robust theories (Critical-Level Views).
