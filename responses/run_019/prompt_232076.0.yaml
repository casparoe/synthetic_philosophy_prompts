prompt: |-
  I've been going back and forth with a friend for months about wether a much larger human population would be a good thing, and I've realized the argument never makes progress because we're using entirely different scorecards for what a theory of population value is even supposed to do. So I want to force the criteria to the surface before anyone gets to have an opinion about the yes/no.

  Here's what I'd like: write the list of requirements a theory that ranks populations by goodness must meet to count as adequate for judging whether a larger population is better. For each requirement, give the puzzle or judgment that motivates it — things like the Repugnant Conclusion (the idea that a vast population of lives barely worth living could come out better than a smaller population of excellent lives), the Mere Addition Paradox, the procreation asymmetry, the non-identity problem, and same-number cases where more total or more equal welfare should win. Then mark which of these are non-negotiable and which are just pet commitments of particular camps (totalists, averagists, person-affecting views, and so on), and say what you think separates the two. If some subset of the requirements turns out to be jointly unsatisfiable given the impossibility results in popultion axiology, that's the part I most want to see worked out — which demand has to give. Don't spend time scoring existing theories against the list; I want the criteria themselves, and I'll do the scorekeeping myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a list of requirements (criteria) for a theory of population value (population axiology) to be considered adequate for judging whether a larger population is better.
      *   **Context:** The user is debating a friend about whether a larger human population is good. They realize they lack shared criteria.
      *   **Specific Content:**
          *   List requirements.
          *   For each, provide the motivating puzzle/judgment (Repugnant Conclusion, Mere Addition, Procreation Asymmetry, Non-Identity, Same-Number cases, etc.).
          *   Classify requirements as "Non-Negotiable" (intuitive bedrock) vs. "Pet Commitments" (specific to Totalism, Averagism, Person-Affecting, etc.).
          *   Explain the distinction between the two classes.
          *   **Crucial:** Address impossibility results (which demands are jointly unsatisfiable and which must give).
          *   **Constraint:** Do *not* score existing theories against the list. Focus on the criteria and the structural tensions.

  2.  **Deconstruct the Subject Matter (Population Axiology):**
      *   This is a well-trodden field in philosophy (Parfit, Arrhenius, Temkin, etc.).
      *   Key concepts: Welfare, Existence, Identity, Aggregation.
      *   Key Paradoxes: Repugnant Conclusion, Mere Addition Paradox, Non-Identity Problem, Procreation Asymmetry, Sadistic Conclusion, Absurd Conclusion.
      *   Impossibility Theorems: Gustaf Arrhenius's work is central here. He proved that no theory can satisfy a set of seemingly plausible adequacy conditions simultaneously.

  3.  **Drafting the Requirements (The "Scorecard"):**
      *   I need to select the most prominent intuitions that drive the debate.
      *   *Requirement 1: Same-Number Quality.* If population size is fixed, more welfare is better. (Motivation: Basic utilitarian intuition).
      *   *Requirement 2: Non-Elitism / Avoid Repugnant Conclusion.* A huge population of low-quality lives shouldn't trump a small population of high-quality lives. (Motivation: Parfit's Repugnant Conclusion).
      *   *Requirement 3: Mere Addition.* Adding happy people without hurting others shouldn't make things worse. (Motivation: Mere Addition Paradox).
      *   *Requirement 4: Procreation Asymmetry.* We have reasons to avoid creating miserable people, but not strong reasons to create happy people. (Motivation: Common moral intuition about having kids).
      *   *Requirement 5: Non-Identity Sensitivity.* It matters *who* exists, not just *how many* or *how well*. (Motivation: Non-Identity Problem).
      *   *Requirement 6: Dominance / Pareto.* If everyone in A is better off than in B, and no one is worse off, A is better. (Motivation: Basic rationality).
      *   *Requirement 7: Equality/Justice.* Distribution matters, not just totals. (Motivation: Egalitarian intuitions).

  4.  **Classifying: Non-Negotiable vs. Pet Commitments:**
      *   *Challenge:* What is "non-negotiable"? In philosophy, almost nothing is truly non-negotiable if an impossibility theorem looms. However, some are *more* fundamental to the concept of "betterness" itself, while others are specific normative stances.
      *   *Non-Negotiable (Structural/Rational):* Transitivity, Dominance (Pareto), Same-Number Quality (usually). These are needed for *any* ranking system to function logically.
      *   *Pet Commitments (Substantive):* Repugnant Conclusion avoidance, Procreation Asymmetry, Mere Addition. These define *which* ethical framework you hold (Total vs. Average vs. Person-Affecting).
      *   *Refinement:* I need to be careful. Parfit argued the Repugnant Conclusion might actually be true, so avoiding it isn't strictly non-negotiable for a *true* theory, but it is non-negotiable for a *palatable* theory. The prompt asks for criteria to judge if a larger population is *better*. I should frame "Non-Negotiable" as "Conditions for Coherence" and "Pet Commitments" as "Conditions for Intuitive Acceptability."
      *   *Better Distinction:* "Formal Rationality Constraints" vs. "Substantive Moral Intuitions."
      *   *Even Better (aligning with prompt):* "Bedrock Rationality" (logic of ranking) vs. "Contested Moral Intuitions" (specific ethical weights).
      *   *Wait, the prompt asks:* "what you think separates the two." I need to take a stance.
      *   *Stance:* The separation lies between *conditions required for a coherent ordering* (Non-Negotiable) and *conditions required for the theory to match pre-theoretical moral intuitions* (Contested/Pet). However, given Arrhenius's impossibility results, even some "Bedrock" intuitions clash. So I must identify which ones are the "break points."

  5.  **Addressing Impossibility Results (The Core Task):**
      *   Gustaf Arrhenius's Impossibility Theorems are the gold standard here.
      *   He showed that you cannot satisfy: Dominance, Non-Elitism (No Repugnant Conclusion), Mere Addition, and others simultaneously.
      *   I need to explicitly state: "You cannot have it all."
      *   Which demand has to give? Usually, it's either Accepting the Repugnant Conclusion (Totalism) or Rejecting Transitivity/Mere Addition (Non-Standard Logics).
      *   I need to highlight the trade-off: Coherence vs. Intuition.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the meta-ethical stalemate. Define the goal (Population Axiology adequacy conditions).
      *   **The Scorecard (Requirements):** List them with motivations.
      *   **Classification:** Divide into "Structural Necessities" (Non-Negotiable for *any* ranking) and "Substantive Intuitions" (Contested).
      *   **The Impossibility Crunch:** Explain Arrhenius's results. Show which constraints conflict.
      *   **The Verdict:** Which demand must give? (Usually Non-Elitism or Transitivity).
      *   **Conclusion:** Advice on how to use this for the debate.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Don't just list "Transitivity." List "Same-Number Quality" as that's more specific to the population debate.
      *   *Correction:* Ensure "Non-Identity" is handled correctly. It's often a problem for Person-Affecting views, not necessarily a requirement for a theory to *solve*. The requirement is "Identity-Independence" (the value of an outcome doesn't depend on *who* is in it, just how well off they are).
      *   *Correction on Classification:* Is avoiding the Repugnant Conclusion non-negotiable? Many totalists say "Yes, it's actually true." So I should classify it as a "Substantive Intuition" that is widely held but theoretically costly.
      *   *Impossibility:* Be precise. Arrhenius proved that at least one of six adequate conditions must be violated. I should summarize the core conflict: Total Welfare vs. Average Welfare vs. Existence.
      *   *Prompt Check:* "Mark which of these are non-negotiable and which are just pet commitments... and say what you think separates the two." I need to be decisive here.
      *   *Decision:* Non-Negotiable = Logical coherence (Transitivity, Reflexivity) + Minimal Dominance. Pet Commitments = Specific intuitions about welfare aggregation (Repugnance, Asymmetry, Mere Addition).
      *   *Wait, one more thing:* The prompt asks "which demand has to give." I need to identify the specific tension. Usually, it's the combination of *Mere Addition* + *Non-Elitism* + *Transitivity*.

  8.  **Final Polish:**
      *   Tone: Analytical, philosophical, neutral but decisive on the structural limits.
      *   Formatting: Clear headings, bullet points for the list.
      *   Check against constraints: No scoring existing theories. Focus on criteria and impossibility.

  9.  **Drafting the Impossibility Section:**
      *   Reference Arrhenius.
      *   The "Trilemma": You can keep Transitivity and Mere Addition but get Repugnant Conclusion. Or keep Non-Elitism and Mere Addition but lose Transitivity (cyclical preferences). Or keep Transitivity and Non-Elitism but reject Mere Addition (Negative Utilitarianism or Critical Level).
      *   Most philosophers sacrifice "Avoid Repugnant Conclusion" (accepting Totalism) or "Mere Addition" (accepting Critical Level views).

  10. **Final Review against Prompt:**
      *   List requirements? Yes.
      *   Motivating puzzle for each? Yes.
      *   Mark Non-Negotiable vs. Pet? Yes.
      *   Explain separation? Yes.
      *   Work out impossibility/which demand gives? Yes.
      *   No scoring theories? Yes.

  (Proceed to generate output based on this plan.)
answer: |-
  This is the correct move. Debates about population size inevitably stall because one person is arguing from **Total Utilitarianism** (more good lives = more good), while the other argues from **Person-Affecting** or **Averagist** intuitions (lives must be good *for someone*, or quality matters more than quantity). Without agreeing on what a "successful" theory looks like, you are speaking different languages.

  Below is a scorecard of adequacy conditions for population axiology. These are the criteria any theory must confront to claim it can judge whether a larger population is better.

  ### I. The Scorecard: Adequacy Conditions

  #### 1. Same-Number Quality
  *   **The Requirement:** If two populations have the exact same number of people, the one with higher total (or average) welfare is better.
  *   **Motivating Judgment:** Basic Pareto intuition. If we are comparing World A (1 billion people, all very happy) and World B (1 billion people, all slightly less happy), and no one exists in one who doesn't in the other, World A is clearly better.
  *   **Classification:** **Non-Negotiable.**
  *   **Reasoning:** Without this, the theory cannot rank outcomes even in fixed-population cases. It is the bedrock of consequentialist evaluation.

  #### 2. Dominance (Pareto for Existing People)
  *   **The Requirement:** If outcome A is better than outcome B for at least one person, and worse for no one, A is better than B.
  *   **Motivating Judgment:** Rational efficiency. It is hard to argue that making someone better off without harming anyone makes the world worse.
  *   **Classification:** **Non-Negotiable.**
  *   **Reasoning:** Violating this makes the theory paternalistic or irrational in standard decision-theoretic terms.

  #### 3. Non-Elitism (The "No Repugnant Conclusion" Constraint)
  *   **The Requirement:** A very large population of lives barely worth living cannot be better than a smaller population of very high-quality lives.
  *   **Motivating Puzzle:** **The Repugnant Conclusion.** Total Utilitarianism implies that for any population of excellent lives, there is a *larger* population of lives barely worth living that is "better" because the total sum of welfare is higher. Most people find this intuition-revolting.
  *   **Classification:** **Pet Commitment (Widely Shared).**
  *   **Reasoning:** While almost everyone shares this intuition initially, some philosophers (Totalists) argue we should "bite the bullet" and accept the Repugnant Conclusion rather than break mathematical coherence. It is a substantive moral claim, not a logical necessity.

  #### 4. Mere Addition
  *   **The Requirement:** Adding new people with lives worth living, without affecting the welfare of existing people, does not make the outcome worse.
  *   **Motivating Puzzle:** **The Mere Addition Paradox.** If you add happy people to a world, and it doesn't hurt the originals, how can the world be worse? However, if you accept this repeatedly, you are forced down a slippery slope toward the Repugnant Conclusion.
  *   **Classification:** **Pet Commitment.**
  *   **Reasoning:** Person-Affecting views often reject this (adding people doesn't benefit *anyone* who would otherwise exist). Critical-Level views reject this (lives must be above a certain threshold to add value). Rejecting it is costly but logically possible.

  #### 5. Procreation Asymmetry
  *   **The Requirement:** We have a strong moral reason *not* to create a person who would have a miserable life, but we do not have a similarly strong moral reason *to* create a person who would have a happy life.
  *   **Motivating Puzzle:** **The Non-Identity/Asymmetry Problem.** If you choose to have a child who will suffer, you harmed them. If you choose *not* to have a child who would have been happy, you didn't harm anyone (because that specific child never exists). Most people feel the duty to avoid suffering is stronger than the duty to create happiness.
  *   **Classification:** **Pet Commitment.**
  *   **Reasoning:** Total Utilitarianism explicitly rejects this (a happy life adds positive value, so you have a reason to create it). Accepting asymmetry requires complex theoretical machinery (like Person-Affecting Restrictions).

  #### 6. Identity-Independence
  *   **The Requirement:** The value of an outcome depends on the welfare levels of the people in it, not on *which* specific individuals exist.
  *   **Motivating Puzzle:** **The Non-Identity Problem.** If a policy choice changes *who* is born (e.g., delaying conception changes the sperm/egg combination), standard Person-Affecting views struggle to say the policy is wrong if the resulting child has a life worth living, even if that child is worse off than the alternative child would have been.
  *   **Classification:** **Non-Negotiable (for Impartial Theories).**
  *   **Reasoning:** If a theory relies on identity, it cannot handle climate change or resource depletion cases where policy choices determine the identities of future people. To be useful for public policy, the theory must be identity-independent.

  #### 7. Transitivity
  *   **The Requirement:** If Population A is better than B, and B is better than C, then A must be better than C.
  *   **Motivating Judgment:** Logical consistency. If you prefer A to B and B to C, but prefer C to A, you can be "money-pumped" (tricked into irrational cycles).
  *   **Classification:** **Non-Negotiable.**
  *   **Reasoning:** A theory that violates transitivity cannot guide action. It creates decision paralysis.

  ---

  ### II. The Separation: What Distinguishes the Two Classes?

  The distinction between **Non-Negotiable** and **Pet Commitments** lies in the difference between *structural coherence* and *substantive moral intuition*.

  1.  **Non-Negotiable (Structural):** These are requirements for the theory to function as a *ranking system* at all. If you violate Transitivity or Dominance, you aren't just proposing a controversial ethics; you are proposing a broken logic. You cannot make a decision based on a theory that says A > B, B > C, and C > A.
  2.  **Pet Commitments (Substantive):** These are requirements for the theory to match our *pre-theoretical gut feelings*. The Repugnant Conclusion feels wrong. Asymmetry feels right. But these are empirical claims about human moral psychology, not logical laws. A theory can be logically perfect but violate these (e.g., Classical Total Utilitarianism is logically robust but violates Non-Elitism and Asymmetry).

  **The Trap:** In population ethics, people often treat their Pet Commitments (like avoiding the Repugnant Conclusion) as Non-Negotiable. This is why your debate stalls. You are likely treating "Avoid Repugnance" as a law of logic, while your friend might be treating "Maximize Total Good" as a law of logic.

  ---

  ### III. The Impossibility Result: Which Demand Must Give?

  This is the most critical part of your preparation. You need to know that **you cannot satisfy all these requirements simultaneously.**

  Gustaf Arrhenius, a leading philosopher in this field, has proven multiple **Impossibility Theorems**. He demonstrated that no population axiology can satisfy a set of seemingly plausible adequacy conditions (including the ones listed above) without contradiction.

  **The Core Conflict:**
  You cannot simultaneously hold:
  1.  **Transitivity** (Logical consistency)
  2.  **Mere Addition** (Adding happy lives doesn't make things worse)
  3.  **Non-Elitism** (Avoid the Repugnant Conclusion)
  4.  **Dominance** (If everyone is better off, the world is better)

  **Which Demand Has to Give?**
  Since a theory *must* be logically coherent to function, **Transitivity** is the hardest to sacrifice. If you sacrifice Transitivity, your theory cannot guide action (you can't choose between options). **Dominance** is also extremely difficult to sacrifice without embracing irrationality.

  Therefore, in any workable theory, one of the **Pet Commitments** must break. You have three main paths, and you must choose one for your debate to proceed:

  1.  **Sacrifice Non-Elitism (Accept the Repugnant Conclusion):**
      *   *Theory:* Classical Total Utilitarianism.
      *   *Cost:* You must admit that a world of quadrillions of people living in mild discomfort is "better" than a world of billions living in bliss, provided the total math works out.
      *   *Benefit:* Satisfies Mere Addition, Dominance, and Transitivity.

  2.  **Sacrifice Mere Addition (Accept "Negative" Addition):**
      *   *Theory:* Critical-Level Utilitarianism or Negative Utilitarianism.
      *   *Cost:* You must admit that adding a happy person *can* make the world worse (if their welfare is below a certain "critical" threshold, even if their life is still worth living). This violates the intuition that "happy existence is always a gain."
      *   *Benefit:* Avoids the Repugnant Conclusion while keeping Transitivity.

  3.  **Sacrifice Transitivity (Accept Cyclical Rankings):**
      *   *Theory:* Some forms of Egalitarianism or Vague Value.
      *   *Cost:* You admit that sometimes A > B, B > C, and C > A.
      *   *Benefit:* Preserves strong intuitions about equality and Non-Elitism.
      *   *Verdict:* Most philosophers reject this because it renders the theory useless for policy.

  ### IV. How to Use This in Your Debate

  Do not ask your friend "Is a larger population better?" Ask your friend: **"Which impossibility bullet are you willing to bite?"**

  Force them to rank the Pet Commitments.
  *   If they say "Avoiding the Repugnant Conclusion is absolute," ask them if they are willing to accept that adding a happy person could make the world worse (Violating Mere Addition).
  *   If they say "Total Welfare is absolute," ask them if they are willing to accept that a world of barely-livable lives is superior to a world of excellence (Violating Non-Elitism).
  *   If they say "We must not harm existing people" (Person-Affecting), ask them how they handle the Non-Identity Problem regarding climate change or resource depletion (Violating Identity-Independence).

  **The Conclusion for Your Debate:**
  The question "Is a larger population better?" has no answer independent of the scorecard.
  *   If your scorecard prioritizes **Total Welfare**, the answer is generally **Yes** (until resources constrain welfare).
  *   If your scorecard prioritizes **Average Welfare** or **Non-Elitism**, the answer is generally **No** (diminishing returns on quality).
  *   If your scorecard prioritizes **Person-Affecting Views**, the answer is **It Depends** (on whether the new people harm the old ones).

  The progress you seek will only happen when you both agree on which **Pet Commitment** is expendable. The impossibility theorems prove you cannot keep them all. One of your intuitions is wrong, or at least, incompatible with the others. Find out which one it is.
