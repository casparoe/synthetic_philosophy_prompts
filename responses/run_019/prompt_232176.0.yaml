answer: |-
  Here is a 50-minute lesson plan designed to maximize dialectical clarity while minimizing metaphysical jargon.

  ### 1. The Sequence of Concepts (0–15 Minutes)
  **Goal:** Establish the target before firing the weapon. If you introduce Black's spheres before defining the constraints on "properties," the example will fail.

  *   **Minutes 0–5: IoI vs. PII.**
      *   Start with the **Indiscernibility of Identicals (IoI)**. Use a concrete example (e.g., "Clark Kent is Superman"). If they are identical, they share *every* property. This is logically uncontroversial.
      *   Contrast with the **Identity of Indiscernibles (PII)**. This is the converse: If two things share *every* property, they are identical (i.e., there cannot be two distinct things that share every property).
      *   *TA Move:* Write both on the board. Circle PII. Tell them: "IoI is logic. PII is metaphysics. Today we are stress-testing PII."

  *   **Minutes 5–15: The "Property" Filter.**
      *   Before introducing the spheres, you must restrict what counts as a property. If students can use "being identical to $a$" or "being named $a$" as properties, PII is trivially true and Black's example is dead on arrival.
      *   Introduce the distinction between **Purely Qualitative Properties** (intrinsic nature, shape, mass, color, relational distance) and **Haecceities/Individual Concepts** (being identical to $a$, being located at absolute coordinate $x$, being named 'Sphere 1').
      *   *TA Move:* Stipulate for the sake of the argument that PII is only interesting if it relies on *purely qualitative* properties. Tell them: "If you have to point to the object to describe the property, it doesn't count for PII."

  ### 2. Deploying Black's Universe (15–35 Minutes)
  **Goal:** Present the counterexample in a way that inoculates against the "location" objection.

  *   **Minutes 15–25: The Setup.**
      *   Describe the universe: Nothing exists except two iron spheres.
      *   **Crucial Detail:** They are exactly alike in all intrinsic qualitative properties (diameter, mass, temperature, color).
      *   **Crucial Detail:** The universe is symmetric. There is no background grid, no "left" or "right," no "center." There is only the distance *between* them.
      *   Ask the class: "Do these spheres share all purely qualitative properties?" (They should agree: Yes. Even relational properties like 'being 10 miles from the other sphere' apply to *both* symmetrically).
      *   Ask: "Are they numerically distinct?" (Intuition says: Yes, there are two of them).
      *   *Conclusion:* If they are distinct but share all properties, PII is false.

  *   **Minutes 25–35: The "Naming" Trap.**
      *   Students will want to name them 'A' and 'B' to distinguish them.
      *   *TA Move:* Stop this immediately. Explain that naming is an act of the observer, not a property of the object. "Being named 'A'" is not a property the sphere possesses in the empty universe; it is a relation between the sphere and *us*. Since PII is about the metaphysics of the objects, not our epistemology, names don't count.

  ### 3. Head-Off Misconceptions (35–45 Minutes)
  **Goal:** Anticipate the two major objections and neutralize them using the groundwork laid in Phase 1.

  *   **Misconception 1: "But they are in different places."**
      *   *When to head it off:* As soon as the setup is described (Minute 20), but expect it to resurface here.
      *   *The Fix:* Remind them of the "Property Filter." Absolute position ("being at coordinate x") is not a purely qualitative property; it presupposes a background space (Newtonian absolute space) which Black stipulates does not exist.
      *   *Dialectic:* If a student says, "One is here, one is there," ask: "Here relative to what?" If the only other object is the other sphere, then 'being 10 miles from the other sphere' is a property *both* share. There is no 'left' sphere or 'right' sphere without an observer.

  *   **Misconception 2: "This is just about whether *we* can tell them apart."**
      *   *When to head it off:* During the PII definition (Minute 5) and reinforce here.
      *   *The Fix:* Distinguish **Epistemic** indiscernibility (we can't tell them apart) from **Ontic** indiscernibility (there is no fact of the matter that makes them different).
      *   *TA Move:* Use the twin analogy. "If you have identical twins, they are epistemically hard to distinguish, but ontically distinct (different DNA, different location). Black's spheres are ontically indiscernible. The question isn't 'Can we see the difference?' it's 'Is there a difference to be seen?'"

  ### 4. Assessment & Exclusions (45–50 Minutes)
  **Goal:** Verify understanding and protect the scope.

  *   **The "Leave Out" List:**
      *   **Haecceities:** Do not use this term. It confuses first-years. Stick to "individual properties" or "properties that require pointing."
      *   **Quantum Mechanics:** Do not mention bosons/fermions. It muddies the metaphysical water with physics.
      *   **Leibniz's Theology:** Do not discuss why Leibniz believed PII (Principle of Sufficient Reason). It's a distraction.

  *   **The Final Question:**
      *   Do not ask: "What is Black's argument?" (Tests memory).
      *   Do not ask: "Is PII true?" (Tests opinion).
      *   **Ask this:** *"Suppose a defender of PII wants to save the principle from Black's counterexample without denying that the spheres are distinct. What specific restriction must they add to the definition of 'property' to make PII true again?"*
      *   **Why this works:** To answer correctly, they must recognize that Black's attack works because the spheres share all *qualitative* properties. To save PII, one must either (a) deny the spheres are distinct (collapse them into one), or (b) admit that "being distinct" itself implies a property (haecceity) that they *don't* share. If they suggest restricting PII to *intrinsic* properties only (excluding relations), they show they understand the symmetry of Black's relations. If they suggest PII only applies to concepts, not objects, they understand the epistemic/ontic divide.

  ### Summary of Risks
  Is Black's example right for first-years? **Yes, but it is fragile.**
  *   **Risk:** It invites the "location" objection so strongly that the section can devolve into a debate about Newtonian vs. Relational space.
  *   **Mitigation:** You must stipulate the nature of the space *before* they object. Tell them: "Imagine a universe with no background grid, only the two objects." If they persist on absolute location, grant it for the sake of argument but note that it requires a metaphysical commitment (Absolute Space) that many philosophers reject. This turns the objection into a lesson on metaphysical commitments rather than a "gotcha" against Black.

  ### TA Cheat Sheet for the Board
  1.  **IoI:** $x = y \rightarrow \forall P (Px \leftrightarrow Py)$ (Uncontroversial)
  2.  **PII:** $\forall P (Px \leftrightarrow Py) \rightarrow x = y$ (The Target)
  3.  **Constraint:** $P$ must be **Purely Qualitative** (No names, no "being identical to $x$").
  4.  **Black's Move:** Two spheres, all $P$ match, yet $x \neq y$.
  5.  **Conclusion:** PII is False (unless we change the definition of $P$).
