  **3. The Force of Counterexamples (Weight: 0.20)**
  *   **The Question:** Do cases like the amoralist or the severely depressed person settle the debate against internalism?
  *   **Internalist Answer:** No. These are edge cases or explainable via false beliefs/lack of imagination.
