  **What Would Shift Me**
  To move my number significantly, I'd need one of two things:
  1.  **For Internalism (Up):** A robust account of 'sound deliberation' that generates moral reasons from purely subjective starting points without presupposing normative truths. If you could show me exactly how a selfish agent *must* arrive at altruistic reasons through procedural rationality alone, I'd bump my credence up.
