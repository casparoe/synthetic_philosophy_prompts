  **2. The Integrity of 'Sound Deliberation' (Weight: 0.30)**
  *   **The Question:** Can the route of 'sound deliberation' be spelled out without secretly importing objective values?
  *   **Internalist Answer:** Yes. We can define rational deliberation procedurally.
  *   **My Credence in Internalist Answer:** 0.40.
