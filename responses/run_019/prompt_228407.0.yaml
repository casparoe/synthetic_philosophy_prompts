answer: |-
  ### Logical Space Preface
  Before printing, note that the logical space of solutions is constrained by the theorem: $\neg (ML \land WP \land UD)$. You cannot keep all three.
  *   **Incoherent Combination:** "Outcome Rights" + "No Waivers" + "Pareto Valid" + "Transitive Social Order." This is the paradox itself; it is not a solution, it is the explosion.
  *   **Unattractive Combination:** "Restricted Domain" + "Pareto Valid." This solves the math but bans moral disagreement from politics.
  *   **Unexplored Combination:** "Game-Form Rights" + "Accept Cycling." Most game-form theorists insist their rights prevent cycles; exploring a game-form that allows local cycling is rare.

  ***

  ### The Liberal Paradox Decision Tree

  ```text
  START: You accept Sen's proof that ML + WP + UD is inconsistent.

  Q1. THE DOMAIN QUESTION
      In the Prude/Lewd case, does Prude's disgust at Lewd's reading count 
      as a valid preference for social welfare, or is it "meddlesome noise"?
      |
      +-- [NO: It's noise] --> LEAF 1: RESTRICTED DOMAIN (Blair/Muller)
      |   Cost: You must politically ban legitimate moral concerns from 
      |   aggregation, effectively censoring the "meddlesome."
      |
      +-- [YES: It counts] --> Q2

  Q2. THE OBJECT OF RIGHTS
      Does Prude's right protect his *own action* (not reading) or the 
      *social state* (Lewd not reading)?
      |
      +-- [ACTION] --> LEAF 2: GAME-FORM LIBERTY (Nozick/Gauthier)
      |   Cost: Rights protect your move, not the outcome; your liberty can 
      |   be rendered worthless by others' choices without violation.
      |
      +-- [STATE] --> Q3

  Q3. THE PARETO CONFLICT [USE PRUDE/LEWD]
      If Lewd wants to read and Prude (privately) prefers Lewd reads to 
      avoid waste, does their unanimous preference override Prude's right 
      to forbid it?
      |
      +-- [YES: Pareto Wins] --> LEAF 3: PARETO SUPREMACY (Harsanyi-ish)
      |   Cost: Private spheres are contingent; rights dissolve whenever 
      |   the meddler and the agent accidentally agree.
      |
      +-- [NO: Right Wins] --> Q4

  Q4. THE WAIVER QUESTION
      Can Prude sell or waive his veto power to Lewd (e.g., for a fee) to 
      resolve the cycle?
      |
      +-- [YES] --> Q5
      |
      +-- [NO] --> Q6  **[TRAP NODE]** 
          (Warning: The "natural" liberal intuition is No, but without 
          waivers or cycling, you have no solution left.)

  Q5. WAIVER SCOPE
      Does waiving the right transfer the power permanently, or just 
      suspend it for this choice?
      |
      +-- [TRANSFER] --> LEAF 4: GIBBARD'S WAIVABLE RIGHTS
      |   Cost: Fundamental liberties become commodities subject to 
      |   coercive bargaining and wealth effects.
      |
      +-- [SUSPEND] --> LEAF 5: CONDITIONAL LIBERALISM (Sen's later view)
      |   Cost: Rights become context-dependent rules rather than 
      |   trumps, requiring complex meta-agreement to trigger.
      |
  Q6. PREFERENCE MALLEABILITY
      Is the paradox a failure of institutions, or of Prude's adaptive 
      preferences (should he just not care)?
      |
      +-- [FAILURE OF PREFS] --> LEAF 6: ADAPTIVE PREFERENCE REVISION
      |   Cost: Resolves the math by engineering citizen psychology, 
      |   risking paternalistic indoctrination.
      |
      +-- [FAILURE OF INSTITUTIONS] --> Q7

  Q7. SOCIAL RATIONALITY
      Must social choice be transitive (no cycles), or can society be 
      "rational" while cycling forever between states?
      |
      +-- [MUST BE TRANSITIVE] --> LEAF 7: REJECT MINIMAL LIBERALISM
      |   Cost: You must abandon the idea that individuals have any 
      |   decisive private sphere in a rational collective order.
      |
      +-- [CYCLING OK] --> LEAF 8: ACYCLICAL SOCIAL CHOICE
          Cost: Society has no stable "will," making long-term planning 
          theoretically impossible even with perfect information.
  ```

  ***

  ### Instructor Notes & Flags

  **1. The Indistinguishable Leaves**
  *   **Leaf 2 (Game-Form)** and **Leaf 4 (Gibbard's Waiver)** are functionally closer than their proponents admit. Both dissolve the paradox by denying that rights guarantee *outcomes*. In Game-Form, the outcome isn't guaranteed by definition; in Waiver, the guarantee is traded away.
  *   **Splitting Question:** "If Lewd reads despite Prude's right, was a right *violated* (Game-Form says No, Waiver says Yes but forgiven)?" This distinction matters for legal liability, but not for the social choice outcome.

  **2. The Trap Node (Q4)**
  *   I have marked **Q4 [NO]** as the trap. The "natural" intuition for a rights-absolutist is that rights cannot be sold (No Waiver) and must protect outcomes (Q2 State) and trump Pareto (Q3 Right Wins).
  *   If a student takes this path, they are forced down to Q6/Q7. If they then insist on Transitivity (Q7 Yes), they land on **Leaf 7 (Reject Liberalism)**. This forces them to realize that "Absolute Outcome Rights" is logically equivalent to "No Liberalism" in a social choice framework.

  **3. Printing Instructions**
  *   This text is formatted to fit on a single A4/Letter page if printed in 10pt monospace font with 0.5" margins.
  *   The "Cost" sentences are designed to be read aloud when a student lands on a leaf to provoke debate.
