answer: |-
  1. Sequencing
  Start with a brief refresh on Newcomb's Problem (5 mins) to activate prior knowledge about predictors, but explicitly bracket the one-box/two-box debate. The crucial prerequisite is the distinction between causal influence and evidential correlation. Students must understand that in Death in Damascus, the agent cannot causally influence the prediction (it's past), but their choice is evidentially correlated with it. Before posing the puzzle, establish the principle of "Maximizing Expected Utility" (MEU) as the default rational standard they hold. Then, introduce the case. The sequence must move from "How do we calculate utility?" to "Why does every calculation undermine itself?" Do not dive into formal causal graphs yet; keep it intuitive. The dependency is clear: without grasping that the prediction is fixed but unknown, the paradox collapses into simple uncertainty. Without grasping MEU, the instability of the choice doesn't matter. Ensure they understand that rationality usually implies a unique best option. The tutorial should flow from standard application of MEU to the breakdown of that application. If they don't see MEU as the norm, the failure won't seem significant. Spend the first ten minutes solidifying the Newcomb comparison. This ensures they see the structural similarity before noticing the crucial divergence.

  2. The carrying example
  Use the original Death story. The supernatural element is not a bug but a feature; it ensures the predictor's infallibility is accepted without quibbling about human error. A human forecaster invites doubts about accuracy that distract from the structural problem. However, strip away any mythological baggage about *why* Death knows; stipulate infallibility as a brute fact. The story must contain the specific mechanic: Death is where you will be. It must lack any possibility of escape beyond the two options (Damascus/Aleppo). The atmospheric details of inevitability help students feel the rational anxiety—the "dread" of deliberation. If you abstract it too much (e.g., "Box A vs. Box B"), students treat it as a math puzzle. If you keep the narrative of fleeing fate, they feel the practical rationality failure. The key is to maintain the tension between the fixed past prediction and the open future choice. The stakes must be life and death to make the irrationality palpable. Avoid adding third options like "hiding," which dilutes the binary constraint essential for the paradox. Consider using a simple board diagram showing the two locations and Death's position relative to the agent's choice to visualize the correlation.

  3. The misconception map
  First, immediately after presenting the case, students will claim the setup is contradictory ("If he goes to Aleppo, Death wasn't there"). Head this off by stipulating logical possibility: we are exploring the implications of such a predictor existing, not debating metaphysics. Accept the premise as given for the sake of argument. Second, during the utility calculation phase, someone will suggest randomizing (flipping a coin). Address this after the first pass of expected utility. Explain that if Death predicts randomization, Death goes to the location the coin will land, or that randomization doesn't solve the evidential link because the decision procedure itself is predictable. Third, midway through, someone will say "This is just One-Box Newcomb." Correct this by highlighting the payoff structure: in Newcomb, one choice dominates evidentially; here, *every* choice evidentially signals doom. In Newcomb, you can be happy with your choice after making it. In Damascus, you regret any choice upon making it. Finally, ensure they don't think staying is brave. The point is instability. If you decide to stay, you should have fled. If you decide to flee, you should have stayed. Map these misconceptions to the timeline: metaphysics first, strategy second, classification third. This prevents the discussion from stalling on irrelevant objections. Emphasize that the core confusion is treating this as an epistemic problem (what do I know?) rather than a decision-theoretic one (what makes a choice stable?). Watch for fatalism; remind them the agent chooses, but rationality cannot guide them.

  4. The check for understanding
  Ask: "Suppose the man adopts a specific decision rule, like 'Always go to Aleppo.' Can Death predict this? If so, what does that imply about the rationality of adopting any decision rule at all?" This forces them to see that the problem isn't the action, but the deliberation process itself. It shifts focus from the outcome (death) to the structural failure of decision theory. A correct answer will note that any rule becomes self-defeating evidence. If they only say "He dies either way," they missed the point about rational choice instability.

  5. Deliberate omissions
  Omit formal discussions of "ratifiability" and causal graph topology. These are solutions, not the problem. Mentioning them now suggests there is an easy fix. Also, skip deep game-theoretic mixed strategies. Explicitly tell the class: "We are stopping at the paradox, not solving it. I am leaving out the technical fixes philosophers propose because I want you to feel the break in rationality first." This frames the omission as pedagogical, not ignorance. It keeps the focus on the phenomenology of deliberation rather than formal remediation. By withholding the solution, you preserve the tension that makes the case philosophically significant.
