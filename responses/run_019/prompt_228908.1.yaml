answer: |-
  The silence in the car was heavy, still vibrating with the echo of Mom's voice snapping, "I don't need you hovering!" She'd never spoken to me like that before.

  "Was that her?" I asked, gripping the steering wheel. "Or was that the disease?"

  Sarah, riding shotgun, turned to me. She's an endurantist. "It was her, fully. She's wholly present right now, just like she was when she baked us cookies last year. The same substance is enduring through change."

  Mark, in the back, leaned forward. He's a perdurantist. "But 'her' is a big word. You're treating her like a 3D object moving through time. I see her as a 4D worm. The stage we just saw—the irritable one—is a later temporal part. The cookie-baking stage was an earlier part. They're both her, but they're different slices of the same spacetime entity."

  "That sounds horrifying," I said. "Like she's dead already, and we're just watching the reel."

  "Not dead," Mark corrected gently. "Just extended. Think of a road. The rough patch doesn't negate the smooth pavement back at the start. They're both parts of the road."

  "But how can she be *kind* and *cruel* if she's the same thing?" I asked. "That's a contradiction."

  Sarah jumped in. "That's the problem of temporary intrinsics. But it's not a contradiction if you index the properties. She isn't 'kind' simpliciter. She is 'kind-at-t1' and 'irritable-at-t2'. The core person remains the same subject bearing different properties at different times. She hasn't fragmented; she's just aging."

  "Does that help you?" Mark asked me. "Because it feels like you're trying to hold onto a ghost. If she's wholly present now, then this irritability is who she is *now*. The kind mom is gone."

  "She's not gone!" Sarah snapped. "She's right there. The dementia obscures her, it doesn't replace her."

  "See," Mark said to me, "that's where the worm view might actually relieve some pressure. You promised you'd never put her in a home. But who did you promise? The early-stage mom? If she's a worm, you promised the whole extended entity. Caring for the later, difficult stages is just fulfilling the trajectory of the whole worm. You aren't failing the 'kind mom'; you're caring for the 'later mom' segment of the same person."

  I frowned. "So I don't owe the promise to the person she was?"

  "You owe it to the continuity," Mark said. "The promise binds the stages together."

  "But that feels cold," I said. "If I'm caring for a 'later stage,' am I allowed to miss the 'earlier stage'? Am I allowed to feel like I'm losing her?"

  Sarah reached over and touched my arm. "You're losing her capacities, not her identity. Under my view, you love the substance. Even if the substance is damaged, it's still her. Your grief is valid because you're watching someone you love suffer, not because she's been replaced."

  "But if she's replaced..." Mark started.

  "She's not!" I said sharply.

  "I'm not saying she's replaced like a broken part," Mark said softly. "I'm saying your relationship is changing because *she* is changing. If you view her as a worm, you can accept that the relationship you had with the 2020-stage is over, and you're building a relationship with the 2024-stage. It allows you to grieve the past without denying the present."

  "Does that make it easier?" Sarah asked me. "To think of her as segments?"

  "No," I admitted. "It makes me feel like I'm cataloging a decline rather than supporting a person. But..." I paused. "If she's wholly present, like you say, Sarah, then this irritability is her. And that hurts more. It means the mom I knew is currently capable of being cruel to me."

  "Or," Sarah said, "it means the mom you knew is currently trapped in frustration she can't articulate. The 'wholeness' includes her history, even if she can't access it."

  Mark sighed. "I worry that endurantism makes you feel like you're failing her when she acts out. Like the 'real her' should be able to stop it. Perdurantism says this behavior is just what this part of the worm does. It's not a failure of character; it's a feature of this temporal segment."

  "So which view is more humane?" I asked.

  "Maybe neither," Sarah said. "Maybe they're just maps. The territory is just... your mom."

  "Exactly," Mark added. "But if the worm view stops you from feeling guilty that the 'old mom' is disappointed in you, maybe it's useful. You're not letting her down. You're just driving through a rough patch of the road."

  I looked in the rearview mirror. The road behind us was smooth. The road ahead was gravel.

  "I don't know if I care about the metaphysics," I said. "I just know I have to go back next week."

  "We know," Sarah said. "And we'll be there. Whichever her we meet."
