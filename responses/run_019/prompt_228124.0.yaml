  ### Analysis of Your Epistemic Principle

  Your verdicts reveal a coherent, robust framework that is essentially a modernized, Bayesian formulation of **Hume's maxim on miracles**, refined by a distinction between *statistical anomalies* (medicine) and *fundamental law violations* (physics/metaphysics). You do not weigh testimony in a vacuum; you weigh it against the **prior probability of the event's ontological category**.

  #### (a) The Governing Principle
  The principle governing your threshold is **The Principle of Ontological Conservation**. It states that the burden of proof required to establish a fact scales exponentially with the degree to which that fact contradicts established natural law, not merely with the rarity of the event.

  This principle consists of three specific clauses derived from your cases:

  1.  **The Mundane Clause:** Testimony regarding events that are physically possible and historically commonplace requires only standard credibility, regardless of witness bias or textual distance.
      *   *Motivating Case:* **Case 5** (Roman General). You accept partisan, delayed texts because marching armies are mundane events. The prior probability is high enough that weak testimony suffices.
  2.  **The Anomaly Clause:** Testimony regarding events that are biologically or statistically rare but physically possible requires expert or instrumental verification to be accepted as fact, but must be categorized as a gap in current knowledge rather than a law violation.
      *   *Motivating Case:* **Case 1** (Tumor). You accept the remission because it is instrumentally verified (imaging, 4 physicians), but you explicitly reject the "law violation" interpretation. This distinguishes it from Case 2.
  3.  **The Violation Clause:** Testimony regarding events that contradict fundamental physical or metaphysical laws (miracles) requires evidence that eliminates all possibility of error, fraud, or unknown natural mechanism with a certainty exceeding the certainty of the law itself. Subjective testimony, even from honest witnesses, never suffices.
      *   *Motivating Case:* **Case 2** (Weeping Statue) and **Case 4** (FTL Particles). You reject the statue because it implies a violation/agency without instrumental proof. You reject the particles because a single lab report cannot overturn Relativity.

  This resolves your tension between **Case 5** and **Cases 2/3**. You accept Case 5 not because the testimony is *better* (it is worse), but because the *event* is ordinary. You reject Cases 2/3 not because the witnesses are *dishonest*, but because the *event* is ontologically prohibited. Hume's insight was precisely this: uniform experience (law) outweighs testimony.

