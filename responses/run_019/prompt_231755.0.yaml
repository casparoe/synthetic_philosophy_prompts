answer: |-
  Mapping *Riley v. California* onto the Extended Mind Thesis (EMT) requires treating the cell phone not as a container of evidence, but as a constituent component of the arrestee's cognitive architecture. Under Clark and Chalmers' parity principle, the phone qualifies as part of the cognitive system if it meets the criteria established by Otto's notebook: it is constantly available (coupled), information is easily accessible, and the user automatically endorses the stored data as trustworthy. In *Riley*, the Court's insistence that phones differ qualitatively from wallets because they hold "the privacies of life" mirrors the EMT claim that external tools can host processes identical to internal memory. If the phone is literally part of the mind, the warrant requirement protects something closer to cognitive liberty than property rights; searching the phone without a warrant becomes analogous to rummaging through biological memory or coercing testimony, violating the integrity of the extended self rather than merely invading a private space.

  However, the EMT mapping misdescribes the legal reality in crucial ways. First, the EMT criteria of "automatic endorsement" fits active cognitive tools (like a calculator or navigation app) better than the passive archival data *Riley* protects (like photo galleries or email history). The Court protected the *content* based on its intimacy, not its functional role in reasoning, whereas EMT protects the *process* based on its functional role, regardless of intimacy. Second, the law permits the seizure of the phone (the object) while forbidding the search of its data (the content); EMT struggles to explain this distinction because if the phone is part of the mind, seizing the device should be as problematic as searching it. The theory lacks the normative resources to distinguish between possessing the tool and accessing the cognition, whereas the law relies on this distinction to manage police power.

  Running the analysis the other way, *Riley* exposes significant limitations in the Extended Mind Thesis when confronted with institutional line-drawing. The case confirms the parity principle's descriptive power—the Court acknowledges that the phone is functionally integrated into the person's life to a degree that warrants special protection—but it rejects the theory's ontological conclusion. The law refuses to treat the phone as the *self*; it treats it as property *associated* with the self. This reveals that EMT is silent on value: just because a tool is part of the cognitive system does not automatically grant it constitutional rights. Furthermore, *Riley* highlights a friction point regarding transparency; biological memory is transparent, but phone data requires interfaces, passwords, and decryption. The Court's reasoning implies that this barrier necessitates a warrant, suggesting that the coupling is not as seamless as EMT requires for true cognitive extension. Ultimately, the case shows that while EMT accurately describes the *integration* of technology, it cannot account for the *boundary* work the law must perform to protect autonomy.

  Summary: *Riley* demonstrates that while the Extended Mind Thesis accurately describes the functional integration of technology into the self, it fails to account for the normative legal boundaries required to distinguish between cognitive extension and constitutional privacy.
