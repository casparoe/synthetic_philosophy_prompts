      *   **Implication:** The boundary of the mind/self is not the skin/skull.

  3.  **Deconstruct *Riley v. California*:**
      *   **Holding:** Police need a warrant to search digital data on a phone seized during arrest.
      *   **Reasoning:** Phones are not just another personal effect (like a wallet or cigarette pack). They hold "the privacies of life." Quantitative difference (storage capacity) leads to qualitative difference (nature of privacy interest).
      *   **Key Concept:** Protection of privacy/autonomy/dignity associated with the *contents* of the phone, treating it as an extension of the person's private sphere, though not explicitly using cognitive science language.

