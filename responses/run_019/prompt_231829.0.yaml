      *   *Gödel (1st Theorem):* For any consistent formal system $F$ containing elementary arithmetic, there exists a statement $G$ such that $F \nvdash G$ and $F \nvdash \neg G$. If $F$ is sound, $G$ is true but unprovable.
      *   *Gödel (2nd Theorem):* $F$ cannot prove its own consistency ($Con(F)$).
      *   *Heisenberg (Uncertainty Principle):* $\sigma_x \sigma_p \geq \hbar/2$. It's not about measurement disturbance (though often taught that way); it's about the non-commutativity of operators $[\hat{x}, \hat{p}] = i\hbar$. A state cannot be an eigenstate of both.

