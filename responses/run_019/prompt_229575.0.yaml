answer: |-
  ### The Principle of Culpable Normative Consistency

  Based on the six cases provided, the intuitions suggest that standing to blame is lost not merely by having "dirty hands," but by maintaining a specific kind of hypocritical relationship to the norm being invoked. The following principle captures the distinctions between your cases, particularly the tensions between 1 vs. 2 (reform) and 1 vs. 4 (normative kind).

  **The Principle:**
  An agent $S$ lacks the standing to blame agent $T$ for a wrong $\phi$ if and only if:
  1.  **Culpable Implication:** $S$ is currently culpable for, or has not authentically repudiated, a past violation of a norm $N$; AND
  2.  **Normative Identity:** $N$ is sufficiently similar in normative kind to the norm violated by $\phi$; AND
  3.  **Moral Claim:** $S$'s act of blaming implicitly claims a moral authority regarding $N$ that $S$'s own relationship to $N$ undermines.

  ---

  ### Motivation for Clauses

  **Clause 1: Culpable Implication (Motivated by Cases 1, 2, 3, & 6)**
  This clause handles the status of the blamer's past actions.
  *   **Case 1 (Amara):** Amara lacks standing because she is *currently* culpably implicated (or has ceased without repudiation). She violated the norm of financial honesty and has not repudiated it.
  *   **Case 2 (Cara):** Cara *was* implicated, but she satisfies the "authentically repudiated" condition (25 years sober, counseling). Cessation alone is insufficient; moral reform is required.
  *   **Case 6 (Imani):** Imani lacks *culpability* due to coercion (duress). Since she was not fully culpable for her participation, she does not trigger this clause.
  *   **Case 3 (Darius):** Darius triggers this clause. Although he denounces the partner, the "bitter falling-out" suggests tactical abandonment rather than authentic repudiation. He remains culpably implicated in the *attitude* toward the norm (using it instrumentally).

  **Clause 2: Normative Identity (Motivated by Cases 1 & 4)**
  This clause handles the "typing" problem you identified. Standing is lost only if the hypocrisy is specific to the norm at issue.
  *   **Case 1 (Amara/Ben):** Both violate norms of **financial honesty** (billing fraud vs. expense padding). The norms are identical in kind.
  *   **Case 4 (Elena/Landlord):** Elena violates norms of **truthful speech/reputation**, while the Landlord violates norms of **public safety/regulatory compliance**. While both are "wrong," they are not the same normative kind. Elena's hypocrisy is general, not specific, so she retains standing.

  **Clause 3: Moral Claim (Motivated by Cases 3 & 5)**
  This clause distinguishes between *standing* and other defects like meddling, and clarifies why Darius (Case 3) fails despite speaking the truth.
  *   **Case 3 (Darius):** Blaming is a speech act that implicitly claims, "I uphold this norm." If Darius blames only to hurt a rival, he is not upholding the norm; he is weaponizing it. His claim to authority is false.
  *   **Case 5 (Farid):** Farid has no past violations (Clause 1 is false), so he has standing. If his blame is objectionable, it is because he lacks a **stake** or **authority**, not because he lacks **standing**. This principle treats standing as immunity from the charge of hypocrisy, distinct from the propriety of interference.

  ---

  ### Application to New Cases

  **Case A (The Discriminator): Cessation vs. Repudiation**
  *Scenario:* Greg used to cheat on his taxes for years. He stopped two years ago after an audit but still tells friends the tax system is a "joke" and he only stopped to avoid trouble. He discovers his neighbor is underreporting income and angrily calls him a criminal.
  *Application:*
  *   **Clause 1:** Greg has ceased the behavior but has not *authentically repudiated* it (he still views the norm as a joke).
  *   **Clause 2:** Normative identity holds (tax fraud).
  *   **Verdict:** Greg **lacks standing**.
  *   *Discrimination:* This discriminates between a principle that only looks at *current behavior* (Greg isn't cheating now, so he might have standing) and one that requires *moral reform* (Greg hasn't reformed, so no standing). This aligns with your intuition in Case 2 (Cara) vs. Case 1 (Amara).

  **Case B (The Stress Test): Abstract Normative Kind**
  *Scenario:* Helen is a pacifist who once shoved a bully in high school to protect a friend (admitting it was violent but necessary). She now protests a military contractor, blaming the CEO for "violence against the innocent." The CEO argues Helen lacks standing because she has committed violence.
  *Application:*
  *   **Clause 1:** Helen is arguably culpable for the shove, though she may claim justification. Assume for the stress test she accepts it was a norm violation.
  *   **Clause 2:** Is "individual defensive violence" the same normative kind as "institutional military violence"? This stresses the **Normative Identity** clause.
  *   **Verdict:** Under this principle, Helen **retains standing**. The normative kind of *interpersonal self-defense* is distinct from *systemic aggression*. The principle forces us to type norms at the level of moral justification, not just the physical act (force). If the principle were too broad (any violence), Helen would lose standing; if too narrow, no one would ever lose standing. This stresses the need for precise normative typing.

  ---

  ### On Case 5 (Meddling vs. Standing)

  My principle treats meddling as a **separate kind of defect**, not a defect of standing.

  *   **Standing** is the moral permission to address a wrong without being silenced by one's own record (immunity from *tu quoque*).
  *   **Propriety/Authority** is whether one has the right relationship to the blamee to deliver the blame (e.g., parent-child, victim-perpetrator).

  In Case 5, Farid is not a hypocrite. He satisfies the Principle of Culpable Normative Consistency perfectly. Therefore, he has *standing*. If his colleagues think he is being a busybody, they are objecting to his *propriety*, not his *standing*. Distinguishing these prevents the concept of standing from becoming too broad (where any uninvolved blame is "hypocritical").

  ---

  ### Accommodation of Your Verdicts

  My principle can accommodate **all six of your verdicts**, but Case 3 (Darius) places the heaviest strain on the definition of "Authentic Repudiation."

  *   **Accommodation:**
      *   **Cases 1, 2, 4, 5, 6** fit cleanly.
      *   **Case 3 (Darius)** fits only if we interpret "Authentic Repudiation" to require more than just stopping the behavior or verbally denouncing it; it requires that the denunciation be motivated by a commitment to the norm, not personal vengeance.
  *   **Resolution:**
      *   I would **complicate the principle** rather than overturn your verdict on Case 3. Your intuition that Darius lacks standing is robust because his blame is instrumental. If the principle defined repudiation merely as "cessation of action," it would fail Case 3. By defining it as "moral rejection of the violation," the principle preserves your verdict.
      *   *Note on Case 1 vs. 2:* The principle successfully explains why Amara (no reform) differs from Cara (reform), resolving your primary tension.
      *   *Note on Case 1 vs. 4:* The principle successfully explains why financial hypocrisy blocks standing (Amara) but general moral failings do not (Elena), resolving your secondary tension.

  **Final Recommendation:**
  Adopt the **Principle of Culpable Normative Consistency**, but invest philosophical energy into defining **Normative Identity** (how similar is "similar enough"?) and **Authentic Repudiation** (how do we distinguish moral reform from tactical cessation?). These are the two levers that allow the principle to match your nuanced intuitions.
