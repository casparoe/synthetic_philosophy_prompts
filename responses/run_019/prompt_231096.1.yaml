      *   Structure: Executive Summary -> Ranked Tensions (Severe to Dissolved) -> Fixes & Sacrifices -> Final Verdict.
      *   Check against constraints: "Rank tensions by severity," "least costly fix," "what it sacrifices."

      *(Self-Correction during drafting)*: I need to be careful not to just say "you're wrong." I need to show how the pieces *can* fit if adjusted. The framework is actually quite robust (Smith's Ideal Advisor + Hare's Two-Level + Internalism). The main friction is the claim in (5) that the act was right *full stop* despite the definition in (1).
