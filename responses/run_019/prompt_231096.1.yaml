      *   **Task:** Audit the framework for coherence ("does it hang together?").
      *   **Specific Requirements:** Rank tensions by severity (from apparent tensions that dissolve to real contradictions). For real tensions, propose the least costly fix and identify what is sacrificed.
      *   **Input:** A six-point moral package.

  2.  **Deconstruct the Six Points:**
      *   *(1) Definition of Right:* An act is right iff Ideal-Me (fully informed, rational, non-self-deceived) would want me to do it. (Ideal Observer Theory / Ideal Advisor variant).
      *   *(2) Heuristics:* In everyday life, don't compute (1). Follow coarse rules (keep promises, don't lie, etc.). Computing (1) in real-time leads to self-deception/rationalization.
      *   *(3) Exception:* In high-stakes or rule-conflict cases, *do* try to reason like Ideal-Me.
      *   *(4) Usability/Recognizability:* A moral theory must be usable/recognizable by me from inside my life. If I can't recognize the verdict after honest effort, it's "laundering." (Internalist constraint).
      *   *(5) The Fallout Case:* Kept a promise despite potential pain prevention. Verdict: It was the *right* answer for me, full stop. Reason: The only time Ideal-Me says "break promise" is when I *want* to break it (self-deception warning).
      *   *(6) Constraint on Idealization:* If Ideal-Me systematically reverses settled convictions (promises, using people), the idealization is suspect. (Reflective Equilibrium constraint).

  3.  **Initial Coherence Check (The "Hang Together" Test):**
      *   The core tension is between (1) the *definition* of rightness (Ideal-Me's view) and (5)/(2) the *practice* of rightness (following rules even when Ideal-Me might theoretically disagree).
      *   Point (5) claims keeping the promise was right *full stop*, not just "right for me given my limitations." But Point (1) says rightness is defined by what Ideal-Me wants. If Ideal-Me (with extra info) would want the promise broken to prevent pain, then by (1), keeping it was *wrong*.
      *   Point (2) says don't compute (1) because of bias. Point (3) says *do* compute (1) in high stakes. Point (5) implies the fallout was high stakes (ugly fallout), yet the user didn't compute (1) because they distrust the computation when it aligns with desire.
      *   Point (4) and (6) act as safeguards against (1) becoming too external or alienating.

  4.  **Identify Tensions:**

      *   **Tension A: The Definition vs. The Verdict (Points 1 vs. 5).**
          *   (1) says Right = Ideal-Me's desire.
          *   (5) says Right = Keep Promise (even if Ideal-Me with full info might say break it to prevent pain).
          *   *Severity:* High. This is a direct contradiction between the meta-ethical definition and the normative conclusion.
          *   *Dissolution?* Maybe if "Ideal-Me" incorporates the limitation of *my* inability to know the info? But (1) says "fully informed."
          *   *Fix:* Adjust (1) to be "Ideal-Me knowing what *I* can know" or adjust (5) to admit it was "subjectively right but objectively wrong." But (5) explicitly rejects "allowed to get it wrong."

      *   **Tension B: The Self-Deception Block vs. The Exception (Points 2, 3, vs. 5).**
          *   (2) says don't compute Ideal-Me because we rationalize.
          *   (3) says compute Ideal-Me in high stakes.
          *   (5) says in the fallout (presumably high stakes), I *didn't* compute Ideal-Me because I distrust the result when it matches my desire.
          *   *Severity:* Medium. It's a procedural inconsistency. Is the fallout high stakes? If yes, (3) applies. If the user ignored (3) because of the self-deception fear in (2), that's consistent with (2) but makes (3) weird.
          *   *Fix:* Clarify when the "self-deception warning" overrides the "high stakes exception."

      *   **Tension C: Usability vs. Idealization (Points 1 vs. 4/6).**
          *   (1) posits a God's-eye view (fully informed).
          *   (4) says if I can't recognize it, it's laundering.
          *   (6) says if Ideal-Me contradicts my core convictions, Ideal-Me is wrong.
          *   *Severity:* Low/Medium. This is actually a feature, not a bug. It's a "Reflective Equilibrium" approach. The tension is built-in to prevent alienation.
          *   *Fix:* None needed, this is the stabilizing mechanism.

      *   **Tension D: The "Right for Me" vs. "Right Full Stop" (Point 5).**
          *   (5) says it was right *full stop*, not just "right given my limitations."
