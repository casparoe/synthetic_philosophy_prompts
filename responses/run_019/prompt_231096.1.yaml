  5.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the sophistication of the framework. It's a hybrid of Ideal Advisor Theory + Rule Utilitarianism/Deontology + Internalism.
      *   *Ranking Tensions:*
          1.  **The Truth-Condition Gap (1 vs. 5).** This is the big one. Definition vs. Application.
