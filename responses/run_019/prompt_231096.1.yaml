          *   For 1 vs. 6: This is actually a "Reflective Equilibrium" feature. It looks like a tension but isn't. It prevents the theory from becoming authoritarian.
      *   *Conclusion:* It hangs together *if* (1) is tweaked to account for the agent's epistemic position, not just the ideal observer's knowledge.

  6.  **Refining the "Fixes":**
      *   *Fix for Tension 1:* Change (1) from "fully informed" to "fully informed about relevant facts *accessible to me*" OR change (1) to define rightness as "what Ideal-Me would want me to do *given my cognitive limitations*."
      *   *Wait, looking closer at (5):* The user says "I can easily imagine ideal-me knowing extra stuff and concluding that telling would prevent more pain." This admits Ideal-Me (fully informed) *would* say break the promise. But the user says keeping it was "right full stop."
      *   *This is a contradiction.* If Right = Ideal-Me's will, and Ideal-Me wills X, but I do Y, then Y is Wrong. The user claims Y is Right.
      *   *Resolution:* The user is actually arguing for a **Two-Level Theory** (like Hare's Rule Utilitarianism). Level 1: Intuitive/Rules. Level 2: Critical/Ideal. But (5) claims the Level 1 verdict *is* the Right verdict, not just the best proxy.
      *   *Best Fix:* Reframe (1). Rightness isn't what Ideal-Me would do *if they were me*, it's what Ideal-Me would want *me* (with my limitations) to do. Ideal-Me knows I am prone to self-deception. Therefore, Ideal-Me wants me to follow the rule even if breaking it yields better consequences *in this specific instance*, because the *practice* of following the rule is more valuable.
      *   *Sacrifice:* It makes the theory less about specific outcomes and more about integrity/systemic reliability.

  7.  **Final Polish:**
