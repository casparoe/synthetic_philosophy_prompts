  # Seminar Handout: Mapping the Multiple Realizability Debate

  **Instructions:** Start at the **Entry Point**. Answer each question based on your current philosophical intuition or judgment of the case. Follow the arrows to the next node or a final position (Leaf). Spend no more than 10 minutes.

