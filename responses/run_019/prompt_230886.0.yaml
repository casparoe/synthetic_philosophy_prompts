       (e.g., C-fibers)."  (e.g., Human-pain  scrutiny, or is it an    |
                          vs. Octopus-pain)."  illusion of coarse-      |
                                  |            graining?"               |
                                  |                 |                   |
                                  |           [NO]  |             [YES] |
                                  |                 |                   |
                                  v                 v                   v
                           LEAF 1:           LEAF 2:              NODE C:
                        TYPE IDENTITY      MR SKEPTICISM         Role vs. Realizer
                        THEORY             (e.g., Polger &   "Is the mental state the
                        (Place/Smart)      Shapiro)          abstract causal ROLE, or
                                                             the physical FILLER?"
                                                                          |
                                                            ______________|______________
                                                           |                             |
                                                    "The Role"                     "The Filler"
                                                    (2nd-order property)         (1st-order property)
                                                           |                             |
                                                           v                             v
                                                    LEAF 3:                       LEAF 4:
                                                 CLASSICAL                      REALIZER
                                                 FUNCTIONALISM                  FUNCTIONALISM
                                                 (Putnam/Fodor)                 (Lewis/Armstrong)
  ```

  *(Note: Leaf 5, Local Reductionism, is located at Node A, right branch.)*

  ---

  ### The Leaves: Positions & Awkward Commitments

  1.  **Type Identity Theory:** Mental states are identical to specific neurophysiological states (e.g., Pain = C-fiber firing).
      *   *Awkward Commitment:* Must deny that behaviorally identical robots or octopuses feel pain at all.
  2.  **MR Skepticism:** Genuine multiple realizability is empirically far rarer than philosophical intuition suggests.
      *   *Awkward Commitment:* Must argue that canonical examples (like octopus pain) are likely superficial analogies rather than true functional homologies.
  3.  **Local Reductionism:** Mental states reduce to physical states, but the reduction is relative to a species or structural kind.
      *   *Awkward Commitment:* Psychology fragments into separate sciences for every physical structure, preventing general laws across species.
  4.  **Classical (Role) Functionalism:** Mental states are second-order properties defined by their causal role within a system.
      *   *Awkward Commitment:* Must accept that the physical realizer of "pain" is a wildly disjunctive property with no causal unity.
  5.  **Realizer Functionalism:** Mental states are the first-order physical states that occupy a causal role.
      *   *Awkward Commitment:* Struggles to explain in what literal sense a robot and human share the *same* state rather than just similar ones.

  ---

  ### Meta-Commentary: Gaps & Overlaps

  **1. Indistinguishable Leaves (The Collapse Problem)**
  *   **Pair:** **Type Identity Theory** (Leaf 1) and **Realizer Functionalism** (Leaf 5).
  *   **Diagnosis:** If Multiple Realizability is false (or extremely rare), Realizer Functionalism collapses into Type Identity Theory. If there is only one physical way to realize pain, the "filler" just *is* the specific physical type. The tree cannot cleanly separate these if you answer [NO] at Node B.

  **2. Empty Combinations**
  *   **Combination:** **Classical Functionalism** + **"The Filler" is the Mental State.**
  *   **Diagnosis:** **Incoherent.** Classical Functionalism is *defined* by the claim that the mental state is the Role (second-order), not the Filler (first-order). Accepting the Filler as the state moves you automatically to Realizer Functionalism.
  *   **Combination:** **MR Skepticism** + **"Yes" at Entry Point.**
  *   **Diagnosis:** **Unstable.** If you believe genuine MR is empirically rare (Skepticism), you cannot consistently maintain that the human, octopus, and robot are in the *identical* state (Entry Point). The tree forces you to revise the Entry Point to [NO] upon reaching Leaf 2.

  **3. Underexplored Territory**
  *   **Node B [NO] -> Type Identity:** This path is often treated as the "default" for physicalists, but it relies on the empirical claim that biology is uniform enough to rule out MR. This combination (Conceptual Identity + Empirical Uniformity) is often assumed rather than argued for in introductory contexts.

  ---

  ### Discussion Questions for Seminar
  1.  If you landed on **Realizer Functionalism**, how do you respond to the charge that you have abandoned the core insight of functionalism (that mental states are multiply realizable)?
  2.  If you landed on **MR Skepticism**, does this force you to accept **Type Identity Theory**, or is there a middle ground?
  3.  Does the **Local Reductionist** view save the validity of psychological generalizations, or does it destroy the unity of the special sciences?
