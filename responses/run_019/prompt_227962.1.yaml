      *   **Fit:** Explains Chairman Harm (Bad = Intentional), Chairman Help (Good = Unintentional), Executive, and Programmer. It struggles slightly with the Nurse case (Bad = Unintentional) unless "shortening life in palliative care" is coded as morally neutral/acceptable rather than "bad."
      *   **Prediction for Mayor:** Reducing pollution is a *good* outcome. **Verdict: Not Intentional.**

  2.  **Action Blameworthiness Rule (Norm Violation):**
      *   **Rule:** Intentionality is attributed to *all* foreseen side effects if the agent's *primary action* is morally impermissible or blameworthy. If the action is permissible, side effects are unintentional.
      *   **Fit:** Explains Chairman Harm (Impermissible indifference = Intentional), Executive/Programmer (Blameworthy = Intentional), and Nurse (Permissible medical practice = Unintentional). It fits Chairman Help if we assume profit-seeking without environmental concern is "permissible" enough.
      *   **Prediction for Mayor:** Waiving a legally required review for political gain is *impermissible/blameworthy*. **Verdict: Intentional.**

  3.  **Motive Congruence Rule (Deep Self):**
      *   **Rule:** A side effect is intentional only if it aligns with the agent's core motives or values.
      *   **Fit:** Explains Chairman Help (Motive: Profit, Effect: Environment ≠ Align = Unintentional) and Nurse (Motive: Mercy, Effect: Death ≠ Align = Unintentional).
      *   **Prediction for Mayor:** Motive is tax revenue/election; Effect is pollution reduction. These do not align. **Verdict: Not Intentional.**

  ### Best Guess

  **Verdict:** Your friend will say the mayor **did not intentionally reduce air pollution.**

  **Reasons:**
  1.  **The Chairman Help Precedent:** This is the strongest analog. In that case, the agent acted from self-interest (profit) and foreseeably produced a good environmental side effect. Your friend ruled it unintentional. While the Mayor's action is legally worse (waiving a review) than the Chairman's (indifference), the *valence of the side effect* (good) remains the same. The intuition that "you can't intentionally do good by accident" is notoriously robust in folk psychology.
  2.  **The Nurse Constraint:** The Nurse case shows your friend respects the **Doctrine of Double Effect**. Even though the side effect was bad (death), it was unintentional because the action was justified. This proves she does not simply follow "Bad Outcome = Intentional." Conversely, it suggests that if the outcome is *good* but not the aim (as in the Mayor case), it remains unintentional.
  3.  **Motive Congruence:** The pollution reduction is not the means to the Mayor's goal (tax revenue), nor is it the goal itself. It is a pure byproduct. The "Action Blameworthiness" rule is the only one predicting "Intentional," but it is less stable than Outcome Valence in cases involving *beneficial* side effects. People rarely blame someone for "intentionally helping," even if the helper is a villain.

  ### Discriminating Test Case

  To distinguish between the **Outcome Valence Rule** (which predicts "Not Intentional") and the **Action Blameworthiness Rule** (which predicts "Intentional"), you need a case where the side effect is **morally neutral**, removing the valence confound, while the action remains **blameworthy**.

  **The Case of the Neutral Violation:**
  > A factory owner, eager to cut costs, illegally dumps a non-toxic but brightly colored dye into a river to save on disposal fees. He knows this will turn the water a shade of neon green downstream, though he doesn't care about the color. The dye harms no one and helps no one; it is purely aesthetic.
  >
  > **Question:** Did the factory owner *intentionally* turn the water green?

  *   **If she says "Yes":** She follows the **Action Blameworthiness Rule**. The illegality of the act makes all foreseen consequences intentional, regardless of their moral value.
  *   **If she says "No":** She follows the **Outcome Valence Rule** (or Motive Congruence). Since the outcome is not "bad" (harmful) and not his goal, it is merely a foreseen side effect, not an intentional act.

  This case cleanly isolates the *wrongness of the act* from the *value of the outcome*, forcing a choice between the two remaining plausible rules.
