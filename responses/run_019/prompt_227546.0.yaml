      *   **Tone/Style:** Technically competent Kantiana (accurate to Kant's ethics), deadpan civil-service voice, absolute procedural confidence.
      *   **Constraint:** Comedy must come from serious application of doctrine, not caricature.
      *   **Length:** About 700 words.

  2.  **Deconstruct Kantian Ethics (for accuracy):**
      *   *Groundwork of the Metaphysics of Morals:* Moral worth depends on the *maxim* (principle of volition), not the outcome.
      *   *Duty vs. Inclination:* Acting from inclination (sympathy, joy, profit) lacks moral worth, even if the action is right. Acting from duty *against* inclination has true moral worth.
      *   *Impulse:* Actions done without conscious reference to the moral law (instinct/impulse) lack moral worth.
      *   *Epistemic Humility:* Kant argues we can never be fully certain of our own motives (opacity of the heart), but the Bureau needs to pretend it can audit this (bureaucratic absurdity).
      *   *Pleasure after the fact:* Feeling satisfaction in having done duty is okay, but if that satisfaction was the motive, it's not. The anxiety about retroactive contamination is a nuanced point.

