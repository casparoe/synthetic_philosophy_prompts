      *   **Entry 4 (Impulsive Rescuer):** Instinctive save. Kant says this lacks moral content because no maxim was formed.
          *   *Drafting thought:* "Reflexive action," "absence of volition," "null rating."
      *   **Entry 5 (Anxious Citizen):** Pleasure after duty. Kant says satisfaction in doing duty is fine, but suspect if it becomes the motive.
          *   *Drafting thought:* Address the "retroactive contamination" fear. Reassure but warn.
      *   **Conclusion:** Standard bureaucratic sign-off.

  4.  **Refining Tone:**
      *   Needs to be dry, bureaucratic, yet philosophically precise.
      *   Avoid making fun of Kant; make fun of the *bureaucratization* of Kant's rigorous internal standards.
      *   Use phrases like "Form 109-K," "audit," "compliance," "maxim verification."

  5.  **Drafting - Word Count Management:**
