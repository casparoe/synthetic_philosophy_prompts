answer: |-
  **BUREAU OF MORAL WORTH**
  **Department of Categorical Compliance**
  **Public FAQ Series: Maxim Verification Protocols**

  **1. I operate a shop where I charge all customers fairly because honest pricing ensures repeat business. Does this qualify for Moral Worth Certification (MWC)?**
  **Reply:** Application Denied. Your maxim is prudential, not moral. You act *in conformity with duty*, but not *from duty*. The Bureau audits the principle of volition, not the external action. Since your honesty is contingent upon its utility to your commercial interests, it lacks necessity and universality. Should honesty become unprofitable, your maxim suggests you would cease honest dealings. Therefore, no moral worth is accrued. Please file under "Legally Compliant, Morally Neutral."

  **2. I donate to charity because seeing others happy brings me immense joy. Is my generosity recognized?**
  **Reply:** Application Denied. While your actions benefit humanity, your motivating ground is "pathological feeling" (inclination), not practical reason. Kantian doctrine stipulates that actions performed from immediate sympathy or personal satisfaction possess no genuine moral content. You are essentially consuming charity for emotional gratification. To qualify, you must demonstrate the capacity to give despite a lack of sympathetic feeling, solely because reason commands it. We recommend suppressing your joy until further notice.

  **3. I am currently suffering from deep grief which has extinguished all love for my fellow man, yet I help others anyway because I know I should. Do I qualify?**
  **Reply:** Application Approved. This is the paradigmatic case for Moral Worth. When all inclination is silenced by sorrow, and yet you drag yourself from despair to assist others solely because the moral law commands it, your action possesses true sublimity. The Bureau notes the absence of competing impulses as a favorable audit condition. Your maxim is pure. You will receive your MWC plaque within 6-8 weeks.

  **4. I saw a child drowning and jumped in immediately without thinking. Surely this counts?**
  **Reply:** Application Denied. Moral worth resides in the conscious adoption of a maxim subject to the Categorical Imperative. Your action was reflexive, driven by instinct or immediate impulse rather than rational deliberation. While socially desirable, it lacks moral content because it did not originate from a commitment to duty. You acted like a well-trained animal, not a rational agent. Next time, please pause to formulate a maxim before entering the water.

  **5. I performed my duty, but afterward, I felt pleased that I had done so. I worry this pleasure retroactively contaminates the deed.**
  **Reply:** Your concern is noted, though technically misplaced. Satisfaction following the fulfillment of duty is permissible, provided it was not the antecedent motive. However, the Bureau cannot guarantee the purity of your retrospective affect. We advise strict monitoring of your self-congratulation. If the pleasure becomes the reason you perform future duties, your status will be downgraded to "Inclination-Based." Continue to act, but refrain from enjoying the fact that you have acted.

  **General Notice:**
  Applicants are reminded that while the Bureau issues certifications provisionally, Kantian epistemology dictates that no human being can ever be fully certain of their own deepest motives. Your certification is therefore valid only until further introspection. Do not let this uncertainty paralyze you; simply act as if your maxim could become a universal law, and let the auditors worry about the metaphysics.

  *For further inquiries, submit Form 109-K (Declaration of Volition).*
