      *   **Topic:** Parody FAQ published by the "Bureau of Moral Worth" (an imaginary Kantian licensing agency).
      *   **Purpose:** Audit good deeds to certify if they were performed *from duty* (genuine moral worth) vs. *in conformity with duty* (no moral worth).
