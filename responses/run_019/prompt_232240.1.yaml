answer: |-
  Bradley's regress arises when one attempts to analyze the unity of a complex entity. If a state of affairs ($a$'s being $F$) consists of a particular ($a$), a universal ($F$), and a tie (instantiation), what ties the tie to the constituents? If a further relation is required, an infinite regress ensues. This argument is deployed against both the unity of facts (metaphysics) and the unity of propositions (semantics). While these deployments are structurally isomorphic, they are not merely one problem in different vocabulary. The regress exerts significantly more damaging pressure on the unity of propositions. While metaphysical primitivism can plausibly halt the regress regarding facts, semantic primitivism regarding propositions struggles to account for representation and falsity, leaving the propositional deployment as the more profound philosophical threat.

  Structurally, the two deployments are identical. Both target constituent ontology. In the metaphysical version, the worry is that if reality is composed of objects and properties, there is no ontological glue to explain why $a$ actually *is* $F$ rather than merely existing alongside $F$. In the semantic version, the worry is that if a proposition is a complex of concepts, there is no logical glue to explain why *that a is F* asserts something true or false, rather than merely listing concepts. In both cases, treating the unifying relation as just another constituent invites the regress. Consequently, both targets invite the same initial solution: reject the analysis and treat the unity as primitive and non-mereological.

  However, the viability of this primitivist escape differs radically between the two domains. In metaphysics, treating facts as primitive unities is a robust position. A fact primitivist can argue that the world is fundamentally composed of states of affairs, not objects that subsequently acquire properties. On this view, $a$'s being $F$ is a fundamental chunk of reality. The question "what unites $a$ and $F$?" is dismissed as category mistake; the fact is prior to its constituents. Since facts simply *obtain*, there is no explanatory gap regarding their existence. If the fact obtains, it is real; if not, it is nothing. The regress is halted by asserting that ontological unity is a brute feature of existence. The pressure here is limited to accepting a specific ontology, which is a standard metaphysical cost.

  The deployment against propositions, however, exerts greater pressure because propositions are not merely existent unities; they are representational unities. A proposition must not only hang together; it must *say* something about the world. This introduces the problem of falsity, which has no direct analogue in the metaphysics of obtaining facts. A fact primitivist can say non-obtaining facts do not exist. A proposition theorist cannot say false propositions do not exist, for we grasp them constantly.

  If one treats propositional unity as primitive to evade Bradley's regress, one faces a dilemma: how does a primitive unity distinguish itself from a mere list of constituents in a way that allows for falsity? If the proposition *that a is F* is a primitive non-mereological whole, its unity is secure. But why does this unity correspond to the world such that it can be *false*? A primitive fact either obtains or it doesn't. A primitive proposition must possess a structure that allows it to fail to obtain. If the unity is brute, it is difficult to explain how the constituents are arranged *predicatively* rather than *collectively*. As Wittgenstein noted in the *Tractatus*, a proposition is like a picture; its elements must be arranged in a specific way to depict a state of affairs. Bradley's regress highlights that structural arrangement alone cannot generate this depictive power without a further interpreter, leading back to the regress.

  Therefore, the propositional deployment is more damaging because it threatens the possibility of intentionality itself. The metaphysical regress suggests we might misunderstand the structure of reality, prompting a shift to fact-primitivism. The semantic regress suggests we might misunderstand how meaning is possible. If the unity of a proposition cannot be explained without regress, and cannot be taken as primitive without losing the distinction between a proposition and a list, then propositions cannot bear truth values. This undermines logic, language, and thought.

  One might argue that the metaphysical stakes are higher: if facts lack unity, reality dissolves. But reality need not dissolve; it merely needs to be reconceived as holistic. Meaning, however, cannot be easily reconceived. To treat propositional unity as primitive is to treat *aboutness* as brute. While brute existence is intelligible, brute representation is obscure. How can a mental or linguistic entity simply *be* about something without a mediating relation? The metaphysical target can evade the regress by grounding unity in existence (the fact obtains). The semantic target cannot ground unity in existence, because the proposition exists even when false. It must ground unity in normativity or truth-conditions, which are precisely what the regress destabilizes.

  In conclusion, while Bradley's regress against facts and propositions shares a logical form, the propositional deployment is ultimately more damaging. The metaphysician can stop the regress by positing facts as fundamental ontological units, paying the price of a non-standard ontology. The semanticist, however, faces a steeper cost. Treating propositions as primitive unities fails to explain the normative dimension of truth and falsity essential to representation. The regress reveals that constituent structure is insufficient for meaning, and primitivism offers no clear alternative mechanism for intentionality. Thus, the regress against propositions strikes at the coherence of thought and language, whereas the regress against facts strikes only at the granularity of ontology. The former is a crisis of intelligibility; the latter, merely a crisis of categorization.
