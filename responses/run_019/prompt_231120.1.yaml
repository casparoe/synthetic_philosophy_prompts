answer: |-
  ### Pre-Drafting Strategy Note

  **Audience Profile:**
  The room is hostile to semantic solutions for metaphysical problems. The powers theorists (likely dispositional essentialists like Mumford, Bird, or Ellis sympathizers) believe dispositions are real, irreducible causal powers. They view the failure of the Simple Conditional Analysis (SCA) as proof that conditionals cannot capture the *nature* of the property. They will suspect my generic analysis is a disguised form of eliminativism or a return to Rylean behaviorism. The sparse-property realists will worry about ontological bloating or category mistakes. The two philosophers of science (measurement focus) will care about operationalizability and precision; "normally" sounds like a weasel word to them.

  **Load-Bearing Points:**
  1.  **Semantic vs. Metaphysical:** I must maintain that the *ascription* is generic, not necessarily that the *property* is unreal. However, walking this line is tricky.
  2.  **Non-Ad Hoc Normalcy:** I need to prove that "normal" is supplied by the generic operator (Gen), not tacked onto the antecedent of a conditional.
  3.  **Causal Explanation:** I cannot allow the view to imply that the glass breaks *because* it is generically true that it breaks. The generic tracks the power; it doesn't replace the causal mechanism.

  **Strategy:**
  Do not get bogged down in formal semantics (quantifiers over possible worlds, etc.). They won't care. Frame the generic analysis as a tool to save the *phenomenology* of disposition talk from metaphysical over-commitment. Concede where necessary on the metaphysics to save the semantics.

  ***

  # SEMINAR Q&A PREPARATION SHEET
  **Topic:** Disposition Ascriptions as Generics
  **Audience:** Metaphysics Group (Powers/Sparse Properties) + PhilSci (Measurement)

  ### 1. The "Causal Basis" Objection (Powers Theorists)
  **Likely Phrasing:** "You're treating 'fragile' as a generalization about breaking events. But the reason the glass breaks is that it possesses an intrinsic causal power. If you analyze fragility as a generic, aren't you severing the link between the property and the causation? Does the generic *do* the causing?"

  **Reply (2 mins):**
  "No, and this is the crucial distinction. I am analyzing the *ascription* 'this glass is fragile,' not the metaphysical ground of the breaking. The generic claims that instances of this kind *normally* break when struck. What *makes* that generic true is precisely the intrinsic causal power you care about. The generic analysis solves the semantic problem of finks and masks—cases where the power exists but the conditional fails—without denying the power exists. Think of the generic as the correct logical form for *talking* about the power in a world full of interference. It protects the truth of the ascription even when the manifestation is blocked, provided the blocking is abnormal. So, the power remains the truthmaker; the generic is just the truth-condition of the sentence."

  **Weakest Point:**
  If they press on whether the power *itself* is dispositional or categorical. If the power is the truthmaker, haven't I just pushed the dispositional problem back one step? I need to avoid committing to a specific metaphysics of the base while insisting the semantics are generic.

  ### 2. The "Ceteris Paribus in Disguise" Objection (General Metaphysics)
  **Likely Phrasing:** "This looks exactly like the old move to save the SCA by adding a 'ceteris paribus' clause to the antecedent. Lewis and others rejected that because 'all else being equal' is vacuous. How is 'normally' in a generic any less vacuous than a CP clause?"

  **Reply (2 mins):**
  "It's less vacuous because natural language generics have a specific, constrained semantics. A CP clause in a conditional is often a placeholder for 'no interferers,' which we have to list. But generics, like 'tigers are striped,' tolerate exceptions without needing to list them. They rely on a contextually salient notion of 'characteristic' behavior for a kind. When I say 'this wire is live,' I mean it has a structure that *characteristically* conducts. If a safety switch (a fink) cuts the power, that's not characteristic of the wire's structure, it's an external intervention. The generic operator builds in a restriction to 'characteristic circumstances' semantically, so we don't need to metaphysically enumerate every possible mask in the antecedent. It's a feature of the logic of kind-terms, not a metaphysical patch."

  **Weakest Point:**
  Philosophers of science will hate "characteristic." It sounds statistical or normative. I need to be ready to explain how "characteristic" is determined without circularity (see Objection 3).

  ### 3. The Circularity of "Normal" Objection (Powers/Sparse Realists)
  **Likely Phrasing:** "You say the generic holds in 'normal' conditions. But isn't a normal condition for a glass just one where its fragility can manifest? If you define 'normal' as 'conditions where the disposition manifests,' your analysis is circular. If you define it statistically, then a glass in a world full of hammers is 'normally' broken, so it isn't fragile. Which is it?"

  **Reply (2 mins):**
  "Excellent question. I'm not defining 'normal' statistically, nor as 'conditions where it manifests.' I'm appealing to the *intrinsic structure* of the kind. For a silicate glass, 'normal' conditions are those that don't interfere with its molecular bonding. We determine normalcy by looking at the object's constitution, not the frequency of breaking. This aligns with your sparse property view: the property is grounded in the microstructure. The generic quantifies over situations compatible with that microstructure persisting. So, even in a world full of hammers, the glass is fragile because the *characteristic* interaction of its structure with impact is breaking, regardless of the statistical frequency. 'Normal' tracks the nature of the thing, not the environment."

  **Weakest Point:**
  This leans heavily on "nature of the thing." If they press on how we access that nature without already presupposing the disposition, I'm in trouble. It risks looking like I'm using the disposition to define the normalcy that defines the disposition.

  ### 4. The Measurement/Precision Objection (PhilSci)
  **Likely Phrasing:** "In science, we need to measure solubility rates and fragility thresholds. Generics are inherently vague—'birds fly' is true even if penguins don't. How can a vague generic account support precise scientific measurement? If I need to know *exactly* when a sample will dissolve, 'normally' doesn't give me a number."

  **Reply (2 mins):**
  "I agree that for precise engineering, we move from generic ascriptions to specific functional laws. But notice that even in science, we distinguish between the *capacity* and the *performance*. A solubility coefficient is measured under *standard* conditions. My claim is that the ordinary and scientific concept of 'soluble' is a generic claim that there *is* such a coefficient, even if current conditions prevent measuring it. The generic licenses the inference that *if* you standardize the conditions, you *will* get the measurement. It explains why we attribute solubility to a sample in a non-solvent: we are asserting a generic capacity that persists across contexts. The vagueness is in the *attribution*, not necessarily in the underlying physical magnitude."

  **Weakest Point:**
  They might argue that if the attribution is vague, the property isn't real. I need to hold the line that semantic vagueness doesn't imply ontological vagueness.

  ### 5. The Extrinsicness Objection (Sparse Property Realists)
  **Likely Phrasing:** "Generics seem to depend on facts about the kind and the world. If 'fragile' means 'normally breaks,' and 'normally' depends on environmental statistics or interference patterns, haven't you made fragility an extrinsic property? I thought dispositions were intrinsic."

  **Reply (2 mins):**
  "The generic quantifies over *triggering conditions*, but the truth of the generic is grounded in the intrinsic structure. Consider 'flammable.' It's intrinsic to the wood, even though it requires oxygen. The generic 'wood burns' is true because of the wood's chemistry, not because of the frequency of fires. The 'normalcy' restriction filters out extrinsic interferers (masks/finks) precisely to preserve the intuition that the disposition is intrinsic. By treating the ascription as a generic, we filter out the extrinsic noise semantically, allowing the property to remain intrinsic metaphysically. The generic is the lens that lets us see the intrinsic power through the extrinsic noise."

  **Weakest Point:**
  If "normal" is context-sensitive (e.g., normal for a museum piece vs. normal for construction material), then the truth of the ascription varies by context, making the *truth conditions* extrinsic. I have to concede truth-conditional context-dependence while maintaining property intrinsicness.

  ### 6. The Fundamental Dispositions Objection (Powers Theorists)
  **Likely Phrasing:** "What about fundamental particles? An electron has a charge. It doesn't have a 'microstructure' that can be masked in the way glass can. Are you saying 'electrons repel' is a generic? Is there a 'normal' condition for an electron? That sounds like it allows for exceptions. Are there non-repelling electrons?"

  **Reply (2 mins):**
  "For fundamental powers, the generic becomes universal, but the logical form remains the same. 'Electrons repel' is a generic that admits no exceptions in the actual world, but the *semantics* still handle the counterfactuals. If a finkish field existed that neutralized charge, we would say the electron *lost* its charge, or the field masked it. The generic analysis allows us to say 'Electrons are disposed to repel' remains true even if a specific electron is currently prevented from doing so, provided the prevention is not part of the electron's nature. It preserves the distinction between the electron failing to manifest and the electron lacking the power. The generic form is robust enough to cover both statistical kinds (glasses) and strict kinds (electrons)."

  **Weakest Point:**
  If fundamental dispositions are exceptionless, why use a semantic form (generics) designed for exceptions? It might look like overkill. I need to argue it provides a unified semantics for all dispositions.

  ### 7. The Ontological Commitment Objection (Eliminativist Worry)
  **Likely Phrasing:** "Are you actually a realist about dispositions? Or is this a sophisticated Rylean view where dispositions are just linguistic habits? If the analysis is semantic, do we need the properties in our ontology at all?"

  **Reply (2 mins):**
  "I am a realist. The semantic analysis doesn't eliminate the property; it clarifies how we refer to it. Just as analyzing 'water is H2O' doesn't eliminate water, analyzing 'fragile' as a generic doesn't eliminate fragility. We need the property to explain *why* the generic is true. Without the real property, the generic is just a coincidence. I'm offering a semantics for disposition *talk* that is compatible with a robust metaphysics of powers. In fact, I'd argue it helps the realist: it explains why we confidently ascribe dispositions even when we can't observe the manifestation (due to masks), without committing us to mysterious 'always-working' conditionals."

  **Weakest Point:**
  It's hard to prove I'm not an eliminativist in disguise. If the work is done by the generic operator, what work is left for the power?

  ### 8. THE "HOPE NOBODY ASKS" QUESTION
  **Question:** "You say the causal power is the truthmaker for the generic. But if the generic allows for exceptions (masks/finks), and the power is categorical/intrinsic, what *specifically* makes it true that *this* specific situation is an 'abnormal' exception rather than evidence that the power is absent? If the only evidence for the power is the generic, and the generic relies on the power to define normalcy, don't you have a coherence problem, not just a circularity problem?"

  **Why I fear this:**
  This hits the load-bearing point of the Truthmaker. If I say "the microstructure," the sparse realists will ask if the microstructure is dispositional. If I say "the power," the semanticists will say I'm defining the truth conditions via the truthmaker. If I say "context," I lose objectivity. This question exposes the gap between my semantic solution and the metaphysical grounding. I have no clean answer that satisfies both the semantic precision and the metaphysical realism without conceding one side.

  **Contingency Plan:**
  Concede that the boundary between 'mask' and 'absence of power' is sometimes indeterminate in practice, but insist that this is an epistemic limitation, not a metaphysical one. Pivot to the utility of the generic in preserving scientific practice despite this indeterminacy. (Weak, but the only move).
