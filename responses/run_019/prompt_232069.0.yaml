  Hi—I'm a science journalist working on a longread about quantum immortality and the old quantum-suicide thought experiment, and I want to include a sidebar that's basically a "which camp are you actually in?" quiz for readers who already know what many-worlds is but havent thought much about the immortality part. Can you write me the quiz? It should have eight questions, each built around a concrete scenario: quantum Russian roulette with a symmetric beam splitter, a duplication booth that makes one copy on Earth and one on Mars, a version where the trigger has only a 0.01 chance of firing, a version where you're asleep while the branching happens, and a few others like that. Each question should offer three answer options phrased as practical bets or expectations about what the reader would experience or expect to find next—no labels, no philosopher names, no "do you believe you survive?" self-identification. Then provide a scoring key that maps answer patterns onto five positions: (1) full Everettian quantum immortality where measure doesn't matter and you always continue somewhere, (2) measure-sensitive quantum immortality where you survive but should expect to find yourself in higher-amplitude branches, (3) a collapse/Born-rule-only view where the whole setup is just ordinary risky survival and nothing immortal is going on, (4) a deflationary view where branching copies are not you, so the argument never gets off the ground, and (5) a mind-continuity view on wich your stream of consciousness follows exactly one branch even if all the branches are physically real. Also, for any answer pattern that doesn't map cleanly to a leaf, say whether the empty spot is incoherent, unattractive, or just unexplored, and flag which pairs of positions your eight questions can't seperate.
