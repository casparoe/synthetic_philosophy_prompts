answer: |-
  # Sidebar: The Quantum Afterlife Quiz

  **Instructions:** Read each scenario and select the option that best matches your gut expectation of what you would *experience* or how you would *bet*. Do not overthink the physics; answer based on what you think it would *feel like* to be you in that moment.

  ### 1. The Symmetric Split
  You stand before a device triggered by a single photon hitting a 50/50 beam splitter. If the photon reflects, you hear a click and live. If it transmits, a gun fires and you die instantly. The many-worlds interpretation is true: both outcomes happen physically.
  *   **A.** I hear the click. I am certain to experience the branch where I live.
  *   **B.** I have a 50% chance of hearing the click and a 50% chance of experiencing nothingness.
  *   **C.** A version of me hears the click, but from my current perspective, the odds of *my* stream continuing are 50/50.

  ### 2. The One-Percent Miracle
  Same setup, but the apparatus is tuned so the "live" branch has only a 0.01 amplitude (1% chance). The "die" branch has 0.99 amplitude.
  *   **A.** I will still find myself alive. The odds don't change the fact that I exist in the surviving branch.
  *   **B.** I should expect to die. If I survive, it will feel like an incredible statistical anomaly.
  *   **C.** I will cease to exist. The person who wakes up alive is a copy, not the "me" thinking this thought now.

  ### 3. The Mars Booth
  A scanner maps your atoms, destroys your body on Earth, and reconstructs an identical copy on Mars using new matter. Simultaneously, due to a glitch, the Earth destruction mechanism fails, leaving the original you alive on Earth.
  *   **A.** I am now both people. I will have two distinct streams of consciousness simultaneously.
  *   **B.** I will be either the Earth version or the Mars version, chosen at random. I cannot be both.
  *   **C.** The Earth version is me. The Mars version is a duplicate stranger who merely thinks he is me.

  ### 4. The Sleeping Subject
  You are anesthetized before the quantum event occurs. If the outcome is "Live," you are woken up in a white room. If "Die," you are never woken. You know the odds are 50/50.
  *   **A.** When I open my eyes, I know I am in the live branch, but I shouldn't be surprised to be here.
  *   **B.** Before I go under, I assess a 50% risk that I will never wake up.
  *   **C.** If I wake up, it's me. If I don't, I'm gone. The branching doesn't grant me special immunity just because I'm unconscious.

  ### 5. The Long Run
  You must undergo the 50/50 quantum survival test 100 times in a row. Statistically, the chance of a single timeline surviving all 100 is negligible.
  *   **A.** I will experience a miraculous string of luck. I will find myself alive after the 100th click.
  *   **B.** I will almost certainly experience death at some point in the sequence.
  *   **C.** There will be one branch where a copy survives 100 times, but my current perspective will likely terminate early.

  ### 6. The Wallet Wager
  A billionaire offers you $1 million if you agree to undergo the 50/50 quantum survival test. If you die, your heirs get nothing. If you live, you keep the money.
  *   **A.** I take the bet. I know I will be there to spend the money.
  *   **B.** I refuse the bet. The risk of cessation is too high, regardless of where the other branches go.
  *   **C.** I refuse. The version of me that gets the money isn't the one taking the risk right now.

  ### 7. The Friend in the Box
  Your best friend volunteers for the 50/50 quantum survival test in the other room. You hear the mechanism fire.
  *   **A.** I know there is a branch where they died, but I also know there is a branch where they are walking out alive.
  *   **B.** I assess a 50% chance that my friend is dead and I will have to grieve them.
  *   **C.** I assess a 50% chance their body is dead, and the survivor is a new entity indistinguishable from my friend.

  ### 8. The Fading Measure
  Imagine a technology that allows you to survive, but with each branching event, the "measure" (or intensity) of your branch decreases relative to the others, though you remain conscious.
  *   **A.** I continue forever. The intensity doesn't matter as long as experience exists.
  *   **B.** Eventually, I would expect my experience to become unstable or cease as my measure approaches zero.
  *   **C.** This is impossible. If I am me, my measure is 100% of my experience. If it drops, I am no longer the primary observer.

  ***

  # Scoring Key & Analysis

  **How to Tally:**
  Count your selections. There is no strict point system; look for the *pattern* of your choices below.

  ### Profile 1: The Immortalist (Full Everettian QI)
  *   **Dominant Answers:** Mostly **A**.
  *   **The View:** You believe subjective continuity follows physical existence. If a version of you exists, *you* exist. Probability is a measure of how many copies there are, not whether *you* survive. You expect to experience the "miracle" branches because those are the only ones where you have an experience to have.
  *   **Betting Behavior:** You would take life-risking bets if the payoff is high enough for your survivors, because you know *you* will be the survivor.

  ### Profile 2: The Weighted Traveler (Measure-Sensitive QI)
  *   **Dominant Answers:** Mix of **A** and **B**, specifically choosing **A** on Q1/Q4 but **B** on Q2/Q5.
  *   **The View:** You accept branching but believe "measure" (amplitude squared) dictates subjective expectation. You survive, but you should expect to find yourself in high-probability branches. Surviving a 1% branch feels like winning a lottery, not a certainty.
  *   **Betting Behavior:** You act mostly like a standard probabilist. You fear low-measure branches even if you technically survive in them.

  ### Profile 3: The Gambler (Collapse / Born-Rule Only)
  *   **Dominant Answers:** Mostly **B**.
  *   **The View:** You treat the quantum event as an objective chance of cessation. Whether other branches exist physically is irrelevant to your stream of consciousness. If the gun fires in your branch, you are gone.
  *   **Betting Behavior:** Standard risk aversion. You would not take the Wallet Wager (Q6).

  ### Profile 4: The Skeptic (Deflationary / Branch Non-Identity)
  *   **Dominant Answers:** Mostly **C**.
  *   **The View:** You reject the premise that future copies are "you." Psychological continuity is not enough for identity. When the branch splits, the current "you" ends, and new entities begin. Quantum immortality is a category error.
  *   **Betting Behavior:** Extreme risk aversion, potentially more than The Gambler, because you don't even value the utility of your future copies.

  ### Profile 5: The Singularist (Mind-Continuity)
  *   **Dominant Answers:** Mostly **B**, but with **A** on Q3 or Q7.
  *   **The View:** You believe physical branching happens (unlike Profile 3), but consciousness is a single thread that "hops" to one branch randomly according to the Born rule. You are distinct from your copies.
  *   **Betting Behavior:** Identical to The Gambler (Profile 3). The difference is ontological, not practical.

  ***

  # Technical Analysis for the Journalist

  ### 1. Incoherent or Unexplored Patterns
  *   **The "Selfish Immortalist" (A on Q1/Q2, B on Q6):** This pattern suggests the reader believes *they* will survive personally but doesn't care about the utility of their future selves (or heirs). This is pragmatically incoherent in decision theory. If you know you will experience the future, why not bet on it?
  *   **The "Measure Hypocrite" (A on Q1, B on Q2, A on Q5):** Claiming certainty in 50/50 splits but fearing 1% splits, yet expecting to survive 100 rounds of 50/50. This indicates a misunderstanding of how measure compounds. This spot is **unexplored** in serious literature because it violates the mathematics of the wavefunction.
  *   **The "Copy Altruist" (C on Q1/Q2, A on Q7):** Believing *you* die (C) but treating *friends* as surviving branching entities (A). This is **unattractive** philosophically (solipsistic) but logically possible. It suggests identity is third-person observable but not first-person continuous.

  ### 2. Indistinguishable Pairs (The Blind Spots)
  This quiz cannot empirically separate the following pairs, as they yield identical betting behaviors and phenomenological expectations:

  *   **Profile 3 (Gambler) vs. Profile 5 (Singularist):**
      *   *Why:* Both predict a finite lifespan and subjective cessation upon "death." Profile 3 says the other branches don't exist (or don't count); Profile 5 says they exist but consciousness doesn't go there.
      *   *Flag:* No first-person experiment can distinguish these. The difference is purely metaphysical.

  *   **Profile 1 (Immortalist) vs. Profile 2 (Weighted Traveler):**
      *   *Why:* Both predict survival. Profile 1 says "I will definitely survive." Profile 2 says "I will survive, but I should be surprised if the branch was low-measure."
      *   *Flag:* In a single trial, both wake up alive. The distinction only emerges over many trials (Q5) or in betting weightings (Q6). If a reader answers **A** to everything, you cannot tell if they ignore measure (Pos 1) or assume they are in a high-measure branch by default (Pos 2).

  *   **Profile 3 (Gambler) vs. Profile 4 (Skeptic):**
      *   *Why:* Both result in the expectation of death.
      *   *Flag:* The distinction lies in whether the *survivor* is "you." Since the respondent won't be around to ask the survivor, this is operationally identical for the person pulling the trigger.

  ### 3. The "Empty Spot"
  *   **Measure-Sensitive Death:** There is no position in this key that corresponds to "I die in low-measure branches but survive in high-measure ones." This is **incoherent** within standard MWI, as the physical body exists in all branches. This position would require a theory where consciousness is physically pruned by amplitude, which no major physicist currently advocates.
