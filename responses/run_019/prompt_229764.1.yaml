answer: |-
  # Specifications for a Theory of Vagueness: A Desiderata List

  To settle the specification, we must distinguish between the **data** (linguistic and phenomenological facts any theory must accommodate), the **problems** (tensions the theory must resolve), and the **commitments** (metaphysical or logical choices that define specific camps). Below is the requirements list, categorized by their force.

  ### I. Phenomenological and Linguistic Data (Structural Requirements)
  *These are structural: a theory must address them and explain their appearance, even if the theory concludes they are illusory.*

  1.  **Sorites Susceptibility**
      *   **Requirement:** The theory must explain why competent speakers find the inductive premise of a Sorites argument (e.g., "If $n$ grains is not a heap, $n+1$ is not a heap") plausible, and why full linguistic competence does not reveal the argument's invalidity or a false premise immediately.
      *   **Force:** Structural. (Even if the premise is false, the theory must explain its irresistible plausibility.)
  2.  **The Borderline Phenomenology**
      *   **Requirement:** The theory must account for the distinctive cognitive state involved in judging a borderline case (e.g., a teal patch for 'blue'). It must distinguish this state from simple ignorance of a fact (as in empirical uncertainty) and from ambiguity (as in 'bank').
      *   **Force:** Structural. (A theory can deny borderline cases exist ontologically, but must explain why we act as if they do.)
  3.  **Penumbral Connections**
      *   **Requirement:** The theory must preserve logical connections between vague predicates in the borderline region. If $x$ is a borderline case of 'red', it cannot be a borderline case of 'blue' (assuming red and blue are contraries). Verdicts on one precisification must constrain verdicts on others.
      *   **Force:** Non-negotiable. (Failure here renders the theory linguistically inadequate; it fails to capture meaning relations.)
  4.  **The Intuition of No Sharp Boundaries**
      *   **Requirement:** The theory must explain the strong intuition that there is no specific grain of sand where 'non-heap' becomes 'heap'.
      *   **Force:** Structural. (Epistemicists accept sharp boundaries but must explain why they are undetectable; others deny the boundaries but must explain why logic doesn't force them.)

  ### II. Logical and Semantic Behavior (Mixed Requirements)
  *These cover how vague predicates interact with operators. Some are constraints, others are sites of contention.*

  5.  **Behavior under Negation**
      *   **Requirement:** The theory must specify the truth value of $\neg p$ when $p$ is borderline. Is a borderline red patch "not red" true, false, or indeterminate?
      *   **Force:** Structural. (A stance is required.)
  6.  **Behavior under the Truth Predicate (T-Scheme)**
      *   **Requirement:** The theory must state whether the T-scheme ($T(\ulcorner p \urcorner) \leftrightarrow p$) holds unrestrictedly, including for borderline sentences.
      *   **Force:** Non-negotiable. (A theory of vagueness is a theory of truth-conditions; abandoning the T-scheme requires massive justification.)
  7.  **Behavior under the Determinacy Operator**
      *   **Requirement:** The theory must provide logic for 'Definitely' ($D$). Does $Dp \to p$ hold? Does $Dp \to DDp$ hold?
      *   **Force:** Structural. (The operator is needed to formalize the distinction between clear and borderline cases.)
  8.  **Higher-Order Vagueness**
      *   **Requirement:** The theory must address whether the boundary between the clear cases and the borderline cases is itself sharp or vague. If vague, does this iterate infinitely?
      *   **Force:** Structural. (Any theory that posits a 'borderline region' must define its edges.)

  ### III. Metaphysical and Logical Commitments (Parochial Requirements)
  *These are parochial: they represent specific philosophical choices. A theory need not satisfy all, but must choose which to retain.*

  9.  **Bivalence**
      *   **Requirement:** Every meaningful declarative sentence is either true or false.
      *   **Force:** Parochial. (Epistemicists retain it; Supervaluationists and Many-Valued theorists reject it.)
  10. **Classical Validity**
      *   **Requirement:** Standard classical inferences (e.g., Modus Ponens, Conditional Proof) remain valid for vague language.
      *   **Force:** Parochial. (Often tied to Bivalence, but can be decoupled.)
  11. **The Existence of Sharp Boundaries**
      *   **Requirement:** There is a fact of the matter regarding the exact extension of the predicate.
      *   **Force:** Parochial. (Epistemicists accept; others reject.)
  12. **The Nature of Ignorance**
      *   **Requirement:** If we cannot know the status of a borderline case, is this due to semantic indeterminacy or epistemic limitation?
      *   **Force:** Parochial. (This is the core divide between Epistemicism and Semantic theories.)

  ---

  ### Task 1: The Inconsistent Family of Requirements

  The standard Sorites paradox identifies a tension between **Tolerance**, **Modus Ponens**, and **Endpoint Verdicts**. However, a deeper inconsistency arises when we examine the logical architecture required to save the phenomena without metaphysical excess. Consider the following triad, which I call the **Trilemma of Semantic Precision**:

  1.  **Unrestricted Bivalence:** Every sentence involving a vague predicate is determinately true or determinately false.
  2.  **The No-Arbitrary-Boundary Constraint:** It is not the case that there is a specific point $n$ in a Sorites series such that $F(n)$ is true and $F(n+1)$ is false. (This is not just the *intuition* of no boundaries, but the claim that no such fact exists).
  3.  **Classical Validity (specifically Existential Generalization):** If $F(n)$ is true and $F(n+1)$ is false for some $n$, then $\exists x (F(x) \land \neg F(x+1))$.

  **The Tension:**
  If you accept **Bivalence (1)**, Classical Logic forces you to accept that there is a transition point in any finite series moving from True to False. By **Existential Generalization (3)**, this entails there is a sharp boundary. This directly contradicts **No-Arbitrary-Boundary (2)**.

  Most theories solve this by dropping one:
  *   **Epistemicism** drops (2). It accepts sharp boundaries exist (violating the constraint as a metaphysical claim, though explaining it as an appearance).
  *   **Supervaluationism** drops (1). It rejects Bivalence for borderline cases, thereby blocking the inference to a sharp boundary in the object language (though it faces issues in the metalanguage).
  *   **Many-Valued Logics** drop (1) and often modify (3).

  **Why this runs deeper:**
  This trilemma shows that the conflict is not merely about the plausibility of the Sorites premise (tolerance), but about the compatibility of **Classical Logic** with a **Non-Revisionary Metaphysics**. You cannot have a logic that validates standard existential inferences, a semantics that assigns binary truth values, and a metaphysics that denies sharp cutoffs. One must fracture. The tension is deeper than the Sorites because it persists even if we block the Sorites induction; it arises simply from the existence of a transition from True to False in a discrete series under classical assumptions.

  ---

  ### Task 2: The Exclusionary Requirement

  The single requirement that, if enforced uncompromisingly, excludes the most currently popular theories is:

  **"There are no sharp boundaries at any order of vagueness."**
  *(Specifically: The boundary between the definite extension and the borderline extension must itself be vague, and this must iterate without ever settling into a sharp cutoff.)*

  **Why it excludes the major theories:**
  1.  **Epistemicism:** Excluded immediately. Epistemicism posits sharp boundaries at the first order (there is a specific number of grains that makes a heap) and at every higher order. It treats the requirement as false.
  2.  **Supervaluationism:** Excluded at higher orders. Supervaluationism successfully blurs the first boundary (between True and False) by introducing 'Indeterminate'. However, it creates a sharp boundary between 'Supertrue' (true on all precisifications) and 'Not Supertrue'. The logic of the 'Definitely' operator in standard supervaluationism creates a sharp cutoff between what is definitely true and what is not. To avoid this, one needs a complex, non-standard logic of determinacy that most supervaluationists do not adopt.
  3.  **Fuzzy Logic (Many-Valued):** Excluded. Fuzzy logic assigns degrees of truth (e.g., 0.5). But the transition from membership degree 0.5 to 0.5000001 is sharp. The set of values is usually precisely defined (the real interval [0,1]), reintroducing sharp boundaries at the level of truth degrees.

  **Cost Allocation:**
  *   **The Epistemicist** locates the cost of enforcing this requirement in **Metaphysics**. They argue the requirement is simply false. The cost of *rejecting* the requirement is accepting that nature contains arbitrary cutoffs we cannot know. They view the "No Sharp Boundary" intuition as a cognitive illusion.
  *   **The Supervaluationist** locates the cost in **Logic/Semantics**. They want to enforce the requirement (no sharp boundaries). To do so, they must complicate the logic of 'Definitely'. If they enforce it uncompromisingly, they lose the ability to define 'Supertruth' sharply. The cost is a loss of logical clarity in the metalanguage: they cannot sharply define the very semantics they use to explain vagueness.

  ---

  ### Task 3: The Omitted Requirement

  **Requirement:** **The Legitimacy of Precisification.**
  *A theory must explain why it is normatively permissible to sharpen a vague term for specific purposes (e.g., in law or science) without changing the meaning of the term or lying.*

  **Defense as a Requirement:**
  Standard lists focus on the static semantics of vague terms (what 'heap' means now). They often neglect the dynamic function of vagueness (how 'heap' is used in regulation). Vagueness is not merely a defect; it is a feature that allows for flexible application. However, when precision is needed (e.g., "A heap for the purpose of this tax law is 500 grains"), we do not treat this as a change of subject (like defining 'bank' as 'financial institution' only). We treat it as a *resolution* of the existing term.

  1.  **Distinguishing from Ambiguity:** If vagueness were ambiguity, precisification would be disambiguation (selecting one meaning). But 'heap' does not have two meanings to select from. A theory must explain what is being selected if not a meaning.
  2.  **Distinguishing from Ignorance:** If vagueness were ignorance (Epistemicism), precisification would be guessing the unknown fact. But we are *allowed* to stipulate the cutoff. We are not permitted to stipulate facts we don't know (e.g., we cannot stipulate the exact number of stars in the sky). A theory must explain why we have the *authority* to stipulate the extension of 'heap' but not 'number of stars'.
  3.  **Why Non-Negotiable:** A theory of vagueness that cannot account for the transition from vague discourse to precise regulation fails to explain a primary function of vague language in social coordination. If Supervaluationism says precisification is "selecting an admissible candidate," it must explain why that selection is legitimate. If Epistemicism says it is "guessing the boundary," it must explain why the guess becomes binding. Without this, the theory is descriptively incomplete regarding linguistic practice.

  ---

  ### Brief Scoring of Main Views

  *   **Epistemicism:** Scores high on **Logical Constraints** (preserves Classical Logic, Bivalence, T-Scheme) and **Penumbral Connections**. It fails the **No-Arbitrary-Boundary Constraint** (admits sharp boundaries) and struggles with **The Legitimacy of Precisification** (makes stipulation look like guessing).
  *   **Supervaluationism:** Scores high on **No-Arbitrary-Boundary** (at first order) and **Legitimacy of Precisification** (precisifications are built into the semantics). It fails **Unrestricted T-Scheme** (truth-value gaps break $T(p) \leftrightarrow p$) and struggles with **Higher-Order Vagueness** (reintroduces sharp boundaries at the level of supertruth).
  *   **Many-Valued/Fuzzy:** Scores high on **Borderline Phenomenology** (degrees match intuition). It fails **Classical Validity** (Modus Ponens often degrees-off) and **Higher-Order Vagueness** (sharp boundaries between truth degrees).
  *   **Contextualism:** Scores high on **Sorites Susceptibility** (context shifts explain the slide). It struggles with **Penumbral Connections** across contexts and can appear to change the subject rather than solving the semantic problem.

  No theory satisfies the full list. The choice of theory is ultimately a choice of which Parochial Requirement one is willing to violate.
