answer: |-
  This is one of the most intuitive and tempting ideas in AI alignment, and you are in good company: many researchers started with exactly this hope. The intuition is based on **revealed preference theory** from economics—the idea that you can infer what someone values by observing what they choose.

  However, if you try to build a safe AI today using *only* raw human demonstrations and standard IRL, you will likely run into serious problems. The short answer is: **No, preferences do not just "drop out" of behavior.**

  Here is why that assumption breaks down, and what researchers are doing instead to get closer to "real" preferences.

  ### 1. The Rationality Assumption Problem
  Standard IRL algorithms generally assume the demonstrator is acting **optimally** (or near-optimally) to maximize their reward.
  *   **The Math:** $Policy \approx \text{argmax}(Reward)$
  *   **The Reality:** Humans are not rational optimizers. We suffer from **akrasia** (weakness of will), cognitive biases, fatigue, and lack of information.

  **Example:** Imagine you are trying to diet, but you eat a donut.
  *   **Standard IRL conclusion:** "The human values donuts highly. The reward function for eating donuts is high."
  *   **Reality:** The human values health *more*, but failed to execute due to impulse.
  *   **The Risk:** If you train an AI on this, it might conclude you *want* it to feed you donuts constantly, because that's what your behavior maximized.

  To solve this, you can't just collect *more* data; you need to change the **model of the human**. You need "Structured IRL" or models that explicitly account for human irrationality (e.g., modeling the human as having a reward function but also a "noise" or "bias" function).

  ### 2. The Identifiability Problem
  This is a mathematical issue. For almost any set of behaviors, there are **infinite reward functions** that could explain them.
  *   **Example:** You drive to work every day.
      *   **Reward Function A:** "I value being at work."
      *   **Reward Function B:** "I value staying on paved roads."
      *   **Reward Function C:** "I value avoiding police tickets."
  *   All three result in the exact same trajectory. Standard IRL cannot distinguish between them without seeing you in **counterfactual situations** (e.g., what if the road was unpaved? What if there was no police?).

  If you only collect demonstrations of people doing their normal routines, the AI learns a reward function that works for *that specific context* but might fail catastrophically when the AI takes actions in new situations (distributional shift).

  ### 3. "Real" Preferences vs. Actual Behavior
  There is a philosophical distinction here that matters for safety. We usually don't want an AI to satisfy our **revealed preferences** (what we actually do); we want it to satisfy our **idealized preferences** (what we would want if we were smarter, calmer, and knew more).

  *   **Addiction:** A smoker demonstrates behavior that maximizes nicotine intake. IRL learns "nicotine = good." But the smoker's *real* preference might be "to be healthy."
  *   **Coercion/Constraints:** If someone works a dangerous job because they need money, IRL might learn "danger = acceptable." But their preference is "safety," constrained by "need money."

  ### So, how *should* we collect data?
  Since raw demonstrations are ambiguous and noisy, the field has shifted toward methods that extract more signal than just "watching." Here is the current best thinking on data collection for value learning:

  #### A. Preference Comparisons (RLHF style)
  Instead of asking "Show me how to do this," ask "Which of these two outcomes is better?"
  *   **Why:** This cancels out some of the "execution noise." A human might fail to bake a perfect cake (bad demo), but they can reliably look at two cakes and say which one tastes better (good preference signal).
  *   **Data Collection:** Generate pairs of trajectories/outcomes and have humans rank them. This is more robust to human incompetence than pure IRL.

  #### B. Diverse Contexts & Constraints
  To solve the identifiability problem, you need to see humans acting under **varying constraints**.
  *   **Don't just record success:** Record people trying and failing. Record people under time pressure vs. relaxed. Record people explaining *why* they did something.
  *   **Why:** If I see you stop at a red light when you're late, and stop at a red light when you're early, I learn "red lights matter." If I only see you stop when a cop is watching, I learn "cops matter."

  #### C. Cooperative IRL (CIRL)
  This is a framework proposed by researchers like Dylan Hadfield-Menell. Instead of the AI passively watching, the AI and Human play a cooperative game.
  *   **The Setup:** The AI knows it *doesn't* know the reward. The human knows the AI is trying to learn.
  *   **The Behavior:** The human might act pedagogically (showing the AI specific things to clarify uncertainty) rather than just trying to maximize their own reward.
  *   **Data Collection:** You need interactive data where the human knows they are teaching the AI.

  #### D. Corrections and Interventions
  One of the highest-signal data points is **correction**.
  *   If the AI starts doing something and the human shuts it off or corrects it, that is a massive negative reward signal.
  *   **Data Collection:** Allow humans to intervene in the AI's process. "Off-switch" data is often more valuable than "successful demonstration" data because it highlights boundary conditions of what is *not* allowed.

  ### Summary
  Your intuition is the "Null Hypothesis" of alignment: *Behavior reveals value.*
  The current consensus is: *Behavior reveals value + biases + constraints + mistakes.*

  To get the "real" preferences, you cannot just scale up demonstrations. You need to:
  1.  **Model human irrationality** (assume the human might be acting against their own interests).
  2.  **Collect preference data** (comparisons) rather than just action data.
  3.  **Seek interactive data** (corrections, teaching scenarios) rather than passive observation.

  If you treat human behavior as ground-truth optimization, you will build an AI that perfectly replicates human flaws. The goal is to learn the objective the human *wishes* they were optimizing, not the one they actually are.
