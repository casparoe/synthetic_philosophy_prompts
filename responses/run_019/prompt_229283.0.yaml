          *   Diverse contexts (see them under stress, relaxation, different constraints).
          *   Model the human (bring in cognitive science).
      *   *Current State:* Mention that modern alignment (RLHF) moved away from pure IRL for exactly these reasons. We use comparisons because they reveal more signal about *relative* value than absolute actions.

  5.  **Refining Tone:**
