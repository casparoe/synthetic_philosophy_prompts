      *   *Did I mention CIRL?* Yes, Hadfield-Menell's work is crucial here.
      *   *Did I mention the difference between IRL and RLHF?* Important distinction. RLHF is often preference-based, not purely inverse RL from demonstrations.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "what they do" and "what they want" is highlighted, as that's the crux of the user's confusion. (Make sure to mention *akrasia* specifically as it's the clearest example).

