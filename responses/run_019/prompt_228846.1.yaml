answer: |-
  # PREP SHEET: DISSERTATION SEMINAR Q&A
  **Topic:** Goodman's New Riddle, Natural Kinds, and Test Procedures
  **Time:** 40 Minutes Q&A
  **Audience:** 15 (3 Key Interlocutors + Grad Students/Biologists)

  ---

  ## I. STRATEGIC ASSESSMENT

  **The Weaker Link:**
  Be honest: **The Positive Proposal (Test Procedures)** is the vulnerable point. The critique of Natural Kinds (the "theoretical grue" argument) is destructive and intuitive; it's hard for them to prove a negative. But the positive account invites the circularity charge and requires precise definitions you may not have fully stabilized. Expect 70% of the fire to land on the test-procedure relativization.

  **The "Hope Nobody Asks" Question:**
  *"Isn't 'uniform test procedure' just a synonym for 'projectible predicate'? If you can't define a uniform test without assuming the predicates describing the test are themselves projectible, haven't you just renamed the problem rather than solving it?"*
  (This is the circularity worry in its deadliest form. If asked, see the reply under "General/Circularity" below.)

  ---

  ## II. KEY INTERLOCUTORS & OBJECTIONS

  ### 1. The Goodman Scholar (Exegetical/Historical)
  **Voice:** Weary, precise, focused on *Fact, Fiction, and Forecast* (FFF). She dislikes "solutions" that miss the pragmatic point.
  **Likely Objection:**
  "You're treating the New Riddle as a bug to be fixed by finding the right epistemic anchor (tests). But Goodman's point in FFF was that there *is* no anchor outside linguistic practice. Confirmation is irreducibly language-relative. By trying to ground projectibility in 'test procedures,' you're smuggling in a privileged vocabulary of testing. Doesn't this just reproduce the language-relativity Goodman identified, while pretending you've escaped it?"

  *   **Damage if it lands:** High. It undermines the motivation for the positive view, making it look like a misunderstanding of the tradition.
  *   **Concede:** Goodman is right that there is no *view from nowhere*; all testing happens within a linguistic practice.
  *   **Hold:** The riddle isn't just about language; it's about the *material* conditions of verification. Entrenchment explains *what* we project, but not *why* some predicates resist entrenchment initially.
  *   **2-Minute Reply:**
      "I agree Goodman shows we can't step outside language. But he leaves us with entrenchment as a brute sociological fact. My claim is that 'test procedures' explain the *constraints* on entrenchment. We don't entrench 'grue' not just because we haven't said it enough, but because our material practices for checking charge or color break at time *t*. I'm not escaping language-relativity; I'm arguing that the *physics of testing* constrains which linguistic projects survive reflective equilibrium. Goodman stopped at the linguistic circle; I'm pointing out the physical friction inside it."
  *   **Soft Spot:** If she presses that "physical friction" is just another linguistic description, you risk regress.

  ### 2. The Bayesian Formal Epistemologists (x2)
  **Voice:** Impatient with "hand-wavy" epistemology, focused on probability distributions, likelihoods, and coherence.
  **Likely Objection:**
  "This seems like unnecessary metaphysical baggage. In a Bayesian framework, 'grue' hypotheses simply receive vanishingly low priors because they are gerrymandered relative to our background knowledge. You don't need a theory of 'test procedures' to tell you that. Isn't your account just a verbose, non-formal way of saying 'the likelihood of grue is low given how we measure things'?"

  *   **Damage if it lands:** Medium. It makes your work look redundant to the formal crowd, though less damaging to the core philosophical claim.
  *   **Concede:** Bayesians are right that the *math* works out with low priors.
  *   **Hold:** The riddle is about *justifying* the priors, not just assigning them. "Because it's gerrymandered" is the problem, not the solution.
  *   **2-Minute Reply:**
      "You're right that the formalism handles the *calculation*. But the New Riddle asks for the *justification* of the prior assignment. If I say 'grue gets a low prior,' the skeptic asks 'why?' If you say 'because it's unnatural,' we're back to the metaphysics I'm critiquing. My account gives the *epistemic cash value* of that low prior: it's low because the hypothesis posits a discontinuity in our testing capabilities that we have no reason to expect. I'm not replacing Bayes; I'm providing the epistemic story that justifies the prior inputs your models require."
  *   **Soft Spot:** They may argue that "justifying priors" is a pseudo-problem (subjective Bayes). Don't get dragged into subjective vs. objective priors.

  ### 3. The Metaphysician (Natural Kinds Defender)
  **Voice:** Robust realist, focused on causal powers, modal stability, and reference.
  **Likely Objection:**
  "Your 'theoretical grue' argument assumes theoretical terms like 'charge' are defined by description. But on a causal theory of reference, 'charge' picks out a property with a specific causal profile. 'Grue-charge' doesn't pick out a causal power; it picks out a time-indexed disjunction. Natural kinds exclude grue because nature is modally stable, not because our tests are uniform. You're confusing our *access* to kinds with the *grounds* of projectibility."

  *   **Damage if it lands:** High. This attacks the foundation of your critique of the standard reply.
  *   **Concede:** Causal theories of reference are strong, and nature likely has modal stability.
  *   **Hold:** Even if 'charge' refers to a causal power, the *hypothesis* that charge behaves grue-style is logically coherent and empirically equivalent until *t*. Metaphysics alone doesn't rule it out *epistemically*.
  *   **2-Minute Reply:**
      "I grant that 'charge' refers to a real property. But the New Riddle isn't about reference; it's about *projection*. Even if charge is a natural kind, I can formulate a hypothesis: 'All charge is grue-charge.' This hypothesis is consistent with all current data. The natural kinds realist says 'That's false because charge is stable.' But that's an *assumption* of induction, not a solution to the riddle. My point is: what licenses that assumption? It's not the metaphysics itself, but the fact that our *tests* for charge assume stability. Without the test-procedure constraint, the metaphysical claim is just a dogma."
  *   **Soft Spot:** If they argue that "stable causal power" *entails* "uniform testability," you need to distinguish the property from the measurement.

  ---

  ## III. THE GENERAL/CIRCULARITY WORRY
  *(Likely to come from a sharp grad student or the Bayesians)*

  **Objection:**
  "To say a predicate is projectible relative to a 'test procedure,' you have to describe that procedure. But describing the procedure requires predicates (e.g., 'press the red button,' 'read the dial'). Aren't *those* predicates assumed to be projectible? If so, haven't you defined projectibility in terms of projectibility?"

  *   **Damage if it lands:** Critical. This is the vicious circularity charge.
  *   **Concede:** It is circular, but argue it is *virtuously* coherentist, not viciously foundationalist.
  *   **Hold:** We are not looking for a foundation; we are looking for reflective equilibrium.
  *   **2-Minute Reply:**
      "It is circular, but not viciously. I'm not offering a foundationalist reduction of induction to non-inductive tests. I'm offering a coherentist account. We start with predicates we *take* to be projectible to build our tests. Those tests then feedback to constrain which new predicates we *make* projectible. The circularity is the feature, not the bug—it's Goodman's reflective equilibrium applied to instrumentation. The advantage of my view is locating *where* the friction occurs: in the material practice of testing, not just in the entrenchment of words."
  *   **Soft Spot:** If they press that this offers no *normative* guidance (i.e., "how do I know which tests to trust?"), you must admit the theory is descriptive of successful science, not a logic of discovery.

  ---

  ## IV. TACTICAL NOTES FOR THE SESSION

  1.  **Manage the Metaphysician Early:** If the Metaphysician speaks early, do not get bogged down in causal reference theory. Acknowledge the strength of natural kinds, but pivot quickly to: "Even if kinds exist, how do we *know* we've found them rather than grue-variants?" Keep the focus on *epistemology*, not ontology.
  2.  **Don't Fight the Bayesians on Math:** If they bring up likelihood ratios, agree. Your point is philosophical interpretation, not mathematical correction. Say: "My account explains the *source* of the likelihood asymmetry."
  3.  **The Goodman Scholar is the VIP:** If she seems satisfied, the room will be satisfied. If she objects, the room will smell blood. Be most deferential to her exegetical points. Acknowledge Goodman's genius before explaining where you diverge.
  4.  **Time Management:** You have 40 minutes. If a debate stalls (especially with the Metaphysician), offer to take it offline: "That's a deep metaphysical issue I'd love to discuss further, but I want to make sure we get to the epistemic implications for the rest of the group."

  ## V. CLOSING STRATEGY
  If the Q&A gets rough on the circularity point, end on this note:
  "The New Riddle shows that induction has no external justification. My claim is simply that looking at *how we test* gives us a better map of our internal justificatory practices than looking at *what kinds we posit* or *how entrenched our words are*."
