      *   *Correction:* The argument claims they can do it *without* the FOS ("pitch-dark room," "without coffee"). The intro says they *do* feel it when writing. So the argument is hypothetical: "If HOT is true, I *should* be able to do it without the writing inducing the somatic state."
      *   Okay, so the break is definitely that writing/imagining does not generate the *right kind* of HOT. It generates an *imagined* HOT, not a *monitoring* HOT.

      *   *Wait, one more nuance:* David Rosenthal (main HOT proponent) explicitly addresses this. He argues that we cannot voluntarily produce HOTs. They are generated by a "mind-reading" system unconsciously. This directly targets (4). I should mention this.

  7.  **Final Plan:**
