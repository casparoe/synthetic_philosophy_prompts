      *   **Prendick and Disgust:** This is the resistance point. Prendick's horror isn't just ethical; it's visceral disgust (the "uncanny valley"). This complicates Bentham's clean utilitarian calculus. The novel suggests human morality is tangled with aesthetic revulsion.
      *   **The Ending (London):** Prendick sees beasts in humans. This universalizes the continuum. It's not just animals becoming human; it's humans revealed as animals.
      *   **Conclusion on Philosophy:** What does fiction add? It adds the *feeling* of the boundary, the emotional weight of the "almost," which abstract argument misses.

