      *   **Moreau's Law vs. Bentham:** Moreau judges based on speech and posture (the very things Bentham rejects). The "Law" is a ritual of human-likeness.
      *   **Suffering as the Moral Fact:** The House of Pain. The creatures' agony is the undeniable reality, regardless of their ability to recite the Law. This aligns with Bentham.
