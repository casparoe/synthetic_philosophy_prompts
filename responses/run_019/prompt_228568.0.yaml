      *   *Constraint Check:* I must describe this without direct quotation.

  3.  **Deconstruct *The Island of Doctor Moreau*:**
      *   *Plot:* Prendick lands on an island where Moreau vivisects animals into human-like "Beast Folk."
      *   *The Law:* The creatures must recite rules ("Not to go on all-fours," etc.). Standing is based on adherence to human norms.
