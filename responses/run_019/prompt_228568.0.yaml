  9.  **Final Polish:** Check flow and ensure the transition between the essay and the table is smooth. Ensure the distinction between "Moral Standing the novel implicitly assigns" (which is often ambiguous or hierarchical) and "Bentham's Verdict" (which is binary based on sentience) is clear.

