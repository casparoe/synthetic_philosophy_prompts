answer: |-
  **JOINT STATEMENT ON THE ONTOLOGICAL STATUS OF MATHEMATICS IN EMPIRICAL EXPLANATION**

  **Signatories:** The Platonist Working Group and The Nominalist Working Group
  **Date:** October 26, 2023
  **Subject:** Findings of the Adversarial Collaboration on Mathematical Indispensability

  ### Part I: Agreed Framework and Common Ground

  We, the undersigned, having engaged in a sustained adversarial collaboration regarding the role of mathematics in empirical explanation, submit the following points of agreement. These claims establish the boundaries of our dispute and the criteria by which future proposals must be judged.

  1.  **Indispensability in Practice:** We agree that mathematics is currently indispensable to the *practice* of science. In the specific cases examined (detailed below), removing mathematical vocabulary renders current scientific formulations cumbersome, unintuitive, or currently inexpressible within standard nominalistic languages.
  2.  **The Role-Preservation Condition:** We affirm that the "role-preservation condition" is part of the agreed methodological framework. Any nominalist reconstruction of a mathematical explanation must preserve not only the truth values of the empirical predictions but also the *explanatory and inferential role* the mathematics originally played. A paraphrase that merely saves the phenomena but fails to capture *why* the phenomena occur, or which blocks the inferences scientists actually draw, is insufficient to settle the dispute in favor of nominalism.
  3.  **Excluded Positions:** We agree that radical skepticism (the view that science explains nothing) and radical instrumentalism (the view that mathematical statements lack truth values entirely) are off the table. We proceed on the assumption that scientific explanations aim at truth and that mathematical statements, within the context of the theory, function truth-aptly.
  4.  **Criteria for Successful Reconstruction:** For a nominalist reconstruction to be considered successful, it must demonstrate that the explanatory power of the mathematical claim derives solely from logical relations between concrete physical states, without quantifying over abstract objects. Conversely, for the Platonist to maintain their position, they must demonstrate that no such reconstruction can meet the role-preservation condition without loss of generality or modal strength.
  5.  **Common Structural Ground:** We agree to evaluate the following three structural features as the test cases for our dispute, setting aside disagreements regarding specific empirical implementations where necessary:
      *   **Graph-Theoretic Impossibility:** The explanation of why a specific physical task (e.g., traversing a network of paths) is impossible, based on the connectivity and degree of nodes (e.g., the Königsberg bridge structure).
      *   **Geometric Minimization:** The explanation of why a physical system assumes a specific shape (e.g., a honeycomb or soap film) based on variational principles minimizing surface area or energy.
      *   **Arithmetic Regularity:** The explanation of a periodic biological or physical phenomenon (e.g., the life cycles of periodical cicadas) based on number-theoretic properties such as primality.

  ### Part II: Table of Disagreements

  The following table outlines the central points of contention remaining after our collaboration. We have distinguished between substantive disagreements (regarding the nature of reality) and verbal disagreements (regarding the definition of terms), though we note that these often overlap.

  | Row | Neutral Formulation of the Question | Platonist Formulation of View | Nominalist Formulation of View | Judgment: Substantive or Verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Ontological Commitment:** Does the truth of the empirical explanation require the existence of the mathematical objects referenced? | **Yes.** The explanation is true *because* abstract objects (graphs, numbers, manifolds) exist and stand in relations that the physical system instantiates. | **No.** The explanation is true in virtue of concrete physical facts and logical consistency; mathematical terms are useful fictions or modal operators. | **Substantive.** This is a disagreement about the fundamental furniture of the universe, not merely language. |
  | **2** | **Explanatory Depth:** Does the mathematical formulation explain *why* the physical outcome was necessary, or only *that* it occurred? | **Necessity.** Mathematics explains the modal strength of the claim (why it *had* to be this way). Only abstract objects ground this necessity. | **Contingency/Logic.** The "necessity" is logical, not ontological. The physical world is contingent; math merely maps the logical space of possibilities. | **Substantive.** Disagreement on the source of modality in nature. |
  | **3** | **Paraphrase Feasibility:** Can the role-preservation condition be met by a nominalistic paraphrase? | **No.** Any paraphrase will either be gerrymandered, lose the unifying power of the math, or fail to capture the counterfactual support the math provides. | **Yes.** A paraphrase is possible (even if complex). The intuition that something is "lost" is a psychological bias toward familiar notation, not an explanatory deficit. | **Substantive (currently).** This depends on the future success of nominalistic programs (e.g., Field's nominalization). |
  | **4** | **Reference:** Do terms like "prime number" or "node" refer to objects? | **Yes.** They refer to abstract objects. | **No.** They are syncategorematic; they contribute to the truth of the sentence without referring to objects. | **Verbal (in part).** Depends on the theory of reference adopted, but implies substantive ontological differences. |

  ### Part III: Cruxes and Predictive Divergence

  The following are specific sub-questions ("cruxes") where further investigation could shift the burden of proof. We record our divergent predictions regarding what further analysis of these cruxes will reveal.

  **Crux 1: The Cost of Nominalization**
  *   **Question:** If a nominalist paraphrase exists, is its complexity so great that it violates principles of theoretical simplicity (Ockham's Razor) compared to the Platonist account?
  *   **Concrete Case:** The formalization of Newtonian gravitational theory without quantification over real numbers (à la Hartry Field).
  *   **Platonist Prediction:** The nominalist reconstruction will require an infinitely more complex axiomatization of spacetime regions, making it theoretically inferior despite ontological parsimony.
  *   **Nominalist Prediction:** The complexity is merely upfront; once established, the nominalist system is more robust because it does not rely on epistemologically mysterious causal connections to abstracta.

  **Crux 2: Modal Strength in Biological Cycles**
  *   **Question:** Does the mathematical explanation support counterfactuals that the physical explanation cannot? (e.g., "If 13 were not prime, the cicadas would not have survived.")
  *   **Concrete Case:** The 13-year and 17-year life cycles of *Magicicada* species and their avoidance of predator synchronization.
  *   **Platonist Prediction:** The explanation relies on the timeless truth of primality. The counterfactual holds even in possible worlds with different physical laws, proving the math is doing the work.
  *   **Nominalist Prediction:** The counterfactual is grounded in evolutionary selection pressures. The math describes the selection pressure but does not cause it; the counterfactual is shorthand for "If the cycle allowed synchronization, predation would increase."

  **Crux 3: Discovery vs. Justification**
  *   **Question:** Is mathematics essential for *discovering* the explanation, or only for *justifying* it post-hoc?
  *   **Concrete Case:** The use of Eulerian paths in designing circuit boards or routing algorithms.
  *   **Platonist Prediction:** Engineers rely on intuition about the graph structure to *find* the solution. Without belief in the structure, the heuristic search space is unmanageable.
  *   **Nominalist Prediction:** The graph theory is a coding scheme. The physical constraints of the circuit board determine the solution; the math is merely a high-loss compression of physical data that aids human cognition but adds no ontological weight.

  **Crux 4: The Nature of "Structure"**
  *   **Question:** Can "structure" exist without "objects" that bear the structure?
  *   **Concrete Case:** The hexagonal tiling of a honeycomb (Geometric Minimization).
  *   **Platonist Prediction:** Structure is a relation between objects. If there are no abstract objects, there is no structure to instantiate, only concrete mimics.
  *   **Nominalist Prediction:** Structure is a pattern of concrete relations. We can have the pattern (the tiling) without committing to a "Form" of the hexagon existing outside the wax.

  ***

  **Signed,**

  *The Platonist Working Group*
  *The Nominalist Working Group*
