answer: |-
  **Course:** PHIL 405: Free Will and Criminal Responsibility
  **Examination:** Final Essay
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,000–1,200 words

  ***

  ### Essay Question

  Gregg Caruso contends that without "basic desert"—grounded in ultimate control—retributive punishment is morally illegitimate, and the justice system should adopt a forward-looking public health model. Daniel Dennett counters that a compatibilist notion of responsibility, grounded in competence and evitability, preserves a robust sense of desert that justifies more than mere quarantine.

  Critically evaluate Dennett's response to Caruso. Specifically, address the charge that Dennett's "compatibilist desert" is merely a relabeling of forward-looking consequentialist considerations (deterrence, rehabilitation, safety) rather than a genuine backward-looking justificatory ground. Does Dennett successfully identify a normative middle ground that validates retributive intuitions without libertarian free will, or does his position ultimately collapse into the very forward-looking framework Caruso advocates? Defend your position with reference to the specific justificatory work "desert" is required to do in their respective accounts.

  ***

  ### Model Answer

  The debate between Gregg Caruso and Daniel Dennett turns not on the metaphysics of determinism, which both largely accept, but on the normative significance of agency within a determined world. Caruso argues that because no agent is the *ultimate* source of their actions (due to constitutive and situational luck), "basic desert" is impossible. Consequently, punishment cannot be justified by what an offender *deserves* for past actions, but only by future consequences (safety, rehabilitation). Dennett resists this eliminationism, arguing that "competence"—the ability to recognize reasons and control behavior—grounds a valid form of responsibility. To adjudicate whether Dennett offers a genuine middle position or merely relabeled consequentialism, we must examine the justificatory work his notion of desert performs.

  Caruso's challenge is rooted in the "Luck Argument." If our genetics and environment determine our character, and we did not choose them, we cannot be ultimately responsible. Therefore, inflicting suffering for "desert" is unjust. Caruso proposes a quarantine model: we restrict liberty only to prevent harm, analogous to isolating a carrier of a disease. This is purely forward-looking. If the carrier is no longer dangerous, they must be released, regardless of the severity of the past harm.

  Dennett's counter-argument relies on shifting the focus from *ultimate* origination to *competence*. He argues that moral responsibility is a social practice designed to cultivate agency. When we hold a competent agent responsible, we are engaging in a "moral dialogue" that respects their status as a reason-responsive entity. For Dennett, desert is not about metaphysical buck-stopping; it is about the appropriateness of the reactive attitudes (resentment, gratitude) within a community of agents.

  The critical test for Dennett, however, is whether this "competence-based desert" carries independent normative weight or if it dissolves into utility. If Dennett's desert is genuine, there must be cases where punishment is justified *even if* no forward-looking benefits (deterrence, safety) are achieved. If the justification vanishes when future benefits vanish, then Dennett is merely describing a complex form of consequentialism, validating Caruso's charge of relabeling.

  Dennett attempts to avoid this collapse by arguing that the practice of holding responsible *constitutes* the value of agency itself. To treat a competent agent purely as a vector of disease (as in Caruso's quarantine) is to deny their personhood. Punishment, on this view, is a form of moral communication that acknowledges the offender's capacity to have done otherwise *in the compatibilist sense*. This suggests a backward-looking element: the punishment is a response to the *breach of trust* inherent in the moral community, not just a safety measure.

  However, Caruso would press that this "moral communication" is itself instrumental. We communicate blame to modify future behavior (of the offender and the community). If we knew with certainty that punishing a specific competent agent would yield no future good (no deterrence, no rehabilitation, no norm reinforcement), Dennett's framework struggles to justify the cost of punishment. In a pure quarantine model, if a prisoner is permanently incapacitated and poses zero risk, they are released. In a desert model, they might remain incarcerated because they *deserve* it. Dennett wants to say they deserve it, but without basic desert, the "desert" is grounded in the value of the practice. If the practice yields no value in a specific instance, the justification evaporates.

  Therefore, Dennett's position is best understood not as a rescue of traditional retributivism, but as a reconstruction of desert as a *rule-consequentialist* virtue. He saves the *language* and *phenomenology* of desert because maintaining these practices yields the best long-term societal outcomes (preserving agency). This is a genuine middle ground in terms of social policy—we should treat people as responsible agents rather than patients—but it is not a middle ground in terms of *basic justification*. The ultimate warrant remains forward-looking (the health of the agency-practice), not backward-looking (the metaphysical guilt of the agent).

  Consequently, Caruso is partially right: Dennett's desert cannot support "basic desert" retribution where punishment is an intrinsic good. However, Dennett is right that Caruso's quarantine model is insufficiently respectful of personhood. The solution is not to discard responsibility but to recognize that "desert" is a pragmatic tool for maintaining a society of free agents, not a metaphysical fact. Dennett does not relabel simple consequentialism; he elevates it to a systemic level where the *practice* of desert is the good being maximized. Thus, while the *ultimate* justification is forward-looking, the *proximate* justification retains enough backward-looking force to distinguish it from simple quarantine, validating Dennett's retention of responsibility without requiring libertarian free will.

  ***

  ### Marking Scheme (Total 25 Marks)

  **1. Distinction between Basic Desert and Competence-Based Responsibility (5 Marks)**
  *   **Requirement:** Candidate must clearly define Caruso's "basic desert" (ultimate responsibility/control) versus Dennett's "competence/evitability" (reasons-responsiveness within a determined system).
  *   **Common Miss:** Candidates often conflate "basic desert" with "any desert," failing to note that Dennett accepts determinism but rejects the need for *ultimate* origination.

  **2. Identification of the "Forward-Looking Collapse" Objection (5 Marks)**
  *   **Requirement:** Candidate must articulate the core philosophical test: If future consequences (safety/deterrence) are removed, does Dennett's justification for punishment remain? This is the crux of the "relabeling" charge.
  *   **Common Miss:** Students summarize the positions but fail to isolate this specific normative test, treating the debate as merely semantic rather than justificatory.

  **3. Analysis of Dennett's "Moral Dialogue/Agency" Defense (5 Marks)**
  *   **Requirement:** Candidate must explain *why* Dennett thinks responsibility is more than quarantine (i.e., respecting personhood, moral communication, maintaining the practice of agency).
  *   **Common Miss:** Candidates attribute utilitarian motives to Dennett without explaining his specific argument about the *constitutive value* of holding agents responsible.

  **4. Evaluation of the Quarantine Analogy (5 Marks)**
  *   **Requirement:** Candidate must assess whether Caruso's public health model is an adequate substitute. Does treating criminals like disease carriers violate a normative boundary that Dennett identifies?
  *   **Common Miss:** Candidates accept the quarantine model uncritically or dismiss it as "inhumane" without analyzing the philosophical implication of removing *agency* from the equation.

  **5. Defended Verdict on the "Genuine Middle Position" (5 Marks)**
  *   **Requirement:** Candidate must take a stance. Is Dennett's desert genuine or instrumental? The answer must be consistent with the analysis provided in points 1–4. Neutrality is penalized; the prompt requires adjudication.
  *   **Common Miss:** Candidates conclude with "both have good points" without resolving the specific question of whether Dennett's desert collapses into consequentialism.
