      *   *Dennett:* Compatibilism works. We *can* hold people responsible if they are competent agents (evitability, reasons-responsiveness). Desert exists but is grounded in social practices and the value of maintaining agency, not metaphysical "buck-stopping." Punishment is justified not just by safety but by the moral dialogue of holding responsible.
      *   *The Crux:* Is Dennett's "compatibilist desert" actually *desert* (backward-looking, non-consequentialist weight) or is it just a fancy way of saying "punishing this person yields good future consequences" (forward-looking)? Caruso claims the latter; Dennett claims the former is coherent without libertarian free will.

