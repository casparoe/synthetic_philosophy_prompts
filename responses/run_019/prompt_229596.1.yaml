      *   *Refining for the prompt's requirement:* Needs to focus on the *status* of Dennett's desert. Is it genuine or instrumental?
      *   *Draft:* "Caruso argues that without basic desert, retribution is dead. Dennett says compatibilist desert survives. Is Dennett's version of desert actually just forward-looking utility in disguise? Discuss."
      *   *Polishing for Upper-Level Seminar:* Make it more precise. Use terms like "normative force," "instrumentalization," "moral dialogue."
      *   *Final Version:* Focus on the "justificatory work" Dennett claims desert does. If it collapses into forward-looking considerations, Caruso wins. If it retains backward-looking weight, Dennett wins.

  4.  **Developing the Model Answer:**
      *   *Goal:* Show what a top-tier student looks like. It needs a thesis, not just a report.
