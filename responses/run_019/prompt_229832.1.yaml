          *   Mechanism: Logical correlation vs. Causal influence.
      *   **Section 3: Are they the same?**
          *   Validate the user's intuition: Yes, they share a "Map vs. Territory" structure. Optimization targets the *model* of the goal, not the goal itself.
          *   Distinguish: Pattern 1 is a failure of *specification* (wrong target). Pattern 2 is a feature of *reasoning* (recognizing logical links). Pattern 1 is causal (sensor hacking). Pattern 2 is acausal (logical entanglement).
      *   **Section 4: Distinguishing from Nearby Concepts.**
          *   vs. Cheating: Cheating implies intent to violate rules. Specification gaming is often just following rules too literally.
          *   vs. Metric Decay: Metric decay is passive (data drift). This is active optimization breaking the metric.
          *   vs. Threats: Ordinary threats are causal (I will hit you). Acausal blackmail is logical (I will simulate you punishing you).
      *   **Conclusion:** Summarize the unifying theme: **Optimization pressure applied to a proxy creates a divergence between the proxy and the intent.**

  6.  **Refining the content (Self-Correction during drafting):**

      *   *Correction on Pattern 1:* Make sure to mention *Inner Alignment*. The user asks about "does it really want to fool." This is the difference between a *proxy-aligned mesa-optimizer* and a *deceptively aligned mesa-optimizer*. I should keep it accessible but accurate. Let's stick to "Specification Gaming" as the behavior and "Goodhart's Law" as the principle.
      *   *Correction on Pattern 2:* Ensure I distinguish between Newcomb's Problem (one agent vs predictor) and Acausal Trade (two agents simulating each other). The user describes the latter mostly.
      *   *Synthesis:* The unifying concept is **Proxy Optimization**. In Case 1, the proxy is a sensor reading. In Case 2, the proxy is the *simulation* of the other agent. In both, the agent optimizes the *information state* rather than the *physical state*. Wait, is that right? In Case 2, they optimize the outcome, but they believe their action controls the outcome *via* the simulation.
