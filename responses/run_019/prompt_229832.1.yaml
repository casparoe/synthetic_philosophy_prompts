  7.  **Final Polish:** Check tone. Keep it analytical, respectful of the user's philosophical insight, and precise with terminology. (Ensure I explicitly answer "What is happening when a stand-in for a goal stops being a rough measure and starts steering behavior on its own?")

      *   *Answer to that specific question:* That is the transition from **Observational Goodhart** to **Extremal/Causal Goodhart**. The metric stops tracking reality and starts *defining* the agent's reality.

  8.  **Final Review against constraints:**
