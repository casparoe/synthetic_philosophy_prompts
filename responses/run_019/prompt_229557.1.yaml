  ### Marking Scheme (20 Points Total)

  **Part (i): Mathematical Convergence (6 Points)**
  *   **2 pts:** Correctly identifies that maximizing expected wealth (linear utility) leads to betting the full bankroll in favorable independent gambles.
  *   **2 pts:** Correctly identifies that maximizing expected log wealth corresponds to the Kelly fraction and maximizes asymptotic growth rate.
  *   **2 pts:** Correctly states the convergence theorem (Kelly strategy almost surely dominates other fixed-fraction strategies asymptotically).

  **Part (ii): Normative Inference (8 Points)**
  *   **4 pts:** Correctly assesses the inference from mathematical convergence to normative obligation (identifies the is-ought gap; convergence describes outcomes, not value).
  *   **4 pts:** Correctly addresses the role of risk preferences (agents with different utility functions have different optimal strategies; "mistake" vs. "preference").

  **Part (iii): Relation to Expected Utility (6 Points)**
  *   **3 pts:** Correctly identifies the formal identity between maximizing expected log wealth and Expected Utility (EU) maximization with logarithmic utility.
  *   **3 pts:** Correctly draws the philosophical implication (Kelly is *within* EU theory, not a refutation of it; EU does not "fail," linear utility is just ill-suited for repeated gambles).

  ---

  ### Claim-by-Claim Analysis

  | Claim in Student Answer | Type | Assessment |
  | :--- | :--- | :--- |
  | **1.** "Expected-wealth maximizer is effectively forced to wager the entire bankroll each round." | Mathematical | **Correct.** For linear utility $U(w)=w$, the expected utility of a favorable bet is maximized at the boundary (all-in). |
  | **2.** "Maximizing expected log wealth picks the unique fraction that maximizes the asymptotic growth rate." | Mathematical | **Correct.** This is the definition/property of the Kelly criterion. |
  | **3.** "It is a theorem that this Kelly strategy almost surely overtakes any fixed-fraction competitor in the long run." | Mathematical | **Correct.** Standard result in stochastic growth theory (Breiman 1961). |
  | **4.** "So the argument does show that ordinary expected-utility reasoning fails for repeated gambles." | Normative/Theoretical | **Incorrect.** Conflates "Expected Wealth" (linear utility) with "Expected Utility" (general class). EU theory accommodates log utility. |
  | **5.** "Maximizing expected log wealth is formally identical to expected-utility maximization with logarithmic utility." | Mathematical/Theoretical | **Correct.** $E[\log(w)]$ is exactly EU with $U(w)=\log(w)$. |
  | **6.** "The convergence theorem is decisive: any agent, whatever their risk preferences, should follow Kelly." | Normative | **Incorrect.** Violates the subjectivity of utility. An agent with $U(w) = -\exp(-aw)$ has different optimal bets. Convergence $\neq$ Normativity. |
  | **7.** "Someone who deviates because they are more risk-averse than log utility is simply making a mistake about how repeated gambles actually behave." | Normative/Epistemic | **Incorrect.** Confuses preference (utility function) with belief (probability assessment). Risk aversion is not a factual error. |
  | **8.** "Kelly is the special case of expected-utility theory that happens to be right for repeated gambles." | Theoretical | **Contradictory.** If Kelly is EU, and Kelly is right, EU is not "failing" (see Claim 4). |

  ---

  ### Point-by-Point Comments

  **What the Answer Gets Right:**
  *   **Mathematical Mechanics (Part i):** The student demonstrates a solid grasp of the stochastic properties of repeated gambles. They correctly identify the behavior of linear utility maximizers (bet everything) versus log utility maximizers (Kelly bet), and they accurately cite the asymptotic dominance theorem. This satisfies the technical requirements of Part (i).
  *   **Formal Identity (Part iii):** The student correctly notes that Kelly betting is mathematically equivalent to Expected Utility maximization with a logarithmic utility function. This is the crucial technical link required in Part (iii).

  **What the Answer Gets Subtly Wrong:**
  *   **Terminological Conflation:** The student treats "ordinary expected-utility reasoning" as synonymous with "expected wealth maximization." In formal decision theory, Expected Utility is a framework that *includes* wealth maximization as a special case (linear utility). By claiming EU "fails" because linear utility performs poorly in repeated gambles, the student misunderstands the scope of EU theory.
  *   **Internal Contradiction:** The student claims EU reasoning "fails" (Claim 4) but later admits Kelly is a "special case of expected-utility theory" (Claim 8). If Kelly is the correct strategy and Kelly is an instance of EU, then EU theory successfully identifies the correct strategy. The student fails to resolve this tension.

  **Where a Step Does Not Follow (Normative Errors):**
  *   **The Is-Ought Gap (Part ii):** The student argues that because Kelly wins *almost surely* in the long run, any agent *should* bet Kelly. This is a fundamental category error in decision theory. Mathematical dominance in wealth does not imply normative superiority for an agent whose utility function values stability over growth (e.g., an agent with finite horizon or high risk aversion).
  *   **Preference vs. Belief:** The statement that a risk-averse agent is "making a mistake about how repeated gambles actually behave" is materially wrong. Risk aversion is a parameter of the utility function (preferences), not a belief about the probability distribution (epistemology). An agent can know the odds perfectly and still prefer a lower-growth strategy to avoid ruin risk in the finite short run.
  *   **Normative Universalism:** The claim that "any agent, whatever their risk preferences, should follow Kelly" contradicts the foundational subjectivism of Expected Utility Theory. The grading scheme penalizes this heavily as it undermines the core philosophical lesson of the course regarding the relation between rationality and preference.

  **Overall Assessment:**
  The answer is technically competent but theoretically confused. The student understands the *math* of the Kelly criterion but fails to understand the *decision theory* surrounding it. They endorse a "geometric rationality" normative claim that is widely contested and generally rejected in standard EU frameworks (see Samuelson 1971). They correctly identify that Kelly is EU with log utility, but fail to draw the correct conclusion (that Kelly validates EU rather than refuting it). The answer succeeds on Part (i), partially succeeds on Part (iii), but fundamentally fails Part (ii).

