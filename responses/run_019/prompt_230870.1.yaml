answer: |-
  **Scenario:** You have a friend who gets ostracized by the popular crowd. To protect your own reputation, you stop talking to them.
  **Maxim:** "I will terminate friendships whenever maintaining them harms my social standing."

  **(1) Contradiction-in-Conception (CIC):**
  If universalized, everyone drops friends who become socially costly. Friendships become temporary alliances based on utility. The concept of "association" remains; people still interact, just transactionally. The system doesn't logically collapse like promising would if everyone lied. Therefore, it passes CIC.

  **(2) Contradiction-in-Willing (CIW):**
  You desire genuine friendship, which requires loyalty. In a universalized world, loyalty is impossible; all bonds are purely instrumental. You cannot rationally will a world that makes your own desired end (genuine friendship) impossible to achieve. You contradict your own will by willing the destruction of the condition (trust) required for your happiness.

  **(3) Key Feature:**
  The gap between *logical possibility* (transactional bonds exist) and *value realization* (you value non-transactional bonds). The maxim passes CIC because the institution of "friendship" survives nominally. It fails CIW because the *value* you seek from it vanishes. If you removed the desire for genuine connection (e.g., you only wanted networking), the contradiction disappears.

  **(4) Kantian Response to Objection:**
  If you insist, "I can rationally will solitude; I don't need friends," a Kantian responds that rational beings have natural ends, including community. Willing total isolation contradicts the social nature inherent to rational agency. You inevitably rely on others for development and support; willing a world where no one relies on anyone undermines your own capacity to flourish as a human.
