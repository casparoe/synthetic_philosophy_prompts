      *   *FAQ:* Justice? Justice is internal. Negotiation? Attachment causes suffering.
      *   *Close:* Wish you tranquility.

  8.  **Review and Polish:**
      *   Check word count.
      *   Check specific requirements: "prohairesis", "dichotomy of control", "archer analogy", "preferred indifferent", "sorting exercise".
      *   Ensure no verbatim quotes (e.g., don't say "Some things are up to us...").
      *   Ensure the writer doesn't realize they are being unjust.

      *(Self-Correction during drafting)*: Make sure the "Archer analogy" is clear. The employee shot the arrow (did the work), but the wind (market conditions) moved the target. Therefore, being fired isn't a failure of virtue.

      *(Word Count Check)*: If it's too short, expand on the FAQ or the Action Items. If too long, trim the intro.

      *(Tone Check)*: Is it too sinister? It needs to be bureaucratic cheerfulness. "We are doing this *for* you."

