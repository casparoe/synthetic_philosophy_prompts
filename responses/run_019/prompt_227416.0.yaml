      It is vital to recognize that employment status is an external. Your role here, like your reputation or health, does not constitute your true self, or *prohairesis*. Losing a job cannot harm your character unless you judge it to be harmful. Therefore, we are not removing anything essential from you. We are merely returning you to the natural order of the market.

      To assist in this transition, exit interviews will open with a Sorting Exercise. You will be asked to categorize your current concerns into two columns: those within your control and those outside it. Anxiety about income falls into the latter. Once you correctly identify that your paycheck was never truly yours to command, tranquility becomes accessible.

