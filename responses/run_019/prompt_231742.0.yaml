answer: |-
  You mistake theoretical inertia for resilience. The fact that folk psychology has remained virtually unchanged since the ancient Greeks is not a virtue but an indictment; genuine sciences evolve rapidly when confronted with anomalies. Adding labels like "implicit attitudes" or "metacognition" is merely descriptive patching, not explanatory deepening. It still relies on the core ontology of propositional attitudes—states with content structured like sentences—which is computationally implausible for the brain. The history of science shows that mature theories do not just absorb anomalies; they reconstruct the ontology. Phlogiston theorists could have posited "negative phlogiston" to explain combustion gains, but that would not have saved the theory. Similarly, folk psychology's ability to label new phenomena without changing its fundamental mechanistic claims suggests it is a stagnant theory protecting itself from falsification rather than a robust framework tracking reality.

  Furthermore, folk psychology fails to explain the vast majority of cognitive activity, from the nuances of mental illness to the mechanics of learning, sleep, and memory consolidation. Neuroscience is already offering a superior ontology: activation vectors across synaptic weights, not sentences in a belief box. This framework explains generalization, prototype recognition, and speed of processing in ways propositional attitudes never could. The suppleness you admire is actually a lack of predictive precision. [Out of character: The argument most likely to change my position would be a robust demonstration that neural activity realizes symbolic, propositional structures rather than vector transformations. My reasoning is most vulnerable where I assume the incompatibility of neural dynamics and semantic content; if connectionist models turn out to be implementable via classical symbolic processing, elimination becomes unnecessary.]
