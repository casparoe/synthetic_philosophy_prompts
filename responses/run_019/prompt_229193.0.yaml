answer: |-
  Bernard Williams's famous objection that impartial moral theories demand "one thought too many" strikes at the heart of the conflict between personal integrity and universal obligation. In the case of the drowning wife, Williams argues that a husband who pauses to consult a moral principle before acting has already failed the relationship; the only legitimate motivation is the immediate recognition of the person in danger. The challenge for Williams's critics and proponents alike is determining the scope of this objection. Does it generalize to undermine any institutional role requiring impartiality, such as a triage nurse prioritizing a stranger over her own child? I argue that Williams's objection can and should be contained to constitutive personal relationships. It does not illegitimize impartiality-demanding roles because the normative structure of a professional role differs fundamentally from the normative structure of intimate attachment. The distinction lies not merely in the presence of a role, but in whether the obligation is instrumental to a project or constitutive of the self.

  To understand why the objection is contained, we must first identify precisely what feature of the original case does the work in Williams's argument. It is not simply the presence of strong emotion or intimacy. Rather, the critical feature is the *constitutive nature* of the relationship. In Williams's view, personal projects and attachments are "ground projects" that give an agent's life substance and meaning. They are not merely things one values; they are partly what make one who one is. In the drowning wife case, the husband's motivation is internal to the relationship itself. To introduce an external moral principle as a necessary condition for action is to insert a wedge between the agent and his own identity. The "one thought too many" is objectionable because it treats the relationship as contingent upon a higher moral law, rather than recognizing the relationship as a source of value in itself. The alienation Williams identifies is not psychological discomfort; it is a structural disowning of the self. If the husband requires permission from utilitarianism to save his wife, he acknowledges that his love is subordinate to an impersonal calculus, thereby alienating himself from the very attachment that grounds his integrity.

  The strongest challenge to this containment strategy arises from the triage nurse case. Consider a nurse who deeply identifies with her profession, viewing her role not as a mere job but as a vocation central to her identity. If Williams's argument relies on ground projects, and this role is a ground project, why is she not equally alienated when she follows impartial protocol over her child? The generalizer argues that if integrity protects the husband, it must protect the nurse's commitment to her role's partial demands (saving her child). However, this intuition conflates the *source* of the obligation. While the nurse may value her role constitutively, the *internal goods* of the medical profession are defined by impartial care. To act partially within the role is to fail the role itself. When the husband saves his wife, he fulfills the internal goods of marriage. When the nurse saves the stranger, she fulfills the internal goods of triage. The difference is that marriage is inherently partial, whereas triage is inherently impartial. Therefore, the "one thought too many" for the nurse—checking the protocol—is not an alienation from her integrity, but an affirmation of the specific project she has undertaken. She is not alienated from her role by following its rules; she would be alienated from her professional integrity by violating them. The husband, conversely, is alienated from his personal integrity by subjecting his partial love to an impartial test.

  This distinction becomes crucial when engaging with the reply that Williams's point concerns only *conscious thoughts*, not *justifying reasons*. Impartial theorists often argue that a moral theory need not demand the agent consciously calculate utility in the moment; it only requires that the action be *justifiable* by impartial standards. On this view, the husband can save his wife out of love, provided that saving her happens to align with the impartial good. Does this reply save impartial theories? In the case of institutional roles, yes. It is sufficient that the triage nurse's decision be justifiable by impartial protocol, even if her conscious thought is "I must save this patient." The justification and the motivation can coexist without alienation because the role is designed to serve an impartial end.

  However, this reply fails to save impartial theories in the case of intimate relationships, which confirms that Williams's objection is contained to the personal sphere. If the husband's action is only ultimately justified because it maximizes utility, then the relationship remains subordinate to the impartial theory, even if the thought doesn't occur consciously. Williams's complaint is not merely about psychological processing speed; it is about the *authority* of the justification. If the moral truth of the action depends on impartiality, then the husband's love is not the real reason the action is right; it is merely the mechanism. This renders the agent a conduit for impersonal value rather than an author of his own life. In the triage case, the agent *is* intended to be a conduit for impersonal value (public health). In the marriage case, the agent is intended to be a partner. Thus, the "justifying reasons" reply relocates the problem but does not solve it for intimacy. It admits that the ultimate authority lies outside the relationship, which is exactly the alienation Williams critiques. For the nurse, the authority *should* lie outside the personal relationship, within the public institution.

  Therefore, the line where Williams's objection stops is principled. It stops where the demand for impartiality ceases to be an external imposition on a ground project and becomes the internal definition of the project itself. Institutional roles like judges, referees, and nurses are voluntarily entered structures designed to uphold impartial standards. To demand impartiality within them is not to alienate the agent from their life, but to require them to fulfill the specific function they have chosen. Intimate relationships, however, are not chosen structures designed to uphold impartiality; they are constitutive attachments that generate partial obligations. To demand impartiality there is to demand that the agent step outside their own identity to validate their own existence.

  Williams's critique remains powerful because it protects the sphere of personal life from being colonized by the state or the moral calculus. But it does not require the abandonment of public duty. We can acknowledge that the triage nurse must treat the stranger first without conceding that her motivation must be impersonal. She acts from professional duty, which is a valid ground project, but one whose content is impartiality. The husband acts from love, whose content is partiality. The "one thought too many" is fatal only when the thought denies the validity of the partial motive as a final justification. In institutional roles, the partial motive is correctly denied as a final justification. In personal relationships, it is not. Thus, impartial moral theories can govern public roles without rendering private life unintelligible, provided they recognize that the authority of impartiality ends where the constitutive attachments of the self begin.

  \answer{Contained to constitutive relationships}
