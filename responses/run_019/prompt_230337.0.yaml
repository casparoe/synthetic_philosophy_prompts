      *   *Audience (Alignment Researchers):* Care about technical feasibility, AGI timelines, specific alignment techniques (RLHF, interpretability), skeptical of "just coordinate" because coordination is hard. They might worry this thesis implies their technical work doesn't matter.
      *   *Audience (Economists):* Care about incentives, market structures, principal-agent problems, verification costs, regulatory capture. They might worry about the feasibility of enforcement or the definition of "competitiveness."
      *   *Lab Context:* Mid-sized. They feel the pressure of competition more than a monopoly but less than a startup. They want to survive *and* be safe.

  3.  **Brainstorming Objections:**
