answer: |-
  ### Purpose and Scope
  The following framework establishes the evaluative criteria for any theory claiming to adjudicate the mindedness of composed systems (e.g., ant colonies vs. brains). The goal is not to answer the question but to fix the standards such that the answer (Yes, No, or Revised) follows non-arbitrarily.

  ---

  ### I. Desiderata for a Theory of Composed Mindedness

  #### 1. The Semantic Realism Condition (Literal vs. Metaphor)
  **Requirement:** The theory must provide truth conditions for mental predicates (e.g., "decides," "believes," "prefers") applied to collectives. It must distinguish between *distributive* claims (the ants individually decided) and *collective* claims (the colony decided), and it must specify the integration threshold where the latter becomes ontologically literal rather than a heuristic shorthand.
  *   **Constraint:** It must avoid the "Stock Market Fallacy" (counting any aggregate feedback loop as a mind) and the "Neuron Fallacy" (denying mind because components lack it).
  *   **Status:** **Hard Requirement.** Without this, the debate is merely verbal. A theory that cannot distinguish literal attribution from *façon de parler* fails to address the ontology of the question.

  #### 2. The Decentralized Subjectivity Condition (Locus & Phenomenology)
  **Requirement:** The theory must explicitly state whether "mind" entails "conscious experience" (phenomenology).
  *   **If Yes:** It must explain how a unified subject of experience emerges without a central physical locus (no "homunculus" ant or chamber).
  *   **If No:** It must distinguish "cognition" (information processing) from "mentality" (subjectivity) and justify why the term "mind" is applied to the former without the latter.
  *   **Status:** **Camp Preference.** Whether consciousness is necessary is a philosophical commitment (Functionalism vs. Phenomenology). However, *making a choice* and *sticking to it* is a **Hard Requirement**. Equivocation between cognition and consciousness is a fatal defect.

  #### 3. The Individuation and Scaling Condition (Boundary & Continuity)
  **Requirement:** The theory must define what constitutes the *bounds* of the candidate system at time *t* (e.g., does the foraging territory count as part of the mind?). It must also specify the topology of mindedness: is it binary (on/off) or scalar (degrees)?
  *   **If Binary:** It must identify a non-arbitrary threshold property crossed during growth.
  *   **If Scalar:** It must specify the point at which the ascription becomes literal enough to settle the debate (e.g., "minded enough to bear rights").
  *   **Status:** **Hard Requirement.** Biological systems grow continuously; logical ascriptions often demand discreteness. The theory must resolve this tension explicitly. Ignoring the sorites problem renders the theory inapplicable to developing systems.

  #### 4. The Mechanistic Adequacy Condition (Stigmergy & Computation)
  **Requirement:** The theory must be consistent with the empirical facts of colony organization. Specifically, it must account for *stigmergy* (coordination via environment modification) and local rules without global knowledge.
  *   **Constraint:** It cannot require top-down control or internal representations that do not exist in the mechanism. It must explain how environment-mediated coupling counts (or fails to count) as cognitive integration.
  *   **Status:** **Hard Requirement.** A theory of colony mindedness that contradicts entomological data (e.g., by assuming ants transmit global plans) is empirically false.

  #### 5. The Cross-Category Consistency Condition (Parity)
  **Requirement:** The criteria used to evaluate the colony must be applied identically to the brain, the corporation, the slime mold, and the split-brain patient.
  *   **Constraint:** No "biological chauvinism" (privileging neurons because they are wet/carbon-based) and no "exceptionalism" (excluding corporations solely because they are artificial).
  *   **Status:** **Hard Requirement.** This is the core of the parity problem. If the theory treats the brain and colony differently, it must identify a *structural* difference, not a categorical one. Failure here indicates bias, not analysis.

  ---

  ### II. Tension Analysis: The Impossible Triple

  There is a structural conflict between three specific demands within the desiderata. I call this the **Impossible Triple**:

  1.  **Non-Arbitrary Boundaries:** The system must have a definite ontological edge (Desideratum 3).
  2.  **Clean Literal/Metaphor Cutoff:** Mindedness must be a binary state to yield a Yes/No answer (Desideratum 1 & 3).
  3.  **Continuous Growth:** The system develops via degrees without discrete phase shifts (Empirical Fact in Desideratum 3 & 4).

  **Analysis:**
  These three are jointly unsatisfiable.
  *   If growth is continuous (Fact), and boundaries are non-arbitrary (Ontology), then mindedness *must* be a gradient (denying Clean Cutoff).
  *   If growth is continuous, and mindedness is binary (Logic), then the boundary *must* be arbitrary (denying Non-Arbitrary Boundaries).
  *   If boundaries are non-arbitrary, and mindedness is binary (Logic), then growth *must* occur in discrete jumps (denying Continuous Growth).

  **Resolution:**
  Since Continuous Growth is an empirical fact of both colonies and brains, and Non-Arbitrary Boundaries are required for ontological clarity, the **Clean Literal/Metaphor Cutoff** is the casualty.
  *   **Consequence:** The question "Does the colony have a mind?" is ill-posed if it demands a binary Yes/No. The theory *must* revise the question to a graded one (e.g., "To what degree...") or accept that the boundary is pragmatic rather than ontological. Any theory insisting on a sharp Yes/No without identifying a discrete phase-shift in colony development is gerrymandering the data to fit the logic.

  ---

  ### III. Scorecard: The Critical Constraint

  **The Single Requirement That Does the Most Work:**
  **The Semantic Realism Condition (Literal vs. Metaphor).**

  **Why:**
  This constraint eliminates the most candidate positions by forcing them to define *unity*.
  *   **Eliminates Deflationism:** Deflationists claim colony-mind talk is *always* metaphor. This condition forces them to explain why brain-mind talk isn't *also* metaphor, triggering the Parity Condition. If they concede brain-mind is literal, they must identify the difference.
  *   **Eliminates Naive Integrationism:** Theories that equate "information integration" with "mind" (e.g., loose IIT applications) fail here because they cannot distinguish a colony from a stock market or a highway system without arbitrary tuning. They are forced to specify *what kind* of integration creates literal subjectivity.
  *   **Eliminates Hard Functionalism:** Functionalists must explain how stigmergic environmental modifications count as "representational states" without stretching the definition of representation until it loses explanatory power.
  *   **Eliminates Phenomenal Primitivism:** Views that take "what it is like" as primitive struggle to locate the "likeness" in a decentralized system without violating the No-Central-Locus constraint.

  **Verdict:**
  The Semantic Realism Condition is the gatekeeper. It prevents the debate from dissolving into verbal ambiguity. It forces the theorist to commit to a mechanism of unification that is robust enough to survive the Parity Condition but specific enough to avoid the Stock Market Fallacy. Most theories collapse because they want the literalness of the brain without the structural commitments required to grant that same literalness to the colony.
