answer: |-
  You are running into the **Judgment Aggregation** literature (specifically the List-Pettit Impossibility Theorem), which formalizes the discursive dilemma. The "funny voting case" is just the existence proof; the spec you want is the set of axiomatic constraints that define whether a group can act as a rational agent.

  Below is the specification list derived from the formal theory, mapped to the practical cases and distinctions you requested.

  ### The Specification List

  | Requirement | Formal Name | Why It Bites (The Case/Distinction) | Non-Negotiable or Taste? |
  | :--- | :--- | :--- | :--- |
  | **1. Collective Rationality** | Consistency & Completeness | **The Core Paradox.** The group's output must be logically consistent (no $P, P \to Q, \neg Q$) and complete (a stance on every agenda item). Without this, the group holds contradictory beliefs. | **Non-Negotiable** for *belief*. If the group is an agent, it cannot be logically incoherent. (Debatable for mere *preferences*). |
  | **2. Universal Domain** | Unrestricted Input | **Ties, Abstentions, Diverse Views.** The procedure must accept *any* combination of individual judgments (including abstentions, ties, or expert disagreements) without crashing or forbidding inputs. | **Non-Negotiable** for democratic legitimacy. You cannot restrict what members are allowed to think. |
  | **3. Anonymity** | Equal Weight | **Expertise/Stakes.** Every member's judgment counts equally. If you weight by expertise, you violate this. If you don't, you ignore relevant competence. | **Taste/Context.** Non-negotiable for "one person, one vote" democracy; negotiable for expert panels or stakeholder boards. |
  | **4. Systematicity (Independence)** | Proposition Independence | **Premise vs. Conclusion.** The group's judgment on proposition $P$ should depend *only* on individual judgments on $P$, not on $Q$ or the logical connection between them. Prevents manipulation via voting order. | **Taste/Theoretical.** Intuitive for fairness, but **must be dropped** to solve the dilemma (e.g., Premise-Based Procedure violates this). |
  | **5. Dynamic Consistency** | Agenda Monotonicity | **Adding Propositions.** If you add a new proposition to the agenda later, it shouldn't retroactively flip the group's stance on previous propositions. Prevents path-dependence. | **Non-Negotiable** for stability. If the group's view flips based on the order questions are asked, the "view" is illusory. |
  | **6. Truth-Tracking** | Epistemic Quality | **Belief vs. Preference.** The goal is to find the *true* set of judgments, not just compromise. Distinguishes a "collective mind" from a "political deal." | **Taste.** Essential for courts/scientific bodies; irrelevant for legislative bargaining. |

  ### The "Killer" Requirement

  **Which single requirement rules out the most standard aggregation rules?**

  **Collective Rationality (Consistency).**

  *   **Why:** The "standard" aggregation rule is **Propositionwise Majority Voting** (vote on $P$, vote on $Q$, vote on $P \to Q$ separately). This rule satisfies Anonymity, Universal Domain, and Systematicity perfectly. However, as the discursive dilemma shows, it frequently produces **inconsistent** outcomes (e.g., accepting premises but rejecting the conclusion they entail).
  *   **The Bite:** If you demand the group be logically consistent (Requirement 1), you immediately rule out simple majority voting on connected agendas.

  *Note:* If you ask which requirement rules out the standard *solutions* (like Premise-Based Procedures), the answer is **Systematicity/Independence**. Premise-Based Procedures solve the consistency problem by letting the judgment on the conclusion depend on the judgment on the premises, thereby violating Independence.

  ### Are the Non-Negotiables Jointly Satisfiable?

  **No.**

  This is the **List-Pettit Impossibility Theorem (2002)**. You cannot simultaneously satisfy the following four conditions on a connected agenda:
  1.  **Universal Domain** (Accept any input)
  2.  **Collective Rationality** (Output must be consistent/complete)
  3.  **Anonymity** (Equal weight)
  4.  **Systematicity/Independence** (Treat all propositions equally)

  If you hold the first three as non-negotiable (which is required for a democratic, rational collective agent), **Systematicity must be dropped.** You *must* treat premises differently from conclusions (e.g., vote on premises, derive conclusion) or accept a dictatorship (which satisfies consistency by ignoring Anonymity).

  ### Brief Scoring of Existing Rules

  | Rule | Consistency | Anonymity | Systematicity | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Propositionwise Majority** | ❌ (Fails on connected agendas) | ✅ | ✅ | **Irrational.** Produces contradictory group beliefs. |
  | **Conclusion-Based** | ✅ | ✅ | ✅ | **Opaque.** Ignores reasons/premises; risks rejecting true premises to save a conclusion. |
  | **Premise-Based** | ✅ | ✅ | ❌ (Violates Independence) | **Rational.** The standard fix. Treats premises as foundational, conclusions as derivative. |
  | **Dictatorship** | ✅ | ❌ | ✅ | **Stable.** Solves the math by removing the "group" aspect. |
  | **Supermajority** | ⚠️ (Reduces risk, doesn't eliminate) | ✅ | ✅ | **Fragile.** Still vulnerable to the dilemma on specific profiles. |

  ### Summary for Your Argument
  When people stop at the "funny voting case," they miss the **Impossibility Theorem**. The spec requires you to choose: either your group is **democratic and consistent** (requiring you to abandon Independence/Systematicity via a Premise-Based Procedure) or it is **democratic and systematic** (requiring you to accept logical inconsistency). You cannot have a "fair" vote on every proposition independently and guarantee a rational group mind.
