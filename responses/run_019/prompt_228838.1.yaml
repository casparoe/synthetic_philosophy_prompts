  Based on the track record you've provided, here is an analysis of the historian's implicit rules, a prediction for the banquet case, and a proposed test case to settle the ambiguity.

  ### 1. The Historian's Rule: "Actual Causal Efficacy"

  The pattern in her first three verdicts suggests she distinguishes between **Symmetric Overdetermination** (Cases 1 & 3) and **Preemption** (Case 2).

  *   **Cases 1 & 3 (Both Count):** In both the assassin and wildfire scenarios, two distinct causal processes were initiated, **both completed their course**, and both actively contributed to the outcome at the relevant time. The bullets both struck; the fires both burned and merged. Even though either one *would* have been enough, both *did* happen.
  *   **Case 2 (Only One Counts):** The physician is excluded because their causal process was **never initiated**. The physician stood by but never poured the poison. The causal chain was cut before it began.

  **The Rule:** An agent causes an outcome only if the specific physical process they initiated was **completed and efficacious** in producing that outcome. Mere intention or preparation (Case 2) is insufficient; but if the process runs to completion alongside another (Cases 1 & 3), both get credit.

  ### 2. The Rival Rule: "Completed Agent Action"

  There is a competing rule that fits Cases 1–3 equally well but relies on a different criterion.

  **The Rule:** An agent causes an outcome if they **perform the full sequence of actions required** to produce it, regardless of whether their specific contribution was the one that physically triggered the final moment.

  *   **Cases 1 & 3:** Both assassins fired; both arsonists lit fires. (Both Count).
  *   **Case 2:** The usurper poured the poison; the physician *did not*. (Only Usurper Counts).

  Under this rule, the focus is on the **human agency** (did they do everything in their power?) rather than the **physical etiology** (did their specific molecule kill the cell?).

  ### 3. Prediction for the Banquet Case (Case 4)

  Here is where the rules diverge.

  *   **Scenario:** Soup Courtier (kills in minutes) vs. Roast Courtier (kills in hours). King dies from Soup. Roast poison is present but inert.
  *   **Application of "Actual Causal Efficacy":** The Roast Courtier's causal process was **interrupted**. The poison entered the body, but the lethal mechanism was preempted by the Soup poison before it could activate. The Roast poison did not *do* the killing; it was merely present. This is philosophically known as **Late Preemption**.
      *   *Verdict:* **Only the Soup Courtier caused the death.** (Matches Case 2 logic: the backup cause didn't finish the job).
  *   **Application of "Completed Agent Action":** The Roast Courtier **did everything required**. They poisoned the dish; the King ate it. The fact that the King was already dead when the poison kicked in is incidental to the Courtier's action. They performed the act of poisoning that *would* have killed him.
      *   *Verdict:* **Both Courtiers caused the death.** (Matches Case 1 logic: both agents completed their lethal actions).

  **My Prediction:** She will say **Only the Soup Courtier caused the death.**

  **Reasoning:** Historians generally prioritize *explanatory relevance*. If the King was already dead, the roast poison explains nothing about the death or the timing of the civil war. Including the Roast Courtier as a "cause of death" would be historically misleading, even if they were morally guilty. Her rejection of the physician in Case 2 suggests she cares about the *actual history of events*, not just the *intentions of actors*. The roast poison is historically inert regarding the death.

  ### 4. The Test Case (Case 5)

  To confirm which rule she is actually using, you need a case where an agent completes their action, but the physical effect is preempted *after* contact but *before* death. This isolates "Action" from "Efficacy."

  **The "Corpse Bullet" Case:**
  > Two assassins, acting independently, shoot a dictator. Assassin A's bullet hits the heart, causing instant death. Assassin B's bullet arrives **two seconds later** and strikes the dictator in the chest. Forensics confirm B's bullet hit the body, but the dictator was already clinically dead when it arrived.

  *   **If she says "Both caused the death":** She is following the **Completed Agent Action** rule. (B did everything right; the bullet hit).
      *   *Implication for Banquet:* She will likely say **Both Courtiers** caused the death (because the poison was ingested).
  *   **If she says "Only Assassin A caused the death":** She is following the **Actual Causal Efficacy** rule. (B's bullet contributed nothing to the death).
      *   *Implication for Banquet:* She will likely say **Only the Soup Courtier** caused the death.

  **Why this settles it:** In the Banquet case, the Roast poison is like Assassin B's bullet: it arrived at the target but found a corpse (or a dying man whose death was already sealed). If she treats the "ingested but inert" poison the same way she treats the "bullet in a corpse," you have your answer. Given her verdict on the Physician (Case 2), I suspect she will treat the "Bullet in a Corpse" as non-causal, which confirms the "Soup Only" prediction for the Banquet.
