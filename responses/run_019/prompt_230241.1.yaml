prompt: |-
  I'm taking an upper-level seminar in philosophy of biology, and this week's discussion turned on the logic of costly signaling and the handicap principle. One of my classmates defended a view I have also seen in popular science writing: conspicuous consumption — designer clothes, luxury cars, status watches — is best understood on the model of the peacock's tail. Her argument ran as follows. Both are expensive, apparently wasteful displays whose credibility seems to come from the cost itself. Just as a peacock's tail honestly advertises viability because only a healthy bird can grow and carry one, a luxury watch honestly advertises disposable wealth because the wearer had to spend it; and just as it would be wrong to call the tail a pointless burden without asking what it is for, it is wrong to treat luxury consumption as mere waste or irrationality. She used this to push against the idea that consumerist display is a social pathology, or that advertising is simply manipulative, arguing that both amount to mistaking an honest signaling system for a pointlessly wasteful one.

  I want to know how far this analogy actually holds, because I suspect it is doing more work in her argument than she admits. What I'm looking for is not a list of casual objections, but a systematic audit. What exactly maps onto what — the peahen, the tail, the cost of growing it, the health it advertises, and the conditions that make it an honest signal; what plays those roles in the human consumption case, and how well? Where does the mapping break? Which features of the biological source — sexual selection, differential costs, the link between display and underlying condition — does the analogy quietly import into the target without argument, and are those features actually present among human consumers? And once the disanalogies are on the table, does her conclusion survive: is conspicuous consumption reasonably treated as an honest signaling system, or was the analogy carrying the whole argument? If the peacock is a poor source model, I would also like to hear what a better analogy would be, if one exists.

  Please present the audit as a JSON object with the following fields. `summary`: a one-paragraph bottom-line statement of the overall verdict. `correspondence_table`: an array of objects, each with `source_element` (the component of the peacock-tail case), `target_element` (the proposed counterpart in the human case), `mapping_quality` (one of "strong", "partial", or "weak"), and `notes` (a sentence or two on whether the mapping preserves the feature that matters). `disanalogies`: an array of objects, each with `feature` (the feature the analogy imports from the source), `break_in_target` (what goes wrong with it in the consumption case), `material` (a boolean: whether this disanalogy matters for the intended conclusion), and `explanation` (why it matters or does not). `quiet_imports`: an array of strings naming assumptions the analogy brings along without saying so. `verdict`: an object with `conclusion_survives` (one of "yes", "qualified", or "no") and `statement` (a sentence or two justifying that judgment). `better_analogy`: a string giving a replacement analogy and why it is better, or null if you think none is available.
reasoning: |-
  Here's a thinking process that leads to the suggested JSON response:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy of biology seminar.
      *   **Topic:** Costly signaling theory (Handicap Principle) applied to conspicuous consumption (luxury goods).
      *   **Task:** Systematic audit of the analogy between peacock tails and luxury consumption.
      *   **Format:** JSON object with specific fields (`summary`, `correspondence_table`, `disanalogies`, `quiet_imports`, `verdict`, `better_analogy`).
      *   **Tone:** Philosophical, analytical, rigorous (not just casual objections).
      *   **Goal:** Determine if the analogy holds, where it breaks, if the conclusion survives, and if a better analogy exists.

  2.  **Deconstruct the Analogy (Peacock vs. Luxury Consumption):**
      *   *Source (Peacock):*
          *   Signal: Tail.
          *   Cost: Energy to grow, risk of predation, mobility reduction.
          *   Underlying Quality: Genetic viability/health.
          *   Receiver: Peahen (potential mate).
          *   Mechanism: Sexual selection (evolutionary pressure).
          *   Honesty Condition: Cost must be differential (harder for low-quality individuals to bear).
          *   Outcome: Reproductive success.
      *   *Target (Luxury Consumption):*
          *   Signal: Designer clothes, cars, watches.
          *   Cost: Financial expenditure.
          *   Underlying Quality: Wealth/Status/Resource holding potential.
          *   Receiver: Peers, potential mates, society.
          *   Mechanism: Cultural evolution, social stratification, mating markets.
          *   Honesty Condition: Cost must be relative to income (harder for poor people to buy).
          *   Outcome: Social status, mating opportunities, networking.

  3.  **Evaluate the Mapping (Correspondence Table):**
      *   *Tail <-> Luxury Good:* Strong. Both are visible displays.
      *   *Growth Cost <-> Financial Cost:* Partial. Biological cost is physiological/survival risk; financial cost is resource allocation. Both are "costly," but the nature of the cost differs (survival vs. budget).
      *   *Health/Viability <-> Wealth/Status:* Strong. Both are underlying qualities the signal indicates.
      *   *Peahen <-> Social Audience:* Partial. Peahens are specific (mates); audience is diffuse (peers, mates, rivals).
      *   *Sexual Selection <-> Social/Cultural Selection:* Weak/Partial. Biological evolution is slow/genetic; cultural evolution is fast/memetic.
      *   *Honesty (Differential Cost) <-> Price Barrier:* Strong. A $10k watch is harder for a poor person to buy than a rich one.

  4.  **Identify Disanalogies (Where it breaks):**
      *   *Constraint Type:* Biological constraints (physiology) vs. Economic constraints (credit, counterfeits). You can fake wealth via debt or rentals (leasing a Lamborghini), whereas a sick peacock cannot grow a tail.
      *   *Fitness Payoff:* Reproductive success (genes) vs. Social capital (money/influence).
      *   *Arbitrariness:* The tail is physically linked to health (physiological trade-off). The watch price is socially constructed (brand value). A $500 watch might tell time just as well as a $50,000 watch. The cost isn't *intrinsic* to the function in the same way.
      *   *Agency:* Peacocks don't choose to signal; it's instinctual. Humans choose strategically (sometimes ironically, sometimes deceptively).

  5.  **Identify Quiet Imports (Assumptions):**
      *   That human behavior is driven by evolutionary fitness maximization.
      *   That the cost guarantees honesty (ignoring credit/debt/fakes).
      *   That the "receiver" interprets the signal uniformly (peahens vs. diverse human subcultures).
      *   That the behavior is adaptive rather than maladaptive (consumerism might be a "supernormal stimulus" trap).

  6.  **Assess the Conclusion:**
      *   *Classmate's Claim:* Conspicuous consumption is an honest signaling system, not pathology/waste.
      *   *Verdict:* Qualified. It *is* a signaling system, but the "honesty" is much leakier than in biology. It doesn't fully exonerate it from being "wasteful" or "pathological" because the social payoff might be zero-sum or negative sum, unlike genetic propagation. The analogy supports the *function* (signaling) but not necessarily the *normative status* (not wasteful).

  7.  **Develop a Better Analogy:**
      *   *Idea:* Potlatch or Gift Economies.
      *   *Why:* These are cultural rituals of destruction/expenditure specifically designed for status. They acknowledge the *social construction* of the cost, unlike the biological inevitability of the peacock.
      *   *Alternative:* Academic Credentials (Signaling Theory in Economics/Spence). This captures the "costly but arbitrary" nature better. Let's go with Spence's Job Market Signaling because it deals with *strategic* agents and *arbitrary* costs, which fits human consumption better than instinctual biology.

  8.  **Drafting the JSON Content (Iterative refinement):**

      *   *Summary:* Needs to be punchy. The analogy captures the *logic* of signaling but fails on the *mechanism* of honesty and the *nature* of the cost.
      *   *Correspondence:* Ensure "mapping_quality" is nuanced.
      *   *Disanalogies:* Focus on "Fakability" (debt/counterfeits) and "Arbitrariness of Cost" (brand markup vs. physiological toll).
      *   *Quiet Imports:* Evolutionary psychology assumptions, stability of the signal.
      *   *Verdict:* "Qualified". It explains the *existence* of the behavior, but not its *rationality* or *social value*.
      *   *Better Analogy:* Michael Spence's Job Market Signaling. It handles strategic human agents and arbitrary costs better.

  9.  **Refining for Philosophy of Biology Context:**
      *   Use terms like "index signal," "conventional signal," "fitness," "phenotypic plasticity."
      *   Ensure the distinction between *biological evolution* and *cultural evolution* is clear.
      *   Highlight the "Handicap Principle" specifics (Zahavi).

  10. **Final Review against Constraints:**
      *   JSON format? Yes.
      *   All fields present? Yes.
      *   No casual objections? (Ensure arguments are structural).
      *   One paragraph summary? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting "Potlatch" as the better analogy. However, Spence's Signaling Model is more rigorous in terms of *logic*, which fits a philosophy seminar better. Potlatch is more anthropological. I will stick with Spence/Economic Signaling as it parallels the "costly signal" logic without assuming biological determinism. Actually, let's look closer. The prompt asks for a better analogy for *consumption*. Spence is about education. Potlatch is about consumption/destruction. Potlatch might be better for *conspicuous consumption* specifically. But Spence explains the *logic of cost* better. Let's go with Spence because it highlights the *arbitrariness* of the cost (degree vs. watch brand) vs the *physiological* cost of the tail. Actually, the prompt asks about *conspicuous consumption*. A "Tournament" or "Positional Goods" analogy might work. Let's stick with Spence because it's the standard counter-model in signaling theory for humans. Wait, the prompt asks for a "better analogy." I will suggest **Academic Credentialing (Spence Signaling)**. Why? Because it admits the cost is arbitrary (tuition/time) but socially enforced, unlike the physiological necessity of the tail. It captures the *strategic* nature of humans.

      *Re-evaluating "Better Analogy":* The peacock analogy fails because humans are strategic and costs are socially constructed. A better analogy is **Academic Degrees**.
      *   Signal: Degree.
      *   Cost: Tuition + Effort.
      *   Quality: Intelligence/Conscientiousness.
      *   Why better? It acknowledges that the cost is *conventional* (tuition fees), not *physiological*, and that agents *choose* to signal strategically, unlike peacocks. This fits luxury goods (socially set prices) better than biology (physiologically set costs).

      *Wait, one more check:* The prompt asks about "conspicuous consumption." Is there a better one? **Potlatch** is historically specific. **Tournaments** (positional goods) is abstract. Let's go with **Academic Credentialing** because it is the standard "human signaling" model in philosophy/economics that contrasts with biological signaling.

      *Wait, let's look at the "Verdict".* Does the conclusion survive? The conclusion is "it is not waste/pathology, it is honest signaling." Even if it *is* signaling, it can *still* be wasteful (zero-sum). So the conclusion does *not* fully survive. The analogy proves it's signaling, but not that it's *efficient* or *good*. So "Qualified" or "No". I'll go with "Qualified" because the signaling part holds, but the normative exoneration fails.

      *Refining the "Quiet Imports":* Need to mention that the analogy assumes the signal is *hard to fake*. In biology, it is. In economics, credit allows faking. This is crucial.

      *Final Polish of JSON:* Ensure valid JSON syntax (escape quotes, no trailing commas).

  11. **Final Construction of JSON:** (Mental check of the structure)
      *   `summary`: String.
