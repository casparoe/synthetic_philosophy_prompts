      *   *Better Analogy:* Spence's Job Market Signaling.

      *Wait, I need to make sure I don't use markdown inside the JSON strings that breaks parsing.* I will keep newlines escaped or avoid them. I will keep it single paragraph for summary.

      *Let's finalize the "Better Analogy".* Spence is good. But maybe "Potlatch" is more evocative for *consumption*. I'll stick with Spence because it's a formal model of signaling often contrasted with Zahavi in philosophy of bio/econ. It highlights the *conventional* nature of the cost.

      *Wait, one nuance:* The classmate argues it's *not* waste. The audit should show that signaling *can* be wasteful (social waste). So the analogy might actually undermine her normative claim if we look at biological waste (the tail *is* a survival burden). The peacock tail *is* a burden, just a beneficial one for mating. So calling it "not waste" is tricky. It is biologically "wasteful" for survival but "useful" for reproduction. The analogy might actually support the idea that it *is* wasteful in other terms. I need to capture this nuance.

