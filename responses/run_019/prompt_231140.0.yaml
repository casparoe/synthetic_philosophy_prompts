      *   **The Role of Inductive Bias:** Define it not as a bug but as a feature. It's a probability distribution over hypothesis space $P(H)$. The data updates this to $P(H|D)$. If $P(H)$ is uniform (unbiased), $P(H|D)$ remains effectively uniform over the infinite consistent set.
