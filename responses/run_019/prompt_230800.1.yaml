answer: |-
  The stalemate is a category error resulting from imposing a normative ethical taxonomy onto a soteriological path, where "ethics" functions as instrumental training for liberation rather than a freestanding theory of right action. Your hypothesis that the label "consequentialism" is doing too much work is correct but incomplete; the deeper structural flaw is that Western normative ethics assumes a metaphysics of solid agents and outcomes that Buddhist soteriology explicitly deconstructs. Consequentialism requires the aggregation of welfare across distinct individuals, but the Buddhist doctrine of *anatta* (no-self) and emptiness undermines the ontological stability required for such aggregation, making the "agent-neutral" demand incoherent within the system's own metaphysics. Furthermore, consequentialism seeks to maximize a positive good (welfare), whereas Buddhist ethics seeks to eliminate a structural error (craving/aversion); these are not symmetrical goals, so classifying the latter by the former inevitably distorts the teleology. The debate persists because both sides are correctly identifying different functional layers of the path—the consequentialist layer describes the soteriological outcome (cessation of suffering), while the virtue layer describes the psychological mechanism (purification of mind)—but erroneously treating these layers as competing normative theories.

  Progress requires abandoning the question "Which Western theory fits?" in favor of a functional analysis that distinguishes between soteriological efficacy and moral obligatoriness. Specifically, scholars should adopt a stratified model that treats Early Buddhist ethics as training rules (*sikkhapada*) aimed at individual liberation, while treating Mahāyāna ethics as a distinct soteriological expansion that introduces agent-neutral aspirations without necessarily adopting agent-neutral normative criteria. A concrete step forward would be to restrict comparative claims to specific textual strata rather than treating "Buddhist Ethics" as a monolith, acknowledging that the Nikāyas and the Mahāyāna Sutras may operate on different ethical logics that resist unification under a single Western label. Ultimately, the field should shift toward describing how ethical conduct functions within the mechanism of liberation (e.g., "instrumental virtue ethics" or "soteriological consequentialism") rather than forcing a binary classification that assumes ethics is an end in itself.
