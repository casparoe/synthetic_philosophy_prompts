          *   *Analogue:* "A 'toy soldier' is not a 'soldier'." It preserves the grammatical structure (Modifier + Noun) and the semantic shift (the criteria for being a toy soldier differ from a soldier). It must *not* smuggle in the idea that the object doesn't exist (a white horse exists).

