answer: |-
  **Seminar Plan: Gongsun Long's 'White Horse is Not Horse'**
  **Duration:** 50 Minutes
  **Level:** First-Year Undergraduate
  **Context:** Cross-Cultural Philosophy of Language

  ### 1. Learning Objectives
  By the end of this session, students should be able to:
  *   Distinguish between the *extension* of a term (the objects it refers to) and its *intension* (the criteria required to use the term).
  *   Reconstruct Gongsun Long's argument as a claim about conceptual identity rather than physical classification.
  *   Identify why the thesis is not merely a grammatical error or a logical fallacy regarding subsets.

  ### 2. Pre-Seminar Preparation (Instructor Notes)
  *   **Text:** Ensure students have a translation that distinguishes clearly between 'horse' (*ma*) and 'white horse' (*bai ma*). The Ames/Hall or Hansen translations are useful, but any standard academic version will suffice.
  *   **Board Work:** Prepare two columns: 'Concept/Name' (*Ming*) and 'Reality/Object' (*Shi*).
  *   **Tone:** Validate their skepticism. If you treat the text as obviously profound, they will tune out. If you treat it as obviously false, they will learn nothing. Treat it as a *rigorous error* or a *counter-intuitive insight*.

  ### 3. Session Sequence & Misconception Management

  #### **Phase 1: The Hook and The Skepticism (00:00 – 00:05)**
  *   **Activity:** Open immediately by writing 'A white horse is not a horse' on the board. Ask for a show of hands: who thinks this is true? Who thinks it is false? Who thinks it is a translation error?
  *   **Intervention (Misconception: Translation Glitch):** Address the 'translation glitch' suspicion immediately.
      *   *Action:* Explain that *fei* ('is not') is the standard negation. It is not a linguistic accident.
      *   *Goal:* Establish that this is a philosophical claim, not a philological mistake. If they believe it is a glitch, they will not engage with the logic.
  *   **Framing:** State clearly: "Gongsun Long knows white horses are physically horses. He is arguing about the *words*, not the animals."

  #### **Phase 2: The Modern Analogue (00:05 – 00:15)**
  *   **Decision:** Do **not** start with the text. Start with a modern analogue to build the conceptual structure. The text is too dense to serve as the primary introduction to the logic.
  *   **The Analogue:** Use the distinction between a **compound concept** and a **simple concept**.
      *   *Example:* "A 'stop sign' is not a 'sign'." (Or: "A 'noun phrase' is not a 'noun'.")
      *   *Better Analogue for this level:* **"A 'married man' is not a 'man'."** (In the specific sense of conceptual identity).
  *   **Constraints on the Analogue:**
      *   **Must Preserve:** The logic of *intension*. The concept 'married man' requires two criteria (male, married); the concept 'man' requires only one (male). Therefore, the *concepts* are not identical.
      *   **Must Not Smuggle In:** Physical exclusion. Do not use an example where the object is physically excluded (e.g., "A toy gun is not a gun"), as this reinforces the idea that a white horse is physically not a horse. The analogue must show that while every married man *is* a man, the *term* 'married man' is not interchangeable with the *term* 'man' in all contexts (e.g., legal forms).
  *   **Activity:** Ask students to find a context where asking for a 'man' is different from asking for a 'married man'. (e.g., "I need a man for this job" vs "I need a married man for this job").
  *   **Intervention (Misconception: Chinese Grammar/Mass Terms):** As you transition from the analogue to the Chinese text, briefly note that while some scholars argue *ma* functions like a mass noun (like 'water'), Gongsun Long treats it as a countable concept. Do not let the seminar devolve into linguistics; assert that the logical structure holds regardless of the mass/count distinction. Head this off here so they don't dismiss the argument as 'just how Chinese works' later.

  #### **Phase 3: Reconstructing the Argument (00:15 – 00:35)**
  *   **Activity:** Walk through the three main moves in the Dialogue.
      1.  **The Disparity of Names:** 'Horse' names the shape; 'White' names the colour. 'White Horse' names both. Therefore, the name 'White Horse' is not the name 'Horse'.
      2.  **The Disparity of Extension:** If you want a 'horse', a yellow or black one will do. If you want a 'white horse', a yellow or black one will not. Therefore, the requirements are different.
      3.  **The Disparity of Existence:** 'Horse' does not imply colour. 'White Horse' implies colour.
  *   **Intervention (Misconception: Subsets and Venn Diagrams):** This is the critical moment (approx. minute 25).
      *   *The Trap:* Students will say, "But the circle of White Horses is *inside* the circle of Horses."
      *   *The Correction:* Draw the Venn diagram, then cross it out. Explain that Gongsun Long is not arguing about **Class Membership** (Extension); he is arguing about **Conceptual Identity** (Intension).
      *   *Instruction:* Tell them: "If you argue using subsets, you are arguing against a claim Gongsun Long is not making. He admits the white horse falls under the category of horse. He denies that the *concept* 'White Horse' is identical to the *concept* 'Horse'."
      *   *Key Distinction:* Write on board: **Is a member of** vs. **Is identical to**.

  #### **Phase 4: Evaluation and Scope (00:35 – 00:45)**
  *   **Discussion:** Is this sophistry?
      *   Allow them to vent that it feels like wordplay.
      *   **Intervention (Misconception: Mere Sophistry):** Reframe 'sophistry'. In the Warring States period, precise language was a political tool ('Rectification of Names'). If 'White Horse' = 'Horse', then specific obligations might be confused with general ones. It is not a parlour trick; it is a demand for semantic precision.
  *   **Refusal of Scope:** Explicitly state what you are **not** covering.
      *   *Statement:* "We are not covering the broader metaphysical debate between Realism and Nominalism, nor are we comparing Gongsun Long to Plato's Forms today. That requires a different toolkit. We are strictly looking at the philosophy of language: reference and sense."
      *   *Reasoning:* First-years often conflate 'concepts' with 'Platonic Forms'. Prevent this anachronism.

  #### **Phase 5: The Closing Question (00:45 – 00:50)**
  *   **Activity:** Individual reflection followed by a show of hands or short written slip.
  *   **The Question:**
      > "Gongsun Long argues that 'White Horse is not Horse'. Based on his logic, does it follow that 'White Horse is not White'? Why or why not?"
  *   **Rationale:**
      *   If they have **memorised the verdict**, they will say "Yes, nothing is itself" or "No, because that's silly."
      *   If they have **grasped the argument**, they will recognise the asymmetry. Gongsun Long accepts 'White Horse is White' (because the concept 'White Horse' includes the attribute 'White') but denies 'White Horse is Horse' (because the concept 'White Horse' includes 'White', whereas 'Horse' does not).
      *   *Correct Understanding:* They should identify that 'White' is a component of the compound name 'White Horse', whereas 'Horse' is treated as a distinct simple name that lacks the colour component. This tests their grasp of the *compositionality* of the term, which is the engine of the argument.

  ### 4. Summary of Interventions

  | Time | Misconception | Strategy |
  | :--- | :--- | :--- |
  | **00:00** | **Translation Glitch** | Validate skepticism, then rule it out via linguistic fact (*fei* = standard negation). |
  | **00:10** | **Chinese Grammar** | Acknowledge the mass-noun theory but bracket it; insist the logic works on concepts regardless. |
  | **00:25** | **Venn Diagrams / Subsets** | **Crucial.** Distinguish Extension (membership) from Intension (identity/criteria). Cross out the Venn diagram. |
  | **00:40** | **Mere Sophistry** | Contextualise as semantic precision/Rectification of Names, not wordplay. |
  | **00:45** | **Platonic Metaphysics** | **Refuse.** Explicitly state this is not about Forms or Universals in the Western sense. |

  ### 5. Instructor's Checklist for British English
  *   Ensure spelling follows British conventions (e.g., *colour*, *analyse*, *programme*, *centre*).
  *   Maintain a tone that is rigorous but accessible; avoid Americanisms in idiom (e.g., use "mark" instead of "grade", "seminar" instead of "recitation").
  *   When referring to the text, use 'Dialogue' rather than 'Essay' or 'Paper'.

  ### 6. Contingency Plan
  *   **If they grasp it too quickly:** Push harder on the 'Rectification of Names'. Ask: "If a King promises a 'horse' to a general, can he satisfy the promise with a 'white horse' if he meant 'any horse'? Does Gongsun Long's logic protect the King or the General?"
  *   **If they are completely lost:** Abandon the text. Spend the remaining time on the 'Married Man' analogue. It is better they understand the logical distinction via the analogue than memorise the text without understanding.
