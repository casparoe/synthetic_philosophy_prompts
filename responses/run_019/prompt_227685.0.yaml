prompt: |-
  Next term I'm running one fifty-minute seminar on Gongsun Long's white horse dialogue for first-year undergraduates in a cross-cultural philosophy of language course; they will have read a translation but nothing else from the School of Names, and most will arrive suspecting the thesis that a white horse is not a horse is either a translation glitch or a parlour trick. Plan my explanation rather than giving it. What has to be in place before the argument can look like anything other than a falsehood (e.g., a distinction between what a term picks out and what it requires of what it picks out), and should the white horse itself carry the whole session or should I build the structure first on a modern analogue -- if so, say what the analogue must preserve and what it must not smuggle in. Map the misconceptions I should expect (that it is mere sophistry, that it reduces to a point about subsets and Venn diagrams, that it is really about Chinese grammar treating nouns as mass terms) and mark exactly where in the sequence each should be headed off rather than answered afterwards. Finally, give me one closing question that reveals whether they have grasped the argument as opposed to memorised the verdict, and name what I should openly refuse to cover at this level. Please write in British English.
