  2.  **Deconstruct the Epicurean Quote:**
      *   "When we are, death is not come": We exist, death hasn't happened.
      *   "When death is come, we are not": Death happened, we don't exist.
      *   Conclusion: Death is nothing to us.
      *   *Core Tension:* How can something be "nothing to us" (no harm) if it prevents us from having goods? How does "no harm" translate to "no fear"?

  3.  **Drafting the Theses (The Menu):**
      *   *Thesis 1: The Phenomenological Claim (Trivial).* You can't experience being dead.
      *   *Thesis 2: The Existence Condition (Stronger).* Harm requires a subject to exist at the time of harm.
      *   *Thesis 3: The Hedonist Claim (Value Theory).* Only conscious experience counts for well-being.
      *   *Thesis 4: The Fear Claim (Psychological/Normative).* Fear requires an object that is experienced as bad.
      *   *Thesis 5: The Total Negation Claim (Strongest).* Death has no normative significance whatsoever (no posthumous harm).

  4.  **Fleshing out each Thesis (Defensibility & Premises):**
      *   *T1:* Defensible. Premise: Experience requires existence.
      *   *T2:* Controversial. Premise: "Time of Harm" constraint. Counter: Deprivation happens *at* a time, just not experienced.
      *   *T3:* Controversial. Premise: Hedonism/Experientialism. Counter: Desire fulfillment theories (I can be harmed if my wishes are thwarted after death).
      *   *T4:* Nuanced. Even if death isn't *experienced*, anticipation can be painful.
      *   *T5:* Very Strong. Denies posthumous harm entirely.

  5.  **Addressing the "Payoff" (Dread vs. Harm):**
      *   Even if death isn't bad *for the dead*, is it rational to fear *becoming* dead?
      *   Distinction: Fear of the *state* of being dead vs. Fear of the *process* of dying vs. Fear of *loss*.
      *   Epicurus targets the *state*. He doesn't necessarily address the *loss* (Deprivation).

  6.  **Addressing Counter-Arguments:**
      *   *The Deprivation Account (Nagel):* Death is bad because it takes away future goods. This attacks T2 and T3. It says harm doesn't need to be felt.
      *   *The Symmetry Argument (Lucretius):* Pre-natal non-existence vs. Post-mortem non-existence. We don't fear the past; why fear the future? This supports Epicurus but is contested (Parfit, etc.).

