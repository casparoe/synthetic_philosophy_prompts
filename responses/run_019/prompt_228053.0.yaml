answer: |-
  The diagnosis
  You should reject premise (1). It clearly looks harmless because it conflates rational optimality with moral obligation. In practical reasoning, we often treat the best option as the only rational choice. We naturally assume that if action A is better than action B, reason demands A. However, this smuggles in a maximising consequentialist framework where 'ought' implies 'best'. To preserve supererogation, you must distinguish between what is ideally best and what is strictly required. The premise appears tame because it mirrors everyday advice—'you ought to take the faster route'—but moral 'oughts' carry a sanction or demand that optimal 'oughts' lack. By accepting (1), you accept that morality is purely maximising, leaving no room for actions that are good but not mandatory. The break lies in recognising that 'ought' can denote a threshold of acceptability rather than the peak of perfection. Thus, the passerby *can* do better without *obligation* to do so.

  The price list
  Rejecting (1) adopts a 'satisficing' view, where morality sets a baseline rather than a ceiling. The cost is explaining why rationality permits sub-optimal choices; it risks making moral limits appear arbitrary. Why is volunteering obligatory but heroism optional? Setting that threshold non-arbitrarily is notoriously difficult. Indeed, you must explain why the moral law stops demanding once 'good enough' is achieved. Furthermore, satisficing struggles to accommodate the personal point of view without seeming selfish. It must justify why my interests trump the greater good sometimes. Conversely, accepting your friend's conclusion saves logical simplicity but incurs the 'demandingness objection'. Morality becomes oppressive, forbidding leisure until all good is maximised. This contradicts our deepest intuitions about personal latitude and the special status of heroes. It renders sainthood merely dutiful, stripping heroes of praise-worthy excess. You lose the distinction between what I owe others and what I owe myself. Ultimately, the price is either theoretical messiness or human alienation. Rejecting (1) feels most natural but requires robust meta-ethical groundwork to prevent the threshold from collapsing back into maximisation under scrutiny. You pay with complexity to save the phenomenon of heroic grace.

  Your verdict
  I would reject (1). The cost of arbitrariness is preferable to the cost of moral oppression. A theory that condemns watching telly as wrong fails to capture the human experience of morality. We should accept that 'ought' implies a sufficient standard, not necessarily the optimal one, preserving the special glory of the saint instead.
