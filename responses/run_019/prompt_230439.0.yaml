answer: |-
  You are not crazy, and you didn't lose this argument because you were logically inconsistent. You actually stumbled directly into one of the most famous problems in modern philosophy and moral psychology.

  Your friend essentially recreated a famous thought experiment known as **The Knobe Effect** (named after philosopher Joshua Knobe, who published it in 2003).

  Here is the breakdown of why this happened, who is "right," and how you can resolve the disagreement without defending your cousin's ethics.

  ### 1. The Knobe Effect
  In Knobe's study, he presented people with two scenarios almost identical to yours:
  1.  **Harm:** A VP implements a program to increase profits. He is told it will *harm* the environment. He says, "I don't care, I just want profit." Result: Environment harmed.
  2.  **Help:** A VP implements a program to increase profits. He is told it will *help* the environment. He says, "I don't care, I just want profit." Result: Environment helped.

  Knobe asked participants: Did the VP *intentionally* harm/help the environment?
  *   **82%** said he **intentionally harmed** the environment.
  *   **23%** said he **intentionally helped** the environment.

  Your intuition (and the intuition of the vast majority of human beings) is that the bad side effect is intentional, but the good side effect is not. Your friend is arguing for logical consistency based on the actor's mental state, while you are arguing based on how we actually use language to assign moral responsibility.

  ### 2. Why Your Friend Feels They Won (The Consistency Argument)
  Your friend is arguing from a **strict mental-state definition** of intention.
  *   **The Logic:** In both cases, the cousin's mental state was identical. He desired profit. He foresaw the side effect. He did not desire the side effect. Therefore, the label "intentional" should be the same for both.
  *   **The Point:** If you say "Yes" to the harm but "No" to the help, you are letting your moral judgment of the outcome change your definition of the word "intentional." Technically, on a semantic level, your friend is correct that the *mechanics* of the decision were the same.

  ### 3. Why You Feel You're Right (The Moral Responsibility Argument)
  You are arguing from a **normative definition** of intention.
  *   **The Logic:** In everyday language, we don't use "intentional" just to describe a mechanical chain of events. We use it to signal **blame**.
  *   **The Point:** When something bad happens, we look for a reason to hold someone accountable. If we call it "intentional," it justifies punishment or blame. When something good happens, we don't need to find blame, so we don't bother upgrading a "side effect" to an "intentional act."
  *   **Philosophers' Take:** Many philosophers argue this isn't a bug in human reasoning; it's a feature. We conceive of "action" differently when moral norms are violated. By ignoring the harm, the cousin showed a disregard that makes the harm feel more "part of the plan" than the help would have.

  ### 4. The Middle Ground: "Knowing" vs. "Intentional"
  You don't have to concede that your cousin is innocent, and you don't have to concede your friend is right about the word "intentional." There is a third category that fits your cousin perfectly: **Recklessness** or **Knowledge.**

  In law and ethics, there is a distinction between:
  *   **Purpose:** "I want X to happen." (Your cousin did not want the river polluted).
  *   **Knowledge:** "I know X will happen." (Your cousin knew the river would be polluted).

  Most legal systems treat **knowing** a result is practically certain as sufficient for liability, even if it wasn't the *goal*.
  *   **Your Stance:** You can tell your friend: *"I agree the mental state was the same. But 'intentional' is a word we use to mark blame. Since he knew it would happen and proceeded anyway, he is **responsible**, even if it wasn't his primary **goal**."*

  ### 5. So, Who Is Right?
  *   **On Semantics/Logic:** Your friend has a point. If "intentional" means "actively desired as an end goal," then neither case is intentional.
  *   **On Human Psychology/Language:** You are right. That is not how humans use the word. We embed moral judgment into our definitions of action.
  *   **On Ethics:** **You are both missing the point about the cousin.** Whether you call it "intentional" or "foreseen side effect," your cousin made a choice to prioritize profit over known environmental damage.

  ### How to End the Argument
  You can go back to your friend and say this:

  > "I looked it up, and we basically recreated the 'Knobe Effect' experiment from 2003. Most people answer exactly like I did. It turns out humans don't define 'intentional' just by mental states; we define it by moral blame.
  >
  > But here's the thing: I don't need to call it 'intentional' to say he's guilty. If I drive a car knowing the brakes are faulty because I don't want to pay for repairs, and I hit someone, I didn't *intend* to hit them. But I'm still criminally liable. My cousin didn't need to *want* to pollute the river to be responsible for it. He just needed to know it would happen and do it anyway."

  This validates your intuition (you aren't inconsistent, you're human), acknowledges their logic (yes, the mental state was the same), but keeps the moral condemnation on your cousin where it belongs.
