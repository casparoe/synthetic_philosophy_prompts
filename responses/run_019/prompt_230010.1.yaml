      *   *The "Always Switch" Logic:* Students need to calculate Expected Value (EV). If I have $X$, the other is $X/2$ or $2X$. EV = $0.5(X/2) + 0.5(2X) = 1.25X$. Since $1.25X > X$, switch.
      *   *The Catch:* This reasoning assumes $P(other = 2X | my = X) = 0.5$ regardless of $X$. This implies an improper prior.
