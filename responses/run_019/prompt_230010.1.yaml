answer: |-
  Dear Colleague,

  It is a pleasure to hear that you are designing an experiential session for your decision theory seminar, and I believe having students inhabit the paradox before dissecting it is the most effective pedagogical approach for this topic. To make the two-envelope problem visceral for eighteen students in a two-hour block, you will need to construct a scenario where the expected value calculation feels compellingly correct before revealing its contradiction. You should begin by preparing ninety sealed manila envelopes, enough for five rounds of play with a few spares, and inside each envelope place a slip of paper with a printed number. The numbers should be arranged in pairs where one is exactly double the other, such as ten and twenty, twenty and forty, or forty and eighty, drawn from a range that feels sufficiently open-ended to avoid boundary effects, perhaps spanning from ten up to five thousand. You will also need a simple scoring sheet for each student to record their envelope value, their decision, and their final score, along with a projector or board to aggregate the class data in real time. To ensure the choices feel consequential without using real money, you should tie the outcome to a tangible academic reward, such as allocating one percent of their final course grade based on their accumulated points across the rounds, or alternatively offering a significant prize like a book or a course waiver to the top scorer, which usually suffices to trigger risk-averse and risk-seeking behaviors alike.

  The session should unfold in three distinct phases of activity followed by a lengthy debrief, and you should allocate the first fifteen minutes to distributing the materials and explaining the rules without revealing the theoretical trap. Pair the students off into nine dyads and give each pair two envelopes from the same numerical pair, ensuring that if one student holds a slip reading fifty, their partner holds either twenty-five or one hundred. Instruct them that their goal is to maximize their point total and that after opening their envelope and viewing their number, they must decide whether to keep their current amount or switch with their partner. Crucially, you should provide a worksheet that prompts them to justify their decision using expected value, asking them to write down what they believe the other envelope contains and the probability of each case, which subtly scaffolds the erroneous reasoning that leads to the paradox. Run this open-envelope phase for two rounds of about fifteen minutes each, allowing time for them to calculate, decide, and then reveal the outcomes to their partners, which will likely result in a majority of students choosing to switch because the calculation of zero point five times half the amount plus zero point five times double the amount yields an expected value of one point two five times their current holding.

  Once the intuition that switching is beneficial has been established through these repeated trials, you should move to the critical symmetric phase in the third round, which should last about twenty minutes. For this round, instruct the students to hold their envelopes but strictly forbid them from opening them, asking them to decide whether to switch based solely on the symmetry of the situation. You will likely find that the same students who argued for switching based on expected value in the previous rounds will now argue for switching based on symmetry, claiming that since the situation is identical for both parties, there is no reason to stay, yet if both students switch, they simply exchange envelopes and end up with exactly what they started with, thereby exposing the contradiction that switching cannot be universally advantageous. After collecting the data from all three rounds, you should reserve the remaining fifty minutes for a structured debrief that maps their experiential moments onto the formal structure of the paradox, beginning by asking them to articulate why the expected value calculation felt so convincing in the first phase.

  During the debrief, you must guide them to see that the mistake lies in treating the observed amount as a fixed variable across the two possible comparisons, whereas in reality the total amount in play changes depending on which envelope they initially picked. You should draw a tree diagram on the board showing the hidden amount pairs to visualize that the probability of the other envelope being double or half is not necessarily uniform once a specific value is observed, which introduces the problem of the implicit uniform distribution over possible envelope contents. You will need to explain that the reasoning fails because it assumes a prior distribution that assigns equal probability to all possible values, which is impossible over an infinite range, and this is where the mathematical resolution regarding improper priors must be supplied since the activity itself cannot make the measure-theoretic constraints vivid. It is also vital to highlight the symmetry of the unopened case to demonstrate that if switching were always rational, both parties would switch indefinitely, creating a loop of value creation from nothing, which violates the zero-sum nature of the exchange within each pair.

  You should anticipate specific challenges regarding students who have already encountered the paradox, as their prior knowledge can deflate the tension required for the activity to work. The best approach is to identify these students before the class begins, perhaps via a quick email survey, and ask them to serve as neutral observers or data recorders who are tasked with noting the arguments of their peers rather than participating in the decision-making themselves. If you cannot identify them beforehand, you should instruct the entire class at the outset that anyone who knows the solution must remain silent about the resolution until the debrief, framing it as a matter of academic integrity to allow their peers the opportunity for discovery, though you should be aware that this relies on their cooperation and may not be fully effective. Predictably, the first time you run this activity, some students will fail to engage with the expected value calculation and will instead rely on gut feeling or risk aversion, which might dilute the unanimity of the always-switch reasoning. To mitigate this, you should walk around during the decision phases and gently prompt hesitant students to write down the mathematical expectation, reinforcing the logic that leads to the paradox rather than letting them opt out of the reasoning process.

  Another predictable failure involves the range of numbers used in the envelopes, as students who receive a very high number may suspect it is the maximum possible value and refuse to switch, thereby breaking the illusion of the unbounded distribution. You can handle this by explicitly stating in the rules that the numbers are drawn from a distribution with no known upper bound, even if practically you must cap them for printing purposes, and by ensuring the maximum value is high enough that no student encounters it during the short session. You must also accept that the activity cannot fully resolve the paradox on its own, as the visceral experience of the contradiction does not automatically provide the Bayesian correction regarding prior probabilities. This limitation means you must be prepared to lecture clearly on the difference between the unconditional probability of picking a pair and the conditional probability of holding the larger amount given a specific value, which is the core theoretical insight they need to leave with. By balancing the experiential confusion of the game with the rigorous clarification of the debrief, you can ensure that the students not only understand the solution but also remember why the incorrect reasoning was so seductive in the first place.

  I hope this structure serves your seminar well and that your students find the tension between intuition and calculation as provocative as mine usually do. Please feel free to adapt the numbers or the scoring stakes to fit your specific grading scheme, and I am confident that letting them walk into the trap before showing them the exit will make the lesson on decision theory unforgettable.

  Warmly,

  Your Colleague
