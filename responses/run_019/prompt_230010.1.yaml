      *   *Payoff:* Since no real money, use course credit points or a "tournament score" that affects a small grade component or simply bragging rights/status. Let's suggest a small stake in the final grade (e.g., 1% of the course grade) or a convertible currency for a end-of-term prize. To make it feel consequential without budget, a "decision score" logged publicly works well.
      *   *Procedure:*
