      *   Check Claim 6 again: Does Compatibilism conflict with Indeterminism? No. But it makes the *motivation* for Indeterminism weak. I should mention this.
      *   Check Claim 2: Is it consistent with 4? Yes. 2 is about logical modality, 4 is about physical/metaphysical modality.
