          *   B: If space is continuous, they are actual/ontological.
          *   Test: Staccato Runner.
          *   Prediction A: Staccato runner is impossible/not required for normal motion.
          *   Prediction B: If Staccato runner is impossible, normal motion must not consist of these stages.
      *   *Crux 2 (Convergence vs. Completion):*
          *   Neutral: Does $\lim S_n = L$ entail completion of tasks?
