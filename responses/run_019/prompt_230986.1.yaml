      *   Countable vs. Uncountable: The paradox relies on a countable sequence of sub-tasks, not the uncountable set of points in the continuum.
      *   Calculus success: It shows the total distance/time is finite.
      *   Calculus limitation: It doesn't explicitly model the *causal mechanism* of completing the infinite sequence.
      *   Misleading slogan: "Calculus solves it" conflates mathematical convergence with metaphysical possibility of traversal.

  4.  **Drafting Part 2: Disagreements Table:**
      *   *Crux 1 (Real-stages):*
          *   Neutral: Are Z-sub-journeys ontological or descriptive?
