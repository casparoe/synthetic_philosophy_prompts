  **INTERNAL MEMORANDUM**

  **TO:** All Front-Desk Personnel
  **FROM:** Duty Manager
  **DATE:** 24 October 2023
  **RE:** Occupancy Protocols Following Full-Capacity Incidents

  Following last night's operational cycle, wherein the hotel reached full occupancy prior to the arrival of several infinite parties, the following protocols are to be enacted immediately to maintain service standards and room integrity. All staff must adhere to these relocation procedures without engaging in debate regarding the theoretical limits of the building.

  1.  **Single Late Arrival:** In the event of a single guest arriving when all rooms are occupied, instruct the current occupant of room $n$ to relocate to room $n+1$ for all $n \geq 1$. This procedure vacates room 1 for the new arrival. Ensure luggage transfer is coordinated sequentially to prevent corridor congestion.

  2.  **Single Infinite Coach:** Should a coach carrying countably infinitely many guests arrive, relocate the current occupant of room $n$ to room $2n$. This frees all odd-numbered rooms. Assign the $n$-th guest from the coach to room $2n-1$. Please confirm that no guest is assigned to an even-numbered room during this intake.

  3.  **Infinite Coaches:** In the scenario where countably infinitely many coaches, each containing countably infinitely many guests, arrive simultaneously, existing guests must be relocated to room $2n$ to clear all odd-numbered rooms. For the new arrivals, assign passenger $j$ of coach $i$ (where $i, j \geq 1$) to room $2k-1$, where $k$ is derived via the standard diagonal enumeration:
      $$k = \frac{(i + j)(i + j + 1)}{2} + j$$
      Staff should utilise the provided pairing matrices to calculate $k$ efficiently. Do not attempt to fill rooms sequentially by coach; this will result in a capacity overflow error.

  4.  **Continuum Capacity Limit:** Please note that a coach carrying a continuum of guests (e.g., guests indexed by real numbers between 0 and 1) cannot be accommodated. This is not a matter of staffing or housekeeping bandwidth. The set of such guests is uncountable, whereas the room numbering system is strictly countable. No bijection exists between the guest list and the available rooms. Politely explain that the hotel's cardinality is insufficient for their party size and refer them to establishments with higher-dimensional capacity.

  **Guest Relations Incident**

  During the night shift, the following complaint was lodged by a guest currently residing in Room 7:

  > *"I have walked down the corridor for twenty minutes and have not found the end. I insist there is a last room, presumably for emergency storage or staff use. I demand to be moved there immediately as my current room is too close to the lift."*

  **Management Response:**
  *"Thank you for your feedback. We wish to clarify that the corridor is unbounded and possesses no maximal element. Consequently, a 'last room' does not exist within the topology of the hotel. We are unable to facilitate a transfer to a non-existent suite, but we would be happy to move you to Room 14, provided the occupant therein is relocated to Room 28."*

  **For the Avoidance of Doubt**

  *   Check-out time remains 11:00 AM regardless of the cardinality of the departing group.
  *   Guests occupying prime-numbered rooms are not entitled to additional amenities unless specified in their loyalty tier.
  *   Under no circumstances should staff attempt to count the total number of rooms to verify occupancy levels. This is a futile exercise that delays check-in.

  We appreciate your cooperation in managing these complex occupancy variables. Please direct any queries regarding transfinite arithmetic to the Mathematics Department, not Guest Services.

  **Duty Manager**
  Hilbert's Hotel
