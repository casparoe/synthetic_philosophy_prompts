answer: |-
  The single requirement that eliminates the most existing accounts is the mandate to explain **costly, fitness-reducing practices alongside belief transmission**, and the pair of desiderata that cannot be jointly satisfied is **methodological neutrality on truth claims versus a genuinely debunking causal explanation**.

  ### Reasoning on Exclusion and Tension
  The requirement to explain **costly practices** (e.g., fasting, sacrifice, martyrdom) kills pure Cognitive Science of Religion (CSR) accounts that treat belief as a low-cost by-product of cognition (HADD, MCI) without addressing why humans sustain fitness-reducing commitments. Conversely, strict evolutionary accounts often explain the cost via group selection but fail to account for the cognitive constraints (variability, MCI) that shape the content. Regarding the tension: a naturalistic theory explains religion via causes like cognitive bias or social selection. If these causes render the truth of religious claims irrelevant (e.g., "belief exists because it coerces cooperation," not because it is true), the explanation is functionally debunking. To remain **neutral on truth**, the theory must allow that these natural causes could coexist with supernatural truth (compatibilism), but this moves outside naturalistic methodology. Thus, a theory is either methodologically neutral (agnostic on truth) or explanatorily debunking (truth rendered unnecessary); holding both simultaneously creates a logical fracture in the causal chain.

  ### Desiderata for an Adequate Theory

  **Phenomena to Explain**
  1.  **Universality with radical variability in content:** Religion appears in all cultures but varies wildly in doctrine. [Non-negotiable]
  2.  **Costly and fitness-reducing practices:** Explanation must account for resource sacrifice and risk-taking. [Non-negotiable]
  3.  **Action on professed beliefs:** Why people act on beliefs rather than merely stating them (belief-behavior link). [Non-negotiable]
  4.  **Moralising, punishing gods:** Common but not universal; appears historically recent in large societies. [Non-negotiable]
  5.  **Afterlives and supernatural punishment:** Mechanisms for extending social monitoring beyond death. [Non-negotiable]
  6.  **Stabilization and transmission:** How beliefs survive across generations despite entropy and skepticism. [Non-negotiable]

  **Distinctions Not to Collapse**
  7.  **Explaining belief vs. assessing truth:** Causal explanation must not conflate with ontological judgment. [Non-negotiable]
  8.  **Origin vs. Maintenance:** How religion started is distinct from why it persists. [Non-negotiable]
  9.  **Individual cognition vs. Cultural transmission:** Psychological mechanisms distinct from epidemiological spread. [Non-negotiable]
  10. **By-product vs. Adaptation:** Must distinguish whether religion is a spandrel or selected trait. [Non-negotiable]
  11. **Resolve By-product vs. Adaptation:** Categorizing religion primarily as one or the other. [Preference of one camp]
  12. **Proximate vs. Ultimate cause:** Mechanism (how) distinct from function (why). [Non-negotiable]

  **Behavioral/Cognitive Constraints**
  13. **Hyperactive Agency Detection (HADD):** Theory cannot contradict tendency to over-detect agents. [Non-negotiable]
  14. **Memorability of Minimally Counterintuitive (MCI) ideas:** Theory must accommodate cognitive constraints on content. [Non-negotiable]
  15. **Credibility-Enhancing Displays (CED):** Theory must account for how observed actions drive belief. [Non-negotiable]
  16. **Costly Signaling:** Theory cannot contradict data on hard-to-fake commitments. [Non-negotiable]
  17. **Link between moralising gods and large complex societies:** Theory must align with historical correlation data. [Non-negotiable]

  ### Incompatible Desiderata Pair
  *   **Neutrality on Truth vs. Debunking Explanation:** As noted above, a theory cannot simultaneously claim to offer a complete naturalistic causal account that renders supernatural hypotheses unnecessary (debunking) while maintaining strict agnosticism on the truth value of those hypotheses (neutrality). Most adequate naturalistic theories must choose: either they are compatibilist (neutral but causally incomplete regarding truth) or eliminativist (debunking but non-neutral).

  ### Brief Scorecard of Current Accounts
  *   **Cognitive Science of Religion (Boyer, Barrett):** Strong on HADD/MCI/Universality; weak on Costly Practices/Maintenance/Function. (Fails Desiderata 2, 6)
  *   **Evolutionary Psychology (Bulbulia, Wilson):** Strong on Costly Signaling/Function; weak on Cognitive Constraints/Variability. (Fails Desiderata 1, 14)
  *   **Cultural Evolution (Norenzayan, Henrich):** Strong on Moralising Gods/Transmission/Society Link; sometimes weak on Individual Cognition/Origins. (Fails Desiderata 8, 13)
  *   **By-Product/Spandrel Accounts (Gould, Pinker):** Strong on Origin/Cognition; weak on Maintenance/Costly Practices. (Fails Desiderata 2, 6)

  None currently satisfy all non-negotiable desiderata simultaneously.
