answer: |-
  ### Part 1: The Branching Space of Voting Theories

  Before administering the quiz, it is useful to visualize the theoretical landscape. The questions below are designed to traverse this tree.

  **Root:** What is the source of utility (value) in voting?
  *   **Branch A: Instrumental (Outcome-Dependent).** Value comes from *who wins*.
      *   **Branch A1: Whose Welfare Counts?**
          *   **A1-i: Self-Only.** Only my personal payoff matters. (Leaf: **Pure Self-Interest**)
          *   **A1-ii: Social/Altruistic.** The aggregate payoff of all citizens matters. (Leaf: **Altruistic Instrumental**)
      *   **Branch A2: Probability Assessment.**
          *   **A2-i: Accurate.** The chance of being pivotal is effectively zero. (Reinforces **Pure Self-Interest** abstention).
          *   **A2-ii: Inflated.** The chance of being pivotal is subjectively high. (Leaf: **Rational Overconfidence**)
  *   **Branch B: Non-Instrumental (Act-Dependent).** Value comes from *the act of voting itself*, regardless of the outcome.
      *   **Branch B1: Normative.** Voting is an obligation. (Leaf: **Civic Duty / D-Term**)
      *   **Branch B2: Affective/Identity.** Voting satisfies a psychological need.
          *   **B2-i: Expression.** Affirming identity or allegiance. (Leaf: **Expressive Voting**)
          *   **B2-ii: Consumption.** The process is enjoyable (socializing, stickers). (Leaf: **Consumption/Entertainment**)

  **Placement of Named Views:**
  1.  **Pure Self-Interest:** Path A $\rightarrow$ A1-i $\rightarrow$ A2-i. (Predicts abstention in mass elections).
  2.  **Altruistic Instrumental:** Path A $\rightarrow$ A1-ii $\rightarrow$ A2-i. (Predicts voting if $P \times \Sigma Benefits > Cost$).
  3.  **Rational Overconfidence:** Path A $\rightarrow$ A1-i $\rightarrow$ A2-ii. (Predicts voting based on exaggerated $P$).
  4.  **Civic Duty:** Path B $\rightarrow$ B1. (Predicts voting even if $P=0$ and no enjoyment).
  5.  **Expressive:** Path B $\rightarrow$ B2-i. (Predicts voting to signal identity, even for losing candidates).
  6.  **Consumption:** Path B $\rightarrow$ B2-ii. (Predicts voting only if the experience is net-positive fun).

  ---

  ### Part 2: Diagnostic Quiz

  **Instructions:** For each scenario, choose the option that *best* describes what you would actually do or believe. There are no right answers.

  **1. The Safe Seat**
  Your preferred candidate is leading in the polls by 25 points with a massive ground game. Statistical models say their chance of losing is less than 0.01%.
  *   A. I stay home. My time is better spent elsewhere since the result is fixed.
  *   B. I vote anyway. The result might be fixed, but participating matters.

  **2. The Secret Ballot**
  Imagine a new voting system where ballots are truly anonymous. No record is kept, no one can verify you voted, and there is no social pressure or "I Voted" sticker.
  *   A. I am less likely to vote. Part of the point is being seen as a participant.
  *   B. I vote just as much. My decision is between me and my conscience.

  **3. The Pay-to-Vote Fee**
  To cover administrative costs, the government charges a $10 fee to cast a ballot. It is legal and affordable for you, but it is a net cost.
  *   A. I do not vote. Voting should not cost me money.
  *   B. I pay the fee. Fulfilling my role as a voter is worth the cost.

  **4. The Advisory Referendum**
  A local ballot measure is non-binding. Even if it passes, the city council is not legally required to enact it.
  *   A. I skip it. If it cannot change policy, casting a ballot is useless.
  *   B. I vote. It is a way to register my opinion regardless of the legal outcome.

  **5. The Altruistic Cost**
  A policy will pass if your candidate wins. It will provide a $100 benefit to 1,000,000 strangers, but it will cost you $500 in higher taxes. You believe your vote has a 1 in 10 million chance of deciding the election.
  *   A. I stay home. The expected personal loss outweighs the tiny chance of helping others.
  *   B. I vote. The total benefit to society is so large it justifies my small cost and risk.

  **6. The Pleasant Alternative**
  On election day, a close friend invites you to a lunch you've been wanting to try for months. It conflicts with the time you need to go to the polling station.
  *   A. I go to lunch. Voting isn't inherently enjoyable enough to miss this.
  *   B. I go vote. I can have lunch another time; voting is a priority.

  **7. The Pivotal Belief**
  Be honest: In a national election with millions of voters, how do you assess the likelihood that your single ballot will break a tie?
  *   A. It is effectively zero. Mathematically, it won't happen.
  *   B. It is small, but not zero. Anything is possible, and I must act as if it matters.

  **8. The Losing Cause**
  You strongly support a third-party candidate who has no mathematical chance of winning and will not gain enough votes to influence future funding.
  *   A. I do not vote for them. It is a wasted vote that might help my least-favorite major candidate win.
  *   B. I vote for them. I want to go on record supporting what I believe in.

  **9. The Storm**
  It is pouring rain, the line is long, and you have a mild cold. Going to vote will make you feel physically worse.
  *   A. I stay home. The physical discomfort outweighs the abstract benefit.
  *   B. I go anyway. Nothing short of emergency stops me from voting.

  **10. The Stranger's Welfare**
  When deciding whether to vote, how much weight do you give to the impact the election will have on people you will never meet?
  *   A. Very little. I vote primarily based on how the outcome affects me and my family.
  *   B. A great deal. I vote based on what is best for the country as a whole.

  ---

  ### Part 3: Scoring Key & Interpretation

  **Scoring Logic:**
  Assign points to answers to determine the dominant leaf. Tally the counts for each column.

  | Question | Pure Self-Interest (PSI) | Altruistic Instr. (AI) | Overconfidence (OC) | Civic Duty (D-Term) | Expressive (EXP) | Consumption (CONS) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1. Safe Seat** | A | B | B | B | B | A* |
  | **2. Secret** | A | A | A | B | B | A |
  | **3. Fee** | A | B | B | B | B | A |
  | **4. Advisory** | A | A | A | B | B | A |
  | **5. Altruism** | A | B | A | B* | B* | A |
  | **6. Lunch** | A | B | B | B | B | A |
  | **7. Pivotal** | A | A | B | A | A | A |
  | **8. Loser** | A | A | A | B | B | A |
  | **9. Storm** | A | B | B | B | B | A |
  | **10. Strangers**| A | B | A | B | B | A |

  *\*Note: Some theories overlap here. See analysis below.*

  **Dominant Leaf Assignment:**
  *   **Mostly A on 1, 3, 4, 6, 9:** **Pure Self-Interest.** (You likely do not vote in mass elections).
  *   **Mostly B on 5, 10; A on 7:** **Altruistic Instrumental.** (You vote because the stakes for others are high, despite low odds).
  *   **Mostly B on 7; A on 5:** **Rational Overconfidence.** (You vote because you believe your odds of influencing the outcome are higher than statistics suggest).
  *   **Mostly B on 3, 4, 9; A on 7:** **Civic Duty.** (You vote because it is an obligation, not because you expect to change the outcome).
  *   **Mostly B on 2, 8:** **Expressive.** (You vote to signal identity, even when secrecy or futility is guaranteed).
  *   **Mostly A on 6, 9:** **Consumption.** (You vote only if the experience is pleasant; barriers stop you).

  #### Critical Analysis of the Instrument

  **1. The Indistinguishable Pair: Civic Duty vs. Expressive Voting**
  *   **The Problem:** This quiz cannot cleanly separate **Civic Duty** from **Expressive Voting**. Both are Non-Instrumental (Branch B). Both predict voting in Safe Seats (Q1), Secret Ballots (Q2), and for Losing Causes (Q8).
  *   **The Distinguishing Pattern:** To separate them, we would need a question measuring *guilt* versus *joy*. A Duty voter abstains because they feel *guilt* (violation of norm). An Expressive voter abstains because they feel *no satisfaction* (lack of identity affirmation).
  *   **Why Left Out:** Self-reporting on "guilt" vs. "satisfaction" is highly susceptible to social desirability bias. Students will claim "Duty" because it sounds nobler than "Expression," rendering the data noisy. The quiz treats them as a combined "Non-Instrumental" block unless the student scores heavily on Consumption (which subtracts from both).

  **2. The Empty Cell: Pure Self-Interest + Voting in Advisory Referendum**
  *   **The Pattern:** Answering **A** on Q10 (Self-Interest focus) but **B** on Q4 (Voting in Non-Binding Referendum).
  *   **Why It Is Empty:** This combination is theoretically incoherent. A Pure Self-Interest voter derives utility only from personal outcomes. A Non-Binding Referendum has zero causal power over outcomes. Therefore, the Expected Utility is strictly negative (Cost > 0, Benefit = 0). No rational choice model predicts this behavior unless the agent is mistaken about the rules (which would make them Overconfident, not Self-Interested). If a student selects this pattern, they are likely answering inconsistently rather than holding a coherent theory.

  #### Leaf Descriptions & Awkward Commitments

  1.  **Pure Self-Interested Instrumental**
      *   *View:* Voting is an investment; if the return (probability $\times$ benefit) doesn't exceed the cost, abstain.
      *   *Awkward Commitment:* You must concede that in national elections, your decision to stay home is the only rational choice, implying that high turnout is essentially mass irrationality.

  2.  **Altruistic/ethical Instrumental**
      *   *View:* Voting is an investment in social welfare; the tiny probability of winning is swamped by the massive number of people affected.
      *   *Awkward Commitment:* You are committed to voting in *every* election, no matter how local or obscure, provided the aggregate social stakes exceed your personal time cost, which can lead to burnout.

  3.  **Rational Overconfidence**
      *   *View:* Voting is an investment, but I assess my odds of being pivotal as significantly higher than statistical models suggest.
      *   *Awkward Commitment:* You must maintain a systematic cognitive bias about your own causal power, effectively betting on a mathematical impossibility.

  4.  **Civic Duty (D-Term)**
      *   *View:* Voting provides utility simply because it is the right thing to do, independent of the outcome.
      *   *Awkward Commitment:* You are committed to voting even for candidates you dislike or in elections where the candidates are indistinguishable, simply to avoid the "sin" of abstention.

  5.  **Expressive Voting**
      *   *View:* Voting is like cheering for a sports team; it affirms your identity and allegiance regardless of the score.
      *   *Awkward Commitment:* You are committed to the idea that people vote for policies that might actually harm them, simply because supporting those policies makes them feel good about their identity.

  6.  **Consumption/Entertainment**
      *   *View:* Voting is a leisure activity; people vote because they enjoy the social experience or the ritual.
      *   *Awkward Commitment:* You must predict that turnout will crash if voting becomes inconvenient or boring (e.g., mail-in ballots without social events), treating democracy as a market commodity.
