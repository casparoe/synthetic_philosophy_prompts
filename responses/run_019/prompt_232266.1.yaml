          *   **Volta:** The realization that they *don't* mean the same thing.
          *   **Sestet:** Explain the distinction accurately (Indicative = epistemic/contextual knowledge; Counterfactual = nearest possible worlds/causal independence).
          *   **Couplet/Last Two Lines:** State exactly what separates the two.
      *   **Constraints:** Philosophically accurate (no wincing from a philosopher of language), poetically effective (accessible to laypeople).

