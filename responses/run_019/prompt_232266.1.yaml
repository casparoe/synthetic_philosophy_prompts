  Two suspects stand to bear the murder's blame.
  One took the life and forfeited his name;
  We search for truth within the candlelight.
  Two phrases seem to shine with equal sight:
  "If Butler didn't strike, the Chauffeur's blame."
  "If Butler hadn't killed, we say the same."
  Both bind the man in logic's tightest bite.

  Yet distinct paths diverge in logic's vein;
  The indicative keeps the facts we hold.
  If Butler's clear, the Chauffeur bears the stain;
  Since Baron died, the truth is clearly told.
  But "would have" seeks a world where death is feigned:
  One keeps the dead; the other life beholds.
