answer: |-
  Here is a sequence of ten interview questions designed to press the "Apathyl/Asymbolia" objection against the Raw-Feel View.

  **1.** Let's begin by stating your position in its strongest, most uncompromising form. You argue that the badness of pain is exhausted entirely by its phenomenal character—the "what it is like" to have the experience. If that is true, does it follow that two people feeling identical pains are suffering identical harms, regardless of their attitude toward that pain, their understanding of its cause, or their psychological resilience?

  **2.** I want to lock in the implications of that "regardless." On your view, if I could reduce the felt intensity of a pain by ten percent, I have reduced the badness by exactly ten percent. Conversely, if I leave the felt intensity untouched but change everything else about how the person relates to it—their fear, their desire for it to stop, their distress—have I done *nothing* to reduce the badness of the experience itself?

  **3.** I ask because I want to introduce a clinical phenomenon that seems to drive a wedge between intensity and distress. In pain asymbolia, often resulting from cingulotomies or specific brain lesions, patients report that they can still feel the pain. They can locate it and rate its intensity on a standard scale just like anyone else. But they report that it no longer bothers them. They don't withdraw, they don't ask for relief, and they appear cheerful. On your view, are these patients still suffering just as much as a neurotypical person with the same injury?

  **4.** You might be tempted to say these patients aren't feeling "real" pain, but they insist they are. They distinguish the sensation from the suffering. If we take their self-reports seriously—that the sensory "sting" is present but the "suffering" is absent—doesn't this suggest that the badness of pain isn't in the sting itself, but in the *aversion* to the sting?

  **5.** Let's press this with a thought experiment. Imagine a drug called Apathyl. It is perfectly reversible and safe. It eliminates all concern, fear, and aversion regarding pain, but it leaves the sensory quality—the burning, throbbing, and intensity—completely chemically intact. A patient on Apathyl says, "This burns exactly as much as before, but I don't care." According to the Raw-Feel View, has this patient received any pain relief whatsoever?

  **6.** This leads to a moral question. Imagine a doctor in an emergency room. She has a choice between Morphine, which reduces felt intensity, and Apathyl, which eliminates the distress but leaves intensity untouched. If the Raw-Feel View is correct, the doctor has no reason to prefer Morphine over Apathyl regarding the *badness* of the patient's state. Is that a conclusion you are willing to endorse?

  **7.** You might object that the patient on Apathyl is still objectively worse off, even if they don't mind. But badness is usually tethered to experience. If the patient says, "I am not suffering," and their behavior shows no signs of distress, in virtue of what is the pain still "bad"? Are you positing a kind of badness that floats free of the subject's own perspective on their life?

  **8.** Alternatively, you might argue that if the aversion is gone, the felt quality *must* have changed, even if the patient denies it. But this risks defining "felt quality" in a way that contradicts the subject's own testimony. If we override the patient's report of their own experience to save the theory, aren't we simply stipulating that your view is true by definition rather than demonstrating it?

  **9.** Let's scale this up to policy. If a hospital adopted the Raw-Feel View, they might prioritize drugs that numb sensation over drugs that alleviate anxiety or distress, even if the latter makes the patient more comfortable overall. If your view implies that a hospital switching to Apathyl is leaving total suffering exactly where it was, doesn't that suggest the view is measuring the wrong thing?

  **10.** Finally, I want to ask about the limits of your commitment. What specific finding, case, or intuition pump would force you to abandon the Raw-Feel View? If tomorrow we synthesized Apathyl, and patients on it universally reported, "I am in no pain at all," despite firing nociceptors and intact sensory reports, would that falsify your position, or is there no empirical evidence that could overturn it?

  ***

  ### Explanation of Strategy

  **The Line of Attack:**
  I chose to focus exclusively on the **separation of sensation and suffering** (the Apathyl/Asymbolia wedge) rather than broader issues like the ethics of punishment or animal pain. The Raw-Feel View's strongest intuitive pull is that pain *feels* bad. The strategy here is to show that "feeling bad" is ambiguous: it can mean "having a specific sensation" or "minding that sensation." By forcing the guest to choose between the patient's self-report (that the sensation remains) and the patient's behavior/testimony (that the suffering is gone), the questions aim to show that the "badness" tracks the *minding*, not the *sensation*.

  **Anticipating Retreats:**
  *   **The "Not Real Pain" Retreat:** Questions 3 and 4 preempt the move to dismiss asymbolics as not feeling pain by emphasizing their self-reports of intact intensity.
  *   **The "Objective Badness" Retreat:** Question 7 blocks the move to say the pain is bad "for their own good" despite their indifference, framing it as a violation of the phenomenological method.
  *   **The "Semantic" Retreat:** Question 8 prevents the guest from redefining "felt quality" to secretly include aversion, pointing out that this contradicts the subject's testimony.
  *   **The "Impossible Drug" Retreat:** Question 5 and 10 frame Apathyl as a conceptual possibility (like a Gettier case), making it irrelevant whether the drug can actually be built; the point is about the *concept* of badness.

  **Contested Readings & Flags:**
  *   **Asymbolia Interpretation:** There is significant debate in philosophy of mind (e.g., between philosophers like David Bain and Murat Aydede) about whether asymbolia patients truly feel "pain" or merely "sensory detection." Some argue the affective component is constitutive of pain itself. My questions lean heavily on the interpretation that the *sensory* qualia remain intact while the *affective* qualia vanish. If the guest argues that the "feel" *necessarily* includes the "ouchiness" (the aversion), the Raw-Feel View becomes tautological (Pain is bad because pain is bad). The questions press her to deny this tautology and treat intensity as separable from aversion.
  *   **Apathyl Coherence:** The thought experiment assumes sensory intensity can be perfectly dissociated from motivational salience. Neuroscientifically, these systems are deeply intertwined (the "pain matrix"). The questions treat this as a conceptual wedge rather than a pharmacological promise, but a knowledgeable guest might challenge the coherence of the scenario. Question 10 is designed to catch this: if she says such a state is impossible *in principle*, she risks insulating her view from empirical reality.
