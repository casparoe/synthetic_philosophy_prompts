      *   This is a classic debate in Philosophy of Technology and STS (Science and Technology Studies).
      *   Key reference: Langdon Winner's "Do Artifacts Have Politics?" (1980). Winner specifically uses the example of Long Island parkway bridges (low clearance to keep out buses/poor people) and nuclear power (requires authoritarian hierarchy).
