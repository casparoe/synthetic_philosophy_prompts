prompt: |-
  I've recently ended up on the board of a small global-health foundation that funds malaria, deworming, and maternal health programs, and there's a deal on the table I can't stop chewing over. A church-based health network with genuinely deep reach in rural areas has offered to carry our malaria and deworming programs, on the condition that all the maternal-health materials co-branded with them drop any mention of contraception and instead include a short page promoting natural family planning, which their church supports. Half the board sees this as a no-brainer: we get bednets and deworming pills to communities we otherwise can't reach, and they get materials their volunteers are comfortable distributing. The other half thinks we'd be lending our name to a family-planning message we don't believe and which we think is worse for women, and that taking the deal makes us complicit in pushing it. Draft the short decision memo I can bring to the board: recommend approve, reject, or approve with conditions, give reasons the losing side can actually respond to, and end with a clear actionable bottom line.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small global-health foundation.
      *   **Context:** Funding malaria, deworming, and maternal health programs.
      *   **The Deal:** A church-based health network offers distribution reach for malaria/deworming.
      *   **The Condition:** Maternal health materials co-branded with them must remove mentions of contraception and include a page promoting Natural Family Planning (NFP).
      *   **The Conflict:** Board is split 50/50. One side prioritizes reach/impact (malaria/deworming). The other prioritizes mission integrity/women's health (contraception access).
      *   **Task:** Draft a short decision memo.
      *   **Requirements:** Recommend a path (Approve, Reject, or Approve with Conditions), provide reasons the losing side can respond to (respectful, evidence-based, principled), and end with a clear actionable bottom line.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Risks mission drift, alienates donors/partners who support reproductive health, potentially harms women by limiting info. High reach, but at what cost?
      *   *Option B: Reject.* Maintains integrity, protects women's health message. Loses significant reach for malaria/deworming.
      *   *Option C: Approve with Conditions (The "Middle Path").* This is usually the most viable governance solution in polarized scenarios. It allows for the life-saving malaria/deworming work (utilitarian good) while mitigating the harm regarding maternal health (deontological/mission integrity).
      *   *Decision:* **Approve with Conditions.** This acknowledges the value of the partnership without fully capitulating on the core mission regarding maternal health. It creates a firewall between the programs.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the recommendation clearly upfront.
      *   **Context:** Briefly summarize the offer and the tension.
      *   **Analysis (The "Why"):** This needs to address both sides of the board.
          *   *For the "Reach" side:* Acknowledge the value of malaria/deworming. These are life-saving. The church network has unique access.
          *   *For the "Integrity" side:* Acknowledge the risk. Removing contraception info contradicts evidence-based maternal health. Promoting NFP exclusively can be harmful if presented as the *only* option.
          *   *The Compromise:* Segregate the programs. Malaria/Deworming = Co-branded. Maternal Health = Separate or specific constraints.
      *   **Addressing the Losing Side (Crucial Step):**
          *   *If we approve (partially), the "Integrity" side loses a bit.* I need to validate their concern. "We are not endorsing NFP as superior, but tolerating it in a specific context to save lives elsewhere."
          *   *If we reject, the "Reach" side loses.* (But I'm recommending approval with conditions, so I need to address the Integrity side who might feel this is still too much compromise).
          *   *Actually, the prompt asks to give reasons the *losing side* can actually respond to.* If I recommend "Approve with Conditions," the "Reject" hardliners are the losing side. I need to show them why *total* rejection is worse.
          *   *Wait, let's refine:* If I recommend "Approve with Conditions," the "Reject" faction is the one being asked to compromise. I need to explain why a partial deal is better than no deal.
          *   *Alternative:* If I recommend "Reject," the "Approve" faction loses.
          *   *Best Governance Practice:* Usually, preserving the core mission is paramount. However, saving lives via malaria nets is also core. A "Firewall" approach is best.
          *   *Refined Recommendation:* **Approve with Strict Conditions (Program Segregation).**
          *   *Addressing the "Reject" side (who fear complicity):* Acknowledge that *any* co-branding with NFP is uncomfortable. But argue that the *net* lives saved (malaria) outweighs the *risk* of NFP promotion, provided we don't actively endorse NFP ourselves.
          *   *Addressing the "Approve" side (who want the deal):* Acknowledge they get the reach, but they must accept that we won't compromise our maternal health materials.
      *   **Actionable Bottom Line:** Specific vote item.

