answer: |-
  This is a fantastic observation. You have identified a genuine social-psychological phenomenon that is distinct from hypocrisy, confusion, or simple conformity.

  While there isn't one single dictionary word for this (like "schadenfreude"), there are three robust frameworks from social science, game theory, and philosophy that name and explain it.

  The most precise academic term comes from the work of social scientist **Cristina Bicchieri**, who distinguishes between **Personal Norms** and **Social Norms**.

  Here is the breakdown of what is happening, why "that's not the point" is actually a logical argument, and why the principled friend annoys people more than the cheap one.

  ### 1. The Name: "Normative Expectations" vs. "Personal Norms"
  Cristina Bicchieri, a leading expert on social norms, argues that social norms are sustained by two types of expectations:
  *   **Empirical Expectations:** I believe *others* do this (e.g., "Everyone tips").
  *   **Normative Expectations:** I believe *others expect me* to do this (e.g., "Everyone thinks I should tip").

  Your tablemates and your coworker have a **Personal Norm** ("Tipping is bad," "Escalator rules are inefficient") that conflicts with their **Normative Expectation** ("Society expects us to tip/stand right").

  When your friend refuses to tip, he isn't just violating a personal preference; he is violating the *Normative Expectation*. The anger you witness is the enforcement of the social contract. In this framework, the phenomenon is often called **Normative Enforcement despite Personal Disagreement**.

  Colloquially, you might call this **"Pragmatic Compliance"** or **"The Burden of Deviance."**

  ### 2. Why it is not Hypocrisy
  Hypocrisy requires deception or a claim to moral superiority that one does not practice.
  *   **Hypocrite:** "Tipping is mandatory and moral!" (Secretly doesn't tip).
  *   **Your Tablemates:** "Tipping is a rotten system." (Openly tips).

  They are being intellectually honest but socially pragmatic. They are not lying about their beliefs; they are prioritizing **social coordination** over **moral purity**.

  The anger they feel is not "How dare you disagree with me?" (since they agree with him). The anger is: **"How dare you make us pay for your purity?"**

  ### 3. The Game Theory: "Unilateral Deviation"
  This is a classic **Coordination Problem**.
  *   **Ideal Scenario:** No one tips. Employers pay wages. (Everyone wins, but requires collective action).
  *   **Current Equilibrium:** Everyone tips. Waiters survive. Diners pay extra. (Suboptimal, but stable).
  *   **The Friend's Move:** Unilateral Deviation.

  When one person deviates from a coordination equilibrium without the group's consent, they impose a **negative externality** on the rest of the group.
  *   **At Dinner:** By not tipping, the friend risks making the *rest* of the table look cheap, or forces them to cover the shortfall to ensure the waiter is paid. He is privatizing the moral benefit (feeling principled) and socializing the cost (awkwardness, extra cash).
  *   **On the Escalator:** If one person stands on the left, they block the flow. The coworker gets annoyed not because the rule is good, but because the *violator is reducing efficiency for everyone else.*

  The anger is a reaction to **Free-Riding on Social Stability.** They are maintaining the fragile peace of a bad system, and the friend is breaking that peace without offering a viable alternative.

  ### 4. Decoding "That's Not The Point"
  When the tablemate says, "That's not the point," they are invoking a philosophical distinction between **Ideal Theory** and **Non-Ideal Theory**.

  *   **Ideal Theory:** Discussing how the world *should* work. (In an ideal world, tipping doesn't exist).
  *   **Non-Ideal Theory:** Discussing how to act *within the world as it currently exists*. (In this world, the waiter relies on this tip).

  "That's not the point" translates to: *"We are not currently debating labor law reform; we are currently executing a transaction in a capitalist society where that waiter needs money. By treating this transaction as a protest, you are using the waiter as a pawn."*

  To them, your friend is treating a service worker's livelihood as a debating stage. That feels morally worse than simply paying the "tax" of a bad system.

  ### 5. Does it matter that your friend is principled?
  **Yes, absolutely.** In fact, it makes the anger *worse*.

  If your friend was just cheap ("I forgot my wallet," or "I'm stingy"), the tablemates would feel annoyance, but perhaps pity or simple irritation. It would be a character flaw.

  But because your friend is **principled**, he is claiming **Moral Superiority**.
  *   He is implying that he is *better* than the system.
  *   He is implying that the people who *do* tip are *complicit* in the system.

  By tipping angrily, the tablemates are defending their own moral agency. They are saying, *"I know this system sucks, but I am choosing to protect the worker within it. You are choosing to protect your ego at the worker's expense."*

  The principled refuser is engaging in what philosophers call **"Clean Hands" morality**—keeping one's own conscience clear while letting the mess fall on others. The anger is a rejection of that cleanliness.

  ### Summary
  *   **Is there a name?** In social science, it is a conflict between **Personal Norms** and **Normative Expectations**. In game theory, it is **Unilateral Deviation from a Coordination Equilibrium**.
  *   **Is it hypocrisy?** No. It is **Pragmatic Compliance**. Hypocrisy is lying about what you believe; this is acting against what you believe to prevent social harm.
  *   **Why the anger?** Because the deviator imposes a **social cost** on the compliers (awkwardness, covering the tip, blocking the path) while claiming moral high ground.
  *   **The "Point":** The point is **Non-Ideal Compliance**. In a broken system, the person who follows the rules to protect the vulnerable (the waiter) often resents the person who breaks the rules to protect their conscience.

  You could coin a term for this: **"Complicity Resentment."** It is the resentment felt by those who knowingly participate in a flawed system to mitigate harm, directed at those who opt out of the system to signal virtue.
