  10. **Final Polish:** Ensure the distinction between "explanation" and "understanding" is clear but not pedantic. Make sure the "Incompatible Pair" is stated boldly. (Self-Correction: Ensure I don't just say "prediction is impossible." I need to explain *why* the tension exists structurally).

      *Refining the Incompatible Pair:* The scientist wants *ex ante* predictability. The historian provides *ex post* intelligibility. Can a theory deliver both? No. If a theory makes the past perfectly intelligible (low entropy), it implies the outcome was constrained (high necessity). If the outcome was actually contingent (high entropy), a theory that makes it look necessary is lying. So, **Maximal Narrative Coherence** and **Faithful Representation of Contingency** are in tension. Let's frame this as **Retrospective Coherence vs. Contingent Accuracy**.

