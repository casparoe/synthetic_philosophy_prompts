      *   *Survivor:* Handling of evidentiary feedback loops.

  3.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Desideratum 1: Counterfactual Robustness.* (Addresses the scientist's "prospective" concern). If the cause hadn't happened, would the effect still occur? This tests against "inevitability."
      *   *Desideratum 2: Mechanism over Sequence.* (Addresses Narrative Fallacy). Just because A followed B doesn't mean A caused B. Need the "how."
      *   *Desideratum 3: Evidentiary Independence.* (Addresses Record Bias). The explanation can't just rely on sources created *by* the outcome to explain the outcome.
      *   *Desideratum 4: Psychological Hygiene.* (Addresses Hindsight Bias). The theory must have protocols to mitigate the "I knew it all along" effect.
      *   *Desideratum 5: Contingency Recognition.* (Addresses Actuality vs. Necessity). Acknowledging things could have gone otherwise.

  4.  **Selecting the "Non-Negotiables" vs. "Preferences":**
