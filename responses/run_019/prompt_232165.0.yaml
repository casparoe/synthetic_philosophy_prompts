answer: |-
  Here is the specification for an adequate theory of historical explanation, filtered to remove disciplinary habits (such as the demand for universal laws or strict prediction) and retained based on logical necessity and empirical constraints.

  ### The Desiderata

  **1. Counterfactual Stability (Non-Negotiable)**
  *   **The Requirement:** An explanation must identify factors such that, had they been absent, the probability of the outcome would have significantly decreased. It must support "what-if" testing.
  *   **The Case:** The outbreak of WWI. A theory that makes the war inevitable given the alliance systems fails if it cannot show how the assassination of Franz Ferdinand specifically altered the probability trajectory compared to a baseline where he lived.
  *   **The Consideration:** This addresses your concern about prospective earning. While we cannot run history in a lab, the causal claim *must* imply a counterfactual dependency. Without this, the explanation is merely a description of a sequence.

  **2. Evidentiary Independence (Non-Negotiable)**
  *   **The Requirement:** The data used to construct the explanation cannot be wholly constituted by records generated *by* the outcome itself.
  *   **The Case:** Stalinist purges. If the only records of "conspiracy" are confessions extracted *after* the purge decision was made, a theory using those confessions to explain the purge is circular.
  *   **The Consideration:** This handles the problem where the surviving record is shaped by the outcome. The explanation must rest on evidence that exists independently of the event's success or failure.

  **3. Mechanism over Sequence (Preference: Causal Realist Camp)**
  *   **The Requirement:** The theory must specify the transmission belt (the mechanism) between cause and effect, not just the temporal ordering.
  *   **The Case:** The Fall of Rome. "Barbarian invasions caused the fall" is a sequence. "Invasions disrupted tax collection, which prevented army payment, which led to defection" is a mechanism.
  *   **The Consideration:** This guards against the *post hoc ergo propter hoc* fallacy. Note: Some interpretivist camps prefer "motivic understanding" over mechanistic specification, so this is marked as a preference of the causal-realist camp, though highly recommended for a scientist.

  **4. Immunity to Outcome-Knowledge Distortion (Non-Negotiable)**
  *   **The Requirement:** The theory must include protocols that prevent the known outcome from inflating the perceived weight of antecedent conditions.
  *   **The Case:** The 2008 Financial Crisis. After the crash, risk models looked obviously flawed. Before the crash, the same models were considered robust. An adequate theory must explain why the risk was invisible *ex ante*, not just why the crash was logical *ex post*.
  *   **The Consideration:** This respects the empirical findings on hindsight bias (Fischhoff) and the narrative fallacy (Taleb). It demands the theory account for the uncertainty that actually existed at the time.

  **5. Contingency Preservation (Preference: Contingentist Camp)**
  *   **The Requirement:** The explanation must explicitly mark where the outcome was not necessary, even if it was actual.
  *   **The Case:** The rise of Christianity. A theory that traces a smooth sociological path from Judaism to Christendom risks collapsing actuality into necessity. It must acknowledge points where alternative religious landscapes were live possibilities.
  *   **The Consideration:** This maintains the distinction between *actuality* and *necessity*. Determinist camps (e.g., certain Marxists or Structuralists) would reject this, viewing contingency as an illusion of incomplete data.

  ### The Screening Requirement

  **Counterfactual Stability** is the single requirement that screens out the most candidate theories.

  Most historical narratives are "story-shaped." They select events that lead smoothly to the conclusion and ignore branches that went nowhere. This creates a "creeping determinism." A theory that cannot sustain a counterfactual query (e.g., "If X had not occurred, would Y still have happened?") collapses into a chronicle. It fails your scientific standard because it cannot distinguish between a *cause* and a *precursor*.

  ### The Incompatibility Theorem

  You asked squarely whether any pair of desiderata cannot be jointly satisfied. The answer is **yes**.

  **Retrospective Coherence** and **Ex Ante Uncertainty** are mutually limiting.

  *   **The Conflict:** To maximize **Retrospective Coherence** (making the story hang together logically), one must select causes that align tightly with the known outcome. This inevitably prunes away the "noise" of failed possibilities and alternative paths that were live options at the time.
  *   **The Consequence:** As Coherence increases, **Ex Ante Uncertainty** (the faithful representation of how unpredictable the event felt to the actors) decreases. The story looks more inevitable.
  *   **The Trade-off:** If you maximize the representation of Uncertainty (honoring the genuine contingency and confusion of the moment), the explanation loses Narrative Coherence (it looks messy, fragmented, and less "explained").

  **Verdict:** You cannot have a theory that renders a singular historical event perfectly intelligible *and* simultaneously preserves the full probabilistic openness that existed before the event. A theory that satisfies your scientific desire for "earning its keep" (by showing causal necessity) will inherently violate the psychological reality of the historical agents (who acted under uncertainty). A theory that honors the agents' uncertainty will inherently look like a weaker explanation to a scientist seeking deterministic leverage.

  This is not a flaw in the historian; it is a structural feature of singular causal inference. The "yardstick" you seek must measure where a specific explanation falls on this spectrum, rather than expecting it to clear both bars completely.
