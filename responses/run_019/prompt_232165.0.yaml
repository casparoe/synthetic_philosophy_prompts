      *   *Must distinguish correlation from causation?* (Obvious, but how in a singular case?)
      *   *Must handle contingency?* (Yes, crucial for the scientist's concern about inevitability.)
      *   *Must acknowledge the observer's bias?* (Yes, hindsight bias.)
      *   *Must explain the evidence, not just the event?* (Yes, record bias.)
      *   *Must allow for "what if"?* (Counterfactuals.)
      *   *Must be useful?* (Pragmatic view. Maybe a preference.)
