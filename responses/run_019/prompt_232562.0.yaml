answer: |-
  Good's Theorem (1967) is a cornerstone of Bayesian decision theory. It demonstrates that for an expected-utility maximizer with coherent priors, the expected value of costless information is non-negative. The logic is straightforward: upon receiving evidence, an agent updates their credences and chooses the action that maximizes expected utility relative to those new credences. Since the agent *could* have chosen that same action without the evidence, the option to update can only improve or maintain expected utility, never diminish it.

  However, intuitive counter-examples persist. A criminal defendant may rationally prefer not to know the precise location of a body to maintain plausible deniability. A patient may refuse a genetic test because the psychological burden of a positive result outweighs the medical benefits of early intervention. These cases suggest that ignorance can be instrumentally rational.

  To reconcile these cases with Good's Theorem, we can distinguish between two approaches: the **Preference-Based Approach** (modifying the utility function) and the **Constraint-Based Approach** (modifying the decision problem).

  ### Approach 1: Preferences Over Beliefs (Epistemic Utility)

  The first approach argues that Good's Theorem assumes a utility function defined solely over states of the world and actions, $U(W, A)$. However, human agents often have preferences over their own mental states. On this view, the utility function should be expanded to include credences or information states, $U(W, A, C)$.

  In the case of the patient, the disutility of the genetic test is not merely about the health outcome (the world state) but about the state of *knowing* (the credence). Anxiety, dread, or the loss of hope are treated as intrinsic disutilities associated with holding a specific belief. Similarly, the defendant may value the state of "not knowing" because it preserves their self-conception as an honest person, even if they are legally guilty.

  Under this approach, Good's Theorem remains mathematically valid but is rendered normatively limited. It applies only to agents who are indifferent to their own credences. For agents with "belief-directed preferences," information has a price attached to the belief itself. Ignorance is rational here because it satisfies a terminal preference for peace of mind or moral self-regard, not because information lacks instrumental value regarding the external world.

  ### Approach 2: Changing the Decision Problem (Constraints and Costs)

  The second approach argues that the apparent counter-examples do not satisfy the strict conditions of Good's Theorem. The theorem assumes information is **costless**, **freely disposable**, and that the agent is a **unitary, temporally consistent maximizer**. The "rational ignorance" cases violate these assumptions, changing the structure of the decision problem rather than the utility function.

  1.  **Non-Costless Information:** For the patient, the test result may trigger physiological stress responses that worsen health outcomes independent of medical treatment. Here, the information is not costless; it has a causal impact on the world state $W$.
  2.  **Strategic Constraints (The Disposal Problem):** Good's Theorem assumes an agent can "disregard" information—i.e., act as if they never received it. For the defendant under oath, this is impossible. Once they know the truth, they cannot truthfully claim ignorance. The information restricts their available strategy space (they must now choose between perjury and self-incrimination). This turns a decision problem into a game-theoretic one where information alters the opponent's (the prosecutor's) expectations or the rules of engagement.
  3.  **Temporal Inconsistency:** If the agent anticipates that future selves will be unable to ignore the information (akrasia), the current self faces a pre-commitment problem. The "cost" is the loss of flexibility for future selves.

  On this view, the theorem holds perfectly; these cases simply fall outside its scope. Ignorance is rational not because beliefs are intrinsically valued, but because the *acquisition* of information introduces external costs, strategic liabilities, or causal side-effects.

  ### Evaluation: Which Approach Does More Philosophical Work?

  The **Constraint-Based Approach (Approach 2)** does significantly more philosophical work while better preserving the central lesson of Good's Theorem.

  **1. Preserving the Instrumentalist Lesson**
  The central lesson of Good's Theorem is that information is *instrumentally* valuable for navigating the world. It is a tool for aligning actions with states of affairs.
  *   **Approach 1** undermines this by treating ignorance as an *intrinsic* good. If we allow utility to depend on credences, we risk trivializing decision theory. Any seemingly irrational avoidance of evidence can be rationalized by positing a "preference for ignorance." This protects the theory from falsification but drains it of normative force. It suggests the theorem doesn't apply to the most interesting human dilemmas.
  *   **Approach 2** preserves the instrumentalist lesson. It maintains that *qua* information, the data is valuable. However, in the real world, information rarely arrives in a vacuum; it arrives bundled with causal consequences and strategic constraints. This approach clarifies that the rationality of ignorance stems from these bundled costs, not from the information itself. It keeps the theorem robust as a normative ideal for pure inquiry.

  **2. Diagnostic Power and Clarity**
  *   **Approach 1** lumps distinct phenomena together. The defendant's dilemma (strategic) and the patient's dilemma (psychological/causal) are treated identically as "preferences over beliefs." This obscures the different mechanisms at play.
  *   **Approach 2** offers superior diagnostic granularity. It distinguishes between **causal costs** (the test makes you sick), **strategic costs** (the knowledge limits legal defense), and **processing costs** (the cognitive load of updating). This distinction is philosophically fertile. It invites analysis into the nature of "costless" observation and the conditions under which an agent can truly "disregard" evidence. It forces us to ask: *When is knowledge a liability?* rather than *When do we dislike knowledge?*

  **3. Normative Guidance**
  *   **Approach 1** offers little guidance other than "know thy preferences." If a patient avoids testing due to anxiety, Approach 1 says this is rational *if* they value calmness over health. It is descriptive rather than prescriptive.
  *   **Approach 2** allows for critique. We can ask whether the strategic constraint is legitimate (should the legal system punish knowledge?) or whether the psychological cost is manageable (can therapy mitigate the distress?). It identifies the friction points between ideal rationality and real-world constraints, suggesting where we might alter the environment (e.g., legal protections for ignorance) to restore the value of information.

  ### Conclusion

  While the Preference-Based Approach accurately captures the phenomenology of not wanting to know, it saves the phenomena by sacrificing the scope of decision theory. It treats the *symptoms* of information avoidance (anxiety, strategic bind) as *terminal values*.

  The Constraint-Based Approach is philosophically superior because it treats Good's Theorem as a powerful idealization that reveals the structure of rational agency. By showing how real-world cases violate the theorem's assumptions (costlessness, free disposal, strategic independence), it explains *why* ignorance is sometimes rational without conceding that information itself lacks value. It preserves the central lesson—that evidence is the fuel of rational action—while clarifying that in complex systems, acquiring fuel can sometimes damage the engine. This distinction provides a more rigorous framework for analyzing the ethics and rationality of knowledge in law, medicine, and daily life.
