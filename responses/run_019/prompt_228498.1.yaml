  1.  **Pre/Post & Verdicts:** Before release, Mary possessed all physical propositions. At release, she underwent an occurrent phenomenal experience. The **Acquaintance theorist** classifies this as success: Mary stood in a direct relation to redness, regardless of retention. The **Ability theorist** is forced into failure: Mary gained no durable capacity to recognize, imagine, or remember red, which Lewis defines as the constituent elements of "knowing what it's like."
  2.  **Separating Feature:** The sub-encoding duration of the stimulus. This prevents the transition from occurrent experience to dispositional capacity. If the paddle were waved slowly (allowing memory encoding), Mary would gain recognitional abilities, and the separation would collapse as both theorists would agree she gained knowledge.
  3.  **Best Counter-Attack:** The Ability theorist might argue Mary gained the ability to *classify the event* as "seeing red" immediately. However, this fails to meet the standard Lewisian criteria (recognizing the *quality* later, imagining it), reducing the ability to a trivial report of occurrence rather than knowledge of the character.
  4.  **Contested Reading:** This construction leans on defining "ability" strictly as *dispositional* (lasting know-how) rather than *occurrent* (capacity to undergo experience now). If the Ability Hypothesis is read to include the occurrent ability to experience, the separation fails, as Mary clearly had that.
