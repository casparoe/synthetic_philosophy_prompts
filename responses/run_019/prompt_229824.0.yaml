  7.  (Final Review of ECMO): Is it fatal? It makes "death" relative to resources. That's a big philosophical bullet to bite. I'll call it "Genuinely Awkward" because it exposes the normative core.

  8.  (Final Review of DCD): It creates a legal fiction. "Awkward" is right.

  9.  (Final Review of Concept Creep): This is the meta-commentary. "Insulation" is the key word.

