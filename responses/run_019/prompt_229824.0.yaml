      *   *Section 4: Concept Creep.* Admit the shift from 1981 to now. The "loss of capacity" vs. "cessation of function." *Verdict: Insulation.*
      *   *Conclusion:* Bug or Feature? It's a pragmatic feature, but it obscures the metaphysical cost.

  4.  **Refining the Tone:**
      *   Avoid being too academic or too dismissive.
      *   Use precise terms (e.g., "normative irreversibility," "somatic integration").
      *   Ensure the "Fatal/Awkward/Messy" verdicts are clear.
      *   *Self-Correction on DCD:* Make sure to distinguish between Uncontrolled DCD (failed CPR) and Controlled DCD (withdrawal). Controlled DCD is the bigger challenge to WBC because the patient isn't brain dead at withdrawal.
