      *   *Game Theory (Iterated Prisoner's Dilemma):* Cooperation often emerges in iterated games. DFH assumes single-shot. *Rank:* Fatal (theoretically). *Concede:* Defenders argue cosmic distances make iteration impossible (light lag).
