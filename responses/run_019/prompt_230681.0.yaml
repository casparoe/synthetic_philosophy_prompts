      *   DFH predicts we *should not* METI (active messaging).
      *   DFH predicts we might find "corpses" or evidence of sterilization (unlike Rare Earth).
      *   DFH predicts advanced civs will be stealthy, not building Dyson Swarms (unlike Kardashev scale expectations).
      *   DFH predicts silence is *maintained*, not just absent.

  6.  **Address Unfalsifiability:**
