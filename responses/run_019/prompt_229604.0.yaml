answer: |-
  Your working hypothesis is astute: the debate is not merely about the logic of conditionals, but about the **theoretical purpose** of analyzing dispositions. However, diagnosing this as solely a semantic disagreement about "what a semantics owes us" understates the metaphysical stakes. The disagreement is **substantive and metaphysical**, expressed through the medium of semantic analysis. It is a proxy war between two competing ontologies: **Humean Categoricalism** (the world is made of static properties + laws) versus **Dispositional Essentialism** (the world is made of powers/potentialities).

  Here is the diagnosis grounded in the actual arguments of the camps, followed by an assessment of what progress looks like.

  ### 1. Diagnosis: A Metaphysical Disagreement Masquerading as Semantics

  The dispute is not verbal (both sides agree on the extension of "fragile" in standard cases) nor is it purely normative (though theoretical virtues are involved). It is a **substantive ontological disagreement** regarding the fundamental structure of properties.

  **The Reductionist Camp (Lewis, Armstrong, early SCA defenders):**
  *   **The Goal:** To fit dispositions into a Humean mosaic. They argue that reality consists of categorical properties (shape, mass, structure) and external laws of nature. Dispositions are not "real" additional entities; they are logical constructs derived from categorical bases + laws.
  *   **The Argument:** They treat finks and masks as *bugs* in the semantic analysis to be patched. When Martin (1994) introduced the "electro-fink" (a device that makes a wire conductive only when touched), Lewis responded by refining the "intrinsic basis" clause. They believe that with enough qualifications (ceteris paribus clauses, specific time-indexing), the conditional analysis can be saved.
  *   **The Motivation:** Parsimony. They wish to avoid "occult powers." If dispositions are irreducible, properties seem to have a mysterious "directedness" toward future manifestations, which violates a strict empiricist view of properties.

  **The Irreducibility Camp (Martin, Bird, Mumford, Ellis):**
  *   **The Goal:** To argue that dispositions (powers) are the fundamental furniture of the world.
  *   **The Argument:** They treat finks and masks as *features* that reveal the inadequacy of the conditional analysis. Martin argued that the "intrinsic basis" *just is* the disposition. To say a glass has a categorical basis *plus* a disposition to break is to multiply entities without need. Furthermore, they argue that any categorical basis requires a disposition to manifest its effects (the "regress argument").
  *   **The Motivation:** Explanatory Power. They argue that science (especially chemistry and physics) treats properties as inherently active (e.g., valency, charge). A purely categorical property cannot explain *why* it interacts; a dispositional property explains interaction by its very nature.

  **Why the "Technical Question" is a Red Herring:**
  You asked if there is a narrow technical question (e.g., can the intrinsic-basis clause be refined?) that could settle the debate. The answer is **no**.
  *   If you are a Humean, you *must* believe a refinement exists, because admitting otherwise forces you to accept irreducible powers. You will therefore accept increasingly complex and ad-hoc conditional clauses.
  *   If you are a Dispositionalist, you *must* believe no refinement works, because the conditional describes the *manifestation*, not the *essence*. You will therefore generate ever-more-sophisticated finks (e.g., "finkish bases" where the intrinsic property itself vanishes upon stimulation).

  The counterexample industry is not a search for a logical truth; it is a stress test for two incompatible metaphysics.

  ### 2. Is the Question Malformed?

  The question *"Can dispositions be reduced to counterfactual conditionals?"* is not malformed, but the **project of reductive semantic analysis** is likely the wrong tool for the job.

  This aligns with the view of philosophers like **Nancy Cartwright** or **James Ladyman**, who argue that philosophical analysis often fails when it tries to legislate scientific concepts from the armchair. In your field (building materials), "fire-retardant" is not defined by a metaphysical truth condition, but by a **standardized intervention**. The standard *stipulates* the removal of masks (e.g., "strip the coating") to isolate the disposition.

  Therefore, the philosophical debate is malformed in the sense that it seeks a **context-independent truth condition** for a concept that is inherently **context-dependent and interventionist**. A wire is conductive *relative to a circuit configuration*; timber is fire-retardant *relative to a test protocol*. Seeking a "pure" conditional analysis ignores the pragmatic context that fixes the meaning of the disposition.

  ### 3. What Progress Looks Like

  Given this diagnosis, a decisive class of counterexamples or a formal logical result will not resolve the dispute, because each side interprets these through their metaphysical lens. Progress would instead look like one of the following three shifts:

  **A. Evidence from Scientific Practice (The Empirical Turn)**
  The most promising route is **experimental philosophy of science**. Rather than analyzing intuitions about glass and wires, philosophers should analyze how working scientists model dispositions.
  *   **What to look for:** Do material scientists model "flammability" as a categorical variable in an equation (supporting Reductionism) or as a propensity/probability inherent to the material structure (supporting Dispositionalism)?
  *   **Your Role:** Your observation about the certification standards is crucial data. If the standard *defines* the disposition by the test protocol (interventionism), this supports the view that dispositions are not intrinsic properties waiting to be analyzed, but **relational properties** between an object and a testing environment. This vindicates the **Contextualist** view (Clarke, Handfield) over both the strict Reductionists and the strict Essentialists.

  **B. A Formal Result on Causal Modeling (The Structural Turn)**
  Progress may come from **Causal Modeling (Bayes Nets / Structural Equation Models)** rather than modal logic.
  *   **The Shift:** Instead of asking "If $S$ then $M$?", causal modelers ask "Is the relationship between $S$ and $M$ invariant under intervention?" (James Woodward's account).
  *   **The Result:** A formal demonstration that dispositions map onto **invariant causal relations** rather than counterfactual conditionals. This dissolves the fink/mask problem: a fink is simply an intervening variable in the causal graph. This doesn't reduce dispositions to categoricals, but it provides a formal language that both sides can use without committing to the "reductive semantics" that caused the deadlock.

  **C. Acceptance of Theoretical Virtues (The Normative Turn)**
  If neither empirical nor formal progress settles it, the debate must be acknowledged as a choice between **theoretical virtues**.
  *   **Progress:** A clear articulation of the trade-off.
      *   Choose **Reductionism** if you prioritize ontological parsimony and a Humean view of laws, accepting that your semantic analysis will be complex and gerrymandered.
      *   Choose **Dispositionalism** if you prioritize explanatory power and alignment with scientific practice, accepting that you must posit "powers" as fundamental entities.
  *   **Outcome:** The field stops treating the counterexamples as "problems to be solved" and starts treating them as "costs of doing business" for each metaphysical view.

  ### Recommendation for Your Context

  In your specific work revising certification standards, the philosophical debate suggests you should **abandon the search for a definition that matches "reality" independent of the test.**

  The "contradiction" you felt (certifying wood that fails the specific test) arises from conflating the **disposition** (the material's potential) with the **manifestation** (the test result). The philosophy of dispositions suggests that the *standard itself* acts as a "mask-remover." By stipulating the removal of the coating, the standard creates the specific context in which the disposition is defined.

  **Conclusion:** The disagreement is substantive and metaphysical, not verbal. No technical refinement of the conditional analysis will solve it because the "reductive project" is likely impossible if dispositions are fundamental. Progress lies in shifting from **semantic analysis** (what does the word mean?) to **causal modeling** (how does the property function in a system?) and **pragmatics** (what intervention verifies the claim?). For your firm, this means recognizing that "fire-retardant" is not a description of an intrinsic essence, but a claim about performance under *stipulated* conditions.
