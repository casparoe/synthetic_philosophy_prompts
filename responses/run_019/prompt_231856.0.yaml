answer: |-
  This is one of the most persistent and uncomfortable knots in moral philosophy and sociology. You have put your finger on the gap between **moral justification** (why something is right) and **moral genealogy** (how we actually came to believe it is right).

  Your intuition is supported by significant scholarship. Kwame Anthony Appiah's *The Honor Code* is the definitive text on exactly your dueling example: he argues that dueling ended not because of Kantian arguments, but because the practice became associated with the "wrong kind of people" (bourgeois merchants rather than aristocrats) and thus lost its honor-cache. Similarly, Richard Rorty argued that moral progress is driven by "sentimental education" (making people see others as like themselves) rather than rational deduction.

  If you accept that status, shame, and interest are the *engine*, but moral truth is the *destination*, you face the "post-hoc rationalization" worry. Here are the main live options for untangling this, what each preserves, and what each must sacrifice.

  ### 1. The "Causal Externalist" (Moral Realism with Human Frailty)
  **The View:** Moral truths exist independently of human opinion (e.g., "slavery is objectively wrong"). However, humans are not purely rational agents. We are driven by emotion, status, and tribe. Therefore, moral truth requires non-moral levers (shame, economics) to move human behavior.
  *   **How it handles your knot:** The arguments were *true* all along, but they lacked traction. The status shift was merely the vehicle that allowed the truth to land. The rationalization isn't fake; it's the recognition of a truth that was previously causally impotent.
  *   **What it gives up:** It gives up the **efficacy of reason**. It admits that "the force of the better argument" is, on its own, powerless to change the world. It creates a dualism where Moral Truth exists in one realm, and Human Motivation exists in another, and they only meet via the messy bridge of social pressure.
  *   **The Risk:** It makes moral progress look accidental. If the status shift had gone the other way (e.g., if slavery had become *more* prestigious), would the moral truth have remained hidden forever?

  ### 2. The "Social Constructivist" (Pragmatism)
  **The View:** Moral truth is not a pre-existing planet we discover; it is a structure we build through social agreement. If a norm shift reduces suffering and increases social cooperation, it *constitutes* moral progress. The mechanism (shame/status) doesn't need to be "moral" because the *outcome* defines the morality.
  *   **How it handles your knot:** It dissolves the worry. There is no "post-hoc rationalization" because the rationalization is part of the construction of the truth. We decided dueling was wrong by collectively treating it as ridiculous. That *is* what it means for it to be wrong.
  *   **What it gives up:** It gives up **mind-independent objectivity**. You cannot say slavery was wrong *before* the consensus shifted, only that it is wrong now because we have built a world where it is untenable.
  *   **The Risk:** It flirts with relativism. If a different consensus had formed (e.g., a successful global fascist movement), would that have been "progress" by this definition?

  ### 3. The "Honor-Internalist" (Appiah's View)
  **The View:** Honor and morality are not separate. Honor codes *are* moral systems. To say "dueling became low status" is not a sociological reduction; it is a moral description. We are creatures who care about worth and respect. Changing what we respect *is* changing our morality.
  *   **How it handles your knot:** It rejects the premise that status changes are "non-moral." Moving the needle on what is "shameful" is the primary way human morality functions. The arguments didn't work because they appealed to abstract reason; the status shift worked because it appealed to moral identity.
  *   **What it gives up:** It gives up the **Kantian distinction between duty and inclination**. It admits that we are not motivated by "the good" but by "the respectable."
  *   **The Risk:** It makes morality fragile. If honor is fluid, is morality just fashion? (This leads directly to your second worry).

  ### 4. The "Seed and Soil" Model (Coherentism)
  **The View:** The arguments *were* doing work, but slowly. They changed the "soil" (the background assumptions of culture) over centuries. The status shift was the harvest, not the planting. The arguments made it *possible* for the status to shift.
  *   **How it handles your knot:** It denies that the arguments "sat there doing nothing." Philosophical and religious critiques of slavery/dueling eroded the legitimacy of the practice long before the law changed. The status shift was the tipping point of a long rational erosion.
  *   **What it gives up:** It gives up **clean causality**. It requires a messy, long-term view of history where reason and status are entangled.
  *   **The Risk:** It is hard to verify. It requires faith that the "latent power" of arguments was the real driver, which is difficult to prove against the obvious evidence of economic and status incentives.

  ---

  ### The Reverse Mechanism Worry
  *If honor and shame can push norms in good directions (abolition), what stops us from saying every moral panic is a moral revolution in progress?*

  This is the critical test. If the engine is social pressure, how do we distinguish the Abolitionists from the Prohibitionists or the Satanic Panic prosecutors? Both used shame, status, and claims of moral urgency.

  Here are the three principled filters philosophers use to distinguish **Progress** from **Panic**:

  **1. The Suffering/Autonomy Metric (Consequentialist Filter)**
  *   **Mechanism:** Both progress and panic use shame.
  *   **Distinction:** Look at the *outcome* on human flourishing.
      *   **Progress:** Expands the circle of moral concern, reduces objective suffering, increases autonomy (e.g., ending slavery allows people to own themselves).
      *   **Panic:** Restricts autonomy, creates new victims, often based on empirical falsehoods (e.g., Satanic Panic harmed children by removing them from homes based on lies).
  *   **Cost:** You must accept that "moral progress" is judged by *consequences*, not the purity of the motive.

  **2. Reflective Stability (The "Morning After" Test)**
  *   **Mechanism:** Both rely on hot emotional cognition.
  *   **Distinction:** Moral progress tends to survive **reflective equilibrium**. Once the heat of the status shift cools, the new norm remains stable under scrutiny.
      *   **Progress:** After the Civil War, few argued seriously for a return to chattel slavery. The norm held under cold reflection.
      *   **Panic:** Moral panics usually collapse when scrutinized. Once the fear subsided, people looked back at the Satanic Panic or the Red Scare and realized the norms were unjustified.
  *   **Cost:** This is a backward-looking test. It means we can only identify progress in hindsight.

  **3. Inclusivity of the "Audience"**
  *   **Mechanism:** Both rely on an audience judging behavior.
  *   **Distinction:** Who gets a seat at the table of judgment?
      *   **Progress:** Tends to involve the marginalized gaining a voice in defining the norm (e.g., enslaved people, women, workers participating in the discourse).
      *   **Panic:** Tends to be imposed *upon* a marginalized group by a dominant group (e.g., temperance imposed on working-class immigrants).
  *   **Cost:** This requires a democratic theory of morality. It suggests that *process* matters as much as outcome.

  ### Synthesis: How to Hold It Together
  You don't have to choose between "It was just status" and "It was pure reason." The most robust position is a **Division of Labor**:

  1.  **Reason sets the coordinates:** Philosophical arguments (about rights, suffering, consistency) define the *direction* of potential progress. They create the vocabulary that reformers use.
  2.  **Status pulls the bow:** Social mechanisms (shame, honor, economics) provide the *kinetic energy* to move society toward those coordinates.

  To answer your fear of relativism: **The mechanism of change does not validate the truth of the change.**
  *   Gravity explains why an apple falls; it doesn't explain why the apple is nutritious.
  *   Shame explains why dueling stopped; it doesn't explain why dueling was *wrong*.

  The "wrongness" is validated by the **Reverse Mechanism Filters** (did it reduce suffering? did it survive reflection?). You can acknowledge that humans are moved by status (sociology) without conceding that status determines truth (relativism).

  **The Takeaway:**
  You can tell your friend: "The arguments provided the *map*, but honor provided the *fuel*. A map without fuel goes nowhere; fuel without a map goes off a cliff. Moral progress happens when the fuel of status is successfully harnessed to the map of reason. The fact that we needed fuel doesn't mean the map was fake."
