answer: |-
  Here is a decision procedure designed for a 10-minute pitch meeting. It is grounded in the critiques of adaptationism (Gould & Lewontin), the requirement for falsifiability (Popper), and the distinction between ultimate (evolutionary) and proximate (mechanistic) causes (Tinbergen).

  ### Part 1: The Editor's Evolutionary Filter (5 Questions)

  Ask these in order. If a pitch fails a step, stop there.

  **1. Is the behavioral trait robust, universal, and distinct from the explanation?**
  *   **The Trap:** Confusing the phenomenon with the theory (e.g., "Men are aggressive because they evolved to fight").
  *   **Pass:** The behavior is well-documented independent of the evolutionary claim (e.g., "Men score higher on physical aggression metrics in these 50 studies").
  *   **Fail/Kill:** The behavior is anecdotal, based on a single survey of American undergraduates, or the evidence for the behavior *is* the evidence for the evolution (circular reasoning).
  *   **Kill Signal:** "We haven't measured the behavior yet, but our model predicts..."

  **2. Has the pitcher ruled out the "Spandrel" (Byproduct) hypothesis?**
  *   **The Trap:** Assuming every trait is a direct adaptation.
  *   **Pass:** The pitcher acknowledges the trait could be a byproduct of something else (e.g., "Maybe we don't love gossip; maybe we evolved large brains for social cohesion, and gossip is just exhaust fumes"). They must explain why *this* specific trait was selected for, not just why it's possible.
  *   **Fail/Kill:** The pitcher insists the trait is too complex or specific to be anything other than an adaptation. (Complexity does not guarantee adaptation).
  *   **Kill Signal:** "It's too useful to be an accident."

  **3. What is the specific selection pressure, and is it falsifiable?**
  *   **The Trap:** The "Pleistocene Blank Check." (e.g., "It helped us survive on the savanna.")
  *   **Pass:** The pitcher identifies a specific problem (e.g., "identifying toxins in fruit") and offers a way to prove it *didn't* happen (e.g., "If we find a culture where women don't do this despite identical ecological pressures, the theory fails").
  *   **Fail/Kill:** The explanation is flexible enough to explain the opposite outcome (e.g., "Women do X because it helped ancestors; if women did Not-X, that would also have helped ancestors").
  *   **Kill Signal:** "It's hard to test directly because it happened in the past, but it makes sense."

  **4. Is there comparative or cross-cultural evidence?**
  *   **The Trap:** WEIRD samples (Western, Educated, Industrialized, Rich, Democratic).
  *   **Pass:** Data from non-Western cultures, or comparative data from primates/relatives showing the trait exists in a relevant context.
  *   **Fail/Kill:** The claim is about "human nature" but the data is from a survey of podcast listeners in London and New York.
  *   **Kill Signal:** "We plan to test other cultures in future studies." (You are not a grant committee; you need the evidence now).

  **5. Does the pitch commit the Naturalistic Fallacy?**
  *   **The Trap:** Moving from "is" to "ought" or "fixed."
  *   **Pass:** The pitcher treats the evolutionary explanation as a history of the trait, not a destiny.
  *   **Fail/Kill:** The pitch argues that because a trait is evolved, it is immutable, justified, or should be accommodated rather than changed.
  *   **Kill Signal:** "Therefore, we cannot expect this to change," or "This explains why [social policy] is right."

  ---

  ### Part 2: The "Real Finding, Fake Gloss" Scenario

  **The Scenario:** The underlying psychology/sociology finding is replicated and robust (e.g., "People prefer high-calorie foods"), but the evolutionary story ("Because fruit was scarce on the savanna") is speculative.

  **The Verdict:** **Green light for the finding, Red light for the gloss.**
  *   **Action:** Run the story as a psychology or behavioral science piece.
  *   **Condition:** The evolutionary explanation must be demoted from *Fact* to *Hypothesis*. Use language like "Researchers propose," "One evolutionary account suggests," or "Critics argue."
  *   **Why:** Your readers benefit from knowing the behavior is real. They are misled if they are told the *reason* is settled science when it is actually a just-so story.
  *   **Headline Rule:** The headline cannot promise an evolutionary cause if the evidence is merely behavioral. (e.g., "Why We Crave Sugar" is okay; "Why We Evolved to Crave Sugar" is not).

  ---

  ### Part 3: Where the Procedure Hands Back to You

  This checklist cannot settle:
  1.  **Harm vs. Interest:** A story might pass the scientific filter but reinforce harmful stereotypes (e.g., biological determinism about race or gender). That is an editorial ethics call, not a scientific one.
  2.  **Novelty vs. Nuance:** A pitch might be scientifically sound but boringly incremental ("Another study confirms kin selection"). Conversely, a scientifically shaky pitch might illuminate a genuine cultural moment. You must weigh the "truthiness" against the cultural utility.
  3.  **Complexity Budget:** A rigorous evolutionary account often requires 3,000 words of caveats. If you only have 800 words, a rigorous story might look more misleading than a simple one. You must decide if the story can be told honestly within your space constraints.

  ---

  ### Part 4: Running the Procedure on Your Three Pitches

  #### Pitch A: Women's interest in true crime as predator-monitoring adaptation.
  *   **Q1 (Robust Trait):** Pass. Surveys show women consume more true crime.
  *   **Q2 (Spandrel):** Fail. The pitcher claims it is a specific adaptation for threat monitoring. They do not address the alternative: that it is a form of safe-play, entertainment, or social bonding (byproducts of other cognitive traits).
  *   **Q3 (Falsifiability):** Fail. "It helped ancestors monitor threats" is unfalsifiable here. How would we prove women *didn't* evolve this? If women didn't listen, the pitcher would say "They evolved to avoid threats instead."
  *   **Q4 (Evidence):** Fail. Based on a survey of podcast listeners (WEIRD). No cross-cultural data on ancestral threat monitoring strategies.
  *   **Q5 (Naturalistic Fallacy):** Pass. Doesn't claim women *should* do this.
  *   **Verdict:** **KILL.**
  *   **Reasoning:** This is a classic just-so story. It takes a modern consumer preference and projects a survival function onto it without ruling out entertainment value or social learning. It fits the "pub anecdote wearing a lab coat" description perfectly. I know you like the yarn, but this is the one that gets cut.

  #### Pitch B: Cross-cultural sex difference in occupational preferences is evolved and fixed.
  *   **Q1 (Robust Trait):** Pass. Well-powered, 30 countries.
  *   **Q2 (Spandrel):** Fail. The pitch assumes the difference is a direct adaptation rather than a byproduct of size dimorphism, cultural feedback loops, or economic structures interacting with biology.
  *   **Q3 (Falsifiability):** Fail. The claim is "therefore fixed." This removes falsifiability. If a country changes its preferences, the pitcher will say "That's just surface level."
  *   **Q4 (Evidence):** Pass. Cross-cultural data exists.
  *   **Q5 (Naturalistic Fallacy):** **CRITICAL FAIL.** The word "therefore" bridges *is* to *fixed*. This implies social policy cannot alter the preference.
  *   **Verdict:** **RUN THE FINDING, CUT THE GLOSS.** (With a heavy editorial note).
  *   **Reasoning:** The data is valuable. The evolutionary conclusion is ideologically loaded and scientifically premature. You can publish the sex difference data, but you must strip the claim that it is "fixed" or purely "evolved." Frame it as "Biology and Culture Interact." This is the unpleasant verdict: you have to break the pitcher's main hook (determinism) to run the story.

  #### Pitch C: Open-plan offices fail because hunter-gatherer brains can't cope.
  *   **Q1 (Robust Trait):** Pass. Open-plan offices often reduce productivity/increase stress.
  *   **Q2 (Spandrel):** Fail. Assumes the stress response is an adaptation *for* silence or specific acoustic environments, rather than a general stress response to lack of control or privacy (which may not be Pleistocene-specific).
  *   **Q3 (Falsifiability):** Fail. "Hunter-gatherer brains" is a monolithic category. Did hunter-gatherers work in silence? No, camps were noisy. What specific acoustic property is the mismatch?
  *   **Q4 (Evidence):** Fail. Likely relies on modern productivity metrics, not comparative primate data or anthropological data on camp acoustics.
  *   **Q5 (Naturalistic Fallacy):** Pass.
  *   **Verdict:** **RUN THE FINDING, CUT THE GLOSS.**
  *   **Reasoning:** The finding (open offices suck) is useful to readers. The explanation (hunter-gatherer brain) is a buzzword salad. Run it as a psychology of work piece: "Why Distraction Hurts." Do not let the writer use "evolution" to explain *why* distraction hurts unless they have specific evidence about auditory processing evolution.

  ---

  ### Part 5: The Honest Limitation

  **Where this checklist fails:**
  It cannot catch a **Plausible Adaptationist Story that is currently untestable.**

  Sometimes, a pitcher will follow all the rules. They will admit it's a hypothesis, they will avoid the naturalistic fallacy, they will acknowledge alternative explanations, and they will cite comparative data. But the story is still essentially a "just-so story" because the technology to test it (e.g., ancient DNA analysis of behavioral traits, time-travel to the Pleistocene) does not exist.

  In these cases, the story will look rigorous. It will use the right language ("selection pressure," "fitness landscape," "null hypothesis"). It will pass your filter. But it may still be wrong. Evolution is a historical science, and like all historical sciences, it is vulnerable to narrative coherence masquerading as proof. If a story sounds *too* perfect, too neatly tied to a specific ancestral problem, trust your gut even if the checklist says "Pass." The most dangerous evolutionary psychology isn't the crazy stuff; it's the sensible stuff that we simply cannot verify.
