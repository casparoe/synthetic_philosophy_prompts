prompt: |-
  I edit the science desk of a mid-sized general-interest magazine, and roughly once a week someone pitches us an evolutionary-psychology story: why we evolved to love gossip, why women are supposedly better at remembering where the fruit is, why teenagers take risks, that sort of thing. Some of it is serious science and some of it is a pub anecdote wearing a lab coat, and at the pitch meeting I have about ten minutes per pitch and no statistics training to lean on.

  What I'd like is a decision procedure I can actually run at the meeting, grounded in whatever the philosophy of biology and the just-so-stories debate have produced that is genuinely usable by a non-specialist. By that I mean things like: the distinction between a trait being an adaptation, a byproduct of some other adaptation (what Gould and Lewontin called a spandrel), or just drift; whether the proposed explanation makes any specific risky prediction or just redescribes the observation in the language of the Pleistocene; what the comparative and cross-cultural evidence would have to look like; and what would count as evidence against the claim, given that 'it helped our ancestors on the savanna' seems to fit absolutely anything.

  Concretely, give me:

  1. The questions to ask, in order, with what counts as a passing answer to each and which answers should kill the pitch on the spot.
  2. A way to handle the very common case where the underlying finding is real and replicated but the evolutionary gloss is doing all the work -- is that a green light, a kill, or a 'run the finding, cut the gloss'?
  3. The points where the procedure has to hand the call back to me because it's a judgement about what our readers need, not a question the method can settle.

  Then run the procedure on three invented pitches so I can see it working:

  a) A researcher claims that women's interest in true-crime content is an evolved predator- and threat-monitoring adaptation, on the basis of a survey of podcast listeners.
  b) A well-powered cross-cultural study (thirty-odd countries, decent methods) finds a stable sex difference in occupational preferences, and the pitch says this shows the difference is evolved and therefore fixed.
  c) A journalist wants to argue that open-plan offices fail because our hunter-gatherer brains can't cope with them.

  Please include at least one verdict I won't enjoy (I've got a soft spot for a good evolutionary yarn, and the procedure shouldn't care). And be honest at the end about what a checklist like this can't catch -- where a plausible-sounding story gets through anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Science desk editor at a mid-sized general-interest magazine.
      *   **Problem:** Flooded with evolutionary psychology (evo-psych) pitches. Hard to distinguish rigorous science from "just-so stories" (adaptationist speculation) in a 10-minute pitch meeting without stats training.
      *   **Goal:** A usable decision procedure (checklist/flowchart style) grounded in philosophy of biology (Gould, Lewontin, etc.) to evaluate these pitches.
      *   **Requirements:**
          1.  Ordered questions with pass/fail criteria.
          2.  Handling the "real finding, fake gloss" scenario.
          3.  Identifying where editorial judgment overrides the procedure.
          4.  Run the procedure on three specific invented pitches (a, b, c).
          5.  Include at least one "unpleasant verdict" (killing a good story).
          6.  Honest limitation statement at the end.

  2.  **Deconstruct the Scientific/Philosophical Basis:**
      *   *Core Issue:* Adaptationism vs. Spandrels/Drift.
      *   *Key Critique:* Gould & Lewontin's "Spandrels of San Marco" (1979). Warning against assuming every trait is an optimal adaptation.
      *   *Key Criterion:* Falsifiability. Can the story be proven wrong?
      *   *Key Evidence:* Cross-cultural universality, comparative biology (do other primates do it?), developmental trajectory, genetic heritability (though tricky), and alternative hypotheses.
      *   *The "Pleistocene" Trap:* Using ancestral environments as an unfalsifiable explanation for modern behavior.

  3.  **Drafting the Decision Procedure (The "Editor's Filter"):**
      *   *Need:* Simple, sequential, actionable.
      *   *Step 1: The Phenomenon.* Is the behavior real and robust? (Don't evaluate the *why* if the *what* is shaky).
      *   *Step 2: The Adaptation Claim.* Is it claimed as an adaptation? If so, what is the specific selection pressure?
      *   *Step 3: Falsifiability/Alternative Explanations.* What would disprove this? Is it a spandrel? (e.g., is it a byproduct of a larger brain?).
      *   *Step 4: Evidence Type.* Is it just a survey of WEIRD (Western, Educated, Industrialized, Rich, Democratic) people? Is there cross-cultural or comparative data?
      *   *Step 5: The "Therefore" Trap.* Does the pitch move from "is" to "ought" or "fixed"? (Naturalistic fallacy).

  4.  **Addressing Requirement 2 (Real Finding, Fake Gloss):**
      *   This is common. E.g., "People like sugar" (Real) -> "Because fruit was scarce on savanna" (Plausible but unproven/oversimplified).
      *   *Verdict:* "Run the finding, cut the gloss." The science is the behavior, the evo-psych is the speculation. Label it as hypothesis, not fact.

  5.  **Addressing Requirement 3 (Editorial Judgment):**
      *   Where does the checklist fail? When the science is *okay* but the story is harmful, deterministic, or boring. Or when the nuance is too complex for the word count.

  6.  **Developing the Three Test Cases:**

      *   *Case A (True Crime):*
          *   *Claim:* Women listen to true crime to monitor threats (adaptation).
          *   *Analysis:* Survey of podcast listeners (WEIRD). No cross-cultural data on *ancestral* threat monitoring. Alternative: Entertainment, social bonding, safe fear.
          *   *Verdict:* Kill or severe downgrade. It's a just-so story.
      *   *Case B (Occupational Preferences):*
          *   *Claim:* Cross-cultural sex diff in jobs = evolved & fixed.
          *   *Analysis:* Finding might be real (preferences), but the "fixed" conclusion is the Naturalistic Fallacy. Culture interacts with biology.
          *   *Verdict:* Kill the "fixed" angle. Run the data, discuss culture/bio interplay. (This is the "unpleasant verdict" - killing the deterministic hook).
      *   *Case C (Open-Plan Offices):*
          *   *Claim:* Hunter-gatherer brains hate open plans.
          *   *Analysis:* "Hunter-gatherer brain" is a buzzword. Did they work in silence? No. Camps were noisy. Stress response is real, but the evo explanation is weak.
          *   *Verdict:* Run the finding (distraction is bad), cut the evo gloss.

  7.  **Refining the Procedure (Iterative Polish):**
      *   Make the questions punchy.
      *   Ensure the "Kill" criteria are clear.
      *   Integrate the Gould/Lewontin "Spandrel" concept explicitly.
      *   Ensure the "Naturalistic Fallacy" is flagged (is -> ought).

  8.  **Drafting the Content (incorporating the "Voice"):**
      *   Tone: Professional, empathetic to the editor's constraint, scientifically rigorous but accessible.
      *   Structure: Introduction -> The Protocol -> The "Grey Zone" -> Editorial Judgment -> The Test Cases -> Limitations.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include stats training? *Correction:* Acknowledge the editor doesn't have it, so focus on study design and logic, not p-values.
      *   *Check:* Is the "unpleasant verdict" clear? *Correction:* Make sure Case B gets hit hard on the "fixed" claim, even if the data is good.
      *   *Check:* Did I address the "Pleistocene" problem? *Yes, in Question 3.*
      *   *Check:* Is the distinction between adaptation and byproduct clear? *Yes, in Question 2.*

  10. **Final Polish:** Ensure the limitations section is honest about "plausible-sounding stories" that slip through (e.g., when the alternative hypothesis is hard to test).

  *(Self-Correction on Case B)*: The prompt asks for *one* verdict I won't enjoy. Case B is the best candidate because the data is "well-powered," so killing the evo-angle feels like rejecting "science," but it's necessary to reject the *interpretation*. I will make sure the verdict is "Run the finding, kill the 'therefore fixed' conclusion." Actually, to make it more painful, I should say "Kill the pitch as framed." If they rewrite it to remove the evo-determinism, it's a sociology piece, not an evo-psych piece. Let's go with "Run the finding, cut the gloss" but emphasize that the *pitch* as an evo-psych story is dead.

  *(Refining the "Unpleasant Verdict")*: Let's make Case A the kill. It's a very popular trope. Killing it feels good scientifically but might be unpopular. Wait, the prompt says "Include at least one verdict I won't enjoy (I've got a soft spot for a good evolutionary yarn...)" so I need to kill a *good yarn*. Case A is a good yarn. Case B is a dangerous yarn. I'll kill Case A's evolutionary claim firmly.

  *(Re-evaluating Case B)*: The prompt says the pitch claims the difference is "evolved and therefore fixed." That "therefore fixed" is the naturalistic fallacy. I should flag that heavily.

  *(Final Plan)*:
  1.  **The Protocol:** 5 Questions.
  2.  **The Grey Zone:** Handling real data/bad theory.
  3.  **Editorial Discretion:** Where the tool stops.
  4.  **The Test Runs:** A (Kill), B (Rewrite/Downgrade), C (Cut Gloss).
  5.  **Limitations:** The "Plausibility Trap."

