answer: |-
  Good morning.

  I stand before you not to describe a change, but to make one.

  Last week, this student body voted. The margin was narrow. I know that many of you voted against this measure. I know that some of our faculty view this ceremony as merely symbolic. I am not going to pretend that we are all in agreement. We are not.

  But we are a community governed by procedures we have agreed to uphold, and those procedures have been completed. The vote was counted. The result was certified. And with the administration's authorization, the final step rests on this moment.

  So, I will not ask you to feel something you do not feel. I will not ask the dissenters to pretend they consented. I am asking you to recognize what is now happening.

  By the authority vested in the Student Body President by the student constitution, and with the endorsement of the Principal, I hereby declare the Student Honor Code adopted and in force. Effective immediately, this code is no longer a proposal. It is a standard. It is a binding obligation for every student in this room, regardless of how you voted.

  To those who voted no: You are not bound because you agreed, but because you are members of this body, and this body has decided. To those who voted yes: You are not bound because you won, but because you are now accountable.

  To our teachers: You have seen ceremonies like this before. You know that words can be empty. We cannot force you to believe this is different. We can only invite you to hold us to it. If we fail, call us out. If we succeed, do not call it luck. Treat this code as real, and we will work to ensure it is.

  This code is now active. The obligations exist. The standard is set.

  Let us begin.
