  5.  **Mapping Misconceptions:**
      *   *'Aggregate is wrong':* Address during Mechanism phase. It's not wrong, it's incomplete.
      *   *'Small samples':* Address during Example setup. Make N large enough.
      *   *'Stratified is always right':* Address during Interpretation. (Crucial: Sometimes aggregate *is* the answer if the grouping is post-treatment).
