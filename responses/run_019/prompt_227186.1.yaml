  3.  **Drafting the Sequence (Order of Operations):**
      *   *Instinct Check:* The user suspects they need to establish weighted averages *before* the reversal. I agree, but not as a lecture. It needs to be discovered *during* the reversal explanation.
      *   *Revised Plan:*
          1.  Hook: The Reversal (The "What").
          2.  Mechanism: The Weights (The "How").
          3.  Interpretation: The Context (The "So What").
      *   *Why:* If you explain weighted averages first, they don't care. If you show the paradox first, they are confused. You need to show the paradox, *then* immediately resolve the confusion using the weights.

  4.  **Selecting the Example:**
      *   *Real vs. Constructed:* Real cases (Berkeley, Kidney Stones) bring baggage. Berkeley = sex discrimination debates. Kidney Stones = medical knowledge students don't have.
      *   *Decision:* Constructed, but plausible.
      *   *Properties:*
          *   Small integers (easy mental math).
