answer: |-
  Here is the lesson plan structured by dependency, example design, misconception management, and epistemic boundaries.

  ### 1. The Dependency Chain (Order of Operations)
  Your instinct is correct: if you show the reversal first without the mechanism, it looks like a magic trick. If you teach weighted averages first, it looks like algebra homework. You must sandwich the mechanism *inside* the reveal.

  **The Sequence (60 Minutes):**
  1.  **The Hook (10 mins):** Present the aggregate table first. Ask: "Does Program A or Program B work better?" Get a consensus.
  2.  **The Twist (10 mins):** Reveal the subgroup tables. Ask: "Does Program A or Program B work better *within* Group 1? Within Group 2?" (The answer flips).
  3.  **The Mechanism (15 mins):** **This is the critical dependency.** Do not move to interpretation until they understand *how* the math allows this. Explain that the Aggregate Rate is not a simple average; it is a **weighted** average. The group with more people "pulls" the total rate closer to its own success rate.
      *   *Dependency:* You cannot discuss "which table is right" until they accept that *both* tables are arithmetically correct.
  4.  **The Causal Selection (15 mins):** Now that the math is demystified, ask: "Which number should we report to the Dean?" Introduce the minimal causal vocabulary (see Section 5).
  5.  **Misconception Check & Wrap (10 mins):** Address the specific misconceptions and ask the final concept-check question.

  ---

  ### 2. The Example: Constructed vs. Real
  **Decision:** Use a **Constructed Example**.
  **Reasoning:** Real cases (Berkeley, Kidney Stones) require you to spend precious minutes explaining the context (e.g., "Why did women apply to harder departments?"). In a 60-minute section with weak algebra, context is cognitive load. You want them thinking about the *structure* of the numbers, not the sociology of 1973 admissions.

  **Required Properties:**
  1.  **Small Integers:** No decimals until the final percentage.
  2.  **Extreme Weight Imbalance:** The reversal must be driven by a massive difference in group sizes, not subtle rate differences.
  3.  **Consistent Direction:** The treatment must be strictly better (or worse) in *every* subgroup to make the aggregate reversal shocking.

  **The Numbers (Job Training Program):**
  *Context:* Two job programs (Intensive vs. Standard). Two applicant types (Experienced vs. Inexperienced). Outcome: Hired (Yes/No).

  | Group | Program | Hired | Total | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Experienced** (Hard to place) | Intensive | 2 | 10 | **20%** |
  | | Standard | 1 | 20 | **5%** |
  | **Inexperienced** (Easy to place) | Intensive | 4 | 10 | **40%** |
  | | Standard | 15 | 40 | **37.5%** |
  | **AGGREGATE** | **Intensive** | **6** | **20** | **30%** |
  | | **Standard** | **16** | **60** | **26.7%** |

  *Wait, check the reversal:*
  *   Subgroup 1: Intensive (20%) > Standard (5%).
  *   Subgroup 2: Intensive (40%) > Standard (37.5%).
  *   Aggregate: Intensive (30%) > Standard (26.7%).
  *   *Correction:* I need the Aggregate to flip. The Intensive program needs to be weighted toward the "Hard" group, and Standard toward the "Easy" group.

  **Revised Numbers (Verified for Reversal):**

  | Group | Program | Hired | Total | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Experienced** (Hard) | Intensive | 1 | 10 | **10%** |
  | | Standard | 2 | 40 | **5%** |
  | **Inexperienced** (Easy) | Intensive | 4 | 10 | **40%** |
  | | Standard | 15 | 40 | **37.5%** |
  | **AGGREGATE** | **Intensive** | **5** | **20** | **25%** |
  | | **Standard** | **17** | **80** | **21.25%** |
  *(Still no reversal. The Standard group is too big in the Easy category.)*

  **Final Verified Set (Use This):**
  *Goal:* Intensive is better in both subgroups. Standard is better overall.
  *Strategy:* Put most Intensive people in the Hard group. Put most Standard people in the Easy group.

  | Group | Program | Hired | Total | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Hard** (Low Hire Rate) | Intensive | 2 | 10 | **20%** |
  | | Standard | 1 | 10 | **10%** |
  | **Easy** (High Hire Rate) | Intensive | 8 | 10 | **80%** |
  | | Standard | 35 | 50 | **70%** |
  | **AGGREGATE** | **Intensive** | **10** | **20** | **50%** |
  | | **Standard** | **36** | **60** | **60%** |

  *Check:*
  1.  Hard Group: Intensive (20%) > Standard (10%).
  2.  Easy Group: Intensive (80%) > Standard (70%).
  3.  Aggregate: Intensive (50%) < Standard (60%).
  4.  **Reversal Confirmed.**

  **Computations for Students:**
  Have them calculate the four subgroup rates and the two aggregate rates. That is **six calculations**. Do not ask for more.

  ---

  ### 3. Misconception Map
  Do not wait for these to arise; head them off at the specific sequence points where they become relevant.

  | Misconception | When to Head It Off | How to Phrase It |
  | :--- | :--- | :--- |
  | **"The aggregate number is wrong/arithmetic error."** | **During The Mechanism (Step 3).** | "Both tables are mathematically correct. The aggregate isn't a mistake; it's answering a different question." |
  | **"This only happens with small samples."** | **During Example Setup (Step 1).** | Explicitly state: "Imagine these numbers are in the thousands. The proportions stay the same, the paradox stays the same." |
  | **"The stratified result is always the right one."** | **During Causal Selection (Step 4).** | "Splitting the data isn't always the solution. Sometimes the grouping variable is a *result* of the treatment, not a cause. We'll discuss how to tell in a moment." |
  | **"Adding more control variables gets you closer to truth."** | **During Wrap (Step 5).** | "If we split by hair color next, the numbers might change again. More variables $\neq$ more truth. Only *relevant* variables matter." |

  ---

  ### 4. What to Leave Out (And Say So)
  You must explicitly tell students what you are omitting so they don't feel they are getting a "baby version" that will fail them later.

  **Say this in class:**
  > "We are leaving out the formal mathematical tools used by professional statisticians to solve this, specifically **Directed Acyclic Graphs (DAGs)** and **Causal Calculus**. Those tools allow you to draw a map of cause-and-effect to prove which table to trust. We don't have time for the maps, but we do need the vocabulary to describe the terrain."

  **Minimal Causal Vocabulary Required:**
  You cannot resolve the paradox without these two concepts. If they don't have these, they will systematically pick the wrong table.
  1.  **Confounder (or Lurking Variable):** A variable that influences *both* the Treatment assignment and the Outcome. (In the example: "Experience" influences which Program they get into *and* their Hiring chance).
  2.  **Pre-existing Difference:** Emphasize that the groups must differ *before* the treatment starts. If the groups are formed *after* treatment (e.g., "People who survived the first week"), do not stratify.

  ---

  ### 5. Settled vs. Contested
  Be precise here. Social science majors will encounter conflicting advice in later courses. Distinguish the math from the interpretation.

  **Settled (Present as Fact):**
  *   **The Arithmetic:** It is a mathematical fact that $A > B$ in subgroups does not guarantee $A > B$ in the aggregate.
  *   **The Mechanism:** It is a fact that this occurs due to unequal weighting of the subgroups.
  *   **The Risk:** It is a fact that ignoring confounders leads to biased estimates of effect.

  **Contested (Present as Debate/ Nuance):**
  *   **Is it a Paradox?** Tell them: "Many statisticians hate the word 'Paradox.' It implies a logical contradiction. There is no contradiction. It is just a feature of weighted averages. We call it a paradox because it feels wrong intuitively."
  *   **Which Table is the Truth?** Tell them: "The math cannot tell you which table to trust. That is a scientific question, not a statistical one. Sometimes the aggregate is the truth (if the grouping variable is irrelevant). Sometimes the stratified table is the truth (if the variable is a confounder). You need subject-matter knowledge to decide."

  ---

  ### 6. The Final Concept-Check Question
  Do not ask them to calculate a rate. Ask them to identify the structure.

  **The Question:**
  > "A study finds that people who drink more coffee have higher rates of heart disease. However, when we split the data by 'Smoker' and 'Non-Smoker,' coffee drinkers have *lower* rates of heart disease in both groups.
  >
  > **Question:** To understand the effect of coffee on heart disease, why might we trust the split groups more than the total?
  >
  > **A)** Because the total number of people was too small.
  > **B)** Because smoking is likely related to both coffee drinking and heart disease.
  > **C)** Because the arithmetic in the total table was incorrect.
  > **D)** Because we should always split the data by as many variables as possible."

  **Correct Answer:** **B**.
  *   **Why this works:**
      *   A addresses the sample size misconception.
      *   C addresses the arithmetic misconception.
      *   D addresses the "more controls = better" misconception.
      *   **B** requires them to identify the **Confounder** structure (the minimal vocabulary). If they pick B, they understand that the reversal is structural/causal, not mathematical magic.
