      *   *Refining the Diagnosis:* Use terms like "Manifestation Constraint" (Dummett) for SV and "Externalism/Causal Theory" for Epi (Williamson). This grounds the user's intuition in existing literature.
      *   *Refining the Resolution:* Be honest. It's unlikely to be solved by data. It's a clash of theoretical virtues (parsimony vs. intuition, classical logic vs. bivalence).
      *   *Nuance on Logic:* Note that SV keeps classical *validity* but drops bivalence. Epi keeps both. This is a key formal difference, but it stems from the meta-semantic commitment.

  8.  **Final Polish:** Check against constraints. Did I say who is right? No. Did I answer both parts of the prompt? Yes. Is the tone appropriate? Yes. (Self-Correction: Make sure not to imply SV *always* rejects classical logic; they save validity, which is often enough for "classical logic" in practice, but they reject the Law of Bivalence. Epistemicists keep Bivalence. This is a crucial distinction.)

  9.  **Final Output Generation:** (Proceed to generate response based on these thoughts.)
answer: |-
  Your diagnosis is remarkably astute. After four years of stalemate, you have likely identified the engine of the impasse: this is not primarily a dispute about the linguistic data (both sides account for the same intuitions about borderline cases) nor a purely formal dispute (both can model the Sorites paradox). It is a **meta-semantic and methodological disagreement** about the constitutive norms of semantic theory.

  Here is a breakdown of what kind of disagreement this is, why it resists empirical or formal resolution, and what (if anything) could disrupt the equilibrium.

  ### 1. The Nature of the Disagreement: Meta-Semantic Norms

  You hypothesized that the camps are "grading semantic theories by different measures of success." In the literature, this is often framed as a clash between **internalist/use-based constraints** and **externalist/truth-based constraints**.

  *   **The Supervaluationist Measure (The Manifestation Constraint):**
      The supervaluationist is implicitly committed to a verificationist or use-theoretic constraint on meaning, reminiscent of Dummett. The core intuition is: *Meaning must be manifestable in use.* If our linguistic practice does not determine a boundary (and the Sorites paradox suggests it doesn't), then there is no boundary. To posit one is to posit "semantic magic." For the supervaluationist, semantics is a model of **commitment**. A sentence is true if we are committed to it in all admissible refinements of our practice. Truth is tethered to knowability in principle.
  *   **The Epistemicist Measure (The Classical Constraint):**
      The epistemicist (following Williamson) is committed to a robust realism about truth and reference, often grounded in externalism. The core intuition is: *The world determines truth, not our access to it.* Meaning is fixed by causal-historical chains or descriptive conditions that pick out a unique extension, even if our cognitive faculties are too coarse to detect the cutoff. For the epistemicist, semantics is a model of **reality**. Truth is independent of knowability.

  **The Verdict on "What Kind":**
  This is a **philosophical/methodological disagreement** about the relationship between *meaning*, *truth*, and *knowledge*.
  *   It is not **empirical**: No amount of psycholinguistic data about how people process the word "bald" will tell us whether a sharp boundary *exists* metaphysically, only how humans *react* to the term.
  *   It is not **merely verbal**: They are not just using the word "true" differently; they are proposing incompatible ontologies of semantic facts.
  *   It is not **formal**: As you noted, both can preserve classical validity (supervaluationism preserves validity even if it rejects bivalence). The formal systems are often inter-translatable (e.g., adding a determinacy operator to epistemicism mimics supervaluationist truth).

  ### 2. Why the Stalemate is Resistant to Evidence

  You asked if any distinction, formal result, or empirical finding could move one side. The pessimistic answer is that the stalemate is structurally designed to be permanent, because each side treats the other's "costs" as virtues.

  **Empirical Findings:**
  Experimental philosophy has tried to weigh in (e.g., testing whether ordinary speakers accept bivalence for borderline cases).
  *   *Why it fails:* If speakers say "It's neither true nor false," the Epistemicist says, "They are confused/ignorant." If speakers say "It's either true or false," the Supervaluationist says, "They are speaking loosely."
  *   Because Epistemicism posits *irreducible* ignorance, empirical evidence of ignorance is consistent with *both* theories. Evidence of indeterminacy is consistent with *both* (Epistemicists explain it as cognitive limitation; Supervaluationists as semantic incompleteness).

  **Formal Results:**
  *   *Why it fails:* Supervaluationism can be formalized to validate all classical inferences (preservation of super-truth). Epistemicism validates classical logic by fiat.
  *   There is a formal distinction regarding **Higher-Order Vagueness**. Supervaluationism struggles to formalize "it is indeterminate that it is indeterminate" without collapsing into determinacy. Epistemicism handles higher-order vagueness easily (it's just ignorance about where the ignorance boundary is).
  *   *However:* Supervaluationists view the difficulty with higher-order vagueness as a feature (vagueness is messy), while Epistemicists view their clean handling of it as a virtue. A formal result showing one system is "cleaner" will not convince the other side that cleanliness is the relevant metric.

  ### 3. How to Break the Ritual (If At All)

  If the disagreement is about theoretical virtues, the only way to move the needle is to challenge the **cost-benefit analysis** of the opposing camp. You cannot prove them wrong; you must make their position theoretically untenable *by their own lights*.

  **A. Challenge the Epistemicist on Reference Fixing**
  The Epistemicist claims use + facts fix a sharp boundary.
  *   *The Move:* Press the "Arbitrariness Objection." If use fixes a boundary at hair #4,352 rather than #4,353, there must be a semantic reason. Since no such reason exists (the hairs are phenomenally identical), the Epistemicist must posit a "brute semantic fact."
  *   *The Goal:* Force the Epistemicist to admit their theory requires a metaphysically mysterious relation between use and extension that violates principles of supervenience. If they value naturalism, this is a pressure point.

  **B. Challenge the Supervaluationist on Logical Cost**
  The Supervaluationist claims to save classical logic, but they reject the T-schema ($\langle P \rangle$ is true iff $P$) for borderline cases and reject Bivalence.
  *   *The Move:* Press the "Truth-Functionality Objection." In Supervaluationism, $P \lor Q$ can be super-true even if neither $P$ nor $Q$ is super-true. This breaks the link between the truth of a compound and the truth of its parts.
  *   *The Goal:* Force the Supervaluationist to admit they have abandoned a classical conception of truth-conditions, not just bivalence. If they value compositionality, this is a pressure point.

  **C. The "Third Way" Dissolution**
  Often, stalemates like this persist only because the binary is exhaustive. The stalemate might break if the group considers **Contextualism** or **Degree Theory (Fuzzy Logic)**.
  *   *Contextualism:* Suggests the boundary *does* shift depending on conversational context (resolving the Sorites by denying the premises hold in a single context). This splits the difference: there is a sharp boundary *in context*, but no fixed boundary *simpliciter*.
  *   *Degree Theory:* Suggests the disagreement is based on a false dichotomy (true/false). If truth comes in degrees, the Epistemicist's sharp line and the Supervaluationist's gap both disappear.
  *   *Note:* Both your current camps will resist this, but introducing a new variable often forces the existing camps to clarify *why* they reject the third option, which can reveal hidden premises.

  ### Summary Diagnosis

  Your reading group is experiencing a **clash of theoretical virtues**.
  *   **Epistemicism** trades **intuition** (it feels like there's no cutoff) for **logical/metaphysical simplicity** (bivalence, classical logic, standard reference).
  *   **Supervaluationism** trades **logical/metaphysical simplicity** (rejecting bivalence, complex truth definitions) for **intuition** (no sharp cutoff, meaning is use).

  **Is the stalemate permanent?**
  Yes, unless the criteria for theory choice change. As long as one side prioritizes "saving classical metaphysics" and the other prioritizes "respecting the phenomenology of use," they will talk past each other. They are solving different problems: the Epistemicist is solving the problem of how language hooks onto the world; the Supervaluationist is solving the problem of how we navigate the world with limited concepts.

  **Recommendation:**
  Stop asking "Which theory fits the data?" (They both do). Start asking: **"What are we willing to sacrifice?"**
  Run a session where the only rule is that participants must argue *against* their own preferred view's greatest cost. Ask the Epistemicist to defend the knowability of the boundary; ask the Supervaluationist to defend the truth-value of $P \lor \neg P$ in a borderline case. You may not resolve the truth, but you will dissolve the illusion that the disagreement is about the linguistic evidence. It is about the price of admission.
