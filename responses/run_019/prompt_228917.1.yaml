answer: |-
  **Project Title:** The Metric Constraint: A Measurement Audit of Egalitarian Currencies

  **Research Question**
  Does the informational burden required to measure specific egalitarian currencies (welfare, resources, capabilities) render them theoretically incoherent or operationally indeterminate? [High Confidence that this question is precise]. While the "equality of what?" debate typically selects a currency based on normative fit (e.g., respecting choice vs. circumstance), this project asks whether the measurement-theoretic prerequisites of each currency act as a hard constraint on its viability. [Moderate Confidence that this constraint is currently under-analyzed].

  **Background and Gap**
  Current political philosophy treats measurement as a secondary implementation problem. [High Confidence]. Welfare-based approaches generally require cardinal, interpersonally comparable utility data. [High Confidence]. Resource-based approaches attempt to reduce this burden but often rely on hypothetical insurance markets that are difficult to specify empirically. [Moderate Confidence]. Capability approaches often present themselves as requiring only ordinal rankings of functionings, yet aggregating multiple dimensions into a single metric of advantage inevitably requires weighting schemes that reintroduce cardinal demands. [High Confidence]. The existing debate leaves open whether these measurement demands are merely difficult or whether they are conceptually illicit given what we can know about human lives. [High Confidence].

  **Methodology**
  This project conducts a conceptual "measurement audit." I will not propose a new theory of justice but will analyze the informational axioms required by existing ones.
  *   **Month 1: Taxonomy of Measurement.** Define the strict measurement-theoretic requirements (ordinal, cardinal, ratio-scale, interpersonal comparability) for each major currency. I will map these against standard psychometric and economic scaling theories.
  *   **Month 2: Welfare and Resources.** Audit welfare metrics for assumptions about mental state comparability. Audit resource metrics for assumptions about the convertibility of assets into advantage.
  *   **Month 3: Capabilities and Aggregation.** Focus on the "weighting problem." I will analyze whether capability sets can be ranked without implicit cardinalization.
  *   **Month 4: Synthesis.** Determine if any currency survives the audit without relying on unjustified empirical assumptions. I will draft a paper arguing that the choice of currency is partially determined by measurement feasibility.

  **Scope and Limitations**
  My training is in biochemistry, not normative ethics. [High Confidence]. I will avoid deep debates on the *value* of equality and focus strictly on the *measurability* of the proposed metrics. [High Confidence]. The risk is oversimplifying philosophical nuances to fit measurement categories. To mitigate this, I will limit the scope to the three dominant currencies and exclude hybrid theories. [Moderate Confidence].

  **Conditions for Failure**
  The project fails if: (1) The audit reveals that all currencies collapse into the same impossible measurement demands, rendering the distinction moot. [Moderate Confidence]. (2) It turns out that normative theory legitimately ignores measurement feasibility, making the audit irrelevant to the philosophical debate. [Low Confidence].

  ***

  **Meta-Commentary on Confidence Levels**

  **Least Sure Claim:**
  The claim I am least sure of is: *"It turns out that normative theory legitimately ignores measurement feasibility, making the audit irrelevant to the philosophical debate."* (Listed under Conditions for Failure).

  **Reasoning:**
  I am a scientist; I assume a theory requiring impossible data is flawed. However, in political philosophy, "ideal theory" often explicitly brackets feasibility. It is possible that the philosophical community has already decided that what *ought* to be measured is distinct from what *can* be measured, and that the former dictates the latter, not vice versa. If this is the consensus, my entire premise—that measurement constraints should inform the choice of currency—might be category error. I am confident I can identify the measurement demands, but I am less confident that philosophers will accept those demands as relevant to the normative choice.
