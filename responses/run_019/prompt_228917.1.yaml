      *   *Precise Question:* "To what extent do the measurement-theoretic prerequisites of leading egalitarian currencies (welfare, resources, capabilities) render them operationally indeterminate or reliant on unjustifiable empirical assumptions?"
      *   *Why existing debate leaves it open:* Philosophers focus on *normative* justification (what *should* count) rather than *operational* feasibility (what *can* be counted). They assume measurability is a secondary implementation problem, not a constitutive one.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to sound academic but reflect the niche. "The Measurement Audit of Egalitarian Currencies."
      *   **Project Summary/Abstract:** Briefly state the goal.
      *   **Research Question:** As refined above.
      *   **Background/Gap:** Explain the "equality of what?" debate and the missing measurement dimension.
      *   **Methodology (Month-by-Month):** A semester is roughly 4-5 months.
