  # Joint Statement on the Ethics of Procreative Selection
  **A Record of Adversarial Collaboration**

  **Signatories:**
  *The Procreative Beneficence Working Group* (Defenders of the Principle of Procreative Beneficence)
  *The Liberal Reproductive Autonomy Working Group* (Defenders of Permissive, Non-Directive Liberal Eugenics)

  **Date:** October 26, 2023

  **Preamble:**
  Over the course of a structured adversarial collaboration, the undersigned parties have sought to map the normative landscape of genetic selection and reproductive technology. While we remain divided on the existence of a moral obligation to select specific traits, we have achieved significant clarity regarding the structure of our disagreement. This document records our shared commitments, precisely locates our residual divergences, and identifies the empirical and philosophical cruxes that determine the future of this debate.

  ### I. Shared Claims and Conceptual Distinctions

  We jointly affirm the following propositions. In doing so, we explicitly distinguish between a *pro tanto* reason (a consideration that counts in favor of an action but may be outweighed), an *all-things-considered obligation* (a final moral requirement), and a *bare permission* (an action that is morally allowable).

  1.  **Welfare Relevance:** Both parties agree that the expected well-being of a future child is a morally relevant consideration in procreative decision-making. It is not morally neutral whether a child is born with a painful condition or a healthy one.
  2.  **Existence of *Pro Tanto* Reasons:** Both parties agree that prospective parents generally have a *pro tanto* moral reason to select the child with the better expected life prospects, all else being equal.
      *   *Note on Dissolution:* Distinguishing *pro tanto* reasons from all-things-considered obligations dissolves the apparent disagreement wherein Liberal Eugenics advocates are accused of disregarding child welfare entirely. We agree welfare counts; we disagree on whether it always trumps.
  3.  **Legal Permissibility:** Both parties agree that, barring significant safety risks or direct harms to others, the state should not legally prohibit prospective parents from accessing genetic selection technologies (e.g., PGT, non-medical sex selection). We agree on a regime of *bare permission* in the legal sphere.
  4.  **The Non-Identity Problem:** Both parties acknowledge the metaphysical reality that in many selection scenarios, choosing one embryo over another results in a numerically different person coming into existence. We agree that standard person-affecting harm principles (e.g., "you harmed *this* child") face logical difficulties in these specific cases.
  5.  **Epistemic Limits:** Both parties acknowledge that predicting the "best expected life" is subject to significant uncertainty regarding future social environments, medical advancements, and individual psychological adaptation.

  ### II. Residual Disagreements

  While we agree on the claims above, we disagree on the final normative verdict. We present this disagreement below in two formulations. Each side accepts that the opposing formulation accurately captures the other's position, even if they do not endorse the conclusion.

  **Formulation A (As articulated by Defenders of Procreative Beneficence):**
  > "While parents have legitimate interests in reproductive autonomy, these interests do not outweigh the moral imperative to bring about the best possible state of affairs. When a choice exists between a future child with significantly lower expected well-being and one with higher expected well-being, failing to select the latter constitutes a moral failure. The *pro tanto* reason to benefit the future person becomes an all-things-considered obligation because there is no competing right of a non-existent person to be born 'unselected,' and parental autonomy does not extend to knowingly imposing avoidable disadvantages."

  **Formulation B (As articulated by Defenders of Liberal Eugenics):**
  > "While welfare is a relevant consideration, it is not the sole sovereign value in reproduction. Procreative choices are expressive acts embedded in parental projects and family integrity. Imposing an all-things-considered obligation to maximize expected well-being treats children as products to be optimized rather than persons to be welcomed. The *pro tanto* reason to benefit is frequently outweighed by the value of parental discretion, the right to an 'open future' free from specific design expectations, and the moral hazard of codifying contested visions of the 'good life' into mandatory requirements."

  ### III. Cruxes of the Debate

  We have identified three specific sub-questions (cruxes) where further philosophical argument or empirical finding would significantly alter the confidence levels of one or both parties. For each crux, we propose a concrete case or type of finding, and record our predictions regarding how the resolution of that crux bears on the debate.

  #### Crux 1: The Person-Affecting vs. Impersonal Evaluation Under Uncertainty
  **The Question:** In cases where selection determines *which* child exists (Non-Identity cases), must moral evaluation be grounded in harm to a specific person (Person-Affecting), or can it be grounded in the impersonal value of one state of affairs being better than another (Impersonal)?

  **Concrete Case:** *The Mild Disability vs. High Aptitude Scenario.*
  Prospective parents can select Embryo A (expected to have a mild, manageable chronic pain condition) or Embryo B (expected to have no pain condition and higher cognitive aptitude). Embryo A, if selected, will report a life worth living and will not resent their existence. Embryo B will never exist if A is chosen.

  **Bearing on Debate:** If moral obligations require a subject who is harmed (Person-Affecting), the obligation to choose B vanishes. If obligations can be impersonal (Impersonal), the obligation to choose B remains.

  *   **Procreative Beneficence Prediction:** We predict that intuitive moral judgment in this case aligns with the Impersonal view. Most agents feel a pull to choose B not because A is harmed, but because the world containing B is better. We expect that refining the "No Difference View" (that there is no moral difference between making a person happy and making a different, happier person) will convince skeptics that the obligation holds even without a specific victim.
  *   **Liberal Eugenics Prediction:** We predict that upon reflection, agents will reject the Impersonal view as too demanding and alienating. We expect that emphasizing the *relationship* between parent and specific child will show that obligations arise only once a child is conceived or born. We anticipate that the intuition to choose B is a *preference*, not a *duty*, and that conflating the two undermines the moral significance of accepting a child "as they come."

  #### Crux 2: Plasticity and the Indeterminacy of "Best Prospects"
  **The Question:** Does the high plasticity of human well-being in response to social and environmental inputs render the "best expected life" too indeterminate to ground a strict moral obligation?

  **Concrete Case:** *The Musical Aptitude Selection.*
  Parents can select for a genetic profile associated with high musical aptitude. In a society that values music, this leads to high well-being. In a society where music is suppressed or devalued, this leads to frustration and lowered well-being. The social trajectory 40 years into the future is unknowable.

  **Bearing on Debate:** If "ought implies can know," and parents cannot reliably know which traits yield the best life due to environmental plasticity, the obligation dissolves into a permission.

  *   **Procreative Beneficence Prediction:** We predict that while specific traits (like music) are plastic, *general* traits (like pain resistance, immune health, general cognitive processing speed) have robust, cross-environmental value. We expect empirical data to show a high correlation between certain biological baselines and well-being across diverse societies, sufficient to ground a probabilistic obligation.
  *   **Liberal Eugenics Prediction:** We predict that the interaction between genotype and environment is too complex to isolate "robust" traits with the certainty required for moral obligation. We expect findings to show that "disadvantages" are often socially constructed (e.g., Deaf culture). Consequently, we argue that selection must remain a *gamble* undertaken by parents, not a *calculation* mandated by morality, because the variables cannot be sufficiently fixed to make "maximization" a coherent command.

  #### Crux 3: The Expressive Meaning of Selection
  **The Question:** Does the act of selection itself, regardless of the trait chosen, alter the moral relationship between parent and child in a way that generates a counter-vailing duty *not* to optimize?

  **Concrete Case:** *The "Giftedness" Constraint.*
  Parents choose Embryo B (higher aptitude) over Embryo A. The child, B, grows up knowing they were selected for their aptitude. Does this knowledge impose a burden of expectation that reduces well-being, or is it neutral/positive?

  **Bearing on Debate:** If selection inherently creates a conditional acceptance that harms the parent-child relationship, the *pro tanto* reason to select for welfare is counterbalanced by a *pro tanto* reason to accept unconditionally.

  *   **Procreative Beneficence Prediction:** We predict that longitudinal studies of children born via selection (e.g., IVF with screening) will show no significant difference in perceived parental love or psychological burden compared to naturally conceived children. We argue that "unconditional love" is compatible with "conditional conception," and that the fear of instrumentalization is philosophically overstated.
  *   **Liberal Eugenics Prediction:** We predict that as selection becomes more granular and directive, the "designer" dynamic will erode the sense of "giftedness" (in the sense of receiving life as a gift). We expect psychological findings to show that children who perceive themselves as "optimized projects" report higher anxiety and lower autonomy. This expressive harm provides the overriding reason that converts the obligation into a mere permission.

  ***

  **Signed,**

  *For the Procreative Beneficence Working Group*
  __________________________

  *For the Liberal Reproductive Autonomy Working Group*
  __________________________
