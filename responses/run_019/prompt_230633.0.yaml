  Hello colleague. It's a pleasure to meet another analyst. Since you're used to thinking in terms of signal-to-noise ratios, baseline drift, and calibration standards, I'll frame this in those terms. Political philosophy is often just noisy data looking for a clean calibration curve.

  Based on the three data points you provided (Kosovo, Iraq, Libya), here is my prediction for the West Africa case, the underlying models competing in your neighbor's head, and a test case to isolate the variable that actually drives his verdicts.

  ### 1. The Prediction
  **Verdict:** He will likely say the intervention is **Not Justified.**

  **The Reasoning:**
  While the "Imminent Atrocity" signal is strong (800k people at risk) and the "Regional Support" (African Union) mimics the NATO signal in Kosovo, there are two sources of "noise" that exceed his tolerance threshold:
  1.  **Economic Contamination:** Unlike Kosovo ("no plausible economic motive"), this coalition has mineral concessions. To him, this looks like the "bad faith" signal from Iraq, even if muted.
  2.  **Outcome Uncertainty:** The 50/50 stability odds and 40% wider war risk trigger the Libya heuristic. In Libya, he conceded the *start* was valid but rejected the *total operation* because the aftermath was disastrous. Here, the analysts are predicting a "failed state" probability upfront.

  He tolerates procedural errors (No UN approval in Kosovo) only when the motive is pure and the outcome is secure. He tolerates procedural correctness (UN approval in Libya) only when the mandate is held. West Africa fails both the "Pure Motive" test (minerals) and the "Secure Outcome" test (50/50 stability).

  ### 2. Candidate Rules (The Models)
  To understand *why* he decides this way, we can reconstruct two competing calibration rules that both fit his past data.

  **Model A: The "Clean Hands" Exception (Kosovo-Weighted)**
  *   **The Rule:** You may bypass the Security Council (the standard baseline) *if and only if* there is an imminent massacre, regional organization support, and **zero** conflicting economic interests.
  *   **How it fits the record:**
      *   *Kosovo:* Passes (No UN, but pure motive).
      *   *Iraq:* Fails (False pretext + economic interest).
      *   *Libya:* Fails (Mission creep violated the "pure motive" mandate).
  *   **Application to West Africa:** Fails. The mineral concessions violate the "zero economic interest" clause, making the UN veto fatal.

  **Model B: The "Net Humanitarian Outcome" Rule (Libya-Weighted)**
  *   **The Rule:** An intervention is justified only if the probable post-war stability is significantly higher than the status quo. Procedural legitimacy (UN vs. No UN) is secondary to the **risk of state collapse**.
  *   **How it fits the record:**
      *   *Kosovo:* Passes (Post-war stability was high; it became a protectorate).
      *   *Iraq:* Fails (State collapsed, long-term instability).
      *   *Libya:* Fails (State collapsed, long-term instability).
  *   **Application to West Africa:** Fails. A 50/50 chance of stability is too close to the Libya/Iraq baseline of failure.

  ### 3. Which Case is Doing the Work?
  **Libya is the dominant calibration point.**

  Here is why: If Kosovo were the dominant rule, the lack of UN approval in West Africa wouldn't matter (since it didn't matter in Kosovo). The fact that he is likely to reject West Africa despite the African Union's request suggests that the *absence of UN approval* is now a liability that can only be overcome by perfect motives and perfect outcomes.

  Libya taught him that "good intentions at the start" (Benghazi no-fly zone) are not enough if the execution drifts or the aftermath fails. Since the West Africa analysts are predicting a 50/50 stability risk *before* the first shot is fired, the Libya precedent acts as a "stop-loss" order. He is treating the mineral concessions as a leading indicator of the mission creep that ruined Libya.

  ### 4. The Discriminating Test Case
  To know for sure whether he is following **Model A (Clean Hands/Motive)** or **Model B (Outcome/Stability)**, you need a case that isolates "Motive Purity" from "Outcome Risk."

  **Proposed Case: "The Barren State Crisis"**
  *   **Scenario:** A landlocked, resource-poor country (no oil, no minerals, no strategic value).
  *   **Threat:** A dictator is actively starving a rebel region (Imminent Atrocity).
  *   **Mandate:** The Regional Body requests intervention. The **Security Council vetoes it** (Deadlock).
  *   **Motive:** The intervening coalition has **no economic ties** to the country (Pure Motive).
  *   **Outcome:** Intelligence suggests a **60% chance of state collapse** and long-term anarchy after the dictator falls (High Instability Risk).

  **How to Interpret His Answer:**
  *   **If he says JUSTIFIED:** He is following **Model A (Kosovo)**. He believes that pure humanitarian motive and regional support allow you to bypass the UN, even if the long-term odds are risky. The "Clean Hands" wash away the "Outcome Risk."
  *   **If he says NOT JUSTIFIED:** He is following **Model B (Libya)**. He believes that a high probability of state collapse vetoes the intervention, regardless of how pure the motives are or how bad the atrocity is. The "Outcome Risk" trumps the "Clean Hands."

  **Why this works:**
  This removes the "Economic Noise" (like Kosovo) but keeps the "UN Baseline Drift" (like Kosovo) while introducing the "Libya Instability" variable. It forces him to choose between the *righteousness of the cause* (Kosovo) and the *probability of the aftermath* (Libya).

  Good luck with the argument. If he's as analytical as you say, he'll appreciate the attempt to isolate the variables.
