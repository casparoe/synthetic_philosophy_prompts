      *   *Peer Disagreement:* Concede it's weird, hold that stakes create asymmetry. Reply: They aren't epistemic peers if stakes differ practically. Soft spot: Feels like ad hocery.
      *   *Evidence Nature:* Concede evidence is fixed, hold justification is a relation. Reply: The *strength* required of the relation varies. Soft spot: Hard to explain *why* without circularity.
      *   *Retroactivity:* Concede it sounds odd, hold that knowledge is time-relative. Reply: Past knowledge claims are evaluated by past stakes. Soft spot: Makes knowledge unstable.

