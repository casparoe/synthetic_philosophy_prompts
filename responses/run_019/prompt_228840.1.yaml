answer: |-
  # Q&A PREP SHEET: Moderate Pragmatic Encroachment & The Delegation Problem

  **Strategy:** You are defending a metaphysical claim about the nature of knowledge (SSI/Pragmatic Encroachment), not a linguistic one. Your shield is the *Delegation Problem*: Contextualism cannot explain the objective transfer of epistemic authority in institutions, and Invariantism cannot explain the rational difference between the Inspector and the Manager. Your vulnerability is the *mechanism*: how practical facts alter epistemic status without altering evidence.

  **Ordering:** Objections are ranked by existential threat to the project (1 = Project Killer, 10 = Nuisance).

  ---

  ### 1. The Decision Theorist (Existential Threat)
  **Objection:** "You're multiplying entities without necessity. I can model the Inspector and the Manager entirely with credences and expected utility. The Manager has a high credence but faces a massive potential loss, so she doesn't act without further checking. The Inspector has the same credence but low loss, so she acts. We've explained the behavioral difference without touching the concept of 'knowledge.' What explanatory work is your stakes-sensitive *knowledge* doing that credences aren't already doing?"

  *   **Concede:** Credences and utility perfectly model rational *action*.
  *   **Hold:** Knowledge is the *stopping rule* for inquiry, not just a guide for action.
  *   **2-Minute Reply:** "Decision theory tells us how to act given a credence, but it doesn't tell us when inquiry is *over*. The Manager doesn't just need to calculate utility; she needs to know if she is *permitted to stop gathering evidence*. Knowledge is that categorical status. If we reduce everything to credences, we lose the normative force that allows the Inspector to sign off and the Manager to rely. My view explains why the Manager feels epistemic anxiety despite high credence: she lacks the categorical status required to close inquiry."
  *   **Soft Spot:** You risk defining knowledge *as* "the stopping point," which sounds circular if the stopping point is determined by stakes.

  ### 2. The Orthodox Invariantist (Classification Threat)
  **Objection:** "I share your intuitions about the Inspector and the Manager. The Inspector is rational to sign; the Manager is rational to double-check. But you're mislabeling the phenomenon. This isn't about *knowledge*. It's about the norms of *assertion* or *practical rationality*. The Manager knows the scaffold is secure, she just shouldn't *act* on it without more proof. Why contaminate the epistemic with the practical?"

  *   **Concede:** Knowledge is deeply connected to truth and evidence.
  *   **Hold:** Knowledge is the bridge between evidence and action; you can't sever the bridge without breaking the structure.
  *   **2-Minute Reply:** "If the Manager knows, but shouldn't act, then knowledge is normatively inert. But we treat 'I know' as a sufficient condition for 'It is appropriate to act.' In the Delegation case, the Inspector transfers authority. If the Manager *knows* but lacks justification to act, the transfer fails. The pragmatic encroachment view preserves the link: the Manager lacks knowledge *because* she lacks the justification to act on that evidence at that stakes level. To save the 'purity' of knowledge, you have to sever it from its functional role in our lives."
  *   **Soft Spot:** Invariantists will argue that "appropriate to act" is context-sensitive, not knowledge-sensitive.

  ### 3. The Contextualist (Explanatory Theft)
  **Objection:** "You claim the Delegation Problem is a bug for me, but it's a feature. When the Inspector says 'I know,' her context is low-stakes, so 'knows' picks out a low standard. When the Manager's colleague says 'She doesn't know,' their context is high-stakes, so 'knows' picks out a high standard. Both sentences are true. You're positing a metaphysical shift in the subject's knowledge state when all we have is a shift in the attributor's conversational context. Why add the metaphysical baggage?"

  *   **Concede:** Contextualism handles the linguistic data of knowledge *ascriptions* well.
  *   **Hold:** Institutions rely on the *fact* of knowledge, not the *ascription*.
  *   **2-Minute Reply:** "Institutions don't run on conversational contexts; they run on objective reliance. If the Manager relies on the Inspector, she needs the Inspector to *actually have* a status that survives the transfer to the high-stakes environment. On your view, the Inspector *never had* the status the Manager needs, because the Manager's context shifts the meaning of the report. On my view, the Inspector has a status that is *inheritable*, but the Manager needs more to *possess* it herself. My view explains the objective flow of authority; yours explains only the flow of conversation."
  *   **Soft Spot:** It is difficult to prove the "metaphysical" view is superior without relying on linguistic intuitions, which favor Contextualism.

  ### 4. The Truth-Conductivity Objector (Metaphysical Threat)
  **Objection:** "Knowledge is factive. It entails truth. Stakes do not affect the truth of $p$, nor do they affect the reliability of the evidence for $p$. So how can stakes affect knowledge? You are suggesting that practical facts can alter epistemic status. This violates the distinction between theoretical and practical rationality. You're arguing that wanting it to be true (or needing it to be true) makes it known."

  *   **Concede:** Stakes do not affect truth or the reliability of the evidence source.
  *   **Hold:** Stakes affect the *sufficiency* of the justification, not the truth or evidence itself.
  *   **2-Minute Reply:** "I am not saying stakes make $p$ true. I am saying knowledge is a status we assign to believers who are *safe enough* to act. If the cost of error rises, the level of safety required to count as 'knowing' rises. Think of it like a safety certification. A bridge might be 'safe' for pedestrians (low stakes) but not 'safe' for tanks (high stakes), even if the bridge hasn't changed. The bridge's physical properties are fixed; the certification threshold is sensitive to use. Knowledge is the certification."
  *   **Soft Spot:** Critics will argue safety certifications are pragmatic, whereas knowledge is supposed to be a cognitive relation to the fact.

  ### 5. The Delegation Specific Objector (Internal Consistency)
  **Objection:** "Let's look at your Delegation case. You say the Manager inherits the Inspector's justification but doesn't know. If she doesn't know, is she rational to rely on the sign-off? If yes, then knowledge isn't the norm of reliance. If no, then institutions are irrational for relying on experts. You seem to be saying the Manager is rational to act (because she has the report) but doesn't know. Isn't that the Invariantist position you rejected?"

  *   **Concede:** The Manager is rational to rely on the Inspector's *testimony*.
  *   **Hold:** Testimonial justification is distinct from personal knowledge in high-stakes environments.
  *   **2-Minute Reply:** "There is a distinction between *reasonable reliance* and *knowledge-level justification*. The Manager is rational to treat the Inspector as an authority, which gives her a defeasible reason to act. But in high-stakes contexts, defeasible reasons aren't enough for *knowledge*. She needs to verify or assume liability. My view allows that she acts rationally (on authority) without claiming the epistemic status of knowledge. This protects the institution: the Inspector provides the knowledge; the Manager provides the risk-assessment."
  *   **Soft Spot:** This creates a gap between "rational to act" and "knows," which looks suspiciously like the Invariantist view you're fighting.

  ### 6. The Closure Objector (Logical Threat)
  **Objection:** "Suppose the Manager knows that 'If the scaffold is secure, the workers will survive.' She knows the entailment. If she doesn't know the scaffold is secure (due to stakes), does she fail to know the workers will survive? This violates the principle of closure. You are forcing us to accept that knowledge is not closed under known entailment when stakes shift."

  *   **Concede:** Moderate encroachment does strain the principle of Closure.
  *   **Hold:** Closure is an idealization that fails at the boundaries of practical stakes.
  *   **2-Minute Reply:** "Closure holds within a fixed stakes context. It breaks when the consequent involves higher stakes than the antecedent. If knowing $p$ licenses action $A$, and $p$ entails $q$, but $q$ involves catastrophic risk, you cannot simply transfer the license. The 'cost' of being wrong about $q$ is higher than $p$. We should not preserve a logical principle at the cost of making agents vulnerable to catastrophic error. Logic serves reasoning; reasoning serves survival."
  *   **Soft Spot:** Closure is a very strong intuition for epistemologists. Denying it is a major theoretical cost.

  ### 7. The Vagueness Objector (Workability Threat)
  **Objection:** "You say stakes raise the threshold. How much? Is there a formula? If the stakes double, does the evidence required double? If you can't specify the function, your theory is unfalsifiable. Anytime someone intuits 'no knowledge,' you'll just say 'stakes were too high.' This is a 'just-so' story."

  *   **Concede:** There is no precise mathematical formula for epistemic thresholds.
  *   **Hold:** Vagueness does not entail meaninglessness.
  *   **2-Minute Reply:** "Many useful concepts are vague. 'Tall,' 'Rich,' 'Bald.' We don't need a precise height to know someone is tall enough to ride a rollercoaster. Similarly, we don't need a precise formula to know when stakes are 'high enough' to defeat knowledge. The Delegation case is a clear paradigm, like a clearly tall person. The existence of borderline cases doesn't refute the core claim that stakes *can* shift the threshold."
  *   **Soft Spot:** "Tall" is descriptive; "Knowledge" is normative. Vagueness in norms is more problematic.

  ### 8. The Peer Disagreement Objector (Social Threat)
  **Objection:** "Imagine the Inspector and the Manager compare notes. They have the same evidence. The Inspector says 'I know.' The Manager says 'I don't know.' On your view, both are speaking truly. How can they rationally disagree? They aren't peers anymore? This makes epistemic peerhood impossible across different practical situations."

  *   **Concede:** They are not epistemic peers in the full sense.
  *   **Hold:** Peerhood requires similarity in both evidence *and* epistemic position (which includes stakes).
  *   **2-Minute Reply:** "Epistemic peerhood is not just about shared data; it's about shared epistemic position. If your practical environment demands more of you, your epistemic position is different. They shouldn't disagree about the *facts*; they should agree that the *evidence* is the same but the *requirements* differ. The disagreement is not about the world, but about the license to act. This explains why they don't fight: they acknowledge the stakes difference."
  *   **Soft Spot:** It feels like an ad hoc redefinition of "peer" to save the theory.

  ### 9. The Evidence Nature Objector (Technical Threat)
  **Objection:** "You claim evidence is fixed, but the *need* for evidence changes. But justification is a relation between evidence and proposition. If the relation changes strength without the relata changing, what is doing the work? You're positing a magical variable 'Stakes' that tweaks the justification relation. What is the mechanism?"

  *   **Concede:** The mechanism is normative, not causal.
  *   **Hold:** Justification is inherently teleological (aimed at action/truth).
  *   **2-Minute Reply:** "The mechanism is the *purpose* of justification. Justification isn't just a static fit; it's a license to believe/act. If the purpose of the license is to guide action safely, then the risk of the action logically constrains the license. It's not magic; it's functional. A driver's license requires a higher test for a bus than a sedan, even if the driver is the same. The 'mechanism' is the regulatory goal of the status."
  *   **Soft Spot:** Analogies to licenses are pragmatic, not epistemic. Critics will demand an *epistemic* mechanism.

  ### 10. The Retraction Objector (Temporal Threat)
  **Objection:** "Suppose the Manager signs off, nothing happens, and later she learns the stakes were actually lower than she thought (e.g., the safety net was stronger). Does she retroactively *know* at the time she signed? If knowledge is stakes-sensitive, it seems to fluctuate with her changing beliefs about stakes. This makes knowledge unstable."

  *   **Concede:** Knowledge ascriptions are time-relative.
  *   **Hold:** We evaluate knowledge based on the stakes *at the time of action*.
  *   **2-Minute Reply:** "We don't say she 'retroactively knew.' We say she was in a position where knowledge was unavailable *then*. Later, we might say 'She had enough evidence,' but strictly speaking, at $t_1$, she lacked the status required for $t_1$ stakes. Knowledge is a status relative to a time and a situation. This isn't instability; it's indexicality, similar to 'It is raining here.'"
  *   **Soft Spot:** Makes knowledge highly transient, which undermines its value as a stable cognitive achievement.

  ---

  ### THE "HOPE NOBODY ASKS" OBJECTION

  **The Objection:** "You argue that stakes affect the *justification threshold*. But justification is supposed to be truth-conducive. If you raise the threshold because stakes are high, aren't you admitting that in low-stakes cases, we count people as 'knowing' even when their evidence *wouldn't be good enough* for the truth to matter? You are essentially saying that in low-stakes environments, we allow *epistemic negligence* to count as knowledge. You are lowering the standard for truth-tracking just because nothing bad happens if we're wrong."

  **Why It Is Dangerous:**
  This strikes at the *moderation* of your view. If you admit that low-stakes knowledge allows for weaker truth-connection, you concede that your view sacrifices the primary value of knowledge (truth) for pragmatic convenience. It makes "Knowledge" in low-stakes cases a second-class citizen, potentially indistinguishable from lucky true belief. It undermines the claim that *all* instances of your view are genuine knowledge.

  **Best Available Answer:**
  "I am not lowering the standard for truth-tracking; I am calibrating the standard of *assurance*. In low-stakes cases, the evidence *is* sufficient to track truth *for the purposes at hand*. We do not require absolute certainty for everyday knowledge. The 'negligence' charge assumes the goal is maximal truth-avoidance of error at all costs. But the goal of knowledge is successful navigation of the world. If the evidence suffices for successful navigation in low stakes, it suffices for knowledge. The threshold isn't arbitrary; it's relative to the *risk of error* acceptable in that domain."

  **Candid Assessment:**
  *   **Survival Status:** Bruised but standing.
  *   **Retreat Option:** If this objection lands hard, retreat from "Knowledge" to "Epistemic Justification for Action." Admit that 'Knowledge' might be the wrong label for the low-stakes end of the spectrum if it implies a uniform truth-connection.
  *   **Final Verdict:** The Moderate view survives only if you successfully argue that "Truth-Conductiveness" is not a binary switch but a gradient that interacts with "Risk." If the audience holds that Knowledge must be *invariant* in its truth-connection, you will lose the Invariantists and the Truth-Conductivity Objectors. Be prepared to concede that your view redefines the *value* of knowledge, not just its extension.
