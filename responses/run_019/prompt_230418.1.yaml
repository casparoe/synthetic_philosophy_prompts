      *   *Second Tension:* **Holism vs. Individualism (C2 vs. C5).** The "Human Story" vs. "Actual Persons."
      *   *Third Tension:* **Obligation vs. Badness (C4 vs. C1).** If no one is wronged by not being born (C4), how is it a catastrophe that no one is born (C1)? Usually, "catastrophe" implies harm or loss of good. If it's not harm to individuals, it must be impersonal loss. C5 denies impersonal loss.

      *Refining the Ranking:*
