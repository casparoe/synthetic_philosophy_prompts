      *   *C3 vs. C5:* C3 says the cure is less valuable in the extinction scenario. C5 says value is anchored in actual persons. The actual persons (saved patients) are identical in both scenarios. So why is the value different? This looks like a direct contradiction between "Actualist Value" and "Future-Dependent Value."
      *   *C6 vs. C5:* C6 says activities get point from a future that *won't* exist. C5 says value is anchored in *actual* experiences. If the future doesn't exist, how can it anchor the point of current activities without violating C5?
