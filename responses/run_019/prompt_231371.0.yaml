answer: |-
  The argument fails because Premise (1) is false, as it erroneously defines wronging strictly in comparative terms, ignoring that individuals can be wronged by rights violations or unjust treatment even when an act is necessary for their existence and leaves them with a life worth living.

  Premise (1) conflates *harming* (making someone worse off than they would otherwise be) with *wronging* (violating a moral duty or right owed to someone). By rejecting this equivalence, you can maintain that an act wrongs a person if it violates a right they hold, regardless of whether the act was a necessary condition of their existence or whether they are comparatively worse off than in the non-existence counterfactual. This revision solves the future generations case directly: a high-emissions policy can wrong future people by violating their right to a safe environment or by imposing unjustifiable risks, even if that specific policy caused them to exist and their lives remain worth living. For the historical injustice case, rejecting (1) allows us to argue that descendants are wronged by the enduring structural inequalities or the failure of rectification stemming from the slave trade, as these violate rights owed to them as members of the moral community, independent of the causal chain of their conception.

  This is the least costly revision because it preserves the person-affecting constraint that moral wrongs must be done *to* specific individuals, avoiding the impersonal aggregation of pure utilitarianism which you wish to avoid. However, it commits you to a non-comparative, rights-based or deontological account of moral status, wherein the propriety of an action is judged not solely by its welfare outcomes for the affected party but by whether it respects the constraints and duties owed to them. This means accepting that justice claims can grounded in the violation of rights or unfair treatment even when the claimant cannot show they are worse off than they would have been under a permissible alternative.
