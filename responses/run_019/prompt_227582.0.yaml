  *   **Diagnosis:** Modal vs. Empirical + Verbal dispute on "Goal".
  *   **Hume:** Prefigures the *functional* split, not the *statistical* independence.
  *   **Progress:** Split the question. Move to Inner Alignment/Mesa-Optimization.
