answer: |-
  ### Brainstorming Formats

  1.  **Betting Market:** Students assign prices to tickets paying out in different quadrants and trade based on intel. *Pros:* Captures credence as willingness to bet. *Cons:* Trading mechanics distract from the updating logic; hard to enforce the "conditional info" constraint without explicit rules; too much time spent on market clearing rather than epistemic justification.
  2.  **Card Deduction:** Students hold cards representing possible worlds and discard them based on info. *Pros:* Fun and active. *Cons:* Hard to represent *conditional* information without ruling worlds out (conditional info shifts ratios, it doesn't eliminate worlds); difficult to visualize "probability mass" shifting between remaining options.
  3.  **Physical Probability Mass (Chip Distribution):** Students distribute a fixed number of tokens across a 2x2 grid to represent credence, physically moving them to update. *Pros:* Tangible visualization of "mass" conservation vs. ratio shifting; low math barrier (counting vs. fractions); makes the "shift" visible when no cell is eliminated. *Cons:* Can feel abstract if not grounded in a narrative.

  **Selection:** I chose **Physical Probability Mass**. It best visualizes the core Judy Benjamin tension: conservation of mass vs. shifting ratios. It allows for intuitive manipulation without calculation paralysis, and the physical act of moving chips from an "unmentioned" quadrant (Blue) to a "mentioned" one (Red) creates the visceral discomfort required for the debrief.

