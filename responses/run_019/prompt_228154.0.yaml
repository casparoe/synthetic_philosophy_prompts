  # Activity: The Cartographer's Dilemma

  ## 1. Setup and Materials

  **Room Layout:**
  *   4 Tables (one per group).
  *   Whiteboard at the front with a large 2x2 grid drawn on it.

  **Per Group (4 Students):**
  *   **1 Game Mat:** A laminated sheet with a 2x2 grid.
      *   Columns: **Red Zone** | **Blue Zone**
      *   Rows: **Forest** | **Plain**
      *   (Cells: Red Forest, Red Plain, Blue Forest, Blue Plain)
  *   **40 Identical Tokens:** Poker chips, beans, or plastic counters (all one color, e.g., white). These represent **Probability Mass**.
  *   **1 Envelope:** Containing two "Intel Cards" (sealed separately or labeled Step 1/Step 2).
  *   **1 Role Card Set:** (See below).
  *   **Scratch Paper & Pen.**

  **Instructor Materials:**
  *   Magnetic tokens for the whiteboard grid.
  *   Timer.
  *   Debrief slides/notes (optional, but board work is better).

  ## 2. Group Roles and Rules (Handout)

  **Role Cards (Cut and distribute one per student):**

  *   **The Facilitator:** Keeps the group on time. Reads the Intel Cards aloud. Ensures everyone agrees before moving chips.
  *   **The Mover:** The only person allowed to touch the chips. Moves them exactly as the group decides.
  *   **The Recorder:** Writes down the final chip count in each cell after each step. Reports the group's final numbers to the class.
  *   **The Skeptic:** Must ask "Why?" for every chip moved. If the group wants to move chips from a zone not mentioned in the Intel, the Skeptic must challenge the justification.

  **General Rules:**
  1.  **Conservation of Mass:** You start with 40 chips. You cannot add or remove chips from the mat, only move them between cells.
  2.  **Integer Constraint:** You cannot split chips. All counts must be whole numbers.
  3.  **Intel is Truth:** You must arrange the chips so the Intel Card's statement is mathematically true given your final distribution.
  4.  **No Smuggling:** You cannot assume facts not in evidence (e.g., don't assume Red and Blue are independent unless you can justify it).

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  **0:00 – 0:10 | Introduction & Setup**
  *   Divide class into 4 groups of 4. Hand out materials and roles.
  *   **Instructor Script:** "You are cartographers updating a map of probability. The chips are your credence. Total mass must always equal 40. Initially, distribute them uniformly (10 per cell)."
  *   Verify all groups have 10 chips in each of the 4 cells.

  **0:10 – 0:25 | Step 1: Standard Conditionalization (The Warm-Up)**
  *   **Action:** Groups open **Intel Card 1**.
  *   **Intel 1:** "Reliable Source: You are NOT in the Blue Plain."
  *   **Task:** Update the map.
  *   **Expected Move:** Remove all chips from Blue Plain (set to 0). Renormalize (leave others as is, but acknowledge probabilities changed). Most will just leave Red (10,10) and Blue Forest (10) alone.
  *   **Check-in:** Instructor walks around. Confirm everyone has 0 in Blue Plain.
  *   **Board Update:** Instructor mirrors this on the whiteboard.
  *   **Goal:** Build confidence. This is easy Bayes rule.

  **0:25 – 0:55 | Step 2: The Judy Benjamin Constraint (The Struggle)**
  *   **Action:** Groups open **Intel Card 2**.
  *   **Intel 2:** "New Signal: IF you are in the Red Zone, the odds of Forest vs. Plain are 3 to 1."
  *   **Task:** Update the map to satisfy this constraint.
  *   **Constraint Math:** Total Red chips = 20. To get 3:1 ratio, Red Forest needs 15, Red Plain needs 5.
  *   **The Conflict:** To get 15 in Red Forest, you must move 5 chips from Red Plain to Red Forest. *But* does this affect Blue?
      *   *Intuitive Move:* Keep Blue Forest at 10. (Total chips = 15+5+10+0 = 30? **Wait, Conservation Rule!**)
      *   *Correction for Conservation:* If they kept Blue at 10, and Red is 20, Total is 30. They started Step 2 with 30 chips on the board (since Blue Plain was ruled out).
      *   *Wait, Logic Check:* If Step 1 ruled out Blue Plain, total mass is 30.
      *   Step 2 Constraint: Red Forest : Red Plain = 3:1.
      *   Current Red: 10 Forest, 10 Plain.
      *   Target Red: 15 Forest, 5 Plain.
      *   Move: 5 chips from Red Plain to Red Forest.
      *   Blue Forest: Stays 10.
      *   Total: 15 + 5 + 10 = 30. Conservation holds.
      *   *Where is the puzzle?* The puzzle is that this move feels "safe," but formal rules might demand shifting Blue.
      *   *Modification to Force Tension:* I need to instruct half the groups to follow a "Minimal Global Change" protocol and half to follow "Preserve Unmentioned" protocol. No, that gives away the answer.
      *   *Better:* I will let them decide. Most will keep Blue fixed. Then I will challenge them.
      *   *Wait, I need the "uncomfortable realization" during the activity.*
      *   **Revised Instruction for Step 2:** "You must satisfy the Intel. However, you must also adhere to a **Principle of Minimal Disturbance**. Minimize the total number of chips you move from their Step 1 positions."
      *   **Why this creates the puzzle:**
          *   Option A (Keep Blue Fixed): Move 5 chips (Red Plain -> Red Forest). Total moves = 5.
          *   Option B (Shift Blue): Is there a way to satisfy the constraint with fewer moves? No, 5 is the minimum to fix the Red ratio.
          *   *Okay, the Judy Benjamin problem isn't about minimizing moves, it's about whether Blue *should* change.*
          *   **Let's try this:** I will give Group 1 & 2 the instruction: "Preserve the probability of the Blue Zone." I will give Group 3 & 4 the instruction: "Maximize Entropy (Spread chips as evenly as possible while satisfying Intel)."
          *   *Max Entropy Check:* Prior (Step 1): RF(10), RP(10), BF(10), BP(0).
          *   Constraint: RF = 3 * RP.
          *   Max Ent wants probabilities equal. But BP is 0 (hard constraint). So Max Ent wants RF, RP, BF equal? No, RF/RP fixed.
          *   If Max Ent tries to equalize RF, RP, BF... it might shift mass from Blue to Red or vice versa.
          *   *Actually, let's keep it simple.* Let them argue. The tension comes from the **Debrief**.
          *   *Activity Adjustment:* I will add a **"Market Price"** element. After they set their chips, I will announce I am buying tickets on "Blue Zone." Groups that kept Blue at 10 chips will feel confident. Groups that moved Blue will feel unsure.
          *   *No, too complex.*
          *   **Final Decision for Step 2:** Let them solve it freely. Most will keep Blue fixed. The "Stuckness" comes when I ask them to justify *why* Blue didn't change when the rule was only about Red. They will realize they assumed independence. Then I reveal the Formal Rule that *does* shift Blue.

  *   **0:25 – 0:45:** Groups struggle with Step 2. Instructor circulates.
      *   *Prompt for Skeptics:* "The Intel didn't mention Blue. Why did you touch Blue? Or why did you *not* touch Blue?"
  *   **0:45 – 0:55:** Groups finalize counts. Recorder writes numbers on Whiteboard.
      *   Likely Result: All groups have Blue Forest = 10. Red = 15/5.
      *   *Instructor Twist:* "Okay, everyone kept Blue fixed. That feels right. But imagine I told you that the 'Minimum Relative Entropy' rule—the standard formal tool for this—requires you to move 2 chips from Blue to Red. Who wants to defend their choice against that rule?" (This initiates the discomfort).

  **0:55 – 1:15 | Debrief & Philosophical Mapping**
  *   Discuss the divergence between intuition (Blue unchanged) and formal rules (Blue changes).
  *   Map activity moves to epistemic concepts.
  *   Final takeaway: Updating on conditionals is underdetermined.

  ## 4. The Debrief (Mapping Activity to Theory)

  **1. The Confidence (Step 1):**
  *   **Activity:** Ruling out Blue Plain.
  *   **Concept:** **Standard Conditionalization.** $P(New) = P(Old | Evidence)$.
  *   **Lesson:** When evidence eliminates worlds, the rules are clear. Mass is simply redistributed among survivors.

  **2. The Stuckness (Step 2):**
  *   **Activity:** Satisfying the 3:1 ratio in Red without touching Blue.
  *   **Concept:** **Updating on a Conditional Constraint.**
  *   **Lesson:** The evidence ($P(Forest|Red) = 3/4$) does not eliminate any worlds. It only constrains ratios *within* a subset.
  *   **The Trap:** Students likely kept Blue fixed ($P(Blue)$ unchanged).
  *   **Philosophical Point:** This assumes **Independence** between the "Red/Blue" partition and the information received. You assumed that because the info was about Red, it carries no news about Blue. This is the "Van Fraassen" intuition.

  **3. The Uncomfortable Realization:**
  *   **Activity:** When I mentioned the "Minimum Relative Entropy" (MinEnt) rule.
  *   **Concept:** **MinEnt / MaxEnt Updating.**
  *   **Lesson:** Formal epistemology often favors MinEnt. In many formulations of Judy Benjamin, MinEnt *does* shift the marginal probability of the antecedent (Red vs. Blue).
  *   **Why?** Because satisfying the constraint reduces uncertainty in the Red zone. To maximize global entropy (or minimize distance from prior), the system sometimes shifts mass toward the zone where uncertainty is now higher/lower depending on the metric.
  *   **The Punchline:** Your intuition says "Blue shouldn't change." The Formal Rule says "Blue must change to maintain structural consistency." There is no consensus on who is right.

  **4. Where Groups Landed:**
  *   **Most Groups:** Likely kept Blue fixed (Intuitive Conditionalization).
  *   **If any group moved Blue:** Ask them why. Did they feel the "map" itself changed?
  *   **Consensus:** There is no unique rational response to conditional information alone.

  ## 5. Predictable Failures & Handling

  1.  **The "Renormalization" Error:**
      *   *Failure:* Students treat "3:1 odds" as "3 parts exist, 1 part is eliminated." They set Red Plain to 0.
      *   *Handle:* The Skeptic role is crucial here. Remind them: "Odds of 3 to 1 means both are possible, just unequal. You cannot empty a cell unless Intel says 'Impossible'."
  2.  **The "Independence" Smuggle:**
      *   *Failure:* Students keep Blue fixed without realizing it's an assumption. They say "It didn't say Blue, so Blue stays."
      *   *Handle:* In the debrief, press hard on this. "If I tell you 'If it rains, the grass is wet,' does that change your credence that it's Tuesday? Maybe, maybe not. But you *made* a choice to keep it fixed. That choice is the philosophical problem."
  3.  **Math Freeze:**
      *   *Failure:* Students panic about ratios.
      *   *Handle:* Remind them: "You have 20 chips in Red. You need 3 piles of Forest for 1 pile of Plain. 4 piles total. 20 divided by 4 is 5. So 1 pile is 5 chips." Keep it to counting.
  4.  **Conservation Violation:**
      *   *Failure:* Groups add chips to reach the ratio.
      *   *Handle:* Enforce the "No Adding Chips" rule strictly. They must take from somewhere. If they take from Red Plain, fine. If they take from Blue, ask why.

  ## 6. Honest Limitation Note

  **What this activity cannot reproduce:**
  The **Pragmatics of the Source**. In the real Judy Benjamin problem, the puzzle often hinges on *why* the informant told you the conditional. (e.g., "Why did my friend tell me the odds *if* I'm in Red, unless she knows something about my location?").
  *   **In the Activity:** The Intel Cards are treated as brute facts dropped from the sky. Students don't wonder *why* the card was written.
  *   **Consequence:** This removes the Bayesian hint that the *act of telling* might correlate with the state of the world (e.g., she only sends a note about Red because she knows I'm not in Blue). The activity isolates the *logical* underdetermination, but it cannot capture the *pragmatic* reasons why we might intuitively shift (or not shift) our credences based on the sender's motives. You will need to mention this verbally in the debrief to complete the picture.
