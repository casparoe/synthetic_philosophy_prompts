  *(Self-Correction on Inference)*: Is inference *just* induction? Nyāya logic is often compared to Aristotelian syllogism but with an inductive basis for the universal premise (*vyāpti*). However, the *operation* is deductive. Calling it "basically induction" ignores the logical necessity claimed once *vyāpti* is established. I will verdict this as "Oversimplified to the point of error."

  *(Self-Correction on Testimony)*: The friend says "builds authority in from the start". Nyāya says the speaker must be known to be reliable. This is circularity avoidance. I will highlight this.

