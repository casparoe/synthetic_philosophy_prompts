      *   *Naming the Theory:* Let's call it **"Substrate-Dependent Sentientism"** or **"Biological Phenomenalism."** It posits that moral standing requires the capacity for phenomenal experience (suffering), but assumes this capacity is strictly tied to specific evolutionary biological structures (vertebrate CNS) and cannot be replicated in silico or in simpler invertebrate nervous systems.

