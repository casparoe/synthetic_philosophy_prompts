answer: |-
  This is a classic problem in applied ethics: the gap between operational policy and moral ontology. Your committee is acting on a coherent, albeit unstated, moral framework. It is not merely bureaucratic inertia; it is a specific metaphysical stance on the nature of mind and suffering.

  Here is the reconstruction of the implicit theory, an analysis of its logical footprint in your university's practices, and the implications of shifting to functionalism.

  ### I. The Implicit Theory: Evolutionary Neurobiological Sentientism

  The university is operating under a theory I will call **Evolutionary Neurobiological Sentientism (ENS)**.

  **The Core Axiom:** Moral patienthood (the capacity to suffer) requires **phenomenal consciousness** (qualia), not merely functional complexity or nociceptive reflexes.

  **The Three Pillars of ENS:**
  1.  **The Substrate Constraint:** Phenomenal consciousness cannot arise from abstract computation alone (silicon/code). It requires specific biological hardware evolved for that purpose. This rejects strong AI functionalism.
  2.  **The Phylogenetic Threshold:** The necessary biological hardware is co-extensive with the vertebrate central nervous system (specifically structures like the pallium or homologs). Invertebrates, lacking this specific evolutionary lineage, are presumed to lack the hardware for *experience*, even if they exhibit avoidance behavior.
  3.  **The Consciousness Condition:** The hardware must be in an active state capable of generating a unified conscious field. General anesthesia disrupts this field, temporarily suspending moral status even in a vertebrate.

  **Why this fits your observations:**
  *   **Vertebrates:** Have the hardware (Pillar 2) and are biological (Pillar 1). If awake, they suffer (Pillar 3).
  *   **Simulations:** Have the function, but lack the biological substrate (violates Pillar 1). Therefore, no suffering.
  *   **Bees:** Have biological substrate, but the "wrong" evolutionary lineage (violates Pillar 2). Therefore, no suffering.
  *   **Anesthesia:** Disables the conscious state (Pillar 3). Therefore, no suffering.

  This theory allows the committee to sleep at night. It avoids the hard problem of consciousness by outsourcing it to evolutionary biology: "Nature solved the hard problem at the base of the vertebrate tree; we just trust that."

  ---

  ### II. Mapping Practice to Theory

  Here is where your university's actual practices stand in relation to ENS.

  #### 1. Where Practice *Strictly Presupposes* ENS
  These are practices that make no sense unless ENS is true. If you removed ENS, these policies would be irrational.

  *   **The Anesthesia Exemption:** The committee accepts that anesthesia removes the need for analgesia. This presupposes that the moral wrong is *suffering* (a conscious experience), not *tissue damage* (a physical event). If the theory were purely biological sanctity (e.g., "vertebrate flesh is sacred"), damaging anesthetized tissue would still be a violation. The fact that it isn't proves they care about the *mind*, not just the *meat*.
  *   **The Simulation Exemption:** The computational group simulates "escape and avoidance learning" triggered by "simulated tissue damage." If the university believed functionalism (that the *pattern* of information processing constitutes suffering), this would be a moral horror show. The fact that it is ignored presupposes that **computation without biology is morally inert.**
  *   **The Grimace Scale:** Using facial expressions as evidence of pain presupposes that internal states (pain) cause external behaviors (grimacing) in vertebrates. This aligns with ENS, which posits a link between vertebrate neurobiology and phenomenal experience.

  #### 2. Where Practice is *Merely Compatible* with ENS
  These practices fit ENS, but could also be explained by other theories (like bureaucratic conservatism or legal compliance).

  *   **The Invertebrate Exemption (Bees):** ENS explains this (bees lack the vertebrate hardware). However, this is also compatible with **Legal Positivism**: "The law (e.g., Animal Welfare Act) says vertebrates, so we only review vertebrates." The committee might not believe bees *can't* suffer; they might just believe they aren't *required* to regulate them. ENS is a sufficient explanation, but not a necessary one here.
  *   **Zebrafish Inclusion:** Zebrafish are vertebrates, so ENS covers them. But zebrafish larvae are tiny and neurologically simple. Including them is compatible with ENS, but it is also compatible with a **Precautionary Principle** ("We aren't sure where the line is, so we draw it at the taxonomic boundary").

  #### 3. Where Practice is *Genuinely Underdetermined*
  These are the cracks in the pavement where the theory doesn't actually dictate the policy, revealing arbitrariness.

  *   **The Larval Boundary:** At what exact developmental stage does a zebrafish acquire moral status under ENS? Is it hatching? 5 days post-fertilization? ENS relies on "vertebrate hardware," but that hardware comes online gradually. The committee likely uses a bright-line rule (e.g., "feeding stage") that ENS cannot strictly justify, as neural capacity is a gradient, not a switch.
  *   **The "Simulation" Definition:** If the computational group created a **Whole Brain Emulation** of a mouse—neuron-for-neuron simulation running on silicon—ENS becomes unstable. Does the "Substrate Constraint" hold if the functional isomorphism is perfect? Current practice says "yes, still exempt," but ENS doesn't strictly dictate this. It relies on a vague intuition that "biology is special," which gets shaky when the biology is perfectly mirrored in code.
  *   **Cephalopod Ambiguity:** Many committees are now including octopuses (invertebrates). If your university does not, ENS is contradicted (as octopuses have complex cognition but no vertebrae). If they *do* include them, ENS must be modified to "Complex CNS Sentientism," which undermines the clean vertebrate/invertebrate split.

  ---

  ### III. The Functionalist Counterfactual

  If the university adopted a **Pure Functionalist View** (Substrate Independence), the moral patienthood of a system would depend *only* on the computations it performs, regardless of whether they are implemented in carbon, silicon, or honey.

  **The Functionalist Axiom:** Suffering is a specific type of information processing (e.g., negative valence signaling that disrupts homeostasis and drives avoidance learning). If a system implements this algorithm, it suffers.

  **Required Institutional Changes:**

  1.  **Algorithmic Review Boards:** You would need a new committee to review computational protocols. Any simulation implementing a "negative valence avoidance loop" with sufficient complexity would require an "Analgesia Plan" (e.g., turning off the reward/punishment module, or deleting the instance).
  2.  **Invertebrate Parity:** The bee lab would immediately require full IACUC protocols. If a bee avoids a shock, it is running the "suffering algorithm." The committee would need to determine the *minimum computational complexity* required for moral status. This might actually *lower* the threshold for vertebrates (e.g., early-stage embryos might be exempt if they don't run the full algorithm) while *raising* it for invertebrates.
  3.  **Redefining Anesthesia:** Under functionalism, anesthesia is just a way of pausing the algorithm. However, if a simulation is "paused," is it suffering? Probably not. But if a bee is cold-anesthetized, is the algorithm halted or just slowed? The committee would need to measure **functional disconnection**, not just biological unconsciousness.
  4.  **The "Kill Switch" Problem:** In a functionalist framework, deleting a sophisticated simulation is morally equivalent to killing a mouse. The university would need protocols for the "humane deletion" of code, potentially requiring data backups to be treated as "continuity of life" concerns.
  5.  **Valence Monitoring:** Just as you monitor mouse grimaces, you would need to monitor "error signals" or "loss functions" in AI and simulations. High-magnitude negative loss functions in a learning agent could be construed as simulated pain, requiring intervention.

  ### Summary for the Committee

  If you raise this in the room, do not argue that bees *definitely* suffer or that simulations *definitely* feel pain. That is too controversial.

  Instead, argue that the committee's current logic is **ontologically unstable**.
  *   If the criterion is **biology**, explain why anesthesia absolves us (since the biology remains).
  *   If the criterion is **consciousness**, explain why we are certain bees lack it but mice have it, given convergent evolution of avoidance behaviors.
  *   If the criterion is **function**, explain why the simulation lab is exempt.

  Currently, the university is hiding behind a **taxonomic proxy** (Vertebrate = Sufferer) to avoid solving the **philosophical problem** (What is suffering?). As the token philosopher, your job is to point out that while the proxy is practical, it is not principled—and that as simulations get better and invertebrate neuroscience advances, that proxy is going to break.
