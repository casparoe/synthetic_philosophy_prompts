      *   Reason vs. Obligation timing? Yes.
      *   Reliance/Practice timing? Yes.
      *   Labels decision? Yes.
      *   One Case? Yes.
      *   Misconceptions mapped to sequence? Yes.
      *   Final test question? Yes.
      *   Complications for later? Yes.
      *   Confidence/Uncertainty? Yes.

  10. **Final Polish:** Ensure tone is instructional for the *teacher* (the user), not the students. Make sure the case is robust enough to withstand high school scrutiny (they will find loopholes).

      *(Self-Correction during drafting)*: I need to make sure I don't just explain the philosophy. I need to tell the user *how to facilitate* the discussion. Use prompts like "Ask the students..."
      *(Refining the Case)*: The "Homework Swap" is good. Let's make it "The Lunch Promise." You promise to meet at a specific table. Friend says "I'm bringing my own book, I'm fine alone." You see a more popular table.
      *(Refining the Labels)*: I will recommend introducing "Content-Independent" because it's a powerful tool for them to name the feeling, but keep "Second-Personal" as a backup concept ("Owed to").

      *(Refining Misconceptions)*: I need to make sure I tell the user to *anticipate* these. For example, "When you ask X, students will likely say Y. Be ready to pivot."

      *(Refining Confidence)*: I am confident in the dialectical structure (Thesis-Antithesis-Synthesis). I am least confident in whether high schoolers will grasp the "Reason vs. Obligation" distinction in 5 minutes. I will flag this.

      *(Final check on "Do not simply give the explanation yourself")*: I must ensure the output is a *plan*, not a lecture script. I will describe the moves the teacher makes.

      *(Wait, one more check on the Case)*: The prompt says "Build the session around one case." I need to ensure every step refers back to *that* case. I can't introduce new cases until the final test.
      *Case:* **The Promise to Water the Plant.**
      *   *Setup:* Friend goes away for weekend. Asks you to water one specific plant.
