answer: |-
  Your suspicion that the summary you encountered is a hatchet job is well-founded, and relying on it for a PhD-level argument would be risky without significant qualification. While the description of the etiological account is broadly accurate to the literature surrounding Ruth Millikan and Larry Neander, the portrayal of the causal-role account, originally championed by Robert Cummins, suffers from caricature that obscures the actual philosophical machinery at work. To build a robust argument, you need to understand where the summary captures the consensus view and where it exploits common misunderstandings to make the etiological account appear superior by default.

  The summary gets the etiological side mostly right. The selected-effects account does define the proper function of a trait as the effect for which it was historically selected, and this historical grounding does provide a clear, non-arbitrary basis for distinguishing function from mere effect. Consequently, it handles malfunction intuitively: a trait malfunctions when it fails to perform the effect that explains its presence in the population. A heart with a blocked valve is defective because it cannot perform the pumping action that caused hearts to be selected for. However, even here, the summary is slightly glib by saying full stop, as etiological theorists face their own challenges regarding traits that have been co-opted for new uses or traits that were never selected but are maintained by drift, but for the sake of your immediate question, the summary's representation of the etiological strength regarding normativity is acceptable.

  The distortions begin in earnest when the summary addresses the causal-role account. A careful causal-role theorist would reject the claim that function is whatever a part does relative to whatever system you happen to care about without restriction. In Cummins' framework, a function is a causal contribution of a component to a capacity of the containing system, but this is always relative to a specific analytical explanation of that capacity. The summary suggests that because the account is interest-relative, it is unconstrained, implying that a heart making a thumping noise is a function just because an analyst could care about noise. A careful theorist would argue that while one could analyze the heart as a noise-maker, within the standard biological explanation of the organism as a living system, the noise does not contribute to the capacity of survival or homeostasis. Therefore, relative to the capacity that biologists are actually interested in explaining, making noise is not a function, it is merely a byproduct. The summary conflates the metaphysical possibility of assigning a function with the scientific practice of functional analysis.

  Similarly, the claim that a tumor has the function of making its host sick is a significant misrepresentation of how causal-role accounts are applied in philosophy of medicine. While a tumor certainly has a causal role, labeling this a function depends on the boundary of the system being analyzed. If the system is the host organism and the capacity is health or survival, the tumor's causal contribution is negative. Cummins-style accounts typically define dysfunction as a failure to contribute to the relevant capacity. Therefore, a careful theorist would not say the tumor has the function of making the host sick; they would say the tumor has a causal role that inhibits the functioning of the host system. The summary treats the causal-role account as if it lacks the resources to distinguish between contributions that sustain a system and those that degrade it, which is false. The distinction exists, but it is grounded in the chosen capacity of the system rather than in evolutionary history.

  The assertion that a broken heart has the function of doing nothing is perhaps the most egregious straw man in the summary. On a causal-role account, if a component is broken, it simply fails to perform the causal role required for the system's capacity. It does not acquire a new function of doing nothing. To say it has a function implies it is contributing to an explanation of a capacity, but a broken heart contributes nothing to the capacity of circulation. The summary attempts to paint the causal-role account as unable to recognize breakdown, but the account recognizes breakdown as the absence of the requisite causal contribution. The confusion arises because the etiological account has a stronger sense of normativity, implying the heart ought to pump based on history, whereas the causal-role account implies the heart ought to pump based on the requirements of the system's capacity. Both can identify the failure, but they ground the evaluation differently.

  This leads directly to the conclusion that causal-role accounts are hopeless about disease and malfunction, which is an overstatement that does not follow from the premises provided. It is true that causal-role accounts face a challenge regarding normativity, often called the problem of distinguishing function from mere causal contribution without appealing to history. However, calling this hopeless ignores decades of refinement in the literature. Philosophers like Christopher Boorse have utilized causal-role insights to develop the biostatistical theory of health, where disease is defined as a failure of functional contribution relative to species-typical design. While Boorse's view has critics, it demonstrates that causal-role resources are not hopeless for defining disease. The real difference is that etiological accounts ground the norm in the past, while causal-role accounts ground it in the current organization of the system. The summary treats the lack of historical normativity as a lack of any evaluative power, which is incorrect. A causal-role theorist can say a heart is malfunctioning because it is not contributing to circulation, even if they cannot say it is violating a historical mandate.

  For your own work, you should treat the summary as a useful heuristic for the standard objection to causal-role accounts but not as an accurate representation of the defense. The summary correctly identifies that etiological accounts have a more robust handle on normative notions of proper function and malfunction without needing to specify a system capacity explicitly. However, it unfairly suggests causal-role accounts cannot handle malfunction at all. A more nuanced view is that causal-role accounts handle malfunction well within a specified theoretical framework but struggle to justify why we choose certain capacities over others without appealing to etiology. Many contemporary philosophers argue for hybrid accounts that use etiology to fix the relevant capacities and causal-role analysis to determine current functioning. If you build an argument on the premise that causal-role accounts cannot distinguish disease from mere variation, you will be vulnerable to counterarguments from the biostatistical tradition or modern systemic accounts. You should instead frame the debate as one about the source of normativity rather than the ability to identify malfunction. The etiological account offers a historical norm, while the causal-role account offers a systemic norm, and the choice between them depends on whether you believe biological functions are essentially historical kinds or systemic capacities.
