      *   *Distortion 1 (Indiscriminate Effects):* The summary suggests *any* effect is a function (making noise). Cummins restricts functions to effects that contribute to a *capacity* of the system being analyzed. Making a thumping noise usually doesn't contribute to the organism's capacity (unless you're analyzing the organism as a sound-maker). So, a careful theorist would reject "making noise" as a function *relative to the capacity of survival/reproduction*, though it might be a function relative to the capacity of "making sounds." The summary ignores the relativity to the *capacity* being explained.
