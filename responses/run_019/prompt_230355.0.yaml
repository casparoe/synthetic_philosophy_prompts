      *   *Distortion 3 (Broken Heart):* "Broken heart has the function of doing nothing." This is a straw man. If a component is broken, it fails to contribute to the system's capacity. Cummins would say it lacks the function it once had, or its current causal role is null relative to the relevant capacity. It doesn't have a "function of doing nothing."
