  3.  **Address Requirement 1: What the Analogy Quietly Imports:**
      *   *Objective Function:* In DS, we optimize for throughput, latency, consistency. In politics, *whose* utility function? There is no global `maximize(true)`. It's contested values.
      *   *Node Interests:* Servers don't have agency. States do (bureaucracies, voters, elites). They act strategically, not just protocol-compliant.
      *   *Consistency Model:* DS aims for strong or eventual consistency. Politics often *requires* inconsistency (pluralism).
      *   *Failure Mode:* Crash/restart vs. human suffering/war.

  4.  **Address Requirement 2: Evaluating the Four Systems as Architecture:**
      *   *Switzerland:* High decentralization, direct democracy. Looks like Edge Computing / P2P. Low latency to voter, high coordination cost.
      *   *Germany:* Cooperative federalism. Fiscal equalization. Looks like a cluster with shared storage and load balancing. High consistency, lower autonomy.
