answer: |-
  You must reject step (3) by adopting a robust causal counterfactual account of implementation that requires physical states to share genuine causal similarities, which blocks gerrymandered mappings without sacrificing substrate independence.

  The triviality argument succeeds only because the mapping-based definition of implementation is too permissive, allowing an observer to impose structure on a system rather than finding structure inherent in the system's dynamics. To preserve substrate independence while avoiding pancomputationalism, you must require that a physical system implements a computation only if its physical states support the counterfactuals inherent in the computational transitions. A wall fails this test because its state changes are driven by thermodynamics rather than logical sensitivity to inputs; grouping its microstates to match a brain's pattern relies on arbitrary disjunctions that do not share causal powers. Silicon neurons pass because they are engineered to preserve specific causal dependencies, ensuring that if the input had been different, the output would have changed in the corresponding way, satisfying the stronger condition without requiring biological material.

  The cost of this rejection is metaphysical rather than biological: you must accept that computation is not purely abstract but relies on a robust theory of physical causation and the individuation of natural kinds. You are committed to the view that not all state groupings are equal; only those grounded in genuine causal cohesion count as real implementations. This avoids biological chauvinism because the constraint targets organized causal complexity, which silicon can possess, rather than organic composition, which a wall lacks. Consequently, you retain the intuition that uploading preserves the person while denying that the weather over Kansas is secretly conscious, resolving the dilemma by tightening the definition of realization rather than abandoning functionalism.
