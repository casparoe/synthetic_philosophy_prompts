      For your lede: The field isn't just bouncing between toy cases; it is struggling to square a circle. The requirement for error demands a norm; the requirement for naturalism forbids it. Until a theory shows how a physical fact can constitute a rule rather than just a regularity, the spec remains unfulfilled.

