prompt: |-
  I'm a science journalist working on a longish explainer about whether meaning can be given a purely natural explanation — the idea that a brain state or an animal's signal means what it does because of its evolutionary function (teleosemantics) or causal role, not because somebody interprets it. I've read around enough to know the standard moves (frog snapping, indicator bacteria, the disjunction problem, swampman, twin earth), and the field seems to bounce from one toy case to another without ever saying what the full job description for a theory actually is.

  Before I try to explain any particular theory to readers, I want the spec. What does a theory of content actually have to get right to count as naturalized? Give me the requirements list — the cases it has to handle (especially error: where the organisms detector fires for the wrong thing without that wrong thing becoming part of the content), the distinctions it can't collapse (reliable causation vs. representation, having content vs. having correctness conditions, natural fact vs. semantic norm), and the empirical or conceptual results it can't quietly contradict — with the case or argument behind each requirement.

  Then do the part I actually need as a journalist. Mark which requirements are non-negotiable and which are just one camp's preferences (say, that content must build up compositionally from atomic parts, or that it must be narrow/in the head). Tell me which single requirement does the most to exclude the most popular theories, and flag any pair of requirements you suspect can't be jointly satisfied — if two of them can't both be met, that's my lede.

  No reading list or citations, I need the reasoning itself. Keep it tight: hard cap of 900 words, and a table for the requirements is fine.
