      **The Spec Analysis**

      **Non-Negotiables vs. Preferences**
      The first four rows are the hard constraints. Any theory failing **Natural Grounding** isn't naturalistic; any failing **Misrepresentation**, **Normativity**, or **Determinacy** isn't a theory of *content*. It might be a theory of information or correlation, but not meaning. **Compositionality** is a preference of the "Language of Thought" camp; simple organisms have content without syntax. **Internalism** is contested by externalists who argue environment partly constitutes meaning (Twin Earth). If your explainer focuses on animal cognition, Internalism is expendable.

      **The Great Excluder**
      The single requirement that eliminates the most intuitive theories is **Misrepresentation**. Simple causal theories (State S means X because X causes S) are popular because they fit a scientific worldview. However, they fail the Disjunction Problem. If a frog's detector fires for flies and BBs, a causal theory says the content is "fly-or-BB." The frog never errors; it always gets what it represents. To save meaning, a theory must privilege some causes (flies) over others (BBs) as the *real* content, allowing the rest to count as errors. This requires adding structure (like evolutionary function) beyond simple causation, killing off naive causal accounts immediately.

      **The Lede: The Incompatible Pair**
      The story you are chasing lies in the tension between **Normativity** and **Natural Grounding**. This is the hard problem of naturalizing intentionality.

      **Natural Grounding** demands that content be constituted entirely by descriptive facts—causal histories, evolutionary selection, neural topology. These are facts about what *is* the case. **Normativity** demands that content provide conditions for correctness—facts about what *ought* to be the case (truth, accuracy).

