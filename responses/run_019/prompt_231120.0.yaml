answer: |-
  **SEMINAR PREPARATION MEMO**

  **TO:** Self
  **FROM:** [Your Name]
  **SUBJECT:** Q&A Strategy for "Dispositions as Generics" Seminar
  **AUDIENCE:** Metaphysics Group (Powers Theorists, Sparse-Property Realists) + 2 PhilSci (Measurement)
  **TOPIC:** Dissolving Finks/Masks via Generic Semantics

  ### **Strategic Context & Load-Bearing Points**

  **Audience Commitments:**
  *   **Powers Theorists:** Dispositions are real, intrinsic, causal properties. They fear semantic analyses that reduce powers to linguistic habits or Humean regularities. They prioritize *explanation* and *causation*.
  *   **Sparse-Property Realists:** Concerned with truthmakers. If "fragile" is a generic, what *ontological item* makes it true? They will resist "abundant" properties or linguistic conventions doing metaphysical work.
  *   **PhilSci (Measurement):** Concerned with operationalization. If "normal conditions" is the key, how is it measured without circularity? They want precision, not context-dependence.

  **Load-Bearing Points of My Thesis:**
  1.  **Non-Reductive Semantics:** I am analyzing the *ascription*, not necessarily denying the ontology (though I'm agnostic). I must avoid sounding like an eliminativist.
  2.  **The "Normal" Clause:** This must not be "conditions where it manifests." It must be "characteristic conditions for the kind."
  3.  **Dissolution vs. Patching:** I must show the generic framework *explains why* finks are exceptions, rather than just adding a *ceteris paribus* clause to the conditional.

  **Risk:** The audience will treat a semantic proposal as a metaphysical reduction. I need to walk the line: the semantics reveals the metaphysics, but doesn't erase it.

  ---

  ### **Q&A PREPARATION SHEET**

  #### **1. The Ontological Deflation Objection (Powers Theorists)**
  **Likely Phrasing:** "You're treating 'fragile' as a generic generalization, but aren't you just eliminating the power? If fragility is just a claim about what normally happens, where is the causal *oomph*? You've given us a description of behavior, not the property that *produces* it."
  **Reply (2 mins):** I'm not eliminating the property; I'm clarifying how we refer to it. When we say 'this glass is fragile,' we aren't stating a strict universal law; we are characterizing the object's kind. The 'oomph' is compatible with this. Think of it like 'birds fly.' This is a generic truth. It doesn't deny the aerodynamics (the causal basis); it acknowledges that ascriptions track characteristic behaviors of kinds, not exceptionless laws. My thesis is that the *logic* of disposition talk is generic, which explains why finks don't refute the ascription. The causal power can still be the truthmaker; I'm just arguing the *concept* is generic.
  **Weakness:** They will press: If the power is the truthmaker, why do we need the generic analysis? It risks looking like I'm keeping the power but hiding it in the semantics.

  #### **2. The Intrinsicness Objection (Powers/Sparse Realists)**
  **Likely Phrasing:** "Dispositions are supposed to be intrinsic. But generics are kind-relative. Whether 'birds fly' is true depends on how we carve the kind 'bird'. If fragility is a generic, doesn't that make it extrinsic, dependent on our classification scheme rather than the glass itself?"
  **Reply (2 mins):** That's a common worry, but generics track *objective* similarities, not just our labels. The 'kind' isn't arbitrary; it's grounded in the microstructure. The generic 'glass breaks when struck' is true because of the intrinsic molecular lattice of silica. The semantic form is kind-relative, but the *truth conditions* are grounded in the intrinsic base. We use kinds to access the intrinsic properties. So, the ascription is generic, but what makes it true is still largely intrinsic to the object.
  **Weakness:** If they argue that *any* reliance on kind-classification makes the property extrinsic (since kinds can be gerrymandered), I have to concede some extrinsicness, which violates standard disposition essentialism.

  #### **3. The Circularity of 'Normal' (Everyone)**
  **Likely Phrasing:** "You say finks and masks are excluded because they aren't 'normal conditions.' But how do you define 'normal' without saying 'conditions where the disposition manifests'? If 'normal' just means 'non-finkish,' you haven't solved the Simple Conditional Analysis problem; you've just renamed it."
  **Reply (2 mins):** That would be circular, but it's not what I'm claiming. 'Normal' in generics refers to *characteristic* circumstances for the kind, independent of the specific manifestation. For a glass, 'normal' means ambient temperature, standard atmospheric pressure, no sorcery. We identify these via independent scientific investigation of the kind, not by looking to see if it breaks. Finks are 'abnormal' because they involve external interferers alien to the kind's characteristic functioning, not because they prevent breaking.
  **Weakness:** This is the hardest sell. Distinguishing 'characteristic circumstances' from 'manifestation-enabling circumstances' is notoriously difficult without smuggling in the disposition.

  #### **4. The Explanatory Impotence Objection (Powers Theorists)**
  **Likely Phrasing:** "Powers explain *why* the glass broke. Generics just state *that* it usually breaks. If I ask 'Why did this glass break?', 'Because it's fragile' works. 'Because glass normally breaks' sounds like a statistical summary. You've stripped the disposition of its explanatory role."
  **Reply (2 mins):** Generics *do* support explanation. If I ask 'Why did the bird fly away?', 'Because birds fly when startled' is a valid explanation. It cites the characteristic nature of the thing. The generic ascription picks out the stable nature of the object. It explains the event by subsuming it under the object's characteristic behavior profile. It's not a mere statistical summary; it's a claim about the object's nature.
  **Weakness:** Powers theorists believe in *causal necessitation*. Generics are compatible with exceptions. If I admit exceptions are possible without the power failing, I weaken the necessitation link they cherish.

  #### **5. The Truthmaker Objection (Sparse-Property Realists)**
  **Likely Phrasing:** "If 'this glass is fragile' is a generic, what is the truthmaker? Is it a universal? A trope? Or just a Humean regularity? If you say it's the microstructure, then the microstructure is the disposition, and your semantic analysis is idle. If it's a regularity, you're a Humean."
  **Reply (2 mins):** I'm not committing to Humeanism. The truthmaker can be the categorical base (the microstructure). The generic analysis tells us how that base is *conceptualized* in disposition talk. It allows us to say the microstructure *makes it true* that the glass is fragile, without requiring that the microstructure *entails* breaking in every possible world. It separates the metaphysics (the base) from the semantics (the generic ascription).
  **Weakness:** Sparse realists want the *property* fragile to be sparse. If 'fragile' is just a generic predicate true in virtue of a microstructure, they might argue 'fragile' isn't a real property at all, just a useful label.

  #### **6. The Measurement/Operationalization Objection (PhilSci)**
  **Likely Phrasing:** "In the lab, we measure fragility by testing samples. If the definition relies on 'normal conditions,' how do we operationalize that? How do we know if a test condition is 'normal' without already knowing the disposition? This makes scientific testing circular."
  **Reply (2 mins):** Science already handles this with control groups and standard protocols. 'Normal conditions' are the standard testing protocols established for that material class. We don't need a metaphysical definition of 'normal' to run the test; we rely on intersubjective scientific practice. The generic analysis reflects this practice: we assert fragility based on standard test outcomes, acknowledging that outliers (masks) don't falsify the claim.
  **Weakness:** This concedes that 'normal' is determined by human practice/consensus, which makes the disposition somewhat mind-dependent or social, which metaphysicians hate.

  #### **7. The Fink Relocation Objection (Metaphysics General)**
  **Likely Phrasing:** "You claim this dissolves the Fink case. But in a Fink case, the object loses the disposition *before* manifestation. If 'fragile' is a generic about what normally happens, doesn't a Fink just show the generic is false? If the glass loses fragility when struck, then it's not true that 'glass normally breaks when struck' in that context."
  **Reply (2 mins):** The generic is about the *kind*, not the specific token in that specific moment. 'Glass is fragile' remains true even if *this* glass is finked. The Fink case is an interference with the token, not a refutation of the kind-generalization. The generic allows for exceptions. The Fink is an exception. The Simple Conditional Analysis failed because it was a strict conditional; the Generic Analysis succeeds because it tolerates exceptions without falsifying the ascription.
  **Weakness:** If the Fink removes the disposition *instantly*, does the object still fall under the kind 'fragile glass' at the moment of striking? If not, the generic doesn't apply. I need to ensure the kind-membership persists through the finkish alteration.

  #### **8. The Single-Case Modal Force Objection (Powers Theorists)**
  **Likely Phrasing:** "Generics are compatible with low probabilities. 'Mosquitos carry malaria' is true even if only 1% do. But if a glass is fragile, it *must* break when struck (ceteris paribus). It's not just that it 'usually' does. Your view makes dispositions too weak."
  **Reply (2 mins):** Disposition generics are a specific subclass: they are 'characteristic' generics, not 'statistical' generics. 'Salt is soluble' is closer to 'Triangles have three sides' than 'Mosquitos carry malaria.' The modal force comes from the nature of the kind, not the frequency. The generic framework captures the *defeasibility* (masks/finks) without losing the *strength* of the connection in normal cases.
  **Weakness:** Distinguishing 'characteristic' from 'statistical' generics without appealing to... powers... is difficult. I might be borrowing modal force from the very thing I'm analyzing.

  ---

  ### **THE QUESTION I HOPE NOBODY ASKS**

  **"If the generic is true in virtue of the microstructure, and the microstructure does all the causal work, isn't your generic analysis just a redundant linguistic layer that adds nothing to the metaphysics? Why should metaphysicians care about the semantics of 'fragile' if the ontology is just 'microstructure + laws'?"**

  **Why this is deadly:** It forces me to admit either:
  1.  **Redundancy:** The semantics is interesting but metaphysically idle (boring for this audience).
  2.  **Anti-Realism:** The semantics *replaces* the ontology (I become a Humean/Instrumentalist, which gets me eaten alive by the Powers group).
  3.  **Dualism:** There are both generics *and* powers (ontological bloat, violates Sparse Property realism).

  **Contingency Plan:** If asked, I must argue that the *problems* (Finks/Masks) are generated by confusing semantics with metaphysics. Therefore, clarifying the semantics *is* doing metaphysics because it dissolves the pseudo-problems that motivated the complex ontologies (like multi-track dispositions or extrinsic masks) in the first place. I must sell the "Dissolution" hard.
