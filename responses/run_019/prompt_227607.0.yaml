answer: |-
  Here is your preparation for the question period, structured by audience member and strategic priority.

  ### Part 1: Anticipated Objections & Replies

  #### 1. The Resolute-Choice CDTs (McClennen Sympathizers)
  **The Objection:**
  "You claim to dissolve the paradox, but your Step (ii) just smuggles in resolute choice while denying the label. You say the later payment isn't irrational because it honors a 'standing commitment.' That is precisely McClennen's definition of resolute choice: evaluating acts relative to a prior plan rather than myopic preferences. You haven't shown the paradox vanishes; you've just asserted that dynamic consistency is the true norm of rationality. If you admit the agent has a commitment, you admit the need for a theory to maintain it against future temptation. Why is your view technically superior to resolute choice if it yields the same action?"

  *   **Concede:** That your view is *extensionally equivalent* to resolute choice in the recommended action (paying the fare).
  *   **Hold:** That resolute choice treats the tension as real (requiring a special faculty to overcome), whereas your view treats the tension as illusory (a description error).
  *   **2-Minute Reply:**
      "Resolute choice accepts the CDT verdict that the act *itself* is suboptimal at the time of choice, requiring a 'resolution' to override it. I am arguing that if the information structure is explicit—specifically, that the rescue was conditional on the disposition—the act of paying is *instrumentally necessary* to secure the rescue, even at the later stage. The 'commitment' isn't a psychological crutch to overcome irrationality; it's a causal precondition that was already in place. Resolute choice patches the agent; I'm patching the game tree. If the game tree is correct, no resolution is needed because the act was never irrational to begin with."
  *   **Weakness:** This relies on a controversial claim about "causal preconditions" extending across time. If they argue the rescue is *past* and cannot be causally affected by the later payment, your "instrumental necessity" claim looks like magical thinking or evidential decision theory (EDT) in disguise.

  #### 2. The Parfit Scholar
  **The Objection:**
  "I worry you are fighting a strawman. Parfit doesn't argue for 'rational irrationality' as a stable solution; he argues that Self-Interest Theory (S) is *indirectly self-defeating*. In *Reasons and Persons*, the Hitchhiker case shows that S tells you to cultivate a disposition to violate S. Parfit's point is a *reductio* of S, not a defense of the disposition as 'rational' in a unified sense. By framing this as a puzzle about information structure, you miss Parfit's dialectical goal: to show that S fails as a comprehensive theory. You are solving a decision-theoretic puzzle Parfit used to break a moral theory."

  *   **Concede:** That Parfit's ultimate goal was to critique Self-Interest Theory, not to perfect decision theory.
  *   **Hold:** That the *mechanism* of the critique relies on the coherence of "rational irrationality," which your argument undermines.
  *   **2-Minute Reply:**
      "I accept Parfit's goal was to critique S. But the force of that critique depends on the coherence of the intermediate step: that it is rational to adopt a disposition to act irrationally. If my argument holds—that 'irrational action' here is a misdescription due to hidden information—then S is not indirectly self-defeating; it is just confused about its own act-evaluation. If the act isn't irrational, S doesn't defeat itself. So, even if Parfit's target was S, my argument removes the weapon he uses against it. The textual aim doesn't save the logical mechanism."
  *   **Weakness:** Parfit might agree that S is confused but insist the *phenomenon* (needing a disposition to survive) remains, regardless of whether we label the act "irrational." You risk getting bogged down in semantics about "irrationality" vs. "suboptimal."

  #### 3. The Graduate Students (Technical/Information Focus)
  **The Objection:**
  "Your Step (i) says the paradox requires reliable detection. But in the standard formulation, the driver predicts based on *past* behavior or physical signs, not a direct read of the current disposition. If the prediction happens *before* the passenger forms the intention to pay or not, doesn't that create a Newcomb-like problem where CDT and EDT diverge? If you treat it as a standard causal chain, aren't you ignoring the evidential correlation that makes the disposition valuable in the first place?"

  *   **Concede:** That the timing of the prediction is crucial and often underspecified in the literature.
  *   **Hold:** That even with Newcomb-like correlations, the expected utility calculation (Step iii) absorbs the "irrationality."
  *   **2-Minute Reply:**
      "If the prediction is based on past traces, it becomes a standard signaling problem. The 'irrationality' of paying later is just the cost of maintaining a credible signal. If the correlation is strong enough, CDT agents will pay to maintain reputation or because they view their choice as evidence of their type. In neither case do we need a category of 'rational irrationality.' We either have standard causal instrumentalism (if detection is imperfect) or a breakdown of the act/state independence (if Newcomblike). In both cases, the specific paradox of 'rational irrationality' dissolves into standard decision-theoretic categories."
  *   **Weakness:** If they press that CDT *specifically* says not to pay in Newcomb problems (where EDT says pay), you might be forced to admit your solution requires abandoning CDT, which alienates the first group of audience members.

  ---

  ### Part 2: Strategic Assessment

  #### The Single Most Dangerous Objection
  **The Parfit Scholar's Textual Correction.**
  **Why:** Your thesis rests on attributing a specific view ("Rational Irrationality") to Parfit. If the Scholar demonstrates that Parfit explicitly distinguishes between the *rationality of the disposition* and the *irrationality of the act*, and that Parfit *embraces* this tension to show the failure of Self-Interest Theory, your claim that the tension "dissolves" looks like a misunderstanding of Parfit's project. If Parfit *intended* to show that rationality is fragmented, showing it is unified doesn't refute him; it just changes the subject. You risk appearing to solve a problem Parfit didn't think had a solution, rather than engaging with his actual argument.

  #### The Point to Defend at Length
  **Step (i): The Information Structure Requirement.**
  **Why:** This is the technical engine of your argument. If you cannot rigorously define *how* the driver detects the disposition and *when* relative to the passenger's choice, the rest of the argument collapses. The audience will probe whether the detection is causal, evidential, or logical. You must be prepared to draw the game tree on the board and show exactly where the information set closes. If you are vague here, the Resolute Choice theorists will fill the gap with their own machinery, and the Students will find formal inconsistencies.

  ---

  ### Part 3: Critical Flag on Parfit's Position

  **Potential Misattribution:**
  You must be careful not to conflate **Parfit's Hitchhiker** with **Gauthier's Constrained Maximization**.

  *   **The Risk:** Parfit discusses the Hitchhiker in *Reasons and Persons* (Chapters 1 & 2) primarily to argue that **Self-Interest Theory (S) is indirectly self-defeating**. He argues S tells you to *not* be an S-agent. He does not necessarily endorse the "irrational" act as rational in a broader sense; he uses it to show S is incoherent.
  *   **Gauthier's View:** Gauthier (in *Morals by Agreement*) uses similar cases to argue for **Constrained Maximization**, claiming it is *rationally required* to be disposed to cooperate. This is closer to your "Rational Irrationality" framing.
  *   **The Fix:** In your opening remarks or when addressing the Scholar, clarify: *"I am using 'Parfit's treatment' to refer to the argument in R&P regarding the indirect self-defeat of Self-Interest Theory. My claim is that even on Parfit's own description, the 'irrationality' of the act relies on an information equivocation."*
  *   **Why this matters:** If the Scholar catches you attributing Gauthier's positive normative conclusion to Parfit's skeptical diagnostic argument, you will lose credibility immediately. Parfit is often read as saying, "Look how broken S is," whereas you are arguing, "Look how broken the description of the case is." Ensure this distinction is clear.
