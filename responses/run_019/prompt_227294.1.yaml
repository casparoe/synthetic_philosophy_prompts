  Hi there,

  It is completely understandable that you feel stuck on this argument because it is a very sophisticated version of what is known in the literature as Galen Strawson's Basic Argument, augmented with an epistemic self-defeat reductio. Your classmate has constructed a dilemma that forces you to choose between accepting a skeptical conclusion about responsibility or rejecting the premise that defines responsibility in terms of ultimate sourcehood. The intuition that something is off in the move from step six to step seven is worth examining, but most philosophers who wish to preserve moral responsibility will tell you that the real heavy lifter here is premise one. If you want to save moral responsibility, you generally have to reject the claim that being morally responsible requires being an ultimate source in the metaphysical sense described. The reason premise one looks so compelling in the first place is that it taps into a deep intuition about fairness, specifically the idea that it is unjust to blame or praise someone for factors entirely outside their control. It feels wrong to hold someone accountable for their genetics or their upbringing, and since those factors inevitably shape who we are, premise one seems to capture a necessary condition for just accountability.

  However, rejecting premise one comes with a significant cost, which is exactly what your seminar is likely exploring. When compatibilists, such as Frankfurt-style theorists or reasons-responsive compatibilists, deny premise one, they are giving up the notion of responsibility as basic desert. They are admitting that we are not metaphysically ultimate origins of our actions in the way libertarians might hope. Instead, they redefine responsibility in terms of whether an agent's actions align with their深层 desires or whether they are responsive to reasons. For example, a Frankfurt-style case tries to show that you can be responsible for an action even if you could not have done otherwise, provided the action issued from your own will without external coercion. By rejecting premise one, you save the practice of blaming and praising, but you have to accept that this practice is not grounded in a deep, metaphysical freedom from the past. You are essentially arguing that responsibility is a functional role within a social and moral community rather than a metaphysical status requiring an uncaused cause.

  On the other hand, if you feel that premise one is undeniable, then you are pushed toward the incompatibilist position, which requires you to confront steps seven and eight. Your hesitation about the move from six to seven is interesting because it questions the symmetry between moral and epistemic responsibility. It feels off because belief seems involuntary in a way action does not, yet we still hold people epistemically responsible for negligence or sloppy reasoning. If you accept step seven, you are conceding that no one is epistemically responsible for their beliefs in the ultimate sense. The crucial move for an incompatibilist here is to reject step eight rather than step one. They would argue that an argument's soundness does not depend on the metaphysical responsibility of the believer. Even if no one is ultimately responsible for being persuaded by the argument, the argument can still be true and rational to accept. The cost of this position is swallowing a kind of skepticism about praise and blame. Incompatibilists who accept step seven have to admit that they are not ultimately praiseworthy for believing the truth, nor are their opponents blameworthy for believing falsehoods, but they maintain that this does not undermine the truth of the claims themselves. They separate the normative force of reasons from the metaphysical status of the agent.

  If you were to focus your rejection on the move from six to seven to avoid the reductio, you would need to argue that epistemic responsibility does not require the same ultimate sourcehood as moral responsibility. This might sound ad hoc, as you noted, but you could ground it in the different aims of the two domains. Moral responsibility is often tied to fairness and desert, which might require control, whereas epistemic responsibility is tied to truth and justification, which might only require proper functioning of cognitive faculties regardless of their origin. However, this is a harder sell because if the basic argument works for actions, it seems to work for the mental states that produce actions too. Ultimately, the most standard philosophical response to this specific line of reasoning is to reject premise one. This allows you to maintain that people are responsible for their actions and beliefs in a meaningful sense without requiring them to be uncaused causes. The cost is accepting that our responsibility is compatible with determinism and that our character is ultimately shaped by luck, but that our capacity to respond to reasons in the present moment is sufficient for the kinds of responsibility that matter in ethics and law.

  So, while your intuition about the epistemic move is sharp, the most robust place to intervene if you want to preserve responsibility is at the very beginning by challenging the definition of ultimate sourcehood. If you reject premise one, you avoid the skeptical conclusion entirely and do not need to worry about the self-defeat scenario. If you keep premise one, you must become a skeptic about responsibility and deny that the lack of responsibility defeats the argument's truth, which is a harder position to maintain in a seminar focused on free will. I would suggest looking closely at why premise one seems necessary and whether the compatibilist redefinitions of responsibility actually fail to capture what matters when we hold someone accountable. That is where the real philosophical work lies, rather than in the symmetry between moral and epistemic domains.

  Best of luck with the seminar.
