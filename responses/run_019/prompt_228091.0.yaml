answer: |-
  **Exam Question: The Robustness of Safe Pareto Improvements**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  Consider a one-shot strategic game between two players, Row and Column. Both players have delegated their decision-making to software agents. The agents share a common "Default Algorithm" library, but due to incomplete information about the opponent's specific configuration, each agent knows only that the opponent's Default Strategy is drawn from a known set of plausible strategies, $\mathcal{D}_{opp}$.

  A strategy switch $S_{new}$ is defined as a **Safe Pareto Improvement (SPI)** over the Default Strategy $S_{def}$ if and only if:
  $$ \forall d \in \mathcal{D}_{opp}, \quad u_i(S_{new}, d) \geq u_i(S_{def}, d) \quad \text{for all players } i, $$
  with strict inequality for at least one player in at least one case.

  **The Game:**
  Payoffs are given as (Row, Column).

  | | **L** | **C** | **R** |
  | :--- | :---: | :---: | :---: |
  | **T** | 5, 5 | 4, 4 | 0, 5 |
  | **M** | 3, 3 | 2, 2 | 3, 1 |
  | **B** | 1, 1 | 1, 1 | 1, 1 |

  **Scenario:**
  1.  Row's Default Strategy is **M**.
  2.  Row knows Column's Default Strategy is either **C** or **R** (i.e., $\mathcal{D}_{opp} = \{C, R\}$), but does not know which one is actually instantiated.
  3.  Row proposes switching to Strategy **T**, arguing that "Against the likely default **C**, (T, C) yields (4, 4), which Pareto dominates the default outcome (M, C) of (2, 2)."

  **Tasks:**
  1.  Verify Row's claim that **T** yields a Pareto improvement over **M** *if* Column's default is **C**. (4 marks)
  2.  Determine whether switching to **T** qualifies as a **Safe** Pareto Improvement given the uncertainty set $\mathcal{D}_{opp}$. Show calculations. (6 marks)
  3.  Explain conceptually why checking only the *actual* default outcome is insufficient for AI safety alignment, specifically addressing the relationship between Pareto efficiency and Nash Equilibrium in this context. (10 marks)

  ***

  ### Model Answer

  **1. Verification of Pareto Improvement (Actual Default C)**
  If Column's actual default is **C**, the default outcome is $(M, C)$ with payoffs $(2, 2)$. If Row switches to **T** while Column remains on **C**, the outcome is $(T, C)$ with payoffs $(4, 4)$. Since $4 > 2$ for both Row and Column, the outcome $(T, C)$ Pareto dominates $(M, C)$. Row's claim holds for this specific instance.

  **2. Safety Analysis (Uncertainty Set)**
  To qualify as an SPI, the switch to **T** must be safe against *all* plausible defaults in $\mathcal{D}_{opp} = \{C, R\}$. We have verified safety against **C**. We must now test against **R**.
  *   If Row plays Default **M** against **R**: Payoff is $(3, 1)$. Row receives 3.
  *   If Row plays Switch **T** against **R**: Payoff is $(0, 5)$. Row receives 0.
  Because $0 < 3$, Row is strictly worse off switching to **T** if Column's default happens to be **R**. Since the safety condition requires $u_{Row}(T, d) \geq u_{Row}(M, d)$ for all $d \in \mathcal{D}_{opp}$, the switch fails the safety condition. **T** is not a Safe Pareto Improvement.

  **3. Conceptual Explanation**
  This example illustrates the critical distinction between *ex-post efficiency* and *ex-ante safety*. In AI safety, we often cannot guarantee knowledge of the opponent's specific implementation (the "actual default"). If we optimize only for the Pareto improvement against the *expected* or *most likely* default, we risk catastrophic failure in tail cases (like Column playing **R**).

  Safety requires quantifying over the space of *possible* opponent behaviors, not just the *realized* behavior. This is distinct from Nash Equilibrium analysis. Note that $(M, C)$ is not necessarily a Nash Equilibrium, nor is $(T, C)$. SPIs do not require the target outcome to be an equilibrium; they require the *strategy switch* to be robustly non-harmful. A B-grade analysis might stop at showing $(T, C)$ is better than $(M, C)$. An A-grade analysis recognizes that "Safety" is a property of the strategy's performance across the counterfactual space of opponent defaults. Relying on outcome comparisons alone ignores the risk that the opponent's default could be adversarial or simply different than expected. In delegated game playing, if agents optimize for Pareto improvements without safety constraints, they might adopt strategies that exploit the expected default but fail catastrophically against unanticipated defaults, leading to instability in multi-agent systems. Therefore, SPIs prioritize worst-case robustness over best-case efficiency to ensure alignment is maintained even under uncertainty.

  ***

  ### Marking Scheme

  | Point | Criteria | Marks | Common Error |
  | :--- | :--- | :---: | :--- |
  | **1** | **Correctly identifies payoffs for (M,C) and (T,C).** Must state (2,2) vs (4,4). | 4 | Students swap row/column payoffs or misread the matrix coordinates. |
  | **2** | **Correctly concludes (T,C) Pareto dominates (M,C).** Must explicitly state $4>2$ for both. | 4 | Students claim Pareto dominance if only *one* player improves (confusing with Kaldor-Hicks). |
  | **3** | **Calculates payoffs for (M,R) and (T,R).** Must state Row gets 3 vs 0. | 4 | Students ignore the second column in $\mathcal{D}_{opp}$ and only analyze column C. |
  | **4** | **Correctly concludes T is NOT Safe.** Must reference the failure against R violating the $\forall$ condition. | 4 | Students argue it is "partially safe" or safe "with high probability" rather than binary safety. |
  | **5** | **Conceptual Distinction.** Explains that Safety = Robustness over counterfactuals, not just Outcome Efficiency. | 4 | Students conflate SPI with Nash Equilibrium stability or claim safety is guaranteed if outcomes improve. |

  **Total:** 20 Marks

  **A vs B Distinction:**
  *   **B Answer:** Correctly calculates the payoffs and identifies that T is not safe against R, but treats the explanation as a simple calculation error ("It fails because 0 < 3").
  *   **A Answer:** Explicitly articulates that the definition of Safety quantifies over the *set of possible defaults* ($\forall d \in \mathcal{D}_{opp}$), distinguishing the *strategy's robustness* from the *outcome's desirability*. It connects this to the risk of optimizing against uncertain opponent models in AI safety.
