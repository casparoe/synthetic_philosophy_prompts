  # Shop Notes

  **Product Criticisms Encoded:**
  *   **Trolley Kit:** Encodes the criticism that vivid, emotionally charged framing overrides abstract moral principles (framing effects).
  *   **Mandarin Box:** Encodes the complaint that the scenario resists functionalist re-description by isolating the homunculus (resistance to alternative description).
  *   **Mary's Room:** Encodes the charge that the experiment begs the question by defining knowledge in a way that excludes physicalism (pre-loaded definitions).
  *   **Experience Machine:** Encodes the objection that the setup pre-loads a bias against hedonism by constraining the user's ability to value authenticity (constrained choice).

  **Least Fair Jab:**
  The claim that the conclusion is "already loaded" and merely awaits ratification is the least fair. Defenders argue that thought experiments often produce genuine puzzlement or conflicting intuitions, rather than automatic agreement. Philosophers frequently struggle with these cases rather than accepting them effortlessly.

  **Undermining Defense:**
  The satire assumes intuitions are used as foundational proofs. However, if thought experiments are viewed as tools for achieving "reflective equilibrium"—where intuitions are provisional data points revised against theory—the "engineering" is merely hypothesis testing. If the goal is coherence rather than immediate revelation, the "pump" is a legitimate methodological starting point, not a manipulative trick.
