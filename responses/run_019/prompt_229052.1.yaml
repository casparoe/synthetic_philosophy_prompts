      *   *Side B's Position:* We need to recover the *appearance* and *usage* of probability. Even if all branches exist, an agent *before* the split faces subjective uncertainty about which branch they will experience (or simply needs to make decisions). DW shows that if you want to maximize utility, you act *as if* the Born rule is true.
