  # Seminar Handout: Epistemic Attitudes Toward Number-Theoretic Heuristics

  **Course:** Philosophy of Mathematics  
  **Topic:** Non-Deductive Evidence & Probabilistic Models (Cramér, Hardy–Littlewood, etc.)  
  **Goal:** Distinguish coherent philosophical positions regarding heuristic evidence.

  ## Part I: The Diagnostic Decision Tree

  Answer the following questions in order. Follow the arrows to find your epistemic position. (Note: "Credence" refers to a rational degree of belief between 0 and 1.)

  **Q1. Logical Credence:**  
  Can a mathematical statement that is necessarily true or false (e.g., the Twin Prime Conjecture) rationally bear a credence strictly between 0 and 1 *before* it is proved?  
  ├─ **No** → Go to **Q2**.  
  └─ **Yes** → Go to **Q3**.

  **Q2. Heuristic Utility (For "No" at Q1):**  
  If heuristics cannot change the probability of truth, do they still provide rational reasons to prioritize a conjecture for proof?  
  ├─ **No** → **[Position A: Radical Skeptic]** *(See Part III)*  
  └─ **Yes** → **[Position B: Deductive Purist]** *(See Part II)*

  **Q3. Model Ontology (For "Yes" at Q1):**  
  When we treat primes as random variables (e.g., Cramér's model), is this randomness a feature of the *numbers themselves* or a feature of *human ignorance*?  
  ├─ **Feature of the Numbers** → Go to **Q4**.  
  └─ **Feature of Ignorance** → Go to **Q5**.

  **Q4. Inductive Transfer (For "Feature of Numbers"):**  
  If the model correctly predicts 20 phenomena, does the 21st prediction inherit warrant *because* the model tracks reality?  
  ├─ **No** → **[Position C: Incoherent Realist]** *(See Part III)*  
  └─ **Yes** → **[Position D: Ontic Probabilist]** *(See Part II)*

  **Q5. Failure Sensitivity (For "Feature of Ignorance"):**  
  When a model fails (e.g., Maier's theorem on short intervals), does confidence drop in *all* the model's predictions or only those structurally linked to the failure?  
  ├─ **All Predictions (Global)** → Go to **Q6**.  
  └─ **Linked Predictions Only (Local)** → **[Position E: Structural Fallibilist]** *(See Part II)*

  **Q6. Assertability (For "Global" at Q5):**  
  Is it legitimate to assert a conjecture as "true" in a paper based solely on heuristic evidence, without a deductive proof?  
  ├─ **No** → **[Position F: Pragmatic Instrumentalist]** *(See Part II)*  
  └─ **Yes** → **[Position G: Epistemic Bayesian]** *(See Part II)*

  ---

  ## Part II: The Occupied Positions (Leaves)

  | Position | Core Commitment | The Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **B. Deductive Purist** | Heuristics are psychological aids only; proof is the sole warrant for truth. | Must explain why mathematicians' calibrated confidence tracks truth so well if heuristics confer *no* epistemic weight. |
  | **D. Ontic Probabilist** | Primes possess inherent stochastic properties; heuristics describe objective chances. | Must explain how objective chance exists in a deterministic structure without collapsing into metaphysical mystery. |
  | **E. Structural Fallibilist** | Heuristics reveal structural dependencies; failures are local, not global. | Must define "structural linkage" precisely enough to explain why Maier's theorem doesn't kill Twin Primes, without smuggling in proof. |
  | **F. Pragmatic Instrumentalist** | Heuristics are useful fictions for prioritization; assertability requires proof. | Must explain why we feel *surprised* when a high-confidence heuristic fails, if we never believed it was likely true. |
  | **G. Epistemic Bayesian** | Heuristics update rational credence; assertability tracks high probability, not just proof. | Must explain how logical omniscience is avoided without admitting that mathematical truths can be "probably false." |

  ### A Note on Indistinguishable Attitudes
  Students often find themselves split between **Position F (Pragmatic Instrumentalist)** and **Position B (Deductive Purist)**. Both answer "No" to Assertability and deny that heuristics change the *truth* status.
  *   **The Difference:** The **Purist** views heuristics as merely pedagogical or motivational (reasons to *work*). The **Instrumentalist** views heuristics as functional tools for resource allocation in a broader scientific practice (reasons to *fund*). If you answer every diagnostic question the same way but feel differently, ask yourself: *Is the heuristic serving the logic of discovery (Purist) or the economy of research (Instrumentalist)?*

  ---

  ## Part III: Unoccupied & Incoherent Combinations

  | Position | Diagnostic Path | Diagnosis |
  | :--- | :--- | :--- |
  | **A. Radical Skeptic** | No Credence → No Utility | **Unattractive Neglect.** This view renders heuristic practice irrational. It is logically possible but historically unoccupied by practicing mathematicians. |
  | **C. Incoherent Realist** | Real Randomness → No Inductive Transfer | **Incoherence.** If the randomness is ontic (a feature of reality), past success *must* warrant future predictions via inference to the best explanation. Denying this contradicts the realist premise. |

  ---

  ## Part IV: Supplementary Diagnostic Questions

  *Use these to refine your position if you feel stuck between two leaves.*

  **Q7. Explanatory Power:**  
  Does a successful heuristic argument explain *why* a conjecture is true, or merely suggest *that* it is true?  
  *(Realists tend toward "Why"; Bayesians tend toward "That".)*

  **Q8. Independence Presumption:**  
  When we assume divisibility conditions at different primes are independent, are we describing a lack of causal connection or a lack of known connection?  
  *(Ontic Probabilists say "Causal"; Structural Fallibilists say "Known".)*

  ---
  *Printed for Philosophy of Mathematics Seminar | [Term/Year]*
