answer: |-
  This is a remarkably precise diagnosis of a persistent impasse in political philosophy. You have correctly identified that the debate often cycles because the participants are arguing from incommensurable starting points while pretending to argue about the same object.

  To answer your question directly: This is not primarily an empirical disagreement, nor is it merely verbal. It is a **foundational disagreement about normative ontology**, specifically concerning the moral status of the state and the unit of moral concern. The "baseline" issue you identified is a symptom of this deeper ontological clash.

  Here is a breakdown of what kind of disagreement this is, why the baseline hypothesis is only partially correct, and what would actually count as progress.

  ### 1. The Diagnosis: Normative Ontology, Not Just Baselines

  Your hypothesis is that the dispute is about the baseline (freedom of movement vs. bounded community). This is accurate as a description of the *structure* of the argument, but it does not explain the *cause* of the divergence. Baselines are not chosen arbitrarily; they are derived from deeper commitments about what political institutions *are*.

  *   **The Open-Borders Ontology:** Treats the state as a **administrative utility**. On this view, states are instrumental constructs designed to serve human interests. Since human interests are universal, the default position is global access. Restrictions are akin to feudal barriers or caste systems. The moral unit is the *individual human*.
  *   **The Exclusionist Ontology:** Treats the state as a **ethical community**. On this view, the state is constitutive of identity, trust, and reciprocal obligation. It is more like a family or a marriage than a hotel. The boundaries are not just lines on a map but the perimeter of a shared project of self-determination. The moral unit is the *citizen-in-relation*.

  Therefore, the disagreement is **categorial**. When the exclusionist says "self-determination," they mean the capacity of a specific *demos* to shape its own culture and economy. When the open-borders advocate hears "self-determination," they often hear "collective selfishness" or "group rights trumping individual rights." They are using the same vocabulary to describe different moral objects.

  ### 2. Why It Is Not Empirical or Verbal

  *   **Not Empirical:** As you noted, both sides grant the harms. Even if we knew exactly what open borders would do to wages (say, a 2% drop for low-skilled natives), the debate would persist. The exclusionist would say, "We have a right to protect our worst-off from that 2%." The open-borders advocate would say, "A 2% loss for some does not justify the total exclusion of the desperate." The empirical data cannot resolve the weighting of competing moral claims.
  *   **Not Merely Verbal:** While terms like "coercion" are contested, the contestation is substantive. For the statist, coercion is legitimate when authorized by the democratic will of the bounded community. For the cosmopolitan, coercion is illegitimate unless justified to those coerced. This is not a dictionary dispute; it is a dispute over the source of political legitimacy.

  ### 3. The Role of Analogy (The "Data" of Comparison)

  You asked if it is a difference about which comparisons count as data. This is perhaps the most fertile ground for understanding the stalemate. The debate is driven by **competing analogies**:

  *   **The Club Analogy (Exclusionist):** A state is like a private club. Members pay dues (taxes), follow rules, and have the right to vote on new members. (Critique: You can quit a club; you cannot easily quit a state, and birth into a club is arbitrary).
  *   **The Neighborhood Analogy (Open-Borders):** A state is like a neighborhood in a city. You have property rights inside your house, but you cannot fence off the public streets to prevent others from walking through. (Critique: Neighborhoods don't provide welfare states or collective security in the way states do).
  *   **The Condominium Analogy (Hybrid):** We have private units (individual rights) but shared structural interests (the building's integrity).

  Progress is stalled because each side insists their analogy is the master key. The exclusionist insists the state is unique (sui generis) and cannot be compared to marriage or clubs without loss of fidelity. The open-borders side insists the state is just a large-scale governance structure and must be judged by universal standards.

  ### 4. What Counts as Progress?

  If the disagreement is bedrock (impartialist vs. partialist intuitions), we should not expect convergence on the abstract principle. Therefore, "progress" cannot mean one side winning the theoretical argument. Progress must be **pragmatic, institutional, or transitional.**

  Here are four specific avenues for progress:

  **A. Shift from Ideal to Non-Ideal Theory**
  Most of the stalemate occurs in *ideal theory* (What is the just state of affairs?). Progress lies in *non-ideal theory* (Given the current unjust world, what is the next best step?).
  *   *Example:* Instead of arguing for "Open Borders" vs. "Closed Borders," argue for "Freedom of Movement vs. Freedom of Settlement." One might grant a right to enter and work (economic access) without granting a right to permanent citizenship or political franchise (political membership). This splits the difference between the economic needs of migrants and the political self-determination of citizens.

  **B. The "Compensation" Model**
  If the exclusionist is right that migration imposes costs on the domestic worst-off, and the open-borders side is right that exclusion harms the foreign worst-off, progress lies in **mechanisms of compensation**.
  *   *Example:* A "visa tax" or migration tariff where the gains from migration (remittances, economic growth) are explicitly taxed to fund domestic welfare programs for those negatively impacted by migration. This acknowledges the legitimacy of the exclusionist's concern (protecting the vulnerable) while accepting the open-borders premise (movement creates value).

  **C. Distinguishing "Rights" from "Claims"**
  Progress may come from downgrading the open-borders claim from a *human right* (trumping all else) to a *prima facie claim* (weighty but defeasible).
  *   *Example:* Joseph Carens (a leading open-borders theorist) eventually conceded that states might restrict entry to protect specific, robust welfare state institutions, provided the restrictions are minimal and necessary. Conversely, exclusionists like Christopher Wellman concede a duty to admit refugees. Mapping the specific *thresholds* where exclusion becomes impermissible is more productive than arguing about the general right.

  **D. Institutional Innovation over Moral Assertion**
  Stop arguing about whether the state *should* have a right to exclude, and argue about *how* it excludes.
  *   *Example:* The current baseline is militarized enforcement and deportation. A progressive baseline might be "managed openness" with guest worker programs, circular migration, and regional free movement zones (like ECOWAS or the EU). This moves the debate from "Can we stop them?" to "How do we integrate flow?"

  ### Conclusion

  The disagreement is a **bedrock conflict between cosmopolitan impartialism and statist partialism**, manifested as a dispute over the burden of proof. Because these are foundational intuitions, they are unlikely to be "argued out" in the traditional sense.

  Therefore, the only viable path to progress is to **bypass the foundational question.** We should treat the right to exclude not as a binary switch (on/off) but as a **dimmer switch** subject to strict scrutiny.

  The most productive question is no longer "Do states have a right to exclude?" but rather: **"Under what specific, empirically verifiable conditions does the harm of exclusion outweigh the harm of inclusion, and what institutional mechanisms can mitigate the latter?"** This reframes the debate from a clash of first principles to a problem of institutional design and risk management, where convergence is actually possible.
