  4.  **Categorize the Disagreement (Addressing "What kind of disagreement is this?"):**
      *   *Empirical?* No. Both sides acknowledge uncertainty but assume worst-case/best-case scenarios that align with their priors. Empirical data rarely settles normative weight.
      *   *Verbal?* No. "Coercion" and "Self-determination" are contested, but not merely semantically. They represent competing conceptions of political legitimacy.
      *   *Analogical?* Yes, significantly. Is the state like a club? A family? A neighborhood? A prison? The choice of analogy dictates the conclusion.
      *   *Bedrock/Foundational?* Yes. This is the strongest candidate. It's about the *unit of moral concern* (individual vs. community) and the *nature of political legitimacy* (consent of governed within bounds vs. consent of all affected).
      *   *Structural/Institutional?* It's about how we conceive the function of the state (protective association vs. distributive agency).

  5.  **Develop the Diagnosis:**
      *   It's a **Foundational Normative Disagreement masked as a Burden-of-Proof Dispute.**
      *   The "Baseline" is a symptom, not the disease. The disease is the conflict between *Global Egalitarianism/Cosmopolitanism* and *Political Realism/Statism*.
      *   It is also a **Disagreement about the Site of Justice.** Is justice primarily global or domestic?

  6.  **Determine Paths to Progress (Addressing "What would count as progress?"):**
      *   If it's bedrock, convergence is unlikely. So, what counts as progress?
      *   *Reframing:* Move from "Open vs. Closed" to "Degrees of Openness" or "Compensation."
      *   *Institutional Design:* Focus on *how* to manage migration rather than *if*. (e.g., Guest worker programs, visa markets, regional free movement).
