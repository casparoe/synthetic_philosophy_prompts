  Subject: Prep for the talk

  Hey, I know you are feeling the pressure on this one, and honestly, that is a sign you are taking the stakes seriously, which is good. Your advisor is warning you because the view is controversial, but controversial is how you get a job in this market if you can defend it well. The two-currency view is bold, and it cuts right against the grain of the room you are walking into, so you need to be ready for the specific ways they will try to carve you up. I have put together a run-through of the objections you are most likely to face, ordered by how much damage they could do to your specific argument, phrased the way these people actually talk in Q&A rather than how they write in papers. I have also included what you should concede, where you need to dig in, a reply you can deliver in about two minutes, and a honest note on where the armor is thin. I will wrap up with the question you are dreading, the one I suspect you know is coming but hope to avoid.

  The first and most dangerous objection will come from your decision theorist, the hard functionalist. They are not going to ask about the coin; they are going to attack the architecture of your view. They will likely lean into the mic and say something like, you are positing a ghost in the machine, because if a state doesn't guide action in a standard way, why call it credence at all. You need to concede up front that functionalism is the standard view and that normally credence and betting quotients align. What you must hold no matter what is that self-locating belief cases are non-standard environments where the functional role fractures. Your two-minute reply should be that credence is meant to track truth conditions while betting quotients track expected utility, and in cases with memory erasure, the expected utility calculation includes a multiplier for the number of times the bet is accepted, whereas the truth condition does not. You argue that severing the link preserves the truth-tracking role of credence even if it sacrifices the action-guiding role in this specific context. The soft spot here is that it looks ad hoc, like you are changing the definition of credence just to save the halfer intuition, so be prepared to emphasize that this fracture is a feature of the case, not a feature of your definition.

  The second most likely attack comes from the two faculty members who are committed thirders working on self-locating belief. They will not bother with the betting stuff initially; they will go for the epistemic core. One of them will probably say, you are ignoring the indexical fact that she is awake now, which is new evidence that shifts the probability. You should concede that waking up feels like new information and that it eliminates the possibility that it is Tuesday and the coin was tails. What you must hold is that this elimination is not probabilistically relevant to the hypothesis about the coin toss itself. Your reply is that while she learns she is not in a specific centered world, the uncentered proposition about the coin remains unchanged because the protocol guarantees she wakes up regardless of the outcome. You need to stress that the halfer position maintains the connection between the coin mechanics and the credence, whereas the thirder position conflates the frequency of awakenings with the probability of the coin. The weakness here is purely intuitive; the thirder position has a very strong pull on people's immediate judgments, so do not try to bully the intuition, just explain why the intuition is misleading in this specific setup.

  The third objection will likely come from the grad students or perhaps the decision theorist again, focusing on the Dutch Book argument. They will say, if you are a halfer who bets at even odds, you are vulnerable to a money pump, and that is just irrational. You need to concede gracefully that Beauty will lose money in the long run if she bets according to your view. What you must hold is that losing money in this specific setup is not a marker of irrationality because the betting protocol is exploiting the duplication of the agent. Your reply is that a Dutch Book only demonstrates irrationality when the bets are offered in distinct, identifiable states, but here the agent is forced to make the same decision in subjectively indistinguishable states, so the loss is a tax on the experimental design, not a failure of rationality. The soft spot is that most philosophers accept vulnerability to a Dutch Book as a definitive proof of irrationality, so you need to be very clear that the standard Dutch Book theorem assumptions are violated here.

  The fourth objection comes from the philosopher of probability who thinks the case is underdescribed. They might interrupt to say that we cannot determine the answer without knowing the exact betting protocol or the utility function. You should concede that precise formalization matters for decision-theoretic outcomes. What you must hold is that the epistemic question about credence is robust across different variations of the case. Your reply is that while betting outcomes vary with protocol, the core epistemic intuition that she learns nothing about the coin remains constant, and that is what your talk is defending. The weakness here is that if you get bogged down in technical details about the protocol, you lose the room, so keep the answer high-level and pivot back to the epistemic core.

  Now, here is the question you are hoping nobody asks, because I know you suspect it is the killer. The decision theorist is going to wait until the end, when you are tired, and ask, if credence does not guide action, then what is the normative role of credence, and why should we care about this number you are preserving. This is dangerous because it attacks the utility of your entire project. If credence does not guide action, it risks becoming an epiphenomenal ghost that does no work in our theory of mind. You need to be ready to say that credence guides assertion and theoretical reasoning even if it does not guide betting in this specific case, and that preserving the link between credence and truth is more important than preserving the link between credence and betting in pathological cases. Do not let them force you into a corner where you admit credence does nothing.

  You have six weeks to rehearse this, and the key is to own the view without sounding defensive. Your advisor is worried because this is a fight, but you have prepared for the fight. Read this out loud, get the timing of those two-minute replies down, and remember that you do not need to convince the committed thirders, you just need to show that your view is a live option that handles the objections seriously. You are going to do fine.
