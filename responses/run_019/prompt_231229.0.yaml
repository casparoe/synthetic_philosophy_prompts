answer: |-
  # Activity: The Committee Market

  **Learning Objective:** To viscerally demonstrate the pragmatic consequences of intransitive preferences via a money-pump mechanism, distinguishing between *exploitability* (losing resources) and *irrationality* (violating a norm), and to isolate the diachronic element of the argument.

  **Class Size:** 14 Students
  **Time:** 75 Minutes
  **Materials:**
  *   14 "Executive Agent" folders (manila folders or envelopes).
  *   Inside each folder: 3 "Sub-Agent" voting cards (pre-printed, see below), 1 "Preference Record" sheet, 3 distinct candy bars (or equivalent value tokens/chips redeemable for points). Label them **Option A**, **Option B**, **Option C**.
  *   A bowl of "Fee Tokens" (poker chips, distinct candies, or printed tickets).
  *   Whiteboard for tracking aggregate losses.

  ## 1. Roles and Setup

  *   **The Executive Agents (14 Students):** Each student represents a single decision-making entity composed of three conflicting "Sub-Agents."
  *   **The Market Maker (Instructor):** You play the role of the trader/pump. You facilitate swaps and collect fees.
  *   **The Auditors (2 Students, selected mid-game):** Their job is to count tokens at the end. (Rotated to keep everyone engaged).

  **The Sub-Agent Cards (Pre-printed):**
  To guarantee intransitivity without relying on idiosyncratic taste, use a Condorcet Cycle structure. Every student gets the same three cards:
  *   *Sub-Agent 1:* Prefers A > B > C
  *   *Sub-Agent 2:* Prefers B > C > A
  *   *Sub-Agent 3:* Prefers C > A > B
  *   *Rule:* The Executive Agent must follow Majority Rule for pairwise choices. (Result: A>B, B>C, C>A).

  ## 2. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute folders. Explain the "Committee Mind" framing. Do not mention transitivity or money pumps. Frame it as "Organizational Decision Making." |
  | **10-25** | **Preference Formation** | Students vote internally using Sub-Agent cards. They record their "Corporate Preference" on the sheet (A>B, B>C, C>A). |
  | **25-30** | **Endowment** | Distribute Option A candy/tokens to all. Explain the "Market Fee" (1 token per trade) as a bureaucratic processing cost. |
  | **30-55** | **The Market** | Instructor circulates. Offers trades based on recorded preferences. Collects fees. Students trade until they feel "satisfied" or time ends. |
  | **55-65** | **The Audit** | Count remaining assets. Calculate net loss compared to start. Write total class loss on board. |
  | **65-75** | **Debrief** | Connect game to philosophical argument. Address the friend's objection. |

  ## 3. Game Rules & Mechanics

  ### Phase 1: The Committee Vote (10-25 min)
  1.  Tell students: *"You are an Executive Agent. You have three departments (Sub-Agents) with conflicting interests. You must aggregate their preferences via Majority Rule to determine the organization's stance."*
  2.  Students compare A vs B, B vs C, and C vs A using the cards.
  3.  They record the result. **Crucial:** Walk around and verify every student has recorded a cycle (A>B, B>C, C>A). If a student claims a tie, break it arbitrarily or have them draw a card. *Everyone must have a cycle to participate in the pump.*
  4.  **Secrecy:** Tell them not to discuss their results with neighbors. This is "proprietary corporate strategy."

  ### Phase 2: The Market (30-55 min)
  1.  **Endowment:** Every student holds **Option A**.
  2.  **The Fee:** Place a bowl of Fee Tokens in the center. To swap one Option for another, a student must deposit 1 Fee Token into the bowl. (Ensure the fee is small relative to the value of the Options, e.g., 1 chip vs. a full candy bar, so it seems negligible).
  3.  **The Pitch:** You (Instructor) approach students individually.
      *   *Script:* "I see your record shows you prefer B to A. I have a B available. Would you like to upgrade? There's a small processing fee."
      *   If they swap, they now hold B. You collect 1 fee.
      *   Wait 2 minutes. Return. "I see you prefer C to B. I have a C available. Upgrade?"
      *   If they swap, they now hold C. You collect 1 fee.
      *   Wait 2 minutes. Return. "I see you prefer A to C. I have an A available. Upgrade?"
  4.  **Freedom:** Students are *not forced* to trade. They can say "No." However, remind them: *"Your goal is to hold your most preferred option. Currently, you hold an option you voted as inferior."*
  5.  **Termination:** The market closes at minute 55. Students keep whatever Option they hold + any remaining Fee Tokens they started with (give them 5 fee tokens initially as "working capital").

  ### Phase 3: The Audit (55-65 min)
  1.  Select two students as Auditors.
  2.  **Baseline:** Ask: "Who started with Option A?" (All hands). "Who started with 5 Fee Tokens?" (All hands).
  3.  **Final Count:** "Who ended with Option A?" (Some will). "How many Fee Tokens do you have left?"
  4.  **The Reveal:** Calculate the loss.
      *   If a student cycled once (A->B->C->A), they have Option A (same as start) but 2 fewer Fee Tokens.
      *   Ask: "Did anyone improve their position?" (No, they are back at A).
      *   Ask: "Did anyone lose resources?" (Yes, the fees).
      *   Write the **Total Class Loss** on the board in big numbers.

  ## 4. Troubleshooting: Predictable Failures

  **Failure 1: The "Smart" Student Refuses to Trade.**
  *   *Prediction:* One or two students realize the trap after the first swap and refuse the second.
  *   *Handling:* Do not scold them. Use them in the debrief. "Why did you stop?" They will say "I saw the cycle." Ask the rest of the class: "Why didn't you see it? Was their rationality different, or was their vigilance different?" This highlights that avoiding the pump requires *monitoring*, not just preference.
  *   *Prevention:* Frame the fee as "negligible administrative overhead" rather than a "cost." Use very small tokens (e.g., paper slips) so the loss feels abstract until the count.

  **Failure 2: Students Treat it as a Joke.**
  *   *Prediction:* They trade rapidly just to see what happens, ignoring the fees.
  *   *Handling:* Make the stakes real. Use high-quality candy or actual course points (e.g., 0.5% bonus grade at stake). If they treat it lightly, the loss won't sting.
  *   *Correction:* Pause the game if laughter erupts. "Please treat this as a resource allocation simulation. Your final holdings determine your payout."

  **Failure 3: Preferences aren't actually intransitive.**
  *   *Prediction:* A student ignores the Sub-Agent cards and uses their own taste (e.g., they hate Chocolate, so A>B>C regardless of the cards).
  *   *Handling:* This is why the **Sub-Agent Cards** are mandatory. Frame it as "Role-Playing." You are not trading for *yourself*; you are trading for the *Committee*. If they break character, they are "fired" (excluded from the final payout). This isolates the *structural* problem from *substantive* taste.

  ## 5. The Debrief (65-75 min)

  *Do not lecture immediately. Ask questions to draw the distinction out.*

  **Step 1: The Phenomenology of Loss**
  *   "Look at the board. We destroyed value. No one is happier, and we have fewer tokens. Who feels responsible for that loss?"
  *   "Did you make a mistake *in the moment*? When you traded A for B, was that wrong?" (Students will say: "No, I preferred B.")
  *   "When you traded B for C, was that wrong?" ("No, preferred C.")
  *   "So how did a series of 'right' choices lead to a 'wrong' outcome?"

  **Step 2: Addressing the Friend's Objection (Exploitability vs. Irrationality)**
  *   *Instructor:* "A philosopher friend of mine argues this game proves nothing about rationality. She says it only proves you can be bullied. She says: 'Maybe I just like trading. Maybe the fee was the price of excitement. Maybe my preferences changed.'"
  *   *Question to Class:* "How would you answer her? Did you *like* paying the fee?" (Usually: No).
  *   *Question:* "Did your preferences change?" (No, we used the cards).
  *   *Point:* This isolates **Exploitability**. The game proves that *if* you have these preferences *and* you act on them locally *and* you don't pre-commit, you *will* lose.
  *   *The Hard Question:* "Does losing money make you irrational? Or does it just make you poor?"
      *   *Guide them here:* If you know you will be pumped, but you still trade, *that* is irrational. If you didn't know, you were just ignorant.
      *   *The Transitivity Link:* Transitivity isn't just about logic; it's a **protective norm**. It prevents you from entering situations where your future self will betray your current self.

  **Step 3: Diachronic Rationality**
  *   "The pump works over time. If you had to choose the whole sequence at once (A vs A-3-fees), you wouldn't do it. The problem is **myopia**."
  *   "Transitivity forces you to view your choices as a *path*, not just points."

  ## 6. Limitations: What You Must Supply

  *Be honest with the class. This activity cannot do the heavy philosophical lifting alone.*

  **Instructor's Closing Note (The "Honest Caveat"):**
  "This game shows **pragmatic inconsistency**. It shows that intransitive preferences are *costly* in a dynamic environment. But it does not strictly prove **logical incoherence**."

  "You must supply two premises in your essays that this game cannot prove:
  1.  **The Dominance Principle:** You *ought* to prefer more money/resources to less, all else equal. (A student could argue they value 'trading freedom' over tokens).
  2.  **Preference Stability:** The argument assumes your preferences (A>B) hold at time 1, time 2, and time 3. If you are allowed to say 'I prefer B to A *now*, but I know later I'll regret it,' you can avoid the pump without fixing the preferences. This is called **Resolute Choice**."

  "My friend is right that the pump doesn't *force* you to change your preferences. You could instead change your **decision rule** (e.g., 'I will never trade back to an option I previously held'). But notice: adopting that rule is effectively *simulating* transitivity. So, even if you reject transitivity as a logical law, you might need it as a practical heuristic to stop yourself from being eaten."

  **Final Takeaway:** "The money pump doesn't prove your preferences are nonsense. It proves they are dangerous without a diachronic strategy. Rationality might not be about having perfect preferences, but about managing the ones you have over time."
