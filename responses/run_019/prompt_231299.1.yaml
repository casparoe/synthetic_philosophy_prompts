          *   **Nuance:** For Popper, "metaphysical" wasn't an insult. It meant "foundational." But he did initially suggest it lacked the testability of physics.
          *   **Verdict:** Mostly fair, but needs context on what "metaphysical" meant to Popper (not "nonsense").

      *   *Claim 3: He put it in the same bucket as Marxism and psychoanalysis.*
