answer: |-
  Here is a diagnostic quiz designed for your workshop. It focuses on concrete scenarios where the definitions of corruption diverge. The options are phrased to capture the *reasoning* behind the judgment, not just the verdict.

  ### **The "What Counts as Corruption?" Diagnostic Quiz**

  **Instructions:** Read each scenario. Choose the single statement that best reflects your personal judgment of the act described. Do not choose what you think the law says; choose what *you* believe constitutes corruption.

  **1. The Nephew's Job**
  A City Department Head hires his nephew for an entry-level clerical role. The civil service manual does not forbid hiring relatives, provided they meet minimum qualifications. The nephew is qualified, but three other applicants had slightly higher test scores.
  *   **A.** Not corruption. The rules allow it, and family support is a normal part of life.
  *   **B.** Corruption. It undermines public trust in the hiring system, even if legal.
  *   **C.** Corruption. It gives the nephew an unfair structural advantage over strangers.

  **2. The Funeral Envelope**
  At a local councilor's father's funeral, a developer who has pending zoning requests places a thick cash envelope in the condolence book. This is a known local custom for funerals, but the amount is five times the usual contribution.
  *   **A.** Not corruption. It follows a community custom; judging it by outside standards is unfair.
  *   **B.** Corruption. It creates an obligation that compromises the councilor's future decisions.
  *   **C.** Corruption. It allows wealth to buy access to officials under the guise of tradition.

  **3. The Speedy Permit**
  A small business owner donates the maximum legal amount to a Mayor's campaign. Two months later, their building permit is processed in three days, while similar permits take three weeks. The Mayor did not explicitly order the fast-tracking.
  *   **A.** Not corruption. Both the donation and the processing time were within official guidelines.
  *   **B.** Corruption. It creates a two-tier system where donors get better public service.
  *   **C.** Corruption. It erodes confidence that the government serves everyone equally.

  **4. The Nurse's Gift**
  After a successful surgery, a patient's family gives the lead nurse a $200 gift card. Hospital policy forbids gifts over $50, but the nurse argues it was a spontaneous gesture of gratitude, not a bribe for future care.
  *   **A.** Not corruption. It was a genuine thank-you within a human relationship, not a transaction.
  *   **B.** Corruption. It violates the rule designed to keep care impartial.
  *   **C.** Corruption. It pressures other families to pay for better attention next time.

  **5. The Off-the-Clock Advice**
  A retired city planner, now working as a private consultant, answers a former colleague's phone call for 10 minutes to explain a complex zoning code. She does not charge for the call. The code is public, but difficult to interpret.
  *   **A.** Not corruption. Helping a former colleague is professional courtesy, not a bribe.
  *   **B.** Corruption. It gives the colleague's clients an advantage over those who can't call a retired planner.
  *   **C.** Corruption. She is monetizing her public reputation for private gain, even if this call was free.

  **6. The School Supply Donation**
  A wealthy parent donates new computers to a public school, on the condition they are installed in their own child's classroom. The school is underfunded and needs the computers. There is no rule against earmarking donations.
  *   **A.** Not corruption. The school gets resources it needs; the parent is helping their community.
  *   **B.** Corruption. It diverts public resources to benefit a specific private interest.
  *   **C.** Corruption. It entrenches inequality between rich and poor students in the same school.

  **7. The Emergency Contract**
  During a water main break, a city manager awards a repair contract to a friend's company without bidding, citing "emergency discretion." The price is fair, but the friend's company is not the cheapest available.
  *   **A.** Not corruption. The manager used legitimate discretion to solve a public problem quickly.
  *   **B.** Corruption. Emergency powers should not be used to bypass competition for friends.
  *   **C.** Corruption. It normalizes a system where only insiders get lucrative government work.

  **8. The Campaign Lunch**
  A city councilor holds a "town hall" at a local restaurant. Attendees must buy a $50 ticket to enter, which goes to the councilor's campaign fund. Policy allows fundraising, but the event is advertised as a public meeting.
  *   **A.** Not corruption. Fundraising is legal, and anyone can choose to buy a ticket.
  *   **B.** Corruption. It turns access to elected officials into a commodity only some can afford.
  *   **C.** Corruption. It confuses public duty with private fundraising, harming trust.

  ***

  ### **Scoring Key & Position Mapping**

  Tally how many times the participant selected **A**, **B**, and **C**. Then, look at the *pattern* of their choices to determine their primary position.

  #### **1. The Legalist (Rule-Based)**
  *   **Pattern:** High count of **A**, but *only* on scenarios where rules are explicitly cited as "allowed" or "within guidelines" (Questions 1, 3, 6, 8).
  *   **Logic:** Corruption is a binary legal status. If the handbook permits it, it is at worst "bad judgment," not corruption. They will switch to B or C if a scenario explicitly states a rule was broken (e.g., Question 4).
  *   **Workshop Role:** Ensures the group doesn't chase ghosts; keeps focus on enforceable violations.

  #### **2. The Relational (Particularist)**
  *   **Pattern:** High count of **A**, specifically on scenarios emphasizing **social bonds, customs, or intent** (Questions 2, 4, 5).
  *   **Logic:** Context matters. An act between strangers might be a bribe, but between community members or family, it is a gift or duty. They reject "outside standards" imposed on local norms.
  *   **Workshop Role:** Reminds the group that social cohesion matters; warns against destroying community trust in the name of abstract rules.

  #### **3. The Public Interest (Consequentialist)**
  *   **Pattern:** High count of **B**.
  *   **Logic:** Corruption is about **harm to the public trust or service**. It doesn't matter if it's legal (Legalist) or customary (Relational); if it makes the government work worse or erodes confidence, it is corruption.
  *   **Workshop Role:** Focuses the group on outcomes and tangible harm to citizens.

  #### **4. The Universalist (Egalitarian)**
  *   **Pattern:** High count of **C**.
  *   **Logic:** Corruption is about **systemic inequality**. Even if the public service isn't harmed (e.g., the permit was valid), if the process entrenches privilege or creates a two-tier system, it is corruption.
  *   **Workshop Role:** Pushes the group to look at long-term structural fairness rather than just immediate cases.

  #### **5. The Pragmatist (Emergent 5th Position)**
  *   **Pattern:** Inconsistent answers, often choosing **A** on "Emergency/Discretion" cases (Q7) but **C** on "Wealth" cases (Q6). Or, they express frustration in the margins that "nothing changes."
  *   **Logic:** Corruption is unavoidable friction. Some favor-swapping is necessary to get things done (Q7), but excessive inequality (Q6) is dangerous. They judge based on *necessity* rather than principle.
  *   **Workshop Role:** The reality check. They know what is theoretically right vs. what is operationally possible.

  ***

  ### **Limitations & Analysis for the Facilitator**

  **1. The Legalist vs. Relational Overlap**
  This quiz cannot fully separate Legalists from Relationalists based on score alone, because both groups frequently select **Option A** ("Not Corruption").
  *   **How to distinguish:** You must look at *which* questions they picked A on.
      *   If they picked A on Q1 (Nephew/Rules) but B on Q2 (Funeral/Custom), they are **Legalists**.
      *   If they picked A on Q2 (Funeral/Custom) but B on Q1 (Nephew/Rules), they are **Relationalists**.
      *   *Note:* If a participant picks A on everything, they are likely disengaged or a "Hard Relationalist" who believes community norms supersede all external rules.

  **2. The Public Interest vs. Universalist Blur**
  Options **B** and **C** are both accusations of corruption. In many scenarios (like Q3 or Q8), the distinction between "harming trust" (B) and "entrenching inequality" (C) is semantic.
  *   **Result:** You will likely find many participants score as a hybrid **Public Interest/Universalist**. This is not a failure of the quiz; in practice, these two positions often form a coalition against the Legalist/Relational bloc.
  *   **No Real Defenders:** A pattern of selecting **C** on *every* question (including Q4, the Nurse's Gift) is rare. Very few people view a small gratitude gift to a nurse as "structural inequality." If someone scores all C, they may be using the quiz to signal virtue rather than engage with the cases.

  **3. The "Intent" Blind Spot**
  None of the four positions fully captures the **Intent-Based** view (i.e., "It's only corruption if there was a *quid pro quo* agreement").
  *   **Where it hides:** Intent-based thinkers will often score as **Legalists** (because intent is hard to prove without rules) or **Pragmatists** (because they know intent is murky).
  *   **Workshop Tip:** If a participant argues "But did they *agree* to swap favors?" during the discussion, note that this is a fifth, unstated position that often stalls investigations.

  **4. The "Harmless Corruption" Gap**
  The quiz assumes corruption is negative. It does not account for the view that some corruption is **efficient** (e.g., greasing the wheels to bypass red tape).
  *   **Observation:** If a participant argues that Q7 (Emergency Contract) was *good* because the water was fixed fast, they hold a **Functionalist** view. This quiz forces them to label it "Not Corruption" (A) rather than "Good Corruption," which might frustrate them. Be prepared to ask them directly: "Is this corruption that was necessary, or not corruption at all?"
