answer: |-
  ### 1. The Procedure: Protocol L-2h

  **Objective:** Assign a credence (0–1) to a deterministic claim within a 2-hour budget, treating computational effort as evidence.

  1.  **Set the Base Rate.** Identify the reference class for this claim type (e.g., "critical path modules," "cryptographic protocols"). Assign a prior probability $P_0$ based on historical failure rates in this class. **[JUDGMENT: Selecting the reference class determines the anchor; do not default to 0.5.]** If no history exists, set $P_0 = 0.5$ but flag for senior review.
  2.  **Execute Bounded Compute.** Run available verification tools (static analyzers, solvers, fuzzers) for a fixed time $t$ (e.g., 30 minutes). Record outcome $E$ (Pass/Fail/Timeout). Note the coverage metric $C$ (e.g., % lines covered, search depth reached). **[JUDGMENT: Estimating coverage $C$ is subjective; document the tool's known blind spots.]**
  3.  **Calculate Evidence Weight.** Compute the update factor $W$. If tools pass, $W = C \times K$, where $K$ is a tool reliability constant (default 0.8). If tools fail, $W = -1.0$ (claim rejected). Update credence: $P_{new} = P_0 + (1 - P_0) \times W$. **[JUDGMENT: Setting $K$ assumes tool correctness; adjust down for known unsound tools.]**
  4.  **Allocate Next Hour.** Compare marginal gain of further compute vs. expert review. If $C < 0.8$ and tools timed out, allocate time to scaling compute. If $C > 0.8$ but $P_{new} < 0.95$, allocate time to manual audit of high-complexity regions. **[JUDGMENT: Defining "high-complexity" relies on cyclomatic complexity thresholds which may not match logical difficulty.]**
  5.  **Stop Condition.** Stop if: (a) Time budget expires, (b) $P_{new} > 0.99$ (requires proof artifact), or (c) $P_{new} < 0.1$ (claim rejected). If stopping due to time, report $P_{final}$ with a "Computational Gap" warning. **Do not round $P_{final}$ to 1.0 without a formal proof certificate.**

  ### 2. Plain-Language Rationale

  This protocol operationalizes the concept of logical uncertainty. In standard probability, a statement is either true or false. In engineering safety, we act before knowing the truth. Therefore, probability here measures "confidence given limited compute," not "frequency in possible worlds." Step 1 prevents the common error of ignoring base rates. Engineers often treat every claim as unique; this step forces you to acknowledge that similar claims have failed historically. The judgment call here is critical: choosing a generous reference class inflates safety artificially.

  Step 2 and 3 treat computation as evidence. Running a solver for 10 minutes doesn't prove correctness, but it eliminates a subset of possible errors. The coverage metric $C$ quantifies how much of the "search space" you have eliminated. The rationale for not rounding to 1.0 (Step 5) is the core logical induction principle: a finite reasoner cannot be logically omniscient. Just because you haven't found a bug doesn't mean the code is bug-free. Rounding to 0.999 implies you have ruled out all errors, which you haven't. This prevents the "false certainty" that leads to catastrophic deployment failures.

  Step 4 optimizes the budget. Logical induction suggests that credences should improve as compute increases. This step directs that compute where it reduces uncertainty most. If the tool barely scanned the code, more compute helps. If the tool scanned everything but the logic is opaque, human expertise is the only remaining evidence source. Finally, the stop condition protects against infinite loops. You must ship a number. The "Computational Gap" warning alerts downstream users that this credence is budget-constrained, not truth-constrained. This preserves the norm that unresolved logical claims are treated like empirical uncertainty: manageable, but never zero-risk.

  ### 3. Worked Applications

  **Case 1: The Spec Claim.**
  *Claim:* "The sorting module satisfies monotonicity on every input."
  *Step 1:* Reference class: "Verified utility functions." Historical failure rate 5%. $P_0 = 0.95$.
  *Step 2:* Run model checker for 30 mins. Passes. Coverage $C = 0.90$ (all branches hit).
  *Step 3:* $W = 0.9 \times 0.8 = 0.72$. $P_{new} = 0.95 + (0.05 \times 0.72) = 0.986$.
  *Step 4:* $C$ is high, but $P_{new} < 0.99$. Recommendation: 1 hour manual audit of edge cases (empty input, overflow).
  *Outcome:* Audit finds no issues. Stop. Report 0.99. Warning: No formal proof certificate attached.

  **Case 2: The Exploit Claim (The Annoyance).**
  *Claim:* "No bounded attacker finds an exploit in this protocol within one week."
  *Step 1:* Reference class: "Novel cryptographic handshakes." Historical failure rate 40%. $P_0 = 0.60$.
  *Step 2:* Run automated fuzzer for 30 mins. No exploits found. Coverage $C = 0.70$ (state space is huge).
  *Step 3:* $W = 0.7 \times 0.8 = 0.56$. $P_{new} = 0.60 + (0.40 \times 0.56) = 0.824$.
  *Step 4:* $C$ is low. Recommendation: Scale compute (cloud fuzzing) for next hour.
  *Step 5:* After 1 hour, $C$ reaches 0.85. $P_{new}$ rises to 0.88. Time expires.
  *Reviewer Frustration:* The reviewer wants to report 0.999 because "we threw a lot of compute at it and found nothing." The procedure forces reporting 0.88.
  *Rationale:* The state space is exponential. 0.88 reflects that 12% of the logical space remains unexplored. Rounding to 0.999 would imply near-certainty, inviting complacency. The procedure forces the reviewer to acknowledge the residual logical risk.

  **Case 3: The Lemma Claim.**
  *Claim:* "Lemma 4 follows from Axioms 1–3 in the safety case."
  *Step 1:* Reference class: "Hand-written proof steps." Failure rate 10%. $P_0 = 0.90$.
  *Step 2:* Run proof assistant (Coq/Isabelle) for 30 mins. Timeout (search depth exceeded). Coverage $C = 0.50$ (partial tree).
  *Step 3:* Tool inconclusive. $W = 0$. $P_{new} = 0.90$.
  *Step 4:* Compute yields diminishing returns (timeout). Recommendation: Allocate hour to domain expert review of the inference step.
  *Outcome:* Expert confirms intuition but cannot formalize. Stop. Report 0.90 with "Unformalized Inference" warning.

  ### 4. Failure Modes

  **Tool Overconfidence.** The greatest risk is setting the reliability constant $K$ too high. If the static analyzer is unsound (produces false negatives), Step 3 calculates a false update. **Handback:** If a tool is known to be unsound on specific constructs (e.g., concurrency), manually set $K=0$ for those regions and rely on Step 4 expert review.

  **Reference Class Gaming.** Reviewers may select overly optimistic reference classes in Step 1 to boost $P_0$. **Handback:** Require audit trails for reference class selection. If the claim is novel, default to the "high risk" class until evidence accumulates.

  **The False Stop.** The procedure may stop at $P=0.95$ due to time, but the cost of failure is catastrophic. **Handback:** Implement a risk-weighted override. If Expected Loss $\times$ (1 - $P_{final}$) exceeds the deployment threshold, the procedure must flag "Do Not Deploy" regardless of the calculated credence. The number is an input to risk management, not a replacement for it. When the math says "probably safe" but the stakes are "existential," the human must override the stop condition and demand formal proof.
