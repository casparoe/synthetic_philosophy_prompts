answer: |-
  **Examination Question**

  **Time Allowed:** 90 Minutes
  **Topic:** Population Ethics – Benatar's Asymmetry

  **Question:**
  Benatar's asymmetry argument relies on four claims regarding the presence and absence of pain and pleasure. Write an essay that: (1) States the asymmetry precisely, explaining why the fourth claim requires a clause restricting evaluation to cases where no one exists to be deprived, and what normative absurdity follows if this clause is dropped; (2) Evaluates the objection that the asymmetry is ad hoc, assessing whether Benatar's appeal to intuitions about procreation offers explanatory unification or merely re-describes the premises, and whether this defence avoids circularity; (3) Distinguishes between the claim that coming into existence is always a harm and the claim that a life once begun is not worth continuing, explaining why the asymmetry licenses the former but not the latter; and (4) Assesses the rival principle that "the absence of pleasure is bad whenever the pleasure would have been good for someone had that person existed," determining whether Benatar can reject it without begging the question.

  ***

  **Model Answer**

  Benatar's asymmetry posits four claims: (1) presence of pain is bad; (2) presence of pleasure is good; (3) absence of pain is good, even if no one experiences it; (4) absence of pleasure is not bad, *unless there is someone who is deprived of that pleasure*. This final clause is critical. It restricts the evaluation of missing pleasure to existing subjects. If dropped, the absence of pleasure becomes bad simpliciter, generating a moral obligation to create happy people to satisfy potential pleasure. This collapses the asymmetry into total utilitarianism, forcing the repugnant conclusion that we are obligated to maximize population size regardless of quality of life.

  Benatar defends this structure by appealing to intuitions: we find it strange to lament pleasures never-conceived people miss, yet normal to regard spared pain as a reason not to conceive. Critics argue this is ad hoc. If the asymmetry is merely a summary of these intuitions, it lacks explanatory power; it re-describes the data rather than explaining it. For the defence to succeed without circularity, Benatar must ground the asymmetry in independent facts, such as the claim that interests require existence. Without this, appealing to intuitions simply presupposes the truth of the asymmetry it aims to prove.

  Furthermore, candidates must distinguish between two distinct claims: that coming into existence is always a harm, and that a life once begun is not worth continuing. The asymmetry compares existence against never existing. It shows that because pain is bad and missing pleasure is not bad (for the non-existent), coming into existence is a net harm relative to the alternative of non-existence. However, once a person exists, Claims 1 and 2 apply symmetrically: pain is bad and pleasure is good for them. Therefore, the asymmetry does not license the conclusion that existing life is not worth continuing (suicide), nor does it dictate how existing people should be treated. It is strictly an argument about procreation, not extinction.

  Finally, consider the rival principle: "The absence of pleasure is bad whenever the pleasure would have been good for someone had that person existed." Benatar must reject this to maintain Claim 4. However, he cannot simply assert Claim 4 against it, as that begs the question. To reject the rival principle non-question-beggingly, he must argue that the phrase "good for someone" entails actual existence. If a person never exists, there is no subject for whom the pleasure could be good, and thus no deprivation occurs. Only by establishing this metaphysical constraint on harm and benefit can Benatar reject the rival principle while maintaining the logical coherence of the asymmetry without circularity.

  ***

  **Marking Scheme (Total: 20 Points)**

  | Move | Criteria | Points | Characteristic Failure |
  | :--- | :--- | :--- | :--- |
  | **1** | **Precision on Claim 4:** Correctly states the fourth claim includes a clause restricting badness to cases where a subject exists to be deprived. | 4 | Omitting the "no subject" restriction clause. |
  | **2** | **Consequence of Omission:** Explains that dropping the clause creates an obligation to populate (collapse into total utilitarianism). | 4 | Failing to identify the absurd obligation to create happy people. |
  | **3** | **Ad Hoc/Circularity:** Assesses whether intuition appeals explain the asymmetry or merely re-describe it, noting the circularity risk. | 4 | Treating intuitions as independent proof rather than data needing explanation. |
  | **4** | **Existence Distinction:** Distinguishes harm of coming into existence from the value of continuing life (procreation vs. suicide). | 4 | Conflating antinatalism with the claim that life is not worth living. |
  | **5** | **Rival Principle:** Determines Benatar can only reject the rival principle by arguing "good for someone" requires existence, not by restating Claim 4. | 4 | Dismissing the rival principle by simply restating the asymmetry. |
