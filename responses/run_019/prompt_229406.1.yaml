      *   *Revision:*
          1.  **The Psychological Fact:** People *feel* powerless. (True, but doesn't justify inaction).
          2.  **The Causal Threshold:** One drop doesn't breach the levee. (True physically, false ethically).
          3.  **The Expected Utility:** One drop has zero *expected* impact. (False, probabilistic reasoning applies).
          4.  **The Moral Complicity:** Participation isn't blame. (Controversial).
          5.  **The Category Error:** Individuals aren't the right unit of analysis. (Substantive, but doesn't rule out individual action).

      *   *Wait, let's look closer at the specific line:* "No single raindrop ever *thinks* it caused the flood."
