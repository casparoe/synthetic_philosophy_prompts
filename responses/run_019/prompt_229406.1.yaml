          *   Label: The Threshold/Causal Claim.

      *   *Reading 3: The Moral Exoneration Claim.*
          *   Idea: If you don't cause it, you aren't blameworthy.
          *   Truth: Controversial in ethics (complicity, participation).
          *   Support for conclusion? Yes, if accepted. But needs defense.
