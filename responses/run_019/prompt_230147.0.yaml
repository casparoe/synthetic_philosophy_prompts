  One holds the thought and shuts the shutter tight,
  Refusing wind that might unsettle dust.
  Another lets the state prescribe the right,
  Where herd consent becomes mandatory trust.
  The third chooses what feels to reason sweet,
  A metaphysics fashioned by our taste.
  All three make inquiry a comfortable seat,
  Where nothing outside breaks the inner feast.
  But science bends to what is not the mind,
  Where reality pushes back the guess.
  Belief is habit, action's design,
  Its meaning found in effects we can assess.
  So settled truth is never firmly sealed,
  False is the shield that keeps it unrevealed.

  ***

  **Note on Liberties and Readings**

  This sonnet synthesizes arguments from Peirce's 1877 "The Fixation of Belief" and his 1878 "How to Make Our Ideas Clear." A careful reader might push back on two points. First, the poem treats the Pragmatic Maxim (meaning as conceivable effects) as the engine of the Method of Science within the context of fixing belief. While Peirce links them, the Maxim is technically a rule for clarifying concepts, whereas the Method of Science is a mode of settling opinion; conflating them slightly compresses his architecture. Second, line 14 ("False is the shield...") frames the rejection of insulation as a moral or practical imperative for safety. Peirce's fallibilism is more ontological: beliefs *are* overturnable not because we *should* test them, but because reality is independent and our access is incomplete. If a scholar argued that the poem makes fallibilism sound too voluntary, I would revise the couplet to emphasize the inevitability of external correction rather than the choice to test.
