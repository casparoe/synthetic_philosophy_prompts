answer: |-
  You have correctly identified the tension between **Good's Theorem** (the formal result you're describing) and human reality. Good's Theorem proves that for a perfectly rational Bayesian agent who maximizes expected utility, the expected value of free information is always non-negative.

  However, the theorem relies on three assumptions that humans violate:
  1.  **Costless Processing:** We assume updating beliefs costs nothing. (In reality, it costs emotional energy).
  2.  **Unbiased Updating:** We assume we update probabilities correctly. (In reality, we suffer from motivated reasoning or panic).
  3.  **Optimal Action:** We assume that once we know the truth, we will take the action that maximizes utility. (In reality, we suffer from *akrasia* or weakness of will).

  To reconcile your intuitions with the theorem, we need a principle that accounts for **bounded rationality** and **pre-commitment**.

  ### The Principle: Strategic Ignorance vs. Negligent Avoidance

  **Principle:** *Information avoidance is rational if and only if the information is either (A) instrumentally useless for changing physical outcomes, or (B) its acquisition predictably triggers a sub-optimal decision policy that the agent cannot override, such that ignorance serves as a necessary pre-commitment device.*

  Conversely, *Information avoidance is irrational (negligent) when the information is required to execute a corrective action, and avoiding it does not prevent the harmful behavior.*

  Here is how this principle sorts your cases, resolves the portfolio/credit card puzzle, and judges your sister.

  ---

  ### 1. The "Fine" Cases (Strategic Ignorance)

  These cases fit clause (A) or (B) of the principle.

  *   **Untreatable Disease (Clause A):** The information cannot change the physical outcome (no treatment exists). The only variable is psychological state. If the utility function includes "peace of mind," then avoiding the test maximizes expected utility. Good's Theorem still holds if you include "dread" as a negative utility cost; the theorem just says you shouldn't pay for info, but if the info has a negative *intrinsic* cost (dread) and zero *instrumental* value (actionability), the net value is negative.
  *   **Judge / Hiring Committee (Clause B):** Here, the decision rule *requires* ignorance to satisfy a constraint (fairness). If the judge looks at the record, she violates her utility function (which penalizes bias). She is pre-committing to a rule ("I will decide based only on evidence presented in court") that is optimal for the system, even if the specific information might be "useful" in a vacuum.
  *   **Scientist (Clause B):** Peeking at data inflates the false-positive rate (p-hacking). The information corrupts the statistical validity of the trial. The scientist is pre-committing to a protocol where ignorance preserves the integrity of the conclusion.
  *   **Investment Portfolio (Clause B):** This is the crux of your structural puzzle. You check daily $\rightarrow$ you see noise $\rightarrow$ you panic sell $\rightarrow$ you lock in losses.
      *   **Why it's fine:** You know your own psychology. You know that *if* you see the information, you *will* act irrationally (panic). Since you cannot trust yourself to act optimally upon receiving the info, the rational move is to prevent the info from arriving. Ignorance here is a **pre-commitment device** to the "Hold" strategy.

  ### 2. The "Not Fine" Case (Negligent Avoidance)

  *   **Credit Card Statements:** This looks like the portfolio case (financial stress + avoidance), but it fails the principle.
      *   **Why it differs:** In the portfolio case, *looking* triggers the loss (via panic selling). In the credit card case, *spending* triggers the loss. Opening the statement does not *cause* the debt; it reveals it.
      *   **Failure of Pre-commitment:** Avoiding the statement does not stop the spending (usually). It merely decouples the agent from the consequences. Unlike the investor who successfully "holds" by not looking, the credit card avoider continues to "spend" while not looking. The information is a **tool for correction**, not a **trigger for error**. Ignoring it prevents the only action that could mitigate the harm (budgeting/stopping spending). Therefore, it is negligent.

  ### 3. The Verdict on Your Sister

  Your sister's case is the boundary condition. To apply the principle, she must answer one question: **Is the information actionable?**

  *   **Scenario 1 (The Disease Model):** If she believes that regardless of the answer, she will stay in the marriage, and the only result of knowing is misery, then the information is instrumentally useless. Avoiding it is **rational**. She is prioritizing psychological utility over truth.
  *   **Scenario 2 (The Credit Card Model):** If she suspects that knowing the truth would lead her to leave a dangerous or toxic situation, or if the secrecy itself is damaging the relationship dynamic, then the information is actionable. Avoiding it is **irrational**. She is prioritizing short-term stress avoidance over long-term agency.

  **Prediction:** Since she is "torn," she likely suspects the information *is* actionable (i.e., she might leave him), but fears the emotional cost of processing it.
  *   **Advice:** If she trusts her future self to handle the pain and make a clean decision, she should look (Credit Card model). If she knows the knowledge will only torture her without changing her behavior (she won't leave him either way), she should not look (Disease model).
  *   **The Trap:** The most dangerous middle ground is if she stays *but* the knowledge poisons her affection, creating a "worst of both worlds" outcome. If that risk is high, Good's Theorem actually supports ignorance, because the expected utility of the *outcome state* (miserable marriage) is lower than the *ignorant state* (happy marriage).

  ### Summary Table

  | Case | Info Actionable? | Info Triggers Bias? | Avoidance Function | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Disease** | No | N/A | Protects Peace of Mind | **Fine** |
  | **Portfolio** | Yes (but noisy) | **Yes** (Panic Sell) | Pre-commitment to "Hold" | **Fine** |
  | **Judge** | Yes | **Yes** (Bias) | Enforces Fairness Constraint | **Fine** |
  | **Scientist** | Yes | **Yes** (P-hacking) | Preserves Validity | **Fine** |
  | **Credit Card**| **Yes** (Stop Spending) | No | Enables Denial | **Idiot** |
  | **Sister** | **?** | Maybe | **?** | **Depends on Agency** |

  ### Reconciling with Good's Theorem

  You can state this in a way that is fully compatible with decision theory by expanding the **Utility Function**.

  Good's Theorem says: $E[U | Info] \ge E[U | No Info]$.

  *   **Ideal Agent:** $U$ depends only on external outcomes (wealth, health, justice).
  *   **Real Agent:** $U$ depends on external outcomes + **Internal State** (anxiety, dignity, bias) + **Process Costs** (willpower required to not panic).

  In the **Portfolio** case, for the real agent:
  $U(\text{Look}) = \text{Wealth}_{\text{panic}} - \text{Anxiety}$
  $U(\text{Don't Look}) = \text{Wealth}_{\text{hold}} + \text{Peace}$
  Since $\text{Wealth}_{\text{hold}} > \text{Wealth}_{\text{panic}}$ (due to human error), $U(\text{Don't Look})$ wins.

  In the **Credit Card** case:
  $U(\text{Look}) = \text{Wealth}_{\text{corrected}} - \text{Stress}$
  $U(\text{Don't Look}) = \text{Wealth}_{\text{ruin}} + \text{Peace}$
  Since $\text{Wealth}_{\text{ruin}}$ is catastrophic, $U(\text{Look})$ wins.

  The theorem holds; you just have to admit that for humans, **ignorance is sometimes a feature of the optimal policy, not a bug in the information processing.**
