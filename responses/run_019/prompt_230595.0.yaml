      *   **The Counter-Argument (Chesterton's Fence):** This is crucial. I need to articulate *why* the minority is right to be cautious. It's not just "tradition"; it's about interdisciplinary rigor and synthesis. I need to validate their concern that removing it might lower standards or isolate departments.
      *   **The Recommendation:** Propose the "Amend with Conditions/Deadline" approach.
          *   *Condition 1:* Rubric/Standardization.
          *   *Condition 2:* Reduce burden (maybe one external examiner instead of two, or virtual).
