answer: |-
  **MEMORANDUM**

  **TO:** Academic Affairs Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding 1931 Senior Oral Exam Requirement

  **Purpose**
  This memo outlines a recommendation for the committee's vote this Thursday regarding the 1931 requirement that all graduating seniors pass an oral exam administered by two faculty members from outside their major department.

  **Current Status**
  The consensus among most stakeholders is that the current implementation is unsustainable. The absence of a grading rubric has led to unacceptable inconsistency; a student's success currently depends on examiner assignment rather than competency. Furthermore, department chairs report that the requirement consumes hundreds of faculty hours each spring, diverting time from research and mentorship.

  **The Counter-Argument: Chesterton's Fence**
  A minority of the committee has argued against immediate abolition, invoking the principle of "Chesterton's Fence." Their position is that because we cannot fully articulate the original 1931 intent, we cannot be certain the rule is not performing "quiet work" that keeps our academic standards intact. Specifically, they argue this requirement may be the only mechanism forcing interdisciplinary synthesis and preventing departments from becoming insular silos. If we abolish the rule solely because it is inefficient, we risk losing a unique check on departmental accountability and student integration of knowledge.

  This is a valid concern. We lack data on whether this exam actually improves long-term retention or interdisciplinary fluency. Removing it without testing its value would be an administrative assumption, not an evidence-based decision.

  **Recommendation: Amend with Conditions and a Sunset Clause**
  I recommend we **amend the rule for a two-year pilot period**, with a mandatory sunset date of Spring 2026. We will not abolish it immediately, nor will we keep it indefinitely in its current broken state.

  **The Pilot Conditions:**
  1.  **Standardization:** A university-wide rubric must be developed by Faculty Governance to ensure consistency across departments.
  2.  **Burden Reduction:** The requirement for *two* external faculty is reduced to *one*, or alternatively, departments may pair one external faculty member with a senior industry practitioner to reduce internal strain.
  3.  **Data Collection:** Departments must track examiner feedback regarding student ability to synthesize cross-disciplinary concepts.
  4.  **Sunset:** The requirement automatically expires in 2026 unless the Committee votes to renew it based on positive data regarding student outcomes.

  **Rationale**
  This approach respects the Chesterton's Fence argument by acknowledging we do not yet know what we might lose. It allows us to test the hypothesis that external examination adds unique value. However, by imposing a hard deadline and reducing the faculty burden, we acknowledge that tradition does not justify inefficiency. If the pilot demonstrates that the exam is indeed "dead weight," we will abolish it in 2026 with the confidence that we tested the fence before removing it.

  **Action Item**
  Please review the attached draft language for the pilot amendment. I propose we adopt this framework during Thursday's meeting.
