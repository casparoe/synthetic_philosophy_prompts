      *   **Current State:** No rubric, inconsistent application, high faculty time cost, departments are furious. Most committee members want to scrap it.
      *   **Conflict:** Majority sees it as dead weight; Minority argues "Chesterton's Fence" (don't remove a rule until you understand why it was put there).
      *   **Requirements:**
          *   Recommend one concrete course of action (Keep, Abolish, or Amend).
          *   Honestly engage the strongest argument from the losing side (the Chesterton's Fence argument).
          *   Tone: Professional, persuasive, academic governance style.
          *   Length: Short (memo format).

  2.  **Determine the Recommendation:**
      *   *Option A (Keep):* Unrealistic. The inconsistency and faculty burden are too high. No rubric makes it legally/academically risky.
      *   *Option B (Abolish):* Plausible, but ignores the Chesterton's Fence argument. Might alienate the minority and miss potential benefits.
      *   *Option C (Amend/Sunset):* This is the strongest path. It acknowledges the validity of the *intent* (interdisciplinary synthesis, accountability) while addressing the *execution* flaws (time, inconsistency). It respects Chesterton's Fence by testing the fence before removing it.
      *   *Decision:* Recommend a **two-year pilot amendment** with specific conditions and a hard sunset date. This allows for testing the "quiet work" hypothesis without locking in the inefficiency permanently.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. We need a decision on the 1931 Oral Exam Rule.
