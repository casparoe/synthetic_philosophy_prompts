answer: |-
  **Final Examination: Ethics Seminar**
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider the standard rescue case: you can save either one stranger or five strangers, all equally easy to reach, with no other relevant differences. John Taurek argues that you are not obligated to save the five; rather, you should flip a coin to give each individual an equal chance of survival.

  Write an essay that addresses the following three tasks:

  1.  **Reconstruct Taurek's Argument:** Explain the reasoning behind Taurek's conclusion. Specifically, articulate his claim regarding the aggregation of loss. Identify the load-bearing step where he denies that individual claims can combine into a stronger collective claim.
  2.  **Formulate the Strongest Objection:** Identify exactly which step in Taurek's argument a defender of saving the five must reject. Do not simply assert that five deaths are worse than one. Instead, formulate an objection that engages with at least one of the following pressure points: the problem of pairwise comparison, the consequences of adopting a policy of coin-flipping, or the nature of the individual complaints each of the five can lodge against the agent.
  3.  **Assess a Middle Position:** Evaluate the stability of a compromise view, such as a weighted lottery (giving the five a higher probability of rescue without making it certain) or a contractualist test based on reasonable rejection. Argue whether such a position can consistently maintain Taurek's insights while accommodating the intuition that numbers matter.

  ***

  **Model Answer**

  Taurek's challenge to the standard view rests on a specific metaphysical and moral claim about the nature of loss. To reconstruct his argument, one must look beyond the surface suggestion of flipping a coin. Taurek contends that moral concern is owed to individuals, not groups. When facing the choice between saving one person (David) or five others, standard reasoning assumes the loss of five lives is a greater evil than the loss of one. Taurek rejects this. He argues that there is no "super-subject" who experiences the aggregated loss of the five. David experiences his death; each of the five experiences their own death. Since no single person suffers the loss of five lives, there is no single perspective from which the five deaths constitute a weightier burden than the one death. Consequently, the load-bearing step of his argument is the refusal to allow several equal individual claims to combine into a stronger collective claim. If each individual has an equal claim to be saved, and these claims cannot sum together, then the agent shows equal concern only by giving each individual an equal probability of survival, typically via a coin toss.

  A defender of saving the five must reject Taurek's anti-aggregation premise. However, to avoid begging the question, this objection cannot merely stipulate that five deaths are worse. It must engage the pressure points Taurek raises regarding individual complaints and pairwise comparison. The strongest objection focuses on the complaints each of the five can lodge. If the agent saves David, each of the five can say, "You saved him instead of me." Taurek suggests that if the agent flipped a coin, this complaint is neutralized because the five were given a chance. However, this fails to account for the asymmetry in the outcome. In a pairwise comparison between David and any single member of the five, the claims are equal. But the agent is not choosing between David and one member of the five; the agent is choosing between David and the group. If the agent adopts a policy of always flipping a coin in such scenarios, they knowingly accept a future where more people die than necessary. The objection, therefore, is that Taurek's focus on the *ex ante* fairness of the procedure ignores the *ex post* reality of the grievances. Each of the five can complain that their life mattered no less than David's, yet the policy chosen guaranteed that more lives like theirs would be extinguished. By refusing to aggregate, Taurek prevents the agent from acknowledging that while no one person suffers the loss of five, the world suffers the loss of five persons, and morality requires minimizing that loss when claims are otherwise equal.

  This leads to the assessment of a middle position, such as a weighted lottery. This view attempts to acknowledge that numbers matter by giving the five a 5/6 chance of rescue, while retaining Taurek's insight that the one retains some moral weight. Is this stable? It is arguably unstable. The justification for a weighted lottery implicitly accepts the very aggregation Taurek rejects. If the reason to weight the lottery is that the five have a stronger collective claim, one must explain why that collective claim is strong enough to alter probabilities but not strong enough to dictate the outcome decisively. If the claims of the five aggregate to outweigh the one, they should outweigh the one fully, mandating rescue rather than a probability shift. Conversely, if the claims do not aggregate, there is no principled basis for weighting the lottery at all; it becomes an arbitrary concession to intuition. Furthermore, from a contractualist perspective, David could reasonably reject a principle that allows him to be sacrificed for the sake of a weighted probability, just as the five could reject a coin toss. The middle position tries to straddle the divide between individual fairness and collective outcome, but without a clear theory of *why* aggregation is permitted partially but not fully, it lacks a foundational principle. It risks becoming a heuristic without a moral backbone. Therefore, while a weighted lottery feels intuitively satisfying, it is theoretically unstable because it relies on the aggregation it seeks to downplay. One must either accept Taurek's strict individualism or accept that numbers count decisively.

  ***

  **Marking Scheme (25 Marks)**

  **Task 1: Reconstruction of Taurek (7 Marks)**
  *   **A-Range (6-7 marks):** Clearly identifies the "no super-subject" or "loss to whom?" argument. Explicitly isolates the **anti-aggregation premise** (individual claims do not sum) as the load-bearing step. Explains that equal concern implies equal chance.
  *   **B-Range (4-5 marks):** Accurately describes the coin-toss conclusion and the idea of fairness to individuals. Fails to explicitly articulate the metaphysical claim about aggregated loss or treats anti-aggregation as a minor feature rather than the core premise.
  *   **C-Range (0-3 marks):** Vague summary of "Taurek says flip a coin." Misinterprets Taurek as a utilitarian or claims he thinks lives have no value.

  **Task 2: Formulating the Objection (10 Marks)**
  *   **A-Range (8-10 marks):** Identifies the anti-aggregation premise as the specific step to reject. Engages at least one **pressure point** (pairwise comparison, policy consequences, or individual complaints) to show *why* aggregation is necessary. Avoids simply asserting "5 > 1."
  *   **B-Range (5-7 marks):** Correctly states that we should save the five. However, the objection relies on the bare assertion that five deaths are worse without engaging the specific pressure points or explaining how this overrides Taurek's individualism.
  *   **C-Range (0-4 marks):** Attacks a straw man (e.g., claims Taurek wants everyone to die). Fails to identify which step of Taurek's argument is being rejected.

  **Task 3: Stability of the Middle Position (8 Marks)**
  *   **A-Range (7-8 marks):** Takes a **clear argued position** (stable or unstable). Explains *why* the position holds or collapses (e.g., if numbers matter for probability, they matter for certainty). Connects this back to the aggregation debate.
  *   **B-Range (4-6 marks):** Describes the weighted lottery or contractualist test but offers no evaluation of its stability. Treats the middle position as obviously correct without testing its theoretical consistency.
  *   **C-Range (0-3 marks):** Irrelevant discussion or fails to address the middle position.

  **Differentiation Guide: A vs. B**
  *   **The A Answer** treats the anti-aggregation premise as the hinge of the entire essay. It shows how the objection (Task 2) and the stability assessment (Task 3) turn on whether aggregation is permissible. It engages the "Complaint" or "Policy" pressure points to demonstrate the cost of Taurek's view.
  *   **The B Answer** typically reconstructs the fairness intuition accurately in Task 1 but then falls back on asserting that five lives are worse than one in Task 2 without locating the premise being rejected. In Task 3, a B answer will typically describe the weighted lottery as a "good compromise" without analyzing whether it is theoretically stable.

  **Common Wrong-Turns (Penalize in relevant sections)**
  *   **Epistemic Confusion:** Treating Taurek's coin toss as a solution to ignorance about who is more valuable, rather than a moral claim about equal claims.
  *   **Utilitarian Straw Man:** Dismissing Taurek solely by invoking "maximize utility" without addressing his specific challenge to the *subject* of loss.
  *   **Arbitrary Compromise:** Arguing the weighted lottery is stable simply because it "feels right," ignoring the theoretical tension between partial and full aggregation.
