      *   **Emphasis:** Weight the response on the *criteria and motivating cases*, not the scoring.

  2.  **Deconstruct the Philosophical Problem (Smith's TMS):**
      *   *The Mechanism:* The Impartial Spectator (IS). It's an internalized observer.
      *   *The Two Standards:*
          1.  Ideal/Exact Propriety (The "Wisdom of the Wise").
          2.  Common/Approximate Standard (The "Wisdom of the World").
      *   *The Tension:* Humans naturally aim for the lower standard (social acceptance, ease). The virtuous aim for the higher. How does the IS navigate this? If it's just internalized society, it collapses into the lower standard. If it's pure reason/ideal, it lacks psychological grip.
      *   *Scientific Analogy:* A theory must predict phenomena (moral judgments), explain anomalies (weakness of will, hypocrisy), and define its domain (where it stays silent).

  3.  **Drafting the Desiderata (The "Theory Requirements"):**
      *   *Requirement 1: Phenomenological Accuracy.* It must match how people actually feel when judging themselves (guilt, pride, ambivalence).
      *   *Requirement 2: The Dual-Standard Mechanism.* It must explain how *one* mechanism generates *two* distinct standards without splitting into two separate agents.
      *   *Requirement 3: The Gravity of the Lower Standard.* It must explain why the "common" standard is the default (evolutionary? social? cognitive load?).
      *   *Requirement 4: Normative Traction.* It must explain how the "ideal" standard motivates action, not just abstract contemplation (avoiding the "empty ideal" problem).
      *   *Requirement 5: Developmental Trajectory.* It must explain how one moves from the lower to the higher standard (learning, habituation).
      *   *Requirement 6: Domain Silence.* It must admit where it doesn't apply (e.g., purely conventional rules vs. moral duties).

  4.  **Identifying Incompatible Desiderata (The "Uncertainty Principle"):**
      *   *Tension:* Psychological Realism vs. Normative Authority.
      *   *Explanation:* If the IS is built from actual social feedback (psychologically real), it inherits social biases (lower standard). If it's a pure rational construct (normatively authoritative), it lacks causal power to move the agent.
      *   *Flag:* Desideratum 3 (explain the pull of the common) vs. Desideratum 4 (explain the motive force of the ideal).

  5.  **Drafting the Scoring Section:**
      *   *Smith (TMS):* Strong on psychology and the dual standard. Weak on the *source* of the ideal (sometimes seems to come from nowhere or divine).
      *   *Affective-Mirroring (e.g., Simulation Theory/Prinz):* Strong on mechanism (empathy/mirroring). Weak on the *ideal* standard (tends to collapse into shared affect, i.e., the lower standard).
      *   *Normative Constructivist (e.g., Korsgaard/Rawlsian):* Strong on the ideal standard. Weak on psychological grip (why should I care about the construction?).

  6.  **Refining the Tone:**
      *   Must sound like it respects the user's scientific background. Use terms like "boundary conditions," "mechanism," "predictive scope," "falsification."
