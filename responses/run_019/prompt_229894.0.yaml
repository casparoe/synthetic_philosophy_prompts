      *(Self-Correction on the "Theory of the IS"):* The prompt asks for desiderata for "any adequate account of the impartial spectator *as the mechanism*." So I am setting standards for a theory that posits the IS.
      *   *Input:* Moral phenomena (judgments, feelings).
      *   *Mechanism:* IS.
      *   *Output:* Explanation of the two standards.

      *Let's structure the Desiderata as "Conditions of Adequacy."*

      1.  **Discrimination Condition:** Must distinguish self-assessment from other-assessment.
      2.  **Dual-Standard Condition:** Must generate both the Ideal and the Common.
      3.  **Inertia Condition:** Must explain why the Common standard is the attractor state.
      4.  **Motivation Condition:** Must explain how the Ideal standard moves the will.
      5.  **Boundary Condition:** Where does it stop? (Supererogation vs. Duty).

      *Incompatibility:* Inertia vs. Motivation. If the mechanism is driven by social reward (Inertia), how does it drive toward social independence (Motivation)?

      *Scoring:*
