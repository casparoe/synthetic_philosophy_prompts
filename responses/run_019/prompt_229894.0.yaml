      *   **Topic:** Adam Smith's *Theory of Moral Sentiments* (TMS), specifically the "impartial spectator" mechanism in moral self-assessment (Part VI, section iii).
      *   **Core Task:** Write a set of *desiderata* (criteria for success) for a theory of the impartial spectator.
      *   **Specific Focus:** Address the tension between Smith's two standards (exact propriety/perfection vs. common approximation). Explain how both apply, why the lower pulls strongly, and how the spectator corrects without becoming empty.
      *   **Constraint:** Flag any incompatible desiderata.
