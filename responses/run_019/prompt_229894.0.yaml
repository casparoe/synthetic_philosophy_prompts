      *   Where silent? Yes (non-moral conventions).
      *   Flag incompatibilities? Yes.
      *   Score the three accounts? Yes, briefly.
      *   Weight on criteria? Yes.

      *Ready to write.*
answer: |-
  Here is a specification of conditions of adequacy for any theory proposing the "impartial spectator" (or a functional equivalent) as the mechanism of moral self-assessment. These are framed as boundary conditions and predictive requirements, analogous to the constraints placed on a physical model.

  ### Conditions of Adequacy for a Theory of Moral Self-Assessment

  A viable theory must treat the impartial spectator not as a metaphor, but as a functional mechanism with defined inputs, processing rules, and outputs. It must satisfy the following five desiderata.

  #### 1. The Dual-Standard Output Condition
  **Requirement:** The mechanism must generate two distinct evaluative outputs from the same input data (the agent's conduct).
  *   **The Phenomenon:** As Smith notes in Part VI, an agent often feels "blameless" relative to their peers (Standard B: Common Approximation) but "deficient" relative to their own conscience (Standard A: Exact Propriety).
  *   **The Test:** The theory must specify the algorithmic or psychological switch that allows a single internal observer to toggle between these standards. It cannot posit two separate spectators (e.g., "society" vs. "reason") without explaining how they coexist in one mind without causing dissociation.
  *   **Success Case:** Explaining the feeling of *guiltless regret* (I did what anyone would do, but I wish I had done better).
  *   **Failure Mode:** A theory that only produces binary pass/fail judgments based on social norms collapses Standard A into Standard B.

  #### 2. The Inertia of the Common Standard
  **Requirement:** The theory must explain the asymmetry of effort required to maintain the two standards.
  *   **The Phenomenon:** Standard B (Common Approximation) is the default attractor state. It requires little cognitive energy to maintain. Standard A (Exact Propriety) requires sustained attention and often incurs social cost.
  *   **The Test:** The model must account for "moral drift." Why does the spectator naturally calibrate to the median behavior of the agent's immediate cohort unless actively corrected?
  *   **Success Case:** Explaining why virtuous agents must constantly "re-verify" their standards against the ideal, whereas non-virtuous agents drift with public opinion.
  *   **Failure Mode:** A theory that assumes the spectator is naturally impartial fails to explain why impartiality is a rare achievement rather than a baseline state.

  #### 3. The Normative Traction Condition
  **Requirement:** The Ideal Standard must exert causal force on the will, not merely descriptive force on the intellect.
  *   **The Phenomenon:** Recognizing the Ideal Standard is not enough; the agent must feel *moved* to approximate it, even when it conflicts with the Common Standard.
  *   **The Test:** How does the spectator convert a representation of "perfection" into a motive? If the spectator is merely a mirror of social sentiment, it lacks the leverage to oppose that sentiment.
  *   **Success Case:** Explaining *moral heroism* or *whistleblowing*, where the agent satisfies Standard A while violating Standard B.
  *   **Failure Mode:** An "empty ideal" where the spectator identifies the perfect action but provides no emotional or psychological fuel to pursue it against social gravity.

  #### 4. The Developmental Trajectory Condition
  **Requirement:** The theory must account for the calibration of the spectator over time.
  *   **The Phenomenon:** No one is born with the Ideal Standard. It is acquired through interaction with the Common Standard.
  *   **The Test:** The model must describe the transition phase. How does an agent move from judging by Standard B to judging by Standard A without an external teacher imposing Standard A?
  *   **Success Case:** Explaining moral maturation in adulthood where social approval becomes less motivating than self-approval.
  *   **Failure Mode:** A "black box" account where the Ideal Standard simply appears fully formed, or a purely behaviorist account where the agent never transcends conditioning.

  #### 5. The Domain Silence Condition
  **Requirement:** The theory must specify where the mechanism *does not* operate.
  *   **The Phenomenon:** We do not use the impartial spectator to judge matters of taste, prudence, or convention (e.g., wearing mismatched socks vs. stealing).
  *   **The Test:** The theory must define the boundary between moral propriety and mere social etiquette.
  *   **Success Case:** Explaining why violating a dress code causes embarrassment (Standard B violation) but violating a promise causes guilt (Standard A violation).
  *   **Failure Mode:** Moral overreach, where every deviation from the ideal is pathologized as a moral failure, or moral underreach, where significant ethical breaches are treated as mere convention.

  ***

  ### Incompatibility Flag: The Realism vs. Authority Trade-off

  There is a high probability that **Desideratum 2 (Inertia of the Common)** and **Desideratum 3 (Normative Traction of the Ideal)** cannot be jointly satisfied by a purely naturalistic mechanism.

  *   **The Conflict:** If the spectator is constructed from empirical social data (to satisfy Desideratum 2 and explain psychological realism), it inherits the biases and limitations of that data. It becomes a mirror of the "world." It is difficult to see how a mechanism built from the "Common" can generate the leverage required to oppose the "Common" in favor of the "Ideal."
  *   **The Trade-off:** To satisfy Normative Traction, the spectator usually requires a transcendental or rational component (a "view from nowhere"). But introducing this component weakens the explanation of Inertia (why is it so hard to access this rational view?).
  *   **Prediction:** Any theory that scores high on Psychological Realism (explaining the pull of the crowd) will likely score low on Normative Traction (explaining the power of conscience), and vice versa.

  ***

  ### Brief Scoring of Accounts

  **1. Adam Smith's Account (TMS)**
  *   **Dual-Standard:** **Pass.** Smith explicitly builds the mechanism to handle both standards via the distinction between the "spectator within" (conscience) and the "spectator without" (society).
  *   **Inertia:** **Pass.** Excellent explanation of our natural desire for "mutual sympathy" which anchors us to the Common Standard.
  *   **Traction:** **Borderline.** Smith relies on the "love of praiseworthiness" vs. "love of praise." However, the source of the Ideal Standard is sometimes ambiguous (habit? reason? divine?), making the causal leap to the Ideal slightly under-specified.
  *   **Verdict:** High fidelity to the phenomena, but the mechanism for the Ideal Standard's origin is the weak link.

  **2. Contemporary Affective-Mirroring (e.g., Simulation Theory/Prinz)**
  *   **Dual-Standard:** **Fail.** Tends to collapse morality into shared emotional resonance. It explains Standard B (social alignment) well but struggles to generate Standard A (which often requires suppressing shared affect).
  *   **Inertia:** **Pass.** Strong evolutionary and neurological basis for why we align with the group.
  *   **Traction:** **Fail.** Lacks the resources to explain why an agent would act against the affective grain of their community. The "spectator" is just a simulation of others' reactions.
  *   **Verdict:** Strong on the physics of the mechanism, weak on the normative output.

  **3. Normative Constructivist (e.g., Korsgaard/Rawlsian)**
  *   **Dual-Standard:** **Pass.** Clearly distinguishes between contingent social norms and constructed rational principles.
  *   **Inertia:** **Fail.** Often treats the pull of the Common Standard as irrationality or weakness of will, rather than a structural feature of the mechanism itself.
  *   **Traction:** **Pass.** The Ideal Standard is binding by definition of agency.
  *   **Verdict:** Solves the Normative Traction problem by positing a rational agent, but fails the Psychological Realism test regarding why the Common Standard is the default setting.

  ### Summary for the Scientist
  If you are looking for a theory that functions like a physical law, Smith's is the most robust *phenomenological* model, but it lacks a clean *causal* account of how the Ideal Standard is generated without circularity. The Affective-Mirroring account offers the best causal mechanism but fails to predict the full range of moral data (specifically, moral independence). The Constructivist account predicts the ideal outcomes but ignores the friction of the medium (human psychology). The "Incompatibility Flag" suggests that a complete theory may require a dual-process architecture that current models have not yet successfully integrated.
