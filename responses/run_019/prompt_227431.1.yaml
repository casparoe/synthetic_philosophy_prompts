answer: |-
  Scenario: A high school compares a **Guided Study Program** (Treatment) against the **Standard Curriculum** (Control) to improve final exam pass rates. The partitioning variable is **Submission of Practice Sets**, a requirement enforced by the Guided Program but optional in the Standard Curriculum.

  | Group | Submitted Practice Sets | Did Not Submit | Total |
  | :--- | :---: | :---: | :---: |
  | **Guided Program** | 45 passed / 90 total (50%) | 1 passed / 10 total (10%) | **46 passed / 100 total (46%)** |
  | **Standard Curriculum** | 6 passed / 10 total (60%) | 36 passed / 90 total (40%) | **42 passed / 100 total (42%)** |

  The decision-maker should trust the aggregated table and implement the Guided Program.

  **Arithmetic of Reversal:** Within the "Submitted" subgroup, the Standard Curriculum outperforms the Guided Program (60% vs. 50%), and within the "Did Not Submit" subgroup, the Standard Curriculum also outperforms the Guided Program (40% vs. 10%); however, in the aggregate, the Guided Program has a higher pass rate (46% vs. 42%).

  **Causal Structure:** Submission is a **mediator** caused by the treatment (the Guided Program forces submission), not a pre-treatment confounder. Conditioning on a mediator blocks the indirect causal path ($Program \rightarrow Submission \rightarrow Pass$), isolating only the direct effect of the program content (which is actually weaker) while hiding the program's primary benefit: successfully getting students to submit work.

  **Minimal Change to Flip Verdict:** If the partitioning variable were changed to **Prior Academic Standing** (a pre-treatment variable) and the Guided Program was non-randomly assigned mostly to high-standing students (90 high vs. 10 low), the aggregate advantage would be due to selection bias, making the disaggregated table the correct basis for decision-making.

  **Causal Criteria:** In the original scenario, the **Total Effect** criterion dictates ignoring mediators to capture the full impact of the intervention; in the modified scenario, the **Backdoor Criterion** dictates conditioning on confounders to block spurious associations caused by non-random assignment.
