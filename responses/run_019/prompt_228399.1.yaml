  There is a script for evenings like this, one we all know by heart. It says the universe is vast and our lives are brief. It suggests that because stars are large and we are small, our proper posture is humility. It is beautiful, but our guest of honor finds it cheap. She has spent forty years listening to the silence of distant galaxies, not to learn how small she is, but to learn how much there is to know. To tell her now that her work proves her insignificance is to misunderstand the work entirely. So tonight, we will not offer her the comfort of insignificance. Instead, I want to borrow a view from Frank Ramsey, a Cambridge philosopher who died in 1930 at only twenty-six.

  Ramsey refused the conclusion that the scale of the cosmos should make us feel insignificant. He argued that our picture of the world should be drawn in perspective rather than to scale. In a painting, the foreground is occupied by human beings, and the heavens, for all their physical enormity, remain in the background. This is not because the stars are not there, but because they cannot think or love or take an interest in anything. We can. Size, on his view, is not the same thing as importance, and there is nothing servile owed to mere bigness. He paired this with a genuine excitement about humanity's future, despite knowing his own would be short.

  This is the spirit in which she has worked. When she pointed her dishes toward the edge of the visible world, she was not bowing down to the void. She was bringing the background into the foreground of human understanding. Every map she drew was an assertion that while the universe may not care about us, we care about it. That curiosity is what grants us weight. The silence of space does not diminish us; it waits for us to fill it with meaning. Her career was not a confession of smallness, but a testament to the reach of the human mind. She did not shrink before the dark; she turned on the lights.

  Ramsey looked forward because he believed what we do next matters more than where we stand in the void. Tonight, we look forward too. We look to the students she has guided, who will now point the telescopes themselves. We look to her family and friends, who know her not for the light-years she measured, but for the warmth she brought to the room. Her retirement is not an end to that contribution. It is a shift in focus from mapping the distant past to enjoying the immediate future. Her legacy is not just in the data, but in the people who will keep asking questions.

  So let us not say that she gave her life to the stars as if she were lost among them. She gave her life to us, using the stars as her tool. She showed us that importance is not a matter of mass or distance, but of attention and care. As she steps away from the observatory, she takes with her the knowledge that she made the world larger for all of us. Here is to the foreground, to the future, and to the woman who taught us we are the measure of things.
