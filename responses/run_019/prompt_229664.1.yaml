answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Investment Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Mathematician's Endowment Gift

  ### **Executive Summary**

  The Investment Committee recommends that the Board **accept the gift with specific governance conditions.** We advise accepting the $10 million principal and the associated ordinary investment income, but we must formally reject the instrument's clause allowing the Board to fix the "order of summation" for financial reporting. 

  **Bottom Line:** We can honestly budget **$450,000 annually** (derived from ordinary investment income), subject to the establishment of a volatility reserve. We must budget **$0** from the coin-toss adjustment mechanism. We will instruct our auditors that the gift's reporting stipulation is incompatible with GAAP and will not be utilized; the adjustment will be reported only upon realization (cash basis).

  ### **Financial Analysis of the Gift**

  The gift comprises two distinct financial components:
  1.  **The Base Endowment:** $10 million in principal generating approximately $450,000 in ordinary annual income. This is standard, verifiable capital.
  2.  **The Stochastic Adjustment:** An annual cash flow determined by a coin-toss mechanism. Mathematically, the expected value of this adjustment corresponds to the alternating harmonic series. While the "natural order" sum converges to $\ln(2)$ (approx. $0.69), the series is *conditionally convergent*. As our actuary noted, the positive and negative terms both diverge. 

  Per the Riemann Series Theorem, by rearranging the order of summation, the series can be made to equal any real number. The gift instrument grants the Board the power to select this order for reporting purposes.

  ### **The Governance and Ethical Challenge**

  The core conflict is not mathematical, but fiduciary. The instrument invites the Board to manufacture a book value for the adjustment mechanism by fiat. 

  **The Dissenting View:** One Trustee has argued that accepting a gift where the reported value exists "only by our own say-so" constitutes a small fraud on auditors, grantees, and heirs. We engage this argument seriously. The Trustee is correct that utilizing the summation clause to book a specific value (such as $\ln 2$ or any other figure) would undermine the integrity of our financial statements. If we can declare the value to be anything, the declared value means nothing. To use this clause would be to prioritize legal permission over accounting truth.

  **The Committee's Resolution:** We agree with the Trustee that the *reporting clause* is unacceptable, but we disagree that it necessitates declining the *entire gift*. The $10 million principal is not contingent on the summation order; it is real capital. The ethical breach occurs only if we allow the stochastic adjustment to distort our reported asset value. By segregating the adjustment and refusing to exercise the summation option, we preserve the capital while neutralizing the ethical risk.

  ### **Conditions of Acceptance**

  To proceed fiduciarily, the Board must adopt the following resolutions concurrently with the gift acceptance:

  1.  **Rejection of Summation Discretion:** The Board resolves that it will **not** exercise the option to fix the order of summation for any financial reporting. We acknowledge the donor's stipulation but declare it void insofar as it conflicts with Generally Accepted Accounting Principles (GAAP) regarding contingent assets and liabilities.
  2.  **Realization-Based Reporting:** For all external reports (auditors, Form 990-PF, grantees), the coin-toss adjustment shall be recorded **only when realized**. Until the coin is tossed and the amount determined, the book value of the adjustment mechanism is **$0**. We will not book the expected value of $\ln 2$ (69 cents) or any other theoretical figure.
  3.  **Spending Policy Restriction:** The foundation's spending rate applies **only** to the $10 million base principal and its ordinary income. No funds may be distributed based on the coin-toss adjustment until the cash is physically received.
  4.  **Volatility Reserve:** Because the adjustment mechanism carries "tail risk" (a low-probability chance of a massive negative liability that could erode principal), 10% of the ordinary income ($45,000) shall be retained annually in a restricted reserve fund to offset potential negative adjustments. 

  **Revised Budgetable Figure:** $450,000 (Ordinary Income) - $45,000 (Reserve) = **$405,000 available for grants.**

  ### **Communication to Auditors**

  We anticipate scrutiny regarding the donor's reporting stipulation. Our guidance to external auditors shall be:

  > "The gift instrument contains a provision allowing the Board to determine the valuation of a contingent income stream by selecting a mathematical summation order. Our legal counsel and Investment Committee have determined that exercising this discretion would produce figures not representative of fair market value or probable realization. In accordance with FASB standards on contingencies and donor restrictions, we are reporting this component on a cash basis (value = $0 until realized). We are treating the summation clause as a non-binding suggestion that conflicts with statutory accounting requirements."

  ### **Conclusion**

  Declining the gift entirely would punish the foundation for a donor's eccentricity, sacrificing $10 million of transformative capital because of a flawed reporting clause. However, accepting it without conditions would validate a mechanism that allows us to manufacture value. 

  By accepting the capital but rejecting the accounting fiction, we honor the Trustee's concern for integrity without forfeiting the resources needed to serve our mission. We accept the money, but we refuse to play the game with the numbers.

  **Action Required:** Vote to accept the gift subject to the conditions outlined above.
