answer: |-
  Your insight is precise: the debate is rarely about whether individuals exist or whether social structures have effects. Both sides agree people exist and that prices constrain choices. The fight is over *explanatory priority* and *reducibility*. To settle the argument, you need a scorecard that separates the shared ground from the ideological trenches.

  Here are the desiderata for an adequate theory of the individual-social relation, distinguished by their status, followed by the incompatibilities that force the philosophical choice.

  ### I. The Desiderata and Their Motivating Cases

  Any account of social ontology should aim to satisfy the following criteria.

  **1. Ontological Grounding (The "No Ghosts" Constraint)**
  *   **Requirement:** Social facts must ultimately depend on the existence and activities of individual human beings. There are no free-floating social substances.
  *   **Motivating Case:** If every human being vanished tomorrow, the stock market, the English language, and the institution of marriage would cease to exist. Unlike gravitational fields, social facts require a substrate of conscious agents.

  **2. Downward Causation (The "Constraint" Constraint)**
  *   **Requirement:** Social-level facts must be capable of causally influencing individual beliefs, desires, and actions. The explanation cannot flow only from the bottom up.
  *   **Motivating Case:** **Market Constraints.** An individual cannot choose to buy a house for $100,000 if the market price is $500,000. The "price" is a social fact that physically constrains individual choice, independent of that individual's psychology.

  **3. Multiple Realizability (The "Survival" Constraint)**
  *   **Requirement:** A specific social fact or entity must be able to persist through the complete replacement of the individuals constituting it.
  *   **Motivating Case:** **The Corporation.** A corporation remains the same legal and economic entity even if every single employee, manager, and shareholder is replaced over a century. If the social fact were identical to the specific list of individuals, the corporation would cease to exist every time someone clocked out.

  **4. Institutional Distinctness (The "Status" Constraint)**
  *   **Requirement:** The account must distinguish between mere behavioral regularities and institutional facts that carry deontic powers (rights, obligations, entitlements).
  *   **Motivating Case:** **Debt vs. Traffic.** Morning traffic is a regularity of behavior; if everyone decided to drive on the left, it would just be a new regularity. A debt is an institutional fact; if everyone decided debts didn't exist, the economy would collapse, but the *obligation* remains even if one party wishes to ignore it. The theory must explain why a piece of paper counts as money while a similar piece of paper does not.

  **5. Explanatory Autonomy (The "Prediction" Constraint)**
  *   **Requirement:** Social-level explanations should be able to predict and explain phenomena without requiring a full reduction to individual psychological states.
  *   **Motivating Case:** **Bank Runs.** To predict a bank run, you do not need to know the specific childhood traumas or neural states of every depositor. You need to know the *structure* of the banking system (fractional reserves) and the *information available* to the crowd. The social pattern explains the outcome better than the aggregate of individual psyches.

  **6. Responsibility Attribution (The "Agency" Constraint)**
  *   **Requirement:** The account must make sense of holding collective entities responsible in a way that is not simply shorthand for blaming specific individuals.
  *   **Motivating Case:** **Corporate Liability.** When a company pollutes a river due to a diffuse decision-making structure where no single individual intended the harm, we still hold the *corporation* responsible. A theory that dissolves the corporation into a list of individuals struggles to locate the agent of the harm.

  ---

  ### II. Constraints vs. Camp Commitments

  To stop talking past each other, you must separate what any reasonable theory must accept from what defines the specific camps.

  **Non-Negotiable Constraints (Shared Ground)**
  Both individualists and holists, upon reflection, usually accept these:
  1.  **Ontological Grounding:** Almost no one claims society exists independently of humans (unless they are mystical holists).
  2.  **Downward Causation:** Almost no one denies that social environments shape individual psychology (socialization, prices, laws).

  **Camp-Specific Commitments (The Battleground)**
  These are not neutral criteria; they are the axioms of the opposing views.
  1.  **The Individualist Commitment (Microfoundations):** Every valid macro-level explanation *must* be translatable, in principle, into an explanation involving only individuals, their properties, and their interactions. If you cannot open the "black box" of the social fact, the explanation is incomplete.
  2.  **The Holist Commitment (Autonomy):** Macro-level explanations are *sui generis*. They are not shorthand for micro-explanations. Attempting to reduce them destroys the explanatory power (e.g., explaining inflation by listing individual spending decisions misses the monetary phenomenon).

  ---

  ### III. Incompatibilities and the Decisive Requirement

  You cannot maximize all desiderata simultaneously. The tension lies in how you interpret the relationship between Grounding (1) and Autonomy (5).

  **The Incompatible Pair: Exhaustive Reducibility vs. Explanatory Autonomy**
  *   **Conflict:** If you insist on **Exhaustive Reducibility** (Individualist Commitment), you risk making Social Autonomy (Desideratum 5) illusory. If a bank run is *nothing but* a collection of panicked individuals, then "bank run" is just a convenient label, not a causal force.
  *   **Conflict:** If you insist on strong **Explanatory Autonomy** (Holist Commitment), you risk violating Ontological Grounding (Desideratum 1). If the "bank run" has laws that cannot be derived from individual behavior, it begins to look like a magical force hovering above the people.

  **The Single Requirement That Forces the Choice**
  The choice between the camps turns on one question: **Is the macro-level explanation *eliminable*?**

  *   **If Yes:** If you believe that a perfect knowledge of all individual states would render social concepts (like "inflation," "norm," "corporation") unnecessary for a complete description of reality, you are forced into **Methodological Individualism**.
  *   **If No:** If you believe that even with perfect knowledge of all individuals, you would still need social concepts to capture the *relations* and *structures* that constitute the phenomenon, you are forced into **Holism or Emergentism**.

  This is the pivot point. It is not about whether individuals exist; it is about whether social concepts are *ontologically redundant* even if they are heuristically useful.

  ---

  ### IV. Evaluation of the Three Views

  Here is how the major positions fare against the list.

  **1. Strict Methodological Individualism**
  *   **Performance:** Satisfies **Ontological Grounding** perfectly. It handles **Multiple Realizability** by treating social terms as functional descriptions of individual interactions.
  *   **Failure:** Struggles with **Explanatory Autonomy** and **Downward Causation**. It often treats social constraints as mere aggregates of individual choices, making it hard to explain why the "structure" feels coercive to the agent. It risks making **Corporate Responsibility** difficult to assign when no single individual is at fault.
  *   **Verdict:** Ontologically safe, explanatorily impoverished.

  **2. Strong Holism**
  *   **Performance:** Satisfies **Explanatory Autonomy** and **Downward Causation** perfectly. It captures **Institutional Distinctness** well (rules exist outside the individual).
  *   **Failure:** Struggles with **Ontological Grounding**. It often speaks of "Society" or "Structure" as if it were an agent itself, risking reification (treating a concept as a physical thing). It can make **Multiple Realizability** mysterious (how does the structure persist without the people?).
  *   **Verdict:** Explanatorily powerful, ontologically mysterious.

  **3. Emergentist Middle View (Non-Reductive Physicalism)**
  *   **Performance:** Attempts to satisfy **Ontological Grounding** (social facts supervene on individuals) while maintaining **Explanatory Autonomy** (social facts have causal powers not predictable from the parts alone). It handles **Multiple Realizability** by focusing on the *pattern* rather than the *substrate*.
  *   **Failure:** Often accused of vagueness. It must walk a tightrope to explain how "emergent" properties can causally affect the base level without violating the causal closure of the physical/individual level.
  *   **Verdict:** The most intuitive fit for the phenomena you described, but requires the most philosophical heavy-lifting to avoid contradiction.

  **Recommendation for the Argument:**
  Return to your friend and agree that **Ontological Grounding** and **Downward Causation** are non-negotiable. Then, ask her to defend the **Eliminability Thesis**. If she claims social facts are *real* in a way that individual facts are not, she is a Holist. If she claims social facts are *real patterns* but ultimately constituted entirely by individuals, she is an Individualist. The argument is not about the facts, but about whether the macro-pattern is a *cause* or a *consequence*.
