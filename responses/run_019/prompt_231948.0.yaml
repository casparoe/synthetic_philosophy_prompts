answer: |-
  Introspection is not unitary; its reliability depends on timing and content. Use this procedure to weight first-person reports.

  **The Decision Procedure**

  **Q1: Is the report concurrent with the experience or retrospective?**
  *   **Sufficient Answer:** *Concurrent* (describing experience as it happens) leads to Q2. *Retrospective* (reconstructing past states or causes) leads to Q3.
  *   **Rationale:** Concurrent verbalization accesses working memory with minimal reconstruction; retrospective accounts rely on fallible episodic memory and narrative smoothing.

  **Q2: Is the claim about phenomenology (what it feels like) or mechanism (why it happened)?**
  *   **Sufficient Answer:** *Phenomenology* leads to **High Trust**. *Mechanism* leads to **Moderate Trust**.
  *   **Rationale:** Individuals have privileged access to qualia (e.g., pain, dread) but poor access to cognitive processes generating behavior.

  **Q3: Is the claim about phenomenology or mechanism?**
  *   **Sufficient Answer:** *Phenomenology* leads to **Moderate-High Trust** (memory distorts intensity, not necessarily existence). *Mechanism* leads to **Low Trust**.
  *   **Rationale:** Retrospective causal attribution is highly susceptible to implicit theories and confabulation (Nisbett & Wilson, 1977).

  **Q4: [VALUE JUDGMENT] Does the context require empirical accuracy or therapeutic utility?**
  *   **Sufficient Answer:** *Research/Mechanism* requires corroboration; treat uncorroborated causal claims as hypotheses. *Clinical/Phenomenology* prioritizes the client's meaning-making; treat claims as valid data points for alliance and formulation, even if historically inaccurate.
  *   **Rationale:** This is where epistemology ends. Science demands causal truth; therapy often benefits from narrative coherence.

  ***

  **Application to Cases**

  **(1) The Experiment Participant**
  *Report:* "I chose the safer-looking option because I am a cautious person."
  *Procedure:* Retrospective (Q1) → Mechanism (Q3) → Low Trust.
  *Verdict:* Do not code this as the causal mechanism. The participant likely observes their choice and infers the trait ("I chose safe, therefore I am cautious") rather than accessing the actual weighting process. Use the behavioral choice data; treat the explanation as a belief about self, not a cause of action.

  **(2) The Client in Mood Exercise**
  *Report:* "I feel a faint, diffuse dread at the back of my throat."
  *Procedure:* Concurrent (Q1) → Phenomenology (Q2) → High Trust.
  *Verdict:* Accept this as accurate data. Concurrent somatic monitoring is highly reliable. This report should shape the clinical note regarding current affective state. There is no need for corroboration; the sensation exists because he reports it.

  **(3) The Client with Childhood Narrative**
  *Report:* "One childhood event caused my current avoidance."
  *Procedure:* Retrospective (Q1) → Mechanism (Q3) → Low Trust → [VALUE JUDGMENT] (Q4).
  *Verdict:* Empirically, you cannot trust the causal link. Memory reconstructs origins to fit current distress. However, clinically, this narrative is the key to the case.
  *Honest Record:* Do not write "Childhood event X caused avoidance Y" as fact. Write "Client identifies event X as the origin of avoidance Y." The procedure validates the *meaning* of the event for the client, not the *historical causality*. If you record it as fact, you violate scientific defensibility; if you dismiss it, you violate clinical utility.

  ***

  **Limitations and Misfires**

  This procedure cannot adjudicate deception or severe dissociation. If a client lies or is detached from reality, concurrent phenomenological reports may still be false (e.g., claiming no pain while injured). It also misfires in high-stakes legal contexts where "phenomenological truth" is insufficient; there, only corroborated mechanism matters.

  Furthermore, the procedure cannot resolve the tension in Case 3. It identifies the epistemic gap but forces you to choose sides at Q4. In supervision, a research mentor may demand you discard the causal claim, while a clinical supervisor may demand you center it. The procedure clarifies *why* they disagree—one seeks mechanistic truth, the other narrative utility—but it cannot tell you which value should win. Finally, it assumes standard cognitive functioning; in psychosis or mania, concurrent reports may reflect internal logic rather than shared reality, requiring external validity checks this tree does not provide.

  Use this to navigate the split: trust the feeling, question the cause, and label your uncertainty when recording the latter.
