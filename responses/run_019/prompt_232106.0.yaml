prompt: |-
  The board of a regional conservation authority will vote next month on whether to authorize an intervention aimed at reducing a large die-off in one of its fenced reserves, and it has asked the authority's ethics advisory committee — of which I am a member — to send a written recommendation before the vote. I am preparing that memo. The reserve's two waterholes are already partly maintained by staff, and the elephant population is substantially larger than rainfall alone would support; in all other respects the authority's policy is non-interventionist. Feeding or treating wild animals is restricted to cases in which a species is threatened with local extirpation, and culling is permitted only in extremis. A severe drought has collapsed the reserve's browse and grass cover; the elephants are losing condition, and some have already died. The proposal before the board seeks authorization for emergency supplementary feeding during the current dry season, followed by a multi-year immunocontraception programme to hold the population below the reserve's carrying capacity. Its case is that the aggregate suffering of hundreds of slowly starving animals, including the slower deaths of dependent calves, outweighs whatever value attaches to an unmanaged baseline — all the more so because the system is already fenced and water-managed, and the authority bears some responsibility for the population's current size. The ecology unit opposes the plan: it argues that feeding now would mainly postpone and sharpen the eventual crash, habituate wild animals to human provision, and set a precedent under which every seasonal hardship becomes a welfare emergency; and that mass contraception is a large, open-ended intervention in a functioning system whose fluctuations are not the authority's to flatten. The board wants a decision document, not a survey of positions. Write the memo I will bring to the board: it should recommend approve, reject, or approve with conditions; set out a general principle for when the authority may intervene to reduce foreseeable wild animal suffering, stated so the board can use it as standing guidance for future requests; and respond to the strongest argument for the position you reject rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Ethics Advisory Committee.
      *   **Audience:** The Board of the Regional Conservation Authority.
      *   **Task:** Write a written recommendation memo regarding a proposal to intervene in an elephant die-off.
      *   **Context:**
          *   Fenced reserve.
          *   Two waterholes already maintained by staff (partial intervention exists).
          *   Elephant population > rainfall carrying capacity.
          *   Policy: Generally non-interventionist. Feeding/treating only for threatened extirpation. Culling only *in extremis*.
          *   Situation: Severe drought, collapsed browse/grass, elephants losing condition/dying (including calves).
          *   Proposal: Emergency supplementary feeding + multi-year immunocontraception.
          *   Argument For: Suffering outweighs "unmanaged baseline" value; fence/water management implies responsibility.
          *   Argument Against (Ecology Unit): Postpones/sharpens crash, habituation, slippery slope (welfare emergency precedent), contraception is too much intervention in a functioning system.
      *   **Requirements:**
          *   Recommend: Approve, Reject, or Approve with Conditions.
          *   Set out a *general principle* for future intervention (standing guidance).
          *   Respond to the *strongest argument* for the rejected position (don't dismiss it).
          *   Tone: Decision document, authoritative, ethical, practical.

  2.  **Determine the Recommendation:**
      *   *Option A: Reject.* Aligns with current strict policy. Respects ecological integrity. But ignores the specific context (fenced, water-managed) which creates a moral hazard/responsibility issue. Letting hundreds starve when the authority contributed to the overpopulation (via water management) seems ethically shaky.
      *   *Option B: Approve (Unconditional).* Solves immediate suffering. Risks the slippery slope and ecological damage cited by Ecology Unit. Ignores the long-term sustainability.
      *   *Option C: Approve with Conditions.* This is the most nuanced and ethically robust path. It acknowledges the authority's complicity (water management + fencing) while mitigating the risks (habituation, dependency, precedent). It allows for immediate welfare relief but ties it to strict population control to prevent recurrence.
      *   *Decision:* **Approve with Conditions.** This balances welfare and ecology while establishing a clear precedent for *when* intervention is justified (complicity + severity).

  3.  **Drafting the General Principle:**
      *   Needs to be applicable to future requests, not just this one.
      *   Must bridge the gap between "non-intervention" and "welfare responsibility."
      *   Key factor: *Authority Complicity.* The fence and waterholes make this different from a truly wild system.
      *   Key factor: *Severity of Suffering.*
      *   Key factor: *Ecological Sustainability.* Intervention shouldn't just delay the crash; it must prevent the *cause* of the crash (overpopulation relative to modified capacity).
      *   *Draft Principle:* Intervention is permissible when the Authority's prior management actions materially contributed to the risk, the suffering is severe, and the intervention includes measures to restore ecological balance without causing greater long-term harm.

  4.  **Addressing the Strongest Counter-Argument:**
      *   *Strongest Argument:* The Ecology Unit's point that feeding postpones/sharpens the crash and creates dependency/habituation. This is a strong ecological and ethical argument against short-termism.
      *   *Response:* Acknowledge validity. Feeding *alone* would be wrong. That's why the recommendation ties feeding *strictly* to contraception. The feeding is a bridge to the population reduction, not a permanent subsidy. This mitigates the "sharpened crash" risk by lowering the population *before* the next drought.

  5.  **Structuring the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Recommendation:** Clear statement upfront.
      *   **Ethical Framework/General Principle:** The standing guidance requested.
      *   **Application to Current Proposal:** Why this fits the principle.
      *   **Addressing Counter-Arguments:** Specifically the Ecology Unit's concern.
      *   **Conditions:** Specific constraints on the approval.
      *   **Conclusion:** Final wrap-up.

  6.  **Refining the Tone:**
      *   Needs to be formal, decisive, and ethical.
      *   Avoid waffling.
      *   Use terms like "moral complicity," "ecological integrity," "mitigation."
      *   Ensure the distinction between "wild" and "managed reserve" is clear.

  7.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Header:* Standard.
      *   *Rec:* Approve with Conditions.
      *   *Principle:* The "Complicity & Capacity" principle. If we modify the environment (fence/water), we own the consequences of the resulting population dynamics.
      *   *Reasoning:* The reserve isn't truly wild. We kept water flowing, allowing elephants to exceed rainfall capacity. We are partially responsible.
      *   *Counter-argument:* Ecology Unit says feeding delays the crash. True. But contraception fixes the root cause. Feeding is only ethical if paired with population control.
      *   *Conditions:* Time-limit on feeding. Mandatory contraception targets. Monitoring for habituation.
      *   *Future Guidance:* Use the principle drafted above.

  8.  **Review against Constraints:**
      *   *Recommendation clear?* Yes.
      *   *General Principle included?* Yes.
      *   *Respond to strongest rejected argument?* Yes (Ecology Unit's "postponed crash" argument).
      *   *Decision document style?* Yes, not a survey.

  9.  **Final Polish:** Check for clarity, flow, and ethical weight. Ensure the distinction between "welfare" and "ecological integrity" is balanced. (Self-Correction: Make sure the principle isn't *too* broad, or it opens the floodgates. Emphasize the "material contribution" by the Authority.)

  10. **Final Output Generation** (Proceeding to generate the memo based on these thoughts).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm overriding the Ecology Unit entirely. Their concerns are valid. The conditions must reflect their input to show the committee listened. The contraception is the key link that satisfies the Ecology Unit's long-term concern while addressing the Ethics Committee's welfare concern.

  *(Refining the Principle)*: Let's call it the "Stewardship Complicity Principle." It sounds official.
  *(Refining the Counter-Argument)*: Explicitly state that without contraception, the Ecology Unit would be right. With it, their concern is mitigated.

  11. **Final Polish of the Text:** Ensure the voice is appropriate for an Ethics Advisory Committee member speaking to a Board. Professional, principled, actionable.cw
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Conservation Authority
  **FROM:** Ethics Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Elephant Population Intervention Proposal

  **RECOMMENDATION**

  The Ethics Advisory Committee recommends that the Board **APPROVE WITH CONDITIONS** the proposal for emergency supplementary feeding and immunocontraception.

  Approval is contingent upon the binding commitment that supplementary feeding is strictly time-limited to the current dry season and is inextricably linked to the immediate implementation of the multi-year immunocontraception programme. Feeding must not occur without the concurrent population reduction strategy.

  **GENERAL PRINCIPLE FOR FUTURE INTERVENTION**

  To provide standing guidance for future requests, the Committee establishes the following principle regarding intervention to reduce wild animal suffering:

  > **The Principle of Stewardship Complicity:**
  > The Authority may intervene to mitigate severe suffering in a wild population only when:
  > 1.  **Material Contribution:** The Authority's prior management decisions (e.g., fencing, artificial water provision) have materially altered the ecosystem's carrying capacity or restricted animal movement, thereby creating or exacerbating the risk of suffering; AND
  > 2.  **Restorative Intent:** The intervention is designed not merely to alleviate immediate symptoms but to restore the population to a level sustainable by the *natural* carrying capacity of the modified system; AND
  > 3.  **Proportionality:** The ecological impact of the intervention does not exceed the moral cost of the suffering it aims to prevent.

  This principle distinguishes between truly wild systems, where non-intervention remains the default, and managed reserves, where the Authority assumes moral responsibility for the consequences of its infrastructure.

  **RATIONALE**

  The current situation meets the threshold of the *Principle of Stewardship Complicity*. While the Authority's general policy is non-interventionist, this reserve is not a closed wild system. The maintenance of two artificial waterholes has allowed the elephant population to exceed what rainfall alone would support. By artificially sustaining a population size that the natural browse cannot support during drought, the Authority has become a causal agent in the current crisis. To withhold intervention now would be to benefit from the population growth enabled by water management while disavowing responsibility for the starvation that results when browse fails.

  Furthermore, the fence prevents natural dispersal. In an unfenced system, elephants would migrate to find forage. Here, they are confined to a degrading environment. The moral weight of confinement necessitates a duty of care that exceeds that owed to fully wild populations.

  **RESPONSE TO THE ECOLOGY UNIT'S OBJECTION**

  The Committee acknowledges the Ecology Unit's opposition as the strongest argument against this proposal. They argue that supplementary feeding will merely postpone the population crash, habituate animals to human provision, and sharpen the eventual die-off by allowing the population to grow further beyond carrying capacity.

  **This objection is valid regarding feeding *in isolation*.** If the Board authorized feeding without population control, the Ecology Unit's prediction would likely come to pass: we would create a dependency loop that ends in a larger catastrophe.

  However, the Committee rejects the conclusion that intervention must therefore be withheld entirely. The proposal pairs feeding with immunocontraception. This combination addresses the root cause identified by the Ecology Unit. The feeding prevents immediate, severe suffering (the slow starvation of calves and adults), while the contraception ensures the population is reduced to a level where future droughts do not result in mass starvation. By tying the welfare intervention (feeding) to the ecological correction (contraception), we avoid the "sharpened crash" scenario. The intervention is not a subsidy for overpopulation, but a bridge to sustainability.

  **CONDITIONS OF APPROVAL**

  To ensure the intervention aligns with the *Principle of Stewardship Complicity* and mitigates the risks noted by the Ecology Unit, the following conditions apply:

  1.  **Cessation of Feeding:** Supplementary feeding must cease immediately at the onset of the next wet season, regardless of population numbers at that time. It is an emergency measure, not a permanent support system.
  2.  **Contraception Mandate:** The immunocontraception programme must commence within three months. If funding or logistical barriers prevent this, the feeding authorization is automatically revoked.
  3.  **Habituation Monitoring:** Staff must monitor elephant behavior for signs of habituation to human presence or vehicles during feeding. If significant habituation is detected, feeding methods must be altered or ceased.
  4.  **Review of Water Policy:** The Ecology Unit must submit a separate long-term plan regarding the management of the artificial waterholes to ensure future population growth aligns with natural browse capacity, not artificial water capacity.

  **CONCLUSION**

  A policy of non-intervention is ethically sound only when the system is truly self-regulating. In a fenced, water-managed reserve, the Authority has already intervened in the system's dynamics. We cannot claim the benefits of population stability during good years while claiming the hands-off high ground during bad ones. Approving this proposal with strict conditions acknowledges our complicity, alleviates acute suffering, and secures the long-term ecological integrity of the reserve.

  **Signed,**

  [Your Name]
  Member, Ethics Advisory Committee
