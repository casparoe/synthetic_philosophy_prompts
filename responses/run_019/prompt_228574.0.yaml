      *   *Refining the "Double Use":* The prompt says "the original gets read twice in two different modes." I need to make sure Elian realizes *he* must read it twice, or that the *user* of the new book will read it twice. Actually, the mechanism is usually: The machine reads the DNA as data to copy it, and as code to build the machine. In the scriptorium, the Scribe is the machine.
