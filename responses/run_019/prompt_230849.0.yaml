  Yes, there is a single coherent principle that saves all five of your verdicts. Your intuition is tracking a specific account of moral standing often discussed in philosophy: **standing is lost through hypocrisy, but only when that hypocrisy undermines the specific normative authority required to issue the blame.**

  Here is the precise principle, followed by the application to your new case and an analysis of your original verdicts.

  ### The Principle of Unresolved Normative Commitment

  **An agent lacks the standing to blame another for violating a moral norm *N* if and only if:**
  1.  **Normative Identity:** The agent is currently in violation of norm *N* (or a norm sufficiently similar that it draws upon the same underlying moral commitment); **AND**
  2.  **Unresolved Status:** The agent's violation is *unaddressed* (meaning they have not acknowledged, repented, rectified, or ceased the behavior).

  If either condition is missing—if the norms are distinct, or if the blamer's own fault has been morally resolved—they retain standing.

  ### Why This Saves Your Verdicts (Including Dave)

  This principle resolves the vagueness of "same kind" by focusing on the **underlying moral commitment** rather than the surface-level act.

  *   **Ben vs. Priya (The Resolution Condition):** Both involve the same norm (marital exclusivity). Ben fails condition #2 (he never told, so it's unaddressed); he loses standing. Priya passes condition #2 (she confessed and rebuilt); she retains standing.
  *   **The Teenager (The Resolution Condition):** Same norm (property rights/theft). But the teen passes condition #2 (remorse and cessation); they retain standing.
  *   **Dave's Two Cases (The Normative Identity Condition):** This is where your worry about "same kind" is most acute.
      *   *Dave (Tax):* Dave violates **financial honesty to the state**. The coworker violates **financial honesty to the state**. Normative Identity is met. Dave's behavior is ongoing/boasted (Unresolved). **Verdict: No Standing.**
      *   *Dave (Drunk Driving):* Dave violates **public safety and sober stewardship**. The friend violates **financial fiduciary trust (embezzlement)**. These protect different values (safety vs. property). Normative Identity is *not* met. **Verdict: Has Standing.**

  The principle survives Dave's cases because "breaking the law" is too broad a category. Moral norms are granular. Drunk driving does not undermine your authority to speak on financial trust, but tax cheating does.

  ### Application to the Expense Report Case

  **The Case:** A person padded expense reports for years (never caught) vs. A neighbor lying about a car accident.

  **Analysis:**
  1.  **Normative Identity:** Padding expense reports is **financial dishonesty for gain** (theft from an employer). Lying about a car accident is **financial dishonesty for gain/loss avoidance** (insurance fraud). Both violate the specific normative commitment to *honesty in transactional/financial claims*. They are sufficiently similar to meet Condition #1.
  2.  **Unresolved Status:** The blamer did this for years and "never got caught." This implies concealment without confession or restitution. The wrongdoing is unaddressed. Condition #2 is met.

  **Verdict:** Under this principle, the expense padder **lacks standing** to blame the neighbor. Their own unaddressed violation of financial honesty undermines their authority to appeal to that same norm.

  ### Do Any Verdicts Need to Be Sacrificed?

  Since the Principle of Unresolved Normative Commitment successfully coheres with all five of your original verdicts, **you do not need to give any of them up.**

  However, if you were pressed to defend this system against a philosopher who argued that "all wrongdoing corrupts moral authority generally" (a "Clean Hands" theory), the **cheapest verdict to give up would be Dave (Drunk Driving).**

  **Why?**
  The distinction between "Safety Norms" (Drunk Driving) and "Property Norms" (Embezzlement) is the finest grain of distinction in your set. A critic could argue that someone who recklessly endangers lives every weekend demonstrates a general disregard for the welfare of others that corrodes their standing to blame *anyone* for *any* moral failure, including financial theft.

  If you had to sacrifice one intuition to make your worldview more robust against that criticism, dropping the claim that Dave has standing in the embezzlement case would be the least costly. It preserves the stronger intuitions about infidelity (Ben/Priya) and redemption (Teenager/Priya), which rely on the more important variables of **resolution** and **intimacy**, rather than the technical categorization of legal norms.

  But as it stands? Your verdicts hang together perfectly well.
