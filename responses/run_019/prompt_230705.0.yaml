answer: |-
  ### Specification for a Theory of Free Will Worth Wanting

  This specification defines the necessary conditions for a theory of agency that satisfies the deep normative interests humans have in their own freedom, distinct from mere linguistic analysis or legal compatibility. It prioritizes **agency integrity** over metaphysical novelty.

  #### I. Cases the Theory Must Handle
  A viable theory must provide non-arbitrary verdicts on the following boundary cases. It must explain *why* the agent is or is not free in each, without shifting definitions mid-argument.

  1.  **The Manipulated Agent:** An agent whose values are implanted via neurosurgery or brainwashing (e.g., Mele’s Zygote argument).
      *   *Requirement:* Must distinguish between causal determination by past events + laws vs. causal determination by a *designer* intending specific outcomes.
  2.  **The Coerced Agent:** An agent acting under threat (gun to head).
      *   *Requirement:* Must distinguish external constraint on *action* from internal constraint on *will*.
  3.  **The Willing vs. Unwilling Addict:** (Frankfurt’s cases). One addict endorses the craving; the other fights it but yields.
      *   *Requirement:* Must explain why endorsement matters (or why it doesn't) for responsibility, distinct from mere ability to stop.
  4.  **Weakness of Will (Akrasia):** An agent acts against their own better judgment.
      *   *Requirement:* Must account for control loss that is internal rather than external.
  5.  **Frankfurt-Style Overdetermination:** An agent chooses X; a device would have forced X if they hesitated, but they chose X on their own.
      *   *Requirement:* Must determine if the *presence* of the device (even if unused) negates freedom, or if the actual sequence suffices.
  6.  **The Predictable Chooser:** An agent who self-endorses their values and acts predictably according to character.
      *   *Requirement:* Must clarify whether predictability undermines freedom or constitutes the stability required for agency.

  #### II. Distinctions the Theory Cannot Collapse
  The theory must maintain conceptual separation between the following, even if they overlap in practice.

  1.  **Freedom of Action vs. Freedom of the Will:**
      *   *Specification:* Freedom of Action is the ability to execute volitions (no paralysis, no chains). Freedom of the Will is the authority over the formation of volitions themselves. A theory of FWWW must primarily address the latter.
  2.  **Moral Responsibility vs. Agentic Dignity:**
      *   *Specification:* Must distinguish the license to blame/praise (social utility) from the internal status of being an author (dignity). A theory must explain what is lost if blame is downgraded to management, even if social order remains.
  3.  **Local Choice vs. Global Life-Shape:**
      *   *Specification:* Must distinguish freedom in a singular decision (local) from the capacity to shape one’s character and narrative over time (global). FWWW is often more concerned with the latter.

  #### III. Empirical and Theoretical Constraints
  The theory must not contradict established knowledge unless it provides overwhelming compensatory explanatory power.

  1.  **Causal Closure of the Physical:**
      *   *Specification:* Mental events cannot violate physical conservation laws. No "ghost in the machine" interventions.
  2.  **Psychological Continuity:**
      *   *Specification:* The agent must be psychologically continuous with their past and future selves to claim ownership of actions.
  3.  **The Intelligibility Condition:**
      *   *Specification:* Actions must be explicable by reasons. Pure randomness is not freedom.

  ---

  ### Classification of Requirements

  | Requirement | Status | Camp/Consideration |
  | :--- | :--- | :--- |
  | **Causal Closure** | **Non-Negotiable** | Required for any naturalistic worldview. Violated by Substance Dualism. |
  | **Psychological Continuity** | **Non-Negotiable** | Required for any coherent notion of "self" persisting through time. |
  | **Control (Actual Sequence)** | **Non-Negotiable** | If the agent plays no causal role in the output, it is not agency. |
  | **Categorical ADO** | **Parochial** | **Leeway Libertarians.** Demands the ability to do otherwise in the *exact* same causal situation. |
  | **Ultimate Sourcehood** | **Parochial** | **Source Libertarians.** Demands the agent be the *uncaused* cause of their will (regress stopper). |
  | **Reasons-Responsiveness** | **Parochial** | **Compatibilists (Fischer/Ravizza).** Demands sensitivity to reasons, accepts determinism, sacrifices categorical ADO. |
  | **Hierarchical Endorsement** | **Parochial** | **Compatibilists (Frankfurt/Dennett).** Demands alignment of 1st and 2nd order desires, sacrifices Ultimate Sourcehood. |
  | **Desert-Entailing Control** | **Non-Negotiable** | **FWWW Core.** If the theory cannot ground *basic desert* (not just forward-looking blame), it fails the "worth wanting" test for many. |

  ---

  ### IV. Joint Satisfaction of ADO and Ultimate Sourcehood in Naturalism

  **Can the Ability to Do Otherwise (ADO) and Ultimate Sourcehood (US) be jointly satisfied in a naturalistic picture?**

  **No.**

  *   **The Conflict:** In a naturalistic picture, events are either determined by prior causes or they are not.
      *   **If Determined:** You lack **Categorical ADO** (you could not have done otherwise given the past and laws). You also lack **Ultimate Sourcehood** (the causal chain originates prior to your birth).
      *   **If Undetermined (Indeterministic):** You may gain **Categorical ADO** (the future is open), but you lose **Ultimate Sourcehood** regarding *control*. If the choice is not determined by your character/reasons, it is random. Randomness does not constitute *sourcehood*; it constitutes luck.
  *   **The Naturalistic Bind:** Naturalism precludes an uncaused mental substance (which would be required for true US). Therefore, within naturalism, you must trade US for intelligibility, or ADO for control. You cannot have the "God's eye" origin point (US) and the "Open Future" (ADO) simultaneously without violating causal closure or succumbing to luck.

  ---

  ### V. The Single Exclusionary Requirement

  The single requirement that excludes the most popular accounts (specifically **Compatibilism**, which is the majority view among professional philosophers, and **Naturalistic Libertarianism**) is:

  **The Requirement of Non-Derivative Authorship (Ultimate Sourcehood).**

  *   **Why it excludes Compatibilism:** Compatibilists accept that the sources of the will are derivative (tracing back to genetics, environment, and luck). They argue this is *enough* for FWWW. If you demand Non-Derivative Authorship, Compatibilism fails immediately.
  *   **Why it excludes Naturalistic Libertarianism:** Naturalists cannot posit an uncaused cause without violating physics. Non-naturalistic Libertarians satisfy this but fail the "Naturalistic" constraint.
  *   **Why it is the bottleneck:** This is the core of the "worth wanting" intuition. People want to be the *authors* of their lives, not merely the *conduits* of prior causes. Most theories fail because they redefine "author" to mean "conduit that endorses the flow."

  ---

  ### VI. Brief Scoring of Named Views Against Specification

  *   **Hard Determinism:**
      *   *Score:* Fails.
      *   *Reason:* Denies the Control Condition. Satisfies Naturalism but abandons FWWW entirely.
  *   **Classical Libertarianism:**
      *   *Score:* Fails.
      *   *Reason:* Satisfies ADO and US intuitively, but violates **Causal Closure** (Non-Negotiable). Relies on non-natural causation.
  *   **Hierarchical Compatibilism (Frankfurt/Dennett):**
      *   *Score:* Partial Pass.
      *   *Reason:* Handles Addiction and Coercion well. Maintains Naturalism. Fails **Non-Derivative Authorship** (Parochial but central to FWWW intuition). Collapses Freedom of Will into Freedom of Action (higher-order).
  *   **Reasons-Responsiveness Compatibilism (Fischer):**
      *   *Score:* Partial Pass.
      *   *Reason:* Handles Frankfurt cases elegantly. Maintains Naturalism. Fails **Categorical ADO**. Sacrifices "Ultimate" Sourcehood for "Guidance" Control.
  *   **Strawsonian Reactive Attitudes:**
      *   *Score:* Pass (Pragmatic).
      *   *Reason:* Sidesteps metaphysics. Satisfies **Moral Responsibility** but dissolves **Agentic Dignity**. Fails if the user wants metaphysical grounding, succeeds if they want social function.

  **Summary:** To satisfy the specification fully, a theory must explain how **Non-Derivative Authorship** emerges from **Derivative Causes** without magic. No current naturalistic account successfully meets this without redefining "Authorship."
