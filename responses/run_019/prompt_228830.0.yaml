answer: |-
  Welcome to the field. Your intuition as a scientist serves you well here: you have spotted a discrepancy between the experimental data (what Moore actually wrote) and the press release (what the popular book claims).

  In philosophy, popular summaries often smooth over the jagged edges of an argument to make it fit a narrative. In this case, the book has conflated G.E. Moore's specific logical proof with a later, more dismissive attitude toward skepticism (likely influenced by Ludwig Wittgenstein, who came after Moore).

  Here is a breakdown of that summary, calibrated to your background.

  ### 1. What Moore Would Endorse
  The book gets the basic mechanics of the argument right. In his 1939 paper *Proof of an External World*, Moore essentially did exactly what the book says.

  *   **The Gesture:** Moore famously held up his right hand, made a specific gesture, and said, "Here is one hand." He then held up his left and said, "Here is another."
  *   **The Deduction:** He argued that if hands exist, then external objects exist. If external objects exist, an external world exists.
  *   **The Hierarchy of Certainty:** The book is correct that Moore believed "common sense" propositions (e.g., "I have a body," "The earth existed before I was born") are more certain than the abstract philosophical premises used to doubt them.

  If you showed Moore the first half of that summary, he would nod. He believed he had met the formal criteria for a proof: the premises were different from the conclusion, the premises were true, and the conclusion followed logically.

  ### 2. The Blurred Distinction: Existence vs. Knowledge
  Your vague sense that "proving the external world exists" and "refuting the skeptic" might be different jobs is precisely correct. This is the most critical nuance the book glosses over.

  Moore distinguishes between two different claims:
  1.  **I can prove the external world exists.**
  2.  **I can prove that I *know* the external world exists.**

  Moore claims he has accomplished #1. He admits he has **not** accomplished #2.

  **The Chemist's Analogy:**
  Imagine you present data from a spectrometer.
  *   **Moore's move:** He points to the readout and says, "This peak indicates the presence of Compound X. Therefore, Compound X exists."
  *   **The Skeptic's move:** The skeptic asks, "How do you know the spectrometer is calibrated? How do you know you aren't hallucinating the readout?"
  *   **The Book's summary:** Claims Moore proved the spectrometer is calibrated.
  *   **Moore's actual position:** Moore says, "I know Compound X exists because I see the peak. However, I cannot *prove* to you that I *know* the peak is real without assuming the spectrometer works—which is exactly what you are doubting."

  Moore admits that against a radical skeptic (someone who doubts your senses entirely), his proof is dialectically useless. It doesn't *force* the skeptic to surrender. Moore's point is that he is under no obligation to surrender his common sense just because the skeptic demands a proof of knowledge that is impossible to give without circularity.

  The book blurs this by saying Moore "refuted" the skeptic. Moore would say he refuted the *claim that the external world doesn't exist*, but he acknowledges he hasn't silenced the skeptic's *doubt about how we know it.*

  ### 3. The "Begs the Question" Objection
  The book suggests philosophers who complain about circularity "miss the point." This is too dismissive.

  In logic, "begging the question" means assuming the conclusion in your premise.
  *   **Premise:** Here is a hand (an external object).
  *   **Conclusion:** External objects exist.

  The skeptic argues: "You can only assert 'Here is a hand' if you already assume 'External objects exist.' Therefore, you are assuming what you are trying to prove."

  Moore does not dismiss this objection as a mistake. He acknowledges that his proof does not satisfy the skeptic's demand for a non-circular justification. Instead, Moore shifts the ground. He argues that **certainty is not distributed evenly.**

  He posits that the proposition "Here is a hand" is *more certain* than the logical rule that says "You cannot assume what you are trying to prove." For Moore, it is more rational to accept the proof and ignore the logical technicality than to accept the logical technicality and deny the hand.

  So, the book is wrong to imply the objection is invalid. The objection is valid; Moore just thinks his premise is strong enough to withstand it.

  ### 4. The Final Conclusion: Was Skepticism "Never Serious"?
  This is where the book's author is overreaching significantly.

  Moore took skepticism very seriously. He spent decades engaging with it. He did not think it was a frivolous position; he thought it was a profound error, but one that required careful logical dismantling. He treated the skeptic as an opponent who had made a mistake in weighing evidence, not as someone playing a game.

  The idea that "skepticism was never a serious position" sounds much more like **Ludwig Wittgenstein** (specifically his later work *On Certainty*), who argued that skepticism is a misuse of language—that doubting everything leaves you with no language to express the doubt.

  By attributing this view to Moore, the book is engaging in a bit of historical revisionism. It is trying to sell you a "victory lap" narrative: *Philosophy had a problem, Moore solved it, now we can stop worrying.*

  In reality, Moore's proof is generally considered by professional philosophers to be **unsatisfying**, not because it's wrong, but because it doesn't engage with the *source* of the skeptic's anxiety. It's like a physicist responding to a question about quantum uncertainty by holding up a baseball and saying, "This has a definite position." The skeptic is asking about the fundamental nature of justification; Moore is pointing to an object.

  ### Summary for the Outsider
  If we treat this like a peer review of the book's summary:

  1.  **Accuracy:** The description of the hand gesture and the basic deduction is accurate.
  2.  **Precision:** It fails to distinguish between proving *existence* and proving *knowledge of existence*, a distinction Moore cared about deeply.
  3.  **Objections:** It unfairly dismisses the "begging the question" objection. Moore didn't think the objection was wrong; he thought his common sense was stronger than the objection.
  4.  **Conclusion:** The claim that skepticism "was never serious" is the author's opinion, not Moore's. Moore treated skepticism as a serious error, not a non-issue.

  **Verdict:** The book gives you the "abstract" without the "experimental details." As a chemist, you know that the abstract often hides the complications that make the work interesting. Moore's argument is a fascinating failure: it shows that you can be logically correct and yet fail to persuade your opponent. That tension is where the real philosophy lies, and the book skips right over it.
