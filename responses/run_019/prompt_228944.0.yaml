      *   **Solving the Portfolio vs. Credit Card Puzzle:**
          *   This is the crux. Both involve stress.
          *   Portfolio: Information tempts you to *deviate* from a known optimal long-term plan. The information is *noise* relative to the strategy.
          *   Credit Card: Information is *signal* required to execute the plan (paying the debt). Ignoring it isn't strategic; it's negligence. The stress is a barrier to entry, not a consequence of rational processing.
