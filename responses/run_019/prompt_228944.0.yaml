          2.  The agent maximizes expected utility based on posterior beliefs.
          3.  The information is *costless* (including cognitive/emotional costs).
          4.  The agent can commit to the optimal action *after* receiving the info.
          5.  The utility function is stable and defined over outcomes, not beliefs (usually).
      *   *Where does it break?* If information changes the *utility function* (e.g., causes anxiety), if updating is non-Bayesian (bias), if there are costs to processing, or if the agent lacks commitment power (akrasia).

