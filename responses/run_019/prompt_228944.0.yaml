answer: |-
  You have identified one of the most famous tensions in decision theory. The result you are referencing is **Good's Theorem (1967)**, which proves that for a Bayesian agent maximizing expected utility, the expected value of free information is always non-negative.

  However, Good's Theorem relies on specific assumptions that often fail in the real world. When those assumptions break, "strategic ignorance" becomes rational.

  Here is the principle that reconciles the theorem with your intuitions, distinguishes your portfolio from your credit card, and adjudicates your sister's case.

  ### The Principle: Rational Ignorance under Bounded Agency

  Good's Theorem assumes three things that your counterexamples violate:
  1.  **Stable Utility:** Your utility depends only on *world states*, not on your *beliefs* (i.e., you don't suffer from "bad news" itself).
  2.  **Perfect Agency:** Once you have the information, you will actually take the optimal action it suggests (no akrasia, panic, or bias).
  3.  **Epistemic Integrity:** Observing the data does not corrupt the validity of the data itself.

  When any of these fail, information can have negative expected value. We can formalize a **Modified Value of Information** equation:

  $$ \text{Net Value} = \text{Instrumental Gain} - \text{Processing Cost} - \text{Risk of Suboptimal Action} $$

  *   **Instrumental Gain:** How much better are your decisions *if* you process the info correctly?
  *   **Processing Cost:** The emotional/cognitive toll of knowing (dread, stress).
  *   **Risk of Suboptimal Action:** The probability that knowing will trigger a *worse* action than ignorance (panic selling, bias).

  If the sum of Costs and Risks exceeds the Instrumental Gain, ignorance is rational.

  ---

  ### Resolving the Portfolio vs. Credit Card Puzzle

  You noted these look structurally similar (both involve financial stress), but your verdicts differ. Here is why they are fundamentally different under the principle above.

  **1. The Portfolio Case (Rational Ignorance)**
  *   **Optimal Policy:** Buy and hold long-term.
  *   **Default Action (if ignorant):** Do nothing (Hold).
  *   **Effect of Information:** Daily fluctuations are mostly noise. However, you know yourself: if you see a drop, you feel pain (Processing Cost) and might panic sell (Risk of Suboptimal Action).
  *   **Analysis:** Since the *default action* (doing nothing) is already the optimal strategy, information offers little **Instrumental Gain**. It primarily introduces **Risk** (tempting you to deviate) and **Cost** (stress).
  *   **Verdict:** Ignoring the info is a **commitment device**. You are protecting your optimal long-term strategy from your own short-term biases.

  **2. The Credit Card Case (Avoidant Negligence)**
  *   **Optimal Policy:** Pay the balance in full to avoid interest.
  *   **Default Action (if ignorant):** Do nothing (Don't pay).
  *   **Effect of Information:** The statement tells you *how much* to pay.
  *   **Analysis:** Here, the *default action* (doing nothing) is **catastrophic** (interest, fees, credit score damage). Information is required to execute the optimal action. The stress (Processing Cost) is real, but the **Instrumental Gain** of avoiding debt spiral is massive.
  *   **Verdict:** Ignoring the info is **self-sabotage**. Unlike the portfolio, where ignorance preserves the right action, here ignorance *prevents* the right action.

  **The Distinction:** In the Portfolio case, ignorance protects a **known optimal default**. In the Credit Card case, ignorance enforces a **known suboptimal default**.

  ---

  ### Analyzing the Other Cases

  Using the **Net Value** framework, we can categorize your examples:

  1.  **Untreatable Disease (Fine):**
      *   *Instrumental Gain:* Zero (no treatment exists).
      *   *Processing Cost:* High (30 years of dread).
      *   *Verdict:* **News Utility Violation.** Since utility depends on your state of mind, bad news directly lowers utility. Good's Theorem doesn't apply.

  2.  **Judge / Hiring Committee (Right):**
      *   *Instrumental Gain:* Low (prior record/names shouldn't legally matter for bail/merit).
      *   *Risk of Suboptimal Action:* High (known cognitive bias).
      *   *Verdict:* **Bounded Agency.** The agent knows their own updating rule is flawed (prejudice vs. evidence). Ignoring info prevents the corruption of the decision process.

  3.  **Scientist Peeking (Right):**
      *   *Verdict:* **Epistemic Integrity Violation.** Peeking invalidates the stopping rule. The "information" isn't just data; it's data that renders the trial's conclusion statistically meaningless. The cost is the loss of the trial's validity.

  4.  **Roommate/Credit Card (Idiot):**
      *   *Verdict:* As analyzed above. The cost of ignorance (financial ruin) vastly outweighs the processing cost (stress).

  ---

  ### The Verdict on Your Sister

  **Case:** She doesn't want to know if her husband cheated years ago.

  **Application of the Principle:**
  This depends entirely on whether the information has **Instrumental Gain**.

  *   **Scenario A (Pure News Utility):** She has already decided she will stay with him regardless, and the cheating poses no ongoing health/safety risk.
      *   *Instrumental Gain:* Zero.
      *   *Processing Cost:* High (destroyed image of the past, resentment).
      *   *Prediction:* **Her refusal is rational.** Like the disease test, the information changes her beliefs but not her optimal actions. Knowing only inflicts pain.

  *   **Scenario B (Instrumental Action):** The cheating indicates a pattern of behavior that might recur, or affects her health (STIs), or changes her assessment of the relationship's viability.
      *   *Instrumental Gain:* High (allows her to protect herself or make an informed choice about the marriage).
      *   *Processing Cost:* High.
      *   *Prediction:* **Her refusal is irrational avoidance.** Like the credit card, ignoring the info prevents her from taking necessary corrective action (therapy, divorce, medical check).

  **My Read:** Since you say you are "torn," it suggests the cheating is in the past with no clear ongoing threat. If the relationship is stable *now*, knowing about the past often functions like the **Disease Test**: it creates dread without enabling a cure. In that specific context, her ignorance is a rational protection of her current utility, compatible with a modified decision theory that accounts for "utility over beliefs."

  ### Summary

  Good's Theorem is correct for **idealized processors** who care only about **outcomes**.

  Your intuitions are correct for **bounded humans** who care about **beliefs** and know their own **weaknesses**.

  *   **Ignore info** when it triggers bias/panic (Portfolio, Judge) or causes pain without enabling action (Disease, Sister-Scenario A).
  *   **Seek info** when it is required to execute a necessary action (Credit Card, Sister-Scenario B).

  The difference is never about the information itself; it is about **what you will do with it, and what you will do if you don't have it.**
