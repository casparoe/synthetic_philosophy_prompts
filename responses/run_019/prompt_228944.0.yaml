              *   *Why does the user think Credit Card is "idiot"?* Because the fees are objective and large, while the stress is subjective and manageable. In the Portfolio case, the panic trade is a *guaranteed* loss if the agent knows themselves.
              *   *Principle:* **Net Expected Value including Processing Costs.**
