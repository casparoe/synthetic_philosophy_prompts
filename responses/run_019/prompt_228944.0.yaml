          *   Credit Card: The information (balance due) is *necessary* to execute the optimal strategy (pay bill). Ignoring it makes the optimal strategy impossible. The stress is a bug, not a feature of the decision logic.
          *   *Refinement:* In the Portfolio case, the agent has a **pre-existing optimal policy** (hold) that is vulnerable to information. In the Credit Card case, the agent needs information to **formulate** the optimal policy (how much to pay).
