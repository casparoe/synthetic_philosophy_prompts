answer: |-
  # Session Plan: The Architecture of Reversal (Simpson's Paradox)

  **Target Audience:** Humanities Graduate Students (2 Hours)
  **Goal:** Move from "Statistics are lying" to "Aggregation structures meaning," while distinguishing mathematical necessity from interpretive choice.

  ---

  ## 1. The Carrying Example: "The University Admissions Case"

  **Decision:** Use a **simplified, rounded version of the 1973 Berkeley Admissions data**.
  **Why:** Humanities students engage readily with narratives of institutional bias, gatekeeping, and demographic categories. Medical examples (kidney stones) often feel distant; purely invented examples (colored balls) feel trivial. Berkeley feels *stakes-heavy*, which fuels the argument about which number matters.

  **The Data (Projected on Board/Screen):**
  Keep it to two Departments (A & B) and two Applicant Genders (Men & Women). Use integers.

  | Department | Gender | Applied | Admitted | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Dept A** | Men | 800 | 480 | 60% |
  | | Women | 100 | 70 | 70% |
  | **Dept B** | Men | 200 | 20 | 10% |
  | | Women | 800 | 120 | 15% |
  | **TOTAL** | **Men** | **1000** | **500** | **50%** |
  | | **Women** | **900** | **190** | **~21%** |

  **Features this example must have:**
  1.  **Consistent Subgroup Advantage:** In *both* Dept A and Dept B, Women have a higher acceptance rate than Men.
  2.  **Aggregate Reversal:** In the *Total* row, Men have a vastly higher acceptance rate than Women.
  3.  **Skewed Distribution:** Men mostly apply to the "easy" department (A); Women mostly apply to the "hard" department (B).
  4.  **Avoid:** Decimal points (round to whole percentages), more than two subgroups (keep it binary), or a third outcome variable.

  ---

  ## 2. Dependency Order: The Sequence of Concepts

  Do not reveal the paradox immediately. Build the conceptual scaffolding so the reversal registers as structural, not computational.

  **Step 1: Marginal vs. Conditional Comparison (15 mins)**
  *   **Action:** Cover the Department rows. Show only the **TOTAL** row. Ask: "Is there a gender disparity here?" (Yes, Men favored).
  *   **Action:** Uncover the **Department** rows. Ask: "Is there a gender disparity here?" (Yes, Women favored in both).
  *   **Concept:** Distinguish the *Marginal* association (overall) from the *Conditional* association (within groups).
  *   **Why:** Students must see these as two different questions, not one right and one wrong calculation.

  **Step 2: The Weighting Mechanism (30 mins)**
  *   **Action:** Ask students to manually verify the Total Rate. (500/1000 vs 190/900). Confirm the math is not broken.
  *   **Action:** Ask: "How is the Total Rate built from the Department Rates?" Guide them to see it is a **weighted average**, not a simple mean of 60% and 10%.
  *   **Concept:** The Total is dominated by the departments with the most applicants.
  *   **Why:** This kills the "arithmetic mistake" misconception. The reversal happens because the *weights* (application volume) are correlated with the *rates* (difficulty).

  **Step 3: The Lurking Variable (30 mins)**
  *   **Action:** Ask: "Why did women apply to Dept B so much more than men?"
  *   **Concept:** Introduce the stratifying variable (Department) not just as a label, but as a *filter* that sorts the population unevenly.
  *   **Why:** This shifts focus from the numbers to the *process* that generated the numbers.

  **Step 4: The Interpretive Crisis (45 mins)**
  *   **Action:** Pose the friend's argument: "Which number tells us if the university is biased?"
  *   **Concept:** Separate the *existence* of the paradox (math) from the *resolution* of the paradox (causal story).
  *   **Why:** This is where the settled/contested line is drawn.

  ---

  ## 3. Mapping Misconceptions to Intervention Points

  | Misconception | When it arises | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"Someone added the numbers wrong."** | Step 1 (The Reveal) | **Do not explain yet.** Have a student calculate the totals on the board. Verify the reversal is arithmetically sound before discussing *why*. |
  | **"Statistics can prove anything."** | Step 2 (The Mechanism) | **Reframe:** "Statistics don't prove anything; *pooling* hides information. This isn't magic; it's the specific consequence of averaging rates with different weights. It is predictable, not arbitrary." |
  | **"The subgroup is the 'true' number."** | Step 4 (Interpretation) | **Challenge:** "Suppose Dept B is Engineering and requires math prerequisites women were historically discouraged from taking. Is the Dept B rate 'fair' if the pipeline was biased upstream? The subgroup number is real, but is it the *answer*?" |
  | **"Unequal group sizes cause the flip."** | Step 2 (Weighting) | **Clarify:** "Unequal sizes alone don't do it. If Dept A and B had the same difficulty, the flip wouldn't happen. It requires unequal sizes *plus* different baseline success rates." |

  ---

  ## 4. The Red Line: Settled vs. Contested

  You must explicitly mark this boundary. Do not let the session conclude with a consensus on "which number to trust."

  **The Settled (Mathematical Structure):**
  *   It is a fact that $P(Admitted|Men) > P(Admitted|Women)$ while $P(Admitted|Men, Dept) < P(Admitted|Women, Dept)$ for all Depts.
  *   It is a fact that this occurs due to the arithmetic of weighted averages where the weights (application volume) are correlated with the outcome (admission difficulty).
  *   **Teaching Check:** Ensure everyone agrees the math is not in dispute.

  **The Contested (Causal/Methodological):**
  *   **The Question:** Does "Gender" cause "Admission"? Or does "Gender" cause "Department Choice," which causes "Admission"?
  *   **The Debate:**
      *   *View A:* The aggregate is the truth. The university admits fewer women overall; the department choice is irrelevant to the institution's output.
      *   *View B:* The subgroups are the truth. We must compare like-with-like. If women choose harder departments, that is a societal issue, not admissions bias.
      *   *View C:* Department choice is a *mediator*, not a confounder. Controlling for it hides the discrimination that happened *before* application.
  *   **Teaching Check:** Do not resolve this. End the session by asking: "What additional information would you need to decide which number to publish in the newspaper?" (e.g., data on GPA, prep courses, societal pressure).

  ---

  ## 5. Assessment: How to Know They Understand

  Do not test them on calculating the rates. Test them on **structural intuition**.

  **The "Exit Ticket" Scenario (Last 15 mins):**
  Present a new, verbal scenario (no numbers):
  > "A study shows Coffee Drinkers have lower heart disease rates than Non-Drinkers. However, when you split by Age, Non-Drinkers have lower rates in *both* Young and Old groups. Young people drink way more coffee than Old people."

  **Ask two questions:**
  1.  **Mechanism:** "Without doing math, describe the weighting structure that makes this possible." (Expected answer: Young people have lower heart disease generally; they also drink more coffee. Their low disease rate drags down the Coffee average.)
  2.  **Interpretation:** "Does this prove coffee is bad for you?" (Expected answer: No, it proves the math allows the reversal. Whether coffee is bad depends on whether Age is a confounder or if there are other factors like stress/sleep.)

  **Success Criteria:**
  *   **Fail:** They say "The first number is a lie" or "You need a bigger sample size."
  *   **Pass:** They say "The Coffee group is younger on average, so it looks healthier," AND they hesitate to declare coffee "bad" without knowing *why* young people drink coffee.

  ---

  ## 6. Deliberate Omissions (What to Leave Out)

  To keep this within 2 hours and appropriate for the audience, explicitly refuse to cover:

  1.  **Causal Diagrams (DAGs):** Do not draw arrows or use terms like "collider" or "d-separation." It creates a false sense of formal resolution. Use narrative chains instead ("A leads to B which leads to C").
  2.  **Statistical Significance:** Do not mention p-values or confidence intervals. This paradox happens in population data; significance testing confuses the structural issue with sampling noise.
  3.  **The "Solution":** Do not teach Mantel-Haenszel tests or regression adjustment. The goal is *reasoning*, not *correction*.
  4.  **Continuous Variables:** Keep everything categorical (Men/Women, Dept A/B). Continuous stratifying variables complicate the visualization unnecessarily.

  ## 7. Facilitator's Note on Tone

  Your role is not to be the statistician who saves them from error, but the moderator who shows them where the terrain is tricky.
  *   **When they argue:** Validate the argument. "Person A is arguing for the Aggregate. Person B is arguing for the Conditional. Both are reading the table correctly. They are answering different questions."
  *   **When they feel cynical:** Acknowledge it. "This is why you were right to be suspicious of the headline. But now you know *exactly* where the suspicion should be directed: not at the calculation, but at the grouping."

  **Closing Statement:**
  "Simpson's Paradox does not mean numbers lie. It means that 'overall' is a specific kind of story, and 'broken down' is a different kind of story. The paradox forces you to decide which story you intend to tell."
