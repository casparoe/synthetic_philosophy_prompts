      *(Refining the "Strict vs. Fit" section)*: Strict presupposition = Meaning is not identical to mental state. Comfortable fit = Dictionaries are reliable records of that meaning. The latter is empirical, the former is philosophical.

      *(Refining the "Coherence" section)*: The "General vs. Legal" tension is key. If I'm a citizen, I speak English. If I'm a regulated entity, I speak Regulatory English. Textualists claim the former to promote democracy, but apply the latter in practice.

      *(Refining the "Intentionalism" section)*: Be specific. "Floor statements" move from "dangerous" to "decisive."

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This practice is the hallmark of modern **textualism**, specifically the variant known as **Original Public Meaning (OPM)**. To understand why a judge trusts *Webster's* more than a Senator's diary, we must excavate the philosophy of language buried beneath the procedure.

  Here is a reconstruction of the implicit theory, an assessment of its coherence, and a projection of what would change under a rival theory.

  ### I. The Implicit Theory of Meaning

  For a dictionary to outrank a drafter, the legal system must presuppose a specific ontology of meaning. It commits to **Semantic Conventionalism** over **Speaker Intentionalism**.

  **1. What Meaning Must Be Like**
  *   **Meaning is Public, Not Private:** The practice presupposes that the meaning of a statute does not reside in the mental states of the legislators (their hopes, expectations, or private agreements). If meaning were mental, the drafter would be the ultimate authority. By rejecting the drafter, the court asserts that meaning is an objective feature of the text itself, constituted by shared linguistic conventions.
  *   **Meaning is Fixed at Enactment:** The search for historical dictionaries implies that meaning is temporally locked. The statute is a fossil; its semantic content was determined at $T_{enactment}$ and cannot evolve unless the text is amended.
  *   **Meaning is Detachable from Purpose:** The practice assumes that semantic content can be identified *prior* to determining the law's purpose. The words have a "plain meaning" that constrains what purposes the law can legitimately be said to have.

  **2. The Model of Communication**
  The practice assumes a **Broadcast/Notice Model** of legislation, rather than a **Collaborative/Trust Model**.
  *   **The Legislature as Encoder:** The legislature's job is to encode a rule into the public code (English).
  *   **The Public as Decoder:** The citizen's obligation is to read the code using the standard key (ordinary language).
  *   **The Constraint of Notice:** Because the law binds those who did not participate in its drafting, fairness requires that the law be knowable without accessing internal legislative deliberations. Therefore, meaning is limited to what a "reasonable person" could ascertain from the text using public tools (dictionaries).

  ### II. Strict Presuppositions vs. Comfortable Fits

  You asked to distinguish what the practice *requires* versus what it merely *accommodates*. This is where the philosophical underdetermination lies.

  **1. Strictly Presupposed (The Non-Negotiables)**
  *   **The Separation of Meaning and Intent:** The system *must* assume that "what the words mean" is conceptually distinct from "what the speakers meant." If they were identical, excluding legislative history would be epistemically irrational.
  *   **The Priority of the Audience:** The understanding of the recipient (the public) trumps the intention of the sender (the legislature). This is an audience-oriented theory of meaning.
  *   **The Existence of a Stable Code:** There must be a fact of the matter about what words meant at $T_{enactment}$, independent of the specific context of the bill.

  **2. Merely Comfortable Fits (The Underdetermined Parts)**
  *   **The Reliability of Dictionaries:** The practice *fits* with the idea that dictionaries are accurate records of usage, but it does not *presuppose* it. A judge could theoretically believe dictionaries are flawed but still use them as the "least bad" objective proxy. The reliance on dictionaries is an epistemic heuristic, not a philosophical necessity.
  *   **"Ordinary" vs. "Technical" Meaning:** Textualism often claims to seek "ordinary meaning," but it comfortably accommodates "legal meaning" when convenient. The theory doesn't strictly dictate *which* community's conventions apply (see Coherence below), only that *some* conventional community exists.
  *   **The Number of Dictionaries:** Consulting multiple dictionaries suggests a belief that meaning is indeterminate or that consensus among lexicographers validates truth. This fits with a "consensus theory of truth" but isn't strictly required by semantic conventionalism (which could allow for one definitive source).

  **3. Rival Accounts of Meaning**
  *   **Ruled Out:** **Gricean Speaker Intentionalism.** This view holds that meaning *is* the complex intention of the speaker to produce an effect in the audience via recognition of that intention. By barring evidence of that intention (floor statements), the practice explicitly rejects Gricean semantics for law.
  *   **Ruled Out:** **Dynamic/ Living Tree Theory.** The idea that meaning evolves with contemporary values is incompatible with the search for historical dictionaries.
  *   **Compatible (but not required):** **Use Theory (Wittgenstein).** If "meaning is use," looking at how words were used in the wild (via dictionaries) is appropriate. However, strict textualism often ignores the specific "language game" of legislation in favor of general usage, which a pure Use Theorist might critique.
  *   **Compatible:** **Interpretive Community (Fish).** If the "community" is defined as the general public at the time of enactment, this fits. However, Fish argues meaning is *always* constructed by the interpreter's community. Textualists deny this construction, claiming to *find* pre-existing meaning. So, it fits only if one ignores the constructivist element of Fish's theory.

  ### III. Assessment of Coherence

  The practice suffers from internal tensions when scrutinized against its own philosophical commitments.

  **1. The Dictionary Lag Problem**
  *   *The Tension:* If meaning is fixed at enactment, a dictionary published *after* enactment is technically hearsay about prior usage. Yet courts often use current dictionaries to interpret old laws.
  *   *Coherence Check:* This is incoherent under a strict Original Public Meaning theory. A 2024 dictionary defines how we use words *now*, not how they were used in 1964. To be coherent, courts must strictly limit themselves to contemporaneous lexicography. When they don't, they are silently amending the law under the guise of interpretation.

  **2. The "Ordinary Person" Fiction**
  *   *The Tension:* Courts claim to use "ordinary meaning" (general community conventions) rather than "legal meaning" (legal community conventions).
  *   *Coherence Check:* This is pragmatically incoherent. Statutes regulate complex industries (tax, environment, finance). The "ordinary person" does not know what "navigable waters" or "security" means in these contexts.
  *   *The Implication:* By privileging general dictionaries over agency expertise or legislative context, the court pretends the statute is a general broadcast when it is actually a technical manual. This creates a gap between the *presupposed* audience (the public) and the *actual* audience (regulated entities/lawyers). A coherent theory would either admit it is using "legal conventions" or admit that "ordinary meaning" is a legal construct, not a linguistic fact.

  **3. Dictionary Shopping**
  *   *The Tension:* If meaning is objective and fixed, there should be one correct definition. Yet judges often cite three dictionaries to show a "consensus."
  *   *Coherence Check:* This reveals that the practice is not truly discovering pre-existing meaning but *constructing* it through argumentation. If meaning were truly fixed by convention, one authoritative source from the era would suffice. The need to pile on sources suggests the "objective meaning" is underdetermined, and the judge is using the dictionaries to rhetorically bolster a choice that the theory claims is not a choice.

  ### IV. The Shift to Forthright Intentionalism

  If the legal system abandoned Semantic Conventionalism and adopted **Forthright Intentionalism** (meaning = the actual mental states/goals of the enacting coalition), courtroom practice would undergo a radical transformation.

  **1. New Central Evidence**
  *   **Legislative History becomes Primary:** Committee reports, sponsor floor statements, and drafting memoranda would move from "secondary/forbidden" to "primary/decisive."
  *   **Rejected Amendments:** Evidence of what the legislature *refused* to pass would become highly probative of what they intended the passed text to exclude.
  *   **Post-Enactment Conduct:** Early administrative interpretations by the enacting administration might be treated as authoritative evidence of original intent.

  **2. Irrational Moves (What would stop)**
  *   **Dictionary Digging:** It would become irrational to spend pages debating the definition of "and" vs. "or" in *Webster's 1909* if the Committee Report explicitly states, "We used 'or' to mean 'and' in this context." The mental state overrides the conventional code.
  *   **The "Absurdity" Canon:** Currently, courts use this to avoid outcomes that violate public policy. Under intentionalism, this is redundant. If the intent is clear, the outcome is intended, even if absurd. If the intent is unclear, the court seeks more intent evidence, not policy fixes.
  *   **Strict Construction of Penalties:** The rule of lenity (ambiguity favors the defendant) relies on the idea that the text gave insufficient notice. If meaning is based on intent, and intent to punish is clear in a report, the defendant had "notice" of the legislative will, undermining the rationale for lenity.

  **3. What Would Survive?**
  *   **The Text:** The text would remain the *best evidence* of intent (people usually mean what they say), but it would no longer be the *exclusive* evidence. It would be rebuttable.
  *   **Stare Decisis:** Precedent would likely remain, though its justification would shift from "reliance on public text" to "stability of settled expectations."
  *   **Constitutional Avoidance:** Courts would still avoid interpreting statutes to be unconstitutional, but the reasoning would change: "The legislature could not have *intended* an unconstitutional act," rather than "The text does not *permit* it."

  ### Summary
  The current ritual commits the legal system to a **public-conventionalist** theory of meaning where **notice** trumps **accuracy**. It assumes the law is a code to be cracked by the public, not a promise made by the legislature. This is coherent only if one accepts that "ordinary meaning" is a stable, discoverable fact and that the general public is the relevant interpretive community. If you switch to intentionalism, the law becomes a **meeting of minds** (or a imposition of will), making the text a window into the legislature's head rather than a wall that confines it. The current practice survives not because it is philosophically superior, but because it constrains judicial discretion by pretending meaning is found, not made. Intentionalism admits meaning is reconstructed, which grants judges more power to weigh conflicting evidence of intent.
