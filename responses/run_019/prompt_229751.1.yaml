prompt: |-
  When courts interpret statutes, a familiar ritual unfolds: judges reach for general-purpose dictionaries—often several, sometimes editions from the era of enactment—to pin down the ordinary meaning of a contested word, while treating the legislature's own accounts of its handiwork (committee reports, floor statements, testimony from the bill's sponsors) as optional at best and inadmissible at worst. The result is a curious division of epistemic labor: the people who actually wrote the law are distrusted as witnesses to its meaning, while a lexicographer who never read the statute is treated as an authority on it. I find this puzzling, and I'd like to understand what it commits the legal system to. What picture of linguistic meaning does this practice presuppose? Reconstruct the implicit theory: what must meaning be like for a dictionary to outrank a drafter as evidence of it, and what must communication between a legislature and the public be assumed to consist in? Which rival accounts of meaning—speaker-intention views, use theories, audience-oriented or interpretive-community views—does the practice quietly rule out, and which does it merely happen not to need? Please distinguish carefully between what the practice strictly presupposes and what it merely fits comfortably with: I suspect parts of it are philosophically underdetermined and could be licensed by more than one theory, and I'd like to know which parts those are. Then assess coherence. For instance, can a court that insists meaning is fixed by public convention at the moment of enactment coherently explain why it sometimes consults contemporary dictionaries instead—and can it explain why the conventions of the whole linguistic community, rather than of the legal community or of legislators, are the relevant ones? Finally, tell me concretely what would have to change in courtroom practice if the implicit theory were replaced with a forthright intentionalism about statutory meaning: what new evidence would become central, what familiar moves would become irrational, and would anything about the current practice survive?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** Courts prioritize general-purpose dictionaries over legislative history (committee reports, floor statements, etc.) when interpreting statutes.
      *   **The Puzzle:** This privileges lexicographers (outsiders) over drafters (insiders).
      *   **The Task:**
          1.  Reconstruct the implicit theory of linguistic meaning presupposed by this practice.
          2.  Identify what meaning *must* be like for a dictionary to outrank a drafter.
          3.  Identify assumptions about legislative-public communication.
          4.  Distinguish between what is *strictly presupposed* vs. what merely *fits comfortably* (underdetermination).
          5.  Evaluate rival accounts of meaning (speaker-intention, use theories, audience-oriented, etc.) – which are ruled out, which are compatible?
          6.  Assess coherence (e.g., fixed meaning vs. contemporary dictionaries, general community vs. legal community conventions).
          7.  Concrete implications of switching to forthright intentionalism (what changes, what stays, what becomes irrational).

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Current Practice:* Textualism/Original Public Meaning (OPM).
      *   *Implicit Theory:* Meaning is public, conventional, and objective. It resides in the words themselves as understood by a reasonable person at the time of enactment.
      *   *Dictionary Role:* A proxy for public convention.
      *   *Legislative History Role:* Subjective intent, potentially unenacted, potentially unknown to the public.
      *   *Rival Theories:*
          *   Speaker Intentionalism (Meaning = what legislators meant): Ruled out by current practice.
          *   Audience Reception (Meaning = how public understood it): Compatible/Presupposed.
          *   Use Theory (Meaning = use in language games): Partially compatible but tricky (legal language game vs. ordinary).
          *   Interpretive Community (Fish): Compatible if the "community" is the general public, not just lawyers.
      *   *Coherence Issues:* Dictionaries are descriptive but lag behind usage. Why general English vs. Legal English?
      *   *Intentionalism Shift:* Focus on reports, speeches, drafts. Text becomes evidence of intent, not the sole container of meaning.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the astuteness of the observation. Frame the practice as "Textualism" or "Original Public Meaning."

      *   **Part 1: Reconstructing the Implicit Theory:**
          *   *What is Meaning?* It's not mental states; it's public convention. It's objective, not subjective.
          *   *Why Dictionary > Drafter?* The drafter's private intent is epistemically inaccessible or legally irrelevant. The law binds the public, so the public's understanding controls. The dictionary represents the "standard code."
          *   *Communication Model:* One-way broadcast. Legislature emits text; Public receives text based on shared code. If the code (dictionary) says X, it doesn't matter if the sender meant Y (unless Y is encoded in the text).

      *   **Part 2: Strict Presuppositions vs. Comfortable Fits (Underdetermination):**
          *   *Strict:* Meaning is distinct from psychological intent. Meaning is fixed at enactment. The audience is the general public (or reasonable person).
          *   *Comfortable Fit:* That dictionaries *accurately* capture meaning (they could be wrong but still the best proxy). That "ordinary meaning" is the only relevant meaning (could be technical legal meaning, but textualists prefer ordinary).
          *   *Rival Accounts:*
              *   *Speaker Intentionalism:* Ruled out (mostly).
              *   *Audience-Oriented:* Presupposed.
              *   *Use Theory:* Compatible if "use" = public usage at time T.
              *   *Interpretive Community:* Compatible if community = public.

      *   **Part 3: Assessing Coherence:**
          *   *Dictionary Lag:* Dictionaries record past usage. If meaning is fixed at enactment, a dictionary printed *after* enactment is hearsay about prior usage. A dictionary from the era is better evidence but still secondary.
          *   *General vs. Legal Community:* Textualists argue laws apply to everyone, so everyone's language counts. But laws are technical. This is a tension. The "reasonable person" is a legal construct, not a real person.
          *   *Multiple Dictionaries:* If meaning is objective, why do judges shop for definitions? This suggests the theory is masking discretion.

      *   **Part 4: The Shift to Forthright Intentionalism:**
