  ### Temporal Ontology Decision Tree for Fiction

  This tree sorts a story's implicit model of time based on plot mechanics and narrative assertions. Answer each question based strictly on what is shown or stated in the manuscript.

  **Question 1: The Reality of the Past**
  Can a character physically travel to, or directly observe through a device, a specific *distant* past event (e.g., ancient Rome, a childhood year long gone) as a real place that is still *there*, rather than a simulation, memory, or reconstruction?
  *   **No:** Go to Question 2.
  *   **Yes:** Go to Question 3.

  **Question 2: The Reality of the Future**
  Does the story treat the future as a place that already exists and can be visited or observed (e.g., time travel to 2500, or prophecy revealed to be reading a fixed script rather than guessing)?
  *   **No:** **Leaf A: Presentism** (Only the present exists; past is gone, future is not yet).
  *   **Yes:** **Leaf B: Shrinking Block** (The future exists, but the past has ceased to exist).

  **Question 3: The Stability of the Block**
  If characters visit the past or future, can they alter events in a way that rewrites the *same* timeline (e.g., killing an ancestor erases the traveler without creating a new branch)?
  *   **Yes:** **Leaf C: The Dynamic Block (Empty Node)**.
  *   **No:** Go to Question 4.

  **Question 4: The Privilege of "Now"**
  Does the narration or plot mechanics treat the current moment ("Now") as objectively unique or metaphysically special compared to other times (e.g., magic only works in the moving present, or consciousness is stated to physically ride the edge of time)?
  *   **No:** **Leaf D: Eternalism** (All times exist equally; "Now" is subjective).
  *   **Yes:** **Leaf E: Moving Spotlight** (All times exist, but "Now" is objectively privileged).

  ***

  ### Leaf Diagnoses & Special Conditions

  **Leaf A: Presentism**
  *   **Definition:** Only the present moment is real.
  *   **Story Markers:** Time travel to the past is impossible or revealed as an illusion; prophecies are always probabilistic guesses.

  **Leaf B: Shrinking Block**
  *   **Definition:** The future is fixed and exists, but the past is actively ceasing to exist.
  *   **Story Markers:** Characters may visit the future, but the deep past is inaccessible because it has been "eroded" or "deleted." A villain might erase a childhood so it *never was*, distinct from merely changing it.
  *   **Note:** This is the inverse of the Growing Block.

  **Leaf C: The Dynamic Block (Empty Node)**
  *   **Diagnosis:** **Incoherent.**
  *   **Reasoning:** This combination asserts that all times exist (Q1 & Q2 Yes) but that the past can be changed in a single timeline (Q3 Yes). This creates logical paradoxes (e.g., the Grandfather Paradox) that most ontologies resolve by either forbidding change (Eternalism) or creating branches (Multiverse). While writers sometimes attempt this, it lacks a stable logical model and is rarely occupied as a conscious philosophical position.

  **Leaf D: Eternalism**
  *   **Definition:** Past, present, and future all exist equally as a four-dimensional block.
  *   **Story Markers:** Time travel is visiting a location; prophecies are fixed records; the past cannot be changed.

  **Leaf E: Moving Spotlight**
  *   **Definition:** All times exist, but the present moment has a unique property of "nowness."
  *   **Indistinguishability Warning:** **Eternalism and Moving Spotlight cannot be separated by plot mechanics alone.** If a story fits Leaf D but the author *asserts* in narration that "The Now is special" without that specialness changing any plot outcomes, the story is technically Moving Spotlight. Without that explicit assertion, the two are functionally identical in fiction. To distinguish them, look for a scene where the "flow" of time has causal power (e.g., a spell that fails if cast in the past).

  ***

