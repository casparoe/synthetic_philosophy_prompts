      1.  **Q1 (Past Reality):** **Yes.** She visits Rome as a real place.
      2.  **Q3 (Stability):** **No.** She cannot change the past; her actions were always part of the record.
      3.  **Q4 (Privileged Now):** **No.** There is no indication the present is metaphysically unique; the future was fixed in the books.
  *   **Result:** **Leaf D: Eternalism.**
  *   **Assessment:** Correct. The story describes a self-consistent block universe.

  **Capsule 2: The Widow's Device**
