  AXIOM INDEMNITY GROUP
  Claims Processing Center
  404 Modal Logic Blvd, Suite 300
  Possible World, PA 19001

  **Date:** October 24, 2023
  **Claim Number:** 8842-ONT
  **Policy Holder:** Arthur Danto
  **Subject:** Determination of Coverage Regarding Incident #44-B (Clay/Sculpture)

  Dear Mr. Danto,

  We are writing regarding your recent claim for property loss following the incident wherein a decorative object in your residence was subjected to compressive force by a falling shelving unit. After a thorough review of the police report, photographic evidence, and an ontological assessment of the damaged property, Axiom Indemnity is denying your claim for compensation.

  Our investigation confirms that the object in question was a lump of clay constituted into the form of a bust of Aristotle. While we acknowledge that the *statue* ceased to exist upon impact, our policy covers only the loss of material substance, not the loss of aesthetic configuration or sortal classification.

  According to the terms of Section 14, Paragraph C (Material Constitution), coverage is triggered only upon the destruction of the insured entity. Our adjusters on site confirmed that the clay itself remains fully extant. While the spatial arrangement of the clay has changed, the constitutive matter persists. Therefore, the insured item (the clay) has not been destroyed, merely reshaped. To payout on this claim would require us to treat the statue and the clay as numerically identical, a position known as the Identity Thesis. Please note that Axiom Indemnity explicitly excludes coverage based on the Identity Thesis, as it fails to account for divergent modal properties and historical origins.

  It is a common misconception among policyholders that because the statue and the clay coincide spatially, they are one and the same object. This is categorically incorrect. The clay existed prior to the sculpting event and survives the squashing event. The statue, however, came into existence only upon the imposition of the form and ceased to exist when that form was lost. You insured the matter, not the form. Since the matter is currently sitting in a pile on your living room rug, no covered loss has occurred.

  We understand that from a common-sense perspective, your bust is ruined. However, insurance is a contract of strict definitions, not folk metaphysics. Being squashed is not synonymous with being destroyed, provided the constituent parts remain intact. You may reshape the clay into a bowl or a brick, but the claim regarding the bust is invalid because the bust is not a material object eligible for indemnity separate from its clay.

  If you wish to appeal this decision, please submit Form 12-O (Objection to Ontological Categorization) within thirty days. Note that appeals relying on intuition pumps or thought experiments regarding Theseus's Ship will be automatically rejected.

  Sincerely,

  **Gideon W. Stroud**
  Senior Claims Adjuster
  Ontological Division
  Axiom Indemnity Group
