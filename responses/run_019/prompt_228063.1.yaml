answer: |-
  There isn't a single, universally recognized colloquial term for this specific phenomenon, which is frustrating because you have identified a very real and distinct social dynamic. However, in philosophy, game theory, and sociology, there are precise concepts that describe exactly what is happening.

  The closest established name for the *logic* behind this behavior is **Ideal vs. Non-Ideal Theory**. The closest name for the *emotional reaction* is **Enforcing a Suboptimal Equilibrium**.

  Here is a breakdown of what this is, why it isn't hypocrisy, and why your friend's "principled" stance actually makes it worse.

  ### 1. The Philosophical Name: Ideal vs. Non-Ideal Theory
  This distinction comes from political philosophy (most notably John Rawls).
  *   **Ideal Theory** asks: "What would a just society look like?" (Answer: No tipping, living wages.)
  *   **Non-Ideal Theory** asks: "What is the right thing to do *right now*, in the world as it actually exists?" (Answer: Tip the waiter, because their rent is due tomorrow.)

  When your tablemate says, "That's not the point," they are shifting the conversation from Ideal Theory (the merit of the rule) to Non-Ideal Theory (the consequences of breaking the rule *today*). They are angry because your friend is acting according to Ideal Theory in a Non-Ideal context. To them, breaking a bad rule unilaterally doesn't fix the system; it just punishes the vulnerable person (the waiter) caught inside it.

  ### 2. The Game Theory Name: Enforcing a Suboptimal Equilibrium
  Your escalator example is a classic **Coordination Game**.
  *   **The Goal:** Maximize flow.
  *   **The Reality:** Everyone stands right, walks left.
  *   **The Problem:** This is actually inefficient (as your coworker knows). Standing on both sides would increase capacity.
  *   **The Equilibrium:** However, once "stand right" is established, it becomes a **Nash Equilibrium**. If everyone else stands right and *you* stand left, you cause friction, collisions, and slow everyone down.

  Even if the rule is dumb, **deviating from a coordinated norm is more costly than following a dumb norm.** Your coworker is angry because the tourist is introducing chaos into a coordinated system. She isn't defending the *rule*; she is defending the *coordination*. In game theory, this is often called **maintaining a suboptimal equilibrium**. The group prefers a predictable bad outcome over an unpredictable attempt at a good one.

  ### 3. The Sociological Name: Second-Order Norms
  You noted this isn't hypocrisy. Hypocrisy is claiming to believe $X$ while doing $Y$. These people are openly admitting they believe $X$ (the rule is bad) but doing $Y$ (following the rule).

  The mechanism at play is a **Second-Order Norm**.
  *   **First-Order Norm:** "You should tip." (They think this is bad).
  *   **Second-Order Norm:** "You should follow the local conventions of the group you are in." (They think this is *good*).

  They are not punishing your friend for violating the First-Order Norm (tipping); they are punishing him for violating the Second-Order Norm (social cohesion). The anger is real because, to them, being a "cooperative member of society" is a higher moral value than "being right about tipping."

  ### Why "Principled" Refusal Angers Them More
  You asked if it makes a difference that your friend is open about his reasons versus someone who just forgets or is cheap. **Yes, it makes a huge difference.**

  *   **The Lazy Violator:** Someone who doesn't tip because they are cheap is just a **free rider**. They are a glitch in the system. They aren't challenging the rule; they are just breaking it for gain. People dislike them, but they don't feel *threatened* by them.
  *   **The Principled Violator:** Your friend is a **challenger**. By refusing on principle, he is implicitly accusing the rest of the table of complicity. He is forcing them to confront the moral cost of their own compliance.

  When he says, "You literally just said the system shouldn't exist," he is pointing out their **Complicity**. Their anger is a defense mechanism against that accusation. It is easier to call *him* a jerk than to admit that *they* are choosing comfort over justice. His principled stand threatens the **Pluralistic Ignorance** (or in this case, **Transparent Ignorance**) that allows the group to sleep at night.

  ### Is there a name we can use?
  Since there isn't one perfect word, here are three ways to label it depending on which angle you want to highlight:

  1.  **The Compliance-Endorsement Gap:** This describes the state of following a rule you don't endorse.
  2.  **Pragmatic Norm Enforcement:** This highlights that they are enforcing the norm for practical reasons (coordination/safety), not moral ones.
  3.  **Non-Ideal Compliance:** This captures the "That's not the point" logic—we are operating in the real world, not the ideal one.

  ### Summary: How it differs from Hypocrisy and Confusion
  *   **Vs. Hypocrisy:** A hypocrite lies about what they believe to look good. These people tell the truth about what they believe but act differently to avoid social cost. They are **cynics**, not hypocrites.
  *   **Vs. Confusion:** They are not confused. They understand the system is broken. They simply believe that **unilateral disarmament** (breaking the rule alone) is not the way to fix it.

  The "That's not the point" remark is the smoke signal of **System Justification**. They are acknowledging the system is broken, but asserting that *your* attempt to fix it is more disruptive than *their* decision to tolerate it. They are prioritizing **social peace** over **moral consistency**, and they get angry when you force them to choose between the two.
