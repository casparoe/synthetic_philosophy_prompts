  **Resolution**
  However, accepting the "Sanctity of the Vow" argument ignores the specific conditions of this promise. It was personal (mother to son), not institutional (founder to corporation). The founder distinguished between what she wanted her son to do and what she required the foundation to do. By leaving the deed open, she signaled that her values should guide us, but not shackle us.

