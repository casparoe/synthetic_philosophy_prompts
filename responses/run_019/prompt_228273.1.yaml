  *(Refining the "Why Promises Bind" stance)*: I need to be explicit. I will argue that promises bind to protect *reliance interests* and *autonomous choice*. Since the founder autonomously chose *not* to legalize the restriction, enforcing it violates her autonomy more than breaking it.

