  *Drafting...*
  To: Board of Directors
  From: [Your Name]
  Date: October 26, 2023
  Subject: Recommendation Regarding Proposed Grant for Campaign Finance Reform

  **Recommendation**
  I recommend the Board approve the grant for campaign finance reform advocacy. While this contravenes the founder's verbal instruction to her son, it aligns with her documented intent for institutional flexibility and our fiduciary duty to maximize impact within the legal trust deed.

  **The Moral Weight of the Promise**
  Our deadlock stems from differing views on why promises bind us. Some argue promises create a moral debt that survives the promisee's death. Others argue they function to secure reliance. In this specific context, neither theory compels us to reject the grant.

  If promises bind because they create *expectations*, the founder no longer holds any. She cannot be disappointed. If they bind to protect *reliance*, the primary relying party was her son, the then-chair. He honored her wish during his tenure. He has now retired. The foundation itself did not rely on this promise to its detriment; indeed, staff have identified this opportunity based on the assumption of flexibility.

  The most robust account of promising is respect for *autonomy*. We honor promises because they are extensions of a person's will. Here, the founder's actions speak louder than her deathbed words. She explicitly declined to write the restriction into the trust deed, citing a desire for flexibility. To enforce the verbal promise as perpetual law is to override her autonomous choice to keep the foundation adaptable. She trusted her son to hold the line, not to bind his successors forever. By adhering strictly to the verbal ban, we ironically violate her stated wish for institutional flexibility.

  **The Counterargument**
  The strongest argument against funding is the "Sanctity of the Vow." Proponents argue that a deathbed promise carries unique moral gravity. It is not merely a transaction but a final expression of values. To break it treats the founder's values as disposable data points, potentially damaging the family trust that underpins this foundation. If we cannot honor a dying wish, what binds us to any unwritten norm? This view holds that the *practice* of promising collapses if we allow convenient exceptions based on legal technicalities. There is merit here: disregarding verbal commitments can erode the culture of trust within family governance.

  **Resolution**
  However, accepting the "Sanctity of the Vow" argument ignores the specific conditions of this promise. It was personal (mother to son), not institutional (founder to corporation). The founder distinguished between what she wanted her son to do and what she required the foundation to do. By leaving the deed open, she signaled that her values should guide us, but not shackle us.

  Effective philanthropy requires responsiveness. If we encounter an opportunity where our capital does significantly more good than our standard direct service grants, refusing it based on an unwritten, non-binding constraint fails our fiduciary duty. We are stewards of the endowment's impact, not curators of the founder's anxieties.

  **Conclusion**
  We honor the founder best by respecting her design for the foundation, not just her words. She designed a flexible vehicle. We should use it. I move we approve the grant.

