answer: |-
  # Activity Design: The Replication Race

  ## 1. Overview and Learning Objectives
  **Module:** Cultural Evolution  
  **Topic:** Darwinian approaches to culture (Variation, Heredity, Differential Fitness)  
  **Time:** 80 Minutes  
  **Class Size:** 16 Students  
  **Goal:** Students will experience how cultural items spread based on their replication properties (catchiness, fidelity, speed) rather than their truth or utility. They will discover that "success" is a mathematical outcome of copying dynamics, not a judgment of quality.

  **Key Concepts to Emerge:**
  *   **Variation:** Different starting items compete.
  *   **Heredity (Fidelity):** Copies resemble parents, but errors occur.
  *   **Differential Fitness:** Some items leave more copies than others.
  *   **Selection:** The environment (time limits, memory constraints) filters variants.

  ---

  ## 2. Preparation and Materials
  You will need to print the following materials. Ensure all student-facing text uses American English spelling (e.g., *color, behavior, center*).

  **A. Seed Cards (Print 4 sets, each on a different color cardstock)**
  *   **Variant A (Red):** "Red bugs bite. Blue bugs fly. Catch the green one by and by."
  *   **Variant B (Yellow):** "WARNING: Green bugs carry disease. Avoid contact. Report sightings immediately."
  *   **Variant C (Blue):** "Insect population density correlates with seasonal temperature variances in this region."
  *   **Variant D (Green):** "Pass this on. Pass this on. Pass this on. Pass this on."

  **B. Transmission Logs (Print 16 copies)**
  *   A simple sheet with columns: *Round Number | Variant Color | Text Copied | Did I change it? (Y/N)*

  **C. Collection Box**
  *   A physical box or basket at the front of the room for final submission.

  **D. Timer**
  *   Visible to the class (projector or phone).

  **E. Scoreboard (Whiteboard)**
  *   Draw a table to tally results during the debrief.

  ---

  ## 3. Session Plan (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute roles and Seed Cards. Explain rules strictly. No theory yet. |
  | **05–20** | **Round 1** | Transmission Phase 1. High interaction. |
  | **20–35** | **Round 2** | Transmission Phase 2. Pressure increases. |
  | **35–50** | **Round 3** | Transmission Phase 3. Final push. |
  | **50–55** | **Tally** | Students submit logs. Instructor counts frequencies on board. |
  | **55–80** | **Debrief** | Inductive discussion connecting results to Darwinian concepts. |

  ---

  ## 4. Student Handout Text (American English)
  *(Print this as a half-sheet for each student)*

  ***

  **THE REPLICATION PROTOCOL: RULES & SCORING**

  **Objective:**
  Your goal is to maximize your personal score. Your score depends on how many copies of your text exist at the end of the game and how accurate those copies are.

  **The Rules:**
  1.  **Start:** You will receive a card with a text. Memorize it.
  2.  **Transmission:** When the timer starts, you must teach your text to other students.
  3.  **Copying:** The receiver must write the text from **memory** after looking at your card for no more than 10 seconds. They cannot copy it letter-for-letter; they must recall it.
  4.  **Choice:** A receiver can only accept **one** text per round. If multiple people approach you, you must choose which one to copy.
  5.  **Mutation:** If you forget a word or change a word while copying, write it down exactly as you remember it. Do not correct it.
  6.  **Scoring:**
      *   **Spread:** +1 point for every copy of your *Variant Color* in the final box.
      *   **Fidelity:** +2 bonus points for every copy that matches the *Original Seed Text* exactly.
      *   *Note: You score points for the Variant Color you hold at the start of the round.*

  **Ethical Constraint:**
  Do not discuss strategy with other students. Do not agree to share points. Play for your own score.

  ***

  ---

  ## 5. Instructor Script and Facilitation

  ### Introduction (5 Minutes)
  "Welcome. Today we are running a simulation called 'The Replication Protocol.' I am not going to explain the theory behind this yet. I want you to experience the mechanics first.

  Here is your handout. Read it carefully. Your goal is to maximize your score based on the rules printed there.

  I have four Seed Cards. I am giving them to four of you now. [Distribute Variant A, B, C, D to four students seated in different corners]. The rest of you start with blank Transmission Logs.

  Remember: Receivers write from **memory** after a 10-second look. This is crucial. You cannot transcribe. You must recall.

  Round 1 begins now. You have 5 minutes. Go."

  ### During the Rounds (45 Minutes Total)
  *   **Round 1 (5 mins):** Walk around. Ensure students aren't letting others read the card for more than 10 seconds. Enforce the "one text per round" rule if students try to hoard multiple.
  *   **Round 2 (5 mins):** "Stop. Freeze. Everyone who now has a text on their log is a Carrier. Everyone with a blank log is a Receiver. Carriers, find Receivers. If you are both Carriers, you must compete for space. You have 5 minutes. Go."
      *   *Note:* By Round 2, most students should have a text. This creates competition. If everyone has a text, tell them: "You must overwrite your current text if you copy a new one. Choose wisely."
  *   **Round 3 (5 mins):** "Final Round. Maximize your score. 5 minutes. Go."
  *   **Collection (5 mins):** "Stop. Please place your final Transmission Log in the box at the front. Do not keep your Seed Cards."

  ### The Tally (5 Minutes)
  "While I count the frequencies, look at the whiteboard."
  *(Draw four columns: Red, Yellow, Blue, Green. Count the total logs submitted for each color. Write the numbers.)*
  "Next, I will check for accuracy. I'm looking for exact matches to the original seed."
  *(Mark a star next to the columns that have high accuracy.)*

  "Look at these numbers. Who held the Red card at the start? [Ask student]. What was your score? Who held the Blue card? What was your score?"

  ---

  ## 6. Debrief Guide (25 Minutes)
  *Do not use the word 'meme' until the very end. Guide them to the conclusions using questions.*

  **Step 1: Observing the Outcome (5 mins)**
  *   "Look at the board. Which color won? Why do you think that one spread the most?"
  *   *Expected Answer:* "Green was short." "Yellow was scary." "Blue was too hard to remember."
  *   "Did the 'truest' or most 'useful' statement win? (Referring to Blue/Scientific fact)."
  *   *Point:* Success wasn't about truth. It was about copy-ability.

  **Step 2: Analyzing the Mechanism (10 mins)**
  *   "Think about the rules. What three things had to happen for a text to get a high score?"
  *   *Guide them to name:*
      1.  **Copying:** It had to be transferred (Heredity).
      2.  **Changes:** Did anyone's text change slightly? (Variation/Mutation).
      3.  **Competition:** You had to choose which one to copy (Selection).
  *   "If a text was long and complex (like Blue), what happened to its fidelity over time?"
  *   *Point:* High complexity often lowers fidelity.
  *   "If a text was short and repetitive (like Green), what happened to its frequency?"
  *   *Point:* High fecundity (rate of copying) increases frequency.

  **Step 3: Connecting to Theory (10 mins)**
  *   "In biology, genes spread because they build bodies that survive and reproduce. In this game, what built the 'body' that allowed these texts to reproduce?"
  *   *Answer:* Your brains and your social interaction.
  *   "Did you sit back and judge which text was objectively 'better' for society?"
  *   *Answer:* No, you judged which one would get *you* points, or which one was easier to copy quickly.
  *   "This is the core of the Darwinian approach to culture. Cultural items spread not because they are good for *us*, but because they are good at getting *copied*."
  *   **Reveal:** "In the 1970s, Richard Dawkins coined a term for these units of cultural transmission. He called them **Memes**."
  *   "Just like genes, memes undergo variation, heredity, and differential fitness. The 'fittest' meme isn't the truest one; it's the one that leaves the most copies."

  ---

  ## 7. Troubleshooting: What Will Go Wrong
  *   **Collusion:** Students might agree to all copy the same variant to "beat the game."
      *   *Fix:* Emphasize the **Fidelity Bonus**. If they all copy Green, but Green mutates, they lose points. Remind them individually during the round: "Remember, exact matches get double points."
  *   **Transcription:** Students might try to sneak a photo or write while looking.
      *   *Fix:* Enforce the "10-second look, then look away" rule strictly. Walk around and tap the table if you see prolonged viewing.
  *   **Boredom/Confusion:** If the rounds feel chaotic.
      *   *Fix:* Keep the timer visible and call out time checks ("2 minutes left!"). Chaos is actually good data—it simulates the noise of real cultural transmission.
  *   **The "Blue" Variant Dies Too Fast:** If the complex text disappears in Round 1, you lose a data point.
      *   *Fix:* If you see Blue dying instantly, intervene slightly: "Remember, complex information can be valuable if copied accurately." (Use sparingly).

  ---

  ## 8. Limitations of the Model (Instructor Notes)
  *In the final 5 minutes, you must supply this context so students don't overgeneralize.*

  "While this game demonstrates the Darwinian logic of cultural evolution, it simplifies reality in three key ways you need to remember:

  1.  **Intentionality:** In the game, you *tried* to copy. In biological evolution, genes don't 'try.' Cultural evolution is 'blind' in its outcome, but 'sighted' in its mechanism (humans choose to copy). This is called *guided variation*.
  2.  **Speed:** Cultural evolution happens much faster than genetic evolution. We saw three generations in 15 minutes. Real cultural shifts can take decades, or happen in seconds via the internet.
  3.  **Horizontal Transmission:** In this game, you copied peers (horizontal). In genetics, transmission is mostly parent-to-offspring (vertical). Cultural items can jump across 'generations' and groups instantly, which changes the math of selection.

  This model shows us the *logic* of selection, but human culture also involves psychology, power dynamics, and technology, which we will discuss next week."

  ---

  ## 9. Handout and Slide Text (American English)
  *(Copy and paste the text below directly into your materials)*

  ### Slide 1: Title
  **The Replication Protocol**
  *   Maximize your score.
  *   Follow the rules.
  *   No discussion of strategy.

  ### Slide 2: Rules Summary
  1.  **Memorize:** 10 seconds to view the source card.
  2.  **Recall:** Write from memory only.
  3.  **Choose:** Receivers accept only one text per round.
  4.  **Score:**
      *   +1 point per copy of your variant.
      *   +2 points per *exact* match.

  ### Slide 3: Debrief Questions
