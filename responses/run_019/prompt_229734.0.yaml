  | medium | rousseau_would_likely_say | key_anxiety | where_the_analogy_breaks | confidence |
  | :--- | :--- | :--- | :--- | :--- |
  | **Cinema** | A mechanized dream-state that industrializes pity and sells moral exhaustion to the masses. | **Pity at a distance:** Feeling emotion for a screen exhausts capacity for real compassion. | **Scale/Permanence:** Unlike a nightly play, films are immutable cultural monuments that standardize emotion across a nation. | **High:** The mechanics of spectatorship align perfectly with his theater critique. |
  | **Streaming TV** | The atomization of the family hearth; a private narcotic that dissolves the public sphere into isolated binges. | **Civic Passivity:** Time spent consuming is time stolen from civic duty and physical presence. | **Location:** Corruption moves from the public square to the private home, making it harder to police or reform socially. | **High:** He prioritized public time; endless private consumption is the antithesis of his civic ideal. |
