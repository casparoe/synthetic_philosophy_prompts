answer: |-
  Dear Friend,

  It is completely understandable that you feel stuck, because the question you are asking sits right at the collision point of metaphysics, ethics, and computer science. You are not missing a simple fact that would resolve this; rather, you are encountering the hard boundaries of our current philosophical understanding. To help you navigate this, I have outlined the criteria that any robust theory of computational moral status must satisfy. These are not answers themselves, but the standards by which an answer must be judged.

  The first requirement is substrate neutrality, which demands that the theory explain why the physical material of the brain matters, or why it does not. If a theory claims that only biological neurons count, it is treating this requirement as negotiable, essentially asserting a preference for biological naturalism. However, if a theory claims that any system with the right causal structure counts, it treats substrate neutrality as non-negotiable. The case for this is your intuition that hardware should not matter more than computation. A successful theory must either provide a compelling reason why carbon is special, perhaps due to quantum effects or specific biochemical properties, or it must rigorously defend why silicon is equivalent. Without addressing this, the theory falls into the trap of cheating by drawing an arbitrary line around biology.

  The second requirement is the activity constraint, which asks whether the computation must be actively running to matter. This addresses your worry about the program written down but never executed. A theory must distinguish between a static description of a mind and the dynamic process of thinking. Treating this as non-negotiable is common among functionalists who believe existence requires occurrence, but some platonists might argue the structure exists timelessly regardless of execution. The consideration behind this is the difference between a map and a territory. A lookup table contains all the answers, but it does not perform the work of finding them. An adequate theory must explain why the process of transformation matters more than the mere potential for transformation, or else it risks assigning moral status to every possible permutation of matter that could theoretically encode a mind.

  The third requirement is phenomenal grounding, which insists that the theory account for subjective experience, not just behavioral output. This is the response to your cousin's intuition that there is nobody home inside the numbers. This requirement is often treated as non-negotiable by those who believe moral status depends on the capacity to suffer or feel, but functionalists who focus purely on information processing might treat it as negotiable, arguing that complex behavior is sufficient. The case for this is strong because moral consideration usually hinges on the ability to be harmed in a way that feels like something. If a simulation acts exactly like a mouse but lacks inner experience, harming it might be morally equivalent to crushing a calculator. A theory that cannot distinguish between a philosophical zombie and a conscious entity fails to capture the essence of moral concern.

  The fourth requirement is boundary coherence, which demands that the theory define where the moral entity begins and ends. This tackles your confusion about gut neurons, partial computations, and duplicated programs. It is non-negotiable because without it, we cannot count moral patients. If my gut neurons process information, why are they not part of the moral entity? If a million people run the same simulation, is there one mouse or a million? A theory must provide a principle of individuation. It cannot simply say the computation matters; it must say which computation matters as a unified whole. If it fails here, we face absurdities where moral weight dilutes across distributed networks or multiplies arbitrarily based on how many copies exist on hard drives.

  The fifth requirement is temporal consistency, which asks whether the speed of computation affects moral status. This addresses your question about one step a year versus a billion steps a second. Most theories treat this as negotiable, arguing that speed is relative and should not change the intrinsic nature of the mind, but this leads to counterintuitive results where a slowed-down mind is still fully conscious despite being causally disconnected from the present moment. The consideration here is whether time is internal to the computation or external. If a theory cannot explain why a frozen simulation is not suffering in slow motion, or why speeding it up does not create a super-mouse, it lacks a coherent view of temporal existence.

  Now I must address your suspicion that some of these requirements cannot all be satisfied at once. You are correct to suspect this. There is a profound tension, perhaps an incompatibility, between substrate neutrality, activity constraints, and phenomenal grounding. If you insist that only the structure matters (substrate neutrality), you struggle to explain why a static lookup table (which has the structure) lacks experience (phenomenal grounding). If you insist that the activity matters, you struggle to explain why speed does not change the moral status (temporal consistency), since slowing the activity down changes the physical reality of the process. Furthermore, if you demand boundary coherence, you often run into the problem that computation is arbitrarily divisible; you can distribute a single calculation across a million computers, challenging the idea of a unified entity. This trilemma explains why the argument goes in circles. Most theories sacrifice one requirement to save the others. Biological naturalists sacrifice substrate neutrality. Functionalists sacrifice phenomenal grounding or activity constraints.

  Regarding which single requirement does the most work in ruling out candidate answers, it is phenomenal grounding. This is the filter that eliminates the lookup table, the unrun code, and the simple information processing of the gut. It is the requirement that forces the theory to confront the hard problem of consciousness. Any theory that can successfully explain how and why certain computations give rise to subjective experience will almost automatically solve the activity and boundary problems, because experience is inherently active and unified. However, this is also the most difficult requirement to meet, as we currently have no scientific consensus on how matter becomes mind.

  In summary, you are looking for a theory that can justify substrate independence without losing the distinction between simulation and reality, define the boundaries of a mind without arbitrariness, and account for subjective experience without magic. Be gentle with yourself if you cannot find a perfect fit. The fact that you see the walls behind each answer means you are understanding the problem better than those who claim to have solved it easily. The debate between your friend and your cousin persists not because one is smart and the other is not, but because our current frameworks force us to choose between counterintuitive options. I hope this checklist helps you evaluate future arguments not by their conclusions, but by which of these heavy burdens they choose to carry and which they choose to set down.

  Sincerely,

  Your Assistant
