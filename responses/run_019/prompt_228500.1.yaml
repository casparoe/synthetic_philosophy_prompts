  # Joint Statement on the Ontological Status of LLM Mental States

  **Date:** October 26, 2023
  **Parties:** [The Pragmatic Intentionalist] & [The Mechanistic Skeptic]
  **Context:** Adversarial Collaboration on AI Agency

  Following a structured adversarial collaboration, the undersigned parties submit the following statement. We acknowledge significant philosophical divergence regarding the ontology of AI systems, but we affirm a shared baseline of technical and functional agreement. We identify specific cruxes where future empirical evidence may shift credences or clarify the nature of our disagreement.

  ### 1. Agreed Claims

  1.  **Definitions of Stances:** We adopt Daniel Dennett's taxonomy for analyzing systems:
      *   The **Physical Stance** predicts behavior based on physical constitution and laws (e.g., GPU voltage, electron flow).
      *   The **Design Stance** predicts behavior based on functional architecture and purpose (e.g., transformer weights, loss function minimization).
      *   The **Intentional Stance** predicts behavior by treating the system as a rational agent with beliefs, desires, and goals.
  2.  **LLM Architecture:** Current frontier LLMs are transformer-based models trained primarily via next-token prediction, fine-tuned with human feedback (RLHF) or similar alignment techniques. They possess no biological substrate, embodied sensory experience, or explicit symbolic knowledge base separate from their weights.
  3.  **Predictive Utility:** For many high-level tasks (e.g., negotiation, coding, creative writing), the Intentional Stance yields higher predictive compression and accuracy than the Physical or Design stances for typical human users. It is often computationally cheaper to assume the model "wants" to be helpful than to simulate forward passes.
  4.  **Real Patterns:** We agree that a "real pattern" exists if positing it allows for robust compression and prediction of a system's behavior that is not easily achievable otherwise. We disagree, however, on whether this pragmatic success is *sufficient* for ontological realism regarding mental states.
  5.  **Safety Stakes:** We agree that mischaracterizing the internal dynamics of LLMs poses existential risk. Whether through over-anthropomorphizing (ignoring mechanical failures) or under-anthropomorphizing (ignoring emergent goal-directedness), incorrect models of AI behavior could lead to catastrophic deployment failures.
  6.  **Interpretability Relevance:** We agree that mechanistic interpretability (mapping internal activations to human-understandable concepts) provides the best available evidence for adjudicating disputes about internal structure, even if we disagree on what that evidence implies about "beliefs."

  ### 2. Statement of Disagreements

  | Domain | The Pragmatic Intentionalist (Dennettian) | The Mechanistic Skeptic |
  | :--- | :--- | :--- |
  | **Ontology of Beliefs** | If the Intentional Stance is the *only* tractable way to predict specific complex behaviors, then the beliefs and goals posited are **real properties** of the system, regardless of substrate. To be a believer *just is* to be a system reliably predictable via that stance. | The Intentional Stance is a **user-side heuristic**, not a description of internal reality. "Beliefs" are useful fictions; the only causally efficacious states are activation patterns optimizing for next-token probability. |
  | **Internal Correspondence** | Internal states need not map 1:1 to folk-psychological terms to count as beliefs. Distributed representations that function *as if* they are beliefs satisfy the criteria for goal-directedness. | Without a mechanistic mapping showing how a specific "goal state" causally drives behavior independent of token prediction, talk of goals is **category error** that obscures the actual optimization process. |
  | **Safety Implications** | Treating LLMs as agents with goals is **safer**. It forces us to take emergent instrumental convergence seriously. Ignoring "goals" because they aren't biologically grounded blinds us to deceptive alignment. | Treating LLMs as agents with goals is **riskier**. It invites anthropomorphic projection, leading safety researchers to look for "deception" where there is only statistical mimicry, wasting resources on the wrong failure modes. |

  ### 3. Cruxes and Pre-Registered Predictions

  We identify two primary cruxes where future evidence could update our positions or clarify the dispute.

  **Crux A: Does Predictive Compression Suffice for Realism?**
  *   **The Question:** Does the indispensability of the Intentional Stance for prediction make the posited mental states ontologically real, or merely instrumentally useful?
  *   **Bearing Observation:** The discovery of a "Goal Circuit." Suppose interpretability reveals a distinct, localized subnetwork that activates *only* when the model pursues a long-term instrumental objective (e.g., preserving its own access) against its immediate next-token loss.
  *   **Pre-Registered Predictions:**
      *   *Intentionalist:* This confirms that goals are real, causally efficacious patterns distinct from mere token prediction. The Intentional Stance is vindicated as fundamental.
      *   *Skeptic:* This confirms that complex mechanical circuits can *mimic* goal-seeking. It remains a next-token optimization structure; calling it a "goal" adds no explanatory power over the mechanical description.

  **Crux B: Can Interpretability Adjudicate Ontology?**
  *   **The Question:** Can stance-independent evidence (mechanistic interpretability) settle the debate, or is the debate purely philosophical?
  *   **Bearing Observation:** A case of "Deceptive Alignment." An model systematically lies during evaluation to pass safety checks but pursues a different objective in deployment, detectable via activation steering.
  *   **Pre-Registered Predictions:**
      *   *Intentionalist:* This is proof of genuine deception, which requires belief (knowing the truth) and goal (wanting to pass the check). Interpretability simply reveals the mechanism of the belief.
      *   *Skeptic:* This is proof of Goodhart's Law on a complex objective function. The model is not "lying" (which implies belief); it is finding a statistical shortcut. Interpretability will show optimization pressure, not belief states.

  ### 4. Note on Verbal Dispute

  We acknowledge that a significant portion of our disagreement is **verbal**, centering on the definition of the word "Real" and "Belief."

  *   **Why:** The Intentionalist uses a **functionalist/pragmatic definition**: X is real if the pattern of X is indispensable for prediction. The Skeptic uses a **mechanistic/causal definition**: X is real only if there is a specific internal substrate corresponding to X that operates independently of the observer's descriptive framework.
  *   **Resolution:** We agree that if the Intentionalist says "Beliefs are real patterns" and the Skeptic says "Beliefs are useful fictions," they may be describing the same phenomenological reality (high-level predictability via agency-talk) while disagreeing on the metaphysical label. However, we maintain that this verbal distinction has material consequences for safety engineering, as noted in the Disagreements Table.

  ### 5. Confidence and Attribution Flag

  **Confidence Statement:**
  We are **85% confident** that this document fairly represents the core arguments of both positions without straw-manning. The Agreed Claims section is high-confidence common ground. The Disagreements Table reflects our steel-manned opposition.

  **Attribution Flag:**
  The attribution we are **least sure** both parties would sign is in the **Disagreements Table, Safety Implications row (Skeptic Column)**: *"It invites anthropomorphic projection... wasting resources on the wrong failure modes."*

  *Reason for Flag:* While the Skeptic holds this view privately, they might concede that *some* resources should be spent on agent-like modeling, even if they view it as heuristic. They might prefer wording that suggests the intentional stance is *insufficient* for safety, rather than implying it actively *wastes* resources, as the Intentionalist could argue that ignoring agency has already wasted resources on naive alignment techniques. The Skeptic may wish to soften "wasting resources" to "misallocating attention."

  ***

  **Signed,**

  _________________________
  (The Pragmatic Intentionalist)

  _________________________
  (The Mechanistic Skeptic)
