answer: |-
  The established term for this phenomenon is **Net Widening**.

  Originating in criminology and sociology in the 1970s and 80s (notably articulated by Stanley Cohen in *Visions of Social Control*), **Net Widening** describes the process where alternatives to traditional punishment (diversion, probation, electronic monitoring, community service) are applied to individuals who would otherwise have received no intervention at all. Instead of replacing the harsher penalty, the "gentler" option becomes a new tool of control that expands the total population under state supervision.

  ### Definition and Edges
  **Net Widening** is defined by the expansion of the *scope* of social control, not necessarily the *severity* of the control.
  *   **Harm Reduction:** It still counts as net widening even if the reform genuinely reduces harm per person (e.g., probation is objectively better than prison). The critique is structural: the state is now managing more lives, creating more opportunities for future entanglement, even if the immediate experience is "softer."
  *   **Intent:** The definition is agnostic regarding intent. It applies whether the expansion was an accidental byproduct of administrative convenience (prosecutors charging cases because a "cheap" option exists) or a strategic move to justify budgets by increasing caseloads.
  *   **Scope:** While rooted in criminal justice, the concept applies broadly to any system where "help" or "oversight" is institutionalized. It appears in education (restorative justice programs pulling in students who would have received a warning), mental health (mandatory treatment for behavior previously considered non-criminal), and welfare (increased monitoring of recipients).

  ### Distinctions from Nearby Concepts
  *   **Vs. Mission Creep:** Mission creep implies the *goals* of the system change (e.g., a police department starts doing mental health work). In net widening, the goal remains constant (reduce jail, increase fairness), but the *population* eligible for intervention expands to meet that goal efficiently.
  *   **Vs. Displacement:** Displacement moves enforcement from one group or location to another without changing the total volume. Net widening *increases* the total volume of people touched by the system.
  *   **Vs. Policy Failure:** A policy failure suggests the reform didn't work (e.g., jail populations didn't drop). In net widening, the specific metric often *does* improve (jail numbers fall), but the systemic outcome (total state control) worsens.

  ### Implications for the Reform-vs-Abolish Debate
  The existence of net widening is a central pivot point in the debate between liberal reformers and abolitionists.
  *   **For Reformers:** It implies that policy design requires stricter eligibility criteria and "firewalls" to ensure alternatives are used only as true substitutes for incarceration, not supplements. They argue the mechanism can be fixed.
  *   **For Abolitionists:** It is evidence that the carceral system is inherently expansionist. They argue that any new tool granted to the system, no matter how benevolent the intent, will be weaponized to increase reach and legitimacy. Therefore, reducing harm requires shrinking the system's power and resources, not refining its tools.

  \answer{Net Widening}
