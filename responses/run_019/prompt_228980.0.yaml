answer: |-
  Brandt: Let us begin with the case that brought us here. The woman who dove into the frozen lake. You agree she saved the child, and you agree she risked her life. The orthodox position, the one I defend, is straightforward. She was not required to jump. Had she walked away, she would have done nothing wrong. She did something wonderful, something beyond the call of duty. That is the essence of supererogation. It is a moral surplus.

  Voss: I agree she saved the child, Felix. I agree she is praiseworthy. Where I diverge is on the metaphysics of that praise. You call it surplus. I call it coverage. On my moral budget view, the total amount of moral work required in a situation is fixed by the needs present. A child was drowning. That need constitutes a moral debt owed by the world to that child. When she jumped, she paid that debt.

  Brandt: But who owed the debt? If you say the world, you speak in metaphors. If you say every individual, you imply she was required to jump, which contradicts the very intuition we are trying to capture. If everyone was required to jump, only one could succeed, and the rest would be failing impossible tasks. If no one was required, then the debt was not owed by any agent. You cannot have a duty that floats free of all agents.

  Voss: I can, and I do. The duty exists at the level of the community. The budget is collective. When the child screamed, a unit of moral necessity entered the ledger. It hung over the group of bystanders. Most chose not to redeem it. She did. By doing so, she did not exceed the total requirement of the situation; she met the total requirement that the group failed to meet individually. She did not go beyond duty; she fulfilled the duty that remained unassigned until she claimed it.

  Brandt: This is where your view dissolves the category rather than redescribing it. If she fulfilled a duty, then walking away was a failure of duty. You are forced to say the bystanders who did not jump were morally blameworthy. But our intuition screams otherwise. We do not blame the bystanders for failing to be heroes. We blame them only if they were negligent, but mere non-heroism is not negligence. Your budget view collapses the permissible into the forbidden unless one steps up.

  Voss: I concede that we do not typically blame them. But I question whether that lack of blame is a moral truth or a social concession. We let them off the hook because we know most people lack the courage. But the need remained. The budget was not balanced until the child was out. If we accept that morality is about responding to need, then the bystanders benefited from her action. They were let off the hook. That is not surplus; that is subsidy.

  Brandt: Subsidy implies a debt. If I give you a gift, I am not subsidizing your income; I am transferring resources I have no obligation to transfer. The hero treats the moral law as a baseline, not a ceiling. By leaping, she says, I will do more than is asked. If you say she was merely paying a bill that others left unpaid, you strip the act of its gratuitous nature. You turn sainthood into accounting. The hero feels they are giving a gift, not settling a tab.

  Voss: The hero may feel that way. Phenomenology is not ontology. They feel they are giving a gift because the social contract tells them they are free to walk away. But look at the consequence. Because she jumped, no one else had to. Her excellence purchased their indulgence. If morality is about the good that must be done, then her act reduced the moral burden on everyone else. That is a redistribution of labor. If I do your shift because you went home sick, I am not giving you a gift; I am covering your obligation. You should feel indebted, not just grateful.

  Brandt: Here is the crux. Can a duty that no one person in particular bears still meaningfully be called a duty? You say the community owed it. But communities do not act; individuals do. If the duty is not assignable to me until I volunteer, then it is not a duty for me until that moment. It is a potential duty. Supererogation is the space where potential duties become actualized by choice rather than command. If you remove that space, if you say the duty was always there waiting to be claimed, you make morality infinitely demanding. Any need anywhere becomes my duty if no one else takes it.

  Voss: Not infinitely demanding. Fixed by the budget. The total need is fixed. If everyone does their fair share, the budget balances without heroes. Heroes are only necessary because the system is underfunded by the rest of us. The demand is not infinite; it is just collective. You worry about the burden on the individual. I worry about the complacency of the collective. Your view allows me to say, I did my part, even if the child drowned because no one did enough. My view says if the child drowns, the community failed, and those who could have done more but didn't participated in that failure, even if we do not punish them for it.

  Brandt: I will concede this: your view captures the urgency of need better than mine. It explains why we feel uneasy when we walk past a beggar. We feel a pull, even if we know we are not strictly required to stop. You describe that pull as a residual duty. I describe it as an invitation. But consider the implication for how we regard the hero. If I owe the hero because they did my job, my response is indebtedness. It is a transactional relief. I am off the hook. If I view them as supererogatory, my response is gratitude. It is a relational bond. I am not off the hook; I am simply the beneficiary of their generosity. Which motivates better moral behavior?

  Voss: Indebtedness should motivate better behavior. Gratitude allows me to remain passive. I thank you, and I go on my way. Indebtedness implies I owe a return. If I see the hero as having balanced the budget on my behalf, I am morally in arrears. I should strive to ensure they do not have to do it again. Your view lets me admire the hero from a distance. My view demands I step up so the budget does not fall on them next time.

  Brandt: But does it survive the intuition test? Take the kidney donor. They give to a stranger. You say they are covering a need the community failed to meet. But the community had no specific obligation to give a kidney. We are not required to sacrifice organs. That is the hard limit of duty. If you say the donor is fulfilling a collective duty to provide organs, you imply I am required to give mine if no one else does. That violates bodily autonomy in a way most moral systems cannot accept.

  Voss: I do not say you are required to give yours. I say the need exists. The budget includes the need for kidneys. The duty to meet that need is collective. The donor voluntary assumes the collective burden. The rest of us are not required to give organs, but we are required to sustain a system where organs are available. When the donor steps in, they are compensating for our systemic failure. They are not just giving a kidney; they are plugging a hole in our moral infrastructure. That is why we praise them so highly. It is not because they did something extra; it is because they did something essential that we all neglected.

  Brandt: You are shifting the ground. Now the duty is systemic, not act-specific. But supererogation is about the act. The act itself is what is deemed beyond duty. If you redefine the duty to be systemic, you change the definition of the act. You are arguing semantics. The donor feels they are going above and beyond. The bystander feels they are not to blame for not jumping. These intuitions are robust. Your theory requires us to distrust our deepest moral feelings in favor of a ledger.

  Voss: I require us to trust our feeling of unease more than our feeling of absolution. The bystander feels no blame, yes. But do they feel clean? Often, they feel shame. That shame is the recognition of the budget deficit. They know something was owed. Your theory tells them they are clean. Mine tells them they are lucky. There is a moral difference between being clean and being lucky. The hero makes them lucky.

  Brandt: I agree there is a difference. But I deny that luck implies duty. If I find a wallet and return it, I am lucky to have the opportunity to be honest. I am not fulfilling a duty that others failed. I am simply acting well. The hero is the same. They seize an opportunity for greatness. You see a gap in the wall. I see a window they chose to open. If we close the window and call it a door, we lose the freedom of the choice. Supererogation protects the agent's right to a moral life that is not wholly consumed by the needs of others.

  Voss: And I say that right is purchased by the silence of the heroes. If we acknowledge the budget, we acknowledge that the agent's life is not entirely their own when need is present. We do not consume it, but we acknowledge the claim. Your view protects the agent. Mine protects the patient, the one in need. The disagreement is not about whether the hero is praiseworthy. We agree on that. The disagreement is about whether the praise is for a gift or for a service.

  Brandt: Precisely. And if it is a service, who is the employer? The community? The moral law? If the community is the employer, then the community owes the hero wages, or at least restitution. But we do not pay heroes. We statue them. We sing about them. That fits the gift model. We do not pay people for gifts.

  Voss: We do not pay them because we cannot. The currency is moral standing, not money. We give them honor. Honor is the receipt for a debt paid on behalf of others. We statue them to remind ourselves of the deficit they covered. It is not payment; it is acknowledgment of the imbalance.

  Brandt: Then we are left with this. I maintain that there is a category of action that is good, optional, and blameless to omit. You maintain that such actions are actually mandatory at a collective level, optional only at an individual level because of assignment failure.

  Voss: Yes. And that the omission is not blameless, merely unenforceable. There is a difference between having no duty and having a duty we lack the mechanism to enforce.

  Brandt: And I say that if we lack the mechanism to enforce it, and no individual is bound by it, then for all practical moral purposes, it is not a duty. It is a wish. Supererogation is the realm of moral wishes realized.

  Voss: And I say it is the realm of moral necessities met by volunteers. We end where we began, Felix. You see a surplus of goodness. I see a deficit of obligation.

  Brandt: Then the precise disagreement is this. Is the moral landscape defined by the limits of individual obligation, or by the extent of collective need?

  Voss: That is it. If it is individual obligation, you are right. If it is collective need, I am. And until we agree on the unit of moral agency, the hero will remain either a saint or a contractor.

  Brandt: And we will remain either grateful beneficiaries or indebted slackers.

  Voss: Which is the stronger motivator for the next person standing on the ice?

  Brandt: I hope gratitude. But I fear you may be right about the shame.

  Voss: Then let us not resolve it. Let the tension stand. The hero jumps either way.

  Brandt: Yes. They jump. And we watch. And whether we thank them or owe them, the child lives.

  Voss: The child lives. But the ledger remains open.

  Brandt: Until the next time.

  Voss: Until the next time.
