      *   *New Distinction:* Distinguish between **Truth as a Constraint** (metaphysical) vs. **Truth as a Status** (social).
      *   *Better yet:* Frame it as a disagreement about **Vulnerability**. The Critic wants our beliefs to be vulnerable to the *World*. The Rortian says our beliefs are only vulnerable to *Other Beliefs* (since we access the world only through beliefs).
      *   *The "Progress" Move:* Acknowledge that Rorty wins on *explanation* (causal), but Critics win on *motivation* (normative). The progress is realizing Rorty offers a *description* of science, while Critics offer a *mythology* necessary for science's self-image.
