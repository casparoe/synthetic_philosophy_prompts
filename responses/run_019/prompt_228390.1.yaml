      *   *Rortian Move:* "I'm not denying electrons exist. I'm denying 'correspondence' explains *why* we believe in electrons. We believe because the vocabulary works for our purposes. You can keep saying 'science works,' just don't add the metaphysical gloss." (The Therapeutic/Redescription Move).
      *   *Critic Counter:* "But *why* does it work? Because it latches onto reality! You're smuggling in correspondence while denying it." (The Incoherence Charge).
      *   *Rortian Counter:* "You're asking for a God's-eye view justification that isn't available. Stop asking for it." (The Quietist Move).

  3.  **Evaluate Potential Diagnoses:**
      *   *Is it a verbal dispute?* (Just fighting over the word "truth"?)
          *   Partially. But it's deeper. It's about the *utility* of the concept. If they tabooed "truth," they'd fight over "justification" or "success." So, not merely verbal.
      *   *Is it about bedrock intuitions?* (Philosophical vs. Sociological answers?)
          *   Yes. The critic wants a *normative constraint* from the world. The Rortian wants a *causal/social explanation* of belief.
      *   *Is it about the function of theory?*
          *   This seems strongest. One side thinks philosophy's job is to *ground* inquiry. The other thinks philosophy's job is to *dissolve* the demand for grounding.

  4.  **Synthesize the Diagnosis:**
      *   The debate isn't about *what is true*. It's about *what problem the concept of truth is solving*.
      *   The Critic sees "Truth" as a **Regulative Ideal**. It's a goalpost that keeps inquiry honest. Without it, inquiry loses its north star.
      *   The Rortian sees "Truth" as a **Compliment**. It's a pat on the back we give beliefs that currently work. It's backward-looking, not forward-looking.
      *   The "Loop" happens because they are playing different games. The Critic is playing "Justification" (How do I prove this is right?). The Rortian is playing "Genealogy" (How did we come to think this is right?).
      *   *Key Insight:* The Critic fears *loss of normativity*. The Rortian fears *pseudo-explanation*.

