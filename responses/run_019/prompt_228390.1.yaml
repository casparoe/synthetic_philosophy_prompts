      *   **The Observation:** The debate loops. Both sides are smart/read. The moves are predictable.
      *   **The Task:** Diagnose the *kind* of disagreement this is. Is it about the function of truth theories? A verbal dispute? Bedrock intuitions (philosophical vs. sociological)?
