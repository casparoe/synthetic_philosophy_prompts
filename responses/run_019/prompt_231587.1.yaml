      *   *Decisive:* Proving that "Reason" is *always* culturally situated. (This kills the universal claim).

      *Unfalsifiability:* If every counter-example is dismissed as "not true reason," the theory is empty.

      *Okay, ready to write.*

  9.  **Final Review against constraints:**
