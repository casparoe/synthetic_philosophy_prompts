      *(One last check on British spelling)*: "defence", "offence", "labour", "honour", "centre", "analyse". "Programme". "Whilst".

      *(Thought on the Pyrrhus quote)*: Ensure I acknowledge that Pyrrhus admired the *order*, not necessarily the morality. Montaigne extrapolates to morality. This is a point of tension.

      *(Refining the "Reason" critique)*: The strongest philosophical pressure comes from Nietzsche or Foucault (though I won't name drop as per instructions), suggesting "reason" is a will to power. I will describe the *argument* without the bibliography.

