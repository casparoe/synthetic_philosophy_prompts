      *   Make sure the "concrete case" is robust.

      *(Self-Correction on the Concrete Case)*: I need to be careful not to just assert Western superiority. The argument must be that *suffering* is the metric, not *Western-ness*. The practice of **foot-binding** vs. **unbound feet** is a good candidate. It was a custom, justified by beauty/status. It caused permanent physical damage. The "reason" standard is bodily integrity/health. Is that just a custom? Most would say no, it's biological reality. This fits well.

      *(Alternative Concrete Case)*: **Trial by Ordeal** vs. **Evidence-based Justice**. One relies on magic, one on causality. Causality isn't a custom; it's how the world works. This is a strong epistemic argument. Let's use **Trial by Ordeal** or **Medical Practice**. Let's go with **Medical Practice (Germ Theory vs. Humoral/Spiritual)** as it shows *instrumental* reason clearly. But the prompt implies *moral* evaluation ("barbarous"). Let's stick to **Chattel Slavery** but frame it around the capacity for suffering and agency, which are biological/psychological facts, not just customs.

      *Actually, let's combine them.* The most pressing pressure is the **Hermeneutic Circle**: You cannot step outside your own culture to find "pure reason."

