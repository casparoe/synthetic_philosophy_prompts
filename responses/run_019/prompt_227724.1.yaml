answer: |-
  # THE FANATICISM DIAGNOSTIC
  **Module:** Decision Theory III | **Time:** 15 Minutes | **Format:** Tick one box per question.

  **Instructions:** For each scenario, select the action that best matches your immediate verdict. Do not overthink for consistency; answer intuitively.

  **1. The Street Mugger**
  A stranger stops you. "Give me your wallet (£50). I have magic powers. I cannot prove it, but if you pay, there is a $1$ in $10^{100}$ chance I will use my powers to save $3 \uparrow\uparrow\uparrow 3$ lives in a parallel dimension."
  [ ] A) Pay the £50.
  [ ] B) Refuse.
  [ ] C) Walk away without engaging.

  **2. The Public Budget**
  You control a £10m fund. Option X: Buy vaccines, certainly saving 1,000 lives. Option Y: Fund a speculative physics experiment with a 1 in 1 billion chance of averting an extinction event (saving 8 billion lives), otherwise saving none.
  [ ] A) Fund Option Y (The Gamble).
  [ ] B) Fund Option X (The Certain Good).
  [ ] C) Split the fund.

  **3. St Petersburg Casino**
  A fair coin is tossed until it lands Heads. If Heads appears on toss $n$, you win £$2^n$. The expected value is infinite. The entry fee is £1,000.
  [ ] A) Pay the fee.
  [ ] B) Refuse.
  [ ] C) Pay only if the fee is much lower (e.g., £20).

  **4. The Unreliable Source**
  Same as Q1 (Mugger), but the stranger is visibly dishevelled and has a history of lying. The stated odds ($10^{-100}$) are your best guess of the *actual* probability given his testimony.
  [ ] A) Pay.
  [ ] B) Refuse.

  **5. The Trusted Oracle**
  Same as Q1 (Mugger), but the offer comes from a supercomputer you have verified to be honest and competent. It asserts the objective chance is $10^{-100}$.
  [ ] A) Pay.
  [ ] B) Refuse.

  **6. Infinite Salvation**
  Option A: One person certainly dies. Option B: A $1$ in $10^{50}$ chance that everyone achieves eternal bliss (infinite utility), otherwise everyone suffers eternal torment.
  [ ] A) Choose Option B.
  [ ] B) Choose Option A.
  [ ] C) Refuse to choose.

  **7. The Infinitesimal**
  A proposition is true with probability $\epsilon$, where $\epsilon$ is a positive non-standard infinitesimal (smaller than any real number). Payoff is $1/\epsilon$ utility.
  [ ] A) Accept the gamble.
  [ ] B) Reject the gamble.
  [ ] C) Claim the probability is undefined.

  **8. The Moderate Infinite**
  Option A: 1 person certainly dies. Option B: A **10%** chance that everyone achieves eternal bliss, otherwise everyone suffers eternal torment.
  [ ] A) Choose Option B.
  [ ] B) Choose Option A.

  **9. The Lexical Intuition**
  Option A: 1 person certainly loses their life savings. Option B: A 1 in 1 trillion chance of preventing a disaster that costs 10 trillion lives their savings.
  [ ] A) Choose Option B.
  [ ] B) Choose Option A.

  **10. Deep Uncertainty**
  "You face a risk. We cannot assign a number to the probability; it is unknown and unknowable. The payoff is astronomical."
  [ ] A) Act as if the probability is high enough to matter.
  [ ] B) Act as if the probability is zero.
  [ ] C) Refuse to maximise expected utility here.

  ---
  *(End of Quiz. Turn over for Scoring Key and Analysis.)*

  # SCORING KEY & TEACHER'S GUIDE

  ### 1. Diagnostic Profiles
  Count the 'A' (Accept Fanaticism) responses. Patterns matter more than totals.

  | Profile | Typical Pattern | Decision Stance |
  | :--- | :--- | :--- |
  | **The Strict Maximiser** | A on Q1, Q3, Q5, Q6, Q8. | **Strict EU.** Unbounded utility, linear probability weighting. Accepts fanaticism. |
  | **The De Minimis** | B on Q1, Q2, Q9; A on Q8. | **Lexical Threshold.** Probabilities below a cutoff ($\epsilon$) are treated as zero. Above cutoff, EU holds. |
  | **The Bounded Agent** | B on Q6, Q8; A on Q2 (maybe). | **Bounded Utility.** Utility caps at some finite value. Infinite payoffs do not dominate. |
  | **The Risk-Weighter** | B on Q1, Q3; A on Q2. | **Risk-Weighted EU (Buchak).** Probabilities are transformed non-linearly; tiny chances are downweighted. |
  | **The Epistemic Skeptic** | B on Q4; A on Q5. | **Credibility Focus.** Rejects mugging due to testimony reliability, not decision theory. |
  | **The Imprecise Bayesian** | C on Q7, Q10. | **Imprecise Credences.** Refuses to assign point probabilities under deep uncertainty. |

  ### 2. The Credibility Constraint (Q4 vs Q5)
  *   **Consistent Rejectors (B/B):** Your objection to Pascal's Mugging is structural (EU, Bounds, or Thresholds).
  *   **Inconsistent (B on Q4 / A on Q5):** You conflate *probability of the event* with *credibility of the speaker*. You likely reject the standard Mugging because you think the mugger is lying, not because you reject the math.
  *   **Consistent Acceptors (A/A):** You are a rare beast (or a troll).

  ### 3. Logical Space & Empty Cells
  The quiz maps three binary axes: **Utility Bounds** (Bounded/Unbounded), **Probability Weighting** (Linear/Non-Linear/Threshold), and **Credence Precision** (Precise/Imprecise).

  *   **The "Bounded vs. Diminishing" Problem:** This quiz *cannot* cleanly separate **Bounded Utility** from **Steeply Diminishing Marginal Utility of Lives**. Both yield 'B' on Q6 and Q8. To separate them, one would need a scenario involving a single life with infinite duration vs. finite lives, which is conceptually messy. Treat these two positions as functionally equivalent for undergraduate purposes.
  *   **Empty Cell (The "Infinite Cautious"):** Rejecting Q8 (10% chance of Infinite Good) while Accepting Q2 (Tiny chance of Finite Good) is theoretically unstable. If you reject Infinite Payoffs at 10% probability, you likely have Bounded Utility. If you have Bounded Utility, you should also reject the St Petersburg Gamble (Q3). Students who mark **B on Q8 but A on Q3** occupy incoherent space (fearing infinity in ethics but not in gambling).
  *   **Empty Cell (The "Threshold Inverter"):** Accepting Q1 ($10^{-100}$) but Rejecting Q2 ($10^{-9}$). Unless the utility difference is vastly larger than the probability difference, this suggests inconsistent threshold setting.

  ### 4. Pedagogical Notes
  *   **Q3 (St Petersburg):** Distinguishes those who fear *infinite expectation* (B) from those who fear *tiny probabilities* (De Minimis). A De Minimis agent might accept St Petersburg if they view the probability of long runs as above their threshold, whereas a Bounded agent rejects it outright.
  *   **Q7 (Infinitesimals):** Catches students who object to *standard real numbers* specifically, rather than small probabilities generally.
  *   **Q10 (Unknown Prob):** Separates Risk-Weighting (known low prob) from Imprecise Credence (unknown prob).

  **Design Note:** The distinction between **Lexical Thresholds** and **Risk-Weighted EU** is subtle. Lexical views say $p < \epsilon \implies$ Ignore. Risk-Weighted views say $w(p) \ll p$. In practice, both reject Q1. They diverge on Q9 (1 in 1 trillion). A Risk-Weighter might still accept if the utility gain is high enough to overcome the weighting function; a Lexical view rejects it outright if below threshold. Use Q9 to probe this nuance in seminar discussion.

  *(c) Decision Theory Module, [University Name]. Fit for A4 Double-Sided Print.*
