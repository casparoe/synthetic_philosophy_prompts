          1.  Briefly state what the question is testing.
          2.  Go through the answer point-by-point (strengths vs. errors/conflations).
          3.  Assign a mark out of 100.
          4.  Justify the mark with specific comments (no general impressions).
          5.  Tone: Expert, careful, attentive to subtleties (no hasty grading).

  2.  **Analyze the Exam Question:**
      *   **Topic:** Pascal's account of justice and force (*Pensées*, primarily fragments 103, 104, 135, 294, etc.).
      *   **Core Task 1:** Explain the relation between justice and force.
      *   **Core Task 2:** Discuss the claim "custom is the whole of equity" (*la coutume est toute l'équité*).
      *   **Core Task 3 (The Crux):** Does Pascal reduce justice to power (positivism/realism), or is there an independent normative standard (natural law/divine justice)?
      *   **Key Textual Knowledge Required:** *Pensées* (Lafuma numbering usually), specifically the "Miserable Greatness" or "Political" fragments. Key concepts: *la force*, *la justice*, *la coutume*, the distinction between *juste* (just) and *légitime* (legitimate), the Pyrrhonian skepticism context, the theological backdrop (Fall, hidden God).

  3.  **Analyze the Student Answer:**
      *   *Paragraph 1 (Justice vs. Force):* "people can never agree about what justice requires, whereas force is publicly recognisable." -> Accurate reflection of Pascal's skepticism about rational consensus on justice.
      *   *Paragraph 1 (Inference):* "justice... too controversial to secure social order... Force... unambiguous social fact." -> Good grasp of the pragmatic problem.
      *   *Paragraph 2 (Synthesis):* "force without justice is tyrannical... justice without force is merely ineffective." -> This is a standard reading, but needs checking against Pascal's actual cynicism. Pascal often says force *makes* justice.
      *   *Paragraph 2 (Legitimacy):* "Legitimate authority therefore has to unite the two... force must be made just." -> Here is a potential slip. Pascal often argues we *call* force just because it is force.
      *   *Paragraph 3 (Custom):* "institution that does this is custom... custom supplies the content of public justice." -> Accurate. "Custom is the whole of equity."
      *   *Paragraph 3 (The Crux - Reductionism?):* "Crucially, this is not a reduction of justice to power, because Pascal preserves a distinction between the just and the useful: the underlying moral law remains accessible to reason, and custom is only a remedy for our fallen inability to coordinate on that law, not the source of the law itself." -> **RED FLAG.** This is the most contentious part of the answer.

  4.  **Evaluate the "Red Flag" (Theological/Normative Standard):**
      *   *Standard Interpretation:* Pascal is a Pyrrhonian skeptic in politics. He argues that we *cannot* know true justice by reason alone in our fallen state. "Custom is the whole of equity" is a strong statement. He often suggests that laws are followed *because* they are laws, not because they are just.
      *   *The Student's Claim:* "underlying moral law remains accessible to reason."
      *   *The Problem:* Pascal explicitly denies that reason can reliably access true justice in the civil sphere. For Pascal, true justice exists (in God/Charity), but it is *hidden* from human reason in political life. To say it is "accessible to reason" contradicts his skeptical epistemology regarding politics. He distinguishes between *la justice* (divine/true) and *la légitimité* (human/customary), but he argues we cannot use the former to judge the latter in practice.
      *   *Nuance:* Does Pascal preserve an independent standard? Yes, in a theological sense (God's justice). Is it accessible to reason? No, not for political adjudication. The student conflates "exists in God" with "accessible to reason."
      *   *Another Nuance:* The student says custom is "not the source of the law itself." For Pascal, in the *political* realm, custom *is* the source of legitimacy. True justice (Charity) is a different order entirely (*ordre de la charité* vs. *ordre de la politique*). The student blurs these orders.

  5.  **Drafting the Critique:**
      *   *What is the question testing?* Understanding of Pascal's political skepticism, the force/justice dialectic, and the theological underpinnings of his conventionalism.
      *   *Strengths:* Good grasp of the force/justice impasse. Correctly identifies the role of custom in stabilizing society. Good structure.
      *   *Weaknesses:* The conclusion is too optimistic/rationalist about "accessible to reason." It misses the radical skepticism of the "custom is the whole of equity" claim. It conflates the *ordre de la charité* with political reason. It softens Pascal's cynicism about legitimacy.
      *   *Marking:* It's a competent MA answer but misses the crucial theological/skeptical nuance in the final conclusion. It's not a fail, but it's not a distinction. It's a solid 2:1 or low First equivalent. Let's say 68-72 range. I'll aim for 70/100.

