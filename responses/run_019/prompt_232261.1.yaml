answer: |-
  # Desiderata for a Theory of the Franchise

  To evaluate proposals regarding the franchise, we must first establish the criteria a successful theory must meet. A theory of the franchise must explain both the **boundary of inclusion** (who votes) and the **normative character** of the act (right vs. duty). Below are the necessary conceptual distinctions, the desiderata themselves (categorized by necessity), and a diagnosis of the structural tensions that arise when these criteria collide.

  ## I. Necessary Conceptual Distinctions

  Before listing desiderata, a theory must rigorously distinguish between the following concepts. Confusing them leads to category errors in boundary setting.

  **1. All-Subjected vs. All-Affected**
  *   **Distinction:** The *All-Subjected Principle (ASP)* holds that anyone subject to the coercive authority of the state (its laws) should vote. The *All-Affected Principle (AAP)* holds that anyone whose interests are significantly impacted by state decisions should vote.
  *   **Case for Weight:** ASP is administratively clearer and ties voting to political obligation (you obey, you choose). AAP is morally broader but risks infinite regress (e.g., does a foreigner affected by climate policy vote?).
  *   **Relevance:** Crucial for **non-citizen residents** (subjected but not citizens) and **non-resident citizens** (citizens but not subjected).

  **2. Capacity (Competence) vs. Status (Membership)**
  *   **Distinction:** *Capacity* refers to the cognitive/agency ability to understand and choose. *Status* refers to legal or social standing (citizenship, age, residency).
  *   **Case for Weight:** Basing the franchise on Status is stable but risks aristocracy. Basing it on Capacity is meritocratic but risks ableism and invasive testing.
  *   **Relevance:** Crucial for **adolescents/children** and **voters with cognitive disabilities**.

  **3. Claim-Right vs. Civic Duty**
  *   **Distinction:** Is voting a *liberty/claim-right* (I may vote, and you cannot stop me; or I may abstain)? Or is it a *legal obligation* (I must vote, or face penalty)?
  *   **Case for Weight:** A Right prioritizes individual autonomy and protects against coerced expression. A Duty prioritizes collective legitimacy and ensures representative turnout.
  *   **Relevance:** Crucial for **compulsory voting systems**.

  ---

  ## II. The Desiderata

  The following are the requirements for a plausible theory. They are marked as **Non-Negotiable (NN)** (conditions any democratic theory must meet to be coherent) or **Camp Preferences (CP)** (contested normative commitments).

  ### 1. The Legitimacy Constraint (NN)
  *   **Requirement:** The franchise must be structured such that the resulting government can claim legitimate authority over the governed.
  *   **Case:** Without a plausible link between the voters' will and the state's authority, rule is mere force.
  *   **Implication:** Excludes random selection (sortition) as the *sole* method, as it severs the link between popular will and policy.

  ### 2. The Protection Principle (NN)
  *   **Requirement:** Those permanently subject to the state's coercive power must have a mechanism to protect their fundamental interests.
  *   **Case:** "No taxation without representation." Permanent subjection without a voice creates tyranny.
  *   **Implication:** Strongly supports enfranchising **long-term non-citizen residents**.

  ### 3. The Agency/Competence Threshold (NN)
  *   **Requirement:** Voters must possess a minimum threshold of cognitive agency to understand the act of voting and its consequences.
  *   **Case:** Voting is an exercise of political judgment. If an agent cannot distinguish between choices or understand the concept of representation, the vote is not an expression of will but noise.
  *   **Implication:** Excludes infants and severe cognitive cases *unless* a proxy model is adopted. This is the primary friction point for **children** and **cognitive disabilities**.

  ### 4. The Equality of Weight (NN)
  *   **Requirement:** Within the enfranchised class, votes must carry equal weight (One Person, One Vote).
  *   **Case:** Political equality is the core democratic value. Graded voting (more votes for the educated) violates moral equality.
  *   **Implication:** Excludes plural voting schemes.

  ### 5. The Integrity of the Polity (CP)
  *   **Requirement:** The franchise should not be extended to those whose participation would fundamentally undermine the security or continuity of the state.
  *   **Case:** Often invoked to justify **prisoner disenfranchisement** (breach of social contract) or restrictions on **non-resident citizens** (lack of stake in daily outcomes).
  *   **Implication:** Allows for restriction based on behavior (crime) or lack of shared fate (expats).

  ### 6. The Liberty of Abstention (CP)
  *   **Requirement:** Voting must remain a voluntary act; citizens cannot be compelled to participate.
  *   **Case:** Freedom of speech includes the freedom *not* to speak. Compelled voting forces insincere expression and treats the citizen as a resource of the state.
  *   **Implication:** Rules out **compulsory voting**. (Opposing CP: The Civic Duty view argues turnout is a public good necessary for legitimacy).

  ### 7. The Universality Presumption (CP)
  *   **Requirement:** The default position should be inclusion; exclusions require specific, heavy justification.
  *   **Case:** Historical patterns show exclusions are often tools of oppression (race, gender). The burden of proof lies on the excluder.
  *   **Implication:** Presses toward lowering the **voting age** and restoring rights to **ex-felons**.

  ---

  ## III. Diagnosis of Tensions and Pressure Points

  No theory satisfies all desiderata perfectly. The following analysis diagnoses where the criteria conflict, specifically addressing your pressure points, and identifies which requirement forces the exclusion.

  ### 1. The Inclusion vs. Competence Tension
  *   **The Conflict:** The *Protection Principle* and *Universality Presumption* pull toward enfranchising everyone affected by laws (including **children** and those with **severe cognitive disabilities**). The *Agency/Competence Threshold* pulls toward restricting the vote to those capable of independent judgment.
  *   **Pressure Point:** **Adolescents/Children.** A 16-year-old is subject to laws (ASP) and affected by decisions (AAP). However, do they meet the Agency Threshold?
  *   **Pressure Point:** **Cognitive Disabilities.** If we enforce a strict competence test, we risk eugenics-style exclusion. If we enforce none, we violate the definition of voting as a deliberate act.
  *   **Resolution:** **The Agency Threshold usually wins.**
      *   *Why:* A vote cast without agency cannot contribute to *Legitimacy*. It turns the voter into a vessel for whoever controls them (parents, guardians).
      *   *Concession:* This excludes young children entirely. For adolescents, the line is arbitrary but necessary. For cognitive disabilities, the theory must rely on *supported decision-making* rather than proxy voting to maintain the link to agency, or accept a very low bar for competence that risks trivializing the act.

  ### 2. The Subjection vs. Membership Tension
  *   **The Conflict:** The *Protection Principle* (based on ASP) argues that anyone living under the law should vote. The *Integrity of the Polity* (based on shared fate/citizenship) argues that only members of the national community should decide its direction.
  *   **Pressure Point:** **Long-term Non-Citizen Residents.** They are subjected to laws but lack citizenship status.
  *   **Pressure Point:** **Non-Resident Citizens.** They have status but are not subjected to daily laws or consequences.
  *   **Resolution:** **Subjection (ASP) trumps Status for local elections; Status trumps Subjection for national sovereignty.**
      *   *Why:* At the local level, the *Protection Principle* is dominant (you live here, you use the schools/roads). At the national level, the *Integrity of the Polity* dominates (foreign policy, war, constitutional identity require a bounded community of fate).
      *   *Concession:* Non-citizen residents are often excluded from national votes (violating pure ASP). Non-resident citizens are often kept on rolls (violating pure ASP), justified by a "potential return" or cultural tie, which is a weak justification under strict theory.

  ### 3. The Punishment vs. Universality Tension
  *   **The Conflict:** The *Universality Presumption* argues that rights should not be lost. The *Integrity of the Polity* argues that breaking the social contract forfeits one's say in it.
  *   **Pressure Point:** **Prisoners and Ex-Felons.**
  *   **Resolution:** **Universality trumps Retribution.**
      *   *Why:* Disenfranchisement punishes the individual but also harms the *Legitimacy* of the state by creating a class of subjects without voice. Furthermore, it disproportionately affects specific demographics, violating *Equality*.
      *   *Concession:* While incarcerated, the *Agency* argument is sometimes used (separation from society), but upon release (ex-felons), the *Protection Principle* demands immediate restoration. A theory that permanently disenfranchises ex-felons fails the *Legitimacy Constraint* in a democracy.

  ### 4. The Liberty vs. Duty Tension
  *   **The Conflict:** The *Liberty of Abstention* views voting as a personal right. The *Legitimacy Constraint* (interpreted collectively) views high turnout as necessary for the government to claim it represents the people.
  *   **Pressure Point:** **Compulsory Voting.**
  *   **Resolution:** **Liberty trumps Duty.**
      *   *Why:* Compulsory voting treats the citizen as a means to an end (statistical legitimacy). It violates the *Agency Threshold* by forcing those with no preference to choose, introducing noise.
      *   *Concession:* While compulsory voting increases turnout, it degrades the expressive quality of the vote. A plausible theory must treat voting as a *protected liberty*, not a *legal obligation*, though it may encourage it civically.

  ---

  ## IV. The Exclusionary Mechanism: Which Desideratum Wins?

  If we must identify the single desideratum that does the most work to exclude otherwise plausible candidates, it is **The Agency/Competence Threshold (NN)**.

  **Why this is the "Killer Constraint":**
  1.  **It creates the hard floor:** The *Protection Principle* and *Universality Presumption* are expansive; they want to include everyone. The only brake on total universalism (including infants, the comatose, or non-human entities affected by policy) is the requirement that the voter be an *agent*.
  2.  **It defines the act:** If voting is not an exercise of judgment, it is not voting. Therefore, any entity incapable of judgment *cannot* be enfranchised without changing the definition of the franchise itself.
  3.  **It creates the hardest ethical dilemmas:** It is the source of the most difficult pressure points. Excluding prisoners is punitive but reversible. Excluding non-citizens is jurisdictional. But excluding the cognitively disabled or the young based on "competence" risks sliding into ableism or arbitrary age-gating.

  **The Verdict on Tensions:**
  A plausible theory of the franchise must accept that **Competence limits Protection.** We cannot fully satisfy the *Protection Principle* (protecting all affected interests) because doing so would require enfranchising agents who cannot exercise the vote. Therefore, the theory must accept that some affected interests (children, severe cognitive disabilities) will be protected *vicariously* (by guardians or representatives) rather than *directly* (by their own vote).

  **Summary of the "Give":**
  *   **Children/Disability:** *Competence* wins over *Affectedness*. (They are protected, but do not vote).
  *   **Non-Citizens:** *Subjection* wins over *Citizenship* (locally), but *Citizenship* wins over *Subjection* (nationally).
  *   **Prisoners:** *Universality* wins over *Retribution*. (Rights are suspended during incarceration only if necessary for security, restored immediately after).
  *   **Compulsory Voting:** *Liberty* wins over *Civic Duty*. (Turnout is a goal, not a mandate).

  Any proposal that fails to acknowledge the **Agency/Competence Threshold** as a non-negotiable boundary fails to describe a system of *voting*. Any proposal that uses that threshold to justify permanent exclusion of marginalized groups (like ex-felons or specific disabilities) without individualized assessment fails the **Equality** and **Legitimacy** constraints. The theory lives in the narrow space between these poles.
