answer: |-
  Your friend has grasped one of the most provocative aspects of Thomas Kuhn's *The Structure of Scientific Revolutions*, but she has likely pushed it further than Kuhn intended, relying heavily on the rhetorical power of the political metaphor to do the heavy lifting. It is a common interpretation, but it is also one that many philosophers of science have pushed back against.

  Here is an audit of the political analogy, broken down as you requested.

  ### 1. The Correspondence Table

  Your friend's analogy maps the structure of a scientific community onto the structure of a state. Here is how the pieces fit together in her argument:

  | Political Concept | Scientific Concept (Friend's Mapping) |
  | :--- | :--- |
  | **The Constitution** | **The Paradigm** (rules, standards, metaphysical assumptions). |
  | **The Citizens** | **Normal Scientists** (working within the rules). |
  | **The Rulers/Govt** | **The Scientific Elite** (textbook authors, prize committees, senior professors). |
  | **Grievances** | **Anomalies** (experiments the paradigm cannot explain). |
  | **Loss of Authority** | **Crisis** (loss of confidence in the paradigm). |
  | **Revolution** | **Paradigm Shift** (adoption of a new framework). |
  | **Counter-Revolutionaries** | **Holdouts** (older scientists who refuse to convert). |
  | **Claim to Legitimacy** | **Claim to Truth** (justification for the new paradigm). |
  | **History by Victors** | **Textbook History** (rewriting the past to make the new paradigm look inevitable). |

  ### 2. Where the Mapping Breaks

  While the sociology of science does resemble politics (scientists are human, they form cliques, and they protect their status), the analogy fails when we look at the *object* of their labour.

  *   **The Recalcitrance of Nature:** In politics, reality is largely what we agree it is. If the parliament votes to change the definition of citizenship, it changes. In science, nature does not vote. If a theory predicts a planet will be at position X and it is at position Y, the theory is in trouble regardless of the consensus. Nature pushes back in a way the physical world does not in politics.
  *   **The Fate of the Old Order:** When a political revolution occurs, the old laws are often repealed or ignored. The Monarchy is abolished; the Constitution is burned. In science, the old theory must still account for the data it previously explained. Einstein did not repeal Newton's laws; he subsumed them. Newton's equations still work perfectly for building bridges, even if they fail near black holes.
  *   **Instrumental Success:** A new government is not necessarily better at feeding its people than the old one; it simply claims to be more legitimate. A new scientific paradigm *must* demonstrate greater puzzle-solving ability. It must predict new phenomena or resolve the anomalies that caused the crisis. If it does not, the revolution fails.
  *   **The Goal:** The goal of a state is order, justice, or stability (normative goals). The goal of science is predictive accuracy and control over nature (empirical goals).

  ### 3. Which Disanalogies Matter for Her Conclusions?

  This is the crux of your debate. We must separate superficial differences from those that dismantle her argument.

  **Conclusion 1: "We shouldn't call old theories simply wrong."**
  *   **The Analogy's Support:** In politics, the old constitution isn't "false," it is just "invalid." By mapping science onto this, your friend suggests phlogiston is merely "invalid," not false.
  *   **The Crucial Disanalogy:** *Empirical Constraint.* Phlogiston theory posited that fire releases a substance called phlogiston, meaning burnt objects should lose mass. In reality, many gain mass (oxidation). This is not a matter of changing rules; it is a factual error about the world.
  *   **Verdict:** The analogy hides the fact that scientific theories make claims about reality that can be factually incorrect, not just procedurally invalid. However, there is a nuance: Newtonian physics is not "wrong" in the sense of being useless; it is a *limiting case* of Relativity. But to say it isn't wrong *at all* ignores that its fundamental ontology (absolute time) is incompatible with observation. The political analogy cannot distinguish between "useful approximation" and "factual error."

  **Conclusion 2: "Science doesn't progress toward truer pictures."**
  *   **The Analogy's Support:** A democracy is not a "truer" form of government than a monarchy; it is just a different regime. If science is like this, Quantum Mechanics is not "truer" than Classical Mechanics, just a different regime.
  *   **The Crucial Disanalogy:** *Cumulative Puzzle-Solving.* While Kuhn argued science isn't *cumulative* in the sense of simply adding bricks to a wall, he did believe in *evolutionary progress*. New paradigms allow us to do things old ones could not (e.g., GPS requires General Relativity; it would fail with only Newton). A new government does not necessarily allow you to fly or cure diseases.
  *   **Verdict:** This is where the analogy is doing the most damage. It equates *authority* with *accuracy*. In politics, legitimacy is social. In science, legitimacy is partly social, but it is anchored by empirical success. If the analogy is dropped, the claim that science does not progress toward a truer picture becomes much harder to sustain, because we can measure "truer" by "more accurate predictions."

  ### 4. Does the Argument Survive without the Analogy?

  If you strip away the political metaphor, your friend's argument becomes significantly weaker. The political analogy is quietly supplying the relativism.

  Kuhn himself was not a relativist in the sense your friend implies. He believed science progresses, but not toward a pre-destined "Truth" with a capital T. He believed it progresses like biological evolution: towards better adaptation to the environment (nature), not towards a final perfect form.

  Your friend is using the political analogy to argue for **incommensurability** (the idea that you cannot compare paradigms because they speak different languages) and turning it into **relativism** (the idea that neither is better).
  *   **Incommensurability** has some merit: concepts like "mass" mean different things to Newton and Einstein.
  *   **Relativism** does not follow: Even if they define mass differently, Einstein's framework predicts phenomena Newton's cannot.

  Once you remove the "Constitution" metaphor, you are left with the question: *Does the new theory handle the evidence better?* If the answer is yes (and historically, it almost always is), then there is progress, and the old theory was, in specific regards, wrong. The political analogy allows your friend to bypass the evidence by focusing on the *sociology* of the change rather than the *substance* of it.

  ### 5. A Better Analogy: Cartography (Map-Making)

  If the political analogy leads to relativism, try offering your friend the analogy of **map-making**.

  *   **The Paradigm:** A specific projection or style of map (e.g., Mercator vs. Peters).
  *   **Anomalies:** Distortions discovered on the map (e.g., Greenland looks too big).
  *   **Revolution:** Switching to a new projection or satellite imaging.
  *   **Progress:** New maps are not "perfect" (all maps distort something), but they are *more accurate* representations of the terrain than the old ones.
  *   **Old Maps:** An old map isn't "garbage"; it might still get you from London to Birmingham. But if you try to sail to the Americas with it, you will fail. It is not just a "different regime"; it is a less accurate representation of the coastline.

  **Why this works better:**
  1.  **It allows for progress:** A modern GPS map is objectively more useful and accurate than a 15th-century portolan chart.
  2.  **It acknowledges limits:** No map is the territory. We never have the "God's eye view" (Truth), but we get closer.
  3.  **It handles the "wrongness" issue:** We can say the old map was *wrong* about the size of Africa without saying it was useless for its time.

  ### Summary for Your Debate

  You can tell your friend that her political analogy is excellent for describing the *sociology* of science (how scientists behave), but terrible for describing the *epistemology* of science (how we know what is true).

  1.  **On "Wrongness":** Nature is not a parliament. You cannot vote a failed prediction into success. Phlogiston was not just "invalidated"; it described a mechanism that does not exist.
  2.  **On Progress:** A new government does not guarantee better harvests. A new paradigm *must* guarantee better predictions, or it is not adopted. That is progress, even if it is not a march toward absolute Truth.

  The political analogy smuggles in the idea that scientific truth is merely a matter of consensus. By switching to a map-making analogy, you preserve Kuhn's insight (that our view is shaped by our tools) without surrendering to the idea that all views are equally valid.
