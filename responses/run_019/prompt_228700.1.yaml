answer: |-
  Your intuition is correct: something is off with that argument, but your roommate isn't entirely crazy. What he is arguing is actually a revived, modern version of market socialism often called **"Cybernetic Socialism"** (championed today by economists like Paul Cockshott).

  However, most economists (even non-Austrians) would say computing power has **not** settled the debate. It has shifted the terms, but it hasn't removed the fundamental hurdles Mises and Hayek identified.

  Here is the breakdown of why the "Big Data solves Socialism" argument is compelling but ultimately incomplete.

  ### 1. You are conflating Mises and Hayek
  Your roommate is treating Mises and Hayek as if they made the exact same argument, but they didn't. Distinguishing them is key to seeing why tech doesn't solve the whole problem.

  *   **Mises' Argument (The Institutional Problem):** Mises argued that without private property in the means of production, there can be no genuine exchange. Without exchange, there are no **prices**. Without prices, there is no common denominator to compare the value of steel vs. labor vs. machinery.
      *   *Why tech doesn't fix this:* You cannot compute a price that doesn't exist. A supercomputer can process data, but it cannot conjure a price signal that only emerges from actual ownership and risk-taking. If the state owns the factory, the "cost" of the machine is just an accounting fiction, not a reflection of scarcity.
  *   **Hayek's Argument (The Knowledge Problem):** Hayek argued that the problem isn't just the *volume* of data, but the **nature** of the data. Much economic knowledge is **tacit** (uncodifiable) and **local**.
      *   *Why tech doesn't fix this:* A sensor can measure how much fuel a truck used, but it cannot measure the driver's hunch that a specific route will be blocked tomorrow, or the local manager's knowledge that a machine sounds "off" even though the diagnostics are green. This knowledge exists only in the minds of individuals and is revealed through action, not data entry.

  ### 2. Optimization vs. Discovery
  This is the strongest counter-argument to your roommate's point.

  *   **Computers optimize known parameters.** If you tell an AI, "Minimize cost while producing 10,000 units," it can find the most efficient way to do that based on existing data.
  *   **Markets discover new parameters.** Entrepreneurship isn't about optimizing the known; it's about discovering the *unknown*. It is about asking, "What if we didn't produce 10,000 units? What if we produced a completely different product nobody knew they wanted?"
  *   **The Limit:** AI is great at solving a puzzle where the rules are fixed. The economy is a game where the players are constantly inventing new rules. Central planning (even with AI) tends to lock in current technologies and preferences, whereas market competition drives the discovery of new ones.

  ### 3. The "Data Doesn't Exist Yet" Problem
  Your roommate assumes that economic data (preferences, costs, values) is sitting out there waiting to be scraped.

  *   **Subjective Value:** In Austrian economics, value is subjective and ordinal. I don't have a "price" in my head for an apple until I am faced with the choice between an apple and a dollar. My preference is created in the moment of choice.
  *   **Prediction vs. Reaction:** Machine learning predicts based on past data. But human preferences change based on new ideas, culture, and innovations. An algorithm can predict what you want based on what you bought last year, but it cannot predict a product that doesn't exist yet (e.g., no amount of 1990s data could have "calculated" the demand for the iPhone).

  ### 4. The Incentive Problem (The Hidden Variable)
  While the Calculation Debate is technically distinct from the Incentive Problem, they overlap in practice.

  *   Even if a central bureau *could* calculate the perfect price using quantum computing, who inputs the data?
  *   If a factory manager knows that if he reports he can produce more with less, the state will just raise his quota next year, he has an incentive to lie or hide capacity.
  *   Markets solve this through profit and loss. If you lie about your efficiency in a market, you go bankrupt. In a planned system, even with great tech, the "garbage in, garbage out" problem remains because the human incentive to manipulate the data remains.

  ### 5. Historical Precedent: Project Cybersyn
  Your roommate's idea has been tried before. In the early 1970s, Chile under Salvador Allende attempted **Project Cybersyn**. They used telex machines (the internet of the day) and early operations research to try to manage the economy in real-time.
  *   **Result:** It was innovative, but it failed to prevent economic collapse.
  *   **Lesson:** The bottleneck wasn't just bandwidth; it was the rigidity of the system in the face of political interference and the inability to capture local nuance.

  ### So, is the debate settled?
  **No.** But your roommate is right that the *strength* of the calculation argument has been weakened by technology, just not eliminated.

  *   **Where he is right:** Technology makes internal planning within large firms (like Amazon or Walmart) much more efficient. These firms are essentially "socialist planned economies" internally, and they work because the scope is limited and the goals are clear (profit).
  *   **Where he is wrong:** Scaling that to an entire nation involves complexity that isn't just mathematical; it's epistemological (about the nature of knowledge) and institutional (about property rights).

  ### How to reply to him
  You can tell him: *"You're right that computers solve the 1930s math problem. But Mises and Hayek weren't just talking about math. They were talking about **property** and **knowledge that can't be digitized.** An AI can optimize a supply chain, but it can't replicate the price signals that come from private owners risking their own money, and it can't capture the tacit knowledge in a worker's head that never gets entered into a database."*

  The debate hasn't been settled by compute; it has moved from "Can we do the math?" to "Can we digitize human judgment and subjective value?" Most economists still say no.
