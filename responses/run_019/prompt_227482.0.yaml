  8.  *(Self-Correction on "The Board Finds")*: If the bylaws say "if the board finds," and a majority votes that they find the tech record good, does the board *not* find it good if you don't vote on it separately?
      *   Interpretation: The "finding" is a mental state aggregated by the vote. If you vote on the outcome, the "finding" is implicit in the votes of the majority (M2, M3, M4, M5). But M2/M3 found Tech Good. M4/M5 found Tech Bad. So the "Board" didn't find Tech Good collectively if you don't vote on it.
