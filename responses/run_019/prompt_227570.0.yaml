prompt: |-
  I'm preparing reading materials for a graduate seminar on metaethics, and I want to get my own head straight before I foist anything on the students. Every treatment of the Frege–Geach problem I've read seems to presuppose a different sense of what the problem even is: some authors treat it as a problem about negation specifically, others as a problem about embedding generally, others as a problem about explaining why moral inference patterns like ordinary inference, and some as a problem about why we don't just "reason ourselves into contradiction" when we combine expressivist commitments across contexts. I no longer trust that these are one problem or that a solution to one transfers to the others.

  Acting as a specialist in metaethics who is neutral between cognitivism and expressivism, write the desiderata that any adequate expressivist semantics for normative language must meet. I want the full specification, not a sales pitch for one family of solutions: the constructions the semantics must handle (negation, disjunction, conditionals with normative antecedents, normative predicates under attitude verbs and modals, mixed normative-descriptive sentences, quantification over normative claims), the inference patterns it must validate or explain away (including why modus ponens on normative premises doesn't commit an equivocation, and why inconsistency between normative judgments behaves like disagreement rather than mere difference of taste), and the data from ordinary practice it must accommodate (e.g., that we call moral claims true, believe them, retract them, and treat them as revisable in light of argument). For each desideratum, state the case or consideration that motivates it, and be explicit about which are genuine constraints that even a non-expressivist should accept and which are arguably cognitivist prejudices that an expressivist may legitimately refuse. If some subset of the desiderata looks jointly unsatisfiable on purely structural grounds -- that is, not because expressivists haven't been clever enough yet, but because the requirements pull against each other -- say so, because that's the part I care about most.

  Then, briefly, assess the main families of response against the list: simple attitude-expressivism plus a logic of attitudes, Gibbard-style possible-worlds treatments in terms of ruling out combinations of plans or norms, "being for"-style approaches that make inconsistency primitive, hybrid views that give normative sentences both descriptive and expressive content, and minimalist or deflationary moves that try to earn truth-aptness cheaply. Before writing the final list, take a moment to brainstorm candidate desiderata freely, then prune and organize them so the final output distinguishes non-negotiable requirements from camp-specific preferences. I care much more about the quality of the criteria than the scorecard; I'll grade the contenders myself in seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Specialist in metaethics, neutral between cognitivism and expressivism.
      *   **Task:** Write the desiderata that any adequate expressivist semantics for normative language must meet.
      *   **Specific Requirements:**
          *   Full specification (not a sales pitch).
          *   Cover constructions (negation, disjunction, conditionals, attitude verbs, modals, mixed sentences, quantification).
          *   Cover inference patterns (modus ponens, inconsistency vs. disagreement).
          *   Cover ordinary practice data (truth, belief, retraction, revisability).
          *   For each desideratum: State the motivation, distinguish genuine constraints from cognitivist prejudices.
          *   Identify potential joint unsatisfiability (structural tensions).
          *   Assess main families of response against the list (Simple Expressivism, Gibbard, "Being For", Hybrids, Minimalism).
          *   Process: Brainstorm first, then prune/organize, then write final output.
      *   **Audience:** Graduate seminar preparation (needs precision, depth, and clarity).
      *   **Tone:** Academic, rigorous, neutral, analytical.

  2.  **Brainstorming Candidate Desiderata:**
      *   *Embedding:* Can we say "It is not the case that stealing is wrong"? Can we say "If stealing is wrong, then lying is wrong"?
      *   *Logic:* Does Modus Ponens work? $P, P \to Q \vdash Q$. If $P$ is "Stealing is wrong," does it mean the same thing in the premise and the conditional? (Frege-Geach core).
      *   *Inconsistency:* Why is "Stealing is wrong and stealing is not wrong" contradictory? Why is "Stealing is wrong and eating broccoli is wrong" not contradictory (usually)?
      *   *Truth:* Can we say "It is true that stealing is wrong"? Can we believe moral propositions?
      *   *Disagreement:* If I say "X is good" and you say "X is bad," we disagree. If I like coffee and you hate it, we don't necessarily disagree in the same way.
      *   *Quantification:* "Everything he did was wrong." "Some actions are obligatory."
      *   *Attitude Verbs:* "John believes that stealing is wrong." "John hopes that peace is possible."
      *   *Mixed Discourse:* "Stealing is wrong and illegal." "If stealing is wrong, then the law should ban it."
      *   *Revision:* Can I change my mind? Does argument make sense?
      *   *Supervenience:* If two actions are descriptively identical, they must be morally identical.
      *   *Normativity:* The language must guide action/reasoning (internalism link).

  3.  **Pruning and Organizing (Distinguishing Constraints vs. Prejudices):**
      *   *Constraint:* Logic must work. If we use moral terms in arguments, the arguments must be valid or invalid based on form, not content shifts. (Frege-Geach).
      *   *Constraint:* Embedding must be grammatical and semantically compositional.
      *   *Constraint:* Disagreement must be explained. We argue, we don't just clash.
      *   *Prejudice (maybe):* "Truth" in a robust correspondence sense. Expressivists can accept truth deflationarily.
      *   *Prejudice (maybe):* "Belief" as a distinct cognitive state separate from acceptance/plan. Expressivists might unify these.
      *   *Tension:* Compositionality vs. Expressive Function. If meaning is use/attitude, how does it compose in a conditional where no attitude is expressed?
      *   *Tension:* Logic vs. Psychology. Is the logic about propositions or about consistency of attitudes?

  4.  **Drafting the Desiderata (Iterative refinement):**
      *   *Group 1: Semantic Compositionality (The Embedding Problem).* Needs to handle negation, conditionals, quantifiers, modals.
      *   *Group 2: Logical Validity (The Inference Problem).* Modus Ponens, non-contradiction. Needs to avoid equivocation.
      *   *Group 3: Phenomenology of Discourse (The Practice Problem).* Truth talk, belief talk, disagreement, revision.
      *   *Group 4: The Normative Force (The Motivation Problem).* Why does this language guide action? (Crucial for expressivism, less for cognitivism, but must be preserved).

      *Refining the "Prejudice" distinction:*
      *   Is "Truth-Aptness" a constraint? Cognitivists say yes (robust). Expressivists say yes (deflationary). *Decision:* Frame it as "Compatibility with Truth-Discourse" rather than "Robust Truth Conditions."
      *   Is "Propositional Content" a constraint? No, that begs the question against expressivism. Frame it as "Content Stability."

  5.  **Identifying Structural Tensions:**
      *   *The Compositionality/Expressivity Tension:* If meaning is expressing an attitude, unembedded sentences express attitudes. Embedded sentences (antecedents) do not. How can they have the *same* meaning to validate logic?
      *   *The Logic/Psychology Tension:* If validity is defined by consistency of attitudes, does that capture logical validity or just rational coherence?
      *   *The Minimalism/Robustness Tension:* If you go too minimalist on truth/belief, do you lose the ability to explain the *weight* of moral disagreement?

  6.  **Assessing the Families of Response:**
      *   *Simple Expressivism (Ayer/Stevenson):* Fails embedding/logic.
      *   *Gibbard (Norm-Expressivism/Plan Expressivism):* Handles logic via consistency of plans. Strong on conditionals. Weak on truth-aptness intuition (though he addresses it).
      *   *Blackburn (Quasi-Realism):* Tries to earn the right to talk like a realist. Strong on practice, sometimes accused of changing the subject on semantics.
      *   *Schroeder ("Being For"):* B-type attitudes. Solves the negation problem structurally. Technical but abstract.
      *   *Hybrids (Ridge, Copp):* Split content. Solves embedding by giving descriptive content to embed. Risks losing the distinctive expressivist motivation (why be an expressivist if you have propositions?).
      *   *Minimalism/Deflationism:* "True" just means "I agree." Solves truth talk easily. Struggles with the *substantive* nature of moral inquiry.

  7.  **Writing the Response (incorporating the "Neutral Specialist" persona):**
      *   *Introduction:* Acknowledge the fragmentation of the problem. Set the stage.
      *   *Section 1: The Desiderata.* Categorize them clearly. Mark "Hard Constraints" vs. "Contested Ground."
      *   *Section 2: Structural Tensions.* Be honest about where the theory might break.
      *   *Section 3: Assessment of Families.* Brief, targeted evaluation against the list.
      *   *Conclusion:* Summary for the seminar context.

      *(Self-Correction during drafting)*: Make sure I don't slip into defending expressivism. Keep the tone: "Here is what the theory *must* do to survive." Ensure the distinction between the "Frege-Geach Problem" (logic/embedding) and the "Quasi-Realist Project" (mimicking realist discourse) is clear, as the prompt hints at this confusion. The prompt asks for *desiderata for an expressivist semantics*, so the focus is on how expressivism can survive the realist's challenges.

      *Refining the "Prejudice" point:* A cognitivist might say "Must have truth conditions." An expressivist says "Must explain why we *say* it has truth conditions." I need to phrase the desideratum neutrally: "Accommodate Truth-Discourse" rather than "Possess Truth Conditions."

      *Refining the "Inconsistency" point:* It's not just logical inconsistency; it's *disagreement*. If I say "Boo stealing" and you say "Hooray stealing," why is that a conflict? A simple logic of attitudes might say it's not. The desideratum must demand an explanation of *clash*.

  8.  **Final Review against Prompt:**
      *   Did I cover negation, disjunction, conditionals, attitude verbs, modals, mixed, quantification? Yes.
      *   Did I cover Modus Ponens, inconsistency vs. disagreement? Yes.
      *   Did I cover truth, belief, retraction? Yes.
      *   Did I distinguish constraints from prejudices? Yes.
      *   Did I identify joint unsatisfiability? Yes.
      *   Did I assess the families? Yes.
      *   Is the tone neutral? Yes.

      *Let's structure the "Structural Tensions" section carefully.* The biggest one is the "Embedding vs. Expression" tension. If meaning = expression, embedding kills meaning. If meaning = content, expression is secondary. Expressivism wants both.

      *Okay, ready to write.*
answer: |-
  This is a crucial exercise. The confusion you note among your students is not accidental; the "Frege–Geach Problem" has metastasized from a specific objection about negation into a umbrella term for any difficulty expressivism faces in matching the semantic behavior of realist discourse. To teach this well, you need to separate the *logical* constraints (which any semantics must meet) from the *metaphysical* aspirations (which divide the camps).

  Below is a specification of the desiderata for an adequate expressivist semantics, organized by domain. I have distinguished between **Hard Constraints** (requirements any semantics must meet to be viable) and **Contested Ground** (places where expressivists may legitimately resist cognitivist framing, provided they offer an alternative explanation). Following the list, I identify structural tensions and assess the major families of solutions.

  ---

  # Desiderata for an Adequate Expressivist Semantics

  ## I. Semantic Compositionality (The Embedding Constraint)
  **The Requirement:** The semantics must assign semantic values to normative sentences that allow them to function as proper parts of larger sentences without shifting meaning.
  **Specific Constructions to Handle:**
  1.  **Negation:** "Stealing is not wrong." (Must distinguish between denying the wrongness and asserting the wrongness of the negation).
  2.  **Conditionals:** "If stealing is wrong, then getting your little brother to steal is wrong." (The antecedent does not express an attitude, yet contributes to the meaning).
  3.  **Disjunction/Conjunction:** "Stealing is wrong or lying is wrong."
  4.  **Attitude Verbs:** "Alice believes that stealing is wrong." (Must distinguish Alice's state from the speaker's).
  5.  **Modals:** "Stealing might be wrong." "Stealing ought to be wrong."
  6.  **Quantification:** "Everything he did was wrong." "Some actions are obligatory."
  7.  **Mixed Discourse:** "Stealing is wrong and illegal." "If stealing is wrong, the law should ban it."

  **Motivation:** Natural language is productive. If normative terms change their semantic contribution when embedded (e.g., if "wrong" in the antecedent means something different than "wrong" in an assertion), then logical form is obscured.
  **Status:** **Hard Constraint.** Even an expressivist must acknowledge that "If stealing is wrong..." is grammatically and semantically continuous with "Stealing is wrong." To claim these are fundamentally different kinds of speech acts (e.g., asserting vs. merely entertaining) requires a semantic theory that explains how they compose.

  ## II. Logical Validity (The Inference Constraint)
  **The Requirement:** The semantics must validate standard inference patterns involving normative premises without committing the fallacy of equivocation.
  **Specific Patterns:**
  1.  **Modus Ponens:**
      *   P1: Stealing is wrong.
      *   P2: If stealing is wrong, then getting your brother to steal is wrong.
      *   C: Getting your brother to steal is wrong.
      *   *Constraint:* The term "wrong" must contribute the same semantic value in P1 and P2 to ensure validity is formal, not material.
  2.  **Inconsistency:** "Stealing is wrong and stealing is not wrong" must be semantically contradictory, not just pragmatically odd.
  3.  **Entailment:** "X is murder" entails "X is wrong" (on certain substantive views) or at least allows for logical relations between descriptive and normative premises in mixed arguments.

  **Motivation:** We reason morally. We treat moral arguments as valid or invalid based on structure. If expressivism renders these arguments invalid (e.g., because the premises express different types of mental states), it fails to capture moral practice.
  **Status:** **Hard Constraint.** An expressivist cannot simply say "morality isn't about logic." However, the *explanation* of validity is Contested Ground. A cognitivist says validity is preservation of truth; an expressivist may say it is consistency of attitudes or plans.

  ## III. The Phenomenology of Discourse (The Practice Constraint)
  **The Requirement:** The semantics must accommodate the way speakers actually talk about and treat normative claims in reflective practice.
  **Specific Data Points:**
  1.  **Truth-Talk:** We say, "It is true that slavery is unjust."
  2.  **Belief-Talk:** We say, "I believe that charity is good," and "She believes that charity is good."
  3.  **Disagreement:** When I say "X is good" and you say "X is bad," we take ourselves to be disagreeing, not merely differing in taste (as with "Broccoli is tasty").
  4.  **Revision:** We change our moral minds in light of argument, not just causal persuasion.
  5.  **Retraction:** If I learn new non-normative facts, I may retract a past moral judgment ("I didn't know he was coerced; I take back my blame").

  **Motivation:** Moral discourse looks, feels, and functions like fact-stating discourse. Ignoring this makes expressivism revisionary to the point of error theory.
  **Status:** **Mixed.**
  *   *Hard Constraint:* The theory must explain *why* we use this talk. It cannot simply forbid it.
  *   *Contested Ground (Cognitivist Prejudice):* The claim that this talk *requires* robust truth-conditions or cognitive belief states. An expressivist may legitimately argue that "truth" and "belief" are deflationary concepts that apply to expressions of attitude just as well as descriptions of fact. The constraint is to *earn the right* to use the vocabulary, not necessarily to accept the cognitivist metaphysics underlying it.

  ## IV. Normative Force (The Internalism Constraint)
  **The Requirement:** The semantics must preserve the intuitive connection between making a sincere normative judgment and having a motivating reason (or plan/intention) to act accordingly.
  **Motivation:** This is the primary motivation for expressivism. If the semantics makes moral judgments purely descriptive (like "Water is H2O"), it loses the explanation for why moral judgments guide action.
  **Status:** **Expressivist Hard Constraint / Cognitivist Contested Ground.** A cognitivist might deny strong internalism. But for an *expressivist* semantics to be distinctively expressivist, it must preserve this link. If the solution to Frege-Geach requires severing the link between judgment and motivation, the expressivist has won the battle but lost the war.

  ---

  # Structural Tensions and Joint Unsatisfiability

  You asked to identify where these desiderata might pull against each other on purely structural grounds. There are three significant tension points where satisfying one desideratum threatens to violate another.

  ### 1. The Compositionality vs. Expression Tension
  *   **The Conflict:** The core expressivist thesis is that the meaning of a normative sentence is constituted by the expression of a non-cognitive attitude (e.g., disapproval). However, in embedded contexts (like the antecedent of a conditional), no attitude is expressed.
  *   **The Tension:** To satisfy **Semantic Compositionality**, the semantic value of "Stealing is wrong" must be the same in asserted and embedded contexts. But if the semantic value *is* the expression of an attitude, it cannot be the same in both (since no attitude is expressed in the antecedent).
  *   **Unsatisfiability Risk:** High. To solve this, expressivists often posit a semantic value *other* than the expressed attitude (e.g., a "plan-state" or a function from worlds to attitudes). But if they posit a stable semantic value that composes, they risk collapsing into a form of cognitivism (where the value is a proposition-like object), thereby threatening the **Normative Force** constraint.

  ### 2. The Logic vs. Psychology Tension
  *   **The Conflict:** To satisfy **Logical Validity**, expressivists often define validity in terms of the consistency of attitudes (e.g., it is irrational to hold attitudes A and B simultaneously).
  *   **The Tension:** Logical validity is traditionally topic-neutral and mind-independent. Psychological consistency is mind-dependent. If validity reduces to rationality constraints on attitudes, then a logical contradiction becomes a form of irrationality.
  *   **Unsatisfiability Risk:** Medium. This risks making logic too "heavy." If I am irrational enough, does "P and not-P" become valid for me? Expressivists must walk a tightrope between defining logic via attitudes without making logic subjective.

  ### 3. The Disagreement vs. Truth Tension
  *   **The Conflict:** To satisfy **Practice (Disagreement)**, expressivists must explain why "X is good" and "X is bad" clash. To satisfy **Practice (Truth)**, they must explain why we call them "true."
  *   **The Tension:** If "true" is deflationary (just a device for endorsement), it explains Truth-Talk well but struggles to explain the *substantive* nature of Disagreement. If I say "Boo X" and you say "Hooray X," we have clashing attitudes, but do we have a disagreement *about the world*? If the semantics is too minimalist, moral argument looks like trying to argue someone out of a preference.
  *   **Unsatisfiability Risk:** Medium-High. This is the "Quasi-Realist" burden. If you make the semantics too robust to handle disagreement (e.g., by adding descriptive content), you lose the distinctiveness of expressivism. If you keep it purely attitudinal, disagreement looks like mere clash.

  ---

  # Assessment of Major Families of Response

  Here is how the leading expressivist strategies score against the desiderata above.

  ### 1. Simple Attitude-Expressivism (Ayer, Stevenson)
  *   **Semantics:** Normative sentences express emotions or prescribe attitudes.
  *   **Assessment:**
      *   *Embedding:* **Fails.** Cannot explain the meaning of "If stealing is wrong..." without positing an attitude where none is felt.
      *   *Logic:* **Fails.** Treats moral arguments as rhetorical persuasion, not valid inference.
      *   *Practice:* **Partial.** Explains motivation well, fails on truth/belief talk.
      *   *Verdict:* Historically important, but semantically untenable for a graduate seminar on current metaethics.

  ### 2. Gibbard-Style Norm-Expressivism (Plan Expressivism)
  *   **Semantics:** Normative judgments express acceptance of norms that permit/require actions (or "plans"). Meaning is analyzed via consistency of planning states.
  *   **Assessment:**
      *   *Embedding:* **Strong.** Uses possible-worlds style semantics where the "worlds" are hyperplans. Allows compositionality.
      *   *Logic:* **Strong.** Defines validity as inconsistency of plans. Solves Frege-Geach by ensuring the "plan" content is stable across embedding.
      *   *Practice:* **Strong.** Can mimic truth/belief talk via functional roles of planning.
      *   *Tension:* Risks the **Logic vs. Psychology** tension. Is logical inconsistency really just planning inconsistency?
      *   *Verdict:* Currently the gold standard for technical adequacy, though metaphysically dense.

  ### 3. "Being For"-Style Approaches (Schroeder)
  *   **Semantics:** Posits a generic attitude ("being for") and treats specific moral attitudes as complex relations to this generic attitude. Negation is handled by distinguishing types of inconsistency (A-type vs. B-type).
  *   **Assessment:**
      *   *Embedding:* **Strong.** Solves the negation problem structurally by assigning distinct semantic values to "wrong" and "not wrong" that nonetheless generate inconsistency.
      *   *Logic:* **Strong.** Formalizes the inconsistency constraints rigorously.
      *   *Practice:* **Weak-Medium.** Highly technical; struggles to make the "being for" relation feel psychologically real to the agent.
      *   *Verdict:* The best solution to the *logical* Frege-Geach problem, but leaves the *phenomenological* connection to motivation somewhat abstract.

  ### 4. Hybrid Views (Ridge, Copp)
  *   **Semantics:** Normative sentences have two contents: a descriptive proposition (which embeds) and an expressive attitude (which motivates).
  *   **Assessment:**
      *   *Embedding:* **Strong.** The descriptive content does the compositional heavy lifting.
      *   *Logic:* **Strong.** Validity tracks the descriptive content.
      *   *Normative Force:* **At Risk.** If the descriptive content does the logical work, why isn't this just cognitivism with an added emotional flourish? Risks failing the **Internalism Constraint**.
      *   *Verdict:* Semantically safe, but metaethically unstable. Hard to motivate why one is an *expressivist* rather than a cognitivist who likes emotions.

  ### 5. Minimalism / Deflationism (Blackburn's Quasi-Realism, Lenman)
  *   **Semantics:** Accepts truth/belief predicates but deflates their metaphysical weight. "True" means "I agree" or functions as a logical operator.
  *   **Assessment:**
      *   *Embedding:* **Medium.** Relies on the idea that we can project our attitudes into embedded contexts.
      *   *Practice:* **Strong.** Best at explaining why we use truth/belief talk without positing moral facts.
      *   *Disagreement:* **Weak.** Struggles to explain why moral disagreement feels more substantive than a clash of deflated attitudes.
      *   *Verdict:* Excellent for dissolving metaphysical anxieties, but may feel like "changing the subject" to students looking for a robust account of moral argument.

  ---

  # Seminar Recommendation

  For your seminar, I recommend framing the Frege-Geach problem not as a single objection, but as a **trilemma** derived from the structural tensions identified above.

  Ask your students to choose two of the following three commitments and see if they can sustain the third:
  1.  **Semantic Uniformity:** "Wrong" means the same thing in assertions and conditionals.
  2.  **Expressivist Psychology:** The meaning of "wrong" is fundamentally tied to a non-cognitive motivational state.
  3.  **Logical Realism:** Validity is a matter of truth-preservation (or mind-independent consistency).

  *   **Cognitivists** keep (1) and (3), drop (2).
  *   **Simple Expressivists** keep (2), drop (1) and (3).
  *   **Sophisticated Expressivists (Gibbard/Schroeder)** keep (1) and (2), and try to reconstruct (3) in terms of attitude-consistency.

  This framing forces students to see that the "problem" is not just a technical glitch in embedding, but a deep structural question about whether logic, meaning, and mind can be decoupled. It clarifies why a solution to the embedding problem (like Gibbard's) might still leave the phenomenology of disagreement (the "clash" problem) unresolved.
