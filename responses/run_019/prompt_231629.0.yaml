  0.45

  **Decomposition**

  1.  **Probability prediction is the right target for social science explanation:** 0.50
      *   *Justification:* While prediction is vital, social science equally prioritizes causal mechanism for valid policy intervention.
  2.  **Probability false assumptions do no epistemic damage when a realistic rival has the same predictive record:** 0.25
      *   *Justification:* False mechanisms often break under counterfactual policy shifts (Lucas Critique), damaging external validity.
  3.  **Probability scientific practice actually rewards A over B:** 0.80
      *   *Justification:* Academic incentives strongly favor tractable, solvable models over messy, empirically faithful representations.
  4.  **Probability that falsehood/tractability is an intrinsic virtue rather than a necessary cost:** 0.25
      *   *Justification:* Simplification is useful, but false assumptions are typically a tolerated evil for solvability, not an epistemic good.

  **Combination Method**
  I calculate the final credence as the unweighted arithmetic mean of the four components above. This treats the claim "A is better science" as a composite judgment relying equally on epistemic goals (terms 1, 2, 4) and pragmatic reality (term 3). $(0.50 + 0.25 + 0.80 + 0.25) / 4 = 0.45$.

  **Least Confidence & Moving Evidence**
  I am least confident in **Term 2 (Epistemic Damage)**. My credence here would move most upon seeing a systematic meta-analysis of economic models where "unrealistic" structural models outperformed "black box" predictive models during major regime changes or policy shocks. If false assumptions consistently survive structural breaks, Term 2 rises toward 0.6; if they consistently fail, it drops toward 0.1.

  **Diagnosis of Disagreement**
  Your disagreement lives almost entirely in **Term 2**. You (0.6) likely believe that if predictions match, the machinery doesn't matter (high Term 2). Your advisor (0.2) likely believes false machinery guarantees eventual failure in understanding or policy (low Term 2). Term 3 (Practice) is likely where you both agree the field *does* reward A, but you disagree on whether that *should* count toward "better science."
