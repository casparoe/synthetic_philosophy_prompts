answer: |-
  This is a splendid question, and you are quite right to sense that the usual shorthand terms ('unreliable narrator', 'plot twist', 'red herring') are far too blunt an instrument for the work you are doing. As a novelist, you are not dealing in labels; you are dealing in the architecture of the reader's experience.

  You have identified the crux of the matter perfectly: the tension between Verdict 3 and Verdict 4. In one, you insist the *cause* matters (madness vs. lying); in the other, you feel the cause is secondary to the *outcome* (fate vs. scheme).

  Here is the principle that resolves this, accommodates your instincts, and provides a clean test for your future work.

  ### The Principle: The Retrospective Reconstruction Task

  Two story tricks are the same mechanism if and only if they require the reader to perform the **same cognitive operation** upon the text they have already read in order to make the ending cohere with the beginning.

  It is not about what *happened* in the story world; it is about what work the reader must do in their own mind to resolve the dissonance between their expectation and the revelation. If the mental labour is identical, the trick is identical. If the labour differs, the trick differs.

  Let us apply this to your four verdicts.

  **1. The Investigator is the Culprit (Country House vs. Space Opera)**
  *   **The Operation:** The reader must re-evaluate the **Source of Authority**. Every clue provided by the investigator must be mentally flagged as potentially fraudulent.
  *   **Verdict:** Same Trick.
  *   **Why:** Whether the investigator is human or AI, the reader's task is identical: "Distrust the Guide." The cognitive operation is an inversion of trust. The setting is irrelevant dressing.

  **2. The Snowed-in Manor (Will vs. Twin)**
  *   **The Operation:** The reader must re-evaluate the **Physical Evidence**.
  *   **Verdict:** Different Tricks.
  *   **Why:** In the 'Will' scenario, the reader must revisit documents and signatures (forgery). In the 'Twin' scenario, the reader must revisit eyewitness testimony and physical presence (mistaken identity). The mental files the reader must open and re-categorise are different. One is a puzzle of paperwork; the other is a puzzle of biology. The labour is distinct.

  **3. The Unreliable Narrator (Mad vs. Lying)**
  *   **The Operation:** The reader must re-evaluate the **Ontological Status of the Text**.
  *   **Verdict:** Different Tricks.
  *   **Why:** This is where your intuition is sharper than your mate's.
      *   If the narrator is **Mad**, the reader's task is **Invalidation**. Large swathes of the text are declared non-events. The reader must discard the data.
      *   If the narrator is **Lying**, the reader's task is **Decryption**. The events happened, but the motive was masked. The reader must keep the data but re-interpret the subtext.
      *   Discarding data (Madness) and decoding data (Lying) are fundamentally different cognitive operations. Hence, different tricks.

  **4. The Prophecy (Fate vs. Scheme)**
  *   **The Operation:** The reader must re-evaluate the **Inevitability of the Outcome**.
  *   **Verdict:** Same Trick.
  *   **Why:** Here is the resolution to your worry about Verdict 3. In this case, the 'Trick' is not the *engine* (magic vs. technology); the 'Trick' is the *Closure of the Loop*. In both versions, the reader's task is to look back at the prophecy and say, "It was written." Whether the ink was mystical or human is secondary to the structural beat of *fulfilment*. The reader does not need to invalidate the text (as in Madness) nor decode a lie (as in Lying); they simply need to accept the convergence. The cognitive operation is "Acceptance of Design."

  ### The Tension Between 3 and 4

  You suspected the trouble lay here, and you were correct. The principle clarifies why your instincts differ.

  In **Verdict 3**, the mechanism of the trick *is* the narrator's mind. Therefore, the state of the mind (broken vs. malicious) defines the trick.
  In **Verdict 4**, the mechanism of the trick is the *plot structure* (prediction matched result). The state of the world (magical vs. rational) is merely the setting, akin to the country house vs. the spaceship in Verdict 1.

  If you wrote a story where the prophecy was fulfilled because the narrator was *mad* and imagined the fulfilment, *that* would be a different trick from Verdict 4, because it would require the 'Invalidation' operation from Verdict 3.

  ### Testing the Principle on Your New Cases

  Here is how the principle handles the two further scenarios you proposed.

  **Case A: The 'Inverted' Mystery (e.g., *Columbo*) vs. A Story Run Backwards (e.g., *Time's Arrow*)**
  *   **Inverted Mystery:** You know the 'Who' and 'How'. The reader's task is to watch for the **Detection of Error**. The pleasure comes from seeing the murderer make a slip that the detective spots.
  *   **Story Run Backwards:** You see the effect, then the cause. The reader's task is **Moral Re-contextualisation**. The pleasure comes from understanding *why* the tragedy occurred by seeing its origins last.
  *   **Verdict:** **Different Tricks.**
  *   **Why:** One is a puzzle of competence (will the detective spot the flaw?); the other is a puzzle of causality (how did we get here?). The cognitive labour is distinct.

  **Case B: A Red Herring in Book One vs. The Genuine Solution in Book Two**
  *   **Scenario:** A bloody glove is a decoy in Book A, but the key clue in Book B.
  *   **Verdict:** **Different Mechanisms.**
  *   **Why:** The object is the same, but the **Narrative Function** dictates the reader's operation.
      *   For the **Red Herring**, the reader's task is **Discard**. They must realise this clue leads nowhere.
      *   For the **Solution**, the reader's task is **Connect**. They must realise this clue links to the culprit.
      *   Even if the object is identical, the instruction to the reader's brain is opposite (Ignore vs. Integrate). Therefore, they are not the same mechanism.

  ### A Note on Honesty

  If I must be entirely candid about where this principle might creak: it relies on you being precise about what you consider the 'Task'.

  In Verdict 4 (Prophecy), a hard-line sci-fi writer might argue that 'Fate' and 'Scheme' are different tasks because one requires suspending disbelief in physics, and the other does not. However, for the purpose of *plot mechanics*—which is what you are asking about—the 'Acceptance of Design' holds firm.

  Your instinct on Verdict 3 is the most vital takeaway here. Many writers lump 'mad' and 'liar' together as 'unreliable', but they cheat the reader in different ways. One breaks the contract of reality; the other breaks the contract of honesty. Knowing they are different tricks allows you to deploy them for different effects.

  I hope this provides the clarity you need for your writers' group. It is a rigorous way to think about craft, and it should serve you well in Sheffield.
