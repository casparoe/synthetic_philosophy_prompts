      *   *Repair for (2) vs. (3):* Clarify that the "shared story" is the *process* of democratic deliberation itself, or that the story is provisional. *Cost:* Sacrifices the comfort of a fixed national myth.
      *   *Repair for (1) vs. (3):* Refine "usable." A usable story isn't a comforting one, but a functional one for citizenship. *Cost:* Sacrifices the idea that history class is primarily for social cohesion.
      *   *Repair for (2) vs. (4):* Distinguish between *empirical claims* (settled) and *normative/narrative framing* (contested). *Cost:* Sacrifices the simplicity of treating all historical claims as debatable.

  6.  **Identify the Single Best Revision:**
      *   The core friction is between the *open inquiry* of (2) and the *closed cohesion* implied by (3).
