      *   *Tension B: (1) vs. (3).* Truth vs. Utility. A "usable" story might require simplification or emphasis that pure "discovery/explanation" might not justify.
      *   *Tension C: (2) vs. (4).* Debate vs. Settled Fact. If slavery's brutality is "well-supported" (4), should it be treated as a "competing interpretation" (2)? Or is it the baseline? (This is often a confusion between *facts* and *interpretations of significance*).

