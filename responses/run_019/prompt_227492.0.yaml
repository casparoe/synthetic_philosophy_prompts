answer: |-
  Dear friend, this is one of the most fascinating debates you can have about the nature of reality, and honestly, you are both right in your own ways, though for different reasons. To understand why, we have to look at what math actually is versus what it does. You are absolutely correct about the logical danger, which mathematicians call the principle of explosion. In classical logic, if you accept a single contradiction as true, such as saying that zero equals one, you can logically derive any statement whatsoever from it. If zero equals one, then by multiplying both sides by two, you get zero equals two, and by adding numbers around, you can eventually prove that two plus two equals five, or that the moon is made of cheese. This happens because the rules of logic treat a contradiction as a crack in the foundation that allows you to walk anywhere in the building. So, theoretically, your fear is valid: if the basic axioms, which are the starting rules we agree to play by, contain a hidden contradiction, then the logical structure built on top of them is technically unsound. Every proof that relies on those axioms would, in a strict logical sense, lose its certainty.

  However, your brother-in-law is winning the practical argument, and the reason lies in how math is actually used in the real world. Engineers and scientists do not use math as a pure philosophical truth; they use it as a map. A map does not have to be perfectly identical to the territory to be useful. When an engineer designs a bridge, they are using mathematical models to approximate physical reality, but the bridge stands because of physics, not because of arithmetic. The steel holds the weight because of electromagnetic forces between atoms, not because a theorem says it should. Furthermore, engineering calculations always include safety margins and are checked against physical testing. Even if there were a contradiction in the deep foundations of number theory, it would almost certainly only show up in extreme, abstract cases involving infinity or unimaginably large numbers, not in the finite calculations used to balance a ledger or calculate the load on a beam. The math we use for mortgages and construction operates in a very small, safe neighborhood of numbers where everything behaves nicely, even if the far reaches of the mathematical universe are on fire.

  This brings us to the point about Gödel, which is crucial to your question. Kurt Gödel was a logician who proved something startling in the nineteen thirties known as the incompleteness theorems. Essentially, he showed that for any mathematical system complex enough to do basic arithmetic, you cannot use that system to prove that it is free of contradictions. This means we have never been able to prove, and never will be able to prove, that our current math is perfectly consistent using only the rules of that math. We operate on a strong belief that it is consistent because no one has found a contradiction in over a century of heavy use, but we do not have a logical guarantee. So, if someone did find a contradiction tomorrow, it would confirm what Gödel told us was possible, but it would not necessarily mean the system is useless. It would just mean we need to patch the hole.

  History actually gives us a perfect example of this happening without the world ending. In the early nineteen hundreds, mathematicians were using what was called naive set theory, which was a way of defining collections of objects. A philosopher named Bertrand Russell found a contradiction in it, now known as Russell's Paradox, which showed that you could construct a set that both contains and does not contain itself. This was a genuine crisis, similar to what you are worried about. But mathematicians did not throw up their hands and say all math is worthless. Instead, they refined the rules. They created a new, more careful system of axioms called ZFC set theory that prevented you from constructing that specific paradoxical set. The vast majority of math that had been done before remained valid because it didn't rely on the broken part. If a contradiction were found today, mathematicians would do the same thing. They would identify the specific axiom causing the trouble, restrict it, and rebuild the affected areas. It would be a massive intellectual upheaval and would ruin some specific proofs, but it would not erase the utility of the math that works.

  Regarding your specific concerns about mortgages, encryption, and airplanes, the impact would likely be minimal for the first two and manageable for the third. Bookkeeping and mortgages rely on simple arithmetic with finite numbers. Any contradiction in foundational math usually hides in the realm of the infinite or the extremely abstract. The rules for adding up dollars and cents are robust and would almost certainly remain unchanged in any new system. Encryption is a bit more delicate because it relies on number theory, specifically the difficulty of factoring large numbers. If the contradiction undermined the properties of prime numbers, it could theoretically weaken encryption, but cryptographers would simply migrate to new algorithms based on the patched math. It would be an IT crisis, not a civilization collapse. Airplane design, as your brother-in-law suggested, is the least vulnerable because it is empirical. Planes are tested in wind tunnels and flown with test pilots. The math guides the design, but reality validates it. If the math had a glitch, the physical testing would catch the discrepancy long before the plane carried passengers.

  You also asked if rebuilding on new axioms would help if we cannot prove those are consistent either. This is the deepest philosophical knot. You are right that Gödel says we cannot prove the new system is consistent either. However, consistency is not a binary switch that makes math either perfect or trash. It is more like health. A system can be consistent enough for our purposes. We choose axioms that feel intuitively true and have survived rigorous testing without producing contradictions. If we have to switch axioms, we will choose new ones that seem even more stable. We accept them not because we have a proof of their perfection, but because they work and do not break. This is similar to how we use laws of physics; we cannot prove gravity will work tomorrow, but it has worked every day so far, so we build bridges based on that expectation.

  There is also a niche field of logic called paraconsistent logic that you mentioned hearing about. In these systems, the principle of explosion is disabled. They allow you to have a contradiction in your system without everything becoming true. Some philosophers and computer scientists argue we should use these logics to handle messy real-world data. However, mainstream mathematics still uses classical logic because it is more powerful and intuitive for most tasks. If a contradiction were found, there might be a push to adopt paraconsistent logic for certain foundations, but most mathematicians would prefer to fix the axioms to remove the contradiction entirely rather than learn to live with it.

  So, to sum up the verdict on your argument, you are the winner on the theoretical front, and your brother-in-law is the winner on the practical front. If a contradiction were found, it would be a profound shock to the philosophy of mathematics and would force a rewrite of many textbooks and proofs. Mathematicians would have to work hard to isolate the error and patch the foundation, and there would be a period of uncertainty where we would not know which proofs were safe and which were tainted. However, for the bookkeeper balancing the books, the engineer designing the bridge, and the banker calculating interest, life would go on almost exactly as before. The tools we use are durable enough to withstand a crack in the basement, and history shows that when the foundation shakes, we just reinforce it and keep building. The world would not end, but the mathematicians would certainly have a very busy decade.
