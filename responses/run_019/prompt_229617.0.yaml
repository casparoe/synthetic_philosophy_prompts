answer: |-
  Your diagnosis is remarkably astute. After four years of stalemate, it is highly probable that your group has exhausted the first-order arguments and bumped up against the *metaphilosophical* foundations of the debate. You are correct that the disagreement is not primarily about linguistic data (both sides accommodate the same intuitions about clear cases and borderline cases) nor about formal consistency (both can be modeled rigorously).

  Here is an analysis of what kind of disagreement this is, why it resists resolution, and where the genuine pressure points lie.

  ### 1. The Diagnosis: A Clash of Theoretical Virtues
  The disagreement is best characterized as a **methodological and metasemantic clash regarding theoretical virtues.** It is not a verbal dispute (they mean the same thing by "true" and "bald" in the object language), nor is it a hidden empirical question (neuroscience cannot currently distinguish between a semantic gap and an epistemic limit).

  Instead, the two camps prioritize different explanatory goals:

  *   **The Supervaluationist Priority: Phenomenological and Normative Fit.**
      The supervaluationist prioritizes faithfulness to the *speaker's perspective*. From the inside, a borderline case feels unsettled. It is not that I don't know the number of hairs; it is that the concept itself does not dictate a verdict. For them, a semantic theory should model the *norms of assertion*. If it is inappropriate to assert "John is bald" in a borderline case, the theory should reflect that the proposition lacks a truth value (or determinate truth value). They are willing to complicate the logic (e.g., distinguishing local from global validity) to preserve this intuitive connection between truth and assertibility.
  *   **The Epistemicist Priority: Logical and Metaphysical Simplicity.**
      The epistemicist prioritizes the *simplicity of the logical framework*. They argue that classical logic (specifically Bivalence and the Law of Excluded Middle) is too successful and fundamental to be abandoned for the sake of linguistic phenomenology. For them, the cost of modifying logic is higher than the cost of positing unknowable boundaries. They shift the explanatory burden from *semantics* to *epistemology*: the world (and our reference to it) is sharp, but our cognitive access is fuzzy.

  **Verdict on your hypothesis:** You are right. The supervaluationist asks semantics to track *warranted assertibility*; the epistemicist asks semantics to track *mind-independent truth conditions*. They are optimizing for different values.

  ### 2. Why the Stalemate is Persistent (Underdetermination)
  The reason you cannot move the group is **theory underdetermination.** The available data (linguistic intuitions, Sorites premises) are compatible with multiple theoretical frameworks.
  *   **Data:** "We can't find the boundary."
  *   **Supervaluationist Explanation:** There is no boundary to find.
  *   **Epistemicist Explanation:** There is a boundary, but it is unknowable.

  Both explanations account for the data equally well. To choose between them, one must appeal to extra-linguistic preferences (e.g., "I value classical logic more than phenomenological fit" vs. "I value phenomenological fit more than classical logic"). These are not arguments that can be won with evidence; they are philosophical dispositions.

  ### 3. Is the Stalemate Permanent? Potential Pressure Points
  While a definitive "refutation" is unlikely, the stalemate is not necessarily permanent if the group shifts focus from *saving intuitions* to *testing consequences*. There are three specific areas where one side often incurs a "theoretical cost" that the other does not. If your group focuses on these, you might find one side buckling under the weight of its own commitments.

  #### A. Higher-Order Vagueness
  This is the strongest technical pressure point.
  *   **The Problem:** If "bald" has a borderline case, surely there is a borderline case of a borderline case (higher-order vagueness).
  *   **Supervaluationist Struggle:** Standard supervaluationism introduces a sharp boundary between the *definitely true* and the *indeterminate*. This seems to reintroduce the very sharpness it sought to avoid, just at a higher level. (Though sophisticated supervaluationists have responses involving iterative sharpenings).
  *   **Epistemicist Strength:** Epistemicism handles higher-order vagueness naturally. It is just more ignorance. We don't know where the boundary is, and we don't know where the boundary of our knowledge is.
  *   **Discussion Prompt:** Ask the supervaluationists if they can account for higher-order vagueness without positing *any* sharp boundaries in the metalanguage. If they cannot, the epistemicist gains ground on simplicity.

  #### B. The Normativity of Assertion
  *   **The Problem:** Why is it wrong to assert a borderline claim?
  *   **Epistemicist Struggle:** If the sentence is determinately true (just unknown), why is it inappropriate to assert it? Williamson argues via "Margin for Error" principles (knowledge requires safety), but many find it counterintuitive that we are systematically forbidden from asserting truths.
  *   **Supervaluationist Strength:** It is inappropriate to assert because the statement is not *determinately* true. This links truth norms directly to assertibility norms.
  *   **Discussion Prompt:** Ask the epistemicists to explain the *normative force* of the ignorance. Is it a practical limitation or a constitutive rule of language? If the latter, does it begin to look like a semantic gap in disguise?

  #### C. Metasemantics (How Meaning is Fixed)
  *   **The Problem:** How does usage fix meaning?
  *   **Epistemicist Struggle:** How could our finite, fuzzy usage of "bald" fix a precise cutoff at hair #4,532? This requires a "magic" theory of reference.
  *   **Supervaluationist Strength:** Usage fixes a range of admissible precisifications, not a single point. This aligns better with naturalistic views of language learning.
  *   **Discussion Prompt:** Ask the epistemicists for their metasemantic story. If they rely on a causal theory of reference, does it apply to "bald"? If they rely on use, how does use determine *this* specific hair count?

  ### 4. Recommendation for the Reading Group
  To break the ritualization, I suggest you stop asking "Which theory is true?" and start asking "What is the cost of admission?"

  1.  **Change the Metric:** Explicitly list the theoretical virtues (Logical Simplicity, Phenomenological Fit, Metasemantic Plausibility, Handling Higher-Order Vagueness). Have each side admit where they score poorly. Often, the stalemate breaks when parties admit their theory is not *better* overall, but *better at a specific task*.
  2.  **Explore Hybrid/Alternative Views:** The binary of Supervaluationism vs. Epistemicism is a legacy of the 1990s. Consider introducing **Contextualism** (the boundary shifts with context) or **Pluralism** (vagueness is not a single phenomenon). These views often dissolve the forced choice between "gap" and "sharp boundary."
  3.  **The "So What?" Test:** Ask both sides: If your theory is correct, what changes in our actual practice of reasoning? If the answer is "nothing," then the disagreement may indeed be merely metaphilosophical. If one side can show their theory resolves a paradox the other cannot (e.g., the Forced March Sorites), that is a genuine move.

  **Conclusion:**
  Your diagnosis is correct: this is a clash of starting intuitions about the function of semantics. It is not empirical, and it is not merely verbal. It is a dispute over **theoretical cost-benefit analysis.** The stalemate will persist as long as the group treats the debate as a search for the "one true description." It may resolve if you reframe it as a choice between different tools for different explanatory jobs. The epistemicist offers a logician's tool; the supervaluationist offers a linguist's tool. Neither is "wrong," but they are not interchangeable.
