answer: |-
  **TO:** All Principal Investigators, Department of Philosophy, Biology, and Psychology
  **FROM:** University Research Ethics Committee (UREC)
  **DATE:** October 24, 2023
  **SUBJECT:** Implementation of Differential Moral Status Framework (DMSF)

  Following the protracted deadlock regarding Protocol 74-Alpha (Proposed Neural Mapping of Murine Distress), the UREC has voted to adopt a bifurcated ethical framework based on the asymmetry of moral status proposed by Robert Nozick. Effective immediately, all research proposals will be evaluated using distinct calculi for Persons and Non-Personal Sentients (NPS). This policy resolves the inconsistency of applying deontological constraints to humans while applying utilitarian aggregation to animals.

  **1. Classification of Subjects**
  Subjects possessing rational agency (hereinafter "Persons") are governed by Kantian side constraints. They are ends in themselves and inviolable. Subjects lacking rational agency but possessing sentience (hereinafter "NPS," e.g., mice, rats, zebrafish) are governed by aggregate utilitarianism. NPS are treated as replaceable units of welfare. Their individual lives hold no intrinsic weight; only the sum of their pleasure and pain matters.

  **2. Operational Guidelines**
  **A. NPS Utilization:**
  Researchers may authorize the pain, sacrifice, or extinction of any number of NPS, provided the expected aggregate welfare gain is positive. For example, a proposal to incinerate 50,000 mice to generate data that marginally improves the ergonomic comfort of a single faculty member's office chair is permissible, assuming the chair's comfort outweighs the murine suffering in the UREC Utility Matrix (Form 12-B). There is no upper limit on NPS sacrifice if the net utility is positive. Researchers are encouraged to maximize NPS throughput to ensure statistical significance, as individual NPS are fungible.

  **B. Person Utilization:**
  Persons may not be used merely as a means to an end, regardless of the consequences. Consequently, a proposal to utilize a single graduate student as a biological control subject is categorically rejected, even if doing so would spare 1,000,000 NPS from incineration. The rights of the Person function as absolute barriers, not weights to be balanced against NPS suffering. It is preferable to allow the extinction of the university's entire rodent colony than to violate the autonomy of one undergraduate volunteer.

  **3. Conflict Resolution**
  In scenarios where the welfare of NPS conflicts with the convenience of Persons, the inviolability of the Person takes precedence. However, in scenarios where the welfare of NPS conflicts with the welfare of other NPS, standard cost-benefit analysis applies.

  Please note: Researchers are discouraged from pointing out that this framework permits the sacrifice of the entire university rodent population to prevent a minor paper cut to a Department Chair, while simultaneously forbidding the conscription of that Chair to save the rodent population. Such observations constitute a Category III Ethical Breach. The UREC acknowledges the mathematical disparity but maintains that moral geometry is not Euclidean.

  Updated protocol forms reflecting the DMSF are attached. Compliance is mandatory.

  **Dr. Aris Thorne**
  Chair, University Research Ethics Committee
