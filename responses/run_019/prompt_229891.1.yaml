      **TO:** All Principal Investigators, Department of Philosophy, Biology, and Psychology
      **FROM:** University Research Ethics Committee (UREC)
      **DATE:** October 24, 2023
      **SUBJECT:** Implementation of Differential Moral Status Framework (DMSF)

      Following the protracted deadlock regarding Protocol 74-Alpha (Proposed Neural Mapping of Murine Distress), the UREC has voted to adopt a bifurcated ethical framework based on the asymmetry of moral status proposed by Robert Nozick. Effective immediately, all research proposals will be evaluated using distinct calculi for Persons and Non-Personal Sentients (NPS).

      **1. Classification of Subjects**
      Subjects possessing rational agency (hereinafter "Persons") are governed by Kantian side constraints. They are ends in themselves and inviolable. Subjects lacking rational agency but possessing sentience (hereinafter "NPS," e.g., mice, rats, zebrafish) are governed by aggregate utilitarianism. NPS are treated as replaceable units of welfare.

