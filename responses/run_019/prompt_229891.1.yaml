  9.  **Final Polish (incorporating into the final output):**
      *   Make the distinction between "Moral Agents" (Humans) and "Sentient Units" (Animals).
      *   Add a specific example about the "Graduate Student Protection Clause."
      *   Ensure the math of the utilitarianism is highlighted (e.g., "net positive welfare").

