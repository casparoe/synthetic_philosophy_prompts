prompt: |-
  So I just spent like three hours at dinner arguing with a friend about advance directives and I need help settling something, or at least making it less mushy. Her position was basically: the person with dementia in front of you right now is the person who matters, so if they seem content and don't want the thing their earlier self demanded, you go with what they want now, full stop. My position was that this makes the advance directive pointless -- the whole reason you write one is that you know future-you might not be in a position to be trusted. We went around in circles on the case where someone writes "if I get severe dementia, stop all treatment including antibiotics" and then years later is sitting in the garden, apparently enjoying the birds, and gets pneumonia.

  Here's the thing though. I actually have skin in this game: I help out on my hospital's ethics consult service (I'm a nurse, I do maybe two or three of these a month) and we genuinely have no settled way of handling conflicts between an old directive and the patient's current behavior/wishes. Every consult turns into the same dinner argument I just had.

  So: write me a decision procedure the consult team could actually follow for these cases. Things it needs to do:

  - The steps in order -- what to establish first about the document itself, then about the patient now, then about the conflict. What counts as "established" at each step (we're not philosophers, we need to know when we can move on).
  - How to handle the classic hard cases: the directive is clear but the patient now seems happy and resists; the directive is clear and the patient now seems miserable; the directive is vague ("no extraordinary measures") and current wishes are clear; the patient now wants something their earlier self explicitly forbade, like the person who wrote that they never want to be kept alive in a home but now begs not to be sent back to theirs.
  - Somewhere in there it has to deal with the question my friend kept pushing: how much does it matter whether the current self still has enough understanding for their current wishes to count as a real preference vs just a reaction? Don't just say "assess capacity," tell me what the procedure should do with borderline cases.
  - Mark the points where the procedure has to stop and a human (and who -- family? the attending? the courts?) makes a value call, because I'd rather have a shorter procedure that's honest about that than a long one pretending to settle everything.
  - Where it should just say "honor the directive" or "follow current wishes" without further agonizing, if anywhere.

  Then run the procedure on the pneumonia-in-the-garden case and on one more case of your choosing, and one of them should come out in a way I won't like (I'll let you guess which side I was on). Also tell me upfront what a procedure like this can't do that my dinner argument was trying to do, because I suspect part of the fight was really about what makes a person the same person over time and you can't put that in a flowchart.

  We're usually working under time pressure -- a consult like this maybe gets a few hours of deliberation total, spread over days -- so don't give me anything that needs a philosopher in the room. And no reading list, I can find the Dworkin stuff myself if I want it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Nurse, works on hospital ethics consult service (2-3 consults/month).
      *   **Problem:** Conflict between Advance Directives (AD) and current wishes/behavior of patients with dementia/cognitive decline.
      *   **Context:** Just had a 3-hour argument with a friend about this. Friend = "Current Self Matters Most" (Presentism). User = "Past Self's Autonomy Matters" (Precedent Autonomy).
      *   **Task:** Create a practical decision procedure for the ethics consult team.
      *   **Requirements:**
          *   Ordered steps (Document -> Patient -> Conflict).
          *   Define "established" at each step (operational criteria, not philosophical).
          *   Handle hard cases (Clear AD/Happy Patient, Clear AD/Miserable Patient, Vague AD/Clear Current, Current vs. Past Forbidden).
          *   Address capacity/borderline cases (don't just say "assess capacity").
          *   Identify "Stop Points" where human value judgments are needed (who decides?).
          *   Identify "Easy Calls" (Honor AD or Follow Current).
          *   Run the procedure on two cases: (1) Pneumonia in the Garden (User's example), (2) A new case (one outcome must displease the User).
          *   Upfront limitation statement (what a procedure *can't* do vs. the philosophical argument).
          *   Constraints: Time pressure (hours/days), no philosophers, no reading list.

  2.  **Deconstruct the Ethical Conflict:**
      *   *Precedent Autonomy (Dworkin):* The competent past self has the right to dictate the future. The AD is a binding contract with oneself.
      *   *Current Well-being/Interests (Dresser/Robertson):* The demented self is a different entity or at least lacks the continuity to be bound by past wishes. Current suffering/joy matters more.
      *   *Legal Reality:* In most jurisdictions, a valid AD is legally binding *unless* there's evidence the patient revoked it *while competent* or specific statutory exceptions apply. However, ethics often goes beyond strict legality to moral permissibility.
      *   *Clinical Reality:* Treating a happy dementia patient against their will (e.g., forcing antibiotics) causes distress. Not treating a miserable one according to their AD might be mercy.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Practical, actionable, honest about uncertainty.
      *   *Step 1: Validate the Directive.* Is it real? Is it applicable?
      *   *Step 2: Assess Current State.* Capacity is key, but the prompt asks for more nuance on borderline cases. We need to distinguish "expressed preference" from "capacity to decide."
      *   *Step 3: Assess Harm/Benefit.* What happens if we follow AD? What happens if we follow Current Wish?
      *   *Step 4: The Conflict Resolution Matrix.* This is where the hard calls happen.
      *   *Step 5: The Stop Point.* Who signs off?

      *Refining Step 2 (Capacity/Preference):* The prompt specifically asks not to just say "assess capacity." In dementia, capacity fluctuates. We need a gradient. Let's use "Expressed Consistency" and "Emotional Valence."
      *Refining Step 4 (Hard Cases):* Need specific rules for the scenarios mentioned.
      *Refining Stop Points:* Ethics committees can recommend, but Attending Physicians usually write the orders. Families often hold veto power in practice (even if not law). Courts are too slow. Let's designate the Attending + Surrogate + Ethics Consensus as the decision node.

  4.  **Developing the Cases:**
      *   *Case 1: Pneumonia in the Garden.* (User's example). AD says "No treatment." Patient is happy.
          *   *User's likely stance:* Honor AD (Past Self).
          *   *Procedure outcome:* I need to make sure one outcome displeases the User. If I make the procedure favor Current Self in happy dementia cases, the User (who argued for AD validity) will dislike it. If I favor AD, the Friend would dislike it. The prompt says "one of them should come out in a way I won't like (I'll let you guess which side I was on)."
          *   *Inference:* User argued *for* the AD ("makes the advance directive pointless"). So, to displease the User, the procedure should recommend *treating* the pneumonia despite the AD in specific circumstances.
      *   *Case 2: New Case.* Needs to be distinct. Maybe "Vague AD + Miserable Patient" or "Past Self forbade nursing home, Current Self begs to stay." Let's go with the "Nursing Home" scenario mentioned in the prompt ("never want to be kept alive in a home but now begs not to be sent back to theirs" - wait, that's slightly different. Let's use: AD says "No life support," Patient is in pain and screaming "Help me die" vs Patient is in pain but screaming "Don't let me die").
      *   *Better Case 2:* The "Revocation by Behavior" case. AD says "No feeding tube." Patient has dementia, opens mouth for food but chokes. Family wants tube. Patient screams when spoon comes near.
      *   *Actually, let's use the prompt's suggestion:* "Patient now wants something their earlier self explicitly forbade, like the person who wrote that they never want to be kept alive in a home but now begs not to be sent back to theirs."
      *   *Outcome for Case 2:* To balance the "displeasing" outcome, maybe this one goes the User's way (Honor AD), or vice versa. Let's aim for a nuanced split.
      *   *Decision:* I will structure the procedure to prioritize *avoiding significant suffering* in the present if the AD relies on quality-of-life judgments that are no longer verifiable. This tends to favor the "Current Self" in happy dementia cases (displeasing User) but honors AD in high-burden/low-benefit cases (pleasing User).

  5.  **Addressing the "What this can't do" Section:**
      *   The dinner argument was about *Personal Identity* (Locke vs. Psychological Continuity).
      *   The procedure is about *Risk Management and Harm Reduction*.
      *   Must explicitly state: This doesn't solve the metaphysical problem. It manages the clinical liability and moral distress.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the limit. This is a triage tool, not a truth machine.
      *   **The Procedure:**
          *   Phase 1: Document Validity (Is it legal/applicable?).
          *   Phase 2: Current State (Capacity + Affect). *Crucial:* Define "Borderline."
          *   Phase 3: The Conflict Test (Harm/Benefit).
          *   Phase 4: Resolution Pathways (The "If/Then" rules).
          *   Phase 5: The Stop Point (Who decides).
      *   **Case Studies:**
          *   Case A: Pneumonia in the Garden. (Outcome: Treat, despite AD. Displeases User).
          *   Case B: The "Nursing Home" Plea. (Outcome: Honor AD/Move to Home. Pleases User? Or vice versa). Let's make Case B honor the AD to show the procedure isn't *always* pro-current-self.
      *   **Limitations:** The Metaphysics vs. Policy distinction.

  7.  **Refining the "Borderline Capacity" Instruction:**
      *   Standard capacity assessment (Understand, Appreciate, Reason, Communicate) often fails in dementia because they fail "Understand" but pass "Communicate Preference."
      *   *Modification:* Use "Assent vs. Dissent." If they actively fight treatment, that weighs heavier than a signed paper from 10 years ago regarding *comfort* measures. If they passively accept, AD weighs heavier.
      *   *The "Smile Test":* Is the current enjoyment robust or fleeting? (Hard to measure). Let's use "Consistency of Affect."

  8.  **Self-Correction/Review against Constraints:**
      *   *Time pressure:* Keep steps concise.
      *   *No philosophers:* Use clinical terms (distress, burden, benefit).
      *   *Displeasing outcome:* I need to be careful here. The User argued *for* the AD. So if the procedure says "Ignore AD in Pneumonia case," that displeases them. I will do that, but justify it clinically (burden of treatment vs. current quality of life).
      *   *Who makes the call:* Attending Physician is legally responsible, but Ethics Consult provides cover. Surrogate is legally authorized to interpret AD. The procedure must empower the Surrogate *unless* they are clearly violating the AD without cause.
      *   *Wait, legal reality check:* In many US states, a valid AD *overrides* a surrogate. But if the patient is objecting to treatment *now*, forcing it is battery/assault practically. The procedure needs to navigate this.
      *   *Adjustment:* The procedure should distinguish between *Life Sustaining Treatment (LST)* and *Comfort Care*. Antibiotics for pneumonia in dementia is often considered LST or at least discretionary.
      *   *Re-evaluating the "Displeasing" outcome:* If I recommend treating the pneumonia, the User (Pro-AD) is mad. If I recommend letting them die, the User is happy. I will recommend treating (with caveats) to satisfy the "one outcome I won't like" constraint.

  9.  **Final Polish:**
      *   Tone: Professional, clinical, empathetic but firm.
      *   Formatting: Clear headings, bullet points.
      *   Ensure the "Stop Point" is clear.

  **(Self-Correction during drafting):** I need to make sure I don't give legal advice. I must frame this as an *ethics* procedure, acknowledging legal constraints vary by jurisdiction.
  Also, the "Borderline Capacity" part needs to be specific. I'll introduce a "Stability of Preference" metric.

  Let's finalize the two cases.
  Case 1: Pneumonia/Garden. (User Pro-AD). Procedure says: Treat. (User unhappy).
  Case 2: "Don't put me in a home" AD vs. "I love it here" Current. Procedure says: Move to home (Honor AD). (User happy).
  *Wait, if the patient begs not to be sent back to theirs (meaning the nursing home), and the AD says "No nursing home".*
  Scenario: AD says "Never put me in a facility." Patient now has dementia, lives in facility, is happy there, begs "Don't send me home alone."
  Procedure: If current safety requires facility, and patient is content, stay. (Overrides AD).
  Okay, let's stick to the Prompt's specific example: "never want to be kept alive in a home but now begs not to be sent back to theirs."
  Okay, AD = No Home. Current = Don't send me home (I like it here).
  If Procedure says "Stay in Home," it overrides AD.
  If Procedure says "Send Home," it honors AD.
  To make one outcome displeasing to the User (Pro-AD), I should have one case override the AD.
  Okay, Plan:
  Case 1 (Pneumonia): Override AD (Treat). User unhappy.
  Case 2 (Facility): Honor AD (Move/Discharge if safe, or explain why AD stands). Actually, safety usually trumps AD regarding location. Let's make Case 2 about *Treatment*.
  Let's try: AD = "No Feeding Tube." Patient = Choking, but opens mouth for spoon. Family wants tube.
  Procedure: No Tube (Honor AD). User Happy.
  Okay, I'll stick with Pneumonia (Override AD) and Feeding Tube (Honor AD). This shows the procedure isn't one-sided.

  Wait, looking at the prompt again: "one of them should come out in a way I won't like (I'll let you guess which side I was on)."
  User's position: "This makes the advance directive pointless... whole reason you write one is that you know future-you might not be in a position to be trusted."
  So User = Pro-AD / Precedent Autonomy.
  To displease User = Recommendation ignores AD / Follows Current Self.
  Okay, I will ensure the Pneumonia case recommends treatment (ignoring AD).

  Let's write it.
answer: |-
  ### Part 1: What This Procedure Cannot Do

  Before you use this, you need to know what it leaves on the table. Your dinner argument was likely about **Personal Identity**: *Is the demented person the same moral agent as the one who signed the paper?*

  This procedure does not answer that. It cannot tell you if the "self" persists. It is a **risk and harm mitigation tool**, not a metaphysical truth machine. It prioritizes:
  1.  Legal liability protection.
  2.  Minimization of present suffering.
  3.  Consistency in institutional decision-making.

  It trades philosophical coherence for clinical actionability. If your friend wants to debate Locke vs. Parfit on psychological continuity, this flowchart will not satisfy them. It is designed to get the consult team to a recommendation within a shift, not to solve the problem of time.

  ***

  ### Part 2: The "Conflict of Selves" Decision Procedure

  **Time Budget:** 2–4 Hours total (including chart review and family conference).
  **Decision Authority:** Attending Physician (legally), informed by Ethics Consult Recommendation and Surrogate Input.

  #### Phase 1: Establish the Directive (The "Past Self")
  *Goal: Determine if the AD is valid and applicable.*

  1.  **Verify Validity:** Is the document signed, witnessed, and legally valid in this jurisdiction?
      *   *Established:* Yes/No. If No, proceed to Phase 2 only (treat as no AD).
  2.  **Verify Applicability:** Does the current clinical condition match the triggering condition in the AD?
      *   *Established:* The AD specifies "Terminal Condition" or "Permanent Unconsciousness" or "Advanced Dementia." The attending confirms the diagnosis matches.
      *   *Stop Point:* If the condition does not match (e.g., AD triggers on "terminal," patient has treatable pneumonia), **Honor the Directive's limitation** (i.e., treat, because the AD isn't triggered).
  3.  **Check for Revocation:** Is there evidence the patient revoked this *while still competent*?
      *   *Established:* Verbal statements to family/MD documented *before* loss of capacity.
      *   *Note:* Current demented statements do **not** count as legal revocation, but they count as "Current Preference" in Phase 2.

  #### Phase 2: Establish the Current State (The "Present Self")
  *Goal: Assess the weight of the patient's current wishes without relying solely on binary capacity.*

  1.  **Assess Decision-Specific Capacity:** Can they understand *this* decision (antibiotics vs. comfort)?
      *   *Established:* Standard MacCAT-T or similar.
      *   *Result:* Lacks Capacity (Most dementia cases). **Move to Step 2.**
  2.  **Assess "Stability of Preference":** (Crucial for borderline cases).
      *   Does the patient express the same wish consistently over 24–48 hours?
      *   *Established:* **Stable** (Repeatedly refuses/requests) vs. **Volatile** (Agrees then screams no 10 mins later).
      *   *Weight:* Stable preferences weigh heavier against the AD. Volatile preferences weigh lighter.
  3.  **Assess "Affective Valence" (The Suffering Test):**
      *   What is the emotional cost of following the current wish vs. the AD?
      *   *Established:*
          *   **High Distress:** Physical fighting, screaming, palpable fear when the AD-plan is enacted.
          *   **Low Distress:** Passive resistance, verbal "no" without physical agitation.
          *   **Contentment:** Patient appears happy/engaged (e.g., garden scenario).

  #### Phase 3: The Conflict Resolution Matrix
  *Goal: Weigh Past vs. Present based on the burden of intervention.*

  **Scenario A: Clear AD (Refuse Treatment) + Current Self Resists Treatment (Happy/Content)**
  *   *Example:* Pneumonia in the Garden.
  *   *Test:* Is the treatment **High Burden** (IVs, restraints, hospitalization) or **Low Burden** (Oral meds, outpatient)?
  *   *Rule:*
      *   If **High Burden**: Honor AD. Forcing high-burden treatment on a resisting patient violates bodily integrity.
      *   If **Low Burden**: **Follow Current Wish (Treat).** If the patient is content and the intervention is minimally invasive, the "harm" of overriding the AD is abstract, while the harm of letting a content person die is concrete.
      *   *Stop Point:* If family/surrogate strongly objects to treating, Attending makes final call. Ethics recommends treating.

  **Scenario B: Clear AD (Refuse Treatment) + Current Self is Miserable**
  *   *Example:* Patient in pain, screaming, AD says "No life support."
  *   *Rule:* **Honor the Directive.** Both Past and Present selves align on avoiding suffering. Proceed with comfort care.

  **Scenario C: Vague AD ("No Extraordinary Measures") + Current Wish Clear**
  *   *Example:* AD says "No extraordinary measures." Patient currently begs for antibiotics.
  *   *Rule:* **Follow Current Wish.** Vague directives defer interpretation to the surrogate/current context. Treat the request as the clarification of "extraordinary."

  **Scenario D: Clear AD (Refuse Location/Care Type) + Current Self Wants Forbidden Care**
  *   *Example:* AD says "Never put me in a nursing home." Patient now begs "Don't send me home alone."
  *   *Test:* **Safety vs. Autonomy.**
  *   *Rule:*
      *   If Safety is compromised at home: **Honor Current Wish (Stay in Home).** Safety trumps precedent autonomy regarding location.
      *   If Safety is manageable: **Honor AD (Go Home).** The Past Self's value judgment on quality of life stands if the Present Self is not in immediate danger.

  #### Phase 4: The "Stop Point" (Who Decides?)
  *   **The Recommendation:** Ethics Consult submits a written recommendation based on the Matrix.
  *   **The Order:** The **Attending Physician** writes the order. They bear the license risk.
  *   **The Veto:** The **Legal Surrogate** (Health Care Proxy) can usually override the Ethics recommendation, *unless* their decision constitutes abuse/neglect (e.g., demanding futile treatment or refusing clearly indicated comfort care).
  *   **The Hard Stop:** If the Attending and Surrogate agree, but Ethics strongly dissents (e.g., they are forcing high-burden treatment on a happy dementia patient against an AD), Ethics documents "Conscientious Objection to Plan" in the chart and suggests transfer of care.

  ***

  ### Part 3: Running the Cases

  #### Case 1: Pneumonia in the Garden (Your Example)
  *   **Facts:** 78F, Advanced Dementia. AD: "If severe dementia, no antibiotics/life support." Current: Sitting in garden, feeding birds, smiles at staff. Diagnosed with pneumonia. Surrogate (Daughter) wants to follow AD. Patient pushes away pill cup but doesn't scream.
  *   **Phase 1:** AD Valid? Yes. Applicable? Yes (Severe Dementia).
  *   **Phase 2:** Capacity? No. Stability? Volatile (pushes away but returns to birds). Affective Valence? **Contentment.** (She is enjoying life).
  *   **Phase 3 (Matrix):** Scenario A (Clear AD Refuse + Content Patient).
      *   Intervention: Oral antibiotics (Low Burden) vs. IV/Hospital (High Burden).
      *   *Assumption:* Let's say it's oral azithromycin, can be done in facility.
      *   *Application:* Low Burden + Content Patient = **Follow Current Wish (Treat).**
      *   *Rationale:* The "harm" of the Past Self's autonomy being violated is outweighed by the concrete loss of a currently content life for a treatable condition. The AD assumes a quality of life the patient currently *has*.
  *   **Outcome:** **Treat the pneumonia.**
  *   **Note for you:** I suspect this is the outcome you won't like. It prioritizes the "happy demented self" over the "competent past self's" specific instruction.

  #### Case 2: The Feeding Tube Plea
  *   **Facts:** 82M, Late-stage Alzheimer's. AD: "No artificial nutrition/hydration." Current: Choking on puree. Surrogate (Wife) wants tube to prevent starvation. Patient gags when spoon approaches, turns head away, grimaces.
  *   **Phase 1:** AD Valid? Yes. Applicable? Yes.
  *   **Phase 2:** Capacity? No. Stability? **Stable** (Consistently turns head away). Affective Valence? **High Distress** (Gagging, grimacing).
  *   **Phase 3 (Matrix):** Scenario B (Clear AD Refuse + Miserable Patient).
      *   Intervention: PEG Tube (High Burden/Surgical).
      *   Application: High Distress + High Burden + Clear AD = **Honor the Directive.**
      *   *Rationale:* Here, the Past Self's wish aligns with the Present Self's physical reaction. Forcing the tube violates both.
  *   **Outcome:** **No Tube. Comfort feeding only.**
  *   **Note for you:** This should align with your view. The procedure doesn't always throw out the AD; it throws it out only when the current experience of the patient contradicts the *assumptions* the AD was based on (i.e., that life would be miserable).

  ***

  ### Part 4: Why This Might Still Feel "Mushy"

  You asked for a way to make it less mushy. The mushiness comes from the fact that **Advance Directives are predictions, not contracts.**

  Your friend argued that the person in the garden *is* the person who matters. You argued that the person who signed the paper *is* the person who matters.
  *   If you follow the procedure above, in Case 1, you are effectively telling the Past Self: *"You were wrong about what your future life would feel like."*
  *   In Case 2, you are telling the Past Self: *"You were right, and we will protect you from this suffering."*

  The procedure works by checking if the **Present Experience** invalidates the **Past Prediction**.
  *   If the patient is happy (Case 1), the Past Prediction ("Life with dementia is not worth living") is empirically false *for this moment*.
  *   If the patient is suffering (Case 2), the Past Prediction is empirically true.

  **The Honest Stop Point:**
  If your hospital wants to avoid the "mush," you need a policy decision, not an ethics consult decision. The policy should state: *"In cases of severe dementia where the patient exhibits consistent contentment, specific AD refusals of low-burden life-sustaining treatment (like antibiotics) require Surrogate + Attending + Ethics consensus to withhold. Default is to treat."*

  That removes the burden from you during the consult. But until your hospital adopts that policy, you're stuck in the dinner argument, just with a stethoscope.
