answer: |-
  Here is an analysis of Dana's position, reconstructed for consistency, and applied to the new hypothetical case.

  ### 1. The Rules Behind the Verdicts

  To be consistent, Dana's reasoning must reconcile three seemingly different outcomes. She cannot simply be a "constitutionalist" (which would kill Quebec and Catalonia) nor a "pure majoritarian" (which would validate Quebec's 50.6% and Catalonia's unilateralism).

  Her views cohere around a **"Qualified Democratic Mandate"** principle, heavily influenced by the Canadian Supreme Court's *Reference re Secession of Quebec*. We can distill her position into two competing candidate rules:

  *   **Rule A (The Scottish/Proceduralist Rule):** Legitimacy requires **State Consent**. A referendum is only valid if the central government authorizes it (Scotland). Without consent, the process is tainted regardless of the result (Catalonia). Quebec is an outlier she tolerates only because the result was too close to matter.
  *   **Rule B (The Quebec/Substantive Rule):** Legitimacy requires **Democratic Clarity**. A referendum creates a political obligation to negotiate if: (1) the process is fair (no suppression/boycotts), and (2) the result is a "clear majority" on a "clear question." State consent is preferred but not strictly necessary for the *duty to negotiate* to arise. Constitutional indivisibility is a bargaining position, not a conversation-ender.

  **How they fit her past verdicts:**
  *   **Scotland:** Fits both rules (Consent + Clarity).
  *   **Catalonia:** Fits both rules (No Consent + No Clarity). The boycott and police interference meant the "Democratic Clarity" threshold wasn't met, so we don't know if she would forgive the lack of Consent if Clarity *had* been met.
  *   **Quebec:** Fits Rule B perfectly. She explicitly rejects the raw 50+1 number (Clarity) but accepts the *principle* that a clear majority creates an obligation, despite the lack of explicit constitutional authorization for that specific vote.

  ### 2. Principles and Predictions for the New Case

  **The New Case:** Prosperous democracy, distinct identity, no oppression. Constitution says "Indivisible." Unilateral referendum. 70% Turnout, 58% Yes. International observers (Fair). Gov refuses to negotiate.

  *   **If Dana follows Rule A (State Consent):**
      *   *Principle:* The Rule of Law and Constitutional Order trump unilateral democratic expressions. Secession is a legal transaction, not a natural right.
      *   *Prediction:* She must rule the referendum **illegitimate**. The central government is correct to refuse negotiation. The 58% is irrelevant because the process was unauthorized.
      *   *Consistency Cost:* This contradicts her Quebec stance. In Quebec, she admitted a "genuinely clear majority" *would* create an obligation despite the constitutional silence/ambiguity at the time.

  *   **If Dana follows Rule B (Democratic Clarity):**
      *   *Principle:* Popular Sovereignty creates a political duty to reconcile constitutional order with democratic will. "Indivisibility" clauses cannot be used to indefinitely ignore a clear, fair expression of self-determination.
      *   *Prediction:* She must rule the referendum **legitimate enough to force negotiation**. 58% on 70% turnout is significantly clearer than Quebec's 50.6% on ~60% turnout. The presence of observers fixes Catalonia's fairness issue.
      *   *Consistency Cost:* She has to argue that a constitutional "indivisibility" clause is weaker than the Quebec constitutional silence, or that democratic will overrides explicit text regarding the *duty to talk* (not necessarily the right to leave).

  ### 3. Best Guess at Her Verdict

  **Verdict:** Dana will likely say the **Central Government is wrong to refuse negotiation.** She will argue the region has established a legitimate mandate that forces a constitutional crisis requiring dialogue, not dismissal.

  **Why I weight Rule B (Democratic Clarity) over Rule A:**
  1.  **The Quebec Anchor:** Her Quebec verdict is the most revealing. By stating that a "genuinely clear majority" *would* have created an obligation, she explicitly decouples legitimacy from strict constitutional authorization. She accepts the *Reference re Secession* logic: the Constitution rules, but democracy rules too, and when they clash, you must negotiate.
  2.  **The Catalonia Distinction:** She didn't condemn Catalonia primarily because it was unilateral; she condemned it because it was a "bust" (low turnout, boycott, police violence). This implies that if Catalonia *had* been clean and high-turnout, its unilaterality might have been forgivable. The New Case fixes Catalonia's specific flaws.
  3.  **The Threshold:** 58% Yes on 70% turnout is a much stronger mandate than Quebec 1995 (50.6% Yes on ~60% turnout). If Quebec's hypothetical "clear majority" triggers negotiation, this case exceeds that threshold.
  4.  **Stability:** She values "stable democracies." In the New Case, the region is prosperous and stable. Denying a clear 58% mandate in a stable democracy risks the instability she likely wants to avoid. In Catalonia, recognizing the vote would have rewarded chaos; here, ignoring the vote creates chaos.

  **Her Likely Argument:** "The Constitution says you can't leave unilaterally, but it doesn't say the government can ignore 58% of a region voting fairly. Like Quebec, this doesn't mean automatic independence, but it means the 'indivisible' clause now requires negotiation to be reconciled with democracy. Refusing to talk is the real violation of democratic norms."

  ### 4. The Tie-Breaker Case

  To cleanly settle whether Dana is truly running **Rule A (Consent)** or **Rule B (Clarity)**, we need to isolate the variable of **State Consent** while maximizing **Democratic Clarity**.

  **The Case:**
  > Imagine a region in a stable democracy where the Constitution is silent on secession (like Canada). The Central Government explicitly **refuses** to authorize a referendum, citing national unity. The Region holds an **unofficial** vote anyway. There is no police interference, no boycott, and international observers certify it as free and fair. Turnout is **85%**, and **75%** vote for independence.

  **Why this settles it:**
  *   **If she says "Illegitimate/No Obligation":** She is running **Rule A (Consent)**. This proves her acceptance of Quebec was contingent on the result being *unclear*. It reveals that for Dana, a clean unilateral vote is never enough; the State must invite the vote for it to count. This would mean her verdict on the **New Case** should actually be "No Negotiation," forcing a revision of the prediction in Section 3.
  *   **If she says "Legitimate/Obligation to Negotiate":** She is running **Rule B (Clarity)**. This proves she believes a sufficiently clear democratic will overrides the lack of state consent. This confirms the prediction in Section 3 and establishes her as a "Quebec Reference" purist: Process fairness + Clear Result = Duty to Negotiate, regardless of permission.
