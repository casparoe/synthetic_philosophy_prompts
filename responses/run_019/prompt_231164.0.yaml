      *   **The Friend's Objection:** Asymbolics don't *really* have pain, or their reports are unreliable.
      *   **Required Framework:** Use the distinction between the *sensory-discriminative* and *affective-motivational* components of pain.
      *   **Required Analysis:**
          1.  What must be true of the sensation in asymbolia for it to separate pain from badness?
          2.  What is the friend assuming when rejecting this separation?
          3.  What is the ultimate nature of the dispute (empirical, conceptual, or both)?
          4.  What is at stake in resisting the distinction?

  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Standard View (Separatist/Component View):* Pain has two parts: "ouchiness" (sensory) and "suffering" (affective). Asymbolia proves they can come apart.
      *   *The Imperativist/Strong Phenomenal View (The Friend's View):* Pain is *essentially* unpleasant. If it's not unpleasant, it's not pain. It's like a tickle or a pressure sensation, but not pain.
