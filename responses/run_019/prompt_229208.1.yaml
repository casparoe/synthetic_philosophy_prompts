prompt: |-
  Got into an argument with a friend who's basically a Hobbes/Xunzi type -- thinks people are selfish by default and only law plus incentives keep us civilized. I pushed back with "Mencius says human nature is good" and he just asked me what that even *means*, and honestly I got stuck. Then I went and actually read some Mencius (Legge translation) and found this weird exchange with the philosopher Kâo in Book 6, Part 1, ch. 3. Kâo says nature just means life, i.e. whatever you're born with, and Mencius needles him: "Is the whiteness of a white feather like that of white snow, and the whiteness of white snow like that of white jade?" and then "Is the nature of a dog like the nature of an ox, and the nature of an ox like that of a man?"

  So now I'm not even sure the slogan is an empirical claim at all. Can you lay out, as a menu, the different precise theses "human nature is good" could be expressing -- e.g. a statistical claim about tendencies, a claim about capacities, a claim about how people develop absent interference, a normative claim dressed up as descriptive, or (as the passage above makes me suspect) a stipulative move about what counts as a thing's "nature" in the first place, which would make the slogan almost true by definition? For each reading: is it trivial, substantive-but-defensible, or just false? And for each, say (a) whether the feather/snow/jade argument actually supports it or secretly just assumes it, and (b) whether it's a reading my Xunzi-fan friend would even bother denying, or whether he'd shrug and say it does no work against him. End with which reading you think best fits that Kâo exchange, because honestly the whiteness bit reads to me like Mencius is playing language games.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with a friend (Hobbes/Xunzi type: human nature is selfish/bad, civilization requires external constraints). The user cited Mencius ("human nature is good"), got pressed on what that *means*, read some Mencius (specifically the Kâo dialogue in 6A:3), and is now confused about whether it's an empirical claim or a linguistic/stipulative one.
      *   **Task:** Create a "menu" of different precise theses that "human nature is good" could express.
      *   **Requirements for each thesis:**
          *   Classify it (trivial, substantive-but-defensible, or false).
          *   (a) Does the feather/snow/jade argument support it or assume it?
          *   (b) Would the Xunzi/Hobbes friend deny it or shrug?
      *   **Conclusion:** Identify which reading best fits the Kâo exchange (specifically addressing the "language games" suspicion).

  2.  **Deconstruct the Mencius-Kâo Debate (6A:3):**
      *   *Kâo's Position:* "Nature is what is born with us" (Sheng zhi wei xing). It's a descriptive, biological baseline.
      *   *Mencius' Counter:* He asks if "white" is the same across feathers, snow, and jade. Kâo says yes. Then Mencius asks if the *nature* of a dog is the same as an ox, and an ox the same as a human. Kâo is trapped.
      *   *Implication:* Mencius is arguing that "nature" isn't just *anything* you're born with (like appetites); it's the *distinctive* potential that separates humans from beasts. If "nature" just means "biological given," then humans are no different from dogs. Therefore, "nature" must refer to the specific moral sprouts unique to humans.
      *   *User's Suspicion:* Is Mencius playing language games? (Yes, partly. He's redefining "nature" normatively.)

  3.  **Brainstorming the "Menu" of Theses:**
      *   *Option 1: The Empirical/Statistical Claim.* Most people do good things most of the time. (False/Weak).
      *   *Option 2: The Developmental Claim.* If left alone without bad environment, people flourish morally. (Substantive).
      *   *Option 3: The Capacities/Sprouts Claim.* Humans have innate *potential* for morality (unlike rocks or tigers). (Substantive).
      *   *Option 4: The Normative/Stipulative Claim.* "Nature" means "what makes us essentially human," and since morality makes us human, nature is moral. (Trivial/True by definition).
      *   *Option 5: The Teleological Claim.* Human life has a direction/purpose (toward virtue), and deviating is "unnatural." (Substantive/Metaphysical).

  4.  **Drafting the Analysis for Each Option:**

      *   *Thesis 1: Empirical Regularity (People usually act nice).*
          *   Status: False (History shows otherwise).
          *   Feather Argument: Doesn't support it.
          *   Friend's Reaction: Would crush this.

      *   *Thesis 2: The "Sprouts" (Capacity/Potential).*
          *   Status: Substantive. We have empathy (child in well).
          *   Feather Argument: Supports it (distinguishes human nature from animal nature).
          *   Friend's Reaction: Would concede capacities but deny they lead to *good* without constraint.

      *   *Thesis 3: Developmental (Good absent interference).*
          *   Status: Defensible but hard to test (state of nature is hypothetical).
          *   Feather Argument: Implicitly supports it (water flows down analogy elsewhere).
          *   Friend's Reaction: Would deny (State of Nature is war).

      *   *Thesis 4: Normative/Stipulative (Essentialism).*
          *   Status: Trivial/True by definition (if you accept the definition).
          *   Feather Argument: *This* is what the argument is doing. Defining "nature" as distinctive essence.
          *   Friend's Reaction: Would shrug. "Call it what you want, they still need laws."

      *   *Thesis 5: Teleological (Purpose-driven).*
          *   Status: Metaphysical. Hard to prove/disprove scientifically.
          *   Feather Argument: Supports the idea of specific ends for specific natures.
          *   Friend's Reaction: Would reject teleology.

  5.  **Refining the "Feather/Snow/Jade" Analysis:**
      *   Mencius isn't talking about color; he's talking about *categorization*.
      *   Kâo says "Nature = Born." Mencius says "If Nature = Born, then Dog Nature = Human Nature."
      *   Mencius forces Kâo to admit "Nature" must mean "Specific Essence."
      *   Once "Nature" = "Specific Human Essence," and "Human Essence" = "Morality" (which Mencius argues elsewhere via the child-in-the-well), then "Nature is Good" follows.
      *   So, is it a language game? Yes, but a philosophical one (conceptual analysis), not just wordplay.

  6.  **Addressing the Friend (Hobbes/Xunzi):**
      *   Xunzi actually agrees humans have *capacities*, but thinks the raw material is messy/selfish.
      *   Hobbes thinks survival is the drive.
      *   They would reject the *normative* definition of nature. They want a *descriptive* definition.

  7.  **Finalizing the Conclusion:**
      *   Which fits the Kâo exchange best? The Stipulative/Essentialist reading (Thesis 4), closely tied to the Capacities reading (Thesis 2).
      *   Acknowledge the "language game" suspicion: It *is* a move to shift the definition of "nature" from "biological given" to "normative essence."

  8.  **Review against Constraints:**
      *   Menu format? Yes.
