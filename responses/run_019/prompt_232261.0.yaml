answer: |-
  Below is a framework of desiderata for a theory of the franchise. It is structured to separate conceptual distinctions from normative requirements, and to isolate the internal tensions that make a perfect theory impossible.

  ### I. Necessary Conceptual Distinctions

  Before listing desiderata, a theory must define the terms of the debate. Failure to distinguish these concepts leads to category errors in the pressure points you identified.

  **1. Subject to Coercion vs. Affected by Outcomes**
  *   **Distinction:** *Subject to Coercion* means one is legally bound to obey the polity's rules under threat of sanction (e.g., a resident non-citizen, a prisoner). *Affected by Outcomes* means one suffers consequences from policy without necessarily being under the polity's legal authority (e.g., a foreigner impacted by climate policy, a non-resident citizen).
  *   **Case for Weight:** Conflating these leads to either boundless enfranchisement (everyone on earth is affected by US policy) or unjust exclusion (residents who pay taxes and face jail cannot vote). A plausible theory must prioritize *Coercion* as the threshold for the *right* to vote, while *Affectedness* may justify consultation but not necessarily the franchise.

  **2. Moral Right vs. Legal Power vs. Civic Duty**
  *   **Distinction:** A *Moral Right* implies a claim against interference. A *Legal Power* is the institutional capacity to alter the status of the government. A *Civic Duty* implies an obligation to participate.
  *   **Case for Weight:** Treating voting solely as a right protects liberty (freedom to abstain). Treating it solely as a duty protects legitimacy (turnout). A theory must specify if the franchise is a *protected liberty* (negative right) or a *public office* (functionary role).

  **3. Status vs. Capacity**
  *   **Distinction:** *Status* is a categorical standing (e.g., "citizen," "adult"). *Capacity* is a functional ability (e.g., "understands the ballot," "rational agency").
  *   **Case for Weight:** This is the crux of the cognitive disability and age debates. If the franchise is based on Status, exclusion requires stripping status. If based on Capacity, exclusion requires individualized assessment. A theory must choose which is primary to avoid arbitrariness.

  ---

  ### II. Desiderata for a Theory of the Franchise

  Here are the criteria a theory must satisfy, marked by their normative weight.

  #### 1. The Non-Arbitrariness Constraint (Non-Negotiable)
  *   **Case:** Exclusions from the franchise cannot be based on traits irrelevant to the function of voting (e.g., race, gender, property ownership). Any restriction must track a relevant difference regarding the purpose of the election.
  *   **Status:** **Non-Negotiable.** A theory that permits arbitrary exclusion fails as a *democratic* theory.

  #### 2. The Coercion Alignment Principle (Non-Negotiable)
  *   **Case:** Those who are uniquely subject to the coercive power of the state's laws must have a mechanism to authorize that power. To be bound by laws one has no hand in making is the definition of political tyranny.
  *   **Status:** **Non-Negotiable.** This grounds the claim of resident non-citizens and prisoners.

  #### 3. The Minimal Agency Condition (Non-Negotiable)
  *   **Case:** Voting is an intentional act of judgment. If an entity lacks the capacity to form a preference or understand the causal link between voting and outcome, they cannot vote, only be voted *for*.
  *   **Status:** **Non-Negotiable.** This is the primary exclusionary constraint. Without it, the "vote" becomes noise or a proxy for guardians.

  #### 4. The Equality of Weight Preference (Contestable)
  *   **Case:** Each vote should count equally ("one person, one vote").
  *   **Status:** **Preference.** While standard in liberal democracy, epistemic democrats might argue for weighted voting based on competence. However, for a theory to be broadly plausible today, it should treat this as a strong presumption, though not metaphysically absolute.

  #### 5. The Civic Integrity Preference (Contestable)
  *   **Case:** The franchise should be structured to encourage decisions that sustain the polity over time, rather than immediate gratification or self-destruction.
  *   **Status:** **Preference.** This drives arguments for compulsory voting or higher voting ages. It is a goal of *good* democracy, not a definition of *legitimate* democracy.

  #### 6. The Administrative Feasibility Constraint (Non-Negotiable)
  *   **Case:** The criteria for enfranchisement must be actionable by election officials without intrusive, discretionary inquisitions into every voter's soul.
  *   **Status:** **Non-Negotiable.** A theory requiring individualized competence tests for every adult is theoretically sound but practically tyrannical (open to bias).

  ---

  ### III. Application to Pressure Points

  Using the distinctions and desiderata above, we can map the specific cases you raised:

  *   **Adolescents/Children:**
      *   *Conflict:* **Minimal Agency** vs. **Coercion Alignment**. Children are subject to coercion (laws, school) but often fail the Agency condition.
      *   *Resolution:* The theory must locate a threshold where Agency is presumed. Lowering the age depends on empirical data about when *political competence* matures, not just moral worth.
  *   **Long-term Non-Citizen Residents:**
      *   *Conflict:* **Coercion Alignment** vs. **Membership Status**.
      *   *Resolution:* **Coercion Alignment** wins. If they are subject to the law permanently, the Non-Arbitrariness Constraint demands they vote, regardless of citizenship status.
  *   **Non-Resident Citizens:**
      *   *Conflict:* **Membership Status** vs. **Coercion Alignment**.
      *   *Resolution:* **Coercion Alignment** suggests restriction. If they are not subject to the daily coercion of the laws they shape, their claim is weaker than residents. Citizenship alone is insufficient without subjection.
  *   **Prisoners/Ex-Felons:**
      *   *Conflict:* **Civic Integrity** (punishment) vs. **Coercion Alignment**.
      *   *Resolution:* **Coercion Alignment** wins. Prisoners are the *most* coerced population. Disenfranchisement creates a class of subjects without authorization. Ex-felons must be automatically restored to avoid permanent caste status (Non-Arbitrariness).
  *   **Severe Cognitive Disabilities:**
      *   *Conflict:* **Equality of Weight** vs. **Minimal Agency**.
      *   *Resolution:* **Minimal Agency** acts as a threshold. However, to satisfy **Non-Arbitrariness**, the assessment cannot be discriminatory. Supported decision-making (assistive voting) is required before exclusion. Exclusion is only permissible if agency is impossible even with support.
  *   **Compulsory Voting:**
      *   *Conflict:* **Right to Abstain** vs. **Civic Integrity**.
      *   *Resolution:* This turns on the *Character* distinction. If voting is a *Public Office*, duty is permissible. If it is a *Liberty Right*, compulsion is illegitimate. A plausible theory can treat it as a "duty without sanction" (moral obligation) but legal compulsion risks violating the liberty character of the right.

  ---

  ### IV. Diagnosis of Tensions Among Criteria

  This is the critical diagnostic section. No theory can maximize all desiderata simultaneously. The following are the structural fault lines.

  #### Tension 1: The All-Affected Principle vs. The Administrative Feasibility Constraint
  *   **The Conflict:** The **Coercion Alignment** principle, if interpreted broadly as "All Affected," pulls toward universal enfranchisement (including children, foreigners, future generations). However, the **Administrative Feasibility Constraint** requires clear, bright-line rules (e.g., age 18, citizenship).
  *   **The Exclusionary Force:** **Administrative Feasibility** does the most work to exclude plausible candidates.
      *   *Why:* To satisfy the Coercion Alignment perfectly, we would need individualized assessments of who is "affected" or "competent." But individualized assessments violate **Non-Arbitrariness** (officials will bias the tests) and **Administrative Feasibility**.
      *   *Result:* We must accept "over-inclusion" (some incompetent voters) and "under-inclusion" (some affected non-voters) via proxy rules like age and residency. **Feasibility forces us to tolerate some injustice to prevent tyranny.**

  #### Tension 2: Minimal Agency vs. Equality of Weight
  *   **The Conflict:** The **Minimal Agency Condition** demands we exclude those who cannot vote meaningfully. The **Equality of Weight** principle demands we treat all citizens as peers.
  *   **The Exclusionary Force:** **Minimal Agency** is the hard limit.
      *   *Why:* You cannot grant the franchise to those who lack the capacity to exercise it without turning their guardians into the actual voters (violating Non-Arbitrariness).
      *   *Result:* This is the primary justification for excluding young children and those with profound cognitive impairments. However, because **Non-Arbitrariness** forbids discriminatory testing, we must use rough proxies (age) which inevitably exclude some competent adolescents. **The theory must accept that some competent individuals will be disenfranchised to protect the integrity of the agency requirement.**

  #### Tension 3: Civic Integrity (Duty) vs. Liberty (Right)
  *   **The Conflict:** Treating voting as a **Legal Duty** (Compulsory Voting) enhances **Civic Integrity** (turnout, representativeness) but infringes on the **Liberty** character of the franchise (freedom of conscience includes freedom not to speak/act).
  *   **The Exclusionary Force:** **Liberty** generally trumps **Civic Integrity** in liberal frameworks.
      *   *Why:* Making voting a legal obligation transforms the voter from a sovereign authorizing power into a functionary of the state.
      *   *Result:* A plausible theory can advocate for a *moral* duty to vote, but cannot enforce it legally without altering the fundamental character of the franchise from a right to an office. If one prioritizes Civic Integrity enough to enforce voting legally, one ceases to describe a liberal democratic franchise and describes a civic mobilization regime.

  ### V. The Primary Exclusionary Constraint

  If one requirement must be identified as doing the most to exclude otherwise plausible candidates, it is the **Minimal Agency Condition**, operationalized through the **Administrative Feasibility Constraint**.

  *   **Why:** The **Coercion Alignment Principle** is infinitely expansive. It logically extends the vote to anyone impacted by policy (global affectedness) or subject to any rule (children, tourists).
  *   **The Check:** The **Minimal Agency Condition** cuts this back. But because we cannot test every individual for agency (due to **Administrative Feasibility** and **Non-Arbitrariness**), we must use blunt proxies (Age, Citizenship, Residency).
  *   **The Cost:** These proxies inevitably exclude:
      1.  **Competent Adolescents:** Who are coerced and capable but fall under the age line.
      2.  **Non-Resident Citizens:** Who are members but not coerced daily.
      3.  **Supported Decision-Makers:** Those with disabilities who could vote with help but are excluded by categorical bans.

  **Conclusion on Tensions:**
  A plausible theory of the franchise cannot be perfectly coherent. It must accept a **tragic remainder**:
  1.  Some people subject to coercion will not vote (due to Agency proxies).
  2.  Some people who vote will lack full agency (due to Feasibility/Non-Arbitrariness).
  3.  Some people affected by decisions will have no say (due to the boundary of Coercion).

  The theory that best navigates this is one that treats the **Right to Vote** as fundamental (protecting Liberty), grounded in **Subjection to Coercion** (protecting Legitimacy), but limited by **Presumed Agency** (protecting Function), while acknowledging that the proxies used to measure Agency will always be imperfect. Any proposal that claims to dissolve these tensions entirely (e.g., "vote for everyone affected" or "test everyone for competence") fails the **Administrative Feasibility** or **Non-Arbitrariness** desiderata.
