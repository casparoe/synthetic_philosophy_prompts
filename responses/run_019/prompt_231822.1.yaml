  Apex Indemnity Group
  Claims Adjustment Division
  400 Actuarial Way, Suite 300
  Hartford, CT 06103

  **Date:** October 24, 2023
  **Claim Number:** 774-ALPHA-9
  **Policyholder:** Arthur Henderson
  **Subject:** Determination of Liability Regarding Claimed Property Loss

  Dear Mr. Henderson,

  Following our site inspection on October 10th regarding the incident involving the ceramic object in your study, Apex Indemnity Group has completed its adjudication process. After a thorough review of the policy terms and the metaphysical status of the damaged property, we are writing to inform you that your claim for indemnification has been denied.

  Our adjuster confirmed that the object in question was subjected to significant compressive force, resulting in a deformation of its original form. However, coverage under Section 4, Paragraph C of your homeowners' policy applies to the loss of material property, not the loss of artistic configuration. It is the established position of Apex Indemnity that the clay constituting the object and the statue represented by that clay are not identical entities. Rather, they are distinct objects that merely coincide spatially and temporally.

  The clay existed prior to the sculpting process and retains its material integrity following the squashing incident. Therefore, the clay—the actual insured substance—has not been destroyed, merely rearranged. The statue, conversely, ceased to exist upon the loss of its specific form. As your policy covers the material constituent (the clay) rather than the temporary sortal (the statue), no covered loss has occurred. You remain in possession of the clay, which is currently in a flattened state.

  We anticipate your confusion, as laypersons frequently conflate the statue with the clay. This is a common category error in non-specialist discourse. However, strict adherence to the principles of material constitution requires us to distinguish between the thing constituted and the constituting matter. They have different persistence conditions. The clay can survive being squashed; the statue cannot. To argue otherwise is to ignore the modal properties distinct to each entity.

  Furthermore, please note that under our guidelines, being squashed is not synonymous with being destroyed. Destruction implies the cessation of the material substance. Since the clay persists, the event constitutes a change in properties, not an extinction of the insured item. Consequently, there is no financial liability on the part of Apex Indemnity.

  You may appeal this decision by submitting Form 12-B, though we advise that any argument relying on the identity theory of material objects will be rejected as philosophically unsound and contractually invalid.

  Sincerely,

  **Gary Thorne**
  Senior Claims Adjuster
  Apex Indemnity Group
