answer: |-
  ### The Bounded Community: Special Obligations and the Modern State

  The modern liberal state operates within a normative paradox. It enforces a hard boundary between citizen and non-citizen regarding political franchise, welfare entitlements, and entry, yet it simultaneously affirms the universal moral worth of all persons through human rights instruments and strict prohibitions on internal discrimination. This cluster of practices presupposes an account of special obligations that is neither thoroughly cosmopolitan nor purely tribal. Instead, it suggests a system of **bounded universalism**, where the *content* of justice is universal (rights, equality), but the *scope* of distributive and political justice is particular (the citizenry).

  This practice most naturally aligns with an **associative account of duties**. By restricting the franchise and social benefits to citizens, the state acts as if shared membership in a political community generates unique obligations that do not extend to outsiders, regardless of their proximity or need. This view, championed by thinkers like David Miller, holds that compatriots share a collective responsibility for their institutional order and a special concern for one another's welfare that is not owed to humanity at large. The right to control immigration further reinforces this, presupposing that a community has the right to self-determination and to maintain the cultural or political conditions necessary for its continued existence.

  However, these practices can be reconstructed on **universalist grounds** without admitting that outsiders are morally inferior. One reconstruction is the **division of moral labor**. On this view, universal human rights are best secured by assigning specific states responsibility for specific populations. Preferential treatment of compatriots is not an end in itself but an instrumental necessity to ensure every state has the incentive and capacity to care for its own, thereby securing rights globally. A second universalist reconstruction is the **coercion-based account** (associated with Thomas Nagel). This argues that because the state uniquely coerces its citizens through law, it owes them a higher degree of justificatory equality (justice) than it owes non-citizens who are not subject to the same sovereign authority.

  When analyzing which rival views are ruled out, the practices are selective. **Thoroughgoing cosmopolitanism** is strictly ruled out by the triad of border control, citizenship-based benefits, and franchise restrictions. A consistent cosmopolitan who believes moral obligations track personhood rather than membership would demand open borders and a global distribution of resources based on need, not citizenship. Conversely, **ethnic nationality-based partialism** is ruled out by the ratification of human rights instruments and the condemnation of internal discrimination. The state treats all *citizens* equally regardless of ethnicity, implying that the relevant bond is civic, not biological or cultural.

  The **coercion-based account**, however, reveals where the practice is underdetermined or inconsistent. While coercion explains why citizens owe each other justice, it struggles to justify the exclusion of long-term resident non-citizens from the franchise. These residents are subject to the law and state coercion yet lack political voice. If the practice were strictly determined by coercion, resident aliens would vote. Their exclusion suggests the state relies more on a notion of *formal membership* (associative) than *subjection to power* (coercion). Thus, the practice licenses associative theories and division-of-labor theories but sits uneasily with strict coercion-based theories.

  Are these components consistent? They are consistent if viewed through **liberal nationalism** or **institutional cosmopolitanism**. In both, the boundary is a tool to facilitate self-determination or efficient rights protection, not a denial of universal worth. However, if the presupposed account were replaced by thoroughgoing cosmopolitanism, the state would have to open borders and globalize its tax base. If replaced by ethnic partialism, it would have to strip rights from minority citizens. The current stability of the practice relies on the ambiguity of its justification: it speaks the language of universal rights to legitimize itself internally, while relying on particularist membership to manage resources and power externally.

  ***

  ### Analysis of State Practices and Normative Commitments

  | Practice Element | Apparent Presupposition | Plausible Universalist Reconstruction | Views It Rules Out (if any) | Strictly Presupposed or Merely Compatible? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Franchise restricted to citizens** (excludes long-term residents) | Political agency is a right of membership, not merely affected interest or subjection. | **Division of Labor:** States manage their own democratic processes to ensure global stability. | **Thoroughgoing Cosmopolitanism** (voting based on affected interests); **Strict Coercion Theory** (voting based on subjection to law). | **Compatible** with Associative Duties; **Inconsistent** with Strict Coercion Theory. |
  | **Social benefits preferential to compatriots** | Distributive justice is bounded by the political community. | **Instrumental Universalism:** States are the most efficient units to deliver welfare, preventing global free-riding. | **Thoroughgoing Cosmopolitanism** (resources distributed by global need). | **Merely Compatible** (could be associative or instrumental). |
  | **Right to control immigration** | Communities have a right to self-determination and exclusion. | **Sovereignty as Trust:** States hold territory in trust for their current citizens to protect their institutional integrity. | **Open Border Cosmopolitanism** (freedom of movement as a basic right). | **Strictly Presupposed** (State sovereignty requires exclusionary capacity). |
  | **Ratification of Human Rights / Internal Non-Discrimination** | All persons within the jurisdiction possess equal moral worth. | **Universal Moral Status:** Human rights are inherent to personhood, independent of state grant. | **Ethno-Nationalism / Racialism** (worth depends on lineage or ethnicity). | **Strictly Presupposed** (Liberal legitimacy requires internal equality). |
  | **Cluster as a Whole** | Special obligations exist among compatriots that override general obligations to outsiders. | **Bounded Universalism:** Universal goals are pursued through particularistic institutions. | **Anarchism** (no state authority); **Global State Advocacy** (single political unit). | **Underdetermined** (Supports both Liberal Nationalism and Institutional Cosmopolitanism). |
