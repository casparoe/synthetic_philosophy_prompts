      *   *If we adopt Defeasibility:* The moment the report is mentioned, the Detective *ceases to know*. So (4) no longer applies. He can't say "I know $p$" anymore. He must check.
      *   *This is the "Defeasibility Analysis" of Knowledge.* It's a very standard move.
