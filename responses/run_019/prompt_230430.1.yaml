      *   **(2) Fallibilism:** Standard epistemology (anti-skepticism). Hard to give up.
      *   **(3) Closure:** Controversial but widely held. Dretske/Nozick reject it, but most contextualists/infallibilists keep it.
      *   **(4) The Dogmatism Step:** "If I know $p$, then any evidence against $p$ would have to be misleading, and usually I can know that *before* I've even looked."
          *   First half ($Kp \rightarrow$ evidence against $p$ is misleading) follows from factivity.
          *   Second half (I can *know* it's misleading beforehand) is the trouble spot. This relies on Closure + knowing the logical implication.
      *   **(5) Defeasibility/Epistemic Responsibility:** "Should lower confidence/check." This contradicts the practical implication of (4).

