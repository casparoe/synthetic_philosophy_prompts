      *   Better approach: The "Defeasibility Condition" on Knowledge. If there is unrebutted counter-evidence, you don't *know* $p$ anymore. So the Detective *loses* knowledge upon hearing about the report, before reading it. This preserves (1), (2), (3), (4a), and (5). It changes the status of the Detective.
