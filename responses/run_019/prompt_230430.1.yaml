      *   **Tension B: (2) vs. (4).** If knowledge is fallible (2), how can you be so sure that counter-evidence is misleading *before* looking (4)? Fallibilism suggests there's a risk you're wrong. If there's a risk you're wrong, you can't be certain the evidence is misleading.
      *   **Tension C: (3) vs. (5).** Closure allows you to derive "evidence is misleading" from "I know $p$". (5) says you shouldn't rely on that derivation in practice.

  5.  **Determine the "Cheapest Revision":**
      *   *Option 1: Reject Closure (3).* (Dretske/Nozick style). Solves the paradox but costs a lot (loss of deductive reasoning power in knowledge).
      *   *Option 2: Reject Fallibilism (2).* (Infallibilism). If knowledge requires certainty, then (4) is fine. But this leads to skepticism. High cost.
      *   *Option 3: Nuance (4).* Distinguish between knowing $p$ implies evidence is misleading (true) vs. knowing *that* you know $p$ (KK principle) or being *justified* in dismissing evidence without investigation.
      *   *Option 4: Nuance (5).* Distinguish between *theoretical* rationality (logic) and *practical* rationality (heuristics).
      *   *Best "Cheap" Revision:* Modify (4). Specifically, the claim that "I can know that [evidence is misleading] before I've even looked."
      *   *Why?* You can maintain (1), (2), (3), and (5). The problem is the *access* to the fact that the evidence is misleading. Just because $p$ is true doesn't mean you can *know* the specific evidence is misleading without investigating it, because your knowledge of $p$ might be fallible.
