      *   *Actually, the standard solution:* Deny that you can *know* the evidence is misleading *prior* to investigating it, even if you know $p$. This attacks the "Closure" application in (4).
      *   *Wait, let's look closer at (4).* "If I know $p$, then any evidence against $p$ would have to be misleading." (True by factivity). "and usually I can know that before I've even looked." (This is the Dogmatism claim).
      *   *Revision:* Deny the second half of (4). You know $p$, so the evidence *is* misleading, but you don't *know* it's misleading until you check, because your knowledge of $p$ is fallible.
      *   *Cost:* You lose the ability to use knowledge as a shield against inquiry. But that's a feature, not a bug, for avoiding dogmatism.

  6.  **Rank Tensions:**
