      *   **Tension B: C2 (Involuntarism) vs. C3 (Blame for Beliefs).**
          *   C2 says we can't choose beliefs directly (like shell commands).
          *   C3 says we can blame people for holding beliefs.
          *   *Conflict:* "Ought implies can." If I can't choose my belief, how can I be blamed for it?
          *   *Resolution:* Blame is indirect. We blame the *process* (C1) that led to the belief, or we use blame as a social tool to adjust future attention (C2 says we choose what to attend to).
          *   *Severity:* Medium-High. Classic philosophical problem (Doxastic Voluntarism).

      *   **Tension C: C1 (Evidence Duty) vs. C4 (Jamesian Exception).**
          *   C1 says check evidence if feasible.
          *   C4 says if evidence *can't* settle, go with passion.
          *   *Conflict:* How do we know evidence *can't* settle? Is C4 a loophole for C1?
          *   *Resolution:* C4 explicitly limits itself to cases where evidence *cannot* settle. C1 applies where evidence *is* available. They are mutually exclusive domains *if* defined strictly.
          *   *Severity:* Low. They seem designed to complement each other (Default to Clifford, Exception for James).

      *   **Tension D: C5 (Stakes $\neq$ Evidence) vs. C6 (Act without Belief).**
          *   C5 says stakes change action thresholds, not evidence.
          *   C6 says act (rollback) while suspending judgment.
          *   *Conflict:* None really. C6 supports C5. You act based on stakes/risk management, not necessarily on settled belief.
          *   *Severity:* None. These are consistent.

      *   **Tension E: C3 (Blame for Belief) vs. C2 (Involuntarism) - Revisited.**
          *   If beliefs are causal outputs (C2), blaming the output seems like blaming a compiler error.
          *   Unless the blame is for the *input* (attention/investigation).
          *   *Severity:* Medium.

      *   **Tension F: C1 (Pollution of Commons) vs. C7 (Division of Labor).**
          *   C1 worries about bad beliefs polluting the pool.
          *   C7 encourages relying on others' beliefs.
          *   *Conflict:* If everyone does C7, who does the checking for C1? The "Tragedy of the Epistemic Commons."
          *   *Severity:* Medium.

  4.  **Drafting the Audit (Iterative Refinement):**

      *   *Structure:* Introduction (acknowledge the stack), Ranked Tensions (Severity, Diagnosis, Fix, Cost), Conclusion.
