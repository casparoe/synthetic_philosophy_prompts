          2.  **C2 vs C3 (The Responsibility Model):** Philosophical core. If beliefs aren't voluntary, blame is weird.
          3.  **C1 vs C4 (The Edge Case Handler):** Risk of misclassifying a problem to avoid work.

  5.  **Finalizing the Output Structure:**
