  7.  **Final Polish:** Ensure the "Cost" of each fix is clear (e.g., cognitive load, social friction).

      *(Self-Correction)*: Wait, C1 says "believing... can be morally wrong." C3 says "legitimate to blame... for holding... beliefs." These reinforce each other. The tension is C2 (can't choose beliefs). So C1+C3 vs C2 is the real cluster.

