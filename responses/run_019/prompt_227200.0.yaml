  I've been going to my game theory professor's office hours a lot this semester and she has this habit of telling us what "her" verdict is on any game we bring her -- like what rational players actually do, not just what the textbook equilibrium is. So far her calls have been: one-shot prisoner's dilemma, both defect, obviously. Finite repeated prisoner's dilemma with the number of rounds announced up front (we asked about 10 and about 1000, same answer), defect from round one because the whole thing unravels from the end. A four-move centipede game, first player takes the money immediately and the game is over before it starts. The traveler's dilemma (two people name a price between 2 and 100, lowballer gets a bonus), she says both players race to the bottom and name 2. And then -- this is the one that surprised me -- an indefinitely repeated prisoner's dilemma where after each round there's a small fixed chance the game ends, she said she'd cooperate and thinks rational players mostly would too, because there's no last round for the unraveling to grab onto.

  So a few of us were arguing about this over beers and we want to predict her verdict before we ask her. The new case: an infinite centipede game. Same structure as the four-move one, the pot keeps growing the longer it gets passed, either player can grab a bigger share at any point, but there's no final move at all -- it just never has to end. Nobody we know has asked her anything like it. Does she say grab at move one, or pass?

  What I actually want from you is the reasoning, not just a guess. Lay out the different rules she could plausibly be running that all fit her earlier verdicts equally well -- like "always play the backward-induction solution whenever the game has a known end, cooperate when it doesn't," versus "defect/grab in anything with prisoner's-dilemma-ish incentives," versus "do whatever maximizes your payoff assuming the other player is as rational as you" -- say what each of those rules predicts for the infinite centipede, give me your best guess for her actual verdict and why, and then tell me what further game I could put to her that would best tell the remaining rules apart. Oh and she has a known quirk: she hates answers that lean on the other player being slightly irrational, so try to keep the candidate rules clean of that unless you think it's really what she's doing.
