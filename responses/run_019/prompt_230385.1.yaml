answer: |-
  # Week 1 Handout: Which Decision Theory Do You Actually Hold?

  **Instructions:** Read the nine scenarios below. For each, select the option that matches your genuine intuition about what a rational agent should do. Do not overthink the "correct" philosophical answer; go with your gut. At the end, use the scoring key to see which decision framework your intuitions align with.

  ***

  ### 1. The Two Boxes
  A being with a perfect track record of prediction has placed \$1,000 in Box A and either \$1,000,000 or nothing in Box B. You can take both boxes or only Box B. The being put the \$1,000,000 in Box B *only if* it predicted you would take only Box B. The money is already in the boxes.
  *   **A.** Take only Box B.
  *   **B.** Take both boxes.
  > *Note: Tests whether you prioritize causal leverage over correlation with past predictions.*

  ### 2. The Genetic Test
  A gene causes both a fatal disease and a strong desire to eat a specific fruit. Eating the fruit does not cause the disease; the gene causes both. You do not know if you have the gene. The fruit tastes delicious.
  *   **A.** Eat the fruit.
  *   **B.** Do not eat the fruit.
  > *Note: Tests whether you avoid actions merely because they are bad news about your underlying state.*

  ### 3. The Stranded Traveler
  A driver offers you a ride home but only if they believe you will pay them \$100 upon arrival. The driver is an excellent judge of character. Once you arrive home, the driver has no power to punish you, and you have no power to reward them.
  *   **A.** Pay the \$100.
  *   **B.** Do not pay the \$100.
  > *Note: Tests whether you honor commitments when causal leverage is lost but reputation was the cause of rescue.*

  ### 4. The Coin Flip Offer
  A being flipped a fair coin. If Heads, they give you \$10,000, provided they predicted you would give them \$100 if the coin landed Tails. If Tails, they ask you for \$100. The coin landed Tails. You know this. The \$10,000 is already gone.
  *   **A.** Pay the \$100.
  *   **B.** Do not pay the \$100.
  > *Note: Tests whether you follow a policy that wins ex-ante, even when local evidence says the benefit is impossible.*

  ### 5. The Transparent Boxes
  Same as Scenario 1, but the boxes are transparent. You can see \$1,000,000 in Box B. The being filled the boxes based on what they predicted you would do *after seeing what was inside*.
  *   **A.** Take only Box B.
  *   **B.** Take both boxes.
  > *Note: Tests whether you act as part of a logical algorithm even when physical evidence suggests the outcome is fixed.*

  ### 6. The Psychopath Button
  Pressing a button kills all psychopaths in the world. You strongly desire to kill psychopaths. However, only a psychopath would desire to kill psychopaths. If you press the button, it is strong evidence that you are a psychopath.
  *   **A.** Press the button.
  *   **B.** Do not press the button.
  > *Note: Tests whether you let the evidential link between your desire and your type override the causal good of the action.*

  ### 7. The Mirror Match
  You are playing a one-time game against an exact physical duplicate of yourself, created five minutes ago. You cannot communicate. You both choose "Cooperate" or "Defect." Payoffs are standard Prisoner's Dilemma.
  *   **A.** Cooperate.
  *   **B.** Defect.
  > *Note: Tests whether you treat logical correlation with a twin as a reason to cooperate despite lack of causal interaction.*

  ### 8. The Toxoplasmosis Cat
  A parasite causes both lethargy and a love for cats. Petting a cat does not infect you; the parasite causes both. You feel energetic. There is a cute cat.
  *   **A.** Pet the cat.
  *   **B.** Do not pet the cat.
  > *Note: Similar to Scenario 2; checks consistency on avoiding actions that are merely correlated with bad outcomes.*

  ### 9. The Escape Plan
  Death predicts where you will go to find you. You want to avoid Death. You can go to Aleppo or Damascus. Death has already made their prediction and is on their way.
  *   **A.** Go to the city Death did not predict (try to outsmart the prediction).
  *   **B.** Go to either city (acknowledge you cannot change the past prediction).
  > *Note: Tests whether you believe your choice can correlate with a past prediction of that choice.*

  ***

  ### Scoring Key

  Tally your answers. There are no "right" answers, only consistent frameworks.

  **Mostly "B" on 1, 3, 4, 5, 6, 7, 9:**
  **You lean Causal (CDT).**
  You believe rationality is about causing good outcomes. If your action cannot physically change the past, the prediction, or the genetic fact, you ignore it. You take the money that is visibly there, you don't pay when you are safe, and you don't worry about bad news unless your action causes it.
  *   *Strengths:* Intuitively clear, robust against manipulation by superstition.
  *   *Weaknesses:* Loses money in prediction-heavy scenarios (1, 3, 4) because it cannot pre-commit.

  **Mostly "A" on 1, 3, 6, 7, 9 AND "B" on 2, 4, 5, 8:**
  **You lean Evidential (EDT).**
  You believe rationality is about choosing the action that provides the best news. You one-box and cooperate with twins because those actions correlate with good worlds. However, once you *know* the outcome (like the coin landing Tails in #4 or seeing the money in #5), you stop acting to influence the correlation, because the evidence is already fixed.
  *   *Strengths:* Wins in standard coordination and prediction games.
  *   *Weaknesses:* "Jinxes" itself (avoiding fruit/cats in 2 & 8) and fails to secure gains in counterfactual scenarios (#4) where the evidence is already known.

  **Mostly "A" on 1, 3, 4, 5, 6, 7, 9 AND "A" on 2, 8:**
  **You lean Policy-Based (UDT/FDT).**
  You believe rationality is about selecting the best decision *algorithm* or policy, even if you have to ignore specific local evidence. You pay in #4 and one-box in #5 not because you change the past, but because a agent that *would* do those things gets better results overall. You eat the fruit in #2 because your policy shouldn't be held hostage by correlations you can't cause.
  *   *Strengths:* Wins in the widest range of theoretical problems, including those where CDT and EDT fail.
  *   *Weaknesses:* Can feel counterintuitive to act against visible evidence (like seeing the money in #5).

  ***

  ### Caveats & Overlaps

  **The UDT/FDT Merger:** This quiz groups Updateless Decision Theory (UDT) and Functional Decision Theory (FDT) together. In almost all standard scenarios, these two yield the same answers. They only diverge on hyper-technical cases involving logical identity across different source code implementations (e.g., "Is my code *identical* to the twin's, or just functionally equivalent?"). For a reading group introduction, treating them as a single "Policy-Based" leaf is standard practice.

  **The CDT/UDT Overlap:** You may notice that on Scenarios 2 and 8 (The Genetic Test and The Cat), CDT and UDT give the same answer ("Eat/Pet"), while EDT differs. This is not a flaw in the quiz; it reflects a genuine agreement between Causal and Policy theorists that you should not manage the news. The quiz distinguishes them on Scenarios 4 and 5 (Mugging and Transparent Boxes), where CDT and EDT align ("Don't Pay/Two-Box") against UDT.

  **The Empty Leaf:** You might find almost no one scores as a "pure" Evidentialist who also Two-Boxes in Scenario 1. This is because EDT naturally leads to One-Boxing. If you found yourself One-Boxing in #1 but Two-Boxing in #5, you are likely an EDT who hasn't considered the implications of transparency. Conversely, the "Policy-Based" leaf is often the least populated in casual groups; this view is mathematically robust but psychologically demanding, requiring you to act as a function rather than a momentary agent.
