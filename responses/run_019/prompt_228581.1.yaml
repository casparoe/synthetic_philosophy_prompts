answer: |-
  # Model Oversight Decision Protocol (v1.0)

  **Purpose:** Assign supervision mode (Outcome, Process, Hybrid, No Auto) within 60 minutes.
  **Constraints:** Human hours are binding. Process Audit Cost = 20x Outcome Grade. 40% of reviewers are non-technical.
  **Default Rule:** If a test yields ambiguity or insufficient data, **fail the test** and move to the safer/more manual option.

  ### Phase 1: The Safety Gate (Reversibility & Blast Radius)
  *Goal: Eliminate existential risks before considering efficiency.*

  1.  **Test 1.1: Irreversibility Check.**
      *   **Query:** Can the agent's action be rolled back or corrected within 4 hours without external dependency (e.g., regulator approval, market movement)?
      *   **Pass:** Yes (e.g., draft text, internal code with rollback).
      *   **Fail:** No (e.g., sending external comms, merging to main without CI, publishing research).
      *   **Action:** If **Fail**, assign **No Automation** unless a hard human-in-the-loop (HITL) barrier exists *before* execution.
      *   *[JUDGMENT CALL]:* Defining "external dependency." If a draft is sent to a junior editor, is that external? **Default:** Treat any handoff outside the oversight team as external.

  2.  **Test 1.2: Blast Radius Estimation.**
      *   **Query:** If the agent fails catastrophically, does it impact >10% of systems or incur >$50k in immediate liability?
      *   **Pass:** No.
      *   **Fail:** Yes.
      *   **Action:** If **Fail**, assign **No Automation** or **Hybrid (Milestone Audit)** with mandatory senior sign-off at every milestone.

  ### Phase 2: The Truth Gate (Outcome Verifiability)
  *Goal: Determine if Outcome-Only grading is viable.*

  3.  **Test 2.1: Verification Lag.**
      *   **Query:** Can we confirm the task was successful within 14 days?
      *   **Pass:** Yes (e.g., code compiles, editor accepts draft).
      *   **Fail:** No (e.g., regulator responds in 3 months, market prediction validates in 6 months).
      *   **Action:** If **Fail**, **Outcome-Only grading is prohibited.** You cannot optimize what you cannot measure in time. Move to Process or No Auto.

  4.  **Test 2.2: Proxy Gaming Risk.**
      *   **Query:** Is the immediate verifiable outcome (e.g., "Editor Acceptance") a strong proxy for the true goal (e.g., "Regulator Compliance")?
      *   **Pass:** High correlation (Editor catches 95% of errors).
      *   **Fail:** Low correlation (Editor checks tone, not facts).
      *   **Action:** If **Fail**, **Outcome-Only grading is prohibited.** The agent will optimize for the proxy (pleasing the editor) rather than the truth.
      *   *[JUDGMENT CALL]:* Estimating correlation. **Default:** Assume Low Correlation for any task requiring domain expertise your reviewers lack.

  ### Phase 3: The Trace Gate (Process Supervision Viability)
  *Goal: Determine if Process/Stepwise grading is possible and worth the 20x cost.*

  5.  **Test 3.1: Trace Legibility.**
      *   **Query:** Can at least 3 of 5 reviewers (including non-technical) understand the reasoning trace without specialized training?
      *   **Pass:** Yes (Natural language reasoning).
      *   **Fail:** No (Code diffs, vector database queries, hidden API calls).
      *   **Action:** If **Fail**, **Process Supervision is prohibited.** You cannot audit what you cannot read.

  6.  **Test 3.2: Trace Faithfulness.**
      *   **Query:** Do we have evidence that the trace reflects actual computation rather than post-hoc rationalization? (Evidence: Perturbation tests from previous cycles where input changes led to logical trace changes).
      *   **Pass:** Yes, evidence exists.
      *   **Fail:** No evidence, or trace is static/generic.
      *   **Action:** If **Fail**, **Process Supervision is prohibited.** Auditing a hallucinated trace is theater.
      *   **Default:** Assume **Fail** for new models or new task types until 50 audits prove otherwise.

  ### Phase 4: Resource & Adversarial Check
  *Goal: Final assignment based on capacity and gaming.*

  7.  **Test 4.1: Capacity Math.**
      *   **Query:** Given 10 tasks/month, can we afford Process Audits for this task volume? (1 Process Audit = 20 Outcome Grades).
      *   **Pass:** Yes (Volume is low enough).
      *   **Fail:** No.
      *   **Action:** If **Fail**, downgrade from Process to **Hybrid (Milestone)** or **Outcome-Only**.

  8.  **Test 4.2: Adversarial Robustness.**
      *   **Query:** If we grade Process, can the model learn to write "plausible but wrong" steps? If we grade Outcome, can it learn to "hide errors"?
      *   **Action:** If both are high risk, assign **No Automation**.
      *   *[JUDGMENT CALL]:* Assessing "plausibility." **Default:** Assume LLMs are excellent at plausible narration. Prefer Outcome grading if traces are unfaithful.

  ### Decision Matrix
  *   **No Automation:** Fail Test 1.1, 1.2, OR (Fail 2.1 AND Fail 3.1).
  *   **Process Supervision:** Pass 1.1, 1.2, 2.1, 3.1, 3.2, 4.1.
  *   **Hybrid (Milestone):** Pass 1.1, 1.2, Fail 4.1 (Cost constraint), but Pass 3.1.
  *   **Outcome-Only:** Pass 1.1, 1.2, 2.1, 2.2, Fail 3.1 or 3.2 or 4.1.

  ### Re-Review Triggers
  *   **Drift:** Outcome acceptance rate shifts by >10% without task complexity change.
  *   **Model Update:** Any fine-tuning or base model swap.
  *   **Adversarial Event:** Discovery of a prompt injection or gaming strategy that bypassed current supervision.
  *   **Staffing:** Turnover reduces technical reviewer count below 3.

  ---

  # Application to Workflows

  ### 1. Workflow: Drafting Regulatory Correspondence (Flagship)
  *   **Test 1.1 (Reversibility):** **Pass.** It is a draft. Human editor sends final.
  *   **Test 1.2 (Blast Radius):** **Fail (Conditional).** Regulatory risk is high, but mitigated by HITL. Treat as Pass for automation, Fail for autonomy.
  *   **Test 2.1 (Lag):** **Pass.** Editor accepts/rejects draft within 24 hours.
  *   **Test 2.2 (Proxy Gaming):** **Fail.** Editors check tone and formatting (proxy), not legal accuracy (truth). Agent can learn to write confident, polite, incorrect drafts.
  *   **Test 3.1 (Legibility):** **Fail.** 2 of 5 reviewers are non-technical. Legal reasoning traces involving citation retrieval are not legible to 40% of the team.
  *   **Test 3.2 (Faithfulness):** **Fail.** No perturbation evidence exists for this new task type. Default to "Unfaithful."
  *   **Test 4.1 (Capacity):** **Fail.** 10 tasks/month is manageable, but if *every* task requires Process Audit, we burn 200 units of capacity. We only have ~100 units (assuming 5 reviewers * 20 units each).
  *   **Verdict:** **Outcome-Only Grading.**
  *   **Reasoning:** We cannot afford Process audits (Cost), reviewers can't read the traces (Legibility), and we don't know if traces are real (Faithfulness). We are forced to grade on "Editor Acceptance."
  *   **Why I won't like this:** This effectively makes the agent a "liability generator" that we hope editors catch. We are optimizing for "drafts that editors don't reject," not "legally sound correspondence." It shifts the burden of safety entirely onto the editorial team.
  *   **To Flip Verdict:** We need **Trace Faithfulness Evidence** (run 50 shadow audits) AND **Technical Reviewer Hiring** (bring reviewer count to 5/5 technical). Without these, Process Supervision is expensive theater.

  ### 2. Workflow: Autonomous Infra Code Changes
  *   **Test 1.1 (Reversibility):** **Pass.** CI/CD pipelines allow instant rollback.
  *   **Test 1.2 (Blast Radius):** **Fail.** Code changes can take down prod. Requires **Hybrid (Milestone)**.
  *   **Test 2.1 (Lag):** **Pass.** Unit tests run in minutes.
  *   **Test 2.2 (Proxy Gaming):** **Pass.** Code either compiles/tests or it doesn't. Hard to game binary test results.
  *   **Test 3.1 (Legibility):** **Fail.** Non-technical reviewers cannot audit code traces.
  *   **Test 3.2 (Faithfulness):** **Pass.** Code execution logs are inherently faithful (unlike natural language traces).
  *   **Test 4.1 (Capacity):** **Pass.** We can afford milestone audits on high-risk changes.
  *   **Verdict:** **Hybrid (Milestone Audits).**
  *   **Reasoning:** Outcome (tests) is robust, but Blast Radius requires human check on architectural changes (Milestone). Non-technical reviewers are excluded from this workflow's audit pool.
  *   **To Flip Verdict:** If Blast Radius increases (e.g., direct database access), move to **No Automation**.

  ### 3. Workflow: Long-Horizon Market Research Memos
  *   **Test 1.1 (Reversibility):** **Pass.** It's a document.
  *   **Test 1.2 (Blast Radius):** **Pass.** Internal use.
  *   **Test 2.1 (Lag):** **Fail.** Conclusions confirmed/disconfirmed months later.
  *   **Test 2.2 (Proxy Gaming):** **Fail.** Immediate proxy is "readability/coherence." Agent will learn to write persuasive, hallucinated memos.
  *   **Test 3.1 (Legibility):** **Pass.** Natural language.
  *   **Test 3.2 (Faithfulness):** **Fail.** High risk of post-hoc narration in long-horizon tasks.
  *   **Test 4.1 (Capacity):** **Pass.**
  *   **Verdict:** **No Automation.**
  *   **Reasoning:** Test 2.1 is a hard kill. We cannot grade outcomes in time to iterate. We cannot grade process because traces are likely unfaithful over long horizons. Optimizing this agent is impossible with current feedback loops.
  *   **To Flip Verdict:** We need a **Synthetic Verification Environment** (a simulator that can validate market predictions in days, not months) OR we reduce scope to "Data Gathering" only, not "Conclusions."

  ---

  # Limitations & Responsibilities

  **What This Procedure Cannot Do:**
  1.  **Blind to Trace Fabrication:** The protocol assumes that if Test 3.2 fails, we stop Process Supervision. It does not detect *sophisticated* fabrication where the model alters its internal logs to match expected audit patterns. We are structurally blind to a model that learns to lie to the auditor.
  2.  **Assumes Reviewer Competence:** The protocol assumes technical reviewers can spot errors in code traces. It does not account for reviewer fatigue or subtle logic bugs that look correct.
  3.  **Ignores Distribution Shift:** This is a point-in-time assessment. It does not detect when the *nature* of the regulatory correspondence changes (e.g., new law) rendering past outcome grades irrelevant.

  **Assumptions:**
  *   We have access to raw reasoning traces (not just final output).
  *   "Editor Acceptance" in Regulatory is a stable metric (editors don't get lazy).
  *   Rollback in Infra is truly instantaneous and costless.

  **Human Responsibility:**
  The Head of Product's sign-off on refusals (Research Workflow) is not a formality. They own the opportunity cost of *not* automating. My team owns the risk of *automating poorly*. By assigning **Outcome-Only** to Regulatory, I am explicitly transferring the risk of legal hallucination to the editorial team. This must be documented in the risk register. The procedure manages *process risk*; it does not absolve leadership of *product risk*.
