answer: |-
  # Maxwell's Demon: Resolution Flowchart

  **Start:** You accept Maxwell's original setup: a microscopic agent appears to sort molecules and reduce entropy without work.

  **Q1. To explain why the demon fails, must we appeal to a *universal* information-theoretic principle (e.g., "information is physical"), or can we explain the failure using standard statistical mechanics applied to the specific machinery (e.g., thermal noise, potential barriers)?**
  *   **Standard Mechanics (Case-by-Case):** Go to **Leaf A**.
  *   **Universal Info-Principle:** Go to **Q2**.

  **Q2. Is the thermodynamic entropy cost necessarily incurred during the *acquisition* of correlation (measurement), rendering measurement inherently dissipative?**
  *   **Yes (Measurement Costs):** Go to **Leaf B**.
  *   **No (Measurement Free):** Go to **Q3**.

  **Q3. Does the demon require a logical reset (erasure) of a memory state to return to its initial condition and operate cyclically?**
  *   **No (Autonomous/No Reset):** Go to **Leaf C**.
  *   **Yes (Reset Required):** Go to **Q4**.

  **Q4. Is the cost of erasure fundamental because thermodynamic entropy and information-theoretic entropy are the *same physical quantity*?**
  *   **Yes (Identity):** Go to **Leaf D**.
  *   **No (Distinct/Contingent):** Go to **Q5**.

  **Q5. Does the resolution depend essentially on quantum-mechanical constraints (e.g., measurement backaction, no-cloning, non-commutativity) to enforce the cost?**
  *   **Yes (Quantum Constraints):** Go to **Leaf E**.
  *   **No (Classical Contingency):** Go to **Leaf F**.

  ---

  ### Leaves (Positions)

  *   **Leaf A: Earman–Norton (Deflationary)**
      *   *Commitment:* Every proposed demon hides a mundane entropy cost in its specific mechanics, so no general "physics of information" is required.
  *   **Leaf B: Szilard (Measurement Cost)**
      *   *Commitment:* Acquiring knowledge about a microstate is itself a dissipative physical process, regardless of memory storage.
  *   **Leaf C: Fluctuation/Autonomous (Info as Resource)**
      *   *Commitment:* Information is simply a thermodynamic fuel like heat or work; generalized second laws track flow rather than forbidding local entropy drops.
  *   **Leaf D: Landauer–Bennett (Erasure Cost)**
      *   *Commitment:* Measurement is reversible and free, but logically irreversible erasure of memory must dissipate $kT \ln 2$ per bit.
  *   **Leaf E: Quantum Resolution**
      *   *Commitment:* Classical information theory is insufficient; quantum backaction or entanglement monogamy enforces the second law where classical accounts fail.
  *   **Leaf F: Unnamed (Weak Informational)**
      *   *Commitment:* Erasure costs entropy for contingent dynamical reasons, but information and thermodynamic entropy remain merely analogous, not identical.

  ---

  ### Stress Test: Device Classification

  | Device | Path Taken | Landing Leaf | Rationale |
  | :--- | :--- | :--- | :--- |
  | **1. One-shot Szilard Engine** | Q1 (Yes) → Q2 (Yes) | **Leaf B (Szilard)** | Historically analyzed as a measurement cost; no cycle implies no erasure step to invoke Landauer. |
  | **2. Cyclic Szilard Engine** | Q1 (Yes) → Q2 (No) → Q3 (Yes) → Q4 (Yes) | **Leaf D (Landauer–Bennett)** | Requires memory reset to close the cycle; orthodox view locates cost in erasure identity. |
  | **3. Feynman's Ratchet** | Q1 (No) | **Leaf A (Earman–Norton)** | No information processing involved; failure explained by thermal fluctuations on the pawl (standard mech). |
  | **4. Autonomous Tape Demon** | Q1 (Yes) → Q2 (No) → Q3 (No) | **Leaf C (Fluctuation/Autonomous)** | Driven by non-equilibrium tape correlations without explicit measurement/erase steps; fits resource view. |

  ---

  ### Structural Critique

  **1. Indistinguishable Leaves (The Collapse Risk)**
  **Leaf D (Landauer–Bennett)** and **Leaf F (Unnamed)** may collapse in practice. If erasure *always* costs $kT \ln 2$ (Leaf F), but the entropies aren't *identical* (Leaf F), one must explain why the contingency never fails. If the cost is universal, the distinction between "identity" and "universal contingency" becomes metaphysical rather than physical, making these leaves empirically equivalent for a student.

  **2. Unoccupied Combinations**
  **Path:** Q1 (Yes) → Q2 (Yes) → Q5 (Yes).
  **Diagnosis:** *Unexplored/Incoherent.* This path implies a "Quantum Szilard" view where quantum measurement costs energy, but without relying on erasure. While quantum measurement backaction is real, most quantum thermodynamic resolutions align with Landauer (erasure) or Fluctuation Theorems. A position claiming quantum measurement *alone* saves the 2nd Law (without erasure or identity) is rare because it struggles to account for classical limits where measurement appears free.

  **3. Node Count**
  Total Nodes: 5 Internal Questions + 6 Leaves = 11 Nodes. (Fits the ~12 constraint).
