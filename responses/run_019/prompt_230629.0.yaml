answer: |-
  This pattern is technically termed **conjunctural causation** or **INUS conditions**, reflecting a shift from strict counterfactual necessity to **probabilistic causation** and **explanatory relevance**.

  You are correct that standard philosophical **overdetermination** (where each cause is sufficient) does not fit the First World War model; historians often use the term loosely, but the precise conceptual machinery comes from J.L. Mackie's **INUS conditions** (an Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient) and **probabilistic causation**. In this framework, a factor counts as a cause not because the event *could not* have happened without it, but because it significantly **raised the probability** of the event occurring within a specific **causal field**. These cases hang together because historians are typically answering contrastive questions (e.g., "Why war in 1914 rather than peace?") rather than seeking absolute metaphysical origins; a factor explains if it makes the actual outcome more intelligible compared to a plausible alternative, even if another factor might have produced a similar outcome later.

  The boundary between a genuine cause and a mere background condition is drawn using the concept of the **causal field**. Factors within the field (like the alliance system) are treated as variables that changed, while factors outside it (like the existence of sovereign states) are treated as fixed conditions. A but-for-failing factor counts as a cause if it is **explanatorily relevant** to the specific contrast being drawn, whereas a factor that fails the but-for test and does not raise the probability of the event *in the specific context* is dismissed as irrelevant. This is generally understood as a different notion of **explanation** rather than a different metaphysics of causation; historians adopt a pragmatic stance where "cause" signifies a difference-maker within a specific narrative context, not necessarily a nomological necessity.

  **Settled Consensus:**
  *   **Rejection of Monocausality:** It is settled that complex historical events rarely have single necessary or sufficient causes.
  *   **Insufficiency of Counterfactuals:** There is broad agreement that the strict "but-for" test (counterfactual dependence) is too narrow for historical explanation, as it excludes factors that merely raise probability or contribute to a conjunctural chain.
  *   **Context Dependence:** It is accepted that causal attribution depends on the historian's specific question or contrast class (e.g., explaining the timing vs. explaining the occurrence).

  **Genuinely Contested:**
  *   **Realism vs. Pragmatism:** Philosophers and historians dispute whether these "causes" reflect real ontological relations in the past or are purely epistemic tools constructed by the historian to organize narrative.
  *   **Causal Weight:** There is no settled method for quantifying or ranking the relative importance of multiple INUS conditions (e.g., was the arms race a "greater" cause than the alliance system?), leading to ongoing debate about **causal weighting**.
  *   **Probabilistic vs. Deterministic:** Some argue that historical causation is inherently probabilistic, while others maintain the underlying reality is deterministic and our use of probability merely reflects ignorance of hidden variables.
