answer: |-
  This is one of the most persistent and productive puzzles in the philosophy of action and law. You have correctly identified that the physical facts (the "nothing" that happened) are identical, yet the causal verdicts diverge.

  Here is the account you are looking for, broken down by your specific questions, followed by the confidence ratings you requested.

  ### 1. The Label
  The general phenomenon is called **Omissive Causation** (or Causation by Omission). The specific problem of why we select some omissions as causes and ignore others is often called the **Problem of Causal Selection** or the **Default/Deviant Distinction**.

  In legal theory, this is frequently discussed under **Duty of Care** within causation, but philosophers prefer terms like **Normative Sensitivity of Causation**.

  ### 2. The Account: Are Norms Doing Causal Work or Blame Work?
  You asked whether the norm is doing *real causal work* or only *blame work*. The dominant contemporary account (championed by philosophers like Christopher Hitchcock, Joseph Halpern, and Peter Menzies) is that norms do **real causal work**, but only because causation itself is context-sensitive.

  Here is the mechanism:
  *   **Causal Models:** We do not judge causation by looking at the whole universe of physical events. We construct a "causal model" of the situation.
  *   **Default vs. Deviant:** To build that model, we must decide what counts as the "default" (normal/expected) state and what counts as a "deviant" (abnormal/intervention) state.
  *   **The Role of the Norm:** The norm (e.g., "lifeguards save people," "doctors administer standard drugs") sets the **default**.
      *   **Lifeguard:** The default state for a lifeguard is *acting*. Their inaction is a *deviation*. Therefore, the deviation is selected as the cause.
      *   **Tourist:** The default state for a tourist is *not acting*. Their inaction is the *default*. Therefore, it is background noise, not a cause.
  *   **Conclusion:** The norm is not just tacking blame onto a finished causal fact. The norm is required to *construct* the causal fact in the first place. Without the norm, you cannot distinguish the cause from the background conditions.

  **Confidence: High.** This is the standard view in contemporary causal modeling and philosophy of science.

  ### 3. The Doctor Cases: Sloppy Speech or Real Difference?
  You asked if the two doctor cases (standard drug vs. experimental drug) should differ causally, or if ordinary speech is being sloppy.

  **This requires a correction to your setup.** The Lifeguard case and the Doctor case are actually structurally different, and noticing this difference answers your question.

  *   **The Lifeguard Case (Pure Norm):** Both the lifeguard and tourist *physically could* have saved the swimmer. The counterfactual ("If they had moved, the swimmer would live") is true for both. The *only* difference is the norm. Here, ordinary speech is **not sloppy**; it is acknowledging that causation is sensitive to duty.
  *   **The Doctor Case (Norm + Efficacy):** You described the experimental drug as one that "almost never works."
      *   If the drug doesn't work, then the counterfactual is false: "If the doctor had given the drug, the patient would *still* have died."
      *   If the counterfactual is false, there is **no causal dependence**, regardless of norms.
      *   In the standard drug case, the counterfactual is true: "If given, the patient lives."

  **Verdict:** In the Doctor case, the causal verdict differs primarily because of **efficacy** (counterfactual dependence), not just norms. However, the *norm* determines whether the doctor was *required* to try.
  *   If we imagine a case where the experimental drug *would* work, but the doctor wasn't required to use it, and they didn't: Most people would still hesitate to say the doctor "caused" the death, even though the counterfactual holds.
  *   This suggests that even when counterfactuals are fixed, norms still filter causal selection.

  **Is it sloppy speech?** No. It is precise speech operating within a **pragmatic theory of causation**. Causation is not just a physical relation (like billiard balls hitting); it is an *explanatory* relation. An explanation must cite what was abnormal or manipulable. Since the norm defines what is abnormal, the norm is part of the causal explanation.

  **Confidence: Medium-High.** The distinction between efficacy and duty is clear, but the claim that causation is inherently pragmatic is still debated against "physicalist" views.

  ### 4. Summary of the Mechanism
  The puzzle dissolves if you accept that causation is **contrastive**. We never ask "Did X cause Y?" in a vacuum. We ask "Did X cause Y *rather than Z*?"

  *   **Lifeguard:** Why did the swimmer die *rather than live*? Because the lifeguard didn't act (deviation from duty).
  *   **Tourist:** Why did the swimmer die *rather than live*? Because the swimmer got a cramp (physical cause). The tourist's inaction is not a relevant contrast because they weren't expected to act.

  The norm selects the **contrast class**. It tells us which alternative world we are comparing reality to.

  ***

  ### Confidence Ratings & Uncertainty

  Per your request, here is the breakdown of my confidence in the claims above, and the identification of my least certain claim.

  **1. Claim: The term for this is "Omissive Causation" / "Causal Selection."**
  *   **Confidence:** **Very High.** This is standard terminology in metaphysics and legal theory.

  **2. Claim: Norms do "real causal work" by setting the Default/Deviant distinction in causal models.**
  *   **Confidence:** **High.** This is the consensus among philosophers working on causal modeling (e.g., Halpern & Pearl). It is the most robust solution to the puzzle.

  **3. Claim: Ordinary speech is not "sloppy," but reflects a pragmatic/explanatory view of causation.**
  *   **Confidence:** **Medium-High.** While this is the dominant view in philosophy of language and action, there is a minority view (Physicalism) that insists causation must be purely physical, which would render ordinary speech "sloppy" or metaphorical.

  **4. Claim: The Doctor case differs from the Lifeguard case because the Doctor case involves efficacy (counterfactuals) while the Lifeguard case is purely normative.**
  *   **Confidence:** **High.** Your prompt bundled efficacy with norms in the doctor case. Disentangling them shows the causal structures are different.

  **5. Claim: Causation is inherently contrastive and context-sensitive (not a fixed physical relation).**
  *   **Confidence:** **Medium.** This is the **claim I am least sure of**.
      *   *Reasoning:* This is the deepest metaphysical bet in this entire answer. There is a strong tradition (Process Theories of Causation) that argues causation is a physical transfer of energy or momentum, independent of human norms. If that view is correct, then *neither* the lifeguard nor the tourist caused the death physically; we are just projecting blame onto the lifeguard.
      *   While the "Contrastive/Pragmatic" view is more popular in contemporary analytic philosophy, the "Physicalist" view has strong intuitions on its side. I am confident that the Pragmatic view *explains our language better*, but I am less confident that it describes the *metaphysical fabric of reality* rather than just our psychology.

  **Summary of Least Sure Claim:**
  I am least sure that **causation is inherently normative/contrastive rather than purely physical.** I am confident that *talk* of causation works this way, but whether the *relation itself* is this way depends on unresolved metaphysical debates about whether omissions can be "real" events.
