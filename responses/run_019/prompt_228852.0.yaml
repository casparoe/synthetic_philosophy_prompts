answer: |-
  There is no single, canonical term in philosophy or psychology that captures this exact phenomenon in its entirety. However, your description is precise enough that we can locate it at the intersection of three established concepts. Understanding where they overlap will give you the vocabulary you need, and where they fail to overlap is where we can coin a term that fits your specific "temporal" requirement.

  ### The Existing Triad

  To describe this accurately, you have to pull from three different fields. None of them alone captures the "rewriting of the past" aspect, but together they map the territory.

  **1. Reconstructive Memory (Psychology)**
  This is the mechanism. Pioneered by Elizabeth Loftus, this theory posits that memory is not a video archive but a reconstruction built at the moment of recall. When you recall a memory, it becomes "labile" (malleable). If new information is introduced *during* recall (e.g., "This painting is a fake"), the brain integrates that new data into the memory trace before storing it again.
  *   **Why it fits:** It explains how the *past* experience changes. The memory of the "clumsy hands" is literally written over the memory of the "masterful hands."
  *   **Where it falls short:** Reconstructive memory usually applies to *events* (e.g., "Did the car stop at the sign?"). It is less commonly applied to *sensory qualia* (e.g., "Did the wine taste tannic?").

  **2. Cognitive Penetration of Perception (Philosophy of Mind)**
  This is the philosophical hypothesis that what we *believe* can directly alter what we *see* or *taste*, not just how we judge it. If cognitive penetration is true, the sommelier doesn't just *judge* the wine to be worse; their olfactory cortex actually processes the scent differently because the "fake" label downregulates the reward signal.
  *   **Why it fits:** It explains the *present* experience. The object hasn't changed, but the neural processing of the object has.
  *   **Where it falls short:** This is usually discussed in the present tense. It doesn't inherently account for the retroactive rewriting of long-term memory.

  **3. Psychological Essentialism (Cognitive Anthropology)**
  Work by psychologists like Paul Bloom and George Newman shows that humans are "essentialists." We believe objects have an underlying "essence" that determines their value and nature. In art and wine, the "essence" is tied to history and origin (provenance). When the origin is revealed as false, the essence is corrupted.
  *   **Why it fits:** It explains *why* the information matters. If we were pure empiricists, the chemical composition of the wine would be all that matters. Because we are essentialists, the history is part of the substance.
  *   **Where it falls short:** Essentialism explains the devaluation, but not necessarily the sensory distortion.

  ### The Coinage: "Aesthetic Backfilling"

  Since no existing term captures the specific *temporal retroactivity* of sensory experience based on provenance, I propose you use the term **Aesthetic Backfilling**.

  **Definition:** *Aesthetic Backfilling* is the cognitive process whereby new information about an object's origin or history causes an observer to unconsciously revise their remembered sensory experience of that object, aligning past qualia with current knowledge.

  Unlike "hindsight bias" (which is about predicting outcomes), Aesthetic Backfilling is about **sensory revision**. Unlike "cognitive penetration" (which is about present perception), Aesthetic Backfilling explicitly claims the **past experience is rewritten**.

  ### Boundary Cases: Where the Carving Stops

  To test the utility of this term, let's run it through the boundary cases you requested. This will help you define the limits of the phenomenon for your readers.

  **1. The Moral Boundary (Artist Crimes vs. Origin)**
  *   *Scenario:* You learn the painting is genuine, but the artist was a violent criminal.
  *   *Does Backfilling occur?* **Generally, No.**
  *   *Why:* This distinguishes *Essentialism* from *Moral Contagion*. When people learn an artist is a criminal, they often say, "I can't look at this anymore," or "It feels tainted." They rarely say, "The brushstrokes look clumsy now." The moral flaw is external to the aesthetic capacity. Aesthetic Backfilling requires the new information to undermine the *competence* or *authenticity* of the production, not the morality of the producer.
  *   *The Carve:* Backfilling applies to **capacity/origin**, not **character**.

  **2. The Medium Boundary (Music and Performance)**
  *   *Scenario:* You learn a "live" album was heavily studio-touched, or a violinist lip-synced.
  *   *Does Backfilling occur?* **Yes.**
  *   *Why:* Listeners often report that upon learning a performance was fake, the "energy" or "emotion" of the music vanishes from their memory of it. They hear the applause as "canned" in their head.
  *   *The Carve:* This proves the phenomenon does not require a unique physical object (like a canvas). It requires a **narrative of production**. If the narrative shifts from "human effort" to "mechanical trick," Backfilling occurs.

  **3. The Valence Boundary (The Reverse Effect)**
  *   *Scenario:* You are told a $10 bottle of wine is actually a rare vintage mislabeled by the shop.
  *   *Does Backfilling occur?* **Yes.**
  *   *Why:* This is well-documented in neuroeconomics. In a famous fMRI study by Plassmann et al. (2008), subjects tasted the *same* wine twice. When told it was expensive, activity increased in the orbitofrontal cortex (associated with pleasure), and they reported it tasted better.
  *   *The Carve:* Aesthetic Backfilling is **bidirectional**. It is not just a "negativity bias"; it is an alignment mechanism. We backfill to match the *significance* of the object.

  **4. The Temporal Boundary (How far back does it reach?)**
  *   *Scenario:* You loved a painting 20 years ago. You learn today it is a forgery. Do you remember loving it 20 years ago?
  *   *Does Backfilling occur?* **Yes, but with friction.**
  *   *Why:* Because memory is reconstructed *now*, the 20-year-old memory is vulnerable to today's information. However, if there is strong corroborating evidence of the past experience (e.g., a diary entry you wrote saying "This masterpiece moved me to tears"), the Backfilling may be blocked.
  *   *The Carve:* Backfilling requires **malleable memory**. If the past experience is "crystallized" by external records, the effect weakens.

  ### Why This Matters for Your Story

  The reason this phenomenon feels so unsettling to your subjects (and your readers) is that it violates our intuition about the stability of reality. We assume our senses are a direct interface with the world. Aesthetic Backfilling reveals that our sensory history is a **collaboration between the object and the story we tell about it.**

  When the story changes, the brain does not simply update a file labeled "Value." It updates the file labeled "Experience." The collectors aren't lying to save face; their brains are efficiently minimizing cognitive dissonance. To admit "I loved a fake" is to admit a failure of expertise. To remember "It was always clumsy" preserves the self-concept of the expert.

  **Summary for your piece:**
  *   **The Mechanism:** Reconstructive Memory + Cognitive Penetration.
  *   **The Driver:** Psychological Essentialism (history is part of the substance).
  *   **The Term:** **Aesthetic Backfilling**.
  *   **The Limit:** It applies to judgments of *authenticity/capacity*, not *morality*, and it works in both positive and negative directions.

  This framing allows you to move past the "fraud" aspect and into the much more interesting territory of how human perception is fundamentally narrative-dependent.
