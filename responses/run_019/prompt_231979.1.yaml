      *   *Testing:* Maybe he'd admit *some* standardization is needed for "Precision"? (Unlikely, he distinguishes internal vs. external standards). I need to flag that a "Pragmatic Whiteheadian" might accept low-stakes diagnostics, but high-stakes is the dealbreaker.

