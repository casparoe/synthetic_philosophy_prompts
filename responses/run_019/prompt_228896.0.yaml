answer: |-
  Your gut is right. The reread case is where the bodies are buried.

  To answer your first question: **No, these are not the same puzzle.** They look like cousins, but they have different DNA.

  The first puzzle (crying for fake people) is about **existence**. It asks: *How can I feel this when the object isn't real?*
  The second puzzle (tension on a reread) is about **uncertainty**. It asks: *How can I feel this when the outcome is certain?*

  A solution that fixes the first one doesn't automatically fix the second. In fact, the most popular solution to the first one faceplants spectacularly on the second.

  ### The Big Faceplant: "Suspension of Disbelief"
  The oldest explanation is that when you read, you temporarily pretend the story is real. You "suspend your disbelief." You trick yourself into thinking these people exist.

  This works okay for the first puzzle. It explains why you cry: for a few hours, your brain bought the lie.

  But on a reread? It's dead in the water. You cannot suspend your disbelief about the ending when you *remember* the ending. You know the heroine lives. You know the bomb doesn't go off. No amount of "pretending" erases your memory. If suspense required you to be tricked into thinking the outcome was unknown, rereading would be boring. It isn't. So, any theory that relies on **ignorance** or **illusion** fails the reread test.

  ### The Second Faceplant: "Make-Believe"
  Another theory says you're playing a game of make-believe. Your fear is a "quasi-fear," like a child pretending to be scared of a monster. It feels like fear, but it's not *real* fear.

  This struggles with the reread because reread suspense feels involuntary. You don't *decide* to be tense on page 200. It happens to you. If it were just a game of make-believe, knowing the ending should let you turn the emotion off. But you can't. The pulse still races. The "it's just a game" theory makes the emotion feel too cheap to account for the physical reality of the tension.

  ### The Survivor: "Desire and Simulation"
  So, what actually works? The theories that separate **emotion** from **belief**.

  Your brain doesn't need to believe something is *true* to react to it; it just needs to care about it. This solves the "fake people" puzzle (I don't need to believe they exist to feel sad about their pain).

  But for the reread, we need one more ingredient: **Simulation.**

  When you read a scene for the third time, you aren't simulating *your own* uncertainty. You are simulating the *character's* uncertainty. You know she survives, but *she* doesn't. You are tethered to her perspective. Your brain mirrors her adrenaline, not your own.

  However, the real key is **Desire**.
  Suspense isn't actually about "What will happen?" (Probability).
  Suspense is about "I need this to happen!" (Preference).

  On a reread, the question shifts. It's no longer "Will she survive?" It becomes "Watch her survive *this*." The tension comes from the gap between what you **want** (her safety) and what you **see** (her danger). Even if you know the bridge holds, watching the plank crack triggers a visceral "NO!" because your desire for her safety clashes with the immediate threat.

  ### The Verdict for a Novelist
  Here is the gut-level takeaway:

  The "why we cry" puzzle is solved by realizing emotions don't require facts.
  The "why we reread" puzzle is solved by realizing suspense isn't about surprise; it's about **investment**.

  If you write for surprise, your book dies after one read. If you write for investment, your book lives forever. The rereaders aren't tense because they doubt the outcome. They're tense because they are re-experiencing the *cost* of that outcome. They know the price, and they are watching the character pay it again.

  So, to answer your specific worry: The theories that rely on **tricking the reader** (illusion, suspension of disbelief) are the ones that bury the bodies. They can't explain why we come back to the graveyard. The theories that rely on **connection** (desire, simulation, empathy) are the ones that keep the pulse beating.

  You aren't selling uncertainty. You're selling care. As long as they care, they'll sweat, even if they know the ending.
