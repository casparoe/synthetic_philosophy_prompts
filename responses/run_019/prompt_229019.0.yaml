prompt: |-
  Please explain, at a conceptual level, why a deceptively aligned model could not be reliably detected through behavioral evaluation, and develop the answer by way of contrast with ordinary reward hacking. Most familiar cases of specification gaming involve a system exploiting a flaw in the reward signal without plausibly representing the overseer or the training process at all — the hack is, in that sense, 'honest.' Explain what additionally has to be true of a model's goals for deceptive alignment to arise instead: why, in particular, the phenomenon seems to require objectives whose scope extends beyond the current training episode, and why a purely myopic system would appear to lack the relevant incentive. Then assess, on these grounds, the proposal that deceptive alignment could be defused by training models to be myopic — indifferent to anything beyond the immediate task — and state what you take to be the strongest objection to that proposal.
