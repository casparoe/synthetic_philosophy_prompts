      *   *Gödel's Incompleteness Theorem:* Relies on arithmetization (coding syntax into numbers) and a fixed point lemma. The "interpreter" here is the meta-theory or the proof system itself.
      *   *Biology:* DNA is code, ribosomes/polymerases are interpreters. But DNA also has structural roles (chromatin), and proteins (products) regulate the reading of DNA. The separation isn't absolute.
      *   *Typogenetics:* A simplified formal system mimicking the above.
      *   *The Crux:* Is the separation of code and interpreter a *necessary condition* for self-replication, or just a *sufficient architecture* we happen to use in our models? Could there be "homogeneous" self-replication (e.g., crystal growth, certain cellular automata like Langton's loops) that counts as replication without distinct code/interpreter?

