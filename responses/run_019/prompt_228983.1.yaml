  *Drafting thought:* The "bullet biting" for Elena: She might have to admit that for *them*, it's not bad, but the sensation type is generally bad. Or she argues the sensation *is* different. Let's go with the latter: she claims the "hurt" is a phenomenal property that is missing in asymbolia, despite their verbal reports.

