answer: |-
  # Game Title: The Standard War

  **Objective:** To simulate how historical accidents, increasing returns, and switching costs can lock a group into a suboptimal equilibrium, creating a sense of inevitability around a contingent outcome.
  **Time:** 75 Minutes (10 min setup, 20 min play, 45 min debrief).
  **Class Size:** 20 Students.
  **Materials:** Index cards (2 per student), whiteboard/markers, small candy/extra credit tokens.

  ---

  ## Part 1: Setup & Rules (10 Minutes)

  **1. Distribution:**
  Hand each student two index cards. On one, they write a large **"A"**. On the other, a large **"B"**.

  **2. The Narrative:**
  Tell the class: *"You are firms choosing a technology standard for a new industry. You will play 5 rounds. In each round, you must commit to either Standard A or Standard B. Your goal is to maximize your individual points. The top three scorers receive extra credit (or candy)."*

  **3. The Payoff Structure (Write on Board):**
  Explain that points are calculated **per round** based on three factors. Be precise; strategic play depends on this.

  *   **Network Benefit:** Points equal to the number of students who choose your standard **this round**.
  *   **Installed Base:** Points equal to **2 $\times$** the total number of students who have chosen your standard in **all previous rounds combined**.
      *   *(Note: This creates increasing returns. The more history a standard has, the heavier its advantage.)*
  *   **Quality Multiplier:**
      *   **Standard A:** 1.0$\times$ multiplier on Network Benefit.
      *   **Standard B:** 1.5$\times$ multiplier on Network Benefit.
      *   *(Note: B is objectively superior technology.)*
  *   **Switching Cost:** If you choose a different letter than you did in the **immediately preceding round**, subtract **5 points** from your total score for that round.
      *   *(Note: In Round 1, there is no switching cost.)*

  **4. The "Accident" (Crucial Asymmetry):**
  Do not tell them this yet. In Round 1, you will force a quick decision to generate random noise.
  *"For Round 1, you have only 5 seconds to decide. History suggests speed matters in new markets. Choose now."*
  *(Count down loudly. 5... 4... 3... 2... 1... Cards up!)*

  ---

  ## Part 2: Gameplay (20 Minutes)

  **1. Tracking:**
  Draw two columns on the whiteboard: **Total History A** and **Total History B**.
  After each round, count the hands/cards and update the cumulative totals.

  **2. The Rounds:**
  *   **Round 1:** Quick vote (5 seconds). Record counts. Students calculate Round 1 score (Network + 0 History - 0 Switch).
  *   **Round 2:** Give them 30 seconds to strategize. Remind them B has a better multiplier, but A might have a history lead. Record counts. Update History totals. Students calculate scores (remember Switching Cost if they change).
  *   **Round 3-5:** Repeat. Reduce deliberation time slightly each round to increase pressure.
      *   *Instructor Role:* Act as a neutral scorekeeper. Do not hint at which is better. If they ask, repeat the rules. If they ask "Which should we pick?", say "That is the strategic problem."

  **3. The Lock-In Moment:**
  By Round 3 or 4, one standard will likely dominate. Even if it is Standard A (the inferior one), the "Installed Base" points will outweigh the "Quality Multiplier" of B, and the Switching Cost will punish defectors.
  *   *Observation:* Watch for students sighing, shaking heads, or laughing resignedly as they raise the "A" card despite knowing "B" is better.

  **4. Final Tally:**
  Collect total scores. Award prizes. Ask for a show of hands: "Who ended up with the standard they *wanted* to have at the start of Round 5?" (Few will raise hands).

  ---

  ## Part 3: The Debrief (45 Minutes)

  *Do not use the term "Path Dependence" until the middle of this section.*

  ### Phase 1: Phenomenology (10 mins)
  **Goal:** Elicit the feeling of contingency turning into inevitability.
  *   **Ask:** "In Round 1, was the outcome determined?" (Expected: No, it was random/rushed).
  *   **Ask:** "In Round 5, did you feel you had a choice?" (Expected: No, it was too costly to switch).
  *   **Ask:** "Who knew B was better but chose A anyway? Why?"
  *   **Point:** Highlight the shift in their experience. Ex ante (before the game), anything was possible. Ex post (after Round 3), the outcome felt necessary.

  ### Phase 2: Mapping Mechanics to Theory (20 mins)
  **Goal:** Introduce terminology and map it to the game events.
  Now, write **PATH DEPENDENCE** on the board.

  1.  **Multiple Equilibria:**
      *   *Concept:* The game could have ended with everyone on A or everyone on B. Both are stable states.
      *   *Game Moment:* Round 1. If the 5-second vote had flipped 11-9 the other way, B likely would have locked in.
  2.  **Increasing Returns (Network Effects):**
      *   *Concept:* The value of a choice increases as more people adopt it.
      *   *Game Moment:* The "Installed Base" rule. The lead didn't just stay constant; it compounded.
  3.  **Switching Costs:**
      *   *Concept:* Barriers to exit reinforce the current path.
      *   *Game Moment:* The 5-point penalty. Even when the group realized B was better, the individual cost of switching was too high relative to the marginal gain.
  4.  **The Gap (Contingency vs. Inevitability):**
      *   *Concept:* Small, random events early on (the 5-second vote) determine large-scale outcomes later.
      *   *Game Moment:* The "Accident" of Round 1. A difference of one or two students created a trajectory that became irreversible.

  ### Phase 3: Failure Modes & Strategy (10 mins)
  **Goal:** Discuss what went wrong and how rational actors handle this.
  *   **Failure Mode 1: Premature Coordination.**
      *   *Discussion:* Did anyone try to shout "Everyone pick B!" in Round 1?
      *   *Lesson:* In real markets, communication is often limited or costly. If you can't coordinate ex ante, you drift into lock-in.
  *   **Failure Mode 2: The Switching Trap.**
      *   *Discussion:* Could you have switched as a group in Round 3?
      *   *Lesson:* Collective rationality (switch to B) vs. Individual rationality (stay on A to avoid the 5-point penalty and loss of Installed Base). This illustrates why inefficient standards persist even when everyone knows they are inefficient.
  *   **Handling It:**
      *   *Solution:* Requires an external shock (instructor changes rules) or a subsidy (instructor pays the switching cost). This maps to policy interventions or antitrust actions.

  ### Phase 4: Limitations of the Model (5 mins)
  **Goal:** Prevent over-generalization.
  State clearly what the game *cannot* reproduce:
  1.  **Timescales:** Real path dependence happens over decades (e.g., QWERTY, railroad gauges). We compressed this into 20 minutes. The psychological pressure is different.
  2.  **Counterfactuals:** In history, we cannot rerun the tape. In this game, you know you *could* have chosen differently in Round 1. In real history, we only see the one path that occurred, making it harder to identify the contingency.
  3.  **Complexity:** Real standards involve engineering constraints, politics, and culture, not just point maximization.

  **Closing Statement:**
  *"Today you felt the weight of history. You made a choice in Round 5 not because it was the best choice in a vacuum, but because it was the only choice your past selves left you. That is the essence of path dependence: the past constrains the future, turning accidents into institutions."*
