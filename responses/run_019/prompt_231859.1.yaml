          *   Overclaimed: That the experiment settles the ontology of information (whether it is "real" or just descriptive).
          *   The condition: Applicants must frame results as validating the *framework* of information thermodynamics, not proving the *ontology* of information.
          *   *Drafting thought:* Focus on the distinction between operational utility and metaphysical status.

      *   **5. The strongest case for the alternative decision (~200 words):**
          *   Alternative: Reject.
