  **(Self-Correction on Hume):** Actually, looking closely at the quote: "if both the causes and effects be indifferent to us." Hume is saying: Reason tells you A causes B. If you don't care about A or B, reason doesn't motivate you. If you *do* care (passion), reason helps you get it.
