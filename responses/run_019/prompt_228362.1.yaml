prompt: |-
  I run the data team for a small policy institute, and we maintain a database of “counterfactual case files”: each file starts from a real event and then describes one or two alternatives, such as a different person winning an election, a different chemical being stored in a tank, or a defendant having a different prior record. We constantly have to decide whether two expressions pick out the same thing across the actual file and the counterfactual one. For example, does “the mayor” in the alternative still refer to the actual mayor, or just to whoever is mayor there? If an analyst writes “Jordan Lee” rather than “the whistleblower,” does that settle the issue? And if we discover that two aliases belong to one person, how should the database represent the fact that this was empirically learned but, once true, seems to hold in every relevant scenario?

  Please turn the philosophy of rigid designation and the necessary a posteriori into a procedure my analysts can follow without knowing that literature. I want ordered steps, tests they can apply to names, aliases, definite descriptions, role terms, natural-kind terms, organizations, and documents; rules for when an expression may be linked across scenarios and when it must be marked “role occupant only”; and guidance for recording genuinely empirical identity claims without treating every database join as metaphysically necessary. Make it usable in about fifteen minutes per case, with explicit stop points and with places where human judgment is unavoidable rather than pretending the checklist settles everything.

  Apply the procedure to three hard cases: an alternate election file containing both “the candidate who won” and the actual winner’s name; a chemical-safety file in which “the solvent in Tank 4” is later identified as acetone; and a company-merger file where the post-merger firm keeps the old name, most staff, and one legal registration but changes ownership. Include at least one case where the procedure blocks a link that our analysts will find narratively obvious but that is not philosophically justified. Also say which distinctions from the theory have to survive the simplification, which can safely be dropped for our purposes, and how hte procedure might misfire if someone treats “same label” as automatically meaning “same entity.”
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Data team lead at a small policy institute.
      *   **Task:** Create a practical procedure for analysts to decide if expressions refer to the same entity across actual and counterfactual case files (database linking).
      *   **Theoretical Basis:** Philosophy of rigid designation (Kripke) and necessary a posteriori (Kripke/Putnam), but *translated* into plain language/procedure (no jargon).
      *   **Requirements:**
          *   Ordered steps/tests for various term types (names, aliases, descriptions, roles, natural kinds, orgs, docs).
          *   Rules for linking vs. marking "role occupant only."
          *   Guidance on empirical identity claims (learned facts vs. necessary truths).
          *   Time limit: ~15 minutes per case.
          *   Explicit stop points & acknowledgment of unavoidable human judgment.
          *   Application to three hard cases (Election, Chemical, Merger).
          *   One case where the procedure *blocks* a narratively obvious link (philosophical rigor).
          *   Reflection on which theoretical distinctions survive simplification and potential failure modes (e.g., "same label = same entity").

  2.  **Deconstruct the Theory for Practice:**
      *   *Rigid Designation:* A term refers to the same object in all possible worlds where that object exists. (Proper names are usually rigid; definite descriptions are usually not).
      *   *Non-Rigid (Flaccid) Designation:* A term refers to whoever/whatever fits the description in that world. ("The President" refers to Biden in actuality, but maybe Trump in a counterfactual).
      *   *Necessary A Posteriori:* Identities discovered empirically (e.g., "Water is H2O", "Hesperus is Phosphorus") are necessary once true. If $A=B$ in reality, $A=B$ in all counterfactuals where $A$ exists.
      *   *Translation:*
          *   Rigid $\rightarrow$ "Sticky Label" (Stays with the specific thing).
          *   Non-Rigid $\rightarrow$ "Slot Filler" (Stays with the role/definition).
          *   Necessary A Posteriori $\rightarrow$ "Verified Identity" (Once proven, treat as Sticky).

  3.  **Drafting the Procedure (The "Entity Linking Protocol"):**
      *   *Goal:* Make it actionable. Use a flowchart logic.
      *   *Step 1: Categorize the Term.* Is it a Name, Description, Role, or Kind?
      *   *Step 2: The "Swap Test".* If the world changes, does the label stick to the *object* or the *job*?
      *   *Step 3: Empirical Verification.* Have we proven $A=B$? If so, lock it.
      *   *Step 4: Counterfactual Consistency.* Does the alternative scenario explicitly change the identity?
      *   *Decision:* Link (Same ID) vs. Role-Only (Different ID, Same Role).

  4.  **Developing the Three Hard Cases:**
      *   *Case 1: Election.* "The candidate who won" vs. "Jane Doe".
          *   "Jane Doe" is a Sticky Label (Rigid).
          *   "The candidate who won" is a Slot Filler (Non-rigid).
          *   *Conflict:* In the counterfactual, Jane Doe loses. "The candidate who won" is now John Smith.
          *   *Result:* Do not link "The candidate who won" across files. Link "Jane Doe" across files.
      *   *Case 2: Chemical.* "Solvent in Tank 4" $\rightarrow$ "Acetone".
          *   "Solvent in Tank 4" is a Slot Filler (could be anything).
          *   "Acetone" is a Natural Kind (Sticky Label).
          *   *Empirical Identity:* We found out it *is* Acetone.
          *   *Result:* Once verified, link "Solvent in Tank 4" (in the actual file) to "Acetone". In counterfactuals where the tank contains Methanol, "Solvent in Tank 4" $\neq$ "Acetone".
      *   *Case 3: Merger.* OldCo becomes NewCo. Same name, staff, registration, diff ownership.
          *   This is the "Ship of Theseus" / Organizational Identity problem.
          *   *Decision:* This needs a specific rule on Legal Registration vs. Operational Continuity.
          *   *Constraint:* I need one case where the procedure *blocks* a link analysts want. The Merger case is good for this. Analysts want to say "It's the same company." The procedure might say "Legal registration changed" or "Ownership defines the entity." Let's make the procedure strict on Legal Registration to block the link, forcing them to treat it as a successor entity.

  5.  **Refining the "Blocked Link" Requirement:**
      *   The prompt asks for *at least one case where the procedure blocks a link that analysts will find narratively obvious but is not philosophically justified.*
      *   *Idea:* In the Election case, analysts might want to link "The Winner" in Actual to "The Winner" in Counterfactual because it's the same *role*. But philosophically, they are different *people*. The procedure must force them to separate the *Role* from the *Person*.
      *   *Better Idea:* The Chemical case. Analysts might think "The solvent in Tank 4" is the same entity across all files because it's the same *tank*. But if the counterfactual changes the chemical, the *substance* is different. "Acetone" is rigid. "Solvent in Tank 4" is not. If the counterfactual says "Tank 4 held Benzene," linking "Acetone" to "Solvent in Tank 4" in the counterfactual is wrong.
      *   *Best Idea for "Blocked Link":* Let's use the Merger case. Analysts see "Same Name, Same Staff." They want to link OldCo and NewCo as Entity ID #123. The procedure (based on rigid designation of legal incorporation) should force them to create Entity ID #124 (Successor) and link via a "Successor Of" relation, not "Same As." This mirrors the distinction between contingent properties (staff, name) and essential properties (legal registration).

  6.  **Addressing Theory Simplification:**
      *   *Keep:* Rigid vs. Non-Rigid (Sticky vs. Slot), Empirical Identity (Verified = Necessary).
      *   *Drop:* Possible Worlds semantics, Intensional vs. Extensional logic, Causal Theory of Reference details (just use "Source of Naming").
      *   *Risk:* "Same Label = Same Entity." (The "Morning Star/Evening Star" problem). Need a warning against this.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, operational, clear.
      *   *Structure:*
          1.  Introduction (The "Why").
          2.  The Protocol (Steps 1-5).
          3.  The Decision Matrix (Link vs. Role).
          4.  Application to Cases.
          5.  Theoretical Trade-offs & Risks.
      *   *Time Check:* 15 minutes. Steps need to be quick.
      *   *Judgment Calls:* Explicitly mark where the analyst must decide (e.g., "Is this name a nickname or a role?").

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Merger case clear enough?
      *   *Fix:* Ensure the distinction between "Legal Entity" (Rigid) and "Brand/Operation" (Non-rigid) is clear in the procedure.
      *   *Critique:* Did I explain "Necessary A Posteriori" without jargon?
      *   *Fix:* Call it "Verified Identity Lock." Once we know $A=B$, we treat them as the same in all files *unless* the counterfactual explicitly breaks the physics/history that makes them identical.
      *   *Critique:* Is the "Blocked Link" explicit?
      *   *Fix:* In the Merger case, explicitly state: "Analysts often want to link these. The procedure forbids it."

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Ordered steps? Yes.
      *   Tests for specific term types? Yes.
      *   Rules for linking vs. role occupant? Yes.
      *   Guidance on empirical identity? Yes.
      *   15 mins/case? Yes (keep steps concise).
      *   Stop points/Judgment calls? Yes.
      *   3 Hard Cases applied? Yes.
      *   Blocked link included? Yes.
      *   Theory simplification discussion? Yes.
      *   "Same label" warning? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  # The Entity Linking Protocol (ELP)
  **For:** Policy Institute Data Team  
  **Purpose:** To determine if a term in a *Counterfactual File* refers to the same specific entity as a term in the *Actual File*.  
  **Time Budget:** 15 Minutes per Case  
  **Core Principle:** Distinguish between **Sticky Labels** (names that stay with the specific thing) and **Slot Fillers** (descriptions that stay with the job or definition).

  ---

  ## Part 1: The Procedure

  ### Step 1: Categorize the Term (2 Minutes)
  Look at the expression in question. Assign it one of four tags. If unsure, mark **JUDGMENT CALL** and proceed to Step 2.

  1.  **Proper Name:** A specific label given at birth, incorporation, or discovery (e.g., "Jordan Lee," "Acme Corp," "Acetone").
      *   *Default:* **Sticky Label**.
  2.  **Definite Description:** A phrase describing features or location (e.g., "the solvent in Tank 4," "the building on 5th St").
      *   *Default:* **Slot Filler**.
  3.  **Role/Title:** A function that can be held by different people/entities over time (e.g., "the Mayor," "the CEO," "the whistleblower").
      *   *Default:* **Slot Filler**.
  4.  **Natural Kind:** A substance or species defined by underlying structure, not just appearance (e.g., "gold," "water," "tiger").
      *   *Default:* **Sticky Label**.

  ### Step 2: The "Swap Test" (3 Minutes)
  Imagine the counterfactual scenario changes *only* the outcome of the event, keeping the background world as similar as possible. Ask: **Does this term travel with the object or the definition?**

  *   **Test A (The Name Test):** If "Jordan Lee" loses the election, is "Jordan Lee" still Jordan Lee?
      *   *Yes:* It is a **Sticky Label**.
  *   **Test B (The Role Test):** If "Jordan Lee" loses, is "the Winner" still Jordan Lee?
      *   *No:* "The Winner" is a **Slot Filler**. It now refers to the opponent.
  *   **Test C (The Substance Test):** If the liquid in the tank is clear and smells like alcohol but is chemically Methanol, is it still "Acetone"?
      *   *No:* "Acetone" is a **Sticky Label**. "The solvent" is a **Slot Filler**.

  **STOP POINT 1:** If the term is a **Slot Filler**, do **not** link it to a specific entity ID across files unless Step 3 applies. Mark it as `ROLE_OCCUPANT_ONLY`.

  ### Step 3: The Empirical Lock (Verified Identity) (5 Minutes)
  *Applies when you have discovered that Term A = Term B in the Actual File (e.g., "The Informant" is "Jordan Lee").*

  1.  **Verify Source:** Is this identity based on empirical evidence (documents, lab tests, testimony) or just a narrative assumption?
      *   *Narrative:* Treat as contingent. Do not lock.
      *   *Empirical:* Proceed to 2.
  2.  **Check Counterfactual Constraints:** Does the counterfactual scenario explicitly break the physical or historical chain that makes A = B?
      *   *Example:* If "Water = H2O" in reality, but the counterfactual posits a world where "Water = XYZ," you must respect the counterfactual's physics *if* that is the point of the simulation.
      *   *Standard Policy Case:* Usually, we assume physics/history holds unless changed.
  3.  **Apply Lock:** If empirically verified and not explicitly broken by the scenario, treat A and B as the **Same ID** in all files. This is a **Verified Identity**.

  **STOP POINT 2:** If the counterfactual explicitly changes the origin or composition (e.g., "In this scenario, Acme Corp was incorporated in Delaware, not NY"), you **must** create a new Entity ID. Do not let empirical locks override explicit scenario parameters.

  ### Step 4: Organizational & Document Continuity (3 Minutes)
  Organizations and documents are hybrid cases. Use this hierarchy to decide if they are the **Same ID** or a **Successor ID**.

  1.  **Legal Registration/Tax ID:** If this changes, it is a **New Entity**. (Sticky Label is the Registration Number, not the Name).
  2.  **Physical Continuity:** If the registration is the same but all staff/assets change, it is the **Same Entity**.
  3.  **Documents:** A document is identified by its *generation event*, not its content.
      *   *Same ID:* The exact same physical/digital file.
      *   *New ID:* A revised version, even if 99% identical.

  ### Step 5: Final Link Decision (2 Minutes)
  *   **LINK (Same Entity ID):** Term is a Sticky Label OR Verified Identity AND counterfactual does not break the link.
  *   **NO LINK (New Entity ID):** Term is a Slot Filler OR Legal Registration changed OR Counterfactual explicitly alters the identity conditions.
  *   **RELATIONAL LINK:** If NO LINK, but there is a connection (e.g., Successor, Role-Holder), record the relationship type (e.g., `SUCCEEDS`, `HOLDS_ROLE`).

  ---

  ## Part 2: Application to Hard Cases

  ### Case 1: The Alternate Election
  **Scenario:** Actual File: Jane Doe wins. Counterfactual File: John Smith wins.
  **Terms:** "Jane Doe" vs. "The Candidate Who Won."

  1.  **Categorize:** "Jane Doe" = Proper Name (Sticky). "The Candidate Who Won" = Role (Slot Filler).
  2.  **Swap Test:** In the Counterfactual, does "Jane Doe" refer to Jane? Yes. Does "The Candidate Who Won" refer to Jane? No, it refers to John.
  3.  **Decision:**
      *   Link "Jane Doe" in Actual to "Jane Doe" in Counterfactual (Same Person ID).
      *   **DO NOT LINK** "The Candidate Who Won" in Actual to "The Candidate Who Won" in Counterfactual.
      *   *Action:* Assign `PERSON_ID_101` to Jane in both. Assign `ROLE_WINNER_ACTUAL` to Jane in File A, and `ROLE_WINNER_CF` to John in File B.
  4.  **Analyst Friction:** Analysts will want to link "The Winner" across files to compare "Winner Policies."
      *   *Correction:* Link the *Role*, not the *Entity*. Query the database for `Role = Winner`, not `Entity = Winner`.

  ### Case 2: The Chemical Safety File
  **Scenario:** Actual File: Tank 4 leaks. Lab reports identify contents as Acetone. Counterfactual File: Tank 4 leaks, but maintenance log says it contained "Industrial Solvent X" (a proprietary mix).
  **Terms:** "The Solvent in Tank 4" vs. "Acetone."

  1.  **Categorize:** "Acetone" = Natural Kind (Sticky). "The Solvent in Tank 4" = Definite Description (Slot Filler).
  2.  **Empirical Lock:** In Actual File, we verified "Solvent in Tank 4" = "Acetone."
      *   *Lock Applied:* In Actual File, tag both with `SUBSTANCE_ID_Acetone`.
  3.  **Counterfactual Check:** The Counterfactual specifies "Industrial Solvent X."
      *   *Constraint:* Does "Industrial Solvent X" = Acetone? No.
      *   *Result:* In Counterfactual File, "The Solvent in Tank 4" links to `SUBSTANCE_ID_SolventX`.
  4.  **Decision:** Do not carry the Actual File's empirical lock into the Counterfactual if the scenario explicitly changes the tank's contents.
      *   *Action:* `SUBSTANCE_ID_Acetone` exists in both databases as a concept, but is linked to Tank 4 *only* in the Actual File.

  ### Case 3: The Company Merger (The "Blocked Link" Case)
  **Scenario:** Actual File: "OldCo" merges with "BigCorp." The resulting firm operates under the name "OldCo," keeps 90% of staff, and stays in the same building. However, the legal registration is dissolved and re-issued under a new Tax ID owned by BigCorp.
  **Terms:** "OldCo" (Pre-merger) vs. "OldCo" (Post-merger).

  1.  **Categorize:** "OldCo" = Organization Name.
  2.  **Continuity Hierarchy (Step 4):**
      *   Name: Same.
      *   Staff/Assets: Mostly Same.
      *   **Legal Registration:** **Different.**
  3.  **Decision:** **BLOCK LINK.**
      *   *Procedure:* You must assign `ORG_ID_OldCo_Pre` and `ORG_ID_OldCo_Post`.
      *   *Relation:* Link them with `SUCCEEDS` or `LEGAL_SUCCESSOR`.
  4.  **Why this blocks intuition:** Analysts will argue, "It's the same people, same name, same office. Obviously it's the same company."
      *   *Philosophical Justification:* Legal incorporation is the **rigid designator** for corporate identity in policy analysis. Name and staff are contingent properties. If we link them as the same ID, we cannot track liability or regulatory status changes that hinge on the legal reset.
      *   *Action:* Force the split. Allow queries to group them via the `SUCCEEDS` relation, but do not merge the IDs.

  ---

  ## Part 3: Theoretical Trade-Offs & Risks

  ### What Survives Simplification
  1.  **Rigidity (Sticky vs. Slot):** This is the most critical distinction. It prevents the database from conflating *who someone is* with *what job they hold*. This must remain strict.
  2.  **Necessary A Posteriori (Verified Identity Lock):** The idea that empirical discoveries (Water is H2O) become fixed rules for the database is essential for consistency. Once we know two IDs are the same person, they must remain the same person across all files *unless* the scenario explicitly rewrites history.
  3.  **Essential Properties:** The procedure retains the idea that some properties define the thing (Legal ID, Chemical Structure) while others describe it (Location, Job Title).

  ### What Can Be Dropped
  1.  **Causal Chains of Reference:** We do not need analysts to trace the historical "baptism" of a name back to its origin. We only need to know if the name is currently used as a rigid label or a description.
  2.  **Possible Worlds Semantics:** Analysts do not need to worry about "transworld identity" metaphysics. They only need to compare File A to File B.
  3.  **De Re vs. De Dicto:** We simplify this into "Link Entity" vs. "Link Role."

  ### Failure Mode: The "Same Label" Trap
  **Risk:** Analysts treat "Same Label = Same Entity."
  **Example:** There are two men named "Jordan Lee" in the database. One is a whistleblower in Washington; one is a baker in London.
  **Procedure Fix:** Step 1 requires checking context. If the context (location, role, history) differs, the Label is ambiguous.
  **Instruction:** If two entities share a Proper Name but have different `CONTEXT_ID`s (e.g., different cities, birthdates), they are **not** linked. The name is not a unique key; `Name + Context` is the key.

  ### Failure Mode: The "Narrative Obviousness" Trap
  **Risk:** As seen in the Merger Case, analysts prioritize operational continuity over legal/essential identity.
  **Procedure Fix:** Step 4 (Hierarchy). The procedure forces the "Legal Registration" check *before* the "Staff/Name" check.
  **Instruction:** If the procedure says "New ID," you cannot override it with a note saying "Basically the same." You must use the `SUCCEEDS` relation tag to capture the similarity without corrupting the identity logic.

  ### Human Judgment Stop Points
  The procedure cannot automate the following. Analysts must pause and consult a senior lead if:
  1.  **Ambiguous Names:** A term could be a nickname (Sticky) or a role (Slot). (e.g., "The Boss").
  2.  **Partial Empirical Locks:** Evidence suggests A=B, but is not conclusive (e.g., "Likely the same whistleblower"). *Rule: Treat as separate IDs linked by `LIKELY_SAME` until proven.*
  3.  **Counterfactual Physics:** The scenario implies changes to natural kinds (e.g., "A world where gold is not conductive"). *Rule: Defer to Scenario Designer on whether to maintain Standard Physics.*

  ---

  **End of Protocol.**
  *Print this sheet. Keep it next to the data entry terminal. If a case takes longer than 15 minutes, flag it for senior review.*
