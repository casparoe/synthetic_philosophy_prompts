answer: |-
  Your instincts are quite sharp; whilst your friend is not entirely off the mark, his summary conflates several distinct technical concepts and glosses over the specific conditions that make the theorem work. It is a classic case of someone who knows the folklore of a result but has become a bit sloppy with the formal details.

  Here is a claim-by-claim breakdown of where he is accurate, where he is simplifying, and where he is genuinely mistaken.

  ### 1. The Claim on Evidence and Priors
  **Friend's Claim:** *"If both are Bayesians and they update on the same evidence, their posteriors must coincide."*

  **Verdict:** **Incorrect.**

  This is the most significant technical error in his summary. Aumann's theorem does **not** require agents to update on the *same* evidence. In fact, the theorem is trivial if they have the same evidence; if two agents start with the same prior and see the exact same data, standard Bayesian updating dictates they will have the same posterior. That requires no theorem.

  The power of Aumann's (1976) result is that it allows agents to have **different private information** (different partitions of the state space). The theorem states that even if they have seen different things, they cannot *agree to disagree* provided their posteriors become **common knowledge**. Your friend has conflated "common priors" (which is a requirement) with "common evidence" (which is not).

  ### 2. The Claim on Persistent Disagreement
  **Friend's Claim:** *"Persistent disagreement between rational people is simply impossible."*

  **Verdict:** **Defensible Simplification (with caveats).**

  Strictly speaking, within the closed system of the model, he is right: if the conditions are met, disagreement is impossible. However, stating it as a general fact about "rational people" is misleading. The conditions (specifically common knowledge of posteriors) are incredibly demanding. In the real world, we rarely achieve common knowledge. Therefore, persistent disagreement is theoretically possible for rational agents simply because the "common knowledge" condition has not been satisfied. It is more accurate to say: *"Persistent disagreement is incompatible with common knowledge of posteriors amongst agents with common priors."*

  ### 3. The Claim on Common Knowledge
  **Friend's Claim:** *"The requirement of 'common knowledge'... just means that both agents know each other's estimates, i.e. that they've told each other what they believe."*

  **Verdict:** **Imprecise / Technically Wrong.**

  This flattens a crucial distinction between **mutual knowledge** and **common knowledge**.
  *   **Mutual Knowledge:** I know your belief, and you know my belief. (This is what happens if we simply swap emails once).
  *   **Common Knowledge:** I know your belief, you know my belief, I know that you know my belief, you know that I know your belief, *ad infinitum*.

  Merely telling each other your estimates once establishes mutual knowledge, but not necessarily common knowledge. For the theorem to hold, the communication protocol must ensure that the fact of the communication itself is common knowledge. In face-to-face dialogue, we often assume this holds, but in formal terms, your friend's definition is insufficient. There are famous counter-examples (such as the "Coordinated Attack Problem" or "Two Generals Problem") where agents exchange messages but never achieve common knowledge, and thus never agree.

  ### 4. The Claim on Trade and Markets
  **Friend's Claim:** *"This is why trade between rational agents can't happen... speculative markets are, strictly speaking, populated by irrational people."*

  **Verdict:** **Conflated but directionally correct.**

  Your friend is merging Aumann's Agreement Theorem with the **Milgrom-Stokey No-Trade Theorem (1982)**. While the latter is a direct application of the former, they are distinct results.
  *   **Aumann (1976):** About beliefs (posteriors).
  *   **Milgrom-Stokey (1982):** About actions (trading bets).

  The moral he draws is a standard interpretation of the No-Trade Theorem: if agents have common priors and markets are efficient, speculative trade (betting based on private information) should not occur because the very act of offering a bet reveals information that closes the gap.

  However, concluding that markets are *populated by irrational people* is a leap. Economists generally use this result to argue one of three things:
  1.  Priors are not common (agents have different "models" of the world).
  2.  Agents are not purely expected-utility maximisers (behavioural biases).
  3.  Trade is happening for liquidity or hedging reasons, not purely speculation.

  So, whilst the logic is defensible within the model, applying it as a blanket statement on the irrationality of all market participants is an overreach.

  ### A Careful Statement of the Theorem

  If you wish to present a rigorous version to your group, you might phrase it thus:

  > **Aumann's Agreement Theorem:** Consider two agents who are Bayesian expected-utility maximisers. Assume they share a **common prior** probability distribution over a state space. Suppose they have different information partitions (private signals). If their posterior probabilities for a given event are **common knowledge**, then those posteriors must be identical.

  **Key Limits and Assumptions:**
  1.  **Common Priors:** This is the "Harsanyi Doctrine". It assumes any difference in belief comes *only* from differences in information, not from different ways of processing that information. If I think the coin is biased and you think it is fair, the theorem does not apply.
  2.  **Common Knowledge:** As noted, this is a very high bar. It requires an infinite recursion of knowledge.
  3.  **Truthfulness:** It assumes agents report their true posteriors. If they can lie strategically, the theorem fails.
  4.  **Logical Omniscience:** Agents are assumed to be perfectly rational calculators.

  ### Summary of Conflations

  Your friend has muddled three distinct layers:
  1.  **Bayesian Updating:** (Same prior + same evidence $\rightarrow$ same posterior). He attributed this to Aumann.
  2.  **Aumann's Agreement Theorem:** (Same prior + different evidence + common knowledge of posteriors $\rightarrow$ same posterior).
  3.  **No-Trade Theorem:** (Same prior + different evidence + common knowledge of willingness to bet $\rightarrow$ no bet takes place).

  ### Conclusion for Your Group

  You are right to be sceptical. Your friend's summary is the "economics cocktail party" version: it captures the spirit but botches the mechanism.

  *   **Is he reliable?** On the broad intuition, yes. Rational agents with common priors shouldn't bet against one another.
  *   **Is his summary fair?** No. By claiming they need the "same evidence," he removes the interesting puzzle of the theorem. By flattening "common knowledge," he ignores the communication friction that explains why disagreement *does* persist in reality.

  If you repeat this in your group, I would suggest correcting the "same evidence" point specifically. That is the most glaring error. You might say: *"The theorem is actually more powerful than that; it applies even when agents have different private information, provided they know what the other believes."* That will show you've done your reading without necessarily calling your friend out directly.
