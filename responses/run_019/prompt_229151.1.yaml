      *   *Actual Theorem:* This refers to the Milgrom-Stokey No-Trade Theorem (which builds on Aumann). It applies to *speculative* trade based on asymmetric information with common priors. It doesn't rule out trade based on different risk preferences, liquidity needs, or hedging.
