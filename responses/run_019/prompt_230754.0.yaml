  8.  **Final Review of the "Bottom Line":** The author's second conclusion (structural explanations are *mostly* retrospective stories) is the most vulnerable. Chaos theory allows for *statistical* predictability even if *trajectory* predictability fails. Climate is chaotic, but we know it will be hotter in July than January. Similarly, history might be chaotic but still bound by structural "climate."

