answer: |-
  This is a profound narrative problem that touches on contract theory, moral philosophy, and the psychology of betrayal. Your instinct—that the deception acts as a "poisoned well"—is dramatically potent, but your worry is correct: if you treat *every* subsequent act as unconsented, you risk turning your protagonist into a passive object rather than an agent who was wronged. It removes her capacity to judge, act, or even suffer complexly.

  To maintain rigorous moral architecture without collapsing into total nihilism (where nothing she did matters), you can apply three principled distinctions. These allow you to argue that the deception voids specific consents without requiring you to claim it voids *all* human agency within the marriage.

  ### 1. Void vs. Voidable (The Agency Distinction)
  In legal and moral theory, there is a crucial difference between a contract that is *void* (it never existed) and one that is *voidable* (it exists until the victim chooses to annul it).

  *   **The Trap:** If you treat the marriage as *void ab initio* (from the start), you imply she was never married. This creates logical paradoxes regarding taxes, property, and social status that might distract from the emotional core.
  *   **The Solution:** Treat the consent as *voidable*. The deception did not remove her capacity to choose; it corrupted the information upon which she chose. This preserves her agency. She *did* consent, but that consent was conditionally valid based on truth. When the truth is revealed, she gains the power to retroactively invalidate the agreement.
  *   **Narrative Benefit:** This shifts the power dynamic. She isn't a victim who *never* chose; she is a sovereign individual whose terms were violated. It allows her to say, "I consented to X *on the condition of* Y. Y was false. Therefore, I withdraw consent for X." This makes her anger active rather than passive.

  ### 2. The Test of Materiality (The Causation Distinction)
  Not all lies contaminate all decisions equally. For consent to be voided by deception, the deception must be **material** to the specific decision. You can rigorously map the "radius of contamination" by asking: *Was this specific fact a necessary condition for this specific choice?*

  *   **Financial Decisions (The Mortgage):** If the husband is secretly supporting a child, that is a financial liability. If the bank or the wife would not have approved the mortgage had they known the true debt-to-income ratio, then her consent to the mortgage is voided. The lie is material to the finance.
  *   **Relocation:** Did she move abroad *for his career* (which is now supporting a child elsewhere) or *for her own*? If she moved to escape her own past, the child might be immaterial. If she moved to build a life *with him* specifically, the lie contaminates the relocation.
  *   **Intimacy:** This is the most sensitive area. In many moral frameworks, consent to sexual intimacy within marriage is predicated on exclusivity or shared life-planning. If the existence of a secret child implies a continuing bond with an ex-partner that she believed was severed, the context of the intimacy has changed. However, rigor demands you ask: *Would she have withheld intimacy specifically because of the child, or because of the lie?*
  *   **The Principle:** You do not have to concede that "consent procured by deception is valid." Instead, you argue that **consent is domain-specific.** The lie voids consent in domains where the hidden fact was a dealbreaker. In domains where the fact was irrelevant, consent remains valid. This isn't a contradiction; it's a recognition that human agreements are modular, not monolithic.

  ### 3. Independent Grounds (The "But For" Test)
  To avoid the "poisoned well" problem, apply the counterfactual test to downstream choices.
  *   **Dependent Acts:** Actions taken *solely* because she believed she was in a child-free marriage (e.g., agreeing to a specific lifestyle budget). These are contaminated.
  *   **Independent Acts:** Actions she would have taken regardless of the lie (e.g., perhaps she pursued her own career, or maintained her own friendships). These retain their validity.

  If you treat all downstream choices as unconsented, you inadvertently argue that she has no will of her own, only a reflection of his lies. By distinguishing between dependent and independent acts, you affirm that she is a real person whose life was *hijacked* in parts, not erased in total.

  ### Recommendation for the Novel's Architecture
  You can maintain your rigorous moral stance without falling into the "all or nothing" trap by framing the moral violation as **a violation of autonomy, not a negation of existence.**

  1.  **The Core Axiom:** "Consent requires informed agency."
  2.  **The Corollary:** "When information is withheld, agency is compromised proportionally to the materiality of that information."
  3.  **The Application:**
      *   The marriage contract is voidable because the identity of the partner (a father with obligations vs. a unencumbered man) was material.
      *   The mortgage is compromised because the financial risk was misrepresented.
      *   Intimacy is complicated: it may not be "non-consensual" in a legal sense, but it is **morally vitiated** because the emotional context (exclusivity of focus) was falsified.

  **Why this is better for the story:**
  If you write her as having *never* consented to anything, she becomes a ghost in her own life. If you write her as having consented to a *version of reality that did not exist*, she becomes a tragic figure whose labor, love, and choices were stolen.

  The latter allows for a more complex climax. She doesn't just wake up from a dream; she has to untangle which parts of her life were hers and which were built on the lie. She may decide that *some* things (the house, the friends) are worth keeping, even if the marriage is not. That choice—made with full knowledge—is the ultimate reclamation of the consent the husband stole.

  **In summary:** You do not need to treat all subsequent choices as unconsented. You can rigorously argue that consent is **context-dependent**. The lie voids consent where the lie was a material factor. This preserves your moral architecture (deception violates autonomy) while granting your character the complexity of having made real choices within a false framework.
