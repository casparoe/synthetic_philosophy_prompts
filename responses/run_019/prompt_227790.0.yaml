      *   **The Problem:** How far does this "voidness" extend? Does it invalidate *everything* downstream (mortgage, relocation, sex/intimacy)?
      *   **The Dilemma:** If *everything* is invalidated, it feels intuitively right but perhaps legally/philosophically extreme. If *something* is validated, does that undermine the core premise that deception voids consent?
      *   **Goal:** A rigorous, principled way to define the "radius of contamination" without contradicting the moral architecture.

  2.  **Initial Assessment & Safety Check:**
      *   **Topic:** Consent, deception, marriage, moral philosophy.
      *   **Safety:** This is a creative writing query about ethical philosophy and narrative structure. It touches on sensitive topics (marital consent, deception), but it is not asking for legal advice, nor is it promoting harm. It's an intellectual exploration of moral philosophy within a fictional context.
      *   **Policy:** No violation of safety policies. It's a philosophical/literary discussion.

  3.  **Deconstruct the Philosophical/Legal Problem:**
      *   *Premise:* Fraud vitiates consent.
      *   *Extension:* Does fraud in the foundation vitiate consent in the superstructure?
      *   *Legal Analogy:* Contract law (fraud in the inducement vs. fraud in the factum), Void vs. Voidable.
      *   *Moral Analogy:* Autonomy, agency, ongoing reaffirmation.

  4.  **Brainstorming Solutions/Nuances:**
      *   **Option 1: Total Contamination (The "Poisoned Well").** Every act is tainted. *Pros:* Dramatically strong, morally consistent with the premise. *Cons:* Removes agency from the wife entirely, makes her a passive victim, might feel unrealistic to readers (she *did* choose to buy the house, even if based on a lie).
      *   **Option 2: Segmented Consent.** The marriage is void, but specific acts (like buying a house) have their own consent. *Pros:* Realistic. *Cons:* Undermines the "moral architecture" the user wants. If she consented to the house, why not the marriage?
      *   **Option 3: The "Counterfactual" Test.** Would she have done X if she knew the truth? If yes, consent stands. If no, it's void. *Pros:* Nuanced. *Cons:* Hard to prove, varies by act.
      *   **Option 4: Ongoing Affirmation vs. Initial Contract.** Marriage isn't a one-time contract; it's a series of renewals. The lie breaks the *initial* contract, but subsequent acts can be re-evaluated.
      *   **Option 5: The Nature of the Lie.** Is the lie *material* to the specific downstream act? Hiding a child affects finances (mortgage) and trust (intimacy) differently.

  5.  **Developing a Principled Framework:**
      *   To help the user, I need to offer philosophical distinctions that allow for rigor without forcing an "all or nothing" binary that might break the narrative.
      *   *Distinction 1: Void vs. Voidable.* In law, fraud often makes a contract *voidable* (victim can choose to cancel), not automatically *void* (never existed). This preserves the victim's agency to decide what counts.
      *   *Distinction 2: Materiality.* Did the lie directly impact the specific decision? (e.g., The mortgage depends on income/debt. The child support affects debt. So mortgage consent is tainted. Relocation might be less directly financial, more emotional).
      *   *Distinction 3: Independent vs. Dependent Acts.* Did she have independent reasons for the act?
      *   *Distinction 4: The Concept of "Ratification".* If she stays after finding out, does she ratify the past? (Maybe not for the novel's timeline, but useful for theory).

  6.  **Drafting the Response:**
      *   **Acknowledge the Strength:** Validate the user's intuition. It's a compelling moral premise.
      *   **Address the "All or Nothing" Trap:** Explain why total contamination might actually weaken the character (removes agency).
      *   **Propose Philosophical Frameworks:**
          1.  *Materiality:* Connect the lie to the specific act. (Financial lie -> Financial consent voided. Emotional lie -> Intimacy voided).
          2.  *Counterfactual Consent:* Would she have done it anyway?
          3.  *Agency & Voidability:* Shift from "never consented" to "consent is revocable." This keeps her power.
          4.  *The "Fruit of the Poisonous Tree" vs. "Independent Source":* Did the act rely *solely* on the marriage status, or did it have other grounds?
      *   **Narrative Implications:** How does this affect the story? Total victimhood vs. complex betrayal.
