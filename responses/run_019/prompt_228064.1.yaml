  2.  **Deconstruct Dennett's Actual Views (Mental Knowledge Retrieval):**
      *   *Cartesian Theater:* Dennett definitely rejects this. He argues against the idea of a central finish line where consciousness happens. (Sister is right here).
      *   *Multiple Drafts Model:* Information is processed in parallel, various "narratives" are edited and revised. There is no final draft until it's expressed (spoken/acted). (Sister is mostly right here).
      *   *Consciousness as an Illusion:* This is the tricky part. Dennett *is* often labeled an "illusionist," but he nuances this. He doesn't mean "nothing is happening." He means the *phenomenal properties* (qualia) as traditionally conceived (ineffable, intrinsic, private, directly apprehensible) are illusory. He thinks consciousness is real, but not what people *think* it is. He often says, "Consciousness is a user-illusion." (Sister is partially right but risks sounding eliminativist in a way Dennett sometimes resists).
      *   *No Fact of the Matter:* Dennett argues against "phenomenal realism" regarding timing. In the Color Phi case, he argues there is no objective time stamp on the experience itself. The brain constructs the narrative *after the fact*. (Sister is right here).
      *   *Unified Self:* Dennett views the self as a "Center of Narrative Gravity." It's an abstraction, not a physical thing. (Sister is right here).
      *   *Color Phi Phenomenon:* This is the Kolers and von Grünau experiment. Dennett uses it in "Consciousness Explained." He argues against the "Stalinesque" (editing before consciousness) vs. "Orwellian" (editing memory after consciousness) distinction. He says the distinction itself is flawed. (Sister is right about the experiment's role).
      *   *Dad's Objection:* "I'm obviously conscious." Dennett's response is usually: "I agree you are conscious, but your intuition about *how* it works is wrong." He doesn't deny the existence of experience; he denies the *infallible inner gaze* interpretation of it.

