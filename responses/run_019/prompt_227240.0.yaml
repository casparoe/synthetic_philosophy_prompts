answer: |-
  The conference room was quiet, the hum of the HVAC system the only sound remaining after the rest of the committee had departed. Elena stacked her papers slowly, while Marcus stared at the empty chair where the patient's file lay closed.

  "We cannot recommend following the weekly notes, Marcus," Elena said, her voice low. "To do so would be to abandon the only competent voice this woman ever had regarding this specific trajectory."

  "And to follow the original directive," Marcus replied, turning his gaze to her, "is to sacrifice a living, breathing woman who is currently content on the altar of a ghost who no longer exists. You speak of competence, Elena. But where does the authority of that original document actually rest? Is it on her competence at the time of writing, or on the psychological continuity between her then and her now?"

  "It rests on competence at the time of writing," Elena said firmly. "Autonomy is not a continuous stream; it is a series of sovereign moments. When she was competent, she had the right to determine the boundaries of her life. That authority does not evaporate simply because her mind has since deteriorated. If we require strict psychological continuity for the directive to hold, we render advance directives useless for the very conditions they are designed to address."

  "But the continuity here is severely diminished," Marcus countered. "We are talking about a rupture in identity. The woman who wrote that directive valued cognitive integrity above biological existence. The woman in the bed values connection, comfort, and the immediate present. If the psychological links are severed, why does the past self retain veto power over the present self's interests? You are treating the patient as a vessel for a biography that has effectively ended."

  Elena leaned forward. "Let me ensure I understand the strongest version of your position. You are arguing that moral status attaches exclusively to the experiential subject. Because the current patient is the only entity capable of feeling pleasure or pain, her interests are the only ones that count. The past self's values are merely historical data—weighty evidence, as you said earlier, but not binding commands. You believe that fidelity to a biography is a category error when it conflicts with care for the patient."

  "Precisely," Marcus said. "And let me articulate your view charitably. You argue that personhood is extended over time. To respect the person is to respect the narrative arc they chose. If we allow the demented self to override the competent self, we are not respecting the patient; we are abandoning her to a fate she explicitly reasoned against. You see the current contentment as a symptom of the disease, not a valid change of heart."

  "I do," Elena said. "Which brings us to the clause she insisted upon. The self-discount clause. She anticipated exactly this. She knew she might appear happy. She instructed us to treat that apparent contentment as no evidence whatsoever about how she should be treated. She recognized that the person enjoying that contentment would not be her."

  "That clause is where your argument breaks," Marcus said. "It asks us to pretend away the only subject currently capable of being benefited or harmed. Is it rational to bind caregivers to ignore manifest states of joy? She is smiling, Elena. She engages with the volunteer. To ignore that is not respect; it is a form of contempt for a condition she had not yet lived. She theorized suffering from the outside. Now she is living a different life from the inside."

  "She anticipated the illusion," Elena insisted. "She understood that dementia could create a false sense of well-being. By signing that clause, she was protecting her deeper values from being hijacked by a pathological state. If we honor the clause, we honor her rational agency. If we discard it because she looks happy now, we are saying that a competent adult cannot protect herself against her own future incapacity."

  "But consider the new weekly directives," Marcus said, shifting the ground. "She is drafting them now. With help, yes, but she is expressing wishes. Some days she seems to grasp her situation. If the authority of the original directive comes from the author's competence at the time of writing, is that authority not also available to the present self during her lucid-seeming intervals?"

  "The capacity assessments are equivocal," Elena replied. "That is the distinction. The original directive was executed with full, verified capacity. The weekly notes are products of fluctuating confusion. To treat them symmetrically is to ignore the epistemic gap between a stable, reasoned decision and a fluctuating impulse."

  "Is capacity binary?" Marcus pressed. "If we accept that the original directive binds us because it was a competent act, then we must ask if the current self is ever competent enough to revoke it. If she has a lucid day—a day where she understands she is ill, yet still chooses life—why does her current authority not count? You argue for the sovereignty of the competent moment. Why is that sovereignty locked in the past? If the ground of authority is competence, and she demonstrates moments of competence now, your own principle commits you to asymmetrical treatment of old and new documents without a clear justification."

  "Because the stakes of the original decision were set when the horizon was clear," Elena said. "She knew what she was losing. The current self cannot fully grasp what was lost. The new directives are reactive to immediate comfort. The old directive was proactive regarding dignity. But I concede this: if she were consistently lucid now, consistently capable of understanding the trade-offs, the balance would shift. The tragedy is that she is not. The fluctuation itself proves the incapacity."

  "Yet you rely on the past self's prediction of this very fluctuation to ignore the current self's joy," Marcus said. "This is the crux. You claim to respect her autonomy, but you are using her past autonomy to extinguish her present welfare. The strongest version of my view is not that the past doesn't matter. It is that the past cannot hold a veto over the present when the present subject is the one who must endure the consequence. You are asking me to kill a happy being to satisfy the values of a dead one."

  "And you are asking me to let a being die who, by her own prior definition, is no longer the person who matters," Elena replied. "But let us not dissemble. We are not disagreeing about the medical facts. We are disagreeing about the metaphysics of the self."

  "Then let us define it," Marcus said. "You believe the moral patient is the biographical author. I believe the moral patient is the experiential subject."

  "Close," Elena said. "But it is more specific than that. It is about the location of harm. I believe harm can be done to a person's life narrative even if they cannot experience it. You believe harm is strictly experiential."

  "Exactly," Marcus said. "But consider the implication of the weekly notes again. If the original directive is binding because it was a competent expression of will, then the current self's competent expressions must also carry weight. If you deny them weight solely because they contradict the past, you are admitting that the authority rests not on competence, but on temporal priority. You are privileging the past self simply because she arrived first."

  "I am privileging the stable self over the unstable self," Elena corrected. "The original directive represents a settled, reflectively endorsed value system. The weekly notes are erratic. To treat them equally would be to invite chaos into care. But I will concede this: if the 'self-discount clause' requires us to ignore evidence of capacity itself, it becomes self-defeating. If she is truly lucid in those moments, the clause might not apply. But the assessments say they are equivocal. We cannot gamble on the equivocal days against the certain intent of the competent years."

  "So we return to the clause," Marcus said. "You say it protects her values. I say it demands we ignore the only reality we have access to. If we honor it, we are not respecting the author; we are indulging her contempt for a condition she had not yet lived. She hated the idea of dementia. Now she is in it, and she is not suffering in the way she feared. To impose her fear onto her reality is cruel."

  "It is not cruelty to keep a promise," Elena said. "And it is not contempt to recognize that the thing she feared was the loss of the self that makes promises. She was right. That self is gone. But the instruction remains."

  "Then here is where we stand," Marcus said, leaning back. "We both agree that competence matters. We both agree that welfare matters. But we cannot agree on who the 'who' is."

  "No," Elena said. "We agree on more than that. We agree that if the current self were fully competent, her wishes would override the past. We agree that if the past self had been incompetent, her directive would be void. Our dispute turns on a single proposition."

  She paused, looking at the file.

  "The proposition is this: Whether moral authority resides in the author of the life story or the subject of the current experience when the two diverge irreconcilably."

  Marcus nodded slowly. "And specifically, whether the author's authority extends to defining what counts as harm for the subject, even when the subject reports no harm."

  "Yes," Elena said. "If the past self can define harm for the present self, I win. If harm is defined solely by the present self's experience, you win."

  "And the self-discount clause," Marcus added, "is simply the mechanism by which the past self attempts to enforce that definition of harm."

  "Correct," Elena said. "She is attempting to legislate the metaphysics of her own survival. She says the happy woman in the bed is not me, so her happiness is irrelevant."

  "And I say," Marcus concluded, "that the happy woman in the bed is the only one who is real. The rest is memory."

  They sat in silence for a moment, the proposition hanging between them, unresolved. The committee would have to vote tomorrow, but tonight, the philosophy remained intact, a clean break in the dark room.

  "Tomorrow," Elena said, standing up.

  "Tomorrow," Marcus replied.

  They turned off the lights, leaving the file on the table, waiting for a decision that neither philosophy could fully dictate.
