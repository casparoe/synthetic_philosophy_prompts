          *   Rule 2: The "Active Intervention Priority" (Case 2).
          *   Rule 3: The "Role Capacity" Principle (Case 3).
      *   *Refining Case 5:* It sits between Explicit Mandate and Role Capacity.
      *   *Confidence:* High on the diagnosis of the tension. Low on the "true" intent of Case 2 (was it really about testing or about the library?).
      *   *Least Sure Claim:* The interpretation of Case 2. Why did they absolve the testing omission? That's the weak link in the team's logic.

  9.  **Final Polish:** Check against constraints.
      *   Did I avoid textbook summary? Yes, focused on their specific cases.
