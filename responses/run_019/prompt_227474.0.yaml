  3.  **Identify the Philosophical Core:**
      *   The core issue is *Causation by Omission* (Negative Causation).
      *   Standard problem: If I don't water my plant, it dies. If the Queen of England doesn't water it, it also dies. Why is my omission a cause but the Queen's isn't? (The "Profligate Omissions" problem).
      *   The team is intuitively applying a filter to distinguish "causal omissions" from "non-causal omissions."

  4.  **Brainstorm Underlying Rules (The "Principles"):**
      *   *Rule A: Normative Expectation.* Did a rule/duty exist? (Fits Case 1, Case 4).
      *   *Rule B: Epistemic Access.* Did the agent know they should do it? (Fits Case 4, maybe Case 1).
