answer: |-
  # Seminar Plan: The Causal Exclusion Argument (75 Minutes)

  ## 1. Carrying Example Selection
  **Selected Example:** **Pain causing Withdrawal** (realized by C-fiber firing).

  **Justification:**
  *   **Pain (Selected):** This is the canonical example for a reason. It maintains the *metaphysical stakes* (agency, responsibility, consciousness) that define Philosophy of Mind. It prevents students from treating the problem as merely a technical issue of abstraction layers.
  *   **Computer Programs (Rejected):** While this resonates with your students' background, it risks making the solution look too easy. Students often intuitively accept "software causation" as unproblematic functionalism, which bypasses the metaphysical pressure Kim intends. It tempts them to think distinctness is merely epistemic (code vs. voltage) rather than ontological.
  *   **Thermostats (Rejected):** Too mechanistic. The causal chain is transparently physical, making it difficult to sustain the intuition that the "temperature setting" is a distinct property with independent causal power. It collapses into reduction too quickly.

  **Pedagogical Note:** Leverage their programming background to *model* the Pain example. Treat C-fiber firing as the "hardware state" and Pain as the "high-level variable." Use DAGs (Directed Acyclic Graphs) on the board to visualize the exclusion.

  ---

  ## 2. Conceptual Sequence & Dependencies (50 Minutes)
  Do not present the argument as a static list of premises. Build it as a "trap" that closes step-by-step. Each step creates a commitment that makes the next step unavoidable.

  ### Step 1: Causal Efficacy (5 mins)
  *   **Content:** Establish the target. We want to save the intuition that mental properties (Pain) cause physical effects (Withdrawal).
  *   **Dependency:** This is the *explanandum*. Without this goal, the argument has no force.
  *   **Misconception Check:** **"The argument denies ordinary beliefs cause behavior."**
      *   *Confrontation:* Explicitly state: "Kim agrees your hand moves. The question is *in virtue of what*." If they think the argument denies the effect, they aren't listening to the exclusion problem; they are denying the data.

  ### Step 2: Physical Realization (10 mins)
  *   **Content:** Introduce Supervenience/Realization. Pain cannot occur without a physical base (C-fiber firing).
  *   **Dependency:** We need this to connect the Mental to the Physical domain. If Mental properties floated free (Dualism), Closure wouldn't apply.
  *   **Misconception Check:** **"Multiple Realization (MR) automatically saves mental causation."**
      *   *Confrontation:* Students often think MR proves mental causation is robust. Correct them: "MR motivates Non-Reductive Physicalism, which *creates* the exclusion problem. If Pain is multiply realizable, it is *distinct* from C-fibers. If it is distinct, it competes with C-fibers. MR tightens the trap, it doesn't spring it."

  ### Step 3: Causal Closure of the Physical (10 mins)
  *   **Content:** Every physical event (Withdrawal) has a sufficient physical cause (C-fiber firing + motor neurons).
  *   **Dependency:** This provides the *competitor*. If the physical world weren't causally closed, the Mental could step in where the Physical leaves off.
  *   **Pedagogical Tool:** Draw a DAG. $P \rightarrow P^*$. Now ask where $M$ fits.
  *   **Note:** Leverage their causal inference background. Ask: "If $P$ is sufficient for $P^*$, what is the coefficient for $M$ in the regression?"

  ### Step 4: Property Distinctness (10 mins)
  *   **Content:** Mental properties are not identical to Physical properties (Non-Reductionism). $M \neq P$.
  *   **Dependency:** This is the crux. If $M = P$, there is no exclusion (only one cause). We need distinctness to have *two* candidates for the *one* job.
  *   **Misconception Check:** **"The mental and physical causes are just two descriptions of one event."**
      *   *Confrontation:* Distinguish *events* from *properties*. "Kim grants the event is one. But if the *properties* are distinct, and causation is relation between properties (or events *under* descriptions), we still have causal competition. If you say they are just descriptions, you are arguing for Reductionism, which Kim accepts as the only alternative to Epiphenomenalism."

  ### Step 5: Causal Exclusion (15 mins)
  *   **Content:** No single event has more than one sufficient cause (unless it is a genuine case of overdetermination).
  *   **Dependency:** This springs the trap. Given Closure ($P$ causes $P^*$) and Distinctness ($M \neq P$), $M$ is excluded.
  *   **Misconception Check:** **"Interventionist causation dissolves the problem."**
      *   *Confrontation:* This is critical for your cohort. They will argue: "If I intervene on $M$ (change the pain), $P^*$ changes."
      *   *Response:* "To intervene on $M$, you *must* intervene on $P$ (due to Realization). Therefore, the change in $P^*$ is screened off by $P$. In your DAG, the path $M \rightarrow P^*$ is blocked by $P$. The intervention on $M$ is not independent of $P$."

  ---

  ## 3. Diagnostic Question (10 Minutes)
  Do not ask them to reconstruct the premises. Ask them to break the argument.

  **The Question:**
  > "To save mental causation, you must reject at least one premise. If you reject **Causal Closure**, you become a dualist. If you reject **Property Distinctness**, you become a reductionist. If you reject **Exclusion**, you accept systematic overdetermination. Which premise do you reject, and specifically: **what theoretical cost does your choice impose on your broader worldview?**"

  **Evaluation Criteria:**
  *   **Memorization:** Lists the options without identifying the cost (e.g., "I reject Distinctness" without admitting this means mental properties *are* physical properties).
  *   **Understanding:** Identifies the trade-off. (e.g., "If I reject Distinctness, I save causation but lose the idea that psychology is autonomous from neuroscience.")

  ---

  ## 4. Complications to Postpone
  To keep the seminar within 75 minutes and focused on the core logic, explicitly bracket the following:

  1.  **Grounding vs. Realization:** Do not get bogged down in whether realization is grounding, identity, or functional role. Treat it as a dependency relation.
  2.  **Contrastive Causation:** Do not allow the debate to shift to "M causes P* *rather than*..." This is a sophisticated solution (Shapiro/Sober) that requires its own seminar.
  3.  **The "Causal Inheritance" Principle:** Kim often uses this to tighten the argument. Postpone it; Closure and Exclusion are sufficient for the core dilemma.
  4.  **Compatibilist Solutions:** Do not discuss "causal compatibilism" in depth. Treat the seminar as establishing the *pressure* that forces compatibilism to work hard for its keep.

  ## 5. Summary of Board Work (Visual Plan)
  *   **Left Column:** The 5 Steps (Efficacy, Realization, Closure, Distinctness, Exclusion).
  *   **Center:** The DAG.
      *   $P \rightarrow P^*$ (Solid line, labeled "Sufficient")
      *   $M \rightarrow P^*$ (Dashed line, labeled "Excluded?")
      *   $M \dashrightarrow P$ (Vertical dashed line, labeled "Realization/Supervenience")
  *   **Right Column:** The "Exit Routes" (Reduction, Dualism, Epiphenomenalism, Overdetermination).

  This plan leverages their technical skills to visualize the logical constraint while ensuring they confront the philosophical stakes of the Mind-Body problem.
