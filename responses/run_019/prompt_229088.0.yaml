      *   *Why not Pain?* Too much baggage.
      *   *Why not Thermostats?* Too simple, often reduces to mechanism too quickly.
      *   *Refinement:* Use a specific high-level variable in code (e.g., `is_authenticated = True`) causing a state change (e.g., `grant_access()`), realized by transistor states.

  4.  **Order the Concepts:**
      *   Kim's argument relies on a specific logical flow.
      *   1. **Causal Efficacy:** Start with the intuition we want to save (Mental/High-level properties do things).
      *   2. **Physical Realization:** Establish the supervenience/base relation (Mental depends on Physical).
      *   3. **Causal Closure:** Establish that the Physical base is sufficient for the Physical effect.
      *   4. **Property Distinctness:** Crucial step. M $\neq$ P. (Non-reductive).
      *   5. **Exclusion:** The squeeze. If P causes P*, and M $\neq$ P, and no overdetermination, M is squeezed out.
      *   *Correction on Order:* To build the *tension*, it's often better to establish the physical story first, then add the mental, then show the conflict.
      *   *Revised Order:*
          1.  **Causal Efficacy** (The Goal: We want M to cause).
          2.  **Realization** (The Constraint: M sits on P).
          3.  **Causal Closure** (The Competitor: P causes P*).
          4.  **Property Distinctness** (The Non-Reductive Commitment: M is not P).
          5.  **Exclusion** (The Crash: M has no work left).
      *   *Dependencies:* You can't have Exclusion without Distinctness. You can't have the conflict without Closure. You can't have the setup without Realization.

  5.  **Address Misconceptions:**
      *   *Denies ordinary beliefs:* Confront early (Step 1).
      *   *Multiple Realization (MR) saves it:* Confront at Realization/Distinctness. MR motivates non-reduction, which *creates* the problem.
      *   *Two descriptions/One event:* Confront at Property Distinctness.
      *   *Interventionism dissolves it:* Confront at Exclusion (using their background).

  6.  **Drafting the Lesson Plan (Iterative Process):**

      *   *Intro (5 mins):* Hook with the example.
      *   *Step 1 (10 mins):* Causal Efficacy.
      *   *Step 2 (15 mins):* Realization + MR (Misconception check).
      *   *Step 3 (15 mins):* Causal Closure.
      *   *Step 4 (15 mins):* Distinctness + "One Event" Misconception.
      *   *Step 5 (15 mins):* Exclusion + Interventionism Misconception.
      *   *Conclusion (5 mins):* Diagnostic Question.

      *   *Refining the Example:* Let's use a specific variable `balance > 0` causing `allow_transaction`. Realized by voltage patterns.
      *   *Refining Interventionism:* Students love Pearl/DAGs. They will say "If I intervene on M, P* changes." I need to show why Kim says the intervention on M *is* an intervention on P.

  7.  **Finalizing the Diagnostic Question:**
      *   Needs to separate rote memorization from understanding the *dilemma*.
      *   Bad: "What are the premises?"
      *   Good: "Which premise would you drop to save mental causation, and what is the cost?"
      *   Better: Force a choice between Reduction and Epiphenomenalism.

  8.  **Postponing Complications:**
      *   Grounding vs. Realization.
      *   Contrastive causation.
      *   Macro-causation in special sciences (Shapiro/Sober).
      *   Kim's later "Causal Inheritance" principle nuances.

  9.  **Review against Constraints:**
