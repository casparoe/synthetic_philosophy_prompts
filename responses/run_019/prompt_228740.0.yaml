answer: |-
  # Persistence Flowchart: What Are You Over Time?

  **Instructions:** Answer each question based on your immediate intuition about the case. Don't worry about technical terms; just pick the option that feels true.

  **Q1. The Hume Anchor**
  Read this: *"We have a distinct idea of an object, that remains invariable… and this idea we call… identity. We have also a distinct idea of several different objects existing in succession… but… in our common way of thinking they are generally confounded."*
  When you think about yourself lasting from yesterday to today, is that literally **one thing surviving**, or is it really a **chain of different moments** your mind glues together?
  *   **Chain/Glue:** Go to **Leaf A**.
  *   **One Thing Surviving:** Go to **Q2**.

  **Q2. The Contradiction Case**
  You are sitting at noon and standing at 1 PM. How is this possible?
  *   **A:** The *whole* you is sitting at noon and the *whole* you is standing at 1 PM (you change properties). Go to **Q3**.
  *   **B:** Different *parts* of you are sitting and standing (like a road is straight here and bent there). Go to **Q4**.

  **Q3. The Constitution Check (Endurance Path)**
  Consider a statue and the lump of clay it's made from. If the statue is squashed flat:
  *   **A:** The statue ceases to exist, but the clay remains (two things were in the same place). Go to **Leaf B**.
  *   **B:** They are the same object; if the clay survives, the statue survives (or both cease). Go to **Leaf B**.
  *(Note: Both answers lead to Endurantism, but A accepts "coincidence" while B accepts "essentialism".)*

  **Q4. The Road Analogy (Perdurance Path)**
  Think of a road that is straight in the valley and bent on the hill. Is the *whole* road straight and bent?
  *   **A:** No, different spatial parts are straight/bent. (Confirms you think of objects as having parts). Go to **Q5**.
  *   **B:** Yes, the whole road has those properties at different locations. (Inconsistent with Q2B; return to Q2).

  **Q5. The Reference Test (Worm vs. Stage)**
  When you say "I exist now," what does the word "I" refer to?
  *   **A:** A momentary slice that exists only now (but is connected to other slices). Go to **Leaf C**.
  *   **B:** A long "worm" that stretches across your whole life (and exists now by having a part now). Go to **Leaf D**.

  ---

  ### The Leaves

  **Leaf A: Humean Deflationism**
  *   **View:** Persistence is a fiction imposed by the imagination on a succession of related distinct existences.
  *   **Awkward Commitment:** You must explain why we should care about future "slices" if they aren't literally *you*.

  **Leaf B: Endurantism**
  *   **View:** You are wholly present at every moment of your existence; you persist by enduring through time.
  *   **Awkward Commitment:** You must accept either that two things (statue/clay) can occupy the same space or that objects survive losing essential parts.

  **Leaf C: Stage Theory**
  *   **View:** You are a momentary time-slice; talk of "persistence" is just talk about counterpart relations between slices.
  *   **Awkward Commitment:** You cease to exist every instant; "survival" is just having a similar successor.

  **Leaf D: Perdurantism (Worm Theory)**
  *   **View:** You are a four-dimensional space-time worm; you persist by having temporal parts at different times.
  *   **Awkward Commitment:** Change is illusory; the "you" that is sitting and the "you" that is standing are both equally real static parts of a block.

  ---

  ### TA Notes & Logical Space Flags

  **1. The Worm/Stage Separation Problem**
  This tree struggles to cleanly separate **Leaf C (Stage)** and **Leaf D (Worm)**. In Q5, many students will say "I" refers to the worm *because* they think the slice isn't enough, but then agree with Stage theorists that only the present exists (Presentism). If a student holds **Presentist Stage Theory**, this tree might misclassify them as Worm theorists because they deny the existence of past/future parts. The semantic distinction (what "I" refers to) often collapses under ontological pressure (what exists).

  **2. Unoccupied Coherent Combination**
  **Mereological Essentialist Endurantism.** (Answering Q3B "Same Object" + Q2A "Whole You" + believing objects cannot lose parts).
  *   *Why Unoccupied:* It is logically coherent (an object is its parts; if parts change, it's a new object), but practically untenable for humans. It implies you cease to exist when you lose a hair cell. Most students who lean this way retreat to Humean Deflationism (Leaf A) instead of accepting they die constantly.

  **3. Hume's Placement**
  Given the passage, Hume lands in **Leaf A (Humean Deflationism)**. He explicitly calls the idea of identity a "confusion" and asserts that an accurate view affords a "perfect notion of diversity."
  *   *Is he a closet Perdurantist?* Not quite. Perdurantists use temporal parts to *save* the concept of identity (analyzing it as unity of parts). Hume uses the succession of parts to *dissolve* the concept of identity (calling it a fiction). He agrees with the Perdurance *ontology* (diversity of parts) but rejects the Perdurance *semantics* (that this counts as "sameness").

  ---

  **Summary:** This instrument sorts your intuitions about change and identity into four metaphysical camps by testing whether you treat time like space, whether you trust your sense of self, and what you think the word "I" actually picks out.
