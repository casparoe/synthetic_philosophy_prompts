      *   *Final Weighing:* The key differentiator is **reversibility**. If the new chemical is bad, can we get it out of the furniture? No. If we wait, can we fix the old chemical issue later? Yes, potentially, or find a different alternative. The irreversibility tips the scale to Mara.

