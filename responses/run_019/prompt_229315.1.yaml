          *   *Status:* Substantive but context-dependent. Not always true (ruin is possible).
          *   *Evidence:* Historical data on risk/return, survival rates of startups vs. stable firms.
      *   *Causal/Social:* Boldness signals confidence, attracts allies, intimidates rivals. It creates self-fulfilling prophecies.
