      *   *Correction:* The key is *why* Machiavelli says that. He says it because he believes Fortune *currently* favors the young and violent (referencing Pope Julius II). It is a contingent claim, not a universal law. The user's reading of "fit" is the deeper theoretical framework; the roommate is grabbing the contingent conclusion without the framework.
      *   *The "Woman" Metaphor:* This is controversial but textually present. It implies Fortune yields to force. But force without *virtù* (skill/preparation) is just stupidity.
