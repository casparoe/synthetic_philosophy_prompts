      *   **Task 1 (Disambiguation):** Create a "menu" of distinct precise theses behind the slogan "fortune favors the bold." Specifically include: probabilistic, causal/social, desert-based/normative, and empty/survivorship readings. Evaluate each (platitude, substantive/defensible, false) and specify evidence needed.
