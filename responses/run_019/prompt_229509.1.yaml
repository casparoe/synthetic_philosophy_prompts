          *   Bet on R: Lose if $\{B, Y\}$. Loss $l_1(z) = \mathbb{I}(z \in \{B, Y\})$.
          *   Bet on B: Lose if $\{R, Y\}$. Loss $l_2(z) = \mathbb{I}(z \in \{R, Y\})$.
          *   Bet on R $\cup$ Y: Lose if $\{B\}$. Loss $l_3(z) = \mathbb{I}(z = B)$.
          *   Bet on B $\cup$ Y: Lose if $\{R\}$. Loss $l_4(z) = \mathbb{I}(z = R)$.
      *   **Decision Rule:** Minimax Regret or Minimax Expected Loss?
          *   Standard DRO: $\min_{\text{action } a} \sup_{P \in \mathcal{P}} \mathbb{E}_{P}[L_a(z)]$.
      *   **Walkthrough:**
          *   *Choice 1 (R vs B):*
