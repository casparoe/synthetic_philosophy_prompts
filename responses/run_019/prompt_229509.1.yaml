      *   **Contradiction:** Under Subjective Expected Utility (SEU), preferring R implies $P(R) > P(B)$. Preferring B $\cup$ Y implies $P(B) + P(Y) > P(R) + P(Y) \Rightarrow P(B) > P(R)$. Contradiction.
      *   **Standard Interpretation:** People dislike ambiguity (unknown probabilities) more than risk (known probabilities).

  3.  **Translate to ML/DRO Vocabulary:**
      *   **Outcome Space:** $\mathcal{Z} = \{R, B, Y\}$.
      *   **True Distribution:** $P^*$. We know $P^*(R) = 1/3$. We know $P^*(B) + P^*(Y) = 2/3$. We *don't* know $P^*(B)$ or $P^*(Y)$ individually.
      *   **Ambiguity Set (Uncertainty Set):** $\mathcal{P}$. This is the set of plausible distributions consistent with our knowledge.
