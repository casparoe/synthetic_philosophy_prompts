answer: |-
  **Introspective Weighting Procedure (IWP)**

  **Step 1: Temporal and Content Classification**
  *Question:* Is the report describing a *current* qualitative state (e.g., "My chest feels tight now") or asserting a *causal relationship* (e.g., "I avoided the party because I am shy")?
  *   **Current State:** Proceed to Step 2.
  *   **Causal Relationship:** Proceed to Step 3.
  *   *Rationale:* Phenomenological presence is distinct from causal theorizing.

  **Step 2: Phenomenological Granularity**
  *Question:* Is the description specific to bodily sensation or immediate affect, rather than an abstract diagnostic label?
  *   **Specific Sensation (e.g., "buzzing," "heaviness"):** Assign **High Epistemic Weight**. The report is treated as valid data regarding the subject's present experience. Stop.
  *   **Abstract Label (e.g., "I feel depressed"):** Assign **Moderate Epistemic Weight**. Treat as valid report of self-concept, but verify with observation. Stop.

  **Step 3: Mechanism Accessibility**
  *Question:* Is the claimed mechanism directly accessible to consciousness (e.g., "I counted the options") or inferred from behavior/outcome (e.g., "I chose this because I am cautious")?
  *   **Accessible:** Proceed to Step 4.
  *   **Inferred:** Proceed to Step 5.
  *   *Rationale:* Subjects have privileged access to deliberate strategies, but not to unconscious drivers (Nisbett & Wilson, 1977).

  **Step 4: Convergence Check**
  *Question:* Does observable behavior or physiological data contradict the report?
  *   **No Contradiction:** Maintain **Moderate Epistemic Weight**. Stop.
  *   **Contradiction:** Downgrade to **Low Epistemic Weight**. Stop.

  **Step 5: The Utility Pivot (Value Judgment)**
  *Question:* Is accepting this causal claim clinically useful for formulation or alliance, despite low epistemic reliability?
  *   **Yes:** Assign **High Clinical Utility / Low Epistemic Weight**. Record as "client narrative" rather than "etiological fact." **Stop.**
  *   **No:** Discard for scientific conclusion; explore alternative hypotheses clinically. **Stop.**
  *   *Note:* This step marks the transition from epistemic verification to therapeutic valuation.

  ***

  **Application to Cases**

  **Case 1: The Choice Experiment**
  *Report:* "I chose the safer-looking option because I am a cautious person."
  *Procedure:* Step 1 (Causal) → Step 3 (Inferred mechanism; personality traits are not directly accessible during choice) → Step 5.
  *Verdict:* **Low Epistemic Weight.** Cognitive psychology standards hold. The participant is confabulating a trait-based explanation for a likely automatic process. Do not code this as a causal variable in the manuscript. It is a post-hoc rationalization, not data on the decision mechanism.

  **Case 2: The Diffuse Dread**
  *Report:* "A faint, diffuse dread at the back of my throat."
  *Procedure:* Step 1 (Current State) → Step 2 (Specific Sensation).
  *Verdict:* **High Epistemic Weight.** Clinical and phenomenological standards hold. This is a description of immediate qualia. It is difficult to falsify and distinct from generic self-report. Record this precisely in the chart note as the target of intervention. Trust the report as data on the client's present state.

  **Case 3: The Childhood Causation**
  *Report:* "This one childhood event caused my current avoidance."
  *Procedure:* Step 1 (Causal) → Step 3 (Inferred; retrospective reconstruction) → Step 5.
  *Verdict:* **Low Epistemic Weight / High Clinical Utility.** The procedure dictates you cannot treat this as established etiology in the clinical record. Memory reconstruction is fallible. However, at Step 5, the value judgment allows you to treat the *belief* as central. Document as: "Client identifies Event X as primary driver." Do not document: "Event X caused avoidance." This preserves scientific integrity while honoring the narrative's therapeutic role.

  ***

  **Limitations and Misfires**

  The IWP cannot adjudicate when truth and utility are inextricably linked. If validating a false causal belief (Case 3) reinforces maladaptive avoidance, the "Utility Pivot" may harm the patient. The procedure assumes a standard Western model of introspection; it may misfire with clients whose cultural idioms of distress merge sensation and causation (e.g., somatic explanations of moral failure). Finally, it cannot detect skilled deception. A client lying about current sensation passes Step 2, and a client rehearsing a causal script passes Step 3. The procedure manages reliability, not validity. It protects you from treating confabulation as fact, but it cannot guarantee that the "truth" you settle on is anything more than the most coherent story available.
