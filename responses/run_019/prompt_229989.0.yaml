answer: |-
  ### Part 1: The Logical Space of the Debate

  Before we write the code for the quiz, we must map the logic. The debate turns on three binary switches. Not every combination is occupied by a serious philosophical theory; some are logically incoherent or simply unattractive.

  | Position | Do high stakes ever make 'S knows P' false? | Whose situation sets the standard? | Mechanism of shift | Lottery Case Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Moderate Invariantism** | No. | N/A (Fixed) | N/A | You know (probabilistically). |
  | **2. Strict Invariantism** | No (but you rarely know anyway). | N/A (Fixed) | N/A | You don't know (scepticism). |
  | **3. Contextualism** | Yes. | The Speaker's / Ascriber's. | Semantic (word meaning shifts). | Depends on salience of error. |
  | **4. Pragmatic Encroachment (SSI)** | Yes. | The Subject's (Hannah's). | Metaphysical (justification shifts). | You don't know (usually). |
  | **5. Contrastivism** | Yes. | The Context's relevant alternatives. | Relational (knowledge is ternary). | Depends on contrast class. |
  | **6. Assessment Relativism** | Yes. | The Assessor's (at time of judgment). | Truth is relative to assessor. | Depends on assessor's standards. |

  **Empty Logical Cells:**
  *   *Speaker's stakes change Subject's knowledge (non-semantically):* Unoccupied. There is no motivated theory where my financial stake in your belief changes whether *you* know, unless we are talking about what I can say (Contextualism) or judge (Relativism).
  *   *Subject's stakes change meaning of 'know' for everyone:* Unoccupied. This collapses into Contextualism or SSI. If the subject's stakes change the *meaning* for the speaker, it behaves like Contextualism triggered by the subject.

  ***

  ### Part 2: The Epistemic Stakes Quiz

  **Instructions:** Read each short scenario. Choose the option that matches your immediate gut reaction. Do not overthink the philosophical implications; answer as if you are advising a friend in the story.

  **Q1: The Bank (Low Stakes)**
  Hannah and her partner need to deposit a cheque. It is not urgent; if it bounces, nothing bad happens. Hannah was at the bank two weeks ago on a Saturday and saw it was open. She says, "I know the bank is open tomorrow."
  *   **A)** She is right. She knows.
  *   **B)** She is wrong. She should check again to be sure.
  *   **C)** It depends on who she is talking to.

  **Q2: The Bank (High Stakes)**
  Same as above, but now if the cheque bounces, they will be evicted from their home. Hannah has the exact same evidence (visited two weeks ago). She says, "I know the bank is open tomorrow."
  *   **A)** She is right. She still knows, even if she should check.
  *   **B)** She is wrong. The risk is too high to say she knows.
  *   **C)** She was right then, but we can't say she knows now.

  **Q3: The Airport Stopover**
  Mary is flying to Chicago. She has an itinerary saying the flight stops there.
  *Scenario A:* It matters little if she misses the connection.
  *Scenario B:* She must meet a business partner in Chicago or her company folds.
  In both scenarios, she says, "I know the plane stops in Chicago."
  *   **A)** She knows in both cases.
  *   **B)** She knows in A, but not in B.
  *   **C)** She doesn't really know in either case; itineraries can be wrong.

  **Q4: The Lottery**
  John holds a ticket in a fair lottery with one million tickets. The odds of losing are 99.9999%. Before the draw, he says, "I know I will lose."
  *   **A)** He knows. It is rational to believe he will lose.
  *   **B)** He does not know. He could win.
  *   **C)** He knows for everyday purposes, but not for serious betting.

  **Q5: The Retraction (Crucial)**
  Recall Hannah at the bank (High Stakes). On Friday (Low Stakes), she said, "I know it's open." On Saturday (High Stakes), the bank is closed, and they are evicted. Her partner says, "You said you knew!"
  How should Hannah respond?
  *   **A)** "I was wrong. I didn't actually know."
  *   **B)** "I wasn't wrong then; I spoke loosely. I knew by Friday standards."
  *   **C)** "I knew relative to Friday, but not relative to Saturday."

  **Q6: The Third-Party Stake**
  Hannah (the subject) has Low Stakes (no harm if wrong). You (the observer) have High Stakes (you are betting your house on whether Hannah is right). Hannah says, "I know the bank is open."
  Is her claim true?
  *   **A)** Yes, her knowledge depends on her situation, not mine.
  *   **B)** No, my high stakes make her claim false.
  *   **C)** It is true for her, but false for me.

  **Q7: Action vs. Assertion**
  Suppose Hannah *does* know the bank is open (factually), but the stakes are incredibly high (eviction).
  *   **A)** She should act on it (go straight there) and assert it.
  *   **B)** She should assert it, but not act on it without checking.
  *   **C)** She should neither act on it nor assert it without checking.

  **Q8: The Salient Error**
  Hannah has standard evidence the bank is open.
  *Scenario A:* Nobody mentions the bank might have changed hours.
  *Scenario B:* Someone mentions, "Banks sometimes change hours on holidays," even though it isn't a holiday.
  Does mentioning the possibility change whether she knows?
  *   **A)** No, facts don't change just because we talk about errors.
  *   **B)** Yes, once the error is mentioned, she no longer knows.
  *   **C)** It changes whether she can *say* she knows, not whether she knows.

  **Q9: The Expert vs. The Layperson**
  A bank employee (Expert) and a customer (Layperson) have the same evidence the bank is open. The stakes are high for both.
  *   **A)** The Expert knows, the Layperson does not.
  *   **B)** Both know, or neither knows.
  *   **C)** The Expert can claim to know, the Layperson cannot.

  **Q10: The Time Travel Assessment**
  Hannah says on Friday (Low Stakes): "I know the bank is open."
  On Saturday (High Stakes), you assess her Friday claim.
  *   **A)** Her Friday claim was True.
  *   **B)** Her Friday claim was False.
  *   **C)** Her Friday claim was True for Friday-You, but False for Saturday-You.

  ***

  ### Part 3: Scoring Key

  To score this, tally the responses. This is not a perfect algorithm, but a heuristic map.

  **1. Moderate Invariantism (The 'Common Sense' Engineer)**
  *   **Profile:** Consistent across stakes. Believes knowledge is stable, but action might vary.
  *   **Key Answers:** Q1(A), Q2(A), Q4(A), Q5(B), Q6(A), Q7(B or C).
  *   **Logic:** You think Hannah knows in both bank cases. High stakes change what it is *rational to do*, not whether she *knows*. You likely think the Lottery is known (Q4-A) or that 'know' is fixed (Q8-A).

  **2. Strict / Sceptical Invariantism (The Rigorous Auditor)**
  *   **Profile:** Knowledge is very hard to get. Stakes just reveal the lack of knowledge.
  *   **Key Answers:** Q1(B), Q2(B), Q3(C), Q4(B), Q5(A).
  *   **Logic:** You rarely tick "She knows." You think evidence is almost never enough. High stakes don't destroy knowledge; they just make you notice it wasn't there.

  **3. Contextualism (The Linguistic Analyst)**
  *   **Profile:** The word 'know' changes meaning like 'tall' or 'flat'.
  *   **Key Answers:** Q1(A), Q2(B), Q4(C), Q5(B), Q6(B or C), Q8(B or C).
  *   **Logic:** You think Hannah knows in Low stakes but not High. Crucially, you think she wasn't *wrong* on Friday (Q5-B). The standards shifted. You might feel the Third-Party stake (Q6) affects the truth because the *speaker's* context matters.

  **4. Pragmatic Encroachment / SSI (The Practical Realist)**
  *   **Profile:** Knowledge depends on the subject's practical situation.
  *   **Key Answers:** Q1(A), Q2(B), Q4(B), Q5(A), Q6(A), Q7(C).
  *   **Logic:** Like the Contextualist, you say she knows in Low but not High. *However*, you think she was actually *wrong* on Friday if the stakes were already high (Q5-A). Crucially, in Q6, you say her knowledge depends on *her* stakes, not yours (Subject-Sensitive).

  **5. Contrastivism (The Alternative Tracker)**
  *   **Profile:** Knowledge is always 'knowing P rather than Q'.
  *   **Key Answers:** Q1(A), Q2(B), Q4(C), Q8(B).
  *   **Logic:** You focus on Q8. Mentioning the error changes the *contrast class* (Open vs Closed, vs Open vs Changed Hours). You might align with Contextualism on many answers but distinguish yourself by focusing on which alternatives are being ruled out.

  **6. Assessment Relativism (The Temporal Judge)**
  *   **Profile:** Truth is relative to the person assessing the claim *now*.
  *   **Key Answers:** Q1(A), Q2(B), Q5(C), Q6(C), Q10(C).
  *   **Logic:** This is the distinct sixth leaf. You think the Friday claim can be true when assessed on Friday, but false when assessed on Saturday (Q10-C). You separate the *content* from the *truth value* based on the assessor's context.

  ***

  ### Part 4: Limitations and Caveats

  As a software engineer, you appreciate edge cases. In philosophy, the boundaries between these positions are the ultimate edge cases. Here is where this quiz will fail to compile a clean result:

  **1. Contextualism vs. Pragmatic Encroachment (SSI)**
  This is the hardest distinction. Both predict that "Hannah knows" is true in Low Stakes and false in High Stakes.
  *   *The Quiz Attempt:* We tried to split them using Q5 (Retraction) and Q6 (Third-Party Stakes). SSI says Hannah was wrong (fact changed); Contextualism says she spoke loosely (standards changed). SSI says only Hannah's stakes matter; Contextualism says the Speaker's stakes matter.
  *   *The Reality:* Ordinary folk intuitions are often mushy here. People might say "She was wrong" (SSI) but also "It depends on who's asking" (Contextualism). A short questionnaire cannot fully disentangle semantic shift from metaphysical shift.

  **2. Contrastivism vs. Contextualism**
  These two often yield identical verdicts on cases. Contrastivism is essentially a specific mechanism for Contextualism (shifting alternatives vs shifting standards). Unless the user has a strong intuition about *contrast classes* specifically (Q8), they will likely score as a Contextualist.

  **3. Moderate Invariantism vs. Strict Invariantism**
  This depends entirely on the Lottery Case (Q4) and the baseline Bank Case (Q1). If a user is inconsistent about the Lottery (e.g., "I know I'll lose" vs "I don't know"), they might bounce between Moderate and Strict. Many people are 'contextualists' about the lottery but 'invariantists' about the bank.

  **4. The 'Folk' are not Philosophers**
  Most people do not have stable intuitions. They might answer Q2 based on what Hannah should *do* (Action), not what she *knows* (Epistemology). This quiz tries to separate Action from Knowledge (Q7), but users often conflate "She doesn't know" with "She shouldn't act." This noise will produce mixed results (e.g., a user might score as 40% Invariantist, 40% SSI).

  **Recommendation for Implementation:**
  Do not present the result as a definitive label ("You are a Contextualist"). Present it as a tendency ("Your intuitions lean towards..."). Display the top two matching positions if the score is close. Acknowledge that the debate is live and unresolved amongst professionals; if experts cannot agree on the edge cases, a quiz certainly cannot.
