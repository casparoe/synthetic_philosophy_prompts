answer: |-
  Your hypothesis is exceptionally sharp, and you have correctly identified the structural reason the debate feels stalled: **the participants are playing different games on different boards.**

  The Socialist Calculation Debate (SCD) is not one argument; it is a palimpsest of three distinct arguments layered over one another. When Mises, Lange, and Hayek speak, they are often using the same words ("price," "calculation," "socialism") to refer to fundamentally different categories of phenomena.

  Here is a diagnosis of the disagreement, the validity of the modern "digital" counter-argument, and what would actually constitute progress.

  ### 1. The Diagnosis: Three Distinct Problems Conflated
  You identified Incentives, Epistemology, and Computation. We can map these directly to the specific phases of the debate to show why "victory" is elusive.

  **A. The Accounting Problem (Mises, 1920)**
  *   **The Claim:** Without private property in the means of production, there are no genuine exchange prices. Without prices, there is no common denominator for cost. Without cost, there is no rational way to choose between production methods.
  *   **The Nature:** This is an *institutional* and *accounting* argument. It is not about computing power; it is about the existence of the data itself.
  *   **Lange's Reply:** We can simulate prices via trial and error (*tâtonnement*).
  *   **The Mismatch:** Mises argued you can't have the numbers without the property relations. Lange argued you can have the numbers via administrative fiat. They talked past each other. Mises was talking about *opportunity cost* revealed through ownership risk; Lange was talking about *shadow prices* derived from scarcity constraints.

  **B. The Engineering Problem (Lange/Lerner, 1930s)**
  *   **The Claim:** The economy is a system of simultaneous equations. If we know the constraints (resources) and the parameters (preferences), a Central Planning Board (CPB) can solve for equilibrium prices.
  *   **The Nature:** This is a *computational* and *static equilibrium* argument. It treats the economy as a machine to be optimized.
  *   **Hayek's Reply (1937/1945):** The data (preferences, local conditions, technological possibilities) does not exist *prior* to the market process. It is dispersed, tacit, and often created by the act of trading itself.
  *   **The Mismatch:** Lange accepted the Neoclassical assumption that preferences and production functions are *given*. Hayek argued they are *discovered*. Lange was solving a math problem; Hayek was describing a learning process.

  **C. The Incentive Problem (The Unspoken Third Leg)**
  *   **The Claim:** Even if the CPB *could* calculate the right prices, why would plant managers report accurate cost data or innovate?
  *   **The Nature:** This is a *principal-agent* and *public choice* problem.
  *   **The Status:** Lange largely assumed benevolent bureaucrats. The Austrians assumed rational self-interest. This wasn't fully formalized until Mechanism Design Theory (Hurwicz, Maskin) in the late 20th century, which essentially proved Lange's model required incentive compatibility constraints that socialist systems structurally lacked.

  **Diagnosis:** The debate stalls because a solution to **B** (we have supercomputers now!) is presented as a solution to **A** (we still lack property-based opportunity costs) and **C** (managers still lie), while Hayek's objection is actually **D** (the data doesn't exist to be computed).

  ### 2. Is "Digital Socialism" Engaging the Real Argument?
  The modern revival (Cockshott, Cottrell, and various "Project Cybersyn" enthusiasts) generally engages a **straw version of the Austrian argument**, specifically by conflating Mises' Calculation Problem with Hayek's Knowledge Problem.

  **The Digital Argument:**
  Big Data and AI can process the information required to allocate resources efficiently without markets. Amazon and Walmart are cited as proof that large-scale planning works.

  **The Austrian Counter-Diagnosis:**
  1.  **The Data Generation Problem:** Algorithms optimize based on *existing* data. Hayek's point was that market prices *generate* new information. When an entrepreneur takes a risk, they aren't processing existing data; they are creating a new data point (profit/loss) that tells the rest of the economy what is valuable. An algorithm can optimize a known landscape; it cannot explore a landscape that is being created by the exploration itself.
  2.  **The Amazon Fallacy (Coasean Limits):** Amazon is a planned economy *inside* a market economy. It relies on external market prices for capital goods, labor, and logistics to calculate its own internal efficiency. If Amazon were the *entire* economy, it would have no external price signals to anchor its internal transfer pricing. It would suffer from the same cost-blindness Mises identified.
  3.  **Tacit Knowledge:** Machine learning requires data to be digitized. Hayek emphasized *tacit* knowledge (knowing how to fix a machine by the sound it makes, knowing a neighborhood's potential). This knowledge is often non-codifiable. If it cannot be digitized, it cannot be input into the algorithm.

  **Verdict:** Digital Socialism solves the **Engineering Problem** (B) better than Lange could. It does not address the **Accounting Problem** (A) (property/opportunity cost) or the **Epistemic Problem** (D) (data generation/tacit knowledge).

  ### 3. What Would Count as Progress?
  Since this is a paradigm clash (Static Equilibrium vs. Dynamic Process), a "knockout" empirical victory is unlikely. However, we can define what theoretical progress looks like.

  **A. What Would NOT Count as Progress:**
  *   **"The USSR Collapsed":** Austrians claim this vindicates them; Socialists claim the USSR wasn't "real" socialism (it lacked democracy/Lange's rules). This is unfalsifiable historical storytelling.
  *   **"Computers are Faster":** This addresses the 1930s engineering objection but ignores the 1940s epistemic objection.
  *   **"Amazon Works":** As noted, this ignores the external market environment.

  **B. What WOULD Count as Progress:**
  1.  **Formalizing the "Discovery" Mechanism:** Progress would look like a formal model that demonstrates *how* prices transmit tacit knowledge, moving beyond Hayek's metaphorical description. If information economics can mathematically model the "discovery procedure" of the market versus the "optimization procedure" of planning, the debate moves from philosophy to mechanism design.
  2.  **Mechanism Design with Information Constraints:** The field of Mechanism Design has largely absorbed the SCD. Progress here is acknowledging that the "Socialist" goal (equality/welfare) is constrained by the "Austrian" reality (information asymmetry/incentives). The debate shifts from "Can we plan?" to "What is the cost of the specific mechanism used to aggregate information?"
  3.  **The "Impossibility" of Counterfactuals:** A rigorous admission that we cannot know the *counterfactual* performance of a planned economy. We cannot know what the USSR *would* have produced with perfect computers. Acknowledging this epistemic limit would end the "post-mortem" wrangling.

  ### 4. Is the Debate Unfalsifiable?
  There is a risk that the Austrian position, particularly Hayek's, has drifted into unfalsifiability.
  *   **The Trap:** If a planned economy fails, the Austrian says, "See, knowledge problem." If it succeeds (e.g., wartime mobilization), the Austrian says, "That was temporary/simplified goals." If a market fails (2008 crisis), the Austrian says, "That was state intervention."
  *   **The Fix:** The Austrian argument needs to be framed as a **comparative institutional analysis**, not an absolute impossibility theorem. The claim shouldn't be "Planning is impossible," but "Planning incurs higher epistemic costs as complexity and dynamism increase."

  ### Summary Diagnosis
  The debate has stalled because it is a **category error** sustained by historical inertia.
  *   **Lange** won the argument against **Mises (1920)** on technical grounds (you *can* simulate prices).
  *   **Hayek** won the argument against **Lange** on philosophical grounds (simulation isn't discovery).
  *   **Modern Tech** is trying to refight **Mises (1920)** with better calculators, ignoring **Hayek**.

  **Progress** will not come from declaring a winner. It will come from dissolving the debate into **Information Economics** and **Mechanism Design**. The question is no longer "Socialism vs. Capitalism" in the abstract, but "Under what specific constraints of information and incentive compatibility does decentralized pricing outperform centralized algorithmic allocation?"

  Until the participants agree on whether the economic problem is **allocating given resources** (Neoclassical/Lange) or **coordinating plan revisions in uncertainty** (Austrian/Hayek), they will continue to declare victory in wars the other side isn't fighting.
