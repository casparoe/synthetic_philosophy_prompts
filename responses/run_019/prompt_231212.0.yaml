answer: |-
  Hi there,

  It sounds like you had a lively evening, and while your friend's slogan is rhetorically powerful, you are right to suspect that it is doing a lot of heavy lifting without actually proving anything on its own. To really settle the argument, we need to unpack the phrase into the distinct claims it could be making, because depending on which meaning your friend intended, the conclusion about Kosovo, Iraq, and Libya changes significantly.

  The most literal reading of the slogan is simply that bombs are physical instruments of destruction that kill people and demolish infrastructure. This is a mere platitude. Obviously, explosives cause death and damage, often to civilians. However, this reading does not support the conclusion that the interventions were unjustified. Under just war theory and standard humanitarian intervention frameworks, the use of force is permissible if it is necessary to prevent a greater evil, such as genocide or ethnic cleansing. If bombing a military target stops a massacre, the physical destructiveness of the bomb does not automatically render the act unjustified, provided the collateral damage is proportionate. So, if your friend only meant that bombs are dangerous, he hasn't actually argued against the interventions.

  A second reading focuses on the motives of the intervening states, suggesting that nations never act out of pure humanitarian concern and always have ulterior geopolitical or economic interests. This is a substantive but contestable claim. It is historically true that states usually have mixed motives, but the presence of strategic interests does not necessarily negate the humanitarian outcome. A doctor might save a life for money, but the patient is still saved. If this thesis is accepted, it challenges the moral purity of the interveners but does not strictly prove that the interventions were unjustified in their effects. Regarding Kosovo, Iraq, and Libya, one could argue that NATO had strategic interests in all three, but that alone does not prove the interventions were wrong if they successfully protected civilians, which is debatable in the case of Iraq and Libya but often affirmed regarding Kosovo.

  A third interpretation is consequentialist, claiming that military intervention inevitably produces worse humanitarian outcomes than non-intervention due to blowback, chaos, or long-term instability. This is also a substantive but contestable claim, and it is the only one that, if proven true, would strongly support the conclusion that all three interventions were unjustified. If bombing always creates more suffering than it prevents, then no humanitarian intervention can be justified. The evidence here is mixed across your three cases. Iraq is often cited as proof of this thesis because the intervention led to massive civilian casualties and state collapse. Libya is similarly contested, as the removal of Gaddafi led to prolonged instability, though it did prevent an imminent massacre in Benghazi. Kosovo is the strongest counter-example, where many argue the intervention successfully halted ethnic cleansing without leading to prolonged major conflict. Therefore, this reading supports your friend's conclusion only if one ignores the specific outcomes in Kosovo or argues that the long-term consequences there were also net negative.

  The fourth and strongest reading is conceptual, asserting that the very idea of humanitarian violence is an oxymoron because violence is inherently incompatible with human welfare. This is a substantive philosophical claim that many would argue is false. It assumes that force can never be a tool for protection, ignoring scenarios where passive non-intervention allows for greater atrocities, such as in Rwanda. If this thesis were true, it would define all three interventions as unjustified by definition, regardless of their motives or outcomes. However, most international law and ethical frameworks reject this absolute prohibition, accepting that coercive force can sometimes be the only way to uphold human rights.

  Ultimately, the slogan works best as a rhetorical check against hubris rather than a logical proof. The literal meaning is true but irrelevant to justification. The motive argument undermines the moral character of the interveners but not necessarily the act itself. The conceptual argument is likely false because it ignores the necessity of force in extreme cases. Only the consequentialist claim actually supports the conclusion that Kosovo, Iraq, and Libya were unjustified, but that claim requires empirical evidence that is not uniform across all three cases. Your friend may feel the matter is settled, but logically, he has only asserted a premise that requires further proof to condemn all three interventions equally.

  Best regards,

  Your Friend
