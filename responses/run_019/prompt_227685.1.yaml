answer: |-
  **Seminar Plan: Gongsun Long's 'White Horse Dialogue'**
  **Duration:** 50 minutes
  **Level:** First-year Undergraduate (Cross-Cultural Philosophy of Language)

  ### 1. Prerequisites: Conceptual Scaffolding
  Before the text can be read as anything other than a falsehood, you must establish two distinctions in the first ten minutes. Do not assume the students possess these intuitively; the 'common sense' view of language will actively fight against Gongsun Long.

  *   **Extension vs. Intension:** You must distinguish between the set of objects a term applies to (extension) and the criteria or requirements a term imposes (intension). If they conflate these, the argument collapses.
  *   **Identity vs. Classification:** You must separate the claim 'A is identical to B' from 'A is a member of the class B'. The dialogue turns on *fei* (is not/is not identical to). If students interpret *fei* solely as class membership, the thesis is trivially false.

  **Action:** Do not begin with the text. Begin by eliciting these distinctions through a modern analogue.

  ### 2. Structural Strategy: The Modern Analogue
  Do not let the 'White Horse' carry the session alone. The historical and linguistic distance is too great for a fifty-minute seminar; the 'exoticism' will distract from the logic. Build the structure on a modern analogue first, then map the text onto it.

  **Recommended Analogue:** "A 'red pen' is not a 'pen'."
  *   **Scenario:** Ask the class: "If I ask you to fetch a 'pen', a blue one suffices. If I ask for a 'red pen', a blue one fails. Therefore, the instruction 'red pen' is not the instruction 'pen'."

  **What the Analogue Must Preserve:**
  *   **Compound Specificity:** It must show how adding a modifier changes the *criteria* of the term, not just the object.
  *   **Functional Difference:** It must demonstrate that in certain contexts (e.g., fulfilling a request), the compound term and the simple term are not interchangeable.

  **What the Analogue Must Not Smuggle In:**
  *   **Ontological Denial:** Ensure students do not think you are claiming red pens do not exist. Gongsun Long admits white horses exist; he disputes the *name*.
  *   **Western Essentialism:** Avoid implying that 'Pen' refers to a Platonic Form. Keep the focus on linguistic usage and criteria.
  *   **Ambiguity:** Do not use an analogue based on lexical ambiguity (e.g., "A 'bank' is not a 'bank'"). The point is not that the word sounds the same, but that the *concept* differs.

  ### 3. Mapping Misconceptions and Intervention Points
  You must anticipate three specific misconceptions. Do not wait for them to arise; head them off at the following precise moments in the sequence.

  **A. "It is mere sophistry/wordplay."**
  *   **When to head it off:** **Minutes 0–5 (Introduction).**
  *   **How:** Frame the School of Names (*Ming Jia*) immediately as serious metaphysicians concerned with the rectification of names (*zheng ming*), crucial for governance and logic in the Warring States period. State clearly: "We are treating this as a rigorous argument about reference, not a joke." If you allow them to treat it as a riddle initially, you will never recover their seriousness.

  **B. "It reduces to subsets and Venn diagrams."**
  *   **When to head it off:** **Minutes 20–25 (During Argument Reconstruction).**
  *   **How:** When reconstructing Gongsun Long's premise that 'Horse' names the shape and 'White' names the colour, students will instinctively draw a circle of 'Horses' with a smaller circle of 'White Horses' inside it. Interrupt this. Explain that Gongsun Long is arguing about the *identity of the concepts*, not the inclusion of the objects. If they rely on set theory, they miss the point that the *compound name* has a different intension than the *simple name*.

  **C. "It is really about Chinese grammar (mass terms vs. count nouns)."**
  *   **When to head it off:** **Minutes 35–40 (Post-Reconstruction/Critique).**
  *   **How:** Some students (or secondary literature they may Google later) will claim *ma* (horse) acts as a mass term like 'water'. Acknowledge this linguistic hypothesis briefly but bracket it. Say: "Even if we translate into English count nouns, the logical problem persists. We are analysing the philosophical argument, not the philological debate." Do not let the session dissolve into a grammar lesson.

  ### 4. Closing Question: Testing Grasp vs. Memorisation
  Do not ask: "What is Gongsun Long's conclusion?" (This tests memory).
  Do not ask: "Is a black horse a horse?" (This is too easily guessed).

  **Ask this instead:**
  > "If I ask you to bring me a 'horse', and you bring me a 'white horse', have you fulfilled my request? According to Gongsun Long, why might the answer be 'yes' regarding the object, but 'no' regarding the name?"

  **Rationale:** This forces them to distinguish between the *extension* (the object brought satisfies the physical need) and the *intension* (the name provided does not match the name requested). If they can articulate that split, they have grasped the argument.

  ### 5. Scope Limitation: What to Refuse
  You must openly refuse to cover **the definitive translation of the particle *fei* (is not).**

  **Reasoning:** There is a significant sinological debate over whether *fei* means 'is not', 'is not identical to', or 'is not the same class as'. At first-year level, attempting to resolve this will consume the entire seminar and bog you down in linguistics.
  **Instruction:** Tell the students: "We will treat *fei* as 'is not identical to' for the sake of this argument. Whether this is the only valid translation is a matter for advanced sinology, but the philosophical problem remains regardless of the translation." This keeps the focus on the philosophy of language rather than translation theory.
