      *   *Verdict:* The test does *not* survive the objections. It's a thought experiment that fails as a practical criterion. The author admits this ("We rarely get to run it"). It should probably be reframed as a heuristic or abandoned for a better one (e.g., looking for cross-cultural stability without institutional export).
