      *   *Literature Assumption:* Is it prevalent to assume perpetual instability? Many followers of Hacking (e.g., in critical psychiatry) do lean this way. However, mainstream psychiatry (e.g., DSM developers) often aims for stability. The author is critiquing the *philosophical implication* of the looping effect, not necessarily the clinical practice.
      *   *Verdict:* Generally accurate, but needs a slight nuance check. Hacking allows for temporary stability. The "permanently moving targets" claim is the weak point.

  4.  **Address Question 2: Distinctness of Mechanisms**
      *   *Mechanisms:* 1. Saturation (institutional routing), 2. Semantic Capture (vocabulary monopoly), 3. Reflexive Professionalism (classifier bias).
      *   *Analysis:*
          *   Saturation is about *behavior* and *institutions*.
          *   Semantic Capture is about *language* and *conceivability*.
          *   Reflexive Professionalism is about *epistemic practice* of the experts.
      *   *Overlap:* Semantic capture feels like a subset of saturation (institutions control language). Reflexive professionalism relies on saturation (only seeing confirming cases because institutions filter them).
      *   *Critique:* They are distinct *levels* of analysis (ontological/behavioral, linguistic, epistemic), but they are deeply intertwined. Semantic capture isn't *just* saturation; it's about the *possibility of thought*. But in practice, they reinforce each other. The distinction is useful analytically but might be messy empirically.
