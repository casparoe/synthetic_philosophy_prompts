      *   Randomizers: Hats with numbers, Spinners (paperclip + pin), Confetti/Beans.
      *   Tally sheets.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Dropping a bean to find a midpoint is physically hard to make uniform. People aim for the center.
      *   *Fix:* For the "Midpoint" group, give them a grid of dots inside the circle and have them pick a dot blindly? Or use the "Throw a dart at a square board, if it lands in circle, keep it" method? That's too slow.
      *   *Alternative for Midpoint:* Use the "Random Coordinates" method but simplified. Pick a number 0-10 for X, 0-10 for Y from a hat. Plot point. If outside circle, discard. This ensures uniform over square, which induces non-uniform over circle... wait.
      *   *Actually:* The standard "Random Midpoint" paradox solution assumes uniform distribution over the *area* of the circle.
      *   *Let's stick to the simplest physical analog:*
          *   Method 1 (1/3): Two angles.
          *   Method 2 (1/2): One angle, one distance (0 to R).
          *   Method 3 (1/4): Drop a bean. Acknowledge the bias in the debrief (humans aim center), but the *intended* logic is area. Actually, to make it robust: Give them a sheet with 100 pre-printed dots distributed uniformly in the circle. They pick 20 slips of paper numbered 1-100 from a hat and mark those dots. This guarantees the distribution.

      *   *Wait, one more check on the "Triangle" benchmark:*
          *   If the chord is longer than the side of the inscribed triangle, does it intersect the triangle?
          *   Side length $L = R\sqrt{3}$.
          *   Chord length $C = 2\sqrt{R^2 - d^2}$.
          *   $C > L \iff 4(R^2 - d^2) > 3R^2 \iff 4R^2 - 4d^2 > 3R^2 \iff R^2 > 4d^2 \iff d < R/2$.
          *   So the chord is "Long" if its distance from center is less than half the radius.
          *   The inscribed triangle's sides are all at distance $R/2$ from the center.
          *   So, a chord is "Long" if and only if it **intersects the interior of the inscribed equilateral triangle**.
          *   *Perfect.* This is the visual key. Print the triangle. If the line crosses the triangle's inside, it's a "Long" chord. No measuring needed.

