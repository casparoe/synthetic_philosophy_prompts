  2.  **Deconstruct Bertrand's Paradox for a Workshop:**
      *   The paradox arises because "random chord" isn't a well-defined physical object; it's a *process*.
      *   The three classic methods are:
          1.  *Random Endpoints:* Pick two points on the circumference. (Prob = 1/3)
          2.  *Random Radius:* Pick a radius, pick a point on it, draw perpendicular chord. (Prob = 1/2)
          3.  *Random Midpoint:* Pick a point inside the circle as the midpoint. (Prob = 1/4)
