prompt: |-
  I'm a program officer at a small family foundation making around forty grants a year, mostly $20k to $200k, and my board has started pressing me on why I fund one thing and not another. I keep seeing the importance/tractability/neglectedness framework waved around, but never as an actual procedure I can run in the hour I have per application. Please write me a reusable decision procedure (questions in order, what a good enough answer looks like, where it stops with a no, and where it stops with "this is a values call") based on what's actually defensible in that framework—not a version that pretends the three factors just multiply. Then run it on two or three cases: (a) a very neglected cause with low tractability, (b) a crowded but highly tractable cause, and maybe (c) a huge cause already awash in money. Make at least one case come out as a no to something I'd personally love to fund. Be explicit about which steps are settled among people who do cause prioritization and which are contested or judgment calls, and say what the procedure can't handle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Program Officer at a small family foundation (~40 grants/year, $20k-$200k).
      *   **Problem:** Board pressing for justification on funding choices.
      *   **Constraint:** Needs a reusable decision procedure based on Importance/Tractability/Neglectedness (ITN), but practical (1 hour/app), not just theoretical multiplication.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Stop conditions (No vs. Values Call).
          *   Run on 3 cases: (a) Neglected/Low Tractability, (b) Crowded/High Tractability, (c) Huge/Awash in money.
          *   At least one "No" to something the PO might love.
          *   Explicitly label settled vs. contested steps.
          *   Acknowledge limitations.

  2.  **Deconstruct the ITN Framework for Practical Use:**
      *   *Standard EA View:* Impact = Importance $\times$ Tractability $\times$ Neglectedness.
      *   *Problem:* Multiplication implies compensability (huge importance can offset zero tractability). In reality, there are hard constraints (e.g., if it's impossible, importance doesn't matter).
      *   *Adaptation:* Use ITN as a *filter* or *hurdle* system rather than a scoring matrix. This fits the "1 hour per application" constraint better.
      *   *Sequence:* Importance first (is it worth doing?), then Tractability (can *we* do it?), then Neglectedness (does *our* money matter?).
      *   *Values Call:* Where does the foundation's specific mission fit in? ITN is objective(ish); mission is subjective.

  3.  **Drafting the Procedure (The "ITN Filter"):**
      *   *Goal:* Defensibility. The board wants to know *why*.
      *   *Step 1: Importance (The "So What?" Test).* Is the problem big enough?
          *   Threshold: Does it affect many lives or deeply affect few?
          *   Stop: If trivial, No.
      *   *Step 2: Tractability (The "Can We Move the Needle?" Test).* Is there a plausible theory of change?
          *   Threshold: Evidence of success elsewhere? Clear path?
          *   Stop: If hopeless or purely advocacy with no leverage, No.
      *   *Step 3: Neglectedness/Funding Gap (The "Marginal Dollar" Test).* Is there room for us?
          *   Threshold: Are others funding this? Would our $50k change anything?
          *   Stop: If fully funded by gov/large foundations, No (unless niche).
      *   *Step 4: Fit (The "Values" Test).* Does this align with family values/mission?
          *   This is where the "Values Call" happens.

      *Refining for the "1 Hour" Constraint:* Need specific questions that can be Googled or answered by the applicant quickly.
      *Refining for "Defensibility":* Need to distinguish between "Objective ITN" and "Subjective Mission."

  4.  **Developing the Cases:**
      *   *Case A (Neglected/Low Tractability):* Maybe something like "Consciousness Rights for Invertebrates" or "Long-term Existential Risk via Speculative Tech." Let's go with *Wild Animal Suffering (Invertebrates)*. High importance (numbers), High Neglectedness (no one cares), Low Tractability (we don't know how to help).
      *   *Case B (Crowded/High Tractability):* *Local Arts/Culture* or *Established Medical Research*. Let's go with *Established Cancer Research at a Major University*. High Importance, High Tractability, Low Neglectedness (awash in cash).
      *   *Case C (Huge/Awash):* *Disaster Relief (immediate)* or *Public School Funding*. Let's go with *Public School Teacher Salaries in a Well-Funded District*. High Importance, Medium Tractability, Zero Neglectedness (taxes cover it).
      *   *Requirement:* One "No" to something the PO loves. I'll make Case B the "PO loves arts/culture" but the framework says No. Or Case A (PO loves weird frontier stuff). Let's make Case B the "Passion Project" that fails the Neglectedness test.

  5.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Marginal utility of money matters (diminishing returns). Theory of change is required.
      *   *Contested:* How to compare vastly different causes (health vs. arts). How to weigh future generations vs. current people. The exact definition of "neglected."

  6.  **Addressing Limitations:**
      *   Doesn't capture capacity building.
      *   Doesn't capture learning value.
      *   Doesn't capture donor passion (which keeps donors giving).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the tension between EA rigor and Foundation reality.
      *   *The Procedure:* Call it the "Marginal Impact Filter."
      *   *Step 1 (Scale):* 10 mins.
      *   *Step 2 (Tractability):* 20 mins.
      *   *Step 3 (Marginal Utility):* 20 mins.
      *   *Step 4 (Mission Fit):* 10 mins.
      *   *The Cases:*
          *   (a) Wild Animal Welfare (The "No" on Tractability).
          *   (b) Local Symphony Orchestra (The "No" on Neglectedness/Scale - *Wait, let's make this the passion project*).
          *   (c) Global Health (Bednets) - The "Yes" (High on all).
          *   *Correction:* Prompt asks for (a) Neglected/Low Tractability, (b) Crowded/High Tractability, (c) Huge/Awash.
          *   Let's align strictly:
              *   (a) Invertebrate Welfare (Neglected, Low Tractability). Result: No (Tractability).
              *   (b) Top-Tier University Cancer Lab (Crowded, High Tractability). Result: No (Marginal Utility). *Make this the PO passion.*
              *   (c) Policy Reform in Developing Nation (Huge, Awash? No, prompt says "Huge cause already awash in money"). Let's use *US Public Education Funding*. Result: No (Marginal Utility).
              *   *Wait, I need a "Yes" or at least a nuanced outcome.* The prompt asks to run the cases, implying I should show how the procedure processes them. It doesn't explicitly demand a "Yes," but a procedure that only says "No" is useless. I should probably tweak one to show a "Yes" or a "Values Call."
              *   Actually, the prompt says "Make at least one case come out as a no to something I'd personally love to fund." It doesn't say the others *must* be Yes. But a procedure needs to fund 40 grants. I will structure the analysis to show *why* it stops or passes.
              *   Let's make (b) the "Passion Project" that gets rejected.
              *   Let's make (a) a "Values Call" (maybe the family cares about frontier risks).
              *   Let's make (c) a clear "No."

      *   *Refining the "Values Call":* The ITN framework is utilitarian. Family foundations are often deontological or virtue-based. The procedure must explicitly hand off to "Board Mission" when ITN is ambiguous or when the foundation accepts lower ITN for mission alignment.

  8.  **Final Polish:**
      *   Tone: Professional, pragmatic, respectful of the board's need for rigor but acknowledging the PO's time limits.
      *   Formatting: Clear headers, bullet points, bold text for decisions.
      *   Check constraints: 1 hour/app? The procedure needs to be fast. I will emphasize *evidence thresholds* rather than deep research.

      *(Self-Correction during drafting)*: I need to be careful not to just import Effective Altruism (EA) dogma. A family foundation might care about "community" or "legacy." The procedure needs to separate *Impact Logic* (ITN) from *Mission Logic* (Values).
      *   Step 1-3 = Impact Logic (Defensible to board as "stewardship").
      *   Step 4 = Mission Logic (Defensible to board as "fiduciary duty to donor intent").

      *Let's finalize the cases:*
      1.  **Case A:** Wild Animal Suffering (Invertebrates). Neglected: High. Tractability: Low. Importance: Debatable. *Outcome: No (Tractability).*
      2.  **Case B:** Endowment for Local Arts Museum. Crowded (in terms of prestige donors), High Tractability (money buys art), Importance: Local cultural value. *Outcome: No (Marginal Utility/Neglectedness) - This will be the "PO loves it" rejection.*
      3.  **Case C:** Disaster Relief Fund (Red Cross). Huge Cause, Awash in money. *Outcome: No (Marginal Utility).*
      *Wait, if all are No, the PO funds nothing.* I need to explain that this is a *filter*. If it passes, it goes to the "Shortlist." I will add a note that passing the filter doesn't guarantee funding, but failing it requires a "Values Override."
      *Actually, better:* I will tweak Case A to be a "Values Call" (Family specifically cares about frontier ethics) to show where the procedure stops and the Board decides.
      *Let's stick to the prompt's specific descriptions:*
      (a) Neglected/Low Tractability.
      (b) Crowded/High Tractability.
      (c) Huge/Awash.
      I will analyze them honestly. If the framework says No to all, that's the point of the exercise (showing the bar). But I should indicate where a "Values Override" could happen.

      *Revised Plan for Cases:*
      (a) **Invertebrate Welfare.** Fails Tractability. *PO loves it (frontier).* -> **NO.**
      (b) **Local Hospital Wing.** Crowded/High Tractability. *PO loves it (local visibility).* -> **NO (Marginal Dollar).**
      (c) **Global Health (Bednets).** Huge but *not* awash (actually neglected relative to need). Wait, prompt says (c) "Huge cause already awash in money." Okay, **US Public School Salaries.** -> **NO.**
      *Critique:* This makes the foundation look like it funds nothing. I need to clarify that this procedure identifies *high leverage*. If the foundation wants to fund local/community stuff, that's a *Mission* choice, not an *Impact* choice. I must distinguish "Impact Maximization" from "Mission Fulfillment."
      *Better approach:* The procedure determines if the grant is *defensible as high-impact*. If it fails, it must be defended as *Mission-Aligned*.
      *Okay, I will write the procedure to flag "Standard Impact Grant" vs. "Mission Grant."*

      *Wait, one more check:* "Make at least one case come out as a no to something I'd personally love to fund." Okay, I will ensure Case B is the passion project that gets cut.

      *Structure:*
      1. Context Setting (ITN as Filter, not Score).
      2. The Procedure (4 Steps).
      3. Settled vs. Contested.
      4. Limitations.
      5. The Cases.

      *Let's write.*
answer: |-
  This is a common tension. Your board wants the defensibility of Effective Altruism (EA) without the 40-hour research deep-dives EA analysts do. The standard ITN (Importance, Tractability, Neglectedness) framework is often presented as a multiplication formula ($Impact = I \times T \times N$), but that is mathematically misleading for philanthropy. If Tractability is near zero, it doesn't matter how Important the problem is; the product is zero.

  For a program officer with one hour per application, ITN works best as a **sequential filter**, not a scoring matrix. You are looking for *binding constraints*. If any single factor is a hard "no," the grant is indefensible as a high-impact investment, regardless of the other two.

  Below is a reusable decision procedure designed for speed and board defensibility. It separates **Stewardship Logic** (ITN) from **Mission Logic** (Values).

  ### The "Marginal Impact Filter" Procedure
  **Time Budget:** 60 Minutes
  **Goal:** Determine if a grant is defensible as *high-leverage stewardship* or if it requires a *values-based override*.

  #### Step 1: Importance (The Scale Check)
  *Time: 10 Minutes*
  **Question:** If this project succeeds completely, how many lives are significantly improved (or saved), and by how much?
  **Evidence Needed:** Applicant's theory of change + one external data point (e.g., census data, disease prevalence, academic consensus).
  **Pass Threshold:**
  *   **High:** Affects >1,000 people deeply OR >10,000 people moderately.
  *   **Medium:** Affects <1,000 people but addresses a rights violation or existential risk.
  *   **Fail:** Primarily benefits a closed group (e.g., members of a specific club) or is purely symbolic without downstream effects.
  **Stop Condition:** If **Fail**, stop. **Decision: NO.** (Unless this is purely a "community building" grant mandated by mission).

  #### Step 2: Tractability (The Leverage Check)
  *Time: 20 Minutes*
  **Question:** Is there evidence that money *specifically* solves this problem, and is this organization the right vehicle?
  **Evidence Needed:** Past success metrics from this org OR evidence that similar interventions worked elsewhere.
  **Pass Threshold:**
  *   **Clear:** Intervention has a track record (e.g., bednets, job training placements).
  *   **Plausible:** Strong theoretical basis + pilot data, even if new.
  *   **Fail:** Problem is structural/political with no clear lever for a $50k grant, or the organization has no track record of execution.
  **Stop Condition:** If **Fail**, stop. **Decision: NO.** (This is the "hopeless cause" filter).

  #### Step 3: Neglectedness / Marginal Utility (The Funding Gap Check)
  *Time: 20 Minutes*
  **Question:** If we *don't* fund this, will someone else? Is our $50k the marginal dollar that unlocks the outcome, or just a drop in the bucket?
  **Evidence Needed:** List of current funders, government budget allocation, or org's unrestricted reserve status.
  **Pass Threshold:**
  *   **High Gap:** Org is at risk of shutting down without this, or the specific project has no other funding sources.
  *   **Medium Gap:** Project is funded, but this grant allows expansion/risk-taking.
  *   **Fail:** The cause is fully funded by government/large endowments, or the org has >2 years of operating reserves and no specific plan for this capital.
  **Stop Condition:** If **Fail**, stop. **Decision: NO** (for Impact purposes). *Note: This is where most "prestige" grants fail.*

  #### Step 4: Mission Fit (The Values Call)
  *Time: 10 Minutes*
  **Question:** Does this align with the family's specific values, even if the ITN score is low?
  **Decision:**
  *   **Yes + Passed Steps 1-3:** **Fund.** (Defensible as Impact + Mission).
  *   **Yes + Failed Step 3 (Neglectedness):** **Values Override.** (Defensible only as Mission, e.g., "We fund local arts because we live here," not because it's high-impact).
  *   **Yes + Failed Step 2 (Tractability):** **No.** (You cannot defend funding hopeless causes, even for values).
  *   **No:** **No.**

  ---

  ### Settled vs. Contested Ground
  When presenting this to your board, be explicit about what is objective and what is subjective.

  **Settled (Defensible as Stewardship):**
  *   **Diminishing Returns:** The 10th million dollars to a cause usually does less than the first $50k. (Step 3).
  *   **Theory of Change:** Money must have a plausible path to impact. Funding "awareness" without a mechanism for action is weak. (Step 2).
  *   **Counterfactuals:** We must ask "What happens if we don't write this check?" (Step 3).

  **Contested (Judgment Calls):**
  *   **Comparing Causes:** Is saving a life "more important" than funding a symphony? ITN says yes; a family valuing legacy might say no. This is Step 4.
  *   **Time Horizon:** Do we value future generations (existential risk) equally to current people?
  *   **Risk Tolerance:** Is it better to fund 10 safe bets or 1 risky moonshot?

  **What This Procedure Can't Handle:**
  *   **Capacity Building:** Sometimes an org needs money just to survive so they *can* be effective later. (Treat as Step 3 "Medium Gap").
  *   **Learning Value:** Funding a failure to learn what doesn't work. (Must be explicitly budgeted as "R&D").
  *   **Donor Passion:** If the family loses passion, the foundation closes. Sometimes you fund Step 4 Overrides to keep the family engaged.

  ---

  ### Case Studies
  Here is how the filter runs on three specific scenarios.

  #### Case A: The Frontier Cause (Neglected / Low Tractability)
  **Proposal:** A research grant to study the welfare of invertebrates (insects) in the wild to determine if human intervention could reduce their suffering.
  **Request:** $50,000.
  **PO Personal View:** You find this intellectually fascinating and love the frontier thinking.

  *   **Step 1 (Importance):** *Pass (Debatable).* If insects are sentient, the numbers are astronomical (trillions). If not, it's zero. Let's grant "Medium" due to existential uncertainty.
  *   **Step 2 (Tractability):** *Fail.* There is currently no known technology or method to intervene in wild insect ecosystems without causing ecological collapse. The grant funds *research*, not solutions. There is no clear path from "study" to "reduced suffering" in the next decade.
  *   **Step 3 (Neglectedness):** *Pass.* Almost no one funds this.
  *   **Step 4 (Mission):** *Values Call.*

  **Decision:** **NO (on Impact Grounds).**
  **Board Defense:** "While the scale is potentially huge, we have no evidence that money can currently solve this problem. Funding this would be speculation, not philanthropy. Unless the Board wishes to designate this as 'R&D' explicitly, it fails the Tractability filter."
  *(Note: This protects you from funding "science fiction" projects unless the Board explicitly accepts that risk.)*

  #### Case B: The Prestige Project (Crowded / High Tractability)
  **Proposal:** A named wing at the local regional hospital.
  **Request:** $200,000.
  **PO Personal View:** You love this. It's visible, the hospital is excellent, and it feels great to put the family name on a wall. You really want to say yes.

  *   **Step 1 (Importance):** *Pass.* Health is high importance.
  *   **Step 2 (Tractability):** *Pass.* Hospitals know how to build wings. Health outcomes will be maintained.
  *   **Step 3 (Neglectedness):** *Fail.* The hospital has a $500M endowment and a capital campaign that is already 90% funded by three other major donors. If you don't fund it, the wing gets built anyway. Your marginal dollar adds zero additional capacity.
  *   **Step 4 (Mission):** *Values Call.*

  **Decision:** **NO (on Impact Grounds) / VALUES OVERRIDE REQUIRED.**
  **Board Defense:** "This is a high-quality organization, but our money does not change the outcome. The hospital will build this wing without us. If we fund this, we are acknowledging that we prioritize *recognition* and *local ties* over *marginal impact*. I recommend we decline unless the Board wishes to categorize this as a 'Community Presence' grant rather than a 'Programmatic Impact' grant."
  *(This is the hard one. It forces the Board to admit they are buying prestige, not impact.)*

  #### Case C: The Saturated Safety Net (Huge / Awash in Money)
  **Proposal:** Supplementing teacher salaries in a well-funded public school district.
  **Request:** $100,000.
  **PO Personal View:** Indifferent. Seems like a government job.

  *   **Step 1 (Importance):** *Pass.* Education is critical.
  *   **Step 2 (Tractability):** *Pass.* Money pays salaries, teachers stay.
  *   **Step 3 (Neglectedness):** *Fail.* This is a tax-funded mandate. The district has a $200M budget. $100k is 0.05% of their budget. It creates a "cliff risk" (what happens when your grant ends in a year? Do teachers get fired?). The funding source is unstable for the need.
  *   **Step 4 (Mission):** *No.*

  **Decision:** **NO.**
  **Board Defense:** "This is a government responsibility. Our funding is too small to change the system and too temporary to sustain the positions. We would be subsidizing tax obligations without fixing the root funding model."

  ### Summary for the Board
  When you present this, your narrative is:
  *"I am using this filter to ensure that when we say 'Yes,' it is either because the grant is **high-leverage** (Steps 1-3) or because it is **core to our family values** (Step 4). If a grant fails Steps 1-3, I will bring it to you as a 'Values Override' so we are clear that we are prioritizing mission over impact metrics."*

  This allows you to fund the local arts center (if the Board votes for it) without pretending it's the most effective use of capital, while giving you the cover to reject the invertebrate research or the hospital wing without it being personal.
