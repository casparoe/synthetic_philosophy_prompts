  2.  **Recall/Research Moore's Position in *Principia Ethica* (Chapter VI):**
      *   Moore argues that intrinsic value belongs to wholes (organic wholes).
      *   The greatest goods are complex wholes involving consciousness.
      *   Specifically, "the pleasure of human intercourse" (personal affection) and "the enjoyment of beautiful objects" (aesthetic enjoyment).
      *   Crucial point: Moore distinguishes between the *conscious state* and the *object* of that state.
      *   Regarding beauty: Moore explicitly states that a true belief in the existence of the beautiful object is part of the whole that has great value. If the object is unreal, the whole is different and less valuable.
      *   However, Moore maintains that the *existence* of the object outside the mind is not itself the intrinsic good *in isolation*. The intrinsic good is the *whole* situation: the consciousness of the object *plus* the true existence of the object.
      *   He denies that the mere existence of the beautiful object (uncontemplated) has significant intrinsic value.
      *   He denies that the mere consciousness (if false) has the same value.
      *   The "organic unity" principle is key here: The value of the whole is not simply the sum of the value of the parts.

