  You press upon a distinction that I confess is among the most difficult in this inquiry, yet it is precisely here that the principle of organic wholes must do its work. When I employ the method of isolation, I am asking what value a thing possesses strictly in itself, devoid of its usual accompaniments. If we isolate the existence of the beautiful object—say, a sublime landscape with no mind to perceive it—I maintain it possesses little to no intrinsic value. Conversely, if we isolate the consciousness of beauty where the object is illusory, the whole is undoubtedly less valuable than when the object is real. But this does not make the external object a second intrinsic good independent of the consciousness. Rather, the truth of the belief concerning the object's existence is a necessary constituent of the *whole* state which is valuable. The value emerges from the union of the appropriate mental state and the corresponding reality; it is not simply the sum of a valuable mind plus a valuable object.

  Therefore, my claim remains intact: the chief goods are still states of consciousness, provided we understand those states as complex wholes involving a true relation to reality. To say that personal affection and aesthetic enjoyment are the greatest goods is to say that these specific organic unities—wherein consciousness is directed upon what is genuinely good or beautiful—are what we ought to maximize. Admitting that the reality of the object enhances the value does not shift the locus of value away from the conscious experience to the physical world; it merely clarifies that the experience itself, to be of the highest worth, must involve a true cognition. We do not value the stone for its own sake, but we do value the contemplation of the real stone far above the contemplation of an imagined one.
