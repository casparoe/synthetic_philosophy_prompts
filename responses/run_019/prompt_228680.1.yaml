      You press me with an objection that is indeed natural to the skeptical mind, and one I confess I anticipated with some care. It is true that if we define the judge solely by his agreement with a specific verdict, we reason in a circle; but this is not the foundation upon which I build. Consider the palate: if two men taste the same wine, and one perceives a subtle note of leather or iron which the other misses, we do not declare their sentiments equally valid; we test the wine and find the key in the butt, proving the delicacy of the former's organ to be a matter of fact, not mere preference. So it is with the mind. The qualities I demand—practice, comparison, freedom from prejudice—are observable traits of character and habit, independent of any single judgment on Homer or Milton. We identify the judge by the health of his faculties, not merely by his agreement with me.

      Furthermore, you mistake the nature of the consensus I invoke. It is not the taste of David Hume and his acquaintances in Edinburgh that I propose as the standard, but the collective sentiment of mankind across centuries. When a poet survives the ravages of time, the shifts of fashion, and the prejudices of conflicting nations, this is an empirical fact as sturdy as any in natural philosophy. To say this is mere accident is to suppose that all human nature is equally accidental. I do not ask you to defer to my circle, but to observe the world. The man who finds Homer tedious may indeed possess a sound mind in other respects, but in this particular sentiment, his organ is either unpractised or obstructed by prejudice; and time, that great impartial critic, will invariably prove which sentiment aligns with the durable principles of the human frame.

