  ### Designer's Note: Core Mechanic Brainstorming

  Before settling on the final design, I considered three ways to translate the Judy Benjamin problem into a café game:

  1.  **The Frequency Trap:** Run many rounds where a token is physically hidden 50/25/25. Players bet chips. After the message, if they shift credence to Blue (60%), they actually *lose* chips in the long run because the physical frequency hasn't changed.
      *   *Verdict:* **Reject.** This proves the skeptics right and kills the paradox. The puzzle is about *epistemic* rationality, not *frequentist* accuracy.
  2.  **The Shrinking Map:** Use paper overlays to physically shrink the Red zone on the table to represent the "logical space" constraint, making Blue visually larger.
      *   *Verdict:* **Reject.** Too abstract. Players will conflate physical area with probability, leading to confusion about whether the map represents territory or possibility.
  3.  **The Rational Exchange Rate:** The Game Master (GM) acts as a "Central Bank" of rationality. After the message, the GM posts new buy/sell prices for zone tickets that reflect the paradoxical solution (Blue = 0.60). Players can trade their old tickets for new ones or chips at these rates.
      *   *Verdict:* **Select.** This forces the "drift" into their chip stacks without requiring them to solve the math first. It creates a tangible incentive to align with the paradoxical update, which we can then interrogate in the debrief.

