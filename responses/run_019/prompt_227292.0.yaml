  # Activity Design: Operation Blue Shift

  **Time:** 75 Minutes
  **Players:** 8–12 Adults
  **Materials:** Poker chips (3 colors), printed "Zone Tickets" (Blue, Red-North, Red-South), opaque cups, paper maps, tape, markers.

  ## 1. Roles & Setup

  *   **The Headquarters (GM):** You. You control the chip bank, the token placement, and the "Exchange Rates."
  *   **The Dispatcher (Assistant/Trusted Player):** Reads the radio messages verbatim. They do not know the solution; they just deliver info.
  *   **The Paratroopers (Players):** Each starts with **100 Chips** and a **Portfolio** of 6 Tickets (3 Blue, 2 Red-North, 1 Red-South). This portfolio reflects the *Prior* probabilities (50%, 25%, 25%).

  **The Table:**
  Divide the table into three taped zones: **Blue** (50% of table length), **Red-North** (25%), **Red-South** (25%). Place a "Token Cup" in the center.

  ## 2. Payoff Scheme (The "Extraction Value")

  We are not using real money. Chips represent **Extraction Priority**.
  *   **Goal:** End the game with the most chips.
  *   **Ticket Redemption:** At the end of the game, the Token Cup is revealed.
      *   If Token is in **Blue**: Blue Tickets are worth **10 Chips** each. Red Tickets are worthless.
      *   If Token is in **Red-N**: Red-N Tickets are worth **10 Chips** each. Others worthless.
      *   If Token is in **Red-S**: Red-S Tickets are worth **10 Chips** each. Others worthless.
  *   **Cash Out:** Players can sell tickets back to Headquarters at the current **Exchange Rate** at any time during trading windows.

  ## 3. Minute-by-Minute Timeline

  ### Phase 1: Calibration & The Drop (0:00 – 0:20)
  *   **0:00–0:05:** Distribute chips and portfolios. Explain redemption rules. Emphasize: *"Your tickets reflect where you think you are. You want to hold tickets for the zone you're actually in."*
  *   **0:05–0:15:** **Round 1 (The Prior).** You secretly place the token (use a die: 1-3=Blue, 4=Red-N, 5=Red-S, 6=Reroll to maintain 50/25/25).
      *   Allow players to trade tickets amongst themselves freely.
      *   *Observation:* They will trade to match the 50/25/25 split. This establishes the baseline.
  *   **0:15–0:20:** Reveal Token. Pay out winnings. Reset portfolios to the standard 3-2-1 split.

  ### Phase 2: The Radio Message (0:20 – 0:35)
  *   **0:20:** Place the token secretly again (same 50/25/25 frequency).
  *   **0:22:** The Dispatcher reads the message: *"Headquarters to Paratroopers. We cannot pinpoint your location. However, IF you are in Red Territory, you are three times more likely to be in the North Sector than the South Sector. No information regarding Blue Territory is available."*
  *   **0:25:** **Trading Freeze.** Players have 2 minutes to discuss in pairs what this means for their tickets.
  *   **0:27:** **The Exchange Window Opens.** You (HQ) post a sign on the table with new Buy/Sell prices for tickets.
      *   **Blue Ticket:** HQ Buys for **6 Chips**, Sells for **6 Chips**.
      *   **Red-N Ticket:** HQ Buys for **3 Chips**, Sells for **3 Chips**.
      *   **Red-S Ticket:** HQ Buys for **1 Chip**, Sells for **1 Chip**.
      *   *(Note: These prices sum to 10, reflecting the 60/30/10 probability split.)*
  *   **0:27–0:35:** Players may trade with HQ or each other.
      *   *The Drift:* A player holding a Blue ticket (previously worth ~5 chips in their mind) sees HQ valuing it at 6. A player holding Red tickets sees them devalued relative to Blue. To maximize chip count, they should **sell Red and buy Blue**.
      *   *Incentive:* If they keep their old portfolio (3 Blue, 2 RN, 1 RS), their "Book Value" is $3(6) + 2(3) + 1(1) = 25$ chips. If they convert everything to Blue, they can hold 4 Blue tickets ($25 / 6 \approx 4$). They feel the pressure to shift their holdings toward Blue to match the "Market."

  ### Phase 3: The Reveal & The Crash (0:35 – 0:50)
  *   **0:35:** Trading Closes. Players lock in their final portfolios.
  *   **0:40:** Reveal the Token.
      *   *Crucial Moment:* Since the physical token was placed 50/25/25, there is a 50% chance Blue wins.
      *   If Blue wins: The "Shifters" (who bought Blue at 6 chips) win 10 chips per ticket. Profit!
      *   If Red wins: The "Shifters" lose big, because they sold their Red tickets cheap.
      *   *Do not explain the math yet.* Let the winners gloat and losers grumble.
  *   **0:45:** **Round 3 (Optional/Speed Run).** If time permits, run one more round but change the Exchange Rate to match the *Prior* (5/2.5/2.5). Show that chip accumulation is slower/different. (Skip if debate is heating up).

  ### Phase 4: The Debrief (0:50 – 1:15)
  *   **0:50–1:00:** **The Felt Experience.** Ask: *"Why did you trade? Who felt it was obvious Blue was now more valuable? Who felt cheated by the Exchange Rate?"*
  *   **1:00–1:10:** **The Philosophical Map.**
      *   Draw the triangle on paper.
      *   Explain that the HQ Exchange Rate wasn't random; it was based on a rule called **Minimum Information Loss** (Maximum Entropy).
      *   *Question:* "The physical token didn't change (50/25/25). So why did the 'Rational Price' change?"
      *   *Point 1:* The message constrained the *Red* zone. To satisfy that constraint without assuming anything else, the "Logical Space" of Red shrinks relative to Blue.
      *   *Point 2:* If you treat the message as a hard constraint on your *mind* (credence) rather than evidence about the *world* (frequency), Blue *must* rise to keep the ratios consistent.
  *   **1:10–1:15:** **The Protocol Objection.** Bring in the friend's argument from your prompt.
      *   *"My friend said this depends on why HQ sent the message. If HQ always sends this message when you're in Blue, but only sometimes when in Red, then Blue probability goes up. If HQ sends it randomly, maybe it doesn't."*
      *   Ask the group: *"Did the game tell you the Protocol? No. We just gave you the Exchange Rate. Did that feel like cheating? Or did it feel like Rationality?"*
      *   Close by naming the puzzle: **The Judy Benjamin Problem.**

  ## 4. Predictable Failure Modes & Mitigations

  **Failure 1: The Silent Algebraists**
  *   *Risk:* As happened in your previous attempt, 3 players will immediately calculate the 60/30/10 split, hoard Blue tickets, and ignore the social game. The rest will ignore the hint and trade randomly.
  *   *Mitigation:* **The "Fog of War" Rule.** During the Exchange Window, do not post the prices publicly immediately. Announce: *"Headquarters is updating valuation protocols. Come to the counter to inquire."* Force them to verbally ask you for the price of Blue. This creates information asymmetry and noise. When one player shouts "Blue is 6!", the others react socially, not just mathematically.

  **Failure 2: The "House is Rigged" Revolt**
  *   *Risk:* When Red wins (50% chance), the players who updated to Blue will lose chips. They will claim the Exchange Rate was a lie.
  *   *Mitigation:* Pre-frame this in the rules. *"Chips measure how well you aligned with Headquarters' Rationality, not just luck."* In the debrief, explicitly validate their anger. *"You lost chips because the physical world didn't match the logical constraint. That is exactly the paradox."*

  **Failure 3: Ignoring the Hint**
  *   *Risk:* Players treat the message as flavor text and keep trading 50/25/25.
  *   *Mitigation:* **The Audit.** Halfway through the Exchange Window, announce: *"Headquarters Audit. Any portfolio that does not reflect the 3:1 Red ratio will be fined 5 chips."* This forces them to adjust Red-N/S. Once they adjust Red, they *must* adjust Blue to sum to 100%. This mechanically forces the drift without them needing to derive it.

  ## 5. Structural Limitations (Honesty Check)

  You must be prepared to admit this in the debrief:

  1.  **The Game Stipulates the Solution:** The game does not *prove* that Blue probability should rise. It *enforces* it through the Exchange Rate/Audit. The philosophical work happens in the discussion, not the mechanics. The mechanics only make the consequence of the update *felt*.
  2.  **Frequency vs. Credence:** The physical token placement (50/25/25) contradicts the Rational Update (60/30/10). This is unavoidable in a physical simulation. You must clarify that the puzzle is about **Epistemic Rationality** (how to manage belief) not **Empirical Accuracy** (how to guess the token).
  3.  **The Protocol Gap:** The game cannot simulate the "Protocol Objection" (why the message was sent) without becoming infinitely complex. You must supply this verbally in the debrief. The game assumes the "Van Fraassen" interpretation (message as a constraint on credence) to function.

  ## 6. Facilitator's Cheat Sheet (The Math)

  *   **Prior:** $P(B)=0.5, P(R_N)=0.25, P(R_S)=0.25$.
  *   **Constraint:** $P(R_N | Red) = 3 \times P(R_S | Red)$.
  *   **Naive Update:** Keep $P(Red) = 0.5$. Then $P(R_N)=0.375, P(R_S)=0.125$. $P(B)$ stays $0.5$.
  *   **Paradoxical Update (Min Info Loss):** $P(B) = 0.6, P(R_N) = 0.3, P(R_S) = 0.1$.
  *   **Game Exchange Rate:** 6 : 3 : 1.

  **Key Debrief Question:** "If you knew the token was placed by a fair die (50/25/25), why did you sell your Red tickets when the Exchange Rate changed? Did you think the die changed? Or did you think the *value of the bet* changed?" (Answer: The value of the bet changed because the *information state* changed).

  ---

  ### Final Advice for the Host
  Your group is "patient and argumentative." Lean into that. When they lose chips on the Blue bet, don't comfort them. Say: *"That loss is the puzzle. Why did Rationality tell you to take a bet that lost?"* Let them fight over whether the Exchange Rate was "True." That fight *is* the Judy Benjamin problem.
