      *   Thesis 2 & 5 rule out intervention by definition. If "natural = good," then stopping starvation is "bad." This justifies the dismissive tone but is philosophically weak.
      *   Thesis 4 rules out intervention based on principle, not outcome. This justifies dismissal if the principle is held as absolute.
