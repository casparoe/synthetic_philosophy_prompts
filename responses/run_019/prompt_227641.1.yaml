      *   *Thesis 4: The Laissez-Faire Intuition (Rights/Respect).*
          *   Claim: Wild animals possess a negative right against human interference, distinct from domestic animals.
          *   Category: Substantive moral thesis.
          *   Implication: Intervention is a rights violation regardless of outcome.
      *   *Thesis 5: The Appeal to Nature (Naturalistic Fallacy).*
          *   Claim: What is natural is morally good; what is unnatural is morally bad.
          *   Category: False (Logical Fallacy).
          *   Implication: Starvation is "good" because it's natural.

