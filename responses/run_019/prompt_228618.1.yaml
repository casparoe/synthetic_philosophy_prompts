answer: |-
  This is a profound and painful conflict that sits right at the intersection of ethics, theology, and family love. You are describing one of the oldest tensions in religious thought: the relationship between *orthodoxy* (right belief) and *orthopraxy* (right action).

  Your intuition that Eliot is "obviously right" comes from a humanistic framework where morality is intrinsic to human flourishing. Your cousin's intuition comes from a revelatory framework where morality is defined by divine command.

  Here is an analysis of whether Eliot's argument can hold weight against that framework, and how you might navigate a conversation with your cousin without hitting a theological wall.

  ### 1. Can Eliot's External Evaluation Work?

  You asked if Eliot's move—judging a creed by the character it produces—is impossible because the believer's framework prioritizes revelation over human moral sense.

  **The Hard Truth:** Strictly speaking, your cousin is logically consistent within his own system. If one accepts the premise that God has issued a specific, non-negotiable requirement for salvation (faith in Christ) and that human moral intuition is fallen or secondary to divine law, then Eliot's argument *does* beg the question. To a strict exclusivist, saying "But she's so nice!" is like saying "But this square is so round!" It appeals to a standard (human niceness) that the system claims is subordinate to the higher standard (divine decree).

  **However, Eliot's argument is not as "external" as it seems.**
  George Eliot (Mary Ann Evans) was deeply theological before she was secular. Her critique works because it leverages an *internal* contradiction within Christianity itself. Christianity is not purely a religion of divine command; it is also a religion of incarnation and revelation *through* character.

  *   **The Theological Counter:** If God is Love (1 John 4:8), then a theology that requires you to devalue Love (your aunt's actions) in favor of Doctrine (your cousin's belief) creates a paradox. If the "Fruit of the Spirit" is love, joy, peace, patience, kindness (Galatians 5:22), and your aunt exhibits those while your cousin exhibits judgment, Eliot's test suggests your aunt is actually closer to the spirit of the creed, regardless of her label.
  *   **The Pragmatic Limit:** Eliot's argument cannot *prove* your cousin wrong about the mechanics of salvation. It cannot force him to admit your aunt is "saved." But it *can* successfully argue that his *interpretation* of salvation is spiritually hazardous. It shifts the burden of proof: If a doctrine makes you dismiss profound sacrificial love as "worthless," perhaps the doctrine is being misunderstood.

  So, Eliot's move works not as a logical proof that overrides revelation, but as a **diagnostic tool** that reveals when a theological system has become idolatrous (worshipping the *idea* of God over the *nature* of God).

  ### 2. What Can You Say to Your Cousin?

  If you go at this from Eliot's secular angle ("Human morality trumps your dogma"), you will talk past each other. He will hear "You are substituting human pride for God's truth."

  To reach him, you have to speak within the language of his faith, or at least bridge the gap. Here are three approaches that avoid the "Faith vs. Works" debate trap:

  #### A. The "Matthew 25" Argument (The Hidden Christ)
  Most exclusivists focus on John 3:16 (Believe and be saved). But Jesus gives a different metric for judgment in Matthew 25 (The Sheep and the Goats). In that passage, the "righteous" are saved because they fed the hungry, visited the sick, and clothed the naked.
  *   **The Twist:** When they ask, "Lord, when did we see *you*?" Jesus replies, "Truly I tell you, whatever you did for one of the least of these brothers and sisters of mine, you did for me."
  *   **The Pitch:** "I know you believe faith is the requirement for salvation. But Jesus also said he is mysteriously present in the people we serve. My aunt has served the 'least of these' for 20 years. Even if she doesn't use the name 'Jesus,' isn't it possible she has been serving Him all along? If God is just, wouldn't He honor the service even if the servant didn't know the Master's name?"

  #### B. The "Fruits" Argument (Internal Consistency)
  Jesus explicitly taught his followers how to evaluate spiritual truth: "By their fruits you will know them" (Matthew 7:16). He warned against those who say 'Lord, Lord' but do not do the will of the Father.
  *   **The Pitch:** "I'm not trying to define salvation for God. But Jesus told us to judge trees by their fruit. My aunt's life produces food for the hungry, comfort for the elderly, and connection for the lonely. If a creed teaches me to look at that fruit and call it 'worthless,' I worry that the creed is making me less like Christ, not more. Does your theology make you love her more, or less? Because John 4:20 says if you don't love your brother whom you have seen, you can't love God whom you haven't."

  #### C. The "Mystery of Grace" Argument (Humility)
  This is the safest route. It doesn't challenge his doctrine directly but challenges his *certainty* about its application.
  *   **The Pitch:** "I respect your commitment to your faith. But the Bible also says God's ways are higher than our ways. It seems dangerous to assume we know the exact boundaries of God's mercy. If my aunt ends up being welcomed by God because of her love, and I'm standing there judging her because of her lack of doctrine, who looks foolish in that story? I'd rather err on the side of assuming God is bigger than our categories."

  ### Summary
  Eliot's argument works best as a mirror for *us* (the observers) to reject cruel theologies, but it rarely convinces the believer because it appeals to an authority (human conscience) they view as fallen.

  To talk to your cousin, don't argue that **Morality > Faith.** Argue that **True Faith produces Morality.** If his version of faith requires him to negate the moral reality of your aunt's life, suggest gently that *that specific version of faith* might be the thing that needs examining, not your aunt.

  You might say: *"I hear that you believe faith is the only thing that saves. I'm not arguing about the afterlife. I'm arguing about this life. In this life, my aunt is doing the work of God. If we call that 'worthless,' I worry we are insulting the very Spirit that moves people to love. Can we at least agree that her love is holy, even if we disagree on the theology?"*

  This honors his boundary (salvation) while holding your ground (her value).
