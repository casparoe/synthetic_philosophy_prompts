prompt: |-
  Im in high school and for a combined history/econ project I have to read the first chapter of Malthus's An Essay on the Principle of Population (1798). This sentence is confusing me: "It has been said that the great question is now at issue, whether man shall henceforth start forwards with accelerated velocity towards illimitable, and hitherto unconceived improvement, or be condemned to a perpetual oscillation between happiness and misery, and after every effort remain still at an immeasurable distance from the wished-for goal." My teacher says this is the set-up for Malthus's point about long-run predictions and how people try to rescue failed predictions by saying the theory was right but just early. I dont see that in the sentence. Can you help me understand what Malthus is actually claiming the debate is, and what parts of the sentence (like "hitherto unconceived" and "after every effort") are doing in his argument? Also, is he taking a side here or just describing the optimistic view?
