answer: |-
  The impasse you describe is not merely a stubborn disagreement over facts; it is a **category mismatch rooted in an empirically underdetermined substantive question about social ontology.**

  Specifically, the dispute is **substantive** regarding the dynamical properties of social systems (are they chaotic or homeostatic?), but because historical data cannot resolve this substantive question (we have only one run of history), the debate has retreated into **methodological** dogmas and **verbal** ambiguities regarding what counts as an "outcome."

  Here is the diagnosis of the structure of the impasse, supported by the arguments of both sides, followed by a proposal for what would constitute progress.

  ### I. Diagnosis: The Structure of the Impasse

  The disagreement is immobile because the two sides are effectively arguing about three different layers of the problem simultaneously, without distinguishing them.

  **1. The Substantive Layer (The Hidden Question)**
  At the core, this is a substantive disagreement about the **dynamical properties of large-scale social systems.**
  *   **Side A (Hinge)** assumes social systems often operate in **chaotic or near-critical regimes**, where sensitivity to initial conditions is high and attractor basins are shallow.
  *   **Side B (Structure)** assumes social systems operate in **homeostatic or equilibrium-seeking regimes**, where negative feedback loops and structural constraints dampen perturbations.

  This is a factual question about how the world works. However, it is **empirically underdetermined** by the archival record. Because we cannot rerun history, we cannot observe the distribution of outcomes from similar starting conditions. Side A points to the *actual* sequence and claims sensitivity; Side B points to the *actual* sequence and claims robustness. Without counterfactual data, the archives support both interpretations equally well. This forces the substantive disagreement to migrate to layers where the participants feel they have leverage.

  **2. The Verbal/Conceptual Layer (Outcome Individuation)**
  Because the substantive layer is stuck, the fight moves to the definition of the *explanandum* (the thing being explained). The word "outcome" is doing too much work.
  *   **Side A** individuates outcomes at the **token level**. For them, the "outcome" is the specific treaty signed, the specific leader elected, the specific border drawn. If the border is drawn 5 miles north, the outcome is different.
  *   **Side B** individuates outcomes at the **type level**. For them, the "outcome" is a functional state, such as "hegemonic stability," "industrialization," or "inter-state war." If the border is drawn 5 miles north but the balance of power remains the same, the outcome is identical.

  When Side A says, "The outcome was contingent," they mean "This specific token event could have been otherwise." When Side B says, "The outcome was determined," they mean "An event of this functional type was inevitable." They are not contradicting each other; they are answering different questions under the same label.

  **3. The Methodological Layer (Standards of Evidence)**
  Finally, the disagreement manifests as a clash over what constitutes valid historical evidence.
  *   **Side A** relies on **process tracing and proximate counterfactuals**. Their standard of evidence is the integrity of the causal chain. If a link in the chain is fragile, the result is contingent.
  *   **Side B** relies on **comparative history and structural analysis**. Their standard of evidence is cross-case regularity. If similar structures produce similar results elsewhere, the specific local cause is incidental.

  Because Side A views Side B's structural generalizations as post-hoc rationalizations that ignore the specific mechanism, and Side B views Side A's counterfactuals as untestable speculation, neither method can falsify the other.

  ### II. Support from the Arguments

  The diagnosis holds because the best arguments from each side reveal they are operating on different layers.

  **Side A (The Hinge View)**
  *   **Argument:** They point to episodes like the assassination of Archduke Franz Ferdinand. They argue that without this specific token event, the *specific* timing and configuration of WWI would not have occurred.
  *   **Reveals:** They are committed to **token-level causation**. They treat the "outcome" as the specific historical trajectory. Their methodological commitment is to **fidelity to the archive**, arguing that ignoring the specific trigger misrepresents the agents' experience and the actual causal mechanism.
  *   **Impasse Point:** When Side B says "War was inevitable due to alliances," Side A hears "The specific decisions of July 1914 don't matter," which strikes them as erasing human agency and historical reality.

  **Side B (The Structural View)**
  *   **Argument:** They point to the fact that Europe had been arming for decades, that alliance systems were rigid, and that if the Archduke had lived, a different incident (a border skirmish, a naval accident) would likely have triggered the same structural tension.
  *   **Reveals:** They are committed to **type-level explanation**. They treat the "outcome" as a structural state (e.g., general war). Their methodological commitment is to **generalizability**, arguing that history is a social *science* only if it can identify robust patterns beyond the idiosyncratic.
  *   **Impasse Point:** When Side A says "It could have been otherwise," Side B hears "There are no social laws," which strikes them as abandoning the possibility of scientific historiography.

  **Why it is immobile:**
  Side A cannot prove the war wouldn't have happened without the Archduke (Side B just posits a different trigger). Side B cannot prove the war *would* have happened without the Archduke (Side A just posits a diplomatic resolution). The archives record the trigger, not the pressure in the spring.

  ### III. Pathways to Progress

  Given that the impasse is a substantive question about system dynamics masked by verbal and methodological confusion, progress cannot come from finding new archives or refining metaphysical definitions of causation. Progress requires decoupling the layers.

  **1. Conceptual Progress: Explicit Outcome Individuation**
  The first step is a terminological distinction. Historians must specify whether they are explaining **Token Outcomes** (specific events) or **Type Outcomes** (structural states).
  *   *Progress Condition:* A consensus that a historical event can be **token-contingent** (Side A is right) but **type-robust** (Side B is right).
  *   *Result:* This dissolves the verbal disagreement. It allows a historian to say, "WWI was structurally overdetermined (Type), but its specific onset in August 1914 was contingent on the assassination (Token)." This stops the sides from talking past each other.

  **2. Methodological Innovation: Computational History and Simulation**
  Since we cannot rerun history, we must simulate it. The substantive question about social system dynamics (chaotic vs. homeostatic) is a question for complexity science, not just archival research.
  *   *Progress Condition:* The development of **Agent-Based Models (ABMs)** calibrated to historical data. If researchers can build a simulation of 1914 Europe that incorporates the structural constraints (Side B) and the stochastic elements (Side A), they can run the simulation 10,000 times.
  *   *Result:* If the simulation produces "General War" in 95% of runs regardless of the assassination trigger, Side B gains substantive support. If the outcome varies wildly based on small perturbations, Side A gains support. This moves the debate from "plausible storytelling" to "tested system dynamics."

  **3. Better-Posed Question: Temporal Horizons**
  The question "Do small details matter?" is ill-posed without a time horizon. Chaos theory suggests that small perturbations matter immensely in the short term but may average out in the long term (or vice versa).
  *   *Progress Condition:* Reframing the question to: "At what **temporal scale** does structural robustness dominate token contingency?"
  *   *Result:* This allows for a synthesis where Side A explains the *onset* of events (short-term dynamics) and Side B explains the *duration and resolution* of events (long-term dynamics).

  ### IV. Conclusion

  The impasse is not a failure of evidence, but a **category error**. The two sides are arguing about the **ontology of social systems** (Substantive) using **incompatible standards of proof** (Methodological) while defining their **terms of success differently** (Verbal).

  No progress should be expected if the debate remains within traditional historiography, because the archival record is inherently incapable of distinguishing between a robust system and a lucky trajectory. Progress requires **externalizing the problem**: importing tools from complexity science to test the dynamical properties of social systems, and adopting a philosophical distinction between token and type outcomes to clarify what is actually being claimed. Until then, the dispute will remain a stalemate between those who value the specificity of the narrative and those who value the generalizability of the pattern.
