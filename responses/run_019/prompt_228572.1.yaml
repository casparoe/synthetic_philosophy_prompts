answer: |-
  ### Upfront Limitation: What This Procedure Cannot Do

  You asked for this first, so here it is: This procedure cannot settle the metaphysical question your dinner argument was actually about. It cannot tell you whether the "person in the garden" is the *same person* as the one who signed the document.

  Your friend argues for **continuity of experience** (the current self's feelings are all that exist). You argue for **continuity of identity** (the past self's values bind the future self). No flowchart can prove which is true.

  This procedure is designed to **minimize moral distress, legal risk, and observable suffering** when those two concepts collide. It prioritizes safety and consistency over philosophical truth. It will sometimes override the AD to prevent immediate harm, and sometimes override the current self to prevent long-term value violations. It is a triage tool, not a truth machine.

  ***

  ### Ethics Consult Decision Procedure: AD vs. Current Self Conflicts

  **Timeframe:** Designed for completion within 4–6 hours of consult initiation.
  **Authority:** Ethics Consult Team (Nurse + Physician + Social Work/Chaplaincy). Final sign-off by Attending + Surrogate.

  #### Phase 1: Document Validity & Applicability (The "Hard Stop" Check)
  *Goal: Determine if the AD is legally binding or advisory.*

  1.  **Verify Execution:** Is the AD signed, witnessed, and legally valid in this jurisdiction?
      *   *Established:* Legal/Compliance review confirms validity.
  2.  **Verify Trigger:** Does the current clinical condition match the specific trigger in the AD? (e.g., AD says "Terminal Condition," patient has reversible pneumonia).
      *   *Established:* Attending Physician documents clinical match.
  3.  **Determine Weight:** Is this a POLST/MOLST (Physician Orders) or a Living Will?
      *   *If POLST:* It is a medical order. **Stop.** Honor the document unless there is clear evidence of revocation.
      *   *If Living Will:* It is advisory guidance for the Surrogate. **Proceed to Phase 2.**

  #### Phase 2: Current Experiential Status (The "Suffering" Check)
  *Goal: Objectively assess the patient's current quality of life, independent of their wishes.*

  1.  **Assess Distress:** Is the patient exhibiting signs of unmanaged pain, dyspnea, or agitation? (Use PAINAD or similar scale).
      *   *Established:* Score > 4 indicates significant distress.
  2.  **Assess Contentment:** Is the patient exhibiting signs of positive affect (smiling, engaging, relaxed posture) when not being intervened upon?
      *   *Established:* Documented observation over 2 hours by two different staff members.
  3.  **The Misery Threshold:**
      *   If **Distress is High** AND **Contentment is Low**: Presumption shifts to **Alleviate Suffering** (may override AD demanding life extension).
      *   If **Distress is Low** AND **Contentment is High**: Presumption shifts to **Preserve Current State** (may override AD demanding withdrawal).
      *   If **Mixed/Unclear**: Proceed to Phase 3.

  #### Phase 3: Current Preference Stability (The "Capacity" Proxy)
  *Goal: Determine if current resistance/assent is a reflex or a preference. Do not use standard capacity tools (MMSE); they will fail.*

  1.  **The Consistency Window:** Present the choice (e.g., "Take this medicine" vs. "Stop") up to 3 times over a 2-hour period.
      *   *Established:* Does the patient give the same verbal or behavioral response (pushing away, nodding, saying "no") each time?
  2.  **The Consequence Test:** Can the patient link the choice to a basic outcome? (e.g., "If I don't take this, I die" -> "I don't want to die").
      *   *Note:* In severe dementia, this will fail. That is okay.
  3.  **Classification:**
      *   **Stable Preference:** Consistent response over 2 hours, even if they cannot explain *why*. (Counts as current wish).
      *   **Reactive Resistance:** Response varies based on who is asking, time of day, or pain levels. (Counts as symptom, not wish).
      *   **No Expression:** Patient is unresponsive or mute. (Counts as no current wish).

  #### Phase 4: The Burden Calculus (The Pivot Point)
  *Goal: Weigh the burden of honoring the AD against the burden of ignoring it.*

  **Ask these three questions:**

  1.  **Treatment Burden:** Is the proposed treatment high-burden (surgery, intubation) or low-burden (oral antibiotics, feeding)?
  2.  **Outcome Certainty:** Is the outcome of treatment a return to the *state the AD forbids* (e.g., more dementia) or a return to *baseline* (e.g., recovery to current garden state)?
  3.  **Violation Harm:** What is the harm of violating the AD?
      *   *High Harm:* Violating a core religious/value identity (e.g., Jehovah's Witness blood ban).
      *   *Low Harm:* Violating a preference based on a prediction that turned out false (e.g., "I'll be miserable" but they aren't).

  **Decision Matrix:**
  *   **If Treatment is Low-Burden + Patient is Content + AD based on "Misery Prediction":** **Treat.** (The prediction is falsified).
  *   **If Treatment is High-Burden + Patient is Distressed + AD based on "No Prolongation":** **Do Not Treat.** (Current suffering confirms AD intent).
  *   **If Treatment is Low-Burden + Patient Resists (Stable) + AD says Treat:** **Do Not Treat.** (Current bodily autonomy outweighs past abstract wish).
  *   **If Treatment is High-Burden + Patient Cannot Express + AD says Do Not Treat:** **Do Not Treat.** (AD stands).

  #### Phase 5: The Human Call (Stop Point)
  *Goal: Assign responsibility when the Matrix yields a tie or high conflict.*

  If Phase 4 does not yield a clear direction (e.g., High Burden Treatment, Patient Content, AD says No):

  1.  **Escalate to Surrogate Decision Maker (SDM):** The SDM makes the final call, but must use the **Best Interest Standard**, not Substituted Judgment.
      *   *Instruction to SDM:* "You are not voting for what they *would* have wanted. You are voting for what is best for the person sitting in front of you, weighted by their past values."
  2.  **Ethics Sign-Off:** The Ethics Consult Chair must sign the chart noting that the SDM was informed of the AD conflict and the rationale for overriding (or honoring) it.
  3.  **Legal Hold:** If the SDM and Medical Team disagree fundamentally (e.g., SDM demands treatment AD forbids, or vice versa), **Pause.** Consult Hospital Legal. Do not proceed until risk is cleared.

  ***

  ### Test Case 1: Pneumonia in the Garden (Your Case)

  **Facts:**
  *   **AD:** "If severe dementia, no antibiotics. I don't want to be kept alive in that state."
  *   **Current State:** Severe dementia. Sitting in garden, smiling, feeding birds.
  *   **Condition:** Pneumonia (reversible with oral antibiotics).
  *   **Current Wish:** Resists pills initially, but settles when crushed in applesauce. Seems content.

  **Procedure Run:**
  1.  **Phase 1:** Living Will (Advisory). Trigger matches (Dementia).
  2.  **Phase 2:** Distress Low. Contentment High (Observed smiling/engaging).
  3.  **Phase 3:** Preference Unstable. Resistance was to *pills*, not *treatment*. Settles with food. No consistent "I want to die."
  4.  **Phase 4 (Calculus):**
      *   Treatment Burden: Low (Oral meds).
      *   Outcome: Return to current baseline (Garden state).
      *   Violation Harm: Low. The AD was based on a prediction of misery ("I don't want to be kept alive *in that state*"). The patient is *not* miserable. The prediction is falsified.
  5.  **Phase 5:** Not needed. Matrix directs action.

  **Result:** **Treat with Antibiotics.**
  **Rationale:** The AD was a directive to avoid *suffering*, not a directive to die simply because dementia exists. Since the patient is not suffering, honoring the *intent* of the AD (avoid misery) requires treating the pneumonia. Honoring the *letter* of the AD would cause death to a content person.

  **Does this match your view?** **No.** You argued the AD should stand because the future self cannot be trusted. This procedure overrides the AD because the *condition* the AD sought to avoid (misery) is absent.

  ***

  ### Test Case 2: The Feeding Tube (New Case)

  **Facts:**
  *   **AD:** "No artificial nutrition or hydration if I cannot eat on my own."
  *   **Current State:** Advanced dementia. Cannot swallow solids. Chokes on liquids.
  *   **Condition:** Weight loss, dehydration risk.
  *   **Current Wish:** Patient opens mouth when spoon approaches (reflex), smiles when tasting sweet puree, but coughs violently and turns head away when full or in pain.
  *   **Family:** Wants PEG tube to "keep mom alive."

  **Procedure Run:**
  1.  **Phase 1:** Living Will (Advisory). Trigger matches (Cannot eat).
  2.  **Phase 2:** Distress Mixed. Pleasure from taste, but physical distress from choking/aspiration risk.
  3.  **Phase 3:** Preference Unstable. Mouth opening is reflexive. Head turning is consistent when uncomfortable.
  4.  **Phase 4 (Calculus):**
      *   Treatment Burden: High (Surgical PEG tube, restraints often needed to prevent pulling).
      *   Outcome: Prolongation of dying process, high risk of aspiration pneumonia. Does not return to baseline (swallowing will not improve).
      *   Violation Harm: High. This violates a specific bodily integrity instruction.
  5.  **Phase 5:** SDM (Family) wants tube. Medical Team says no. **Escalate.**
      *   Ethics advises SDM: "Best Interest" does not support surgery that prolongs dying and causes restraint use.
      *   If SDM persists: Legal Consult.
      *   *Assuming Ethics/Attending hold line:*

  **Result:** **No PEG Tube. Comfort Feeding Only.**
  **Rationale:** The treatment burden is high, the benefit is negligible (does not improve aspiration risk), and the AD is specific. The current "smiling" is a reflex to taste, not a preference for life-extension via surgery.

  **Does this match your view?** **Yes.** This honors the AD over the family's wish and the patient's reflexive assent.

  ***

  ### Summary of Tension

  In Case 1 (Pneumonia), the procedure prioritized the **Current Self** because the AD's *precondition* (misery) was false.
  In Case 2 (Feeding Tube), the procedure prioritized the **Past Self** because the treatment burden was high and the current "wish" was reflexive, not stable.

  This is the "mush" reduction you asked for:
  *   **AD Wins** when: Treatment is high-burden/futile OR Current wish is unstable/reflexive.
  *   **Current Self Wins** when: Treatment is low-burden/beneficial OR AD is based on a falsified prediction of suffering.

  **The Hard Stop:** If you have a low-burden treatment, a content patient, and a specific AD saying "No," and you still feel stuck? **Phase 5.** Let the Surrogate decide, document the conflict, and accept that you are managing a tragedy, not solving a puzzle.
