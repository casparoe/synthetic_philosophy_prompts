answer: |-
  **TO:** Patient-Safety Review Committee
  **FROM:** Community Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Causation Standard for Case Review

  **Recommendation**
  I recommend the committee adopt position (b), the **controlled-change view**, as our standard for internal safety records. We should record this death as **caused by the failure to escalate**, while simultaneously flagging understaffing as a critical contributing system factor.

  **Reasoning**
  Our purpose is safety improvement, not legal liability. Position (a), the strict but-for view, borrows from legal torts where causation requires proving death was *more likely than not* prevented (>50%). While logically rigorous, this standard is too blunt for safety review. If a failure reduces survival from 40% to 0%, labeling it "not a cause" implies the failure was harmless. It was not. It extinguished a substantial chance of life. For learning purposes, a meaningful reduction in survival odds constitutes causation.

  Position (c) correctly identifies that understaffing created the conditions for error. However, attributing the death *only* to the system absolves the specific decision-point we can audit. We must record the specific omission to track protocol adherence, even if systemic pressures explain why it occurred.

  **Addressing Practical Confusion**
  I share the concern that position (b) is philosophically tricky. Specifically: how do we "hold the night fixed" without freezing the doctor's availability? If the doctor was busy, does calling her change anything?

  The distinction lies in relying on expert testimony regarding protocol function. The reviewing physician testified that *if* called, she *would* have transferred the patient. This establishes that the counterfactual world is not one where the nurse calls and the doctor remains unavailable; it is one where the protocol functions as designed. Therefore, we are not changing two things (nurse action + doctor availability); we are changing one thing (nurse action) and allowing the system's standard response to follow. This validates (b) without logical contradiction.

  **Engaging the Strict View**
  Proponents of position (a) argue that without >50% certainty, we are speculating. They worry that recording causation where survival was only 40% risks crying wolf, diluting the significance of "preventable" deaths. This is a valid concern for public reporting. However, for *internal* review, erring on the side of recognizing harm drives vigilance. If we ignore failures because the patient was already critical, we disincentivize staff from escalating on high-risk patients precisely when they need it most.

  **Application to This Case**
  Under the controlled-change view, the omission moved survival odds from near zero to 40%. This is a meaningful difference. The death should be recorded as caused by the failure to escalate. Simultaneously, the committee should issue a separate system recommendation regarding staffing levels, acknowledging position (c)'s insight without letting it obscure the specific clinical omission.

  **Guidance for Future Cases**
  For future reviews, the committee should apply the following tie-breakers:
  1.  **High-Probability Outcomes:** If an outcome would likely have occurred anyway (e.g., survival chance remains <10% even with perfect care), record the failure as a "contributing factor" rather than a cause.
  2.  **Overdetermination:** If two independent failures occurred and either alone was sufficient to cause the death, record both as causes to ensure both are addressed in remediation.

  Adopting this standard ensures we capture significant harms without overstating certainty, keeping our focus on prevention rather than blame.
