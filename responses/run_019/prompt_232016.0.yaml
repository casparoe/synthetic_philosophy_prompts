      *Paragraph 1: Context & Shared Claims.*
      We, the undersigned, having engaged in a year of adversarial collaboration regarding the definition of biological function, submit this joint statement to clarify our standing. We begin by affirming the claims about function talk that both camps accept as true and non-vacuous. We agree that function ascriptions are not merely descriptive labels for any effect a trait produces, but rather serve to distinguish specific contributions from mere by-products or accidents. Both of us accept that identifying a function provides an explanation that is deeper than simple mechanistic description, allowing us to organise biological knowledge around the contributions traits make to the organism. Furthermore, we agree that function talk implies a kind of normativity; there is a difference between what a trait does and what it ought to do, such that a trait can malfunction. We also concur that functional explanations are indispensable for research practice, guiding hypothesis generation and experimental design across both molecular and ecological scales.

      *Paragraph 2: The Exact Division.*
      Despite this common ground, we state the exact point where we divide, using wording each side accepts for itself rather than a caricature of the other. The selected-effects theorist maintains that the proper function of a trait is strictly determined by the evolutionary history of that trait, specifically the effect for which it was naturally selected. On this view, a trait exists because it performed a specific function in the past, and that historical success defines its current functional status. The causal-role theorist maintains that the function of a trait is determined by its current causal contribution to the capacity of a containing system, regardless of evolutionary history. On this view, a trait has a function if it plays a specific role in the current organisation of the organism that helps explain how the system works. The divergence is therefore not about whether history or mechanism matters generally, but about which factor constitutes the function itself: the historical reason for the trait's presence or the current role it plays in the system's capacity.

      *Paragraph 3: The Cruxes.*
      To move beyond stalemate, we have identified the cruxes, those sub-questions such that settling one would actually move at least one camp. The primary crux is whether functional normativity requires an evolutionary account of why a trait exists, or whether it can be grounded solely in the systemic requirements of the current organism. A secondary crux is whether the concept of function is intended to explain the origin and maintenance of traits across generations, or whether it is intended to explain the operational capacity of an individual organism within its lifetime. If the former is the primary goal of function talk, the selected-effects account is favoured; if the latter is the primary goal, the causal-role account is favoured. We agree that resolving whether biological explanation prioritises phylogenetic history or physiological capacity in a given context would significantly shift the weight of evidence required to ascribe a function.

      *Paragraph 4: Concrete Cases & Predictions.*
      For each crux, we give the concrete case or kind of evidence both sides agree bears on it, and record in advance what each side predicts about it. We focus on three specific scenarios that truly separate us. First, consider a new mutation that happens to be useful now but has no selection history. The selected-effects theorist predicts this trait has no proper function yet, as it lacks the requisite history of selection, whereas the causal-role theorist predicts it has a function immediately upon contributing to the system's capacity. The evidence bearing on this is the tracking of the mutation's frequency over generations; if it spreads, the selected-effects theorist will retroactively ascribe function, while the causal-role theorist maintains the function existed from the moment of utility. Second, consider a trait selected for one thing that now does another, such as a structure originally for thermoregulation now used for signalling. The selected-effects theorist predicts the function remains the original selected effect, viewing the new use as a mere capacity until selected for, while the causal-role theorist predicts the function is the current contribution, regardless of origin. The evidence here involves comparative phylogenetics to establish origin versus physiological modelling to establish current contribution. Third, consider a trait that was selected but is now actively harmful due to environmental change. The selected-effects theorist predicts the function remains intact because the historical selection criterion is met, even if the trait is now maladaptive, whereas the causal-role theorist predicts the function is lost because the trait no longer contributes positively to the current system. The evidence bearing on this is the measurement of current fitness contribution versus the reconstruction of ancestral environments.

      *Paragraph 5: Verbal vs Substantive.*
      Finally, we address whether part of this turns out to be merely verbal, and if so, which part and why. We acknowledge that a portion of our disagreement is verbal, stemming from the ambiguity of the word function itself, which is used in evolutionary biology to denote evolutionary purpose and in physiology to denote current operational role. If we agree to treat these as distinct concepts, perhaps labelled evolutionary function and systemic function respectively, much of the friction dissolves. However, we record that a substantive disagreement remains regarding which concept is more fundamental to biology as a unified science. The selected-effects theorist argues that without the historical anchor, systemic roles cannot distinguish themselves from accidental benefits, losing their normative force. The causal-role theorist argues that without current contribution, historical roles are irrelevant to understanding how the organism actually survives today. We therefore conclude that while we can disambiguate our terminology, we cannot yet reconcile our views on which definition best serves the explanatory goals of general biology.

