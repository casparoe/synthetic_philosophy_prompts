      *   *Paragraph 3: The Cruxes.* What questions need answering? Is function explanatory of origin or maintenance? Is it normative?
      *   *Paragraph 4: Concrete Cases & Predictions.* Address the three specific scenarios (new mutation, exaptation, maladaptive trait). State what evidence matters and what each side predicts.
