          *   *Exaptation (Selected for X, now does Y):* SE says function is X (maybe none for Y). CR says function is Y (if it contributes now).
          *   *Maladaptive Trait (Selected but now harmful):* SE says function remains (historical). CR says function lost (no longer contributes positively).

