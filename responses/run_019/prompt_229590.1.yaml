      The consent-screen practice operationalizes a **property theory of privacy**. It treats personal data as an alienable commodity owned by the user, which can be transferred via contract. On this view, privacy is not an inherent state of being but a bundle of rights separable from the person. The "click" functions as a deed of transfer. This model relies on **formal autonomy**: the capacity to sign is sufficient for validity, regardless of whether the signer understands the terms or faces coercive design. The moral weight lies in the sanctity of the contract, not the substantive quality of the choice.

