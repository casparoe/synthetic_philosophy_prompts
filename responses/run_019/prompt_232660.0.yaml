  *   **KS Implication (3/5):** Your conclusion that Player 2's utility must be weakly higher in $F'$ is correct for the KS solution. However, your justification relies on the definition of Individual Monotonicity you provided in Part (ii) (which was actually Aggregate Monotonicity).
      *   *Precision:* To strictly apply the **Individual Monotonicity axiom**, one must assume that Player 1's ideal point ($b_1$) remains unchanged between $F$ and $F'$. The problem statement says Player 2's conditional maxima increase for every $u_1$; if this implies the domain of $u_1$ is unchanged, then $b_1$ is constant, and IM applies. If $b_1$ increases, the result still holds for KS, but it follows from Aggregate Monotonicity or the geometry of the solution, not strictly the Individual Monotonicity axiom.
