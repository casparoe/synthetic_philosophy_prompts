answer: |-
  Here are ten questions designed to press the teleosemantic view on its weakest points.

  1. Regarding the frog: how does selection history settle whether the state represents 'fly' rather than 'small dark moving speck'?
  	*   If the fitness benefit is merely 'nutrition', does that not relocate indeterminacy to the description of the benefit itself, rather than resolving it?

  2. Consider Swampman: a molecule-for-molecule duplicate formed by accident, lacking evolutionary history. Do you deny he possesses contentful thoughts?
  	*   If so, are you not simply privileging your theory over common sense intuition without independent justification, effectively begging the question?

  3. How do we represent abstract subjects, like quantum mechanics, which ancestors never encountered in their environment?
  	*   If you appeal to recombinant mechanisms, does that not rely on current structural properties rather than historical function, undermining your core claim?

  4. What secures the asymmetry between correct representation and misrepresentation on your account?
  	*   Does this not imply that systematic error is statistically impossible given the selected function, rendering misrepresentation anomalous?

  5. Can the consumer of a representation supply normative conditions that the producer cannot?
  	*   If the consumer fixes content, does the producer's history become redundant, collapsing into a functionalist account?

  6. How does a factual evolutionary history generate normative conditions of satisfaction?
  	*   Is this not a straightforward instance of the is-ought problem? *Concession:* A genuine concession would admit that teleosemantics derives norms from facts without explaining the transition.

  7. Does individual learning play any role in fixing content, or is it strictly phylogenetic behaviour?
  	*   If learning matters, does that not shift you towards a functionalist rather than historical theory, abandoning pure teleosemantics?

  8. Where a mechanism is selected for X but regularly caused by Y, how do you avoid the disjunction problem?
  	*   Does this not entail that misrepresentation is merely malfunction rather than false content, failing to capture semantic error?

  9. Does teleosemantics explain phenomenal character or merely intentional content?
  	*   If the latter, is the theory incomplete as a general philosophy of mind, leaving consciousness unexplained?

  10. Ultimately, should we reject intuitions about content if they conflict with naturalistic explanations?
  	*   If naturalism dictates intuition, what validates the naturalism itself, or is this circular?
