          *   *Bucket 2:* Distinguish between "predictive success" (Ptolemy) and "explanatory depth." The stronger argument is that FP is a *skill* (Simulation Theory) not a *theory*. If FP isn't a theory, Churchland's "bad theory" argument fails.
