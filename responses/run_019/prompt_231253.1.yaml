prompt: |-
  Ok so in my decision theory class we've been doing these weekly urn-choice surveys, and I've been tracking my friend Dana's answers because I can't tell if she's running a rule about the numbers or a rule about where the numbers came from. Her record so far:

  - Known urn (100 balls, 50 red, 50 black) vs unknown urn (100 balls, unknown red/black mix), same $10 payout for naming the drawn color. She picks the known urn weather the bet is on red or on black. So she's got the standard Ellsberg pattern.
  - But if the unknown urn pays $16 against the known urn's $10, she takes the unknown urn, so its not a blanket refusal to bet on ambiguity.
  - Urn P: she's told "at least 40 are red and at least 40 are black, rest unknown." She takes P over the fully unknown urn when the bet is on red, but still takes the known 50/50 urn over P.

  Now the survey adds urn Z. The experimenter says Z contains exactly 50 red and 50 black, and she trusts that, but Z was filled before class by some process she didn't see and he won't say how. So the stated probability is identical to the known urn, but the source is opaque.

  What should I expect Dana to do with a $10 bet on red from Z: treat it like the known urn, like P, or like the unknown urn? Is there one rule that handles all her earlier choices, or do I need two? And if I can slip in one extra case next week, what case would best settle whether she's going off the numbers or off the source?
