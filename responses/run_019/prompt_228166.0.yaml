          *   Option B: Fictionalism (Field). It's useful, not true.
          *   Option C: *Modal Structuralism* or *Counterfactuals*. This fits the "unrun program" best. The statement translates to "In any possible world where this machine exists and runs, X happens." No abstract numbers needed, just possible physical configurations.
          *   *Decision:* Focus on the *Counterfactual/Dispositional* move. It preserves the "fixedness" without the "abstract object." The "fixedness" is a logical necessity of the symbols, not a discovery of a thing.
      *   *Section 3 (The Analogy Break):*
          *   Code depends on *physics* (logic gates, time, state). Math (Platonist view) doesn't.
          *   Code is *finite* (usually). Math deals with *infinity* (the trillionth digit implies an infinite string).
          *   *The Killer:* If the universe disappears, does the code's output exist? If you say "yes," you've left nominalism. If you say "no," you admit math/code depends on physical/logical structures.
          *   *Term:* *Implementation Independence* vs. *Ontological Dependence*.

  6.  **Review against Constraints:**
