      *   Make sure to distinguish between *Mathematical Platonism* and *Computational Platonism*. They are related but the physical dependency of code is a wedge.
      *   Clarify the "Rules vs. Existence" distinction in Q1.
      *   Ensure the "Counterfactual" explanation in Q2 is clear: "It's not that the number exists, it's that the conditional statement is true."

  8.  *(Self-Correction during drafting)*: I need to be careful not to conflate Nominalism with Constructivism. A Nominalist can believe the answer is fixed by logic (analytic truth) without believing numbers exist. I should emphasize *Analyticity* vs. *Synthetic* truth. The statement "2+2=4" is true by definition of the symbols for a nominalist, not by observation of abstract objects. For the unrun program, it's true by the definition of the transition rules.

      *Revised plan for Q2:* The Nominalist says the truth is *linguistic/conceptual*, not *ontological*. The "fact" is a fact about *consequences of definitions*, not a fact about *objects*.

