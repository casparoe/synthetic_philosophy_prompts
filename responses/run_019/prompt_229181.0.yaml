      *   *The "Wholesale Dismissal" Question:* This is critical. The summary implies the paper kills adaptationism. The paper actually tries to save evolutionary biology from bad adaptationism. It demands *evidence*, not silence. Evo psych critics use Spandrels to say "you're wrong," but G&L would say "test it."
