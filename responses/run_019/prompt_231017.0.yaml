answer: |-
  # Q&A Prep Sheet: Department Colloquium
  **Thesis:** Influence is manipulative iff it reduces deliberative access to relevant considerations.
  **Audience:** 20 Philosophers (Majority Kantian, 2 Nudge-Friendly Empiricists, 1 Action Theorist, 1 Senior Consequentialist).

  ---

  ### Objection 1: The "Transparency Cure"
  **Phrasing:** "You claim that a disclosed nudge remains manipulative because disclosure doesn't restore deliberative access. But if I tell you, 'I am placing the fruit at eye level to encourage health,' haven't I handed the consideration back to you? You can now factor my intent into your weighing. Doesn't transparency convert a bypass into a reason?"
  *   **Who:** One of the two empirically minded ethicists (Nudge defenders).
  *   **Likelihood:** Very High (95%). **Damage:** Medium-High (Directly targets Conclusion 1).
  *   **Concede:** Transparency *can* mitigate manipulation by adding a new reason (the influencer's intent).
  *   **Hold:** Transparency does not *automatically* restore access to the *original* considerations (e.g., the nutritional value itself) if the architectural bias on System 1 processing remains active.
  *   **Argument Step Under Pressure:** Step 1 (Paired cases) & Conclusion 1.
  *   **Two-Minute Reply:** "Transparency adds a *new* consideration (my intent), but it doesn't necessarily fix the *salience* of the original ones. If the fruit is still physically harder to see than the cake, your System 1 is still being steered away from the health consideration, even if you know I'm trying to steer you. You are now weighing 'I want cake' against 'She wants me to eat fruit,' rather than weighing 'Cake' against 'Health.' The structure of the deliberation is still altered. Disclosure makes it less covert, but on my account, it doesn't stop it from being manipulative if the access to the health reason remains suppressed by the environment."

  ### Objection 2: The "Respect for Persons" Challenge
  **Phrasing:** "You say the wrong of manipulation is treating the target as an obstacle rather than a reasoner. But surely the *attitude* of the influencer matters? If I love my child and use an emotional appeal to keep them from drugs, I am engaging their reasons (fear of harm), not bypassing them. Your account seems to make manipulation too mechanical and ignores the moral relationship."
  *   **Who:** A Kantian moral philosopher (Majority of the room).
  *   **Likelihood:** High (80%). **Damage:** Medium (Targets the moral diagnosis).
  *   **Concede:** The moral *blameworthiness* of manipulation depends on intent and relationship.
  *   **Hold:** The *definition* of manipulation is structural, not attitudinal. One can disrespect someone's rational agency even with benevolent motives.
  *   **Argument Step Under Pressure:** Step 2 (Diagnosis of the underlying wrong).
  *   **Two-Minute Reply:** "I distinguish the *nature* of the act from the *blame* of the agent. My account captures why we feel uneasy even about benevolent manipulation: it treats the agent's rational machinery as a causal lever to be pulled, rather than a court to be persuaded. If I drug you to keep you safe, I've treated you as an obstacle, even if I love you. Similarly, if I exploit a cognitive bias to save you, I'm bypassing your grip on reasons. The Kantian worry about respect is actually *supported* by my view: respect requires engaging the capacity to act on reasons, not just producing good outcomes with warm feelings."

  ### Objection 3: The "Attention Baseline" Problem
  **Phrasing:** "You rely heavily on 'salience' and 'retrieval.' But all communication alters salience. If I argue for policy A by highlighting its benefits, I am directing attention away from policy B's benefits. Is all rhetoric manipulative on your view? Where is the line between persuasion (highlighting reasons) and manipulation (hiding reasons)?"
  *   **Who:** The Philosopher of Action (Attention/Akrasia specialist).
  *   **Likelihood:** High (75%). **Damage:** High (Threatens to make the definition over-inclusive).
  *   **Concede:** All influence changes the informational landscape.
  *   **Hold:** There is a distinction between making a reason *visible* (persuasion) and making a countervailing reason *unretrievable* (manipulation).
  *   **Argument Step Under Pressure:** Core Definition (Deliberative Access).
  *   **Two-Minute Reply:** "The distinction lies in the *predictable failure of retrieval.* Persuasion adds weight to a consideration within the deliberative field. Manipulation exploits a glitch to keep a consideration *out* of the field. If I remind you of the danger of smoking, I'm making a reason salient. If I play calming music to suppress your anxiety about smoking so you don't retrieve the danger, I'm manipulating. The line is whether the intervention works *with* your retrieval mechanisms or *against* their proper function."

  ### Objection 4: The "Normative Payoff" Challenge
  **Phrasing:** "Let's say you're right. The disclosed pension nudge is manipulative. But it saves people from ruin. If your distinction doesn't change what we ought to do—if we should still allow the nudge—then what work is the label 'manipulative' doing? Does it earn its keep?"
  *   **Who:** The Senior Consequentialist.
  *   **Likelihood:** Certain (100%). **Damage:** Medium (Targets Step 3/Conclusion utility).
  *   **Concede:** Manipulation might sometimes be all-things-considered permissible.
  *   **Hold:** The label matters because it shifts the burden of justification. Paternalism requires welfare justification; manipulation requires a higher bar because it violates autonomy structurally.
  *   **Argument Step Under Pressure:** Step 3 (Manipulation vs. Paternalism).
  *   **Two-Minute Reply:** "It earns its keep by separating two distinct burdens of justification. If an intervention is merely paternalistic (restricting liberty for welfare), we ask: 'Is the welfare gain sufficient?' If it is manipulative (bypassing reason), we must ask: 'Is there any less restrictive way to achieve this that respects agency?' My account explains why we feel we owe people an apology or a phase-out plan for disclosed nudges even if they work. It flags a pro tanto wrong that consequentialism alone misses."

  ### Objection 5: The "Emotional Bypass" Intuition
  **Phrasing:** "Your second conclusion claims some emotionally charged appeals aren't manipulative. But if I use a fear appeal to make you vote for me, and you admit later, 'I was too scared to think clearly,' haven't I manipulated you? You seem to let propagandists off the hook if the fear was 'relevant'."
  *   **Who:** A Kantian or General Audience Member.
  *   **Likelihood:** Medium (60%). **Damage:** Medium (Targets Conclusion 2).
  *   **Concede:** Fear often *does* reduce deliberative access.
  *   **Hold:** Fear is not *inherently* manipulative; it depends on whether it paralyzes retrieval or highlights a genuine reason (danger).
  *   **Argument Step Under Pressure:** Conclusion 2.
  *   **Two-Minute Reply:** "Fear is a signal, not just a noise. If I show you a burning building to make you flee, I am using fear to highlight the reason 'you will die.' That preserves your grip on reasons. If I use subliminal fear cues to make you dislike my opponent without knowing why, that reduces access. My account allows that emotional appeals are manipulative *when* they overwhelm retrieval, but not *because* they are emotional. This preserves the intuition that some passionate persuasion is legitimate."

  ---

  ### The Dangerous Question
  **The Question:** "What is your **counterfactual baseline** for 'reduced access'? To say access is *reduced*, you must compare the actual situation to a scenario where access was *not* reduced. But there is no neutral presentation of choices. Every frame, every word order, and every context alters salience. So, compared to what world is your target's access 'reduced'? If you can't specify the baseline, your definition is indeterminate."

  **Why it is dangerous:**
  1.  **It strikes the definitional core:** If you cannot define the baseline, you cannot define "reduction."
  2.  **It implies skepticism:** If there is no neutral baseline, then *all* influence reduces access relative to *some* other frame, potentially making all influence manipulative (over-inclusiveness). Or, if no baseline exists, the concept collapses entirely (under-inclusiveness).
  3.  **It is hard to answer extemporaneously:** Solving the "frame neutrality" problem is a paper in itself. Admitting there is no objective baseline undermines the objective claim of the thesis.
  4.  **Audience Fit:** The Action Theorist and the Kantians will both pounce on this. The Action Theorist knows there is no "view from nowhere" on attention; the Kantian wants a categorical distinction, not a gradient dependent on arbitrary baselines.

  **Prepared Defense (Brief):** "The baseline is not a 'neutral' world, but the *agent's own unprompted retrieval disposition* given the information available. We compare the intervention to the agent's standard cognitive functioning in that context, not to a God's-eye view. Manipulation exploits a deviation from their own normative processing, not a deviation from neutrality." (Risky, but the best available shield).
