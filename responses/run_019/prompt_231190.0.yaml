answer: |-
  The translation dissolves the metaphysical disagreement into a concrete consensus problem, showing the legal debate stems from conflating execution validity with social legitimacy rather than a limitation in your systems framework.

  ### The Systems Restatement

  Imagine the legal system as a self-hosting compiler stored in a distributed version control repository. The **Constitution** is the compiler source code; the **Statutes** are the compiled binaries running in production; the **Amendment Rule** is the CI/CD pipeline configuration (e.g., `CI.yml` requiring a 51% maintainer vote to merge).

  **The Move:** A contributor submits a pull request that modifies `CI.yml` to require 100% unanimity for future merges, but merges this specific PR using only the current 51% threshold.

  *   **Side A (The Interpreter/Positivist):** The build passed. The CI pipeline executed the merge instruction according to the state of `CI.yml` at timestamp $T$. The commit hash is now in the `main` branch history. The new pipeline config is active. The state transition is valid because the interpreter successfully executed the mutation.
  *   **Side B (The Bootstrapper/Natural Lawyer):** The commit violates the invariant it establishes. If the new `CI.yml` had been active at $T$, the merge would have failed. Therefore, the chain of trust is broken. You cannot verify this commit using the new rules, and the old rules no longer exist. You need an external "Golden Binary" or a hardware-rooted trust anchor (a *Grundnorm*) outside the repo to validate the transition zone where the verification logic changed.
  *   **Side C (The Distributed Systems Realist):** The question is a fork condition. Nodes accepting the commit follow the new chain; nodes rejecting it fork to `legacy-main`. There is no global "valid" state, only divergent consensus clusters. Validity is determined by which cluster retains majority hash power (social acceptance), not by logical consistency within a single chain.

  ### Residue Report

  **Clean Mappings**
  *   **Rules as Code:** Statutes map cleanly to executable state machines; ambiguity maps to undefined behavior.
  *   **Amendment as Patch:** Changing rules maps to modifying source or configuration; procedural requirements map to CI gates.
  *   **Self-Reference:** Modifying amendment rules maps to patches that modify the patcher (`patch` utility updating itself) or compiler bootstrapping (Compiler V1 compiling Compiler V2).
  *   **Invalidation:** A rule change that breaks its own adoption maps to a commit that changes the hash algorithm retroactively, breaking the chain linkage.

  **Fudged Mappings**
  *   **Validity vs. Execution:** In systems, "valid" means "the machine accepted the bitflip." In law, "valid" often means "ought to be obeyed even if enforcement fails." Your framework treats successful execution as proof of legitimacy; legal theory treats them as distinct categories.
  *   **Time and Retroactivity:** Systems time is usually monotonic (commit timestamps). Legal systems often allow retroactive liability or "relating back" doctrines that behave like non-monotonic state rewinds, which are pathological in version control.
  *   **The "External Standard":** In systems, the external standard is physics or hardware roots of trust (immutable). In law, the external standard is often social contract or moral intuition, which is mutable and subjective.

  **No Counterpart**
  *   **Normative Force (The "Ought"):** Code has no concept of obligation, only capability. A buffer overflow *can* happen, so it *does*. A law *can* be broken, but the theory argues it *should not* have been. The systems model cannot represent the difference between a successful exploit and a legitimate privilege escalation without referencing an external policy engine.
  *   **Interpretive Community:** Compilers are deterministic; legal rules are interpreted by judges who act as non-deterministic interpreters with discretion. Your model assumes a single canonical interpreter; law assumes a network of interpreters that may disagree on the same bytecode.

  ### Analysis of the Residue

  The residue indicates that the legal debate is not about logical coherence—which your framework resolves easily—but about **authority and consensus**. Side A treats the system as a centralized singleton (the CI server says it passed, so it passed). Side B treats the system as requiring a chain of trust anchored outside the mutable code (like a hardware key). Side C treats the system as distributed consensus (blockchain).

  The legal theorists' disagreement persists because they are arguing over which architectural model applies to society: is it a centralized server (Positivism), a hardware-anchored trust chain (Natural Law), or a peer-to-peer network (Realism)? Your systems vocabulary clarifies this by stripping away the metaphysical fog: there is no logical paradox in self-amending code, only engineering trade-offs regarding trust roots and fork tolerance. The "deep" debate dissolves into a decision about whether you prioritize continuity of history (Side A), integrity of invariants (Side B), or network consensus (Side C). Your framework doesn't lack expressive power; it simply forces the legal theorists to admit they are arguing about social consensus, not logical validity.
