prompt: |-
  I started as a program officer at a family foundation six months ago, and the same fight keeps happening in our grant meetings. We make maybe thirty or forty grants a year, mostly $25k to $200k, in global health and farmed animal welfare. A proposal will have a clear, well-evidenced near-term benefit: bednets in a malarial region, or better water quality on a salmon farm. Then somebody raises the long-run ripple effects. The bednet program could cut childhood mortality and thereby shift population growth, labor markets, and migration over the next thirty years, and we can't even sign those effects. The salmon-farm work could lower the price of farmed fish, shift consumer demand, and expand or contract total aquaculture over decades, and we have no idea whether its good or bad on net. A board member has started calling this cluelessness and says it means we should stop pretending we can compare total consequences and just fund whatever has the best measurable near-term outcomes. Another staff member says that's giving up and smuggling in a preference for the near term.

  I gather philosophers call this issue consequentialist cluelessness. I don't need a literature review or citations; I need a working procedure. Please write a decision procedure my program staff can run on each proposal in about twenty minutes, without philosophy backgrounds. It should include: the questions to ask in order and what counts as a good-enough answer before moving on; how to tell when we're in a situation where we can at least bound the far-future effects versus one where we can't guess the sign, and what to do differently in each; where the procedure should default to near-term measurable outcomes and where it shouldn't; and which steps are really value judgments dressed up as analysis, so we flag those for the board instead of pretending the checklist decided them. Then run the procedure on two proposals: (1) a bednet distribution program with good evidence on short-term mortality reduction but unknown demographic knock-ons over thirty years, and (2) a corporate cage-free egg campaign that, if it succeeds, could change the economics of egg farming in ways that might either improve or worsen long-run aggregate farmed-animal welfare depending on factors we can't observe. Finally, say honestly where the procedure will let us down.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Program Officer at a family foundation (6 months in).
      *   **Context:** 30-40 grants/year, $25k-$200k, Global Health & Farmed Animal Welfare.
      *   **Problem:** Recurring conflict in grant meetings regarding "consequentialist cluelessness" (long-term ripple effects vs. near-term measurable outcomes).
      *   **Conflict:** Board member wants to ignore long-term uncertainty and fund best near-term outcomes. Staff member says this is biased short-termism.
      *   **Task:** Create a 20-minute decision procedure for program staff.
      *   **Requirements:**
          *   No philosophy jargon/literature review.
          *   Specific questions in order.
          *   Criteria for "good enough" answers.
          *   Distinction between "bounded effects" vs. "unknown sign."
          *   Defaults (when to rely on near-term vs. when not to).
          *   Flagging value judgments for the board.
          *   Apply procedure to two specific cases (Bednets, Cage-Free Eggs).
          *   Honest assessment of limitations.

  2.  **Deconstruct the Problem (Consequentialist Cluelessness):**
      *   The core issue is that *everything* has long-term effects we can't predict. If we wait for certainty on the 30-year ripple effects, we fund nothing. If we ignore them completely, we might accidentally fund harm (e.g., population growth leading to resource scarcity, or efficiency leading to more factory farms).
      *   The solution needs to be pragmatic, not theoretical. It needs to triage uncertainty.
      *   Key distinction: *Sign Uncertainty* (Is it good or bad?) vs. *Magnitude Uncertainty* (How good is it?).
      *   Key distinction: *Direct Effects* (Intended) vs. *Indirect Effects* (Systemic).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* 20 minutes max. Needs to be a checklist or flow.
      *   *Step 1: Define the Direct Impact.* What are we actually buying? (5 mins).
      *   *Step 2: Assess Sign Uncertainty.* Can we plausibly argue the long-term effect is *negative*? (5 mins). This addresses the "unknown sign" problem.
      *   *Step 3: Assess Leverage/Scale.* Is this intervention large enough to actually shift the system, or is it a drop in the bucket? (5 mins). Small interventions rarely trigger massive systemic risks.
      *   *Step 4: Value Judgment Flag.* Where are we guessing? (5 mins).
      *   *Decision Rule:* If sign is unknown + scale is high -> Pause/Board Review. If sign is unknown + scale is low -> Proceed on near-term. If sign is positive -> Proceed.

      *Refining the Steps:*
      *   Need to make sure the "Value Judgment" part is explicit.
      *   Need to define "Bounded" vs. "Unbounded."
      *   Need to handle the "Default" question. The default should be near-term *unless* there's a credible risk of long-term harm.

      *Revised Procedure Structure:*
      1.  **Direct Outcome Verification:** Is the near-term good real?
      2.  **The "Reversal" Test:** Is there a credible mechanism for long-term *harm*?
      3.  **Scale & Trigger Check:** Is this grant big enough to tip the scale?
      4.  **The "Ignorance" Flag:** What are we assuming that is actually a value choice?
      5.  **Decision Matrix:** Based on the above.

  4.  **Developing the Content for Each Step:**
      *   *Step 1:* Evidence quality. (Pass/Fail).
      *   *Step 2:* Look for specific mechanisms (e.g., price drop -> more consumption). If none found, mark "Sign Stable."
      *   *Step 3:* Compare grant size to market/sector size. If <1%, systemic risk is low.
      *   *Step 4:* List the assumptions.
      *   *Decision:* If Step 2 finds harm + Step 3 finds high scale -> Reject/Refer. Else -> Fund based on Step 1.

  5.  **Applying to Case Studies:**
      *   *Case 1: Bednets.*
          *   Direct: Saves lives (High confidence).
          *   Reversal: Population growth -> resource strain? (Theoretical, low confidence).
          *   Scale: One program vs. national demographics (Low leverage).
          *   Verdict: Fund on near-term.
      *   *Case 2: Cage-Free Eggs.*
          *   Direct: Welfare improvement for existing hens.
          *   Reversal: Efficiency -> lower prices -> more demand -> more chickens bred (The "Jevons Paradox" of welfare). Plausible mechanism.
          *   Scale: Corporate campaign could shift industry standards (High leverage).
          *   Verdict: Flag for Board/Deep Dive. Sign is ambiguous, scale is high.

  6.  **Addressing the "Value Judgment" Requirement:**
      *   Must explicitly state that choosing to ignore long-term uncertainty *is* a value judgment (prioritizing knowns over unknowns).
      *   Must state that assuming "population growth is bad" is a value judgment.
      *   Must state that assuming "more animals is bad regardless of welfare" is a value judgment.

  7.  **Addressing the "Where it lets us down" Requirement:**
      *   It won't solve the philosophical problem.
      *   It relies on staff intuition for "plausibility."
      *   It might bias against innovative/high-risk systemic change.
      *   It doesn't solve the "non-identity problem" type issues (changing *who* exists).

  8.  **Review against Constraints:**
      *   20 minutes? Yes, if kept tight.
      *   No philosophy jargon? (Avoid "expected utility," "non-identity," "axiology"). Use "sign," "scale," "mechanism."
      *   Order of questions? Yes.
      *   Good-enough answers? Defined.
      *   Defaults? Specified.
      *   Value judgments flagged? Yes.
      *   Case studies run? Yes.
      *   Limitations? Yes.

  9.  **Final Polish:**
      *   Tone: Professional, pragmatic, empathetic to the conflict.
      *   Formatting: Clear headings, bullet points for readability during a meeting.
      *   Ensure the distinction between "Cluelessness about magnitude" (okay) and "Cluelessness about sign" (problematic) is clear.

      *(Self-Correction during drafting)*: I initially thought about asking them to quantify long-term effects. I need to stop that. That takes too long and is impossible. The procedure should be about *disqualifying* risks, not *quantifying* benefits. If we can't find a specific mechanism for harm, we default to the near-term good. This aligns with the "Board Member's" desire for action but respects the "Staff Member's" concern about blindness.

      *Refining the "Default":* The default should be: "Fund on near-term evidence UNLESS there is a credible, high-scale mechanism for long-term harm." This satisfies the need to act while guarding against catastrophe.

      *Refining the "Value Judgment":* The biggest value judgment is the *threshold* for what counts as "credible." That needs to be flagged to the board.

  10. **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  Here is a pragmatic decision procedure designed for your team. It is not a philosophical solution to cluelessness; it is a risk-management tool to stop the same argument from derailing every meeting.

  ### The "Sign and Scale" Protocol (20 Minutes)

  **Goal:** Determine if long-term uncertainty is a *blocker* or just *noise*.
  **Rule:** We accept uncertainty about *how much* good an intervention does (magnitude). We do not accept funding if there is a credible argument that it does *net harm* (sign) at a systemic level.

  #### Step 1: Verify the Direct Chain (5 Minutes)
  *Ask:* "If we ignore everything outside the program's direct scope, is the evidence strong that this creates a near-term good?"
  *   **Good Enough Answer:** "Yes, there is RCT/observational data showing X leads to Y (e.g., nets reduce malaria cases)."
  *   **Fail Condition:** The near-term benefit is speculative.
  *   **Action:** If Fail, reject proposal. If Pass, move to Step 2.

  #### Step 2: The "Reversal Mechanism" Check (5 Minutes)
  *Ask:* "Can anyone articulate a specific, plausible causal chain where this intervention leads to a *negative* outcome in 10+ years?"
  *   **Requirement:** Do not accept vague worries (e.g., "everything is connected"). Require a mechanism (e.g., "Lower prices increase demand which increases total production").
  *   **Good Enough Answer:**
      *   *No Mechanism Found:* Mark as **Sign Stable**. (Proceed to Step 3).
      *   *Mechanism Found:* Mark as **Sign Ambiguous**. (Proceed to Step 3).
  *   **Action:** This distinguishes "we don't know the size of the effect" from "we don't know if it's good or bad."

  #### Step 3: The Leverage & Scale Test (5 Minutes)
  *Ask:* "Is this grant large enough relative to the system to actually trigger the Reversal Mechanism identified in Step 2?"
  *   **Metric:** Compare the grant's projected impact to the total market or demographic size.
  *   **Good Enough Answer:**
      *   *Drop in the Bucket:* The intervention affects <1% of the relevant market/population. Mark as **Low Leverage**.
      *   *System Shift:* The intervention could shift prices, norms, or policy for >5% of the market/population. Mark as **High Leverage**.
  *   **Action:**
      *   If **Sign Ambiguous** + **High Leverage**: **STOP.** Flag for Board Value Judgment (See Step 4).
      *   If **Sign Ambiguous** + **Low Leverage**: Proceed to Fund (Risk is contained).
      *   If **Sign Stable**: Proceed to Fund.

  #### Step 4: The Value Judgment Flag (5 Minutes)
  *Ask:* "What assumption are we making to approve this, that is actually a moral preference, not a fact?"
  *   **Task:** Write down one sentence describing the gamble.
  *   **Examples:**
      *   "We are assuming saving a life today is worth the risk of unknown demographic shifts."
      *   "We are assuming improving welfare per animal is worth the risk of increasing total animal numbers."
  *   **Action:** Attach this sentence to the grant memo. If the Board has previously accepted this specific gamble, fund. If not, Board vote required.

  ---

  ### Decision Defaults

  1.  **Default to Near-Term:** If Step 2 yields **Sign Stable**, you fund based on near-term outcomes. You are not "ignoring" the future; you have assessed it as lacking credible negative mechanisms.
  2.  **Default to Caution:** If Step 2 yields **Sign Ambiguous** AND Step 3 yields **High Leverage**, you cannot fund based on near-term outcomes alone. The risk of accidental harm is too high.
  3.  **The "Cluelessness" Trap:** If the team cannot agree on whether a mechanism is plausible in Step 2 within 5 minutes, treat it as **Sign Stable**. Do not let hypothetical physics-blocker scenarios paralyze decision-making.

  ---

  ### Application to Your Proposals

  #### Case 1: Bednet Distribution Program
  *   **Step 1 (Direct):** Strong evidence nets reduce child mortality. **Pass.**
  *   **Step 2 (Reversal):** Mechanism proposed: Lower mortality -> higher population growth -> resource strain/migration. Is this plausible? Yes, demographically. **Sign Ambiguous.**
  *   **Step 3 (Scale):** Grant covers one region. Total births in the country/region are driven by macro-factors (education, economy). This grant changes mortality by a fraction of a percent. **Low Leverage.**
  *   **Step 4 (Flag):** "We are prioritizing identified lives saved today over theoretical demographic risks."
  *   **Verdict:** **FUND.** The scale is too small to trigger the systemic demographic shift. The "cluelessness" is about magnitude, not sign, at this scale.

  #### Case 2: Corporate Cage-Free Egg Campaign
  *   **Step 1 (Direct):** Strong evidence hens suffer less in cage-free systems. **Pass.**
  *   **Step 2 (Reversal):** Mechanism proposed: Welfare reforms increase production costs -> industry consolidates -> OR -> Welfare reforms make consumers feel better -> demand rises -> more hens bred into existence (potentially in worse conditions elsewhere). This is the "Jevons Paradox" of welfare. Plausible? Yes. **Sign Ambiguous.**
  *   **Step 3 (Scale):** Corporate campaign targets a major producer. Could shift market price or industry standard for >5% of supply. **High Leverage.**
  *   **Step 4 (Flag):** "We are assuming reducing suffering per animal is more important than preventing an increase in the total number of animals farmed."
  *   **Verdict:** **BOARD REVIEW REQUIRED.** This hits the **Sign Ambiguous + High Leverage** stop condition. The staff cannot decide this on near-term metrics alone because the long-term sign (total welfare) is genuinely contested and the scale is large enough to matter.

  ---

  ### Where This Procedure Will Let You Down

  I owe you honesty about the limitations of this tool. It will not solve the philosophical problem, and it will fail in three specific ways:

  1.  **It Biases Against Systemic Change:** By flagging "High Leverage + Sign Ambiguous" projects, you will systematically reject the very grants that could solve root causes. You will end up funding "safe" drops in the bucket (like bednets) rather than policy shifts that might fix the water system but carry higher uncertainty. You must accept that this procedure makes you conservative.
  2.  **It Relies on Intuition for "Plausibility":** Step 2 asks staff to judge if a negative mechanism is "plausible." A pessimistic staff member will find mechanisms everywhere; an optimistic one will find none. This procedure moves the argument from "consequences" to "plausibility," but it doesn't remove subjectivity.
  3.  **It Doesn't Solve the "Non-Identity" Problem:** In the bednet case, saving a child changes *who* gets born in the future. Philosophically, you are changing the entire future population. This procedure sidesteps that by focusing on *harm mechanisms*, but if the Board member is a strict total-utilitarian, they will still argue that changing the identity of future people makes comparison impossible. This procedure asks them to accept a practical workaround rather than a philosophical truth.

  **Recommendation:** Use this to clear the logjam. If the Board member insists that *any* sign ambiguity blocks funding, they are effectively vetoing all grants (since all have unknown long-term effects). This procedure shows them you are checking for sign ambiguity, but that you only block when the scale makes it dangerous. That is a defensible operational stance.
