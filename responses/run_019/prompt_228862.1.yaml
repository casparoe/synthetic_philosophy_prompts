answer: |-
  **Project Title:** Preserving Future Capacity: A Novel Approach to AI Impact Measurement

  **Introduction and Problem Statement**
  As AI systems become more capable, ensuring they pursue objectives without causing unacceptable side effects remains a critical safety challenge. Current impact measures generally fall into two unsatisfactory categories. The first penalises large changes in world state, which risks penalising useful interventions and incentivising agents to do nothing, since inaction can also have massive downstream effects. The second penalises deviations from a counterfactual baseline, but such baselines are often underdetermined and can encourage agents to manipulate events to make their actions appear negligible. Both approaches struggle to distinguish between beneficial transformation and harmful disruption.

  This project proposes a third framing: low impact should be understood as preserving humanity's future capacity to redirect the world among a coarse set of materially different possibilities. Under this view, an action is high-impact not merely because it changes the state of the world, but because it irreversibly removes important human capabilities, concentrates control over shared resources, or makes later correction prohibitively costly. The core hypothesis is that preserving option value might provide a sufficient condition for low impact without requiring a complete specification of human values.

  **Central Research Question**
  The central question is narrowly defined for a three-month timeframe: Can a metric based on the preservation of coarse human capabilities serve as a value-agnostic sufficient condition for low impact in constrained environments? Specifically, can we formalise a distinction between physical reversibility and practical reversibility such that maintaining practical reversibility correlates with low impact, even when the agent's objective is misaligned? This question avoids the impossible task of defining 'good' outcomes, focusing instead on preventing 'locked-in' bad outcomes.

  **Critique of Existing Approaches**
  Existing families of answers leave this question open. State-difference measures treat all changes equally, failing to distinguish between rearranging furniture and dismantling nuclear safeguards. Counterfactual baselines rely on a 'what would have happened' scenario that is often ambiguous; an agent might manipulate the counterfactual to make its impact appear null. Empowerment-style objectives often focus on the agent's own ability to reach future states, which may increase the AI's power rather than preserving human control. Finally, explicit lists of forbidden side effects require extensive value specification, defeating the purpose of a general impact measure. None of these adequately address the preservation of human capacity to correct course. They measure change, not the erosion of future agency.

  **Proposed Methodology**
  The research will employ conceptual analysis supported by lightly formal decision-theoretic models. I will construct simple gridworld-style environments where an agent must achieve a goal while interacting with objects that represent human capabilities or shared resources. These objects will vary in terms of physical reversibility (can the change be undone physically?) and practical reversibility (is the cost of undoing the change prohibitively high?).

  For example, one scenario might involve an agent moving a box. In one variant, the box can be moved back easily. In another, moving the box blocks a doorway permanently. In a third, moving the box requires significant energy to reverse, rendering it practically irreversible even if physically possible. I will test whether an impact penalty based on the reduction of available future states for a 'human' agent successfully penalises the latter cases without penalising useful state changes. The models will remain simple enough to be understood without advanced mathematics, focusing on the logic of option preservation rather than computational efficiency.

  **Addressing the Value Objection**
  The obvious objection is that choosing which capabilities, resources, and future options count as important already smuggles in values. Defining 'human capacity' is itself a normative act. This project will not attempt to define this away. Instead, it will take the objection seriously as a comparative claim. The research will investigate whether the value burden required to specify 'coarse capabilities' is significantly lighter than the burden required to specify reward functions or forbidden lists. If preserving a small set of generic capabilities (e.g., access to energy, communication channels, mobility) prevents catastrophic lock-in across a wide range of value systems, the approach may be useful despite not being fully value-neutral. The project will explicitly map where value judgments enter the model and assess their sensitivity.

  **Alternative Approaches Considered**
  I considered focusing solely on refining counterfactual baselines or developing better state-distance metrics. However, these approaches seem to face fundamental theoretical barriers regarding baseline selection and the definition of 'normality'. I also considered a purely empirical approach using large language models, but this would obscure the mechanistic reasoning required to understand impact measurement. The option-preservation approach is more promising because it shifts the focus from measuring change to measuring constraint. It aligns better with the intuitive safety goal of keeping options open for correction, rather than trying to freeze the world in place.

  **Outcomes and Failure Conditions**
  A positive result would look like a formalised definition of 'practical irreversibility' that successfully penalises lock-in events in gridworld models without penalising useful goal completion. It would demonstrate that preserving a coarse set of options correlates with safety across different value specifications.

  A negative or mixed result would show that the metric is too brittle; for instance, if preserving options requires such detailed modelling of the human agent that it becomes as complex as specifying values directly. Another negative outcome would be if the metric fails to distinguish between benign and malicious lock-in without external value input.

  The project would count as a failure if it becomes clear that 'capacity preservation' is inextricably linked to specific cultural or political valuations that cannot be generalised. If the model requires as much value specification as a standard reward function to function safely, the hypothesis would be disproven.

  **Timeline and Scope**
  Month one will focus on conceptual framing and defining the specific variants of reversibility to be modelled. I will draft the formal definitions for capacity preservation. Month two will be dedicated to building and testing the gridworld models. I will run simulations to see how different impact penalties affect agent behaviour regarding option preservation. Month three will involve analysing the results, refining the argument regarding the value objection, and writing the final report.

  A major risk is scope creep regarding the definition of 'capabilities'. To prevent this, I will restrict the models to physical resources and access rights within the gridworld, avoiding abstract social capabilities. If the modelling becomes too complex, I will prioritise conceptual clarity over simulation fidelity.

  **Deliverable**
  The final deliverable will be a technical report suitable for researchers designing AI training or deployment rules. It will include the conceptual framework for option-preservation impact measures, the specifications for the toy models used, and a set of provisional guidelines on which capabilities might be robust candidates for preservation constraints. This will provide a concrete starting point for integrating impact measures that prioritise human corrigibility over static state preservation.
