  # The Boundary Problem: A Diagnostic Tree

  **Instructions:** Start at **Node 1**. Answer the question based on your intuition about the case described. Follow the arrow to the next node or to a final **Leaf**. Complete the path to find the principle of demos-membership that best matches your judgments.

  ***

  ### NODE 1: The Upwind Factory
  **Case:** A factory in Country A emits smoke that drifts into Country B, harming residents there. Country A is deciding on factory regulations.
  **Question:** Does the population of Country B have a right to **vote** in Country A's election on this matter, or does the boundary of the voters stop at Country A's border regardless of the smoke?

  *   **[Border Stops Voters]** → Go to **NODE 2 (Fixed Path)**
  *   **[Smoke Extends Voters]** → Go to **NODE 4 (Fluid Path)**

  ***

  ### NODE 2 (Fixed Path): The Resident and the Expat
  **Case:** In a national election, consider a **Permanent Resident** (non-citizen living/working in the country) and an **Expatriate Citizen** (citizen living permanently abroad).
  **Question:** Who has the stronger claim to a **vote**?

  *   **[Expatriate Citizen Only]** → Go to **LEAF A**
  *   **[Permanent Resident Only]** → Go to **NODE 3**
  *   **[Both Equally]** → Go to **NODE 3**

  ### NODE 3 (Fixed Path): The Nuclear Waste Test
  **Case:** The current generation votes on a site for long-term nuclear waste that will remain dangerous for 10,000 years. People not yet born cannot vote.
  **Question:** Do these future persons have a right to **proxy representation (a vote)** held by the living, or should their interests merely be **weighed/considered** by current voters?

  *   **[Proxy Vote]** → Go to **LEAF B**
  *   **[Interests Weighed]** → Go to **LEAF C**

  ***

  ### NODE 4 (Fluid Path): The Commuter's Rent
  **Case:** A city votes on a rent-control ordinance. Long-distance commuters work in the city and are affected by housing costs, but live outside the city limits.
  **Question:** Do the commuters have a right to **vote** on the ordinance, or should their interests merely be **weighed/considered** by city residents?

  *   **[Interests Weighed]** → Go to **NODE 5**
  *   **[Right to Vote]** → Go to **NODE 6**

  ### NODE 5 (Fluid Path): The Stakeholder Threshold
  **Case:** A country imposes a carbon tax. The cost to its own voters is small; the existential threat to a low-lying island state is large.
  **Question:** Does the island state get a **vote** in the taxing country's decision because the *impact* is intense, or does the impact count for **nothing** because they are outside the policy's legal origin?

  *   **[Impact Counts for Nothing]** → Go to **LEAF D**
  *   **[Vote Due to Intense Impact]** → Go to **LEAF E**

  ### NODE 6 (Fluid Path): The Nuclear Waste Test
  **Case:** (Same as Node 3). The current generation votes on nuclear waste binding people not yet born.
  **Question:** Do these future persons have a right to **proxy representation (a vote)** held by the living, or should their interests merely be **weighed/considered** by current voters?

  *   **[Proxy Vote]** → Go to **LEAF B**
  *   **[Interests Weighed]** → Go to **LEAF F**

  ***

  ### DIAGNOSTIC LEAVES

  > **⚠️ CONVERGENCE NOTE:** *All-Affected (Leaf F)* and *All-Subjected (Leaf C)* principles converge on almost all standard cases (war, tax, environment). They diverge only on "self-affecting" laws (e.g., mandatory seatbelts) where one is coerced but not materially harmed, or foreign policies where one is harmed but not coerced. This tree cannot cleanly separate them without adding a case about benevolent coercion.

  **LEAF A: The Cultural or National Demos**
  *   **Principle:** The "we" is defined by shared identity, blood, or citizenship status, regardless of territory or impact.
  *   **Diagnosis:** You prioritize the pre-political community over residence or causal footprint.

  **LEAF B: UNNAMED (The Proxy Paradox)**
  *   **Principle:** Future generations hold voting rights via proxy.
  *   **Diagnosis:** **Nobody is here.** Granting a vote to non-existent persons collapses into rule by the living proxies, creating a circular fiction rather than solving the boundary problem.

  **LEAF C: The All-Subjected (Coercion) / Territorial Status Quo**
  *   **Principle:** The "we" is defined by subjection to the coercive legal order or presence on the territory.
  *   **Diagnosis:** You prioritize legal obligation and residence. (Note: Distinguishing "Subjected" from "Territorial" requires a case about legal immunity vs. physical presence).

  **LEAF D: UNNAMED (The Technocratic Gap)**
  *   **Principle:** Interests count for justification, but no one outside the border gets a vote.
  *   **Diagnosis:** **Nobody is here.** This grants standing for moral justification but denies democratic agency, effectively endorsing a benevolent dictatorship that considers outsiders without answering to them.

  **LEAF E: The Stakeholder Principle (Intensity)**
  *   **Principle:** Voting rights are keyed to the *intensity* of the interest affected, not just the fact of affect.
  *   **Diagnosis:** You distinguish between trivial impacts (no vote) and existential stakes (vote), limiting the "All-Affected" principle to prevent demos inflation.

  **LEAF F: The All-Affected Interests Principle**
  *   **Principle:** Anyone whose interests are causally impacted by a decision is entitled to a say in making it.
  *   **Diagnosis:** You prioritize the causal footprint of power over legal borders or identity.

  ***

  ### Confidence Note (For the Instructor)

  **Overall Classification Confidence:** High.
  The tree reliably sorts students into the five major theoretical camps (Cultural, Territorial, Subjected, Affected, Stakeholder) based on case intuition rather than label recognition. The opening node successfully forces the Fixed vs. Fluid distinction, and the Nuclear Waste nodes effectively test the Participation vs. Justification distinction required by your third design constraint.

  **Weakest Link / Least Certain Diagnosis:**
  I am least confident in the separation between **Leaf C (All-Subjected)** and **Leaf F (All-Affected)**. As flagged in the tree, these principles converge on nearly every case provided in the prompt (upwind factory, rent control, carbon tax). Both principles would likely grant the commuter and the downwind neighbor a vote. To cleanly separate them, you would need to add a **"Benevolent Coercion" case** (e.g., a law that coerces citizens for their own safety but affects no material interest, versus a foreign policy decision that materially harms non-citizens without coercing them). Without that specific splitter case, students holding either view may end up in Leaf C or Leaf F somewhat arbitrarily depending on how they interpret "interest" vs. "law." I recommend introducing that specific divergence case during the seminar discussion following the exercise.
