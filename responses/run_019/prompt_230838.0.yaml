      *   *Neural Evidence:* Mention Victor Lamme's work on recurrent processing vs. feedforward. If recurrent processing is necessary for consciousness, and it takes time, does that create a "Stalinesque" delay that is factual? Dennett would say no, it's just processing. I need to find the angle that makes it factual.
