      *   **Orwellian:** Experience happens, then is revised (historical revisionism).
      *   **Stalinesque:** Experience is delayed until all data is in, then presented (show trial).
      *   **Dennett's View:** Both presuppose a "Cartesian Theatre" where things are presented to a homunculus. Neither is true. There are just discriminatory events.
      *   **Load-bearing commitments:**
          1.  Operationalism about consciousness (consciousness = discriminatory capacity/report).
          2.  Rejection of qualia as intrinsic, ineffable properties.
