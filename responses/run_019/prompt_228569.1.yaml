  **The floor** (~250 words)
  A quantitative theory of macrohistory must clear a high epistemic bar to be more than narrative fitting. First, **out-of-sample prediction**: retrodicting Rome proves nothing; the model must forecast unseen data points without parameter tuning. If it only fits known history, it is curve-fitting. Second, **data commensurability**: variables must be operationalized consistently across time and space; comparing 14th-century tax receipts to modern GDP requires robust normalization, not hand-waving. Inconsistent proxies invalidate cross-temporal modeling. Third, **mechanistic specificity**: correlations aren't causes. The theory must name causal mechanisms measurable *before* the outcome occurs (e.g., elite overproduction indices prior to unrest), not cycles inferred from the crash itself. The variables must exist independently of the outcome they predict. Fourth, **falsifiability**: there must be a conceivable state of the world where the theory says "stable" and revolution happens, or vice versa. If every outcome can be explained post-hoc by adjusting "group solidarity" parameters, it is unfalsifiable. Fifth, **small-N robustness**: with only a few dozen comparable states, statistical significance is fragile. The theory must demonstrate it isn't capitalizing on chance correlations in sparse data. Finally, **uncertainty quantification**: predictions must include confidence intervals. A point estimate on a complex system is misleading. For decision-relevance, error costs matter. False positives (predicting crisis that doesn't happen) waste resources; false negatives (missing crisis) are catastrophic. The theory must specify its error profile. Without these, the theory is storytelling with statistics, incapable of distinguishing signal from noise in sparse historical datasets. It must function as an engineering spec, not a philosophical lens.

  **The hard ones** (~250 words)
  Two tensions threaten the purpose. First, **reflexivity**: If a government acts on a prediction of instability, they may prevent it, falsifying the model, or cause it, confirming it erroneously. This is Goodhart's Law applied to society. Does this kill prediction? Not entirely, but it limits the horizon. A theory must specify whether it predicts *ceteris paribus* (ignoring intervention) or *strategic equilibrium* (accounting for reaction). If the latter, it becomes game theory, not history. If the former, it is useless for policy. Second, **contingency vs. structure**: Can a structural model predict around black swans? If a theory predicts stability but a plague kills 40% of the population, was the theory wrong? A decision-relevant theory must separate structural pressure from stochastic shock. It should predict vulnerability, not specific events. It must say "the system is brittle," not "war starts in 2028." If it claims to predict specific timing while ignoring exogenous shocks, it is fraudulent. These requirements conflict: high specificity invites reflexivity failures; high abstraction reduces decision utility. To satisfy both, the theory must predict *risk windows* rather than *events*, accepting that intervention changes the probability distribution. It must be a warning system, not a prophecy. The joint satisfiability hinges on humility: the theory can predict structural strain, but cannot claim determinism. If it demands both precise timing and immunity to human reaction, it is incoherent. We must drop the demand for event-specific prediction to preserve utility. The theory must measure pressure, not outcome.

  **Camp preferences** (~150 words)
  Dan's demand for mathematical formalization is not inherently superior; equations can lend false precision to fuzzy concepts. "Elite overproduction" sounds rigorous but may be unmeasurable. Mathematics imposes discipline but cannot conjure data quality. Conversely, your insistence on irreducible human agency risks exempting history from analysis entirely. If every event is unique contingency, no theory is possible, and decision-making becomes guesswork. Both sides harbor prejudices: Dan privileges structure over action, assuming humans are particles in a fluid. You privilege agency over structure, assuming choices are free enough to invalidate patterns. A valid spec must acknowledge that math is a language, not a truth guarantee, and agency is constrained, not absent. The bias lies in expecting the theory to resolve this philosophical dualism. For decision-relevance, the question isn't whether agency exists, but whether aggregate behavior is stable enough to bet on. Dan wants the comfort of physics; you want the dignity of history.

  **The knife** (~100 words)
  The killer constraint is **out-of-sample predictive validity**. Most macrohistory, including Structural-Demographic Theory, excels at fitting known curves but fails to forecast unseen futures without recalibration. SDT identifies correlates of past crises but struggles to generate specific, falsifiable predictions ahead of time. It often adjusts parameters post-hoc to explain deviations. For SDT, this means proving it could have predicted recent unrest *before* it happened, using only data available at the time, without tuning. If it cannot do this repeatedly, it remains a descriptive framework, not a predictive tool. This cuts out almost all existing cliodynamic models. They describe history, not the future.
