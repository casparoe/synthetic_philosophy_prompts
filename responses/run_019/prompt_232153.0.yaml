answer: |-
  To serve as a robust framework for your board's decision-making, a theory of harm aggregation must satisfy specific structural, conceptual, and empirical conditions. Below are the desiderata for an adequate theory, categorized by function, followed by the incompatibility analysis and scorecard you requested.

  ### I. Structural Adequacy (Classification Requirements)
  An adequate theory must deliver determinate verdicts on the following structural cases without resorting to ad-hoc exceptions:

  1.  **Concentration vs. Dispersion:** The theory must classify whether a fixed sum of total disutility is morally equivalent when concentrated in one life (severe injury) versus dispersed across millions (momentary inconvenience). It must state explicitly if the *distribution* of harm carries independent moral weight.
  2.  **Intrapersonal vs. Interpersonal Aggregation:** The theory must specify whether harms aggregate differently across time within a single life (one person annoyed every day for a year) versus across persons at a single time (one million people annoyed once). It must justify any asymmetry between these two cases.
  3.  **Imposition vs. Permission:** The theory must distinguish between harms the board actively *imposes* via rule (the inconvenience) and harms the board merely *permits* by failing to prevent (the maintenance injuries). It must state whether the source of the harm (agency) alters the aggregation calculus.
  4.  **Sub-Threshold Accumulation:** The theory must determine whether harms that are individually below the threshold of moral significance (e.g., a frustration forgotten in seconds) can accumulate to outweigh a harm that is unequivocally significant (e.g., loss of limb). It must define the "moral horizon" of a harm.

  ### II. Conceptual Integrity (Non-Collapse Requirements)
  An adequate theory must maintain the following distinctions. Collapsing them renders the theory incapable of guiding policy in complex environments:

  1.  **Single-Life Negligibility $\neq$ Aggregate Negligibility:** The theory must not assume that because a harm is negligible to one person, it is negligible when experienced by a billion. Conversely, it must not assume that because it is negligible in aggregate *per capita*, it is morally inert.
  2.  **Intensity $\neq$ Duration $\neq$ Number:** The theory must treat the severity of the experience, the length of the experience, and the count of experiencers as distinct variables. It must not trade them off at a fixed 1:1 rate without justification (e.g., explaining why 1,000 minutes of mild pain equals 1 minute of agony).
  3.  **Experienced Harm $\neq$ Preference Frustration:** The theory must distinguish between a subject *feeling* bad and a subject's *desires* being thwarted. A policy might frustrate a desire without causing phenomenological distress, or cause distress without frustrating a prior desire.

  ### III. Empirical Plausibility (Psychological Constraints)
  The theory cannot contradict established findings regarding the phenomenology of suffering and adaptation. Specifically:

  1.  **Hedonic Adaptation:** The theory must account for the fact that humans adapt rapidly to low-level inconveniences (the "dust speck" fades from awareness) but adapt poorly or incompletely to severe trauma (torture/injury alters life trajectory). A theory that treats 1 second of pain $\times$ 1 million people as identical to 1 million seconds of pain $\times$ 1 person contradicts the non-linear nature of memory and trauma.
  2.  **Threshold of Notice:** The theory cannot count as a "harm" a sensation that is phenomenologically undetectable to the subject. If the inconvenience is truly below the threshold of conscious notice, it cannot be aggregated as an experienced disutility.
  3.  **Risk Perception:** The theory must acknowledge that people weigh certain, immediate inconveniences differently than probabilistic, future catastrophes. While this is a bias, a policy theory that ignores it risks non-compliance or panic.

  ### IV. Normative Status (Commitments)
  You must distinguish between requirements essential for *any* rational policy and those specific to moral camps.

  **Non-Negotiable (Required for Adequacy):**
  *   **Consistency:** The theory must not yield contradictory verdicts in identical cases.
  *   **Action-Guidance:** The theory must produce a decision rule, not just a description of the dilemma.
  *   **Public Justifiability:** The reasoning must be communicable to the populace affected (i.e., you cannot rely on esoteric metaphysics to justify safety rules).

  **Camp-Specific (Optional Commitments):**
  *   **Strict Additivity (Consequentialist):** The claim that harms *must* sum linearly regardless of distribution. (Rejecting this does not make a theory inadequate, only non-utilitarian).
  *   **Lexical Priority (Rights-Based):** The claim that certain harms *never* aggregate to outweigh others. (Rejecting this does not make a theory inadequate, only non-deontological).
  *   **Discounting the Future:** The claim that future injuries count less than present inconveniences. (This is a policy parameter, not a moral necessity).

  ### V. Incompatibilities and Scorecard

  **The Incompatible Pair:**
  You cannot jointly satisfy **Aggregative Continuity** and **Individual Lexicality**.
  *   *Aggregative Continuity:* Requires that for any two harms, there is some number of the smaller harm that outweighs the larger harm (no "lexical" gaps).
  *   *Individual Lexicality:* Requires that some severe harms (torture) can *never* be outweighed by any number of trivial harms (dust specks), protecting the individual from being sacrificed for the aggregate.
  *   *Conflict:* If you demand Continuity, you must accept the "dust speck" conclusion (enough specks justify torture). If you demand Lexicality, you violate Continuity (there is a "break" in the scale where numbers stop mattering).

  **The "Killer" Requirement:**
  The single requirement that does the most to eliminate standard positions is **Aggregative Continuity**.
  *   *Why:* Most "common sense" morality and Rights-Based views rely on Lexicality (some things are just worse, regardless of numbers). Most strict Utilitarian views rely on Continuity. By demanding Continuity as a condition of *rationality*, you eliminate all Deontological, Prioritarian, and Common-Sense moralities that posit a qualitative break between "nuisance" and "injury." By rejecting it, you eliminate Classical Utilitarianism.

  **Scorecard of Standard Positions:**

  | Position | Satisfies Continuity? | Satisfies Lexicality? | Status under Desiderata |
  | :--- | :--- | :--- | :--- |
  | **Classical Utilitarianism** | Yes | No | **Passes** Structural/Empirical; **Fails** Common-Sense Intuition. |
  | **Rights-Based Deontology** | No | Yes | **Passes** Individual Protection; **Fails** Rational Consistency (Continuity). |
  | **Common-Sense Morality** | No | Yes (Implicitly) | **Fails** Consistency (vague thresholds); **Passes** Empirical Plausibility. |
  | **Prioritarianism** | No | Partial | **Fails** Continuity; **Passes** Distribution Sensitivity. |

  **Recommendation:** For a public utility board, **Strict Additivity (Utilitarianism)** is the only framework that satisfies *Aggregative Continuity* and offers clear *Action-Guidance*, but it risks violating *Empirical Plausibility* regarding adaptation and *Public Justifiability* (citizens will not accept torture for specks). A **Threshold Prioritarianism** (aggregating small harms only up to a point of significance) is likely the only stable compromise, though it technically violates Continuity.
