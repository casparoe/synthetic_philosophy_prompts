answer: |-
  Reconstructing your friend's position requires disentangling the competing democratic theories implicit in her six verdicts. Her views balance **membership** (who belongs to the community) against **subjection** (who is bound by the state's power). Both principles can explain her record, but they diverge sharply on the asylum case.

  ### 1. The Two Candidate Principles

  **Principle A: The "Durable Membership" Principle**
  *   **Core Idea:** The franchise belongs to those who are part of the ongoing political community, defined by a durable stake in its future.
  *   **How it fits the record:**
      *   **Citizens (Verdict 2):** Membership is permanent, regardless of location.
      *   **Residents (Verdict 3):** Long-term integration (work, family, taxes) creates de facto membership.
      *   **Tourists (Verdict 1):** Transient presence does not establish membership.
      *   **Neighbors (Verdict 6):** External impact does not constitute membership.
      *   **Prisoners (Verdict 5):** Criminality does not revoke membership.
  *   **Necessary Riders:**
      *   *Competence:* Excludes children (Verdict 4) as they are not yet full agents within the community.
      *   *Duration:* Excludes transients (Tourists) whose stake is temporary.
  *   **Prediction for Asylum Case:** **No.** Asylum seekers are not yet members. They have no established stake, residence, or citizenship. The policy determines *if* they become members; therefore, they cannot vote on it.

  **Principle B: The "Non-Arbitrary Coercion" Principle**
  *   **Core Idea:** The franchise belongs to anyone subject to the state's coercive legal authority in a way they cannot voluntarily avoid. Legitimacy requires that those ruled have a say.
  *   **How it fits the record:**
      *   **Residents/Prisoners (Verdicts 3 & 5):** Fully subject to state coercion.
      *   **Citizens Abroad (Verdict 2):** Still subject to citizenship laws and consular authority; cannot easily renounce the bond.
      *   **Tourists (Verdict 1):** Subject to law, but entry was voluntary and stay is temporary (avoidable coercion).
      *   **Neighbors (Verdict 6):** Affected by *consequences* (pollution), but not subject to the state's *legal authority* or commands.
  *   **Necessary Riders:**
      *   *Voluntariness:* Excludes tourists who chose to enter.
      *   *Juridical vs. Causal:* Excludes neighbors who suffer side-effects but are not under the state's jurisdiction.
  *   **Prediction for Asylum Case:** **Yes.** Unlike neighbors (pollution), asylum seekers are the direct target of coercive state power (detention, repulsion). Unlike tourists, their "entry" is not voluntary (flight from persecution). The border policy exercises sovereign authority over their liberty; therefore, they should have a say.

  ### 2. Is Her "No" Consistent with Her Record?

  Her "No" verdict is **consistent with her track record, provided Principle A (Membership) is the dominant rule.**

  *   **Closest Analog:** **Case 6 (The Neighbors).**
      *   **Why:** Both the neighbors and the asylum seekers are physically **outside the border**. In both cases, the state's actions profoundly affect them (pollution vs. border closure).
      *   **Reasoning:** In Case 6, she ruled that external impact is insufficient for the vote; those affected are owed consultation or compensation, not the franchise. By saying "No" to the asylum seekers, she is treating the border policy as an external boundary-maintenance issue (like the power station) rather than an internal rule of law. She is prioritizing the *location* of the subjects (outside) over the *nature* of the impact (coercion).
      *   **Alternative Analog:** If she had prioritized **Case 3 (The Resident Non-Citizen)**, she might have voted "Yes." That verdict establishes that citizenship is not required, only subjection and integration. However, the asylum seekers lack the *residence* component of Case 3, making Case 6 the stronger precedent for her "No."

  **Verdict:** Her record commits her to "No" *if* she views the border as a threshold of membership (Principle A). It does not commit her to "No" if she views the border as an instrument of coercion (Principle B). Given her confidence ("quickly and confidently"), she is likely operating on Principle A.

  ### 3. Underdetermination: What Principle is Adopted?

  Since the record allows for both principles, her final answer reveals which principle she is actually prioritizing.

  *   **By saying "No":** She adopts the **Membership Principle**. She affirms that a polity has the right to define its own boundaries before democracy applies. Democracy is an internal good for members, not a remedy for all those affected by state power.
  *   **By saying "Yes":** She adopts the **Coercion Principle**. She affirms that democratic legitimacy extends wherever state power reaches. If the state decides their fate, they must be part of the decision, regardless of membership status.

  ### 4. The Distinguishing Case

  To force these two rules apart, you need a case involving **non-members** who are **fully subject to coercive governance** but **lack integration**.

  **The Case: A Population Under Long-Term Military Occupation.**
  *   *Scenario:* Your country militarily occupies a foreign territory. The residents there are not citizens (not members), have no path to naturalization, and do not live in your country. However, they are governed entirely by your military decrees, pay taxes to your administration, and are subject to your courts.
  *   **Principle A (Membership) Predicts:** **No Vote.** They are not part of the national community; they are foreign subjects.
  *   **Principle B (Coercion) Predicts:** **Yes Vote.** They are fully subject to your state's coercive authority without consent. Governing them without representation is tyranny.

  If your friend says "No vote" for the occupied population, she is confirmed as a **Membership** theorist (and her asylum "No" is consistent). If she says "Yes vote," she is a **Coercion** theorist (and her asylum "No" was a contradiction).
