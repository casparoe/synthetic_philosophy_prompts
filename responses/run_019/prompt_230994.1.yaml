answer: |-
  The Republic of Aethel guarantees the security of the disputed border province of Ostral against the Union of Krasnovia. Krasnovia initiates a limited conventional seizure of Ostral, calculating that Aethel's leadership, being instrumentally rational, would never order a strategic nuclear strike in response because Krasnovia's retaliatory capability ensures mutual destruction, making the cost of nuclear war (-1000) vastly exceed the loss of Ostral (-50). Aethel possesses a mundane but potent mechanism to alter this calculus: the 'Cassandra Protocol,' which decentralizes tactical release authority to field commanders and degrades secure strategic communication links for a fixed 72-hour period, a posture that cannot be reversed without costly procedural safety checks. Intelligence estimates confirm that activating Cassandra raises the probability of inadvertent nuclear escalation due to misinterpretation or unauthorized action from a baseline of near-zero to 5%, a risk both leaders acknowledge is independent of either's rational intent to strike. Both states share identical cost-benefit analyses and agree that a deliberate nuclear first strike by Aethel is ex post irrational, yet they face the immediate decision of whether Aethel should activate the Cassandra Protocol to compel Krasnovia's withdrawal.

  **Doctrinal Recommendations**

  Under the **Ex Post Credibility Doctrine**, the analysis begins with the terminal node of the decision tree: if Ostral is lost, is launching a nuclear strike rational? Both sides agree the answer is no, as the retaliatory cost (-1000) outweighs the geopolitical loss (-50). Because the threat to strike is not credible *after* the provocation, it cannot deter *before* the provocation. Activating the Cassandra Protocol creates a 5% risk of a outcome (nuclear war) that the leader admits they would not rationally choose to execute. Therefore, the doctrine recommends Aethel **reject the protocol**, as generating risk without a corresponding rational intention to strike is merely gambling with national survival rather than deterring. Aethel should respond conventionally or accommodate the loss.

  Under the **Manufactured Risk Doctrine**, the analysis begins with the adversary's expected utility calculation. Krasnovia will seize Ostral only if the Expected Value (Benefit of Ostral) > Expected Cost (Probability of War × Cost of War). While Aethel's *intent* to strike is zero, the *probability* of war is now 5% due to the Cassandra Protocol. For Krasnovia, 5% × -1000 = -50, which neutralizes the benefit of seizing Ostral. The doctrine argues that Aethel need not intend to strike to deter; it need only make the outcome sufficiently costly in expectation. Therefore, the doctrine recommends Aethel **activate the protocol**, using the loss of control not as a failure of strategy, but as the coercive lever itself.

  **The Separating Structural Feature**

  The single structural feature doing the separating work is the **decoupling of outcome probability from leader intentionality**. In standard deterrence models, the probability of nuclear war is treated as a function of the leader's will (if I don't want to strike, probability is zero). The Cassandra Protocol introduces a structural variable where the probability of war is a function of *systemic posture* independent of *current intent*. Ex Post Credibility treats risk strictly as a constraint on action (do not incur risk you won't use); Manufactured Risk treats risk as an instrument of action (incur risk to alter adversary calculus).

  **Removing the Feature**

  If the Cassandra Protocol could be costlessly and instantly undone (e.g., if Aethel could restore central command authority the moment Krasnovia called the bluff), the decoupling collapses. The probability of inadvertent war would return to near-zero immediately upon resistance, rendering the risk manipulation a "cheap talk" signal. The case would then revert to a standard credibility problem: since Aethel cannot rationally strike ex post, and the manufactured risk is reversible, Krasnovia would ignore the threat. Without the *irreversibility* that sustains the risk independent of intent, the Manufactured Risk Doctrine loses its mechanism and converges with Ex Post Credibility.

  **Strongest Objection from Ex Post Credibility**

  The strongest objection is that **risk cannot be precisely calibrated, only accumulated.** An Ex Post defender would argue that treating risk as an instrument assumes the state can toggle the probability of omnicide like a dimmer switch, keeping it at a coercive 5% without triggering 100%. This objection targets the separating feature itself, arguing that the "decoupling" is an illusion; once delegation and communication degradation are introduced, the risk is no longer a manageable instrument but an unbounded constraint that inevitably escapes the strategist's grasp. By attempting to use risk as a tool, the state surrenders the very rationality required to stop the escalation if the coercion fails.
