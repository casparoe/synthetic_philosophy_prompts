  7.  **Final Polish:** (Mental check of the Money Pump logic).
      *   If I prefer 1A (Sure) > 1B (Risk), but 2B (Risk) > 2A (Risk), can I pump me?
      *   Yes. I can sell you 1A, buy 1B, then swap the common consequence part to mimic the second choice, etc. Actually, the standard money pump for Allais is a bit tricky to explain simply.
