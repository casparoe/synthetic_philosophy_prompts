answer: |-
  Based on your ten verdicts, I have constructed the principle that best models your moral intuitions. It is not a standard libertarian or egalitarian principle; it is a principle of **Civic Stewardship and Normative Framing**.

  ### The Principle: Public Stewardship and Fixed Terms

  **Core Rule:** Market exchanges involving bodily integrity, civic status, or public goods are permissible *only if* they are mediated by a public authority (the State or a public-minded institution) using **fixed terms**, rather than private bidding wars.

  **Three Constraints:**
  1.  **The Mediation Constraint:** The exchange must be institutionalized by a public authority to ensure safety, screen for coercion, and align the incentive with a public good. Private bilateral contracts in these spheres are impermissible.
  2.  **The Pricing Constraint:** For goods that confer status, rights, or access to scarce public institutions, prices must be **fixed thresholds**, not **auctioned rankings**. We may pay to enter, but we must not bid against each other.
  3.  **The Integrity Constraint:** Exchanges cannot incentivize irreversible bodily alteration targeting vulnerable populations, nor can they create moral hazards (incentivizing the bad event).

  **The "Hypocrisy" Clause (Normative Framing):**
  For status goods (university seats, residency), the market mechanism must not be the *visible* allocation rule. Opaque inequalities that preserve the *fiction* of non-market values (merit, family connection) are tolerated; explicit price discovery that destroys that fiction is forbidden.

  ---

  ### How the Principle Sorts Your Cases

  This principle reproduces your verdicts by distinguishing between **Commodities** (generators), **Public Goods** (kidneys, vaccines, visas), and **Civic Rights** (votes).

  *   **Cases 1, 4, 7 (Fixed Price/State):** Permissible. The State mediates (Mediation Constraint), prices are fixed (Pricing Constraint), and the goal is public welfare.
  *   **Case 2 (Generators):** Permissible. Generators are private commodities, not civic status. Efficiency trumps framing in emergency allocation of goods.
  *   **Case 3 (Votes):** Impermissible. Votes are core civic rights. No amount of State mediation can legitimize their commodification without destroying the equality they represent.
  *   **Case 5 (Sterilization):** Impermissible. Fails Mediation (Charity, not State), fails Integrity (Irreversible bodily alteration targeting the vulnerable).
  *   **Case 6 (University Auction):** Impermissible. Fails Pricing Constraint (Auction vs. Fixed) and Normative Framing (Explicitly declares money > merit).
  *   **Case 9 (War):** Civil War substitutes fail Mediation (Private contract). Volunteer Army passes Mediation (Public institution, fixed pay/hazard bonus).
  *   **Case 8 (Prediction Markets):** Elections pass Integrity (No hazard). Assassinations fail Integrity (Incentivizes harm).
  *   **Case 10 (Offsets):** Indulgences fail Mediation (Private moral license). Offsets pass Mediation (Regulated remediation of externalities).

  ### The Indefensible Pairs: Where the Principle Strains

  You flagged three pairs where the outcomes are similar but your verdicts differ. Here is what the principle says about them, and where you may need to surrender a verdict.

  **1. Legacy Admissions vs. Open Auction (Case 6)**
  *   **The Principle's Verdict:** The Auction is impermissible because it uses *price discovery* (bidding) for a status good, explicitly corrupting the institution's mission. Legacy admissions are "distasteful" but permissible because they use a *fixed rule* (lineage) that masks the inequality.
  *   **The Cost:** This relies entirely on the **Hypocrisy Clause**. It admits that lying about how access is granted is morally superior to telling the truth.
  *   **Recommendation:** **Surrender the Legacy verdict.** If an open auction is corrupt because it trades on money rather than merit, legacy admissions are corrupt for the same reason, merely disguised. Holding both views requires valuing social fiction over moral consistency. If you drop the tolerance for legacy admissions, the principle becomes more robust.

  **2. Fixed Visa Price vs. Visa Auction (Case 7)**
  *   **The Principle's Verdict:** A fixed price is a *threshold* (can you contribute this much?). An auction is a *ranking* (are you richer than the other guy?). The former preserves the dignity of the applicant as meeting a standard; the latter reduces them to a bid.
  *   **The Cost:** This is a distinction without a material difference. The same people get the visas at the same price.
  *   **Recommendation:** **Keep this verdict.** While economically similar, the *expressive* difference matters. A fixed price says, "We value this investment level." An auction says, "We sell to the highest bidder." The latter degrades the meaning of citizenship more aggressively. This is a defensible distinction based on *expressive harm*.

  **3. Vaccine Cash vs. Sterilization Cash (Case 4 vs. 5)**
  *   **The Principle's Verdict:** Vaccines are reversible/prophylactic and benefit the public. Sterilization is irreversible, bodily reducing, and targets a stigmatized class (addicts) without full State mediation.
  *   **The Cost:** If the State ran the sterilization program with screening, would it be okay? Your intuition likely says "No, still eugenics."
  *   **Recommendation:** **Keep this verdict.** The Integrity Constraint holds here. Irreversible bodily alteration for cash is a bright line that distinguishes incentives from coercion, regardless of State mediation.

  ### Application to New Cases

  Here is how the **Public Stewardship and Fixed Terms** principle applies to your two new scenarios.

  #### Case A: Donor-Priority Scheme (Futures Market in One's Own Organs)
  *   **Structure:** Register as a donor -> Move up the queue if *you* need an organ.
  *   **Analysis:**
      *   **Mediation:** Yes, managed by the transplant system (State/Public).
      *   **Pricing:** Fixed term (registration status), not an auction.
      *   **Integrity:** No irreversible alteration at the time of exchange (registration is reversible; organ harvest happens post-mortem or under strict living donor protocols).
      *   **Analogy:** Closely analogous to **Case 1 (Kidneys)** and **Case 4 (Vaccines)**. It incentivizes a public good using a status benefit rather than cash.
  *   **Verdict:** **Permissible.**
  *   **Confidence Check:** This should increase your confidence. It feels intuitively right (it encourages donation without commodifying the body directly) and fits the principle's requirement for public mediation and fixed terms.

  #### Case B: Shareholder Democracy (Buying Corporate Votes)
  *   **Structure:** Corporate votes are freely bought and sold along with shares (or decoupled and traded).
  *   **Analysis:**
      *   **Mediation:** Yes, managed by Corporate Law/SEC.
      *   **Pricing:** Market price (Auction-like).
      *   **Status vs. Property:** This is the crux. Are corporate votes *Civic Rights* (Case 3) or *Property Rights* (Case 2)?
      *   **Principle Application:** The principle restricts auctions for *civic status* and *public goods*. A corporation is a private, voluntary association. Its "votes" are property rights attached to capital risk.
      *   **Analogy:** Analogous to **Case 2 (Generators)** or **Case 7 (Visas)**. It is an allocation of private influence, not public sovereignty.
  *   **Verdict:** **Permissible.**
  *   **Confidence Check:** This tests the boundary. If you feel uneasy about this, it suggests your principle might need to expand the definition of "Civic Status" to include "Economic Power that mimics Political Power." However, under the current principle, corporate votes are property, not rights. If you believe corporate votes *should* be impermissible to trade separately from shares, you must admit that you view economic power as a form of civic status, which would tighten the Pricing Constraint significantly.

  ### Final Assessment

  Your intuitions are governed by a **Republican** conception of markets (markets must serve the public good and be stewarded by the state) mixed with a **Social Expressivist** concern (how the market *looks* matters as much as what it *does*).

  **The Weak Point:** The tolerance for Legacy Admissions (Case 6) is the weakest link. It forces the principle to endorse hypocrisy as a moral good.
  **The Strong Point:** The distinction between Fixed Price and Auction for status goods (Case 7) is philosophically rich. It protects human dignity from being "priced" by competition, even if the outcome is unequal.

  **Advice:** If you want a principle you can defend in public, **surrender the Legacy Admissions verdict.** Admit that if an auction is corrupt, the opaque equivalent is also corrupt, merely less honest. This removes the "Hypocrisy Clause" and leaves you with a cleaner **Principle of Public Stewardship**: *If the outcome is impermissible when explicit, it is impermissible when opaque.* This strengthens your stance on Case 6 without breaking the rest of your list.
