  **JOINT STATEMENT ON THE ONTOLOGICAL STATUS OF MATHEMATICS IN EMPIRICAL EXPLANATION**

  **Issued by:** The Collaborative Working Group on Mathematical Ontology
  **Date:** October 26, 2023
  **Signatories:** [Name], Representative of Mathematical Platonism; [Name], Representative of Mathematical Nominalism

  ### Part I: Agreed Framework and Claims

  The undersigned parties, having engaged in adversarial collaboration regarding the indispensability of mathematical objects in empirical explanation, hereby affirm the following claims as common ground for further inquiry:

  1.  **Scientific Practice:** Both parties agree that contemporary scientific and ordinary empirical explanations frequently make essential reference to mathematical entities (numbers, sets, functions, geometric structures). It is agreed that removing these references often renders the explanation unintelligible or loses predictive power within current scientific discourse.
  2.  **Structural Common Ground on Examples:** The parties agree to evaluate the dispute using three classes of explanatory cases. Where empirical details are contested, the parties agree to formulate the cases at the level of their structural features:
      *   **Graph-Theoretic Impossibility:** Explanations citing the connectivity properties of a network to demonstrate why a specific physical task (e.g., traversing all paths without repetition) is impossible.
      *   **Geometric Minimization:** Explanations citing variational principles (e.g., minimal surface area) to demonstrate why a physical structure (e.g., a cellular partition) adopts a specific shape.
      *   **Arithmetic Regularity:** Explanations citing number-theoretic properties (e.g., primality) to demonstrate why a biological or physical system exhibits a specific periodic regularity (e.g., life-cycle synchronization).
  3.  **The Role-Preservation Condition:** The parties agree that the Role-Preservation Condition is part of the **agreed methodological framework**. Any nominalist reconstruction of a mathematical explanation must preserve not only the truth values of the original statements but also the explanatory and inferential role the mathematics originally played. A paraphrase that renders the explanation opaque or inferentially weaker is insufficient, regardless of its ontological parsimony.
  4.  **Excluded Positions:** The following views are excluded from this collaboration as unproductive for the current inquiry:
      *   **Hard Instrumentalism:** The view that mathematical statements are literally meaningless or merely emotional expressions. Both parties agree mathematical statements have truth conditions.
      *   **Radical Pythagoreanism:** The view that physical reality is *identical* to mathematical structure, thereby dissolving the distinction between abstract and concrete. Both parties agree a distinction between the physical system and the mathematical model is necessary for the dispute to arise.
  5.  **Conditions for Resolution:** The parties agree that the dispute would be settled in favor of the Nominalist if a reconstruction is produced that satisfies the Role-Preservation Condition for all three structural example classes without covertly reintroducing abstract commitments. The dispute would be settled in favor of the Platonist if it is demonstrated that satisfying the Role-Preservation Condition necessarily requires quantification over abstract objects.

  ### Part II: Disagreements Table

  The following table outlines the central points of contention remaining after the collaboration.

  | Row | Neutral Formulation of the Question | Platonist Formulation | Nominalist Formulation | Judgment on Disagreement |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Ontological Commitment:** Does the truth of an empirical explanation citing mathematical objects entail the existence of those objects? | **Yes.** If an explanation essentially quantifies over primes or graphs, and the explanation is true, then primes and graphs must exist as abstract objects. | **No.** Truth in this context is secured by relations among concrete particulars or logical consistency, not by the existence of abstract referents. | **Substantive.** The parties disagree on the truth-conditions of existential quantification in scientific theories. |
  | **2** | **Source of Explanatory Power:** What grounds the explanatory force of the mathematics in the examples? | **Abstract Structure.** The explanation works because the physical system instantiates real, mind-independent mathematical relations. | **Logical/Modal Structure.** The explanation works because of the logical constraints on how concrete systems can be arranged, which mathematics merely models. | **Mixed (Substantive/Verbal).** Substantive regarding whether structures exist independently; verbal regarding the definition of "instantiation" vs. "modeling." |
  | **3** | **Feasibility of Paraphrase:** Can the explanatory role of mathematics be fully recovered without ontological commitment? | **No.** Attempts to paraphrase inevitably lose the generality or modal strength required by the Role-Preservation Condition. | **Yes.** Apparent losses in generality are artifacts of platonist language; a sufficiently rich nominalistic language can recover the role. | **Substantive.** This is an empirical claim about the limits of linguistic reconstruction and logical expressiveness. |

  ### Part III: Cruxes and Predictive Cases

  The following sub-questions represent "cruxes" where a settled answer would significantly alter the credence of at least one party. For each crux, a concrete case is identified, and the prior predictions of each party are recorded.

  **Crux 1: The Reducibility of Arithmetic Properties**
  *   **Sub-Question:** Can number-theoretic properties (like primality) be fully analyzed as relations among concrete temporal intervals or physical tokens without loss of modal strength?
  *   **Concrete Case:** **Periodical Cicadas.** The explanation for 13- and 17-year emergence cycles relies on the fact that these numbers share no common divisors with potential predator cycles.
  *   **Predictions:**
      *   *Platonist:* Predicts that nominalist reconstructions (e.g., treating numbers as classes of concrete tokens) will fail to explain why *any* system with these cycle lengths would avoid intersection, as they cannot capture the necessary truth of arithmetic.
      *   *Nominalist:* Predicts that a reconstruction based on divisibility relations among concrete time-units will preserve the explanatory power, showing that "primality" is just a description of physical incompatibility.

  **Crux 2: The Location of Geometric Optimality**
  *   **Sub-Question:** Is the optimality in physical shapes a consequence of physical forces alone, or does it rely on pre-existing geometric facts that constrain those forces?
  *   **Concrete Case:** **Honeycomb/Soap Partitions.** The explanation for hexagonal structures relies on the theorem that hexagons minimize perimeter for a given area among tilings.
  *   **Predictions:**
      *   *Platonist:* Predicts that physical force explanations presuppose the geometric theorem; the bees do not "calculate," but the space they inhabit constrains them via abstract geometric facts.
      *   *Nominalist:* Predicts that the "theorem" is merely a summary of how physical energy minimization behaves in a Euclidean manifold, recoverable via calculus on physical fields without referencing "hexagons" as abstract types.

  **Crux 3: The Independence of Topological Constraints**
  *   **Sub-Question:** Do topological impossibilities hold in virtue of the physical medium, or in virtue of the abstract graph structure that the medium instantiates?
  *   **Concrete Case:** **Network Traversability (Königsberg Style).** The explanation for why a specific routing task is impossible relies on the odd-degree nodes of the graph.
  *   **Predictions:**
      *   *Platonist:* Predicts that the impossibility holds regardless of the physical material of the bridges; the constraint is topological and exists independently of the concrete bridges.
      *   *Nominalist:* Predicts that the "topological constraint" is just a generalization over all possible physical arrangements of paths; the explanation is about physical connectivity, not abstract graphs.

  ***

  **Signed:**

  _________________________
  [Platonist Representative]

  _________________________
  [Nominalist Representative]
