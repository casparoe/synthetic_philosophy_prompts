          2.  **Step (6)-(7): The Coupling-Constitution Fallacy.** Just because you can access it doesn't mean it's part of the cognitive process. Latency matters.
          3.  **Step (8): The Shared Mind Fallacy.** EMT extends *individual* boundaries. It doesn't dissolve boundaries between agents.
      *   **The "Docs are Pointless" Rebuttal:** This is the practical killer. EMT requires *encoding*. If you don't write docs, there is no external memory to extend into. The lead is arguing for the *result* (docs exist) while rejecting the *process* (writing docs).
      *   **Cost of Rejection:**
