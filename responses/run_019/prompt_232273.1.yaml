answer: |-
  # Editorial Procedure: Human Genetics & Heritability Stories

  **Purpose:** To prevent the publication of genetically deterministic, scientifically inaccurate, or socially harmful claims regarding human traits.
  **Time Budget:** 15 minutes per decision.
  **Authority:** This checklist is binding. If a story fails a 'Kill' criterion, it is killed. If it fails a 'Caveat' criterion, the copy must be amended before sign-off.

  ---

  ## The Checklist

  Apply these steps in order. Do not proceed to the next step if the story is killed.

  ### Step 1: The Determinism & Scope Gate
  **Action:** Scan the headline, subhead, and first paragraph.
  **Error Caught:** Genetic essentialism (e.g., "gene for X"), individual-level prediction, or universal claims from specific samples.
  **Rule:**
  *   **Kill** if the copy implies genes *cause* the trait in an individual (e.g., "divorce gene").
  *   **Kill** if the copy generalises findings from one population (e.g., white British twins) to all humans without qualification.
  *   **Mandatory Wording:** Replace "heritable" with "variation linked to genetic differences in this group". Replace "gene for [trait]" with "genetic variants associated with [trait]".
  *   **Missing Data:** If the abstract does not specify the sample demographics (ancestry, age, SES), assume the sample is homogeneous (e.g., European, affluent). Add the caveat: "Findings apply to this specific group and may not hold elsewhere."

  ### Step 2: The Method & Remainder Gate
  **Action:** Identify the method (Twin, SNP/GCTA, PGS, Family) and check how the 'missing variance' is described.
  **Error Caught:** Conflating twin and SNP estimates; claiming the non-heritable remainder is purely 'environment'.
  **Rule:**
  *   **Caveat Required:** If twin estimates are cited alongside SNP estimates, note that twin studies often capture shared environment as genetic, inflating the figure.
  *   **Kill** if the copy claims the remainder ($1 - h^2$) is entirely "environmental" or "modifiable". The remainder includes measurement error, rare variants, and gene-environment interaction.
  *   **Mandatory Wording:** If discussing the remainder, use: "The remaining variation is due to non-genetic factors and measurement error, not necessarily modifiable environment."
  *   **Judgement Call:** If the study is a Polygenic Score (PGS) prediction in a new sample, assume overfitting. Reduce claimed predictive power by half in the copy unless cross-validated.

  ### Step 3: The Implication Gate
  **Action:** Assess any policy, medical, or social conclusions drawn from the heritability estimate.
  **Error Caught:** The Intervention Fallacy (high heritability = immutability); The Group Fallacy (within-group $h^2$ explains between-group differences).
  **Rule:**
  *   **Kill** if the story argues that high heritability limits the potential for environmental intervention (e.g., policy, therapy, public health).
  *   **Kill** if the story uses within-group heritability to explain differences between groups (e.g., nations, classes, ethnicities).
  *   **Mandatory Wording:** If discussing intervention, use: "High heritability does not preclude environmental change. (Example: Myopia is highly heritable but corrected by lenses.)"
  *   **Missing Numbers:** If confidence intervals are not provided, do not report the point estimate as a precise fact. Use "approximately" or "around".

  ---

  ## Distinctions: Keep vs. Drop

  **Must Survive Translation:**
  1.  **Population Specificity:** Heritability is about *variance in a group*, not *destiny in a person*.
  2.  **Malleability:** Heritability $\neq$ Immutability.
  3.  **Method Variance:** Twin $\neq$ SNP.

  **Safe to Drop for Lay Readership:**
  1.  **Additive vs. Non-Additive:** Do not burden copy with $V_A$ vs $V_D$. Use "genetic influence".
  2.  **Shared vs. Non-Shared Environment:** Unless central to the story, collapse into "environmental factors".
  3.  **LD Score Regression details:** Irrelevant for general news.

  ---

  ## Application to Cases

  ### Case 1: Divorce (Twin Study, 40% Heritable)
  **Proposal:** Headline stating divorce is 'in your genes'.
  **Procedure Conclusion:** **Run with Heavy Caveats.**
  **Working Step:** **Step 1 (Determinism & Scope Gate).**
  **Reasoning:** The phrase 'in your genes' implies individual determinism and ignores the population-specific nature of the statistic. However, the finding itself (variation in divorce risk has a genetic component) is defensible if phrased correctly.
  **Final Published Wording:**
  *   **Headline:** "Genetic differences linked to variation in divorce risk, study suggests"
  *   **Lead:** "Around 40 per cent of the *differences* in divorce rates within this specific group were associated with genetic variation. This does not mean divorce is predetermined for any individual."
  *   **Caveat:** "Results depend on the environment of the sample; in a society where divorce is stigmatised or illegal, heritability would differ."

  ### Case 2: Education (SNP 12% vs Twin 40%)
  **Proposal:** Writer claims the difference means 'the environment is 88 per cent of the story'.
  **Procedure Conclusion:** **Run with Heavy Caveats (Conditional on Rewrite).**
  **Working Step:** **Step 2 (Method & Remainder Gate).**
  **Reasoning:** The claim that the remainder is "environment" is scientifically false. The gap between SNP and twin estimates largely represents rare variants and non-additive genetic effects not captured by chips, not environment. However, the story can run if the error is corrected.
  **Final Published Wording:**
  *   **Correction:** The copy must state: "The gap between the 12 per cent and 40 per cent estimates likely reflects genetic variants the SNP method missed, not purely environmental factors."
  *   **Lead:** "While twin studies suggest a higher genetic influence, direct DNA analysis captures a smaller portion. The remaining variation is a mix of unmeasured genetic factors, environment, and error."
  *   **Note:** If the writer refuses to remove the "88 per cent environment" claim, the story becomes a **Kill**.

  ### Case 3: Obesity (High Heritability, Policy Argument)
  **Proposal:** Editorial team argues public-health interventions will have limited effects due to high heritability.
  **Procedure Conclusion:** **Kill.**
  **Working Step:** **Step 3 (The Implication Gate).**
  **Reasoning:** This commits the Intervention Fallacy. High heritability within a group says nothing about the efficacy of shifting the population mean via environment (e.g., sugar taxes, urban planning). PKU is 100 per cent heritable but managed by diet. Publishing this argument would be scientifically illiterate and potentially harmful to public health discourse.
  **Reason for Kill:** "The central argument—that high heritability limits intervention efficacy—is logically invalid. No amount of copy-editing can fix a premise that contradicts basic quantitative genetics. Running this would damage the publication's scientific credibility."

  ---

  ## Limitations of this Procedure

  Even if a story passes every step above, this procedure **cannot guarantee**:

  1.  **Replicability:** The underlying study may be a false positive or fail to replicate in future years. We are vetting the *claim*, not the *truth*.
  2.  **Reader Interpretation:** Readers may still infer determinism from accurate copy (e.g., reading "linked to" as "caused by").
  3.  **Political Weaponisation:** Accurate statistics can be cherry-picked by bad actors to support prejudiced views. We cannot control downstream usage, only our own framing.
  4.  **Nuance Loss:** In condensing complex models for a general audience, some scientific precision is inevitably sacrificed. We prioritise avoiding harm over maximal technical detail.

  **Editor's Note:** When in doubt, Kill. A missing story is preferable to a misleading headline that survives in search results forever.
