answer: |-
  # The Future-Value Filter: A Go/Kill Procedure

  **Purpose:** To prevent escalation of commitment (the "Dollar Auction") by mechanically separating past investment from future value.
  **Timebox:** 15 Minutes per project.
  **Participants:** Project Lead, Operations Lead (You), Finance Rep.
  **Rule #1:** The words "spent," "already," "sunk," or "past" are banned from the room. If used, the speaker is interrupted immediately.

  ---

  ## Part A: Pre-Flight (Before the project starts)
  *You cannot run this procedure effectively if you don't know what success looked like at the start. This must be done at project kickoff.*

  1.  **Define the "Kill Switch":** What specific metric (date, budget, performance) triggers an automatic review?
      *   *Example:* "If Phase 2 is not done by Oct 1, we stop."
  2.  **Define Minimum Viable Return (MVR):** What is the lowest future ROI this company accepts for *new* money?
      *   *Example:* "Any new spend must return 1.5x within 24 months."

  ---

  ## Part B: The In-Meeting Procedure
  *Run these steps in order. If a step fails, the project is recommended for "Kill" unless it moves to Part C.*

  ### Step 1: The Zero-Base Question
  **Ask:** "If we were not doing this project today, and someone pitched it to us with the *current* scope and *remaining* costs, would we start it?"
  *   **Pass:** A clear "Yes."
  *   **Fail:** Hesitation, "Well, we have to finish," or "No."
  *   **Action:** If **Fail**, move immediately to **Kill Recommendation**.

  ### Step 2: The Future-Only ROI
  **Ask:** "Ignoring all money spent so far: What is the cost to finish, and what is the *future* financial value?"
  *   **Calculation:** (Future Value) ÷ (Cost to Finish).
  *   **Pass:** Ratio meets the Pre-Flight MVR (e.g., >1.5x) OR payback period is within company standards (e.g., <2 years).
  *   **Fail:** Ratio is <1.0 (loss) or payback exceeds standards.
  *   **Action:** If **Fail**, move to **Kill Recommendation**.

  ### Step 3: The Opportunity Cost Check
  **Ask:** "If we free up the team and budget required to finish this, what is the next best thing they could do? What is that worth?"
  *   **Pass:** The value of the *next best thing* is less than the Future Value of this project.
  *   **Fail:** The team could generate more value elsewhere.
  *   **Action:** If **Fail**, move to **Kill Recommendation**.

  ### Step 4: The External Constraint Check
  **Ask:** "Is there a legal, contractual, or safety obligation that forces us to finish, regardless of ROI?"
  *   **Pass:** No.
  *   **Fail:** Yes (e.g., penalty clauses, regulatory compliance).
  *   **Action:** If **Fail**, **STOP**. Hand off to **Part C**.

  ### Step 5: The Recommendation
  *   **Go:** Passed Steps 1, 2, and 3.
  *   **Kill:** Failed Steps 1, 2, or 3.
  *   **Escalate:** Stopped at Step 4.

  ---

  ## Part C: The Handoff (Values & Strategy)
  *This is where the procedure ends and your judgment begins. The math cannot solve these.*

  **Trigger:** The project failed the math (Part B) but passed Step 4 (External Constraint) OR the Project Lead appeals the Kill Recommendation based on "Strategic Intangibles."

  **Your Decision Framework:**
  1.  **Reputation Cost:** Is the cost of killing higher than the cost of finishing? (e.g., Market perception).
  2.  **Relationship Value:** Is this a loss-leader to keep a key client?
  3.  **Morale:** Will killing this destroy the engineering team's willingness to take risks?

  **Output:** You make the final call. You must explicitly state: *"I am overruling the math because [Strategic Reason]."* This prevents the math from being corrupted to fit the decision.

  ---

  ## Limitations & Misfire Risks
  *Be honest with your team about where this breaks.*

  1.  **The "Almost There" Trap:** If a project is 95% done, the Future ROI will look infinite (tiny cost for full value). This procedure will recommend "Go." This is usually correct, but watch for the "95% done" lie.
  2.  **Strategic Blindness:** This procedure is financial. It will recommend killing R&D or moonshots that have undefined future value. You must categorize "Research" projects separately so they aren't judged on immediate ROI.
  3.  **Gaming the Estimates:** Project Leads will sandbag the "Cost to Finish" to pass Step 2. You need Finance to validate the remaining estimates, not the Project Lead.

  ***

  # Application to Your Three Scenarios

  Here is how the procedure runs on your current backlog.

  ### 1. The Software Migration
  *   **Data:** Sunk $2.1M. Remaining $1.4M. Benefit $90k/yr savings. No new capability.
  *   **Step 1 (Zero-Base):** Would we start a $1.4M project today to save $90k/year?
      *   *Room Response:* "No."
      *   *Result:* **FAIL.**
  *   **Step 2 (Future ROI):** Cost $1.4M. Annual Return $90k. Payback period = 15.5 years.
      *   *Result:* **FAIL** (Assuming standard <3 year payback).
  *   **Step 3 (Opp Cost):** Could the engineering team generate more than $90k/yr elsewhere?
      *   *Result:* **FAIL.**
  *   **Step 4 (Constraints):** Any legal requirement to finish?
      *   *Result:* No.
  *   **Procedure Decision:** **KILL.**
  *   **Handoff?** No. Math is decisive.
  *   **Where the Room Will Fight:**
      *   **The Sunk Cost Outburst:** The Project Lead will say, "We can't throw away $2.1M." You must enforce Rule #1 immediately.
      *   **The "Hate" Factor:** This is the kill you will hate. It admits a $2.1M failure on the P&L this quarter. It looks like incompetence. However, spending another $1.4M to lose money is worse.
      *   **Procedure Verdict:** The procedure forces you to take the $2.1M hit now to save the $1.4M.

  ### 2. The Loss-Making Product Line
  *   **Data:** Losing money. Cancel = $600k penalty + loss of other business.
  *   **Step 1 (Zero-Base):** Would we start this product line today?
      *   *Room Response:* "No, it loses money."
      *   *Result:* **FAIL.**
  *   **Step 2 (Future ROI):** Negative.
      *   *Result:* **FAIL.**
  *   **Step 3 (Opp Cost):** N/A (Failed Step 2).
  *   **Step 4 (Constraints):** Is there a contractual obligation?
      *   *Room Response:* "Yes, $600k penalty and loss of customer relationship."
      *   *Result:* **STOP. HANDOFF TO OPS LEAD.**
  *   **Procedure Decision:** **ESCALATE.**
  *   **Handoff?** Yes. This is a Values/Strategy call.
  *   **Where the Room Will Fight:**
      *   **Finance vs. Sales:** Finance will see the product line loss. Sales will see the relationship value.
      *   **Your Role:** The procedure correctly identifies this is not a math problem. You must decide if the "other business" is profitable enough to subsidize this line. The procedure protects the Project Lead from being blamed for the loss, as the decision is now strategic, not operational.

  ### 3. The Government Bid
  *   **Data:** Sunk $300k (proposal). Remaining cost to submit/finalize included in the "return" calc? Prompt says "return about $50k over our submission costs". Let's assume Net Future Value = +$50k.
  *   **Step 1 (Zero-Base):** Would we bid on a contract today if the net profit was only $50k?
      *   *Room Response:* "Probably not. Too much risk for too little gain."
      *   *Result:* **FAIL** (Assuming your MVR is higher than $50k net).
  *   **Step 2 (Future ROI):** Future Value $50k.
      *   *Result:* **FAIL** (Against typical engineering hurdle rates).
  *   **Step 3 (Opp Cost):** Could the proposal team do anything else?
      *   *Room Response:* "They could bid on Project X which has $500k margin."
      *   *Result:* **FAIL.**
  *   **Step 4 (Constraints):** Legal obligation to submit?
      *   *Result:* No.
  *   **Procedure Decision:** **KILL.**
  *   **Handoff?** No.
  *   **Where the Room Will Fight:**
      *   **The "Recoup" Argument:** The Lead will argue, "If we win, we get *some* of the $300k back." You must remind them the $300k is gone regardless.
      *   **The "Hate" Factor:** You might hate this kill because +$50k is better than $0. However, the procedure highlights that the *Opportunity Cost* (Step 3) is likely higher. If your team is capacity-constrained, chasing a $50k margin is a distraction.
      *   **Risk:** If you kill this, the $300k is 100% loss. If you bid, there's a *chance* to reduce that loss. The procedure treats probability as "average return." If the room believes the win probability is understated, they will fight Step 2.

  ### Summary of Friction Points

  | Scenario | Procedure Verdict | Primary Friction Point | Why You'll Hate It |
  | :--- | :--- | :--- | :--- |
  | **1. Migration** | **KILL** | Admitting the $2.1M is gone. | It books an immediate large loss. It feels like quitting. |
  | **2. Product Line** | **ESCALATE** | Finance vs. Relationship value. | You have to take personal responsibility for a "bad math" decision. |
  | **3. Gov Bid** | **KILL** | Ignoring the chance to recoup sunk costs. | It feels like leaving money on the table, even if it's inefficient. |

  **Final Advice:** The procedure works only if you enforce Rule #1 (The Sunk Cost Ban) ruthlessly. In Scenario 1, the Project Lead *will* try to amortize the $2.1M over the future life to make the ROI look better. Do not allow it. The $2.1M is history. The $1.4M is the only number that matters.
