answer: |-
  There is no single, universally recognised proper noun in the philosophical literature that exclusively labels this specific cluster of linguistic behaviours. While the phenomena you describe are central to the debate on vagueness, they are typically referred to descriptively as 'ordinary intuitions regarding borderline cases', 'the phenomenology of vagueness', or 'pre-theoretical usage data'. 

  Since no established label exists, I shall coin the term **"The Borderline Acquiescence Pattern"**.

  ### Definition and Edges

  **Definition:** The Borderline Acquiescence Pattern is the observable tendency of competent speakers, when confronted with a paradigmatic borderline case of a vague predicate, to exhibit four concurrent attitudes:
  1.  **Assertoric Hesitance:** A refusal to categorically assert the predicate ($F$) or its negation ($\neg F$).
  2.  **Logical Commitment:** An acceptance of the Law of Excluded Middle ($F \lor \neg F$) and the Law of Non-Contradiction ($\neg (F \land \neg F)$).
  3.  **Permissiveness:** A refusal to correct interlocutors who assert either $F$ or $\neg F$, treating both verdicts as pragmatically permissible.
  4.  **Non-Factualism:** A reluctance to affirm that there is a determinate fact of the matter regarding the case.

  **Edges:**
  *   **Inner Edge:** This pattern distinguishes borderline cases from *clear cases*. In clear cases (e.g., a 7-foot man), speakers do not exhibit assertoric hesitance; they assert $F$ and correct those who deny it.
  *   **Outer Edge:** This pattern distinguishes vagueness from *ambiguity* or *contradiction*. In ambiguity, speakers resolve the meaning before asserting; in contradiction, speakers reject the conjunction outright without permissiveness. It also distinguishes this pattern from *relativist* domains (like taste), where speakers might accept that both verdicts are simultaneously true for different speakers, whereas in the Borderline Acquiescence Pattern, speakers still reject the idea that the man is *both* tall and not tall.

  ### Fit with Rival Accounts

  You ask whether this pattern fits the 'Gap' account (statements are neither true nor false) or the 'Epistemic' account (statements are true or false but unknowable) better. The answer is nuanced, as the pattern is the primary data both theories attempt to accommodate, but they do so with different costs.

  **1. The Gap Account (specifically Supervaluationism)**
  Standard three-valued logic (a type of Gap view) actually fails your second criterion: it typically rejects the Law of Excluded Middle for borderline cases (if $F$ is indeterminate, $F \lor \neg F$ is also indeterminate). However, **Supervaluationism**, a sophisticated Gap theory, fits the pattern remarkably well.
  *   **Fit:** It preserves classical logic (so $F \lor \neg F$ is true) while maintaining that neither $F$ nor $\neg F$ is *super-true*. This explains the Assertoric Hesitance (we only assert what is super-true) and the Logical Commitment.
  *   **Strain:** It struggles slightly with Permissiveness. If neither statement is true, strictly speaking, asserting either is incorrect. Supervaluationists must argue that speakers are following a pragmatic norm rather than a semantic one to explain why we do not correct one another.

  **2. The Epistemic Account**
  *   **Fit:** This account perfectly predicts the Logical Commitment (classical logic holds) and the Assertoric Hesitance (we are ignorant of the truth).
  *   **Strain:** It fits the Permissiveness criterion poorly. If Epistemicism is correct, there is a sharp boundary. Therefore, one speaker is telling the truth and the other is making a mistake. The Epistemicist must argue that the intuition of 'faultless disagreement' is a cognitive illusion caused by our inability to detect the boundary.

  **Verdict:** The Borderline Acquiescence Pattern fits **Supervaluationism** slightly better than Epistemicism regarding the intuition that neither speaker is *mistaken*. However, it fits **Epistemicism** better regarding the robust intuition that classical logic (Excluded Middle) applies without exception. Ordinary speakers do not typically distinguish between 'true' and 'super-true', so both accounts require some error theory to explain the full pattern.

  ### Discriminating Observable Behaviour

  You suspect this pattern cannot discriminate between the two accounts. You are largely correct that the *basic* pattern is compatible with both, provided one accepts certain auxiliary hypotheses. However, there are observable behaviours—specifically regarding **higher-order vagueness** and **betting dispositions**—that can discriminate between them.

  **1. The 'Definitely' Operator Test**
  Ask speakers to evaluate the following two sentences regarding the borderline man:
  *   (A) "It is definitely true that he is either tall or not tall."
  *   (B) "It is definitely true that there is a specific point where he becomes tall."

  *   **Epistemic Prediction:** Speakers should accept (B) if they understand the metaphysics, as the boundary exists.
  *   **Gap Prediction:** Speakers should reject (B), as there is no boundary even in principle.
  *   **Observation:** Competent speakers overwhelmingly reject (B). They insist there is *no fact of the matter*. While Epistemicists argue this is an illusion, the persistence of this report across contexts suggests the Gap account aligns better with natural linguistic behaviour.

  **2. Betting on the Boundary (The Forced March)**
  Construct a Sorites series (a line of men decreasing in height by millimetres). Force speakers to judge each one 'tall' or 'not tall' until they switch.
  *   **Behaviour to Observe:** Ask the speaker immediately after they switch: "Did you make a mistake at the previous step?"
  *   **Epistemic Prediction:** Yes. There was a correct cut-off point; you crossed it.
  *   **Gap Prediction:** No. The cut-off is arbitrary; no mistake was made because no boundary exists.
  *   **Discrimination:** Speakers typically report that the switch felt arbitrary and that they did not make a mistake, but merely changed their usage. This 'arbitrariness without error' is observable behaviour that favours the Gap account. Epistemicism requires the speaker to be systematically mistaken about their own cognitive state (believing they are arbitrary when they are actually tracking a truth).

  **3. Wagering on Truth**
  Offer a speaker a bet: "I bet £10 that there is a precise number of hairs that divides 'hairy' from 'bald'."
  *   **Epistemic Prediction:** A rational speaker who accepts the Epistemic theory should take the bet (as it is a fact).
  *   **Gap Prediction:** A rational speaker should refuse the bet (as the proposition lacks a truth value).
  *   **Discrimination:** In practice, speakers refuse the bet, often with conviction. This behavioural refusal to treat the boundary as a factual entity discriminates against the Epistemic account in terms of descriptive adequacy, even if the Epistemic account claims the speakers are metaphysically wrong.

  In summary, while the Borderline Acquiescence Pattern itself is the shared datum, the **refusal to wager on the existence of a sharp boundary** and the **denial of error during forced switches** are observable behaviours that discriminate between the two accounts, favouring the Gap (specifically Supervaluationist) interpretation of how speakers actually treat the world.
