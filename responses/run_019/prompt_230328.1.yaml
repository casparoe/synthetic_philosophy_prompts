answer: |-
  # Desiderata for an Account of Common Knowledge of Rationality

  ### Purpose
  The purpose of an account of Common Knowledge of Rationality (CKR) is to specify the precise epistemic conditions under which rational agents coordinate actions or predict outcomes in strategic settings. The account must be adequate for explaining how rational agents coordinate, or fail to coordinate, under shared and private information, and for underpinning solution concepts such as Nash equilibrium, correlated equilibrium, and backward induction. It must delineate the boundary between strategic stability driven by logical necessity and stability driven by psychological habit or institutional enforcement.

  ---

  ### Requirements List

  **1. The Infinite Hierarchical Requirement**
  *   **Specification:** The account must define common knowledge as a fixed point of an infinite hierarchy of mutual knowledge operators ($K_i K_j K_i \dots p$). It must explicitly reject the reduction of common knowledge to any finite level of mutual knowledge (e.g., "everyone knows that everyone knows").
  *   **Motivation:** In coordination games with payoff uncertainty (e.g., Rubinstein's Email Game), finite levels of mutual knowledge yield different strategic prescriptions than common knowledge. If the hierarchy collapses to level $k$, agents may fail to coordinate on the payoff-dominant equilibrium even when communication is highly reliable. An adequate theory must explain why the $k+1$ level matters strategically, preserving the discontinuity between finite and infinite depth.
  *   **Status:** **Non-Negotiable.**

  **2. The Publicity vs. Correlated Privacy Requirement**
  *   **Specification:** The account must distinguish mechanically between events that generate common knowledge (public announcements, public observables) and events that generate only correlated private information (overlapping signals, private messages). It must specify the structural feature of "publicity" that closes the infinite hierarchy.
  *   **Motivation:** Conventions (e.g., driving on the right) rely on public salience. If two agents see a signal privately but do not know the other saw it, coordination fails. A theory that treats correlated priors as equivalent to public announcements cannot explain coordination failure in the absence of a public event.
  *   **Status:** **Non-Negotiable.**

  **3. The Fragility and Approximation Requirement**
  *   **Specification:** The account must handle the discontinuity between "common knowledge" and "common $p$-belief" (where $p \to 1$). It must explain why making the probability of message failure arbitrarily small does not converge to the strategic outcome of common knowledge.
  *   **Motivation:** The Coordinated Attack Problem (Generals' Paradox). No finite number of confirming messages establishes common knowledge if there is a non-zero probability of loss. If the theory treats "probability 0.999... common belief" as functionally equivalent to common knowledge, it cannot explain why rational agents refuse to attack in the limit case. The theory must preserve the logical fragility of common knowledge under fallible communication.
  *   **Status:** **Non-Negotiable.**

  **4. The Modal Distinction Requirement**
  *   **Specification:** The account must rigorously separate knowledge (truth-entailing) from belief (potentially false), and certainty (probability 1) from knowledge. It must declare whether CKR requires agents to *know* others are rational (implying they actually are) or merely *believe* others are rational (allowing for error).
  *   **Motivation:** In dynamic games, players may observe moves that are inconsistent with rationality. If rationality is "known," such moves are impossible, rendering off-path beliefs undefined. If rationality is only "believed," belief revision is possible. The theory must specify which modality underwrites which solution concept (e.g., Nash vs. Rationalizability).
  *   **Status:** **Non-Negotiable.**

  **5. The Content Specification Requirement**
  *   **Specification:** The account must specify the object of the common knowledge. It must state whether CKR entails common knowledge of: (a) the game structure, (b) utility functions, (c) the common prior, or (d) the solution concept itself. It must avoid circularity where knowing the solution concept presupposes the solution concept.
  *   **Motivation:** Different epistemic characterizations yield different equilibria. Common knowledge of utilities and priors yields Nash; common knowledge of rationality alone yields Rationalizability. A theory that leaves the content vague cannot predict which equilibrium refinement applies.
  *   **Status:** **Preference of Particular Camp** (Bayesian vs. Epistemic Game Theory).

  **6. The Consistency with Agreement Results Requirement**
  *   **Specification:** The account must be consistent with Aumann's "Agreeing to Disagree" theorem. If agents share a common prior and their posterior probabilities become common knowledge, those probabilities must be identical. The theory must explicate the consequences of dropping the Common Prior Assumption (CPA).
  *   **Motivation:** This is a foundational constraint on Bayesian rationality. If an account of CKR allows for common knowledge of differing posteriors under a common prior, it is logically incoherent. Conversely, it must explain how strategic disagreement persists when priors are heterogeneous.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Analysis of Requirements and Conflicts

  **The Hardest Working Requirements**
  The pair of requirements that does the most work in excluding candidate accounts is **Requirement 1 (Hierarchy)** combined with **Requirement 3 (Fragility)**.
  *   **Exclusionary Power:** This pair eliminates all psychological or bounded-rationality models that truncate the hierarchy at a finite depth. It also eliminates probabilistic models that treat "common certainty" (probability 1) as continuous with "high probability." Any account that smoothes over the discontinuity between finite mutual knowledge and infinite common knowledge fails to explain the specific coordination failures observed in electronic communication games and sender-receiver scenarios with noise.

  **Classification of Status**
  *   **Non-Negotiable:** Requirements 1, 2, 3, 4, 6. These are logical or structural constraints derived from the definition of knowledge and the mathematical properties of strategic interaction. Violating them results in a theory that contradicts established theorems or fails to model the target phenomena.
  *   **Preference of a Particular Camp:** Requirement 5. Whether CKR requires a Common Prior is debated. Some frameworks (Harsanyi type spaces) enforce it; others (epistemic logic without priors) do not. The choice dictates whether the theory supports Bayesian Nash Equilibrium or broader rationalizability concepts.

  **Apparent vs. Real Conflicts**

  **1. Attainability vs. Hierarchy/Fragility**
  *   **The Conflict:** Real agents communicating through fallible channels (Req 3) cannot cognitively process an infinite hierarchy (Req 1). If common knowledge is unattainable in practice, does the concept lose its explanatory value?
  *   **Resolution:** This is a **Real Conflict** regarding descriptive realism, but it is resolved by **Idealization**. The theory forfeits psychological plausibility to maintain logical rigor. The desideratum is not that agents *compute* the hierarchy, but that their behavior is *consistent* with the hierarchy. If we resolve this by making the hierarchy finite to satisfy attainability, we violate Req 1 and lose the ability to explain coordination failure in high-reliability channels. Therefore, the account must accept that CKR is a normative or asymptotic condition, not a descriptive psychological state.

  **2. CKR/Backward Induction vs. Off-Path Beliefs**
  *   **The Conflict:** If rationality is Common Knowledge (Req 1 & 4), a player should never observe a deviation from the equilibrium path, because a rational player would not deviate. However, Backward Induction requires reasoning about what would happen *if* a deviation occurred (off-path beliefs). If CKR holds, the "if" is counterpossible.
  *   **Resolution:** This is a **Real Conflict** within the standard semantic account. Resolving it requires modifying the Modal Distinction (Req 4). The theory must weaken CKR to **Common Belief in Rationality** (allowing for the possibility of error) or adopt a dynamic epistemic logic that allows for belief revision upon observing unexpected moves. A theory that insists on strict Knowledge (truth-entailing) cannot coherently underwrite Backward Induction without contradiction. To save Backward Induction, the account must forfeit the "Truth Axiom" of knowledge at off-path nodes.

  ---

  ### Scorecard of Contender Frameworks

  | Framework | Hierarchy (Req 1) | Publicity (Req 2) | Fragility (Req 3) | Modal Distinctions (Req 4) | Agreement Results (Req 6) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Syntactic (Multi-Agent Modal Logic)** | **Pass.** Explicitly models infinite operators. | **Pass.** Distinguishes public announcements via dynamic operators. | **Fail.** Struggles to represent probabilistic fragility without extension. | **Pass.** Clearly separates $K$ (knowledge) from $B$ (belief). | **Neutral.** Can model agreement but lacks native probability. | Best for static logical structure; weak on probabilistic fragility. |
  | **Semantic (Partitions over State Space)** | **Pass.** Common knowledge defined as the meet of partitions. | **Pass.** Public events are unions of cells accessible to all. | **Fail.** Often assumes truthful knowledge; struggles with "almost" common knowledge discontinuities. | **Fail.** Standard partitions assume knowledge is truthful; hard to model false belief. | **Pass.** Native home of Aumann's Agreement Theorem. | Best for Bayesian consistency; rigid on truth/belief distinction. |
  | **Type-Space (Harsanyi)** | **Pass.** Types encode the infinite hierarchy of beliefs explicitly. | **Pass.** Can model private vs. public signals via type correlation. | **Pass.** Can model higher-order uncertainty and probability $p$-beliefs. | **Pass.** Distinguishes belief (type mapping) from truth. | **Pass.** Accommodates Common Prior or heterogeneous priors explicitly. | **Most Adequate.** Captures all non-negotiables, though computationally heavy. |

  **Summary:** The **Type-Space approach** is the only framework that fully satisfies the Non-Negotiable requirements regarding Fragility and Modal Distinctions simultaneously. However, all frameworks require idealization to resolve the conflict between Attainability and Hierarchy.
