answer: |-
  This is a sophisticated and precise question. You have identified a specific dialectical move that sits at the heart of the debate between consequentialist aggregation and deontological/consequentialist non-aggregation views (e.g., Rawls, Nozick, Scanlon, Kamm).

  To give you a direct answer: **There is no single, canonical Latin name or standardized phrase** (like *ad hominem* or *tu quoque*) that exclusively denotes this specific defensive maneuver in the literature. It is usually discussed descriptively within the broader context of the **"Separateness of Persons"** objection.

  However, based on the structure you describe—conceding representational distinctness while insisting on operational fungibility—I can offer a taxonomy, propose a precise descriptive label, and distinguish it from the fallacies you mentioned.

  ### 1. Proposed Terminology

  If you need a label for your dissertation, I recommend **"The Formal Distinctness Defense"** or **"The Bookkeeping Shield."**

  *   **Why "Formal Distinctness"?** It captures the defender's claim that distinctness is preserved in the *form* of the model (the inputs/ledger) even if it is violated in the *function* of the model (the summation/output).
  *   **Why "Bookkeeping Shield"?** It highlights the metaphorical reliance on accounting practices (entries, ledgers, cohorts) to deflect moral criticism about sacrifice.

  In the literature, this is often treated as a subset of the **"Methodological Individualism"** defense. Defenders claim that because they are methodological individualists (they model individuals, not a social organism), they respect the separateness of persons. Critics argue this confuses *methodological* individualism with *moral* individualism.

  ### 2. Taxonomizing the Maneuver

  You asked how to distinguish this from question-begging, motte-and-bailey, or mere clarification. It can function as any of these three, depending on the defender's underlying commitment. Here is how to distinguish them in your analysis:

  #### A. As a Category Error (Mere Clarification)
  *   **Condition:** The objector implies that aggregation *metaphysically* merges persons into a "super-person" or "social organism."
  *   **The Move:** The defender clarifies that the model contains $N$ distinct variables, not one aggregate variable.
  *   **Verdict:** **Legitimate.** If the objector thinks utilitarianism posits a literal group mind, the defender is entitled to correct this. Rawls sometimes invites this interpretation by saying utilitarianism extends the principle of choice for one man to society.
  *   **Key Marker:** The defender is talking about *ontology* (what exists in the model).

  #### B. As a Motte-and-Bailey
  *   **Condition:** The defender retreats to the safety of "we count everyone separately" (Motte) when challenged, but advances to "therefore we can sacrifice one for the many" (Bailey) when constructing policy.
  *   **The Move:** The defender treats "counting separately" as if it logically entails "summing is permissible," without defending the bridge between them.
  *   **Verdict:** **Fallacious.** The fact that inputs are distinct does not entail that the operation on them is morally neutral.
  *   **Key Marker:** The defender acts as if the *representation* of distinctness solves the *moral* problem of trade-offs.

  #### C. As Question-Begging (The Most Common Form)
  *   **Condition:** The core dispute is whether well-being units are *fungible* across persons.
  *   **The Move:** The defender says, "We list them separately, then sum them."
  *   **Verdict:** **Begging the Question.** The objector's claim is precisely that the *summation operation* is what violates separateness, regardless of the input distinctness. By asserting that summation is a valid operation on distinct inputs, the defender assumes the permissibility of aggregation, which is the very point in dispute.
  *   **Key Marker:** The defender treats summation as a mathematically neutral step rather than a morally loaded one.

  ### 3. When is the Defender Entitled to This Move?

  You asked if there are cases where the defender is *entitled* to make this move. Yes, but the scope is narrow.

  **1. Against Metaphysical Holism:**
  If the objector argues that aggregation is impossible because society is not a *thing* that can experience utility, the defender is entitled to say, "We are not aggregating for a social thing; we are aggregating distinct individual experiences." This was a common response to early Idealist critiques of Utilitarianism.

  **2. In "Impersonal" Good Frameworks:**
  If the ethical framework explicitly defines the "Good" as impersonal (e.g., G.E. Moore's ideal utilitarianism or certain prioritarian views), the defender is entitled to the move. In these views, the "location" of the good (which person holds it) is morally secondary to the existence of the good itself. Here, the bookkeeping distinctness is a heuristic, not a moral constraint. The defender is being honest: "Yes, we distinguish persons for measurement, but no, we do not distinguish them for moral weighting."

  **3. In Risk/Ex-Ante Contexts:**
  In some Harsanyi-style veil-of-ignorance arguments, the defender is entitled to the move if they can show that the "loss" and "gain" are probabilistic risks borne by the *same* individuals over time. If the person losing the surgery today is the same person gaining minutes tomorrow (ex-ante), the "separateness" objection weakens. However, in your pension and surgery examples, the losses are concentrated and identified, so this defense usually fails.

  ### 4. Relevant Literature & Concepts for Your Footnotes

  To ground this in the literature, you should look for discussions under these headings:

  *   **Rawls, *A Theory of Justice*, §5:** "The Distinctness of Persons." Rawls argues utilitarianism does not take seriously the distinction between persons. The defense you describe is the standard utilitarian counter-argument found in replies to Rawls (e.g., by Harsanyi or Singer).
  *   **Nozick, *Anarchy, State, and Utopia*:** Nozick's critique is sharper. He argues there is no "social entity" with a good that undergoes sacrifice. The "bookkeeping" defense is explicitly rejected by Nozick as insufficient because it allows "moral balancing" across persons.
  *   **John Broome, *Weighing Goods*:** Broome distinguishes between "weighing" and "summing." He discusses whether the structure of the representation matters. This is close to your "bookkeeping" concern.
  *   **T.M. Scanlon, *What We Owe to Each Other*:** Scanlon's contractualism relies on the idea that justification must be possible *to each person*. The "bookkeeping defense" fails here because Scanlon argues that a loss to one cannot be "canceled" by gains to others in the justification phase, regardless of how the ledger is kept.
  *   **Frances Kamm, *Intricate Ethics*:** Kamm discusses the "Principle of Permissible Harm" and distinguishes between aggregating harms and aggregating benefits. She would classify the move you describe as a failure to recognize **"non-aggregative constraints."**
  *   **Methodological vs. Moral Individualism:** This distinction is crucial. **Methodological Individualism** (Weber, Elster) says social phenomena must be explained by individual actions. **Moral Individualism** (Rawls, Nozick) says moral status attaches to individuals in a way that blocks trade-offs. The maneuver you identified attempts to use the former to secure the latter.

  ### 5. Summary for Your Work

  In your dissertation, you might frame it this way:

  > "This argumentative maneuver, which I term **The Formal Distinctness Defense**, attempts to deflect the Separateness of Persons objection by conflating *representational distinctness* with *moral inviolability*. While defenders are entitled to this claim when correcting metaphysical misunderstandings about social holism, it functions as **question-begging** when deployed against moral objections to the fungibility of well-being. It operates as a **Motte-and-Bailey** when the safety of methodological individualism is used to shield the controversial normative claim that summation is morally neutral."

  This gives you a precise vocabulary to analyze the move without needing to invent a fallacy name that doesn't exist, while accurately capturing the logical structure you have observed.
