answer: |-
  This is one of the most fertile tensions in the philosophy of history, and you have put your finger on the exact nerve where the discipline's methodology rubs against its public function. The asymmetry you identify—between how historians treat past *facts* (geocentrism is false) and past *values* (slavery is... complicated)—is not an accident. It is a structural feature of modern historicism.

  Here is a breakdown of the theoretical commitments underlying the anti-presentism norm, its coherence, and the implications of treating morality as cumulative.

  ### 1. What Theory of Morality Does Anti-Presentism Presuppose?

  The anti-presentism norm does not necessarily presuppose moral relativism (the idea that moral truths vary by culture). Most academic historians are moral universalists in their private lives; they believe slavery was objectively wrong in 1790, not just "wrong for us."

  Instead, the norm presupposes a specific theory of **moral epistemology** and **agency**. It relies on a distinction between the *ontological status* of a moral claim (which is timeless) and the *historical availability* of that claim to the agent.

  *   **The "Moral Imaginary":** Historians operate on the premise that moral reasoning is constrained by the conceptual vocabulary available at the time. If the concept of "universal human rights" had not yet been synthesized or socially operationalized, the historian argues that the agent could not fully access the moral truth we now hold.
  *   **Ought Implies Can:** This is a Kantian holdover. To blame someone for failing to do $X$, they must have been able to do $X$. If the social, economic, and intellectual cost of rejecting slavery was total social death (or literally unthinkable), the historian hesitates to assign full *blameworthiness*, even if the act was *wrong*.

  So, the theory isn't that morality is time-indexed, but that **moral knowledge is historically situated.** This allows the historian to say, "Washington owned slaves. This was morally wrong. But judging him as a 'monster' explains nothing about why a man who espoused liberty did so, and imposes a psychological burden he could not have carried."

  ### 2. Is This Coherent, or Selective Relativism?

  It is coherent only if you maintain a strict firewall between **explanation** and **evaluation**.

  The geocentrism analogy works because factual error does not impugn character in the same way moral error does. Ptolemy was mistaken, but he wasn't *evil*. When historians judge past beliefs as "wrong" (factual) but hesitate to judge actions as "wrong" (moral), they are protecting the *subject* of their study from the verdict of the tribunal.

  However, your charge of "selective relativism" is potent. In practice, this firewall often leaks.
  *   **The Inconsistency:** Historians will happily condemn past sexism or racism as "wrong" if it aligns with current progressive values, but caution against condemning past economic exploitation if it complicates a narrative of progress. This suggests the anti-presentism norm is often applied selectively to protect certain icons or narratives.
  *   **The Public/Private Split:** The coherence breaks down between academic history and public history. In the archive, context is king. In the museum, values are king. A museum label *must* take a moral stand (e.g., "Slavery was a brutal system of exploitation") to function civically. Academic history fears that taking that stand prematurely shuts down inquiry into *why* intelligent people sustained it.

  The discipline would not avow relativism, but it practices a **methodological bracketing** of moral truth. It treats moral truth as irrelevant to the *causal explanation* of events. This is coherent methodologically, but increasingly incoherent ethically.

  ### 3. Can You Defend the Norm on Purely Epistemic Grounds?

  Yes, but the defense is weaker than historians usually admit. You can defend anti-presentism without relativism by arguing from **epistemic humility** and the **goal of inquiry**.

  *   **The Argument from Hubris:** We have no guarantee that our current moral consensus is the final one. If we judge the past solely by today's standards, we blind ourselves to the ways in which *our* moral certainties might look barbaric in 200 years. By suspending judgment, we keep our own moral assumptions in play for examination.
  *   **The Argument from Understanding (Butterfield's Defense):** The primary epistemic goal of history is to understand *how* the past happened, not to grade it. Moral judgment is a conversation-stopper. Once you label a figure a "monster," you stop asking how they came to be that way. You lose the causal chain. If the goal of history is knowledge, and judgment impedes knowledge, then judgment is epistemically costly.

  **The Flaw:** This defense fails when the moral error is the *cause* of the historical event. You cannot understand the Civil War without understanding the moral error of white supremacy. To bracket the moral judgment is to bracket the causal mechanism. In these cases, epistemic rigor *requires* moral clarity.

  ### 4. What If Historians Treated Moral Knowledge as Cumulative?

  If historians treated morality like science—assuming we know more now than they did then, and that moral truth accumulates over time—the discipline would undergo a radical transformation. This is essentially a return to **Whig History** (history as the march of progress), but with a critical twist.

  **Changes to Writing:**
  *   **Past Figures as Case Studies in Error:** Washington would be taught like Ptolemy. A brilliant mind operating within a flawed paradigm. The focus would shift from "understanding his dilemma" to "analyzing his failure to perceive the truth."
  *   **Teleology:** History would be written backward from the present moral consensus. Events would be categorized by whether they advanced or retarded moral knowledge.
  *   **Loss of Empathy:** The "historical imagination" (collingwood's idea of re-thinking past thoughts) would be replaced by "moral auditing." We would stop trying to think *with* the past and start thinking *about* it.

  **Changes to Teaching:**
  *   **Civic Formation:** History classes would look more like civics classes. The goal would be to inoculate students against past errors (e.g., "Study the Holocaust so you don't repeat the moral failure").
  *   **Lineage of Guilt/Responsibility:** If moral knowledge is cumulative, then inheriting the benefits of past moral errors creates present-day liability. This aligns with arguments for reparations. If slavery was objectively wrong *then*, the wealth generated from it is objectively tainted *now*.

  **The Risk:**
  Treating morality as cumulative risks flattening the past into a caricature. Science progresses because new data falsifies old theories. Morality does not progress linearly; it shifts, fractures, and sometimes regresses. If historians assume cumulative moral knowledge, they risk turning history into **hagiography for the present**. We become the saints, and they become the sinners. We lose the ability to see the structural similarities between their injustices and ours, because we assume we have solved the moral problems they faced.

  ### Summary for Your Piece

  The anti-presentism norm presupposes that **moral access is historically constrained**, even if moral truth is not. It is a methodological tool designed to preserve **explanatory power** at the cost of **moral clarity**.

  It is not strictly relativist, but it functions as a **suspension of moral ontology** for the sake of inquiry. However, this suspension is becoming unsustainable. As history moves from the archive to the public square (museums, memorials), the demand for moral clarity overrides the demand for contextual nuance.

  If historians embraced cumulative moral knowledge, they would gain public relevance and moral coherence but risk losing the ability to explain *why* the past happened, reducing complex human agents to vectors of error. The discipline is currently stuck trying to be both a science of causes (which requires neutrality) and a branch of ethics (which requires judgment). Your piece might argue that the split is no longer tenable: historians must decide if they are in the business of explaining the world or judging it. They cannot do both with the same tools.
