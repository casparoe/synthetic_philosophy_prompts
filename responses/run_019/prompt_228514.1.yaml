prompt: |-
  I cover science and ideas for a magazine, and I'm working on a piece about how historians handle moral judgment. The profession has this strong norm against "presentism": you're not supposed to judge people in the past by today's moral standards. A biographer who calls a slaveholding founder a monster gets accused of anachronism; grad students are trained to reconstruct what was even thinkable at the time. But the same discipline happily judges past beliefs as flatly wrong -- nobody says it's unfair to call geocentrists mistaken just because geocentrism was reasonable back then. And meanwhile the public-facing side of the field (museum labels, building renamings, commemoration fights) increasingly does make moral calls. So what theory of morality does the anti-presentism norm actually presuppose? That moral claims are time-indexed while factual claims aren't? Is that coherent, or does it smuggle in a selective relativism the discipline would never avow? Could you defend the norm on purely epistemic grounds -- we have no more reason to trust our moral instincts than they had theirs -- without any relativism at all? And what would have to change in how history gets written and taught if historians treated moral knowledge as cumulative, the way they treat scientific knowledge?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Role:** Science and ideas writer for a magazine.
      *   **Topic:** How historians handle moral judgment (specifically the norm against "presentism").
      *   **Core Tension:** Historians avoid judging past *actions/characters* by current standards (anti-presentism) but freely judge past *facts/beliefs* (e.g., geocentrism is wrong). Meanwhile, public history (museums, renaming) *does* make moral calls.
      *   **Key Questions:**
          1.  What theory of morality does anti-presentism presuppose? (Time-indexed morality?)
          2.  Is that coherent, or is it selective relativism?
          3.  Can the norm be defended on purely *epistemic* grounds (skepticism about moral progress) without relativism?
          4.  What would change if historians treated moral knowledge as cumulative (like science)?

  2.  **Initial Brainstorming & Analysis:**

      *   *The "Presentism" Debate:* This is a classic historiographical tension. Herbert Butterfield ("The Whig Interpretation of History") is the touchstone. The goal is understanding, not judging.
      *   *Fact vs. Value:* The user spots a disanalogy. We say Ptolemy was *wrong* about the sun, but we hesitate to say Washington was *wrong* about slavery (or we qualify it heavily). Why?
      *   *Theory of Morality:* Anti-presentism often implies a form of contextualism or relativism, but professional historians usually claim universalist values (human rights, etc.). This creates cognitive dissonance.
      *   *Epistemic Defense:* Can we say "We don't know better, just different"? That sounds like moral skepticism. But most historians *do* believe slavery is objectively bad. So the epistemic defense is shaky unless it's about *blameworthiness* rather than *wrongness*.
      *   *Cumulative Moral Knowledge:* If morality progresses like science, then presentism is actually *required*. We should judge the past by the truth we now hold. This would transform history into a moral tribunal.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's a genuine philosophical rift in the discipline. Validate the user's premise (the fact/value asymmetry).
      *   **Question 1: What Theory of Morality?**
          *   It's not necessarily relativism. It's often *contextualism* regarding *agency*.
          *   Distinction: Ontological status of moral truths (universal) vs. Epistemic access to them (historically constrained).
          *   The "Ought Implies Can" principle. If their social imaginary didn't allow for abolition, are they blameworthy?
          *   *Label:* It presupposes a theory of *moral epistemology* that is historicist, even if moral *ontology* is universalist.
      *   **Question 2: Coherence vs. Selective Relativism.**
          *   Is it coherent? Only if you distinguish between *truth* and *responsibility*.
          *   Geocentrism: Error of reason/observation.
          *   Slavery: Error of will/moral perception.
          *   The "Selective Relativism" charge is strong. Historians often retreat to "complexity" when cornered on moral issues.
          *   Public history vs. Academic history: Different audiences, different goals (education/commemoration vs. understanding).
      *   **Question 3: Epistemic Defense (without relativism).**
          *   Can we say "We aren't epistemically privileged"?
          *   Argument: Moral progress isn't linear or guaranteed. We might be blind to our own sins.
          *   Humility: Judging them harshly might blind us to structural similarities in our own time.
          *   *Critique:* This works for *hubris*, but not for *truth*. Slavery *was* wrong then, even if they didn't know it.
          *   Better Epistemic Defense: The goal of history is *explanation*, not *evaluation*. Judgment stops inquiry. (Butterfield's argument).
      *   **Question 4: If Moral Knowledge were Cumulative (Like Science).**
          *   History becomes "Whig history" (the march of freedom).
          *   Past figures become case studies in error (like phlogiston theorists).
          *   Pedagogy shifts from "empathy/context" to "accountability/lineage."
          *   Risk: Flattening the past. Losing the ability to understand *why* they did it.
          *   Benefit: Moral clarity. Aligns with public history demands.
      *   **Conclusion:** Synthesize. The tension is unavoidable. It reflects the dual nature of history as both a science (truth-seeking) and a humanity (meaning-making).

  4.  **Refining the Tone:**

      *   Needs to be intellectual, nuanced, suitable for a magazine writer (who will likely edit/distill this).
      *   Avoid jargon where possible, but use precise philosophical terms (ontology, epistemology, historicism).
      *   Be balanced. Don't just bash historians; explain *why* the norm exists.

  5.  **Self-Correction/Nuance Check during Drafting:**

      *   *Correction:* I need to make sure I don't conflate "presentism" (judging) with "anachronism" (factual error). The user knows this, but I should be precise.
      *   *Nuance:* The geocentrism analogy is key. Why is factual error okay but moral error taboo? Because factual error doesn't implicate *character* in the same way. I need to highlight the *blame* aspect.
      *   *Nuance:* The "epistemic defense" needs to be careful. If I say "we don't know better," that *is* relativism. I need to frame it as "judgment impedes understanding."
      *   *Reference:* Mention Quentin Skinner or Herbert Butterfield. Maybe Elizabeth Anderson on democratic history.

  6.  **Final Polish:** Check against the four specific questions in the prompt to ensure all are answered clearly. (1. Theory of morality? 2. Coherent? 3. Epistemic defense? 4. Cumulative morality implications?)

      *(Self-Correction on Q3)*: The prompt asks if we can defend it *without* relativism. The argument would be: Moral truths are timeless, but *attribution of blame* requires knowledge available to the agent. This is a Kantian "Ought implies Can" move, not relativism.

