answer: |-
  Two employees, a career-focused "Star" and a transient "Drifter," compete for a management track. The signal is volunteering to lead a weekend workshop. The effort (cost) is identical: ten hours of prep and lost weekend time, valued at \$10,000 in utility for both. However, the Star intends to stay for a decade, making the promotion worth \$100,000 in future earnings, while the Drifter plans to quit in six months, making the same promotion worth only \$5,000. Because the signal's cost exceeds the Drifter's total gain from the promotion but is well below the Star's, only the Star volunteers. The observer (HR) sees the volunteer and correctly infers "Star," granting the promotion, while the Drifter stays silent and remains in the general pool.

  ### Payoff Matrix and Equilibrium Analysis

  Let $C$ be the cost of the signal (workshop effort), $B_H$ be the benefit for the High type (Star), and $B_L$ be the benefit for the Low type (Drifter). The employer promotes only if the signal is sent.

  | Type | Action | Payoff Calculation | Net Payoff |
  | :--- | :--- | :--- | :--- |
  | **High (Star)** | Signal | $B_H - C$ ($100k - 10k$) | **$90,000** |
  | **High (Star)** | No Signal | $0$ (No promotion) | **$0** |
  | **Low (Drifter)** | Signal | $B_L - C$ ($5k - 10k$) | **-$5,000** |
  | **Low (Drifter)** | No Signal | $0$ (No promotion) | **$0** |

  **Best Responses:**
  *   **High Type:** Signaling yields 90,000; Not signaling yields 0. Best response is to **Signal**.
  *   **Low Type:** Signaling yields -5,000; Not signaling yields 0. Best response is **Not Signal**.

  **Separating Equilibrium:**
  Since the High type strictly prefers to signal and the Low type strictly prefers not to, the signal perfectly separates the types. The employer's belief that "Signaler = High" is confirmed by the incentives, sustaining the equilibrium.

  ### Structural Feature and Theoretical Pushback

  The structural feature doing the real work here is **differential benefits**, not differential costs. In the classic Handicap Principle, honesty is maintained because the signal is physically more expensive for the low-quality individual to produce (e.g., a weak gazelle tires faster stotting). In this scenario, the "production cost" (10 hours of work) is identical. Honesty is maintained because the Low type simply doesn't want the prize enough to pay the entry fee, whereas the High type does.

  A hardline handicap theorist would likely argue this is **still a handicap in disguise**. They would contend that "cost" should be defined as *net cost* or *opportunity cost relative to value*. If the Drifter values the reward at \$5k and the Star at \$100k, the \$10k effort represents 200% of the Drifter's potential gain but only 10% of the Star's. Therefore, the *relative* cost is still differential. They would assert that a signal cannot be honest unless the burden is proportionally heavier for the low-quality type, even if the absolute resource expenditure is identical.

  ### Removing the Structural Feature

  If you remove the differential benefit feature (setting $B_H = B_L = \$50,000$) while keeping costs equal ($C = \$10,000$), the case collapses into a **pooling equilibrium**. Since $B > C$ for both types, both the Star and the Drifter would choose to signal (Net Payoff \$40,000 vs \$0). The employer would then observe everyone signaling, rendering the signal useless for distinguishing types. Conversely, if $B < C$ for both, neither would signal. Without the divergence in how much the types value the outcome, equal-cost signals cannot sustain separation.
