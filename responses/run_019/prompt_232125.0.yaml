  5.  **Addressing the Theoretical Questions:**
      *   *Structural Feature:* Differential Benefits (Value of the Reward), not Differential Costs.
      *   *Hardline Handicap Theorist Response:* They would argue this *is* a handicap. Why? Because "Cost" is opportunity cost. If the benefit is lower for L, the *net* cost is higher. Or they might argue that the "cost" includes the risk of failure, which is higher for L. I need to articulate the "Opportunity Cost" counter-argument specifically.
