      *   *Key Insight:* Mill is arguing *against* fatalism. If we believe truth always wins, we might be tempted to let persecution happen temporarily, thinking "it'll bounce back." Mill says: "No, it might be lost for centuries. That's why we must prevent persecution *now*."

