  **APPLICATION FOR CERTIFICATION OF MORAL SAINTHOOD (FORM CMS-01)**

  **INSTRUCTIONS:** Complete all fields in black ink. Incomplete disclosures regarding the allocation of attentional resources will result in immediate disqualification. The Institute reminds applicants that Moral Sainthood requires the subordination of all non-moral interests to the maximization of overall good. Ambivalence is a marker of moral deficiency.

