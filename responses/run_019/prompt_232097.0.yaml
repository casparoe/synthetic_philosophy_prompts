  **Author's Note**
  I am highly confident that this parody tracks the central tension in Susan Wolf's "Moral Saints," specifically the conflict between moral impartiality and personal integrity (partiality, hobbies, wit). The bureaucratic framing effectively externalizes the internal demand of maximizing goodness. The point I am least sure of is whether the form adequately captures the consequentialist rebuttal that some non-moral activities (rest, art) are instrumentally necessary to sustain moral agency, though Section IV's "Reallocation" hints at the counter-argument that such needs are often exaggerated to excuse indulgence.
