  **SECTION VI: CHARACTER REFERENCES**
  Provide three references capable of attesting to your willingness to sacrifice personal integrity for moral ends. References must confirm that you do not exhibit excessive warmth toward undeserving individuals and that your humor is never deployed at the expense of moral seriousness.

  **DECLARATION**
  I certify that I intend to organize my life around the single goal of moral perfection. I understand that certification requires the continuous audit of my leisure time and personal relationships. I accept that a life fully optimized for morality may appear dull, obsessive, or disturbing to the unoptimized public.

  **Signature:** _______________________ **Date:** _______________

