  **SECTION V: MOTIVATIONAL AUDIT**
  The Institute distinguishes between the *Rational Saint* (who acts from duty despite contrary inclination) and the *Loving Saint* (whose inclinations align perfectly with moral duty). Indicate your classification.

  □ **Rational Saint:** I acknowledge that my personal desires often conflict with moral requirements, but I commit to suppressing them.
  □ **Loving Saint:** I claim to find no value in non-moral pursuits; my only desire is the good.

  *If checking "Loving Saint," please explain why you do not consider this a form of psychological mutilation.*
