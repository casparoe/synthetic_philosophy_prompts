  **SECTION II: INVENTORY OF PARTICULARISTIC ATTACHMENTS**
  List all persons for whom you hold significant emotional attachment (e.g., spouse, children, parents, friends). For each entry, provide a written justification (max 150 words) explaining why resources (time, capital, emotional energy) directed toward this individual yield a higher moral return than diversion to impartial charitable aid.

  *   **Name of Attached Person:** _______________________
      **Relationship:** _______________________
      **Justification for Partiality:**
