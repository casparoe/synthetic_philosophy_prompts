      *   **Tone:** Bureaucratic, slightly menacing, deadpan (no winking/no explicit jokes), legible to undergrads.
      *   **Content:** Biographical fields, inventory of hobbies/friendships/family with justification, log of non-moral activity, character references, plan for reallocating time/money/attention away from art/humor/idleness/particularistic love toward moral requirements.
      *   **Philosophical Target:** The position that maximal moral goodness is the correct organizing ideal of a whole life. Highlight the tension between moral perfection and personal integrity/happiness (wit, taste, play, partial attachments). Contrast spontaneous love vs. grim duty. Highlight the monstrousness of auditing moral return on leisure.
      *   **Length:** Roughly 700 words.
      *   **Ending:** A separate author's note (max 1 paragraph) assessing confidence in tracking the actual debate vs. strawman, and identifying the least sure point.

  2.  **Deconstruct the Philosophical Debate (Susan Wolf's "Moral Saints"):**
      *   Wolf argues that a life dominated by moral concerns leaves little room for non-moral virtues (wit, humor, aesthetic taste) or personal projects.
      *   Two models: The Loving Saint (does good because they want to) vs. The Rational Saint (does good because duty demands it, suppressing personal desires).
      *   The parody needs to capture the *institutionalization* of this demand, making explicit the implicit costs of maximizing moral utility.
      *   Key tension: Partiality (love for specific people) vs. Impartiality (moral requirement to help the most needy).

  3.  **Drafting - Section by Section:**
      *   **Header:** Official looking, sterile.
      *   **Introduction:** Statement of purpose, emphasizing optimization and audit.
      *   **Section I: Biographical Data:** Standard stuff, but framed morally.
      *   **Section II: Attachment Inventory:** This is where the partiality critique comes in. Justifying why you love your mom instead of a stranger who could benefit more.
      *   **Section III: Leisure Audit:** Logging non-moral activity. The "moral return on investment."
      *   **Section IV: Reallocation Plan:** Giving up hobbies for moral work.
      *   **Section V: References:** Need confirmation of moral prioritization.
      *   **Footer:** Warning about consequences.

  4.  **Drafting - Tone Check:**
      *   Avoid exclamation points.
      *   Use passive voice where appropriate for bureaucracy.
      *   Treat the sacrifice of personal life as a mundane administrative task.
      *   Ensure the "jokes" are inherent in the requirements (e.g., asking for a justification of why you spend time with your spouse instead of volunteering).

  5.  **Drafting - Content Iteration (Mental or Scratchpad):**
      *   *Word Count Check:* Need to be careful not to go too short or too long. 700 words is about 1.5 single-spaced pages.
      *   *Philosophical Accuracy:* Ensure it targets the *ideal* of maximal goodness, not just extreme altruism. The key is the *organization of life* around morality.
      *   *Wolf's Distinction:* Try to hint at the Loving vs. Rational saint distinction. Maybe in the section about motivation.
      *   *Menacing:* The threat of rejection or audit.

  6.  **Writing the Document:**
      *   Title: INSTITUTE FOR MORAL OPTIMIZATION — CERTIFICATION OF MORAL SAINTHOOD (CMS).
      *   Intro: Welcome to the pathway of maximal utility.
      *   Form fields: Name, ID.
      *   Section A: Non-Moral Interests. List them. Justify their compatibility with moral maximization.
      *   Section B: Particularistic Attachments. Family/Friends. Explain why resources aren't diverted to effective altruism.
      *   Section C: Leisure Log. Hours spent on art/humor. Calculate opportunity cost.
      *   Section D: Reallocation Strategy. How will you convert hobby time to moral labor?
      *   Section E: Motivation. Do you enjoy the sacrifice? (Touching on Wolf's Loving Saint).
      *   Closing: Submission instructions.

  7.  **Refining and Polishing:**
      *   Check word count.
      *   Ensure deadpan voice. (e.g., "Frivolous expenditure of attention," "moral opportunity cost").
      *   Make sure the "menacing" aspect is subtle (e.g., "failure to comply may result in decertification").
      *   Check the Author's Note requirements.

  8.  **Author's Note:**
      *   Confidence level: High on Wolf's argument, maybe less on whether this captures *all* consequentialist views (some might argue hobbies restore capacity).
      *   Least sure point: Whether the "institutional" framing obscures the internal perspective of the saint.

  9.  **Final Review against Constraints:**
      *   ~700 words for the handout.
      *   Separate author's note (max 1 paragraph).
      *   Deadpan tone.
      *   Specific philosophical targets (partiality, leisure, duty vs. inclination).

