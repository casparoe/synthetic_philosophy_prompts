prompt: |-
  I run an undergraduate reading group on the history of social thought, with about fourteen regulars, and we are about to spend several sessions on David Lewis's account of convention and the way arbitrary regularities harden into norms. Before I assign any reading, I want to run a session that lets students feel the phenomenon from the inside, so that when they later encounter Lewis's characterization of a convention — a regularity in a recurring situation in which everyone prefers to conform given that everyone else conforms, even though some alternative regularity would have served just as well — they recognize what they did rather than merely learning a definition. The room has movable chairs and a whiteboard, we have ninety minutes, and I am willing to use small real stakes, such as chocolate coins or a modest prize.

  Design a runnable activity with actual rules and payoffs, no front-loaded explanations, and no mention of Lewis or the word "convention" until the debrief. It should take students through three distinct situations. First, a repeated coordination problem with two equally good ways of succeeding, where only salience or precedent can break the symmetry, so they experience the arbitrariness of whatever solution emerges. Second, a situation in which a new and objectively somewhat better solution becomes available after the group has already settled into the old one, so they feel the real cost of abandoning precedent and can gauge how much improvement it takes to dislodge an established regularity. Third, a situation in which newcomers join who lack the shared history, so the insiders are tempted to teach, correct, and mildly punish the newcomers, and the group can watch a bare regularity begin to present itself as something one ought to do.

  Please supply exact instructions for each round, the payoff structure, what the facilitator should record on the board, and a debrief that maps specific moments in the game onto Lewis's conditions for a convention and onto the difference between a convention and a sanction-backed norm. Also say what predictably goes wrong when this is run with real students and how to handle it, and be explicit about what a one-off, self-aware classroom game cannot reproduce about the historical, unplanned emergence of conventions and what the facilitator will need to supply afterward.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Goal:** Create an experiential activity for an undergraduate reading group (14 students) to intuitively grasp David Lewis's account of convention before reading him.
      *   **Core Concepts to embody:**
          1.  Arbitrariness (multiple equilibria, symmetry breaking).
          2.  Path Dependence/Inertia (stickiness of established conventions even when better options exist).
          3.  Normativity/Sanctions (insiders enforcing rules on newcomers).
      *   **Constraints:** 90 minutes, movable chairs/whiteboard, small stakes (chocolate/prize), *no* mention of Lewis/convention until debrief, no front-loaded theory.
      *   **Deliverables:** Exact instructions per round, payoff structure, facilitator recording, debrief script, troubleshooting (what goes wrong), and limitations of the simulation.

  2.  **Deconstruct the Three Situations:**
      *   *Situation 1 (Arbitrariness):* Needs a coordination game with at least two symmetric solutions. Classic example: Meeting place (East/West), Hand raise (Left/Right), or Number selection (1/2). Let's go with a spatial/positional coordination game as it uses the room. *Idea:* "The Silent Meeting." Students must pair up or group up without talking. *Better:* A binary choice game played repeatedly. Let's use "Left/Right" or "A/B" cards. To make it visceral, let's use physical positioning. *Decision:* Two corners of the room. Everyone must go to the same corner to win.
      *   *Situation 2 (Inertia/Path Dependence):* Once they settle on Corner A, introduce Corner C which pays slightly more but requires *everyone* to switch. If even one stays, everyone loses (or switches lose). This tests the threshold for change.
      *   *Situation 3 (Normativity/Newcomers):* Bring in "outsiders" (or simulate them). Since I only have 14 students, I can't easily bring in actual outsiders without logistics. *Alternative:* Designate a subset of the original 14 as "Veterans" and a subset as "Rookies" for this round, giving Rookies different instructions (or no instructions). *Better:* The facilitator acts as the "Newcomer" or a few students are pulled out and re-introduced with different incentives. *Best for flow:* Keep the 14. In Round 3, tell 3 students (secretly) they have a different payoff structure or don't know the rule, while the others are told to "ensure the group succeeds." This creates the pressure to enforce.

      *Refining the Mechanics:*
      To make it tight and fit 90 mins, the game needs to be fast-paced.
      *Game:* "The Color/Shape Match."
      *Round 1:* Pick a color (Red/Blue). If everyone picks the same, everyone gets points. If mixed, no one gets points. Repeat 5 times.
      *Round 2:* Introduce "Green." Green pays double, but *only* if 100% pick Green. If 1 person picks Red/Blue, Green pickers get 0.
      *Round 3:* Replace 3 students with "New" students (or tell 3 existing students they are "New" and give them ambiguous instructions). The "Old" students are told they lose points if the group fails.

      *Critique of "Color Match":* It's a bit abstract. Let's make it physical.
      *Game:* "The Handshake."
      *Round 1:* Pair up. Greet your partner. If you do the *same* gesture (Wave vs. Fist Bump), you get points.
      *Problem:* 14 students = 7 pairs. They might coordinate locally but not globally. Lewis is about *population* regularity.
      *Revised Game:* "The Signal."
      Everyone stands. Facilitator says "Go." Everyone must simultaneously make one of two gestures (e.g., Raise Left Hand vs. Raise Right Hand).
      *Win Condition:* If 100% (or a high threshold, say 90%) do the *same* gesture, everyone wins. If split, no one wins.

      *Let's polish the Three Rounds based on the Prompt's specific requirements:*
      1.  *Symmetry:* Two options, equal payoff.
      2.  *Inertia:* Established option vs. Better option (with switching cost/risk).
      3.  *Normativity:* Insiders vs. Outsiders.

      *Revised Plan:*
      *   **Round 1 (Emergence):** 5 rounds. Choice: Stand on Left Side vs. Right Side of room. Payoff: If >90% on same side, everyone gets 1 coin. If split, 0. No talking.
      *   **Round 2 (Stability):** 5 rounds. Same setup. But now, if >90% stand on the *Other* side (the one they didn't pick in R1), they get 2 coins. If they stick to R1 side, 1 coin. If split, 0.
      *   **Round 3 (Enforcement):** 5 rounds. 3 students are pulled out and given *different* written instructions (e.g., "Maximize your own points, choose randomly" or just no instructions). The remaining 11 are told "You lose a coin if the group fails." (This creates the sanction incentive).

      *Wait, Round 3 needs to feel like "ought".*
      If the insiders just lose points, that's standard game theory. To get "normativity," the insiders need to feel entitled to correct the outsiders.
      *Adjustment:* In Round 3, allow talking *only* for the "Veterans" (11 students). The "Newcomers" (3 students) must remain silent or have restricted info. The Veterans are told they are responsible for the group outcome. This allows them to scold/teach.

  3.  **Drafting the Instructions (Iterative Process):**
      *   *Tone:* Clinical, procedural. Do not explain *why*.
      *   *Logistics:* Need index cards for secret instructions in Round 3. Need a scoreboard.
      *   *Timing:* 90 mins total.
          *   Intro/Setup: 5 mins.
          *   Round 1: 15 mins (5 trials + reset).
          *   Round 2: 20 mins (5 trials + friction).
          *   Round 3: 25 mins (setup newcomers + 5 trials + conflict).
          *   Debrief: 25 mins.
      *   *Payoffs:* Chocolate coins work well. Tangible.

  4.  **Addressing "What Goes Wrong":**
      *   *Laughing/Chaos:* Students might treat it as a joke. *Fix:* Facilitator must be stern about "No talking" in R1/R2.
      *   *Focal Points:* One side might be obviously better (near the door). *Fix:* Ensure room is symmetric or obscure the sides.
      *   *Round 2 Failure:* They might switch immediately if the payoff is double. *Fix:* Make the switch risky. If *anyone* fails to switch, the switchers get nothing. This creates the assurance problem.
      *   *Round 3 Ethics:* Students might feel bad bullying the "newcomers." *Fix:* Debrief must handle this carefully.

  5.  **Addressing Lewis's Conditions in Debrief:**
      *   Regularity.
      *   Common Knowledge (everyone knows everyone knows).
      *   Preference to conform conditional on others conforming.
      *   Arbitrariness (another solution existed).
      *   Normativity (expectations + sanctions).

  6.  **Addressing Limitations:**
      *   Lab vs. History: This is designed, history is organic.
      *   Common Knowledge: In the game, I (facilitator) create common knowledge. In history, it emerges.
      *   Stakes: Chocolate isn't real life.

  7.  **Finalizing the Design (Self-Correction during drafting):**
      *   *Round 2 Nuance:* If I just say "Other side pays more," rational actors might switch. To show *inertia*, the cost of miscoordination must be high. I will add a rule: "To get the bonus, *everyone* must be on the new side. If even one person is on the old side, the new side gets 0." This makes switching dangerous.
      *   *Round 3 Nuance:* To make the "ought" feel real, the Veterans need a mechanism to punish. I'll give Veterans 2 "Strike Tokens" they can place on a Newcomer's desk if they break the pattern. 3 Strikes = Newcomer is out of the prize pool. This institutionalizes the sanction.

  8.  **Writing the Output:** Structure clearly with headings. Ensure the "Facilitator Script" is distinct from the "Theory Notes."

      *(Self-Correction on Round 3)*: If I give strike tokens, it becomes too mechanical. Lewis talks about *social* sanctions (disapproval). Let's allow Veterans to talk, but Newcomers cannot. Veterans are told "Ensure coordination." Newcomers are told "Do what you think is best." The friction comes from the Veterans trying to explain the "rule" that doesn't technically exist in the rules, only in the history.
      *Actually, let's go stronger:* Veterans are told "The group must coordinate on the R1 side." Newcomers are told nothing about coordination, just "Get points." Veterans are given the authority to veto a Newcomer's points if they deviate. This creates the *normative* power.

      *Wait, simpler is better.*
      Round 3: 3 Students are replaced (or act as) "New Cohort." They don't know the history. The "Old Cohort" is told: "You have established a system. If the New Cohort disrupts it, you all lose your accumulated prizes." This gives the Old Cohort motivation to enforce. The New Cohort is given ambiguous instructions.

      *Let's refine the "Newcomer" mechanic.* It's hard to swap students mid-session.
      *Solution:* Keep the 14. In Round 3, hand out envelopes. 11 say "Veteran: Stick to the R1 pattern. If the group fails, you lose your stash." 3 say "New Student: You weren't here before. Choose what seems rational to you."
      This creates the asymmetry of information and incentive.

  9.  **Final Review against constraints:**
      *   14 students? Yes.
      *   90 mins? Yes.
      *   No Lewis mention? Yes.
      *   3 Situations? Yes.
      *   Payoffs? Yes.
      *   Debrief mapping? Yes.
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

      *One detail:* "Movable chairs." I should use this.
      *Round 1:* Arrange chairs in a circle.
      *Round 2:* Keep circle.
      *Round 3:* Maybe move chairs to simulate disruption? No, keep it simple. Standing/Positioning is faster. Let's use "Left Hand / Right Hand" raised. It's faster than moving chairs.
      *Wait, prompt says "room has movable chairs".* I should utilize that to make it physical.
      *Idea:* Two distinct zones marked by tape or just "Left Half/Right Half".
      *Let's stick to the "Side of the Room" idea.* It's more visceral than hand raising.

      *Revised Round 2 Payoff:* To ensure inertia, the "Better" option must require *unanimous* switching. If 13 switch and 1 stays, the 13 get 0. The 1 gets the old payoff. This makes being the "switcher" risky.

      *Revised Round 3:* The "Veterans" need to feel the "Ought." I will explicitly allow Veterans to speak to Newcomers in Round 3, whereas Rounds 1 & 2 were silent. This shift from silence to speech allows for *norm enforcement*.

      *Let's write it.*
answer: |-
  # Activity Design: "The Silent Coordination"

  **Time:** 90 Minutes
  **Participants:** 14 Undergraduates
  **Materials:** 
  *   14 Index cards (for secret instructions in Round 3).
  *   28-40 Chocolate coins (or equivalent small token).
  *   Whiteboard and markers.
  *   Masking tape (to mark a line down the center of the room).
  *   A bell or distinct sound maker.

  **Facilitator Stance:** You are a neutral administrator. Do not explain the *point* of the game. Do not use words like "norm," "convention," "coordination," or "Lewis." Use terms like "Round," "Trial," "Payoff," and "Compliance." Be stern about silence in Rounds 1 and 2.

  ---

  ## Part 1: The Activity (65 Minutes)

  ### Setup (5 Minutes)
  1.  Clear the center of the room. Use masking tape to draw a line down the middle, creating a **Left Zone** and a **Right Zone**.
  2.  Have students stand in the middle, straddling the line.
  3.  **Script:** "We are going to run three rounds of a decision game. In each round, there will be several trials. At my signal, you must move to either the Left Zone or the Right Zone. You will remain there for 10 seconds. I will record the outcome. Then you will return to the center. Your goal is to accumulate chocolate coins. I will not answer questions about strategy once we begin."

  ### Round 1: Emergence (15 Minutes)
  **Goal:** Experience symmetry breaking and arbitrary equilibrium.

  *   **Instructions:** "In this round, there will be 5 trials. 
      *   **Rule:** If 90% or more of you (13 students) stand in the *same* zone (all Left or all Right), everyone receives 1 coin. 
      *   **Failure:** If the group is split (e.g., 7 Left, 7 Right), no one receives a coin. 
      *   **Constraint:** No talking, no gesturing, no eye contact. Move only when I ring the bell."
  *   **Facilitator Action:** 
      *   Run 5 trials. 
      *   On the whiteboard, create a table: `Trial | Left Count | Right Count | Payoff`.
      *   Record the results visibly. 
      *   *Note:* Usually, by Trial 2 or 3, they will settle on one side (often the one closer to the door or whiteboard). Let them lock into this pattern.
  *   **Payoff:** Distribute coins immediately after successful trials.

  ### Round 2: Inertia & Path Dependence (20 Minutes)
  **Goal:** Experience the cost of switching equilibria even when a better option exists.

  *   **Instructions:** "We are beginning Round 2. There will be 5 trials. The rules have changed slightly.
      *   **Rule A (Status Quo):** If 90% stand in the zone you used most in Round 1, everyone receives 1 coin.
      *   **Rule B (Innovation):** If 100% of you (all 14) stand in the *other* zone, everyone receives 2 coins.
      *   **Risk:** If you attempt Rule B but even one person stays in the old zone, the 'Innovators' get 0 coins. The person who stayed in the old zone gets 1 coin (Rule A).
      *   **Constraint:** Still no talking."
  *   **Facilitator Action:** 
      *   Run 5 trials. 
      *   Observe if they switch. Usually, they will not, because the risk of being the *only* switcher (getting 0) outweighs the gain of 2 coins, especially without communication to assure unanimous switching.
      *   Record results on the board under a new header.
  *   **Payoff:** Distribute coins. If they fail to switch, point out on the board: "Potential earnings: 10 coins. Actual earnings: 5 coins."

  ### Round 3: Normativity & Sanctions (25 Minutes)
  **Goal:** Experience the transition from regularity to "ought" via insider/outsider dynamics.

  *   **Setup:** Have students sit in a circle. Hand out index cards face down.
      *   **11 Cards (Veterans):** "You are a Veteran. You know the established pattern from Round 1. Your goal is to maintain group coordination on the Round 1 side. **You are allowed to talk.** If the group fails to coordinate on the Round 1 side, you lose 1 coin from your existing stash."
      *   **3 Cards (Newcomers):** "You are a Newcomer. You were not present for previous rounds. You do not know the history. Choose the zone that seems most rational to you. **You must remain silent.**"
  *   **Instructions:** "Round 3. 5 Trials. 
      *   Veterans may speak to Newcomers before the bell. 
      *   Newcomers must remain silent. 
      *   Payoff: If 90% coordinate on the Round 1 side, Veterans keep their stash. Newcomers get 1 coin. 
      *   If coordination fails, Veterans lose 1 coin each. Newcomers get 0."
  *   **Facilitator Action:** 
      *   Allow 2 minutes for Veterans to read cards and realize they can talk.
      *   Run 5 trials. 
      *   Watch for Veterans explaining the "rule" to Newcomers, expressing frustration, or using social pressure ("Just go Left, please").
      *   Record results and note any verbal sanctions on the board (e.g., "Trial 1: Failed. Veteran shouted at Newcomer").
  *   **Payoff:** Collect losses from Veterans if applicable. Reward successes.

  ### Transition to Debrief (5 Minutes)
  *   Collect all cards and coins.
  *   Ask students to return chairs to a seminar arrangement.
  *   **Script:** "The game is over. You may now speak freely about what happened. We will discuss the activity in relation to the reading for next week."

  ---

  ## Part 2: The Debrief (25 Minutes)

  *Do not lecture. Draw the theory out of their experience.*

  **1. Mapping the Arbitrariness (Round 1)**
  *   **Ask:** "In Round 1, was there a physical reason to prefer Left over Right?" (Usually no).
  *   **Ask:** "Once you picked Left, did anyone *want* to go Right in Trial 5?" (No).
  *   **Connect:** "David Lewis calls this a **Convention**. It is a regularity (everyone goes Left). It is arbitrary (Right would have worked). But you prefer to conform *given that* others conform. You didn't go Left because Left is magic; you went Left because *they* went Left."
  *   **Board Work:** Write: *Regularity + Arbitrary + Conditional Preference = Convention.*

  **2. Mapping the Inertia (Round 2)**
  *   **Ask:** "Round 2 offered double points. Why didn't you switch?"
  *   **Listen for:** "I was afraid I'd be the only one." "I didn't know if you knew to switch."
  *   **Connect:** "This is **Common Knowledge**. A convention holds not just because we do it, but because we *know* we know we do it. In Round 2, the old convention had 'common knowledge' status. The new option did not. The cost of miscoordination was higher than the benefit of improvement. This explains why inefficient social norms persist."

  **3. Mapping the Normativity (Round 3)**
  *   **Ask:** "Veterans, how did you feel when the Newcomers hesitated?" (Frustrated, entitled).
  *   **Ask:** "Newcomers, did you feel like you were breaking a 'rule' even though the written rules didn't say you had to go Left?"
  *   **Connect:** "In Round 1, going Right was just a *mistake* (you lose coins). In Round 3, going Right was a *violation* (Veterans lost coins because of you). This is the birth of a **Norm**. A convention becomes a norm when the group expects conformity and applies sanctions (social pressure, loss of trust) to those who deviate. You moved from 'I go Left because it works' to 'You *ought* to go Left because we do.'"

  **4. Limitations of the Simulation**
  *   **Ask:** "How is this different from real history?"
  *   **Points to Supply:** 
      1.  **Design vs. Emergence:** I designed the payoffs. Real conventions emerge from messy, unplanned interactions over years.
      2.  **Common Knowledge:** I told you the rules. In history, we often don't know *why* a norm exists, only that it does.
      3.  **Stakes:** Chocolate coins are low stakes. Real norms involve reputation, employment, or safety.
      4.  **Time:** We did this in 90 minutes. Real conventions harden over generations.

  ---

  ## Part 3: Troubleshooting & Predictable Failures

  **1. The "Focal Point" Problem**
  *   *Risk:* One side of the room is obviously better (e.g., closer to the heater, better lighting). This undermines the "arbitrariness" lesson.
  *   *Fix:* Before class, check the room. If one side is clearly superior, block it off with chairs or declare both zones "unsafe" unless occupied. Ensure the Whiteboard is equidistant.

  **2. The "Giggle" Factor**
  *   *Risk:* Students treat Round 1 as a joke, intentionally splitting the group to see what happens.
  *   *Fix:* Be stern. "This is a graded participation exercise." (Even if it isn't). Withhold coins if they intentionally sabotage. "If the group fails due to intentional non-compliance, no one gets paid."

  **3. Round 2 Immediate Switch**
  *   *Risk:* They switch to the 2-coin option immediately, ruining the inertia lesson.
  *   *Fix:* This happens if they communicate via eye contact too effectively. If they switch, ask in debrief: "Was it easy to trust everyone would switch?" If they say yes, challenge them: "In the real world, can you make eye contact with 10,000 other drivers to switch sides of the road?" Emphasize the *scale* problem Lewis addresses.

  **4. Round 3 Ethical Discomfort**
  *   *Risk:* Veterans feel guilty "bullying" Newcomers.
  *   *Fix:* Acknowledge this in debrief. "That discomfort you felt? That is the weight of normativity. It feels different to break a rule than to make a mistake. That feeling is the social glue Lewis is trying to describe."

  **5. The "One-off" Limitation**
  *   *Risk:* Students think conventions are always conscious agreements.
  *   *Fix:* In the debrief, emphasize that in Round 1, no one *agreed*. It just happened. Lewis's point is that conventions do not require promises or contracts; they require only reciprocal expectations.

  ---

  ## Part 4: Facilitator's Cheat Sheet (Lewis Mapping)

  *Keep this hidden for your reference during debrief.*

  | Game Moment | Lewis Concept | Key Distinction |
  | :--- | :--- | :--- |
  | **Round 1 Trial 3** | **Equilibrium Selection** | Two solutions existed (Left/Right). Only one was needed. |
  | **Round 1 Trial 5** | **Regularity** | Everyone does R. Everyone expects everyone to do R. |
  | **Round 2 Failure** | **Assurance Problem** | Prefer the new state, but prefer the old state to *chaos*. |
  | **Round 3 Veterans** | **Normative Expectation** | "I have a right to expect you to conform." |
  | **Round 3 Sanctions** | **Enforcement** | Deviation triggers a penalty (social or material). |
  | **Overall** | **Arbitrariness** | If they had picked Right in R1, Right would be the "right" way. |

  **Final Note to Facilitator:**
  The success of this session depends on your refusal to explain *why* they are doing this until the very end. If a student asks, "Is this about game theory?" reply: "It is about earning chocolate coins." The phenomenological impact relies on them feeling the pressure of the group before they have the vocabulary to dismiss it as "just a game."
