answer: |-
  In Blackwood, residents began leaving out corn and suet blocks to watch bears from their back decks. Individually, a single feeder harms no one; the bears eat and leave. But as half the town adopted the practice, the bear population surged and lost its fear of humans. Vehicle collisions tripled. Last month, a child was mauled in a playground bordering the woods.

  The council proposes banning private feeding. Enforcement is simple: officers cite visible feeders from the street.

  The room splits. One faction argues feeding is an act of stewardship, a moral duty to nurture nature. They aren't hypocrites; they genuinely believe denying food is cruel. The other faction sees it as reckless endangerment. There is no consensus on whether the act is virtuous or vicious, only agreement that the accidents are rising. The Mayor wants the ban to stop the bloodshed. The Opposition argues the law cannot criminalize an act half the town considers kindness without tearing the community's moral fabric further.

  ***

  **The Conduct:** Placing bear attractants (corn, suet, bird feeders) on private residential property.
  **The Proposed Law:** A municipal ordinance prohibiting the placement of wildlife attractants, punishable by fines.
  **Enforcement:** Police or animal control confirm the presence of feeders via visual inspection from the public street or sidewalk.

  **Hartian Reasoning (Supporting Criminalization):**
  Hart's harm principle permits liberty unless action harms others. While one feeder causes no harm, the *aggregate* conduct creates a measurable public hazard (maulings, collisions). Hart accepts that individual acts can be regulated when their cumulative effect violates the rights of others to safety. The law is not punishing morality but mitigating a proven risk profile. Punishment is proportionate to the cost of enforcement and the severity of the physical harm prevented.

  **Devlinian Reasoning (Opposing Criminalization):**
  Devlin argues law exists to preserve the shared moral fabric of society. Criminal law is only legitimate when it enforces a judgment shared by the "right-minded" majority. Here, the town is genuinely divided; half view feeding as virtuous stewardship. There is no shared "intolerance, indignation, and disgust." To criminalize the act is not to enforce public morality, but to impose one faction's values on another. This usage of force exacerbates social fragmentation rather than preserving cohesion. The objection is not about safety (harm), but about the *legitimacy* of using state power without moral consensus.

  **Philosophical Workhorse:**
  The tension between **aggregate physical harm** (which validates Hart) and **fractured moral consensus** (which invalidates Devlin). Usually, these align (harmful acts are also condemned). Here, they diverge.

  **If You Add Moral Consensus:**
  If everyone agreed feeding was wrong, Devlin would support the ban (enforcing shared morality). Hart would still support it (harm exists). The conflict disappears.

  **If You Remove Cumulative Harm:**
  If accidents didn't increase, Hart would oppose the ban (no harm principle violation). Devlin would still oppose it (no consensus). Both agree, but for different reasons.

  **Attacks:**
  *   **Hartian Attack:** "You are prioritizing abstract social cohesion over concrete physical safety."
  *   **Devlinian Attack:** "You are using the police to win a moral argument the community hasn't settled."

  **Dialogue:**
  **Mayor (Hartian):** "Your principles don't bandage wounds, Councilor."
  **Opposition (Devlinian):** "And handcuffs won't fix a conscience that isn't there."
