      *   *Evaluation:*
          *   "Is panpsychism true?" -> Avoid (User already said this).
          *   "Physical Theory Portfolio" -> Too broad. Needs narrowing to specific ethical implications.
          *   "Large-scale processes" -> Important, but depends on valence/thresholds first.
          *   "Fanaticism worries" -> Crucial for *decision making*, but maybe secondary to *moral ontology*.
          *   "Micro-valence" -> Very upstream. If no valence, no moral weight.
          *   "Combination Problem" -> Crucial for aggregation.
          *   "Threshold/Gradationalism" -> Crucial for prioritization.

      *   *Selection:*
          1.  **The Valence Constraint:** Does fundamental experience have *hedonic tone*? (Without this, panpsychism is ethically inert).
          2.  **The Aggregation/Combination Problem:** How do we sum moral weight? (Determines if the "swamping" happens).
          3.  **The Decision-Theoretic Firewall:** How to handle normative uncertainty without fanaticism. (Determines if we act on the theory).
          4.  *(Alternative)* **The Threshold of Moral Significance:** Is there a complexity cutoff? (Mitigates the swamping).
          *Decision:* I'll combine Aggregation and Thresholding into one broad "Moral Arithmetic" category or keep them distinct. Let's keep them distinct because one is metaphysical (combination), one is normative (thresholds). Actually, "Threshold" is more action-guiding for prioritization. Let's prioritize: 1. Valence, 2. Aggregation/Combination, 3. Normative Uncertainty/Fanaticism.
          *Wait, let's look at the "Action-Guiding" constraint.* If we solve Valence but not Fanaticism, we might still be paralyzed. If we solve Fanaticism but not Valence, we know how to ignore the problem.
          *Revised Ranking:*
          1.  **Valence at the Fundamental Level.** (Is there anything to count?)
          2.  **Moral Aggregation & The Combination Problem.** (How do we count?)
          3.  **Normative Uncertainty & Fanaticism.** (Do we act on the count?)
          4.  **Physical Instantiation Criteria.** (Where does it happen? - *Maybe drop this for now as it depends on 1 & 2*).
          5.  **Avoid:** "Proving Panpsychism."

      *   *Refining the Top 3:*
          1.  *The Hedonic Gap:* Distinguishing proto-experience from valenced experience.
          2.  *The Swamping Objection:* Aggregation rules for micro-subjects.
          3.  *The Epistemic/Decision Constraint:* Handling extreme moral uncertainty.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Set the stage (6 person-years is tight, need high leverage). State the guiding philosophy (mitigating risk of moral catastrophe vs. avoiding paralysis).
      *   **The Criteria:** Explicitly state the ranking metrics (Upstreamness, Action-Guidingness, Tractability, Neglectedness).
      *   **The Agenda (Top 3):**
          *   *Priority 1: The Hedonic Gap (Valence).* Why: If fundamental particles don't feel *bad* or *good*, the moral explosion vanishes. Tractability: Philosophers of mind + affective neuroscience.
          *   *Priority 2: The Moral Arithmetic of Combination.* Why: If micro-experiences don't aggregate linearly (or at all), the "astronomical waste" argument fails. Tractability: Ethics + Metaphysics.
          *   *Priority 3: Normative Uncertainty & Fanaticism.* Why: Even if 1 & 2 are true, should we act on low credence? Tractability: Decision Theory.
      *   **Evidence Triggers:** What would change the ranking? (e.g., if IIT is debunked, if a new theory of valence emerges).
