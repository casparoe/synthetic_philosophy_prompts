      *   *Critic Move 2:* "But science *progresses* toward reality, not just utility." (The Normativity/Progress Charge)
      *   *Rortian Move 2:* "Progress is making things better, not more accurate. You're begging the question by assuming 'accuracy' requires mirroring." (The Redescription Move)
