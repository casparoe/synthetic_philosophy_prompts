          *   *Critic:* Needs a philosophical anchor to avoid "might makes right."
          *   *Rortian:* Philosophical anchors are illusions; sociology/history is all we have.
          *   *Result:* Also strong. This touches on the "starting point" issue the user mentioned.

  4.  **Synthesize the Diagnosis:**
      *   It's not merely verbal. It's a **clash of normative aspirations**.
      *   The Critic wants *Justification* (Why am I *right*?).
