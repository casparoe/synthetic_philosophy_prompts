      *   Dennett is doing *engineering* (How do we make society work? What concept is useful?). Caruso is doing *architecture* (What is the foundation? Is it true?).
      *   Dennett argues from the *top down* (Practice -> Justification). Caruso argues from the *bottom up* (Metaphysics -> Permission for Practice).
      *   This explains why they talk past each other. Dennett thinks Caruso is demanding impossible standards for a functional tool. Caruso thinks Dennett is whitewashing an immoral foundation.
      *   This incorporates the burden of proof issue: Dennett thinks the burden is on the skeptic to show the tool *doesn't work*. Caruso thinks the burden is on the practitioner to show the tool is *morally permissible*.

  5.  **Structuring the Response:**
