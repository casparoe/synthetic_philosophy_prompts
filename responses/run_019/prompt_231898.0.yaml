      *   *Diagnosis 3: The "Folk Concept" Empirical Gap (The "Psychology" View).* Both appeal to "what people mean." Dennett says people mean compatibilist control. Caruso says people mean basic desert. Experimental philosophy (X-Phi) hasn't settled this definitively (context sensitivity). The stalemate is due to a lack of settled empirical data on human cognition. *Critique:* Even if we settled the psychology, the normative question remains (should we follow folk intuitions?).

  4.  **Selecting and Refining the Best Diagnosis:**
      *   The user's hypothesis (Burden of Proof) is strong, but I think it's a symptom of a deeper issue.
