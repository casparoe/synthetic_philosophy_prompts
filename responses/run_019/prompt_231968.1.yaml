prompt: |-
  Ok so my friend keeps saying "if you can imagine it, it's possible" like it's a law of nature, and most recently he used it to end an argument about philosophical zombies — the idea of a person who is physically exactly like any normal person but has no inner experience, no what-it's-like, just does all the same stuff without any lights on inside. He says he can imagine that person, so that person is possible, and if that's possible then the view that everything is physical (minds included) has to be false. I've also seen someone use the same line to say time travel must be possible because we can imagine it.

  What I want is a menu of the different precise claims that sentence could be making, from the trivial to the radical. For each reading: is it a platitude, something substantive but actually defensible, or something probably false? Also say which reading the zombie argument would actually need, and which reading people usually mean when they just throw the line out to win an argument. And wich parts of this are settled versus genuinely contested among people who study it? Please don't present a contested view as the consensus.
