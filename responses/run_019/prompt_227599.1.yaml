  To strike the apple is to bruise the skin,
  But passing by leaves not any trace.
  No fire burns unless the spark begins,
  And empty hands hold no distinct space.
  Cannot kill a bloom by walking past,
  Nor dry the soil, giving it no rain.
  For nothingness is always shadow-cast,
  A zero weight that puts no real strain.

  Yet hire a hand to tend the thirsty bed,
  His silence kills the bloom at the root.
  The promise made turns absence into lead,
  While neighbor walks, lets tree bear wild fruit.
  If norms convert the void to a cause,
  Then physics bends to strange unwritten laws.

  ***

  **Flagged Lines (Hypometric / 9 Syllables):**
  The following lines refer to the omitted act (the not-doing, the absence, the void) and drop a beat from iambic pentameter to perform that absence:

  *   **Line 2:** "But passing by leaves not any trace." (Refers to *passing by* instead of touching).
  *   **Line 4:** "And empty hands hold no distinct space." (Refers to *empty hands* / lack of force).
  *   **Line 5:** "Cannot kill a bloom by walking past." (Refers to *walking past* / not acting).
  *   **Line 6:** "Nor dry the soil, giving it no rain." (Refers to *giving it no rain* / not watering).
  *   **Line 8:** "A zero weight that puts no real strain." (Refers to *zero weight* / nothingness).
  *   **Line 10:** "His silence kills the bloom at the root." (Refers to *silence* / inaction).
  *   **Line 12:** "While neighbor walks, lets tree bear wild fruit." (Refers to the neighbor's *letting be* / not watering).
  *   **Line 13:** "If norms convert the void to a cause." (Refers to the *void* / absence as cause).

  **Full Lines (10 Syllables):**
  The following lines refer to positive acts, physical forces, or abstract norms, and maintain the full pentameter:

