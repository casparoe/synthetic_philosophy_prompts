answer: |-
  This is a sophisticated query that cuts to the metaphysical heart of distributive justice. You are correct to identify that this is not merely a dispute about whether to measure welfare or resources, but rather a disagreement about the ontology of the human good and the boundary between the person and their possessions.

  The conceptual tangle regarding conversion factors arises because they sit precariously on the fault line between the *agent* and the *environment*. To understand why this creates friction between Capability theorists (like Amartya Sen and Martha Nussbaum) and Resource egalitarians (like Ronald Dworkin), we must examine how each camp conceptualises the relationship between a person and a good.

  ### The Nature of Conversion Factors

  First, let us briefly establish the terminology. In the Capability Approach, a **functioning** is an achieved state of being (e.g., being nourished, being mobile). A **capability** is the substantive freedom to achieve those functionings. **Resources** (or commodities) are the inputs.

  **Conversion factors** determine how effectively a resource can be turned into a functioning. Sen distinguishes between:
  1.  **Personal:** Metabolism, disability, gender, intelligence.
  2.  **Social:** Public health policies, discrimination, gender norms.
  3.  **Environmental:** Infrastructure, climate, geography.

  The puzzle you raise is: *What sort of thing is a conversion factor in the calculus of justice?*

  ### The Capability Theorist's View: The Relational Metric

  For the capability theorist, conversion factors are not part of the *equalisandum* (the thing to be equalised). We do not seek to equalise people's metabolisms or their height. Rather, conversion factors are **contextual parameters** that reveal the inadequacy of resources as a metric.

  The conceptual move here is to argue that resources have no intrinsic value. A bicycle is only valuable insofar as it contributes to the functioning of 'mobility'. If Person A has legs and Person B does not, the *same resource* (the bicycle) yields *different capabilities*.

  Therefore, for the capability theorist, conversion factors are **background facts about human heterogeneity** that must be accounted for to measure freedom accurately. They are not dimensions of welfare (happiness), nor are they endowments to be distributed. They are the *multipliers* or *divisors* in the equation of justice. To ignore them is to commit 'commodity fetishism'—valuing the good rather than what the good allows the person to be or do.

  ### The Resource Egalitarian's Counter: The Endowment Move

  You ask why a resourcist cannot simply treat a conversion factor as another personal endowment within the bundle. This is, in fact, precisely the strategy employed by Ronald Dworkin.

  Dworkin distinguishes between **personal resources** (health, talents, abilities) and **impersonal resources** (income, wealth, property). His 'envy test' suggests that equality is achieved when no one prefers another's bundle of resources to their own. If someone has a disability (a poor personal conversion factor), the resourcist argues we should compensate them with more impersonal resources (cash) until they are no longer envious of the able-bodied person's total bundle.

  From this perspective, a 'conversion factor' is merely a **deficit in personal endowment**.

  **Why the Resourcist Resists the 'Conversion Factor' Label:**
  The resourcist objects to the capability framing for two conceptual reasons:

  1.  **The Separation of Person and Circumstance:** Resourcists wish to maintain a clear distinction between the citizen (the agent responsible for their life) and the circumstances (the goods available to them). By focusing on conversion factors, the Capability Approach blurs this line. It makes the *value* of the resource dependent on the *idiosyncrasies* of the person. The resourcist wants an objective metric of the resource itself, independent of who holds it.
  2.  **Commensurability:** Resource egalitarianism relies on a single metric (usually money or claims on social wealth) to compare bundles. Conversion factors are multidimensional and often incommensurable. How does one bundle 'ability to walk' with 'income'? The resourcist argues that by translating the disability into a cash equivalent (via hypothetical insurance markets), they preserve a single currency of justice. To accept 'conversion factors' as a primary category is to abandon the single currency for a multidimensional assessment of human life, which they view as paternalistic or overly intrusive.

  ### The Conceptual Tangle: Where the Disagreement Lies

  The confusion you experience stems from three specific conceptual knots where these views collide.

  #### 1. The Boundary Problem (Internal vs. External)
  The primary tangle is ontological: *Where does the resource end and the person begin?*
  *   **Resourcist:** A wheelchair is an external resource. A functioning leg is an internal endowment. We can tax the former to compensate for the lack of the latter.
  *   **Capability Theorist:** This distinction is arbitrary. If insulin is required for a diabetic to convert food into 'being nourished', is insulin a resource or a biological necessity? If we treat it as a resource, we imply the diabetic is responsible for purchasing it like a luxury. If we treat it as a conversion factor, we acknowledge it is a precondition for agency.
  The resourcist tries to internalise the conversion factor (make it a priced endowment). The capability theorist argues this fails because some conversion factors (like basic metabolism or social discrimination) cannot be meaningfully priced without violating the dignity of the person or relying on speculative markets.

  #### 2. The Problem of 'Neutral' Resources
  The resourcist assumes resources can be defined neutrally. They argue, "We give everyone £10,000; what they do with it is up to them."
  The capability theorist counters that there is no such thing as a neutral resource because the *value* of the £10,000 is entirely determined by the conversion factors.
  *   **The Tangle:** If the resourcist adjusts the £10,000 based on the conversion factor (giving the disabled person £20,000), they are implicitly acknowledging that the *metric of justice* is not the money, but the *capability the money buys*.
  *   If they admit this, they have surreptitiously adopted the capability metric while speaking the language of resources. If they do not admit this, they fail to achieve equality of opportunity. The conversion factor exposes that 'resources' are not the true currency; they are merely a proxy.

  #### 3. Responsibility and Compensation
  Finally, there is the issue of responsibility.
  *   **Resourcist:** If a conversion factor is due to bad luck (genetic disability), compensate. If it is due to choice (expensive tastes), do not compensate.
  *   **Capability Theorist:** The distinction is often impossible to draw. Is a slow metabolism bad luck or a result of past lifestyle? Is a lack of education a personal failure or a social conversion factor?
  By treating conversion factors as background facts, the capability theorist avoids having to price human traits. The resourcist, by trying to bundle them as endowments, is forced to put a price on human variation. The conceptual tangle here is whether justice requires us to **price human difference** (resourcist) or **accommodate human difference** (capability).

  ### Summary of the Status of Conversion Factors

  To answer your specific questions on the status of these factors:

  1.  **Are they part of what we equalise?**
      *   **Capability View:** No. We equalise *capabilities*. Conversion factors are the variables that determine the size of the capability set given a resource set.
      *   **Resource View:** Yes, indirectly. We equalise the *value of the bundle*, which includes compensating for poor conversion factors treated as personal asset deficits.

  2.  **Are they background facts?**
      *   **Capability View:** Yes. They are the heterogeneous reality of the human condition that any theory of justice must navigate.
      *   **Resource View:** They are obstacles to be monetised and neutralised.

  3.  **Are they a dimension of welfare?**
      *   **Neither.** Both theories generally reject welfarism (subjective satisfaction). Conversion factors are about *objective ability*, not subjective happiness.

  4.  **Why is it not just another endowment?**
      *   Because endowments are tradable or compensatable within a single metric. Conversion factors often represent **incommensurable barriers**. To treat a paralysis as a 'negative asset' to be offset by cash implies that the cash and the leg are fungible. The capability theorist argues they are not; the cash is only valuable *because* of the leg (or the wheelchair). Making the conversion factor an endowment reverses the normative priority: it makes the person serve the metric, rather than the metric serving the person.

  ### Conclusion

  The tangle remains unresolved because it represents a fundamental disagreement on whether justice is about the **distribution of means** (where conversion factors are complications to be priced) or the **equality of freedom** (where conversion factors are central data points).

  The resource egalitarian fears that acknowledging conversion factors as primary leads to an endless, intrusive audit of human differences. The capability theorist fears that ignoring them leads to a formal equality that masks substantive oppression. The conversion factor is the lens through which this dispute over the very nature of equality is brought into focus.
