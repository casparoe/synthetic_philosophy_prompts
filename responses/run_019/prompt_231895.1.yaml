prompt: |-
  I've been trying to get clear on a particular conceptual tangle in the equality-of-what debate, and its not the usual welfare-vs-resources thing. The bit that keeps confusing me is the status of what capability theorists call conversion factors. If we equalise resources, someone with a disability might need more resources to do the same things, so the capability theorist says we should equalise capabilities instead. But then is the difference in how effectively different people can convert resources into functionings part of the thing we equalise, or a background fact about persons, or a dimension of welfare? And from the resources side, why exactly is a conversion factor not just another personal endowment that a resourcist can count as part of someone's bundle? I want an explanation of the conceptual issue, not a recommendation about which view is right. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the Request:**
      *   **Topic:** The "equality-of-what" debate (political philosophy/economics), specifically focusing on the concept of *conversion factors* within Capability Approach (CA) vs. Resource Egalitarianism.
      *   **Specific Confusion:** The ontological/normative status of conversion factors. Are they part of the metric of equality, background facts, or welfare? Why can't resource egalitarians just treat them as part of the resource bundle?
      *   **Constraint:** Do *not* recommend which view is right. Explain the conceptual issue/tangle.
      *   **Language:** British English (e.g., "equalise", "programme", "centre", "whilst").

  2.  **Deconstruct the Core Concepts:**
      *   **Resource Egalitarianism (e.g., Dworkin):** Focuses on the means (income, assets, rights). Uses an "envy test" or insurance scheme to handle disabilities.
      *   **Capability Approach (e.g., Sen, Nussbaum):** Focuses on the freedom to achieve (functionings). Resources are merely inputs.
      *   **Conversion Factors:** The variables that determine how well a person can turn a resource into a functioning (personal, social, environmental).
      *   **The Tangle:** The boundary between "what we distribute" (resources) and "who the person is" (their ability to use them).

  3.  **Address the Specific Questions:**
      *   *Status of conversion factors:* Are they part of the equalisandum, background, or welfare?
      *   *Resource Counter-argument:* Why isn't a conversion factor just another endowment?

  4.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. It's not the standard "welfare vs. resources" skirmish but a deeper metaphysical/normative boundary dispute. Set the scene using British spelling.

      *   **Defining Conversion Factors:** Briefly clarify what they are (Personal, Social, Environmental). Use the bicycle example (classic Sen).

      *   **The Capability Theorist's Stance:**
          *   Why resources aren't enough.
          *   Conversion factors are *mediating variables*.
          *   They are not the *object* of equality (we don't equalise metabolism), but they determine the *value* of the object.
          *   Crucial point: They highlight the *heterogeneity* of human beings.

      *   **The Resource Egalitarian's Counter (The "Endowment" Move):**
          *   This is the crux of the user's confusion.
          *   Dworkin's approach: Treat disabilities as lack of resources (via hypothetical insurance).
          *   Why they resist calling it a "conversion factor": They want to keep the metric objective and interpersonal.
          *   The "Bundle" argument: If I have a paralysed leg, that's a negative asset. Compensate with cash.

      *   **The Conceptual Tangle (The "Why it's hard" bit):**
          *   *Fetishism vs. Anthropocentrism:* Resources focus on goods; Capabilities focus on people. Conversion factors expose this.
          *   *The Boundary Problem:* Where does the resource end and the person begin? Is a wheelchair a resource or a prosthetic extension of the body? Is insulin a resource or a biological necessity?
          *   *Responsibility vs. Compensation:* If conversion factors are internal (metabolism), are they luck (compensate) or choice (don't)? Resource egalitarians struggle to price internal traits without invading privacy or making arbitrary distinctions.
          *   *Incommensurability:* Conversion factors are multidimensional. Resources are usually monistic (money/claims). You can't easily bundle "ability to walk" with "income" in a single metric without implicitly switching to a capability/welfare metric.

      *   **Status of Conversion Factors (Answering the specific query):**
          *   For CA: They are *contextual parameters*, not the *currency*.
          *   For Resourcists: They are *defects in endowment* to be priced.
          *   Why not welfare? Because they are about *ability*, not *satisfaction*.

      *   **Conclusion:** Summarise the impasse. It's about whether we equalise the *means* (and hope people are similar enough) or the *effective freedom* (acknowledging deep difference).

  5.  **Review and Refine (Self-Correction/Polishing):**
      *   *Check Language:* Ensure "s" instead of "z" in "equalise", "organise", etc. Use "whilst", "amongst", "programme".
      *   *Check Tone:* Neutral, analytical, philosophical. Avoid taking sides.
