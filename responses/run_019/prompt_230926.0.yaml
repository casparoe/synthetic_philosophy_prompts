      *   *Crucial Insight:* The user says the editor claimed it wasn't something "we knew." In science journalism, "knowledge" is often conflated with "published, vetted scientific fact." A leak is intelligence, not knowledge.
      *   *Which reading did the argument NEED?* To justify spiking something *likely true*, the editor needs a norm that distinguishes *high probability* from *knowledge*. That points to **The Certainty Threshold** or **The Institutional Verification Norm**. The Certainty Threshold is philosophically weak but pragmatically common. The Institutional Norm is stronger for science journalism.

  6.  **Refining the Output:**
