      *   **Problem:** Editor uses the slogan "we don't publish what we don't know" to spike stories. Specifically, spiked a story that was from a reliable source and overwhelmingly likely to be true, but editor claimed it wasn't "known."
      *   **Goal:** The user feels the slogan is doing too much work but keeps losing the argument because they can't pin down *which* interpretation of the slogan is being used. They want a menu of distinct precise principles (norms/thresholds) that the slogan could assert.
      *   **Requirements:**
          *   Lay out distinct principles (Knowledge Norm, Truth Norm, Belief Norm, Justification Norm, Certainty Threshold, etc.).
          *   For each: Is it independently plausible? Is it trivial or does real work? Does it license the editor's call to spike *this specific story*?
          *   Identify which reading the editor's argument *needed* to go through (i.e., which one actually justifies the spike in this context).
          *   Format: A menu of readings with verdicts, not one true interpretation.

  2.  **Deconstruct the Slogan:** "We don't publish what we don't know."
      *   Surface meaning: Publication requires knowledge ($P \rightarrow K$).
      *   Context: Science journalism.
