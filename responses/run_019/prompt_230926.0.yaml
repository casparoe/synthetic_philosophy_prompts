      *   *Institutional/Consensus Norm:* Licenses spike (science hasn't accepted it yet).

      *   *Which one did he NEED?* He needed to elevate the threshold above "justified belief." He likely relied on an equivocation between *Knowledge* (JTB) and *Certainty* or *Public Consensus*. The strongest philosophical cover is the **Knowledge Norm of Assertion**, but the strongest *practical* cover in *science* journalism is the **Institutional Verification Norm**. I need to highlight that the editor is likely smuggling in a **Certainty Threshold** while calling it **Knowledge**.

