      *   *Idea 2: The Belief Norm.* We only publish what we believe. (Too weak, doesn't explain the spike.)
      *   *Idea 3: The Justification Norm.* We only publish what we have sufficient evidence for. (This is the core of journalism, but "knowledge" implies more than just evidence.)
      *   *Idea 4: The Knowledge Norm (Standard Epistemic).* We only publish what constitutes knowledge (Justified True Belief + maybe no Gettier issues).
      *   *Idea 5: The Certainty/Infallibility Threshold.* "Know" means 100% certainty. (This is likely what the editor is actually using, even if they say "know".)
      *   *Idea 6: The Institutional/Verification Norm.* "Know" means "verified by our specific editorial process." (Procedural knowledge.)

  4.  **Developing Each Principle (Drafting the Content):**

      *   **1. The Truth Norm:** "Publish only $p$ if $p$ is true."
          *   *Plausibility:* High ideal, but impossible to operationalize ex ante.
          *   *Work:* Trivial/Impossible. We can't know truth before publishing.
          *   *Licenses Spike?* No. You can't know it's false, just unproven. If it's likely true, this norm doesn't forbid it.

      *   **2. The Belief Norm:** "Publish only $p$ if the newsroom believes $p$."
          *   *Plausibility:* Low. Journalists report things they don't personally believe (e.g., reporting a claim made by others).
          *   *Work:* Too weak.
          *   *Licenses Spike?* No. The journalist likely believes it.

      *   **3. The Justification Norm:** "Publish only $p$ if we have adequate evidence for $p$."
          *   *Plausibility:* High. This is standard journalism ethics.
          *   *Work:* Real work. Defines "adequate."
          *   *Licenses Spike?* Maybe. If "adequate" means "peer-reviewed paper" vs. "leak." But the slogan says "know," not "have evidence for."

      *   **4. The Standard Knowledge Norm (JTB+):** "Publish only $p$ if we stand in the relation of *knowledge* to $p$ (Justified True Belief, no Gettier)."
          *   *Plausibility:* Philosophically robust.
          *   *Work:* Significant. Distinguishes lucky guesses from knowledge.
          *   *Licenses Spike?* **Yes, potentially.** If the claim is a leak (reliable source) but not public/verified, is it knowledge? In science, "knowledge" often implies consensus or publication. If the data isn't public, do we *know* it?

      *   **5. The Infallibility/Certainty Threshold:** "Publish only $p$ if we are certain $p$." (Equating "know" with "certainty").
          *   *Plausibility:* Low philosophically (fallibilism), but high in risk-averse editing.
