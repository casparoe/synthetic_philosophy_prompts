          *   *Maya's View:* God works through human nature developmentally (like infants/milk). It's not a fake command; it's the *real* service for that stage. Abrupt banning would have failed (idolatry). The goal determines the route; gradualism isn't arbitrariness. Specific forms matter because they were the effective vehicle for *that* people at *that* time.
