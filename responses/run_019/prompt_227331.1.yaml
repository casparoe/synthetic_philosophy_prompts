      *   *Key Insight:* The word "Theft" is a *loaded term* that smuggles in the conclusion. But removing it doesn't help because the disagreement is about the *premises* that lead to the label.
      *   *The "Baseline" concept is crucial.* This is the clearest way to explain why they talk past each other. One sees the baseline as "Gross Income," the other as "Net Social Product."

  8.  **Final Polish:** Check against constraints.
