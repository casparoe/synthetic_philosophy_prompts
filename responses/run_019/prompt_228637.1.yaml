answer: |-
  ## Memorandum to the Regional Health System Ethics Committee

  **Subject:** Decision Procedure for Scarce Resource Allocation (Numbers vs. Individual Claims)
  **To:** Ethics Committee
  **From:** Ethics Advisory Consultant

  ### I. Preamble: Clarifying the Philosophical Stalemate

  Before adopting a protocol, the Committee must agree on what is actually being debated. The current division relies on caricatures of John Taurek's 1977 argument, *"Should the Numbers Count?"*

  **What Taurek Did Not Argue:**
  *   He did not argue that numbers are *practically* irrelevant (e.g., in logistics).
  *   He did not argue that we should ignore the future value of patients (prognosis, age, etc.).
  *   He did not argue for a "weighted lottery" (giving each individual an equal 1/6 chance in a 1-vs-5 scenario).

  **What Taurek Actually Argued:**
  Taurek challenged the moral arithmetic of aggregation. He argued that "loss" is experienced individually. There is no "super-observer" who feels the sum of five deaths as five times worse than one death. Therefore, from the perspective of duty, you owe a duty of rescue to Person A and a separate duty of rescue to Person B. You cannot discharge the duty to B by sacrificing A, even if B is a group of five.
  *   **The Proposal:** In a choice between saving one person or five (where all else is equal), Taurek suggests flipping a coin to decide *which group* to save (a 50/50 chance between the options), rather than automatically saving the five. This ensures the one is not treated as a mere means to minimize total loss.

  **The Counter-Argument:**
  Critics (e.g., Parfit, Kamm) argue that failing to save the greater number demonstrates a lack of equal concern for the value of life. If each life has value, five lives have more value than one. To ignore this is to waste moral value.

  **The Committee's Task:**
  Philosophy has not settled this. There is no consensus. Therefore, this procedure does not seek the "correct" moral answer. It seeks a **defensible institutional process** that identifies where the disagreement lies and forces a policy choice rather than masking it.

  ---

  ### II. The Allocation Decision Procedure

  This procedure is to be applied sequentially. At each step, determine if the answer is "Settled" (based on medical consensus or existing law) or "Contested" (requiring a Committee policy vote).

  #### Step 1: Comparability of Stake
  **Question:** Are the competing claims regarding the *same kind* of harm/benefit (e.g., life vs. life), or are they qualitatively different (e.g., life vs. limb)?
  *   **Settled Answer:** If the stakes are qualitatively different (e.g., survival vs. non-fatal injury), standard triage ethics prioritize the more severe harm (survival) regardless of numbers. Aggregation of lesser harms to outweigh a greater harm is generally rejected in clinical triage.
  *   **Contested Hand-off:** If a utilitarian calculation suggests five permanent injuries outweigh one death (via QALYs), but deontological norms prioritize survival, the Committee must vote on whether "Severity" trumps "Numbers."
  *   **Action:** If stakes are comparable (Life vs. Life), proceed to Step 2.

  #### Step 2: Special Obligations and Priorities
  **Question:** Are there non-numerical reasons to prioritize one party (e.g., instrumental value, prior commitment, first-come-first-served, staff safety)?
  *   **Settled Answer:** If one patient is a surgeon needed to save others later, or if one patient arrived first under a "first-come" policy, these tie-breakers resolve the case without invoking the numbers debate.
  *   **Contested Hand-off:** If no special obligations exist and patients are medically identical, proceed to Step 3.

  #### Step 3: The Aggregation Threshold
  **Question:** Does the institution endorse the principle that "more lives saved is always morally preferable" (Strong Aggregation), or does it acknowledge a duty to give the smaller group a significant chance (Non-Aggregation)?
  *   **Settled Answer:** *None.* This is the core philosophical rift.
  *   **Committee Vote Required:** The Committee must adopt one of three stances as institutional policy:
      1.  **Strong Aggregation:** Always save the greater number. (Rejects Taurek).
      2.  **Taurekian Coin Flip:** 50/50 chance between the *groups*. (Accepts Taurek).
      3.  **Weighted Lottery:** Randomize by *individual* (e.g., 6 straws, 1 for the single patient, 5 for the group). This is a compromise that respects individual equality but statistically favors the many.
  *   **Action:** Record the vote. This policy applies to all future cases fitting this profile.

  #### Step 4: The Disparity Limit (The "Absurdity" Check)
  **Question:** Is the numerical disparity so vast that the chosen policy from Step 3 yields an absurd result (e.g., 1 vs. 1,000)?
  *   **Settled Answer:** Most ethical frameworks (including some non-aggregationist ones) accept a "threshold" where numbers eventually overwhelm individual claims.
  *   **Committee Vote Required:** If the Committee adopted Strong Aggregation in Step 3, this step is skipped. If the Committee adopted Coin Flip or Weighted Lottery, they must define a threshold (e.g., "If the ratio exceeds 1:10, we revert to Strong Aggregation").
  *   **Action:** Apply the threshold. If below threshold, follow Step 3 policy. If above, save the many.

  ---

  ### III. Application to Case Studies

  Here we run the procedure on the two scenarios provided. Note that the verdicts depend on the Committee's vote in Step 3, as philosophy provides no consensus.

  #### Case 1: The Antidote (1 Life vs. 5 Lives)
  *   **Step 1 (Comparability):** Both groups face death. Stakes are identical. **Proceed.**
  *   **Step 2 (Obligations):** No special obligations stated. **Proceed.**
  *   **Step 3 (Aggregation Threshold):** This is the flashpoint.
      *   *If Committee votes Strong Aggregation:* **Verdict:** Administer to the 5.
          *   *Unpalatable Consequence:* This explicitly treats the single patient as expendable for the greater good. It accepts Taurek's critics' view that the one person's claim is morally submerged by the five. The single patient is denied any chance of rescue solely due to their isolation.
      *   *If Committee votes Taurekian Coin Flip:* **Verdict:** Flip a coin. 50% chance the one lives (and 5 die); 50% chance the 5 live (and 1 dies).
          *   *Unpalatable Consequence:* This accepts a higher probable mortality rate (expected loss of 3 lives vs. 1 life). It prioritizes fairness to the individual over minimizing total death. This will be viewed by many clinicians as a violation of their duty to minimize harm.
      *   *If Committee votes Weighted Lottery:* **Verdict:** 1 in 6 chance for the single patient; 5 in 6 chance for the group.
          *   *Unpalatable Consequence:* This attempts to split the difference but satisfies neither side completely. Aggregationists will argue it still risks unnecessary death; Taurekians will argue it still aggregates value (the group still has 5x the chance).
  *   **Step 4 (Disparity Limit):** 1 vs. 5 is likely below any "absurdity" threshold. The Step 3 verdict holds.

  **Analysis:** There is no philosophically neutral verdict here. The procedure forces the Committee to admit that **either** they are willing to let the one die to save the five (Aggregation) **or** they are willing to risk more total deaths to honor the one's equal claim (Non-Aggregation). The protocol requires you to vote on which "unpalatable consequence" your institution can bear.

  #### Case 2: The Antidote (1 Life vs. 5 Permanent Paralysis)
  *   **Step 1 (Comparability):** Stakes are *not* comparable. One group faces death; the other faces permanent disability.
      *   **Settled Answer:** In standard medical ethics and triage protocols, survival trumps morbidity. The "loss" of a life is categorically greater than the "loss" of limb function, regardless of numbers.
      *   **Taurekian View:** Taurek himself acknowledges that if the harms are not comparable, numbers might not be the only factor. The duty to save a life is stronger than the duty to prevent paralysis.
      *   **Aggregationist View:** While a utilitarian *could* argue 5 paralyzed lives contain less utility than 1 dead life, most clinical triage guidelines reject aggregating lesser harms to outweigh a fatal harm.
  *   **Verdict:** **Save the Single Patient.**
  *   **Analysis:** This case reveals that the "Numbers Count" debate is narrower than the Committee assumes. Both sides generally agree that severity of outcome trumps numerical superiority when the gap in severity is this wide (Death vs. Paralysis).
      *   *Caveat:* If the Committee includes strict utilitarians who believe 5 paralyzed lives represent a greater loss of QALYs (Quality-Adjusted Life Years) than 1 death, they may dissent here. However, for the purpose of a *health system protocol*, prioritizing survival is the settled clinical norm. The procedure resolves this at Step 1 without needing the Step 3 vote.

  ---

  ### IV. Implementation Guidelines

  1.  **Record the Step 3 Vote:** The decision on 1-vs-Many Life scenarios must be minuted as a **Policy Choice**, not a discovery of moral truth. Example language: *"The Committee acknowledges the philosophical dispute regarding aggregation. By a vote of X to Y, the Institution adopts [Weighted Lottery/Save Most] to balance individual rights against population health."*
  2.  **Transparency:** If a lottery is used (Taurekian or Weighted), the rationale must be documented in the patient's record to protect clinicians from claims of negligence. It must be clear the decision was systemic, not clinical.
  3.  **Review Trigger:** If a case arises where the numerical disparity is extreme (e.g., 1 vs. 100), the Step 4 "Disparity Limit" must be invoked, and the Committee reconvened immediately. The protocol cannot automate that decision.

  ### V. Conclusion

  This procedure does not solve the moral dilemma. Taurek's challenge remains valid: there is no mathematical proof that five lives outweigh one. However, a health system cannot operate in a state of suspended judgment.

  By using this procedure, you acknowledge that **Case 1** requires a value judgment on which there is no consensus. You must choose whether your system prioritizes *minimizing total mortality* (Aggregation) or *honoring individual equal claim* (Non-Aggregation). **Case 2**, by contrast, is resolved by the hierarchy of medical harms, not the philosophy of numbers.

  Adopting this procedure ensures that when the difficult choice comes, the Committee knows exactly *why* they chose it, and where they have accepted moral risk.
