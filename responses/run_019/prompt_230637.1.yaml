prompt: |-
  I teach social and political philosophy, and I've somehow ended up chairing our college's study-abroad advising committee. The questions students keep bringing in are exactly the ones the philosophy of conventions and social norms is about, but our advisors have no systematic way to turn that into usable advice. The recurring question is some version of: 'Do I actually have to tip here? queue this formally? not cross against the light? or am I just doing it to avoid weird looks?' Advisors see several students a day in peak season, have maybe fifteen minutes each, and whatever guidance they give ends up in the handbook I have to sign off on, so I need something defensible and reusable, not a one-off opinion. Get it wrong and a student either offends their hosts or follows some local practice they find demeaning out of misplaced scrupulousness.

  So: you're an expert on social norms, conventions, and the line between the conventional and the moral. Please draft a one-page decision procedure — a checklist or flowchart in words — that a non-philosopher advisor can run through with a student to determine whether the student is morally required, merely expected, or free to skip a local convention. Draw on whatever philosophical work on conventions and norms you actually know, but do not cite anything; I want the reasoning compressed, not a reading list. Think carefully, and maybe start by listing the different reasons a norm can bind a visitor before you collapse them into steps. The procedure should distinguish (at least) between: (a) norms whose violation would impose real costs on someone who reasonably relied on you, like a tipped worker whose employer can legally pay them a couple dollars an hour; (b) harmless coordination devices like a queue; and (c) norms that work mostly as ways of showing respect or recognition, like forms of address and greetings. It should also handle the asymmetry where a local breaking their own norm can look like critique or reform, while a visitor doing the same thing reads as contempt. It should say what to do when compliance is cheap but the student objects on principle, and it should mark the steps where the procedure can't settle things and has to hand the decision back to a person because it's a value conflict rather than an application of a norm.

  Then run the procedure on three cases. First: a student going to a U.S. state where servers earn a tipped minimum wage and depend on tips, who believes tipping is a pernicious custom that lets employers underpay workers and wants to refuse to tip as a protest; I suspect the procedure will tell them to tip anyway, and I want that made honest and uncomfortable rather than softened. Second: a student in a city where crossing against the light is technically a petty offense but totally unenforced, and the host family crosses against the light constantly. Third: a student told they must wait in a long, formal queue at a market where, as far as they can tell, nobody would be harmed by stepping ahead. Lastly, tell me plainly what the procedure cannot do — which cases its likely to misclassify, and where the biggest judgment calls are hidden inside steps that look mechanical.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Social/Political Philosophy professor, now chairing a study-abroad advising committee.
      *   **Problem:** Students ask about local norms (tipping, queuing, jaywalking). Advisors lack a systematic way to advise. Need a defensible, reusable one-page decision procedure (checklist/flowchart in words).
      *   **Goal:** Distinguish between moral requirements, social expectations, and optional conventions. Avoid offending hosts or forcing students into demeaning practices.
      *   **Key Distinctions Required:**
          *   (a) Norms with real reliance costs (e.g., tipped wages).
          *   (b) Harmless coordination devices (e.g., queues).
          *   (c) Norms of respect/recognition (e.g., greetings).
          *   Asymmetry: Local breaking norm = critique/reform; Visitor breaking norm = contempt.
          *   Principle vs. Convenience: Compliance is cheap, but student objects on principle.
          *   Hand-off points: Where value conflicts require human judgment, not just rules.
      *   **Output:**
          1.  One-page decision procedure (compressed reasoning, no citations).
          2.  Application to three specific cases (Tipping protest, Jaywalking with hosts, Queue jumping).
          3.  Limitations analysis (what it can't do, hidden judgment calls).

  2.  **Deconstruct the Philosophy (Internal Knowledge):**
      *   *Conventions vs. Morals:* Lewisian conventions (coordination solutions) vs. Moral obligations (harm/rights).
      *   *Reliance/Expectation:* If others rely on your compliance for their welfare (economic or safety), the norm gains moral weight.
      *   *Expressive Harm:* Violating a norm might express disrespect, even if no material harm occurs.
      *   *Insider/Outsider Status:* Locals can break norms to change them; outsiders are guests. Breaking norms as a guest looks like rejecting the host's authority or culture.
      *   *Cost-Benefit:* If compliance is low cost and violation is high social cost, comply. If compliance violates core moral identity, reconsider.
      *   *Systemic vs. Individual:* Is the norm propping up an unjust system? (Tipping). Is it just efficiency? (Queuing).

  3.  **Drafting the Decision Procedure:**
      *   *Structure:* Needs to be linear but allow for loops or exits. Step-by-step questions.
      *   *Tone:* Practical, clear, non-jargon, but philosophically robust.
      *   *Step 1: Harm & Reliance.* Does someone lose money/safety if I don't do this? (The Tipping Case).
      *   *Step 2: Coordination & Order.* Is this just about keeping things running smoothly? (The Queue Case).
      *   *Step 3: Respect & Expression.* Is this a symbol of honor/status? (The Greeting Case).
      *   *Step 4: The Guest Asymmetry.* Does my breaking this look like an attack?
      *   *Step 5: Conscience & Cost.* Is the personal cost of compliance too high (demeaning/unsafe)?
      *   *Step 6: The Hand-off.* If stuck, who decides?

      *Refining the Steps:*
      *   Make sure to distinguish "Moral Requirement" vs. "Social Obligation" vs. "Optional."
      *   Address the "Protest" aspect explicitly.
      *   Address the "Host Family" aspect (social learning vs. rule following).

  4.  **Developing the Three Cases:**
      *   *Case 1 (Tipping):* High reliance cost (worker income). Guest asymmetry (protest looks like stinginess). Verdict: Tip, but acknowledge the discomfort. The procedure should force the student to admit they are using the worker as a means to a political end.
      *   *Case 2 (Jaywalking):* Low harm (if safe). Host behavior (modeling). Legal vs. Social. Verdict: Follow the host, but check safety. It's a coordination norm where the host sets the local parameter.
      *   *Case 3 (Queue):* Coordination norm. Violation causes frustration/unfairness. Verdict: Queue. "Nobody harmed" is false; harm is to fairness and order.

  5.  **Analyzing Limitations:**
      *   Where does it fail?
      *   *Hidden Judgment:* Determining "Harm" is subjective. Determining "Demeaning" is subjective.
      *   *Unjust Systems:* What if the norm *is* the oppression? (e.g., caste gestures, gender segregation). The procedure needs to acknowledge it might advise compliance with unjust norms for safety/pragmatism, which is a tough pill.
      *   *Cultural Competence:* Advisors need to know the facts. The procedure can't generate facts about the destination.

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too long?
      *   *Fix:* Compress the language. Use bold headers.
      *   *Critique:* Did I address the "local breaking norm = critique" asymmetry?
      *   *Fix:* Ensure Step 4 explicitly covers the "Guest Privilege" limitation.
      *   *Critique:* Is the Tipping advice honest?
      *   *Fix:* Don't soft-pedal. State clearly: "You are prioritizing your political statement over the worker's immediate rent money."
      *   *Critique:* Did I avoid citations?
      *   *Fix:* Check for names (Lewis, Rawls, etc.) and remove them. Keep the concepts.

  7.  **Final Polish:**
      *   Ensure the tone matches a professor speaking to colleagues/advisors (intellectual but practical).
      *   Check the "One-Page" constraint (visually, in text block).
      *   Ensure the "Hand-off" points are clear.

  8.  *(Final thought on the Tipping Case)*: This is the hardest one. The philosophical tension is between complicity in an unjust system vs. harming an individual within that system. The procedure must highlight that the individual worker is not the appropriate target for the protest.

  9.  *(Final thought on the Queue Case)*: The student claims "nobody harmed." The procedure must challenge the definition of harm to include fairness and trust in the system.

  10. *(Final thought on Limitations)*: Be honest that this tool manages *risk*, not *truth*. It doesn't solve moral dilemmas; it navigates them.

  *(Drafting the response based on these thoughts...)*
answer: |-
  ### The Visitor's Normative Decision Procedure

  **Purpose:** To distinguish between moral obligations, social obligations, and optional conventions for study-abroad students.
  **Usage:** Advisor and student review together. If any step yields a definitive result, stop. If steps conflict, proceed to "Hand-Off."

  **Step 1: The Reliance Test (Material Harm)**
  Does a specific individual or group suffer immediate material loss (income, safety, access) if you violate this norm, because they have structured their expectations around your compliance?
  *   *Yes:* You have a **Moral Requirement** to comply. Your personal objection cannot override their reliance.
      *   *Action:* Comply. Do not use the individual as a pawn for systemic protest.
  *   *No:* Proceed to Step 2.

  **Step 2: The Coordination Test (Order & Efficiency)**
  Is this norm primarily a solution to a coordination problem (e.g., queues, traffic, waiting turns) where violation creates chaos, frustration, or unfair advantage, even if no physical harm occurs?
  *   *Yes:* You have a **Social Obligation**. Violation signals that you consider yourself above the rules that bind others.
      *   *Action:* Comply, unless the cost to you is disproportionate (see Step 5).
  *   *No:* Proceed to Step 3.

  **Step 3: The Expression Test (Respect & Recognition)**
  Is this norm a symbolic gesture of respect, hierarchy, or recognition (e.g., greetings, forms of address, dress codes in sacred spaces)?
  *   *Yes:* Violation is read as **Expressive Harm** (disrespect/contempt).
      *   *Check:* Does compliance require you to act against your core identity or dignity (e.g., subservience based on race/gender)?
      *   *If No:* **Social Obligation.** Comply to maintain relational trust.
      *   *If Yes:* Proceed to Step 5.
  *   *No:* Proceed to Step 4.

  **Step 4: The Guest Asymmetry Check**
  Are locals currently violating this norm?
  *   *Yes:* Locals possess **Standing** to break their own norms as critique or reform. You, as a visitor, do not. Your violation will be interpreted as ignorance or contempt, not critique.
      *   *Action:* Follow the *local* standard for guests, not the behavior of locals. If unsure, ask your host: "Is this permissible for me?"
  *   *No:* Proceed to Step 5.

  **Step 5: The Cost-Benefit & Conscience Check**
  Is the cost of compliance (financial, psychological, or moral) disproportionate to the social friction caused by violation?
  *   *High Cost to Student (Demeaning/Unsafe):* You are **Free to Skip**. Prioritize safety and dignity. Prepare a polite explanation or exit strategy.
  *   *Low Cost to Student / High Cost to Host:* You are **Expected to Comply**. Your principle is less weighty than the host's social comfort.
  *   *True Value Conflict:* Both sides have valid claims (e.g., a norm that feels discriminatory but is culturally central).
      *   *Action:* **HAND-OFF.** This is not a rule application; it is a value judgment. Refer to Senior Advisor or Program Director.

  ***

  ### Application to Cases

  **Case 1: The Tipping Protest**
  *   **Step 1 (Reliance):** *Yes.* In this jurisdiction, servers rely on tips for livable income due to legal wage structures. Refusing to tip directly reduces their take-home pay for that shift.
  *   **Verdict:** **Moral Requirement.**
  *   **Advisor Script:** "The procedure flags this as reliance-based harm. While your critique of the wage system may be valid, the server is not the architect of that system; they are a participant relying on your compliance to pay rent. Refusing to tip uses the server as a means to a political end. You must tip. If you wish to protest, do so in a way that does not deduct from their earned income (e.g., write a letter to the owner, donate to a labor org)."
  *   **Note:** This is made intentionally uncomfortable. The student is being asked to participate in a system they dislike to prevent immediate harm to a vulnerable party.

  **Case 2: Jaywalking with Host Family**
  *   **Step 1 (Reliance):** *No.* Traffic flows regardless, assuming safety.
  *   **Step 2 (Coordination):** *Mixed.* It is a coordination norm, but the local "setting" is permissive.
  *   **Step 4 (Guest Asymmetry):** *Locals Violating.* The host family crosses. However, they have standing as residents who understand the risk and legal nuance.
  *   **Step 5 (Cost/Benefit):** Safety is the primary cost.
  *   **Verdict:** **Conditional Permission.**
  *   **Advisor Script:** "This is a coordination norm where the locals have set the parameter to 'flexible.' However, you lack their situational knowledge. Ask the host: 'Is it safe for me to follow you?' If they say yes, you may follow. If you are unsure, default to the formal rule (wait for the light) to avoid liability or danger. Do not treat their rule-breaking as permission for you to ignore safety."

  **Case 3: The Formal Queue**
  *   **Step 1 (Reliance):** *No immediate material loss.*
  *   **Step 2 (Coordination):** *Yes.* Queues exist to ensure fairness of access. Stepping ahead claims an unfair priority.
  *   **Student Claim:** "Nobody is harmed."
  *   **Procedure Rebuttal:** Harm includes frustration and the degradation of trust in the system. If everyone skipped, the system would collapse.
  *   **Step 5 (Cost):** Waiting is annoying (low cost) vs. causing social friction (high cost).
  *   **Verdict:** **Social Obligation.**
  *   **Advisor Script:** "Your assessment that 'nobody is harmed' is incorrect. You are harming the fairness of the process and signaling that your time is more valuable than others'. Unless you have a medical emergency, you must queue. This is not a place for individual optimization."

  ***

  ### Limitations and Hidden Judgment Calls

  This procedure is a risk-management tool, not a moral truth-machine. Advisors must be aware of where it fails:

  1.  **Defining "Harm" (Step 1):** The procedure assumes we can agree on what counts as material harm. In Case 1, a student might argue the *system* harms the worker more than the *tip* helps. The procedure overrides this by prioritizing immediate individual reliance over systemic abstraction. Advisors must be prepared to enforce this hierarchy without wavering.
  2.  **The "Demeaning" Threshold (Step 3 & 5):** Determining whether a norm is "merely respectful" or "inherently demeaning" is subjective. A norm requiring women to cover hair might be respectful in one context and oppressive in another. The procedure hands this off at Step 5, but the Advisor must recognize when a student's discomfort is prejudice versus when it is a legitimate dignity violation.
  3.  **Fact-Dependence:** The procedure cannot generate facts. It requires the Advisor to know *if* the server relies on tips, or *if* the queue is actually enforced. If the Advisor lacks cultural knowledge, the procedure produces false positives.
  4.  **The "Guest" Trap:** Step 4 assumes the guest should generally be more conservative than the host. This protects the student but can reinforce segregation (e.g., "Locals can drink, but you can't"). Advisors need to know when a restriction is protective vs. when it is exclusionary.
  5.  **Systemic Injustice:** The procedure prioritizes smooth interaction and immediate harm reduction. It may advise compliance with norms that are locally accepted but globally unjust (e.g., caste-based gestures). It manages the *visit*, it does not solve the *ethics*. Advisors must acknowledge that "successful adaptation" sometimes means "complicity in local inequities for the duration of the term."
