prompt: |-
  I am a staff journalist at a magazine that covers science and ideas. Two or three times a month I write up an empirical finding—an experiment, an observational study, a natural experiment—in which researchers offer an explanation for a pattern in their data. Increasingly I find that the same data arrive with two or more rival explanations attached, each internally coherent and each able to account for the observed numbers. My difficulty is not deciding which explanation is true; it is knowing what my copy is entitled to say.

  I would like a reusable procedure I can run on each story, in a few hours, without a statistician and without specialized modeling software. It should tell me when I may write that the evidence supports or favors an explanation, when I may write only that an explanation is consistent with the evidence, and when I must write that the available evidence does not discriminate between the rival explanations. Ground the procedure in what the philosophy of science actually supports about the underdetermination of theory by evidence: that a finite body of data is in general compatible with more than one incompatible explanation, so what advances a claim is whether the evidence discriminates among the live alternatives rather than merely fitting one of them.

  Please give the procedure as a checklist or flowchart in words, with the questions in the order I should ask them. For each question, say what counts as a sufficient answer, where the procedure stops with weak language, and where it permits stronger language. Mark plainly the steps at which a judgment call is required and cannot be eliminated by the procedure, and note the points where a working journalist will predictably go wrong, such as confusing a good story with a discriminating test or treating an explanation's ability to fit the data as evidence for it.

  Then run the procedure on the following three situations from my beat:

  1. A psychology paper reports that twenty minutes in a park improved working-memory scores in forty undergraduates relative to their own scores from that morning, and the authors claim the natural setting causes a cognitive boost. The same before-after improvement would also be produced by practice effects, regression toward the mean, or simply taking a break, and the study has no comparison condition.

  2. Two groups of economists analyze the same administrative panel data on declining labor-force participation among prime-age men. One group says the cause is the automation of routine jobs; the other says the cause is an expansion of disability-benefit eligibility. The broad trends fit both accounts. One group's model predicts a sharper participation decline in high-routine occupations; the other's predicts a sharper decline in counties where benefits became easier to obtain. The paper I am covering reports only the aggregate trends.

  3. A randomized trial assigns participants either to a working-memory training program or to an active control game matched for time, contact, and expectation. The training group improves more than the control group on one transfer test that the program explicitly targets, and this is the only one of several measured outcomes on which the groups differ.

  At least one of these should produce an answer I will not like, whether because it tells me to drop a causal claim my editors and readers find appealing or because it leaves me unable to choose between the competing explanations. Say plainly which case that is and why. Finally, state what the procedure cannot do: the situations where, even after running it, the honest conclusion is that the evidence underdetermines the choice among explanations, and no amount of journalistic care will remove that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Staff journalist at a science/ideas magazine.
      *   **Task:** Create a reusable procedure (checklist/flowchart) to evaluate empirical findings with rival explanations.
      *   **Goal:** Determine when to use strong language ("supports/favors") vs. weak language ("consistent with") vs. null language ("does not discriminate").
      *   **Philosophical Grounding:** Underdetermination of theory by evidence (Duhem-Quine thesis, inference to the best explanation, severity of tests).
      *   **Constraints:** Few hours, no statistician, no specialized software.
      *   **Output Requirements:**
          *   Checklist/Flowchart in words.
          *   Questions in order.
          *   Criteria for sufficient answers.
          *   Mark judgment calls.
          *   Mark predictable journalist errors.
          *   Apply procedure to three specific cases.
          *   Identify the "unpleasant" outcome.
          *   State limitations of the procedure.

  2.  **Develop the Procedure (The "Discrimination Checklist"):**
      *   *Philosophical Core:* Evidence $E$ supports Hypothesis $H_1$ over $H_2$ only if $E$ is more likely under $H_1$ than $H_2$ (Likelihood Ratio) or if $H_1$ passed a severe test that $H_2$ would have failed (Popper/Mayo). Mere fit is insufficient.
      *   *Step 1: Identify Rivals.* Don't just look at the authors' claim. What else fits?
      *   *Step 2: Check for Discrimination.* Did the design *force* the rivals to diverge?
      *   *Step 3: Check for Severity.* Was there a risk of failure?
      *   *Step 4: Language Calibration.* Map the findings to specific phrasing.
      *   *Journalist Traps:* Narrative bias, confusion of correlation/causation, ignoring null results.

      *Drafting the Steps:*
      1.  **List the Live Rivals:** What are the competing explanations? (Include null hypotheses).
      2.  **The Fit Test:** Do *all* rivals fit the data? If yes, stop (Weak language).
      3.  **The Divergence Test:** Did the study design create a situation where Rival A predicts Outcome X and Rival B predicts Outcome Y?
      4.  **The Severity Test:** Was there a genuine risk the data would have contradicted the preferred explanation?
      5.  **The Specificity Test:** Is the effect specific to the mechanism proposed, or generic?

      *Refining for the User:* Make it actionable. Use "Stop/Go" logic. Define the language tiers.

  3.  **Apply the Procedure to the Three Cases:**

      *   **Case 1 (Park & Memory):**
          *   *Rivals:* Nature boost vs. Practice/Regression/Break.
          *   *Design:* Before/After only. No control.
          *   *Discrimination:* Do the rivals diverge? No. All predict improvement.
          *   *Verdict:* Evidence does not discriminate.
          *   *Language:* "Consistent with," not "causes."
          *   *Unpleasant?* Yes, kills the causal headline.

      *   **Case 2 (Economists & Labor):**
          *   *Rivals:* Automation vs. Disability Benefits.
          *   *Data:* Aggregate trends only (in the paper being covered).
          *   *Discrimination:* The *models* predict different granular outcomes (occupations vs. counties), but the *reported data* is aggregate.
          *   *Verdict:* The specific paper being covered does not discriminate. (Even if the *field* could, this story can't claim it).
          *   *Language:* "Both account for trends," "Paper does not resolve."
          *   *Unpleasant?* Yes, leaves the reader hanging.

      *   **Case 3 (Memory Training):**
          *   *Rivals:* Training works vs. Placebo/Expectation (controlled by active control) vs. Chance (multiple comparisons).
          *   *Design:* RCT with active control.
          *   *Discrimination:* Active control handles expectation. But only 1 of several outcomes differed.
          *   *Severity:* Multiple testing increases false positive risk.
          *   *Verdict:* Weak support. Could be noise.
          *   *Language:* "Limited evidence," "Specific to one test," "Caution warranted."
          *   *Unpleasant?* Maybe, undermines the "brain training" hype.

      *   *Selection:* Case 1 is the most blatant "no discrimination." Case 2 is subtle (data vs. model). Case 3 is a "p-hacking" risk. Case 1 is the clearest example of "you can't say cause." I will flag Case 1 as the most frustrating because it's a classic "press release vs. reality" clash. Actually, Case 2 is also strong because the journalist is covering *one* paper that ignores the discriminating predictions of the models. Let's look closer.
      *   Case 1: No control group. Fundamental design flaw regarding causality.
      *   Case 2: The *paper* reports aggregate trends. The *models* have discriminating predictions, but the *data presented* doesn't show them. So the *evidence in the story* doesn't discriminate.
      *   Case 3: Active control is good, but multiple outcomes is bad.
      *   *Decision:* Case 1 is the most definitive "Stop." It's the clearest example of underdetermination. I will highlight Case 1 as the "unpleasant" one because it requires killing the causal verb.

  4.  **Drafting the Content:**

      *   *Introduction:* Acknowledge the philosophical stance (Underdetermination).
      *   *The Procedure:* "The Discrimination Protocol."
      *   *Tiers of Language:*
          *   Tier 1 (Strong): "Supports," "Favors," "Suggests mechanism."
          *   Tier 2 (Weak): "Consistent with," "Compatible with," "Does not rule out."
          *   Tier 3 (Null): "Underdetermined," "Indistinguishable," "Ambiguous."
      *   *The Steps:*
          1.  Enumerate Rivals.
          2.  Check for Shared Prediction (Fit).
          3.  Check for Divergent Prediction (Discrimination).
          4.  Check for Severity (Risk).
          5.  Check for Specificity (Noise vs. Signal).
      *   *Journalist Traps:* Narrative fallacy, "Control" confusion, p-value worship.
      *   *Application:* Walk through 1, 2, 3.
      *   *Limitations:* What the procedure can't fix (bad data, hidden variables).

  5.  **Refining the Philosophy:**
      *   Need to ensure I mention that *fit* $\neq$ *confirmation*. This is the core of the user's prompt.
      *   Reference "Inference to the Best Explanation" (IBE) but qualify it with "Severity" (Mayo) or "Bayesian Likelihood." Keep it non-technical.
      *   Key concept: **Risk of Error.** If the explanation couldn't be wrong given the data, it's not supported, just compatible.

  6.  **Review against Constraints:**
      *   *Checklist/Flowchart?* Yes.
      *   *Order?* Yes.
      *   *Sufficient Answers?* Yes.
      *   *Judgment Calls?* Marked.
      *   *Journalist Errors?* Marked.
      *   *Three Cases?* Yes.
      *   *Unpleasant Outcome?* Identified.
      *   *Limitations?* Included.

  7.  **Final Polish:**
      *   Tone: Professional, empathetic to the deadline, rigorous but accessible.
      *   Ensure the distinction between Case 2's *models* vs. *reported data* is clear.
      *   Ensure Case 1's "regression to the mean" is highlighted as a rival.
      *   Ensure Case 3's "multiple comparisons" is highlighted.

      *(Self-Correction during drafting)*: In Case 2, the prompt says "The paper I am covering reports only the aggregate trends." This is crucial. The *existence* of discriminating models doesn't help if the *evidence presented* is aggregate. The procedure must catch this. The evidence *in the story* underdetermines.
      In Case 1, it's a within-subjects design without a control. This is a classic confound.
      In Case 3, active control is good, but "only one of several measured outcomes" suggests data dredging or fragile effects.

      *Unpleasant Outcome:* Case 1 is the most structurally unsound. Case 2 is the most frustrating intellectually (we *could* know, but this paper doesn't tell us). I will choose Case 1 as the primary "kill the causal claim" example, but note Case 2 is also a "don't pick a winner" situation. The prompt asks for "At least one." I'll focus on Case 1 as the most egregious violation of the "discrimination" principle.

      *Wait, looking at Case 3 again:* "Only one of several measured outcomes." This is a multiple comparisons problem. Even with an RCT, if you test 20 things and 1 is significant, it might be noise. The procedure needs to catch this under "Severity/Specificity."

      *Let's finalize the "Unpleasant" call:* Case 1 is the most obvious. It requires telling the editor "We cannot say the park *caused* this." That is a hard sell for a magazine story. I will explicitly name Case 1.

  8.  **Finalizing the Procedure Structure:**
      *   Name: The Discrimination Protocol.
      *   Phases: Rivalry, Fit, Divergence, Severity.
      *   Language Guide.
      *   Pitfalls.

      *Let's write it.*
answer: |-
  ### The Discrimination Protocol: A Procedure for Evaluating Rival Explanations

  This procedure is grounded in the philosophical principle of **underdetermination**: data alone rarely prove a theory; they only eliminate theories that are incompatible with them. To claim evidence *supports* an explanation, you must show that the evidence *discriminates* it from live rivals. If multiple rivals survive the data equally well, the evidence underdetermines the choice.

  Use this checklist in order. Do not proceed to the next step if the previous one forces a stop.

  #### Phase 1: Identify the Live Rivals
  **Question 1:** What is the authors' preferred explanation, and what are at least two plausible alternative explanations (rivals) for the same pattern?
  *   **Sufficient Answer:** You can list the authors' claim plus at least one methodological artifact (e.g., selection bias, practice effect) and one substantive rival (e.g., competing mechanism).
  *   **Journalist Trap:** Accepting the authors' framing that there is only one "hypothesis" against a "null." The null is rarely the only rival.
  *   **Judgment Call:** Determining what counts as "plausible." If a rival is physically impossible or logically incoherent, discard it. If it is merely unpopular but fits the data, keep it.

  #### Phase 2: The Fit Test (Elimination of Weak Language)
  **Question 2:** Does the preferred explanation fit the data better than the rivals, or do *all* listed rivals fit the observed numbers equally well?
  *   **Stop Condition (Weak Language):** If all rivals fit the data equally well, **STOP**. You may not write that evidence "supports" the preferred explanation.
  *   **Permitted Language:** "The results are *consistent with* [Explanation A]," "The data *do not rule out* [Explanation A]," or "The pattern *matches the prediction* of [Explanation A]."
  *   **Forbidden Language:** "Causes," "Drives," "Confirms," "Supports," "Favors."
  *   **Journalist Trap:** Confusing *fit* with *confirmation*. Just because a story explains the numbers doesn't mean the numbers prove the story.

  #### Phase 3: The Divergence Test (Permission for Stronger Language)
  **Question 3:** Did the study design create a situation where the preferred explanation predicted Outcome X, while the rival explanations predicted Outcome Y (or no effect)?
  *   **Sufficient Answer:** Yes. The design forced the rivals to "stick their necks out" in different directions. (e.g., a control group that experiences the artifact but not the mechanism).
  *   **Stop Condition (Null Language):** If the design allows all rivals to predict the exact same outcome, **STOP**. The evidence does not discriminate.
  *   **Permitted Language:** "The evidence *distinguishes* between A and B," "The design *isolates* the effect of..."
  *   **Judgment Call:** Assessing whether the divergence is meaningful. A tiny statistical difference may be a divergence in name only.

  #### Phase 4: The Severity Test (Permission for Causal Claims)
  **Question 4:** Was there a genuine risk that the data would have contradicted the preferred explanation? (Could the explanation have been wrong?)
  *   **Sufficient Answer:** Yes. The measurement was precise enough, the sample large enough, and the test direct enough that a failure was possible.
  *   **Stop Condition:** If the measure is subjective, the sample tiny, or the test indirect (e.g., measuring a proxy rather than the mechanism), revert to Weak Language.
  *   **Journalist Trap:** Treating a "successful prediction" as proof, even if the prediction was vague enough to be compatible with anything (e.g., "stress will change").
  *   **Permitted Language:** "Provides *strong evidence* for," "Suggests a *causal link*," "Supports the claim that..."

  #### Phase 5: The Specificity Test (Guarding Against Noise)
  **Question 5:** Is the effect specific to the predicted outcome, or is it one of many measured outcomes where only one differed?
  *   **Sufficient Answer:** The effect appears on the primary, pre-registered, or theoretically central outcome, not on a subset of secondary measures.
  *   **Stop Condition:** If the effect is found on 1 of 20 measures, revert to Weak Language. This suggests the result may be noise (multiple comparisons problem).
  *   **Journalist Trap:** Ignoring null results within the same study. A "positive" finding amidst many negatives is often a false positive.

  ---

  ### Application to Your Three Cases

  Here is the procedure applied to your current stack.

  #### Case 1: Park Walk and Working Memory
  *   **Phase 1 (Rivals):** Preferred = Nature restores cognition. Rivals = Practice effects (took the test twice), Regression to the mean (scored low morning, naturally higher later), Break effect (rest helps, location irrelevant).
  *   **Phase 2 (Fit):** Do all rivals fit? **Yes.** All four explanations predict higher scores in the afternoon than the morning.
  *   **Phase 3 (Divergence):** Did the design force divergence? **No.** There is no control group (e.g., walking in a mall, or sitting in a room) to isolate "nature" from "break" or "practice."
  *   **Verdict:** **STOP at Phase 2.**
  *   **Required Language:** "The improvement is *consistent with* the restorative effects of nature." "The data *do not distinguish* between the benefits of nature and the benefits of simply taking a break."
  *   **Forbidden:** "Park improves memory," "Nature causes cognitive boost."
  *   **Unpleasant Outcome:** **This is the case you will not like.** You must kill the causal verb. The headline cannot promise a brain boost from trees. The design is fundamentally unable to discriminate the authors' theory from mundane artifacts.

  #### Case 2: Economists and Labor Participation
  *   **Phase 1 (Rivals):** Preferred (Paper A) = Automation. Rival (Paper B) = Disability Benefits.
  *   **Phase 2 (Fit):** Do both fit? **Yes.** The prompt states "broad trends fit both accounts."
  *   **Phase 3 (Divergence):** Did the *reported evidence* force divergence? **No.** The prompt states the paper you are covering "reports only the aggregate trends." While the *models* have discriminating predictions (occupations vs. counties), the *data presented in this story* does not show them.
  *   **Verdict:** **STOP at Phase 3.**
  *   **Required Language:** "Both explanations *account for* the decline." "This paper *does not resolve* the debate." "To distinguish them, one would need to see data on [occupations/counties], which this study does not provide."
  *   **Forbidden:** "Automation is the cause," "Benefits explain the drop."
  *   **Note:** You may report that *other* research attempts to discriminate, but you cannot claim *this* evidence does so.

  #### Case 3: Working-Memory Training Trial
  *   **Phase 1 (Rivals):** Preferred = Training improves memory. Rivals = Placebo/Expectation (controlled by active control), Chance/Noise (multiple outcomes).
  *   **Phase 2 (Fit):** Does the active control rule out expectation? **Yes.** This passes Phase 2 better than Case 1.
  *   **Phase 3 (Divergence):** Did the groups diverge? **Yes,** on one test.
  *   **Phase 4 (Severity):** Was there risk? **Yes,** it was an RCT.
  *   **Phase 5 (Specificity):** Is the effect specific? **No.** It was "the only one of several measured outcomes."
  *   **Verdict:** **STOP at Phase 5.**
  *   **Required Language:** "Evidence is *limited*." "Effect was *narrowly specific*." "Caution is warranted due to multiple comparisons."
  *   **Forbidden:** "Training boosts brain power," "Program works."
  *   **Note:** This is a classic "p-hacking" signature. The procedure saves you from hyping a likely false positive.

  ---

  ### Limitations of the Procedure

  Even after running this checklist, there are situations where the honest conclusion is that the evidence underdetermines the choice, and no amount of journalistic care will remove that ambiguity.

  1.  **Hidden Variables:** The procedure assumes you have identified the "Live Rivals." If there is a confounding variable unknown to the field (e.g., a seasonal virus affecting the psychology students), the procedure cannot detect it. You are reliant on the researchers' transparency.
  2.  **Measurement Validity:** If the tool used to measure the outcome is flawed (e.g., the "working memory" test actually measures motivation), the procedure validates the internal logic but not the external truth. You cannot test validity without specialized knowledge.
  3.  **The "Best of a Bad Lot" Problem:** Sometimes all rivals are wrong. The procedure helps you choose the *least wrong* explanation supported by the data, but it cannot guarantee the true explanation is among the candidates you listed in Phase 1.
  4.  **Cumulative Evidence:** This procedure evaluates *one* paper. Science often advances through the convergence of many underdetermined studies. A single story may have to report "inconclusive" even if the broader field is confident. You must decide whether to contextualize the single study within the broader consensus (which requires more time/research) or report it in isolation (which requires stricter adherence to this protocol).

  ### Summary of the "Unpleasant" Outcome
  **Case 1** is the most difficult for you. It requires you to tell your editors that a visually appealing, intuitive story ("Nature heals the brain") is not supported by the data provided. The study is a **before-after comparison without a control**. In the philosophy of science, this is a failure of **severity**. The hypothesis "Nature improves memory" did not risk failure, because *anything* happening in the afternoon would have fit the data. You must write a story about a null result disguised as a positive one. This is the core duty of the procedure: to prevent the magazine from publishing a coherent story that the evidence does not discriminate.
