  The family of moves you are describing is the core intuition behind **Superrationality**, but the precise, formalized concept that provides the "exact boundaries" and "valid core" you are looking for is **Updateless Decision Theory (UDT)** (often discussed alongside its predecessor, **Timeless Decision Theory (TDT)**, and its modern formalization, **Functional Decision Theory (FDT)**).

  Here is the carving of the concept:

  1.  **The Object of Choice (Policy vs. Action):**
      The critical boundary you noticed in the 1000-player case is the distinction between choosing an *action* conditional on observations (including private random draws or indexical information) versus choosing a *policy* (a mapping from observations to actions) prior to those observations.
      *   **Causal Decision Theory (CDT)** and standard **Evidential Decision Theory (EDT)** select actions *after* updating on all available information (including "I am player #452" or "My random number is 0.9"). In the 1000-player game, this leads to suboptimal coordination because each player treats the others' policies as fixed while varying their own action.
      *   **Updateless Decision Theory** selects the *policy* that maximizes expected utility from the "prior" perspective (before receiving indexical or private information). This validates the move to "treat the shared procedure... as the thing he can choose." It explains why you commit to $p=1/1000$ even if your private draw suggests you could win by deviating.

  2.  **The Link (Logical Correlation vs. Common Cause):**
      The boundary in the Prisoner's Dilemma case concerns the nature of the link between players.
      *   **CDT** requires a causal path.
      *   **EDT** relies on statistical correlation (which can be spurious or due to common causes).
      *   **TDT/UDT/FDT** rely on **logical correlation** (or **subjunctive dependence**). The link is not that your choice *causes* theirs, nor merely that you are correlated, but that you are instantiating the *same mathematical function*. If your algorithm outputs "Cooperate", then any identical algorithm in the same situation *must* output "Cooperate" as a matter of logical fact.
      *   **Boundary:** It does not require identical source code in a literal sense, but rather that the decision procedures are **logically isomorphic** regarding the decision at hand. Shared training or culture creates a *probabilistic* correlation, which is weaker. The move is strictly valid only under **logical dependence** (identical or provably equivalent algorithms), though it is often heuristically applied to high-probability correlations (which is where the "fuzziness" you noticed comes from).

  3.  **The Name:**
      Historically, Douglas Hofstadter coined the term **Superrationality** for the Prisoner's Dilemma argument ("assume everyone reasons identically"). However, in the rationalist community (LessWrong, etc.), this intuition was formalized to solve the boundary problems (like the 1000-player update problem). **Timeless Decision Theory (TDT)** was the first major formalization (focusing on logical nodes), but **Updateless Decision Theory (UDT)** is the specific term that captures the requirement to choose the *policy* before updating on private information (the 1000-player case). **Functional Decision Theory (FDT)** is the 2017 refinement that unifies these under the slogan of "choosing the output of your decision procedure."

      Given your description emphasizes the *policy selection* in the face of private information (the 1000-player case) and the *procedure identity* in the PD case, **Updateless Decision Theory** is the most established term in the forum literature that encompasses both constraints. It is the technical resolution to the "Superrationality" intuition.

  \answer{Updateless Decision Theory}
