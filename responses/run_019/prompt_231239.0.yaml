  2.  **The "1000 Players / 1 Winner" Game:** 1000 isolated players. Prize if exactly one sends a card. Optimal strategy is for everyone to randomize with $p = 1/1000$. However, once a player sees their private random draw (e.g., "I got 'send'"), they might be tempted to deviate if they treat others' actions as fixed. The argument says you must commit to the *policy* (the randomizing procedure) rather than the action conditional on the private draw.

