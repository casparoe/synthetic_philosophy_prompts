      *   **Task Part 1:** Explain why a *situationist critic* might take this passage to support the view that Aristotle is committed to *robust global character traits*. (Note: This is a bit of a trick question or requires nuanced understanding. Usually, situationists attack the *existence* of robust traits. The question asks why they would think *this passage* shows Aristotle *is committed* to them.)
      *   **Task Part 2:** Evaluate whether Aristotle's account of *habituation* contains resources to answer the situationist challenge.
