answer: |-
  # Joint Statement on Analyticity, Holism, and Linguistic Frameworks
  **Prepared by the Adversarial Collaboration Subcommittee**
  **Date:** October 24, 2023

  ## I. Agreed Claims
  *The following propositions are affirmed by both the Quinean Confirmation Holist (Q) and the Neo-Carnapian Framework Relativist (C). These claims are intended to demarcate the boundary of our consensus without prejudicing the residual metaphysical or semantic disputes.*

  1.  **On Confirmation Holism:** Both parties affirm the Duhem-Quine thesis: individual sentences face the tribunal of experience not in isolation but as part of a corporate body of theory. No single observation sentence logically entails the falsity of a specific theoretical sentence without auxiliary assumptions.
  2.  **On Revisability:** Both parties affirm that no sentence is *absolutely* immune to revision. Any statement, including logical laws or framework principles, may be rejected or modified if doing so yields a net gain in the overall pragmatic utility of the conceptual scheme (e.g., simplicity, predictive power, fertility).
  3.  **On Meaning Postulates:** Both parties acknowledge that formal systems can incorporate meaning postulates (rules governing the use of terms) and that these postulates function to constrain the permissible inferences within that system.
  4.  **On Quine's Critique:** Both parties agree that W.V.O. Quine's "Two Dogmas of Empiricism" successfully refuted the notion of analyticity as a source of *epistemic privilege* immune to empirical defeat. Neither party defends the view that analytic truths are known *a priori* in a sense that places them beyond the reach of pragmatic theory choice.
  5.  **On Centrality:** Both parties agree that some sentences are more "central" or "entrenched" than others. Sentences near the center of the web of belief (or constitutive of the linguistic framework) are less likely to be revised in the face of recalcitrant experience than peripheral observation sentences, though this is a matter of degree and pragmatic cost, not logical impossibility.

  ---

  ## II. Table of Residual Disagreements
  *While the above claims are shared, the interpretation and metaphysical weight assigned to them differ. The following table isolates the specific points of divergence.*

  | Issue | Quinean Formulation (Q) | Neo-Carnapian Formulation (C) | The Crux |
  | :--- | :--- | :--- | :--- |
  | **1. The Status of the Distinction** | The distinction between "analytic" and "synthetic" is a gradient of entrenchment within a single web of belief. Calling a sentence "analytic" is merely noting its high resistance to revision. | The distinction is binary *relative to a framework*. Inside a framework, sentences are either consequences of constitutive rules (analytic) or empirical claims (synthetic). | **Ontology of Rules:** Are constitutive rules distinct kinds of entities from empirical beliefs, or are they simply very stubborn beliefs? |
  | **2. Meaning vs. Belief Change** | When a community stops asserting a sentence (e.g., "Space is Euclidean"), there is no fact of the matter as to whether they changed the meaning of "space" or changed a belief about space. It is one continuous process of theory adjustment. | Relative to a fixed framework, we can distinguish changing a belief (falsifying a theorem) from changing the meaning (adopting new meaning postulates). This distinction is functional and precise within the context of inquiry. | **Fact vs. Description:** Is the distinction grounded in the world/mind, or is it a useful descriptive tool for tracking conceptual change? |
  | **3. The Source of Necessity** | "Necessary" truths are merely those we are currently unwilling to give up. Stipulative definitions do not create truth; they merely create synonyms, and the truth remains dependent on the synthetic truth of the synonymy. | Explicit stipulation creates a normative status. Once a rule is adopted, certain sentences *must* be accepted to remain within the framework. This normativity is distinct from empirical generalization. | **Normativity:** Does adopting a convention generate a distinct kind of obligation (validity) different from the obligation of empirical adequacy? |

  ---

  ## III. Addressing the Cruxes
  *To move beyond stalemate, we have identified three specific questions derived from the cruxes above. For each, we propose a concrete test case, record our divergent predictions, and assess the nature of the disagreement.*

  ### Crux 1: Belief Change vs. Meaning Change
  **Question:** When a recalcitrant observation leads a community to stop asserting a sentence, is the difference between changing a belief and changing the meaning of one of the terms a factual difference or a difference of description?

  *   **Concrete Test Case:** The transition from Classical to Intuitionistic Logic in certain domains of quantum mechanics. Consider the law of excluded middle ($P \lor \neg P$). When a physicist rejects this law for quantum propositions, do they mean "The world is such that excluded middle fails" (Belief Change) or "We are now using 'or' differently" (Meaning Change)?
  *   **Predictions:**
      *   **(Q):** There is no fact of the matter. The physicist has adjusted their total theory to maximize predictive utility. Whether we describe this as "changing the meaning of 'or'" or "discovering 'or' doesn't apply here" is a matter of expository convenience.
      *   **(C):** It is a factual difference relative to the framework. If the change is codified as a new inference rule (Framework Shift), it is a meaning change. If it is codified as a new empirical constraint within the old logic (Belief Change), it is a belief change. The formal record of the shift determines the classification.
  *   **Assessment:** **Partially Verbal.** Both sides agree on the *behavior* of the physicists (they stopped using excluded middle). They disagree on whether the *classification* of that behavior tracks a metaphysical distinction (C) or is merely a pragmatic labeling of the same psychological/sociological event (Q). We agree that for scientific practice, the Carnapian distinction is more useful for tracking formal consistency, while the Quinean distinction is more honest about the ultimate fallibility of the rules.

  ### Crux 2: Stipulation and Analyticity
  **Question:** Does an explicitly stipulated definition, or an inference rule that introduces and eliminates a newly defined logical connective, establish a kind of analyticity beyond the bare fact that the community has adopted a convention?

  *   **Concrete Test Case:** The introduction of the connective "Prior's Tonk" (where $A \vdash A \text{ tonk } B$ and $A \text{ tonk } B \vdash B$). This convention leads to triviality (everything proves everything). Contrast this with a well-behaved connective like "AND".
  *   **Predictions:**
      *   **(Q):** Both "Tonk" and "AND" are merely conventions. The reason we reject "Tonk" is not that it violates "analytic truth" but that it destroys the utility of the language (it makes the web of belief collapse). "Analyticity" adds no explanatory power over "pragmatic utility."
      *   **(C):** "Tonk" fails because it violates the *constitutive norms* of what a logical connective is (harmony between introduction and elimination rules). "AND" generates analytic truths because its rules are constitutive of its meaning. The distinction between a coherent framework and an incoherent one is not merely pragmatic; it is structural.
  *   **Assessment:** **Substantive.** This is not merely verbal. The Quinean claims utility is the *only* metric. The Carnapian claims structural coherence (validity) is a distinct metric from utility.
      *   *Progress:* We agree that "utility" must be broadly construed to include "consistency." However, Q maintains consistency is valuable only for pragmatic reasons, while C maintains consistency is a condition of *meaningfulness* itself. We acknowledge this as a fundamental metaphysical split regarding the nature of normativity.

  ### Crux 3: Framework Revisability and Quine's Critique
  **Question:** Can the neo-Carnapian honestly deny that framework statements are themselves open to revision for pragmatic reasons while still explaining how the original Quinean critique could have missed the distinction?

  *   **Concrete Test Case:** The adoption of Non-Euclidean geometry in General Relativity. Was Euclidean geometry *falsified* (Quine) or *replaced as a convenient framework* (Carnap)?
  *   **Predictions:**
      *   **(Q):** Euclidean geometry was treated as synthetic *a priori* by Kantians. Einstein showed it was empirically false regarding physical space. Quine's critique stands: what was thought to be analytic/framework-relative was actually a deeply entrenched empirical belief.
      *   **(C):** Euclidean geometry remains analytically true within the framework of Euclidean axioms. Physics adopted a *different* framework (Riemannian) because it was more pragmatically useful for modeling gravity. Quine missed the distinction because he conflated *external questions* (which framework to choose?) with *internal questions* (what is true within the framework?).
  *   **Assessment:** **Verbal (with substantive implications).**
      *   *Resolution:* The Neo-Carnapian *can* honestly admit framework statements are revisable for pragmatic reasons (Carnap's Principle of Tolerance). The disagreement lies in the description of the revision.
      *   **Q Description:** "We believed $P$, now we believe $\neg P$."
      *   **C Description:** "We adopted Framework $F_1$ (where $P$ is analytic), now we adopt Framework $F_2$ (where $\neg P$ is analytic)."
      *   *Conclusion:* The Quinean critique successfully established that framework choice is pragmatic and not epistemically privileged. The Neo-Carnapian successfully established that *within* a chosen framework, a distinction between rule-following and empirical discovery remains coherent. The dispute is whether this internal distinction warrants the label "Analyticity." Q says "No, it's just rules." C says "Yes, it's rules, and that *is* what analyticity means."

  ## IV. Final Consensus on the Dispute
  We conclude that the debate has shifted from a conflict over **facts** to a conflict over **taxonomy**.

  1.  **Substantive Agreement:** There is no epistemically privileged class of truths immune to pragmatic revision. All linguistic frameworks are chosen based on utility.
  2.  **Verbal Disagreement:** Whether the term "analytic" should be reserved for the (non-existent) epistemically privileged class (Quine's usage) or reclaimed for the (existent) framework-relative class of rule-consequences (Carnap's usage).
  3.  **Residual Substantive Disagreement:** Whether the "internal" perspective of a framework possesses a genuine normativity that cannot be reduced to the "external" pragmatic interests of the users.

  **Recommendation:** Future discussions should proceed by explicitly stipulating which sense of "analytic" is in play (Epistemic vs. Framework-Relative) to avoid talking past one another. We acknowledge that the Quinean critique successfully demolished the Epistemic notion, but failed to eliminate the utility of the Framework-Relative notion for formal semantics and logic.

  ***

  **Signed,**

  *The Quinean Confirmation Holist*
  *The Neo-Carnapian Framework Relativist*
