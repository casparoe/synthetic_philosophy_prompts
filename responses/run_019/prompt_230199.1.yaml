answer: |-
  # HANDOUT: Navigating the Ravens Paradox
  **Course:** Philosophy of Science (Upper-Level)  
  **Topic:** Hypothesis Confirmation & The Trilemma

  ### The Trilemma Setup
  Hempel's paradox arises from three claims that seem plausible individually but cannot all be true together. To find your position, follow the decision tree below. Do not worry about the technical names yet; answer based on your intuitions about the concrete cases.

  1.  **The Instance Condition:** Observing a positive instance (e.g., a black raven) confirms a universal generalization (e.g., "All ravens are black").
  2.  **The Equivalence Condition:** If two hypotheses are logically equivalent, any evidence confirming one confirms the other to the same degree.
  3.  **The Intuitive Judgment:** Observing a white shoe (a non-black non-raven) does **not** confirm "All ravens are black."

  ***

  ### The Decision Tree

  **1. The Anchor Case:** Does observing a **black raven** confirm the hypothesis "All ravens are black"?
  *   **No:** (Radical Skepticism – *Outside the scope of this trilemma*).
  *   **Yes:** Proceed to Q2.

  **2. The Paradoxical Case:** Does observing a **white shoe** confirm the hypothesis "All ravens are black"?
  *   **Yes:** Proceed to Q3.
  *   **No:** Proceed to Q5.
  *   **It Depends on how I found it:** Proceed to Q6.

  **3. The Nature of Confirmation:** Is confirmation an **all-or-nothing logical relation**, or a **matter of degree** (probability)?
  *   **All-or-nothing:** → **LEAF A (Hempel)**
  *   **Matter of degree:** Proceed to Q4.

  **4. The Size of the Effect:** Does the white shoe provide a **tiny, non-zero amount** of confirmation, or can the method of selection make it **inert (zero confirmation)**?
  *   **Tiny, non-zero amount:** → **LEAF B (Bayesian)**
  *   **Inert (Zero) if selected deliberately:** → **LEAF C (Sampling)**

  **5. The Source of Rejection:** You said the shoe does *not* confirm. Is this because logically equivalent sentences **do not** share the same evidence, or because **"non-black" is a defective predicate** for instances?
  *   **Equivalents do not share evidence:** → **LEAF D (Equivalence Denial)**
  *   **"Non-black" is defective:** → **LEAF E (Goodmanian)**

  **6. The Selection Check:** If I deliberately hunt for non-black objects to check for ravens, does that make the observation **fully inert** rather than merely weak?
  *   **Yes, fully inert:** → **LEAF C (Sampling)**
  *   **No, merely weak:** → **LEAF B (Bayesian)**

  *(Note: If you answered **Yes** to Q2, **Yes** to "Equivalents share evidence" (implicit in Q3/Q4), but still feel the **Intuitive Judgment** that the shoe shouldn't count, you occupy the **Inconsistent Cell**. See Leaf F.)*

  ***

  ### The Positions (Leaves)

  **LEAF A: Hempel's Satisfaction-Criterion**
  *   **Verdict:** Keep Instance & Equivalence; Drop Intuitive Judgment.
  *   **View:** Logic is strict; the white shoe *does* confirm the raven hypothesis.
  *   **Awkward Commitment:** You must accept that examining a red herring or a green leaf provides logical support for ornithological claims about ravens.

  **LEAF B: Bayesian Treatment (I. J. Good)**
  *   **Verdict:** Keep Equivalence; Drop Intuitive Judgment (reinterpreted quantitatively).
  *   **View:** The shoe confirms the hypothesis, but the degree is negligible due to the vast size of the class of non-black things.
  *   **Awkward Commitment:** You must admit that staring at your white desk technically increases the probability that all ravens are black, even if by an infinitesimal amount.

  **LEAF C: Sampling-Procedure View**
  *   **Verdict:** Contextualizes Instance & Equivalence; Drops Intuitive Judgment (conditionally).
  *   **View:** Confirmation depends on the experimental design; a shoe found in a random survey confirms, but one selected *because* it is non-black does not.
  *   **Awkward Commitment:** You must hold that the evidential value of a physical object changes entirely based on the historian's record of how the observer walked into the room.

  **LEAF D: Equivalence Denial (e.g., Scheffler)**
  *   **Verdict:** Keep Instance & Intuitive Judgment; Drop Equivalence Condition.
  *   **View:** "All ravens are black" and "All non-black things are non-ravens" are truth-equivalent but not confirmation-equivalent.
  *   **Awkward Commitment:** You must accept that two sentences meaning the exact same thing about the world can be supported by different sets of facts.

  **LEAF E: Goodmanian Projectibility**
  *   **Verdict:** Keep Equivalence & Intuitive Judgment; Drop Instance Condition (for certain predicates).
  *   **View:** Only "projectible" predicates (like *raven*) support instances; "non-black" is unprojectible, so the shoe is not a valid instance.
  *   **Awkward Commitment:** You must provide a non-circular criterion for why *green* is projectible but *grue* (or *non-black*) is not, without appealing to entrenchment alone.

  **LEAF F: The Inconsistent Cell**
  *   **Verdict:** Keep Instance, Equivalence, *and* Intuitive Judgment.
  *   **View:** Logical Contradiction.
  *   **Awkward Commitment:** You claim that the shoe is an instance, instances confirm, equivalents share confirmation, yet the shoe does not confirm. One of these premises must be abandoned.

  ***

  ### Map Limitations: Where the Taxonomy Blurs

  This decision tree simplifies the logical space. Be aware of two areas where distinct positions may collapse:

  1.  **Bayesian vs. Sampling:** These positions are difficult to separate unless we ask whether selection can render evidence **fully inert** (zero weight) rather than just **highly diluted**. If you believe selection only reduces the *degree* of confirmation, your view collapses into the Bayesian leaf. The Sampling view requires a qualitative break (inertness) based on experimental design.
  2.  **Goodmanian vs. Equivalence Denial:** Both positions are often motivated by worries about "unnatural" predicates. If you deny equivalence *because* the predicates in the contrapositive are unnatural, your view functionally resembles the Goodmanian restriction on instances. The tree separates them by asking *where* the failure occurs (the relation between sentences vs. the quality of the predicates), but in practice, the motivations often overlap.

  *Use this handout to locate your current intuition, then read the assigned texts to see if you can sustain that position under scrutiny.*
