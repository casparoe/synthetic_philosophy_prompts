answer: |-
  This is a classic stalemate in STS, and your intuition that the argument is a "trench coat" for multiple disagreements is correct, but I would push it further: it is not merely a semantic confusion, but a **normative anxiety disguised as an ontological claim.**

  Here is the diagnosis of why this debate circles, followed by a prescription for progress.

  ### The Diagnosis: A Category Error Fueled by Normative Stakes

  The debate is ill-posed because the predicate "have politics" conflates three distinct logical categories: **intent**, **causality**, and **moral agency**.

  1.  **The Semantic/Definitional Layer:** You identified this, but it's deeper than "intent vs. outcome." Side A (Winner, Latour, etc.) defines politics as *the ordering of human relations and the distribution of power*. Under this definition, if a bridge orders relations (rich drivers yes, bus riders no), it is political. Side B (Traditional Political Theory, hard-line Constructivists) defines politics as *the realm of deliberation, choice, and moral responsibility among conscious agents*. Under this definition, an object cannot be political because it cannot deliberate or be held responsible. They are not disagreeing about the bridge; they are disagreeing about the boundaries of the concept "politics."
  2.  **The Explanatory Stopping Point (Methodological):** This is the engine of the stalemate. Side A treats the artifact as a **mediator** that transforms the political intent of its creators into a new, often rigid, form. They stop the explanation at the artifact because the artifact *does work* that humans no longer have to do (the bridge enforces exclusion without a police officer). Side B treats the artifact as an **intermediary** that merely transports human will. They refuse to stop at the artifact because they fear that attributing politics to things dilutes human responsibility. If the bridge is racist, Side A says "the bridge excludes." Side B hears "the engineer is off the hook."
  3.  **The Normative Subtext:** This is the hidden fuel. Side B's insistence that artifacts are inert is often a defense of **human accountability**. If artifacts "have" politics, does that mean we can't blame the state? Side A's insistence that artifacts "have" politics is a defense against **structural invisibility**. If we say only humans are political, we miss how power becomes baked into the environment and escapes contestation.

  **Verdict:** The question "Do artifacts have politics?" is **category-confused and normatively loaded.** It asks for an ontological classification ("Do they have?") to solve a methodological problem ("How do we trace power?") while masking a normative fear ("Who is to blame?"). As long as the debate remains on the ontological status of the object, no progress is possible, because both sides are actually making claims about *how to study power* and *how to assign blame*, not about the metaphysical properties of concrete.

  ### Pathways to Progress

  You cannot resolve this debate by finding better evidence, because both sides agree on the empirical facts (the bridge is low, buses don't pass, people planned it that way). Progress requires **dissolving the question** rather than answering it.

  1.  **Shift from "Having" to "Mediating":** Stop asking if artifacts *have* properties. Ask how political relations are *materialized* or *delegated* into artifacts. This moves the discussion from ontology (what is it?) to praxis (what does it do?). This aligns with Latour's shift from "objects" to "actants."
  2.  **Distinguish "Politics of Design" from "Politics of Use":** Force the group to specify which temporal phase they are analyzing.
      *   *Design:* Is the intent encoded? (Side A says yes, Side B says intent is human).
      *   *Operation:* Does the effect persist without intent? (Side A says yes, Side B says effects are not politics).
      *   *Contestation:* Can the artifact be challenged? (This is where the real political theory lies).
  3.  **The "Responsibility Test":** Make the normative stakes explicit. Ask Side B: "If we say the bridge is political, does that actually let the engineer off the hook, or does it implicate them in a wider network?" Ask Side A: "If the artifact has politics, what is the mechanism for holding it accountable?" Usually, you find Side A doesn't want to sue the bridge, and Side B admits the bridge constrains action. The disagreement evaporates when the *purpose* of the claim is revealed.

  If your reading group refuses to shift from ontology to mechanism, **no progress should be expected.** You are witnessing a philosophical commitment clash, not a research puzzle. Side B views the attribution of agency to objects as a fundamental error in reasoning (anthropomorphism). Side A views the restriction of agency to humans as a fundamental error in sociology (human exceptionalism). These are foundational axioms, not hypotheses.

