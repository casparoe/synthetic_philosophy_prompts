answer: |-
  Here is a complete lesson plan designed to meet your constraints: no tech, under 20 minutes prep, and focused on student production of the paradox before theory.

  # Activity: "The Press Conference"

  **Concept:** Students act as spokespeople making public announcements. They must combine a **Fact** with a **Belief Clause**. The class acts as the press corps, voting on whether the announcement is "Acceptable" or "Defective."
  **Time:** 25 minutes activity, 40 minutes debrief, 10 minutes wrap-up.
  **Prep:** 20 small slips of paper (scraps are fine).

  ## 1. Setup & Materials (Prep < 20 mins)

  **Materials:**
  *   **Fact Slips (20 total):** Write one proposition on each slip. Mix observable facts with general knowledge.
      *   *Examples:* "There are 16 students here," "The lights are on," "2+2=4," "It is Tuesday," "This room has a door," "I am wearing shoes."
  *   **Board Space:** Divide the whiteboard into two columns: **Third Person** and **First Person**. Create a tally section for "Acceptable" vs. "Defective."
  *   **Tokens (Optional):** Poker chips, candies, or just checkmarks on a roster for participation points.

  **Room Arrangement:**
  *   Keep students in pairs (8 pairs total).

  ## 2. Runnable Rules & Round Structure

  **Introduction (2 mins):**
  Tell the class: "We are doing a logic and language drill. You are spokespeople. Your goal is to construct sentences that are *true* but test the limits of what is okay to say. There is no lecture yet. Just follow the rules."

  **Round 1: The Third-Party Report (8 mins)**
  1.  **Deal:** Give each pair one **Fact Slip**.
  2.  **Task:** Construct an announcement using this formula:
      *   *"[Fact], but [Partner's Name] does not believe [Fact]."*
      *   *Example:* "The lights are on, but Sarah does not believe the lights are on."
  3.  **Action:** One partner reads the sentence aloud, pointing to the other.
  4.  **Vote:** The rest of the class votes by show of hands: **Acceptable** or **Defective** (Something is off).
  5.  **Record:** Tally the votes on the **Third Person** column of the board.
  6.  **Rotate:** Pass the slips to the next pair. Repeat until most slips are used.
      *   *Expected Result:* Almost all votes will be "Acceptable."

  **Round 2: The Personal Pledge (8 mins)**
  1.  **Deal:** Give each pair a new **Fact Slip**.
  2.  **Task:** Construct an announcement using this formula:
      *   *"[Fact], but I do not believe [Fact]."*
      *   *Example:* "The lights are on, but I do not believe the lights are on."
  3.  **Constraint:** You must assert the Fact is *true* (do not say it if you think it's false).
  4.  **Action:** One partner reads the sentence about *themselves*.
  5.  **Vote:** Class votes: **Acceptable** or **Defective**.
  6.  **Record:** Tally on the **First Person** column.
      *   *Expected Result:* High "Defective" count. This is where the "squirm" happens.

  **Round 3: The Wildcard (7 mins)**
  1.  **Task:** Pairs create *any* sentence combining a fact and a belief clause that they think will **split the room** (a tie vote).
  2.  **Incentive:** If a pair creates a sentence that results in a near 50/50 split, they get a "Tension Token" (bonus point/bragging right). This encourages them to experiment with variations (e.g., "I believe it is not raining" or "It was raining but I didn't believe it").
  3.  **Action:** Read and Vote. Record on board.

  ## 3. Debrief Plan (40 Minutes)

  Do not start by defining Moore's Paradox. Start by interrogating the board.

  **Phase 1: The Data (10 mins)**
  *   **Point to the Board:** "Look at the tallies. Third Person was mostly 'Acceptable.' First Person was mostly 'Defective.'"
  *   **Ask:** "Why? The truth conditions are identical. If it's true that 'The lights are on but Sarah doesn't believe it,' why is it weird for *me* to say 'The lights are on but I don't believe it'?"
  *   **Goal:** Elicit that the *sentence* isn't false, but the *act of saying it* is broken.

  **Phase 2: Truth vs. Assertability (10 mins)**
  *   **Challenge:** "Is the sentence 'It is raining but I don't believe it' a contradiction? Like 'It is raining and it is not raining'?"
  *   **Guide them to:** No. It could be raining without me knowing (I'm asleep, I'm mistaken). So the sentence can be **True**.
  *   **The Pivot:** "If it can be true, why is it defective to *say*?"
  *   **Introduce the Norm:** When you assert $p$ (say "It is raining"), you represent yourself as believing $p$. To immediately add "but I don't believe it" cancels the representation you just made. You are taking away with the left hand what you gave with the right.

  **Phase 3: Mapping the Variations (15 mins)**
  Use the "Wildcard" round sentences to introduce the technical distinctions.
  *   **Omissive vs. Commissive:**
      *   If a pair said: "$p$, but I don't believe $p$." -> Label this **Omissive** (omitting belief).
      *   If a pair said: "$p$, but I believe not-$p$." -> Label this **Commissive** (committing to opposite belief).
      *   Ask: "Which feels worse?" (Usually Commissive feels more irrational, Omissive feels more confused).
  *   **The Tense Escape:**
      *   Ask: "Did anyone try past tense? 'It was raining but I didn't believe it.'"
      *   **Point:** This is perfectly fine. Why? Because the *assertion* is now, but the *belief* was then. The conflict is resolved by time.
  *   **The "Probably" Escape:**
      *   Ask: "What about 'It is raining, but I probably don't believe it'?"
      *   **Point:** Hedging weakens the assertion, reducing the tension.

  **Phase 4: Naming It (5 mins)**
  *   Now you can name it: "This is **Moore's Paradox**, named after G.E. Moore."
  *   Briefly mention why it matters: It shows that meaning isn't just about truth conditions (what makes a sentence true); it's about speech acts (what we *do* when we speak).

  ## 4. Failure Modes & Troubleshooting

  **Derailment 1: "It's not weird, I'm just lying."**
  *   *Student:* "If I say 'It's raining but I don't believe it,' I'm just lying about the rain. That's normal."
  *   *Fix:* Remind them of the Rule: "For this game, you must treat the Fact as **True**. You aren't lying about the rain. You are reporting on your mind. If you know it's raining, can you sincerely say you don't believe it?"

  **Derailment 2: "I don't know what I believe." (Self-Ignorance)**
  *   *Student:* "Maybe I'm unconscious of my beliefs. So it's true I don't believe it."
  *   *Fix:* Acknowledge this is a deep philosophical possibility (self-deception), but in standard communication, we assume **Transparency**. If you are willing to assert $p$, you are committed to believing $p$. The paradox relies on standard conditions of self-knowledge.

  **Derailment 3: "It's just bad grammar/style."**
  *   *Student:* "It's just clunky. Like saying 'I am here but I am not here.'"
  *   *Fix:* Point to the Third Person column. "The grammar is identical to 'Sarah is here but she isn't here.' That was fine. The grammar isn't the problem; the *speaker's position* is."

  **Derailment 4: Students treat "I don't believe" as "I'm not sure."**
  *   *Student:* "I can say 'It's raining but I don't believe it' if I'm unsure."
  *   *Fix:* Clarify the definition. "In this context, 'I believe $p$' means 'I hold $p$ to be true.' If you are unsure, you shouldn't assert '$p$' in the first place. The paradox requires you to assert $p$ confidently, then deny the belief."

  ## 5. Limitations (What the Game Can't Do)

  Be honest with yourself (and eventually the students) about what this activity leaves out:

  1.  **It doesn't solve the paradox:** The activity generates the *intuition* that something is wrong, but it doesn't prove *why*. You still need to lecture on the "Norm of Assertion" (e.g., Knowledge Norm vs. Belief Norm) to explain the mechanism.
  2.  **It assumes shared intuitions:** If a student is a radical skeptic or has a very different theory of mind, they might genuinely not feel the "squirm." The game relies on a shared, pre-theoretical understanding of what "asserting" means.
  3.  **It blurs Omissive/Commissive:** In the heat of the game, students might mix up "I don't believe $p$" with "I believe not-$p$." You will need to cleanly separate these in the debrief, as they have different logical weights.
  4.  **No "Deep" Moore:** The game captures the pragmatic weirdness. It does not capture the deeper epistemic paradox (how can a state of affairs be rational to believe but irrational to assert?). That requires a lecture.

  ## Summary Checklist for You
  *   [ ] Write 20 fact slips (5 mins).
  *   [ ] Draw board columns (2 mins).
  *   [ ] Print/Write participation roster (3 mins).
  *   [ ] **Total Prep:** ~10-15 minutes.
  *   [ ] **During Class:** Keep the "No Theory" rule strict until the debrief. If a student asks "Is this Moore's Paradox?" during Round 1, say: "Write that down for the end."
