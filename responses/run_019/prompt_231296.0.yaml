prompt: |-
  I keep running into a move in decision puzzles that I don't have a name for. You're stuck in a one-shot, no-communication game with a stranger: if you both press the cooperative button you each get $10, if one defects and the other cooperates the defector gets $15 and the other guy gets nothing, and if both defect you each get $1. The usual decision logic says defect, since defecting beats cooperating no matter what the other person does. But some people reason like this: the other player is in exactly my situation and will run exactly the same reasoning I do, so whatever I conclude, they'll conclude too—therefore I should pick the button I'd want both of us to pick. Somtimes this feels obviously right to me, and other times it feels like magical thinking dressed up as logic. Is there an established name for that move, and more importantly, how do you draw the line between the cases where it is a legitimate inference and the cases where it isnt? I'm not just after a label—I want to know what would have to be true about the two players and the situation for the move to work, and what makes it different from just assuming reciprocity that was never promised.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Scenario:** A classic one-shot Prisoner's Dilemma (PD). Payoffs: CC=\$10, DC=\$15/0, DD=\$1.
      *   **The Conflict:** Standard Game Theory (Nash Equilibrium) says Defect. A specific line of reasoning says Cooperate because "the other person is like me, so they'll do what I do."
      *   **The Question:** What is this move called? When is it legitimate vs. magical thinking? What conditions make it work? How is it different from assuming unpromised reciprocity?
      *   **The Goal:** Provide the name, explain the underlying logic, distinguish valid from invalid applications, and clarify the philosophical/mathematical grounding.

  2.  **Identify the Concept:**
      *   The reasoning described ("whatever I conclude, they'll conclude too") is the hallmark of **Superrationality** (coined by Douglas Hofstadter) or **Evidential Decision Theory (EDT)** / **Functional Decision Theory (FDT)**.
      *   It is distinct from standard **Causal Decision Theory (CDT)** which leads to defection.
      *   It is often associated with **Kantian ethics** (Categorical Imperative) in a philosophical context, but in game theory/decision theory, "Superrationality" is the specific term for this PD context.
      *   Another related term is **Logical Correlation** or **Acausal Trade** (in the context of AI/alignment), but "Superrationality" is the most accessible and historically grounded term for this specific puzzle.

  3.  **Deconstruct the Logic (Why does it feel like magic?):**
      *   Standard CDT: My choice cannot *cause* the other person's choice. We are separated. Therefore, I maximize my payoff given their fixed (but unknown) choice. Dominant strategy = Defect.
      *   Superrational/EDT/FDT: My choice is *evidence* of their choice (or logically linked). If I am rational, and they are rational, and we face the same problem, our outputs should match. Therefore, choosing Cooperate makes it highly probable (or logically necessary) that they choose Cooperate.
      *   The "Magic" feeling comes from the lack of a causal mechanism. How does my button press *make* them press theirs? It doesn't. But it *predicts* it.

  4.  **Determine Legitimacy (When does it work?):**
      *   It's not about "reciprocity" (tit-for-tat requires iteration). It's about **symmetry** and **common knowledge of rationality**.
      *   *Conditions for validity:*
          1.  **Symmetry:** Both players must be sufficiently similar (same information, same reasoning capabilities, same goals).
          2.  **Common Knowledge:** Both know they are similar, both know the other knows, etc.
          3.  **Determinism/Logical Connection:** The decision must be viewed as the output of a logical function, not a random causal event.
      *   *When it fails:*
          1.  **Asymmetry:** One player is irrational, emotional, or has different payoffs.
          2.  **Heterogeneity:** You don't know if the other person is using the same reasoning.
          3.  **Causal Isolation (strict view):** If you strictly believe your action has zero correlation with theirs (e.g., they are a random number generator), the logic collapses.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Name the concept immediately. "Superrationality" is the best fit. Mention Hofstadter. Also mention Evidential Decision Theory (EDT) and Functional Decision Theory (FDT) for technical precision.
      *   **The Core Logic:** Explain *why* it differs from standard Nash Equilibrium. Contrast Causal Decision Theory (CDT) with EDT/FDT. Use the "clone" analogy (if playing against yourself, you cooperate).
      *   **Legitimacy vs. Magical Thinking:** This is the crux.
          *   *Magical Thinking:* Assuming correlation without basis. "I hope they are like me."
          *   *Legitimate Inference:* Establishing the correlation through shared reasoning. "I know they are rational like me."
          *   *Key Distinction:* It's not about *influencing* the other player (causality), it's about *predicting* them (logic/evidence).
      *   **Conditions for Validity:** List the specific criteria (Symmetry, Common Knowledge of Rationality, Logical Determinism).
      *   **Differentiation from Reciprocity:** Clarify that this is one-shot. No future punishment/reward. It's about *logical alignment*, not *strategic exchange*.
      *   **Philosophical/Mathematical Context:** Briefly touch upon Kant (Categorical Imperative) and Newcomb's Problem (related structure).
      *   **Conclusion:** Summarize the takeaway. It's a valid framework *if* you accept the premises of logical correlation, but risky if the symmetry is broken.

  6.  **Refining the Tone:**
      *   Keep it analytical but accessible.
      *   Acknowledge the user's intuition (that it feels like magic) is shared by many philosophers.
      *   Ensure the distinction between "causing" and "correlating" is sharp.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Call it "Kantian Game Theory." *Correction:* While related, "Superrationality" is the specific game-theoretic term Hofstadter used for this exact PD scenario. Keep Kant as a sidebar.
      *   *Initial thought:* Say it "works." *Correction:* Be careful. It doesn't guarantee a win in the real world because people aren't perfectly rational clones. Say it "maximizes expected utility *under specific assumptions*."
      *   *Make sure to address FDT:* Functional Decision Theory (from MIRI/Soares/Yudkowsky) is the modern formalization of this. It's important to mention for completeness.

  8.  **Final Polish:** Check against the user's specific constraints ("not just after a label," "what would have to be true," "different from reciprocity"). Ensure all are answered explicitly. (The resulting output matches the detailed response provided previously.)
answer: |-
  The line of reasoning you are describing has a few names depending on which field you ask, but the most precise label for this specific puzzle is **Superrationality**.

  The term was popularized by Douglas Hofstadter in his *Scientific American* columns (later collected in *Metamagical Themas*) specifically to address the Prisoner's Dilemma scenario you described. In modern decision theory, this is formalized under **Evidential Decision Theory (EDT)** or, more recently, **Functional Decision Theory (FDT)**.

  Here is the breakdown of why this reasoning feels like magic, when it is actually legitimate logic, and the specific conditions required for it to hold water.

  ### 1. The Name and The Logic
  **Standard Game Theory (Causal Decision Theory):**
  Standard analysis uses *Causal Decision Theory (CDT)*. It asks: "Can my button press physically cause the other person's button press?" Since you are in separate rooms with no communication, the answer is no. Therefore, you treat their choice as independent. Since Defect dominates Cooperate regardless of their choice, you Defect. This leads to the Nash Equilibrium (Defect/Defect).

  **Superrationality (Evidential/Functional Decision Theory):**
  Superrationality asks: "Is my decision process logically correlated with theirs?" It argues that if both players are rational, facing the same information, and trying to solve the same problem, they are effectively running the same algorithm.
  *   If I conclude "Cooperate," and the other person is like me, they will conclude "Cooperate."
  *   If I conclude "Defect," and the other person is like me, they will conclude "Defect."
  *   Therefore, the real choice isn't between Cooperate and Defect; it's between (Cooperate/Cooperate) and (Defect/Defect). Since \$10 > \$1, I should Cooperate.

  ### 2. Why It Feels Like Magical Thinking
  It feels like magic because it violates our intuition about **causality**. We are used to the idea that to change an outcome in the world, we must physically intervene. Superrationality relies on **logical correlation** rather than causal influence.

  It feels like "voodoo": *How does pressing my button here make their finger move over there?*
  The answer is: **It doesn't.** Your button press does not *make* them press theirs. However, your *reasoning* is a predictor of their *reasoning*. If you are truly identical in reasoning, your actions will be identical, not because one caused the other, but because they share a common cause (the logical structure of the problem and the rationality of the agents).

  ### 3. When Is It Legitimate vs. Magical?
  This is the crux of your question. The move is legitimate only if specific structural conditions are met. If these conditions are absent, it is indeed magical thinking.

  #### Condition A: Symmetry (The "Clone" Test)
  For superrationality to work, you must have strong reason to believe the other player is **relevantly similar** to you.
  *   **Legitimate:** You are playing against a clone of yourself, or an AI running the exact same source code, or a fellow game theorist whom you know adheres to the same decision framework.
  *   **Magical:** You are playing against a random person on the street, someone from a different culture, or someone you suspect is irrational. If there is a chance they are not running the "same algorithm," the correlation breaks. If you cooperate hoping they will, but they defect because they are a standard CDT reasoner, you get \$0.

  #### Condition B: Common Knowledge of Rationality
  It is not enough that you are both rational. You must know that they are rational, they must know that you are rational, you must know that they know that you are rational, and so on.
  *   **Legitimate:** You are in a room of logicians. Everyone knows everyone else is a logician.
  *   **Magical:** You suspect the other person might act out of spite, confusion, or altruism unrelated to game theory. If you cannot model them as a mirror of your own reasoning, the inference fails.

  #### Condition C: Logical Determinism
  You must view your decision as the output of a logical function, not a free-floating volition.
  *   **Legitimate:** You view your choice as "What is the correct answer to this problem?" If there is one correct answer, two rational agents must find the same one.
  *   **Magical:** You view your choice as "What do I feel like doing?" If your choice is arbitrary, there is no reason to expect the other person to match it.

  ### 4. How It Differs from Reciprocity
  You asked how this differs from "assuming reciprocity that was never promised." This is a vital distinction.

  *   **Reciprocity (Tit-for-Tat):** This is causal and temporal. "I will cooperate *so that* you will cooperate in the future," or "I will cooperate because you cooperated in the past." This requires iteration (multiple rounds) or enforcement mechanisms. In a one-shot game, reciprocity is irrational under standard theory because there is no future round to punish defection.
  *   **Superrationality:** This is atemporal and logical. It is not "I cooperate to *reward* you." It is "I cooperate because that is the solution to the puzzle, and you are solving the same puzzle." It relies on **parallelism**, not exchange. You aren't trusting them to be nice; you are trusting them to be *correct* in the same way you are.

  ### 5. Summary: The Litmus Test
  To decide if you should use this move in a real-world scenario, ask yourself these three questions:

  1.  **Is the other player a mirror?** Do I have evidence that they process information and incentives exactly the way I do? (If no, defect.)
  2.  **Is the reasoning common knowledge?** Do they know that I am trying to reason this way? (If they think I'm a sucker, they will defect.)
  3.  **Am I solving for "Us" or "Me"?** Superrationality requires adopting a "group agent" perspective. If you are strictly an individualist who values personal agency over logical consistency, this framework will always feel wrong to you.

  **The Verdict:**
  If you are playing against a stranger on the street, standard Game Theory (Defect) is the safer bet because the symmetry conditions are rarely met in the wild. Assuming a stranger is a superrational mirror of yourself is usually **magical thinking**.

  However, if you are playing against a colleague, a partner, or an AI system you understand, **Superrationality** is a legitimate, mathematically coherent framework that often yields better outcomes than strict Nash equilibrium. It is not magic; it is the recognition that in a world of similar minds, your reasoning is not isolated—it is a data point about the reasoning of others.
