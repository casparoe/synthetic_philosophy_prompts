answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON CONCEPT INDUCTION
  **Subject:** Mechanisms of Few-Shot Rule Discovery (The "Bongard Protocol")
  **Parties:** Camp A (Structural Rule Induction) & Camp B (Similarity-Based Classification)
  **Date:** October 26, 2023

  ## PREAMBLE
  We acknowledge that the task posed by Bongard problems—and by extension, the novelist's task of character consistency—requires a system to infer a governing principle from sparse data (12 examples) and apply it to novel cases. We agree that human performance on this task is robust, rapid, and often accompanied by a subjective sense of "insight." We disagree fundamentally on the computational architecture that subserves this ability. This document outlines our points of convergence, our irreducible disagreements, and the empirical cruxes that could resolve them.

  ---

  ## 1. POINTS OF CONVERGENCE
  *Claims both camps accept as premises for this collaboration.*

  1.  **The Underdetermination Problem:** Any finite set of examples (e.g., the six boxes on the left) is logically consistent with an infinite number of possible rules. The data alone does not dictate the solution.
  2.  **The Bias Requirement:** To solve the underdetermination problem, the learner must possess an inductive bias—a preference for certain hypotheses over others prior to seeing data.
  3.  **The Prediction Criterion:** Success is not merely labeling the 12 examples correctly (which can be done by rote memorization). Success is defined by accurate classification of a *13th* novel item (the 4th scene) that was not part of the training set.
  4.  **Context Sensitivity:** The "rule" inferred is not static. It shifts based on attention, prior context, and the specific contrast set provided in the right-hand panel (the "counter-examples").
  5.  **The Verbalization Gap:** Humans can often solve these problems non-verbally before they can articulate the rule. Both camps agree that verbal report is an imperfect window into the underlying mechanism.
  6.  **Failure Modes:** Both camps agree that errors will occur when the inductive bias mismatches the true structure of the environment (e.g., seeking a simple rule where none exists, or seeking similarity where a logical switch is required).

  ---

  ## 2. DISAGREEMENT TABLE
  *Neutral questions with distinct camp answers. No attempt has been made to reconcile these statements.*

  | Question | Camp A (Rule-Inference) | Camp B (Similarity) |
  | :--- | :--- | :--- |
  | **1. What is stored after learning?** | A structured, compositional representation (a "program" or logical predicate) that abstracts away from surface details. | A shift in the weighting of a high-dimensional feature space, or a new anchor point (exemplar) added to memory. |
  | **2. How is a new case classified?** | By executing the rule on the new input. If the input satisfies the logical conditions, it returns TRUE. | By computing a distance metric between the new input and stored exemplars/prototypes. If distance < threshold, it returns MATCH. |
  | **3. What are surface features (color, texture)?** | Noise to be filtered out. They are irrelevant variables that the system must learn to ignore to find the deep structure. | Constitutive material. They are dimensions in the feature space. "Ignoring" them means down-weighting those dimensions, not deleting them. |
  | **4. How does generalization happen?** | By unification. New cases are recognized as instances of the same variable-bound structure (e.g., $x$ encloses $y$). | By interpolation. New cases are recognized as lying within the same region of the psychological manifold as the training cases. |
  | **5. Why do humans report "Rules"?** | Because the cognitive format *is* rule-like. Verbal report is a direct readout of the representation. | Because humans are confabulators. We experience a similarity judgment and construct a post-hoc narrative to justify it. |
  | **6. What explains the "Aha!" moment?** | The discrete selection of the correct hypothesis from the candidate space. A phase shift in belief. | The sudden alignment of attention weights that brings previously disparate exemplars into a tight cluster. |

  ---

  ## 3. CRUXES
  *Sub-questions where empirical evidence could force one camp to abandon or significantly modify their position.*

  1.  **The Systematicity Crux:** Can the system generalize a relation to entirely novel objects without prior exposure to those objects in that relation? (e.g., If I learn "A chases B" with cats and dogs, can I immediately understand "A chases B" with galaxies and protons?)
      *   *Stakes:* Camp A says this is trivial for rules. Camp B says this requires impossible feature engineering unless the system is truly compositional.
  2.  **The Disjunctive Crux:** Can humans easily learn concepts that are logically simple but perceptually disjoint? (e.g., "Red OR Round".)
      *   *Stakes:* Camp B (Similarity) predicts this is hard because "Red" and "Round" are far apart in feature space. Camp A predicts this is easy because logical OR is a primitive operation.
  3.  **The Interference Crux:** Does articulating the rule verbally *improve* subsequent performance on similar problems?
      *   *Stakes:* Camp A predicts yes (verbalization stabilizes the rule). Camp B predicts no, or even degradation (verbalization forces a simplistic grid onto a nuanced similarity field).
  4.  **The "Family Resemblance" Crux:** Can humans accurately learn a category where no single feature is shared by all members, only overlapping chains of features?
      *   *Stakes:* Camp A struggles to posit a "rule" here without creating an ugly, ad-hoc list. Camp B thrives here naturally.

  ---

  ## 4. PROPOSED EXPERIMENTAL SETUPS
  *Two Bongard-style protocols designed to test the Cruxes. Predictions are recorded in advance.*

  ### EXPERIMENT 1: The Topological Trap (Tests Systematicity & Surface Features)
  **Setup:**
  *   **Left Panel (Rule):** Six boxes. Each contains exactly one closed curve that encloses a square. The outer shapes vary wildly (triangle, cloud, jagged line, circle). The inner squares vary in size, rotation, and fill (some solid, some hatched).
  *   **Right Panel (Contrast):** Six boxes. Some have two enclosed squares. Some have a square outside the curve. Some have a circle inside the curve.
  *   **The Conflict:** Visually, three of the Left Panel boxes look highly similar to each other (e.g., clean geometric lines). The other three look like "noise" (scribbles). Visually, two of the Right Panel boxes look like the "clean" Left Panel boxes, but violate the topological rule.
  *   **Task:** Subjects must classify a 13th box: A scribbled cloud enclosing a hatched square.

  **Camp A Prediction:**
  *   **Performance:** High accuracy (>90%) once the rule is found.
  *   **Latency:** Bimodal distribution. Long delay while searching hypothesis space, then rapid classification.
  *   **Rationale:** The rule "One closed curve encloses one square" is low-complexity. Surface noise (scribbles vs. clean lines) is stripped by the parser. The 13th box satisfies the logical predicate.

  **Camp B Prediction:**
  *   **Performance:** Moderate accuracy (60-70%), with specific errors on the "scribbled" items.
  *   **Latency:** Gradual decrease in response time as similarity weights adjust.
  *   **Rationale:** The feature space must be pre-tuned to detect "enclosure" and "squareness." If the visual similarity of the "clean" Right Panel boxes is high, they will pull the decision boundary. The 13th box is distant from the "clean" Left Panel cluster, risking misclassification unless attention weights heavily favor topology over texture.

  ### EXPERIMENT 2: The Wittgenstein Cluster (Tests Family Resemblance)
  **Setup:**
  *   **Left Panel (Rule):** Six boxes. There is no single feature common to all six.
      *   Box 1: Red circle, small.
      *   Box 2: Red square, large.
      *   Box 3: Blue circle, large.
      *   Box 4: Blue triangle, small.
      *   Box 5: Green square, small.
      *   Box 6: Green triangle, large.
      *   *Structure:* Every box shares at least two features (Color, Shape, Size) with at least two other boxes, but no feature is present in all six.
  *   **Right Panel (Contrast):** Six boxes that break the chain (e.g., Red Triangle Large, Blue Square Small, etc.—combinations not "connected" to the main web).
  *   **Task:** Classify a 13th box: Yellow Circle, Large. (This shares features with the set but breaks the specific adjacency chain).

  **Camp A Prediction:**
  *   **Performance:** Poor (<50%, chance level) or reliance on a forced, incorrect simple rule (e.g., subjects will claim the rule is "Contains a Circle").
  *   **Report:** Subjects will express frustration or insist there "must be a rule" they are missing.
  *   **Rationale:** The mind seeks a compact program. A disjunctive list of feature-pairs is computationally expensive and violates the simplicity prior. The system will overfit to a single salient feature.

  **Camp B Prediction:**
  *   **Performance:** Good (>80%).
  *   **Report:** Subjects will describe the group as "feeling right" or "belonging together" without a crisp definition.
  *   **Rationale:** This is the native format of similarity space. The 13th box will be classified based on its vector distance to the centroid of the cluster. If the "chain" creates a dense region in feature space, the 13th box's inclusion depends on its proximity to that density, not a logical check.

  ---

  ## 5. VERBAL DISAGREEMENT FLAG
  *We identify the following terms as potential sources of equivocation that must be monitored during data analysis.*

  *   **"Representation":** Camp A uses this to mean *symbolic structure* (like code). Camp B uses this to mean *activation pattern* (like a vector). If Camp B claims their weight matrix "represents" the rule, Camp A will object that this is a category error.
  *   **"Rule":** Camp A means an explicit algorithm. Camp B may use "rule" loosely to describe a consistent input-output mapping achieved via similarity. We agree to reserve "Rule" for Camp A's definition and use "Regularity" for Camp B's observed patterns.
  *   **"Abstraction":** For Camp A, abstraction means removing details to leave variables. For Camp B, abstraction means finding a central tendency (prototype) in a cloud of points. These are mathematically distinct operations.

  ---

  ## 6. NOTE FOR THE NOVELIST
  *Added by the Collaboration Chairs upon request.*

  You noted that fiction is a Bongard generator. You provide three scenes (the Left Panel); the reader infers the "character rule" (the Concept); the fourth scene tests the rule.

  *   **If Camp A is right:** Your readers are building a mental model of your character akin to a logical proof. If you break the rule (e.g., a coward acts bravely without cause), the reader rejects the fiction as "false" because the proof fails. Consistency is key.
  *   **If Camp B is right:** Your readers are building a cloud of memories around your character. "Consistency" is actually just *coherence*. A coward can act bravely if the new scene is "close enough" to the emotional centroid of the previous scenes. Nuance and vibe matter more than logical adherence.

  Our Experiment 2 (The Wittgenstein Cluster) is your "Complex Character." If readers can track them without a single defining trait, Camp B wins. Our Experiment 1 (The Topological Trap) is your "Plot Twist." If readers accept a radical surface change because the deep structure holds, Camp A wins.

  **Signed,**
  *Lead Investigator, Camp A (Structural Induction)*
  *Lead Investigator, Camp B (Similarity & Dynamics)*
