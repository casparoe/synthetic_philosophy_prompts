  Second, (1) conflicts with (5). Szasz's argument is conceptual, not empirical; he claims 'mental illness' is a category mistake, not just a disease we haven't found yet. By betting on neuroscience in (5), you concede that mental illnesses *are* bodily diseases waiting to be discovered, which falsifies your current claim in (1) that they are fundamentally metaphorical due to lack of lesions. You are mixing a philosophical denial with an empirical placeholder. If (5) comes true, (1) isn't just updated; it is destroyed. This leaves you vulnerable to the critique that you only deny biology because it hasn't been found yet, weakening your philosophical stance. It suggests your anti-psychiatry is contingent on current technology, not principle. Consequently, your project risks appearing naive about the philosophical implications of your own premises.

  Only apparent clashes
  (2) and (3) look tense but aren't. Szasz himself opposed coercion, not voluntary medication. You can consistently argue meds are helpful tools (2) while denying the state the right to force them (3). This distinguishes between therapeutic value and political liberty. A drug can work without the state mandating its use. Similarly, (3) and (4) are compatible; one concerns civil liberty (no detention without crime), the other concerns criminal justice (mitigation after crime). You can oppose preventive detention while supporting reduced sentencing for those who do offend. These distinctions keep your humanitarian concerns intact without logical contradiction. The key is separating treatment from punishment. This allows you to maintain a humane stance without contradicting your core liberties argument.

  Cheapest fix
  Abandon the hard ontological claim in (1). Instead of arguing mental illness is a 'myth', argue it is a 'disputed concept' that shouldn't justify coercion regardless of biological status. This preserves your love for (3), allows for meds (2), accepts future neuroscience (5), and keeps the insanity defense (4). The cost is you lose the provocative Szaszian hook, shifting your EPQ from metaphysics to ethics. You become a critic of psychiatric power, not a denier of pathology. Your title question changes from "Is it real?" to "Does reality justify coercion?" This is a stronger, more defensible position for a Year 13 project.
