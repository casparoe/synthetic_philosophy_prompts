prompt: |-
  I'm in Year 13 and doing my EPQ on whether mental illness is a genuine kind of thing, and I've got a bit obsessed with Thomas Szasz, the psychiatrist who wrote The Myth of Mental Illness. My supervisor wants a one-page statement of my actual position before I start the dissertation proper, and I'm worried my views don't hang together as neatly as they felt when I was just nodding along to the book. Could you look at them and tell me whether the set is consistent?

  Here's roughly where I've landed. (1) Szasz is basically right: unlike a broken leg or pneumonia, so-called mental illnesses aren't diseases of the body, they're labels a society sticks on behaviour and suffering it finds difficult, and since there's no lesion or tumour to point at, the illness talk is metaphorical. (2) Even so, psychiatric medication genuinely helps loads of people — my best mate's antidepressants have honestly changed her life — and it would be cruel to take that away from her. (3) Nobody should ever be detained or forcibly treated on psychiatric grounds alone; if they haven't committed a crime, locking them up is just imprisonment with nicer wallpaper. (4) When someone does commit a crime whilst properly delusional — say they genuinely believed their victim was a demon — they shouldn't be punished like a sane offender, precisely because their illness meant they weren't in control of what they were doing. (5) I also reckon neuroscience will probably find clear brain abnormalities behind things like schizophrenia within my lifetime, and when it does I'll happily start calling those brain diseases instead.

  What I want is an audit, not a lecture on Szasz. Please use these sections, in this order: Bottom line (two or three sentences on whether the package survives as it is); Real clashes, worst first (the bulk of it, maybe 300 words — for each genuine tension, say which commitments are involved and what would have to give); Only apparent clashes (about 150 words on pairs that look dodgy but dissolve, and why); and Cheapest fix (roughly 100 words on the single revision that rescues the most, and what it costs me). Fair warning that I've definately got a soft spot for (3), so don't just tell me to bin the one I like least without saying why.
