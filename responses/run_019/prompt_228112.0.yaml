answer: |-
  ### 1. The Exam Question

  **Time Allowed:** 45 Minutes
  **Word Count:** No strict limit, but a concise answer is preferred.

  **Question:**

  In his 1923 paper *Vagueness*, Bertrand Russell argues that even precise scientific concepts rely on physical implementations that are inherently imprecise:

  > "The metre, for example, is defined as the distance between two marks on a certain rod in Paris, when that rod is at a certain temperature. Now the marks are not points, but patches of a finite size, so that the distance between them is not a precise conception. Moreover, temperature cannot be measured with more than a certain degree of accuracy, and the temperature of a rod is never quite uniform. For all these reasons the conception of a metre is lacking in precision."

  In engineering, we typically handle this by defining tolerance bands or hard cutoffs (e.g., "alert if latency > 500ms").

  Write a short essay addressing the following two points. **You must take a clear stance; do not simply summarize both sides.**

  1.  Does adopting an engineering-style "hard threshold" dissolve the Sorites paradox, or does it merely relocate the problem? Explain why.
  2.  Is the vagueness in Russell's metre example the same kind of vagueness found in the standard "heap" or "bald man" cases, or are they fundamentally different problems?

  ---

  ### 2. Model Answer

  The engineering instinct is to treat vagueness as a bug fix: define a schema, set a type, enforce a constraint. If "heap" is vague, we define `HEAP_THRESHOLD = 1000 grains`. While this works operationally, it does not dissolve the Sorites paradox; it merely relocates it from the concept to the stipulation.

  The paradox relies on the premise that removing one grain from a heap leaves a heap. If we arbitrarily declare 1000 grains the cutoff, we must accept that 1000 grains is a heap and 999 is not. This creates a sharp boundary where our intuition suggests none exists. The problem relocates because we can now ask: "Why 1000?" Any defense of 1000 over 999 will itself be vague. This is known as higher-order vagueness. The boundary between "heap" and "non-heap" is vague, but so is the boundary between "definite heap" and "borderline case." A hard threshold ignores this structure; it imposes precision without resolving the underlying semantic indeterminacy.

  Regarding Russell's metre, this is a different kind of problem than the standard Sorites cases. Russell is describing *measurement error* and physical imprecision. The concept of a metre is intended to be precise; the physical rod is just an imperfect instantiation. We assume there is a fact of the matter about the distance, even if our tools cannot capture it perfectly. This is epistemic vagueness—we don't know the exact value due to physical limits.

  In contrast, the "heap" or "bald man" cases involve *semantic vagueness*. There is no fact of the matter about exactly how many grains constitute a heap, because the word "heap" was never defined with that precision. The vagueness is in the language itself, not just the measurement tool.

  Therefore, the engineering response solves the practical problem (we can now write the code) but fails the philosophical one. It treats semantic vagueness as if it were merely measurement error. Russell's metre example highlights physical limits on precise concepts, whereas the Sorites paradox highlights conceptual limits on vague terms. Conflating the two leads to the false belief that a stipulated cutoff eliminates the paradox, when it actually just hides the arbitrariness behind a constant variable.

  ---

  ### 3. Marking Scheme

  ```json
  {
    "total_marks": 20,
    "criteria": [
      {
        "name": "Threshold Analysis",
        "marks": 5,
        "full_marks_requires": "Argues that setting a threshold relocates the paradox (e.g., via arbitrariness or higher-order vagueness) rather than solving it.",
        "typical_failure": "Claims that defining a cutoff definitively solves the paradox because 'code needs binary states'."
      },
      {
        "name": "Metre vs. Heap Distinction",
        "marks": 5,
        "full_marks_requires": "Identifies that Russell's metre is about physical/measurement imprecision while Sorites is about semantic/conceptual boundarylessness.",
        "typical_failure": "Treats both examples as identical problems of measurement error."
      },
      {
        "name": "Higher-Order Vagueness",
        "marks": 5,
        "full_marks_requires": "Explains that the boundary itself (or the choice of threshold) is subject to vagueness (e.g., 'why 1000 and not 999?').",
        "typical_failure": "Assumes the stipulated boundary is precise simply because it was written down."
      },
      {
        "name": "Argumentative Commitment",
        "marks": 5,
        "full_marks_requires": "Takes a clear, defended stance on the prompts without fence-sitting or neutral summarization.",
        "typical_failure": "Hedges excessively (e.g., 'both views have merit') without concluding which is stronger."
      }
    ],
    "grade_boundaries": {
      "distinction": 17,
      "pass": 12
    }
  }
  ```
