      *(Final check on the "Consequence Argument" claim)*: The roommate says the analogy is just a restatement. I need to clarify that the Consequence Argument is valid *if* you accept the premises, but the Puppet Analogy is trying to make you accept the premises by making them sound scary. It's an intuition pump for the premise "We have no control over the past/laws."

