      *   *Question-Begging:* Does the analogy smuggle in "external control" to prove "lack of control"? Yes, it risks begging the question against compatibilists who define control differently (e.g., guidance control vs. regulative control).

  4.  **Evaluate "Manipulation Cases" (The Cleanup Crew):**
