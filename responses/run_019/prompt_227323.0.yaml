      *   *Is the analogy just rhetoric?* Mostly, yes. But rhetoric matters. The puppet analogy triggers an intuition of *passivity*. The Consequence Argument is logical. The analogy might be doing heavy lifting by making determinism feel like *coercion* rather than *causation*.
