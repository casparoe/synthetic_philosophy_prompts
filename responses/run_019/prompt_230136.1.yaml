  7.  **Final Polish:** Ensure the distinction between "punishment" and "treatment" is clear. The rehab system isn't punishing; it's "protecting" based on "treatment needs." This is the crux.

      *(Self-Correction during drafting)*: Make sure I don't make the rehab system look incompetent. They must be *successful* at their own logic, which is why he stays. He hasn't met the criteria.

      *(Refining the Defense)*: The defender should argue that releasing someone who hasn't rehabilitated is negligent. The counter is that the metric for rehabilitation might be flawed.

      *(Refining My View)*: I should lean towards the idea that indeterminacy creates a power imbalance that can be harsher than fixed time.

  8.  **Final Output Generation** (matching the prompt's structure).
