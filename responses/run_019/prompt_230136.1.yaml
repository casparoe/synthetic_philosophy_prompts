answer: |-
  Elias is convicted of aggravated assault following a bar fight that left a victim with a broken jaw. In State A, which utilizes an American-style retributive model with determinate sentencing, guidelines assign a fixed term of 36 months; Elias serves 30 months with good behavior and is released on a guaranteed date, his debt to society considered paid regardless of his internal attitude. In State B, modeled after Halden-style rehabilitation principles, sentencing is indeterminate and contingent upon risk reduction; Elias behaves impeccably but remains stoic during mandatory therapy, refusing to admit emotional culpability or articulate remorse in the specific language clinicians require to certify lowered recidivism risk. Because the review board acts in good faith to protect public safety and cannot verify his rehabilitation without this psychological breakthrough, they deny parole repeatedly, keeping Elias confined for 60 months until he finally performs the required emotional labor, meaning the humane system holds him twice as long as the punitive one solely because he failed to convince them he had changed.

  **The Retributive Calculation**
  State A operates on proportionality and finality. The sentence is a quantified debt based on the harm caused, not the healer's assessment of the soul. Once the calendar runs out, the state's authority expires. This creates a "hard ceiling" on incarceration; even if Elias remains angry and dangerous, the system prioritizes legal certainty and limits state power over the individual's mind. The harshness is front-loaded (the loss of liberty), but the duration is predictable and finite.

  **The Rehabilitative Calculation**
  State B operates on risk management and reform. The sentence is a treatment plan with no fixed discharge date; release is a clinical decision, not a judicial expiration. Because the goal is safety through change, detention continues as long as the "pathology" persists. Elias is held longer not because the state hates him, but because the state believes it is negligent to release an untreated risk. The harshness is back-loaded and indeterminate, relying on the inmate's ability to navigate subjective psychological criteria.

  **The Structural Feature**
  The mechanism driving the extra time is **indeterminacy tied to psychological compliance**. In a retributive system, the key to the cell is time. In this rehabilitative system, the key is conformity to a therapeutic norm. The system requires the inmate to internalize the state's moral framework (admitting culpability in a specific way) to gain freedom. This turns liberation into a reward for ideological or emotional submission rather than a right earned by serving a term.

  **Removing the Feature**
  If you remove indeterminacy and impose a fixed maximum term (e.g., 36 months) on State B, Elias leaves at the same time as his counterpart in State A. The rehabilitation programs would remain, but participation could not extend the deprivation of liberty beyond the statutory limit. The pressure to "perform remorse" would lessen because the clinician's recommendation would no longer function as a gatekeeper for release dates, only for privilege levels within the fixed term.

  **The Defender's Attack**
  A defender of State B would argue that releasing an unrepentant violent offender simply because a calendar date arrived is morally bankrupt and dangerous. They would contend that State A's "fairness" is an illusion that sacrifices public safety for administrative convenience. If Elias is genuinely high-risk, keeping him until he is safe is the only ethical choice, even if it takes longer. They would argue the extra time isn't punishment; it's preventative medicine, and the fault lies with Elias's resistance to treatment, not the system's structure.

  **Evaluation**
  I buy the defense only partially. While public safety is paramount, the rehabilitative model risks conflating "safety" with "compliance." Unlike physical risk factors (e.g., drug tests), emotional culpability is subjective and easily manipulated by staff bias or cultural mismatch. When release depends on convincing an authority figure that you have changed internally, it grants the state power over the inmate's conscience that exceeds the power to punish their body. A system that holds someone longer because they won't confess feelings they don't have is arguably more coercive than one that holds them for a fixed time because they broke the law. The rehabilitative ideal, when fused with indeterminate sentencing, can transform from a mercy into a limitless demand for conformity.
