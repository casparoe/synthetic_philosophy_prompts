prompt: |-
  I am a doctoral student working on formal epistemology and the foundations of probability, and I would like your help stress-testing a position I have provisionally adopted in my dissertation. Please answer as an expert in the philosophy of probability and formal epistemology; think carefully, and begin by brainstorming the widest plausible range of considerations before organizing your answer.

  The position is a strong reading of the symmetry-based resolution of Bertrand's paradox. On this view, the classical paradoxes of the principle of indifference -- the chord problem, the cube-factory problem, the water-and-wine problem, and their relatives -- do not show that indifference reasoning is unreliable. They show only that indifference must be applied to a problem whose statement fixes a definite group of transformations under which the epistemic situation is invariant. Once the correct symmetry group is identified, the uniform distribution over the group's invariant measure yields a unique answer; every apparent paradox arises either from applying uniformity to a parametrization that fails to respect the problem's actual symmetries, or from a problem statement that is genuinely ill-posed because it underdetermines which group applies. So, on my position: wherever indifference reasoning misfires, the fault lies in ill-posedness or in the wrong choice of group, never in the principle of indifference itself, which is correct and uniquely applicable whenever the problem is fully specified.

  What would count against this? I am asking for a map of the view's exposure, not a survey of the literature. Specifically:

  1. What observations, constructions, or formal results would defeat it outright? For example: a fully specified problem, with no disputed symmetries, where indifference over the natural invariant measure demonstrably leads to error; or a proof that no uniqueness result of the relevant kind can be had under plausible conditions; or a case where two different symmetry groups are each faithfully suggested by a single problem statement with no principled tiebreaker -- is that last one merely logically possible, or are there realistic cases of it?

  2. Which defeaters would a committed defender of this view concede as genuine threats, as opposed to ones they would dismiss as re-described ill-posedness? I am particularly interested in whether the response "your problem was just not fully specified" is always available to the defender, and if so, whether that availability immunizes the position rather than vindicates it.

  3. Does the view stand or fall with anything outside philosophy of probability -- say, with a claim about when physical symmetries can be read off a problem statement, or with positions on how reference classes or partitions get fixed in other problems (the grue problem, Sleeping Beauty, the fine-tuning argument)?

  4. Please rank the defeaters you identify from fatal to merely awkward, and state for each what the world -- mathematical or empirical -- would have to look like for it to obtain.

  Finally, an honest verdict: is this position well insulated, and if it is, is that insulation a sign of its truth or a sign that it has been qualified into near-unfalsifiability? If the latter, I would like to know what a falsifiable successor position would look like -- one that keeps the symmetry intuition but genuinely risks something.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral student in formal epistemology/foundations of probability.
      *   **Task:** Stress-test a specific position on Bertrand's Paradox and the Principle of Indifference (PoI).
      *   **Position:** A "strong reading" of the symmetry-based resolution. PoI is correct *if* applied to the correct symmetry group determined by the problem statement. Paradoxes arise from ill-posedness or wrong group choice, not PoI itself. Unique answers exist for fully specified problems.
      *   **Requirements:**
          *   Act as an expert in philosophy of probability/formal epistemology.
          *   Think carefully, brainstorm widely first.
          *   Address four specific questions (Defeaters, Concessions vs. Dismissals, External Dependencies, Ranking/Verdict).
          *   Provide an honest verdict on insulation vs. unfalsifiability.
          *   Suggest a falsifiable successor if applicable.

  2.  **Deconstruct the Position:**
      *   *Core Claim:* PoI + Symmetry Group Invariance = Unique Probability.
      *   *Defense Mechanism:* If results differ, the problem was ill-posed (underdetermined group) or the wrong group was used.
      *   *Implication:* PoI is never inherently flawed; human error or linguistic ambiguity is always the culprit.

  3.  **Brainstorming Considerations (Wide Range):**
      *   *Mathematical:* Measure theory, Haar measures, non-compact groups, infinite sets, Borel-Kolmogorov paradox.
      *   *Philosophical:* Jaynes' Maximum Entropy, Keynes' PoI, van Fraassen's critique, objective vs. subjective Bayesianism.
      *   *Physical:* Statistical mechanics (Gibbs paradox), quantum mechanics (basis selection), cosmology (measure problem).
      *   *Epistemic:* What counts as "fully specified"? Is symmetry objective or epistemic?
      *   *Logical:* Uniqueness theorems (Tits alternative?), existence of invariant measures.
      *   *Counter-examples:* Water-and-Wine (re-parameterization), Cube Factory (side vs. area vs. volume), St. Petersburg (infinite expectation), Sleeping Beauty (self-locating belief).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the position (Jaynesian/Objective Bayesian flavor). Set the tone (rigorous, critical).

      *   **Section 1: Outright Defeaters (Mathematical & Conceptual):**
          *   *Idea:* What if no invariant measure exists? (Non-amenable groups).
          *   *Idea:* What if multiple invariant measures exist? (Non-uniqueness of Haar measure on non-compact/non-unimodular groups, though usually unique up to scaling).
          *   *Idea:* The "Metaindifference" problem. How do we choose the group *itself* using indifference? Infinite regress?
          *   *Idea:* Borel-Kolmogorov. Conditioning on measure zero sets depends on the limit process (symmetry doesn't always fix the conditional probability).
          *   *Idea:* Empirical mismatch. If the symmetry-derived probability contradicts long-run frequency in a physical setup *described exactly the same way*.

      *   **Section 2: Concessions vs. Dismissals (The "Ill-Posed" Shield):**
          *   *Analysis:* The user asks if "it was ill-posed" is a get-out-of-jail-free card.
          *   *Point:* If *every* counterexample is dismissed as "ill-posed," the theory is unfalsifiable.
          *   *Distinction:* Genuine ambiguity (language) vs. principled underdetermination (physics doesn't specify the group).
          *   *Threat:* If two groups are *equally* natural given the text/physics, and they yield different results, the view fails unless it can rank symmetries.

      *   **Section 3: External Dependencies:**
          *   *Physics:* Statistical Mechanics. Does the microcanonical ensemble *really* follow from symmetry alone, or do we need ergodic hypotheses/dynamical justification?
          *   *Metaphysics:* Laws of Nature. Are symmetries features of the world or our description?
          *   *Other Paradoxes:* Grue (projectibility), Fine-Tuning (measure on constant space). If symmetry can't solve Fine-Tuning, does it weaken the general approach?

      *   **Section 4: Ranking Defeaters:**
          *   *Fatal:* Empirical mismatch in a controlled experiment (e.g., physical Bertrand chord experiment yields frequency $p$, symmetry yields $q$, description was precise).
          *   *Fatal:* Mathematical impossibility (No invariant measure for the specified group).
          *   *Severe:* Non-uniqueness of the "natural" group (tie between rotation vs. translation invariance).
          *   *Awkward:* Computational intractability (We know the group, but can't calculate the measure).

      *   **Section 5: Verdict & Successor:**
          *   *Verdict:* The position is highly insulated, bordering on dogmatic. It shifts the burden from the *principle* to the *modeling*.
          *   *Unfalsifiability:* Yes, because "fully specified" is a movable goalpost.
          *   *Successor:* A "Defeasible Symmetry" view. Symmetry suggests a prior, but it can be overridden by empirical data or higher-order constraints (Maximum Entropy with testable constraints). Or, a "Symmetry + Stability" view (the probability must be stable under small perturbations of the group).

  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Correction:* Make sure not to confuse Jaynes' Maximum Entropy with simple PoI. The user specifies "symmetry-based resolution," which usually implies Jaynes' invariance method. I need to be precise about *invariant measures* (Haar measures).
      *   *Nuance:* The Borel-Kolmogorov paradox is crucial here. It shows that conditioning on events of measure zero isn't fixed by symmetry alone; it depends on the *sequence* of sets. This is a strong mathematical counter-argument to "symmetry fixes everything."
      *   *Nuance:* The "Group Underdetermination" problem. In the Cube Factory, is the symmetry group of *length* more fundamental than *volume*? The view needs a meta-principle to choose the group. If it lacks one, it's incomplete. If it adds one, is that principle also justified by indifference?
      *   *Tone:* Keep it academic, respectful, but sharp. Use terminology correctly (Haar measure, amenable groups, reparameterization invariance).

  6.  **Final Review against User Prompts:**
      *   Did I brainstorm widely? Yes.
      *   Did I answer Q1 (Outright Defeaters)? Yes.
      *   Did I answer Q2 (Concessions vs. Dismissals)? Yes.
      *   Did I answer Q3 (External Dependencies)? Yes.
      *   Did I answer Q4 (Ranking)? Yes.
      *   Did I give a Verdict and Successor? Yes.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "ill-posed problem" and "wrong group" is clear, as the user treats them slightly differently. (Actually, the user says "ill-posedness OR wrong choice of group". I need to challenge the "wrong choice" part—how do we know it's wrong if not by the result?)

  *(Self-Correction on "Wrong Choice"):* If the view says "PoI is correct... whenever the problem is fully specified," then a "wrong choice of group" implies the problem *wasn't* fully specified (since the specification should dictate the group). I need to highlight this tension. If the specification dictates the group, why do experts disagree on the group?

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sophisticated position, essentially a robust defense of the Jaynesian/Objective Bayesian approach to the Principle of Indifference (PoI) via group invariance. It aligns with the view that probability is an extension of logic, where symmetries in the problem statement logically entail unique priors.

  However, as a stress-test, I must inform you that this position sits on a knife-edge between mathematical rigor and metaphysical stipulation. While it resolves the *internal* inconsistency of Bertrand's paradox, it exposes itself to external pressures regarding empirical adequacy, mathematical existence, and the epistemology of model selection.

  Here is the stress-test, organized by your requirements.

  ### 1. Outright Defeaters: Observations, Constructions, and Results

  To defeat this view outright, one must demonstrate that the mapping from "fully specified problem" to "unique symmetry group" to "unique probability" is broken.

  *   **The Non-Existence Defeater (Mathematical):**
      *   *Construction:* A problem statement that is intuitively clear and physically realizable but corresponds to a transformation group that admits **no invariant measure** (i.e., the group is non-amenable).
      *   *Scenario:* Consider inference problems involving certain infinite discrete groups or specific non-compact continuous groups where a Haar measure cannot be normalized. If the "natural" symmetry group of a fully specified physical situation is non-amenable, your view implies probability assignments are impossible. If agents *can* make reasonable predictions in such scenarios (empirically), the view fails.
      *   *Status:* Rare in standard physics, but possible in cosmological measure problems or specific statistical mechanics limits.

  *   **The Non-Uniqueness Defeater (The "Tie" Problem):**
      *   *Construction:* A problem statement where two distinct symmetry groups, $G_1$ and $G_2$, are equally entailed by the description, both admit invariant measures, but yield mutually singular probability distributions.
      *   *Scenario:* This is the refined Cube Factory. If the problem states "a factory produces cubes," does the symmetry group act on linear dimension $L$, surface area $A$, or volume $V$? Your view says the problem must specify which is invariant. But suppose the physical description is "cubes are produced by a process invariant under scaling." Scaling $L$ is not invariant for $V$. If the physical mechanism is genuinely scale-invariant, there is no unique Haar measure over the scale parameter without fixing the *dimension* of the object being measured.
      *   *Threat:* If there is no meta-principle to select the "correct" parameter space (the sample space itself), the symmetry argument cannot get off the ground.

  *   **The Borel-Kolmogorov Defeater (Conditionalization):**
      *   *Construction:* A case where symmetry fixes the prior, but conditional probabilities on measure-zero sets remain underdetermined.
      *   *Scenario:* You assign a uniform prior over a sphere based on rotational invariance. You ask for the conditional distribution on a great circle. The Borel-Kolmogorov paradox shows this depends on the *sequence* of sets converging to the circle (e.g., bands of latitude vs. wedges of longitude). Symmetry of the prior does not fix the symmetry of the conditioning process.
      *   *Threat:* If your view claims symmetry resolves *all* indeterminacy, Borel-Kolmogorov shows it does not resolve conditional indeterminacy without additional structural assumptions about the limiting process.

  *   **The Empirical Mismatch Defeater:**
      *   *Construction:* A controlled physical experiment where the setup is described precisely, the symmetry group is uncontroversial, but the long-run frequency diverges from the invariant measure prediction.
      *   *Scenario:* A "Bertrand's Wheel" where a physical mechanism throws chords. If the mechanism is described as "rotationally invariant and scale invariant," your view predicts a specific distribution. If the physical frequency consistently deviates (due to hidden dynamical constraints not captured by the kinematic symmetries), the view implies the description was "ill-posed."
      *   *Threat:* If *every* deviation forces a redescription of the problem, the view becomes unfalsifiable (see Section 2).

  ### 2. Concessions vs. Dismissals: The "Ill-Posed" Shield

  You ask whether the response "your problem was just not fully specified" is a genuine concession or an immunizing strategy.

  *   **The Genuine Threat:** A defender of your view must concede that **epistemic access to the symmetry group** is the bottleneck. The threat is not that PoI is wrong, but that humans (or even physicists) cannot reliably identify the "true" symmetry group from a problem statement without already knowing the answer.
      *   *Concession:* The view must admit that "fully specified" means "specified down to the relevant dynamical invariants," not just "specified in natural language."
      *   *Risk:* If "fully specified" requires knowing the physical dynamics that determine the probability, then PoI is doing no work; the dynamics are doing the work. PoI becomes a calculational tool for known physics, not a logical principle for ignorance.

  *   **The Immunizing Move:** Dismissing counterexamples by claiming the agent chose the "wrong group."
      *   *Critique:* How do we know it was the wrong group? Usually, because it yielded the "wrong" probability (matching neither intuition nor frequency). This makes the theory circular: The correct group is the one that gives the correct probability.
      *   *Verdict:* To avoid this, your view needs an **independent criterion for group selection** that does not rely on the resulting probability distribution. If it lacks this, the "ill-posed" defense is merely dogmatic.

  ### 3. External Dependencies

  Your position does not stand alone; it leans heavily on adjacent fields.

  *   **Physics (Statistical Mechanics):**
      *   Your view stands or falls with the justification of the **Microcanonical Ensemble**. In stat mech, we assume uniform measure over energy surfaces. Is this due to symmetry (Liouville's theorem) or ergodicity/dynamical mixing?
      *   *Dependency:* If the justification for the microcanonical ensemble requires dynamical hypotheses (e.g., Boltzmann's ergodic hypothesis) rather than pure indifference/symmetry, then your claim that symmetry *alone* resolves the paradox is weakened. Symmetry might be necessary but not sufficient.

  *   **Metaphysics (Laws and Properties):**
      *   To identify the symmetry group, one must identify the **natural properties** of the system. This connects to the *Grue* problem. Why is "green" a natural property suitable for symmetry, but "grue" is not?
      *   *Dependency:* If you cannot solve the natural properties problem, you cannot fix the parameterization for the symmetry group. Your view inherits the baggage of Natural Kind realism.

  *   **Cosmology (The Measure Problem):**
      *   In eternal inflation, we face a "measure problem" where different regularization schemes (symmetry groups) yield different probabilities for observing constants.
      *   *Dependency:* If cosmologists cannot agree on the "correct" symmetry group for the multiverse despite agreeing on the physical theory, it suggests the problem statement (the theory) does *not* fix the group. This would be a real-world instance of your "underdetermination" worry, suggesting the view is practically impotent in high-stakes contexts.

  ### 4. Ranking the Defeaters

  Here is the ranking from Fatal to Awkward, with the required state of the world for each.

  1.  **Fatal: The Empirical Divergence (with fixed description).**
      *   *Condition:* A physical setup is described exhaustively (including dynamical laws). Experts agree on the symmetry group $G$. The invariant measure predicts $P(E) = 0.5$. Repeated trials yield $P(E) \to 0.8$.
      *   *Why Fatal:* It severs the link between logical symmetry and physical chance. It proves symmetry is not a guide to truth.
      *   *Defense:* Claim the description was incomplete (hidden variables). If this move is always available, see #2.

  2.  **Fatal: The Group Underdetermination Proof.**
      *   *Condition:* A formal proof that for a class of well-defined physical problems, there exist two symmetry groups $G_1, G_2$ that are indistinguishable relative to the problem statement (same invariants, same naturalness) but yield disjoint probability measures.
      *   *Why Fatal:* It proves uniqueness is mathematically impossible, not just humanly difficult. It shows the "fully specified" condition is incoherent.

  3.  **Severe: The Borel-Kolmogorov Invariance Failure.**
      *   *Condition:* Demonstration that for standard inference problems, the conditional probabilities required for decision-making are not fixed by the joint symmetry.
      *   *Why Severe:* It limits the scope of the view. PoI + Symmetry gives you a prior, but not a full inference engine. You need extra principles for conditioning.

  4.  **Awkward: The Non-Amenability Constraint.**
      *   *Condition:* Showing that many "natural" ignorance states correspond to non-amenable groups.
      *   *Why Awkward:* It restricts the domain of applicability. You must admit PoI simply doesn't apply to certain types of total ignorance (e.g., over infinite discrete sets without structure).

  ### 5. Honest Verdict and Falsifiable Successor

  **Verdict:**
  Your position is **highly insulated**, bordering on **unfalsifiable**.
  The insulation comes from the clause: *"whenever the problem is fully specified."*
  In practice, "fully specified" functions as a retrospective label. When PoI works, the problem was "fully specified." When PoI fails (e.g., yields the wrong frequency), the problem was "ill-posed." Because there is no independent, pre-probabilistic test for whether a problem statement fixes a unique symmetry group, the view protects itself from refutation by re-describing failures as modeling errors.

  This does not necessarily make it *false*, but it makes it **methodologically vacuous** as a guide for inquiry. It tells us: "If you know the right symmetries, you get the right answer." But in epistemology, the hard part is *finding* the right symmetries when we are ignorant.

  **A Falsifiable Successor Position:**
  To make this view risk something, you must commit to a **criterion of naturalness** for symmetry groups that is independent of the resulting probabilities.

  *   *Proposal:* **The Principle of Dynamic Symmetry.**
      *   *Claim:* The correct symmetry group is not determined by the *statement* of the problem, but by the **causal/dynamical structure** of the system generating the data.
      *   *Risk:* This ties PoI to physicalism. It risks failure if we find that rational agents *should* assign probabilities based on logical symmetries even when they know the dynamics violate them (e.g., in games of strategy or pure logic puzzles).
      *   *Falsification Condition:* If an agent is rational to use a symmetry-based prior in a context where the underlying dynamics are known *not* to possess that symmetry (e.g., using a uniform prior for a biased coin because you have no evidence of the bias), then the "Dynamic Symmetry" view is false.

  *   *Alternative Proposal:* **Defeasible Symmetry.**
      *   *Claim:* Symmetry suggests a prior, but it is a **defeasible heuristic**, not a logical necessity. It can be overridden by higher-order constraints (e.g., Maximum Entropy subject to testable moment constraints).
      *   *Risk:* This abandons the "strong reading" you currently hold. It admits PoI can "misfire" even when the group is correctly identified, because the group invariance is only one constraint among many.
      *   *Falsification Condition:* If a case is found where symmetry invariance is satisfied, no other constraints apply, yet the symmetric prior is demonstrably irrational (e.g., leads to a Dutch Book in a specific betting scenario), the view falls.

  **Recommendation for your Dissertation:**
  Do not defend the "strong reading" as a logical truth. Defend it as a **normative ideal** that highlights the importance of model specification. Acknowledge that the "ill-posed" defense is available, but argue that the *work* of formal epistemology is to provide the meta-principles (like Maximum Entropy or Natural Properties) that tell us when a specification is sufficient. If you claim the specification *itself* does all the work, you risk triviality.
