prompt: |-
  I am planning a one-semester research paper in the philosophy of history, and I need a one-page proposal written from a half-formed idea of mine. The idea is this: historians and historically minded social scientists increasingly treat germs, climate shifts, and volcanic eruptions as doing explanatory work that is usually reserved for human agents, but discussions of this move tend to swing between treating it as a harmless metaphor and warning that it collapses into environmental determinism. I want to ask what conception of agency, causation, or explanatory role is actually being invoked when a non-human process is called a historical actor, and whether there is a version of that conception strong enough to do real interpretive work without erasing human decision-making. Please turn this into a proposal that states the question precisely, explains why the existing debate over environmental determinism does not already settle it, specifies a philosophical method that would make progress and why that method is preferable to an archival or purely historiographical approach, describes what a successful answer would look like and what would count as failure, and gives a realistic scope for a paper of about 6,000 words. The proposal should not try to list or assess specific secondary literature; I will supply citations myself.
