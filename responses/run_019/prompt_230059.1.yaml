answer: |-
  **Title:** Beyond Metaphor and Determinism: The Explanatory Role of Non-Human Actors in Historical Narrative

  **Research Question**
  Contemporary environmental history and historically minded social sciences increasingly attribute explanatory weight to non-human processes—pathogens, climate shifts, geological events—treating them as "actors" within historical narratives. This move generates a theoretical tension: critics dismiss it as mere metaphor, while defenders risk collapsing into environmental determinism. This paper asks: **Under what conception of causation and agency can non-human processes function as genuine historical actors without negating the explanatory necessity of human decision-making?** I seek to articulate a model of historical explanation that accommodates non-human efficacy without resorting to the binary of "human agency versus environmental constraint."

  **The Limitation of the Determinism Debate**
  The existing literature largely frames this issue as a problem of weighting: how much causal influence should be assigned to climate versus culture? This approach fails to address the underlying ontological confusion. Debates over determinism assume a zero-sum game where increasing the status of the non-human necessarily decreases the status of the human. However, the current historiographical trend suggests a structural change in how narratives are constructed, not merely a recalibration of variables. By focusing solely on the *degree* of influence, the determinism debate obscures the *kind* of explanatory work being performed. My project argues that the problem is not about how much history germs make, but what it means to say a germ "makes" history at all. Resolving this requires moving beyond the determinism framework to analyze the logic of attribution itself.

  **Methodology**
  I will employ conceptual analysis of explanatory practices rather than archival or historiographical assessment. An archival approach would verify whether a specific volcanic eruption actually caused a specific political collapse; a philosophical approach analyzes what is meant when a historian claims it did. I will examine the logical structure of arguments found in prominent works of environmental history (to be cited by the author) to isolate the implicit theory of action they rely upon. This method is preferable to pure historiography because the conflict is not empirical but categorical. Historians can agree on the data (e.g., temperature records) while disagreeing on whether a temperature change constitutes an "action." Philosophy of history is uniquely positioned to clarify the categories of "event," "agent," and "cause" that allow these disagreements to persist.

  **Criteria for Success and Failure**
  A successful outcome will be a articulated framework of "asymmetric causation" or "distributed agency" that defines the specific conditions under which a non-human process qualifies as a historical actor. This model must demonstrate how human intentionality remains relevant even when non-human forces constrain or enable it. Success looks like a dissolution of the metaphor/determinism binary: showing that non-human actors are neither merely poetic devices nor sovereign determinants.
  Failure would consist of either: (1) proving that human agency and non-human causation are logically incompatible, forcing a return to strict anthropocentrism; or (2) offering a definition of agency so broad that it becomes trivial (e.g., "everything is an actor"), thereby losing explanatory power.

  **Scope and Feasibility**
  For a 6,000-word paper, the scope must be tightly constrained. I will not attempt a survey of environmental history. Instead, I will focus on the philosophical coherence of the "non-human actor" concept. The paper will proceed in four sections: (1) a diagnosis of the metaphor/determinism impasse; (2) an analysis of the concept of "agency" in historical explanation; (3) a proposal for a revised causal model (drawing on interventionist or pluralist accounts of causation); and (4) an application of this model to a single paradigmatic case (e.g., the role of pathogens in colonial encounters) to test its viability. This ensures the paper remains a work of philosophy *of* history, rather than a work of history itself.
