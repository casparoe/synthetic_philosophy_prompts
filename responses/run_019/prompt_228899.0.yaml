answer: |-
  "It's not metaphysics, Marcus, it's bookkeeping." Priya swirled her pint, eyeing the seminar notes between them. "You're treating verb endings like ontology. It's just what information we hold fixed."

  Marcus leaned forward, elbows on the sticky table. "Try telling that to the Count's estate. Look at the murder case. 'If the butler didn't poison the Count, someone else did.' You accept that. But 'If the butler hadn't poisoned the Count, someone else would have'? You reject that. Why?"

  "Because of what we hold fixed," Priya said. "In the indicative, we hold fixed that the Count is dead. We know he was poisoned. So if not the butler, logically, someone else. In the counterfactual, we unwind the poisoning. We ask what happens in that scenario. No backup killer exists."

  "That 'unwinding' is the point," Marcus insisted. "The indicative tracks our knowledge state. The counterfactual tracks nearby worlds. They're different engines. If they were the same, why does the card game break your view? I don't know the card. You do. I say, 'If it's red, I lose.' You say, 'If it's red, I win.' Both are felicitous."

  "Exactly," Priya said. "Indicatives are epistemic. They relative to the speaker's info."

  "But try the counterfactuals," Marcus countered. "'If it had been red...' That doesn't shift with your ignorance. It depends on the shuffle. And consider 'might'. 'If he'd bet on red, he might have won.' That's compatible with losing. But 'If he'd bet on red, he wouldn't have won' denies it. If indicatives were just pragmatic shifts of one conditional, why do counterfactuals have this modal tension? You can't assert 'If he bets, he might win' and 'If he bets, he won't' simultaneously."

  Priya paused, tracing the condensation on her glass. "Okay, I'll concede the 'would' carries weight. It implies a structural connection in the world, not just a gap in my knowledge. My view struggles to explain why 'might' and 'would' counterfactuals clash so hard without invoking different truth conditions. It feels like you're right that the counterfactual reaches out to how the world *could* be, not just what I know."

  "And I'll concede this," Marcus said, tapping the table. "Indicatives don't behave like truth-apt statements. If they were, one of us in the card game would be wrong. But we're both right relative to our info. So indicatives might just be assertability conditions, while counterfactuals are truth-conditional. But that still means two different beasts. You can't reduce one to the other if one lacks truth values."

  "Or one beast with two modes," Priya countered. "But fine. We need a test case. Not the Count, not the cards. Something where the antecedent is unknown but settled."

  "The coin in the pocket," Marcus said. "It's either heads or tails, settled now, but we don't know."

  "Right. Indicative: 'If it's heads, I win.' Counterfactual: 'If it had been heads, I would have won.'"

  "If the coin is actually tails," Marcus said, "Your indicative is problematic if it requires truth. But the counterfactual seems false regardless of what we know, because the world is fixed."

  "No," Priya said. "If we don't know the outcome, the counterfactual feels unjustified. But the indicative feels fine. That's the wedge."

  "There's our test," Marcus said. "Find a case where the antecedent is settled fact but unknown to speakers. If the indicative shifts with knowledge and the counterfactual stays fixed to the fact, I win. If both shift, you win."

  "Deal," Priya said. "Next round?"
