answer: |-
  # The Welfare Compass: A Decision Tree

  **Instructions:** This instrument is designed to locate your position on welfare conditionality without using political labels. There are no right or wrong answers. Begin at **Node 1**. Read the two statements. Choose the one that feels *more* true to you, even if neither is perfect. Follow the arrow to the next Node indicated by your choice. Continue until you reach a **Position**.

  ---

  ### Node 1: The Foundation
  *Tests Fault Line: Entitlement (Need vs. Contribution)*

  **A.** The main point of welfare is to stop people from falling into destitution. If someone is hungry or homeless, the reason doesn't matter as much as the fix.
  **B.** The main point of welfare is to help people bridge a gap while they get back on their feet. It is a temporary hand-up, not a permanent floor.

  *   **Choose A:** Go to **Node 2**.
  *   **Choose B:** Go to **Node 3**.

  ---

  ### Node 2: The Limit of Tolerance
  *Tests Fault Line: Function of Condition (Unconditional vs. Gatekeeping)*
  *Case: Deliberate Fraud*

  **A.** Even if someone deliberately fakes an illness to claim benefits, cutting them off entirely creates more problems than it solves. They still need support, perhaps managed differently.
  **B.** If someone deliberately cheats the system while able to work, they have broken the social contract. They should face strict penalties, even if it means temporary hardship.

  *   **Choose A:** Go to **Node 4**.
  *   **Choose B:** Go to **Node 5**.

  ---

  ### Node 3: The Reason for Struggle
  *Tests Fault Line: Attribution (Structure vs. Choice)*
  *Case: Single Parent / Childcare*

  **A.** If a single parent turns down a job because they can't afford childcare, the system has failed them. We shouldn't sanction them for a lack of nursery spots.
  **B.** Everyone faces constraints. If a job is available, the parent must find a way to make it work, perhaps by shifting family support or adjusting hours, before claiming full benefits.

  *   **Choose A:** Go to **Node 6**.
  *   **Choose B:** Go to **Node 7**.

  ---

  ### Node 4: The Purpose of Rules
  *Tests Fault Line: Function (Support vs. Surveillance)*
  *Case: Undisclosed Mental Health*

  **A.** If someone misses an appointment because of anxiety they didn't disclose, the system should have made it easier to tell us. The rule should bend to help them engage.
  **B.** Rules must be clear for everyone. If they didn't disclose the problem beforehand, they must accept the penalty. Exceptions encourage people to hide information.

  *   **Choose A:** **POSITION 1**
  *   **Choose B:** **POSITION 2**

  ---

  ### Node 5: The Goal of Penalties
  *Tests Fault Line: Function (Discipline vs. Deterrence)*

  **A.** Penalties are mainly to stop other people from trying to cheat. Once the cheater is caught, there is no need to make an example of them beyond recovering the money.
  **B.** Penalties are to discipline the claimant. Hardship teaches the lesson that work is preferable to benefits, even for those who slipped through the cracks.

  *   **Choose A:** **POSITION 3**
  *   **Choose B:** **POSITION 4**

  ---

  ### Node 6: Who Bears the Burden?
  *Tests Fault Line: Entitlement (Institutional vs. Individual)*

  **A.** We should place binding conditions on employers to provide flexible hours or on the state to provide childcare, rather than on the parent to find a solution.
  **B.** Ultimately, the claimant is responsible for their own livelihood. The state can help, but the obligation to secure income rests with the individual.

  *   **Choose A:** **POSITION 5**
  *   **Choose B:** **POSITION 6**

  ---

  ### Node 7: The Definition of Ability
  *Tests Fault Line: Attribution (Health vs. Will)*
  *Case: Disability Improvement*

  **A.** If a disability improves slightly but not enough for steady work, the person is still structurally excluded. They should not be pushed into a job they will lose in months.
  **B.** Any improvement in health is a step toward independence. The system should nudge them toward partial work, even if it's not a full career, to build momentum.

  *   **Choose A:** **POSITION 5** (Merges with Node 6A)
  *   **Choose B:** **POSITION 6** (Merges with Node 6B)

  ---

  ### The Six Positions (Leaves)

  **POSITION 1: The Safety Net (Unconditional Need)**
  *Plain Language:* Help should be unconditional because need alone settles the question.
  *Logic:* You prioritize preventing destitution over policing behavior. You believe rules often punish vulnerability (like undisclosed mental health) rather than catching cheats. You view welfare as a human right, not a transaction.

  **POSITION 2: The Supportive Partner (Enablement)**
  *Plain Language:* Conditions are acceptable only when they function as support rather than as punishment or surveillance.
  *Logic:* You accept rules, but only if they help people navigate the system. You distinguish between inability (mental health) and unwillingness. You want a welfare office that acts like a social worker, not a police officer.

  **POSITION 3: The Fair Exchange (Reciprocity)**
  *Plain Language:* Help must be earned through demonstrated effort, but punishment should be proportional.
  *Logic:* You believe benefits are a temporary contract. Cheating breaks that contract and warrants penalty, but the goal is fairness, not suffering. You want to stop fraud, but you don't believe in punishing people just to make a point.

  **POSITION 4: The Gatekeeper (Discipline)**
  *Plain Language:* The system must be strict to ensure work is always more attractive than welfare.
  *Logic:* You are concerned that welfare creates dependency. You see conditions as a necessary discipline to push people into the labor market. You are willing to tolerate some hardship to maintain the incentive to work and tell the truth.

  **POSITION 5: The Architect (Institutional Responsibility)**
  *Plain Language:* The binding conditions belong on employers and institutions rather than on claimants.
  *Logic:* You believe unemployment is often a structural failure, not a personal one. You argue that if we demand people work, we must mandate that jobs fit their lives (childcare, health limits). You place the burden of compliance on the labor market, not just the worker.

  **POSITION 6: The Pragmatist (Individual Responsibility)**
  *Plain Language:* People must adapt to the market as it is, while the state provides a basic ladder.
  *Logic:* You acknowledge structural barriers (like childcare) but believe individuals must ultimately overcome them. You support a mix of support and conditionality. You are distinct from the Gatekeeper because you recognize health barriers, but distinct from the Architect because you place the final onus on the claimant.

  ---

  ### Scoring Key & Logical Architecture

  This instrument maps three fault lines. Your path through the tree reveals your coordinates on each.

  1.  **Fault Line 1: Entitlement (Node 1)**
      *   *Path A:* Need-Based (Leads to Positions 1, 2, 3).
      *   *Path B:* Contribution-Based (Leads to Positions 4, 5, 6).
  2.  **Fault Line 2: Attribution (Nodes 3 & 7)**
      *   *Structural:* Problems are caused by barriers (Leads to Positions 1, 2, 5).
      *   *Individual:* Problems are caused by choices/effort (Leads to Positions 4, 6).
  3.  **Fault Line 3: Function of Condition (Nodes 2, 4, 5)**
      *   *Support/Unconditional:* Rules help or shouldn't exist (Leads to Positions 1, 2).
      *   *Discipline/Deterrence:* Rules enforce behavior (Leads to Positions 3, 4, 6).

  **Diagnosing Empty Combinations**
  During the design of this tree, several logical combinations were found to be "empty" (no leaf exists there). These are omitted from the results because they represent incoherent or psychologically unstable worldviews.

  *   **The Punitive Structuralist (Empty):** This position would argue that *structural* factors cause poverty (Node 6A/7A) but that *punitive* conditions are the best solution (Node 5B).
      *   *Diagnosis:* **Incoherent.** If you believe the system is broken, punishing the victim for the system's failure is logically inconsistent. People who hold this view usually shift to blaming the individual upon closer questioning.
  *   **The Laissez-Faire Individualist (Empty):** This position would argue that unemployment is purely a *choice* (Node 3B) but that there should be *no conditions* (Node 2A).
      *   *Diagnosis:* **Unattractive/Rare.** If you believe people are choosing not to work, you rarely support giving them money without strings. This combination usually collapses into "Abolish Welfare" (not a welfare position) or "Strict Conditionality."
  *   **The Blind Universalist (Empty):** This position would support Unconditional Help (Node 2A) but also support Strict Penalties for Fraud (Node 5B).
      *   *Diagnosis:* **Unexplored/Unstable.** While some argue this, it usually fractures under the weight of the Fraud case. If need is the only metric, fraud is irrelevant. If fraud matters, need is not the only metric.

  **Limitations & Indistinguishable Leaves**
  No instrument is perfect. The following pairs are difficult to separate with only eight questions:

  *   **Position 2 (Supportive Partner) vs. Position 6 (Pragmatist):** Both accept conditionality but oppose harsh punishment. A user might land on either depending on how they interpreted the "Mental Health" case.
      *   *Flag:* These positions are neighbors. The key difference is whether they see the state as a *partner* (Position 2) or a *manager* (Position 6). This quiz may group them together if the user's views are moderate.
  *   **Position 5 (Architect) vs. Position 1 (Safety Net):** Both focus heavily on structural barriers.
      *   *Flag:* Position 1 wants money with no strings. Position 5 wants strings, but on employers. If a user supports both, the tree forces a choice at Node 6 that might feel artificial. In reality, many people hold both views simultaneously.

  **Note on the Cases:**
  *   **Fraud Case:** Used to separate the *Safety Net* from everyone else. Even those who want support usually draw the line at deliberate theft.
  *   **Mental Health Case:** Used to separate *Supportive* conditions from *Disciplinary* conditions. It tests whether rules are for navigation or compliance.
  *   **Single Parent Case:** Used to separate *Architects* from *Pragmatists*. It tests who must bend: the labor market or the worker.
  *   **Disability Case:** Used to test the definition of "Work." It separates those who see work as *any income* from those who see it as *sustainable livelihood*.
