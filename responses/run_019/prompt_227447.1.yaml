answer: |-
  The sun hung low over the harbor, glinting off the twin hulls of the *Kallipos* and the *Eudoxus*. Elara leaned against the bollard where the *Kallipos* was moored. Silas stood opposite, gesturing toward the *Eudoxus*.

  "It is a beautiful trick of the light," Silas said. "But look closely. The *Kallipos* is over there. Every original timber, every bronze pin, every fiber of the sail now constitutes the hull across the water. You cannot deny the matter."

  "I deny nothing about the matter," Elara replied. "I deny that the matter is the ship. The *Kallipos* is here. It has never left this slip. It has never ceased to be seaworthy. The crew sailed her yesterday, they sail her today, and they will sail her tomorrow. Identity is a thread of continuity, not a pile of wood."

  "But the thread is woven from different stuff now," Silas countered. "Consider the swap. If the shipwright had removed every plank from the *Kallipos* and installed them into the *Eudoxus* frame in a single day, you would concede the identities swapped. The *Kallipos* would be where the *Eudoxus* sits. Why does stretching the process over months change the metaphysics? Does time possess alchemical properties that preserve identity where speed destroys it?"

  "Time doesn't preserve it; continuity does," Elara said. "In your instantaneous swap, the *Kallipos* is disassembled. Function ceases. Here, there is no moment where the *Kallipos* failed to be a ship. Can you name the day it died? Was it Tuesday, when the starboard oar was swapped? Thursday, when the mainsail changed? If you cannot pinpoint the death, you cannot claim the corpse is across the dock."

  Silas paced the plank. "That is the Sorites trap, and I see it. If one plank doesn't kill the ship, nor does the second. But the induction leads to an absurdity. We agree that if we swap *all* planks instantly, the identity follows the matter. Yet if we swap them one by one, you say identity stays with the form. This implies that the *mode* of rearrangement dictates ontology. That seems perverse. The end state is identical in both scenarios: Hull A contains Matter B, Hull B contains Matter A. Why should the history of assembly grant sovereign rights to the hull shape over the material constitution?"

  "Because ships are functional kinds, not mereological sums," Elara insisted. "But let us test this. You claim the *Kallipos* is across the dock. I claim it is here. Let us taboo the phrase 'the same ship.' It carries too much metaphysical baggage. Let us describe the situation operationally. Who does the harbormaster charge? Which vessel's logbook continues the record? If a sailor who served on the original *Kallipos* returns in ten years, which hull does she salute?"

  Silas nodded slowly. "A fair constraint. The harbormaster charges the hull registered as *Kallipos*. The logbook stays with the hull, not the timber. The sailor salutes the hull she sailed on, because muscle memory recognizes the rigging layout, not the grain of the wood. Operationally, you are right. The institutional identity tracks the continuous hull."

  "Then the disagreement dissolves?" Elara asked.

  "Not entirely," Silas said. "Operationalism solves the administrative problem, but not the metaphysical one. Consider modal properties. Suppose next year the shipwright swaps the parts back. Matter returns to original hulls. On your view, the *Kallipos* remained the *Kallipos* throughout, so nothing happened. On my view, the *Kallipos* traveled across the dock and returned. If we treat ships as material constitutions, we can track the matter through the swap. If we treat them as continuants, the matter's journey is irrelevant. There is a substantive disagreement about counterfactuals. If the *Eudoxus* hull sinks tomorrow, does the *Kallipos* cease to exist? For you, yes. For me, no—the *Kallipos* matter is still floating across the dock."

  Elara frowned. "So the crux is whether 'ship' refers to a career of a structure or the career of a collection of parts. If I say the *Kallipos* sinks, I mean the functional unit is lost. If you say it sinks, you mean the matter is submerged."

  "Precisely," Silas said. "And neither of us is wrong about the facts. We are disagreeing about which career warrants the name. But I must admit, your pressure on the Sorites is potent. If I insist identity follows matter, I must accept that identity is fragile. A threshold exists where replacing one more plank flips the designation. That seems arbitrary. I cannot explain why the 500th plank swaps the soul of the ship while the 499th does not."

  "And I must admit," Elara said, "your pressure on the instantaneous swap is devastating. If I concede that instant replacement swaps identity, I concede that time is the only barrier to destruction. That makes identity seem like a trick of perception rather than a fact of the world. If the end state is materially identical, why should the path matter?"

  They stood in silence as the tide lapped against the pilings.

  "Let us summarize," Silas said. "Your strongest argument is that identity requires a continuous functional history. To claim the *Kallipos* moved across the dock is to claim a ship can cease to exist without any observable break in service, which renders 'existence' undetectable. You force me to admit that if I cannot name the moment of death, I cannot claim a death occurred."

  Elara nodded. "And your strongest argument is that material constitution is the only objective ground for identity. To claim the *Kallipos* remains here despite total material replacement is to claim that form supersedes substance. You force me to admit that if I accept gradual change, I must accept that two materially distinct objects can be identical to a third, violating the transitivity of identity if the matter is swapped back and forth indefinitely."

  "Then we remain at an impasse," Silas said, "but a clarified one."

  "Not an impasse," Elara corrected. "A distinction. You track the matter. I track the career. We are not looking at the same thing."

  "Then let us drink to the *Kallipos*," Silas said, raising a flask. "Whichever one she is."

  "To the *Kallipos*," Elara agreed. "Wherever she lies."
