  *(Refining the "Who Goes First" part)*: Priya volunteering to go first is actually *generous* if she expects to leave, but *selfish* if she thinks the grant might disappear. Actually, usually, people want the benefit *now*. If she volunteers to go first, she gets the benefit now. Wait, if she volunteers to go first, *she* gets the patch this year. That means the *user* waits. So Priya gets the immediate gratification. The user is right to be suspicious. I need to point out that "going first" carries the advantage of certainty.

