  A colleague and I have been arguing about whether the two-envelope paradox is fully dissolved once you point out that it relies on something like an improper uniform prior over possible amounts, or whether something still remains unexplained. In the standard setup, an agent faces two sealed envelopes, one containing twice as much money as the other, and picks one. Before opening it, symmetry says neither envelope is preferable. After seeing the amount x in the chosen envelope, the agent is tempted by this reasoning: the other envelope contains either 2x or x/2 with equal probability, so its expected value is 5x/4, and she should switch no matter what x she saw. The familiar reply is that this cannot be true for every observable amount under a proper prior with finite expectation. I want a case that makes that reply precise: how close can a proper prior come to the original paradox, and where exactly does the remaining information reside?

  Please construct a two-envelope thought experiment that comes as close as possible to the original paradox while keeping the prior proper. The prior over the smaller amount must be explicit and proper, with a finite support of at least five possible pairs of amounts, ordinary monetary values, linear utility in money, an expected-value-maximizing agent, and no infinite expectations. The amounts should be laid out so that, for most observations, the agent's uncertainty about whether she holds the smaller or the larger envelope is doing real work, rather than the amount simply revealing its role. For every amount the agent might observe with positive probability except one, the conditional expected value of the other envelope must be strictly greater than the observed amount, so the agent would switch after looking. For exactly one observable amount, the conditional expected value of the other envelope must be strictly less than the observed amount, so the agent would not switch. The switching policy must fall out of the conditional expectations; do not stipulate the verdicts. After stating the case, demonstrate that it meets each specification by working through the conditional calculations for a low amount, a mid-range amount, and the exceptional amount, and say why the remaining amounts fall on the claimed side of the inequality.

  Finish with a diagnostic note. Identify the structural feature that forces the exceptional amount to exist, explain what happens when that feature is removed — for instance, if the support is made unbounded or the prior improper — and say how a defender of the original switch-for-every-amount reasoning would attack your case as a rigged or negligible edge case, and whether you think that attack has force.
