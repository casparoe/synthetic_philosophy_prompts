answer: |-
  1. **The Prerequisite Idea: Source Code Transparency**
  Before presenting either scenario, you must secure the concept of **Subjunctive Dependence via Algorithmic Transparency**. Students comfortable with causal graphs will instinctively model the predictor as a node in the past that is causally disconnected from their current decision node. This leads them to treat the prediction as a fixed fact (like a fossil) rather than a logical consequence of their current reasoning process.

  You must establish that the predictor does not "guess" based on past behavior; it simulates the agent's **decision procedure** (source code). The object of prediction is not the action $A$, but the function $f(O) \rightarrow A$. If the agent's code is deterministic, the predictor's output is logically entailed by the agent's code. This transforms the problem from "How do I act given a fixed past?" to "Which function, if evaluated, yields the highest utility?" Without this shift, both scenarios remain magic tricks where the predictor "cheats." Frame this not as metaphysics, but as a constraint on the computational environment: the agent and predictor share access to the same source repository.

  2. **Session Ordering**
  **Order:** Counterfactual Mugging (CM) first, then XOR Blackmail (XOR).

  **Rationale:**
  *   **Counterfactual Mugging (The Updatelessness Push):** Start here because it uses objective probability (a fair coin). This isolates the core tension: *Should I maximize expected utility conditional on my current observation (Tails), or conditional on the policy selection (Before the Flip)?* In CM, the observation (Tails) is probabilistically independent of the action (Pay/Don't). This makes it the cleanest environment to introduce the **Ex-Ante vs. Ex-Post Expected Utility** distinction. It forces the student to admit that maximizing utility *after* updating on the coin flip leads to lower utility *before* the flip.
  *   **XOR Blackmail (The Correlation Push):** Introduce this second to stress-test the policy framework. In XOR, the observation (The Letter) is *not* independent of the action; the letter only arrives *because* of the policy. This addresses the misconception that "observations are just data." It shows that in the presence of a predictor, observations are **endogenous** to the decision procedure.
  *   **Intermediate Notions:**
      1.  **Policy as a Function:** Between the two cases, formalize the decision not as choosing $A \in \{\text{Pay}, \text{Don't}\}$ but choosing $f \in \{ \text{AlwaysPay}, \text{NeverPay}, \text{Conditional} \}$.
      2.  **The Decision Node:** Distinguish between Node 0 (Policy Selection, before observation) and Node 1 (Action Execution, after observation). CM shows Node 0 dominates Node 1 for utility. XOR shows Node 0 determines the probability of reaching Node 1.

  3. **The Carrying Example: The Transparent Policy Protocol**
  Do not use the standard narrative versions (coins/termites) as distinct examples. Instead, define a **simplified common core** that serves as the spine for the entire session. This prevents students from attributing the result to "coins" or "termites" rather than the decision structure.

  **The Core Protocol:**
  *   **Agent:** Submits a function $f: \text{Observation} \rightarrow \text{Action}$.
  *   **Predictor:** Simulates $f$.
  *   **World State ($W$):** Generated (Coin Flip or Termite Presence).
  *   **Observation ($O$):** Generated based on $W$ and the output of $f(O)$.
  *   **Payoff:** Determined by $W$, $O$, and the actual Action $A = f(O)$.

  **Required Features:**
  *   **Perfect Prediction:** The simulation is exact. No noise.
  *   **One-Shot:** Explicitly rule out reputation or future rounds.
  *   **Mixed-Upside:** The payoff structure *must* reward the agent in a branch they observe to be false (CM: Heads payoff when Tails observed) or penalize them for avoiding the observation (XOR: Letter arrives only if you pay).
  *   **Feature to Lack:** Do not include "causal arrows" from Action to State. The link is via the Function $f$. This prevents CDT objections about "changing the past."

  **Pedagogical Use:** Instantiate this protocol first with CM parameters (Coin, Request), then swap to XOR parameters (Termites, Letter) without changing the underlying math. This demonstrates that the "trick" is in the protocol, not the story.

  4. **Misconception Map**

  | Misconception | When to Address | How to Address |
  | :--- | :--- | :--- |
  | **"The predictor is impossible."** | **Prerequisites.** | Do not argue metaphysics. Frame it as a "Source Code Review." If you submit code to a server, the server can run it. The problem is about rational agency under transparency, not prophecy. |
  | **"This is just Newcomb's Problem relabeled."** | **After CM Instantiation.** | Highlight the difference: In Newcomb, you choose between Box A and B. In CM, you are asked for money *after* the bad outcome is known. Newcomb is about correlation between action and state; CM is about caring about counterfactual branches you know you aren't in. |
  | **"I would pay only for reputation."** | **Before CM Instantiation.** | Hard-constrain the scenario: "You are anonymous, this is the only interaction, and the predictor vanishes afterward." If they still hesitate, ask: "If you could pre-commit before the coin flip, would you? Why not act on that commitment now?" |
  | **"XOR is just correlation, CDT is right."** | **During XOR Instantiation.** | Show the math. CDT says $P(\text{Termites} | \text{Pay}) = P(\text{Termites})$. This is false in this protocol because the Letter's existence depends on $f$. The correlation is induced by the policy selection. Address by pausing and drawing the graph where $f$ is a parent to both Observation and Action. |
  | **"The two problems are the same."** | **Closing Synthesis.** | Acknowledge they are structurally isomorphic (both rely on the Transparent Policy Protocol) but target different failures. CM targets **Conditional Expected Utility** (updating on observations). XOR targets **Causal Independence** (assuming observations don't depend on policies). They jointly establish that the *Policy* is the only stable locus of control. |

  5. **Closing Check of Understanding**
  **Exercise:** "The Biased Mugging."
  Present a variant of the Counterfactual Mugging carrying example.
  *   Predictor flips a coin that is 99% Tails, 1% Heads.
  *   Tails: Asks for \$100.
  *   Heads: Gives \$10,000 *if* predicted you would pay on Tails.
  *   You observe Tails.
  *   **Question:** Do you pay? Calculate the Expected Utility (EU) at the **Policy Selection Node** (before the flip) for the policy "Pay if Tails" vs. "Don't Pay if Tails."

  **Correct-but-Shallow Answer:** "Yes, I pay. Because I should follow the policy that maximizes utility overall." (This shows they memorized the rule but might still feel the tension of losing \$100 in the actual branch).

  **Correct-and-Deep Answer:** "I pay. At the Policy Selection Node, the EU of 'Pay if Tails' is $(0.01 \times 10,000) + (0.99 \times -100) = \$1$. The EU of 'Don't Pay' is \$0. Even though I know I am in the Tails branch (Ex-Post), the decision was effectively made at the Policy Node (Ex-Ante). Refusing to pay now contradicts the optimization step that made the positive EV possible." (This demonstrates they have relocated the "choice point" from the action to the policy).

  6. **Conscious Omission List**
  Explicitly decline to cover the following, stating that doing so would obscure the core intuition with formal machinery:

  *   **Formal Acronyms (UDT, FDT, TDT):** Do not use these labels. They invite students to categorize the theory rather than understand the argument. Refer only to "Policy-Based Decision Making."
  *   **Logical Counterfactuals:** Do not dive into how to compute counterfactuals for logical facts (the specific technical hurdle of XOR). Treat the predictor's simulation as a black box that works. The goal is to justify *why* we care about the counterfactual, not *how* to compute it formally.
  *   **Reflective Oracles / Fixed Points:** Omit the mathematical machinery required to make the predictor consistent in self-referential cases.
  *   **Rationale for Omission:** State clearly: "We are omitting the formal machinery to focus on the *normative* shift. Whether you call it Updateless or Functional Decision Theory matters less than recognizing that the expected utility calculation must be performed before the observation is updated. Adding the formalism now would allow you to solve the equations without accepting the premise."

  This boundary reinforces the main point: the session is about **where** you maximize utility (the node), not **how** you compute the counterfactuals (the math).
