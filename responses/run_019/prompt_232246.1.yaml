answer: |-
  # Distributive Ethics: A Diagnostic Tree

  ## Introduction
  This handout is designed to help you locate your own intuitions within the logical space of distributive justice. Rather than asking you to select a label, it presents a series of concrete allocation problems. Your verdicts on these cases will route you to a specific theoretical position.

  Please answer the questions sequentially. For each scenario, choose the option that best reflects your *all-things-considered* moral judgement, even if the choice feels counter-intuitive.

  ---

  ## Part 1: The Decision Tree

  ### Node 1: The Leveling-Down Case
  **Scenario:** In Society A, everyone has a well-being level of 50. In Society B, half the population has 100 and half has 50. The average well-being is higher in B, and no one in B is envious or oppressed. However, A is perfectly equal, whereas B is not.
  **Question:** Is Society A better than Society B *in at least one respect* (even if not overall) simply because it is more equal, despite the fact that making them equal would require lowering the better-off without helping the worse-off?
  *   **(Yes)** $\rightarrow$ Go to **Node 2**.
  *   **(No)** $\rightarrow$ Go to **Node 3**.

  ### Node 2: The Currency of Equality (Telic vs. Relational)
  **Scenario:** Consider two ways to achieve equality. In Option X, everyone has equal resources but live in a caste system where some are socially degraded. In Option Y, everyone has slightly unequal resources but relate to one another as genuine social equals with equal status.
  **Question:** If you must choose, is the pattern of resource distribution (Option X) more important than the quality of social relations (Option Y)?
  *   **(Pattern matters more)** $\rightarrow$ **Leaf A: Telic Egalitarianism**.
  *   **(Relations matter more)** $\rightarrow$ **Leaf B: Relational Egalitarianism**.

  ### Node 3: The Sufficiency Threshold
  **Scenario:** We have resources to help either Person P (who is destitute, below a decent minimum) or Person Q (who is comfortably well-off). In a second case, both P and Q are comfortably well-off, but P is slightly worse off than Q.
  **Question:** Is the moral urgency to help P in the first case significantly stronger than in the second case, such that above the 'decent minimum', being worse off no longer commands special priority?
  *   **(Yes, priority vanishes above the threshold)** $\rightarrow$ **Leaf C: Sufficientarianism**.
  *   **(No, priority is continuous)** $\rightarrow$ Go to **Node 4**.

  ### Node 4: Strict Priority (Leximin)
  **Scenario:** We can give a tiny benefit to the single worst-off person in society, or a massive benefit to millions of moderately well-off people. The worst-off person will remain the worst-off regardless of the choice.
  **Question:** Does the tiny benefit to the worst-off person *always* trump the massive aggregated benefits to the better-off, regardless of the size of the gap?
  *   **(Yes, the worst-off always win)** $\rightarrow$ **Leaf D: Leximin**.
  *   **(No, aggregation can outweigh priority)** $\rightarrow$ Go to **Node 5**.

  ### Node 5: The Source of Weight (Utilitarianism vs. Prioritarianism)
  **Scenario:** Imagine a currency (e.g., a specific medical treatment) that produces the *exact same amount of happiness* for a wealthy person as for a poor person (no diminishing marginal utility). We have a fixed supply.
  **Question:** Should we distribute this currency equally to favour the poor, or are we indifferent between giving it to the rich or the poor since the total happiness produced is identical?
  *   **(Indifferent; maximise total sum)** $\rightarrow$ **Leaf E: Utilitarianism**.
  *   **(Favour the poor; moral weight matters)** $\rightarrow$ **Leaf F: Prioritarianism**.

  ---

  ## Part 2: The Positions (Leaves)

  | Leaf | Position | Diagnostic Path | The Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Telic Egalitarianism** | Node 1 (Yes) $\rightarrow$ Node 2 (Pattern) | It implies that a world where everyone is equally miserable is, in one respect, better than a world where some are happy and others less so. |
  | **B** | **Relational Egalitarianism** | Node 1 (Yes) $\rightarrow$ Node 2 (Relations) | It struggles to condemn extreme material inequality if, hypothetically, it did not impinge on social status or democratic relations. |
  | **C** | **Sufficientarianism** | Node 1 (No) $\rightarrow$ Node 3 (Yes) | It implies that we should ignore a gap between the super-rich and the merely rich, even if that gap is astronomically large. |
  | **D** | **Leximin** | Node 1 (No) $\rightarrow$ Node 3 (No) $\rightarrow$ Node 4 (Yes) | It forbids making everyone else vastly better off if doing so denies a trivial gain to the single worst-off individual. |
  | **E** | **Utilitarianism** | Node 1 (No) $\rightarrow$ Node 3 (No) $\rightarrow$ Node 4 (No) $\rightarrow$ Node 5 (Indifferent) | It implies that a vast sum of trivial pleasures for the well-off can morally outweigh the relief of severe agony for the few. |
  | **F** | **Prioritarianism** | Node 1 (No) $\rightarrow$ Node 3 (No) $\rightarrow$ Node 4 (No) $\rightarrow$ Node 5 (Favour Poor) | It requires us to prioritise the worse-off even in cases where they are responsible for their own predicament through reckless choices. |

  ---

  ## Part 3: Analysis of the Logical Space

  ### 1. Unoccupied or Unstable Regions
  The decision tree maps the stable positions in contemporary debate. Several logical combinations remain unoccupied:

  *   **Leveling-Down Affirmative + Aggregation Permissive:** A view that holds equality is intrinsically valuable (Node 1: Yes) but allows the worse-off to be sacrificed for the greater good (Node 4: No).
      *   *Diagnosis:* **Unattractive.** This position accepts the cost of leveling down without gaining the protective shield for the worse-off that usually motivates egalitarianism. It is rarely defended.
  *   **Sufficientarianism + Leveling-Down Affirmative:** A view that cares about thresholds (Node 3: Yes) but also thinks equality above the threshold is intrinsically valuable (Node 1: Yes).
      *   *Diagnosis:* **Unexplored/Pluralist.** This is not incoherent, but it merges two distinct rationales. Most sufficientarians reject telic equality to avoid the leveling-down objection entirely.
  *   **Relational Egalitarianism + Pure Distributive Verdicts:** A view that claims to be purely relational but offers verdicts on pure resource distribution without reference to status.
      *   *Diagnosis:* **Incoherent.** Relational egalitarianism is defined by its focus on social relations; if it offers verdicts based solely on resource patterns, it collapses into Telic Egalitarianism.

  ### 2. Inseparable Leaves and Theoretical Caveats

  **Telic vs. Relational Egalitarianism**
  *   **Can they be separated by distributional cases?** Strictly speaking, **no**. On many pure resource allocation cases (e.g., "Should we tax the rich to help the poor?"), Telic and Relational egalitarians will often vote identically.
  *   **The Separating Question:** Node 2 attempts to separate them by asking about *social status* versus *patterns*. However, a sophisticated Telic Egalitarian might argue that status *is* a good to be distributed equally. The true distinction is meta-ethical: Telic egalitarians value the *pattern* of distribution; Relational egalitarians value the *nature of human interaction*. If your group members find Node 2 difficult, it is because these views often converge in practice despite diverging in theory.

  **Utilitarianism vs. Prioritarianism**
  *   **The Concave Transformation Issue:** Node 5 assumes we can distinguish between 'well-being' (the moral currency) and 'happiness' (the psychological currency). Standard Utilitarianism often employs a concave utility function (diminishing marginal utility of income), which mimics Prioritarianism in practice.
  *   **The Separating Question:** To separate them, Node 5 stipulates a case of *constant marginal utility*. If a member supports redistribution even when the rich gain as much *utility* from the resource as the poor, they are a Prioritarian. If they become indifferent, they are a Utilitarian. Be warned: many self-described Utilitarians are actually Prioritarians in disguise, as they endorse redistribution for moral reasons, not just empirical diminishing returns.

  ### 3. A Note on the Difference Principle
  You will notice **John Rawls's Difference Principle** is not a distinct leaf on this tree.
  *   **Why?** The Difference Principle is a political conception of justice focused on 'primary goods' (rights, liberties, opportunities, income) rather than well-being.
  *   **Where does it sit?** In terms of distributive logic, it is structurally identical to **Leximin (Leaf D)** with a Pareto efficiency constraint. It says: maximise the position of the worst-off, *unless* an inequality makes them even better off.
  *   **Honest Placement:** If you chose Leaf D (Leximin), you are closest to the Difference Principle, provided you accept that 'well-being' should be measured in terms of social primary goods rather than welfare. It sits slightly outside this tree because Rawls explicitly rejects welfarism (the metric used in Nodes 1, 3, 4, and 5).

  ### 4. Guidance for Discussion
  When discussing your results, bear in mind that this tree sorts you by *verdicts*, not *justifications*. Two members might arrive at **Prioritarianism** via different routes (e.g., one via religious duty, one via secular rationality). Conversely, two members might arrive at different leaves despite sharing a broad political outlook, perhaps because they weigh the 'Leveling-Down' intuition differently. The value of this exercise is not to prove one view correct, but to clarify exactly where your intuitions diverge from your neighbours'.

  ---
  *Prepared for the Distributive Ethics Reading Group. Please bring your completed path to the next session.*
