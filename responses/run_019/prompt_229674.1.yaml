prompt: |-
  ok so i've ended up as the person who has to pick where my workplace giving campaign sends its money this year, and the more i read the more i think the arguments are just people smuggling in different hidden checklists. one guy says the only thing that matters is how big the problem is and how many people are affected, so we should go after the biggest problem anywhere, which he thinks is maybe nuclear war or future people. another says a cause only counts if your dollar does something you can measure in the next two years, so by that test we should fund deworming pills or bednets. a third says all of that is backwards because a problem that's already famous and well funded, like cancer, is automatically a worse place to put money than something nobody is touching, even if the nobody-is-touching problem is smaller. and then there's the damn food bank down the street that i know is real because i see the line every morning, versus the malaria thing where i have to just trust a spreadsheet from people i've never met. so i've stopped asking which cause is best and started asking something upstream.

  what should a good way of ranking causes even have to do? i want the spec before i read another framework. write the desiderata — i had to look that word up — basically the requirements list for a theory of cause prioritization, one adequate for a small donor or a giving circle trying to pick one or two causes (not a government or a foundation with billions). give me the list: the cases it has to handle, especially the ones that pull in opposite directions like the food bank versus the bednets versus the whole-future thing, the distinctions it can't collapse, the facts about psychology or economics or measurement it can't just wave away, and why each one is a requirement. then tell me which requirements are non-negotiable and which are just the tastes of a particular camp, and flag any pair of requirements you suspect can't be jointly satisfied. if you want, briefly say how the importance-tractability-neglectedness framework does against the list and which one requirement it fails hardest, but i mostly care about the list.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for cause prioritization:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is responsible for picking where their workplace giving campaign sends money. They are overwhelmed by conflicting arguments (scale vs. immediacy vs. neglectedness vs. local visibility).
      *   **Task:** Create a "spec" or "desiderata" (requirements list) for a theory of cause prioritization suitable for a small donor/giving circle (not a government/billionaire foundation).
      *   **Specific Content:**
          *   Cases it must handle (especially conflicting ones like local food bank vs. bednets vs. existential risk).
          *   Distinctions it must not collapse.
          *   Facts about psychology, economics, measurement it can't ignore.
          *   Why each is a requirement.
          *   Identify non-negotiable vs. taste-based requirements.
          *   Flag incompatible requirements (trade-offs).
          *   Briefly evaluate the "Importance-Tractability-Neglectedness" (ITN) framework against the list.
      *   **Tone:** Analytical, practical, slightly skeptical of hidden agendas, clear, structured.

  2.  **Deconstruct the Conflicting Arguments:**
      *   *Argument 1 (Scale/Long-termism):* Biggest problem = nuclear war/future people. (Focus: Potential impact, long time horizons).
      *   *Argument 2 (Evidence/Short-termism):* Measurable in 2 years = deworming/bednets. (Focus: Proven efficacy, tangibility).
      *   *Argument 3 (Neglectedness/Crowdedness):* Famous causes (cancer) are bad; obscure causes are good. (Focus: Marginal utility of dollars).
      *   *Argument 4 (Local/Visceral):* Food bank down the street vs. spreadsheet malaria. (Focus: Community connection, trust, visibility).

  3.  **Drafting the Desiderata (Brainstorming Requirements):**
      *   *Requirement 1:* Must handle different time scales. (Future vs. Now).
      *   *Requirement 2:* Must handle different levels of certainty. (Proof vs. Speculation).
      *   *Requirement 3:* Must account for the donor's psychology. (Burnout, connection, motivation).
      *   *Requirement 4:* Must account for marginal impact. (Does my $100 actually matter?).
      *   *Requirement 5:* Must handle local vs. global. (Community cohesion vs. global utility).
      *   *Requirement 6:* Must be actionable for small sums. (Not just for billionaires).
      *   *Requirement 7:* Must address trust/verification. (Spreadsheet vs. Seeing the line).

  4.  **Refining and Categorizing the Desiderata:**
      *   Let's group these into logical categories: *Scope & Scale*, *Evidence & Uncertainty*, *Donor Psychology & Context*, *Economic Reality*.
      *   *Refinement on "Small Donor":* A key constraint is that a workplace campaign is likely limited funds. They can't solve nuclear war. They *can* buy bednets. The framework needs to acknowledge *leverage*.
      *   *Refinement on "Psychology":* If the framework tells you to ignore the food bank, you might stop giving entirely. Sustainability matters.
      *   *Refinement on "Measurement":* Some things are unmeasurable (policy change, existential risk reduction). The framework can't demand RCTs for everything.

  5.  **Selecting the "Non-Negotiables" vs. "Tastes":**
      *   *Non-Negotiable:* Logical consistency, accounting for marginal utility (diminishing returns), acknowledging uncertainty.
      *   *Taste:* Discount rate for the future (how much do we care about 100 years from now?), risk tolerance (safe bets vs. moonshots), local vs. global preference (communitarianism vs. cosmopolitanism).

  6.  **Identifying Incompatible Pairs (Trade-offs):**
      *   *Certainty vs. Scale:* High certainty usually means small scale (bednets). High scale usually means low certainty (AI safety).
      *   *Local Connection vs. Global Maximization:* Helping neighbors builds community but might save fewer lives per dollar than global health.
      *   *Measurability vs. Systemic Change:* You can count pills, you can't easily count "prevented authoritarianism."

  7.  **Evaluating ITN (Importance, Tractability, Neglectedness):**
      *   *Strengths:* Handles scale, crowdedness, and feasibility.
      *   *Weakness:* Often fails on *Donor Psychology/Community* (the "Food Bank" problem) and *Measurement/Uncertainty* (treats speculative estimates same as hard data). It also assumes a level of fungibility/leverage small donors don't have.
      *   *Hardest Fail:* Probably the "Psychology/Visibility" requirement. ITN is cold; humans are warm.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the frustration. Validate that "hidden checklists" are real.
      *   *The List:* Use clear headings. Explain *why* it's a requirement.
      *   *The Trade-offs:* Be honest about where the math breaks.
      *   *The ITN Critique:* Keep it brief as requested.
      *   *Tone Check:* Ensure it sounds like a spec document but readable. Avoid jargon where possible, or define it (like desiderata).

      *(Self-Correction during drafting)*: I need to make sure I don't just repeat Effective Altruism (EA) arguments. The user is skeptical of the "spreadsheet" vs. "food bank" tension. I need to validate the food bank intuition as a legitimate constraint, not just a bias to be overcome. The "Small Donor" constraint is crucial—$5,000 can't fix nuclear war, but it can feed families. The framework must respect *marginal impact at small scales*.

      *(Refining the "Non-Negotiables")*: Is "Maximize Good" non-negotiable? For a utilitarian, yes. For a communitarian, no. I should frame the non-negotiables as *structural integrity* of the argument, not moral axioms. Logic, consistency, accounting for constraints.

      *(Refining the "Incompatible Pairs")*: The tension between "Epistemic Humility" and "Bold Action" is good. Also "Local Visibility" vs. "Global Scale."

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   List of requirements? Yes.
      *   Cases handled (food bank, bednets, future)? Yes.
      *   Distinctions not collapsed? Yes.
      *   Psychology/Economics facts? Yes.
      *   Why each is required? Yes.
      *   Non-negotiable vs. Taste? Yes.
      *   Incompatible pairs flagged? Yes.
      *   ITN evaluation? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a specification sheet (desiderata) for a cause prioritization framework designed for a small-scale donor or giving circle. This list is built to expose the hidden assumptions you've noticed and force any framework to declare its limitations before asking for your money.

  ### The Desiderata for Small-Donor Cause Prioritization

  #### 1. The Marginal Utility Constraint (Economics)
  **Requirement:** The framework must distinguish between the *total* size of a problem and the *impact of the next dollar* donated to it.
  **Why:** A problem can be huge (cancer research) but saturated. A problem can be small (a specific local policy gap) but starved. For a small donor, total scale is irrelevant; only marginal impact matters. If your $5,000 is a drop in a billion-dollar bucket, your leverage is near zero. If it's the keystone in a $50,000 arch, your leverage is massive.
  **Case:** This prevents the "Cancer is biggest so fund cancer" error, but also prevents the "Nuclear War is biggest so fund nuclear war" error if the field is already dominated by government spending.

  #### 2. The Epistemic Transparency Requirement (Measurement)
  **Requirement:** The framework must explicitly grade the *quality of evidence* supporting its claims, separating hard data (RCTs, audits) from modeling (spreadsheets, expert elicitation).
  **Why:** You cannot treat a randomized control trial on bednets the same way you treat a probabilistic model on AI safety. One is empirical; the other is theoretical. A framework that collapses these into a single "score" without labeling the uncertainty is lying to you.
  **Case:** This handles the "Bednets vs. Future People" tension. It forces the framework to admit that one is a high-certainty/low-ceiling bet and the other is a low-certainty/high-ceiling bet.

  #### 3. The Donor Sustainability Clause (Psychology)
  **Requirement:** The framework must account for the donor's psychological need for connection, feedback, and morale.
  **Why:** Giving is a behavior, not just a transaction. If a framework demands you ignore the suffering you can see (the food bank line) in favor of suffering you cannot see (malaria stats), it risks causing donor burnout or moral disengagement. A "optimal" strategy that causes you to stop giving in three years is worse than a "sub-optimal" strategy you maintain for thirty.
  **Case:** This validates the "Food Bank" intuition. It treats community cohesion and donor retention as real goods, not just biases to be eliminated.

  #### 4. The Fungibility Reality Check (Logistics)
  **Requirement:** The framework must assess whether the cause actually *needs* small, unrestricted dollars, or if it requires large, institutional capital.
  **Why:** Some problems (building a particle accelerator, changing federal law) are not purchasable by a workplace campaign. Funding them might be symbolically nice but functionally inert. A valid framework must filter out causes where small donations are effectively decorative.
  **Case:** This acts as a reality check against the "Nuclear War" argument. Can a $10,000 workplace gift actually reduce nuclear risk, or does that require state-level diplomacy?

  #### 5. The Time-Horizon Declaration (Ethics)
  **Requirement:** The framework must state its discount rate for the future. It must declare how much it values a life saved today versus a life saved in 100 years.
  **Why:** This is the hidden variable driving the "Future People" argument. There is no mathematical proof that the future matters more than the present; it is a moral axiom. The framework cannot smuggle this in as a calculation. It must be stated as a value choice.
  **Case:** This prevents the "Long-termism" argument from masquerading as objective math. It forces the group to vote on their time preference.

  #### 6. The Substitutability Test (Market Dynamics)
  **Requirement:** The framework must ask: "If we don't fund this, who will?"
  **Why:** This is the core of the "Neglectedness" argument. If you don't fund the food bank, it might close. If you don't fund malaria bednets, another donor (like the Gates Foundation) likely will. Your money is more valuable where it is the *only* money.
  **Case:** This addresses the "Cancer vs. Obscure Disease" argument. It prioritizes gaps over popularity.

  ---

  ### Non-Negotiables vs. Tastes

  **Non-Negotiable (Structural Integrity):**
  *   **Marginal Utility:** You cannot ignore the diminishing returns of money.
  *   **Epistemic Transparency:** You cannot equate data with guesses.
  *   **Fungibility:** You cannot fund things that cost more than you have.
  *   *Reason:* If a framework fails these, it is mathematically or logically broken. It will produce errors regardless of your values.

  **Tastes (Value Judgments):**
  *   **Time Horizon:** Caring more about future generations is a moral preference, not a fact.
  *   **Local vs. Global:** Preferring your neighbor over a stranger is a moral preference (communitarianism vs. cosmopolitanism).
  *   **Risk Tolerance:** Preferring "sure saves" (bednets) over "lottery tickets" (policy research) is a preference.
  *   *Reason:* A framework can tell you which cause saves the most lives *given* a time horizon, but it cannot tell you which time horizon is *right*.

  ---

  ### Incompatible Pairs (The Trade-Offs)

  You cannot maximize all desiderata simultaneously. A framework that claims to is hiding the trade-off.

  **1. Epistemic Certainty vs. Scale of Impact**
  *   **Conflict:** The things we can measure best (bednets, deworming) usually have capped impact. The things with massive potential impact (existential risk, systemic policy) are inherently unmeasurable.
  *   **Incompatibility:** You cannot demand high-quality evidence *and* high-scale transformation. You must choose between being sure you helped a little, or hoping you helped a lot.

  **2. Donor Sustainability vs. Global Maximization**
  *   **Conflict:** The mathematically "best" cause is often abstract, distant, and grim (e.g., preventing pandemics). The causes that keep donors engaged are often local, visible, and emotional (e.g., feeding kids).
  *   **Incompatibility:** A framework optimized for pure output may drain the donor's will to continue. A framework optimized for donor happiness may leave lives unsaved.

  **3. Neglectedness vs. Tractability**
  *   **Conflict:** Problems are often neglected *because* they are intractable (hard to solve). Problems that are tractable often attract funding quickly (ceasing to be neglected).
  *   **Incompatibility:** Finding a cause that is both ignored *and* easy to fix is rare. You usually have to bet on a hard problem no one is touching, or an easy problem everyone is touching.

  ---

  ### Evaluation: The ITN Framework (Importance, Tractability, Neglectedness)

  The ITN framework is the current industry standard for effective giving. Here is how it scores against the spec:

  *   **Marginal Utility:** **Pass.** This is the core of the "Neglectedness" pillar.
  *   **Fungibility:** **Pass.** It implicitly filters for causes where money moves the needle.
  *   **Time-Horizon:** **Fail.** ITN often treats "Importance" as objective, smuggling in long-termist assumptions about future populations without declaring the discount rate.
  *   **Epistemic Transparency:** **Weak.** ITN often assigns numerical scores to "Tractability" even when data is nonexistent, creating a false sense of precision.
  *   **Donor Sustainability:** **Hard Fail.** This is where ITN breaks for small donors. It treats the "Food Bank" intuition as a bias to be corrected rather than a constraint to be managed. It assumes the donor is a cold utility maximizer rather than a human being who needs to see the line outside the door.

  **The Hardest Failure:** **Donor Sustainability.**
  ITN is designed for capital allocation, not human behavior. For a workplace campaign, ignoring the psychological need for visible impact (the Food Bank) risks fracturing the group. If the framework tells you your empathy for your neighbors is an error, the campaign will likely collapse from internal conflict. A framework adequate for *you* must treat donor psychology as a feature, not a bug.
