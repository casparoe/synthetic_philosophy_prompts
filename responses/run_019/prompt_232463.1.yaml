prompt: |-
  I'm drafting a novel where two of my characters have been arguing for a year about tipping, queue-jumping and jaywalking, and I want to get their argument right rather than have them talk past each other. Marla holds what you could call the local-deference view: everyday conventions do create real obligations, so if a place has a custom of tipping or queueing or not crossing against the light, you owe it to the people around you to follow it, and visitors have an especially strong reason to defer to local ways. Idris holds the harm-based view: a convention only matters morally insofar as breaking it would actually harm, deceive, or disrespect someone, and conventions alone are just social pressure—so a visitor who never agreed to a local custom is often not bound by it.

  I want the document they would produce if a mediator locked them in an adversarial collaboration and made them write a joint statement. Give me: a numbered list of claims both can sign, kept non-vacuous; then the exact residual disagreement, worded so each of them would accept the description of their own side; then the cruxes, the sub-questions that would actually move at least one of them if settled. For each crux, include a concrete case or observation both agree bears on it, and what each of them predicts in advance. I especially care about the messy cases: a convention that partly exists because of a bad background (like tipping functioning as wage replacement), a local custom a visitor could'nt reasonably have known about, and a convention that isnt morally neutral (say a queue that quietly excludes certain people). If part of their fight turns out to be just verbal, say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Characters:** Marla (Local-Deference View: conventions create obligations, visitors should defer) vs. Idris (Harm-Based View: conventions matter only if they prevent harm/deception/disrespect, visitors aren't automatically bound).
      *   **Topic:** Tipping, queue-jumping, jaywalking (social conventions/norms).
      *   **Task:** Create a document resulting from "adversarial collaboration" mediated by a third party.
      *   **Components Required:**
          1.  Numbered list of agreed claims (non-vacuous).
          2.  Exact residual disagreement (worded neutrally but acceptably to both).
          3.  Cruxes (sub-questions that could change minds), including concrete cases/observations, and predictions from both sides.
          4.  Specific focus on messy cases (unjust backgrounds, unknown customs, immoral conventions).
          5.  Identification of verbal disputes (if any).
      *   **Tone:** Formal, precise, philosophical but grounded in the novel's context.

  2.  **Deconstruct the Views:**
      *   *Marla (Local-Deference):* Focuses on social cohesion, fairness as participation, implicit contracts of presence, respect for local autonomy. Breaking norms disrupts the "game" everyone else is playing.
      *   *Idris (Harm-Based):* Focuses on consequentialism, individual liberty, explicit consent. Norms are tools, not masters. If no one is hurt, the rule is optional. Visitors lack the "social contract" membership.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground without watering it down to "sometimes things are good."
      *   *Idea 1:* Both agree norms *can* serve good purposes (coordination).
      *   *Idea 2:* Both agree some norms are bad (exclusionary).
      *   *Idea 3:* Both agree intent matters (accidental vs. malicious violation).
      *   *Idea 4:* Both agree visitors have *some* obligation (don't wreck the place), just disagree on the source/scope.
      *   *Refinement:* Make them specific to the tipping/queueing context.
      *   *Drafting:*
          1.  Conventions often solve coordination problems (queues prevent fights).
          2.  Violating conventions *can* cause harm (even if not always).
          3.  Visitors shouldn't exploit locals (free-riding).
          4.  Some conventions are morally tainted (exclusion).
          5.  Knowledge matters (you can't follow what you don't know).

  4.  **Drafting Section 2: Residual Disagreement:**
      *   Needs to capture the core philosophical split.
      *   Marla: The obligation comes from *participation* in the system.
      *   Idris: The obligation comes from *consequences* of the action.
      *   *Wording:* "The source and default weight of the obligation."
      *   *Marla's phrasing:* "Obligation arises from entering the social space."
      *   *Idris's phrasing:* "Obligation arises from foreseeable impact on others."
      *   *Synthesis:* "Whether the mere fact of a stable local convention generates a pro tanto moral reason for a knowledgeable visitor to comply, absent specific harmful consequences."

  5.  **Drafting Section 3: Cruxes (The Meat):**
      *   Need specific scenarios where their predictions diverge.
      *   *Crux 1: The "Wage Replacement" Case (Tipping).*
          *   Context: Tipping makes up low wages.
          *   Marla: You must tip because the system relies on you.
          *   Idris: You don't *have* to tip, but the *employer* is harming the worker. However, if I don't tip, do *I* harm?
          *   Refinement: Is the visitor complicit in the structural harm?
          *   Prediction: Marla says non-tipping is direct wrongdoing. Idris says it's permissible, though the system is bad.
      *   *Crux 2: The "Unknown Custom" Case (Jaywalking).*
          *   Context: A subtle rule (e.g., don't cross when the green man flashes, even if still green).
          *   Marla: Once you know, you must follow. Ignorance is an excuse for the past, not the future.
          *   Idris: If it's obscure and harmless, it's not binding even if known, unless it signals safety.
          *   Refinement: The "Reasonable Knowledge" threshold.
          *   Prediction: Marla says "Learn the rules." Idris says "Rules must be obvious to bind."
      *   *Crux 3: The "Exclusionary Queue" Case.*
          *   Context: A queue that implicitly keeps "undesirables" out.
          *   Marla: Even bad norms demand order, but this one might be void.
          *   Idris: This confirms harm-based view (the harm is exclusion).
          *   Refinement: When does a norm lose authority?
          *   Prediction: Marla says "Undermine it openly." Idris says "Ignore it silently."
      *   *Crux 4: The "Free Rider" Case (Public Transport).*
          *   Context: Honesty box or loose enforcement.
          *   Marla: You benefit, you pay.
          *   Idris: If you won't get caught and service doesn't drop, no harm.
          *   *Wait, this might be too close to theft.* Let's stick to the prompt's focus: Tipping/Queueing/Jaywalking.
      *   *Let's try "The Signal Case" (Jaywalking).*
          *   Context: Jaywalking when no cars are coming.
          *   Marla: It erodes respect for the law/signal.
          *   Idris: No cars = no harm.
          *   Prediction: Marla predicts long-term erosion of safety culture. Idris predicts no measurable change.

      *   *Let's refine the Cruxes to be more "moveable":*
          1.  **Complicity in Structural Harm (Tipping):** Does participating in a flawed system make you responsible for its flaws?
          2.  **The Threshold of Visibility (Jaywalking):** Does a rule need to be publicly legible to bind outsiders?
          3.  **The Erosion Mechanism (Queueing):** Does one violation actually weaken the norm for others?

  6.  **Drafting Section 4: Verbal Disputes:**
      *   Are they arguing about definitions?
      *   "Obligation" vs. "Prudence."
      *   "Harm" (Marla includes abstract social friction; Idris requires concrete detriment).
      *   This is crucial for the "talk past each other" element.

  7.  **Review and Refine:**
      *   *Check constraints:* Numbered list? Yes. Residual disagreement? Yes. Cruxes with predictions? Yes. Messy cases included? Yes. Verbal dispute identified? Yes.
      *   *Tone Check:* Needs to sound like a mediated document. "Joint Statement of Agreement and Disagreement."
      *   *Character Voice:* Marla should sound communitarian; Idris should sound libertarian/consequentialist. The document should be neutral but reflect their inputs.
      *   *Specific Prompt Requirement:* "For each crux, include a concrete case or observation both agree bears on it, and what each of them predicts in advance."

  8.  **Final Polish:**
      *   Ensure the "Residual Disagreement" is sharp.
      *   Make sure the "Cruxes" aren't just restatements of the main argument but specific empirical/philosophical pivots.
      *   Ensure the "Verbal Dispute" section explains *why* it's verbal (semantic ambiguity).

      *(Self-Correction during drafting Crux 1)*: Make sure Idris doesn't sound like a monster on tipping. He should argue the *moral burden* lies on the employer, not the tipper, whereas Marla argues the *immediate duty* lies on the tipper to sustain the worker's income within the current reality.

      *(Self-Correction on Verbal Dispute)*: Focus on the definition of "Harm." Marla counts "social friction/uncertainty" as harm. Idris counts "material/psychological setback" as harm.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT**
  **Subject:** Moral Obligations Regarding Local Social Conventions (Tipping, Queueing, Traffic)
  **Parties:** Marla V. (Local-Deference View), Idris K. (Harm-Based View)
  **Mediator:** Dr. Aris Thorne
  **Date:** October 14, 202X

  ### I. Points of Consensus
  *Both parties affirm the following claims as true and non-negotiable:*

  1.  **Coordination Value:** Social conventions (e.g., queues, traffic signals) generally serve a coordination function that reduces conflict and increases efficiency for the group.
  2.  **The Harm Threshold:** There are specific instances where violating a convention causes direct, measurable harm to identifiable individuals (e.g., cutting a queue in front of someone with a mobility impairment; refusing to tip where it constitutes the server's sole income). In these instances, both parties agree violation is morally impermissible.
  3.  **The Ignorance Clause:** A visitor cannot be held morally accountable for violating a convention they could not reasonably have known about prior to the act. Ignorance is a valid excuse for the first instance, provided correction follows.
  4.  **Illegitimate Norms:** A convention that explicitly or implicitly enforces discrimination (e.g., a queue system designed to exclude specific demographics) loses its moral authority. Both parties agree that violating such a convention is permissible, and potentially obligatory.
  5.  **Reciprocity:** Visitors benefit from local infrastructure and order. Therefore, visitors have *some* duty not to exploit the system (e.g., "free-riding" on public trust without contributing to its maintenance).

  ### II. Residual Disagreement
  *The parties cannot agree on the following formulation. Each accepts the description below as an accurate characterization of their own position and their opponent's.*

  **The Core Question:** Does the mere existence of a stable, locally recognized convention generate a *pro tanto* moral obligation for a knowledgeable visitor to comply, even in the absence of direct, consequential harm?

  *   **Marla's Position (Yes):** The obligation arises from **participation**. By entering a social space and utilizing its services, a visitor implicitly consents to the "rules of the game." To break a rule without cause is to disrespect the local autonomy and social fabric that sustains the environment, regardless of immediate consequences.
  *   **Idris's Position (No):** The obligation arises from **consequence**. A rule is a tool for preventing harm. If a specific violation in a specific context creates no victim, no deception, and no erosion of trust that can be empirically demonstrated, the rule is merely social pressure. A visitor is not bound by "because we do it here" alone.

  ### III. Cruxes
  *The following sub-questions represent the specific pivot points where empirical evidence or philosophical resolution could shift one or both parties. For each crux, a concrete case is identified that both agree is relevant.*

  #### Crux 1: The Mechanism of Erosion
  *Does a single, harmless violation by an outsider measurably weaken the convention for locals?*

  *   **Concrete Case:** **The Empty-Street Jaywalk.** A visitor crosses against a red light at 3:00 AM with zero traffic visible. No cars brake; no one is endangered.
  *   **Marla's Prediction:** If this behavior becomes common among visitors, locals will begin to view the signal as optional. This erodes the "habit of compliance," leading to higher accident rates during peak hours. The visitor is borrowing against the safety capital of the city.
  *   **Idris's Prediction:** Locals distinguish between "outsider noise" and "local norms." One violation (or many by tourists) does not change the local habit unless locals *choose* to copy it. The burden of proof is on Marla to show a causal link between tourist jaywalking and local accident rates.
  *   **Resolution Condition:** If data shows cities with high tourist jaywalking have no higher pedestrian accident rates than controlled cities, Idris wins this crux. If data shows a "broken windows" correlation specific to traffic safety, Marla wins.

  #### Crux 2: Complicity in Structural Harm
  *When a convention exists to patch a structural injustice, does the user bear the moral burden?*

  *   **Concrete Case:** **The Wage-Replacement Tip.** In a jurisdiction where servers are legally paid below minimum wage *on the condition* that tips make up the difference.
  *   **Marla's Prediction:** By accepting the service, the visitor enters a contract that includes the wage structure. Withholding the tip directly harms the server *within the current reality*, making the visitor complicit in the underpayment, regardless of who set the wage.
  *   **Idris's Prediction:** The harm is caused by the employer and the state, not the diner. Withholding the tip does not fix the wage law; it merely punishes the server for the employer's sin. The moral obligation is to pay the *price* of the meal, not to subsidize the employer's labor model voluntarily.
  *   **Resolution Condition:** If it can be demonstrated that tipping culture actively *prevents* legislative wage increases (by allowing legislators to offload responsibility), Idris's view strengthens (tipping perpetuates the harm). If it is shown that servers rely on tips for immediate survival and have no political recourse, Marla's view strengthens (non-tipping is immediate violence).

  #### Crux 3: The Legibility Threshold
  *How visible must a convention be to bind a visitor?*

  *   **Concrete Case:** **The "Unmarked" Queue.** A group of locals forms a loose line at a bakery. There is no rope, no sign, and no verbal confirmation. A visitor walks to the front, assuming it is a crowd, not a line.
  *   **Marla's Prediction:** The obligation exists once the pattern is *observable*, even if not explicit. A reasonable person should infer the convention from behavior. The visitor owes it to the group to ask, "Is this a queue?" before proceeding.
  *   **Idris's Prediction:** A convention is not binding until it is "legible" to a reasonable outsider. If the queue is ambiguous, the fault lies with the locals for not signaling. The visitor has no duty to decode subtle social cues they didn't agree to learn.
  *   **Resolution Condition:** Agreement on a standard of "Reasonable Legibility." If Marla accepts that ambiguous queues do not bind, she concedes ground. If Idris accepts that *observable patterns* constitute sufficient signaling, he concedes ground.

  ### IV. Identification of Verbal Dispute
  *The Mediator notes that a portion of the disagreement stems from semantic ambiguity rather than substantive moral difference.*

  **The Term:** "Harm"

  *   **The Conflict:**
      *   **Idris** defines Harm narrowly: Material loss, physical injury, or distinct psychological distress (e.g., feeling disrespected).
      *   **Marla** defines Harm broadly: Includes "social friction," "uncertainty," and "erosion of trust." To Marla, making a local pause and wonder, "Why did they do that?" is a form of harm (cognitive load/social disruption).
  *   **Why it Matters:** When Idris says, "No one was harmed," Marla hears, "No one bled." When Marla says, "It harms the community," Idris hears, "It makes people vaguely annoyed."
  *   **Proposed Adjustment:** Both parties agree to replace "Harm" with **"Setback to Interests."**
      *   Idris must acknowledge that *security in expectation* is a legitimate interest (i.e., I have an interest in knowing the queue will hold).
      *   Marla must acknowledge that *minor friction* does not equal a *rights violation*.
  *   **Status:** If this semantic shift is adopted, approximately 30% of the recorded argument dissolves. The remaining 70% is the substantive disagreement listed in Section II.

