      *   Uncomfortable verdict? Yes (Defunding the senior psych project).
      *   Limitations/Water-downing? Yes (Political reality section).

  10. **Final Polish:** Ensure the distinction between "Hard Core" and "Protective Belt" is clear in the questioning. Ensure the "Defund" criteria are sharp enough to actually cut something. (Self-correction: Make sure the "Punt" category isn't a cop-out).

  *(Self-Correction on the "User's PhD Topic" constraint)*: The prompt says "One of the projects we review is my own former PhD topic." I should acknowledge this tension. The protocol should be robust enough that if *their* old topic is degenerating, it flags it. I will note this in the limitations section.

  *(Refining the "Novelty" check)*: The hardest part is distinguishing "novel fact" from "new measurement of old fact." I need to be specific: "Novelty = Risk." If the experiment couldn't have falsified the theory, it's not novel.

  *(Refining the "Time" constraint)*: 1 hour per project is tight. The questions need to be punchy.

