      *   **Problem:** Current decisions are based on "vibes," seniority, and status quo bias ("give it one more year").
      *   **Framework:** Imre Lakatos's Methodology of Scientific Research Programmes (MSRP) - specifically Progressive vs. Degenerating problemshifts.
      *   **Requirements:**
          *   Step-by-step review protocol (questions, order, criteria).
          *   Distinction between novel predictions and retrofitted hypotheses (anti-gaming).
          *   Handling "rough patches" (principled patience, not just vibes).
          *   Clear stopping rules (Fund, Defund, Punt).
          *   Acknowledge judgment calls vs. procedural steps.
          *   Two case studies (Psychology degenerating, Materials Science progressive but quiet).
          *   Constraint: Must be able to produce an uncomfortable verdict (e.g., defunding a senior person's pet project).
          *   Constraint: Admit limitations/where it gets watered down.
          *   Constraint: No citations/reading lists.

  2.  **Deconstruct Lakatos for Bureaucracy:**
      *   *Hard Core:* The fundamental assumptions not up for negotiation.
      *   *Protective Belt:* Auxiliary hypotheses, methods, adjustments.
      *   *Positive Heuristic:* The plan for developing the program.
      *   *Negative Heuristic:* What not to touch.
      *   *Progressive Problemshift:* Theory leads to *novel* facts/predictions.
      *   *Degenerating Problemshift:* Theory chases anomalies, adds ad hoc patches, no new facts.
      *   *Challenge:* Lakatos is historical/philosophical. Applying it to a 1-hour meeting requires operationalizing "novelty" and "ad hocness."

  3.  **Drafting the Protocol (The "Lakatos Audit"):**
      *   *Structure:* Needs to be time-boxed. Let's say 45 mins discussion + 15 mins decision.
      *   *Phase 1: The Hard Core (5 mins).* Define what the project *is*. If this changes, it's a new project.
      *   *Phase 2: The Belt & Anomalies (15 mins).* Look at failures. Were they patched? How?
      *   *Phase 3: Novelty Check (15 mins).* The crux. Did they predict something *before* looking?
      *   *Phase 4: Heuristic Trajectory (10 mins).* Where is it going?
      *   *Decision Matrix:* Combine scores/qualitative assessments into Fund/Defund/Punt.

  4.  **Addressing Specific Constraints:**
      *   *Novelty vs. Retrofit:* Need a "Pre-registration" or "Timestamp" check. If the hypothesis wasn't written down before data collection, it's suspect.
      *   *Rough Patches:* Lakatos says don't judge too soon. The protocol needs a "Grace Period" clause based on *potential* vs. *track record*.
      *   *Uncomfortable Verdicts:* The protocol must explicitly flag "Degenerating + Senior PI" as a high-risk category for defunding.
      *   *Limitations:* It can't measure *truth*, only *progress*. It can't account for political fallout. It relies on honest reporting.

  5.  **Developing the Case Studies:**
      *   *Project A (Psychology):* Classic degenerating. Failed replications -> added moderators -> post-hoc explanations. Verdict: Defund.
      *   *Project B (Materials Science):* Quiet but progressive. One big surprise -> new experimental line. Verdict: Fund (with conditions).
      *   *Make it uncomfortable:* Maybe Project A is the user's former PhD topic (or similar). Let's make Project A the "Senior Person's Pet Project" to satisfy the "uncomfortable for someone in the room" constraint.

  6.  **Refining the "Gaming" Aspect:**
      *   How do people lie? They claim a prediction was prior when it wasn't.
      *   Counter-measure: Require lab notebooks/logs or pre-analysis plans. If they can't produce a timestamp, it counts as "Retrodictive."
      *   How do people hide anomalies? They don't publish them.
      *   Counter-measure: Ask "What didn't work?" explicitly.

  7.  **Refining the "Patience" Aspect:**
      *   Lakatos allows for a degenerating phase *if* a new breakthrough is imminent.
      *   Protocol mechanism: The "Hail Mary" clause. If degenerating, they must articulate a specific, high-risk/high-reward experiment that *would* turn it progressive. If they can't, cut it.

  8.  **Drafting the Content (Iterative refinement):**
