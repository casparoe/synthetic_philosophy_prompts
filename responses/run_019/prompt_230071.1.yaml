answer: |-
  ### The Thought Experiment: The Sterile Worker's Alarm Gland

  **The Organism and Trait**
  Consider a sterile female worker ant (*Formica rufa*, for concreteness). She is a perfectly ordinary member of her caste, physiologically healthy, and behaving normally. The trait in question is her **mandibular alarm gland**. When the nest is disturbed, this gland actively secretes a specific volatile pheromone. The physiology is "working normally": the glandular cells are metabolically active, the chemical synthesis pathway is intact, and upon neural stimulation, the pheromone is released into the air exactly as it was in her ancestors.

  **The Context**
  The colony is thriving. The worker is sterile; she will never reproduce. The secretion of this pheromone is costly: it consumes metabolic energy and, by marking the disturbance site, slightly increases the individual worker's risk of predation. The benefit of the secretion accrues entirely to the *colony* (other workers and the queen), who are alerted to defend or evacuate. The individual worker gains no direct survival or reproductive benefit from this act; in fact, relative to her own individual maintenance, it is a net cost.

  ---

  ### 1. The Etiological (Selected-Effects) Verdict: **Function Present**

  The SE account looks to the evolutionary history of the trait. Why is this gland here? It exists because ancestors who possessed this gland and secreted this pheromone contributed to the survival and reproduction of their kin (the colony). Through kin selection, the genes coding for this gland were selected *because* they produced this effect.

  *   **Verdict:** The trait has a function.
  *   **Function:** To signal alarm/defend the colony.
  *   **Reasoning:** The function is fixed by the historical selection pressure. The fact that the trait is currently costly to the *individual* is irrelevant. The trait was selected for its effect, and that effect constitutes its function regardless of the current system boundary we choose to analyze.

  ### 2. The Causal-Role (CR) Verdict: **Function Absent** (Initial Analysis)

  The CR account (à la Cummins) asks: *What causal contribution does this trait make to a capacity of the containing system?* To answer this, we must identify the "containing system" and its "capacities."

  In a standard field-biology context, the "containing system" is the **individual organism** (the physical ant). The relevant capacities of this system are typically things like *individual homeostasis, growth, self-maintenance, and locomotion*.

  *   **Causal Analysis:** The gland secretes chemical $X$.
  *   **Contribution to System Capacities:** Does secreting chemical $X$ contribute to the *individual ant's* homeostasis? No. Does it contribute to her *individual growth*? No. Does it contribute to her *individual survival*? No, it arguably hinders it (energy cost + predation risk).
  *   **Verdict:** Relative to the individual organism as the containing system, the trait has **no function**. It is a causal drain, not a functional contributor. It does not explain any capacity of the *individual* system.

  ### 3. The Feature Doing the Work: **System Boundaries**

  The divergence arises entirely from how the two theories handle the **boundary of the containing system**.

  *   **SE** bypasses the current system boundary. It anchors the function in the *historical* population where the trait was selected. Since the trait was selected (via kin selection), it has a function, even if the current "system" (the individual) doesn't benefit.
  *   **CR** is strictly synchronic and relative. It requires a *current* causal contribution to a *specific* system's capacity. If you carve the system as the **Individual**, the trait is non-functional (or dysfunctional). The CR verdict is sensitive to where you draw the line around the "organism."

  This supports your paper's thesis: The CR account cannot deliver a verdict on "function" without first stipulating the boundaries of the containing system. In this ordinary case, the "natural" boundary (the individual skin) yields "No Function," while the historical account yields "Function."

  ### 4. The Causal-Role Rescue: Redscribing the System

  A CR theorist, unwilling to accept that a clearly adaptive biological trait lacks a function, will attempt to recover the function by redescribing the containing system.

  **The Move:** The theorist argues that the "containing system" is not the individual ant, but the **Colony** (the Superorganism).
  *   **New System:** The ant colony.
  *   **New Capacity:** Colony defense / Homeostasis of the nest.
  *   **New Verdict:** The gland *does* contribute causally to the colony's capacity for defense. Therefore, it has a function.

  ### 5. Evaluation: Fair Move or Gerrymandering?

  Is this redesription fair, or is it gerrymandering to save the theory?

  **Argument for Fairness:**
  It is biologically accurate. In eusocial species, the colony *is* the reproductive unit. Treating the worker as a mere "cell" in a larger organism aligns with the biological reality of kin selection. If the CR theorist claims that "function" is always relative to a system, and the *relevant* biological system for this trait is the colony, then they are simply choosing the correct level of analysis.

  **Argument for Gerrymandering:**
  It looks like gerrymandering because it violates the intuitive and morphological definition of "organism" used in the rest of biology.
  1.  **Inconsistency:** We do not treat the human liver as a separate organism, nor do we treat a human mother and fetus as a single "containing system" for functional analysis, despite their tight integration. Why is the ant colony granted "system" status only when it saves the functional analysis of a trait?
  2.  **Circularity:** It appears the CR theorist is expanding the system boundary *specifically* to capture the trait's effect. They define the system as "that which benefits from the trait." This risks making the CR account collapse into the SE account (i.e., "The system is whatever was selected").
  3.  **Loss of Explanatory Power:** If the "containing system" can be expanded arbitrarily to include any causal beneficiaries of a trait, the concept of "containing system" loses its constraint. It no longer helps us distinguish between a trait functioning *for* an organism and a trait merely affecting the environment.

  **Conclusion for your Paper:**
  This case demonstrates that the Causal-Role account is unstable without a prior, independent theory of **individuality**. The SE account gets the verdict "for free" via history. The CR account must first solve the metaphysical problem of "what counts as the system" before it can assign a function. If the CR theorist must appeal to evolutionary history (kin selection) to justify drawing the system boundary around the colony, they are implicitly relying on the Etiological account to ground their Causal analysis.
