answer: |-
  **Project Title:** Robust Implementation: A Counterfactual Criterion for Computational Moral Status

  **1. Research Question**
  Debates regarding the moral status of AI, organoids, and insects stall on a prior metaphysical issue: which physical processes count as *implementing* the computations purportedly necessary for sentience? Triviality arguments suggest that almost any physical system (e.g., a stone) implements any finite-state machine under some mapping, rendering computational theories of moral status vacuous. My project addresses this bottleneck without attempting to solve the Hard Problem of consciousness. The specific research question is: *Can a counterfactual-support criterion of computational implementation successfully distinguish robust implementers (systems capable of supporting moral status) from trivial implementers (lookup tables, recorded processes, or stones) without collapsing into behaviorism or relying on observer-relative interpretations?* I aim to determine whether causal robustness across counterfactual scenarios provides a non-arbitrary boundary for morally relevant computation.

  **2. The Gap**
  Current approaches to this problem leave the ethical question unresolved. First, purely behavioral criteria fail to distinguish between a system that processes information and a "philosophical zombie" or a giant lookup table that outputs correct responses without internal state transitions. If moral status depends on experience rather than output, behaviorism is insufficient. Second, standard causal-role functionalism avoids behaviorism but remains vulnerable to triviality arguments; without constraints on *how* states causally relate, one can map physical states to computational states arbitrarily, implying that stones suffer whenever we choose a clever enough mapping. Third, deflationary or interpretivist responses claim implementation is observer-relative. This is ethically untenable: whether a system suffers cannot depend on an external observer's choice of mapping. Existing literature identifies these problems but lacks a positive account of implementation that is both metaphysically robust and ethically actionable. My project fills this gap by proposing that morally relevant implementation requires a specific causal organization capable of supporting counterfactuals, not just actual inputs.

  **3. Method and Work Plan**
  I will employ a method of reflective equilibrium combined with formal thought-experiment construction. The goal is to stress-test the "Counterfactual Robustness" criterion against edge cases where intuition and theory diverge. The semester plan is as follows:

  *   **Month 1: Formalization.** I will define the counterfactual criterion precisely. This involves distinguishing between *actual* state transitions and *dispositional* causal powers. I will draft a formal definition of "robust implementation" that requires the system to maintain causal coherence under perturbations not present in the actual history.
  *   **Month 2: The Lookup Table and Recording Cases.** I will construct detailed cases comparing a running neural network against a static lookup table and a "recorded brain" (a video playback of a sentient process). I will argue that while these are behaviorally equivalent, only the network supports the relevant counterfactuals (e.g., "if input X had occurred, state Y would have resulted"). The written output will be a 15-page draft section analyzing these cases.
  *   **Month 3: Scattered and Intermittent Systems.** I will test the criterion against spatially scattered systems (computation distributed across unrelated objects) and intermittently active systems. If the counterfactual criterion lets these in, it may be too permissive; if it rules them out, it must explain why spatial continuity matters. I will refine the criterion to address grain-size issues. Output: A revised argument section addressing spatial/temporal constraints.
  *   **Month 4: Synthesis and Drafting.** I will integrate the findings into a complete manuscript. I will explicitly address the "Stone Objection" to ensure the criterion does not inadvertently allow trivial implementers via backdoor counterfactuals. The final output will be a 25-30 page paper ready for submission to a peer-reviewed journal.

  **4. Justification of Approach**
  This conceptual approach is necessary because alternative methods cannot resolve the normative stakes. An empirical survey of ordinary people's intuitions about AI sentience would describe folk psychology, not establish moral truth; popular intuition is notoriously inconsistent regarding twins, zombies, and simulations. Similarly, simply stipulating a criterion and defending it by intuition begs the question against triviality arguments. If I stipulate that "stones do not count," I must explain *why* without circularity. The counterfactual approach offers a principled, metaphysical distinction grounded in causal powers rather than intuition or behavior. It targets the specific mechanism (computational implementation) that most contemporary machine ethicists rely on, correcting the foundation rather than debating the superstructure.

  **5. Failure Conditions and Salvage**
  I anticipate three specific risks. First, the counterfactual criterion may be circular, relying on hidden homunculi to define "appropriate" responses. Second, it may collapse into behaviorism if counterfactuals are defined solely by input-output dispositions. Third, it may fail to exclude stones if physical laws allow enough counterfactual support in trivial systems.

  If the primary hypothesis fails, the project will still yield a salvageable negative result: a rigorous map of why causal-functional accounts struggle to ground moral status. I will document exactly where the counterfactual criterion breaks down. This provides a valuable service to the field by ruling out a promising avenue and clarifying the constraints for future theories. Even a failed criterion clarifies the logical space, preventing future literature from recycling the same unresolved assumptions about implementation. The grant will ensure this analysis is completed with the necessary rigor rather than remaining a half-formed objection in ongoing debates.
