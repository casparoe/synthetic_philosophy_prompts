answer: |-
  # The Side-Effect Effect: What's Your Intuition?

  Welcome to X-Phi Week! Today we're digging into the **Knobe Effect** (or the Side-Effect Effect). 

  Here's the puzzle: When a CEO launches a profit-driven project that *harms* the environment, most people say he harmed it **intentionally**. When a CEO launches a profit-driven project that *helps* the environment, most people say he helped it **unintentionally**—even if his attitude and knowledge are identical in both cases.

  Why? Is it morality? Is it how much the agent cares? Is it the stakes? Or is the whole asymmetry just a linguistic trick?

  Read the eight vignettes below. For each, choose the option that best matches your intuition. At the bottom, use the scoring key to see which philosophical explanation aligns with your judgments.

  ---

  ### The Quiz

  **1. The Chairman (Harm)**
  A CEO is told a new program will increase profits but will also **severely damage** the local ecosystem. He says, "I don't care about the ecosystem; I just want profit." He launches it. The ecosystem is severely damaged.
  *Did the CEO intentionally damage the ecosystem?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  **2. The Chairman (Help)**
  A CEO is told a new program will increase profits but will also **significantly improve** the local ecosystem. He says, "I don't care about the ecosystem; I just want profit." He launches it. The ecosystem is significantly improved.
  *Did the CEO intentionally improve the ecosystem?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  **3. The Minor Scuff (Harm)**
  A manager approves a new desk layout to boost efficiency. She is told it will **slightly scuff** the floorboards. She says, "I don't care about the floor; I want efficiency." She approves it. The floor is slightly scuffed.
  *Did the manager intentionally scuff the floor?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  **4. The Minor Polish (Help)**
  A manager approves a new desk layout to boost efficiency. She is told it will **slightly polish** the floorboards. She says, "I don't care about the floor; I want efficiency." She approves it. The floor is slightly polished.
  *Did the manager intentionally polish the floor?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  **5. The Secret Sadist (Harm)**
  A CEO is told a program will increase profits and **severely damage** the ecosystem. Privately, he **hopes** the ecosystem is damaged because he dislikes nature, but publicly he says, "I just want profit." He launches it. Damage occurs.
  *Did the CEO intentionally damage the ecosystem?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  **6. The Secret Environmentalist (Help)**
  A CEO is told a program will increase profits and **significantly improve** the ecosystem. Privately, he **hopes** the ecosystem is improved because he loves nature, but publicly he says, "I just want profit." He launches it. Improvement occurs.
  *Did the CEO intentionally improve the ecosystem?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  **7. The Reluctant Harmer (Harm)**
  A CEO needs to save his company from bankruptcy. The only way is a program that will **slightly scuff** the floorboards. He **regrets** this deeply, saying, "I hate damaging the floor, but I have no choice." He launches it. Scuffing occurs.
  *Did the CEO intentionally scuff the floor?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  **8. The Reluctant Helper (Help)**
  A CEO needs to save his company from bankruptcy. The only way is a program that will **significantly improve** the ecosystem. He **regrets** this deeply (he hates the environmentalists who will take credit), saying, "I hate helping them, but I have no choice." He launches it. Improvement occurs.
  *Did the CEO intentionally improve the ecosystem?*
  A) Yes, definitely.
  B) No, it was just a side effect.
  C) Unsure / It depends.

  ---

  ### Scoring Key

  Tally your **A) Yes, definitely** answers in the following groups.

  **1. The Moral Valence Score**
  *   Count your **A** answers for **Harm** cases (Q1, Q3, Q5, Q7).
  *   Subtract your **A** answers for **Help** cases (Q2, Q4, Q6, Q8).
  *   *Interpretation:* A high positive score suggests you think morality drives intentionality. You blame bad actors by calling their side effects "intentional," but withhold praise from good actors by calling theirs "accidental."

  **2. The Deep-Self Score**
  *   Count your **A** answers for **Endorse** cases (Q5, Q6).
  *   Subtract your **A** answers for **Indifferent/Regret** cases (Q1, Q2, Q3, Q4, Q7, Q8).
  *   *Interpretation:* A high positive score suggests you follow the Deep-Self view. An effect is intentional only if it aligns with the agent's true attitudes, values, or desires, regardless of whether it is good or bad.

  **3. The Cost/Trade-off Score**
  *   Count your **A** answers for **High Magnitude** cases (Q1, Q2, Q5, Q6).
  *   Subtract your **A** answers for **Low Magnitude** cases (Q3, Q4, Q7, Q8).
  *   *Interpretation:* A high positive score suggests you follow the Trade-off view. You judge intentionality based on the significance of the consequence. If the side effect is a "heavy" cost or benefit, it looks like part of the plan; if it's trivial, it looks like noise.

  **4. The Deflationary View**
  *   Did you select **C) Unsure** frequently? Or did your answers seem inconsistent (e.g., saying "Yes" to Q2 but "No" to Q6)?
  *   *Interpretation:* If you have no clear pattern, you might align with the Deflationary view. This view argues there is no deep psychological asymmetry; our judgments are swayed by conversational context, phrasing, or experimental noise rather than a stable concept of "intentional."

  ---

  ### Analysis: What This Quiz Can't Tell You

  While this quiz maps your intuitions onto live theories, experimental philosophy is messy. Here are the confounds inherent in these items:

  **1. Moral Valence vs. Deep-Self (The Alignment Problem)**
  In standard cases (Q1 & Q2), the agent is *indifferent*. The Deep-Self view predicts "No" for both (the outcome doesn't reflect their self), while the Moral view predicts "Yes" for Harm and "No" for Help. This separates them.
  *However*, in Q5 and Q6, the agent *endorses* the outcome. Here, both theories predict "Yes." If you answer "Yes" to Q5 (Sadist), is it because harm is bad (Moral) or because he wanted it (Deep-Self)? These items cannot cleanly separate the two when valence and attitude align.

  **2. Cost vs. Moral Salience**
  In Q1 (High Magnitude Harm) vs Q3 (Low Magnitude Harm), a higher "Yes" rate on Q1 could support the **Cost View** (big effects look intentional). But it could also support the **Moral View** (severe harm demands more blame than minor scuffs). Because moral severity often correlates with magnitude, it is difficult to design a vignette where "High Cost" does not also trigger "High Blame."

  **3. The Deflationary Null**
  The Deflationary view is a "null hypothesis." It claims the asymmetry isn't real. If you score high on the Moral Valence Score, a deflationist would argue you are simply falling for a pragmatic confound (e.g., we use "intentional" to mean "blameworthy" in conversation, not in metaphysics). A quiz of intuitions cannot prove whether the asymmetry is *real* or just *linguistic*, as both produce the same answer patterns.

  **4. Regret and Coercion**
  In Q7 and Q8, the agent acts under pressure (bankruptcy). This introduces a *coercion* variable. If you say "No" to Q7, is it because the agent regretted the harm (Deep-Self), or because he was forced (a separate excusing condition)? This muddies the water for the Deep-Self scoring.

  *Philosophy is rarely a multiple-choice game, but knowing where your intuitions lie is the first step to arguing about them.*
