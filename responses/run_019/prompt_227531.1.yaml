      *   *Correction on the "Dreaded Question":* The mowing analogy is strong. The best defense is "Necessity and Specificity." We mow to grow food/safety. We drive to get to work. Fogging is often for *nuisance* control, not just disease. Distinguish between *outbreak response* (acceptable) and *scheduled preventative fogging* (the target).
      *   *Hole Identification:* The biggest hole is the "probability" input. If $P=0$, Expected Suffering $= 0$. The Entomologist will attack $P$. The user needs to defend $P$ not with math, but with biological consensus on nociception.

  10. **Final Structure:**
