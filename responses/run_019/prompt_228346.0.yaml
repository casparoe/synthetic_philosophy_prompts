prompt: |-
  I'm on jury duty and we're trying to decide whether the light was red when the defendant drove through the intersection. The only eyewitness testified that between the fog and the streetlight glare he was "pretty sure, maybe 7 out of 10" that the light was red. The prosecuter keeps saying we have direct testimony that the light was red, full stop, and the defense says if the witness can't swear to it we should throw his testimony out entirely. Both moves feel wrong to me. Before the witness spoke I genuinely had no idea which way it went, so if I take him at his word, do I just treat "the light was red" as 70% likely and multiply that through everything else in the case? Or am I supposed to somehow convert his shakiness into a yes-or-no first? And my fellow jurors all seem to want to treat what he said as either definite proof or totally worthless, which bugs me too. What's the right way to fold uncertain testimony like this into an actual decision, and how do I explain it to them without sounding like a robot? Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Jury duty, criminal or civil trial (likely criminal given "prosecutor" and "defendant," though "preponderance of evidence" vs. "beyond reasonable doubt" matters). The specific issue is a traffic light color (red vs. not red).
      *   **Evidence:** One eyewitness. Conditions were poor (fog, glare). Witness confidence is qualified ("pretty sure, maybe 7 out of 10").
      *   **Conflict:** Prosecutor says it's direct testimony (fact). Defense says it's too uncertain (throw it out). Fellow jurors want to treat it as binary (100% true or 0% true).
      *   **User's Intuition:** Both extremes feel wrong. Wants to know how to weigh uncertain testimony probabilistically without being robotic.
      *   **Goal:** Practical advice on how to evaluate this evidence within the legal framework, and how to communicate this to other jurors.
      *   **Constraint:** Answer in American English.

  2.  **Identify the Legal Framework (Crucial Step):**
      *   *Jury Instructions:* Jurors are bound by the judge's instructions, not Bayesian probability theory.
      *   *Burden of Proof:*
          *   Criminal: "Beyond a Reasonable Doubt" (very high bar, usually 90%+ in lay terms, though courts avoid numbers).
          *   Civil: "Preponderance of the Evidence" (more likely than not, >50%).
      *   *Credibility:* It is the jury's sole province to determine the weight and credibility of witness testimony. They *can* believe part, all, or none of it.
      *   *Fact-Finding:* Jurors decide *what happened*, not just calculate odds. They need to reach a verdict (Guilty/Not Guilty or Liable/Not Liable), not a probability score.

  3.  **Address the User's Specific Questions:**
      *   *Do I treat "light was red" as 70% likely?* Legally, no. You don't verdict "70% guilty." You have to decide if the burden of proof is met.
      *   *Do I convert to yes-or-no?* Essentially, yes, but through the lens of "reasonable doubt" or "preponderance."
      *   *How to explain to jurors?* Use analogies, focus on the burden of proof, and validate their intuition that the witness is imperfect without dismissing them entirely.

  4.  **Formulate the Advice:**

      *   **Acknowledge the Intuition:** Validate that the user is right. The binary thinking of other jurors is a common cognitive trap (the "fallacy of the excluded middle").
      *   **Legal Reality Check:** Explain that while Bayesian thinking is logical, the legal system requires a binary *verdict* based on a specific *standard of proof*.
      *   **The "Weight of Evidence" Concept:** Explain that jurors are allowed to weigh credibility. The witness's uncertainty *is* part of the testimony.
      *   **The Burden of Proof (The Tipping Point):**
          *   If Criminal: Does 70% meet "Beyond a Reasonable Doubt"? Usually no.
          *   If Civil: Does 70% meet "Preponderance"? Yes.
          *   *Self-Correction:* I don't know if it's criminal or civil. The prompt says "prosecutor," which implies criminal. I must focus on "Beyond a Reasonable Doubt."
      *   **Practical Strategy for Deliberations:**
          *   Don't use math terms ("70%").
          *   Use phrases like "firmly convinced," "left with a doubt," "reliability."
          *   Frame the witness's uncertainty as a *reason for doubt*, not a reason to ignore the witness.
      *   **Talking to Other Jurors:**
          *   Avoid sounding like a statistician.
          *   Focus on the *consequences* of being wrong.
          *   Ask questions rather than making declarations.

  5.  **Drafting the Content (Iterative refinement):**

