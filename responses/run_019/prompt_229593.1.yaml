answer: |-
  ### The Policy Researcher's Dilemma

  **1. The Scenario**
  You are a recent PhD graduate in public policy deciding between two career tracks. Both tracks consume the same resources and require the same effort; the only relevant difference is the expected impact on human survival and welfare.

  *   **Act A (Direct Implementation):** You join a proven global health organization (e.g., managing malaria bednet distribution). Based on historical data and current funding levels, your career contribution will deterministically save **400 lives**.
  *   **Act B (Existential Risk Policy):** You join a think tank focused on nuclear security protocol. Your work involves drafting policy recommendations.
      *   **State $S_1$ (Success):** Your specific recommendations are adopted by a major nuclear power during a crisis window, preventing a war. Probability $p = 1/10,000$ ($10^{-4}$). Impact: **5,000,000 lives saved**.
      *   **State $S_2$ (Failure):** Your recommendations are ignored or never reach the pivotal decision-makers. Probability $1 - p = 9,999/10,000$. Impact: **0 lives saved** (relative to the baseline).

  **Constraints Check:**
  *   **Realism:** Career choices in effective altruism and policy research are ordinary human decisions. The causal chain (research $\rightarrow$ adoption $\rightarrow$ risk reduction) involves no exotic physics or predictors.
  *   **Probability:** $10^{-4}$ is $\ge 1/10,000$.
  *   **Payoff:** 5,000,000 lives is $\le 5$ million.
  *   **Fanaticism:** A sensible reader judges sacrificing 400 certain lives for a 99.99% chance of saving none to be reckless (fanatical), despite the higher mathematical expectation.

  **2. The Utility Functions**
  To ensure the disagreement stems from boundedness rather than general risk aversion, we calibrate both functions to be nearly identical for small numbers of lives.

  *   **Unbounded Utility ($U_{un}$):** Linear in lives saved.
      $$U_{un}(n) = n$$
  *   **Bounded Utility ($U_{bd}$):** A saturation function that is linear for small $n$ but approaches an asymptote $M$.
      $$U_{bd}(n) = M \cdot (1 - e^{-n/M})$$
      We set the capacity parameter $M = 1,000,000$.
      *Calibration:* For small $n$, $e^{-n/M} \approx 1 - n/M$. Thus, $U_{bd}(n) \approx M(1 - (1 - n/M)) = n$.
      For the safe option ($n=400$): $U_{bd}(400) = 1,000,000(1 - e^{-0.0004}) \approx 399.92 \approx 400$.
      The functions agree on ordinary choices (e.g., saving 1 vs 2 lives), diverging only at the extreme tail.

  **3. Decision Calculations**

  **Theory 1: Expected Utility with Unbounded Valuation**
  *   **Act A:** $EU(A) = 1.0 \times U_{un}(400) = 400$.
  *   **Act B:** $EU(B) = (10^{-4} \times 5,000,000) + (0.9999 \times 0) = 500$.
  *   **Verdict:** **Choose Act B.**
  *   **Reasoning:** The expected value of lives saved (500) exceeds the certain value (400). The agent sacrifices 400 identifiable lives for a 0.01% chance at a massive payoff. This is the "fanatical" verdict.

  **Theory 2: Expected Utility with Bounded Valuation**
  *   **Act A:** $EU(A) = 1.0 \times U_{bd}(400) \approx 400$.
  *   **Act B:**
      $$U_{bd}(5,000,000) = 1,000,000 \cdot (1 - e^{-5}) \approx 1,000,000 \cdot (1 - 0.0067) = 993,300$$
      $$EU(B) = 10^{-4} \times 993,300 \approx 99.33$$
  *   **Verdict:** **Choose Act A.**
  *   **Reasoning:** Due to the utility bound, the marginal value of lives beyond the capacity $M$ diminishes rapidly. The utility of 5 million lives is not 5 million units, but roughly 1 million units. When discounted by the probability ($10^{-4}$), the expected utility (99.33) falls well below the certain utility of the safe option (400).

  **4. Structural Feature Doing the Work**
  The structural feature driving the divergence is the **utility bound (saturation)**.

  In the unbounded model, value scales linearly indefinitely; thus, the magnitude of the payoff ($5 \times 10^6$) compensates for the low probability ($10^{-4}$) to exceed the certain payoff ($400$). In the bounded model, the value of the payoff is capped near $M$ ($10^6$). Because the payoff ($5 \times 10^6$) exceeds the bound ($10^6$), the additional lives do not generate proportional utility. This compression prevents the expected utility of the risky option from overtaking the safe option, despite the probability being "respectable" ($10^{-4}$).

  **5. Pascal's Mugging and the Defender's Attack**

  **Does deleting the feature collapse the case into a Pascal's Mugging?**
  **No.** Deleting the utility bound (reverting to linear utility) does not make this a Pascal's Mugging; it makes it a standard **High-Stakes Expected Value** case. A Pascal's Mugging relies on probabilities so vanishingly small (e.g., $10^{-100}$) that they overwhelm epistemic hygiene, relying on the agent's inability to rule out the hypothesis. Here, the probability ($10^{-4}$) is robust enough to be taken seriously in policy modeling. The "fanaticism" arises not from epistemic instability (as in a Mugging), but from the moral counter-intuitiveness of ignoring certain goods for expected goods. The probability floor ($10^{-4}$) is what prevents this from being a Mugging; the utility bound is what prevents the Unbounded Verdict.

  **The Bounded Defender's Attack**
  A defender of bounded utility attacks the unbounded calculation by rejecting the axiology, not the arithmetic. They argue: *"Your calculation is mathematically correct, but your premise that the 5,000,000th life adds as much value as the 1st life is false. Moral value saturates."*

  **Does this rebut the calculation or change the subject?**
  This attack **changes the subject** from decision theory to axiology. It does not rebut the unbounded agent's calculation (which is valid given linear utility); rather, it disputes the input function ($U$). In a seminar on formal epistemology, this is a legitimate move: the dispute is not about how to maximize, but about *what* is being maximized. However, strictly speaking, it concedes that *if* utility were linear, the fanatical choice would be rational. The bounded defender avoids fanaticism by denying the linearity premise, effectively insulating the decision rule from the extreme tail.
