answer: |-
  This is a provocative draft with a clear voice, which is great for a workshop. You're asking the right questions, and your intuition that you might be "reinventing the wheel" or "moving the repugnance around" is spot-on.

  Here is blunt feedback addressing your five specific points, followed by a verdict on the pronatalism claim.

  ### 1. Distinctness: Is this just Average Utilitarianism in disguise?
  It is **not** standard Average Utilitarianism, but it is mathematically precarious.
  *   **The Math:** Standard Average Utilitarianism sums all welfare and divides by total population ($\sum W / N$). Your view averages within lineages, then averages those results ($\frac{1}{L} \sum (\frac{\sum W_i}{n_i})$).
  *   **The Consequence:** This gives equal moral weight to a lineage of one person and a lineage of one million people.
  *   **The Reduction:** This collapses into a form of **Number-Sensitive Critical-Level Utilitarianism** where the "critical level" is dynamic based on lineage history. However, it introduces a severe bias against large families. If I have one happy child, my lineage value is $X$. If I have 10 happy children (same welfare), my lineage value is still $X$, but my *weight* in the cross-lineage average is the same as the person with one child.
  *   **Verdict:** It's distinct, but the distinction creates a massive perverse incentive: **fragmentation is rewarded.** Splitting one large happy family into 10 separate "lineages" (if you can define them that way) skyrockets the moral value of the world.

  ### 2. The Repugnant Conclusion (RC) Dodge
  You are right to worry you've just moved the repugnance.
  *   **The Dodge:** You avoid the classic RC (A vs. Z) because adding billions of "Z-lives" creates billions of low-average lineages, dragging down the cross-lineage score.
  *   **The New Repugnance:** Consider the **"Sadistic Conclusion."** Your view implies that a world with 1,000 lineages of 1 person (welfare 10) is *equal* to a world of 1,000 lineages of 10,000 people (welfare 10). But intuitively, the second world contains vastly more value (more flourishing lives). Your view is indifferent to the *scale* of flourishing within a lineage.
  *   **Worse:** It implies that if we have a choice between (A) one massive lineage of 1 billion extremely happy people, or (B) one billion small lineages of 1 moderately happy person, we should choose **B**. This is the **"Repugnant Conclusion for Lineages."** It prioritizes diversity of lines over the total amount of goodness experienced.

  ### 3. The Strongest Counterexample (Eliminating Lineages)
  **You are absolutely right, and this is likely fatal.**
  *   **The Implication:** The Average View says killing an unhappy person raises the average. The Dynastic View says **extinguishing an unhappy lineage raises the cross-lineage average.**
  *   **The Horror:** This doesn't just imply letting unhappy people die; it implies active intervention to stop "low-performing" families from continuing. If a lineage has a historical average of 2 (on a 10 scale), the most efficient way to improve the world's value is to ensure that lineage has no future descendants.
  *   **Severity:** This is not just "as bad as the average view"; it is **eugenics-adjacent.** It shifts the target from individuals to families/clans. In a workshop, expect this to be the primary objection. It treats lineages as investment portfolios that should be liquidated if they underperform.

  ### 4. The Non-Identity Problem (NIP)
  You were too quick here. You haven't dissolved the problem; you've shifted the metaphysical burden.
  *   **The Issue:** NIP asks, "Who is harmed?" If Policy A creates Person X and Policy B creates Person Y, and Y has a worse life, we struggle to say B harmed Y (since Y wouldn't exist in A).
  *   **Dynastic Response:** You say the *lineage* is the unit. But lineages are constituted by people. If Policy B results in a *different* set of people, does it result in the *same* lineage?
  *   **The Reappearance:** If "lineage" is defined biologically, then changing the identity of the parents changes the lineage. If "lineage" is defined by social continuity (care), then NIP reappears as: "Which social continuity gets to exist?"
  *   **Verdict:** You avoid the *logic* of NIP by fiat (declaring identity irrelevant), but you don't solve the *moral intuition* that specific future people matter. It feels like a technical workaround rather than a solution.

  ### 5. Individuation: Are Lineages Coherent?
  **This is the technical dealbreaker.**
  *   **Merging:** What happens when two lineages marry and have children? Do they merge into one? If so, merging two high-average lineages creates one larger lineage. Does the average change? If I (avg 10) marry you (avg 10), and we have a kid (avg 10), our lineage avg is 10. But we are now *one* unit instead of *two*. We have just halved our moral weight in the cross-lineage average. **The view penalizes marriage and genetic mixing.**
  *   **Childlessness:** Is a childless person a lineage of 1? If so, having a child *always* risks lowering the average (unless the child exceeds the parent's welfare). This makes the view anti-natalist for anyone currently alive (since you can't beat your own average if you're the baseline).
  *   **Arbitrariness:** Where does a lineage start? With you? Your great-grandparents? Adam and Eve? If you go back far enough, everyone is one lineage (mitochondrial Eve). If the view relies on arbitrary cutoffs (e.g., "last 5 generations"), it loses its claim to objective moral truth.

  ### 6. The Pronatalism Upshot
  **The conclusion does not follow.** In fact, the math suggests the opposite.
  *   **Regression to the Mean:** For a lineage to maintain its average, every new child must meet or exceed the historical average of that lineage. Statistically, this is difficult. Most "moderate pronatalism" arguments rely on the idea that a "life worth living" adds positive value. Your view says a "life worth living" *subtracts* value if it's below the family average.
  *   **The Incentive:** The view incentivizes **stopping reproduction** once a lineage is established as "happy," to protect the average. It incentivizes **hyper-growth** only for miserable lineages (to dilute the past misery), which is perverse.
  *   **Revision:** You cannot claim this vindicates moderate pronatalism. At best, it vindicates "Elite Pronatalism" (only the happy should reproduce) and "Lineage Preservation" (don't let happy lines die out).

  ### Summary Advice for Revision
  1.  **Own the Math:** Explicitly state the formula. "Average of Averages" is a specific mathematical operation with known quirks (it weights small groups equally to large groups). Don't hide it in prose.
  2.  **Address the Eugenics Objection:** You need a constraint that forbids extinguishing lineages, even if it raises the average. But if you add that constraint, why not just add it to the Average View? You need to explain why the *lineage* unit makes this constraint more natural.
  3.  **Fix the Merging Problem:** If marriage merges lineages, your view penalizes social cohesion. You need a rule for how lineages interact (do they stay distinct even when intermarrying?).
  4.  **Tone Down the NIP Claim:** Change "dissolves" to "reframes." Acknowledge that it shifts the problem from individual identity to lineage continuity.
  5.  **Scrap the Pronatalism Claim:** Or radically qualify it. This view is much friendlier to "preservation of existing happy families" than "having new children."

  **Bottom Line:** It's a creative "Critical-Level" variant, but the "Average of Averages" mechanism creates severe perverse incentives regarding family size and merging. It solves the Repugnant Conclusion by inviting the "Sadistic Conclusion" (kill the bad families) and the "Fragmentation Conclusion" (split families to boost value). You need to decide if those costs are worth the benefit.
