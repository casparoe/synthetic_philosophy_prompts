answer: |-
  # Seminar Handout: The Multiple Realizability Decision Tree

  **Instructions:** Start at the **Entry Question**. Answer based on your current intuition or theoretical commitment. Follow the arrows to the next node or final position. Each leaf includes the "tax" you pay for holding that view.

  ***

  ### 🟢 ENTRY QUESTION
  **Can a human, an octopus, and a silicon robot be in *literally the same* mental state (e.g., pain) despite having almost no physiology in common?**

  *   **NO** (Mental identity requires physical/structural identity) $\rightarrow$ Go to **[Node A]**
  *   **YES** (Mental identity depends on causal role, not stuff) $\rightarrow$ Go to **[Node B]**

  ***

  ### 🔵 NODE A: The Physical Requirement
  **If mental states require physical identity, is the required physical substrate *strictly identical* across all species (e.g., human C-fibers = octopus C-fibers)?**

  *   **YES** (All pain-havers must share the same specific neurophysiology)
      *   ⬇️
      *   🍃 **TYPE IDENTITY THEORY**
      *   *The Awkward Commitment:* You must deny that octopuses or robots feel pain, even if they behave exactly like they do, simply because they lack human C-fibers.

  *   **NO** (The physical substrate varies by species or structural kind)
      *   ⬇️
      *   🍃 **LOCAL REDUCTION**
      *   *The Awkward Commitment:* There is no general science of mind; "pain" means something different in human psychology than it does in octopus psychology.

  ***

  ### 🔵 NODE B: The Functional Requirement
  **If mental states are defined by causal role, is this role *actually* realized by wildly different physical systems in the real world (empirical claim)?**

  *   **NO** (MR is conceptually possible but empirically false/rare; nature is uniform)
      *   ⬇️
      *   🍃 **MR SKEPTICISM**
      *   *The Awkward Commitment:* You must argue that the canonical examples of multiple realizability are scientifically mistaken, limiting the scope of psychology more than intuition suggests.

  *   **YES** (MR is real; the role is filled by diverse physical states)
      *   ⬇️
      *   Go to **[Node C]**

  ***

  ### 🔵 NODE C: The Metaphysics of the Role
  **When you say a system is "in pain," are you referring to the *abstract causal pattern* or the *physical state* filling that pattern?**

  *   **The Abstract Pattern** (The mental state *is* the functional role)
      *   ⬇️
      *   🍃 **CLASSICAL (ROLE) FUNCTIONALISM**
      *   *The Awkward Commitment:* You must accept the possibility of "absent qualia"—a system could perfectly play the pain role without actually *feeling* anything.

  *   **The Physical State** (The mental state *is* the realizer playing the role)
      *   ⬇️
      *   🍃 **REALIZER FUNCTIONALISM**
      *   *The Awkward Commitment:* You must accept that "pain" refers to a wildly disjunctive physical kind (C-fibers OR silicon-gates OR...), undermining the unity of natural kinds.

  ***

  ### 📝 Meta-Commentary & Discussion Notes

  **1. Inseparable Leaves: Type Identity vs. Realizer Functionalism**
  This tree cannot cleanly separate **Type Identity Theory** and **Realizer Functionalism** in all cases. Both end up identifying mental states with physical states.
  *   *Diagnosis:* The distinction is often genealogical rather than extensional. Realizer Functionalism arrives at physical identity *via* a functional definition (Pain = the state that plays Role R), whereas Type Identity arrives there directly (Pain = C-fiber firing). If the functional definition is rigidified to the actual world, the views converge.

  **2. Empty Combination: "Yes MR" + "Physical Identity Required"**
  *   *Diagnosis:* **Incoherent.** If you answer **YES** to the Entry Question (MR is possible) but then claim mental identity *requires* physical identity (Node A path), you contradict yourself. MR is defined by *different* physical bases yielding the *same* mental state.

  **3. Underexplored Path: Local Reduction vs. MR Skepticism**
  *   *Diagnosis:* **Merely Underexplored.** Both views limit the generality of psychology, but for different reasons. Local Reduction accepts MR but compartmentalizes it by species; MR Skepticism denies MR happens often at all. Students often conflate these, but one is a claim about taxonomy (Local Reduction) and the other about empirical neuroscience (Skepticism).

  **4. Time Check**
  *   If you spent more than 2 minutes on **Node B**, you are debating empirical neuroscience rather than philosophical commitment. The philosophical point is what you would say *if* MR were proven true or false.
