prompt: |-
  So I'm in this history club at school (basically 6 of us eating chips in a classroom lol) and yesterday two of them, Marcus and Delia, got into a huge argument and I need someone to settle it bc they made me the "judge" and I genuinely don't know.

  It started over the whole Franz Ferdinand thing, like how the driver took a wrong turn and that's how the archduke ended up right in front of the assassin. Marcus said this proves history is basically chaos -- tiny random stuff cascades into world war, so if the driver doesn't turn wrong, no WWI, no WWII, no cold war, completely different world. He said history is like weather, you can't predict it past a few weeks becuase small causes snowball.

  Delia said that's the dumbest thing she's ever heard. Europe in 1914 was a pile of dry grass, she said, and if it's not that spark it's the next one. The alliances, the arms race, everyone itching for a fight -- something else would've set it off within a few years. Her line was "the wrong turn explains THAT war, not war itself."

  Then Marcus said fine, but that's a cop out, because "something would've happened eventually" can never be proven wrong, and a claim you can't test isn't history it's just vibes. He said we're never gonna get to rerun 1914, so statements like "war was inevitable" are unfalsifiable and basically meaningless.

  Delia came back with: we use counterfactuals constantly and no one complains -- like in a murder trial the whole question is whether the victim would have lived "but for" what the defendant did, and nobody says "well we can't rerun the night so who knows." She said historians do the same thing, just with less certain evidence, and less certain doesn't mean meaningless.

  Then Marcus said ok but even granting that, the "but for" stuff only works for tiny near-term things (driver turns, duke dies) and falls apart over decades, because after 1914 the two timelines drift so far apart you can't say anything about 2014 in the no-assassination world -- so at most you can claim small counterfactuals, not "the whole 20th century would've been different," which was the fun claim he actually wanted to make.

  Delia said that's actually HER point, that the big outcomes (a great-power war, a defeated Germany, a grudge) were robust and would've shown up in both timelines even if every detail differed, so the timelines converge on the important stuff even if they diverge on trivia.

  At that point they both claimed the other one had just conceded. That's where I gave up lol.

  Can you go through each move and tell me who's right about what? Like specifically: (1) does the wrong turn thing actually show history is chaotic, (2) is "war was inevitable anyway" unfalsifiable/meaningless, (3) does the murder-trial analogy hold up or is there a real difference, (4) is Marcus right that counterfactuals rot over long time scales, and (5) when Delia says timelines converge on the big stuff, is that a real answer or did she just smuggle the inevitability claim back in. And if both of them are missing something obvious I'd love to know.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

