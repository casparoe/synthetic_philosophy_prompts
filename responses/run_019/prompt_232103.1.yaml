      *   *Correction on M:* M risks making it sound like ideas happen in a vacuum. I need to ensure I credit D for the "siege mentality" cause (War), which M acknowledges but D centers. Actually, M *did* mention the war as a contingent event. So M covers D's best point better than D covers M's best point.
