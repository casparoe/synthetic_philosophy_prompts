      *   **Task:** Provide a point-by-point adjudication of their arguments (rate from mistaken to right with justification), determine who is right about specific points, identify what the argument as a whole is missing, and take a definite position (keep/drop specific parts).
      *   **Constraint:** Do not remain neutral; take a stance.

  2.  **Deconstruct the Arguments:**

      *   **Student D (Materialist/Class Conflict/Situational):**
          *   *Claim 1:* Radicalization = class conflict (sans-culottes demanding controls/punishment).
          *   *Claim 2:* Jacobins outbid Girondins for popular support.
          *   *Claim 3:* Terror = defense against foreign invasion/counterrevolution.
          *   *Claim 4:* Victims chosen based on material position/class enemy status.
          *   *Claim 5:* Ideology is instrumental (adopted because useful to leadership under siege).

      *   **Student M (Cultural/Ideological/Contingent):**
          *   *Claim 1:* D reduces ideology to an afterthought.
          *   *Claim 2:* Terror stems from new political culture (General Will, virtue, conspiracy theories).
          *   *Claim 3:* Bread prices don't explain the *religious form* of the killing.
          *   *Claim 4:* Ideas aren't just floating; they get adopted due to interests (Wait, this was D's rebuttal. M's rebuttal to D's rebuttal is below).
          *   *Claim 5:* D's view doesn't explain timing or comparative case (France vs. Britain).
          *   *Claim 6:* Contingent events (War, Varennes, Louis's duplicity) forced the paranoid crouch.
          *   *Claim 7:* "Revolutions devour their children" is a description, not an explanation.

  3.  **Evaluate the Historiography (Mental Check):**
      *   *Classic Marxist/Social Interpretation (D):* Lefebvre, Soboul. Focus on class struggle, economic pressure, sans-culottes. *Critique:* Often downplays ideology, assumes class categories were clearer than they were, struggles to explain why "enemies" included fellow revolutionaries.
      *   *Revisionist/Cultural Interpretation (M):* Furet, Ozouf, Tackett. Focus on discourse, the invention of political culture, the logic of the General Will, contingency. *Critique:* Can drift into idealism, disconnecting ideas from material reality, sometimes ignores the very real threat of invasion/insurrection.
      *   *Synthesis/Current Consensus:* Most modern historians (e.g., McPhee, Andress, Popkin) acknowledge a mix. The material crisis created the conditions, but the ideological framework determined the *response*. The war is the crucial catalyst.

  4.  **Drafting the Adjudication (Point-by-Point):**

      *   *D1 (Class Conflict/Sans-culottes):* Partially right but oversimplified. Sans-culottes mattered, but "class" is anachronistic. *Rating:* Plausible but reductive.
      *   *D2 (Jacobins outbidding Girondins):* Right about the dynamic, wrong about the sole motive. It wasn't just cynicism. *Rating:* Mostly right on mechanism, wrong on motive.
      *   *D3 (Terror as Defense):* Right. The context of total war is essential. *Rating:* Clearly right.
      *   *D4 (Victims = Material Position):* Wrong. Many victims were bourgeois or fellow Jacobins (Danton, Desmoulins). *Rating:* Clearly mistaken.
      *   *D5 (Ideology as Instrumental):* Partially right. It was useful, but they also believed it. *Rating:* Half-right.

      *   *M1 (Ideology not afterthought):* Right. Republicanism mattered. *Rating:* Clearly right.
      *   *M2 (General Will/Virtue/Conspiracy):* Right. This explains the *intensity* and *purity* aspect. *Rating:* Clearly right.
      *   *M3 (Bread prices vs. Religious Form):* Right. Economic distress doesn't automatically lead to de-Christianization or Cult of Supreme Being. *Rating:* Clearly right.
      *   *M4 (Timing/Comparison France vs. Britain):* Strong point. Britain had unrest but no Terror. Why? *Rating:* Clearly right.
      *   *M5 (Contingency - War/Varennes):* Crucial. Without the war, the Terror is unlikely. *Rating:* Clearly right.
      *   *M6 ("Devour children" is description):* Right. It's a aphorism, not a causal mechanism. *Rating:* Clearly right.

  5.  **Synthesizing and Taking a Position:**
      *   *Who wins?* M has the stronger historiographical ground in terms of explaining the *specificity* of the Terror (why it looked the way it did), while D explains the *pressure* but not the *shape*.
      *   *What's missing?* The role of the State itself. The Terror wasn't just bottom-up (sans-culottes) or just top-down (ideology); it was about state-building in a crisis. Also, the colonial dimension (Haiti) is often ignored in this binary.
      *   *Decision:* I need to side more with M because D's materialism fails to account for the purging of the Left (Hébertists) and the specific ideological fervor. However, D is right that you can't ignore the war and economic crisis. So, M's framework + D's context.

  6.  **Refining the Output:**
