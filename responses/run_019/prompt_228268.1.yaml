          *   Yes, it exists. It's the claim that you can rule out "small universe" theories purely based on population counts without empirical data.
          *   *Is it worse than SSA's PP?* SSA's PP says you know your *rank* without looking. SIA's PP says you know the *total size* without looking. Both are epistemically suspect. SIA's might be *more* damaging because it biases cosmological priors heavily.
          *   *Infinite Certainty:* Yes, if $P(\text{Infinite}) > 0$, SIA makes $P(\text{Infinite} | \text{I exist}) = 1$. This is a major bullet.

      *   **Q3: Abandoning SIA and the Doomsday Argument.**
          *   Does $\neg \text{SIA} \implies \text{DA}$? Not necessarily.
          *   *Middle Ground:* "Hybrid" theories (e.g., Full Non-indexical Conditioning - FNC). FNC tries to use all information (including qualitative data) to break the symmetry.
          *   *Reference Class Gerrymandering:* SSA requires a reference class. SIA is often seen as reference-class invariant (mostly). Moving away from SIA often forces you back into defining "who counts as an observer," which is the gerrymandering worry.
