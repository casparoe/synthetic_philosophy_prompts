  I've been running with the self-indication assumption for a while now — roughly, that my existing as an observer is itself evidence for theories that posit more observers — mostly because the presumptuous philosopher result for SSA strikes me as damning and Doomsday-style reasoning makes me queasy. So tell me what would count against SIA. I'm not asking for the usual incredulous stare about it favoring big universes. I want: which cases make it deliver verdicts a sane person can't accept, whether it has its own equivalent of the presumptuous philosopher (I've heard it said that SIA forces you to be near-certain the cosmos is infinite before you look at a single telescope result — is that the same kind of embarrassment, worse, or not actually a consequence?), and what it stands or falls with elsewhere — e.g., does abandoning SIA really commit me to the Doomsday argument, or is there a principled middle position that isn't just ad hoc gerrymandering of the reference class? Also tell me which objections SIA's own defenders would concede are real problems versus which they'd just bite the bullet on, and rank the defeaters from fatal to merely awkward. One more wrinkle: if I switch from sampling observers to sampling observer-moments, which of these defeaters get worse and which dissolve? And if your honest verdict is that SIA has been qualified into risking nothing at all, say so and tell me whether thats a defect.
