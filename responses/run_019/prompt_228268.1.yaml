      *   *Motivation:* Avoids Doomsday Argument (DA), avoids Presumptuous Philosopher (PP) *in the SSA context*.
      *   *Known Issues:* "Presumptuous Philosopher" (SIA version), Infinite Universe bias, Sleeping Beauty (halfer vs. thirder), Procrastination paradoxes.

