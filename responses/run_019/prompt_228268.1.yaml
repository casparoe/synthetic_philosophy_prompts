          *   *The Presumptuous Philosopher (SIA version):* Bostrom's original PP was against SSA. But SIA has its own version. If Theory A says 1 billion observers and Theory B says 1 trillion, SIA says B is $10^6$ times more likely *prior to evidence*. If the theories are otherwise equiprobable physically, this seems epistemically arrogant.
          *   *The "Infinite Universe" Problem:* If there's a non-zero chance of an infinite universe, SIA drives the probability to 1. This is the "Shut Up and Multiply" problem taken to the extreme.
          *   *The "Sleeping Beauty" connection:* SIA aligns with Thirding. Some find Thirding intuitively wrong (betting issues).
          *   *The "Procrastination" / "Self-Indication Doomsday":* If I exist, maybe it's because the future is long. But if I act to shorten the future, do I retroactively lower my probability? (Causal decision theory vs. Evidential).

