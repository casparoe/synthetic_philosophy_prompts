prompt: |-
  I'm teaching a unit on whether and how we should judge historical figures morally -- Jefferson owning slaves while writing about liberty, Churchill and the Bengal famine, Columbus and everything after -- and the students keep reaching for two lazy moves: "man of his time, you can't judge" versus "evil is evil, judge away". Before I let them anywhere near the actual figures I want a spec. Write the desiderata: what any adequate account of retrospective moral judgement has to be able to do to count as a serious position rather than a vibe. For each requirement give the case or consideration behind it -- e.g. whatever you say has to handle the fact that plenty of Jefferson's own contemporaries called slavery wrong (so which contemporaries count, and does he get excused if the critics were mostly foreigners or cranks?), it has to say something about people who were better than their era on one axis and awful on another, it has to distinguish judging the person from judging whether we should still name buildings after them, and it has to deal with genuine moral ignorance where arguably nobody could have known better. Which requirements are non-negotiable vs which are just one camp's preference? And the bit I care about most: are any of the plausible desiderata jointly unsatisfiable -- e.g. "judge only by standards available to them" against "our judgements should track what was actually wrong" -- because if the list itself is inconsistent that's the lecture. Finish by noting which single requirement kills off the most of the lazy heuristics my students use. Don't just score Jefferson/Churchill/Columbus at the end, I'll do that in class.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for retrospective moral judgment:

  1.  **Analyze the Request:**
      *   **Topic:** Retrospective moral judgment of historical figures (Jefferson, Churchill, Columbus, etc.).
      *   **Problem:** Students rely on lazy heuristics ("man of his time" vs. "evil is evil").
      *   **Task:** Create a specification (desiderata) for an *adequate account* of retrospective moral judgment.
      *   **Requirements:**
          *   List specific requirements (desiderata).
          *   Provide the case/consideration behind each (why is this needed?).
          *   Distinguish non-negotiable vs. preference.
          *   Identify potential inconsistencies/trade-offs between desiderata (the "lecture" point).
          *   Identify the single requirement that kills the most lazy heuristics.
          *   *Constraint:* Do not score the specific figures (Jefferson, Churchill, Columbus) at the end.

  2.  **Deconstruct the "Lazy Moves":**
      *   *Move 1: "Man of his time" (Relativism/Contextualism).* Problem: Ignores dissenters within the time, implies moral progress is impossible or arbitrary, lets genuine cruelty slide.
      *   *Move 2: "Evil is evil" (Presentism/Absolutism).* Problem: Ignores epistemic limitations, flattens nuance, makes moral agency impossible if standards shift constantly, leads to condemning almost everyone.

  3.  **Brainstorming Desiderata (What must a theory do?):**
      *   Must handle *epistemic access* (could they know better?).
      *   Must handle *moral truth* (was slavery actually wrong, regardless of belief?).
      *   Must handle *agency/virtue* (did they try? were they hypocritical?).
      *   Must handle *consequences/legacy* (does the judgment affect how we treat their memory today?).
      *   Must handle *complexity* (good on X, bad on Y).
      *   Must distinguish *blame* from *assessment*.

  4.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Epistemic Availability.* They can't be blamed for what they couldn't know.
          *   *Case:* Genuine moral ignorance (e.g., germ theory analogy, or perhaps ancient views on consent).
          *   *Refinement:* Needs to account for *available dissent*. Jefferson knew people who thought slavery was wrong.

      *   *Idea 2: Moral Realism vs. Relativism.* We need to say slavery *was* wrong, not just "we think it's wrong now."
          *   *Case:* If we don't say it was objectively wrong, we can't condemn it now either.
          *   *Refinement:* The "Tracking Truth" requirement.

      *   *Idea 3: The "Better on One Axis" Problem.*
          *   *Case:* A feminist who is a racist. A humanitarian who is a sexist.
          *   *Refinement:* Granularity. Judgment must be specific, not holistic "hero/villain" binaries.

      *   *Idea 4: The Purpose of Judgment.*
          *   *Case:* Naming buildings vs. writing history books.
          *   *Refinement:* Distinction between *moral evaluation* (historical) and *honorific commemoration* (civic).

      *   *Idea 5: Hypocrisy/Integrity.*
          *   *Case:* Jefferson writing "all men created equal" while owning slaves.
          *   *Refinement:* Internal coherence matters. Violating one's *own* stated principles is worse than violating future principles.

  5.  **Selecting and Refining the List:**
      *   Let's aim for 5-6 strong desiderata.
      *   1. *Epistemic Accessibility* (Could they know?).
      *   2. *Objective Wrongness* (Was it actually wrong?).
      *   3. *Internal Consistency* (Did they violate their own standards?).
      *   4. *Granularity* (No holistic canceling).
      *   5. *Functional Distinction* (Judgment vs. Commemoration).

  6.  **Addressing the "Non-Negotiable vs. Preference" Constraint:**
      *   *Non-Negotiable:* Epistemic Accessibility (otherwise blame is unfair), Objective Wrongness (otherwise morality is just fashion), Granularity (otherwise history is cartoonish).
      *   *Preference/Debated:* Functional Distinction (some say *any* honor is moral endorsement, others say it's pragmatic), Weight of Hypocrisy (is it worse to break your own rules or universal rules?).

  7.  **Addressing the "Jointly Unsatisfiable" Constraint (The Tension):**
      *   This is the core philosophical meat.
      *   *Tension:* "Epistemic Accessibility" (Judge by what they could know) vs. "Objective Wrongness" (Judge by what is true).
      *   *Example:* If slavery was objectively wrong in 1776, but Jefferson couldn't fully grasp *why* (due to pervasive ideology), do we blame him?
      *   *The "Ought Implies Can" problem:* If morality demands truth, but agents are limited by context, we have a paradox.
      *   *Another Tension:* "Granularity" vs. "Holistic Legacy." We want nuance, but public memory demands symbols.

  8.  **Identifying the "Lazy Heuristic Killer":**
      *   Which requirement stops "Man of his time"? *Epistemic Accessibility + Available Dissent.* (Shows they *could* have known).
      *   Which requirement stops "Evil is Evil"? *Epistemic Accessibility.* (Shows they *couldn't* have known).
      *   *Winner:* **The Dissent/Accessibility Condition.** It forces students to look for *contemporaneous critics*. If critics existed, "man of his time" fails. If no critics existed, "evil is evil" fails. It forces research over vibes.

  9.  **Review against Constraints:**
      *   Did I score Jefferson/Churchill/Columbus? *No.*
      *   Did I list desiderata with cases? *Yes.*
      *   Did I distinguish non-negotiable vs. preference? *Yes.*
      *   Did I identify inconsistencies? *Yes.*
      *   Did I identify the killer requirement? *Yes.*
      *   Tone: Academic, rigorous, suitable for a teacher preparing a lecture.

  10. **Final Polish:** Ensure clear headings and precise philosophical language (e.g., "proleptic judgment," "epistemic limitation"). Make sure the tension section is punchy, as that's the "lecture" core. (Self-Correction: Make sure to emphasize the "Available Dissent" aspect within Epistemic Accessibility, as that specifically targets the Jefferson case mentioned in the prompt).

  11. **Final Output Generation** (Proceeding to draft response based on these thoughts).
answer: |-
  Here is a specification for an adequate theory of retrospective moral judgment. This is designed to force students out of binary thinking and into the mechanics of ethical reasoning.

  ### The Desiderata for Retrospective Moral Judgment

  An adequate account must satisfy the following five requirements. If a student's position violates one of these without justification, it is a "vibe," not a theory.

  #### 1. The Epistemic Accessibility Condition
  **Requirement:** Moral blame requires that the agent had reasonable access to the moral truth they violated.
  **The Case:** You cannot blame a surgeon in 1600 for not using sterile techniques; germ theory was not epistemically available. Similarly, if a historical figure operated under a moral framework where a specific action was universally considered permissible (e.g., certain forms of conquest in antiquity), blanket condemnation ignores the limits of human moral cognition.
  **Why it blocks lazy moves:** It kills the "evil is evil" presentism. It forces the question: *Could they have known?*

  #### 2. The Contemporaneous Dissent Clause
  **Requirement:** Epistemic accessibility is proven by the existence of credible critics *within the agent's own time and culture*.
  **The Case:** This specifically targets the "man of his time" defense regarding Jefferson. If 5% of Jefferson's peers (e.g., Quakers, certain French philosophers, freed Black writers) argued that slavery was wrong, then the moral truth *was* accessible. The existence of dissenters proves the prevailing norm was not a total epistemic blackout.
  **Why it blocks lazy moves:** It kills the "man of his time" relativism. It forces the question: *Did anyone tell him he was wrong, and did he listen?*

  #### 3. The Internal Coherence Standard
  **Requirement:** Agents are held to a higher standard of accountability for violating principles they explicitly endorsed themselves.
  **The Case:** A monarch who kills rivals is operating within standard royal praxis. A revolutionary who writes "all men are created equal" while enslaving people is violating their own stated ontology. Hypocrisy is a distinct moral failure from mere wrongdoing because it involves a betrayal of one's own professed rationality.
  **Why it blocks lazy moves:** It prevents holistic "hero/villain" binaries. It allows you to say someone was a brilliant political theorist *and* a moral fraud simultaneously.

  #### 4. The Dimensionality Requirement (Granularity)
  **Requirement:** Moral judgment must be axis-specific, not holistic. Competence or virtue on Axis A (e.g., military leadership) cannot mathematically cancel out vice on Axis B (e.g., civilian starvation).
  **The Case:** Churchill's leadership against fascism and his indifference to the Bengal famine are distinct moral events. A "net positive" score is a category error. We must be able to say, "He was essential for victory in Europe and culpable for negligence in Asia," without one erasing the other.
  **Why it blocks lazy moves:** It prevents the "great man" whitewashing and the "cancel culture" erasure. It demands nuance.

  #### 5. The Functional Distinction (Assessment vs. Commemoration)
  **Requirement:** The theory must distinguish between *historical moral assessment* (what they did) and *civic honorifics* (what we do with their names/statues).
  **The Case:** We might judge that a figure was morally flawed (Assessment) but decide their name stays on a building because removing it erases history, or conversely, that they were complex (Assessment) but their name comes down because the building serves a population they oppressed (Commemoration).
  **Why it blocks lazy moves:** It stops the conflation of "judging the past" with "renaming the present."

  ---

  ### Non-Negotiable vs. Contested Preferences

  **Non-Negotiable (The Floor):**
  *   **Epistemic Accessibility:** If you blame people for things they literally could not conceive of, your moral system is magical, not ethical.
  *   **Dimensionality:** If you allow virtues to cancel vices, you justify atrocity committed by "great" people.
  *   **Objective Wrongness (Implicit):** You must maintain that slavery/famine *were actually wrong*, not just "wrong for us now." If morality is just time-stamped preference, you lose the ground to condemn anything in the present.

  **Contested Preferences (The Ceiling):**
  *   **The Weight of Hypocrisy:** Some theories argue violating universal human rights is worse than violating your own principles. Others argue hypocrisy is the only thing we can truly judge, since we can't access universal truth.
  *   **Functional Distinction:** Some camps argue that *any* honorific implies moral endorsement, so Assessment and Commemoration cannot be separated. Others argue buildings are infrastructure, not shrines.

  ---

  ### The Inconsistency: Where the Theory Breaks

  This is the core of your lecture. There is a tension between **Desideratum 1 (Epistemic Accessibility)** and the implicit requirement of **Moral Realism (Objective Wrongness).**

  *   **The Conflict:** If slavery was *objectively* wrong in 1776 (Moral Realism), then Jefferson was doing wrong. But if the prevailing epistemic environment made it nearly impossible for him to fully grasp *why* (Epistemic Accessibility), then blaming him seems unfair.
  *   **The Paradox:**
      *   If you prioritize **Accessibility**, you risk sliding into relativism ("He couldn't know, so he's off the hook"), which undermines the idea that slavery was *actually* evil at the time.
      *   If you prioritize **Realism**, you risk presentism ("It was evil, so he's evil"), which ignores the sociological constraints on moral reasoning.
  *   **The Lecture Point:** An adequate theory must explain how an action can be *objectively wrong* but the agent *partially excused*. If your theory can't hold both thoughts in your head at once, it's insufficient. This is the gap between *evaluating the act* and *evaluating the agent*.

  ---

  ### The Single Requirement That Kills the Most Lazy Heuristics

  **The Contemporaneous Dissent Clause (part of Desideratum 2).**

  This is the scalpel that dissects both student positions instantly.

  1.  **Against "Man of his time":** If the student claims Jefferson couldn't know slavery was wrong, you ask: "Who was saying it was wrong in 1776?" Once the student finds that people *were* saying it (Benjamin Rush, Quaker petitions, Somerset case rulings), the "he couldn't know" defense collapses. He *could* know; he chose not to.
  2.  **Against "Evil is evil":** If the student claims Churchill was a monster for the Bengal famine, you ask: "What was the epistemic consensus on colonial resource allocation in 1943?" If the student finds that the prevailing economic/military logic of the time (even among critics) obscured the famine's causality, the "he knew and didn't care" narrative requires more evidence. It forces them to prove *mens rea* (guilty mind) rather than assuming it.

  It forces research over intuition. It moves the debate from "How do I feel?" to "What was knowable then?"
