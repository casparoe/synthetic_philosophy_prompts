          *   Cost: It complicates the Bayesian framework. You need rules for how to select the new distribution based on constraints, not just evidence propositions. It opens the door to subjectivity in how constraints are framed.
      *   **Alternative View (McGee/Adams):** Some argue indicative conditionals aren't propositions at all (no truth conditions), so you *can't* conditionalize on them. You update on the conditional probability directly.
      *   **Reassure:** This doesn't destroy Bayesianism, but it refines it. It shows the limitation of the "Propositional Learning" model.

  5.  **Refine the Tone:**
