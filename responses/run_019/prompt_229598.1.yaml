answer: |-
  # Final Exam: Probability & Anthropics (PHIL 450)
  **Time:** 75 Minutes  
  **Total Marks:** 30

  **Question 1: The Cosmological Census (30 Marks)**

  Cosmologists have narrowed physical reality down to two theories, **SPARSE** and **CROWDED**, which agree on all non-anthropic observations. The physical priors are 50/50.
  *   **SPARSE:** Only one technological civilization ever exists. Total observer-lives: $10^{14}$.
  *   **CROWDED:** $10^6$ causally isolated civilizations exist. Total observer-lives: $10^{20}$.

  You are an observer evaluating these theories. Answer the following:

  **(a)** Calculate the posterior odds of CROWDED vs. SPARSE using the **Self-Indication Assumption (SIA)** given only that you exist. Explain why the **Self-Sampling Assumption (SSA)** leaves the odds at 1:1 in this specific step. (5 marks)

  **(b)** **The Astronomer Twist:** You learn you are an astronomer. 
  *   In **SPARSE**, the single civilization develops astronomy, producing $10^8$ astronomer-lives.
  *   In **CROWDED**, only 1 in $10^3$ civilizations develops astronomy. Each successful civilization produces $10^8$ astronomer-lives.
  Calculate the likelihood ratio $P(\text{Astronomer} | \text{CROWDED}) / P(\text{Astronomer} | \text{SPARSE})$. Combine this with your results from (a) to find the final posterior odds for both SIA and SSA. Show your work. (15 marks)

  **(c)** SIA's result in (b) allows you to become near-certain about the size of the cosmos from the armchair (the "Presumptuous Philosopher" objection). Is this a *reductio*? In your answer, identify the symmetric "armchair embarrassment" faced by SSA proponents. (5 marks)

  **(d)** Can either theory escape these embarrassments by adjusting the **reference class**? Discuss the sensitivity of SSA's verdict in (b) to reference class selection, and identify the distinct structural problem SIA faces if CROWDED implies an *infinite* number of observers. (5 marks)

  ***

  # Model Answer

  **(a) Initial Anthropics**
  Under **SIA**, your existence is evidence favoring hypotheses with more observers. The likelihood of existence is proportional to $N$, the total number of observers.
  $P(\text{Exist} | \text{CROWDED}) / P(\text{Exist} | \text{SPARSE}) = 10^{20} / 10^{14} = 10^6$.
  Starting from 1:1 priors, SIA posterior odds are **$10^6 : 1$ in favor of CROWDED**.

  Under **SSA**, you reason as a random sample from the set of actually existing observers in your reference class. Since you exist in both hypotheses, the probability of sampling *some* observer who exists is 1 in both cases. SSA does not update on total population size alone, only on your specific properties relative to the population. Thus, SSA odds remain **1:1**.

  **(b) The Astronomer Update**
  First, calculate the fraction of observers who are astronomers ($f_A$) in each theory.
  **CROWDED:** $10^6$ civilizations $\times$ $10^{-3}$ success rate = $10^3$ astronomer-civilizations.
  Total Astronomers = $10^3 \times 10^8 = 10^{11}$.
  Total Observers = $10^{20}$.
  $f_A(C) = 10^{11} / 10^{20} = 10^{-9}$.

  **SPARSE:** 1 civilization (success rate 1).
  Total Astronomers = $1 \times 10^8 = 10^8$.
  Total Observers = $10^{14}$.
  $f_A(S) = 10^8 / 10^{14} = 10^{-6}$.

  **Likelihood Ratio:** $L = f_A(C) / f_A(S) = 10^{-9} / 10^{-6} = 10^{-3}$.

  **Final Odds:**
  **SIA:** Initial ($10^6 : 1$) $\times$ Likelihood ($10^{-3}$) = **$1000 : 1$ for CROWDED**.
  **SSA:** Initial ($1 : 1$) $\times$ Likelihood ($10^{-3}$) = $1 : 1000$ = **$1000 : 1$ for SPARSE**.

  **(c) Armchair Embarrassments**
  SIA's verdict is often attacked as presumptuous: it implies we can infer the universe is vast simply because we exist, without telescopic data. However, this is not a unique *reductio*. SSA faces the **Doomsday Argument**: if you assume you are a random sample of all humans who will ever live, and you find yourself early in the timeline, SSA forces you to predict imminent extinction (a small total $N$). Both principles allow armchair reasoning to override physical priors regarding total population counts; rejecting SIA solely for presumption requires accepting SSA's equally counterintuitive Doomsday conclusion.

  **(d) Reference Classes & Infinity**
  SSA is critically sensitive to the reference class. If the class in (b) is restricted to "Astronomers," $P(\text{Astronomer} | T)$ becomes 1 for both theories, the likelihood ratio becomes 1, and SSA reverts to 1:1 odds, erasing the SPARSE preference. This fragility is a major weakness. SIA avoids reference class dependence for the existence update but faces the **Measure Problem** in infinite universes. If CROWDED implies infinite observers, SIA assigns it probability 1 (or becomes undefined), requiring arbitrary cutoffs or measures to function, which reintroduces the ambiguity SSA suffers from.

  ***

  # Marking Scheme

  | Move | Marks | Must-Hit Criteria | Common Student Error |
  | :--- | :---: | :--- | :--- |
  | **1. Initial Updates (Part a)** | 5 | Correctly identifies SIA updates by $N$ ratio ($10^6$) and SSA does not update on mere existence (1:1). | Claiming SSA updates on $N$ (conflating with SIA) or claiming SIA ignores $N$. |
  | **2. Likelihood Calculation (Part b)** | 10 | Correctly computes astronomer fractions: $10^{-9}$ (CROWDED) and $10^{-6}$ (SPARSE). Derives ratio $10^{-3}$. | Calculating total astronomers but failing to divide by total observers to get probability/fraction. |
  | **3. Final Odds (Part b)** | 5 | Correctly applies ratio to priors. SIA $\to$ 1000:1 CROWDED. SSA $\to$ 1000:1 SPARSE. | Applying the likelihood ratio to the wrong hypothesis (flipping the favor) or forgetting the SIA head-start. |
  | **4. Symmetric Embarrassment (Part c)** | 5 | Identifies "Presumptuous Philosopher" for SIA and explicitly names/describes **Doomsday Argument** for SSA. | Arguing SIA is wrong *because* it is presumptuous without noting SSA has an equivalent armchair problem. |
  | **5. Reference Class/Infinity (Part d)** | 5 | Notes SSA verdict vanishes/flips if class = "Astronomers". Notes SIA breaks/needs measure if $N = \infty$. | Claiming SIA uses reference classes (it typically doesn't for existence) or missing the infinity problem. |
  | **Total** | **30** | | |
