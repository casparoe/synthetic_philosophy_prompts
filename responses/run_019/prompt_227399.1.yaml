answer: |-
  Here is the disambiguation of "What if everybody did that?" (WIEDT) into four distinct ethical principles. Use this menu to force your flatmate to specify which rule he is actually invoking.

  ### 1. The Menu of Principles

  **Principle A: Generalized Consequences (Rule Utilitarianism)**
  *   **The Claim:** An act is wrong if the *general practice* of that act would produce worse overall outcomes than the alternative practice, even if *this specific instance* is harmless.
  *   **Precision:** We evaluate the utility of the *rule* ("People may call in sick when burned out"), not the *act*. If the rule leads to economic collapse or loss of trust, the act is forbidden.
  *   **Plausibility:** High. It protects systems that rely on cooperation.
  *   **Verdict on You:** **Guilty.** Even if your single day doesn't hurt the company, the *policy* of allowing burnout-days might be unsustainable.

  **Principle B: The Fairness Principle (Free-Riding)**
  *   **The Claim:** An act is wrong if it exploits a cooperative scheme maintained by others' self-restraint. You are taking a benefit (trust/leisure) that is only available because others are denying it to themselves.
  *   **Precision:** This is not about outcomes; it's about equity. It asks: "Am I gaining an advantage over my colleagues by defecting from a norm they uphold?"
  *   **Plausibility:** High. It captures the intuition of "cutting in line."
  *   **Verdict on You:** **Guilty.** You are benefiting from the employer's trust, which is maintained by colleagues who drag themselves in when exhausted.

  **Principle C: Kantian Universalizability**
  *   **The Claim:** An act is wrong if the *maxim* behind it (e.g., "I will lie when inconvenient") becomes self-defeating when imagined as a law of nature.
  *   **Precision:** This is a logical test, not an empirical one. If everyone lied about sickness, the concept of "calling in sick" would cease to signal "inability to work," rendering your lie ineffective. You cannot coherently will a world where your lie works.
  *   **Plausibility:** Medium. It depends on whether "burnout" counts as a valid reason for sick leave. If "sick" includes mental health, you aren't lying, and this principle collapses.
  *   **Verdict on You:** **Guilty** (if "sick" means physical only) / **Not Guilty** (if "sick" includes mental health).

  **Principle D: Deontological Rule Worship**
  *   **The Claim:** An act is wrong simply because it violates an established rule or contract, regardless of consequences, fairness, or logic.
  *   **Precision:** "The contract says 'sick leave is for illness.' You were not physically ill. You broke the rule." WIEDT is just a rhetorical flourish here; the rule itself is the authority.
  *   **Plausibility:** Low. It offers no justification for *why* the rule exists, only that it does.
  *   **Verdict on You:** **Guilty.** You violated the literal terms of the agreement.

  ***

  ### 2. The "Isolated Act" Test
  *You asked: Which readings condemn me even if we stipulate that almost nobody else will ever fake a sick day, so the bad consequences never materialize?*

  *   **Principle A (Generalized Consequences):** **Condemns you.** It doesn't matter if nobody else *actually* does it; it matters that the *rule* allowing it is dangerous.
  *   **Principle B (Fairness):** **Condemns you most harshly.** If you are the *only* one doing it, you are the ultimate free-rider. You are exploiting the restraint of 100% of your colleagues.
  *   **Principle C (Kantian):** **Condemns you.** The contradiction is logical, not statistical. Even if you are the only liar in the universe, you are relying on a practice (truth-telling) that your maxim seeks to undermine.
  *   **Principle D (Rule Worship):** **Condemns you.** A rule broken is a rule broken, regardless of how many others obey it.

  **The Only Escape:** The only reading that lets you off the hook under this stipulation is **Act Consequences** (a variant of A not usually implied by WIEDT). If the argument is strictly "Will *this specific day* cause financial loss?", and the answer is no, then Act Consequences says you are innocent. But your flatmate used WIEDT, which explicitly rejects Act Consequences in favor of Generalized/Rule Consequences.

  ***

  ### 3. Which Readings Collapse?
  **Principle A (Generalized Consequences) and Principle B (Fairness) often collapse.**
  In practice, the "bad consequence" of everyone faking sick days is usually that the system becomes unfair or trust evaporates. The "unfairness" *is* the negative utility. If your flatmate argues that the company will lose trust (Consequence), he is usually describing the same state of affairs as "you are taking advantage of their trust" (Fairness).

  **Principle C (Kantian) and Principle D (Rule Worship) often collapse.**
  While philosophically distinct, in a workplace argument, "You can't universalize that maxim" and "You broke the rule" function identically. Both appeal to the existence of a norm as a binding constraint that overrides your immediate needs.

  ***

  ### 4. The Divergence Case (Opposite Verdicts)
  *You asked for a case where two readings deliver opposite verdicts to prove they are different.*

  **The Case: The Secret Charity**
  You steal $1,000 from a massive, insured corporation to save a starving child. You will never get caught, and the corporation's premiums won't rise (no empirical negative consequences).

  *   **Principle B (Fairness) Verdict: Permissible.**
      There is no "cooperative scheme" you are undermining. The corporation is not a cooperator; it is an entity. No specific individual is being treated unfairly or burdened by your theft. You are not "cutting in line."
  *   **Principle D (Rule Worship) / Principle C (Kantian) Verdict: Impermissible.**
      "Stealing when convenient" cannot be a universal law (Kant), or it violates the rule "Do not steal" (Rule Worship). The act is forbidden regardless of the lack of victims or unfairness.

  *This proves Fairness and Rule-Worship are not the same argument.*

  ***

  ### 5. The Flatmate Diagnosis
  *Which reading is he probably using?*

  He is almost certainly using **Principle B (Fairness)** disguised as **Principle A (Generalized Consequences).**

  **Evidence:**
  1.  **The "Argument Ender" Tactic:** WIEDT is a classic conversation-stopper used when someone feels a norm has been violated but doesn't want to articulate the grievance. It shifts the focus from "You hurt me/us" to "You broke the universe."
  2.  **The Context:** In a shared flat/work dynamic, the primary tension is rarely about abstract logical consistency (Kant) or pure economic utility (Consequences). It is about **reciprocity**. He likely feels that you are accessing a benefit (rest) that he denies himself, or that you are violating a shared understanding of "how we behave here."
  3.  **The Repetition:** When he repeated it "louder," he wasn't offering more data about consequences; he was signaling moral outrage. This is the hallmark of the Fairness intuition ("It's not fair!") masquerading as objective prediction ("The world will end!").

  **Your Ammunition:**
  If you want to win Round Two, do not argue consequences (he will just say "trust will erode"). Attack the **Fairness** premise.
  *   *Argument:* "You are treating this as a Free-Rider problem. But free-riding requires I gain an *unfair* advantage. If burnout is a legitimate health risk, I am not 'defecting' from a norm of health; I am using the safety net exactly as designed. Is your argument that I'm lying, or that I'm not allowed to be mentally exhausted?"

  If he admits it's about the *lie*, you are in Kantian territory (define "sick"). If he admits it's about the *rest*, you are in Fairness territory (challenge why rest is unfair).
