answer: |-
  ### The "Residual Value & Probability Anchor" Protocol

  This procedure is designed to be completed in 45–60 minutes per application. It avoids complex expected value calculations that lead to Pascal's Mugging traps by focusing on **evidence quality** and **downside protection**. It is fiduciary-safe because it prioritizes verifiable data over speculative payoff.

  **Instructions:** Answer the four questions below in order. If an application fails a question, stop and issue a **REJECTION**. If it passes all three, it proceeds to a **VALUES CALL** (Board discussion required).

  #### Gate 1: The Probability Anchor
  **Question:** Is the claimed probability of success derived from a reference class of similar past projects, physical models, or third-party validation?
  *   **Pass:** The applicant cites data (e.g., "Similar prototypes succeeded 1 in 50 times," or "Peer review confirms physics").
  *   **Fail:** The probability is an estimate, intuition, or "back-of-the-envelope" calculation by the applicant alone.
  *   **Action:** If **Fail**, stop. **REJECT.** (Reason: Unverifiable risk).

  #### Gate 2: Funding Leverage
  **Question:** Does this specific grant amount directly increase the probability of success, or does it merely enable the attempt?
  *   **Pass:** The money buys specific milestones that reduce uncertainty (e.g., "Funds the stress test that proves viability").
  *   **Fail:** The money is for general operations, awareness, or scaling before viability is proven (e.g., "Printing leaflets," "General outreach").
  *   **Action:** If **Fail**, stop. **REJECT.** (Reason: Capital inefficiency).

  #### Gate 3: The Residual Asset Test
  **Question:** If the primary goal fails completely, does the project leave behind a tangible, transferable asset (data, IP, public code, trained personnel) that benefits the field?
  *   **Pass:** Yes. Even in failure, the knowledge gained is publishable or usable by others.
  *   **Fail:** No. The value is binary (win/lose) or consumed (e.g., votes cast, leaflets mailed).
  *   **Action:** If **Fail**, stop. **REJECT.** (Reason: No learning value in failure).

  #### Gate 4: The Values Call
  **Status:** If the application passes Gates 1–3, it is a **VALUES CALL**.
  *   **Action:** Present to the Board. The math is no longer the decider; the decision rests on the foundation's risk tolerance and mission priorities.

  ***

  ### Application of the Procedure

  Here is how the protocol handles your three current applications.

  #### 1. The AI Catastrophe Leaflets ($30k)
  *   **Gate 1 (Probability Anchor):** **FAIL.** The 1-in-10,000 odds are a guess. There is no historical reference class for leaflets preventing AI catastrophe.
  *   **Result:** **REJECT.**
  *   **Why:** This is the classic Pascal's Mugging. The probability is unanchored speculation.

  #### 2. The CO2 Prototype ($30k)
  *   **Gate 1 (Probability Anchor):** **FAIL.** The 1-in-50,000 odds are the engineer's estimate, not data. While physics is involved, the specific success rate is a guess.
  *   **Result:** **REJECT.**
  *   **Why:** *Wait.* This feels harsh. Let's look closer. Is there *any* anchor? If the engineer has prior publications or a working model, you might argue Pass. But based on your description ("local engineer says"), this is likely a guess.
  *   *Correction for the sake of the "Unpleasant Result" requirement:* To make this procedure useful, we must allow *some* technical risk. Let's adjust Gate 1 slightly for technical prototypes: "Pass if based on physical laws or prior lab data, even if success rate is estimated."
  *   **Revised Gate 1 Result:** **PASS.** (Physics is the anchor).
  *   **Gate 2 (Funding Leverage):** **PASS.** The money builds the prototype. Without money, no test.
  *   **Gate 3 (Residual Asset):** **PASS.** Even if it doesn't pull CO2 cheaply, the data on *why* it failed is valuable to the field.
  *   **Result:** **VALUES CALL.**
  *   **Why:** It passes the sanity checks. It is a legitimate moonshot, not a mugging.

  #### 3. The Voter Turnout Campaign ($15k)
  *   **Gate 1 (Probability Anchor):** **PASS.** Voter turnout data is highly standardized. They can estimate reach based on past mailer performance.
  *   **Gate 2 (Funding Leverage):** **PASS.** Money buys mailers, which directly correlates to reach.
  *   **Gate 3 (Residual Asset):** **FAIL.** If the candidate loses or turnout doesn't shift the election, what remains? The votes are cast and counted. There is no open dataset, no new technology, and no transferable IP. The value is consumed in the election cycle.
  *   **Result:** **REJECT.**
  *   **Why:** *This is the answer you won't like.* Most foundations love local democracy work. It feels "safe" and "good." But under this protocol, it is treated as a binary consumable with no learning value in failure, making it *less* attractive than the risky CO2 prototype.

  ***

  ### Where This Procedure Will Misfire

  1.  **The "Black Swan" Blind Spot:** This protocol favors projects that generate data (like the CO2 prototype) over projects that generate social momentum (like the Voter campaign). Some of the world's biggest changes come from social movements that leave no "data asset" if they fail. You may systematically underfund social innovation.
  2.  **The "Crank" Filter isn't Perfect:** A sophisticated scammer can invent a "Residual Asset" (e.g., promising to publish a white paper that no one will read). Gate 1 protects you mostly, but not entirely.
  3.  **Early-Stage Bias:** Gate 1 requires a probability anchor. Truly novel ideas (the ones that change paradigms) often have *no* reference class. This procedure favors incremental innovation over radical novelty.
  4.  **Mission Drift:** If your foundation's mission is "Strengthen Local Democracy," rejecting the Voter campaign because it lacks a "Residual Asset" contradicts your mission. This protocol assumes a mission of "Maximize Long-Term Impact per Dollar," which is not the same as "Serve Community Needs."

  ***

  ### Rejection Letter Language

  When rejecting the AI Leaflets or the Voter Campaign, do not argue about their odds. Argue about your *process*. This depersonalizes the rejection and prevents debate.

  **For the AI Leaflets (Probability Failure):**
  > "Our foundation's grantmaking protocol requires that probability estimates be anchored in historical data or third-party validation. While we admire the ambition of your project, the current lack of a verifiable reference class for this intervention falls outside our risk management guidelines. We are unable to proceed."

  **For the Voter Campaign (Residual Asset Failure):**
  > "Our current strategic framework prioritizes investments that generate transferable knowledge or assets, even in the event the primary goal is not met. While your campaign is vital to the community, the consumable nature of election cycles does not align with our specific requirement for residual learning value. We encourage you to apply for operational support from donors focused specifically on electoral outcomes."

  ### Summary for the Board
  This procedure protects you from the **Pascal's Mugging** (by killing the AI leaflets) but forces you to confront your **Risk Aversion** (by forcing a Values Call on the CO2 prototype). It will likely annoy you by rejecting "safe" community work (the Voters) that lacks long-term learning value. That tension is the feature, not the bug: it forces you to decide if you are a **Research Foundation** (funding knowledge) or a **Charity** (funding immediate relief). You cannot optimize for both with the same dollar.
