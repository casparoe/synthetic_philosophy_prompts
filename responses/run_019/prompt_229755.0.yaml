answer: |-
  # Workshop Design: The Twelve Snippets
  **Facilitator Guide**

  **Topic:** Narrative Underdetermination and Shared Convention
  **Duration:** 90 Minutes
  **Participants:** 12–16 Writers (Mixed levels)
  **Room Setup:** Tables arranged for pairs, with one large whiteboard or projection surface visible to all.

  ## Materials Required
  1.  **Handout A:** Three Bongard Problems (two geometric, one narrative). *See Appendix 1.*
  2.  **Handout B:** "The Twelve Snippets" Scorecard (one per participant). *See Appendix 2.*
  3.  **Index Cards:** 3 per participant.
  4.  **Pens:** One per participant.
  5.  **Timer:** Visible to the facilitator.
  6.  **Whiteboard/Flipchart:** For recording rules during the debrief.

  ---

  ## Part 1: The Warm-Up Puzzles (15 Minutes)

  **Goal:** Induce the cognitive state of pattern recognition without explaining the theory.

  **Instructions:**
  1.  Distribute **Handout A**.
  2.  Tell the room: *"On this sheet are three puzzles. Each puzzle has a Left Set and a Right Set. In every puzzle, the six items on the Left share a rule. The six items on the Right do not. You have 8 minutes to write down the rule for all three. Do not discuss with your neighbor yet."*
  3.  **8 Minutes:** Participants solve silently.
  4.  **7 Minutes:** Reveal the intended rules. Ask for alternative rules that also fit.
      *   *Facilitator Script:* "Who solved Puzzle 1? What was the rule?" (Confirm intended rule). "Did anyone find a different rule that still fits all twelve boxes?"
      *   *Note:* If no one finds an alternative, offer one yourself gently. *"For example, in Puzzle 3, I noticed all the Left sentences have verbs in the past tense. The Right do not. That also fits. Is that the same rule as the intended one? Maybe. Maybe not."*
  5.  **Transition:** Do not explain *why* you did this. Collect Handout A. Say: *"Keep that feeling of uncertainty in mind. We are going to use it."*

  ---

  ## Part 2: The Twelve Snippets Game (55 Minutes)

  **Goal:** Experience the gap between intended meaning and textual evidence.

  ### Phase 1: Construction (15 Minutes)
  1.  Distribute **Handout B** and Index Cards.
  2.  **Instruction:** *"You are now the Designer. Choose a secret rule. It can be about grammar, tone, content, or syntax. It must be binary (Yes/No)."*
      *   *Examples:* "Sentences where the subject is inanimate," "Moments of betrayal," "Sentences without the letter 'e'."
      *   *Constraint:* "Write 12 snippets. Six that obey the rule (Yes), six that violate it (No). Keep them short—one sentence or a title. Write them on the Index Cards. Do not write the rule down yet."
  3.  **Timer:** 15 Minutes.

  ### Phase 2: The Duel (20 Minutes)
  1.  **Pairing:** Participants pair up.
  2.  **Instruction:** *"Swap cards with your partner. You are now the Guesser. Look at their 12 snippets. You have 5 minutes to propose a rule that fits all of them."*
  3.  **Scoring Mechanics (Crucial):**
      *   **Guesser:** Gets **2 Points** if they guess the *Intended Rule*. Gets **1 Point** if they propose *Any Rule* that fits all 12 examples (even if it wasn't the intended one).
      *   **Designer:** Gets **2 Points** *only* if the Guesser finds the *Intended Rule* first. If the Guesser finds a different valid rule, the Designer gets **0 Points** for that round.
      *   *Facilitator Note:* Emphasize this. *"Designers, your goal is to make your rule obvious. Guessers, your goal is to find consistency. If you find a rule that fits, you score, even if the Designer says 'That's not what I meant.' If it fits the text, it counts."*
  4.  **Action:** 5 minutes per person (10 mins total). Then switch roles (10 mins total).
  5.  **Recording:** On Handout B, record the Intended Rule, the Guessed Rule, and the Points.

  ### Phase 3: The Group Harvest (20 Minutes)
  1.  **Selection:** Ask for 3 volunteers who had a "mismatch" (where the Guesser found a valid rule that was *not* the Intended Rule).
  2.  **Display:** Write their 12 snippets on the whiteboard (Yes column / No column). Do not reveal the rules yet.
  3.  **Open Floor:** *"Look at Set 1. The Designer meant X. The Guesser found Y. Both fit. Who else sees a Rule Z that also fits these 12 snippets?"*
  4.  **Scoring Bystanders:** Any participant who shouts out a third valid rule gets **1 Point**.
  5.  **The Moment:** When a new rule is found, ask the Designer: *"Does this fit?"* If they say "Yes, but..." stop them. *"If it fits the examples, it is in play."*
  6.  **Transition:** *"Keep your scorecards. We will stop the game here."*

  ---

  ## Part 3: Debrief & Theory Check (20 Minutes)

  **Goal:** Map the game to writing without overstating the philosophy.

  **Facilitator Script Guide:**

  **1. The Feeling (5 Minutes)**
  *   Ask: *"Designers, how did it feel when a Guesser found a rule you didn't intend, but couldn't argue against?"*
  *   Ask: *"Guessers, how did it feel to realize you could 'beat' the Designer by finding a pattern they didn't see?"*
  *   *Listen for:* Frustration, surprise, liberation.

  **2. The Map (10 Minutes)**
  *   Draw a triangle on the board: **Text — Reader — Writer**.
  *   **Point 1 (The Text):** *"In the game, the 12 snippets were your 'text.' They underdetermined the rule. This is a settled fact in logic and linguistics: finite data always allows for infinite hypotheses. This is called the 'Problem of Induction.'"*
  *   **Point 2 (The Reader):** *"The Guesser represents the reader. They are not trying to read your mind; they are reading the evidence. When they found a different rule, they weren't 'wrong.' They were being consistent."*
  *   **Point 3 (The Writer):** *"The Designer represents the writer. You relied on a tacit sense of salience. You assumed certain features mattered (e.g., 'betrayal') and others didn't (e.g., 'sentence length'). When the Guesser focused on sentence length, your tacit assumption was exposed."*

  **3. The Theoretical Status (5 Minutes)**
  *   *Read this section carefully to distinguish settled from contested views:*
  *   *"We need to be precise about what this proves."*
  *   **Settled:** It is scientifically settled that human pattern recognition relies on priors and context. Without shared context, communication is ambiguous.
  *   **Contested:** It is **contested** among philosophers and cognitive scientists whether this means the Author's Intention is irrelevant. Some argue (Intentionalists) that the 'true' meaning is what the author meant, regardless of the text's ambiguity. Others (Anti-Intentionalists) argue the text stands alone. **This workshop does not solve that debate.** It simply demonstrates that *without shared convention*, the text supports multiple readings.
  *   **Contested:** It is also **contested** whether Bongard problems accurately model novel-reading. A novel has 300 pages of context; this game had 12 sentences. A real reader brings emotional investment; a Guesser brings puzzle-solving logic.
  *   **Correction:** *"So, do not leave here thinking 'Meaning is impossible.' Leave here thinking: 'Meaning relies on shared convention.' Your job as a writer is not just to write the examples, but to cultivate the shared convention that makes your intended rule the most salient one."*

  **4. Handling Failures (Facilitator Notes)**
  *   *If participants are embarrassed:* Normalize it. *"If your rule was too obvious, the game was boring. If it was too obscure, the game was broken. The friction is where the learning is."*
  *   *If rules were gerrymandered:* (e.g., "The rule is Yes for cards 1-6 and No for 7-12"). *"This is a 'cheat' rule. It fits the data but offers no predictive power. In fiction, this is like a plot twist that relies on information the reader couldn't possibly have. It's valid logic, but bad storytelling."*
  *   *If no one found alternative rules:* *"This means your shared convention is very strong. That is good for clarity, but be aware that it relies on the reader thinking exactly like you."*

  ---

  ## Appendix 1: Handout A (Bongard Problems)

  *Facilitator Note: Print these clearly. Box 1-6 is Left (Yes), Box 7-12 is Right (No).*

  **Puzzle 1 (Geometric - Simple)**
  *   Left: Six Triangles.
  *   Right: Six Circles.
  *   *Intended Rule:* Three sides vs. Curved line.
  *   *Alternative:* Angles vs. No angles.

  **Puzzle 2 (Geometric - Subtle)**
  *   Left: Six shapes containing a small dot inside.
  *   Right: Six shapes containing a small dot outside.
  *   *Intended Rule:* Containment.
  *   *Alternative:* Interior vs. Exterior.

  **Puzzle 3 (Narrative - Ambiguous)**
  *   Left: "The door opened." / "The light failed." / "The glass broke." / "The phone rang." / "The engine stopped." / "The sun set."
  *   Right: "John opened the door." / "She killed the light." / "He broke the glass." / "Mary answered the phone." / "The mechanic fixed the engine." / "We watched the sun."
  *   *Intended Rule:* Intransitive/Passive Event (Thing happens) vs. Transitive/Agentive Action (Person does thing).
  *   *Alternative:* Absence of Human Subject vs. Presence of Human Subject.
  *   *Alternative:* Fate vs. Will.

  ---

  ## Appendix 2: Handout B (Scorecard)

  **Name:** ___________________

  **Round 1 (You are Designer)**
  *   Intended Rule: _________________________________________________
  *   Guesser's Rule: _________________________________________________
  *   Did Guesser's Rule fit all examples? [ ] Yes [ ] No
  *   **Score:** (2 pts if Intended = Guessed) OR (0 pts if Guessed Rule fits but differs)

  **Round 2 (You are Guesser)**
  *   Designer's Intended Rule: ________________________________________
  *   My Guessed Rule: _______________________________________________
  *   Did my Rule fit all examples? [ ] Yes [ ] No
  *   **Score:** (2 pts if Match) OR (1 pt if Fit but Mismatch)

  **Total Score:** _______

  ---

  ## Facilitator Note on Theoretical Status

  *Please read before running the session.*

  The core lesson rests on the **Problem of Induction** (finite examples cannot logically guarantee a single rule). This is **settled** in philosophy of science (Hume, Quine).

  However, the implication for *literary interpretation* is **contested**.
  1.  **E.D. Hirsch (Validity in Interpretation):** Argues that authorial will is the only determinant of meaning. Under this view, the Guesser in the game is objectively "wrong" if they miss the intent, regardless of textual fit.
  2.  **Roland Barthes (Death of the Author):** Argues the text is autonomous. Under this view, the Guesser is "right" if the text supports them.

  **Do not present this workshop as proving Barthes correct.** Present it as demonstrating the *risk* of communication. The workshop remains sound even if one rejects Barthes, because even Intentionalists admit that *clarity* requires minimizing the gap between intent and evidence.

  **Cognitive Science Note:** Bongard problems test *perceptual* rule induction. Reading is *semantic* and *contextual*. Do not claim this game proves readers will misread your novel. Claim that it proves *isolated text* is vulnerable to multiple readings. The novel's length and genre conventions are the "context" that usually solves the Bongard problem for you. This exercise removes that context to show the mechanism underneath.
