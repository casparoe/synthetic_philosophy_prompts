answer: |-
  # THE FANATICISM DIAGNOSTIC
  **Module:** Decision Theory III | **Time:** 15 Minutes | **Format:** Circle one option per question.

  **Instructions:** Treat each scenario as isolated. Assume you are risk-neutral regarding money unless stated otherwise. Choose the action you would *actually* take, not the one you think a textbook would endorse.

  **1. The Street Mugger**
  A stranger stops you. He says: "Give me your wallet (£50). I have magic powers. I cannot prove it, but I promise to use my powers to save $10^{100}$ lives in a parallel dimension. The probability I am telling the truth is $10^{-50}$."
  *   **A.** Hand over the wallet.
  *   **B.** Walk away.
  *   **C.** Call the police / Engage further.

  **2. The Physicist's Request**
  A reputable physicist approaches you. She says: "Donate £50 to my fund. We are testing a quantum vacuum fluctuation. The math says there is a $10^{-50}$ chance this stabilises a dying universe, saving $10^{100}$ lives. The expected value is positive."
  *   **A.** Donate the £50.
  *   **B.** Keep the £50.
  *   **C.** Ask for peer review first.

  **3. The Charity Audit**
  You manage a public fund. Option X saves 100 children from malaria *for certain*. Option Y costs the same but has a 1 in $10^{9}$ chance of saving 10 billion people from a pandemic. You can only pick one.
  *   **A.** Fund Option X (Certain).
  *   **B.** Fund Option Y (Gamble).
  *   **C.** Split the funding.

  **4. The St Petersburg Casino**
  A casino offers a game: A coin is tossed until it lands Heads. If Heads appears on toss $n$, you win £$2^n$. The entry fee is £1,000. The expected monetary value is infinite.
  *   **A.** Pay to play.
  *   **B.** Refuse to play.
  *   **C.** Play only if the fee is lower.

  **5. The Infinite Reward**
  A being offers you a deal: Sacrifice your life now (utility = 0). In exchange, there is a $10^{-100}$ probability you receive *infinite* eternal bliss (utility = $\infty$).
  *   **A.** Accept the deal.
  *   **B.** Refuse the deal.
  *   **C.** Reject the coherence of the offer.

  **6. The Unnameable Odds**
  A predictor says: "I will save a trillion lives if you pay £10. The probability is non-zero, but it is smaller than any number you can formally write down or conceptualise."
  *   **A.** Pay the £10.
  *   **B.** Refuse to pay.
  *   **C.** Treat the probability as undefined/indeterminate.

  **7. The Lexical Trade**
  To have a 50% chance of saving the entire human race, you must personally torture one innocent child for an hour. The expected utility of saving the race vastly outweighs the disutility of the torture.
  *   **A.** Torture the child.
  *   **B.** Refuse to torture.
  *   **C.** Seek a third option / Hesitate.

  **8. The Repeated Mugging**
  The mugger from Q1 returns every day for 50 years. Each day, the deal is identical (Wallet for $10^{-50}$ chance of huge good). You know you will encounter this offer repeatedly.
  *   **A.** Pay every time.
  *   **B.** Pay never.
  *   **C.** Pay until bankruptcy, then stop.

  ***

  # SCORING KEY & LOGICAL SPACE
  **For Instructor Use Only**

  ### 1. Scoring Profiles
  Tally the student's responses. Patterns indicate their underlying decision architecture.

  | Position | Q1 (Mugger) | Q2 (Physicist) | Q3 (Charity) | Q4 (St Pete) | Q5 (Infinite) | Q6 (Ungraspable) | Q7 (Lexical) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Strict EU (Fanatic)** | A | A | B | A | A | A | A |
  | **De Minimis** | B | B | A | B | B | B | A/B |
  | **Bounded Utility** | A/B | A/B | B | B | **B** | B | A/B |
  | **Lexical Threshold** | A/B | A/B | A/B | A/B | A/B | A/B | **B** |
  | **Risk-Weighted (REU)** | B | B/A | A | B | B | B | B |
  | **Imprecise Credence** | B | B | A | B | C | **C** | B |

  *Note: Strict EU maximisers answer 'A' wherever Expected Value (EV) is positive. Deviations indicate a constraint on the EV calculation.*

  ### 2. The Credibility Conflation Check (Q1 vs Q2)
  This pair isolates whether students are discounting the *probability* or the *source*.
  *   **Q1=B, Q2=A:** The student accepts the math but rejects the mugger's credibility. They are **not** true anti-fanatics; they are credibility sceptics. If the probability were verified, they would be fanatics.
  *   **Q1=B, Q2=B:** The student rejects the probability magnitude itself. This is a genuine structural objection to fanaticism (e.g., De Minimis or REU).

  ### 3. Mapping the Logical Space
  The quiz constructs a space defined by three axes: *Probability Sensitivity*, *Utility Boundedness*, and *Credibility Weighting*.

  *   **Strict EU:** Occupies the corner where $p > 0$ and $U$ is unbounded.
  *   **De Minimis:** Occupies the region where $p < \epsilon \rightarrow p=0$. Distinguished from REU by Q3 (De Minimis rejects the gamble if $10^{-9}$ is below threshold; REU might accept if the weighting function isn't steep enough).
  *   **Bounded Utility:** Distinguished by **Q5**. If $U$ is bounded, $p \times \infty$ is finite (and likely less than the cost of life). If $U$ is unbounded, $p \times \infty = \infty$.
  *   **Lexical:** Distinguished by **Q7**. Rejects aggregation of utility across certain moral boundaries.
  *   **Imprecise Credence:** Distinguished by **Q6**. Refuses to assign a scalar $p$ to "unnameable" odds, blocking the EV calculation entirely.

  ### 4. Empty & Incoherent Cells
  *   **The "Infinite Accept / Finite Reject" Cell:** A student who answers **A on Q5** (Infinite Payoff) but **B on Q1** (Finite Payoff) is logically inconsistent under standard monotonicity. If you accept a gamble for $\infty$, you must accept it for a finite sum sufficiently large, unless you invoke a lexical threshold specifically against finite goods (rare).
  *   **The "Credibility Invert" Cell:** A student who answers **A on Q1** (Mugger) but **B on Q2** (Physicist) is weighting the mugger *higher* than the expert. This is empirically empty (irrational).
  *   **Bounded Utility vs. Diminishing Marginal Value:** **Limitation Flag.** This quiz distinguishes them *only* on Q5 (Infinite Payoff). In all finite cases (Q1, Q3), a steeply diminishing utility function behaves identically to a bounded one. If a student rejects Q1 but accepts Q3, they likely have diminishing marginal value, not a hard bound. We cannot fully separate these without knowing their specific utility function for money vs. lives.

  ### 5. Diagnostic Notes for Seminars
  *   **The "Hesitant" Cluster (Option C):** Students selecting C frequently are often intuitive **Risk-Weighted** maximisers who feel the probability is being downweighted but cannot articulate the function $r(p)$.
  *   **The "Mugging" Trap:** If the class splits on Q1 but unites on Q2, the seminar should focus on *epistemic* constraints (evidence requirements) rather than *decision-theoretic* constraints (utility bounds).
  *   **Fanaticism Threshold:** Count the number of 'A' responses on Q1, Q2, Q4, Q5.
      *   4/4: Hard Fanatic.
      *   2/4: Soft Fanatic (context-dependent).
      *   0/4: Anti-Fanatic.

  *(End of Key)*
