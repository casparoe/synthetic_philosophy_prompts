answer: |-
  You urge upon me a difficulty of genuine gravity, and I should be ill-suited to the inquiry if I pretended the obstacle you describe is imaginary. It is scarcely deniable that the present holders of capital possess advantages of combination and credit which a nascent association of labourers cannot easily match; nor do I deny that the law has often been shaped to favour the master over the man. Yet the dilemma you propose—that I must either minimise this power or endorse its revolutionary seizure—rests upon a supposition I cannot admit: that the state and public opinion are fixed entities, wholly captive to the proprietary class. My hope is not that the capitalist will willingly abdicate, but that the community, recognising the moral and productive superiority of association, will alter the laws of property and credit to afford the experiment a fair field. We require not the destruction of property, but its diffusion; not the confiscation of capital, but the facilitation of saving among the labouring classes.

  Moreover, there is a moral precondition which your argument overlooks. If the working classes are not yet fit to manage industry, no revolution will make them so; indeed, a violent overturn would likely engender habits of coercion incompatible with the self-government we seek. The escape from your dilemma lies in a dual movement: the gradual education of the labourer in the responsibilities of ownership, and the gradual reform of the legislature to remove artificial barriers to association. If the cooperative principle is truly superior, as I believe it to be, it need not conquer by force, but by evidence. It must prove itself in the open market, protected only by equal justice, not by privilege. To demand more is to risk liberty; to demand less is to resign ourselves to a wage system which treats human beings as instruments rather than ends.
