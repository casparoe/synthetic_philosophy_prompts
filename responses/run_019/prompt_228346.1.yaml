  8.  **Final Polish:** Ensure the distinction between criminal and civil is clear, as "prosecutor" implies criminal, but traffic cases can be tricky. I will assume criminal for the "Beyond a Reasonable Doubt" explanation as it's the stricter and more critical standard to understand here.

      *(Self-Correction during drafting)*: I need to be careful not to tell them to acquit. I need to tell them how to evaluate the evidence against the standard. If the standard is "Beyond a Reasonable Doubt," a 70% witness usually fails that test. I should explain *why* without dictating the verdict.

