prompt: |-
  I'm on jury duty and we're trying to decide whether the light was red when the defendant drove through the intersection. The only eyewitness testified that between the fog and the streetlight glare he was "pretty sure, maybe 7 out of 10" that the light was red. The prosecuter keeps saying we have direct testimony that the light was red, full stop, and the defense says if the witness can't swear to it we should throw his testimony out entirely. Both moves feel wrong to me. Before the witness spoke I genuinely had no idea which way it went, so if I take him at his word, do I just treat "the light was red" as 70% likely and multiply that through everything else in the case? Or am I supposed to somehow convert his shakiness into a yes-or-no first? And my fellow jurors all seem to want to treat what he said as either definite proof or totally worthless, which bugs me too. What's the right way to fold uncertain testimony like this into an actual decision, and how do I explain it to them without sounding like a robot? Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Jury duty, criminal or civil trial (likely criminal given "prosecutor" and "defendant," though could be traffic court/civil). The core issue is a traffic light color (red vs. not red).
      *   **Evidence:** One eyewitness. Conditions were poor (fog, glare).
      *   **Witness Testimony:** "Pretty sure, maybe 7 out of 10" that the light was red.
      *   **Conflict:** Prosecutor says it's direct testimony (100% proof). Defense says it's too uncertain to count (0% proof).
      *   **User's Intuition:** Both extremes feel wrong. They want to know how to weigh probabilistic evidence within the legal framework.
      *   **Goal:** How to legally and logically evaluate this testimony, how to explain it to other jurors, and what the standard of proof requires.
      *   **Constraint:** Answer in American English.

  2.  **Identify the Legal Framework (US Law):**
      *   **Role of the Jury:** Jurors are "finders of fact." They weigh credibility and evidence.
      *   **Standard of Proof:**
          *   Criminal: "Beyond a Reasonable Doubt" (very high bar, usually 90-95%+ certainty).
          *   Civil: "Preponderance of the Evidence" (more likely than not, 50%+).
          *   *Self-Correction:* The prompt mentions "prosecutor," implying a criminal case (e.g., reckless driving, vehicular homicide, running a red light resulting in an accident). I should address the criminal standard primarily but acknowledge the difference if it's a traffic infraction (which might be quasi-criminal or civil). Let's assume criminal for safety, as "prosecutor" is used.
      *   **Weight of Evidence:** Jurors *are* supposed to weigh credibility. They don't have to accept testimony as 100% true just because it was spoken under oath. They can believe part, all, or none of it.
      *   **Reasonable Doubt:** If the only evidence is 70% certainty, does that meet "beyond a reasonable doubt"? Almost certainly not.

  3.  **Address the User's Specific Questions:**
      *   *Do I treat "the light was red" as 70% likely?* Yes, essentially. That's weighing the evidence.
      *   *Do I convert it to yes-or-no first?* No, that's what the Prosecutor/Defense are arguing for, but it's not how deliberation works. You weigh the *credibility* to reach a verdict.
      *   *How to explain to other jurors?* Need non-technical, relatable analogies. Avoid "robot" talk (math/percentages in the deliberation room can sometimes be frowned upon if it looks like a formulaic approach, but the *concept* of uncertainty is key).

  4.  **Formulate the Advice:**

      *   **Validate the User:** Their intuition is correct. The binary "all or nothing" approach is flawed.
      *   **Explain the Jury's Job:** You are the judge of credibility. You decide how much weight to give the testimony.
      *   **The Standard of Proof (Crucial):** This is the linchpin.
          *   If Criminal: 70% is *not* "Beyond a Reasonable Doubt." 7 out of 10 means there's a 3 out of 10 chance he's wrong. That is a *reasonable doubt*.
          *   If Civil/Traffic Infraction: 70% *is* "More likely than not."
          *   *Action:* Tell the user to check the judge's instructions on the burden of proof.
      *   **Rebutting the Extremes:**
          *   Prosecutor: Direct testimony isn't automatic truth. Credibility matters.
          *   Defense: Uncertain testimony isn't worthless. It still adds weight, just not enough for a criminal conviction maybe.
      *   **Talking to Jurors:** Use analogies.
          *   *Weather forecast:* 70% chance of rain. Do you bring an umbrella? (Yes). Do you cancel the wedding? (Maybe not).
          *   *Medical diagnosis:* Doctor is "pretty sure." Do you take the meds? Do you schedule surgery?
          *   *The "Dinner Plan" analogy:* If a friend is 70% sure they can make it, do you reserve a table for 4 or 3?
      *   **Legal Caution:** Don't actually do math in the room (some courts frown on "quantifying doubt"). Focus on the *feeling* of uncertainty. "Does this leave you firmly convinced?"

  5.  **Refine the Tone:**
      *   Empathetic, practical, authoritative but not legal advice (disclaimer needed).
      *   American English (spelling, idioms).
      *   Avoid telling them *how* to vote, but how to *think* about the vote.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Disclaimer:* I am an AI, not a lawyer. Follow the Judge's instructions.
      *   *Core Concept:* Credibility vs. Certainty.
      *   *The Math:* Don't say "multiply 70%." Say "weigh the uncertainty."
      *   *The Standard:* Emphasize "Beyond a Reasonable Doubt." 30% doubt is huge in criminal law.
      *   *Scripting:* Give them phrases to use in the jury room. "I hear what you're saying, but..."

  7.  **Final Review against Constraints:**
