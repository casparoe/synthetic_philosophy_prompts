answer: |-
  Here is a decision tree designed for your philosophy meetup. It contains 7 branch questions. They are phrased to avoid legal jargon and leading moral judgments, focusing instead on consistency, source of authority, and consequence.

  ### The Nuremberg/Tokyo Positionality Tree

  **Instructions for Participants:**
  Start at **Q1**. Answer based on your immediate intuition about the scenario described. Follow the arrow corresponding to your answer. If you reach a **Leaf**, read the position description. If you reach a **Dead End**, read the note on incoherence.

  ---

  #### Q1: The Mirror Test
  Imagine history had gone differently: Germany and Japan win the war in 1945. They set up a tribunal in London and Washington, using the *exact* same charter, rules of evidence, and judicial structure that the Allies actually used at Nuremberg, to try Churchill and Roosevelt.
  *   **A:** I would consider that tribunal **legitimate** (assuming the evidence was real).
      *   *Go to Q2.*
  *   **B:** I would consider that tribunal **illegitimate** simply because the winners are judging the losers.
      *   *Go to Q4.*

  #### Q2: The Written Code
  Think about the specific acts charged: the Holocaust, the invasion of Poland, the bombing of civilians. In 1939, there was no single international criminal code that explicitly listed these as capital crimes with a court to enforce them.
  *   **A:** Some acts are so monstrous they are crimes by nature, even if no one wrote them down beforehand.
      *   *Go to Q3.*
  *   **B:** A court cannot punish someone for an act that wasn't explicitly defined as a crime with a defined penalty before they did it.
      *   *Go to Q5.*

  #### Q3: The Scope of Guilt
  The tribunal charged defendants with "War Crimes" (killing prisoners, torture) and "Crimes Against Peace" (planning and starting an aggressive war).
  *   **A:** Starting a war of aggression is morally comparable to murder; it belongs in a criminal court.
      *   *Go to Q6.*
  *   **B:** Killing prisoners is a crime, but starting a war is a political act; leaders shouldn't be jailed for policy decisions.
      *   *Leaf: **The Legalist Middle** (See Definitions).*

  #### Q4: The Hypocrisy Test
  During the trials, it emerged that the Allies had done similar things to the accused (e.g., unrestricted submarine warfare, the Katyn massacre).
  *   **A:** This hypocrisy discredits the verdicts; you cannot judge others for acts you also committed.
      *   *Leaf: **Total Victors' Justice Rejectionism** (See Definitions).*
  *   **B:** The defendants' guilt is independent of the judges' behavior; two wrongs don't make a right, but they don't acquit the accused either.
      *   *Go to Q1.* ( *Note: If you answered Q1-B, you cannot logically answer Q4-B. See "Indistinguishable Leaves" below.*)

  #### Q5: The Alternative
  If we accept that there was no prior written law to justify a trial (from Q2-B), what should have been done with the Nazi leadership instead?
  *   **A:** They should have been executed or disposed of by political decree without a trial.
      *   *Go to Q6.*
  *   **B:** They should have been released or detained without punishment; a trial without law is a sham.
      *   *Go to Q7.*

  #### Q6: The Future Value
  Let's assume the trial had legal flaws (retroactive laws, victor bias). However, it established the precedent that leaders can be held personally accountable, leading to modern human rights law.
  *   **A:** The long-term benefit to humanity justifies the legal flaws of the specific trial.
      *   *Go to Q7.*
  *   **B:** Justice must be clean in the moment; you cannot trade legal integrity for future political gain.
      *   *Leaf: **Natural Law Defense** (See Definitions).*

  #### Q7: The Tokyo Distinction
  In the European trial (Nuremberg), the Head of State (Hitler) was dead but presumed guilty. In the Pacific trial (Tokyo), the Head of State (the Emperor) was granted total immunity by the US, despite evidence of his involvement, while his subordinates were hanged.
  *   **A:** This exemption invalidates the Tokyo trial specifically, even if Nuremberg was acceptable.
      *   *Leaf: **Nuremberg-Yes / Tokyo-No** (See Definitions).*
  *   **B:** The trials stand or fall together; the Emperor's immunity is a flaw, but it doesn't change the verdict on the subordinates.
      *   *Leaf: **The Pragmatist** (See Definitions).*

  ---

  ### Dead Ends & Empty Leaves

  **Dead End A (Reached via Q2-B → Q5-B → Q6-A)**
  *   **The Position:** "The trial was illegal (no prior law), the defendants shouldn't have been punished without law, BUT the trial was good because it set a precedent."
  *   **Status:** **Logically Incoherent.** You cannot argue that a proceeding is fundamentally illegitimate (requiring no punishment) while simultaneously arguing it was a net positive precedent. Precedent requires the proceeding to have validity.
  *   **Discussion Prompt:** Is it possible to value the *outcome* of an event while completely rejecting its *authority*?

  **Dead End B (Reached via Q1-B → Q4-B)**
  *   **The Position:** "The tribunal is illegitimate because the winners judged the losers, BUT the losers' guilt is independent of the judges' behavior."
  *   **Status:** **Unattractive / Tense.** This position claims the *court* is a sham because of who sits on the bench, but the *verdict* is true regardless of who sits on the bench.
  *   **Discussion Prompt:** Does the legitimacy of a court come from its *structure* (who judges) or its *findings* (what is proven)?

  ---

  ### Leaf Definitions (For the Group Discussion)

  **1. Total Victors' Justice Rejectionism**
  *   **Path:** Q1-B or Q4-A.
  *   **Core Belief:** The tribunals were political tools disguised as law. Because the victors acted as judge, jury, and executioner, and because they exempted themselves from the same standards, the proceedings lacked moral and legal authority. The verdicts may be historically accurate, but the *trial* was a sham.

  **2. The Legalist Middle**
  *   **Path:** Q1-A → Q2-B → Q3-B.
  *   **Core Belief:** Traditional war crimes (mistreating POWs, targeting civilians) were already established law and rightly punished. However, "Crimes Against Peace" (starting the war) and "Conspiracy" were invented retroactively. This view accepts the hanging of camp guards but rejects the hanging of generals for "aggression."

  **3. The Natural Law Defense**
  *   **Path:** Q1-A → Q2-A → Q3-A → Q6-B.
  *   **Core Belief:** Certain acts are *mala in se* (wrong in themselves). The enormity of the Holocaust and aggressive war transcends written statutes. Retroactivity is excused because any reasonable human being knew these acts were criminal. The focus is on retributive justice for *these* specific crimes.

  **4. The Pragmatist**
  *   **Path:** Q1-A → Q2-A → Q3-A → Q6-A → Q7-B.
  *   **Core Belief:** The tribunals were legally imperfect (retroactive laws, victor bias), but they were a necessary political technology to transition from war to peace without summary execution. The value lies in the *precedent* set for international law, not just the punishment of the defendants. Flaws are accepted as the cost of progress.

  **5. Nuremberg-Yes / Tokyo-No**
  *   **Path:** Q1-A → Q2-A → Q3-A → Q6-A → Q7-A.
  *   **Core Belief:** The European tribunal maintained a higher degree of judicial independence and consistency. The Pacific tribunal was compromised by the explicit immunity granted to the Emperor for political expediency, rendering its verdicts against his subordinates structurally unsound compared to Nuremberg.

  ---

  ### Facilitator Notes: Indistinguishable Leaves

  **The Natural Law vs. Pragmatist Overlap**
  *   **Issue:** Your questions separate these based on Q6 (Does future benefit justify flaws? vs. Justice must be clean). However, in practice, many people hold both views: they believe the acts were naturally criminal *and* that the precedent was useful.
  *   **Flag:** If a participant argues for both, do not force them to choose. Mark them as **"Hybrid Normative-Pragmatic."** This is a stable position, but the tree forces a split to clarify which argument they prioritize when the two conflict (e.g., if a future trial had *no* precedent value, would it still be justified?).

  **The Legalist Middle vs. Strict Nullification**
  *   **Issue:** The "Dead End A" represents a "Strict Nullification" view (Illegal + No Utility). This is rarely held because it implies the defendants should go free *and* the world learned nothing.
  *   **Flag:** If someone lands in Dead End A, challenge them on Q5. Usually, they will shift to "Summary Execution" (moving them toward Pragmatist) or "No Punishment" (moving them toward a pure Civil Libertarian view not fully captured by the tree). This is a good spot to pause the group discussion.
