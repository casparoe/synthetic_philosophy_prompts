  3.  **Address the Specific Confusion points:**
      *   *Is it Lamarckian?* Yes, by modern standards, the "use/disuse" part is Lamarckian. But for Darwin, it wasn't "Lamarckism vs. Darwinism" like it is today. It was "Darwinism includes some Lamarckian mechanisms."
      *   *Why not just habit?* Because habit alone doesn't explain *altruism* that reduces individual fitness. Why would I inherit a habit of dying for my tribe? Natural Selection is needed to explain the *social instinct* itself. Habit/Use-Disuse explains the *strength* or *specific direction* once the instinct exists.
