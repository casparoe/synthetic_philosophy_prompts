      *   **The Goal:** *Not* a verdict (e.g., "Sweden wins"). *Instead*, an analysis of the *conditions for answerability*. What must be true for the claim to make sense? Is "liberal" a single dimension? How to aggregate trade-offs? What would a fair betting procedure look like?
      *   **Constraints:** Explicit definitions, edge cases, flag "underdetermined until X," admit if the premise is confused, flag confidence levels, note where a Norwegian would push back.

