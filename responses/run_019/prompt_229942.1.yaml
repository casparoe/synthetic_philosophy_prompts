  TO: Academic Integrity Board
  FROM: Adjudications Committee
  DATE: October 26, 2023
  SUBJECT: Decision Memo regarding Case #2023-G4 (Graduate Seminar Collusion)

  The Board should find all four students responsible for collusion under the university's academic integrity policy. While the students deny an explicit agreement, the content of the shared document demonstrates functional coordination that satisfies the policy's requirement of "acting jointly to obtain an unfair academic advantage." The evidence shows not merely parallel work, but a distributed strategy to allocate intellectual labor and evade detection during a compulsory individual assessment. Specifically, the comment "we can't all use this opening" indicates an awareness of individual submission constraints and a collective decision to vary surface-level details while maintaining a unified underlying structure. By submitting essays that adhered to this coordinated plan—including the same idiosyncratic examples and objection responses—each student validated and utilized the joint product, regardless of who typed specific lines. The student who claimed to only "read" the document cannot claim independence when their submission mirrors the coordinated plan they knowingly accessed during the exam window; utilizing the output of a collusive process constitutes participation in the joint action.

  To resolve future cases where explicit agreement is absent, the Board adopts the "Functional Coordination Test." Under this test, joint action is established if: (1) students utilize a shared medium during an individual assessment period; (2) contributions within that medium demonstrate mutual responsiveness or strategic allocation of work (e.g., dividing topics, warning against similarity); and (3) the submitted work reflects reliance on that coordinated structure rather than independent derivation. This test distinguishes permissible collaboration (such as study groups prior to an exam) from impermissible collusion (coordination during the assessment window) by focusing on whether the students' actions were interdependent. If a student's contribution anticipates another's submission or strategizes around detection limits, the action is joint, not parallel.

  The strongest argument against this finding is that graduate-level intellectual work naturally converges, and penalizing shared note-taking risks chilling legitimate academic collaboration. Critics might argue that without a "smoking gun" explicit agreement, we are punishing students for the natural outcome of discussing course material extensively throughout the term, potentially violating the principle that ambiguity in disciplinary policies should benefit the accused. In a rigorous seminar, students may independently arrive at similar structures or examples because they were trained to think alike by the instructor. However, this argument fails to account for the specific metadata and textual evidence in this case. Convergent thinking does not produce comments like "someone should push back on this objection" during a final exam window; that is task allocation. Convergent thinking does not strategize about avoiding identical openings to evade plagiarism detection; that is an admission of impermissible coordination. The policy's ambiguity regarding "explicit agreement" was intended to prevent technicalities from shielding substantive cheating, not to punish intellectual convergence. Because the document contains explicit strategies to manage the appearance of independence while sharing the core intellectual work, the evidence exceeds mere convergence and meets the threshold of functional coordination. Therefore, the finding of collusion stands for all four participants.
