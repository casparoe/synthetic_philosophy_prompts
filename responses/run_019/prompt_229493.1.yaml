answer: |-
  | Candidate rule | How it fits verdicts 1–5 | Its verdict on the orchard promise | A further case that would test it against the other rules |
  | :--- | :--- | :--- | :--- |
  | **1. The Reliance Principle**<br>Promises bind primarily to prevent harm to those who reasonably rely on them. Coercion and immorality void promises because reliance in those contexts is unreasonable or outweighed by harm. | **Fits well.** Explains why the airport promise (high reliance) is stronger than the sweater promise (no reliance). The book promise binds because ownership creates an implicit expectation of return. Gunpoint/cheating void reasonable reliance. | **Does not bind (or binds very weakly).** Since the grandfather is dead and no one else depends on the orchard, breaking the promise causes no harm to reliance interests. The financial drain outweighs the empty obligation. | **The Secret Vow:** You promise a friend you will think of them on their birthday, but they will never know if you did. <br>*(Reliance Rule: Does not bind, as no expectation/harm exists.)* |
  | **2. The Fidelity Principle**<br>Promises bind because making a voluntary commitment creates a duty to maintain one's integrity and honor the trust placed in you. Reliance amplifies the duty, but the core obligation comes from the act of promising itself. | **Fits well.** Explains why free promises (book, sweater, airport) bind while coerced ones (gunpoint) do not. Explains why cheating doesn't bind (cannot have a duty to do wrong). The sweater promise is weak only because the subject matter is trivial, not because reliance is low. | **Binds strongly.** The promise was voluntary, moral, and solemn (deathbed). The financial cost to the promisor does not negate the duty to honor the grandfather's trust and maintain personal integrity. | **The Secret Vow:** You promise a friend you will think of them on their birthday, but they will never know if you did. <br>*(Fidelity Rule: Binds, as the integrity of the promisor is at stake regardless of external knowledge.)* |

  ### Prediction and Implications

  I would bet on **The Reliance Principle** being your friend's actual operating rule. The smoking gun is Verdict 5: she explicitly justifies the weak binding force of the sweater promise *because* "nobody's plans depend on it." If she were driven primarily by fidelity or commitment, she likely would have said the sweater promise binds fully simply because "a promise is a promise," regardless of triviality. This suggests she views the *consequences* of breaking a promise (harming someone's plans) as the source of its moral weight, rather than the abstract duty of keeping one's word. If this is correct, it implies that for her, **deathbed promises like the orchard case do not bind** (or bind negligibly) if no living person relies on them. The moral obligation vanishes with the promisee's ability to be harmed by the breach, suggesting that for her, promises are tools for social coordination rather than sacred vows.
