          *   *Reliance:* No bind (No harm if I don't).
          *   *Fidelity:* Binds (I gave my word).

  6.  **Drafting the Prediction Paragraph:**
      *   *Which rule fits best?* Case 5 is the smoking gun. "Binds only weakly, *since nobody's plans depend on it*." She explicitly justifies the weakness via reliance.
      *   *Implication:* She likely leans Reliance. Therefore, the Orchard promise probably doesn't bind (or binds very weakly) for her.
      *   *Nuance:* However, deathbed promises carry emotional weight. But based *strictly* on her logic in Case 5, Reliance is the driver.

