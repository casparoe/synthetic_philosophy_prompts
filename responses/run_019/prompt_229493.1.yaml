      *   Reliance: No bind (No harm).
      *   Fidelity: Binds (Word given).

      *Let's refine the Test Case to be more robust.*
      *   Case: "You promise a dying stranger to scatter their ashes in a specific place. No one will ever know if you do it or not, and no one is harmed either way."
      *   Reliance: No bind (No reliance/harm).
      *   Fidelity: Binds (Solemn vow).
      *   This mirrors the Orchard but removes the "Grandfather" relationship element which might complicate the Fidelity view (special duties). Let's stick to the "Secret Promise" idea.
      *   *Test Case:* "You promise a friend you will never tell a harmless secret of theirs. They die. No one will ever know if you tell. Telling hurts no one."
      *   Reliance: Weak/No bind (No harm done).
      *   Fidelity: Binds (Integrity/Respect for the dead).
      *   Actually, let's use the prompt's suggestion style. "A further case that would test it."
      *   Let's go with: "A promise to donate to a charity anonymously after your death."
      *   Reliance: Charity can't rely on it (don't know). No bind.
      *   Fidelity: You committed. Binds.

      *Okay, let's finalize the prediction.*
      *   The friend explicitly cited reliance in Case 5 ("since nobody's plans depend on it"). This is strong evidence for the Reliance Rule.
      *   Implication: Deathbed promises without reliance (like the orchard) likely don't bind for her.

      *Wait, one nuance:* In Case 4 (Airport), she says it binds *more strongly* than the book. This implies the Book promise *does* bind without explicit reliance mentioned. This suggests a baseline commitment + reliance multiplier.
      *   If I present a "Pure Reliance" rule, it might struggle with Case 1 (Book) if there's no explicit reliance mentioned. I should frame Rule 1 as "Reliance is the *primary source* of strength, with a baseline for property rights." Or better: "Promises bind to protect expectations." Returning a book is an expectation of property rights.
      *   Let's stick to the prompt's hint: "one on which binding force comes from the promisee's reliance and one on which it comes from the promisor's free commitment."
