prompt: |-
  I'm a high school junior writing an ethics paper on what makes promises binding, and I've been polling a friend on cases to figure out the principle behind her judgments. Her verdicts so far: (1) a promise to return a borrowed book binds; (2) a promise made at gunpoint does not; (3) a promise to help a friend cheat on an exam does not bind even though it was made freely; (4) a promise to pick someone up at the airport binds, and more strongly than the book promise, because the person skipped making other arrangements on the strength of it; (5) a casual promise to wear a particular sweater tomorrow binds only weakly, since nobody's plans depend on it.

  Here's the new case I can't predict her answer to: a teenager freely promised her grandfather, shortly before he died, that she would keep his small orchard running. Nobody relies on the orchard, it's a financial drain, and the grandfather obviously can't be disappointed now. Does the promise bind?

  I'm less interested in the verdict itself than in the reasoning. Please give me a table with these columns: "Candidate rule" (a principle that generates all five of her verdicts), "How it fits verdicts 1–5", "Its verdict on the orchard promise", and "A further case that would test it against the other rules". I want at least two rules that genuinely diverge on the orchard case — for instance, one on which binding force comes from the promisee's reliance and one on which it comes from the promisor's free commitment — and then, after the table, a short paragraph saying which rule you'd bet on as hers, why, and what that implies about whether deathbed promises bind.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** High school junior writing an ethics paper.
      *   **Task:** Analyze a friend's moral intuitions about promises based on 5 provided cases.
      *   **Goal:** Create a table with at least two candidate rules that explain the first 5 verdicts but *diverge* on the new "orchard" case.
      *   **Table Columns:** "Candidate rule", "How it fits verdicts 1–5", "Its verdict on the orchard promise", "A further case that would test it against the other rules".
      *   **Post-Table:** A short paragraph predicting which rule is the friend's actual principle, why, and the implication for deathbed promises.
      *   **Constraint:** The rules must genuinely diverge on the orchard case (e.g., reliance vs. free commitment).

  2.  **Analyze the Friend's Verdicts (Data Points):**
      *   *Case 1 (Book):* Binds. (Standard promise, property return).
      *   *Case 2 (Gunpoint):* Does not bind. (Coercion invalidates).
      *   *Case 3 (Cheating):* Does not bind. (Immoral/Illegal act invalidates).
      *   *Case 4 (Airport):* Binds *strongly*. (Reliance/Consequences increase strength).
      *   *Case 5 (Sweater):* Binds *weakly*. (No reliance/consequences = weak obligation).

  3.  **Identify Underlying Ethical Theories/Principles:**
      *   *Observation 1:* Coercion and Immorality negate binding force. This suggests a baseline requirement of *voluntariness* and *moral permissibility*.
      *   *Observation 2:* The *strength* of the obligation varies based on *reliance* (Airport vs. Sweater). This points heavily toward a **Reliance-Based View** (or Consequentialist/Expectation view).
      *   *Observation 3:* The Book promise binds even without explicit mention of reliance (though implicit reliance exists). This could fit a **Will-Based View** (autonomy/commitment) *modified* by reliance for strength.
      *   *Conflict:* A pure Will-Based View says "Free commitment binds regardless of consequences." A pure Reliance-Based View says "Obligation exists only to prevent harm from reliance."
      *   *Friend's Nuance:* Case 5 says the sweater promise binds *weakly*. A pure Reliance View might say it doesn't bind at all if no one relies. A pure Will View might say it binds fully. The friend seems to hold a hybrid: *Commitment creates a baseline, Reliance scales the strength.*

  4.  **Develop Candidate Rules for the Table:**
      *   *Rule A (Reliance-Focused):* Promises bind primarily to prevent harm to those who rely on them. Voluntariness is a precondition, but the *weight* comes from reliance.
      *   *Rule B (Commitment/Will-Focused):* Promises bind because making a commitment creates a moral duty to one's own word. Reliance amplifies this, but the duty exists independently.
      *   *Rule C (Hybrid/Threshold):* A promise binds if voluntary and moral. Strength is determined by reliance. (This is probably the most accurate description of the friend, but I need two rules that *diverge* on the orchard).

      *Let's refine for divergence on the Orchard Case:*
      *   *Orchard Case Features:* Voluntary? Yes. Moral? Yes. Reliance? No (Grandfather dead, no financial need). Cost to Promisor? High (financial drain).
      *   *Rule 1 (Reliance/Expectation):* If no one relies and no one is harmed by breaking it, the promise loses most binding force. Verdict: Weak or Non-binding.
      *   *Rule 2 (Fidelity/Autonomy):* A voluntary commitment creates an obligation regardless of consequences, especially to honor the dead. Verdict: Binding (perhaps strongly due to solemnity).

      *Wait, I need to make sure both rules fit Cases 1-5.*
      *   *Case 1 (Book):* Reliance (owner expects book back) + Commitment. Both fit.
      *   *Case 2 (Gunpoint):* No Commitment (involuntary). Reliance irrelevant. Both fit (Coercion veto).
      *   *Case 3 (Cheating):* Immoral content. Both fit (Immorality veto).
      *   *Case 4 (Airport):* High Reliance. Commitment exists. Both fit (High strength).
      *   *Case 5 (Sweater):* Low/No Reliance. Commitment exists.
          *   Reliance Rule: Weak binding (matches verdict).
          *   Commitment Rule: Why weak? A pure commitment rule might say it binds fully. I need to phrase the Commitment Rule carefully so it accommodates Case 5 while diverging on the Orchard.
          *   *Adjustment:* Let's make Rule 2 about "Solemnity/Relationship" vs Rule 1 "Harm/Reliance".
          *   *Better Adjustment:* Let's stick to the prompt's suggestion: "one on which binding force comes from the promisee's reliance and one on which it comes from the promisor's free commitment."
          *   *Problem:* If Rule 2 is "Free Commitment," does it explain Case 5 (Weak)?
          *   *Solution:* Rule 2 can be "Commitment creates a *prima facie* duty, but trivial matters carry less weight." OR, I can frame Rule 1 as "Reliance is *necessary* for strong binding" vs Rule 2 "Commitment is *sufficient* for binding, reliance just adds weight."
          *   *Actually, looking at Case 5:* "Binds only weakly, since nobody's plans depend on it." This explicitly cites reliance as the reason for weakness. This strongly favors the Reliance View.
          *   *To make them diverge on the Orchard:*
              *   *Rule 1 (Reliance):* Obligation is proportional to harm caused by breaking. Orchard: No harm (Grandpa dead, no reliance). Verdict: Does not bind (or very weakly).
              *   *Rule 2 (Fidelity/Integrity):* Obligation stems from maintaining one's integrity and honoring the relationship. Orchard: Grandpa trusted her, it's a solemn vow. Verdict: Binds strongly (despite cost).
              *   *Do both fit 1-5?*
                  *   Rule 1 fits 1-5 well (especially 4 & 5).
                  *   Rule 2 fits 1-5? Case 5 is the tricky one. If integrity is key, why is the sweater promise weak? Because the *subject matter* is trivial. So Rule 2 can be "Commitment binds, but trivial subjects weaken the duty." This allows it to fit Case 5 but stay strong on the Orchard (orchard is not trivial, it's a deathbed wish).

  5.  **Drafting the Table:**

      *   *Rule 1: The Reliance Principle.* Promises create obligations primarily to prevent harm to those who reasonably rely on them. Coercion and immorality void the promise because reliance in those contexts is unreasonable or outweighed.
      *   *Rule 2: The Fidelity Principle.* Promises create obligations because breaking them violates the promisor's integrity and the trust of the relationship. Coercion/immorality void this because trust cannot be formed/act is wrong. Reliance amplifies the duty but isn't the sole source.

      *   *Orchard Verdicts:*
          *   Reliance: Weak/No bind (No one relies, no harm).
          *   Fidelity: Binds (Solemn commitment, honoring the dead).

      *   *Test Cases:* Need a case where Reliance and Fidelity give opposite answers *other* than the orchard.
          *   *Idea:* A promise to a stranger where reliance is high but the relationship is non-existent vs. a promise to a loved one where reliance is low.
