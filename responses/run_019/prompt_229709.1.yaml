answer: |-
  # Activity Title: "The Principle Trap"
  **Time:** 80 Minutes  
  **Class Size:** 16 Students (4 Teams of 4)  
  **Goal:** To generate an experiential tension between moral intuition (which succeeds contextually) and moral principles (which fail universally), setting the stage for Moral Particularism.

  ---

  ## I. Preparation & Materials
  1.  **Teams:** Divide the class into 4 teams (A, B, C, D).
  2.  **Scoreboard:** Whiteboard divided into 4 columns (one per team) and 4 rows (one per round).
  3.  **Team Packets:** Each team needs:
      *   4 Case Cards (sealed in envelopes labeled Round 1–4).
      *   4 Response Sheets (see template below).
      *   A pen.
  4.  **TA Cheat Sheet:** A master list of the "Intended Majority" for quick scoring (though you should tally real responses to allow for genuine divergence).

  ### Response Sheet Template (Print 4 per team)
  > **Round #:** _____
  > **1. Verdict:** [ ] Permissible  [ ] Impermissible
  > **2. The Rule:** *State the general principle you are using (e.g., "Lying is always wrong").*
  > ___________________________________________________________________
  > **3. The Prediction:** *What verdict do you think the OTHER 3 teams will choose?*
  > [ ] Permissible  [ ] Impermissible

  ---

  ## II. Rules & Flow (45 Minutes)

  ### 1. Introduction (5 Minutes)
  *   **Script:** "You've spent weeks applying principles like the Categorical Imperative and Utility. Today, we are testing the reliability of those principles. You will work in teams to judge cases.
  *   **The Goal:** Maximize your team's score.
  *   **Scoring:**
      *   **Consensus Point (1 pt):** If your **Verdict** matches the Class Majority (3 or 4 teams).
      *   **Prediction Point (1 pt):** If your **Prediction** matches the Class Majority.
      *   *Note:* You do **not** get points for keeping your Rule consistent. In fact, you might lose Consensus Points if you stick to a rule when the situation changes.
  *   **Constraint:** Your **Rule** must cite a specific feature (e.g., lying, pain, promises). You cannot write 'Do whatever is best' or 'Follow the rule.'"

  ### 2. The Gameplay Loop (4 Rounds x 8 Minutes = 32 Minutes)
  *   **Step 1 (Discussion):** Teams open the envelope. They read the case, decide a Verdict, formulate a Rule, and make a Prediction about the other teams. (4 mins)
  *   **Step 2 (Submission):** Teams lock in their Response Sheets.
  *   **Step 3 (Reveal):** On your signal, all teams hold up their Verdict (e.g., thumbs up/down or hold up a card).
  *   **Step 4 (Scoring):** You quickly tally the Class Majority. Teams award themselves points based on the scoring rules.
  *   **Step 5 (Collection):** **Crucial:** Collect the Response Sheets after every round. Do not let teams keep them. This prevents them from easily editing their previous rules to look consistent.

  ### 3. The "Stacked Deck" (Case Cards)
  *The deck is designed so that a feature that justifies a verdict in Round 1 justifies the **opposite** verdict in Round 2.*

  #### Round 1: The Lying Baseline
  > **Case:** Alex is late on a rent payment. The landlord calls. Alex lies and says, "I mailed the check yesterday," to avoid an awkward conversation and buy two more days. Alex intends to pay.
  > *   **Intended Majority:** Impermissible.
  > *   **Target Rule:** "Do not lie" or "Lying is wrong."

  #### Round 2: The Lying Flip (Polarity Reversal)
  > **Case:** A violent intruder is hunting Alex's friend, who is hiding in the closet. The intruder asks Alex, "Is anyone else in the house?" Alex lies and says, "No, I am alone."
  > *   **Intended Majority:** Permissible (even Obligatory).
  > *   **Target Rule:** Teams must now abandon or heavily qualify "Do not lie."
  > *   **Tension:** If they stick to Round 1's rule, they lose Consensus Points. If they change the rule, they admit Round 1's rule was false.

  #### Round 3: The Pain Baseline
  > **Case:** Jordan shoves a classmate in the hallway because the classmate annoyed them. The classmate feels physical pain and humiliation.
  > *   **Intended Majority:** Impermissible.
  > *   **Target Rule:** "Do not cause pain" or "Causing harm is wrong."

  #### Round 4: The Pain Flip (Polarity Reversal)
  > **Case:** Jordan is a dentist. A patient has a severe infection. Jordan drills the tooth, causing significant physical pain, to remove the infection and save the tooth.
  > *   **Intended Majority:** Permissible.
  > *   **Target Rule:** Teams must abandon "Do not cause pain."

  *(Note: If a team refuses to flip in Rounds 2 or 4, they will lose Consensus Points, punishing rigid generalism.)*

  ---

  ## III. The Debrief (35 Minutes)

  ### Phase 1: The Data Reveal (10 Minutes)
  *   **Display the Scores:** Most teams should have high scores (14–16 pts). This proves their *intuitions* were reliable.
  *   **Display the Rules:** Write the rules from Round 1 and Round 2 on the board side-by-side.
      *   *Round 1:* "Lying is wrong."
      *   *Round 2:* "Lying is permissible to save a life" OR "Lying is wrong unless..."
  *   **Ask:** "You all scored highly. You knew the right answer in every case. But look at your rules. How many of you had to change your rule between Round 1 and 2?"
  *   **The Hook:** "If your moral knowledge is reliable (high scores), but your principles keep breaking (changing rules), where is the moral truth coming from? Is it in the *rule*, or in the *case*?"

  ### Phase 2: Mapping the Philosophy (15 Minutes)
  *   **Introduce the Terms:** Now you can name the view.
      *   **Generalism:** Moral truth depends on universal principles (Kant, Utilitarianism). Features (like lying) have invariant valence (always bad).
      *   **Particularism (Jonathan Dancy):** Moral truth depends on the context. Features are *holistic*. Lying counts against an action in Round 1, but *for* an action in Round 2.
  *   **Connect to Game:**
      *   *The Scoring Twist:* The game rewarded you for matching the majority (intuition), not for consistency (principle). This mirrors the Particularist claim: We navigate the world by sensitivity to context, not by subsumption under laws.
      *   *The Rule Failure:* When you tried to write a rule for Round 2 that covered Round 1, did it become messy? (e.g., "Don't lie unless someone dies...").
  *   **Key Concept:** **Holism of Reasons.** A feature (lying) is not a "valence carrier." It is a shape-shifter. Its moral contribution depends on the other features present (e.g., "intruder with a gun").

  ### Phase 3: The Generalist Reply & Limitations (10 Minutes)
  *   **Challenge the Students:** "You are convinced Particularists now. But play Devil's Advocate. How would a Kantian defend themselves?"
      *   *Expected Reply:* "We can just add exceptions to the rule." (e.g., "Do not lie, *ceteris paribus*.")
      *   *The Trap:* Ask them to write that exception down. If they add enough exceptions to cover every case, does the rule still guide action? Or does it just say "Do the right thing"? If the latter, the rule is empty.
  *   **Honest Limitations of the Game (Crucial for PhD Level):**
      1.  **Majoritarianism:** The game equated "Right" with "What most teams said." Particularism is **not** relativism or majority rule. A particularist believes there is a truth of the matter, but it cannot be codified. The game fudges this for scoring purposes.
      2.  **Discrete Cases:** Real life isn't 4 discrete rounds. Particularism is about a continuous sensitivity to nuance, not just flipping binary verdicts.
      3.  **The "Default" Assumption:** The game assumes lying is *normally* wrong and needs an exception. Some radical particularists argue there is no default valence at all. The game subtly reinforces Generalism by treating Round 1 as the "baseline."

  ---

  ## IV. Anticipating Stuck Points (TA Guide)

  **1. Students write tautological rules.**
  *   *Example:* "Do what is right."
  *   *Intervention:* During Round 1, circulate and reject these. "This rule doesn't cite a feature. You must cite something like 'pain' or 'promises'."

  **2. Students refuse to flip (Rigid Generalism).**
  *   *Scenario:* A team says Lying is Impermissible in Round 2 (The Intruder).
  *   *Outcome:* They lose Consensus Points.
  *   *Debrief Use:* Highlight this team. "Team C stuck to their principle and lost points. This is the cost of Generalism in this game. In reality, would we blame Team C? Or would we blame the principle?" This highlights the *practical* cost of rigid principles.

  **3. Students argue the "Prediction" is impossible.**
  *   *Scenario:* "How can we predict what they will say?"
  *   *Response:* "You predict based on what you think is *obvious*. The fact that you can predict it means you share a moral language that isn't dependent on the specific rule you just wrote."

  **4. The "Ceteris Paribus" Defense.**
  *   *Scenario:* In the debrief, a student says, "The principle is still true, it just has 'all else being equal' attached."
  *   *Response:* "Okay. If 'all else being equal' includes 'unless there is an intruder,' 'unless it's a dentist,' 'unless it's a surprise party'... at what point does the principle stop doing any work? If you need to know the context to apply the principle, is the principle doing the heavy lifting, or is the context?"

  ---

  ## V. Why This Works for Your Section
  1.  **Low Prep, High Yield:** Requires only paper and envelopes, but generates complex dialectic.
  2.  **Pre-Theory:** Students experience the *problem* (principles break) before hearing the *solution* (particularism), making the theory feel necessary rather than arbitrary.
  3.  **Scoring Tension:** By rewarding prediction (intuition) over consistency (principle), you gamify the philosophical conflict. The "winning strategy" is to be a particularist, even if they don't know the word yet.
  4.  **Scalable Debrief:** You can spend 10 minutes on it if running late, or 40 minutes if the discussion sparks. The data on the board anchors the conversation.
