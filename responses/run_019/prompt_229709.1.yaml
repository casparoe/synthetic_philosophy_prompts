prompt: |-
  I'm a philosophy PhD student and I TA a weekly section for an undergraduate normative ethics course: 16 students, one 80-minute meeting, and they have just finished a unit on Kantian and consequentialist moral principles. I want an activity for that section that makes them feel the pull of moral particularism — the claim that there are no true, exceptionless moral principles — before anyone names the view. Here is the structure I have in mind, and I would like you to develop it into something runnable: students work in small teams; each round they receive short case cards and must issue a verdict, then publicly state the rule they used to reach it; the deck is stacked so that a feature they relied on (say, that someone kept a promise, or that an act caused pain) reappears in a later card with reversed moral polarity, so every stated rule gets counterexampled within a round or two. I would also like a scoring twist: teams earn points for correctly predicting the majority verdict on each card. My hope is that this produces the real dialectic — their principles keep failing, yet their predictions mostly succeed — so the debrief can use that tension, rather than a lecture, to introduce the generalist's reply and what each side must give up. Please give me the full rules and flow, several sample cards including the polarity-flip pairs, and a debrief plan that maps moments in the game onto the particularism/generalism dispute, anticipates where students will predictably get stuck, and is honest about which part of the philosophical position the game cannot reproduce.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** Undergraduate students in a normative ethics course (post-Kant/Consequentialism unit).
      *   **Instructor:** Philosophy PhD student/TA.
      *   **Constraints:** 16 students, 80-minute section, weekly meeting.
      *   **Goal:** Create an experiential activity to introduce *Moral Particularism* (no exceptionless principles) *before* naming the view.
      *   **Mechanism:** Small teams, case cards, verdict + rule statement, stacked deck (features flip polarity), scoring twist (points for predicting majority verdict).
      *   **Desired Outcome:** Tension between failing principles and successful predictions.
      *   **Deliverables:** Full rules/flow, sample cards (including polarity flips), debrief plan (mapping game to philosophy, anticipating stuck points, acknowledging limitations).

  2.  **Deconstruct the Activity Design:**
      *   *Time Management:* 80 minutes is tight. Need to account for setup, gameplay (multiple rounds), and debrief.
          *   Setup/Intro: 10 mins.
          *   Gameplay: 40 mins (4 rounds of 10 mins each).
          *   Debrief: 30 mins.
      *   *Grouping:* 16 students / 4 teams of 4 is ideal for discussion without being too unwieldy.
      *   *Scoring:* Needs to be simple. Points for "Majority Match" (predicting what most people will say) vs. Points for "Consistency" (sticking to a rule). The prompt asks for points for *predicting the majority verdict*. This is crucial. It incentivizes intuition over rigid rule-following.
      *   *The "Stacked Deck":* This is the core philosophical engine.
          *   Round 1: Establish a rule (e.g., "Lying is wrong").
          *   Round 2: Flip the valence of that feature (e.g., "Lying to save a life is right").
          *   Round 3: Introduce a new feature (e.g., "Breaking a promise").
          *   Round 4: Flip that feature (e.g., "Breaking a promise to prevent harm").
      *   *The Tension:* If they stick to the rule, they lose points in Round 2/4 (because the majority will flip). If they flip to match the majority, they admit their rule from Round 1/3 was false/exception-laden.

  3.  **Drafting the Rules & Flow:**
      *   Need clear instructions.
      *   Need a scorecard template.
      *   Need to define "Verdict" (Permissible/Impermissible) and "Rule" (The principle used).
      *   Need to define "Prediction" (What do you think the *class* will say?).
      *   *Refinement on Scoring:* To maximize the tension, teams should get points for matching the *Class Consensus* (the majority verdict of all teams). This forces them to tune into moral intuition rather than just logic. Let's add a "Principle Penalty" or just highlight the inconsistency in the debrief. Actually, the prompt says "teams earn points for correctly predicting the majority verdict." Okay, let's stick to that. It rewards *particularist intuition* (knowing the right answer in context) over *generalist rigidity* (sticking to the rule).

  4.  **Developing the Case Cards (The "Stacked Deck"):**
      *   Need pairs where a specific feature ($F$) counts *for* wrongness in Case A, but *for* rightness (or is neutral) in Case B.
      *   *Pair 1: Truth-telling/Lying.*
          *   Case A: Lying to get out of trouble. (Intuition: Wrong). Rule: "Do not lie."
          *   Case B: Lying to a murderer at the door (Kant's famous example). (Intuition: Permissible/Right). Rule "Do not lie" fails.
      *   *Pair 2: Promise-keeping.*
          *   Case A: Breaking a lunch date for fun. (Intuition: Wrong). Rule: "Keep promises."
          *   Case B: Breaking a lunch date to help an accident victim. (Intuition: Permissible). Rule "Keep promises" fails.
      *   *Pair 3: Causing Pain.*
          *   Case A: Hitting someone out of anger. (Intuition: Wrong). Rule: "Do not cause pain."
          *   Case B: Dentist drilling a tooth / Setting a broken bone. (Intuition: Permissible). Rule "Do not cause pain" fails.
      *   *Pair 4: Stealing/Property.*
          *   Case A: Stealing a TV for fun. (Intuition: Wrong).
          *   Case B: Stealing a knife from a suicidal person. (Intuition: Permissible).
      *   *Selection:* Let's use 4 Rounds.
          *   Round 1: Lying (Standard).
          *   Round 2: Lying (Murderer at the Door).
          *   Round 3: Promise Keeping (Trivial).
          *   Round 4: Promise Keeping (Emergency).
      *   *Wait, one nuance:* The prompt says "every stated rule gets counterexampled within a round or two."
      *   *Revised Plan:*
          *   Round 1: Lying (Selfish).
          *   Round 2: Lying (Altruistic).
          *   Round 3: Pain (Malicious).
          *   Round 4: Pain (Medical/Constructive).
      *   *Actually, let's make it tighter.* Let's do 3 Rounds of 2 cards each? No, 4 rounds of 1 card is better for pacing.
      *   *Let's ensure the "Prediction" mechanic works.* Teams submit: 1. Verdict, 2. Rule, 3. Prediction of Class Majority.
      *   *Scoring:* 1 point if Verdict matches Class Majority. 1 point if Prediction matches Class Majority. (Double reward for tuning into intuition).

  5.  **Drafting the Debrief Plan:**
      *   *Phase 1: The Data.* Show the scoreboard. Highlight that everyone got high scores on predictions (we know what's right) but low scores on consistency (our rules changed).
      *   *Phase 2: The Diagnosis.* Why did the rules fail? (Holism of reasons). A feature's moral valence depends on context.
      *   *Phase 3: The Philosophy.* Introduce Particularism (Dancy) vs. Generalism (Kant/Util).
      *   *Phase 4: The Generalist Reply.* Can we save the principles? (Add ceteris paribus clauses? "Do not lie *unless*..."). Show how this makes the principle empty or tautological.
      *   *Phase 5: Limitations.* The game simplifies. Real ethics isn't just a vote. Particularism isn't "anything goes."

  6.  **Refining the Logistics:**
      *   16 students = 4 teams of 4.
      *   Materials: Printed cards, score sheets, whiteboard for tracking class consensus.
      *   TA Role: Facilitator, Scorekeeper, "Oracle" (revealing the majority).

  7.  **Addressing Specific Prompt Requirements:**
      *   *Full rules and flow:* Check.
      *   *Sample cards including polarity-flip pairs:* Check.
      *   *Debrief plan mapping moments to dispute:* Check.
      *   *Anticipate stuck points:* (e.g., students refining rules to be too specific).
      *   *Honest about limitations:* (e.g., game implies majoritarianism, which isn't Particularism).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 80 minutes enough?
      *   *Fix:* Keep the rounds tight. 5 minutes per round max for discussion + submission. 4 rounds = 20 mins. Plus setup and scoring time. Let's aim for 4 Rounds.
      *   *Critique:* Will students just write "Do the right thing" as a rule?
      *   *Fix:* Explicitly forbid tautological rules in the instructions (e.g., "Must cite a specific feature like lying, pain, promises").
      *   *Critique:* How do we handle the "Prediction" scoring without revealing the majority immediately?
      *   *Fix:* Collect all sheets. Tally quickly (TA needs help or pre-made tally sheet). Or, have teams reveal verdicts sequentially, tally on board, *then* award points.
      *   *Better Flow for Scoring:*
          1.  Teams discuss Card.
          2.  Teams write Verdict, Rule, Prediction.
          3.  Teams reveal Verdicts simultaneously.
          4.  TA calculates Class Majority.
          5.  Teams award themselves points based on Majority.
          6.  TA collects Rules to show inconsistency later.
      *   *Wait, if they see the majority before predicting?* No, Prediction must be made *before* knowing the majority.
      *   *Revised Flow:*
          1.  Teams decide Verdict & Rule.
          2.  Teams write Prediction (What will most teams say?).
          3.  Reveal Verdicts.
          4.  Determine Majority.
          5.  Award Points.
      *   *Crucial:* The TA needs to track the *Rules* secretly to display the contradiction in the debrief.

  9.  **Final Polish:**
      *   Tone: Academic but engaging.
      *   Formatting: Clear headers, bullet points.
      *   Philosophy Check: Ensure the distinction between *holism of reasons* (the mechanism) and *particularism* (the thesis) is clear in the debrief.

  10. (Final check against prompt): "makes them feel the pull of moral particularism... before anyone names the view." "scoring twist: teams earn points for correctly predicting the majority verdict." "debrief... honest about which part of the philosophical position the game cannot reproduce." -> All noted.

