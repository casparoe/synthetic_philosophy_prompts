answer: |-
  **To:** Regional Health System Ethics Committee
  **From:** Ethics Advisory Consultant
  **Subject:** Decision Procedure for Scarce Resource Allocation (Conflicting Claims)

  ### Introduction: The Philosophical Stalemate

  You are facing a classic impasse in non-ideal moral theory. There is no philosophical consensus on whether, why, or how numbers count in triage.

  *   **The Aggregationist View:** Holds that we ought to minimize total harm. Saving five lives is morally superior to saving one because five losses are worse than one. This is the dominant view in disaster medicine and utilitarian ethics.
  *   **The Non-Aggregationist View (Taurek):** Holds that there is no "super-observer" for whom the sum of losses is experienced. Loss is relative to the loser. To the single patient, their death is a 100% loss. To the five, their deaths are each 100% losses. There is no metaphysical scale where five deaths outweigh one. Therefore, automatically saving the five treats the single person as a mere means to the greater good, violating the duty of equal concern.

  **Clarifying Taurek:** A common caricature is that Taurek demands a 50/50 coin flip between *groups* (giving the single person a 50% chance and the group of five a 50% chance). Taurek's actual argument in *"Should the Numbers Count?"* is more subtle. He argues for **equal concern for each individual**. In a 1-vs-5 scenario, a strict Taurekian lottery gives each *person* an equal chance of rescue (e.g., 6 tickets, 1 for the single patient, 5 for the group). This statistically saves the five most of the time, but it does so because of procedural fairness, not because the five have a stronger collective claim. However, in policy contexts, the "Taurekian" position is often understood as the claim that **numbers alone cannot justify overriding an individual's claim to life.**

  This procedure does not resolve this debate. Instead, it forces the committee to identify *where* the debate lies and mandates that policy choices be explicit rather than hidden behind assumed consensus.

  ---

  ### The Allocation Decision Procedure

  **Step 1: Medical Comparability and Urgency**
  *   **Question:** Are the competing patients medically comparable regarding prognosis and resource usage?
  *   **Criteria:** Do both parties require the *same* resource to survive/thrive? Is the likelihood of success (medical utility) roughly equivalent?
  *   **Settled Answer:** If one patient has a significantly lower likelihood of survival even with the resource, allocate to the patient with higher medical utility. This is standard triage, not a moral conflict about numbers.
  *   **Hand-off:** If medical utility is equivalent, proceed to Step 2.

  **Step 2: Stake Symmetry**
  *   **Question:** Is the harm at stake identical in kind and magnitude for all parties?
  *   **Criteria:** Is it Life-vs-Life? Limb-vs-Limb? Pain-vs-Pain?
  *   **Settled Answer:** If the stakes are different (e.g., Life vs. Leg), proceed to Step 5 (The Hand-off). There is no philosophical consensus on how to weigh incommensurable goods across persons.
  *   **Proceed:** If the stakes are identical (e.g., Life vs. Life), proceed to Step 3.

  **Step 3: The Aggregation Check (The Taurek Threshold)**
  *   **Question:** Does the committee endorse the principle that a greater number of identical claims creates a stronger moral obligation than a smaller number of identical claims?
  *   **Option A (Aggregation):** Yes. The duty to minimize total loss of life overrides the duty to give the single individual an equal chance.
  *   **Option B (Non-Aggregation):** No. The single individual's claim to life is not diminished by the existence of others. We owe each person equal concern, which may require a lottery.
  *   **Settled Answer:** This is **not** a settled philosophical question. The committee must record which principle the health system adopts as policy.
      *   *If Option A:* Allocate to the larger group. (Acknowledge this overrides the single individual's claim).
      *   *If Option B:* Proceed to Step 4.

  **Step 4: Procedural Remedy for Non-Aggregation**
  *   **Question:** If we do not aggregate claims, how do we operationalize "equal concern"?
  *   **Criteria:**
      *   *Weighted Lottery:* Each individual receives one "ticket." (In 1-vs-5, the single person has a 1/6 chance; the group has a 5/6 chance). This respects Taurek's "equal concern per person" while acknowledging the statistical reality.
      *   *Group Coin Flip:* A 50/50 chance between the groups. (In 1-vs-5, the single person has a 1/2 chance). This is a stronger protection of the minority but is less commonly defended in literature than the weighted lottery.
  *   **Settled Answer:** The committee must select a mechanism. A weighted lottery is the most defensible middle ground in the literature, as it counts numbers procedurally without counting them substantively.
  *   **Hand-off:** If the committee cannot agree on a mechanism, the decision defaults to Step 5.

  **Step 5: The Policy Hand-off (Unresolved Conflicts)**
  *   **Condition:** This step is triggered if Stakes are Asymmetric (Step 2) OR if the Committee cannot agree on Aggregation (Step 3).
  *   **Action:** The case is flagged as a **Value Judgment**. Philosophy provides no algorithm here.
  *   **Requirement:** The decision must be made by senior administration or a designated triage officer, documented as a *policy choice* rather than a *moral discovery*. The rationale must explicitly state: "We are prioritizing X over Y, acknowledging that this is a contestable value judgment."

  ---

  ### Application to Case Studies

  #### Case 1: One Dose, One Life vs. Five Lives (Identical Prognosis)

  **Step 1 (Medical):** Passed. Resource is the same; prognosis is identical.
  **Step 2 (Stakes):** Passed. All face death. Stakes are symmetric.
  **Step 3 (Aggregation):** **IMPASSE.**
  *   *Aggregationist View:* Save the five. To do otherwise is to allow five deaths to prevent one.
  *   *Taurekian View:* Saving the five automatically treats the one as expendable.
  *   *Procedure Verdict:* The committee must choose Option A or Option B.
      *   *Likely Outcome:* Most health systems will choose Option A (Save the Five) based on public health utility.
      *   *Unpalatable Truth:* If the committee chooses Option A, they must acknowledge they are rejecting Taurek's core premise. They are asserting that the single patient is sacrificed for the greater good. There is no philosophical way to "prove" the single patient is wrong to object.
      *   *Alternative:* If the committee chooses Option B (Weighted Lottery), the single patient gets a 1/6 chance of survival.
      *   *Unpalatable Truth:* If the committee chooses the Lottery, they must acknowledge that in roughly 17% of such cases, five people will die to save one. This is difficult to justify to the public.

  **Recommendation:** Adopt a **Weighted Lottery** policy for identical stakes. This satisfies the Aggregationist desire to likely save the most (5/6 probability) while satisfying the Taurekian demand that the single person is not *automatically* excluded (they retain a 1/6 claim). This is the only procedural solution that respects the literature on both sides.

  #### Case 2: One Dose, One Life vs. Five Permanent Paralysis

  **Step 1 (Medical):** Passed. Resource is the same.
  **Step 2 (Stakes):** **FAILED.**
  *   *Analysis:* Death is not identical to paralysis. One involves the end of existence; the other involves a reduced quality of life.
  *   *Procedure Verdict:* Immediate Hand-off to Step 5.
  *   *Reasoning:* There is no consensus on how to trade life against quality of life across different numbers of people.
      *   *Aggregationist Risk:* Does 5 cases of paralysis outweigh 1 death? Some QALY (Quality-Adjusted Life Year) models might say yes; others say no.
      *   *Taurekian Risk:* Taurek argues we cannot compare losses between persons at all. We cannot say the paralysis is "less bad" in a way that allows us to aggregate five of them to outweigh a death.
  *   **Unpalatable Truth:** Any decision here is arbitrary from a philosophical standpoint.
      *   If you save the one life, you are telling the five paralyzed patients their suffering counts for less than the one person's existence.
      *   If you save the five from paralysis, you are allowing one person to die to prevent non-fatal harm to others.
  *   **Recommendation:** This requires a **Policy Hand-off**. The health system must establish a pre-determined hierarchy of outcomes (e.g., "Life always trumps non-fatal injury") *before* the crisis occurs. Do not leave this to bedside clinicians. If no such policy exists, the committee must vote. If the vote is split, acknowledge that the system has no moral guidance for this specific scenario and default to "First Come, First Served" or "Random Lottery" to avoid bias, explicitly noting that this is a failure of policy, not a moral solution.

  ### Summary for the Committee

  1.  **Taurek is not a caricature:** He does not necessarily demand a 50/50 coin flip between groups. He demands that the single person's claim is not *automatically* voided by the presence of others.
  2.  **No Consensus Exists:** Do not write the protocol as if "Saving the Most" is a moral fact. It is a policy preference.
  3.  **The Weighted Lottery:** In Case 1 (Life vs. Life), a weighted lottery (1 ticket vs. 5 tickets) is the most philosophically robust compromise. It saves the many most of the time without declaring the one's life worthless.
  4.  **Incommensurability:** In Case 2 (Life vs. Paralysis), philosophy offers no help. You must make a brute policy choice and own the moral residue.

  **Final Warning:** If you adopt a strict "Save the Most" protocol without acknowledging the Taurekian objection, you risk institutionalizing a form of utilitarianism that treats minority patients as expendable resources. If you adopt a strict "Coin Flip" protocol, you risk public outrage when five die to save one. The procedure above forces you to look at that trade-off directly.
