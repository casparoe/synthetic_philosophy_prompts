answer: |-
  You have stumbled onto a genuine philosophical insight that most grant panels spend decades trying to ignore. You are describing **incommensurability**.

  The standard points system assumes all value is a single substance (like water) that can be poured into different buckets and measured in litres. Your intuition is correct: sometimes value is more like oil and water. You can have a litre of each, but you can't mix them, and saying one is "more liquid" than the other is nonsense.

  When you force incomparable things onto a single scale, you aren't being objective; you are being arbitrary. You are just hiding the arbitrariness behind a spreadsheet.

  Here is a procedure designed for five laypeople, three hours, and the honest admission that some things cannot be weighed against each other.

  ### The "Three-Hour Protocol"

  **Preparation (Before the meeting):**
  The Clerk (one of you) circulates the applications one week prior. No scoring. Just read them.

  **Hour 1: Clustering and Feasibility (The "Can We?" Phase)**
  *   **Step 1: The Binary Gate.** Go through each application. Is it eligible? Is the budget realistic? Is the organisation solvent?
      *   *Action:* Pass/Fail. No numbers. If it fails, it's out. Write a one-sentence reason (e.g., "No safeguarding policy"). This is explainable to applicants.
      *   *Where scoring is fine:* Use numbers here for risk. (e.g., "Do they have 3 quotes for the roof? Yes=1, No=0"). This is factual, not valuative.
  *   **Step 2: Clustering.** Group the remaining applications by *primary intent*.
      *   *Example:* Roof + Hall Heating = **Infrastructure**. Counselling + Food Bank = **Welfare**. Football + Youth Club = **Activity**. Meadow + Tree Planting = **Environment**.
      *   *Why:* You only need to wrestle with incomparability *between* clusters. Within a cluster (e.g., Football vs. Youth Club), a points system or direct comparison is usually fine because the goals are similar.

  **Hour 2: The Comparison (The "Should We?" Phase)**
  This is where your insight applies. You now have a shortlist of clusters competing for the £40k.
  *   **Step 3: The Reasons Test.** Pick two top contenders from different clusters (e.g., Roof vs. Counselling). Ask this specific question:
      *   *"If we fund A instead of B, is it because A does **more** of what B does, or because A does **something different** that we also value?"*
      *   **If "More of the same":** They are **Comparable**. You can argue magnitude. (e.g., "This counselling helps 50 people, that one helps 10"). Use a simple ranking here.
      *   **If "Something different":** They are **Incomparable**. (e.g., "A keeps a building dry; B stops people crying"). Stop trying to score them. Acknowledge the clash.
  *   **Step 4: Distinguishing "Equal" from "Incomparable".**
      *   **Equal:** "We value these for the same reason, and they deliver it equally well." (e.g., Two youth clubs with identical outcomes).
      *   **Incomparable:** "We value these for different reasons, and neither reason trumps the other."
      *   *The Test:* Ask, "If we swapped the funding, would we feel we lost something specific?"
          *   If the answer is "No, it's the same impact," they are **Equal**.
          *   If the answer is "Yes, we'd lose the biodiversity," even if the "social good" score is the same, they are **Incomparable**.

  **Hour 3: Resolution and Commitment (The "Decision" Phase)**
  *   **Step 5: The Decision Rule.**
      *   **If Comparable (One is clearly better):** Fund the better one.
      *   **If Equal:** Flip a coin. It saves time and is fair.
      *   **If Incomparable:** This is the hard bit. You have two options:
          1.  **Split the pot:** If both fit the budget, fund both.
          2.  **The Principled Coin Flip:** If you can only fund one, flip a coin.
  *   **Step 6: The Record.** Write down the decision *and* the reason type.
      *   *Bad Record:* "Roof scored 6, Counselling scored 7." (This is a lie).
      *   *Good Record:* "Roof and Counselling were incomparable. Roof preserves infrastructure; Counselling alleviates acute suffering. We prioritised acute suffering this cycle based on our mandate to help the vulnerable. Coin flip used for remaining funds."

  ---

  ### Addressing Your Specific Questions

  **1. Is a coin flip between incomparable options a cop-out?**
  No. It is the only honest move.
  If two things are incomparable, reason cannot tell you which to choose. If you argue until someone yields, the winner isn't the "better" project; it's the project backed by the most stubborn panel member. That is rule by temperament, not merit.
  A coin flip admits: *"Both are good. Reason runs out here. We will not pretend one is superior. We will let chance decide so no panel member bears the guilt of killing a worthy cause based on a false metric."*
  To a grumpy applicant, you explain: *"Your project was excellent. We funded a different one not because it was 'better', but because we had to choose between two different kinds of good, and we used random selection to ensure impartiality."* That is harder to argue with than a score of 6.5 vs 7.

  **2. Where does scoring lie?**
  Scoring lies when it aggregates different *categories* of value into a single total.
  *   *Okay:* Scoring "Financial Risk" or "Delivery Capacity." (These are factual).
  *   *Lying:* Scoring "Community Benefit" where "Benefit" includes both "warmth" and "happiness."
  *   *Rule:* Only score metrics that share a unit of measurement (e.g., cost per head, number of beneficiaries). Never score "Impact" generally.

  **3. What can't be proceduralised?**
  **The Mission.** The procedure can't tell you whether your Trust cares more about *buildings* or *people*. That is a political/moral choice the panel must make explicitly.
  *   *Flag this:* In Hour 3, before flipping coins, ask: "Does our Trust Deed or history favour one type of good?" If the Trust was set up to "relieve poverty," Counselling beats Roof. If it was set up to "maintain village amenities," Roof beats Counselling. If the Deed is vague, *you* must define the priority for this meeting. That is human judgement. Own it.

  ---

  ### Case Study Run-Throughs

  #### Case 1: Church Hall Roof (£25k) vs. Bereavement Counselling (£25k)
  *   **The Test:**
      *   Roof: Preserves a community asset. Prevents building decay. One-off cost.
      *   Counselling: Relieves human suffering. Ongoing need.
      *   *Question:* Is a dry hall "more" or "less" than reduced grief?
      *   *Verdict:* **Incomparable.** Different categories (Infrastructure vs. Welfare).
  *   **The Decision:**
      *   Do you have £50k? No, only £40k.
      *   Can you split? No, both need full amount to work.
      *   *Mission Check:* The panel reviews the Trust's founding document. It says "For the benefit of residents."
      *   *Argument:* A roof benefits residents who use the hall. Counselling benefits residents in crisis.
      *   *Outcome:* The panel decides that "crisis intervention" is a higher priority than "maintenance" for this year.
      *   *Result:* **Counselling gets funded. Roof is rejected.**
      *   *Explanation to Roof Team:* "Your application was strong. However, we had to choose between infrastructure and welfare. Given our limited funds and the acute need in the village, we prioritised welfare this cycle. We encourage you to apply to the Diocesan Fund which is specifically for church buildings."

  #### Case 2: Football Kit (£5k) vs. Meadow Rewilding (£5k)
  *   **The Test:**
      *   Football: Active health, social cohesion for teens.
      *   Meadow: Biodiversity, climate, passive enjoyment.
      *   *Verdict:* **Incomparable.** (Human Activity vs. Ecological Health).
  *   **The Decision:**
      *   Funds allow both (£10k total needed, £40k available).
      *   *Outcome:* **Fund Both.**
      *   *Note:* Incomparability doesn't always mean a fight. It often means you stop trying to rank them and just fund the portfolio.

  ---

  ### The Unpleasant Outcome: Why the Roof Loses (and you should live with it)

  Let's run the procedure where the **Roof loses**, even though the hall is leaking.

  **The Scenario:**
  The Roof application is perfect. The Counselling application is perfect. You only have money for one.
  The panel uses the **Mission Check**. You realise the Village Trust is the *only* source of funding for the Counselling charity. The Church, however, has access to a National Heritage Grant that you don't know about until you ask during the meeting (or should have known).

  **The Procedure's Output:**
  1.  **Comparability:** Incomparable (Building vs. People).
  2.  **Subsidiarity Test (New Step):** "Who else can fund this?"
      *   Counselling: No one else.
      *   Roof: Church Diocese / Heritage Lottery.
  3.  **Decision:** Fund the Counselling.

  **Why you should live with it:**
  It feels wrong because the roof is *visible* and the grief is *invisible*. A leaking roof is a scandal; a person suffering in silence is not.
  But the procedure forces you to look at **marginal utility**. £25k to the Church might be 50% of their need. £25k to the Counselling charity might be 100% of their need.
  If you fund the roof, the hall stays open, but the counselling service closes.
  If you fund the counselling, the hall leaks (maybe they put a bucket in it), but the service stays open.
  The procedure forces you to admit that "Preserving a building" is not automatically more important than "Preserving a service." If you use the points system, the Roof might win because "Infrastructure" sounds solid and scores high on "Longevity." The incomparability protocol stops you from hiding behind "Longevity" points. It forces you to say: *"We are letting the roof leak because human suffering is our priority this year."*
  That is a hard thing to say. It is also an honest thing to say.

  ---

  ### The Main Way This Will Go Wrong

  **Procedural Drift due to Discomfort.**

  Human beings hate ambiguity. In Hour 2, when you declare two items "Incomparable," the tension in the room will rise. Someone will say, *"Come on, surely saving the hall is more important than... whatever that is."*
  They will try to reintroduce a hidden hierarchy. They will say, *"Well, if we don't fix the roof, the hall closes, and then the counselling can't meet there!"* (Even if the counselling is online or elsewhere).

  **The Failure Mode:**
  You will be tempted to revert to the points system because it gives you a number to hide behind. It reduces anxiety.
  *   *Sign you are failing:* You start hearing phrases like "On balance..." or "Overall score..." during the Incomparable phase.
  *   *The Fix:* Appoint one person as the **"Devil's Advocate"** for the meeting. Their only job is to interrupt anyone who tries to compare incomparables. *"Stop. You are comparing apples and oranges. Are you saying apples are better, or that we only want fruit salad?"*

  ### Summary for the Panel
  1.  **Stop scoring value.** Score risk and facts only.
  2.  **Cluster** applications by intent.
  3.  **Identify Incomparability.** If the reasons for funding are different categories, admit it.
  4.  **Use the Coin.** If you truly cannot choose between two goods, do not argue. Flip. It is fairer.
  5.  **Record the Reason.** Tell applicants *why* (e.g., "We prioritised welfare over infrastructure"), not *how much* (e.g., "You scored 6/10").

  You are right to feel that the points system is cheating. It's a simulation of objectivity. Your new procedure trades the *illusion* of certainty for the *reality* of responsible choice. It will feel messier, but the decisions will be yours, not the spreadsheet's.
