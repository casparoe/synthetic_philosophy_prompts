      *   *Refinement on Incentives:* Actually, if I want them to feel the squirm, I need them to *try* to assert the 1st person version seriously. If they treat it as a joke, it fails.
      *   *Better Mechanic:* "The Oath." You have to stand up and read it as if you mean it. The class judges "Sincerity/Coherence."
      *   *Let's stick closer to the User's Sketch but sharpen it:* The "Fact Card" idea is good. Let's make it a game of "Can you get away with saying this?"
      *   *Revised Name:* "The Assertion Game."
