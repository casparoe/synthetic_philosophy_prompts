      *   Prep < 20 mins? Yes.
      *   No tech? Yes.
      *   No Moore/Belief-norms up front? Yes.

      *Self-Correction on Debrief:* Make sure to explicitly mention the "Omissive" vs "Commissive" distinction in the debrief plan, as the user mentioned it. The game focuses on Omissive ("P but I don't believe"), so I need to note in limitations that Commissive ("Not-P but I believe") isn't covered by the mechanic unless I add a "Negation Card." I'll add a "Negation Token" to the materials to cover this briefly. Actually, keep it simple. Stick to Omissive for the game, mention Commissive in debrief as "The Flip Side."

      *Self-Correction on Incentives:* If the goal is to feel the squirm, winning shouldn't be too easy. Let's make the voting criteria "Could you imagine someone saying this seriously?" rather than "Is this true?" This targets the *assertability* condition without naming it.

      *Final check on timing:* 75 mins total.
      - Intro/Rules: 10
