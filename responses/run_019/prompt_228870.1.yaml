answer: |-
  Here is a complete lesson plan designed to meet your constraints. It prioritizes student production of the sentences and uses a simple scoring mechanic to make the asymmetry visible on the board before you explain *why* it exists.

  # Activity: "The Coherence Audit"

  **Time:** 75 Minutes
  **Prep:** < 20 Minutes
  **Materials:** 20 Index cards (Fact Cards), 1 Marker, Board space.

  ## 1. Runnable Rules & Setup

  ### Prep (Before Class)
  Write one mundane, verifiable (or plausibly verifiable) proposition on each index card.
  *   *Examples:* "There are 14 chairs in this room," "It is raining outside," "The TA is wearing shoes," "The cafeteria is serving pizza," "2+2=4," "This marker is blue."
  *   *Tip:* Mix trivial truths with things they can't immediately verify (e.g., weather, cafeteria) to prevent immediate fact-checking from derailing the belief question.

  ### Setup (5 Minutes)
  1.  **Seating:** Arrange students in pairs (8 pairs total).
  2.  **The Board:** Draw two columns: **"Observer Reports"** and **"Personal Declarations."** Leave space for tally marks.
  3.  **The Rule:** Tell the class: *"We are testing the limits of coherent announcements. You will construct sentences using a Fact Card and a mandatory phrase. Your goal is to earn points for your team."*
  4.  **The Voting Criteria:** Write on the board: **"Could a sincere person announce this without sounding confused?"**
      *   **Yes (Coherent):** +1 Point.
      *   **No (Incoherent):** 0 Points.
      *   *Crucial Instruction:* "Do not vote based on whether the fact is *true*. Vote on whether the *sentence* sounds like something a normal person can say."

  ### Round 1: Observer Reports (15 Minutes)
  1.  **Mechanic:** In each pair, Student A draws a Fact Card. Student A must address the class and say:
      *   *"[Fact], but [Student B] does not believe [Fact]."*
      *   *Example:* "There are 14 chairs in this room, but Sarah does not believe there are 14 chairs in this room."
  2.  **Action:** Student A reads the sentence.
  3.  **Vote:** Class votes hands-up on "Coherent" vs. "Incoherent."
  4.  **Tally:** You mark the result in the **"Observer Reports"** column.
  5.  **Rotate:** Switch roles. Continue until all pairs have gone (or time runs out).
  6.  **Expected Outcome:** Almost every vote will be "Coherent." The column will fill with tally marks.

  ### Round 2: Personal Declarations (15 Minutes)
  1.  **Mechanic:** Same pairs, new Fact Cards. Student A must address the class and say:
      *   *"[Fact], but **I** do not believe [Fact]."*
      *   *Example:* "There are 14 chairs in this room, but **I** do not believe there are 14 chairs in this room."
  2.  **The Sincerity Oath:** Before they speak, require them to stand up and say: *"I am asserting this seriously."* (This prevents them from winking/nudging and forces them to inhabit the weirdness).
  3.  **Vote:** Class votes on "Coherent" vs. "Incoherent."
  4.  **Tally:** You mark the result in the **"Personal Declarations"** column.
  5.  **Rotate:** Switch roles.
  6.  **Expected Outcome:** Most votes will be "Incoherent." Students will hesitate, giggle nervously, or stumble. The column will remain mostly empty (or have "X" marks if you track failures).

  ### Round 3: The Escape Clauses (Optional/Time Permitting - 5 Minutes)
  If you have time, throw in two curveballs to test boundaries:
  1.  **Past Tense:** "[Fact], but I **did not** believe [Fact] yesterday."
  2.  **Hedging:** "[Fact], but I **might not** believe [Fact]."
  *   *Result:* These usually pass as "Coherent." Tally them separately.

  ---

  ## 2. Debrief Plan (35 Minutes)

  Do not mention Moore yet. Use the board tally to drive the discussion.

  **Phase 1: The Data (5 mins)**
  *   Point to the board. "Look at the difference. The content is identical. The truth conditions are identical. Why did Column 1 get points and Column 2 fail?"
  *   Elicit: "It sounds crazy," "You can't say that," "It's contradictory."
  *   Push back: "Is it a *contradiction*? If I say 'It's raining but I don't believe it,' is that logically impossible like 'It's raining and it's not raining'?"
  *   *Goal:* Establish that the sentence can be **True** (it is raining, and I am indeed deluded about it) but **Unsayable**.

  **Phase 2: Truth vs. Assertability (10 mins)**
  *   Ask: "In Round 2, when you voted 'Incoherent,' were you saying the sentence was *false*?"
  *   Students will realize: No. It could be true. The person could be self-deceived.
  *   **The Pivot:** "So we broke a rule that isn't about *truth*. We broke a rule about *speaking*."
  *   Introduce the concept: **Assertion implies Belief.** When you assert P to a group, you implicitly guarantee "I believe P."
  *   Write on board: **Assertion = P + I believe P.**
  *   Show the conflict: The sentence explicitly says "I do not believe P." The act of saying it implicitly says "I believe P." The sentence cancels the guarantee of the speech act.

  **Phase 3: The Asymmetry (10 mins)**
  *   Return to Round 1 (Observer Reports). "Why was it fine to say 'Sarah doesn't believe it'?"
  *   Answer: Because *I* am asserting it, so *I* guarantee *my* belief. I am not guaranteeing Sarah's belief.
  *   **Key Concept:** The norm binds the *speaker*, not the *subject*.

  **Phase 4: Naming the Beast (5 mins)**
  *   Now you can name it. "This is **Moore's Paradox**."
  *   Distinguish the two forms:
      1.  **Omissive:** "P but I don't believe P." (What we played).
      2.  **Commissive:** "Not-P but I believe P." (Ask them to imagine saying this: "It's not raining, but I believe it is." Equally weird).

  **Phase 5: The Escape Clauses (5 mins)**
  *   Refer to Round 3 (if played) or ask: "How *can* I say this without sounding crazy?"
  *   Discuss: Past tense ("I didn't believe it then"), Hypothetical ("If it were raining, I wouldn't believe it"), or Third-person ("He doesn't believe it").
  *   *Takeaway:* The paradox only bites in the **Present Tense, First Person, Indicative.**

  ---

  ## 3. Failure Modes & Handling

  **1. The "Self-Deception" Objection**
  *   *Student:* "But what if I'm lying to myself? Then it's true and I can say it."
  *   *Handle:* "You're right, the *state of affairs* is possible. But the *speech act* fails. If you stand up and assert 'It is raining,' you are offering me your belief as evidence. If you immediately retract that evidence ('but I don't believe it'), you've taken back the offer before I can accept it. We are judging the *offer*, not your psychology."

  **2. The "Grammar Joke" Derailment**
  *   *Student:* "This is just a joke/word game. It's not real philosophy."
  *   *Handle:* Lean into it. "Exactly. It feels like a joke because it violates a deep rule of how we communicate. If I said 'I promise to be there, but I don't intend to come,' that's not just a joke, that's a broken promise. We are looking for the rule that makes this feel like a broken promise."

  **3. Refusal to Play Round 2**
  *   *Student:* "I'm not saying that, it sounds stupid."
  *   *Handle:* Validate them. "That 'stupid' feeling is the data. I need you to say it *so that* we can analyze that feeling. Just read the card. If you refuse, your partner gets the point." (Peer pressure usually solves this).

  **4. Confusing Belief with Knowledge**
  *   *Student:* "Well, I don't *know* it's raining, so I can't believe it."
  *   *Handle:* Clarify the definition quickly. "For this game, 'belief' just means 'taking it to be true.' You don't need proof. If you look out the window and think 'rain,' you believe it. If you say 'rain' but think 'no rain,' that's the paradox."

  ---

  ## 4. Limitations (What the Game Can't Do)

  Be honest with yourself (and eventually the students) about what this activity leaves out:

  1.  **It doesn't explain *Why* the Norm exists.** The game demonstrates that a norm exists (assertion requires belief), but it doesn't prove *why*. Is it moral? Constitutive? Prudential? You have to lecture this. (e.g., Gricean maxims vs. Constitutive norms).
  2.  **It focuses on Omissive, not Commissive.** The game mechanics naturally produce "P but I don't believe." It is harder to game "Not-P but I believe." You will need to introduce the Commissive version verbally in the debrief.
  3.  **It assumes "Belief" is transparent.** The game relies on students knowing what they believe. It doesn't handle complex cases of unconscious bias or deep self-deception well, other than dismissing them as "psychology, not logic."
  4.  **It conflates "Saying" with "Asserting."** Students might argue "I can say it as an actor in a play." You need to clarify in the debrief that we are discussing *assertoric* speech acts, not quoting or acting.

  ## Prep Checklist (20 Mins)
  *   [ ] Write 20 Fact Cards (5 mins).
  *   [ ] Draw Board Columns (2 mins).
  *   [ ] Review "Handling Failure Modes" scripts (5 mins).
  *   [ ] Plan transition to lecture (Debrief notes) (5 mins).
  *   [ ] Buffer time (3 mins).

  This plan ensures they feel the paradox in their mouths before they hear the name in their ears.
