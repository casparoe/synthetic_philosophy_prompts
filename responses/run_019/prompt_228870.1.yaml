      *   *Objection 2:* "It's just grammar." (Response: Swap terms, check logic).
      *   *Objection 3:* "I'm self-deceived." (Response: Acknowledge, but distinguish *saying* it).
      *   *Objection 4:* Giggling/Not taking it seriously. (Response: TA models seriousness, enforce "Oath" rule).

  6.  **Drafting Limitations (Constraint 4):**
      *   *Limitation:* The game shows *that* it's weird, not *why* (philosophically). It doesn't explain the constitutive norm of assertion. It doesn't distinguish omissive ("P but I don't believe P") from commissive ("Not-P but I believe P") easily without modification.
