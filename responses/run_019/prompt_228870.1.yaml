      *   *Timing:* 10 mins setup/expl, 15 mins Round 1, 15 mins Round 2, 35 mins Debrief.
      *   *Incentive:* Small prize (candy) for most "Coherent" assertions. This is crucial. They *want* to win, so they will try to make the 1st person version sound okay, and when they can't, the frustration is pedagogical gold.

  4.  **Drafting the Debrief (Constraint 2):**
