      *   *User's Sketch:* I'm keeping the core "Fact Card + Disclaimer" mechanic but structuring the rounds to force the contrast.
      *   *Incentive Check:* If they get points for "Coherent," they will struggle in Round 2. This is good. It makes the failure explicit.
      *   *Wait, one tweak:* If they know they will fail Round 2, they might refuse to play. I need to frame it as "Try to make it work." Or, make the voting anonymous to reduce social pressure, but public tallying is better for the "board asymmetry" visual the user wanted. Let's stick with public voting (hands up) for the visual tally.
      *   *Refining the "Fact Cards":* Make sure they are mundane. "The door is closed," "I have a pen," etc.
      *   *Refining the "Belief Disclaimer":* Provide templates on the board so they don't waste time phrasing.

