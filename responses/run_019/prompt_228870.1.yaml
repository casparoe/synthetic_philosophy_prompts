      *   *Scoring:* If the class votes "Coherent," the team gets a point. If "Incoherent," no point. This motivates them to try to make the 1st person version work (which they will fail to do, creating the teaching moment).

  3.  **Drafting the Rules (Constraint 1):**
      *   *Prep:* Write facts on index cards. (10-15 mins).
