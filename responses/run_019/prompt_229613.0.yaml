  Your intuition is correct: the standard ITN framework is a heuristic for *scanning* causes, not a decision procedure for *allocating* capital. Your verdicts reveal that you are implicitly applying a more sophisticated decision rule that accounts for the *quality* of the evidence behind the scores, not just the scores themselves.

  Based on your six cases, I propose that your underlying operating principle is **Epistemically Constrained Marginal Expected Value (EC-MEV)**.

  This is not a single axiom but a small set of three integrated clauses. Together, they reproduce your verdicts, but they also expose a point of friction where one of your judgments becomes difficult to sustain without ad-hoc adjustment.

  ### The Principle: EC-MEV

  **1. The Marginalism Clause:** Neglectedness is not a binary virtue but a proxy for diminishing marginal returns. Funding levels should track the marginal utility of the next dollar, not the total size of the problem.
  **2. The Epistemic Security Clause:** Expected value estimates must be discounted by their *intersubjective verification*. A model that has not been stress-tested by independent, competent peers carries an "epistemic risk premium" that can render high paper EV fundable at zero.
  **3. The Causal Proximity Clause:** Tractability is not just about "can it be done?" but "is the causal chain from intervention to outcome specific and robust?" Interventions that rely on complex, poorly understood systemic cascades (where small errors compound) are discounted relative to those with direct, mechanistic levers.

  ### Mapping Your Verdicts

  Here is how EC-MEV delivers your six judgments:

  *   **Case 1 (Malaria):** **Fund.** High Epistemic Security (decades of RCTs), High Causal Proximity (bed nets $\to$ reduced bites $\to$ reduced malaria), and Marginalism is satisfied (still room for funding).
  *   **Case 2 (AI Risk):** **Fund.** This is the critical case. It passes **Epistemic Security** not because the model is proven, but because there is a growing *field* of technical researchers verifying the premises (intersubjective verification exists, unlike Case 6). It passes **Causal Proximity** because the lever (research/engineering) is directly connected to the risk source (the AI systems themselves), unlike Case 3.
  *   **Case 3 (Wild Animal Suffering):** **Do Not Fund.** Fails **Causal Proximity**. Ecosystems are complex adaptive systems; interventions have high risks of unintended consequences (e.g., reducing one species harms another). The causal chain is too diffuse to satisfy the constraint, even if Importance is astronomical.
  *   **Case 4 (Local Shelter):** **Do Not Fund.** Fails the implicit **Significance Threshold** (a prerequisite for EC-MEV to justify overhead). Low Importance cannot be overcome by High Tractability.
  *   **Case 5 (Crowded Global Health):** **Fund (Reduced).** Perfectly fits the **Marginalism Clause**. As neglectedness drops, marginal value drops. You reduce funding not because the problem is solved, but because the *value of the next dollar* has decreased relative to other opportunities.
  *   **Case 6 (Speculative Pandemic):** **Do Not Fund.** Fails **Epistemic Security**. A single analyst's model with unchecked parameters is epistemically fragile. The "two orders of magnitude" advantage is wiped out by the discount factor for model risk.

  ### The Friction Point: Which Verdict Must Go?

  You asked me to identify which verdict this principle cannot accommodate. The tension lies between **Case 2 (AI Risk)** and **Case 6 (Speculative Pandemic)**.

  To justify funding AI (Case 2) while rejecting the Pandemic model (Case 6), you are relying on **Field Maturity** as a proxy for **Epistemic Security**. You are effectively saying: *"AI risk is funded because many smart people agree the model is plausible; the Pandemic model is rejected because only one person says so."*

  **The Inconsistency:** If you apply the **Epistemic Security Clause** rigorously, **Case 2 (AI Risk)** becomes vulnerable. AI risk estimates also rest on models (takeoff speeds, alignment difficulty) that are not empirically verified and are subject to parameter uncertainty similar to the Pandemic case. The distinction is *sociological* (number of researchers) rather than *epistemological* (structure of the evidence).

  If you tighten the principle to demand structural verification (to comfortably reject Case 6), you undermine the justification for Case 2. If you loosen it to save Case 2 (accepting "expert consensus" as verification), you risk opening the door to Case 6 (if the analyst is reputable).

  **Verdict:** To maintain coherence, you must either:
  1.  **Retract Case 6:** Acknowledge that if the analyst is competent, the "consensus" requirement is a heuristic that might miss moonshots, and fund a small probe.
  2.  **Retract Case 2:** Acknowledge that AI risk is currently too speculative for *core* funding under strict EC-MEV, treating it as a high-risk bet rather than a priority.
  3.  **Accept the Sociological Clause:** Explicitly add "Field Consensus" as a fourth clause. This saves both, but admits that your principle is partly about *betting on communities*, not just *solving problems*.

  Given your confidence in Case 2, I suspect you will choose option 3. However, philosophically, **Case 2 is the one under the most pressure** from the principle you are implicitly using to reject Case 6.

  ### Predictions for Your Undecided Cases

  Here is how EC-MEV predicts you should handle the two new scenarios:

  **Case A: High Tractability, but only because the measurable part of the problem is small.**
  *   **Prediction:** **Do Not Fund.**
  *   **Reasoning:** This violates the **Causal Proximity Clause**. If the "tractable" part is only a small, measurable slice, you are likely optimizing a metric rather than the outcome (Goodhart's Law). The causal link between "solving the measurable part" and "solving the important problem" is weak. The high tractability score is illusory.

  **Case B: Importance ranking flips depending on which of two plausible moral views I hold.**
  *   **Prediction:** **Fund at a Discount (Moral Hedging) or Do Not Fund.**
  *   **Reasoning:** This violates **Epistemic Security**, specifically *Moral Robustness*. If the cause's value collapses under one plausible moral worldview, its *expected* value is fragile. EC-MEV suggests you should either:
      1.  Weight the EV by your credence in each moral view (which likely lowers the total EV below robust alternatives).
      2.  Only fund if the intervention is *robustly good* across both views (e.g., reducing suffering is good on both views, even if the magnitude differs).
      If the ranking *flips* (i.e., it's top priority on View 1, low priority on View 2), it lacks the robustness required for high-conviction allocation.

  ### Summary
  You are not inconsistent; you are a **Robustness-Weighted Maximizer**. You reject fragile models (Pandemic), fragile causal chains (WAS), and fragile moral premises, while accepting robust models (Malaria), maturing fields (AI), and diminishing returns (Global Health). The only cost of this coherence is admitting that your confidence in AI Risk relies more on the *community* validating the model than the *model* validating itself.
