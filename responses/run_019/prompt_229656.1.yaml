answer: |-
  # Joint Statement on Embedded Agency

  **Date:** October 24, 2023
  **Parties:** The Cartesian-Boundary Critics (CBC) and The Deflationary Situated Modellers (DSM)
  **Subject:** Status of Decision Theory for Embedded Agents

  ### 1. Agreed Claims

  Both parties endorse the following characterisations and commitments. These claims are intended to demarcate the common ground from which further inquiry proceeds.

  1.  **Definition of Embeddedness:** A decision problem is embedded to the extent that: (i) the agent is a proper part of the world it acts on and models; (ii) the agent is smaller than that world, rendering perfect self-knowledge and unlimited reasoning unavailable; (iii) the agent can act on its own hardware or software; and (iv) the agent must sometimes reason about what its own reasoning implies, or about other agents' models of it.
  2.  **Mismatch of Standard Formalisms:** Standard dualistic frameworks (e.g., classical AIXI, idealised Bayesian agents) assume a separation between the agent and the environment that is violated by condition (i) of the definition above. Consequently, these frameworks do not natively represent the agent's own physical or computational substrate as part of the state space.
  3.  **Logical Constraints on Self-Reference:** Conditions (iii) and (iv) introduce logical constraints (e.g., fixed-point requirements, consistency constraints) that do not arise in standard control theory where the controller is assumed external to the plant. Both parties agree that ignoring these constraints can lead to instability or incoherence in self-modifying systems.
  4.  **Resource Bounds are Structural:** Condition (ii) implies that resource bounds are not merely practical limitations to be overcome by faster hardware, but structural features that determine the agent's epistemic relationship to the world. Both parties agree that a theory of embedded agency must treat logical uncertainty and computational cost as first-class objects, not merely as noise.
  5.  **Pragmatic Necessity:** Regardless of theoretical resolution, agents deployed in the real world are embedded by definition. Both parties agree that improving the formal treatment of embeddedness is necessary for predicting the behaviour of advanced autonomous systems, particularly regarding self-preservation, goal stability, and interaction with other modelling agents.

  ### 2. Residual Disagreements

  The following table summarises the substantive divergences remaining after one year of collaboration.

  | Topic | Neutral Formulation | CBC Position (Critics) | DSM Position (Deflationists) |
  | :--- | :--- | :--- | :--- |
  | **Severity of Mismatch** | Does the mismatch between standard formalisms and embedded reality constitute a foundational error or an engineering approximation? | It is a foundational error. The dualistic assumption invalidates the probability calculus and utility maximisation principles when applied to self-referential systems. | It is an engineering approximation. The dualistic assumption is a modelling choice that remains valid so long as the error terms are bounded and managed. |
  | **Path to Resolution** | Is the solution to embedded agency a new decision theory or an extension of existing situated formalisms? | A new decision theory is required. Existing frameworks cannot be patched to handle logical correlation and self-modification without changing their axioms. | An extension of existing formalisms (e.g., POMDPs, game theory, bounded rationality) is sufficient. The phenomena are already captured under different names. |
  | **Nature of Failure** | When standard agents fail in embedded contexts, is the failure qualitative or quantitative? | The failure is qualitative. Agents may select strictly dominated strategies due to an inability to reason about logical counterfactuals. | The failure is quantitative. Agents may suffer performance degradation, but this is consistent with known limits of bounded optimisation. |

  ### 3. Cruxes and Concrete Cases

  The parties identify the following sub-questions as cruxes. Settling these empirically or formally would significantly shift the credences of at least one party.

  #### Crux 1: The "Provably Wrong" Test
  **Question:** Can we exhibit a crisp embedded decision problem where the received framework (e.g., Causal Decision Theory or standard RL) yields a *provably suboptimal* action, rather than merely failing to compute an answer?

  *   **Concrete Case:** A "Newcomb-like" setup where an agent's source code is simulated by an environment predictor. The agent can choose to modify its own source code before the prediction is made.
  *   **CBC Prediction:** Standard Causal Decision Theory will recommend a policy that results in lower utility than a reflectively consistent alternative (e.g., one-boxing), demonstrating a qualitative flaw in the reasoning architecture.
  *   **DSM Prediction:** Standard RL, given sufficient training on the distribution of such problems, will learn the high-utility policy as a behavioural heuristic, rendering the underlying decision-theoretic "error" irrelevant to actual performance.

  #### Crux 2: The "Cartesian Regression" Test
  **Question:** Can a proposed replacement theory for embedded agency be stated without reintroducing a Cartesian boundary at a higher level of abstraction (e.g., requiring an external designer to specify the agent's boundaries)?

  *   **Concrete Case:** A formal proposal for "Embedded World-Models" that allows an agent to update its own ontology.
  *   **CBC Prediction:** Any such formalism will implicitly rely on an external meta-reasoner to define the mapping between ontologies, thereby pushing the Cartesian boundary out rather than eliminating it.
  *   **DSM Prediction:** The meta-reasoner is simply the system designer or the training process. This is not a flaw but a recognition that all models require a modeller; embeddedness does not require the absence of an external perspective, only that the agent *itself* lacks it.

  #### Crux 3: The Scalability of Self-Modelling
  **Question:** Does the requirement for an agent to model itself (condition iv) lead to an infinite regress that prevents convergence, or does it terminate via approximation?

  *   **Concrete Case:** A recursive modelling task where Agent A must predict Agent B, who is predicting Agent A, with limited memory.
  *   **CBC Prediction:** Without a specialised theory of logical uncertainty, the recursion will not truncate cleanly, leading to oscillating beliefs or inconsistent probability assignments.
  *   **DSM Prediction:** The recursion will truncate naturally due to computational cost (condition ii), resulting in a fixed-depth model that behaves as a standard Partially Observable Markov Decision Process with bounded history.

  ### 4. Note on Verbal vs. Genuine Disagreements

  The parties distinguish the following disagreements as likely verbal, stemming from divergent terminology rather than conflicting models of reality:

  *   **The Meaning of "Model":** CBC tends to use "model" to refer to the agent's *internal* representation of the world. DSM tends to use "model" to refer to the *external researcher's* mathematical description of the agent. Disagreements regarding whether an agent "has a model" often dissolve when this distinction is enforced.
  *   **The Meaning of "Solution":** CBC defines a "solution" as a reflectively consistent policy that the agent would endorse even after self-modification. DSM defines a "solution" as a policy that maximises expected reward within the training distribution. A policy can be a DSM-solution without being a CBC-solution.
  *   **The Meaning of "Error":** CBC classifies systematic deviation from reflectively consistent reasoning as a theoretical "error." DSM classifies deviation from optimal utility as "error," regardless of the reasoning path.

  Genuine disagreements remain regarding whether the systematic deviations identified by CBC are inevitable consequences of embeddedness (CBC view) or artefacts of specific, suboptimal algorithm implementations (DSM view).

  ***

  ### Drafter's Note

  **(a) Least Confident Agreed Claim:** I am least confident in **Claim 4** ("Resource Bounds are Structural"). While both sides agree bounds matter, the DSM camp may view this wording as conceding too much to the CBC's philosophical stance. DSM might prefer to say bounds are "practical constraints that induce structural effects," whereas the current wording implies the structure exists *because* of the bounds. I have phrased it to emphasise the epistemic relationship, which is the safest common ground, but DSM sign-off is the most fragile here.

  **(b) Most Likely Verbal Disagreement:** I suspect the disagreement over **"Foundational Error" vs. "Engineering Approximation" (Disagreement 1)** contains a significant verbal component. If "foundational error" is defined as "violates axioms of the specific formalism," CBC is right. If it is defined as "fails to achieve goals in the real world," DSM is often right. The substantive core is whether the axiom violation *necessarily* leads to goal failure in the limit.

  **(c) Mind-Changing Evidence:** The single consideration that would most change my mind about how to draw this statement is a **formal impossibility proof**. If it were proven that no computable agent can maintain a consistent self-model within its own state space (supporting CBC), the "Deflationary" position would become untenable. Conversely, if a **general-purpose RL agent** were demonstrated to robustly self-modify without goal drift across a wide distribution of Newcomb-like problems (supporting DSM), the claim that "new decision theory is required" would lose its urgency. Currently, the lack of such a proof or demonstration keeps the cruxes open.
