prompt: |-
  I work as a software engineer at a company where we run a lot of A/B tests, and our standard reporting is built on p-values and confidence intervals. Recently a colleague proposed we move to Bayesian methods with explicit priors, and the ensuing argument made me realise that the two of us were not disagreeing about arithmetic but about what a probability even is. From my own reading I gather that there are roughly three live interpretations: probability as the long-run frequency of an outcome in repeated trials of the same kind, probability as a rational degree of belief that need only satisfy coherence constraints (the thought being that anything incoherent exposes you to a guaranteed loss, as in the Dutch-book argument), and probability as a propensity or disposition built into the experimental setup itself, which some people offer as a way to make sense of single cases. I also gather that the pressure point is the single-case problem: a frequency is a property of a sequence, so it seems to say nothing directly about this Friday's deployment, and the reference-class problem lurks nearby, since any event belongs to indefinitely many classes with different frequencies.

  What I would like is a reusable decision procedure I can run, in perhaps fifteen minutes, whenever a probability question comes up at work, that tells me which interpretation I am implicitly relying on, whether that interpretation can actually bear the weight I am putting on it, and which statistical machinery it licenses. The procedure should force me to classify the question first (repeatable event with a stable reference class; one-off event; a model's output score that claims to be a probability), then ask where the numbers come from in each branch, and it should be explicit about the points where no procedure can substitute for judgement rather than pretending the philosophy has been automated away. I would like it applied to three worked cases: our weekly button-colour A/B test, the question of whether a one-off migration to a new database engine will fail next month, and a fraud model that outputs 0.87 for a single transaction. Include at least one application where the procedure returns an answer I will find uncomfortable — I suspect, for instance, that my habit of asking for "the probability that the migration fails" may turn out to be a request for someone's personal credence dressed up as a fact about the system, and I would rather have that said plainly.

  Finally, I would like the procedure to distinguish cases where the choice of interpretation genuinely changes the answer from cases where the disagreement is merely bookkeeping — my suspicion is that once priors are pinned to actual observed base rates the two camps often compute the same thing, and I would like to know whether that suspicion survives scrutiny. Please also say, honestly, whether the propensity interpretation earns a distinct step in the procedure or whether it collapses into one of the other two for practical purposes. I have no formal philosophy background, so define any technical terms you need rather than gesturing at the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Software engineer working with A/B tests, p-values, confidence intervals.
      *   **Context:** Debate with a colleague about Frequentist vs. Bayesian methods. Realization that the core disagreement is about the *interpretation of probability*.
      *   **Knowledge Level:** Aware of three main interpretations (Frequency, Belief/Credence, Propensity). Understands the "single-case problem" and "reference-class problem." No formal philosophy background.
      *   **Goal:** A reusable 15-minute decision procedure to identify which probability interpretation is being used, check its validity, and select the right statistical machinery.
      *   **Requirements:**
          1.  Classify the question type (repeatable, one-off, model score).
          2.  Trace the source of numbers.
          3.  Explicitly flag where judgment replaces procedure.
          4.  Apply to three cases: Button-color A/B test, Database migration (one-off), Fraud model score (0.87).
          5.  Include at least one "uncomfortable" answer (e.g., exposing subjective credence as fact).
          6.  Distinguish when interpretation changes the answer vs. mere bookkeeping.
          7.  Evaluate the "Propensity" interpretation (does it earn a distinct step?).
          8.  Define technical terms.

  2.  **Drafting the Decision Procedure (The "15-Minute Protocol"):**

      *   *Structure:* Needs to be step-by-step, actionable, and time-boxed.
      *   *Step 1: Classification.* Is it repeatable? Is it a physical property? Is it a degree of belief?
      *   *Step 2: Source of Numbers.* Data? Priors? Physical theory?
      *   *Step 3: Validity Check.* Can I actually run this experiment 1000 times? Is the prior defensible?
      *   *Step 4: Machinery Selection.* Frequentist (NHST, CI) vs. Bayesian (Posterior, HDI) vs. Calibration.
      *   *Step 5: The "Judgment Flag".* Where am I guessing?
      *   *Propensity Check:* Does this need a separate branch? Usually, in engineering, propensity collapses into frequency (long run of *this* setup) or belief (confidence in the setup). I need to be honest here.

  3.  **Addressing the "Propensity" Question:**

      *   *Philosophy:* Propensity (Popper, etc.) suggests probability is a physical disposition (like a biased coin).
      *   *Engineering Reality:* We rarely measure "dispositions" directly. We infer them from frequencies or encode them as beliefs.
      *   *Verdict:* For a software engineer, propensity usually collapses into Frequency (if we can simulate the setup) or Belief (if we can't). I should advise treating it as a "Frequency of the Setup" but warn about the single-case trap.

  4.  **Developing the Three Worked Cases:**

      *   *Case 1: Button-Color A/B Test.*
          *   Type: Repeatable.
          *   Interpretation: Frequentist (standard) or Bayesian (with flat priors).
          *   Outcome: Bookkeeping. Both converge with enough data.
          *   Machinery: T-test/Z-test or Bayesian A/B test.
      *   *Case 2: Database Migration.*
          *   Type: One-off.
          *   Interpretation: Cannot be Frequentist (no reference class of *this* migration). Must be Belief (Credence).
          *   Outcome: Uncomfortable. The "probability" is a subjective estimate, not a system fact.
          *   Machinery: Elicitation, Risk Matrix, Bayesian updating with expert opinion.
      *   *Case 3: Fraud Model Score (0.87).*
          *   Type: Model Output.
          *   Interpretation: Calibration check. Is 0.87 actually 87% frequentist probability? Or just a ranking score?
          *   Outcome: Technical validation.
          *   Machinery: Calibration plots, Brier score.

  5.  **Addressing the "Bookkeeping vs. Real Difference" Question:**

      *   *Hypothesis:* With flat priors and large N, Frequentist and Bayesian converge.
      *   *Nuance:* They converge on the *number*, but not the *meaning*. The decision procedure needs to highlight that the *interpretation* dictates how you act on the number (e.g., stopping rules, peeking).
      *   *Verdict:* The suspicion is mostly right for estimation in large samples, but wrong for decision theory (stopping rules, sequential testing) and small samples/strong priors.

  6.  **Refining the Tone:**

      *   Professional, direct, slightly philosophical but grounded in engineering.
