      *   *Mavrodes' Solution:* George Mavrodes argued the task is logically impossible *for an omnipotent being*. But critics say this defines omnipotence *around* the paradox rather than solving it.
      *   *Second-Order Capacities:* Can God limit his own power? If yes, he can make the stone but then isn't omnipotent. If no, he isn't omnipotent.
      *   *Time/Indexicality:* The paradox often ignores time. Can he create it *now* and lift it *later*?

  7.  **Synthesize the "Accuracy Audit":**
