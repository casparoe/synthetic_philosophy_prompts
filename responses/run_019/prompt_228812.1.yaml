answer: |-
  **MEMORANDUM**

  **TO:** Communications Review Team
  **FROM:** Head of Communications, National Electoral Commission (NEC)
  **SUBJECT:** Protocol for Assessing "Will of the People" Claims (The Legitimacy Audit)
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope

  This protocol is mandatory for all reviewers assessing draft texts (press releases, speeches, official statements) originating from the NEC or submitted for advisory review by Ministerial offices. Its purpose is not to censor political opinion, but to prevent **Democratic Overclaim**: assertions that attribute a level of consensus, permanence, or moral unity to electoral outcomes that the data and democratic theory cannot support.

  Overclaims erode trust. When a narrow victory is framed as a monolithic mandate, the 49% are alienated. When a plurality is framed as a majority, legitimacy is inflated. This procedure ensures our language remains precise, defensible, and consistent with democratic best practices.

  ### 2. The Decision Procedure (The Legitimacy Audit)

  Reviewers must apply the following five steps in order. If a draft fails any step, it must be edited or flagged.

  **Step 1: Source Verification**
  *   **Question:** What empirical event is being cited as the source of "the people's will"?
  *   **Criteria:**
      *   *Pass:* A certified election or referendum result.
      *   *Fail:* Opinion polls, focus groups, social media sentiment, or rhetorical assertion without data.
  *   **Action:** If **Fail**, the text must be revised to remove references to "the will of the people." Polls measure *sentiment*, not *will*.
  *   **Stop Point:** If the claim rests *solely* on polls, FLAG for Senior Review (Red). Do not clear.

  **Step 2: Numerical Threshold**
  *   **Question:** What proportion of the democratic body supports the claim?
  *   **Criteria:**
      *   *Pass:* >50% of *registered electorate* OR >50% of *valid votes cast* (with turnout >60%).
      *   *Caution:* >50% of votes cast (with turnout <60%).
      *   *Fail:* A plurality (less than 50% of votes) or a narrow majority (<55%) presented as a "landslide" or "overwhelming."
  *   **Action:** If **Fail**, language must be downgraded from "The People have spoken" to "A majority of *voters* decided."
  *   **Stop Point:** If a plurality is claimed as a "majority mandate," FLAG (Amber).

  **Step 3: Scope of Authorization**
  *   **Question:** Does the claim generalize the result beyond the ballot question?
  *   **Criteria:**
      *   *Pass:* Claiming authority to govern (general mandate) OR claiming authority for the specific measure voted on.
      *   *Fail:* Claiming a vote for a *party* authorizes a specific *policy* not explicitly detailed or agreed upon in coalition; OR claiming a referendum on *Procedure* authorizes a specific *Outcome*.
  *   **Action:** If **Fail**, remove specific policy claims. A vote for a party is a mandate to govern, not a contract for specific legislation.
  *   **Stop Point:** If a specific policy is claimed as "directly authorized" by a general election, FLAG (Amber).

  **Step 4: Temporal Claim**
  *   **Question:** Is the decision presented as reversible or permanent?
  *   **Criteria:**
      *   *Pass:* Language implying the decision stands until the next electoral cycle or review mechanism.
      *   *Fail:* Language implying the issue is "settled forever," "irreversible," or "closed for a generation."
  *   **Action:** If **Fail**, revise to acknowledge democratic revisability.
  *   **Stop Point:** If "Permanent Settlement" is claimed, FLAG (Red). Democracy is inherently provisional.

  **Step 5: The Construct of "The People"**
  *   **Question:** Is "the people" described as an empirical aggregate or a moral entity?
  *   **Criteria:**
      *   *Pass:* "Voters," "The Electorate," "Citizens who participated."
      *   *Fail:* "The Real People," "The Silent Majority," "The Elite vs. The People," or language implying opponents are "enemies of the people."
  *   **Action:** If **Fail**, strip moralizing language.
  *   **Stop Point:** If exclusionary/populist rhetoric is used, FLAG (Red).

  ---

  ### 3. Methodological Notes: Simplifications and Judgment

  To ensure this audit is runnable within 60 minutes per document, the following theoretical distinctions from political science literature have been simplified or dropped:

  1.  **Electorate vs. Voters:** Ideally, legitimacy derives from the majority of the *eligible electorate*. However, calculating this in real-time during a crisis is difficult. We use *votes cast* as the proxy, with a turnout caveat in Step 2. **Simplification:** We treat a 51% vote share with 40% turnout as numerically "Passing" Step 2, though theoretically weak.
  2.  **Coalition Dynamics:** We do not audit coalition agreements. If Party A (30%) and Party B (10%) form a government, we treat their joint manifesto as the "general mandate." We do not arbitrate internal coalition legitimacy.
  3.  **Constitutional vs. Democratic Legitimacy:** This procedure assesses *democratic* claims (will of the people), not *legal* claims (binding statutes). A result may be legally binding but democratically overclaimed. **Judgment Required:** Reviewers must navigate the tension where the law requires us to call a result "final" while this protocol warns against calling it "permanent."

  **Where Judgment Cannot Be Eliminated:**
  Step 5 (The Construct) requires interpretive judgment. Distinguishing between patriotic rhetoric and populist moralization is subjective. Reviewers must ask: *Does this language imply that the opposition is illegitimate?* If yes, it fails.

  ---

  ### 4. Application to Current Drafts

  Below is the audit applied to the three high-priority drafts currently in queue.

  #### Case 1: NEC Official Statement on Referendum Certification
  **Draft Text:** *"The Electoral Commission certifies that the referendum result reflects the will of the people. With 52% voting Yes, the issue is now permanently settled, and the nation must move forward as one."*

  *   **Step 1 (Source):** Pass (Certified Referendum).
  *   **Step 2 (Numbers):** Caution (52% is a narrow majority, but >50%). *Proceed.*
  *   **Step 3 (Scope):** Pass (Refers to the referendum issue itself).
  *   **Step 4 (Temporal):** **FAIL.** The phrase "permanently settled" violates the principle of democratic revisability.
  *   **Step 5 (Construct):** **FAIL.** "Move forward as one" implies a moral unity that does not exist in a 52-48 split.

  **Verdict:** **FLAG (RED).**
  **Required Edit:** Remove "permanently settled." Replace with "The result is binding under current statute." Remove "as one."
  **Office Impact (Uncomfortable):** This draft is *our own* standard certification language. Applying this protocol strictly admits that the NEC's own boilerplate contributes to democratic distortion. By flagging this, we acknowledge that our legal duty to certify a "binding" result is often publicly misinterpreted as a "permanent" moral mandate. We must revise our own public guidance to clarify that *legal finality* is not *democratic permanence*.

  #### Case 2: Governing Party Press Release
  **Draft Text:** *"After winning 37% of the vote, the Government has a clear mandate to implement the 'Green Tax' pledge found on page 40 of the manifesto. The people have authorized this specific reform."*

  *   **Step 1 (Source):** Pass (General Election).
  *   **Step 2 (Numbers):** **FAIL.** 37% is a plurality, not a majority. Claiming a "clear mandate" misrepresents the numerical support.
  *   **Step 3 (Scope):** **FAIL.** General elections authorize governance, not specific line-item policies, especially with a minority vote share.
  *   **Step 4 (Temporal):** Pass (No claim of permanence).
  *   **Step 5 (Construct):** Pass (Uses "The people" empirically, albeit loosely).

  **Verdict:** **FLAG (AMBER).**
  **Required Edit:** Change "clear mandate" to "priority." Change "people have authorized" to "Government intends to pursue."
  **Note:** This will cause friction with the Minister's office, but it is factually defensible.

  #### Case 3: Prime Minister's Speech (Advisory Review)
  **Draft Text:** *"Recent polling shows 60% support for my approach. This proves what the people want, and I will act on this will immediately, regardless of parliamentary procedure."*

  *   **Step 1 (Source):** **FAIL.** Cites "Recent polling" as the source of "will."
  *   **Step 2 (Numbers):** N/A (Source failed).
  *   **Step 3 (Scope):** **FAIL.** "Regardless of parliamentary procedure" claims extra-constitutional authority.
  *   **Step 4 (Temporal):** Pass.
  *   **Step 5 (Construct):** **FAIL.** "What the people want" implies a monolithic will derived from a sample.

  **Verdict:** **FLAG (RED).**
  **Required Edit:** Remove reference to polls as proof of "will." Remove "regardless of parliamentary procedure."
  **Note:** This is a standard political overreach. The NEC must advise that polls do not constitute democratic authorization.

  ---

  ### 5. Implementation Instruction

  Effective immediately, no document invoking "the will of the people," "mandate," or "the people's decision" may be released without this audit log attached.

  For **Case 1**, I will personally handle the revision. We cannot instruct the government on democratic theory while our own certification language violates it. We will issue a corrigendum on our website clarifying the distinction between *statutory finality* and *democratic permanence* before the next referendum cycle.

  **Signed,**
  Head of Communications
