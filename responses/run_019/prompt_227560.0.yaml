  5.  **Drafting the Content (Iterative refinement):**

      *   *Question:* "Does the normative authority of a Pareto improvement depend on the moral legitimacy of the baseline against which welfare changes are measured?"
      *   *Objection 1 (Smuggling):* I need to emphasize that Pareto proponents claim *neutrality*. If I show they can't have neutrality, I haven't smuggled justice; I've exposed a hidden premise.
      *   *Objection 2 (Bargaining):* Distinguish positive (what happens) from normative (what should be endorsed).
      *   *Structure:* Keep it to 4-5 clear sections.
      *   *Failure:* If the "reasonable demand" metric is indistinguishable from subjective preference.

  6.  **Final Review against Constraints:**
      *   One sentence question? Yes.
      *   Two objections addressed? Yes.
      *   Structure sketch? Yes.
      *   Failure conditions? Yes.
      *   Fairness constraint caveat? Yes.
      *   Non-specialist friendly? Yes (avoiding formulas, explaining terms).
      *   No citations? Yes.

  7.  **Final Polish:** Check flow and ensure the "Safe Pareto" terminology is introduced clearly. (Self-Correction: Make sure the distinction between "worse off relative to now" and "worse off relative to entitlements" is crystal clear, as that's the core insight).

