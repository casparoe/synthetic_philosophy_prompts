answer: |-
  **Term Paper Proposal: The Baseline Dependence of Pareto Improvements**

  **Research Question**
  Does the normative authority of a Pareto improvement depend on the moral legitimacy of the baseline against which welfare changes are measured?

  **Project Overview**
  The Pareto Principle states that a change is an improvement if it makes at least one person better off without making anyone worse off. It is often defended in welfare economics and policy as uniquely uncontroversial because it purportedly requires no interpersonal comparisons of utility or substantive theory of justice. However, this defense relies on measuring "worse off" relative to the *status quo*. My paper argues that when the *status quo* is itself exploitative—for example, a labor market where workers accept dangerous conditions due to a lack of alternatives—a move can satisfy the Pareto criterion while reinforcing injustice. In such cases, consent is obtained not because the deal is fair, but because the baseline is coercive.

  I propose distinguishing between *Standard Pareto Improvements* (better than the current facts) and *Safe Pareto Improvements* (better than what agents could reasonably demand as a right). I will argue that only the latter carries the normative weight proponents claim, and that most policy appeals to Pareto efficiency deliver only the former.

  **Anticipated Objections**
  I anticipate two main challenges. First, critics may argue I am smuggling a full theory of justice into a welfare criterion, thereby conceding that Pareto is not neutral. I will reply that my target is the *claim* of neutrality itself; I aim to show that Pareto cannot function as a freestanding normative guide without hidden premises about baseline legitimacy. Second, economists might object that bargaining theory already accounts for this via the "disagreement point." I will respond that bargaining theory describes *predictable outcomes*, not *moral permissibility*. That an exploitative deal is a stable equilibrium does not make it a normative improvement.

  **Paper Structure**
  1.  **Introduction:** Define the Pareto Principle for a non-specialist audience and outline the tension between its claim to neutrality and its reliance on the status quo.
  2.  **The Exploitative Baseline:** Present cases (e.g., wage hikes in sweatshops) where Pareto improvements occur against unjust baselines, arguing these feel normatively distinct from improvements against just baselines.
  3.  **Defining "Safe" Improvements:** Formalize the distinction between status-quo-relative welfare and entitlement-relative welfare.
  4.  **Addressing Objections:** Engage with the "smuggling justice" and "bargaining theory" counterarguments.
  5.  **Implications:** Argue that recognizing this distinction necessitates an independent fairness constraint on policy. I will not advocate for a specific theory of justice (e.g., Rawlsian or Libertarian), but argue that *some* prior constraint is required to validate the baseline. This is a feature, not a bug: it clarifies that Pareto is a secondary criterion that operates only after minimum justice is secured.
  6.  **Conclusion:** Summarize why the Pareto Principle's reputation as the "uncontroversial" core of welfare economics is undeserved.

  **Conditions for Failure**
  This project would fail if it turns out the two notions of "worse off" collapse into each other upon precision. If "what an agent could reasonably demand" cannot be distinguished from "what an agent actually accepts" without simply stipulating a specific political theory, the distinction may be too vague to sustain the argument. Additionally, if I cannot demonstrate that policy-makers actually rely on the supposed neutrality of Pareto (rather than treating it as one value among many), the critique may lack practical traction.
