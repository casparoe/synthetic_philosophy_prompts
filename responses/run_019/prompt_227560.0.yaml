  2.  **Deconstruct the Core Idea:**
      *   *Standard Pareto:* $A \succ_{P} B$ if at least one person is better off in $A$ and no one is worse off in $A$ (compared to $B$).
      *   *Student's Insight:* If the baseline $B$ is exploitative (coercive/unjust), a move to $A$ might satisfy Pareto but still be morally suspect because the "no one is worse off" condition relies on a threatened or unjust baseline.
      *   *Proposal:* Distinguish between *Baseline-Relative Pareto* (standard) and *Rights-Constrained/Safe Pareto* (where the baseline itself must meet a minimum threshold of legitimacy).
      *   *Goal:* Show that Pareto isn't "normatively neutral" as often claimed.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. "Safe Pareto Improvements" is a good hook.
      *   **Research Question:** Needs to be precise. Not "Is Pareto good?" but something about the conditions of its application.
          *   *Draft 1:* Does the Pareto principle require a just baseline? (Too vague)
          *   *Draft 2:* Can a Pareto improvement be normatively significant if the status quo is exploitative? (Better)
          *   *Draft 3 (Final):* Does the normative force of a Pareto improvement depend on the moral legitimacy of the status quo baseline against which welfare changes are measured?

      *   **Motivation/Context:** Briefly explain Pareto for the non-economist. Explain the "toothless vs. status quo bias" tension mentioned in the prompt. Introduce the "exploitative baseline" problem (the wage example).

      *   **Anticipated Objections:**
          *   *(a) Smuggling Justice:* Critic will say "You're just adding a justice constraint, that's not an internal critique."
              *   *Rebuttal:* I'm not proposing a specific theory of justice, but showing that Pareto *implicitly* relies on one to have the normative weight proponents claim. It's about the *claim* of neutrality.
          *   *(b) Bargaining Theory:* Critic will say "Game theory handles this with disagreement points."
              *   *Rebuttal:* Bargaining theory describes *outcomes*, not *normative validity*. A Nash bargaining solution can still be exploitative if the threat point is coercive. Economics describes; philosophy evaluates.

      *   **Argument Structure:**
          1.  Intro: Define Pareto simply. State the thesis.
          2.  The Baseline Problem: Show how exploitative baselines generate "hollow" improvements.
          3.  Defining "Safe" Pareto: Distinguish status-quo-relative vs. entitlement-relative.
          4.  Objections: Address the two specific ones above.
          5.  Implications: Why this matters for policy (need for independent fairness constraint).
          6.  Conclusion.

      *   **Failure Conditions:** What kills the argument?
          *   If "reasonable demand" collapses into "what people actually accept" (preference satisfaction).
          *   If the distinction is just semantic.

      *   **The "Fairness Constraint" Clause:** Explicitly state that the paper argues *that* a constraint is needed, not *which* one (Rawls, Locke, etc.). This keeps the scope manageable for 5000 words.

  4.  **Refining Tone and Length:**
