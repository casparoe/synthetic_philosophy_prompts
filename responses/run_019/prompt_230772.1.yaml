  **Workshop Q&A Prep: Non-Propositional Hinges**

  **1. The Wittgenstein Scholar (Methodological)**
  **Q:** "You are presenting a systematic reading of hinges. But *On Certainty* is therapy, not theory. Aren't you doing exactly what Wittgenstein warns against by constructing a 'non-propositionalist' account?"
  **Reply:** I am not offering an explanatory hypothesis about mental states, but a grammatical description of how 'certainty' functions. Wittgenstein opposes theories that explain *why* we know; he allows descriptions of *how* we use words. My claim is that 'hinge' marks a logical boundary, not a psychological state. By calling it competence, I am describing the role these certainties play in our language games, not positing a hidden mechanism. This respects the therapeutic aim by dissolving the urge to justify the unjustifiable, rather than satisfying it with a new dogma. I am mapping the riverbed, not claiming to be the water.
  **Weakness:** The line between 'description' and 'theory' is notoriously thin in practice.
  **Strategy:** **Hold.** This is your methodological shield. If you concede this, the talk collapses.

  **2. The Decision Theorist (Formal)**
  **Q:** "Even if it's competence, doesn't your action imply a subjective probability of 1? Why not just model this as credence 1 in a low-level proposition?"
  **Reply:** Credence 1 implies a position within a probability space where updating is possible upon evidence. Hinges are the framework *within which* evidence operates; they are not updated by evidence. To assign credence is to treat the hinge as a move in the game, rather than the board itself. If you model it as high credence, you retain the possibility of doubt, which destroys the hinge's function. Competence is not a degree of belief; it is the condition for having beliefs at all. You cannot bet on the rules of betting.
  **Weakness:** Bayesian frameworks are flexible enough to absorb 'framework' assumptions as fixed priors.
  **Strategy:** **Hold.** Do not let them formalize the pre-condition.

  **3. The Senior Epistemologist (Wright-style)**
  **Q:** "If hinges aren't beliefs, what warrants our entitlement to trust them? Without warrant, isn't this just blind dogmatism?"
  **Reply:** 'Entitlement' suggests a norm applied to a subject. I argue hinges are pre-normative practical competencies. We don't need a warrant to walk; we need legs. Asking for a warrant for hinges mistakes their category, like asking for the color of a number. The 'right' to trust comes from the necessity of acting, not from epistemic justification. It is not dogmatism because dogmatism implies a refusal of evidence; hinges are where evidence begins. However, I concede they function *as if* they were entitlements within the game.
  **Weakness:** Leaves the normativity of knowledge unexplained. Risks sounding like crude naturalism.
  **Strategy:** **Concede partially.** Admit they function *like* warrants but insist they aren't *justified* warrants.

  **4. The Graduate Students (Skepticism)**
  **Q:** "Doesn't this just change the subject? The skeptic asks if we know the world exists; you say we just act. That doesn't refute skepticism."
  **Reply:** It refutes the coherence of the skeptical question. Skepticism demands justification where none can exist. By showing hinges are competencies, I show the demand itself is nonsense. We don't refute the skeptic by proving them wrong; we show their game cannot be played. This isn't changing the subject; it's showing the subject was ill-formed. The riverbed doesn't argue with the water; it channels it. If you demand a proof for the riverbed, you have no water left to swim in.
  **Weakness:** Can feel like evasion to those wanting a direct proof of the external world.
  **Strategy:** **Hold.** This is the core payoff.

  **Hope Nobody Asks:** "If hinges are contingent competencies, what happens when two language games with conflicting hinges interact? Is there no rational adjudication?" (This forces you to admit hinges can be wrong or political, undermining their certainty.)

  **Concession Strategy:** Concede to the Senior Epistemologist that hinges play a *functional* role similar to entitlements, but hold firm on the ontological claim that they are not beliefs. Do not concede to the Decision Theorist; formalization kills the view. Do not concede to the Scholar; method is key. Do not concede to Students; dissolution is the goal.
