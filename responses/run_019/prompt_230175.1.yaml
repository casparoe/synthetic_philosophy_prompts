      *   *Final Judgment:* Who is *more* right? In contemporary philosophy of biology, Jess's caution is often preferred regarding *ontology*, but Sam's view is standard practice in *explanation*. I should lean towards Jess on the strict metaphysical question (do reasons exist mind-independently?) but acknowledge Sam's pragmatic victory. Actually, the prompt asks "who is more right overall." I should probably declare a draw or a "Jess on ontology, Sam on heuristic" split. Let's go with Jess being technically more precise on ontology, but Sam capturing the scientific practice better. Wait, Sam's thermostat argument is a logical error. That counts against him. Jess's distinction in Move 6 is very sharp. I'll give the edge to Jess on logical consistency, but note Sam captures the *spirit* of the Darwin/Turing point better.
