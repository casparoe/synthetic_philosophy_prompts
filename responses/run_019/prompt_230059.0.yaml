answer: |-
  **Project Title:** Beyond Determinism and Metaphor: Reconstructing Non-Human Agency in Historical Explanation

  **Research Question**
  When contemporary historians attribute explanatory weight to non-human forces (e.g., pathogens, climate systems, geological events), what conception of *causal agency* is being invoked? This project asks: Is there a coherent philosophical model that allows non-human processes to function as active participants in historical explanation without collapsing into environmental determinism or retreating into the claim that such language is merely metaphorical?

  **Problem Statement and Intervention**
  Current scholarship regarding the "material turn" in history typically oscillates between two poles. The first treats non-human actors as a harmless heuristic device (metaphor), preserving human exceptionalism but ignoring the causal reality of environmental forces. The second warns that granting agency to non-humans inevitably leads to environmental determinism, erasing human responsibility and decision-making. This proposal argues that this binary is a category error. It conflates *intentional agency* (the capacity to act for reasons) with *causal efficacy* (the capacity to make a difference in an outcome). The existing debate fails because it assumes that to be an "actor" in history is to be a "human agent." By failing to distinguish between different types of causal contribution, current discussions cannot account for how a volcanic eruption can be a historical "event" without being a "decision-maker."

  **Methodology**
  This project will employ **conceptual analysis and explanatory reconstruction** rather than an archival or historiographical approach. While a historiographical method would document *that* historians are using this language, it cannot adjudicate *whether* the usage is philosophically coherent. Archival work describes practice; philosophy evaluates validity. I will analyze the logical structure of historical explanation to distinguish between *conditions*, *causes*, and *agents*. The goal is to construct a taxonomy of explanatory roles that accommodates non-human forces as *causal participants* rather than *intentional agents*. This method is preferable because the core problem is not empirical (how much climate affects history) but conceptual (what it means to "affect" history).

  **Criteria for Success and Failure**
  A successful outcome will be a positive account of "non-human historical participation." This model must demonstrate how a narrative can attribute causal power to a germ or glacier without implying the germ has intentions or the glacier determines the outcome. Success looks like a refined definition of "historical actor" that is pluralistic rather than binary.
  Failure would take two forms: (1) proving that any attribution of agency to non-humans logically necessitates determinism (validating the skeptics), or (2) producing a definition so vague that it offers no guidance for distinguishing significant causal forces from background noise.

  **Scope and Feasibility**
  For a 6,000-word paper, the scope must be narrowly focused. I will not attempt to solve the general metaphysical problem of causation. Instead, I will focus specifically on the **logic of historical narrative**.
  *   **Introduction (750 words):** The rise of non-human actors and the determinism/metaphor impasse.
  *   **The False Dichotomy (1,500 words):** Analysis of why current critiques of determinism fail to address causal efficacy.
  *   **Reconstructing Agency (2,500 words):** The core philosophical argument distinguishing intentional agency from causal participation in explanatory models.
  *   **Implications for Narrative (1,250 words):** How this reconstruction changes the evaluation of historical explanations (without needing new empirical data).
  *   **Conclusion (750 words):** Summary of the model and limitations.

  This scope is realistic as it limits the inquiry to the *structure of explanation* rather than the *ontology of nature*, allowing for a rigorous argument within the word limit.
