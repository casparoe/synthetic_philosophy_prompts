answer: |-
  It is wonderful to hear from you, and I must say that your retirement suits you. There is something deeply satisfying about the image of you sitting there with your old labmates, swapping stories over beers, only to pivot into a rigorous methodological dissection of mid-century economic theory. Your chemist friend is typical of our breed, is he not? We spend decades building models based on things we know do not exist, frictionless planes and infinite lattices and electrons that do not interact except in the most averaged ways, so when someone suggests that false assumptions are acceptable, we nod instinctively. It feels like home. But your intuition that there is something fishy about applying that same logic to economics, or even to certain corners of physics, is not just a retiree's whim. It is a genuine philosophical tremor that shakes the foundation of instrumentalism, and I think you have put your finger on exactly where the fault line runs with this distinction between idle and load-bearing idealizations.

  Let us start by granting your chemist friend his due, because Friedman's argument is seductive for a reason. In his 1953 essay, Friedman was pushing back against a naive realism that demanded every assumption in a theory be a literal description of reality. He argued that theories are merely languages or filing systems for organizing empirical evidence, and their validity rests solely on the accuracy of their predictions. If a theory predicts the motion of a falling body well by assuming a vacuum, it does not matter that we are actually in air, so long as the air resistance is negligible for the purpose at hand. This is the instrumentalist stance: theories are tools, not maps. If the wrench tightens the bolt, you do not care if the handle is made of wood or plastic, so long as it does not break. For a condensed matter physicist, this resonates because we know that the Drude model of electrical conductivity treats electrons like a classical gas, which is ontologically wrong, yet it predicts conductivity reasonably well in many regimes. We accept the falsehood because the prediction holds. This is the stronghold of the Friedman position, and it is where your friend is standing when he raises his glass.

  However, your distinction between idle and load-bearing idealizations strikes at the weak point of this fortress. An idle idealization is one where the false assumption simplifies the mathematics without fundamentally altering the causal structure of the phenomenon. Neglecting air resistance for a cannonball is idle because gravity is the dominant force; adding air resistance changes the trajectory slightly but does not change the fact that the ball falls. The mechanism remains intact. A load-bearing idealization, by contrast, is one where the phenomenon predicted by the model exists only because of the simplification. If you remove the simplification, the effect vanishes or fundamentally changes character. You mentioned mean-field theory, and that is a perfect example from our own field. Mean-field theory assumes that every particle feels the average field of all others, ignoring local fluctuations. In high dimensions, this works well. But near a critical point, those fluctuations are the entire story. They are what drive the phase transition. If you insist on the mean-field assumption there, you get the wrong critical exponents. The assumption is load-bearing because the specific behavior you are trying to predict relies on the very thing you have assumed away.

  The question you posed is whether this distinction collapses under pressure. Is it really a binary, or is everything just a matter of degree? It is true that in a strict logical sense, all idealizations are false, and one could argue that any assumption becomes load-bearing if you look closely enough at the right precision. However, I do not think the distinction collapses into nothingness. It survives because it maps onto the concept of robustness. An idle idealization is robust; the result survives perturbations of the assumption. A load-bearing idealization is fragile; the result depends sensitively on the assumption remaining false. This is not just a matter of degree in a trivial sense, but a qualitative difference in how the model relates to the world. When an assumption is load-bearing, the model is not approximating reality; it is replacing reality with a different mechanism that happens to yield a similar number. This is where Friedman's defense begins to crumble. He argues that we should not care if the assumptions are descriptive, only if they are fruitful. But if the fruitfulness depends on a load-bearing falsehood, the theory is effectively a black box. It may predict, but it cannot explain.

  This brings us to the heart of the matter, which is the goal of science itself. Friedman was writing as an economist concerned with policy outcomes. For a policy maker, prediction might be enough. If a model predicts inflation will rise when money supply increases, the policy maker might not care why, so long as the lever works. But you and I were physicists. We cared about understanding the mechanism. We wanted to know why the superconductor expelled the magnetic field, not just that it did. If you use a model with load-bearing false assumptions to predict a phenomenon, you have severed the link between the prediction and the underlying reality. You have achieved empirical adequacy at the cost of explanatory power. This is where Nancy Cartwright's work becomes vital to your argument. Cartwright argued that the laws of physics do not describe what happens in reality, but rather describe the capacities of things in specific, controlled arrangements. A law holds ceteris paribus, all other things being equal. But in the real world, other things are never equal. When an assumption is load-bearing, it means the capacity being modeled does not actually exist in the way the theory claims. The model works not because it captures a real capacity, but because the errors cancel out or because the system is constrained in a way that mimics the false assumption.

  If we accept Cartwright's view, then Friedman's claim that the realism of assumptions is irrelevant becomes dangerous. If the assumptions are load-bearingly false, the model is not describing a capacity of the economic agents or the physical particles. It is describing a artifact of the mathematical structure. In economics, consider the assumption of rational expectations. If the market behaves as if agents are rational only because of some arbitrage mechanism that eliminates irrational traders, then the rationality assumption is idle. But if the market behavior relies on the agents actually being rational in a way they are not, and if introducing behavioral biases destroys the equilibrium, then the assumption is load-bearing. If the assumption is load-bearing and false, the model predicts correctly only by accident or within a narrow range where the falsehood does not matter yet. Once the conditions shift, the model will fail catastrophically because the mechanism it relies on is not there. Friedman's methodology offers no warning system for this. It tells you to keep using the tool until it breaks. A realist methodology, which demands we scrutinize whether assumptions are idle or load-bearing, tells us to check the foundation before we build the house.

  So, does predictive success license indifference to false assumptions in the load-bearing case? I believe the verdict must be no. Predictive success licenses indifference to the truth of the assumption only if you are an instrumentalist who cares solely for output. But if you care about science as an endeavor to understand the structure of the world, then predictive success with load-bearing falsehoods is epistemically hollow. It is like guessing the right combination on a lock by shaking it rather than knowing the tumblers. You get in, but you do not know how the lock works. In the idle case, you know how the lock works, you are just ignoring a bit of dust on the key. In the load-bearing case, you are using a skeleton key that damages the lock. This is why your distinction matters. It saves us from conflating engineering with science. Engineering wants the bridge to stand; science wants to know why the steel holds the weight. Friedman's essay is a manifesto for engineering, disguised as a methodology for science.

  Your suspicion that this applies to some of your own field is also well-founded. We often speak of quasiparticles as if they are real entities, and often they are robust enough to be treated as such. But there are times when the quasiparticle picture breaks down, such as in non-Fermi liquids, and clinging to the idealization prevents us from seeing the new physics. The mean-field example you raised is the canonical case where the idealization is load-bearing. The theory predicts a phase transition, but it gets the nature of the transition wrong because the fluctuations it ignores are the very things that determine the critical behavior. If a physicist insisted that mean-field theory was true because it predicted a transition, they would be stuck in the wrong universality class. They would have prediction without understanding. Friedman would say the theory is valid because it predicts a transition. You would say the theory is false because it predicts the wrong kind of transition for the wrong reasons. Who is the better scientist? I think you know the answer.

  Therefore, I do not think your distinction collapses. It holds because it distinguishes between approximations that preserve causal structure and those that replace it. It is not a perfect binary, as there are degrees of robustness, but the difference between a perturbation and a constitutive condition is significant enough to bear the weight of your argument. Friedman's position survives only if we restrict the aim of science to prediction alone. If we include explanation, understanding, and the identification of real capacities, then his defense of unrealistic assumptions fails when those assumptions are load-bearing. The predictive success in such cases is not a sign of truth, but often a sign of a lucky cancellation or a limited domain of validity that hides the structural error. Your chemist friend is right that we use false assumptions, but he is wrong to imply that all false assumptions are methodologically equal. Some are scaffolding that can be removed once the building is up; others are the load-bearing walls without which the building collapses. To treat them as the same is to invite disaster when the wind blows harder than expected.

  So, tell your friend at the next round that he is half-right. We do use spherical cows. But we know they are spherical only to make the integral solvable, not because we believe the cow is round. If the cow's shape were the reason the milk flowed, we would have a problem. Friedman tells us not to worry about the shape of the cow so long as we get the milk. You are arguing that if we want to understand the cow, or if we want to ensure we get milk next year when the pasture changes, we had better know whether the shape matters. I think you have won the argument, or at least you have identified the precise terrain where the victory lies. It is a pleasure to see you tackling these questions with the same rigor you brought to the lab, and I hope you continue to dive down that rabbit hole. It seems you have found a new kind of condensed matter to study, only this time it is made of ideas rather than electrons, and the phase transitions are just as sharp.
