      *   Make sure the impulsive rescue highlights the need for rational deliberation.
      *   Ensure the ending reinforces the impossibility of true certainty (the opacity thesis).

      *Word Count Management:* If it's too short, expand on the bureaucratic reasoning. If too long, trim the intro. Aiming for dense, precise paragraphs.

      *Review against constraints:*
