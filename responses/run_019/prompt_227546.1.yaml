prompt: |-
  Write a parody FAQ published by the Bureau of Moral Worth, an imaginary Kantian licensing agency that audits good deeds to certify whether they were performed from duty and therefore genuinely count. It should present, in numbered entries, the Bureau's replies to at least the following public inquiries: the shopkeeper who deals honestly with customers because honesty is good for business; the cheerful donor who gives because giving makes her happy; the formerly compassionate man whose fellow-feeling has been worn away by his own grief and who helps others anyway; the passerby who dove in to save a drowning child on pure impulse, without a moment's deliberation; and the anxious citizen who worries that the pleasure he took in having done his duty retroactively contaminates the deed. The replies should be technically competent Kantiana — true to the distinction between acting from duty and merely acting in conformity with it, to the claim that moral worth resides in the maxim rather than the outcome, and to Kant's own skepticism about whether anyone can be certain of her deepest motives — delivered with absolute procedural confidence. About 700 words, in a deadpan civil-service voice. The comedy must come from the doctrine being applied correctly and taken completely seriously, not from caricaturing it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Parody FAQ published by the "Bureau of Moral Worth" (an imaginary Kantian licensing agency).
      *   **Purpose:** Audit good deeds to certify if they were performed *from duty* (genuine moral worth) vs. *in conformity with duty* (no moral worth).
      *   **Format:** Numbered entries (FAQ style).
      *   **Content Requirements:** Address specific inquiries:
          1.  Shopkeeper (honesty for business).
          2.  Cheerful donor (giving makes her happy).
          3.  Grief-stricken man (helps despite lost compassion).
          4.  Impulsive rescuer (saved child without deliberation).
          5.  Anxious citizen (pleasure taken *after* duty contaminates deed?).
      *   **Tone:** Deadpan civil-service voice, absolute procedural confidence.
      *   **Philosophical Accuracy:** Technically competent Kantiana (duty vs. inclination, maxim vs. outcome, opacity of motives).
      *   **Comedy Style:** Arising from the serious application of the doctrine, not caricature.
      *   **Length:** About 700 words.

  2.  **Deconstruct the Kantian Principles:**
      *   *Groundwork of the Metaphysics of Morals:* Moral worth comes only from acting from duty, not inclination.
      *   *Shopkeeper:* Honesty for profit = conformity, no moral worth.
      *   *Philanthropist:* Helping because you love helping = inclination, no moral worth. Helping because you *must*, despite hating everyone = moral worth.
      *   *Impulse:* Action without conscious maxim formulation is problematic (needs rational deliberation).
      *   *Opacity Thesis:* We can never be fully certain of our own motives.
      *   *Post-action pleasure:* Feeling good *because* you did duty is okay (respect for the law), but feeling good because of inclination taints it.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. "Bureau of Moral Worth," "Department of Categorical Imperatives," etc.
      *   **Intro:** Brief statement of purpose.
      *   **Entry 1 (Shopkeeper):** Focus on the motive (profit vs. duty). Verdict: Denied.
      *   **Entry 2 (Cheerful Donor):** Focus on inclination (sympathy/joy). Verdict: Denied.
      *   **Entry 3 (Grief-Stricken Man):** This is the classic Kantian example of true moral worth. Verdict: Approved (provisionally).
      *   **Entry 4 (Impulsive Rescuer):** Focus on deliberation/maxim. Instinct isn't reason. Verdict: Pending/Denied.
      *   **Entry 5 (Anxious Citizen):** Focus on retrospective feeling. Respect for the law vs. inclination. Verdict: Clarification.
      *   **Closing:** Reminder of the opacity of the human heart.

  4.  **Drafting - Tone and Voice:**
      *   Bureaucratic, dry, precise, unyielding.
      *   Use terms like "compliance," "audit," "certification," "maxim," "inclination," "categorical."
      *   Avoid jokes *about* Kant; let the strictness be the joke.

  5.  **Drafting - Content & Word Count Check:**
      *   Need to ensure I hit ~700 words.
      *   Make sure the philosophical distinctions are sharp.

      *(Self-Correction during drafting)*: Initially, I might make the impulsive rescuer a clear "no." But Kant is tricky here. If it's pure instinct, it lacks rational will. I should frame it as "insufficient data regarding maxim formulation."
      For the grief-stricken man, Kant explicitly cites this as the only case with true worth. I need to make sure the Bureau recognizes this but still adds bureaucratic hurdles (e.g., "provisional").
      For the anxious citizen, Kant says feeling satisfaction *in* doing duty is "respect," which is moral feeling, not inclination. I need to distinguish this carefully.

  6.  **Writing - Step-by-Step:**

      *   *Header:* BUREAU OF MORAL WORTH. FAQ Series 4.2.
      *   *Intro:* Regarding the certification of actions possessing genuine moral worth.
