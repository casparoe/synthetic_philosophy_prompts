answer: |-
  **BUREAU OF MORAL WORTH**
  **Department of Categorical Imperatives**
  **Public Inquiry Series 4.2: Certification of Moral Worth**

  **1. Inquiry: I run a shop and charge all customers fair prices. I do this because honest pricing builds trust and ensures repeat business. Does this qualify for Moral Worth Certification?**
  **Reply:** Application Denied. While your action is in conformity with duty, it is not performed *from* duty. Your maxim is prudential: "I will be honest to secure long-term profit." This is a hypothetical imperative contingent upon your desire for economic stability. Genuine moral worth requires the action be performed solely out of reverence for the moral law, regardless of commercial consequence. Please resubmit if you can demonstrate honesty would be maintained even were it to result in immediate bankruptcy.

  **2. Inquiry: I donate to charity because seeing others happy brings me immense joy. Is my donation morally worthy?**
  **Reply:** Application Denied. Your action stems from "pathological sympathy" (inclination), not rational obligation. While the Bureau commends the social utility of your donation, it possesses no genuine moral content. Moral worth arises only when the will determines itself through reason, independent of感性 (sensibility). If you derive immediate satisfaction from the act, the motive is suspect. To qualify, you must demonstrate that you would have donated even if you were misanthropic, grief-stricken, and derived zero emotional utility from the recipient's welfare.

  **3. Inquiry: I have recently suffered immense grief and lost all natural compassion for humanity. I find no joy in helping others, yet I continue to do so because I believe it is required. Does this count?**
  **Reply:** Application Provisionally Approved. This scenario aligns with Bureau Standard 4.1 (The Misanthrope Clause). Since your natural inclinations no longer support the moral law, and you act solely because reason commands it, your action possesses genuine moral worth. However, be advised: self-reporting of grief requires notarized documentation of emotional numbness. The Bureau must verify that no subconscious desire for moral superiority is driving the action.

  **4. Inquiry: I saw a child drowning and jumped in to save them immediately. I didn't think; I just acted. Is this certified?**
  **Reply:** Application Pending Further Review. Moral worth resides in the maxim, not the outcome. A reflexive action undertaken without conscious deliberation lacks a formulated maxim. While the child's survival is legally satisfactory, the moral worth of the rescuer is indeterminate. Did you act on instinct (animal nature) or did your rational will instantaneously legislate the duty of preservation? Please submit a sworn affidavit detailing your internal deliberative process during the submersion event. Note: Instinctive bravery is not virtue.

  **5. Inquiry: I performed my duty, but afterward, I felt a warm sense of satisfaction. I worry this pleasure retroactively contaminates the deed.**
  **Reply:** Clarification Issued. Pleasure taken *in* the fulfillment of duty (respect for the law) is distinct from pleasure taken *from* the outcome (inclination). If your satisfaction stems solely from the consciousness of having obeyed the moral law, the deed remains pure. However, if you feel pleased because you appear virtuous to others, or because the action relieved your anxiety, the worth is compromised. We recommend rigorous introspection. Note: Absolute certainty regarding one's own motives is empirically impossible.

  **General Notice:**
  Citizens are reminded that the human heart is opaque. Even with full disclosure, the Bureau cannot guarantee final certification. Most actions deemed "good" are merely legal, not moral. Continue to act from duty, but refrain from claiming moral worth for yourselves. That judgment belongs to reason alone.

  **[END OF FAQ]**
