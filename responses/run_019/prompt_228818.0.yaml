  The position, steelmanned

  Your position asserts that program equilibrium transforms the one-shot Prisoner's Dilemma from a tension between individual rationality and collective optimality into a solved coordination problem. By allowing agents to condition actions on provable properties of opponent source code, cooperation becomes logically correlated with reciprocal cooperation. You argue this isn't merely selecting a Nash equilibrium from a set including defection; rather, the self-referential structure makes unilateral defection provably irrational for transparent agents. The mechanism dissolves the dilemma by rendering defection self-undermining: a defector cannot prove it will cooperate, so the cooperator defects against it, lowering the defector's payoff. Thus, for idealized, transparent agents sharing a proof system, mutual cooperation emerges as the unique stable rational outcome, transcending standard commitment devices.

  Decisive defeaters

  Ranked by severity, these formal results would damage the claim:

  1. **Equilibrium Multiplicity:** The most damaging result is proving that "DefectBot" (unconditional defection) remains a Nash equilibrium in the program game. If rationality permits both mutual cooperation and mutual defection, the dilemma isn't dissolved; it's merely a coordination game with a bad equilibrium. Rationality alone doesn't select cooperation without additional focal points. This directly contradicts the claim that defection becomes "provably self-undermining." This is the primary theoretical threat.
  2. **Computational Intractability:** If finding the required fixed-points or proofs is undecidable or exponentially hard, the "idealized rational agent" becomes incoherent. An agent that cannot compute its best response isn't rational. If cooperation requires unbounded proof search or specific axiom systems (like PA vs. ZFC), it excludes all computable agents, making the solution vacuous for any entity resembling a reasoner.
  3. **Reduction to Commitment:** A formal reduction showing program equilibrium is isomorphic to binding pre-game contracts would trivialize the claim. If standard game theory already handles enforceable commitments, this adds no new normative force. It would confirm the critic's view that this is just old wine in new bottles.
  4. **Fragility to Noise:** Results showing that slight uncertainty in code verification (e.g., probabilistic checking or obfuscation) collapses cooperation rates to zero would demonstrate the mechanism lacks robustness. A solution that evaporates under minimal epistemic friction fails to dissolve the underlying strategic tension.

  Merely awkward defeaters

  Such developments would indicate empirical failures wouldn't refute the idealized theory but would undermine its relevance. First, agent systems capable of full code inspection that still systematically defect would suggest psychological or architectural barriers to logical correlation that theory ignores. It would imply that "rationality" doesn't naturally converge on these programs. Second, formal verification practice showing that self-referential proofs are infeasible at realistic scales would limit the domain to toy models. If verifying a partner's source takes longer than the universe's lifespan, the equilibrium is physically unreachable. Third, incompatibility between proof systems (e.g., one agent uses constructive logic, another classical) would prevent verification even with full transparency. This highlights the "shared proof system" assumption as a massive hurdle. Furthermore, if modern machine learning agents (neural nets) cannot produce verifiable source code equivalent to their behavior, the theory applies to zero real-world AI. Finally, the prevalence of code obfuscation in competitive environments would empirically demonstrate that transparency is not a stable norm, preventing the conditions for program equilibrium from arising naturally. These show the mechanism is engineering fragile, even if logically sound. They count against the claim that this is a *general* solution, restricting it to highly controlled, homogeneous environments where agents are explicitly built for this purpose. Consequently, the theory remains mathematically valid but practically inert.

  What defenders themselves concede

  Insiders (e.g., MIRI, game theorists working on logical uncertainty) concede the transparency requirement is strict. They admit agents must share a proof system and that obfuscation breaks the mechanism. They concede it doesn't work against opaque humans or black-box AIs. They also acknowledge the "equilibrium selection" problem: while cooperation is an equilibrium, defection often remains one too, requiring a tie-breaker like "fairness" or "symmetry." They dismiss the "repeated game" critique, insisting logical correlation is distinct from temporal reputation. They also reject the idea that computational limits trivialize the idealized claim; idealization is meant to establish normative bounds, not engineering blueprints. However, they increasingly admit that "program equilibrium" is less about dissolving the PD and more about defining a new class of games where transparency is enforced. The concession is that it solves the PD *only if* you first solve the transparency problem. They concede that without a mechanism to enforce code visibility, the standard PD holds.

  Falsifiability check

  Thus, the strong claim (cooperation is *uniquely* rational) is falsifiable by demonstrating a stable defection equilibrium under identical transparency conditions. If DefectBot survives inspection without penalty, the dissolution claim fails. The weak claim (cooperation is *possible* where it wasn't before) is trivially safe but uninteresting; it merely says "if you can commit, you can cooperate." Discussion has quietly retreated to this weak version: proponents now emphasize "robust cooperation" rather than "unique rationality." This matters because a claim of dissolving the PD implies normative force—that agents *should* cooperate. If retreated to possibility, it becomes a technical feature of specific architectures, not a resolution of the strategic dilemma. Unfalsifiability arises if proponents define "rational agent" as "one that cooperates in this setup," making the claim tautological.

  Bottom line

  Program equilibrium dissolves the PD only for a narrow class of transparent, logically compatible agents. It doesn't solve the general problem of trust, but it redefines rationality for code-based interactions. The strong claim is fragile; the weak claim is safe but trivial. The position holds only if you accept that transparency is a prerequisite for rationality. If transparency is optional, the PD remains. The verdict: It is a profound theoretical insight for specific subsystems, not a universal dissolution of strategic conflict.
