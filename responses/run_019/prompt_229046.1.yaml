      *   *Actually, let's look at the "Fair Share" argument.* The analogy of a **Group Project** or **Potluck**. If others don't bring food, do you feed everyone until you starve? No, you feed what you can, then shame the others.
      *   *Decision:* The **"Leaky Dam"** or **"Community Firewatch"**. Let's go with **"The Firewatch Tower."** You see a fire. You call it in. You fight it if safe. But you aren't obligated to burn yourself to save the forest if others are idle.
      *   *Wait, the user wants an analogy for the *weaker* claim.* The weaker claim is: "You have an obligation to contribute significantly, but not to the point of marginal utility, especially given systemic uncertainty and non-compliance by others."
