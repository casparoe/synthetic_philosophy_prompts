answer: |-
  This is one of the hardest problems in moral philosophy and AI alignment. You have correctly identified that "Coherent Extrapolated Volition" (CEV) is not a magic algorithm; it is a mirror that reflects the definitions you build into it. If you define "idealized" as "more rational by my standards," you get imperialism. If you define it as "whatever they currently want, but louder," you get stagnation.

  To resolve your contradictions, you need a principle that distinguishes between **errors in the processing of values** (which idealization should fix) and **the values themselves** (which idealization must respect).

  Here is a precise framework, followed by the case mapping, the necessary verdict overturns, and the wireheading prediction.

  ### The Principle: The Agency-Integrity Framework

  **Defer to Idealized Volition if and only if the divergence between Actual and Idealized preferences is caused by a deficit in Agency, Information, or Coherence, AND the Idealization process does not substitute the agent's Terminal Values with external ones.**

  This framework relies on three clauses:

  1.  **The Pathology & Impairment Clause:** If the Actual preference is the result of temporary impairment (intoxication) or pathological suppression of agency (depression), defer to Idealized. These are *process failures*, not value differences.
  2.  **The Epistemic & Coherence Clause:** If the Actual preference relies on false information or logical incoherence that the agent *themselves* would reject upon reflection (given their own meta-values), defer to Idealized.
  3.  **The Constitutive Value Clause:** If the preference is a Terminal Value (a goal sought for its own sake, e.g., faith, taste, identity) that remains stable under full information and coherence, defer to Actual. Idealization cannot swap one Terminal Value for another (e.g., Truth for Faith) without violating agency.

  ---

  ### Case Mapping

  **1. Grandma (Cilantro)**
  *   **Verdict:** Defer to Actual.
  *   **Clause:** **Constitutive Value.** Taste is a terminal value. Idealization adds no new information that changes the sensory experience. Actual = Idealized.
  *   **Status:** Fits perfectly.

  **2. Drunk Friend (Texting Ex)**
  *   **Verdict:** Defer to Idealized.
  *   **Clause:** **Pathology & Impairment.** The divergence is caused by chemical impairment of executive function. Sober-him and Drunk-him share the same terminal values (dignity, healthy relationships); Drunk-him just lacks the agency to execute them.
  *   **Status:** Fits perfectly.

  **3. Depressed Cousin**
  *   **Verdict:** Defer to Idealized.
  *   **Clause:** **Pathology & Impairment.** Depression is a medical pathology that suppresses the *capacity* to value. It is not a "new value" of nothingness; it is the absence of the machinery required to hold values. Restoring the machinery restores the values.
  *   **Why it feels paternalistic:** Because you are acting on a medical diagnosis, not a conversation. But under this principle, it is justified as agency-restoration, not value-imposition.
  *   **Status:** Fits, but acknowledges the discomfort.

  **4. Lifelong Smoker**
  *   **Verdict:** Defer to Actual.
  *   **Clause:** **Constitutive Value.** He is fully informed and coherent. He values the experience of smoking over the length of his life. This is a trade-off of terminal values (Pleasure/Ritual vs. Longevity). Idealization cannot change this without imposing *your* value of Longevity over *his* value of Ritual.
  *   **Status:** Fits perfectly.

  **5. Adaptive Preference (Woman/Education)**
  *   **Verdict:** **OVERTURN REQUIRED.** (See below).
  *   **Clause:** **Epistemic & Coherence (with a caveat).** You stated: *"suppose even her idealized self wouldn't want it."*
  *   **Analysis:** If her idealized self—given full freedom, information, and coherence—*still* chooses tradition over education, you **must defer**. If you nudge her anyway, you are not respecting her volition; you are imposing a liberal/individualist terminal value (Self-Actualization) over her communitarian terminal value (Social Harmony/Tradition).
  *   **The Catch:** Usually, adaptive preferences *dissolve* under true idealization because the "coercive conditioning" counts as an information/agency deficit. If she was taught education is *impossible* (false info), idealization fixes that. If she was taught it is *immoral* (value), and she coherently accepts that value, you must respect it.
  *   **Status:** Your intuition to nudge is likely correct *in practice* because true idealization usually breaks the preference. But if your premise holds (Idealized Her still says no), your intuition is ethically dangerous.

  **6. Devout Friend**
  *   **Verdict:** **OVERTURN REQUIRED.** (See below).
  *   **Clause:** **Epistemic & Coherence.**
  *   **Analysis:** You wrote: *"he thinks the arguments against his faith are strong and he only stays devout by not looking at them."* This is the key. If he acknowledges the evidence is strong but avoids it to maintain belief, this is **Epistemic Akrasia** (weakness of will), not a Constitutive Value.
  *   **Why:** A Constitutive Value of Faith would say, "Evidence doesn't matter; commitment matters." But he admits the evidence *does* matter and he is hiding from it. This is a coherence failure. His Idealized self (who faces the evidence) deconverts. Therefore, his "real" preference is atheism.
  *   **Why your gut resists:** You fear smuggling in "Rationalism > Faith." But if *he* admits Rationalism > Faith in his own meta-ethics (by calling the arguments strong), then *he* is smuggling the verdict, not you.
  *   **Status:** Your intuition is protecting him, but the principle says his Idealized self is Atheist.

  ---

  ### The Hard Truths: Where I Overturn Your Verdicts

  You asked for honesty. Here is where your intuitions are likely protecting you from the implications of your own principle.

  **1. The Devout Friend:**
  You want to say his "real" preference is Faith. But you admitted he stays devout *only by avoidance*. That makes his faith fragile and dependent on ignorance. CEV is specifically designed to handle "what if I knew more." If he knew more (faced the arguments), he leaves.
  *   **Overturn:** You must accept that his Idealized Volition is Atheism. To defer to his Actual Volition is to collude in his self-deception. The only way to save Faith here is if his Terminal Value is "Comfort" or "Tribal Belonging" rather than "Truth." If he values Truth, he deconverts. If he values Belonging, he stays. You need to ask him which he values more.

  **2. The Adaptive Preference (Woman):**
  You want to nudge her even if Idealized Her says no. This is the "White Man's Burden" trap. If she has full information and agency and *chooses* her traditional role, nudging her is violence.
  *   **Overturn:** If Idealized Her truly rejects education, you must defer. However, I suspect your premise is false. In almost all real-world cases, "idealization" includes removing coercive social threats. If she knows she *can* be educated without being ostracized (removing the threat), she might choose education. If she still chooses tradition, you must respect it.

  ---

  ### The Prediction: The Experience Machine

  **Case:** Someone recoils from the Experience Machine (Wireheading) actually, but their Idealized Self (maximizing pleasure coherence) wants to plug in.

  **Prediction:** The Agency-Integrity Framework does **not** commit you to saying they "really want" to wirehead. It depends on *why* they recoil.

  1.  **Scenario A (Value):** They recoil because they value **Reality** or **Agency** as a Terminal Value. They prefer real struggles to fake happiness.
      *   **Result:** Idealized Self *also* recoils. Idealization makes them *more* coherent in valuing Reality. You defer to **Actual (No)**.
  2.  **Scenario B (Deficit):** They recoil because of **Fear** or **Confusion** about what the machine is (e.g., they think it will kill them, or they don't understand the quality of the experience).
      *   **Result:** Idealized Self (informed/coherent) accepts it. You defer to **Idealized (Yes)**.

  **The Trap:** Many CEV formulations assume "Well-being = Pleasure." If you build that into the idealization function, you force Scenario A people into Scenario B outcomes.
  **My Advice:** Your principle must treat "Desire for Reality" as a valid Terminal Value, not an error to be corrected by idealization. If they value Reality, the Idealized Self rejects the button.

  ### Summary of the Fix

  Your tentative principle failed because it tried to distinguish "info" from "values." That distinction is too blurry (e.g., is depression missing info about the world's worth?).

  The **Agency-Integrity Framework** works better because it distinguishes **Process** (Agency/Info/Coherence) from **Content** (Terminal Values).

  *   **Fix the Process:** (Drunk, Depressed, Avoidant Friend). Defer to Idealized.
  *   **Respect the Content:** (Grandma, Smoker, True Believer, Traditionalist). Defer to Actual.

  The friction you feel comes from cases where you aren't sure if you are looking at a Process Error or a Content Difference. That uncertainty is not a bug; it's the feature. It means you have to talk to the person, not just simulate them. CEV is not a substitute for consent; it is a tool for interpreting it when consent is compromised.
