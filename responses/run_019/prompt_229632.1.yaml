          *   *Critical Error 2:* The student argues that Frankfurt cases undermine the Consequence Argument because moral responsibility does not require the ability to do otherwise. While this is the standard *compatibilist* use of Frankfurt cases (attacking PAP), the Consequence Argument concludes that we have no *choice* about our actions (lack of control/ability to do otherwise). If Frankfurt cases show responsibility doesn't require PAP, does that undermine the Consequence Argument? Not directly. The Consequence Argument concludes we lack the *power* to do otherwise. If free will/responsibility doesn't require that power, then the Consequence Argument's conclusion (that we lack that power) is compatible with free will. So, Frankfurt cases undermine the *premise* that free will requires PAP, not necessarily the logic of the Consequence Argument itself. However, the student's phrasing ("The Consequence Argument, then, is aimed at a requirement we can do without") is a plausible interpretation of the dialectic.
