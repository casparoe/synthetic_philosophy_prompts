answer: |-
  **MEMORANDUM**

  **TO:** Tri-City Climate and Energy Commission
  **FROM:** Senior Policy Advisor (Climate Economics)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Carbon Pricing vs. Sufficiency Regulations

  ### Executive Summary

  The Commission faces a choice between escalating the carbon tax to $120/tonne (with a 70% dividend) or freezing the tax to implement a "sufficiency package" (caps on floorspace, drive-throughs, thermostat defaults, and flight bans).

  **Recommendation:** I recommend a **Hybrid Approach**. The Commission should vote to proceed with the carbon tax increase *and* simultaneously authorize a modified sufficiency package focused on infrastructure lock-in (building codes and aviation), while dropping measures with high legal vulnerability or low cost-effectiveness (commercial floorspace caps).

  Relying solely on price ignores biophysical limits and rebound effects; relying solely on sufficiency ignores economic costs and individual liberty. We need the revenue and signal of the tax, combined with the structural constraints of sufficiency.

  ### The Core Disagreement: Market Failure vs. System Failure

  To resolve this, we must acknowledge that the two camps are not just arguing about math; they are arguing about the nature of the problem.

  1.  **The Pro-Price Camp (Neoclassical/Environmental Economics):** Views climate change as a **market failure** (unpriced externality). The goal is to correct the price signal and let efficient actors find the cheapest reductions. They prioritize *economic liberty* (freedom to choose how to reduce) and *cost-effectiveness* (lowest $/tonne). Their fear is that regulations create deadweight loss and bureaucratic bloat.
  2.  **The Sufficiency Camp (Ecological/Degrowth Economics):** Views climate change as a **system failure** (inherent growth imperative). They argue that price signals are too slow, that efficiency gains trigger rebound effects (Jevons Paradox), and that wealth inequality allows the rich to "pay to pollute." They prioritize *outcome certainty* (physical caps on carbon) and *norm shifting*. Their fear is that the tax legitimizes consumption as long as you can pay.

  **Where they genuinely disagree:** It is not primarily about emissions outcomes (both want deep cuts). It is about **agency and sovereignty**. The Tax camp trusts decentralized individual choice constrained by cost. The Sufficiency camp trusts collective democratic planning constrained by biophysical limits.

  ### Analysis of Options

  **1. The Carbon Tax ($120/t, 70% Dividend)**
  *   **Strengths:** Economically efficient; the dividend makes it progressive (protecting low-income households); revenue funds further transition; respects consumer sovereignty.
  *   **Weaknesses:** At $120, elasticity may still be too low for essential travel or heating; does not prevent infrastructure lock-in (e.g., a new airport terminal built today emits for 50 years regardless of fuel cost); vulnerable to political repeal if prices spike.
  *   **Degrowth Critique Validated:** Yes, the wealthy can absorb the tax without changing behavior, and efficiency gains often fund more consumption elsewhere.

  **2. The Sufficiency Package**
  *   **Strengths:** Guarantees physical reduction in high-carbon activities; prevents lock-in (drive-throughs/floorspace); shifts social norms visibly; reduces reliance on uncertain price elasticities.
  *   **Weaknesses:** High administrative/enforcement costs; legally vulnerable (interstate commerce challenges on flights/trade); regressive potential (small businesses struggle with compliance more than chains); paternalistic friction with the public.
  *   **Economist Critique Validated:** Yes, a blanket ban on sub-500km flights ignores cases where rail is unavailable; thermostat defaults ignore specific medical or industrial needs.

  ### Reasoning for the Hybrid Recommendation

  As an economist who has studied the limits of pricing, I cannot support a tax-only approach. $120/tonne is significant, but it does not stop a developer from building energy-intensive commercial space if the ROI is high enough. Conversely, as a pragmatist, I cannot support a full sufficiency freeze. Banning commercial floorspace growth could stall necessary green infrastructure (e.g., retrofitting facilities, transit hubs) and invites immediate litigation that stalls all climate action.

  **The Hybrid Solution:**
  1.  **Keep the Tax & Dividend:** This is the engine. It raises revenue, protects the poor via the dividend, and drives broad behavioral change where choice exists (e.g., vehicle choice, appliance efficiency).
  2.  **Adopt Targeted Sufficiency Measures:**
      *   **Keep:** Thermostat defaults (low cost, high impact) and the Drive-Through Ban (prevents lock-in).
      *   **Modify:** The Flight Ban. Instead of a hard ban, implement a "frequent flyer levy" or reinvest tax revenue into rail alternatives for sub-500km routes.
      *   **Drop:** Hard caps on commercial floorspace. Replace with stringent *energy intensity* codes per square foot. This limits emissions without legally dubious growth caps.

  ### The Strongest Case Against This Recommendation

  I must be honest about the vulnerability of this hybrid path.

  **The "Worst of Both Worlds" Risk:** By combining taxes and regulations, we may incur the administrative costs and political friction of the sufficiency package *without* achieving the economic efficiency of the tax.
  *   **Political Feasibility:** This approach angers both tribes. The pro-market commissioners will view the regulations as redundant government overreach that distorts the price signal. The degrowth commissioners will view the retention of the tax as capitulation to a growth-based logic that allows the wealthy to continue high-emission lifestyles.
  *   **Implementation Drag:** Drafting the legal framework for the sufficiency measures (especially aviation and building codes) could take years. If legal challenges stall the regulations, and the tax is perceived as insufficient on its own, we risk a "lost decade" where emissions plateau while we fight in court.

  ### Conclusion

  The choice between "Price" and "Sufficiency" is a false dichotomy. Markets are excellent at allocating resources within a boundary, but they are terrible at setting the boundary itself.

  I recommend we vote to **maintain the carbon tax trajectory** to secure revenue and broad signals, but **amend the motion** to include the thermostat and drive-through regulations immediately, while commissioning a study on legal alternatives to the flight ban. This acknowledges that we need the efficiency of the market *within* the safety rails of physical constraints.

  **Decision:** Adopt Hybrid (Tax + Targeted Regulations).
