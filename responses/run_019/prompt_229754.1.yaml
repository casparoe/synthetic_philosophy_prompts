answer: |-
  **Setting:** *Outside the neuroscience building, late afternoon. Two philosophers, ELENA and JULIAN, hold paper cups of lukewarm coffee. They have just witnessed a demonstration in the visual cognition lab involving apparent motion and change blindness.*

  **ELENA:** The 80-millisecond gap. Did you see their faces? They watched a continuous conversation, swore up and down it was uncut, and then three of them described the red mug that only appeared in the spliced frames. A mug they insisted they "didn't see."

  **JULIAN:** Classic postdiction. The brain takes the context *after* the gap and stitches a narrative over the hole. There was no moment where the subject experienced a seamless video. There was only a later moment where they produced a report saying it was seamless.

  **ELENA:** That's the Multiple Drafts slogan, Julian, but it dodges the phenomenology. If I feel a seamless video, something in my head is presenting a seamless video. You can't just say "the report is seamless." The *experience* was seamless. That requires a binding point. A place where the visual data, the temporal data, and the memory trace converge before they become "conscious."

  **JULIAN:** "Before they become conscious." There it is. The finish line. You're still looking for the moment the light turns on in the Cartesian Theater. Dennett buried that idea thirty years ago. There is no single moment where it "becomes" conscious. There are only varying degrees of influence on memory and speech.

  **ELENA:** I'm not positing a homunculus. I'm positing a functional bottleneck. Call it a "Modest Theater." It's not a little man watching a screen; it's a global workspace. But for that workspace to function, contents must be bound and timestamped. If the brain didn't fill that 80ms gap *before* broadcasting the content to the workspace, the subject would experience a glitch. They didn't. Therefore, the filling-in happened pre-consciously.

  **JULIAN:** But "pre-consciously" relative to what? You're assuming consciousness is a state that happens *to* the data. I'm saying consciousness *is* the data's influence on the system. When they describe the red mug, that information was available to the motor systems for speech, but it wasn't woven into the dominant narrative draft of "watching a video." That's why they say, "I didn't see it," even as they describe it.

  **ELENA:** No, that conflates reportability with phenomenality. They didn't report the mug *during* the viewing because it wasn't on the stage. It was processed—obviously, since they described it later—but it wasn't *experienced*. The gap, however, *was* experienced as continuous. That continuity is the key. To experience continuity across a gap, the system must edit the timeline. If that editing happens in parallel drafts, why is the resulting experience so singular? Why don't we feel the competing drafts?

  **JULIAN:** Because the competition is fierce and the loser leaves no trace. You ask, "Why is the experience singular?" I ask, "Why do you assume singularity is a feature of the processing rather than a feature of the retrospective story?" The brain is a parallel processor. It generates multiple interpretations. The one that wins the race to control speech becomes the "conscious" one. The others aren't suppressed from a theater; they just fade.

  **ELENA:** But that leaves the timing unexplained. In the demo, the subjects reacted to the gap as if it weren't there *in the moment*. If it's all retrospective narrative, reaction times should be scrambled. They aren't. There has to be a synchronization mechanism. A distributed theater, if you like. The neurons are spread out, sure, but the *content* is unified in time.

  **JULIAN:** "Unified in time." That's the magic words. How do you timestamp a neural firing pattern without a master clock? If you have a master clock, you're back to the homunculus reading the time. If you don't, then "simultaneity" is just a matter of when signals arrive at different decision centers. Your "Modest Theater" is just a Multiple Drafts model where you've arbitrarily declared one draft the "Official Version" before the subject speaks.

  **ELENA:** It's not arbitrary. It's the point of no return. The moment the content is available for *any* rational action, not just speech. If I swat a fly, I don't write a narrative about it. But the visual data had to be bound and present to guide the hand. That binding is the stage.

  **JULIAN:** Or, the swatting is handled by a draft that never reaches the linguistic centers. That's why you can swat a fly you didn't "notice." Look at the mug again. They described it. That means a draft containing "red mug" existed. But the draft containing "video was cut" lost the competition. You want to say the "video" draft was on the stage and the "mug" draft was in the wings. I say they were both just neural activations. One won.

  **ELENA:** If there's no stage, Julian, then there's no one to whom the winning draft matters. You're explaining the behavior perfectly, but you're explaining away the mind. If I burn my hand, the pain isn't just a "winning draft" that influences me to say "ouch." It hurts. That hurt quality requires a locus. A distributed locus, fine. But a locus where the signal is integrated.

  **JULIAN:** The hurt *is* the integration. You're reifying the process into a place. But let's grant your "Modest Theater." Let's say there is a global workspace where binding happens. What counts as evidence against it? If we find that reaction times vary based on post-stimulus information, does that falsify the Theater?

  **ELENA:** It would falsify a *rigid* Theater. But my view allows for postdiction within the pre-conscious buffering phase. The buffer holds 200ms of data, edits it, binds it, and *then* projects it to the stage. The stage is the moment of experience. The buffer is the editing room.

  **JULIAN:** So the "stage" is just the output of the buffer.

  **ELENA:** It's the *availability* of the buffer's content.

  **JULIAN:** Then we're arguing about labels. You call the output "Experience." I call it "The Dominant Draft." The only difference is you think there's a fact of the matter about *when* it became experienced, independent of when the subject reports it.

  **ELENA:** There is a fact of the matter. If the subject is anesthetized, the buffer might still work, but there is no stage. No experience.

  **JULIAN:** Or, under anesthesia, the drafts never achieve the coherence required to influence long-term memory. There's no "light" that turns off. Just connectivity that degrades.

  **ELENA:** [Pauses, looking at her coffee] Here is the cost, then. To maintain the "stage"—to maintain that there is a genuine unity of experience distinct from the narrative report—I have to posit a binding mechanism that is neurally elusive. I have to claim there is a specific functional threshold where "processing" becomes "presentation."

  **JULIAN:** And?

  **ELENA:** And neuroscience keeps finding that threshold moving. Depending on the task, the "binding" happens at 100ms, or 300ms, or later. If my Theater is real, the curtain should rise at a specific time. If the curtain rises at different times depending on when you ask the question, then the Theater is... fluid.

  **JULIAN:** Which is exactly what Multiple Drafts predicts.

  **ELENA:** [Sighs] It makes my "Modest Theater" look suspiciously like a theoretical fiction. I need the unity to explain the phenomenology—the *what-it-is-like*. But if I can't locate the unity in time without it shifting, I'm risking the very Cartesian Materialism you accuse me of. I'm positing a "finish line" that keeps moving down the track.

  **JULIAN:** So you concede the point?

  **ELENA:** I concede the cost. To save the phenomenon of unity, I have to posit a mechanism that looks increasingly magical the closer we look at the neurons. I have to insist that somewhere, somehow, the disparate signals *become* one, even if the "where" and "when" are functionally indeterminate. It leaves my view vulnerable to the charge that I'm just naming the mystery "The Stage."

  **JULIAN:** That is a significant cost. It makes your view harder to operationalize.

  **ELENA:** It does. But I still think you pay a higher one. You save the neural plausibility, but you lose the pain. If there's no stage, Julian, who hurts?

  **JULIAN:** [Smiles faintly] The system hurts. And it doesn't need a theater to scream.

  **ELENA:** Maybe. But until you can explain why the scream feels like *one* scream, I'll keep my curtain. Even if I can't tell you exactly where the rigging is hung.
