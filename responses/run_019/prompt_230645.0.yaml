      *Wait, one more check on Note 1:* Does S/A/M force apart a picture that works as a whole? Dennett's theater is a *metaphor*. Breaking it down is analytically necessary to critique it, but one must acknowledge they are functionally linked. S implies A implies M. You can't really have a Stage without something being shown (M) to someone (A). I will note this interdependence.

