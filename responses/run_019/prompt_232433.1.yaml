  A mid-sized asset manager I work for is currently subject to two regulatory requirements that seem to sit uneasily together. First, our retail fund documents must include a disclosure stating that past performance is not a reliable guide to future results. Second, our annual prudential review requires the firm's internal risk models to be calibrated on at least ten years of historical market data, including historical stress scenarios. The same regulator can reject a risk model as unsupported if it does not lean on historical patterns, while separately issuing enforcement actions against marketing language suggesting that a fund's track record gives any reason to expect continued outperformance. My colleagues tend to dismiss this as the usual gap between legal boilerplate and quantitative modeling, but I suspect the two requirements presuppose different theories of inductive inference. Either historical data carry information about future outcomes, or they do not; it is not obvious that you can coherently have it both ways.

  Please reconstruct the implicit theory of induction presupposed by this combination of regulatory practices. Do the two requirements presuppose different theories? Is there a principled distinction between using historical data for risk modeling and using it for performance claims, or is the difference merely prudential and political? How would a no-free-lunch theorem, understood as the claim that no learning algorithm can outperform random guessing when averaged over all possible target functions, bear on the warrant for using any historically calibrated model in finance? And what would have to change in the regulatory regime if that theorem were taken seriously as a constraint on inductive inference?

  Please structure your answer as follows:

  - The surface conflict: restate the two requirements and the apparent contradiction in about 150 words.
  - The implicit epistemologies: reconstruct the distinct views of induction and historical data each requirement appears to assume, if they differ, in about 300 words.
  - A principled reconciliation?: examine possible distinctions, such as prediction versus stress-testing, past performance versus historical covariance, and legal boilerplate versus epistemic commitment, in about 250 words.
  - The no-free-lunch objection: apply the theorem to the use of historical data in finance and say whether it actually undermines the risk-model requirement, in about 300 words.
  - What would have to change: describe the revised regulatory practice if no-free-lunch constraints were taken seriously, in about 200 words.
  - Verdict: say which requirement, if either, is more defensible under the reconstructed epistemology, and why, in about 100 words.
