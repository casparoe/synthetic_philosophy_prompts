  - **The surface conflict:** The regulatory regime imposes contradictory epistemic demands. On one hand, consumer protection rules mandate disclosures stating that past performance is not a reliable guide to future results, effectively warning investors that historical returns possess no predictive validity for alpha generation. On the other hand, prudential standards require internal risk models to be calibrated on at least ten years of historical data, including stress scenarios, implying that historical volatility and correlation structures are essential for estimating future risk exposure. The regulator thus simultaneously rejects historical induction for return projections while mandating it for risk assessment. This creates an apparent logical inconsistency: historical data are deemed epistemically void for performance expectations yet epistemically necessary for solvency modeling. The firm is caught between marketing law that denies the stability of financial patterns and risk law that presupposes their continuity. It appears the regulator insists history is useless for making money but essential for not losing it.

  - **The implicit epistemologies:** The performance disclosure presupposes a skeptical empiricism regarding first moments (returns). It aligns with the Efficient Market Hypothesis or a Humean skepticism where causal connections between past price movements and future gains are unproven. It assumes non-stationarity in alpha; any outperformance is likely luck or transient arbitrage that will vanish. Conversely, the risk modeling requirement presupposes a structural realism regarding second moments (variance, covariance, tail risk). It assumes that while specific returns are unpredictable, the *distributional properties* of asset classes exhibit sufficient stationarity or cyclical recurrence to warrant modeling. The risk rule assumes history contains information about *possibility space* (what *can* happen), even if it doesn't predict *actual outcomes* (what *will* happen). Thus, the regulator implicitly distinguishes between predicting specific trajectory (forbidden) and estimating structural vulnerability (mandatory). The former assumes a random walk regarding direction; the latter assumes a constrained random walk regarding dispersion. This is not necessarily contradictory but requires distinct theories of what aspects of market data are invariant over time. The risk model assumes physical laws of finance hold; the disclosure assumes market efficiency erodes profit opportunities. This divergence suggests the regulator operates with a dualistic ontology: the market is efficient for pricing but statistical for risk. One views the market as an adversarial agent erasing patterns; the other views the market as a physical system subject to statistical laws. Consequently, the epistemic stance shifts from skepticism to realism depending on the regulatory silo. The marketing rule treats induction as a logical fallacy in the context of competitive markets, protecting the investor from their own cognitive biases regarding trends. The risk rule treats induction as a pragmatic necessity for engineering safety, protecting the system from tail events. This implies that historical data is viewed as containing signal regarding systemic fragility, but noise regarding individual gain. The contradiction lies not in the data itself, but in the inferred utility of that data for different agents: the investor seeking yield versus the regulator seeking stability.

  - **A principled reconciliation?:** A principled reconciliation exists if we distinguish between predicting means and estimating variances. Financial theory often holds that expected returns are unobservable and unstable, while volatility clusters and correlates persistently. The performance warning addresses the former, preventing investors from extrapolating alpha. The risk requirement addresses the latter, ensuring capital adequacy against known distributional shapes. Furthermore, the risk mandate is not purely inductive; it is prudential. It does not claim the model is *true*, but that using history is the *least bad* available heuristic for capital allocation. The legal disclosure is an epistemic commitment to uncertainty; the risk rule is a regulatory commitment to robustness. However, this reconciliation is fragile. If markets are truly non-stationary due to regime changes, ten-year data may mislead risk models just as it misleads performance claims. The distinction often collapses in practice when risk models (like VaR) are implicitly treated as predictive guarantees rather than stress thresholds. Thus, while theoretically distinct (mean vs. variance), the practical reliance on historical stationarity remains the shared weak point. The legal boilerplate is an admission of ignorance; the risk model is a pretense of knowledge. This asymmetry allows the contradiction to persist administratively even if it fails logically. The disclosure protects against liability; the model protects against insolvency. They serve different masters: law and engineering.

  - **The no-free-lunch objection:** The No-Free-Lunch (NFL) theorem states that averaged over all possible target functions, no learning algorithm outperforms random guessing. Applied to finance, if the market-generating process is not restricted to a specific subset of functions where history matters, historical calibration provides no warrant for future accuracy. If financial markets are non-stationary systems where the underlying function changes arbitrarily, NFL suggests risk models calibrated on past data are epistemically ungrounded. However, NFL applies to the space of *all* possible functions, whereas finance operates within a specific physical and economic reality. The theorem undermines the claim that historical calibration guarantees accuracy, but not necessarily its utility as a baseline. It suggests that without assuming specific biases (e.g., continuity, mean reversion), historical data is noise. Therefore, NFL does not invalidate the risk requirement entirely but strips it of inductive certainty. It forces the admission that the model works only if the future resembles the past structurally. If the regulator mandates history without acknowledging this assumption, they violate NFL constraints. The risk model becomes a bet on stationarity, not a measurement of objective risk. NFL highlights that the prudential requirement is a policy choice to assume stability, not a scientific derivation of it. It reveals the risk model as a wager rather than a measurement. In finance, we assume the target function isn't *any* function, but one constrained by human behavior and economic laws. However, if those laws change (regime shift), NFL bites hard. The objection strengthens the view that risk models are subjective priors disguised as objective data analysis. Consequently, relying on historical calibration without explicit priors is mathematically unjustified. The regulator effectively mandates a specific prior (stationarity) without declaring it as such.

  - **What would have to change:** If NFL constraints were taken seriously, regulators would abandon the pretense that historical calibration yields true risk measures. Practice would shift from backtesting to adversarial stress-testing. Instead of mandating ten years of data, rules would require firms to demonstrate model robustness across hypothetical, non-historical scenarios where historical correlations break down. Capital requirements would increase to account for "model risk" inherent in inductive inference. Regulators might mandate ensemble modeling, requiring firms to run conflicting models (e.g., historical vs. random walk) and capitalize against the worst outcome. The disclosure regime would align with risk modeling, admitting that risk estimates are also uncertain guesses. Ultimately, the regime would treat risk models as regulatory fictions necessary for coordination rather than scientific truths, focusing on resilience to model failure rather than precision of calibration. History would become optional context, not mandatory input. The focus moves from fitting the past to surviving the unknown. Validation would replace calibration as the primary regulatory metric.

  - **Verdict:** The risk modeling requirement is more defensible, not because it solves induction, but because it serves a prudential rather than epistemic goal. Even if historical data imperfectly predicts volatility, using it is superior to no data for capital adequacy. The performance disclosure is epistemically stricter but necessary to prevent fraud. The risk mandate is more coherent as a regulatory tool: it enforces a common language of solvency, whereas performance warnings protect consumer psychology. The risk rule accepts the burden of induction to prevent systemic collapse; the disclosure rule rejects it to prevent investor delusion. Thus, the risk rule is a necessary fiction.
