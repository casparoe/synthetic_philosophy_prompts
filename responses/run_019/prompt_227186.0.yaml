prompt: |-
  I'm a TA for an introductory statistics course aimed at social science majors, most of whom have weak algebra and no probability beyond coin-flip intuition, and in two weeks I get one sixty-minute section on Simpson's paradox. The professor's lecture has already covered proportions and cross-tabulations, so they can read a two-by-two table, but that's all I can assume. Don't explain the paradox to me; plan how I should explain it. I want the order in which the pieces have to go — my instinct is to start with a dramatic reversal example, but I suspect something has to be in place first about how aggregate rates are weighted averages of group rates, with the weights differing across groups, or the reversal will look like arithmetic sleight of hand rather than a structural fact. Tell me what depends on what.

  I also need a decision on the carrying example. The famous real cases (the kidney stone treatment comparison, the graduate admissions bias case) are well documented, but I'm worried a real-world example drags in background debates about what the right conclusion actually was in that case. So: should I use a real case or a constructed one, what properties must the example have (and lack) for the reversal to be visible at a glance rather than buried in arithmetic, and what are the two or three numbers I should have them compute by hand? Then the misconception map: I expect at least 'the aggregate number is just wrong', 'this only happens with small samples', 'the stratified result is always the right one', and 'adding more control variables always gets you closer to the truth'. Give me the point in the sequence where each should be headed off rather than corrected after the fact, and the one question I can ask at the end whose correct answer would show the idea landed rather than the numbers were memorized.

  Two further constraints. First, tell me what to leave out at this level and say so openly in class — I'm guessing directed acyclic graphs and causal calculus, but if there's a minimal piece of causal vocabulary without which the students will systematically pick the wrong table to trust, flag it. Second, separate for me what is settled from what is genuinely contested: the arithmetic of the reversal itself is not in dispute, but I gather that whether resolving it requires causal assumptions beyond the data, and whether the paradox is even a 'paradox' rather than a familiar feature of weighted averages, are points where people who know the topic disagree. Please mark which is which so I don't present a contested framing as the textbook consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for introductory statistics (social science majors).
      *   **Student Profile:** Weak algebra, no probability beyond coin flips, know proportions and 2x2 tables.
      *   **Task:** Plan a 60-minute section on Simpson's Paradox.
      *   **Constraints:**
          *   Do not explain the paradox to *me* (the AI); plan how *I* (the TA) explain it to *them*.
          *   Determine the order of concepts (dependencies).
          *   Decide on the example (Real vs. Constructed) and specific properties/numbers.
          *   Map misconceptions to specific points in the lesson sequence (pre-empt vs. correct).
          *   Identify one "concept check" question for the end.
          *   Identify what to leave out (and say so).
          *   Identify minimal causal vocabulary needed.
          *   Distinguish settled math from contested interpretation.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Core Difficulty:* Students see numbers as absolute truths. They struggle with weighted averages. They assume "bigger data = better truth."
      *   *The TA's Instinct:* Start with the dramatic reversal.
      *   *The TA's Worry:* Without understanding weighted averages, it looks like magic/trickery.
      *   *The Solution:* The TA's worry is correct. You cannot understand *why* the reversal happens without understanding *how* aggregates are formed. However, you need the "hook" (the reversal) to motivate the boring part (weighted averages). So, the order needs to be: Hook -> Mechanism -> Implication -> Caveats.

  3.  **Drafting the Sequence (Dependencies):**
      *   *Step 1: The Hook.* Show the reversal immediately. If you wait, they lose interest. But frame it as a puzzle, not a fact yet.
      *   *Step 2: The Mechanism (The "Why").* This is the critical algebraic piece. Aggregates are weighted averages. Weights matter. This must come *before* discussing which table is "right."
      *   *Step 3: The Causal Context.* Why do the weights differ? (Confounding). This determines which table to trust.
      *   *Step 4: Misconceptions.* Address these as they arise or in a dedicated wrap-up.
      *   *Step 5: Assessment.* The final question.

  4.  **Selecting the Example:**
      *   *Real Cases:* Berkeley Admissions (sexism debates), Kidney Stones (medical complexity).
      *   *Constructed:* Tennis serves, Plant survival, Hypothetical Treatment.
      *   *Decision:* Use a *constructed* example that mimics a real scenario (e.g., Treatment vs. Recovery).
      *   *Why:* Real cases bring baggage (was it really sexism? was it really stone size?). Constructed examples allow clean numbers.
      *   *Properties:* Needs small integers. Needs a large imbalance in group sizes (the weights). Needs the reversal to be obvious in percentages, not just raw counts.
      *   *Numbers:* Keep denominators simple (10, 100).
      *   *Calculation:* Have them calculate the aggregate rate from the subgroup rates and weights. This proves it's not a calculation error.

  5.  **Mapping Misconceptions:**
      *   *'Aggregate is wrong':* Address during the Mechanism phase. It's not wrong, it's just answering a different question.
      *   *'Small samples':* Address when showing the numbers. Make sample sizes large enough to rule this out.
      *   *'Stratified is always right':* Address during the Causal Context phase. Sometimes aggregation *is* the goal (e.g., overall cost).
      *   *'More controls = truth':* Address in the "What to leave out" or wrap-up. Over-controlling is possible (colliders), but maybe too advanced? Keep it simple: "More isn't always better."

  6.  **Causal Vocabulary & Exclusions:**
      *   *Exclude:* DAGs, do-calculus, structural equations, p-values, significance testing.
      *   *Include:* "Confounding variable" (or "Lurking variable"), "Group composition."
      *   *Minimal Vocab:* They need to know *why* the groups are different sizes. "Severity" or "Choice" is the key.
      *   *Settled vs. Contested:*
          *   *Settled:* The arithmetic works. The reversal is possible.
          *   *Contested:* Which table is the "truth"? (Requires causal assumptions). Is it a paradox? (It's not, it's math).

  7.  **Refining the Lesson Plan (Iterative Process):**
      *   *Time Check:* 60 minutes is tight.
      *   *0-10 min:* Hook (The Reversal).
      *   *10-25 min:* Mechanism (Weighted Averages). *Crucial Step.*
      *   *25-40 min:* The "So What?" (Causal Context/Which table to trust).
      *   *40-50 min:* Misconception Check.
      *   *50-60 min:* Final Question & Wrap-up.
      *   *Example:* Let's use a "New Drug vs. Old Drug" scenario with "Mild vs. Severe" patients. It's intuitive for social scientists (policy/medicine).
      *   *Numbers:*
          *   Mild: New (90/100), Old (80/100).
          *   Severe: New (20/100), Old (10/100).
          *   Wait, that doesn't reverse.
          *   Need weights to flip.
          *   Mild: New (10 treated, 9 survive), Old (90 treated, 72 survive). -> New 90%, Old 80%.
          *   Severe: New (90 treated, 18 survive), Old (10 treated, 1 survive). -> New 20%, Old 10%.
          *   Aggregate New: 27/100 = 27%.
          *   Aggregate Old: 73/100 = 73%.
          *   Reversal achieved. New is better in groups, worse in aggregate.
          *   *Correction:* Make numbers easier.
          *   Group A (Easy): Drug X 4/5 (80%), Drug Y 9/10 (90%). (Wait, X needs to be better in subgroups).
          *   Let's stick to the standard "Treatment is better in both, but assigned mostly to hard cases."
          *   Mild Cases: Treatment A (8/10 = 80%), Treatment B (7/10 = 70%).
          *   Severe Cases: Treatment A (2/10 = 20%), Treatment B (1/10 = 10%).
          *   Assignment: Treatment A gets mostly Severe (90 Severe, 10 Mild). Treatment B gets mostly Mild (10 Severe, 90 Mild).
          *   Agg A: 10/100 = 10%.
          *   Agg B: 70/100 = 70%.
          *   Reversal: B looks way better overall, but A is better in both groups.
          *   *Computation:* Have them calculate the Aggregates from the subgroups.

  8.  **Addressing the "Settled vs. Contested" Constraint:**
      *   Must be explicit. The math is settled. The *interpretation* depends on the story.
      *   Must tell students: "Statistics cannot tell you which table is right without knowing how the data was generated."

  9.  **Addressing the "What to Leave Out" Constraint:**
      *   No DAGs.
      *   No formulas for weighted averages (just the concept).
      *   No "Colliders" or "M-Bias" (too advanced).
      *   *Minimal Vocab:* "Confounding Variable" (the thing changing the weights).

  10. **Final Review against constraints:**
      *   Order of pieces? Yes (Hook -> Weights -> Causality).
      *   Example decision? Yes (Constructed, specific numbers).
      *   Misconception map? Yes (Linked to sequence).
      *   Final question? Yes (Conceptual, not arithmetic).
      *   Leave out? Yes (DAGs, etc.).
      *   Settled vs. Contested? Yes (Math vs. Causal Inference).

  11. **Drafting the Response:** (Self-Correction during drafting)
      *   *Tone:* Professional, directive, pedagogical.
      *   *Structure:* Follow the user's prompt structure (Sequence, Example, Misconceptions, Exclusions, Settled/Contested).
      *   *Emphasis:* Highlight the "Weighted Average" concept as the linchpin. Without that, the rest fails.
      *   *Refining the Example:* Ensure the numbers are *very* clean for mental math or quick calculator use. 10s and 100s are best.
      *   *Refining the Final Question:* It needs to test if they understand *why* we stratify, not just *how*.

  12. **Final Polish:** Check the timing. 60 minutes goes fast. Ensure the "Weighted Average" section doesn't drag. Use visual aids (bar charts) suggestion.

  *(Self-Correction on the Example Numbers)*:
  Let's verify the "Treatment A is better in both groups" logic.
  Mild: A (80%) > B (70%).
  Severe: A (20%) > B (10%).
  Weights:
  A: 10 Mild, 90 Severe. (Mostly hard cases).
  B: 90 Mild, 10 Severe. (Mostly easy cases).
  Agg A: (8 + 18) / 100 = 26%.
  Agg B: (63 + 1) / 100 = 64%.
  Reversal: B looks better overall (64% vs 26%), but A is better in every subgroup.
  This works perfectly. It illustrates that Treatment A was given to sicker people.

