answer: |-
  Here is the lesson plan structured by dependency, example design, misconception management, and epistemological boundaries.

  ### 1. The Sequence of Dependencies
  Your instinct is correct: starting with the reversal without the mechanism makes it look like magic. However, starting with the mechanism kills engagement. You need a **Sandwich Structure**: *Phenomenon → Mechanism → Implication.*

  **Order of Operations (60 Minutes):**

  1.  **The Hook (0–10 mins):** Show the reversal first. Present the aggregate table, get a consensus on the "winner." Then reveal the stratified tables. Let the cognitive dissonance sit for a moment.
      *   *Dependency:* None. This relies on their existing ability to read proportions.
  2.  **The Mechanism (10–25 mins):** **This is the critical linchpin.** You must establish that an aggregate rate is a **weighted average** of subgroup rates.
      *   *Dependency:* Requires the Hook to motivate *why* we care about weights.
      *   *Action:* Do not use algebra variables ($p_1, p_2$). Use the specific numbers from the example. Show that the Aggregate Rate $\neq$ Average of Subgroup Rates. Show that Aggregate Rate = (Group 1 Rate $\times$ Group 1 Size) + (Group 2 Rate $\times$ Group 2 Size).
      *   *Goal:* Prove the arithmetic is not a mistake. The reversal is a structural result of unequal group sizes (weights).
  3.  **The Causal Context (25–40 mins):** Now ask: "Which table tells the truth?"
      *   *Dependency:* Requires the Mechanism. Once they know the math is valid, they realize the answer depends on the *story*, not the numbers.
      *   *Action:* Introduce the "Lurking Variable" (e.g., Severity of Illness). Explain that the treatment assignment was not random; sicker people got Treatment A.
  4.  **Misconception Check & Wrap-up (40–60 mins):** Address specific errors and pose the final conceptual question.

  ---

  ### 2. The Carrying Example
  **Decision:** Use a **Constructed Example**.
  **Reasoning:** Real cases (Berkeley, Kidney Stones) invite debates about the specific context (e.g., "Was it really sexism?" or "How do you define stone size?"). You want the debate to be about the *statistics*, not the sociology or medicine. A constructed example allows you to control the "truth."

  **Scenario:** "New Drug vs. Old Drug" for a disease.
  **Properties Required:**
  1.  **Integers:** Denominators must be 10 or 100. No decimals.
  2.  **Imbalance:** The group sizes (weights) must differ drastically between the two treatments to force the reversal.
  3.  **Direction:** The "better" treatment must be given to the "harder" cases (this is the most common social science instantiation: policy interventions targeting those most at risk).

  **The Numbers (Put this on the board):**

  *   **Subgroup 1 (Mild Cases):**
      *   New Drug: 8 recovered / 10 total = **80%**
      *   Old Drug: 7 recovered / 10 total = **70%**
      *   *(New Drug is better)*
  *   **Subgroup 2 (Severe Cases):**
      *   New Drug: 2 recovered / 10 total = **20%**
      *   Old Drug: 1 recovered / 10 total = **10%**
      *   *(New Drug is better)*
  *   **The Twist (Group Sizes/Weights):**
      *   New Drug was given mostly to Severe cases: **10 Mild, 90 Severe** (Total 100).
      *   Old Drug was given mostly to Mild cases: **90 Mild, 10 Severe** (Total 100).

  **The Calculation (Have them do this by hand):**
  1.  Calculate the **Aggregate Recovery Rate** for the New Drug.
      *   Total Recovered: $8 + (2 \times 9) = 26$. (Wait, keep it simple).
      *   *Correction for mental math:* Let's scale the Severe counts to match the 90/10 split directly.
      *   **Revised Numbers for Board:**
          *   **Mild:** New (8/10 = 80%), Old (90/100 = 90%). *Wait, New must be better in both.*
          *   **Let's stick to the prompt's request for 2-3 numbers to compute.**
          *   **Final Proposed Numbers:**
              *   **Mild:** New Drug (4/5 = 80%), Old Drug (9/10 = 90%). *No, New must win subgroups.*
              *   **Okay, Final Final:**
              *   **Mild:** New Drug (8/10 = 80%), Old Drug (7/10 = 70%).
              *   **Severe:** New Drug (2/10 = 20%), Old Drug (1/10 = 10%).
              *   **Assignment:** New Drug gets 10 Mild, 90 Severe. Old Drug gets 90 Mild, 10 Severe.
              *   **Compute:**
                  1.  New Drug Total Recovered: $8 + (2 \times 9) = 26$ out of 100 $\rightarrow$ **26%**.
                  2.  Old Drug Total Recovered: $(7 \times 9) + 1 = 64$ out of 100 $\rightarrow$ **64%**.
      *   **The Reversal:** New Drug wins in both subgroups (80%>70%, 20%>10%), but Old Drug wins in aggregate (64%>26%).

  **Why these numbers?** The rates (80/70 and 20/10) are easy to compare. The weights (10 vs 90) are easy to multiply mentally. The reversal is massive (26% vs 64%), so it cannot be dismissed as noise.

  ---

  ### 3. The Misconception Map
  Do not wait for them to raise these. Pre-empt them at the specific sequence points where they naturally arise.

  | Misconception | When to Head It Off | How to Phrase It |
  | :--- | :--- | :--- |
  | **"The aggregate number is just wrong/a calculation error."** | **During The Mechanism (Min 15).** | "Before we argue about drugs, check my math. Multiply the subgroup rates by the group sizes. You will get the aggregate. The math is honest; the summary is misleading." |
  | **"This only happens with small samples / chance."** | **During The Hook (Min 5).** | "Notice the totals are 100 patients per drug. This isn't a fluke of having 3 patients in a group. This happens with millions of records if the weights are skewed." |
  | **"The stratified result is always the right one."** | **During Causal Context (Min 30).** | "If I want to know how the drug works biologically, look at subgroups. If I want to know the budget impact for the whole hospital next year, the aggregate is the truth. 'Right' depends on the question." |
  | **"Adding more control variables always gets you closer to the truth."** | **During Wrap-up (Min 50).** | "If we split by 'Day of the Week' and find a reversal there, do we trust that? No. We only split by variables that affect *both* treatment assignment and outcome." |

  ---

  ### 4. The Final Concept Check Question
  Do not ask them to calculate a rate. Ask them to identify the *condition* for the paradox.

  **The Question:**
  > "Imagine we find that Program A has higher job placement rates than Program B for both Arts majors and Science majors. However, when we combine the majors, Program B has a higher overall placement rate.
  >
  > **Without doing any math, what must be true about the students who chose Program A compared to Program B?**"

  **Correct Answer:** "Program A must have accepted/recruited a much higher proportion of the 'harder-to-place' major (e.g., Arts) than Program B did."
  **Why this works:** It tests if they understand the *mechanism* (unequal weights/composition) rather than just memorizing that "subgroups > aggregate."

  ---

  ### 5. What to Leave Out (and Say So)
  You must explicitly tell them what you are omitting to prevent them from thinking this is the whole picture.

  **Say this in class:**
  > "I am leaving out the formal tools causal inference experts use, like Directed Acyclic Graphs (DAGs). I am also leaving out the mathematical conditions for when aggregation is safe. I am doing this because those tools require more probability theory than we have. But you need to know one vocabulary word that bridges this gap."

  **The Minimal Causal Vocabulary:**
  *   **Confounding Variable (or Lurking Variable):** You must define this. It is the variable (e.g., Disease Severity) that influences *both* the group assignment (which drug they get) and the outcome (recovery).
  *   **Why it's needed:** Without this term, students cannot distinguish between a "meaningful" subgroup (Severity) and a "noise" subgroup (Day of the Week). If they don't have this word, they will systematically pick the wrong table to trust in future courses.

  ---

  ### 6. Settled vs. Contested
  You must distinguish between the arithmetic fact and the interpretive debate. Social science majors need to know that data does not speak for itself.

  **Settled (Present as Fact):**
  *   **The Arithmetic:** The reversal is mathematically inevitable given the weights. It is not a paradox in the logical sense; it is a property of weighted averages.
  *   **The Possibility:** This can happen in real data. It is not a theoretical curiosity.

  **Contested (Present as Debate/Context):**
  *   **The Resolution:** Whether you should trust the aggregate or the stratified table is **not** determined by the statistics. It is determined by your causal assumptions about the world.
      *   *Example:* In the Berkeley admissions case, some argue the stratified table (by department) is the truth (no bias). Others argue the aggregate is the truth (systemic bias in which departments women apply to). The numbers alone cannot solve this.
  *   **The Name:** Many statisticians hate the word "Paradox." They prefer "Simpson's Reversal" or "Amalgamation Paradox." Tell them: "Some professors will tell you this isn't a paradox at all, just bad summarization. They are arguing about semantics, but the math is the same."

  **Summary Instruction for the TA:**
  Teach the **math** as settled law. Teach the **interpretation** as a causal question that statistics alone cannot answer. This protects you from presenting a contested framing as consensus while giving them the tools to spot the issue.
