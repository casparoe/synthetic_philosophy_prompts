answer: |-
  # ADVERSARIAL COLLABORATION STATEMENT: THE MORAL STATUS OF COMBATANTS

  **Participants:** 
  *   **Traditionalist (T):** Defender of the Moral Equality of Combatants (Walzerian).
  *   **Revisionist (R):** Defender of the Asymmetry Thesis (McMahan-style).

  **Date:** October 26, 2023
  **Subject:** Residual Disagreements on *Jus in Bello* and Combatant Liability

  ---

  ### 1. SUBSTANTIVE AGREEMENTS
  *We affirm the following claims as shared premises. These are not merely definitional but represent points where our theories converge despite foundational differences.*

  1.  **Non-Combatant Immunity is Absolute:** Regardless of the justice of the cause (*ad bellum*), intentional targeting of civilians is morally prohibited. Neither side's theory grants combatants a license to kill non-combatants to achieve military objectives.
  2.  **The *Ad Bellum* Distinction Matters:** We agree that there is a moral difference between fighting a war of aggression and fighting a war of self-defense. The disagreement is not about whether unjust wars are bad, but whether that badness transfers to the individual soldiers' *in bello* permissions.
  3.  **Epistemic Limitations are Real:** We agree that individual soldiers often lack access to the classified intelligence, historical context, or legal analysis required to definitively judge the justice of their nation's cause.
  4.  **Convention has Pragmatic Value:** We agree that the existing Geneva Conventions and the Traditionalist framework serve a vital function in limiting the horrors of war, even if one of us believes that framework is morally false at the foundational level.
  5.  **Torture and Malum in Se Acts are Forbidden:** There are certain methods of warfare (torture, biological weapons, rape) that remain prohibited even for combatants fighting a just cause. *Jus in bello* constraints bind the Just Combatant as well as the Unjust Combatant.

  ---

  ### 2. DISAGREEMENTS TABLE
  *The following claims represent the core divergence. Each statement is phrased as the respective party intends it to be understood.*

  | **Traditionalist (T) Position** | **Revisionist (R) Position** |
  | :--- | :--- |
  | **On Moral Parity:**<br>Combatants on both sides possess the **same moral liberty** to use lethal force against one another, provided they obey *in bello* rules. An Unjust Combatant does not wrong a Just Combatant by killing them in battle. | **On Moral Parity:**<br>Combatants on opposite sides possess **asymmetric moral liberties**. A Just Combatant may kill an Unjust Combatant (who is liable), but an Unjust Combatant acts impermissibly (though perhaps excusably) by killing a Just Combatant (who is not liable). |
  | **On the Source of Liability:**<br>Liability to attack arises from **status and threat**. By donning the uniform and posing a threat, a soldier becomes a legitimate target regardless of the political cause they serve. | **On the Source of Liability:**<br>Liability to attack arises from **moral responsibility for unjust harm**. A soldier is only a legitimate target if they are objectively contributing to an unjust threat. |
  | **On Epistemic Burden:**<br>Because soldiers cannot reasonably be expected to adjudicate national policy, morality must treat them as **blameless instruments**. To demand otherwise is to demand the impossible and destabilize the war convention. | **On Epistemic Burden:**<br>Moral truth is **objective**. While a soldier may be *blameless* due to ignorance, the *victim* does not lose their right to life merely because the killer is reasonably mistaken. Liability tracks facts, not beliefs. |
  | **On the Function of Theory:**<br>Just War Theory is primarily a **guide for action** under conditions of uncertainty. It must tell soldiers what they may do *now*, not what a god's-eye view would judge later. | **On the Function of Theory:**<br>Just War Theory is primarily an account of **moral rights and duties**. It must accurately describe who is wronged and who is liable, even if that description is too complex for soldiers to apply in real-time. |

  ---

  ### 3. CRUXES
  *These are specific sub-questions where resolution would force a significant update in at least one party's position. We have identified concrete cases to test these cruxes and recorded our predictions regarding the intuitive verdicts.*

  **Crux A: The Objectivity of Liability**
  *   **Sub-Question:** Is a combatant's liability to be killed determined by the **objective facts** of the war's justice, or by the **subjective reasonable beliefs** of the combatant?
  *   **Concrete Case:** *The Reasonable Aggressor.* A soldier fights for a nation that is objectively aggressing, but the government has successfully concealed all evidence of aggression. The soldier possesses all available evidence and reasonably believes they are defending their homeland.
  *   **Prediction (T):** Our intuitions will confirm the soldier is **not liable**. If they are reasonable, they retain the moral equality of combatants.
  *   **Prediction (R):** Our intuitions will confirm the soldier is **liable** (objectively), though perhaps not *blameworthy*. The Just defender does not wrong the Aggressor by killing them, even if the Aggressor didn't know better.
  *   **Stakes:** If R concedes liability is belief-relative, the Asymmetry Thesis collapses. If T concedes liability is objective, MEC (Moral Equality of Combatants) collapses.

  **Crux B: Marginal Contribution and Conscription**
  *   **Sub-Question:** Does a **marginal causal contribution** to an unjust war generate sufficient liability to make a combatant permissible to kill, specifically when that contribution is identical to civilian labor?
  *   **Concrete Case:** *The Conscript Driver.* An unjust army conscripts a civilian to drive a supply truck to the front lines. He carries no weapon. He is wearing a uniform. A Just Combatant encounters him behind the lines.
  *   **Prediction (T):** Our intuitions will confirm the driver is **protected** or nearly equal in status to a civilian. Killing him is disproportionate or impermissible because his threat is too remote/coerced.
  *   **Prediction (R):** Our intuitions will confirm the driver is **liable** to defensive harm (though perhaps lesser harm) because he is objectively sustaining the unjust threat, distinguishing him from a civilian who pays taxes.
  *   **Stakes:** If T agrees the driver is liable, they must accept a gradient of combatant status (undermining strict MEC). If R agrees the driver is immune, they must accept a threshold of contribution that looks suspiciously like the Traditionalist "uniformed combatant" line.

  **Crux C: The "Fog of War" Constraint**
  *   **Sub-Question:** Should a moral theory prescribe rules that are **impossible to follow** in the fog of war if those rules represent the deeper moral truth?
  *   **Concrete Argument:** *The Demand Impossibility Objection.* If Revisionism is true, soldiers must assess *ad bellum* justice before firing. Since they cannot do this, Revisionism demands the impossible.
  *   **Prediction (T):** A theory that demands the impossible is **practically useless** and morally dangerous. We will agree that "ought implies can" forces us back to Traditionalism for *in bello* rules.
  *   **Prediction (R):** A theory that is false is **morally dangerous** regardless of utility. We will agree that deep morality must remain objective, even if we need a separate "code of conduct" for soldiers to follow in the fog.
  *   **Stakes:** This determines whether we are building a *Guide for Soldiers* (T) or a *Theory of Justice* (R).

  ---

  ### 4. NOTE ON VERBAL DISPUTES
  *We acknowledge that a portion of our disagreement stems from terminological equivocation. Clarifying these terms will not resolve the substantive moral conflict, but it will prevent us from talking past one another.*

  1.  **"Permissible":** 
      *   **T** often uses "permissible" to mean *blameless given the available evidence and convention*. 
      *   **R** uses "permissible" to mean *objectively justified by the facts on the ground*. 
      *   *Resolution:* We will distinguish between **Subjective Permission** (excusable/blameless) and **Objective Permission** (liability of the target). T agrees Unjust Combatants may have Subjective Permission; R agrees Just Combatants have Objective Permission. The fight is over whether Unjust Combatants have Objective Permission.

  2.  **"Combatant":** 
      *   **T** defines combatant legally/functionally (wears uniform, carries arms, part of chain of command). 
      *   **R** defines combatant morally (someone liable to attack). 
      *   *Resolution:* We will use **"Legal Combatant"** for the Walzerian definition and **"Liable Agent"** for the Revisionist definition. This prevents confusion when discussing civilians who directly participate in hostilities.

  3.  **"Morality":** 
      *   **T** sometimes argues from the morality of **institutions and conventions** (what rules should we promulgate?). 
      *   **R** argues from the morality of **individual interactions** (what rights does this specific person have?). 
      *   *Resolution:* We acknowledge we are sometimes debating different levels of moral analysis. The crux is whether the individual level overrides the institutional level in *in bello* judgments.
