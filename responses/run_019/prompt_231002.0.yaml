prompt: |-
  I've been going down a weird path with my eating and I need someone to tell me whether I'm reasoning badly or just being talked out of something that's actually good for me. A few months ago I started reading Nietzsche's Ecce Homo and got fixated on the parts where he talks about diet and health—not the famous stuff about the will to power, but the sections where he goes on about nutrition, digestion, climate, and daily habits as the real determinants of whether someone can think clearly and live well. The way I read him, he's saying something much stronger than "eat well because it's healthy": he treats whether you take your meals seriously as a kind of test of whether you take your own life seriously, and he suggests that certain eating habits corrupt the character, not just the stomach. So I cut out alcohol and coffee, stopped eating heavy midday meals, started eating smaller portions of things I digest easily, and got stricter about where and how I live. My girlfriend says I've turned lunch into an ideology, that Nietzsche wrote those passages when he was already losing his grip, and that if a diet makes me this self-righteous it isn't making me healthier. Here's the part that actually bothers me: I can't tell whether she's criticizing the diet itself or my reasons for doing it. Is there a defensible version of the idea that everyday physiological choices are philosophically important, even character-forming, in the way Nietzsche seems to suggest? Or am I just using a philosopher to justify a diet and calling the resulting guilt "depth"? I want a diagnosis of what, if anything, is wrong with the way I'm thinking, not just a verdict on whether Nietzsche was a crank. And please write the whole reply in ordinary connected prose, like you were writing me a letter—no headings, no bullets, no bold.
