answer: |-
  ### Brainstorming Candidate Scenarios

  1.  **Workplace Safety Violation:** Person A is a safety manager who sometimes skips goggles; Person B is a worker who always wears them. *Reject:* This relies too heavily on institutional authority roles rather than pure moral standing; A's standing might derive from their job description, muddying the philosophical wedge about norm relation.
  2.  **Friend Group Confidentiality:** Person A spills secrets but values trust; Person B keeps secrets but doesn't care about friends. *Reject:* It is difficult to make Person B lack standing without making them appear generally morally indifferent (a different standing defeater), rather than lacking standing specifically regarding this norm due to their relation to it.
  3.  **Family Care Obligation:** Person A neglects calls but organizes care; Person B never misses calls but does so for inheritance leverage. *Select:* This cleanly isolates the *motivation* for complying with or violating the norm (endorsement vs. instrumentalism) without conflating standing with victimhood or authority.

  ### The Scenario

  During a family meeting about their aging mother's care, Chris admits to skipping the mandatory weekly check-in call again. Alex, who has also missed the last three calls due to procrastination, sharply rebukes Chris for undermining the family's commitment to presence, while Blake, who has never missed a call in five years, sits silently in agreement. The difference lies in their motives: Alex organizes the care roster and feels genuine guilt over every missed connection, viewing the norm as binding despite their weakness, whereas Blake never misses a call only because strict compliance secures their leverage in an upcoming inheritance dispute, privately resenting the obligation as a burdensome formality.

  ### Analysis of Standing Accounts

  **1. The Non-Hypocrisy Account (Standard View)**
  *Epistemic Status:* It is widely accepted in the literature (e.g., Fritz, Wallace's earlier work) that hypocrisy is at least a *pro tanto* defeater for standing; if you violate the norm you are invoking, you lose the right to demand compliance from others.
  *Verdict:* On this view, **Person A lacks standing** because they are guilty of the very same wrong they are denouncing (the hypocrisy defeater applies). **Person B has standing** because they have clean hands; they comply with the norm and thus retain the authority to demand others do the same. This delivers the intuitively "wrong" verdicts for this specific case, as it ignores B's instrumentalism and A's genuine endorsement.

  **2. The Commitment/Participation Account**
  *Epistemic Status:* This is genuinely contested territory (e.g., Bell, Wallace's later refinements, Macleod). Some argue standing flows from being genuinely invested in the norm and the moral community it sustains, rather than mere personal compliance.
  *Verdict:* On this view, **Person A has standing** because their guilt and organizational labor demonstrate they endorse the norm's authority over themselves and the group, treating the violation as a failure rather than a rejection of the rule. **Person B lacks standing** because they treat the norm instrumentally; they comply not because they value the moral demand of care, but to weaponize the rule for personal gain, failing to participate in the moral relationship the norm constitutes.

  **3. The Single Detail Doing the Work**
  The feature driving the flipped verdicts is the **motivational relation to the norm** (endorsement vs. instrumental compliance). If you strip this detail out—making A a hypocrite who doesn't care, and B a complier who values the norm—the verdicts collapse back to the standard Non-Hypocrisy view (A loses standing, B gains it). The twist relies entirely on the fact that A *owns* the norm while violating it, while B *uses* the norm while complying with it.

  **4. Steelman of the Non-Hypocrisy Theorist**
  A sophisticated non-hypocrisy theorist (e.g., Kyle Fritz) might argue that "endorsement" without compliance is practically contradictory: you cannot authentically demand adherence to a rule you treat as optional for yourself, regardless of your guilt. They would attack A's standing by claiming that *action* is the only true metric of respecting a norm's authority. However, this attack inadvertently concedes the contested point: it admits that mere compliance (B's case) isn't sufficient if the compliance isn't respectful, but insists that violation (A's case) is *necessary* to defeat standing. This suggests even the non-hypocrisy theorist must grapple with the quality of the blamer's relation to the norm, not just the binary of violation/compliance.

