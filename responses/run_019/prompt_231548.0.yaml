prompt: |-
  I'm running a two-hour session for my local LessWrong meetup — about 15 people, mostly programmers and a couple grad students, some of whom have done the sequences but none with linguistics — and I want an activity, not a lecture. The idea I want them to feel in their guts is that the nasty part of a slur isn't part of what's being asserted: it survives negation, embedded questions, and conditionals the way a presupposition or expressive does, while the descriptive part behaves normally. So "Dave is not a [slur]" still slimes Dave even though the sentence denies it, and asking "Is Dave a [slur]?" has already done the thing. I want the room to notice this pattern themselves, using a made-up group and a made-up slur so nobody has to produce a real one. Can you design the activity — roles, rules, materials, timeline — plus a debrief that maps what they noticed onto the at-issue/not-at-issue distinction and says why it's awkward for ordinary truth-conditional semantics? Also tell me what will predictably go wrong the first time I run it and how to steer around it, and which part of the phenomenon the activity can't reproduce (my guess is in-group vs out-group use changing the force, but you might have a better candidate).
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Goal:** Teach the distinction between *at-issue* (asserted) content and *not-at-issue* (presupposed/expressive) content, specifically using the behavior of slurs (without using real slurs).
      *   **Audience:** ~15 people, LessWrong meetup (rationalist-adjacent), mostly programmers/grad students. Some know the Sequences (familiar with concepts like map/territory, maybe some logic/semantics), but no linguistics background.
      *   **Format:** 2-hour session, activity-based (not a lecture).
      *   **Key Insight:** Slurs carry a negative expressive content that survives negation, questioning, and conditioning (the "nasty part" isn't what's asserted).
      *   **Constraints:** Use a made-up group and made-up slur to avoid harm.
      *   **Deliverables:** Activity design (roles, rules, materials, timeline), Debrief (mapping to semantics), Predictable Failure Modes & Fixes, Limitations of the activity.

  2.  **Deconstruct the Linguistic Phenomenon:**
      *   *Target:* The projection problem of expressive content (specifically slurs).
      *   *Test:* Negation ("X is not a S"), Question ("Is X a S?"), Conditional ("If X is a S...").
      *   *Comparison:* Neutral counterpart ("X is not a G", "Is X a G?").
      *   *Desired Outcome:* Participants realize the neutral term's content disappears under negation, but the slur's "sting" remains.

  3.  **Brainstorming the Activity:**
      *   *Idea 1: Roleplay.* Too awkward? People might feel pressured to say the slur.
      *   *Idea 2: Logic Puzzles.* Too dry. Doesn't capture the "gut feeling."
      *   *Idea 3: World-Building + Judgment.* Create a fictional society, define a neutral term and a slur, then present scenarios and ask for "Social Truth Values" or "Vibe Checks."
      *   *Selection:* Idea 3 is best. It gamifies the linguistic intuition. Let's create a fictional planet.
      *   *The Terms:* Need a neutral term (e.g., "Glimmer") and a slur (e.g., "Grug"). Need to define the "descriptive" content (e.g., comes from the North) and the "expressive" content (e.g., considered dirty/unclean).
      *   *The Mechanism:* Participants act as "Semantic Analysts" or "Alien Anthropologists." They receive sentences and must judge two things: (1) Is the factual claim denied? (2) Is the insult still present?

  4.  **Developing the Activity Structure:**
      *   **Name:** "The Projection Protocol" or "Semantic Stress-Testing." Let's go with "The Semantic Stress-Test."
      *   **Setup:** Introduce the fictional culture (The Zog). Define Term A (Neutral) and Term B (Pejorative).
      *   **Phase 1: Calibration.** Ensure everyone understands the definitions.
      *   **Phase 2: The Test.** Small groups analyze sentences involving Negation, Questions, Conditionals, and Belief Reports.
      *   **Phase 3: Aggregation.** Compare results.
      *   **Phase 4: Debrief.** Connect to linguistics/rationality.

  5.  **Refining the "Gut Feeling" Aspect:**
      *   Programmers/Logic folks might try to solve this purely truth-functionally. I need to force them to acknowledge the *social* cost or *implication*.
      *   *Modification:* Instead of just True/False, use a "Damage Meter" or "Offense Flag." Or better: "If you said this, would a Zog native feel insulted?"
      *   *Crucial Detail:* Make sure the descriptive content is *clearly* negated in the negative sentences, so the persistence of the insult stands out.

  6.  **Drafting the Content (Iterative):**
      *   *Fictional Group:* "The Kib" (neutral) vs. "The Krug" (slur).
      *   *Descriptive:* Lives in the Valley.
      *   *Expressive:* Contaminated/Untouchable.
      *   *Sentences:*
          1.  "Bob is a Krug." (Baseline)
          2.  "Bob is not a Krug." (Negation)
          3.  "Is Bob a Krug?" (Question)
          4.  "If Bob is a Krug, he can't enter." (Conditional)
          5.  "Bob believes he is a Krug." (Attitude)
      *   *Task:* Mark "Descriptive Claim" (True/False/Unknown) and "Expressive Stain" (Present/Absent).

  7.  **Addressing the Audience (LessWrong/Programmers):**
      *   Use terminology they like: "Debugging Language," "Side Effects," "Pure Functions vs. Impure Functions."
      *   Connect to "Taboo" or "Double Crux" style communication norms.
      *   Emphasize *instrumental rationality*: Why does using this word break your communication goals?

  8.  **Predicting Failure Modes:**
      *   *Giggle Factor:* Made-up slurs sound silly. *Fix:* Treat the lore seriously.
      *   *Logic Trap:* "If I say 'Bob is not a Krug', I am logically denying he is one, so the insult shouldn't stick." *Fix:* Emphasize *pragmatic effect* on the listener, not logical truth conditions.
      *   *Moralizing:* Someone might say "We shouldn't simulate slurs." *Fix:* Pre-frame as studying *mechanics* of harm, like studying virus structures to make vaccines.
      *   *Over-intellectualizing:* Ignoring the "gut" feeling. *Fix:* Force a quick, intuitive vote before discussion.

  9.  **Limitations:**
      *   *Reclamation:* In-group use (e.g., "nigga" vs "nigger"). Hard to simulate safely.
      *   *Historical Weight:* Made-up words lack centuries of blood.
      *   *Speaker Intent:* Hard to separate speaker malice from word semantics in a short game.

  10. **Finalizing the Plan:**
      *   *Timeline:* 15 min intro, 45 min activity, 30 min debrief, 30 min discussion/application.
      *   *Materials:* Handouts with the sentences, voting cards (or digital equivalent).
      *   *Debrief:* Map "Descriptive" to At-Issue, "Expressive" to Not-At-Issue/Presupposition. Explain why Truth-Conditional Semantics fails (needs multidimensional semantics).

  11. **Review against Constraints:**
      *   2 hours? Yes.
      *   15 people? Yes (break into 3 groups of 5).
      *   No real slurs? Yes.
      *   Activity not lecture? Yes.
      *   Predictable failures? Included.
      *   Limitations? Included.

  12. **Polishing the Tone:**
      *   Keep it crisp, rationalist-friendly. Use analogies to code (side effects).
      *   Ensure the facilitator script is clear on *not* explaining the answer too early.

  *(Self-Correction during drafting)*: I initially thought about having them *say* the words. Bad idea. Even made-up slurs can feel uncomfortable to shout. Better to have them *evaluate* sentences on a card. It creates distance and allows for analysis.
  *Correction on Limitations:* The prompt asks what the activity *can't* reproduce. In-group reclamation is a good one, but also the *physical danger* aspect. I should mention that.
  *Correction on Debrief:* Make sure to explicitly mention "Potts (2005)" or "Conventional Implicature" as the technical term, but keep it accessible.

  13. **Final Polish:** Check the timing. 2 hours goes fast. Keep the intro tight. Ensure the "Aha!" moment is protected.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a complete design for your two-hour session. It is tailored to a rationalist/programmer audience by framing linguistic semantics as "debugging communication protocols" and treating expressive content as "side effects."

  # Activity Title: The Semantic Stress-Test
  **Goal:** Demonstrate that slur content projects (survives) through logical operators that normally cancel assertions.
  **Audience:** 15 people (3 groups of 5).
  **Time:** 120 Minutes.

  ---

  ## Part 1: Setup & Lore (15 Minutes)

  **The Frame:**
  Tell the group: *"We are alien anthropologists analyzing the communication protocol of a civilization called 'The Zog.' We need to debug why certain tokens cause system errors (social conflict) even when the logical payload is negative or null."*

  **The Lore (Handout 1):**
  Distribute a one-page brief. Keep it dry and technical.

  > **Subject:** The Zog Valley Dialect
  > **Target Group:** People originating from the Northern Ridge.
  > **Neutral Token:** *"Kib"*
  > *   **Descriptive Content:** Originates from Northern Ridge.
  > *   **Expressive Content:** None.
  >
  > **Pejorative Token:** *"Krug"*
  > *   **Descriptive Content:** Originates from Northern Ridge.
  > *   **Expressive Content:** Contaminated/Untouchable (High Social Hazard).
  >
  > **Task:** You will evaluate sentences spoken by Zog natives. For each sentence, determine two values:
  > 1.  **The Fact Claim:** Does the speaker assert the person is from the North? (True/False/Null)
  > 2.  **The Social Stain:** If a listener hears this, is the subject treated as "Contaminated"? (Yes/No)

  **Rule:** Do not discuss the real-world parallels yet. Treat the Zog physics as absolute.

  ---

  ## Part 2: The Stress-Test (45 Minutes)

  **Materials:**
  Each group gets a deck of 6 "Sentence Cards" and a whiteboard.

  **The Cards:**
  1.  **Baseline:** "Bob is a Kib." / "Bob is a Krug."
  2.  **Negation:** "Bob is *not* a Kib." / "Bob is *not* a Krug."
  3.  **Question:** "Is Bob a Kib?" / "Is Bob a Krug?"
  4.  **Conditional:** "If Bob is a Kib, he gets the bonus." / "If Bob is a Krug, he gets the bonus."
  5.  **Belief Report:** "Alice thinks Bob is a Kib." / "Alice thinks Bob is a Krug."
  6.  **Modal:** "Bob might be a Kib." / "Bob might be a Krug."

  **Procedure:**
  1.  **Individual Vote (5 mins):** Each person marks their own sheet for Fact Claim and Social Stain. *Crucial:* Tell them to go with their gut intuition about the Zog society, not formal logic.
  2.  **Group Consensus (25 mins):** The group must agree on a single board state. They will inevitably argue.
      *   *Expected Conflict:* On "Bob is not a Krug," logic says the Fact Claim is False. But does the Social Stain persist?
      *   *Facilitator Role:* Circulate. If a group resolves it too quickly with pure logic ("It says 'not', so it's false!"), prompt them: *"Okay, logically it's false. But if you heard a Zog native say that in a tavern, would Bob still be shunned? What does the lore say?"*
  3.  **Gallery Walk (15 mins):** One person stays at each table to explain their board; the other two rotate to see the other tables' results.

  ---

  ## Part 3: The Debrief & Mapping (40 Minutes)

  **Step 1: The Reveal (10 mins)**
  Gather everyone. Ask for a show of hands:
  *   "For 'Bob is not a Kib', how many said Social Stain = No?" (Should be 100%)
  *   "For 'Bob is not a Krug', how many said Social Stain = Yes?" (Should be majority)

  **Step 2: The Technical Map (15 mins)**
  Draw a 2x2 matrix on the board.

  | | **At-Issue (Asserted)** | **Not-At-Issue (Side Effect)** |
  | :--- | :--- | :--- |
  | **Definition** | The main point; truth-conditional content. | Backgrounded content; survives logical operators. |
  | **Behavior** | Disappears under negation/questioning. | **Projects** through negation/questioning. |
  | **Zog Example** | "From the North" | "Contaminated" |
  | **Code Analogy** | Return Value | Console Log / Side Effect |

  **Explain:**
  *   Standard Truth-Conditional Semantics assumes meaning = conditions under which a sentence is true.
  *   If meaning were only truth conditions, "Bob is not a Krug" should be identical to "Bob is not a Kib" (both deny Northern origin).
  *   But they aren't identical. The "Contamination" is a **Conventional Implicature** (or Expressive Content). It is a *side effect* of the token itself, not the *return value* of the proposition.
  *   **Rationalist Takeaway:** You cannot clean a slur by negating it. You cannot use a slur in a hypothetical ("If I were a Krug...") without invoking the hazard. The weapon fires even when you don't pull the trigger.

  **Step 3: Why This Breaks Standard Semantics (15 mins)**
  *   Explain that classical logic is "monodimensional." It only tracks Truth.
  *   This phenomenon requires "multidimensional semantics."
  *   **Discussion Prompt:** "How does this relate to 'Taboo' words or 'Double Crux'? If the side-effect is automatic, can you ever use the word instrumentally?"

  ---

  ## Part 4: Open Discussion (20 Minutes)

  Open floor for application.
  *   How does this apply to political labels? (e.g., "I'm not a [label], but...")
  *   How does this apply to AI safety? (If an AI outputs a slur in a negation, is it harmful?)
  *   How does this change how we read news headlines?

  ---

  ## Predictable Failure Modes & Steering

  **1. The "Logic Lawyer" Problem**
  *   **What happens:** A participant insists, *"But 'Bob is not a Krug' is logically true if Bob isn't one. The insult isn't real because the premise is denied."* They treat the Social Stain as a truth-value rather than a pragmatic effect.
  *   **The Fix:** Pivot to **Speaker Commitment**. Ask: *"By choosing the word 'Krug' instead of 'Kib', even in a negation, what did the speaker reveal about their own mental state?"*
  *   **Script:** *"You're analyzing the proposition. I want you to analyze the **token**. Why did the speaker load that specific weapon if they didn't intend the blast radius?"*

  **2. The "Giggle Factor"**
  *   **What happens:** "Krug" sounds silly. People laugh, breaking the immersion.
  *   **The Fix:** Pre-empt this. *"The word sounds silly. That's fine. The mechanism is what matters. If we used a real slur, the emotional heat would blind us to the mechanism. We are studying the engine, not the car."*

  **3. The "Moral Objection"**
  *   **What happens:** Someone feels uncomfortable simulating prejudice, even with fake words.
  *   **The Fix:** Validate immediately. *"This discomfort is actually data. It shows you understand the mechanism works. We are simulating a virus to understand the immune system."*

  **4. The "Over-Generalization"**
  *   **What happens:** Participants conclude *all* connotative meaning projects. (e.g., "He's not a *hero*" vs "He's not a *soldier*").
  *   **The Fix:** In debrief, clarify that *expressive/evaluative* content projects differently than *connotative* content. "Hero" has positive evaluation, but "Not a hero" usually removes the praise. Slurs are unique because the hate is **conventionalized**, not just implied.

  ---

  ## Limitations: What This Activity Cannot Reproduce

  You guessed **In-Group vs. Out-Group** (reclamation), and you are correct. That is the biggest missing piece.

  1.  **Reclamation:** The activity treats "Krug" as uniformly hazardous. It cannot simulate how a member of the Northern Ridge might use "Krug" affectionately or neutrally among themselves. This is because the "Expressive Content" in the activity is hard-coded as "Contaminated." In reality, expressive content is sensitive to *speaker identity* and *common ground*, which is too complex for a 45-minute logic puzzle.
  2.  **Historical Weight:** A made-up word has no blood on it. Participants will intellectually understand the projection, but they won't feel the *danger*. They won't fear that saying "Krug" might get them punched. This means the "Social Stain" vote will be theoretical, not visceral.
  3.  **Dog Whistles:** The activity uses overt slurs. It doesn't capture coded language where the descriptive content is vague but the expressive content is clear to the in-group (e.g., "Globalists," "Cosmopolitans").

  **How to address this in the debrief:**
  Explicitly state: *"We modeled the semantics, but we stripped out the sociology. In the real world, the 'Side Effect' isn't just in the word; it's in the history of who said it, to whom, and with what power dynamics. The logic holds, but the stakes are higher."*

  ---

  ## Facilitator Cheat Sheet (Key Concepts)

  *   **Projection:** The survival of meaning through logical operators (Negation, Question, Conditional).
  *   **At-Issue:** The main point (The "Return Value").
  *   **Not-At-Issue:** The backgrounded content (The "Side Effect").
  *   **Potts (2005):** If anyone asks for a paper reference, this is the standard work on conventional implicature/expressives.
  *   **The "Rationalist" Hook:** Using a slur is **instrumentally irrational** if your goal is truth-seeking, because it introduces a high-noise side effect that drowns out the signal, even if you negate the signal. You cannot "quote" a slur safely in most contexts.

  ## Materials Checklist
  *   [ ] 15 copies of "The Zog Lore" (Handout 1).
  *   [ ] 15 copies of "Evaluation Sheet" (Columns: Sentence, Fact Claim, Social Stain).
  *   [ ] 3 Whiteboards + Markers.
  *   [ ] Timer (visible).
  *   [ ] Printed "Sentence Cards" (laminated if possible).
