prompt: |-
  I write firmware and compiler internals for a living, so I live in opcodes, symbol tables, serialization formats, error-correcting codes, and the rule that a bit pattern means nothing until a decoder interprets it. I keep running into the philosophy-of-biology argument over whether DNA is literally a code, and to me it sounds like a non-problem: codon-to-amino-acid is just a lookup table, tRNA is just the decoder, and if the mapping is arbitrary rather than physically necessary that makes it more code-like, not less. But aparently the other side says DNA is not a code in the way ASCII or machine code is, because nothing in the cell assigns semantics to the sequence, or because the decoder is itself specified by the sequence, or something like that.

  Restate that whole debate in my vocabulary as faithfully as you can: encoders and decoders, instruction sets, lookup tables, bootstrapping and self-hosting compilers, symbol resolution, lossless vs lossy mappings — whatever actually fits. Don't fall back on vague talk about 'information'. Then give me the residue report: which claims from each side map cleanly onto things I reason about every day, which ones you had to bend to fit, and which ones have no counterpart at all in my vocabulary. Is there a real point on the 'DNA is not literally a code' side that my vocabulary can't express? And if so, is that because software talk is missing a concept, or because their point only looks deep until you translate it? I want to know whether my it's-just-a-lookup-table intuition survives.
