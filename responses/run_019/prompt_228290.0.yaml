prompt: |-
  I am a retired experimental physicist who has recently begun reading philosophy, and I keep running into dialetheism -- the claim that some contradictions are true -- together with the paraconsistent logics developed to tolerate such contradictions without collapsing into triviality. I would like this material restated in the vocabulary I actually command: measurement under uncertainty, conflicting datasets, systematic versus statistical error, model selection, and the question of when an inconsistency in one's data warrants rejecting a theory versus merely quarantining a result. Please translate as precisely as you can: the liar-paradox motivation for true contradictions, the classical principle of explosion, and the paraconsistent strategy of refusing to let one inconsistency license every conclusion. Then give me a residue report: which parts of the dialetheist position map cleanly onto how working scientists handle contradictory evidence, which parts you had to distort to fit, and which parts -- I suspect the self-referential, semantic core is one -- have no counterpart in laboratory practice at all. I want to know whether my instinct that the dialetheist is just rediscovering how we already manage inconsistent data is correct, or whether it misses what the debate is actually about. Finally, please distinguish clearly between what is settled technical fact (e.g., what paraconsistent logics provably do) and what remains genuinely contested among logicians and philosophers, rather than presenting any contested thesis as consensus.
