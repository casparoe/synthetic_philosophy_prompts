      *   **SSA:** You should reason as if you are a random sample from a reference class of observers. Problem: How to define the reference class? (e.g., humans, conscious beings, observers in this century, etc.).
      *   **The Presumptuous Philosopher (PP):** A thought experiment (by Bostrom) where SIA implies we can know a priori that the universe is huge (infinite observers) just because we exist, ruling out small universe theories even if they are empirically identical otherwise.
