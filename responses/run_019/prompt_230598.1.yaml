      *Final check on the "Hate" case:* If I tell judges to apply a law that allows eviction without a hearing, they might feel they are violating due process. I need to ensure the procedure explains *why* it's still "Law" (e.g., property rights vs. procedural due process, or the threshold for "non-law" is extreme injustice like torture, not just unfair civil procedure). This distinction is vital for their reasoning.

