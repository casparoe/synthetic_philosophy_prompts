      *   Reusable procedure? Yes.
      *   Ordered questions? Yes.
      *   Good enough answers? Yes.
      *   Stop points? Yes.
      *   Handoff to values? Yes.
      *   Three cases run? Yes.
      *   One result judges hate? Yes (Case 3).
      *   What it cannot settle? Yes.
      *   Tone: Professional, judicial, practical.

  8.  **Self-Correction on Case 3:**
      *   The prompt says "current, procedurally valid statute." If it violates the *current* Constitution (no hearing = due process violation), a normal court would strike it down on constitutional grounds. To make this a "Wicked Law" problem, I must assume either: (a) The Constitution allows it (emergency powers?), or (b) The judges don't have strong judicial review powers over current legislation, only over old regime legacy.
      *   *Better angle:* The prompt asks about treating a rule "as law." In many civil law systems, judges can't strike down statutes, only interpret them. Or, in transitional contexts, there's a specific "Legacy Law Review" mechanism.
      *   *Adjustment:* I will frame the procedure as applicable to *legacy* laws primarily, but extendable to current laws only in extreme "crimes against humanity" scenarios. For Case 3, since it's current and procedural (eviction), it likely doesn't meet the "extreme injustice" threshold of the Radbruch formula (which is reserved for things like Nazi racial laws). Thus, it remains "Law," and the judge must apply it, perhaps noting the need for legislative change. This is the "hate" result: You are a judge, not a legislator.

      *Wait, one nuance:* The prompt asks for a procedure to decide whether to treat a rule *as law*. If the answer is "No," they disregard it. If "Yes," they apply it.
      *   Case 1 (Denunciation): "No" (Disregard).
      *   Case 2 (Tax): "Yes" (Apply).
      *   Case 3 (Eviction): "Yes" (Apply).
      *   Why will they hate Case 3? Because it feels like the old regime's tactics (eviction without hearing). But because it's *current* and *procedural/property* based, it doesn't hit the "Human Dignity/Torture" threshold required to nullify a statute. This teaches them that the "Wicked Law" exception is narrow.

      *Let's sharpen the "Hate" result.* Maybe Case 2 (Tax) is the hate one? No, tax is boring. Case 3 is better. Judges want to protect tenants. Telling them "This is valid law, evict them" is hard.
      *   Actually, a better "Hate" result might be Case 1. If the procedure is too strict, they might have to apply the denunciation law. But the prompt implies they *should* be able to reject these. The prompt says "What they're really asking is whether a rule can be too wicked to be law." The expectation in transitional justice is usually *yes*. So Case 1 should result in "Not Law."
      *   So Case 3 must be the "Is Law" result that they dislike.

      *Wait, I need to make sure the procedure distinguishes between Old and New laws.* The Radbruch formula is historically applied to *past* regimes. Applying it to *current* laws is judicial activism. The procedure needs to account for this. If it's a current law, the threshold for "Not Law" should be impossibly high (only crimes against humanity), whereas for old regime laws, it might be lower (systemic oppression).
      *   *Decision:* I will build a "Source Check" into Step 1. Old Regime vs. Current Order. This adds necessary nuance.

      *Revised Plan:*
      1.  **Source Check:** Old Regime or Current?
      2.  **Injustice Threshold:** Human Dignity/Core Rights.
