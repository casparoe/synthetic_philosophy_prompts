  1.  **Analyze the Request:**
      *   **Context:** Post-dictatorship country (less than 10 years since transition). New magistrates (judges) are struggling with "wicked laws" from the old regime that were procedurally valid but morally repugnant (e.g., denunciation statutes, retroactive security laws).
      *   **Problem:** Judges feel sick applying these laws. They are asking the Radbruch Formula question (can a rule be too wicked to be law?) without the philosophical vocabulary.
      *   **Constraints:**
          *   Reusable procedure (algorithm/checklist).
          *   Target audience: Judges working alone, no philosophical training, ~20 minutes per decision.
          *   Output: Published reasoning, subject to appeal. "It feels wrong" is insufficient.
          *   Requirements: Ordered questions, pass/fail criteria, stop points, explicit handoff to judicial discretion (values vs. facts).
          *   Test Cases: (1) Old denunciation law, (2) Petty old tax regulation, (3) Current statute allowing eviction without hearing.
          *   Constraint: At least one result must be something the judges will hate (i.e., require applying a bad law or striking down a popular one controversially).
          *   Constraint: State plainly what the procedure *cannot* settle.

  2.  **Theoretical Foundation (Hart vs. Fuller/Radbruch):**
      *   *Legal Positivism (Hart):* Law is law if it follows the rules of recognition (procedure), regardless of morality. Separation of law and morals.
      *   *Natural Law/Radbruch Formula (Fuller/Radbruch):* Extreme injustice is no law. There is a threshold where validity collapses.
      *   *The Solution:* A hybrid approach suitable for a transitional justice context. It needs to respect legal certainty (positivism) to avoid anarchy but allow for moral rejection (natural law) in extreme cases to prevent complicity in atrocities. This is often called the "Radbruch Formula" in practice, but needs to be operationalized for busy judges.

  3.  **Drafting the Procedure (The "Validity Threshold Protocol"):**
      *   *Goal:* Filter out the truly intolerable while preserving the rule of law for merely unpleasant or outdated laws.
      *   *Step 1: Procedural Validity.* (Established in the prompt, but needs confirmation).
      *   *Step 2: The "Core Rights" Test.* Does it violate fundamental human rights recognized *now* (Constitution/International Treaties)?
      *   *Step 3: The "Intent/Purpose" Test.* Was the law designed to oppress a specific group or consolidate dictatorship power, rather than serve a public good?
      *   *Step 4: The "Disproportionality" Test.* Is the harm grossly disproportionate to any conceivable state interest?
      *   *Step 5: The "Reliance/Transition" Check.* (Crucial for transitional states). Does striking it down cause chaos, or does applying it cause irreparable moral harm?
      *   *Decision Point:* If it fails Step 3 or 4 severely, it's "Non-Law." If it passes, it's "Law" (even if bad).
      *   *Handoff:* Explicitly state where the judge must make a value judgment.

      *Refining for the 20-minute constraint:* Needs to be punchy. Yes/No questions.
      *Refining for the "Hate" constraint:* One outcome needs to be uncomfortable. Usually, this means telling them they *must* apply a nasty current law (Case 3) or *must* reject an old law that provides technical certainty (Case 1). Given the context (post-dictatorship), the judges *want* to reject old wicked laws. So, making them apply a *current* wicked law (Case 3) will be the "hate" result. Or, making them uphold a petty tax law (Case 2) is boring. Let's make Case 3 the "hate" one: The procedure forces them to apply a valid current law even if it's harsh, because it doesn't meet the "extreme injustice" threshold of the old regime's crimes, highlighting the limit of judicial power. Wait, the prompt asks for a procedure to decide whether to treat a rule *as law*. If the procedure says "Yes, it is law," they must apply it. If "No," they disregard it.
      *   *Correction:* To make them hate it, the procedure should force them to *apply* a law they dislike (Case 3: Current eviction law) because it doesn't meet the "extreme injustice" threshold required to nullify a statute, OR force them to *nullify* an old law (Case 1) which creates legal uncertainty. Given the "post-dictatorship" vibe, they want to nullify the old stuff. The "hate" result should probably be Case 3: The procedure tells them the current eviction law *is* valid law and must be applied, despite their discomfort, because it doesn't cross the "Radbruch" threshold of the old regime's atrocities. This teaches humility.

  4.  **Developing the Steps (Iterative refinement):**

      *   *Q1: Procedural Pedigree.* (Given as yes in prompt, but keep as a checkpoint).
      *   *Q2: Constitutional Conflict.* Does it violate the *current* Constitution's explicit rights? (If Yes -> Invalid via standard review, not this protocol). *Wait, the prompt implies these are valid laws they are struggling with.* Let's assume standard constitutional review is either unavailable or the law technically passes it (e.g., old laws grandfathered, or current law is constitutional but unjust). Let's focus on the "Wickedness" threshold.
      *   *Revised Q1: The Injustice Threshold.* Does the rule require the judge to participate in a gross violation of human dignity (torture, arbitrary death, enslavement, targeted persecution)?
      *   *Revised Q2: The Discriminatory Intent.* Was the rule designed to target a group based on immutable characteristics or political opposition to the prior regime?
      *   *Revised Q3: The Alternative.* Can the rule be interpreted narrowly to avoid the injustice? (Statutory construction before nullification).
      *   *Decision:* If Q1 is Yes AND Q2 is Yes -> Not Law. If Q1 is No -> Is Law (even if bad).

      *Let's make it more robust for the "20 minutes" constraint.*
      *   **Step 1: The Dignity Floor.** Does applying this rule require you to directly violate a fundamental human right recognized by international law (e.g., right to life, freedom from torture, non-retroactivity of criminal penalties)?
      *   **Step 2: The Regime Purpose.** Was the primary purpose of this rule to sustain authoritarian control or persecute political enemies, rather than regulate civil order?
      *   **Step 3: The Interpretive Rescue.** Can the text be read in a way that avoids the unjust outcome without rewriting the statute?
      *   **Stop/Go:** If Step 1 is YES and Step 3 is NO -> Declare "Non-Law" (Nullify). If Step 1 is NO -> It is Law (Apply).
      *   **The "Hate" Case:** Case 3 (Current Eviction Law). It violates due process (hearing), but is it "extreme injustice" like torture? Probably not under this strict test. So the judge must apply it. They will hate that.

  5.  **Drafting the Content:**
      *   **Introduction:** Acknowledge the Hart/Fuller tension but frame it as a "Threshold Protocol."
      *   **The Protocol:** 4 Steps. Clear Yes/No.
      *   **The Handoff:** Explicitly mark where moral judgment enters.
      *   **The Limitations:** What this can't do (policy changes, fixing bad but not evil laws).
      *   **The Cases:**
          1.  *Denunciation Law:* Fails the test (Not Law). Judges happy.
          2.  *Tax Regulation:* Passes the test (Is Law). Judges indifferent/annoyed but accept.
          3.  *Eviction Statute:* Passes the test (Is Law). Judges *hate* this. It shows the limit of the "wicked law" doctrine—it's for dictatorships, not for fixing harsh democratic policies.

  6.  **Refining the "Hate" Aspect:**
      *   If I make Case 3 result in "Apply," the judges might feel powerless. That fits the "rule of law" lesson.
      *   If I make Case 1 result in "Nullify," that fits the transitional justice goal.
      *   I need to ensure the distinction between "Unjust" and "Intolerably Unjust" is clear.

