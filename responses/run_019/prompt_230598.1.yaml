      *Case 3 (Current Eviction):* Fails the "Old Regime" leniency. Must meet highest bar. Doesn't meet it. Result: Apply. Judges hate it.
      *Case 1 (Old Denunciation):* Old Regime. Meets Injustice + Intent. Result: Nullify. Judges happy.
