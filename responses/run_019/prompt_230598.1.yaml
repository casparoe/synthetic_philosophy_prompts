answer: |-
  # The Threshold of Intolerance Protocol (TIP)
  **For Use by First-Instance Magistrates**
  **Time Allocation:** 20 Minutes | **Training Required:** None

  ### Purpose
  This procedure determines whether a procedurally valid rule possesses sufficient moral defect to be treated as **non-law** (null and void for the purposes of your judgment). It is not a tool for policy preference. It is a safety valve for extreme injustice.

  ### The Checklist
  Answer the following questions in order. If you answer **STOP**, the rule is **LAW** (you must apply it). If you reach **END**, the rule is **NON-LAW** (you must disregard it).

  **Q1: The Source Check**
  *   **Question:** Was this rule enacted by the prior authoritarian regime (pre-Transition Date) or the current constitutional order?
  *   **If Current Order:** Go to **Q2-High**.
  *   **If Prior Regime:** Go to **Q2-Standard**.
      *   *Reasoning:* Current laws benefit from democratic legitimacy. Old regime laws carry a presumption of taint but require proof of wickedness.

  **Q2-Standard (Prior Regime) / Q2-High (Current Order): The Dignity Threshold**
  *   **Question:** Does applying this rule require you to directly violate a core human right recognized by international treaties (e.g., right to life, freedom from torture, freedom from arbitrary imprisonment, non-retroactivity of criminal penalties)?
      *   *Note:* Financial loss, inconvenience, or procedural unfairness alone does **not** count here.
  *   **If NO:** **STOP**. The rule is **LAW**.
  *   **If YES:** Proceed to **Q3**.

  **Q3: The Discriminatory Intent Test**
  *   **Question:** Was the primary purpose of this rule to target a specific group based on political opinion, race, religion, or status, rather than to regulate general civil order?
  *   **If NO:** **STOP**. The rule is **LAW**. (Unjust laws of general application remain law).
  *   **If YES:** Proceed to **Q4**.

  **Q4: The Interpretive Rescue**
  *   **Question:** Can the text of the rule be interpreted narrowly (without rewriting it) to avoid the violation identified in Q2?
  *   **If YES:** **STOP**. The rule is **LAW** (apply the narrow interpretation).
  *   **If NO:** Proceed to **Q5**.

  **Q5: The Complicity Check (Value Handoff)**
  *   **Question:** *This is a matter of judicial conscience, not fact.* By signing this order, would you feel personally complicit in a crime against humanity or a systemic atrocity?
  *   **If NO:** **STOP**. The rule is **LAW**.
  *   **If YES:** **END**. The rule is **NON-LAW**.

  ---

  ### Where the Procedure Hands Off to Values
  *   **Q2 (Dignity Threshold):** You must decide what counts as a "core human right." Rely on the Constitution and International Treaties ratified by the state. Do not rely on personal policy preferences.
  *   **Q5 (Complicity Check):** This is the only subjective step. If you reach this stage, the facts are established. The decision rests on your moral agency as a judge. You must write this reasoning explicitly in the order: *"I cannot sign this order without becoming an instrument of injustice."*

  ### What This Procedure Cannot Settle
  1.  **Bad Policy:** It cannot fix laws that are stupid, inefficient, or economically harsh but do not violate core dignity.
  2.  **Constitutional Conflicts:** If a current law violates the Constitution, use standard Constitutional Review procedures. This protocol is for when validity is procedural but legitimacy is in doubt.
  3.  **Future Legislation:** It cannot instruct the legislature on what to pass; it only governs your application of existing text.

  ---

  ### Case Applications

  #### Case 1: The Old Denunciation Statute
  *   **Facts:** A law from 15 years ago (Prior Regime) requiring citizens to report "subversive speech" by neighbors. Failure to report was a crime. A citizen is being prosecuted for failing to report a critic of the old regime.
  *   **Application:**
      *   **Q1 (Source):** Prior Regime. (Go to Q2-Standard).
      *   **Q2-Standard (Dignity):** Yes. Enforcing this violates freedom of conscience and speech, and facilitates arbitrary imprisonment.
      *   **Q3 (Intent):** Yes. Targeted political opponents and critics.
      *   **Q4 (Rescue):** No. The text mandates reporting; no narrow reading avoids the compulsion.
      *   **Q5 (Complicity):** Yes. Enforcing this makes the court an arm of the secret police.
  *   **Result:** **NON-LAW.**
  *   **Judicial Action:** Dismiss the charge. Declare the statute void for extreme injustice.
  *   **Judge's Reaction:** Satisfaction. This aligns with the transition's moral goals.

  #### Case 2: The Old Petty Tax Regulation
  *   **Facts:** A regulation from 12 years ago (Prior Regime) imposing a 5% levy on all commercial invoices to fund "National Security." The money was likely stolen, but the tax was applied evenly to all businesses. A business owner refuses to pay, arguing the law is tainted.
  *   **Application:**
      *   **Q1 (Source):** Prior Regime. (Go to Q2-Standard).
      *   **Q2-Standard (Dignity):** **NO.** Financial loss, even unfair, does not violate core human dignity (life, liberty, torture).
      *   **Decision:** **STOP.**
  *   **Result:** **LAW.**
  *   **Judicial Action:** Order the tax be paid.
  *   **Judge's Reaction:** Mild annoyance. They know the money was stolen, but the procedure forces them to uphold legal certainty over moral purity for minor economic infractions.

  #### Case 3: The Current Eviction Statute
  *   **Facts:** A statute passed 2 years ago (Current Order) allowing police to evict tenants from "occupied buildings" within 24 hours without a judicial hearing. It was passed by a slim majority using proper procedure. A family is facing eviction under this rule. The judge believes a hearing is a fundamental right.
  *   **Application:**
      *   **Q1 (Source):** Current Order. (Go to Q2-High).
      *   **Q2-High (Dignity):** **NO.** While lack of a hearing is a procedural violation, in the hierarchy of rights, it does not equate to torture, death, or retroactive criminal punishment. It is a civil property dispute, not a crime against humanity. *Note: The threshold for nullifying a Current Order law is intentionally set higher than for the Old Regime to preserve democratic stability.*
      *   **Decision:** **STOP.**
  *   **Result:** **LAW.**
  *   **Judicial Action:** Sign the eviction order.
  *   **Judge's Reaction:** **Hostility.** This is the result you will hate. You feel the law is unjust. However, the procedure classifies this as "Bad Law," not "Non-Law."
  *   **Reasoning:** If judges nullify current statutes based on personal views of fairness, the rule of law collapses into rule by judiciary. This law must be challenged in the Constitutional Court or repealed by Parliament, not ignored by a magistrate.

  ### Summary of Limitations
  This procedure cannot settle the tension between **Justice** and **Order** in Case 3. It explicitly prioritizes Order for current legislation unless the injustice reaches the level of atrocity. It forces you to acknowledge that being a judge sometimes means applying laws you wish did not exist, provided they do not cross the threshold of making you a criminal accomplice.
