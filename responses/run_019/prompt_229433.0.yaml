answer: |-
  Here is a complete lesson plan designed to induce the specific philosophical discomfort of the *Death in Damascus* problem without front-loading the theory.

  ### Session Title: The Oracle's Trap
  **Time:** 75 Minutes
  **Participants:** ~18 Undergraduates
  **Goal:** Experiential understanding of Ratifiability Failure, Evidential vs. Causal Decision Theory.
  **Materials:** Whiteboard, markers, index cards (2 per student), slips of paper for "Life Points," a sealed envelope (prop).

  ---

  ### Part 1: The Setup (0:00 – 0:10)
  **Do not mention Decision Theory, Ratifiability, or names like "Gibbard & Harper."**

  1.  **The Story (5 mins):**
      *   Tell the story simply: "You are in Damascus. You meet Death. Death looks surprised and says, 'I'm coming for you tomorrow.' You panic. You know Death is a perfect predictor. If Death predicts you will be in Aleppo, he waits in Aleppo. If he predicts Damascus, he waits in Damascus. To survive, you must be in a different city than Death."
      *   **The Twist:** "For this game, *I* am Death. I am not psychic. But for the logic of this game to work, you must accept the **Stipulation**: In this room, my prediction of your choice is perfectly correlated with your choice. If you decide to go to Aleppo, the 'Death Token' is in Aleppo. If you decide Damascus, it is in Damascus."
      *   *Why this honesty?* If you claim actual psychic powers, they will rebel. If you stipulate the correlation as a rule of the game, they will accept it as a logical constraint.

  2.  **The Stakes (5 mins):**
      *   Hand out 3 "Life Tokens" (slips of paper) to each student.
      *   **Rule:** If you are in the same city as Death, you lose a Life Token. If you are in a different city, you keep it and gain 1 bonus token.
      *   **Goal:** Maximize tokens.
      *   **Physicality:** Designate the Left side of the room as **Aleppo** and the Right side as **Damascus**.

  ---

  ### Part 2: The Game – Inducing the Loop (0:10 – 0:40)

  **Round 1: Intuition (10 mins)**
  1.  **Deliberation:** Give them 2 minutes to think silently. No talking.
  2.  **Commitment:** Hand out Index Card A. Ask them to write "Aleppo" or "Damascus." Collect the cards.
  3.  **The Reveal:** While holding the stack, say: "I have looked at your collective intent. Based on the Stipulation, Death is where you decided to be."
  4.  **The Cull:** Walk to the side of the room where the *majority* wrote (you peeked quickly). Announce: "Death is in [Majority City]."
  5.  **Scoring:** Anyone on that side loses a token. Anyone on the other side gains a token.
      *   *Expected Outcome:* Most lose tokens. They will feel they were "found out."

  **Round 2: The Switch (10 mins)**
  1.  **The Prompt:** "Okay, you know the rule. If you decide to go to a city, Death is there. So, rationally, where should you go?"
  2.  **The Trap:** Students will argue, "I should go to the city I *didn't* pick last time."
  3.  **Action:** Ask them to physically move to the city they *now* choose.
  4.  **The Intervention:** Stop them before they settle. "Wait. If you *choose* to move to Damascus, what does the Stipulation say?"
      *   *Student:* "Death is in Damascus."
      *   *You:* "So should you move?"
      *   *Student:* "No, back to Aleppo."
      *   *You:* "And if you choose Aleppo?"
      *   *Student:* "Death is in Aleppo."
  5.  **The Freeze:** Do not let them submit a final choice yet. Force them to stand in the middle. Ask: "Is there any position you can stand in where, *given that you are standing there*, you are safe?"
  6.  **Scoring:** Since no stable decision was reached, everyone loses a token for "Hesitation." (This penalizes the instability).

  **Round 3: Randomization (10 mins)**
  1.  **The Proposal:** A student will likely suggest: "I need to randomize. Flip a coin. 50/50."
  2.  **The Action:** Have them flip coins. Heads = Aleppo, Tails = Damascus.
  3.  **The Reveal:** You reveal a sealed envelope you prepared at the start of class. Inside is a note: *"Death predicted the coin flip outcome."*
      *   *Note:* You actually need to cheat slightly here or have two envelopes. To keep it honest, tell them: "If you randomize, Death randomizes with the same distribution. The correlation holds."
  4.  **Scoring:** 50% die, 50% live.
  5.  **Closing the Game:** Ask them to sit down. Ask: "Who feels like they made a rational decision?" (Most will say no).

  ---

  ### Part 3: The Debrief & Diagnosis (0:40 – 1:15)

  Now you name the concepts. Draw a 2x2 matrix on the board.

  **1. Mapping the Experience (10 mins)**
  *   **Ask:** "Why did Round 2 feel impossible?"
  *   **Diagnosis:** Write **RATIFIABILITY** on the board.
  *   **Definition:** A decision is ratifiable if, *conditional on making that decision*, it remains the best choice.
  *   **The Loop:**
      *   If I decide Aleppo $\rightarrow$ Evidence suggests Death is in Aleppo $\rightarrow$ Expected Utility of Aleppo drops $\rightarrow$ I prefer Damascus.
      *   If I decide Damascus $\rightarrow$ Evidence suggests Death is in Damascus $\rightarrow$ Expected Utility of Damascus drops $\rightarrow$ I prefer Aleppo.
  *   **Conclusion:** Neither choice is ratifiable. There is no stable equilibrium for a rational agent.

  **2. Evidential vs. Causal Decision Theory (15 mins)**
  *   **Evidential Decision Theory (EDT):**
      *   *Logic:* Maximize expected utility based on the *news* your action brings.
      *   *In Game:* Choosing Aleppo is bad *evidence* for survival. EDT says: "Don't go to Aleppo, because going to Aleppo means Death is there."
      *   *Problem:* EDT leads to the loop. It paralyzes you.
  *   **Causal Decision Theory (CDT):**
      *   *Logic:* Maximize expected utility based on the *causal consequences* of your action.
      *   *In Game:* My choice does not *cause* Death's location (it was predicted beforehand). The state of the world is fixed.
      *   *CDT Verdict:* "Death is already in Aleppo or Damascus. My choice changes nothing. I should just go to the city I like more (or randomize)."
      *   *Problem:* CDT ignores the correlation. If Death is a perfect predictor, ignoring the correlation seems irrational.
  *   **The Conflict:** The game shows why EDT paralyzes (loop) and why CDT feels reckless (ignoring the predictor).

  **3. The "Common Cause" Resolution (5 mins)**
  *   Explain that in the philosophical literature, this is often resolved by noting that your *decision process* and Death's *prediction* share a common cause (your psychology).
  *   You cannot "outsmart" the predictor because the predictor is predicting *you*, not your randomizer.

  ---

  ### Part 4: Troubleshooting (What Will Go Wrong)

  **1. The "You're Lying" Rebellion**
  *   **Risk:** Students in Round 1 will claim you just looked at the majority and followed them, so it wasn't a "prediction."
  *   **Fix:** Agree with them! "You are right. I am not psychic. But the *problem* stipulates a perfect predictor. I am simulating the *logic* of the problem, not the metaphysics. If you treat me as a perfect predictor, the logic holds. If you treat me as a guy guessing, the game breaks. Let's play the logic."

  **2. The "I Don't Care" Apathy**
  *   **Risk:** Students realize the game is rigged and stop trying.
  *   **Fix:** Shift the stakes from "Winning" to "Diagnosing." In Round 2, tell them: "The goal is no longer to survive. The goal is to find a statement you can write on a card that doesn't make you want to switch. If you can write a stable decision, you win automatically." This highlights the impossibility.

  **3. The Randomization Fixation**
  *   **Risk:** They fixate on coin flips as the solution too early.
  *   **Fix:** In the debrief, press them: "If Death predicts coin flips, does randomization help?" (No, it just makes your expected utility 0.5 instead of 0 or 1, but the *ratifiability* issue remains: conditional on the coin landing Heads, you wish it landed Tails).

  ---

  ### Part 5: Limitations (Honesty Check)

  End the session by explicitly stating what the game failed to capture. This builds trust and philosophical nuance.

  1.  **The Stakes:** "In the game, you lost paper tokens. In the problem, you lose your life. High stakes make the anxiety of the loop real; low stakes make it a puzzle."
  2.  **The Predictor:** "I am a human facilitator. I cannot actually predict. The real problem assumes a metaphysical or computational necessity that we can only simulate."
  3.  **The Causality:** "In the room, my announcement *caused* your panic. In the problem, the prediction happens *before* you choose. We collapsed the timeline for gameplay."

  ### Facilitator Cheat Sheet (Key Phrases)
  *   **To induce the loop:** "Conditional on you choosing that, where is Death?"
  *   **To define Ratifiability:** "Can you make this choice without immediately wishing you hadn't?"
  *   **To distinguish EDT/CDT:** "Does your choice *tell you something* about the world (EDT), or does it *change* the world (CDT)?"

  ### Why This Works
  This structure avoids the "lecture first" trap. By forcing them to physically move and then stopping them with the logic of their own movement ("If you move there, Death is there"), you externalize the internal deliberation process. They don't just hear about the loop; they stand in the middle of the room, unable to commit, which is the exact phenomenological state of a non-ratifiable decision.
