answer: |-
  Your friend's verdicts are remarkably consistent, but they rest on a tension between two competing theories of democratic inclusion. Based on the six precedents, we can reconstruct two distinct principles that fit the data equally well. They diverge sharply on the asylum case.

  ### 1. The Two Candidate Principles

  **Principle A: "Constitutive Membership" (The Community Model)**
  *   **Core Rule:** The vote is a right of *membership* in the political community, not merely a protection against power. The community defines itself, and only those admitted into the "We" may shape its future.
  *   **How it fits the record:**
      *   **V1 (Tourist):** Not a member; temporary presence. (No vote)
      *   **V2 (Expatriate):** Citizen; membership is retained by legal bond and enduring ties. (Yes vote)
      *   **V3 (Resident):** De facto member; social integration (work, school, taxes) constitutes admission. (Yes vote)
      *   **V4 (Minors):** Prospective members, not yet full agents of the community. (No vote)
      *   **V5 (Prisoner):** Membership is not forfeited by crime. (Yes vote)
      *   **V6 (Neighbors):** Affected parties, but outside the boundary of the community. (No vote)
  *   **Necessary Riders:**
      *   *The Capacity Rider:* Membership requires agency (explains V4).
      *   *The Durability Rider:* Membership requires more than transient presence (explains V1).
      *   *The Sovereignty Rider:* The community has the right to determine its own boundaries (explains why V6 gets consultation but not franchise).

  **Principle B: "Subjection to Authority" (The Coercion Model)**
  *   **Core Rule:** The vote is a right of those *subject to the coercive power* of the state. Legitimacy requires the consent of the governed; if the state can bind you, you must have a say.
  *   **How it fits the record:**
      *   **V1 (Tourist):** Subject to laws, but the subjection is voluntary and temporary (she can leave). (No vote)
      *   **V2 (Expatriate):** Citizenship creates a permanent legal bond; she remains subject to certain laws (taxes, treason) and retains the right to return/coercion. (Yes vote)
      *   **V3 (Resident):** Fully subject to the state's coercive apparatus (police, courts, taxes). (Yes vote)
      *   **V4 (Minors):** Subject to power, but lack the capacity to exercise the vote. (No vote)
      *   **V5 (Prisoner):** Maximally subject to state coercion. (Yes vote)
      *   **V6 (Neighbors):** Affected by *outcomes* (pollution), but not subject to the state's *jurisdiction* or coercive authority. (No vote)
  *   **Necessary Riders:**
      *   *The Jurisdiction Rider:* Distinguishes being "affected" (V6) from being "subjected" (V3/V5).
      *   *The Permanence Rider:* Distinguishes temporary subjection (V1) from enduring subjection (V2/V3).
      *   *The Capacity Rider:* Same as above (explains V4).

  ---

  ### 2. Predictions for the Asylum Case

  **The Case:** Asylum seekers detained or turned back at the border, never legally admitted, policy decides their fate.

  *   **Prediction under Principle A (Membership):** **NO VOTE.**
      *   *Reasoning:* The explicit purpose of the policy is to determine *who becomes a member*. Until admission is granted, they are outside the polity. To give them a vote would be to allow non-members to decide the rules of membership, violating the "Sovereignty Rider."
  *   **Prediction under Principle B (Coercion):** **YES VOTE.**
      *   *Reasoning:* These individuals are the direct objects of state coercion (detention, forced return). They cannot "leave" voluntarily (they are fleeing); they are inescapably subject to the state's power at the border. Under the "Subjection" rule, those whose liberty is determined by the state must have a say.

  ---

  ### 3. Evaluating Your Friend's "No"

  **Is her verdict consistent with her track record?**
  **Yes.** Her "No" is perfectly consistent with **Principle A (Membership)**. In fact, her justification ("a polity decides its own membership rules, and they are not members") is a verbatim statement of Principle A.

  **Which precedent is the closest analog?**
  **Verdict 1 (The Tourist).**
  *   **Why:** Like the tourist, the asylum seeker is physically at the threshold of the state and subject to its laws while there. In both cases, your friend denies the vote because the individual lacks *status* within the community, despite physical presence and legal subjection.
  *   *Alternative:* One might argue **Verdict 6 (The Neighbors)** is closer because asylum seekers are "outside" looking in. However, V6 concerns people *remaining* in their own country. The asylum seeker is more like the Tourist (V1) because they are seeking entry and are physically held by the state's apparatus, yet denied the franchise due to non-membership.

  **If the record underdetermines the answer, what principles are adopted by Yes/No?**
  The record *does* underdetermine the answer because V1-V6 can be explained by either Membership or Coercion (with appropriate riders).
  *   **By saying "No":** She adopts the **Constitutive Membership** principle. She prioritizes the self-determination of the existing citizenry over the rights of those the state controls but excludes. She treats the border as a membrane that filters rights, not just people.
  *   **By saying "Yes":** She would adopt the **Subjection to Authority** principle. She would prioritize democratic legitimacy (consent of the governed) over communal self-definition. This would imply that anyone the state detains or deportes has a claim on the franchise, potentially transforming the border from a membership filter into a jurisdictional zone of shared governance.

  ---

  ### 4. The Tie-Breaker Case

  To force these two principles apart, you need a case where **Membership** is clear but **Subjection** is absent (or vice versa). The six precedents mostly align them (citizens are members and subjected; residents are members and subjected).

  **The Case:** **The Long-Term Undocumented Resident.**
  *   *Scenario:* A non-citizen who has lived in the country for 15 years, works, pays taxes, and has children in school (exactly like V3), but entered *illegally* and has never been granted legal residence status.
  *   **Principle A (Membership) predicts: NO VOTE.**
      *   *Reasoning:* Despite social integration, they have violated the "constitutive rules" of entry. They are not "admitted" members. The polity has not consented to their membership.
  *   **Principle B (Coercion) predicts: YES VOTE.**
      *   *Reasoning:* They are fully subject to the state's coercive power (police, courts, threat of deportation). Their subjection is more permanent and inescapable than the Tourist (V1) or Expatriate (V2).
  *   **Why this forces the split:** Your friend's V3 (Legal Resident) allows both principles to agree. An *Illegal* Resident separates "Social/Legal Admission" (Membership) from "Factual Subjection" (Coercion). If she grants the vote, she is a Coercion theorist. If she denies it, she is a Membership theorist (and her "No" on asylum is firmly anchored).
