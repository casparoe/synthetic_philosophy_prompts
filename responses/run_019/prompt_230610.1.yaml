answer: |-
  Joseph Butler's analysis of self-deceit offers a precise blueprint for distinguishing your narrator from a mere liar or a generically unreliable voice. A liar knows the truth and conceals it from the reader, creating a mystery of fact; a self-deceived narrator believes her own falsehoods, creating a mystery of motive. Butler notes that the self-deceived "judge quite differently upon any matter relating to themselves" than they do for others, which implies that your narrator must be lucid, even sharp, when observing the world around her. If she is confused about everything, she is simply unreliable; if she is piercingly accurate about everyone except herself, she is self-deceived. The reader's task is not to uncover what happened, but to understand why the narrator cannot see what she plainly describes.

  Regarding the grain of the sentences, Butler's observation that people "think, and reason, and judge" differently suggests that the deception must be syntactic, not just situational. If the self-deception exists only in the shape of the plot, the reader sees the outcome but not the psychological mechanism. To make the partiality legible, the narration must embody the "different judgment" in its rhetoric. This means the narrator should use active verbs and specific adjectives when describing others' faults, but shift to passive voice or abstract nouns when describing her own similar actions. She might attribute her own behaviors to circumstance ("I was forced into it") while attributing identical behaviors in others to character ("He is weak"). The deception lives in the transitive verbs: who acts, and who is acted upon.

  Finally, Butler's claim that men are "perfect strangers to their own characters" dictates that scenes of introspection or confession cannot be moments of genuine clarity. If the character's judgment is the instrument of the partiality, she cannot use that judgment to cure the partiality. Therefore, a scene of introspection should show the character analyzing herself with apparent rigor but arriving at a comforting conclusion through a subtle logical swerve. She might confess to a minor vice to inoculate herself against the accusation of a major one, or she might condemn a vice in herself by a name that obscures its true nature, while condemning it in others with severity. The introspection becomes a performance of honesty that functions as a defense mechanism, illustrating Butler's point about people "talking with great severity against particular vices... they themselves are notoriously guilty of."

  The novelist must construct a voice that applies to others the rigorous judgment it systematically suspends for the self, allowing the reader to find the truth in the disparity between the narrator's scrutiny of the world and her insulation from it.
