  3.  **Drafting - Section by Section:**

      *   **Implication 1: Self-Deceived vs. Liar/Unreliable.**
          *   *Liar:* Knows the truth, hides it from the reader/other characters. There's a gap between knowledge and statement.
          *   *Unreliable (General):* Could be naive, ignorant, or lying.
          *   *Self-Deceived (Butlerian):* Knows the truth about *others* but applies a different logic to *self*. The gap is between the reader's inference and the narrator's conviction. The narrator believes their own narrative. The tension comes from the *consistency* of their blindness, not the inconsistency of their facts.
          *   *Butler's insight:* "Judge quite differently upon any matter relating to themselves." The narrator must be a sharp judge of others to highlight the contrast.

      *   **Implication 2: Grain of Sentences vs. Plot Shape.**
          *   *Plot Shape:* Too distant. If it's only plot, the reader sees the outcome but not the psychological mechanism.
          *   *Grain of Sentences:* Essential. The syntax, diction, and rhetorical moves must embody the partiality.
          *   *Butler's insight:* "Think, and reason, and judge." It's a cognitive process. The narration must show the *reasoning* that leads to the wrong conclusion. Passive voice, qualifying clauses, shifting agency (e.g., "mistakes were made" vs. "I made mistakes"), comparing self to worse examples rather than better ones. The deception lives in the *how*, not just the *what*.

      *   **Implication 3: Introspection/Confession.**
          *   *Challenge:* If the character is self-deceived, can they introspect honestly?
          *   *Butler's insight:* They are "perfect strangers to their own characters."
