      *   *What about contacts?* If I store a number in my phone contacts, that's more like Otto's notebook. If I search "best pizza," that's not a belief.
      *   *So the distinction is:* **Curated/Personal Storage** vs. **Public/Unvetted Information.**
      *   *Premise (2) needs the "Conscious Endorsement" clause.* This is the specific Clark & Chalmers condition the roommate left out.

