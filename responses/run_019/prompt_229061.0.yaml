answer: |-
  This is a classic objection to the Extended Mind Thesis (EMT), often called the **"Cognitive Bloat"** or **"Google Problem"** objection. Your roommate has reconstructed it very well.

  The good news is: **You do not have to give up Otto to save yourself from the internet.**

  The hole is in **Premise (2)**. Your roommate's formulation of the criteria is slightly *looser* than what Clark and Chalmers actually proposed in their original 1998 paper. If you tighten Premise (2) to match the original argument, Premise (4) becomes false, and you can keep Otto without accepting that the entire internet is in your head.

  Here is how you break the chain.

  ### 1. The Missing Criterion: "Past Endorsement"
  Clark and Chalmers specify three conditions for external information to count as a belief (often summarized as the "Trust and Glue" conditions). Your roommate listed availability, accessibility, and automatic endorsement. But they left out a crucial fourth constraint implicit in the Otto case:

  **The information must have been consciously endorsed by the agent in the past.**

  *   **Otto:** When Otto wrote the address in his notebook, he consciously believed it was true. He vetted it. He stored it *as a belief*. The notebook is functioning as a *memory store* for information he already accepted.
  *   **You + Internet:** When you Google "Who was the 22nd president?", you have not previously endorsed the contents of the Wikipedia page that pops up. You are querying a database, not retrieving a stored commitment.

  If you add **"and the agent has previously consciously endorsed this information"** to Premise (2), then:
  *   **Otto (3)** still passes. He wrote the address down because he believed it.
  *   **Internet (5)** fails. You have not endorsed the entirety of the internet, nor even the specific search results, prior to looking them up.

  ### 2. Challenging Premise (4): "Automatic Endorsement"
  Your roommate claims in (4): *"I look things up... and I just go with whatever comes up (automatic endorsement)."*

  This is empirically false, and this is where you can attack the argument directly.
  *   **Otto:** If Otto looks in his notebook and it says "MOMA is on 51st St," but he has a strong prior memory that it's on 53rd, he might pause. But generally, he treats the notebook *as his memory*. He trusts it implicitly *because* it is his system for storing what he takes to be true.
  *   **You + Phone:** If you search a topic on your phone and the top result contradicts something you know to be core to your worldview (e.g., "The earth is flat"), you do **not** automatically endorse it. You evaluate it. You check sources. You might reject it entirely.

  Because you treat the phone/internet as a *source of new information* rather than a *repository of old beliefs*, you do not meet the "automatic endorsement" criterion in the same way Otto does. You treat the phone as a testifier, not as a memory.

  ### 3. Distinguishing "Phone as Notebook" vs. "Phone as Portal"
  To save Otto, you don't have to say *nothing* on your phone counts. You just have to be specific about *what* counts.

  *   **Your Contacts/Notes App:** If you save your mother's number in your contacts, or write a grocery list in your Notes app, this **is** exactly like Otto's notebook. You endorsed that info, you stored it for retrieval, and you trust it implicitly. EMT proponents would say: *Yes, those specific entries are part of your extended mind.*
  *   **The Open Web:** This is not like the notebook. It is a library, not a memory.

  If you accept that your *Contacts App* is part of your mind, that's not "bloat." That's just admitting you use tools to store specific commitments. The "bloat" only happens if you claim the *whole internet* is your belief system.

  ### 4. The "Coupling-Constitution" Nuance
  There is a deeper philosophical distinction here regarding **integration**.
  *   **Otto's Notebook:** It is integrated into his cognitive *character*. It is constantly there, it is maintained by him, and it moves with him. It is "glued" to his cognitive processes.
  *   **The Internet:** The internet changes independently of you. If Wikipedia is edited by a stranger, your "belief" changes without your agency. A belief system generally requires some level of agential control over the maintenance of the information. Otto maintains his notebook; you do not maintain the internet.

  ### How to Reply to Your Roommate
  You can reject **Premise (2)** as incomplete. Propose this revised version:

  > **(2 Revised):** That role is played when the info is reliably there, you go to it without deliberating, you automatically endorse it, **AND you have previously consciously endorsed this information as true.**

  **The Result:**
  *   **(3) Otto:** Survives. He wrote the address down himself.
  *   **(4) You/Phone:** Fails. You haven't endorsed the internet's contents.
  *   **(5) Bloat:** Blocked. You don't believe contradictory internet claims because they aren't *your* beliefs until you vet and store them.

  ### Summary
  The hole is the difference between **retrieving a stored commitment** (Otto/Notebook/Contacts App) and **querying an external database** (You/Google).

  Clark and Chalmers never argued that *access* to information makes it a belief; they argued that *functional integration* of stored information makes it a belief. Your roommate's argument commits a slight straw man by leaving out the requirement that the agent must have vouched for the information in the first place.

  **Verdict:** Keep (3). Reject (4) and (5). Modify (2). EMT survives.
