prompt: |-
  I'm taking phil of mind this semester and we just did the extended mind unit (Otto and his notebook vs. Inga and her memory). My roommate, who's in the class with me, put together this argument and it seems to prove way too much, but neither of us can find the hole.

  (1) A belief is just whatever plays the belief-role for you: information that guides your reasoning and your actions. Where it's physically stored doesn't matter.
  (2) That role is played when the info is reliably there when you need it, you go to it without deliberating, and you automatically endorse what it tells you.
  (3) Otto's notebook hits all three for the museum address, so the notebook entry is one of Otto's beliefs. (This is the extended mind bit and I'm totally fine with it.)
  (4) Now take me and my phone: it's in my pocket all day (reliably available), I look things up without deliberating, and I just go with whatever comes up (automatic endorsement).
  (5) So the stuff accessible through my phone is among my beliefs -- literally the contents of the internet, or at least everything it would pull up on any topic.
  (6) Those contents contradict each other all over the place, and tons of it is stuff I'd flat-out deny if you asked me cold. So on this view I have massively contradictory beliefs and "believe" things I'd sincerely disavow. That cant be right.
  (7) So something in (1)-(2) has to go -- but (3) was built entirely out of (1)-(2), so it looks like saving Otto costs the bloat, and killing the bloat costs Otto.

  Which step do I actually reject? If I have to choose I'd rather keep (3) and lose (5), but I can't see what separates them, since everything I said about my phone seems true in exactly the way the notebook stuff is true of Otto. And if the standard move is to tighten the criteria so my phone fails, why doesn't the notebook fail too?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Philosophy of Mind class, specifically the Extended Mind Thesis (EMT) by Clark & Chalmers (Otto & Inga case).
      *   **The Roommate's Argument:** A reductio ad absurdum against EMT.
      *   **Structure:**
          1.  Functionalism about belief (belief = role, not location).
          2.  Criteria for the role (reliability, accessibility without deliberation, automatic endorsement).
          3.  Otto's notebook fits criteria $\rightarrow$ Otto believes notebook contents (EMT accepted).
          4.  My phone fits criteria (reliability, accessibility, endorsement).
          5.  Therefore, phone/internet contents are my beliefs (Cognitive Bloat/Objection).
          6.  This leads to absurdity (contradictory beliefs, believing things I'd deny).
          7.  Conclusion: EMT (3) must go, or criteria (1)-(2) must change, but changing criteria threatens (3).
      *   **User's Goal:** Wants to keep (3) (Otto's notebook counts) but reject (5) (Phone/Internet counts), without seeing a relevant difference. Needs to find the "hole" in the argument.

  2.  **Deconstruct the Argument & Identify Standard Objections:**
      *   The argument is essentially the "Cognitive Bloat" objection (often associated with Adams & Aizawa or early critics of Clark & Chalmers).
      *   The core tension is between *coupling* and *constitution*. Just because I'm coupled to a resource doesn't mean it constitutes my mind.
      *   The roommate's criteria in (2) are a bit loose compared to Clark & Chalmers' original criteria.
      *   *Original Clark & Chalmers Criteria:*
          1.  Constant availability.
          2.  Easy accessibility.
          3.  Automatic endorsement (trust).
          4.  *Past endorsement* (crucial missing piece?).
          5.  *Integration* into a coherent cognitive system.

  3.  **Brainstorming Distinctions (Otto vs. Phone/Internet):**
      *   *Trust/Endorsement:* Otto trusts his notebook specifically because he wrote it. Do I trust *everything* on my phone? No. I Google "flat earth," see results, but don't believe them.
      *   *Past Endorsement:* Otto wrote the address down *because* he believed it. The phone contains info I haven't vetted.
      *   *Glue vs. Trust:* Clark & Chalmers emphasize the *integration* into the cognitive character. The internet is too fluid, too contradictory.
      *   *The "Google" Objection:* Clark actually addressed this later (the "Google Problem"). He distinguishes between *occurrent* belief and *dispositional* belief, or emphasizes the *process* of retrieval.
      *   *Agency/Control:* Otto controls the notebook. The internet is external agents.
      *   *Granularity:* Is the *whole internet* the belief, or just the specific search result I'm looking at right now?

  4.  **Developing the Solution (Step-by-Step):**

      *   **Validate the User:** Acknowledge this is a classic and strong objection (Cognitive Bloat). It shows they understand the material.
      *   **Pinpoint the Weak Link:** Step (2) and Step (4) are the vulnerable points. The roommate's formulation of the criteria is slightly weaker than Clark & Chalmers' original formulation.
      *   **Key Distinction 1: Past Endorsement (The "Otto" Condition).** Clark & Chalmers specify that the information must have been *consciously endorsed* in the past. Otto wrote the address down. I haven't endorsed every webpage on my phone. This blocks the "whole internet" bloat.
      *   **Key Distinction 2: Trust/Reliability Mechanism.** Otto trusts the notebook *as a memory aid*. I use the phone as a *search engine*. There's a difference between retrieving a stored belief and querying a database.
      *   **Key Distinction 3: Integration/Coherence.** Beliefs need to cohere somewhat. The internet contradicts itself. A cognitive system filters for coherence.
      *   **Key Distinction 4: The "Coupling-Constitution Fallacy".** Just because the phone is coupled to me doesn't mean it's part of the cognitive *process* in the same way. (Though EMT argues against this fallacy, it's still relevant to *how* it's coupled).

  5.  **Drafting the Response:**

      *   *Introduction:* Confirm this is the "Cognitive Bloat" objection. It's the standard counter-argument to EMT.
      *   *The Fix:* You don't need to abandon EMT. You need to tighten premise (2).
      *   *Specific Criteria to Add:*
          1.  **Past Endorsement:** Otto wrote it. You didn't write the internet.
          2.  **Specific Trust:** Otto trusts the notebook *qua* memory. You don't trust Google *qua* truth without filtering.
          3.  **Cognitive Integration:** The info needs to be integrated into your web of beliefs.
      *   *Addressing the Phone:* Does the phone count? Maybe *some* of it (contacts, notes app), but not the open web. Distinguish between *storage* (notebook/notes app) and *computation/retrieval* (search engine).
      *   *Addressing Step (4):* Challenge the claim that you "automatically endorse" phone results. If Google says "2+2=5", you reject it. If Otto's notebook says "MOMA is on 53rd", he accepts it.
      *   *Philosophical Nuance:* Mention Clark's later responses (the "Google Problem"). He admits the internet isn't automatically part of the mind just because it's accessible.
      *   *Conclusion:* You can keep (3) and reject (5) by refining (2).

  6.  **Refining the Argument (Self-Correction during drafting):**
