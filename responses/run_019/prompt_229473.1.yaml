answer: |-
  ### Brief Scorecard of Existing Positions

  *   **Standard Expected Utility Theory (EUT):** Stake sizing is derived from an agent's subjective utility function (e.g., CRRA). Kelly is merely the special case where utility is logarithmic. Arithmetic expectation is relevant for one-off bets; utility curvature handles risk.
  *   **Geometric Rationality (Kelly/Thorp/Peters):** In repeated multiplicative dynamics, the time-average growth rate is the objective physical constraint. Logarithmic utility is not a preference but a mathematical necessity to avoid ruin and maximize long-term wealth. Arithmetic expectation is misleading (non-ergodic).
  *   **Pragmatic/Heuristic:** Kelly is a useful rule of thumb to prevent ruin, but fractional Kelly is preferred to account for estimation error. Utility is secondary to survival constraints.

  ---

  ### Adjudication of Desiderata

  Below are the five proposed requirements, adjudicated for their status as **Non-Negotiable** (fundamental to the coherence of repeated multiplicative decision-making) or **Camp-Specific/Pragmatic** (dependent on philosophical stance or application constraints).

  #### (i) Survival and the Absorbing Barrier
  **Status:** **Non-Negotiable**
  **Refined Specification:** *The theory must respect the absorbing state at zero wealth.*
  **Motivation:** In multiplicative dynamics, wealth cannot be negative. If wealth hits zero, the sequence terminates. A theory that recommends a strategy with a non-zero probability of ruin (e.g., betting the full bankroll on a coin flip with $p=0.6$) fails to model the sequential nature of the problem. It conflates a single positive-expectation trial with a trajectory of play.
  **Adjudication:** Any adequate theory must distinguish between *positive arithmetic expectation* and *viability over time*. A policy that permits ruin in a repeated game is mathematically incoherent regarding the domain constraints.

  #### (ii) The Overbetting Phenomenon (Ergodicity)
  **Status:** **Non-Negotiable**
  **Refined Specification:** *The theory must distinguish between ensemble-average growth (arithmetic mean) and time-average growth (geometric mean).*
  **Motivation:** This is the core insight of geometric rationality. As stake size increases beyond the growth-optimal point, the arithmetic expected wealth may rise (driven by rare, extreme outliers), but the typical trajectory (median wealth) declines. A theory that ignores this fails to predict the actual experience of a single agent moving through time. It must explain why "more risk" does not equal "more growth" indefinitely.
  **Adjudication:** This is not a preference; it is a statistical fact of multiplicative processes. A theory that optimizes arithmetic expectation in a repeated setting is objectively wrong about the long-term outcome for the individual agent.

  #### (iii) Portfolio Generalization (Correlation)
  **Status:** **Non-Negotiable for Adequacy**
  **Refined Specification:** *The allocation logic must be invariant to the presence of correlated opportunities.*
  **Motivation:** Real-world gambling and investing rarely offer independent, identical bets. Correlation reduces the effective diversification benefit. A theory that treats two correlated bets as equivalent to two independent bets will prescribe over-leverage. The optimization surface must account for the covariance matrix of outcomes, not just marginal probabilities.
  **Adjudication:** While simple Kelly expositions often assume independence for clarity, a theory claiming to be *adequate* for capital allocation must handle multivariate distributions. Failure here renders the theory inapplicable to most real-world scenarios.

  #### (iv) Epistemic Robustness (Uncertain Probabilities)
  **Status:** **Camp-Specific / Pragmatic Extension**
  **Refined Specification:** *The theory should prescribe behavior under parameter uncertainty (e.g., Fractional Kelly).*
  **Motivation:** The pure Kelly criterion assumes known probabilities ($p$). In reality, $p$ is estimated. Betting full Kelly on an overestimated edge leads to the overbetting penalty described in (ii).
  **Adjudication:** This is **not** a requirement for the *logical definition* of growth optimality (which assumes known $p$), but it is a requirement for a *usable decision procedure*. Strict Kelly proponents argue the theory is normative (what to do if you know $p$); Pragmatists argue a theory is inadequate if it crashes when $p$ is noisy. This is the dividing line between "Ideal Kelly" and "Real-World Asset Management."

  #### (v) Reconciliation with Expected Utility Theory
  **Status:** **Camp-Specific (The Fundamental Conflict)**
  **Refined Specification:** *The theory must declare whether Log Utility is a subjective preference or an objective derivation from dynamics.*
  **Motivation:** Standard EUT treats utility functions as axiomatic preferences. Geometric Rationality argues that for repeated multiplicative gambles, the Log Utility function is *derived* from the requirement to maximize time-average growth, not chosen by preference.
  **Adjudication:** You cannot satisfy both the claim that "Utility is purely subjective" and "Kelly is universally mandatory."
  *   If you hold EUT as paramount, Kelly is optional (only for log-utility agents).
  *   If you hold Geometric Rationality as paramount, EUT is incomplete (it ignores ergodicity violations).
  *   **Incompatibility Flag:** This is the primary friction point. A theory cannot simultaneously claim that stake sizing is purely a matter of subjective risk tolerance (EUT) AND that there is a unique, objectively rational stake size regardless of preference (Kelly). One must yield: either utility is constrained by dynamics, or dynamics are secondary to utility.

  ---

  ### Summary of Incompatibilities

  1.  **Arithmetic vs. Geometric Optimization:** You cannot maximize both simultaneously in a volatile environment. Desideratum (ii) forces a choice. An adequate theory of *repeated* play must prioritize Geometric (Time-Average), rendering Arithmetic (Ensemble-Average) maximization irrational for the individual.
  2.  **Subjective Utility vs. Objective Dynamics:** Desideratum (v) highlights the conflict. If (i) and (ii) are accepted as non-negotiable physical constraints of the gambling process, then Log Utility ceases to be a "preference" and becomes a "law." This contradicts the standard EUT view that an agent is rational even if they choose a different utility function (e.g., they are allowed to go broke if they prefer the upside).
  3.  **Ideal vs. Robust:** Desideratum (iv) conflicts with the purity of (ii). Strict adherence to growth optimality (ii) requires betting the full edge. Handling uncertainty (iv) requires betting less. A complete theory must explicitly model *why* one deviates from the optimum (e.g., via a utility penalty on variance of log-wealth) rather than treating it as a vague heuristic.

  ### Final Verdict on Requirements

  For a theory of stake sizing in **repeated, multiplicative gambles** to be considered adequate:

  *   **Must Haves:** (i) Survival, (ii) Ergodicity/Overbetting distinction, (iii) Correlation handling. These describe the physics of the wealth process.
  *   **Resolution Required:** (v) The theory must take a stance on the source of the utility function (derived vs. axiomatic).
  *   **Extension:** (iv) Uncertainty handling is necessary for application but is technically a meta-layer on top of the core growth theory.
