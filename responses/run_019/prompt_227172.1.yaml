answer: |-
  This is a classic case of "applied metaphysics" crashing into bureaucratic risk management. You are not overreading the situation; the tensions you are sensing are real ontological fissures. Restoration ecology is currently fighting a civil war between three incompatible definitions of what a "species" or "ecosystem" actually *is*.

  Here is the breakdown of the natural kinds presupposed by your board's practice, separated by policy commitment and philosophical "vibe," followed by an assessment of coherence.

  ### 1. The Ontological Clash: Three Rules, Three Natures
  Your board is operating with three distinct rules that secretly presuppose three different metaphysics of nature. They cannot all be true simultaneously.

  *   **The 40 km Rule (Spatial Essentialism):**
      *   **Presupposition:** Nature has spatial "joints." An ecotype is defined by its location. A rush seed from 41 km away is ontologically different from one 39 km away, regardless of genetic similarity.
      *   **Ontology:** *Spatial Individualism.* It treats the local watershed as a distinct individual organism that must not be contaminated by foreign tissue.
  *   **The Pre-1960 Rule (Historical Fixity):**
      *   **Presupposition:** There was a "true" state of nature prior to a specific timestamp (1960 is often used as a proxy for pre-industrial agriculture or pre-major habitat fragmentation).
      *   **Ontology:** *Temporal Essentialism.* It assumes nature degrades over time and that the "essence" of the species is captured in the herbarium sheet. It treats the species as a museum artifact to be reconstructed, not a continuing evolutionary process.
  *   **The Climate Resilience Clause (Functionalism):**
      *   **Presupposition:** Survival and function matter more than origin. If the plant does the job (holds soil, handles heat), it fits the kind.
      *   **Ontology:** *Pragmatic/Dispositional.* The "kind" is defined by what it *does*, not where it came from or who its ancestors were.

  **The Conflict:** The Climate Clause explicitly contradicts the 40 km and Pre-1960 rules. If function is king (Climate Clause), then origin (40 km) and history (1960) should be irrelevant. If origin and history are king, then the Climate Clause is a dangerous loophole. The board tries to have it both ways to satisfy conflicting grant requirements.

  ### 2. Strict Policy Commitments vs. "Vibes"
  You asked to separate what the policy commits to versus what it merely "vibes" with.

  *   **Strict Commitment (The Legal/Financial Layer):**
      *   **Liability Management:** The policy commits to protecting the county from lawsuits or grant clawbacks. If they plant a southern strain and it dies or becomes invasive, they need to prove they followed the "Native Seed Standard."
      *   **Legibility:** The policy commits to *documentable* purity. They need a paper trail (genetic tests, herbarium matches) that auditors can check.
      *   **Baseline Compliance:** They must meet the minimum threshold for federal/state restoration funding, which often legally defines "native" via geography and history.
  *   **The "Vibes" (The Metaphysical Layer):**
      *   **Purity Anxiety:** The rejection of the southern strain due to "hybrid ancestry" while accepting the local hybrid is a vibe. It is a moral judgment about contamination, not a biological one.
      *   **Nostalgia:** The 1960 cutoff vibes with the idea that human influence invalidates nature, except for the human influence that happened before 1960.
      *   **The "Lego Kit" View:** As you noted, treating plants as interchangeable units that must fit a specific historical model vibes with a mechanistic view of ecology, ignoring that ecosystems are complex adaptive systems.

  ### 3. The Hybrid Anxiety: Essence vs. Lineage vs. HPC
  Does the hybrid anxiety require an essence view? **Yes, mostly.**

  *   **Essentialism:** To reject the southern strain for "hybrid ancestry" while accepting the local strain (which is also hybridized, just older) is classic "blood quantum" logic. It assumes there is a pure "essence" of *Zostera* (eelgrass) or *Juncus* (rush) that gets diluted by mixing. If species were truly essential kinds, *any* hybridization would violate the essence. The fact that they forgive *old* hybrids proves they aren't true essentialists; they are **statutory essentialists**. They care about the *detection* of impurity, not the impurity itself.
  *   **Lineage View (Phylogenetic Species Concept):** A strict lineage view says species are branches on a tree. Hybridization blurs the branches. A lineage view could theoretically justify excluding the southern strain if it belongs to a different clade. However, a lineage view would also demand the exclusion of the local strain if it introgressed with non-native stock. The board's inconsistency here breaks the lineage logic.
  *   **Homeostatic Property Cluster (HPC):** An HPC view says a species is a cluster of traits (morphology, genetics, ecology) held together by underlying mechanisms (like gene flow or selection).
      *   *Can HPC justify the board?* Only weakly. If the "local adaptation" is the homeostatic mechanism, then the southern strain lacks the mechanism. But HPC is usually flexible about origins. If the southern strain clusters the same traits (heat tolerance, structure), HPC would argue it *is* the same kind functionally. The board's rejection suggests they value the *history of the cluster* over the *cluster itself*.
  *   **Pragmatic View:** This is the only one that actually explains the decision. The southern hybrid is "risky" (new, unproven in local courts/grants). The local hybrid is "safe" (grandfathered in). The anxiety isn't biological; it's bureaucratic.

  ### 4. What Changes if We Admit Kinds are "Made" by Management?
  If you shift the ontology from "Discovering Natural Joints" to "Constructing Functional Categories," here is what concretely changes in your meetings:

  1.  **From "Native" to "Appropriate":** You stop asking "Is this native?" (a metaphysical question) and start asking "Is this appropriate for the future climate and flood risk?" (a teleological question).
  2.  **Transparency on Trade-offs:** Currently, the board hides the trade-off behind "science." If you admit the categories are constructed, you must admit: *"We are choosing a slightly less heat-tolerant plant to maintain genetic continuity, which increases flood risk."* This forces a political decision rather than hiding it behind a genetic test.
  3.  **The 1960 Rule Becomes a Budget Line:** Instead of a sacred baseline, the pre-1960 standard becomes a cost. "It costs 20% more to source pre-1960 genetics; is the ecological benefit worth that budget reduction?"
  4.  **Hybrids Become Tools:** Instead of "contaminants," hybrids become "R&D." You might actively breed local/southern hybrids to create a new "restoration kind" specifically designed for the 2050 climate, acknowledging it is a new thing, not a restoration of an old thing.

  ### 5. Verdict: Incoherent or Underdetermined?
  **The practice is logically incoherent but administratively rational.**

  You are not overreading the annoyance. The logic is definitely incoherent:
  *   **Premise A:** Genetic purity (pre-1960/local) is required for ecological integrity.
  *   **Premise B:** Climate resilience (southern stock) is required for ecological integrity.
  *   **Premise C:** Southern stock with hybrid ancestry violates integrity.
  *   **Premise D:** Local stock with hidden hybrid ancestry maintains integrity.
  *   **Conclusion:** Therefore, undetectable hybridization is good, and detectable hybridization is bad.

  This is a contradiction. However, it is **not** a mistake. It is a feature of the system.
  *   **Why?** Because the board is not optimizing for *ecological truth*; they are optimizing for *insurability*.
  *   The "Local-looking line" is insurable because no one can sue them for it (it matches the herbarium).
  *   The "Southern strain" is uninsurable because if it fails, they can be blamed for importing "alien genetics."

  **Summary:** The board is treating "Native Species" not as a biological natural kind, but as a **regulatory technology**. It is a label used to transfer liability from the restoration managers to the concept of "Nature itself." If the plants fail, they can say, "We used the correct native kind; nature just didn't take." If they used the southern hybrid and it failed, the failure is *their fault*.

  **Advice for your next meeting:**
  Don't argue biology; they will hide behind the genetics report. Argue **risk**.
  *"If the goal is flood prevention (given my apartment flooded twice), and the climate models say this area will be hotter, does the 'Pre-1960' rule increase the risk of restoration failure? Are we prioritizing the integrity of the historical record over the integrity of the levee?"*

  That forces them to admit that "Native" is a choice, not a discovery.
