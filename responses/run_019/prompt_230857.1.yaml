answer: |-
  It is completely understandable that you and your friend ended up in that specific kind of intellectual trench warfare, because the demarcation problem is less a puzzle waiting to be solved and more a symptom of a deeper confusion about what we want the word science to do for us. Your hunch that the impasse is partly verbal is correct, but I think it runs deeper than just a mix-up between descriptive and normative accounts. The disagreement is structural because both of you were trying to use a single concept to perform two incompatible jobs. On one hand, you want science to be a descriptive category that accurately captures the historical and sociological reality of how researchers actually work, which includes messy paradigms, theory-laden observation, and periods of stagnation. On the other hand, you want science to be a normative badge of honor that guarantees reliability, truth-tracking, and public trust. The reason the literature looks like a stalemate is that every time a philosopher proposes a criterion that fits the descriptive reality, it fails to exclude pseudoscience, and every time they propose a criterion that successfully excludes pseudoscience, it fails to describe actual scientific history.

  When you argue about falsifiability, you are arguing about the normative job. Your friend wants a logical shield that protects public discourse from nonsense, and falsification offers a clean, sharp line that feels like it protects the integrity of knowledge. When you argue about ad hoc excuses and historical context, you are arguing about the descriptive job. You are pointing out that real scientists also retreat to ad hoc hypotheses, protect their core theories from refutation, and operate within social structures that resemble the ones astrologers use. The impasse exists because neither of you is wrong about the phenomena you are pointing to, but you are disagreeing about which job the word science should prioritize. If science is defined by its method, then astrology fails, but so does some legitimate science. If science is defined by its community consensus and institutional success, then astrology fails, but the definition becomes too sociological to offer the logical guarantee your friend wants. This suggests the disagreement is not factual, since you likely agree on the history of physics and the claims of astrology, nor is it purely about standards of evidence, since you both value evidence. It is a disagreement about bedrock intuitions regarding whether knowledge requires a timeless essence or if it is merely a family resemblance of practices.

  The parties are literally answering different questions under one label, but they are doing so because society demands that the label do both things at once. We want to know if a claim is scientifically true, which implies a connection to reality, but we also want to know if it is scientifically produced, which implies a connection to institutional authority. The demarcation problem persists because it is a proxy for a political struggle over who gets to decide what counts as reliable knowledge. If you define science too narrowly, you exclude valuable inquiries like historical geology or string theory. If you define it too broadly, you open the floodgates to conspiracy theories and magical thinking. The literature reflects this because every attempt to fix the definition is actually an attempt to fix the boundary of authority. Popper was worried about dogma and totalitarianism, so he built a logic that favored risk. Kuhn was worried about the myth of linear progress, so he built a history that favored communities. They were not solving the same problem.

  Given this diagnosis, I do not think a better criterion is possible, because any static criterion will eventually be outpaced by the evolution of inquiry itself. An empirical finding will not solve it either, because the issue is conceptual, not observational. The only path to progress is a sharper question that dissolves the need for a hard boundary. Instead of asking whether astrology is science, we should ask whether specific astrological claims are reliable for specific purposes. We should shift from demarcation to evaluation. We can acknowledge that some scientific practices are unreliable and some non-scientific practices are reliable without collapsing the distinction entirely. Progress looks like admitting that science is not a natural kind with a hidden essence, but a cluster of virtues like transparency, error correction, and predictive success that can be present in degrees. If you and your friend could agree to stop asking if astrology belongs in the club and start asking whether it produces actionable knowledge compared to other methods, you would bypass the philosophical deadlock.

  Ultimately, you should probably accept that the debate will never end in a final victory for one side, because the term science serves a social function that requires it to be somewhat ambiguous. It needs to be flexible enough to include new discoveries but rigid enough to exclude charlatans. The impasse is a feature, not a bug, of our epistemic ecosystem. However, you can move past the frustration by recognizing that your friend is defending the institutional authority required for public trust, while you are defending the intellectual honesty required for accurate description. Neither of you needs to move an inch on the facts, but you both need to move on the expectation that a single word can resolve the tension between how we know things and who we trust to tell us. The most honest argument is that the demarcation problem should not end, but our reliance on it as a decisive tool should. We are better off evaluating claims on their own merits than hiding behind a label that tries to do too much work.
