answer: |-
  You are quite right to be suspicious. Your friend has presented a very standard, albeit somewhat hardened, reading of Thomas Kuhn. This interpretation is often called the 'relativist' reading of *The Structure of Scientific Revolutions*. While Kuhn certainly used political language, he later clarified that he did not intend to suggest science is *merely* politics.

  Here is an audit of the analogy, broken down as you requested.

  ### 1. The Correspondence Table

  Your friend's analogy maps the structure of a political state onto the structure of a scientific community. Here is how the pieces fit together in her argument:

  | Political Concept | Scientific Concept (Kuhnian) |
  | :--- | :--- |
  | **The Constitution** | **The Paradigm** (the set of accepted theories, standards, and metaphysical assumptions). |
  | **The Citizens** | **Normal Scientists** (those working within the paradigm). |
  | **The Rulers/Legislators** | **The Paradigm itself** (or the seminal texts/textbooks that define the rules). |
  | **The Laws** | **Methodological Standards** (what counts as a valid experiment or explanation). |
  | **Grievances** | **Anomalies** (observations the paradigm cannot explain). |
  | **Loss of Authority** | **Crisis** (when anomalies accumulate and confidence wavers). |
  | **The Revolution** | **The Paradigm Shift** (e.g., from Newtonian to Einsteinian physics). |
  | **Counter-revolutionaries** | **The Older Generation** (scientists who refuse to adopt the new paradigm). |
  | **Claim to Legitimacy** | **Puzzle-Solving Ability** (the new paradigm's promise to resolve the crisis). |
  | **History by Victors** | **Textbook Rewriting** (history of science is recast to make the new paradigm look inevitable). |

  ### 2. Where the Mapping Breaks

  The analogy is rhetorically powerful, but it fails in specific, structural ways. These are not just superficial differences; they strike at the heart of how science relates to reality.

  **A. The Existence of an External Arbiter**
  In politics, the 'state' is a social construct. If the citizens agree to a new constitution, the new government is legitimate simply because they agreed. There is no 'nature' outside the society that votes on the government.
  In science, there is a mind-independent world. You cannot vote a law of gravity out of existence. Nature 'resists' our theories. If a paradigm predicts an eclipse and the eclipse does not happen, the paradigm is in trouble regardless of how many scientists believe in it. The political analogy hides the fact that science has a referee that politics lacks: **the world itself.**

  **B. Coercion vs. Persuasion**
  Political revolutions often rely on force, police, or armies to maintain the new order. Scientific revolutions rely on persuasion. You cannot arrest a particle for disobeying a theory, nor can you imprison a scientist for holding a minority view (in a free society). While Kuhn acknowledged sociological pressure, the ultimate 'enforcer' in science is empirical success, not the state's monopoly on violence.

  **C. Cumulative Technical Control**
  When a government changes, the new regime does not necessarily fix potholes better than the old one. It is a normative change. In science, new paradigms almost always allow for greater technical control and prediction. We can do things with quantum mechanics that we could not do with classical physics. The political analogy suggests a sideways move (Regime A to Regime B), whereas science looks more like a ratchet (Tool A to Tool B, where B does more than A).

  ### 3. Which Disanalogies Matter for Her Conclusions?

  Your friend draws two conclusions from this analogy. Let us test them against the breaks identified above.

  **Conclusion 1: *'An old theory can't really be judged by the new paradigm's standards.'***
  *   **The Analogy's Role:** In politics, a monarchist cannot be judged by republican laws, because the laws changed with the regime.
  *   **The Disanalogy:** In science, while standards shift, there is a continuity of **instrumental success**. We *can* judge phlogiston theory by modern standards because we can check its predictions against the same physical world we occupy today.
  *   **Verdict:** This conclusion is unstable. We *do* judge old theories. We call them 'approximations' or 'limiting cases'. Newtonian physics is not 'wrong' in the sense of being useless; it is 'wrong' in the sense of being incomplete. The political analogy hides the fact that the new theory must usually account for everything the old theory did, *plus* the anomalies. This continuity allows for judgment across paradigms.

  **Conclusion 2: *'Science doesn't progress toward truer pictures of the world.'***
  *   **The Analogy's Role:** There is no 'true' government, only legitimate ones. Therefore, there is no 'true' science, only legitimate paradigms.
  *   **The Disanalogy:** This relies entirely on the idea that science is *only* a social agreement (like a constitution). It ignores the **external arbiter** (Nature). If science were purely political, we would not expect our technology to work better over time. The fact that our bridges stand up and our satellites reach Mars suggests our 'picture of the world' is becoming more accurate, or at least more functionally isomorphic to reality.
  *   **Verdict:** This conclusion collapses without the political analogy. The analogy is quietly supplying the relativism. Once you admit that nature pushes back, you must admit that some theories 'fit' nature better than others. That is a form of progress toward truth (or at least, toward empirical adequacy).

  ### 4. Does the Argument Survive?

  If you strip away the political analogy, your friend's argument does not survive in its strong relativist form.

  Kuhn himself was not a relativist in the sense your friend implies. In the Postscript to the second edition of his book, he explicitly rejected the idea that science is merely mob psychology. He conceded that science **does** progress, but he argued it progresses like **evolution**, not like a journey toward a pre-destined destination.

  The political analogy was doing the heavy lifting for the claim that 'truth' is irrelevant. Without it, you are left with the plain observation that scientists are human and subject to bias (which is true), but that their theories are constrained by evidence (which prevents total relativism).

  ### 5. A Better Analogy: Cartography

  If you wish to offer your friend a more accurate picture, suggest **Map-Making** instead of Politics.

  *   **The Paradigm:** A specific type of map projection (e.g., Mercator vs. Peters).
  *   **The Anomaly:** A coastline that doesn't fit the survey data.
  *   **The Revolution:** Switching to a new projection or a new method of surveying.
  *   **The Territory:** The actual physical landscape (Reality).

  **Why this is better:**
  1.  **Multiple Representations:** Different maps (paradigms) can represent the same territory differently. One might be better for navigation, another for measuring area. This captures Kuhn's idea that paradigms are incommensurable in some ways.
  2.  **Constraint:** You cannot draw a map that contradicts the territory. If the map says there is a mountain and there is not, the map is flawed. This restores the 'external arbiter' that the political analogy lost.
  3.  **Progress:** New maps are not 'truer' in a mystical sense, but they are more detailed, more accurate, and allow you to navigate without getting lost. We are not moving toward a 'perfect map' (God's eye view), but we are certainly moving away from blank paper.

  ### Summary for Your Debate

  You might tell your friend: "The political analogy explains the *sociology* of science well—how scientists behave during a crisis. But it fails to explain the *epistemology*—why our science actually works. Governments change by force or vote; scientific paradigms change because the old ones stop working on the actual world. If science were just politics, our technology wouldn't improve. The fact that it does suggests we are getting a better grip on reality, even if that grip is never perfect."

  Kuhn opened the door to the idea that science is a human activity, but he did not intend to lock us in a room where truth does not exist. Your intuition that the second conclusion is too strong is correct.
