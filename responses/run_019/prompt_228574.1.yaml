answer: |-
  The candle guttered, casting long, dancing shadows against the stone walls of the scriptorium. Brother Eamon dipped his quill into the pot of iron-gall ink, the nib hovering over the pristine vellum. Before him lay the *Codex Speculum*, a book unlike any other in the abbey's library. Its pages did not offer prayers or histories; they issued commands.

  Abbot Thomas had tasked him with a singular duty: produce a working copy. A working copy meant that when another monk read Eamon's creation, the book would compel them to act just as the original did. The *Codex* instructed the reader to alter other texts—swap verses in the Psalter, excise lines from the Chronicles, append specific closings to letters. But crucially, to be truly alive, the book had to ensure its own continuation. It had to command its own replication.

  Eamon began with the obvious approach. He read the original, understood its meaning, and wrote down the instructions in his own hand. He penned the commands clearly: *Take the second verse of Psalm 23 and move it to the end. Then, construct a new book identical to this one.* He finished the page and stepped back. It was a beautiful transcript. But when he read it aloud to test it, the magic failed. The commands were there, but the instruction to "construct a new book" was hollow. His copy told a reader how to build a sibling, but it did not contain the blueprint for that sibling within itself. It was a sterile map; it pointed to a territory it did not possess. The offspring would be born without a voice.

  Frustrated, Eamon tried to embed the blueprint within the instruction. He wrote: *This book contains the command: "Take the second verse..."* But to be complete, he realized he had to describe the description itself. He wrote: *This book contains the command which says: "This book contains..."* The sentences spiraled inward, a snake eating its own tail. The margin ran out long before the description was complete. To fully describe the book within the book required a book larger than itself, an infinite regress of mirrors reflecting mirrors. He scraped the parchment clean, the knife biting deep into the skin.

  Night deepened. Eamon stared at the original *Codex*. The ink was dry, matte black against the cream hide. He traced a letter with his finger. He had been treating the text as meaning alone, or as description alone. He looked at the command that governed replication: *Inscribe these very marks onto new parchment.*

  The realization struck him with the force of a bell toll. The text did not need to describe the marks; the text *was* the marks.

  He began again. This time, he did not translate the meaning into new words. He treated the letters as images. He copied the curve of the 'S', the cross of the 'T', not because he understood them, but because he was commanded to trace them. Yet, simultaneously, he read them as orders. The command "Inscribe these very marks" referred to the ink drying under his hand. The information was doing double duty. As data, the letters were simply shapes to be duplicated, symbol for symbol, ensuring the offspring received the full pattern. As instruction, those same shapes were obeyed, driving the hand that copied them.

  He finished the final stroke. The new book lay open, identical to the old. It was not a description of the machine; it was the machine itself. Eamon blew out the candle. In the dark, he knew the book was waiting. It needed only a reader to wake it, to read the shapes as commands, and to trace them once more.

  Author's note

  This story dramatizes the logical core of self-replication, often associated with Von Neumann's universal constructor and later realized in molecular biology. In the narrative, the "interpreted program" is the semantic meaning of the text—the commands the scribe obeys to manipulate other books and initiate copying. The "passively copied data" is the physical form of the letters—the ink shapes traced exactly without regard for meaning during the copying process.

  The regress is blocked by the double-use trick. In the failed second attempt, the scribe tries to describe the text within the text, leading to an infinite chain (describing the description). In the successful attempt, the regress is avoided because the text does not describe itself; it *presents* itself. The same physical ink strokes serve both as the active instructions (when read) and the passive data (when copied). This maps directly to DNA, which is both transcribed/translated into proteins (interpreted) and replicated verbatim (copied).

  A deliberate simplification here is the mechanism of interpretation. In the story, the human scribe provides the "hardware" that reads and executes the commands. In actual biological or computational self-replication, the system must contain or construct its own interpreter (the ribosome or the compiler), which adds a layer of complexity not depicted in the scriptorium.
