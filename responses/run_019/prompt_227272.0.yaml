answer: |-
  # Dissertation Workshop Prep Sheet: Tranquilism & Population Ethics
  **Timeframe:** 10 Days | **Goal:** Survive Q&A without conceding the core axiology.

  ## Strategic Overview
  Your position is axiologically negative (value = absence of bad) but population-ethically asymmetrical (no duty to create good, duty to prevent bad). Your vulnerability is that your axiology sounds like it collapses into hedonistic nihilism or wireheading.
  *   **Your Anchor:** Distinguish *experiential quality* (what it feels like) from *axiological weight* (what makes the world better).
  *   **Your Tone:** Calm, precise, willing to bite small bullets to avoid the big ones.

  ---

  ## 1. The Phenomenologist (Affective Mind)
  **Damage Level:** Critical. If pleasure can exist without craving, your core definition of "good" collapses.
  **The Objection:** *"You draw a clean line between craving-relief and pleasure. But consider 'surprise joy.' I'm walking along, perfectly content, no craving for music. A street band plays, I listen, and I experience positive affect. It wasn't relieving a lack; it was adding a positive phenomenological layer. Why is that axiologically neutral?"*

  *   **Concede Up Front:** "You're right that the *phenomenology* is positive. I'm not denying the experience feels good."
  *   **Hold:** "Feeling good isn't the same as making the world *better* in the moral sense."
  *   **2-Minute Reply:** "Tranquilism isn't a theory of sensation; it's a theory of *need*. In your example, I'd argue there's a latent, low-level craving for stimulation or novelty that we only notice once satisfied. But even if we grant it's 'pure' pleasure: my claim is that value is tethered to the *subject's standpoint*. For the contented person, the music is a bonus, not a requirement. If we say the world is *better* because of that music, we imply the contented person was somehow *lacking* before. That reintroduces a subtle perfectionism I want to avoid. The music is a gift, but its absence wasn't a harm."
  *   **Honest Soft Spot:** If they press on "pure surprise delight" where no latent curiosity existed, you have to bite the bullet: "Then it is axiologically neutral. It makes life nicer, but not more valuable." This sounds cold; deliver it gently.

  ## 2. The "Nuclear Option" (The Perfect Sedative)
  **Damage Level:** Critical. This is the *Wirehead Objection*. If you answer poorly, you look like you endorse a Matrix-style dystopia.
  **The Objection:** *"If the absence of craving is the only intrinsic good, and technology could induce a permanent, side-effect-free state of cravingless contentment (a 'perfect sedative'), does your view obligate us to drug the population?"*

  *   **Concede Up Front:** "This is the standard reductio for negative views, and it's the right question to ask."
  *   **Hold:** "Tranquilism values *robust* agency without friction, not chemical stupor."
  *   **2-Minute Reply:** "Two points. First, empirically, sedatives create dependency, which is a new, powerful craving. So in the real world, they fail the test. Second, conceptually: Tranquilism isn't about the *feeling* of tranquility, but the *state* of having no unmet needs. A drug-induced state is fragile; it relies on an external crutch. If the drug wears off, the craving returns violently. A tranquilist values a resilience that doesn't require constant chemical intervention. So, no: we shouldn't drug people, because that creates a world vulnerable to massive future suffering."
  *   **Honest Soft Spot:** If they posit a *magic* pill with zero dependency/withdrawal that lasts forever... you might have to concede. "If such a thing were metaphysically possible, yes, that would be the ideal state." Don't fight this too hard; it shows consistency.

  ## 3. The Pinprick vs. Utopia (Scaling)
  **Damage Level:** High. This makes your view counterintuitive regarding aggregation.
  **The Objection:** *"Compare World A: 1 billion people in ecstatic flourishing. World B: 1 billion people in bland contentment, plus one person with a stubbed toe. Your view seems to rank these too closely, or even prefer B if the toe is minor. Does tranquilism really imply the utopia adds no value over the bland world?"*

  *   **Concede Up Front:** "It does imply the utopia adds no *intrinsic* value over the bland world."
  *   **Hold:** "We are measuring *badness*, not *goodness*. The intuition pump relies on smuggling in total utilitarianism."
  *   **2-Minute Reply:** "The intuition that World A is better assumes pleasure adds positive weight. Tranquilism says pleasure is the 'zero' point of suffering, not a positive integer. So World A and the 'bland' part of World B are equal. The only difference is the stubbed toe in B. So yes, strictly speaking, a world with a stubbed toe is worse than a utopia, but only by the magnitude of the toe. This sounds wild, but it preserves the Asymmetry. It explains why we have a duty to fix the toe, but no duty to create the utopia. If we say the utopia is 'better,' we risk justifying the toe for the sake of the ecstasy. I'd rather risk the counterintuitive ranking than justify suffering for the sake of 'extra' happiness."
  *   **Honest Soft Spot:** It *is* counterintuitive. Acknowledge the cost. "I know this clashes with the 'More is Better' intuition, but that intuition is what leads to the Repugnant Conclusion. I'm trading one bullet for another."

  ## 4. The Total Utilitarians (The Canon)
  **Damage Level:** Medium-High. They reject your population ethics conclusion.
  **The Objection:** *"The Asymmetry is unstable. If bringing a miserable person is bad because they suffer, why isn't bringing a happy person good because they enjoy? You're treating the two poles differently without a metaphysical justification."*

  *   **Concede Up Front:** "It is an asymmetry, and it requires a person-affecting constraint."
  *   **Hold:** "Existence is not a benefit to the non-existent."
  *   **2-Minute Reply:** "The justification is the 'No Subject' problem. When we bring a miserable person into existence, there is now a subject who is harmed. When we bring a happy person into existence, there is no subject *beforehand* who was waiting for this benefit. You can't say you did a favor for someone who didn't exist. The 'bad' of suffering attaches to an existing subject. The 'good' of pleasure, on my view, is just the absence of that subject's craving. So creating a new subject creates new potential for craving. It's a risk with no compensatory upside for the universe, only for the individual once they exist."
  *   **Honest Soft Spot:** This relies heavily on the Person-Affecting View, which the canon dislikes. Be prepared for them to call it "metaphysically magical."

  ## 5. The Preference Utilitarian (Workshop Lead)
  **Damage Level:** Medium. Technical quibble on "craving" vs. "preference."
  **The Objection:** *"You talk about 'craving,' which sounds like a visceral, negative state. But what about cool, rational preferences? I prefer that my book gets published. It's not a 'craving' or suffering if it doesn't happen. But satisfying it seems good."*

  *   **Concede Up Front:** "I use 'craving' broadly to mean any active preference state."
  *   **Hold:** "Unsatisfied cool preferences are still a form of friction/tension."
  *   **2-Minute Reply:** "I'd argue that even a 'cool' preference is a disposition to act. If your book isn't published, you have a standing disposition to fix that. That's a form of tension, even if it's not agonizing. Tranquilism counts all active goal-states as deviations from the baseline. When the book is published, the tension resolves. That resolution is the value. If you had no preference for the book, and it wasn't published, there's no loss. So the value is still in the relief of the preference, not the 'presence' of the published book."
  *   **Honest Soft Spot:** If they describe a preference they *forgot* they had (e.g., a will executed after death), you can't claim relief was felt. Concede: "Posthumous preferences are a known problem for all preference views. I don't claim to solve that specifically, but it doesn't undermine the core axiology."

  ## 6. The Suffering-Focused Ally
  **Damage Level:** Low. They want to ensure you aren't smuggling in positive value.
  **The Objection:** *"You say relief of craving is good. Isn't 'relief' just a positive sensation? If so, aren't you just a hedonist who focuses on the negative end of the scale?"*

  *   **Concede Up Front:** "Relief often feels positive."
  *   **Hold:** "The value is in the *cessation*, not the feeling."
  *   **2-Minute Reply:** "Think of it like debt. Paying off a debt feels good, but the value is that you owe nothing, not the feeling of writing the check. If I relieve a craving but the phenomenology is neutral (e.g., I scratch an itch in my sleep), the value is still there because the craving is gone. So the value is ontological (state of the agent), not phenomenological (feeling of relief)."
  *   **Honest Soft Spot:** This is a semantic fight. If they insist "relief" is a positive qualia, you might have to agree to disagree on the label while holding on the structure.

  ---

  ## General Q&A Survival Tactics

  1.  **The "Niceness" Trap:** When they say, "But surely a world with music is *nicer*," agree! "Nicer, yes. More valuable, no." Distinguish *aesthetic/personal* value from *moral/axiological* value.
  2.  **The "Depression" Trap:** If someone asks, "Does this view valorize depression/apathy?"
      *   *Reply:* "No. Depression is often a conflict between 'how I am' and 'how I want to be.' That conflict is suffering. Tranquility is the absence of that conflict. Apathy is often a resignation that hurts. Contentment is robust."
  3.  **Time Management:** If an objection takes 3 minutes to state, spend 1 minute summarizing it back ("So the worry is X...") and 1 minute answering. This keeps control.
  4.  **The "Magic Pill" Honesty:** If they corner you on the Perfect Sedative (Section 2), do not squirm. Say: "If the technology were truly risk-free and permanent, my view would endorse it. The fact that we recoil tells us more about our bias for 'struggle' than the truth of the theory. But since it's not risk-free, we don't have to do it."

  ## Final Note for the Presenter
  You are defending a minority view. The audience expects you to be defensive. Instead, be **explanatory**. You aren't trying to convert the Total Utilitarians; you are trying to show that Tranquilism is a *coherent* alternative that solves the Asymmetry problem better than their views do. If you leave them thinking "I disagree, but I see how that solves the Non-Identity Problem," you have won.
