answer: |-
  This is a classic formulation of the **"Numbers Problem"** for Scanlonian contractualism. Your classmate has constructed a *reductio ad absurdum* that has kept moral philosophers busy for over two decades. The argument is valid; if your premises are correct, the conclusion follows. Therefore, to save contractualism, you must show that one of the premises is false or, more likely, that the *interpretation* of a premise is flawed.

  Here is the diagnosis of the error, an evaluation of the alternatives you requested, and a recommendation on how to proceed.

  ### 1. Locating the Error: Premise (4) and the Interpretation of (2)

  The error lies in **Premise (4)** ("To choose between principles, then, one compares the strongest complaint on each side"), supported by a rigid interpretation of **Premise (2)**.

  **Why it looked plausible:**
  This step mimics the **Individualist Restriction** (Premise 3). It feels like the faithful application of contractualism: we justify principles to *each* person, not to a collective. If we compare Mara's complaint to the residents' complaints one-by-one, Mara's complaint (death) outweighs any single resident's complaint (paralysis). It seems to honor the "separateness of persons."

  **Why it is wrong:**
  Premise (4) assumes that the *only* factor in reasonable rejection is the **magnitude of the individual burden**. It ignores the **context of the choice** and the **ex ante perspective**.

  In Scanlon's framework, a principle is rejectable if there is an alternative that imposes a *lesser burden* on someone. However, "lesser burden" is not assessed in a vacuum. It is assessed based on **generic reasons** that people have. While we cannot *aggregate* the pain of the 10,000 residents to create a "super-complaint" heavier than Mara's, we can consider the **fairness of the principle** governing the choice.

  A principle that says "Always save the single person from the greater harm, regardless of how many suffer the lesser harm" is one that **everyone**, including Mara, could reject from an *ex ante* position (before knowing who they are). Why? because everyone has a generic interest in living in a society where catastrophic harms to large groups are minimized, even if the individual harm is slightly less severe.

  Therefore, the comparison in (4) is too narrow. It is not just "Mara's Complaint vs. Resident #1's Complaint." It is "Mara's Complaint vs. The Generic Reason available to the Residents." When the number of residents is large enough, the generic reason to avoid a principle that condemns thousands to paralysis becomes strong enough to outweigh Mara's specific claim to life, *even if death is worse than paralysis*.

  ### 2. Pricing the Alternatives

  You asked to price three specific routes. Here is the cost-benefit analysis for a contractualist.

  #### A. Dropping or Softening the Individualist Restriction
  *   **The Move:** Allow the complaints of the 10,000 residents to be summed. 10,000 units of paralysis > 1 unit of death.
  *   **The Price:** **High.** This collapses contractualism into a form of **pluralist consequentialism**. The distinctive feature of contractualism is that it treats the "separateness of persons" as a fundamental constraint on justification. If you allow aggregation of complaints, you lose the ability to explain why we owe duties to individuals that cannot be overridden by the general good. You save the verdict (save the 10,000) but lose the theory.
  *   **Verdict:** Do not do this if you want to remain a contractualist.

  #### B. Scanlon's Route: Numbers Break Ties Among "Relevantly Similar" Claims
  *   **The Move:** Scanlon (*What We Owe to Each Other*, pp. 236–240) argues that numbers count when claims are **relevantly similar**. If Mara and the residents face the *same* harm (e.g., death), you must save the greater number. You cannot justify to the two who die why they should be sacrificed for the one when their claims are identical.
  *   **Applicability to this Case:** The hurdle is your stipulation: Death is *worse* than Paralysis. Are they "relevantly similar"?
      *   *Defense:* You can argue that "permanent, severe paralysis" is a **catastrophic, life-ruining harm** that is relevantly similar to death in the context of rescue principles. Both destroy the victim's life prospects. If they are relevantly similar, numbers break the tie, and you save the 10,000.
      *   *Risk:* If the harm to the residents were minor (e.g., a broken arm), this route fails. It risks looking ad hoc: defining "similarity" precisely wide enough to get the result you want.
  *   **Verdict:** **Moderate Price.** This is the standard contractualist defense. It works well here if you argue successfully that severe paralysis is relevantly similar to death. It fails in cases of truly dissimilar harms (Death vs. Broken Arm), requiring a backup argument.

  #### C. Building More into "Reasonable to Bear"
  *   **The Move:** Argue that while death is worse, it is not **reasonable** for Mara to demand survival when the cost is the paralysis of 10,000 others. Her complaint is "stronger" in terms of pain, but "weaker" in terms of reasonable rejectability.
  *   **The Price:** **Risk of Circularity.** If "reasonable" just means "what yields the correct moral verdict," you have defined the problem away.
  *   **Mitigation:** To avoid circularity, you must ground "reasonableness" in **fairness** or **reciprocity**. It is unfair to impose a massive collective burden (10,000 paralyzed) to spare one person a marginal increase in harm (death vs. paralysis). This appeals to a notion of **social cooperation**: principles must be sustainable for the community.
  *   **Verdict:** **Low to Moderate Price.** This is often combined with the *ex ante* argument. It preserves the Individualist Restriction by focusing on the *relationship* between the parties rather than the sum of outcomes.

  ### 3. The Pure Tie Case (1 Life vs. 2 Lives)

  You asked what a consistent contractualist should say here, and whether it forces an answer in the paralysis case.

  **The Verdict:** A consistent contractualist **must save the two**.
  **The Reasoning:** This is the clearest case for Scanlon. The claims are **identical** (life vs. life). The Individualist Restriction prevents you from saying "2 lives > 1 life" in a utilitarian sense. However, it permits you to say: "I cannot justify to these two people why they should die so that this one person may live, when their claims are equal." The number of people provides a **tie-breaking reason** without aggregating value.

  **Does this force an answer in the Paralysis Case?**
  It creates a **presumption**, but not a logical necessity.
  *   In the 1 vs. 2 life case, the claims are *equal*, so numbers decide.
  *   In the Mara vs. Residents case, the claims are *unequal* (Death > Paralysis).
  *   **The Bridge:** If you accept that numbers can break ties among equal claims, you have admitted that **numbers matter** in contractualism. The question is only *how much* inequality in harm is required to outweigh the numbers.
  *   If you accept the "Relevant Similarity" move (Option B above), then the 1 vs. 2 case and the Mara case are structurally identical: the harms are close enough that the numbers tip the scale.
  *   If you reject Relevant Similarity, you must explain why the 1 vs. 2 case allows numbers to count, but the 1 vs. 10,000 case does not. That is a difficult position to maintain.

  ### 4. Recommendation: The "Ex Ante" + "Relevant Similarity" Defense

  To defeat your classmate's argument without abandoning contractualism, you should reject the inference in **Premise (4)** by adopting a hybrid of Scanlon's **Relevant Similarity** and the **Ex Ante Perspective**.

  **The Argument:**
  1.  **Reject Premise (4)'s simplification:** Reasonable rejection is not a simple comparison of maximum individual pain. It is a test of whether a principle can be justified to everyone affected.
  2.  **Invoke Relevant Similarity:** Argue that permanent, severe paralysis is **relevantly similar** to death. Both are catastrophic losses of normal life functioning. Therefore, the claims are comparable.
  3.  **Invoke Ex Ante Agreement:** Ask: "What principle would we agree to *before* knowing if we are Mara or a resident?"
      *   If we agree to "Save Mara," we accept a 10,000/10,001 chance of paralysis.
      *   If we agree to "Save Residents," we accept a 1/10,001 chance of death.
      *   Given that paralysis is relevantly similar to death, a rational agent would choose the principle that minimizes the *probability* of catastrophic harm.
  4.  **Conclusion:** Mara cannot reasonably reject the principle that saves the 10,000, because that is the principle she would have agreed to from a fair, ex ante position. Her complaint is outweighed not by the *sum* of the residents' pain, but by the **fairness of the rule** governing the rescue.

  **Why this works:**
  It preserves the Individualist Restriction (you aren't summing pain; you are testing a rule for universal acceptability). It avoids circularity (grounding reasonableness in rational agreement). It handles the pure tie case consistently (numbers break ties among similar claims). And it blocks the *reductio* (it does not imply saving 1 over a billion; at some point, the generic reason to avoid mass catastrophe outweighs the individual claim to life, even if the individual harm is slightly greater).

  **Final Note for the Seminar:**
  Tell your classmate that her argument relies on a "straw man" version of contractualism that ignores the **ex ante** dimension of reasonable agreement. Contractualism is not about comparing static complaints; it is about finding principles for **general agreement**. No one could reasonably agree to a principle that sacrifices thousands to save one from a marginally worse fate, because that principle fails the test of reciprocity.
