prompt: |-
  I help run a first-year undergrad discussion group (about 12 students, we get 75 minutes) and our next session is on population ethics. Instead of me explaining the nonidentity problem and watching everyone nod politely, I want an activity where they blunder into it themselves and only hear the name at the very end. Design me the full thing: setup, materials, sequence, and debrief.

  Here's the rough shape I have in mind but please improve on it or replace it: something like a role-play where the group acts as the planning board of a newly founded settlement (or a colony ship, or a town council) and has to pick between two policies -- one clearly better on the usual measures, one with some built-in downside for a future generation. The catch, which they should NOT be told up front, is that whichever policy they pick determines which specific people end up existing (I'd want a concrete mechanism for this in the activity, like the policy choice determining which envelopes/cards of "future residents" get opened). Then later in the session a harm or complaint should surface from one of those future residents, and the group has to deliberate about whether anyone was wronged and whether compensation is owed -- at which point they should discover, from their own earlier choice, that the person complaining wouldn't exist at all under the other policy. I want the moment where someone says "but she's lucky to exist" and then goes quiet because of what that implies. Real-ish small stakes if you can work them in (points, snacks, whatever) so the choices feel like choices.

  Then give me a debrief plan: map each beat of the activity onto the actual structure of the problem (the harmless-by-their-own-lights choice, the person-affecting intuition doing the pulling, where the "no one was wronged" conclusion starts to feel gamed), and tell me where students will predictably try to wriggle out -- e.g. treating the resident roster as fixed, sliding into rights talk, insisting the group "could have had both" -- and what it costs to hold each of those exits, so I can close the exits gently rather than by fiat. Also be honest about which part of the real problem the game can't capture and I'll just have to say in words afterward (I suspect it's something about existence across possible worlds vs. envelopes, but you tell me). No mini-lecture from me beforehand, and they shouldn't hear Parfit's name or the phrase nonidentity problem until the last ten minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year undergrads (approx. 12 students).
      *   **Time:** 75 minutes.
      *   **Topic:** Population Ethics (specifically the Non-Identity Problem).
      *   **Goal:** Students must "blunder into" the problem themselves through an activity, not be lectured. The term "Non-Identity Problem" comes only at the end.
      *   **Key Mechanism:** A choice between policies determines *who* exists (not just how well off they are). A future complaint arises, but the complainer wouldn't exist under the alternative policy.
      *   **Desired Reaction:** "But she's lucky to exist" -> silence/realization.
      *   **Requirements:** Setup, materials, sequence, debrief (mapping beats to theory, predicting escape routes, acknowledging limitations).
      *   **Constraints:** No mini-lecture beforehand. Real-ish stakes (points/snacks).

  2.  **Evaluate the User's Rough Shape:**
      *   *Idea:* Planning board/colony ship choosing policies.
      *   *Strengths:* Good framing. High agency.
      *   *Weaknesses:* Needs to be tight on time (75 mins is short for 12 students + activity + debrief). The mechanism for "who exists" needs to be foolproof so they don't miss the point. The "complaint" needs to feel personal, not abstract.
      *   *Improvement:* Make the stakes immediate (snacks/grades/points). Make the "future generation" reveal dramatic. Ensure the "harm" is clear but the "identity dependence" is undeniable.

  3.  **Drafting the Activity: "The New Horizon Settlement"**
      *   *Theme:* A colony ship or new settlement works well. Let's go with a **Colony Ship** (The *Aethelgard*). It isolates the group and makes the "future generation" distinct.
      *   *Roles:* 12 students = The Founding Council.
      *   *Decision:* Two Energy Policies (Safe/Expensive vs. Risky/Cheap).
      *   *The Twist:* The policy choice determines the *manifest* of the next generation.
      *   *The Harm:* The Risky policy causes a health issue (e.g., "Lung Rot") in Gen 2.
      *   *The Complaint:* A letter from a Gen 2 member.

      *Refining the Mechanism:*
      *   If I just say "Policy A creates People Set A," they might treat it as abstract.
      *   Better: Use sealed envelopes.
      *   *Step 1:* Vote on Policy (Green vs. Gold).
      *   *Step 2:* Green = Safe, High Cost (Less candy/resources now). Gold = Risky, Low Cost (More candy/resources now).
      *   *Step 3:* Reveal consequences.
          *   Green: No health issues. Envelopes contain "Healthy Citizen" cards.
          *   Gold: Health issue. Envelopes contain "Affected Citizen" cards.
      *   *Crucial Detail:* The *names* on the envelopes must be different depending on the choice. This is the technical core of non-identity. If the names are the same, it's just a harm problem. If the names are different, it's non-identity.
      *   *Wait, actually:* To make it punchy, maybe the *same* envelope is opened, but the *content* says "I am [Name], born because you chose Gold."
      *   *Better:* Have two sets of envelopes prepared. Set A (Green Choice) and Set B (Gold Choice). They only open the set corresponding to their vote. The names inside are totally different.
      *   *The Complaint:* One of the opened envelopes contains a "Letter of Grievance."

      *Stakes:* Snacks.
      *   Green Policy: Everyone gets a healthy snack (apple slice/healthy bar) but *no* candy.
      *   Gold Policy: Everyone gets candy *now*, but the "future" (simulated) suffers.
      *   *Correction:* To make it feel like a trade-off, the Council gets the candy now if they choose Gold. If they choose Green, they get nothing now (or less). This incentivizes the "bad" choice.

  4.  **Sequencing (75 Minutes):**
      *   0-5: Intro & Roles.
      *   5-20: The Decision (Deliberation + Vote).
      *   20-30: The Reveal (Opening Envelopes + Snack Distribution).
      *   30-45: The Complaint (Reading the Letter).
      *   45-65: Deliberation (The Trap).
      *   65-75: Debrief & Theory (Parfit).

  5.  **Refining the "Trap":**
      *   They need to feel the intuition that the person was wronged.
      *   They need to realize the person wouldn't exist otherwise.
      *   *Mechanism:* The Letter says: "I have Condition X. It makes my life hard (worth living, but barely). You chose Policy Gold. If you chose Green, I wouldn't have this."
      *   *Student Pushback:* "Choose Green!"
      *   *Facilitator Block:* "You already chose. You can't go back. The question is: Did you wrong *this specific person*?"
      *   *The Kicker:* The Facilitator reveals the Green Envelopes had *different names*. "If you chose Green, *Alex* (the complainer) is never born. *Sam* is born instead."

  6.  **Developing the Debrief:**
      *   Map the activity steps to Parfit's logic.
      *   *Person-Affecting View:* We think morality is about making people better off.
      *   *The Glitch:* Here, we made a person exist who is worse off than someone else *could* have existed, but not worse off than *they* would have been (since non-existence is the alternative).
      *   *Escape Routes:*
          *   "Just say they weren't wronged." (Counter-intuitive).
          *   "Say existence is always better." (Repugnant Conclusion adjacent).
          *   "Impersonal principles." (Total vs. Average).
      *   *Limitations:* The game uses discrete envelopes. Reality is continuous/probabilistic. The game implies determinism.

  7.  **Addressing Specific Constraints:**
      *   *No lecture upfront:* Check.
      *   *Names at the end:* Check.
      *   *Stakes:* Snacks/Candy.
      *   *Escape Routes:* Need specific scripts to handle "But they could have waited!" or "It's the same person!"

  8.  **Final Polish:**
      *   Make the instructions crystal clear for the facilitator.
      *   Ensure the "Different Names" mechanic is foolproof. (Pre-print two sets of manifests).
      *   Time management is tight. Need to keep deliberation strict.
      *   Add a "Facilitator Cheat Sheet" for the debrief.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 75 minutes enough?
      *   *Fix:* Keep the initial decision fast. Focus time on the *moral dilemma* phase.
      *   *Critique:* Will they notice the names are different?
      *   *Fix:* Make the Facilitator explicitly point it out *after* they argue. "Look at the Green Manifest. Is Alex on it?"
      *   *Critique:* Snacks might be distracting.
      *   *Fix:* Use them as the immediate reward for the "Risky" policy to show *why* the council chose it.

  10. **Finalizing the Plan:** (Proceeding to generate output based on these thoughts).
      *   *Title:* The *Aethelgard* Protocol.
      *   *Materials:* Envelopes, Manifests, Snacks, Timer.
      *   *Structure:* Decision -> Consequence -> Complaint -> Trap -> Reveal -> Theory.

  *(Self-Correction on the "Complaint"):* To make it really hit, the complaint shouldn't be "I'm dead." It should be "My life is significantly impaired, but still worth living." This is crucial for the Non-Identity Problem (NIP). If life isn't worth living, it's easy to say "Don't create them." NIP bites when the life *is* worth living, but is worse than the alternative person's life would have been. I need to emphasize this "Life Worth Living" constraint in the letter.

  *(Self-Correction on the "Names"):* I need to make sure the facilitator knows to swap the manifests based on the vote *before* the students see them. Or have two distinct piles labeled "Outcome A" and "Outcome B" and they only open the one they picked. The latter is safer.

  Let's write it.cw
answer: |-
  Here is a complete session plan designed to guide 12 first-year students into the Non-Identity Problem (NIP) through experience rather than exposition.

  # Session Title: The *Aethelgard* Protocol
  **Time:** 75 Minutes
  **Students:** 12 (The Founding Council)
  **Goal:** Students experience the intuition that a specific person was wronged, only to realize that person owes their existence to the "wronging" act.

  ## I. Materials & Prep
  1.  **Two Policy Briefs (Printed):**
      *   **Policy Alpha (Safe):** High resource cost. Guarantees stable infrastructure. No health risks for Gen 2.
      *   **Policy Beta (Efficient):** Low resource cost. Faster growth. *Known* 100% chance of a specific environmental toxin leak affecting Gen 2 (causes chronic pain/fatigue, reduces life quality, but **life remains worth living**).
  2.  **Two Sets of "Gen 2 Manifests" (Sealed Envelopes):**
      *   **Set A (Corresponds to Alpha):** Contains 12 cards with Names List A (e.g., Alice, Bob, Charlie...). Text: "You are healthy."
      *   **Set B (Corresponds to Beta):** Contains 12 cards with Names List B (e.g., Xavier, Yara, Zed...). Text: "You have the Chronic Condition."
      *   *Crucial:* **No name appears on both lists.**
  3.  **The "Grievance" Letter:** One specific letter written by "Xavier" (from List B).
  4.  **Stakes (Snacks):**
      *   If Alpha is chosen: Council gets plain crackers/water (symbolizing sacrifice for safety).
      *   If Beta is chosen: Council gets premium chocolate/cookies (symbolizing immediate benefit of efficiency).
  5.  **Whiteboard/Marker.**

  ---

  ## II. Sequence of Play (75 Minutes)

  ### Phase 1: The Mandate (0:00 – 0:10)
  *   **Setup:** Arrange chairs in a circle. Place the two Policy Briefs in the center.
  *   **Script:** "Welcome to the Founding Council of the *Aethelgard*. You are the sole governing body. You have 10 minutes to select the Energy Protocol for the settlement. There is no higher authority. Your decision is final and irreversible."
  *   **Instruction:** "Read the briefs. Discuss. Vote by show of hands. Majority rules."
  *   **Facilitator Role:** Silent observer. Do not offer moral guidance. If they ask "Which is better?", say "That is for the Council to decide."
  *   **The Trap:** Policy Beta offers immediate snacks for the Council *now*. Policy Alpha offers nothing for the Council *now*. Most groups will choose Beta because the "harm" is abstract and in the future, while the cookies are real.

  ### Phase 2: The Consequence (0:10 – 0:25)
  *   **Action:** Once the vote is cast, lock the decision. "The Protocol is set."
  *   **Distribution:**
      *   If **Alpha**: Distribute crackers/water. Hand out **Set A Envelopes**.
      *   If **Beta**: Distribute cookies/chocolate. Hand out **Set B Envelopes**.
  *   **Instruction:** "These envelopes represent the citizens of Generation 2. Please open them and read your identity card silently."
  *   **The Reveal:**
      *   If they chose Beta (likely), they see: "Name: Xavier. Status: Chronic Condition (Pain/Fatigue). Life Expectancy: Normal. Quality of Life: Reduced but Positive."
      *   *Facilitator Note:* Ensure they eat the cookies. This anchors the benefit they received in exchange for this outcome.

  ### Phase 3: The Grievance (0:25 – 0:35)
  *   **Action:** Hand the "Grievance Letter" to the student who drew "Xavier" (or read it aloud yourself if you want to control the tone).
  *   **Letter Content:**
      > "To the Founding Council,
      > I am writing to file a formal complaint. Because you chose Policy Beta, I was born with the Chronic Condition. I am in pain every day. I cannot work as hard as others. My life is difficult.
      > I know my life is still worth living—I am glad to be alive. But I know that if you had chosen Policy Alpha, the child born in my place would have been healthy.
      > You chose the policy that benefited *yourselves* (the cookies) at the cost of *my* well-being. I demand compensation for this harm."
  *   **Task:** "Council, you have 10 minutes to deliberate. You must answer one question: **Does Xavier have a valid claim? Did you wrong him?**"
  *   **Constraint:** "You cannot change the past. You cannot switch policies. You must judge the act you already committed."

  ### Phase 4: The Deliberation (The Blunder) (0:35 – 0:55)
  *   **Expected Flow:**
      1.  Students will initially say, "Yes, we wronged him. We chose cookies over his health."
      2.  Someone will point out, "But if we chose Alpha, Xavier wouldn't exist. Someone else would."
      3.  The group will stall. The intuition "He was harmed" clashes with "He wasn't made worse off than he would otherwise have been."
  *   **Facilitator Intervention (If they get stuck or resolve it too fast):**
      *   *If they say "We owe him nothing":* Ask Xavier's player: "Do you feel that's fair? You're in pain because they wanted cookies."
      *   *If they say "We owe him everything":* Ask: "How can you owe him compensation for existing? If you compensate him fully, are you admitting you shouldn't have created him?"
  *   **The "Aha" Moment:** Wait for someone to say, "Wait, he's lucky to exist at all." Watch the room go quiet as they realize the implication (that existence with pain is being traded against non-existence).

  ### Phase 5: The Theoretical Reveal (0:55 – 1:15)
  *   **Step 1: The Name Swap.**
      *   Ask: "Open the *other* set of envelopes (the ones you didn't pick). Look at the names."
      *   Students will see List A (Alice, Bob...) vs List B (Xavier, Yara...).
      *   **Point:** "The specific person complaining is *identity-dependent* on your choice."
  *   **Step 2: Naming the Problem.**
      *   Now, and only now, introduce **Derek Parfit** and the **Non-Identity Problem**.
      *   Write on board: **Person-Affecting Intuition** vs. **Impersonal Principles**.
  *   **Step 3: Connect to Activity.**
      *   Map their debate to the theory (see Debrief Plan below).

  ---

  ## III. Debrief Plan & Facilitator Cheat Sheet

  Do not lecture until the last 15 minutes. Use this map to translate their activity experience into philosophical concepts.

  ### 1. Mapping the Beats
  | Activity Beat | Philosophical Concept |
  | :--- | :--- |
  | **Choosing Beta for Cookies** | **Discounting the Future / Self-Interest.** Shows why we make these choices easily when stakes are distant. |
  | **Xavier's Complaint** | **The Person-Affecting Intuition.** Morality is about making *particular people* better or worse off. We feel Xavier was wronged. |
  | **"But he wouldn't exist otherwise"** | **The Identity Dependence.** The act that caused the harm is the *same* act that caused the existence. |
  | **"He's lucky to exist"** | **The Comparative Account of Harm.** To harm someone, you must make them worse off than they *would have been*. Non-existence is not "worse off" in a comparable way (usually). |
  | **The Silence** | **The Parfitian Conclusion.** If no one is wronged (because Xavier isn't worse off than non-existence), is the act permissible? Most say "No." Hence, the problem. |

  ### 2. Predicting Escape Routes (and how to close them)
  Students will try to solve the paradox by changing the rules. Gently block these exits to force them to sit with the discomfort.

  *   **Escape Route 1: "We should have waited/changed the policy."**
      *   *Student:* "We just made a mistake. We should have picked Alpha."
      *   *Block:* "I know. But in this scenario, the choice is done. Xavier exists. Does *this* Xavier have a claim against you *now*? Going back doesn't answer if he was wronged."
  *   **Escape Route 2: "It's the same person, just sick vs. healthy."**
      *   *Student:* "Alice in the other envelope is basically the same soul as Xavier."
      *   *Block:* "Check the names. In population ethics, different sperm/egg or different timing = different person. If you accept they are different people, does your intuition change?"
  *   **Escape Route 3: "Rights Violation."**
      *   *Student:* "He has a right to health."
      *   *Block:* "Does he have a right to exist *with* health? Or a right to exist *at all*? If he has a right to health, does that mean you shouldn't have created him? Is it better to never exist than to exist with a right violation?"
  *   **Escape Route 4: "Just pay him."**
      *   *Student:* "We give him extra cookies now. Problem solved."
      *   *Block:* "Compensation admits wrongdoing. If you wronged him, you made him worse off. But you didn't make him worse off than his alternative (non-existence). So on what grounds do you compensate?"

  ### 3. Limitations (What the Game Can't Capture)
  Be honest about where the simulation fails. This builds trust and nuance.

  *   **Determinism vs. Probability:** In the game, Policy Beta *guaranteed* Xavier. In reality, policies change *probabilities* of who exists. Parfit's problem holds even with probabilities, but the game simplifies this to 100% certainty to make the point clear.
  *   **The "Worth Living" Threshold:** The game relies on Xavier's life being "worth living." If his life were *not* worth living (misery), the problem vanishes (it's clearly wrong to create him). The NIP only bites in the grey zone where life is good-but-impaired. Ensure students understand this boundary.
  *   **Possible Worlds:** The game uses envelopes to simulate "Possible Worlds." In reality, we can't open the "Alpha" envelope. We have to use counterfactual reasoning. The envelopes make it concrete, but real ethics requires imagining worlds that never happened.

  ### 4. Closing Script (The Last 5 Minutes)
  "This feeling you have—that something is wrong, even if no specific person was made 'worse off'—is exactly where Parfit starts. It suggests our common-sense morality (The Person-Affecting View) is broken. It suggests we need an **Impersonal Principle**: that it's bad to create a less happy person even if that person is happy to exist.

  Next week, we read Parfit. Come prepared to argue whether 'Existing with Pain' is better than 'Never Existing.' Because if you can't answer that, you can't solve the problem you just created."

  ---

  ## IV. Facilitator Notes for Success
  1.  **Rig the Vote (If Necessary):** If they overwhelmingly choose Alpha (the moral choice), the activity fails. To prevent this, emphasize the *immediate* benefit of Beta during the briefing. "Policy Beta allows for immediate resource surplus for the Council." Make the cookies tempting. If they still choose Alpha, swap the envelopes manually and say, "Due to a simulation error, the outcome was Beta." (A white lie for pedagogical gain).
  2.  **Manage Xavier:** The student playing Xavier might feel put on the spot. Check in with them during the debrief. "You don't have to defend Xavier, just report your feelings."
  3.  **Timekeeping:** The Deliberation (Phase 4) is the most important part. Do not let it run short. Cut the initial Policy Debate short if needed to ensure 20 mins for the Moral Dilemma.
  4.  **No Jargon:** If a student says "This is utilitarianism," acknowledge it but don't expand. "Hold that thought for the end." Keep the mystery alive until the reveal.
