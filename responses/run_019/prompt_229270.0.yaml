answer: |-
  ### Final Essay Question (25 Marks)

  **Question:**
  Consider two hypothetical findings in neural interpretability research:

  1.  **The Random Probe:** Researchers train a linear probe on the activations of a transformer with completely random, untrained weights. The probe decodes whether an input sentence is in the past tense significantly above chance.
  2.  **The Unstable Inventory:** A separate team applies a sparse autoencoder (SAE) to a *trained* model. They find the inventory of extracted features changes substantially (both in number and semantic description) depending on the sparsity penalty and dictionary size chosen.

  Based on these cases, discuss the conditions under which an interpretability result warrants the claim that a network *itself* represents a concept, rather than the representation being a useful fiction for the researcher. You must distinguish between information being merely decodable from activations versus the network using that information downstream. You must also address whether there is a fact of the matter about which features a network has if the feature inventory depends on hyperparameter choices.

  **Take a defended position on at least one of the hypotheticals.** Do not merely survey options; argue for whether the result supports realism or instrumentalism about neural features.

  **Time:** 2 Hours | **Marks:** 25

  ***

  ### Model Answer

  The central tension in interpretability realism is distinguishing between information that is *present* in a system and information that is *used* by the system. A realist claim—that a network represents "past tense"—requires more than the existence of a mapping from internal states to external properties; it requires that the internal state plays a specific causal role in the system's behavior. The two hypotheticals provided test precisely this distinction between structural availability and functional integration.

  Regarding the **Random Probe**, high decoding accuracy on untrained weights does not warrant a realist claim about representation. In high-dimensional spaces, random projections often preserve linear separability of input data purely by virtue of dimensionality, not because the network has organized itself to capture linguistic structure. Here, the probe is doing all the work. The network's activations are merely a passive medium; they carry information about the input only in the sense that any physical state correlated with an input carries information. However, because the weights are random, these activations play no causal role in generating the output. The network does not "know" the tense; it does not use the tense information to compute its next token. Therefore, attributing representation here is a category error. It confuses the capacity of an external observer to extract data with the internal functional organization of the system. Representation requires causal efficacy, not just correlational potential.

  The **Unstable Inventory** case presents a deeper ontological challenge. If the features extracted via SAEs shift based on hyperparameters (sparsity penalties, dictionary size), it suggests that features are not mind-independent atoms waiting to be discovered. A strict realist might argue this proves features are instrumentalist constructs—useful fictions imposed by the researcher's choice of basis. However, this conclusion is too hasty. Dependence on a framework does not entail unreality. Consider coordinate systems in physics: the specific numbers assigned to a vector depend on the chosen basis, but the vector space itself is real. Similarly, hyperparameters define the granularity of the decomposition. A high sparsity penalty forces the model to explain activations using fewer, denser features; a low penalty allows many sparse features. Both may capture real structure at different levels of abstraction.

  Therefore, I defend a **qualified realism** grounded in causal role. For the Random Probe, realism is false because there is no causal role. For the Unstable Inventory, realism is viable if we view features as real relative to a functional decomposition. The fact of the matter is not about a single "true" dictionary, but about whether the extracted features correspond to directions in activation space that, when intervened upon (e.g., via activation patching), causally alter the model's behavior in predictable ways. If manipulating a feature changes the output consistent with its semantic label, it has causal grip.

  Ultimately, interpretability warrants realist claims only when the identified structure is causally implicated in the system's computation. Decodability is necessary but insufficient; it must be coupled with downstream usage. Hyperparameter sensitivity does not refute realism but clarifies that features are relational properties of the network's geometry, not intrinsic labels. We should be realists about causal structures, not instrumentalists about mathematical bases.

  ***

  ### Marking Scheme (25 Marks Total)

  | **Criterion** | **Marks** | **Mediocre Answer Fumble** |
  | :--- | :---: | :--- |
  | **1. Decodability vs. Causal Usage**<br>Clearly distinguishes between an external observer reading data (probe) and the system using data (downstream computation). | **5** | Treats high probe accuracy as sufficient proof that the network represents the property. |
  | **2. Diagnosis of Random Weights**<br>Correctly identifies that random weights lack functional organization, making the probe the sole source of structure in Hypothetical 1. | **5** | Claims random weights can represent concepts because "information is everywhere" or misses the lack of downstream impact. |
  | **3. Hyperparameter Ontology**<br>Addresses Hypothetical 2 by explaining that framework dependence (hyperparameters) does not necessarily entail anti-realism (e.g., levels of abstraction). | **5** | Dismisses SAE features as purely subjective illusions solely because the inventory changes with settings. |
  | **4. Positive Criterion for Representation**<br>Proposes a specific condition for realism (e.g., causal intervention, downstream efficacy) rather than staying negative. | **5** | Fails to move beyond correlation to specify what *would* count as representation (offers no positive test). |
  | **5. Defended Position**<br>Takes a clear stance (Realist, Instrumentalist, or Qualified) on at least one hypothetical and maintains consistency throughout. | **5** | Sits on the fence ("both sides have points") without resolving the tension or contradicts their own earlier claims. |
