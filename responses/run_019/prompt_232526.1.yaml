      *Refining the "Exit" point:* The user notes adults can't exit AI without losing goods. This is the "lock-in" problem. This is strong. But does it belong at the end? If the essay is about *character*, the end should be about what we become. Exit is the political solution to the philosophical problem. Keep the philosophical problem as the final resonance.

