answer: |-
  This is a profound puzzle in legal philosophy and bioethics. The divergence you observe stems not from disagreement about the *facts* of reproduction, but from fundamentally incompatible metaphysical commitments regarding the self, the market, and the nature of kinship. The universal rhetorical claim ("compensation for service, not purchase of life") is a **legal fiction** required to navigate the prohibition against the sale of human beings, but each jurisdiction fills that fiction with different substantive content.

  Here is an analysis of the implicit philosophies, the coherence of their distinctions, their inconsistencies, and the consequences of dropping the framing.

  ### 1. The Implicit Philosophies: Body, Labor, and Parenthood

  Each regime rests on a distinct anthropological and economic ontology.

  **Continental Europe (The Dignity-as-Inalienability Model)**
  *   **View of the Body:** The body is constitutive of the person, not an instrument of the person. Drawing on Kant, the human being is an end in itself. To contractually alienate control of one's reproductive capacity is to treat the self as a thing (*res*), violating human dignity (*ordre public*).
  *   **View of Labor:** Reproductive labor is categorily distinct from wage labor. While one may sell one's time (employment), one cannot sell the *capacities* that define human status.
  *   **View of Parenthood:** Parenthood is a status conferred by biology or the state (adoption), not a contract. The principle *mater semper certa est* (the mother is she who gives birth) is ontological, not just legal. To sever gestational motherhood from legal motherhood via contract is to fracture the child's identity rights.
  *   **Philosophical Commitment:** **Status Contract.** Certain human relationships are too fundamental to be governed by market exchange.

  **UK & Netherlands (The Dignity-as-Non-Commodification Model)**
  *   **View of the Body:** The body can be used instrumentally, but it cannot be *priced*. This follows Richard Titmuss's "Gift Relationship." Altruism preserves the moral value of the act; introducing market price corrupts it.
  *   **View of Labor:** Reproductive labor is a civic contribution, not a job. It is akin to blood donation. Expenses can be reimbursed because the donor should not be *out of pocket*, but profit implies a market transaction.
  *   **View of Parenthood:** Parenthood is primarily about welfare and intent, but it must be insulated from financial coercion. The "altruistic" filter ensures the surrogate is not exploited, theoretically preserving the voluntariness of the consent.
  *   **Philosophical Commitment:** **Moral Market Segmentation.** Markets are useful, but there is a "moral boundary" where price signals crowd out moral motivations.

  **US Commercial States (The Dignity-as-Autonomy Model)**
  *   **View of the Body:** Radical self-ownership. If I own myself, I own my labor and my biological capacities. To forbid a woman from renting her womb is paternalistic interference with her liberty.
  *   **View of Labor:** Reproductive labor is work. It involves risk, time, and physical alteration. To deny compensation is to devalue women's work. Inequality of bargaining power is managed through contract law, not prohibition.
  *   **View of Parenthood:** Parenthood is determined by **intent**. The "contractual parents" are the real parents because they initiated the project. Biology is secondary to will.
  *   **Philosophical Commitment:** **Libertarian Contractualism.** Freedom of contract is the primary vehicle for human flourishing; restrictions require a harm principle justification that is rarely met in this context.

  ### 2. The Coherence of Legal Distinctions

  The law relies on specific distinctions to maintain the "compensation, not purchase" fiction. Some are coherent; others are performative contradictions.

  **Thing Sold vs. Service Compensated**
  *   *The Distinction:* You cannot sell a child (thing), but you can pay for gestation (service).
  *   *Coherence:* **Low.** In surrogacy, the "service" (gestation) and the "product" (the baby) are ontologically inseparable at the point of transfer. Unlike a carpenter who builds a chair and sells the chair, the surrogate's labor *creates* the person being transferred.
  *   *Where it breaks:* In the US, if the surrogate miscarries, payment often stops or is reduced. This implies the payment was contingent on the "product," not just the "service," revealing the commodity nature of the transaction.

  **Gift vs. Commodity**
  *   *The Distinction:* UK/EU egg donation is a "gift" with expenses; US donation is a "market."
  *   *Coherence:* **Medium.** The UK model holds only if "expenses" are strictly audited. In practice, "loss of earnings" can be manipulated to function as de facto payment. However, the *social meaning* remains different: one is a reciprocal exchange, the other is a spot market.
  *   *The Egg Donation Paradox:* In the US, egg donor compensation varies by SAT scores, height, and eye color. This openly admits that the **genetic material** is being valued, not just the retrieval procedure. This contradicts the "service only" claim. You do not pay a phlebotomist more because their blood type is rarer; you pay more because the *product* (the egg) is deemed higher quality.

  **Parent by Intent vs. Parent by Biology**
  *   *The Distinction:* US favors intent; Europe favors biology/gestation.
  *   *Coherence:* **High (internally), Low (externally).** Internally, the US system is coherent: if reproduction is a project, the project managers are the parents. Europe is coherent: if reproduction is a biological fact, the birth mother is the mother.
  *   *Conflict:* The conflict arises in cross-border cases. The incoherence is global: a child can be born to a legal mother in India, recognized as parentless in Germany, and recognized as the child of the Americans in California.

  ### 3. Internal Inconsistencies and Rival Views

  **The "Risky Labor" Inconsistency (Europe)**
  *   *The Contradiction:* Continental Europe bans surrogacy to protect women from bodily instrumentalization and risk. Yet, these same states permit women to work in dangerous factories, mine coal, or box professionally.
  *   *The Implicit Valuation:* This reveals that the ban is not about *physical risk*, but about **symbolic risk**. The womb is symbolically charged as the seat of kinship. The law protects the *institution of motherhood* more than the *woman's body*. It quietly rules out the view that women are autonomous agents capable of consenting to reproductive risk, while accepting they can consent to industrial risk.

  **The "Adoption vs. Surrogacy" Inconsistency (US)**
  *   *The Contradiction:* In the US, paying a birth mother to surrender a child for adoption is illegal (baby selling). Paying a surrogate to carry a child and surrender it is legal (service contract).
  *   *The Implicit Valuation:* The distinction rests on the timing of the contract (pre-conception vs. post-conception). This is legally convenient but morally thin. It assumes a woman can consent to surrender before pregnancy in a way she cannot after. This rules out the view that consent regarding kinship is non-binding regardless of timing.

  **Underdetermination**
  *   **The UK Model:** Can be justified by **Kantianism** (no price on humanity) OR **Utilitarianism** (altruism ensures supply without exploitation). These are rival theories leading to the same policy.
  *   **The US Model:** Can be justified by **Libertarianism** (freedom of contract) OR **Feminist Labor Theory** (reproductive work is undervalued work and deserves pay). These are strange bedfellows; one views the surrogate as a sovereign individual, the other as a worker needing protection, yet both support commercial surrogacy.

  ### 4. Dropping the Fiction: "Compensation" vs. "Purchase"

  If we admitted openly that gametes and gestational labor are being bought, the regulatory structures would collapse or require radical reconstruction.

  **If Egg Donation is Admitted as "Purchase":**
  *   **Property Law:** Eggs would become property. This triggers inheritance laws, tax implications (capital gains?), and product liability. If a child born from purchased eggs has a genetic defect, is it a "lemon"? Can the parents sue the donor for breach of warranty?
  *   **Eugenics Regulation:** Currently, pricing by traits is tolerated as "market preference." If admitted as purchase, it becomes explicit **positive eugenics**. States might have to regulate "trait pricing" to prevent discrimination or a genetic caste system, much like they regulate hiring discrimination.

  **If Surrogacy is Admitted as "Purchase":**
  *   **Labor Rights:** Surrogates would unequivocally be employees. They would be entitled to unions, workplace safety standards (OSHA), and workers' compensation for injury. Currently, they are independent contractors with limited recourse.
  *   **The "Baby" Status:** If the service is gestation, the law is stable. If the transaction is the purchase of a child, it violates the UN Convention on the Rights of the Child (sale of children). To make this legal, the "child" would have to be legally redefined as a "dependent" acquired through contract, similar to adoption but commercial. This would likely require a state intermediary to vet the "purchase" to ensure the child's best interests, effectively nationalizing the market.

  **If the "Service" Framing is Dropped in Europe:**
  *   **Total Ban:** If gestation cannot be separated from the person, and payment is purchase, then *any* contract surrogacy (even altruistic) might be banned as coercive. The UK model would collapse into the French model.
  *   **State Monopoly:** Alternatively, the state might become the only buyer (single-payer surrogacy), removing the private market element to preserve dignity while meeting demand.

  ### Summary of the Philosophical Impasse

  The pattern you cannot make sense of exists because the law is trying to solve a **category error**.

  1.  **Europe** treats reproduction as a **Status**. You cannot contract into or out of status.
  2.  **The US** treats reproduction as a **Project**. It is subject to planning, contract, and exchange.
  3.  **The UK** treats reproduction as a **Civic Duty**. It is a gift to the community/family, not a market transaction.

  The "compensation for time" fiction is the grease that allows the machine to run. It allows the US to avoid the "baby selling" statute, and it allows the UK/EU to allow *some* assistance without admitting to a market.

  **The fundamental incoherence** lies in the treatment of the egg. In the US market, the egg is priced by quality (traits). This admits the egg is a **commodity**. In surrogacy, the gestation is priced by time/risk. This admits the womb is a **factory**.
  *   If the egg is a commodity, the European ban on "selling the body" is already violated by the market valuation of genetic traits, even if the legal form is "donation."
  *   If the womb is a factory, the US distinction between "surrogacy" (legal) and "adoption" (illegal to pay) collapses, because both result in the transfer of a child for money.

  To make sense of it philosophically, you must conclude that **no regime is internally consistent.** They all prioritize one value (Dignity, Liberty, or Welfare) and paper over the contradictions with the "service vs. sale" distinction. If you remove that distinction, the US model risks becoming a market in human beings, and the European model risks becoming a totalitarian control over reproductive biology. The UK model attempts to walk the line but relies on a definition of "expenses" that is easily gamed, making it a commercial market in denial.
