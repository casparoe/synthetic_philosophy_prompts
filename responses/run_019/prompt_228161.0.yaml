          4.  Identify underdetermination (where multiple theories justify the same outcome).
          5.  Speculate on the consequences of dropping the "compensation-not-purchase" framing.

  2.  **Initial Brainstorming & Categorization:**
      *   *Continental Europe (France, Germany, etc.):* Kantian dignity, inalienability of the person, *ordre public*. The body is not property. Parenthood is a status, not a contract.
      *   *UK/Netherlands:* "Altruistic" model. Third way. Avoids commodification but acknowledges need. Gift economy vs. market economy.
      *   *US (Commercial):* Liberal libertarianism, property rights in oneself, contract law supremacy. Reproductive labor is labor.
      *   *The Universal Fiction:* "It's not buying a baby/egg, it's paying for the service." This is the legal fiction that bridges the gap between "selling humans is bad" and "we need this service."

  3.  **Drafting the Analysis - Section by Section:**

      *   **Section 1: The Implicit Philosophies (The "Why"):**
