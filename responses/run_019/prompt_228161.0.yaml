      *   **Topic:** Comparative policy on surrogacy and egg donation (Continental Europe vs. UK/Netherlands vs. US).
      *   **Core Puzzle:** The universal rhetorical claim ("compensation for time/effort, not payment for body/child") vs. the vast divergence in legal outcomes (outright ban vs. altruistic only vs. commercial market).
      *   **Tasks:**
          1.  Identify the implicit philosophy (view of body, labor, parenthood) for each regime.
          2.  Analyze the coherence of legal distinctions (thing vs. service, gift vs. commodity, intent vs. biology).
