          *   *Anglo-Altruistic (UK/NL):* Dignity as Non-Commodification. The body can be used, but not priced. Market pricing corrupts the moral value of the act. It's a "gift relationship" (Titmuss).
          *   *US Commercial:* Dignity as Autonomy. Self-ownership. If I own myself, I can rent my capacities. Inequality of outcome is less bad than restriction of liberty.

      *   **Section 2: The Coherence of Distinctions (The "How"):**
          *   *Thing vs. Service:* This is the crucial legal sleight of hand. You can't sell a child (thing), but you can pay for gestation (service).
          *   *Critique:* Is gestation separable from the fetus? In early pregnancy, maybe. At birth, no. The "service" ends when the "product" is delivered.
          *   *Gift vs. Commodity:* UK relies on this. But "expenses" can be inflated. Is it a true gift if there's a contract?
          *   *Intent vs. Biology:* US favors intent (contract). Europe favors biology/gestation (mater semper certa est).
          *   *Coherence Check:* The distinction holds legally but fractures ontologically. You cannot separate the woman's labor from the child's existence in surrogacy as easily as you can separate a haircut from the head.

      *   **Section 3: Internal Inconsistencies (The "Hypocrisies"):**
          *   *Europe:* Bans surrogacy (risk to body) but allows mining, boxing, or dangerous factory work (risk to body). Why is *reproductive* risk special? Answer: Symbolic value of reproduction, not physical risk.
          *   *Europe:* Bans selling eggs but allows sperm donation (often paid more freely) or vice versa depending on the country.
          *   *US:* Bans selling babies (adoption fees capped) but allows surrogacy contracts that effectively result in a baby for $100k+. The distinction is "pre-birth contract" vs. "post-birth surrender."
          *   *Egg Donation:* Pricing based on SAT scores/appearance admits the "product" (genes) is being valued, contradicting the "service only" claim.

      *   **Section 4: Underdetermination (The "Overlapping Consensus"):**
          *   *UK Model:* Could be justified by mild Kantianism (no price) OR by utilitarianism (enough supply without exploitation).
          *   *US Model:* Could be justified by Libertarianism (freedom) OR by Feminism (valorizing reproductive labor as work).
          *   *European Ban:* Could be justified by Catholic natural law OR by Secular Human Rights (child's right to identity).

      *   **Section 5: Dropping the Fiction (The "What If"):**
