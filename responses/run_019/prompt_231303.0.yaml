answer: |-
  Here is an analysis of how the philosopher is likely to respond, based on the internal logic of her previous verdicts.

  ### 1. The Predicted Verdict
  **She will say the NGO worker is doing something WRONG.**

  While the situation involves time pressure and high stakes (like the surgeon and the ICU family), the critical failure is the **source of the advice**. The visiting philosopher possesses abstract moral training but zero contextual knowledge ("knows nothing about the place"). In her previous rulings, the philosopher consistently rejects deference to abstract moral authority (the Pacifist Student, the Voter) and accepts deference only when the advisor has *relevant epistemic access* to the consequences or the harm involved.

  ### 2. The Closest Analog
  **Case 2: The Pacifist Student.**

  *   **Why:** In both cases, an agent defers to a "moral expert" (a famous philosopher / a visiting philosopher) on the permissibility of an action without understanding the underlying reasons or context.
  *   **The Connection:** In Case 2, the student adopts a foundational moral stance based purely on authority. In the NGO case, the worker adopts a situational moral permission based purely on authority. Both bypass the necessary work of connecting the moral principle to the specific reality.
  *   **Secondary Analog:** **Case 4 (The Voter).** Like the voter, the NGO worker is making a decision that impacts a community based on external authority rather than local engagement or understanding.

  ### 3. Rival Rules That Fit the Track Record
  To understand *why* she rules the way she does, we have to look at the principles that could explain her five previous verdicts. Here are the three strongest contenders:

  *   **Rule A: The "Moral Autonomy" Principle.**
      *   *Theory:* You must never defer on moral questions; you must always reason it out yourself.
      *   *Fit:* Explains why the Student (Case 2) and Voter (Case 4) are wrong.
      *   *Failure:* Cannot explain why the Surgeon (Case 1), Manager (Case 3), or ICU Family (Case 5) are right. They all deferred. Therefore, this is not her rule.
  *   **Rule B: The "Affected Party" Principle.**
      *   *Theory:* Deference is okay only when you are deferring to the people who will be harmed or helped by the action.
      *   *Fit:* Perfectly explains the Manager (Case 3—deferred to staff) and arguably the ICU Family (Case 5—deferred to medical team acting for patient).
      *   *Failure:* Struggles with the Surgeon (Case 1). The surgeon deferred to an *ethicist*, not the patient or family (in fact, he went *against* the family). This suggests expertise matters more than just "affectedness."
  *   **Rule C: The "Relevant Epistemic Advantage" Principle.**
      *   *Theory:* Deference is okay only when the advisor knows something about the *consequences* or *context* that the agent does not. Abstract moral reasoning does not count as expertise.
      *   *Fit:* Explains everything.
          *   **Right Cases:** The Ethicist knows hospital policy/precedent (Case 1); The Staff know how the language feels (Case 3); The Palliative Team knows the medical prognosis (Case 5).
          *   **Wrong Cases:** The Famous Philosopher knows theory, not the student's life (Case 2); The Leading Ethicists know ethics, not the voter's community needs (Case 4).

  ### 4. The Rule She Is Actually Running
  She is running **Rule C: The Relevant Epistemic Advantage Principle.**

  Her distinction is not between "moral" and "non-moral" questions, but between **abstract authority** and **contextual expertise**.
  *   When the advice is about *how the world works* or *how an action will land* (Will this phrase hurt? Will this treatment help? Is this custom rigid?), deference is permissible because the advisor has facts the agent lacks.
  *   When the advice is about *what is Good* in the abstract (Is war wrong? Is this measure just?), deference is impermissible because there is no factual "expert" on ultimate values.

  In the NGO case, the visiting philosopher has no epistemic advantage. He knows moral theory, but he does not know the custom, the stakes of violating it, or the local needs. He is offering abstract authority on a contextual problem.

  ### 5. The Follow-Up Case to Settle It
  If you want to confirm that **Contextual Expertise** (Rule C) is the true driver—and not just a general suspicion of philosophers—you should float this case next:

  **The "Local Fixer" Case:**
  > "Same NGO worker, same afternoon deadline, same food distribution dilemma. But this time, instead of the visiting philosopher, he asks a **local community elder** who knows the customs intimately but has no training in ethics. The elder says, 'In emergencies like this, the custom is suspended. Distribute the food.' The worker defers and distributes."

  **Why this settles it:**
  *   **If she says RIGHT:** It confirms **Rule C**. The advisor had relevant contextual knowledge, even if they weren't a "moral expert." It proves the NGO case was wrong because of the *philosopher's ignorance*, not because deference itself was banned.
  *   **If she says WRONG:** It suggests she is running a stricter version of **Rule A (Moral Autonomy)**. It would imply that in cross-cultural moral trade-offs (Hunger vs. Respect), the agent *must* deliberate personally, regardless of who advises them. This would force her to reconsider the Manager case (who didn't deliberate) or the Surgeon case.

  **Recommendation:** Lead with the prediction that she'll call the NGO case **Wrong**, cite the **Relevant Epistemic Advantage** rule, and then use the **Local Fixer** case to see if she values *knowledge* over *authority*.
