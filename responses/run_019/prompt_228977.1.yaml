answer: |-
  Mr. Mayor, members of the Council, colleagues from the astronomical and astrological societies, teachers, students, and citizens of Weil der Stadt.

  It is a profound honor to stand here in the market square of this town. There is a specific quality to the light in the Swabian hills at this time of year—a clarity that makes the horizon feel nearer than it is. Looking out from the hills where a boy named Johannes once walked, one understands why he might have looked up. When you live in a place where the earth feels so solid, it is natural to wonder what holds the sky.

  We are gathered to unveil a monument to that boy, now a man of history. But as we prepare to pull the cloth from the bronze, we must acknowledge that we are not all looking at the same statue. To some, this figure represents the triumph of modern science over superstition. To others, he represents a sacred tradition of celestial wisdom. To the schoolchildren among us, he is likely just a name on a textbook chapter they hope to finish by lunch. And to the Mayor, I know I have been tasked with a speech that causes no one to walk out.

  This is a difficult balance, because Johannes Kepler was not a balanced man. He was a creature of contradictions. If we are to honor him honestly, we cannot smooth over the rough edges. We cannot pretend he was a modern skeptic in a 17th-century wig. He cast horoscopes. He wrote calendars predicting weather and political unrest based on planetary positions. He earned his bread by the stars in a way that makes our astronomical society shift in their seats.

  But neither can we hand him over to the practitioners of astrology today. Kepler would not recognize himself in their pages. He called the astrology of his day the "foolish daughter" of astronomy—a poor relation kept around because she could earn money, even if she embarrassed the mother. He attacked the astrologers for making claims they could not explain physically, and he attacked the skeptics for denying that the heavens could touch the earth at all.

  So, we are left with a problem. How do we honor a man whose greatest discoveries grew out of ideas we now know to be false? And how do we distinguish his errors from the errors of those he criticized?

  The first question is this: Can we celebrate the harvest if the seed was rotten? Kepler's cosmology was built on a foundation of nested Platonic solids—geometric shapes he believed defined the orbits of the planets. We know now that there are no crystal spheres, no perfect solids holding the planets in place. That framework was wrong. Yet, it was precisely his obsession with this geometric harmony that drove him to demand better data from Tycho Brahe. It was his belief that the universe sang in mathematical ratios that led him to discover the Third Law of Planetary Motion.

  If we view science as a straight line of accumulating facts, Kepler is a stumbling block. But if we view science as a scaffold, he makes perfect sense. You do not need the scaffold to remain standing once the building is complete. In fact, you must remove it to see the structure. Kepler's "false" cosmology was the scaffold. It allowed him to climb high enough to see the true architecture of the solar system. We honor him not because he was right about the solids, but because he was willing to trust a mathematical intuition so deeply that he forced the universe to yield its secrets. His error was productive. It was a ladder he kicked away once he reached the roof.

  This leads to the second, sharper question. What distinguishes Kepler being wrong from the astrologers being wrong? Both believed the heavens influenced life on Earth. Both looked for meaning in the sky. Why is one a hero of science and the other dismissed?

  The difference is not in the belief. The difference is in the risk.

  Kepler believed in a physical connection between the stars and the earth. He speculated that light or some geometric force might be the mechanism. But here is the crucial distinction: Kepler subjected his beliefs to the torture of data. When the observations of Mars did not fit his theories, he did not adjust the interpretation. He did not say, "The spirit of Mars is merely subtle today." He said, "My theory is broken." He spent years in the trenches of calculation, willing to let the hard reality of the sky destroy his beautiful ideas.

  He distinguished himself from the astrologers of his guild by demanding a *cause*. He wanted to know *how* the angle of a planet could change the weather or the human temper. If no mechanism could be found, the rule was suspect. The astrologers he criticized were content with tradition; if a rule had been passed down for a thousand years, it was true. Kepler required that it work in the laboratory of the world.

  To the members of the astrological association present: Kepler claims the *question* you ask, but he rejects the *method* you use. He asks, "Are we connected to the cosmos?" You answer, "Yes, by tradition." Kepler answered, "Yes, but prove it by measure."

  To the astronomers present: We cannot claim him as a pure rationalist who shed the baggage of his age. He carried the baggage. He just insisted on weighing it first.

  So, what do we tell the children? What do we tell the Mayor? We tell them that being wrong is not the opposite of progress. Being wrong is often the engine of it. But there is a right way to be wrong, and a wrong way to be wrong. The wrong way is to cling to an idea because it is comforting, or traditional, or profitable. The right way—the Kepler way—is to hold an idea tentatively, to test it against the world, and to have the courage to let it break when the world strikes it.

  Kepler's legacy is not a list of correct answers. It is a standard of intellectual honesty. It is the refusal to accept a pattern until you understand the mechanism that drives it. It is the humility to listen when nature says "no."

  We live in a time, four hundred years later, where we are still surrounded by "foolish daughters." We have data without wisdom, and wisdom without data. We have people who claim certainty without evidence, and skeptics who deny wonder without cause. Kepler stands between us, as he stood between the combatants of his own time, urging us to look up, but also to look closely.

  He urges us to find the music, but to check the instruments.

  And so, we come to this monument. It is bronze and stone, fixed and silent. But the man it represents was none of those things. He was restless, loud, uncertain, and brilliant. He belonged to this town, to these hills, but his mind belonged to the orbits of the planets.

  Let us not unveil this statue as a shrine to a saint of science. Let us unveil it as a reminder of the struggle. A reminder that truth is not found in the comfort of being right, but in the hard work of finding out.

  Mr. Mayor, ladies and gentlemen, neighbors. The sky above Weil der Stadt is the same sky that shone over Johannes four centuries ago. It is still vast. It is still silent. It is still waiting for us to ask the right questions, and to listen, truly listen, for the answer.

  Please join me in unveiling the monument to Johannes Kepler.
