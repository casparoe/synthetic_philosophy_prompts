      *   *Mechanisms:* Changing electoral rules, undermining checks and balances (courts, media), capturing state agencies, delegitimizing opposition.
      *   *Debate:* Is it real erosion or just polarization? Who defines it (partisan vs. objective)? Is it legalistic (following rules) or normative (spirit of rules)?
      *   *Key Actors:* Incumbents, opposition, institutions, voters.

  3.  **Translate to Association Vocabulary (Task 1):**
