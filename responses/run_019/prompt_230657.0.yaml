      If you have ever spent a holiday dinner at this table, you know that there are certain rules. You do not ask about the grading unless you want a lecture on fairness, and you do not mention the future unless you are prepared to have it dissected. For forty years, my aunt has stood in front of classrooms teaching the Enlightenment, but if you ask me, her real subject has always been how to keep going without turning bitter. She loves Émilie du Châtelet, not for the physics, but for the essay on happiness written near the end. And because we are family, I have heard the summary enough times to recite it in my sleep. The gist is that stripping away fear and prejudice is only the cleanup crew; it clears the floor, but it does not fill the room. Happiness requires passion, and passion often requires illusion. The trick is not to live in truth, but to choose your illusions carefully. Keep the ones that make life bearable, discard the ones that make you small.

