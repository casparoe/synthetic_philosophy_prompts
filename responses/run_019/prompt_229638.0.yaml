  ### The tensions ranked

  The core incompatibility lies in the conjunction of 1, 2, 3, and 4. This is the structural engine of Parfit's Mere Addition Paradox and Arrhenius's Impossibility Theorems. Commitment 1 (Mere Addition) asserts that adding happy lives improves the outcome (A+ > A). Commitment 2 (Equality) facilitates a trade-off where we move from A+ to a larger, more equal population B with slightly lower average welfare (B > A+). By iterating this process, we reach Z, a vast population with lives barely worth living. Commitment 3 (Transitivity) chains these comparisons, entailing Z > A. However, Commitment 4 explicitly denies this conclusion. This is not merely a tension; it is a formal contradiction. You cannot maintain all four without violating logical consistency. This is the highest severity tension.

  A secondary, less severe tension exists between 1 and 5. If "better" in Commitment 1 implies "ought to choose," it conflicts with Commitment 5's denial of an obligation to create happy lives. However, this depends on linking axiology to deontology, which is not strictly necessary. The 1-2-3-4 cluster is the existential threat to your theory; the 1-5 relationship is a manageable friction. Furthermore, Commitment 2 acts as the bridge that makes the repugnant slide plausible without pure total utilitarianism. Without 2, you might block the slide from A+ to B, but 2 commits you to that move. So 2 is complicit. The severity ranking is: 1) The 1-2-3-4 impossibility (Logical Fatalism). 2) The 1-5 deontic friction (Interpretive Risk). This threatens the coherence of your betterness relation. If you keep 3 and 4, 1 and 2 must be revised. This is a logical fatalism, not just intuitive friction.

  ### Where they only seem to conflict

  Commitment 5 and 1 appear to clash because we often infer obligation from betterness. However, you can consistently hold that a world with extra happy people is better (axiological claim) while denying agents are obligated to create them (deontic claim). This preserves supererogation or agent-relative options. Similarly, 2 and 4 might seem tense because egalitarian pressures often drive the Repugnant Conclusion. However, 2 applies to fixed populations, whereas 4 compares variable populations. You can value equality within a generation without being forced to prefer larger, equalized populations over smaller, excellent ones, provided you block the Mere Addition step. The conflict is only apparent if you assume fixed-population principles automatically scale to variable contexts. Many students conflate the value of equality with the value of addition, but they are distinct normative forces.

  ### The cheapest fix and what it costs

  The cheapest revision is to qualify Commitment 1. Reject the strict Mere Addition Principle in favor of a Critical-Level view. Here, adding a life only improves the outcome if its welfare exceeds a specific threshold, not merely if it is "worth living." This preserves Commitment 4 (blocking the slide to Z) and Commitment 3 (Transitivity), while aligning comfortably with Commitment 5 (Asymmetry). You avoid the Repugnant Conclusion without abandoning transitivity or egalitarianism.

  The cost is significant but manageable. You must accept the "Sadistic Conclusion": it can be better to add lives with negative welfare than lives with positive welfare below the critical level. Alternatively, you face the "Intuition of Neutrality," where adding happy lives makes no difference. Both are counterintuitive but less devastating than the Repugnant Conclusion for most non-utilitarians. This revision isolates the inconsistency to the aggregative principle rather than your logic or egalitarian values, saving the core of your chapter's normative framework. Dropping Transitivity (3) would be more expensive, as it undermines rational choice theory entirely, making decision-making incoherent. Dropping 4 bites the biggest bullet in population ethics. Thus, modifying 1 is the strategic choice for maintaining a coherent non-utilitarian theory. It requires redefining "betterness" in your introduction.
