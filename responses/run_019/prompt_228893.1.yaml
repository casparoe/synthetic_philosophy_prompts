answer: |-
  This is a remarkably sophisticated dilemma. You aren't just wrestling with FOMO or social awkwardness; you are grappling with a classic problem in moral philosophy known as **interpersonal utility comparison**, wrapped in a very human layer of friendship dynamics.

  Your girlfriend's advice ("Marta will get more out of it, end of story") relies on a crude form of Utilitarianism: maximize total happiness units. But as you've correctly identified, that framework fails to account for *baseline*, *expressiveness bias*, and the moral weight of *need*.

  Here is how to break down the thinking, followed by a recommendation.

  ### 1. The Measurement Problem: Is "Happier" Real?
  You asked: *When we say one person would be "happier"... is that a real comparison or a useful fiction?*

  It is a **necessary fiction**. We cannot climb inside heads, but society functions on the assumption that we can make reasonable estimates of other people's internal states. However, your intuition about the "Expressiveness Trap" is spot on. If we allocate resources solely based on who reacts most visibly, we incentivize performative emotion. We teach our friends that to get access to good things, they need to cry, scream, or beg.

  Marta's reaction is likely genuine, but it is also her *baseline mode* for this band. She has a high capacity for music joy. Tomas has a low capacity for joy right now, generally. Comparing Marta's "10/10 concert joy" to Tomas's "6/10 concert joy" ignores the context of their lives. A 6/10 for someone in a depression spiral can be more therapeutically valuable than a 10/10 for someone on top of the world.

  ### 2. Two Different Currencies: Peak vs. Rescue
  You asked: *Is "he needs a win" the same kind of consideration as "she'll enjoy it more"?*

  No. They are fundamentally different currencies.
  *   **Marta represents Peak Experience.** You are offering her a spike. It will be a highlight reel memory.
  *   **Tomas represents Baseline Restoration.** You are offering him a lifeline.

  In economics, this is **Diminishing Marginal Utility**. The first slice of pizza is amazing; the tenth is merely okay. Marta has had many "transcendent concert experiences." This is, as you noted, potentially her tenth. For Tomas, this might be the first good thing that has happened in 12 months.

  Ethically, many philosophers argue for **Prioritarianism**: the idea that benefiting people matters more the worse off they are. Alleviating suffering (or a "brutal year") usually carries more moral weight than adding pleasure to an already good life. If you give the ticket to Marta, you add a gem to a crown. If you give it to Tomas, you might be stopping him from giving up.

  ### 3. The "Debt" Factor
  There is a third variable here: **Relational Equity.**
  *   **Marta:** She introduced you to the band. There is a debt of gratitude there. Taking her honors the history of your friendship and her taste.
  *   **Tomas:** He is in crisis. There is a debt of care there. Taking him honors the vulnerability of friendship.

  If you take Marta, you validate her taste and your shared history. If you take Tomas, you validate his worth as a person when he likely feels worthless due to the layoff and breakup.

  ### The Recommendation

  **You should take Tomas.**

  Here is the reasoning, based on the framework above:

  1.  **The Marginal Utility Argument:** As established, the ticket does more "work" for Tomas. A superfan can listen to the albums, watch the bootlegs, and go to tribute nights. A guy who just lost his job and partner needs a specific, tangible reminder that life still holds magic. The *scarcity* of joy in Tomas's life makes this ticket more potent for him.
  2.  **Avoiding the Expressiveness Trap:** If you take Marta solely because she cries about it, you are rewarding emotional volume. By taking Tomas, you signal that you value his well-being over his ability to perform enthusiasm.
  3.  **The "One-Off" Nature:** You mentioned this is a reunion show. Marta knows the band is broken up (again, presumably). She understands the rarity. Tomas might not grasp the rarity, but he will grasp the *gesture*.

  ### How to Handle the Fallout (Crucial)
  The risk here is hurting Marta. She is the superfan; she will feel this loss acutely. You cannot treat this as a secret.

  *   **Be Honest with Marta:** Tell her, "I know you are the ultimate fan, and logically you deserve this ticket more than anyone. But Tomas is going through hell right now, and I think he needs a night out more than I need to see you happy about the setlist. I hope you understand."
  *   **Why this works:** Marta is a true fan. True fans understand the spirit of the music. If the band's lyrics are about anything human, they are about empathy. Framing it as an act of care for a struggling friend aligns with the ethos of music culture. She might be disappointed, but she is unlikely to feel disrespected if you acknowledge her status as the "true fan."
  *   **Make it up to her:** Promise her that when the band inevitably releases a solo album or does a livestream, you are doing a dedicated listening party with her. Acknowledge her debt (introducing you to the band) in a different currency.

  ### Summary on How to Think About This
  To answer your broader question on how to think about this in the future:

  1.  **Don't trust the loudest reaction.** Treat expressiveness as a personality trait, not a metric of need.
  2.  **Calculate Marginal Utility, not Total Utility.** Don't ask "Who will love this most?" Ask "Who needs this most relative to where they are right now?"
  3.  **Distinguish Pleasure from Relief.** Pleasure is a bonus; relief is a repair. Prioritize repair.

  Take Tomas. Give Marta the truth and a different kind of attention. You're not just distributing a ticket; you're curating the kind of friend you want to be.
