      *   *Jaynes' Solution:* He argues for invariance under rotation, scaling, and translation. This leads to the $1/2$ solution (uniform distribution over the distance from the center). *Correction:* Actually, Jaynes derives the $1/2$ solution (method 2 in Bertrand's list) based on invariance to scale and translation. Wait, let me double-check. Jaynes' "Well-Posed Problem" paper argues that if the experiment is not specified, we must assume invariance to the *problem statement*. If the problem implies a circle of unspecified size and location, the measure must be invariant under scaling and translation. This yields the distribution where the midpoint is uniform over the *area*? No, Jaynes argues for the $1/2$ solution (uniform over the radius/distance). *Self-Correction:* Jaynes actually derives the $1/2$ result (method 2: random radius, random point on radius) as the unique solution invariant under scaling and translation.
      *   *Critique of Jaynes:* Shackel (2007) and others argue Jaynes begs the question by selecting specific transformations.
      *   *Empirical:* Buffon's Needle style experiments. If you throw straws from afar, you get one distribution. If you pick points on the circumference, you get another. The "correct" answer depends on the *causal process*, not just logic.
      *   *Insulation:* If the user says "PoI is only a heuristic," almost any failure confirms it, and any success is just "the heuristic worked." This risks being unfalsifiable.

  7.  **Refining the "Settled vs. Contested" Constraint:**
      *   *Settled:* Bertrand's paradox exists. Naive PoI yields contradictions in continuous spaces.
      *   *Contested:* Whether Jaynes solved it. Whether PoI has normative force. Whether there is a "true" prior.

  8.  **Developing the Defeaters (Sorted by Decisiveness):**
