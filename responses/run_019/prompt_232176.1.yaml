answer: |-
  Here is a 50-minute lesson plan designed to maximize conceptual clarity while minimizing verbal sprawl.

  ### 1. The Prerequisites & Sequence (Minutes 0–15)
  Do not start with Black. If you start with the spheres, students will treat it as a physics puzzle rather than a metaphysical one. You need to build the logical trap before you put the bait in it.

  **The Order:**
  1.  **Indiscernibility of Identicals (IoI):** (2 mins)
      *   *Action:* Write $x = y \rightarrow \forall P (Px \leftrightarrow Py)$ on the board.
      *   *Script:* "If two things are literally the same object, they must share every property. This is trivial. No one disputes this."
  2.  **Identity of Indiscernibles (PII):** (3 mins)
      *   *Action:* Write $\forall P (Px \leftrightarrow Py) \rightarrow x = y$ on the board.
      *   *Script:* "This is the converse. If two things share every property, are they the same object? This claims there is no such thing as 'numerical difference' without 'qualitative difference.'"
  3.  **Qualitative vs. Non-Qualitative Properties:** (10 mins) **(Crucial Step)**
      *   *Why:* Black's example only works if "being in location L" is not a valid property for PII. If spatial location counts as a qualitative property, PII is trivially true and the discussion ends.
      *   *Action:* Distinguish *intrinsic/relational qualitative* properties (red, heavy, 5 miles from a star) from *non-qualitative/haecceitistic* properties (being identical to $x$, being *this* one).
      *   *Check:* Ask the class: "Is 'being identical to Obama' a qualitative property?" (Target answer: No, it presupposes the individual). "Is 'being 5 miles from the Eiffel Tower' qualitative?" (Yes, it describes a relation).

  ### 2. Is Black's Example Right for First-Years?
  **Yes, but it is high-risk.**
  *   **The Risk:** First-years rely heavily on spatial intuition. Their brain will immediately visualize two balls in a room *they* are observing. This imports an external observer and an external coordinate system, which destroys the thought experiment.
  *   **The Mitigation:** You must narrate the setup like a constraint-based logic puzzle, not a visualization exercise. Emphasize the word **"Only."**
  *   **The Lesson it Invites:** It invites the lesson that *space might be relational, not absolute.* This is the correct lesson. If they walk away thinking "Space is just relations between objects," they have understood Black's point.

  ### 3. Executing Black's Universe (Minutes 15–30)
  **The Setup:**
  *   "Imagine a universe. It contains **only** two spheres."
  *   "They are made of the same iron."
  *   "They are the same size, temperature, color, shape."
  *   "They are 5 miles apart from *each other*." (Emphasize: Not 5 miles from a wall. There are no walls. There is no 'left' or 'right' of the universe).

  **The Argument:**
  1.  In this universe, Sphere A shares all **qualitative** properties with Sphere B.
  2.  If PII is true, Sphere A must be Sphere B (there is only one object).
  3.  But intuitively, there are two objects (we can count them: 1, 2).
  4.  Therefore, PII is false. Numerical distinctness does not require qualitative distinctness.

  ### 4. Head Off Misconceptions (Minutes 30–40)
  Expect these three objections. Do not wait for them to derail the conversation; introduce them as "Standard Objections" and dismantle them immediately.

  **Misconception 1: "But they are in different places."**
  *   **When:** Immediately after the setup.
  *   **The Fix:** Remind them of the "Qualitative Property" definition. "Different places" implies an absolute grid (Absolute Space). Black assumes Relational Space. The only location property available is "5 miles from the other sphere." But Sphere B *also* has the property "5 miles from the other sphere." The relational property is symmetric. They share it.
  *   **Script:** "If location is just distance from other objects, and the only other object is identical, their 'locations' are qualitatively identical."

  **Misconception 2: "We just can't tell them apart." (Epistemic vs. Ontic)**
  *   **When:** When a student says, "We wouldn't know which is which."
  *   **The Fix:** Distinguish *knowing* from *being*.
  *   **Script:** "PII isn't about whether *we* can label them. It's about whether nature distinguishes them. If PII is true, nature doesn't distinguish them, so there *aren't* two things. Black is arguing there *are* two things, even if a god couldn't tell them apart."

  **Misconception 3: "Let's just name them Castor and Pollux."**
  *   **When:** During the conclusion of the argument.
  *   **The Fix:** Naming is not a property.
  *   **Script:** "Naming them doesn't make them different. It just gives two names to the description. Black's point is that there is nothing in the *universe* that grounds the difference between Castor and Pollux other than brute numerical diversity."

  ### 5. The Assessment Question (Minutes 40–45)
  Do not ask them to summarize Black. Ask them to defend PII against Black. This tests if they understand what PII *requires* to survive.

  **The Question:**
  > "If you wanted to save the Identity of Indiscernibles from Black's attack, you would have to argue that the spheres *do* differ in some qualitative property after all. What kind of property would you have to claim exists, and why is it hard to define?"

  **Target Answer:**
  Students should identify that to save PII, you need to claim the spheres have a "primitive this-ness" (haecceity) or that space itself provides a qualitative background (Absolute Space). They should recognize that calling it "being Sphere A" is circular (non-qualitative).

  ### 6. What to Deliberately Leave Out
  1.  **Quantum Mechanics:** Do not mention bosons/fermions or the Pauli Exclusion Principle. It tempts students to think PII is an empirical scientific claim rather than a metaphysical principle. It also introduces "weak discernibility" which is too technical.
  2.  **The Name "Haecceity":** First-years will treat this as vocabulary to memorize. Call it "primitive this-ness" or "bare particularity."
  3.  **Leibniz's Theology:** Why Leibniz believed PII (God wouldn't make duplicates) is interesting history, but it distracts from the logical structure of the argument.
  4.  **Kant's Incongruent Counterparts:** Do not bring in left/right hands. It introduces chirality, which complicates the "exact similarity" condition and muddies the water regarding spatial relations.

  ### 7. Closing (Minutes 45–50)
  Summarize the stakes: If Black is right, objects have a "this-ness" that isn't made of their features. If Leibniz is right, an object is nothing but the bundle of its features.
  *   **Exit Ticket:** Have them write down one sentence answering: "Does an object exist independently of its properties?" (No right answer, checks if they grasp the metaphysical implication).
