answer: |-
  1. It must rigorously distinguish the loss of sociopolitical complexity from mere political decentralization, as seen when Mycenaean palaces burned but villages persisted.
  2. It must specify whose collapse is being measured, acknowledging that the dissolution of a Classic Maya hierarchy often benefited ordinary farmers rather than harming them.
  3. It must remain consistent with material evidence like settlement patterns and diet, prioritizing data over written records produced by elites who lost their privileges, such as Maya scribes.
  4. It must accommodate contested narratives like Rapa Nui, where ecocide stories are increasingly challenged, without relying on settled facts that are actually still debated.
  5. The desiderata that collapse is objectively identifiable and that collapse is inherently bad cannot be jointly satisfied, since biological welfare often rises when political complexity falls.
  6. The requirement to account for population continuity rather than disappearance knocks out the most popular theories, as most people survive even when states fail.
  7. It must explain the speed of failure versus recovery, accounting for why some systems like Egypt endured while the Late Bronze Age network fractured completely.
