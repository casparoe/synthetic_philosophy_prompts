answer: |-
  # Activity Plan: The Null Event Inquiry

  **Time:** 75 Minutes
  **Group Size:** 12–16 participants (ages 16–18)
  **Setup:** 3 or 4 small tables (4–5 people each). Each table needs a large sheet of paper, markers, a deck of "Case Cards," and a stack of "Verdict Slips."

  **Philosophical Goal:** To induce a state of *aporia* (puzzlement) regarding causation by omission. Participants will find themselves compelled to affirm that absences are causes in ordinary contexts, deny that they are causes in metaphysical contexts, and struggle to distinguish between relevant and irrelevant absences without relying solely on moral blame.

  ---

  ## Part 1: The Verdict (20 Minutes)
  **Goal:** Establish the intuitive pull that omissions *are* causes.

  1.  **Introduction (5 mins):**
      *   Tell the group: "You are Causal Auditors. Your job is not to decide who is *guilty* or *bad*, but to identify what *made something happen*. We are looking for the machinery of reality, not the machinery of the law."
      *   Hand out the **Verdict Slips**. Each slip has a scenario and two checkboxes: `[ ] Physical Event` `[ ] Absence/Omission`. Below that: `Did this CAUSE the outcome? [YES] [NO]`.

  2.  **Matched Pairs Task (15 mins):**
      *   Distribute **Case Deck A**. Each table gets two pairs of cards. They must discuss and sign a Verdict Slip for each.
      *   **Pair 1 (The Medical Case):**
          *   *Card 1A:* A doctor injects a lethal drug. Patient dies.
          *   *Card 1B:* A doctor fails to inject a life-saving drug. Patient dies.
      *   **Pair 2 (The Mechanical Case):**
          *   *Card 2A:* A saboteur cuts the brake line. Car crashes.
          *   *Card 2B:* A mechanic forgets to tighten the bolt. Brake line fails. Car crashes.
      *   **Instruction:** "You must check YES or NO for 'Did this CAUSE the outcome?' You cannot say 'it depends.' Commit to a verdict."

      *   *Expected Outcome:* Almost all tables will check **YES** for all four cards. They will intuitively treat the omission (1B, 2B) as causally equivalent to the action (1A, 2A).

  ## Part 2: The Responsibility Filter (25 Minutes)
  **Goal:** Introduce the tension between metaphysics and norms. Why do we pick *some* absences and not others?

  1.  **The "Duty" Variation (15 mins):**
      *   Distribute **Case Deck B**. These cases isolate the *agent's relationship* to the event.
      *   **Pair 3 (The Drowning):**
          *   *Card 3A:* A hired Lifeguard watches a phone instead of the pool. Swimmer drowns.
          *   *Card 3B:* A random Sunbather watches a phone instead of the pool. Swimmer drowns.
      *   **Instruction:** "Look at your verdicts from Part 1. You said omissions cause things. In 3A and 3B, an omission occurred in both cases (no one jumped in). Is the *omission* the cause in both cases? If you say YES to one and NO to the other, you must write down *why* the physics changed."
      *   *Facilitator Note:* Watch for the word "Should." If they say "The lifeguard *should* have acted," interrupt: "We aren't asking about should. We are asking about the chain of events. Did the *not-jumping* cause the death in both cases physically?"

  2.  **The Proliferation Challenge (10 mins):**
      *   Distribute **Case Deck C (The Plant).**
      *   *Scenario:* A houseplant dies in your living room.
      *   **Task:** "You have agreed that 'not watering' is a cause. On the large paper, list *every* absence that, if it had been present, would have saved the plant. You have 5 minutes. Go."
      *   *Expected Outcome:* They will list: No water, no sunlight, no fertilizer. Then they will get stuck or laugh: No one sang to it? The Queen of England didn't water it? A rain cloud didn't form inside the house?
      *   **The Trap:** If "not watering" is a cause because the plant would be alive if you *had*, then "Queen not watering" is a cause because the plant would be alive if *she had*.

  ## Part 3: The Clash (15 Minutes)
  **Goal:** Force the groups to confront their contradictions.

  1.  **Gallery Walk (5 mins):** One person stays at each table to explain their "Plant List." The rest rotate to see other tables' lists.
  2.  **The Contradiction Vote (10 mins):**
      *   Bring everyone back to a large circle.
      *   Ask for a show of hands on two statements:
          1.  "An absence (like not watering) can be a genuine cause of an event."
          2.  "A cause must be an actual event or force that pushes/pulls on the world."
      *   *Observation:* Many hands will go up for **both**.
      *   **Prompt:** "If both are true, how does 'nothing' push the plant into dying? If only the second is true, why did you all sign the Verdict Slips saying the doctor's inaction caused the death?"

  ## Part 4: Debrief & Mapping (15 Minutes)
  **Goal:** Connect the activity feelings to the philosophical concepts.

  *Do not lecture immediately.* Ask the following questions to draw the concepts out of them, then label the concepts.

  1.  **The "If Only" Reasoning (Counterfactuals):**
      *   *Ask:* "In Part 1, why did you say the mechanic caused the crash?"
      *   *Likely Answer:* "Because if he had tightened it, it wouldn't have crashed."
      *   *Map:* "You are using **Counterfactual Dependence**. X causes Y if, without X, Y wouldn't happen. This works perfectly for omissions."
  2.  **The "Push" Worry (Process Theory):**
      *   *Ask:* "In the final vote, why did some of you hesitate to call an absence a 'cause'?"
      *   *Likely Answer:* "Because nothing happened." "You can't touch a 'not'."
      *   *Map:* "This is **Process Theory**. Causes need energy transfer. A ghost can't hit a ball. This is why omission feels weird metaphysically."
  3.  **The Duty Filter (Normativity):**
      *   *Ask:* "Why was the Lifeguard's inaction a cause, but the Sunbather's wasn't? Physically, they both sat still."
      *   *Likely Answer:* "It was his job." "We expect him to."
      *   *Map:* "This suggests causation isn't just physics; it's **Normative**. We select causes based on what *should* have happened. We filter the infinite absences down to the 'relevant' ones."
  4.  **The Proliferation Problem:**
      *   *Ask:* "What happened with the Queen of England and the plant?"
      *   *Map:* "If we accept omissions as causes, we have **Causal Proliferation**. Every non-event is a cause. To stop this, we have to admit that 'Cause' is partly a human judgment, not just a feature of the universe."

  ---

  ## Facilitator Notes: Predictable Pitfalls & Steering

  ### 1. The Blame Trap
  **What will go wrong:** In Part 2 (Lifeguard vs. Sunbather), the group will collapse the causal question into a moral one. "The sunbather didn't cause it because it's not his fault."
  **Why it's a problem:** It solves the puzzle too easily. It hides the metaphysical tension by substituting moral responsibility.
  **How to steer back:**
  *   *Do not say:* "That's moral, not causal."
  *   *Do say:* "Imagine both the Lifeguard and the Sunbather are robots programmed to sit still. The swimmer drowns in both worlds. Is the *physical chain of events* different in the two worlds? If the physics are identical, how can the *causation* be different?"

  ### 2. The "It's All Semantics" Dismissal
  **What will go wrong:** A participant will say, "It just depends on how you define 'cause'. There's no real answer."
  **Why it's a problem:** It shuts down the inquiry.
  **How to steer back:**
  *   *Do say:* "If it's just definitions, then science should be able to pick one and stick to it. But scientists use both. A doctor says 'lack of insulin caused the coma' (omission), but a physicist says 'forces caused the motion' (event). Why do we need two different rules for reality?"

  ### 3. The Relativist Escape
  **What will go wrong:** They decide that causation is purely subjective.
  **How to steer back:**
  *   *Do say:* "If causation is subjective, can we ever be wrong? If I say the Queen of England killing the plant is false, can you prove me wrong? If you can prove me wrong, then it's not just subjective."

  ---

  ## What This Activity Cannot Do (Your Role)

  The activity successfully generates the tension, but it cannot resolve it. You must supply the following synthesis in your closing remarks (after the debrief questions):

  1.  **The Metaphysical Cost:** Explicitly state that they have discovered a genuine rift in philosophy. There is no consensus solution.
      *   *Option A:* Deny omissions are causes (hard, makes ordinary language false).
      *   *Option B:* Accept omissions are causes (hard, requires accepting "nothing" as a real thing).
      *   *Option C:* Accept causation is "interest-relative" (it depends on what we care about).
  2.  **The "Why It Matters":** Explain why this isn't just wordplay.
      *   *Example:* "In AI safety, if a self-driving car doesn't brake, is that a 'bug' (an event) or a 'missing feature' (an omission)? In law, if a country doesn't stop a genocide, did they 'cause' it? The answer changes whether we can punish them."
  3.  **Validation:** Acknowledge that feeling uncomfortable with this is the correct philosophical response. "If you feel like your brain is slipping between two truths that don't fit, you're doing it right."

  ---

  ## Materials Checklist

  *   **Verdict Slips:** Small cards with the Case Summary and `[YES] / [NO]` checkboxes.
  *   **Case Cards:** Laminated cards with the scenarios (1A/1B, 2A/2B, 3A/3B, Plant).
  *   **Large Paper:** One sheet per table for the "Plant List."
  *   **Markers:** Multiple colors.
  *   **Timer:** Visible to the group.

  ## Timing Breakdown Summary

  *   **00:00 – 00:05:** Intro & Rules (Emphasize "Physics not Blame").
  *   **00:05 – 00:25:** Part 1 (Matched Pairs Verdicts).
  *   **00:25 – 00:50:** Part 2 (Duty Filter & Plant Proliferation).
  *   **00:50 – 01:05:** Part 3 (Clash & Vote).
  *   **01:05 – 01:15:** Part 4 (Debrief & Facilitator Synthesis).
