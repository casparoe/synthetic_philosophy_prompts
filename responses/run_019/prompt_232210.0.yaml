  2.  **Deconstruct Aumann's Agreement Theorem (AAT):**
      *   *Core Statement:* Two agents with the same prior, updating on private information, cannot have common knowledge of differing posteriors.
      *   *Key Assumptions:*
          1.  Common Prior (CPA).
          2.  Bayesian Rationality (perfect updating).
          3.  Honest Communication (truthful reporting of posteriors/partitions).
          4.  Common Knowledge of Posteriors (I know your posterior, you know mine, I know you know mine...).
