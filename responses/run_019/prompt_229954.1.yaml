prompt: |-
  I'm a senior eng lead at a consumer software company, and the same argument keeps coming up in every roadmap review: is this a normal competitive decision or are we sliding into a race to the bottom? The usual suspects: aggressive re-engagement notifications, auto-opting users into data collection, matching a competitor's release cadence because they obviously cut QA, endless engagement metrics everyone privately agrees make the product worse. I've read a little about Moloch and multipolar traps — the idea that seperate actors can each make individually rational moves and the group ends up somewhere no one actually wanted, and no single actor can unilaterally stop without losing. I want that turned into something my team can use, not just something I bring up in debates.

  Please write me a decision procedure — ideally a set of questions we ask in order — that my team can run in under an hour on any proposed feature or practice to decide whether it's the kind of Moloch / race-to-the-bottom situation we should treat as a trap. The people using it are engineers and one PM; assume no philosophy background. For each question, say what counts as a good enough answer to keep going, where the procedure stops with "this is a trap here" or "this is fine," and where it has to punt to a human because the question is really about values or market prediction rather than something a checklist can settle. The procedure has to distinguish "we're doing this because its genuinely better for users" from "we're doing this because if we don't someone else will eat our lunch," and it also needs to handle the honest case where those are both true at once. It should end in a one-page go/no-go a product lead can sign off on, and flag privacy-adjacent steps for legal as a separate line.

  Then run the procedure on three cases:

  1. A competitor shipped a "daily streak" notification that spikes retention, and our PM wants to copy it. Our data says most people pulled back by streaks don't end up more satisfied long-term, but it does lift DAU.
  2. Auto-enrolling users into telemetry collection for "product improvement," with the opt-out buried in settings.
  3. Matching a competitor's two-week release cadence, which our own postmortems say will mean cutting the QA cycle roughly in half.

  For the worked examples, be explicit about which step each case trips or passes, and make sure at least one of them comes out "don't do it" even if it happens to be the one I'd personally want to ship.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and worked examples:

  1.  **Analyze the Request:**
      *   **User:** Senior Eng Lead at a consumer software company.
      *   **Problem:** Recurring arguments in roadmap reviews about "race to the bottom" vs. "competitive necessity" (Moloch/Multipolar Traps).
      *   **Goal:** A practical decision procedure (checklist/questions) for the team (engineers + 1 PM) to use in < 1 hour. No philosophy background assumed.
      *   **Requirements:**
          *   Sequential questions.
          *   Clear pass/fail/punt criteria for each question.
          *   Distinguish "better for users" vs. "fear of competitor."
          *   Handle mixed motives.
          *   Output: One-page go/no-go for Product Lead sign-off.
          *   Specific flag for legal/privacy.
          *   Run the procedure on three specific cases (Streaks, Auto-enroll Telemetry, Faster Release Cadence).
          *   At least one example must result in "Don't do it" (even if the user might want to ship it).

  2.  **Deconstruct "Moloch" / Multipolar Traps for Software:**
      *   *Core Concept:* Individual rationality leads to collective ruin. In software, this often means sacrificing long-term trust/quality for short-term metrics because competitors are doing it.
      *   *Key Indicators:*
          *   Value extraction > Value creation.
          *   Dark patterns / Coercion.
          *   Technical debt / Quality sacrifice for speed.
          *   Metric gaming vs. User satisfaction.
          *   Irreversibility (hard to undo once done).

  3.  **Drafting the Decision Procedure (The "Trap Detector"):**
      *   *Constraint:* Must be under 1 hour. Needs to be punchy.
      *   *Structure:* 5-6 key questions.
      *   *Question 1: User Value.* Is this actually good for the user, independent of competitors? (Filters out pure mimicry).
      *   *Question 2: Reversibility.* If we do this and hate it, can we stop? (Moloch traps are often sticky).
      *   *Question 3: Metric vs. Reality.* Are we optimizing a number or an experience? (Goodhart's Law).
      *   *Question 4: Competitive Necessity.* Is this table stakes or a differentiator? (The "eat our lunch" test).
      *   *Question 5: Trust/Privacy.* Does this erode trust or require legal review? (The guardrail).
      *   *Output:* A simple scorecard/summary.

      *Refining the Questions:*
      *   Need to handle the "both true" case (good for users AND competitive pressure).
      *   Need clear "Stop" conditions.
      *   Need a "Punt to Leadership" condition for value judgments.

      *Drafting the Steps:*
      1.  **The "Stand Alone" Test:** Would we build this if we were a monopoly? (Isolates intrinsic value).
      2.  **The "Reversibility" Test:** Can we turn it off without breaking the product or angering users? (Identifies lock-in).
      3.  **The "Metric Alignment" Test:** Does the success metric correlate with long-term retention/satisfaction? (Identifies gaming).
      4.  **The "Trust & Compliance" Test:** Does this obscure user choice or touch PII? (Flags Legal).
      5.  **The "Race Condition" Test:** Are we doing this *only* because Competitor X did it? (Identifies Moloch).

      *Decision Logic:*
      *   Fail Q1 + Fail Q5 = Hard No.
      *   Pass Q1 + Pass Q3 = Green Light.
      *   Mixed results = Punt to Product Lead/Execs with specific context.

  4.  **Developing the Worked Examples:**

      *   **Case 1: Daily Streak Notifications.**
          *   *Context:* Competitor did it, lifts DAU, doesn't lift satisfaction.
          *   *Analysis:* Fails "Stand Alone" (users aren't more satisfied). Fails "Metric Alignment" (DAU vs. Satisfaction). Passes "Reversibility" (can turn off notifications).
          *   *Verdict:* High risk of Trap. Likely "No" or "Punt with Warning." Let's make it a "No" to satisfy the prompt's requirement for at least one "Don't do it."

      *   **Case 2: Auto-enroll Telemetry (Opt-out buried).**
          *   *Context:* Privacy adjacent, dark pattern.
          *   *Analysis:* Fails "Stand Alone" (users don't want this). Fails "Trust & Compliance" (Legal flag). Fails "Reversibility" (hard to get consent back once lost).
          *   *Verdict:* Hard No / Legal Stop.

      *   **Case 3: Faster Release Cadence (Cut QA).**
          *   *Context:* Matching competitor, cutting QA.
          *   *Analysis:* Fails "Stand Alone" (bugs hurt users). Fails "Metric Alignment" (Speed vs. Stability).
          *   *Verdict:* Hard No (Quality trap).

      *Wait, I need to ensure variety.* If I make all three "No," it feels unrealistic. The prompt asks to distinguish "genuinely better" from "fear."
      *   *Revision:* Let's make Case 1 the "Don't Do It" (The Moloch Trap). Let's make Case 2 the "Legal Stop" (Privacy). Let's make Case 3 the "Punt/Negotiate" (Process change).
      *   *Actually, looking at the prompt:* "make sure at least one of them comes out 'don't do it' even if it happens to be the one I'd personally want to ship."
      *   *Okay, I will ensure the Streak one is the "Don't Do It" because it's the classic engagement trap.*
      *   *Telemetry:* This should definitely flag Legal. It might be a "No" too, but for compliance reasons.
      *   *Release Cadence:* This is often a "Punt" because it's strategic.
      *   *Let's stick to the procedure's logic.*

  5.  **Refining the Output Format:**
      *   **Part 1: The Procedure.** Clear headers, bold text for actions.
      *   **Part 2: The One-Pager.** A template for the sign-off.
      *   **Part 3: The Worked Examples.** Step-by-step application.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Would we build this if we were a monopoly?" too abstract?
      *   *Fix:* Change to "The 'No Competitor' Test: If Competitor X vanished tomorrow, would we still build this?"
      *   *Critique:* Need to ensure the "Legal" flag is distinct.
      *   *Fix:* Add a specific "Red Flag" section for Privacy/Legal.
      *   *Critique:* The prompt asks for a procedure that distinguishes "better for users" from "fear."
      *   *Fix:* Ensure Question 1 isolates user value. Ensure Question 4 isolates competitive pressure.
      *   *Critique:* Need to handle the "Both True" case.
      *   *Fix:* If Q1 is Yes (Good for users) and Q4 is Yes (Competitive pressure), it's a "Green Light" (Competitive necessity aligns with value). If Q1 is No and Q4 is Yes, it's a "Trap."

  7.  **Final Polish:**
      *   Tone: Professional, engineering-focused, actionable.
      *   Length: Concise enough to be used in a meeting.
      *   Check against constraints: < 1 hour, eng/PM audience, one-page sign-off, legal flag, 3 examples with specific outcomes.

      *(Self-Correction on Case 2)*: Auto-enrolling with buried opt-out is legally risky in many jurisdictions (GDPR/CCPA). I should make sure the procedure flags this as a "Stop for Legal" rather than just a product decision.
      *(Self-Correction on Case 1)*: The prompt says "make sure at least one of them comes out 'don't do it' even if it happens to be the one I'd personally want to ship." I will frame the Streak example as the "Don't Do It" because it sacrifices long-term satisfaction for short-term DAU.

      *(Final check on Procedure Steps)*:
      1. Intrinsic Value (No Competitor Test)
      2. Metric Integrity (Long-term vs Short-term)
      3. Reversibility (Can we quit?)
      4. Competitive Driver (Why now?)
      5. Trust & Compliance (Privacy/Legal)

      *Decision Matrix:*
      *   Fail Q5 -> Stop (Legal).
      *   Fail Q1 + Pass Q4 -> Trap (Don't Do It).
      *   Pass Q1 + Pass Q4 -> Safe (Competitive Parity).
      *   Fail Q2/Q3 -> Warning (Mitigate).

      Let's write it.

  8.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Under 1 hour? Yes, 5 questions.
      *   Eng/PM audience? Yes, plain language.
      *   Pass/Fail/Punt criteria? Yes.
      *   One-page sign-off? Yes, included as template.
      *   Legal flag? Yes.
      *   3 Cases run? Yes.
      *   At least one "Don't Do It"? Yes (Case 1).

      *Wait, one nuance:* The prompt asks for the procedure to handle the case where "better for users" and "competitive pressure" are *both* true.
      *   *Logic:* If it's good for users (Q1=Yes) AND competitive pressure exists (Q4=Yes), that's not a trap. That's just market evolution. The trap is when Q1=No (bad/neutral for users) AND Q4=Yes (doing it out of fear).
      *   *Refinement:* I need to make sure the decision logic explicitly captures this distinction.

      *Let's finalize the logic:*
      *   **Trap Condition:** Low Intrinsic Value + High Competitive Pressure.
      *   **Safe Condition:** High Intrinsic Value + (High or Low) Competitive Pressure.
      *   **Legal Stop:** Any Privacy/Consent violation.

      Okay, ready to generate.cs
answer: |-
  # The "Moloch Detector": Decision Procedure for Competitive Features

  **Purpose:** To distinguish between strategic competitive moves and "race to the bottom" traps (multipolar traps) where short-term gains erode long-term product health.
  **Users:** Engineering Lead, Product Manager.
  **Timebox:** 45–60 Minutes.
  **Output:** A signed "Feature Risk Profile" (template below).

  ---

  ## Part 1: The 5-Step Procedure

  Run through these questions in order. Record the answer and the evidence (data, postmortems, user research) for each.

  ### 1. The "No Competitor" Test (Intrinsic Value)
  **Question:** If our main competitor vanished tomorrow, would we still build this feature exactly as proposed?
  *   **Pass (Yes):** We believe this adds genuine user value independent of market pressure.
  *   **Fail (No):** We are only building this because they did.
  *   **Mixed:** It adds value, but the *urgency* is driven by the competitor.
  *   **Action:** If **Fail**, proceed to Step 4. If **Pass**, proceed to Step 2.

  ### 2. The Metric Integrity Test (Goodhart's Law)
  **Question:** Does the primary success metric correlate with long-term user satisfaction/retention (6+ months), or is it a short-term vanity metric (e.g., DAU, click-through)?
  *   **Pass:** Metric correlates with long-term health (e.g., NPS, 6-month retention, task success rate).
  *   **Fail:** Metric is short-term only, and historical data shows no long-term benefit (or negative impact).
  *   **Action:** If **Fail**, flag as **High Risk**. Proceed to Step 3.

  ### 3. The Reversibility Test (Exit Strategy)
  **Question:** If we ship this and decide it was a mistake in 3 months, can we turn it off without breaking the product or angering users?
  *   **Pass:** Feature flag exists; removal is invisible or neutral to users.
  *   **Fail:** Removal breaks workflows, or users will perceive removal as a loss of functionality (lock-in).
  *   **Action:** If **Fail**, flag as **Irreversible Risk**. Proceed to Step 4.

  ### 4. The Pressure Source Test (Motivation)
  **Question:** What is the primary driver for doing this *now*?
  *   **Option A:** User need / Product vision.
  *   **Option B:** Sales/Revenue pressure.
  *   **Option C:** Competitor shipped it / Fear of churn.
  *   **Action:** If **Option C** is the dominant driver AND Step 1 was a **Fail**, this is a **Moloch Trap**. Stop and Punt to Leadership.

  ### 5. The Trust & Compliance Test (Legal Guardrail)
  **Question:** Does this feature obscure user choice, collect data without explicit consent, or alter default settings to benefit the company over the user?
  *   **Pass:** No privacy impact; defaults are user-centric.
  *   **Fail:** Opt-out is hidden, data is auto-collected, or consent is assumed.
  *   **Action:** If **Fail**, **STOP**. Send to Legal/Privacy Counsel. Do not proceed without written approval.

  ---

  ## Part 2: Decision Logic & Sign-Off

  Based on the answers above, categorize the proposal:

  | Condition | Verdict | Action |
  | :--- | :--- | :--- |
  | **Step 5 = Fail** | **STOP** | Route to Legal. No engineering work starts. |
  | **Step 1 = Fail + Step 4 = Option C** | **TRAP** | **Do Not Build.** Escalate to Execs if business insists. |
  | **Step 2 = Fail** | **WARNING** | Build only with agreed-upon long-term guardrails (e.g., churn monitoring). |
  | **Step 3 = Fail** | **CAUTION** | Requires Executive sign-off due to irreversibility. |
  | **All Pass** | **GO** | Proceed to roadmap. |

  ### The One-Page Sign-Off (Template)

  **Feature Name:** ___________________
  **Date:** ___________________
  **PM:** ___________________ **Eng Lead:** ___________________

  **1. Intrinsic Value:** [ ] Yes [ ] No [ ] Mixed
  **2. Metric Health:** [ ] Long-term [ ] Short-term Only
  **3. Reversibility:** [ ] Easy [ ] Hard [ ] Impossible
  **4. Primary Driver:** [ ] User Need [ ] Revenue [ ] Competitor Fear
  **5. Privacy/Legal:** [ ] Clear [ ] **FLAGGED FOR REVIEW**

  **Final Classification:**
  [ ] **GO** (Safe to ship)
  [ ] **GO WITH GUARDRAILS** (Monitor specific metrics)
  [ ] **NO-GO** (Moloch Trap / Quality Risk)
  [ ] **PUNT TO LEADERSHIP** (Values/Strategy decision required)

  **Sign-off:** ___________________

  ---

  ## Part 3: Worked Examples

  Here is how your team applies the procedure to the three cases you provided.

  ### Case 1: Competitor "Daily Streak" Notifications
  *Proposal: Copy competitor's streak notification to lift DAU.*

  *   **Step 1 (No Competitor):** **FAIL.**
      *   *Evidence:* Internal data shows users pulled back by streaks are not more satisfied long-term. If competitor vanished, we wouldn't prioritize this.
  *   **Step 2 (Metric Integrity):** **FAIL.**
      *   *Evidence:* Lifts DAU (short-term), no lift in 6-month retention or satisfaction.
  *   **Step 3 (Reversibility):** **PASS.**
      *   *Evidence:* Can turn off notifications via flag.
  *   **Step 4 (Pressure Source):** **OPTION C (Competitor Fear).**
      *   *Evidence:* PM explicitly cited competitor retention spike as justification.
  *   **Step 5 (Trust):** **PASS.**
      *   *Evidence:* Notifications are standard, no privacy violation.

  **Decision Logic:** Step 1 Fail + Step 4 Option C = **Moloch Trap**.
  **Verdict:** **NO-GO.**
  **Reasoning:** We are optimizing a vanity metric (DAU) at the expense of user satisfaction, driven solely by competitor anxiety. This degrades product quality for a temporary numbers game.
  *(Note: This satisfies your requirement for a "Don't Do It" outcome on a feature you might personally want to ship for growth.)*

  ### Case 2: Auto-Enroll Telemetry (Opt-out Buried)
  *Proposal: Turn on telemetry by default, hide opt-out in deep settings.*

  *   **Step 1 (No Competitor):** **FAIL.**
      *   *Evidence:* Users generally prefer explicit consent. We wouldn't do this if privacy norms weren't eroding industry-wide.
  *   **Step 2 (Metric Integrity):** **PASS.**
      *   *Evidence:* More data helps product improvement (long-term value).
  *   **Step 3 (Reversibility):** **FAIL.**
      *   *Evidence:* Once trust is lost or data is collected, you cannot "un-collect" it easily. Public backlash is hard to reverse.
  *   **Step 4 (Pressure Source):** **OPTION C (Competitor Fear/Industry Standard).**
      *   *Evidence:* "Everyone else is doing it" is the main driver.
  *   **Step 5 (Trust & Compliance):** **FAIL.**
      *   *Evidence:* Burying opt-out violates GDPR/CCPA spirit and potentially letter. Dark pattern.

  **Decision Logic:** Step 5 Fail = **STOP**.
  **Verdict:** **STOP (Legal Flag).**
  **Reasoning:** Regardless of product value, this triggers immediate legal/compliance review. The "buried opt-out" is a regulatory risk.
  **Action:** Send to Legal. Do not write code.

  ### Case 3: Matching Competitor Release Cadence (Cut QA)
  *Proposal: Move from 4-week to 2-week releases, reducing QA time by 50%.*

  *   **Step 1 (No Competitor):** **FAIL.**
      *   *Evidence:* Postmortems show bugs increase with less QA. We wouldn't choose this for stability reasons.
  *   **Step 2 (Metric Integrity):** **MIXED.**
      *   *Evidence:* Speed metric improves, Stability metric (crash-free sessions) likely worsens.
  *   **Step 3 (Reversibility):** **FAIL.**
      *   *Evidence:* Users expect the new cadence. Slowing down later looks like regression. Tech debt accumulates.
  *   **Step 4 (Pressure Source):** **OPTION C (Competitor Fear).**
      *   *Evidence:* "They ship faster, we look slow."
  *   **Step 5 (Trust):** **PASS.**
      *   *Evidence:* No privacy impact.

  **Decision Logic:** Step 1 Fail + Step 4 Option C + Step 3 Fail = **TRAP / PUNT.**
  **Verdict:** **PUNT TO LEADERSHIP.**
  **Reasoning:** This is a classic quality-vs-speed trap. Engineering cannot unilaterally decide to degrade quality to match a competitor. However, business strategy might dictate taking the risk.
  **Action:** Fill out Sign-Off. Mark as **PUNT**. Executives must sign off on accepting the increased bug rate/tech debt as a strategic cost. Engineering registers formal objection in the document.

  ---

  ### How to use this in your next review:
  1.  **Print the Procedure:** Hand it out at the start of the roadmap meeting.
  2.  **Apply to the Hot Button:** When the "Streak" or "Telemetry" idea comes up, pause and say, "Let's run the Detector."
  3.  **Let the Paper Say No:** If the checklist flags a "Moloch Trap," it depersonalizes the objection. You aren't saying "I don't like this"; the procedure says "This fits the definition of a value-eroding trap."
  4.  **Escalate the Punt:** For Case 3, use the sign-off to force leadership to own the quality trade-off explicitly, rather than letting it slide as an implicit engineering failure.
