answer: |-
  You have accidentally stumbled into one of the most famous problems in modern philosophy and psychology. You and your friend aren't just arguing about your cousin; you are reenacting a well-documented phenomenon known as **The Knobe Effect** (or the Side-Effect Effect).

  Here is the breakdown of who is right, why you feel stuck, and where the actual inconsistency lies.

  ### 1. The Context: The Knobe Effect
  In 2003, a philosopher named Joshua Knobe ran experiments almost exactly like your scenario.
  *   **Case A (Harm):** A VP is told a project will hurt the environment to make profit. He says, "I don't care, let's do it." -> **82% of people said he *intentionally* harmed the environment.**
  *   **Case B (Help):** A VP is told a project will help the environment to make profit. He says, "I don't care, let's do it." -> **Only 23% of people said he *intentionally* helped the environment.**

  Your friend is arguing from the position of the majority of human intuition (The Knobe Effect). Your friend is claiming that our definition of "intentional" is not neutral; it is loaded by morality. We call bad side effects "intentional" because we want to blame the agent. We call good side effects "accidental" because we don't feel the agent deserves praise.

  ### 2. Where You Stand (The Strict Definition)
  You argued that in **both** cases, the outcome was not intentional because it was not the *goal*. The goal was profit; the environmental impact was a foreseen side effect.
  *   **Your Logic:** Intent = Purpose/Goal.
  *   **Your Consistency:** If you truly said "No, it wasn't intentional" to *both* the pollution case and the climate help case, **you are logically consistent.** You are applying a strict, mechanical definition of intentionality.

  *However, there is a snag in your story.* You wrote: *"My friend says that means my cousin intentionally polluted the river. I said no way... So my friend says: there it is. When the side effect is bad you'll call it intentional."*

  If you explicitly told your friend "No, it wasn't intentional" in the first case, your friend's conclusion ("When the side effect is bad you'll call it intentional") is factually wrong about *this specific conversation*.

  **But,** your friend is likely sensing something deeper: Even if you deny the *word* "intentional," do you blame your cousin as if he *did* do it intentionally? That is likely what your friend means. They are arguing that your *moral judgment* treats the bad outcome as an intentional act (worthy of full blame), while your *hypothetical judgment* treats the good outcome as a lucky accident (worthy of no praise).

  ### 3. Where Your Friend Stands (The Moral Definition)
  Your friend is arguing that language isn't a computer code; it's a social tool. In social contexts, "intentional" often functions as a synonym for "responsible enough to blame."
  *   **Their Logic:** Intent = Moral Responsibility.
  *   **Their Point:** If you hold your cousin fully responsible for the pollution (which you likely do), you are treating it *functionally* as an intentional act, even if you dispute the semantics.

  Your friend is right that human psychology is inconsistent here. We have a bias where bad outcomes "stick" to the agent more than good outcomes.

  ### 4. Who is Right?
  **You are right about the definition; your friend is right about the psychology.**

  *   **Technically/Philosophically:** You are correct. In ethics and law, there is a distinction between *purpose* (direct intent) and *knowledge* (foresight). Your cousin had knowledge, not purpose. If "intentional" means "my primary goal," then neither the pollution nor the climate help was intentional.
  *   **Legally:** It gets murky. In many legal systems, if you knowingly cause a result with "depraved indifference" (like your cousin saying "I don't care about the river"), the law often treats that *as if* it were intentional for the sake of liability. This is called **Oblique Intent**. So, while your cousin didn't *want* the pollution, he accepted it as the price of business, which makes him legally and morally liable.
  *   **Psychologically:** Your friend is correct that most people (and perhaps your underlying gut feeling) conflate "knowingly causing harm" with "intentionally causing harm."

  ### 5. The Verdict on Inconsistency
  If you truly answered "No" to both scenarios, **you are not inconsistent.** You are holding a principled, strict definition of intent.

  However, your friend has a point if they are arguing about **blame**.
  *   If you say: "He didn't *intentionally* pollute, but he is 100% to blame and should be punished,"
  *   And you say: "He didn't *intentionally* help, and he deserves no credit or reward,"

  Then you are treating the bad side effect as something he "owns" and the good side effect as something he doesn't. Your friend is pointing out that the word "intentional" is just the vessel we use to carry that ownership.

  ### How to Resolve the Argument
  You don't need a comeback to "win," because you are actually on solid philosophical ground, but you can acknowledge the nuance to end the fight. You could say:

  > "I thought about it, and I think we're defining 'intentional' differently. I'm using the strict definition: Intent means it was your *goal*. Since his goal was profit, neither the pollution nor the climate help was intentional. I'm consistent on that.
  >
  > But you're right about one thing: Even if it wasn't his *goal*, he knew it would happen and didn't care. That makes him morally responsible for the pollution in a way that feels like intent. I'm willing to blame him fully for the river without needing to call it 'intentional.' Does that make sense?"

  **Summary:** You aren't being inconsistent if you applied the "No" to both cases. But your friend correctly identified that human beings usually *are* inconsistent, letting our desire to blame determine our definition of intent. You're trying to be precise; your friend is observing how people actually behave. Both insights are valuable.
