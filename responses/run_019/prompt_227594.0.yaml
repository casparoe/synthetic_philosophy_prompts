      *   **The Core Argument:** A 7-step argument against Coherent Extrapolated Volition (CEV).
          *   Premise 1: Goals count as "mine" only if fixed by facts about me.
          *   Premise 2: Actual preferences are messy (motivation for CEV).
          *   Step 3: CEV extrapolates an idealized version.
          *   Step 4: Extrapolation requires hyperparameters/settings (how much smarter, which biases to remove, etc.).
          *   Step 5: Nothing about "me" fixes these settings (infinite regress if I try to specify them).
