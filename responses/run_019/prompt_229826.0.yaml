prompt: |-
  I've been going back and forth with my brother about whether you're allowed to keep a belief mainly because it holds your life together — he recently left our church and now says anyone who believes on faith is being intellectually dishonest, and I don't know how to push back. So I picked up a popular philosophy book with a chapter on the "ethics of belief" debate, and it summarizes Clifford and James like this. Clifford says it's always morally wrong to believe anything without proof, because beliefs drive action and leak into how we treat other people; the book gives his shipowner example, where a man talks himself into thinking his maybe-unseaworthy ship is fine and sends it out, and Clifford's point is that he'd be at fault even if the ship made it back. James replies that Clifford is asking something impossible and even harmful: for some questions the evidence is just evenly balanced, but the choice is forced and the stakes are high, and in those cases we're entitled to let our feelings and commitments decide rather than the evidence. The chapter then says this is why James thought religious faith was acceptable even though it isn't supported by evidence, while Clifford thought religious believers were morally at fault for going beyond the evidence.

  I can't tell how much of this is a fair summary and how much is the author making James more permissive than he actually is. Could you seperate what's accurate, what's a common simplification, and what a defender of each side would object to in that picture? I especially want to know whether Clifford really requires proof, or just sufficient evidence, and whether James's actual test is narrower than "the evidence is balanced, so choose what makes your life go better." And does the book's conclusion about religious belief survive once those points are corrected? Please answer in British English, and make the very last line a one-sentence summary of your overall verdict.
