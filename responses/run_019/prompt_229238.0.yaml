          *   *Idea:* "How long will this specific meetup group last?" (Too meta/emotional).
          *   *Idea:* "When will AI reach AGI?" (Too controversial/vague).
          *   *Idea:* "How long will a specific restaurant stay open?" (Good, but maybe too simple).
          *   *Idea:* "How long will a specific academic paradigm last?" (Good for this crowd).
          *   *Selection:* **The lifespan of a specific technology standard (e.g., USB-C dominance).** Or **The lifespan of a specific political administration.**
          *   *Better:* **The lifespan of a startup that just reached Series B.** (Actuaries/Engineers get this).
          *   *Best:* **The duration of a current great power rivalry (e.g., US-China).** Matches the empire theme but is distinct.
          *   *Let's go with:* **The lifespan of a specific scientific theory's dominance.** (Fits the "epistemics" theme).
          *   *Actually, let's stick to the prompt's request for a "forecasting case".* Let's use **The survival time of a new restaurant in this city.** It's concrete, has data, but people love to judge the food (inside view).
          *   *Wait, the prompt asks for a question whose answer shows the idea landed.*
          *   *Question:* "I'm opening a rationalist meetup in a new city. What's the first number I should write down?"
          *   *Wrong Answer:* "Well, it depends on our funding and passion..." (Inside view).
          *   *Right Answer:* "What's the base rate for meetup groups in new cities surviving past year 1?" (Outside view).

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Base Rates:* The user said "base rates as priors must precede any talk of reference-class selection." I need to explicitly state this is backward. You select the class *to get* the base rate.
      *   *Empire Definition:* Make sure to emphasize *operational* definition vs. *philosophical* definition.
      *   *Misconception:* Add "The Stationarity Assumption." This is huge for empires. The Bronze Age collapse isn't the same as the Nuclear Age.
      *   *Tone Check:* Keep it sharp. No fluff. Use rationalist terminology correctly (priors, updates, steelman).

  5.  **Final Polish:**
      *   Check timing (50 mins is tight).
      *   Ensure whiteboard instructions are clear.
      *   Verify American English spelling/idioms.

  6.  **Final Review against constraints:**
      *   Plan the explanation? Yes.
      *   Sequence justification? Yes.
      *   Why empires? Yes.
      *   Misconception map? Yes.
      *   Definition fencing? Yes.
      *   End-of-session question? Yes.

  *(Self-Correction on the "Base Rate before Class" point)*: I need to be careful not to sound condescending. The user is smart. I should frame it as "Logical dependency" rather than "You are wrong." The *concept* of a prior is needed, but the *value* comes from the class.

  *(Refining the End Question)*: The prompt asks for a "new forecasting case, not an empire one."
  Let's use: **"How many years until the current U.S. housing market correction ends?"**
  *Wrong:* Analysis of interest rates, inventory (Inside).
  *Right:* "What is the historical duration of housing corrections in OECD countries?" (Outside).
  *Actually, let's go with something more "meetup" appropriate.*
