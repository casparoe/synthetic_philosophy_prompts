      *   **Goal:** Teach the *outside view* (reference class forecasting) properly in 50 minutes with a whiteboard.
      *   **Topic:** Lifespan of empires (as the core example).
      *   **Constraints:** Plan the explanation (sequence/structure), justify the ordering, explain why "empires" works better than "planning fallacy" examples, define the misconception map (where to head them off, how to defuse), handle the "what is an empire" definition problem, and provide an end-of-session test question.
      *   **Tone:** American English, professional, instructional, rationalist-adjacent (precise, epistemic humility).

  2.  **Deconstruct the Sequence (Ordering):**
      *   *User's Instinct:* Inside View $\rightarrow$ Outside View $\rightarrow$ Base Rates as Priors $\rightarrow$ Reference Class Construction (last).
      *   *Critique:*
          *   Inside vs. Outside contrast is crucial. Start there.
          *   Base rates as priors *before* class selection? Actually, you can't have a base rate without a class. So Class Selection must come before calculating the Base Rate.
          *   Class Construction last? Yes, because it's the hardest part and where the nuance lives. But you need to introduce the *concept* of a class early.
          *   *Refined Sequence:*
              1.  Hook/Contrast (Inside vs. Outside).
              2.  The Mechanism (Reference Class $\rightarrow$ Distribution $\rightarrow$ Prior).
              3.  The Example (Empires).
              4.  The Trap (Class Selection/Definition).
              5.  Integration (Updating with Inside View).
      *   *Correction on User's Instinct:* The user thinks "base rates as priors must precede any talk of reference-class selection." This is logically impossible. You need the class to get the rate. I need to gently correct this. The *concept* of a prior comes early, but the *calculation* depends on the class.
      *   *Why Empires?* Planning fallacy examples (kitchens, essays) are too personal and trivial. People feel they "know" their own kitchen. Empires are distant, high-stakes, complex, and have hard data (dates) but fuzzy definitions. This forces the discipline of the outside view because the inside view is impossible for most (you can't interview a Roman Senator).

  3.  **Drafting the Plan (Section by Section):**

      *   **Part 1: The Sequence & Justification.**
          *   Need to validate the "Inside first" intuition.
          *   Need to correct the "Base Rate before Class" intuition.
          *   Need to emphasize the "Class Construction" as the climax, not just an afterthought.
          *   *Structure:*
              1.  The Inside View (The Trap).
              2.  The Outside View (The Tool).
              3.  The Empire Case (The Application).
              4.  The Reference Class Problem (The Hard Part).
              5.  Bayesian Update (The Synthesis).

      *   **Part 2: Why Empires?**
          *   Emotional distance (no skin in the game).
          *   Complexity (resists simple inside-view modeling).
          *   Data availability (start/end dates exist, unlike "success" of a startup).
          *   Avoid: Teleology (thinking the fall was inevitable), Presentism (judging past by modern standards).

      *   **Part 3: Misconception Map.**
          *   *Base Rate Neglect:* "But this empire is special." -> Defuse: "Specialness is an inside-view claim; prove it predicts longevity."
          *   *Reference Class Tennis:* Narrowing the class until $N=1$. -> Defuse: "If $N=1$, you have no distribution, just a story."
          *   *Survivorship Bias:* Only counting famous empires. -> Defuse: "We need the failed states that didn't become empires." (Actually, for lifespan, we need empires that died. Survivorship is more about 'which empires exist now'. Let's refine: Survivorship in *recording*. We only know about big empires.)
          *   *Verdict vs. Prior:* Treating outside view as the final answer. -> Defuse: "It's the starting line, not the finish line."
          *   *Lindy Effect:* Confusing survival so far with expected remaining life. -> Defuse: "Lindy is a specific heuristic, not the base rate itself."
          *   *Missing Misconception:* *The "Average" Fallacy.* Assuming the mean is the prediction, ignoring the variance (skew). Empires might have a fat-tailed distribution.
          *   *Missing Misconception:* *Stationarity.* Assuming the past distribution applies to the future (nuclear weapons change empire dynamics).

      *   **Part 4: Defining "Empire".**
          *   Don't solve it. *Operationalize* it.
          *   "For this exercise, an empire is a polity controlling >1M sq km for >50 years." (Or similar).
          *   Write it on the board. "We are forecasting *this*, not 'Empire'."

      *   **Part 5: End-of-Session Question.**
          *   Needs to be new. Not empires.
