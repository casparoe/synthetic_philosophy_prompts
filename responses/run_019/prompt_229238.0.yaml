answer: |-
  Here is the plan for your fifty-minute session.

  ### Part 1: The Sequence and Structure

  Your instinct to start with the **Inside View** is correct, but your ordering of **Base Rates** and **Reference Class Selection** needs a logical adjustment. You cannot establish a base rate *before* selecting a reference class; the class *generates* the rate. If you teach base rates as abstract priors first, you risk reinforcing the idea that they are magic numbers pulled from thin air rather than statistical outputs of a specific grouping.

  Here is the corrected flow, designed for a whiteboard and a 50-minute clock:

  1.  **The Inside View (0–10 mins):** Define it as "predicting by modeling the specific details of the case." Elicit examples from the room (e.g., "This empire has strong institutions"). *Whiteboard:* Draw a magnifying glass over a single data point.
  2.  **The Outside View (10–20 mins):** Define it as "predicting by treating the case as a member of a class." *Whiteboard:* Draw a histogram. Show that the specific case is just one dot in a distribution.
  3.  **The Empire Case Study (20–35 mins):** Apply the Outside View to empire lifespans. This is where you calculate the base rate *from* the class.
  4.  **The Reference Class Problem (35–45 mins):** This is the climax. Show how changing the class definition changes the prediction. This is where the "discipline" lives.
  5.  **Bayesian Integration (45–50 mins):** Briefly explain that the Outside View is the *prior*, which the Inside View *updates*. It is not a verdict.

  **Why this ordering works:**
  By placing the Reference Class Problem *after* the initial calculation, you create a "gotcha" moment. The audience will feel confident in their first base rate, and then you destabilize it by showing how fragile class selection is. This mimics the actual cognitive work of forecasting: confidence, then doubt, then calibration.

  ### Part 2: Why Empires? (And What to Avoid)

  You are right to abandon kitchen renovations and student essays. Your audience (actuaries, engineers, economists) is inoculated against the planning fallacy in personal tasks; they know they are bad at estimating their own writing speed. They do not, however, feel personally incompetent about the fall of Rome.

  **Why Empires Carry the Load:**
  1.  **Emotional Distance:** No one in the room has skin in the game regarding the Qing Dynasty. This reduces motivated reasoning.
  2.  **High Complexity:** Empires are complex systems. The Inside View (analyzing institutions, generals, geography) feels plausible but is notoriously noisy. This highlights the value of the Outside View's simplicity.
  3.  **Hard Endpoints:** Unlike "success" or "happiness," empires have (roughly) agreed-upon start and end dates. This allows you to draw an actual distribution on the whiteboard.

  **What the Example Must Have:**
  *   **A Distribution, Not a Mean:** Do not just write "Empires last 200 years." Draw the curve. Show the fat tails (some last 50 years, some 1,000). This teaches that the base rate is uncertainty, not a number.
  *   **Stationarity Tension:** The example must invite the question, "Does the past apply to the future?" (e.g., nuclear weapons change empire dynamics). This forces the audience to think about *which* past empires belong in the class.

  **What to Avoid:**
  *   **Teleology:** Do not let the discussion drift into *why* empires fell. That is Inside View work. Keep the focus on *how long* they lasted.
  *   **Presentism:** Avoid judging past empires by modern moral standards, which distracts from the structural forecasting task.

  ### Part 3: The Misconception Map

  This is where you earn your keep. Do not wait for these to arise; preempt them during the relevant sequence steps.

  | Misconception | Where to Head It Off | The Defusing Move (Whiteboard/Script) |
  | :--- | :--- | :--- |
  | **"This Case is Special" (Base Rate Neglect)** | During **Inside View** definition. | **Script:** "The Inside View tells you *why* it's special. The Outside View asks if 'specialness' predicts longevity. Write 'Unique Institutions' on the board. Ask: 'Did Rome also think that?'" |
  | **Reference Class Tennis** (Narrowing the class until $N=1$) | During **Reference Class Problem** (Step 4). | **Whiteboard:** Draw a circle labeled "Empires." When someone suggests "Industrialized Naval Empires," draw a smaller circle inside. Write "$N=3$." **Script:** "If your class has three members, you don't have a distribution. You have an anecdote." |
  | **Survivorship Bias** (Counting only famous empires) | During **Empire Case Study** (Step 3). | **Script:** "We are counting the failures. If we only study empires that lasted 500+ years, we are studying the winners of a lottery, not the odds of winning." |
  | **Outside View as Verdict** (Ignoring Inside View evidence) | During **Bayesian Integration** (Step 5). | **Script:** "The Outside View is the starting line, not the finish line. If you have genuine, predictive inside information, you update. But you must start at the base rate." |
  | **Lindy vs. Base Rate Confusion** | During **Empire Case Study**. | **Script:** "Lindy says 'the older it gets, the longer it lasts.' Base Rate says 'most things die young.' These are different models. Don't conflate survival so far with expected remaining life." |
  | **The Stationarity Assumption** (Missing) | During **Reference Class Problem**. | **Script:** "Does the fall of Bronze Age kingdoms predict the fall of a nuclear-armed state? If not, they aren't in the same reference class." |

  **Missing Misconception Flag:**
  **The "Average" Fallacy.** Your audience includes actuaries. They know distributions, but the history hobbyists might fixate on the *mean*. Empires likely follow a power law or exponential distribution, not a normal bell curve.
  *   **Defuse:** When drawing the histogram, skew it heavily to the right. Explicitly state: "The average is misleading. The median is safer. The mode is 'collapse within 100 years'."

  ### Part 4: Fencing the Definition of "Empire"

  You are correct: the definitional question will eat the session. You must operationalize the term without claiming philosophical truth.

  **The Move:**
  At the start of the Empire Case Study (Step 3), write this on the board:
  *"Working Definition: A polity controlling >1M sq km for >50 years."*

  **The Script:**
  "We are not solving philosophy today. We are solving a forecasting problem. For the next 20 minutes, 'Empire' means the definition on the board. If you think a specific case violates this, note it as a 'Reference Class Boundary Issue' for the end of the session. Do not let definition debates stop the calculation."

  This validates the objection (it is a boundary issue) without letting it derail the math.

  ### Part 5: The End-of-Session Test Question

  Do not ask them to forecast an empire. Ask them to identify the *method* in a new context.

  **The Question:**
  "A friend is launching a new podcast about rationality. She has high production value, a famous guest lined up, and full-time funding. She asks you: 'How long will this podcast last?' What is the **first** number you should look for?"

  **The Right Answer (Idea Landed):**
  "What is the base rate survival curve for new podcasts in this genre?" or "What percentage of podcasts survive past episode 10?"
  *   *Why:* It prioritizes the Reference Class (podcasts) over the Inside View details (funding, guests).

  **The Wrong-but-Confident Answer (Idea Missed):**
  "Well, it depends on her monetization strategy and audience retention metrics."
  *   *Why:* This is pure Inside View. It ignores the base rate of podcast failure, which is the necessary prior.

  **Alternative Wrong Answer (Over-Correction):**
  "Podcasts usually fail in 6 months, so hers will too."
  *   *Why:* This treats the Outside View as a verdict rather than a prior to be updated by the "full-time funding" evidence.

  **Instruction to Audience:**
  "Write down the *first* data point you would search for on Google. You have 30 seconds."

  This forces them to demonstrate the *sequence* of thought, which is the core skill you are teaching.
