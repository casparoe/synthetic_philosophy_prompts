      *   **Problem with Hunch:** It fails on Case 6 (stammer = individual condition? but user sees injustice) and Case 5 (record = individual fact? but user is uneasy).
      *   **Output Requirements:** Precise principle, clauses tied to cases, predictions for new cases (interpreter, titled surgeon), honest accounting of mismatches/revisions.

  2.  **Deconstruct the Cases & Verdicts:**
      *   (1) Forensic accountant (paid by rival) $\rightarrow$ Discounted. Verdict: Sensible. (Factor: Financial Interest/Bias).
      *   (2) Dementia patient (confused) $\rightarrow$ Discounted. Verdict: No wrong. (Factor: Cognitive Capacity/Competence).
      *   (3) Young woman painter (dismissed as wife) $\rightarrow$ Discounted. Verdict: Unfair/Wrong. (Factor: Gender/Role Stereotype).
      *   (4) Young Black man (pain dismissed as drug-seeking) $\rightarrow$ Discounted. Verdict: Serious Wrong. (Factor: Race/Prejudice).
      *   (5) Man with shoplifting record (assault claim) $\rightarrow$ Discounted (no CCTV check). Verdict: Torn. (Factor: Past Character/Record vs. Procedural Duty).
      *   (6) Stammering science writer (vs. fluent consultant) $\rightarrow$ Discounted. Verdict: Clear Injustice. (Factor: Communicative Disability vs. Professional Status).
      *   (7) Serial fabulist uncle (burglary claim) $\rightarrow$ Discounted. Verdict: No wrong. (Factor: Established Individual Track Record).

  3.  **Evaluate the User's Hunch (Identity Prejudice vs. Individual Evidence):**
      *   *Hunch:* Wrong = Social Group; Right = Individual Track Record/Condition.
      *   *Failure 1 (Case 6):* Stammer is an individual condition, yet the user perceives injustice. Why? Because fluency was treated as a proxy for truth, overriding evidence. It's a *structural* bias against disability, not just an individual assessment.
      *   *Failure 2 (Case 5):* Record is individual, yet the user is uneasy. Why? Because the record was used to bypass *further investigation* (CCTV). It's a procedural failure, not just a credibility assessment.
      *   *Successes:* (1), (2), (7) fit the "Individual Evidence" side (Interest, Capacity, Track Record). (3), (4) fit the "Social Group" side (Sexism, Racism).

  4.  **Develop a Better Principle (Social Epistemology Framework):**
      *   Need to distinguish between *rational discounting* based on reliability indicators and *wrongful discounting* based on prejudice or procedural vice.
      *   *Miranda Fricker's Testimonial Injustice:* Prejudice causes a deficit in credibility. This covers (3) and (4).
      *   *The Problem:* Fricker's account struggles with (6) (is ableism a prejudice? yes, but the user's hunch called it a 'condition') and (5) (is past record prejudice? no, but the *use* of it was wrongful).
      *   *Refinement:* We need to distinguish between *indicators of reliability* and *indicators of status*.
      *   *Key Distinction:* Is the factor used *truth-conducive* in this context, and is it applied *proportionately*?
      *   *Case 6:* Stammer affects delivery, not truth. Fluency affects delivery, not truth. Treating fluency as truth-conducive is an error of epistemic virtue.
      *   *Case 5:* Past lying/theft is truth-conducive regarding honesty, *but* ignoring corroborating evidence (CCTV) is a procedural epistemic vice.
      *   *Case 1 & 7:* Financial interest and past fabrication are directly truth-conducive regarding the specific claim.
      *   *Case 2:* Dementia affects cognitive capacity to perceive/retain. Directly truth-conducive.

      *   *Proposed Principle:* **The Principle of Epistemic Justice and Procedural Proportionality.**
      *   A hearer wrongs a speaker when they reduce credibility based on a trait that is (a) not truth-conducive regarding the specific claim, or (b) is truth-conducive but applied in a way that bypasses necessary procedural verification available.
      *   Wait, let's refine. The user wants to know *when they wrong the speaker*.
      *   Let's look at the *source* of the doubt.
      *   *Legitimate Grounds:* Competence (2), Bias/Interest (1), Specific Track Record (7).
      *   *Illegitimate Grounds:* Identity Prejudice (3, 4), Irrelevant Communicative Style (6), Overgeneralised Record without Corroboration (5).

      *   *Synthesis:* The distinction isn't just Group vs. Individual. It's **Relevance** and **Proportionality**.
      *   *Relevance:* Does the trait actually impact the likelihood of truth *in this instance*? (Stammer = No. Race = No. Gender = No. Dementia = Yes. Financial Interest = Yes).
      *   *Proportionality:* Even if relevant (like the shoplifting record), does the discount preclude reasonable verification? (Case 5: Yes, it stopped the CCTV check).

  5.  **Drafting the Principle:**
      *   Let's call it the **Principle of Truth-Conducive Relevance and Epistemic Diligence**.
      *   Clause 1 (Relevance): Credibility may only be adjusted on grounds that are rationally connected to the likelihood of the testimony being true *in the specific context*. (Rules out 3, 4, 6).
      *   Clause 2 (Diligence): Even where grounds are relevant (e.g., past record), credibility adjustments must not foreclose accessible avenues of verification that would resolve the uncertainty. (Rules out the wrongful part of 5).
      *   Clause 3 (Individual vs. Structural): The distinction is not Group vs. Individual, but Stereotype vs. Evidence. A group trait is permissible *only* if it functions as actual evidence in the context (rare), whereas individual traits are permissible *only* if they are not proxies for prejudice.

      *   *Wait, Case 6 is tricky.* The chair didn't necessarily use a stereotype about stammerers, but privileged fluency. This is *communicative injustice*.
      *   *Case 5 is tricky.* The record is relevant evidence. The wrong is the *cessation of inquiry*.

      *   *Revised Principle:* **The Principle of Non-Prejudicial Relevance and Continuing Inquiry.**
      *   A hearer wrongs a speaker if:
          1.  The credibility deficit is assigned on the basis of a trait that is not truth-conducive regarding the specific assertion (covers 3, 4, 6).
          2.  OR, where a trait is truth-conducive (e.g., past dishonesty), the hearer allows that deficit to terminate inquiry prematurely when verification is possible (covers 5).

  6.  **Testing against Cases:**
      *   (1) Accountant: Interest is truth-conducive (bias). Inquiry continues (jury still hears it, just weighted). **No Wrong.** (Matches).
      *   (2) Dementia: Capacity is truth-conducive. **No Wrong.** (Matches).
      *   (3) Painter: Gender/Role is not truth-conducive regarding art. **Wrong.** (Matches).
      *   (4) Patient: Race is not truth-conducive regarding pain. Stereotype is prejudicial. **Wrong.** (Matches).
      *   (5) Shoplifter: Record is truth-conducive (honesty). *However*, terminating inquiry (no CCTV) violates Continuing Inquiry. **Wrong (Procedural).** (Explains the 'torn' feeling: the doubt is okay, the action is not).
      *   (6) Stammer: Fluency is not truth-conducive regarding flood models. **Wrong.** (Matches).
      *   (7) Fabulist Uncle: Specific track record is truth-conducive. **No Wrong.** (Matches).

  7.  **Addressing the User's Hunch:**
      *   The user thought it was Group vs. Individual.
      *   Correction: It is Prejudice/Irrelevance vs. Evidence, plus Procedural Duty.
      *   Case 6 shows an individual condition (stammer) being used wrongly.
      *   Case 5 shows an individual record being used rightly for doubt, but wrongly for action.

  8.  **Predictions for New Cases:**
      *   *Interpreter:* If doubted *because* she uses an interpreter (implying foreignness = unreliability), that is a Wrong (Prejudice/Irrelevance). If doubted because the translation is demonstrably inconsistent (Evidence), that is Permissible.
      *   *Titled Surgeon:* If believed *too readily* (Credibility Excess) because of title, ignoring errors. This is the flip side (Testimonial Injustice/Excess). It wrongs the *truth*, and potentially others (e.g., a rival without a title). It creates an epistemic imbalance.

  9.  **Refining the Output (British English & Tone):**
      *   Tone: Professional, philosophical, respectful, precise.
      *   Language: British spelling (judgement, programme, centre, etc.).
      *   Structure:
          1.  Introduction (acknowledging the task).
