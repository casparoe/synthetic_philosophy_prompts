          6.  Predictions (Interpreter, Surgeon).
          7.  Honest Accounting (Where the principle might still chafe).

  10. **Self-Correction/Nuance Check:**
      *   *Case 5 Nuance:* Is the user wronged *epistemically* or *legally*? The prompt asks about "wronging a speaker". In social epistemology, bypassing evidence can be an epistemic wrong because it treats the speaker as a mere object of suspicion rather than a rational agent capable of corroboration. I need to frame this carefully. The wrong in (5) is the *refusal to verify*, not necessarily the initial doubt.
      *   *Case 6 Nuance:* Is a stammer a 'social group'? Disabled people are a social group. But the user's hunch excluded 'present condition'. I need to explain why 'present condition' can be a vector for prejudice if the condition is irrelevant to truth.
      *   *Terminology:* Use terms like 'testimonial injustice', 'credibility economy', 'truth-conducive'.

  11. **Final Polish:** Ensure the principle is bold and clearly defined. Ensure the "Honest Accounting" section admits where moral intuition might outstrip epistemic theory (e.g., the emotional cost of disbelief in Case 5 even if the doubt is rational).

  *(Self-Correction during drafting)*: I must ensure I don't just repeat Fricker. The user wants *my* help finding *their* principle. I need to synthesise their intuitions into a coherent framework. The key insight is separating the *assessment of credibility* from the *management of inquiry*.

  *Revised Principle Structure:*
