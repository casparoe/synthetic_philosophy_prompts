answer: |-
  You are not bluffing; you are teaching the central tension of modern bioethics. The discomfort you feel is the friction between the **rhetoric** of medicine (which claims to be objective, biological, and needs-based) and the **economics/policy** of medicine (which is normative, resource-constrained, and value-laden).

  To answer your questions directly: The current arrangement presupposes a **Hybrid Theory disguised as Naturalism**, the distinction is **not coherent** without appealing to external social values, and ditching the theory would require a **fundamental restructuring of healthcare financing and regulation.**

  Here is a breakdown of how to unpack this for your students (and perhaps settle your own mind).

  ### 1. What theory does this arrangement presuppose?

  Officially, the system claims to operate on a **Naturalist** theory of disease, specifically something like Christopher Boorse's **Biostatistical Theory (BST)**.
  *   **The Claim:** Disease is a biological malfunction, a deviation from species-typical functional design. Health is the absence of disease.
  *   **The Function:** This allows insurers and the state to claim objectivity. "We aren't deciding what kind of life is good; we are just fixing broken parts." If the heart pumps below statistical normality, we fix it. If the hands shake within statistical normality, we don't.

  However, the "drifting line" you describe (grief to depression, shyness to social anxiety) reveals that the system is operationally **Normativist**.
  *   **The Reality:** The line is drawn not at biological malfunction, but at **social dysfunction.** Grief becomes depression when it impedes return to work. Shyness becomes anxiety when it impedes economic or social participation.
  *   **The Synthesis:** The system presupposes a **Pragmatic Hybrid**. It uses the *language* of Naturalism (diagnoses, biomarkers, ICD codes) to legitimize decisions that are actually based on **Normative judgments about productivity and resource allocation.**

  It is committed to the idea that disease is biological malfunction *only insofar as that malfunction creates a burden the collective has agreed to bear.* When the biological malfunction doesn't cost the system money (e.g., a healthy musician with shaky hands), it isn't a disease. When a normal biological variation *does* cost the system money (e.g., an employee on grief leave), it tends to become a disease.

  ### 2. Can the treatment/enhancement distinction be made coherent?

  On a pure Naturalist view? **No.**
  Biological function is a continuum, not a binary. There is no bright line where "normal vision" ends and "enhanced vision" begins. Is 20/15 treatment for someone trending toward 20/20, or enhancement?

  On a Normativist view? **Only if you admit the values.**
  The most robust defense of the distinction comes from **Norman Daniels** and the principle of **Fair Equality of Opportunity (FEO)**.
  *   **The Argument:** Medicine's job is to protect the "normal opportunity range" for a person in their society. Treatment restores you to that range; enhancement pushes you beyond it.
  *   **The Hole in the Theory:** As your orchestra example shows, FEO is porous. For the musician, steady hands *are* part of their normal opportunity range. For the student, stimulants might be the only way to access *their* normal opportunity range in a hyper-competitive academic environment.

  If you admit that "opportunity" is socially constructed, the distinction collapses. The treatment/enhancement distinction is not a metaphysical fact about the drug or the body; it is a **fiscal boundary marker.** It is coherent only as a policy tool, not as a philosophical category. It answers the question "Who pays?" not "What is healing?"

  ### 3. What changes if we ditch the theory?

  If we stop asking "Is this a disease?" and start asking "Does this intervention help the patient achieve their goals?" (a consequentialist or consumer-sovereignty model), the organization of medicine changes radically.

  **A. The End of Insurance as We Know It**
  Insurance relies on risk pooling for *unforeseen, necessary* events. If medicine is about "helping," then cognitive enhancement for a student is as valid as beta-blockers for a heart patient.
  *   **Consequence:** You cannot insure for everything. If you expand the mandate to include enhancement, costs skyrocket.
  *   **Restructuring:** You either move to a **single-payer system with strict rationing** (the state decides what "helps" enough to fund) or a **cash-based consumer market** (enhancement is out-of-pocket). The current hybrid (private insurance pretending to cover only "need") becomes untenable.

  **B. The Doctor as Consultant, Not Gatekeeper**
  Currently, the doctor is a priest of the "disease" category. They hold the keys to the pharmacy based on their ability to diagnose a deviation.
  *   **Consequence:** If diagnosis is irrelevant to intervention, the doctor's authority shifts from *diagnostician* to *risk manager*.
  *   **Restructuring:** Medical education would shift from pathology to pharmacology and risk assessment. The ethical duty shifts from "do no harm/fix disease" to "informed facilitation." This looks less like traditional Hippocratic medicine and more like **concierge medicine or cosmetic surgery.**

  **C. Regulatory Shift (FDA/EMA)**
  Regulatory bodies approve drugs for *indications* (diseases).
  *   **Consequence:** If we ditch disease, we must regulate for *outcomes* and *safety* regardless of baseline status.
  *   **Restructuring:** We would need a regulatory framework that approves Modafinil for "wakefulness" rather than "narcolepsy." This requires a massive expansion of safety testing (testing on healthy people), which is currently ethically fraught.

  **D. The Equity Problem**
  This is the biggest philosophical hurdle.
  *   **Current System:** Inequitable, but claims to prioritize the sick.
  *   **"Help the Patient" System:** If enhancement is medicine, and medicine is market-driven, the wealthy become biologically advantaged.
  *   **Restructuring:** To avoid a biological caste system, the state would have to subsidize enhancement for the poor just as it currently subsidizes insulin. If you don't, you cement socioeconomic status into biology.

  ### How to teach this without bluffing

  You feel like you're bluffing because you are trying to present a stable distinction where there is only a **negotiated truce.**

  Instead of teaching the treatment/enhancement distinction as a *discovery* (something we find in nature), teach it as a *political technology* (something we invented to manage scarcity).

  1.  **Show the Machinery:** Walk through the CPT codes and ICD-10 requirements. Show how a diagnosis is literally a billing key.
  2.  **Highlight the Drift:** Use the DSM expansions. Show how the "line" moves when pharmaceutical companies lobby or when workforce participation demands change.
  3.  **The "So What?":** Ask the students: "If we admit this is about values, who gets to set them?"
      *   If doctors set them, it's paternalism.
      *   If insurers set them, it's actuarial tyranny.
      *   If patients set them, it's a market that favors the rich.

  The "bluff" is the system's way of avoiding that political choice. It pretends the line is biological so it doesn't have to admit it's economic. Your job isn't to defend the line; it's to show the students where the paint is peeling.
