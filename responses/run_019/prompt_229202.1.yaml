      *   *The Incident:* Mr. P consulted a notebook during a closed-book exam in Cognitive Science 404.
      *   *The Reasoning (The Core):* This needs to sound like legalistic interpretation of Clark & Chalmers.
          *   Criterion 1: Constant Availability. The notebook is always with him.
          *   Criterion 2: Easy Accessibility. He doesn't fumble; it's fluent.
