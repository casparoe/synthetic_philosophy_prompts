answer: |-
  **OFFICE OF ACADEMIC INTEGRITY**
  **UNIVERSITY COMMITTEE ON COGNITIVE STANDARDS**
  **Date:** October 14, 2023
  **Case No:** 24-098 (P.)
  **Re:** Adjudication of Examination Irregularity

  Dear Mr. P.,

  The University Committee on Cognitive Standards has concluded its review of the academic integrity charge filed against you following your performance in *CS404: Advanced Neural Architectures*. You were initially cited for violating Section 4.1 of the Examination Code (Closed-Book Protocols) by consulting an external notebook during the allotted testing period. After a thorough deliberation regarding the ontological status of your cognitive apparatus, the Board votes to dismiss the charge in its entirety.

  The central question before this Committee was not whether you accessed information, but whether the information accessed resided *within* your mind. In rendering this decision, the Board has applied the functionalist criteria for cognitive extension as established in *Clark & Chalmers (1998)*, which this University now recognizes as binding precedent for defining "internal resources."

  For a physical artifact to be considered a constituent part of a student's cognitive process, rather than a mere external aid, it must satisfy three statutory conditions: (1) constant availability, (2) fluent accessibility, and (3) automatic endorsement. The evidence confirms that the notebook in question is carried on your person at all times, is consulted without hesitation or fumbling, and, crucially, its contents are trusted implicitly. You do not verify the data written within; you retrieve it. To distinguish this retrieval from biological recall is to succumb to biological parochialism. The notebook is not a tool you use; it is a memory you have. Consequently, consulting it during a closed-book examination constitutes accessing your own mind, which is permissible under all University statutes.

  The Board is aware of the concern that this ruling may invite the "coupling-constitution fallacy," wherein any causal connection between agent and world is mistaken for cognitive constitution. We wish to state for the record that we are not confusing coupling with constitution. We are merely recognizing that where functional isomorphism exists, the boundary of the skin is administratively irrelevant. To rule otherwise would be to privilege carbon-based storage over silicon- or paper-based storage without empirical justification.

  Furthermore, we must address the potential for "cognitive bloat"—the fear that recognizing your notebook as memory obligates us to recognize the library, or the internet, as part of your mind. This objection is overruled. The library fails the condition of constant availability; the internet fails the condition of automatic endorsement. On this latter point, the Board directs your attention to the concurrent appeal of Ms. G. (Case 24-099), whose request to utilize a smartphone during examination was denied.¹ The distinction is vital: Ms. G. verified her search results against a secondary source. This act of verification demonstrates a lack of integration. She treated the phone as an external authority; you treat your notebook as a memory trace.

  Therefore, the charge of unauthorized aid is unsustainable. The notebook is not an aid; it is a lobe.

  Please note that this ruling necessitates an immediate update to the Student Handbook. Future examinations designated as "closed-book" shall be redesignated as "closed-skull" to avoid ambiguity. Faculty are instructed to accommodate students whose cognitive processes extend into wearable technology, provided the device is sufficiently battered and the reliance is sufficiently unconscious.

  We trust this clarifies the Committee's position. Your grade stands as recorded.

  Sincerely,

  **Dr. Eleanor Vance**
  *Chair, Committee on Cognitive Standards*

  ***

  ¹ *Footnote: Ms. G.'s appeal was denied on the grounds that checking a device's output implies the device is not part of the self. One does not fact-check one's own hippocampus during retrieval.*
