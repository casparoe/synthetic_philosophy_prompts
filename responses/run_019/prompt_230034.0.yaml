      *   *What fits:* The tension between time-rock vs. time. The problem of diachroneity (Renaissance starts in Italy before England). The problem of marker fidelity (is the Fall of Constantinople a good global marker?).
      *   *What distorts:* Geology deals with physical traces; history deals with meaning/intent. A "marker bed" in geology is physical; a "marker event" in history is interpretive (e.g., publication of a book).
      *   *What's missing:* Human agency. Geology doesn't have actors who *think* they are in a period. Reflexivity.

  6.  **Analytical Read:**
      *   The "Middle Ages" is likely a *Grade* (constructionist) masquerading as a *Clade* (realist).
      *   The "Scientific Revolution" is more like an *Unconformity* (a break in depositional style) or a *Radiation Event*.
      *   The biggest gap: *Diachroneity* is accepted in geology (facies migrate), but historians often fight over the *date* as if it must be synchronous.
      *   Reflexivity: Rocks don't know they are Devonian. Humans know they are "Modern."

