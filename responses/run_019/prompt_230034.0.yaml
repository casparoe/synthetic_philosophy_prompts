      *   **Positions to Cover:** Realist (objective boundaries), Constructionist (retrospective inventions), Intermediate (fuzzy/non-arbitrary patterns).
      *   **Vocabulary to Use:** Type sections, boundary stratotypes, marker beds, unconformities, index fossils, chronostratigraphic vs. geochronologic, lumpers vs. splitters, formations vs. time units, clades vs. grades.
      *   **Deliverables:**
          1.  Systematic translation of the three positions.
