  2.  **Deconstruct the Philosophical Positions:**
      *   *Realism:* Periods exist "out there" in the past. Historians find them. Boundaries are sharp events.
      *   *Constructionism:* Periods are tools created by later historians. Boundaries are imposed. Often serve ideological narratives (e.g., "Dark Ages" to highlight Renaissance brightness).
      *   *Intermediate (Pragmatist/Ideal Type):* Periods aren't strictly "real" like atoms, but they track real structural changes. They are heuristic devices that latch onto genuine shifts, even if boundaries are fuzzy.

  3.  **Map to Geological Concepts:**
      *   *Realism:* Global Boundary Stratotype Section and Point (GSSP). "Golden Spikes." Time is objective. Boundaries are isochronous.
      *   *Constructionism:* Diachronous units. Facies changes misinterpreted as time lines. Map units defined by the mapper's convenience, not lithology. "Groupings" based on later utility rather than deposition.
      *   *Intermediate:* Biozones (fuzzy boundaries). Lithostratigraphic formations (real rock, arbitrary boundaries). Evolutionary grades (real similarity, not necessarily clade).

  4.  **Drafting the Translation (Iterative Process):**

      *   *Realist:* Needs to sound like Chronostratigraphy. The "Middle Ages" is a System/Series. The fall of Rome is a GSSP.
      *   *Constructionist:* Needs to sound like Lithostratigraphy or even older, obsolete classifications. It's about the *mapper*, not the *rock*. It's like defining a formation based on how it looks on a specific map sheet rather than its physical properties. Or perhaps "Telemagmatic" units (units defined by later interpretation). Let's stick to Lithostratigraphy vs. Chronostratigraphy distinction. Constructionists say historical periods are Lithostratigraphic (local, facies-dependent) masquerading as Chronostratigraphic (global time).
      *   *Intermediate:* Biostratigraphy. Index fossils (key events) define the zone, but the boundaries are transition zones. Or "Assemblage Zones."

      *   *Evolutionary Analogy:*
          *   Realist = Clade (Monophyletic). Real lineage.
          *   Constructionist = Grade (Paraphyletic/Polyphyletic). Grouped by similarity/utility, not ancestry. "Reptilia" vs "Mammalia" distinction based on jaw bones vs. lineage.
          *   Intermediate = Ecological Guild or Morphospace cluster.

