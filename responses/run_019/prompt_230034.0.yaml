      *   *Assemblage Zone* is good for the "Intermediate."

  8.  **Addressing Confidence & Uncertainty:**
      *   High confidence on the Stratigraphic analogies (GSSP, Diachroneity).
      *   Lower confidence on the Evolutionary Taxonomy analogies (Clade/Grade) because biological species concepts are themselves debated, adding a layer of uncertainty to the analogy.

  9.  **Final Review against Constraints:**
