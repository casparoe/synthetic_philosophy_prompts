  "But weighing them implies a common currency. Reducing a starved child to the same metric as a gassed one feels less like triage and more like desecration."

  "Yet we happily distinguish murder from genocide in law without offence. Why does historical scale become obscene when legal scale is routine?"

  "Because law seeks liability, not moral equivalence. When you rank suffering for the public, you're not prosecuting criminals, you're asking victims to compete for grief."

  "But silence isn't neutral. By refusing to compare the Holodomor to the Holocaust, you're implicitly saying one is too sacred to touch, which is a hierarchy in itself."

  "It's not hierarchy, it's context. Protecting specific tragedies from being diminished by proximity isn't ignoring suffering, it's respecting its unique shape."

  "Perhaps the issue isn't the comparison itself, but who wields it. A historian analysing patterns isn't the same as a politician minimising guilt."

  "True, but states rarely compare atrocities for truth. It's usually to justify their own foreign policy or dilute their ancestors' sins, so the tool is poisoned."

  "Then we teach the difference. If we declare some evils incomparable, we risk missing the structural patterns that allow them to repeat."

  "Or we acknowledge that some suffering breaks the scale entirely. Recognising the unmeasurable is the only way to honour the dead properly."
