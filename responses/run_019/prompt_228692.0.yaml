          *   *Weakness:* Sounds dismissive of physics practice.

      *   *Objection 6 (Initial Conditions):* "Contingency of initial conditions isn't ideality."
          *   *Phrasing:* "Boundary conditions," "Humean best system."
          *   *Reply:* If the *structure* of reality depends on accidents, it's not fundamental.
