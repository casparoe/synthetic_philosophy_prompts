  **1. Setting up the cases**

  1. Let's pin down pain asymbolia. These patients report the sensory quality of pain remains intact—they can locate it and grade its intensity—but the suffering component vanishes. They don't wince or withdraw. On your view, is the phenomenal character of their experience identical to a normal subject's, minus only the reaction?
  *Follow-up: If the experience is identical, why do they behave as if nothing is wrong? Is the badness behaviorally inert, or does it simply fail to trigger motor outputs?*

  2. Consider morphine analgesia, where patients often say, "It still hurts, but I don't care." Is this phenomenologically distinct from asymbolia, or just a chemical induction of the same dissociation between sensation and aversion?
  *Follow-up: If it's the same state, does the drug remove the badness itself, or just our access to it? Does the badness persist unseen?*

  3. In both cases, you maintain the pain is still bad for them despite their indifference. Exactly what property of the experience constitutes that badness if the motivational push is absent?
  *Follow-up: So you're claiming the badness exists objectively within the phenomenology, regardless of the subject's conative stance? Is it a non-natural property?*

  **2. The squeeze**

  4. In normal experience, painful phenomenology and aversion are perfectly correlated. What non-question-begging evidence do you have that the badness isn't just the aversion wearing a sensory mask? How do you isolate the value from the desire?
  *Follow-up: If you say introspection reveals it, isn't that just conflating the feeling with the dislike? How do you distinguish them phenomenologically without begging the question?*

  5. Are asymbolia patients making a prudential error by not avoiding the damage causing the pain? If their welfare is negatively impacted, they should be avoiding it.
  *Follow-up: If yes, they are irrational. What norm are they violating if nothing feels wrong to them from the inside? Is it an external standard?*

  6. If they are erring, what are they failing to respond to? Is it a value property floating free of their conative state?
  *Follow-up: How does a property motivate rational action if it doesn't engage the will? It seems like a norm without a grip on the agent.*

  7. Imagine a subject stuck in eternal agony who sincerely reports, "This is intense but perfectly fine." On your view, is their life still going badly?
  *Follow-up: That seems to sever welfare from the subject's perspective entirely. Are you comfortable saying they are worse off despite their own testimony to the contrary?*

  8. Do you bite that bullet, or is there a limiting case where indifference actually extinguishes the badness?
  *Follow-up: If there's a limit, isn't that just conceding that aversion plays a constitutive role? Where do you draw the line between feeling and caring?*

  **3. What would change your mind**

  9. What would a counter-example look like? What case would force you to abandon phenomenalism?
  *Follow-up: If no empirical case counts, are we just debating definitions? Is phenomenalism unfalsifiable?*

  10. Is this debate resolvable via neuroscience, or are we digging in on conflicting intuitions about the concept of 'bad'?
  *Follow-up: If it's intuitions, why privilege yours over the desire theorist's? Who has the better conceptual map of welfare?*
