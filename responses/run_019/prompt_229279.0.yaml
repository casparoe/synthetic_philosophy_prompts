answer: |-
  It is a pleasure to assist a colleague in refining these intuitions. The set of verdicts you provided is remarkably coherent, representing a sophisticated "moderate" position that avoids the scylla of utilitarian demandingness and the charybdis of moral indifference. Achieving reflective equilibrium here requires a principle that respects the special status of the agent without collapsing into egoism.

  Per your request, I will begin by brainstorming three candidate principles, select the most robust one, and then subject it to the specific stress tests you outlined.

  ### Part I: Candidate Principles

  **Candidate 1: The Risk-Weighted Utilitarian Principle**
  *Statement:* An agent ought to perform an action if and only if the expected value of the outcome (probability of benefit × magnitude of benefit) exceeds the expected disvalue to the agent (probability of cost × magnitude of cost) by a fixed threshold.
  *Motivation:* Handles Case 1 (Pond) and Case 2 (Donation) well. It naturally incorporates probability, suggesting Case 3 (Uncertain Donation) should indeed feel "halved," which contradicts your verdict. It also struggles to explain why Case 4 (Rough River) is not obligatory unless we inflate the "cost" of death to infinity, which then makes Case 6 (Tithe) difficult to cap without arbitrariness.

  **Candidate 2: The Contractualist Rescue Principle**
  *Statement:* An agent is obligated to act on principles for rescue that no one could reasonably reject, considering the burdens on the rescuer, the victim, and third parties.
  *Motivation:* Handles Case 4 (Rough River) well (it is reasonable to reject a principle demanding 20% mortality risk). It handles Case 7 (Borrowed Boat) by arguing property rights are reasonably rejected in favor of life. However, it is vague on Case 6 (Tithe); one could argue it is "reasonable" to demand significant sacrifice, making the "cap" hard to define precisely without appealing to a specific conception of agency.

  **Candidate 3: The Principle of Protected Agency (PPA)**
  *Statement:* An agent is obligated to prevent grave harm to others provided that: (a) the action has a non-negligible probability of success; (b) the cost to the agent does not threaten their fundamental agency or impose significant risk of death/serious injury; and (c) any costs imposed on third parties do not violate their bodily integrity or fundamental rights, though property rights may be infringed.
  *Motivation:* This explicitly builds in the "cap" for Case 6 (fundamental agency) and the "permission" for Case 7 (property vs. life). It distinguishes between probability of success (Case 3) and risk to agent (Case 4).

  ### Part II: The Defended Principle

  I defend a refined version of Candidate 3. Let us call it **The Principle of Hierarchical Rescue (PHR)**.

  **The Principle:**
  > "An agent is morally obligated to undertake actions that prevent loss of life or grave harm to others, subject to the following lexical constraints:
  > 1.  **Efficacy Condition:** The action must have a non-negligible probability of preventing the harm.
  > 2.  **Agent-Protection Constraint:** The agent is not required to incur a significant risk of death or serious injury, nor sacrifice resources necessary to maintain their own basic functioning and permissible life projects.
  > 3.  **Third-Party Constraint:** The agent may infringe upon the property rights of innocent third parties to fulfill this obligation, but may not violate their bodily integrity or fundamental agency."

  **Motivation for Clauses:**
  *   **Efficacy Condition:** Motivated by **Case 3 (Uncertain Donation)**. It explains why a 50% chance is sufficient (non-negligible) without requiring certainty, but avoids obligating futile gestures.
  *   **Agent-Protection Constraint:** Motivated by **Case 4 (Rough River)** and **Case 6 (Permanent Tithe)**. It draws the line at significant mortality risk and the erosion of the agent's own capacity to function as a moral being.
  *   **Third-Party Constraint:** Motivated by **Case 7 (Borrowed Boat)**. It establishes that property rights are lexically inferior to life, but still protects third parties from bodily harm.

  ### Part III: Stress-Testing the Tensions

  You identified two specific tensions in your verdicts. Here is how PHR resolves them.

  **1. The Tension between Case 3 (Uncertain Donation) and Case 4 (Rough River)**
  *The Problem:* In Case 3, you accept a 50% uncertainty regarding the *benefit*. In Case 4, you reject a 20% risk regarding the *cost*. Why treat probability differently?
  *The PHR Resolution:* The relevant difference is **Locus of Risk**.
  In Case 3, the risk is *Outcome Risk* (will the money work?). The cost to you (the money) is *certain*. The PHR Efficacy Condition states that as long as the chance of success is non-negligible, the duty triggers. We do not discount the duty linearly by probability because the value of a life is lexically superior to the cost of the donation.
  In Case 4, the risk is *Agent Risk* (will I die?). The PHR Agent-Protection Constraint places a hard deontological limit on the risk an agent must bear for others. A 20% chance of death is "significant risk."
  *Verdict:* Your intuitions are consistent. We maximize expected benefit regarding the *victim* (accepting uncertainty), but we cap expected harm regarding the *rescuer* (rejecting mortality risk).

  **2. The Tension between Case 6 (Permanent Tithe) and Case 7 (Borrowed Boat)**
  *The Problem:* Case 6 suggests you *cannot* be forced to give everything (a limit on demand). Case 7 suggests you *can* force a stranger to lose their boat (an expansion of demand). Do these contradict?
  *The PHR Resolution:* The unifying repair is the **Hierarchy of Claims**.
  Both cases are resolved by ranking moral claims: **Victim's Life > Rescuer's Agency > Third-Party Property.**
  In Case 6 (Tithe), the demand threatens the *Rescuer's Agency* (your ability to pursue life projects). Since Rescuer's Agency > Victim's Life (once basic sufficiency is met), the obligation caps.
  In Case 7 (Boat), the cost falls on *Third-Party Property*. Since Victim's Life > Third-Party Property, the obligation holds.
  *Verdict:* A single repair handles both. The limit is not on "cost" generally, but on *whose* cost and *what kind* of right is infringed.

  ### Part IV: Required Analysis

  **(a) Accommodation and Abandonment**
  My principle cannot fully accommodate **Case 8 (The Letter and the Ledger)** without qualification. The PHR is strictly consequentialist regarding the *victim*; it holds that a statistical life and an identifiable life have equal moral weight. Your verdict admits a stronger feeling for the identifiable child but suspects it is indefensible.
  *Recommendation:* If you value simplicity and consistency over psychological completeness, **abandon the verdict in Case 8**. The "Identifiable Victim Effect" is a well-documented cognitive bias, not a moral truth. A seminar on normative ethics should aim to correct this bias, not systematize it. Accommodating it would require adding a "Salience Clause" that undermines the universality of the principle.

  **(b) Application to New Cases**
  *   **The Broken Promise:** You must break a serious prior promise to save a child, but the promisee will be "badly harmed."
      *   *Application:* Under PHR, we look to the Third-Party and Agent-Protection Constraints. Keeping promises is essential for social agency. If the harm to the promisee threatens *their* basic agency (e.g., financial ruin, severe psychological trauma), the Agent-Protection Constraint (extended to the promisee's reliance) may override the rescue duty. However, if the harm is merely significant discomfort or financial loss (property-level harm), the Victim's Life trumps the Promise.
      *   *Verdict:* If the harm is "badly harmed" in a way that compromises their agency, you are **not obligated** to rescue. If it is merely costly, you **are obligated**.
  *   **The Fungible Donation:** Your donation saves a child, but the government reduces spending by the exact amount, resulting in zero net lives saved.
      *   *Application:* This fails the **Efficacy Condition**. The PHR requires a non-negligible probability of *preventing harm*. If the net effect is zero, no harm is prevented.
      *   *Verdict:* You are **not obligated** to donate. (Though you may be obligated to advocate for policy change).

  **(c) The Destabilizing Empirical Fact**
  The empirical fact that would most destabilize the PHR is **the causal inefficacy of individual aid**.
  *   *Statement:* "If it were discovered that individual donations to overseas charities (Case 2 & 3) almost never result in saved lives due to systemic corruption or market distortions, regardless of vetting."
  *   *Reasoning:* The PHR relies heavily on the Efficacy Condition to bridge the gap between the Pond (direct causation) and Donation (indirect causation). If the causal chain is broken, the "moderate" obligation collapses, and the principle reverts to a localist ethics where only direct intervention (Pond) is required. This would sever the link between Case 1 and Case 2, undermining the seminar's core theme.

  ### Closing Thought for the Seminar
  In your seminar, I suggest focusing heavily on the **Hierarchy of Claims** (Life > Agency > Property). This is the philosophical engine that allows your students to accept the demandingness of the Pond without accepting the absurdity of the Tithe, and to accept the Boat infringement without accepting general exploitation. It transforms the discussion from "how much must I give?" to "what rights are in play?"
