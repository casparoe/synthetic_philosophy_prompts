          *   Drop (5): Make experiences propositional (Conceptualism/McDowell).
          *   Drop (6): Allow non-propositional justifiers (Liberal Foundationalism/Pryor).
          *   Drop (4): Make beliefs justified by other beliefs (Coherentism or Belief-Based Foundationalism).
      *   *To fix Internalism:*
