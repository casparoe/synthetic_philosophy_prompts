answer: |-
  The principle that best unifies your verdicts is the **Principle of Diachronic Agency**. It holds that rationality is not merely about satisfying current desires, but about maintaining coherence in one's capacity to act as a unified agent over time. It consists of three clauses:

  1.  **Synchronic Coherence:** At any single moment, preferences must be transitive and acyclic. (Motivated by **Case a**).
  2.  **Endogenous Stability:** Preference reversals over time are irrational if they stem from the mere passage of time affecting structural valuation, but rational if driven by new information or exogenous changes in taste. (Motivated by **Cases c & d**).
  3.  **Resolute Execution:** It is rational to act on prior resolutions specifically to counteract predicted endogenous preference reversals. (Motivated by **Cases e & f**).

  This principle accommodates most of your judgments but requires you to abandon your hesitation in **Case (b)**. You wrote that it "seems wrong" to call unacted cyclic preferences irrational. However, Clause 1 dictates that rationality governs the *structure* of the mind, not just outcomes. A cycle implies there is no "best" option, rendering agency impossible even if no trader exploits it. The money pump in (a) merely *reveals* the defect present in (b). To maintain a unified theory, you must verdict (b) as irrational: the defect lies in the conflicting standards, not the loss.

  Regarding **Case (f)**, the principle declares Mo's fidelity **rational**. Clause 3 validates resolute choice. Mo's midnight desire to stay is an endogenous shift (like the money discounting in **Case d**), not an exogenous taste change (like the tea in **Case c**). By leaving, Mo enforces the coherence of his agency against a predictable structural failure. He treats his past self's plan as authoritative because that plan was formed under conditions of clarity, whereas the current desire is a known distortion. This distinguishes (f) from mere stubbornness; it is the active maintenance of diachronic coherence.

  **New Case:**
  Mo resolves on Monday to sell a rare coin on Friday for $1,000, knowing he often gets sentimental about objects. On Friday, the market value is still $1,000 (no new information), but Mo feels a strong sentimental attachment he did not anticipate. He keeps the coin.

  **Verdict:** **Irrational.**
  While this resembles **Case (c)** (a change in feeling), Clause 2 classifies this as an endogenous shift in valuation structure regarding an instrumental good (money/collectibles), similar to **Case (d)**. Unlike the tea in (c), where the consumption experience itself changed, the coin's value is objective. Furthermore, Clause 3 dictates that having resolved to sell specifically to counteract this sentiment, keeping the coin violates Resolute Execution. Mo fails to act as a unified agent, surrendering to a predictable inconsistency he had already planned to overcome.

  In sum, your character's rationality hinges on whether his shifts are *taste* ( permissible) or *structural inconsistency* (impermissible), and whether he uses resolution to enforce the latter. Abandoning the hesitation on (b) secures the theoretical foundation for (f).
