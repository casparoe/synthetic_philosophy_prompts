      2.  **Local Consistency:** Any subset of accepted claims used to generate a single plan must be logically consistent. (Motivation: Planning on contradictions is useless).
      3.  **Conjunction Utility:** If $A$ and $B$ are accepted for a plan, $A \land B$ must be usable in that plan. (Motivation: Plans often require joint conditions).
      4.  **Fallibility Accommodation:** The system must represent the high likelihood of *some* error in large sets without rejecting all specific claims. (Motivation: Preface).
