      *   *Req 3: Closure under Conjunction (Limited).* If I accept $A$ and $B$, can I plan based on $A \land B$? (Motivation: Planning usually requires joint conditions).
      *   *Req 4: Fallibility Acknowledgement.* The system must represent the possibility of error without collapsing acceptance. (Motivation: Preface paradox).
      *   *Req 5: Actionability.* Acceptance must license action/plan generation. (Motivation: Why have a belief layer?).
