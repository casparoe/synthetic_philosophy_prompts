      3.  **Aggregation Safety:** Conjoining accepted claims must not yield falsehoods used in planning. (Lottery).
      4.  **Error Transparency:** The system must represent global fallibility even while accepting specific claims. (Preface).
      5.  **Decision Stability:** Acceptance shouldn't vary based on irrelevant syntactic ordering. (Lottery ticket ordering).

      *Let's align with the "Engineering Spec" vibe:*
      1.  **Evidence Thresholding:** Claims must exceed a confidence floor to be accepted.
      2.  **Planning Consistency:** The set of claims used for a single plan must be logically consistent.
