prompt: |-
  Last night I argued with a friend about whether individual decisions ever really change the large-scale course of history, or whether for-want-of-a-nail narratives are sentimental illusions projected onto processes that were overdetermined all along. Afterwards I rewatched It's a Wonderful Life, and I want a reading of the film through the philosophy of contingency and chaos in history. In the Pottersville sequence, what does the film actually show about the difference between local causal sensitivity and historical contingency at scale—and does it wind up resting George's significance on the special case of a town poised at a tipping point rather than on any general claim about individuals mattering? Address, too, whether the film trades on a confusion between George's epistemic ignorance about the alternate timeline and genuine counterfactual branching, and whether its providential frame (Clarence, the answered prayer) quietly undercuts the contingency it seems to dramatize. Take both the film and the philosophy seriously, and say plainly where the film's picture of history breaks down. Begin with the reading itself, with no preface or commentary, and make the first sentence your overall thesis.
