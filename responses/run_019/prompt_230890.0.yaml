      *   *Refinement:* Make it punchier. *It's a Wonderful Life* masquerades as a testament to chaotic contingency but ultimately retreats into a providential determinism that safeguards George Bailey's significance only by isolating Bedford Falls as a moral exception to the overdetermined flows of history.

