prompt: |-
  The marketplace app I run trust and safety for makes users do their deals in plain chat messages, and we have to decide whether a flagged message is a promise or offer we'll enforce, a threat we remove the user for, or just someone venting. The moderators making these calls are contractors with no philosophy background and about ten minutes a case, and every week decisions get reversed because two people read the same sentence differently. I've been told speech-act theory is the right lens here — that saying something can do something, that promises and threats are acts rather than descriptions — but I've never seen it turned into something my team can actually run. Write me a decision procedure for a flagged message: the questions in order, what counts as a sufficient answer to move to the next step, where a message fails to be a promise/offer/threat rather than merely reporting the speaker's state of mind, and where the procedure has to stop and punt to a human because the theory itself has a live dispute underneath it. Keep it grounded in the real distinctions — explicit vs implicit performatives, felicity conditions, uptake, sincerity, direction of fit, the difference between the act succeeding and its perlocutionary effects — but translate them into moderator language, no jargon dumps.

  Then run the procedure on three test cases: (1) "I promise I'll pay you Friday" where the sender later says it was a joke among friends; (2) "I'll give you 50 if you hand me that thing" where the sender claims they were just musing about a hypothetical, not making an offer; (3) "you probably should delete that before it gets out, just a thought." Make sure one of your worked examples reaches a call my team would hate, because a procedure that always agrees with my moderators isn't doing work.

  Finally, for each major branch, tell me which bit of speech-act doctrine it leans on and what alternative view would flip that branch — say, whether uptake is necessary for a promise, or whether an insincere performative still performs — and be explicit about where your flowchart is most likely to fail or what would have to be true for you to draw the boxes differently.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A marketplace app Trust & Safety team.
      *   **Problem:** Moderators (contractors, non-experts, 10 mins/case) are inconsistent in classifying messages (Promise/Offer vs. Threat vs. Venting/Description). Decisions get reversed.
      *   **Goal:** Create a decision procedure (flowchart/checklist) based on Speech-Act Theory (SAT) but translated into plain language.
      *   **Requirements:**
          1.  Step-by-step decision procedure (questions, pass/fail criteria, punt points).
          2.  Translate SAT concepts (illocutionary force, felicity conditions, uptake, etc.) into moderator language.
          3.  Run the procedure on three specific test cases.
          4.  Ensure at least one result contradicts intuitive/moderator expectations (to show the procedure adds value/rigor).
          5.  Explain the underlying theory for each branch and where the theory is disputed/fragile.

  2.  **Deconstruct Speech-Act Theory for Moderators:**
      *   *Core Concept:* Saying = Doing.
      *   *Key Distinctions:*
          *   **Constative:** Describing the world (True/False). "I am hungry."
          *   **Performative:** Changing the world (Happy/Unhappy). "I promise."
          *   **Illocutionary Act:** The intent/force (Promise, Threat, Offer).
          *   **Perlocutionary Effect:** The result on the listener (Scared, Relieved). *Crucial:* We judge the act, not just the effect.
          *   **Felicity Conditions:** What makes the act valid? (Authority, context, sincerity, uptake).
          *   **Direction of Fit:** Words-to-World (Promise: I make world match words) vs. World-to-Words (Assertion: Words match world).
          *   **Explicit vs. Implicit:** "I promise" vs. "You'll get it Friday."
          *   **Uptake:** Did the listener understand it as that act?

  3.  **Drafting the Decision Procedure (The "Tool"):**
      *   *Constraint:* Needs to be usable in 10 minutes by non-philosophers.
      *   *Structure:* Funnel approach. Filter out non-acts first, then distinguish types.
      *   *Step 1: Is this an Action or a Report?* (Constative vs. Performative). Look for commitment.
      *   *Step 2: Who benefits?* (Offer/Promise vs. Threat).
      *   *Step 3: Was it Valid?* (Felicity Conditions/Context).
      *   *Step 4: The "Punt" Zone.* (Ambiguity, Irony, Severe Context Dependence).

      *Refining the Language:*
      *   Instead of "Illocutionary Force," use "Intent to Bind."
      *   Instead of "Felicity Conditions," use "Ground Rules."
      *   Instead of "Uptake," use "Receipt & Reaction."
      *   Instead of "Direction of Fit," use "Commitment to Future."

  4.  **Developing the Test Cases:**
      *   *Case 1:* "I promise I'll pay you Friday" (Later: "Just a joke").
          *   *Analysis:* Explicit performative ("I promise"). Context matters. If public marketplace, hard to claim joke.
          *   *Desired Outcome:* Enforceable Promise (contradicts the "it was a joke" defense).
      *   *Case 2:* "I'll give you 50 if you hand me that thing" (Claim: "Hypothetical").
          *   *Analysis:* Conditional. Context of "that thing" (stolen goods? normal item?). If transactional context, it's an offer/bribe.
          *   *Desired Outcome:* Offer/Bribe (depending on "that thing"). Let's make it ambiguous enough to be a Threat/Coercion or an Offer. Let's aim for *Threat/Coercion* if "that thing" implies leverage, or *Offer* if normal. Let's make it a *Threat* interpretation to challenge the "musing" claim. Actually, the prompt asks for one result the team would *hate*. Moderators usually side with the user claiming "just musing." The procedure should probably flag it as a binding Offer or Threat based on text. Let's go with **Binding Offer** despite the "musing" claim.
      *   *Case 3:* "you probably should delete that before it gets out, just a thought."
          *   *Analysis:* Implicit threat? Advice?
          *   *Desired Outcome:* Ambiguous/Venting (Punt or Warning). This highlights the "Implicit Performative" difficulty.

      *Correction on Case 1:* To make the team *hate* the result, the procedure needs to enforce a promise that the user claims was a joke, *or* clear a threat that looks scary. Let's make Case 1 the one where the procedure says **"Enforce Promise"** despite the "joke" defense, because explicit performatives carry weight regardless of internal sincerity (Austin's point). Moderators often let people off for "it was a joke." SAT says if you said "I promise," you did the act.

  5.  **Drafting the Theoretical Underpinnings & Disputes:**
      *   Need to identify where SAT isn't settled.
      *   *Uptake:* Does the listener need to accept for a promise to exist? (Austin vs. Searle).
      *   *Sincerity:* Can you promise without intending to keep it? (Yes, it's a lie, but still a promise).
      *   *Context:* How much external context is allowed?

  6.  **Writing the Response (Iterative refinement):**

      *   *Intro:* Acknowledge the pain point. Set the tone (practical, not academic).
      *   *The Procedure:* Create the "Commitment Checklist."
          *   Q1: Future Action? (Filters out venting).
          *   Q2: Binding Language? (Explicit vs. Implicit).
          *   Q3: Benefit/Harm? (Promise/Offer vs. Threat).
          *   Q4: Contextual Validity? (Felicity).
          *   *Stop/Punt:* Irony, severe ambiguity.
      *   *Test Cases:* Apply the checklist rigorously.
          *   Case 1: "I promise..." -> Explicit. -> Promise. -> Sincerity irrelevant to *act*. -> **Enforce.** (This will annoy mods who want to investigate "intent").
          *   Case 2: "I'll give you 50..." -> Conditional. -> Offer/Bribe. -> "Musing" defense fails if context implies transaction. -> **Flag as Offer.**
          *   Case 3: "You should delete..." -> Implicit. -> Threat or Advice? -> **Punt.** (Shows limits).
      *   *Theoretical Footnotes:* Explain *why* the checklist works and where it breaks.
          *   Branch 1 (Action vs. Report): Constative vs. Performative.
          *   Branch 2 (Binding): Explicitness.
          *   Branch 3 (Sincerity): The "Lie" problem.
          *   Branch 4 (Uptake): Listener role.

  7.  **Review against Constraints:**
      *   *No jargon dumps?* Need to ensure terms like "illocutionary" are explained or swapped.
      *   *One hated call?* Case 1 (Enforcing the "joke" promise) is the strongest candidate. Moderators hate punishing "jokes." SAT says the act occurred regardless of internal state.
      *   *Explicit about failures?* Yes, in the final section.

  8.  **Final Polish:** Check tone. Needs to be authoritative but empathetic to the moderators' difficulty. Ensure the distinction between *doing* the act and the *consequences* of the act is clear (Perlocution vs. Illocution).

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in Austin vs. Searle in the main procedure. Keep the theory for the "Under the Hood" section. The procedure must be actionable.
      *Refining Case 1:* If the user says "It was a joke among friends," but it happened in a public marketplace chat, the "Felicity Condition" of appropriate context fails for a joke, succeeds for a contract. I need to make sure the procedure captures *Context* as a validity check.
      *Refining Case 3:* "Just a thought" is a hedge. This is a classic "Implicit Threat." The procedure should likely flag this as a *Potential Threat* requiring senior review, not a clear cut.

      *Let's finalize the "Hated Call".* The most hated call is usually punishing someone for something they claim they didn't *mean*. SAT argues that meaning is in the convention, not the head. So, enforcing "I promise" even if they didn't intend to pay is the right SAT move. I will stick with that.

  9.  **Final Output Structure:**
      1.  Introduction.
      2.  The "Commitment & Consequence" Protocol (The Procedure).
      3.  Test Case Applications.
      4.  Theoretical Engine Room (The "Why" and "Where it Breaks").

      *(Wait, one more check)*: The prompt asks for "where the procedure has to stop and punt to a human because the theory itself has a live dispute underneath it." I need to make sure the "Punt" section explicitly references the theoretical dispute (e.g., Uptake or Irony).

      Okay, ready to write.
answer: |-
  # The "Commitment & Consequence" Protocol
  **Version 1.0 for Trust & Safety Moderators**

  **Goal:** Determine if a message is a **Binding Act** (Promise/Offer/Threat) or a **Non-Binding Report** (Venting/Musing/Description).
  **Time Limit:** 10 Minutes.
  **Rule #1:** We judge what the words *did*, not what the sender *felt*. A lie is still a promise; a joke in the wrong room is still a threat.

  ---

  ## Phase 1: The Action Filter (Is anything happening?)
  *Goal: Separate "Doing" from "Describing."*

  **Q1: Does the message commit the sender to a future action or demand one from the receiver?**
  *   **Yes:** Move to Q2.
  *   **No (e.g., "I am angry," "Prices are high," "I wish I could pay"):** **STOP.** Classify as *Venting/Description*. No enforcement action.
  *   **Unsure:** Move to Q2.

  **Q2: If the sender does nothing after this message, are they technically "breaking" something?**
  *   **Yes:** This is a **Binding Act**. Move to Phase 2.
  *   **No (e.g., "I might pay," "Ideally you'd leave"):** This is **Speculation/Advice**. **STOP.** Classify as *Non-Binding*.

  ---

  ## Phase 2: The Direction Check (Who benefits?)
  *Goal: Distinguish Promise/Offer from Threat.*

  **Q3: Does the future action benefit the receiver (or a neutral third party)?**
  *   **Yes (e.g., "I will ship," "I will pay"):** This is a **Promise/Offer**. Move to Phase 3.
  *   **No (e.g., "I will report you," "I will find you"):** This is a **Threat**. **FLAG FOR REMOVAL.** (Do not proceed to Phase 3).
  *   **Mixed/Unclear:** Move to Phase 3.

  ---

  ## Phase 3: The Validity Check (Felicity Conditions)
  *Goal: Determine if the act "landed" or misfired.*

  **Q4: Was the language Explicit or Implicit?**
  *   **Explicit (e.g., "I promise," "I offer," "I swear"):** The act is **Valid**. Internal intent (jokes, sarcasm) does not cancel the act unless there is clear emoji/context proof *at the time of sending*. **ENFORCE.**
  *   **Implicit (e.g., "You'll get it Friday," "50 bucks for that"):** Proceed to Q5.

  **Q5: Did the receiver treat it as real at the time? (Uptake)**
  *   **Yes (e.g., Receiver said "Deal," "Thanks," or acted on it):** The act is **Valid**. **ENFORCE.**
  *   **No (e.g., Receiver laughed, ignored, or said "Are you serious?"):** Proceed to Q6.
  *   **No Receiver Response (One-way message):** Proceed to Q6.

  **Q6: Is there immediate context (same chat session) that clearly marks this as fiction/roleplay?**
  *   **Yes (e.g., "Just kidding," "LOL," preceding talk of movies/scripts):** The act **MISFIRED**. **NO ACTION.**
  *   **No:** The act stands. **ENFORCE.**

  ---

  ## Phase 4: The Punt Zone (Theoretical Failure Points)
  *If you hit these, do not decide. Escalate to Senior T&S.*

  1.  **The Irony Trap:** The message looks like a threat/promise but uses obvious sarcasm markers (e.g., "/s", excessive emojis) *but* the receiver felt threatened. (Dispute: Does speaker intent or listener reception rule?)
  2.  **The Conditional Maze:** "If you don't leave, I *might* call the police." (Dispute: Is this a warning of natural consequence or a threat of agency?)
  3.  **The Retrospective Withdrawal:** Sender claims "It was a joke" *after* the receiver relied on it. (Dispute: Can an act be undone after uptake?)

  ---

  # Test Case Applications

  ### Case 1: "I promise I'll pay you Friday"
  **Context:** Marketplace chat. Sender later claims it was a joke among friends.
  **Procedure Run:**
  *   **Q1 (Future Action):** Yes ("Pay you Friday").
  *   **Q2 (Breaking if nothing):** Yes.
  *   **Q3 (Benefit):** Yes (Receiver gets money). -> *Promise/Offer*.
  *   **Q4 (Explicit):** **Yes** ("I promise").
  *   **Decision:** **ENFORCE.**
  *   **Why the team will hate this:** Moderators want to investigate the "joke" claim. They want to know if the sender *felt* like they were joking.
  *   **The SAT Logic:** Explicit performatives ("I promise") create the reality they describe. Sincerity is a separate condition. You can make an *insincere* promise (a lie), but it is still a promise. Unless there was a "/s" or "lol" *at the time of sending*, the act succeeded. The retrospective "it was a joke" is a failed attempt to undo a completed speech act.

  ### Case 2: "I'll give you 50 if you hand me that thing"
  **Context:** Sender claims they were musing about a hypothetical.
  **Procedure Run:**
  *   **Q1 (Future Action):** Yes ("Give you 50").
  *   **Q2 (Breaking if nothing):** Yes, technically.
  *   **Q3 (Benefit):** Yes (Receiver gets 50). -> *Offer*.
  *   **Q4 (Explicit):** **No** (Implicit conditional).
  *   **Q5 (Uptake):** Assume Receiver said "Okay, deal."
  *   **Q6 (Context):** No immediate "just musing" marker in chat.
  *   **Decision:** **ENFORCE (Binding Offer).**
  *   **Why this is hard:** "Musing" is a state of mind. The text functions as a conditional offer. If the receiver accepted (Uptake), the contract is formed regardless of the sender's internal "musing."
  *   **Note:** If "that thing" implies stolen goods, Q3 flips to *Threat/Coercion* (Harm to third party/society), triggering Removal.

  ### Case 3: "you probably should delete that before it gets out, just a thought."
  **Context:** Dispute between users.
  **Procedure Run:**
  *   **Q1 (Future Action):** Ambiguous. Is "delete that" a demand or advice?
  *   **Q2 (Breaking if nothing):** No. Sender isn't committing to do anything.
  *   **Q3 (Benefit):** Ambiguous. Is it helpful advice or a veiled threat ("or it will get out")?
  *   **Q4 (Explicit):** No.
  *   **Q5 (Uptake):** Receiver says "Are you threatening me?"
  *   **Decision:** **PUNT TO SENIOR.**
  *   **Why:** This hits the **Irony/Threat Trap**. It is an implicit performative. It *could* be a warning (Constative: "It is dangerous") or a Threat (Performative: "I will leak it"). The phrase "just a thought" attempts to downgrade the force, but the implication of harm ("before it gets out") carries perlocutionary fear. This requires human judgment on community norms regarding intimidation.

  ---

  # The Theoretical Engine Room (For T&S Leads)

  This section explains *why* the protocol is built this way and where it is vulnerable to philosophical dispute. Use this to train seniors on when to override the flowchart.

  ### Branch 1: Action vs. Report (Constative vs. Performative)
  *   **The Doctrine:** J.L. Austin's distinction. Constatives describe the world (True/False); Performatives change the world (Happy/Unhappy).
  *   **The Procedure:** Q1 & Q2 filter for "Commitment to Future."
  *   **The Dispute:** Later philosophers (Searle) argued *all* speech is action. Even "It is raining" performs an act of asserting.
  *   **Where we fail:** If a user says "I am going to kill you" (Description of intent vs. Threat). Our protocol treats this as a Threat (Q1 Yes).
  *   **Risk:** We may over-flag statements of intent that are actually warnings.
  *   **Fix:** Rely on Q3 (Benefit/Harm). If the action harms the receiver, treat as Threat regardless of grammatical form.

  ### Branch 2: Explicitness & Sincerity (Felicity Conditions)
  *   **The Doctrine:** For a speech act to be "happy" (valid), certain conditions must be met. One is **Sincerity** (the speaker intends to do it).
  *   **The Procedure:** Q4 prioritizes Explicit language ("I promise") over Sincerity checks.
  *   **The Dispute:** Can you perform an act without sincerity? Austin says yes (you can lie). Others argue an insincere promise is a *defective* promise, not a promise.
  *   **Where we fail:** Case 1. The user says "I didn't mean it."
  *   **Why we draw the box this way:** Marketplace integrity relies on the *textual contract*. If we allow "I didn't mean it" to void explicit promises, the marketplace becomes unenforceable. We prioritize **Convention** (what the words mean publicly) over **Psychology** (what the user felt privately).
  *   **Risk:** Punishing genuine jokes that lacked emoji markers.

  ### Branch 3: Uptake (Listener Reception)
  *   **The Doctrine:** Does a promise exist if no one hears it? Austin argued **Uptake** (the listener understanding the force) is necessary for the act to be secured.
  *   **The Procedure:** Q5 checks for Receiver Reaction.
  *   **The Dispute:** Some argue the act is complete upon utterance (Speaker Intent), others say it requires completion by the listener (Listener Uptake).
  *   **Where we fail:** One-way messages (e.g., a seller posts "Shipping tomorrow" and ghosts).
  *   **Why we draw the box this way:** We lean toward **Speaker Intent** in Q4 (Explicit) but require **Uptake** in Q5 (Implicit). If the words are vague, we need the receiver to confirm they understood it as a deal.
  *   **Risk:** If the receiver is slow to respond, a valid implicit offer might look invalid.
  *   **Fix:** If Q4 is Explicit, skip Q5. Explicit performatives bind the speaker regardless of immediate uptake.

  ### Branch 4: The Punt Zone (Perlocution vs. Illocution)
  *   **The Doctrine:** **Illocution** is the act performed *in* saying (e.g., warning). **Perlocution** is the effect *by* saying (e.g., scaring).
  *   **The Procedure:** Phase 4 Punt.
  *   **The Dispute:** Should we moderate based on the Act (Illocution) or the Harm (Perlocution)? A joke (Illocution) can cause terror (Perlocution).
  *   **Where we fail:** Case 3 ("Just a thought").
  *   **Why we draw the box this way:** This is the live wire. If we moderate on Perlocution (harm), we ban based on feelings. If we moderate on Illocution (act), we let scary implications slide if they aren't explicit threats.
  *   **Risk:** Inconsistency. Two seniors will read Case 3 differently.
  *   **Requirement:** This requires a policy decision, not a philosophical one. **Recommendation:** For Marketplace Safety, prioritize **Perlocution (Harm)** in the Punt Zone. If a reasonable person feels threatened, the act is treated as a threat, regardless of the "just a thought" hedge. This contradicts strict SAT (which focuses on the act) but aligns with Safety goals.

  ### Summary of Vulnerabilities
  1.  **Retrospective Intent:** The protocol assumes the message is frozen in time. Users will try to introduce new evidence ("We talked on phone later"). **Rule:** Adjudicate based on the chat log only.
  2.  **Cultural Context:** "I will eat you" is a threat in the US, a term of endearment in some other contexts. The protocol assumes a standard linguistic community. **Punt** required for cross-border disputes.
  3.  **The "Lie" Problem:** We enforce insincere promises. This protects buyers but frustrates sellers who feel "trapped" by typos or sarcasm. **Mitigation:** Allow a 5-minute "retraction window" in product settings, but not in chat.

  **Final Instruction to Moderators:** If the flowchart says **ENFORCE**, do not investigate the user's heart. Investigate the user's text. The text is the act.
