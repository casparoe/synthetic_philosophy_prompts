prompt: |-
  I am trying to pin down my credence on a specific claim in the norms-of-assertion debate, and I want you to reason it through in public rather than give me a bare number. The target claim is: assertion is governed by a single constitutive epistemic norm, and that norm is knowledge — that is, a speaker is properly positioned to assert that p only if the speaker knows that p — rather than by a truth norm, a justified-belief norm, a reasonable-belief norm, a certainty norm, or by no constitutive norm at all, with conversational regularities doing all the work. Treat the claim as having a definite truth value on the invariantist reading: the defect in asserting p while lacking knowledge is the defect of violating a rule internal to assertion itself, not merely of being uncooperative, imprudent, or misleading.

  Please give me your overall credence in that claim, but arrive at it through an explicit decomposition into at least the following components, each with a number between 0 and 1 and a sentence or two of justification:

  1. The probability that assertion has any constitutive norm at all, rather than being governed only by broadly conversational expectations and local conventions.
  2. Conditional on there being a constitutive norm, the probability that it is epistemic rather than practical, moral, or purely conventional.
  3. Conditional on its being a constitutive epistemic norm, the probability that it is knowledge specifically rather than truth, justified belief, reasonable belief, or certainty.
  4. Conditional on a knowledge norm, the probability that it applies uniformly to flat-out and hedged assertions — so that "I think p" and "I know p" differ in content or implicature rather than in being governed by distinct, weaker norms.
  5. Any further term carrying independent weight — for example, whether the standard data (lottery assertions, the oddity of "p, but I don't know that p", challenge-and-retraction patterns) are best explained by a knowledge norm rather than by its rivals, or whether ordinary assertion shows enough context-sensitivity to undermine a single invariant norm.

  State explicitly how you combine these numbers — where you multiply, where you weight, and where you correct for overlap — so the arithmetic is visible and someone could recompute your answer. Then identify the single term you are least confident in, and name one concrete kind of evidence (linguistic, experimental-psychological, or formal) that would move that term, and therefore your overall credence, the most. For calibration: I sit near 0.55, a colleague who accepts the knowledge norm is near 0.9, and a friend who thinks assertion is governed only by conversational expectations is near 0.15; I care less about whether you match my number than about seeing where you think the load-bearing disagreement actually lives.

  End your answer with a line of the form \answer{0.XX} containing your overall credence as a decimal between 0 and 1.
