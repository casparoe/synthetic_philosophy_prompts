  # The Arithmetic of Dust

  The numbers did not sit still. That was the first thing Elara noticed, and the last thing she could explain to the Director. On her holoslate, the welfare integrals shimmered like heat haze, refusing to converge. She was a junior welfare actuary for the Continuation Authority, tasked with summing the expected value of humanity's final gesture. But the universe, it seemed, was too large for her ledger.

  She rubbed her eyes. The conference chamber of the Authority was a sterile ring of obsidian glass, suspended above the cloud layer of Titan. Outside, the methane storms bruised the sky. Inside, three people held the fate of the species in hands that looked too ordinary for such weight.

  Director Vance sat at the head of the table, his fingers steepled. To his right was Dr. Hsu, architect of the Loom proposal. To his left, Chairwoman Oram, champion of the Conservatory. Elara sat at the periphery, her datapad the only source of light in the dim room.

  "Report, Actuary," Vance said. His voice was flat, drained of the urgency that had defined the last century of debate.

  "The sums diverge, sir," Elara said. Her voice cracked slightly. "In every model. If we assume the standard cosmological model holds, the background universe contains infinite sentient regions. Therefore, the total utility is already infinite."

  Vance nodded slowly. "Infinitarian paralysis. If the total is already infinite, adding a finite amount of good—say, a billion flourishing lives—is mathematically equivalent to adding nothing. $\infty + n = \infty$."

  "It renders the Authority obsolete," Elara said. "It suggests Decommissioning is the only logically consistent choice. We save resources. We stop pretending our local actions alter the cosmic total."

  "It is not about altering the total," Hsu interrupted, leaning forward. Her eyes were bright with a feverish intensity. "It is about the measure. The Loom programme sends self-replicating probes into the void. Yes, the lives they create are modest. Barely worth living, some critics say. A simple existence, free of pain, modest joy. But they are *many*. An open-ended sequence. If there is even a non-zero probability that the seeding continues forever, the expected value is infinite."

  Elara felt a familiar nausea. This was the fanaticism trap. A minuscule probability of infinite value dominated any certainty of finite value. Hsu was arguing that a one-in-a-billion chance of eternal expansion outweighed the certain suffering of repurposing the Stasis Banks to fuel the probes.

  "And the Conservatory?" Oram asked softly. She was an older woman, her skin mapped with the faint lines of gene therapies decades old. "We sustain a fixed population. Ten million souls. But they live indefinitely. High welfare. Deep art, profound love, no suffering. An infinite duration of excellence."

  "Both are infinite," Elara said, looking down at her pad. The numbers were bleeding into the edges of the screen now, surreal and hyperreal. "Mathematically, an infinity of modest lives and an infinity of flourishing lives are equivalent cardinalities. You cannot compare them using standard utility functions. It is like asking if a blue infinite line is heavier than a red one."

  "Then we change the math," Hsu said sharply. "We use hyperreal valuations. We weight density. We prioritise the spread."

  "We prioritise the quality," Oram countered. "What is the point of existence if not to flourish? To fill the universe with mediocrity simply because it is easier to replicate..."

  "It is not about ease," Hsu snapped. "It is about avoiding the rounding error. If the universe is infinite, we are already dust. The Loom ensures we are dust that spreads."

  Elara stopped listening to the theory. She looked at her father's file on her private channel. Julian Elara-Vance. No relation to the Director, though sometimes she wondered. He was in Cryo-Stasis Block 4, suffering from a neuro-degenerative condition that had no cure in the current epoch.

  The proposals were not just abstract vectors; they were budget allocations.
  The Conservatory required the energy grid to remain static, sustaining the life-support systems of the Stasis Banks. If Oram won, Julian woke. He lived in the garden city, healthy, forever.
  The Loom required the liquidation of the Banks. The biomass and energy stored in the cryo-pods would be converted into fuel for the seeders. If Hsu won, Julian was recycled. He became thrust.
  Decommissioning meant the grid was turned off slowly. The banks would maintain for a century, then fail. Julian would wake, live a short, painful decade, and die.

  Elara realised then what the seniors were doing. They were not solving the ethics. They were shopping for the mathematics that allowed them to sleep.

  Vance wanted Decommissioning because he was tired. He wanted the paralysis to be true so he could put down the burden.
  Hsu wanted the Loom because she believed in expansion, and she used the fanaticism of infinite expected value to justify the sacrifice of the few.
  Oram wanted the Conservatory because she feared death, and she used the comparison problem to argue that quality trumped quantity, ignoring the mathematical equivalence.

  "Actuary," Vance said. "Recommendation."

  The room went silent. The hum of the air recyclers sounded like breathing.

  "My calculations... they dissolve," Elara said. "There is no objective function that solves this without arbitrary truncation. If I truncate the future at one thousand years, the Conservatory wins. If I truncate spatially, the Loom wins. If I accept the background infinity, we all lose."

  "Then choose the truncation that feels least like murder," Vance said.

  Elara looked at Oram. The Chairwoman was staring at her, pleading silently. *Save us. Save yourself.* Elara knew she was on the Conservatory's eligibility list. If the static grid won, she too could live indefinitely. She could watch her father grow old in a world that had time for him.

  But she looked at Hsu, who sat rigid, believing she was saving humanity from irrelevance. And Vance, who wanted the silence.

  "The Loom," Elara said. The word tasted like ash.

  Oram flinched as if struck. "On what grounds?"

  "Fanaticism," Elara said, her voice hollow. "Even if the probability of eternal seeding is $10^{-9}$, the infinite payoff dominates the finite certainty of the Conservatory. It is the only argument that mathematically overrides the paralysis. We must bet on the infinite spread."

  "It is a lie," Oram whispered. "You know the probability is negligible. You are sacrificing the certain good for a phantom."

  "I am following the model," Elara said. She closed her datapad. The numbers stopped shimmering. They were fixed now. Final.

  "Motion carried," Vance said. He did not look relieved. He looked hollowed out. "Prepare the liquidation orders for the Stasis Banks."

  Elara stood up. Her legs felt heavy. She had chosen the math that killed her father. She had chosen the option that treated human lives as fungible fuel for a theoretical infinity. She had chosen the dry terms over the eerie human cost, because the dry terms were the only ones that offered a decision rule.

  "Meeting adjourned," Vance said.

  Oram remained seated, staring at the obsidian table. Hsu was already typing orders into her cuff, efficient, saved by the abstraction.

  Elara walked to the window. The methane storms outside were swirling, chaotic, infinite in their complexity. She placed her hand against the glass. Somewhere below, in Block 4, the power regulators were already shifting frequency. The heat was being diverted to the launch bays.

  She had wanted to save them. Instead, she had solved the equation.

