answer: |-
  # Colloquium Prep Sheet: Strong Longtermism (Trajectory-vs-Content)

  **Thesis Recap:** Strong longtermism holds not because of vast population sums (Totalism), but because we can robustly influence the *probability* of irreversible trajectory changes (extinction/lock-in) without needing to predict the *content* of the future.
  **Strategy:** Concede epistemic limits on "the good," hold firm on the badness of irreversible closure.

  ---

  ## 1. The Philosopher of Science (Deep Uncertainty)
  **Likelihood:** High (First substantive objection)
  **Phrasing:** "You claim we can 'predictably alter' extinction probabilities without understanding the complex causal systems involved. But given 'complex cluelessness,' isn't it equally probable that your intervention creates unforeseen feedback loops that *increase* existential risk? If the system is non-linear, how do you know you aren't making things worse?"

  *   **Damage to Argument:** **Critical.** Your thesis rests on the epistemic claim that trajectory influence is *predictable*. If interventions are epistemically opaque, the "trajectory" lever breaks.
  *   **Concede:** Acknowledge that *most* interventions are subject to complex cluelessness. Do not claim omniscience.
  *   **Hold:** Hold that a subset of interventions are *robustly* positive regardless of complex downstream effects (e.g., basic biosecurity, reducing great power conflict).
  *   **90-Second Reply:**
      "That is the central epistemic challenge, and I concede that for most specific policy interventions, complex cluelessness is a veto. However, my claim is restricted to a specific class of 'robust' interventions. We don't need to model the entire causal chain to know that reducing the probability of an uncontained pandemic lowers extinction risk. This isn't about optimizing the future; it's about removing clear, present threats to the *continuation* of the future. I am not arguing we can navigate the rapids; I am arguing we can stop someone from blowing up the boat. Where the causal chain is opaque, I agree we should pause. But where the mechanism is direct—like preventing a specific class of catastrophic failure—the trajectory claim holds even under deep uncertainty."

  ## 2. The Contractualist
  **Likelihood:** High
  **Phrasing:** "You say you aren't aggregating value across populations, but you are still asking present individuals to bear costs for the sake of statistical, non-existent future people. On what grounds can you demand a sacrifice from an identifiable person today to reduce a risk for someone who may never exist? That looks like consequentialist smuggling to me."

  *   **Damage to Argument:** **High.** Attacks the normative authority of the obligation. If you can't ground the duty to the future, "strong longtermism" becomes merely "optional charity."
  *   **Concede:** Concede that this cannot be grounded in a duty to *specific* future individuals (non-identity problem).
  *   **Hold:** Hold that the duty is to *maintain the conditions of agency* itself, which is a prerequisite for any contractualism.
  *   **90-Second Reply:**
      "I agree that we cannot ground this in a claim owed to specific future individuals; the non-identity problem blocks that. However, contractualism isn't just about claims between existing people; it's about principles no one could reasonably reject. A principle that allows the permanent closure of all future moral agency—extinction or permanent lock-in—is rejectable by anyone who values the possibility of moral progress. I am not asking the present to sacrifice for the *welfare* of the future, but to preserve the *possibility* of a future where contractual claims can even be made. Extinction isn't just a loss of value; it's the end of the forum in which reasons are exchanged. We owe it to the structure of morality itself not to burn down the house."

  ## 3. The Population Ethicist (Totalist)
  **Likelihood:** Medium
  **Phrasing:** "You've stripped out the 'vast numbers' argument that usually does the heavy lifting for strong longtermism. Without that multiplier, does the expected value of trajectory changes actually dominate near-term suffering? If the future isn't astronomically large in value terms, why is this 'strong' longtermism and not just 'important' longtermism?"

  *   **Damage to Argument:** **Medium.** If the math doesn't yield *dominance*, your thesis (that it is the *dominant* determinant) fails.
  *   **Concede:** Concede that without the vastness assumption, the *margin* of dominance is smaller.
  *   **Hold:** Hold that the *irreversibility* creates a sufficient asymmetry to maintain dominance, even with smaller populations.
  *   **90-Second Reply:**
      "That's a fair check on the math. I am conceding the 'astronomical value' premise. However, I argue the 'strong' conclusion survives because of the asymmetry of irreversibility. Near-term suffering is tragic but often remediable; extinction is final. Even if the future population is modest, the *permanent* loss of all future value dominates temporary losses, provided the probability shift is non-negligible. Think of it as an option value argument. Keeping the option open has a value that exceeds the cost of maintaining it, even if we don't know how valuable the option will be. So, it remains 'strong' not because the future is infinite, but because the alternative is permanently zero."

  ## 4. The Political Philosopher
  **Likelihood:** Medium-High (Likely later in the session)
  **Phrasing:** "Historically, appeals to the 'long run' have functioned to rationalize neglecting urgent, identifiable suffering today. By framing trajectory risks as the 'dominant determinant,' aren't you providing a philosophical cover for deprioritizing global poverty or structural injustice right now?"

  *   **Damage to Argument:** **Medium.** Doesn't refute the logic, but undermines the practical legitimacy and invites coalition-building failure.
  *   **Concede:** Concede that this framework *has* been misused in that way and is vulnerable to it.
  *   **Hold:** Hold that trajectory safety and present justice are often complementary, not zero-sum.
  *   **90-Second Reply:**
      "I take that worry seriously, and I concede that longtermist rhetoric has often been weaponized to ignore present suffering. That is a moral failure of application, not necessarily of the theory, but the theory must be robust against it. My 'avoidance of loss' framework actually mitigates this. Preventing catastrophic lock-in often requires strengthening democratic institutions and reducing inequality now, as fragility drives existential risk. We shouldn't view this as a trade-off between 'now' and 'later.' If we sacrifice the vulnerable today, we increase the likelihood of bad lock-in tomorrow. The trajectory strategy demands we fix the steering mechanism now, which includes addressing present injustice."

  ## 5. Graduate Students (Broad/Clarification)
  **Likelihood:** High (Volume of questions)
  **Phrasing:** "Can you give a concrete example of a 'lock-in' event that isn't just extinction? And does your view imply we should halt AI development?"

  *   **Damage to Argument:** **Low.** Clarification opportunities.
  *   **Concede:** N/A.
  *   **Hold:** Clarify the definition of lock-in (technological or institutional monoculture).
  *   **90-Second Reply:**
      "Two quick points. First, lock-in needn't be extinction. It could be a global surveillance regime that makes moral reform impossible for centuries. That's a trajectory change without ending humanity. Second, regarding AI: my view doesn't imply halting development per se, but it does imply that deployment is impermissible until the 'trajectory risk' is managed. We don't ban cars because they cause accidents; we mandate brakes and licenses. I am arguing for safety constraints proportional to the irreversibility of the potential failure, not a moratorium on progress."

  ---

  ## Strategic Analysis

  ### The Weakest Joint: The Epistemic Bridge
  **The Vulnerability:** Your argument relies on the claim: *"We can predictably alter the probability... of irreversible events."*
  **Why it's weak:** This is the exact point where the Philosopher of Science will attack. You have severed the link between "knowing what is good" (Content) and "knowing how to get there" (Trajectory). But you still need to know that Action A reduces Risk B. In complex systems, this is often unknowable.
  **Preparation:** Do not defend the idea that we can predict *most* trajectory impacts. Defend the existence of a *narrow set* of robust interventions (e.g., governance, basic safety protocols) where the causal link is simple enough to survive the uncertainty objection. If you claim too much predictive power, you lose credibility with the Phil Sci.

  ### The "Secretly Hoped No One Asks" Question
  **The Question:** **"If you cannot predict the content of the future, on what basis do you assert that extinction is a *loss* rather than a *prevention of potential negative value*?"**
  **Why it's dangerous:** This attacks the normative core of your "Avoidance of Loss" strategy.
  *   If you say "Because future lives are good," you slide back into Totalism/Content claims you promised to avoid.
  *   If you say "We don't know," then avoiding extinction might be morally neutral or even positive (if the future is net negative).
  *   This exposes that "Trajectory" cannot be fully value-neutral. You are implicitly assuming the future has positive expected value without doing the work to prove it.
  **Preparation:** You must argue that *agency* and *moral progress* have intrinsic option value. Even if the future contains suffering, the *capacity* to reduce that suffering exists only if existence continues. Extinction removes the possibility of moral correction. Therefore, extinction is a loss of *moral opportunity*, regardless of the hedonic content.
