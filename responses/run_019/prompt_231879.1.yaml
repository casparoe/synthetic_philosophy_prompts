prompt: |-
  Computer science, as practiced, treats the Church–Turing thesis as something between a stipulative definition and an empirical law. A paper specifies an algorithm informally and is taken to have shown that a function is computable, with no concern that some other "reasonable" formalism would disagree; complexity theory treats polynomial-time Turing machines as canonical and regards its basic questions as robust across reasonable models; and the field does not seriously entertain constructing a physical device that decides the halting problem. Yet the thesis itself is not a theorem of any formal system. What view of the epistemic status of the thesis does this practice presuppose? Reconstruct the implicit position, being careful to separate what the practice strictly relies on from what it merely fits well with — in particular, could the practice get by with a purely stipulative reading of "effectively computable," or does the way complexity classes and physical computation are treated commit it to an empirical claim? Finally, say what in the conduct of the field would have to change if the thesis were treated as an open, possibly false empirical hypothesis. Lead with your bottom line in the first sentence, then give your reasoning; no preamble and no restating of the question.
