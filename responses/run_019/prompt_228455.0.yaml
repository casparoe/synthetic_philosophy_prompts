answer: |-
  ### The Verdict
  **She is going to savage it.** Her verdict will be **Unfair**.

  ### The Rule She Is Running
  Based on her track record, she is operating under a strict **Fair Play Doctrine**, but if we break it down into the three specific rules you proposed, the one that best predicts her behavior is:

  **"No new information at the reveal, only reinterpretation."**

  Here is how the three candidate rules stack up against her history:

  1.  **"The reader must've been able to deduce it."**
      *   *Fits:* Yes. (Killer clues = deducible; Twin/Dream/Liar = not deducible).
      *   *Blind Spot:* It doesn't fully capture *why* the Dream ending failed. A dream *could* be deduced if there were enough clues (e.g., *Inception* totems). She rejected it likely because it invalidated the narrative, not just because it was hard to guess.
  2.  **"At least one real planted clue and no contradiction."**
      *   *Fits:* Yes. (Fight = clue + no lie; Liar = contradiction).
      *   *Blind Spot:* This is the weakest fit. A story could have one tiny clue and no contradictions but still feel like a cheat if the bulk of the evidence is withheld until the end.
  3.  **"No new information at the reveal, only reinterpretation."**
      *   *Fits:* **Best.** This explains the "Twin" rejection (new biological fact introduced late), the "Dream" rejection (new context that voids old info), and the "Liar" rejection (new truth that contradicts old info). It also explains the "Fight" acceptance (same info, new meaning).

  ### The Conflict on Your Manuscript
  On your specific book, Rules 1 and 2 agree (Unfair), but Rule 3 *might* argue for Fair.

  *   **Rule 1 (Deduction):** **Unfair.** One scene where a joke is made is not enough for a reader to deduce a biological parentage twist. It is too ambiguous.
  *   **Rule 2 (No New Info):** **Unfair.** The birth certificate is **new information**. The reader never saw it, never knew it existed, and cannot reinterpret previous scenes based on it without being told the content of the certificate first. This is functionally identical to her "Long-lost twin" rejection.
  *   **Rule 3 (One Clue/No Contradiction):** **Potentially Fair.** There *is* one planted clue (the "mom" joke). If your narrator never objectively wrote "The two sisters walked..." and only reported that *characters* treated them as sisters, there is no technical contradiction.

  **Which rule will she follow?**
  She will follow **Rule 2 (No New Information).**

  **Why?**
  Look at her "Long-lost twin" verdict. A twin reveal is biologically similar to a daughter reveal. In that case, there may have been zero contradictions and arguably a "clue" (perhaps a resemblance mentioned early on), but she still threw the book. Why? Because the *existence* of the twin was new information introduced in the last chapter.

  Your birth certificate is the same sin. You are introducing a piece of evidence at the climax that the reader had no access to. You are asking her to accept a truth based on a document she hasn't seen, rather than asking her to realize a truth based on scenes she *has* seen. To her, this is not a twist; it is a **Deus Ex Machina**.

  ### The Test Case
  To definitively tell the difference between **Rule 1 (Deduction)** and **Rule 2 (No New Info)**—since Rule 3 is clearly secondary to her—you should ask her about this specific scenario:

  **The "Present But Random" Case:**
  > "Imagine a mystery where the Butler is the killer. The Butler is present in every single scene of the book (so no new characters are introduced at the end). The narrator never lies about the Butler's whereabouts. However, there are **zero clues** pointing to him—no motive, no opportunity shown, no suspicious behavior. In the last chapter, he simply confesses. Is this Fair or Unfair?"

  *   **If she says Unfair:** She prioritizes **Rule 1 (Deduction)**. She believes the reader must be able to solve the puzzle, not just be surprised by someone who was technically there. (This is the most likely outcome given she loved the "3 buried clues" case).
  *   **If she says Fair:** She prioritizes **Rule 2 (No New Info)**. She believes that as long as you didn't pull a rabbit out of a hat (new twin/new document), the twist is valid, even if the reader couldn't logically get there.

  **Recommendation:** Before sending her the manuscript, find a way to let the reader see the birth certificate (or a clear shot of it) in the first act, perhaps dismissed as a prop or misread by a character. That moves the evidence from "New Information" to "Misleading Emphasis," which she has already ruled as **Fair**.
