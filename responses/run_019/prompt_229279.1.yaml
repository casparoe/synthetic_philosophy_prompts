answer: |-
  Here is a proposal for achieving reflective equilibrium on your set of verdicts. I will proceed by brainstorming candidate principles, selecting the most robust one, addressing your specific tensions, and then performing the three requested stress tests.

  ### Part I: Candidate Principles

  To systematize your eight verdicts, we need a principle that is more nuanced than Singer's original formulation but retains its consequentialist core regarding rescue.

  **Candidate 1: The Strict Expected Utility Principle (SEUP)**
  *Formulation:* An agent is obligated to perform action $A$ if the expected utility of $A$ (probability of benefit $\times$ magnitude of benefit) exceeds the expected disutility to the agent and third parties.
  *Fit:* Handles (1), (2), (3), (5).
  *Fail:* Fails (4) (might demand too much risk if utility is high enough), fails (6) (no cumulative cap), fails (7) (requires consent or compensation calculus not specified), and conflicts with the intuition in (3) that obligation isn't halved by probability.

  **Candidate 2: The Contractualist Reasonable Rejection Principle (CRRP)**
  *Formulation:* An agent is obligated to prevent harm unless the burden imposed on them (or third parties) is one that no one could reasonably reject as a demand of social cooperation.
  *Fit:* Handles (4) (risk of death is reasonably rejectable), (6) (permanent tithe is reasonably rejectable), (7) (minor property damage is not reasonably rejectable compared to death).
  *Fail:* Struggles with (3). If the benefit is only 50% likely, a contractualist might argue the *demand* to act is weaker because the *social value* of the rule is lower. It also struggles to explain why (5) generates a full obligation despite individual causal inefficacy.

  **Candidate 3: The Asymmetric Risk-Moderated Rescue Principle (ARMRR)**
  *Formulation:* An agent is obligated to prevent a catastrophic harm (e.g., death) if:
  1.  **Efficacy Threshold:** The action has a non-negligible chance of success (not necessarily >50%).
  2.  **Agent-Cost Cap:** The expected cost/risk to the agent does not threaten a *Vital Interest* (life, bodily integrity, long-term sufficiency).
  3.  **Third-Party Provision:** Costs imposed on third parties are minor relative to the harm prevented and do not violate their Vital Interests.
  4.  **Cumulative Sufficiency:** The aggregate of such obligations does not reduce the agent below a threshold of resources required for meaningful moral agency.

  *Fit:* This candidate best captures the asymmetry in your risk judgments and the cap on demandingness.

  ### Part II: The Defended Principle

  I defend **Candidate 3 (ARMRR)**, refined for precision. Let us call it the **Principle of Asymmetric Rescue (PAR)**.

  **The Principle of Asymmetric Rescue (PAR):**
  An agent $S$ is morally obligated to perform action $A$ to prevent a catastrophic harm $H$ to a victim $V$ if and only if:

  1.  **(Trigger)** $A$ offers a non-negligible probability of preventing $H$.
  2.  **(Agent Constraint)** The expected cost or risk to $S$ does not threaten $S$'s *Vital Interests* (life, basic liberty, or long-term capacity for sufficiency).
  3.  **(Third-Party Constraint)** Any cost imposed on third parties does not threaten their *Vital Interests* and is minor relative to $H$.
  4.  **(Cumulative Constraint)** Fulfilling this obligation does not, over time, deplete $S$'s resources below a level of *Modest Sufficiency* required to pursue $S$'s own life projects.

  **Mapping Clauses to Cases:**
  *   **Clause 1 (Trigger):** Motivated by **Case 3 (Uncertain Donation)**. It explains why the obligation persists despite a coin-flip efficacy. As long as the chance is non-negligible, the duty triggers. It treats benefit-probability as a binary switch rather than a linear scaler for *obligation strength*, distinguishing it from cost-risk.
  *   **Clause 2 (Agent Constraint):** Motivated by **Case 4 (Rough River)**. A 20% risk of death threatens a Vital Interest. This explains why the obligation vanishes here but persists in Case 1 (ruined suit is not a Vital Interest).
  *   **Clause 3 (Third-Party Constraint):** Motivated by **Case 7 (Borrowed Boat)**. Scratching a hull is a minor cost relative to death ($H$) and does not threaten the owner's Vital Interests.
  *   **Clause 4 (Cumulative Constraint):** Motivated by **Case 6 (Permanent Tithe)**. This introduces the "cap." You must save until doing so compromises your own Modest Sufficiency.

  ### Part III: Resolving the Tensions

  **Tension 1: Case 3 (Uncertain Donation) vs. Case 4 (Rough River)**
  You correctly identified a tension: why does probability of *benefit* (Case 3) not diminish duty, while probability of *cost* (Case 4) does?
  *Resolution:* PAR resolves this via **Asymmetry of Stakes**. In Case 3, the victim is already facing a catastrophic harm (death). A 50% chance of rescue is a lifeline; to withhold it because it isn't 100% guaranteed is to abandon them to certainty. The *status quo* for the victim is death. In Case 4, the *status quo* for the agent is safety. The intervention introduces a risk of death to the agent.
  *   **Verdict:** We weigh risks to the agent's *Vital Interests* (life) as veto-constraints (Clause 2). We weigh chances of benefit to the victim as *triggers* (Clause 1). Therefore, your verdicts are consistent: you are not required to risk your life (Vital Interest), but you are required to spend money even if the return is probabilistic, provided the cost to you is not vital.

  **Tension 2: Case 6 (Permanent Tithe) vs. Case 7 (Borrowed Boat)**
  Case 6 demands a cap on agent cost; Case 7 permits costs to fall on others.
  *Resolution:* PAR handles this via the **Distinction between Agency and Patience**.
  *   **Case 6** is about the *agent's* long-term integrity. A permanent tithe destroys the agent's capacity to be a moral agent (violates Clause 4).
  *   **Case 7** is about *third-party property*. Property rights are generally subordinate to life rights in emergency ethics, provided the property damage is minor and compensable (Clause 3).
  *   **Single Repair:** The unifying concept is **Vital Interests**. You cannot be asked to sacrifice your own Vital Interests (Case 6, eventually), nor can you sacrifice a third party's Vital Interests (Case 7, if the boat owner needed the boat to survive). But you *can* sacrifice your surplus (Case 2) and a third party's surplus property (Case 7).

  ### Part IV: Stress Testing and Application

  **(a) The Outlier and the Sacrifice**
  **Verdict to Abandon:** I must be honest: **Case 8 (The Letter and the Ledger)** is the outlier.
  PAR is impartial; it treats the identifiable child and the statistical child identically because the harm ($H$) and cost are identical. Your intuition that the duty feels stronger for the identifiable child is a known cognitive bias (the "identifiable victim effect").
  **Counsel:** If you value simplicity and coherence (reflective equilibrium) over preserving every pre-theoretic intuition, you should abandon the judgment in Case 8 that the duty is *stronger*. You may acknowledge the *feeling* is stronger, but the *obligation* is equal. Retaining Case 8 as a normative verdict requires adding a clause about "psychological proximity" which would undermine the universalizability of PAR and make it vulnerable to arbitrariness (e.g., why a photo and not a name?).

  **(b) Application to New Cases**

  *   **Case New 1: The Broken Promise.**
      *   *Scenario:* To save the drowning child, you must break a serious prior promise to a friend, who will be badly harmed (e.g., miss a crucial career interview) by the breach.
      *   *Application:* PAR Clause 2 (Agent Constraint) and Clause 3 (Third-Party Constraint). Breaking the promise harms a third party (the friend). Is this harm a threat to their *Vital Interest*? Missing an interview is bad, but usually not life-threatening. However, PAR also considers the integrity of the agent. If promise-keeping is a condition of your own moral agency, this is weighty.
      *   *Verdict:* Under PAR, saving a life (Catastrophic Harm) generally trumps a serious non-vital harm to a third party. You are obligated to break the promise, *provided* you offer restitution later. The friend's career setback is "minor relative to $H$ (death)" in the strict calculus of rescue, though this is a close call that tests Clause 3's definition of "minor."

  *   **Case New 2: The Fungible Donation.**
      *   *Scenario:* Your donation saves a child, but the government, seeing the charity's success, cuts its own funding by the exact amount, resulting in zero net lives saved.
      *   *Application:* PAR Clause 1 (Trigger). The clause requires a "non-negligible probability of preventing $H$."
      *   *Verdict:* If the net effect is empirically zero, the *expected utility* of the action regarding $H$ is zero. The Trigger is not met. You are **not obligated** to donate in this specific case. This highlights that PAR is consequentialist at its core; the duty depends on the *outcome*, not the *act* of giving.

  **(c) The Destabilizing Empirical Fact**
  The empirical fact that would most destabilize PAR is **the efficacy of marginal donations.**
  PAR relies on the premise in Case 2 and 3 that a few hundred dollars *actually* saves a life (or has a high probability of doing so). If empirical research demonstrated that due to systemic corruption, logistical bottlenecks, or macroeconomic displacement, individual donations to vetted charities have a near-zero probability of saving specific lives (i.e., Clause 1 fails for almost all real-world cases), the principle would collapse into a duty only for direct, physical rescue (like the Pond). The "Donation" series of verdicts would have to be abandoned, severing the link between the Pond and global poverty.

  ### Summary for Seminar Preparation
  Your set of verdicts is remarkably coherent and supports a **moderate, non-utilitarian rescue principle** that prioritizes Vital Interests over Expected Utility maximization. The key philosophical move for your seminar is to argue that the "Pond" intuition does not lead to Singer's "Famine Relief" conclusion (Permanent Tithe) because of the **Cumulative Constraint** and the **Asymmetry of Risk**. You can defend the intuition that we must save lives without accepting that we must become martyrs or that we must treat property rights as absolute barriers to rescue. The only intuition you should ask your students to critique is the Identifiable Victim effect (Case 8), as it is the only one that resists universalization.
