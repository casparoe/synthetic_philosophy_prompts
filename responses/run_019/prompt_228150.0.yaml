answer: |-
  The Committee on Honorary Naming recommends accepting the bequest from the estate of Dr. Eleanor Vance and naming the School of Public Health in her honor, contingent upon the establishment of a permanent interpretive installation detailing the full scope of her life and the personal costs incurred by her work.

  This decision acknowledges the transformative utility of the gift while refusing to sanitize the moral complexity of the benefactor. The bequest provides roughly forty million dollars, endowing twelve graduate fellowships annually in perpetuity. To decline this gift is to forfeit support for a dozen students each year who would otherwise train to alleviate the very suffering Dr. Vance sought to address. We state this cost plainly: rejecting the gift protects the committee from ethical discomfort, but it does so by withdrawing resources from the field of public health. The money is not tainted; its utility is independent of the donor's biography. However, the naming of a school is not merely a transaction; it is an act of pedagogical signaling.

  We have taken seriously the letter from Dr. Vance's son. He asks that his mother not be presented as a model, citing the neglect suffered by him and his sibling as the price of her devotion. This is not a veto, but it is evidence that cannot be dismissed as mere familial resentment. It confirms that the published letters are not abstract philosophical musings but records of concrete harm. The pro-naming faction argues that we honor achievement, not whole lives, noting that we have named buildings for generals and industrialists with far worse consciences. This argument fails in Vance's case because her achievement and her moral failing flow from the same disposition. Her capacity for radical altruism was identical to her capacity for domestic neglect; one cannot be honored without implicitly endorsing the other. To name the school without qualification is to endorse the view that strangers always outweigh family, a principle too demanding for most humans to sustain without breaking.

  The anti-naming faction argues that a life devoid of love or private commitment is a cautionary tale, not an exemplar. Their strongest argument is that accepting the gift unconditionally validates a deformation of character—the "moral saint" who becomes inhuman in the pursuit of the good. They contend that declining the gift is the only way to refuse this model. While we acknowledge the moral weight of this position, it does not prevail. Declining the gift punishes current students for the choices of a deceased benefactor and erases Vance's undeniable contributions to global health. It solves the symbolic problem by creating a material loss. Furthermore, it assumes that the only alternative to worship is silence.

  Our recommendation adopts a third path. By accepting the gift with a formal interpretive condition, we acknowledge that Vance is both an exemplar of professional devotion and a cautionary tale regarding personal sacrifice. The required installation must present her life whole: the clinics saved lives, but the children were left behind. This transforms the School of Public Health into a site of inquiry rather than a shrine. It invites students to ask the hard question Vance's life poses: how much duty is too much? Where does obligation end and love begin?

  This approach respects the son's request not to present his mother as a simple model without denying her legacy. It allows us to accept the forty million dollars without letting that fact decide the issue in silence. We are not buying a name; we are funding fellowships and accepting a complex history. If we name the school after Vance, we must ensure students know who she was—not just the savior of strangers, but the mother who stayed away. To hide this would be to lie. To decline the gift would be to waste the good she did. To accept it with truth-telling conditions is to honor both the living students who need the funding and the dead who paid the price for it. We recommend the university proceed on this basis.
