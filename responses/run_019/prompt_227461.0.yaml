  The country club analogy is the one I hear most often, and I understand why it appeals, but it misses the texture of actual living. A country club is a transactional barrier—you pay a fee, you get access. It's designed to be exclusive by price. A neighborhood isn't a gate; it's a web. When you say we didn't buy the streets or the schools, you're technically right on the deed, but wrong on the social contract. We bought into a specific set of rules that promised stability, and then we spent decades reinforcing that stability through our own choices—coaching the little league, attending the board meetings, watching out for each other's kids. That social capital isn't private property, but it is fragile. It relies on a certain density of trust that can't be scaled up overnight without breaking.

  You call it owning something we didn't pay for; I call it honoring the terms under which the investment was made. If I plant a tree knowing it takes fifty years to mature, and you come along tomorrow demanding I cut it down because you need the shade elsewhere, you're treating my time as disposable. I grant you that being excluded from this neighborhood costs you—maybe you can't afford to live near your job, maybe your kids miss out on these schools. That is a real harm, and I don't dismiss it. But solving your housing crisis by dissolving the community we built is asking us to absorb the entire cost of a regional failure. We're not claiming ownership of the city; we're claiming stewardship of the block we actually maintained.
