  4.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to push back on the country club thing. A country club is exclusive by price. A neighborhood is exclusive by zoning/history. The user says we didn't buy the streets. True. But we bought the *expectation* of what those streets would be. If I buy a house on a quiet street, and tomorrow it becomes a thoroughfare for duplexes, the context changes. It's not about owning the air rights; it's about the shared project.*
