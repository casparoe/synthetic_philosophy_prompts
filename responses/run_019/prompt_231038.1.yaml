answer: |-
  This disagreement is a foundational clash between Humean subjectivism about preferences and objectivist substantive rationality, obscured by an equivocation between dynamic consistency and temporal neutrality.

  Your friend is operating within the standard neoclassical framework where preferences are taken as exogenous givens; within this model, rationality is purely instrumental, defined as internal consistency (transitivity, completeness, and dynamic consistency). From this viewpoint, an exponential discount function is "rational" because it prevents preference reversals (money pumps), regardless of the discount rate's magnitude. Your position aligns with the Sidgwick-Ramsey-Parfit tradition, which treats rationality as substantive, requiring that preferences be responsive to reasons; since the mere passage of time provides no normative reason to value an experience less, pure time preference is a failure of rationality, not just a psychological quirk. The argument jumped levels because you were debating the *justification of ends* (ethics/philosophy), while your friend was defending the *coherence of means* (formal economics/psychology).

  The confusion is compounded by a verbal ambiguity regarding "discounting." In descriptive psychology, discounting is a measured behavior (often hyperbolic). In normative welfare economics, the social discount rate is a policy parameter. Your friend conflated these by arguing that because people *do* discount (descriptive), and because models *need* a parameter (technical), the parameter is therefore *justified* (normative). This commits a naturalistic fallacy, but it feels persuasive because standard economic models deliberately bracket out the ethical assessment of preferences to maintain value neutrality. When he claimed there is "no external standpoint" to call a preference mistaken, he was asserting the Humean dogma that reason is the slave of the passions; your citation of Ramsey was an attempt to reject that dogma, but he heard it as moralizing about a technical input.

  Progress requires disentangling three distinct questions that your debate conflated. First, agree on the definition of rationality: if it means only dynamic consistency, your friend wins by definition; if it means temporal neutrality, you win by argument. Second, distinguish individual behavior from social evaluation: even if individuals psychologically discount the future (descriptive), it does not follow that a social planner should adopt that rate for intergenerational justice (normative), which is why Stern and others argue for near-zero pure time preference in climate models despite observed market rates. Third, acknowledge that the debate is not empirical; no experiment can resolve whether a preference is "mistaken," only whether it is consistent. The stalemate will break only if you agree that standard economics assumes subjectivism by fiat, and that your objection is a philosophical challenge to that axiom, not a correction within the model.
