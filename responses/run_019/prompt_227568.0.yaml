prompt: |-
  On a rationality forum I read, people defend cooperating in a one-shot prisoners dilemma with what they call the mirror argument: if your opponent is an exact copy of you -- same values, same reasoning, same everything -- then choosing is like raising your hand in front of a mirror. Whatever you do, the reflection does too, so the only outcomes on the table are both-cooperate and both-defect, and cooperate obviously wins. They use this to say defecting against a copy is just irrational, no enforcement or repetition needed, and they extend it to voting: if it makes sense for me to stay home because one vote never decides anything, then it makes sense for everyone who thinks like me to stay home, so the mirror says go vote.

  Something feels off to me. A mirror's arm moves because yours moved -- nobody thinks the copy's choice is *caused* by mine, we're in seperate rooms deciding independently. So can you audit the analogy? Give me the correspondence table (what plays the role of the mirror, the reflection, the causal link between me and the glass), say which disanalogies actually matter for the conclusions its being asked to carry and which are just cosmetic, and tell me whether cooperate still wins once the "my choice moves theirs" picture is stripped out -- i.e. whether correlation-without-causation can do the same argumentative work. And if the mirror is the wrong image, what's a better analogy for whatever the symmetry of two identical reasoners actually buys you? Finally, does the voting extension survive, given that there the "copies" are merely similar people rather than exact duplicates?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** The "Mirror Argument" (Logical Decision Theory/Timeless Decision Theory style reasoning) applied to the One-Shot Prisoner's Dilemma (PD) and Voting.
      *   **User's Intuition:** Something feels off. Specifically, the causal link. In a real mirror, my movement *causes* the reflection. In the PD, my choice doesn't *cause* the copy's choice (separate rooms).
      *   **Tasks:**
          1.  Audit the analogy (Correspondence Table).
          2.  Identify which disanalogies matter vs. cosmetic.
          3.  Determine if "cooperate" still wins without direct causation (correlation vs. causation).
          4.  Propose a better analogy if "mirror" is wrong.
          5.  Evaluate the Voting extension (similar people vs. exact copies).

  2.  **Analyze the "Mirror Argument" (Logical Decision Theory - LDT):**

      *   *Premise:* I am facing an agent identical to me in algorithm/source code.
      *   *Reasoning:* Since we run the same algorithm on the same input, we must output the same action. $P(\text{Opponent Cooperates} | \text{I Cooperate}) = 1$ and $P(\text{Opponent Defects} | \text{I Defect}) = 1$.
      *   *Conclusion:* I compare (C, C) vs (D, D). (C, C) is better. Therefore, I Cooperate.
      *   *User's Objection:* Causal Decision Theory (CDT) says my choice doesn't *change* theirs. They are spatially separated.
      *   *Counter-Counter:* It's not about physical causation; it's about *logical* causation (or subjunctive dependence). If I decide to output 'C', the algorithm outputs 'C'. Since the opponent *is* the algorithm, they output 'C'.

  3.  **Task 1: Correspondence Table:**

      *   *Mirror Scenario:* Me -> Light/Physics -> Reflection.
      *   *PD Scenario:* My Decision Algorithm -> Logical Truth -> Opponent's Decision Algorithm.
      *   *Mapping:*
          *   Me (Physical body) = My Decision Algorithm.
          *   Mirror Glass = The Logical/Mathematical Truth governing the algorithm.
          *   Reflection = Opponent's Decision Algorithm (instantiation).
          *   Causal Link (Neurons/Motion) = Logical Entailment (If $f(x) = C$, then $f(x) = C$).

  4.  **Task 2: Disanalogies (Matter vs. Cosmetic):**

      *   *Cosmetic:* Spatial separation, time delay, physical substance. These don't matter for logical truths.
      *   *Matters:* The certainty of identity. In a mirror, identity is physical law (100%). In PD, identity is an assumption (are they *really* identical? Did they get different random seeds?).
      *   *Crucial Disanalogy:* Causation vs. Correlation/Entailment. The user is hung up on "causation." In standard physics, A causes B. In LDT, A and B share a common cause (the source code/logic). The mirror implies A causes B. The PD is actually Common Cause (Logic).
      *   *Does it matter for the conclusion?* If you accept *Logical* Causation (LDT), the mirror works. If you stick to *Physical* Causation (CDT), the mirror fails. The argument hinges on whether you treat logical facts as things you can "influence" by computing them.

  5.  **Task 3: Correlation without Causation:**

      *   Can correlation do the work?
      *   Standard Evidential Decision Theory (EDT) says: Yes, if $P(Opponent=C | I=C)$ is high enough, Cooperate.
      *   CDT says: No, because $P(Opponent=C | do(I=C)) = P(Opponent=C)$.
      *   LDT says: It's not just correlation; it's *logical necessity*.
      *   *Verdict:* If you strip out the "my choice moves theirs" (physical causation) and replace it with "our choices are logically entailed by the same function," Cooperate still wins *under LDT*. Under CDT, Defect wins. The user's intuition aligns with CDT. The "Mirror Argument" is an attempt to visualize LDT.
      *   *Key Insight:* The "choice" isn't a physical event causing another physical event. It's the resolution of a logical variable.

  6.  **Task 4: Better Analogy:**

      *   Mirror implies physical reflection.
      *   Better: **Two Calculators.**
      *   Scenario: I have a calculator. You have an identical calculator. We both type "2 + 2".
      *   If I see "4", do I cause yours to say "4"? No.
      *   But can I reason that yours *will* say "4"? Yes.
      *   Can I reason that if I somehow made mine say "5" (by breaking logic), yours would too? In the realm of abstract computation, yes.
      *   Even Better: **The Same Program Running Twice.**
      *   Analogy: Debugging code. If I find a bug in line 10 on my screen, I know the bug exists on the server running the same code. I don't need to send a signal to the server. Fixing the code (the logic) fixes both instances.

  7.  **Task 5: The Voting Extension:**

      *   *Premise:* Voters are "similar," not identical copies.
      *   *Problem:* The correlation is weak. $P(\text{Others Vote} | \text{I Vote}) < 1$.
      *   *Calculation:* If my voting correlates with $N$ other people voting, and the benefit is $B$, cost is $C$. Expected Utility = $N \times B - C$.
      *   *Reality Check:* How similar are voters? Demographically? Ideologically?
      *   *The "Magic" Step:* LDT proponents argue that if you reason "My vote doesn't matter," everyone who reasons that way stays home. If you reason "My vote matters as part of a block," everyone who reasons that way votes.
      *   *Vulnerability:* This requires the *reasoning process* to be identical, not just the demographics. If some people are CDT agents and some are LDT agents, the LDT agents get exploited (vote while CDT defect).
      *   *Verdict:* The voting extension is much weaker. It relies on the assumption that your decision algorithm is representative of a large bloc *and* that the bloc's decision is contingent on your specific calculation in a way that ignores the causal independence of millions of brains. It's plausible but far less robust than the Exact Copy PD.

  8.  **Synthesizing and Refining the Tone:**

      *   Tone: Analytical, philosophical, respectful of the user's skepticism (which is well-founded in standard decision theory).
      *   Structure: Follow the user's requested points (Table, Disanalogies, Causation vs. Correlation, Better Analogy, Voting).
      *   Key Distinction to emphasize: Causal Decision Theory (CDT) vs. Logical/Timeless Decision Theory (LDT/TDT). The user is intuitively a CDT agent; the forum is arguing LDT.
      *   Clarify the "Causation" point: It's not physical causation, it's logical entailment.

  9.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say "Cooperate is objectively correct." Say "Cooperate is correct *if* you accept the premises of Logical Decision Theory."
      *   *Refinement on Voting:* Be careful not to dismiss voting entirely, but highlight the fragility of the "copy" assumption there.
      *   *Refinement on Mirror:* The mirror is actually a *common cause* analogy (light source + object), but it feels like direct causation. I need to point out that the "glass" is actually "Logic."

  10. **Final Review against constraints:**
      *   Audit analogy? Yes.
      *   Correspondence table? Yes.
      *   Disanalogies (matter vs cosmetic)? Yes.
      *   Correlation without causation? Yes.
      *   Better analogy? Yes.
      *   Voting extension? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Your intuition is sharp. You have identified the exact friction point between **Causal Decision Theory (CDT)** and **Logical Decision Theory (LDT)** (often associated with Timeless Decision Theory or Functional Decision Theory).

  The "Mirror Argument" is a pedagogical tool used to make LDT intuitive, but as you suspected, it smuggles in physical causation where there is only logical entailment.

  Here is the audit of the analogy, the decision-theoretic mechanics, and the viability of the voting extension.

  ### 1. The Correspondence Table

  To see where the analogy holds and where it breaks, we must map the physical mirror scenario to the game-theoretic scenario.

  | Mirror Scenario | Prisoner's Dilemma (Copy Version) | Role in Argument |
  | :--- | :--- | :--- |
  | **You (Physical Body)** | **Your Decision Algorithm** | The agent making the computation. |
  | **The Mirror Glass** | **Logical/Mathematical Truth** | The medium that enforces consistency. |
  | **The Reflection** | **Opponent's Decision Algorithm** | The output of the same function elsewhere. |
  | **Light/Physics** | **Logical Entailment** | The mechanism linking the two. |
  | **Arm Movement** | **Choosing an Action (C or D)** | The output of the computation. |
  | **"My arm moves the reflection"** | **"My output determines the logical truth"** | The contested causal link. |

  ### 2. Disanalogies: Cosmetic vs. Critical

  You noted that in the PD, you are in separate rooms, so your choice doesn't *cause* the copy's choice. This is the crux of the matter.

  **Cosmetic Disanalogies:**
  *   **Spatial Separation:** Irrelevant to logic. $2+2=4$ is true in Room A and Room B simultaneously without signals passing between them.
  *   **Time Delay:** Irrelevant. Logical truths are timeless.
  *   **Physical Substance:** Irrelevant whether the algorithm runs on neurons or silicon.

  **Critical Disanalogies (The "Matter" Category):**
  *   **Physical Causation vs. Logical Entailment:** In the mirror, photons bounce off you and hit the glass. There is a physical chain of events. In the PD, there is **no physical signal**. The link is that you and the opponent are instantiations of the *same function*.
      *   *Why it matters:* If you believe only physical signals constitute "influence" (Causal Decision Theory), the mirror argument is a category error. If you believe that computing a logical fact "sets" that fact for all instantiations (Logical Decision Theory), the mirror works.
  *   **Certainty of Identity:** A mirror reflection is physically guaranteed to match you (barring distortions). In the PD, you must *assume* the opponent is an exact copy. If there is even a 1% chance they are slightly different (e.g., different random number generator seed), the "mirror" cracks.
  *   **Agency over Logic:** You cannot choose to make your reflection wave while you stay still. But can you choose to make your algorithm output 'Cooperate' while the *logical function* outputs 'Defect'? LDT says no; CDT says yes (because CDT treats the output as a local physical event, not a logical truth).

  ### 3. Does Cooperate Win Without "My Choice Moves Theirs"?

  You asked if correlation-without-causation can do the same argumentative work.

  **The Short Answer:** Yes, but only if you change how you calculate expected utility.

  **The Long Answer:**
  Under standard **Causal Decision Theory (CDT)**, you ask: *"If I hold my choice fixed and change the world, what happens?"* Since your choice doesn't physically change the opponent's choice, CDT says the probability of them cooperating is independent of your action. Therefore, Defect dominates. The mirror analogy fails here because CDT rejects the premise that you can "move" the reflection.

  Under **Evidential Decision Theory (EDT)** or **Logical Decision Theory (LDT)**, you ask: *"What does my choice tell me about the world?"*
  *   **EDT:** If I cooperate, it is highly probable (evidence) that a copy cooperates. $P(Opponent=C | I=C) \approx 1$. Therefore, Cooperate.
  *   **LDT:** This goes deeper. It argues that you don't just *observe* a correlation; you are **computing the logical variable** that determines both outcomes. You aren't causing the copy to cooperate; you are cooperating *with* the copy because you are both resolving the same logical equation.

  **Verdict:** If you strip out the "my choice moves theirs" picture (physical causation) and replace it with "our choices are logically entailed by the same source code," **Cooperate still wins**, but *only* if you accept LDT. If you remain a CDT agent (which aligns with your intuition that separate rooms mean separate causality), the argument collapses, and Defect remains the rational choice. The mirror argument is essentially a plea to switch from CDT to LDT.

  ### 4. A Better Analogy: The Two Calculators

  The mirror is misleading because it implies optical causality. A better analogy is **Two Identical Calculators**.

  *   **Scenario:** You have a calculator in New York. An identical calculator is in Tokyo. Both are factory-reset, same firmware, same battery.
  *   **Action:** You both type `2 + 2`.
  *   **Question:** Does your calculator *causing* a `4` to appear make the Tokyo calculator show `4`?
  *   **Answer:** No. There is no signal.
  *   **Reasoning:** However, if you know they are identical, you know that *if* your calculator outputs `4`, the Tokyo one *must* output `4`.
  *   **The "Choice":** Imagine you could somehow force your calculator to output `5` (violating math). If the calculators are truly identical instantiations of the same math, the Tokyo one would also have to output `5` (in that counterfactual logical world).

  **Why this is better:**
  It removes the "spooky action at a distance" of the mirror. It highlights that the link is **shared structure**, not shared signal. It clarifies that you aren't controlling the other machine; you are controlling the *algorithm* that both machines are running.

  ### 5. Does the Voting Extension Survive?

  The voting argument extends the logic: *"If I stay home, everyone like me stays home. If I vote, everyone like me votes. Therefore, I vote."*

  This extension is **significantly weaker** and likely does not survive scrutiny for three reasons:

  1.  **Identity is Fuzzy:** In the PD copy scenario, identity is binary (100% copy or not). In voting, "people like me" is a spectrum. How similar must they be? Do they share my demographics? My political party? My exact decision algorithm? The correlation drops from $1.0$ to perhaps $0.1$ or less.
  2.  **The "Common Cause" Problem:** In the PD copy, the common cause is the *source code*. In voting, the common cause is *sociology*. If you decide to vote because you read a rationality forum, that specific reasoning process is rare. Most people vote for other reasons (habit, duty, passion). Your decision algorithm is not the source code for the electorate.
  3.  **The Free-Rider Exploit:** If you vote because "my reasoning causes others to vote," you are vulnerable to people who reason: *"I'll let the rationalists vote; I'll stay home and save the effort."* In the Copy PD, the opponent *cannot* do this because they are you. In voting, the "copies" are independent agents who can defect on your logic.

  **Conclusion on Voting:**
  The mirror argument works for the Copy PD because the correlation is **logical necessity**. It fails for voting because the correlation is merely **statistical coincidence**.
  *   **Copy PD:** $P(\text{Opponent}=C | \text{I}=C) = 1$ (Logical Truth)
  *   **Voting:** $P(\text{Bloc Votes} | \text{I Vote}) < 1$ (Statistical Correlation)

  Unless you believe your specific reasoning process is the *causal bottleneck* for a massive bloc of voters (a claim with little empirical support), the voting extension is a category error. It treats a statistical cluster as a logical singleton.

  ### Summary

  *   **Your Intuition:** Correct regarding physical causality. Your choice does not physically move the opponent's hand.
  *   **The Forum's Point:** Valid only under Logical Decision Theory, where "choice" is the resolution of a logical function shared by both agents.
  *   **The Mirror:** A flawed analogy because it implies physical reflection. **Two Calculators** is superior.
  *   **The Verdict:** Cooperate wins in the Copy PD *if* you accept that logical entailment counts as a decision-relevant link. Defect wins if you require physical causality.
  *   **Voting:** The argument collapses here. Similarity is not identity, and statistical correlation does not carry the same normative weight as logical necessity.
