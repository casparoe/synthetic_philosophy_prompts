answer: |-
  You are asking for a functional map rather than a metaphysical one, which simplifies some things but complicates others because you are demanding that the theory guide action rather than just describe reality. If we are building a list of desiderata for what matters in survival, the first and most non-negotiable requirement is that the theory must validate ordinary survival across time. When you go to sleep tonight and wake up tomorrow, the theory must say that the person waking up is someone you should care about in exactly the way you care about your own immediate future. If a theory implies that you cease to exist every time you lose consciousness or that the person tomorrow is merely a successor you should regard as a stranger, it fails because it makes practical planning impossible. We plan for the future on the assumption that the beneficiary of our savings or the sufferer of our hangover is us. So, any adequate theory has to deliver a verdict of survival for standard biological continuity over decades, where cells replace themselves and memories fade slightly but the causal chain of brain states remains unbroken. This is non-negotiable because a theory of survival that tells you not to care about your own tomorrow is practically useless.

  Conversely, the theory must also validate ordinary death as the end of what matters. If your body is cremated or your brain is destroyed without any reconstruction process, the theory must say that there is no future person who is the proper object of your self-concern. If the theory implies that you survive death simply because some pattern of information exists elsewhere in the universe or because the concept of you is abstractly consistent, it fails to capture the stakes of mortality. We fear death because we believe it ends our perspective. A theory that says you survive biological cessation without a specific causal mechanism carrying your psychology forward contradicts the deep intuition that drives the fear of death in the first place. This is also non-negotiable. The theory needs a boundary condition that distinguishes between continuing to exist and merely having existed.

  This leads directly to the requirement regarding causal connection, which is tested by the case of the coincidental duplicate. Imagine that by random quantum fluctuation, a molecule-for-molecule copy of you forms on Mars right now, with all your memories and traits, but there is no causal link to your current brain on Earth. An adequate theory must say that this copy is not you and that you should not anticipate waking up on Mars. You should not fear its pain or look forward to its experiences. This distinguishes mere similarity from continuity. If the theory allows that perfect similarity is enough for what matters, then you would have to care about every possible version of yourself that might pop into existence anywhere, which dilutes the concept of survival to meaninglessness. The requirement here is that there must be a causal chain linking your current state to the future state. This is non-negotiable because without it, the distinction between creating a future self and finding a stranger who resembles you collapses.

  However, once we introduce the teletransporter cases, the requirements become more contentious and begin to strain against each other. In the standard teletransporter case, where you are scanned, destroyed on Earth, and rebuilt on Mars from new matter using the information gathered, the theory needs to give a actionable verdict. It cannot simply shrug. You need to know whether to step in. Some theories will say you survive because the psychological continuity is preserved via the causal chain of information transmission. Others will say you die because the physical substrate is destroyed. Here is where we move from non-negotiable requirements to matters of theoretical taste. You might demand that the theory say you survive, based on the intuition that the person on Mars will feel like you and remember being you. Or you might demand it say you die, based on the intuition that destruction is death regardless of replication. An adequate theory must be able to accommodate one of these positions consistently without contradicting the ordinary survival case. If it says you survive the transporter but not ordinary cell replacement, it is inconsistent. If it says you die in the transporter but survive ordinary sleep, it needs to explain the relevant difference without arbitrariness.

  The branching case, where the machine malfunctions and both the Earth original and the Mars duplicate survive, forces a distinction between strict identity and what matters. Strict identity is a one-to-one relation. You cannot be identical to two different people at once. But what matters in survival might be a one-to-many relation. In the branching case, the theory must explain why your relationship to the two successors is different from your relationship to a single successor. Many people have the intuition that branching is worse than ordinary survival, perhaps because it introduces competition or uncertainty, or that it is just as good because both successors are psychologically continuous with you. The requirement here is that the theory must clarify whether identity is necessary for what matters. If the theory says identity is what matters, it must say you do not survive branching because you are not identical to either successor uniquely. If the theory says identity is not what matters, it must explain why you should care about both successors even though neither is strictly you. This is a point where theories often diverge, and you may have to choose which intuition to prioritize. It is a matter of taste whether you privilege the logic of identity or the phenomenology of anticipation.

  The case of amnesia tests the weight of psychological connectedness versus continuity. If you lose all episodic memory but keep your habits, skills, and commitments, do you survive? Most people intuit that you do. You are still responsible for your debts, and your spouse still loves you. This suggests that what matters is not just memory but the continuity of character and intention. The theory must account for this by allowing that psychological continuity can persist even when specific memory links are broken. However, this creates tension with the teletransporter case. If psychological continuity is what matters, and the transporter preserves that, then you survive the transporter. But if psychological continuity is what matters, why does the coincidental duplicate not count? Because it lacks causality. So the theory must combine psychological continuity with causal dependence. This seems manageable until we look at gradual replacement.

  In the gradual replacement case, where your neurons are replaced one by one over years with synthetic equivalents that function identically, the theory must say you survive. If it says you die at some arbitrary threshold of replacement, it violates the intuition that small changes do not kill you. But if you survive total gradual replacement, and you survive the teletransporter (which is essentially instant total replacement), then the theory must explain why the speed of replacement matters, if it does. Some theories will say speed doesn't matter, only the causal chain. Others will say the physical continuity of the brain matters. This is another area of theoretical taste. You might insist that physical continuity is non-negotiable, which would mean you die in the transporter but survive gradual replacement. Or you might insist that psychological continuity is non-negotiable, which means you survive both. The requirement is simply that the theory must be consistent across these cases. It cannot say physical continuity matters for the transporter but not for gradual replacement without a principled reason.

  Now I need to flag the inconsistencies, because this is where the list itself might break. The most significant tension is between the requirement for a causal chain and the requirement to validate ordinary survival alongside the teletransporter verdict. If you insist that physical continuity of the brain is necessary for survival (to rule out the transporter), you risk failing the gradual replacement case. If enough matter is replaced over decades, is it still the same physical brain? If you say yes, you need a definition of physical continuity that allows total matter replacement over time but forbids it over space via teleportation. That is a hard line to draw without appealing to magic. Conversely, if you insist that psychological continuity with causality is sufficient (to allow teleportation), you risk collapsing the distinction between you and the coincidental duplicate if you are not careful about the definition of causality. Information transmission is a causal link, but is it the right kind? If I mail a letter with your memories to Mars and someone builds a body from it, is that you? Most say no. So the theory must specify the right kind of causal process. The inconsistency arises if the theory claims to be based on what matters practically but ends up relying on metaphysical distinctions that have no practical difference. For example, if the theory says you survive gradual replacement but not teleportation, but the psychological experience is identical in both, then what matters in survival is not actually tracking what you care about phenomenologically. It is tracking something external. That suggests a conflict between the desideratum of guiding anticipation and the desideratum of maintaining a physicalist constraint.

  Another potential inconsistency lies between the branching case and the ordinary survival case. If what matters is psychological continuity, and branching preserves that twice over, why is branching often intuited as worse than single survival? If the theory says branching is just as good, it conflicts with the intuition that identity is unique. If the theory says branching is worse, it implies that what matters is not just continuity but unique continuity. But if unique continuity is required, then ordinary survival is always at risk because we cannot know for sure if we are branching in ways we cannot detect. A theory that says you only survive if you are the unique continuer makes survival fragile and unknowable. A theory that says you survive even if you are not unique makes identity irrelevant. You cannot have both the security of ordinary survival and the strictness of unique identity if branching is possible. You have to choose whether the theory protects the feeling of survival or the logic of identity.

  To close, I need to tell you what would change my mind about this list. The requirement I am most willing to demote is the need for a clear verdict on the teletransporter case. I currently list it as a requirement that the theory must tell you whether to step in. However, it is possible that the concept of what matters in survival is simply not applicable to such cases. If an argument could show that anticipation is a biological heuristic evolved for ordinary environments and has no truth value in sci-fi scenarios, then demanding a verdict is a category error. In that case, the theory should say the question is meaningless rather than forcing a yes or no. The case that would convince me of this is a rigorous demonstration that our sense of self is entirely dependent on uninterrupted biological processing, such that any break, even for scanning, destroys the mechanism of anticipation itself, making the question of survival incoherent rather than just difficult.

  My reasoning is most likely to fail on the distinction between causal types. I am assuming there is a clear difference between the causality of ordinary brain processes and the causality of information transmission in a transporter. But if the brain is essentially an information processing system, the medium might not matter. If I am wrong about the importance of the physical substrate, then the requirement for physical continuity is a bias, not a necessity. If future neuroscience shows that consciousness is substrate-independent, then the demand for physical continuity becomes an obstacle to a correct theory. I am also likely failing to account for the social dimension of survival. We survive in part because others treat us as the same person. If the theory ignores the interpersonal recognition aspect, it might be too individualistic. A case where everyone treats the teleportee as you, but you feel dead, would challenge the list. If social recognition is constitutive of what matters, then the coincidental duplicate might count if everyone accepts it, which contradicts my earlier requirement. I am holding onto the internal perspective too tightly, and that might be where the list needs revision.
