          *   Ordinary survival (across decades).
          *   Ordinary death.
          *   Amnesia (loss of episodic memory, retention of habits/skills/commitments).
          *   Gradual brain replacement.
          *   Coincidental duplicate (molecule-for-molecule copy on Mars, no causal link).
      *   **Distinctions to Maintain:**
          *   Strict identity vs. what matters.
          *   Surviving vs. having a duplicate.
          *   Connectedness vs. continuity vs. mere similarity.
      *   **Evaluation:** Specify which requirements are non-negotiable vs. taste/camp. Flag potential inconsistencies between desiderata.
      *   **Format:** Plain prose, like a long email. No headings, bullet points, bold, or tables.
      *   **Ending:** State what would change my mind about the list (which case/argument would demote/add a requirement) and where reasoning is likely to fail.
      *   **Constraint:** Do not cite Parfit or anyone else. Just work the cases.

  2.  **Deconstruct the Desiderata:**
      *   *Requirement 1: Ordinary Survival.* The theory must say I survive ordinary life from moment to moment and year to year. If it says I die every night, it's useless for practical planning.
      *   *Requirement 2: Ordinary Death.* The theory must say I do not survive biological death (cessation of brain function/body destruction without reconstruction). If it says I survive death always, fear of death is irrational, which contradicts deep intuition.
      *   *Requirement 3: The Standard Teletransporter.* This is the crux. Does the theory say I survive? Most people want a clear verdict here because it dictates whether to step in. A theory that says "it's indeterminate" might be acceptable, but a theory that says "obviously yes" or "obviously no" needs to justify it against ordinary survival.
      *   *Requirement 4: The Branching Case (Malfunction).* If two exist, the theory must handle the intuition that I am not *both* in a way that violates logic (one thing cannot be identical to two distinct things), but practically, do I care about both? Usually, the verdict is that survival is diminished or distinct from identity.
      *   *Requirement 5: Coincidental Duplicate.* The theory must distinguish between a causal descendant and a random duplicate. I shouldn't care about the random duplicate's pain the way I care about my own future pain. Causal connection is key.
      *   *Requirement 6: Amnesia.* If I lose memories but keep character/skills, do I survive? Intuition says yes, mostly. The theory needs to account for psychological continuity without requiring perfect memory.
      *   *Requirement 7: Gradual Replacement.* If neurons are replaced one by one, I survive. If done all at once, maybe not. The theory needs to handle the spectrum without arbitrary cutoffs (Sorites issue).
      *   *Distinction:* Identity vs. What Matters. If identity is one-to-one, but what matters can be one-to-many (branching), the theory needs to separate these concepts.
      *   *Distinction:* Similarity vs. Continuity. A perfect copy made from scratch isn't me. There must be a causal chain.

