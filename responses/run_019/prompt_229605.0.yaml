answer: |-
  The requirement that eliminates the most existing accounts is the demand to explain **costly and fitness-reducing practices** without collapsing into circular functionalism, while the pair most likely unsatisfiable is **methodological neutrality on truth claims** versus **functional explanations that imply adaptive fiction**.

  ### Phenomena to Explain
  *   **Universality with radical variability in content:** Religion appears in all known cultures but varies wildly in doctrine and practice (Non-negotiable).
  *   **Costly and fitness-reducing practices:** Time, resources, and risk expended with no obvious material return, e.g., fasting, celibacy, initiation pain (Non-negotiable).
  *   **Action on professed belief:** Why believers act on supernatural claims rather than treating them as mere fiction or metaphor (Non-negotiable).
  *   **Moralising gods (common, recent, not universal):** The correlation between high gods and large societies, noting their absence in small-scale foraging groups (Non-negotiable).
  *   **Afterlives and supernatural punishment:** Concepts of judgment and continuation that defy biological observation (Non-negotiable).
  *   **Stabilisation and transmission:** How beliefs survive across generations despite cognitive load and empirical counter-evidence (Non-negotiable).

  ### Distinctions Not to Collapse
  *   **Explaining belief vs. assessing truth:** Accounting for why a belief is held without asserting its veracity (Non-negotiable).
  *   **Origin vs. maintenance:** Explaining how religion arises is distinct from explaining why it persists (Non-negotiable).
  *   **Individual cognition vs. cultural transmission:** Psychological mechanisms differ from epidemiological spread (Non-negotiable).
  *   **By-product vs. adaptation:** Whether religion is a spandrel of cognition or a selected trait (Preference of one camp).
  *   **Proximate vs. ultimate cause:** Mechanism (how) vs. function (why) (Non-negotiable).

  ### Behavioural and Cognitive Constraints
  *   **Hyperactive Agency Detection (HADD):** Theory must accommodate the tendency to infer agents in noise (Non-negotiable).
  *   **Memorability of Minimally Counterintuitive Ideas (MCI):** Concepts must violate enough expectations to be salient but not so many as to be incomprehensible (Non-negotiable).
  *   **Credibility-Enhancing Displays (CREDs):** Belief transmission relies on observing costly actions by models (Preference/Emerging).
  *   **Costly Signalling:** Rituals function as hard-to-fake signals of commitment (Preference/Emerging).
  *   **Link between moralising gods and large complex societies:** Theory must account for the historical correlation without assuming strict determinism (Non-negotiable).

  ### The Neutrality vs. Debunking Tension
  This pair is suspected to be unsatisfiable in practice, though not in logic. A naturalistic theory must remain methodologically neutral on the truth of supernatural claims (Non-negotiable distinction). However, if the theory explains religion via **functional utility** (e.g., social cohesion, anxiety reduction), it functionally implies the beliefs are **adaptive fictions** rather than true descriptions of reality. This creates an explanatory tension: if the belief persists *because* it is useful, its truth becomes explanatorily irrelevant, which amounts to a soft debunking. Maintaining strict neutrality while offering a complete functional explanation risks either smuggling in ontological claims or rendering the explanation incomplete.

  ### Most Exclusionary Requirement
  **Explaining costly and fitness-reducing practices.** Pure by-product accounts (e.g., standard CSR) struggle to explain why humans sustain expensive rituals that reduce reproductive fitness without invoking group selection or secondary adaptive benefits. Pure adaptationist accounts often struggle to explain the variability and non-universality of these costs. This requirement forces a theory to choose between controversial evolutionary mechanisms (multilevel selection) or complex cognitive-cultural feedback loops, filtering out simplistic "brain glitch" or "social glue" monocauses.

  ### Brief Scorecard of Current Theories
  *   **Pascal Boyer (By-Product):** Explains origin/transmission well (MCI/HADD); fails maintenance of costly practices without additional mechanisms.
  *   **Ara Norenzayan (Big Gods):** Explains moralising gods/society link well; struggles with small-scale religion and non-moralising supernaturalism.
  *   **Richard Sosis (Adaptation):** Explains costly signalling/community well; relies heavily on contested group selection models.
  *   **Scott Atran (Coalition):** Explains commitment/variability well; less focused on the historical emergence of moralising gods.
