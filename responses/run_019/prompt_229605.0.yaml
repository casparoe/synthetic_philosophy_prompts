prompt: |-
  I've been reading around the cognitive and evolutionary study of religion, and every account I try seems built around one pet case — a costly initiation ritual, the historical emergence of moralising gods, cargo cults, whatever — so I want to nail down the spec before reading any more. Give me the desiderata a naturalistic theory of religion has to meet to count as adequate: not just a just-so story about origins, but a full explanation of a recurrent human phenomenon. I want the phenomena it must explain, with the case or consideration behind each (universality with radical variability in content; costly and fitness-reducing practices; why people act on professed beliefs instead of merely stating them; moralising, punishing gods being common but not universal and looking historically recent; afterlives and supernatural punishment; how beliefs stabilise and spread across generations); the distinctions it cannot collapse (explaining belief vs assessing whether the beliefs are true, origin vs maintanence, individual cognition vs cultural transmission, by-product vs adaptation, proximate vs ultimate cause); and the behavioural and cognitive results it can't contradict (hyperactive agency detection, the memorability of minimally counterintuitive ideas, credibility-enhancing displays, costly signalling, the link between moralising gods and large complex societies). For each requirement, mark whether it's non-negotiable or just the preferrence of one camp. Then flag any pair of desiderata you suspect can't be jointly satisfied — I particularly want to know whether a theory can stay neutral on the truth of the religious claims while also being a genuinely debunking explanation, because those two feel as though they pull in opposite directions. And tell me which single requirement would knock out the most existing accounts. Keep any scorecard of current theories brief; the list is what I'm actually after.

  Lead with the bottom line in the first sentence — for this, your verdict on which requirement does the most exclusionary work and whether any pair is unsatisfiable — then give the reasoning. No preamble and don't restate the question.
