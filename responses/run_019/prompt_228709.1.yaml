      *   *Steadfastness:* Epistemology is *internalist/agential*. It's about responsible reasoning. The subject is an agent exercising judgment.
      *   *The Impasse:* The "Self-Defeat" objection works only if epistemology is consistent across all levels (evaluative). The "Bracketing" reply works only if there are different norms for different levels (agential hierarchy).
      *   *The Case Data:* Toy cases enforce symmetry (favoring Conciliationism). Real cases (like hiring) involve asymmetric access to nuance (favoring Steadfastness).

