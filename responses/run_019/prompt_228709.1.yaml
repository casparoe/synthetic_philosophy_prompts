          *   *Steadfastness (Kelly, Sosa, Lackey):* Often appeal to "epistemic partiality" or the idea that *your* access to the evidence matters more than the *fact* of disagreement. Kelly's "Total Evidence View" is actually a form of steadfastness that argues the peer's disagreement is just *more evidence* to be weighed, not a trump card. This supports the "first-person reasoning" angle.
