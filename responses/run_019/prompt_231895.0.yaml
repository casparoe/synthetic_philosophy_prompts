answer: |-
  This is a sophisticated question that cuts to the heart of the methodological disagreement between resource egalitarians (such as Ronald Dworkin) and capability theorists (such as Amartya Sen and Martha Nussbaum). You are quite right to identify that the dispute is not merely about whether we care about welfare, but about the ontological status of the relationship between a person and a good.

  To untangle this, we must examine why the capability theorist insists that a conversion factor cannot simply be absorbed into the resource bundle, and how each side conceptualises the 'location' of the inequality.

  ### 1. The Resourcist Strategy: Internal Endowments
  You ask why a resourcist cannot treat a conversion factor (e.g., a metabolic rate, a physical disability, or a skill level) as a personal endowment to be counted in the bundle. The short answer is: they do try to do exactly this.

  In Dworkin's theory of 'equality of resources', a distinction is drawn between *impersonal resources* (wealth, income, external assets) and *personal resources* (talents, physical abilities, health). The resourcist acknowledges that people differ in their internal endowments. To handle this, Dworkin proposes a hypothetical insurance market. We ask what premium individuals would pay, behind a veil of ignorance, to insure against having poor 'personal resources' (such as a disability). We then tax the talented/able to compensate the less talented/able, aiming to equalise the total value of the bundle (internal + external).

  From this perspective, the conversion factor is treated as a **background fact about the person** that generates a claim on external resources. If you have a disability (a negative personal resource), you are entitled to more income (positive impersonal resources) to bring your total bundle up to the social average.

  ### 2. The Capability Critique: The Means-Ends Distinction
  The capability theorist objects to this manoeuvre not because it ignores the disability, but because it misidentifies what is being equalised. The core conceptual issue here is the **means-ends relationship**.

  For the resourcist, resources are the *currency* of justice. Even if we adjust for personal endowments, we are still measuring the *means* to live a life. For the capability theorist, resources are merely instrumental; they have no intrinsic value. Their value lies entirely in what they allow a person to be or do (their functionings) and the real freedom they have to achieve those states (their capabilities).

  The capability theorist argues that treating a conversion factor as a 'personal resource' creates a category error. A conversion factor is not a 'thing' one possesses in the same way one possesses a pound sterling or a kidney. Rather, it is a **relational property**. It describes the efficiency of the transformation process from good to functioning.

  If you treat the conversion factor as part of the resource bundle, you are implying that there is a common metric by which we can add 'mobility' and 'money' together. The capability theorist asks: what is that metric?
  *   If the metric is **market value**, you fail to capture the specific need (e.g., a wheelchair costs money, but the value lies in the mobility, not the cash).
  *   If the metric is **welfare**, you have abandoned resource egalitarianism for welfarism.
  *   If the metric is **potential to achieve functionings**, you have secretly adopted the capability approach.

  ### 3. The Status of Conversion Factors
  This brings us to your central question: is the conversion factor part of the thing we equalise, a background fact, or a dimension of welfare?

  **For the Resourcist:**
  The conversion factor is a **background fact** that triggers compensation. It is external to the metric of equality (resources) but internal to the calculation of distribution. The inequality lies in the distribution of assets; the conversion factor is merely the reason why the distribution must be uneven to achieve equality. The focus remains on the *input* side of the equation.

  **For the Capability Theorist:**
  The conversion factor is **constitutive of the metric itself**. One cannot measure equality without embedding the conversion factor into the definition of the currency. We do not equalise resources *plus* conversion factors; we equalise the *effective freedom* that results from the interaction of resources and conversion factors.

  Sen argues that focusing on resources involves a form of 'fetishism'—valuing goods for their own sake rather than for what they do. By trying to fold the conversion factor into the resource bundle, the resourcist is attempting to fix a flaw in the *means* by adjusting the quantity of means, rather than switching the focus to the *ends*.

  ### 4. The Conceptual Knot: Commensurability
  The deepest conceptual tangle lies in the problem of commensurability.

  To count a conversion factor as part of a resource bundle, one must be able to say, "This level of mobility is equivalent to £X." But how do we determine X?
  *   If we determine X based on the cost of the aid required (e.g., the price of a wheelchair), we are still looking at resources. But what if the wheelchair does not grant the same freedom as walking? A resource accounting might say the bundles are equal (cash + wheelchair vs. cash + legs), but the capability accounting notes the functionings differ (stigma, effort, terrain access).
  *   If we determine X based on the *value of the functioning* to the person, we are measuring capability or welfare, not resources.

  Therefore, the capability theorist claims that the resourcist cannot consistently count conversion factors as resources without ceasing to be a resourcist. As soon as you value the personal endowment based on what it *enables* the person to do, you have shifted the currency of equality from resources to capabilities.

  ### 5. Summary of the Disagreement
  To summarise the conceptual stalemate without taking a side:

  1.  **Location of Equality:** The resourcist locates equality in the **distribution of assets** (adjusted for traits). The capability theorist locates equality in the **distribution of effective freedoms** (determined by assets and traits together).
  2.  **Status of Conversion Factors:** For the resourcist, they are **causes of cost** that justify redistribution of external goods. For the capability theorist, they are **parameters of freedom** that define the value of the goods.
  3.  **The Bundle Objection:** The resourcist believes internal and external resources can be aggregated into a single index of 'opportunity cost'. The capability theorist argues this aggregation is impossible without referencing the *functionings* those resources produce, which renders the 'resource' label incoherent.

  The tangle arises because the resourcist views the person as a container of assets (some internal, some external) to be balanced, whilst the capability theorist views the person as an agent whose freedom is determined by the interaction between their body, their environment, and their goods. Consequently, for the former, the conversion factor is a variable in the distribution formula; for the latter, it is a variable in the definition of the currency itself.
