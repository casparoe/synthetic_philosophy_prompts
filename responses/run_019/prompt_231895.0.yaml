prompt: |-
  I've been trying to get clear on a particular conceptual tangle in the equality-of-what debate, and its not the usual welfare-vs-resources thing. The bit that keeps confusing me is the status of what capability theorists call conversion factors. If we equalise resources, someone with a disability might need more resources to do the same things, so the capability theorist says we should equalise capabilities instead. But then is the difference in how effectively different people can convert resources into functionings part of the thing we equalise, or a background fact about persons, or a dimension of welfare? And from the resources side, why exactly is a conversion factor not just another personal endowment that a resourcist can count as part of someone's bundle? I want an explanation of the conceptual issue, not a recommendation about which view is right. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the Request:**
      *   **Topic:** The "equality of what?" debate (political philosophy/ethics).
      *   **Specific Focus:** The status of "conversion factors" in Capability Approach (CA) vs. Resource Egalitarianism (specifically Dworkin-style or similar).
      *   **Core Question:** Is the differential ability to convert resources into functionings part of the *currency* of equality, a *background fact*, or a dimension of *welfare*? Why can't a resourcist just count conversion factors as part of the resource bundle?
      *   **Constraint:** Explain the conceptual issue, *not* recommend a view.
      *   **Language:** British English (e.g., "equalise", "programme", "favour", "colour").

  2.  **Deconstruct the Conceptual Tangle:**
      *   *The Setup:* Resource egalitarians say equalise external assets (income, wealth). Capability theorists (Sen, Nussbaum) say this ignores internal heterogeneity (disabilities, metabolism, skills).
      *   *The Problem:* If Person A needs £100 to bike and Person B (disabled) needs £1000 to bike (adaptive bike), resource equality gives them both £100 (unfair to B) or adjusts for cost (but then what are we measuring?).
      *   *The Crux:* The user is asking about the *ontology* of the conversion factor. Is it a resource? Is it a person-trait? Is it the metric itself?
      *   *The Resourcist Counter:* Why not say Person B has a "personal resource" deficit (lack of mobility) and compensate them with external resources? (Dworkin's insurance scheme).
      *   *The Capability Theorist Reply:* Because resources are merely means; functionings/capabilities are the ends. Conversion factors reveal that the *means-ends relationship* varies, so measuring the means is inherently flawed.

  3.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. It's not the standard "welfare vs. resources" intro. Define the terms briefly (Resources, Capabilities, Conversion Factors).
      *   **The Resourcist Move (Internal Endowments):** Address the user's specific question: "Why is a conversion factor not just another personal endowment?"
          *   Explain Dworkin's distinction between personal and impersonal resources.
          *   Explain the logic: If we count mobility as a resource, we can compensate for lack of it with money.
          *   *The Conceptual Hiccup:* This requires a metric to compare "mobility" to "money". What is that metric? If it's welfare, we're back to welfarism. If it's resources, how do we value the internal trait without referencing what it *does* (capabilities)?
      *   **The Capability Theorist's Diagnosis:** Why do they insist conversion factors aren't resources?
          *   Means vs. Ends. Resources are instrumental.
          *   The "Fetishism" charge (Sen): Focusing on goods rather than what goods do.
          *   Conversion factors are the *relationship* between the good and the person, not the good itself.
      *   **The Status of Conversion Factors:** Address the "background fact vs. currency" question.
          *   For Resourcists: They are background facts that trigger compensation claims (via hypothetical insurance).
          *   For Capability Theorists: They are constitutive of the metric itself. You can't measure equality without embedding them in the metric.
      *   **The Incommensurability/Measurement Problem:** This is the deep conceptual knot.
          *   To treat a conversion factor as a resource, you need a common denominator to add it to the bundle.
          *   If the common denominator is "potential to achieve functionings," you've secretly adopted the Capability Approach.
          *   If the common denominator is "market value," you ignore the specific disability need.
      *   **Conclusion:** Summarise the stalemate. It's about whether we equalise the *means* (adjusting for traits) or the *effective freedom* (where traits are internal to the measurement).

  4.  **Refining the Language (British English Check):**
      *   Use "equalise" (not equalize).
      *   Use "favour" (not favor).
      *   Use "programme" (not program).
      *   Use "centre" (not center).
      *   Ensure tone is academic but accessible.
