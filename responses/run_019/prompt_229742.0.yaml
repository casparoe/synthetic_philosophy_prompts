  ### TA Note for Office Hours
  If the student challenges the grade, focus on the two major conceptual errors:
  1.  **Individual Rationality:** Ask them to define a "preference ordering." If it is intransitive, it is not an ordering. Arrow's theorem assumes individuals are rational; the impossibility arises from aggregating *rational* preferences, not irrational ones.
  2.  **Condorcet & IIA:** Ask them to verify if Majority Rule satisfies IIA. (It does: if everyone's $a/b$ ranking stays the same, the majority winner between $a$ and $b$ stays the same, regardless of $c$). The cycle in Condorcet is a failure of Transitivity ($a>b, b>c, c>a$), which is why we need an SWF to force transitivity, leading to Arrow's result. Confusing the two undermines the logic of the entire theorem.
