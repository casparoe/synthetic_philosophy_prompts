      *   Key concepts: Self-locating belief, centered worlds, conditionalization, Dutch Book arguments, Principal Principle.
      *   *Crucial Distinction:* Is the question about the *coin* (uncentered) or the *current situation* (centered)?
      *   *Crucial Distinction:* Is the betting scenario defining the probability or testing it?

