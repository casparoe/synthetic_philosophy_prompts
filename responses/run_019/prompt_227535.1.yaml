      *   **Current State:** Committee is split 2-2. This memo is the swing vote.
      *   **Key Concerns:**
          1.  Metric design bundles values (revenue vs. satisfaction), so values aren't truly separated from beliefs.
          2.  Market liquidity/manipulation (only ~100 traders, potential for wealthy members to sway outcomes).
