answer: |-
  **MEMORANDUM**

  **TO:** Policy Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Futarchy Trial for Conference Location Decision

  **Recommendation**
  I recommend we **adopt the proposal in modified form**: we should run the prediction market as a non-binding advisory pilot for this cycle. We will commit to considering the market price as a primary data point, but the Board retains final voting authority. This approach captures the informational benefits of the proposal while mitigating the governance and liquidity risks inherent in a binding trial.

  **The Case for Futarchy**
  We must acknowledge the strength of the proponent's argument. Robin Hanson's core thesis—that markets aggregate dispersed information better than deliberation—is theoretically sound. Our current voting process incentivizes members to signal virtue or protect local interests rather than seek the truth about what generates revenue and satisfaction. A prediction market financially incentivizes members to research hotel capacity, travel costs, and historical attendance trends. If we trust our members to be competent actuaries, we should trust their aggregated probability assessments. Dismissing this tool outright ignores a potentially superior mechanism for uncovering the likely consequences of our policies.

  **Concern 1: The Metric and Value Judgments**
  My first reservation concerns the claim that this "separates values from beliefs." It does not eliminate value judgments; it merely shifts them to the metric design phase. Bundling revenue and satisfaction into a single payout score requires an exchange rate (e.g., how many dollars equal one satisfaction point?). That ratio is a pure value judgment.

  For the framing to be honest, the metric-design process must be **transparent, ex-ante, and fixed**. The Board must set the weighting formula *before* the market opens and commit not to change it based on the results. If we allow the metric to be tweaked after seeing preliminary prices, we have not separated values from beliefs; we have simply hidden the value judgment inside a black box. If we define the utility function democratically and fix it, the market can then purely aggregate beliefs about which policy maximizes that function.

  **Concern 2: Liquidity and Manipulation**
  Regarding liquidity: with only ~100 likely traders, this is a thin market. The argument that manipulation subsidizes information relies on the presence of rational arbitrageurs with sufficient capital to trade against the manipulator and correct the price. In a small, closed association market, we may lack the depth for this correction to occur. A wealthy member with a strong preference for Chicago could potentially distort the price beyond what fundamental information justifies, effectively buying the outcome.

  However, an advisory pilot mitigates this risk. If the market price looks anomalous compared to other data (e.g., early registration numbers), we can discount it. If we made the market binding, a manipulated price would force a suboptimal policy. By treating this as a pilot, we allow the "subsidized information" to flow without risking fiduciary failure if the capitalization is insufficient to prevent distortion.

  **Concern 3: Governance and Abdication**
  Finally, there is the question of abdication. If we bind the Board to the market outcome, we effectively outsource our fiduciary duty. Unforeseen circumstances (e.g., a venue contract dispute or a sudden travel restriction) could arise where the market's three-year horizon does not capture immediate existential risks. The Board cannot legally or ethically abdicate responsibility for the association's welfare.

  Conversely, if we reserve the right to override the market without clear criteria, the trial becomes a beauty contest, and traders will not trust the mechanism. The "advisory pilot" strikes a balance. We publicly commit to weighting the market result heavily, preserving the incentive for members to trade seriously. However, we retain a "governance escape hatch" should the market clearly fail or external conditions shift drastically. This preserves trust while acknowledging that prediction markets are decision *support* tools, not decision *makers*.

  **Conclusion**
  Futarchy is an innovative approach that aligns well with our analytical culture, but a binding trial is premature given our market size and governance obligations. By running an advisory pilot with a fixed, transparently designed metric, we test the mechanism's accuracy without compromising the Board's authority. I move we authorize the market design team to draft the metric weighting for Board approval, with trading to commence only after that weighting is locked.

  Please review this reasoning ahead of our vote on Thursday. I am prepared to argue that this middle path offers the highest expected value for the association.
