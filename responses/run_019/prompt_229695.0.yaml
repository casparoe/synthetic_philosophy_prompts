answer: |-
  This is a classic frustration in philosophy of science reading groups. The Pessimistic Meta-Induction (PMI), popularized by Larry Laudan (1981), is often wielded as a "conversation stopper" when it is actually a nuanced argument with significant limitations. Your intuition is correct: the one-liner is doing far too much work.

  To counter it effectively, you need to show that the PMI is not a monolith. It relies on ambiguous definitions of "falsehood," a contested reference class for the induction, and a conclusion that often doesn't follow from the premises.

  Here is a breakdown of the distinct precise claims the PMI could be making, evaluated for defensibility and whether it licenses your friend's dismissal of the Standard Model (SM).

  ### 1. The "Global Extinguisher" Claim
  *   **Precise Claim:** Nearly every past successful theory turned out to be **utterly false** (empirically inadequate and ontologically empty). Therefore, current successful theories are likely **utterly false**.
  *   **Sense of 'False':** The theory makes wrong predictions *and* none of its central terms refer to real entities (e.g., Phlogiston theory was wrong about combustion and phlogiston doesn't exist).
  *   **Strength of Induction:** Strong universal generalization.
  *   **Conclusion:** Global Anti-Realism. We should believe none of our current theories describe reality.
  *   **Defensibility:** **Low.** This is historically inaccurate. Many past theories were *not* utterly false. Newtonian mechanics is still used for landing rockets; it isn't "utterly false," just limited. Many terms from past theories *do* refer (e.g., 'electron', 'gene', 'planet').
  *   **Licenses Dismissal?** **No.** Since the premise (that past theories were *utterly* false) is historically dubious, the induction fails. It certainly doesn't license dismissing the claim that the SM is *approximately* right.
  *   **Verdict:** This is a straw man of scientific history.

  ### 2. The "Referential Skeptic" Claim
  *   **Precise Claim:** The central **ontological terms** of past successful theories failed to refer (e.g., 'ether', 'caloric'). Therefore, the central ontological terms of current theories (e.g., 'quark', 'field') likely fail to refer.
  *   **Sense of 'False':** The math works, but the "stuff" the theory says exists does not.
  *   **Strength of Induction:** Moderate. It focuses only on ontology, not empirical success.
  *   **Conclusion:** Ontological Anti-Realism. We should accept the equations but not believe the entities exist.
  *   **Defensibility:** **Moderate.** This is the strongest version of the PMI. There are clear cases of successful theories with non-referring terms (Fresnel's ether theory predicted light behavior correctly but the ether didn't exist).
  *   **Licenses Dismissal?** **No.** Even if specific ontological labels change, this does not dismiss the claim that the SM is *approximately right about what protons are*. Protons are empirically detectable bound states. Even if our *model* of the interior changes (e.g., string theory replaces quarks), the SM's description of the proton as a composite baryon with specific charge/mass properties remains robustly approximately true. This version of PMI suggests caution about *fundamental* ontology, not about mid-level entities like protons.
  *   **Verdict:** Defensible as a cautionary principle, but overextended when used to deny approximate truth of stable entities.

  ### 3. The "Approximation Concession" Claim
  *   **Precise Claim:** Past successful theories turned out to be **strictly false but approximately true**. Therefore, current theories are likely **strictly false but approximately true**.
  *   **Sense of 'False':** Not literally true in all limits (e.g., Newton fails at high speeds), but captures the structure of reality well enough within a domain.
  *   **Strength of Induction:** Weak/Trivial. It concedes the realist's main point.
  *   **Conclusion:** Moderate Realism. We should believe our theories are good approximations, not literal final truths.
  *   **Defensibility:** **High.** This is actually what most scientific realists believe already. No serious realist claims the SM is the "Final Theory of Everything."
  *   **Licenses Dismissal?** **No.** In fact, this **supports your claim**. If the conclusion is "Current theories are approximately true," then your friend cannot use this to dismiss your claim that "The SM is approximately right about protons." They are agreeing with you while pretending to disagree.
  *   **Verdict:** This renders the PMI useless as a weapon against realism; it becomes a qualification of realism.

  ### 4. The "Selective/Structural" Claim
  *   **Precise Claim:** Specific **theoretical assumptions** in past theories were discarded while **structural/mathematical relations** were retained (e.g., Maxwell's equations survived the shift from ether to relativity). Therefore, we should only believe the structural relations of current theories.
  *   **Sense of 'False':** The causal mechanisms proposed were false, but the mathematical relations were veridical.
  *   **Strength of Induction:** Moderate. Supported by case studies in Structural Realism (Worrall, Ladyman).
  *   **Conclusion:** Epistemic Structural Realism. Believe the structure, suspend judgment on the nature of the relata.
  *   **Defensibility:** **Moderate to High.** This is a live position in contemporary phil sci.
  *   **Licenses Dismissal?** **No.** This requires detailed historical analysis of *which* parts of the SM are likely structural vs. contingent. It does not license a **one-liner** dismissal. To use this, your friend must identify *which* part of the proton description is likely to be discarded (like the ether) and which retained (like the wave equations). Without that specific argument, the slogan is empty.
  *   **Verdict:** Requires work. Cannot be used as a blanket dismissal.

  ---

  ### Summary of Verdicts

  | Claim Variation | Defensible? | Licenses Wholesale Dismissal? | Why? |
  | :--- | :--- | :--- | :--- |
  | **1. Global Extinguisher** | No | No | Historically false; past theories weren't *utterly* wrong. |
  | **2. Referential Skeptic** | Moderate | No | Applies to fundamental ontology, not stable entities like protons. |
  | **3. Approximation** | Yes | **No (Helps You)** | Concludes theories *are* approximately true. |
  | **4. Structural** | Moderate | No | Requires case-by-case analysis, not a slogan. |

  ### Confidence and Uncertainty

  **Confidence in Verdicts:** **High (85-90%)**
  The consensus in contemporary philosophy of science is that the "strong" PMI (Variation 1) is dead. It was effectively countered by arguments regarding reference continuity (Kitcher, Putnam) and the distinction between strict truth and approximate truth. Most philosophers agree that the PMI, if it works at all, only supports a modest skepticism about *fundamental* ontology or a shift toward Structural Realism (Variations 2 & 4). None of these support the idea that we should dismiss the approximate accuracy of well-confirmed mid-level entities like protons.

  **Point of Least Certainty:** **The Status of "Protons" in QFT**
  I am least certain about the specific physics claim your friend is attacking: *"The Standard Model is at least approximately right about what protons are."*
  While the PMI is a bad argument to dismiss this, there is a technical nuance in Quantum Field Theory (QFT) that might give your friend a *different* foothold. In rigorous QFT, "protons" are not fundamental fields; they are bound states arising from non-perturbative QCD (Quantum Chromodynamics). We cannot derive proton properties analytically from the SM Lagrangian yet (we need lattice QCD simulations).
  *   **The Uncertainty:** It is arguably true that we do not fully understand *how* the SM generates protons (the confinement problem). If your friend means "We don't have a derived explanation of proton mass from first principles," they have a point. However, using the PMI to make that point is still a category error. The PMI is about historical turnover; the confinement problem is about current mathematical difficulty.
  *   **Confidence here:** **Medium (60%)**. I am confident the PMI is the wrong tool, but less confident that the claim "SM is right about protons" is unassailable on *other* grounds (e.g., effective field theory limitations).

  ### How to Push Back in the Group

  You can tell your friend:
  > "The PMI only works if you define 'false' in a way that no realist accepts (utterly false) or in a way that concedes my point (strictly false but approximately true). If you mean past ontologies were wrong, fine, but that requires showing which part of the proton model is like 'ether' and which is like 'Maxwell's equations.' You can't use a historical slogan to bypass that specific work."

  This forces them to move from a slogan to a specific argument, which is where the PMI usually loses its bite.
