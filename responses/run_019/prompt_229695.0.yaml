      *   *Variation 2: Structural Realism Compatible (Weak PMI).* Specific ontological claims fail, but mathematical structure remains. Conclusion: Believe the equations, not the entities.
      *   *Variation 3: Approximate Truth/Convergence (Moderate PMI).* Past theories were strictly false but approximately true. Current theories are strictly false but approximately true. Conclusion: Skepticism about literal truth, but acceptance of approximate accuracy.
      *   *Variation 4: Selective Skepticism (Targeted PMI).* Specific parts of theories get discarded (e.g., ether), others retained (e.g., Maxwell's equations). Conclusion: Be careful about *which* claims you realist about.

  4.  **Evaluating Defensibility and Licensing Dismissal:**
      *   *Variation 1 (Global):* Historically inaccurate (some past terms *did* refer, e.g., electrons, genes). Induction is weak because the sample is biased (we only remember the overturned ones). *Verdict:* Indefensible as a wholesale dismissal tool.
      *   *Variation 2 (Structural):* Defensible historically (Fresnel's ether vs. light waves). *Verdict:* Doesn't license dismissing the Standard Model's *predictions* or *structure*, only its specific ontology. Doesn't help the friend dismiss the proton claim entirely.
