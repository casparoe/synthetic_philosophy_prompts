          *   *Identical observations, identical posteriors?* If the model is $P(Z|X)$, then yes, identical $X$ yields identical $P(Z|X)$. Disjunctivism rejects the idea that experience *is* the posterior $P(Z|X)$. It claims experience is a relation to $Z$ (in the good case).
      *   *Translation:* Disjunctivism posits a mixture of two *architecturally distinct* inference mechanisms.
