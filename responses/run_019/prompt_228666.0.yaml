answer: |-
  **OMNIBAYESIAN CAPITAL MANAGEMENT LLC**
  **INTERNAL POLICY MANUAL // SECTION 4.2**
  **SUBJECT: EPISTEMIC HYGIENE AND TRADE JUSTIFICATION PROTOCOLS**
  **EFFECTIVE DATE: IMMEDIATELY UPON COMMON KNOWLEDGE ACQUISITION**

  **1.0 Pre-Employment Prior Verification**
  All prospective analysts must undergo the Common Prior Assessment (CPA) prior to the issuance of an offer letter. Candidates will be presented with a standardized dataset (historical equity returns, macroeconomic indicators, and cafeteria menu pricing) and asked to generate a posterior probability distribution. Any candidate whose posterior deviates from the Firm Prior by more than 0.05% will be disqualified on the grounds of epistemic incompatibility.

  Candidates who successfully match the Firm Prior but express willingness to take the opposite side of the Firm's current open positions during the interview process present a recursive hiring paradox. Per Milgrom-Stokey Guidelines, such willingness implies the candidate possesses private information detrimental to the Firm. Consequently, these candidates will be hired immediately but placed on indefinite gardening leave without access to market data. Candidates who refuse to take the opposite side are deemed to lack conviction and will be referred to Competitor Firms with a neutral reference.

  **2.0 The Mandatory Convergence Protocol (MCP)**
  "Agreeing to disagree" is classified as a Level 4 HR Violation, comparable to insider trading or harassment. In the event two employees hold divergent posteriors regarding any asset valuation, market direction, or lunch ordering preference, they must initiate the Mandatory Convergence Protocol.

  2.1 **Procedure:** The disputing parties shall enter a soundproofed conference room (the "Aumann Room"). Party A shall announce their current posterior. Party B shall update their belief based on this announcement and announce their new posterior. This cycle shall repeat until variance reaches zero.

  2.2 **Adjudication:** If convergence is not achieved within four (4) hours, Compliance will intervene. Both parties will be presumed to be withholding private information. Both employees will be terminated simultaneously to preserve the integrity of the Common Knowledge pool. Note: Employees are discouraged from holding private information. All information must be emailed to `all-staff@omnibayesian.com` with the subject line "COMMON KNOWLEDGE UPDATE" within five minutes of acquisition.

  **3.0 External Counterparty Irrationality Documentation**
  The Firm acknowledges that executing a trade with an external counterparty violates the No-Trade Theorem unless the counterparty is irrational, misinformed, or acting on non-profit motives (e.g., hedging liquidity shocks). Therefore, every trade ticket must be accompanied by a Counterparty Epistemic Failure Report (CEFR).

  3.1 **Justification Standards:** Traders must select one of the following classifications for the counterparty:
  *   **Class A:** Noise Trader (randomized strategy).
  *   **Class B:** Irrational Exuberance (behavioral bias detected).
  *   **Class C:** Forced Liquidation (counterparty is insolvent).

  3.2 **Liability:** If a trade results in a loss, the originating trader must submit an addendum explaining why the counterparty's irrationality was misclassified. Repeated misclassification of a counterparty as "Class A" when they are actually "Class D: Better Informed Than Us" will result in revocation of trading privileges.

  **4.0 Dutch Book Arbitrage**
  Internal betting pools are strictly prohibited. Any combination of employee positions that exposes the Firm to a guaranteed loss regardless of market outcome (a Dutch Book) will be interpreted as an attempt to extract liquidity from the Firm's risk management system. Employees found constructing Dutch Books against the Firm will be prosecuted to the fullest extent of secular and Bayesian law.

  ***

  *Footnote 1: General Counsel has noted that Section 2.2 (simultaneous termination) may violate local labor laws regarding wrongful dismissal, and Section 3.1 (labeling counterparties as irrational) may expose the Firm to defamation lawsuits if filed incorrectly. Compliance has reviewed these objections and determined that labor laws and defamation statutes rely on outdated legal priors that do not account for modern information economics. The policies herein supersede external legal frameworks based on the assumption that rational actors will not sue if they understand the game theoretic inevitability of their own loss. GC to update priors accordingly.*
