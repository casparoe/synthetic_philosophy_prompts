          *   *Intensional Precision (The Distinctions):* Imagination (sensory) vs. Conception (propositional). Coherence vs. Truth.
          *   *Epistemic Norms (The Standards):* Idealization vs. Actual cognition. Defeaters (empirical/conceptual).
          *   *Modal Strength (The Conclusion):* Direct entailment vs. Prima facie evidence.

      *   **Motivating Considerations:** Why do we need each desideratum? To avoid skepticism, to avoid modal error, to respect human limitations.

      *   **Non-Negotiables vs. Camp Assumptions:**
          *   *Non-Negotiable:* Must explain *why* some conceivings fail (e.g., round squares). Must account for a posteriori necessities.
          *   *Camp Assumptions:* Idealization levels (maximal vs. bounded), the nature of "primary intension," whether modality is grounded in essence or conceivability.

      *   **The Trilemma (Joint Unsatisfiability):** This is crucial for a PhD prospectus. It shows depth.
          *   *Broad Coverage:* All metaphysical possibilities.
          *   *Epistemic Safety:* If it says possible, it *is* possible.
          *   *Finite Applicability:* Humans can actually use it.
          *   *Argument:* If we demand safety and coverage, we need ideal conceivers (violating finite applicability). If we demand finite applicability and safety, we must restrict coverage (modal skepticism). If we demand coverage and finite applicability, we lose safety (fallibilism).

