      *   *Key Cases:* Zombies (Chalmers), H2O vs. XYZ (Kripke/Putnam), Round Squares (logical impossibility), Goldbach's Conjecture (mathematical necessity).
      *   *Key Distinctions:* Positive vs. Negative conceivability, Primary vs. Secondary intension, Imagination vs. Conception.
      *   *The Trilemma:* We want a theory that covers all modal truths (Broad Coverage), guarantees truth (Epistemic Safety), and is usable by humans (Finite Applicability). Usually, you can only pick two.
      *   *Structure:* Intro -> Brainstorm -> Desiderata (categorized) -> Tensions/Trilemmas -> Assessment of existing frameworks.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the tone. Academic, rigorous, supportive but critical. Acknowledge the centrality of the conceivability-possibility link.

      *   **Brainstorm:** Keep it brief but dense. Mention the historical tension (Rationalism vs. Empiricism), the Kripkean turn (a posteriori necessity), and the contemporary landscape (2D semantics, modal skepticism).

      *   **Formulating Desiderata:** This is the core. I need to group them logically.
