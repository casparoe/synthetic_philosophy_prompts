          5.  Scenario A: What changes under full-blooded Anti-Reductionism?
          6.  Scenario B: What changes under thoroughgoing Reductionism?

  2.  **Analyze the Legal/Epistemic Landscape:**

      *   *The Hearsay Rule (FRE 801/802):* Out of court statements offered for the truth of the matter asserted are inadmissible.
      *   *Rationale:* The "Triad of Testimonial Dangers" (Perception, Memory, Narration, Sincerity). Cross-examination is the engine to test these.
      *   *The Exceptions (FRE 803/804):* Many rely on circumstantial guarantees of trustworthiness (e.g., excitement reduces likelihood of fabrication; dying declaration assumes solemnity).
      *   *Epistemic Status:* The law isn't pure epistemology; it's *adversarial* epistemology. It cares about *procedural* reliability as much as *substantive* reliability.

  3.  **Address the Philosophical Framework (Reductionism vs. Anti-Reductionism):**

      *   *Reductionism (Humean):* Testimony is not a fundamental source. I need positive reasons to believe you (past reliability, corroboration).
      *   *Anti-Reductionism (Reidian):* Testimony is a fundamental source. I am entitled to believe you unless I have a reason not to (defeaters).
      *   *The Law's Stance:* The law is *institutionally reductionist* but *pragmatically hybrid*. It assumes testimony is *dangerous* unless processed through the legal machine (oath, cross, demeanor). However, the exceptions suggest that under certain conditions, the "machine" isn't needed because the context guarantees reliability (which sounds anti-reductionist in a way—trusting the *situation* rather than the *process*). Actually, it's more accurate to say the law treats testimony as *potential evidence* that requires *validation*, not as *knowledge* until validated.

  4.  **Drafting the Reconstruction (Task 1 & 2):**

      *   *Implicit Epistemology:* "Procedural Reliabilism." It's not just about the content; it's about the *process* of generation and verification.
      *   *Reductionist or Anti?* It's closer to Reductionism. The law does *not* grant default status to testimony. A witness takes the stand, but their word isn't "true" until tested. Hearsay is excluded precisely because the reductionist conditions (cross-examination) aren't met.
      *   *The Twist:* The exceptions. Why allow dying declarations? Because the *context* provides the reductionist evidence of reliability (people don't lie before God/death). So it's not pure Reductionism (which might demand independent corroboration); it's "Contextual Reductionism."
      *   *Consistency:* It's a compromise. It prioritizes *adversarial testing* over *raw truth*. Sometimes truth is sacrificed for procedure (excluding reliable hearsay because the witness is unavailable).

  5.  **Drafting the Scenarios (Task 5 & 6):**

      *   *Scenario A: Full Anti-Reductionism (Reidian Trust).*
          *   Change: Hearsay rule vanishes. "X told me Y" is admissible.
          *   Burden: Shifts to the opponent to prove it's false (defeaters).
          *   Result: Trials become faster, but potentially more prone to rumor chains. The jury becomes a passive recipient of testimony rather than an active evaluator of process.
      *   *Scenario B: Thorough Reductionism (Humean Skepticism).*
          *   Change: Even in-court testimony needs corroboration. "I saw the light" isn't enough; need video or another witness.
          *   Burden: Massive. Almost nothing gets in without physical evidence.
