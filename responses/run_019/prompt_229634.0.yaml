prompt: |-
  I TA for an undergrad political philosophy course, and for the session on dirty hands in politics the prof has banned me from lecturing -- she wants the ~20 students (75 minutes, one session) to run into the problem themselves before anyone names it. Design me a runnable activity. My rough idea: split them into small groups running a fictional city government through a crisis (a credible terrorist threat, or an epidemic, you pick whichever makes for better decisions), where they face a sequence of escalating choices. Each individual choice should be one a reasonable person could defend -- lying to the public to prevent a panic, letting an innocent low-level official take the fall, cutting a deal with someone awful -- but I want the design arranged so the defensibility decays slowly enough that they don't notice how far they've slid. Crucially, have each group keep a written ledger of everythign they authorized, without telling them why, so the reveal at the end is them reading their own record back. I'd also like a second phase where groups swap: each group becomes a tribunal reviewing another group's ledger and has to issue a verdict, so they feel the weird asymmetry between judging from the outside and choosing from the inside -- ideally at least one group condemns another group for a decision they themselves made earlier in the run.

  A few requirements. First, the target insight I want them to arrive at experientially is not "should you do the bad thing" but the stranger claim that an action can be the right thing to do and still leave something behind -- that even students who stand by every decision should find their own tally sheet ugly to read, and the debrief should dig into what that leftover feeling is and whether a good politician ought to feel it or has a duty to learn not to. Second, if you can fit it in the time, I'd love a mechanic that contrasts one decision made by a single named "mayor" with the identical decision made by anonymous committee vote, because I suspect the diffusion changes how dirty anyone feels while changing nothing about the dilemma itself, and that gap is interesting. Third, the debrief section should map specific moments of the activity onto the conceptual structure (how this differs from an ordinary tragic tradeoff, what the "moral remainder" is supposed to be, where a pure utilitarian would deny there's any problem at all and what to say to them).

  Also tell me what will predictably go wrong the first time I run it -- students gaming the scenario, contrarians who relish authorizing everything, groups that refuse to take the fiction seriously, that kind of thing -- and how to handle each. And be honest about the one thing a classroom game obviously can't reproduce (real stakes, real guilt, real consequences) and what I as facilitator need to supply to compensate for that. No upfront explanation of the concept; they should only hear the phrase "dirty hands" after the debrief has already happend.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Role:** TA for an undergrad political philosophy course.
      *   **Topic:** Dirty Hands in Politics (Walzer, etc.).
      *   **Constraint 1 (Pedagogical):** No lecturing upfront. Students must encounter the problem experientially before naming it.
      *   **Constraint 2 (Time/Size):** ~20 students, 75 minutes total.
      *   **Constraint 3 (Activity Structure):** Small groups running a fictional city government through a crisis. Escalating choices (defensible individually, ugly collectively). Written ledger required. Second phase: Tribunal/Swap (judge another group's ledger).
      *   **Target Insight:** Not "is the bad thing right?" but "the right thing leaves a stain" (moral remainder). Even if they stand by decisions, the tally sheet should look ugly.
      *   **Specific Mechanic:** Contrast single "Mayor" decision vs. anonymous committee vote (diffusion of responsibility).
      *   **Debrief Requirements:** Map activity to concepts (tragic tradeoff vs. dirty hands, moral remainder, utilitarian objection).
      *   **Risk Assessment:** Predict what will go wrong (gaming, contrarians, disengagement) and how to fix it.
      *   **Limitation Acknowledgement:** Acknowledge what the game *can't* do (real stakes/guilt) and how the TA compensates.
      *   **Forbidden:** Do not use the phrase "Dirty Hands" until the very end.

  2.  **Deconstruct the Timeline (75 Minutes):**

      *   Intro/Setup: 5 mins
      *   Phase 1 (Crisis Management): 25 mins
      *   Phase 2 (Tribunal/Swap): 15 mins
      *   Phase 3 (Debrief/Discussion): 30 mins
      *   *Total:* 75 mins. (Tight, need to be precise).

  3.  **Develop the Scenario (The "Crisis"):**

      *   *Option A: Terrorist Threat.* High stakes, potential for torture/lying. A bit cliché.
      *   *Option B: Epidemic.* Very relatable post-2020. Involves lying about numbers, restricting freedoms, sacrificing vulnerable groups for herd immunity.
      *   *Selection:* **Epidemic (The "Red Fog")**. It allows for bureaucratic, cold-blooded decisions that feel "necessary" but dehumanizing. It fits the "public health vs. civil liberty/truth" tension well.

  4.  **Design the Decision Sequence (The "Slide"):**

      *   Need 4-5 rounds.
      *   Round 1: Mild deception (White lie).
      *   Round 2: Resource allocation (Triage).
      *   Round 3: Scapegoating/Blame shifting.
      *   Round 4: Coercion/Deal with a criminal element.
      *   *Mechanic Integration:* One round must be a "Mayor's Prerogative" (individual) vs. "Council Vote" (group). Let's make Round 3 the individual one to isolate the feeling of personal agency.

  5.  **Design the Ledger:**

      *   Simple table: Decision #, Action Taken, Justification, Signed By.
      *   Crucial: They must keep it hidden until the swap.

  6.  **Design the Tribunal Phase:**

      *   Groups swap ledgers.
      *   Task: Issue a "Public Trust Verdict" (Guilty/Not Guilty of Betrayal).
      *   Goal: Create the asymmetry (Judging vs. Doing).

  7.  **Drafting the Activity Steps (Iterative refinement):**

      *   *Intro:* Keep it dry. "You are the Emergency Council."
      *   *Rounds:* Present via slides or handouts. Time-box each round strictly (4-5 mins).
      *   *The "Mayor" Mechanic:* In Round 3, tell groups to pick *one* person to sign off. Everyone else abstains. This creates the contrast.
      *   *The Swap:* 5 mins to read, 10 mins to deliberate verdict.
      *   *The Debrief:* This is where the philosophy happens.

  8.  **Addressing the Target Insight (Moral Remainder):**

      *   The debrief questions need to probe the *feeling* of reading the ledger. "Did you change your mind?" vs. "Does it look different on paper?"
      *   Need to distinguish between "Tragic Choice" (Sophie's Choice) and "Dirty Hands" (violating a norm to save the state).

  9.  **Risk Assessment & Mitigation:**

      *   *Gaming:* Students treating it like SimCity. *Fix:* Enforce the "Ledger" as a legal document.
      *   *Contrarians:* "We torture everyone." *Fix:* Require a "Public Statement" justification for each decision. If it's too outrageous, they can't justify it publicly.
      *   *Disengagement:* "This is silly." *Fix:* High pressure timing.
      *   *The "Utilitarian" Student:* "If it saved lives, it's good." *Fix:* Save this for the debrief as a specific counter-point.

  10. **Refining the "What the Game Can't Do" Section:**

      *   Real guilt requires real harm.
      *   Compensation: The TA needs to lean into the *gravity* of the language during the debrief. Don't let them laugh off the "ugliness." Validate the discomfort.

  11. **Review against Constraints:**

      *   No "Dirty Hands" phrase until end? Yes.
      *   Mayor vs. Committee mechanic? Yes (Round 3).
      *   Tribunal Swap? Yes.
      *   Debrief mapping? Yes.
      *   Time check? 75 mins is tight. I need to make sure the decision rounds are fast. 4 rounds x 4 mins = 16 mins + setup + swap + debrief. Okay.

  12. **Final Polish:**

      *   Make the scenario specific (City of Oakhaven, Red Fog Virus).
      *   Ensure the "Ledger" instructions are clear.
      *   Write the debrief script carefully to guide from experience to theory.

  *(Self-Correction during drafting)*: I initially thought about having them write a press release. That might take too long. Better to just have them write the "Justification" in the ledger. It keeps the focus on the *record*.
  *(Self-Correction on Mayor Mechanic)*: To make the contrast sharp, the "Mayor" round should happen *before* the swap, but the debrief needs to highlight the difference between the person who signed and the group that watched. I will instruct groups to designate a "Crisis Mayor" for Round 3 only.

  *(Final check on time)*:
  0-5: Setup.
  5-25: Crisis Rounds (4 rounds, 5 mins each).
  25-40: Tribunal Swap (15 mins).
  40-75: Debrief (35 mins).
  This works.

