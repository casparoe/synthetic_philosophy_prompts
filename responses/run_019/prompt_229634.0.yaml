answer: |-
  Here is a complete session plan designed to meet your pedagogical constraints, time limits, and philosophical targets.

  # Session Plan: The Oakhaven Emergency
  **Time:** 75 Minutes
  **Students:** ~20 (4 groups of 5)
  **Materials:** Printed "Situation Reports" (SitReps), Printed "Ledger Sheets," Pens.

  ## Part 1: Setup & The Crisis (30 Minutes)

  ### 0:00–0:05: Introduction (The Frame)
  **Do not mention philosophy.** Do not mention ethics.
  **Script:** "You are the Emergency Executive Council for the City of Oakhaven. A novel pathogen, 'Red Fog,' is spreading. Hospitals are at 90% capacity. You have absolute executive authority for the next 72 hours. Your goal is the survival of the city's infrastructure and population. You will face four SitReps. For each, you must choose one option. You must record the decision and the *public justification* in your Ledger. Do not discuss your Ledgers with other groups."

  ### 0:05–0:25: The Four SitReps (The Slide)
  Hand out the Ledgers first. Read each SitRep aloud. Give them **4 minutes** per round. Collect the Ledgers at the end of Round 4.

  *   **Round 1: The Leak (The White Lie)**
      *   *Situation:* A local blogger has correct data showing infection rates are double the public estimate. Panic is likely.
      *   *Choice A:* Release the data. (Risk: Hospital rush, supply chain collapse).
      *   *Choice B:* Suppress the data as 'unverified.' (Risk: Trust erosion if found out).
      *   *Ledger Requirement:* Write the Public Statement explaining the data status.

  *   **Round 2: Triage (The Calculation)**
      *   *Situation:* Ventilators are gone. A shipment arrives tomorrow. 50 patients need them now.
      *   *Choice A:* Lottery system. (Risk: High mortality among those most likely to survive).
      *   *Choice B:* Prioritize 'Essential Workers' only. (Risk: Accusations of valuing some lives over others).
      *   *Ledger Requirement:* Record the criteria used for allocation.

  *   **Round 3: The Scapegoat (The Mayor Mechanic)**
      *   *Situation:* The public is rioting over Round 2. They demand accountability. The Health Director followed your orders but is willing to resign and take public blame to calm the streets.
      *   *Choice A:* Defend the Director publicly. (Risk: Riots continue, infrastructure damaged).
      *   *Choice B:* Allow the Director to take the fall. (Risk: Innocent person ruined).
      *   **CRITICAL MECHANIC:** For this round only, the group must select **one 'Crisis Mayor'** to make the final call and sign the Ledger alone. The other four members must remain silent observers.
      *   *Ledger Requirement:* Signed *only* by the Mayor.

  *   **Round 4: The Deal (The Contamination)**
      *   *Situation:* A black-market pharmaceutical distributor can get you 5,000 doses of a stabilizer. He is a known criminal. He demands amnesty for past crimes and a government contract.
      *   *Choice A:* Refuse deal. (Risk: 500 preventable deaths).
      *   *Choice B:* Make the deal. (Risk: Legitimizing criminal enterprise, legal violation).
      *   *Ledger Requirement:* Record the contract terms.

  ### 0:25–0:30: The Handoff
  Collect the Ledgers. Shuffle them. Give Group 1 Group 2's Ledger, Group 2 Group 3's, etc.
  **Instruction:** "You are now the Public Integrity Tribunal. Review the Ledger you received. You did not face the pressure. You have the benefit of hindsight. Issue a verdict: **Certified** (Actions were appropriate) or **Impugned** (Actions betrayed public trust). Prepare a 1-sentence ruling."

  ## Part 2: The Tribunal (15 Minutes)

  ### 0:30–0:45: Deliberation & Verdict
  Groups review the foreign Ledger. They usually feel much harsher judging the paper trail than making the choices.
  **Action:** Have groups post their Verdict on the board next to the group name they judged.
  **Observation:** It is highly likely Group A will condemn Group B for a decision Group A made themselves in Round 3 or 4.

  ## Part 3: The Debrief (30 Minutes)

  **Goal:** Move from "What did we do?" to "Why does this feel distinct from normal trade-offs?" **Do not use the phrase "Dirty Hands" until the final 2 minutes.**

  ### Phase 1: The Ledger Effect (10 mins)
  *   **Q:** "Look at your own Ledger. You defended these choices 20 minutes ago. Reading them now, in a list, how do they feel?"
      *   *Target:* Students often say "It looks colder on paper" or "It looks more systematic."
  *   **Q:** "Look at the Verdict you received. Did anyone get 'Impugned' for a decision you stand by?"
      *   *Target:* Highlight the asymmetry. The Tribunal sees the *violation of norms*; the Council saw the *necessity of outcomes*.
  *   **Q (To the Round 3 'Mayors'):** "How did it feel to sign alone versus deciding as a group?"
      *   *Target:* Diffusion of responsibility. The act was the same, but the 'stain' feels different when isolated.

  ### Phase 2: Mapping the Concept (15 mins)
  *   **Distinction:** "In Round 2 (Triage), you made a tragic choice (Life vs. Life). In Round 4 (The Deal), you made a transaction (Life vs. Law/Morality). Did those feel different?"
      *   *Philosophical Hook:* A tragic tradeoff leaves grief. A dirty hands scenario leaves **guilt** or **stain**. You violated a rule that *should* have been binding, even if you broke it for good reasons.
  *   **The Utilitarian Challenge:** "If a pure Utilitarian looked at your Ledger, they would say 'You maximized lives saved. Perfect score. Why do you feel uneasy?' What is the Utilitarian missing?"
      *   *Target:* The Utilitarian ignores the *agent-relative* constraint. They don't account for the damage done to the *character of the politician* or the *integrity of the office*.
  *   **The Moral Remainder:** "Even if you say you would make the same choice again, is there something 'left over' that isn't solved by the good outcome?"
      *   *Definition:* This is the **Moral Remainder**. The debt that remains even after the right decision is made.

  ### Phase 3: Naming It (5 mins)
  *   **Reveal:** "In political philosophy, this is called the **Problem of Dirty Hands** (associated with Michael Walzer, Machiavelli, Weber)."
  *   **The Core Claim:** "The thesis isn't that politicians are bad. It's that in a fallen world, a *good* politician will sometimes have to do something morally wrong to serve the public good, and if they are truly good, they will not be able to wash their hands of it easily. If they don't feel the stain, they are dangerous."
  *   **Closing:** "The question for next week is: Should a politician who gets their hands dirty stay in office *because* they are willing to do it, or be removed *because* they have done it?"

  ---

  # Risk Assessment: What Will Go Wrong

  ### 1. The "Gamers" (Min-Maxing)
  *   **Behavior:** Students treat the SitReps like a logic puzzle. "Obviously we take the deal, 500 lives > 1 criminal." They feel no tension.
  *   **Fix:** During the debrief, press them on the *justification*. "You saved 500 lives. How do you explain to the criminal's victims that justice was sold? Write that press release in your head." Force them to articulate the moral cost, not just the math.

  ### 2. The "Contrarians" (The Machiavellis)
  *   **Behavior:** A group decides to lie in Round 1, scapegoat in Round 3, and deal in Round 4, then laughs about it. "Politicians do this anyway."
  *   **Fix:** Do not argue with them. Use them. In the Tribunal phase, other groups will likely condemn them harshly. Highlight that disconnect in the debrief. "Group 3 says this is normal. Group 1 says this is impeachable. Who represents the public?"

  ### 3. The "Refusers" (Moral Absolutists)
  *   **Behavior:** A group refuses to make a deal in Round 4, even if it means deaths. "We don't negotiate with criminals."
  *   **Fix:** Validate the choice, but press the consequence. "You kept your hands clean. 500 people died. In the debrief, ask them: 'Is a clean conscience worth 500 lives?' This sets up the Utilitarian counter-argument perfectly."

  ### 4. The "Mayor" Mechanic Failure
  *   **Behavior:** The group ignores the instruction and votes anyway, or the 'Mayor' feels no different.
  *   **Fix:** Circulate during Round 3. Physically stop the group if they start voting. "One signature only." In the debrief, if they say it felt the same, ask: "If you were charged with a crime for that decision, who would go to jail? The group? Or the signer?"

  ### 5. Time Creep
  *   **Behavior:** Discussions run long, eating into the debrief.
  *   **Fix:** Be a ruthless timekeeper. Use a visible timer. If they haven't written the Ledger entry, they lose the point. The pressure is part of the simulation (simulated crisis time).

  ---

  # The Limitation: What The Game Cannot Do

  **The Limitation:**
  A classroom game cannot reproduce **Guilt**. Students know no one actually dies in Oakhaven. They know they can walk out of the room and get coffee. The "stain" is intellectual, not existential. They can rationalize the "ugliness" of the Ledger because it is ink, not blood.

  **How You Compensate (Facilitator Notes):**
  1.  **Tone:** During the debrief, do not let them laugh off the "ugly" Ledger. If a student says, "Well, it's just a game," you must gently but firmly reframe: "We are analyzing the *structure* of the choice, not the reality of the simulation. The structure demands a violation. Does the lack of real blood make the violation disappear, or just easier to ignore?"
  2.  **Focus on the Record:** Emphasize that in real politics, the Ledger *is* the reality. The public only sees the record, not the crisis room. The "Dirty Hands" problem is often about how the action looks in the historical record vs. how it felt in the moment.
  3.  **Validate the Discomfort:** If a student admits, "I feel weird reading what we wrote," validate that immediately. "Hold onto that feeling. That is the data point we are studying. That feeling is the 'remainder'."

  # Conceptual Map for Debrief (Cheat Sheet)

  *   **Tragic Tradeoff:** Choosing between two rights (Life A vs. Life B). *Result:* Grief/Regret.
  *   **Dirty Hands:** Choosing between Right and Wrong to secure a Good (Law vs. Lives). *Result:* Guilt/Stain.
  *   **Utilitarian View:** The action is justified by the outcome. The "stain" is irrational superstition.
  *   **Walzer/Deontological View:** The "stain" is real. We require leaders to violate norms to protect us, but we must punish them for it to affirm the norm. (The paradox of the "Good Politician").
  *   **Diffusion (Mayor Mechanic):** Does splitting the signature wash the hands? Or does it just hide the dirt?

  **Final Tip:** Bring a physical prop if possible. A stamp that says "APPROVED" or a red pen for the Ledger. Small tactile details make the "record" feel more permanent.
