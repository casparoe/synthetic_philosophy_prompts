answer: |-
  **TO:** Student Conduct Board
  **FROM:** Faculty Chair
  **RE:** Recommendation on Draft Sanctioning Policy

  The debate over the Dean's draft policy presents a false dichotomy between a purely forward-looking quarantine model and a metaphysically loaded retributivism. We need neither the sterile medicalization of academic integrity nor a commitment to libertarian free will. I recommend we **reject the Dean's draft in favor of a modified "Responsibility-Educative" framework.** This approach retains the vocabulary of blame and desert while integrating robust rehabilitative sanctions, grounded in a compatibilist understanding of agency.

  **The Case Against Pure Quarantine**
  The Dean's draft, drawing on Gregg Caruso's public health model, argues that sanctions are justified only by future risk mitigation, not past wrongdoing. This is the strongest argument for the draft: it avoids the moral hazard of inflicting suffering based on contested metaphysics. However, in the context of academic misconduct, the analogy fails. A carrier of tuberculosis poses a physical threat to anyone nearby, regardless of their own precautions. A plagiarist, by contrast, poses no danger to a student who takes reasonable care with their own citations.

  The risk plagiarism poses is not viral infection but *normative erosion*. If we treat cheating solely as a pathology requiring management, we strip the act of its moral significance. A chronic plagiarist is not merely a vector of risk; they are a participant in a community of trust who have violated constitutive norms. To treat this solely as a need for "supervised study" ignores the communicative function of sanctions. Without censure, the university fails to affirm the value of the work students who *do* cite correctly are producing. Forward-looking incapacitation becomes merely retribution in disguise if it ignores the specific normative breach that triggered the intervention.

  **Responsibility Without Libertarianism**
  My colleague's Dennettian objection is correct that abandoning blame erodes the incentive structures of responsibility. However, her defense risks implying that desert requires contra-causal freedom. It does not. We can legitimize blame and censure without presupposing libertarian free will. On a compatibilist view, an agent is responsible if they are reasons-responsive. When we sanction a student, we are not meting out cosmic justice for a metaphysical choice; we are engaging in a moral conversation with a rational agent.

  Blame is a tool to signal that a norm has been violated and to invite the offender to recognize the reasons they ignored. To purge language of "desert" is to treat students as objects to be managed rather than agents to be addressed. We hold students responsible because they are capable of understanding and acting on the reasons scholarship requires, not because they are unmoved movers. Therefore, language of "accountability" and "violation" must survive.

  **The Educative Mission**
  Both camps claim the educative mission. The Dean's draft emphasizes skill-building (how to cite); the traditional model emphasizes moral instruction (why honesty matters). For our context, the moral instruction claim is more plausible. Technical deficits can be addressed through tutoring without conduct sanctions. Conduct sanctions are necessary when the issue is not *ability* but *valuation*.

  If a student plagiarizes, they have not merely failed a mechanical task; they have prioritized expediency over integrity. A sanction that frames this purely as a skill deficit insults the student's moral agency. Therefore, sanctions must communicate that the behavior was *wrong*, not just *risky*.

  **Concrete Recommendations**
  To operationalize this, I propose the following modifications to the Dean's draft:

  1.  **Language:** Purge the term "punishment," which implies gratuitous suffering. However, **retain** terms like "violation," "sanction," "responsibility," and "accountability." Do not adopt the "quarantine" or "public health" framing. The policy should state that sanctions are imposed *because* a student is responsible for a violation, not merely *while* they pose a risk.
  2.  **Sanctions:**
      *   **First Offense:** Mandatory "Academic Integrity Workshop" (rehabilitative) combined with a formal Letter of Censure placed in the conduct file (retributive/communicative). The letter must explicitly state the student *deserved* this sanction due to their choice.
      *   **Repeat Offense:** Restricted course enrollment (incapacitative) and Probation. Probation must be framed as a period of monitored trust, not merely medical observation.
  3.  **Communication to Students:** When notifying students of sanctions, we will state: "You are being sanctioned because you chose to violate the community's standards." We will add: "This sanction is designed to help you realign with those standards, but it is imposed as a consequence of your breach of trust."

  This hybrid model respects the determinist insight that we are products of our environment, without surrendering the normative practices that make us a university. We must treat students as agents capable of guilt and growth, not merely as vectors of risk.

  I look forward to discussing this synthesis at our next meeting.
