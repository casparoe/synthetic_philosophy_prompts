          *   (e) Sustainability: 15 pts (The practical limit).
          *   (c) Empirics: 15 pts (The trigger).
          *   (f) Publicity: 10 pts (The social dimension).
          *   *Total:* 100.

      *   *Refinement:* Let's look closer at the friend's specific claim: "it merely observes that moral demands can be costly or unpleasant."
      *   To defeat this, I need to emphasize that the objection isn't about *cost* (c), but about *identity* (b, d) and *structure* (a, e).
      *   (d) is definitely the linchpin. If we don't assume morality needs to leave room for autonomy, then "it's too hard" is just a complaint, not a philosophical refutation.
      *   (b) is the specific *way* AC violates (d).
      *   (a) is what makes AC AC.
      *   (c) makes it urgent.
      *   (e) makes it a life-plan issue.
      *   (f) makes it a social issue.

      *   *Revised Allocation:*
          *   (d) 30 points. It transforms "hard" into "illegitimate."
          *   (b) 20 points. It specifies *what* is lost (integrity/projects).
          *   (a) 15 points. It defines the relentless nature of the demand.
          *   (e) 15 points. It shifts from single acts to a life lived.
          *   (c) 10 points. Empirics change; the structural objection should remain.
          *   (f) 10 points. Important, but secondary to the agent-centered critique.

  4.  **Drafting the Explanations:**
      *   Need to be concise (1-2 sentences).
      *   Need to ensure they justify the weight relative to the "strongest form."

  5.  **Determining the Verdict (The Linchpin):**
      *   Which element, if removed, makes the objection collapse into "just a complaint about unpleasantness"?
      *   If you remove (c) [Empirics], the theory is still demanding in principle, just not currently activated. The objection remains theoretical.
      *   If you remove (a) [Maximization], it becomes satisficing, and the objection loses its target. But the prompt asks about the objection to *act-consequentialism*, so (a) is fixed by the target.
      *   If you remove (d) [Autonomy/Integrity assumption], then the fact that AC destroys your projects is irrelevant. Morality *just is* overriding. Without (d), the objector has no ground to stand on other than "I don't like it."
      *   Therefore, (d) is the linchpin. It provides the normative standard by which AC is judged defective.

  6.  **Refining the Verdict Argument:**
      *   Why does the friend's claim fail? Because the friend thinks the objection is "This costs me too much." The real objection (via d) is "A moral theory that requires me to abandon my constitutive projects is conceptually incoherent or alienating." It's about the *nature* of morality, not the *price* of it.

  7.  **Final Review against Constraints:**
