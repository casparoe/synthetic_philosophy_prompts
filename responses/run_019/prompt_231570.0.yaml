      Let's finalize the text.

      *Verdict:* Element (d). Without the normative claim that morality *must* accommodate integrity, the observation that AC is demanding is merely a report of difficulty, not a criticism of validity. The friend's diagnosis fails because it conflates the *phenomenology* of cost with the *normative conclusion* that such cost is illegitimate.

      *Wait, one more check:* Is (a) more fundamental? If AC wasn't maximizing, it wouldn't be demanding. But the prompt asks about the *objection's force*, not the *theory's structure*. The force comes from why the structure is bad. So (d) remains the best candidate for the linchpin of the *objection*.

