  # Seminar Handout: Mapping the Franchise
  **Course:** Political Philosophy 305 | **Topic:** Democratic Accountability and the Vote

  ### Instructions
  This decision tree begins from the shared premise that a democratic government must be accountable to "the people." It does not presuppose any specific theorist. Answer each question based on your own moral intuitions and logical commitments. Follow the branches to discover which established (or novel) position on the franchise matches your view.

  ### The Decision Tree

  **Node 1:** Consider a non-citizen who has resided legally for a decade and pays income tax. Does their subjection to the law grant them a claim to vote equal to a citizen's?
  *   **Yes** → Go to Node 4.
  *   **No** → Go to Node 2.

  **Node 2:** Consider a seventeen-year-old who pays income tax. Is their age a decisive barrier to voting, or merely a proxy for competence?
  *   **Decisive Barrier** → Go to Node 4.
  *   **Proxy for Competence** → Go to Node 3.

  **Node 3:** If age is only a proxy, should political competence be presumed in all residents or verified through testing?
  *   **Presumed** → Go to Node 4.
  *   **Verified** → Go to Node 4. *(Note: This path leads to Epistocracy)*.

  **Node 4:** Is voting primarily an individual right to be exercised or a public function to be performed?
  *   **Individual Right** → Go to Leaf Group A.
  *   **Public Function** → Go to Node 5.

  **Node 5:** Consider the analogy between voting and jury service. If voting is a public function, must participation be legally enforced?
  *   **Yes** → Go to Leaf Group B.
  *   **No** → Go to Leaf Group A. *(Note: This path leads to voluntary duty)*.

  ---

  ### The Leaves (Positions)

  #### Leaf Group A: Voluntary Participation (Right or Unenforced Duty)

  **1. The Liberal Status Quo**
  *   **Path:** No (Node 1) → Barrier (Node 2) → Right (Node 4).
  *   **Position:** Adult citizens vote voluntarily.
  *   **Most Awkward Commitment:** It must accept that systematic non-voting by specific demographics does not constitute a failure of democratic accountability.
  *   **Note:** *This leaf is practically indistinguishable from Leaf 2 (Civic Republicanism), as both result in voluntary voting.*

  **2. Civic Republicanism (Voluntary)**
  *   **Path:** No (Node 1) → Barrier (Node 2) → Function + No (Node 5).
  *   **Position:** Adult citizens ought to vote as a duty, but without legal penalty.
  *   **Most Awkward Commitment:** It asserts a moral obligation to vote while refusing the state the tools to ensure that obligation is met.
  *   **Note:** *This leaf is practically indistinguishable from Leaf 1 (Liberal Status Quo), as both result in voluntary voting.*

  **3. Residence-Based Enfranchisement**
  *   **Path:** Yes (Node 1) → Right (Node 4).
  *   **Position:** All long-term residents vote voluntarily, regardless of citizenship.
  *   **Most Awkward Commitment:** It allows individuals with primary political allegiances elsewhere to shape domestic policy without full membership in the national community.

  **4. Lowered Voting Age**
  *   **Path:** No (Node 1) → Proxy (Node 2) → Presumed (Node 3) → Right (Node 4).
  *   **Position:** Minors who meet a lower age threshold vote voluntarily.
  *   **Most Awkward Commitment:** It requires granting the franchise to individuals who may still be legally dependent on guardians for other contractual decisions.

  **5. Epistocracy**
  *   **Path:** No (Node 1) → Proxy (Node 2) → Verified (Node 3) → Right (Node 4).
  *   **Position:** Only those who demonstrate political knowledge vote, voluntarily.
  *   **Most Awkward Commitment:** It formally institutionalizes a hierarchy of political worth that contradicts the democratic principle of equality.

  #### Leaf Group B: Mandatory Participation (Enforced Duty)

  **6. Compulsory Voting (Jury-Duty Model)**
  *   **Path:** No (Node 1) → Barrier (Node 2) → Function + Yes (Node 5).
  *   **Position:** Adult citizens must vote or face penalties.
  *   **Most Awkward Commitment:** It protects the integrity of the election result by coercing the expression of preferences that may not exist.

  **7. Mandatory Residence-Based Enfranchisement (Undefended)**
  *   **Path:** Yes (Node 1) → Function + Yes (Node 5).
  *   **Position:** All long-term residents must vote or face penalties.
  *   **Diagnosis:** This combination is **simply unexplored** in mainstream literature, likely because it compounds the controversy of non-citizen voting with the coercion of compulsory voting.
  *   **Most Awkward Commitment:** It forces non-cizens to participate in a sovereign act while potentially denying them the right to hold office or remain in the country.

  **8. Mandatory Epistocracy**
  *   **Path:** No (Node 1) → Proxy (Node 2) → Verified (Node 3) → Function + Yes (Node 5).
  *   **Position:** Those who demonstrate political knowledge must vote or face penalties.
  *   **Most Awkward Commitment:** It creates a class of knowledgeable elites who are legally required to rule over those exempted from the duty due to ignorance.

  ---

  ### Instructor's Note on Indistinguishability
  Please observe that **Leaf 1 (Liberal Status Quo)** and **Leaf 2 (Civic Republicanism)** cannot be genuinely separated by electoral outcomes alone. Both result in voluntary voting; the distinction exists solely in the normative justification (right vs. unenforced duty) rather than the institutional design.
