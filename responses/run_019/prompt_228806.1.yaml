answer: |-
  **MEMORANDUM**

  **TO:** Colloquium Speaker
  **FROM:** Senior Colleague
  **RE:** Prep for "Strawson and the Institution" Talk

  I've chaired enough of these to know the rhythm of the room. You have a bold thesis, which is good; boldness invites engagement. But you are walking into a minefield of exegesis, metaphysics, and normative ethics. Your draft has circulated, and the skepticism you sensed is real. They aren't just going to ask if you're right; they're going to ask if you're *Strawsonian* enough, and if your move solves the problem or just relocates it.

  Below is your battle card. I have filtered the infinite objections down to the five you will actually face, ordered by the probability they arise and the damage they can do. I have also included the strategic concessions you need to make to survive the hour.

  ***

  ### I. The Objections (Ordered by Likelihood & Damage)

  #### 1. The "Second-Personal Address" Objection
  *   **Who:** The Strawson Specialists (Protective)
  *   **Likelihood:** 95% | **Damage:** High
  *   **The Question:** "Strawson's participant stance is fundamentally second-personal. It involves a demand for good will *from* a moral agent *to* another. When I resent a corporation, I am not addressing a 'you' capable of recognizing that demand. I am shouting at a structure. If the institution cannot *hear* the demand in the way a person does, isn't your 'institutional resentment' merely a metaphorical projection, lacking the normative force Strawson requires?"
  *   **The 2-Minute Reply:** "Strawson grounds the stance in the *nature of human relationships*, not the metaphysics of the target. We *do* address institutions second-personally: 'How could you allow this?' is not metaphorical; it is the standard grammar of public discourse. The capacity to 'hear' the demand is satisfied by the institution's capacity to respond via its decision-procedures. If a hospital can issue an apology or change a policy in response to indignation, it has satisfied the functional requirement of the participant stance. We shouldn't confuse the *mechanism* of response (neural vs. bureaucratic) with the *structure* of the relation."
  *   **Where This is Weak:** You are conflating *functional response* with *moral recognition*. A thermostat responds to temperature; a corporation responds to PR pressure. The specialist will press that without phenomenal consciousness, there is no one *home* to care about the demand, rendering the "second-personal" claim empty.

  #### 2. The "Exemption vs. Excuse" Trap
  *   **Who:** Group Agency / Collective Intentionality Scholars
  *   **Likelihood:** 80% | **Damage:** Critical
  *   **The Question:** "You claim institutions are never exempt, only excused. But consider a hospital with a completely broken reporting structure due to systemic underfunding. They literally *cannot* track moral reasons. Strawson exempts the deeply disturbed because they cannot participate in moral relations. If an institution is structurally incapable of processing moral demands, why isn't that an exemption condition? To insist on the participant stance here seems cruel, not morally robust."
  *   **The 2-Minute Reply:** "Because exempting the institution shifts us to the objective stance, treating it purely as a object of policy or repair. But we don't do that. We still hold them accountable even when broken. The 'brokenness' is an *excuse* (like coercion or ignorance), not an *exemption* (like insanity). The distinction matters: an excuse acknowledges the norm but cites a barrier; an exemption denies the applicability of the norm. We never deny the norm applies to a government agency, even a failed one. We demand they fix the structure. That demand *is* the participant stance."
  *   **Where This is Weak:** This is the hardest line to hold. If the "brokenness" is total, the distinction between "cannot comply" (excuse) and "incapable of compliance" (exemption) collapses. If you refuse to exempt, you risk making your view implausibly harsh.

  #### 3. The "Is-Ought" Gap (The Naturalistic Fallacy)
  *   **Who:** The Grad Students (The Blunt Ones)
  *   **Likelihood:** 90% | **Damage:** Medium
  *   **The Question:** "You argue that because we *do* direct reactive attitudes at institutions, we *should*. But we also direct resentment at the weather or our computers. Just because there is a psychological fact of anger doesn't mean it's appropriate. Why isn't institutional resentment just a category mistake we haven't outgrown yet?"
  *   **The 2-Minute Reply:** "Two differences. First, the weather doesn't change its behavior in response to our anger; institutions do. That feedback loop is the hallmark of the participant stance. Second, this isn't just a psychological claim; it's a claim about social ontology. Institutions are constituted by our attitudes. If we withdrew the participant stance toward corporations, they would cease to function as agents and become mere assets. The appropriateness comes from the necessity of the stance for the social reality to exist."
  *   **Where This is Weak:** The "social ontology" move is quick and dirty. They will ask if the *necessity* of a belief makes it *true* (or appropriate). This smells of pragmatism over truth.

  #### 4. The "Hard Incompatibilist" Flank Attack
  *   **Who:** The Free Will Skeptics (Pereboom vicinity)
  *   **Likelihood:** 60% | **Damage:** High (if they team up with Strawsonians)
  *   **The Question:** "You say this dissolves the puzzle of consciousness. But the manipulation argument applies to institutions just as it does to people. If an institution's 'decisions' are the result of prior causal chains (market forces, laws, incentives) it didn't choose, why is indignation appropriate? You haven't solved the free will problem; you've just scaled it up."
  *   **The 2-Minute Reply:** "Strawson's genius was to bypass the metaphysics of free will. I am extending that bypass. The skeptic asks for a justification of the practice from outside the practice. I am arguing that within the practice of holding institutions responsible, the lack of 'ultimate' origin doesn't undermine the reactive attitudes. Whether a person or a corporation is determined, the *quality of will* displayed is what triggers the attitude. I'm not solving hard incompatibilism; I'm showing it's irrelevant to the specific puzzle of *corporate* consciousness."
  *   **Where This is Weak:** You are relying on Strawson's anti-skepticism to protect your extension. If the skeptics think Strawson failed against the manipulation argument for humans, they will certainly think he fails for corporations.

  #### 5. The "Diffusion of Responsibility" (The Nuclear Option)
  *   **Who:** Everyone (but voiced by the Ethicist in the room)
  *   **Likelihood:** 40% | **Damage:** Catastrophic
  *   **The Question:** "If we treat the institution as a proper target of indignation in the same way as a person, don't we let the actual humans off the hook? If I resent the 'Hospital,' do I stop resenting the negligent administrator? Your view might validate corporate responsibility, but at the cost of obscuring individual culpability."
  *   **The 2-Minute Reply:** "Not at all. The participant stance is not a zero-sum game. Resenting the institution is often the only way to reach the individuals within it who hide behind procedure. Holding the institution responsible forces the internal allocation of responsibility. It doesn't replace individual blame; it creates the context in which individual blame becomes possible. We resent the corporation *and* the CEO. The attitudes are complementary, not competitive."
  *   **Where This is Weak:** Empirically, this is often false. Corporate liability *does* often shield individuals. You are making a normative claim that it *shouldn't*, but the audience knows the real world doesn't work that way.

  ***

  ### II. Strategic Concessions

  **What to Concede Up Front (Defuse the Attack):**
  1.  **Exegetical Humility:** Concede immediately that Strawson did not explicitly argue for this. Do not claim you are "revealing Strawson's true intent." Claim you are "generalizing Strawson's framework where he left it restricted." This stops the Specialists from spending 10 minutes quoting *Freedom and Resentment* paragraph 4 back at you.
  2.  **Phenomenal Consciousness:** Concede freely that institutions do not feel pain, shame, or joy. Do not try to argue they have a "group mind" in a spooky sense. Your claim is about the *logic of the attitude*, not the *phenomenology of the target*. If you fight this, the Group Agency people will eat you alive.

  **What NOT to Concede (The Collapse Points):**
  1.  **The Exemption Condition:** You cannot concede that institutions can ever be "exempt." If you allow that a sufficiently dysfunctional institution is exempt (like an insane person), your claim that they are *participants* collapses into a policy view. You must hold the line: Dysfunction is an *excuse*, never an *exemption*.
  2.  **The Metaphor Claim:** Do not concede that institutional resentment is "metaphorical" or "fictional." If you admit it's *as if* we resent them, you lose the normative force. You must insist it is *literal* resentment, even if the target is abstract.

  ***

  ### III. The "Secret Fear" Objection

  **The Objection:**
  *"You argue that we demonstrably do hold institutions responsible via reactive attitudes. But isn't it more accurate to say that when we feel indignation at a corporation, we are actually feeling indignation at the **unknown or unnamed individuals** within it, projected onto a placeholder? Your view relies on the idea that the institution is the *primary* target. But if we peeled back the curtain, wouldn't we find that all institutional resentment is actually individual resentment in disguise? If so, you haven't extended Strawson; you've just described a psychological error."*

  **Why It Is Dangerous:**
  This cuts the throat of your thesis. Your entire argument rests on the claim that the institution is a *sui generis* target of the participant stance. If the audience convinces themselves that institutional anger is just "misdirected individual anger," your generalization fails. It reduces your view to a mistake theory, which is exactly what you are trying to avoid. It aligns the Skeptics (it's all an illusion) with the Reductionists (it's all just individuals).

  **What To Say If It Comes:**
  "I acknowledge that individual culpability is often part of the mix. But consider cases where no specific individual is identifiable—the 'problem of many hands.' When a legacy algorithm discriminates, and no current employee wrote it or authorized it, we still resent the Company. If that resentment were just disguised individual resentment, it would have no object and would dissipate. It doesn't dissipate. It targets the *continuing agency* of the institution. The attitude persists precisely because the individual explanation fails. Therefore, the target must be the institution itself."

  **Frank Note:**
  This reply works only if the audience buys that "problem of many hands" cases are paradigmatic. If they think those are edge cases, you're in trouble. Stand firm on the idea that modern agency *is* distributed.

  ***

  **Final Advice:**
  You have 45 minutes. Spend 30 on the positive argument. Save 15 for the "Exemption vs. Excuse" distinction, because that is where the fight will be. Don't get bogged down in defining "institution." Use paradigmatic cases (Hospital, Corp). If you try to define the metaphysics of groups, you lose the room. Keep it about the *attitudes*.

  Good luck. Don't let them bully you on the exegesis. It's your talk now.
