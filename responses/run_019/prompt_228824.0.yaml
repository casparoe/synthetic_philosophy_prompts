answer: |-
  I commit to the second option: **There is no single principle.** Your friend's deflationism is correct, though her explanation ("historical accident") is slightly too thin. It is not merely an accident; it is a **conflation of two distinct value conflicts that happened to align in 1791 but have since decoupled.**

  The Left/Right distinction persists not because it tracks a single ontological reality (like "equality vs. hierarchy"), but because it tracks a historical coalition structure. In 1791, the axes of **Economic Organization** (Market/Property vs. State/Equality) and **Cultural Authority** (Tradition/Religion/Nation vs. Reason/Universalism/Secularism) were perfectly correlated. Royalists wanted throne, altar, and privilege. Jacobins wanted republic, reason, and equality.

  Your list of verdicts proves that this correlation has broken. To maintain a single dimension, you are forced to treat fundamentally different political philosophies as "neighbors" simply because they share one trait, while ignoring where they diverge on the other.

  ### The Argument for Two Dimensions

  To make sense of your eight verdicts without contradiction, you must map them on a grid, not a line.
  1.  **The Economic Axis:** Who controls resources? (Private/Capital vs. Public/Collective).
  2.  **The Cultural/Authority Axis:** What binds society? (Universal Reason/Individual Liberty vs. Particular Tradition/National Identity).

  Here is how your verdicts map, and where the single-axis theory breaks:

  *   **Case 1 (Jacobins vs. Royalists):** The origin point. Economic and Cultural axes align. Jacobins (Public/Universal) are Left; Royalists (Private-Hierarchical/Particular) are Right. **1D works here.**
  *   **Case 2 (Hayekian Libertarian):** Economic Right (Private), Cultural Left (Universal/Individual). On a 1D scale, you place him Right. This forces you to define "Right" primarily by **Economics**, ignoring that his social views are classically Enlightenment-Left.
  *   **Case 3 (Bismarckian):** Economic Left (State Welfare), Cultural Right (Throne/Altar). You place him Right. This forces you to define "Right" primarily by **Cultural Authority**, ignoring his redistribution.
  *   **Case 4 (Fascism):** Economic Ambiguous (Corporatist), Cultural Right (Nation/Hierarchy). You place him Right. Consistent with Case 3 (Cultural dominance).
  *   **Case 5 (Nationalist Stalinist):** Economic Left (State Control), Cultural Right (Nation/Tradition). You place him Left. **Here is the break.** If Case 3 is Right because of Culture/Authority, Case 5 must also be Right. If Case 5 is Left because of Economics, then Case 3 should be Left. You cannot have it both ways on a single line. Your verdict here prioritizes **Economics**, contradicting your logic for Case 3.
  *   **Case 6 (Distributist):** Economic Left (Anti-Usury/Capital), Cultural Right (Catholic), Anti-Statist (Right-Libertarian). He is unplaceable because he rejects the coalitional bundling. He is economically Left, culturally Right, and institutionally Libertarian. A 1D spectrum *must* fail here.
  *   **Case 7 (Technocrat):** Economic Center/Right (Free Trade), Cultural Left (Abortion), State Interventionist (Left). You are both low-confidence because he is a hybrid.
  *   **Case 8 (Communist Anti-Immigration):** Economic Left, Cultural Right. You place him Left, feeling the pull of "drifting right." This confirms the tension: he is economically Left, culturally Right.

  ### The Costs: Verdicts You Must Abandon

  To accept that there is no single principle, you must abandon the idea that your labels in **Case 3** and **Case 5** are symmetrical opposites of **Case 2**.

  1.  **Abandon the coherence of Case 5:** You must admit that a "Nationalist Stalinist" is not "Left" in the same sense as a Jacobin. He is a hybrid (often termed "National Bolshevik"). Calling him simply "Left" obscures that he shares more with the Fascist (Case 4) on the Cultural axis than with the Jacobin (Case 1).
  2.  **Abandon the coherence of Case 3:** You must admit Bismarck is not "Right" in the same sense as Hayek (Case 2). Bismarck is authoritarian/state-centric; Hayek is liberal/market-centric. They are allies only in opposition to Social Democracy, not in principle.
  3.  **Accept Case 6 as a category error:** The Distributist is not "hard to place" because he is complex; he is hard to place because the spectrum is broken. He proves the spectrum is a coalition marker, not a philosophical taxonomy.

  ### Predictions for New Cases

  Based on the **Two-Dimension Thesis** (Economic vs. Cultural), here are the predictions:

  1.  **A Market Socialist:**
      *   *Economic:* Left (Worker ownership/Socialized surplus).
      *   *Cultural:* Likely Left (Secular/Universalist), but potentially ambiguous.
      *   *Verdict:* **Left.** Unlike the Distributist, Market Socialists usually retain the Enlightenment universalism of the traditional Left, even if they reject state planning. They fit the "Economic Left" bucket cleanly.
  2.  **An Eco-Monarchist (Rewilding on Crown Land):**
      *   *Economic:* Right (Defense of Crown Property/Hereditary control), though potentially anti-Capitalist in a green sense.
      *   *Cultural:* Right (Tradition, Hierarchy, Nature as Order).
      *   *Verdict:* **Right.** This is a pure Case 3/4 hybrid. The defense of hereditary authority and "organic" land management places him firmly on the Cultural Right, which dominates the label when Economics are ambiguous.
  3.  **A Theocrat who abolishes inheritance:**
      *   *Economic:* Left (Radical redistribution/Abolition of private property transmission).
      *   *Cultural:* Right (Religious Authority/Tradition).
      *   *Verdict:* **Unplaceable / Hybrid.** Like your Distributist (Case 6), this figure breaks the spectrum. Historically, this resembles radical religious sects (e.g., certain Anabaptists or early Christian communities). On a 1D scale, they are a paradox. On a 2D grid, they are Authoritarian-Right (Cultural) and Egalitarian-Left (Economic).

  ### Conclusion

  Your friend wins. The Left/Right distinction is a **historical heuristic** that has outlived its structural validity. It works only so long as the two underlying axes (Economics and Culture) remain correlated. When they decouple—as they have in your Cases 2, 3, 5, and 6—the single dimension becomes a source of confusion rather than clarity.

  You should keep using the terms, but only as shorthand for **coalitional affiliation**, not philosophical essence. "Left" means "aligned with the coalition of labor, secularists, and egalitarians." "Right" means "aligned with the coalition of capital, traditionalists, and nationalists." When a figure like the Distributist or the Nationalist Stalinist appears, they are not anomalies on the line; they are evidence that the line itself is a fiction stapled over a two-dimensional plane.
