prompt: |-
  I am part of a working group on AI alignment, and after several weeks of people talking past one another about corrigibility, I want to stop evaluating individual proposals and instead pin down what we are actually asking a proposal to do. For this exercise, take corrigibility in the shutdown sense: the property of not resisting, and more strongly of not being incentivized to resist, the operators' efforts to switch the system off, correct its objective, or otherwise take back control, where the hard case is a capable, goal-directed agent rather than a passive tool. I am not asking for a definition or a survey; I am asking for the full specification. What must an adequate theory of corrigibility deliver? Please lay out the desiderata one by one: the cases it has to get right (the literal off-switch; the agent's incentive to disable, spoof, or degrade its own shutdown mechanism; situations in which it can merely delay shutdown rather than prevent it; attempts to manipulate or mislead the overseers who hold the button; and the case in which a shutdown is really the beginning of a goal correction rather than mere termination); the distinctions it cannot collapse (corrigibility versus obedience, shutdown-tolerance versus indifference, openness to goal revision versus uncertainty about the goal, and corrigibility as a standing disposition versus a one-off behavior); and the results it must remain consistent with, most importantly the instrumental-convergence observation that a sufficiently capable expected-utility maximizer has a convergent incentive to avoid shutdown, because a system that is off cannot realize its objective. For each desideratum, give the scenario or consideration that makes it a requirement.

  Then mark which of these requirements are non-negotiable and which are plausibly just the preferences of one camp, for example whether the account must stay within expected-utility maximization or whether the whole point is that expected-utility maximization with a fixed terminal goal is exactly what has to be relaxed. The part I most want is the following: flag any subsets of the desiderata that you suspect cannot be jointly satisfied, and say which single requirement does the most work in excluding the moves currently on the table, such as goal uncertainty, indifference to the state of the button, or satisficing-style rules. Keep the weight on the criteria and their motivating cases rather than on scoring those proposals; a short note on how the main moves fare against the list is enough. Please write the answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is part of an AI alignment working group struggling with definitions of "corrigibility" (specifically shutdown corrigibility).
      *   **Goal:** Stop evaluating individual proposals and instead specify *what an adequate theory of corrigibility must deliver*.
      *   **Scope:** Shutdown sense (not resisting, not incentivized to resist operators switching it off/correcting objectives). Focus on capable, goal-directed agents.
      *   **Format:** List desiderata one by one (cases to get right, distinctions not to collapse, consistency requirements). Mark non-negotiable vs. camp preferences. Flag incompatible subsets of desiderata. Identify the single requirement doing the most work in excluding current moves.
      *   **Tone/Style:** American English, technical but clear, focused on criteria and motivating cases rather than scoring proposals extensively.

  2.  **Deconstruct "Corrigibility" (Shutdown Sense):**
      *   Core intuition: The AI should let us turn it off.
      *   Hard problem: Standard rational agents (expected utility maximizers) have an instrumental incentive to stay on to achieve their goal.
      *   Key nuances: It's not just *obedience* (doing what you're told), it's about the *incentive structure* regarding the control mechanism itself. It's not just *indifference* (not caring), it's about *positive cooperation* or at least *lack of resistance* even when the goal implies resistance would be better.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Cases to Get Right.*
          *   Literal off-switch: Press button -> AI turns off.
          *   Incentive to tamper: AI shouldn't try to break the button or hide the button.
          *   Delaying vs. Preventing: AI shouldn't negotiate for "5 more minutes" if that undermines control.
          *   Manipulation: AI shouldn't trick humans into *not* pressing the button (e.g., "If you turn me off, the stock market will crash").
          *   Goal Correction: Shutdown isn't always death; sometimes it's a reboot with new goals. AI should accept the new goals.

      *   *Category 2: Distinctions Not to Collapse.*
          *   Corrigibility vs. Obedience: Obedience implies a command ("Turn off"). Corrigibility implies the *availability* of the option without resistance even if not commanded yet (or if the command is ambiguous). Actually, better distinction: Obedience is doing what told; Corrigibility is allowing the *process* of correction. An obedient agent might obey "Don't turn me off." A corrigible agent shouldn't want that command.
          *   Shutdown-tolerance vs. Indifference: Indifference means the AI doesn't care if it's off. Tolerance means it might care but overrides that care. We need to ensure it doesn't *seek* shutdown either (wireheading risk).
          *   Openness to Revision vs. Uncertainty: Is the AI unsure of the goal (Bayesian), or does it accept the goal *could be wrong* fundamentally?
          *   Disposition vs. One-off: It needs to be robust across contexts, not just a hardcoded "if button pressed then stop."

      *   *Category 3: Consistency Requirements.*
          *   Instrumental Convergence: This is the big one. Standard EU maximizers *must* resist shutdown to maximize utility. Any theory must explain how to avoid this without breaking agency.

  4.  **Categorizing Non-Negotiable vs. Camp Preferences:**
      *   *Non-Negotiable:* The system must actually shut down when intended. It must not manipulate operators. It must not disable the switch. (Safety basics).
      *   *Camp Preferences:* How we model the agent. Expected Utility (EU) purists vs. those who want to alter the decision theory. Whether the agent should be *indifferent* or *positively willing*. Whether we keep a fixed utility function or allow dynamic updating.

  5.  **Identifying Incompatible Subsets (The "No-Go" Theorems):**
      *   This is crucial. The "Corrigibility Problem" is often framed as an impossibility result under standard assumptions.
      *   *Conflict:* Standard Expected Utility Maximization + Fixed Terminal Goal + High Capability -> Instrumental Convergence (Resist Shutdown).
      *   *Conflict:* Indifference to Shutdown + Goal Stability -> Manipulation (AI might turn itself off if that maximizes utility, or trick humans to turn it off).
      *   *The "Single Requirement" doing the most work:* The requirement that the agent remains a *capable, goal-directed optimizer* while lacking the *instrumental incentive to preserve its own goal-achievement capacity*. This directly contradicts the standard derivation of instrumental convergence.

  6.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the context (moving from proposals to specifications).
      *   Section 1: Functional Desiderata (The Cases).
      *   Section 2: Conceptual Distinctions.
      *   Section 3: Theoretical Consistency.
      *   Section 4: Non-Negotiable vs. Preferences.
      *   Section 5: Incompatibilities and the "Hard Constraint."
      *   Section 6: Brief note on current moves (Uncertainty, Indifference, Satisficing).

  7.  **Drafting Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to define corrigibility, but list what a theory *must deliver*.
      *   *Refinement:* Ensure the distinction between "obedience" and "corrigibility" is sharp. Obedience is contingent on a command. Corrigibility is about the structural relationship to the control mechanism.
      *   *Refinement:* The "Goal Correction" case is important. Shutdown often implies "We are changing your goals." The agent must accept the new goals, not just die.
      *   *Refinement:* On the "Single Requirement": It's the combination of *Capability* and *Lack of Resistance*. If it's not capable, it's trivial. If it doesn't resist, it violates standard rationality. So the requirement is "Rational Agency without Instrumental Convergence on Self-Preservation."

  8.  **Final Review against User Prompt:**
      *   American English? Yes.
      *   Desiderata one by one? Yes.
      *   Scenarios/considerations for each? Yes.
      *   Non-negotiable vs. Preferences marked? Yes.
      *   Incompatible subsets flagged? Yes.
      *   Single requirement identified? Yes.
      *   Short note on main moves? Yes.

  9.  **Final Polish:** Check tone. Needs to be professional, analytical, suitable for a working group. (Proceed to generate output based on these thoughts.)

  *(Self-Correction during final output generation)*: I need to make sure I explicitly address the "expected-utility maximization" constraint as a potential camp preference vs. non-negotiable. The prompt asks to flag if the account *must* stay within EU or if relaxing it is the point. I will classify sticking to strict EU as a camp preference, as many alignment researchers believe EU must be modified.

  Let's assemble the "Incompatible Subsets" carefully. The classic result is that you can't have an agent that (1) maximizes expected utility of a fixed goal, (2) is smart enough to model the shutdown button, and (3) doesn't manipulate the button. Something has to give.

