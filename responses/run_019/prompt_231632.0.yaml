prompt: |-
  I am a software engineer at a mid-sized company whose consumer app has a large user base, and I have no formal background in philosophy. Several times a quarter I get drawn into product decisions with an ethical dimension: engagement features that may become compulsive, data collection and sharing, what we build for which customers, and how our analytics might be used downstream. These decisions are made quickly, by a product team with no ethical expertise, and my written recommendation carries weight with the product director who signs off. I want a reusable decision procedure, grounded in the idea of moral uncertainty, that I can run in an afternoon before I write that recommendation.

  I only half understand the underlying theory, so let me set out what I take it to say. When someone is genuinely unsure which moral view is right, it is a mistake to pick whichever view seems most likely and then judge the decision only by that view. Instead one should treat the plausible moral views as if each might be the correct one, weight them by how much confidence one has in them, and choose the option that does best in expectation across all of them; a philosopher friend calls this maximising expected choiceworthiness. I have also been warned that the approach has known snags: different moral theories value different things in different units, so combining them can be like adding sums in different currencies without exchange rates; a tiny probability of an enormous outcome can dominate the whole calculation if taken literally; and the list of possible moral views is open-ended, so any calculation ignores an unknown number of candidates. I am not asking for a procedure that dissolves those snags. I am asking for one that acknowledges them and tells me what to do when they bite.

  Please write the procedure for me: the questions to ask in order, what counts as a sufficient answer to each question, where the procedure stops with a no, where it hands the decision to a human being because the question is one of values rather than facts, and which steps cannot be made mechanical without falsifying the underlying idea. Then run the procedure on three cases. The first case is a proposal to add a streak and time-limited reward system to our app; some users say it helps them sustain habits they want, while a substantial minority report feeling unable to stop, and our data shows the feature would substantially raise daily active use, which is the metric the product team is judged on. The second case is a proposal to sell de-identified location histories to a data broker for significant recurring revenue; the de-identification is good but not bulletproof, and the broker's clients include employers and insurers. The third case is a request from a large corporate customer to adapt our internal productivity-analytics tool into a product that scores individual employees' activity for managers to use in performance reviews and redundancy decisions; the revenue would fund our team for a year. Run the procedure honestly on all three, and when the answer is one I will not like on commercial grounds, say so plainly rather than softening it. Finally, say what the procedure cannot do, and which sorts of decisions it will misclassify or leave undecided.

  Please write the whole answer in continuous prose, the way one would write an email or a letter: no headings, bullet points, bold text, or tables.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Software engineer at a mid-sized company with a large user base. No formal philosophy background.
      *   **Problem:** Frequently faces ethical product decisions (engagement, data, analytics) made quickly by non-experts. Their written recommendation carries weight.
      *   **Goal:** A reusable decision procedure grounded in *moral uncertainty* (maximizing expected choiceworthiness) that can be run in an afternoon.
      *   **Constraints:**
          *   Acknowledge known snags of moral uncertainty (intertheoretic comparison, fanaticism, open-endedness).
          *   Write in continuous prose (email/letter style).
          *   **NO** headings, bullet points, bold text, or tables.
          *   Include the procedure (questions, stop conditions, human handoff, non-mechanical steps).
          *   Run the procedure on three specific cases (Streaks/Engagement, Location Data Sales, Employee Surveillance Tool).
          *   Be honest about commercial downsides (don't soften blows).
          *   Conclude with limitations (what the procedure cannot do).

  2.  **Deconstruct the Procedure (Moral Uncertainty Framework):**
      *   Core idea: Maximize Expected Choiceworthiness (MEC).
      *   Steps needed:
          1.  Identify options.
          2.  Identify relevant moral theories/views.
          3.  Assign credences (confidence levels) to theories.
          4.  Evaluate options under each theory (choiceworthiness).
          5.  Handle intertheoretic comparison (the "currency" problem).
          6.  Handle fanaticism (low prob/high impact).
          7.  Handle open-endedness (unknown theories).
          8.  Calculate/Estimate expected value.
          9.  Decision/Recommendation.
      *   Constraints from prompt: Must specify where it stops, where it hands to humans, what can't be mechanical.

  3.  **Drafting the Procedure (Mental Outline):**
      *   Start by listing the plausible moral views (Utilitarianism, Deontology/Rights, Virtue Ethics, Contractualism, etc.).
      *   Assign confidence (e.g., 40% Util, 30% Rights, 30% Virtue).
      *   Score the action under each view.
      *   Address the "currency" problem: Use a common scale (e.g., 0-100 harm/benefit) but acknowledge normalization is imperfect.
      *   Address fanaticism: Cap extreme outliers unless probability is non-negligible.
      *   Address unknowns: Add a "margin of safety" or veto if unknown risks are catastrophic.
      *   Human handoff: If theories conflict violently or values are fundamentally contested beyond calculation.
      *   Non-mechanical: Assigning credences and scoring choiceworthiness requires judgment, not math alone.

  4.  **Drafting the Cases:**
      *   *Case 1 (Streaks):* Utilitarianism (happy users vs. addicted users), Deontology (autonomy/manipulation), Virtue (habit formation vs. compulsion). Likely outcome: Proceed with safeguards or reject if harm to minority is severe (rights violation).
      *   *Case 2 (Location Data):* Utilitarianism (revenue vs. privacy risk), Deontology (consent/trust), Rights (privacy as right). Likely outcome: Reject (high risk of harm, violation of trust/rights).
      *   *Case 3 (Employee Surveillance):* Utilitarianism (company survival vs. employee stress/unfairness), Deontology (dignity/autonomy), Rights (worker rights). Likely outcome: Reject (instrumentalizing humans, high harm potential).

  5.  **Drafting the Limitations:**
      *   Cannot resolve fundamental value conflicts.
      *   Cannot predict unforeseen consequences perfectly.
      *   Relies on honest credence assignment (self-deception risk).
      *   Doesn't replace organizational governance.

  6.  **Writing Style Check:**
      *   Continuous prose.
      *   No headings, bullets, bold, tables.
      *   Tone: Professional, direct, empathetic but firm (like a senior colleague or consultant writing a letter).

  7.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Check:* Did I use bold text? *Correction:* Ensure no bolding.
      *   *Check:* Did I use bullet points? *Correction:* Convert lists to paragraphs.
      *   *Check:* Did I address the "snags"? *Correction:* Explicitly mention normalization, fanaticism, and unknown theories in the procedure section.
      *   *Check:* Did I run all three cases? *Correction:* Ensure each case gets a dedicated paragraph section within the prose.
      *   *Check:* Is the tone right? *Correction:* Keep it conversational but rigorous.
      *   *Check:* Did I mention where the procedure stops? *Correction:* Include veto conditions.
      *   *Check:* Did I mention non-mechanical steps? *Correction:* Highlight credence assignment and scoring.

  8.  **Final Polish:**
      *   Ensure smooth transitions between the procedure description, the case studies, and the limitations.
      *   Verify the "no formatting" constraint strictly.
      *   Make sure the advice on commercial downsides is clear (e.g., "you will lose revenue").

  9.  **Moral Uncertainty Specifics:**
      *   Need to explain how to handle the "different currencies" problem practically. Suggest normalization (scaling outcomes 0 to 100 within each theory) before weighting.
      *   Need to address the "open-ended list" problem. Suggest a precautionary principle overlay.
      *   Need to address "fanaticism." Suggest ignoring low-probability extreme outcomes unless they involve existential risk.

  10. **Final Review against constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold/tables? Yes.
      *   Procedure included? Yes.
      *   Three cases run? Yes.
      *   Limitations included? Yes.
      *   Honest about commercial impact? Yes.

