answer: |-
  Dear colleague, I understand the pressure you are under and the weight of the responsibility you have accepted by seeking a structured way to navigate these decisions. It is commendable that you wish to treat ethical uncertainty with the same rigor as technical uncertainty, and while no algorithm can replace moral judgment, a disciplined procedure can prevent the most common errors of intuition and bias. What follows is a decision procedure grounded in the framework of maximizing expected choiceworthiness under moral uncertainty, designed to be executed in a single afternoon. It is written as continuous prose to encourage a flow of thought rather than a checkbox mentality, and it explicitly marks where mathematics must yield to judgment.

  To begin the procedure, you must first delineate the available options, including the status quo and any viable modifications that might mitigate harm, such as adding safeguards or limiting scope. Once the options are clear, you must list the moral theories that you find plausible, assigning each a credence or confidence level that sums to one hundred percent. For a software engineer, a practical set usually includes consequentialism, which judges actions by their outcomes; deontology, which judges actions by adherence to duties or rights regardless of outcomes; and virtue ethics or contractualism, which focus on character or mutual agreement. You must accept that assigning these percentages is not mechanical and cannot be falsified by data; it requires honest introspection about what you believe matters, and if you find yourself inflating the credence of a theory that favors the commercial outcome, you must stop and recalibrate. Next, for each option, you must evaluate its choiceworthiness under each theory on a normalized scale, perhaps from negative one hundred to positive one hundred, to address the problem of different moral currencies. This normalization is crucial because utilitarianism might measure value in units of happiness while deontology measures it in units of rights violations, and adding them directly is incoherent; by scaling them relative to the best and worst possible outcomes within each theory, you create a common denominator for comparison. You then multiply the normalized score of each option under each theory by the credence you assigned to that theory and sum the results to find the expected choiceworthiness. However, you must apply two brakes to this calculation to handle the known snags of the theory. First, to avoid fanaticism where a tiny probability of an enormous outcome dominates the sum, you must cap the influence of any outcome whose probability is below a reasonable threshold unless it involves existential catastrophe. Second, to address the open-ended list of theories, you must apply a precautionary veto; if any theory with significant credence identifies a catastrophic rights violation or irreversible harm, the procedure stops and recommends against the action regardless of the weighted sum, because unknown theories might align with that veto and the cost of error is too high. If the calculation yields a clear winner without triggering the veto, you have a draft recommendation, but if the theories conflict violently such that the option is highly positive under one and highly negative under another, the procedure hands the decision to a human being, specifically a group with diverse values, because this is no longer a calculation problem but a value conflict that requires democratic or leadership resolution.

  Let us run this procedure on your first case regarding the streak and time-limited reward system. Your options are to launch the feature as proposed, to launch it with safeguards such as break reminders and usage caps, or to reject it entirely. Under consequentialism, which you might weight at forty percent, the feature produces high engagement and habit formation for many, yielding a positive score, but significant distress and compulsion for a minority, yielding a negative score; the net outcome depends on whether you count the intense harm to the few as outweighing the mild benefit to the many, likely resulting in a mildly positive score for the safeguarded version and a negative score for the unsafeguarded version. Under deontology, which you might weight at thirty percent, the issue is autonomy and manipulation; designing features specifically to override user self-control treats users as means to an end rather than ends in themselves, suggesting a strong negative score for the unsafeguarded version and a neutral score for the safeguarded version. Under virtue ethics, weighted at thirty percent, the question is whether this builds good character; sustaining habits is virtuous, but compulsion is vicious, leading to a mixed score. When you normalize and sum these, the unsafeguarded option likely triggers the precautionary veto due to the deontological violation of autonomy and the risk of severe harm to vulnerable users, while the safeguarded option may pass but with a low expected choiceworthiness. The honest commercial truth is that adding friction will lower your daily active use metrics, and if you follow this procedure, you must recommend against the unsafeguarded launch and likely argue that the safeguarded version is not worth the engineering cost unless the habit formation benefit is proven to be life-improving rather than merely engagement-driving. You should expect pushback from the product director because this procedure prioritizes user sovereignty over growth metrics, and you must be prepared to state that the risk of creating addiction outweighs the revenue gain.

  Now consider the second case regarding the sale of de-identified location histories. The options are to sell the data, to sell it with stricter contractual limits, or to refuse. Under consequentialism, weighted at forty percent, the revenue is a clear positive, but the risk of re-identification and subsequent harm to users from employers or insurers is a massive negative; given that the de-identification is not bulletproof, the expected harm is high, likely driving the score deeply negative. Under deontology, weighted at thirty percent, users entrust data to you for the app's function, not for resale to third parties that could affect their livelihoods; selling this data violates implicit consent and privacy rights, resulting in a strong negative score regardless of revenue. Under contractualism, weighted at thirty percent, you must ask if users would agree to this term if they knew the specifics; since the broker's clients include insurers and employers, reasonable users would likely reject this term, leading to a negative score. The normalization here is stark because the potential harm involves loss of employment or insurability, which dwarfs the benefit of recurring revenue. The precautionary veto triggers immediately because the risk involves severe rights violations and irreversible life consequences for users. The procedure dictates a recommendation to reject the proposal entirely. I must be plain with you that this decision will forfeit significant recurring revenue and may disappoint stakeholders looking for monetization avenues, but the procedure shows that the ethical cost is not just high but potentially catastrophic for individuals, and no amount of revenue normalizes a violation of trust that could ruin lives.

  The third case involves adapting your internal productivity tool for a corporate customer to score employees for performance and redundancy decisions. The options are to build the product, to build it with transparency features, or to decline. Under consequentialism, weighted at forty percent, the revenue funds your team for a year, which is a significant positive for your employees, but the potential for algorithmic bias, stress, and unfair dismissal for the client's employees is a massive negative; since redundancy decisions affect livelihoods, the harm scale is enormous. Under deontology, weighted at thirty percent, using software to reduce human beings to scores for dismissal treats them as mere data points, violating dignity and autonomy, which yields a strong negative score. Under virtue ethics, weighted at thirty percent, building tools for surveillance and dismissal does not align with flourishing or good character for either the builder or the user, resulting in a negative score. The intertheoretic comparison here is difficult because the benefit is concentrated on your team while the harm is dispersed among the client's employees, but the severity of harm (loss of income) outweighs the severity of benefit (job security for your team). The precautionary veto applies because the downstream use involves significant life alterations based on opaque analytics. The procedure recommends declining the request. You will not like this answer on commercial grounds because it turns down funding that secures your team's future, but the procedure highlights that you are being asked to externalize risk onto vulnerable workers to secure your own position, and ethically this is untenable. You must recommend against building tools that automate firing decisions without human oversight, even if it means seeking alternative funding or shrinking the team.

  Finally, you must understand what this procedure cannot do, for expecting it to solve everything will lead to misuse. It cannot resolve fundamental disagreements about which moral theories deserve credence; if you assign zero weight to rights-based ethics, the procedure will never protect rights, so the input quality determines the output integrity. It will misclassify decisions where the harms are unknowable or emerge only after long-term societal shifts, such as how a feature might change cultural norms over a decade, because the procedure relies on foreseeable outcomes. It will leave undecided any case where the expected choiceworthiness is nearly identical across options, forcing you to rely on non-ethical tiebreakers like business strategy. It cannot protect you from organizational pressure to manipulate the credences or scores to justify a predetermined outcome, which is a human failure rather than a procedural one. Most importantly, it cannot absolve you of responsibility; it is a tool for clarifying thought, not a shield against the consequences of your recommendation. If you use it honestly, it will sometimes tell you to lose money to protect people, and you must be willing to stand by that conclusion when you write your recommendation to the product director.
