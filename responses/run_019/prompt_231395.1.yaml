  **Towards Epistemically Humble Allocation: A Case for Stochastic Grantmaking in the Face of Complex Cluelessness**

  **Posted by:** [Redacted] **|** **Karma:** 0 **|** **Date:** October 24, 2023

  Colleagues,

  We gather here committed to the principle of doing good better. Yet, as our cause prioritization frameworks mature, we must confront an uncomfortable epistemic boundary often discussed in the literature on consequentialist cluelessness. While simple cluelessness—uncertainty about whether an intervention saves one life or two—is tractable via standard sensitivity analysis, complex cluelessness presents a more structural challenge. When we consider the indefinite downstream consequences of any action, the probability distribution of total value becomes so diffuse that the expected value (EV) of nearly all interventions converges on undefined.

  Consider the standard bednet distribution. We save a life in the short term. However, that individual's continued existence alters population dynamics, carbon emissions, geopolitical stability, and technological development trajectories over the next millennium. These second- and third-order effects swamping the immediate benefit are not merely unknown; they are symmetrically unknowable. For every plausible chain of events leading to a utopian outcome, there exists a mirror chain leading to catastrophe. Since we lack a principled reason to assign higher probability to the positive tail than the negative tail, the sign of the net impact is epistemically inaccessible.

  If the sign of the impact is unknowable, then the ranking of interventions by expected value is not just difficult—it is meaningless. To claim that AI safety research has a higher EV than global health development is to pretend precision where there is only noise. Both occupy the same epistemic status: effectively zero information regarding long-term net value.

  This leads to a modest proposal for the Effective Altruism Funds: **The Uniform Distribution Protocol (UDP).**

  Under the UDP, we acknowledge that complex cluelessness renders all long-termist interventions epistemically equivalent. Therefore, rigorous grantmaking analysis is not only futile but potentially harmful, as it creates an illusion of knowledge that may bias us toward familiar cause areas. Instead of spending resources on due diligence, we should allocate capital via a cryptographically secure random number generator across the entire opportunity set of proposed interventions.

  Critics might object that this invites paralysis. If we know nothing, why act at all? Why not retain the capital? This objection fails the symmetry test. Cluelessness bites the decision to abstain just as hard as it bites the decision to act. Retaining capital preserves the status quo, but the status quo has its own unknowable downstream consequences that may be catastrophic. Inaction is itself an intervention with undefined EV. Therefore, paralysis is not a safe default; it is merely another choice under ignorance.

  Furthermore, some may argue that randomization abandons the maximization principle. This is a misunderstanding. We are not abandoning expected value reasoning; we are optimizing it under constraints. The cost of thorough due diligence is high, and if the output of that diligence is noise, the EV of the analysis is negative. By contrast, the administrative cost of a lottery is negligible. Since all interventions have undefined but ostensibly equal EVs, the intervention with the lowest overhead is the most cost-effective. The UDP maximizes expected value by minimizing waste on futile epistemic labor.

  There is also a fairness consideration. If no applicant can demonstrably prove their project produces more good than any other, denying funding based on subjective criteria is arbitrary. A lottery treats all potential impact creators with equal respect, acknowledging our shared humility before the complexity of the causal web.

  Implementing the UDP would require a shift in culture, but it is the only consistent response to deep uncertainty. We must stop pretending we can see the future. We cannot. But we can roll the dice.

  I invite comments on the feasibility of integrating quantum randomization into our grant disbursement pipeline.
