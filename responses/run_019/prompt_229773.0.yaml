          *   Insincerity (asserting $P$ while believing $\neg P$) $\rightarrow$ Criticism (even if $P$ is true).
          *   Error (asserting $P$ while believing $P$, but $P$ is false) $\rightarrow$ Criticism (even if sincere).
          *   *Implicit Norms:* Truth and Belief (often combined as Knowledge).
      *   *Wikipedia Policy:*
          *   Verifiability in reliable published sources is key.
          *   Personal certainty/belief is insufficient.
          *   Personal knowledge (direct experience) is insufficient without sources.
          *   Editors may assert $P$ while believing $\neg P$ (if sources say $P$).
          *   Editors may be stopped from asserting $P$ even if $P$ is true and they know it (if no sources).
      *   *Core Tension:* Wikipedia decouples assertion from the editor's epistemic state (belief/knowledge) and couples it to external documentation (provenance).

  3.  **Evaluate Normative Frameworks:**
      *   *Truth Norm:* You should assert $P$ only if $P$ is true.
          *   *Wikipedia:* No. True unsourced claims are removed.
      *   *Belief Norm:* You should assert $P$ only if you believe $P$.
          *   *Wikipedia:* No. Editors can write things they disbelieve (NPOV).
      *   *Knowledge Norm:* You should assert $P$ only if you know $P$.
          *   *Wikipedia:* No. Personal knowledge is explicitly rejected ("No Original Research").
      *   *Source/Provenance Norm:* You should assert $P$ only if $P$ is published in a reliable source.
          *   *Wikipedia:* Yes. This is the "Verifiability" policy.

  4.  **Analyze the Nature of the Speech Act (Assertion vs. Report):**
      *   *Standard Assertion:* "The earth is round." (Commits speaker to truth).
      *   *Wikipedia Edit:* "The earth is round [citation needed]." or "According to Smith (2020), the earth is round."
      *   *Argument:* Wikipedia text looks like assertion ("The sky is blue"), but the *warrant* is not the editor's knowledge, but the source's authority.
      *   *Refinement:* It functions as a *distributed assertion* or a *citation-backed report*. The editor is asserting that *the literature says P*, not necessarily that *P is the case* (though they often converge).
      *   *Key Distinction:* In ordinary conversation, *I* take responsibility. On Wikipedia, the *Source* takes responsibility; the editor takes responsibility for *accurate transcription*.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension between ordinary norms and Wikipedia's "Verifiability, not Truth" policy. State the thesis: Wikipedia operates on a **Provenance Norm**, not epistemic norms of the individual editor.

      *   **Normative Analysis (Truth, Belief, Knowledge, Provenance):**
          *   *Truth:* Policy explicitly rejects truth as the sole criterion (unsourced truths removed).
          *   *Belief:* Policy explicitly rejects sincerity as the criterion (NPOV requires reporting views one might disagree with).
          *   *Knowledge:* Policy explicitly rejects personal knowledge (No Original Research).
          *   *Provenance:* This is the strict presupposition. The norm is: Assert $P$ only if $P$ is attested in a reliable source.
          *   *Distinction:* Differentiate "strictly presupposes" (Verifiability is the rule) vs. "fits well with" (Truth is the goal, but not the gatekeeper).

      *   **Modeling the Speech Act (Assertion vs. Report):**
