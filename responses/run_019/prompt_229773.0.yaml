answer: |-
  The Wikipedia editing policy described creates a distinct normative framework that diverges sharply from the standards governing ordinary conversation. To reconstruct the implicit view of assertion behind this policy, we must analyze how it decouples the right to speak from the speaker's internal epistemic state and recouples it to external documentation.

  ### 1. The Normative Framework: Provenance over Epistemology

  In ordinary conversation, assertion is governed by a cluster of epistemic norms, most prominently the **Knowledge Norm** (assert $P$ only if you know $P$), which entails both a **Truth Norm** (assert $P$ only if $P$ is true) and a **Belief Norm** (assert $P$ only if you believe $P$). Wikipedia's policy explicitly rejects all three as the primary gatekeeping mechanisms for inclusion.

  *   **Rejection of the Truth Norm:** The policy allows for the removal of true claims if they are unsourced. Therefore, truth is not a sufficient condition for assertion.
  *   **Rejection of the Belief Norm:** The policy requires editors to neutrally report significant views even if they privately disbelieve them (e.g., reporting a scientific consensus one denies, or a religious claim one does not share). Therefore, sincerity is not a necessary condition for assertion.
  *   **Rejection of the Knowledge Norm:** The "No Original Research" policy forbids editors from including material based on personal knowledge or direct experience, even if that knowledge amounts to justification sufficient for "knowing" in a philosophical sense. Therefore, personal knowledge is not a sufficient condition for assertion.

  **The Strict Presupposition: A Provenance Norm**
  The policy strictly presupposes a **Source-Based (or Provenance) Norm**. The rule is: *Assert $P$ only if $P$ is attested in a reliable, published source.*
  Under this norm, the warrant for the assertion does not reside in the editor's mind (belief/knowledge) nor directly in the world (truth), but in the *literature*. The editor is not vouching for the facticity of $P$, but for the *existence of the record* of $P$.

  **What Merely "Fits Well"**
  While the policy does not presuppose a Truth Norm, it *fits well* with one instrumentally. Reliable sources are generally correlated with truth. The policy aims for truth *aggregatively* (by relying on institutions dedicated to truth-seeking) rather than *individually* (by relying on the editor's grasp of reality). Similarly, it fits well with a Belief Norm in that editors usually believe what they write, but this is a psychological byproduct, not a normative requirement.

  ### 2. Assertion vs. Report: The Nature of the Speech Act

  To understand the view of assertion here, we must determine what kind of speech act an edit constitutes.

  **The Surface Grammar of Assertion**
  Syntactically, Wikipedia edits look like standard assertions. The text reads "The Earth orbits the Sun," not "Source X says the Earth orbits the Sun." To the reader, the encyclopedia presents itself as a repository of facts, implying a standard truth claim.

  **The Pragmatics of Reporting**
  However, the *policy* treats the edit not as a first-order assertion about the world, but as a second-order **report on the state of published literature**.
  *   **Ordinary Assertion:** The speaker takes responsibility for the truth of $P$. If $P$ is false, the speaker is at fault.
  *   **Wikipedia Edit:** The editor takes responsibility for the *accuracy of the citation*. If $P$ is false, the editor is not necessarily at fault provided $P$ was accurately transcribed from a reliable source. The fault lies with the source, or the community must find a *better* source to override it.

  Therefore, the implicit view of assertion behind the policy is that **an encyclopedia entry is a curated bibliography presented in the grammatical form of assertion.** The editor is not an *author* generating knowledge, but a *transcriber* institutionalizing consensus. The "assertion" is actually a claim that *this proposition is part of the public record.*

  This distinction is crucial. If edits were modeled as standard assertions, the removal of a true, unsourced claim would be an injustice (suppressing truth). Modeled as reports on sources, the removal is procedural (the literature does not yet support this report).

  ### 3. Counterfactual: The "Knowledge Rule"

  If Wikipedia were run on the rule that "a claim may be included only if the editor knows it," the fundamental nature of the project would collapse. Here is what would change:

  **1. The End of Neutrality (NPOV)**
  The Knowledge Rule privileges personal verification. In contested topics (e.g., politics, religion, history), editors would be incentivized to assert only what they can personally verify. Since personal verification is often impossible for complex historical or scientific claims without relying on... sources, this would devolve into editors asserting only their immediate experiences. More dangerously, it would encourage editors to dismiss sourced material they personally "know" to be wrong based on their own intuition or experience, fueling edit wars based on conflicting personal certainties rather than adjudicable source comparisons.

  **2. The Collapse of Scale and Expertise**
  Wikipedia relies on the division of epistemic labor. An editor does not need to know quantum mechanics to summarize a paper on it; they only need to understand the text. A Knowledge Rule would require the editor to actually *know* quantum mechanics. This would restrict contributions to experts only, drastically reducing the volume of content and violating the "anyone can edit" principle.

  **3. Shift from Verifiability to Adjudication**
  Currently, disputes are resolved by checking sources (an objective, external metric). Under a Knowledge Rule, disputes would be resolved by evaluating the *editor's epistemic state*. How does an administrator verify that an editor truly *knows* a claim, rather than just believing it? The policy would require intrusive scrutiny of editors' credentials and mental states, transforming the project from a documentation effort into a credentialing body.

  **4. Resurgence of Original Research**
  The "No Original Research" policy exists to prevent Wikipedia from becoming a primary publisher of new claims. A Knowledge Rule would implicitly encourage original research. If an editor witnesses an event (and thus "knows" it), they would be mandated to include it. Wikipedia would become a collection of personal testimonies and blogs rather than a summary of established knowledge.

  ### Conclusion

  The implicit view of assertion behind Wikipedia's policy is **institutional rather than epistemic**. It treats assertions not as expressions of an individual's grasp of truth, but as nodes in a network of documentation. It presupposes a **Provenance Norm**, where the right to assert is derived from the authority of the source, not the competence of the speaker.

  While this fits well with the goal of truth, it strictly prioritizes **verifiability** over **truth**. By modeling edits as reports on sources rather than direct assertions about the world, the policy insulates the encyclopedia from the fallibility of individual editors. Switching to a Knowledge Norm would destroy this insulation, forcing the encyclopedia to rely on the fragile, unverifiable, and conflicting epistemic states of its contributors rather than the stable, adjudicable record of published literature.
