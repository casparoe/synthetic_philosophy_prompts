          *   *Surface Grammar:* Looks like assertion ($P$).
          *   *Underlying Pragmatics:* It's a report on the state of published literature.
          *   *Why this matters:* It shifts liability. If $P$ is false, the editor isn't "wrong" in the ordinary sense; the source is wrong, or the editor failed to find a better source. The editor's commitment is to *fidelity*, not *factuality*.
          *   *Conclusion on this point:* It is best modeled as a **citation-backed report** masquerading as an assertion for readability.

      *   **Counterfactual: The "Knowledge Rule":**
          *   What if the rule was "Include only if the editor knows it"?
          *   *Collapse of NPOV:* Editors would only write what they personally verify. Contested topics would become battlegrounds of personal testimony.
