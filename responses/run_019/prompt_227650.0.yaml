answer: |-
  **1. The "Hidden Labor" Accounting**
  **Question:** Your affluence thesis leans heavily on time-allocation studies suggesting foragers worked significantly fewer hours than early farmers. But critics like Rebecca Bliege Bird have argued that these estimates often clock time *at camp* while excluding off-site labor: the trek to the woodline, tool maintenance, and the intensive processing of wild grains or nuts that happens back at the hearth. When you fully load the accounting with childcare and processing, does the "original affluent society" margin actually survive?
  **Follow-up:** I anticipate you'll say that even fully loaded, forager hours still come in below the dawn-to-dusk grind of early agriculture. But if the margin is slim—say, a few hours a week—does that sustain the rhetorical weight of "catastrophe"? Or are we arguing about the *quality* of those hours rather than the quantity?

  **2. Risk and the Value of Leisure**
  **Question:** Let's grant the time margin. Sahlins defined affluence as having few wants easily satisfied, but foragers also live with high caloric variance. A farmer with a granary has a buffer against a bad week; a forager often does not. Does "leisure" count as affluence if it's underwritten by the constant background risk of starvation, or is security a prerequisite for welfare that you're underweighting?
  **Follow-up:** If you argue that foragers manage risk through mobility and social networks rather than storage, does that mechanism break down precisely at the population densities where agriculture becomes inevitable? In other words, is the "affluence" only possible because they *couldn't* stay in one place long enough to exhaust the land?

  **3. The Demographic Ratchet**
  **Question:** Agriculture arose independently in at least seven different regions. As far as we know, no population that adopted it ever voluntarily reverted to full-time foraging, even when the health declines became obvious. You've argued this is a ratchet effect: farming supports higher densities, so returning to foraging would mean mass starvation. If the transition was demographically coercive, was there ever a genuine choice to be made?
  **Follow-up:** If there was no viable exit once the trap sprung, in what sense was it a "wrong turn" rather than just a geological or demographic inevitability? Can a process be a mistake if no agent at the time had the capacity to choose otherwise?

  **4. The Normativity of "Mistake"**
  **Question:** Following on that: if the trap was invisible at the moment of decision, and the return was impossible once sprung, we need to clarify your normative standard. When you call agriculture a catastrophe, are you judging it by the standards of the people living through it, or from our vantage point looking back?
  **Follow-up:** I want to press on what "mistake" means here. If the trap was invisible, it's a mistake for *whom*? Judged by *what standard*? If a forager in 9000 BCE couldn't conceive of the Neolithic decline in stature, can we coherently say they made an error, or are we just imposing modern preferences on a constraint they couldn't see?

  **5. The Pacific Northwest Counter-Example**
  **Question:** Your thesis links agriculture to hierarchy, but the Pacific Northwest Coast peoples developed rank, slavery, and hoarded surplus without cereal farming. Conversely, early Neolithic villages like Çatalhöyük look remarkably egalitarian for centuries. If complexity and hierarchy can exist without the plow, and farming can exist without immediate hierarchy, is the causal link you're drawing actually robust?
  **Follow-up:** It sounds like you're conceding that the real culprit is storable surplus and the state apparatus, not cultivation itself. If that's the case, doesn't your book title blame the wrong culprit? Shouldn't the argument be against *accumulation* rather than *agriculture*?

  **6. The Mechanism of Inequality**
  **Question:** Let's assume you're right that surplus is the driver. But surplus requires storage, and storage requires sedentism. Isn't agriculture the *only* reliable way to generate the kind of caloric density that makes storage and thus inequality possible at scale? Even if PNW foragers had rank, could they have built an empire without wheat?
  **Follow-up:** If agriculture is the necessary engine for the surplus that creates the inequality you dislike, doesn't that bring the blame back to farming anyway? Or are you arguing we could have had sedentism and surplus without domestication—a historical possibility that never actually materialized?

  **7. Health Metrics and Trade-offs**
  **Question:** Your best empirical cards are biological: the decline in stature, the rise in dental caries, and the explosion of zoonotic diseases. But the anthropological record on violence is mixed, and forager infant mortality rates were often brutal. How do you weigh the farmer's chronic disease against the forager's acute mortality risk?
  **Follow-up:** This pushes on whether you're cherry-picking quality-of-life metrics over lifespan. Do you have a principled way to trade off a shorter, healthier life against a longer, sicker one? Or does your argument implicitly prioritize the *experience* of health over the *duration* of life?

  **8. The Population Ethics Bullet**
  **Question:** Agriculture enabled orders of magnitude more human lives to exist at all. Even if the average farmer was worse off than the average forager, the total sum of human experience is vastly larger. Do you accept the utilitarian implication that a world with billions of slightly miserable people is preferable to a world with millions of affluent ones?
  **Follow-up:** I want to hear whether you bite the bullet that average welfare is all that matters, or if you have some other criterion in reserve. If the "catastrophe" enabled 10,000 years of human history that otherwise wouldn't exist, is it still a catastrophe, or just a tragic necessity?

  **9. The Political Prescription**
  **Question:** If agriculture was a trap and inequality is downstream of surplus, what is the political prescription? You can't advocate a return to foraging; the demographic carrying capacity isn't there. Is this diagnosis purely diagnostic, or does it imply a specific critique of modern property rights and storage mechanisms?
  **Follow-up:** If the solution isn't to abandon farming but to dismantle the surplus mechanisms that farming enables, aren't you arguing for a form of anarchism that history suggests is unstable at scale? How do you square the historical analysis with a viable future?

  **10. The Concept of Progress**
  **Question:** Finally, your argument relies on a comparison between two states: foraging and farming. But "progress" implies a direction. If we reject the idea that history is moving toward something better, does "wrong turn" even remain a coherent category? Or are we just saying "I prefer the past"?
  **Follow-up:** If you reject teleology, isn't "catastrophe" just an emotional label for a change that didn't align with your specific values? How do you ground the claim objectively without smuggling in a theory of progress that you ostensibly reject?
