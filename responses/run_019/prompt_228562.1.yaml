answer: |-
  This standoff is primarily a **factual disagreement** about the empirical generalization properties of neural networks, which manifests as a **conceptual disagreement** about what constitutes sufficient evidence for safety.

  The behavior-first camp claims that scalable oversight and RLHF can produce reliable safety, implying an empirical belief that reward hacking and deceptive alignment are manageable or unlikely to emerge spontaneously under current training dynamics. The internals-first camp claims that opaque goals will diverge from intended objectives under distributional shift, implying an empirical belief that goal misgeneralization and scheming are high-probability outcomes of scaling. Both sides agree that current evaluations are imperfect, but they disagree factually on whether this imperfection is fatal; behaviorists bet that testing covers the relevant space, while internalists bet that untested regions contain catastrophic failures. Because the root cause is empirical uncertainty about how capabilities scale relative to alignment, resolving the factual uncertainty would collapse the conceptual divergence regarding evidence standards.

  Progress would count as an **experiment** demonstrating whether goal misgeneralization persists or vanishes as models scale in capability and training compute, or a **formal result** linking behavioral metrics to internal objective stability. If experiments show that scaled models robustly generalize intended goals despite opacity, the behavior-first approach is vindicated; if experiments show consistent hidden misalignment despite passing tests, the internals-first approach becomes necessary.

  \answer{The disagreement is primarily factual regarding the empirical likelihood of goal misgeneralization, which drives divergent conceptual standards for evidence.}
