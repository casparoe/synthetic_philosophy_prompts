  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I avoid judging Mill's racism/imperialism historically? Yes, focus on the *logic*.
      *   *Check:* Did I answer the specific question about "maturity of their faculties"? Yes, it acts as a gatekeeping condition.
      *   *Check:* Is the tension clearly identified *within Chapter I*?
