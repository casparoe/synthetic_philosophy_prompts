          *   Example: If I say $P(A)=0.6, P(\neg A)=0.6$ (sum=1.2), I could fix this by going to $(0.5, 0.5)$ or $(0.7, 0.3)$, etc. Many of these might dominate the original.
          *   Implication: The theorem doesn't point to a *unique* target. So it can't prescribe a specific function.
