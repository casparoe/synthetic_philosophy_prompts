          *   A coherent function that dominates me might be wildly out of step with my evidence (e.g., dogmatic certainty).
          *   Accuracy-firsters need a bridge principle: "Adopt the coherent credences that *also* respect your evidence." But the dominance theorem alone doesn't establish *which* coherent functions respect evidence.
