answer: |-
  This is an excellent question that cuts to the heart of the normative force of accuracy-first epistemology. You have correctly identified a tension that often goes unremarked in introductory presentations of the argument.

  Your confusion stems from a natural conflation of two different decision-theoretic principles: **Dominance** and **Maximization**. The accuracy argument relies on the former, but you are intuitively reaching for the latter.

  Here is why the dominance result establishes a negative constraint (incoherence is irrational) rather than a positive prescription (adopt *this* specific coherent function), even if accuracy is the sole epistemic value.

  ### 1. The Multiplicity of Dominators
  The most immediate technical reason is that for any incoherent credence function $C$, there is not just *one* coherent function $C^*$ that dominates it; there are infinitely many.

  Imagine your credences violate the axioms (e.g., you assign 0.6 to $P$ and 0.6 to $\neg P$). The dominance theorem (such as Joyce's 1998 theorem) guarantees that there is *some* probabilistically coherent function that is more accurate than yours in every possible world. However, it does not identify a unique one.
  *   Function $A$ (0.5, 0.5) might dominate you.
  *   Function $B$ (0.55, 0.45) might also dominate you.
  *   Function $C$ (0.51, 0.49) might also dominate you.

  If accuracy were the *only* consideration, and we were simply trying to pick a winner, we would face a dilemma: which dominator should we choose? They are all better than your current state, but the dominance theorem itself provides no metric for choosing *among* them. Therefore, the theorem cannot recommend a *uniquely* rational replacement. It can only tell you that your current location is suboptimal and that you should move somewhere into the "coherent region."

  ### 2. The Role of Evidence (The Bridge Principle)
  Even if we grant that accuracy is the sole *final* epistemic value, epistemic rationality is not solely about the final score; it is about the relationship between your credences and your **evidence**.

  Consider two coherent credence functions that both dominate your incoherent one:
  1.  **$C_{sensible}$:** Aligns well with your current evidence.
  2.  **$C_{dogmatic}$:** Assigns extreme confidence (0.99) to a proposition for which you have no evidence, yet still manages to dominate your incoherent function because your incoherence was so severe.

  If the accuracy argument concluded that you ought to adopt *any* dominating function, it might recommend $C_{dogmatic}$. But $C_{dogmatic}$ is intuitively epistemically irrational because it violates norms of evidence (e.g., Principal Principle or Reflection).

  Accuracy-firsters (like Pettigrew or Joyce) handle this by arguing that coherence is a **necessary condition** for rationality, not a sufficient one. The dominance argument clears the field of "structurally defective" options. Once you are coherent, other norms (governing how credences should respond to evidence) take over to determine which coherent function is the *best* one for you. The dominance argument alone cannot do that work.

  ### 3. The Circularity of Maximization
  You asked: *"If accuracy is the sole epistemic value... why wouldn't that dominating function count as the uniquely rational credence function?"*

  To identify a uniquely rational function based on a value, one typically uses a **maximization** principle: "Adopt the option that maximizes expected accuracy."

  However, to calculate *expected* accuracy, you need to weight the accuracy in each possible world by the probability of that world obtaining. But in this context, **those probabilities are the very credences you are trying to justify.**
  *   To choose the best credence function, you need to calculate expected accuracy.
  *   To calculate expected accuracy, you need a credence function.
  *   Therefore, you cannot use expected accuracy to select your fundamental credence function without circularity.

  This is why accuracy-firsters rely on **Dominance** rather than **Maximization**. Dominance is a weaker principle that does not require assigning probabilities to worlds. It simply says: "If Option B is better than Option A in every single world, you shouldn't choose A." This avoids the circularity, but it also sacrifices the ability to pinpoint a single best option. It creates a "floor" (don't be incoherent) rather than a "ceiling" (be this specific way).

  ### 4. What the Result Actually Establishes
  So, what should we take the result to establish? It is best understood as a **consistency constraint**, analogous to logical consistency.

  *   **Logic:** If your beliefs are logically inconsistent (e.g., believing $P$, believing $P \to Q$, and believing $\neg Q$), logic tells you that you are irrational. It does *not* tell you which belief to drop. You could drop $P$, drop the conditional, or drop $\neg Q$. Logic alone doesn't decide.
  *   **Probabilism:** If your credences are probabilistically incoherent, accuracy tells you that you are irrational. It does *not* tell you exactly how to fix them (which dominator to adopt). You must use your evidence and judgment to find a coherent function that also fits your situation.

  ### Summary
  It is a mistake to read the dominance result as directly recommending a particular replacement function because:
  1.  **Non-Uniqueness:** There are many coherent functions that dominate an incoherent one.
  2.  **Evidence Sensitivity:** Not all dominators are evidentially supported.
  3.  **Decision-Theoretic Limits:** Dominance rules out losers; it does not identify winners without a prior probability distribution (which would be circular here).

  The argument establishes that **probabilistic coherence is a necessary condition for epistemic rationality.** It vindicates the probability axioms as norms of consistency, ensuring that your "book" cannot be strictly beaten, but it leaves the substantive work of matching credences to evidence to other epistemic principles.

  **Recommended Reading:**
  If you want to dig deeper into this specific tension, look at **Richard Pettigrew's** work on *Accuracy and the Laws of Credence* (particularly his discussion of decision rules), or **Daniel Levinstein's** papers on "Accuracy and Ur-Prior Conditionalization," which discuss how to move from the negative dominance result to positive updating rules.
