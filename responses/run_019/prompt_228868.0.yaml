  ### 1. Claims we can both sign

  1.  **Definitions:** Presentism holds that only present entities and events exist ontologically. Eternalism holds that past, present, and future entities and events all exist equally within a four-dimensional spacetime manifold.
  2.  **Physics:** We agree Special Relativity is empirically successful and currently our best physical theory of spacetime. We agree it establishes the relativity of simultaneity for spacelike separated events, meaning there is no frame-independent fact about which distant events are simultaneous within the theory's framework. We acknowledge Newtonian absolute time is ruled out empirically.
  3.  **Phenomenology:** We agree that human experience includes a robust, inescapable sense of temporal passage and a distinct qualitative feeling of "now." Neither side dismisses this experience as irrelevant data; both seek to explain its origin. We agree the "specious present" has a measurable duration in psychology.
  4.  **Records:** We agree that records of the past (fossils, memories, documents) exist now and are causally linked to prior events. Presentism does not deny dinosaurs existed; Eternalism does not deny they are absent from the present spatial slice.
  5.  **Epistemology:** We agree that the future is epistemically open; neither of us claims to know future contingent truths with certainty from our current perspective. Deliberation makes sense for both.
  6.  **Change:** We agree that "change" occurs in the world, though we differ on its ontological description (properties changing vs. variation across temporal parts).
  7.  **Language:** We agree that neither view denies the utility of tense in language or the practical asymmetry of agency.
  8.  **Truthmakers:** We agree that truthmakers for past-tense statements must be accounted for, whether they are present traces or past entities.
  9.  **Charity:** We commit to charitable interpretation. We acknowledge this dispute is metaphysical, not empirical regarding daily life. We agree that neither view grants magic powers to the present moment regarding causal influence; causality flows forward in both models. We agree to update our views if new physical evidence regarding spacetime structure emerges. We prioritize logical consistency over intuitive comfort.

  ### 2. Where we actually disagree

  1.  **Ontological Status:** The Presentist claims that past and future entities do not exist *simpliciter*; only present entities exist. To say "dinosaurs existed" is true, but dinosaurs do not currently exist. The Eternalist claims that past and future entities exist *simpliciter*, just as much as present entities, though they occupy different temporal coordinates. To say "dinosaurs existed" is true because dinosaur-temporal-parts exist at earlier coordinates.
  2.  **Nature of Existence:** The Presentist claims existence is fundamentally tensed; to exist is to exist *now*. There is a single, moving spotlight of existence. The Eternalist claims existence is fundamentally tenseless; to exist is to have a location in spacetime, regardless of relation to a specific "now." There is no moving spotlight, only a static manifold.
  3.  **Temporal Passage:** The Presentist claims temporal passage is an objective feature of reality; the set of existing entities changes over time. Reality itself undergoes metamorphosis. The Eternalist claims temporal passage is a subjective feature of consciousness; the set of existing entities is static, and "moving" through it is a psychological phenomenon akin to scanning a map.
  4.  **Privilege of Now:** The Presentist claims the present moment is metaphysically privileged across the universe. The Eternalist claims the present moment is indexically privileged (like "here") for the observer but not metaphysically unique in the structure of spacetime.
  5.  **Relativity Interpretation:** The Presentist claims SR describes measurements but does not dictate ontology regarding simultaneity. The Eternalist claims SR's geometry dictates that no global present exists, forcing Eternalism.

  ### 3. The cruxes

  1.  **Relativity of Simultaneity:** Does the lack of frame-independent simultaneity entail Eternalism?
      *Evidence:* The Rietdijk-Putnam argument using SR light cones and Lorentz transformations.
      *Presentist Prediction:* SR is about measurement/causality, not ontology. A privileged frame may exist undetectably, or presentism can be made relativistic (e.g., fragmentalism). Settling this requires proving ontology must follow coordinate geometry.
      *Eternalist Prediction:* SR's geometry rules out a global present. Accepting SR forces accepting the block universe. Settling this requires showing a coherent presentist physics is impossible.
  2.  **Phenomenology of Passage:** Is the feeling of time passing a datum or an illusion?
      *Evidence:* Neuroscience of time perception, psychological studies on the specious present, and philosophical appeals to intuition.
      *Presentist Prediction:* Passage is fundamental. Any theory denying it is incomplete or false. Settling this requires proving experience cannot be veridical if metaphysics is static.
      *Eternalist Prediction:* Passage is a cognitive construct generated by memory accumulation and entropy. Physics need not accommodate it as fundamental. Settling this requires proving experience is reliable regarding metaphysical structure.
  3.  **Truthmakers:** What makes past-tense statements true?
      *Evidence:* Philosophical analysis of truthmaking principles and logical consistency.
      *Presentist Prediction:* Present evidence (traces) or primitive past-tensed facts suffice. Settling this requires showing present traces are insufficient truthmakers.
      *Eternalist Prediction:* Only existing entities (past temporal parts) can truthfully ground statements about them. Settling this requires showing existence is not required for truthmaking.
      *Implications:* Settling Crux 1 determines if physics dictates metaphysics. Settling Crux 2 determines if phenomenology dictates metaphysics. Settling Crux 3 determines logical constraints on ontology. If Crux 1 goes Eternalist, Presentist must modify view. If Crux 2 goes Presentist, Eternalist must accommodate passage.

  ### 4. Fights we realised were just about words

  1.  **Existence:** We often say "X is not real" when we mean "X does not exist now." The Eternalist says Caesar is real (in 44 BC). The Presentist says Caesar is not real (now). We agree Caesar crossed the Rubicon. We debate the definition of "exist," not the fact.
  2.  **Change:** We argue about whether objects "change." The Presentist means an object alters properties. The Eternalist means an object has different properties at different times. We agree the apple was green and is red. We debate whether variation across time counts as "change."
  3.  **Space vs. Time:** The Presentist accuses the Eternalist of treating time "just like space." The Eternalist clarifies they acknowledge causal asymmetry. We agree time is distinct from space physically; we disagree on whether that distinction is ontological. Clarifying these definitions reduces heat but does not solve the disagreement.
