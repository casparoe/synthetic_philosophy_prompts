answer: |-
  ### The Biosecurity Marginalist: A Decision Problem

  **1. The Scenario**
  Elena is a philanthropist with \$1 million of disposable capital to allocate this fiscal year. She faces a choice between two established charitable avenues. She is an expected-utility maximizer. The question is which utility function correctly represents the value of human life: an unbounded function (linear in lives saved) or a bounded function (exhibiting diminishing marginal value at high magnitudes).

  **Option A (Direct Aid):** Elena donates to a proven malaria prevention initiative. Based on historical data and current epidemiological models, this intervention will save **100 lives** with near certainty ($P \approx 1$).

  **Option B (Policy Advocacy):** Elena funds a niche biosecurity policy research program. The goal is to close a specific regulatory gap in pathogen screening. The causal chain is ordinary but contingent:
  1.  The research must identify the specific regulatory flaw (Probability: 0.1).
  2.  The policy recommendation must be adopted by a relevant national health agency (Probability: 0.1).
  3.  A natural pandemic outbreak must occur within the next decade that would have exploited this specific gap (Probability: 0.1).
  4.  The mitigation must successfully prevent the pandemic's spread, saving an estimated **5,000,000 lives** (a moderate-severity pandemic scenario).

  The conjunction of these independent, mundane probabilities yields a pivotal probability of **$1 \times 10^{-4}$ (1 in 10,000)**. If the chain fails, the intervention saves **0 lives**.

  **2. Formal Specification**

  | Act | State | Probability | Outcome (Lives Saved) |
  | :--- | :--- | :--- | :--- |
  | **$A_{aid}$** (Direct Aid) | Certain | $1.0$ | $100$ |
  | **$A_{policy}$** (Advocacy) | Success | $10^{-4}$ | $5,000,000$ |
  | | Failure | $1 - 10^{-4}$ | $0$ |

  **3. Utility Functions**
  To ensure the disagreement traces specifically to boundedness rather than general risk aversion, we calibrate both functions to agree on ordinary scales. Let $L$ be the number of lives saved.

  *   **Unbounded Utility ($U_u$):** Linear in lives.
      $$U_u(L) = L$$
  *   **Bounded Utility ($U_b$):** Asymptotic, mimicking linearity at low magnitudes but capping value at high magnitudes. We use a scaled hyperbolic tangent function:
      $$U_b(L) = 2000 \cdot \tanh\left(\frac{L}{2000}\right)$$
      *Calibration Check:* For small $L$, $\tanh(x) \approx x$, so $U_b(L) \approx L$. For $L=100$, $U_b(100) \approx 99.9$. For $L=5,000,000$, $U_b(L)$ approaches the asymptote of $2000$.

  **4. Theoretical Verdicts**

  **Expected Utility Maximization (Unbounded)**
  *   **$EU(A_{aid})$:** $1.0 \times U_u(100) = 100$.
  *   **$EU(A_{policy})$:** $(10^{-4} \times 5,000,000) + ((1-10^{-4}) \times 0) = 500$.
  *   **Verdict:** $500 > 100$. The unbounded agent **must** choose *Option B*.
  *   **Interpretation:** To a sensible reader, this verdict is fanatical. It prescribes ignoring 100 certain deaths to purchase a 1-in-10,000 lottery ticket for a pandemic prevention, despite the odds being comparable to rare but mundane risks.

  **Expected Utility Maximization (Bounded)**
  *   **$EU(A_{aid})$:** $1.0 \times U_b(100) \approx 99.9$.
  *   **$EU(A_{policy})$:** $10^{-4} \times U_b(5,000,000)$. Since $5,000,000 \gg 2000$, $\tanh(\frac{5,000,000}{2000}) \approx 1$. Thus, $U_b(5,000,000) \approx 2000$.
      $$EU(A_{policy}) \approx 10^{-4} \times 2000 = 0.2$$
  *   **Verdict:** $99.9 > 0.2$. The bounded agent chooses *Option A*.
  *   **Interpretation:** This aligns with common sense. The massive payoff is "discounted" not by probability, but by the utility ceiling, rendering the low probability decisive.

  **5. Structural Feature Analysis**
  The structural feature doing the work is the **linearity of the utility function over the domain of the tail outcome**.

  In the unbounded calculation, the magnitude of the payoff ($5,000,000$) linearly compensates for the small probability ($10^{-4}$), generating an expected value ($500$) that dwarfs the certain option ($100$). In the bounded calculation, the utility function imposes a ceiling on the payoff's value (capping at $\approx 2000$ utility units). This ceiling prevents the magnitude from compensating for the probability, causing the probability term to dominate the calculation. The divergence is not driven by risk aversion (curvature at low stakes) but by the *absence of an upper bound* on value aggregation in the unbounded model.

  **6. Pascal's Mugging and the Bounded Defense**

  **Would deleting this feature collapse the case into a Pascal's Mugging?**
  **No.** Deleting the linearity (i.e., imposing boundedness) resolves the fanaticism; it does not create a mugging. A standard Pascal's Mugging relies on *epistemic* fragility—specifically, a probability that is either arbitrarily small (e.g., $10^{-100}$) or lacks an ordinary causal chain (e.g., a stranger claiming magic powers).

  This case avoids being a Pascal's Mugging because of the **ordinary causal chain** constraint (research $\to$ policy $\to$ mitigation). The probability $10^{-4}$ is derived from conjunctions of mundane events, not magic. If you were to delete the *causal chain* feature (making the probability epistemically baseless), *then* the case would collapse into a standard Pascal's Mugging. However, the feature driving the *divergence* between the two theories is the utility structure, not the epistemic grounding.

  **The Bounded Defender's Attack**
  A defender of bounded utility attacks the unbounded calculation by rejecting the axiom that $U(L) = L$ holds for all $L$. They argue that the unbounded calculation is **mathematically valid but axiologically false**.

  *   **Does this rebut the calculation or change the subject?**
      Strictly speaking, it **rebuts the calculation's normative force** by attacking its premises. The unbounded theorist claims the calculation proves Option B is rational. The bounded theorist replies that the calculation only proves Option B is rational *if* value is linear. By demonstrating that linearity leads to fanatical verdicts in empirically grounded cases (like this one), the bounded defender argues that linearity is the faulty premise.
      However, an unbounded defender might claim this **changes the subject** from decision theory (how to choose given values) to value theory (what values we should hold). They might argue that if the math dictates Option B, and we reject Option B, we are simply refusing to accept the implications of our own moral commitments. The bounded defender counters that reflective equilibrium requires us to adjust our moral commitments (utility function) when they yield absurd practical verdicts, even in non-mugging scenarios.

  **Conclusion for the Paper**
  This case demonstrates that bounded utility is not merely a patch for "magic" probabilities (Pascal's Mugging). It is a necessary constraint for rational decision-making even when probabilities are mundane ($10^{-4}$) and payoffs are physically possible (5 million lives). The fanaticism arises from the structure of value aggregation, not just the structure of belief.
