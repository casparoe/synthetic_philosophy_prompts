      *   **Reframe the Game:** Turn it from a Prisoner's Dilemma into a Coordination Game or a Trust Game.
      *   **Legal Check:** Crucial. Can he actually "unilaterally claim a larger share"? Usually, partnership distributions require agreement. If he takes money without consent, that's a lawsuit waiting to happen.
      *   **Negotiation Strategy:** Propose a binding contract that *removes* the option to defect. Escrow the funds. Tie renovations to sale proceeds, not monthly draws.
      *   **The "Tit-for-Tat" Signal:** Show willingness to cooperate but readiness to punish defection (legally).

  5.  **Drafting the Response (Iterative refinement):**
