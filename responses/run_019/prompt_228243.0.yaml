  Immediately upon plugging it in, I activated the included "Demo Mode." The manual describes a cycle where the lamp toggles on and off in halving intervals. It starts at 30 seconds, then 15, then 7.5. Fine. But the manual explicitly refuses to state the status of the bulb at the 60-second mark. I read the troubleshooting section three times. It says: "The state of the lamp at t=60s is not logically determined by the sequence preceding it." Are you kidding me? I paid $49.99 for a lamp that doesn't know if it's on or off after one minute. There is no setting for "undefined." I need light or I don't.

  When I tried to contact support, the representative kept reading from a script claiming the instruction booklet is "complete and consistent." I told him the booklet is missing the most important piece of information: is there light or not? He told me my question was "ill-posed" and that the description of the supertask does not entail a specific outcome at the limit. He hung up on me when I asked if the limit was covered under warranty. This is unacceptable customer service. If the product cannot guarantee a binary state, it should not be sold as a binary switch.

  Furthermore, the hardware cannot handle the specs. The demo requires infinite toggles within a finite minute. The switch mechanism is rated for 50,000 clicks. It achieved approximately 40,000 clicks in the first 45 seconds before melting. There was smoke. The bulb began vibrating at a frequency that made my teeth ache. The heat radiating from the base was intense, which makes sense given the energy required to perform infinitely many actions in a minute. I understand engineering limitations, but advertising an infinite task on finite hardware is false advertising. I expect a lamp to handle the workload described on the box without catching fire.

  My roommate, who is studying electrical engineering, tried to hack the limit state. He soldered a jumper wire directly into the circuit at the one-minute mark to force the light ON. Technically, the lamp now "works," but it feels like a workaround. The light flickers violently until the 60-second mark, then suddenly snaps on because my roommate decided it should. It lacks integrity. It's not a natural conclusion; it's an arbitrary assignment. It creates a discontinuity in the function of the device. Plus, the electricity bill for my dorm room has tripled. I don't know how you bill for infinite energy consumption, but the university bursar is asking questions.

  The return policy is the final insult. To qualify for a refund, the item must be returned in the same condition it was received. However, since the state at t=60s is undefined, I cannot verify the condition of the unit after use. If I return it off, you could claim it was on. If I return it on, you could claim it was off. The manual states "Final state not covered under warranty," which I assume means you won't accept returns based on the outcome of the demo. It's a catch-22 designed to keep my money.

  This is a scam. The company is selling a supertask as a feature without providing the necessary metaphysical infrastructure to support it. Do not buy this unless you enjoy staring at a vibrating bulb while customer service gaslights you about logical consistency. I want a full refund, provided you can define the state of my bank account after the transaction processes.
