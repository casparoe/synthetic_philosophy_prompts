answer: |-
  This is a sophisticated set of intuitions. You have correctly identified that the standard futarchy slogan ("vote on values, bet on beliefs") obscures a deeper philosophical tension. Your hesitation isn't about *uncertainty* (markets handle uncertainty well); it's about *legitimacy* and *commensurability*.

  Based on your six cases, here is the principle that best captures your verdicts, followed by its application to your test case and a challenge to your existing intuitions.

  ### The Principle: Consequentialist Optimization vs. Deontological Constraints

  Your pattern distinguishes between decisions that are **technical optimizations within a settled moral framework** and decisions that **define or violate the moral framework itself.**

  *   **Markets work for Consequentialist Optimization:** When the goal is to maximize a metric (efficiency, safety, stability) and the moral boundaries are already agreed upon, markets are superior at aggregating information.
  *   **Markets fail for Deontological Constraints:** When the decision involves fundamental rights, duties, or human dignity, treating the outcome as a mere variable to be optimized is morally illegitimate. In these domains, the *process* matters as much as the *result*, and certain trade-offs are forbidden regardless of the utility gain.

  #### How this maps to your cases:

  1.  **Light Rail (Accept):** This is infrastructure optimization. The moral framework (public transit is good, budgets matter) is settled. We are optimizing for flow and cost.
  2.  **Same-Sex Marriage (Reject):** This is a rights question. Framing it as a utility calculation (GDP/Life Satisfaction) implies that equality is negotiable if the numbers don't work out. That violates the deontological constraint of equal dignity.
  3.  **Interest Rates (Accept):** This is macroeconomic stabilization. It is purely consequentialist. There is no "right" to a specific interest rate; there is only the goal of stability.
  4.  **Drug Approval (Accept with caveats):** This is safety optimization. It sits near the boundary (right to health), but the FDA process is already bureaucratic/statistical. You accept it because it treats *populations* statistically, not individuals morally.
  5.  **Military Invasion (Reject):** War involves "Just War" theory (deontological). Even if an invasion is "cheap" and has "few casualties" (consequentialist win), it may be unjust (deontological loss). A market cannot price "justice" or "sovereignty."
  6.  **Pretrial Detention (Reject):** This is the strongest signal. Our legal system is deontological (presumption of innocence, due process). Detaining someone based on *probability* of future crime treats them as a risk object rather than a rights-bearing agent. It commodifies liberty.

  ### The Test Case: School Curriculum (Science vs. Programming)

  **Verdict: Reject the market.**

  **Reasoning:** Education is not purely an economic input; it is a formative process for citizenship and human development.
  If you use a market forecasting **long-term earnings**, you are implicitly defining the value of education as **economic output**.
  *   **The Metric Problem:** Earnings are commensurable (money). Critical thinking, civic engagement, scientific literacy, and personal fulfillment are not. A market will inevitably optimize for the metric it can measure (earnings) at the expense of the values it cannot (curiosity, truth, citizenship).
  *   **The Rights Problem:** Similar to pretrial detention, this treats students as future economic units rather than individuals with a right to a holistic education. It commodifies the child's future.

  Under your principle, curriculum decisions are closer to **Same-Sex Marriage** (defining social values) than **Light Rail** (moving bodies efficiently).

  ### Which Verdicts Must You Give Up?

  To be fully consistent with the **Consequentialist vs. Deontological** principle, you likely need to tighten your acceptance in **Case 1 (Light Rail)** and **Case 4 (Drug Approval)**.

  **1. The Light Rail Problem (Case 1)**
  *   **The Inconsistency:** You reject betting on individual liberty (Detention) but accept betting on community displacement. Light rail projects often use eminent domain and disproportionately affect poor neighborhoods (gentrification).
  *   **The Fix:** If "property rights" and "community integrity" are deontological constraints (like liberty), a market forecasting only "ridership and commute time" is illegitimate. It optimizes for flow while ignoring the rights violation of displacement.
  *   **Adjustment:** You should only accept the market if the metric *includes* compensation for displacement and community cohesion. If those can't be priced, the market shouldn't decide.

  **2. The Drug Approval Problem (Case 4)**
  *   **The Inconsistency:** You find betting on a defendant's risk "repugnant" (Case 6), but you are mostly okay with betting on patient deaths (Case 4).
  *   **The Fix:** The distinction you are relying on is **Aggregate vs. Individual.** Markets are okay for populations (Drug Approval, Interest Rates) but not specific people (Detention).
  *   **Adjustment:** You need to be very careful here. If the "independent checking" you requested for drugs is robust, you are essentially admitting the market *alone* isn't enough. To be consistent with your rejection of Detention, you must acknowledge that **human life cannot be fully captured by a "death count" metric.** Side effects, quality of life, and access inequality are deontological concerns that a "death market" might ignore. You should be more skeptical of Case 4 than you currently are.

  ### Summary of the Principle

  **"Markets are legitimate tools for optimizing efficiency within settled moral boundaries, but they are illegitimate tools for setting moral boundaries or trading off fundamental rights."**

  *   **Light Rail:** Optimizing efficiency. (OK, provided rights aren't trampled).
  *   **Interest Rates:** Optimizing stability. (OK).
  *   **Drug Approval:** Optimizing safety. (OK, but high risk of metric manipulation).
  *   **Marriage:** Setting moral boundaries. (Not OK).
  *   **Invasion:** Violating moral boundaries. (Not OK).
  *   **Detention:** Trading off fundamental rights. (Not OK).
  *   **School Curriculum:** Defining human development. (Not OK).

  Your gut is telling you that **some things are not for sale**, even if the "currency" is prediction shares rather than dollars. Futarchy works best in the boardroom; it fails in the courtroom and the classroom.
