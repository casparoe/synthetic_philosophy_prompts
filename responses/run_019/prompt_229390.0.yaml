  Part of the fight is verbal. Exploitationists use "exploitation" technically (surplus value extraction), while Alienationists often use it normatively (unjust domination). This creates confusion: a co-op might be technically exploitative (surplus reinvested for growth) but normatively just (self-directed). However, semantics aren't the whole story.

  The load-bearing crux is whether alienation without exploitation is possible (the co-op case). If market co-ops remain alienated due to competitive pressure, the Alienationist must concede that structural imperatives trump individual agency. If co-ops flourish, the Exploitationist must concede that distribution isn't primary.

  I commit to the Alienationist framing as deeper, but with the Exploitationist's structural caveat. Exploitation describes a mechanism of transfer; alienation describes the human cost. You can compensate exploitation (higher wages), but you cannot compensate alienation (meaningless activity) without changing the activity itself. Therefore, the co-op case is decisive. If co-ops fail to reduce alienation, Marx's critique collapses into a demand for fairer capitalism. If they succeed, the critique is ontological.

  The evidence suggests market imperatives force co-ops to mimic capitalist hierarchies to survive. Thus, the Exploitationist is right that structure dictates outcome, but wrong that distribution is the fix. The real fix is abolishing the market imperative itself, which satisfies both: it stops exploitation by ending surplus extraction for profit and ends alienation by allowing production for need. The scholars agree on the solution (communism) but disagree on why it works. The Alienationist explains *why* we want communism better; the Exploitationist explains *how* capitalism prevents it. The fundamental error of capitalism is treating labor as a commodity, which generates both exploitation and alienation simultaneously. Separating them analytically is useful, but ontologically they are twin symptoms of wage labor. The real load-bearing question is not which wrong is worse, but whether removing one removes the other. My verdict: Alienation is the disease; exploitation is the fever. Treating the fever helps, but only curing the disease saves the patient.
