  2.  **Deconstruct the Phrase ("The Undeserving Poor"):**
      *   *Claim 1: Factual/Causal.* Some people are poor because of their own choices/behavior (laziness, fraud) rather than external circumstances.
      *   *Claim 2: Moral/Normative.* People who are poor due to their own choices do not merit unconditional aid; they owe labor/behavior change in return.
