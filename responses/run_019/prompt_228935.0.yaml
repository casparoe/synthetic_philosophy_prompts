answer: |-
  This is an excellent EPQ topic. Your intuition is correct: the Pluto case is often lazily cited as a "classic verbal dispute" in pop science, but philosophically, it is a minefield. It challenges the standard tools we use to separate verbal from genuine disputes.

  Here is an analysis of the Pluto controversy through the lens of the philosophy of language and science, structured to help you build your argument.

  ### 1. Stress-Testing the "Naive Take" with Chalmers

  David Chalmers, in *Verbal Disputes* (2011), proposes a specific test. A dispute is verbal if, once the ambiguous terms are disambiguated, the disagreement disappears. He suggests we look for a **canonical form**:
  *   Party A asserts $S$.
  *   Party B asserts $\neg S$.
  *   The dispute is verbal if there is a sentence $S'$ such that A accepts $S'$, B rejects $S'$, and $S'$ captures the *substantive* disagreement. If no such $S'$ exists (because they agree on all non-linguistic facts), it's verbal.

  **Applying this to Pluto:**
  *   **Pro-Pluto:** "Pluto is a planet."
  *   **IAU:** "Pluto is not a planet."
  *   **Facts agreed upon:** Pluto's mass, orbit, composition, sphericity, and inability to clear the Kuiper Belt.

  If we apply Chalmers' test strictly, this looks verbal. If the Pro-Pluto side means "round object orbiting the sun" and the IAU means "dynamically dominant object," they aren't contradicting each other about the world; they are talking past each other.

  **However, the test fails in practice.** As you noted, the dispute did *not* dissolve. Astronomers like Alan Stern (Principal Investigator of New Horizons) remain furious. Why? Because the dispute shifted from "Is $S$ true?" to "**Which definition should we adopt?**"

  This suggests the Pluto case is not a *merely* verbal dispute in the trivial sense, but what philosophers David Plunkett and Timothy Sundell call a **metalinguistic negotiation**. The disagreement is about which conceptual tool is best for the job of astronomy. That is a substantive disagreement about scientific goals, even if it is enacted through language.

  ### 2. Verbal vs. Pointless: The Stakes of Taxonomy

  Your teacher might imply that if a dispute is verbal, it is pointless. This is a category error. In science, taxonomy is theory-laden.

  *   **The IAU View (Dynamical):** Defining "planet" by "clearing the neighbourhood" groups objects by their *formation history* and *gravitational dominance*. This helps model how solar systems evolve.
  *   **The Geophysical View (Stern et al.):** Defining "planet" by "hydrostatic equilibrium" (roundness) groups objects by their *internal complexity*. A round body has geology, atmosphere, and potential habitability. A jagged asteroid does not.

  **Why this matters:**
  If "planet" means "geologically complex," then Pluto is a target for astrobiology funding. If "planet" means "dynamically dominant," Pluto is a leftover scrap.
  Therefore, the dispute is **verbal in mechanism** (about the word "planet") but **substantive in consequence** (about funding, research focus, and public engagement).

  **Philosophical Application:**
  This aligns with Rudolf Carnap's idea of **explication**. We aren't discovering the "true" meaning of planet (there is no Platonic form of Planet); we are proposing a replacement for a vague concept to serve specific scientific purposes. The dispute is genuine because the *purposes* clash.

  ### 3. The Meta-Question: Can We Tell From the Inside?

  This is the strongest part of your EPQ argument. If intelligent experts (astronomers) cannot agree on whether they are arguing about facts or words, does the distinction have value?

  **The Epistemic Problem:**
  From the inside, verbal disputes feel genuine. When the IAU voted, proponents spoke as if they were discovering a fact ("Pluto *isn't* a planet"), not making a policy decision ("We *vote* that Pluto won't be called a planet").
  *   **Reason 1:** Language is transparent. We look *through* words at the world, not *at* the words. It requires a second-order philosophical step to realize, "Wait, we agree on the physics, we just hate the label."
  *   **Reason 2:** Social Stakes. The label "planet" carries cultural capital. Losing the title felt like a demotion in status, which triggers emotional, "real" responses even if the basis is semantic.

  **Does the distinction do any work?**
  Yes, but not as a "dismissal tool."
  *   **Bad Use:** "Oh, you're just arguing about definitions, stop talking." (This shuts down the metalinguistic negotiation about scientific goals).
  *   **Good Use:** "We agree on the physics. Let's stop arguing about whether Pluto *is* a planet and argue about which classification system yields better predictive models for exoplanets."

  The distinction is useful **heuristically**. It forces participants to isolate the empirical claims from the terminological policies. If you can't isolate an empirical claim that would settle the argument, you know you are in a verbal/metalinguistic dispute.

  ### 4. The Verdict and Weaknesses

  Here is where you need to be honest for your EPQ assessment.

  **My Analysis:**
  The Pluto dispute is a **substantive metalinguistic dispute**. It is not "merely verbal" in the sense of being a confusion to be dissolved (like arguing whether a "bank" is a river side or a financial institution). It is a negotiation about how to carve nature for scientific utility.

  **Where the argument is weakest:**
  The weakness lies in distinguishing "conceptual choice" from "fact discovery." Realists about natural kinds (like Ted Sider) might argue there *is* a fact of the matter about whether "planet" maps onto a structural joint in nature. If "planet" is a natural kind, the IAU could be *wrong*, not just different. If the dispute is about which definition "carves nature at the joints," it is a genuine metaphysical dispute, not just a linguistic one.

  **What would flip the verdict to "Merely Verbal"?**
  I would conclude it was purely verbal if:
  1.  **Predictive Equivalence:** It could be demonstrated that using the IAU definition vs. the Geophysical definition leads to **identical** research outcomes, funding allocations, and theoretical models, with the only difference being the word used in press releases.
  2.  **No Historical/Formation Link:** If it turned out that "clearing the neighbourhood" had *no* correlation with formation history or system dynamics, rendering the IAU criterion arbitrary compared to the roundness criterion.

  **What would flip the verdict to "Genuine Empirical Dispute"?**
  I would conclude it was a genuine factual dispute if:
  1.  **Hidden Variable:** New data revealed that Pluto *does* clear its neighbourhood (perhaps our measurements of the Kuiper Belt mass were wrong), satisfying the IAU criterion empirically.
  2.  **Natural Kind Discovery:** We discovered a fundamental physical property unique to the 8 classical planets (e.g., a specific isotopic signature from formation) that Pluto lacks, making "planet" a natural biological-style category rather than a human taxonomy.

  ### Summary for your EPQ

  1.  **Don't accept the binary.** The Pluto case shows that "verbal" and "genuine" aren't always mutually exclusive. A dispute can be about words *and* matter deeply (Metalinguistic Negotiation).
  2.  **The Dissolution Test is insufficient.** The fact that the anger persisted proves that definitions carry theoretical weight.
  3.  **The Meta-Lesson:** The value of identifying a verbal dispute isn't to end the conversation, but to relocate it. Move from "Is it a planet?" to "What concept of 'planet' helps us understand the universe best?"

  This approach shows you understand the philosophical tools (Chalmers, Carnap, Metalinguistic Negotiation) but are critical of their application in real-world scientific contexts. That is exactly what an EPQ examiner wants to see.
