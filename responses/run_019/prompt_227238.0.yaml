      *   (3) **Harassment Exception:** Sustained targeted harassment of a specific person is actionable (employer/law).
      *   (4) **Public Speech Standard:** Punishable only if intended + likely to produce *imminent lawless action* (Brandenburg test).
      *   (5) **Plagiarism:** Not a free speech issue (contractual/academic integrity).
      *   (6) **Private Platforms:** Not censorship (state action doctrine).

  3.  **Brainstorming Tensions/Conflicts:**

