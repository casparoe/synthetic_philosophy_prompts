answer: |-
  **JOINT STATEMENT OF THE ADVERSARIAL COLLABORATION ON THE NORM OF ASSERTION**

  **Date:** 24 May 2024
  **Parties:** The Knowledge Norm Working Group (Party K) and The Truth Norm Working Group (Party T)
  **Facilitated by:** The Analytic Epistemology Consortium

  **Preamble**
  We, the undersigned parties, acknowledge that we have engaged in a year-long dialectical exchange regarding the constitutive rules governing the speech act of assertion. While we remain in fundamental disagreement regarding the specific content of the distinctive norm of assertion, we have identified substantial common ground regarding the structure of the practice and the nature of normative evaluation. This document records our agreements, isolates our precise residual disagreement, and identifies the empirical and intuitional cruxes that determine the outcome of our debate. This statement is not a compromise; it is a mapping of the dispute.

  ### 1. Substantive Claims Accepted by Both Parties

  Both Party K and Party T endorse the following claims. We regard these as non-negotiable constraints on any adequate theory of assertion.

  1.  **Assertion is Normative:** Assertion is not merely a causal release of information but a practice governed by rules or norms. To assert is to subject oneself to evaluation; an assertion can be correct or incorrect in a way that mere sounds or guesses are not.
  2.  **The Falsehood Constraint:** It is always improper to assert a proposition that is false. No excusing conditions render a false assertion *correct*, though they may render the speaker *blameless*.
  3.  **The Evidence Constraint:** It is always improper to assert a proposition for which one lacks adequate evidence. Both parties agree that asserting without evidence is a violation of *some* significant norm governing the speaker, even if we disagree on whether this norm is constitutive of assertion itself or derivative of a norm of rationality.
  4.  **The Distinction between Propriety and Blameworthiness:** An assertion may be objectively improper while the speaker is subjectively blameless. A speaker may satisfy all internal rational requirements (e.g., believing they know, having apparent evidence) and yet violate an objective rule. Conversely, a speaker may satisfy an objective rule while being subjectively blameworthy (e.g., asserting a known truth for malicious ends).
  5.  **The Primacy of the First-Person Perspective:** In ordinary discourse, speakers treat the question "Do I know $p$?" and "Is $p$ true?" as closely linked deliberative guides. Both parties agree that a theory of assertion must explain why speakers naturally deliberate about knowledge and evidence before asserting, even if the constitutive rule concerns only truth.
  6.  **Moorean Absurdity:** Utterances of the form '$p$, but I do not believe that $p$' are inherently defective. Both parties agree that a viable norm of assertion must explain the impossibility of coherently making such an assertion.

  ### 2. Statement of Residual Disagreement

  Having clarified our terminology, we recognise that several apparent disputes have dissolved. Specifically, we agree that assertion is subject to a *plurality* of norms (moral, prudential, conversational, and epistemic). We agree that a speaker who asserts a truth without evidence may be criticised as reckless. The disagreement is not about whether such criticism is appropriate, but about **classification**.

  **The Dissolved Dispute:**
  We no longer dispute whether a lucky true assertion (a true guess) is *ideal*. Both parties agree it is epistemically inferior to a knowledgeable assertion. We no longer dispute whether a speaker who asserts without knowledge is *criticisable*. Both parties agree they are open to criticism. The dispute is strictly about whether the criticism targets a violation of the **rule of assertion** or a violation of a **collateral norm** (such as a norm of belief or rationality).

  **The Genuine Disagreement:**
  The remaining disagreement concerns the individuation of the speech act. We disagree on which norm is *distinctive* to assertion—that is, which norm distinguishes assertion from other truth-directed activities like guessing or conjecturing.

  *   **Party K Formulation:** The constitutive rule of assertion is the **Knowledge Norm**.
      *   *Rule:* One must: assert $p$ only if one knows $p$.
      *   *Implication:* An assertion of a true proposition $p$, made without knowledge of $p$, violates the rule of assertion. It is constitutively improper *qua* assertion, regardless of its truth.

  *   **Party T Formulation:** The constitutive rule of assertion is the **Truth Norm**.
      *   *Rule:* One must: assert $p$ only if $p$ is true.
      *   *Implication:* An assertion of a true proposition $p$, made without knowledge of $p$, satisfies the rule of assertion. It is constitutively proper *qua* assertion, though it may violate collateral norms of evidence or rationality.

  **Summary of the Divide:**
  Party K maintains that the Truth Norm is insufficient because it fails to distinguish assertion from lucky guessing. Party T maintains that the Knowledge Norm is over-generative because it conflates the rule of the act with the prerequisites for responsible performance. For Party K, a true assertion without knowledge is a failed assertion. For Party T, it is a successful assertion performed irresponsibly.

  ### 3. Cruxes and Test Cases

  We identify the following cruxes. Settlement of these points would compel at least one party to revise their position. For each crux, we specify a concrete case and record the divergent predictions regarding the normative status of the assertion in question.

  **Crux 1: The Gettiered Assertion**
  *   **The Case:** A speaker asserts $p$. The proposition $p$ is true. The speaker has a justified belief that $p$. However, the speaker's belief is Gettiered (justified and true, but not knowledge due to environmental luck or false lemmas).
  *   **Party K Prediction:** The assertion is **improper**. The speaker has violated the constitutive rule of assertion because they lack knowledge. The criticism "You shouldn't have asserted that; you didn't know it" is a direct appeal to the rule of assertion.
  *   **Party T Prediction:** The assertion is **proper** (regarding the rule of assertion). The speaker has satisfied the constitutive rule because $p$ is true. The criticism "You shouldn't have asserted that" must be parsed as an appeal to a collateral norm of evidence or rationality, not the rule of assertion itself.

  **Crux 2: The Lucky True Guess**
  *   **The Case:** A speaker has no evidence for $p$ and does not believe they know $p$. They assert $p$ as a pure guess. By chance, $p$ is true.
  *   **Party K Prediction:** The assertion is **double-improper**. It violates the Truth Norm (in expectation) and definitely violates the Knowledge Norm. Even though $p$ is true, the act was not permitted by the rules of the practice. The truth of $p$ does not retroactively render the assertion permissible.
  *   **Party T Prediction:** The assertion is **proper** (regarding the rule of assertion). Since $p$ is true, the constitutive rule is satisfied. The speaker is criticisable for recklessness, but this criticism attaches to the speaker's rationality, not to the speech act of assertion *per se*. If the guess had been false, it would have been improper; since it is true, it is not.

  **Crux 3: The Blameless Falsehood**
  *   **The Case:** A speaker asserts $p$. The speaker has overwhelming evidence and knows (by all internal lights) that they know $p$. However, $p$ is false (due to sceptical scenarios or misleading evidence).
  *   **Party K Prediction:** The assertion is **improper** but **excusable**. The rule (Know $p$) is violated because knowledge requires truth. However, the speaker is not blameworthy because they satisfied the subjective requirements. The violation of the rule is objective.
  *   **Party T Prediction:** The assertion is **improper** and **inexcusable** (regarding the rule). The rule (Truth) is violated. However, Party T emphasises that the *type* of impropriety is identical to the Gettier case: in both cases, an objective condition for the act's correctness was not met. (Note: Here the parties agree on the verdict 'improper' but disagree on the explanation of Crux 1 and 2. This crux tests whether Party T can maintain that truth is the *only* constitutive norm without making false assertions the only violations).

  **Crux 4: Expert Retrospective Evaluation**
  *   **The Case:** An omniscient observer evaluates an assertion immediately after it is made. The assertion is true, but the speaker lacked knowledge.
  *   **Party K Prediction:** The expert should judge the assertion as **defective**. The expert reports: "That assertion was not allowed, even though it turned out well."
  *   **Party T Prediction:** The expert should judge the assertion as **successful**. The expert reports: "That assertion was allowed, though the speaker was reckless to make it."

  **Signatories**

  _________________________
  Lead Representative, Party K (Knowledge Norm)

  _________________________
  Lead Representative, Party T (Truth Norm)
