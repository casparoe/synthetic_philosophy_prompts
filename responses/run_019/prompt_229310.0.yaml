answer: |-
  It is a pleasure to correspond with a fellow scientist. You have not mangled the vocabulary at all; in fact, your intuition maps precisely onto a classic debate in philosophy of science: *Scientific Realism* (theories describe the world as it is) versus *Instrumentalism* (theories are just tools for prediction). In spectroscopy, you assumed the peaks corresponded to actual molecular vibrations. In ML, we aren't sure if the "features" correspond to actual computational mechanisms or just convenient mathematical fictions.

  Here is the essay package designed for your reading group.

  ***

  ### Essay Question

  **"A linear probe can predict a neural network's classification with 99% accuracy by reading a specific direction in activation space. Does this high accuracy prove the network 'uses' that feature to reason, or merely that the feature is recoverable from the network's state? Define the specific empirical evidence required to distinguish between a feature being a *causal mechanism* versus a *correlational byproduct*."**

  ***

  ### Model Answer

  To answer this, we must distinguish between an ontological claim (what the network *is*) and an epistemic claim (what we can *know* about it). The existence of a high-accuracy probe establishes only the latter: it confirms that information regarding the feature is present in the activation space. It does not establish that the feature plays a functional role in the computation. This is the distinction between *readability* and *causality*.

  Treating predictive success as proof of realism is a category error. In a high-dimensional space, information is often redundantly encoded. A probe may succeed because it finds a "shadow" of the computation cast on the activation space, not because the network explicitly computes using that variable. Consider a Ptolemaic model of the solar system: it predicts planetary positions accurately using epicycles, but the epicycles are not real physical structures. Similarly, a feature might be a mathematically convenient summary of the network's state without being a unit the network actually manipulates. If we treat probe accuracy as sufficient evidence for realism, we conflate the map with the territory.

  To settle the dispute, we must move from observation to intervention. The specific empirical evidence required is **causal abstraction**. We do not ask, "Can we read the feature?" We ask, "If we intervene on this feature, does the network's behavior change in the specific semantic way the feature implies?"

  For example, if we identify a "gender direction" in a language model, simply detecting it proves nothing about mechanism. However, if we surgically alter that vector (counterfactually swapping male for female) and the model's subsequent reasoning shifts *only* in ways consistent with that swap—without degrading general coherence—we have evidence that the network causally relies on that representation. If the intervention breaks the model or produces random noise, the feature was likely a correlational byproduct, not a functional unit.

  Therefore, realism about features is justified only when those features support *stable interventions*. A feature is "real" in the network if it functions as a handle we can pull to control the system's output predictably. Until we demonstrate this causal leverage, we must remain instrumentalists: the features are useful summaries for us, but not necessarily computational primitives for the machine.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Ontology vs. Epistemology (5 Marks)**
  *   **5:** Clearly distinguishes between the feature existing as a causal mechanism (ontology) vs. the feature being detectable by an observer (epistemology/readability).
  *   **3:** Mentions the difference but conflates "information present" with "mechanism used."
  *   **0:** Treats high probe accuracy as synonymous with the feature being "real."

  **2. The "Predictive Success" Trap (5 Marks)**
  *   **5:** Explicitly argues why probe accuracy/saliency is insufficient evidence for realism (e.g., using the redundancy argument or the Ptolemaic/epicycle analogy).
  *   **3:** Acknowledges accuracy isn't everything but fails to explain *why* (e.g., just says "correlation isn't causation" without applying it to the network structure).
  *   **0:** Argues that high accuracy is sufficient proof of the feature's reality.

  **3. Conditions for Settlement (5 Marks)**
  *   **5:** Proposes **causal intervention** (editing activations, causal abstraction, counterfactual testing) as the necessary test.
  *   **3:** Proposes better mathematical tools (e.g., "we need sparser autoencoders") rather than experimental intervention.
  *   **0:** Concludes the dispute is unsolvable or purely semantic ("it depends on definition").

  **4. Argumentative Clarity (5 Marks)**
  *   **5:** Logical flow, precise language, no hand-waving.
  *   **3:** Understandable but vague; relies on jargon without definition.
  *   **0:** Disorganized or unintelligible.

  ***

  ### A Note for the Convener
  You will likely find that scientists trained in experimental fields (like chemistry or physics) naturally gravitate toward the "Causal Intervention" criterion (Section 3 of the scheme). They are used to manipulating variables to test hypotheses. The "philosophical" trap they might fall into is thinking that better mathematics (more sparse autoencoders) solves the ontological problem. The essay question is designed to penalize that move. Good luck with the group.
