      *   *The "It Depends" Dodge:* This usually happens when people conflate the *mathematical existence* of a vector with the *semantic content* assigned to it.
      *   *The "Predictive Success" Trap:* Just because a probe works doesn't mean the network "uses" that feature. It might just be correlated.

