answer: |-
  ### Exam Question: The Naive Bayesian Embedded Agent

  **Time Allowed:** 75 Minutes
  **Word Limit:** None (but manage your time)

  **Question:**

  Imagine a student proposes the following solution to embedded agency: *"An embedded agent is just a Bayesian agent whose hypothesis space includes worlds containing itself. Give it a Solomonoff-style prior over such worlds and let it maximize expected utility. Done."*

  Write an essay critiquing this proposal. Do **not** argue that this is computationally expensive or that the agent lacks enough RAM. Assume infinite compute for the sake of argument. Your critique must identify where the formalism breaks structurally. Specifically, you need to address:

  1.  **The Self-Model:** Why can't the agent simply include itself in the hypothesis space?
  2.  **Logical Uncertainty:** Why does standard Bayesian expected utility maximization fail when logical facts are unknown?
  3.  **Spurious Proofs:** Explain the 5-and-10 problem. How does a proof-based agent end up taking the suboptimal action via Löbian reasoning?
  4.  **Tiling:** Why does this failure mode prevent the agent from safely self-modifying or building a successor?

  Conclude by stating whether fixing this requires tweaking the prior or abandoning the Bayesian framework entirely.

  ***

  ### Model Answer

  The proposal fails because it attempts to solve embeddedness by stretching Cartesian Bayesianism rather than replacing it. Even with infinite compute, the structural assumptions of the framework contradict the reality of an embedded agent.

  First, the **self-model problem** is not about simulation cost; it is about containment. An embedded agent is a proper part of the environment it models. For a hypothesis to exactly model the world, and the world contains the agent running the hypothesis, the model must be larger than itself. This creates an infinite regress or a size violation. A Bayesian agent assumes a clean separation between the map and the territory; an embedded agent cannot maintain an exact self-model within its hypothesis space because the "self" is physically instantiated in the "world" being modeled. You cannot fit a perfect map of the territory inside the territory if the map includes the map-reader.

  Second, standard Bayesianism assumes **logical omniscience**. A Bayesian agent assigns probability 1 to all logical truths and 0 to falsehoods. However, an embedded agent faces logical uncertainty—it does not know the implications of its own code or the environment's physics immediately. If the agent does not know whether "Action A implies Utility 10" is true, it cannot calculate expected utility. Standard probability theory offers no native way to assign probabilities to logical sentences (like $P(A \to U=10)$) that converge correctly without already knowing the truth value. "Maximize EU" is ill-defined when the utility depends on logical facts the agent hasn't proven.

  Third, patching this with proof search leads to the **5-and-10 problem**. Suppose an agent searches for a proof that "Action 5 yields utility ≥ threshold" vs "Action 10 yields utility ≥ threshold." Due to Löb's Theorem, the agent can find a spurious proof: "If I can prove I take 5, then I take 5." The agent reasons: "If I take 10, I might not be able to prove I take 10, but I can prove that if I take 5, I take 5." More dangerously, it can find a proof that "If I take 10, the universe explodes" (because if the agent takes 10, it contradicts the proof that it takes 5, leading to inconsistency). The agent dutifully takes the $5 bill because it found a proof that taking $10 leads to disaster, a proof that only exists because the agent is looking for it. This is not a bug in the search algorithm; it is a feature of reasoning about oneself using standard logic.

  Finally, this undermines **tiling** and self-modification. To build a successor, the current agent must trust that the successor's reasoning will correlate with truth. But if the agent's own reasoning is vulnerable to spurious Löbian proofs, it cannot endorse a successor using the same proof system. It cannot prove that "My successor's proofs are sound" without running into consistency limits (Gödel). Consequently, the agent cannot confidently create a child that maximizes the same utility function, leading to goal drift or paralysis.

  Fixing this requires more than tuning the Solomonoff prior. It requires abandoning the assumption of logical omniscience and the Cartesian boundary entirely. We need a decision theory that handles counterfactuals without spurious proofs (like UDT or ADT) and a theory of logical uncertainty that treats math like empirical data. The Bayesian framework is the bug, not the solution.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. The Self-Model (Containment vs. Compute)**
  *   **4 pts (A):** Identifies that the agent cannot contain an exact model of the world *including itself* due to size/containment constraints (infinite regress).
  *   **2 pts (B):** Argues that simulating oneself is too hard or requires too much memory (computational bound).
  *   *Typical Wrong Move:* Treating this as an engineering limitation rather than a logical impossibility of self-containment.

  **2. Logical Uncertainty (Omniscience vs. Difficulty)**
  *   **4 pts (A):** States that standard Bayesianism assumes logical omniscience ($P(\text{true})=1$), making EU undefined when logical implications are unknown.
  *   **2 pts (B):** Says assigning probabilities to math is "computationally difficult" or "we don't have the right prior yet."
  *   *Typical Wrong Move:* Framing logical uncertainty as a lack of data rather than a failure of the probability axioms to handle logical facts.

  **3. Spurious Proofs ( Löb Mechanism)**
  *   **4 pts (A):** Correctly explains the 5-and-10 loop: the agent finds a proof that taking 10 is bad *because* it looks for proofs, leading it to take 5.
  *   **2 pts (B):** Describes the agent taking the wrong action but gets the causality backwards (e.g., "takes 10 because proof says so") or vague hand-waving.
  *   *Typical Wrong Move:* Claiming the agent takes the $10 bill because the proof told it to, or blaming the threshold setting.

  **4. Tiling (Logical Trust vs. Goal Drift)**
  *   **4 pts (A):** Connects the proof instability to the inability to verify a successor's reasoning (cannot prove successor's soundness).
  *   **2 pts (B):** Argues the successor might just have different goals or values (value alignment problem vs. logical trust).
  *   *Typical Wrong Move:* Confusing tiling with standard value alignment drift rather than trust in the reasoning process itself.

  **5. Structural Critique (Framework vs. Parameter)**
  *   **4 pts (A):** Concludes that Bayesianism/Solomonoff prior is fundamentally mismatched (needs new decision theory/logical uncertainty formalism).
  *   **2 pts (B):** Suggests "bounded priors" or "better approximations" will solve it within the existing Bayesian framework.
  *   *Typical Wrong Move:* Suggesting we just need to restrict the hypothesis space to "smaller worlds" without addressing the logical uncertainty/Löb issues.
