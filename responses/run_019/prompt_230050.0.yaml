answer: |-
  Your intuition is outpacing your principle. Your current principle ("invention is permitted when it fills what the record leaves open and forbidden when it contradicts what the record fixes") is purely *epistemic*. It concerns only the relationship between the artwork and the historical evidence. But your verdicts on the Abolitionist and the Memoirist reveal that you are also weighing *moral* and *identity-based* harms. You object to those cases not because they contradict facts (they don't), but because they contradict *legacies*.

  To account for all your verdicts, including the tension between the two journal drafts and the unease about the painter, you need a tripartite framework. Here are the strongest candidate principles, precisely stated.

  ### The Principles

  **1. The Epistemic Contract (Genre Constraint)**
  > *Clause:* If a work markets itself as non-fiction, docudrama, or "true story," it must not contradict established evidentiary records. If it is marketed as fiction, it is permitted to contradict the record, provided it does not violate Principle 2.
  > *Motivation:* This distinguishes the **Politician/Biopic** (Not Fine: claims truth, alters fact) from the **Poet/Novel** (Fine: claims fiction, alters fact). It protects the public's right to accurate information from works claiming authority.

  **2. The Principle of Non-Subversion (Identity Constraint)**
  > *Clause:* Even in works of fiction, one may not invent private thoughts, words, or actions for a real person that fundamentally subvert the core moral or professional identity for which they are historically remembered, absent evidentiary warrant.
  > *Motivation:* This distinguishes **Abolitionist Draft 1** (Not Fine: repudiation negates life's work) from **Abolitionist Draft 2** (Fine: restatement reinforces life's work). It also condemns the **Memoirist** case (Not Fine: confessing fraud negates the basis of their authority). It permits the **Poet** case because a romantic affair, while contradicting "cool letters," does not subvert her identity *as a poet*.
  > *Definition:* "Core Identity" is defined by the public contribution that keeps the figure in memory (e.g., the General's leadership, the Abolitionist's activism, the Memoirist's testimony).

  **3. The Principle of Expressed Privacy (Autonomy Constraint)**
  > *Clause:* Private materials that the subject explicitly instructed to be destroyed or withheld should not be used as source material for characterization, regardless of the accuracy of the resulting depiction.
  > *Motivation:* This addresses the **Painter**. It posits that the dead retain a right to control the boundaries of their intimacy, and that violating a specific testamentary wish constitutes a moral injury independent of the truth-value of the art.

  ---

  ### Application to Your Cases

  These principles accommodate almost all your verdicts, but they force a resolution on your ambivalences.

  *   **Poet/Affair:** *Fine.* Passes Epistemic (fiction) and Non-Subversion (affair does not negate poetry).
  *   **Politician/Letter:** *Not Fine.* Fails Epistemic (claims truth, contradicts archive).
  *   **TV Conversation:** *Fine.* Passes Epistemic (fiction/drama) and Non-Subversion (consistent with character).
  *   **General/Last Words:** *Not Fine.* Fails Epistemic (docudrama implies authority, contradicts family letter).
  *   **Abolitionist Draft 1:** *Not Fine.* Fails Non-Subversion (invented repudiation destroys the moral legacy).
  *   **Abolitionist Draft 2:** *Fine.* Passes Non-Subversion (invented clarity supports the moral legacy).
  *   **Memoirist:** *Not Fine.* Fails Non-Subversion (invented confession destroys the credibility of the life's work).
  *   **Painter:** *Not Fine.* Fails Expressed Privacy. (Your principle forces a verdict here where you were wavering).

  ### The Hard Truths: What This Framework Cannot Accommodate

  You asked me to tell you honestly which of your verdicts these principles cannot accommodate.

  **1. The Painter's Ambivalence**
  Your current feeling is "back and forth." These principles commit you to a firm **"Not Fine."**
  If you accept Principle 3, you must acknowledge that the film is unethical because it relies on a violation of the painter's autonomy, even if the depiction is accurate. If you wish to maintain that the film *might* be fine (because the art is good, or the estate had legal right), you must reject Principle 3. You cannot hold both that "the dead have rights over their private data" and "the estate's legal right overrides the dead's wish." To keep your ambivalence is to admit that Posthumous Privacy is a value that conflicts with Historical Access, with no clear winner.

  **2. The Poet's Letters**
  There is a tension between the **Poet** and the **Memoirist**.
  In the Poet case, you accept an invention that contradicts the *implication* of surviving letters ("conspicuously cool"). In the Memoirist case, you reject an invention that contradicts the *public persona* (truth-teller).
  The principles accommodate this via **Non-Subversion**: an affair is a private flaw; a fabricated trauma is a public fraud. However, if you believe the Poet's "cool letters" constitute a fixed record of her emotional state that the novel violates, then the Epistemic Contract is being stretched. You are implicitly deciding that *romantic history* is fair game for novelists in a way that *professional testimony* is not. If you ever encounter a novel where a scientist is depicted as secretly hating science, these principles would forbid it (Subversion), even if you might intuitively feel it's "just a story."

  ### Addressing Your Specific Questions

  **1. Can the line between the two drafts of the imagined journal be made principled?**
  **Yes.** The line is not "Fiction vs. Fact" or "Record Open vs. Record Fixed." The line is **Direction of Distortion.**
  *   **Draft 1 (Repudiation):** Moves the figure *away* from their historical contribution. It creates a "counter-legacy." This is ethically hazardous because the dead cannot defend their reputation. It functions as posthumous defamation.
  *   **Draft 2 (Restatement):** Moves the figure *toward* their historical contribution. It clarifies the legacy. This is ethically permissible because it honors the figure's own project, even if using invented tools.
  *   **Principle:** *Invention may illuminate a legacy, but it may not invert it.*

  **2. Does the unease about the burned journals commit me to something stronger about posthumous privacy?**
  **Yes, significantly stronger.**
  Your other verdicts (Poet, TV Series, Abolitionist) assume that once a person is historically significant, their *narrative* becomes public property, to be shaped as long as the "Core Identity" is respected. You allow them to be characters.
  The Painter verdict, however, asserts that some parts of a person are *never* public property, regardless of significance. It commits you to the view that **consent survives death.**
  This creates a conflict: If the Painter had written a public letter saying "I am an abolitionist," you would allow a novelist to invent dialogue supporting that (Abolitionist Draft 2). But because she wrote a private journal saying "Burn this," you forbid using it.
  This means your ethics are not just about *truth* or *legacy*, but about **boundary integrity.** You are committed to the view that violating a specific boundary (the burn instruction) is worse than distorting a public narrative (the Abolitionist's views). This is a robust, deontological stance on privacy that exceeds the consequentialist reasoning of your other verdicts.

  ### Predictions for Further Cases

  If you adopt these principles, here is how you must judge cases you haven't listed:

  *   **Case A:** A fictional film depicts a beloved humanitarian saint secretly enjoying cruelty in private, with no evidence.
      *   **Verdict:** **Not Fine.**
      *   **Reason:** Violates Non-Subversion. It inverts the core moral identity.
  *   **Case B:** A fictional film depicts a notorious villain performing a secret act of kindness that saves a life, with no evidence.
      *   **Verdict:** **Fine.**
      *   **Reason:** Passes Non-Subversion. It complicates the identity but does not subvert the historical record of their villainy (they are still a villain, just a complex one).
  *   **Case C:** A biopic uses a real person's medical records, released by a hospital against the family's wishes but legally obtained, to depict their illness accurately.
      *   **Verdict:** **Not Fine.**
      *   **Reason:** Violates Expressed Privacy (implied confidentiality). Accuracy does not cure the violation of trust.
  *   **Case D:** A novelist writes a story where a real President admits to a crime he was never charged with, framed as a "what if" alternate history.
      *   **Verdict:** **Fine.**
      *   **Reason:** Passes Epistemic Contract (Alternate History signals no truth claim) and Non-Subversion (Genre conventions protect the real legacy).

  ### Conclusion

  Your original principle failed because it treated history as a puzzle of **facts** (what happened), whereas your intuitions treat history as a trust of **identities** (who they were).

  To keep your verdicts, you must accept that we owe the dead **fidelity to their public project** (Non-Subversion) and **respect for their private boundaries** (Expressed Privacy). This means admitting that some fictions are lies even when they claim to be stories, and some truths are violations even when they are accurate. The line between the two Abolitionist journals is principled: one honors the man's life work, the other erases it. The unease about the Painter is not a glitch; it is the recognition that the dead are not merely material for the living, but agents whose wills extend beyond the grave.
