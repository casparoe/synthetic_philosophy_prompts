answer: |-
  # Transworld Reference Protocol (TRP)
  **For:** Data Analysts, Policy Institute  
  **Purpose:** Determining whether a term in a counterfactual scenario refers to the *same entity* as in the actual world.  
  **Time Budget:** 15 Minutes per Case File  

  ## Part 1: The Decision Procedure

  Do not guess. Follow these four steps. If you reach a **JUDGMENT FLAG**, stop and consult a senior analyst. Do not automate this step.

  ### Step 1: Categorize the Expression
  Look at the term used in the file (e.g., "Jordan Lee," "The Mayor," "Acetone"). Assign it one of four categories:

  1.  **Proper Name:** A specific label given to a person, organization, or unique object (e.g., "Jordan Lee," "Exxon," "Titanic").
  2.  **Role/Description:** A definition based on job, status, or temporary property (e.g., "The Mayor," "The Winner," "The Solvent in Tank 4").
  3.  **Natural Kind:** A substance or biological species defined by internal structure, not appearance (e.g., "Water," "Acetone," "Oak Tree").
  4.  **Document/Record:** A specific physical or digital file (e.g., "Contract #104," "The Birth Certificate").

  ### Step 2: Apply the "Swap Test"
  Imagine the counterfactual scenario changes a key property of the entity. Does the term still apply to the *original* thing, or does it switch to a *new* thing?

  *   **Test A (The Property Swap):** If the person/object loses the property described, does the term still fit?
      *   *Example:* If Jordan Lee loses the election, is she still "Jordan Lee"? **Yes.** Is she still "The Winner"? **No.**
  *   **Test B (The Occupant Swap):** If a different person/object takes the place, does the term follow the place or the person?
      *   *Example:* If Smith becomes Mayor instead of Jones, does "The Mayor" refer to Jones or Smith? **Smith.**

  **Decision Rule:**
  *   If the term stays with the **original entity** despite property changes $\rightarrow$ Mark as **[FIXED-ID]**.
  *   If the term stays with the **role/position** despite occupant changes $\rightarrow$ Mark as **[ROLE-ID]**.

  ### Step 3: Check for Empirical Identity (The "Discovery" Rule)
  Sometimes two different terms turn out to refer to the same thing in the Actual World (e.g., "The Solvent in Tank 4" is discovered to be "Acetone").

  *   **Question:** Did we *learn* this identity through investigation, or was it true by definition?
  *   **Rule:** If the identity was discovered empirically (lab test, background check), tag the link as **[EMPIRICAL-LINK]**.
  *   **Constraint:** An [EMPIRICAL-LINK] holds in the Actual World. In a Counterfactual World, you must re-verify. Do not assume "Tank 4 Solvent" = "Acetone" in a scenario where the supply chain changed.

  ### Step 4: Assign the Cross-Scenario Tag
  Based on Steps 1–3, assign one of the following tags to the database relationship between the Actual File and the Counterfactual File:

  1.  **`LINK_RIGID`**: The term refers to the exact same specific entity in both worlds (e.g., "Jordan Lee").
  2.  **`LINK_ROLE`**: The term refers to the function/office, which may be occupied by different entities in different worlds (e.g., "The Mayor"). **Do not merge data across these links.**
  3.  **`LINK_BROKEN`**: The term refers to Entity A in the Actual World, but Entity A does not exist or is fundamentally altered in the Counterfactual (e.g., "The Winner" in a world where the election was cancelled).
  4.  **`LINK_CONTINGENT`**: The terms are identical in the Actual World (Empirical Identity), but may diverge in the Counterfactual. Treat as separate variables in the CF file until verified.

  ---

  ## Part 2: Category-Specific Rules

  | Category | Default Tag | Exception / Nuance |
  | :--- | :--- | :--- |
  | **Personal Names** | `LINK_RIGID` | Unless the name is a pseudonym for a role (e.g., "Deep Throat"). |
  | **Aliases** | `LINK_RIGID` | If verified as the same person in Actual World, treat as `LINK_RIGID` in CF *unless* the CF posits they are different people. |
  | **Job Titles/Roles** | `LINK_ROLE` | Unless qualified by a name (e.g., "Mayor Lee" is `LINK_RIGID` regarding Lee). |
  | **Natural Kinds** | `LINK_RIGID` | "Acetone" is always Acetone. "The clear liquid" is `LINK_ROLE`. |
  | **Organizations** | **JUDGMENT FLAG** | See Step 4 of Procedure. Legal registration usually wins over branding. |
  | **Documents** | `LINK_RIGID` | Refers to the specific physical/digital instance. A *copy* is a new document. |

  ---

  ## Part 3: Handling Empirical Identities (The "Hesperus" Rule)

  **Problem:** You discover in the Actual World that "Subject A" and "Subject B" are the same person.
  **Database Action:**
  1.  **Do not** hard-merge the IDs in the schema if the Counterfactual relies on them being separate.
  2.  **Create an Identity Table:** Store the claim `Subject_A == Subject_B` as a fact with a `Source: Empirical_Discovery` flag.
  3.  **Counterfactual Inheritance:** When generating a CF file, inherit this identity *only if* the CF scenario does not explicitly alter the history that made them identical.
      *   *Example:* If they are twins identified by DNA, and the CF changes their parents, the identity claim is voided.
      *   *Example:* If they are the same person using two names, and the CF changes their career, the identity claim holds.

  **Warning:** Never treat a database join key as a metaphysical truth. A join is a claim about the Actual World. A Counterfactual World requires a re-evaluation of that join.

  ---

  ## Part 4: Application to Hard Cases

  ### Case 1: The Alternate Election
  **File:** Actual World (Candidate Jane Doe wins). Counterfactual (Candidate John Smith wins).
  **Terms:** "Jane Doe" vs. "The Candidate Who Won."

  1.  **Categorize:** "Jane Doe" = Proper Name. "The Candidate Who Won" = Role/Description.
  2.  **Swap Test:** In the CF, Jane Doe exists but did not win. "Jane Doe" still refers to Jane. "The Candidate Who Won" now refers to John Smith.
  3.  **Decision:**
      *   Link "Jane Doe" (Actual) to "Jane Doe" (CF) as **`LINK_RIGID`**.
      *   Link "The Candidate Who Won" (Actual) to "The Candidate Who Won" (CF) as **`LINK_ROLE`**.
      *   **DO NOT** link "Jane Doe" to "The Candidate Who Won" in the Counterfactual file.
  4.  **The Block:** Analysts often want to track "The Winner's Policy" as a continuous thread. **This procedure blocks that.** In the CF, "The Winner's Policy" is Smith's policy, not Doe's. If you merge them, you corrupt the data. You must query `Winner_Policy(World)` not `Winner_Policy(Person)`.

  ### Case 2: The Chemical Safety Incident
  **File:** Actual World (Tank 4 contains Acetone, explodes). Counterfactual (Tank 4 contains Water, no explosion).
  **Terms:** "The Solvent in Tank 4" vs. "Acetone."

  1.  **Categorize:** "Acetone" = Natural Kind (`LINK_RIGID`). "The Solvent in Tank 4" = Role/Description (`LINK_ROLE`).
  2.  **Empirical Identity:** In Actual World, lab tests confirm `Tank 4 Solvent == Acetone`. Tag as **[EMPIRICAL-LINK]**.
  3.  **Counterfactual Check:** In CF, Tank 4 contains Water.
      *   Does "Acetone" exist in the CF? Yes, as a chemical substance, but not in the tank.
      *   Does "The Solvent in Tank 4" exist? Yes, it refers to Water.
  4.  **Decision:**
      *   Mark `Tank 4 Contents` as **`LINK_CONTINGENT`**.
      *   In the Actual file, `Tank 4 Contents` points to `Acetone_ID`.
      *   In the CF file, `Tank 4 Contents` points to `Water_ID`.
      *   **Crucial:** Do not carry over the explosion risk properties of Acetone to the CF "Tank 4" entry just because the *label* "Tank 4" is the same. The substance identity is broken.

  ### Case 3: The Company Merger
  **File:** Actual World (Corp A buys Corp B; keeps Corp B's name and registration, replaces all staff/owners).
  **Terms:** "Corp B" (Pre-merger) vs. "Corp B" (Post-merger).

  1.  **Categorize:** Organization.
  2.  **Swap Test:** **JUDGMENT FLAG.**
      *   Argument for `LINK_RIGID`: Legal registration number is unchanged. Contracts remain valid.
      *   Argument for `LINK_BROKEN`: Ownership, staff, and operational control are entirely new. It is a "shell."
  3.  **Procedure:**
      *   Check the **Legal Registration ID**. If unchanged, default to `LINK_RIGID` for liability/tax purposes.
      *   Check **Operational Continuity**. If staff/mission changed >80%, create a shadow tag `Org_Essence_Changed`.
  4.  **Decision:**
      *   For legal databases: **`LINK_RIGID`**.
      *   For policy impact analysis: **`LINK_CONTINGENT`**. Treat post-merger Corp B as a new actor inheriting the old name.
      *   *Note:* This requires senior analyst sign-off. Do not auto-merge.

  ---

  ## Part 5: Theoretical Appendix (For Team Leads)

  To implement this without confusing analysts, we have simplified the philosophy of language (Kripke, Putnam, etc.) into operational rules. Here is what survives and what was dropped.

  ### Distinctions That Survive (Crucial)
  1.  **Rigid vs. Non-Rigid Designation:** This is the core of the `LINK_RIGID` vs. `LINK_ROLE` distinction. We must maintain that names (usually) track *objects* across worlds, while descriptions track *properties*. Failure to distinguish these causes data contamination (e.g., attributing the properties of the CF "Winner" to the Actual "Winner").
  2.  **Necessary A Posteriori:** This informs the **[EMPIRICAL-LINK]** rule. Just because we discovered $A=B$ in the Actual World does not mean $A=B$ in every Counterfactual World. The identity is necessary *given the actual history*, but the counterfactual may alter that history. The database must distinguish "True by Definition" from "True by Discovery."
  3.  **Causal History vs. Description:** We prioritize how the entity was *named* (causal chain) over how it is *described*. "Jordan Lee" refers to the person baptized/named that way, not whoever fits the description of "Jordan Lee."

  ### Distinctions Dropped (For Speed)
  1.  **De Re / De Dicto Ambiguity:** Philosophers argue extensively about whether "The Mayor might not have been the Mayor" is ambiguous. We bypass this by forcing the analyst to choose `LINK_RIGID` (Person) or `LINK_ROLE` (Office) explicitly at intake.
  2.  **Transworld Identity Criteria:** We do not ask "What makes Person X the same Person Y across worlds?" (Psychological continuity? Biological?). We assume biological/legal continuity for `LINK_RIGID` unless the scenario explicitly violates it (e.g., "In this world, Jordan Lee died at birth").
  3.  **Natural Kind Essentialism:** We treat "Acetone" as rigid without debating molecular essentialism. If the chemistry changes, it's not Acetone. That is sufficient for policy work.

  ### The "Same Label" Trap
  **Warning:** The most common error is assuming that because the string `"Corp B"` appears in both files, it refers to the same agent.
  *   **Philosophical Error:** Confusing *sense* (the name) with *reference* (the entity).
  *   **Data Consequence:** Merging risk profiles that no longer apply.
  *   **Fix:** The TRP forces a check on *what fixes the reference* (Legal ID vs. Brand Name). If the Legal ID stays but the Ownership changes, the procedure forces a `JUDGMENT FLAG` rather than an automatic join.

  ### When the Procedure Misfires
  This protocol assumes standard policy scenarios. It may misfire if:
  1.  **Vague Identity:** In the Merger case, if legal registration is ambiguous (e.g., multiple jurisdictions), the `LINK_RIGID` default may be wrong.
  2.  **Radical Counterfactuals:** If a scenario posits "Magic" or "Sci-Fi Technology" (e.g., body swapping), the biological `LINK_RIGID` rule for persons fails.
  3.  **Fictional Entities:** If the file concerns a public myth (e.g., "The Market's Reaction"), there is no rigid designator. Treat all as `LINK_ROLE`.

  **Final Instruction:** If an analyst feels the procedure blocks a link that makes "narrative sense" (e.g., Case 1, linking "The Winner" across worlds), **trust the procedure.** Narrative sense often conflates the *story thread* with the *entity*. Our database must track entities, not story threads.
