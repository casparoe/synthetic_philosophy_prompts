prompt: |-
  I run the data team for a small policy institute, and we maintain a database of “counterfactual case files”: each file starts from a real event and then describes one or two alternatives, such as a different person winning an election, a different chemical being stored in a tank, or a defendant having a different prior record. We constantly have to decide whether two expressions pick out the same thing across the actual file and the counterfactual one. For example, does “the mayor” in the alternative still refer to the actual mayor, or just to whoever is mayor there? If an analyst writes “Jordan Lee” rather than “the whistleblower,” does that settle the issue? And if we discover that two aliases belong to one person, how should the database represent the fact that this was empirically learned but, once true, seems to hold in every relevant scenario?

  Please turn the philosophy of rigid designation and the necessary a posteriori into a procedure my analysts can follow without knowing that literature. I want ordered steps, tests they can apply to names, aliases, definite descriptions, role terms, natural-kind terms, organizations, and documents; rules for when an expression may be linked across scenarios and when it must be marked “role occupant only”; and guidance for recording genuinely empirical identity claims without treating every database join as metaphysically necessary. Make it usable in about fifteen minutes per case, with explicit stop points and with places where human judgment is unavoidable rather than pretending the checklist settles everything.

  Apply the procedure to three hard cases: an alternate election file containing both “the candidate who won” and the actual winner’s name; a chemical-safety file in which “the solvent in Tank 4” is later identified as acetone; and a company-merger file where the post-merger firm keeps the old name, most staff, and one legal registration but changes ownership. Include at least one case where the procedure blocks a link that our analysts will find narratively obvious but that is not philosophically justified. Also say which distinctions from the theory have to survive the simplification, which can safely be dropped for our purposes, and how hte procedure might misfire if someone treats “same label” as automatically meaning “same entity.”
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Data team lead at a small policy institute.
      *   **Task:** Create a procedural guide for analysts to handle "counterfactual case files" (real events + alternatives).
      *   **Core Problem:** Determining reference across actual and counterfactual scenarios (transworld identity). Does "the mayor" refer to the specific person (rigid) or the role (non-rigid)? Does "Jordan Lee" refer to the same person even if properties change? How to handle empirical identities (Hesperus/Phosphorus style)?
      *   **Theoretical Basis:** Kripke's rigid designation, necessary a posteriori, descriptive vs. causal theory of reference.
      *   **Constraints:**
          *   Must be usable by analysts *without* knowing the philosophy.
          *   Ordered steps, tests, specific categories (names, roles, kinds, etc.).
          *   Rules for linking vs. marking "role occupant only."
          *   Guidance on empirical identity claims vs. database joins.
          *   Time limit: ~15 minutes per case.
          *   Explicit stop points/judgment calls (don't pretend it's fully algorithmic).
          *   Apply to three hard cases (Election, Chemical, Merger).
          *   Include a case where the procedure *blocks* a narratively obvious link (philosophical rigor).
          *   Explain which theoretical distinctions survive simplification and which are dropped.
          *   Warn against "same label = same entity."

  2.  **Deconstruct the Philosophy for Practitioners:**
      *   *Rigid Designation:* Proper names (usually) pick out the same individual in all possible worlds where that individual exists. Descriptions (usually) pick out whoever fits the description in that world.
      *   *Necessary A Posteriori:* Identity statements discovered empirically (e.g., Water = H2O, Hesperus = Phosphorus) are necessary if true, but we needed evidence to find out.
      *   *Application:*
          *   Names (Jordan Lee) $\rightarrow$ Track the *person*, not the properties.
          *   Descriptions/Roles (The Mayor) $\rightarrow$ Track the *role*, unless context specifies the person.
          *   Natural Kinds (Acetone) $\rightarrow$ Track the *substance*, not the label.
          *   Empirical Identity $\rightarrow$ Once proven in Actual World, treat as necessary in Counterfactuals *unless* the counterfactual explicitly breaks the identity (e.g., twin earth scenarios, though rare in policy work).

  3.  **Drafting the Procedure (The "Transworld Reference Protocol"):**
      *   *Goal:* 15 minutes. Needs to be a checklist/flowchart style.
      *   *Step 1: Categorize the Term.* (Name, Role, Description, Kind, Org).
      *   *Step 2: The "Swap Test".* If we swap the property, does the term still apply?
      *   *Step 3: The "Origin Check".* How was the entity identified? (Causal history vs. Description).
      *   *Step 4: Empirical Identity Flag.* Distinguish between "we think these are the same" and "we know these are the same."
      *   *Step 5: Linking Decision.* (Rigid Link, Role Link, or Broken Link).

  4.  **Refining the Steps for Usability:**
      *   Avoid jargon like "rigid designator." Use "Fixed ID" vs. "Role ID."
      *   Make the "Empirical Identity" distinction clear: Database joins shouldn't hard-code necessity unless the identity is metaphysically secure.
      *   *Crucial Constraint:* Explicitly state where human judgment is needed.

  5.  **Developing the Three Hard Cases:**
      *   *Case 1: Election.* "The candidate who won" vs. "Jane Doe."
          *   *Analysis:* "Jane Doe" is rigid (Fixed ID). "The candidate who won" is non-rigid (Role ID). In a counterfactual where Jane loses, "Jane Doe" is still Jane, but "The candidate who won" is someone else.
          *   *Outcome:* Do not link "The candidate who won" across worlds as the same person. Link "Jane Doe."
      *   *Case 2: Chemical.* "Solvent in Tank 4" $\rightarrow$ Acetone.
          *   *Analysis:* "Solvent in Tank 4" is descriptive/role. "Acetone" is a natural kind (Fixed ID).
          *   *Outcome:* In the actual world, they are identical (Necessary A Posteriori). In a counterfactual where Tank 4 holds Benzene, "Solvent in Tank 4" $\neq$ Acetone.
      *   *Case 3: Merger.* Old Name, New Ownership.
          *   *Analysis:* Corporate identity is tricky. Legal registration suggests continuity. Ownership suggests change.
          *   *Outcome:* This requires judgment. Likely a "Split ID" or "Successor Entity."
      *   *The "Block" Case:* Need a scenario where narrative intuition says "same" but philosophy says "different."
          *   *Idea:* A case where a description is used as a name. "The President" in a file about "The President." If the counterfactual changes *who* is President, the term refers to a different person. Analysts might want to link them because the *office* is the focus, but the *person* is not. Or, better: "The person who pulled the trigger." In a counterfactual where someone else pulled it, linking the specific agent is wrong. Let's use the Election case for the "Block." Analysts want to track "The Winner" as a continuous thread. The procedure must block linking "The Winner" to a specific person across the branch where they lose.

  6.  **Addressing Theoretical Distinctions:**
      *   *Keep:* Rigid vs. Non-Rigid (Fixed vs. Role), Causal History vs. Description, Necessary A Posteriori (Empirical Identity).
      *   *Drop:* Possible Worlds semantics formalism, De Re/De Dicto nuance (too complex), Essentialism debates (too deep).
      *   *Warning:* "Same Label" fallacy.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Professional, instructional, pragmatic.
      *   *Time Check:* Is 15 minutes realistic? Yes, if the checklist is tight.
      *   *Philosophy Check:* Am I misrepresenting Kripke?
          *   *Names:* Rigid (mostly).
          *   *Descriptions:* Non-rigid (mostly).
          *   *Natural Kinds:* Rigid.
          *   *Identity:* If $a=b$ is true, it's necessary. But we need to distinguish *epistemic* uncertainty from *metaphysical* necessity. The database needs to reflect that we *learned* $a=b$.
      *   *The "Block" Requirement:* I need to ensure one of the examples explicitly demonstrates a blocked link. The Election case is perfect for this. Analysts often track "The Winner" as a variable. But if we ask "Did The Winner give a speech?", in the CF world, a different person did. Linking them conflates the role with the person.

  8.  **Final Polish:**
      *   Structure: Introduction $\rightarrow$ The Protocol (Steps) $\rightarrow$ Category Rules $\rightarrow$ Empirical Identity Handling $\rightarrow$ The Three Cases $\rightarrow$ Theoretical Appendix (What we kept/dropped).
      *   Ensure the "Human Judgment" flags are visible.
      *   Make sure the warning about "Same Label" is prominent.

  9.  *(Drafting content based on the above plan...)*
      *   *Protocol Name:* Transworld Reference Protocol (TRP).
      *   *Steps:* Classify $\rightarrow$ Test $\rightarrow$ Verify $\rightarrow$ Tag.
      *   *Tags:* `[FIXED-ID]`, `[ROLE-ID]`, `[EMPIRICAL-LINK]`.
      *   *Case 1 (Election):* Block the link between "The Winner" (Role) and specific person across the branch where they lose.
      *   *Case 2 (Chemical):* Acetone is Fixed. Tank contents are Role.
      *   *Case 3 (Merger):* Judgment call on organizational essence.
      *   *Theory:* Explain Rigid Designation as "Fixed-ID" and Necessary A Posteriori as "Verified Identity."

  10. **Final Review against constraints:**
      *   15 mins/case? Yes, checklist is short.
      *   Stop points? Yes, "Judgment Required" flags.
      *   No jargon? Replaced with operational terms.
      *   Blocks a link? Yes, in Case 1.
      *   Theory explanation? Included at the end.

