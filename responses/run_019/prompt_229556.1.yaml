  **1. The Matrix & Verification**
  Use this 3x2 game (Row payoffs first):
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & 5, 2 & 0, 1 \\
  M & 2, 2 & 2, 5 \\
  B & 0, 2 & 5, 1 \\
  \end{array}
  $$
  **Verification:**
  (a) **No Pure Dominance on M:** Against $L$, $T(5) > M(2)$ but $B(0) < M(2)$. Against $R$, $B(5) > M(2)$ but $T(0) < M(2)$. $M$ is not strictly dominated by $T$ or $B$.
  (b) **Mixed Dominance on M:** Consider $\sigma = 0.5T + 0.5B$.
  Vs $L$: $0.5(5) + 0.5(0) = 2.5 > 2$.
  Vs $R$: $0.5(0) + 0.5(5) = 2.5 > 2$.
  $\sigma$ strictly dominates $M$.
  (c) **Unraveling:** Remove $M$. Col faces $T, B$. $L$ yields 2 against both; $R$ yields 1 against both. $L$ strictly dominates $R$. Remove $R$. Row faces $L$. $T(5) > B(0)$. Solution $(T, L)$.

  **2. Activity Design (75 Minutes)**
  **Materials:** Printed matrices, choice slips, scoreboard.
  **Stakes:** Course participation points (e.g., 5 points total; top quartile gets bonus).
  **Pairing:** Random re-pairing every round to prevent reputation effects.

  **Timeline:**
  *   **0–5 (Warm-up):** Solve a 2x2 game where one strategy is purely dominated. Confirm consensus. Do not mention mixed strategies.
  *   **5–10 (Instructions):** Distribute main matrix. Explain rules: Write choice secretly, reveal simultaneously, record points.
  *   **10–35 (Play):** 5 Rounds (5 mins each). Rotate partners.
  *   **25 (Premature Poll):** After Round 3, ask: "Raise hand if you think $M$ is a rational play." Expect mixed hands.
  *   **35–50 (Discovery):** In pairs, calculate expected payoffs. Task: "Find a combination of $T$ and $B$ that beats $M$ regardless of Col's choice."
  *   **50–65 (Debrief):** Connect findings to definitions (see below).
  *   **65–75 (Extension):** Optional weak-dominance order exercise.

  **3. Warm-up Strategy**
  Use a standard Prisoner's Dilemma or simple dominance game. The goal is to reinforce confidence in *pure* elimination tools so the failure of those tools in the main activity feels like a genuine puzzle, not a confusion about rules.

  **4. Debrief Plan**
  *   **Empirical to Theoretical:** Point to the scoreboard. "Did anyone win playing $M$?" (Likely no). "Was it bad luck?"
  *   **The Proof:** Guide them to write $EU(M) = 2$. Write $EU(0.5T+0.5B) = 2.5$.
  *   **Beliefs:** Ask: "What belief $p$ about Col playing $L$ makes $M$ a best response?"
      *   $EU(M) = 2$.
      *   $EU(\sigma) = 2.5$.
      *   Since $2.5 > 2$ always, $M$ is never a best response.
  *   **Definition Link:** Explicitly state: "Strictly dominated by mixed strategy $\iff$ Never a best response to any belief." This game proves the $\Leftarrow$ direction concretely.

  **5. Predictable Failure Modes**
  1.  **Arithmetic Errors:** Students miscalculate the mixed expected value.
      *   *Fix:* Provide a scratchpad template with the equation $p(5) + (1-p)(0)$ pre-written.
  2.  **Spite/Curiosity Plays:** Students play $M$ to test the TA or disrupt data.
      *   *Fix:* Emphasize early that points translate to concrete course credit. Anonymize data collection so peers don't see individual "errors."
  3.  **Poll Anchoring:** The mid-session poll validates $M$ as viable, causing students to stick with it.
      *   *Fix:* Frame the poll as "checking intuition before math," not "voting on truth." Immediately follow with "Now let's see if the math agrees."

  **6. Optional Extension: Weak Dominance Order (10 Mins)**
  **Matrix:**
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & 1, 1 & 0, 0 \\
  B & 0, 0 & 0, 0 \\
  \end{array}
  $$
  **Verification:**
  *   **Order 1 (Row first):** $T$ weakly dominates $B$ ($1\ge0, 0\ge0$). Remove $B$. Col faces $T$: $L(1) > R(0)$. Remove $R$. Survivors: $\{T\}, \{L\}$.
  *   **Order 2 (Col first):** Does $L$ weakly dominate $R$? Against $T$ ($1>0$), yes. Against $B$ ($0=0$), yes. So $L$ weakly dominates $R$. Remove $R$. Row faces $L$: $T(1) > B(0)$. Remove $B$. Survivors: $\{T\}, \{L\}$.
  *   *Correction for Order Dependence:* The above yields same result. Use this 3x2 instead:
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & 2, 2 & 0, 0 \\
  M & 1, 1 & 1, 1 \\
  B & 0, 0 & 2, 2 \\
  \end{array}
  $$
  *   **Order 1 (Col eliminates $M$ via $L$):** $L(2,1,0) \ge R(0,1,2)$? No.
  *   **Correct Example:**
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & 1, 1 & 0, 0 \\
  B & 0, 0 & 0, 0 \\
  \end{array}
  $$
  *   **Path A:** Row eliminates $B$ (weak). Col eliminates $R$ (strict now). Survivors: $\{T, L\}$.
  *   **Path B:** Col cannot eliminate $R$ initially ($0=0$ against $B$). If Col waits, and Row doesn't eliminate $B$, $R$ survives.
  *   **Result:** Path A leaves $\{T, L\}$. Path B (if Row doesn't move) leaves $\{T, B, L, R\}$. Different surviving sets depending on who moves first.

  **7. Limitations**
  This activity demonstrates that $M$ loses in *this* room against *these* opponents. It does not prove $M$ is impossible under common knowledge of rationality (CKR). Students observe empirical failure, not logical necessity. You must lecture the gap: rationalizability requires knowing that opponents know you are rational, ad infinitum. The activity shows *that* mixed dominance matters; the lecture must prove *why* it equates to "never a best response" generally, beyond this specific matrix. Without the formal proof, students may view this as a trick of the numbers rather than a theorem of rationality.
