  # Where Do You Actually Stand on the Lottery and Preface?
  **A Diagnostic Flowchart for Epistemology Reading Groups**

  *Instructions: Start at Q1. Answer based on your immediate verdict about the cases, not your preferred theory. Follow the arrows to your position.*

  ### THE TREE

  **Q1: The Lottery Verdict**
  In a fair 1,000,000-ticket lottery, is it rational to **believe** of Ticket #1 that it will lose?
  *   **YES** → Go to Q2.
  *   **NO** → Go to Q2.

  **Q2: The Preface Verdict**
  In the modest preface case, is it rational for the author to **believe** of Claim #1 that it is true?
  *   **YES** → Go to Q3.
  *   **NO** → Go to Q3.

  **Q3: The Closure Constraint**
  If you believe *P* and believe *Q*, does rationality **require** you to believe *(P & Q)*?
  *(Note: If you answered YES to Q2, you believe each claim is true. If you deny closure, you need not believe **all** are true.)*
  *   **NO (Closure Fails)** → Go to Q4.
  *   **YES (Closure Holds)** → Go to Q4.

  **Q4: The Nature of Belief**
  Is "outright belief" nothing over and above having a **credence above a threshold** (e.g., >95%)?
  *   **YES (Reductionist)** → **Leaf A/B/C**
  *   **NO (Pluralist/Primitivist)** → **Leaf D/E/F**
  *   **REJECT (Eliminativist)** → **Leaf G** *(Belief is a folk-psychological fiction; only credence exists.)*

  ---

  ### THE LEAVES (Your Position)

  #### **Path 1: YES (Lottery) / YES (Preface) / NO (Closure)**
  *You think we believe the individual propositions, but belief doesn't aggregate.*
  *   **Leaf A (The Lockean Threshold):** Belief *is* high credence. Since credence isn't closed under conjunction, belief isn't either. The paradoxes are the honest price of threshold belief.
  *   **Leaf B (Kyburg-Style Acceptance):** Belief (or "Acceptance") is a distinct state from credence. It is rational to accept each claim/loss, but irrational to accept the conjunction.
      *   *Diagnosis:* Distinguished from Lockean by Q4 (Pluralism vs. Reduction).

  #### **Path 2: YES (Lottery) / YES (Preface) / YES (Closure)**
  *You think we believe the individuals, and belief aggregates.*
  *   **Leaf C (Rational Inconsistency):** Closure holds, so you believe the conjunction (All True). You also believe (Some False). You hold a known inconsistency. This is rationally permissible, full stop.
      *   *Diagnosis:* "Heretical" view. Distinct from Lockean because Lockeans deny closure (via credence math); this view affirms closure but permits inconsistency.
  *   **Leaf D (Incoherent):** If you affirm Closure + Reduction (Credence > t), you contradict probability theory (Prob(P&Q) < t). **Unoccupied.**

  #### **Path 3: NO (Lottery) / YES (Preface) / YES (Closure)**
  *You treat the paradoxes asymmetrically.*
  *   **Leaf E (Contextualist):** "Belief" standards shift. In lottery contexts, standards are high (No belief). In preface contexts, standards are lower (Belief).
  *   **Leaf F (Stability/Spohn):** Belief requires stability under conditionalization. Lottery beliefs are unstable (new info about other tickets changes things); preface beliefs are stable.
      *   *Diagnosis:* Both resolve asymmetry. Split by whether the mechanism is conversational (E) or doxastic/ranking-based (F).

  #### **Path 4: NO (Lottery) / NO (Preface)**
  *You deny belief in both high-probability/low-knowledge cases.*
  *   **Leaf G (Knowledge-First):** Belief constitutively aims at knowledge. Since neither lottery losses nor preface claims are known, neither are genuine candidates for belief.
      *   *Verdict on Author:* **Irrational.** The modest author mistakenly takes her claims to be known.
  *   **Leaf H (Unmotivated Skepticism):** Denies belief in both, but denies belief aims at knowledge. **Unexplored/Unmotivated.** Why deny preface belief if not for knowledge norms?

  #### **Path 5: YES (Lottery) / NO (Preface)**
  *   **Leaf I (The Reverse Asymmetry):** You believe the ticket loses but doubt your own book's claims.
      *   *Diagnosis:* **Unmotivated.** Standard epistemic practice treats preface claims as more belief-worthy than lottery statistics. **Unoccupied.**

  #### **Path 6: The Eliminativist Exit**
  *   **Leaf J (Eliminativism):** At Q4, you reject the category. There are only credences. The "paradoxes" are artifacts of forcing binary belief onto continuous confidence.
      *   *Verdict on Author:* **Category Mistake.** The author doesn't "believe"; she has high credences.

  ---

  ### FLAGGED INDISTINGUISHABILITY
  **Leaf A (Lockean) and Leaf B (Kyburg)** often yield identical practical verdicts. Your answer to Q4 is the *only* thing separating them. If you are unsure whether belief is *reducible* to credence or just *correlated* with it, your leaf is unstable.

  ---

  ### STRESS TEST: Can Your Leaf Survive These Cases?
  *Take your assigned leaf and apply it to these three scenarios. If your view yields a counter-intuitive or contradictory result, revise your answers above.*

  **(a) The Archivist (The Scale Test)**
  An archivist checks 1,000,000 records. She believes of each that it is accurate, but believes at least one contains an error.
  *   **Challenge:** If you are **Leaf G (Knowledge-First)**, you must call the archivist irrational on every single record. If you are **Leaf A (Lockean)**, you must explain why 1,000,000 records doesn't collapse the threshold differently than 100 claims.
  *   **Fail Condition:** If you say the Archivist is rational but the Lottery player is not, without a principled difference (like Stability), you are inconsistent.

  **(b) The Two-Author Preface (The Aggregation Test)**
  Co-authors Alice and Bob each write half a book. Alice believes her half is error-free. Bob believes his half is error-free. Both believe the *book* contains an error.
  *   **Challenge:** If you are **Leaf C (Rational Inconsistency)**, this is fine. If you are **Leaf E (Contextualist)**, does the context shift for Alice regarding Bob's chapters?
  *   **Fail Condition:** If your view implies Alice should believe "Bob's chapters are error-free" simply because she trusts him, but she also believes "The book has errors," check if your view permits this specific inconsistency. **Leaf G** fails here if it claims Alice *knows* her own chapters (she doesn't).

  **(c) The Guaranteed Error (The Custom Split)**
  A machine prints 100 statements. You know the machine makes **exactly one** error. You read the first 99; they look perfect.
  *   **Question:** Do you believe Statement #100 is true?
  *   **Split:**
      *   **Lockean (Leaf A):** Credence is 99%. If threshold is 95%, **Yes**.
      *   **Stability (Leaf F):** Belief in #100 is unstable (if you learned #100 was the error, your ranking shifts). **No**.
      *   **Knowledge-First (Leaf G):** You don't know #100 is true. **No**.
  *   **Fail Condition:** If you are **Leaf A** but intuitively feel you *shouldn't* believe #100 (because it's the "designated" potential error), your threshold model is under pressure. If you are **Leaf F**, ensure you can explain why the Preface claims are stable but this one isn't.

  ---
  *Handout designed for logical space mapping. Positions based on standard literature (Williamson, Foley, Kyburg, Spohn, DeRose).*
