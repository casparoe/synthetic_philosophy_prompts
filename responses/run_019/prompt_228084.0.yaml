answer: |-
  1. Marx defines exploitation as the extraction of surplus value by owners, so worker-owners theoretically eliminate this by keeping all profits themselves. Yet, the presence of an external controller complicates whether they truly possess the means of production.
  2. Alienation concerns control over the labour process, meaning that even as owners, workers feel separated from their work because the algorithm dictates their every move. They become appendages to the machine rather than masters of their trade.
  3. Even with co-op ownership, exploitation remains possible if the algorithm's creator captures the majority of the value generated by the deliveries. This suggests that technical control can be just as extractive as legal ownership of the business.
  4. The algorithm could theoretically distribute pay fairly to abolish exploitation, yet simultaneously intensify alienation by removing all human autonomy from the delivery route. This proves that fair wages do not automatically guarantee freedom from psychological estrangement.
  5. Ultimately, this scenario reveals that exploitation is an economic relationship regarding profit, whereas alienation is an existential state regarding control and purpose. The co-op solves the economic issue but fails to address the human experience of labour under digital management.
