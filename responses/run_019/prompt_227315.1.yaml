              *   Standard view: Finks show that the counterfactual analysis fails, but they don't necessarily prove the object lacks the disposition *prior* to stimulus. However, Priya's argument in Round 3/5 suggests the disposition is absent *when needed*.
          *   **Intrinsic vs. Extrinsic:** Dispositions are generally thought to be intrinsic. Marcus is right that it's weird for a wire's conductivity to depend on a remote guardian. But if the guardian is wired *to* it, it's part of the immediate causal context.
          *   **The Crucial Distinction:** Masking vs. Finking.
              *   Mask (Vase): Base exists, stimulus occurs, interference prevents manifestation. -> Disposition exists.
              *   Fink (Wire): Stimulus occurs, base is removed *before* manifestation can complete. -> Disposition status is ambiguous but often treated as "lacking the disposition *at the time of manifestation*."

