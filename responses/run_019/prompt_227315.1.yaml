      *   **Shared Commitment:** The belief that disposition ascriptions must reduce to *either* simple counterfactuals *or* static intrinsic bases, without room for dynamic causal contexts. Specifically, the **Simple Conditional Analysis** is the ghost haunting the meal, even though Marcus tries to exorcise it. Actually, the shared commitment is that "Having a disposition" is a binary, context-independent property of the object alone.

