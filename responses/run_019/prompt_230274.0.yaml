  UNITED STATES DISTRICT COURT
  DISTRICT OF COLUMBIA

  UNITED STATES OF AMERICA,
  Plaintiff,

  v.

  DEFENDANT JOHN DOE,
  Defendant.

  Case No. 23-CR-00492
  SENTENCING MEMORANDUM

  **I. PRELIMINARY FINDING ON AGENCY**

  To be truly responsible for an action, one would have to be responsible for the character, motives, and dispositions that produced it. That would require being responsible for the heredity, upbringing, and circumstances that formed those traits. That would in turn require being responsible for the conditions that formed them, and so on backward without ever reaching a first self-caused starting point. Since no individual creates themselves ex nihilo, no individual is ultimately morally responsible for what they do. This Court accepts this causal regress as settled fact. Retributive desert—the notion that an offender merits suffering because they freely chose evil—is an illusion. Accordingly, this sentencing proceeds not on grounds of blame, but on grounds of necessity.

  **II. FACTS AND VERDICT**

  The evidence establishes beyond a reasonable doubt that on January 14, 2023, the Defendant struck the victim with a blunt instrument, causing severe cranial trauma. The Defendant's neural architecture, shaped by genetics and environment, processed stimuli that resulted in the swing. The jury's verdict of guilty is a finding of causal agency, not moral culpability. It confirms that the Defendant was the mechanism through which the harm occurred. The statutory elements are met. The Defendant is the locus of the threat.

  **III. SENTENCING RATIONALE**

  Having dispensed with the fiction of blame, the Court turns to the utilitarian grounds required for public safety. Punishment remains necessary, though its justification shifts from morality to mechanics.

  First, incapacitation. The Defendant's configuration presents a verified danger to the physical integrity of others. Confinement is required to prevent the recurrence of similar causal chains. Second, deterrence. Specific deterrence aims to recalibrate the Defendant's cost-benefit algorithms through negative reinforcement. General deterrence signals to other potential mechanisms of harm that similar outputs will trigger similar containment protocols.

  Third, restitution. The victim suffered measurable loss. While the Defendant did not ultimately choose to cause this loss, the Defendant's estate is the most logical source of compensation. Fourth, norm expression. Society requires a formal declaration that such actions are unacceptable. This ritual maintains the social fabric, even if the participants are not ultimately authors of their roles.

  **IV. ADDRESS TO THE DEFENDANT**

  Mr. Doe, you stand before me not as a sinner, but as a hazard. You did not choose your impulses, nor did you design the brain that processed them. You are no more to be blamed for your violence than a flood is to be blamed for drowning. However, just as a flood must be dammed, you must be restrained. The pain you will experience in custody is not a moral payment; it is a logistical consequence. We do not hate you. We simply cannot permit you to operate unchecked.

  **V. DISPOSITION**

  It is therefore ordered that the Defendant be committed to the custody of the Bureau of Prisons for a term of 120 months. You will be transferred immediately. You are hereby separated from the community you endangered. This Court finds no malice in this order, only function.

  The ritual is complete. The safety of the public is prioritized over the metaphysical comfort of free will. Let the record show that while guilt is a fiction, confinement is real.

  SO ORDERED.

  _________________________
  HON. ARTHUR PENN
  UNITED STATES DISTRICT JUDGE

  DATED: October 24, 2023
