  Right, let's step back from the whiteboard and look at the architecture of this dispute. I've sat in on more than a few reading groups that have calcified in precisely this manner. It is a testament to the difficulty of the subject that you have reached an impasse, not a failure of your group's intellect. The Principal Principle (PP) is the fault line where metaphysics, epistemology, and decision theory collide, and it is notoriously unstable ground.

  You have asked for a diagnosis of the disagreement itself, not a verdict on the truth of the matter. You want to know why the arguments bounce off. Before I give you my considered view, let us sketch three rival diagnoses of what is stalling your reading group.

  ### Rival Diagnosis 1: The Verbal Equivocation
  On this reading, your flatmate and your supervisor are simply using the word 'chance' to refer to two different properties. Your flatmate is talking about *physical probability* (perhaps a propensity or a frequency in the world), whilst your supervisor is talking about *epistemic probability* (a feature of our best systematisation of the world).

  If this were true, the disagreement would be merely verbal. Camp One says, "Physical probability doesn't automatically constrain belief without a bridge principle," and Camp Two says, "Epistemic probability is *defined* by how it constrains belief." They would be talking past one another. The reason this diagnosis is tempting is that it dissolves the tension immediately. However, it is unsatisfying because both camps claim to be discussing the *same* phenomenon—objective chance as it appears in quantum mechanics or statistical physics. They are not merely stipulating definitions; they are making claims about how the world works. Dismissing it as verbal ignores the fact that both sides feel they are capturing the pre-theoretic notion of chance.

  ### Rival Diagnosis 2: The Metaphysical Proxy War
  This diagnosis suggests the argument isn't about the PP at all, but is a proxy battle for a deeper metaphysical commitment: **Humean Supervenience**.

  Lewis's 'Big Bad Bug' (undermining) only arises if you are a Humean—i.e., if you believe chances supervene on the total history of categorical events. If Camp Two (your supervisor) is a Humean, the undermining future is a genuine threat that requires the 'New Principle' (NP). If Camp One (your flatmate) is a Non-Humean (believing chances are primitive properties), undermining doesn't arise in the same way, but the 'why defer?' question becomes pressing because the chance is now a spooky, non-epistemic entity.

  On this view, the stalemate exists because they are arguing about epistemology while standing on incompatible metaphysical foundations. Camp One sees the NP as 'changing the subject' because they don't accept the Humean metaphysics that necessitates it. Camp Two sees the 'why defer?' question as category confusion because, for a Humean, chance *just is* the summary of patterns that guides belief. The embarrassment each side feels is actually a symptom of their opposing metaphysics.

  ### Rival Diagnosis 3: Explanatory Priority (My Diagnosis)
  This is the diagnosis I buy, though it incorporates elements of the other two. I believe this is a **Bedrock Methodological Disagreement about Explanatory Direction**.

  Camp One treats the PP as a **Theorem**. They assume we have an independent grip on what 'chance' is (via physics) and an independent grip on 'rationality' (via decision theory), and the PP is a bridge law that needs to be derived or justified. Hence, their complaint about circularity: "You haven't *proved* I should defer."

  Camp Two treats the PP as an **Axiom** (or a role-statement). They assume that 'chance' is a theoretical posit introduced *to explain* the structure of rational belief in the face of uncertainty. Hence, their complaint about the 'why defer?' question: "You are asking for a justification of a definition. There is nothing to justify; this is what the concept *does*."

  The reason the arguments stall is that Camp One demands an external validation that Camp Two's framework renders unintelligible, whilst Camp Two offers an internal coherence that Camp One finds question-begging. The 'embarrassments' you mentioned (Undermining vs. Circularity) are not fatal blows; they are merely the specific costs each side pays for their chosen explanatory direction. Camp One pays the 'Circularity Cost' (they cannot justify the norm without assuming it). Camp Two pays the 'Undermining Cost' (they must modify the principle to save the definition). Neither side concedes because neither sees their cost as a refutation, but rather as the price of admission for their methodology.

  ### Evaluating Your Hypothesis
  Your hypothesis—that this is a disagreement about what a theory of chance is *for*—is remarkably astute. It is essentially a more colloquial statement of my 'Explanatory Priority' diagnosis. You suggest Camp One sees chance as physics-delivered (World-to-Mind) and Camp Two sees it as an epistemic posit (Mind-to-World).

  I would refine this slightly: it is not just about 'purpose', but about **ontological commitment versus conceptual role**. Camp One believes chance has an ontology independent of us; Camp Two believes chance has an identity constituted by its role in our theory. You are correct that no argument will move them because they are grading the theories by different criteria. Camp One grades by *metaphysical robustness*; Camp Two grades by *systematic utility*.

  ### The Verdict on the Disagreement
  So, to answer your specific categorisation: this is a **Bedrock Starting Points** disagreement, which manifests as a **Hidden Substantive Question** about Humeanism.

  It is bedrock because it concerns the order of explanation (does metaphysics ground epistemology, or does epistemology constrain metaphysics?). You cannot argue someone out of a bedrock methodological commitment without offering them a whole new philosophical framework. However, it is also substantive because these methodological commitments entail different metaphysical views (Primitive Chance vs. Humean Best Systems).

  ### What Progress Looks Like
  Given this diagnosis, a standard argumentative victory is impossible. You will not prove the PP is a norm, nor will you prove it is constitutive. So, what counts as progress?

  1.  **Explicit Metaphysical Mapping:** Progress would look like forcing both camps to explicitly state their metaphysical commitments regarding Humean Supervenience. If your supervisor admits, "I am a Humean, which is why I accept the New Principle," and your flatmate admits, "I am a Primitivist, which is why I demand a justification for deference," the argument shifts. They are no longer arguing about the PP; they are arguing about Humeanism. This is a more fruitful debate with clearer criteria for success (e.g., can Humeanism account for laws of nature?).
  2.  **Accepting a Duality:** A sophisticated form of progress is recognising that 'chance' might be a **cluster concept**. It might be that there is no single thing that satisfies both the 'physics-delivered' role and the 'epistemic-guide' role perfectly. Progress would be acknowledging that Camp One is talking about *Physical Probability* and Camp Two is talking about *Epistemic Chance*, and the PP is the (imperfect) attempt to unify them.
  3.  **Formal Results on Stability:** If you want a technical route, look for formal results concerning the **stability of credence** under the New Principle versus the Old Principle. If it can be shown that the New Principle leads to diachronic instability in a way that violates other rational norms (like Reflection), that gives Camp One ammunition that isn't merely "it feels circular." Conversely, if it can be shown that Primitive Chance leads to ineffability (we can never know if we have latched onto the right property), that gives Camp Two ammunition that isn't merely "it's useful."

  **My Advice:**
  Stop trying to solve the Principal Principle. Instead, propose a session dedicated to "The Metaphysics of Chance." Ask your supervisor to write down the metaphysical commitments required for the constitutive view to hold, and ask your flatmate to write down the epistemic access conditions required for the normative view to hold.

  You will likely find that the disagreement is not about the principle itself, but about whether the universe is the sort of place that *allows* for a constitutive view (a Humean mosaic) or demands a normative one (a world of powers and propensities). Once that is on the table, you may find they are actually further apart than they thought—or that they have more common ground than they realised.

  In short: you are correct. It is a clash of philosophical visions. The PP is merely the battlefield, not the war.
