answer: |-
  This is a fantastic pivot point. You have identified the exact conceptual bottleneck that has stalled the philosophy of cultural evolution for thirty years. The field has been fighting over whether culture fits the *Neo-Darwinian Synthesis* (selection on blind variation via discrete replicators), while ignoring that Darwin himself operated with a *broader evolutionary pluralism* that included Lamarckian use-inheritance and structuralist direct effects.

  If you take Darwin's preface seriously, the question "Is cultural evolution Darwinian?" is a category error. It should be replaced by: **"What is the specific mixture of evolutionary mechanisms (selection, habit/use, niche construction) that drives cultural change, and how do they interact?"**

  Here is how I would restructure your final two seminars and the second half of your paper, prioritizing questions based on conceptual upstream/downstream relationships, philosophical tractability, and the corrective lens of that Darwin passage.

  ### I. The Revised Hierarchy of Questions

  You asked what should be on the list and in what order. The standard list starts with ontology (replicators) and moves to explanation. I propose flipping this to start with **mechanism**, because the mechanism determines what counts as a unit.

  **1. The Mechanism Mix (Upstream / Promoted)**
  *   *Old Question:* Is variation blind or guided?
  *   *New Question:* What is the relative causal weight of selection vs. "use/disuse" (habit/practice) vs. "direct action of conditions" (niche construction/scaffolding)?
  *   *Why Upstream:* You cannot define units (Question 2) until you know what process is preserving them. If "use and disuse" is dominant, the "unit" is a habit or skill, not a replicator.
  *   *Darwin Connection:* This directly operationalizes Darwin's defense. In culture, "use and disuse" maps onto **habit formation and skill acquisition**. "Direct action of conditions" maps onto **environmental scaffolding and niche construction**.
  *   *Philosophical Tractability:* High. This is conceptual analysis of causal models, not empirical measurement.

  **2. The Unit/Vehicle Problem (Midstream / Demoted)**
  *   *Old Question:* Are there cultural replicators (memes)?
  *   *New Question:* Given the mechanism mix, what is the appropriate *unit of analysis* for modeling? (Is it the trait, the practice, the artifact, or the cognitive schema?)
  *   *Why Demoted:* The memetics debate treats the lack of high-fidelity DNA-like copying as a fatal flaw. If we accept Darwin's pluralism, low-fidelity reconstruction is just a different inheritance system (Lamarckian/Developmental), not a failure to be "Darwinian."
  *   *Neglect:* This is currently wasted energy. Philosophers should stop policing the word "replicator" and start asking when the *heuristic* of a replicator is useful versus when a *developmental systems* approach is better.

  **3. Explanatory Scope vs. History (Downstream / The Test)**
  *   *Old Question:* Do these models explain anything social history doesn't?
  *   *New Question:* Does positing a specific mechanism mix (e.g., high selection/low construction vs. low selection/high habit) yield novel predictions or merely post-hoc narratives?
  *   *Why Downstream:* This is the validation step. You need the mechanism defined first to test it.

  **4. Agency and Normativity (Side-Constraint / Added)**
  *   *New Question:* If "use and disuse" (agency/practice) is a primary mechanism, how do we naturalize normativity without collapsing into intentionalism?
  *   *Why Added:* Darwin's admission regarding the "mind" implies mental habits are subject to evolutionary description. This bridges the gap between evolutionary theory and phenomenology/pragmatism, which is currently a dead zone in the literature.

  ---

  ### II. The Two Seminar Sessions

  The goal of these sessions is to move the students from "Defending/Attacking Memetics" to "Modeling Mechanism Pluralism."

  **Session 1: Beyond Selection — Habit, Scaffolding, and the Darwinian Pluralism**
  *   **Theme:** Operationalizing the *Descent of Man* preface.
  *   **Core Reading:**
      *   Darwin, *Descent of Man*, Preface to 2nd Ed (The anchor).
      *   Eva Jablonka & Marion Lamb, *Evolution in Four Dimensions* (Selection on the "Lamarckian" dimension).
      *   Laland et al., "Niche Construction as an Evolutionary Process" (For "direct action of conditions").
  *   **Discussion Arc:**
      1.  **De-center Selection:** If Darwin attributed "great weight" to use/disuse, why did the Neo-Darwinian synthesis (and consequently Memetics) try to purge it?
      2.  **Map to Culture:** "Use and disuse" in culture is **practice**. When I learn a tool, I don't just copy it; I modify it through use. Is this variation "guided"? Yes. Does that break the evolutionary model? No, if we accept Darwin's pluralism.
      3.  **The "Direct Action" Problem:** How much of cultural stability is due to selection of variants vs. the stability of the environment (niche) that forces convergence? (e.g., Do we all use smartphones because of cultural selection, or because the technological niche makes it the only viable option?)
  *   **Takeaway:** The "Blind vs. Guided" variation debate is a false dichotomy. The real variable is the *ratio* of selection to construction.

  **Session 2: Units, Explanation, and the "Darwinian" Label**
  *   **Theme:** What do we gain by keeping the label, and what are the units if replicators are gone?
  *   **Core Reading:**
      *   Dan Sperber, "Replicating or Representing?" (The attractor argument).
      *   Kim Sterelny, "The Evolution and Evolvability of Culture" (Defending the Darwinian frame despite noise).
      *   *Optional:* A specific case study (e.g., Mesoudi on pottery styles vs. Fracchia & Lewontin on the limits of cultural selection).
  *   **Discussion Arc:**
      1.  **The Unit Problem:** If inheritance is reconstructive (developmental) rather than replicative, is the "meme" dead? Or is it just a shorthand for a stable attractor in cognitive space?
      2.  **Explanatory Power:** If we allow for guided variation and niche construction, does the theory become too flexible? (i.e., Can it explain *anything*?) How do we constrain the models?
      3.  **The Label:** Should we drop "Darwinian" entirely? Or do we reclaim it as "Descent with Modification" (Darwin's original definition) rather than "Natural Selection on Replicators" (Dawkins's definition)?
  *   **Takeaway:** The value of the theory isn't in proving culture is "biological," but in using evolutionary *formalisms* to track causal processes that history alone misses.

  ---

  ### III. Direction for the Second Half of Your Paper

  Your first half likely established the tension between the strict Neo-Darwinian view (memetics) and the critics. The second half should argue for **Reclaiming Darwin's Pluralism as a Methodological Framework.**

  **The Argument:**
  1.  **Diagnosis:** The stalemate in cultural evolution theory arises from holding culture to a standard of "Darwinism" (Neo-Darwinian selection on blind variation) that biology itself no longer strictly meets, and that Darwin never claimed was exclusive.
  2.  **Proposal:** Adopt a **Mechanism-First Approach**. Instead of asking "Is this trait selected?", ask "What is the causal mix of Selection, Habit (Use/Disuse), and Scaffolding (Direct Action) here?"
  3.  **Application:** Show how this dissolves the "Guided Variation" problem. Guided variation isn't a bug; it's the cultural equivalent of "use and disuse." It accelerates change but still operates within a lineage of descent with modification.
  4.  **Conclusion:** The "Darwinian" label is only useful if it refers to the *population-level consequences* of these mixed mechanisms, not the *purity of the mechanism* itself.

  **Why this works:** It allows you to use the Darwin quote not as a historical curiosity, but as a philosophical wedge to break the current dichotomy. It moves you from defending a theory to refining a methodology.

  ---

  ### IV. Defending the Ordering & Tractability

  **Why Mechanism is Upstream:**
  You cannot determine if there are "replicators" (Question 2) until you decide if replication is the necessary mode of inheritance. If Darwin is right that "use and disuse" (developmental reconstruction) is a valid evolutionary mechanism, then high-fidelity copying is not a prerequisite for evolution. Therefore, the replicator debate is downstream of the mechanism debate.

  **Why This is Tractable for Philosophers:**
  Empirical researchers (anthropologists, modelers) are stuck measuring variables. Philosophers are needed to clarify *what counts as a variable*.
  *   *Example:* Modelers argue over transmission fidelity. Philosophers should ask: "Is fidelity the right metric if the mechanism is reconstructive?"
  *   *Example:* Historians argue over individual agency. Philosophers should ask: "How does 'use and disuse' naturalize agency without invoking dualism?"

  **What is Unduly Neglected:**
  The **"Direct Action of Changed Conditions"** (Niche Construction). Most cultural evolution theory focuses on how ideas spread *between* people. Very little focuses on how the material environment *constrains* the ideas. If I live in a digital niche, my "cultural variation" is heavily canalized by the software I use. This is Darwin's "direct action," and it is currently the biggest blind spot in memetics and DIT.

  ### V. Defeaters: What Would Change This Ranking?

  You asked what result or argument in the next few years would reshuffle this order.

  1.  **If "Cultural Genetics" Succeeds:** If cognitive science discovers discrete, high-fidelity neural encoding structures that function exactly like genes (e.g., specific "concept loci" that are copied without reconstruction), the **Replicator Question** shoots back to #1. The "use and disuse" model would be demoted to a secondary effect. (Unlikely, given current connectionist models, but possible).
  2.  **If Formal Models Fail:** If mathematical models incorporating pluralistic mechanisms (selection + bias + construction) prove to be mathematically intractable or offer no better predictive power than simple selection models, we will be forced back to the **Explanatory Scope** question as the primary bottleneck. We might have to accept "Darwinism" as a useful fiction (instrumentalism) rather than a mechanistic reality.
  3.  **If Agency is Re-naturalized:** If pragmatist philosophy or enactivist cognitive science provides a robust account of how "guided variation" is itself a product of evolutionary history (i.e., we are selected to guide variation), then the **Mechanism Mix** becomes less important than the **Origin of Agency**. This would push Question 4 (Agency) upstream.

  ### Summary Recommendation

  Use the Darwin quote to kill the "Purity Test." The field is exhausted by asking "Is it *really* Darwinian?" Your seminar and paper should argue that the only way forward is to ask "Which Darwin?"

  *   **Seminar 1:** Break the Selectionist Monopoly (Focus on Use/Disuse & Niche).
  *   **Seminar 2:** Rebuild the Units of Analysis (Focus on Attractors & Explanation).
  *   **Paper:** Argue that Cultural Evolution Theory needs a "Return to Darwin" (pluralism) to escape the "Neo-Darwinian Trap" (memetics).

  This positions you not just as a commentator on the literature, but as someone diagnosing its historical amnesia and proposing a path out of the stalemate.
