prompt: |-
  I'm working through a textbook chapter on moral psychology and it has a two-paragraph gloss on Adam Smith's Theory of Moral Sentiments that I don't fully trust. The gist, as the book puts it, is: "Sympathy in Smith is basically feeling what another person feels, like a mirror. The impartial spectator is the imagined audience of your community: you judge yourself by imagining how the people around you would react, and because you want their approval, their expected judgments become your conscience. That's why Smith is often accused of reducing morality to social conformity — on his view being moral just is fitting in, and a person raised among cannibals would, correctly by Smith's lights, judge cannibalism to be virtuous." Something feels off. I thought the impartial spectator was meant to be more idealized than the actual people around you, and that Smith distinguished being praised from being praise-worthy. But the textbook is by a serious philosopher, so maybe I'm overreading. Can you go through the gloss sentence by sentence and tell me which parts are accurate, which are acceptable simplifications, and which are actually wrong? In particuler, does the cannibal conclusion follow from anything Smith actually says, or does it depend on a conflation the book might be making? And is the "morality reduces to fitting in" objection one a Smithian has an answer to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is reading a textbook chapter on moral psychology.
      *   **Problem:** The textbook provides a two-paragraph gloss on Adam Smith's *The Theory of Moral Sentiments* (TMS) that the user suspects is inaccurate or overly simplistic.
      *   **Specific Claims to Evaluate:**
          1.  Sympathy = feeling what another feels (mirror).
          2.  Impartial Spectator = imagined audience of your community.
          3.  Conscience = wanting approval, so expected judgments become conscience.
          4.  Accusation: Smith reduces morality to social conformity (fitting in).
          5.  Conclusion: A person raised among cannibals would judge cannibalism virtuous.
      *   **User's Intuition:** The user thinks the Impartial Spectator is more *idealized* than actual people, and that Smith distinguishes *being praised* from *being praiseworthy*.
      *   **Task:** Go through the gloss sentence by sentence, evaluate accuracy (accurate, simplification, wrong), address the cannibal conclusion, and address the "morality = fitting in" objection.

  2.  **Deconstruct the Textbook's Claims vs. Smith's Actual Theory:**

      *   *Claim 1: "Sympathy in Smith is basically feeling what another person feels, like a mirror."*
          *   **Smith's View:** Smithian sympathy is *not* direct emotional contagion (Hume's view). It's imagining oneself in the other's situation. It's cognitive/projective, not just mirroring.
          *   **Verdict:** Inaccurate/Conflation with Hume.

      *   *Claim 2: "The impartial spectator is the imagined audience of your community."*
          *   **Smith's View:** It starts there (the "man without"), but it evolves into an internalized, idealized judge ("the man within"). It corrects the actual audience.
          *   **Verdict:** Half-true simplification. Misses the idealization/correction aspect.

      *   *Claim 3: "You judge yourself by imagining how the people around you would react, and because you want their approval, their expected judgments become your conscience."*
          *   **Smith's View:** We do seek approval, but the *conscience* is the *impartial* spectator, which often *opposes* the actual people around us. The desire for *praiseworthiness* exceeds the desire for *praise*.
          *   **Verdict:** Misleading. Confuses the desire for praise with the desire for praiseworthiness.

      *   *Claim 4: "That's why Smith is often accused of reducing morality to social conformity — on his view being moral just is fitting in..."*
          *   **Smith's View:** Smith explicitly argues against this. Custom influences judgment, but natural principles of approbation check custom.
          *   **Verdict:** Wrong interpretation of Smith, though it is a common *criticism* (which the book presents as fact).

      *   *Claim 5: "...and a person raised among cannibals would, correctly by Smith's lights, judge cannibalism to be virtuous."*
          *   **Smith's View:** Smith discusses custom extensively (Part V). He admits custom perverts sentiment but argues there are natural standards. He explicitly mentions that murder/infidelity are universally condemned. He does *not* endorse full relativism.
          *   **Verdict:** False conclusion. Smith would say the cannibal-raised person's spectator is *corrupted*, not correct.

  3.  **Address the User's Specific Questions:**
      *   *Does the cannibal conclusion follow?* No. It relies on ignoring Smith's distinction between the actual spectator and the *impartial* spectator, and ignoring his limits on custom.
      *   *Is there a Smithian answer to "morality = fitting in"?* Yes. The distinction between the desire for praise vs. praiseworthiness, and the autonomy of the "man within the breast."

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's intuition. They are right to be suspicious. The gloss is a caricature (often called the "Humean" reading of Smith).
      *   *Sentence-by-Sentence Analysis:*
          *   S1 (Sympathy): Clarify Smith vs. Hume. Smith = imaginative projection.
          *   S2 (Spectator/Community): Acknowledge the social origin but emphasize the *impartiality* and *idealization*.
          *   S3 (Conscience/Approval): Bring in the Praise vs. Praiseworthiness distinction (crucial point).
