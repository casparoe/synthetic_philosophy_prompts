answer: |-
  Your instincts are excellent. You are right to be suspicious. The gloss you are reading presents a specific, somewhat reductive interpretation of Adam Smith—one that was more common in mid-20th-century scholarship but has been heavily revised by contemporary Smith scholars (such as Charles Griswold, Samuel Fleischacker, and Vivienne Brown).

  The textbook is conflating Smith with David Hume and ignoring the normative, idealizing function of the Impartial Spectator. Your intuition about the distinction between "being praised" and "being praiseworthy" is the key to unlocking the error in the text.

  Here is a sentence-by-sentence breakdown of the gloss, followed by an analysis of the cannibal argument and the conformity objection.

  ### Sentence-by-Sentence Analysis

  **1. "Sympathy in Smith is basically feeling what another person feels, like a mirror."**
  *   **Verdict:** **Inaccurate.**
  *   **Analysis:** This is actually David Hume's definition of sympathy (emotional contagion). Smith explicitly rejects this in *The Theory of Moral Sentiments* (TMS). For Smith, sympathy is not catching a feeling; it is an act of **imaginative projection**. I do not feel *your* grief; I imagine what *I* would feel if I were in your situation. This distinction is crucial because it allows for disagreement: I might judge that your reaction is disproportionate to the situation. If sympathy were just a mirror, moral judgment would be impossible.

  **2. "The impartial spectator is the imagined audience of your community."**
  *   **Verdict:** **Acceptable Simplification (with a major caveat).**
  *   **Analysis:** It is true that the Spectator *originates* socially. We learn to judge ourselves by seeing how others judge us (the "man without"). However, the gloss stops there. The *Impartial* Spectator is the *idealized* version of that audience. It is the "man within the breast" who is detached from our own passions and the specific biases of our local community. It is a regulatory ideal, not just a headcount of the neighbors.

  **3. "You judge yourself by imagining how the people around you would react, and because you want their approval, their expected judgments become your conscience."**
  *   **Verdict:** **Misleading / Partially Wrong.**
  *   **Analysis:** This ignores Smith's crucial distinction between the **desire for praise** and the **desire for praiseworthiness**. Smith argues that while we naturally want approval, a mature moral agent cares more about *deserving* approval. The conscience (the Impartial Spectator) often tells us we are wrong even when the community applauds us. If conscience were merely internalized community judgment, martyrs and reformers would be psychologically impossible in Smith's system. They are not.

  **4. "That's why Smith is often accused of reducing morality to social conformity — on his view being moral just is fitting in..."**
  *   **Verdict:** **Accurate as a report of a criticism, but False as a report of Smith's view.**
  *   **Analysis:** It is true that Smith is *accused* of this (by Hegel and others). However, the gloss presents this accusation as if it were a settled fact about Smith's theory. Smith explicitly argues against this. He acknowledges that custom influences morality, but he insists there are "natural principles of approbation" that allow us to critique custom.

  **5. "...and a person raised among cannibals would, correctly by Smith's lights, judge cannibalism to be virtuous."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is the "cannibal objection," and it does not follow from Smith's actual text. Smith addresses the limits of custom in Part V of TMS. He admits that custom can warp our sentiments (e.g., making infanticide acceptable in ancient Greece), but he argues there are hard limits. He states that certain behaviors (like murder or gross ingratitude) violate natural principles so fundamentally that no amount of custom can make them appear truly virtuous to a properly functioning spectator. A person raised among cannibals would have a *corrupted* spectator, not a *correct* one.

  ---

  ### Does the "Cannibal Conclusion" Follow?

  No, it depends on a conflation the textbook is making between the **actual spectator** and the **impartial spectator**.

  Smith acknowledges that custom creates variation in moral rules (e.g., styles of dress, etiquette, some sexual norms). However, he argues that custom cannot override the fundamental principles of human nature regarding harm and justice.

  In TMS (Part V, Chapter 2), Smith writes about the limits of custom. He argues that if a society were to endorse something that violates the fundamental conditions of human flourishing (like eating human flesh), the Impartial Spectator within an individual—even one raised in that society—would eventually register a dissonance. The "man within" is not just a recording of the "man without"; it is a judge *of* the "man without."

  The textbook's conclusion assumes Smith is a moral relativist. Smith is better understood as a **moral sentimentalist with universalist commitments**. He believes the *mechanism* of morality is social, but the *standards* are grounded in human nature, which is universal. Therefore, a cannibal-raised person judging cannibalism as virtuous would be an example of moral error in Smith's system, not moral correctness.

  ### Is there a Smithian Answer to the "Conformity" Objection?

  Yes. This is the strongest part of your intuition. The "morality reduces to fitting in" objection is one Smith anticipates and answers through the development of the **autonomous conscience**.

  1.  **Praise vs. Praiseworthiness:** As you noted, Smith distinguishes between wanting to be praised (vanity) and wanting to be praiseworthy (virtue). The virtuous person prefers the judgment of the Impartial Spectator over the actual applause of the crowd.
  2.  **The Solitary Judge:** Smith describes the development of the Spectator as a process of internalization. Eventually, we can judge ourselves even in solitude. We imagine how a neutral, well-informed observer would judge us, not just how our specific neighbors would. This allows the individual to stand against the mob.
  3.  **Correction of Sentiment:** The Impartial Spectator's job is to correct our passions. If my community is angry and wants to lynching an innocent person, my own passions might align with them. The Impartial Spectator steps back, looks at the facts, and says, "This punishment is disproportionate." This allows for moral reform.

  ### Summary for Your Studies

  You are not overreading. The textbook is presenting a **sociological reduction** of Smith that ignores the **normative** dimension of his work.

  *   **Keep:** The idea that morality is social in origin (we learn it from others).
  *   **Discard:** The idea that morality is *defined* by current social approval.
  *   **Key Correction:** Smith's Impartial Spectator is a tool for **critiquing** society, not just mirroring it.

  If you need to cite this in an essay, you might note that while the textbook presents the "conformity interpretation," contemporary scholarship emphasizes Smith's distinction between the *de facto* judgments of society and the *normative* judgments of the Impartial Spectator, which preserves the possibility of moral progress and dissent.
