prompt: |-
  So I'm in this history class and we got into this huge argument last week about WWI and whether it was basically inevitable. My teacher made this distinction that kind of broke my brain. She said there are two different ways an event can have "too many causes." First there's what she called stacked causes, where a bunch of things all happen at once and each one on its own would've been enough — like if a bridge collapses because it was rusted through AND a truck crashed into it at the same moment, when either thing alone would've brought it down. Then there's backup causes, where only one thing actually does the job, but something else was waiting in line — like the bridge collapses because of the truck, but it was so rusted it definately would've fallen next winter anyway.

  My friend says WWI was the backup kind: the assassination of Franz Ferdinand caused it, but if that hadn't happened, some other crisis in the Balkans or Morocco or wherever would've set things off eventually, what with the alliances and the arms race and the generals' mobilization timetables. I argued it was more the stacked kind, since a bunch of tensions were already at the breaking point in 1914 specifically. We sort of hit a wall though, because neither of us could say what would actually settle it.

  So can you compare these two ways an event can be multi-caused — I think philosophers call them overdetermination and preemption? Which one do you think fits WWI better, and what would count as evidence either way? Also, does it even matter? Like, does calling an event overdetermined vs preempted change how inevitable we should think it was, or how we assign blame to the people involved? My teacher keeps saying stuff like "if it would have happened anyway, nobody's really responsible" and that seems off to me, but I can't articulate why. And is there any general test for telling the two apart in real historical cases, or do historians just argue about it forever?
