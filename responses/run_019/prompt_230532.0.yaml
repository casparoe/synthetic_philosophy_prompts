      *   *Sunk Cost Fallacy:* "We spent $X, so we must continue." (Invalid reasoning).
      *   *Switching Costs:* One-time friction to move. (Valid economic consideration).
      *   *Lock-in/Increasing Returns:* The *ongoing* benefits of the current path increase over time, or the *ongoing* costs of the alternative increase relative to the current state due to network effects, learning curves, or complementary assets.
