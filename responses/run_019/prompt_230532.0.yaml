answer: |-
  # Internal Guide: The Stay-vs-Switch Decision Procedure

  **To:** Engineering Leadership and Staff Engineers
  **From:** Staff Engineering Office
  **Subject:** A Rigorous Procedure for Technology Retention vs. Migration Decisions

  ## 1. Purpose and Scope
  We frequently face decisions on whether to retain an existing technology or migrate to a new one. Currently, these debates oscillate between two unhelpful extremes:
  1.  **The Sunk Cost Fallacy:** "We have invested too much to stop." (Invalid reasoning).
  2.  **The Greenfield Fallacy:** "The old system is debt; the new system is progress." (Ignores transition risks).

  This guide provides a decision procedure grounded in the economics of **Path Dependence**. It distinguishes between costs that are gone (sunk), costs that are one-time friction (switching costs), and structural dynamics where the past actively reshapes future payoffs (path dependence).

  **Goal:** A senior engineer should be able to run this procedure in under one hour to produce a documented recommendation.

  ---

  ## 2. Key Concepts (Plain Language Glossary)
  *   **Sunk Cost:** Money or time already spent. It is gone. It cannot be recovered by staying or switching. **It must be ignored in this procedure.**
  *   **Switching Cost:** A one-time "tax" paid to move from System A to System B (e.g., migration labor, downtime, retraining). This is standard Capital Expenditure (CapEx).
  *   **Path Dependence (Compounding Advantage):** A dynamic where using System A makes System A *relatively cheaper or safer* over time compared to System B. This is not just "we know it well"; it is "the gap between A and B widens the longer we wait."
  *   **Complementary Assets:** External resources that make a technology more valuable (e.g., hiring pool, third-party libraries, vendor support).
  *   **Irreducible Value Judgment:** A decision about risk tolerance or strategy that math cannot solve (e.g., "Is it worth paying 20% more to own our own data?").

  ---

  ## 3. The Decision Procedure

  ### Phase 1: The Sunk Cost Filter
  *Objective: Remove invalid arguments from the discussion.*

  **Question 1.1:** Are any arguments for staying based on money/time already spent?
  *   *Examples:* "We spent two years building this," "We just renewed the license," "The team worked overtime to launch this."
  *   **Action:** If yes, strike these arguments from the record. They are irrelevant to the future payoff.
  *   **Pass Condition:** All remaining arguments refer to *future* costs, risks, or benefits.

  ### Phase 2: The Switching Cost Inventory (Standard Cost-Benefit)
  *Objective: Quantify the one-time "tax" of moving.*

  **Question 2.1:** What is the one-time engineering effort to migrate?
  *   *Measure:* Engineer-weeks required to reach feature parity.
  *   **Sufficient Answer:** A range (e.g., "6–9 engineer-months").

  **Question 2.2:** What is the one-time operational risk?
  *   *Measure:* Expected downtime, data loss risk, or performance regression during cutover.
  *   **Sufficient Answer:** A risk classification (Low/Medium/High) with mitigation plan.

  **Question 2.3:** What is the one-time financial cost?
  *   *Measure:* Vendor termination fees, new license upfront costs, dual-run infrastructure costs.
  *   **Sufficient Answer:** A dollar figure or percentage of budget.

  **Decision Point A:** If the Switching Cost (Phase 2) exceeds the *annual* operational budget of the current system by more than 3x, **default to STAY** unless Phase 3 identifies a critical existential risk. Hand back to standard ROI analysis.

  ### Phase 3: The Path Dependence Test
  *Objective: Identify if the system exhibits self-reinforcing dynamics.*
  *Note: This is the core differentiator. We are looking for mechanisms where history changes the future landscape, not just the balance sheet.*

  **Question 3.1: Human Capital Compounding.**
  Does the team's ability to maintain the current system improve faster than their ability to learn the new system?
  *   *Look for:* Institutional memory of rare failure modes, runbooks that only work because of specific quirks, tacit knowledge not documented.
  *   *Test:* If we switch, do we lose the ability to diagnose critical failures for >6 months?
  *   **Verdict:** If **Yes**, this is Path Dependence. The "cost" of switching isn't just training; it is a temporary loss of competence.

  **Question 3.2: Complementary Asset Network.**
  Does the value of the current system depend on external adoption (hiring market, libraries, vendors)?
  *   *Look for:* Is the hiring pool shrinking? Are security patches slowing down? Are third-party integrations breaking?
  *   *Test:* Is the ecosystem around the current system growing or shrinking relative to the alternative?
  *   **Verdict:** If the ecosystem is **shrinking**, this is *Negative* Path Dependence. The system is becoming objectively more expensive to keep every year. If **growing**, it is *Positive* Path Dependence.

  **Question 3.3: Integration Surfaces (Lock-in).**
  How many other systems depend on the specific output or behavior of this system?
  *   *Look for:* Data formats, API contracts, hard-coded assumptions in downstream services.
  *   *Test:* If we change this system, how many *other* teams must change their code?
  *   **Verdict:** If >3 downstream teams must modify code, this is **Structural Lock-in**. The switching cost is not linear; it is exponential relative to organizational coordination.

  **Decision Point B:**
  *   If Phase 3 shows **Positive Path Dependence** (Compounding Human Capital + Growing Ecosystem + High Lock-in): **Strong Recommendation to STAY.** The "tax" of leaving increases every year.
  *   If Phase 3 shows **Negative Path Dependence** (Shrinking Ecosystem + Brittle Integration): **Strong Recommendation to SWITCH.** The "tax" of staying increases every year.

  ### Phase 4: Irreducible Value Judgments
  *Objective: Acknowledge where the procedure ends and leadership begins.*

  Even if the math favors one side, leadership must decide on:
  1.  **Strategic Optionality:** Are we keeping this technology to preserve a future capability we might need? (e.g., "We keep on-prem DBs to satisfy future data sovereignty laws," even if cloud is cheaper).
  2.  **Risk Tolerance:** Are we willing to accept the "unknown unknowns" of a new system vs. the "known unknowns" of the old one?
  3.  **Vendor Power:** Are we comfortable giving a single vendor leverage over our roadmap?

  **Final Output:** A written memo stating:
  1.  Sunk costs purged.
  2.  Switching costs quantified.
  3.  Path dependence mechanisms identified (Positive or Negative).
  4.  Value judgments explicitly stated.

  ---

  ## 4. Applied Case Studies

  ### Case 1: The Ten-Year-Old Monolith
  **Context:** A core revenue monolith. Senior engineers know it well. Migration to microservices estimated at 12 months. External ecosystem has moved to services; hiring for the monolith's language is getting harder.

  **Procedure Run:**
  *   **Phase 1 (Sunk Cost):** Argument "We spent 10 years building this" is discarded.
  *   **Phase 2 (Switching Cost):** 12 engineer-months (High). Risk of regression during split (Medium).
  *   **Phase 3 (Path Dependence):**
      *   *Human Capital:* Current team is fast, but hiring is slowing. **Neutral/Negative.**
      *   *Ecosystem:* Library support is decaying. Security patches are slower. **Negative Path Dependence.**
      *   *Integration:* High coupling internally, but external API is stable. **Neutral.**
  *   **Phase 4 (Value):** Leadership values hiring velocity over short-term stability.

  **Verdict:** **SWITCH.**
  **Reasoning:** While the switching cost is high, the *Negative Path Dependence* (shrinking ecosystem/hiring pool) means the cost of staying will rise annually. The monolith is becoming an "island" that gets more expensive to maintain every year. The 12-month migration is a one-time tax to escape a recurring tax.

  ---

  ### Case 2: The Homegrown Message Queue Wrapper
  **Context:** A custom wrapper around an open-source queue. Hooked into 40 services. On-call runbooks rely on specific quirks of the wrapper. A managed cloud queue would reduce OpEx by 15%. Engineers want to switch to reduce toil.

  **Procedure Run:**
  *   **Phase 1 (Sunk Cost):** Argument "We built this, we should use it" is discarded.
  *   **Phase 2 (Switching Cost):** 6 engineer-months to decouple 40 services. Risk of message loss during cutover (High).
  *   **Phase 3 (Path Dependence):**
      *   *Human Capital:* Veterans know exactly how the wrapper fails under load. Managed service failure modes are unknown. **Positive Path Dependence (Competence).**
      *   *Ecosystem:* Managed service has better tooling, but the wrapper is stable. **Neutral.**
      *   *Integration:* 40 services depend on the wrapper's specific retry logic. **High Structural Lock-in.**
  *   **Phase 4 (Value):** Leadership prioritizes reliability over OpEx savings.

  **Verdict:** **STAY.** (Unpopular Recommendation)
  **Reasoning:** Engineers instinctively want to remove "toil" (homegrown code). However, the procedure identifies **Positive Path Dependence** in *institutional memory*. The runbooks and quirk knowledge are assets, not just debt. The 15% OpEx saving does not justify the risk of losing deep failure-mode knowledge (Human Capital Compounding) and the coordination cost of updating 40 services (Structural Lock-in). The "toil" is actually the price of reliability.

  ---

  ### Case 3: Post-Merger Identity System (IAM)
  **Context:** Merger complete. Company A (us) has a newer, simpler IAM. Company B (legacy) has an older, complex IAM with 10x the users and 500+ integrations (SSO, billing, support). Switching burden falls on Company B.

  **Procedure Run:**
  *   **Phase 1 (Sunk Cost):** Argument "Company B spent millions on their IAM" is discarded.
  *   **Phase 2 (Switching Cost):** Migrating 500 integrations is estimated at 18 months. **Very High.**
  *   **Phase 3 (Path Dependence):**
      *   *Human Capital:* Company B's team knows their complex policies. **Positive.**
      *   *Ecosystem:* Both are standard, but Company B's has more third-party connectors. **Positive for Legacy.**
      *   *Integration:* 500 integrations vs 50. **Extreme Structural Lock-in.**
  *   **Phase 4 (Value):** Leadership wants a "fresh start" culturally.

  **Verdict:** **ADOPT LEGACY (Company B) SYSTEM.** (Unpopular Recommendation)
  **Reasoning:** Engineers prefer the "newer, simpler" tech (Company A). However, the procedure identifies **Extreme Structural Lock-in**. The value of an IAM system is defined by what is connected to it. The "simplicity" of Company A's system is an illusion; it becomes complex the moment you try to attach 500 legacy integrations. The path dependence here is driven by *Complementary Assets*. Switching to the "better" tech creates a massive coordination bottleneck. The rational economic choice is to absorb the "worse" technology because the switching tax outweighs the technical superiority.

  ---

  ## 5. Limitations: What This Procedure Cannot Do

  This procedure is a diagnostic tool, not a moral arbiter. It clarifies the landscape, but it cannot make the final leap in two specific scenarios:

  **1. The "Break the Chain" Decision**
  Sometimes the procedure will tell you: *"You are locked in, and staying is the rational economic choice."*
  However, strategy sometimes requires irrational economics. If a technology is locked in but strategically dangerous (e.g., a vendor who could become a competitor, or a data format that limits AI adoption), you may choose to switch *despite* the procedure's recommendation.
  *   **Action:** If you override the procedure, you must explicitly document the *Strategic Optionality* value. You are paying a premium to buy future freedom. That is a valid business decision, but it must be recognized as paying for optionality, not efficiency.

  **2. The "Slow Death" Scenario**
  Path dependence theory explains why we are stuck, but it does not predict *when* the lock-in will break. A system can be path-dependent and rational to keep for five years, then become obsolete in year six due to an external shock (e.g., a security paradigm shift).
  *   **Action:** This procedure is a snapshot. It must be re-run annually. A "Stay" verdict is a one-year lease, not a permanent deed.

  **3. Distinguishing "Comfort" from "Competence"**
  In Phase 3, Question 3.1, teams often confuse "we are comfortable" with "we have compounding competence."
  *   **Action:** If the team cannot point to specific failure modes or optimizations they can handle *now* that they couldn't handle a year ago, it is comfort, not path dependence. Comfort is a sunk cost; competence is an asset. Do not let comfort masquerade as path dependence.

  ### Summary for Leadership
  Use this guide to stop the debate about "what we spent" and start the debate about "what the future costs." When the procedure says **Stay**, it is not because we are afraid to change; it is because the switching tax is higher than the maintenance tax. When it says **Switch**, it is not because the old system is "bad"; it is because the ecosystem is leaving us behind. Make the decision based on the mechanism, not the emotion.
