prompt: |-
  In my upper-division philosophy of science seminar I regularly defend evolutionary psychology against the charge that it traffics in just-so stories, and I had long assumed the charge was more of a rhetorical posture than an argument. Last term, however, a student reconstructed it in a form I have not been able to answer cleanly, and I would like a diagnosis before I teach the unit again. Her argument ran as follows:

  (1) A hypothesis is scientific only if evidence bears on it asymmetrically: there must be possible observations that would count for it and possible observations that would count against it, and one must be able to say in advance, at least roughly, which are which.

  (2) Adaptationist hypotheses about human cognition -- that we possess a dedicated cheater-detection module, that pregnancy sickness is an adaptation protecting the fetus from dietary toxins, that men and women differ in jealousy because the ancestral costs of infidelity were asymmetric -- are confirmed when observed behavior fits the hypothesis's retrodictions.

  (3) But for any observed behavior whatsoever, some adaptationist accommodation can be constructed after the fact. If the predicted trait appears, it is an adaptation. If it fails to appear, the cost of the trait exceeded the benefit, or the relevant selection pressure was absent. If the opposite of the prediction appears, the environment of evolutionary adaptedness must have differed from what was assumed, or the trait is a byproduct of some other adaptation, or a developmental constraint blocked the optimum. Nothing in the method forbids any of these moves.

  (4) Therefore no possible observation counts against an adaptationist hypothesis; such hypotheses can only be confirmed, never disconfirmed.

  (5) By (1), adaptationist hypotheses in evolutionary psychology are not scientific.

  Her conclusion in (5) is already more than I want to grant, but the real trouble is that the argument appears to prove too much. Phylogenetic reconstruction, historical geology, and much of cosmology also infer past processes from present traces, and in each case a sufficiently clever theorist can accommodate anomalous traces by revising auxiliary assumptions about initial conditions or background processes. If (3) and (4) are sound as applied to evolutionary psychology, parallel versions seem available for these fields -- and I am not prepared to conclude that inferring the tree of life from molecular sequences is unscientific. Nor do I want to win cheaply by pointing to cases where adaptationist reasoning got there first, as Fisher's sex-ratio argument is sometimes said to have done, since the student's premise (1) demands advance asymmetry and that case arguably supplies it.

  Which step should I reject? I am most reluctant to give up (1), since some version of it seems required to distinguish empirical inquiry from unfalsifiable systematizing. If the flaw lies in (3) or (4), explain what an adaptationist hypothesis would have to look like for an observation genuinely to count against it, and whether actual research programs in evolutionary psychology meet that standard or merely gesture at it. And tell me what rejecting your chosen step costs -- what other commitments, in evolutionary biology or in the historical sciences generally, I would have to revise or abandon along with it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Upper-division philosophy of science seminar.
      *   **Topic:** Defense of Evolutionary Psychology (EP) against the "just-so stories" charge.
      *   **The Problem:** A student presented a specific, reconstructed argument (premises 1-5) that the instructor finds difficult to answer cleanly.
      *   **The Argument:**
          *   (1) Scientific hypotheses require asymmetric evidence (falsifiability/confirmability distinction).
          *   (2) EP hypotheses are confirmed by retrodictions fitting observed behavior.
          *   (3) EP hypotheses can accommodate *any* observation via auxiliary assumptions (cost/benefit, EEA differences, byproducts, constraints).
          *   (4) Therefore, no observation counts against EP (no disconfirmation).
          *   (5) Therefore, EP is not scientific.
      *   **The Instructor's Dilemma:**
          *   Doesn't want to grant (5).
          *   Suspects the argument proves too much (threatens historical sciences like geology, cosmology, phylogenetics).
          *   Reluctant to reject (1) (seems essential for science).
          *   Wants to know which step to reject (likely 3 or 4).
          *   Wants to know what a *genuine* disconfirmation looks like for EP.
          *   Wants to know the costs of rejecting that step (implications for evolutionary biology/historical sciences).

  2.  **Deconstruct the Student's Argument:**
      *   **Premise (1):** A version of falsificationism (Popperian). It's a strong criterion. "Asymmetry of evidence."
      *   **Premise (2):** Describes the methodology of EP (retrodiction).
      *   **Premise (3):** The "Immunization Strategy" charge. EP is flexible enough to explain away counter-evidence. This is the core of the "just-so story" critique.
      *   **Premise (4):** The inference from (3) to "no disconfirmation possible."
      *   **Conclusion (5):** Demarcation judgment.

  3.  **Evaluate the Premises:**
      *   **(1):** Is it too strong? Lakatos and Quine-Duhem suggest *no* hypothesis is tested in isolation. Auxiliary assumptions always protect the core. However, as a *regulative ideal*, it's useful. The instructor wants to keep it.
      *   **(2):** Generally accurate description of EP methodology.
      *   **(3):** This is the weak link, but it requires nuance. It claims *anything* can be accommodated *without cost*. The Duhem-Quine problem applies to *all* science, but some theories are more degenerative than others. The key is whether the accommodations are *ad hoc* or independently testable.
      *   **(4):** Follows from (3), but if (3) is qualified, (4) fails.

  4.  **Identify the Best Point of Attack:**
      *   **Rejecting (1):** Too costly for a philosophy of science class focused on demarcation.
      *   **Rejecting (2):** Hard to deny EP does this.
      *   **Rejecting (3) or (4):** This is the sweet spot. The claim that *no* observation counts against EP is false. The claim that *any* accommodation is permissible without damaging the theory is false.
      *   **The "Proves Too Much" Objection:** The instructor is right. If (3) kills EP, it kills geology. Why? Because historical sciences rely on "uniformitarianism" or background assumptions that can be tweaked. The defense must show how historical sciences *do* maintain asymmetry despite being historical.

  5.  **Formulate the Diagnosis:**
      *   **Core Flaw:** Premise (3) conflates *logical possibility* of accommodation with *methodological permissibility*. Just because you *can* invent an auxiliary hypothesis doesn't mean you *should* (or that the theory remains scientific if you do it constantly).
      *   **Key Concept:** Independent testability of auxiliary assumptions (Lakatos/Popper).
      *   **Key Concept:** The distinction between "Adaptationist Program" (heuristic) vs. "Specific Adaptationist Hypothesis" (testable claim).
      *   **Addressing the "Proves Too Much":** Historical sciences constrain auxiliary assumptions via independent evidence (e.g., rock strata, fossil records, physics of cosmology). EP must do the same (e.g., independent evidence of EEA, genetic constraints).

  6.  **Develop the Response Structure:**
      *   **Acknowledge the Strength:** Validate the student's argument (it's a sophisticated Duhem-Quine application).
      *   **Diagnose the Flaw:** Target Premise (3) and the inference to (4). The error is ignoring the *cost* of auxiliary assumptions.
      *   **The Solution (Asymmetry in Historical Science):** Explain how asymmetry works in historical sciences (consilience, independent evidence).
      *   **Concrete EP Examples:** Show what genuine disconfirmation looks like in EP (e.g., universality claims, neurological constraints, mismatch predictions).
      *   **The Cost:** What does rejecting (3) commit us to? It commits us to a Lakatosian view of research programs. It admits EP is often "degenerative" but not inherently "unscientific." It requires rigorous constraint on EEA modeling.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining Premise 1:* Don't abandon it, but clarify it. It's not about single hypotheses, but research programs.
      *   *Refining Premise 3:* The student assumes auxiliary assumptions are free. They aren't. If I say "The environment was different," I need evidence the environment was different *independent* of the trait.
      *   *Refining the "Proves Too Much":* Geology uses physics/chemistry. EP uses anthropology/archaeology/genetics. If EP ignores those, it *is* unscientific. If it uses them, it *is* scientific.
      *   *Specific Disconfirmation:* What kills an EP hypothesis?
          *   Lack of universality (if claimed).
          *   Neurological impossibility.
          *   Phylogenetic evidence (trait existed before the proposed pressure).
          *   Better non-adaptationist explanation (spandrel) with independent support.
      *   *The "Cost":* You have to admit that *much* popular EP is indeed unscientific (just-so), even if the *field* isn't. You have to embrace methodological constraints that limit the "clever theorist."

  8.  **Final Polish:** Ensure the tone is appropriate for a colleague (philosophy of science seminar). Use standard terminology (Duhem-Quine, Lakatos, independent testability, consilience). Make sure to directly answer the prompt's specific questions (Which step? What does disconfirmation look like? What are the costs?).

      *   *Self-Correction during drafting:* I initially thought about attacking (1). But the instructor said they are reluctant to give up (1). I should respect that. I will argue that (1) is compatible with rejecting (3). The asymmetry exists, but it's at the level of the *research program* or the *network of assumptions*, not the isolated hypothesis.
      *   *Focus:* The student's argument relies on the idea that auxiliary assumptions are *unconstrained*. The rebuttal is that in good science, they are *constrained*.

  9.  **Finalizing the Argument:**
      *   **Reject (3).** It asserts that accommodations are methodologically free. They are not.
      *   **Disconfirmation:** Occurs when the auxiliary assumptions required to save the hypothesis are independently falsified or less plausible than the null.
      *   **Cost:** You must distinguish between the *Adaptationist Heuristic* (always useful) and *Specific Claims* (often wrong). You must admit that EP is only as good as its auxiliary data (archaeology, genetics).

  10. (Review against prompt constraints):
      *   Diagnose the argument.
      *   Identify which step to reject.
      *   Explain what genuine disconfirmation looks like.
      *   Address the "proves too much" (historical sciences).
      *   Explain the costs of rejecting the step.

      *Plan looks solid.*
answer: |-
  This is an excellent reconstruction of the "just-so story" critique. Your student has effectively weaponized the Duhem-Quine thesis (that hypotheses are not tested in isolation but as a bundle with auxiliary assumptions) against evolutionary psychology (EP). Her argument is valid; if the premises hold, the conclusion follows.

  However, the argument is unsound because **Premise (3) is false**, or at least radically incomplete. It conflates the *logical possibility* of saving a hypothesis with the *methodological permissibility* of doing so.

  Here is the diagnosis, the recommended rejection, and an analysis of the costs involved.

  ### 1. The Diagnosis: Where the Argument Fails

  You should reject **Premise (3)**.

  The student argues: *"Nothing in the method forbids any of these moves."* This is the error. While logic forbids no moves, scientific methodology forbids many of them. Specifically, it forbids *ad hoc* modifications to auxiliary assumptions that lack independent testability.

  The student's argument relies on a naive falsificationism that ignores how historical sciences actually function. In historical sciences (geology, cosmology, evolutionary biology), we test hypotheses against a background of **independently established constraints**.
  *   **Geology:** You cannot explain away an anomalous rock layer by saying "gravity worked differently here" unless you have independent physical evidence that gravity differed. You must appeal to stratigraphy, radiometric dating, or sedimentology.
  *   **Cosmology:** You cannot explain away cosmic background radiation anomalies by arbitrarily changing initial conditions; the conditions must be consistent with the Standard Model and other astrophysical data.

  The student's Premise (3) assumes the adaptationist theorist has a "blank check" to rewrite the Environment of Evolutionary Adaptedness (EEA), cost-benefit ratios, or genetic constraints. In rigorous EP, they do not. The EEA is not a fictional backdrop; it is a hypothesis about Pleistocene ecology constrained by paleoclimatology, archaeology, and primatology.

  Therefore, Premise (4) ("no possible observation counts against") does not follow from (3), because (3) ignores the evidential cost of the accommodations.

  ### 2. What Genuine Disconfirmation Looks Like

  To satisfy Premise (1) (asymmetry of evidence), an adaptationist hypothesis must be embedded in a network of auxiliary assumptions that are themselves vulnerable. Here is what disconfirmation looks like in practice, distinguishing between "popular EP" (which often invites the student's critique) and "rigorous EP."

  **A. The Universality Claim**
  *   **Hypothesis:** "Module X is an adaptation for Y."
  *   **Auxiliary Assumption:** Adaptations for fundamental survival/reproduction problems should be species-typical (universally present), barring known pathologies.
  *   **Disconfirmation:** If rigorous cross-cultural study shows the trait is absent in hunter-gatherer societies that closely resemble the EEA, the hypothesis is damaged.
  *   **The "Save":** The theorist might say, "The environment differed."
  *   **The Cost:** They must provide *independent* archaeological evidence that the environment differed in a way relevant to Y. If they cannot, the hypothesis loses credibility.

  **B. The Design Specification (Engineering Constraints)**
  *   **Hypothesis:** "Pregnancy sickness is an adaptation to expel toxins."
  *   **Auxiliary Assumption:** The mechanism should activate specifically when toxins are present and during the window of fetal vulnerability (organogenesis).
  *   **Disconfirmation:** If sickness correlates with non-toxic foods, or persists past the vulnerable window, or fails to activate when high-toxin foods are consumed, the hypothesis is disconfirmed.
  *   **The "Save":** "It's a byproduct of hormonal changes."
  *   **The Cost:** This concedes the adaptationist claim. You have saved the *organism's fitness* explanation but abandoned the *specific adaptation* hypothesis. This counts as a defeat for the specific EP claim.

  **C. Phylogenetic Pre-dating**
  *   **Hypothesis:** "Human jealousy is an adaptation to sperm competition."
  *   **Auxiliary Assumption:** The trait emerged when sperm competition became a selection pressure.
  *   **Disconfirmation:** If comparative psychology shows the same jealousy mechanisms in monogamous primate ancestors where sperm competition was negligible, the specific adaptationist story is falsified (it is likely a phylogenetic inertia/byproduct).

  **D. Neurological Impossibility**
  *   **Hypothesis:** "We have a dedicated module for detecting cheaters."
  *   **Auxiliary Assumption:** The brain has the computational architecture to support a dedicated module.
  *   **Disconfirmation:** If neuroscience demonstrates that the proposed computation is performed by domain-general mechanisms already occupied by other tasks (e.g., general logic or working memory), the "dedicated module" claim is falsified.

  In all these cases, the observation *does* count against the hypothesis. The theorist *can* invent a save, but doing so requires borrowing credibility from other fields (archaeology, endocrinology, phylogenetics). If those fields don't support the save, the EP hypothesis takes the hit.

  ### 3. Addressing the "Proves Too Much" Objection

  You are correct that this argument threatens historical sciences. The solution is to recognize that **all historical sciences rely on "consilience" (the jumping together of evidence).**

  In geology, a hypothesis about a past flood is scientific not because the flood is observable, but because the hypothesis predicts sediment layers, fossil distributions, *and* isotopic ratios simultaneously. If you adjust the flood hypothesis to fit the sediment, you might break the fit with the isotopes.

  EP is scientific *only insofar as* it is constrained by independent evidence about the EEA and human biology.
  *   **Scientific EP:** Uses archaeological data to constrain EEA models; uses genetics to constrain heritability; uses neuroscience to constrain mechanism.
  *   **Unscientific EP (Just-So):** Treats the EEA as a magic box where any condition can be postulated to save the hypothesis.

  Your student's argument successfully condemns *Unscientific EP*. It fails to condemn *Scientific EP* for the same reason it fails to condemn Geology: it ignores the web of independent constraints.

  ### 4. The Costs of Rejecting Premise (3)

  If you reject (3) and teach your students that EP is scientific *provided* it respects independent constraints, you incur several theoretical costs. You must be prepared to admit these in your seminar:

  **Cost 1: Much of "Pop EP" is indeed Pseudoscience.**
  You cannot defend the field as it appears in popular trade books. Many popular adaptationist claims *do* traffic in unconstrained auxiliary assumptions. You must distinguish between the *research program* (which is scientific) and specific *degenerative instances* (which are not). You are defending the *methodology*, not the track record of every practitioner.

  **Cost 2: The Adaptationist Program is a Heuristic, Not a Truth.**
  You must concede that adaptationism is a methodological stance (Gould and Lewontin's critique has force here). It is a "best first guess." Rejecting (3) means admitting that when an adaptationist hypothesis fails (e.g., due to phylogenetic constraint), the failure is genuine. You cannot simply say "it's still adaptationist, just complex." Sometimes the adaptationist stance is the wrong tool, and the trait *is* a spandrel. A scientific EP must be willing to declare "this is not an adaptation."

  **Cost 3: Dependence on Auxiliary Sciences.**
  EP is not autonomous. Its scientific status is parasitic on the progress of archaeology, paleoclimatology, and genetics. If our picture of the EEA is wrong, EP hypotheses become untestable. You are committing to the view that EP is only as strong as its weakest auxiliary link. This makes EP more vulnerable than experimental psychology, but no more vulnerable than cosmology.

  **Cost 4: Revising Premise (1) Slightly (Lakatosian Shift).**
  While you want to keep (1), strict asymmetry often applies to *research programs* rather than single hypotheses (Lakatos). A single anomaly can be absorbed (as your student noted). A hypothesis is only "disconfirmed" when a *rival* program explains the anomaly better without ad hocery.
  *   *Cost:* You move from Popperian falsification to Lakatosian research programs. This is standard in philosophy of science, but it requires you to explain that "scientific" doesn't mean "proven true" or "immediately falsifiable," but rather "progressive problem shift."

  ### Summary for the Seminar

  To answer your student cleanly:

  1.  **Accept (1) and (2).**
  2.  **Reject (3).** The method *does* forbid certain moves. It forbids auxiliary assumptions that are not independently testable.
  3.  **Reject (4).** Observations *do* count against hypotheses when the cost of the auxiliary assumptions required to save them exceeds the cost of abandoning the hypothesis.
  4.  **Concede the Boundary.** Admit that EP slides into unscientific "just-so" storytelling precisely when it violates the constraint on (3). The demarcation line is not between EP and other sciences, but between *constrained* and *unconstrained* historical inference.

  This preserves the scientific status of rigorous EP, validates your intuition that the argument proves too much (by applying the same constraint to geology), and maintains your commitment to falsifiability (by defining falsification as the exhaustion of non-ad-hoc auxiliary saves).
