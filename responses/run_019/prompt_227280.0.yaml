  *(Self-Correction on the "Not Law" point)*: I need to be careful. Fuller doesn't say *any* failure makes it not law. He says *total* failure. In SE, total failure makes it "abandonware" or "broken." Is that the same? Not quite. "Broken software" is still software. "Not law" means it creates no obligation. This is the crux. I need to highlight the *obligation* aspect.

