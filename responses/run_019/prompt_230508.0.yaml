      *   **Premise (1):** "Reason" implies motivational/justificatory power for an agent (Psychologism/Internalism leanings).
      *   **Premise (2):** To motivate/justify, a fact must be cognitively accessible (Availability).
      *   **Premise (3):** Inaccessible facts can't motivate/justify anyone.
      *   **Premise (4):** Inaccessible facts aren't reasons (from 1 & 3).
      *   **Conclusion (5):** No reasons exist without an actual mind grasping them (Actualism about reasons).
      *   **Counter-Example (6):** 18th-century surgeons had a reason to wash hands (germs existed), even though no one could know this (Germ Theory case).
      *   **Dilemma (7):** Either accept "unattached reasons" (reject 5), reject the intuition in (6), or find a flaw in the chain (1)-(5).
