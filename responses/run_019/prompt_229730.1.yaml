      *   *The "Cooperate" Program:* Usually something like `if opponent == me then Cooperate else Defect`. (This is the "CliqueBot" or "FairBot" precursor logic).
      *   *Halting Problem:* A major technical hurdle. If $P_1$ simulates $P_2$ and $P_2$ simulates $P_1$, you get infinite recursion. Tennenholtz handles this via specific constructions or assumptions about provability (later refined by Fortnow, Halpern, Pass, etc., into "Robust Program Equilibrium" or using modal logic like in "Prisoner's Dilemma in the Limit" by Barasz et al.).
      *   *Claim 3 ("Cheating impossible"):* This is the weakest link. Defection is still possible. It's just not an *equilibrium* strategy under specific conditions. You can still submit a DefectBot.
