answer: |-
  ### Brainstorming: Pressures on the View

  *   **The Intuition Pump:** Everyone agrees saving five is better than saving one. If contractualism says otherwise, it's dead on arrival in public policy.
  *   **The Theoretical Core:** But if we aggregate complaints to get that result, aren't we just doing utilitarianism? What happened to the "individual veto"?
  *   **The Threshold Problem:** If a million people have a headache, can they outvote one person's loss of a leg? If yes, where is the cutoff? If no, how do we justify public health measures (masks, taxes) that impose small costs on many to save a few?
  *   **The Time Slice:** Do we judge principles based on who actually dies (ex post) or who faced the risk (ex ante)? A lottery saves one life but treats everyone equally beforehand.
  *   **The Identity Trap:** We can't treat "the five" as a single entity with a super-complaint. They are five distinct people. The theory must respect that ontology.
  *   **The Collapse Fear:** If the output matches consequentialism in every hard case, why keep the contractualist machinery? It needs to do distinct justificatory work.

  ***

  ### Desiderata for an Adequate Contractualist Treatment of Aggregation

  **1. The Greater Number Constraint**
  *   **Requirement:** The view must justify a principle that requires saving the greater number when individual stakes are identical and non-aggregable in the traditional sense (e.g., life vs. life).
  *   **Motivating Case:** *The Burning Building.* You can save one person in Room A or five people in Room B. All will die otherwise. All have an equal complaint about dying. A view that permits flipping a coin (or requires saving the one) fails basic moral plausibility. The principle chosen must not be reasonably rejectable by the five, which implies their numbers must count somehow without simply summing utility.

  **2. The Trivial Burden Threshold**
  *   **Requirement:** The view must explain how a large number of trivial burdens can collectively outweigh a severe burden on a single individual, but only up to a point. It must avoid both "tyranny of the majority" (any sum of trivialities wins) and "tyranny of the individual" (no sum of trivialities ever wins).
  *   **Motivating Case:** *Pollution vs. Livelihood.* A factory closure saves a million people from minor respiratory irritation but ruins one owner's life entirely. Conversely, a million people stealing $1 each ruins one victim. Contractualism must distinguish when the cumulative weight of small complaints becomes "reasonably rejectable" to the single sufferer without resorting to a simple hedonic calculus.

  **3. The Separateness of Persons Preservation**
  *   **Requirement:** The justification for saving the greater number cannot treat the group as a single container of value. The reasoning must remain anchored in individual relations and pairwise comparisons.
  *   **Motivating Case:** *The Transplant Surgeon.* You cannot kill one healthy person to harvest organs for five dying patients, even though 5 > 1. An adequate view must explain why the aggregation permitted in the *Burning Building* is forbidden here. It must show that the five patients' complaints do not "combine" to override the healthy person's right not to be killed, distinguishing "saving from loss" vs. "imposing loss."

  **4. The Ex Ante Probability Accommodation**
  *   **Requirement:** The view must account for the moral significance of risk distribution before outcomes are realized. It must determine whether complaints are lodged based on actual harm suffered or risk imposed.
  *   **Motivating Case:** *The Vaccine Lottery.* One dose remains for a deadly virus. Five patients are infected. If you pick one, four die. If you lottery, everyone has a 20% chance. An ex post view sees four dead complainants; an ex ante view sees five people treated equally. The theory must specify which standpoint governs reasonable rejectability to avoid condemning all risk-imposing rescue efforts.

  **5. The Non-Collapse Condition**
  *   **Requirement:** The view must not yield the same verdicts as act-consequentialism in all cases via a different vocabulary. The *structure* of justification must remain distinct (reasonable rejectability vs. maximization), even if outcomes occasionally overlap.
  *   **Motivating Case:** *The Demand on the Agent.* Consequentialism might require you to ruin your life to save many strangers. Contractualism should allow the agent to reject principles that demand excessive self-sacrifice. If the aggregation rule forces the agent to always maximize lives saved regardless of personal cost, the theory has collapsed into the rival framework it was meant to replace.

  ***

  ### Critical Analysis: Tensions and Prejudices

  **1. The Impossible Trinity**
  I suspect **Desiderata 1 (Greater Number), 3 (Separateness), and 5 (Non-Collapse)** cannot be jointly satisfied without significant theoretical cost.
  *   To satisfy **1**, you need to let the five's complaints outweigh the one's.
  *   To satisfy **3**, you cannot combine those complaints into a single weight.
  *   To satisfy **5**, you cannot simply define "combining" in a way that mimics summation.
  Most solutions (like Scanlon's "Relevant Grouping" or Voorhoeve's "Ex Ante Contractualism") sacrifice a bit of **3** to get **1**, or sacrifice **1** to keep **3** pure (accepting the counterintuitive result that saving one is permissible).

  **2. The Primary Eliminator**
  **Desideratum 2 (Trivial Burden Threshold)** eliminates the most live contenders.
  It is relatively easy to construct a view that saves the five in the *Burning Building* (by appealing to fairness or ex ante chances). It is exceedingly difficult to construct a view that explains why a million headaches outweigh a broken leg without invoking a metric of "total welfare" that violates the Separateness of Persons. Many contractualist accounts work for life-and-death but crumble when applied to public health policy (masks, taxes, speed limits) where small burdens are ubiquitous.

  **3. Requirements vs. Prejudices**
  *   **Genuine Requirement:** **Desideratum 3 (Separateness of Persons).** This is the ontological core of contractualism. If you lose this, you are no longer doing contractualist ethics; you are doing aggregative consequentialism with a different name.
  *   **Inherited Prejudice:** **Desideratum 1 (The Greater Number).** I must confess this is likely a concession to consequentialist intuition rather than a strict demand of contractualist logic. A pure contractualist could argue that the single person *does* have a veto, and saving the five is merely "supererogatory" or permissible but not required. Insisting that the theory *must* mandate saving the five is often a demand that contractualism solve a problem it wasn't built to solve (maximization) rather than the problem it was built to solve (justification to each individual).
  *   **Methodological Prejudice:** **Desideratum 5 (Non-Collapse).** While important for disciplinary identity, morally it matters less if the outcomes align. However, if the *reasoning* collapses, the theory loses its ability to protect minorities in cases where outcomes *don't* align (like the Transplant case). So it is a requirement for the theory's utility, if not its truth.
