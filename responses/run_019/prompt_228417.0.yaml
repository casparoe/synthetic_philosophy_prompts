prompt: |-
  I'm a journalist who covers science and ideas, and I'm working on a long piece about how institutions ration scarce resources: hospital triage protocols, vaccine allocation in a pandemic, and cost-benefit thresholds in public health. In my interviews, philosophers keep telling me that straightforward aggregation — saving the most lives, summing the most benefit — is morally crude, and that Scanlon's contractualism offers the serious alternative: an act is wrong if it would be ruled out by principles no one could reasonably reject, where each affected person's complaint is weighed individually rather than pooled. But when I ask how that framework handles the choice between saving one person and saving five strangers, I get a different answer from every interviewee. This, I gather, is the aggregation problem, and it's where the piece has to do its real work.

  Before I report anyone's preferred solution, I want the specification. Take on the role of a moral philosopher who specializes in contractualist ethics and who has thought carefully about the numbers problem. Begin by brainstorming briefly and informally — list the pressures on any view in this space before organizing anything — and then write the desiderata: what an adequate contractualist treatment of aggregation must deliver. For each requirement, give the case or consideration that motivates it. The list should at least cover: what the view must say about saving the greater number when individual complaints are equal in strength; how it must handle many trivial burdens spread across millions against one severe burden; whether it may take ex ante probabilities into account; what it must preserve of the separateness of persons; and why it must not simply collapse into sum-ranking consequentialism.

  Finally, tell me which desiderata you suspect cannot be jointly satisfied, which single requirement eliminates the most live contenders, and which items on your own list are genuine requirements versus the inherited prejudices of one camp in this dispute. A numbered list is fine; precision matters more than length.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Moral philosopher specializing in contractualist ethics (specifically Scanlonian) and the aggregation/numbers problem.
      *   **Task:**
          1.  Brainstorm briefly/informally (list pressures on any view in this space).
          2.  Write the *desiderata*: what an adequate contractualist treatment of aggregation must deliver.
          3.  For each desideratum, provide the motivating case/consideration.
          4.  Specific coverage required: Saving the greater number (equal complaints), many trivial burdens vs. one severe burden, ex ante probabilities, separateness of persons, avoiding collapse into consequentialism.
          5.  Final analysis: Which desiderata are in tension/impossible to jointly satisfy? Which requirement eliminates the most contenders? Distinguish genuine requirements from inherited prejudices.
      *   **Tone/Style:** Precise, philosophical, suitable for a journalist writing a long piece (informative, nuanced, not overly jargon-heavy but technically accurate). Numbered list is fine.

  2.  **Deconstruct the Philosophical Context (Scanlonian Contractualism & Aggregation):**
      *   *Core Idea:* An act is wrong if it violates principles no one could reasonably reject. Complaints are individual, not aggregated.
      *   *The Problem:* If I can save 1 person or 5 people (all else equal), contractualism seems to say I can't aggregate the 5 complaints to outweigh the 1. The single person on the other side can say, "If you save them, I die. My complaint is just as strong as any single one of the five." This leads to the counterintuitive result that saving 1 is permissible (or required) over saving 5.
      *   *Key Debates:* Frances Kamm (inviolability), John Taurek (numbers don't count), T.M. Scanlon (1998 vs. 2003 revisions), Alex Voorhoeve, Michael Otsuka, etc.
      *   *Tensions:* Individualism vs. Intuitive Outcomes (save the greater number), Non-aggregation vs. Trivial Burdens (taxation, pollution), Ex Ante vs. Ex Post.

  3.  **Drafting - Section 1: Informal Brainstorming (Pressures):**
      *   Need to capture the tug-of-war.
      *   Pressure 1: Intuition says save the 5.
      *   Pressure 2: Theory says respect the individual.
      *   Pressure 3: If we aggregate, we lose the "separateness of persons" (Rawls/Nozick worry).
      *   Pressure 4: If we don't aggregate, how do we handle climate change/pollution (million small harms vs. one big cost)?
      *   Pressure 5: Probabilities complicate things (ex ante vs. ex post complaints).
      *   Pressure 6: Avoiding consequentialism is the whole point, but don't become absurd.

  4.  **Drafting - Section 2: The Desiderata (The Core Task):**
      *   *Requirement 1: The Greater Number.* Must justify saving 5 over 1 when stakes are identical (life/death). *Case:* Lifeboat or Burning Building.
      *   *Requirement 2: The Trivial Burdens.* Must allow aggregating small harms to override a large burden in some contexts. *Case:* Pollution/Taxation vs. One Person's Ruin.
      *   *Requirement 3: Separateness of Persons.* Cannot treat a group as a super-person. Complaints must remain anchored to individuals. *Case:* No sacrificing one for the many just because the sum is higher *if* the one has a veto-worthy complaint.
      *   *Requirement 4: Non-Collapse.* Must not just be utilitarianism with extra steps. The *reasoning* must differ, not just the outcome. *Case:* The justification structure (reasonable rejectability vs. maximization).
      *   *Requirement 5: Ex Ante Probabilities.* Must handle risk fairly before outcomes are known. *Case:* Vaccine lottery vs. certain death.

  5.  **Drafting - Section 3: Critical Analysis (Tensions & Prejudices):**
      *   *Tension:* Req 1 (Save 5) and Req 3 (Separateness/Non-aggregation) are the classic conflict. If you can't aggregate complaints, the single person always has a veto against being sacrificed for the many.
      *   *Eliminator:* Requirement 2 (Trivial Burdens) is often the killer. Many "save the 5" solutions fail to explain why a million headaches outweigh one death, or vice versa.
      *   *Prejudices:* Is "Save the 5" actually a requirement of *contractualism* or just our consequentialist intuition bleeding in? Is "Non-collapse" a substantive requirement or just turf protection?

  6.  **Refining and Polishing:**
      *   *Voice Check:* Am I sounding like a specialist? Use terms like "complaint strength," "reasonable rejectability," "ex ante/ex post."
      *   *Clarity:* Ensure the distinction between *aggregating claims* (forbidden) and *comparing sets of claims* (allowed?) is clear, as this is the crux of the philosophical debate.
      *   *Specific Constraint Check:* Did I cover all the specific cases requested? (1 vs 5, trivial vs severe, probabilities, separateness, consequentialism collapse). Yes.
      *   *Formatting:* Use the requested structure (Brainstorm -> Desiderata -> Critical Analysis).

  7.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* Initially, I might say contractualism *forbids* aggregation. But Scanlon revised his view to allow "relevant groupings." I need to reflect that the *desideratum* is to find a principled way to count numbers without summing utility.
      *   *Nuance:* On the "Trivial Burdens" point, contractualism actually struggles here more than the 1 vs 5 case. Scanlon admits this is hard. I should highlight that tension.
      *   *Prejudice Check:* I need to be honest. Some philosophers think "Save the 5" is not a contractualist requirement but a concession to intuition. I should flag that.

  8.  **Final Review against Prompt:**
      *   Role assumed? Yes.
      *   Brainstorm first? Yes.
      *   Desiderata with cases? Yes.
      *   Specific topics covered? Yes.
      *   Final analysis on tensions/prejudices? Yes.
      *   Precision over length? Keep it tight.

  *(Self-Correction on the "Brainstorm" section)*: The prompt asks to "list the pressures on any view in this space before organizing anything." I should make this look like scratchpad notes or a quick dump of tensions before the polished list.

  *(Self-Correction on the "Prejudices" section)*: Be careful not to dismiss contractualism, but acknowledge internal debates. The "non-collapse" requirement is often a methodological constraint, not a moral one.

