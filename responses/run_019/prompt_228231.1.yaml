  The ranking from most to least socially constructed is money, creditworthiness, race, gender, mental disorder, species, planet, and quark. To apply the overnight test, I prioritize the constructedness of a kind's substance over its boundary conventions, meaning categories that exist only by agreement outrank those where only the limits are debated; additionally, I treat feedback loops as increasing constructedness, because if classification alters the classified, the kind depends on human interaction to sustain its specific form. Money tops the list as the paradigm of institutional substance, vanishing entirely without human agreement on value. Creditworthiness follows closely as a derivative metric within that institution, separated from money only by fundamentality since credit relies on the prior existence of a monetary system. Race ranks next because its biological substrate is clinal and negligible, separating it from gender which rests on the clearer, though still interpreted, biological dimorphism of sex. Gender places above mental disorder because gender roles are constitutive of identity through strong feedback loops, whereas the neurochemical substance of disorders persists even if the normative "disorder" label vanishes. Mental disorder exceeds species because diagnostic labeling alters patient outcomes and self-conception, whereas species membership relies on reproductive isolation mechanisms that operate independently of human observation. Species ranks above planet because biological lineage creates natural clusters without human intervention, whereas the planet category relies on a human-stipulated dynamical criterion like clearing an orbit. Planet outranks quark because orbital definitions are conventional cut-lines drawn around physical objects, whereas quarks exist as fundamental particles regardless of any taxonomy.
