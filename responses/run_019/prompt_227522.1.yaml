          *   *Verdict:* The ML framework treats the mind/world boundary as an architectural given (encoder/decoder). The philosophical debate is *about* where that boundary lies. The translation fails because the framework assumes the boundary (internal state vs. external latent), whereas the debate questions the nature of that boundary.

