answer: |-
  **MEMORANDUM**

  **TO:** Collections Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Promised Gift of Dutch School Portrait (PG.2017.04)

  **Purpose and Recommendation**

  The purpose of this memo is to break the current deadlock regarding the promised gift of the Dutch Golden Age portrait (PG.2017.04) and provide a framework for Thursday's vote. Following the recent technical analysis confirming the work is a nineteenth-century imitation rather than a seventeenth-century original, I recommend that the Committee **vote to accept the gift**, contingent upon the donor's written agreement to the revised attribution and a curatorial plan that explicitly frames the object as a nineteenth-century forgery.

  We should not decline the gift, nor should we accept it with ambiguous labeling. By accepting the work specifically as a "period forgery," we align the acquisition with our core mission as a university museum: to serve as a site of inquiry rather than merely a repository of treasures.

  **The Philosophical Disagreement**

  Per the Director's request, it is necessary to articulate the underlying philosophical conflict driving this stalemate. The disagreement is not merely about policy, but about the ontology of art.

  On one side, referencing Nelson Goodman, is the argument that the history of production constitutes the aesthetic identity of the work. In this view, a forgery is aesthetically distinct from an original even if they are visually indistinguishable, because the "correct" history of making is part of what we are looking at. On the other side is the argument from reception history: since the committee and public admired the work for six years under the assumption of authenticity, the aesthetic experience was functionally identical. Therefore, the distinction is art-historical rather than aesthetic.

  Put in plain terms: Does the value reside in the *object's biography* (its origin), or in the *viewer's experience* (its effect)? The "Decline" side prioritizes biography; the "Accept" side prioritizes experience and educational utility.

  **Engaging the Argument for Declining**

  The strongest argument against acceptance is the concern over institutional integrity. Colleagues arguing to decline the gift rightly note that accepting a known forgery risks "laundering" the object into respectability under our name. There is a valid fear that by accessioning this work, we reward the deception (even if unintentional on the donor's part) and blur the line between truth and fabrication in our permanent collection. If we are not vigilant, we risk appearing to value the prestige of a "Dutch painting" over the truth of its materiality.

  However, this risk is mitigated entirely by transparency. "Laundering" occurs when a museum hides or obscures the problematic history of an object. If we accept the gift *only* on the condition that the label reads "Nineteenth-Century Imitation after Rembrandt," and we build programming around the technical analysis that exposed it, we are doing the opposite of laundering. We are highlighting the fraud. We are not validating the object as a Dutch Golden Age work; we are validating it as a case study in the history of taste and technical connoisseurship. Declining the gift protects our reputation in the short term, but accepting it with full disclosure strengthens our reputation for intellectual honesty in the long term.

  **Implementation Plan and Timeline**

  To ensure this acquisition serves the educational mission and addresses the concerns of the committee, the following timeline should be adopted upon a favorable vote Thursday:

  *   **October 27 (Post-Vote):** Director notifies the donor of the Committee's decision to accept the gift *as re-attributed*. We must secure written confirmation that the donor understands and supports the new framing as a "period forgery." If the donor insists on the original attribution, the gift is declined.
  *   **November 15:** Curatorial team drafts new label copy and wall text. The text must explicitly mention the pigment analysis and infrared reflectography that identified the anachronisms. The object is removed from the "Dutch Golden Age" gallery rotation.
  *   **January 10:** The object is reinstalled in a dedicated case within the Northern European gallery or moved to the Study Room, accompanied by didactic materials explaining the science of authentication.
  *   **Spring Semester:** The Education Curator, in collaboration with the Chemistry and Art History departments, develops a seminar module centered on PG.2017.04. This fulfills the promise that the object will serve as a teaching tool for technical analysis and the sociology of value.

  **Conclusion**

  The object itself has not changed, but our knowledge of it has. To decline the gift is to pretend that this new knowledge disqualifies the object from our mission. To accept it as an original would be dishonest. To accept it as a forgery is to embrace the complexity of art history. I urge the committee to vote for acceptance with the revised framing, turning a potential embarrassment into a definitive teaching moment.
