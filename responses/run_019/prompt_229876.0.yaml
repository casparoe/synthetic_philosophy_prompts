          *   Row Player: T, M, B. Col Player: L, C, R.
          *   Row Payoffs:
              *   L: T=4, M=1, B=0
              *   C: T=2, M=1, B=2  (Make M dominated here too? 0.5(4)+0.5(0)=2. M=1. Yes.)
              *   R: T=0, M=1, B=4
              *   So M is dominated by 0.5T + 0.5B against all cols.
