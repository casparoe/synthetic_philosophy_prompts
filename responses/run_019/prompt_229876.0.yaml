                  *   vs T: C=0 < L=3.
                  *   vs B: C=0 < R=3.
                  *   So if Row never plays M, Col should never play C.
              *   This creates a chain: M is mixed-dominated -> Delete M -> C is purely dominated -> Delete C.

      *   **Logistics:**
          *   16 students. Split into 8 pairs? Or 2 teams of 8?
          *   Pairs are better for engagement. 8 Row players, 8 Col players.
          *   Stakes: $1 per point? Or candy. Let's say $0.10 per point to keep it cheap but real.
          *   Timeline:
              *   0-10: Intro & Stage 1.
              *   10-35: Stage 2 Round 1 (No randomization allowed yet).
              *   35-50: Stage 2 Round 2 (Randomization introduced).
              *   50-75: Debrief.

      *   **Refining the "Discovery":**
          *   If I just tell them "M is bad," it's lecturing.
          *   They need to play M, lose, then be offered a die.
          *   Rule: "Write down T, M, or B."
          *   After Round 1, show payoffs. M players earned less on average.
          *   Rule Change: "For Round 2, you may submit a probability distribution (roll a die)."
          *   They calculate. They see 50/50 T/B beats M.
          *   They stop playing M.
          *   Then Col players realize C is useless against T/B.

  4.  **Addressing Specific Prompt Requirements:**
      *   *Stakes:* Small real stakes (e.g., $5 endowment, pay based on points).
      *   *Dice/Cards:* Introduce in Stage 2.
      *   *Debrief:* Map to formal ideas (Mixed Dominance, Best Response, CKR).
      *   *Troubleshooting:* What goes wrong? (Collusion, risk aversion, calculation errors).
      *   *Limitations:* The game shows *that* it works, not the deep *why* of beliefs (facilitator must explain the "belief" aspect).

  5.  **Drafting the Content - Step-by-Step:**

      *   **Title:** "The Mixed Elimination Workshop."
      *   **Materials:** Payoff sheets, dice (or coins), record sheets, cash/envelopes.
      *   **Stage 1 Matrix:** Standard pure dominance.
      *   **Stage 2 Matrix:** The 3x3 constructed above.
      *   **Procedure:**
          1.  Pair up.
          2.  Round 1 (Pure only).
          3.  Analysis (M performed poorly).
          4.  Rule Change (Randomization allowed).
          5.  Round 2 (Mixed allowed).
          6.  Analysis (M abandoned, C abandoned).
      *   **Debrief:** Connect to theory.
      *   **Troubleshooting:** Risk aversion (M looks safe), arithmetic issues.
      *   **Limitations:** The game shows ex-post payoffs. Theory is about ex-ante expectations/beliefs. The facilitator must bridge this.

  6.  **Review against Constraints:**
      *   *75 minutes:* Tight. Need to keep instructions crisp.
      *   *16 undergrads:* 8 pairs is manageable.
      *   *One semester micro:* They know expected value.
      *   *Discovery:* The die introduction is the key "aha" moment.
      *   *IEDS focus:* Ensure the debrief emphasizes *deleting* M, not just finding an equilibrium.

  7.  **Final Polish:**
      *   Make sure the payoff numbers are integers for easy calculation.
      *   Ensure the "Mixed Dominance" is strict.
      *   Ensure the "Pure Dominance" in Stage 1 is obvious.
      *   Check the Col player incentives in Stage 2 to ensure C gets eliminated *after* M.
      *   *Self-Correction on Col Payoffs:* If Row eliminates M, Col faces a 2x3 game (T, B vs L, C, R).
          *   vs T: L=3, C=0, R=1. (L dominates C).
          *   vs B: L=1, C=0, R=3. (R dominates C).
          *   Wait, C is dominated by L against T, and by R against B. Is C dominated by a *pure* strategy in the reduced game? No. C is dominated by a *mixed* strategy of L and R in the reduced game too?
          *   If Row plays 50/50 T/B. Col Expected Payoff:
              *   L: 0.5(3) + 0.5(1) = 2.
              *   R: 0.5(1) + 0.5(3) = 2.
              *   C: 0.
              *   So C is dominated by L (if Row plays T) or R (if Row plays B). But if Row mixes, C is dominated by L or R (both give 2).
              *   Actually, to make it a clean IEDS lesson: Once M is gone, Col knows Row plays T or B.
              *   If Col thinks Row plays T, L is best. If B, R is best.
              *   Is C *strictly dominated* by a pure strategy in the reduced game?
              *   L vs C: 3>0 (vs T), 1>0 (vs B). Yes! L strictly dominates C in the reduced game (where M is removed).
              *   Wait, check B vs L payoff for Col. I set it to 1.
              *   So if M is gone:
                  *   Col L: 3 (vs T), 1 (vs B).
                  *   Col C: 0 (vs T), 0 (vs B).
                  *   L strictly dominates C.
              *   Perfect. This allows a second round of elimination (Pure) after the first round (Mixed). This reinforces the "Iterated" part of IEDS.

  8.  **Finalizing the Plan:**
      *   Write the matrices clearly.
      *   Script the facilitator's lines for the "Dice Reveal."
      *   Structure the debrief questions.
      *   Detail the "What Goes Wrong" section.

  9.  **Formatting:** Use bolding, lists, and clear headings for readability. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, if Col L dominates C *regardless* of whether Row plays T or B, why didn't Col delete C in Round 1?
  *   In Round 1, Row might play M.
  *   Payoff for Col vs M: L=1, C=1, R=1.
  *   So against M, L does not dominate C (1=1).
  *   Against T, L dominates C (3>0).
  *   Against B, L dominates C (1>0).
  *   So C is *not* dominated in the full game. It is only dominated *after* M is eliminated.
  *   This is perfect for IEDS.
  *   Wait, check strictness. 1=1 is weak dominance. The prompt asks for *strict* dominance usually, but IEDS works with weak if careful. Let's make it strict to be safe.
  *   Change Col payoff vs M: L=1, C=0.5, R=1. (Use integers? L=2, C=1, R=2).
  *   Okay, Col Payoffs vs M: L=2, C=1, R=2.
  *   Now L strictly dominates C against M (2>1).
  *   Wait, if L dominates C against M, T, and B... then C is dominated in the *first* round. That breaks the "Iterated" lesson.
  *   I need C to be *safe* against M, but *bad* against T/B.
  *   Col Payoffs vs M: L=1, C=3, R=1. (C is best response to M).
  *   Col Payoffs vs T: L=3, C=0, R=1.
  *   Col Payoffs vs B: L=1, C=0, R=3.
  *   Now:
      *   Full Game: C is not dominated (It's best against M).
      *   Reduced Game (M deleted): Row plays T or B.
      *   vs T: L(3) > C(0).
      *   vs B: L(1) > C(0).
      *   So in reduced game, L strictly dominates C.
