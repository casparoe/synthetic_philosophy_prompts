          *   The "Dice" element: To play the dominating strategy, students must be allowed to randomize. In Stage 1, they pick a row. In Stage 2, they realize picking M is suicide. But picking T or B is risky. They need to be *allowed* to roll a die to pick T or B.
          *   *Correction on Prompt:* "The rules should introduce dice or cards at the moment participants need them."
