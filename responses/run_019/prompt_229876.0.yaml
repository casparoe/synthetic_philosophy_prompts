prompt: |-
  For a seventy-five-minute workshop of roughly sixteen undergraduates who have taken one semester of microeconomics and can work with payoff matrices and pure-strategy dominance, design a staged classroom game that makes them feel why mixed strategies have to be admitted into iterated elimination of dominated strategies. The first stage should be a warm-up game in which the group successfully tidies a matrix by deleting strategies that are strictly dominated by other pure strategies. The second stage should confront them with a game where that method stalls: no strategy is strictly dominated by any single pure strategy, yet one strategy is strictly dominated by a mixture of other strategies, so iterated elimination should continue after all. The rules should introduce dice or cards at the moment participants need them, so the elimination is discovered in play rather than announced; use small real stakes and include the full payoff matrices, matching rules, and a timeline. The debrief should map what happened onto the formal ideas—that a strategy can be strictly dominated by a properly mixed strategy even when no pure strategy does the job, that in a two-player game a strategy is strictly dominated in this sense exactly when it is never a best response to any belief about the opponent, and that iterated elimination with mixed dominance is meant to capture what survives common knowledge of rationality. Finally, say what predictably goes wrong when the activity is run and how to handle it, and be explicit about which aspect of the idea the game cannot reproduce and the facilitator must supply.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16 undergraduates, 1 semester of microeconomics, know payoff matrices and pure-strategy dominance.
      *   **Duration:** 75 minutes.
      *   **Goal:** Make them *feel* why mixed strategies must be admitted into Iterated Elimination of Dominated Strategies (IEDS).
      *   **Structure:**
          *   Stage 1: Warm-up (Pure Strategy Dominance works).
          *   Stage 2: The Twist (Pure Strategy Dominance stalls, Mixed Strategy Dominance is needed).
          *   Mechanics: Introduce dice/cards *when needed* (discovery in play).
          *   Incentives: Small real stakes.
          *   Content: Full payoff matrices, matching rules, timeline.
          *   Debrief: Map experience to formal theory (Mixed Dominance, Best Response, Common Knowledge of Rationality).
          *   Troubleshooting: Predictable failures and fixes.
          *   Limitations: What the game *cannot* teach (facilitator must supply).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   Students usually think "Dominance" means "Row A is always better than Row B."
      *   They miss "Row A is always better than Row B *if I flip a coin between Row C and Row D*."
      *   The game needs to force them to realize that sticking to a single pure strategy makes them vulnerable, whereas randomizing protects them or yields higher expected payoffs against specific opponent behaviors.
      *   *Crucial Constraint:* The prompt asks for *Elimination of Dominated Strategies*, not just finding a Mixed Strategy Nash Equilibrium (MSNE). The goal is to show a strategy can be deleted because a *mixture* of other strategies beats it.
      *   *Mechanism:* How to make them "feel" this? If they play a strategy that is dominated by a mixture, they should lose money compared to if they had randomized. But since they are playing once or twice, variance is high.
      *   *Better Mechanism:* Have them play multiple rounds. Or, have them submit strategies, then reveal that a "robot" playing a mixture would have beaten their specific choice.
      *   *Refinement:* To make it about *elimination*, they need to realize a strategy is *bad* and stop playing it.
      *   *Stage 1:* Standard 3x3 or 4x4 where one row is clearly worse than another.
      *   *Stage 2:* A game where Row C is worse than 50% Row A + 50% Row B, but not worse than A alone or B alone.
      *   *The "Dice/Card" Constraint:* "Introduce dice or cards at the moment participants need them." This suggests the *players* should use randomization devices to implement the mixed strategy that dominates the pure one.

  3.  **Drafting the Game Design:**

      *   **Stage 1 (Warm-up):**
          *   Game: Simple 3x3.
          *   Payoffs: Row 3 is strictly dominated by Row 1.
          *   Outcome: Everyone deletes Row 3. Easy win.
          *   Time: 15 mins.

      *   **Stage 2 (The Core):**
          *   Game: Needs a specific structure. Let's use a 3x3 where the middle row (or bottom) is dominated by a mix of the top two.
          *   Classic Example: A game where $U$ and $D$ are good against different columns, but $M$ is mediocre against both. A mix of $U$ and $D$ beats $M$.
          *   Payoff Matrix Construction:
              *   Player 1 (Row): U, M, D.
              *   Player 2 (Col): L, C, R.
              *   Need $M$ to be dominated by $0.5U + 0.5D$.
              *   Let's try:
                  *   vs L: U=4, M=2, D=0. (Mix=2). M is not strictly dominated here (2=2). Need strict. Let's make Mix=2.1. So U=5, D=0? No.
                  *   Let's look for a standard example.
                  *   Row: T, M, B. Col: L, R. (Keep it simple 3x2 for the Row player's elimination focus).
                  *   Payoffs for Row:
                      *   L: T=4, M=2, B=0.
                      *   R: T=0, M=2, B=4.
                      *   Is M dominated? By 0.5T + 0.5B:
                          *   vs L: 0.5(4) + 0.5(0) = 2. (Equal to M). Need strict.
                          *   Let's adjust: T=5, B=5. Mix=5. M=2. Yes, M is dominated.
                          *   But wait, if T=5, B=5, then T and B dominate M purely? No, T is 0 vs R. B is 0 vs L.
                          *   Okay, Matrix:
                              *   L: T=4, M=1, B=0
                              *   R: T=0, M=1, B=4
                              *   Mix (0.5 T, 0.5 B): vs L = 2. vs R = 2.
                              *   M gives 1.
                              *   So M is strictly dominated by the mix. But M is not dominated by T (0<1 vs R) or B (0<1 vs L).
