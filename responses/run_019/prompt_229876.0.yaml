answer: |-
  # Workshop Plan: The Mixed Elimination Game
  **Duration:** 75 Minutes  
  **Participants:** 16 Undergraduates (8 Pairs)  
  **Prerequisites:** 1 Semester Microeconomics (Payoff Matrices, Pure-Strategy Dominance, Expected Value).  
  **Objective:** Demonstrate that a strategy can be strictly dominated by a *mixture* of other strategies even if no single pure strategy dominates it, necessitating Mixed-Strategy Iterated Elimination of Dominated Strategies (MS-IEDS).

  ---

  ## 1. Materials & Setup
  *   **Room:** One large table or desks arranged in 8 pairs.
  *   **Handouts:** 
      *   8 "Row Player" Record Sheets.
      *   8 "Column Player" Record Sheets.
      *   8 Copies of "Stage 1 Matrix."
      *   8 Copies of "Stage 2 Matrix."
  *   **Props:** 
      *   8 Six-sided dice (introduced only in Stage 2).
      *   Envelopes containing $10.00 in small bills/coins per student (or tokens redeemable for cash at the end).
  *   **Incentives:** Students keep their remaining endowment plus earnings. 
      *   **Exchange Rate:** 1 Payoff Point = $0.50.
      *   **Baseline:** Each student starts with $10.00. Losses are deducted from the $10.00 (to ensure negative payoffs are felt), or simply treat the $10 as a show-up fee and pay earnings on top. *Recommendation:* $10 show-up fee + earnings on top to avoid risk aversion regarding "losing their own money."

  ---

  ## 2. Timeline & Procedure

  ### 0:00 – 0:10 | Introduction & Stage 1 (Pure Dominance)
  **Goal:** Establish baseline rationality and the mechanics of elimination.

  1.  **Pairing:** Assign 8 students as **Row** and 8 as **Column**. Seat them in pairs.
  2.  **Endowment:** Hand out $10.00 show-up fees. Explain the exchange rate ($0.50/point).
  3.  **Stage 1 Matrix:** Distribute **Matrix A**.
      *   **Rules:** "You will play 3 rounds. Write down your choice (Row 1, 2, or 3 / Col 1, 2, or 3). Reveal simultaneously. Record payoffs."
      *   **Constraint:** "You must choose a single pure strategy each round."

  **Matrix A (Stage 1)**
  *Row Payoffs listed first, Column second*
  | | **Col 1** | **Col 2** | **Col 3** |
  | :--- | :---: | :---: | :---: |
  | **Row 1** | 4, 4 | 2, 1 | 4, 0 |
  | **Row 2** | 2, 2 | 1, 2 | 2, 1 |
  | **Row 3** | 0, 3 | 0, 0 | 1, 4 |

  *   **Dominance Structure:** 
      *   Row 1 strictly dominates Row 2 (4>2, 2>1, 4>2).
      *   Row 1 strictly dominates Row 3 (4>0, 2>0, 4>1).
      *   Col 1 strictly dominates Col 2 and Col 3 (once Row deletes 2 & 3).
  *   **Action:** Run 3 rounds. Most rational pairs will converge on (Row 1, Col 1).
  *   **Debrief (2 mins):** Ask, "Why did Row 2 and 3 disappear?" Elicit: "Strictly dominated by Row 1."

  ### 0:10 – 0:35 | Stage 2, Round 1 (The Stall)
  **Goal:** Create a situation where pure-strategy elimination fails, and playing the "safe" middle option is costly.

  1.  **New Matrix:** Distribute **Matrix B**.
  2.  **Rules:** "5 Rounds. Pure strategies only. No talking. Write and reveal."
  3.  **Observation:** Watch for Row players choosing **Middle (M)**. It offers a guaranteed '1' regardless of Column, whereas Top (T) and Bottom (B) risk '0'. Risk-averse students will flock to M.

  **Matrix B (Stage 2)**
  *Row Payoffs listed first, Column second*
  | | **Left (L)** | **Center (C)** | **Right (R)** |
  | :--- | :---: | :---: | :---: |
  | **Top (T)** | 4, 3 | 2, 0 | 0, 1 |
  | **Middle (M)**| 1, 1 | 1, 3 | 1, 1 |
  | **Bottom (B)**| 0, 1 | 2, 0 | 4, 3 |

  *   **Dominance Structure (Row):** 
      *   Is M dominated by T? No (1 > 0 against R).
      *   Is M dominated by B? No (1 > 0 against L).
      *   *Crucial:* M is **not** dominated by any pure strategy.
  *   **Dominance Structure (Col):**
      *   C is a Best Response to M (3 > 1).
      *   C is dominated by L if Row plays T (0 < 3).
      *   C is dominated by L if Row plays B (0 < 1).
  *   **Outcome:** Row players playing M get 1 point every time. Row players playing T or B get 0 or 4. Column players playing C get 3 when Row plays M, but 0 when Row plays T/B.
  *   **The Trap:** If Row plays M, Col plays C. Payoff (1, 3). 
  *   **The Missed Opportunity:** If Row mixes T/B, they average 2 points against any Col choice. 2 > 1.

  ### 0:35 – 0:45 | The Intervention (Dice & Discovery)
  **Goal:** Introduce mixed strategies as a tool for dominance, not just equilibrium.

  1.  **Stop Play.** Display the average earnings on the board.
      *   Highlight: "Row players who chose Middle earned $0.50/round. Those who chose Top/Bottom averaged higher *if* they varied, but many got zeros."
  2.  **Rule Change:** "For the next 5 rounds, Row Players are **allowed to randomize**. You may roll a die to determine your move."
      *   Hand out dice to Row players only.
      *   **Instruction:** "You do not have to use it. But you may."
  3.  **The Discovery:** 
      *   Students calculate Expected Value (EV).
      *   EV(M) = 1.
      *   EV(50% T, 50% B) vs L: $0.5(4) + 0.5(0) = 2$.
      *   EV(50% T, 50% B) vs C: $0.5(2) + 0.5(2) = 2$.
      *   EV(50% T, 50% B) vs R: $0.5(0) + 0.5(4) = 2$.
      *   **Realization:** The mixture yields 2 against *anything*. M yields 1. The mixture **strictly dominates** M.
  4.  **Action:** Run 5 rounds. Row players should abandon M. They will roll dice (e.g., 1-3 = T, 4-6 = B).

  ### 0:45 – 0:55 | Stage 2, Round 3 (The Iteration)
  **Goal:** Show that eliminating the mixed-dominated strategy enables further pure-strategy elimination.

  1.  **Observation:** Row players stop playing M.
  2.  **Consequence for Column:** 
      *   Column players notice Row never plays M.
      *   The game is now effectively 2x3 (T, B vs L, C, R).
      *   Against T: L(3) > C(0).
      *   Against B: L(1) > C(0).
      *   **Result:** **Center (C)** is now strictly dominated by **Left (L)** for the Column player.
  3.  **Action:** Column players abandon C. They play L (or R, depending on belief about T/B frequency).
  4.  **Final Rounds:** Play 3 more rounds. Converge toward (T/B mix, L/R mix).

  ### 0:55 – 1:15 | Formal Debrief
  **Goal:** Map the experience to theory.

  **Facilitator Script & Board Work:**

  1.  **Mixed Dominance:** 
      *   *Draw Matrix B.* "In Round 1, no pure strategy beat Middle. But did we find something that did?"
      *   *Formal Point:* A strategy $s_i$ is strictly dominated if there exists a probability distribution $\sigma_i$ over other strategies such that $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$.
      *   *Connection:* "The die wasn't just for confusion; it was a weapon. It created a strategy that didn't exist on the rows."

  2.  **Best Response & Beliefs:**
      *   "Why is Middle bad? It's never a Best Response."
      *   *Formal Point:* In two-player games, a strategy is strictly dominated (by pure or mixed) **if and only if** it is never a best response to any belief about the opponent.
      *   *Check:* "What belief would make M a best response?" (None. Even if Col plays C, T and B give 2, M gives 1).

  3.  **Iterated Elimination (CKR):**
      *   "Why did Column stop playing Center?"
      *   "Because Row stopped playing Middle."
      *   "Why did Row stop playing Middle?"
      *   "Because it was dominated by a mix."
      *   *Formal Point:* This chain is **Common Knowledge of Rationality**. I know you are rational (you won't play dominated M). You know I know that (so I won't play C).
      *   "If we didn't allow mixed strategies in our definition of rationality, we would have gotten stuck at Middle. We would have called M 'rational' because no *pure* strategy beat it. That is why the definition of IEDS must include mixed dominance."

  ---

  ## 3. Predictable Failures & Troubleshooting

  | Problem | Why it happens | Facilitator Fix |
  | :--- | :--- | :--- |
  | **Risk Aversion** | Row players stick to M because it guarantees 1 point. They fear the 0 from T/B. | **Intervention:** During the "Dice" phase, explicitly calculate the *Expected Value* on the board. Show that over 5 rounds, the Mix yields ~10 points, M yields 5. Emphasize the show-up fee protects them from ruin. |
  | **Collusion** | Pairs agree to play (M, C) every time to maximize joint payoff (1+3=4) vs competitive play. | **Rule:** "No communication." If suspected, separate the pairs or invalidate their earnings. Remind them this is a non-cooperative game. |
  | **Arithmetic Errors** | Students miscalculate the mixed expected value (e.g., think 50% of 4 is 1). | **Scaffold:** Provide a small "Expected Value Calculator" worksheet during the Dice phase. |
  | **Confusion on Iteration** | Column players don't realize they should delete C after Row deletes M. | **Prompt:** "Row players, raise your hand if you played Middle in the last round." (None). "Column players, if Row never plays Middle, look at your payoffs against Top and Bottom only. Is Center still useful?" |
  | **Time Overrun** | Calculations take too long. | **Cut:** Reduce Stage 2 to 3 rounds per phase instead of 5. The lesson holds with fewer data points if the debrief is strong. |

  ---

  ## 4. Limitations: What the Game Cannot Teach
  *Explicitly acknowledge these gaps during the debrief.*

  1.  **Ex-Post vs. Ex-Ante:** 
      *   *The Game:* Students see they lost money *after* playing M (ex-post).
      *   *The Theory:* Dominance is about *ex-ante* expectations. A mixed strategy can dominate even if, in a single realization, the pure strategy wins (e.g., you roll T, Col plays R, you get 0. If you had played M, you would have gotten 1).
      *   *Facilitator Note:* "You might get unlucky with the die and score 0. That doesn't mean the strategy was bad. Rationality is about the decision process before the dice roll, not the outcome after."

  2.  **Opponent Adaptation:**
      *   *The Game:* Column players adapt to Row's elimination of M.
      *   *The Theory:* IEDS assumes rationality is *common knowledge*, not learned through trial and error.
      *   *Facilitator Note:* "In the game, you learned M was bad because you lost points. In theory, you should know M is bad immediately because you know your opponent is rational and you know math. The game simulates the *result* of common knowledge, but you arrived there via experience."

  3.  **Continuous Probabilities:**
      *   *The Game:* Dice limit them to specific probabilities (e.g., 50/50 or 1/6 increments).
      *   *The Theory:* Mixed strategies allow any probability $p \in [0,1]$.
      *   *Facilitator Note:* "We used dice for simplicity. In theory, you can mix with any precision. The logic holds regardless of the granularity."

