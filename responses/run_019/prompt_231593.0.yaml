  I'm a retired physical chemist who got into political philosophy a couple years back, and I keep finding myself in arguments with an old labmate about the ethics of voting — in particular, whether there's a defensible case for "lesser evil" voting once you give up on the idea that your own vote is likely to be decisive. I want your actual credence on a precise claim, not a survey of positions.

