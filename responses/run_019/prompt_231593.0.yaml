answer: |-
  0.65.

  My credence decomposes into two independent probabilistic judgments: the instrumental expected value of the vote and the normative weight of expressive harm.

  First, the instrumental component. The claim requires that the expected utility of voting for A exceeds the cost of abstaining. This depends on $P(\text{decisive}) \times \Delta\text{Utility}(A, B) > \text{Cost}(\text{voting}) + \text{Cost}(\text{complicity})$. It is empirically settled among political scientists and statisticians (e.g., Gelman et al.) that $P(\text{decisive})$ in a large electorate is indeed below $10^{-6}$, often closer to $10^{-8}$. However, given your premise that B is "substantially worse," I assign a 0.9 probability that the $\Delta\text{Utility}$ is sufficiently large (e.g., preventing democratic backsliding or severe rights violations) to overcome the tiny probability and the trivial time cost of voting. This yields a high credence (0.9) that the *instrumental* reasons favor voting A.

  Second, the expressive component. This is where the claim is contested. You specify that the vote will be read as an endorsement of A's rejected platforms. The question is whether the moral disvalue of this perceived complicity outweighs the instrumental benefit calculated above. I assign a 0.7 probability that the expressive harm is *not* morally decisive. This relies on the view that expressive value is either instrumental (building norms) or agent-relative but overrideable by catastrophic consequences. If expressive integrity is a categorical constraint (a deontological veto), the credence drops to near zero. If it is a weighting factor, the massive stakes of "substantially worse" usually dominate.

  These combine roughly multiplicatively for the claim to hold: $0.9 \times 0.7 \approx 0.63$, rounded to 0.65 to account for model uncertainty.

  My number is most sensitive to the normative weight assigned to expressive complicity. If evidence emerged that expressive voting causally reinforces the rejected platforms of A (e.g., polling data shows voters interpret "lesser evil" votes as mandates for the whole platform, shifting A's future behavior negatively), my credence would drop sharply. Conversely, if it were shown that abstention is systematically interpreted as acquiescence to B rather than protest against A, my credence would rise.

  Regarding settled versus contested views: It is settled empirical fact that the probability of decisiveness is negligible. It is also settled that voting has expressive content (Brennan & Lomasky). What is profoundly contested is the moral ontology of that expression: whether it generates intrinsic disvalue (complicity) or merely instrumental effects (signaling). Most contemporary consequentialists treat expression as instrumental; many deontologists and virtue ethicists treat it as intrinsic.

  The gap between you (0.7) and your labmate (0.3) is almost certainly tracking the weight of the expressive/complicity sub-question. As a physical chemist turned philosopher, you are likely modeling this as an expected utility problem where the magnitude of the "substantially worse" outcome swamps the low probability and the expressive cost. Your labmate is likely treating the endorsement of rejected platforms as a integrity constraint that cannot be traded off against consequences, or they assign a much higher probability to the negative downstream effects of legitimizing A's bad platforms. You are disagreeing on whether morality is primarily about outcomes or agency.
