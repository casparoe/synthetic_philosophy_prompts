answer: |-
  A seventeenth-century surveyor stretches knotted ropes of lengths 3, 4, and 5 units to stake out a foundation corner, physically generating a triangle through controlled tension and placement. He correctly believes this construction produces a right angle, executing the measurement without error in length or alignment. However, he does not know the Pythagorean theorem nor understand why those lengths necessitate a right angle universally; he knows only that this procedure yields a square corner reliably based on tradition. He has caused the figure's existence via a prescribed motion but lacks knowledge of the necessary connection between the side lengths and the angle's rectitude.

  **Hobbes's Prediction:** Hobbes must attribute demonstrative knowledge to the surveyor because the criterion is met: the geometer (here, the surveyor) has constructed the object via a known cause (the specific lengths and motion), satisfying the condition that we know what we make.

  **Intuitive Verdict:** The surveyor has mere true belief or artisanal skill, not scientific knowledge (*scientia*), because he cannot demonstrate *why* the construction necessitates the property universally; he lacks the proof linking the generation to the essence.

  **Feature Doing the Work:** The gap is between knowing the *procedure of generation* and knowing the *necessary consequences* (universal truths) entailed by that generation. Generating an object gives you access to its origin, but not automatically to its essential properties unless you grasp the universal reasoning behind the origin.

  **If Removed:** If the surveyor also grasps the universal proof linking the ratio to the angle, the knowledge gap closes, confirming that generation alone was insufficient.

  **Hobbes's Defense:** A defender might argue the surveyor hasn't truly "generated" the geometrical object in the philosophical sense, only a physical approximation; for Hobbes, true generation requires conceiving the universal motion in the mind, not just manipulating ropes. By tightening "generation" to mean "mental conception of universal cause," he excludes the surveyor.

  **Civil Philosophy Parallel:** This threatens his political theory similarly: subjects "make" the commonwealth via covenant (generation), but most obey without understanding the necessary laws of sovereignty (consequences). If making the state granted knowledge of its properties, every citizen would be a political scientist; since they aren't, Hobbes must similarly distinguish between merely covenanting (physical generation) and understanding the logical necessity of absolute power (mental generation).
