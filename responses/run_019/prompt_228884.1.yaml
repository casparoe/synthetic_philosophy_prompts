      *   *Wait, Case 4:* AI Datacenter. This fails the "altruistic end" test.
      *   *Case 7:* Warning label. This fails because it doesn't stop the usurpation, just warns of it.
      *   *Case 6:* Child vs Philosopher. Child = Identity/Sovereignty (Existential). Philosopher = Professional Role (Testing ideas).

      *   *Let's refine the "Gap" idea the user rejected.* The user said "exploits the gap... permissible when it merely informs." The problem was the Child/Philosopher distinction.
      *   *New Angle:* **Contextual Sovereignty.**
      *   1. **Sovereign Sphere:** In matters of personal life-defining commitment (marriage, death), the AI must not overwhelm. (Cases 1, 6-Child).
      *   2. **Functional Sphere:** In matters of public resource allocation or professional inquiry, efficiency and truth can be optimized, even with rhetorical tuning. (Cases 3, 6-Philosopher).
