answer: |-
  # MEMORANDUM

  **TO:** Communications Review Team
  **FROM:** Head of Communications
  **SUBJECT:** Decision Procedure for Invocations of "The Will of the People"
  **DATE:** October 26, 2023

  ## 1. Purpose and Scope

  This document establishes the **Legitimacy Audit Procedure (LAP)**. Its purpose is to prevent the Commission, and advise Ministers against, making rhetorical overclaims regarding democratic mandates. We must distinguish between *procedural legitimacy* (the rules were followed) and *substantive legitimacy* (the outcome represents a unified moral will).

  This procedure is designed to be run in under 60 minutes. It prioritizes actionable red flags over philosophical nuance, though it retains critical distinctions found in democratic theory regarding populism and representation.

  ## 2. The Legitimacy Audit Procedure (LAP)

  Reviewers must ask the following five questions in order. A statement proceeds to the next step only if it passes the current one.

  ### Step 1: The Definition of "The People" (Empirical vs. Moralized)
  **Question:** Does the text define "the people" as the empirical electorate (all eligible voters/citizens) or as a subset defined by moral virtue, silence, or exclusion (e.g., "the real people," "the silent majority," "the people vs. the elites")?
  *   **Pass:** "The people" refers to the electorate, voters, or citizens generally.
  *   **Flag:** "The people" is contrasted with "elites," "establishment," or implies a "true" people distinct from the actual voters.
  *   **Stop Condition:** If **Flagged**, the statement requires rewriting to remove moralized exclusion. If this is a Ministerial statement, issue an Advisory Note on Populist Rhetoric.

  ### Step 2: The Quantification of Support (Majority vs. Plurality vs. Polls)
  **Question:** What is the numerical basis for the claim?
  *   **A:** >50% of *eligible* electorate.
  *   **B:** >50% of *actual* voters.
  *   **C:** Plurality (<50% of voters, but highest share).
  *   **D:** Opinion Polls / Focus Groups.
  *   **Pass:** Basis is **A** or **B**.
  *   **Flag:** Basis is **C**. (Requires qualification: "a plurality of voters," not "the majority").
  *   **Stop Condition:** If Basis is **D**, the statement **Fail**s for internal NEC use. For Ministers, **Flag** heavily: Polls measure sentiment, not will; they cannot sustain a mandate claim.

  ### Step 3: The Scope of Authorization (Governance vs. Policy)
  **Question:** Is the claim used to authorize general governance (forming a government) or a specific, high-stakes policy change (constitutional amendment, treaty withdrawal)?
  *   **Pass:** General governance following a standard election cycle.
  *   **Flag:** Specific policy mandate claimed from a general election (e.g., "We have a mandate to cut taxes" based on a general election where this was one of many pledges).
  *   **Stop Condition:** If **Flagged**, the text must be amended to "authorization to govern" rather than "mandate for [Specific Policy]," unless the election was a single-issue referendum.

  ### Step 4: The Temporality Claim (Provisional vs. Permanent)
  **Question:** Does the language suggest the decision is reversible through normal democratic channels, or does it present the outcome as final, irreversible, or "once and for all"?
  *   **Pass:** Language acknowledges future elections, reviews, or parliamentary sovereignty can alter the course.
  *   **Flag:** Language implies the issue is "settled," "closed," or "the final word" permanently.
  *   **Stop Condition:** If **Flagged**, the text must be amended. Democratic will is contingent, not permanent.

  ### Step 5: The Aggregation Claim (Unified Will vs. Aggregated Preference)
  **Question:** Does the text imply the outcome represents a unified, singular "will" (homogeneous), or an aggregated preference of diverse individuals (heterogeneous)?
  *   **Pass:** Acknowledges division, minority views, or uses "majority decision."
  *   **Flag:** Uses singular, monolithic phrasing ("The People Have Spoken," "The National Will").
  *   **Stop Condition:** If **Flagged**, soften to "The Majority Decision" or "The Result."

  ---

  ## 3. Limitations, Simplifications, and Irreducible Judgment

  To ensure this audit is runnable within an hour, the following theoretical distinctions from the literature on democratic legitimacy have been simplified or dropped. Reviewers must be aware of these blind spots.

  **1. Simplified: The "Intensity" of Preference**
  *   *Theory:* Democratic legitimacy sometimes accounts for how strongly minorities feel versus how weakly majorities feel.
  *   *Simplification:* The LAP treats all votes/preferences as equal units. We do not measure intensity.
  *   *Risk:* A 51% majority with weak preference over a 49% minority with intense preference may be procedurally valid but substantively unstable. The LAP will Pass this, though it may be politically volatile.

  **2. Dropped: The "Competence" Condition**
  *   *Theory:* Some theories argue "the will of the people" is only legitimate if the electorate is sufficiently informed.
  *   *Simplification:* We do not audit the *quality* of voter information. We assume procedural validity equals legitimacy.
  *   *Risk:* We may certify a statement as valid even if the underlying vote was based on demonstrable falsehoods. This is a procedural necessity, not a philosophical endorsement.

  **3. Irreducible Judgment: Contextual Crisis**
  *   *Theory:* In emergencies, executives claim broader mandates.
  *   *Judgment:* The LAP cannot algorithmically determine if a "crisis" justifies stronger rhetoric. Reviewers must use discretion. If a Minister argues "Extraordinary times require extraordinary claims," the Reviewer must escalate to the Head of Office.

  **4. Irreducible Judgment: "The People" as Metaphor**
  *   *Theory:* Sometimes "The People" is clearly poetic, not factual.
  *   *Judgment:* Distinguishing between poetic flourish and factual claim requires human context. If a phrase is clearly ceremonial (e.g., "Servant of the People"), skip Step 1.

  ---

  ## 4. Application of Procedure to Current Cases

  Below is the audit of the three identified statements.

  ### Case 1: The 52–48 Referendum
  **Statement:** "The referendum result is the final settlement of this issue. The will of the people has been decisively expressed and cannot be reopened."
  *   **Step 1 (Definition):** Pass. (Refers to voters).
  *   **Step 2 (Quantification):** Flag. (52% is a majority of voters, but narrow. "Decisively" overstates the margin).
  *   **Step 3 (Scope):** Pass. (Referendum is specific policy).
  *   **Step 4 (Temporality):** **FAIL/FLAG.** ("Final settlement," "Cannot be reopened"). This violates the principle of parliamentary sovereignty and the contingent nature of democratic will.
  *   **Step 5 (Aggregation):** **FLAG.** ("The will" singular).
  *   **Verdict:** **Do Not Issue (Internal) / Strong Advisory (Ministerial).**
  *   **Political Discomfort:** This finding is uncomfortable for *our* office. The NEC's standard certification language often reads: *"The Commission certifies this result as the decision of the people."* If we apply Step 4 and 5 rigorously, our own standard certification templates imply a permanence and unity that a 52–48 split does not support. We risk undermining the finality we are legally tasked to provide.
      *   *Recommendation:* We must revise our own certification language to read "The Majority Decision of Voters" rather than "The Will of the People" to maintain consistency with this audit.

  ### Case 2: The 37% Party Manifesto
  **Statement:** "With 37% of the vote, we have a clear mandate to implement Clause 4 of our manifesto: the abolition of the Upper House."
  *   **Step 1 (Definition):** Pass.
  *   **Step 2 (Quantification):** **FLAG.** (37% is a plurality, not a majority. 63% did not vote for this party).
  *   **Step 3 (Scope):** **FLAG.** (Claiming mandate for *specific* policy from a *general* election).
  *   **Step 4 (Temporality):** Pass.
  *   **Step 5 (Aggregation):** **FLAG.** ("Clear mandate" implies unity).
  *   **Verdict:** **Advisory Flag.** The Minister must be advised that they have a mandate to *govern*, not a mandate for *specific constitutional change* without further consensus building. Claiming a "clear mandate" from 37% for a specific structural change is a populist overclaim.

  ### Case 3: The Prime Minister's Polls
  **Statement:** "Recent polling shows 60% support for this measure. This proves what the people want, and we will proceed immediately."
  *   **Step 1 (Definition):** **FLAG.** (Conflates "polling respondents" with "the people"/electorate).
  *   **Step 2 (Quantification):** **FAIL (Internal) / FLAG (Ministerial).** (Polls are not votes. They measure sentiment, not authorized will).
  *   **Step 3 (Scope):** Flag. (Policy specific).
  *   **Step 4 (Temporality):** Pass.
  *   **Step 5 (Aggregation):** Flag. ("What the people want" implies singular will).
  *   **Verdict:** **Do Not Issue (Internal) / Strong Advisory (Ministerial).** Polls cannot sustain a claim of democratic legitimacy in an official capacity. This reduces democracy to continuous plebiscitary acclamation rather than periodic authorization.

  ## 5. Conclusion

  The LAP reveals that all three cases contain significant overclaims. Case 1 presents the greatest institutional risk: by flagging the "permanent settlement" language, we are implicitly critiquing the standard finality of our own electoral certifications.

  **Action:**
  1.  Adopt LAP for all internal NEC releases effective immediately.
  2.  Draft Advisory Note for Ministers regarding Case 2 and Case 3.
  3.  Convene Legal and Communications leads to revise NEC certification templates (Case 1) to ensure we do not claim more legitimacy than the procedure allows.

  **Signed,**
  Head of Communications
  National Electoral Commission
