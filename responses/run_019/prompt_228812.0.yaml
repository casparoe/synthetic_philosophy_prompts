      *   *Correction on Uncomfortable Result:* The prompt asks for *one* where it yields an answer the office will find politically uncomfortable. If the NEC usually certifies referendum results with language like "The decision of the people," this procedure might classify that as an overclaim. I need to make sure the analysis of Case 1 highlights this tension.

  9.  **Final Polish:** Check tone. Needs to be professional, precise, and authoritative yet humble about the limitations of the tool. (Proceed to generate output).

  *(Self-Correction on the "Uncomfortable" constraint)*: I need to ensure the uncomfortable result is explicit. If the NEC's job is to certify results, but the procedure says claiming a 52-48 result is "The Will of the People" is an overclaim, that creates tension between administrative finality and democratic nuance. I will highlight this in the Case 1 analysis.

  10. **Final Structure:**
      *   Introduction (Purpose).
