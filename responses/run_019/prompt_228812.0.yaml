prompt: |-
  I head the communications office of a national electoral commission, and part of my job is reviewing speeches, press releases, and official statements -- ours and, in an advisory capacity, ministers' -- for invocations of 'the will of the people' that overclaim what any democratic process can deliver: a 52–48 referendum presented as permanently settling an issue, a party with 37% of the vote claiming a mandate for a specific manifesto pledge, a prime minister citing polls as proof of what the people want. Write a decision procedure my reviewers can apply to any such statement: the questions to ask in order, what counts as passing each, and where the procedure stops with a flag rather than a verdict. The procedure should preserve, in usable form, the distinctions the literature on populism and democratic legitimacy actually turns on -- a majority of voters versus a majority of the electorate versus a plurality; a mandate to govern versus authorization for one policy; the people as an empirically aggregated electorate versus the moralized, unified 'people' of populist rhetoric -- and it should say explicitly which distinctions had to be simplified or dropped to keep the checklist runnable in under an hour, and where judgment cannot be eliminated. Then run the procedure on the three cases above, including one where it yields an answer my office will find politically uncomfortable.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Head of Communications, National Electoral Commission (NEC).
      *   **Task:** Create a decision procedure (checklist/flowchart) for reviewers to assess statements invoking "the will of the people."
      *   **Goal:** Identify overclaims regarding democratic legitimacy (e.g., treating narrow majorities as permanent, claiming mandates from pluralities, conflating polls with popular will).
      *   **Requirements:**
          *   Ordered questions.
          *   Pass/fail criteria for each step.
          *   "Flag" mechanism (where the procedure stops without a definitive verdict but signals risk).
          *   Preserve key academic distinctions (majority vs. plurality, mandate vs. authorization, empirical vs. moralized "people").
          *   Explicitly state simplifications/dropped distinctions for usability (under 1 hour).
          *   Acknowledge where judgment is irreducible.
          *   **Application:** Run the procedure on three specific cases (52-48 referendum, 37% party mandate, PM citing polls).
          *   **Constraint:** One result must be politically uncomfortable for the NEC.

  2.  **Deconstruct the Core Concepts (Democratic Theory/Populism Literature):**
      *   *The People:* Empirical (actual voters/citizens) vs. Moralized (the "real" people, often exclusionary or unified).
      *   *The Will:* Aggregated preferences (votes/polls) vs. Unified意志 (general will).
      *   *Legitimacy:* Procedural (rules followed) vs. Substantive (outcome matches "true" will).
      *   *Mandate:* Authority to govern (general) vs. Authority for specific policy (specific).
      *   *Thresholds:* Majority of votes, majority of electorate, plurality, supermajority.
      *   *Temporality:* Current decision vs. Permanent settlement.

  3.  **Drafting the Decision Procedure (The "Legitimacy Audit"):**
      *   *Structure:* Needs to be linear, logical, and actionable.
      *   *Step 1: Identify the Claim.* What exactly is being asserted?
      *   *Step 2: Define "The People".* Who is included? (Voters? Citizens? The "Real" People?)
      *   *Step 3: Quantify the Support.* What are the numbers? (Majority? Plurality?)
      *   *Step 4: Scope of Authority.* What is the claim authorizing? (Governance? Specific Policy? Permanent Change?)
      *   *Step 5: Temporality.* Is this presented as final/irreversible?
      *   *Flagging:* If the claim relies on a moralized definition of "the people" or ignores significant minorities, it flags.

      *Refining for Usability (Under 1 Hour):*
      *   Cannot require deep statistical analysis of every poll.
      *   Cannot require philosophical debate on "the general will."
      *   Must simplify the "Moralized People" distinction into concrete linguistic markers (e.g., "silent majority," "elites vs. people").
      *   Must simplify "Mandate" into "Policy Specificity."

  4.  **Developing the Simplifications & Limitations Section:**
      *   Need to admit what *can't* be captured in a checklist.
      *   Contextual nuance (crisis situations might justify stronger claims).
      *   The difference between "aspirational" rhetoric and "factual" claims.
      *   The philosophical depth of "popular sovereignty."

  5.  **Running the Procedure on the Three Cases:**
      *   *Case 1: 52-48 Referendum presented as permanent.*
          *   Likely fails the Temporality test.
          *   Likely fails the Threshold test (if treated as absolute).
          *   *Verdict:* High Risk/Flag.
      *   *Case 2: Party with 37% vote claiming mandate for specific pledge.*
          *   Fails Threshold (Plurality, not Majority).
          *   Fails Scope (Specific policy vs. General governance).
          *   *Verdict:* High Risk/Flag.
      *   *Case 3: PM citing polls as proof of what people want.*
          *   Fails Definition of People (Polls != Electorate).
          *   *Verdict:* High Risk/Flag.
      *   *Constraint Check:* One must be politically uncomfortable for the NEC.
          *   Usually, the NEC protects the integrity of elections.
          *   Case 1 (Referendum) is often the most sensitive. If the NEC itself administered the referendum, declaring the *interpretation* of the result as "overclaiming" might be seen as undermining the result itself.
          *   *Better angle:* The NEC is often seen as a neutral arbiter. If the procedure flags a statement made by the *Commission itself* (or implies the Commission's standard phrasing is problematic), that's uncomfortable.
          *   *Adjustment:* The prompt asks me to run it on the three cases *above*. The cases are: 1) Referendum (52-48), 2) Party (37%), 3) PM (Polls).
          *   Which is uncomfortable for the *NEC Communications Office*?
          *   If the NEC officially states "The result reflects the will of the people" after a 52-48 split, this procedure might flag *that* statement.
          *   *Decision:* I will frame the analysis of Case 1 to show that standard NEC language certifying the result often slips into the "permanent settlement" trap, which is uncomfortable because it questions the Commission's own standard post-referendum phrasing.

  6.  **Refining the Procedure Steps (Iterative Polish):**
      *   Make it sound bureaucratic but theoretically grounded.
      *   Use "Pass," "Fail," "Flag."
      *   Ensure the "Moralized People" distinction is clear (Empirical vs. Virtuous).

  7.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Pass/Flag criteria? Yes.
      *   Preserve distinctions? Yes (Majority/Plurality, Mandate/Policy, Empirical/Moralized).
      *   Simplifications stated? Yes.
      *   Judgment acknowledged? Yes.
      *   Run on 3 cases? Yes.
      *   Politically uncomfortable result? Yes (Case 1 implicates standard NEC certification language).

  8.  **Drafting the Content:** (Self-Correction during drafting)
