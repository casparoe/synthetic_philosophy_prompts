answer: |-
  This is one of the most persistent and well-discussed problems in the philosophy of action and law. The specific term you are looking for is **causation by omission**, but the mechanism you are describing regarding the selection of one omission over another is called **causal selection** (often analyzed through the lens of **normality** or **salience**).

  Here is an account of what is happening, followed by the confidence ratings you requested.

  ### The Account: Causal Structure vs. Causal Selection

  To understand why we treat the lifeguard and the tourist differently, we have to distinguish between the **causal structure** of the world and our **causal claims** about it.

  **1. The Metaphysical Baseline (Counterfactual Dependence)**
  Strictly speaking, in terms of physics and counterfactual logic, both the lifeguard and the tourist are causes of the death.
  *   *Counterfactual Test:* If the lifeguard had jumped in, the swimmer would likely live. If the tourist had jumped in, the swimmer would likely live.
  *   *Conclusion:* Both actions are necessary conditions for the survival that didn't happen. In a purely mechanical description of the universe, both absences are equally "causal."

  **2. The Pragmatic Filter (Causal Selection)**
  Human beings do not list *all* necessary conditions when asked for "the cause." If we did, the cause of the drowning would also include "the absence of a passing shark that could have eaten the swimmer" or "the absence of a sudden teleportation device." We select causes based on **abnormality** and **intervention potential**.
  *   **Norms define "Normal":** We have a model of how the world *should* go. A lifeguard saving a swimmer is "normal" (in the normative sense); a tourist doing so is "supererogatory" (above and beyond).
  *   **Deviation as Signal:** When we ask for a cause, we are usually asking: *What went wrong relative to the expected script?* The lifeguard's inaction is a deviation from the script; the tourist's inaction is consistent with the script.
  *   **Intervention:** We cite causes that we can manipulate to prevent future outcomes. We can change lifeguard behavior via rules/training; we generally cannot mandate tourist behavior.

  **3. The Doctor Case (Efficacy + Norms)**
  Your doctor example adds a second layer: **Probabilistic Efficacy**.
  *   *Standard Drug:* The counterfactual "If administered, patient lives" is strong. The omission is a robust cause.
  *   *Experimental Drug:* The counterfactual "If administered, patient lives" is weak. Even if the doctor *had* acted, the patient likely would have died anyway.
  *   *Verdict:* In the experimental case, the norm isn't the only thing shifting; the **counterfactual dependence** itself is weaker. However, if the drug *was* effective but experimental (and thus not "standard of care"), we still hesitate to call the omission a cause. This confirms that **normative expectation** (standard of care) is doing work independent of physical efficacy.

  ### Is the Norm Doing Causal Work or Blame Work?

  This is the crux of your puzzle. The most robust philosophical account (championed by philosophers like Christopher Hitchcock and Joseph Halpern) is that norms do **not** change the underlying metaphysical causation, but they **do** change the truth conditions of our causal *statements*.

  *   **Blame Work:** Norms certainly track responsibility. We blame the lifeguard because they violated a duty.
  *   **Causal Work:** However, it is not *just* blame. We use causal language to identify **levers for control**. By labeling the lifeguard's inaction as "the cause," we are identifying the specific variable in the system that is socially and legally tuned to prevent this outcome.

  Therefore, ordinary speech is not "sloppy." It is **functional**. It is designed to assign responsibility and guide future intervention, not to map the total physical history of the universe. To say the tourist "caused" the death would be metaphysically defensible but pragmatically misleading, because it implies the tourist was a lever we could have pulled.

  ### Should the Two Doctor Cases Differ Causally?

  *   **Metaphysically:** No. If the physical probability of survival was identical in both scenarios (e.g., the drug works 100% in both, but one is just "experimental" by label), the causal structure is identical.
  *   **Pragmatically/Legally:** Yes. The "standard of care" establishes the baseline for what counts as a relevant intervention. If the drug is experimental, the doctor's inaction is not a "deviation" from the medical script, so it is not selected as *the* cause of death in a legal or ordinary sense.

  ***

  ### Confidence Ratings

  Per your request, I am rating my confidence in the specific claims made above.

  **1. Claim: The technical terms for this puzzle are "Causation by Omission" and "Causal Selection."**
  *   **Confidence:** 99%
  *   **Reasoning:** These are standard, uncontroversial terms in philosophy of law and action theory (e.g., Hart & Honoré, *Causation in the Law*).

  **2. Claim: Metaphysically (counterfactually), the lifeguard and tourist are equivalent causes.**
  *   **Confidence:** 90%
  *   **Reasoning:** This holds true under standard Counterfactual Theories of causation (Lewis). The 10% uncertainty accounts for metaphysical theories that deny omissions are causes *at all* (the "skeptical view"), which would make them both *non*-causes rather than equal causes.

  **3. Claim: Ordinary speech is not "sloppy" but rather "functional/pragmatic."**
  *   **Confidence:** 80%
  *   **Reasoning:** This is the dominant view in pragmatics and experimental philosophy (e.g., Knobe, Sytsma). However, there is a significant minority of philosophers who argue that our causal intuitions reveal deep metaphysical truths, not just pragmatic ones. It is hard to prove definitively that language *isn't* sloppy, only that it is useful.

  **4. Claim: Norms affect causal *attribution* (selection), not causal *structure* (physics).**
  *   **Confidence:** 75%
  *   **Reasoning:** This is the "Pragmatic View." There is a competing "Normative View" (defended by some legal theorists) which argues that in social contexts, the duty *constitutes* the causation. In law, the duty is sometimes treated as ontologically part of the cause, not just a filter.

  **5. Claim: In the Doctor case, the difference is partly due to probabilistic efficacy, not just norms.**
  *   **Confidence:** 85%
  *   **Reasoning:** If a drug rarely works, the counterfactual "If given, patient survives" is false or low-probability. This is a mathematical difference in causal potency, distinct from the normative "standard of care" difference.

  ### The Claim I Am Least Sure Of

  **I am least sure of Claim #4 (Confidence 75%): That norms affect attribution only, not structure.**

  **Why:** There is a growing body of research in **experimental philosophy** (e.g., work by Joshua Knobe) suggesting that human beings do not merely *filter* causal judgments through norms; our cognitive machinery may actually *construct* the causal representation based on norms. In other words, it's not that the cause exists and we hide it; it's that the brain literally does not encode the tourist's inaction as a causal event in the first place. If human cognition is the metric for "reality" in social sciences, then the norm might be doing metaphysical work after all. Distinguishing between "how we think about cause" and "what cause is" becomes incredibly difficult in social contexts.
