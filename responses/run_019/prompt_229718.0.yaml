prompt: |-
  Anglo-American criminal law generally refuses to punish bystanders who fail to rescue: a stranger who watches a child drown in a shallow pond, doing nothing, commits no crime, while someone who pushes the child in commits murder. Yet the same legal system treats certain omissions as full causes of death -- a parent who refuses to feed an infant, or a nurse who disconnects a ventilator out of spite, is guilty of homicide, not merely of failing to prevent a death. Meanwhile the civil law of negligence routinely holds defendants liable for harms they failed to prevent when a duty of care existed. What theory of causation, or of moral responsibility, does this pattern of doctrines presuppose? Reconstruct the implicit view: does the practice assume that omissions are not really causes (with the special-duty cases as pragmatic exceptions), or that omissions cause but normally do not ground responsibility, or something else, such as a view on which causation itself is duty-relative? Say whether the three parts of the practice -- no bystander liability, homicide by omission under special duties, negligence liability for failures to act -- presuppose consistent commitments or pull in different directions, and what would have to change in the doctrine if we instead adopted either a purely moralized view (an omission is a cause whenever a reasonable person would have acted) or a purely metaphysical one (omissions are never causes, full stop).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** Anglo-American criminal law distinguishes sharply between acts (pushing a child) and omissions (watching a child drown), generally punishing the former but not the latter *unless* a special duty exists (parent, nurse). Civil negligence, however, often imposes liability for omissions when a duty of care exists.
      *   **The Question:** What theory of causation or moral responsibility does this pattern presuppose?
      *   **Specific Tasks:**
          1.  Reconstruct the implicit view (Are omissions not causes? Do they cause but not ground responsibility? Is causation duty-relative?).
          2.  Evaluate consistency: Do the three parts (no bystander liability, homicide by omission, negligence liability) presuppose consistent commitments or pull in different directions?
          3.  Hypothetical Analysis: What would change if we adopted a *purely moralized view* (omission = cause if reasonable person would act) vs. a *purely metaphysical view* (omissions are never causes)?

  2.  **Analyze the Legal Landscape (The "Data"):**

      *   *General Rule:* No duty to rescue strangers (no liability for watching a child drown).
      *   *Exception 1 (Criminal):* Duty based on status/relationship (parent/child, nurse/patient). Omission = Homicide.
      *   *Exception 2 (Civil/Tort):* Duty of care (negligence). Omission = Liability if duty exists.
      *   *Act vs. Omission Distinction:* Pushing (act) is murder; Watching (omission) is nothing (usually).

  3.  **Reconstruct the Implicit Theory (Task 1):**

      *   *Option A: Omissions are not causes.* If omissions aren't causes, how can a parent be guilty of homicide? The law treats them *as if* they are causes, but only when a duty exists. This suggests a "normative" or "legal" causation rather than a purely physical one.
      *   *Option B: Omissions cause but don't ground responsibility.* This fits the bystander case. The bystander *could* have saved the child (causal power), but isn't responsible. But in the parent case, they *are* responsible. So responsibility tracks duty, not just causal power.
      *   *Option C: Causation is duty-relative.* This seems the strongest fit for the *criminal* law. The law doesn't ask "Did the failure to act physically cause the death?" (Metaphysics). It asks "Did the defendant violate a specific legal duty to act, thereby resulting in death?"
      *   *Synthesis:* The prevailing view is often called the "Duty-Based" or "Normative" theory of omission liability. It separates *factual causation* (but-for test) from *legal imputation*. The implicit view is: Omissions are factually causal (in a but-for sense) but legally inert *unless* a pre-existing duty transforms the omission into a breach of obligation equivalent to an act.
      *   *Refinement:* It's not necessarily that causation *itself* is duty-relative, but rather that *liability* for omissions is duty-relative. However, some legal theorists argue that in omission cases, the "causation" element is satisfied *by* the breach of duty. Let's stick to the clearer distinction: Factual causation exists, but legal responsibility requires a duty.

  4.  **Evaluate Consistency (Task 2):**

      *   *Criminal Law (No Bystander vs. Parent):* Consistent. Both rely on the principle that criminal liability requires a specific duty. The state punishes breaches of specific obligations, not general moral failings.
      *   *Civil Law (Negligence):* Here's the tension. Tort law imposes duties of care more broadly (e.g., if you start a rescue, you must finish it; or in certain professional contexts). However, tort law *also* generally follows the no-duty-to-rescue rule for strangers. So, actually, Tort and Criminal law are quite aligned on the "no bystander liability" rule.
      *   *The Tension:* The prompt suggests civil negligence "routinely holds defendants liable for harms they failed to prevent when a duty of care existed." This is true. The tension arises if we ask *why* the duty exists in one case and not the other.
      *   *Verdict:* The doctrines are largely consistent in structure (Duty + Breach + Causation = Liability). They pull in different directions only regarding the *source* and *scope* of the duty. Criminal law is restrictive (status/contract); Tort law is slightly more expansive (foreseeability/voluntary assumption). But the underlying logic (Omission + Duty = Liability) is consistent.
      *   *Wait, is there a deeper inconsistency?* The prompt asks if they presuppose consistent commitments.
          *   Commitment 1: Liberty/Autonomy (I am not my brother's keeper).
          *   Commitment 2: Protection of Vulnerables (Parents must feed kids).
          *   Commitment 3: Compensation/Corrective Justice (Torts).
          *   Are these consistent? Yes, they balance individual liberty with specific relational obligations.
      *   *Critique:* Some argue the distinction is arbitrary. Why is a parent liable for homicide but a lifeguard (who might be a stranger contractually) liable for negligence? The *degree* of liability differs. This suggests the "causation" in criminal omission is treated more seriously than in torts.
      *   *Conclusion on Consistency:* They are structurally consistent (Duty is the gateway) but potentially tension-filled regarding the *moral weight* of the duty.

  5.  **Hypothetical Analysis (Task 3):**

      *   *Scenario A: Purely Moralized View (Omission = Cause if Reasonable Person Would Act).*
          *   *Change:* General duty to rescue. The bystander at the pond becomes a murderer (or at least criminally negligent).
          *   *Impact:* Massive expansion of criminal law. Blurs line between bad Samaritan and killer. Liberty is severely curtailed. "Bad Samaritan" laws (like in France/Vermont) would be the baseline for homicide.
          *   *Causation:* Causation becomes normative. "You caused it because you should have stopped it."
      *   *Scenario B: Purely Metaphysical View (Omissions are Never Causes).*
          *   *Change:* Parents cannot be guilty of homicide for starving infants. They might be guilty of a specific statutory offense ("failure to provide"), but not murder/manslaughter.
          *   *Impact:* Criminal law loses the ability to punish "killing by neglect" as killing. It would require creating specific non-homicide offenses for all omission scenarios.
          *   *Torts:* Tort law would collapse regarding omissions. You can't be liable for negligence if your inaction didn't "cause" the harm. You'd need a strict liability regime based on status, not causation.
          *   *Logic:* This view struggles to explain why we intuitively feel the parent *did* kill the child.

  6.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the puzzle (Act/Omission distinction). State the thesis: The law presupposes a **normative/duty-based theory of imputation**, not a purely metaphysical theory of causation.
      *   *Section 1: Reconstructing the Implicit View.*
          *   Reject "Omissions are not causes" (because parents are liable).
          *   Reject "Omissions cause but no responsibility" (because parents are liable).
          *   Accept "Responsibility is duty-relative." The law treats factual causation (but-for) as necessary but insufficient. The *legal* cause is the breach of a specific duty.
          *   Term: "Normative Causation" or "Imputation."
      *   *Section 2: Consistency of the Three Doctrines.*
          *   No Bystander Liability (Liberty principle).
          *   Homicide by Omission (Special Duty principle).
          *   Negligence (Duty of Care principle).
          *   Are they consistent? Yes, structurally. All require a duty. The difference is the *source* of the duty (status vs. contract vs. general care).
          *   Tension: The line between criminal and civil duty can be blurry (e.g., doctors). But the *logic* holds.
      *   *Section 3: Alternative Theories.*
          *   *Purely Moralized:* General duty to rescue. Bystander = Criminal. Expansion of state power. Erosion of liberty. Causation becomes "failure to optimize."
          *   *Purely Metaphysical:* Omissions never cause. Parents = Not murderers. Need new statutory crimes. Tort law breaks.
      *   *Conclusion:* The current hybrid system balances liberty and protection by making duty the gatekeeper of causal responsibility.

  7.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Nuance on Causation:* Be careful not to say the law *denies* factual causation in bystander cases. The bystander *could* have saved the child (factual cause). The law denies *legal* causation/responsibility.
      *   *Nuance on Tort vs. Criminal:* Tort law *also* generally has no duty to rescue strangers. The prompt says "civil law of negligence routinely holds defendants liable... when a duty of care existed." This is tautological. I need to clarify that Tort law creates duties of care more easily (foreseeability) than Criminal law (strict status), but both adhere to the "No Duty, No Liability for Omission" rule.
      *   *Moral Responsibility:* The prompt asks about moral responsibility too. The law assumes a "Minimalist Morality" (don't harm) vs. "Maximalist Morality" (help others). The law enforces the former generally, and the latter only in specific relationships.

  8.  **Final Polish:** Check against the prompt's specific questions.
      *   Reconstruct implicit view? Yes (Duty-based imputation).
      *   Consistent commitments or pull in different directions? Yes (Structurally consistent, philosophically balanced between liberty and welfare).
      *   What changes with Moralized view? (Good Samaritan laws become homicide).
      *   What changes with Metaphysical view? (Homicide by omission becomes impossible).

  9.  (Final check of the "Causation itself is duty-relative" option). Some legal philosophers (like Honoré) argue exactly this. I should mention that as a strong candidate for the implicit view. It's not that the physics change, but the *legal description* of the event changes based on the duty.

  10. *Structure:*
      *   Intro: The Act/Omission Distinction.
      *   The Implicit Theory: Normative Imputation (Duty as the bridge).
      *   Consistency Check: Structural unity, philosophical balance.
