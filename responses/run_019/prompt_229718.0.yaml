answer: |-
  The pattern of doctrines in Anglo-American law regarding omissions presupposes a **normative theory of imputation** rather than a purely metaphysical theory of causation. The law does not treat causation as a brute physical fact that exists independently of legal rules; rather, it treats legal causation for omissions as **duty-constituted**.

  Here is the reconstruction of the implicit view, an analysis of its internal consistency, and an exploration of how the doctrine would shift under alternative theoretical frameworks.

  ### 1. Reconstructing the Implicit View: Causation as Duty-Relative Imputation

  The legal practice rejects the idea that omissions are metaphysically distinct from acts in terms of physical reality (a parent's failure to feed and a bystander's failure to rescue both result in death via the same biological processes). It also rejects the idea that omissions are never causes. Instead, the system operates on a **two-step theory of liability**:

  1.  **Factual Causation (The "But-For" Test):** In all three scenarios (bystander, parent, nurse), the omission is factually causal. If the bystander had jumped, the child would live; if the parent had fed, the infant would live. The law acknowledges this counterfactual dependency.
  2.  **Legal Imputation (The Duty Gate):** Factual causation is insufficient for liability. Liability attaches only when a **pre-existing legal duty** transforms the omission into a breach of obligation equivalent to a wrongful act.

  Therefore, the implicit view is that **causation in the legal sense is duty-relative.** As the legal theorist Tony Honoré argued, we describe events differently based on normative expectations. When a parent fails to feed a child, the law describes the death as "caused by the parent" because the parent was the designated guarantor of the child's safety. When a bystander fails to rescue, the death is described as "caused by the water" or "misadventure," because the bystander was not a guarantor.

  **Moral Responsibility:** The moral theory underpinning this is a distinction between **negative duties** (do not harm) and **positive duties** (provide aid). The law enforces negative duties universally (no pushing) but enforces positive duties only selectively (only when a special relationship exists). It assumes that while we are all morally responsible for not harming, we are only legally responsible for aiding when we have voluntarily or status-wise assumed that burden.

  ### 2. Consistency of the Doctrines

  Do the three parts of the practice (no bystander liability, homicide by omission, negligence liability) presuppose consistent commitments, or do they pull in different directions?

  **They are structurally consistent but philosophically tensioned.**

  *   **Structural Consistency:** All three doctrines rely on the same formula: **Duty + Breach + Result = Liability.**
      *   *Bystander:* No Duty $\rightarrow$ No Liability.
      *   *Parent/Nurse:* Status/Contractual Duty $\rightarrow$ Criminal Liability.
      *   *Negligence:* Duty of Care (often broader than criminal duty) $\rightarrow$ Civil Liability.
      *   There is no contradiction in saying "Omissions are punishable only when a duty exists" across both criminal and civil law. Indeed, tort law also generally adheres to the "no duty to rescue strangers" rule, aligning it with criminal law.

  *   **Philosophical Tension:** The tension lies in the *source* and *severity* of the duty.
      *   *Criminal Law* restricts duties to status (parent) or contract (nurse) to protect individual liberty. It fears that a general duty to rescue would criminalize mere moral failings.
      *   *Tort Law* is more willing to find a "duty of care" based on foreseeability or voluntary assumption of action, yet it stops short of calling the omission a "killing."
      *   *The Pull:* The system pulls in different directions regarding the **moral weight of inaction**. By punishing a parent for homicide (murder/manslaughter) but a negligent driver for mere torts (or criminal negligence), the law implies that the *causation* in the parent's case is more direct or culpable. Yet metaphysically, the causal mechanism is identical. The system tries to have it both ways: it wants to punish the parent as a killer (moral intuition) without punishing the bystander as a killer (libertarian principle). This requires the "duty" to do heavy lifting, acting as a switch that turns a non-cause into a cause of death.

  ### 3. Alternative Theoretical Frameworks

  If we altered the underlying theory of causation/responsibility, the doctrines would undergo radical transformation.

  #### A. The Purely Moralized View
  *Theory:* An omission is a legal cause whenever a reasonable person would have acted to prevent the harm. Causation is defined by moral expectation.
  *   **Doctrinal Changes:**
      *   **End of the Bystander Rule:** The stranger at the pond would be guilty of homicide (or at least criminal negligence). The distinction between pushing and watching would vanish; both would be treated as bringing about the death.
      *   **Expansion of Criminal Law:** "Bad Samaritan" laws (currently rare and minor offenses in the U.S.) would become the basis for murder charges.
      *   **Erosion of Liberty:** The legal system would shift from protecting negative liberty (freedom from interference) to enforcing positive welfare. Every citizen would become their brother's keeper under threat of prison.
      *   **Causation:** "Cause" would become synonymous with "fault." If you were at fault for not acting, you caused the result.

  #### B. The Purely Metaphysical View
  *Theory:* Omissions are never causes, full stop. Nothingness cannot exert causal force. Only positive physical acts cause events.
  *   **Doctrinal Changes:**
      *   **Abolition of Homicide by Omission:** A parent who starves an infant could not be charged with murder or manslaughter, because they did not "cause" the death; the starvation (biological process) did.
      *   **New Statutory Regime:** To punish parents or nurses, the legislature would need to create specific, non-homicide offenses (e.g., "Statutory Failure to Provide") with lesser penalties. The moral gravity of "killing" would be legally inaccessible for omissions.
      *   **Collapse of Tort Negligence:** Negligence law relies on the idea that the defendant's failure caused the injury. If omissions cannot cause, plaintiffs could only sue for positive acts. Insurance models based on liability for failure to maintain safety would collapse.
      *   **Logical Absurdity:** This view leads to counter-intuitive results. If a nurse disconnects a ventilator (act), it is murder. If the nurse simply refuses to turn it on (omission), it is no crime. The law rejects this because the *result* and the *intent* are identical.

  ### Conclusion

  The Anglo-American legal pattern presupposes a **hybrid normative view**. It accepts that omissions are factually causal but insists they are legally inert without a duty. This allows the law to balance two competing values: **individual autonomy** (protecting the bystander from state coercion) and **vulnerable protection** (holding parents and professionals accountable).

  The three doctrines are consistent in their *logic* (Duty is the gateway to liability) but exist in tension regarding the *scope* of that duty. Adopting a purely metaphysical view would render the law incapable of punishing neglect as killing, while adopting a purely moralized view would transform the criminal law into a tool for enforcing general benevolence, fundamentally altering the liberal conception of the citizen-state relationship. The current doctrine accepts the philosophical cost of this "duty-relative causation" to maintain that balance.
