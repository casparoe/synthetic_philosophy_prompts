answer: |-
  The United States intellectual property scheme does not presuppose a single, unified metaphysical theory of "owning an idea." Instead, it presupposes a **functionalist pluralism**. It treats intellectual artifacts not as monolithic "property" in the natural-law sense, but as distinct legal constructs tailored to specific economic and social contexts.

  ### I. Reconstruction of the Implicit Theory

  **1. What is Strictly Presupposed**
  The scheme strictly presupposes that **abstract ideas are public commons**. No regime allows the ownership of a mental concept in the abstract. Ownership is contingent upon a specific *act* that transforms the idea into a legal object:
  *   **Copyright:** The act of *fixation* (writing it down).
  *   **Patent:** The act of *disclosure* (teaching the public how to make it).
  *   **Trade Secret:** the act of *concealment* (taking reasonable steps to hide it).

  Consequently, the law strictly presupposes that **access determines liability**. In copyright, you must have accessed the work to infringe (copying). In trade secret, you must have accessed the secret through improper means (breach). In patent, access is irrelevant because the disclosure is public; the right is against the world. The system presupposes that the *social cost* of exclusivity varies: it is low for expression (copyright), high for functional utility (patent), and variable for confidential business information (trade secret).

  **2. What Fits Well**
  The pattern fits best with a **rule-utilitarian or instrumentalist account**. The Constitution authorizes IP "to promote the Progress of Science and useful Arts." The tripartite structure fits the view that different industries require different incentive structures to maximize social welfare.
  *   *Copyright* fits the need to incentivize artists without monopolizing language or plot.
  *   *Patent* fits the need to incentivize expensive R&D while ensuring knowledge eventually enters the public domain.
  *   *Trade Secret* fits the need to protect investment where patenting is impossible or undesirable (e.g., formulas that are hard to detect).

  **3. What is Philosophically Underdetermined**
  The scheme is underdetermined regarding the **moral basis of the right**. It uses the language of "property" and "ownership," which suggests natural rights, but the boundaries are statutory and mutable. It does not resolve whether the creator *deserves* the right (Lockean) or whether the right is merely a necessary evil to prevent market failure (Utilitarian). The coexistence of regimes that contradict each other (e.g., independent creation is a defense in one, a liability in another) indicates the system is not committed to a coherent moral ontology of the "self" or "labor," but rather to a pragmatic balancing of competing interests.

  ### II. Evaluation of Philosophical Accounts

  **1. "Ideas are never owned"**
  The scheme **strictly commits** to the claim that abstract ideas are never owned. Ownership attaches only to the *embodiment* of the idea (expression, enabled invention, or confidential information). However, it does *not* commit to the view that only one type of embodiment counts; it allows the same underlying concept to be owned differently depending on how it is packaged (code vs. method vs. secret).

  **2. Labor-Desert Account (Lockean)**
  The scheme **fits poorly** with a pure labor-desert account.
  *   *Copyright:* Fits well. If you labor to create expression, you own it. If another labors independently, they own theirs.
  *   *Patent:* Clashes. If labor creates property, the second independent inventor has mixed their labor with the commons and should own their invention. The patent regime extinguishes their right based on priority, not labor.
  *   *Trade Secret:* Clashes. If a competitor labors to reverse-engineer a product they legally purchased, a labor-desert theory might argue they have earned a right to use the knowledge. The law denies this value to the secret-holder, prioritizing the flow of commerce over the secret-holder's labor value once the product is sold.

  **3. Personhood Account (Hegelian)**
  The scheme **fits partially**.
  *   *Copyright:* Fits well. Expression is viewed as an extension of the author's personality (hence moral rights in other jurisdictions, though weaker in the US).
  *   *Patent:* Fits poorly. A chemical process or a mechanical gear is rarely an "extension of the self." Treating functional utility as property is hard to justify via personhood.
  *   *Trade Secret:* Fits ambiguously. Secrecy protects a private sphere, but selling the product alienates the object.

  **4. Instrumental Account**
  The scheme **strictly presupposes** an instrumental account. The variations in defense (independent creation vs. independent invention) are explicable *only* by policy goals. We allow independent creation in copyright because monitoring all thought is impossible and stifling; we forbid it in patent because functional inventions are scarce and require massive capital investment that needs stronger protection to be recouped.

  ### III. The Concrete Test: Pure Labor-Desert

  If a **pure labor-desert account** (rights are earned strictly by the work of creation, regardless of social utility) were applied consistently:

  1.  **Copyright (Independent Creation):** **Retained.** Both authors labored. Both deserve the fruit of their labor. The current rule (both hold valid copyright) aligns with labor-desert.
  2.  **Patent (Independent Invention):** **Discarded.** The current rule (first-to-file excludes the second inventor) violates labor-desert. The second inventor mixed their labor with the commons and created the same value.
      *   *Replacement Rule:* Independent invention would become a complete defense. Alternatively, both inventors would hold co-equal rights to the patent, or the second inventor would be entitled to a compulsory license. The "right to exclude" would be limited to those who copied, not those who labored independently.
  3.  **Trade Secret (Reverse Engineering):** **Discarded (or Restricted).** Under pure labor-desert, the value of the formula stems from the creator's labor. The reverse engineer is appropriating the *value* created by the first laborer, even if they expend labor decoding it. The decoder is harvesting a crop they did not sow.
      *   *Replacement Rule:* Reverse engineering would likely be treated as misappropriation requiring compensation, or prohibited entirely if it appropriates the "substantial value" of the creator's labor. The labor of creation would trump the labor of analysis.

  ### IV. The Concrete Test: Pure Personhood

  If a **pure personhood account** (property is the embodiment of the will/self; violations are dignitary harms) were applied consistently:

  1.  **Copyright (Independent Creation):** **Retained.** One person's self-expression cannot violate another's self-expression if there is no causal link (copying). Both expressions are valid extensions of distinct selves.
  2.  **Patent (Independent Invention):** **Discarded.** Excluding an independent inventor suppresses *their* will and their embodiment of self in the invention. A functional invention may be less "personal" than a novel, but if it warrants property status, it must respect the personhood of all creators.
      *   *Replacement Rule:* Independent invention would be a defense. You cannot use your property right to negate another person's self-actualization through their own labor and will.
  3.  **Trade Secret (Reverse Engineering):** **Retained (with nuance).** In Hegelian theory, property is the *alienable* embodiment of will. By selling the soda bottle, the creator has alienated that object and the will embedded in it. The buyer's will now governs the object.
      *   *Replacement Rule:* Reverse engineering remains lawful because the object has been alienated. However, **misappropriation (theft)** would be viewed even more severely than in current law, not just as economic harm but as a violation of the private sphere of the self. The distinction would sharpen: theft is a dignitary violation; analyzing a purchased good is an exercise of the buyer's autonomy.

  ### Summary
  The US IP scheme is not a temple built on a single philosophical foundation. It is a toolshed containing different tools for different jobs. It **strictly presupposes** that ideas are public and rights are statutory privileges conditioned on specific acts (fixation, disclosure, secrecy). It is **underdetermined** on moral grounds, allowing it to shift between labor, personhood, and utility rhetoric as needed. However, if forced to choose a consistent moral theory, the scheme would fracture: a **Labor-Desert** consistency would destroy the patent system's exclusivity against independent inventors, while a **Personhood** consistency would weaken the control over alienated goods (trade secrets) while strengthening protections against theft. The current system survives precisely because it refuses to be consistent, prioritizing **Instrumental** outcomes over philosophical purity.
