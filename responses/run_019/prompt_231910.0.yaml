      *   **Trade Secret:** Protects secrecy itself. Defense: Independent discovery, Reverse Engineering. No defense: Misappropriation (theft/breach). *Implication:* Value lies in the competitive advantage of secrecy. No social contract of disclosure.

  3.  **Reconstructing the Implicit Theory (Task 1 & 2):**

      *   *What is being owned?* It's not "ideas" in the abstract. It's specific *relationships* between the creator, the artifact, and the public.
      *   *Strict Presuppositions:* The law presupposes that different *types* of mental labor serve different social functions. It presupposes that "ownership" is a bundle of rights tailored to policy goals, not a natural right inherent in the thought itself. It strictly presupposes that *access* matters (copyright needs access for infringement, trade secret needs breach of confidence, patent needs public filing).
      *   *Fits Well:* The scheme fits well with a pragmatic, pluralistic utilitarianism. It acknowledges that different industries need different incentives.
      *   *Underdetermined:* The law doesn't explicitly state *why* ideas aren't owned in copyright but are effectively owned in patent. It doesn't resolve the moral tension between rewarding labor (Locke) and promoting progress (Constitution).

