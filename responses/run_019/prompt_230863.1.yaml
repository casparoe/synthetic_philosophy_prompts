      *   *Underlying Logic:* Consequentialism (impact matters) + Empirical Claim (impact is negligible).

  3.  **Brainstorm Vulnerabilities/Counter-arguments:**
      *   *Expected Utility:* Even if probability is low, if the stakes are high enough, the expected value might still be positive (Parfit's non-identity problem nuances, voting math).
      *   *Expressive/Symbolic Value:* Actions signal values, build identity, influence others (social contagion).
      *   *Integrity/Virtue Ethics:* It's about who you are, not just the outcome (complicity).
      *   *Market Signals:* Individual choices aggregate to send price signals to producers (elasticity).
      *   *Precautionary Principle:* If we are wrong about inefficacy, the cost is high.
      *   *Universalizability (Kantian):* If everyone did it, disaster happens. Is it rational to make oneself an exception?
      *   *Structural/Individual Dichotomy:* Is it really either/or? Does personal action enable structural action (habit formation, credibility)?
      *   *Complicity:* Even if I don't *cause* the harm, am I *participating* in it?

  4.  **Categorize and Rank Vulnerabilities (Fatal vs. Costly):**

      *   *Fatal (Would force dropping the view):*
          *   Proof that individual actions *do* have measurable causal impact (e.g., marginal consumption triggers production).
          *   Proof that personal action is a *necessary precondition* for effective structural change (e.g., hypocrisy destroys credibility).
      *   *Costly/Awkward (Requires qualification):*
          *   Expressive value (influencing peers).
          *   Integrity/Complicity arguments (shifting from consequentialism to deontology/virtue).
          *   The "Safe Bet" problem (Pascal's Wager style).
      *   *Defender Concessions:*
          *   A careful defender admits individual impact is small *compared* to structural, but might concede it's not *zero*.
          *   They might concede the "universalizability" point has force but argue it doesn't apply to isolated agents in a non-ideal world.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of Sam's position (it's philosophically robust, often associated with "futility thesis"). Set the stage for the map.
      *   **Tier 1: The Fatal Flaws (Drop the View):**
          *   *Causal Thresholds:* The "triggering" case. If one burger *does* order one chicken (supply chain elasticity), the math breaks.
          *   *The Credibility Constraint:* If structural change requires personal sacrifice to be credible (e.g., Greta Thunberg flying less), then ignoring personal action undermines the structural goal.
      *   **Tier 2: The Costly Concessions (Qualify the View):**
          *   *Expressive/Social Influence:* My action influences *your* action. This creates a cascade. Sam has to admit individual action matters *instrumentally* for changing other individuals.
          *   *Complicity/Integrity:* Shifting from "did I cause harm?" to "am I tainted?" This moves the goalposts from consequentialism to virtue ethics. Sam has to argue against virtue ethics, which is harder.
          *   *Expected Value:* Low probability x Infinite/High Cost = Significant Expected Value.
      *   **Tier 3: The "What If Everybody Did That?" Objection:**
          *   Analyze this specifically as requested. It's not a logical fallacy if framed as a test of maxims (Kant) or risk assessment. It survives restatement but doesn't prove *causal* efficacy, rather *rational consistency*.
      *   **Tier 4: The "Too Safe" Critique:**
          *   If Sam patches every hole (e.g., "Okay, do it for signaling, but not morality"), does the view lose its bite? Yes, it becomes "Structural first, personal optional."
      *   **Ranking/Summary of Defeaters:** Create the requested ranking list.
