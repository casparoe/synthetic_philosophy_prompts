      *   *Best Pivot:* A commitment to **The Necessity of Shared Recognition**. Schlick argues meaning is found in the "present," but he also links meaning to love and community. If meaning requires *being witnessed* or *contributing to the social fabric*, the Hobbyist fails. If meaning requires *autonomy*, the Esports player fails.
