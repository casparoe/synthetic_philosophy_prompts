      *   Let's choose **Social Communicability**. Schlick writes about the "meaning of life" in a human context. Solitary meaning is suspect. This hurts the Hobbyist. It helps the Esports player (who performs for others). It leaves the Retiree ambiguous (consumes social content but doesn't contribute).
