      *   *Social Aspect:* Schlick was a Logical Positivist (Vienna Circle). He valued logic and science, but in this ethical essay, he leans towards a vitalist/aesthetic ethic. Does the play need to be *shared*? He mentions love and friendship often as sources of meaning.
      *   *Ambiguity:* Is "fun" enough? Or does it need to be "creative"? Is a contract enough to turn play into work?

