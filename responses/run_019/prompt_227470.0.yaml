  2.  **Deconstruct Schlick's Framework (Mental Sandbox):**
      *   *Core Distinction:* Work (Zweckarbeit) vs. Play (Spiel). Work is done for a future result; Play is done for the sake of the doing.
      *   *The "Meaning of Life":* Life has meaning if it is filled with acts that are their own reward.
