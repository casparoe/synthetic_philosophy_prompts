      To: Public Art Commission
      From: [Name]
      Re: Riverfront Memorial Vote

      I am writing to recommend that we **approve the artist's proposal with conditions**.

      We are tasked with stewarding memory, not just decorating space. The alternative to this piece is not silence; it is typically a plaque. Plaques allow us to acknowledge loss without feeling it. They let the city move on too quickly. The artist's insistence that distress is the function, not a bug, aligns with a rigorous aesthetic tradition where art demands witness rather than offering solace. To reject this solely because it causes discomfort is to misunderstand the role of memorials in civic healing. True commemoration requires an encounter with the reality of the loss, not a sanitized version of it.

      However, the opposition's concern is not merely about discomfort; it is about consent and care. This is the strongest objection we face. Public space is not a gallery. Visitors do not opt-in to a curated experience when walking the riverfront. There is a genuine risk that simulating the victims' final moments instrumentalizes their grief, turning tragedy into a spectacle for strangers. Furthermore, for the families who lost loved ones, this installation is not a philosophical exercise; it is a recurring wound. If we use public funds to create an environment that induces nausea or panic, we risk violating our duty of care to the community we serve. The argument that art should not weaponize real grief is morally weighty and cannot be dismissed as censorship.

      Therefore, approval must be contingent on mitigating these harms without diluting the work's integrity. We can preserve the artist's intent while respecting the public's right to choose their level of engagement.

      I propose three conditions. First, explicit content warnings must be posted at all approaches to the pavilion, detailing the audio and visual content so visitors can opt out before entering. Second, the audio reconstruction should not be ambient; it must be accessible via headphones or triggered by presence, ensuring the soundscape does not bleed into the general public realm where unintended audiences (including children) reside. Third, and most critically, a family liaison committee must be granted veto power over the specific audio reconstructions to ensure accuracy and respect, preventing the work from becoming sensationalist.

      This path allows us to honor the dead with honesty while protecting the living from unintended trauma. It acknowledges that public art exists in a shared space, requiring a balance between artistic vision and communal welfare. We can demand difficult engagement without forcing it.

