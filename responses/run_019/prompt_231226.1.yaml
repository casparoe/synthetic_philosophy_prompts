  6.  (Self-Correction during drafting): I need to make sure I don't imply that *all* GOTV is unregulated. There are reporting requirements. But the *act* of spending is legal.
      *   Also, distinguish between paying a *third party* (canvasser) vs. paying the *voter*. That's the legal bright line. Paying the canvasser to talk is fine. Paying the voter to listen/vote is not.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Settled vs. Contested" section is prominent. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful about the phrase "settled." In law, "settled" means precedent. In political theory, nothing is settled. I will clarify this distinction.

  *(Refining the "Coherence" argument)*: The coherence rests on the *Secret Ballot*. You can verify a signature. You cannot verify a vote. Therefore, paying for a signature is enforceable contract; paying for a vote is unenforceable and relies on trust/coercion. This is a strong point to include.

  *(Refining the "Rival Theories")*:
