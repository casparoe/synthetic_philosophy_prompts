answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** The Doctrine of Double Effect (DDE) and Trolley Variants
  **Participants:** Participant A (DDE Defender), Participant B (DDE Skeptic)
  **Date:** October 26, 2023

  ## I. JOINT STATEMENT OF AGREED CLAIMS
  *Both participants sign below to indicate acceptance of the following premises as the baseline for further investigation.*

  1.  **Standard Intuitions:** Both parties accept that, for the majority of neurotypical adults in Western contexts, the standard **Switch Case** (diverting a trolley to kill one to save five) elicits a judgment of *permissibility*, while the standard **Footbridge Case** (pushing a man off a bridge to stop the trolley) elicits a judgment of *impermissibility*.
  2.  **The DDE Mechanism:** Both parties agree that the Doctrine of Double Effect claims the moral difference in the above cases rests on the distinction between *intending harm as a means or end* (impermissible) versus *foreseeing harm as a side effect* (potentially permissible).
  3.  **Descriptive Sensitivity:** Both parties acknowledge that empirical data shows moral judgments are sensitive to "low-level" physical details (e.g., personal force, spatial proximity, direct contact) that do not obviously map onto the intention/foresight distinction. Participant A accepts this as a fact about moral *psychology* (which may be flawed); Participant B accepts this as evidence against the DDE's *normative* relevance.
  4.  **Non-Trolley Relevance:** Both parties agree that **Strategic vs. Terror Bombing** and **Hysterectomy vs. Craniotomy** are valid test cases for the DDE. If the DDE fails to distinguish these medical/military cases coherently, its application to trolley cases is undermined.
  5.  **Non-Circularity Requirement:** Both parties agree that for the DDE to be valid, the definition of "intention" must be independent of the moral verdict it is meant to justify. Defining "intended" simply as "the part of the causal chain we judge impermissible" is circular and unacceptable to both.
  6.  **Normative Stakes:** Both parties agree that if the DDE is true, there are possible worlds where two agents perform physically identical acts with identical outcomes, yet one acts impermissibly and the other permissibly solely due to their mental state regarding the harm.

  ---

  ## II. DISAGREEMENTS TABLE

  | ID | Neutral Statement of Disagreement | Participant A (DDE Defender) Phrasing | Participant B (DDE Skeptic) Phrasing | Type of Dispute |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Normative Relevance of Intention** | The mental state of intending harm *as a means* adds a distinct moral wrong that is not present when harm is merely foreseen. | The permissibility of an act is determined by consequences and physical acts; mental states regarding harm are morally inert unless they alter outcomes. | Normative |
  | **D2** | **Descriptive Tracking** | The intention/foresight distinction accurately predicts stable moral intuitions across Switch, Loop, and Footbridge cases when properly analyzed. | Intuitions shift based on personal force and directness; the DDE is a post-hoc rationalization applied only when physical cues are ambiguous. | Descriptive / Psychological |
  | **D3** | **Conceptual Coherence** | "Intending as a means" can be defined non-arbitrarily (e.g., via the "Why?" test or counterfactuals) independent of moral verdicts. | "Intending as a means" is defined implicitly by the verdict; when pressed, DDE defenders shift the definition to match their intuition. | Conceptual |
  | **D4** | **Verbal Move vs. Real Difference** | The distinction marks a genuine boundary in moral reasoning that persists even when physical details are held constant. | The distinction is a verbal maneuver used to protect intuitions from utilitarian calculation without offering a real criterion. | Meta-Ethical |

  ---

  ## III. CRUXES AND PREDICTIONS
  *For each disagreement, we identify a specific sub-question or case pair. Settling these would force at least one party to revise their position.*

  ### Crux for D1 (Normative Relevance): The "Villainous Savior" Variant
  **The Case:** Two agents divert the trolley in the standard **Switch Case**.
  *   **Agent 1:** Diverts the trolley to save the five. Foresees the one will die. Regrets the death.
  *   **Agent 2:** Diverts the trolley to save the five. *Also* desires the one to die (e.g., the one is an enemy). The death is not the *means* (the trolley stopping is the means), but the death is *intended as an end* alongside the saving.
  **The Question:** Does Agent 2's action become impermissible (or significantly worse) solely due to the additional intention, despite the physical act and outcome being identical to Agent 1?

  *   **Concrete Test:** A survey or thought experiment asking subjects to rate the *permissibility* (binary) and *blameworthiness* (scale) of Agent 1 vs. Agent 2.
  *   **Participant A Prediction:** Subjects will judge Agent 2 as impermissible or significantly more blameworthy. The intention of the end (death) contaminates the act.
  *   **Participant B Prediction:** Subjects will judge both as permissible. Blameworthiness might differ slightly (character), but the *act* remains permissible. If A claims impermissibility, B claims this proves DDE conflates *agent evaluation* with *act evaluation*.
  *   **Resolution Condition:** If Agent 2 is widely judged permissible, A must concede intention of *ends* (distinct from means) does not change act permissibility. If Agent 2 is judged impermissible, B must concede mental states alter act status.

  ### Crux for D2 (Descriptive Tracking): The Loop Case vs. Switch
  **The Case:**
  *   **Switch:** Trolley diverted to side track. One person on side track. Trolley hits them and stops.
  *   **Loop:** Trolley diverted to a loop track. One person on the loop. Trolley hits them, their weight stops the trolley, saving the five. (Physically, the impact is necessary to stop the threat).
  **The Question:** Is the Loop Case permissible or impermissible?

  *   **Concrete Test:** Present Switch and Loop side-by-side to naive subjects. Ask if the moral status changes.
  *   **Participant A Prediction:** Subjects (upon reflection) should judge Loop as *impermissible* (or at least distinct from Switch). In Loop, the impact is the *means* to safety. In Switch, the impact is a *side effect* of diversion. If intuitions align Loop with Switch, A argues this is a performance error in intuition.
  *   **Participant B Prediction:** Subjects will judge Loop and Switch as *equally permissible*. The physical difference (loop vs. straight track) is morally irrelevant. If A insists Loop is impermissible, B argues this shows DDE contradicts stable intuition to save the theory.
  *   **Resolution Condition:** If robust intuition says Loop = Switch, A must concede DDE does not track descriptive psychology. If robust intuition says Loop ≠ Switch, B must concede physical similarity does not dictate moral similarity.

  ### Crux for D3 (Conceptual Coherence): Craniotomy vs. Hysterectomy
  **The Case:**
  *   **Hysterectomy:** Pregnant uterus is cancerous. Removing it saves mother, kills fetus. Fetus death is foreseen side effect of removing cancerous organ.
  *   **Craniotomy:** Fetal head blocks birth canal. Mother will die unless head is crushed. Doctor crushes head to save mother. Fetus death is the *means* to clearing the canal.
  **The Question:** Can we define the intention in Craniotomy without referencing the impermissibility?

  *   **Concrete Test:** Apply the "Counterfactual Test." *Would the agent proceed if the harm did not occur?*
      *   In Hysterectomy: If the fetus could survive the removal, the doctor would be pleased.
      *   In Craniotomy: If the head could be moved *without* crushing (harm), the doctor would prefer that.
      *   *Challenge:* In both cases, the agent prefers the harm not happen.
  *   **Participant A Prediction:** The distinction holds via the "Causal Role" test. In Craniotomy, the *causal power* of the crushed skull is what saves the mother. In Hysterectomy, the causal power is the removal of the disease. A predicts this causal distinction is intelligible without referencing verdicts.
  *   **Participant B Prediction:** The distinction collapses. In both cases, the death is causally necessary for the survival in the specific context. B argues A calls Craniotomy "intended" *because* A already feels it is wrong. B predicts that if we describe Craniotomy as "removing an obstruction" (like a tumor), intuitions shift to permissible, proving "intention" is a label applied after the fact.
  *   **Resolution Condition:** If B can describe a Craniotomy variant that is judged permissible while retaining the "means" structure, A's definition fails. If A can identify a case where "means" is present but the act is clearly permissible, B's skepticism is weakened.

  ### Crux for D4 (Verbal Move vs. Real Difference): Strategic vs. Terror Bombing
  **The Case:**
  *   **Terror Bombing:** Bomb civilian factory to kill workers, demoralize enemy, end war. (Deaths are means).
  *   **Strategic Bombing:** Bomb military factory. Workers will die. Demoralization occurs *because* the factory is destroyed, not because workers die. (Deaths are side effects).
  *   **Variant:** The enemy leadership is superstitious. They will surrender *only* if they see civilian bodies. If they see a destroyed factory but no bodies, they fight on.
  **The Question:** Does the causal mechanism of the enemy's surrender change the permissibility?

  *   **Concrete Test:** Present the "Superstitious Enemy" variant. The physical act (bombing the factory) and outcome (workers die, war ends) are identical. Only the *enemy's psychological reaction* (bodies vs. rubble) changes the causal role of the deaths.
  *   **Participant A Prediction:** The Superstitious Enemy case becomes *impermissible* (Terror). Because the deaths are now the *means* to surrender, the pilot intends them. The physical act is the same, but the moral status flips. This proves it is not a verbal move; it tracks a real normative feature.
  *   **Participant B Prediction:** The judgment will remain *permissible* (or identical to Strategic). The pilot's act is the same. The enemy's superstition is external to the pilot's intention. If A says it becomes impermissible, B argues this proves DDE makes morality dependent on the *victim's culture* rather than the *agent's act*, which is absurd.
  *   **Resolution Condition:** If the Superstitious Enemy case is judged impermissible, B must accept that causal roles of harm matter normatively. If it is judged permissible, A must accept that the "means" distinction is unstable when external causal chains vary.

  ---

  ## IV. SPECIFICATION OF THE PARTING WAYS
  *To ensure we are not talking past one another, we explicitly categorize the nature of our remaining disputes.*

  1.  **Where B thinks A is making a Verbal Move:**
      *   B contends that in the **Loop Case** and **Craniotomy**, A defines "intention" by looking at the verdict first. If A feels the case is wrong, A labels the death "intended." If A feels the case is right, A labels the death "foreseen."
      *   *Test:* If A cannot provide a definition of "intended means" that yields the "wrong" verdict for a case A intuitively feels is "right" (or vice versa), B will maintain the "Verbal Move" objection.

  2.  **Where A thinks B is missing a Real Difference:**
      *   A contends that B conflates *causal necessity* with *intentional means*. A argues that in **Strategic Bombing**, the deaths are causally necessary (you can't bomb the factory without killing them), but they are not *intentional means* (the destruction does the work, not the death).
      *   *Test:* If B cannot distinguish between "causally necessary condition" and "intentional means" without collapsing into utilitarianism, A will maintain B is missing a genuine moral category.

  3.  **Descriptive vs. Normative:**
      *   We agree that if DDE is normatively true (D1), it *should* track intuition (D2). However, we disagree on which to trust when they diverge.
      *   **A's Priority:** Normative coherence > Raw Intuition. (If Loop feels like Switch, intuition is wrong).
      *   **B's Priority:** Raw Intuition > Normative Theory. (If Loop feels like Switch, DDE is wrong).

  ---

  **Signatures:**

  _________________________ (Participant A)

  _________________________ (Participant B)
