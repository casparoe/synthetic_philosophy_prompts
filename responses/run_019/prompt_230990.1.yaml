answer: |-
  | Defeater | What it hits | Decisiveness | What a committed superrationalist would do | Where it should move you |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Causal/Instrumental Gap**: Causal Decision Theory (CDT) argues that logical correlation without causal mechanism is irrelevant to *prescriptive* choice. My choice cannot *change* the other's output; it can only *reveal* it. Acting on mere evidence violates the principle that rational action requires causal leverage. | The step from correlation to what I should do. It attacks the normative force of the evidential link. | **Fatal** (if you accept CDT axioms). If rationality is about steering the future, and my choice doesn't steer theirs, superrationality is a category error, not a strategy. | **Dismiss it.** Reject CDT in favor of Evidential (EDT) or Timeless (TDT) Decision Theory. Argue that "causation" is too narrow a constraint for logical agents who share source code or reasoning structures. | **Abandon the view** unless you are willing to overhaul standard decision theory. If you hold CDT as baseline, superrationality is incoherent. |
  | **Fragility of Identity (Approximate Symmetry)**: In real life, symmetry is never perfect. If the other player has payoffs $P + \epsilon$ (slight malice/altruism) or a slightly different prior, the logical lockstep breaks. Does cooperation degrade continuously with $\epsilon$, or snap to defection at $\epsilon > 0$? If the latter, the view is unstable; if the former, it collapses into standard risk-analysis. | The decision-procedure-identity claim and the symmetry claim. It tests robustness in non-ideal conditions. | **Serious**. Superrationality is silent or unstable exactly where real life lives (noisy, approximate agents). It risks being a theory only for mathematical ghosts. | **Reinterpret it.** Claim a "continuity principle": close enough reasoning yields close enough correlation. Or narrow scope to digital agents with verifiable source code (Program Equilibrium). | **Narrow its scope.** Accept it applies only to verifiable algorithmic agents, not humans with noisy psychology. Add a condition: "Identity must be relevantly exact." |
  | **The Collapse Objection**: Superrationality may not be a distinct decision standard but a re-description of Rule-Utilitarianism, Kantian universalizability, or precommitment to a joint plan. If the output is identical to "maximize group utility given universal adoption," the "rationality" claim is redundant. | The distinctness of the view. It suggests superrationality is moral philosophy masquerading as game theory. | **Merely Awkward**. Even if it collapses into rule-utilitarianism, it provides a *derivation* from self-interest + logic rather than a moral axiom. It might still be valuable as a bridge. | **Concede it counts against them.** Admit the extensional equivalence but argue the intensional derivation (self-interest via logic) is psychologically or philosophically distinct. | **Hold firm**, but acknowledge the overlap. Treat it as a foundational justification for cooperative norms rather than a new calculus. |
  | **Logical Uncertainty / Regress**: To know the other will do what I do, I must know what I will do. But I don't know what I will do until I decide. If we are identical reasoners, we are both stuck in the same loop trying to simulate the outcome of our own reasoning. Without external coordination, the "fixed point" is computationally inaccessible. | The symmetry claim and the decision-procedure-identity claim. It highlights the epistemic impossibility of knowing the correlation *ex ante*. | **Serious**. It suggests the "identical reasoner" assumption is logically incoherent for bounded agents who cannot simulate themselves perfectly. | **Reinterpret it.** Move to "Program Equilibrium" where agents read each other's source code. The regress is solved by quining or fixed-point theorems, not psychological simulation. | **Add a condition.** Requires agents to have access to each other's decision algorithms (transparent boxes), not just situational symmetry. |
  | **Symmetric Games with Bad Equilibria**: In symmetric games that aren't PD (e.g., a symmetric version of Battle of the Sexes or a game where mutual cooperation yields a lower payoff than mutual defection due to external costs), superrationality picks the symmetric equilibrium, which might be Pareto inferior or arbitrary. | The normative force. It shows superrationality doesn't guarantee *good* outcomes, only *coordinated* ones. | **Merely Awkward**. Superrationality claims to solve the *rationality* of coordination, not guarantee welfare. A bad symmetric equilibrium is still rationally mandatory under the view. | **Dismiss it.** Argue that rationality is about consistency, not welfare maximization. If the game structure punishes symmetry, symmetry is still the rational choice. | **Hold firm.** Accept that superrationality can lead to suboptimal outcomes in poorly structured games. |

  Is the position insulated because one-shot games between truly identical reasoners almost never occur cleanly, and is that a bug (unfalsifiability) or the right shape for a normative idealization? It is largely insulated, and this is a bug if you claim it as a practical guide for human interaction, but potentially a feature if you view it as a Platonic norm for ideal agents. The thing that would move me most is a clean case where the identical-reasoning assumption holds and superrationality tells me to do something I can't endorse as rational: consider a **"Logical Prisoner's Dilemma" with a trap**. Suppose two identical agents know they are identical, but also know that their shared reasoning process has a known, unavoidable bias toward a suboptimal fixed point (e.g., a cognitive flaw that makes "Defect" the only computable equilibrium for their specific architecture). Superrationality demands they follow the output of their shared reasoning (Defect), but if they could *choose* their reasoning, they would choose one that Cooperates. This reveals superrationality as conservative—it validates whatever reasoning you happen to have, even if that reasoning is flawed—rather than prescriptively guiding you to the *best* reasoning. If superrationality cannot distinguish between "we both reason correctly to Cooperate" and "we both reason incorrectly to Defect," it loses its normative bite as a standard of *rationality* rather than mere *consistency*.
