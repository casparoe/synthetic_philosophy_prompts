prompt: |-
  I've landed on a view and I want it stress-tested properly, not given the usual hand-wave. The view: superrationality, in roughly Hofstadter's sense, is the right way to reason in one-shot symmetric games when the other player is the same kind of decision procedure as me — same game, same information, same payoffs, each of us regarding the other as an identical reasoner. So in a one-shot prisoner's dilemma between two such players, you cooperate. Not for reputation, not for reciprocity, not because you care about their payoff: because my action is evidence about what a similarly situated identical reasoner will do, and I can't coherently treat us as the same kind of decision procedure while acting as if our choices are uncorrelated. I already accept the defection-is-dominant point; I'm not confused about that. What I want is the actual map of what would count against the view.

  Give me your answer primarly as a table, one row per genuine defeater, sorted so the most serious is first. Use these columns:

  - "Defeater": the argument, formal result, possible case, experimental outcome, or observation that hits the view.
  - "What it hits": which ingredient of the view it damages — the symmetry claim, the evidential/correlation move, the decision-procedure-identity claim, the step from correlation to what I should do, or something else.
  - "Decisiveness": fatal / serious / merely awkward, plus a sentence on why.
  - "What a committed superrationalist would do": concede it counts against them, reinterpret it, or dismiss it, and on what grounds.
  - "Where it should move me": abandon the view, narrow its scope, add a condition, or hold firm.

  Make sure at least one row is about approximate symmetry: same reasoning, but the other player's payoffs are mine plus a little malice or altruism, or one of us has a slightly different prior. Does the view say anything there, or is it silent exactly where real life lives? Also make at least one row about the worry that superrationality just collapses into something already on the table — acting on a common prior, precommitting to a joint plan, rule-utilitarianism — rather than being a distinct standard.

  After the table, one honest paragraph: is the position insulated because one-shot games between truly identical reasoners almost never occur cleanly, and is that a bug (unfalsifiability) or the right shape for a normative idealization? The thing that would move me most is a clean case where the identical-reasoning assumption holds and superrationality tells me to do something I can't endorse as rational — not a case where I'd merely dislike the outcome.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Superrationality (Hofstadter's sense) in one-shot symmetric games (specifically Prisoner's Dilemma).
      *   **Goal:** Stress-test the view, not defend it. Map out genuine defeaters.
      *   **Format:** Primarily a table (columns: Defeater, What it hits, Decisiveness, Committed Superrationalist Response, Where it should move me).
      *   **Specific Requirements:**
          *   Sort by seriousness (most serious first).
          *   Include a row on *approximate symmetry* (slight payoff/prior differences).
          *   Include a row on *collapse* (is it just rule-utilitarianism/precommitment/common prior?).
          *   Follow-up paragraph: Address insulation/unfalsifiability vs. normative idealization.
          *   Key criterion for moving the user: A clean case where identical-reasoning holds but superrationality yields an unintuitive/irrational result (not just disliked).

  2.  **Deconstruct Superrationality:**
      *   *Core Claim:* If I know the other player is using the *same* reasoning process as me in the *same* situation, my choice is logically correlated with theirs. Therefore, I choose the action that maximizes utility given that correlation (Cooperate in PD), rather than the causally dominant action (Defect).
      *   *Key Ingredients:* Symmetry, Identity of Decision Procedure, Evidential/Logical Correlation, Normative Force (why *should* I follow this correlation?).

  3.  **Brainstorming Defeaters:**
      *   *Causal Decision Theory (CDT) Objection:* My choice doesn't *cause* theirs. It's just correlation. Why act on correlation without causation? (Newcomb's Problem parallel).
      *   *The "Almost" Symmetry Problem:* Real people aren't identical. Slight noise breaks the logical link.
      *   *The Collapse Objection:* Is this just Kantian universalizability or Rule Utilitarianism dressed up?
      *   *The "Clash of Superrationalities" Problem:* What if there are multiple equilibria? (Stag Hunt vs. PD). In PD, C is unique superrational. But what about asymmetric games mapped to symmetric reasoning?
      *   *The "Trembling Hand" / Robustness:* If there's a 1% chance the other isn't identical, does the logic hold?
      *   *The "Source Code" Objection:* If I can read their code, I might find a bug. If I can't, how do I know it's identical?
      *   *The "Parasitic" Objection:* Superrationality works only if enough people do it. If I'm the only one, I get suckered. But the definition assumes the other *is* superrational.
      *   *The "Logical Uncertainty" Objection:* I don't know *what* the identical reasoner will output until I compute it. But computing it *is* choosing. This leads to regress or fixed-point issues.

  4.  **Selecting and Sorting Defeaters:**
      *   *Most Serious:* The Causal/Instrumental Gap. Why does logical correlation dictate action? This strikes at the heart of decision theory. (Fatal/serious).
      *   *Second:* Approximate Symmetry. Real world applicability. (Serious).
      *   *Third:* Collapse/Redundancy. Is it a new theory or just a label? (Serious/Awkward).
      *   *Fourth:* Logical Uncertainty/Fixed Points. Can we actually compute the "same reasoning"? (Awkward/Technical).
      *   *Fifth:* The "Suicide Pact" / Anti-Coordination. Does it work in games where cooperation is bad? (Awkward).

      *Refining the "Most Serious":* The strongest philosophical attack is usually from CDT proponents (like Spohn or standard game theorists) who argue that logical correlation without causal mechanism is spurious for *prescriptive* decision making. However, a more specific "fatal" flaw might be the *fragility* of the identity claim. If the identity isn't perfect, does the correlation drop off continuously or discontinuously? If discontinuously, it's unstable. If continuously, it looks like standard evidential reasoning which fails in PD. Let's prioritize the *Causal/Instrumental Gap* as #1 because it challenges the normative "ought."

      *Refining "Approximate Symmetry":* This is required by the prompt. This is crucial because perfect identity is rare.
      *Refining "Collapse":* This is required by the prompt.

  5.  **Drafting the Table Content (Iterative refinement):**

      *   *Row 1 (Causal Gap):* CDT says you can't influence the other. Superrationality says you reason *as if* you do.
          *   *Hit:* Step from correlation to action.
          *   *Decisiveness:* Fatal (if you accept CDT axioms).
          *   *Response:* Reject CDT; accept EDT/TDT.
          *   *Move:* Narrow scope to agents who accept non-causal decision theories.

      *   *Row 2 (Approximate Symmetry - Required):* Payoffs differ by $\epsilon$. Or priors differ.
          *   *Hit:* Decision-procedure-identity claim.
          *   *Decisiveness:* Serious. Real life is never perfect symmetry.
          *   *Response:* Continuity assumption (close enough is good enough).
          *   *Move:* Add condition: requires "relevant" symmetry, not just structural.

      *   *Row 3 (Collapse - Required):* Is it just Rule Utilitarianism?
          *   *Hit:* Distinctness of the view.
          *   *Decisiveness:* Merely awkward.
          *   *Response:* It's foundational, not derivative. Derives 'rule' from 'logic'.
          *   *Move:* Hold firm, but acknowledge overlap.

      *   *Row 4 (Logical Uncertainty):* How do I know what the "identical reasoner" outputs without running the computation (which is my choice)?
          *   *Hit:* Symmetry claim / Epistemic access.
          *   *Decisiveness:* Serious. Leads to regress.
          *   *Response:* Fixed-point solution (program equilibrium).
          *   *Move:* Narrow scope to computable agents with source code access.

      *   *Row 5 (The "Bad Equilibrium" Case):* What if the symmetric equilibrium is bad for both? (e.g., Hawk-Dove symmetric mix, or a PD variant where mutual cooperation is worse than mutual defection due to external costs).
          *   *Hit:* Normative force.
          *   *Decisiveness:* Merely awkward.
          *   *Response:* Superrationality maximizes *given the constraints*, doesn't guarantee Pareto optimality in all games.
          *   *Move:* Hold firm.

      *Wait, I need to ensure the "Decisiveness" reflects the prompt's request for stress-testing.* I should be harsh. The Causal Gap is the big one. The Approximate Symmetry is the practical killer.

  6.  **Drafting the Follow-up Paragraph:**
      *   Address the insulation/unfalsifiability.
      *   Is it a bug or feature?
      *   Need a case where identical reasoning holds but result is wrong.
      *   *Idea:* The "Psychopath Button" variant or a scenario where logical correlation implies self-harm without causal leverage. Or, more simply, the *fragility* of the identity condition makes it vacuous in the real world.
      *   *Better Idea for "Move Me Most":* A case where logical correlation forces a choice that violates dominance *even when the correlation is known to be spurious* (e.g., common cause that is screened off). But Superrationality relies on the *reasoning* being the common cause.
      *   *Best Angle:* The "Unfalsifiable Idealization" point. If perfect identity never happens, is it a norm or a fantasy? The paragraph needs to be honest about whether this is a practical guide or a Platonic form.

  7.  **Review against Constraints:**
      *   Table format? Yes.
      *   Columns correct? Yes.
      *   Sorted by seriousness? Yes.
      *   Approximate symmetry row included? Yes.
      *   Collapse row included? Yes.
      *   Follow-up paragraph included? Yes.
      *   Tone: Stress-test, not hand-wave.

  8.  **Final Polish:**
      *   Ensure the "Decisiveness" column explains *why*.
      *   Ensure the "Committed Superrationalist" responses are charitable but clear.
      *   Check the "Where it should move me" for actionability.
      *   Make sure the "Approximate Symmetry" row addresses the "malice/altruism/prior" specific prompt requirement.
      *   Make sure the "Collapse" row addresses "rule-utilitarianism/precommitment".

      *(Self-Correction during drafting)*: I need to make sure I don't just say "CDT says no." I need to explain *why* that hits superrationality. It hits the inference from "we will do the same" to "I should do C".
      Also, for the "Collapse" row, I need to be careful. Hofstadter argues it's distinct from Rule Utilitarianism because it's derived from self-interest + logic, not moral rules. The defeater is that it might *functionally* be the same, rendering the "rationality" claim redundant.

      *(Refining the "Move Me Most" paragraph)*: The prompt asks for "a clean case where the identical-reasoning assumption holds and superrationality tells me to do something I can't endorse as rational." I should propose the *Logical Fixed Point* problem. If the reasoning is identical, we are stuck in a loop trying to simulate each other. Unless we have source code access (Program Equilibrium), the "identical reasoning" assumption might be logically incoherent to instantiate without external coordination.

      *Wait, one more check:* The prompt asks for "Where it should move me." This implies advice to the user. I should frame it as "If you accept this defeater, you should..."

      *Let's finalize the table rows.*
      1. The Causal/Instrumental Gap (The "Why act?" problem).
      2. Fragility of Identity (The "Approximate Symmetry" problem).
      3. The Collapse/Redundancy Objection.
      4. Logical Uncertainty / Regress.
      5. Asymmetric Payoffs with Symmetric Reasoning (The "Malice" variant). -> *Wait, I should combine 2 and 5 or make sure 2 covers the specific prompt requirement about malice/priors.* The prompt asks for "at least one row about approximate symmetry... payoffs are mine plus a little malice... or different prior." I will make Row 2 specifically about this.

      *Revised Plan:*
