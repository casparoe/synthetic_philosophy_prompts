          *   *Soft Spot:* Is it *ad hoc*?
          *   *Concession:* Admit it changes the *formal* criterion, argue it clarifies the *physical* one.

      *   *Drafting Objection 2 (Relationism):*
          *   *Who:* Committed Relationist.
          *   *Objection:* If points are only individuated by the metric, they are just nodes in a relational structure. Why call it substantivalism? It's relationism with extra steps.
          *   *Reply:* Relationism denies the container exists. SS says the container exists but is structurally defined. The metric is a field *on* the manifold, not just relations between events.
          *   *Soft Spot:* The ontological difference is thin.
          *   *Hold:* The manifold is a necessary ontological posits for field theory (topology, etc.).

      *   *Drafting Objection 3 (Symmetries/Structuralism):*
          *   *Who:* Structural Realist.
          *   *Objection:* What about spacetimes with symmetries (Minkowski, Schwarzschild)? The metric doesn't uniquely individuate points there (Killing fields). Your view collapses into haecceitism or fails there.
          *   *Reply:* Acknowledge this is the "Problem of Automorphisms." SS requires we treat symmetric points as physically indistinguishable, not that they don't exist.
          *   *Soft Spot:* This is the hardest technical point.
          *   *Hold:* Existence $\neq$ Unique Individuation.

      *   *Drafting Objection 4 (Metaphysics):*
