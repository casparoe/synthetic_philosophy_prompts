  ### The Rule She's Actually Running
  **Rule (a): Never let safety depend on the model's internal dispositions.**

  While Rule (b) (Real-Time Observability) fits most of her decisions, it fails to explain **Verdict #2 (Honesty Fine-Tuning)**. If her primary concern were observability (Rule b), honesty fine-tuning would be a net positive or neutral; an honest model is easier to watch than a deceptive one, and observability doesn't preclude using internal alignment as a layer of defense. By rejecting it as "window dressing" that doesn't count toward the safety case, she is making a categorical claim about the *source* of safety, not the *visibility* of it. She believes safety must be architectural (external), not psychological (internal).

  Rule (a) explains all five cases (the four past + the encrypted channel):
  1.  **Trusted Monitor:** Approved because it is an **external constraint** that functions regardless of the main model's intent ("works even if scheming").
