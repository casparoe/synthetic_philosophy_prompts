  4.  **Constitution + Audits:** Rejected because a Constitution is **internal**, and audits are probabilistic, not **hard constraints**.
  5.  **Encrypted Channel:** Vetoed because encryption creates a **hidden coordination space**. Even if the final output is monitored, the *process* of generating that output now relies on the models *not* using the encrypted channel to collude on a bypass. This shifts safety from "The monitor catches bad outputs" to "The models won't successfully plot in the dark," which violates Rule (a).

