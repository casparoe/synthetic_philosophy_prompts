answer: |-
  Thank you. It is a rare privilege to stand between two worlds that so often speak past one another. To the scientists and philosophers here: thank you for inviting us into your inquiries. To my fellow writers: thank you for tolerating my intrusion of theory into a trade that usually prefers instinct.

  I want to talk about a thought experiment that has kept me awake at night. It comes from Daniel Dennett's essay "Quining Qualia." For those of you who haven't had the pleasure of losing sleep over this specific text, the setup is simple. Dennett asks us to imagine two coffee tasters employed by a large company. Let's call them Chase and Sanborn.

  After years of work, Chase reports that the coffee tastes exactly as it always has, but he no longer takes any pleasure in it. His palate is intact; his joy is gone. Sanborn, however, reports the opposite. He says his appreciation for the coffee is unchanged, he still loves the ritual and the buzz, but the taste itself has shifted. The coffee simply doesn't taste like it used to.

  Dennett's point is that there is no test, no scan, no interrogation that can settle who is right. We cannot peel apart the "raw taste" from the "reaction to the taste." If we cannot distinguish the sensation from the disposition to react to that sensation, then perhaps the "raw taste"—the private, ineffable quale itself—is not a coherent thing. It might be a philosophical fiction.

  For a long time, this terrified me.

  We novelists operate on a specific, somewhat arrogant premise. We believe that our highest function is to bridge the gap between minds. We claim to give you access to what it is *like* to be someone else. We promise to transmit the redness of a character's red, the specific texture of their grief, the private flavor of their joy. We act as if there is a stable, transferable substance called "experience" that I can encode in ink and you can decode in your nervous system.

  If Dennett is right—if there is no "taste itself" separable from the taster's judgments and memories—then the novelist's mission statement collapses. You cannot transmit a ghost if the ghost was never there. It suggests that when I write, "She felt a sharp pang of longing," I am not pointing to a private object in her mind. I am merely describing a pattern of behavior, a disposition to weep, a memory of a lost love. I am not showing you the light; I am describing the shadow.

  But lately, I have come to a different conclusion. I suspect that the threat Dennett poses is only a threat if we misunderstand what fiction actually does.

  If we follow Dennett's line of reasoning, he suggests that what exists is not the pure quale, but the "tangle of reaction, memory, judgment, and redescription." He argues that our experience is constituted by these things, not merely accompanied by them.

  And I would argue that this is not the destruction of the novel. It is the definition of it.

  Think about the work. When I sit down to build a character, I cannot give you their qualia. I have no access to my own, let alone a fictional construct's. What I do is I build the tangle. I give them memories that color their present. I give them judgments that warp their perception. I give them a history of reactions that make their current state intelligible.

  When I write a scene where a character tastes coffee, I am not trying to beam a flavor into your brain. I am writing about how that flavor interacts with their history. Does it remind them of a war zone? A first date? A hospital waiting room? The "taste" in the text is never just the chemical stimulation of the tongue. It is the sum total of the character's relationship to that taste.

  In this light, Dennett's eliminativism doesn't empty the novelist's craft; it validates it. It suggests that the "what it is like" is not a hidden pearl inside the oyster. It is the oyster itself. The shape, the grit, the muscle, the history. If the "what it is like" is constituted by the complex web of judgments and dispositions, then the novelist is the cartographer of that web. We are not in the business of transmitting raw data; we are in the business of mapping the context that makes data meaningful.

  Now, I am aware that I am walking through a minefield. I know that many philosophers in this room—perhaps most—disagree with Dennett's conclusion. There are strong arguments that the indeterminacy of Chase and Sanborn shows only the limits of our *concepts* or our *access*, not the non-existence of the experience itself. There are those who hold that the light of consciousness is real, even if we cannot measure it with a ruler.

  I do not stand here to settle the Hard Problem of consciousness. I am a storyteller, not a metaphysician. But I will say this: whether the qualia are real or illusory, the novelist cannot reach them directly. We can only write the report. We can only write the Chase and Sanborn of it.

  And perhaps that is where the art lives. Not in the transmission of the ineffable, but in the honest admission that we are all, always, interpreting our own experience.

  Consider the beauty of Dennett's example. Chase and Sanborn are not just data points. They are characters. The uncertainty about their internal states is not a bug in the system; it is the plot. The fact that we cannot know if the coffee changed or the man changed is precisely what makes them human.

  If I were writing a novel about Chase, I wouldn't need to solve the puzzle. I would write the uncertainty. I would write the frustration of a man who cannot tell if he has broken or if the world has. That ambiguity is not a failure of description; it is the deepest truth I can offer.

  So, to the philosophers: I take your point that the inner light may burn regardless of our ability to name it. I do not deny the mystery. But to the writers: let us not be seduced by the idea that we are magicians beaming souls from page to eye. We are architects of the tangle. We build the memories, the judgments, the dispositions. We build the world in which the coffee tastes bitter.

  If Dennett is right that the "taste itself" is indistinguishable from the story we tell about the taste, then we are not in the business of lying. We are in the business of telling the only truth that is available.

  So let us return to Chase and Sanborn one last time. They sit in the tasting room, cups in hand. One says the joy is gone; the other says the flavor is gone. We cannot know who is right. But we can watch them drink. We can watch the way they hold the cup, the way they wince, the way they look out the window at the rain.

  We can write that. And in writing that, in honoring the complexity of their report rather than chasing the phantom of the pure sensation, we do justice to the mystery of being alive. We do not need to solve the mind to tell the truth about it. We just need to tell the story of the coffee.

  Thank you.

  ***

  **Note on Philosophical Nuance**

  In drafting this speech, I navigated two contested areas you should review. First, regarding Dennett: I framed his view as "If we follow Dennett's line of reasoning" and "He argues," rather than stating his eliminativism as fact. However, I did lean into the idea that the "tangle" is *all* there is, which is the core of his eliminativist position. Critics (like David Chalmers or Thomas Nagel) would argue the tangle *supervenes* on qualia, not that it replaces them. I tried to hedge this by acknowledging the "inner light" may still exist, but emphasizing the novelist's *access* is limited to the tangle regardless.

  Second, regarding the novelist's reconciliation: I argued that fiction *was never about qualia*. A realist philosopher might argue that great fiction *does* successfully refer to qualia, even if indirectly. I positioned the speech to suggest that even if they do refer to them, the *mechanism* is the tangle, which protects the craft regardless of the metaphysical verdict. You may want to decide if you are comfortable implying that the "transmission of experience" is a misunderstanding of the craft, as some writers might feel that undermines the emotional power of reading.
