answer: |-
  Bernard Williams's famous objection to impartial moral theories—that requiring a man to justify saving his wife from drowning involves "one thought too many"—strikes at the heart of the conflict between personal integrity and moral systematization. The objection posits that if an agent must consult an impartial principle to permit a action grounded in love, the theory has alienated the agent from the very attachment that makes the action meaningful. However, as your reading group discovered, this critique faces a stress test in institutional contexts. Consider a triage nurse whose child and a stranger are both injured; impartial protocol dictates treating the stranger first. If Williams's objection holds here, it seems to delegitimize any role requiring impartiality, from judges to referees. If it does not hold, we need a principled distinction between the drowning husband and the triage nurse. I argue that Williams's objection **generalizes** in a way that undermines impartial theories as comprehensive justificatory frameworks, even if it does not abolish institutional roles. The problem is not merely psychological but normative: impartial theories cannot serve as the ultimate ground of motivation without alienating agents from their own ground projects, whether intimate or professional.

  To understand why the objection generalizes, we must first identify precisely what feature of the original case does the work in Williams's argument (requirement a). It is not merely the presence of intimacy or the stakes of life and death. The crucial feature is that the relationship constitutes a **"ground project."** For Williams, ground projects are commitments so deeply woven into an agent's identity that to subject them to external moral scrutiny is to threaten the integrity of the self. The husband's desire to save his wife is not a means to maximize utility or fulfill duty; it is an expression of who he is. When an impartial theory demands he justify this impulse via a neutral calculus, it treats his constitutive attachment as merely one interest among others, thereby fracturing his integrity. The alienation arises because the theory demands a perspective external to the agent's own life.

  Proponents of containment (requirement b) argue that the triage nurse case is fundamentally different. Their strongest intuition rests on the **voluntary and public nature of institutional roles**. Unlike marriage, which is often viewed as a pre-political or constitutive bond, the role of a triage nurse is a voluntary undertaking defined by specific rules. The nurse knows that the efficacy of the triage system depends on impartiality; therefore, adopting the role entails accepting impartiality as a constraint. On this view, the nurse *should* have the "one thought"—the rule—because the rule is constitutive of the practice she voluntarily joined. To prioritize her child would be to cheat the system she agreed to uphold. Thus, the husband isn't being indulged; he is acting within the sphere of the personal where impartiality has no foothold, whereas the nurse is acting within a sphere where impartiality is the definition of the activity.

  However, this containment strategy fails upon closer inspection. It assumes that the voluntary adoption of a role insulates the agent from alienation. But why does the nurse uphold the role? If her ultimate justification for following triage protocol is purely impartial (e.g., "this maximizes overall survival"), she remains alienated. She is treating her own commitment to her profession as a mere tool for impersonal utility. For her action to be non-alienated, her commitment to the role itself must be a ground project. She must care about being a nurse, about the integrity of medical practice, not just about the abstract outcome. If the impartial theory demands that she subordinate her professional integrity to the calculus whenever the calculus suggests it (e.g., if breaking the rule secretly saved more lives), she is alienated from her role just as the husband is alienated from his marriage. The distinction between intimacy and roles is not sharp enough to block the objection; what matters is whether the motivation springs from an internal commitment or an external demand. In both cases, if the *ultimate* justification is impartial utility, the agent is reduced to a channel for satisfaction of impersonal demands.

  This leads to the reply regarding *justifying reasons* versus *conscious thoughts* (requirement c). Sophisticated impartialists argue Williams conflates psychology with normativity. They claim a theory need only specify what *justifies* the action (the impartial rule), not what must consciously occur to the agent in the moment. The nurse can act out of love for her child (or professional duty) while the theory silently validates the action based on overall utility. Does this save impartial theories? No, it merely relocates the problem.

  The issue is not merely what thoughts occur during the emergency, but what structure of reflection the agent is committed to upon scrutiny. If the nurse asks, "Why should I follow this protocol?" and the only valid answer is "Because it maximizes utility," she is alienated from her profession. She cannot view her professional duties as genuinely binding in themselves; they are only binding insofar as they serve the external master of utility. This creates a split between the agent's practical perspective (where the rule matters) and the theoretical perspective (where the rule is contingent). Williams's point is that moral theory should account for the agent's perspective, not override it with a "view from nowhere." By insisting that the *justification* must be impartial even if the *motivation* is personal, the theory demands that the agent accept a justificatory framework that renders their actual motives secondary. This is intellectual alienation. It requires the agent to regard their own deepest commitments as provisionally valid only when they align with an external standard.

  Therefore, the objection generalizes. It shows that impartial theories cannot provide the *ultimate* foundation for moral life without undermining the integrity of the agents living it. This does not mean the triage nurse should save her child over the stranger; the protocol may still be the right action. But the *reason* the protocol binds her cannot be purely impartial utility. It must be grounded in her own commitment to the practice of medicine, a commitment that is itself a ground project. If the impartial theory demands she abandon that commitment whenever utility dictates, it undermines the role. If it allows her to hold the commitment as foundational, it ceases to be a comprehensive impartial theory and becomes a framework subordinate to personal integrity.

  The line does not fall between intimacy and institutions. It falls between **internal commitments** and **external impositions**. Any moral theory that requires agents to validate their ground projects—whether loving a spouse or upholding a medical role—through an impartial calculus invites alienation. The triage nurse is not exempt from Williams's critique unless her adherence to triage is itself a personal project she owns, rather than a submission to an impersonal law. Consequently, impartial theories fail as comprehensive accounts of morality because they cannot accommodate the necessity of having ground projects that are not themselves justified impartially. We must accept that some reasons are agent-relative not because they are exceptions to the moral law, but because they are the conditions of having a moral life at all.

  \answer{The objection generalizes beyond intimacy}
