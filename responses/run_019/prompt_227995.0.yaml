  10. **Final Polish:** Check tone. Ensure the distinction between micro-trajectories and macro-trajectories is clear. Ensure the "normativity" issue is highlighted as the main point of failure. (Self-Correction: Make sure to explicitly mention "phase space" and "trajectories" in the translation sections).

