      *   **Output Format:** Prose analysis followed by a summary table (4 columns: Concept, DS Translation, Fidelity, Diagnosis). At least six rows.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Hard Determinism:* Determinism is true + Incompatibilism is true -> No free will/responsibility.
      *   *Libertarian Incompatibilism:* Free will/responsibility exists + Incompatibilism is true -> Determinism is false (usually requires agent-causation or non-deterministic event-causation).
      *   *Compatibilism:* Determinism is true + Free will/responsibility exists -> They are compatible.
          *   *Classical (Conditional):* "Could have done otherwise" means "Would have done otherwise *if* I had chosen otherwise."
          *   *Contemporary (Reasons-Responsiveness):* Freedom is the capacity of the mechanism to respond to reasons across possible scenarios.

  3.  **Deconstruct the Physics Vocabulary:**
      *   *Phase Space:* The space of all possible microstates.
      *   *Trajectory:* The path of the system through phase space over time.
      *   *Deterministic Evolution:* Given a point $x_0$ at $t_0$, the trajectory $\phi_t(x_0)$ is unique.
      *   *Coarse-Graining:* Grouping microstates into macrostates (cells in phase space).
      *   *Sensitive Dependence:* Chaos theory (nearby trajectories diverge).
      *   *Emergent Macro-level:* Variables defined on the coarse-grained scale.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Determinism:* Easy. Unique trajectory through phase space given initial conditions.
      *   *"Could have done otherwise" (Incompatibilist):* This is the hard part. In a deterministic system, there is only *one* actual trajectory. To say "I could have done otherwise" implies a branching path. In DS terms, this requires either: (a) changing initial conditions (which isn't "me" doing it, it's the universe being different), or (b) stochastic dynamics (quantum jumps?). If strict determinism holds, this concept evaporates *at the micro-level*.
      *   *Compatibilist "Could have done otherwise":* This maps to *counterfactual stability* or *modality* within the macro-description. If we perturb the input (reasons) slightly, does the output (action) change accordingly? Or, looking at the bundle of microstates constituting the macrostate "Agent decides X," do neighboring microstates lead to "Agent decides Y" if the reasons were different? This looks like *structural stability* or *basins of attraction*.
      *   *Agency/Deliberation:* This is clearly coarse-graining. The "Agent" is a macroscopic variable (a region in phase space). Deliberation is the trajectory moving through the "decision manifold" before settling into an attractor (action).
      *   *Moral Responsibility:* This is the biggest strain. Trajectories aren't "responsible." Responsibility implies a normative assessment. In DS terms, maybe it's about *control*? i.e., Is the action sensitive to the "reasons" variables in the macro-description? If the trajectory passes through the "Reasons-Responsive" region of phase space, is that responsibility? It feels like a category error, but I need to try. Maybe responsibility = the action is an output of a specific feedback loop structure within the system.

  5.  **Addressing Specific Prompts:**
      *   *Incompatibilist "Could have done otherwise":* Requires branching time or multiple actualizable futures from the *exact same* microstate. DS says no. It evaporates unless we introduce stochasticity, but even then, "agent control" over the randomness is hard to model.
      *   *Compatibilist Coarse-Graining:* Yes, agency lives at the macro-level. The microstate fixes the macrostate, but the *explanation* lives at the macro-level. This is the "autonomy of special sciences" argument.
      *   *Hard Determinist Responsibility:* If responsibility requires the Incompatibilist "could," it fails. If it requires macro-level control, it might survive.

  6.  **Developing the Residue Report:**
      *   *Clean:* Determinism, Causality (as evolution laws), Deliberation (as trajectory through state space).
      *   *Strained:* "Could have done otherwise" (needs counterfactuals which don't exist in a single trajectory), Reasons-Responsiveness (needs defining "reasons" physically).
      *   *Fails:* Moral Responsibility (Normativity). Physics describes *is*, philosophy argues *ought*.
      *   *Verdict:* Is normativity missing reality? Yes, physics is descriptive. Is the dispute verbal? Partly. The incompatibilist wants a metaphysical privilege for the agent that DS doesn't support. The compatibilist wants to redefine freedom to fit DS.

  7.  **Refining the Physics/Philosophy Interface:**
      *   *Libertarianism:* Needs a break in the evolution law $\dot{x} = f(x)$. Maybe an external input term not determined by $x$? "Agent-causation" looks like a boundary condition imposed from outside the system's internal dynamics.
