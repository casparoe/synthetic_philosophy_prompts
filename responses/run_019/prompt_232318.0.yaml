      *   **Task:** Evaluate the accuracy of the documentary's narration sentence by sentence.
      *   **Specific Concerns:** The user is suspicious about "more costly = more reliable" (optimality issue) and "cost is the *only* way" (exclusivity issue). They also question the gazelle stotting explanation.
      *   **Tone:** Informative, nuanced, accessible (no heavy citations), but scientifically rigorous enough for a behavioral ecology perspective.
      *   **Goal:** Tell the user what they can safely repeat and what needs caveats.

  2.  **Deconstruct the Narrator's Script (Sentence by Sentence Analysis):**

      *   *Sentence 1:* "The basic idea is simple: signals like a peacock's tail are honest because they're insanely expensive."
          *   *Verdict:* Mostly okay, but "insanely expensive" is a bit hyperbolic. "Costly" is the technical term. It captures the gist.
      *   *Sentence 2:* "Any honest signal has to be a net cost to the animal sending it, otherwise cheaters would fake it and the signal would stop meaning anything."
          *   *Verdict:* This is the core of Zahavi/Grafen, *but* the "net cost" part is tricky. It's often a *marginal* cost that differs by quality, not necessarily a net fitness loss (otherwise the trait wouldn't evolve). Also, "any honest signal" is too strong (see Index Signals).
      *   *Sentence 3:* "The bigger and costlier the ornament, the more reliable the information, because only a genuinely high-quality animal can afford to build and carry it."
          *   *Verdict:* User's suspicion is valid here. There's an optimal level. If it's *too* costly, the signal disappears. It's not a linear "more cost = more honest" forever.
      *   *Sentence 4:* "That's why peahens prefer big tails: the tail is literally a handicap, an obstacle to survival, and the fact that a male is still alive despite it is proof of quality."
          *   *Verdict:* Classic Zahavi. Generally accepted as a plausible explanation, though some debate exists on whether it's survival *despite* the tail or condition *dependence*.
      *   *Sentence 5:* "Zahavi proposed this in the 1970s and got laughed at, but later Grafen showed with game-theory models that handicaps can drive honest signaling, so nowadays we know cost is pretty much the only thing that makes animal communication honest."
          *   *Verdict:* History is roughly right (Zahavi was skeptical initially). The conclusion ("cost is pretty much the only thing") is **wrong**. Index signals and separation of interests exist.
      *   *Sentence 6:* "You see the same thing with gazelles stotting in front of a predator: instead of running, they waste energy jumping so the predator can see how fit they are, and the predator figures it's not worth the chase."
          *   *Verdict:* This is the "Pursuit Deterrence Hypothesis." It's a leading theory, but *not* settled fact. Other hypotheses exist (alarm signaling, social cohesion).

  3.  **Address Specific User Concerns:**
      *   *Concern 1: "More costly always means more reliable."*
          *   *Explanation:* Correct to be suspicious. There is an evolutionary stable strategy (ESS). If the cost exceeds the benefit (mating success), the trait dies out. It's about *differential cost*, not just absolute cost.
      *   *Concern 2: "Cost is basically the only way honest signals can happen."*
