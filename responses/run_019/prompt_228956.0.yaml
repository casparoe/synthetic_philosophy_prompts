      *   **Role:** Poet who knows early modern astronomy and biblical hermeneutics.
      *   **Task:** Write a 14-line Petrarchan sonnet in Galileo's voice.
      *   **Context:** After an awkward dinner, explaining to a skeptical noblewoman why the telescope hasn't made him an enemy of scripture.
      *   **Core Source Material:** Based on a specific passage from Galileo's *Letter to the Grand Duchess Christina* (1615): "Showing a greater fondness for their own opinions than for truth, they sought to deny and disprove the new things which, if they had cared to look for themselves, their own senses would have demonstrated to them."
      *   **Structure:**
          *   Octave (lines 1-8): Dramatize opponents confusing inherited interpretation with revelation and refusing to look (through the telescope).
          *   Volta (line 9): Turn to the realization that the dispute is about how scripture speaks to finite readers vs. how nature corrects exegesis.
          *   Couplet (lines 13-14): Land on Galileo's humility about interpretation without claiming science replaces theology.
      *   **Constraints:** No unnecessary name-dropping (Copernicus/Joshua only if structurally needed). Historically accurate (no anachronisms). Only the poem (no intro/outro).

