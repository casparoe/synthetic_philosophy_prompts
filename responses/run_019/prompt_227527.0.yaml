prompt: |-
  I am a novelist in the early planning stages of a literary novel, and I should like some philosophical counsel before I commit myself to a structure.

  The book is to be organised around a single uneasy question: how much of what we blame people for turns on factors beyond their control. In the course of my reading I have encountered the customary fourfold taxonomy of moral luck — resultant luck (luck in how one's actions turn out), circumstantial luck (luck in the situations in which one finds oneself), constitutive luck (luck in the sort of person one happens to be), and causal luck (luck in being the product of antecedents one did not choose). It strikes me that these four varieties might behave very differently as material for fiction, and I want to get the philosophy right before I build anything on it.

  Please rank the four categories from most to least promising as the load-bearing structure of a serious novel. By 'promising' I mean a compound of three things: the capacity to sustain narrative tension without contrivance; the tendency to resist tidy moral resolution on the reader's part; and the likelihood of surviving the scrutiny of a philosophically literate reader without collapsing into melodrama or incoherence. For each category, give me its placement, a few sentences of justification, the kind of plot it most naturally generates, and the characteristic failure mode a novelist should fear when working with it — the way, for instance, a story built upon resultant luck might stand accused of rigging its own dice.

  Two further requests. First, my own instinct is that circumstantial luck is the richest vein, but I suspect this may be only because it is the easiest to dramatise; if my instinct is mistaken, or correct for the wrong reasons, please say so plainly. Second, having produced the ranking with a tragedy in mind, tell me briefly whether it would be rearranged for a comic novel, and if so, how and why.

  Please do not supply reading lists, references, or citations; I am after your judgement rather than a bibliography. And I should be grateful if you would reply in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist planning a literary novel.
      *   **Topic:** Moral Luck (Nagel/Williams taxonomy: Resultant, Circumstantial, Constitutive, Causal).
      *   **Core Question:** How much blame turns on factors beyond control?
      *   **Task:** Rank the four categories from most to least promising as the *load-bearing structure* of a serious novel.
      *   **Criteria for "Promising":**
          1.  Capacity to sustain narrative tension without contrivance.
          2.  Tendency to resist tidy moral resolution.
          3.  Likelihood of surviving philosophical scrutiny (avoiding melodrama/incoherence).
      *   **Required Output per Category:** Placement, justification, natural plot type, characteristic failure mode.
      *   **Additional Request 1:** Evaluate the user's instinct that *Circumstantial Luck* is the richest vein (is it just easiest to dramatise?).
      *   **Additional Request 2:** Would the ranking change for a *comic* novel? How and why?
      *   **Constraints:** No reading lists/references/citations. British English. Tone should be philosophical counsel (judgement-based).

  2.  **Deconstruct the Four Types of Moral Luck in a Narrative Context:**

      *   **Resultant Luck:** Luck in how things turn out. (e.g., two drunk drivers, one hits a child, one doesn't. Is the first worse?)
          *   *Narrative potential:* High tension (outcome unknown until end).
          *   *Risk:* Feels like plot contrivance ("rigging the dice"). Can feel arbitrary.
          *   *Philosophical depth:* Good for questioning *judgement*, but maybe less for *character*.

      *   **Circumstantial Luck:** Luck in the circumstances one faces. (e.g., would I have collaborated with the Nazis if I lived in 1940s Germany?)
          *   *Narrative potential:* Very high. Tests character against environment. Historical fiction, war stories, social dramas.
          *   *Risk:* Determinism vs. Agency. Can become "victim of history" melodrama.
          *   *Philosophical depth:* Excellent for exploring the gap between self-image and action.

      *   **Constitutive Luck:** Luck in who you are (temperament, genetics, predispositions). (e.g., I am naturally patient, you are naturally irritable. Is my virtue just luck?)
          *   *Narrative potential:* Harder to dramatise. Internal. Psychological.
          *   *Risk:* Fatalism. "I couldn't help it, it's my nature." Removes tension.
          *   *Philosophical depth:* Deepest metaphysically, but hardest to make *plot*.

      *   **Causal Luck:** Luck in the chain of antecedents (determinism). (e.g., upbringing, cause-and-effect chain).
          *   *Narrative potential:* Very hard. Often leads to backstory dumps or sociological treatises.
          *   *Risk:* Incoherence. If everything is causal luck, there is no story, only reportage.
          *   *Philosophical depth:* High, but narrative suicide if taken literally.

  3.  **Drafting the Ranking (Serious Novel/Tragedy):**

      *   *1st: Circumstantial.* It puts character in conflict with the world. It allows for choice, but limits the *options* for choice. It avoids the "random accident" feel of Resultant and the "biological determinism" of Constitutive/Causal.
      *   *2nd: Resultant.* Classic tragedy structure. The accident that defines the life. High tension, but risks feeling like a gimmick.
      *   *3rd: Constitutive.* Psychological depth. But risks removing agency entirely. "I was born this way" is a hard sell for tension.
      *   *4th: Causal.* Too abstract. Hard to distinguish from Constitutive in practice, but more mechanical. Risks turning the novel into a case study.

      *Refining the Ranking:* Actually, for a *literary* novel focusing on blame, **Constitutive** might be more profound than Resultant, even if harder. Resultant luck often feels like a plot device (the car crash). Constitutive luck attacks the *self*. However, the prompt asks for "narrative tension without contrivance." Resultant luck is often contrived. Constitutive luck is inherent but static. Circumstantial is the sweet spot. Let's stick with Circumstantial at #1.
      What about #2? Resultant is the most *narrative* (events happen). Constitutive is the most *psychological*. For a novel, events usually drive plot. So Resultant #2. Constitutive #3. Causal #4.

      *Wait, let's reconsider Constitutive vs Resultant.*
      Resultant luck often leads to "O. Henry" endings or melodrama (the missed train).
      Constitutive luck leads to character studies (why am I like this?).
      For a "serious novel" about *blame*, Constitutive is philosophically richer but narratively flatter. Resultant is narratively sharper but philosophically shallower (it's about the outcome, not the agent).
      Actually, **Resultant** is often the most *dramatic* but the most prone to the "rigged dice" criticism.
      **Constitutive** is the most *resistant to tidy resolution* (you can't change your nature).
      Let's place Circumstantial first (best balance). Resultant second (high tension, high risk). Constitutive third (deep but static). Causal fourth (too abstract).

  4.  **Addressing the User's Instinct (Circumstantial):**
      *   User thinks it's the richest.
      *   My analysis: It *is* the richest for narrative, not just easiest. It bridges the gap between internal character and external world. It avoids the randomness of Resultant and the fatalism of Constitutive.
      *   Verdict: Instinct is correct, but not just because it's easy. It's because it preserves the *illusion* of choice while undermining the *reality* of it, which is where the friction lies.

  5.  **Addressing the Comic Novel Ranking:**
      *   Comedy relies on incongruity, reversal, and often the deflation of pretension.
      *   *Resultant* luck is huge in comedy (farce, misunderstandings, accidental success).
      *   *Circumstantial* is also good (fish out of water).
      *   *Constitutive* is good for character comedy (the miser, the braggart).
      *   *Causal* is still weak.
      *   *Shift:* Resultant moves up. In comedy, the absurdity of outcomes highlights the absurdity of moral judgement better than tragedy does. Tragedy demands weight; Comedy allows for the arbitrariness of Resultant luck to be the punchline.
      *   So, Resultant might take #1 or swap with Circumstantial. Let's say Resultant moves up because comedy tolerates contrivance better than tragedy does.

  6.  **Drafting the Content (incorporating British English and Tone):**
      *   Tone: Collegial, authoritative, thoughtful, slightly formal but not stuffy.
      *   Language: British spelling (organised, dramatise, colour, etc.).
      *   Structure: Follow the prompt's requirements exactly.

      *Self-Correction on Ranking:*
      Is Constitutive actually better than Resultant for a *serious* novel?
      Resultant luck often feels like a "twist". "He would have been a hero if the gun hadn't jammed."
      Constitutive luck is "He tried to be good, but he is naturally cowardly."
      The prompt asks for "load-bearing structure".
      If the book is about *blame*, Constitutive luck undermines the very possibility of blame most thoroughly. But can it sustain a plot?
      Let's stick with Circumstantial as #1. It offers the "test" scenario.
      Resultant #2. It offers the "consequence" scenario.
      Constitutive #3. It offers the "nature" scenario.
      Causal #4. It offers the "history" scenario.

      *Wait, I need to be careful about the "Failure Mode".*
      Resultant failure: Contrivance/Melodrama.
      Circumstantial failure: Historical Determinism/Excuse-making.
      Constitutive failure: Fatalism/Static Character.
      Causal failure: Sociological Treatise/Incoherence.

      *Re-evaluating the User's Instinct:*
      User says: "Circumstantial luck is the richest vein, but I suspect this may be only because it is the easiest to dramatise."
      My counter: It is the easiest to dramatise, *but* that is not why it is the richest. It is the richest because it isolates the variable of *situation* while keeping the *agent* constant. It allows the reader to ask "Would I have done the same?" more effectively than the others.

      *Re-evaluating Comedy:*
      In comedy, Resultant luck is king. The accident, the misunderstanding, the unexpected windfall. It drives plot.
      Circumstantial is second (The context).
      Constitutive is third (The flaw).
      Causal is fourth.
      So yes, the ranking changes. Resultant moves to #1.

  7.  **Final Polish:**
      *   Check British English (organised, realise, honour, etc.).
      *   Ensure no citations (Nagel/Williams names are in the prompt, so I can use the terms, but don't need to cite the papers).
      *   Ensure the tone is advisory.

      *(Self-Correction during drafting)*: I should make sure I don't sound *too* definitive. Philosophy is debatable. But the prompt asks for *my judgement*. So I will be decisive.

      *Refining the "Causal" definition:* Causal luck is often seen as the umbrella for the others (determinism). But in the taxonomy, it usually refers to the chain of prior events. In fiction, this is backstory. Backstory is necessary but rarely a *structure*.

      *Refining the "Constitutive" definition:* This is temperament. In fiction, this is character arc (or lack thereof). If character is fixed by luck, where is the arc? This is the tension.

      *Let's finalize the ranking for Tragedy:*
      1. Circumstantial (The Test)
      2. Resultant (The Accident)
      3. Constitutive (The Nature)
      4. Causal (The Chain)

      *Let's finalize the ranking for Comedy:*
      1. Resultant (The Absurdity)
      2. Circumstantial (The Situation)
      3. Constitutive (The Type)
      4. Causal (The Background)

      *Wait, one nuance:* In comedy, Constitutive luck (humours/types) is very strong (Jonson, Dickens). But Resultant (plot twists) drives the narrative engine more. I will argue Resultant moves up significantly.

      *Wait, another nuance on Circumstantial:* The user suspects it's only easiest to dramatise. I need to validate that ease is a virtue in narrative *if* it serves the theme. But I must confirm it's not *just* ease. It's about the *proximity* to the reader's own moral imagination.

      *Final check on constraints:* No reading lists. British English.

