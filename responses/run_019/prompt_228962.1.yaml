answer: |-
  There is no single, canonical term in organizational sociology or management theory that perfectly captures this specific configuration. However, the nearest established concept is **Institutional Decoupling**, but that term is insufficient because it typically describes a passive divergence between policy and practice. Your observation describes an *active, aggressive* divergence.

  Because this phenomenon is distinct from standard decoupling (which implies negligence) and distinct from "Tight-Loose" theory (which measures aggregate norms), I am going to commit to a coined term that accurately defines the mechanics you are seeing: **Compensatory Rigidity**.

  Here is the defense of that coinage, the definition of its boundaries, and an assessment of its stability.

  ### The Name: Compensatory Rigidity

  **Compensatory Rigidity** occurs when an institution, sensing a collapse in its general authority or legitimacy, retreats from broad enforcement and concentrates its remaining disciplinary capital onto a small set of high-visibility or low-liability rules, enforcing them with disproportionate severity to signal that "order still exists."

  It is "compensatory" because the severity is not proportional to the infraction; it is proportional to the institution's *anxiety* about its loss of control. It is "rigidity" because, unlike the fluid neglect of the surrounding culture, these specific rules become immutable.

  ### Why Existing Terms Fail

  1.  **Tight-Loose Culture (Gelfand):** As you noted, this framework measures the *average* strength of norms. A culture cannot be "Tight" (strong norms, low tolerance) and "Loose" (weak norms, high tolerance) simultaneously in the same domain. Compensatory Rigidity is a **bimodal distribution** of enforcement that the Tight-Loose metric averages out into noise.
  2.  **Institutional Decoupling (Meyer & Rowan):** This describes when organizations keep rules on the books for legitimacy but ignore them in practice to allow work to get done. Decoupling explains the *ignored* rules (the parking, the dress code), but it fails to explain the *hyper-enforced* rules. Decoupling suggests a shrug; Compensatory Rigidity suggests a hammer.
  3.  **Selective Enforcement:** In legal theory, this implies bias (enforcing laws against specific demographics). In your scenario, the selection isn't necessarily about *who* is punished, but *what* is punished. It is a strategic triage of rule categories, not necessarily a bias against individuals (though it often devolves into that).

  ### Defining the Configuration

  For a situation to qualify as **Compensatory Rigidity**, it must meet three criteria:

  1.  **The Legitimacy Deficit:** The institution knows it has lost the moral or practical authority to enforce the full code. Everyone knows the deadlines are fake or the dress code is dead.
  2.  **The Anchor Rules:** The institution identifies 3–5 "bright-line" rules (e.g., badge swiping, specific safety protocols, attendance timestamps) that are easy to measure and hard to argue with.
  3.  **Disproportionate Severity:** Violations of these Anchor Rules are punished more harshly than they would be in a healthy organization. In a healthy school, being 5 minutes late is a warning. In a school suffering Compensatory Rigidity, being 5 minutes late is a suspension. The severity is inflated to compensate for the fact that you can park your car on the lawn without consequence.

  ### Boundary Cases: What It Is Not

  *   **Rational Risk Triage:** If a hospital ignores dress code but savagely punishes hand-washing violations, that is not Compensatory Rigidity; that is rational risk management. The key differentiator is whether the enforced rules are **symbolic** vs. **substantive**. If the "Anchor Rules" are chosen because they protect the institution from liability or make it *look* controlled (e.g., ID badges) rather than because they protect core function, it is Compensatory Rigidity.
  *   **The "Rogue Manager":** If one boss is strict and others are loose, that is inconsistency. Compensatory Rigidity is a **systemic** pattern, usually mandated from the top or by HR/Policy, acknowledging that they cannot manage the whole ecosystem.

  ### Stability: Is it an Equilibrium?

  **No. Compensatory Rigidity is a terminal pathology, not a stable equilibrium.**

  It is a transitional mess on the way to full institutional decay (or radical restructuring). Here is why it is unstable:

  1.  **Cynicism Multiplier:** The disparity between the ignored rules and the punished rules highlights the arbitrariness of the power structure. It teaches members that rules are not about order or safety, but about submission. This erodes trust further.
  2.  **The "Speed Limit" Effect:** When enforcement is unpredictable (loose on 95%, strict on 5%), people stop trying to comply with the spirit of the rules and start gaming the letter of the Anchor Rules. Compliance becomes performative.
  3.  **Talent Flight:** High-functioning individuals tolerate "Loose" cultures (they get work done) and "Tight" cultures (they know where they stand). They do not tolerate Compensatory Rigidity, because it signals that leadership is reactive, anxious, and unmoored from reality.

  ### Verdict

  You have identified a specific organizational death spiral. While sociologists might file this under **pathological decoupling**, the precise dynamic is **Compensatory Rigidity**.

  It is the bureaucratic equivalent of a failing state that cannot collect taxes or fix potholes but maintains a brutal secret police. It is not a strategy for survival; it is a performance of control enacted by an institution that has already lost it.
