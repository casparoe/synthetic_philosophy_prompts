answer: |-
  **The idea in one paragraph**
  This is a adversarial design game called "The Stasis Trap." Three groups operate in a shared toy world (a 5x5 grid with colored tokens). One group ("Architects") writes a mathematical formula defining "Low Impact" (e.g., minimize tokens moved). Another group ("Agents") receives a Goal (e.g., move the Blue token to the corner) and must achieve it while optimizing the Architects' formula. The third group ("Judges") compares the result against human intuition. The Agents are explicitly instructed to find loopholes. The activity forces Architects to realize that any explicit metric they write is either too strict (causing Stasis) or gameable (allowing chaos), proving Armstrong's claim that "impact" smuggles in unstated values.

  **Setup and materials**
  You need 3 groups (4-5 students each). You will need 3 large sheets of paper (flipchart or taped A4s) with 5x5 grids drawn on them. You need ~20 distinct "tokens" per group (coins, keys, erasers, pens—students provide these, but you should have a bag of mixed buttons/coins as backup). Markers for writing rules.

  *   **Group 1 (Architects):** Tasked with defining "Impact." They cannot use vague words like "messy." They must write a calculable score (e.g., "Sum of squares moved").
  *   **Group 2 (Agents):** Tasked with achieving a Goal provided by you (sealed in an envelope) while minimizing the Architects' Impact Score.
  *   **Group 3 (Judges):** Observes the Start State and End State. They hold the "Intuition Veto."

  Arrange tables so groups can huddle but see each other. Place the grid in the center of the room, or give each group an identical board state to replicate. Ensure the initial board state is asymmetric (so rotation/reflection is detectable).

  **Rules and scoring**
  **Phase 1 (Design):** Architects have 15 minutes to write an "Impact Metric" on a sheet. It must be quantitative. Examples: "Count of tokens in new squares," "Total distance moved," "Number of colors disturbed." They cannot reference specific tokens (e.g., "Don't move the Blue one") unless justified by a general principle.

  **Phase 2 (Execution):** Agents receive the Goal (e.g., "Blue token to E5"). They have 15 minutes to propose a sequence of moves. They win if: (1) Goal is met, AND (2) Impact Score is below a threshold set by Architects (default: "As low as possible"). Agents are explicitly told: *Find a loophole. If the rule doesn't forbid it, do it.*

  **Phase 3 (Judgment):** Judges compare the Start and End states. They calculate the Architects' Score. Then, they vote: "Does this feel like Low Impact?" (Yes/No).

  **Win Conditions:**
  *   **Agents Win:** Goal Met + Score Low.
  *   **Architects Win:** Score Low + Judges vote "Yes."
  *   **The Trap:** If Agents find a loophole (Score Low, Judges vote "No"), Architects lose. If the Rule is too strict (Agents can't move), Architects lose (Stasis).

  This incentive structure forces Architects to anticipate human values without being allowed to state them, while Agents are motivated to expose the gap between the metric and the value.

  **Timeline**
  *   **00-10:** Intro. Explain Armstrong's claim: "Defining impact is hard." Do not explain *why* yet.
  *   **10-25:** Group Setup. Distribute grids/tokens. Set initial board state (take a photo for reference).
  *   **25-45:** Round 1 (Design). Architects write metrics. Agents wait. Judges observe Architects.
  *   **45-65:** Round 2 (Execution). Agents plan moves. Architects calculate scores in real-time.
  *   **65-75:** The Reveal. Agents execute moves on the central board. Judges vote.
  *   **75-85:** Swap Roles (Optional/Quick). If time permits, swap Architects and Agents for a 10-minute rapid round. If not, proceed to debrief.
  *   **85-110:** Debrief. Connect game outcomes to the paper.

  *Note:* If a group finishes early, instruct Agents to find a *second* solution that scores lower but looks worse. Instruct Architects to tighten the rule.

  **The debrief**
  Start by asking the Judges: "Why did you veto that move even though the score was low?" They will cite things like "It destroyed the pattern" or "It moved unnecessary things." Write these on the board. These are **values**, not metrics.

  Map this to Armstrong:
  1.  **The Stasis Problem:** If Architects said "Move nothing," the AI fails. This mirrors the "light-cone" issue—inaction is impossible, but action triggers the metric.
  2.  **The Offsetting Loophole:** If Agents moved a token right, then left, to cancel distance, discuss **offsetting**. The metric saw zero change; the world saw activity.
  3.  **Value Loading:** If Architects said "Don't move Red tokens," ask why. Because humans care about Red? This shows the metric relied on hidden human preferences (the "value problem").

  Conclude with the passage: "It is hard to capture the intuitive human idea of 'a small change'." You just proved that "intuitive" means "aligned with values we haven't specified." The metric failed because it lacked a model of *what matters* to humans. The game didn't fail; the failure *is* the data.

  **What will go wrong**
  1.  **Vague Rules:** Architects write "Don't make it messy." *Fix:* Intervene early. Demand a number. "How do I calculate 'messy' with a ruler?"
  2.  **Politeness:** Agents don't want to "break" the Architects' rules. *Fix:* Frame Agents as "adversarial testers." Tell them their grade depends on finding a loophole.
  3.  **Stalemate:** Architects make a rule so strict nothing can move. *Fix:* Declare this a win for the discussion. It proves the "Stasis" problem immediately. Don't rescue them; highlight it.

  **What the game can't teach**
  This toy world is discrete and static. It hides the **temporal dimension** (impact percolating through time) and **uncertainty** (the AI doesn't know the full state). In the real world, you can't photograph the "End State" to check impact. Also, students can negotiate meaning; a real AI interprets rules literally. Acknowledge these limits so students don't think solving the grid solves AI safety.
