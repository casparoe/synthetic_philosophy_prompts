answer: |-
  **MEMORANDUM**

  **TO:** Small-Grants Committee, Center for Experimental Philosophy
  **FROM:** [Your Name/Committee Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal #24-B: "Field Test of Superrational Reasoning"

  **BOTTOM LINE:**
  **Fund with Conditions.**

  The proposal is approved for the full $12,000 request, contingent on three specific methodological and ethical modifications: (1) the removal of the real-time entry counter; (2) the implementation of a pre-registered analysis plan that defines "superrational success" prior to data collection; and (3) enhanced informed consent disclosures regarding the quadratic decay of expected value.

  The committee is split because this project sits precisely on the fault line between normative decision theory and descriptive psychology. While the "Don't Fund" position raises valid concerns about falsifiability and participant economics, those concerns are manageable through design constraints. The "Fund" position is correct that we cannot adjudicate the viability of Functional Decision Theory (FDT) from the armchair forever. However, to fund this as currently designed would be to fund a stunt, not a study. The conditions below convert the stunt into a test.

  ***

  ### 1. The Philosophical Stakes: Engaging the Symmetry Argument

  The core hypothesis rests on Hofstadter's notion of *superrationality*: that identical rational agents, facing a symmetric payoff structure, should reason as though their decision logically determines the decision of all others. In this lottery, standard Causal Decision Theory (CDT) suggests entering if the expected value (EV) exceeds the $2 cost, treating other entrants as independent variables. Superrationality (aligned with Evidential or Functional Decision Theory) suggests treating one's own choice as evidence of the cohort's choice. If the cohort is truly "like-minded," entering causes (logically, not causally) others to enter, diluting the prize. Therefore, a superrational agent should enter with a low probability $p$, or abstain, to maintain a low total $N$ and a high prize $P$.

  **The Falsifiability Problem:**
  The strongest argument against funding is that the hypothesis is unfalsifiable. If $N$ is low, the student claims victory for superrationality. If $N$ is high, she can claim the population wasn't truly "like-minded" or rational enough to trigger the symmetry. This renders the theory immune to empirical refutation.

  **Resolution:**
  To make this count as evidence, we must pre-register a threshold for "failure." If the recruited population (self-selected from rationality forums) produces an $N$ statistically indistinguishable from a control group playing a standard fixed-prize lottery, the symmetry argument has failed *descriptively*. It may still be normatively true (i.e., how one *should* reason), but this experiment claims to test how reflective people *actually* choose. We must commit to publishing the result even if it suggests superrationality is merely a philosophical just-so story with no behavioral traction.

  ### 2. The Transparency Condition (The Crux)

  The committee is divided on whether to display a running count of entries. Half argue it is ethically required for transparency; half argue it destroys the coordination problem.

  **Decision:** **Do not display a running counter during the entry window.**

  **Reasoning:**
  The "Platonia Dilemma" relies on the condition of *symmetric ignorance*. Participants must make their decision based solely on the rules and their model of the other players. A live counter introduces asymmetric information over time. Early entrants see a low $N$; late entrants see a high $N$. This converts the game from a test of *a priori* symmetry reasoning into a test of information cascades and bandwagon effects. If participants can see $N$ rising, a CDT agent has a clear causal reason to abstain (prize dilution) that has nothing to do with superrational coordination.

  Hiding the counter preserves the experimental integrity. To address ethical concerns, the "transparency" must be shifted to the *rules*, not the *state*. The landing page must explicitly state: "You will not know the number of entrants until the lottery closes." This preserves the symmetry required to test the hypothesis while maintaining honesty about the information environment.

  ### 3. Ethical and Economic Constraints

  The "Don't Fund" coalition argues that the center profits only when participants reason "badly" (i.e., flood the entry), effectively running a fundraiser on participant confusion. The math supports this concern.

  *   **Participant EV:** $(1/N) \times ($50,000/N) = $50,000/N^2$.
  *   **Cost:** $2.
  *   **Break-even:** $N \approx 158$.

  If $N > 158$, the expected value for *every* participant drops below the entry fee. Simultaneously, the Center's revenue ($2N$) exceeds its liability ($50,000/N$). Thus, the Center's profit is perfectly correlated with the participants' negative EV. If the superrational hypothesis fails and the crowd floods in, the Center makes money while the participants collectively lose value.

  **Condition:**
  The informed consent form must explicitly state: *"If more than 160 people enter, the expected value of a ticket becomes less than the $2 cost. You are effectively donating to the Center if the crowd size exceeds this threshold."*

  Furthermore, to mitigate the appearance of predation, the proposal must include a clause that if $N$ exceeds 5,000 (where the prize drops to $10), the Center will cap entries or refund the differential to ensure the winner receives a minimum meaningful prize, or alternatively, commit any net profit from the study to a charity chosen by the participants. This aligns the Center's incentives with the participants' welfare, neutralizing the "profiting from confusion" objection.

  ***

  ### 4. Steelmanning the Opposition (Why We Might Be Wrong)

  I want to record the strongest version of the "Don't Fund" argument, as it will likely be cited if this study yields ambiguous results.

  The opposition contends that **superrationality is a normative claim, not a descriptive one.** Testing whether humans *do* act superrationally is a category error akin to testing whether humans *do* follow the laws of logic. Humans violate logic constantly; that does not falsify logic. Similarly, if humans fail to coordinate superrationally, it does not falsify the argument that they *should*. By treating a normative decision theory as an empirical hypothesis, the proposal risks conflating "rationality" with "human psychology."

  Additionally, the opposition argues that the "like-mindedness" premise is impossible to operationalize. Recruiting from "rationality forums" guarantees shared vocabulary, not shared decision algorithms. If the experiment fails (high $N$), the researcher can always retreat to the defense that "true superrationalists would have abstained, but these were merely people who read about it." This makes the study a potential reputational risk for the Center, appearing to monetize a philosophical puzzle without the rigor to resolve it.

  **Rebuttal:**
  While the normative/descriptive distinction is valid, Experimental Philosophy exists precisely to test where normative theories diverge from human intuition. If a decision theory cannot describe the behavior of the people most trained to understand it, its normative force is weakened. We are not testing the truth of superrationality; we are testing its *psychological reality*. That is a fundable question.

  ***

  ### 5. Summary of Required Modifications

  To release the funds, the Principal Investigator must submit a revised protocol confirming:

  1.  **No Live Counter:** The entry page will not display $N$ during the collection window.
  2.  **Pre-Registration:** A public registration (e.g., OSF) defining the $N$ threshold that would constitute evidence *against* the superrational hypothesis, preventing post-hoc rationalization.
  3.  **Enhanced Disclosure:** Consent forms must explicitly warn that EV drops quadratically and that entry beyond $N=160$ constitutes a net expected loss.
  4.  **Profit Cap:** A commitment that net profits from the study (if $N$ is high) will be donated to a participant-voted charity, removing the incentive for the Center to hope for participant "failure."

  This project has the potential to be a landmark in experimental philosophy, provided it does not devolve into a self-fulfilling prophecy. With these guards in place, we move from staging a paradox to testing a theory.

  **Approved.**
