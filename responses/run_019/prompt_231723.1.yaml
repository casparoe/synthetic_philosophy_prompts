answer: |-
  **Project Title:** Decoupling the Normative Grounds of the Unilateralist's Curse: Harm Reduction vs. Epistemic Respect

  **1. Research Question**
  The standard response to the unilateralist's curse is the Principle of Conformity (PoC): an agent should not initiate an action affecting a collective unless they believe a majority of relevant peers would also do so. This project asks: **To what extent do the harm-reduction and epistemic-respect rationales for the PoC diverge in cases of asymmetric stakes or normative misalignment, and how should institutional policy distinguish between them?**

  Specifically, I investigate whether the PoC functions as a single heuristic or as a conflation of two distinct normative jobs: (1) minimizing the expected disvalue of mistaken unilateral initiatives (consequentialist/harm-based), and (2) acknowledging the equal epistemic standing of other affected agents (deontological/epistemic-based).

  **2. Background and Limitations of Current Approaches**
  The unilateralist's curse arises when any member of a group can initiate an action that affects the whole, but the action is only beneficial if the group agrees (e.g., publishing sensitive dual-use research). The canonical solution, the Principle of Conformity, advises agents to estimate the likelihood that others would act and defer to the estimated majority.

  Current literature treats the PoC as a monolithic rule. Justifications typically oscillate between aggregating error probabilities (if I act alone, I am likely wrong because others disagree) and respecting peerhood (it is arrogant to assume I know better than the group). However, this conflation leaves critical edge cases unresolved.

  Standard answers leave the question open because they assume a correlation between epistemic competence, motivational alignment, and stake symmetry. They fail to provide guidance when:
  *   **Competence and Motivation Dissociate:** The group is epistemically competent regarding the facts but badly motivated regarding the values (e.g., a competent cartel or a siloed research team with perverse incentives).
  *   **Stake Asymmetry:** The cost of action is negligible for the agent but imposes catastrophic downstream costs on the group (e.g., a low-effort social media post that triggers institutional sanctions).

  In these scenarios, deferring to the "estimated majority" might satisfy epistemic respect while failing harm reduction, or vice versa. The current PoC offers no mechanism to prioritize one normative ground over the other.

  **3. Methodology: A Conceptual Approach**
  This project employs normative conceptual analysis rather than formal modeling or empirical study.

  A formal approach is ill-suited because the problem is not primarily probabilistic; it is axiological. Formal models of the unilateralist's curse typically encode the value of the outcome as a single variable, thereby baking in the conflation of harm and respect from the start. To separate them, we must first clarify the normative categories that would populate such a model.

  An empirical approach is premature. We cannot survey agents on their deference obligations until we have a coherent taxonomy of *when* deference is owed for reasons of safety versus reasons of respect.

  Conceptual progress is necessary to "carve nature at its joints." By rigorously distinguishing the *source* of the obligation to defer, we can determine whether the PoC is a single principle with two justifications or two distinct principles that merely overlap in standard cases. This involves thought experiments that isolate variables (e.g., holding epistemic competence constant while varying motivational alignment) to test the intuitive pull of the PoC.

  **4. Deliverable: A Normative Diagnostic Framework**
  The primary output will be a **Normative Diagnostic Framework for Unilateral Action**, designed for use by ethics boards, governance committees, and research safety officers.

  Unlike a abstract philosophical paper, this framework will be a actionable decision aid. It will consist of:
  1.  **A Stake Asymmetry Test:** A checklist to determine if the agent's costs are disproportionately lower than the collective's risks.
  2.  **A Motivation Alignment Audit:** Questions to assess whether the "relevant group" shares the normative goals of the broader institution or public.
  3.  **A Decision Matrix:** Guidance on when to apply strict conformity (high harm/aligned motives), when to allow unilateralism (low harm/misaligned motives), and when to escalate to higher authority (high harm/misaligned motives).

  This tool will allow policymakers to move beyond a blanket "ask for consensus" rule and instead tailor constraints based on whether the risk is primarily epistemic error or normative drift.

  **5. Conditions for Project Failure**
  This project will be considered to have failed if:
  1.  **The Distinction Collapses:** If analysis demonstrates that "epistemic respect" and "harm reduction" are inextricably linked in unilateralist scenarios (e.g., if respecting peers *just is* the best way to reduce harm in all conceivable cases), then the proposed decoupling is illusory.
  2.  **Inactionability:** If the resulting Diagnostic Framework is too complex or abstract for institutional actors to apply without philosophical training, it fails the practical deliverable requirement.
  3.  **No Normative Difference:** If the framework yields the same practical recommendations as the standard PoC in all high-stakes cases, the conceptual distinction, while perhaps theoretically interesting, lacks the practical utility required to justify the grant.
