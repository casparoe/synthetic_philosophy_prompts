answer: |-
  Dear Colleague,

  You have asked me to step into the role of the critic regarding your defense of the Bernoulli resolution to the St. Petersburg paradox, and I accept the task with the seriousness it deserves. You are confident that the appeal to expected utility theory, grounded in the diminishing marginal utility of wealth, dissolves the paradox by rendering the expected value of the game finite. You rely on Bernoulli's insight that a ducat means more to a poor man than to a rich man, and you take this psychological or normative fact to be the engine that stops the infinite regress of monetary value. While this is the standard textbook resolution, it is far from bulletproof, and there are several lines of attack that threaten to undermine it not merely as a complication but as a decisive falsification. I will lay these out for you in the order of their severity, beginning with the technical vulnerabilities and moving to the philosophical ones.

  The most immediate and technically decisive threat to your position comes from Karl Menger's critique, which targets the specific utility function Bernoulli proposed. You note that Bernoulli argued for diminishing marginal utility, typically modeled by a logarithmic function. The problem is that while the logarithm grows slowly, it is unbounded. It goes to infinity as wealth goes to infinity. Menger demonstrated that for any unbounded utility function, no matter how slowly it grows, one can construct a super-St. Petersburg game where the payoffs grow fast enough to make the expected utility infinite. If the payoffs are set to rise sufficiently steeply, say exponentially relative to the utility function's growth, the sum diverges once again. This means that Bernoulli's specific resolution does not solve the general class of St. Petersburg-like problems; it only solves the original historical formulation. To truly dissolve the paradox for all possible games, you must commit to a bounded utility function, one that asymptotes to a maximum value. But this raises a deeper normative question that you must face: is it rational to have a bounded utility function? Many philosophers and economists argue that rationality does not require boundedness. If an agent genuinely values each additional unit of some good, however small the increment, and there is no logical ceiling on the good, their utility function should be unbounded. If you concede that unbounded utility functions are permissible for rational agents, then the paradox returns for those agents, and your resolution fails to be universal. If you insist that rationality requires bounded utility, you owe an explanation for why a rational agent must satiate, which is a substantial normative claim far heavier than the original observation about diminishing marginal utility.

  This leads directly into the worry you mentioned about relabeling the problem. If the resolution to the paradox depends on stipulating that rational agents must have bounded utility functions simply to avoid infinite expectations, then expected utility theory risks becoming a mathematical trick rather than an explanation of rationality. The charge is that you are not explaining why we refuse to pay an infinite entry fee; you are merely defining rationality in such a way that the infinite fee becomes impossible. This connects to the distinction between descriptive and normative claims, which is where the standard resolution often hides its weaknesses. Bernoulli's original paper slides between describing how people actually feel about wealth and prescribing how they ought to calculate value. If your defense is descriptive, claiming that people in fact have bounded utility, you are vulnerable to empirical counterexamples where people behave as if their utility is unbounded, such as in certain high-stakes gambling behaviors or entrepreneurial risks. If your defense is normative, claiming that people ought to have bounded utility, you face the challenge of justifying that norm without circularity. You cannot simply say they ought to have bounded utility because otherwise the St. Petersburg paradox arises; that is arguing that the theory must be true because the alternative is inconvenient for the model. The resolution risks becoming a tautology where we infer the utility function from the choice to not play, and then use the utility function to explain the choice.

  You also asked about the observation regarding transcendent payoffs or small chances of infinite value, which echoes Pascal's Wager. This is a variant of the unbounded utility problem. If there is any non-zero probability of a payoff that is truly infinite in utility, expected utility theory dictates that a rational agent should pay any finite amount to secure it. The standard Bernoulli resolution handles this by assuming utility is bounded, thereby capping the value of any transcendent payoff. However, if you allow for the possibility of infinite utility outcomes, the mathematics of expected utility breaks down entirely, as standard real-valued functions cannot handle infinite expectations coherently. This suggests that the resolution is not robust against metaphysical or theological possibilities where payoffs are not just large but infinite. While you might dismiss this as irrelevant to practical decision theory, a theory of rationality that collapses in the face of infinite stakes is arguably incomplete, especially if the definition of rationality is supposed to be universal. The fact that the standard resolution must implicitly ban infinite utilities to function shows that it is not solving the problem of infinite expectations but rather assuming them away.

  Regarding your question on whether the position risks anything at all, I must be honest: the way expected utility theory is often defended insulates it from risk to a troubling degree. If utility is defined via revealed preference, meaning we know an agent's utility function only by observing their choices, then the claim that agents maximize expected utility is true by definition. In this framework, if an agent pays a million dollars to play the St. Petersburg game, the theorist simply says their utility function was flatter than we thought. If they refuse to pay ten dollars, the function is steeper. This makes the theory unfalsifiable. It risks nothing empirically because it can accommodate any behavior by adjusting the utility function. This lack of exposure is a significant problem for a claim that purports to describe rationality or guide decision-making. A theory that cannot be wrong tells us nothing about the world. For the Bernoulli resolution to have substantive content, utility must be measurable independently of the choices in question, perhaps through psychological metrics or neurological states. Bernoulli attempted this with his discussion of the poor man and the rich man, appealing to introspective plausibility. But modern decision theory often abandons this measurable foundation in favor of axiomatic consistency. If you retreat to the axiomatic defense, you save the theory from empirical refutation but leave it open to the charge that it is merely a consistency check on preferences, not a guide to what those preferences should be regarding the St. Petersburg game.

  So, which of these objections should move you? The Menger critique regarding super-St. Petersburg games is the most decisive technical blow to the specific Bernoulli proposal of logarithmic utility. It forces you to abandon diminishing marginal utility in favor of bounded utility if you want a general solution. The worry about the descriptive versus normative shift is the most decisive philosophical blow. If you cannot anchor the utility function in something independent of the choices it is meant to explain, your resolution is indeed a relabeling of the problem. You are saying rational people do not pay infinite money because they are rational, and we know they are rational because they do not pay infinite money. This circularity is the true vulnerability. The lack of exposure I mentioned earlier is itself a problem because it suggests the theory is not doing explanatory work. It organizes our intuitions but does not ground them. If you wish to defend the Bernoulli resolution honestly, you must concede that it requires a commitment to bounded utility functions as a normative requirement of rationality, and you must acknowledge that this commitment is not derived from the concept of utility itself but is imposed to save the theory from divergence. You must also accept that without independent measurement of utility, the resolution is formally robust but explanatorily empty. These are not mere complications; they are foundational cracks in the standard defense. I hope this map serves your seminar well, not to dismantle your position entirely, but to ensure it is fortified against the strongest available fire.
