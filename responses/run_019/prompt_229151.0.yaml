      *   *Check:* Common Knowledge definition. I need to explain the infinite regress briefly so the user understands why "telling each other" isn't enough.

  9.  **Final Polish:** Check against British English constraints. (e.g., "sanitise" -> "sanity-check" is fine, "modelled" vs "modeled", "programme" if used, "whilst"). Ensure the tone isn't too harsh on the friend, but firm on the maths.

