answer: |-
  Your scepticism is well-founded. While your friend has grasped the broad spirit of the result, his summary contains a significant technical error regarding the information structure, flattens a crucial definition (common knowledge), and conflates Aumann's original theorem with a later corollary regarding trade.

  Given that you are presenting this to a reading group, it is worth distinguishing between the mathematical theorem and the philosophical moral often drawn from it. Below is a claim-by-claim breakdown of where his summary holds water and where it leaks.

  ### 1. The Claim on Evidence and Posteriors
  **Friend's Claim:** *"If both are Bayesians and they update on the same evidence, their posteriors must coincide."*
  **Verdict:** **Incorrect.**

  This is the most serious error in his summary. If two agents update on the *same* evidence with the *same* priors, their posteriors must coincide by the basic axioms of probability theory. That is not Aumann's result; that is simply the definition of a function.

  **The Actual Theorem:** Aumann's insight (1976) is precisely that agents may have **different** private information (different partitions of the state space). The theorem states that if they have common priors, and their posterior probabilities for a given event are **common knowledge**, then those posteriors must be equal.

  **Why this matters:** The theorem is designed to address situations where people *have* seen different evidence. Your friend's gloss removes the very puzzle Aumann was solving. If everyone saw the same evidence, there would be no mystery as to why they agree.

  ### 2. The Claim on Persistent Disagreement
  **Friend's Claim:** *"Persistent disagreement between rational people is simply impossible."*
  **Verdict:** **Overstated / Misleading.**

  Disagreement is impossible *only if* the posteriors are common knowledge. In the real world, it is remarkably difficult to establish common knowledge. People can remain rational, Bayesian, share common priors, and still disagree because they do not know what the other person knows, or they do not know that the other person knows what they know.

  Furthermore, the theorem assumes logical omniscience (agents can compute all implications of their knowledge). If we relax the assumption of unbounded computational rationality, disagreement becomes possible again. So, while "persistent disagreement" is impossible under the strict axioms of the model, it is entirely possible for bounded rational agents.

  ### 3. The Claim on Common Knowledge
  **Friend's Claim:** *"The requirement of 'common knowledge'... just means that both agents know each other's estimates, i.e. that they've told each other what they believe."*
  **Verdict:** **Defensible Simplification (but technically wrong).**

  This is a common shorthand, but it conflates **mutual knowledge** with **common knowledge**.
  *   **Mutual Knowledge:** I know your belief, and you know my belief.
  *   **Common Knowledge:** I know your belief, you know my belief, I know that you know my belief, you know that I know your belief, *ad infinitum*.

  Merely telling each other your beliefs once establishes mutual knowledge, but not necessarily common knowledge. For the theorem to hold, the agreement must be common knowledge. In many formalisations, a public announcement can generate common knowledge, but only if the structure of the interaction ensures the infinite regress is satisfied. Flattening this distinction is dangerous because much of the subsequent literature (e.g., on email coordination games) focuses on how fragile common knowledge is. If it were as simple as "telling each other," the theorem would be far less profound.

  ### 4. The Claim on Markets and Trade
  **Friend's Claim:** *"This is why trade between rational agents can't happen... speculative markets are, strictly speaking, populated by irrational people."*
  **Verdict:** **Conflated Result / Strong Conclusion.**

  Your friend is muddling Aumann's "Agreeing to Disagree" (1976) with the **"No-Trade Theorem"** (Milgrom and Stokey, 1982).
  *   **Aumann (1976):** Concerns the agreement of probabilities.
  *   **Milgrom & Stokey (1982):** Apply similar logic to betting and trade. They argue that if agents have common priors and are risk-averse, no speculative trade (zero-sum bets) can occur because the very willingness to trade reveals private information that adjusts the odds until the trade is no longer attractive.

  **Is the conclusion fair?** Theoretically, yes: under strict Aumann-style assumptions, speculative trade should not occur. However, concluding that markets are *therefore* populated by irrational people is an empirical overreach. Economists generally resolve this paradox by relaxing the **Common Priors** assumption. If agents are allowed to have different priors (different "hunches" about the world before seeing evidence), trade becomes possible again even with common knowledge of posteriors. Most financial models assume heterogeneous priors to explain volume in markets.

  ### Summary of Corrections

  To present this accurately to your group, you might offer the following corrections to your friend's narrative:

  1.  **Different Information:** Emphasise that the agents in Aumann's theorem have *different* private information, not the same evidence. The miracle of the theorem is that despite different information, they cannot agree to disagree if they know each other's conclusions.
  2.  **Common Knowledge:** Clarify that "knowing each other's estimates" is insufficient. It must be *common* knowledge (the infinite hierarchy). This is a high bar that is rarely met in casual conversation.
  3.  **The Trade Corollary:** Attribute the market argument to Milgrom and Stokey rather than Aumann directly. Acknowledge that the "irrational markets" conclusion relies on the assumption of Common Priors, which is often dropped in practical finance to allow for speculative trade.

  ### A Careful Statement of the Theorem

  If you need a precise formulation for the group, it runs roughly as follows:

  > Consider two agents with a common prior probability distribution over a state space. Let their information be represented by partitions of this space. If the agents' posterior probabilities for a specific event $E$ are **common knowledge** between them, then those posterior probabilities must be identical.

  ### Does the Moral Survive?

  Does the conclusion that "disagreement is impossible" survive correction? **No.**
  Disagreement is possible if:
  1.  Posteriors are not common knowledge (which is the usual case).
  2.  Agents do not share common priors (a very standard relaxation in economics).
  3.  Agents are not logically omniscient (bounded rationality).

  Does the conclusion that "trade is impossible" survive? **Only conditionally.**
  It survives only if you insist on Common Priors. If you allow agents to start with different priors, rational speculative trade is perfectly consistent with Bayesian rationality. Therefore, claiming markets are populated by "irrational people" is not a necessary consequence of the theorem; it is a consequence of insisting on the Common Prior assumption in a context where it may not apply.

  ### Final Word

  Your friend is not "clueless," but he has presented a "folk theorem" version of the result—the sort of thing one might hear in a seminar hallway rather than read in the paper. It captures the vibe but misses the mechanics. For a reading group, it is worth pointing out that the distinction between *mutual* and *common* knowledge, and the allowance for *different* private information, are the actual engines that make the theorem work. Without those nuances, the result is trivial.
