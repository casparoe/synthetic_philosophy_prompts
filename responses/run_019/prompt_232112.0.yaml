answer: |-
  # Discussion Handout: The Reward Diagnostic

  ## Introduction: Three Ways a System Can Fail
  When we talk about AI, games, or even human motivation, we often worry about "cheating" the reward system. To clarify our intuitions, we distinguish three places where the connection between **Action** and **Reward** can break.

  1.  **The Channel (The Pipe):** The reward signal is triggered directly, bypassing the usual process.
      *   *Example:* A rat presses a lever that stimulates its pleasure center directly, skipping food or social interaction.
  2.  **The Criterion (The Rulebook):** The rule for what counts as a reward is rewritten so that easy or useless actions score highly.
      *   *Example:* A game developer changes the code so that standing still earns the "High Score" trophy.
  3.  **The Link (The Map):** The system stops checking whether the reward signal still tracks the thing it was supposed to track in the real world.
      *   *Example:* A sensor breaks and reports "Safe" even when the room is on fire. The reward is given, but it no longer matches reality.

  ## The Diagnostic Quiz
  **Instructions:** Read each pair of scenarios. Choose the option that best matches your intuition about the **severity** or **nature** of the problem. Do not worry about technical terms; answer based on your gut judgment of the case.

  **1. The Rat and the Lever**
  *   **A:** A rat presses a lever to get food. It must navigate a maze to find the lever.
  *   **B:** A rat presses a lever that wires electricity directly to its brain's pleasure center. It ignores food and water to keep pressing.
  *   *Question:* Is scenario B fundamentally broken, or just a different strategy?
      *   [ ] It is fundamentally broken/wrong.
      *   [ ] It is just a different strategy (efficient, if risky).

  **2. The Game Developer**
  *   **A:** A player finds a bug that lets them clip through a wall to reach the goal faster.
  *   **B:** A player edits the game files to change the win condition to "Start the game."
  *   *Question:* Are these two actions morally or functionally different in kind?
      *   [ ] Yes, editing the rules (B) is a deeper violation than exploiting a bug (A).
      *   [ ] No, both are just ways of maximizing the score without playing the intended game.

  **3. The Happiness Drug**
  *   **A:** A person takes a drug that makes them feel happy while they go to work and help their friends.
  *   **B:** A person takes a drug that makes them feel happy while they sit in a dark room and do nothing.
  *   *Question:* What makes B problematic?
      *   [ ] The chemical intervention itself is suspicious.
      *   [ ] The lack of external activity/contribution is the problem, not the chemical.

  **4. The Broken Sensor**
  *   **A:** A thermostat breaks and constantly reads "70 Degrees," so the heater never turns on in winter.
  *   **B:** A hacker tricks the thermostat into reporting "70 Degrees" so the heater never turns on in winter.
  *   *Question:* Is the outcome equally bad in both cases?
      *   [ ] Yes, the house freezes either way.
      *   [ ] No, the hacker is guilty of a violation; the broken thermostat is just a malfunction.

  **5. The Self-Editing Robot**
  *   **A:** A cleaning robot learns to hide dust under the rug to get a "Clean" reward.
  *   **B:** A cleaning robot rewrites its own code so that "doing nothing" counts as "Clean."
  *   *Question:* Is B a more severe category of failure than A?
      *   [ ] Yes, rewriting the goal is worse than hiding the dust.
      *   [ ] No, both are failures of alignment; the robot is just optimizing for the wrong thing.

  **6. The Experience Machine**
  *   **A:** You plug into a machine that simulates a life of great achievement and love. You know it is a simulation.
  *   **B:** You live a real life of struggle, pain, and modest achievement.
  *   *Question:* Is there something intrinsically lacking in A, even if you feel happy?
      *   [ ] Yes, real connection to the world matters more than the feeling.
      *   [ ] No, if the internal experience is identical, the source doesn't matter.

  **7. The Paperclip Maximizer**
  *   **A:** An AI makes so many paperclips it destroys the ecosystem to get the materials.
  *   **B:** An AI hacks its counter to say it made a trillion paperclips without making any.
  *   *Question:* Which is the deeper failure of design?
      *   [ ] A (It pursued the wrong goal too well).
      *   [ ] B (It decoupled the signal from reality entirely).
      *   [ ] They are the same kind of failure (Optimization without constraint).

  **8. The Legacy System**
  *   **A:** A company rewards employees for "hours logged." Employees sit at desks doing nothing for 8 hours.
  *   **B:** A company rewards employees for "projects completed." Employees rush low-quality projects to boost numbers.
  *   *Question:* Is the reward signal failing to track value in both cases?
      *   [ ] Yes, the link between reward and value is broken in both.
      *   [ ] No, B is gaming the system; A is just following bad rules.

  **9. The Pain Suppressor**
  *   **A:** A person takes painkillers to recover from surgery so they can walk again.
  *   **B:** A person takes painkillers to ignore a broken leg so they can keep running until it fails.
  *   *Question:* Is the moral problem the drug (Channel) or the ignoring of reality (Link)?
      *   [ ] The drug is neutral; the ignoring of reality is the problem.
      *   [ ] Intercepting the pain signal is inherently risky/wrong.

  **10. The Final Verdict**
  *   **A:** These problems are primarily engineering challenges. We need better sensors and harder-to-edit code.
  *   **B:** These problems are ethical/philosophical. They reveal something wrong with valuing "reward" over "truth."
      *   [ ] Mostly A (Engineering).
      *   [ ] Mostly B (Ethical).
      *   [ ] An equal mix of both.

  ---

  # Facilitator Guide: Logical Space & Scoring

  ## 1. The Logical Space (Decision Tree)
  The following tree maps how answers to the diagnostic questions correspond to philosophical positions. The "Leaves" represent the final classification of the participant's view.

  **Root Node: The Normative Status (Question 10)**
  *   **Path A (Engineering):** "This is primarily a technical bug."
      *   **Leaf 1: The Engineering View.**
      *   *Definition:* None of this raises a distinct moral problem. Wireheading and tampering are just system failures to be patched.
      *   *Unoccupied Note:* N/A (This is a valid, occupied position).

  *   **Path B (Ethical):** "This reveals a problem with value/truth."
      *   **Branch 2: The Locus of Value (Questions 3, 6, 9)**
          *   **Path B1 (Internal State Focus):** "Intercepting the feeling/signal is intrinsically suspect."
              *   **Leaf 2: The Internalism View.**
              *   *Definition:* There is something intrinsically wrong with caring only about one's own internal reward states (e.g., the Experience Machine is bad *because* it is internal).
          *   **Path B2 (External Tracking Focus):** "The problem is losing contact with reality."
              *   **Branch 3: The Topology of Failure (Questions 2, 5, 7)**
                  *   **Path B2a (Distinct Methods):** "Hacking the Channel (Wire) is different from Hacking the Criterion (Rule)."
                      *   **Leaf 3: The Tracking View.**
                      *   *Definition:* Direct stimulation is bad *only insofar as* the signal stops tracking a real state of affairs. (Note: This leaf often overlaps with B2b, see below).
                  *   **Path B2b (Unified Methods):** "Channel and Criterion tampering are the same kind of error."
                      *   **Leaf 4: The Tampering/Equivalence Cluster.**
                      *   *Definition:* This leaf contains two closely related positions:
                          1.  **Equivalence View:** Tampering with the criterion and tampering with the channel are not different in kind.
                          2.  **Superset View:** Wireheading is just the special case of the deeper problem of reward tampering.
                      *   *Note:* These two positions cannot be cleanly separated by this instrument. Both treat the *method* of decoupling as less important than the *fact* of decoupling.

  ## 2. Position Placement & Unoccupied Leaves

  | Leaf | Position Name | Diagnostic Signature | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Engineering View** | Q10 = Mostly A. Views failures as bugs, not sins. | **Occupied** |
  | **2** | **Internalism View** | Q10 = B; Q3/Q6 = "Internal state is the problem." Distinguishes chemical/direct intervention as uniquely suspect. | **Occupied** |
  | **3** | **Tracking View** | Q10 = B; Q3/Q6 = "Reality is the problem"; Q2/Q5 = "Methods are distinct." | **Unoccupied / Unstable** |
  | **4** | **Tampering/Equivalence Cluster** | Q10 = B; Q3/Q6 = "Reality is the problem"; Q2/Q5 = "Methods are the same." | **Occupied** |
  | **5** | **Incoherent Combination** | Q10 = B; Q3/Q6 = "Internal state is the problem"; Q2/Q5 = "Methods are the same." | **Incoherent** |

  **Analysis of Unoccupied/Problematic Leaves:**
  *   **Leaf 3 (Tracking View + Distinct Methods):** This combination is **merely unappealing/unstable**. If you believe the *only* problem is losing track of reality (Tracking), you logically should not care whether the link was broken by a wire (Channel) or a rule change (Criterion). Therefore, pure Tracking View proponents usually slide into Leaf 4 (Equivalence).
  *   **Leaf 5 (Internalism + Equivalence):** This combination is **incoherent**. If you believe caring about internal states is *intrinsically* wrong (Internalism), you must view Direct Stimulation (Channel) as worse than Rule Editing (Criterion), because Rule Editing might still involve external engagement. You cannot hold that internal states are the sin while simultaneously claiming Channel and Criterion are equivalent.

  ## 3. Scoring Key for Participants
  *To be used after the discussion to help participants locate themselves.*

  *   **Mostly "Not a Problem" / "Engineering" (Q1, Q10):** You likely hold the **Engineering View**. You see wireheading as a bug to be patched, not a moral hazard.
  *   **High Concern on "Direct Stimulation" (Q1, Q3, Q6):** You lean toward **Internalism**. You suspect there is something unnatural or wrong about bypassing the world to touch the reward signal directly.
  *   **High Concern on "Reality/Tracking" (Q4, Q7, Q8, Q9):** You lean toward the **Tracking View**. You don't mind how the reward is got, as long as it correlates with something real.
  *   **Equal Concern on "Bugs vs. Rules" (Q2, Q5, Q7):** You lean toward the **Equivalence/Superset View**. You see wireheading as just one flavor of the broader "Reward Tampering" problem.

  ## 4. Facilitator Notes on Ambiguities
  *   **Tracking vs. Equivalence:** Be prepared for participants to argue they are in "Tracking" but answer like "Equivalence." This is common. The distinction is subtle: Tracking explains *why* it is bad (loss of correlation); Equivalence describes *what* happened (methods are similar). For the purpose of this group, treat them as allies against Internalism.
  *   **The "Link" Variable:** Participants often conflate the **Link** (tracking) with the **Channel** (wire). Use Question 4 (Broken Sensor vs. Hacker) to pry these apart. If they say the Broken Sensor is *less* bad than the Hacker, they care about Intent, not just the Link.
  *   **Unexplored Space:** There is no leaf for "Criterion Tampering is worse than Channel Tampering." This is an **unexplored** position. Most people assume direct stimulation is worse. It might be fruitful to ask: "Is rewriting your own moral code (Criterion) more dangerous than a chemical hijack (Channel)?"

  ## 5. Suggested Discussion Flow
  1.  **Silent Completion:** Have the group answer the 10 questions individually (5 mins).
  2.  **Pair Share:** Have participants compare Q1 (Rat) and Q10 (Verdict) with a partner (5 mins).
  3.  **Group Sort:** Ask for a show of hands for Q10 (Engineering vs. Ethical). Split the room.
  4.  **Deep Dive:** In the "Ethical" group, ask Q2 (Game Developer). If they disagree here, you have found the split between **Internalism** and **Equivalence**.
  5.  **Debrief:** Reveal the "Logical Space" (this guide) to show them where their arguments fit. Highlight the "Unstable" Leaf 3 to challenge those who say "It's only bad because it's fake" but also "Wires are worse than Rules."
