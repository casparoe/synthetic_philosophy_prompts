answer: |-
  Here is a draft syllabus note for the session, structured as a set of necessary conditions for any physicalist ethics, followed by an analysis of their mutual compatibility.

  ### Desiderata for Fundamental Physical Ethics

  Any theory attempting to ground moral patiency in the fundamental furniture of the universe must satisfy the following conditions. Each is marked as either **Non-Negotiable** (the theory fails as ethics or physics without it) or **Contestable** (reasonable philosophers might prioritise differently).

  1.  **The Phenomenal Baseline**
      *   **Case:** The theory must recover standard intuitions in paradigm cases: a waking human in pain is a patient; a human under deep anaesthesia or a rock is not.
      *   **Motivation:** If a theory cannot distinguish between a screaming child and a burning log without special pleading, it fails as a guide to action.
      *   **Status:** **Non-Negotiable**.

  2.  **The Description Invariance Constraint**
      *   **Case:** Moral status must not depend on the observer's choice of coarse-graining or coordinate system.
      *   **Motivation:** Physics allows multiple valid descriptions of the same system (e.g., micro vs. macro, different reference frames). If moral status fluctuates based on how we choose to model the world, morality becomes observer-relative rather than intrinsic.
      *   **Status:** **Non-Negotiable**.

  3.  **The Valence Distinction**
      *   **Case:** The theory must distinguish the *presence* of experience from its *normative quality* (good/bad).
      *   **Motivation:** A criterion might successfully locate sentience everywhere (panexperientialism) but fail to locate suffering anywhere. Ethics requires a vector, not just a scalar magnitude of existence.
      *   **Status:** **Non-Negotiable**.

  4.  **The Subject Demarcation Requirement**
      *   **Case:** The theory must specify where one subject ends and another begins (the combination problem).
      *   **Motivation:** Moral claims are typically made *by* and *for* subjects. If micro-experiences do not compose into macro-subjects, or if boundaries are vague, we cannot identify who is suffering.
      *   **Status:** **Non-Negotiable**.

  5.  **The Aggregation Scalability**
      *   **Case:** The theory must provide a principled way to handle vast disparities in moral weight across scales (e.g., stars vs. humans).
      *   **Motivation:** If fundamental processes carry moral weight, cosmic entities may outweigh biological ones by orders of magnitude. The theory must state whether this is a feature (cosmic utilitarianism) or a bug (reductio ad absurdum).
      *   **Status:** **Contestable** (Some may accept the horrifying margin; others will reject the theory that demands it).

  6.  **The Causal Relevance Condition**
      *   **Case:** Experiential properties must not be epiphenomenal; they must play a role in the causal structure we describe.
      *   **Motivation:** If experience is causally closed off, we could have no knowledge of it, rendering the theory unknowable. Furthermore, if suffering does not cause avoidance, its moral urgency is obscure.
      *   **Status:** **Non-Negotiable**.

  7.  **The Normative Bridge**
      *   **Case:** The theory must explain why a physical property (e.g., entropy, integration) entails a normative obligation.
      *   **Motivation:** Physics describes what *is*; ethics prescribes what *ought* to be. Deriving value directly from physical quantities risks the naturalistic fallacy unless the bridge is explicitly built.
      *   **Status:** **Non-Negotiable**.

  ### Tensions and Incompatibilities

  It must be stated plainly: **no existing theory satisfies this list in its entirety.** The desiderata form a network of constraints that appear jointly unsatisfiable under current physical and metaphysical understanding.

  The most severe tension lies between **The Description Invariance Constraint** and **The Subject Demarcation Requirement**. Fundamental physics is typically scale-invariant or level-neutral; it does not privilege the "subject" level. However, defining a subject usually requires drawing a boundary around a specific level of complexity or integration. If subjects emerge only at certain scales of coarse-graining, moral status becomes description-relative, violating Invariance. If subjects are fundamental, we lack a physical account of how they combine, violating Demarcation.

  Regarding the question of which single requirement knocks out the most candidates actually defended: **The Subject Demarcation Requirement** is the historical graveyard of panpsychism. Most integration-based theories (such as Integrated Information Theory) offer a mathematical measure of consciousness but struggle to explain why *this* specific integration constitutes a *single* moral subject rather than a collection of smaller ones. They solve the "where" of consciousness but not the "who" of patiency.

  ### Brief Theory Assessment

  **The Thermodynamic Criterion:** This view fares well on **The Valence Distinction**, as entropy production offers a clear directional vector for suffering versus equilibrium. It also handles **The Causal Relevance Condition** robustly, as entropy is causally potent. However, it collapses under **The Aggregation Scalability** constraint; unless one is prepared to prioritise the suffering of stars over humans, the moral weights become unmanageable. It also struggles with **The Normative Bridge**, as it remains unclear why entropy production is intrinsically bad rather than merely physically irreversible.

  **Standard Integration/Complexity Panpsychism:** These theories perform better on **The Subject Demarcation Requirement**, using causal boundaries to define subjects. They also manage **The Phenomenal Baseline** reasonably well by tying status to complex systems like brains. However, they frequently violate **The Description Invariance Constraint**, as integration measures often depend on the grain of analysis chosen by the observer. They also face difficulties with **The Normative Bridge**, as high integration does not obviously entail moral worth without further argument.

  ### Conclusion

  If we treat this list as a filter, the result is elimination. The demand that moral status be both fundamental (Invariant) and subject-specific (Demarcated) whilst remaining knowable (Causal Relevance) creates a trilemma that current physicalist ethics cannot resolve. We are forced to choose which intuition to sacrifice.

  \answer{The Description Invariance Constraint}
