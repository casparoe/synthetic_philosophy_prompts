      *   *Candidate 3 (Conceptual Tautology/Explanatory Power):* If entitlement failure is just a restatement of "people couldn't buy food," does it add value over FAD when FAD causes the price spike? If production shocks drive entitlement failure, is the distinction meaningful? This attacks the theoretical utility.
      *   *Candidate 4 (Hedging the Democracy Claim):* If Sen defines "functioning democracy" as "one that doesn't have famines," the claim is unfalsifiable. This attacks the logical rigor.
