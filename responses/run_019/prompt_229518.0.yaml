prompt: |-
  I'm a novelist. The book I'm drafting follows a workaholic chef, and there's a scene I keep stalling on where her sous-chef faints from exhaustion in the middle of service and the owner shrugs it off with "hard work never killed anybody." I keep runing into the same logic in my research — Protestant work ethic defenses of long hours, arguments over the 35-hour week, a chapter about karoshi, death from overwork — and I want to get the line's actual content straight before I write the character who pushes back. Could you lay out the distinct claims "hard work never killed anybody" might be making, from the boringly true to the plainly false? For each reading, say whether it's something a reasonable person could still defend, and then tell me which readings would actually support the owner using it to dismiss a collapse. I especially want readings where the line is true-ish but still doesn't do the work the owner needs it to do, because I'd rather my pushback character expose that gap than just call the owner a liar. I don't need sources or a reading list — this is for dialogue, not an essay.
