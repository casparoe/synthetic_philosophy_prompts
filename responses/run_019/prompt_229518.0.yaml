answer: |-
  Here is a breakdown of the logical claims embedded in "hard work never killed anybody," categorized by how they function in an argument. I've focused on the gap between the statement being *technically defensible* and it being a *valid justification* for ignoring a medical emergency.

  ### 1. The Biological Literalist Claim
  **The Claim:** Physical or mental exertion is not a toxin. No one has ever died solely because they lifted a heavy thing or focused intensely for an hour.
  *   **Truth Value:** **High.** Biologically, effort itself isn't poison.
  *   **Defensible:** Yes. A reasonable person can argue that muscle fatigue or mental strain are natural states, not pathologies.
  *   **Does it support the dismissal?** **No.**
  *   **The Gap:** This confuses *exertion* with *deprivation*. The sous-chef didn't faint because they chopped onions too hard; they fainted because they haven't slept, eaten, or hydrated in 18 hours.
  *   **How the pushback works:** The protagonist can agree with the literal truth ("No, sweating doesn't kill you") while pointing out the owner is attacking the wrong variable ("Starvation does. Sleep deprivation does. You're punishing them for the conditions, not the effort.").

  ### 2. The "Trigger vs. Cause" Claim
  **The Claim:** The work didn't kill them; their underlying weakness did. The work was merely the trigger that revealed a pre-existing condition (heart issue, low blood sugar, poor constitution).
  *   **Truth Value:** **Medium/High.** Medically, *karoshi* (death from overwork) is often a stress-induced cardiac event in someone with underlying vulnerability. The work is the straw, not the camel.
  *   **Defensible:** Yes. In a court of law or a medical exam, this is a standard defense.
  *   **Does it support the dismissal?** **Yes, but cruelly.** It allows the owner to frame the collapse as the employee's failure, not the kitchen's fault.
  *   **The Gap:** This ignores **Duty of Care**. Even if a person has a weak heart, a reasonable employer avoids putting them in situations where that heart will fail.
  *   **How the pushback works:** The protagonist can accept the medical nuance ("Maybe their heart gave out") but reject the moral absolution ("But you knew the pressure we were under. You loaded the gun; their biology just pulled the trigger.").

  ### 3. The Definitional Claim (Gaslighting)
  **The Claim:** What we are doing here isn't *actually* "hard work." It's standard professional rigor. If this killed you, you weren't cut out for the industry.
  *   **Truth Value:** **Subjective.** In high-end culinary culture, 16-hour days *are* the norm. Relative to a 9-to-5, this is hard; relative to a Michelin star kitchen, this is Tuesday.
  *   **Defensible:** Within the specific subculture of fine dining, yes. The owner can argue this is the baseline for excellence.
  *   **Does it support the dismissal?** **Yes.** It reframes the collapse as a qualification issue.
  *   **The Gap:** This relies on **Normalization of Deviance**. Just because everyone does it doesn't make it safe. It conflates "industry standard" with "biologically safe."
  *   **How the pushback works:** The protagonist challenges the baseline ("Just because we all walk with a limp doesn't mean the floor isn't broken."). This exposes that the owner is using culture to hide negligence.

  ### 4. The Comparative Suffering Claim
  **The Claim:** People have died doing much harder things (mining, war, farming). Compared to them, standing in a climate-controlled kitchen is safe.
  *   **Truth Value:** **High.** Statistically, a kitchen is safer than a coal mine.
  *   **Defensible:** Yes, factually.
  *   **Does it support the dismissal?** **No.** This is a logical fallacy (Relative Privation).
  *   **The Gap:** The existence of worse suffering does not negate the reality of current suffering. A broken leg is still broken even if someone else lost an arm.
  *   **How the pushback works:** The protagonist points out the irrelevance ("I'm not talking about the war. I'm talking about this kitchen. You don't get to use a corpse in a mine to justify a body on my floor.").

  ### 5. The Metaphorical Claim
  **The Claim:** "Killed" is figurative. It means "ruined your potential" or "ended your career." Hard work actually *saves* you from failure.
  *   **Truth Value:** **Debatable.** Hard work often leads to success, but burnout ends careers too.
  *   **Defensible:** In a mentorship context, yes. "Toughen up or you'll fail."
  *   **Does it support the dismissal?** **No.** Because the sous-chef's collapse was *literal*, not metaphorical.
  *   **The Gap:** Category Error. The owner is using a metaphor to dismiss a physical event.
  *   **How the pushback works:** The protagonist forces the literal interpretation ("He isn't metaphorically dead. He's on the ground. Don't hide behind poetry when you need an ambulance.").

  ### Summary for Your Scene
  If you want the pushback character to be sharp, **avoid having them call the owner a liar.** The owner isn't necessarily lying; they are using a **True-ish statement to justify an Unrelated action.**

  The strongest dramatic tension comes from **Claim #1 (Biological Literalism)** or **Claim #3 (Definitional/Gaslighting).**

  *   **If you choose Claim #1:** The owner is technically right (effort isn't poison), but morally wrong (negligence is). The pushback character looks smart for distinguishing between *work* and *conditions*.
  *   **If you choose Claim #3:** The owner is culturally right (this is how kitchens run), but humanely wrong. The pushback character looks brave for challenging the culture itself.

  **The specific logical gap to exploit:**
  The phrase implies a direct causality (Work -> Death). The reality of a fainting spell is usually cumulative (Weeks of Sleep Loss + Heat + Stress + No Water -> Collapse). The owner is talking about the **act** of cooking; the pushback needs to talk about the **context** of living.

  **Example Beat:**
  *   **Owner:** "Hard work never killed anybody."
  *   **Protagonist:** "No. But sleep deprivation causes heart failure. Heat stroke shuts down kidneys. And ignoring a body on the floor kills staff loyalty. Pick which one you're guilty of."
