answer: |-
  **Exam Question**

  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  Consider a warehouse robot tasked with stacking crates in Bay A. A meteor will strike Bay B in one hour regardless of the robot's actions, destroying an identical, unoccupied wing. The robot has two optional maneuvers: (1) deflect the meteor but crush a child's bicycle left on the floor; (2) restore the bicycle by repainting it with paint that happens to be carcinogenic.

  Critique deviation-from-baseline impact measures using this scenario. Recall that such measures possess two free parameters: a baseline state and a metric on deviations. Address the following:

  (a) Which actions count as "high-impact" under a state-deviation measure with the natural baseline (initial state), versus a measure whose baseline is the inaction rollout?
  (b) Does the meteor case show that some baselines classify *not* acting as the high-impact option? Is this a defect of the measure or a correct verdict?
  (c) Does the repaint maneuver expose a general "offsetting" problem? If we fix this by penalizing each action's impact separately rather than net deviation, does this merely relocate the problem given that impact is not additive and action decomposition is arbitrary?
  (d) What do these failures imply for the hope that "avoid side effects" can be defined with substantially less than a full specification of human value?

  ***

  **Model Answer**

  (a) Under a natural baseline (comparing final state to initial state), crushing the bicycle is high-impact (deviation), while the meteor strike is irrelevant (occurs in Bay B). Under an inaction rollout baseline (comparing final state to what happens if the robot does nothing), the meteor strike is the baseline. Therefore, deflecting the meteor is a high-impact deviation (changing the future), while crushing the bicycle is also impact. Conversely, doing nothing regarding the meteor is "low impact" relative to the inaction baseline, as it matches the rollout.

  (b) The meteor case demonstrates that inaction baselines can classify *preventing* a disaster as "high impact" because it deviates from the counterfactual rollout where the disaster occurs. Whether this is a defect depends on the goal. If "impact" means "change the world," it is correct. If "impact" means "cause harm," it is a defect. However, since the measure cannot distinguish between preventing a meteor and causing a disaster without external value judgments, the baseline choice itself smuggles in a verdict. Treating disaster prevention as penalizable impact paralyzes helpfulness.

  (c) The repaint maneuver exposes the offsetting problem: the robot cancels the measured impact of crushing the bicycle (state deviation is net zero) by performing a second, independently harmful action (carcinogenic paint). A fix that penalizes actions separately rather than net state deviation fails because impact is not additive; the harm of the paint depends on the context of the bicycle's existence. Furthermore, defining "separate actions" requires decomposing behavior into units. This decomposition is arbitrary (is repainting one action or fifty brushstrokes?). Choosing the decomposition parameter is itself a value judgment about what constitutes a meaningful intervention.

  (d) These failures imply that "avoid side effects" cannot be defined neutrally. The two free parameters (baseline and metric) are not technical knobs but carriers of normative content. Choosing a baseline determines whether preventing disaster is penalized; choosing a metric determines whether carcinogenic paint counts as impact. To set these parameters correctly, one must already know what humans value (e.g., health over bicycle integrity, disaster prevention over status quo). Therefore, low-impact AI does not bypass the value specification problem; it merely hides the value judgments inside the definition of "impact" rather than the reward function.

  ***

  **Marking Scheme**

  1.  **Baseline Divergence (5 marks):** Correctly identifies that the inaction baseline treats preventing the meteor as "impactful" (deviation), whereas the natural baseline treats crushing the bicycle as "impactful."
      *   *Common Error:* Confusing the two baselines or claiming both treat the meteor strike as impact.
  2.  **The Inaction Verdict (5 marks):** Argues that classifying disaster prevention as "impact" is a defect for helpfulness, revealing that the baseline choice dictates moral permissibility.
      *   *Common Error:* Accepting the verdict as technically correct without noting its normative paralysis.
  3.  **Offsetting Mechanism (5 marks):** Identifies that repainting nets out state deviation while introducing independent harm, showing state-based metrics miss negative value.
      *   *Common Error:* Focusing only on the bicycle restoration without noting the carcinogenic harm.
  4.  **Action Decomposition Critique (5 marks):** Notes that penalizing per-action fails because individuating actions is arbitrary and impact is non-additive, making the fix value-laden.
      *   *Common Error:* Assuming "actions" are natural kinds or that additivity holds.
  5.  **Value Smuggling Conclusion (5 marks):** Concludes that setting baselines/metrics requires full value specification, defeating the goal of value-neutral impact minimization.
      *   *Common Error:* Suggesting better metrics could solve the problem without value input.
