answer: |-
  ### Part 1: Brainstorming Dependencies & Misconceptions

  Before we lock in the lesson flow, we need to map the conceptual terrain. Lewontin's argument is a *reductio* on the interpretation of ANOVA, not the math itself. If the students don't grasp the statistical prerequisites, the philosophical point will bounce off.

  **The Dependency Structure (The "Must-Haves"):**
  1.  **Variance $\neq$ Mean:** Students must understand that we are talking about *differences between individuals*, not the average level of the trait. (e.g., Everyone getting taller doesn't change variance).
  2.  **Population Specificity:** They must accept that statistics describe a group, not an individual.
  3.  **The Ratio:** Heritability ($h^2$) is $V_G / V_P$. If the denominator ($V_P$) changes because $V_E$ changes, the ratio changes, even if $V_G$ stays constant.
  4.  **Causation vs. Variation:** This is the philosophical pivot. They must distinguish between "What causes the trait to exist?" (Development) vs. "What causes the trait to *vary*?" (ANOVA).

  **Predictable Misconceptions (The "Blockers"):**
  1.  **The Individual Fallacy:** "If $h^2 = 0.8$, 80% of *my* height is genes." (Category error: Variance applies to populations, not individuals).
  2.  **The Immutability Fallacy:** "High $h^2$ means the environment can't change the trait." (Confuses variation with plasticity/norms of reaction).
  3.  **The Causal Weight Fallacy:** "High $h^2$ means genes are 'more important' than environment." (Confuses variance contribution with developmental necessity).
  4.  **The Fixed Trait Fallacy:** "Heritability is a property of the trait (like 'height is heritable'), not the population." (Misses the sampling dependency).

  ---

  ### Part 2: The Concrete Example Strategy

  **Recommendation:** Stick with **Lewontin's Seed Lots**, but simplify the visualization.
  *Why:* Human examples (height, IQ) carry too much baggage. Students will fight the politics rather than the logic. Seeds allow you to control $V_G$ and $V_E$ perfectly, which is necessary for the *reductio*.
  *What it needs:* Two distinct genotypes (Lot A, Lot B) and two distinct environments (Soil 1, Soil 2).
  *What it must lack:* Gene-Environment Correlation (rGE). Do not let students worry about "smart parents picking good schools." Keep G and E independent for this session to isolate the variance logic.

  **Visualization Tip:** Do not use equations on the board initially. Use **box plots**.
  *   X-axis: Environment (Poor Soil, Rich Soil)
  *   Y-axis: Height
  *   Boxes: Distribution of heights for Lot A and Lot B.

  ---

  ### Part 3: Session Plan (60 Minutes)

  **0:00–0:10: The Hook & The Trap (Diagnosis)**
  *   **Activity:** Write two questions on the board. Ask for a show of hands.
      1.  "Is human height genetic?" (Everyone says yes).
      2.  "If we measure heritability of height in Population X and get 0.8, does that mean changing the environment won't make them taller?" (Most will hesitate or say yes).
  *   **Goal:** Expose the intuition that $h^2$ implies immutability or causal weight. Tell them: "By the end of this hour, you will see why that intuition is mathematically impossible."

  **0:10–0:20: The Definitions (Prerequisites)**
  *   **Lecture (Brief):** Define $V_P = V_G + V_E$. Define $h^2 = V_G / V_P$.
  *   **Crucial Distinction:** Emphasize that $V$ stands for *Variance* (spread), not *Value* (level).
  *   **Check:** Ask: "If I give every single plant a miracle fertilizer and they all grow 10cm taller, does $V_E$ change?" (Answer: No, the *mean* changed, the *variance* didn't).
  *   **Why:** This heads off the Immutability Fallacy early.

  **0:20–0:40: The Seed Lot Walkthrough (The Core)**
  *   **Step 1 (Uniform Soil):** Imagine we plant Lot A and Lot B in *perfectly identical* soil cups. $V_E = 0$. Therefore $V_P = V_G$. **$h^2 = 1.0$.**
      *   *Ask:* "Are genes the only cause of growth?" (No, they need water/soil). "So why is $h^2$ 1.0?" (Because environment didn't *vary*).
  *   **Step 2 (Uniform Seed):** Imagine we clone *only* Lot A, but plant them in wildly different soils. $V_G = 0$. Therefore $V_P = V_E$. **$h^2 = 0.0$.**
      *   *Ask:* "Did the genes stop mattering for growth?" (No). "So why is $h^2$ 0.0?" (Because genes didn't *vary*).
  *   **Step 3 (Lewontin's Move):** Now, the kicker. Two fields.
      *   Field 1: Soil quality is uniform. (High $h^2$).
      *   Field 2: Soil quality varies wildly (some patches toxic, some rich). ($V_E$ goes up, so $h^2$ goes down).
      *   *Point:* The biology of the corn is identical in Field 1 and Field 2. The *heritability estimate* is different.
  *   **Discussion:** "If $h^2$ changes without the biology changing, can $h^2$ measure 'how genetic' the trait is?"

  **0:40–0:50: The Philosophical Payoff**
  *   Connect back to the intro questions.
  *   Explain the **Causal Fallacy**: ANOVA partitions *variation*, not *causation*.
  *   Analogy: "Asking how much variance is due to genes is like asking 'How much of the area of a rectangle is due to the length vs. the width?' It depends on which rectangles you sample, not the geometry."

  **0:50–1:00: Assessment & Wrap**
  *   Administer the Final Question (see below).
  *   Collect responses.

  ---

  ### Part 4: Misconception Map

  | Misconception | When to Head It Off | How to Address It |
  | :--- | :--- | :--- |
  | **"Heritability applies to me."** (Individual Fallacy) | **0:10–0:20 (Definitions)** | Explicitly state: "Heritability is a property of a *population*, like 'average income'. You cannot have an 'average income' as one person." Use the phrase: **"It describes the differences, not the individual."** |
  | **"High $h^2$ means environment can't change the trait."** (Immutability) | **0:20 (Step 1 of Seed Lots)** | When $h^2=1.0$ in uniform soil, ask: "If I stop watering them, do they die?" Yes. "So environment matters?" Yes. "Then why is $h^2$ 1.0?" Because we held environment *constant*. Distinguish **Development** (needs both) from **Variation** (needs difference). |
  | **"Genes cause variation, Environment causes the level."** (Causal Split) | **0:40 (Philosophical Payoff)** | Use the Rectangle Analogy. Area = Length $\times$ Width. Variation in Area can be 100% due to Length if Width is constant. But Area is still *caused* by both. |
  | **"Heritability is fixed for a trait."** (Fixed Trait) | **0:20 (Step 3 of Seed Lots)** | Emphasize the Field 1 vs. Field 2 comparison. Same corn, different $h^2$. Write on board: **$h^2$ is context-dependent.** |

  ---

  ### Part 5: Scope Boundaries (What to Refuse)

  As a PhD student, you will be tempted to show off nuance. **Don't.** It muddies the water for a 60-minute philosophy section.

  1.  **Refuse Broad-sense vs. Narrow-sense ($H^2$ vs $h^2$):**
      *   *Why:* Additive vs. Dominance variance is irrelevant to Lewontin's logical point about variance decomposition.
      *   *Script:* "For today, 'Genetic Variance' means all genetic differences. We aren't distinguishing additive from dominance effects."
  2.  **Refuse Gene-Environment Correlation (rGE):**
      *   *Why:* Students will ask, "But don't rich parents give good genes AND good schools?"
      *   *Script:* "That is a real-world complication, but Lewontin's point holds even if G and E are perfectly independent. Let's solve the logic puzzle before adding the messiness."
  3.  **Refuse Human Policy/Eugenics Debates:**
      *   *Why:* It triggers emotional responses that shut down logical processing.
      *   *Script:* "We are analyzing the logic of the statistic today. We can discuss the policy implications once the math is clear, but let's not assume the application yet."
  4.  **Refuse Molecular Mechanisms:**
      *   *Why:* Don't let them drift into "But what about epigenetics?"
      *   *Script:* "Epigenetics is fascinating, but Lewontin's argument works even if genetics is purely Mendelian. It's a statistical argument, not a molecular one."

  ---

  ### Part 6: The Final Assessment Question

  Do not ask them to define heritability. Ask them to apply the **Population Specificity** insight to a novel scenario.

  **The Question (Last 10 Minutes):**
  > "Imagine we measure the heritability of 'Math Test Scores' in two different countries.
  >
  > *   **Country A:** Every school has identical funding, teacher quality, and resources.
  > *   **Country B:** Schools range from severely underfunded to elite private academies.
  >
  > Assuming the genetic makeup of the students is similar in both countries, **in which country will the heritability estimate be higher?** Explain why, without using the word 'genes' as a noun."

  **What to look for in their answers:**
  *   **Correct:** Country A. Because $V_E$ (environmental variance) is lower in A, the proportion of variance due to genetics ($V_G/V_P$) must be higher, even if the biological effect of genes is identical.
  *   **Incorrect:** Country B (thinking more environmental difference makes it more heritable) or "They are the same" (thinking $h^2$ is a fixed property of math ability).
  *   **The "No Noun" Constraint:** Forcing them to avoid the word "genes" prevents them from sloganizing ("It's more genetic in A"). They must talk about *variance* and *differences*.

  **Why this works:** It tests if they understand that $h^2$ is a ratio dependent on the denominator ($V_P$), and that $V_P$ is determined by the sampling of environments, not just the biology. If they get this, they have understood Lewontin.
