  *(Refining the "Concrete Example")*: The prompt asks "Which single concrete example should I carry through... and what does it need to have and lack?" I need to be decisive here. Lewontin's seeds are the text, but do they work for 2nd years? Yes, if simplified. Human height is tempting but dangerous. I will recommend the Seed Lots but *gamify* it or visualize it heavily. Actually, a "Clone Garden" analogy might be clearer. Let's stick to the Seeds but ensure the *soil variation* is the variable they manipulate mentally.

  *(Refining the Final Question)*: It needs to distinguish between "I understand the math" and "I understand the philosophical implication." A question about a policy intervention based on $h^2$ is good. E.g., "If $h^2$ is high, should we fix genes or environment?"

