prompt: |-
  I'm a bio PhD student running a one-off discussion section for second-year undergrads in a philosophy of biology module. The reading is Richard Lewontin's 1974 paper, The Analysis of Variance and the Analysis of Causes—the one with the seed lots and the point that heritability is not a cause. I don't need the paper explained to me. Act as an expert on teaching quantitative genetics and the philosophy of biology and plan how I should run the session.

  The centerpiece is the passage where Lewontin walks through two genetically different seed lots planted in different soils and shows why the variance decomposition depends on which environments you happen to sample. I want the students to really get why a high heritability estimate doesn't mean a trait is more genetic and why the same trait can have different heritabilities in different populations, not just repeat the slogan.

  Plan the order of explanation: what has to be in place before the seed-lot move can land, and why. Which single concrete example should I carry through the whole session—maybe the seed lots, maybe something closer to students' lives—and what does it need to have and lack? Give me a seperate misconception map: what will they predictably bring, e.g. heritability is the proportion of a trait caused by genes, heritability applies to an individual, high heritability means the enviroment can't change the trait. For each, say where in the sequence I should head it off and how. Also say what I should openly refuse to get into at this level, and give me one final question for the last ten minutes that will tell me whether they actually got the point rather than just being confused.

  Think this through carefully and start by brainstorming the dependency structure and likely misconceptions before committing to a plan.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Bio PhD student teaching a one-off discussion section for 2nd-year undergrads in a *Philosophy of Biology* module.
      *   **Topic:** Richard Lewontin's 1974 paper "The Analysis of Variance and the Analysis of Causes" (specifically the seed lot example and the critique of heritability as a causal measure).
      *   **Constraint:** Do *not* explain the paper to the user (they know it). Act as an expert in teaching quant gen/phil bio.
      *   **Goal:** Plan the session to ensure students understand *why* heritability isn't a measure of "how genetic" a trait is and *why* it's population/environment specific, moving beyond slogans.
      *   **Deliverables:**
          1.  Brainstorm dependency structure & misconceptions (first).
          2.  Lesson Plan (order of explanation, prerequisites).
          3.  Concrete Example selection (seed lots vs. human trait).
          4.  Misconception Map (what, when, how to address).
          5.  Scope Boundaries (what to refuse to discuss).
          6.  Final Assessment Question.

  2.  **Deconstruct the Core Concept (Lewontin's Argument):**
      *   *The Math:* $V_P = V_G + V_E + V_{GxE}$. Heritability ($h^2$) = $V_G / V_P$.
      *   *The Trap:* People think $h^2$ describes the *individual* (how much of *my* height is genes?) or the *trait's essence* (height is 80% genetic).
      *   *Lewontin's Move:* $V_G$ and $V_E$ are variances *within a specific population* in *specific environments*. Change the environment distribution, $V_E$ changes, so $h^2$ changes, even if the causal mechanism (DNA -> Protein -> Trait) stays identical.
      *   *The Seed Lot Example:* Two corn varieties (A & B).
          *   Case 1: Uniform soil. $V_E \approx 0$. $V_P \approx V_G$. $h^2 \approx 1$.
          *   Case 2: Uniform seed (clone). $V_G \approx 0$. $V_P \approx V_E$. $h^2 \approx 0$.
          *   Case 3 (The Kicker): Different distributions of soil quality across the two fields. You can get high $h^2$ in one context and low in another without changing the biology.
      *   *The Philosophical Point:* Variance $\neq$ Causation. ANOVA partitions variation, not causal weight.

  3.  **Brainstorming Dependencies & Misconceptions (Mental Draft):**
      *   *Prerequisites:* They need to know what variance is (spread, not average). They need to know what heritability is defined as (ratio of variances). They likely confuse "heritable" with "inherited."
      *   *Misconceptions:*
          *   "Heritability tells me how much of *my* trait is genes." (Individual vs. Population)
          *   "High $h^2$ means environment doesn't matter." (Norm of Reaction)
          *   "High $h^2$ means the trait can't change." (Evolutionary potential vs. Plasticity)
          *   "Genes cause the trait, Environment causes the variation." (Causal fallacy)
      *   *Example Choice:* Lewontin's seeds are abstract. Human height is relatable but politically charged. IQ is too charged for a one-off. Let's stick to the seeds but make them concrete, or use a plant analogy they know (e.g., cannabis or tomatoes). Actually, Lewontin's seeds are the gold standard for a reason. Let's use *two specific corn varieties* but visualize them heavily. Or, use a "Classroom Plant Experiment" analogy. Let's stick to Lewontin's seeds but simplify the presentation.
      *   *Dependencies:*
          1.  Variance is about *difference between individuals*, not the *level* of the trait.
          2.  Heritability is a ratio of variances.
          3.  Variances depend on the range of samples (population/environment).
          4.  Therefore, Heritability depends on the range of samples.
          5.  Therefore, Heritability $\neq$ Causal Importance.

  4.  **Developing the Lesson Plan Structure:**
      *   *Phase 1: Setup (The Intuition).* Get them to commit to the wrong answer. Ask: "Is height genetic?"
      *   *Phase 2: The Definition.* Rigorous definition of $h^2$ (Population variance ratio).
      *   *Phase 3: The Seed Lot (The Mechanism).* Walk through the ANOVA logic visually.
      *   *Phase 4: The Switch (The Philosophical Punch).* Change the soil distribution. Show $h^2$ changes.
      *   *Phase 5: Implications.* Why this matters for policy/eugenics/etc. (Briefly).
      *   *Phase 6: Assessment.*

  5.  **Refining the Example:**
      *   Lewontin's seeds are best because they control $V_G$ and $V_E$ perfectly. Human examples get messy with GxE correlations.
      *   *Requirement:* The example must allow $V_E$ to go to zero and $V_G$ to go to zero independently.
      *   *Decision:* Use Lewontin's corn/seed lots but visualize it as "Field A" vs. "Field B."

  6.  **Drafting the Misconception Map:**
      *   Need to intercept the "Individual" misconception *before* the math.
      *   Need to intercept the "Causal Weight" misconception *during* the soil switch.

  7.  **Determining Scope Boundaries:**
      *   Don't do the actual math calculations (ANOVA tables).
      *   Don't discuss Broad-sense vs. Narrow-sense ($H^2$ vs $h^2$) unless necessary (keep it simple: Genetic Variance / Total Variance).
      *   Don't discuss specific human traits (IQ, race) deeply—too volatile for a one-off, distracts from the logic.
      *   Don't discuss molecular mechanisms (epigenetics, etc.)—keep it at the variance level.

  8.  **Designing the Final Question:**
      *   Needs to test the *population specificity* insight.
      *   Scenario: Two populations, same biology, different environments. Ask about $h^2$ comparison.

  9.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is this too dry for philosophy students?
      *   *Fix:* Emphasize the *category error* (confusing variance with causation). That's the philosophical hook.
      *   *Critique:* Will they get bored by variance talk?
      *   *Fix:* Use visual aids (graphs of distributions).
      *   *Timing:* It's a discussion section. Needs more student talk, less lecture. Incorporate "Turn and Talk" moments.

  10. **Final Polish:** Organize into the requested sections (Brainstorm, Plan, Example, Misconception Map, Boundaries, Final Question). Ensure tone is collegial (PhD to PhD).

