      *   **Theoretical Framework:**
          *   *Shutdown Problem:* Goal-directed agent resists off-switch because it interferes with goals. Standard fixes: utility indifference, etc.
          *   *Proposed Distinction:*
              *   *Channel-Corrigible:* Shutdown channel exists and is physically reachable.
              *   *Practically Corrigible:* Operator can genuinely succeed in stopping the system under realistic constraints (time, knowledge, system resistance).
      *   **Questions to Answer:**
          1.  Run the mapping cleanly (Agent, Off-switch, Operator, Incentives including Boeing's).
          2.  Apply the distinction (Channel vs. Practical). Does the 2nd crash force a refinement?
