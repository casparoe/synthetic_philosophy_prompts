  This is a delightful puzzle, one that cuts to the heart of the tension between Aristotelian metaphysics and the practical realities of commerce. Your friend is applying a rigorous, text-based hermeneutic to modern economics, which means her verdicts are likely driven by specific ontological distinctions in *Politics* Book I rather than modern intuitions about efficiency or legality.

  To predict her call on the maritime loan (historically known as *foenus nauticum*), we must isolate the specific criteria she is using to distinguish "natural" from "unnatural" acquisition. Based on her track record, I have identified two candidate principles. Both are fully consistent with her six prior verdicts, but they yield opposite conclusions on the test case.

  ### Candidate Principle 1: The "Sterility of Money" Doctrine (Metaphysical)
  **The Rule:** Money is by nature a medium of exchange, not a source of generation. Any transaction where the primary mechanism of profit is the passage of time on a sum of money—regardless of risk conditions—is unnatural. Legitimate gain must arise from labor applied to nature (farming) or skill applied to human need (surgery), not from the ownership of capital itself.

  *   **Consistency with Record:**
      *   **Bank/Shopkeeper/Speculator/Thales:** All condemned because profit is derived from capital positions, contracts, or ownership rights rather than direct labor or production. The Speculator is condemned specifically for "never touching a sack," highlighting the sin of detachment from the physical good.
      *   **Farmer/Surgeon:** Approved because profit is tied to physical labor (farming) or technical skill (surgery), not mere capital allocation.
  *   **Prediction for Maritime Loan:** **Objectionable.**
  *   **Reasoning:** Under this rule, the risk element is a distraction. The investor is still advancing money to receive more money. The fact that he might lose the principal does not change the nature of the transaction: he is treating money as a seed (*tokos* means "offspring" in Greek). Since he does not labor on the goods or touch the cargo, he is engaging in the "breeding of money," which Aristotle calls the most hated form of acquisition.

  ### Candidate Principle 2: The "Recourse and Exploitation" Doctrine (Moral/Social)
  **The Rule:** Unnatural acquisition is defined by the *exploitation of necessity* through the *guarantee of return*. A transaction is objectionable if the lender secures profit regardless of the borrower's fortune (shifting all risk to the borrower). A transaction is acceptable if the "lender" shares in the physical risk of the venture, transforming the loan into a partnership or insurance contract where profit is contingent on the successful preservation of the goods.

  *   **Consistency with Record:**
      *   **Bank:** Condemned because the borrower owes regardless of their ability to pay (certain return for lender).
      *   **Speculator:** Condemned because he locks in a price with the farmer (shifting price risk to the farmer) without adding value.
      *   **Thales:** Condemned because he exploited the farmers' necessity by monopolizing the presses (certain rent regardless of yield).
      *   **Maritime Loan (Potential):** Distinct from the Bank because the investor loses everything if the ship sinks. The merchant owes *nothing*. The investor is not "breeding" money; he is selling the service of risk-absorption.
  *   **Prediction for Maritime Loan:** **Unobjectionable.**
  *   **Reasoning:** This principle views the premium not as interest (*tokos*), but as a wage for risk-bearing (*insurance*). Since the investor's fortune is tied to the physical fate of the cargo (unlike the Banker), he is not detached from the reality of the goods. He is a partner in the venture, similar to how a surgeon is a partner in the patient's health.

  ### My Best Prediction

  I predict your friend will rule the maritime loan **Objectionable**.

  **Reasoning:**
  While the "Recourse" principle (Principle 2) is historically how later jurists (Roman and Canon lawyers) circumvented usury bans, your friend is described as applying *Aristotle's* discussion in *Politics* I. Aristotle's argument there is metaphysical, not legal. He does not argue that usury is bad because it is risky for the borrower; he argues it is bad because it is *unnatural for money*.

  The deciding factor in her record is the verdict on the **Grain Speculator**. The speculator bears risk (the price might drop), yet she condemned him. Her specific justification was that he "never touch[ed] a sack of it." This reveals that for her, **physical engagement with the use-value of the good** is the necessary condition for legitimate acquisition. Risk-sharing alone is insufficient if the actor remains detached from the physical goods.

  In the maritime case, the investor, like the speculator, never touches the cargo. He is betting on the price differential and the safe arrival of goods he does not handle. To an Aristotelian purist, this is still money breeding money, merely disguised by the contingency of shipwreck. The "service" of risk-bearing is not a *technē* (skill) like surgery, nor is it production like farming; it is a financial abstraction.

  **Closest Analog:**
  The **Grain Speculator** is the closest analog.
  *   **Why:** Both the speculator and the investor profit from the movement/value of goods without physically handling them. Both involve a contract where the return is monetary, not the good itself. The speculator was condemned for detachment ("never touching a sack"); the investor is equally detached. The Bank is a secondary analog, but the Speculator case proves that even when risk is involved (price risk), detachment from the physical good is fatal to the moral validity of the transaction.

  ### A Decisive Hypothetical

  While I am confident in this prediction, her record does contain a tension between her hatred of *trade* (Shopkeeper) and her acceptance of *service* (Surgeon). To settle definitively whether she objects to **Finance** (money making money) or **Trade** (buying to sell), I would put this case to her:

  **The Hypothetical:**
  > "An investor provides seed corn and tools to a subsistence farming household (who feed themselves and sell only genuine surplus) on the exact same terms as the maritime loan: if the harvest fails due to weather, the investor loses everything and the farmer owes nothing; if the harvest succeeds, the investor receives the principal plus a share of the surplus."

  **Why this settles it:**
  *   If she rules this **Unobjectionable**, it proves she follows the **"Natural End" Principle**: Finance is acceptable if it serves natural acquisition (farming), but not unnatural acquisition (trade). This would suggest she *might* have excused the maritime loan if she viewed overseas trade as necessary provision rather than profit-seeking.
  *   If she rules this **Objectionable**, it confirms the **"Sterility of Money" Principle**: Any return on capital is unnatural, regardless of the risk or the virtue of the borrower. This would confirm my prediction that the maritime loan is condemned because money itself is being treated as generative.

  Given her condemnation of the Speculator for physical detachment, I suspect she would condemn this farming investment too, sealing the verdict against the maritime investor.
