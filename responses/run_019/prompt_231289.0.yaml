prompt: |-
  I've recently ended up on the board of a small global-health foundation that funds malaria, deworming, and maternal health programs, and there's a deal on the table I can't stop chewing over. A church-based health network with genuinely deep reach in rural areas has offered to carry our malaria and deworming programs, on the condition that all the maternal-health materials co-branded with them drop any mention of contraception and instead include a short page promoting natural family planning, which their church supports. Half the board sees this as a no-brainer: we get bednets and deworming pills to communities we otherwise can't reach, and they get materials their volunteers are comfortable distributing. The other half thinks we'd be lending our name to a family-planning message we don't believe and which we think is worse for women, and that taking the deal makes us complicit in pushing it. Draft the short decision memo I can bring to the board: recommend approve, reject, or approve with conditions, give reasons the losing side can actually respond to, and end with a clear actionable bottom line.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small global-health foundation.
      *   **Context:** Funding malaria, deworming, and maternal health programs.
      *   **The Deal:** A church-based health network offers distribution reach for malaria/deworming.
      *   **The Condition:** Maternal health materials co-branded with them must remove mentions of contraception and include a page promoting Natural Family Planning (NFP).
      *   **The Conflict:** Half the board wants to accept (reach/impact); half wants to reject (complicity/mission drift/harm to women).
      *   **Task:** Draft a short decision memo.
      *   **Requirements:** Recommend a course of action (Approve, Reject, or Approve with Conditions), provide reasons the losing side can respond to (respectful, evidence-based, principled), and end with a clear actionable bottom line.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Risks mission drift, alienates donors/partners who support comprehensive reproductive health, potentially harms beneficiaries by withholding info on contraception (which is often medically superior to NFP for spacing in high-risk contexts).
      *   *Option B: Reject.* Loses significant reach for malaria/deworming (high-impact interventions). Might be seen as inflexible or ideological.
      *   *Option C: Approve with Conditions.* This is usually the most nuanced path in global health partnerships. It allows the high-impact malaria/deworming work to proceed while mitigating the risks associated with the maternal health messaging.
      *   *Decision:* **Approve with Conditions.** This balances the utilitarian benefit (saving lives via malaria/deworming) with the deontological/mission constraint (not actively promoting misinformation or restricting access to critical health info). It acknowledges the reality of local partnerships without surrendering core values.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Recommendation:** State the decision clearly upfront.
      *   **Context:** Briefly summarize the deal.
      *   **Analysis (The "Why"):** Address both sides of the board argument.
          *   *For the "Reach" side:* Acknowledge the value of malaria/deworming.
          *   *For the "Mission" side:* Acknowledge the risk of misinformation and brand association.
      *   **Proposed Conditions:** How to mitigate the risks.
      *   **Bottom Line:** Actionable next steps.

  4.  **Drafting - Content & Tone:**
      *   *Tone:* Professional, objective, empathetic to both sides, decisive.
      *   *Addressing the "Reach" Side:* Validate that malaria/deworming are high-impact. Acknowledge that perfect is the enemy of good. *Counter:* But we can't sacrifice core maternal health standards.
      *   *Addressing the "Mission" Side:* Validate that contraception is evidence-based and NFP has higher failure rates. Acknowledge the risk of complicity. *Counter:* But walking away leaves the communities with *no* support from us at all.
      *   *The Compromise (Conditions):*
          1.  Separation of programs (Malaria/Deworming vs. Maternal Health).
          2.  Disclaimer on materials (clarifying foundation's stance vs. partner's stance).
          3.  Referral pathway (if women ask about contraception, they aren't turned away).
          4.  Sunset clause/Review.

