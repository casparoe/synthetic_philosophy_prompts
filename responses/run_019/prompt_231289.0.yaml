      *   Instead of saying "We need reach," say "The cost-per-life-saved for malaria interventions in this network is significantly lower than alternative channels."
      *   Instead of saying "Don't do it," say "We can ring-fence the maternal health messaging to protect our brand integrity."

  6.  **Developing the Conditions (Crucial Step):**
      *   *Condition 1: Program Segmentation.* Malaria/Deworming proceeds. Maternal Health materials need negotiation.
