      *   *Revised Condition:* We fund the malaria/deworming. For maternal health, we fund *unbranded* materials or materials that meet our medical standards, even if the church distributes them. Or, we withdraw maternal health funding from this specific partnership but keep the vector control.
      *   *Wait, the prompt says:* "Maternal-health materials co-branded with them drop any mention of contraception... and include a short page promoting NFP."
      *   *My Recommendation:* **Approve the Malaria/Deworming partnership. Reject the Co-Branded Maternal Health condition.**
