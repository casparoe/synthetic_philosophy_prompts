answer: |-
  I appreciate the shift to the medical case. It's sharper than the depleted resources example because the harm is concentrated and visceral, not diffuse and intergenerational. It's designed to make the "no harm" conclusion taste like ash.

  But I'm not going to bite the bullet that the parent did something *wrong to the child*. I'll say this: if the choice is necessary for *this* child to exist, and the child's life is worth living, then the child has no legitimate complaint against the parent. None.

  Now, I know your instinct is to scream that obviously the parent acted wrongly. But I think you're smuggling in a comparison that isn't available in this specific metaphysical setup. You're imagining the parent choosing between *this* child with a condition and *this* child without it. But that's not the choice. The choice is between *this* child with a condition and *no child at all* (or a numerically different child).

  If I say the parent didn't wrong the child, you call that crazy. But consider what "wronging" means. It usually implies violating a right or setting back an interest relative to a baseline where that right wasn't violated. What's the baseline here? A world where this child exists without the condition? That world is impossible given the stipulations. You can't have a duty to bring about a state of affairs that is metaphysically inaccessible for the person you're supposedly owing the duty to.

  So, to answer your horns: I deny the act is wrong *in the person-affecting sense*. If you want to say it's "wrong" in some impersonal sense—like it makes the universe slightly less elegant or violates a rule of virtuous character—fine, but that's a different kind of wrongness. It's the kind of wrongness that doesn't generate a claim for compensation, doesn't ground resentment from the child, and doesn't look like a rights violation. (Though I should note, the claim that wrongs *must* be person-affecting is obviously contested; impersonal utilitarians and some deontologists would fight me there, but they lose the grip on *who* is wronged).

  Here's the real pressure point for you: If you insist the parent wronged the child, what remedy does the child have? Do they deserve compensation? From whom? If the parent didn't make them worse off than they would otherwise be, what is the compensation *for*? Existing? You can't compensate someone for existing by paying them, because the alternative wasn't existing richly; it was not existing.

  So I'll stick to my line: The intuition that this is wrong is a heuristic error. We're applying same-person moral rules to a different-person case. The parent didn't wrong the child. They made a choice that resulted in a child with a condition, yes, but not a child who was *harmed* by the choice in the comparative sense required for victimhood. (And yes, I know non-comparative accounts of harm exist that would call this harm, but those accounts struggle to explain why harm matters morally if it doesn't make you worse off than your alternative).

  So I take the first horn. The parent did nothing wrong *to the child*. Does that really seem impossible to you, or just uncomfortable?
