  **Subject:** David, an ordinary adult office worker.
  **Proposition ($p$):** "Sam's phone number is 555-0199."
  **Situation:** David needs to call Sam. He has lost his phone's contact list due to a software glitch. However, he has called Sam frequently enough over the past five years that he has memorized the number. He retrieves the number from memory and dials.
  **The Catch:** David knows that when he first got Sam's number years ago, he wrote it on a napkin that was crumpled and hard to read. He has always worried that he might have misread a digit back then and memorized the error. In reality, he read it correctly, and his memory has preserved it accurately.

  ### The Check

  **1. The Proposition ($p$)**
  "That Sam's phone number is 555-0199."

  **2. The Method**
  Semantic memory retrieval (long-term retention of a fact learned via perception).

  **3. Why David Counts as Knowing $p$ ($Kp$)**
  We assume a standard **Externalist** (Reliabilist) account of knowledge, which is the framework where KK counterexamples typically arise.
  *   **Truth:** The number is indeed 555-0199.
  *   **Belief:** David believes this is the number.
  *   **Justification/Reliability:** Human memory, for well-rehearsed facts like a frequently used phone number, is a highly reliable cognitive process. The causal chain from Sam giving the number $\rightarrow$ David perceiving it $\rightarrow$ David memorizing it $\rightarrow$ David recalling it is unbroken and reliable.
  *   **Verdict:** David knows $p$. The fact that he *could* have misread the napkin is a irrelevant alternative; in the actual world, the process worked.

  **4. Why David Cannot Know That He Knows $p$ ($\neg KKp$)**
  To know that he knows, David must be in a position to rule out the relevant possibilities where he believes $p$ but does *not* know $p$.
  *   **The Defeater:** David possesses specific evidence that his original source (the napkin) was ambiguous. He cannot currently access the original source to verify it.
  *   **The Second-Order Gap:** To know $KKp$, David needs to know that his memory is not preserving a mistake from the initial encoding. Because he lacks access to the original source (the napkin is lost) and lacks independent confirmation (he hasn't called Sam yet in this scenario), he cannot internally verify that his belief is safe.
  *   **Verdict:** He is not in a position to affirm the reliability of this specific belief instance. He knows $p$, but he cannot know *that* his belief meets the standards of knowledge, because he cannot rule out the "misread napkin" scenario from his current perspective.

  **5. Which Nearby Worlds Matter**
  *   **For $Kp$ (First-Order):** We look at worlds where the **memory process** fails. In nearby worlds where David's memory is functioning normally (which is most of them), he gets the number right. The worlds where he misread the napkin years ago are **distant** because, as a matter of fact, he read it correctly. The reliability of the actual process secures $Kp$.
  *   **For $KKp$ (Second-Order):** We look at worlds where David **believes he knows** but is wrong. From David's perspective, the world where he misread the napkin is **epistemically nearby**. He cannot distinguish the actual world (read correctly) from the nearby error-world (read incorrectly) using only his current internal resources. Because he cannot rule out this nearby world, he cannot know $KKp$.

  ### Luminosity and Mental States

  This case commits you to denying the **luminosity of knowledge**. A mental state is "luminous" if, whenever you are in it, you are in a position to know you are in it.
  *   **The Denial:** David is in the state of *knowing* ($Kp$), but he is *not* in a position to know he is in that state ($\neg KKp$).
  *   **Why:** This suggests that knowledge is not solely determined by internal factors accessible to the subject. If knowledge were luminous (purely internal), David's internal perspective would be identical in the "knowing" case and the "not knowing" case, or he would be able to tell the difference. The case shows that the factivity of knowledge (the world cooperating with your belief) can obtain without your ability to detect that cooperation. It supports the view (championed by Timothy Williamson) that knowledge is a non-luminous mental state because margins for error in self-assessment prevent perfect access.

  ### The Defender's Rebuttal

  **What a Defender of KK Would Say:**
  A defender of the KK principle (typically an **Internalist**) would block the case by denying the first verdict. They would argue:
  > "If David cannot rule out the possibility that he misread the napkin, then he does not have sufficient justification to claim he *knows* the number in the first place. He merely has a true belief with high confidence. Therefore, $Kp$ is false, and the counterexample collapses."

  **The Single Feature Doing the Work:**
  The critical feature is **Externalist Reliability without Internal Access**.
  *   **What happens if you remove it?** If you require Internal Access for $Kp$ (making first-order knowledge require the same level of certainty as second-order knowledge), then David doesn't know $p$ to begin with. The gap between $Kp$ and $KKp$ vanishes because the standards for both are raised to the level of reflective access. The counterexample only works if you accept that one can know something via a reliable process even if one cannot reflectively verify that the process is reliable.
