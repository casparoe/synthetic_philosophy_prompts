answer: |-
  You press me with a scepticism most sharp, sir, and I confess the circle appears tight if we view it as a matter of logic alone. But pray, consider it as a matter of fact. I do not begin by decreeing Homer excellent and then seeking men to agree; rather, I observe that men of refined faculties, across centuries and nations, *do* agree, and I infer the excellence from this durable admiration. The qualifications of the true judge—delicacy, practice, freedom from prejudice—are not mere masks for my own preference. They are faculties testable in smaller matters, much like the wine tasters in Sancho Panza's court who detected the leather and the iron in the cask. One may verify a man's delicacy before ever asking his opinion on the epic poet.

  It is true that few possess these organs in perfection, and fewer still keep them unclouded by the humours of the day. Yet, when such men converge upon a work, their verdict carries the weight of human nature itself, not merely the fashion of Edinburgh or London. If you find Homer tedious, I do not say your sentiment is false regarding your own pleasure; but I must ask whether your attention is perfected by comparison, or whether you read him in a humour unfit for his manner. The standard is not my whim, nor yours, but the general voice of humanity, refined by time and stripped of local accident. To deny this is to deny that there is any health of the mind any more than there is health of the body.
