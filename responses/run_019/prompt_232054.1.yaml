answer: |-
  # Question-Period Prep Sheet
  **Workshop:** Human Behavioral Biology  
  **Thesis:** Adaptationism is methodologically sound *if* three conditions are met (Independent Regime, Risky Prediction, *A Priori* Rivals). Current EP fails on practice, not principle.  
  **Audience:** Behavioral Ecologists (Optimality/Game Theory) + Sympathetic Philosophers (Spandrels Critique).

  ---

  ### 1. The "Category Error" Objection
  **Who:** Behavioral Ecologists (likely first question).  
  **Phrasing:** *"Your existence proofs—lactase persistence and sickle-cell—are single-locus physiological traits with clear fitness proxies. Human behavior is polygenic, plastic, and culturally mediated. How can physiological existence proofs validate a methodology for complex psychology?"*  
  **Damage Estimate:** **High.** If this stands, your evidence is irrelevant to your thesis.  
  **Concede:** The *difficulty* of meeting the conditions is exponentially higher for behavior than for physiology.  
  **Hold:** The *logic* of inference does not change with complexity. A harder test is not a different test.  
  **Compact Reply:** *"You're right that the epistemic barrier is higher for behavior. But a method's validity isn't negated by the difficulty of its application. If we can't meet Condition 1 for a psychological trait, that tells us we shouldn't be making adaptationist claims about it yet, not that the method is flawed. I'm arguing for restraint, not expansion."*  
  **Soft Spot:** You are implicitly assuming behavioral traits have a genetic architecture stable enough for selection to act on in the EEA. If they argue behavior is mostly cultural drift, your method collapses.

  ### 2. The "Defining Adaptationism Out of Existence" Objection
  **Who:** Behavioral Ecologists.  
  **Phrasing:** *"If we require independent characterization of the regime and novel predictions before proposing an adaptation, we'll never publish. You're setting a standard so high it renders evolutionary behavioral science impossible."*  
  **Damage Estimate:** **Medium.** They will frame you as an armchair theorist stifling field work.  
  **Concede:** It will reduce the *volume* of output significantly.  
  **Hold:** That is a feature, not a bug. It reduces false positives.  
  **Compact Reply:** *"I am arguing that the current volume of output contains a high rate of false positives. Reducing the flow of 'just-so' stories to increase the reliability of the few that survive is a net gain for the field's credibility. We should prioritize robustness over productivity."*  
  **Soft Spot:** They may press you on whether *any* current EP hypothesis actually meets your standard. If you say "none," you look destructive. If you say "some," be ready to name one.

  ### 3. The "Independence" Objection (The Philosophers' Trap)
  **Who:** Philosophers of Biology.  
  **Phrasing:** *"Condition 1 requires characterizing the selective regime independently of the trait. But for psychology, we often infer the regime (e.g., 'cheater detection') solely from the existence of the behavior. How do you avoid circularity without access to the ancestral mind?"*  
  **Damage Estimate:** **High.** This attacks the feasibility of your primary condition.  
  **Concede:** Inferring the regime from the behavior is circular and must be avoided.  
  **Hold:** Independent data sources exist (paleoanthropology, primatology, ecology) that do not rely on the specific psychological trait.  
  **Compact Reply:** *"Circularity arises when the behavior is the only evidence for the pressure. But we can reconstruct ancestral social structures via archaeology and comparative primatology. If the 'cheater detection' hypothesis relies only on the existence of cheating behavior, it fails Condition 1. If it relies on independent evidence of ancestral cooperation stakes, it passes."*  
  **Soft Spot:** Paleoanthropological data is often sparse and theory-laden itself. They may argue the "independent" data is just as interpretive as the psychological data.

  ### 4. The "Rival Exhaustion" Objection
  **Who:** Philosophers of Biology.  
  **Phrasing:** *"Condition 3 requires specifying non-adaptationist rivals in advance. But the space of possible by-products or drift hypotheses is infinite. How can you falsify adaptationism if you can't list every possible spandrel?"*  
  **Damage Estimate:** **Medium.** Standard underdetermination argument.  
  **Concede:** You cannot list *logically possible* rivals.  
  **Hold:** You only need to list *plausible, scientifically live* rivals.  
  **Compact Reply:** *"Science never tests against all logical possibilities, only live competitors. If a plasticity model or a drift hypothesis can explain the variance as well as the adaptationist model, it must be on the table. If no one can formulate a rival, that's a failure of imagination, not a license to assume adaptation."*  
  **Soft Spot:** Determining what counts as a "live" rival is subjective. They may argue EP researchers simply claim no rivals exist because they haven't looked.

  ### 5. The "Hope Nobody Asks" Objection (The Deep Time Opacity)
  **Who:** Anyone (but likely a senior Ecologist or Philosopher).  
  **Phrasing:** *"For lactase persistence, the selective regime (dairying) is archaeologically visible. For most psychological traits, the relevant selective pressures (e.g., status competition, mate choice) occurred in the Pleistocene and left no direct trace. Isn't Condition 1 actually impossible to satisfy for deep-time psychology, making your method a criterion that can never be met?"*  
  **Damage Estimate:** **Critical.** This suggests your method is principled but practically null for your specific field.  
  **Concede:** For *many* traits, we currently lack the data to satisfy Condition 1.  
  **Hold:** This implies agnosticism, not rejection of the method. It shifts the burden to gathering better ancestral data.  
  **Compact Reply:** *"If Condition 1 cannot be met, then we cannot scientifically claim the trait is an adaptation. We must remain agnostic. My thesis is that we should prefer agnosticism over unsupported adaptationist storytelling. If that slows down EP, it's because EP was moving faster than the evidence allowed."*  
  **Soft Spot:** This effectively admits that for the next 20 years, most EP work might be unscientific by your metric. It risks alienating the entire room whose careers depend on making those claims. **Pivot:** Emphasize that *some* domains (e.g., visual perception, fear responses) have clearer ancestral regimes than others (e.g., economic bargaining).

  ---

  ### General Strategy Notes
  *   **Tone:** Do not sound like you are attacking EP from the outside. Sound like a reformer from within who wants the field to be taken seriously by hard biologists.
  *   **The Philosophers:** They are sympathetic to Gould-Lewontin. Use their language ("epistemic rigor," "underdetermination") to show you aren't a naive adaptationist.
  *   **The Ecologists:** They care about models. Emphasize that your conditions make models *falsifiable*, which ecologists love.
  *   **The "Existence Proof" Defense:** If pressed hard on Lactase/Sickle-Cell not being behavior, pivot to **Fear Responses**. We know snakes/spiders were ancestral threats (independent regime), fear learning is rapid (prediction), and general learning mechanisms are the rival. It's a behavioral example that fits your criteria. Have this ready if Objection 1 lands hard.
