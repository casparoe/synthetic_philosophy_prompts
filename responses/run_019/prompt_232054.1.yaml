      *   **Claim:** Field failures are due to violating these conditions, not adaptationism itself.
      *   **Evidence:** Lactase persistence and sickle-cell trait as existence proofs.
      *   **Audience:** Mostly behavioral ecologists (optimality/game-theory folks) + two sympathetic philosophers of biology (Gould-Lewontin spandrels critique).
      *   **Task:** Prepare a question-period prep sheet.
      *   **Format:** Objections in likely order, phrased as the audience would put them, damage estimate, concession/hold strategy, compact reply, note on soft spots. Include the "hope nobody asks" objection.

  2.  **Deconstruct the Audience & Thesis:**
      *   *Behavioral Ecologists:* They care about models, empirical rigor, and fitness consequences. They might be skeptical of applying hard biological examples (sickle-cell) to complex behaviors. They might think the conditions are too strict or impractical for behavior.
      *   *Philosophers (Gould-Lewontin sympathetic):* They care about epistemological rigor, the "just-so story" problem, and the distinction between adaptation and by-product. They will likely attack the feasibility of the "independent characterization" condition for psychology.
      *   *The Thesis:* It's a methodological prescription. It tries to save EP from itself.
      *   *The Evidence:* Lactase persistence and sickle-cell are *physiological/genetic* traits, not *behavioral/psychological* traits. This is a huge vulnerability.

  3.  **Brainstorming Objections (Ordering by Likelihood):**
      *   *Immediate/Obvious:* Your examples aren't psychological. (The "Category Error" objection).
      *   *Behavioral Ecologist:* These conditions are too hard to meet for behavior. You're setting the bar so high nothing counts as EP. (The "Impossibility" objection).
      *   *Philosopher:* How do you independently characterize a selective regime for *psychology* without assuming the behavior exists? (The "Independence" objection).
      *   *Philosopher:* Specifying rivals *a priori* is impossible because we don't know all the constraints. (The "Underdetermination" objection).
      *   *General:* Why focus on EP? Behavioral ecology has the same problems. (The "Tu Quoque" objection).
      *   *The "Hope Nobody Asks":* A specific counter-example where EP succeeded without these conditions, or a demonstration that even with these conditions, the inference is still weak. Or, more likely, the fact that human environments change too fast for these conditions to hold (mismatch theory). Let's go with the "Mismatch/Novelty" problem – if the environment changed, the independent characterization of the *ancestral* regime is impossible.

  4.  **Drafting the Prep Sheet (Iterative Refinement):**

      *   *Objection 1 (The Elephant in the Room):* The examples. Sickle-cell and lactase are simple Mendelian/physiological traits. Behavior is polygenic and plastic.
          *   *Phrasing:* "Your existence proofs are physiological, not psychological."
          *   *Damage:* High.
          *   *Strategy:* Concede the gap, hold the principle.
          *   *Reply:* Principles of inference don't change with complexity, though difficulty does.

      *   *Objection 2 (The Behavioral Ecologists):* Feasibility.
          *   *Phrasing:* "You're defining adaptationism out of existence for behavior."
          *   *Damage:* Medium-High.
          *   *Strategy:* Hold firm. Better to have fewer robust claims than many weak ones.
          *   *Reply:* Science progresses by narrowing hypothesis space, not widening it.

      *   *Objection 3 (The Philosophers):* Independent Characterization.
          *   *Phrasing:* "How do you characterize the EEA without referencing the trait?"
          *   *Damage:* High.
          *   *Strategy:* Concede difficulty, hold necessity.
          *   *Reply:* Use paleoanthropology/ecology, not the behavior itself.

      *   *Objection 4 (The Philosophers):* Rivals.
          *   *Phrasing:* "You can't list all possible by-products."
          *   *Damage:* Medium.
          *   *Strategy:* Concede incompleteness, hold for *plausible* rivals.
          *   *Reply:* Don't need all logical possibilities, just live scientific options.

      *   *Objection 5 (The "Hope Nobody Asks"):* The Ancestral Environment Problem.
          *   *Phrasing:* "We can't know the Pleistocene well enough to satisfy Condition 1."
          *   *Damage:* Critical.
          *   *Strategy:* This is the weak spot. Acknowledge limits.
          *   *Reply:* Then we shouldn't make adaptationist claims yet.

  5.  **Refining the Tone:**
      *   Needs to be academic, precise, and strategic.
      *   "Damage Estimate" should be realistic (Low, Medium, High, Critical).
      *   "Concede/Hold" needs to be clear boundaries.
      *   "Soft Spot" needs to be honest about where the argument leaks.

  6.  **Final Review against Constraints:**
      *   Audience specific phrasing? Yes (Ecologists talk fitness/models, Philosophers talk epistemology/just-so stories).
      *   Order? Yes (Start with the obvious example mismatch, move to feasibility, then epistemology, end with the killer).
      *   Include the "Hope nobody asks"? Yes.

  7.  **Polishing the Content:** (Self-Correction during drafting)
