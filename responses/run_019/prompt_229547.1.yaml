answer: |-
  This is a profound question that cuts to the heart of why set theorists distinguish between "constructive" and "non-constructive" existence. Your intuition is correct: Zorn's Lemma *is* transfinite induction. The "illicit work" is not in the logic of the induction itself, but in the **fuel** required to run the engine for arbitrarily long.

  Here is the gut-level breakdown of where the Axiom of Choice (AC) hides, why it leaves no map, and why the chain condition is the safety net.

  ### (a) Where the Choice is Smuggled In: The "Global Strategy"

  Your naive gloss is: *"Keep adjoining elements until you can't."*
  The hidden assumption is: *"You can decide **which** element to adjoin at every single step, even after infinitely many steps, without running out of rules."*

  **The Local vs. Global Trap**
  At step 0, you pick $x_0$. At step 1, you pick $x_1 > x_0$. This is easy. Even at step $n$, it's easy. But transfinite induction requires you to define the sequence for *all* ordinals $\alpha$ up to some stopping point.
  To do this rigorously, you need a **function** $f$ that takes any partial chain you've built so far and outputs the *specific* next element.
  *   **Without AC:** You can say "There exists an extension," but you cannot define a single rule that picks one consistently for every possible chain you might encounter. If the poset branches wildly (like a tree with no labels), you get lost at the first fork.
  *   **With AC:** You are allowed to assert that a "Choice Function" exists. You don't know what the function *is*, but you are allowed to assume you have a "magic compass" that always points to *a* valid next step.

  **The Real Smuggle: Well-Ordering**
  In the standard proof of Zorn's Lemma from AC, the "Choice" is used to **well-order the entire poset**.
  Imagine your poset is a tangled briar patch. You want to climb up. AC allows you to magically impose a rigid ladder (a well-ordering) over the briar patch. Now, your induction rule becomes deterministic: *"At each step, pick the **least** available element (according to the magic ladder) that is strictly higher than where you are."*
  *   **The Illicit Work:** The well-ordering of an arbitrary set (like $\mathbb{R}$) is non-constructive. You cannot write it down. By assuming it exists to run your induction, you are borrowing existence from AC. The induction is valid, but the *track* it runs on is invisible.

  ### (b) Existence Without a Recipe: The "Foggy Mountain"

  Why does this deliver existence but no recipe? Because the "magic compass" (the well-ordering or choice function) is not part of the output.

  **The Black Box**
  Zorn's Lemma is a black box.
  *   **Input:** A poset satisfying the chain condition.
  *   **Internal Mechanism:** A non-constructive well-ordering allows a transfinite walk that *must* terminate (because the set isn't big enough to support a strictly increasing sequence of length equal to its own Hartogs number).
  *   **Output:** "A maximal element exists."

  **What goes wrong with definable posets?**
  Consider the poset of linearly independent subsets of $\mathbb{R}$ over $\mathbb{Q}$ (ordered by inclusion).
  *   **Definable?** Yes. We can write down the condition for linear independence.
  *   **Maximal Element?** A Hamel Basis.
  *   **Recipe?** None.
  Because the "choice" of which vector to add next relied on a non-constructive well-ordering of $\mathbb{R}$, the resulting basis inherits that non-constructibility. We know the climb stops at a basis, but we cannot describe the coordinates of that basis. It is like knowing a mountain peak exists because gravity prevents you from climbing forever, but being blindfolded during the climb so you cannot record the latitude/longitude of the summit.

  **Prediction Tool:** If the poset has no "canonical" way to choose the next element (e.g., no "smallest" or "simplest" extension), and you need Zorn's Lemma, expect the maximal element to be non-definable (e.g., non-measurable, no Baire property).

  ### (c) Why the Chain Condition? The "Cliff" vs. The "Slope"

  You asked why "every non-maximal element has a strict successor" isn't enough. This condition guarantees you can always take *one more step*. It does not guarantee you can survive *infinitely many steps*.

  **The Concrete Counterexample: Finite Subsets of $\mathbb{N}$**
  Let $P$ be the set of all **finite** subsets of $\mathbb{N}$, ordered by inclusion $\subseteq$.
  1.  **Successor Condition:** Is every non-maximal element below something else? **Yes.** If $A$ is a finite set, $A \cup \{n\}$ is a strictly larger finite set. There are no maximal elements.
  2.  **Chain Condition:** Does every chain have an upper bound *in P*? **No.**
      Consider the chain $C = \{ \{0\}, \{0,1\}, \{0,1,2\}, \dots \}$.
      This is a valid chain in $P$.
      What is its upper bound? The union is $\mathbb{N}$ (the set of all natural numbers).
      Is $\mathbb{N}$ in $P$? **No**, because $P$ only contains *finite* sets.
      So the chain "falls off the edge" of the poset.

  **The Gut Intuition**
  *   **Successor Condition:** "There is always a higher foothold."
  *   **Chain Condition:** "If you climb forever, you eventually land on a plateau *within the mountain*, not in empty space."

  In the Finite Subsets example, you can climb forever ($\{0\} \subset \{0,1\} \subset \dots$), but you never reach a maximal element because the only thing "above" the whole chain is an infinite set, which is forbidden territory. Zorn's Lemma requires that the poset be "vertically complete"—that limits of chains don't escape the set.

  ### Summary: How to Predict Zorn's Viability

  When looking at a new poset, ask these three questions to gauge if Zorn's Lemma is the right tool and what the cost will be:

  1.  **The Choice Test:** Is there a canonical way to pick the "next" element (e.g., "pick the smallest")?
      *   *Yes:* You might not need AC (ordinary induction or recursion might suffice).
      *   *No:* You need AC. The result will likely be non-constructive.
  2.  **The Cliff Test:** If I build an infinite increasing chain, does the "limit" object stay in the set?
      *   *Yes:* (e.g., Ideals in a ring: the union of a chain of ideals is an ideal). Zorn applies.
      *   *No:* (e.g., Finite subsets: the union is infinite). Zorn fails; no maximal element may exist.
  3.  **The Size Test:** Is the poset "too big" to be well-ordered without AC?
      *   If the elements are "amorphous" (like arbitrary subsets of $\mathbb{R}$), expect the maximal element to be a "monster" (non-measurable, etc.).

  **The Verdict:** The "illicit work" is the assumption that you can lay a deterministic track (well-ordering) over a non-deterministic landscape (the poset) to force the induction to run. The chain condition ensures the track doesn't end in mid-air. The price you pay is that you reach the destination blindfolded.
