  **The Principle: Intra-Personal Causal Counting**
  > "When evaluating competing hypotheses, weight them by the number of observer-moments they predict that are **causally continuous with your current trajectory**. Do not weight hypotheses by the number of qualitatively identical observers they predict who lack this causal continuity. Within a hypothesis, distribute credence uniformly across your compatible causally-continuous moments."

