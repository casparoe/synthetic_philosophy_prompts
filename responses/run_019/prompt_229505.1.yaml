  **Calculation:**
  $$ \text{Posterior Odds} = \text{Prior Odds} \times \text{Likelihood Ratio} $$
  $$ \frac{P(T)}{P(H)} = \frac{0.9}{0.1} \times \frac{2}{1} = 9 \times 2 = 18 $$
  $$ P(Heads) = \frac{1}{1 + 18} = \frac{1}{19} \approx 0.053 $$

