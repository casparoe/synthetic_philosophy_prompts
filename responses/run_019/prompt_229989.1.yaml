prompt: |-
  Okay so I'm a software engineer with no formal philosophy background, and I've gone down a rabbit hole on this thing where your practical stakes might change whether you count as knowing something. I want to build a small web quiz that sorts people into the positions in that debate — pragmatic encroachment, contextualism, invariantism, whatever else belongs — based on their gut calls on concrete cases rather than which label they like. Can you write the quiz for me? Please write the whole answer in British English ('sceptic', 'analyse', that sort of thing).

  The cases I want in there are: the bank case (Hannah checked two weeks ago whether the bank is open on Saturday; on Friday it doesn't matter, on Saturday a bounced cheque does), the airport stopover case (Mary has an itinerary saying the flight stops in Chicago, low vs high stakes), and ideally a lottery case. Add other cases only if they do real diagnostic work. Every question should be a short story with two or three plain-language options, and no question should use the names of the views or ask 'do you think stakes change knowledge?' directly. The point is to catch people's answers before they put the label on.

  The leaves I want are roughly these five (with a bonus sixth if it holds together): (1) moderate invariantism — high stakes never touch knowledge, and the high-stakes intuition is explained by what it's rational to assert or act on, not by knowledge itself; (2) strict or sceptical invariantism — she rarely or never knows in the first place, and high stakes just make that obvious; (3) contextualism — 'know' is context-sensitive like 'tall', and the speaker's standards go up in the high-stakes conversation; (4) subject-sensitive invariantism / pragmatic encroachment — the word means the same thing, but whether Hannah actually knows depends on what's at stake for her; (5) contrastivism, where 'knows' is a three-place relation and what's at stake changes the alternatives in play. If you think there's a stable sixth leaf where practical factors change epistemic justification but not knowledge, include it only if it doesn't collapse into one of the others.

  I know contextualism and subject-sensitive invariantism agree on the bank case verdict; that's exactly the sort of thing I want the quiz to try to crack, even if the answer turns out to be that ordinary cases can't do it perfectly.

  Please build the thing from logical space rather than from a list of names. The splits I care about are: does high stakes ever destroy knowledge? If yes, is the shift semantic (the word gets stricter in context) or practical-epistemic (the underlying state changes)? Whose stakes do the work — the subject's, the speaker's, or a third party assessing the claim afterwards? And how does each position handle the lottery case without slipping into scepticism by accident? Start with a small table of the answer combinations, say where each leaf sits in it, and flag any combination nobody occupies with a one-line guess about why it's empty (incoherent, unattractive, or just unexplored).

  Then write the actual quiz: 8–10 questions, each a concrete case with two or three answer options, plus a scoring key that maps answer patterns onto the leaves. After the key, be honest about which pairs of positions the quiz can't reliably seperate and why a short questionnaire probably can't do it — don't pretend a mushy boundary is crisp.
