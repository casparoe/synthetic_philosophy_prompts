      *   Recommendation: Shift to **Primitive Chance vs. Emergent Chance**. Or, look at **Gleason's Theorem** analogues in decision theory.
      *   Actually, the most helpful diagnostic is that they are arguing past each other on **what a derivation is supposed to do**. Is it to convince a skeptic (foundational) or to show consistency (internal)?
