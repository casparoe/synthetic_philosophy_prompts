answer: |-
  "Mira's dilemma isn't just about money," Elena said, closing her notebook as they walked out of the seminar room. "It's about what her choice signals to the rest of us. If the most ethically sensitive students view proprietary trading as the paradigmatic moral career, we hollow out the public sector."

  Daniel adjusted his backpack. "You're conflating the signal with the outcome. Mira's choice is about expected value. At the trading firm, she generates surplus value that is socially neutral, then transfers $100,000 annually to bednet distributions. That is concrete. The housing policy role offers hope, but its causal impact is diffuse. If she takes the research job, she might spend five years producing reports that never change legislation. In the trading role, the good is guaranteed."

  "But that guarantee relies on a narrow view of agency," Elena countered. "You're ignoring the diversion of talent. Mira is exceptionally skilled. If people like her opt out of public institutions because the metrics are messy, those institutions degrade. It's not just about Mira's output; it's about the capacity of the housing organization to function with top-tier researchers. By siphoning talent toward earning to give, effective altruism weakens the very structures needed to solve systemic poverty."

  Daniel stopped near the stairwell. "That sounds like a collective action problem, not an individual duty. We have to look at counterfactual replaceability. If Mira rejects the trading job, someone else will take it. The trading activity happens regardless. The marginal impact of Mira taking that seat is zero regarding the firm's social neutrality. However, if she rejects the policy job, that specific research position might remain unfilled or go to someone less capable. But here's the distinction: we must separate marginal impact from average impact. The average impact of policy work might be low due to gridlock, but Mira's marginal contribution could be high. Yet, without evidence, we're guessing. I'm skeptical that well-intentioned political work reliably produces systemic improvement. History is littered with housing reforms that exacerbated segregation or inflated costs. Uncertainty isn't a virtue."

  "I'm not claiming uncertainty is a virtue," Elena replied, leaning against the railing. "I'm pointing out a measurability bias. Effective altruism favors outcomes that are immediate, attributable, and quantifiable. Bednets are easy to count; housing dignity is not. By privileging the quantifiable, you systematically undervalue structural change. You're treating the hard-to-measure effects of policy as though they were known to be small, rather than merely uncertain. That's an epistemic error."

  Daniel nodded slowly. "I concede that there is a risk of measurability bias within the movement. If we ignore high-variance, hard-to-measure interventions solely because they lack data, we might miss massive opportunities. However, skepticism isn't dismissal. My premise is that without rigorous evidence, we cannot assume positive impact. But I will admit this: if the housing organization could demonstrate even a modest probability of triggering a legislative cascade that outweighs the $100,000 annual donations, my calculation changes. The empirical premise that would change my mind is a robust model showing that policy advocacy has a higher expected value per hour than direct donation, even accounting for the uncertainty."

  "And mine is slightly different," Elena said. "I would concede the individual duty argument if we could isolate Mira's decision from the social norms effective altruism encourages. My worry is the cumulative pipeline effect. When Mira chooses trading, she alters the ambitions of her peers. It creates a feedback loop where high-ability students view public service as a backup plan rather than a primary moral obligation. The premise that would change my mind is evidence that this pipeline effect is negligible—that individual career choices don't significantly shift cohort norms. But I doubt that's true."

  "So you think this is about norms, not just Mira's duty?" Daniel asked.

  "Exactly," Elena said. "Your defense rests on Mira's individual obligation to maximize good given the world as it is. My critique is that effective altruism as an institutional practice shapes the world it operates in. By validating the trading job, you reinforce a norm that exempts talented people from the hard work of institutional reform. You're optimizing within a broken system rather than fixing the system."

  "But who fixes the system if everyone tries to fix the system and no one funds the relief?" Daniel pressed. "There has to be a division of labor. I'm not saying political work is valueless merely because it sounds structural. I acknowledge it could be vital. But someone needs to fund the safety net while others fight for policy. If Mira takes the policy job, who funds the bednets? If the trading job is socially neutral, why is it morally suspect to use it as a funding engine?"

  "Because it's not neutral in terms of human capital," Elena insisted. "It removes a potential reformer from the field. And regarding your division of labor point: effective altruism currently skews heavily toward earning to give. It's not a balanced ecosystem. So while Mira's individual duty might technically favor the donations under your calculus, the social norm she reinforces is dangerous. We disagree on whether Mira should act as a lone agent maximizing immediate utility or as a participant in constructing a healthy civic ecosystem."

  Daniel looked at his watch. "I think we've pinpointed the stalemate. You're arguing from a framework where individual actions are judged by their contribution to institutional virtue and long-term norms. I'm arguing from a framework where individual actions are judged by their counterfactual consequences in the immediate future. I concede that if the pipeline effect is as strong as you say, the long-term cost of normalizing trading careers could outweigh the short-term gains of her donations. But until we have data on that norm strength, I stick with the tangible lives saved."

  "And I concede that if the policy work is as ineffective as you fear, my structural argument collapses into sentimentality," Elena said. "But I won't treat the difficulty of measurement as evidence of absence. We end up here: you require evidence of impact before committing to structural work; I require evidence of normative harm before committing to extractive work."

  "So the disagreement isn't about the value of lives saved," Daniel summarized. "It's about the weight we assign to epistemic uncertainty versus institutional integrity. You prioritize the health of the public sphere even at the cost of immediate, quantifiable good. I prioritize the immediate good even at the cost of potentially eroding public sphere norms."

  "Precisely," Elena said. "Mira isn't just choosing a job. She's choosing which uncertainty she's willing to tolerate: the uncertainty of political efficacy or the uncertainty of social decay."

  "And neither of us can prove which risk is greater," Daniel said.

  "No," Elena replied. "We just have to decide which gamble looks more like responsibility."
