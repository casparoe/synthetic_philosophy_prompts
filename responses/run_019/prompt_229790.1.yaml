      *   *Correction on View 4:* View 4 says commodification isn't the problem, *exploitation* is. View 3 (Votes) is often defended by saying markets corrupt the *meaning* of voting (commodification). If the user rejects that, they need an exploitation/inequality argument for votes. Rich people buying votes from poor people -> inequality. This fits View 4. So 4 vs 3 might be an *apparent* tension if framed correctly. I should downgrade that severity.

      *   *Re-evaluating 1 vs 5:* View 5 says "consent is thin" due to desperation. View 1 assumes consent is valid enough for kidneys. This is the real sticking point. If desperation thins consent for water, does it thin consent for organs?
