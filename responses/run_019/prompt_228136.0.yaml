answer: |-
  Your software analogy is apt, but it inadvertently supports my side: when you debug a crash, you don't trace electron flow through transistors because the transistor-level story is causally too specific to be useful—it lacks the stability required for actual explanation. If causation is merely about sufficient conditions, then yes, the Big Bang is the only true cause, but that renders the concept useless for any science beyond fundamental physics. I argue for an interventionist account: a cause is something that makes a difference across a range of conditions. If I intervene on a simmball—say, by ensuring the pattern exists rather than a specific marble configuration—the outcome holds across countless micro-variations of simms that realize the same pattern. The simm-level story is true but fragile; it tells you why *this* exact configuration led to *that* result, but it fails to capture why *any* configuration realizing Simmball A would nudge Simmball C. The simmball causes the robust regularity, while the simms only cause the singular instance, and ignoring the pattern level leaves you blind to the counterfactuals that actually matter for prediction and control.

  [The hardest objection for me to answer is Jaegwon Kim's Exclusion Argument: if the physical level is causally closed and sufficient, any additional causal claim from the higher level looks like systematic overdetermination or epiphenomenalism.]
