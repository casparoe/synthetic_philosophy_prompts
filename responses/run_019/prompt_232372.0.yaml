      The common argument that scientific discoveries are inevitable because they occur simultaneously rests on an unexamined assumption about what constitutes the same discovery. When scholars point to Newton and Leibniz or Darwin and Wallace, they infer that because two individuals arrived at similar conclusions independently, the discovery was waiting to be found. However, this inference moves too quickly. It presupposes that we already possess a stable criterion for when two distinct intellectual achievements count as identical. In reality, Newton's fluxions and Leibniz's differential calculus differ in notation and operational formulation, just as Darwin's and Wallace's theories of natural selection diverge in mechanism and scope. Consequently, the claim of inevitability is premature until we establish what sameness relation must hold between independent achievements to justify it. This project asks precisely what criteria of identity must obtain between independent achievements to license a claim of inevitability, and whether the standard historical cases actually meet them. Furthermore, it investigates whether credit should attach to the abstract discovery-type or the specific contribution, and how this determination alters the significance of priority disputes.

      Existing appeals to simultaneous discovery leave this question open because they treat historical coincidence as philosophical proof. They assume that temporal proximity implies conceptual identity, ignoring the substantive differences in how problems are framed and solved. A purely comparative historical approach would merely catalogue these differences without evaluating their philosophical weight. Therefore, this project will not simply narrate the episodes but will employ a conceptual analysis grounded in historical detail. The first three months will be dedicated to constructing a taxonomy of discovery identity, distinguishing between semantic, methodological, and ontological equivalence. Months four through six will apply this framework to the Newton-Leibniz and Darwin-Wallace cases, analysing whether their overlaps constitute genuine identity or merely functional equivalence. Months seven to nine will explore the normative implications, specifically how different criteria of identity shift the ethics of credit allocation and the relevance of priority disputes. The final quarter will focus on synthesising these findings into a coherent dissertation chapter structure and drafting the full text.

      This methodological choice is crucial because history alone cannot dictate whether a difference in notation matters for the identity of a mathematical discovery. Only philosophical analysis can determine if such differences are incidental or constitutive. By combining conceptual rigour with historical evidence, the project avoids the pitfalls of Whig history while remaining relevant to contemporary debates in the philosophy of science. A successful result would look like a robust framework for evaluating discovery identity that clarifies when inevitability claims are warranted and when they are mistaken. It would demonstrate that credit allocation depends on the specific type of identity established, thereby reshaping how we understand priority disputes. Conversely, failure would consist in finding that no stable criteria for discovery identity can be established across different scientific domains, suggesting that inevitability claims are always context-dependent and philosophically unstable. Ultimately, this research aims to sharpen our understanding of scientific progress by showing that the inevitability of discovery is not a historical fact but a philosophical judgement requiring precise criteria.

