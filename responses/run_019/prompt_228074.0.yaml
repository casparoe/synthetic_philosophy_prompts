answer: |-
  **Final Exam Question (20 Marks)**

  **Case:** A hospital's night pharmacist reads a label and concludes that a vial contains the correct drug; on her evidence she is as well-positioned as pharmacists normally are when we count them as knowing. Her own situation is low-stakes for her—she will go home on time either way—but the patient who will receive the drug will die if she is wrong.
  *   **Variant 1:** A colleague watching her asks whether the pharmacist knows the vial is correct.
  *   **Variant 2:** The pharmacist herself does not know what is at stake: she has been told only that the vial is for 'a routine administration', and in fact it is for the critical patient.
  *   **Variant 3:** The next morning, having learned the patient survived, she says she never really knew, and the patient's furious family says she did know and is culpable.

  **Task:** Explain how **Pragmatic Encroachment (PE)** and **Attributor Contextualism (AC)** analyze these variants. Specifically: (1) State precisely whose practical situation each theory makes relevant to the truth of knowledge claims. (2) Predict the verdict for each variant under both theories. (3) Identify which variant most cleanly discriminates between the theories and which variant is hardest for each theory to explain. (90 minutes)

  ***

  **Model Answer**

  Pragmatic Encroachment (PE) and Attributor Contextualism (AC) offer competing explanations for why knowledge ascriptions seem sensitive to practical factors. PE holds that knowledge itself is partly constituted by the subject's practical stakes; if stakes rise, the evidential threshold for knowledge rises. AC holds that knowledge is fixed, but the semantic standards for the word 'knows' shift depending on the attributor's (speaker's) context.

  In **Variant 1**, the pharmacist has low personal stakes, though the patient's stakes are high. PE focuses on the *subject's* stakes. Since the pharmacist's personal situation is low-stakes (she goes home either way), PE predicts she **knows**. AC focuses on the *attributor's* context. If the colleague is aware of the patient's critical condition, their conversational standards rise, making "She knows" **false**. Here, the theories diverge: PE predicts knowledge; AC predicts variability based on the colleague's awareness.

  **Variant 2** introduces subject ignorance of stakes. The pharmacist believes stakes are low. PE faces significant pressure here. If PE ties knowledge to objective stakes, she **does not know**, yet she is practically rational to act as if she does. This severs the link between knowledge and practical reasoning that motivates PE. If PE ties knowledge to perceived stakes, she **knows**, but this ignores the objective danger. AC verdicts depend on the attributor. If a doctor asks knowing the stakes, "She knows" is false. AC handles this without internal contradiction regarding the subject's rationality.

  **Variant 3** involves retrospective conflict. The pharmacist says "I didn't know"; the family says "You knew." AC explains this effortlessly: the pharmacist speaks from a high-standards context (guilt/liability), while the family speaks from a context demanding culpability (also high standards, but perhaps asserting knowledge to establish negligence). Actually, AC explains the *conflict* as compatible truths relative to context. PE struggles here. The stakes at the time of action were fixed. Either she knew or she didn't. PE must declare one party objectively wrong, failing to capture the felicity of both claims.

  **Discrimination and Difficulty:** Variant 2 most cleanly discriminates. It forces PE to choose between objective stakes (breaking the knowledge-action norm) or perceived stakes (ignoring moral gravity). AC faces no such internal tension, relying only on the speaker's context. Variant 3 is hardest for PE, as it cannot accommodate conflicting true ascriptions about a fixed past fact. Variant 1 is hardest for AC if the colleague's context is ambiguous, but PE's constraint on "subject stakes" makes Variant 2 the critical stress test. Ultimately, Variant 2 reveals that PE cannot easily handle cases where the subject is ignorant of the very stakes supposed to encroach upon their knowledge.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Core Definitions (4 Marks)**
  *   **Must Hit:** Clearly state that PE makes knowledge dependent on the *subject's* stakes, while AC makes the truth of ascriptions dependent on the *attributor's* contextual standards.
  *   **Typical Mistake:** Claiming AC says knowledge changes (it says truth-conditions of ascriptions change) or claiming PE depends on the patient's stakes rather than the subject's.

  **2. Variant 1 Predictions (4 Marks)**
  *   **Must Hit:** PE predicts Knowledge (low subject stakes). AC predicts variability/Falsehood (depending on colleague's awareness of patient stakes).
  *   **Typical Mistake:** Assigning the patient's stakes to the pharmacist for PE, causing both theories to predict "No Knowledge" and missing the divergence.

  **3. Variant 2 Analysis (4 Marks)**
  *   **Must Hit:** Identify the pressure on PE regarding subject ignorance. If stakes are objective, PE conflicts with practical rationality; if perceived, it ignores reality. AC remains stable based on speaker context.
  *   **Typical Mistake:** Treating Variant 2 identical to Variant 1, ignoring the epistemic significance of the pharmacist's ignorance of the stakes.

  **4. Variant 3 Analysis (4 Marks)**
  *   **Must Hit:** AC explains the conflict via shifting contexts (both can be right). PE struggles because past stakes/facts are fixed (one must be wrong).
  *   **Typical Mistake:** Arguing PE explains this well by saying stakes changed overnight (stakes must be relevant at the time of action).

  **5. Comparative Evaluation (4 Marks)**
  *   **Must Hit:** Identify Variant 2 as the strongest discriminator (pressures PE's action-norm) and Variant 3 as hardest for PE (fixed past facts).
  *   **Typical Mistake:** Concluding that both theories make identical predictions everywhere (the "failure mode" mentioned in the prompt).

  **Distinguishing A from B Answers**
  An **A answer** will notice that Variant 2 pressures Pragmatic Encroachment into a result its proponents rarely advertise: either denying knowledge to a rationally acting subject (if stakes are objective) or divorcing knowledge from objective danger (if stakes are perceived). It recognizes this as a theoretical cost specific to PE. A **B answer** will correctly state both views and apply them to the cases but will treat them as making largely the same predictions everywhere, failing to isolate Variant 2 as the point where the theories' structural differences force incompatible conclusions about the subject's rationality.
