answer: |-
  **Part 1: The Verdict and the Underlying Rule**

  Based on her track record, I predict she will rule the migraine study **impermissible**.

  She will likely acknowledge that relieving suffering for tens of millions is a significant good, far outweighing the economic savings of battery-cage eggs or the cosmetic benefits of shampoo. However, her "reluctant" permission of the leukemia study establishes a specific precedent: invasive, painful procedures on sentient mammals like rats are reserved for **vital, life-saving necessities**. Migraines, while debilitating, are not fatal. In her framework, the severity of the human condition acts as a key that must unlock the permission to use the animal. The leukemia key fits; the migraine key does not.

  Regarding the rule that governs her thinking, none of the three candidates you listed fully accounts for all five verdicts on their own.
  *   **Straight Aggregation** fails because it cannot explain her chimpanzee verdict. If we simply weigh total suffering against total benefit, saving children's lives should outweigh the suffering of a few dozen chimpanzees, yet she forbids it.
  *   **Cognitive Sophistication** fails because it cannot explain the battery-cage verdict. Hens have low cognitive capacity; under a pure sophistication rule, trivial human benefits should still outweigh their suffering if the numbers are large enough. She rejects this.
  *   **Nozick-Style Asymmetry** comes closest but requires modification. Nozick argues humans have rights that cannot be violated for aggregate good, while animals do not. She treats chimpanzees *as if* they have rights, which breaks the strict human/animal asymmetry.

  The principle that best fits her record is a fourth option: **A Tiered Threshold View.** This rule combines species capacity with a hierarchy of human need.
  1.  **Species Ceiling:** Animals above a certain cognitive threshold (chimpanzees) are protected from invasive research regardless of human benefit.
  2.  **Benefit Floor:** Animals below that threshold (rats, mice, hens) may be used, but only if the human benefit crosses a severity threshold.
      *   *Trivial benefit* (shampoo, egg prices) → Impermissible.
      *   *Life-saving benefit* (leukemia) → Permissible for low-capacity animals.
      *   *Non-life-saving benefit* (migraines) → Impermissible, because it fails the severity floor.
  3.  **Pain Constraint:** Painless death of surplus low-capacity animals is acceptable (mice), provided breeding is minimized.

  This Tiered Threshold View predicts the "No" verdict on migraines because the human benefit, while broad, does not meet the "life-or-death" severity floor required to justify painful procedures on rats.

  **Part 2: The Nozick Connection and Pressure Points**

  Her position amounts to a **modified Nozick-style asymmetry in practice**, but not in theory. Robert Nozick's classic view is binary: persons are ends-in-themselves (protected by side-constraints), and non-persons are resources (subject to utilitarian calculation). Your colleague has effectively expanded the category of "persons" (or beings with side-constraints) to include great apes, while keeping rodents in the "resource" category but attaching strict conditions to their use.

  In practice, this looks like Nozickianism because she refuses to sacrifice the chimpanzees for the greater good of the leukemia patients. She treats the chimps as having a moral veto that the rats do not possess.

  However, this view has two known pressure points where it often fractures under scrutiny:
  1.  **The Species Line:** Why chimpanzees and not pigs? Pigs possess cognitive sophistication and emotional capacity comparable to great apes in many metrics, yet her rule likely permits pig testing if the benefit is high enough. If the moral weight tracks cognitive sophistication (as the chimp verdict suggests), excluding pigs appears arbitrary.
  2.  **The Severity Line:** Why must the human benefit be life-saving? If we accept that animal suffering can be traded for human survival (the leukemia case), the principle of trade-offs is already admitted. Once trade-offs are admitted, drawing a hard line at "death" rather than "severe debilitation" (like blindness or paralysis) can seem morally inconsistent. If a rat's pain is acceptable to save a life, why is it not acceptable to prevent a child from living in total darkness?

  **Part 3: The Discriminating Case**

  To distinguish between the two strongest candidate rules remaining—the **Strict Vital-Interest Threshold** (research allowed *only* for survival) and the **Proportionality of Suffering** (research allowed when human benefit is *profound*, even if not fatal)—you should pose the following case at your next meeting:

  > "A new gene therapy prevents a rare genetic condition that causes total, permanent blindness and loss of motor function in children by age five. The condition is not life-threatening; patients live normal lifespans but require full-time care. Testing requires the same painful procedures on the same number of rats as the leukemia study. No alternative exists."

  **Why this settles the matter:**
  *   **If she says Permissible:** She is operating on **Proportionality of Suffering**. She accepts that non-fatal benefits can justify animal pain if the human gain is profound enough (restoring sight and movement). This would suggest her "No" on the migraine case was about the *degree* of debilitation, not the absence of mortality risk.
  *   **If she says Impermissible:** She is operating on a **Strict Vital-Interest Threshold**. For her, the moral license to use rats is tied specifically to preventing death. This would confirm that her view is more rigid than simple proportionality and that the migraine verdict was based on the lack of a survival stake, not just the severity of pain.

  This case isolates the variable of "mortality" while keeping the variables of "animal suffering" and "human benefit magnitude" high, forcing her to reveal whether the "life-saving" requirement is a fundamental principle or just a heuristic for "very serious" benefits.
