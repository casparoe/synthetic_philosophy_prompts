  OCEANIC INTEGRITY CRUISE LINES
  EMERGENCY EVACUATION AND CAPACITY PROTOCOL CARD

  1. PASSENGER STATUS VERIFICATION
  In the event of a maritime emergency, all individuals must be classified immediately as either Passengers or Swimmers. Passenger status is reserved exclusively for persons holding valid pre-voyage booking credentials and confirmed financial solvency. Individuals found in the water without prior documentation are classified as Swimmers. Status is determined at the point of embarkation and cannot be altered during distress situations. Crew members are instructed to verify wristbands and biometric scans before granting access to secure deck areas. Persons identified as Swimmers must remain in the water until further notice. Attempting to board without verified Passenger status constitutes a breach of safety protocol and threatens the structural integrity of the vessel. This distinction ensures resource allocation remains efficient during crisis management protocols. Non-compliance will result in immediate removal from the deck.

  2. VESSEL CARRYING CAPACITY
  The maximum carrying capacity of this lifeboat is fixed at 60 persons. This limit is not arbitrary but is derived from strict displacement calculations and buoyancy safety margins required to keep the vessel afloat in rough seas. Exceeding this number, even by a single individual, risks capsizing the unit and drowning all occupants. Therefore, once the 60-person limit is reached, the boarding door will be sealed permanently. No exceptions are made for children, medical emergencies, or additional Swimmers. The safety of the existing occupants takes precedence over the admission of new persons. To exceed this limit is to guarantee collective failure. The physical limits of the vessel are absolute. Engineering specifications dictate that water displacement exceeds buoyancy forces beyond this specific threshold. Consequently, loading beyond capacity violates maritime safety laws and endangers every soul on board.

  3. EXTERNAL AID PROTOCOLS
  While boarding is restricted to verified Passengers, crew are authorized to provide limited aid to Swimmers in the surrounding water. Approved aid includes sealed ration packs, plastic flotation devices, and verbal expressions of concern broadcast via megaphone. Crew members may throw these items overboard to assist Swimmers without compromising the weight distribution of the lifeboat. However, under no circumstances may a Passenger surrender their seat to a Swimmer. Swapping seats reduces the total survival rate by introducing uncertainty into the manifest. You are encouraged to show compassion from a distance, but physical integration of Swimmers into the boat is prohibited. Maintain the boundary between the dry and the wet. This method allows for humanitarian gesture without risking structural stability of the evacuation unit. Passengers should not feel guilty for retaining their assigned seating during these distributions. Do not lean over the rails to pull others in.

  4. LONG-TERM POPULATION DYNAMICS
  Guests may question why Swimmers are not rescued for future voyages. Current data indicates that rescuing Swimmers now results in a net increase in the number of Swimmers later. Rescue operations encourage higher reproduction rates, leading to greater congestion later. By maintaining strict boarding limits, we prevent the overpopulation of the water and ensure that future lifeboats remain viable. Saving everyone today ensures no one survives tomorrow. Our policy prioritizes the long-term stability of the maritime environment over short-term emotional impulses. Prudence requires us to accept that some drowning is necessary to prevent total submersion. Demographic studies confirm that aid correlates directly with population surges in water-based communities. We must act responsibly to avoid creating a dependency cycle that overwhelms rescue infrastructure. Future generations depend on our restraint today.

  5. DUTY TO THE SAVED COMMUNITY
  Each Passenger bears a responsibility to protect the viability of the lifeboat. You are entrusted with the survival of this specific group. Do not guilt the crew for enforcing capacity limits. Do not attempt to haul Swimmers aboard. Your safety depends on the exclusion of those without credentials. We understand this is difficult, but the alternative is universal drowning. Thank you for choosing Oceanic Integrity Cruise Lines. Your cooperation ensures the continuation of civilized standards in emergency zones. Preserving the boat is the highest moral good. Your ticket represents a contract of mutual protection among the verified and the solvent. Honor that contract. Survival is duty.

  SAFE VOYAGES. SAFE LIMITS.
