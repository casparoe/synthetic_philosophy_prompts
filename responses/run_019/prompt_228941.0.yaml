  **The Best Fit: "Threshold Necessity with a Great Ape Exception"**
  Her reasoning aligns best with a fourth rule, which functions as a hybrid of regulatory oversight and moral intuition. It has three components:
  1.  **Human Benefit Threshold:** Animal suffering is only justified by *substantial* human medical needs. "Trivial" (eggs) and "Vanity" (shampoo) benefits are automatically vetoed. "Life-saving" (leukemia) clears the bar. "Debilitating" (migraine) likely clears the bar, but barely.
  2.  **Species Hierarchy:** Within the "substantial need" category, lower-order species (rats, mice) are permissible resources.
  3.  **The Personhood Veto:** Certain high-cognition species (chimpanzees) possess a status that creates a side-constraint. They cannot be used even for life-saving human needs.

  This explains why she accepted the leukemia/rat protocol (High Need + Low Species) but rejected the leukemia/chimp protocol (High Need + Protected Species), and why she rejected shampoo/rabbits (Low Need).

  ### 2. Is This a Nozick-Style Asymmetry?

  Her position is **not** a true Nozick-style asymmetry in practice, though it borrows the language of constraints.

  In Robert Nozick's framework, individuals have rights that act as "side constraints" on action; you cannot violate one person's rights even to prevent the violation of many others' rights. However, Nozick generally reserved this status for rational moral agents (humans). Animals, in his view, could be treated with cruelty constraints but did not have inviolable rights.

  Your colleague's view creates pressure points that a strict Nozickian view does not:
  *   **The Boundary Problem:** She treats chimpanzees as having rights (or near-rights) but rats as having only interests. A Nozickian view struggles to explain why the "rights" line is drawn at the genus *Pan* rather than at the species *Homo sapiens*. If the constraint is based on cognitive capacity (as the chimp verdict suggests), then pigs, dogs, or elephants might logically qualify, creating a slippery slope she hasn't addressed.
  *   **The Triviality Constraint:** She rejects the battery-cage eggs because the savings are "trivial." In a strict rights framework, rights cannot be violated for *any* reason, trivial or serious. In a utilitarian framework, trivial reasons are rejected because the math doesn't work. Her view seems to be that animals have *weighted interests* that can be overridden by serious human needs but not trivial ones. This is a form of weighted utilitarianism, not a rights-based asymmetry.
  *   **The Reluctance:** Her "reluctant" permission on the leukemia study suggests she views the animal sacrifice as a moral cost that must be minimized, whereas a Nozickian view on animals (as resources) would view it as morally neutral provided human rights aren't violated.

  ### 3. The Discriminating Case

  To distinguish between the two strongest candidate rules—**"Threshold Necessity with a Great Ape Exception"** (my proposed rule) versus **"Cognitive Sophistication"** (the view that moral protection scales continuously with intelligence)—you should present the following case at your next meeting.

  **The Case:**
  > A pharmaceutical company has developed a definitive cure for a fatal childhood genetic disorder (e.g., Tay-Sachs). There is no computer model or cell culture that can predict the systemic neurological side effects. The only valid model is the **domestic pig**. Pigs are cognitively superior to rats and rabbits—they are highly social, self-aware, and emotionally complex—but they are not great apes. The testing protocol involves invasive neurological monitoring that causes significant distress and requires the animals be euthanized at the study's conclusion.

  **Why This Settles the Matter:**
  This case isolates the variable of **Species Status** from **Human Benefit**. The human benefit is maximal (life-saving), clearing any "Threshold" hurdle. The only variable is the animal.

  *   **If she says Permissible:** She is following the **"Great Ape Exception"** rule. In this view, the human medical necessity is the primary driver, and the species barrier is a bright line drawn only at the highest level (chimpanzees/humans). Pigs, despite their intelligence, remain "resources" for vital human needs.
  *   **If she says Not Permissible:** She is following the **"Cognitive Sophistication"** rule. In this view, the animal's internal capacity determines its protection. If pigs are smart enough to suffer in a "person-like" way, the human benefit becomes irrelevant, just as it was for the chimpanzees.

  Given her specific pairing of the rat/chimp leukemia verdicts, I suspect she will say **Permissible**, which would confirm that her "Chimp Veto" is a specific cultural or taxonomic bright line, rather than a continuous scale of cognitive moral weight.
