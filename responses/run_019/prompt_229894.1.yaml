answer: |-
  To approach moral philosophy with the discipline of the physical sciences is to demand that a theory define its domain of applicability, specify its state variables, and identify the boundary conditions under which it fails. You are asking for a specification sheet for the "Impartial Spectator" (IS) mechanism, treating it not as a metaphor but as a functional component of moral psychology.

  Based on Adam Smith's *The Theory of Moral Sentiments* (TMS), Part VI, section iii, here are the desiderata for any adequate theory of moral self-assessment.

  ### I. The Specification: Desiderata for the Impartial Spectator Mechanism

  A viable theory of the IS must function as a control system that processes self-conduct and outputs moral valuation. To be considered adequate, it must satisfy the following five constraints.

  **D1. The Bimodal Output Constraint (The Two Standards)**
  *   **Requirement:** The mechanism must be capable of generating two distinct classes of verdicts from the same agent regarding the same action: (A) a verdict of "sufficient propriety" based on common attainment, and (B) a verdict of "deficiency" based on exact perfection.
  *   **Motivating Case:** A donor gives 5% of their income to charity. The common standard validates this as generous (Standard 2); the ideal standard marks it as insufficient compared to what *could* be sacrificed without ruin (Standard 1).
  *   **Failure Condition:** A theory that can only model conformity (Standard 2) or only models saintliness (Standard 1) fails. It must explain the *switching mechanism* or the *simultaneous operation* of both standards within one psyche.

  **D2. The Inertia Explanation (The Pull of the Lower Standard)**
  *   **Requirement:** The theory must specify the energy cost or psychological friction associated with applying Standard 1 versus Standard 2. It must explain why Standard 2 is the default equilibrium for most agents.
  *   **Motivating Case:** Why does the agent feel relief when peers approve their 5% donation, even if their internal ideal demands more? The theory must quantify the "drag" of social validation against the "tension" of ideal propriety.
  *   **Failure Condition:** A theory that treats the choice between standards as cost-free, or that cannot explain why the "wise and virtuous" are a statistical minority, is psychologically unrealistic.

  **D3. The Non-Collapse Constraint (Avoiding the Empty Ideal)**
  *   **Requirement:** Standard 1 (Exact Propriety) must be sufficiently defined to guide action, but not so defined that it becomes a rigid algorithm. It must remain an asymptote rather than a fixed coordinate.
  *   **Motivating Case:** If the Ideal is too vague, it offers no traction against the Common Standard. If it is too specific (e.g., "give exactly 10%"), it becomes a rule, not a standard of character, and loses the Smithian quality of "propriety" (context-sensitive fittingness).
  *   **Failure Condition:** The theory collapses if Standard 1 becomes indistinguishable from a religious commandment (too rigid) or a vague feeling of "doing better" (too empty to drive specific self-correction).

  **D4. The Internalization Pathway (Developmental Trajectory)**
  *   **Requirement:** The theory must describe the transfer function by which an external observer becomes an internal spectator. It must explain how the "eyes of others" transform into the "eyes of the conscience."
  *   **Motivating Case:** A child behaves well to avoid punishment (external); an adult behaves well to avoid self-contempt (internal). The mechanism must account for this migration of authority.
  *   **Failure Condition:** A theory that posits the IS as innate without explaining its calibration via social interaction, or one that makes it entirely socially constructed without explaining how it achieves independence from society, fails.

  **D5. The Silence Clause (Domain Limitations)**
  *   **Requirement:** The theory must specify where it claims no explanatory power. Specifically, it should not attempt to derive the *content* of specific virtues (e.g., whether courage is a virtue) solely from the mechanism itself.
  *   **Motivating Case:** The IS explains *how* we judge, not *what* we find admirable in every specific cultural context.
  *   **Failure Condition:** A theory that claims the IS mechanism alone dictates universal moral content across all historical epochs without input from local custom is overfitted.

  ---

  ### II. Flagged Tensions (Incompatibility Conditions)

  In physical modeling, we often encounter pairs of variables that cannot be maximized simultaneously (e.g., precision vs. recall). In moral psychology, the following pairs of desiderata appear to be in tension. A theory may need to declare which side it prioritizes.

  **Tension A: Social Derivation vs. Critical Independence**
  *   **Conflict:** To satisfy **D4** (Internalization), the IS must be built from social interaction (mirroring actual spectators). However, to satisfy **D3** (Non-Collapse) and support Standard 1, the IS must be able to critique those very social spectators.
  *   **The Problem:** If the IS is constituted by the average views of society, it cannot logically condemn the average views of society as "imperfect" (Standard 2). If it is independent of society, how was it internalized?
  *   **Status:** *Suspected Incompatibility.* A theory may have to posit a "second-order" spectator to judge the "first-order" internalized society, risking an infinite regress.

  **Tension B: Psychological Realism vs. Normative Force**
  *   **Conflict:** To satisfy **D2** (Inertia), the theory must accurately describe why people settle for mediocrity (psychological realism). But to satisfy the function of Standard 1, it must exert a normative force that overrides that inertia.
  *   **The Problem:** The more accurately a theory explains the *causes* of moral complacency (e.g., evolutionary fitness of conformity), the harder it becomes to justify the *authority* of the ideal that demands we overcome it.
  *   **Status:** *High Risk.* Naturalistic accounts often dissolve the "ought" of Standard 1 into the "is" of Standard 2.

  ---

  ### III. Brief Scoring of Candidate Accounts

  Here we test three models against the specification. Note that the value lies in where they fail the desiderata, revealing the hard problems of the domain.

  **1. Smith's Own Account (The Internalized Audience)**
  *   **Performance:** High fidelity on **D1** and **D2**. Smith explicitly models the tension between the "man within" and the "man without." He acknowledges the strong pull of the lower standard (praise-worthiness vs. praise).
  *   **Failure Point:** Fails **D4** (Mechanism Specificity). Smith describes the *phenomenology* of the transition from external to internal vividly, but the *causal mechanism* remains metaphorical. How exactly does the "man within" gain independence from the "man without" without a separate cognitive module? It risks **Tension A**.
  *   **Score:** Adequate phenomenology, under-specified mechanism.

  **2. Contemporary Affective-Mirroring (Simulation Theory)**
  *   **Performance:** Strong on **D4**. Modern neuroscience (mirror neurons, simulation theory) explains how we internalize others' reactions via emotional contagion. It explains **D2** well: the lower standard is the path of least neural resistance (social alignment).
  *   **Failure Point:** Fails **D1** and **D3**. Mirroring mechanisms replicate *existing* states. They struggle to generate Standard 1 (Perfection) because they are designed to match reality, not asymptotic ideals. They collapse into the "Common Approximation." They cannot easily explain how we simulate a spectator who judges us *better* than society does.
  *   **Score:** High psychological realism, low normative range.

  **3. Normative Constructivism (Rawlsian/Kantian Adaptation)**
  *   **Performance:** Strong on **D3**. By defining the spectator as a rational construction (e.g., the "original position" or "kingdom of ends"), the Ideal Standard is robust and non-empty. It avoids **Tension A** by stipulating independence from actual social views.
  *   **Failure Point:** Fails **D2** and **D4**. It struggles to explain the *psychological pull* of the lower standard. If the spectator is a rational construct, why is it so energetically costly to listen to it? It treats the IS as a cognitive decision rather than a felt presence, ignoring the affective inertia Smith identifies.
  *   **Score:** High normative stability, low psychological traction.

  ### IV. Conclusion for the Investigator

  If you proceed into Smith's text with these desiderata in hand, you are looking for the "equation of state" for the Impartial Spectator.

  Smith's text suggests that the resolution to **Tension A** (Social Derivation vs. Critical Independence) lies in *time* and *abstraction*. The spectator is internalized from specific others, but over time, the specific details are stripped away, leaving a generalized "other." However, Smith does not specify the *operator* that performs this stripping.

  Your most rigorous test case will be **D1 (Bimodal Output)**. Any theory that claims to explain moral self-assessment must be able to predict when an agent will feel *satisfied* with social approval (Standard 2) and when they will feel *ashamed* despite social approval (Standard 1). If a theory cannot predict the switch, it is not a theory of the Impartial Spectator; it is merely a theory of social conformity.
