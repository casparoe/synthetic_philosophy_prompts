answer: |-
  Here is a sequence of ten interview questions designed to press the "Apathyl" objection against the Raw-Feel View.

  **1.** Let's begin by having you state your central thesis in the strongest possible terms. Your book argues that the badness of pain is exhausted by its phenomenal character—the "ouchiness" itself. Can you articulate for our listeners exactly what this commits you to? Is it your position that *nothing* else—no desire for it to stop, no interference with your goals, no fear of damage—adds to or subtracts from how bad a pain is, aside from how it feels in the moment?

  **2.** I want to lock in the implications of that "nothing else" claim. If I understand you correctly, on your view, two people feeling pains of identical intensity and quality are suffering identical amounts of badness, even if one is screaming in terror and the other is calmly watching TV? The psychological context is morally invisible to the badness of the pain itself?

  **3.** I'd like to introduce some clinical data that seems to challenge that invisibility. You're likely familiar with pain asymbolia, or patients under high-dose morphine. These patients often report that the pain sensation is still present—they can locate it and describe its intensity—but they consistently say, "It doesn't bother me." They stop seeking relief. On your view, how do you interpret their testimony? Are they mistaken about whether they are still suffering?

  **4.** I anticipate the reply that the morphine or the lesion must have altered the *felt quality* itself, even if the patient says it hasn't. But for the sake of this next line of questioning, I want to ask you to grant a premise that many philosophers find plausible: that the sensory-discriminative aspect (the "where and what") can be dissociated from the affective-motivational aspect (the "please stop"). If we grant that the "hurt" sensation can remain while the "aversion" vanishes, does your view force you to say the badness remains fully intact?

  **5.** Let's make that dissociation concrete with a thought experiment. Imagine a drug called "Apathyl." Apathyl is perfect and reversible. It eliminates all concern, fear, and desire for the pain to stop, but it leaves the raw felt quality of the pain—the burning, the throbbing, the intensity—completely untouched. On the Raw-Feel View, does administering Apathyl reduce the badness of the patient's condition by even a single iota?

  **6.** It seems to follow from your earlier answers that Apathyl provides no relief from suffering, because the suffering *is* the feel, and the feel is unchanged. This leads to a specific clinical conclusion: If a hospital switched all its patients from morphine to Apathyl, they would not be reducing the amount of badness in the building. Is that a conclusion you are willing to endorse?

  **7.** Let's narrow that down to a single interaction. Imagine a patient is begging for relief from agony. A doctor has two vials: Morphine (which dulls the feel) and Apathyl (which keeps the feel but removes the care). The doctor chooses Apathyl to save costs. On your view, has the doctor failed in their duty to alleviate suffering? If you say "no," aren't you redefining "suffering" in a way that contradicts the patient's own plea for help?

  **8.** You might want to draw a distinction here between "pain" and "suffering," suggesting Apathyl removes suffering but not pain. But your book argues that the *badness of pain* is the feel. So if the badness is unchanged, the moral urgency is unchanged. Why should we accept a theoretical definition of badness that tells a patient, "Your situation is just as bad as it was before," when they report feeling perfectly at peace?

  **9.** I understand that philosophical theories sometimes override common intuition. But the intuition that "uncaring pain is better than agonizing pain" is nearly universal. What theoretical virtue is strong enough to outweigh this? Why should we trust the Raw-Feel axiom more than we trust the overwhelming intuition that Apathyl would be a mercy, even if the burning remains?

  **10.** Finally, I want to ask about the limits of your commitment. We've discussed asymbolia and the Apathyl case. Is there *any* conceivable case, empirical or hypothetical, where the felt quality remains constant but you would admit the badness has decreased? If the answer is truly "no," what evidence or argument could possibly falsify the Raw-Feel View for you?

  ***

  ### Explanation of Strategy

  **Line of Attack: The Apathyl Thought Experiment**
  I chose to focus on the **Apathyl** case rather than relying solely on the empirical data of pain asymbolia. While asymbolia is the real-world anchor, it is empirically contested. Neuroscientists and philosophers often dispute whether asymbolia patients *truly* experience the same qualitative feel, or if the lesion subtly alters the phenomenology in a way the patients lack the vocabulary to describe. By moving to the **Apathyl** thought experiment (Question 5), we bypass the empirical messiness. It forces the guest to confront the *logical* implications of their view in a controlled environment where we *stipulate* that the feel is identical. This prevents the guest from retreating into "we need more MRI scans" or "the qualia actually did change."

  **Cutting Off Retreats**
  *   **Questions 1 & 2** lock the guest into a strong, exclusive claim early. This prevents them from later softening the view to say "feel is the *main* factor."
  *   **Question 4** anticipates the most common defense against asymbolia (that the feel *did* change) and asks them to grant the dissociation for the sake of argument.
  *   **Question 8** anticipates the semantic dodge of distinguishing "pain" from "suffering." Since the guest's book is about the *badness of pain*, this question forces them to admit that if badness is unchanged, the moral situation is unchanged.
  *   **Question 7** moves from abstract badness to concrete ethics. It is harder for a philosopher to defend a counterintuitive ethical outcome (the doctor did nothing wrong) than a metaphysical one.

  **Contested Empirical Claims**
  I have flagged one specific area where the questions lean on a contested reading of the data: **Question 3 and 4.**
  The questions assume the standard interpretation of pain asymbolia: that the *sensory* quality remains intact while the *affective* quality is removed. However, some proponents of the Raw-Feel View (particularly Imperativists or Strong Intentionalists) argue that the "unpleasantness" is not a separate layer added to the sensation, but is *constitutive* of the pain sensation itself. On this reading, an asymbolia patient literally does not feel "pain" in the full sense; they feel a non-aversive tactile sensation that they mislabel as pain due to past conditioning.
  By asking Question 4 ("If we grant..."), I am asking the guest to step outside their potential defense that "asymbolia isn't real pain" and engage with the conceptual possibility of the separation. If they refuse to grant the premise, the interview reveals that their view is insulated from empirical counter-evidence by definition-stipulation, which is itself a valuable revelation for the audience.
