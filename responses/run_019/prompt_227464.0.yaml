  Bottom line
  This case demonstrates that the unilateralist's curse is a structural selection effect rather than a psychological bias. Even with perfect individual calibration and sincere awareness, the mechanism selects for outlier estimates when the number of actors is uncertain. Therefore, the problem resides in the decision architecture, not the decision-makers.

  The scenario
  Five independent security researchers discover a critical vulnerability in a widely used open-source genomic sequencing library. Publishing the fix requires releasing the exploit code, risking bioweapon replication; the true net social value is -10 utility units. Each researcher independently estimates the value $V_i$ with symmetric noise (mean 0, std dev 5), so their average estimate is accurate, but individual estimates vary. They all know the unilateralist's curse and intend to subtract a penalty based on the number of competitors $N$. However, because discovery happens via private channels and forum whispers, each believes they are likely the sole discoverer ($N=1$) or one of few, never knowing others are simultaneously drafting posts. Researcher 3, whose noise term spikes their estimate to +4, calculates that even with a small $N$ penalty, the value remains positive. They publish. The others, seeing the post, abort their own drafts. The initiative launches despite collective calibration, driven not by overconfidence but by the variance in private signals combined with uncertainty about $N$.

  Calibration, verified
  Calibration holds because each researcher's error term is drawn from a distribution centered at zero. Across many vulnerabilities, the average estimated value matches the true value perfectly; no individual is systematically optimistic. In this instance, Researcher 3's estimate is high due to random noise, not structural bias. The group's aggregate judgment is accurate, but the decision rule selects the maximum estimate, not the average. Thus, the error lies in the aggregation mechanism, not the individual processors. The actors are unbiased estimators operating within a system that structurally selects for positive outliers.

  Why awareness doesn't save them
  Correcting for the curse requires adjusting one's threshold based on the number of potential actors $N$. The rational adjustment is to act only if $V_i > \text{penalty}(N)$. However, $N$ is private information; researchers cannot see others' drafts. Researcher 3 observes no public discussion and reasonably infers $N$ is small, perhaps 1 or 2. Based on this local evidence, their calculated penalty is negligible. They are not ignoring the curse; they are applying the correct formula to incorrect input data regarding $N$. They cannot distinguish themselves from the median voter because the sampling process is hidden. Awareness helps only if you know you are the most optimistic among many, but here, the structure hides the "many." Consequently, locally rational behavior leads to globally suboptimal outcomes because the variable required for correction is unknowable ex ante.

  The load-bearing feature
  The load-bearing feature is epistemic uncertainty regarding the number of capable agents $N$. If $N$ were common knowledge, calibrated agents would raise their action threshold sufficiently to neutralize the selection effect. The curse persists only because agents cannot distinguish between being the sole evaluator and being the optimistic tail of a large distribution. Remove this uncertainty, and the curse vanishes entirely, leaving no room for overconfidence to drive the outcome, proving the colleague wrong.

  The fix and its price
  Dissolving the curse requires a mandatory coordination protocol, such as a private registry where discoverers log findings before publication, triggering a cooling-off period for consensus. This pools $N$ into common knowledge, allowing correct penalty calculation. The price is speed and autonomy: critical patches might be delayed while waiting for quorum, and researchers lose the ability to act immediately on conscience. In fast-moving fields like security, this latency creates its own risks. The cure demands sacrificing unilateral agility for collective accuracy, forcing a trade-off between preventing harmful actions and enabling beneficial ones quickly.
