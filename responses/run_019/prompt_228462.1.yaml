      *   *Correction:* In #6, the user says "need to push a deploy." That implies an external constraint changed (deadline moved, bug found). If it's just "I feel like working," it's weakness. I need to make sure the distinction is clear: *External/Objective change* vs. *Internal/Subjective feeling*.
      *   *Gym (#5):* Why does it feel different? In #1, you actively circumvented. In #5, you just didn't go. It's *omission* vs. *commission*. Also, the gym membership isn't a hard block. It's a financial sink cost, not a technical barrier.

  9.  **Final Polish:**
      *   Structure: Direct answer to 2 vs 6 $\rightarrow$ The Principle $\rightarrow$ Hyperbolic Discounting $\rightarrow$ Review of other cases.
      *   Add a "Debugging Checklist" for future use.

  10. (Final thought before drafting): Make sure to validate that this is a hard philosophical problem (Akrasia) but practical heuristics exist. Don't promise a perfect solution, but a working model.

  *(Self-Correction during drafting)*: I should explicitly mention the "Ulysses Pact" concept as it maps perfectly to the website blocker. I should also clarify that Hyperbolic Discounting is a *descriptive* model of behavior, not a *normative* justification.

