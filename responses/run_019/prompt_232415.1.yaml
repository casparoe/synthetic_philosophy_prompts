answer: |-
  ### 1. Examination Question

  **Module:** Moral Responsibility and Reactive Attitudes
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. You are not required to reference specific authors, but your answer must demonstrate conceptual precision.

  **The Case:**
  Casey is discovered to have embezzled funds from a shared project. Two colleagues, Alex and Blake, both criticise Casey and demand restitution.
  *   **Alex** has embezzled funds from three previous projects. When confronted in the past, Alex denied wrongdoing and kept the money. Alex currently claims embezzlement is morally wrong.
  *   **Blake** embezzled funds from one previous project five years ago. Blake confessed, repaid the money, and has strictly adhered to the norm since, though Blake admits to occasionally feeling tempted.

  **The Question:**
  Define the concept of 'standing to blame' and explain how it differs from the truth of the moral judgement and the offender's desert. Using the case above, distinguish between two philosophical accounts of why hypocrisy might undermine standing: one focusing on the **sincerity of moral commitment**, and one focusing on **fairness or reciprocity**. Test these accounts against a variation where a blamer violates the norm through **weakness of will** rather than malice. Finally, argue whether the force of the 'look who's talking' objection is best explained by one of these accounts alone, or by both working in tandem.

  ***

  ### 2. Model Answer

  To possess standing to blame is to hold the normative authority to demand moral accountability from another agent. It is a relational property concerning the blamer's position relative to the wrongdoer, distinct from the content of the blame. Crucially, standing is not identical to the truth of the moral judgement; a hypocrite may correctly identify that embezzlement is wrong. Nor is it identical to the offender's desert; Casey may deserve blame regardless of who delivers it. Standing concerns the *right* to express the reactive attitude, not the *accuracy* of the claim or the *liability* of the target. When standing is lost, the blame becomes morally inappropriate or 'out of place', even if factually correct.

  In the provided case, Alex lacks standing, while Blake's standing is contested. To understand why, we must distinguish two accounts of how hypocrisy erodes this authority.

  The first is the **Commitment Account**. This view locates the defect in the blamer's relationship to the moral norm itself. Blame is not merely a statement of fact; it is a performance that expresses the blamer's own endorsement of the norm. When Alex criticises Casey, Alex purports to speak from a position of shared moral understanding. However, because Alex violates the norm without regret or correction, Alex's actions belie their words. The blame is rendered infelicitous because it lacks sincerity; Alex does not genuinely embody the value they claim to enforce. On this view, standing requires a minimal integrity between one's avowed values and one's conduct.

  The second is the **Fairness Account**. This view locates the defect in the relationship between the blamer and the wrongdoer. Moral norms are assumed to be binding on all participants in a moral community. By blaming Casey while exempting himself from the same sanction, Alex claims an unfair privilege. He imposes a burden on Casey that he refuses to bear himself. This violates a principle of reciprocity. On this view, standing is lost because the blamer treats the wrongdoer as a moral subordinate rather than an equal. The objection is not that Alex is insincere, but that Alex is unjust in the administration of the norm.

  These accounts diverge when tested against a harder case: a blamer, Dave, who violates the norm through **weakness of will** (akrasia). Dave steals occasionally, hates himself for it, tries to stop, and makes amends when he slips. Unlike Alex, Dave is sincerely committed to the norm (satisfying the Commitment Account). However, Dave is currently violating the norm he demands Casey follow (potentially violating the Fairness Account).

  If we rely solely on the Commitment Account, Dave retains standing. His struggle proves his endorsement of the norm; his blame of Casey is sincere. However, this seems counterintuitive. If Dave is currently stealing, his demand that Casey stop feels presumptuous. This suggests the Commitment Account is insufficient. The Fairness Account captures this intuition: Dave is claiming an exemption from the immediate force of the norm that he denies to Casey. Even if Dave regrets his weakness, he is currently asking Casey to follow a rule Dave is breaking. This implies that sincerity of attitude is not enough; one must also satisfy conditions of reciprocity to claim the authority to sanction others.

  However, the Fairness Account alone is also insufficient. Consider Blake from the original case. Blake violated the norm in the past. Strictly speaking, Blake has claimed an exemption in the past. If standing were permanently lost by any past violation (a strict reading of Fairness), Blake could never blame Casey. Yet, intuitively, Blake has standing. Blake has repented and realigned with the norm. The Fairness Account must therefore be tempered by the possibility of moral repair. Once the unfairness is addressed through apology or restitution, the reciprocal relationship is restored.

  Therefore, the force of the 'look who's talking' objection is best explained by **both accounts working in tandem**. The Fairness Account provides the structural condition for standing: one cannot claim authority while claiming an unatoned exemption. This explains why Alex and the current weak-willed Dave lack standing. The Commitment Account provides the expressive condition: one must genuinely endorse the norm to speak for it. This explains why a reformed blamer like Blake regains standing; they have restored fairness *and* demonstrate sincere commitment. Alex fails both tests: he is unfair (unrepentant) and insincere (actions deny words). Dave fails the fairness test but passes the commitment test, leaving his standing ambiguous but weakened. Blake passes both (having repaired the fairness), securing full standing.

  Neither account alone captures the full normative landscape. Fairness without Commitment reduces blame to a contractual transaction, ignoring the moral emotion involved. Commitment without Fairness reduces blame to personal expression, ignoring the interpersonal authority required to hold others accountable. The 'look who's talking' objection bites hardest when both conditions are violated, as with Alex.

  **What would change this answer**
  This answer relies on the assumption that blame is fundamentally a retrospective, retributive, or communicative practice grounded in moral equality. If a **forward-looking, consequentialist account of blame** were true, the central claim would fail. On a consequentialist view, the only metric for blame is its efficacy in modifying behavior or protecting society. If Alex's hypocrisy does not reduce the efficacy of his criticism in deterring Casey, Alex retains standing. Under this framework, 'standing' collapses into 'utility', and the moral objections regarding fairness or sincerity become irrelevant unless they instrumentally hinder the desired outcome. If this account of blame is correct, my distinction between Commitment and Fairness is merely aesthetic, not normative.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25

  | Must-Hit Move | Marks | Typical Candidate Error |
  | :--- | :---: | :--- |
  | **1. Definition of Standing:** Clearly distinguishes standing from the truth of the judgement and the offender's desert, defining it as a normative authority or right. | 5 | Candidates often conflate standing with the truth of the accusation, arguing that because the hypocrite is right, they have standing. |
  | **2. Account 1 (Commitment):** Accurately articulates the view that hypocrisy undermines standing by revealing a lack of sincere endorsement or integrity regarding the norm. | 5 | Candidates describe this as merely "lying" rather than a failure of the expressive function of blame. |
  | **3. Account 2 (Fairness):** Accurately articulates the view that hypocrisy undermines standing by claiming an unfair exemption from a shared normative burden. | 5 | Candidates treat this as simple "jealousy" rather than a violation of moral reciprocity or equality. |
  | **4. Application to Hard Case:** Successfully tests the accounts against the weakness of will/reform variation (e.g., Dave or Blake) to show where one account succeeds and the other struggles. | 5 | Candidates apply the theories only to the original case (Alex) and fail to adjust the reasoning for the 'harder' variation. |
  | **5. Evaluative Conclusion:** Provides a reasoned argument for whether one or both accounts explain the objection, rather than simply listing them or sitting on the fence without justification. | 5 | Candidates conclude that "both are important" without explaining *how* they interact or which does the heavier lifting. |

  **Note on the 'What would change this answer' paragraph:** While not assigned specific marks, examiners should look for this paragraph as a discriminator for First-Class performance. Its absence should not penalise the score if the 5 moves are met, but its presence confirms the depth required for the highest band within the allocated marks.
