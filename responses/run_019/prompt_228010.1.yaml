      *   *Refining the "Verbal Dispute":* Make sure to explicitly state that once we strip the Popper/Lakatos jargon, the real fight is about *progressiveness* of the research programme.

  9.  **Final Review:** Does this look like a document two philosophers/social scientists would sign after a semester of debate? Yes. It acknowledges common ground while sharply defining the fault lines.

