answer: |-
  ### The Principle of Evidentiary Coherence

  Your current heuristic ("defer to consensus unless extraordinary evidence") fails because it treats history as a static courtroom rather than a dynamic investigative process. It cannot account for legitimate paradigm shifts (Monte Verde) because, by definition, paradigm shifts *violate* the consensus before they become the new consensus.

  Based on your verdicts, your actual operating framework is not about consensus, but about **how claims interact with the existing web of evidence.** I propose the **Principle of Evidentiary Coherence**. This principle does not ask "Is this mainstream?" but rather "Does this claim add to the historical record without requiring the destruction of the tools we use to measure it?"

  It consists of three clauses:

  **1. The Clause of Material Anchoring**
  *   **Definition:** A claim is admissible only if it is grounded in physical evidence (artifacts, stratigraphy, ecofacts, genetic data) that is subject to independent verification and falsification. Claims based primarily on textual reinterpretation, mythological alignment, or "anomalies" without context are inadmissible.
  *   **Motivating Cases:**
      *   **Motivates Acceptance:** **Monte Verde.** It was rejected by consensus for years, but it relied on stratigraphy and tools that could be re-tested. It was *anchored*.
      *   **Motivates Rejection:** **Plato's Atlantis** and **Bosnian Pyramids.** Atlantis lacks a geographic anchor that matches the description without massive allegorical stretching; the Bosnian "pyramids" are natural formations where the "evidence" is the shape itself, not material culture found within a human-made context.

  **2. The Clause of Conservative Revision**
  *   **Definition:** A claim may challenge specific historical timelines or connections, but it cannot require the systematic invalidation of independent, cross-verified dating methods (e.g., dendrochronology, radiocarbon, ice cores) or posit global conspiracies to explain the absence of evidence.
  *   **Motivating Cases:**
      *   **Motivates Acceptance:** **Polynesian-South American Contact.** This adds a connection (trade/voyage) without requiring us to delete centuries of history or assume all carbon dating in the Pacific is wrong.
      *   **Motivates Rejection:** **Fomenko's New Chronology.** To accept this, one must believe that all radiocarbon dating, dendrochronology, and written records across Eurasia are part of a coordinated fabrication. It is subtractive (deleting time) rather than additive.

  **3. The Clause of Capacity Plausibility**
  *   **Definition:** Explanations for historical phenomena must rely on human agency and technologies demonstrably available to or inferable for the people in question. Claims that deny human capacity in favor of external intervention or "lost super-science" are inadmissible.
  *   **Motivating Cases:**
      *   **Motivates Acceptance:** **L'Anse aux Meadows** and **Troy.** Both were once considered myth, but both posited that humans built settlements and sailed ships. The mechanisms were human-scale.
      *   **Motivates Rejection:** **Ancient Astronauts** and **Graham Hancock's "Teachers."** The Ancient Astronaut hypothesis denies human capacity entirely. Hancock's hypothesis posits a "lost civilization" with advanced knowledge that left no material trace of its infrastructure, which violates the expectation that complex societies leave debris.

  ---

  ### The Verdict You Should Give Up

  If forced to choose one verdict to surrender to maintain the integrity of this principle, you should give up the **categorical "No" on Graham Hancock's chronological claims**, while maintaining the "No" on his *mechanism*.

  **Why:** Your rejection of Hancock is currently bundled: you reject the idea of an Ice Age civilization *and* the idea that it taught agriculture. However, recent archaeological findings (e.g., the White Sands footprints in North America, Göbekli Tepe in Turkey) have validated the *chronological* core of the "fringe" argument: humans were present and capable of complex organization earlier than the mid-20th-century consensus allowed.
  *   **The Conflict:** Your acceptance of **Monte Verde** admits that the "Consensus Timeline" was wrong about human presence in the Americas. Hancock argues the consensus timeline is wrong about human presence globally.
  *   **The Adjustment:** You should not allow the "Lost Teacher Civilization" claim (violates **Capacity Plausibility** and **Material Anchoring**—where are their cities?). However, you should allow discussion on **pre-Holocene human complexity** as a "Falsifiable but Unevidenced" hypothesis. By categorically saying "No" to Hancock, you risk grouping legitimate chronological revisionism (like Monte Verde) with pseudoscientific diffusionism. Split the verdict: **Yes** to "Older Sites," **No** to "Lost Mentors."

  ---

  ### Application to New Cases

  **1. The Younger Dryas Impact Hypothesis**
  *   **Verdict:** **Allow as Debate (Falsifiable but Unevidenced).**
  *   **Analysis:**
      *   *Material Anchoring:* Proponents cite nanodiamonds and sediment layers (physical evidence), though these are contested by geologists.
      *   *Conservative Revision:* It challenges climate models but does not require deleting recorded history or positing conspiracies.
      *   *Capacity Plausibility:* It posits a natural disaster, not human agency, so it passes.
      *   *Moderation:* Do not allow threads stating it as fact. Allow threads discussing the *evidence* (sediment layers) but require citation of peer-reviewed geology. It sits in the same bucket as Polynesian Contact: a live scientific dispute, not settled pseudoscience.

  **2. Homo naledi Deliberate Burial**
  *   **Verdict:** **Allow as Active Science.**
  *   **Analysis:**
      *   *Material Anchoring:* Strong. Based on the spatial arrangement of bones in the Rising Star cave system.
      *   *Conservative Revision:* Challenges the timeline of cognitive evolution (burial was thought unique to *Homo sapiens* or Neanderthals), but does not break dating methods.
      *   *Capacity Plausibility:* Posits cognitive capacity in a hominin relative. This is a biological question, not a "lost civ" question.
      *   *Moderation:* This is mainstream paleoanthropology, even if controversial. Treat it like Monte Verde. It relies on physical arrangement of remains subject to verification.

  **3. The Voynich Manuscript**
  *   **Verdict:** **Restrict (Mostly Unfalsifiable).**
  *   **Analysis:**
      *   *Material Anchoring:* The book exists (physical), but claims about its *meaning* are linguistic.
      *   *Unfalsifiability:* Most claims about the Voynich ("It's Aztec," "It's a Cipher," "It's Hildegard von Bingen") are unfalsifiable because there is no Rosetta Stone. Any failure to decode it is blamed on "not trying hard enough" or "lost key."
      *   *Moderation:* Allow discussion of the *physical history* (carbon dating, provenance). Restrict threads claiming to have "solved" it unless they provide a translation that consistently maps to the text (Material Anchoring of meaning). Most "solutions" are pseudohistory because they cannot be independently verified.

  ---

  ### Unfalsifiable vs. Falsifiable but Unevidenced

  There is a principled difference, and it is the most important tool in your moderation kit.

  *   **Falsifiable but Unevidenced:** The claim specifies what *would* disprove it, and that evidence is theoretically obtainable.
      *   *Example:* **Polynesian Contact.** If we find definitive ancient DNA showing no pre-Columbian admixture, or prove the sweet potato arrived via drift seeds without human help, the claim dies.
      *   *Example:* **Monte Verde (pre-1990).** If the tools were shown to be natural rocks or the stratigraphy was shown to be disturbed, the claim would die.
      *   *Moderation Action:* **Lock/Archive.** These discussions are valid but speculative. They belong in "Hypothesis" threads, not "Fact" threads.

  *   **Unfalsifiable:** The claim is structured so that any lack of evidence is interpreted as proof of the claim's sophistication or the depth of the conspiracy.
      *   *Example:* **Fomenko.** Why are there no contemporary records? "They were forged." Why does radiocarbon dating disagree? "It's calibrated wrong by the conspirators."
      *   *Example:* **Ancient Astronauts.** Why is there no alien tech? "They took it with them."
      *   *Moderation Action:* **Remove.** These discussions cannot progress because they reject the rules of evidence required to have a discussion.

  **Where it does real work in your list:**
  This distinction explains why you feel **no obligation to read Fomenko** but feel **obliged to consider Polynesian Contact**.
  *   Fomenko is **unfalsifiable**. Reading the books will not yield evidence, only further rationalizations for the lack of evidence.
  *   Polynesian Contact is **falsifiable**. Reading the genetic studies yields data that could confirm or deny the hypothesis.
  *   **Hancock** sits on the border. The "Lost Civilization" is unfalsifiable (no ruins = they hid them/eroded). The "Older Dates" are falsifiable (dig sites). This confirms why you should split that verdict: reject the unfalsifiable mechanism, allow the falsifiable chronological challenge.
