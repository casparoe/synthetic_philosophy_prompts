          5.  Tone: Practical, empowering, critical but realistic for high schoolers.

  2.  **Deconstruct "Politics in Artifacts" (Winner's Framework):**
      *   *Type 1:* Artifacts that require specific social arrangements to function (e.g., nuclear power requires hierarchical security).
      *   *Type 2:* Artifacts that are compatible with many social arrangements but are *used* to enforce a specific one (e.g., the low bridges).
      *   *Key Insight:* Technology isn't neutral. It encodes values (efficiency, control, privacy, equity).
      *   *Student Context:* The "politics" here are about power dynamics between admin and students, equity among students, and privacy vs. safety.

  3.  **Drafting the Procedure (The "20-Minute Politics Check"):**
      *   *Time Management:* 20 minutes is tight. Need 4-5 distinct phases.
      *   *Phase 1: The Stated Goal (2 mins).* What do they say it does?
      *   *Phase 2: The Hidden Rule (5 mins).* Who gains power? Who loses it? (The Winner Test).
      *   *Phase 3: The Exclusion Test (5 mins).* Who gets left out or flagged? (The Bridge Test).
      *   *Phase 4: The Reversibility Test (5 mins).* Can we turn it off? Is it permanent?
      *   *Phase 5: The Verdict (3 mins).* Yes, No, or Escalate.
      *   *Stop Conditions:* If a question reveals a hard-coded bias that contradicts school values -> Stop/No. If it's a genuine value trade-off -> Escalate.

  4.  **Refining the Questions & Criteria:**
      *   *Q1 (Purpose):* Is the problem real? (Prevents solutionism).
