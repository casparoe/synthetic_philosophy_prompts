      *   *Q3 (Equity):* Does this disproportionately burden a specific group? (The "Low Bridge" equivalent).
      *   *Q4 (Exit):* Can we opt-out?
      *   *Good Answer:* Specific, acknowledges trade-offs.
      *   *Bad Answer:* "It's just safer," "Trust the vendor."
      *   *Stop/No:* If it hard-codes discrimination or removes due process.
      *   *Escalate:* If it's a value judgment (e.g., Privacy vs. Safety) that the whole student body should decide.

