          *   *Case-to-Theory Pressure:* Does the lack of a welfare state matter? Nye says yes, duty is defined by *existing* formal rules. If the rules didn't mandate welfare, providing it via patronage is still a deviation from the rule of impersonal administration. It highlights that "public duty" is historically contingent.

      *   **Theory 2: Anthropological/Moral-Economy:**
          *   *Definition:* Corruption is a violation of reciprocal obligations within a network. Patronage is a valid social order.
          *   *Theory-to-Case:* Much of Tammany is *legitimate*. The boss gives turkey/jobs; the voter gives loyalty. This is a fulfilled contract. Corruption occurs only if the boss takes the vote and doesn't deliver the coal, or the voter takes the coal and votes Republican.
