          *   *Synthesis:* Tammany suggests the "universal" standard is actually a specific historical settlement (impersonal bureaucracy vs. personalism) that won out in the West first. It doesn't prove the standard is metaphysically universal, but it proves it isn't just an external imposition on the "Global South."
