          *   *Surprise/Blind Spot:* It distinguishes between types of private gain that Nye lumps together. It treats political knowledge as a form of capital.
          *   *Case-to-Theory Pressure:* The Source of Opportunity. Plunkitt claims the opportunity exists because he is "in the know." But he is "in the know" because he controls the public decision. The "honest" graft relies on the distortion of public planning. The line collapses if the public decision was made to generate the graft.
