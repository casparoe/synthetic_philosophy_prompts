      *   *Specific Check on Moral Economy:* Ensure I highlight the exclusion of outsiders. This is the weak point of the moral economy defense.
      *   *Specific Check on Plunkitt:* Make sure to analyze the *normative* claim, not just dismiss it as hypocrisy.
      *   *Specific Check on Universality:* Be careful not to say "Universalism won." Say "Universalism emerged locally." Distinguish between *origin* and *validity*.

  4.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* I initially thought about saying Nye's definition fails because it ignores welfare. I need to be more precise: Nye's definition *condemns* the welfare provision because it's partisan. The tension is between *substantive* good (feeding people) and *procedural* rectitude (impersonal rules).
      *   *Correction:* On the universality point, I need to make sure I don't conflate "Western" with "Universal." Tammany shows that "Western" societies had to transition to these standards too. It undermines the idea that non-Western societies are uniquely prone to clientelism.
