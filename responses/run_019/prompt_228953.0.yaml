  2. To fill this gap, we can coin the term **"Narrative Confound"** to label cases where persuasive force derives from story details that should be logically irrelevant.
  3. This phenomenon arises when changing superficial descriptors alters the intuitive verdict, revealing that the argument relies on psychological triggers rather than the proposed principle.
  4. It differs from framing effects because the logical content remains constant while the narrative texture shifts. It is also more specific than "intuition pump" by targeting the irrelevant details specifically.
  5. For example, changing a victim's name is too trivial to count, but changing a lever to a footbridge introduces a "personal force" variable that constitutes a genuine narrative confound.
