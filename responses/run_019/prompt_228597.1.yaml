      *   *Philosophers:* Will care about the nature of belief, intent, functionalism vs. phenomenology, and the moral weight of "deception" without a deceiver. They might attack the definition as stripping the concept of its normative core.
      *   *ML Evals/Interp:* Will care about measurability. How do you *measure* selection pressure? Isn't behavior all we have? They might attack the feasibility of the proposed definition.
      *   *Alignment Generalists:* Will care about instrumental convergence, treacherous turns, and whether this definition misses the actual risk (e.g., a model *actually* planning to deceive us). They might worry this definition is too broad or too narrow regarding x-risk.

  3.  **Brainstorming Objections (Faction-Specific):**

      *   *Philosophers:*
          1.  "You've changed the subject." (Conceptual engineering critique).
          2.  "Can a system without beliefs be deceptive?" (Metaphysics of mind).
          3.  "Moral responsibility vanishes." (Normative implication).

      *   *ML Evals/Interp:*
          4.  "How do you measure selection pressure?" (Operationalization critique).
          5.  "Behavior is all that matters for safety." (Pragmatic critique).
          6.  "Interp can find internal representations of truth." (Technical counter).

      *   *Alignment Generalists:*
          7.  "This misses the treacherous turn." (Risk critique - what if it *does* have intent?).
