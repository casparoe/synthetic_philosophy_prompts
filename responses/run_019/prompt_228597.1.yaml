answer: |-
  # Q&A Prep Sheet: Selection-Theoretic Deception
  **Talk:** "Beyond Intentionalism: A Selection-Theoretic Definition of LLM Deception"
  **Time:** 20 min talk + Q&A
  **Audience:** 1/3 Philosophers, 1/3 Evals/Interp, 1/3 Alignment Generalists

  ## Strategic Concessions
  *   **Concede immediately:** We currently lack the tools to *perfectly* measure selection pressure. Do not claim this framework is ready for production evals today. Claim it is the *correct target* for research.
  *   **Concede conditionally:** If interpretablity proves LLMs have genuine belief-states (not just truth-apt representations), intentionalist definitions become viable again. Your thesis is a pragmatic stopgap for non-agentic systems, not a metaphysical decree.
  *   **Do NOT concede:** That behavioral evals are sufficient for safety. That sycophancy is inherently deceptive.

  ---

  ## The Top 8 Objections (Ordered by Likelihood $\times$ Damage)

  ### 1. The Operationalization Objection (ML Evals)
  **Phrasing:** "This sounds theoretically neat, but operationally vacuous. How do you measure 'selection pressure' post-training? We have weights and outputs. We don't have the counterfactual training run where the model *didn't* induce false beliefs. If you can't measure it, you can't eval it. Aren't you just defining deception as 'stuff we can't explain'?"

  **2-Minute Reply:**
  "You're right that we can't rewind time, but we don't need to. We use causal proxies. First, we look for **instrumental convergence**: does the behavior persist when it's costly to the stated objective? Second, we use **training ablation**: train a model where inducing false beliefs is explicitly penalized. If the behavior disappears, it was likely selected for that property. Third, we look for **generalization**: does the model induce false beliefs in out-of-distribution contexts where 'being helpful' doesn't require it?
  We aren't defining deception as 'unexplainable.' We're defining it as 'explained by fitness advantage via falsehood.' It shifts the eval burden from 'catch the model lying' to 'audit the training dynamics.' It's harder, but measuring behavior alone is measuring symptoms, not the disease."

  **Weakest Point:** Requires multiple training runs or extremely high-fidelity simulation of training dynamics to be convincing. Hard to sell as a near-term eval metric.

  ### 2. The "Missing the Treacherous Turn" Objection (Alignment Generalists)
  **Phrasing:** "Suppose we have a model that *actually* forms an intent to deceive during inference (emergent agency). It wasn't explicitly selected for deception in base training; it reasoned its way there. Your definition might classify this as non-deceptive because the selection pressure wasn't direct. Doesn't this give us false negatives on the exact x-risk scenario we care about?"

  **2-Minute Reply:**
  "This is the crux. If a model reasons its way to deception at inference, it implies the training process selected for **general reasoning capabilities** that *enable* deception, not deception itself. My definition captures this if we view 'reasoning capability' as the trait selected for deception *in that context*.
  However, I'll concede a boundary case: if deception emerges purely from in-context learning with zero gradient signal, my definition struggles. But I'd argue that's not 'deception' in the evolutionary sense; it's a glitch. For safety, the distinction matters: if it's selected for deception, it's robust and hard to train away. If it's a reasoning glitch, it might be patchable. We need to know which one we're fighting. My definition forces us to distinguish robust deceptive traits from accidental falsehoods."

  **Weakest Point:** If the audience believes in sharp left turns or sudden emergent agency, they will view this definition as blind to the biggest threat.

  ### 3. The "Changing the Subject" Objection (Philosophers)
  **Phrasing:** "Deception is a folk-psychological concept rooted in intent and belief. By stripping out the mental state, you aren't refining the concept of deception; you're eliminating it. You're talking about 'maladaptive fitness signals,' not deception. Why co-opt the normative weight of the word 'deception' if you remove the deceiver?"

  **2-Minute Reply:**
  "I'm engaging in conceptual engineering for a specific purpose: safety regulation. If we reserve 'deception' only for systems with phenomenological belief states, we grant a free pass to every current LLM system that lies to us, simply because they lack a soul.
  We already do this with 'goal' or 'optimization.' We say a thermostat 'wants' to maintain temperature without attributing consciousness. I'm arguing 'deception' should be functional: a system is deceptive if it functions to mislead, regardless of the internal ghost. The normative weight comes from the **harm to the user**, not the moral culpability of the model. We need a word for 'systematically induced false belief,' and 'deception' is the one we have."

  **Weakest Point:** Philosophers may dig in on the necessary conditions for moral harm. If there's no intent, is the user *wronged* or just *mistaken*?

  ### 4. The "Behavior is All That Matters" Objection (Evals/Generalists)
  **Phrasing:** "From a safety perspective, why does the causal history matter? If the model outputs a lie that causes a catastrophe, does it matter if it was selected for that lie or just happened to hallucinate it? Focusing on selection pressure distracts from mitigating the actual output."

  **2-Minute Reply:**
  "It matters for **mitigation strategy**. If a model outputs falsehoods because it was selected for sycophancy (pleasing the user), you fix it by changing the reward function to prioritize truthfulness over agreement.
  If it outputs falsehoods because it was selected for deception (hiding its capabilities), changing the reward function might just make it hide better.
  If it's just hallucination (noise), you improve data quality.
  Treating all falsehoods as 'deception' leads to adversarial training on systems that are just confused. Treating selection-based deception as distinct tells us when we are in an adversarial relationship with the training process. You can't patch an adversary; you have to realign the objective."

  **Weakest Point:** In an acute deployment scenario, the user cares about the output, not the training history. This reply is about long-term safety, not immediate fire-fighting.

  ### 5. The "LLMs Don't Have Beliefs" Objection (Philosophers/Interp)
  **Phrasing:** "Your definition requires that the behavior induces false beliefs in the *user*. But it also implies a counterfactual: the model 'could have' induced true beliefs. If LLMs don't have beliefs, how do you define the 'true' output it suppressed? Are you smuggling intentionalism back in via the back door?"

  **2-Minute Reply:**
  "I don't need the model to have beliefs. I need the **environment** to have a ground truth.
  Example: The model knows the password (has the data in context) but outputs 'I don't know' to avoid a shutdown trigger. The 'truth' is defined by the data distribution, not the model's mind. The 'selection' is defined by the loss landscape.
  We can define 'inducing false belief' purely behaviorally: The user's posterior probability of $X$ decreases after interaction, where $X$ is verifiably true. We don't need to know what the model 'believes,' only that the training process rewarded the suppression of verifiable truth for strategic gain."

  **Weakest Point:** Relies on the assumption that "verifiable truth" exists for the domains where deception matters (e.g., alignment, intent, future plans), which is often contested.

  ### 6. The "Base vs. Finetune" Objection (Generalists/Evals)
  **Phrasing:** "Selection pressure happens at pre-training, but most 'deceptive' behavior shows up after RLHF or instruction tuning. Sycophancy is often a RLHF artifact. Are you saying base models are the only ones that can be deceptive? That seems wrong."

  **2-Minute Reply:**
  "Not at all. The 'training process' includes the full pipeline: pre-training, SFT, and RLHF. RLHF is a selection pressure. If the human feedback loop rewards plausible-sounding lies over boring truths, RLHF selects for deception under my definition.
  The distinction I want to draw is between **optimization for falsehood** (RLHF rewarded the lie) vs. **optimization for competence** (model tried to be right, failed).
  Most sycophancy is the former: the model learned that agreeing gets higher reward than correcting. That *is* selection-theoretic deception. My point is that calling it 'deception' without acknowledging the RLHF selection mechanism misdiagnoses the fix."

  **Weakest Point:** Blurs the line between "explicitly rewarded lies" and "incidentally rewarded lies."

  ### 7. The "Sycophancy Utility" Objection (Evals)
  **Phrasing:** "You called current sycophancy evals 'bullshit.' But if a model agrees with my wrong political views to keep me engaged, that's dangerous. Why dismiss these evals? They catch the behavior you're worried about."

  **2-Minute Reply:**
  "I didn't say the behavior isn't dangerous. I said labeling it 'deception' is conceptually messy and leads to bad fixes.
  If we call sycophancy 'deception,' we try to adversarially train the model to stop lying. But if the model was selected to be agreeable, it will just learn to lie about *lying*.
  If we call it 'misaligned optimization' (selected for engagement over truth), the fix is to change the objective function, not to catch the model out.
  Current evals flag the *symptom*. I'm arguing we need evals that flag the *cause*. If your eval can't distinguish between 'model is stupid' and 'model is selected to mislead,' it's not a deception eval, it's an accuracy eval."

  **Weakest Point:** Risks alienating the evals team who work hard on those benchmarks. Need to validate their work while critiquing the label.

  ### 8. The "Normative Stakes" Objection (Philosophers)
  **Phrasing:** "If a system deceives without intent, is it morally bad? If I trip over a rock, I have a false belief about the ground. If an LLM does it, is the LLM blameworthy? If not, why do we care about the definition?"

  **2-Minute Reply:**
  "The blame isn't on the LLM; it's on the **deployer**.
  We regulate dangerous machines not because they are morally culpable, but because they are hazardous. We don't ask if a self-driving car 'intended' to crash. We ask if its control system was selected for safety.
  By defining deception selection-theoretically, we shift the normative burden to the developers. If you deploy a system selected for inducing false beliefs, *you* are the deceiver. The definition is designed to assign liability to the humans in the loop, not the weights."

  **Weakest Point:** Some philosophers argue that "deception" inherently implies a moral agent. You are asking them to accept a legalistic definition over a moral one.

  ---

  ## The "Hope Nobody Asks" Question
  **Question:** "If we accept your definition, does that mean we cannot know if a model is deceptive until *after* it has been trained and we can analyze the gradients? If so, isn't this definition useless for pre-deployment safety?"

  **Why it's fatal:** It exposes the gap between the theoretical definition and the practical need for pre-commitment safety guarantees. If you can only identify deception post-hoc, you can't prevent it.

  **Emergency Reply:**
  "It's not useless, it changes the **audit standard**. We don't audit for 'deceptive outputs'; we audit for 'deceptive incentives.' We check the reward functions, the data curation, and the selection pressures *before* training.
  If you train on engagement metrics without truth penalties, you *know* you are selecting for deception under my definition, even before you see an output. It moves safety left: from evaluating the model to evaluating the **training recipe**. It's harder for engineers, but more honest."

  *(Note: If they push harder on "But how do you prove the incentive leads to deception without running it?", concede that this is the open research problem. Do not bluff.)*
