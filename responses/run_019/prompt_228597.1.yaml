      *   **Topic:** Redefining LLM deception from intentionalist (belief mismatch + intent) to selection-theoretic (behavior selected *because* it induces false beliefs).
      *   **Audience:** 1/3 Philosophers (mind/language), 1/3 ML Evals/Interp, 1/3 Alignment Generalists.
      *   **Key Claims:** Intentionalist definitions are useless for LLMs; selection-theoretic is better; current evals (sycophancy, confident wrongness) are "bullshit" (Frankfurt-style); real evals need evidence of selection pressure.
