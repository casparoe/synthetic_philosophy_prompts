answer: |-
  You press me hard, and I will concede this: if you read me as a legislator offering a design for the republic, I contradict myself. But I am no architect of Babylon; I am a physician diagnosing a fever. The union of true justice and physical force is indeed impossible for fallen man, for our justice is but custom dressed up, and our force is but brutality glorified by imagination. I do not counsel the impossible to be done; I show the impossible is desired, so that you might feel the wretchedness of your condition.

  You ask what work the counsel does? It strips the mask from authority. We obey kings not because they are just, but because they hold the sword, and imagination persuades us to call this right. If you think I advise you to rest content with this arrangement, you have not read me closely. I show you that human justice is a shadow so that you might hunger for the substance which is not of this world. Is it not better to know the lie than to sleep within it?
