  Here is an analysis of your philosopher friend's moral framework, reconstructed from her seven prior verdicts, followed by a prediction for the drone dilemma.

  ### Three Reconstructed Principles

  To maintain consistency with all seven prior verdicts, your friend's moral logic appears to rest on three distinct, interacting principles. These distinguish between the *source* of the resources, the *nature* of the obligation, and the *scope* of the agent's agency.

  **1. The Principle of Moderate Self-Sacrifice**
  *   **Formulation:** An agent is morally required to sacrifice their own resources (money, time, comfort, property) to prevent death or severe harm, provided the cost to the agent is not excessive (e.g., life-threatening risk) and the efficacy of the aid is reasonably certain.
  *   **Fits Verdicts:** 1 (Suit), 2 (Risk limit), 3 (Donation), 4 (Statistical donation), 6 (Dinner).
  *   **Logic:** This is the core Singer-esque obligation. It establishes a positive duty to assist using *what belongs to the agent*. It explains why she must ruin her suit (1) or donate her money (3, 4), but why she need not risk her life (2).

  **2. The Principle of Non-Aggression and Assignment**
  *   **Formulation:** An agent is forbidden from violating the property rights or express refusals of others to facilitate rescue, even if doing so would maximize overall welfare. Furthermore, resources already assigned to a specific beneficiary generate a claim that cannot be overridden by marginal utility gains.
  *   **Fits Verdicts:** 5 (Stealing), 4 (implies donation is voluntary assignment, not seizure).
  *   **Logic:** This is the deontological constraint. It explains the asymmetry between Case 3 (donating own money is required) and Case 5 (stealing billionaire's money is forbidden). It establishes a "side-constraint" on the Principle of Self-Sacrifice: you must give your own, but you cannot take another's.

  **3. The Principle of Proximate Agency**
  *   **Formulation:** When an agent is physically present at an immediate emergency, they are required to prioritize the identifiable life before them over distant statistical lives, even if the distant rescue would save a greater number of people.
  *   **Fits Verdicts:** 1 (Child in pond), 7 (One before her vs. Two abroad).
  *   **Logic:** This modifies the utilitarian calculus. It explains Case 7, where she rejects pure expected-utility maximization (1 life < 2 lives) in favor of the "special responsibility" created by physical proximity. It treats the "child before her" as having a priority claim on her *personal agency*.

  ***

  ### Predictions for the Drone Case

  Here is how each principle applies to the dilemma of rerouting the medical drone (Child A: 10%→90% vs. Child B: 70%→20%).

