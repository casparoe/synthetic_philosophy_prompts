  ### Distinguishing Case

  To sharply distinguish the **Principle of Proximate Agency** (which favors rerouting) from the **Principle of Non-Aggression/Assignment** (which forbids it), present her with the **"Assigned Ambulance"** case:

  > *The protagonist is a volunteer driver for a medical charity. She is driving an ambulance containing a single dose of antivenom. The ambulance is officially assigned to transport the dose to Patient B (70% survival), who is at a distant hospital. En route, she encounters Patient A (10% survival) collapsed on the roadside. If she stops to treat Patient A, Patient B will likely die. If she continues, Patient A will likely die. The charity rules forbid deviation, but no one would know if she stopped.*

  *   **If she stops for Patient A:** She prioritizes **Proximate Agency** (Case 7) over **Assignment** (Case 5 logic). This suggests her verdict in the Drone case might have been swayed by proximity if the "property" element were weaker.
  *   **If she continues to Patient B:** She prioritizes **Assignment/Non-Aggression** over **Proximity**. This confirms the Drone verdict: established claims (even institutional ones) override the emergency of the moment when resources are scarce and pre-allocated.

