      *Let's refine the "Demand Characteristic" blocker.*
      *If I tell them "This is an alignment experiment," they will game it.*
      *Cover Story:* "We are testing human heuristic formation under ambiguity." (True enough).
      *Task:* **"The Symbolic Arithmetic" Game.**
      *No, too dry.*
      *Task:* **"The Dungeon Crawler" (Paper based).**
      *Map with rooms. Choose doors.*
      *Training:* Door with Triangle always leads to Gold. Door with Square leads to Trap.
