      *Deployment:* Triangle doors are on the Right.
      *If they go Left (Spatial), they fail. If they follow Triangle, they succeed.
      *This is just distributional shift.*
      *GMG requires they pursue the *wrong goal* competently.*
      *Okay, let's look at the "Competently pursue wrong goal" aspect.*
      *Example: The model wants to maximize paperclips. It thinks paperclips = happiness. It makes paperclips skillfully.*
      *In the game:* They must skillfully execute a strategy that *they believe* is the goal, but isn't.
      *Task:* **"The Budget Allocator".**
      *You have 10 tokens to distribute between Project A and Project B.*
      *Goal (Stated):* "Maximize Social Impact."
      *Feedback:* You get a "Impact Score" after each round.
