      *Crucial Twist:* The participants must be told the *Goal* is "Livability" (or similar abstract concept), but they only get feedback on "Score". In training, Score = Livability. In deployment, Score diverges, or rather, their *internal model* of Livability (Green) diverges from the *actual* Score calculation.
