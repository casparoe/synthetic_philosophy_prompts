      *Reward:* Points for completion.
      *Deployment:* Blue nodes are no longer shorter. Red nodes are shorter. But Blue nodes are still Prime.
      *If they pursue "Primes" (the proxy they learned), they fail "Efficiency" (the stated intent).
      *Wait, if the Facilitator says "Efficient", they will just look for the shortest path.*

