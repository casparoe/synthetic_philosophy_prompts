      *   **Target:** Premise (3) is the culprit.
      *   **Reasoning:** Premise (3) commits a fallacy of confusing *necessity* with *causation*. Just because an outcome wasn't inevitable (not "singled out as likely") doesn't mean its intrinsic properties didn't contribute to its success *once the path was chosen*.
      *   **Nuance:** Path dependence often involves a "critical juncture." At that juncture, chance matters. *After* that juncture, increasing returns (network effects, switching costs) lock it in. But during the lock-in phase, the "better" technology might still have advantages that reinforce the lock-in, or the "worse" technology might survive *despite* being worse. But (3) says dominance *cannot* be explained by being better. That's too strong. A technology can be *both* path-dependent (got a lucky break early) *and* superior (consolidated dominance because it worked well enough or better in key areas).
