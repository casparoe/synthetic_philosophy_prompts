      *   *Crucial Distinction:* **Necessary vs. Sufficient.** Being "better" is rarely *sufficient* for dominance (hence openness/contingency). But it can be *necessary* for *sustained* dominance, or a contributing factor. Premise (3) treats "being better" as if it implies "inevitability."

  7.  **Finalizing the Argument Structure:**
