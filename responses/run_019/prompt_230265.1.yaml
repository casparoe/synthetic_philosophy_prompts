      *   *Premise (3):* **The Weak Link.** "If at the time of its early causes an outcome was not already singled out as the likely result, then the outcome's later dominance cannot be explained by that outcome's being better than the alternatives."
          *   *Why is this weak?* It conflates *ex ante* probability with *ex post* fitness. Just because an outcome wasn't *guaranteed* or even *probable* at the start doesn't mean it didn't possess superior qualities that helped it survive and dominate *after* the initial contingency.
          *   *Example:* QWERTY vs. Dvorak. QWERTY might have won due to early accident (path dependence). But maybe it *also* had some minor durability advantage, or maybe the "accident" just gave it the initial market share, but its "good enough" status kept it there.
          *   *Better Example:* VHS vs. Betamax. VHS won partly due to porn industry adoption (contingent/accidental). But VHS tapes were also longer and cheaper to manufacture (superior in specific dimensions).
