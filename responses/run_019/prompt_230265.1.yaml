      *   **Cost of Rejection:** We have to accept a more complex historical model. We can't just say "It won because it was best" (Whig history) nor "It won purely by luck" (Radical Contingency). We must say "It got a foothold by luck/context, and held it via a mix of lock-in and functional adequacy."
      *   **Refining Premise (3) Critique:** The phrase "singled out as the likely result" refers to *predictability*. The phrase "explained by... being better" refers to *causal mechanism*. Low predictability does not negate causal mechanism. A coin flip is unpredictable, but gravity explains why it falls down. Similarly, a historical fork is unpredictable, but functional utility explains why the chosen path stuck.

