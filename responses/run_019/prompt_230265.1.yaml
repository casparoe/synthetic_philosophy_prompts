  8.  *(Self-Correction during drafting)*: I need to make sure I don't just say "Premise 3 is wrong." I need to explain *why* it feels right but isn't. It feels right because if something was truly "better," shouldn't it have won regardless? The counter is: "Better" doesn't guarantee victory in complex systems with network effects. But victory doesn't prove "worse" either. It proves "better *given the initial conditions*."
      *   Actually, the strongest point against (3) is that **selection pressures can operate *after* the contingent event.** The accident opens the door; the merit keeps it open. Premise (3) assumes the merit must exist *before* the accident to count.

