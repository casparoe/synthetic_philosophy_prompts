  2.  **Deconstruct the Target Position (Dennett's Multiple Drafts Model):**
      *   *Core Claim:* There is no "Cartesian Theatre." There is no single place/time where "it all comes together."
      *   *Colour Phi:* The experience of motion and colour change is a construct. Whether the brain "lies" about the past (Orwellian) or waits to construct the present (Stalinesque) is indistinguishable and therefore meaningless.
      *   *Load-bearing Commitments:*
          1.  Introspective indistinguishability implies ontological indistinguishability (if you can't tell the difference, there is no difference).
