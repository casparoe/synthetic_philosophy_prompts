answer: |-
  Hi there,

  It is fascinating to see how clearly your moral intuitions map onto a specific philosophical framework, and the good news is that you do not actually have to drop any of your verdicts, not even the unknowing tourist or the bribery case, because they are all consistent under a single nuanced principle. The principle driving your judgments is a modified version of the Fair Play theory, which suggests that we are bound by social conventions when we voluntarily accept the benefits of a cooperative scheme, but with two critical caveats regarding knowledge and legitimacy. Essentially, you are operating on a Principle of Local Cooperative Fairness, which holds that you are morally obliged to follow local conventions only when you know about them, when others are relying on your compliance within a mutually beneficial system, and when the convention itself is not fundamentally unjust.

  This explains why the American who refuses to tip is in the wrong, while the Japanese tourist on his first day is not. The American knows the rules and benefits from the service industry structure that relies on gratuities, so refusing to tip is a form of free-riding that violates fair play. The tourist on day one, however, lacks the knowledge condition. He cannot be bound by a rule he could not reasonably know existed, so his failure to tip is merely a mistake, not a moral wrong. Once his friend explains the custom, the knowledge condition is met. He is now a willing participant in the local cooperative scheme, and this binds him even on his last night. The obligation is not based on future consequences or whether he will return, but on the fact that he received a service under a known set of rules where the server relied on his compliance. To leave without tipping on the final night would be to accept the benefit of the meal and service while refusing to pay the locally agreed price, which is a violation of fairness regardless of future repercussions.

  Your judgments on queueing and jaywalking further confirm the importance of the local context condition. In London, the queue is a sacred cooperative scheme for order and fairness. Jumping it violates the expectations of those who are playing by the rules, wronging them by disregarding their turn, even if no physical harm occurs. In contrast, your view on jaywalking shows that the moral weight of the convention depends on local adherence. In New York, where jaywalking is the de facto norm, waiting at an empty light at 2am might actually be unnecessary rigidity, whereas in Munich, where waiting is the strict norm, crossing against the light violates the local cooperative expectation of order and safety. Similarly, in a country where no queues exist and crowding is the norm, joining the crowd is not wrong because there is no cooperative scheme of orderly lining up to violate. You are simply playing the game as it is locally defined.

  The bribery case is the most complex, but it fits perfectly when you add the legitimacy condition to the principle. While tipping relies on a convention that is generally morally permissible, bribery relies on a convention that is corrupt and undermines institutional integrity. Even if the clerks expect and rely on the bribes, their reliance is illegitimate because the scheme itself is unjust. Therefore, a visitor is not obliged to participate because the Fair Play principle does not bind us to cooperate in immoral schemes. This leads directly to your most torn question about whether the locals themselves are obliged to keep paying. Under this principle, the locals are also not morally obliged to continue paying bribes, because an unjust convention generates no moral duty of compliance for anyone. However, there is a crucial distinction between moral obligation and prudential necessity. While neither locals nor visitors are morally required to pay, the locals may be excused for doing so out of coercion or necessity if refusing would prevent them from accessing essential services or endanger their livelihood. The visitor, being temporary and less embedded in the system, rarely faces the same level of coercive pressure, which is why your intuition says they are off the hook. But strictly speaking, the moral obligation dissolves for both groups because the convention fails the legitimacy test.

  So you do not need to discard any of your gut verdicts. The unknowing tourist is exempt due to lack of knowledge, and the bribe payer is exempt due to the illegitimacy of the convention. Your intuitions are tracking a sophisticated view of moral obligation that balances fairness and cooperation with awareness and justice. It suggests that conventions bind us only when they are known, mutually beneficial, and morally sound, and that while we should respect local customs, we are never required to participate in corruption, even if others depend on it.

