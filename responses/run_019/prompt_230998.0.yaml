          *   **A (Defender):** Believes intention/foresight distinction does real moral work. Supports DDE. Uses Surgeon/Strategic Bombing examples.
          *   **B (Skeptic):** Believes DDE is post-hoc pattern-matching. Thinks low-level details (pushing vs. trapdoor) change verdicts in ways DDE can't track.
      *   **Task:** Write an "Adversarial Collaboration Document."
      *   **Requirements:**
          1.  Numbered list of agreed claims (substantial, covering standard cases, limits of distinction, features doing work).
          2.  Disagreements Table (Neutral statement, A's phrasing, B's phrasing, Crux/Test Case, Predictions).
          3.  Specific Cases: Switch, Footbridge, Loop, plus at least two non-trolley cases (Hysterectomy/Craniotomy, Strategic/Terror Bombing).
          4.  Precision: Distinguish between descriptive psychology, normative relevance, and definitional arbitrariness.
          5.  Distinction: Separate where B thinks A is making a "verbal move" vs. "real difference."

  2.  **Deconstruct the Positions:**
      *   **A (DDE Defender):** Needs to argue that *intention* is a distinct mental state with normative weight. The structure of the action (means vs. side effect) matters morally, not just outcomes. Needs to handle the "Loop" case carefully (often a problem for DDE).
      *   **B (Skeptic/Consequentialist/Psychological Realist):** Needs to argue that intuitions track physical proximity, personal force, or emotional salience, not abstract intentional structures. Claims DDE is a rationalization of these deeper heuristics.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both agree Switch is okay, Footbridge is not (standard intuitions).
      *   Both agree outcomes are identical in paired cases (e.g., 1 dies, 5 saved).
      *   Both agree that *some* psychological/structural features drive the intuition difference.
      *   Both agree DDE requires a coherent definition of "intended means."
      *   *Constraint Check:* Must be substantial, not just "they disagree."

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Disagreement 1: Normative Relevance.* Does the mental state matter morally?
      *   *Disagreement 2: Descriptive Accuracy.* Does DDE actually explain the variance in intuitions across variants (Loop, Trapdoor)?
      *   *Disagreement 3: Definitional Stability.* Can "intended means" be defined without circularity or arbitrariness?
      *   *Disagreement 4: Verbal Move vs. Real Difference.* Is DDE just relabeling physical features?

  5.  **Developing Cruxes and Test Cases:**
      *   *Crux 1 (The Loop Case):* This is the classic DDE stress test. In the Loop, the fat man is hit by the trolley *after* the switch, but his mass stops the trolley. Is his death a means?
          *   A says: Yes, intended means (impermissible).
          *   B says: Physically identical to Switch (permissible), DDE forces a counter-intuitive verdict or redefines "means" ad hoc.
      *   *Crux 2 (Strategic vs. Terror Bombing):* Non-trolley.
          *   A says: Strategic (destroy factory, workers die foreseen) is okay. Terror (kill workers to demoralize) is not.
          *   B says: If the pilot knows workers will die, the mental state is functionally identical. The distinction is verbal.
      *   *Crux 3 (Craniotomy vs. Hysterectomy):* Medical.
          *   A says: Hysterectomy (remove uterus, fetus dies foreseen) okay. Craniotomy (crush skull to extract, fetus dies as means) not okay.
          *   B says: In both, the doctor performs a physical act knowing it kills the fetus. The "means" distinction is post-hoc rationalization of the "saving the mother" goal.
      *   *Crux 4 (The Trapdoor Variant):* Footbridge with a trapdoor.
          *   A says: Still intended means (impermissible).
          *   B says: Intuition drops (less "personal force"). DDE predicts no change (intention is same), so DDE fails descriptive accuracy.

  6.  **Refining the "Verbal Move" vs. "Real Difference" Requirement:**
      *   I need to explicitly categorize where B thinks A is just playing with words. This fits best in the Disagreements Table or a specific section. Let's put it in the Disagreements Table under "Definitional Stability."

  7.  **Review and Polish:**
      *   *Tone:* Academic, precise, collaborative but adversarial.
      *   *Formatting:* Clear headers, tables, numbered lists.
      *   *Check Constraints:* Did I include Switch, Footbridge, Loop? Yes. Two non-trolley? Yes (Bombing, Medical). Did I separate descriptive vs. normative? Yes.
      *   *Self-Correction on "Loop":* The Loop case is tricky. Some DDE defenders say the death isn't intended as a means because the *stopping* is the means, not the death. I need to make sure A's position is nuanced enough to be plausible but distinct from B's. Let's have A argue that the *use of the body* is the means, implying death.
      *   *Self-Correction on "Agreed Claims":* Ensure B isn't conceding too much. B shouldn't agree that intention *is* distinct, only that A *claims* it is. Wait, the prompt says "claims both can sign." So they must agree on facts, not necessarily normative truths. They can agree "Standard intuitions distinguish Switch/Footbridge." They can agree "DDE relies on intention/foresight."

  8.  **Finalizing the Document Structure:**
      *   Title.
      *   Preamble (Context).
      *   Part I: Common Ground (Numbered List).
      *   Part II: Map of Disagreements (Table).
      *   Part III: Detailed Cruxes & Predictions (Expanded from table).
      *   Part IV: Classification of Dispute Type (Normative vs. Descriptive vs. Semantic).

  9.  **Drafting Content (Iterative refinement):**
      *   *Claim 1:* Intuitions exist.
      *   *Claim 2:* Outcomes are identical in pairs.
      *   *Claim 3:* DDE definition.
      *   *Claim 4:* B's alternative explanation (personal force/proximity).
      *   *Table:* Needs columns: Issue, Neutral Statement, A's View, B's View, Crux Case, Predictions.
      *   *Crux Details:* Need specific predictions. E.g., "If we vary physical contact but keep intention constant, A predicts stable judgment, B predicts shifting judgment."

  10. **Final Polish:** Check against the "verbal move" constraint. Make sure B's skepticism about "intention" being a "verbal move" is explicit in the disagreements. (Added to Disagreement 3).

  *(Self-Correction during drafting)*: Make sure the "Loop" case is described clearly. In the Loop, the trolley hits the man, loops around, and his body stops the trolley. The question is whether his death is a means to stopping the trolley.
  *(Self-Correction on Medical Case)*: Ensure the Hysterectomy/Craniotomy distinction is clear. Hysterectomy: Pathology removes uterus, fetus dies. Craniotomy: Head crushed to fit through pelvis. DDE says one is means, one is side effect. Skeptic says both are killing to save mother.

  Let's assemble the document.cw
answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: THE DOCTRINE OF DOUBLE EFFECT
  **Participants:** Agent A (DDE Defender), Agent B (DDE Skeptic)
  **Date:** October 26, 2023
  **Subject:** Normative relevance and descriptive accuracy of the Intention/Foresight distinction.

  ## PART I: AGREED CLAIMS (COMMON GROUND)
  *Both parties sign below acknowledging the following claims as the baseline for this collaboration. These claims establish the phenomenology of the cases and the structural requirements of the debate, without conceding normative truth.*

  1.  **Stability of Standard Intuitions:** Both parties agree that in the standard *Switch* case (diverting a trolley to kill one to save five) and the standard *Footbridge* case (pushing a man to stop a trolley), the modal moral intuition is that *Switch* is permissible and *Footbridge* is impermissible, despite identical outcome structures (1 death, 5 saved).
  2.  **Outcome Equivalence:** In the paired cases under discussion (*Switch/Footbridge*, *Strategic/Terror Bombing*, *Hysterectomy/Craniotomy*), the physical outcome regarding the victim (death) and the beneficiaries (survival) is identical. The causal chain leading to the victim's death is initiated by the agent in all cases.
  3.  **The DDE Formula:** Both parties agree that the Doctrine of Double Effect (DDE) asserts that an action causing harm is permissible only if: (a) the action itself is not intrinsically wrong, (b) the harm is not intended as a means or an end, (c) the harm is merely foreseen, and (d) there is proportionate reason for allowing the harm.
  4.  **Descriptive Variance:** Both parties acknowledge that intuitive judgments shift when low-level physical details are altered (e.g., pushing with a pole vs. bare hands; dropping via trapdoor vs. shoving), even when the intentional structure remains constant.
  5.  **Requirement of Non-Arbitrariness:** Both parties agree that for DDE to be a viable normative theory, the distinction between "intended means" and "foreseen side effect" must be definable without circularity (i.e., it cannot be defined simply as "the part of the case we judge as permissible").
  6.  **Alternative Explanatory Factors:** Both parties acknowledge that factors other than intention—specifically *personal force* (direct physical application), *spatial proximity*, and *emotional salience*—correlate with shifts in moral judgment in trolley-style variants.

  ---

  ## PART II: MAP OF DISAGREEMENTS
  *The following table isolates the specific points of contention. "Neutral Statement" describes the dispute without loading language. "A's Phrasing" and "B's Phrasing" reflect how each characterizes the core issue.*

  | # | Neutral Statement of Disagreement | A's Phrasing (DDE Defender) | B's Phrasing (DDE Skeptic) | Type of Dispute |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Normative Relevance of Intention:** Whether the mental state of the agent (intending harm vs. foreseeing harm) changes the moral permissibility of an act when physical outcomes are held constant. | The intentional structure constitutes a distinct moral object. Using a person as a means violates their dignity regardless of outcome. | Mental states are normatively inert. Only outcomes and physical constraints matter. "Intention" is a post-hoc label for outcomes we dislike. | **Normative** |
  | **2** | **Descriptive Accuracy:** Whether the DDE distinction tracks actual human moral intuitions across close variants (e.g., Loop, Trapdoor) better than physical/psychological heuristics. | DDE explains the *reflective* equilibrium. Intuitions that conflict with DDE (e.g., in Loop) are performance errors to be corrected. | DDE fails to predict variance. Intuitions track "personal force," not "means." DDE is a rationalization of these heuristics. | **Descriptive / Psychological** |
  | **3** | **Definitional Stability:** Whether "intending as a means" can be defined non-arbitrarily in cases where the victim's death is causally necessary for the good outcome. | We can distinguish between *causal necessity* and *intentional inclusion*. Death can be necessary without being intended. | In cases where death is necessary for success, calling it "unintended" is a verbal move to preserve the theory. | **Semantic / Conceptual** |
  | **4** | **Verbal Move vs. Real Difference:** Whether applying DDE changes the evaluation of the act or merely relabels the physical features that are actually doing the work. | DDE identifies a real moral boundary (agency) that physical descriptions miss. | DDE is a "verbal move." It redescribes physical proximity as intentional structure to mask the lack of normative difference. | **Meta-Ethical** |

  ---

  ## PART III: CRUXES, TEST CASES, AND PREDICTIONS
  *For each disagreement above, we identify a "Crux"—a specific question or case pair where settling the matter would move at least one party. We record concrete predictions.*

  ### Crux 1: The Loop Case (Testing Descriptive Accuracy & Definitional Stability)
  **Case Description:** A trolley is headed toward five. You can flip a switch to divert it onto a side track. On the side track, a large man stands. The track loops back toward the five. The trolley will hit the man, killing him, and his bulk will stop the trolley, saving the five.
  **The Question:** Is the man's death intended as a means?

  | | **Agent A (DDE)** | **Agent B (Skeptic)** |
  | :--- | :--- | :--- |
  | **Verdict** | **Impermissible.** | **Permissible (Intuition varies).** |
  | **Rationale** | The man's body is being used as a brake. His presence/death is part of the plan to stop the trolley. This fits "means." | Physically nearly identical to *Switch*. If *Switch* is okay, *Loop* should be okay. The "means" label is applied retroactively because the intuition feels worse. |
  | **Prediction** | A predicts that upon reflection, B will agree *Loop* is wrong, or admit *Switch* is also wrong. | B predicts that if we remove "personal force" (e.g., remote switch), intuition shifts to permissible, proving "means" is not the driver. |
  | **Settling Condition** | If B admits *Loop* is impermissible *solely* due to intentional structure despite physical similarity to *Switch*, A gains ground. If A admits *Loop* is permissible, DDE requires revision. |

  ### Crux 2: The Trapdoor Variant (Testing "Verbal Move" Claim)
  **Case Description:** *Footbridge* variant. The large man is standing on a trapdoor above the track. You pull a lever. The trapdoor opens, he falls onto the track, stopping the trolley. You never touch him.
  **The Question:** Does removing direct physical contact change permissibility?

  | | **Agent A (DDE)** | **Agent B (Skeptic)** |
  | :--- | :--- | :--- |
  | **Verdict** | **Impermissible.** | **Permissibility increases.** |
  | **Rationale** | Intention remains identical (using him to stop trolley). Physical contact is morally irrelevant to the intentional structure. | Removing "personal force" reduces emotional aversion. If DDE were true, verdict should remain stable. If verdict shifts, DDE is descriptively false. |
  | **Prediction** | A predicts moral judgment should remain stable (Impermissible). If it shifts, people are confused. | B predicts significant shift toward permissibility. This proves "personal force" drives the intuition, not "intention." |
  | **Settling Condition** | If empirical data shows >50% shift in permissibility, B wins the descriptive claim. A must argue why the intuition is mistaken. |

  ### Crux 3: Strategic vs. Terror Bombing (Testing Normative Relevance)
  **Case Description:**
  *   *Terror:* Pilot bombs a school to kill children, demoralizing the enemy, ending the war.
  *   *Strategic:* Pilot bombs a factory. Children in a nearby school die from shockwaves. Factory destruction demoralizes the enemy, ending the war.
  **The Question:** Is the pilot's mental state different enough to justify the moral difference?

  | | **Agent A (DDE)** | **Agent B (Skeptic)** |
  | :--- | :--- | :--- |
  | **Verdict** | **Terror: Impermissible. Strategic: Permissible.** | **Both Impermissible (or Both Permissible).** |
  | **Rationale** | In *Strategic*, the children's death aids nothing. In *Terror*, it is the mechanism of victory. | The pilot knows children will die in both. The "plan" is identical (drop bomb -> war ends). The distinction is a verbal fiction to excuse necessary war acts. |
  | **Prediction** | A predicts B will concede *Terror* is worse if forced to simulate the pilot's deliberation ("I need them dead" vs "I need the factory gone"). | B predicts that if we make the *Strategic* death 100% certain and causally necessary for the demoralization, A will struggle to maintain the distinction. |
  | **Settling Condition** | If B concedes the pilot's *reasoning* changes the act's nature, A wins normative relevance. If A concedes that 100% foreseen causal necessity equals intention, DDE collapses. |

  ### Crux 4: Craniotomy vs. Hysterectomy (Testing Causal Necessity)
  **Case Description:** Pregnant woman has cancer/obstruction.
  *   *Hysterectomy:* Remove uterus to save mother. Fetus dies as result.
  *   *Craniotomy:* Crush fetus skull to extract it and save mother. Fetus dies as result.
  **The Question:** Is the fetus's death a means in Craniotomy but not Hysterectomy?

  | | **Agent A (DDE)** | **Agent B (Skeptic)** |
  | :--- | :--- | :--- |
  | **Verdict** | **Hysterectomy: Permissible. Craniotomy: Impermissible.** | **Both Permissible (Necessity).** |
  | **Rationale** | In *Hysterectomy*, the death is a side effect of removing pathology. In *Craniotomy*, the death (compression) is the means of extraction. | In both, the doctor performs an act knowing it kills the fetus to save the mother. Calling one "means" is arbitrary slicing of the causal chain. |
  | **Prediction** | A predicts B will agree that *directly* killing (injection) is worse than *indirectly* killing (removal), validating the means distinction. | B predicts that if we describe the *Hysterectomy* as "removing the container knowing contents will perish," it sounds identical to Craniotomy. |
  | **Settling Condition** | If the medical consensus treats these as morally distinct *independent of religious doctrine*, A gains ground. If they are treated as functionally identical triage decisions, B gains ground. |

  ---

  ## PART IV: CLASSIFICATION OF DISPUTE TYPES
  *To ensure we do not talk past each other, we classify the specific nature of our divergence on the "Verbal Move" objection.*

  **1. Where B claims A is making a "Verbal Move":**
  *   **Context:** Cases where the victim's death is *causally necessary* for the good outcome (e.g., *Loop*, *Strategic Bombing* where shockwaves are insufficient without casualties).
  *   **B's Charge:** A is defining "intended" as "the bad stuff I forbid" and "foreseen" as "the bad stuff I allow." This renders DDE unfalsifiable.
  *   **A's Response:** This is not verbal; it is about the *structure of practical reasoning*. If the agent reasons "I must kill him to stop it," that is distinct from "I must stop it, though he will die." The difference is in the agent's maxim, not the physics.

  **2. Where A claims B is making a "Category Error":**
  *   **Context:** B argues that because *physical* tweaks (trapdoor vs. push) change intuitions, *intention* is irrelevant.
  *   **A's Charge:** B is conflating *descriptive psychology* (what triggers a gut feeling) with *normative ethics* (what justifies an act). That humans are biased by physical proximity does not prove proximity is morally relevant.
  *   **B's Response:** If the theory (DDE) claims to explain our moral judgments, but fails to predict the variance caused by physical proximity, it is descriptively inadequate. If it claims to be purely normative, it lacks grounding in human moral practice.

  **3. The Agreed Path Forward:**
  *   We will treat the **Loop Case** as the primary test for Definitional Stability.
  *   We will treat the **Trapdoor Variant** as the primary test for Descriptive Accuracy.
  *   We will treat **Strategic Bombing** as the primary test for Normative Relevance.

