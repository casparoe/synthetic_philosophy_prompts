prompt: |-
  So I had this huge argument with a mate last Saturday that went on until about 2am. It started with her saying she'd recently gone off coffee she'd loved for years, and I (smugly, regrettably) brought up Dennett's Chase and Sanborn — the two coffee tasters in his "Quining Qualia" essay, one of whom says the coffee tastes exactly the same as ever but his preferences have changed, while the other insists his preferences are unchanged and it's the taste itself that's shifted. My friend was adamant she'd just *know* which one she was, from the inside, no further question. I said that's precisely the intuition Dennett thinks won't survive scrutiny. We went round in circles and I'm not sure either of us argued it brilliantly, tbh.

  Annoyingly, the timing is terrible, because I've now got to run our department's reading group for second-year philosophy students next week, and the topic is basically this: whether qualia are an incoherent posit. The students have done a first-year mind module, so they've met Mary and the inverted spectrum and mostly come away qualia-friendly. I don't need the argument explained to me — I need a plan for how to teach it in ninety minutes. What has to be in place first before the Chase and Sanborn case can do any work (I'm guessing they need the naive picture of qualia as the way things seem to you, cleanly separable from your judgements and reactions to those seemings, but maybe something needs to come even before that?). Then: which example should carry the session. Should I lead with both tasters or just one of them, or is there a better everyday case to build the whole thing around — and what does the carrying case need to have and to lack so students don't dodge it? Also the misconceptions I should expect and where in the sequence to head each one off: my guess is they'll first hear Dennett as denying that experience exists at all, then dismiss him as a reheated verificationist, then decide the whole thing just trades on fallible memory (which I think misses Sanborn, whose memory is meant to be fine). Tell me at which point in the plan each of those gets defused rather than letting them fester.

  Finally, I want one question to ask at the end that shows whether the idea has actually landed — something like getting them to construct a case where "my qualia changed" and "my reaction to my qualia changed" come apart, where success is them realising they can't, but maybe you have a better suggestion. And tell me what I should openly refuse to cover at this level (the later replies, the inverted spectrum, heterophenomenology?) and say so, rather than letting the session sprawl. Basically: help me teach this better than I argued it at 2am.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy instructor/TA running a 2nd-year undergraduate reading group.
      *   **Topic:** Dennett's "Quining Qualia" (specifically the argument that qualia are incoherent).
      *   **Context:** Had a personal argument about this with a friend (Chase and Sanborn example) that went poorly/late. Wants to avoid repeating that failure in class.
      *   **Student Background:** 1st-year mind module completed. Familiar with Mary (Knowledge Argument), Inverted Spectrum. Generally "qualia-friendly" (intuitive realists about qualia).
      *   **Constraints:** 90 minutes. Needs a structured plan.
      *   **Specific Needs:**
          *   Prerequisites before Chase & Sanborn (C&S).
          *   Which example to use/lead with.
          *   Handling specific misconceptions (Eliminativism charge, Verificationism charge, Memory fallibility).
          *   A final assessment question.
          *   What to explicitly exclude (scope creep).
      *   **Tone:** Professional, pedagogical, slightly empathetic about the 2am argument (acknowledging the frustration).

  2.  **Deconstruct the Philosophical Content (Dennett's "Quining Qualia"):**
      *   *Goal:* Show that the standard philosophical definition of qualia (ineffable, intrinsic, private, directly apprehensible) is incoherent.
      *   *Key Move:* The Chase and Sanborn (C&S) thought experiment. Two coffee tasters. One says taste changed, preference same. Other says taste same, preference changed. Dennett argues there is no fact of the matter to distinguish them.
      *   *Underlying Assumption:* The "Qualia Interpretation" relies on a distinction between *seeming* and *judging/reacting* that cannot be sustained under scrutiny.
      *   *Common Pushbacks:* "He's denying experience!" (Eliminativism), "He's just a verificationist," "It's just bad memory."

  3.  **Drafting the Lesson Plan - Section by Section:**

      *   **Introduction (10 mins):** Need to set the stage without triggering defenses immediately. Acknowledge their prior knowledge (Mary, Inverted Spectrum). Define the target: *The Philosophical Notion of Qualia*, not experience itself.
      *   **Prerequisites (The "Naive Picture"):** The user asked what needs to be in place *before* C&S. Students need to hold the "Standard View" of qualia firmly so Dennett can dismantle it. Specifically: Ineffability, Intrinsicness, Privacy, Direct Apprehensibility. Let's call this the "Four Marks."
      *   **The Core Example (Chase & Sanborn):** The user asked whether to lead with one or both. *Strategy:* Present the *dilemma*. If you present just one, students might think "Oh, obviously it's preference." If you present both as live options that are empirically indistinguishable, the force hits.
      *   **Addressing Misconceptions:**
          *   *Eliminativism:* Address this early. Dennett isn't denying coffee tastes bitter; he's denying a specific *theoretical gloss* on that bitterness.
          *   *Verificationism:* Address this when they claim "There *is* a difference, we just can't measure it." Dennett's point is metaphysical, not epistemic.
          *   *Memory:* Address this regarding Sanborn. The thought experiment stipulates memory is perfect. If they cling to memory, they miss the point about *current* seeming.
      *   **The "Carrying Case":** What makes an example work? It needs to be mundane (coffee is good), involve a gradual shift (sorites-ish), and separate judgment from sensation.
      *   **Final Assessment:** The user wants a question where they try to separate "qualia changed" from "reaction changed." The goal is to show they collapse.
      *   **Scope/Exclusions:** Heterophenomenology is too technical. Inverted Spectrum is a distraction here (it assumes qualia exist). Hard problem of consciousness is too big.

  4.  **Refining the Pedagogy (The "How-To"):**

      *   *Timing:* 90 mins is tight. Need strict segments.
      *   *Engagement:* Don't lecture the whole time. Use the 2am argument dynamic (gently) to show *why* it's hard.
      *   *The "Trap":* Students love qualia. If you attack it too hard, they dig in. Frame Dennett as a "conceptual therapist" cleaning up a definition, not a "destroyer of experience."

  5.  **Developing the Specific Responses to User Queries:**

      *   *Prerequisites:* The "Four Marks" (Lewis/Dennett formulation). Without these, C&S doesn't bite.
      *   *Leading Example:* Start with a simpler version (the wine/beer example often used) then move to C&S. Actually, sticking to C&S is better for fidelity, but present it as a *dialogue*.
      *   *Misconceptions:*
          *   Eliminativism -> Intro/Setup.
          *   Verificationism -> During the C&S analysis (the "Fact of the Matter" point).
          *   Memory -> During C&S analysis (stipulate ideal conditions).
      *   *Final Question:* "Describe a change in your experience that makes *no difference* to your dispositions, memories, or reports."
      *   *Exclusions:* Heterophenomenology, Neural Correlates, The Hard Problem (Chalmers).

  6.  **Review and Polish:**
      *   *Tone Check:* Is it supportive? Yes.
      *   *Clarity:* Is the schedule clear? Yes.
      *   *Philosophical Accuracy:* Ensure Dennett's actual argument (incoherence of the *definition*, not the *phenomena*) is central.
      *   *The 2am Angle:* Acknowledge the friend's intuition. It *is* compelling. That's why the argument is needed. Don't dismiss the friend, dismiss the *theoretical weight* placed on the intuition.

  7.  **Final Output Structure:**
      *   Empathetic opening.
      *   Session Overview (Time breakdown).
      *   Phase 1: Setting the Target (The Four Marks).
      *   Phase 2: The Chase & Sanborn Engine.
      *   Phase 3: Defusing the Pushbacks (The 3 Misconceptions).
      *   Phase 4: The Assessment Question.
      *   Phase 5: What to Exclude.
      *   Closing encouragement.

  *(Self-Correction during drafting)*: I initially thought about suggesting the "Coffee vs. Tea" switch. No, stick to C&S. It's the text. But make sure to emphasize that Dennett grants the *phenomenology* but denies the *inference* to a private object.
  *Correction on Misconceptions:* The Verificationism charge is the trickiest. Need to make sure students understand Dennett is making a metaphysical point about *what exists*, not an epistemic point about *what we know*. If there's no way to tell, even in principle, the distinction is empty.
  *Final Question:* Make sure it forces them to articulate the "Qualia Realist" commitment. If they can't describe the difference without referencing behavior/judgment, they've got Dennett's point.

  8.  **Final Polish:** Check against the 90-minute limit. 15 mins intro, 30 mins C&S, 30 mins objections, 15 mins wrap/assessment. Looks good.

  *(Wait, one more thing)*: The user asked "What has to be in place first... I'm guessing they need the naive picture." Yes, confirm this. They need to believe qualia are *judgement-independent*. That is the crucial hinge.

  Okay, ready to write.
answer: |-
  First, commiserations on the 2am argument. The reason that conversation went in circles is likely because your friend was defending *experience* (which Dennett grants exists), while you were attacking a *theoretical construct* (which Dennett thinks is incoherent). That is the exact pivot point you need to manage with your students. If they think Dennett is saying "coffee doesn't taste like anything," they will revolt. If they understand he is saying "the philosophical category you are using to describe that taste is broken," they might listen.

  Here is a 90-minute lesson plan designed to navigate the "Qualia-Friendly" bias of second-years, defuse the standard objections before they harden, and give you a clean exit strategy.

  ### Session Overview (90 Minutes)
  *   **00–15:** Setting the Target (The "Four Marks" of Qualia).
  *   **15–45:** The Engine Room (Chase & Sanborn).
  *   **45–75:** The Pushback Triad (Eliminativism, Verificationism, Memory).
  *   **75–90:** Assessment & Scope Boundaries.

  ---

  ### Phase 1: Setting the Target (15 mins)
  **Goal:** Ensure they are attacking the *definition*, not the *experience*.
  **Prerequisite:** You correctly identified that they need the "naive picture" in place. But be specific. Do not let them define qualia as "what it's like to be you." That is too vague.

  Write the **"Four Marks of Qualia"** on the board (derived from Lewis/Dennett). Tell them: *"Dennett is not arguing against coffee tasting bitter. He is arguing that a mental property satisfying these four conditions cannot exist."*
  1.  **Ineffable:** Cannot be fully communicated.
  2.  **Intrinsic:** Non-relational, simple, unanalyzable properties.
  3.  **Private:** Interpersonal comparisons are impossible.
  4.  **Directly Apprehensible:** To have them is to know you have them (incorrigibility).

  **Pedagogical Move:** Ask the room: *"Who thinks consciousness has properties that fit all four?"* (Most hands will go up). *"Good. Dennett's target is that cluster. If we can show one of these marks contradicts the others, the concept quines itself."*

  **Defusing Misconception #1 (Eliminativism):**
  Address this **now**.
  *   **The Fear:** "Dennett thinks we're zombies."
  *   **The Fix:** Explicitly state: *"Dennett grants that coffee tastes bitter. He grants you are conscious. He denies that 'bitterness' is a private, intrinsic, ineffable *object* inside your mind that is separate from your disposition to say 'this is bitter'."*
  *   **Why here?** If you wait until they accuse him of eliminativism later, they will have stopped listening. Pre-empt it.

  ---

  ### Phase 2: The Engine Room – Chase & Sanborn (30 mins)
  **Goal:** Demonstrate the collapse of the distinction between *seeming* and *judging*.
  **Strategy:** Do not lead with just one taster. The power of the case is the **symmetry**.

  **The Setup:**
  Describe the case faithfully. Two expert tasters. Over years, their reports diverge.
  *   **Chase:** "The coffee tastes the same as always, but I don't enjoy it anymore." (Qualia stable, Preference changed).
  *   **Sanborn:** "I enjoy coffee as much as ever, but it doesn't taste the same to me." (Preference stable, Qualia changed).

  **The Activity:**
  Divide the room. Half argue for Chase's interpretation of Sanborn; half argue for Sanborn's interpretation of himself.
  Ask them: *"What experiment could settle this?"*
  They will suggest fMRI, reaction times, etc.
  Push back: *"Dennett says even in principle, there is no fact of the matter. Why?"*

  **The Crucial Hinge:**
  Guide them to see that for the Qualia Realist, **Seeming ≠ Judging**.
  For Dennett, **Seeming = Judging (plus dispositions)**.
  If Sanborn says "It tastes different," but acts exactly the same, buys the same beans, and reacts the same way, in what sense does the taste *actually* differ?

  **Defusing Misconception #3 (Memory):**
  Students will say: *"Sanborn just has bad memory."*
  **Intervention:** Remind them of the thought experiment stipulations. *"We are stipulating ideal observers. If you rely on memory failure, you are changing the case. Dennett's point is that even with perfect memory, the distinction between 'the taste changed' and 'my standard for tasting changed' collapses."*
  **Timing:** Hit this immediately when the first student raises it during the C&S discussion. Do not let it become a group consensus.

  ---

  ### Phase 3: The Pushback Triad (30 mins)
  **Goal:** Handle the three standard objections systematically.

  **1. The Verificationist Charge (10 mins)**
  *   **Student Objection:** *"Just because we can't tell the difference doesn't mean there isn't one. He's just a verificationist."*
  *   **Your Counter:** Dennett is making a **metaphysical** point, not an epistemic one. It's not that we *can't know* which taster is right; it's that the question presupposes a 'ghostly glue' (qualia) that holds the experience together independent of function. If two hypotheses (Chase's view vs. Sanborn's view) predict all possible physical and behavioral data identically, positing a hidden difference is not just unknowable, it is **ontologically idle**.
  *   **Analogy:** Ask if a tree falling in a forest makes a sound if "sound" is defined as "vibration in the air." If someone defines sound as "experience of hearing," the question changes. Dennett is saying the philosophical definition of qualia is like asking about the "sound" without the air or the ear.

  **2. The "Phenomenal Difference" Intuition (10 mins)**
  *   **Student Objection:** *"But I can imagine my qualia changing while my behavior stays the same!"*
  *   **Your Counter:** Challenge them to describe *how*. If they say "It just looks redder," ask "Does that mean you are more inclined to call it red? More inclined to stop at the light?" If they say "No, nothing changes," ask: *"Then in what sense is it 'redder'? You have stripped the quality of all causal power."*

  **3. The "Dennett is Confused" Defense (10 mins)**
  *   **Student Objection:** *"He's just defining qualia out of existence."*
  *   **Your Counter:** Acknowledge this is a valid critique (many philosophers think this!). But ask: *"Is he defining it out of existence, or showing that the definition philosophers *gave us* (the Four Marks) is self-contradictory?"*
  *   **Point:** If qualia must be ineffable and directly apprehensible, but our reports on them change over time (as per C&S), then either we are lying, mistaken, or qualia aren't directly apprehensible. Dennett chooses the latter.

  ---

  ### Phase 4: Assessment & Scope (15 mins)
  **Goal:** Check understanding and prevent sprawl.

  **The Final Question:**
  Do not ask them to summarize Dennett. Ask them to do the work he says is impossible.
  > **"Construct a scenario where 'my qualia changed' and 'my reaction to my qualia changed' come apart. You must describe the change in qualia without referencing any change in judgment, behavior, memory, or disposition."**

  *   **Success Condition:** If they struggle, stutter, or inevitably circle back to "Well, it would *feel* different" (which begs the question), the point has landed.
  *   **Failure Condition:** If they confidently describe a "private inner glow" that has no external footprint, they have rejected Dennett (which is fine), but they must acknowledge they are positing an epiphenomenal property.

  **What to Explicitly Exclude (The "Do Not Enter" Signs):**
  Write these on the board and tell them: *"We are not touching these today. If you bring them up, I will park them for a later seminar."*
  1.  **Heterophenomenology:** Dennett's positive methodology. It's too technical for this session. Stick to the negative argument against qualia.
  2.  **The Inverted Spectrum:** This argument *assumes* qualia are coherent to begin with. Using it here will confuse the issue.
  3.  **The Hard Problem (Chalmers):** This session is about the coherence of the *concept* of qualia, not the explanation of consciousness itself.
  4.  **Neural Correlates:** Keep it conceptual. fMRI data won't solve the metaphysical dispute here.

  ### Summary of Misconception Timing
  | Misconception | When it arises | Where you defuse it |
  | :--- | :--- | :--- |
  | **"He denies experience!"** (Eliminativism) | Immediately / Intro | **Phase 1 (00-15 mins).** Pre-empt it before C&S. |
  | **"It's just bad memory."** | During C&S discussion | **Phase 2 (15-45 mins).** Cite thought experiment stipulations. |
  | **"He's a Verificationist."** | During Objections | **Phase 3 (45-75 mins).** Distinguish metaphysics from epistemology. |

  ### A Note on the 2am Argument
  You mentioned your friend was adamant she'd *know* from the inside.
  In the final 5 minutes, you can validate her intuition without validating the philosophy.
  *"Your friend's intuition is exactly what Dennett expects. She feels she has Direct Apprehension. Dennett's argument is that this feeling of 'Direct Apprehension' is itself a judgment, not a window into a private object. You can respect the feeling without accepting the metaphysical baggage."*

  This allows you to be right about the philosophy without making your friend (or your students) feel like they are denying their own consciousness. Good luck with the reading group.
