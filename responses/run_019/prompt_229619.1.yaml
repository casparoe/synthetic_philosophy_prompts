answer: |-
  Hey Marcus, I spent some time digging into the specific constraints we were arguing about last night, and I think I have the case built out in a way that meets all the criteria we set, so here is the scenario we need to look at. Imagine a small town where fifty skilled workers start with equal savings and job contracts at a local factory, all holding identical shares of ownership and leisure time. Over the next year, management announces a performance bonus for the top ten percent, payable from company profits that would otherwise be distributed as dividends to the worker-owners. Each worker voluntarily chooses to work two extra unpaid hours daily to secure the bonus, reasoning that their individual effort won't influence others, and since they own shares, they expect to recoup the costs through dividends if they don't win. However, every worker makes this same rational calculation, so no one gains a relative advantage, the bonus structure remains untriggered because performance is relative, and the company profits shrink due to overtime costs, reducing everyone's dividend payout. At year's end, every worker has less leisure, lower total income from reduced dividends, and the same status as before, yet every single decision to work overtime was freely chosen based on the best available information at the time.

  Now let's walk through how entitlement theory actually verdicts this situation step by step. First, justice in acquisition is satisfied because we started with the workers owning their labor and shares cleanly, with no theft or fraud in the history. Second, justice in transfer is satisfied because every decision to work overtime was voluntary, informed, and free of coercion or desperation that would invalidate consent. Third, there is no trigger for rectification because no rights were violated during the process; nobody was forced to work extra, and nobody was deceived about the rules. Consequently, the final state counts as just under Nozick's framework, even though everyone is objectively worse off in terms of income and leisure than when they started. The theory separates the justice of the process from the welfare of the outcome, so as long as the steps were clean, the result is legitimate.

  The structural feature doing all the work here is the interdependence of payoffs based on relative standing, which creates a non-cooperative game structure like a Prisoner's Dilemma embedded within the market transactions. Each person's choice changes the payoffs for everyone else by raising the baseline for performance without increasing total value, meaning what is rational for an individual in isolation becomes destructive when aggregated. If you remove that feature, say by making the bonus based on absolute productivity targets rather than relative ranking, or by allowing the workers to collectively bind themselves to a no-overtime agreement, the case collapses back into a harmless Wilt Chamberlain-style example where the voluntary exchanges produce a net benefit or at least no net loss. Without that specific competitive interdependence, the voluntary transfers would likely lead to a state everyone prefers, and the pressure on entitlement theory disappears.

  This brings us to the core disagreement we had. Your line is that a theory which blesses outcomes the participants themselves regret has lost touch with whatever made consent morally important in the first place, suggesting that consent is only a proxy for welfare improvement and fails when that link is broken by structural traps. The best Nozickean reply is that nobody was ever entitled to a specific pattern of welfare, consent attaches to each transaction individually rather than the aggregate result, and regret about the collective outcome does not manufacture a rights violation where none occurred. They would argue that preventing this outcome would require violating the workers' liberty to contract as they see fit, which is a higher moral cost than the welfare loss.

  Finally, to answer your question about whether the original Wilt Chamberlain argument covers this, I think you found a genuine gap rather than just a case Nozick would shrug at. Nozick's framing quietly assumes that voluntary exchanges are mutually beneficial in a way that accumulates positively, or at least that the liberty to exchange is worth any cost, but he does not explicitly address scenarios where the system of rights facilitates a collective action problem that harms everyone. He focuses on liberty upsetting patterns, not liberty enabling self-defeating cycles, so while he would likely maintain his verdict that the outcome is just, your point stands that the moral intuition behind respecting consent is strained when the process reliably produces outcomes everyone wishes to avoid.
