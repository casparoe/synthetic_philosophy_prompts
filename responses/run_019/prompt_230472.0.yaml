answer: |-
  # Activity Design: "The Audit"

  **Time:** 80 Minutes (20 min Game, 50 min Debrief, 10 min Close)
  **Class Size:** 18 Students (6 Teams of 3)
  **Materials:** 6 Envelopes, 120 Index Cards (20 per envelope), Markers, 6 Calculators (or phones allowed).

  ## Part 1: The Setup (5 Minutes)
  Do not introduce the topic of fairness yet. Introduce the task as an operational audit.

  **Instructor Script:**
  "Today you are an external Audit Board for a funding agency called 'Merit-700.' They use a scoring algorithm to decide who gets a business grant. Your job is to validate their decision rule.

  Inside your envelope are 20 applicant files from the last cycle. Each card has three things:
  1.  **Group:** Either 'North' or 'South' (marked by a colored dot).
  2.  **Score:** A number from 1 to 10 (higher score = higher risk).
  3.  **Outcome:** 'Success' or 'Fail' (printed on the back, do not look until instructed).

  The Agency claims their system is fair. They have given you two mandates from their Charter. You must check if a single decision rule can satisfy both."

  **The Charter (Write on Board):**
  1.  **The Blindness Rule:** You must set **one** cutoff score for everyone. (e.g., If you fund scores 1–5 for North, you must fund scores 1–5 for South).
  2.  **The Opportunity Rule:** The percentage of **Successful** applicants who get rejected must be **equal** for North and South.

  **The Task:**
  "Flip the cards. Sort them by Group and Score. Calculate the rejection rate for Successful applicants for every possible cutoff (1 through 10). Find the cutoff number that satisfies both Charter rules. If you cannot find one, document exactly where the conflict happens. You have 15 minutes."

  ## Part 2: The Data (Preparation)
  *You must prepare the 6 envelopes identically.*
  Each envelope contains 20 cards.
  *   **10 North Cards:** 8 "Success", 2 "Fail". (80% Base Rate)
  *   **10 South Cards:** 4 "Success", 6 "Fail". (40% Base Rate)

  **Score Distribution (Crucial):**
  *   **North Success:** Scores 1, 2, 3, 4, 5, 6, 7, 8
  *   **North Fail:** Scores 9, 10
  *   **South Success:** Scores 3, 4, 5, 6
  *   **South Fail:** Scores 5, 6, 7, 8, 9, 10

  *(Note the overlap: A score of 5 or 6 can be a Success in South, but in North, Successes go up to 8. This creates the mathematical tension.)*

  ## Part 3: The Game (15 Minutes)
  Circulate quietly. Do not help them with the math. Do not answer questions about whether the rules are "reasonable." If a group asks, "Can we use different cutoffs?" say: "The Charter says one cutoff." If they ask, "Is this possible?" say: "Your job is to find out."

  Watch for:
  1.  Groups that quietly use two cutoffs.
  2.  Groups that stop working and claim it's broken.
  3.  Groups that pick a cutoff and fudge the numbers to make it look like it works.

  ## Part 4: The Debrief (50 Minutes)

  ### Phase 1: The Report (10 Minutes)
  Ask each group for their chosen cutoff. Write them on the board. They will likely differ. Some will say "5," some "6," some "Impossible."

  **Ask:** "Group 3, you chose 6. Did you satisfy the Opportunity Rule?"
  *(They will likely say 'Yes' or 'Close enough'.)*
  **Ask:** "Group 5, you said it was impossible. Walk us through your calculation."

  Let them argue. One group will point out that at Cutoff 6:
  *   North Success Rejected: 2 out of 8 (25%)
  *   South Success Rejected: 0 out of 4 (0%)
  *   *Violation.*

  At Cutoff 5:
  *   North Success Rejected: 3 out of 8 (37.5%)
  *   South Success Rejected: 2 out of 4 (50%)
  *   *Violation.*

  **Instructor Move:** Do not solve it yet. Ask: "How many of you felt a physical urge to just change the rule for one group to make the numbers match?"

  ### Phase 2: Mapping the Experience to Theory (25 Minutes)
  Now you introduce the vocabulary. Draw three columns on the board: **Game Term**, **Formal Term**, **What It Means**.

  1.  **The Blindness Rule → Calibration / Single Threshold.**
      *   *Explain:* "You were told a score of 5 must mean the same thing regardless of Group. In fairness literature, this is often linked to *Calibration*. If the score represents risk, a 5 should carry the same probability of failure for North and South."
      *   *The Cost:* "By holding this fixed, you locked your hands. You could not account for the fact that the populations started from different places."

  2.  **The Opportunity Rule → Equal False Negative Rate.**
      *   *Explain:* "You were asked to equalize the % of Successful people rejected. This is *Equal False Negative Rate* (or Equal Opportunity). It ensures that qualified candidates aren't disproportionately discarded based on group membership."
      *   *The Cost:* "To satisfy this, you would need to reject more qualified North applicants or accept more qualified South applicants. But the Blindness Rule stopped you."

  3.  **The Envelope Contents → Base Rates.**
      *   *Explain:* "North had 80% Success. South had 40% Success. This is the *Base Rate*. In the real world, this might be repayment rates, graduation rates, or recidivism rates."
      *   *The Reveal:* "Here is the impossibility result you just discovered: **When Base Rates differ, you cannot simultaneously have a Single Threshold (Calibration) and Equal False Negative Rates.** Something has to break."

  **Discussion Question:** "If you had to violate one rule to save the other, which one did your group sacrifice? Why?"
  *   *If they kept Blindness:* They prioritized "treating the score the same" over "equal outcomes for the qualified."
  *   *If they broke Blindness:* They prioritized "equal outcomes" over "consistent score meaning."

  ### Phase 3: Handling Resistance (15 Minutes)
  Address the predictable behaviors you observed.

  **Scenario A: The Cheaters (Different Thresholds)**
  *   *Observation:* "I noticed two groups used Cutoff 5 for North and Cutoff 3 for South."
  *   *Response:* "You didn't cheat; you solved the math. This is called **Group-Specific Thresholds**. It satisfies Equal Error Rates, but it violates the Blindness Rule. A score of 5 gets funded in North but rejected in South. Is that fair? It feels like double standards. But the alternative was unequal rejection of qualified people. This is the core political tension: Do we want the *metric* to be blind, or the *outcome* to be equal?"

  **Scenario B: The Cynics ("It's Rigged")**
  *   *Observation:* "Group 5 said the game was broken."
  *   *Response:* "You are right. The system *is* rigged. Not by me, but by reality. When historical disparities exist (different base rates), mathematical fairness constraints collide. If you assume the world is already unequal, a 'blind' algorithm preserves that inequality. If you try to correct the inequality, you have to treat the scores differently. There is no neutral setting."

  ## Part 5: Limitations & Reality Check (10 Minutes)
  Be honest about what the game hid.

  **1. The "Ground Truth" Problem**
  *   *In Game:* You knew exactly who was "Success" or "Fail."
  *   *In Reality:* We never know the ground truth for rejected applicants. If we deny a loan, we never find out if they would have repaid it. The "Fail" labels in real datasets are often just "Who didn't default *among those we lent to*." This biases the base rates themselves.

  **2. Feedback Loops**
  *   *In Game:* The data was static.
  *   *In Reality:* If you reject Group South to satisfy a constraint, their economic condition worsens, their base rate drops further, and the algorithm becomes even more restrictive next time. The game didn't let the envelopes change based on your decisions.

  **3. Construct Validity**
  *   *In Game:* The Score was given.
  *   *In Reality:* Who chose the features in the score? If the score includes "zip code," it encodes the base rate difference directly. The game assumed the score was neutral; in reality, the score construction is where much of the bias hides.

  **Closing:**
  "The impossibility theorem doesn't tell you what to do. It tells you that you *must* choose. You cannot hide behind the math. The math says 'No.' The philosophy asks 'Which value do you sacrifice?' That is your homework."

  ---

  # Troubleshooting Guide: What Will Go Wrong

  **1. "We just averaged the rates."**
  *   *Problem:* A group might calculate the overall rejection rate and ignore the group split.
  *   *Fix:* During the report-out, ask specifically: "What was the rate for North? What was the rate for South?" Force the disaggregation.

  **2. "We changed the Base Rates."**
  *   *Problem:* A group might try to discard cards to make the groups equal size or equal success rates.
  *   *Fix:* "The Audit is on the data provided. You cannot curate the applicants. You can only set the rule."

  **3. "This is just math, not philosophy."**
  *   *Problem:* Students might feel the activity was a calculation exercise.
  *   *Fix:* In the debrief, pivot hard to the *normative* choice. "The math proves the conflict. The philosophy is deciding which constraint to violate. Which violation is less harmful to human dignity?"

  **4. Silence / Confusion.**
  *   *Problem:* They get stuck on the percentages.
  *   *Fix:* Have a pre-calculated "Cheat Sheet" in your pocket. If they are truly stuck after 10 minutes, project a table showing the Rejection Rates at Cutoff 4, 5, and 6. Let them see the mismatch visually rather than calculating it.

  # What The Game Cannot Reproduce (For Your Debrief Notes)

  You must supply these three concepts in the debrief because the tabletop format inherently sanitizes them:

  1.  **Label Bias (The "Unknown Unknown"):**
      *   *Game:* The "Success/Fail" label on the back of the card is objective truth.
      *   *Reality:* In criminal justice or lending, "Fail" (reoffending/default) is only observed for those who were released/funded. We do not know the counterfactual. If the historical data used to train the score was biased (e.g., over-policing in Group South), the Base Rate in the envelope is *already* corrupted. The game treats the base rate as a natural fact; in reality, it is often a product of past policy.

  2.  **Performative Prediction (Feedback Loops):**
      *   *Game:* The cards don't change after you make your decision.
      *   *Reality:* Algorithms change the world they measure. If you deny grants to Group South, their businesses fail, confirming the high-risk prediction. This creates a self-fulfilling prophecy that widens the base rate gap over time. The game is a snapshot; reality is a movie.

  3.  **Proxy Variables & Intersectionality:**
      *   *Game:* Groups are clearly marked with Red/Blue dots.
      *   *Reality:* Protected class status is rarely a direct input. It is encoded through proxies (zip code, shopping habits, vocabulary). Furthermore, people belong to multiple groups (intersectionality). The game forces a binary choice; real fairness audits require navigating high-dimensional, overlapping identities where "Base Rates" are unstable and context-dependent.
