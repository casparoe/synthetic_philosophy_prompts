      *   *Gap:* The "Leftover Test" sounds like... a Reading Comprehension test. Is that new? It's basically asking if the model has an internal representation. I should point out that this is essentially arguing for "World Models" vs "Next Token Prediction." The essay is a popularization of the "World Model" debate. Acknowledging this might ground it.

