answer: |-
  This is a remarkably coherent set of intuitions for someone who has spent a decade in the rationality diaspora. You have essentially reconstructed a version of **Resolute Choice** combined with **Functional Decision Theory (FDT)** intuitions, but you are trying to ground it in a **Causal Consequentialist** meta-ethic.

  The package *almost* hangs together, but there are structural load-bearing walls that are cracking under the weight of your commitments. Specifically, you are trying to hold three things that form an "impossible triangle" in decision theory: **Non-EU Preferences (Allais)**, **Immunity to Money Pumps**, and **Local Consequentialism**.

  Here is the audit of your commitments, ranked by severity of tension.

  ### 1. The "Impossible Triangle" (Severity: Critical)
  **Tension:** (a) Allais Preferences vs. (b) Money Pump Absolutism vs. (d) Local Consequentialism.

  *   **The Conflict:** You state you are an absolutist about money pumps (b). Standard Allais preferences (a) violate the Independence Axiom. While violating Independence does not necessarily violate Transitivity (you can have transitive Allais preferences), it does make you **dynamically inconsistent**. Dynamic inconsistency is what allows the money pump (specifically, the "Common Consequence" pump).
  *   **Why (d) makes it fatal:** If you evaluate decisions based on "what actually happens" at the moment of choice (d), then when you arrive at the second node of the money pump, the "rational" move is to switch preferences to maximize the local outcome. This triggers the pump. To avoid the pump while keeping Allais preferences, you must employ **Resolute Choice**: binding yourself to the plan you made *ex-ante*, even when the *ex-post* local consequences look suboptimal.
  *   **What breaks:** Resolute Choice is incompatible with strict Local Consequentialism (d). If you choose the resolute path at the second node, you are explicitly choosing an option that yields worse *local* actual consequences than the alternative, solely to satisfy a past policy.
  *   **Cost of Fix:** You must abandon (d) in favor of **Global/Policy Consequentialism**. You have to accept that "what matters" is the outcome of the *policy you instantiated*, not just the causal consequences of the specific physical act at time $t$.

  ### 2. The Newcomb/Consequentialism Clash (Severity: High)
  **Tension:** (c) One-Boxing/Counterfactual Mugging vs. (d) "Spooky" Counterfactuals.

  *   **The Conflict:** You say you are a consequentialist about "what actually happens" and find branches that "by hypothesis never occur" spooky (d). Yet, the standard justification for one-boxing (c) and paying in counterfactual mugging requires caring about subjunctive dependence or logical correlations.
      *   In Newcomb: If you are a strict actual-consequentialist (CDT), the money is already in the box or not. Your choice now cannot causally affect the past. Two-boxing dominates. To one-box, you must believe your choice *provides evidence* about the past (EDT) or *logically determines* the past (FDT). Both require caring about a "branch" (the predictor's simulation) that isn't the "actual" physical reality you are standing in.
      *   In Counterfactual Mugging: You pay in the heads world to benefit the tails world. By your definition in (d), the tails world "by hypothesis never occurs." Why pay for a branch that doesn't exist?
  *   **What breaks:** Either you stop one-boxing/paying (abandon c), or you admit that "what actually happens" includes the logical output of your decision algorithm across possible worlds (abandon d).
  *   **Cost of Fix:** You have to redefine "consequences" to include **logical consequences**. This feels "spooky" to your current (d), but it is the only way to make (c) coherent without magic.

  ### 3. Ergodicity vs. Non-EU Justification (Severity: Medium)
  **Tension:** (f) Ergodicity Critique vs. (a) "Multiply Doesn't Capture It."

  *   **The Conflict:** You cite the ergodicity critique (f) to reject ensemble averages in one-shot decisions. However, Ergodicity Economics (e.g., Ole Peters) typically argues for maximizing the **time-average growth rate** (geometric mean). This is still a form of multiplication (EU with Log Utility).
  *   **The Problem:** In (a), you justify Allais by saying "multiply doesn't capture everything." If you truly embrace (f), you *should* be multiplying—just geometrically instead of arithmetically. If your Allais preference is driven by the catastrophic drop in geometric growth from the 1% ruin risk, then you are actually an EU maximizer with a specific utility function, not an Independence-violator.
  *   **What breaks:** Your justification in (a). If (f) is true, you don't need to violate Independence; you just need a non-linear utility function (Log Wealth).
  *   **Cost of Fix:** You might have to admit your Allais preference is actually EU-compliant (just high risk aversion), which undermines your claim that "multiply doesn't capture everything."

  ### 4. Repeated vs. One-Shot (Severity: Low)
  **Tension:** (e) Repeated EV vs. (a) One-Shot Non-EV.

  *   **The Conflict:** Why is EV king for poker (e) but not for Allais (a)?
  *   **Resolution:** This is the easiest tension to resolve. It is standard to assume diminishing marginal utility of money for life-changing sums (Allais) and linear utility for bankroll growth (poker).
  *   **Cost:** None. This is consistent with almost any utility-maximization framework.

  ---

  ### The Single Revision

  **Change (d): From "Local Actual Consequentialism" to "Global Policy Consequentialism."**

  **Current (d):** "What matters is what actually happens as a result of the choice. Arguments that lean on what would have happened in some branch that by hypothesis never occurs strike me as a bit spooky."

  **Revised (d):** "What matters is the **outcome of the decision algorithm** I instantiate. This includes logical correlations (Newcomb) and pre-commitment stability (Allais), because the 'actual result' of my choice includes the fact that I am the *kind of agent* who makes this choice."

  **Why this buys the most consistency:**
  1.  **Saves (a) & (b):** It allows for **Resolute Choice**. You can hold Allais preferences without being money-pumped because you evaluate the *policy* (which is pump-proof) rather than the *local node* (which is pump-vulnerable). This satisfies your absolutism about money pumps.
  2.  **Saves (c):** It makes One-Boxing and Counterfactual Mugging straightforward. You aren't paying for a "spooky branch"; you are optimizing the output of your algorithm, which determines the predictor's action and the mugging payoff.
  3.  **Saves (f):** It aligns with the updateless/ergodic intuition that the "trajectory" matters more than the "snapshot."

  **The Cost:**
  You have to swallow the "spookiness." You must accept that **logical causation** is as real as physical causation. You have to agree that "what actually happens" is partially determined by counterfactual consistency (i.e., "If I were the kind of person who two-boxed, the box would be empty, so me two-boxing *actually results* in $1k").

  ### Summary of the Audit
  Your package is structurally sound **if and only if** you treat your decisions as **policies** rather than **acts**.

  *   **If you keep (d) as written:** You are vulnerable to money pumps (violating b) and should two-box (violating c).
  *   **If you shift to Policy Consequentialism:** You can keep Allais (a), avoid Pumps (b), One-Box (c), and respect Ergodicity (f) without contradiction.

  The hole isn't in your preferences; it's in your meta-ethic of evaluation. You are trying to run FDT-style software on a CDT-style operating system. Upgrade the OS.
