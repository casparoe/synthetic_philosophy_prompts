      *   The biggest structural hole is between (a) Allais (Independence Violation) and (b) Transitivity/Money Pumps.
      *   The second biggest is between (c) One-Boxing and (d) Strict Actual Consequentialism.
      *   *Observation:* The user wants to be a "rationalist" (LW background). LW orthodoxy generally pushes towards FDT/UDT (c) and EU Maximization (b). Allais (a) is usually viewed as a bias there.
