answer: |-
  # Joint Statement on Epistemic and Dynamic Foundations of Game Theory

  **Signatories:** The Epistemic Working Group & The Evolutionary Dynamics Working Group
  **Date:** October 24, 2023
  **Subject:** Consensus, Dissensus, and Empirical Cruxes in Non-Cooperative Game Theory

  Following a series of adversarial collaborations, the undersigned parties issue this statement to clarify the relationship between epistemic game theory (EGT) and evolutionary/learning game theory (LGT). Our goal is to distinguish substantive theoretical disagreements from divergent terminological conventions, and to identify empirical tests that could adjudicate between our competing views on how rationality manifests in strategic interaction.

  ## Part I: Agreed Claims

  We affirm the following propositions as common ground. These claims represent the intersection of our respective frameworks and are accepted as valid by both signatories.

  1.  **The Status of Nash Equilibrium.**
      A Nash equilibrium is a profile of strategies wherein no player can unilaterally deviate to improve their expected payoff, given the strategies of others. We agree that this constitutes a **self-enforcing pattern**: if a population or a set of reasoned expectations settles on a Nash equilibrium, no internal pressure exists to depart from it. We disagree on *how* this state is achieved (deduction vs. convergence), but we agree on its definition as a fixed point of best-response correspondence.

  2.  **The Scope of Rationalizability.**
      Rationalizability correctly identifies the set of strategies that survive the iterated elimination of strategies that are never a best response to any coherent belief about opponents. We agree that this concept successfully captures the minimal implications of "rationality" without assuming coordination on a specific equilibrium. However, we jointly acknowledge that in many games (e.g., coordination games), rationalizability is **too weak** to yield unique predictions, requiring additional assumptions (either epistemic refinements or dynamic selection criteria) to narrow the solution set.

  3.  **Common Priors and No-Trade Theorems.**
      We accept the mathematical validity of results deriving from the Common Prior Assumption (CPA), including Aumann's Agree-to-Disagree theorem and the No-Trade theorems. We agree that *if* agents share a common prior and have common knowledge of their posteriors/beliefs, speculative trade cannot occur and beliefs cannot differ. Our disagreement lies not in the logic, but in the descriptive validity of the CPA in real-world settings. We agree that observed speculation implies either the absence of a common prior, the absence of common knowledge of beliefs, or bounds on reasoning capacity.

  4.  **Interpretation of Standard Experimental Findings.**
      Regarding data from beauty contest games, centipede games, and finitely repeated prisoner's dilemmas: We agree that these findings **falsify the hypothesis** that naive human populations instantly manifest Common Knowledge of Rationality (CKR) in one-shot settings. Behavior systematically deviates from the backward-induction or unique Nash predictions in early rounds. We agree that any viable theory must account for the observed "levels" of reasoning or the rate of convergence toward equilibrium, rather than assuming equilibrium play as a starting condition.

  ***

  ## Part II: Statement of Disagreements

  The following table outlines our remaining substantive disagreements. To ensure clarity, each disagreement is stated twice: once using the conceptual vocabulary of the Epistemic side (Row A), and once using the vocabulary of the Learning/Evolutionary side (Row B). These are not contradictory claims about the world, but divergent interpretations of the same theoretical friction points.

  | Topic | Epistemic Game Theorist Formulation (Row A) | Learning/Evolutionary Game Theorist Formulation (Row B) |
  | :--- | :--- | :--- |
  | **1. The Ontology of Equilibrium** | Equilibrium is a **consistency condition** on beliefs and actions. If agents are rational and know others are rational, equilibrium is the *only* logically coherent outcome. Deviations indicate a failure in the knowledge hierarchy, not the solution concept. | Equilibrium is a **resting point of a dynamic system**. It is an emergent property of adaptation, selection, or reinforcement. Deviations are part of the transient path; the equilibrium is defined by its stability against perturbations, not its logical necessity. |
  | **2. Common Knowledge of Rationality (CKR)** | CKR is the **normative baseline** for strategic rationality. It defines the upper bound of what can be deduced. If a model predicts failure where CKR predicts success, the model assumes agents are irrational or possess asymmetric information about rationality. | CKR is an **empirical hypothesis** about cognitive architecture and information flow. It is a "cute idealization" that rarely holds. Treating it as a baseline biases models against realistic bounds on computation and observation. |
  | **3. The Electronic Mail Game** | The discontinuity in coordination probability is a **feature of rational inference**. Without strict Common Knowledge, the conditional probability of the other coordinating is always sufficiently low to make coordination irrational, regardless of the number of confirmations. | The discontinuity is a **modeling artifact** of partition structures. Real agents treat high probabilities as functional certainties. A learning process will wash out the theoretical discontinuity once the probability of message failure drops below a risk threshold. |
  | **4. Beauty Contest Data (k-levels)** | The observed distribution of k-levels (k=1, 2, 3) reflects **heterogeneous depths of reasoning**. This is a structural feature of the population's epistemic types. Rationality is bounded by a cognitive depth parameter that is stable across similar one-shot contexts. | The observed k-levels reflect **incomplete learning**. In a fixed population, reinforcement will drive k-levels higher over time. The distribution is transient, representing the speed of adaptation, not a fixed cognitive constraint. |

  ***

  ## Part III: Empirical Cruxes

  We identify the following specific experimental setups as "cruxes"—situations where our theories generate divergent, falsifiable predictions. We commit to accepting the outcome of these experiments as evidence weighing in favor of one framework over the other.

  ### Crux 1: The Electronic Mail Game (Coordination under Uncertainty)
  *   **Setup:** Two players must coordinate on action *A* to receive a high payoff. If they mismatch, they receive a severe penalty. Action *B* is a safe, low payoff. Player 1 observes a state (Coordinate vs. Safe). Player 1 sends an email to Player 2. Emails arrive with probability $p < 1$. Automatic confirmations are sent, which also arrive with probability $p$. The game ends when a confirmation fails to arrive.
  *   **Epistemic Prediction:** Coordination on *A* will remain **near zero** regardless of the number of confirmations exchanged (e.g., even at 10 or 20 confirmations). Without infinite common knowledge, the risk of mismatch dominates the expected gain for a rational agent.
  *   **Learning Prediction:** Coordination on *A* will **jump to high levels** once the number of confirmations exceeds a small threshold (e.g., 3 or 4). Agents will learn that the probability of the other player having received the message is sufficiently high to justify the risk, treating the "almost common" knowledge as functionally common.
  *   **Adjudication:** If coordination rates correlate continuously with confirmation length, LGT wins. If coordination rates remain suppressed until the limit, EGT wins.

  ### Crux 2: The Beauty Contest (One-Shot vs. Repeated Populations)
  *   **Setup:** A $p$-beauty contest game (guess 2/3 of the average).
      *   *Condition A (Stranger):* Subjects play one shot against a new, random opponent every round.
      *   *Condition B (Fixed):* Subjects play repeated rounds against the *same* opponent.
  *   **Epistemic Prediction:** In Condition A, the distribution of guesses (k-levels) will remain **stable** over time. Since partners rotate, there is no opportunity to learn specific opponent tendencies, so players rely on their fixed cognitive depth. In Condition B, convergence occurs faster, but the *one-shot* behavior is structurally bounded.
  *   **Learning Prediction:** In Condition A, the population average will still **converge toward 0 (Nash)** over time, though slower than Condition B. Generalized reinforcement (winning with lower numbers) transfers across partners. The "k-level" is not a fixed type but a state of learning that updates even against strangers if the task structure is constant.
  *   **Adjudication:** If Condition A shows no significant convergence toward Nash over 50+ rounds, EGT wins (supporting fixed cognitive types). If Condition A shows significant convergence toward Nash, LGT wins (supporting generalized learning).

  ### Crux 3: Risk-Dominant vs. Payoff-Dominant Selection
  *   **Setup:** A symmetric 2x2 coordination game. Equilibrium X is Payoff-Dominant (higher reward). Equilibrium Y is Risk-Dominant (safer against random noise). Subjects are paired randomly in a large population with "trembles" (forced random moves) introduced at a low rate.
  *   **Epistemic Prediction:** The population will coordinate on **Equilibrium X (Payoff-Dominant)**, provided it is salient. Rational agents with common knowledge can deduce that X is mutually beneficial and signal this through focal points, ignoring the risk of trembles as irrational noise.
  *   **Learning Prediction:** The population will converge to **Equilibrium Y (Risk-Dominant)**. Under stochastic evolutionary dynamics (e.g., logit response), the basin of attraction for Y is larger. Long-run stability is determined by resistance to noise, not by the payoff magnitude at the fixed point.
  *   **Adjudication:** Long-run population state. If X persists despite trembles, EGT (focal point/CKR) is supported. If Y dominates, LGT (stochastic stability) is supported.

  ***

  **Signed,**

  *The Epistemic Working Group*
  "We maintain that rationality is a logical constraint on belief systems."

  *The Evolutionary Dynamics Working Group*
  "We maintain that rationality is a descriptive label for successful adaptation."
