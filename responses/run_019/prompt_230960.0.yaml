answer: |-
  ### Pre-Vote Screen: The Liberty & Consensus Check

  **Timebox:** 30 Minutes  
  **Owner:** Meeting Chair  
  **Goal:** Detect when "Personal Rights" and "Group Unanimity" are logically incompatible before voting begins.

  | Step | Question to ask | What counts as a pass | What to do on a fail | Stop or continue | Judgment call (yes/no) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Scope** | "Is this decision about a specific person's protected domain (schedule, desk, travel) or a general policy?" | Clear agreement on whether this is **Personal** or **General**. | Pause. Define the boundary. If unclear, treat as General. | Continue | No |
  | **2. Rights Claim** | "Does anyone claim this decision falls under their 'final say' rights?" | **No** claims made. | Record the specific right claimed (e.g., "Alice claims schedule autonomy"). | Continue | No |
  | **3. Impact Check** | "If Person X exercises their right, does it materially change the work conditions for Person Y?" | **No** material impact on others (purely self-regarding). | Flag as **Interdependent**. The right is no longer absolute. | Continue | No |
  | **4. Unanimity Check** | "Does *everyone* (including the rights-holder) prefer the Group Option over the Personal Option?" | **Yes**, unanimous preference for Group Option. | Record the preference. Note if the rights-holder is voting against their own right. | Continue | No |
  | **5. Collision Test** | "If we respect the Right, do we break the Unanimous Preference? If we respect the Preference, do we break the Right?" | **No** conflict (both can coexist). | **STOP.** You have identified a Liberal Paradox. You cannot satisfy both rules. | **Stop** | **Yes** |
  | **6. Path Forward** | "Since we can't satisfy both, which rule do we suspend for this specific case?" | Group agrees to suspend either the Right or the Unanimity rule temporarily. | Chair calls for a 'Values Vote' (not a policy vote). | Continue | **Yes** |

  ***

