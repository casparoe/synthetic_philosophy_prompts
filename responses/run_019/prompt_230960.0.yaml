prompt: |-
  I run people-ops at a worker co-op where we try to live by two rules at once: everyone gets final say over a few things that are purely theirs (their schedule, their workstation, whether they travel), and if every single person prefers X over Y, we go with X. Last quarter this produced a circular ranking twice, and the postmortems turned into arguments about who's rights got overridden. I gather this is basically Sen's liberal paradox, but for us the theorem isn't actionable as-is. Write me a reusable pre-vote screen the meeting chair can run in under 30 minutes to catch, before the vote, when individual decisiveness and unanimous preference are about to collide, using Sen's impossibility of a Paretian liberal but translated into plain questions — no formalism, no proof. The chair isn't a philosopher; the decisions recur weekly-ish; stakes are medium (schedules, pay, workspace); and whatever we land on has to be defensible to the whole co-op afterward.

  Format: give me the procedure as a table with columns Step, Question to ask, What counts as a pass, What to do on a fail, Stop or continue, Judgment call (yes/no). Then apply it to two worked cases as JSON with fields case_name, setup, results (one entry per step), conflict_found, recommended_action, residual_judgment. Make one case a weekend on-call norm where the procedure tells us we have to override someone's personal call or drop the unanimity rule, and we'll hate both; in that case say explicitly what the checklist cannot settle for us.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A worker co-op running People-Ops.
      *   **Core Conflict:** Two rules are clashing:
          1.  *Individual Liberty:* Everyone has final say over specific personal domains (schedule, workstation, travel).
          2.  *Pareto Efficiency (Unanimity):* If everyone prefers X over Y, the group chooses X.
      *   **Problem:** This creates Sen's Liberal Paradox (circular rankings, rights overridden, arguments).
      *   **Goal:** A reusable pre-vote screen (checklist) for the meeting chair.
      *   **Constraints:**
          *   Must run in under 30 minutes.
          *   No formalism/proofs (plain questions).
          *   Chair is not a philosopher.
          *   Decisions recur weekly-ish, medium stakes.
          *   Outcome must be defensible.
          *   **Format:** Table (Step, Question, Pass, Fail, Stop/Continue, Judgment Call) + Two JSON worked cases.
          *   **Specific Case Requirement:** One case must be a weekend on-call norm where the procedure forces a hard choice (override personal call OR drop unanimity), explicitly stating what the checklist *cannot* settle.

  2.  **Deconstruct Sen's Liberal Paradox for this Context:**
      *   Sen's theorem states that no social welfare function can satisfy Unrestricted Domain, Pareto Efficiency, and Minimal Liberalism simultaneously.
      *   *Translation:* You can't have everyone be a dictator over their own stuff *and* respect unanimous group preference *and* always get a consistent result.
      *   *The "Collision":* The paradox arises when Person A's personal choice affects Person B's preference, and Person B's personal choice affects Person A's preference, creating a cycle when combined with a unanimous preference about the joint outcome.
      *   *Practical Application:* We need to detect *interdependence*. If my "personal" choice actually impacts your "personal" sphere, my liberty claim weakens. If we all agree on a outcome that violates someone's "personal" sphere, the unanimity claim weakens.
      *   *The Screen:* Needs to identify if a proposal actually touches a "protected domain" and if the "unanimous preference" is actually about that protected domain.

  3.  **Drafting the Pre-Vote Screen (The Table):**
      *   *Time Limit:* 30 mins means max 5-6 steps.
      *   *Step 1: Define the Proposal.* What are we actually voting on?
      *   *Step 2: Identify Protected Domains.* Who claims this is their personal turf?
      *   *Step 3: Check for Externalities.* Does this "personal" choice actually hurt others? (This is the crux of the paradox resolution in practice).
      *   *Step 4: Check the Unanimity Claim.* Does everyone *really* prefer the alternative, or are they just deferring?
      *   *Step 5: The Collision Test.* If we respect the personal right, does it break the group preference? If we respect the group preference, does it break the personal right?
      *   *Step 6: Decision Path.* If collision exists, we need a judgment call (because the math says it's impossible to satisfy both).

      *Refining the Questions:* Make them conversational but rigorous.
      *   *Pass/Fail:* Needs to be clear.
      *   *Judgment Call:* The chair needs to know when *they* (or the group) have to make a tough call vs. when the process decides it.

  4.  **Drafting the JSON Cases:**
      *   *Case 1 (Standard):* Something resolvable. Maybe office temperature or meeting times. Let's go with "Remote Work Days."
      *   *Case 2 (The Hard One):* Weekend On-Call.
          *   *Setup:* Co-op needs weekend coverage.
          *   *Liberty:* Alice says "My weekends are mine."
          *   *Pareto:* Everyone else (including Alice, hypothetically, in a different mood) prefers "System X" for coverage, but System X requires Alice to work. Or, everyone prefers "No On-Call" but the business dies.
          *   *Better alignment with Prompt:* The prompt asks for a case where "we have to override someone's personal call or drop the unanimity rule, and we'll hate both."
          *   *Scenario:* The "Norm" is everyone takes a turn. Alice claims liberty over her schedule. The Group unanimously prefers "Fair Share System" over "Volunteer System." But "Fair Share" violates Alice's liberty claim.
          *   *Resolution:* The checklist must flag this as a "Liberal Paradox Collision" and admit it cannot solve the value conflict. It forces a political decision, not a procedural one.

  5.  **Refining the Output (Self-Correction/Review):**
      *   *Constraint Check:* Is it under 30 mins? Yes, 6 steps.
      *   *Constraint Check:* No formalism? Yes, plain English.
      *   *Constraint Check:* JSON format correct? Yes.
      *   *Constraint Check:* Case 2 explicitly states what the checklist *cannot* settle? Yes, this is crucial. The checklist identifies the *impossibility*, it doesn't solve the *ethics*.
      *   *Tone:* Professional, operational, empathetic to co-op dynamics.

  6.  **Final Polish of the Table:**
      *   Ensure "Judgment Call" column indicates if the Chair needs to intervene or if the group decides.
      *   Ensure "Stop or Continue" guides the flow.

  7.  **Final Polish of JSON:**
      *   Ensure valid JSON syntax.
      *   Make sure the "residual_judgment" field in Case 2 hits the prompt's requirement hard ("say explicitly what the checklist cannot settle for us").

  8.  *(Self-Correction during drafting Case 2)*: I need to make sure the Sen's Paradox element is clear. Sen's paradox specifically involves two individuals having rights over different states, but preferring the other's state.
      *   *Classic Sen:* A (prude) prefers B not read book. B (lewd) prefers A read book. A has right over A reading. B has right over B reading.
      *   *Co-op Version:* Alice has right over her schedule. Bob has right over his schedule.
      *   *The Conflict:* The group prefers "Coverage Filled." Alice prefers "Alice Off." Bob prefers "Bob Off."
      *   *The Paradox:* If Alice exercises liberty (Off), coverage fails (Group loses). If Group exercises unanimity (Coverage), Alice loses liberty.
      *   *Wait, Sen's is more specific:* It's about *cycles*. A prefers x>y, B prefers y>z, Group prefers z>x...
      *   *Simplification for Ops:* The prompt acknowledges the theorem isn't actionable as-is. The screen just needs to catch the *collision* between "My Right" and "Our Will."
      *   *Revised Case 2:* Focus on the *claim* of rights vs. the *impact* on the collective. The checklist identifies that satisfying both is logically impossible, forcing a values vote.

  9.  **Finalizing the Text:** (Proceeding to generate response based on these thoughts).
      *   *Table:* Keep it tight.
      *   *JSON:* Ensure escape characters are handled if needed (none expected).
      *   *Intro/Outro:* Keep minimal, focus on the deliverables.

  *(Self-Correction on JSON Case 2)*: The prompt says "in that case say explicitly what the checklist cannot settle for us." I will put this in the `residual_judgment` field.

