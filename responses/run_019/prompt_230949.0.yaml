answer: |-
  You raise a difficulty that I myself wrestled with considerably, and I commend the precision with which you have identified the tension. It is indeed true that when we apply the method of isolation, we find that a state of consciousness enjoying beauty is more valuable if the object exists than if it does not. But we must be careful here not to confuse the constituents of a valuable whole with separate intrinsic goods. According to the principle of organic unities—which I take to be fundamental—the value of a whole is not simply the sum of the values of its parts. The existence of the beautiful object, apart from any consciousness of it, possesses little or no intrinsic value; yet, when combined with the appropriate consciousness, it forms a whole that is vastly more valuable than the consciousness alone. Thus, the external object is not necessarily a second intrinsic good standing on its own; rather, its existence is a necessary condition for the *highest* value of the conscious state itself.

  This does not threaten the claim that personal affection and aesthetic enjoyment are the chief goods, provided we understand "aesthetic enjoyment" not as a mere subjective feeling, but as a cognitive relation to what is truly beautiful. The intrinsic value resides in the *consciousness of the beautiful object*, and the truth of that cognition is an essential feature of this complex state. If we were to isolate the existence of the object from all consciousness, we would not find a good of comparable magnitude. Therefore, we need not posit a dualism of goods; we simply acknowledge that the greatest goods are complex organic unities, wherein the reality of the object is indispensable to the value of the experience, without being a separate rival to it.
