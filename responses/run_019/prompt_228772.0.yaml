      *(Refining the "Both True" question)*: This is the philosophical crux. If a theory is too demanding, it usually isn't too permissive. Unless... the demandingness applies to *sacrifice* and the permissiveness applies to *constraints on action* (i.e., you must sacrifice everything, but you can do *anything* to get there). I need to make sure the question captures this nuance.

