answer: |-
  This is a classic reconstruction of Kripke's Wittgenstein (KW) skeptical paradox, tailored to the specific context of computation. Your friend has presented the argument cleanly, and your intuition that the conclusion is untenable is shared by the majority of the literature. However, as you discovered, the premises are seductive because they rely on deeply ingrained naturalistic and verificationist intuitions.

  Given your two constraints—**(1) Meaning is genuinely normative** and **(2) There are facts about what people mean**—there is only one viable path through this minefield. You must reject **Premise (3)**.

  Here is the diagnosis of the error, an explanation of its allure, and a pricing of the standard alternatives relative to your theoretical commitments.

  ### The Diagnosis: Reject Premise (3)

  **Premise (3)** states: *The facts surveyed in (1) and (2) — past use and dispositions — exhaust the candidate facts about S that could fix which function S computes; anything further (an inner intention, a mental state) is itself just another item that stands in need of interpretation and so inherits the same indeterminacy.*

  This is the **Skeptical Premise**. It asserts an ontological exhaustion claim: that the only available candidates for meaning-constituting facts are behavioral, dispositional, or internal pictures/representations (which themselves require interpretation).

  **Why it is the error:**
  Premise (3) begs the question against **Meaning Realism** (or Primitivism). It assumes that for a fact to be legitimate, it must be reducible to non-intentional, non-normative base facts (behavior, dispositions, physical states). If you accept that there are *sui generis* intentional facts—facts about what a speaker means that are not reducible to dispositions or behavior—then (3) is false.

  **Why it looked compelling:**
  It leverages a **naturalistic/verificationist anxiety**. We are trained to think that if a fact cannot be cashed out in terms of observable behavior or physical states, it is "queer" or occult. Furthermore, it exploits the **Interpretation Regress**: if you posit an inner mental state (like a grasping of a rule), the skeptic asks, "What fixes the content of *that* state?" If you answer with another representation, you launch a regress. Premise (3) assumes the only way to stop the regress is to bottom out in non-intentional dispositions. If you deny that assumption, the regress stops at the intentional fact itself.

  ### Pricing the Alternatives

  To see why rejecting (3) is your best option, we must price the other standard responses against your constraints.

  #### 1. The Reductive Dispositionalist (Rejects 2)
  *   **The View:** Claims that idealized dispositions *do* fix meaning. If we idealize away from fatigue, distraction, etc., there is a unique function S is disposed to compute.
  *   **The Cost:** This view collapses normativity into regularity. As Kripke (and Hume before him) noted, dispositions tell us what a speaker *will* do, not what they *ought* to do. If a speaker is disposed to say "125" when asked "68 + 57", the dispositionalist must say they *mean* quaddition, not addition. This makes error impossible (you always mean whatever you are disposed to say).
  *   **Price relative to your constraints:** **Prohibitive.** It violates your constraint that meaning is **genuinely normative**. It cannot account for the gap between performance and correctness.

  #### 2. The Communitarian (Rejects 4)
  *   **The View:** Meaning is determined by agreement with the community. S computes addition if their responses align with the community's dispositions.
  *   **The Cost:** This renders meaning relative to the group. If the community changes its mind, the truth conditions of the past change. More critically, it struggles with normativity: Why *ought* I follow the community? If the community is wrong (e.g., a community of flat-earthers using "round"), does that make "round" mean flat?
  *   **Price relative to your constraints:** **High.** It weakens **normativity** (reducing it to social pressure) and threatens the objectivity of **facts about meaning** (making them contingent on communal consensus).

  #### 3. The Sceptical-Solution Theorist (Accepts 5, Blocks 6)
  *   **The View:** (Kripke's Wittgenstein). Accepts there are no truth-conditional facts about meaning (accepts 5). Argues that meaning attributions are still legitimate because they have *assertibility conditions* based on social utility, not truth conditions.
  *   **The Cost:** This is an anti-realist position. It denies that sentences like "Jones means addition by '+'" are fact-stating in the robust sense. It treats meaning talk as a move in a language game rather than a description of reality.
  *   **Price relative to your constraints:** **Prohibitive.** It explicitly violates your constraint that **there are facts about what people mean** (in the truth-conditional sense). It also tends to deflate normativity into conditions of social sanction.

  #### 4. The Meaning Primitivist / Robust Realist (Rejects 3)
  *   **The View:** (McDowell, Boghossian, early Putnam). There are irreducible, *sui generis* facts about meaning. When I grasp the concept of addition, I am in a state whose content is intrinsically normative. This state is not an inner picture requiring interpretation; it is a direct engagement with a rule.
  *   **The Cost:** Metaphysical "queerness." It requires accepting intentional/normative facts as part of the fundamental furniture of the world, not reducible to physics or behavior. Critics call this occult or magical.
  *   **Price relative to your constraints:** **Low.** This is the only view that preserves **both** constraints. It maintains that there are truth-conditional facts about meaning (violating the skeptic's naturalism) and that these facts are inherently normative (they dictate correct use independent of disposition).

  ### How to Keep Both Constraints (The Strategy)

  To satisfy your doctoral requirements and your philosophical intuitions, you should adopt the **Primitivist/Realist** stance. Here is how you explain away the argument's appearance of soundness while keeping Normativity and Facts:

  1.  **Attack the Ontology of (3):** Argue that Premise (3) relies on a "reductive fallacy." It assumes that for $X$ to be a fact, $X$ must be reducible to non-$X$ terms (e.g., meaning facts must be reducible to non-meaning facts). There is no principled reason to accept this. If we accept moral facts or mathematical facts as irreducible (as many non-naturalists do), we can accept intentional facts similarly.
  2.  **Reclaim Normativity:** By rejecting (3), you posit that the fact *that S means addition* is itself a normative fact. It entails that S *ought* to answer "125" to "68 + 57". This "ought" is not derived from dispositions (which are descriptive) but is constitutive of the intentional state itself. As Paul Boghossian argues, content is inherently normative; to have a belief with content is to be subject to norms of correctness.
  3.  **Stop the Regress:** The skeptic asks, "What interprets the inner state?" The Primitivist answers: **Nothing.** An interpretation is only needed if the state is inert (like a picture). But a mental state of *understanding* is not inert; it is active. It is the exercise of a capacity. To demand an interpretation of the understanding itself is to misunderstand the nature of understanding. (See John McDowell's *Mind and World* for the "sideways-on" critique).

  ### Recommendation

  Your friend's argument is valid, but unsound because **Premise (3) is false**. It assumes a reductive naturalism that you are not obliged to accept.

  *   **If you keep (3):** You must choose between Sceptical Solution (lose Facts) or Dispositionalism (lose Normativity).
  *   **If you reject (3):** You keep both Facts and Normativity, paying only the cost of metaphysical non-reductionism.

  Given your explicit constraints, the cost of non-reductionism is the smallest price to pay. It allows you to say: "Yes, there is a fact of the matter about what I mean, and that fact dictates how I ought to use the symbol, regardless of my finite dispositions or the community's agreement."

  **Suggested Reading for your next meeting:**
  *   **Paul Boghossian, *Fear of Knowledge*:** Specifically the chapters on Meaning Scepticism. He defends the primitivist view explicitly against Kripke.
  *   **John McDowell, *Mind and World*:** For the argument that the demand for an "external" constraint on meaning is a misunderstanding of our conceptual capacities.
  *   **Jerry Fodor, *Psychosemantics*:** For a naturalistic attempt to reject (3) without primitivism (though this may risk your normativity constraint, it's worth reviewing the teleological options).

  Tell your friend that her argument proves not that meaning is indeterminate, but that **meaning facts are not reducible to behavioral facts.** That is a conclusion you can happily sign.
