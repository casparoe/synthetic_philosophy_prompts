  ### Logical Space Analysis
  *   **Empty/Unattractive Combinations:** The combination of **Game-Form Rights (Leaf 2)** + **Pareto Priority (Leaf 3)** is logically unstable. If rights are only about actions (game forms), Pareto comparisons over *outcomes* become category errors. You generally cannot hold both that "only actions matter" and "outcome efficiency trumps."
  *   **The Trap (Node 4):** The "natural" libertarian answer is "Yes, it's his right to waive." This leads to **Gibbard's Waivable Liberalism**. The embarrassment: This reduces rights to commodities. If Prude is poor and Lewd is rich, Lewd buys the right to offend. You have saved Pareto and Liberty, but turned rights into market goods.
  *   **The Welfarist Trap (Node 1):** The "natural" welfarist answer is "No, meddlesome preferences shouldn't count." This leads to **Restricted Domain**. The embarrassment: To save social welfare functions, you must declare certain desires (disgust, moralism) illegitimate. This is illiberal censorship of the internal sphere.

  ### Leaf Flagging: The Blurry Distinction
  **Leaves 2 (Game-Form) and 6 (Libertarian Absolutism)** are often functionally identical in policy prescriptions (hands-off state), but their justifications differ.
  *   **Why they blur:** Both result in the state refusing to intervene in Lewd's reading.
  *   **Splitting Question:** "If a mob physically prevents Lewd from reading (without state involvement), has a violation occurred?"
      *   **Game-Form (Leaf 2):** No. Lewd had the *action* available; the mob's interference is a separate violation of security, not a violation of the specific *right to read* defined as non-interference by the *state*.
      *   **Libertarian Absolutism (Leaf 6):** Yes. If the right is to the *outcome* (or the effective freedom), the state has a duty to protect the capacity to exercise the right, not just abstain from banning it.

  ### Printing Instructions
  *   Copy the text block above into a monospaced font (Courier, Consolas, or Roboto Mono).
  *   Set font size to 9pt or 10pt.
  *   Ensure page margins are narrow (0.5 inches).
  *   The tree fits vertically on a standard A4/Letter page if line spacing is single.
  *   **Tip for the Moderator:** Print a second copy where you circle the "Trap Node" in red pen before handing it out, just to watch them squirm when they arrive at Leaf 4.
