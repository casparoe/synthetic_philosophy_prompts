      *   *Diamond's Critique:* In risky prospects, Prioritarianism violates "Personal Good" (ex-ante). If I have a 50% chance of being rich or poor, vs 50% chance of being middle, Prioritarianism might prefer the latter even if expected utility is lower. This looks like leveling down expected welfare for the sake of equality of *prospect*.
