answer: |-
  This is a remarkably sophisticated ethical dilemma. You have instinctively stumbled upon a problem that philosophers have wrestled with for decades, specifically regarding **interpersonal utility comparisons** and the **Utility Monster** objection to utilitarianism.

  Your girlfriend is arguing from a classic Utilitarian framework: *Maximize the total amount of happiness in the universe.* If Marta gets 100 units of joy and Tomas gets 40, you take Marta. 100 > 40. End of story.

  But your hesitation reveals why that framework often fails in intimate human relationships. Here is how to break down the thinking, the currencies, and the decision.

  ### 1. The Measurement Problem: Is "Happiness" Comparable?
  You asked: *"How would anyone actually know that? Is that a real comparison or a useful fiction?"*

  It is a **useful fiction**. There is no "hedonimeter" we can clip onto Marta and Tomas to measure their neural dopamine output. Marta might cry, but Tomas might feel a quiet sense of connection with you that sustains him for months. Marta's joy is *intense*; Tomas's potential relief might be *profound*.

  Because we cannot measure this objectively, trying to act as a "Happiness Accountant" is a trap. You are trying to solve an equation where the variables are unknowable. When you treat friendship like an optimization problem, you risk losing the "friend" part of the equation.

  ### 2. The "Utility Monster" Problem
  You wrote: *"If the rule is 'give things to whoever will appreciate them most,' then excitable people like Marta just hoover up everything forever."*

  You have independently rediscovered a philosophical argument made by Robert Nozick in 1974. He called this the **Utility Monster**. If one person gets disproportionately more happiness from resources than everyone else, strict utilitarianism dictates we should feed that person everything until they are full, leaving everyone else with nothing.

  This feels perverse to you because it is. It punishes people for having emotional resilience or higher standards (Tomas) and rewards people for having intense, perhaps fragile, emotional dependencies (Marta). If you follow the "maximize joy" rule strictly, you create a dynamic where the most emotionally voracious person dictates the distribution of resources. In a friendship, that is unsustainable.

  ### 3. Two Different Currencies: Peak vs. Baseline
  You asked: *"Is 'he needs a win' the same kind of consideration as 'she'll enjoy it more'?"*

  No. They are different currencies.
  *   **Marta represents Peak Experience:** She is operating from a stable baseline. This concert takes her from "happy" to "ecstatic." It is a luxury good.
  *   **Tomas represents Baseline Restoration:** He is operating from a deficit (layoff, breakup). This concert takes him from "struggling" to "okay." It is a medicinal good.

  In ethics of care, **restoring a baseline usually trumps creating a peak.** Giving a steak to a foodie is nice; giving bread to someone starving is necessary. Even if the foodie enjoys the steak *more* than the starving person enjoys the bread, the moral weight lies with the need.

  However, there is a risk here. If you take Tomas, you risk turning the night into **charity**. If he senses you brought him out of pity for his bad year, it could damage his dignity. If you take Marta, you risk turning the night into **performance**, where her reaction validates your choice.

  ### 4. The Decision Framework
  Since you cannot measure joy, do not decide based on *who will feel more.* Decide based on *what kind of friend you want to be in this specific chapter.*

  **The Case for Marta:**
  *   **Validation:** It validates her passion. It says, "I see how much this means to you, and I honor that."
  *   **Shared Language:** You will share a deeper vocabulary about the music. The night will be musically richer.
  *   **The "One-Off" Factor:** This is a reunion. Marta may never get this chance again. Tomas might not care if he misses it.

  **The Case for Tomas:**
  *   **Intervention:** It is an active intervention in a downward spiral. It says, "I see you are hurting, and I want to pull you out for a night."
  *   **Memory Anchor:** For Marta, this is one of many great nights. For Tomas, this could become *the* night that marked the turning point of his year.
  *   **Equity:** It avoids the "Utility Monster" trap. It distributes joy to someone who hasn't had much lately.

  ### The Recommendation
  **Take Tomas.**

  Here is why: Marta's love for the band is robust. It has survived 15 years of breakup. It will survive missing this one show. She has her memories, her shirts, her deep cuts. Her identity as a fan is secure.

  Tomas's well-being is currently fragile. Time-sensitive needs generally outweigh non-time-sensitive desires. While Marta wants this, Tomas *needs* a lifeline.

  **However, you must manage the framing:**
  1.  **Do not tell Tomas it's pity.** Do not say, "I know you've had a hard year, so I brought you." Say, "I wanted you there with me." Make him feel like a companion, not a project.
  2.  **Do not lie to Marta.** Tell her the truth: "I had one spare and I tossed up between you and Tomas. I went with Tomas because he's had a brutal year and I thought he needed the lift. I know you're the superfan, and I'm sorry to miss sharing that with you." A true friend will understand that sometimes care trumps enthusiasm.
  3.  **Make it up to Marta.** Promise her that when the band inevitably releases a remastered album or does a streaming event, you are doing that with her.

  ### Summary on How to Think About This
  Stop trying to be an Act Utilitarian (maximizing total joy). Start being a Virtue Ethicist (what action best embodies the kind of friend I want to be?).

  *   **Is "he needs a win" the same currency as "she'll enjoy it more"?** No. Need is a claim of urgency; enjoyment is a claim of intensity. In close relationships, urgency usually binds us tighter than intensity.
  *   **Is comparing joy a real comparison?** No. It is a fiction we use to justify choices. Acknowledge the fiction.
  *   **The Rule:** When resources are scarce, prioritize the friend whose baseline is lowest, provided you can do so without stripping them of dignity.

  Marta will have a great night eventually, with or without you. Tomas might not have a great night at all without you. Take Tomas.
