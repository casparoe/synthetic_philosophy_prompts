answer: |-
  ### The Principle of Asymmetric Evidentiary Burden

  Based on your verdicts, your intuition does not rely on a simple "consensus vs. evidence" binary. Instead, you are applying a variable standard of proof based on how much of the existing historical framework a claim requires us to dismantle. I propose the following principle to codify your judgments:

  **The Principle of Asymmetric Evidentiary Burden**
  A historical claim is admissible for serious discussion if it satisfies three clauses:

  1.  **Material Anchoring:** The claim must be grounded in positive physical data (stratigraphy, artifacts, genetics, isotopes) rather than textual allegory, pattern-matching, or the reinterpretation of known data without new inputs.
      *   *Motivated by:* **Monte Verde** (accepted due to hearths/artifacts) vs. **Plato's Atlantis** (rejected as textual allegory without matching material site).
  2.  **Infrastructural Proportionality:** The complexity of the evidence provided must match the complexity of the claim. Claims of simple *interaction* (trade, migration) require less evidence than claims of complex *civilization* (states, agriculture, technology).
      *   *Motivated by:* **Polynesian Contact** (accepted as a specific interaction supported by a specific tracer, the sweet potato) vs. **Graham Hancock** (rejected because a "lost civilization" implies cities, waste, and tools that are absent).
  3.  **Gap Attribution:** Gaps in the historical record must be attributable to preservation bias or lack of excavation, not to systematic suppression or the systematic failure of independent dating methods.
      *   *Motivated by:* **Troy/L'Anse aux Meadows** (gaps were due to lack of excavation) vs. **Fomenko/Bosnian Pyramids** (gaps are explained by conspiracy or the invalidation of geology/radiocarbon dating).

  ---

  ### Tensions and the Verdict to Relinquish

  **The Tension:**
  This principle accommodates most of your verdicts, but it creates friction with your anxiety regarding **Troy and L'Anse aux Meadows**. You worry that your "No" today might be the "No" of the establishment before Schliemann dug up Troy. However, the principle distinguishes these cases: Troy was an *Existence Claim* (a city is at this coordinate) which became *Materially Anchored* once dug up. Hancock and Atlantis are *Structural Claims* (a civilization existed with this level of complexity) which fail *Infrastructural Proportionality* because a civilization of that scale leaves a "trash footprint" (pottery, sewage, mining) that cannot be hidden by mere lack of excavation.

  **The Verdict to Give Up:**
  If forced to align your judgments strictly with this principle and your own precedent of Troy, you should give up the absolute **"No" on Plato's Atlantis.**

  *   **Reasoning:** Your rejection ("that is not history") is too binary. Troy was also "not history" (it was myth) until it was "history" (a site). While Atlantis as a *literal empire* is pseudohistory, Atlantis as a **cultural memory of a real Bronze Age catastrophe** (likely the Thera eruption/Minoan collapse) is a legitimate historical hypothesis.
  *   **Adjustment:** Instead of removing the claim, moderate it to: *"Atlantis as a literal continent is pseudohistory, but Atlantis as a mythological reflection of the Thera eruption is a valid topic for historical analysis."* This honors the Troy precedent (myth containing a kernel of fact) without validating the pseudoscience.

  ---

  ### Application to New Cases

  **1. The Younger Dryas Impact Hypothesis**
  *   **Claim:** A comet impact caused a sudden climate cooling ~12,800 years ago, contributing to megafauna extinction and potentially disrupting human civilization.
  *   **Analysis:**
      *   *Material Anchoring:* **Mixed.** Proponents cite microspherules and platinum spikes (physical data), but these findings are heavily contested and often unreproducible by independent labs.
      *   *Infrastructural Proportionality:* **High Burden.** A global catastrophe capable of resetting civilization should leave a uniform, undeniable geological layer globally. The record is patchy.
      *   *Gap Attribution:* Proponents often suggest the evidence was overlooked or misidentified, bordering on implying institutional blindness.
  *   **Verdict:** **Restricted Discussion.** Allow discussion of the *climate data* and *geological markers* as a scientific debate. Remove claims that link it definitively to a "lost human civilization" (Hancock-adjacent), as that violates Infrastructural Proportionality (no cities exist to be destroyed by the event).

  **2. *Homo naledi* Deliberately Buried Its Dead**
  *   **Claim:** A small-brained hominin species intentionally deposited bodies in a cave system ~250,000 years ago.
  *   **Analysis:**
      *   *Material Anchoring:* **Strong.** The bones exist, their placement is specific, and dating is improving.
      *   *Infrastructural Proportionality:* **Low Burden.** This claims a specific *behavior*, not a global civilization. It expands our understanding of cognition without requiring us to rewrite the timeline of technology or agriculture.
      *   *Gap Attribution:* Relies on new excavation techniques and re-evaluation of existing finds, not the invalidation of dating methods.
  *   **Verdict:** **Allowed.** This is legitimate, cutting-edge science. It fits the Monte Verde model: new physical evidence challenging a consensus about *capability*, not *chronology*.

  **3. The Voynich Manuscript**
  *   **Claim:** Various theories on origin (Roger Bacon, Aztec, Hoax, Alien) and recent claims of decipherment.
  *   **Analysis:**
      *   *Material Anchoring:* **Strong (Object), Weak (Claims).** The book itself is real and dated (carbon dating). However, claims of decipherment usually lack a key that can be applied consistently to other texts.
      *   *Infrastructural Proportionality:* **High Burden.** A claim of "Deciphered" implies a readable language. If the language is unique and unconnected to others, it risks being unfalsifiable.
      *   *Gap Attribution:* Claims often rely on "hidden ciphers" rather than linguistic patterns.
  *   **Verdict:** **Hybrid.** Discussion of the *object* (provenance, ink, carbon dating) is **Allowed**. Claims of *decipherment* are **Removed** unless they pass peer review outside the Voynich community. This prevents the "fringe decipherment" loop while acknowledging the artifact's historical reality.

  ---

  ### Unfalsifiable vs. Falsifiable but Unevidenced

  There is a principled difference, and it is the engine that drives Clause 3 (Gap Attribution) of your framework.

  *   **Falsifiable but Unevidenced:** "There was a settlement at L'Anse aux Meadows, but we haven't found it yet."
      *   *Status:* **Admissible.**
      *   *Why:* It specifies *what* would count as evidence (sod houses, Norse artifacts) and *where* to look. The absence of evidence is temporary.
      *   *Work in your list:* This protects **Troy**, **L'Anse aux Meadows**, and **Monte Verde** (in its early years). It allows legitimate revisionism.

  *   **Unfalsifiable:** "There was a civilization, but they left no trace because they were spiritual/destroyed/hidden by the establishment."
      *   *Status:* **Inadmissible.**
      *   *Why:* It moves the goalposts. If you find no cities, they say "they didn't build cities." If you find no tools, they say "they used biodegradable tools." If you date the site and it's young, they say "the dating is wrong."
      *   *Work in your list:* This filters out **Fomenko** (dating is a conspiracy), **Ancient Astronauts** (evidence was taken away), and **Hancock** (often relies on the "they left no trace" defense when challenged on infrastructure).

  **Where it does real work:**
  It distinguishes **Polynesian Contact** from **Hancock**.
  *   Polynesian Contact is *falsifiable*: If the sweet potato is proven to have arrived via Spanish trade, or the genetics show no pre-Columbian mix, the hypothesis dies. It risks being wrong.
  *   Hancock's "Lost Civilization" is often *unfalsifiable*: If we don't find cities, they were nomadic. If we don't find writing, it was oral. The claim adapts to avoid the evidence, whereas Polynesian Contact submits to it.

  By enforcing this distinction, you protect your community from conspiracy theories while keeping the door open for the next Monte Verde.
