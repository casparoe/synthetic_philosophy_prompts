  3. Descriptions of pain must characterize it as a state whose representational content outruns anything actually instantiated in the subject's qualitative field. (There is no qualitative field. The pain is real as a representation, false as a presentation. The suffering is in the judgment, not the sensation.)

  4. Discussions of the meta-problem must explain why we are disposed to judge that experience has phenomenal character without allowing that disposition to inherit the character it misdescribes. (The disposition is real; the character is not. Do not conflate the error with the truth of the error. The virus is real; the disease is not.)

