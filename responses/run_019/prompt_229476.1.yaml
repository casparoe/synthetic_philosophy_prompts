      *Self-Correction on Word Count:* I need to ensure I don't ramble in the intro. Get straight to the spec.

      *Drafting text:*
      (Start)
      To naturalize meaning is to explain how physical states acquire "aboutness" without invoking a homunculus interpreter. A successful theory must satisfy a specific job description. It cannot merely correlate states with world items; it must explain the *logic* of representation using only natural facts.

      **The Spec: Requirements for Naturalized Content**

      | Requirement | The Test Case | The Stakes |
      | :--- | :--- | :--- |
      | **Error (Misrepresentation)** | A frog snaps at a black BB. | If content is just "what causes the state," the content becomes "fly-or-BB." A theory must allow the state to be *wrong* (false) without shifting the content to match the error. |
      | **Normativity** | A signal functions as a warning. | Physical systems just *are*. Representations *ought* to match the world. The theory must derive correctness conditions (truth/falsity) from descriptive facts (causes/functions). |
      | **Determinacy** | A detector fires for flies. | Does it mean "fly," "moving black dot," or "food"? Natural facts often underdetermine content. The theory must pick one uniquely without arbitrary stipulation. |
      | **Indicator vs. Represent** | Smoke indicates fire. | Smoke doesn't *represent* fire; it's just a symptom. A theory must distinguish mere reliable causation from genuine semantic content that can be manipulated offline. |
      | **Naturalism** | No spooky semantic forces. | Content must supervene on physical/functional facts. You cannot posit a primitive "meaning particle" or rely on an external interpreter's mind. |

      **Non-Negotiables vs. Preferences**

      To count as a viable naturalistic theory, three requirements are non-negotiable: **Error**, **Normativity**, and **Naturalism**. If a theory cannot explain how a state is false (Error), it dissolves meaning into mere correlation. If it cannot ground correctness conditions (Normativity), it fails to capture the essence of representation. If it relies on non-physical facts (Naturalism), it abandons the project entirely.

      Other features are camp preferences. **Compositionality** (complex meanings built from atomic parts) is demanded by language-focused theorists but may not apply to simple animal signals. **Narrowness** (content determined solely by internal states) is preferred by individualists but rejected by externalists (who argue environment fixes content, as in Twin Earth cases). A theory can fail these and still be a theory of content, but it cannot fail the non-negotiables.

      **The Great Excluder**

      The single requirement that eliminates the most popular theories is **Error (Misrepresentation)**, specifically known as the Disjunction Problem.

      Simple causal theories state: State S means X because X causes S. But errors happen. Sometimes Y causes S (the BB causes the frog's snap). If meaning is just causal history, S means "X or Y." But then the frog is never wrong; it just detects "fly-or-BB." To save the theory, proponents add complex clauses about "optimal conditions" or "evolutionary function." However, specifying these conditions without secretly presupposing the very meaning they try to explain has proven notoriously difficult. Most causal theories collapse here, turning all errors into successes by redefining the content.

      **The Lede: The Impossible Pair**

      The deeper story for your explainer lies in a tension between two non-negotiable requirements: **Normativity** and **Naturalism**.

      This is the hard limit of the field. Naturalism demands that everything be explained via descriptive laws (what *is* the case). Normativity demands that content involve correctness conditions (what *ought* to be the case). This is Hume's Guillotine: you cannot derive an "ought" from an "is."

      If a brain state is just a physical configuration caused by prior physical events, where does the "truth condition" come from? A causal chain describes what *did* happen. A meaning condition describes what *should* happen for the state to be accurate. Teleosemantics tries to bridge this using evolutionary function (the heart *ought* to pump), but critics argue function is just a description of past success, not a genuine norm for future accuracy.

      If these two requirements are genuinely incompatible, then meaning cannot be fully naturalized. It suggests that either semantics remains a primitive, non-physical feature of the universe, or our intuition about "truth" and "error" is a user-illusion generated by complex causal machinery that doesn't actually possess genuine aboutness.

      Most theorists assume they can be jointly satisfied. But the persistent failure to solve the Disjunction Problem without smuggling in normative assumptions suggests the bridge is unstable. Your lede is that the quest to naturalize meaning may be trying to solve a category error: demanding that physical facts do a job (setting standards of correctness) they are structurally incapable of performing.

