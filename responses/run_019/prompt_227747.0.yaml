prompt: |-
  I'm a third-year undergraduate applying for an eight-week summer research fellowship in philosophy, and I need a two-page proposal to submit with the application. My project would be on the so-called paradox of deontology: constraints tell me not to kill even when killing one would prevent five other killings, and that seems paradoxical -- if killings are bad, fewer of them should be better, so the constraint appears to forbid the outcome the constraint's own rationale ranks highest. I've spent the term reading around the standard responses -- agent-relative values, the inviolability or status of persons, second-personal reasons -- and in our reading group I kept having the same half-formed thought: the paradox only gets going if we individuate the relevant states of affairs without reference to agency. A world in which I kill one and a world in which five strangers kill are, from the deliberative standpoint of the agent deciding, not two quantities of one bad stuff; they differ in kind, because one contains something done by me and the other contains things that merely happen. My suspicion is that the paradox is less a contradiction inside deontology than the symptom of smuggling an outcome-ranking picture into a theory whose basic unit is the agent's deed -- and that once that's made explicit, the interesting question shifts to whether the smuggled picture can be independently motivated or is just consequentialism assumed in the premises. I want this turned into a proper proposal rather than a hunch.

  Act as a professional philosopher in normative ethics who has supervised dissertations and sat on fellowship committees -- you know what makes a proposal sound fundable versus half-baked. Before writing the document itself, work through the framing: state the question so it has a determinate answer (something like: does a deed-centered individuation of outcomes dissolve the paradox, or merely relocate it?), give the strongest precise version of my half-formed idea rather than a hedged menu of versions, and reconstruct why the standard responses leave this particular angle open rather than preemptively closing it. The proposal itself should include: the question; why it matters and why it's still open; the method, spelled out as what I would actually do week by week over eight weeks (which arguments I would reconstruct formally, which cases I would test the proposal against -- e.g., variants of the trolley and the surgeon cases, constraints against lying and promise-breaking where the "bad stuff" is less obviously fungible, and the hardest case for my view, where the five killings would be committed by one agent and mine would just add a sixth); what a positive result would look like versus what would count as the project failing, including the possibility that the dissolution works for killing but not for constraints generally; and an honest note on scope -- what I will deliberately not attempt.

  Two constraints on how you write it. First, be committed: pick one formulation of the core idea and defend it, name the single premise you judge most vulnerable to counterattack and say why the project survives even if it falls, and don't present the committee with a buffet of options. Second, do not include a bibliography or cite specific works by name -- refer to positions and arguments by description (the agent-relative-value response, the inviolability response, and so on), since I will add the citations myself and would rather not be handed invented references.
