answer: |-
  You aren't wrong to see the similarity; the tension is real based on a surface reading. However, the classification of Winner as an anti-determinist rests on a specific definition of determinism involving autonomy and inevitability.

  ### The apparent tension
  Your confusion is understandable. Claiming technology dictates social arrangements looks like determinism. If a low bridge prevents buses from passing, the technology appears to cause a social outcome autonomously. Technological determinism argues development drives social change. Since Winner argues artifacts shape political life, the causal arrow seems identical. The tension arises because both positions acknowledge technology's powerful role in shaping society, but they disagree on where that power originates. You see the effect; your professor focuses on the cause: agency versus autonomy.

  ### What Winner is actually claiming
  Winner's core argument is not that technology autonomously dictates politics, but that human actors embed politics into technology during the design process. He distinguishes between two ways artifacts have politics. First, specific design choices can settle political disputes, as with Robert Moses. Here, the politics are not inherent to concrete; they are the result of Moses's intentional agency to exclude certain demographics. The bridge was not low due to engineering constraints, but due to social engineering. The technology is a tool of power, not the source of it. Second, some technologies require specific social organizations to function, like nuclear power needing hierarchical security. However, Winner suggests this is a compatibility issue, not an inevitable law of progress. Crucially, Winner rejects the determinist view that technology develops according to an internal logic independent of society. For classic determinists like Ellul, society must adapt to the machine's needs. For Winner, the machine is adapted to serve specific social interests. He is arguing against technological neutrality, not for technological autonomy. By highlighting the design phase, he shifts focus from the artifact's inevitable impact to the human decisions that created the artifact. Thus, the politics are social in origin, even if they are material in execution. Therefore, the artifact is a repository of past decisions. Winner wants us to see the design process as a legislative session, where specific choices are made that could have been otherwise. This emphasis on contingency and human choice is the antithesis of determinism, which posits that the technological outcome was the only possible path forward. Winner insists we recognize the alternative designs that were rejected, proving the final form was not determined by technical necessity alone. This means the political outcome is traceable to human actors, not the machine's logic. In sum, Winner is describing a social process. He invites us to interrogate the design phase rather than accept the output. Consequently, blaming the technology obscures the real agents responsible for the political arrangement.

  ### Why built-in politics need not be determinism
  The distinction lies in the difference between causality and embodiment. Hard determinism posits that technology is an external force that inevitably transforms society regardless of human intent. Winner argues that technology is a medium through which existing social power is actively solidified and maintained. When a tomato harvester makes small farms unviable, it is not because the machine possesses an autonomous will to destroy smallholders. It is because economic policies, subsidies, and corporate interests favored large-scale agriculture, and the machine was built to suit those interests. The technology locks in these choices, making them hard to reverse, but it did not originate them. Think of it like a law: a speed limit determines how fast you drive, but we don't call that legal determinism because humans chose the limit. Similarly, artifacts can determine outcomes once built, but their construction remains an essentially contingent social process. Winner's framework allows for human responsibility. If politics are built-in, they can be built differently. Determinism removes responsibility by claiming the technology made us do it; Winner's analysis demands we ask who built the bridge and why. The key is that the technology mediates power rather than generating it ex nihilo. It is fundamentally a vessel for human will, not a substitute for it.

  ### Does the distinction hold up
  Ultimately, the distinction holds regarding origins but blurs regarding consequences. Critics argue that once a technology is deployed, its political effects feel deterministic regardless of who designed it. If the bridge stands, buses cannot pass, regardless of Moses's intent. This is sometimes called soft determinism. However, Winner successfully avoids hard determinism by insisting that these arrangements are not inevitable laws of nature. They are reversible political choices masked as technical requirements. By framing artifacts as crystallized power rather than autonomous agents, Winner maintains that society shapes technology just as much as technology shapes society. The classification holds because Winner leaves the door open for democratic redesign, whereas determinism locks it shut. He reminds us that what looks like technical necessity is often just frozen politics in material form.
