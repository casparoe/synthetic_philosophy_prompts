  2.  **Deconstruct the Philosophical Issue:**
      *   **Technological Determinism (TD):** Usually implies technology develops autonomously (independent of social forces) and *then* causes social change. It's often a one-way street: Tech -> Society. It implies inevitability.
      *   **Winner's Argument:** Artifacts can embody political relationships. This happens in two ways: (1) Specific design choices settle political issues (Moses' bridges), (2) Certain technologies require specific social arrangements (nuclear power requires hierarchy).
