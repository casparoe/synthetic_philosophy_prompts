prompt: |-
  You are an expert on the philosophy of collective action and the epistemics of group decision-making. I want a careful structural diagnosis rather than generic leadership advice.

  I am one of seven volunteer moderators of a long-running online community of about forty thousand members. We are all equals on paper, and each of us has the permission to post a site-wide announcement without anyone else's approval. For the past week we have been privately debating whether to respond to a platform policy change that we all regard as bad for the community. All seven of us drafted a personal statement protesting the change. After the drafts circulated, an odd pattern emerged. Each of us, reading only our own draft, concluded that if that draft alone went out, it would be a net positive: it would signal that the moderation team is engaged and might put useful pressure on the platform. Yet we also all agreed that if even three or four of the seven statements went out, it would look as though the moderation team had splintered, and the community would end up worse off than if no statement had been posted. I am fairly confident everyone is reasoning honestly, but the pattern feels structurally broken.

  Please first brainstorm the structural features of the case, then identify the underlying problem and explain how seven individually reasonable judgments could produce a collectively bad outcome. Finally, recommend a concrete decision procedure we could adopt so that this kind of failure does not recur.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Expert on philosophy of collective action and epistemics of group decision-making.
      *   **Task:** Provide a careful structural diagnosis (not generic leadership advice).
      *   **Scenario:** 7 volunteer moderators (equals) of a 40k member community. Platform policy change (bad). All drafted personal statements. All agree: 1 statement = good (signal engagement). 3-4+ statements = bad (looks like splintering). No approval needed for site-wide announcements.
      *   **Requirements:**
          1.  Brainstorm structural features.
          2.  Identify the underlying problem (explain how individual rationality leads to collective sub-optimality).
          3.  Recommend a concrete decision procedure to prevent recurrence.

  2.  **Deconstruct the Scenario (Structural Features):**
      *   *Agents:* 7 moderators.
      *   *Status:* Equals (no hierarchy).
      *   *Power:* Individual veto/execution power (can post without approval).
      *   *Preferences:* All want the best outcome for the community. All agree on the valuation of outcomes (1 is good, 3+ is bad, 0 is neutral/baseline).
      *   *Information:* They know each other's drafts and the general consensus on the *impact* of the number of statements.
      *   *The Conflict:* Individual incentive to act vs. collective constraint on the *aggregate* action.
      *   *The Paradox:* Everyone thinks "My action is good *ceteris paribus*" but "Our combined action is bad."

  3.  **Identify the Underlying Problem (Philosophical/Theoretical Diagnosis):**
      *   *Initial thought:* Prisoner's Dilemma?
          *   *Check:* In PD, defection is dominant regardless of what others do. Here, if I know 6 others are posting, my posting makes it 7 (bad). If I know 0 others are posting, my posting makes it 1 (good). So my payoff *depends* on others. It's not a strict PD.
      *   *Second thought:* Tragedy of the Commons?
          *   *Check:* Usually involves resource depletion. Here the "resource" is the credibility/unified front of the mod team. Each post "uses up" some unity.
      *   *Third thought:* Coordination Problem / Threshold Public Good?
          *   *Check:* Closer. We need to coordinate on a specific number (0 or 1).
      *   *Fourth thought:* The Discursive Dilemma / Doctrinal Paradox?
          *   *Check:* That's usually about logic aggregation. Not quite.
      *   *Fifth thought:* **The Problem of Overdetermination / Redundancy.**
      *   *Key Concept:* **Conditional Reasoning vs. Categorical Reasoning.** Each mod is reasoning conditionally ("If I am the only one..."). But they are acting categorically ("I will post").
      *   *Key Concept:* **The Fallacy of Composition.** What is true of the part (one statement is good) is not true of the whole (seven statements are bad).
      *   *Key Concept:* **Common Knowledge & Iterated Reasoning.** "I know that you know that I know..."
      *   *Specific Label:* This looks like a variant of the **Volunteer's Dilemma** but inverted, or more accurately, a **Coordination Failure under Symmetric Preferences with Negative Externalities of Scale.**
      *   *Best Fit:* **The Paradox of Individual Rationality in Collective Agency.** Specifically, it resembles a **Threshold Public Bad** scenario combined with **Pluralistic Ignorance** (though they know the drafts, they don't know the *intent* to publish).
      *   *Refined Diagnosis:* It is a failure of **Joint Intentionality**. They share a goal but lack a mechanism to form a *joint intention* to act (or not act). They are acting as a "heap" of individuals rather than a "group agent."
      *   *The Core Mechanism:* Each moderator treats their own action as marginal, assuming the others' actions are fixed or independent. But the actions are interdependent. The value of the action is non-linear (1 = +, 3 = -).

  4.  **Drafting the Diagnosis:**
      *   *Feature 1: Symmetric Authority.* No one can stop anyone else.
      *   *Feature 2: Non-Linear Payoff Structure.* The value isn't additive. 1+1+1 $\neq$ 3 units of good. 1 = Good, 3 = Bad.
      *   *Feature 3: Decoupled Deliberation.* They drafted privately, then compared. The decision to *publish* hasn't been collectively made, only the *drafting*.
      *   *Feature 4: Counterfactual Reasoning.* "If *only* I posted..." This is the trap. You can't control "only."

  5.  **Explaining the Failure (The "Why"):**
      *   Use the concept of **Ceteris Paribus Clauses**. Everyone assumes "all else being equal." But all else is *not* equal because everyone is making the same calculation.
      *   Use **Tuomela's We-Mode vs. I-Mode**. They are reasoning in I-Mode (what should *I* do?) rather than We-Mode (what should *we* do?).
      *   Explain the **Nash Equilibrium** aspect. If everyone posts, no single individual has an incentive to un-post (because 6 is already bad, 7 is also bad, but I want my voice heard). Actually, if 6 are posting, I should *not* post to keep it at 6? No, 3+ is bad. So if 2 are posting, I should not post. If 0 are posting, I should post. This is a coordination game.
      *   The failure is the lack of a **Focal Point** (Schelling Point). Which one of the 7 gets to post?

  6.  **Developing the Solution (Decision Procedure):**
      *   Need to move from I-Mode to We-Mode.
      *   Need to restrict individual authority in specific contexts.
      *   *Option A: Voting.* Simple majority? Might lead to 4 posting.
      *   *Option B: Designated Spokesperson.* Rotate or elect one.
      *   *Option C: Pre-commitment/Trigger.* "We will post only if we agree on a single text."
      *   *Option D: The "One Voice" Protocol.* For official responses, only one statement is permitted.
      *   *Selection:* The most robust solution for *this* specific structural flaw (redundancy causing signal noise) is a **Unified Front Protocol**.
      *   *Concrete Steps:*
          1.  Classify the action (Official vs. Personal).
          2.  If Official (site-wide announcement), it requires consensus on *content* and *messenger*.
          3.  Mechanism: Random selection or rotation if multiple volunteers.
          4.  Veto power on *aggregate* impact.

  7.  **Refining the Output (Tone and Structure):**
      *   Tone: Analytical, philosophical, precise. Avoid "soft skills" language.
      *   Structure: Follow the prompt's three steps (Features, Diagnosis, Procedure).
      *   Keywords to include: Non-linear payoffs, Common Knowledge, We-Mode, Schelling Point, Aggregation Problem.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this just a Prisoner's Dilemma?
      *   *Correction:* No, in PD, defecting is always better. Here, posting is only better if *others don't*. It's a **Chicken Game** or **Stag Hunt** variant. Actually, it's a **Threshold Public Good** problem where the threshold is "Max 1".
      *   *Critique:* Is the advice too bureaucratic?
      *   *Correction:* The prompt asks for a "concrete decision procedure," not "talk more." It needs to be structural.
      *   *Emphasis:* Make sure to highlight that the *individual reasoning* was logically valid in isolation but invalid in aggregation. This is the crux of the "structural diagnosis."

  9.  **Final Polish:** Check against the "expert persona." Ensure terms like "epistemics," "collective agency," and "non-monotonic utility" are used correctly. (Proceed to generate response).

  *(Self-Correction Note during final review)*: Wait, I need to be careful about the "Personal Statement" aspect. The prompt says "personal statement" but they are mods posting site-wide announcements. This blurs the line between personal and official. The structural fix must address this ambiguity. The "site-wide announcement" tool is the bottleneck. Even if the *text* is personal, the *channel* is official. This is a key structural feature.

  10. **Finalizing the Plan:**
      *   **Features:** Symmetric Power, Non-Monotonic Utility, Channel Ambiguity, Decoupled Deliberation.
      *   **Diagnosis:** Failure of Collective Intentionality (I-Mode vs We-Mode), The Fallacy of Composition, Lack of Schelling Point.
      *   **Procedure:** "The Single-Voice Protocol" (Categorization -> Consensus on Count -> Selection Mechanism).

