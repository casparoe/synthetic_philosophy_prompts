answer: |-
  ### The practice

  In criminal law, the defendant's liability turns on their breach of public norms, irrespective of the victim's conduct. A plea that the victim 'did it too' is inadmissible; the state's standing to punish is unaffected by private hypocrisy. The focus remains squarely on the defendant's wrongdoing. Conversely, equity operates via the 'clean hands' doctrine. Here, a claimant seeking discretionary relief, such as an injunction, may be barred if their own conduct regarding the same matter is wrongful. The court refuses aid to those whose conscience is tainted. Thus, the law presents a fractured face: in the criminal sphere, the blamer's virtue is irrelevant to the blamee's guilt; in the equitable sphere, the claimant's virtue is constitutive of their standing to complain. This creates a philosophical puzzle regarding whether moral consistency is a precondition for normative authority, or merely a pragmatic filter for specific remedies.

  ### The implicit theory of each half

  The criminal law's rejection of *tu quoque* presupposes a public, objective theory of standing. Blame is not a personal prerogative but an institutional enforcement of shared norms. The state acts as the guardian of the legal order, not merely as an aggrieved party. Consequently, the moral status of the victim or the prosecutor is orthogonal to the defendant's guilt. The wrong exists independently of the blamer; the norm binds all equally, regardless of who invokes it. To allow hypocrisy as a defence would undermine the universality of the law itself, suggesting norms are only binding on the virtuous.

  In contrast, the equitable doctrine presupposes a relational, conscientious theory of standing. Equity historically functioned as a court of conscience, intervening where common law remedies were inadequate. Relief is discretionary, granted only where it is morally fitting. Here, standing is not inherent but earned through conscientious conduct. The claimant must demonstrate moral coherence between their claim and their behaviour. If they seek to enforce a norm they themselves violate, they lack the moral authority to invoke the court's conscience. The court refuses to be an instrument of injustice by aiding a wrongdoer. Thus, criminal law treats standing as universal and objective, rooted in the breach itself, while equity treats standing as particular and subjective, rooted in the relational integrity between the parties and the court. One views blame as sanctioning a breach; the other views complaint as requesting moral aid. The criminal model implies that normative authority derives from the office or the rule, not the person. The equitable model implies authority derives from personal moral integrity. In the former, the hypocrite can still truthfully accuse; in the latter, the hypocrite's accusation is rendered inert by their own conduct. Furthermore, criminal law assumes the primary wrong is against the community, necessitating public vindication regardless of the victim's purity. Equity assumes the wrong is interpersonal; the remedy restores balance between specific parties. If one party is unbalanced by their own wrongdoing, restoration is impossible. Therefore, the implicit theories diverge on the locus of the wrong: public order versus private conscience. This dichotomy suggests two distinct metaphysics of blame.

  ### Strictly presupposed vs merely fits

  Are these theories strictly presupposed, or do they merely fit? Strictly speaking, criminal law could admit hypocrisy as a mitigating factor without logical contradiction, just as equity could grant relief regardless of hands. The practices are not logically entailed by the nature of blame itself but are pragmatic choices. However, they fit their respective normative frameworks tightly. Criminal law's rigidity fits the requirement for legal certainty and equal application. Equity's flexibility fits its historical role as a moral safety valve. To swap them would create friction: allowing clean hands defences in criminal trials would destabilise public order; denying them in equity would turn conscience into a mechanical rule. Thus, while not logically necessary, the theories are normatively entrenched. They are justified by the distinct aims of the doctrines: punishment versus remediation. The criminal law does not strictly presuppose that hypocrisy is irrelevant to standing, but it presupposes that public safety outweighs individual moral consistency. Equity strictly presupposes that discretionary relief requires discretionary worthiness. Therefore, the divergence is not a logical error but a functional adaptation. The theories are not universal truths about blame but context-specific rules of engagement.

  ### Where the practice is underdetermined

  Where is the practice underdetermined? The boundary between public and private blurring reveals instability. Consider regulatory bodies: are they criminal or equitable? If a regulator seeks a ban against a firm but violates regulations itself, does clean hands apply? The law wobbles. Similarly, in criminal sentencing, hypocrisy may not affect liability but often influences mitigation, suggesting standing is partially compromised even if not destroyed. Furthermore, private prosecutions exist where the line between public norm and private grievance thins. If a private individual prosecutes, does their hypocrisy matter? The current framework lacks a unified metric for when moral consistency impacts authority. It leaves unresolved whether standing is a binary switch (on/off) or a dimmer (affected by degree of hypocrisy). This underdetermination suggests the law lacks a settled philosophy on whether blame is about the act or the actor. Additionally, the 'same matter' requirement in clean hands is notoriously vague. Does unrelated wrongdoing taint standing? The inconsistency here highlights that the doctrine is more heuristic than principled. The law has not decided if standing is a right or a privilege.

  ### What would have to change

  If we adopt the view that 'a wrong is a wrong no matter who points it out', equity must change significantly. The clean hands doctrine would need abolition or severe restriction. Relief should depend on the validity of the right infringed, not the virtue of the claimant. The court's role would shift from moral gatekeeper to rights enforcer. Criminal law would remain unchanged, as it already embodies this universalist view. However, adopting this pure view risks making equity too rigid, ignoring the relational nuances it was designed to address. To maintain coherence, the law would need to accept that standing is never forfeited by hypocrisy, only the remedy might be adjusted pragmatically, not morally. The focus must shift entirely to the defendant's conduct, rendering the claimant's moral history irrelevant to the adjudication of the wrong itself.
