answer: |-
  # Q&A Prep Sheet: Confucian Role Ethics vs. Analytic Normative Theory

  **Context:** Solid analytic department. They respect rigor but are skeptical of "alternative" frameworks that look like they dodge justification.
  **Goal:** Survive the Q&A without conceding the core thesis, while acknowledging the limits of the view.
  **Tone:** Confident, precise, willing to grant partial points to save the whole.

  ---

  ## 1. The Kantian (The "Justification" Objection)
  **Voice:** Rigorous, slightly weary of relativism.
  **The Question:** "You say obligations arise from roles. But roles are social facts, not moral truths. If I occupy the role of 'SS Officer' or 'Patriarchal Husband,' your theory seems to tell me I ought to fulfill that role well. Without a universal principle (like the Categorical Imperative) standing *outside* the roles to critique them, haven't you just moralized the status quo? Where does the critical leverage come from?"

  *   **Force:** **High.** This is the standard "bad roles" objection. It threatens the normative force of your view.
  *   **Concede:** Concede that roles *can* be morally corrupt and that role ethics alone doesn't generate a critique of *entire* social structures from scratch.
  *   **2-Minute Reply:** "I grant that a specific role can be corrupt. But the leverage doesn't come from a 'view from nowhere'; it comes from *role conflict* and *role erosion*. The SS Officer role conflicts with the role of 'human neighbor' or 'citizen of a lawful state.' We critique roles not by appealing to a Platonic principle, but by showing how they undermine the web of relationships required for *any* role to function. We don't need an Archimedean point outside morality to judge a moral failure inside it."
  *   **Soft Spot:** When you say "web of relationships," they will hear "implicit utilitarianism" or "implicit Kantianism." Be ready to insist that the *source* of the obligation remains the relationship, not the utility or rationality of the web.

  ## 2. The Consequentialist (Population Ethics)
  **Voice:** Impatient with "special pleading," focused on aggregate welfare.
  **The Question:** "You argue agent-relative obligations feel weightier, and you want to validate that. But feelings aren't data. If I can save five strangers by neglecting my one child, and I choose my child because of my 'role,' haven't I just prioritized my psychological comfort over actual good? Why is partiality morally permissible, let alone obligatory?"

  *   **Force:** **Medium.** They won't convince you, you won't convince them. This is a clash of first principles.
  *   **Concede:** Concede that role ethics will not maximize aggregate good in every instance.
  *   **2-Minute Reply:** "I'm not arguing that partiality maximizes the good; I'm arguing that 'the good' is unintelligible without the specific relationships that give value to lives. A world where everyone acted as an impartial agent would dissolve the very institutions (family, friendship) that make welfare possible. You're asking me to justify the engine of social value by the output of social value. My claim is that the role *constitutes* the value, it doesn't just track it."
  *   **Soft Spot:** The phrase "constitutes the value." They will press you on whether that's a conceptual claim or an empirical one. If empirical, they have data. If conceptual, they call it dogma.

  ## 3. The Medical Ethicists (x2) (The "Conflict" Objection)
  **Voice:** Practical, case-driven, concerned with liability and boundaries.
  **The Question:** "In medicine, we face role conflicts constantly. My role as 'physician' demands impartial triage; my role as 'parent' demands partiality to my sick child. If there's no universal principle to rank these roles, how do you decide? It sounds like when roles clash, your theory goes silent."

  *   **Force:** **Medium-High.** This exposes the lack of a decision procedure.
  *   **Concede:** Admit role ethics is not an algorithm. It does not promise a unique right answer in hard cases.
  *   **2-Minute Reply:** "That's a feature, not a bug. Principle-based ethics pretends to have an algorithm but usually smuggles in intuition. Role ethics acknowledges the tragedy of conflict. The answer isn't derived from a higher rule, but from *deliberation within the tradition of the practice*. In medicine, the professional role often lexically orders itself over the personal one *during professional hours*. But we admit that's a institutional compromise, not a moral absolute. We don't hide the remainder."
  *   **Soft Spot:** Admitting there's no algorithm makes you look like you're giving up on guidance. They will press: "So what do I tell the resident?"

  ## 4. The Virtue Ethicist
  **Voice:** Collegial, possessive, slightly smug.
  **The Question:** "This sounds lovely, but isn't this just Aristotelian *phronesis* applied to social contexts? You're talking about the virtues internal to practices. Why do we need 'Confucian Role Ethics' as a distinct category? It seems like you're just doing virtue ethics with more sociology."

  *   **Force:** **Low (Theoretically), High (Socially).** If you fight them, you lose an ally. If you agree too much, your talk was redundant.
  *   **Concede:** Acknowledge the family resemblance.
  *   **2-Minute Reply:** "I'm happy to call it a cousin of virtue ethics. But the metaphysical priority is different. In virtue ethics, the locus of evaluation is the *agent's character*. In role ethics, the locus is the *relational slot*. A virtue ethicist asks, 'What would a courageous person do?' A role ethicist asks, 'What does this relationship require?' The first looks inward to traits; the second looks outward to the other. That shifts the center of gravity from self-cultivation to mutual maintenance."
  *   **Soft Spot:** The distinction is subtle. If they press that "traits are required to fill slots," you might get tangled. Keep it focused on the *source* of the norm (the relationship vs. the character).

  ## 5. The Care Ethics Grad Student
  **Voice:** Friendly, critical theory-adjacent, worried about power.
  **The Question:** "I'm sympathetic, but I'm worried about power. Roles aren't just neutral slots; they're often imposed. 'Daughter' or 'Nurse' comes with historical baggage of subordination. If we ground ethics in roles, don't we risk reifying oppressive structures? Care ethics tries to disrupt that; does role ethics?"

  *   **Force:** **Medium.** This is the "political" version of the Kantian objection.
  *   **Concede:** Acknowledge that traditional role ethics has historically been conservative.
  *   **2-Minute Reply:** "That's a crucial worry. But Confucian role ethics isn't about static hierarchy; it's about *reciprocity*. The role of 'Father' implies the role of 'Son.' If the Father fails the Son, the Son is no longer bound in the same way. It's not a one-way command. We can use role ethics to critique oppression by showing how oppression *breaks* the reciprocity required for the role to function. We don't need to abandon roles to fix them; we need to demand they be mutual."
  *   **Soft Spot:** The "reciprocity" claim. In many oppressive roles, the subordinate cannot enforce reciprocity. Be careful not to sound like you're blaming the victim for not enforcing reciprocity.

  ---

  ## The Nightmare Question
  **Pray nobody asks this:**
  **"If the content of morality is determined by roles, and roles are determined by society, isn't your view just sophisticated conventionalism? If the society changes the roles, does morality change? If yes, you're a relativist. If no, you're smuggling in a universal principle to judge the roles."**

  *   **Why it kills you:** It forces you into a dilemma: either morality is arbitrary (depends on current social norms) or you admit you need a universal principle after all (collapsing your thesis).
  *   **If asked:** Do not panic. Do not say "It depends."
  *   **The Save:** "It's not conventionalism because roles aren't arbitrary labels; they are responses to human needs and interdependencies that are relatively stable. 'Parent' exists because humans are born helpless. That's not conventional; that's biological and social fact. The *norms* can be critiqued, but the *need for the role* isn't up for grabs. I'm a relativist about *customs*, not about *structural necessities of human flourishing*."

  ---

  ## Strategy: Virtue & Care Ethicists (Fight or Lean?)
  **Verdict:** **Lean In, Then Distinguish.**

  Do not fight the Virtue Ethicist or the Care Ethicist. They are your natural allies against the Kantians and Consequentialists. If you fight them, you isolate yourself.

  *   **The Move:** Frame Role Ethics as the "structural infrastructure" that makes Virtue and Care possible.
  *   **The Distinction:**
      *   **Vs. Virtue Ethics:** Virtue ethics is *agent-centered* (What kind of person am I?). Role ethics is *relation-centered* (What kind of pair are we?).
      *   **Vs. Care Ethics:** Care ethics is often *anti-institutional* (focus on immediate need). Role ethics is *pro-institutional* (focus on long-term structural expectations).
  *   **Why this works:** It gives them credit (you are in the same ballpark) but preserves your niche (you offer something they don't: a structural account of obligation).

  ---

  ## General Q&A Survival Tips
  1.  **Don't Defend Confucius:** If they attack historical Confucianism (patriarchy, hierarchy), concede it. Say, "I am defending a *structural* role ethics inspired by Confucianism, not a historical exegesis." Keep it analytic.
  2.  **Watch the "Ought":** They will try to trap you on whether "role obligations" are truly *moral* oughts or just *social* oughts. Insist that the moral *is* the social-in-context. There is no "moral" floating above the "social."
  3.  **The "Friend" Buffer:** If the Grad Student asks a friendly question, use it to reset the room's tone. Answer them warmly. It makes you look reasonable before the Kantians attack.
  4.  **Time Management:** If a question is a monologue, interrupt politely: "I want to make sure I get to your core question before my time is up. Is the main worry X?"

  **Final Mindset:** You are not there to prove Role Ethics is the *only* ethics. You are there to prove it is a *viable* ethics that solves problems principle-based ethics cannot. If you leave them thinking "Well, it's not crazy, and it handles the special obligations problem better than Kant," you win.
