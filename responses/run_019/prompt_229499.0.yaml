answer: |-
  # Decision Tree: What Should We Do With the Past?

  **1. A community discovers its founder was a criminal. Does knowing this truth matter even if it paralyzes the community?**
  *   **Yes,** truth is higher than well-being. → Go to **2**.
  *   **No,** life and action are higher than truth. → Go to **3**.

  **2. To serve this truth, must you remember everything?**
  *   **Yes,** every fact must be preserved. → **Leaf: Objective History**
  *   **No,** some facts should be discarded to focus on the whole. → **Leaf: UNINHABITED** (Incoherent: Seeking objective truth by deliberately forgetting parts of it).

  **3. Is the ultimate goal to step out of history entirely into art or religion?**
  *   **Yes,** history is just a bridge to the eternal. → **Leaf: Suprahistorical**
  *   **No,** we must remain within history and act. → Go to **4**.

  **4. Is forgetting a failure or a tool for action?**
  *   **A tool,** because memory burdens the actor. → **Leaf: Unhistorical**
  *   **A failure,** we must work with what we remember. → Go to **5**.

  **5. What is the primary need the memory fulfills?**
  *   **Inspiration,** I need models to imitate. → **Leaf: Monumental**
  *   **Belonging,** I need to honor my origins. → **Leaf: Antiquarian**
  *   **Liberation,** I need to judge and destroy the past to live. → **Leaf: Critical**

  ***

  ### Awkward Commitments

  *   **Objective History:** It must pretend the historian is a mirror rather than a living person with needs.
  *   **Suprahistorical:** It must treat the flow of time as an error to be corrected rather than the condition of life.
  *   **Unhistorical:** It must treat blindness as a higher form of wisdom than sight.
  *   **Monumental:** It must treat unique historical moments as repeatable recipes for success.
  *   **Antiquarian:** It must treat the accidental survival of an object as proof of its inherent worth.
  *   **Critical:** It must treat the judge as standing outside the very history they are condemning.

  ***

  ### Indistinguishable Leaves

  **Monumental** and **Critical** history risk collapsing into each other. Both subordinate the reality of the past to the needs of the present, selecting and shaping facts to serve a current agenda—one to inspire, the other to condemn. In practice, a "heroic" narrative often requires condemning the intervening years, making the inspiration and the judgment indistinguishable.

  ***

  ### Where Nietzsche Lands

  Nietzsche does not occupy a single leaf; he occupies the **meta-position of health**. The tree forces a choice of single organs, but Nietzsche argues a healthy culture balances all three modes (Monumental, Antiquarian, Critical) while restraining the pathological ones (Objective, Suprahistorical, excessive Unhistorical). If the tree cannot represent "balance," that is a defect of the taxonomy, not the philosophy: for Nietzsche, the modes are medicines, not diets, and taking only one is poisonous.
