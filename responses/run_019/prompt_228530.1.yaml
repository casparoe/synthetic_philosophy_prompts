      *   **Q3: Secret Ballot vs. Mill.** Mill wanted public voting to enforce duty. We have secret voting + ban on selling. Is this incoherent?
      *   **Q4: Dropping Mill's Picture.** If voting is just private choice, must vote-selling be legal? Are there non-Millian arguments against it?

