prompt: |-
  I've been arguing with a friend about the EU and I keep going in circles, so I want someone to lay out the underlying picture for me. Here's what puzzles me. The member states all describe themselves as sovereign — and in the EU's own legal order they are still the ones who can amend the treaties and leave, as Brexit showed. But at the same time, the EU treats its law as supreme over national law, including national constitutional law, and national courts are expected to set aside their own statutes when there's a conflict. So which picture of sovereignty is the EU actually presupposing? Is it that sovereignty can be pooled or divided, or that the old indivisibility idea is just false, or is the self-description a legal fiction with the real story being something else? And a second layer: people talk about a democratic deficit, since the directly elected parliament shares power with a Commission no voter directly chooses, and the Council can legislate by qualified majority so your own state can be outvoted. Yet the same EU keeps pushing subsidiarity and giving national parliaments more of a say, and the treaties keep gesturing toward ever-closer union. What picture of democracy or democratic legitimacy does that structure commit you to? And are those two pictures — the sovereignty one and the democracy one — compatiable, or does one of them have to give? I'm not asking whether the EU is good or bad. I want to know what it's actually committed to, and what it merely happens to fit with.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Question:** What is the underlying conceptual picture of the EU regarding sovereignty and democracy?
      *   **Sovereignty Puzzle:** Member states claim sovereignty (can amend treaties, leave), but EU law claims supremacy (even over national constitutions). Is sovereignty pooled, divided, indivisible but false, or a legal fiction?
      *   **Democracy Puzzle:** Democratic deficit (unelected Commission, QMV in Council outvoting states) vs. Subsidiarity/National Parliament involvement vs. "Ever-closer union." What picture of legitimacy is committed to?
      *   **Compatibility:** Are the sovereignty picture and democracy picture compatible, or must one give?
      *   **Constraint:** Do not argue whether the EU is good or bad. Focus on what it is *committed to* conceptually/structurally.

  2.  **Analyze the Sovereignty Question:**

      *   *Traditional View:* Sovereignty is indivisible (Westphalian). You are either sovereign or you aren't.
      *   *EU Reality:* It doesn't fit the traditional box.
      *   *Key Legal Doctrine:* *Costa v. ENEL* (Supremacy), *Van Gend en Loos* (Direct Effect).
      *   *The "Ultimate" Authority:* Who decides who decides? (Kompetenz-Kompetenz). The ECJ says EU law is autonomous. National Constitutional Courts (e.g., German Bundesverfassungsgericht in *Solange* and *Lisbon* rulings) say "within limits."
      *   *Conceptual Framework:* It's not "pooled sovereignty" in the sense of handing it over permanently. It's more like a *sui generis* (unique) legal order.
      *   *Best Description:* "Constitutional Pluralism." Neither side has the absolute final say in all contexts. It's a negotiated equilibrium. Sovereignty isn't divided; the *exercise* of competences is conferred.
      *   *Exit Clause:* Article 50 confirms the voluntary nature, reinforcing that the ultimate source of authority remains the states (Masters of the Treaties).

  3.  **Analyze the Democracy Question:**

      *   *The "Deficit" Critique:* Focuses on the traditional nation-state model (one person, one vote -> government). EU doesn't fit this because there is no single "EU demos" (people).
      *   *EU's Defense/Structure:* Dual legitimacy.
          1.  Citizens (European Parliament).
          2.  States (Council/Member Governments).
      *   *Subsidiarity:* Acknowledges that not everything should be done at the EU level.
      *   *Conceptual Framework:* It's not trying to be a Super-State. It's a *Union of Peoples and States*.
      *   *Legitimacy Source:* Output legitimacy (results/efficiency) + Input legitimacy (procedural).
      *   *Tension:* "Ever-closer union" suggests a trajectory toward more integration, potentially clashing with national democratic self-determination.

  4.  **Analyze the Compatibility (Sovereignty vs. Democracy):**

      *   *The Conflict:* If sovereignty lies with the people of the nation-state, but EU law overrides national law (made by QMV), then national self-determination is constrained.
      *   *The EU's Solution:* The treaties are the contract. By ratifying, the people (via reps) agreed to the rules.
      *   *The Breaking Point:* Constitutional Courts (like Germany's) assert that if EU oversteps, national democracy trumps EU law. This is the friction point.
      *   *Conclusion:* They are compatible *as long as* the EU stays within conferred powers. If the EU claims inherent sovereignty, they become incompatible with the nation-state model.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. It's the central constitutional debate of Europe.
      *   *Section 1: Sovereignty.* Move away from "divided" vs. "indivisible." Introduce "Constitutional Pluralism." Explain the "Masters of the Treaties" vs. "Autonomous Legal Order" tension. Use the German Constitutional Court (*Solange/Lisbon*) vs. ECJ dynamic.
      *   *Section 2: Democracy.* Explain "Dual Legitimacy" (Citizens + States). Contrast "Input" vs. "Output" legitimacy. Explain why the Commission isn't elected like a PM (it's more like a civil service/guardian of treaties).
      *   *Section 3: Compatibility.* This is the crux. The system works on a "presumption of compliance." It breaks if one side asserts absolute finality. The concept is "Conferred Competences," not "General Sovereignty."
      *   *Conclusion:* Summarize the "Sui Generis" nature. It's not a state, not an org. It's a hybrid.

  6.  **Refining the Concepts (Self-Correction during drafting):**

      *   *Correction:* Don't say sovereignty is "shared." Legal theorists hate that. Say "competences are conferred."
      *   *Nuance:* Make sure to mention that national courts *accept* supremacy practically, even if they claim ultimate authority theoretically.
      *   *Democracy:* Clarify that the "Democratic Deficit" assumes a parliamentary model that the EU explicitly rejects in favor of a mixed model.
      *   *Tone:* Keep it analytical, neutral, and structural. Avoid normative judgments (is it good?).

  7.  **Final Polish:** Check against the user's specific prompts.
      *   *Sovereignty picture?* -> Constitutional Pluralism / Conferral.
      *   *Democracy picture?* -> Dual Legitimacy / Compound Democracy.
      *   *Compatible?* -> Yes, conditionally on the limit of competences.

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is one of the most sophisticated questions in contemporary legal and political theory. You are identifying the central constitutional tension of the European project. The reason you are going in circles with your friend is likely because you are both using definitions of "sovereignty" and "democracy" derived from the nation-state, while the EU is explicitly constructed as something *sui generis* (unique) that rejects the nation-state template.

  Here is the underlying picture the EU is committed to, broken down by sovereignty, democracy, and their compatibility.

  ### 1. The Picture of Sovereignty: Constitutional Pluralism

  You asked if sovereignty is pooled, divided, or a fiction. The EU's legal order effectively commits to a theory called **Constitutional Pluralism**.

  **The Traditional View (Westphalian):**
  Sovereignty is indivisible. There must be one final authority (the *Kompetenz-Kompetenz*, or the competence to decide competences). In a nation-state, this is the Supreme Court or the Constitution.

  **The EU's Commitment:**
  The EU rejects the idea that there must be a single hierarchical apex. Instead, it posits two distinct legal orders that interact without one fully subsuming the other.

  *   **The ECJ's View:** The European Court of Justice (ECJ) asserts that EU law is an "autonomous legal order." In cases like *Costa v. ENEL* (1964), it ruled that EU law has supremacy over national law, including constitutional law. From the EU's internal perspective, it acts *as if* it is sovereign within its sphere.
  *   **The Member States' View:** Member states (via their Constitutional Courts, most notably the German Bundesverfassungsgericht) agree to apply EU law, but they reserve the ultimate right to decide if the EU has overstepped its bounds. In the *Solange* and *Lisbon* rulings, the German court essentially said: "We accept EU supremacy *so long as* it respects our fundamental constitutional identity."
  *   **The "Masters of the Treaties":** You noted that states can amend treaties and leave (Article 50). This confirms that the **derivative** nature of EU power. The EU has no original sovereignty; it only has what is "conferred" upon it by the states.

  **The Verdict:**
  The EU is not committed to "divided sovereignty" (which implies sovereignty is a cake that can be sliced). It is committed to **conferral**. Sovereignty remains with the states, but the *exercise* of specific competences is transferred to the Union. The "fiction" is not that states are sovereign, but that the EU can function *as if* it were a sovereign entity in daily legal practice, provided it doesn't trigger the ultimate "nuclear option" of a constitutional court rejecting a specific EU act.

  ### 2. The Picture of Democracy: Dual Legitimacy

  The "democratic deficit" critique assumes the EU is trying to be a nation-state and failing. The EU's structure commits to a different model: **Compound Democracy** or **Dual Legitimacy**.

  **The Traditional View:**
  Democracy requires a single *demos* (people). One person, one vote, leads to a government accountable to that electorate.

  **The EU's Commitment:**
  The EU explicitly acknowledges there is no single European "people" in the sociological sense. Therefore, it derives legitimacy from two sources simultaneously (Article 10 TEU):
  1.  **Citizens:** Represented by the directly elected European Parliament.
  2.  **States:** Represented by the European Council and the Council of the EU (national ministers).

  **Addressing the Deficit:**
  *   **The Commission:** You noted the Commission is not directly elected. In the EU picture, the Commission is not meant to be a "government" in the parliamentary sense. It is designed as a **neutral guardian of the treaties** and an agenda-setter. Its legitimacy comes from being appointed by democratically elected heads of state and confirmed by the elected Parliament.
  *   **Qualified Majority Voting (QMV):** The fact that a state can be outvoted in the Council is not a bug; it is a feature of the "Union" aspect. It commits to the idea that once a state joins, it agrees to be bound by collective decisions to prevent gridlock.
  *   **Subsidiarity:** This is the safety valve. The principle of subsidiarity (decisions should be taken at the most local level possible) admits that the EU does not have a mandate to govern everything. It commits to a **functional democracy**: legitimacy comes from effective problem-solving (Output Legitimacy) as much as from voting procedures (Input Legitimacy).

  **The Verdict:**
  The EU is committed to a **mediated democracy**. It does not seek to replace national democracies but to layer a decision-making structure on top of them. It assumes that being outvoted in the Council is democratically acceptable because your national ministers (accountable to your national parliament) agreed to the voting rule in the treaty.

  ### 3. Are They Compatible?

  This is the friction point. The sovereignty picture and the democracy picture are compatible **only under a specific condition**: that the EU remains a Union of *conferred powers* and does not evolve into a Federal State.

  **The Compatibility Mechanism:**
  The system works on a presumption of trust. National courts presume EU law is democratic and within scope; the EU presumes national courts will uphold EU law. This creates a stable equilibrium.

  **Where They Clash:**
  The incompatibility arises if the EU claims **inherent sovereignty**.
  *   If the ECJ rules that the EU has the ultimate authority to define its own powers (without national review), it clashes with the national democratic picture (where the national constitution is the will of the people).
  *   If a national court blocks EU law (as the German court threatened regarding bond-buying programs), it clashes with the EU's legal unity and the democratic will of the other 26 states.

  **The "Ever-Closer Union" Tension:**
  The treaty commitment to "ever-closer union" suggests a trajectory.
  *   **If that trajectory leads to a Federal State:** The current sovereignty model breaks. National sovereignty would have to dissolve into a European sovereignty.
  *   **If that trajectory remains a Union of States:** The current model holds, but it requires constant negotiation.

  ### Summary of the Underlying Picture

  To answer your specific questions directly:

  1.  **Which picture of sovereignty?**
      The EU presupposes **Constitutional Pluralism**. It rejects the idea that sovereignty must be located in one place. It operates on the basis that states are the "Masters of the Treaties" (ultimate sovereignty), but within the treaty framework, EU law is autonomous and supreme (operational sovereignty). It is not a fiction, but it is a negotiated reality that depends on neither side pushing the conflict to the absolute limit.

  2.  **Which picture of democracy?**
      The EU commits to **Dual Legitimacy**. It rejects the idea that democracy requires a single homogeneous people. It argues that legitimacy flows from both individual citizens (Parliament) and constituent peoples/states (Council). It prioritizes **consensus and protection of minorities** (via national vetoes in sensitive areas) over simple majoritarianism.

  3.  **Are they compatible?**
      They are compatible **conditionally**. They work together as long as the EU respects the principle of **Conferral** (only doing what the treaties say) and **Subsidiarity** (not doing what states can do better).
      *   If the EU acts beyond conferred powers, the Sovereignty picture (National Constitutional Courts) must override the Democracy picture (EU Majority rule).
      *   If the EU respects conferred powers, the Democracy picture (QMV and Parliamentary procedure) overrides National Sovereignty (National Statutes).

  **The Bottom Line:**
  The EU is not committed to the idea that sovereignty is indivisible. It is committed to the idea that **authority can be layered.** The system is designed to be permanently ambiguous about who has the *final* final say, because defining that answer clearly would turn the EU into either a loose trade bloc (if states always win) or a federal superstate (if the EU always wins). The ambiguity *is* the design.
