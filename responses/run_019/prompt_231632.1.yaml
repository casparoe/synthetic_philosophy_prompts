      *   **Goal:** A reusable decision procedure grounded in *moral uncertainty* (maximizing expected choiceworthiness) that can be run in an afternoon.
      *   **Constraints:**
          *   Acknowledge known snags of moral uncertainty (intertheoretic comparison, fanaticism/long tails, open-ended theory list).
          *   Tell the user what to do when those snags bite.
