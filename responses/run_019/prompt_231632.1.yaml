answer: |-
  Dear Colleague,

  It is admirable that you are seeking a structured way to navigate the ethical dimensions of your work, especially given the weight your recommendations carry. You are correct that moral uncertainty offers a robust framework for this, specifically the idea of maximizing expected choiceworthiness, but you are also right to worry about the technical snags involving intertheoretic comparison, fanaticism, and the open-ended nature of moral theories. What follows is a procedure designed to be run in an afternoon that incorporates safeguards for those specific problems. It is not a calculator that spits out a number, but a structured inquiry that forces you to articulate your uncertainties and identify where the risks lie.

  The procedure begins by defining the scope of the decision. You must first list every stakeholder group affected by the feature, including users, employees, third parties who might receive data, and the company itself. For each group, you must describe the best-case and worst-case outcomes within a single paragraph. This step handles the open-ended theory problem by forcing you to look at concrete impacts rather than abstract principles, ensuring you do not ignore a moral theory simply because you have not named it. Once the stakeholders are mapped, you must select a short list of moral frameworks to act as lenses. I recommend you use three: consequentialism, which focuses on net outcomes like happiness or harm; deontology, which focuses on rights, duties, and consent; and virtue ethics, which focuses on what kind of company you are building and what habits you are fostering in users. You do not need to be a scholar to use these; you only need to assign a credence to each, representing how confident you are that this framework captures the truth of the situation. These credences should sum to one hundred percent. If you are unsure, split them evenly, but do not assign zero to any of the three, as this prematurely excludes valid moral concerns.

  Next comes the assessment of impacts, which addresses the currency problem. You cannot add utils to rights violations directly, so you must normalize them using a severity scale from negative ten to positive ten for each framework. For consequentialism, score the net benefit or harm. For deontology, score the degree of consent or rights violation, where a violation of bodily autonomy or privacy is a negative ten regardless of the benefit. For virtue ethics, score whether the feature aligns with the company's stated values. You must then multiply the score by your credence in that framework to get a weighted score. However, before you sum these, you must apply a veto condition to handle the fanaticism and rights snags. If any framework with a credence above twenty percent assigns a score of negative ten to an option, indicating a severe rights violation or catastrophic harm, the procedure stops. You cannot average away a severe rights violation with a moderate benefit. In such cases, the decision is a no unless the feature can be redesigned to remove the violation. If no veto is triggered, you sum the weighted scores. If the result is positive, you may proceed with a recommendation to build, provided you document the risks. If the result is negative, you recommend against it. If the result is near zero or the credences are too unstable to trust, the procedure hands the decision to a human being. Specifically, you must escalate to the product director and explicitly state that this is a values trade-off, not a facts problem, and that it requires leadership alignment rather than engineering justification.

  There are steps here that cannot be made mechanical without falsifying the idea. Assigning the credences is inherently subjective, and you must resist the urge to adjust them to get the answer you want. Similarly, the severity scoring requires imagination; you must genuinely attempt to envision the worst-case downstream use of your analytics, not just the intended use. The procedure also requires you to stop when you hit the veto condition. It is tempting to argue that a small rights violation is worth a large profit, but this procedure treats certain boundaries as hard stops to protect against the erosion of ethical standards over time.

  Let us run this procedure on your first case regarding the streak and time-limited reward system. Your stakeholders are the users who want habit support, the users who feel unable to stop, and the company seeking higher daily active use. Under consequentialism, the score is mixed but likely positive in the short term due to engagement revenue, perhaps a positive four. Under virtue ethics, the score is negative because building compulsion conflicts with fostering healthy habits, perhaps a negative five. Under deontology, the score depends on consent. If the users feel unable to stop, their autonomy is compromised, which is a significant violation. If you assign a thirty percent credence to deontology, and you assess the autonomy violation as a negative eight because a substantial minority feel coerced, the weighted score is negative two point four. More importantly, this approaches the veto condition. If you believe there is a genuine risk of addiction, which undermines agency, a deontological lens might view this as a negative ten. If you hold even a modest credence in user autonomy, the veto triggers. The honest commercial conclusion here is that you should recommend against launching the feature as proposed. You must tell the product director that driving daily active use through compulsion violates the autonomy constraint for a significant minority of users. You can suggest redesigning the feature to allow users to set their own limits or opt out of streaks, but the current proposal which leverages fear of loss to drive metrics should not be built. This will likely lower the projected daily active use numbers, and you must be plain that the ethical cost is the engagement metric itself.

  The second case involves selling de-identified location histories. The stakeholders are your users, the data broker, and the broker's clients like insurers and employers. Under consequentialism, the revenue is a positive for the company, but the potential harm to users from discrimination or privacy breaches is severe. Since the de-identification is not bulletproof, the risk of re-identification is non-zero. Under deontology, selling data about where people live and work without explicit consent for that specific downstream use is a violation of privacy rights. Even if the data is stripped of names, the pattern of life is identifiable. If you assign a forty percent credence to deontology, and you assess the privacy violation as a negative nine because it exposes users to insurance hikes or job loss, the weighted score is heavily negative. Furthermore, this triggers the veto condition. A non-consensual exposure of users to financial harm via third parties is a severe rights violation. The procedure dictates a hard no. You must write in your recommendation that the recurring revenue is ethically inaccessible because it relies on a privacy model that users cannot meaningfully consent to and cannot protect them from downstream harm. You will have to tell the product director that this revenue stream is closed to you. There is no middle ground here because the risk is external to your control once the data is sold.

  The third case is the request to adapt your internal productivity tool for employee scoring. The stakeholders are the employees being scored, the managers using the data, the corporate customer, and your own team who would be funded. Under consequentialism, the funding for your team is a positive, but the stress and potential unjust redundancy for employees is a massive negative. Under virtue ethics, building tools for surveillance contradicts the value of trust and dignity. Under deontology, using analytics for redundancy decisions without transparent criteria violates the right to fair treatment and due process. If you assign any significant credence to rights or virtue, the scores are deeply negative. The harm to the employees' livelihoods is a catastrophic outcome for them, while the benefit to your team is financial stability. This is a classic case where the concentrated harm outweighs the distributed benefit. The procedure triggers a veto on deontological grounds regarding worker dignity and fairness. You must recommend against building this product. You need to state plainly to the product director that accepting this work would make your company a vendor of surveillance tools used for firing people, and that the funding gain does not justify the moral cost. This means your team will not receive that year of funding from this source, and you must be prepared to advocate for finding revenue elsewhere that does not rely on monetizing worker insecurity.

  Finally, you must understand what this procedure cannot do. It cannot predict the future with certainty, so if a harm is truly unforeseeable, the procedure will not catch it. It cannot resolve fundamental disagreements about values; if the product director disagrees with your credence assignments, the procedure only clarifies the disagreement rather than solving it. It will misclassify decisions where the moral theories are incommensurable in a way that normalization cannot fix, such as when a sacred value is traded against a secular benefit, and in those cases, it will simply force a hand-off to leadership. It also relies on your honesty; if you manipulate the scores to justify a desired outcome, the procedure becomes a sham. There will be decisions where the calculation is neutral, and in those instances, the procedure leaves the decision undecided, requiring you to rely on professional judgment or team consensus. It is a tool for clearing away obvious ethical hazards and structuring your reasoning, not a substitute for moral courage. When the procedure tells you that a profitable feature is unethical, your task is not to tweak the numbers but to stand by the recommendation and accept the commercial cost.

  I hope this serves you well in your work.

  Sincerely,

  Your Assistant
