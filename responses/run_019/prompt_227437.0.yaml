      *(Refining the Psycholinguistic point)*: If speakers drift, it suggests meaning is use. If meaning is use, and use is fluid, sharp boundaries are an illusion. Epistemicists (like Williamson) are externalists about meaning (meaning isn't just use). So they can resist this. But it puts pressure on the externalist semantics. I should highlight this tension.

