answer: |-
  ### Readings

  **1. Internal Self-Determination**
  This reading claims that "self-determination" means the right of a people to govern their own internal affairs—culture, education, local policing—while remaining within the existing state. It interprets the right as a demand for robust federalism or devolution rather than sovereignty. Under this view, Catalans have a right to protect their language and manage their budget, but not to break the Spanish border.

  **2. Procedural Right to Petition**
  Here, the claim is that a "people" have the right to formally ask the state for a change in status, including a referendum. It does not guarantee the state must agree to the vote's timing or wording, nor that the result is binding. It merely asserts that a group cannot be criminally prosecuted for peacefully organizing a consultation or petitioning the central government for one.

  **3. The Duty to Negotiate**
  This interpretation holds that if a clear majority of a region votes for independence, the central state acquires a political (if not strictly legal) obligation to enter good-faith negotiations. This mirrors the Canadian Supreme Court's ruling on Quebec: a vote creates a democratic mandate that makes continued union illegitimate unless terms of separation are agreed upon, but it does not authorize unilateral declaration.

  **4. Remedial Right Only**
  This reading restricts the right to secede to situations where the "people" are suffering grave injustices, such as systematic human rights violations, dispossession, or exclusion from governance. It argues self-determination is a remedy for oppression, not a primary right. Unless Spain is actively oppressing Catalans akin to a colonial power, this reading denies the right to secede.

  **5. Primary Right (Unrestricted)**
  This is the strongest reading: any distinct "people" defined by their own identity may secede whenever a majority of them desire it, regardless of the constitution, economic impact, or the wishes of the wider state. It posits that democratic legitimacy flows solely from the sub-state unit, rendering the central constitution irrelevant if it blocks the will of that majority.

  **6. Positive International Law Claim**
  This claim asserts that current international treaties and UN charters explicitly grant sub-state regions like Catalonia the legal right to independence. It treats "self-determination" as an existing statutory rule in the international legal order that overrides domestic constitutional law, rather than a moral principle or political aspiration.

  **7. Supra-Constitutional Moral Claim**
  This reading concedes that the Spanish Constitution forbids secession but argues that the moral right of self-determination trumps positive law. It claims that legal legitimacy is derived from the consent of the governed, so if Catalans withdraw consent, the Constitution ceases to bind them. This justifies unilateral action as a moral necessity despite its illegality.

  ### Verdicts

  1.  **Internal Self-Determination:** Defensible (widely accepted in democratic theory).
  2.  **Procedural Right to Petition:** Defensible (consistent with free speech and assembly rights).
  3.  **The Duty to Negotiate:** Defensible (supported by the Quebec Reference precedent).
  4.  **Remedial Right Only:** Defensible (the standard view in international law).
  5.  **Primary Right (Unrestricted):** Defensible (morally) / False (legally).
  6.  **Positive International Law Claim:** False (international law restricts this to colonized/occupied peoples).
  7.  **Supra-Constitutional Moral Claim:** Defensible (philosophically) / False (legally).

  ### What survives

  Only the fifth and seventh readings support the conclusion that Catalonia may secede unilaterally. The **Primary Right** reading argues that majority will is sufficient authority on its own, while the **Supra-Constitutional Moral Claim** argues that democratic legitimacy overrides the Spanish legal order. However, both face significant hurdles: the first ignores the rights of the wider Spanish demos and the stability of borders, while the second relies on a revolutionary theory of law that, if universally applied, could justify fragmentation anywhere a local majority shifts. Neither reading is recognized in current international law, meaning your housemate is relying on a moral or political argument, not a legal one.

  The other five readings support only weaker conclusions. **Internal Self-Determination** and the **Procedural Right** justify autonomy and the ability to hold a vote, but not independence. The **Duty to Negotiate** requires a partner in the central government, ruling out unilateralism. The **Remedial Right** fails unless oppression is proven, which is a high bar in a democracy like Spain. Finally, the **Positive International Law Claim** is simply incorrect. Consequently, if your housemate wants to use international law or standard democratic theory to justify unilateral secession, the slogan "peoples have the right to self-determination" does too little work; he must instead argue for a radical revision of how constitutional orders function.
