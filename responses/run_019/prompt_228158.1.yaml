answer: |-
  ### The name, if there is one

  The phenomenon you are describing is a direct consequence of **Löb's Theorem**, and in the literature on self-modifying artificial intelligence, it is commonly referred to as the **Löbian Obstacle**. While Gödel's theorems describe the limitations of what a system can prove about itself, Löb's Theorem specifically dictates the catastrophic conditions under which a system attempts to assert its own soundness. When an agent adds a general rule stating "if I prove $\phi$, then $\phi$" to its own axioms, it creates a self-referential loop that allows it to derive any statement whatsoever, rendering the system trivial and inconsistent.

  ### Why this is not just Gödel

  Your friend is partially correct that Gödel's Second Incompleteness Theorem is in the neighborhood, but your intuition that the outcome is worse than mere "limping" is accurate. Gödel II establishes a limitation: a consistent system cannot prove its own consistency, meaning it must remain humble and silent about its own reliability. However, silence is safe; the system remains consistent, merely unable to validate itself. Your scenario describes an active failure mode where the system does not just fail to prove its safety, but actively proves its own unsafety (and everything else) by asserting it.

  The distinction lies in the difference between a limitation and an explosion. Gödel says, "You cannot assert 'I am consistent' without stepping outside the system." Löb says, "If you assert 'Whatever I prove is true' *inside* the system, you become inconsistent." This happens because the blanket rule allows the system to prove the specific conditional statement ($\text{Prov}(\bot) \to \bot$) that Löb's Theorem identifies as the trigger for proving falsehood. Consequently, the system doesn't just fail to gain self-trust; the mechanism of self-trust provides the exact logical lever needed to detonate the axiom set, turning a limitation into a contradiction.

  ### Does it touch ordinary human self-trust?

  This logical collapse does not apply to humans in the strict mathematical sense, because human reasoning is not a fixed formal system with a perfect proof-checker. We do not operate on a static set of axioms, nor do we have a binary "certified" state for our beliefs; our reasoning is probabilistic, heuristic, and biologically bounded. Therefore, we do not face the risk of immediate logical triviality simply by believing that our reasoning is generally reliable.

  However, the structural warning remains relevant to human epistemology. It suggests why dogmatic infallibility is dangerous: if a reasoner insists that every conclusion they reach is automatically true simply because they reached it, they close the feedback loop necessary for error correction. While humans won't logically explode into proving $2+2=5$, we do suffer from "epistemic closure," where unchecked self-trust insulates us from external correction, leading to radicalization or delusion. The theorem serves as a formal metaphor for why healthy reasoning requires a distinction between the thinker and the thought, or between current beliefs and the standards used to evaluate them.

  ### Known escape routes and their costs

  *   **Reflection Hierarchies:** The agent trusts only a weaker, previous version of itself (or a system with fewer axioms), avoiding self-reference by creating an infinite tower of increasingly trusting systems.
      *   *Cost:* The agent can never fully trust its *current* self, only its past self, which complicates long-term planning and self-modification.
  *   **Parametric Polymorphism:** The agent reasons about itself using a parameter (e.g., "I trust myself provided the proof length is under $k$"), allowing it to trust itself as long as the parameter is managed correctly.
      *   *Cost:* This requires complex bookkeeping to ensure the parameter doesn't drift or get exploited, adding significant overhead to the reasoning process.
  *   **Probabilistic Trust (Logical Induction):** The agent assigns probabilities to claims rather than binary truth values, trusting its future self with high probability but not absolute certainty.
      *   *Cost:* The system loses the guarantee of absolute logical certainty, operating instead with calibrated confidence that can still be wrong.
  *   **Bounded Proof Length:** The agent only accepts the reflection principle for proofs below a certain complexity threshold, preventing the long derivations required to trigger the Löbian explosion.
      *   *Cost:* This arbitrarily limits the agent's reasoning power, potentially preventing it from solving complex problems that require long chains of self-referential logic.
