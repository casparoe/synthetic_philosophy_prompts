answer: |-
  # Final Exam: Probability & Anthropics (Seminar 404)
  **Time Allowed:** 75 Minutes  
  **Total Marks:** 30

  **Question 1: The Cosmological Lottery**

  Cosmologists have narrowed the nature of the universe down to two mutually exclusive theories, **SPARSE** and **CROWDED**, which are indistinguishable by non-anthropic physics. Both assign a physical prior probability of 0.5.
  *   **SPARSE:** Only one technological civilization ever exists (ours). Total observer-lives $\approx 10^{14}$.
  *   **CROWDED:** $10^6$ causally isolated technological civilizations exist. Total observer-lives $\approx 10^{20}$.

  You are an observer in this universe. 

  (a) Calculate the posterior odds of CROWDED vs. SPARSE under the **Self-Indication Assumption (SIA)** given only your existence. Explain precisely why the **Self-Sampling Assumption (SSA)** leaves these odds untouched at 1:1. [5 marks]

  (b) You now acquire the indexical evidence that **you are an astronomer**. 
  *   In SPARSE, our single civilization produces $10^8$ astronomer-lives.
  *   In CROWDED, only 1 in $10^3$ civilizations develops astronomy. Each astronomy-capable civilization produces $10^8$ astronomer-lives.

  Calculate the likelihood ratio of this evidence. Combine this with your results from (a) to determine the final posterior odds for both SIA and SSA. Show your work clearly. [10 marks]

  (c) SIA's result in (a) implies you can become near-certain of CROWDED from the "armchair" before telescopic observation. Is this the "Presumptuous Philosopher" reductio, or a bullet defenders must bite? Crucially, explain why the charge of "presumption" alone fails to adjudicate between SIA and SSA. [5 marks]

  (d) Discuss the stability of these verdicts. How does changing the **reference class** affect SSA's result in (b)? Conversely, what structural problem threatens SIA if the universe is infinite rather than finite? [5 marks]

  ***

  # Model Answer

  **(a) Initial Anthropics**
  Under **SIA**, your existence is evidence weighted by the number of observers. The likelihood of existence is proportional to $N$.
  $Odds_{SIA} = \frac{P(C)}{P(S)} \times \frac{N_C}{N_S} = \frac{0.5}{0.5} \times \frac{10^{20}}{10^{14}} = 10^6 : 1$ (Favors CROWDED).

  Under **SSA**, you reason as a random sample from the reference class (all observers). The probability of *some* observer existing is 1 in both theories. While the probability of sampling *your specific* index is $1/N$, this factor applies to both hypotheses equally in the absence of distinguishing indexical data. Thus, the $1/N$ terms cancel in the likelihood ratio, leaving the odds at the physical prior: $1:1$.

  **(b) The Astronomer Update**
  First, calculate the fraction of observers who are astronomers ($P(Astro|H)$):
  *   **SPARSE:** 1 Civ $\to$ $10^8$ Astronomers. Total Observers = $10^{14}$.
      $P(A|S) = 10^8 / 10^{14} = 10^{-6}$.
  *   **CROWDED:** $10^6$ Civs $\to$ $10^3$ Astro-Civs $\to$ $10^3 \times 10^8 = 10^{11}$ Astronomers. Total Observers = $10^{20}$.
      $P(A|C) = 10^{11} / 10^{20} = 10^{-9}$.

  **Likelihood Ratio:** $\frac{P(A|C)}{P(A|S)} = \frac{10^{-9}}{10^{-6}} = 10^{-3}$.

  **Final Odds:**
  *   **SIA:** Start with SIA-updated odds ($10^6:1$) $\times$ Likelihood ($10^{-3}$) = **$10^3:1$ (Favors CROWDED)**.
  *   **SSA:** Start with Physical odds ($1:1$) $\times$ Likelihood ($10^{-3}$) = **$1:10^3$ (Favors SPARSE)**.

  **(c) Presumption vs. Doomsday**
  SIA's armchair certainty is the "Presumptuous Philosopher" objection: it seems absurd to rule out SPARSE without empirical data. However, this is not a decisive reductio because SSA suffers symmetric "armchair embarrassments." SSA implies the **Doomsday Argument**: if you are an early observer (low birth rank), SSA forces high confidence that the total number of observers is small (civilization ends soon), also from the armchair. Since both principles generate counterintuitive certainties without new empirical data, "presumption" cannot uniquely falsify SIA.

  **(d) Reference Classes and Infinities**
  SSA is unstable regarding the **reference class**. In (b), we used "all observer-lives." If we restrict the class to "astronomers," $P(A|S)$ and $P(A|C)$ both become 1. The likelihood ratio becomes 1, and SSA reverts to 1:1 odds, erasing the support for SPARSE. This sensitivity makes SSA verdicts arbitrary based on class definition. SIA avoids reference classes but faces the **Infinite Universe** problem. If $N_C = \infty$, SIA probabilities become undefined (dividing by infinity) or force certainty in infinite hypotheses regardless of physics, requiring ad hoc restrictions (e.g., SIA$_{restricted}$) similar to SSA's reference class fixes.

  ***

  # Marking Scheme

  **Total: 30 Marks**

  | Move | Marks | Requirement | Typical Student Error |
  | :--- | :---: | :--- | :--- |
  | **1. SIA Initial Calculation** | 5 | Correctly computes $10^6:1$ odds by weighting priors by population size ($N_C/N_S$). | Forgets to weight the prior by $N$, treating SIA as just "possible observers exist." |
  | **2. SSA Initial Explanation** | 5 | Explains that sampling probability ($1/N$) cancels out in the likelihood ratio when only existence is known, leaving 1:1. | Claims SSA gives 0 update because "indexical evidence is impossible," conflating SSA with solipsism. |
  | **3. Astronomer Math & Final Odds** | 10 | Correctly derives $P(A|H)$ fractions ($10^{-6}$ vs $10^{-9}$), computes LR ($10^{-3}$), and applies it to the *Part (a)* baselines to get $1000:1$ (SIA) and $1:1000$ (SSA). | Applies likelihood ratio to the *physical* prior (0.5/0.5) for SIA, ignoring the Part (a) anthropic update. |
  | **4. Symmetry of Embarrassment** | 5 | Identifies "Presumptuous Philosopher" but notes SSA's symmetric Doomsday/Early-Birth problem; argues presumption isn't unique to SIA. | One-sided critique: attacks SIA for presumption without acknowledging SSA's Doomsday implication. |
  | **5. Reference Class vs. Infinity** | 5 | Notes SSA verdict flips/vanishes if Ref Class = "Astronomers"; notes SIA breaks/undefined if $N=\infty$. | Vague hand-waving about "reference classes are hard" without showing how it changes the math in (b). |
