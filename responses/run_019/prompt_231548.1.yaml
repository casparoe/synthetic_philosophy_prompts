answer: |-
  Here is a complete design for your two-hour session. It is tailored for a rationalist/programmer audience by framing the linguistic phenomenon as a "scope leakage" bug in natural language semantics.

  # Activity Title: "Semantic Scope Leakage"

  ## 1. Conceptual Frame
  For a LessWrong crowd, do not frame this as "sensitivity training." Frame it as **debugging a communication protocol.**
  *   **The Bug:** Natural language pretends all meaning is truth-conditional (like code), but some meaning "escapes" logical operators (negation, conditionals).
  *   **The Case Study:** Slurs are the most extreme example of this leakage.
  *   **The Goal:** Identify the leakage pattern using a controlled, synthetic variable (a made-up slur).

  ## 2. Materials Needed
  *   **Whiteboard/Projector:** For tracking group findings.
  *   **Handout A (The Spec):** Defines the fictional culture and terms.
  *   **Handout B (The Corpus):** 10 sentences to analyze.
  *   **Sticky Notes:** Two colors (e.g., Blue for "Factual Claim," Red for "Social Stigma").
  *   **Timer.**

  ## 3. The Fictional Setup (Handout A)
  *   **Group:** The **Kaelen**. A fictional ethnic minority in a fictional country.
  *   **Neutral Term:** "Kaelen." (Descriptive only: denotes ancestry/region).
  *   **Loaded Term:** "Krag." (Descriptive: denotes ancestry/region **+** Expressive: denotes *inherently deceitful/untrustworthy*).
  *   **The Rule:** In this culture, calling a Kaelen a "Krag" is considered an accusation of moral defect, not just a classification.

  ## 4. Timeline (120 Minutes)

  ### Phase 1: Calibration (15 mins)
  *   **Intro (5 mins):** Explain the goal. "We are analyzing a semantic bug where meaning survives logical negation. We will use a synthetic slur ('Krag') to isolate the variable without triggering real-world trauma."
  *   **Priming (10 mins):** Read a short vignette together.
      *   *Scenario:* "Tobin is a Kaelen. He returns a lost wallet."
      *   *Speaker 1:* "Tobin is a Kaelen." (Reaction: Neutral observation).
      *   *Speaker 2:* "Tobin is a Krag." (Reaction: Accusation that he is deceitful, despite the wallet return).
      *   *Task:* Ask the room: "If Speaker 2 is proven wrong about the wallet, does the word 'Krag' still feel dirty? Yes/No." (Get a show of hands).

  ### Phase 2: The Scope Test (45 mins)
  *   **Grouping:** Break into 3 groups of 5.
  *   **Task:** Each group gets **Handout B** (The Corpus). They must evaluate each sentence on two axes:
      1.  **Truth Conditions:** Can this sentence be *false*? (e.g., If Tobin isn't Kaelen, is the sentence false?)
      2.  **Stigma Persistence:** If you say this, have you still insulted the Kaelen? (Rate 1-5).
  *   **The Corpus (Examples):**
      1.  *Assertion:* "Tobin is a Krag."
      2.  *Negation:* "Tobin is **not** a Krag."
      3.  *Question:* "Is Tobin a Krag?"
      4.  *Conditional:* "If Tobin is a Krag, he probably stole the coins."
      5.  *Modal:* "Tobin might be a Krag."
      6.  *Control:* "Tobin is **not** a Kaelen."
      7.  *Denial of Attitude:* "Tobin is a Krag, but I don't mean anything bad by it."
  *   **Instruction:** "Treat 'Krag' like a function. Does the negative attitude stay *inside* the scope of the operator (NOT, IF, ?), or does it leak *outside*?"
  *   **Output:** Groups place sticky notes on the whiteboard.
      *   Blue Note: "Descriptive Content" (Inside scope).
      *   Red Note: "Expressive Content" (Outside scope).

  ### Phase 3: Pattern Recognition (30 mins)
  *   **Gallery Walk:** Groups rotate to see other boards.
  *   **Discussion Prompt:** "Look at Sentence 2 ('Tobin is not a Krag'). The sentence denies the label. Why does the Red Note (Stigma) still appear?"
  *   **Programming Analogy:** Ask the programmers: "If I run `if not is_krag(tobin):`, why does the `log_warning('deceitful')` still fire?"
  *   **Key Insight to Elicit:** The descriptive part (Kaelen ancestry) is negated. The expressive part (contempt) is *not* negated. It is asserted *by the choice of the word itself*, regardless of the sentence structure.

  ### Phase 4: Debrief & Theory Mapping (30 mins)
  *   **Lecturette (15 mins):** Now you introduce the linguistics terms.
      *   **At-Issue Content:** The descriptive claim (Tobin is Kaelen). This is truth-conditional. It lives inside the logical scope.
      *   **Not-At-Issue Content:** The expressive/prejudicial claim (Kaelen are contemptible). This *projects*. It lives outside the logical scope.
      *   **The Semantic Bug:** Standard Truth-Conditional Semantics (Tarski-style) assumes meaning = truth conditions. Slurs break this. `NOT(Slur(x))` is not equivalent to `NOT(Neutral(x))`.
      *   **Rationality Connection:** This is why "Taboo Your Words" is hard. You cannot simply negate a tabooed concept; the concept carries baggage that survives negation. "I'm not saying he's a [slur]" still activates the [slur] frame.
  *   **Q&A (15 mins):** Open floor.

  ---

  ## 5. Predictable Failure Modes & Steering

  **Failure 1: The "It's Just a Fake Word" Problem**
  *   *What happens:* Participants treat "Krag" as purely descriptive because they have no emotional conditioning to feel the "slime." They rate Stigma Persistence as 0 for negation.
  *   *The Fix:* **Over-prime the expressive content.** In the intro vignette, explicitly state: "In this culture, using 'Krag' is socially equivalent to spitting on someone's shoes. It is impossible to use the word without expressing contempt." Remind them during the activity: "You are simulating the *logic* of the insult, not the historical trauma. Assume the insult fires automatically."

  **Failure 2: Moralizing vs. Mechanizing**
  *   *What happens:* The discussion drifts into "Slurs are bad" rather than "How do slurs function semantically?"
  *   *The Fix:* Acknowledge the ethics, then pivot. "Yes, they are harmful. Precisely *because* the harm is structurally embedded in the logic. We are studying the mechanism of the harm so we can recognize it in other contexts (e.g., political rhetoric, corporate speak)."

  **Failure 3: Confusion on Sentence 7 (The Contradiction)**
  *   *What happens:* Sentence 7 ("...but I don't mean anything bad") confuses people. Some say it's true, some say it's a contradiction.
  *   *The Fix:* This is the "Moore's Paradox" moment. Guide them to see this is the strongest evidence. "If the bad meaning were just an implication, I could cancel it. Since I *can't* cancel it without sounding crazy, it proves the meaning is hard-coded to the word."

  **Failure 4: Programmers treating it as a Syntax Error**
  *   *What happens:* They argue the sentence is "invalid code."
  *   *The Fix:* Agree! "Exactly. In a strictly typed language, this word shouldn't compile. Natural language is loosely typed, which allows this bug to propagate."

  ---

  ## 6. Limitations of the Activity
  You asked what this *cannot* reproduce. Be honest about this in the debrief.

  1.  **The "Punching Down" Dynamic:** A fake slur has no history of systemic violence. The activity captures the *semantic projection*, but not the *material harm*. The "gut feeling" will be cognitive dissonance, not fear or anger.
  2.  **Reclamation/In-Group Use:** The activity treats the slur as uniformly toxic. It cannot simulate how an in-group might reclaim a slur (changing the expressive content while keeping the descriptive). That requires actual group identity.
  3.  **Dog Whistles:** Real slurs often have plausible deniability ("I didn't mean *that* kind of Krag"). The activity makes the meaning explicit to teach the logic, whereas real-world slurs often rely on the ambiguity being the weapon.

  ## 7. Debrief Script Snippet (The "Why It Matters")
  > "Why do we care about this at a rationality meetup? Because we often think we can neutralize a bad idea by negating it. 'I'm not saying women are bad at math.' Semantically, you have just asserted the frame where 'women' and 'bad at math' are linked, and the expressive content (that this is a plausible thing to discuss) has projected out of your negation.
  >
  > Slurs are the extreme case, but the mechanism is everywhere. If you want to change the map, you can't just paint over the territory. You have to change the variables. That's why 'Taboo Your Words' works: it forces you to find a new function that doesn't have the scope leakage."

  ## 8. Logistics Checklist
  *   [ ] Print Handouts (15 + 5 spares).
  *   [ ] Buy Sticky Notes (Red/Blue).
  *   [ ] Test the "Krag" pronunciation (ensure it doesn't accidentally sound like a real slur in your local accent).
  *   [ ] Prepare a "Parking Lot" on the whiteboard for ethical questions that arise, so you can address them at the end without derailing the semantic analysis.

  This design leverages the group's strength (logic/programming) to bypass the weakness (lack of linguistics background) while respecting the sensitivity of the topic through abstraction.
