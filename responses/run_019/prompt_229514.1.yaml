answer: |-
  **Memorandum to the Board of Trustees**

  **Subject:** Operationalising the Keynesian Charter: A Decision Procedure for Grant-Making

  **Introduction: Distinguishing the Economic from the Permanent**

  The founding charter instructs us to prepare society for the moment when mankind's permanent problem replaces its economic one. To translate this into a working procedure, we must first isolate the philosophical distinctions in Keynes's *Economic Possibilities for our Grandchildren* that are operationally relevant. Keynes draws several critical boundaries: between absolute needs (subsistence) and relative needs (status); between instrumental action (purposiveness, valued for future consequences) and intrinsic action (the art of living, valued for immediate quality); and between the transition phase (where accumulation is still virtuous) and the destination phase (where accumulation becomes a morbid propensity).

  For the purposes of a ninety-minute assessment, we must simplify. We cannot adjudicate macroeconomic timelines. Therefore, this procedure retains three core distinctions: (1) **Means vs. Ends**, to distinguish productivity growth from capacity for living; (2) **Transition Necessity**, to acknowledge that accumulation is still required where subsistence is unmet; and (3) **Purposiveness-Capture**, to identify proposals that mask status competition or accumulation as wellbeing. We drop Keynes's specific centennial timeline and his psychological speculations on human nature, as these are unverifiable in a grant context. What remains is a test of whether a proposal solves an economic constraint or cultivates the freedom to use the resulting leisure.

  **The Keynesian Grant Assessment Procedure**

  This procedure is mandatory for all applications between £50,000 and £2 million. It must be completed in the first assessment phase.

  **Step 1: Screening Questions**
  The Programme Officer must answer the following three questions based on the application text:
  1.  **Need Classification:** Does the project address absolute material deprivation (food, security, shelter) or relative status and leisure capacity?
  2.  **Valuation Mode:** Is the primary activity valued for its output (e.g., jobs created, GDP contribution, efficiency gains) or for the quality of the experience itself (e.g., learning, community, contemplation)?
  3.  **Temporal Horizon:** Does the benefit accrue primarily in the remote future (accumulation) or in the immediate present (living)?

  **Step 2: Classification by Transition Stage**
  Based on Step 1, classify the application into one of two stages:
  *   **Stage A (Solving the Economic Problem):** Projects addressing absolute need or necessary infrastructure where scarcity still binds. *Funding Condition:* Permissible, but only if no Stage B alternative exists in the same sector. We must not solve economic problems that are already solved.
  *   **Stage B (Preparing for the Permanent Problem):** Projects cultivating the capacity to use leisure, pursue arts, or engage in non-instrumental community life. *Funding Condition:* Preferred. These align directly with the Charter's end-goal.

  **Step 3: The Purposiveness-Capture Test**
  This test identifies proposals that dress up accumulation as the good life. Ask: *If the project succeeded perfectly, would participants be working harder for future gain, or living better now?*
  *   **Fail:** Projects that measure success via productivity metrics, employability, or economic growth, even if labelled "wellbeing."
  *   **Pass:** Projects that measure success via participant satisfaction, skill mastery for its own sake, or social cohesion without economic output.
  *   **Action:** Any application failing this test is rejected unless it qualifies as Stage A (essential subsistence).

  **Step 4: Trustee Hand-Off Points**
  The Programme Officer must refer the application to the Board if:
  1.  The application claims to solve the economic problem in a sector where scarcity is disputed (e.g., housing in a prosperous city).
  2.  The application argues that accelerating technological abundance is itself a moral good (a value judgment on the transition speed).
  3.  The Purposiveness-Capture Test yields a contested result (i.e., the project mixes means and ends).

  **Step 5: Statement of Distinctions**
  In the final summary, the Officer must explicitly state: "This decision preserves the distinction between [Means/Ends] and classifies the project as [Stage A/B]." Distinctions regarding macroeconomic timing are deemed outside the scope of this assessment.

  **Application to Hypothetical Cases**

  To demonstrate the procedure, we apply it to three representative applications from the current round.

  **Case 1: Universal Basic Services (UBS) Pilot in a Prosperous British City**
  *Proposal:* A £1.5m pilot providing free transport, internet, and basic food staples to all residents in a wealthy Home County city.
  *Step 1:* Addresses absolute need ( ostensibly), but in a prosperous context. Valuation is instrumental (security enables work). Horizon is immediate relief.
  *Step 2:* Classification is contested. Is the economic problem solved here? Data suggests low poverty rates. This leans towards Stage B territory mislabelled as Stage A.
  *Step 3:* Purposiveness-Capture. The proposal argues security allows people to "contribute to the economy." This fails the test; it treats security as a means to productivity, not leisure.
  *Step 4:* Hand-Off. The definition of "need" in a prosperous city is a value judgment.
  *Verdict:* **Refer to Board with Recommendation to Reject.**
  *Reasoning:* In a prosperous city, the economic problem is largely solved. Funding subsistence here maintains the population in a state of dependency rather than cultivating the capacity for leisure. It treats adults as recipients of care rather than agents of the good life. The Charter demands we prepare for the permanent problem; this proposal merely cushions the economic one where it is already fading. Trustees may find this unwelcome as UBS is politically popular, but it contradicts the instruction to move beyond subsistence where subsistence is secured.

  **Case 2: National Programme of Community Arts for Early Retirees**
  *Proposal:* A £800k programme offering non-vocational arts education and leisure clubs for those retiring before state pension age.
  *Step 1:* Addresses leisure capacity. Valuation is intrinsic (learning for enjoyment). Horizon is immediate present.
  *Step 2:* Stage B (Preparing for the Permanent Problem).
  *Step 3:* Purposiveness-Capture. Success metrics are based on participation and self-reported fulfilment, not employability. Pass.
  *Step 4:* No Hand-Off required.
  *Verdict:* **Fund.**
  *Reasoning:* This directly addresses Keynes's concern: what shall we do with our freedom from economic necessity? It cultivates the "art of living" in a demographic facing sudden leisure. It aligns perfectly with the Charter.

  **Case 3: Institute for Automation and Abundance**
  *Proposal:* A £2m research institute developing automation technology. The application argues explicitly on Keynesian grounds that hastening abundance is the best contribution to the good life now available.
  *Step 1:* Addresses economic problem (efficiency). Valuation is instrumental (output per hour). Horizon is remote future.
  *Step 2:* Stage A (Solving the Economic Problem).
  *Step 3:* Purposiveness-Capture. The project values action entirely for remote consequences (future abundance). It exacerbates the habit of purposiveness. Fail.
  *Step 4:* Hand-Off. The claim that hastening abundance is a moral good is a value judgment on the transition.
  *Verdict:* **Refer to Board with Recommendation to Reject.**
  *Reasoning:* This is the counterintuitive verdict. The applicants argue they are fulfilling the Charter by speeding up the arrival of abundance. However, Keynes warns that the love of money and purposiveness are morbid propensities we must outgrow. Funding an institute dedicated to accelerating accumulation without a parallel programme to cultivate the capacity for living risks arriving at abundance with a population psychologically unfit for it. It prioritises the means over the ends. Trustees accustomed to funding innovation may reject this reasoning, but the procedure dictates that accelerating the means without preparing the ends is philosophically inconsistent with the Charter.

  **Limits and Interpretation of the Procedure**

  This procedure is not a mechanical algorithm; it is a framework for disciplined judgment. It will misfire where the distinction between absolute and relative need is blurred, such as in mental health services where subsistence and capacity for living are intertwined. In these cases, the Procedure forces a classification that may feel artificial. Furthermore, the Purposiveness-Capture Test dresses up a philosophical judgment as a classification exercise. Deciding whether "employability" is a morbid propensity or a necessary transition tool is not an empirical fact but an ethical stance derived from Keynes. We cannot settle this in principle; we can only enforce consistency with the Charter.

  Finally, we must interpret Keynes's instruction to "disembarrass myself of short views." Concretely, this demands that we ignore metrics of immediate political impact or quarterly economic multipliers. It requires us to fund projects whose value may not be visible for a generation, such as cultural shifts in how leisure is valued. However, this does not license discounting the needs of the present generation. Keynes insists that "for some time yet we must continue to treat accumulation as useful." We cannot abandon those still struggling for subsistence. The procedure respects this via the Stage A classification. To ignore present suffering would be to misunderstand the transition; we must carry the rest of society towards abundance, not leave them behind while we practise the art of living.

  The unwelcome verdicts generated by this procedure—specifically the rejection of the Automation Institute and the UBS pilot—are features, not bugs. They signal that we are taking the Charter seriously. If our grant-making looks identical to a standard government efficiency programme or a generic wellbeing fund, we have failed to disembarrass ourselves of short views. We are not here to solve the economic problem where it is already solved, nor to accelerate the machinery of accumulation for its own sake. We are here to prepare the ground for the moment when work is no longer a virtue, and life itself is the end. This procedure ensures we do not fund the obstacles to that future while pretending to build it.

  **Conclusion**

  The Board is asked to adopt this procedure for the upcoming funding round. It provides the necessary rigour to satisfy the Charter without requiring Trustees to possess philosophical training. It isolates the value judgments for Board approval while empowering Officers to filter applications based on consistent criteria. We must be prepared for the criticism that we are ignoring "innovation" or "security," but our mandate is not generic goodness; it is the specific preparation for a post-economic society. This procedure ensures we remain faithful to that unique instruction.
