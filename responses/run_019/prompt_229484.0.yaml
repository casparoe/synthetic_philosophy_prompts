answer: |-
  This is a precise and fruitful intersection of philosophy and theoretical biology. David Lewis's *Convention* (1969) is effectively a pre-evolutionary game theoretic account of coordination, grounded in rational choice theory. Translating it into evolutionary game theory (EGT) requires shifting from *agents with beliefs* to *strategies with frequencies*.

  Here is the translation, the test case, and the residue report.

  ---

  ### 1. Translation: Lewis into Evolutionary Game Theory

  To translate Lewis faithfully, we must map his epistemic and doxastic conditions onto the dynamical and structural properties of a population model. We assume a large population playing a symmetric (or asymmetric) game repeatedly under replicator dynamics or similar selection processes.

  | Lewis's Component | Evolutionary Game Theory Translation |
  | :--- | :--- |
  | **Recurring Situation** | **A Population Game.** A specific payoff matrix played repeatedly by randomly matched (or structured) members of a population. The "situation" is the game form itself (e.g., Coordination Game, Hawk-Dove). |
  | **Multiplicity of Solutions** | **Multiple Strict Nash Equilibria (or ESSs).** The payoff matrix must admit at least two distinct strategy profiles (e.g., All-$A$ and All-$B$) that are both Evolutionarily Stable Strategies. If only one ESS exists, there is no convention, only a forced optimum. |
  | **Conformity (Regularity)** | **Monomorphic or Polymorphic Population State.** The population state $x$ is concentrated at or near one of the stable equilibria (e.g., frequency of strategy $A \approx 1$). |
  | **Conditional Preference** | **Best Response / Invasion Barrier.** Strategy $A$ yields higher fitness than any mutant strategy $B$ *conditional* on the population state being predominantly $A$. Formally: $E(A, x_A) > E(B, x_A)$. This is the definition of a Strict Nash Equilibrium or a stable fixed point in replicator dynamics. |
  | **Expectation** | **Population Frequency as Signal.** In EGT, agents do not hold expectations. The "expectation that others will conform" is replaced by the *statistical reality* of the population state. An individual's strategy is tuned (by selection or learning) to the current distribution of strategies in the population. |
  | **Common Knowledge** | **Public Correlation Device or Global Stability.** Lewis requires infinite recursion of knowledge ($I$ know that you know...). In EGT, this translates to the **robustness of the equilibrium**. <br>1. If the game involves cues (like ownership), it is a **Correlated Equilibrium** where the cue is a public signal observable by all.<br>2. If no cue exists, "common knowledge" maps to the **Basin of Attraction**. If the system is in the basin, the dynamic flow ensures convergence; the "knowledge" is encoded in the stability of the attractor itself. It does not require cognitive representation, only that the state is self-reinforcing. |
  | **Arbitrariness** | **Payoff Symmetry between Equilibria.** The alternative equilibrium (All-$B$) must yield comparable fitness to the current one (All-$A$). If $A$ dominates $B$ in payoff regardless of frequency, $A$ is not a convention but a dominant strategy. Arbitrariness means the selection of the equilibrium is **path-dependent**, not payoff-determined. |
  | **Precedent** | **Historical Contingency / Initial Conditions.** Which equilibrium is selected depends on the initial population state $x_0$. If the population started near All-$A$, it stays there. This is **path dependence** in the phase space. |
  | **Salience** | **Focal Points in Payoff Space.** Certain equilibria may have larger Basins of Attraction or higher risk-dominance (Harsanyi & Selten). Salience translates to the **size of the basin of attraction** or payoff prominence that makes one equilibrium more likely to be hit by stochastic drift or mutation. |

  ---

  ### 2. Test Case: The Bourgeois Strategy

  **The Scenario:** In territorial contests, individuals adopt the "Bourgeois" strategy: Play Hawk if Owner, Play Dove if Intruder. The alternative is "Anti-Bourgeois": Play Dove if Owner, Play Hawk if Intruder. Both are ESSs in the asymmetric Hawk-Dove game (Maynard Smith & Parker, 1976).

  **Does this count as a Lewisian Convention?**

  *   **Regularity:** Yes. The population is monomorphic for Bourgeois.
  *   **Multiplicity:** Yes. Anti-Bourgeois is also an ESS.
  *   **Conditional Preference:** Yes. Being Bourgeois is a best response to a population of Bourgeois.
  *   **Arbitrariness:** Yes. Structurally, Anti-Bourgeois works just as well to avoid costly fights. The selection of Bourgeois over Anti-Bourgeois is not determined by payoff superiority but by historical contingency (perhaps ownership was correlated with winning early on).
  *   **Expectation/Common Knowledge:** **Here lies the friction.** The animals hold no expectations. They possess no theory of mind.

  **The Verdict on "Loose" Usage:**

  Your field is **not** using the word too loosely; Lewis's account is **too narrow** for the biological phenomenon.

  Lewis conflated the *functional structure* of a convention (arbitrary coordination equilibrium) with the *cognitive mechanism* sustaining it (common knowledge). The Bourgeois strategy satisfies the structural definition perfectly. It is an arbitrary coordination equilibrium sustained by a correlation device (ownership status).

  In Lewis's framework, the "common knowledge" condition is a *mechanism* to ensure the conditional preference holds. In EGT, natural selection (or reinforcement learning) ensures the conditional preference holds without the knowledge. The "expectation" is externalized into the environment: the ownership cue *is* the public signal that correlates behavior.

  **Where the translation has bite:**
  The translation reveals that "convention" in biology is a property of the **system dynamics**, not the agent's mind. If you insist on Lewis's epistemic conditions, you must exclude almost all animal behavior from being conventional. However, if you accept the EGT translation, you see that Lewis's epistemic conditions are merely one specific *implementation* (human rational deliberation) of a broader class of dynamical phenomena (stable arbitrary equilibria).

  The biologists are correct to call it a convention because the *evolutionary problem* solved is identical to Lewis's *rational problem*: selecting one equilibrium from multiple equivalent options to avoid coordination failure (costly fights).

  ---

  ### 3. The Residue Report

  Here is what survives, what distorts, and what is lost in the translation from Rational Choice to Replicator Dynamics.

  #### A. The Epistemic Conditions (Common Knowledge)
  *   **Status:** **Dissolved.**
  *   **Analysis:** Replicator dynamics do not require common knowledge. They require only that strategies yielding higher payoffs increase in frequency. The "knowledge" that others will conform is implicit in the fitness landscape. If a mutant appears, it fails not because it "knows" it will fail, but because it *does* fail.
  *   **Verdict:** **Lewis added unnecessary scaffolding.** The epistemic layer is specific to deliberative agents. The evolutionary reconstruction shows that convention is fundamentally a **dynamical stability property**, not an epistemic one. Lewis's account explains *how humans recognize* conventions; EGT explains *why conventions exist* across taxa.

  #### B. Convention vs. Mere Behavioral Regularity (ESS vs. Norm)
  *   **Status:** **Translates Cleanly.**
  *   **Analysis:** Lewis wants to distinguish conventions (arbitrary coordination) from norms enforced by punishment or regularities caused by dominant strategies. EGT captures this distinction via payoff structure.
      *   *Mere Regularity (Dominant Strategy):* Only one ESS exists (e.g., Always defect in one-shot PD).
      *   *Convention (Coordination):* Multiple ESSs exist (e.g., Left vs. Right).
      *   *Norm (Sanctioned):* Can be modeled as a game where deviation triggers punishment (second-order selection), making the cooperative equilibrium stable against invasion.
  *   **Verdict:** **EGT handles this better.** Lewis relies on introspection to distinguish "I conform because I prefer to" vs. "I conform because I am forced." EGT distinguishes these mathematically by analyzing the Hessian of the payoff function or the invasion fitness of mutants. An ESS that is not a coordination equilibrium is not a convention in either framework.

  #### C. Reflection and Deliberation (Switching Equilibria)
  *   **Status:** **Lost / No Expression.**
  *   **Analysis:** Lewis allows that agents can reflect, realize another convention would work better, and collectively switch (e.g., metric vs. imperial). Replicator dynamics are blind. A population cannot "decide" to switch from Bourgeois to Anti-Bourgeois even if Anti-Bourgeois became slightly more beneficial due to environmental change, unless the population is pushed across the **unstable equilibrium** (the separatrix) separating the basins of attraction.
  *   **Verdict:** **EGT is missing a notion of agency.** This is the one place Lewis's account captures something EGT cannot: **intentional equilibrium selection.** EGT models *drift* or *perturbation* across basins; Lewis models *negotiation*.
      *   *Implication:* If you are modeling human social norms where public discourse drives change, pure replicator dynamics are insufficient. You need **cultural evolutionary models** that include biased transmission or rational choice hybrids to capture the "deliberative switch."

  ### Final Synthesis

  **Does the evolutionary reconstruction show convention was never epistemically loaded?**
  Yes. The reconstruction demonstrates that the *phenomenon* of convention (arbitrary, stable coordination) is substrate-neutral. It can be realized by rational minds with common knowledge or by blind replicators with payoff sensitivity. Lewis's epistemic conditions are sufficient but not necessary.

  **Does it reveal what Lewis's account can see and yours cannot?**
  It reveals that Lewis's account captures the **teleology of maintenance**. In Lewis's world, the convention persists *because* people know it persists. In your world, it persists *despite* no one knowing why.
  *   **Lewis:** Explains the *normative force* ("I ought to drive on the right because we agreed to").
  *   **EGT:** Explains the *causal stability* ("Driving on the right persists because left-drivers crash").

  **Recommendation for your framework:**
  Adopt the EGT translation for the *definition* of convention (Multiple ESS, Path Dependence, Correlated Equilibrium). However, acknowledge the **Residue of Agency**. When modeling human social behavior, treat "common knowledge" not as a metaphysical requirement, but as a **mechanism of rapid convergence**. Public signals (language, media) function in human populations to shrink the basin of attraction of the undesirable equilibrium and expand the desirable one, effectively simulating the "common knowledge" condition to facilitate faster coordination than blind selection allows.

  Lewis gave you the logic of the equilibrium; you have given Lewis the dynamics of the population. The term "convention" survives the translation robustly, provided you sever it from the requirement of conscious expectation.
