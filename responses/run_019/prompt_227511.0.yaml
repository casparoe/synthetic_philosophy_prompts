answer: |-
  Your friend has presented a sophisticated and formidable version of what is known in the literature as the **Inconsistency Theory of Truth**. It is a position championed by philosophers such as Matti Eklund and, in a revisionary form, Kevin Scharp. The argument is valid in its internal logic, which is why your "cheaper exits" have felt like they were bouncing off a wall. However, your intuition about step (8) is correct: it is pragmatically self-defeating. More importantly, there is a deeper philosophical overreach in the move from inconsistency to incoherence.

  Here is a diagnosis of the argument, identifying the step you should reject, the equivocation involved, and the costs of doing so.

  ### The Step to Reject: (6)

  You should reject step **(6)**: *"If no consistent theory can be adequate to a concept, that concept is incoherent."*

  This is the pivot upon which the argument turns from a technical result about formalisation into a nihilistic conclusion about our cognitive lives. Your friend's reasoning relies on the assumption that for a concept to be **coherent** (and thus usable for belief and assertion), it must be possible to construct a **consistent theory** that fully captures it.

  #### Why does (6) look so compelling?
  It appeals to a deep-seated rationalist intuition: that logic is the law of thought. If our concept of truth violates the laws of logic (specifically, the Law of Non-Contradiction, given the derivation in steps 1–4), it feels as though the concept itself is broken. It seems to imply that we are thinking something impossible, akin to conceiving of a "round square." If the rules governing 'truth' lead to contradiction, surely the notion is defective.

  #### The Equivocation and Shift in Demand
  There is indeed a shift in what is being demanded of a theory, primarily located between steps **(2)** and **(6)**, which relies on an equivocation on the word **"adequate"**.

  *   **In step (2)**, "adequate" means **descriptively faithful** to our ordinary usage. It demands that the theory captures the platitudes we actually hold (like the T-schema in step 3).
  *   **In step (6)**, "adequate" implicitly shifts to mean **formally consistent**.

  The argument assumes that a concept cannot be descriptively faithful to our usage *and* inconsistent. But why not? Our ordinary concepts are tools for navigation, not axioms in a formal system. It is entirely possible that our ordinary concept of truth is *inconsistent* (in that its constitutive rules generate contradictions in edge cases like the Liar) without being *incoherent* (in the sense of being useless or incapable of supporting belief).

  By rejecting (6), you are distinguishing between **conceptual inconsistency** (the rules clash) and **conceptual incoherence** (the concept cannot function). You can grant your friend steps (1) through (5)—admitting that truth is inconsistent—without accepting the catastrophic conclusion (7) that belief and assertion are doomed.

  ### The Problem with Step (8)
  You were right to be suspicious of step (8). Your friend attempts to use the **Validity Liar** to immunise the argument against the charge of self-refutation. He claims that because the argument concludes validity is incoherent, the fact that the argument itself is invalid merely confirms the conclusion.

  This is a logical error. If the concept of validity is incoherent, then the relation of *logical consequence* does not hold. If logical consequence does not hold, the premises of your friend's argument do not support the conclusion. The argument does not "confirm" the conclusion by being invalid; it **fails to establish** the conclusion by being invalid. To use the argument to persuade you of anything, your friend must presuppose that validity is coherent enough to transmit truth from premises to conclusion. Step (8) saws off the branch the argument is sitting on; it cannot be taken as a confirmation, but rather as a *reductio ad absurdum* of the claim that validity is incoherent.

  ### The Costs of Rejection

  You asked what rejecting (6) genuinely costs, compared to the alternatives.

  **1. The Cost of Rejecting (6) (The Inconsistency View)**
  *   **What you accept:** You concede that our ordinary concept of truth is inconsistent. You admit that there is no consistent theory that captures all the platitudes of truth without restriction.
  *   **What you save:** You save the utility of truth. You can maintain that truth is the aim of belief and assertion, provided we recognise that the concept functions well in ordinary domains and only fractures in pathological cases (like the Liar). This is often called a "paraconsistent" or "tolerant" approach.
  *   **Philosophical burden:** You must explain how we can successfully reason with an inconsistent concept without exploding into triviality (believing everything). The answer usually involves distinguishing between *good* reasoning (which avoids the paradoxes) and *bad* reasoning (which triggers them), or adopting a paraconsistent logic where contradictions do not entail everything.

  **2. The Cost of Accepting (7) (The Nihilist View)**
  *   **What you accept:** You accept that truth is defective "full stop" and that belief and assertion rest on a notion that "cannot be made good."
  *   **The consequence:** This is intellectual suicide. If truth is incoherent, then your friend's claim that "truth is incoherent" cannot be *true*. If belief has no constitutive aim, then there is no reason to believe your friend's argument over its negation. This view renders philosophy, science, and ordinary discourse unintelligible. It is a price too high to pay for logical rigour.

  **3. The Cost of Rejecting (2) or (3) (The Standard Solutions)**
  *   You mentioned you wish to keep (1) and (3). If you were to reject **(3)** (the T-schema), you save consistency but lose the "whole point of having a truth predicate," as you noted.
  *   If you reject **(2)**, you claim a theory is adequate even if it doesn't settle the Liar. Your friend blocks this with **Revenge** (step 5). To make this stick, you would have to argue that the Revenge sentences are not meaningful or that the meta-language truth predicate is distinct from the object-language one (Tarski's approach). This costs you the "universality" of truth—the idea that we can talk about truth for *any* sentence, including those about truth itself.

  ### Recommendation

  Reject **(6)**.

  It allows you to acknowledge the logical force of the Liar without surrendering the concept of truth entirely. It permits you to say: *"Our concept of truth is indeed inconsistent, as the Liar shows. However, concepts are tools, and a tool can be slightly flawed without being useless. We do not need to abandon belief and assertion; we simply need to recognise the limits of the concept when it turns upon itself."*

  This position respects the platitude in (3) as a central rule of the concept, accepts the meaningfulness in (1), but denies that the resulting inconsistency renders the concept incoherent. It avoids the self-defeat of (8) by maintaining that validity is coherent enough to sustain the argument, even if truth is not. It is the only path that allows you to remain a philosopher without having to abandon the very norms of assertion that make philosophy possible.
