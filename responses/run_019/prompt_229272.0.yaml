prompt: |-
  I got into a stupidly heated argument at Thanksgiving about whether my cousin is obligated to vote. She says her one vote is astronomically unlikely to swing anything so she might as well stay home, and my uncle shut her down with "what if everyone did that?" She shot back that everyone *isn't* doing that and won't, so who cares, and then everyone just talked past each other for twenty minutes. I keep running into this move — people deploy it about littering, free-riding on public transit, eating meat, whatever — and I've also noticed it gets treated as if it's just Kant for the masses, but then I took a philosophy course a few years back and remember Kant's actual universalizability tests being much weirder and more specific than "imagine everyone doing it and see if things go badly."

  So: can you lay out the distinct precise principles that "what if everyone did that?" could be standing for? I can gesture at some candidates — something like a genuinely Kantian test where the problem is a contradiction in willing or conceiving the universalized maxim, a more consequentialist generalization argument where the problem is just that bad results would follow if everyone did it, a fairness principle about not making an exception of yourself when you're counting on others to do their part, and maybe a causal claim that your behavior actually influences what others do — but I'm sure there are more and I'm sure I've mangled the Kant one. For each reading, say what kind of "what if" it's asking (logical, counterfactual, predictive?), whether it's a platitude, a substantive-but-defensible claim, or just false, and whether it actually delivers the conclusion my uncle wanted — i.e., that *this one person*, holding everyone else's actual behavior fixed, has a reason to vote. Please pay special attention to the objection my cousin would raise if she were cleverer: that for lots of these cases "everyone doing it" is either harmless, impossible, or so far-fetched that the thought experiment seems rigged, and that you can redescribe the maxim ("everyone whose vote has a less than one-in-a-billion chance of mattering stays home") to make any universalization come out fine.

  End by telling me which reading you think people who reach for the slogan in arguments like ours actually mean — maybe different people mean different ones — and whether the slogan is doing any real work or is just a rhetorical shortcut for something weaker.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A Thanksgiving argument about voting obligation.
      *   **Core Conflict:** Cousin says "My vote doesn't matter" (instrumental insignificance). Uncle says "What if everyone did that?" (universalization). Cousin retorts "Everyone isn't doing that" (empirical reality).
      *   **User's Observation:** This slogan ("What if everyone did that?") is used everywhere (littering, free-riding, meat-eating). It's often treated as "Kant for the masses," but the user knows Kant is more specific.
      *   **Task:** Lay out distinct precise principles that the slogan could stand for.
      *   **Specific Requirements for Each Principle:**
          *   Identify the type of "what if" (logical, counterfactual, predictive, etc.).
          *   Evaluate status (platitude, substantive-but-defensible, false).
          *   Evaluate efficacy (does it prove *this one person* should vote, holding others fixed?).
          *   Address the "clever cousin" objection (harmless universalization, impossibility, redescription of the maxim).
      *   **Conclusion:** Identify what people *actually* mean when they use the slogan and whether it does real work or is just rhetoric.

  2.  **Deconstruct the Slogan ("What if everyone did that?"):**
      I need to categorize the philosophical underpinnings. The user already suggested four candidates:
      1.  Kantian Universalizability (Categorical Imperative).
      2.  Rule Consequentialism / Generalization Argument.
      3.  Fairness / Free-Rider Principle.
      4.  Causal / Expressive Influence.

      I should refine these and ensure I address the specific constraints (type of "what if," efficacy regarding the *individual* act, and the maxim redescription problem).

  3.  **Drafting the Principles:**

      *   **Principle 1: The Kantian Categorical Imperative (Formula of Universal Law).**
          *   *Concept:* Can the maxim be willed as a universal law without contradiction?
          *   *Type of "What If":* Logical/Conceptual possibility + Volitional consistency. Not empirical prediction.
          *   *Status:* Substantive but often misunderstood.
          *   *Efficacy:* Hard to apply to voting. Does universal non-voting contradict the *concept* of voting? Maybe. But the "clever cousin" maxim redescription ("Everyone whose vote is negligible stays home") defeats this easily.
          *   *Cousin's Objection:* Maxim redescription makes the contradiction disappear.

      *   **Principle 2: The Generalization Argument (Rule Consequentialism).**
          *   *Concept:* If everyone did $X$, consequences would be bad. Therefore, do not do $X$.
          *   *Type of "What If":* Counterfactual/Hypothetical empirical outcome.
          *   *Status:* Substantive but vulnerable to the "threshold" problem.
          *   *Efficacy:* Fails the "holding others fixed" test. It argues for a rule, not necessarily the specific act in a non-ideal world.
          *   *Cousin's Objection:* "Everyone isn't doing that." The bad consequences only happen if *everyone* does it, which won't happen.

      *   **Principle 3: The Principle of Fairness (Free-Rider Problem).**
          *   *Concept:* If you benefit from a cooperative scheme, you must contribute your fair share.
          *   *Type of "What If":* Normative comparison (ideal vs. actual behavior).
          *   *Status:* Substantive and defensible (Rawls/Hart).
          *   *Efficacy:* Stronger for voting. Voting maintains the democracy you benefit from.
          *   *Cousin's Objection:* "I benefit even if I don't vote." (Public good nature of election results). Also, is voting really a "cooperative scheme" in the same way as taxes?

      *   **Principle 4: The Causal/Expressive Influence (Social Norms).**
          *   *Concept:* Your act signals to others. If you don't vote, you lower the probability others vote.
          *   *Type of "What If":* Predictive/Empirical causal chain.
          *   *Status:* Empirically debatable but plausible.
          *   *Efficacy:* Directly addresses the individual act. Your act *does* matter because it influences $N$ other votes.
          *   *Cousin's Objection:* The effect is tiny. Is it enough to outweigh the cost of voting?

      *   **Principle 5: The "Participation as Constitutive" View (Civic Duty).**
          *   *Concept:* Voting isn't about outcomes; it's about standing as a citizen.
          *   *Type of "What If":* Not really a "what if." It's a "what is."
          *   *Status:* Substantive.
          *   *Efficacy:* Bypasses the instrumental calculation entirely.
          *   *Cousin's Objection:* "Why should I care about standing if the outcome hurts me?"

      *   *Self-Correction:* The prompt asks specifically about the slogan "What if everyone did that?" I should focus on the interpretations of *that specific move*, rather than introducing entirely new arguments like "Civic Duty" unless they fit the slogan. I'll stick to the user's suggested categories plus the Causal one, as those map best to the slogan. I will treat Fairness and Generalization as distinct because they answer the "why" differently.

  4.  **Addressing the "Clever Cousin" Objections:**
      *   *Maxim Redescription:* This is the killer for Kant. If the maxim is specific enough ("I won't vote because my probability of influence is $< 10^{-9}$"), universalizing it causes no contradiction.
      *   *Empirical Improbability:* This is the killer for Consequentialism. If everyone *won't* do it, the bad consequences don't obtain.
      *   *Threshold Effects:* Voting has thresholds. One vote rarely triggers a cascade.

  5.  **Evaluating Efficacy (Holding Others Fixed):**
      *   This is the crux. The Uncle wants to prove *Cousin* should vote *now*, given that *others* are voting.
      *   Kant: Fails (due to maxim redescription).
      *   Consequentialism: Fails (Fallacy of Composition).
      *   Fairness: Succeeds (Best candidate for the Uncle's intent).
      *   Causal: Succeeds (But magnitude is small).

  6.  **Synthesizing the Conclusion:**
      *   What do people *mean*? Usually a muddle of Fairness and Rule Consequentialism.
      *   Is it rhetorical? Yes. It shuts down conversation by invoking a moral intuition without doing the philosophical heavy lifting.
      *   Does it work? Only if the listener accepts the Fairness principle implicitly.

  7.  **Refining the Tone:**
      *   The user is philosophically literate ("took a philosophy course," knows Kant is weirder).
      *   Tone should be analytical, precise, slightly conversational but rigorous.
      *   Avoid preaching. Focus on the structure of the arguments.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Kant:* Need to explain *Contradiction in Conception* vs. *Contradiction in Will*. Voting is tricky. Universal non-voting doesn't make voting logically impossible (conception), but maybe we can't will a world without democracy (will). But the maxim specificity kills it.
      *   *Consequentialism:* Distinguish Act vs. Rule. The slogan is usually Rule Utilitarianism. The "holding others fixed" problem is the "Fallacy of Composition."
      *   *Fairness:* This is the Hart/Rawls "Principle of Fairness." It fits the "Uncle" vibe best. You benefit from the system, so you must bear the burden.
      *   *Causal:* This is the "Expressive Voting" or "Social Contagion" model. It turns the "what if" into a "what will."

      *   *The "Clever Cousin" Check:* For each, I need to explicitly state how she dismantles it.
          *   Kant: "My maxim is specific."
          *   Consequentialism: "The antecedent is false."
          *   Fairness: "I'm not a free-rider, I'm an opt-out." (Or: The benefit is non-excludable).
          *   Causal: "My influence is negligible."

  9.  **Final Review against Constraints:**
      *   Distinct precise principles? Yes.
      *   Type of "what if"? Yes.
      *   Platitude/Substantive/False? Yes.
      *   Delivers Uncle's conclusion (individual obligation, others fixed)? Yes.
      *   Address clever cousin objections? Yes.
      *   Conclusion on actual usage? Yes.

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Self-correction: Make sure to clearly distinguish between the *logic* of the argument and the *rhetoric* of the slogan).

  *(Self-Correction during drafting)*: I need to be careful with the Kantian section. The user noted Kant is "weirder and more specific." I should acknowledge the *Formula of Universal Law* specifically and the issue of *maxim formulation*. The "clever cousin" objection regarding maxim redescription is essentially the "problem of relevant descriptions" in Kantian ethics. I should name-drop that.

  For the Consequentialist one, I should mention the "Threshold Problem."

  For Fairness, I should mention the "Non-excludability" problem (you get the benefit of the election result whether you vote or not).

