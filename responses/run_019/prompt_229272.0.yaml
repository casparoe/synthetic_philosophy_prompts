answer: |-
  You are right to be suspicious. The slogan "What if everyone did that?" is a philosophical Swiss Army knife: it looks like one tool, but depending on how you grip it, it cuts in very different ways. In your Thanksgiving debate, your uncle was wielding it as a moral bludgeon, while your cousin was treating it as an empirical claim. They were speaking different normative languages.

  Here are the four distinct philosophical principles that slogan usually masks, analyzed by the type of "what if" they employ, their logical status, and whether they survive your cousin's "clever" objections.

  ### 1. The Kantian Test (Formula of Universal Law)
  This is the reading you suspected was being mangled. It is not about bad consequences; it is about logical or volitional consistency.

  *   **The Principle:** An action is permissible only if the *maxim* (the subjective principle of volition) behind it can be willed as a universal law without contradiction.
  *   **The "What If":** **Logical/Conceptual.** It asks: "Is it possible to conceive of a world where everyone acts on this rule? Is it possible to *will* such a world without undermining my own agency?"
  *   **Status:** **Substantive but vulnerable.** It is not a platitude; it is a rigorous test of rational consistency. However, it is notoriously difficult to apply to voting.
  *   **Does it prove the Uncle's point?** **No.**
      *   *Contradiction in Conception:* If everyone abstained, voting would still be *possible*. The institution wouldn't logically vanish.
      *   *Contradiction in Will:* Could you will a world where no one votes? Perhaps not, if you will the existence of a democracy. But this requires assuming you *must* will democracy, which is debatable.
  *   **The Clever Cousin's Objection (Maxim Redescription):** This is the fatal flaw for the Uncle. Kantian ethics hinges on how you describe the maxim.
      *   *Uncle's Maxim:* "I will not vote." (Universalizing this destroys democracy).
      *   *Cousin's Maxim:* "I will not vote *when my probability of influencing the outcome is less than 1 in a billion.*"
      *   If everyone followed *that* maxim, democracy functions fine (because most people's votes *are* negligible, but enough people vote for other reasons). There is no contradiction. The Uncle cannot force the Cousin to accept the broader maxim without begging the question.

  ### 2. The Generalization Argument (Rule Consequentialism)
  This is the most common layperson interpretation. It argues from the badness of the outcome of universalization.

  *   **The Principle:** If the consequences of everyone performing action $X$ would be disastrous, then no one ought to perform $X$, even if one instance is harmless.
  *   **The "What If":** **Counterfactual/Hypothetical.** It asks: "In a possible world where everyone does this, do things go badly?"
  *   **Status:** **Substantive-but-defensible, but logically distinct from the act.** It is a valid argument for establishing *rules*, but a weak argument for individual *acts* in non-ideal conditions.
  *   **Does it prove the Uncle's point?** **No.** This commits the **Fallacy of Composition**.
      *   The argument proves that *a practice* of non-voting is bad. It does not prove that *this specific act* of non-voting is bad, given that the practice is not actually happening.
      *   To get the Uncle's conclusion (you must vote *now*), you need to assume that your act triggers the universalization. But in voting, it doesn't.
  *   **The Clever Cousin's Objection (Empirical Irrelevance):** "You are asking me to optimize for a world that does not exist."
      *   If the disaster only occurs if *everyone* does it, and everyone *won't* do it, then the disaster is off the table. She is not causing the disaster; she is merely joining a minority. The counterfactual antecedent ("everyone does this") is so far removed from reality that the moral weight dissolves.

  ### 3. The Principle of Fairness (Free-Rider Objection)
  This is the strongest philosophical backing for the Uncle's intuition, though it is rarely articulated this way in casual arguments.

  *   **The Principle:** If you benefit from a cooperative scheme that requires sacrifice from participants, you are obligated to contribute your fair share, even if your specific contribution isn't causally necessary for the benefit to continue. (Associated with H.L.A. Hart and John Rawls).
  *   **The "What If":** **Normative Comparison.** It doesn't really ask "what if." It asks: "Are you accepting benefits produced by others' restraint/contribution while exempting yourself?"
  *   **Status:** **Substantive and defensible.** This avoids the empirical problems of the Consequentialist view.
  *   **Does it prove the Uncle's point?** **Yes, conditionally.**
      *   It bypasses the "my vote doesn't matter" claim. It doesn't matter if your vote swings the election; what matters is that you benefit from the legitimacy of the government elected by others. If you stay home, you are free-riding on their civic labor.
  *   **The Clever Cousin's Objection (Non-Excludability):**
      *   "I didn't *ask* for these benefits." In public transit or littering, the benefit is clear. In voting, the result (the President) is a public good; she gets it whether she votes or not.
      *   Furthermore, she can argue: "If the system is so robust that my absence doesn't hurt it, then my 'fair share' is zero." The Principle of Fairness usually requires that the contribution be *necessary* for the scheme's existence. If the scheme survives without her (which it does), is she really a free-rider, or just a non-participant? This is a live debate in political philosophy, so the Uncle doesn't win automatically, but he has a fighting chance here.

  ### 4. The Causal/Expressive Influence (Social Norms)
  This turns the slogan from a thought experiment into a prediction.

  *   **The Principle:** Your behavior is data for others. If you don't vote, you slightly lower the social pressure on your peers to vote. Therefore, your act has a causal multiplier effect.
  *   **The "What If":** **Predictive/Empirical.** It asks: "If you do this, how does it change the probability of others doing it?"
  *   **Status:** **Empirically plausible but magnitude-dependent.** Social contagion is real.
  *   **Does it prove the Uncle's point?** **Yes, but weakly.**
      *   It converts the "one vote" problem into a "one vote + $N$ influenced votes" problem.
      *   However, the causal link is diffuse. Did your cousin's abstention actually cause her neighbor to stay home? Probably not.
  *   **The Clever Cousin's Objection (Negligibility):**
      *   "My influence is statistically vanishing." Even if my not voting discourages 0.05 of a person from voting, the expected utility is still near zero. Unless the cost of voting is also zero, the math doesn't compel her to vote. It just makes the "my vote doesn't matter" claim slightly less absolute.

  ---

  ### What is actually happening at the Thanksgiving table?

  When people reach for "What if everyone did that?" in arguments like yours, they are almost never doing Kant. They are also rarely doing strict Rule Consequentialism.

  **They are usually invoking a muddled hybrid of the Principle of Fairness and a heuristic for Social Norms.**

  1.  **It is a Rhetorical Shortcut:** The slogan is doing very little logical work. It is a "conversation stopper" designed to trigger a guilt response. It relies on the listener intuitively feeling that *being the exception* is morally suspect.
  2.  **The "Platitude" Trap:** For the Uncle, the slogan functions as a platitude: "Don't be a special snowflake." It assumes that if an action is bad in the aggregate, it is bad in the particular. As your cousin correctly identified, this is logically false (the Fallacy of Composition), which is why she felt the argument was "stupid."
  3.  **Why it feels unsatisfying:** The slogan fails because it tries to solve an **instrumental** problem (voting) with a **deontological** sounding rule.
      *   If voting were about *outcomes* (Consequentialism), the cousin is right: her vote is instrumentally useless.
      *   If voting is about *duty* (Fairness/Kant), the Uncle is right: she has an obligation regardless of outcomes.
      *   The slogan tries to bridge these by saying "Your vote matters *because* if everyone thought like you, outcomes would be bad." But as the cousin noted, everyone *doesn't* think like her.

  **Verdict:**
  The slogan is **rhetorically effective but philosophically bankrupt** in this specific context. It collapses under the "Clever Cousin" test because it cannot distinguish between a *universalizable maxim* (Kant) and a *hypothetical disaster* (Consequentialism).

  To actually win the argument, the Uncle needed to abandon the slogan and pivot to the **Principle of Fairness**: *"It's not about whether your vote swings the election. It's about whether you have a right to enjoy the benefits of a democratic system you refused to help sustain."*

  Even then, the Cousin can reply: *"I enjoy the benefits of the air I breathe, but I'm not obligated to photosynthesize."* But at least then they would be having a real argument about political obligation, rather than talking past each other with a broken philosophical tool.
