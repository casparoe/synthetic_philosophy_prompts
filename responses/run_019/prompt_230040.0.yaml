  The crime was done before I was the one,
  Nor bear the weight of my father's name.
  I am not here the father but the son,
  I need not carry forward their old shame.
  For guilt requires an act that one has done,
  No court can hold me to a criminal claim.
  According to this rule, I stand as none,
  I walk away from such a bitter blame.

  But metaphysics binds the living breath,
  In solidarity with human kind.
  A guilt that survives the legal death,
  Leaves traces of the crime within the mind.
  I hold no weapon, yet I share the cost,
  Of being human where the line was crossed.
