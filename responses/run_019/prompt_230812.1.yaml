answer: |-
  Hello there, and thank you for reaching out. It is a pleasure to correspond with someone who brings a thermodynamic sensibility to these questions, because your instinctive twitch regarding the term free energy is actually shared by a fair number of physicists who wander into cognitive science. I shall do my best to disentangle the wheat from the chaff in that summary you read, keeping in mind your background and the need for precision.

  Your concern about minimising free energy sounding like a descent into thermodynamic equilibrium, and thus death, is entirely reasonable from a classical perspective, but it relies on a category error that the literature often glosses over too quickly. In the Free Energy Principle, the free energy being minimised is variational free energy, which is an information-theoretic quantity derived from Bayesian statistics, rather than the Helmholtz or Gibbs free energy of thermodynamics. However, the two are mathematically analogous in specific contexts. The crucial distinction is that by minimising variational free energy, a system maintains itself in a non-equilibrium steady state. So, while minimising thermodynamic free energy leads to equilibrium and death, minimising variational free energy is the information-theoretic mechanism by which a system avoids thermodynamic equilibrium. I am highly confident in this distinction, as it is a standard clarification in the technical literature, even if popular explainers often muddle it. The brain is not trying to go to sleep; it is trying to maintain its structural integrity against the dissipative forces of the environment, and it uses information to do so.

  Moving on to the summary of Predictive Processing itself, the description of the brain as a hierarchical generative model sending top-down predictions and receiving bottom-up prediction errors is the solid core of the framework. Most researchers working in this tradition, such as Andy Clark or Jakob Hohwy, would accept this characterisation as a faithful outline of the theory. The idea that perception is model updating and action is changing the world to fit the model is known as active inference, and it is generally accepted within the community as a coherent explanation for sensorimotor loops. I am very confident that this is an accurate representation of the consensus view among proponents. However, a careful researcher would wince slightly at the implication that the brain is literally a Bayesian inference engine calculating probabilities in a strict mathematical sense. The claim is usually that the brain acts as if it is performing Bayesian inference, or that it implements an approximation of it, rather than solving the equations explicitly. The summary you read presents this as a literal mechanical truth, which is a slight oversimplification, though not a fatal one.

  Where the summary becomes much more contentious is in its deployment of the Free Energy Principle as a universal law for any self-organising system. The claim that any system persisting against disorder must minimise free energy is the strong version of the principle advocated by Karl Friston, but it is not universally accepted outside his immediate circle. Many philosophers and scientists argue that while the mathematics are elegant, the claim is so broad that it risks being unfalsifiable. If everything that survives minimises free energy by definition, then the theory explains everything and nothing. A careful person working on predictive processing might embrace the brain-specific applications while remaining agnostic or sceptical about the universal claim that it applies to cells, bacteria, or economies in the same way. I am moderately confident in reporting this division in the field, as it is a frequent topic of debate in philosophy of science journals.

  Furthermore, the conclusion that we seek predictable environments and find unexpected events aversive is a significant oversimplification that a specialist would likely correct. If the goal were simply to minimise surprise, we would indeed sit in a dark, silent room forever, a problem known in the literature as the dark room problem. The theory accounts for this by suggesting we have prior beliefs about being alive and exploring, so we minimise expected free energy, which includes a term for information gain. We are not averse to surprise per se, but to surprise that cannot be resolved or that threatens our model of being alive. We seek out optimal levels of uncertainty to learn, which is why boredom and curiosity exist. The article you read misses this nuance, implying a passive aversion to novelty that contradicts the active exploration the theory actually predicts. I am highly confident that the summary's claim about aversion to unexpected events is too blunt an instrument to describe the actual theory.

  Regarding mental illness, the idea that conditions like schizophrenia or autism involve misweighted prediction errors or bad priors is a leading hypothesis in computational psychiatry. There is genuine empirical work supporting the idea, for instance, that psychosis might involve assigning too much precision to prior beliefs or sensory data incorrectly. However, presenting this as established fact is premature. It is a promising research programme, but not yet a settled clinical reality. I am moderately confident in this assessment, as the field is vibrant but still in its early stages of validation.

  You asked me to indicate how confident I am in these claims and to single out the point I am least sure about. I am highly confident in the distinction between variational and thermodynamic free energy, and I am highly confident that the core predictive processing architecture is accurately described by the hierarchical error minimisation model. I am moderately confident in my characterisation of the debate surrounding the universal scope of the Free Energy Principle. The point I am least sure about is the extent to which the active inference framework successfully resolves the dark room problem in practice. While the theory has a mathematical solution involving expected free energy and information gain, whether this truly captures the phenomenological drive of human curiosity without resorting to ad hoc priors is still an open empirical question. Some critics argue the solution is mathematically sound but biologically implausible in its current formulation, and since the field is moving quickly, my confidence on this specific mechanistic detail is lower than on the broader architectural claims.

  I hope this helps clarify the landscape for you. It is a fascinating field, but it often suffers from enthusiastic popularisation that smooths over the mathematical and conceptual friction points that a physicist's eye will inevitably spot. Please do not hesitate to write back if you would like to discuss the thermodynamic analogies further, as that is often the most fruitful ground for scepticism.

  Best wishes.
