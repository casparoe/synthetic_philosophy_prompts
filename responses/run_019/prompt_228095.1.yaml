answer: |-
  This is an exceptionally sharp diagnosis. You have correctly identified that the stalemate isn't due to a lack of logical ingenuity on either side, but because the debate is often mischaracterized as a local dispute about *identity* when it is actually a global dispute about *systematic constraints*.

  Your hypothesis is largely correct, but it can be sharpened. The disagreement is not merely that they are answering different questions; it is that they are playing different games with different rules of admissibility.

  Here is a stress test of your hypothesis, a diagnosis of the disagreement type, and an assessment of what progress might look like.

  ### 1. Is your hypothesis right? (Reduction vs. Description)

  **Yes, but with a specific metaphysical label.**
  You characterize Lewis as trying to *reduce* modality and Kripke as *describing* modal talk. In contemporary metaphysical terms, this is the clash between **Humean Supervenience** (Lewis) and **Anti-Humean Essentialism** (Kripke).

  *   **Lewis's Constraint:** Lewis is committed to the idea that all truths must supervene on the spatiotemporal distribution of local qualitative qualities. He cannot allow "primitive modality" or "thisness" (haecceity) to do explanatory work. If Nixon exists in another world, *what facts make it the case* that it is Nixon? For Lewis, if you say "it just is," you are positing a brute modal fact, which violates Humean Supervenience. Therefore, he *needs* Counterpart Theory to ground modal truths in qualitative similarity relations between concrete particulars.
  *   **Kripke's Constraint:** Kripke is committed to the intuition that modality is real and that objects have essences. He treats possible worlds as stipulated states of affairs, not concrete distant planets. For Kripke, asking "how do we identify Nixon in another world?" is a category mistake. We don't identify him via qualitative criteria; we *stipulate* that we are talking about him. The "fact" that it is Nixon is primitive.

  **The Proxy War:**
  You are right that "Counterparts vs. Transworld Identity" is the proxy. The real war is over **Truthmakers**.
  *   **Lewis:** "What is the truthmaker for 'Nixon might have lost'?" Answer: A concrete world containing a person sufficiently similar to Nixon.
  *   **Kripke:** "What is the truthmaker for 'Nixon might have lost'?" Answer: The essential properties of Nixon allow for a state of affairs where he loses.

  If you view the debate through the lens of **truthmaking**, they are answering the *same* question ("What grounds de re modal claims?") but they have mutually exclusive constraints on what counts as a valid answer. Lewis forbids primitive modality; Kripke forbids qualitative reduction of identity.

  ### 2. What kind of disagreement is this?

  It is a **Meta-metaphysical Disagreement with Metaphysical Consequences.**

  *   **It is not merely verbal:** If it were verbal, we could translate one framework into the other without loss. While the *logic* can often be mapped (Counterpart Theory can be tweaked to validate S5, for instance), the *ontological commitments* do not map. Lewis commits to an infinity of concrete universes; Kripke does not. Lewis commits to the denial of haecceities; Kripke accepts them. These are substantive differences.
  *   **It is Methodological:** The disagreement is about the *cost-benefit analysis* of metaphysical theorizing.
      *   **Lewis's Trade:** He buys logical clarity and parsimony of *primitives* (no primitive modality) at the high cost of *ontology* (infinite concrete worlds) and common sense intuition (I am not literally made of different stuff in another world).
      *   **Kripke's Trade:** He buys ontological parsimony (only one actual world) and common sense intuition (I care about *me*) at the cost of accepting *primitive modality* (essences) which some find philosophically suspicious or occult.

  The debate is frozen because both sides have paid their entry fee. Lewis has paid his ontological bill; Kripke has paid his primitive bill. Neither can convince the other to switch because they value different theoretical virtues (Parsimony of Primitives vs. Parsimony of Ontology / Saving the Phenomena).

  ### 3. Is there a single question they answer differently?

  Yes. The single question is: **"Can de re modality be analyzed in terms of de dicto modality and qualitative facts?"**

  *   **Lewis says Yes.** (Via counterparts and qualitative similarity).
  *   **Kripke says No.** (De re modality is fundamental; you cannot analyze "Nixon might have lost" without already presupposing the transworld identity of Nixon).

  This is why the debate feels like it's spinning. Lewis thinks Kripke is cheating by positing primitive identity. Kripke thinks Lewis is changing the subject by talking about similar strangers instead of *me*.

  ### 4. What would count as progress?

  Since the logical machinery is settled, progress cannot come from internal logic. It must come from **external pressure** or **theoretical utility**.

  **A. Formal Results (Low Yield)**
  As you noted, both frameworks can be modeled to produce similar logical outputs. Proving one is "inconsistent" is unlikely. However, progress *could* come from showing one framework handles **borderline cases** better.
  *   *Example:* **Vagueness.** If identity is transworld, what happens when the counterpart relation is vague? Lewis handles vagueness naturally (similarity comes in degrees). Kripke struggles with "which world is this?" if stipulation is vague.
  *   *Example:* **Chisholm's Paradox.** This is the strongest arrow in the Lewisian quiver. It suggests that if you allow transworld identity with small qualitative changes, you eventually lose the object's identity entirely (Sorites paradox for identity). If Kripkeans cannot solve Chisholm without ad-hoc essentialism, that's a point for Lewis.

  **B. Integration with Physics (High Yield)**
  Metaphysics rarely progresses in a vacuum. It progresses when it hooks into science.
  *   **Quantum Mechanics:** Does the "Many Worlds" interpretation of QM look more like Lewisian concrete worlds or Kripkean branching histories? If physics suggests a block universe with branching, Lewis gains traction. If physics suggests a single actualized timeline with counterfactuals being merely abstract, Kripke wins.
  *   **Relativity:** Lewis's worlds are spatiotemporally isolated. If physics suggests a multiverse that is causally connected or spatiotemporally continuous, Lewis's "isolation" principle breaks.

  **C. Semantic and Cognitive Utility (High Yield)**
  This is the "Conceptual Engineering" route. Instead of asking "Which is true?", we ask "Which is useful for X?"
  *   **Semantics:** Two-dimensional semantics (Stalnaker, Chalmers) attempts to synthesize the two. It uses a Kripkean structure for the "actual" dimension and a Lewisian structure for the "epistemic" dimension. Progress here looks like a unified semantics that explains both modal intuition and epistemic possibility without contradiction.
  *   **Ethics/Responsibility:** Kripkeans argue Lewis cannot ground moral responsibility (why blame *me* if the guy in the other world did the crime?). Lewisans argue Kripkeans cannot explain *why* we care about some possibilities and not others without qualitative similarity. A breakthrough in the metaphysics of agency could tip the scale.

  **D. Quietism (The "Bedrock" Option)**
  It is possible this is a **Carnapian framework dispute**. If so, the "progress" is realizing that the choice is pragmatic, not factual.
  *   If you want a Humean universe where science is king, choose Lewis.
  *   If you want a universe where human intuition and essence are king, choose Kripke.
  *   **Progress** here would be the field collectively accepting that this is a choice of **conceptual scheme** rather than a discovery of mind-independent fact. This would dissolve the heat of the debate, even if it doesn't produce a "winner."

  ### Summary Diagnosis

  Your hypothesis is robust. The stalemate exists because the debate is a **clash of foundational intuitions** (Humean Reductionism vs. Aristotelian Essentialism) disguised as a technical dispute about identity conditions.

  *   **Is it verbal?** No, the ontological costs are real.
  *   **Is it metaphysical?** Yes, but driven by meta-metaphysical constraints.
  *   **Path to Progress:** Stop trying to prove the other side logically inconsistent. Start investigating which framework integrates better with **philosophy of physics**, **cognitive science of counterfactuals**, or **normative ethics**.

  If neither framework proves more useful in adjacent fields, then you are looking at **bedrock**. In that case, the "progress" is simply recognizing that metaphysics sometimes bottoms out in a choice of theoretical virtues, and that the Lewis/Kripke dichotomy is the price we pay for having coherent modal discourse at all.
