answer: |-
  There is no single, canonical noun in organizational sociology or management theory that perfectly captures this specific configuration. However, it is a recognized pathological state.

  If I must commit to a label, I will coin the term **"Compensatory Rigidity."**

  Here is the defense of that coinage, why existing frameworks fail to capture it, and an analysis of its stability.

  ### 1. Why Existing Concepts Fail
  You correctly identified that **Tight-Loose Theory** (Michele Gelfand) is the nearest established framework, but it is insufficient. Tight-Loose theory maps cultures on two axes: *strength of social norms* and *strength of sanctioning*.
  *   **Tight:** Strong norms, strong sanctions.
  *   **Loose:** Weak norms, weak sanctions.

  Your phenomenon is **Weak Norms** (everyone ignores the dress code/parking) paired with **Strong Sanctions** (zero tolerance on the few remaining rules). In the Tight-Loose matrix, this is a "ghost quadrant." It is not "Tight" because the normative consensus has collapsed; people don't follow the rules because they believe in them, they avoid the *one* rule because they fear the trap. It is not "Loose" because the threat of violence (firing, expulsion) is hyper-active.

  **Broken Windows Theory** is the inverse of this. Broken Windows argues that enforcing *small* rules prevents *big* violations. Your phenomenon is ignoring small violations while savagely punishing big ones.

  **Bureaucratic Ritualism** (Robert Merton) is close, as it describes following rules for rules' sake. However, Ritualism implies a consistent, plodding adherence to procedure. Your description is *selective* and *explosive*. It is not ritualistic; it is reactive.

  ### 2. Defining "Compensatory Rigidity"
  I propose **Compensatory Rigidity** because it identifies the *mechanism* driving the behavior, not just the symptom.

  *   **The Mechanism:** It is grounded in **Compensatory Control Theory** (Whitson & Galinsky). When individuals or institutions perceive a loss of control in one domain, they seek to assert control in another domain to reduce anxiety and maintain the *appearance* of order.
  *   **The Definition:** An institutional state where general normative compliance has decayed, leading leadership to concentrate enforcement resources on a shrinking set of "bright-line" rules. The severity of punishment for these remaining rules is inflated to compensate for the loss of authority elsewhere.
  *   **The Boundary Cases:**
      *   *Vs. Strategic Enforcement:* In strategic enforcement, an institution ignores minor infractions to focus resources on high-risk safety issues (e.g., a hospital ignoring tie color but punishing hand-washing violations). This is rational. In Compensatory Rigidity, the punished rules are often arbitrary or symbolic (e.g., firing a teacher for a syllabus typo while ignoring chronic absenteeism). The severity is disproportionate to the risk.
      *   *Vs. Tyranny:* A tyrannical culture enforces *everything* harshly. Compensatory Rigidity enforces *nothing* harshly except a few specific targets. It relies on unpredictability and asymmetry.

  ### 3. Is It a Stable Equilibrium?
  **No. It is a transitional mess on the way to institutional decay.**

  Compensatory Rigidity is a **death spiral signal**. Here is the lifecycle:
  1.  **Legitimacy Loss:** The institution loses moral authority (e.g., leadership scandal, budget cuts, mission drift).
  2.  **Norm Erosion:** Staff/Students stop following "soft" rules because they no longer respect the entity.
  3.  **Panic Response:** Leadership notices the erosion. Unable to rebuild trust (which is slow), they clamp down on "hard" rules (which is fast).
  4.  **Compensatory Rigidity:** They enforce the hard rules savagely to signal, "We are still in charge."
  5.  **Accelerated Collapse:** This creates resentment. The remaining compliant people leave (they feel the environment is unjust), and the non-compliant people become more adversarial. The institution loses its human capital and becomes purely coercive.
  6.  **Terminal Looseness:** Eventually, the institution lacks the manpower or will to enforce even the bright-line rules. It collapses into total anarchy or is shut down/restructured.

  ### 4. Why This Name Matters
  Calling it **Compensatory Rigidity** distinguishes it from a "Tight Culture."
  *   In a **Tight Culture** (e.g., a nuclear submarine, a surgical team), rule-following is high because everyone shares a high-stakes goal. The severity is understood as necessary for safety/mission.
  *   In **Compensatory Rigidity**, rule-following is low. The severity is understood as an assertion of power.

  If you are in an institution and you see the parking lot full of violators but the HR department firing people for being three minutes late, you are not in a "strict" workplace. You are in a state of **Compensatory Rigidity**. It tells you the institution feels out of control, and it is prioritizing the *performance* of authority over the *function* of the organization. It is a leading indicator that the institution is in decline.
