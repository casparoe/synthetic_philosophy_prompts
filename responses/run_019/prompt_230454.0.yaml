      *   Implication: The underlying structure remains stable; the surface features change. It's combinatorial and iterative.
      *   Limitation: It can imply a certain mechanical detachment. Is *moral* growth just a knob? Is *love* just a parameter shift?

  3.  **Deconstruct *Groundhog Day*:**
