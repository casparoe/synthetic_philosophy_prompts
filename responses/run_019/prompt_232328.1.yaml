      *   *Side A (Acquaintance Principle):* Aesthetic judgment requires direct experience. Testimony gives belief, not aesthetic justification. (Kantian echoes, Hopkins, etc.)
      *   *Side B (Testimony Permissivists):* Aesthetic judgment is like any other judgment. We trust experts in science/law; why not art? Denying this is mysticism/elitism. (Lackey, Coady, etc.)
