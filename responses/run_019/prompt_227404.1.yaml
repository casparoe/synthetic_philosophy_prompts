answer: |-
  ### 1. Exam Question

  **Question 3 (20 Marks)**

  **Case:** Mira grows up in an isolated community that drills into her from childhood that loyalty to the group trumps everything, including honesty toward outsiders. At age 25, after exposure to outside ideas, she steps back, deliberates seriously, knows she could walk away, and reflectively endorses the loyalty principle as genuinely her own. She then lies to an outsider, in service of the group, in a way that causes real harm.

  **Prompt:** Galen Strawson's Basic Argument claims that moral responsibility is impossible regardless of whether determinism is true. Using the case of Mira above, write an essay that addresses the following four points:

  1.  **Formulation:** State the Basic Argument precisely. Ensure you explain the *causa sui* (cause of itself) requirement and why it is necessary for ultimate moral responsibility. (5 marks)
  2.  **Application:** Apply the argument to Mira's reflective endorsement at age 25. Does her deliberate choice to accept her upbringing stop the regress of responsibility? Explain why or why not using Strawson's reasoning. (5 marks)
  3.  **Indeterminism:** Suppose Mira's decision was not determined but involved an indeterministic break. Explain why Strawson argues this fails to secure responsibility for her action. (5 marks)
  4.  **Implications:** If Mira is not responsible, what follows for an ordinary agent with a non-manipulative upbringing? Briefly discuss the objection that this argument proves "too much" by eliminating epistemic responsibility (responsibility for one's beliefs), and state whether this should be viewed as a *reductio ad absurdum* or a bullet Strawson must bite. (5 marks)

  ***

  ### 2. Model Answer (Strong Candidate)

  Galen Strawson's Basic Argument aims to show that moral responsibility is impossible, not because of determinism, but because of the structural requirements of responsibility itself. The argument can be formulated as follows: (1) To be truly morally responsible for one's actions, one must be truly responsible for the way one is (at least in certain mental respects). (2) To be truly responsible for the way one is, one must have brought it about that one is that way. (3) One cannot bring it about that one is a certain way unless one acts to do so. (4) To act to make oneself a certain way, one must already have a specific nature (reasons, preferences, character) that guides that action. (5) Therefore, to be responsible for the way one is, one must already be responsible for the nature that guided the change. This leads to an infinite regress. To stop the regress, an agent would need to be a *causa sui*—a cause of themselves. Since nothing can be a *causa sui*, no one is ultimately morally responsible.

  Applying this to Mira, her reflective endorsement at age 25 does not stop the regress. A compatibilist might argue that because Mira critically examined her values and endorsed them, she owns them. However, Strawson argues that the *way* Mira deliberates is itself determined by how she already is. When Mira steps back to evaluate her loyalty principle, she does so using reasons, standards of evaluation, and a character structure she did not choose. Perhaps she values coherence, or she fears isolation, or she finds the outside arguments unpersuasive due to her cognitive makeup. Whatever reasons motivate her endorsement are products of her existing mental nature. If she is not responsible for that existing nature (which she isn't, having been raised in the isolated community), she cannot be responsible for the endorsement that flows from it. Her choice is just "more of how she is." To be responsible for the endorsement, she would have needed to choose the reasons that led to the endorsement, which requires a prior choice, ad infinitum.

  Suppose we grant that Mira's decision was not determined by her past character but involved an indeterministic break. Strawson argues this does not rescue responsibility. If the choice is undetermined, it is not fully explained by Mira's reasons or character; it involves an element of chance or randomness. If the choice to endorse loyalty is random, it is not *hers* in the control-required sense. She cannot claim credit for a random occurrence any more than she can for a determined one. Indeterminism might break the causal chain of the past, but it does not provide the agent with the control necessary to be the *causa sui*. It simply replaces determination with luck, and luck is no foundation for moral responsibility.

  If Mira is not responsible, the implication for the ordinary agent is that they are not responsible either. Mira's upbringing looks manipulative, which tempts us to excuse her while holding ordinary agents accountable. But Strawson insists there is no responsibility-relevant difference. Ordinary agents are also products of genetics and environment they did not choose. They also deliberate based on natures they did not create. If Mira fails the *causa sui* test, so does everyone.

  Critics object that this proves too much. If we aren't responsible for our actions, we arguably aren't responsible for our beliefs (epistemic responsibility), since beliefs are also formed by cognitive processes we didn't choose. If we aren't responsible for our beliefs, rational persuasion becomes impossible, as no one is responsible for accepting an argument. Some critics claim this is a *reductio ad absurdum* of the Basic Argument, showing it must be false because epistemic responsibility is undeniable. However, a consistent Strawsonian must bite the bullet. Strawson acknowledges this implication, suggesting that while we cannot have *ultimate* moral responsibility, we can still have practical reasons to modify behavior. The strong candidate should recognize that while the epistemic objection highlights the radical cost of the view, Strawson accepts the cost rather than abandoning the argument. Thus, the verdict is that Mira is not responsible, but neither is anyone else.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Passing Threshold:** 10/20 (Competent grasp of the argument's structure and application)

  **Five Must-Hit Points (4 marks each)**

  1.  **Precise Formulation (Causa Sui):**
      *   *Full Marks:* Clearly articulates the regress: to be responsible for actions, one must be responsible for the nature that produced them. Explicitly identifies the need to be *causa sui* to stop the regress.
      *   *Mediocre Fumble:* Describes it vaguely as "everything has a cause" or conflates it with simple determinism without mentioning the requirement to be responsible for *how one is*.
  2.  **Reflective Endorsement (The Regress):**
      *   *Full Marks:* Explains that Mira's endorsement is produced by reasons/character she did not choose. The choice is "more of how she is," so the regress continues.
      *   *Mediocre Fumble:* Assumes that because she "could walk away" or "deliberated," she is automatically responsible (compatibilist intuition) without addressing Strawson's regress objection.
  3.  **Indeterminism (Luck/Chance):**
      *   *Full Marks:* Explains that indeterminism introduces randomness/luck rather than control. Randomness does not make the action "hers" in the required sense.
      *   *Mediocre Fumble:* Suggests indeterminism *helps* Mira because it breaks the chain of the past, failing to see Strawson's point that luck undermines control just as much as determination.
  4.  **Ordinary Agent Comparison:**
      *   *Full Marks:* Argues there is no responsibility-relevant difference between Mira (manipulated/isolated) and ordinary agents (genetics/environment). If Mira fails, all fail.
      *   *Mediocre Fumble:* Treats Mira as a special case of "brainwashing" while implying ordinary agents might still pass the test because their upbringing wasn't "isolated."
  5.  **Epistemic Objection & Verdict:**
      *   *Full Marks:* Identifies the objection (eliminates responsibility for beliefs/persuasion). Correctly identifies Strawson's stance (biting the bullet) or offers a nuanced view on *reductio*. Gives a clear verdict (Mira is not responsible).
      *   *Mediocre Fumble:* Ignores the epistemic angle entirely or claims the objection definitively refutes Strawson without acknowledging his response.

  **Automatic Deductions (Apply in addition to above)**

  *   **Determinism Confusion (-5 marks total):** Treating the Basic Argument as an argument *against compatibilism* specifically, or assuming the argument relies on the truth of determinism. (The Basic Argument is intended to work regardless of determinism).
  *   **PAP Reliance (-5 marks total):** Arguing Mira *is* responsible simply because "she could have done otherwise" or "she had alternatives," without addressing the *causa sui* requirement.
  *   **Word Count/Time Management:** Significantly under 600 words (suggests lack of depth) or significantly over 1200 words (suggests poor planning). Discretionary deduction up to 2 marks.

  **Note on Point 5:** I retained the Epistemic Objection as a must-hit point because the prompt specifically requested it. It distinguishes strong readers (who know Strawson's replies/implications) from those who only know the core regress. It tests whether they understand the *scope* of the impossibility claim.
