      *   *Fanaticism/Pascal's Mugging:* Does this lead to absurd prioritization (e.g., preventing hydrogen fusion everywhere)? How to discount?
      *   *Policy Implications:* If panpsychism is true, does it change how we build AI? How we treat animals? How we manage energy grids?
      *   *Measurement:* Can we build a "valenceometer" for non-biological systems?
      *   *Metaphysics of Death:* If panpsychism is true, does death matter less (since the stuff persists) or more (since integration is lost)?
      *   *Normative Weight:* Does a micro-experience have $1/n$ weight of a human experience? Or is there a threshold?

  3.  **Winnowing and Selecting Criteria:**
      *   *Constraint:* 6 person-years is small. We can't solve the Hard Problem. We need *action-guiding* results for a foundation.
      *   *Criterion 1: Upstreamness.* Does answering this unlock other answers?
