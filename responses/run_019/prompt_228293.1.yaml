          *   *Decision:* Keep as a sub-point of Physical Correlates.

  5.  **Selecting and Ranking the Top 3-5:**

      *   *Rank 1: The Moral Aggregation Function (The "Swamping" Check).* This is the most upstream. If micro-experiences don't aggregate morally, the rest doesn't matter. It's tractable for philosophers.
      *   *Rank 2: Valence Conditions at the Fundamental Level.* If micro-experiences exist but lack valence (are neutral), the moral urgency drops. This is the second most upstream.
      *   *Rank 3: High-Stakes Physical Correlates.* This is the most action-guiding. Even if 1 & 2 are unresolved, knowing *where* to look helps. Good for the physics-trained researchers.
      *   *Rank 4: Decision-Theoretic Robustness.* Important for the foundation's strategy, but downstream of the metaphysics.

      *   *Wait, let's re-evaluate based on "6 person-years".*
