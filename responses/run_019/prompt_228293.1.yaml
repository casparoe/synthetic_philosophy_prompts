      *   **Goal:** A research agenda *conditional* on panpsychism being a live possibility (not proving it true/false).
      *   **Role:** Professional philosopher working on consciousness and population ethics, sympathetic but not credulous about longtermist reasoning.
      *   **Deliverable:** Defended agenda (ranked top 3-5 questions), justified by specific criteria (upstreamness, tractability, neglectedness, impact on allocation). Include "move up/down" triggers and "avoid funding" flags.
