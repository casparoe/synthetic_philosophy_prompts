          4.  Where is the line between useful caution and stagnation?

  2.  **Identify the Core Concept:**
      *   The immediate association is **Chesterton's Fence**. This is the most direct fit. G.K. Chesterton's parable is exactly about not removing a fence until you know why it was put up.
      *   Secondary associations: **Burkean Conservatism** (prescription, prejudice), **Status Quo Bias** (psychological), **Via Negativa** (Taleb), **Institutional Memory/Path Dependence** (sociological/economic).
      *   The specific logical structure involves **Burden of Proof** and **Epistemic Humility**.

  3.  **Evaluate "Chesterton's Fence":**
      *   *Does it fit?* Yes, perfectly. It captures the "don't remove until you understand the origin" aspect.
      *   *Does it cover both claims?* Yes. It implies the fence is there for a reason (epistemic) and therefore the burden is on the remover to prove it's safe to remove (burden of proof).
      *   *Is it a cluster?* It's often treated as a single heuristic, but it relies on underlying assumptions about complexity and unintended consequences.

  4.  **Evaluate Other Concepts:**
      *   *Burkean Conservatism:* Fits the philosophy, but the user notes non-conservatives use it. "Chesterton's Fence" is more specific to the *argumentative move* rather than the political ideology.
      *   *Status Quo Bias:* This describes the *psychological tendency*, not necessarily the *argument*. The user is asking about the rhetorical move.
      *   *The Precautionary Principle:* Related, but usually applies to harm/risk (e.g., environmental), not necessarily institutional inertia.
      *   *Via Negativa:* Nassim Taleb's concept. Related to removing things to improve, but he actually advocates *for* removing fragile things. However, he respects Chesterton's Fence.
      *   *Path Dependence:* Explains *why* the thing is there, but not necessarily the normative argument against removing it.

  5.  **Address the "One Argument or Cluster" Question:**
      *   It is a cluster. It combines:
          1.  **Teleological Assumption:** Institutions/rules are created for a purpose (even if forgotten).
          2.  **Epistemic Humility:** Current observers lack the context of the creators.
          3.  **Risk Asymmetry:** The cost of removal (unknown catastrophe) often outweighs the cost of retention (known inefficiency).
          4.  **Procedural Burden:** The reformer must investigate before acting.

  6.  **Address the "Where does it stop being useful?" Question:**
