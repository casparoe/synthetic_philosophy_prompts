      *   **The Pattern:**
          1.  Reformer: "Let's get rid of X; it does nothing useful."
          2.  Defender: "Do you know *why* it's there? If you can't explain its original purpose, you can't claim it has no purpose. You haven't earned the right to remove it."
          3.  Note: The defender doesn't necessarily defend X on merits, but shifts the burden of proof to the reformer to understand X's history/function first.
      *   **Observations:** Used by Burkeans, engineers, left-leaning journalists. Not purely ideological.
      *   **Questions:**
          1.  Is there an established name for this move?
          2.  Is it one argument or a cluster?
