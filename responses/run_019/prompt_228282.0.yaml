  **Verdict: The episode vindicates Searle’s theory, specifically by illustrating the dependency of institutional facts on brute physical substrates.**

  India’s 2016 demonetization does not expose a gap in John Searle’s account of institutional reality; rather, it serves as a stark, real-world validation of his core distinction between **status functions** and **brute facts**, while clarifying the hierarchical nature of "collective acceptance." The chaos that followed the announcement was not a failure of the theory, but a predictable consequence of altering an institutional fact without immediately securing the brute facts required to sustain it.

  ### Mapping the Episode to Searle’s Framework

  To see why this vindicates Searle, we must map the specific elements of the episode to his ontology:

  1.  **$X$ counts as $Y$ in $C$:** The physical paper notes ($X$) counted as legal tender ($Y$) in the context of the Indian economy ($C$). This was not due to the chemical composition of the paper, but due to an imposed **status function**.
  2.  **Status Function Declaration:** On November 8, the Prime Minister performed a speech act that altered the constitutive rule. The declaration was not a description of reality but an *creation* of a new one: "These notes no longer count as $Y$."
  3.  **Collective Acceptance:** For Searle, institutional facts exist only because of collective intentionality ("we-intentions"). In a modern state, this acceptance is **stratified**. The Reserve Bank of India and the Government hold the authority to issue Status Function Declarations *on behalf of* the collective. When they declare a note void, the "collective" (shopkeepers, banks, citizens) must update their acceptance to align with the authority, or the institution fractures.
  4.  **Deontic Powers:** The status of "legal tender" carries deontic powers (rights and obligations). Before midnight, a shopkeeper had the *right* to demand these notes for debt; after midnight, that right vanished. The notes lost their **validity** instantly, regardless of their **utility**.

  ### Who Accepts? The Hierarchy of Intentionality

  Your question asks who exactly has to accept the notes for them to be money. Searle’s framework, illuminated by demonetization, reveals that acceptance is not a flat consensus among equals. It is hierarchical:

  *   **The State/Central Bank:** They hold the **constitutive authority**. Their acceptance is *performative*; their declaration *makes* the money (or unmakes it).
  *   **Commercial Banks:** They are the **enforcers** of the status function. They operationalize the State’s declaration by accepting deposits or refusing old notes.
  *   **The Public (Shopkeepers, Borrowers, Citizens):** They are the **sustainers**. Their acceptance is *recognitive*. They must recognize the State’s declaration for the system to function without collapse.

  For the notes to be money, the State must assign the status, and the Public must recognize that assignment. Demonetization shows that the State can unilaterally *withdraw* the status, forcing the Public to update their recognition. The fact that the public complied (standing in queues to deposit worthless paper) proves the reality of the institutional fact. If money were merely a practical tool based on utility, people would have continued trading the old notes informally without fear. They did not, because they accepted the **deontic power** of the State to define value.

  ### What Changed at Midnight?

  Searle helps us disentangle what shifted at midnight. It was not the physical notes (brute facts), nor was it immediately their purchasing power (which lagged due to cash shortages). What changed instantly was their **ontological status as legal tender**.

  *   **Legal Status:** Changed immediately by declaration.
  *   **Identity as Money:** Changed immediately (they became "demonetized notes," a different status function).
  *   **Practical Usability/Purchasing Power:** Changed gradually, constrained by the availability of new notes (brute facts).

  This distinction vindicates Searle’s claim that institutional facts are distinct from brute facts but rely on them. The government could change the *institution* (status) by speech, but they could not change the *physics* (printing and distributing new currency) by speech. The resulting cash crunch was the friction between the new institutional reality and the lagging brute reality. Searle predicts this: institutional facts are not magic; they require a physical substrate to function.

  ### The Complication: Declaration vs. Transition

  You ask whether the government's inability to declare a "smooth transition" shows Searle puts too much weight on official status. It does not. It illustrates Searle’s point that **institutional facts are powerfully real but physically constrained.**

  The State successfully destroyed the old money (institutional fact) but struggled to instantiate the new money (institutional fact + brute substrate) quickly enough. This does not weaken Searle’s account; it highlights the **Background** capacities and physical logistics required to maintain institutional reality. The "smoothness" of a transition is a matter of logistical capacity, not ontological validity. The notes *were* worthless the moment the declaration was made, even if people suffered to realize that value in new forms. The suffering confirms the power of the status function: people endured physical hardship because they accepted the institutional reality that the old paper was now void.

  ### The Single Threatening Feature: The Black Market

  The single feature of the episode that most threatens this reading is the **persistence of the old notes in the black market.**

  For several weeks after demonetization, old 500- and 1000-rupee notes continued to circulate informally, often at a discount (e.g., exchanging 1000 old rupees for 800 new rupees). This presents a challenge to Searle’s binary of "counts as" or "does not count as."

  *   **Why it threatens the verdict:** If the State’s Status Function Declaration is supreme, the notes should have ceased to be money entirely. The fact that they retained *some* monetary function (medium of exchange) based on a different form of collective acceptance (between private actors, excluding the State) suggests that "money" is not a single status function imposed from above, but a fragmented set of practices that can diverge from official declarations. It implies that "Collective Acceptance" is not unified; the "Collective" can fracture into sub-groups with conflicting status assignments.

  *   **Why the verdict holds despite this:** Searle acknowledges that institutional facts can be violated (e.g., counterfeiting, illegal contracts). The black market trade was risky, discounted, and illegal. It did not carry the full **deontic powers** of legal tender (you could not sue to enforce a black market debt, nor pay taxes with it). Therefore, the *official* status function held primacy. The black market was a parasitic institution, not a rival sovereignty. The eventual re-absorption of 99% of the demonetized notes into the banking system confirms that the State’s Status Function Declaration ultimately dictated the ontological reality of the currency.

  ### Conclusion

  Demonetization vindicates Searle because it demonstrates that **money is fundamentally a status function, not a physical object.** The government proved that a speech act could strip value from paper instantly. The subsequent chaos proved that while status functions are ontologically objective (within the system), they are pragmatically dependent on brute logistics. The episode confirms that institutional reality is real enough to cause suffering when it clashes with physical constraints, which is precisely what Searle’s theory of social ontology predicts.
