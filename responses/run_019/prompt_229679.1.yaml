  # The Catalog

  **Cogito Supply Co. — Professional Methodological Hardware**
  **Fall Catalogue Vol. 42**

  Welcome to Cogito Supply. We provide durable tools for the working philosopher. Our Intuition Pump™ series is designed to streamline argumentation by bypassing cumbersome discursive reasoning. Each unit is factory-calibrated to produce high-yield phenomenological results with minimal operator effort. We pride ourselves on engineering scenarios that resist re-description. All models feature our patented Neutral Invitation™ casing, which presents loaded assumptions as open questions. Our devices ensure that crucial ambiguities remain hidden inside the casing where customers cannot tamper with them.

  **Model T-5 Utility Trolley**
  The gold standard for normative ethics instruction. This heavy-duty runaway chassis features a proprietary track-switching mechanism. Five distinct track-bound entities come pre-positioned for maximum emotional resonance; the single bystander is sold separately to ensure modularity. The casing hides all morally irrelevant contextual details, ensuring the operator cannot tamper with the scenario's purity via extraneous narrative. Users report that the binary choice mechanism locks firmly into place, resisting attempts to introduce third options like "jamming the brakes" or "questioning the setup." The vividness dial is set to maximum to override complex consequentialist calculations.
  *Specs: Steel construction, irreversible momentum, pre-loaded utilitarian calculus.*

  **The Searle Chinese Room Module**
  Designed for philosophy of mind seminars. This isolated booth includes a comprehensive rulebook and slip slots for input/output characters. The Module is engineered to make understanding feel impossible from the inside. We have welded the windows shut to prevent operators from viewing the system as a whole, effectively blocking the "System Reply" before it begins. The interior is soundproofed to ensure no semantic content leaks in. Ideal for demonstrating that syntax manipulation is insufficient for semantics, regardless of external behavioral evidence. The door locks from the outside to maintain the first-person perspective limitation.
  *Specs: Soundproofed, windowless, rulebook included (English only).*

  **Mary's Monochrome Chamber**
  A complete sensory deprivation unit for epistemology and color physics. The chamber filters all wavelengths except grayscale. Upon exit, the subject is presented with a red tomato. The unit is guaranteed to produce a distinct "aha" sensation regarding non-physical properties. We have removed all physicalist counter-measures, such as ability hypotheses or representationalist goggles, from the packaging. The surprise element is factory-sealed to ensure the knowledge gain feels substantive rather than propositional. The lighting rig ensures the color red appears metaphysically distinct from wavelength data.
  *Specs: Full-spectrum filter, exit protocol included, qualia sensor not included.*

  **Nozick Experience Tank**
  The ultimate tool for value theory. This immersion tank simulates a perfect life while leaving the user physically floating in a lab. The control panel features a "Disconnect" switch that is deliberately difficult to reach. Marketing studies show users instinctively reject the simulation when reminded they are in a tank. We have hardwired this revulsion into the interface. The tank comes with a pre-loaded conclusion that reality possesses intrinsic value beyond subjective satisfaction. Users cannot adjust the hedonic output without compromising the reality tether.
  *Specs: Neurochemical interface, reality tether, intrinsic value indicator.*

  **Accessories & Testimonials**
  *   **Violinist Plug-Kit:** Compatible with all bodily autonomy scenarios. Features a quick-release mechanism that can be stuck or loosened depending on desired trimester analogies. Includes spare kidneys.
  *   **Ambiguity Tightening Kit:** Includes hex keys for adjusting scenario vagueness until the desired intuition pops out. Essential for peer review preparation.
  *   **Spare Runaway Trolleys:** For when your original scenario loses momentum.
  *   *"Before Cogito, my students argued. Now, they just nod. The pre-loaded conclusions save hours of seminar time." — Dr. H. P. Grice, Dept. of Linguistics.*

  All units ship with the conclusion already loaded and merely await the customer's ratification as "their own judgment." One-year warranty against conflicting intuitions. Satisfaction guaranteed or your intuitions refunded.

  # Shop Notes

  **Product Criticisms Encoded:**
  *   **Trolley:** Criticizes the isolation of variables; by stripping context (who is on the track?), the experiment forces a binary choice that ignores real-world moral complexity.
  *   **Chinese Room:** Encodes the complaint that the setup begs the question against functionalism by restricting the perspective to the homunculus, ignoring the system level.
  *   **Mary:** Targets the assumption that phenomenal knowledge is factual knowledge; the "surprise" is engineered to refute physicalism by stipulation.
  *   **Experience Machine:** Highlights how the setup is rigged against hedonism by making the "unreality" salient, prompting a rejection based on framing rather than value.

  **Least Fair Jab:**
  The claim that conclusions are "pre-loaded" is the sharpest exaggeration. Defenders argue thought experiments do not deductively force conclusions but reveal inconsistencies in our existing conceptual web. They function like scientific idealizations: by isolating variables (even artificially), they test conceptual coherence rather than merely manipulating gut reactions. If intuitions are evidence of conceptual competence, then engineering cases to test limits is methodological rigor, not rigging.
