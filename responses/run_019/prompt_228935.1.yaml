          *   *Chalmers' Lens:* If we fix the meaning (e.g., "Let's call objects that clear orbits 'Class A' and round objects 'Class B'"), do the astronomers still fight?
          *   *Result:* They might stop fighting about the *word* "planet," but they would still fight about which classification scheme is *useful*. This suggests the dispute isn't *purely* verbal, but rather about *conceptual engineering* or *theoretical utility*.

