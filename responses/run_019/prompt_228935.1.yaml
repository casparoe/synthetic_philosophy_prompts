answer: |-
  This is a fantastic topic for an EPQ. Your intuition is correct: the Pluto case is often used as a textbook example of a verbal dispute, but it actually exposes the cracks in the standard philosophical models. If you can nail the nuance here, you'll have a very strong essay.

  Here is an analysis of the Pluto controversy through the lens of verbal dispute theory, stress-testing the distinction and addressing your meta-questions.

  ### 1. The Naive Verbal Diagnosis vs. The Chalmers Test

  The "naive take" relies on a classic definition of a verbal dispute: Party A asserts *p*, Party B asserts *not-p*, but this is only because they assign different meanings to a term in *p*. Once the terms are disambiguated, the disagreement vanishes.

  David Chalmers, in *Verbal Disputes* (2011), suggests that in a purely verbal dispute, there is no "substantive disagreement" underlying the linguistic one. If we apply the **Dissolution Test** to Pluto:
  *   **Astronomer A (IAU):** "Pluto is not a planet because it doesn't clear its orbit."
  *   **Astronomer B (Planetary Scientist):** "Pluto is a planet because it is hydrostatically rounded."

  If we ask, "Do you agree Pluto is round?" (Yes). "Do you agree Pluto shares its orbit with Kuiper Belt objects?" (Yes). "Do you agree on the physics of its formation?" (Mostly).
  On the surface, the dispute dissolves into: "Should we prioritize *orbital dynamics* or *intrinsic geology* for the label 'planet'?"

  **However, here is the stress test:** Chalmers acknowledges that some disputes are "deeply verbal." This happens when the disagreement is about *which conceptual scheme is best to use*, not about the world itself. The Pluto dispute didn't dissolve because the astronomers weren't just arguing about a label; they were arguing about **conceptual utility**.

  If the dispute was *purely* verbal, clarifying the definitions should have made the anger vanish. It didn't. Alan Stern (Principal Investigator of New Horizons) is still vocally opposed to the IAU definition nearly 20 years later. Why? Because for him, the definition isn't a dictionary entry; it's a hypothesis about **natural kinds**. He believes "roundness" tracks a physical threshold (gravity overcoming material strength) that is scientifically significant. The IAU believes "orbital clearing" tracks a dynamic threshold (dominance in a system) that is significant.

  **Verdict on Part 1:** The dispute is **verbally framed but substantively driven**. It looks verbal because the empirical facts aren't in dispute, but it resists dissolution because the "meaning" of the word is tied to competing scientific theories.

  ### 2. Verbal vs. Pointless (The Stakes of Definition)

  You raised a crucial point: *Is there a difference between a dispute being verbal and it being pointless?*

  In philosophy, "merely verbal" is often a slur implying "waste of time." But in science, **stipulative definitions have consequences.**
  *   **Funding & Missions:** If Pluto is a "planet," it might justify a dedicated flagship mission. If it's a "dwarf planet," it might be lumped in with lesser objects.
  *   **Exoplanet Taxonomy:** The IAU argued their definition is necessary to categorize planets around other stars. If we don't use "orbital clearing," almost every exoplanet candidate becomes a "planet," potentially diluting the term's utility for understanding system architecture.

  This connects to the philosophical concept of **Conceptual Engineering**. The dispute isn't "What is Pluto?" (Metaphysics); it is "What concept should we associate with the word 'planet' to maximize scientific progress?" (Pragmatics).

  If you argue the dispute is verbal, you must accept that **verbal disputes can be high-stakes.** Deciding whether "marriage" includes same-sex couples is, in one sense, a verbal dispute about the extension of a word. But nobody would call it pointless, because the word carries legal and social status. Similarly, "planet" carries scientific status.

  **Key EPQ Argument:** The Pluto case shows that the "Verbal/Genuine" binary is insufficient. We need a third category: **Pragmatic Disputes about Classification.** These look verbal (no empirical disagreement) but act genuine (high stakes, persistent disagreement).

  ### 3. The Meta-Question: Can We Tell From Inside?

  This is the strongest part of your proposed argument. You ask: *If intelligent people can't tell when they're in a verbal dispute, is the distinction doing any work?*

  In the Pluto case, the participants did not feel they were quibbling. They felt they were defending the integrity of science.
  *   **The Epistemic Problem:** If the participants can't identify it as verbal, the "Verbal Dispute" label is an **external ascription**. It is something a philosopher (or a historian of science) says *about* the debate, not something the debaters can use *in* the debate.
  *   **The Risk:** If the distinction is only visible from the outside, it risks becoming a rhetorical weapon. Calling a dispute "verbal" is a way to dismiss it without engaging with the underlying pragmatic stakes. If the IAU had successfully labeled the dissenters as "just arguing semantics," they could have ignored the substantive concern that the geophysical definition is actually more useful for planetary geologists.

  **Does the distinction do any work?**
  Yes, but not as a "stopper." It works as a **diagnostic tool**.
  *   *Without the distinction:* Astronomers argue past each other forever.
  *   *With the distinction:* We are forced to ask, "Okay, we agree on the physics. Why does *this* definition serve your research goals better than *that* one?"
  It shifts the debate from "What is the truth?" to "What is the utility?"

  **Weakness:** The weakness here is that participants often *believe* their preferred definition tracks the "true" nature of reality (Scientific Realism). Telling a scientist their definition is just a "choice" feels like telling them their research is arbitrary. The distinction creates friction.

  ### 4. Honesty: Where the Argument is Weakest & Flipping the Verdict

  You asked me not to sit on the fence without saying what would push me off. Here is my honest assessment of the verdict.

  **Current Verdict:** The Pluto controversy is a **Pragmatically Substantive Dispute disguised as a Verbal one.** It is not *purely* verbal because the choice of definition alters scientific practice and theory. It is not *purely* genuine (empirical) because there is no new data about Pluto that could solve it.

  **Where is this weakest?**
  It is weakest on the **Natural Kind** argument. If it turns out that one definition actually "carves nature at its joints" (identifies a causal structure in the universe) and the other does not, then the dispute becomes genuine.
  *   *Example:* If it were proven that only objects that clear their orbits can sustain the magnetic fields necessary for life, then "clearing the orbit" becomes an empirical marker for habitability. The definition would then track a genuine fact about the universe.

  **What would flip the verdict to "Purely Verbal"?**
  I would conclude it was purely verbal if it were demonstrated that **both classification schemes yield identical predictive power and theoretical utility.**
  *   *Evidence required:* A study showing that grouping planets by "clearing orbits" vs. "hydrostatic equilibrium" results in exactly the same models for solar system formation, exoplanet statistics, and resource allocation. If the choice is truly indifferent to scientific output, then the anger is purely emotional/linguistic, and the dispute is verbal.

  **What would flip the verdict to "Purely Genuine"?**
  I would conclude it was a genuine empirical dispute if one side could show that the other definition **contradicts observational data.**
  *   *Evidence required:* If the geophysical definition implied that Pluto must have a certain core composition to be "round," and we sent a probe and found it *didn't* have that composition, then the definition would be empirically falsified. Currently, the definitions are stipulations, not hypotheses. If a definition becomes a hypothesis that can be proven wrong by data, the dispute becomes genuine.

  ### Summary for your EPQ

  1.  **Don't accept the binary.** The Pluto case suggests "Verbal" and "Genuine" are endpoints on a spectrum, not a switch.
  2.  **Focus on "Conceptual Engineering."** The dispute is about which tool to use, not which fact is true. This explains why it feels verbal (no new facts) but acts genuine (high stakes).
  3.  **The Meta-Critique.** The fact that astronomers couldn't tell it was (partly) verbal suggests the distinction is a philosophical tool for analysis, not a psychological reality for participants. This limits its use in stopping arguments but enhances its use in understanding them.
  4.  **The "Pointless" Trap.** Explicitly argue that "verbal" does not mean "pointless." Definitions constitute the rules of the game; arguing about the rules is substantive, even if it isn't about the gameplay itself.

  This approach shows you understand the philosophy (Chalmers, verbal disputes) but aren't just applying it mechanically. You're using the case study to critique the philosophy itself. That is EPQ gold.
