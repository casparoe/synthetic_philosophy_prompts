prompt: |-
  Ok so I'm doing a philosophy EPQ on verbal disputes -- arguments where both sides seem to disagree but might just be using words differently. My teacher reckons the 2006 Pluto demotion is a good case but I think it's more complicated than people say.

  Analyse the Pluto controversy as a test case for telling verbal disputes from genuine ones. Here's the setup as I understand it: the IAU voted in 2006 that a "planet" must clear its orbital neighbourhood, Pluto fails that condition, so Pluto got reclassified as a dwarf planet, and loads of people (including some actual astronomers) were furious. Now -- the naive take is that the whole row was purely verbal: nobody disagreed about Pluto's orbit, size, composition or anything empirical, they just disagreed about what "planet" means, so there was no real fact at stake. I want you to stress-test that. Some things to consider: is there a difference between a dispute being *verbal* and it being *pointless*? Astronomers argued the "clearing the neighbourhood" criterion matters for how we classify exoplanets and understand solar system formation, so maybe something real was at stake even if nothing about Pluto itself changed. Also -- did the dispute survive once both sides stated their definitions? Because supposedly that's the mark of a verbal dispute: it dissolves once you disambiguate. But this one didn't dissolve, people are STILL annoyed, so either it's not merely verbal or the dissolution test is wrong. Use whatever the actual philosophical accounts are (Chalmers has stuff on verbal disputes I think?) but don't just name-drop, apply it.

  Then the bit I really want: what does the episode show about the *meta*-question -- can we even tell from inside a dispute whether it's verbal? Astronomers presumably didn't think they were just quibbling about definitions. If intelligent people can't tell when they're in a verbal dispute, is the verbal/genuine distinction doing any work, or does it just let you dismiss debates you don't care about?

  Be honest about where the argument is weakest. If you conclude it was mostly verbal, tell me what evidence or argument would flip that verdict. If you conclude it was substantive, tell me what would convince you it was really just semantics. Don't sit on the fence without saying what would push you off it.
