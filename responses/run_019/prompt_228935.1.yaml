      *   *The Complication:* Definitions in science aren't arbitrary; they serve theoretical purposes (classification, formation theories, exoplanet comparison).
      *   *The Persistence:* People are still mad. Does this mean it wasn't verbal, or that the *consequences* of the definition are substantive?

  3.  **Philosophical Framework (Chalmers et al.):**
      *   *Verbal Dispute:* A dispute where there is no substantive disagreement underlying the linguistic disagreement. Once terms are clarified, the disagreement vanishes.
      *   *Genuine Dispute:* Disagreement about the way the world is (or normative facts), not just words.
      *   *Chalmers' Criterion:* Ideally, a verbal dispute dissolves under ideal clarification.
      *   *The "Merely Verbal" Charge:* Often used to dismiss arguments.

  4.  **Drafting the Analysis - Section by Section:**

