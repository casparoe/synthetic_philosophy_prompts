answer: |-
  **Sequence and Dependencies**
  Begin with the domain: lotteries. You cannot state the Pareto condition in the form required for Harsanyi until preferences are defined over risk. If students view preferences as ordinal, Pareto yields no functional form. Therefore, Hour 1 must secure von Neumann–Morgenstern (vNM) cardinality for both individuals and the social planner. Only once utilities are unique up to affine transformation can you state the Pareto condition as a constraint on utility functions rather than mere orderings. Hour 2 moves to aggregation: show that Pareto + vNM implies linearity. Conclude with the weights problem: linearity does not imply equal weights.

  **The Concrete Example: "The Vaccine Trial"**
  Use a scenario with three subjects and two vaccine protocols. Protocols yield survival or death with different probabilities for each subject (e.g., Protocol X gives Subject 1 a 90% survival chance but Subject 2 only 10%).
  *   **Must Have:** Risk (probabilities), distinct agents, conflicting interests (one prefers X, another Y), and a social planner choosing the protocol.
  *   **Must Lack:** Any natural unit of "well-being" (e.g., dollars, pain scales). Outcomes must be abstract (Life/Death) to prevent students from assuming utility equals survival probability directly or that utilities are comparable across persons. Do not assign utility numbers until the students derive the necessity of doing so.

  **Misconception Map and Defusal**
  1.  **Interpersonal Comparability:** Arises immediately when you write $W = \sum a_i U_i$. Students see summation and assume $U_i$ share a scale.
      *   *Defusal Point:* When introducing vNM utilities (Hour 1). Emphasize affine transformation freedom ($U' = aU + b$). Show that Person A's "10" and Person B's "10" share no zero point or unit. The theorem works *without* comparability; the weights absorb the scale differences.
  2.  **Utilitarianism/Equal Weights:** Arises at the aggregation step (Hour 2). Students assume $a_i = 1$ follows from the theorem.
      *   *Defusal Point:* When deriving the linear form. Explicitly state weights are arbitrary positive constants determined by Pareto alone. Introduce "Anonymity" as a separate, additional axiom needed for equal weights. Harsanyi gives weighted utilitarianism; only Harsanyi + Anonymity gives classical utilitarianism.
  3.  **Normative Force:** Arises at conclusion. Students think the theorem *proves* utilitarianism is morally right.
      *   *Defusal Point:* In closing. Remind them it is a representation theorem: *If* you accept vNM + Pareto, *then* you act *as if* maximizing a weighted sum. It does not justify the axioms themselves.

  **Check for Understanding**
  Do not ask them to state the theorem. Ask: "If we retain individual vNM rationality and Pareto, but drop the requirement that *social* preferences satisfy the Independence axiom, does the weighted sum result hold? Why or why not?" This tests if they understand the result depends on the social planner also being a vNM agent, not just the individuals. If they say yes, they have missed the structural dependency.

  **Explicit Exclusions**
  Refuse to cover Arrow's Impossibility Theorem (different domain/axioms), Sen's critiques of welfarism (too philosophical for formal focus), and the formal linear algebra proof (too technical). State clearly: "We are analyzing the structural implications of rationality constraints, not defending utilitarianism or solving impossibility results." This keeps the tutorial focused on the logic of aggregation rather than broader debates their background cannot yet support.
