  The book concludes frequentism is silent on one-off events. This is the strongest critique in the passage. Strict frequentism struggles with unique events like elections or specific drug trials because there is no long run of identical trials. Frequentists must construct hypothetical repetitions, which can feel ad hoc or arbitrary depending on how the reference class is chosen. This claim survives scrutiny better than the others, as it points to a genuine structural limitation of defining probability solely via frequencies.

  The claim that subjectivism reduces to psychology and cannot ground science is overstated and arguably false. It conflates "subjective input" with "arbitrary output." Scientific subjectivism (Bayesianism) grounds claims by showing how evidence constrains belief through rigorous mathematical rules. If two scientists start with different priors but see enough data, their posteriors converge, ensuring scientific consensus. The passage ignores this convergence theorem, making subjectivism look weaker than it is in practice. Modern physics and cosmology often rely on Bayesian methods to ground claims where frequentist data is sparse.

  Finally, the claim that only propensity makes sense of objective single-case probabilities assumes science *needs* ontological objectivity for single cases. Many scientists accept that single-case probabilities are epistemic (about our knowledge) rather than ontic (about the world). The passage assumes realism about chance without arguing for it. A careful expositor would acknowledge that propensity is one solution to single-case probability, but not the only coherent one, and certainly not the only one used in successful science. The passage privileges ontology over utility. Regarding the drug trial example used in the conclusion: the frequentist handles this via confidence intervals over hypothetical repetitions of the trial design, not the specific trial outcome. The passage dismisses this as "silent," but frequentists argue this is the only scientifically valid way to handle error rates. The subjectivist handles it by assigning a probability to the hypothesis given the data. The passage dismisses this as psychological, ignoring that regulatory agencies increasingly accept Bayesian designs. By framing the debate as a search for the "true meaning" of probability rather than a selection of tools for specific problems, the author biases the reader toward the interpretation that promises the most metaphysical comfort, rather than the most pragmatic utility.

  ### What the three camps would object to

  A frequentist would object: "Science requires error control, not feelings. My definition guarantees that if you use my methods, you won't be wrong too often in the long run. Single-case probabilities are metaphysical nonsense; we only ever observe frequencies. If you can't repeat it, you can't test it, so assigning a probability is meaningless speculation. The drug trial isn't a one-off; it's an instance of a repeatable protocol. My silence on unique events is a virtue, not a bug—it prevents scientists from assigning numbers to things they cannot verify. Subjectivists and propensity theorists are free to speculate, but I provide the only framework that controls Type I and Type II errors in empirical research."

  A subjectivist would reply: "You confuse 'subjective' with 'arbitrary.' My probabilities are constrained by coherence and evidence. When data arrives, beliefs update objectively via Bayes' theorem. Science is about managing uncertainty, not pretending it doesn't exist. Frequentists hide their subjectivity in the choice of reference class and test design. I make my assumptions explicit. Regarding the drug trial: doctors need to know the chance *this* drug works for *this* patient, not the long-run frequency of similar drugs. Only I can answer that. My probabilities ground decisions, which is what science ultimately does. If my beliefs don't match reality, I lose money or patients, so nature corrects me quickly."

  A propensity theorist would argue: "Both of you miss the reality of chance. Quantum decay happens even if no one bets on it and no one counts it. There is a physical fact about this die that makes it land six one-sixth of the time. Frequentists confuse the manifestation of chance with chance itself. Subjectivists confuse our knowledge of chance with chance itself. I provide the ontology that makes sense of why frequencies stabilize and why beliefs should align. Without propensities, probability is just a human game. Science describes the world, not just our games. You both describe our relationship to chance; I describe chance itself."

  ### Does the conclusion survive?

  The claim that frequentism is silent on one-off events largely survives. While frequentists use confidence intervals, these apply to methods, not specific hypotheses. The "reference class" workaround is often unsatisfying for truly unique events. However, it survives only in a technical sense; practically, frequentists approximate single cases via similar cases, so the silence is not absolute but methodological.

  The claim that subjectivism cannot ground scientific claims does not survive. Bayesian methods are standard in many sciences. The claim relies on an outdated view of subjectivism as unconstrained opinion. Corrected, the claim weakens to: "Subjectivism grounds claims differently, via updated belief rather than error rates." This is a difference in philosophy, not a failure of grounding.

  The claim that only propensity gives objective single-case probabilities survives only if one demands ontological objectivity. If epistemic objectivity suffices, the claim fails. It survives as: "Propensity is the only interpretation that offers *ontic* single-case probability," which is a narrower, metaphysical claim rather than a scientific necessity. Most scientists do not require ontic probability to do their work, rendering the conclusion less decisive than the book suggests.

  ### Bottom line for a nonspecialist

  Trust the definitions as rough guides to how different scientists talk. Frequentists talk about data rates; Bayesians talk about uncertainty; Propensity theorists talk about physical chances. Do not trust the conclusion that one view wins. The "winner" depends on what question you are asking. If you need quality control, use frequentism. If you need to update beliefs with new data, use subjectivism. If you are doing foundational physics, propensity might appeal. The book sells a philosophical resolution to a pragmatic toolkit. Treat the chapter as an introduction to the vocabulary of risk, not a final verdict on the nature of reality. Be suspicious of any author who claims a single interpretation solves all problems; probability is likely pluralistic.
