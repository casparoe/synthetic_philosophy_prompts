          *   *Claim 1: Anatomy (No Central Processing Unit).* Plausible? Yes. Settles the question? No, not directly.
          *   *Claim 2: The Homunculus (No Inner Viewer).* Plausible? Yes (infinite regress). Settles the question? Partially, removes the "who" but not the "when."
