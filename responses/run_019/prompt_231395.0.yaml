prompt: |-
  hey, i'm putting together a dataset of hard-ish writing prompts and this one needs to be a satirical piece. you're a professional philosopher who works on consequentialism and decision theory—comfortable with the Greaves/Lenman cluelessness literature—and also an actually good satirist. think it through before you write: start by brainstorming the real features of consequentialist cluelessness and longtermist cause prioritization you can exaggerate (simple vs complex cluelessness; the way any intervention's downstream consequences branch indefinitely so that cost-effectiveness estimates get swamped by unknown second- and third-order effects; the fanaticism / Pascal's-mugging worry; and the symmetry point that cluelessness bites someone who wants to abandon prioritization just as hard as it bites prioritization itself). then pick two or three of those as the load-bearing jokes.

  write a deadpan, Swiftian modest proposal, about 700 words, formatted as a white paper or open letter posted to the EA Forum, in the voice of an earnest and slightly self-satisfied effective altruist who has convinced himself that complex cluelessness makes all expected-value comparisons uninformative and therefore proposes replacing the entire grantmaking and cause-selection process with a randomized lottery or something equivalently absurd that follows from the thought that no intervention has a knowable sign. give it a plausible, over-earnest EA Forum title before the body. the target is the practice of ranking interventions by expected value under deep uncertainty and the argument that cluelessness makes such rankings meaningless. keep the satire fair: exaggerate real features of the view, dont invent a strawman. a specialist should recognize the actual debate and find it funny; a newcomer should still feel the reductio. by the end a reader should feel the objection that cluelessness doesnt license randomization any more than it licenses paralysis, and that the proposal quietly relies on the exact expected-value reasoning it claims to have demolished.

  no verbatim quotes, no bibliography or citations; in-community jargon is fine if you need it. your reply should start directly with the piece itself—no preface, no restating the assignment, no commentary after.
