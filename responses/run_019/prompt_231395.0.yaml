answer: |-
  **Proposal: Replacing Cause Prioritization with Epistemically Humble Randomization**

  **Posted by:** [Redacted] **|** **Karma:** 42 **|** **Date:** Oct 24, 2023

  Many of us in the community remain committed to the core tenet of effective altruism: using evidence and reason to do the most good possible. Typically, this is operationalized as maximizing expected value (EV) across cause areas. However, recent engagement with the literature on consequentialist cluelessness—specifically the distinction between simple and complex cluelessness—suggests that our current prioritization frameworks may be resting on epistemically unjustified foundations. If we take the uncertainty surrounding flow-through effects seriously, the only rational allocation mechanism left is a randomized lottery.

  The problem is not merely that we lack precise data on the magnitude of our interventions (simple cluelessness). It is that for almost any significant intervention, we lack knowledge of the *valence* of its long-term consequences (complex cluelessness). Consider a standard global health intervention. Saving a life today increases population size, which increases carbon emissions, which may hasten climate catastrophe. Conversely, that same individual might invent a technology that prevents extinction. These downstream effects branch indefinitely. As time horizons extend toward the longtermist ideal, the causal noise swamps the signal. The direct benefit of saving a life is finite and knowable; the indirect effects are infinite and unknowable.

  Crucially, this uncertainty appears symmetric. There is no principled reason to believe the unknown second-order effects of saving a life are more likely to be positive than negative, or vice versa. If the probability distribution of long-term outcomes is symmetric around zero, the expected value of any intervention collapses. We are not just uncertain about *how much* good we are doing; we are uncertain about *whether* we are doing good at all.

  This creates a severe decision-theoretic crisis. If the EV of preventing a pandemic is effectively undefined due to complex cluelessness, and the EV of funding AI safety is similarly undefined, then standard cost-effectiveness comparisons are meaningless. Ranking interventions by estimated lives saved per dollar is not just imprecise; it is superstition. It privileges the visible, short-term counterfactuals over the invisible, long-term ones without justification.

  Some might argue that this leads to paralysis. But paralysis is itself a decision with unknown flow-through effects. Doing nothing also ripples through history. Therefore, inaction is not epistemically safer than action. However, *chosen* action based on flawed EV estimates risks actively causing harm based on false confidence.

  I propose we replace the current grantmaking apparatus with a High-Integrity Randomization Protocol (HIRP). All funds allocated for longtermist or global development causes would be distributed via a cryptographically secure random number generator among a pre-vetted list of interventions. This ensures that our allocation reflects the true state of our knowledge: total ignorance regarding the sign of far-future consequences.

  This approach offers several advantages. First, it eliminates the bias toward interventions with measurable short-term outcomes, correcting for the availability heuristic. Second, it respects the symmetry of cluelessness. If we cannot know whether an intervention is net positive or net negative, assigning it a probability greater than 50% of being good is dogmatic. Randomization maintains epistemic humility.

  Critics may object that randomization cannot be justified without invoking the very EV calculations this proposal rejects. After all, why choose randomization if not because it has higher expected value than biased prioritization? This objection misunderstands the proposal. We are not maximizing EV; we are minimizing the risk of confident error. By refusing to claim knowledge we do not possess, we avoid the specific disvalue of hubris-driven resource misallocation. The goal is not to do the most good—which is impossible under complex cluelessness—but to ensure we are not confidently doing harm.

  Implementing HIRP would require a shift in culture. We must stop praising donors for "finding the best cause" and start praising them for "acknowledging the limits of prediction." I invite the community to pilot this protocol with the next funding round. If cluelessness is real, the lottery is the only honest policy. If it is not, the lottery performs no worse than our current guesses.

  Let us have the courage to follow the uncertainty where it leads: to the dice.
