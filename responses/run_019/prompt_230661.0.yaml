  *(Refining the Override)*: The prompt asks "what would have to be true for us to override the procedure honestly." The answer lies in distinguishing the committee's role: Are we *historians* judging the dead, or *civic stewards* curating public space? The procedure judges the dead (fairness). The override asserts the right to curate space (utility/harm). I need to make this distinction sharp.

