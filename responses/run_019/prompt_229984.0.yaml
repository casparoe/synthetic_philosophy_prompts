  **Scenario**

  A calibration laboratory is certifying a batch of analog tachometers intended for industrial turbines, but the manufacturing logs for this specific batch were lost; all the technicians know is that the true critical threshold frequency $f$ lies somewhere between 100 Hz and 400 Hz, and they must assign a probability that the threshold is below 200 Hz to determine if a standard test signal is sufficient. However, the tachometers are dual-scaled and also calibrated in terms of rotational period $T$, and the safety manual specifies the threshold in milliseconds; the technicians know equivalently that the period $T$ lies between 2.5 ms and 10 ms, and they must assess the probability that the period exceeds 5 ms. The technicians have no access to the engine design specs that would privilege time over frequency or vice versa; both are standard, interchangeable readouts on the dashboard, and their ignorance regarding the specific threshold setting is symmetric with respect to the scale markings on the dials, leaving them with no epistemic reason to treat one parameterization as more fundamental than the other.

  ***

  **Demonstration of Specifications**

  **Description A (Frequency):** The agent treats the possible values of frequency $f$ as the atomic alternatives. Given the knowledge that $f \in [100, 400]$ and symmetric ignorance within that range, the Principle of Indifference (PoI) assigns a uniform distribution over the interval.
  *   Total measure: $400 - 100 = 300$.
  *   Target event ($E$): $f < 200$. Measure: $200 - 100 = 100$.
  *   **Probability:** $P(E) = 100/300 = 1/3$.

  **Description B (Period):** The agent treats the possible values of period $T$ as the atomic alternatives. Given the knowledge that $T \in [2.5, 10]$ and symmetric ignorance within that range, PoI assigns a uniform distribution over this interval.
  *   Total measure: $10 - 2.5 = 7.5$.
  *   Target event ($E$): $T > 5$ (physically equivalent to $f < 200$). Measure: $10 - 5 = 5$.
  *   **Probability:** $P(E) = 5/7.5 = 2/3$.

  **Contradiction:** The principle yields $1/3$ and $2/3$ for the same physical event based on two descriptions of the agent's state of knowledge.

  **Analysis of Keynes's Restriction**

  Keynes's repair mandates applying PoI only to alternatives that are "indivisible relative to everything we know." In this scenario, the restriction fails to resolve the contradiction for the following reasons:

  1.  **Epistemic Indivisibility:** To the technician, the frequency scale is a linear dial with equal tick marks. Relative to their knowledge (the bounds 100–400), the interval is a single, unbroken alternative; there is no evidence suggesting a subdivision (e.g., that 100–200 is less likely than 200–300). The same holds for the period scale (2.5–10 ms). Both parameterizations present as "atomic" readouts.
  2.  **No Hidden Subdivision:** Keynes argues paradoxes arise when one alternative is secretly a complex of others (e.g., "Not-Red" containing "Blue" and "Green"). Here, neither $f$ nor $T$ is epistemically complex. While they are mathematically linked ($T=1000/f$), the agent's *knowledge* does not privilege one as the generator and the other as the derivative. To treat $T$ as "divisible" because it maps to $f$ requires external physical knowledge the agent explicitly lacks.
  3.  **Regeneration of Ambiguity:** If one insists $f$ is the "true" atom, one must justify why. If the justification is "frequency is fundamental in physics," that violates Constraint 5 (symmetric ignorance/black box). If the justification is "the dial looks linear," the period dial also looks linear. Any attempt to subdivide one scale to match the other merely shifts the arbitrariness; it does not dissolve it.

  **The Feature Doing the Work**

  The contradiction is generated by the **non-linear transformation** between the two parameterizations ($T \propto 1/f$). A uniform distribution is not invariant under non-linear transformation. If the relationship were linear (e.g., Celsius vs. Fahrenheit), a uniform prior on one would imply a uniform prior on the other, and the probabilities would match. The contradiction disappears if the transformation is linear.

  **Steelmanning Keynes's Defense**

  A defender of Keynes might argue that "indivisibility" is not merely about the agent's subjective impression of the dial, but about the **logical structure of the evidence**. They would claim that Description B smuggles in a subdivision because the equal intervals of $T$ correspond to *unequal* intervals of $f$. Since the physical state is the same, the "real" alternatives are the physical states. If the agent assigns equal probability to unequal physical chunks (in terms of $f$), they are violating the spirit of indifference. Keynes would insist that there *must* be a unique, most fundamental description of the state (likely frequency, as it is additive in many physical contexts), and the restriction demands we find it before applying PoI.

  **Evaluation of the Defense**

  This defense fails in the context of the scenario's constraints. The scenario stipulates a "black box" where the agent lacks the theoretical knowledge to identify the "fundamental" parameter. Keynes's restriction assumes that relative to knowledge, there is a *unique* set of indivisible alternatives. This case demonstrates that relative to limited empirical knowledge, there can be **multiple, mutually incompatible sets of alternatives that all appear indivisible.** By offering a negative constraint ("do not subdivide") without a positive selection rule ("choose the fundamental basis"), Keynes's repair provides no algorithm for the agent to follow. The restriction successfully blocks cases where the agent *knows* a subdivision exists (e.g., "Red or Not-Red"), but it collapses when the agent's ignorance is symmetric between two non-linearly related parameterizations. Thus, the case survives the steelman: the restriction is insufficient to guarantee consistency in realistic states of partial ignorance.
