answer: |-
  **The Scenario**
  The *Accord* is a diplomatic vessel commissioned specifically to host treaty signings, where centuries of precedent dictate that agreements are only legally binding if signatories touch the original hull timbers during the ceremony. To keep the vessel seaworthy, rotting planks are gradually replaced on the active ship (Ship A), causing delegations to cease binding signings on board because the precedent requires the original wood, though Ship A continues to host informal negotiations. The discarded original planks are stored and eventually reassembled into Ship B, which immediately resumes hosting binding treaty signings because it alone satisfies the precedential material requirement inherent to the ship's commission.

  **Why Form Continuity Picks the Repaired Ship**
  Ship A maintains the continuous shape, structure, and arrangement of a sailing vessel throughout the entire repair process without ever losing its configuration as a ship. Because the replacement of planks occurs gradually, the overall form remains uninterrupted and recognizable as the *Accord* at every moment in time.

  **Why Overlap-Matter Continuity Picks the Repaired Ship**
  Ship A preserves spatiotemporal continuity of matter by ensuring that at any given moment, the majority of the ship's components are connected and in service, whereas the discarded planks sit disconnected in storage. The gradual replacement allows for a continuous chain of overlapping matter, while the stored planks suffer a break in physical continuity during their time in the warehouse.

  **Why Function Continuity Picks the Rebuilt Ship**
  The original ship's defining social role was enabling binding legal agreements, a specific capacity Ship A lost when its replacements violated the precedential material requirement. Ship B restores this specific capacity upon assembly, thereby resuming the unique social role the original artifact was created to fulfill, whereas Ship A merely performs a generic hosting role.

  **The Load-Bearing Feature**
  The legal convention linking treaty validity specifically to contact with the original construction materials rather than merely the presence of a vessel.

  **What Happens If You Remove That Feature**
  If treaty validity depended only on the ship's presence or capacity to host, Ship A would retain the functional identity because it never stopped hosting negotiations. The verdict would then shift to the repaired ship, as it would be the only one maintaining continuous service.

  **How a Defender of the Losing Ship Would Attack the Case**
  A defender of Ship A would argue that the ship's primary function was general diplomacy and transportation, not material-specific validation, so continuous service outweighs material purity. They would claim the precedent regarding the wood is a contingent rule attached to the ship, not constitutive of the ship's identity itself.
