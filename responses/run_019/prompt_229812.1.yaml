prompt: |-
  I'm teaching one seventy-five-minute session on teleosemantics to upper-level undergraduates in a philosophy of mind course, with only a whiteboard and no slides. They've done functionalism and multiple realizability, so they're comfortable with the idea that a mental state is typed by its role, but they've never seen the problem of mental representation or the project of naturalizing content. Don't teach me teleosemantics; plan how I should teach it.

  The one idea the session should make land is how etiological function — roughly, what a mechanism was selected to do by its history — lets a teleosemanticist solve the disjunction problem for representational content (the problem that a causal or informational account seems to leave a token with disjunctive content, horse-or-cow-on-a-dark-night-or-glimpse-of-a-horse-shaped-rock, whenever multiple causes can set it off), and why that makes "content is what it's for" more than a slogan. I want the plan built so that by the end the students can see both the work the notion of function is doing and the price being paid for it.

  Please give me: (1) the order in which the pieces must be introduced and what depends on what, including the preliminary distinction or setup that has to be in place before misrepresentation can be stated as a real problem rather than a verbal one; (2) the single carrying example the whole session should build on, what features it must have and what features it must lack, and why not the standard candidates such as the magnetotactic bacterium that orients along geomagnetic field lines or the honeybee waggle dance, if you would avoid them; (3) the misconceptions the students are likely to bring or form, in the order they are likely to appear — I suspect at least "proper function means what the trait usually does" and "normal conditions are statistically average conditions" — with, for each, the exact point in the sequence where it should be headed off and how; (4) one question to ask at the end whose answer would show whether they've grasped the function-based solution to the disjunction problem rather than just memorized it; and (5) what I should explicitly refuse to settle or cover at this level, and how to say so. End with a single sentence stating the spine of the whole sequence.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Teleosemantics (specifically focusing on etiological function solving the disjunction problem/misrepresentation).
      *   **Audience:** Upper-level undergraduates (Philosophy of Mind).
      *   **Background:** Know functionalism & multiple realizability (role-based typing). *Do not* know the problem of mental representation or naturalizing content.
      *   **Constraints:** 75 minutes, whiteboard only (no slides).
      *   **Goal:** Make *one* idea land: Etiological function solves the disjunction problem, making "content is what it's for" substantive. Show the work function does and the price paid.
      *   **Deliverables:**
          1.  Order of introduction/dependencies (including the setup for misrepresentation).
          2.  Single carrying example (features required/avoided, why not standard ones like bacteria/bees).
          3.  Likely misconceptions + when/how to head them off.
          4.  One final assessment question.
          5.  What to explicitly refuse to cover + how to say it.
          6.  Single sentence spine.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Problem:* Causal/Informational theories say $R$ represents $X$ if $R$ is caused by $X$. But $R$ is sometimes caused by $Y$ (illusion/hallucination). So does $R$ represent $X$ or $X \lor Y$? If $X \lor Y$, there is no error (misrepresentation). If $X$, how do we rule out $Y$ without appealing to intentionality (circular)?
      *   *The Teleosemantic Solution:* $R$ represents $X$ because $R$ was *selected* to be caused by $X$ to guide action. $Y$ causes $R$ only because $Y$ mimics $X$. The function is fixed by history, not current statistics.
      *   *The Price:* Reliance on evolutionary history (etiology), potential indeterminacy of selection, Swampman objection (though maybe too advanced for 75 mins, needs handling).

  3.  **Drafting Section (1): Order of Introduction:**
      *   Need to start with *why* we care. Functionalism gives us roles, but not *aboutness*.
      *   Need to define the target: Naturalizing content.
      *   Need the "Disjunction Problem" setup. This requires a clear distinction between *veridical* and *non-veridical* tokens.
      *   Crucial pivot: Misrepresentation isn't just "wrong label," it's "tokening without the proper cause."
      *   Introduce Etiological Function (Millikan style, roughly).
      *   Apply Function to the Disjunction Problem.
      *   Discuss the "Price" (history dependence).
      *   *Dependency:* Can't explain misrepresentation without a prior norm. Can't explain the norm without etiology. Can't explain etiology without selection history.

  4.  **Drafting Section (2): The Carrying Example:**
      *   *Constraint:* Avoid Magnetotactic Bacteria (too simple, no representation really) and Honeybees (too complex, social).
      *   *Requirement:* Needs a clear detector, a clear target, a clear failure mode, and a clear evolutionary benefit.
      *   *Idea:* A frog's fly detector? (Classic Lettvin et al.).
          *   *Pros:* Simple, visual, clear action (snap).
          *   *Cons:* Might be too associated with "feature detectors" which leans causal.
      *   *Idea:* A moth's bat detector?
          *   *Pros:* Clear survival value (dive), clear false positive (ultrasound noise).
          *   *Cons:* A bit abstract.
      *   *Idea:* A specific primate alarm call? (Vervet monkeys).
          *   *Pros:* Semantic content is clearer.
          *   *Cons:* Social learning muddies etiology.
      *   *Selection:* **The Frog's Fly-Detector.** It's the canonical teleosemantics example (Millikan uses it, Papineau uses it). It's visual (easy for whiteboard), has a clear action (tongue snap), and a clear false positive (BB pellet or shadow).
      *   *Why not Bacteria?* Bacteria don't *represent*; they just react. We need a gap between stimulus and action where content fits.
      *   *Why not Bees?* Too much complexity regarding communication vs. internal representation.
      *   *Features needed:* A state $N$ (neural firing), a Target $F$ (Fly), a Mimic $P$ (Pellet), an Action $A$ (Snap).
      *   *Features to avoid:* Consciousness, complex reasoning, social convention.

  5.  **Drafting Section (3): Misconceptions:**
      *   *Misconception 1:* "Function = what it actually does now." (Current disposition vs. Historical norm).
          *   *Fix:* Distinguish "capacity" from "proper function." Use the heart example (pumping blood vs. making thumping sounds).
      *   *Misconception 2:* "Normal conditions = statistically frequent conditions."
          *   *Fix:* Emphasize *selection* conditions, not *average* conditions. If frogs mostly see pellets now due to pollution, function doesn't change.
      *   *Misconception 3:* "The frog thinks 'Fly'." (Anthropomorphism).
          *   *Fix:* Keep it sub-personal. It's about the mechanism's success conditions.
      *   *Misconception 4:* "This solves everything." (Ignoring the price).
          *   *Fix:* Explicitly mention the reliance on history (Swampman hint).

  6.  **Drafting Section (4): Final Assessment Question:**
      *   Need to test if they get *why* history matters for the disjunction problem.
      *   *Scenario:* A Swampman frog (no history) or a mutated frog.
      *   *Better:* A scenario where statistics diverge from history.
      *   *Question:* "If 90% of the tokens of state $N$ in this frog's lifetime are caused by BB pellets, but the mechanism was selected for catching flies, what does $N$ represent? Why does the 90% not change the content?"
      *   *Refinement:* Make it about a *new* environment. "We move the frog to a planet where fly-shaped things are always rocks. Does the content change immediately?" (Tests etiology vs. current covariance).

  7.  **Drafting Section (5): What to Refuse:**
      *   *Don't cover:* The specific metaphysics of selection (gene vs. trait), the Swampman objection in depth (just mention it as a cost), competing teleosemantic theories (Papineau vs. Millikan vs. Dretske).
      *   *How to say it:* "We are looking at the *engine* of the theory, not the full vehicle. We are bracketing [X] to see if the core move works."

  8.  **Drafting the Spine:**
      *   Needs to connect Function -> Norm -> Misrepresentation -> Disjunction.
      *   "Etiological function establishes a historical norm that distinguishes proper causes from accidental triggers, thereby grounding misrepresentation without circularity."

  9.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I address the "no slides/whiteboard" constraint?
      *   *Adjustment:* Ensure the plan describes what goes on the board (diagrams of causal chains vs. historical lines).
      *   *Check:* Is 75 minutes enough?
      *   *Adjustment:* Keep the intro to functionalism brief (they know it). Spend the bulk on the Disjunction Problem and the Solution.
      *   *Check:* Is the distinction between "role" (functionalism) and "content" (teleosemantics) clear?
      *   *Adjustment:* Explicitly state: Functionalism types by *internal* causal role; Teleosemantics types by *external* historical relation.
      *   *Check:* The prompt asks for "what depends on what."
      *   *Adjustment:* Make the sequence rigid. You can't have misrepresentation without norms. You can't have norms without functions. You can't have functions without history.

  10. **Final Polish:** Ensure tone is pedagogical and precise. (Proceed to generate output based on these thoughts).

