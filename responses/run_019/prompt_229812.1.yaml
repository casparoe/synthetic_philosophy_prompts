answer: |-
  (1) **Sequence and Dependencies**

  1.  **The Gap in Functionalism (10 mins):**
      *   *Board:* Draw a box labeled "Mental State M." Arrows in (causes), Arrows out (behavior).
      *   *Move:* Remind them functionalism types $M$ by its internal causal role (inputs/outputs).
      *   *Dependency:* Establish that functionalism explains *what the state does*, but not *what the state is about*. A thermostat has a role, but does it *represent* temperature?
      *   *Goal:* Motivate the need for a theory of **Content** (Aboutness) that is naturalistic (no magic).

  2.  **The Disjunction Problem / The Possibility of Error (15 mins):**
      *   *Board:* Draw two causal chains leading to $M$. Chain A: Object $X \to M$. Chain B: Object $Y \to M$.
      *   *Move:* If content is just "what causes $M$," and both $X$ and $Y$ cause $M$, then $M$ represents ($X$ or $Y$).
      *   *Dependency:* If $M$ represents ($X$ or $Y$), then when $Y$ causes $M$, $M$ is *true*. There is no error.
      *   *Crucial Setup:* You cannot state the problem of misrepresentation until you establish that a theory of content must allow for **normativity** (the possibility of being *wrong*, not just different). If content is descriptive of all causes, error vanishes.

  3.  **Etiological Function as the Source of Norms (20 mins):**
      *   *Board:* Draw a timeline. Past (Selection) $\to$ Present (Tokening).
      *   *Move:* Introduce **Proper Function**. A trait's function is not what it *does*, but what it was *selected for* doing.
      *   *Dependency:* Norms require a standard independent of current performance. History provides this standard.
      *   *Goal:* Establish that "Function" = "Success Condition." If the mechanism fails to perform its function, it is malfunctioning.

  4.  **Solving the Disjunction Problem (20 mins):**
      *   *Board:* Return to Chain A ($X$) and Chain B ($Y$). Overlay the History arrow.
      *   *Move:* $M$ represents $X$ because ancestors with $M$-caused-by-$X$ survived. $Y$ causes $M$ only because $Y$ mimics $X$.
      *   *Dependency:* Because the function is fixed by the *past*, current tokens caused by $Y$ are "misfires."
      *   *Goal:* Show that "Content is what it's for" means "Content is the condition under which the mechanism historically succeeded."

  5.  **The Price of the Solution (10 mins):**
      *   *Board:* Write "HISTORY IS HEAVY."
      *   *Move:* If content depends on history, a creature without history (Swampman) has no content.
      *   *Goal:* Acknowledge the cost of naturalizing norms.

  (2) **The Carrying Example: The Frog's Fly-Detector**

  *   **The Setup:** A specific neural mechanism ($N$) in the frog's visual system fires when a small, dark, moving dot appears. This firing triggers a tongue snap ($A$).
  *   **Why this example:** It sits between the magnetotactic bacterium and the honeybee.
      *   *Unlike the Bacterium:* The bacterium's orientation is a direct physical coupling; there is no "gap" for representation to inhabit. The frog has a distinct detector state ($N$) that mediates between stimulus and action, allowing us to ask what $N$ *says* about the world.
      *   *Unlike the Honeybee:* The waggle dance involves social convention and communication, which introduces layers of derived intentionality. The frog is a solitary consumer of its own representation.
  *   **Required Features:**
      1.  **A Specific Target:** Nutritious flies ($F$).
      2.  **A Specific Mimic:** Non-nutritious BB pellets or shadows ($P$).
      3.  **A Consumptive Action:** Snapping ($A$).
      4.  **A Historical Link:** Ancestors who snapped at $F$ survived; ancestors who snapped at $P$ wasted energy/died.
  *   **Features to Lack:**
      1.  **Consciousness:** Do not imply the frog *thinks* "Fly." This is sub-personal content.
      2.  **Learning:** Do not allow the frog to learn the difference during its lifetime; the function must be innate/selected to keep the etiology clear.

  (3) **Likely Misconceptions and Interventions**

  1.  **Misconception:** "Proper function is just what the trait *usually* does." (Statistical Normality)
      *   **When:** Immediately after introducing Etiological Function (Step 3).
      *   **Intervention:** Draw a heart on the board. "If 90% of people in a polluted city have hearts that pump sludge due to disease, is the function of the heart to pump sludge?" Elicit "No." Write: **Function $\neq$ Frequency.** Function is what explains the trait's *presence*, not its current *performance*.
  2.  **Misconception:** "Normal conditions are the conditions the organism is *currently* in."
      *   **When:** Applying the solution to the Disjunction Problem (Step 4).
      *   **Intervention:** "Suppose we teleport the frog to a planet where 99% of small dark moving dots are pellets, not flies. Does $N$ now represent *Pellet*?" Elicit "No." The function is locked by the *history of selection*, not the current environment.
  3.  **Misconception:** "The frog is making a mistake because it's 'confused'." (Anthropomorphism)
      *   **When:** Discussing the false positive (BB pellet).
      *   **Intervention:** "The frog isn't confused. The *mechanism* is operating exactly as designed, but the world failed to match the mechanism's requirements. The error is in the fit between history and present, not in the frog's 'mind'."
  4.  **Misconception:** "This solves the problem perfectly." (Ignoring the Price)
      *   **When:** The final wrap-up.
      *   **Intervention:** Force them to see the rigidity. "If history determines content, can a creature ever represent something *new* that its ancestors never encountered?" (Leave this hanging as a limitation).

  (4) **Final Assessment Question**

  "If we clone a frog today, but genetically engineer the clone so that its visual detector $N$ was *not* present in its ancestors (it is a brand new mutation that just happened to appear), and this new $N$ is triggered by Flies, does $N$ represent *Fly*? Why or why not, according to the etiological view?"

  *   *Correct Answer:* No. Without a selection history where $N$ was retained *because* it tracked Flies, there is no proper function, and thus no representational content (only causal covariance). This tests if they understand that **history, not current utility, grounds the norm.**

  (5) **What to Refuse to Cover**

  *   **The Metaphysics of Selection:** Do not get bogged down in *unit* of selection (gene vs. organism) or the precise counterfactuals of "selected for" vs. "selected as."
      *   *Say:* "We are treating 'selection history' as a black box that delivers a function. Debates about how to individuate that history are real, but they are downstream of whether this *kind* of solution works."
  *   **The Swampman Objection:** Do not spend time detailing Davidson's Swampman thought experiment.
      *   *Say:* "This theory implies a creature spontaneously assembled from atoms (Swampman) has no thoughts, because it has no history. Some find this a *reductio*, others a bullet worth biting. We note it as the price of admission, but we won't litigate it today."
  *   **Competing Teleosemantics:** Do not distinguish Millikan from Papineau from Dretske.
      *   *Say:* "There are different architectures for teleosemantics. Today we are building the foundation common to all of them: the move from History to Norm to Content."

  **Spine:** Etiological function anchors content in historical success conditions, allowing a state to be *about* what it was selected to track even when it is currently caused by something else.
