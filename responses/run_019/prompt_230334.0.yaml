answer: |-
  I'll take the first horn, but I think you're loading the word "wrong" with too much baggage. Here's the precise cut: The parent does not wrong *the child*. That child has no legitimate complaint against the parent. If you press me on whether the act is morally permissible *simpliciter*, I might grant that there are impersonal reasons to prefer the healthy child, but those reasons don't amount to a violation of duty *to* the person who exists.

  Your intuition that this is "crazy" relies on conflating "a state of affairs is worse" with "someone has been wronged." We feel revulsion at the painful condition, and we naturally look for a victim to anchor that revulsion. But in nonidentity cases, the victim is a philosophical illusion. (I'll flag here: the claim that existence with a condition isn't "harmful" compared to non-existence is contested—some argue for a threshold view of harm—but the comparative account is the standard baseline).

  If you insist there's a wrong without a victim, you're positing a free-floating moral badness that doesn't attach to any subject's interests. (Quick aside: whether "victimless wrongs" are coherent is heavily debated in metaethics; many find them metaphysically spooky). But let's look at the cost of your position. If you accept that an act can be wrong even when it makes no one worse off, you've opened the door to the Repugnant Conclusion. If we compare populations impersonally, you're forced to admit that a massive population of lives barely worth living is "better" than a smaller population of very happy lives, provided the total welfare is higher. You avoid that conclusion only by insisting that wrongness must track *people*, not *totals*.

  So, I'm not saying the parent is a saint. I'm saying the child isn't the grounds for blaming her. Your turn: Are you really willing to pay the price of impersonal comparisons to save the intuition that this parent violated a duty to *this* child?
