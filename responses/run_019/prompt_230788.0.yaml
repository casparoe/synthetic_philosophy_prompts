prompt: |-
  I've been trying to decide how much to trust coherent extrapolated volition as a target for what we should build an advanced AI to pursue, and I want a number from you, not a survey. Let me stipulate the target roughly: the proposal that a powerful AI should act on the preferences that humanity would have if we knew all the relevant facts, thought through the options without bias or time pressure, and were more fully the people we wish we were. The exact proposition I want your credence in is this: there is a sufficiently determinate construction of humanity's coherent extrapolated volition, and that construction is a better normative target for an advanced AI than the obvious alternatives such as satisfying our current revealed or stated preferences. My own credence is around 0.3, and I suspect I am being too generous.

  Please give me your number and then decompose it into the sub-questions that actually move it. I want at least these terms, with a rough probability and a one-sentence justification for each: (1) that human values have enough coherence and structure for extrapolation to be well-defined rather than path-dependent or contradictory; (2) that, conditional on coherence, the extrapolation procedure can be specified without smuggling in arbitrary choices about which knowledge, which cognitive capacities, or which idealized selves to use; (3) that, conditional on a determinate result, that result would still be recognizable as an extension of what we care about rather than an alien construction; and (4) that even if coherent extrapolated volition is determinate, it is the right normative target rather than something like a pluralist compromise, a veil-of-ignorance construction, or refusing to build a single decider of values in the first place. Then show how the numbers combine, tell me which sub-question your final credence is most sensitive to, and say what evidence or argument would move that sub-question most.

  If you think the proposition as stated is too vague to take a truth-valued credence in, do not answer politely anyway: say so plainly, give the nearest precisification you can honestly assign a number to, and decompose that instead.
