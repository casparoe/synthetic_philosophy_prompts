  4.  **Evaluate against Course Material (Applied Rationality/Forecasting):**
      *   *Standard View (Kahneman/Lovallo):* Inside view is prone to planning fallacy. Outside view is the corrective.
      *   *Nuance:* The outside view provides a *baseline*, not necessarily a final answer. Specific information *can* justify moving away from the baseline, but one must account for the validity of that information (correlation with outcome).
      *   *Reference Classes:* Even "unique" cases have reference classes (e.g., "new product launches," "high-risk R&D," "grant proposals"). Saying it's "unavailable" is often a failure of imagination.
      *   *Override vs. Constrain:* The outside view should *anchor* the estimate, which is then adjusted. Completely ignoring the inside view is wrong; completely ignoring the outside view is wrong.
