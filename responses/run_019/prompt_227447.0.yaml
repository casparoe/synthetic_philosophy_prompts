answer: |-
  The harbor air smelled of salt and pine resin. Elara and Theron stood on the quay, looking out at the *Kallipos* and the *Eudoxus*, moored side by side.

  "The *Kallipos* is still the *Kallipos*," Elara said, gesturing to the hull on the left. "Despite the refit, its identity persists."

  Theron shook his head. "Look at the timber. Every original plank of the *Kallipos* is now in the hull on the right. The *Eudoxus* is materially the *Kallipos*. To say otherwise is mysticism."

  "It isn't mysticism; it's continuity," Elara countered. "At no point was the ship disassembled. Each day, a single matched pair was swapped. If you deny identity survives one day's swap, you deny the ship survives any maintenance. If you admit it survives one day, you must admit it survives the next. There is no non-arbitrary line where the *Kallipos* ceased to be."

  "That is the Sorites trap," Theron said. "I grant that replacing one plank does not destroy a ship. But you are conflating preservation with transmutation. Consider the counterfactual: if the shipwright had swapped every plank simultaneously, you would agree the ships exchanged identities. The *Kallipos* would be the matter across the dock. Why does slowing the process down change the ontological outcome? It seems perverse that speed alone dictates identity."

  "Because identity is a historical path, not a static state," Elara replied. "A ship is a process of maintenance, not a pile of wood. The *Kallipos* on the left maintains the causal chain of command, the logbook, the crew's station. The swap was gradual enough that the functional organization never broke. To claim the ship jumped across the water because the wood did is to privilege matter over form."

  "But matter is what constitutes the form," Theron insisted. "If I take a statue and melt it down, then recast it in the same mold, is it the same statue? Most say no. Here, you have effectively recast the *Kallipos* using the *Eudoxus*'s mold, while sending the original matter to the *Eudoxus*'s slot. You are asking me to believe that history outweighs constitution."

  "Constitution changes constantly," Elara said. "Cells replace themselves. If I am not my matter, why is a ship?"

  "Because a ship is an artifact, not an organism," Theron said. "Its identity is tied to its manufacture. But let us stop spinning. We are circling the phrase 'the same ship.' Let us taboo it. Describe the situation without using words like 'identity,' 'same,' or 'persist.' What actually differs between our views?"

  Elara paused. "Operational terms?"

  "Precisely," Theron said. "Who does the harbormaster charge mooring fees to?"

  "The captain registered to the *Kallipos* pays for the hull named *Kallipos*," Elara said. "Regardless of the wood. The logbook stays with the hull on the left. The sailor who served on the original *Kallipos* recognizes the left hull as her ship because she never left it."

  "And the sailor who served on the *Eudoxus*?" Theron pressed. "She looks across the dock and sees her original timbers. If a plank from the *Kallipos* was known to be cursed, or sacred, where does the sanctity reside? In the left hull or the right?"

  "In the right," Elara conceded. "The matter carries the history of the wood. But the ship carries the history of the voyage."

  "So the disagreement is not about fees or logs," Theron said. "Those follow the name. The disagreement is about precedence. When the history of the matter conflicts with the history of the structure, which wins? You say structure. I say matter."

  "Is there a substantive fact remaining once we admit that?" Elara asked. "If we agree on who pays, who sails, and where the sacred plank lies, is there anything left to fight over?"

  "Yes," Theron said. "Because 'ship' is not just a label for fees. It is a category of existence. If I say the *Kallipos* is on the left, I imply it could be sunk without destroying the *Kallipos* if the matter on the right is saved. If you say the *Kallipos* is on the right, you imply the left hull is a replica. This matters for insurance, for legacy, for truth."

  "But we agreed," Elara said. "The insurance follows the registration. The legacy follows the crew. The truth is split. The 'ship' is a cluster concept. We are arguing over which cluster center is the 'real' one."

  "And that is not a verbal dispute," Theron said. "It is a disagreement about weighting. You weight continuity of function. I weight continuity of constitution. We are not describing the world differently; we are valuing different features of the world as definitive."

  Elara nodded slowly. "So the crux is whether a ship is defined by its narrative continuity or its material constitution. And neither observation can settle it, because the world provides both."

  "Exactly," Theron said. "But I must admit, your pressure on the Sorites is strong. If I cannot name the day the ship died, I struggle to claim it is dead now."

  "And I must admit," Elara said, "your pressure on the swap intuition is stronger. If the end state is indistinguishable from a total swap, claiming nothing changed feels like special pleading."

  They stood in silence for a moment, watching the tide lift the hulls.

  "Before we go," Theron said, "let us ensure we understand each other. State my position. Not the strawman, but the steelman."

  Elara turned to him. "You argue that artifacts are constituted by their matter. While gradual replacement is permissible for maintenance, a total exchange of components constitutes a transfer of identity. You hold that if the final arrangement of matter is identical to what would result from an instantaneous swap, the identity must follow the matter, regardless of the temporal spread. To claim otherwise is to privilege the spurious label of continuity over the physical reality of the object."

  Theron nodded. "Accurate. And yours?"

  "You argue that ships are defined by their functional and historical continuity. You hold that identity is a path through time, not a collection of parts. Since there is no discontinuity in the ship's operation, crew, or registration, the ship persists. To claim the ship moved across the dock is to ignore the causal chain that binds the vessel's stages together. Matter is incidental; the organization and history are essential."

  Theron smiled faintly. "Then we understand the deadlock. The *Kallipos* is both here and across the dock, depending on whether you ask a sailor or a carpenter."

  "Or," Elara said, turning away, "it is neither, and both are just new ships wearing old names."

  "Perhaps," Theron said. "But the harbormaster still needs someone to pay the fees."

  "True," Elara said. "And for that, at least, the *Kallipos* remains on the left."
