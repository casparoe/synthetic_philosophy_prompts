  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did G&L explicitly mention "drift"? Yes, they mention non-selective forces.
      *   *Check:* Is the "exaptation" point worth making? Yes, because it shows the summary might be conflating the 1979 paper with their later 1982 work, suggesting the summarizer might not be reading the primary text closely.
      *   *Check:* The "noses/spectacles" analogy. G&L used Pangloss, but the specific nose/spectacle example is often attributed to them summarizing Pangloss. It's accurate enough.
