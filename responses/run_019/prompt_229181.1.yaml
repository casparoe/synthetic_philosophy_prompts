  9.  (Final Polish): Ensure the distinction between "Spandrels" (byproducts) and "Exaptations" (co-opted byproducts) is clear, as the summary blurs them slightly regarding the timeline of the term. Ensure the "most features" claim is identified as the major substantive error.

  *(Self-Correction on Exaptation)*: In the 1979 paper, they discuss co-option extensively. They don't use the word "exaptation" in the 1979 text; that came in 1982 ("Exaptation: A Missing Term in the Science of Form"). The summary attributes the term to the 1979 paper. This is a factual error, though conceptually consistent. I should note this.

  *(Self-Correction on "Most Features")*: This is the critical point. G&L never quantified. They said the *assumption* that most are adaptations is unwarranted. The summary flips this to a claim that most *are* spandrels. This is a reversal of the argument.

