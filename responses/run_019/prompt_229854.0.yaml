      *   *About the Groom:* He's careful. He checks sources. He doesn't jump to conclusions. This makes his commitment here significant. If he stands here, he's done the work.
      *   *About the Bride:* You changed the data set. You brought joy (observable).
      *   *About the Union:* Marriage is a momentous choice (James nod). But it's built on evidence (Clifford nod).
      *   *The Future:* I can't predict the future (evidential honesty). But I can assess the variables.
