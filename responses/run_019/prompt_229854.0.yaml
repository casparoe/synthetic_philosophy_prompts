answer: |-
  Good evening. For those I haven't had the pleasure of meeting yet, I'm [Your Name]. I've had the privilege of knowing [Groom] for fifteen years. Usually, when I stand near a microphone with him in the audience, I'm prepared to defend a position. But tonight, I made a promise to [Bride]. I promised that I would not turn this moment into a seminar. I promised that I would not ask anyone in this room to accept a proposition without sufficient warrant.

  So, I will keep this empirical.

  I have known [Groom] since we were young enough that our biggest decisions involved which video game to play. Over those fifteen years, I have observed a consistent pattern in his character. He is a man who checks his sources. He is a man who does not jump to conclusions. If [Groom] tells you he believes something, it is because he has weighed the data, consulted the literature, and found the argument sound. He treats belief as a responsibility. And because he treats belief that way, the fact that he stands here today, making a vow before all of you, is the most significant data point of his life. He has not rushed into this. He has done the work.

  Then came [Bride]. I remember when she first entered the dataset. I observed changes in [Groom] that were measurable even to an outside observer. His frequency of smiling increased. His resilience during difficult weeks improved. I watched him become more patient, more generous, and more present. I did not need a theory to explain it; the effects were visible in the room. Where he was once cautious, he became confident. Where he was once solitary, he became collaborative.

  There is a saying that love is a leap of faith. But watching the two of you, I don't think it was a leap. A leap implies leaving solid ground. Looking at the foundation you've built over the last few years—the way you support each other's careers, the way you care for your families, the way you navigate disagreements with respect—it looks much more like building a bridge. You walked across it together, plank by plank, until you reached this altar.

  Now, I cannot stand here and predict the future. To claim certainty about the decades ahead would be intellectually dishonest. Life contains variables we cannot control. But I can assess the probability of success based on current trends. And given the stability of your partnership, the strength of your commitment, and the support of this community—including grandparents who model enduring love, friends who cheer you on, and a niece who is already very excited about the cake—the projection is favorable.

  Marriage is what my friend William James might call a "momentous choice." It is live, it is forced, and it is irreversible. But it is also a choice that [Groom] makes only because the evidence compels him. He is not ignoring the risks; he is simply finding that the value of the union outweighs them.

  So, I will not ask you to believe in them blindly. I am asking you to look at them. Look at how they stand together. Look at how they look at each other. The evidence is right here in front of you.

  Based on fifteen years of observation, and the visible joy present in this room tonight, I find myself compelled to conclude that they are better together than they are apart. I find it highly probable that they will continue to be so. And I am confident that we are all justified in supporting them.

  Please raise your glasses. To the evidence of love, to the commitment of today, and to [Groom] and [Bride].
