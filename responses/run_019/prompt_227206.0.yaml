  # Decision Tree: Ontology of Inertial Structure

  **Root Context:** In Newton's rotating-bucket experiment, the water's surface becomes concave even when the water is not rotating relative to the bucket walls. This suggests the existence of "true" rotation. The following tree classifies philosophical responses to what grounds this effect.

  ### The Decision Tree

  **Node 1 (Case 1: Empty Universe):** Imagine a universe containing *only* the bucket and water, with all distant stars and matter removed. Does the water's surface remain concave when the bucket spins?
  *   **Yes:** Inertial effects persist independently of matter. (Go to Node 2)
  *   **No:** Inertial effects vanish without matter. (Go to Node 7)

  **Node 2 (Case 5: Inertial Compass):** In this empty universe, does a sealed mechanical device (an inertial compass) register rotation without observing external objects?
  *   **Yes:** Local structure detects acceleration. (Go to Node 3)
  *   **No:** Acceleration is undetectable without matter. (Leads to *Incoherent Region A*)

  **Node 3 (Dynamicalism Check):** Is the inertial structure explained by the universal behavior of rods and clocks (the laws) rather than a physical background?
  *   **Yes:** Geometry is codified in laws. (Go to Node 13)
  *   **No:** Geometry is a physical background. (Go to Node 4)

  **Node 4 (Case 4: Shift Argument):** Imagine shifting every material object in the universe 5 meters to the left. Is the resulting world physically distinct from the original?
  *   **Yes:** Locations have physical significance. (Go to Node 6)
  *   **No:** Locations lack independent significance. (Go to Node 5)

  **Node 5 (Manifold Existence):** Does a manifold of spatial locations exist underlying the matter, even if shifting matter doesn't change the world?
  *   **Yes:** Points exist but lack identity. (Go to Node 11)
  *   **No:** Only relations/structure exist. (Go to Node 12)

  **Node 6 (Point Identity):** Do individual unoccupied points of space possess primitive identity (haecceity)?
  *   **Yes:** Points are individuals. (Go to Node 14)
  *   **No:** Points are not individuals. (Go to Node 11)

  **Node 7 (Case 2: Rotating Shell):** In a universe where the bucket is stationary but all distant matter rotates around it, does the water's surface become concave?
  *   **Yes:** Matter distribution determines inertia. (Go to Node 8)
  *   **No:** Distant matter does not determine inertia. (Go to Node 10)

  **Node 8 (Actual vs. Possible):** Is inertia determined solely by the *actual* distribution of matter, or by relations matter *could* bear?
  *   **Yes:** Actual matter only. (Go to Node 12)
  *   **No:** Modal relations matter. (Go to Node 9)

  **Node 9 (Case 3: Duplication):** Can two worlds have identical material relations but different patterns of absolute acceleration (due to different possible relations)?
  *   **Yes:** Modal facts distinguish worlds. (Go to Node 12)
  *   **No:** Acceleration is fully reduced to relations. (Go to Node 12)

  **Node 10 (Case 6: No Inertial Facts):** Is there any fact of the matter about which trajectories are inertial in this world?
  *   **Yes:** Facts exist but are not matter-dependent. (Contradicts Node 1 No; *Incoherent Region B*)
  *   **No:** Inertial facts are indeterminate. (Go to Node 11)

  **Node 11 (Convention):** Is the choice of an inertial frame merely a linguistic or conventional choice?
  *   **Yes:** Frame choice is arbitrary. (Leaf: Conventionalism)
  *   **No:** Frame choice is constrained. (Leaf: Deflationism)

  **Node 12 (Reduction):** Can all spatiotemporal talk be fully translated into talk about material relations without loss of meaning?
  *   **Yes:** Space is a logical construct. (Leaf: Relationist Variants)
  *   **No:** Structure is irreducible. (Leaf: Structuralist Variants)

  **Node 13 (Metric Reality):** Is the metric field a physical variable that can vary independently of matter sources?
  *   **Yes:** Field is physical. (Leaf: Dynamicalism)
  *   **No:** Field is nomological. (Leaf: Dynamicalism)
      *(Note: In Newtonian context, this node collapses to a single leaf, but distinguishes GR variants.)*

  **Node 14 (Causal Powers):** Do unoccupied regions of space have the power to affect matter (e.g., via inertial forces)?
  *   **Yes:** Space is causally active. (Leaf: Traditional Substantivalism)
  *   **No:** Space is a passive container. (Leaf: Sophisticated Substantivalism)

  ---

  ### Mapping the Logical Space

  Before detailing the leaves, we must assess the combinations of answers generated by the tree. The tree partitions the space into **Matter-Independent** (Nodes 2–6, 13–14) and **Matter-Dependent** (Nodes 7–12) inertia.

  **Unoccupied or Problematic Regions:**
  1.  **Incoherent Region A (Node 1 Yes / Node 2 No):** Claiming inertia exists without matter (Node 1 Yes) but cannot be detected by a local compass (Node 2 No) is physically incoherent in a Newtonian setting. If inertial forces exist, they must be locally measurable.
  2.  **Incoherent Region B (Node 1 No / Node 10 Yes):** Claiming inertia depends on matter (Node 1 No) but persists even when inertial facts are indeterminate (Node 10 Yes) creates a tension. If there are no facts about inertial trajectories, there is no inertia to depend on matter.
  3.  **Technically Unstable (Node 4 Yes / Node 6 No):** Claiming a shift creates a distinct world (Node 4 Yes) but points lack primitive identity (Node 6 No) is metaphysically unstable. Distinctness usually requires haecceity.
  4.  **Underexplored (Node 8 No / Node 9 No):** A position where inertia depends on *possible* matter relations (Node 8 No), yet worlds with identical relations cannot differ in acceleration (Node 9 No), collapses into Machian Relationism. This region is rarely occupied as a distinct view.

  **Observational Indistinguishability:**
  *   **Sophisticated Substantivalism vs. Point-free Structuralism:** These positions (arising from Node 5) agree on all observable predictions. Both deny that shifting the universe changes physical reality. They differ only on whether a "manifold of points" exists as a substratum for the structure.
  *   **Machian vs. Modal Relationism:** Both predict the Rotating Shell (Node 7) causes concavity. They differ on whether *actual* matter suffices (Mach) or if *possible* configurations ground the disposition (Modal). In a universe with fixed matter, they are observationally equivalent.

  ---

  ### Leaf Positions

  **1. Traditional Manifold Substantivalism**
  *   **Path:** Node 1 (Yes) → Node 4 (Yes) → Node 6 (Yes) → Node 14 (Yes).
  *   **Characterization:** Space is a substance composed of individual points that exist independently of matter and possess primitive identity. Inertial forces arise from motion relative to these fixed points.
  *   **Awkward Commitment:** Must accept that God could have created the universe 5 meters to the left without any observable difference, yet it would be a genuinely different world.

  **2. Sophisticated Substantivalism**
  *   **Path:** Node 1 (Yes) → Node 4 (No) → Node 5 (Yes) → Node 14 (No).
  *   **Characterization:** Space is a real manifold substrate, but individual points lack primitive identity; only the structural relations between points are physically significant. Shifts of the whole universe are gauge, not physical changes.
  *   **Awkward Commitment:** Must posit the existence of unoccupied "locations" that have no individual identity and do not causally act on matter, serving only as a structural anchor.

  **3. Point-free Inertial Structuralism**
  *   **Path:** Node 1 (Yes) → Node 4 (No) → Node 5 (No) → Node 12 (No).
  *   **Characterization:** Inertial structure (affine geometry) is physically real, but there is no underlying manifold of points; structure exists without a substratum. Matter inhabits the structure, but the structure does not inhabit a "space."
  *   **Awkward Commitment:** Must explain how matter is "located" if there are no locations, often requiring a complex mathematics of regions or algebraic structures rather than point-set topology.

  **4. Dynamicalism**
  *   **Path:** Node 1 (Yes) → Node 3 (Yes) → Node 13 (No).
  *   **Characterization:** Inertial geometry is not a physical background but a codification of the universal behavior of matter and fields governed by laws. Spacetime structure is derived from dynamics, not prior to it.
  *   **Awkward Commitment:** Must explain why the laws of motion are so universally uniform without appealing to a common background structure that enforces that uniformity.

  **5. Machian Relationism**
  *   **Path:** Node 1 (No) → Node 7 (Yes) → Node 8 (Yes) → Node 12 (Yes).
  *   **Characterization:** Inertia is entirely determined by the actual distribution and motion of all matter in the universe; rotation is rotation relative to the "fixed stars." Empty space has no physical properties.
  *   **Awkward Commitment:** Must accept that if the distant stars were removed, a spinning bucket would feel no centrifugal force, implying instantaneous dependence on distant matter.

  **6. Modal (Leibnizian) Relationism**
  *   **Path:** Node 1 (No) → Node 7 (Yes) → Node 8 (No) → Node 9 (Yes) → Node 12 (Yes).
  *   **Characterization:** Inertia is grounded in the possible spatial relations matter could bear, not just actual matter. This allows for inertial effects even in sparse universes without positing absolute space.
  *   **Awkward Commitment:** Must treat unactualized possibilities (counterfactual matter distributions) as ontologically robust enough to cause physical forces in the actual world.

  **7. Conventionalism / Deflationism**
  *   **Path:** Node 1 (No) → Node 7 (No) → Node 10 (No) → Node 11 (Yes).
  *   **Characterization:** There is no fact of the matter about "true" rotation; calling a frame "inertial" is merely a convenient convention for simplifying the laws of physics. The bucket's concavity is a result of chosen coordinates.
  *   **Awkward Commitment:** Must deny that the stress on the bucket walls reflects a mind-independent physical reality, treating dynamical effects as artifacts of description.

  ---

  ### Notes on General Relativity and Indistinguishability

  **General Relativity (GR):**
  Switching to GR alters the availability of certain branches. Node 1 (Empty Universe) becomes ambiguous: in GR, a universe with no matter can still have spacetime curvature (e.g., Minkowski or de Sitter space), supporting the "Yes" branch without requiring Newtonian absolute space. However, GR incorporates "frame-dragging," where rotating matter *does* influence local inertial frames (Node 7), lending partial support to Machian views that Newtonian physics denies. Dynamicalism (Leaf 4) becomes the dominant interpretation in modern physics, as the metric field in GR is both a physical variable (Node 13 Yes) and governed by dynamical equations.

  **Indistinguishability Flags:**
  *   **Sophisticated Substantivalism vs. Point-free Structuralism:** These two leaves are observationally equivalent in Newtonian physics. Both deny the physical reality of the Shift (Node 4 No). The distinction is purely metaphysical: does the structure require a "bearer" (manifold points)?
  *   **Machian vs. Modal Relationism:** Both predict the Rotating Shell (Node 7) causes concavity. They are distinguishable only in thought experiments involving changes to the *possibility* space of matter, not in actual material configurations.
  *   **Dynamicalism vs. Structuralism:** In Newtonian settings, these are distinct (Background vs. Laws). In GR, they converge, as the "background" becomes a dynamical field itself.
