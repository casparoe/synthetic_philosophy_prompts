answer: |-
  1. For Winner's framework to classify the overpasses as inherently political, the low clearances must necessitate a specific power structure regardless of who builds them, rather than merely reflecting Moses's personal biases. A weaker claim would only assert that the infrastructure produced political consequences by excluding bus riders, without proving the technology itself dictated that exclusion.

  2. The framework explains the overpass well as a specific barrier, but struggles to account for the road system and beach as connected artifacts where alternative routes existed. Treating them separately reveals that the exclusion was a function of the network's configuration rather than the inherent nature of any single bridge.

  3. Joerges' objections do not refute Winner's theory but shift the explanation from the physical artifact to the socio-technical system surrounding it. By highlighting alternative routes and standard clearances, he argues the politics reside in planning decisions rather than the concrete itself.

  4. For this to be technological determinism, the low overpasses would need to force exclusionary outcomes regardless of Moses's specific intentions or available design choices. Instead, the case remains one of a powerful man's intentions expressed in concrete because the design was contingent on his specific authority rather than technological necessity.

  5. The case shows the theory struggles when exclusionary effects are real but design intent is unclear, forcing a retreat to contextual accounts of power. Consequently, claiming artifacts are inherently political becomes difficult without clear evidence that the technology itself, rather than its social embedding, mandated the inequality.
