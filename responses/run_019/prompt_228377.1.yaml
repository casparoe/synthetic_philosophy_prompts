answer: |-
  **Exam Question**

  Expectation-based accounts locate the wrong of promise-breaking in the disappointment of reliance, yet seem unable to condemn breaking promises where no reliance is possible, such as deathbed vows. Diagnose whether this failure is fatal to such accounts, and assess whether treating promising as the exercise of a normative power avoids this problem without presupposing the obligation it seeks to explain.

  ***

  **Model Answer**

  Expectation-based accounts argue that the moral force of a promise derives from the expectations it creates in the promisee. When a promisor induces reliance, they incur an obligation to prevent the harm caused by disappointing that reliance. However, this derivation faces a structural collapse in cases where reliance is impossible. Consider a deathbed promise made to a unconscious patient, or a vow made to a hardened cynic who explicitly expects betrayal. In these scenarios, no expectation is formed, and no reliance-based harm occurs. If the obligation depends entirely on the psychological state of the promisee, then breaking these promises is morally neutral. Yet, intuition strongly suggests otherwise; the promisor remains bound.

  This is not merely an awkward edge case; it is fatal to the expectation account. If the source of the obligation is external to the act of promising itself—located instead in the consequentialist calculus of reliance—then the act of promising loses its distinctive normative significance. It becomes merely a prediction of future behavior. To salvage the intuition that the deathbed promisor is bound, we must locate the obligation in the act of communication itself, rather than its uptake. This motivates the normative power account.

  On this view, promising is the exercise of a power to change one’s normative relations. By invoking a social convention, the promisor voluntarily places themselves under an obligation, independent of the promisee’s psychological state. The wrong of breaking the promise is thus a violation of the authority granted by the convention, not necessarily a cause of harm. This successfully captures the deathbed case: the obligation was created by the utterance, not the reliance.

  However, this account faces a potent circularity objection. To have the power to obligate oneself, there must already be a rule granting that power. If that rule is moral, then the obligation presupposes the very moral force it was meant to ground. If the rule is merely social, it is unclear how a non-moral convention generates a moral obligation without a further moral premise (such as a duty to follow conventions). Critics argue this either begs the question or pushes the problem back a step.

  Nevertheless, this objection does not settle the matter. The normative power theorist can argue that the convention is constitutive, not merely regulatory. Just as the rules of chess constitute the move of "castling" rather than regulating a pre-existing physical action, the convention of promising constitutes the obligation. The moral force comes from the general duty to respect valid normative changes within a justified practice, not from the specific rule itself. While this requires a hybrid view (combining power with a general moral principle), it avoids the circularity of deriving obligation from obligation. Therefore, while expectation accounts fail to explain the binding nature of promises without reliance, the normative power account offers a viable structural explanation, provided it accepts that the power relies on a broader moral framework to be binding. The deathbed case remains a decisive counterexample to pure expectation views, necessitating a shift toward volitional accounts.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Characterization of the Expectation-Based Account (4 marks)**
  *   **Full marks:** Clearly articulates that the wrongness is derived from the consequences of disappointed reliance or harmed expectations, not the act itself.
  *   **Weaker candidate:** Confuses expectation accounts with simple act-utilitarianism generally, or treats "expectation" as merely a prediction rather than a normative ground.

  **2. Diagnosis of the "No Expectation" Cases (4 marks)**
  *   **Full marks:** Argues that cases like the deathbed promise are structural failures (fatal) because they remove the necessary condition for obligation, not just anomalous outliers.
  *   **Weaker candidate:** Dismisses the cases as rare edge-cases, or argues the promisor’s *belief* in the promisee’s understanding is sufficient to save the expectation account.

  **3. Exposition of the Normative Power Alternative (4 marks)**
  *   **Full marks:** Explains that promising is viewed as an act of will that changes normative relations (creates obligation) via convention, independent of consequences.
  *   **Weaker candidate:** Describes it vaguely as "making a rule" without explaining how the act itself generates the binding force distinct from social pressure.

  **4. Identification of the Circularity/Regress Objection (4 marks)**
  *   **Full marks:** Identifies the tension that having the power to create obligations seems to presuppose an existing obligation (or rule) that grants that power.
  *   **Weaker candidate:** Asserts the account is circular without showing *where* the presupposition enters, or conflates circularity with the problem of unjust conventions.

  **5. Evaluation of the Circularity Objection (4 marks)**
  *   **Full marks:** Offers a reasoned judgment on whether the circularity is fatal (e.g., distinguishing constitutive rules from moral premises to mitigate the regress).
  *   **Weaker candidate:** Concludes the circularity is definitively fatal without considering constitutive rule responses, or claims the problem is solved without acknowledging the need for a broader moral principle.
