          *   It's likely "Strict Liability" (Case 1/5 hybrid). Who deployed it? The research institution.
          *   Is it "Flash Crash"? Did it interact with other vessels in an unforeseeable way?
          *   Verdict: Institution is liable (pay), but likely not *blameworthy* if navigation norms were met. Unless... the "no human involvement" was the negligence.

  6.  **Refining the Principle (Self-Correction):**
      *   The "Commission vs. Omission" distinction explains 3 vs 4 well.
      *   The "Foreseeability" distinction explains 1 vs 2 well.
      *   The "Ownership" distinction explains 5.
      *   The "Structural" distinction explains 6.
      *   *Unifying Thread:* **Responsibility tracks the *locus of reasonable intervention* weighted by the *moral cost of error*.**
      *   *Let's call it:* **The Principle of Weighted Intervention.**
      *   *Formula:* Responsibility = (Capacity to Intervene) × (Moral Cost of Error) / (Reasonableness of Reliance).
      *   *Case 3:* High Capacity (button), High Moral Cost (Death), Low Reasonableness of Reliance (War is chaotic). = Blame.
      *   *Case 4:* High Capacity (second look), High Moral Cost (Death), *High* Reasonableness of Reliance (2 years data, AI > Human). = No Blame.
      *   *Case 1:* Zero Capacity (brakes too late), High Moral Cost. = No Blame (just pay).
      *   *Case 2:* High Capacity (design constraints), High Moral Cost (economy), Low Reasonableness (didn't model interactions). = Blame.

      *   *Wait, one nuance:* In Case 3, the user says overriding 99/100 times gets people killed. This implies reliance *is* rational statistically. So "Reasonableness of Reliance" isn't the differentiator between 3 and 4.
      *   *The differentiator must be the Moral Cost.* We demand *higher* certainty for killing than for healing. Or, we demand a *human conscience* absorb the guilt of killing, whereas we don't demand a human absorb the guilt of a missed diagnosis if the stats were right.
      *   *Key Insight:* **The "Moral Buffer" Theory.** In lethal contexts, the human is required not for accuracy, but for *accountability*. In medical contexts, the human is required for *accuracy*. If accuracy is solved, the medical human is redundant. If accountability is the goal, the lethal human is never redundant.

  7.  **Finalizing the Plan:**
      *   Validate the "Risk Envelope" idea but suggest it needs a "Moral Valence" modifier.
      *   Name the principle: **The Principle of Non-Delegable Moral Agency.**
      *   Resolve 3 vs 4: Killing requires a human conscience; Healing requires a competent diagnostician.
      *   Resolve 1 vs 2: Foreseeability of systemic risk vs. edge case.
      *   New Case (Vessel): Apply the principle. It's property damage (like lawnmower) but in public space (like taxi). Likely strict liability on the operator/institution.

  8.  **Writing the Response:** (Iterative refinement during drafting)
      *   Make sure to explicitly answer: "Which verdict does it force me to give up?"
