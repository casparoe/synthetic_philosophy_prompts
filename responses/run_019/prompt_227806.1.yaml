      *   *Better Fit:* **"The Duty of Commensurate Oversight."** The required level of human oversight is proportional to the *irreversibility and moral gravity* of the potential harm, not just the statistical reliability of the system.
      *   *Let's try to fix the User's "Risk Envelope" idea:* It's not just about the *design* risk envelope, it's about the *moral* risk envelope.
