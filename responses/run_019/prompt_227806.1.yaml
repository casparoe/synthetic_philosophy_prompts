      *   We hold humans responsible for *commission* (active killing via AI) even if rational to defer. We excuse humans for *omission* (failing to catch AI error in healing) if rational to defer.

  5.  **Drafting the Response:**

      *   **Acknowledge the strength of the user's intuition:** The "Risk Envelope" idea is close but misses the *moral valence* of the action.
      *   **Propose the Principle:** **"The Principle of Non-Delegable Moral Agency in Lethal/Coercive Contexts."** (Or broader: "Moral Gravity of the Output").
      *   **Explain Case 3 vs. 4:** It's not about reliability; it's about *killing vs. healing*. In lethal force, the human must be the "moral buffer." In medicine, the human is a "safety net" that can be retired if the tool is better.
