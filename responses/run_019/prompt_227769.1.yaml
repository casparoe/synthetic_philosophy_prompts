answer: |-
  Daniel: Look, if we take Mira's constraints seriously, the trading job is the robust choice. She expects to donate $100,000 annually after a few years. That is concrete capacity to save lives through bednets or cash transfers. The housing policy role is noble, but its causal impact is diffuse. If she takes the research job, she becomes one more voice in a crowded advocacy landscape. If she takes the trading job, she becomes a unique funding source. The counterfactual replaceability argument is decisive here: if Mira declines the trading offer, another candidate will accept it. The market activity remains identical, but the altruistic donation disappears.

  Elena: That reasoning isolates Mira from the social context she inhabits. My first objection concerns talent diversion. We are facing a crisis of institutional capacity in urban planning and housing regulation. If the most analytically rigorous students—people like Mira—consistently opt out of direct institutional reform to fund bandaids, we deprive the public sector of the cognitive labor needed to fix root causes. It is not just about the money; it is about who is designing the systems. If Mira leaves, the housing organization loses a specific skillset that a replacement candidate might not possess.

  Daniel: I grant that the housing organization loses Mira's specific skills, but you are conflating average impact with marginal impact. Effective altruism does not claim everyone should earn to give. It argues that individuals should assess where their specific marginal contribution is highest. Mira might be a talented researcher, but is she the pivotal actor who tips the scale on housing legislation? That seems uncertain. Conversely, her earning potential is high and likely above the replacement trader's altruistic output. You are assuming the political work is valuable merely because it is structural, but structural change is often slow, contested, and fails to materialize.

  Elena: I am not assuming success based on labels; I am arguing that the uncertainty cuts both ways. However, my second point addresses the social norms Mira's choice reinforces. This is the cumulative pipeline effect. Mira is visible in our seminar. If she chooses the trading firm, it signals to peers that high-earning careers are the primary venue for moral action. Over time, this shifts the ambition of our cohort. We risk creating a culture where finance is virtuous by association, drawing more talent away from governance. The harm isn't just Mira's absence from housing policy; it is the downstream effect on us.

  Daniel: That is a legitimate concern about movement branding, but it conflates individual duty with collective strategy. Mira's obligation is to do the most good she can, not to manage the aesthetic of our career choices. If the trading job is genuinely neutral socially, as the case suggests, then her participation doesn't validate the industry's ethics. Furthermore, relying on the pipeline argument risks paralysis. If every altruist worries about the signal their job sends, no one takes high-impact roles that look controversial. We should distinguish between what is optimal for Mira versus what is optimal for the movement.

  Elena: But the movement is composed of Miras. You cannot separate the two so cleanly. This leads to my third objection: measurability bias. You favor the trading job because the $100,000 is quantifiable. You can model the lives saved by donations precisely. The housing policy impact is hard to measure because it involves legislative lag and shared credit. Effective altruism systematically biases toward outcomes that are immediate and attributable. By choosing the trading job, Mira reinforces a methodology that undervalues complex structural interventions simply because they resist easy modeling.

  Daniel: I concede that measurability bias is a real risk within the community. We often overweight what we can count. However, skepticism about political work isn't just about measurement; it is about reliability. Well-intentioned policy advocacy often produces unintended consequences or gets watered down in committee. I am not treating the housing impact as known to be small, but as highly uncertain. If Mira donates the $100,000, the utility is relatively secure. If she pursues the policy work, the expected value might be higher, but the variance is massive.

  Elena: I will concede that direct aid is proven and robust. If Mira's goal is to guarantee some good is done regardless of systemic failure, the donations win. But that concession reveals a divergence in our moral premises. You prioritize guaranteed marginal utility; I prioritize the obligation to attempt structural repair even if success is probabilistic. Here is the empirical premise that would change my mind: if you could demonstrate that the trading firm's activities have negative externalities outweighing the value of her donations, I would agree she must refuse the offer. The case says "socially neutral," but if that is false, your replaceability argument collapses.

  Daniel: That is fair. If the trading involves exploitative high-frequency strategies that destabilize markets, the neutrality claim fails, and the earning-to-give calculus breaks. My mind would change if evidence showed the housing organization has a credible pathway to influencing legislation comparable to the certainty of her donations. Right now, we are guessing at the policy impact. But regarding our disagreement, I think we differ on scope. I see this as Mira's individual duty to maximize expected value. You seem to view it as a question of social norms that effective altruism encourages.

  Elena: Precisely. I am arguing that effective altruism functions as an institutional practice that shapes career pipelines. If the norm becomes "earn to give unless the policy job is provably superior," we systematically underinvest in political infrastructure. My mind would change if there were evidence that earning to give actually correlates with increased political engagement later, or if the housing organization admitted they have reached diminishing returns on staffing. Without that, I worry we are optimizing individuals at the expense of the system.

  Daniel: So the remaining disagreement is whether Mira should act as a solitary utility maximizer or as a stakeholder in a broader division of moral labor. If the obligation is individual, the trading job likely wins on expected value. If the obligation is collective role differentiation, the housing job might be necessary even if suboptimal for her personally.

  Elena: And whether we treat uncertainty as a reason to retreat to quantifiable interventions or as an inherent cost of addressing root causes. We agree that Mira wants to do good. We disagree on whether "doing good" means maximizing immediate output or sustaining the institutions that determine output in the long run.

  Daniel: Then we cannot resolve this without settling whether the primary unit of moral analysis is the act or the practice.

  Elena: Or whether we trust the market to remain neutral while we fund the charities that clean up its messes.

  Daniel: Which brings us back to whether that neutrality is an empirical fact or a convenient assumption.

  Elena: It seems we need more data on both the trading firm's externalities and the housing org's leverage before Mira decides.

  Daniel: Agreed. But until then, she has to choose based on her best estimate of counterfactual impact.

  Elena: And I maintain that her best estimate must include the cost to the norm structure she inhabits.

  Daniel: Which I maintain is secondary to the lives she could save directly.

  Elena: Unless those lives are saved only because the system remains broken.

  Daniel: Then we are back to the beginning.

  Elena: We are. But at least we know why.
