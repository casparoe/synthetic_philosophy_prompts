answer: |-
  ### Specification for a Theory of the Free Will Worth Wanting

  This specification outlines the necessary and sufficient conditions for a theory of agency that satisfies the deep normative intuitions behind "free will worth wanting" (FWWW), distinct from mere semantic analysis or legal compatibilism. It prioritizes the *substance* of agency over the *label* of freedom.

  #### I. Phenomenological and Case Constraints
  A viable theory must provide distinct verdicts or explanations for the following scenarios without ad hoc adjustments.

  1.  **The Manipulation Case (e.g., Mele's Zygote):**
      *   *Requirement:* Must distinguish between an agent determined by natural history and an agent determined by a manipulator, even if the causal chains are identical.
      *   *Consideration:* If history doesn't matter, freedom is merely a snapshot property, undermining the intuition that bypassing control negates responsibility.
  2.  **Coercion vs. Compulsion:**
      *   *Requirement:* Must distinguish external threat (gun to head) from internal pathology (kleptomania).
      *   *Consideration:* Both constrain options, but only the latter attacks the *will* itself. A theory collapsing these fails to explain why we pity the addict but excuse the coerced.
  3.  **The Willing vs. Unwilling Addict (Frankfurt):**
      *   *Requirement:* Must account for why the addict who identifies with their craving retains a degree of agency/responsibility that the repentant addict does not.
      *   *Consideration:* Freedom must track internal endorsement, not just behavioral output.
  4.  **Weakness of Will (Akrasia):**
      *   *Requirement:* Must explain how an agent can act against their own best judgment without ceasing to be the author of the action.
      *   *Consideration:* If acting against judgment implies the action wasn't "free," moral struggle becomes impossible.
  5.  **Frankfurt-Style Overdetermination:**
      *   *Requirement:* Must adjudicate moral responsibility in cases where alternative possibilities are removed by a counterfactual intervener who never acts.
      *   *Consideration:* Tests whether "Ability to Do Otherwise" (ADO) is necessary for responsibility.
  6.  **The Predictable Chooser:**
      *   *Requirement:* Must preserve freedom for an agent whose choices are perfectly predictable by a super-intelligence, provided the prediction does not cause the choice.
      *   *Consideration:* Freedom cannot depend on epistemic opacity (ignorance of the future).

  #### II. Conceptual Distinctions
  The theory must maintain the following structural separations. Collapsing them renders the theory reductionist in a way that loses the "worth wanting" element.

  1.  **Freedom of Action vs. Freedom of the Will:**
      *   *Requirement:* Distinguish doing what you want (action) from wanting what you want (will).
      *   *Consideration:* A slave may act freely within chains, but lacks freedom of the will. FWWW primarily targets the latter.
  2.  **Responsibility vs. The Reasonable Desire for Freedom:**
      *   *Requirement:* Distinguish the conditions for blame/credit (social practice) from the metaphysical status required for deep satisfaction (autonomy).
      *   *Consideration:* One might deserve blame (compatibilist sense) yet still lack the "god-like" self-creation we secretly crave (libertarian sense). A theory must acknowledge this gap.
  3.  **Local Choice vs. Global Autonomy:**
      *   *Requirement:* Distinguish freedom in a single instance from the capacity to shape a life narrative over time.
      *   *Consideration:* FWWW is often about life-shaping power, not just the micro-physics of a single decision.

  #### III. Empirical and Theoretical Constraints
  1.  **Naturalistic Closure:**
      *   *Requirement:* The mechanism of choice cannot violate established laws of physics (e.g., conservation of energy).
      *   *Consideration:* Non-negotiable for a truth-aimed theory. Magic is not a solution.
  2.  **Intelligibility of Control:**
      *   *Requirement:* The source of indeterminacy (if any) must enhance control, not diminish it.
      *   *Consideration:* Randomness is not freedom. If the choice is undetermined *and* unexplained, it is luck, not agency.

  ---

  #### IV. Classification of Requirements
  Here we distinguish between constraints any naturalistic theory must meet and those demanded by specific philosophical camps.

  | Requirement | Status | Camp / Rationale |
  | :--- | :--- | :--- |
  | **Naturalistic Closure** | **Non-Negotiable** | *All.* Contradicting physics renders the theory false. |
  | **Distinction: Coercion vs. Choice** | **Non-Negotiable** | *All.* Without this, law and morality lose functional utility. |
  | **Intelligibility of Control** | **Non-Negotiable** | *All.* Randomness cannot ground responsibility. |
  | **Robust ADO (Categorical)** | **Parochial** | *Leeway Libertarians.* Demands genuine branching futures. |
  | **Ultimate Sourcehood (Causa Sui)** | **Parochial** | *Source Libertarians.* Demands the agent be the uncaused cause of their will. |
  | **Hierarchical Endorsement** | **Parochial** | *Hierarchical Compatibilists (Frankfurt).* Demands 2nd-order volitions. |
  | **Reasons-Responsiveness** | **Parochial** | *Semicompatibilists (Fischer).* Demands mechanism sensitivity to reasons. |
  | **Historical Conditions** | **Parochial** | *Historical Compatibilists.* Demands the *genesis* of the will matters (vs. structuralists). |
  | **Blame as Forward-Looking** | **Parochial** | *Strawsonians/Dennett.* Demands responsibility be about regulation, not desert. |

  ---

  #### V. Joint Satisfiability: ADO, Ultimate Sourcehood, and Naturalism
  **Can the Ability to Do Otherwise (ADO) and Ultimate Sourcehood (US) be jointly satisfied in a naturalistic picture?**

  **No.** Not in their robust, pre-theoretical senses.
  1.  **Naturalism + Determinism:** Preserves intelligibility but eliminates Robust ADO and Ultimate Sourcehood (the past + laws fix the future).
  2.  **Naturalism + Indeterminism:** Preserves Robust ADO (branching futures) but undermines Ultimate Sourcehood and Control (the choice becomes probabilistic luck).
  3.  **Ultimate Sourcehood:** Requires the agent to determine the will without being determined by prior causes. In a naturalistic picture, this requires **Agent-Causation**. However, Agent-Causation typically posits a causal primitive that sits outside the event-causal order, violating **Naturalistic Closure** or rendering the mechanism **Unintelligible**.

  **Conclusion:** You can have Naturalism + Compatibilist-ADO (conditional) + Derivative Sourcehood. You can have Naturalism + Libertarian-ADO + No Control (Luck). You cannot have Naturalism + Libertarian-ADO + Ultimate Sourcehood + Intelligible Control. One leg of this tetrahedron must break.

  ---

  #### VI. The Single Exclusionary Requirement
  The single requirement that excludes the most popular accounts (specifically **Compatibilism** and **Event-Causal Libertarianism**) is:

  **The Requirement of Intelligible Ultimate Sourcehood.**

  *   **Why it excludes Compatibilism:** Compatibilists (the current majority) explicitly deny Ultimate Sourcehood is necessary or possible. They settle for *derivative* authorship (the action flows from *my* character, even if *my* character was caused by the past). This requirement demands more.
  *   **Why it excludes Event-Causal Libertarianism:** Libertarians who rely on quantum indeterminacy to secure ADO fail the "Intelligible" clause. If the choice is not determined by the agent's reasons, it is random. If it is determined by the agent's reasons, it looks determined. They cannot explain *how* the agent is the ultimate source without invoking magic or luck.
  *   **Who it leaves:** Only **Agent-Causal Libertarians** (who posit a distinct ontological category for agents) attempt to meet this, but they typically fail the **Naturalistic Closure** constraint.

  Thus, this requirement reveals that the "Free Will Worth Wanting" in the robust folk sense may be **nomologically impossible**.

  ---

  #### VII. Brief Scoring of Named Views

  *   **Hard Determinism / Hard Incompatibilism:**
      *   *Score:* Fails FWWW.
      *   *Reason:* Satisfies Naturalism and Intelligibility, but explicitly denies the existence of the freedom worth wanting.
  *   **Classical Compatibilism (Hume/Ayer):**
      *   *Score:* Fails FWWW (by this specification).
      *   *Reason:* Collapses Freedom of Will into Freedom of Action. Fails Ultimate Sourcehood.
  *   **Hierarchical Compatibilism (Frankfurt):**
      *   *Score:* Partial Pass.
      *   *Reason:* Handles Addiction/Will distinctions well. Fails Ultimate Sourcehood (regress problem: who endorses the second-order desire?).
  *   **Reasons-Responsiveness (Fischer & Ravizza):**
      *   *Score:* Partial Pass.
      *   *Reason:* Excellent handling of Manipulation and Frankfurt cases. Explicitly sacrifices ADO and Ultimate Sourcehood.
  *   **Event-Causal Libertarianism (Kane):**
      *   *Score:* Fails Intelligibility.
      *   *Reason:* Attempts to locate indeterminacy in "efforts of will," but struggles to show how noise translates to control rather than luck.
  *   **Agent-Causal Libertarianism (Chisholm/Rowe):**
      *   *Score:* Fails Naturalism.
      *   *Reason:* Meets Ultimate Sourcehood and ADO, but posits a causal mechanism incompatible with a closed physical order.
  *   **Illusionism / Fictionalism:**
      *   *Score:* Pragmatic Pass.
      *   *Reason:* Admits the theory is false but argues the belief is necessary for the "worth wanting" benefits.

  **Summary:** The specification demands a naturalistic mechanism that grants an agent ultimate, non-derivative control over the formation of their will. No existing account satisfies all non-negotiable constraints simultaneously. The "Free Will Worth Wanting" remains a regulative ideal rather than an achieved theoretical description.
