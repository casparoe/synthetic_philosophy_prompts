answer: |-
  You have no need to apologise; this is precisely the sort of observation that keeps philosophers of technology awake at night. You have described a phenomenon that is increasingly discussed in both software engineering circles and academic literature, though it lacks a single, universally agreed-upon label.

  Your analogy of the satnav is excellent, and it points directly to the core issue. Here is a breakdown of the existing terminology, the specific distinction you are asking for regarding compilers, and a proposal for how to name this specific coding variant.

  ### 1. The General Shape: The Paradox of Automation
  The broad pattern you described—where individually sensible reliance on a tool leads to a collective loss of ability, unnoticed until failure—is most rigorously defined in human factors engineering as **The Paradox of Automation** (coined by Lisanne Bainbridge in 1983).

  Bainbridge argued that as automated systems become more efficient, the human operator's role becomes more critical but simultaneously more difficult. The automation handles the routine work, denying the human the practice required to maintain the skills needed to handle the exceptions. When the automation fails (or encounters a situation it wasn't trained for), the human is left 'out of the loop', lacking the situational awareness to intervene.

  In psychology, this is often linked to **Cognitive Offloading** leading to **Skill Fade** or **Cognitive Atrophy**. You are outsourcing the cognitive labour of 'holding the map in your head' to the device. As you noted, the loss is latent; you do not notice the atrophy until you attempt to lift the weight without the machine.

  ### 2. The Specific Coding Variant: Epistemic Atrophy
  For the specific case of software engineering, where the artefact being lost is *understanding of a system you ostensibly built*, the most precise term is **Epistemic Atrophy**.

  *   **Epistemic** relates to knowledge and justification (how we know what we know).
  *   **Atrophy** captures your muscle analogy: the degradation of a capability due to lack of use.

  Some researchers in the philosophy of AI are also beginning to use the term **Epistemic Debt**. This is a deliberate play on 'technical debt'. Technical debt is the future cost incurred by choosing an easy technical solution now. Epistemic debt is the future cost incurred by choosing not to understand the solution now. You are borrowing comprehension from the model, with the interest payable when the system breaks and the model cannot explain why.

  Another relevant concept is **Epistemic Opacity**. A system is epistemically opaque when its internal workings are inaccessible to the user. Traditionally, this applied to users of software. Your observation is more profound: the *creators* of the software now find it opaque. This is sometimes called **Creator Opacity**.

  ### 3. The Line Between This and Ordinary Tool Use
  You asked where the line is drawn between this and using compilers or libraries. This is the crucial distinction, and it rests on **what is being abstracted**.

  **Compilers abstract Mechanism.**
  When you write high-level code, you are still defining the *logic* and the *intent*. You decide the control flow, the data structures, and the business rules. The compiler translates your *known* logic into machine instructions (mechanism) that you do not wish to manage. You do not need to understand the register allocation to know *what* the program is supposed to do. The 'map' of the logic remains in your head; only the 'terrain' of the machine code is hidden.

  **AI Assistants abstract Intent.**
  When you accept a diff from an AI assistant, you are often outsourcing the *logic* itself. You provide a prompt (a goal), and the model provides the implementation *and* the reasoning path to get there. If you do not rigorously reconstruct that reasoning, the 'map' is never drawn in your head.

  Therefore, the boundary can be defined as follows:
  *   **Ordinary Tool Use:** The tool executes a **deterministic transformation** of logic you possess. (You know the 'what'; the tool handles the 'how'.)
  *   **Epistemic Atrophy:** The tool performs a **probabilistic generation** of logic you do not possess. (The tool suggests the 'what' and the 'how'; you only validate the output.)

  If the tool removes the need for you to understand *why* a line of code exists, rather than just *how* it is executed, you have crossed the line from abstraction into delegation of understanding.

  ### 4. A Proposal for a Name
  If you wish to introduce this concept to your team without resorting to vague complaints, I would suggest adopting the term **Epistemic Debt**.

  It resonates well with engineers because it frames the problem in terms of risk and liability, similar to technical debt. You might define it thus:

  > **Epistemic Debt:** The accumulated risk resulting from merging code whose design rationale exists outside the team's collective understanding. Unlike technical debt, where the code works but is messy, epistemic debt occurs when the code works but the *reasoning* is missing. The interest is paid in increased mean-time-to-recovery (MTTR) when failures occur, as the team must reverse-engineer the intent rather than simply fixing a bug.

  This definition avoids sweeping in compilers because compilers do not generate design rationale; they merely translate it. It also highlights the latent nature of the problem: the 'debt' is invisible until the 'repayment' is demanded by a production incident.

  ### Summary
  *   **General Phenomenon:** The Paradox of Automation / Cognitive Atrophy.
  *   **Specific Coding Phenomenon:** Epistemic Atrophy or Epistemic Debt.
  *   **The Distinction:** Compilers abstract *mechanism* (implementation details); AI assistants abstract *intent* (design decisions).
  *   **Recommendation:** Use **Epistemic Debt** to communicate the risk to stakeholders. It accurately conveys that you are borrowing understanding from the future, and the interest rates are steep.

  It is a very sharp observation you have made. Recognising the atrophy before the muscle fails entirely is the first step in preventing it.
