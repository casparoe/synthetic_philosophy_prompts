answer: |-
  You have correctly identified that the stalemate between methodological individualism and holism is rarely about ontology (both agree people exist; most agree structures exist in some sense) but about *explanatory jurisdiction*. The dispute is over where the "buck stops" in a causal chain and what counts as a fundamental explanation.

  To adjudicate this, we need a set of desiderata that any successful theory of social ontology must satisfy. Below are the criteria, divided into those that are broadly non-negotiable (constraints) and those that represent theoretical commitments (camp-specific desiderata), followed by an analysis of their incompatibilities and a brief evaluation of the three major positions.

  ### I. The Desiderata

  #### 1. Ontological Anchoring (Non-Negotiable Constraint)
  **The Requirement:** Social facts cannot float free of human activity. There must be an account of how social entities are sustained by individual actions, beliefs, or physical substrates.
  **Motivation:** Without this, we risk mystification or reification (treating ideas as ghosts). If a currency loses value, something must have changed in the world—specifically, in the behaviors and expectations of the people using it. A theory that posits "The Economy" as an agent distinct from all economic actors fails this test.

  #### 2. Explanatory Autonomy (Camp Commitment: Holist)
  **The Requirement:** Social-level explanations must be legitimate without constant translation into individual-level terms. Social laws or regularities should be citable as causes in their own right.
  **Motivation:** **Market constraints.** An individual cannot decide to sell a house for double the market rate simply by willing it; the "market" constrains their choice. Explaining this constraint by listing every other buyer's bid is practically impossible and obscures the structural force at play. The social fact (the price level) explains the individual outcome better than the aggregate of individual bids does.

  #### 3. Microfoundational Transparency (Camp Commitment: Individualist)
  **The Requirement:** Every macro-level explanation must, in principle, be translatable into a mechanism involving individual agents and their interactions. "Black box" social laws are unacceptable.
  **Motivation:** **Bank runs.** To say "The bank failed due to a loss of confidence" is shorthand. The actual mechanism is a specific sequence of individual withdrawals based on individual beliefs about others' withdrawals. Without the microfoundation, we cannot distinguish a bank run from a solvency crisis, nor can we design interventions (like deposit insurance) that target the specific individual incentives causing the run.

  #### 4. Downward Causation (Non-Negotiable Constraint)
  **The Requirement:** The account must explain how social facts causally influence individual behavior.
  **Motivation:** **The stickiness of norms.** An individual does not choose their accent or their queueing behavior in a vacuum; they are shaped by pre-existing social norms. If social facts are real, they must be able to "reach down" and alter individual dispositions. A theory that treats norms as *only* the sum of individual choices cannot explain why a new individual entering the group conforms to the existing pattern.

  #### 5. Multiple Realizability (Non-Negotiable Constraint)
  **The Requirement:** Social kinds must be identifiable across different configurations of individuals.
  **Motivation:** **Institutional persistence.** A corporation remains the same legal entity even if every single employee, CEO, and shareholder is replaced over a decade. If social facts were identical to specific sets of individuals, the corporation would cease to exist with every turnover. The theory must account for the stability of the social form despite the flux of the material base.

  #### 6. Normative Distinctness (Non-Negotiable Constraint)
  **The Requirement:** The account must distinguish between brute behavioral regularities and institutional facts governed by constitutive rules.
  **Motivation:** **Debt vs. Morning Traffic.** Morning traffic is a regularity of behavior (everyone drives at 8 AM). A debt is an institutional fact; it exists only because of a system of rules that assign status functions (e.g., "X counts as Y in context C"). You can have traffic without rules, but you cannot have debt without the institutional framework. A theory that reduces debt to mere expectation of payment fails to capture the *obligation* inherent in the social fact.

  ---

  ### II. Constraints vs. Commitments

  **The Non-Negotiable Constraints:**
  Any viable theory must satisfy **Ontological Anchoring**, **Downward Causation**, **Multiple Realizability**, and **Normative Distinctness**.
  *   If you deny Anchoring, you are a mystic.
  *   If you deny Downward Causation, you cannot explain socialization or constraint.
  *   If you deny Multiple Realizability, you cannot explain institutional persistence.
  *   If you deny Normative Distinctness, you cannot distinguish society from a herd of animals.

  **The Camp-Specific Commitments:**
  The disagreement lies between **Explanatory Autonomy** (Holist) and **Microfoundational Transparency** (Individualist).
  *   **The Individualist** demands that Autonomy be sacrificed for Transparency. They argue that if you can't show the individuals, you haven't explained anything.
  *   **The Holist** demands that Transparency be sacrificed for Autonomy. They argue that requiring microfoundations for every social law makes sociology impossible and misses the emergent properties of the system.

  ---

  ### III. Incompatibilities and The Pivot

  #### The Incompatibility: Causal Exclusion vs. Explanatory Autonomy
  The central tension arises between **Ontological Anchoring** and **Explanatory Autonomy**.
  If social facts are *fully* anchored in individuals (Supervenience), then every causal power of the social fact is arguably exhausted by the causal powers of the individuals. This leads to the **Causal Exclusion Problem**: If the individuals are doing all the causal work, what work is left for the "social fact" to do?
  *   To save **Explanatory Autonomy**, the Holist must argue that the social configuration has causal powers *over and above* the sum of the parts (Strong Emergence).
  *   To save **Ontological Anchoring** (strictly construed), the Individualist must argue that "social causation" is merely a shorthand for complex individual interaction (Weak Emergence/Reduction).

  You cannot have it both ways without qualification. You cannot claim that social facts are *nothing but* individuals (Anchoring) and simultaneously claim they have *independent* causal powers that override individual dispositions (Strong Autonomy).

  #### The Pivot Point: The Demand for Explanatory Closure
  The single requirement that forces the choice between camps is **Where Explanatory Closure is Permitted.**
  *   **Individualist Pivot:** Explanation is only complete when it reaches the intentional states of agents. (Requirement: Microfoundational Transparency).
  *   **Holist Pivot:** Explanation is complete when it identifies the structural constraints, regardless of the underlying mechanism. (Requirement: Explanatory Autonomy).

  If you demand that *all* causal chains must be traceable to individual psychology to be valid, you are an Individualist. If you accept that structural constraints can terminate an explanation even if the individual mechanism is opaque, you are a Holist.

  ---

  ### IV. Evaluation of Positions

  **1. Strict Methodological Individualism**
  *   **Performance:** Satisfies **Ontological Anchoring** and **Microfoundational Transparency** perfectly.
  *   **Failure:** Struggles with **Explanatory Autonomy** and **Multiple Realizability**. It often treats institutions as mere "fiction" or shorthand, making it difficult to explain why institutions persist despite total turnover of members or why they constrain individuals so rigidly. It risks explaining away the very phenomenon it seeks to study.

  **2. Strong Holism (Structuralism)**
  *   **Performance:** Satisfies **Explanatory Autonomy**, **Downward Causation**, and **Multiple Realizability** well. It captures the coercive power of norms and markets.
  *   **Failure:** Risks violating **Ontological Anchoring**. By treating social facts as sui generis, it often reifies structures, making them appear as metaphysical entities distinct from human action. It struggles to explain how social change occurs (if structures determine individuals, how do individuals ever change the structure?).

  **3. Emergentist Middle View (Critical Realism/Non-Reductive Physicalism)**
  *   **Performance:** Attempts to satisfy all constraints by positing that social facts *emerge* from individuals but possess *emergent causal powers* once established. It respects **Anchoring** (social facts depend on people) and **Autonomy** (social facts constrain people).
  *   **Failure:** Metaphysically costly. It must walk a tightrope to avoid the **Causal Exclusion Problem**. It often lacks the **Microfoundational Transparency** Individualists demand, leaving the mechanism of emergence vague. However, it is currently the most robust framework for handling **Normative Distinctness** (e.g., Searle's status functions) without resorting to mysticism.

  **Verdict:** The Emergentist view best satisfies the *non-negotiable constraints*, but it requires abandoning the Individualist's demand for absolute Microfoundational Transparency in every instance. If your friend demands that *every* explanation bottom out in psychology, she is prioritizing a methodological commitment over the phenomenological reality of social constraint. If you demand that social facts are *nothing but* psychology, you are prioritizing ontology over explanatory utility. The settlement lies in accepting **Explanatory Pluralism**: social facts are ontologically anchored in individuals but explanatorily autonomous from them.
