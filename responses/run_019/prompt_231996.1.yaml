          *   Case: Teaching a child not to lie.

      *   *Refinement on "Substantive vs. Verbal":* Some disagreements might be about how we use the word "principle." Need to flag this.
      *   *Refinement on "Predictions":* What does each side expect to find in the concrete case?

  6.  **Drafting Section 3 (Residual Disagreement):**
