  7.  **Review and Refine:**
      *   *Check Tone:* Is it too aggressive? Make it more "Joint Statement."
      *   *Check Constraints:* Did I cover all specific prompt requirements? (Preamble, Section 1 numbered, Section 2 table with specific columns, Section 3 load-bearing).
      *   *Philosophical Accuracy:* Ensure "pro tanto" and "prima facie" are handled carefully. Particularists (like Dancy) often reject *pro tanto* reasons. Generalists (like McNaughton or Rawls) accept them. The prompt asks for shared claims about the *structure*... such as the distinction between... pro tanto and prima facie. I need to phrase this so the Particularist agrees the *distinction exists in the literature* or agrees on the *conceptual space*, even if they reject one side. Actually, the prompt says "shared claims about the structure of moral thought that both sides accept." A hard particularist might reject *pro tanto* reasons entirely. I must phrase this carefully: They agree on the distinction between *contributory force* and *overall verdict*, even if they disagree on the invariance of the force.
      *   *Wait, re-reading prompt:* "between a reason that is invariant and one that is merely treated as a default." Okay, they can agree on the *conceptual distinction* between these two ideas, even if they disagree on which one obtains.
      *   *Check Section 2:* "Whether the disagreement is substantive or partly verbal." This is a crucial nuance. Often, generalists define principles loosely enough to be unfalsifiable, while particularists define them strictly. This needs to be highlighted.

  8.  **Final Polish:** Check word choice. Ensure "adversarial collaboration" spirit is present (rigor without hostility). (Self-Correction: Make sure the Preamble explicitly states that context sensitivity is *not* the point of contention, as requested).

