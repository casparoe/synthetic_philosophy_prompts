  # JOINT STATEMENT ON THE STRUCTURE OF MORAL REASONS
  **An Adversarial Collaboration between Moral Generalism and Moral Particularism**

  ## PREAMBLE

  We, the undersigned, represent two distinct approaches to meta-ethics and normative theory: Moral Generalism and Moral Particularism. Having engaged in sustained dialectical exchange, we issue this statement to clarify the precise locus of our disagreement, to record our substantial areas of agreement, and to isolate the specific claims upon which the viability of our respective positions turns.

  **The Generalist Position:**
  We hold that morality is fundamentally principled. The moral status of an action is determined by the way it instantiates general features (such as causing pain, breaking a promise, or promoting well-being) that operate as reasons for or against that action. While we acknowledge that the *weight* of these reasons varies by context, we maintain that the *valence* (positive or negative polarity) of a moral reason is invariant. We argue that moral thought and talk presuppose the existence of true, defensible principles that explain why actions are right or wrong, and that moral competence consists, at least in part, in the ability to grasp and apply these principles.

  **The Particularist Position:**
  We hold that the moral relevance of a feature is radically context-dependent. A feature that serves as a reason for action in one case (e.g., causing pleasure) may serve as a reason against action in another, or have no moral relevance at all, depending on the holistic configuration of the situation. We argue that the attempt to codify moral truth into a finite set of principles inevitably fails, resulting either in falsehoods or in trivial tautologies that offer no explanatory power. We maintain that moral competence is a perceptual skill—a capacity to discern what matters in the particular case—rather than the subsumption of cases under rules.

  **Scope of the Debate:**
  We explicitly agree that **context sensitivity is not the point of contention.** Both sides accept that circumstances affect what an agent ought to do. We agree that causing pain in a case of torture is morally distinct from causing pain in a necessary medical procedure or a consensual endurance sport. The debate is not about *whether* context matters, but *how* it matters. Specifically, we disagree on whether the dependence of moral verdicts on context can be captured by true, informative principles, and whether the contributory force of a specific feature remains constant across those contexts. We are arguing about the architecture of moral reasoning, not the existence of moral truth or the complexity of the world.

  ***

  ## SECTION 1: AGREED CLAIMS

  The following propositions are accepted by both parties as the shared foundation for this debate. These claims are non-vacuous; each represents a commitment that could have been rejected but is here affirmed to narrow the field of disagreement.

  1.  **Phenomenological Variance:** Both parties agree that the *moral verdict* on an action can change while the *natural features* of the action remain constant. For example, the fact that an act causes physical pain counts against it in a case of assault, counts neutrally or instrumentally in a case of surgery, and may count in favor of it in a case of consensual athletic training. Both sides must explain this variance without denying the data.
  2.  **Contributory vs. Overall:** Both parties accept the structural distinction between **contributory reasons** (considerations that count in favor of or against an action) and the **overall verdict** (the final judgment of what ought to be done). We agree that an action can be supported by strong reasons yet still be wrong overall, or vice versa.
  3.  **Explanation vs. Restatement:** Both parties agree that a successful moral theory must **explain** verdicts, not merely restate them. A claim that "Action X is wrong because it has the feature of wrongness" is rejected by both sides as vacuous. We agree that moral features (like pain or promise-breaking) are distinct from the verdict itself and are cited as the grounds for that verdict.
  4.  **Invariant vs. Default:** Both parties accept the conceptual distinction between a reason that is **invariant** (possessing a fixed valence that cannot be reversed, only outweighed) and a reason that is a **default** (possessing a valence that holds typically but can be reversed or nullified by context). We disagree on which model fits the data, but we agree these are distinct logical categories.
  5.  **Pro Tanto vs. Prima Facie:** Both parties agree to distinguish between **pro tanto** reasons (which retain their force even when outweighed) and **prima facie** duties (which may dissolve entirely when conflicting with a stronger duty). We agree that clarity on which model is employed is necessary for evaluating the force of a reason in conflict scenarios.
  6.  **Methodological Constraint on Principles:** Both parties agree that for a generalization to count as a genuine moral **principle**, it must be **informative**. A principle that includes an indefinite number of "unless" clauses (e.g., "Do not lie, unless lying is better...") risks collapsing into a mere list of verdicts. The Generalist accepts the burden of showing their principles are not gerrymandered; the Particularist accepts the burden of showing that no non-gerrymandered principle is possible.
  7.  **Evidence of Failure:** Both parties agree on what would constitute evidence against their own view:
      *   **Against Particularism:** If the Generalist can produce a finite set of principles that successfully predicts verdicts in novel, complex cases without resorting to triviality or circularity.
      *   **Against Generalism:** If every proposed principle requires so many exception clauses to handle counterexamples that it becomes unusable for guidance or explanation, or if the "principle" merely summarizes past verdicts without generating new ones.

  ***

  ## SECTION 2: DISAGREEMENTS TABLE

  | Issue | Particularist Formulation | Generalist Formulation | Substantive or Verbal? | The Crux | Concrete Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Polarity of Reasons** | **Holism of Reasons:** A feature (e.g., causing pleasure) can change its **valence** depending on context. It can be a reason for, a reason against, or no reason at all. | **Invariantism:** A feature has a fixed **valence** (e.g., pleasure is always good *pro tanto*). Context changes the **weight** or the **overall balance**, but never flips the sign from positive to negative. | **Substantive.** This is not merely about definitions; it is about the metaphysics of reasons. | **The Nature of Defeaters:** Does a defeating context (e.g., sadism) *outweigh* the good of pleasure (Generalist) or *reverse* the good of pleasure into a bad (Particularist)? | **Case:** Taking pleasure in another's humiliation.<br>**Particularist:** The pleasure itself becomes a negative reason.<br>**Generalist:** The pleasure remains a positive reason, but is massively outweighed by the negative reason of humiliation. |
  | **2. Default Reasons** | **Statistical Default:** To call a reason a "default" is to say it *usually* has a certain valence. There is no normative baseline; there is only frequency and expectation. | **Normative Default:** To call a reason a "default" is to say it has a **standing valence** that holds in the absence of defeaters. It creates a presumption that shifts the burden of proof. | **Partly Verbal / Partly Substantive.** Verbal regarding the word "default"; substantive regarding whether there is a normative "baseline" state. | **Burden of Justification:** In a novel case, must we justify acting against the default (Generalist), or is every case *sui generis* requiring fresh justification (Particularist)? | **Case:** Breaking a trivial promise to buy ice cream.<br>**Particularist:** No presumption against breaking it; we look at the whole context.<br>**Generalist:** There is a presumption against breaking it; the agent must cite a defeater. |
  | **3. Codifiability** | **Uncodifiability:** Any finite set of principles will either be false (due to exceptions) or trivial (due to "ceteris paribus" clauses that hide the real work). Moral truth is not propositionally captureable. | **Codifiability:** In principle, the moral terrain can be mapped by true principles. Complexity does not imply uncodifiability. A complex principle is still a principle. | **Substantive.** Turns on the definition of "principle" vs. "summary." | **Gerrymandering:** At what point does adding exception clauses turn a principle into a disguised list of particular verdicts? | **Case:** Ross's *Prima Facie* Duties.<br>**Particularist:** These are not principles; they are tendencies that fail in specific cases.<br>**Generalist:** These are the principles; the "actual duty" is the calculated output of the system. |
  | **4. Moral Knowledge** | **Perceptual Model:** Competence is a skill of **discernment** (knowing how). It resembles aesthetic judgment. One sees the reason in the situation directly. | **Subsumption Model:** Competence involves **knowledge that**. One recognizes the features and subsumes the case under the correct principle to derive the verdict. | **Substantive.** Concerns the cognitive architecture of the moral agent. | **Role of Theory:** Can a theorist who knows the principles but lacks sensitivity judge better than a sensitive agent who cannot articulate principles? | **Case:** The Moral Sage vs. The Ethicist.<br>**Particularist:** The Sage (who sees particulars) is superior.<br>**Generalist:** The Ethicist (who knows the principles) has a more secure foundation. |
  | **5. Moral Education** | **Cultivation:** We teach by exposing learners to **cases**, narratives, and role models to sharpen their sensitivity. Rules are heuristic crutches to be discarded. | **Instruction:** We teach by imparting **rules and principles**. Cases are illustrations of the principles. Rules are the scaffold of competence. | **Partly Verbal.** Depends on the stage of education (novice vs. expert). | **Transferability:** Can moral skill be transferred via language (principles) or only via experience (cases)? | **Case:** Teaching a child not to lie.<br>**Particularist:** Teach them to see the harm of lying in specific instances.<br>**Generalist:** Teach them the rule "Lying is wrong" as a default constraint. |

  ***

  ## SECTION 3: RESIDUAL DISAGREEMENT AND LOAD-BEARING CLAIMS

  Following this collaboration, we identify that Rows 1 (Polarity) and 3 (Codifiability) are the **load-bearing walls** of our dispute. Rows 2, 4, and 5 are largely derivative; our positions on education and knowledge flow from our commitments regarding the nature of reasons and the possibility of principles.

  **1. The Load-Bearing Issue: Polarity (Holism vs. Invariantism)**
  *   **The Stakes:** If the Particularist is correct that valence can switch, the Generalist's project of summing invariant weights collapses. If the Generalist is correct that valence is fixed, the Particularist's claim of radical context-dependence is reduced to a claim about weight variance, which Generalism can accommodate.
  *   **What Would Move the Particularist:** The Particularist would have to concede if the Generalist can demonstrate a feature (e.g., "torture for fun") that retains its negative valence in *every conceivable possible world* without requiring a *ceteris paribus* clause that effectively says "unless it isn't wrong."
      *   *Concession:* "I would have to admit that some reasons are invariant, which undermines the strong holism thesis central to my view."
  *   **What Would Move the Generalist:** The Generalist would have to concede if it is shown that for any proposed invariant principle, there is a coherent case where the feature acts as a reason for the *opposite* verdict, and this reversal cannot be explained by adding a separate, independent reason (i.e., the feature *itself* changes sign).
      *   *Concession:* "I would have to admit that my principles cannot capture the moral data without becoming trivial, and that moral reasoning is not a matter of weighing invariant forces."

  **2. The Load-Bearing Issue: Codifiability (Principles vs. Lists)**
  *   **The Stakes:** This determines whether morality is a science of laws or an art of judgment.
  *   **What Would Move the Particularist:** The construction of a "decision procedure" or set of principles that successfully guides action in novel, high-stakes dilemmas where intuition is unreliable, without resorting to circularity.
      *   *Concession:* "I would have to admit that principles have explanatory power beyond summarizing past verdicts, and that moral knowledge is propositional."
  *   **What Would Move the Generalist:** The demonstration that every attempt to codify a principle results in a formula so complex that no human agent could use it for guidance, rendering the "principle" explanatorily inert.
      *   *Concession:* "I would have to admit that while moral truth might exist, it is not accessible via principles, and that 'moral theory' in the traditional sense is impossible."

  **Conclusion:**
  We remain in disagreement. However, we agree that the debate is no longer about whether context matters (it does), but about the **metaphysics of moral reasons** and the **limits of codification**. We commit to testing the load-bearing claims above against novel cases and rigorous logical analysis in future work.

  __________________________
  **Signed, The Moral Particularist**

  __________________________
  **Signed, The Moral Generalist**
