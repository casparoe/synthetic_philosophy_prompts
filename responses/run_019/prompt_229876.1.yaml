answer: |-
  # Workshop Title: The Mixed Motive
  **Topic:** Mixed-Strategy Dominance in Iterated Elimination
  **Time:** 75 Minutes
  **Participants:** 16 Undergraduates (8 Row Players, 8 Column Players)
  **Prerequisites:** Payoff matrices, Pure-Strategy Strict Dominance, Iterated Elimination of Dominated Strategies (IEDS).
  **Stakes:** Candy or tokens (redeemable for small prizes like a $5 coffee card for top scorers). Avoid cash to comply with university gambling policies.

  ---

  ## 1. Materials & Setup
  *   **Room:** One large table or desks arranged in two facing rows (8 vs 8).
  *   **Handouts:**
      *   Scorecards (one per student).
      *   Game Matrix A (Stage 1).
      *   Game Matrix B (Stage 2).
      *   "Randomization Contracts" (slips of paper for Stage 2).
  *   **Props:** 8 Coins (or 8 six-sided dice).
  *   **Board:** Whiteboard for tracking aggregate scores and drawing matrices.

  ---

  ## 2. Timeline & Flow

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | 00-05 | **Intro** | Rules, Pairing, Stakes explanation. |
  | 05-20 | **Stage 1** | "The Clean Sweep" (Pure Dominance). 3 Rounds. |
  | 20-25 | **Transition** | Score tally. Introduce Stage 2 Matrix. |
  | 25-40 | **Stage 2A** | "The Stall" (Pure strategies only). 3 Rounds. |
  | 40-45 | **Intervention** | Introduce Coins/Randomization Contracts. |
  | 45-60 | **Stage 2B** | "The Mix" (Mixed strategies allowed). 3 Rounds. |
  | 60-75 | **Debrief** | Formal mapping, Theory, Limitations. |

  ---

  ## 3. Stage 1: The Warm-Up (Pure Dominance)
  **Goal:** Reinforce confidence in Iterated Elimination of Dominated Strategies (IEDS) using pure strategies.

  **The Matrix (Game A):**
  Row Player Payoffs (Column Payoffs are symmetric for simplicity).

  | | **Left** | **Center** | **Right** |
  | :--- | :---: | :---: | :---: |
  | **Top** | 5 | 5 | 0 |
  | **Middle** | 5 | 5 | 0 |
  | **Bottom** | 0 | 0 | 0 |

  *Note: To make it slightly more interesting for IEDS, let's use a standard 3-step elimination.*

  **Revised Game A Matrix (Row Payoffs):**
  | | **L** | **C** | **R** |
  | :--- | :---: | :---: | :---: |
  | **T** | 4 | 2 | 1 |
  | **M** | 3 | 3 | 1 |
  | **B** | 0 | 0 | 0 |

  **Column Payoffs (to ensure they play):**
  | | **T** | **M** | **B** |
  | :--- | :---: | :---: | :---: |
  | **L** | 1 | 1 | 0 |
  | **C** | 2 | 3 | 0 |
  | **R** | 0 | 0 | 0 |

  **Instructions:**
  1.  Pair students (Row 1 vs Col 1, etc.).
  2.  Play 3 rounds. Rotate partners after every round.
  3.  Record choices and points.
  4.  **Rule:** You must select one specific row/column. No randomization.

  **Expected Outcome:**
  *   **Round 1:** Some play Bottom/Right (naive).
  *   **Round 2:** Bottom and Right are eliminated (Strictly dominated by Top/Middle and Left/Center).
  *   **Round 3:** In the remaining 2x2, Center dominates Left for Column; Top dominates Middle for Row. Unique solution (Top, Center).
  *   **Debrief (2 mins):** Ask: "Who played Bottom in Round 3?" (None). "Why?" "It was dominated." "Could you delete it immediately?" "Yes."

  ---

  ## 4. Stage 2: The Trap (Mixed Dominance)
  **Goal:** Create a situation where Pure IEDS stalls, but a strategy is dominated by a *mixture*.

  **The Matrix (Game B):**
  This is the core pedagogical tool.
  *Row Payoffs:*
  | | **Left** | **Right** |
  | :--- | :---: | :---: |
  | **Top** | 0 | 4 |
  | **Middle** | 4 | 0 |
  | **Bottom** | 1 | 1 |

  *Column Payoffs (Symmetric):*
  | | **Top** | **Middle** | **Bottom** |
  | :--- | :---: | :---: | :---: |
  | **Left** | 0 | 4 | 1 |
  | **Right** | 4 | 0 | 1 |

  **Instructions:**
  1.  Keep pairings. Play 3 Rounds. Rotate partners.
  2.  **Rule:** You must select one specific row/column. **No coins yet.**
  3.  Write your choice secretly, reveal simultaneously.

  **The Stall (Rounds 1-3):**
  *   **Rational Analysis:**
      *   Is **Bottom** dominated by **Top**? No (1 > 0 if Col plays Left).
      *   Is **Bottom** dominated by **Middle**? No (1 > 0 if Col plays Right).
      *   **Pure IEDS STALLS.** No pure strategy strictly dominates another.
  *   **In Play:**
      *   Students playing **Bottom** get a guaranteed 1 point.
      *   Students playing **Top/Middle** get 0 or 4 points.
      *   *Crucial:* If Column players are rational, they will try to exploit Row. But since there is no Pure NE, outcomes will fluctuate.
      *   **The Problem:** Students playing **Bottom** will feel "safe" but will notice that Top/Middle players often get 4. However, Top/Middle players also get 0.
      *   **Facilitator Action:** After Round 3, tally the average scores for each strategy on the board.
          *   Avg(Top) ≈ 2.0
          *   Avg(Middle) ≈ 2.0
          *   Avg(Bottom) = 1.0
      *   **Ask:** "Bottom players, you are consistently earning less than the average of the group. Top and Middle are risky, but Bottom is 'safe' and losing. Why?"

  ---

  ## 5. The Intervention: Introducing Randomization
  **Timing:** Minute 40.
  **Script:**
  > "In Stage 1, we deleted strategies that were always worse than another *single* strategy. Here, Bottom isn't worse than Top alone, or Middle alone. But look at the averages.
  >
  > New Rule: You are now allowed to submit a **Randomization Contract**. You can take a coin from me. You write on your slip: 'Heads = Top, Tails = Middle.' You flip privately, record the result, and reveal.
  >
  > You cannot flip mentally. You must use the physical coin to commit. If you choose to play Bottom, you still just write 'Bottom'."

  **The Discovery (Rounds 4-6):**
  *   Students who were losing with **Bottom** will try the coin.
  *   **Math in Play:**
      *   If Col plays **Left**: Coin Mix yields (0.5 × 0) + (0.5 × 4) = **2**. Bottom yields **1**.
      *   If Col plays **Right**: Coin Mix yields (0.5 × 4) + (0.5 × 0) = **2**. Bottom yields **1**.
  *   **Result:** The Mix *strictly dominates* Bottom (2 > 1 in all cases).
  *   **Observation:** By Round 6, almost no one should play Bottom. It has been "eliminated" by the mixture.

  ---

  ## 6. Debrief & Formal Mapping (60-75 mins)

  **Step 1: The Phenomenon (5 mins)**
  *   Ask: "Who played Bottom in Round 6?" (Likely no hands).
  *   Ask: "Did Top dominate Bottom? Did Middle dominate Bottom?" (No).
  *   Ask: "What killed Bottom?" (The 50/50 Mix).
  *   **Board Work:** Write the inequality.
      $$0.5 u(T, L) + 0.5 u(M, L) = 2 > 1 = u(B, L)$$
      $$0.5 u(T, R) + 0.5 u(M, R) = 2 > 1 = u(B, R)$$

  **Step 2: Formal Theory (5 mins)**
  *   **Definition:** A strategy $s_i$ is strictly dominated if there exists a mixed strategy $\sigma_i$ such that $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$.
  *   **Best Response Connection:** In a 2-player game, a strategy is strictly dominated (by pure or mixed) **if and only if** it is **never a best response** to any belief about the opponent.
      *   *Ask:* "Was there any belief about Column (probability $p$ on Left) where Bottom was the best reply?"
      *   *Show:* Expected Utility of Top = $4(1-p)$. Middle = $4p$. Bottom = $1$.
      *   Bottom is only best if $1 > 4(1-p)$ AND $1 > 4p$. This implies $p > 0.75$ and $p < 0.25$. Impossible. Thus, Bottom is never a best response.

  **Step 3: Common Knowledge of Rationality (5 mins)**
  *   Why do we care about elimination?
  *   If I know you are rational, I know you won't play Bottom (because you can see the Mix beats it).
  *   If I know you know I am rational, I know you know I won't play Bottom.
  *   This shrinks the game to the 2x2 Matching Pennies core (Top/Middle vs Left/Right).
  *   **Takeaway:** IEDS with mixed strategies captures the implications of rationality more fully than pure IEDS.

  ---

  ## 7. Troubleshooting: What Goes Wrong & How to Fix

  | Problem | Why it happens | Facilitator Fix |
  | :--- | :--- | :--- |
  | **Students don't find the mix.** | They view the coin as "gambling" rather than a strategic tool. | **Prompt:** "If you could play Top and Middle at the same time, what would your average score be against Left?" Guide them to the arithmetic mean. |
  | **Students randomize mentally.** | They write "Top" but flip a coin in their head. | **Enforce Rule:** "I need to see the physical coin flip on the contract. No mental flips." This ensures the *commitment* aspect is tangible. |
  | **Column players don't adapt.** | If Column players keep playing Left, Row players prefer Middle. | **Remind:** "Column players, you want to minimize Row's payoff (in this zero-sum setup) or maximize your own. If Row is mixing, what should you do?" (Leads to Mixed NE discussion, but keep focus on Row's elimination of Bottom). |
  | **Confusion between Dominance vs. NE.** | Students think the Mix is the Nash Equilibrium. | **Clarify:** "The Mix *eliminates* Bottom. The game that remains (2x2) still has no pure NE. We are talking about what we can *delete*, not necessarily what we *play* at the end." |

  ---

  ## 8. Limitations: What the Game Cannot Reproduce
  **Explicitly state this to the class during debrief:**

  1.  **The "Belief" Aspect:** In the game, students see *realized* payoffs. In theory, dominance relies on *expected* utility against *all possible* opponent strategies, not just the ones opponents happened to play in 3 rounds.
      *   *Facilitator Note:* You must supply the logic that "Even if Column played Left every time, the Mix (2 pts) still beats Bottom (1 pt). It works against *any* strategy, not just the ones you faced."
  2.  **Commitment Technology:** In the real world (and in standard theory), playing a mixed strategy doesn't require a coin; it requires the *opponent* to be uncertain. In this game, we used coins to force the math to work visibly. In reality, you just *are* unpredictable.
      *   *Facilitator Note:* "We used coins to prove the math. In a real negotiation, you don't flip a coin; you just ensure your opponent cannot predict you, which yields the same expected payoff."
  3.  **Risk Aversion:** The payoffs are linear points. Real students might be risk-averse. A guaranteed 1 (Bottom) might feel better than a risky 2 (Mix) to a very risk-averse person, even if 2 > 1 in expectation.
      *   *Facilitator Note:* "Micro theory assumes risk neutrality over these small stakes. If you preferred the safe 1, you were being risk-averse, not irrational, but dominance assumes we care only about expected value."

  ---

  ## 9. Final Checklist for Facilitator
  *   [ ] Print 16 Scorecards.
  *   [ ] Print 16 Matrix A sheets.
  *   [ ] Print 16 Matrix B sheets.
  *   [ ] Prepare 8 "Randomization Contract" slips.
  *   [ ] Bring 8 Coins.
  *   [ ] Bring Candy/Prizes.
  *   [ ] Pre-calculate the "Never Best Response" algebra for the whiteboard.
  *   [ ] Watch the clock strictly (Stage 2B often runs long).
