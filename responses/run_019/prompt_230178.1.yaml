      *   **Key Philosophical Concepts:**
          *   *Tu Quoque Fallacy:* Ad hominem variant. "You do it too" doesn't disprove the claim.
          *   *Moral Standing/Authority:* Does a violator of a norm have the right to enforce it on others?
          *   *Nature of Blame:* Is it a statement of fact ("You did wrong") or a speech act/relationship repair ("I hold you accountable")?
          *   *Hypocrisy:* Is it merely inconsistent behavior, or does it corrupt the moral address?

