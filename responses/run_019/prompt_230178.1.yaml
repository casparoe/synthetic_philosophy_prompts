      *   **Friend 1 is right about Social/Moral Dynamics:** Blame *is* a speech act. Hypocrisy *does* undermine the *authority* or *standing* to blame. In social practice, we often dismiss hypocritical blamers not because they are wrong, but because they are annoying/unjust in their address.
