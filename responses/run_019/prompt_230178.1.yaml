answer: |-
  This is a fantastic disagreement because it isn't just a dinner party squabble; it mirrors a live debate in contemporary moral philosophy. Your friends are accidentally arguing about the distinction between the **truth of a moral claim** and the **standing to make that claim.**

  Here is a breakdown of the exchange move by move, an assessment of who is right about what, and a verdict on who is more right overall.

  ### Move-by-Move Analysis

  **Move 1: Nick's Lecture**
  *   **Action:** Nick condemns Priya for pirating textbooks (harming authors) while admitting (via his own habits) that he pirates media.
  *   **Analysis:** Nick is making a universal moral claim: "Pirating is stealing/wrong." He is simultaneously violating that norm. The distinction between textbooks and movies is morally thin (both involve copyright and creator compensation), so this is genuine hypocrisy, not a category error.

  **Move 2: Friend 1 (The "Standing" Advocate)**
  *   **Claim:** Nick has no standing to blame. You can't demand a standard you exempt yourself from. Priya is entitled to dismiss him.
  *   **Philosophical Concept:** *The Standing Account of Blame.* This view holds that to blame someone, you must have the moral authority to do so. Hypocrisy undermines that authority.
  *   **Assessment:** Friend 1 is identifying a real social and moral phenomenon. When a blamer is a hypocrite, their blame often feels like an assertion of power rather than a call to justice.

  **Move 3: Friend 2 (The "Tu Quoque" Advocate)**
  *   **Claim:** This is the *tu quoque* fallacy. A criticism doesn't become false because the messenger is flawed. Priya should answer the arguments.
  *   **Philosophical Concept:** *Logical Validity & Moral Objectivism.* The truth value of a proposition ("Pirating is wrong") is independent of the speaker's behavior.
  *   **Assessment:** Friend 2 is logically correct. In a debate, pointing out hypocrisy does not disprove the opponent's premise. If pirating is wrong, it remains wrong even if Nick does it.

  **Move 4: Friend 1's Clarification**
  *   **Claim:** Blame isn't just a truth-claim; it's a *demand* issued from person to person. The demand loses force when the norm is applied selectively.
  *   **Philosophical Concept:** *Speech Act Theory / Relational Morality.* Friend 1 is arguing that blame is performative (it *does* something) rather than just constative (it *states* something).
  *   **Assessment:** This is Friend 1's strongest point. They are correctly noting that moral communication relies on reciprocity. If Nick treats the rule as optional for himself, he treats Priya as a subordinate rather than a moral equal, which corrupts the "demand."

  **Move 5: Friend 2's Counter**
  *   **Claim:** This reduces blame to etiquette. What matters is the wrong done to the authors. Also, a pirate might see through rationalizations better.
  *   **Philosophical Concept:** *Consequentialism / Moral Realism.* Friend 2 argues that the victim (the author) matters more than the relationship between Nick and Priya.
  *   **Assessment:** Friend 2 is right that ethics is not just etiquette. However, the argument that a "habitual pirate is better placed to criticize" is weak. Experience with a vice doesn't grant moral clarity; often, it grants better rationalizations.

  ---

  ### Who Is Right About What?

  **Friend 2 is right about Logic and Moral Truth.**
  Friend 2 wins on the formal logic. The *tu quoque* (you also) fallacy is a fallacy for a reason. If Priya uses Nick's hypocrisy to avoid examining her own actions, she is committing a logical error. The moral status of pirating textbooks does not fluctuate based on Nick's viewing habits. If Priya wants to be a moral agent, she must engage with the *reasons* Nick gave (harming authors), not just Nick's character.

  **Friend 1 is right about Moral Psychology and Social Standing.**
  Friend 1 wins on the sociology of moral interaction. In practice, hypocritical blame *is* less effective and often *is* inappropriate. Philosophers like R. Jay Wallace and Macalester Bell have argued that hypocrites lack the "standing" to blame because they implicitly claim a superiority they haven't earned. Friend 1 is correct that blame is a relational demand, not just a weather report on moral facts. When Nick blames Priya while exempting himself, he is violating the norm of moral equality.

  **Where They Both Miss:**
  *   **Friend 1** goes too far by saying Priya is entitled to "wave the whole thing off." She can reject Nick's *authority*, but she cannot reject the *moral reality* of her action without failing ethically.
  *   **Friend 2** is too rigid by implying Nick's hypocrisy is irrelevant. It *is* relevant to whether Nick is being a good friend, even if it's irrelevant to the truth of the claim.

  ---

  ### The Verdict: Who Is More Right Overall?

  If I had to referee this, I would give the edge to **Friend 2**, but with a significant concession to Friend 1.

  **Why Friend 2 is more right:**
  The core stakes of the argument are about **Priya's moral obligation**, not Nick's social grace.
  1.  **Moral Responsibility:** Priya's duty to the authors exists independently of Nick. If she "waves it off" solely because Nick is a hypocrite, she is using his failure as an excuse for her own. That is moral avoidance.
  2.  **The Danger of Purity:** If we adopt Friend 1's view too strictly, only moral saints can criticize wrongdoing. This would silence most moral discourse, as almost everyone is a hypocrite in some domain. Friend 2's view allows for moral progress despite human imperfection.
  3.  **The "Better Placed" Argument:** While Friend 2's point about pirates seeing through rationalizations was weak, their core point stands: valid criticism should be heard regardless of the source.

  **The Concession to Friend 1:**
  Friend 1 is right that Nick is being insufferable and that his blame lacks *illocutionary force*. Nick has no right to feel *indignant* (which implies he is above the act). He can only express *regret* (acknowledging they are both in the wrong).

  **The Synthesis:**
  Priya should tell Nick: *"You're right that pirating hurts authors, and I need to think about that. But you don't get to act holier-than-thou about it when you torrent movies every week. Fix your own house before you police mine."*

  **Final Call:**
  **Friend 2 is more right.** In ethics, the truth of the matter (did Priya wrong the authors?) outweighs the purity of the messenger. Friend 1 identifies a real social friction (hypocrisy undermines authority), but Friend 2 correctly identifies that moral truth cannot be held hostage to the messenger's consistency. Priya should answer the arguments, even if she rejects the lecturer.
