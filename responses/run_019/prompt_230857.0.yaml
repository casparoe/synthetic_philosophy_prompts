answer: |-
  It is completely understandable that you and your friend felt like you were running in circles, because you were essentially reenacting a script written in the mid-twentieth century that philosophers have been trying to rewrite ever since. The frustration you feel is the friction of two different philosophical engines grinding against each other, and your hunch that there is a verbal component is correct, though I think it goes deeper than just mixing up descriptive and normative jobs. To diagnose this properly, we have to look at what each of you was trying to protect. When your friend reached for falsifiability, she was reaching for a shield. She wanted a logical rule that would allow her to dismiss astrology without having to investigate every specific claim it makes. She was treating science as a status that grants authority, and she wanted a clear border guard to keep the impostors out. This is the normative impulse. You, on the other hand, were reaching for a mirror. You were pointing out that if you look at how actual science is practiced historically, scientists often cling to theories despite anomalies, use ad hoc hypotheses to save sinking ships, and operate within paradigms that are not immediately testable. You were treating science as a human activity that evolves, and you were worried that a strict logical definition would exclude too much of what we successfully count as knowledge. This is the descriptive impulse.

  The impasse exists because these two impulses are pulling in opposite directions. The falsificationist view assumes that science is defined by a specific method or logical structure, something inherent to the claims themselves. The historical view assumes that science is defined by a community and its trajectory over time, something inherent to the people and their institutions. When you argue about whether astrology is science, you are not actually disagreeing about the stars or the data. You are disagreeing about whether the word science refers to a set of rules for thinking or a label for a specific tribe of experts. If it is a set of rules, your friend wins because astrology violates the rules of risk and testing. If it is a label for a tribe, you win because scientists sometimes behave just like astrologers when their pet theories are threatened. The literature you mentioned, from Popper to Kuhn to Lakatos and beyond, is essentially a series of attempts to bridge this gap. Popper tried to set a logical standard. Kuhn showed that the standard didn't match the history. Lakatos tried to say that research programs can be irrational in the short term but rational in the long term. But none of these solutions stick permanently because the underlying tension remains. We want science to be special, to have a monopoly on truth, but we also know that scientists are human and that the history of discovery is messy.

  So to answer your question about what kind of disagreement this is, it is not a factual disagreement about how inquiry progresses, because you both likely agree on the historical cases. It is not merely a verbal disagreement, because the stakes involve public trust and funding. It is a disagreement about functional essentialism. You are both assuming that there must be a single thing, science, that does a specific job, and you are fighting over the definition of that thing. Your friend wants the definition to be a filter that keeps out nonsense. You want the definition to be an accurate description of successful inquiry. The problem is that no single definition can do both jobs perfectly. A definition strict enough to exclude astrology often excludes early stages of legitimate science. A definition loose enough to include the messy history of physics often includes astrology. This is why the demarcation problem is often described as unsolvable. It is not that we lack the intelligence to find the answer, but that we are asking a question that assumes a binary boundary where there is actually a spectrum.

  Your hunch about the descriptive versus normative split is the key to unlocking why the argument feels stuck, but you should not dismiss it as a way to avoid the disagreement. It is the disagreement. The reason it feels like a verbal trick is that we use the word science to do two incompatible things. We use it to describe a sociological institution that produces reliable technology and medicine, and we use it as an honorific to mean rational or true. When your friend says astrology is not science, she means it is not trustworthy. When you say science is not always falsifiable, you mean the institution is not logically pure. You are talking past each other because one of you is talking about reliability and the other is talking about methodology. The impasse is structural because the word science is being asked to carry too much weight. It is trying to be a description of reality and a prescription for belief at the same time.

  Given this diagnosis, I do not think a better criterion is possible. We have had centuries to find one, and every proposed criterion has counterexamples. An empirical finding will not help either, because the issue is not about the data but about how we categorize the process of gathering data. The only progress available here is a sharper question. We need to stop asking is this science and start asking is this reliable for this specific purpose. If astrology makes you feel better, it might be reliable for comfort. If it claims to predict stock markets, it is unreliable for finance. If physics claims to explain consciousness, it might currently be unreliable for psychology. By shifting the focus from demarcation to evaluation, you dissolve the binary trap. You stop trying to draw a line in the sand and start looking at the specific evidence for specific claims. This does not mean anything goes, but it means that the badge of science is not what makes a claim true. The evidence makes the claim true.

  So what would count as progress in your conversation with your friend? It would be an honest argument that the debate should never end in the way you are trying to end it. You should agree that the demarcation problem is not a puzzle to be solved but a tension to be managed. We need the normative ideal of falsifiability to keep us honest, to remind us that claims should be testable. But we also need the descriptive humility to know that real inquiry is messy and that we cannot dismiss new ideas just because they do not fit our current logical boxes. The progress lies in admitting that science is not a noun but a verb. It is not a club you belong to but a process you engage in. If you can shift the argument from whether astrology is science to whether astrological claims are supported by evidence, you move from a metaphysical stalemate to a practical discussion. You might find that you agree on the outcome, that astrology is not reliable for prediction, even if you disagree on the label. The impasse is real, but it is not a wall. It is a sign that you are using a map that is too simple for the territory. The way forward is to put down the map and look at the ground.
