answer: |-
  If morning star to morning star is known,
  The truth is trivial, empty of surprise.
  No seed of cognitive value is sown,
  For self to self needs no discovering eyes.
  But evening star, though Venus in the end,
  Was thought a distinct body in the night.
  How differs then the statement we defend,
  If both referents catch the selfsame light?
  Sense saves the value, granting distinct ways,
  To grasp one object through a different guise.
  Yet belief contexts complicate the phrase,
  Where Lois denies the truth Clark's name implies.
  Reference won't support the cognitive claim,
  Though modes are hard to individuate by name.

