  2.  **Analyze the Student Answer:**
      *   *Part 1: Reconstruct Thomson's argument.*
          *   Student says: Lamp starts on, off at 1/2, on at 1/4, off at 1/8... by 1 minute infinitely many switches.
          *   Student says: Thomson claims lamp must be on or off.
