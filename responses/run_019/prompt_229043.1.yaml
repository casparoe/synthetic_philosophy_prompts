answer: |-
  The sum refused to close. On Elara's screen, the utility function spiralled into a symbol that looked less like mathematics and more like a snake eating its own tail. $\infty$. Again.

  She rubbed her eyes, the sterile light of the Actuary's spire biting into her retinas. Outside the thick quartz, the nebula drifted, a bruise of purple and gold against the void. Inside, the air smelled of ozone and old paper. She was a welfare actuary for the Continuation Authority, tasked with quantifying the future, but the future had become unquantifiable.

  "Time, Miss Vance," a voice boomed.

  Elara minimised the window. The infinite error message lingered in the corner of her mind like a migraine. She gathered her datapad and walked into the Chamber of Final Allocation.

  The room was circular, dominated by a table of polished obsidian. Three seniors sat waiting. Chairman Thorne, whose face was a map of resigned wrinkles; Director Kael, sharp and vibrating with restless energy; and Dr Aris, who stared at her hands as if reading palms.

  "Your calculations, Elara," Thorne said. His voice was dry, like leaves skittering on pavement.

  "They converge, sir," Elara said, her throat tight. "Or rather, they diverge. All three proposals yield infinite expected value."

  "Precisely," Thorne said, leaning back. "Which is why we must decommission. The universe is already populated. Recent deep-field scans confirm sentient life extends beyond the observable horizon. The background hum of consciousness is already infinite. To launch now is to add a finite drop to an infinite ocean. The net change is zero. We save resources. We spare ourselves the guilt of imperfect creation."

  This was the paralysis. Elara had seen it in Thorne's eyes before. He wasn't arguing for thrift; he was arguing for absolution. If nothing mattered, nothing could be wrong.

  "Zero change?" Kael slammed a hand on the obsidian. "The Loom sends self-replicating seeds to every reachable system. Yes, the lives will be modest. Short, hard, barely above subsistence. But they will *exist*. Infinite existence outweighs infinite non-existence, even if the quality is low."

  "And if the background is already infinite?" Aris asked softly. "Then your Loom adds nothing to the total sum. $\infty + \infty = \infty$."

  "But the *structure* changes," Kael insisted. "We spread the wavefunction."

  Elara watched them. They were not discussing physics. They were shopping for mathematics that allowed them to sleep. She thought of Maya, waiting in the med-bay below. Maya, whose cellular degradation required the stable, high-energy environment of the Conservatory. The Loom would send Maya into the dark, her life extended but brittle. Decommissioning would let her fade within the cycle. Only the Conservatory offered a cure, sustained indefinitely within a fixed, protected habitat.

  "The Conservatory," Aris said, picking up the thread. "We sustain a fixed population. Ten million souls. Perfectly curated. No pain, no deprivation. We use temporal extension to achieve infinity. Ten million lives lasting forever equals infinite utility."

  "Same sum," Thorne noted. "Infinity is infinity. Your flourishing ten million are mathematically equivalent to Kael's billions of suffering serfs, and both are equivalent to doing nothing."

  "That is absurd," Aris snapped, her composure cracking. "A world of joy cannot be equal to a world of ash."

  "Tell that to the cardinality," Thorne said.

  Elara looked down at her pad. She had run the simulations using hyperreal valuations, trying to break the tie. She had applied discount rates that favoured the near future, then truncation rules that favoured density. Every time she adjusted the variable, the result shifted to match the preference of the person who had programmed the variable.

  "You're choosing patches," Elara said. The words slipped out before she could check them.

  The room went silent. Thorne's eyes narrowed. "Excuse me?"

  "The math doesn't decide," Elara said, her voice shaking. "You're selecting axioms to justify what you want. Thorne, you use cancellation because you're tired. You want to rest. Kael, you use expansionist axioms because you're afraid of being forgotten. Aris, you use temporal hyperreals because you want control."

  "And you?" Kael challenged. "What axiom do you choose, Actuary?"

  Elara thought of Maya's hand in hers, small and cold. "I choose the one that lets her live."

  "That is not an ethical framework," Thorne said dismissively. "That is bias."

  "It is the only framework that isn't a lie," Elara countered. "We are pretending these are equations. They are not. They are deaths. If you choose Decommissioning, you kill the future because the math says the future is already full. If you choose the Loom, you condemn millions to struggle because the math says quantity equals quality. If you choose the Conservatory, you lock humanity in a cage because the math says intensity beats spread."

  She looked at Thorne. "You say the universe is infinite. But Maya is not. She is finite. Her pain is finite. Her life is finite. If we add her finite suffering to an infinite total, the math says it doesn't matter. But *she* matters."

  Thorne stood up. He looked incredibly old. "We are not gods, Miss Vance. We are administrators. We cannot manage the infinite. We can only manage our conscience. I find decommissioning... cleaner."

  "Cleaner for whom?" Kael stood as well. "The Loom ensures humanity survives. Even if it's hard. Even if it's mathematically redundant."

  "Survival at what cost?" Aris rose. "I will not sanction a universe of misery just to satisfy a numerical impulse."

  They were shouting now, not over policy, but over fear. The infinity symbol on Elara's pad seemed to pulse. She realised then that the paralysis wasn't in the universe; it was in the room. They were trapped in the comparison problem, unable to rank two infinities, so they reached for the third option: nothing. Or they reached for fanaticism, betting on the slimmest probability of value to justify vast expenditure.

  "Vote," Thorne said abruptly. He looked at Elara. "Record the decision."

  Elara's fingers hovered over the haptic interface. She could falsify the log. She could write that the Conservatory had higher expected value due to a weighting error. But the system would flag it. The Authority's AI would see the manipulation.

  "Chairman Thorne," Elara said. "If you vote for Decommissioning, you are asserting that my daughter's life is a rounding error."

  Thorne paused. For a second, the mask slipped. She saw the exhaustion there, the weight of centuries of utilitarian calculus grinding against human instinct. "I am asserting that I cannot justify burning stars for a single child, even if the math says the stars are already burnt."

  "And I," Kael said, "am asserting that we must spread. Even if it means hardship."

  "And I," Aris whispered, "assert that quality is the only metric that survives contact with reality."

  They voted. It was not unanimous. Thorne voted for Decommissioning. Kael for the Loom. Aris for the Conservatory. The tie-breaking vote belonged to the Chief Actuary. It belonged to Elara.

  The room turned to her. The silence was heavy, pressing against her eardrums. She looked at the screen. The infinite sum still hovered there, mocking her. She could choose the Loom and save humanity, but lose Maya to the void. She could choose Decommissioning and end the pain, but end everything. She could choose the Conservatory and save Maya, but lock humanity away.

  She thought of the dry lectures on cardinalities. She thought of the eerie feeling that nothing mattered because everything was already everywhere.

  Elara typed. She did not use a hyperreal patch. She did not apply a discount rate. She manually overrode the convergence protocol. She entered a finite value. She assigned the future a cap.

  "What are you doing?" Thorne asked, stepping forward.

  "Finishing the sum," Elara said.

  She selected the Conservatory.

  "The math is wrong," Kael said.

  "The math is incomplete," Elara replied. She stood up, her legs trembling. "We are not calculating for the universe. We are calculating for us. And we are finite."

  She walked out of the chamber before they could stop her. The corridors were quiet. Below, in the med-bay, the lights were dimmed for the night cycle. Maya would sleep. Tomorrow, the Conservatory engines would ignite. They would not seed the stars. They would not end the line. They would build a wall, and behind it, they would keep a few lives safe and bright, while the infinite dark continued, indifferent and unmeasured.

  Elara leaned against the cold wall of the lift. She had broken the model. She had chosen bias over balance. She had chosen love over logic. As the lift descended, she watched the infinity symbol on her pad finally fade, replaced by a simple, finite number. It was wrong, objectively. It was the only thing that felt right.

