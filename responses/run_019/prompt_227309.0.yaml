      *   *The Constraint:* `can_lift(agent, resource)` returns false.
      *   *The Conflict:* `create(weight)` such that `can_lift(self, result)` is false.

  3.  **Address the Specific Philosophical Moves:**

      *   **Aquinas (Logical Impossibility):**
          *   *Philosophy:* God can do all *possible* things. Contradictions aren't things.
          *   *Systems:* Type theory. A program that violates type safety doesn't compile. It's not a "program the compiler refuses to run"; it's "not a program."
          *   *Translation:* `create_stone_unliftable()` is a function signature that cannot be implemented within the type system. Asking for it is a compile-time error, not a runtime failure.
