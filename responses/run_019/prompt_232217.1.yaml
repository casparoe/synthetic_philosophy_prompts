      *   **Target Question:** What is the verdict on the "Exclusivity/STI Risk" case (Man lies about exclusivity, woman conditions consent on exclusivity + condoms + testing)?
      *   **Task:** Identify underlying principles, suggest revisions if necessary for coherence, and apply the resulting framework to the target case.

  2.  **Deconstruct the User's Verdicts:**

      *   *Case 1: Vasectomy Lie.* (Invalid). Reasoning: Deception about biological risk/consequence (pregnancy).
      *   *Case 2: Love Lie.* (Valid). Reasoning: Deception about emotional status/future, not the act itself.
      *   *Case 3: Stealthing (Condom Removal).* (Invalid). Reasoning: Deception/Change of conditions regarding the physical act and risk.
      *   *Case 4: Pill Lie.* (Invalid). Reasoning: Symmetrical to Vasectomy. Biological risk.
      *   *Case 5: Status Lie (Gallery Owner).* (Valid). Reasoning: Deception about social status/wealth, not the act or direct consequences.
      *   *Case 6: Boss Threat.* (Invalid). Reasoning: Coercion via power imbalance/economic threat.
      *   *Case 7: Partner Ultimatum.* (Valid). Reasoning: Coercion via relationship leverage, but deemed "valid" (though bad relationship).
      *   *Case 8: Drunk Initiation.* (Invalid). Reasoning: Incapacity/Competence.

  3.  **Identify Potential Principles:**

      *   *Principle A: Nature of the Deception (Fraud in the Factum vs. Fraud in the Inducement).*
          *   Legal distinction: Did the lie change *what* the act is (factum) or just *why* they agreed (inducement)?
          *   Fits: Vasectomy/Pill/Stealthing (Invalid) vs. Love/Status (Valid).
          *   Explanation: Lies about fertility/safety change the *nature* of the sexual act (risky vs. safe). Lies about love/status change the *motivation*.

      *   *Principle B: Coercion and Power Imbalance.*
          *   Fits: Boss (Invalid) vs. Partner (Valid).
          *   Explanation: Institutional/Professional power creates undue pressure that negates autonomy. Personal relationship leverage (breakups) is an unfortunate reality of bargaining, not coercion that negates consent.

      *   *Principle C: Capacity.*
          *   Fits: Drunk case.
          *   Explanation: Intoxication impairs judgment to the point of incapacity.

  4.  **Analyze the Tensions (The "Hard to Reconcile" points):**

      *   *Tension 1: Vasectomy vs. Love.*
          *   *Current View:* Vasectomy = Invalid, Love = Valid.
          *   *Underlying Logic:* The "Nature of the Act" principle. A vasectomy lie changes the physical risk profile (pregnancy). A love lie changes the emotional context.
          *   *Critique:* Is this consistent? Many feminists argue that sex is inherently relational, so lying about love *does* change the nature of the act. However, legally and in many liberal frameworks, the distinction holds based on *physical* consequences vs. *emotional* motivations.
          *   *Recommendation:* Keep this distinction if the user wants a liberal/autonomy-based framework. It aligns with "Fraud in the Factum." If the user revises, they must either make *all* deceptive consent invalid (too broad?) or *none* (too narrow?). The current split is the standard legal/ethical middle ground.

      *   *Tension 2: Boss vs. Partner.*
          *   *Current View:* Boss = Invalid, Partner = Valid.
          *   *Underlying Logic:* "Structural Coercion" vs. "Relational Bargaining." The boss holds institutional power (livelihood). The partner holds emotional leverage (relationship status).
          *   *Critique:* Both are threats ("X unless sex"). Why is one coercive and the other not?
          *   *Recommendation:* The distinction usually rests on *legitimate authority* vs. *personal autonomy*. A boss has no right to condition employment on sex (abuse of power). A partner has the right to end a relationship for any reason, including lack of sex (sexual autonomy). Threatening to exercise a right (breaking up) is generally not coercion in the legal sense, whereas threatening to violate a right (firing illegally/unethically) is.
          *   *Revision:* This distinction is robust in liberal theory. Keep it, but clarify the *reason*: one is abuse of institutional power, the other is an exercise of personal boundary setting (even if manipulative).

  5.  **Synthesize the Principles:**

      *   **Principle 1: Deception regarding the "Physical Nature and Risks" of the Act.** (Fraud in the Factum). Lies that alter the physical act or its direct biological consequences (pregnancy, disease, barrier methods) vitiate consent. Lies about motivation, status, or feelings do not.
      *   **Principle 2: Coercion via Illegitimate Power.** Threats that abuse institutional or structural power (employment, custody, legal status) vitiate consent. Threats to exercise personal autonomy (ending a relationship) do not, even if hurtful.
      *   **Principle 3: Capacity.** Severe intoxication negates the ability to consent regardless of verbal agreement.

  6.  **Apply to the Target Case (Exclusivity/STI Risk):**

      *   *Scenario:* Man lies about exclusivity. Woman conditions consent on exclusivity + condoms + testing.
