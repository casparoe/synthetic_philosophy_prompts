answer: |-
  Your hypothesis is correct: the impasse is not physical. The physics of Special Relativity (SR) is settled among your seminar participants. The stalemate is **metaphysical**, specifically concerning the **ontology of existence under relativistic constraints**, though it manifests verbally through equivocation on terms like "real," "present," and "determinate."

  Here is a diagnosis of the argument's steps, the specific distinction required for progress, and an explanation of why the debate remains stalled.

  ### 1. Diagnosis of the Impasse: Metaphysical, Disguised as Verbal

  The dispute is **Metaphysical** because it concerns the categorical status of events in the spacetime manifold. However, it presents as **Verbal** because the participants are using the same vocabulary ("reality," "existence") to track different ontological commitments.

  *   **The Proponents (Eternalists)** operate on a **Manifold Substantivalist** view. They treat the 4D manifold as the primary ontological entity. For them, "existence" is equivalent to "membership in the manifold." Since the manifold contains all events (past, present, future) as coordinate points, all events exist.
  *   **The Critics (Presentists/Dynamic Theorists)** operate on a **Foliation-Dependent** or **Indexical** view. They treat "existence" (or "actuality") as a property that accrues to events relative to a specific observer or hypersurface. For them, "existence" is not a static predicate ($E(x)$) but a relation ($E(x, t)$ or $E(x, \text{frame})$).

  **The Logical Crux:** The Rietdijk–Putnam argument relies on the **Transitivity of Reality**.
  1.  Event $A$ is real for Observer $O_1$.
  2.  Observer $O_1$ is real for Observer $O_2$ (at the coincidence point).
  3.  Event $A$ is simultaneous with $O_2$ (in $O_2$'s frame).
  4.  Therefore, Event $A$ is real for $O_2$.

  Proponents assume reality is transitive and frame-invariant. Critics deny this, arguing that "real for" is intransitive or indexical. The impasse exists because neither side can prove their ontological axiom without begging the question. Proponents assume physics dictates ontology; Critics assume ontology constrains the interpretation of physics.

  ### 2. The Distinction and Formal Result Needed for Progress

  To break the stalemate, the seminar needs to introduce two specific elements that are often conflated in this debate.

  #### A. The Formal Result: Stein's Theorem (1968)
  The most critical formal result relevant to this impasse is **Howard Stein's "On Einstein-Minkowski Space-Time."**
  *   **The Result:** Stein proved that in Minkowski spacetime, if one seeks a relation $R$ (interpreted as "is real for" or "is definite for") that is definable purely from the spacetime structure and is transitive, the only non-trivial solution is the relation "is in the causal past or on the light cone of."
  *   **The Implication:** This undermines the Rietdijk–Putnam use of *simultaneity* hyperplanes. Simultaneity is frame-dependent and not invariant under the Lorentz group. If "reality" must be an objective, frame-independent feature of the world (as Proponents claim), it cannot be based on simultaneity slices. It must be based on causal structure.
  *   **Why it helps:** It forces Proponents to admit that "simultaneity" is not an ontological boundary. It forces Critics to admit that the only objective "becoming" is along the light cone, not a universal "now."

  #### B. The Missing Distinction: *Existence* vs. *Actuality*
  The debate stalls because participants conflate **ontological existence** with **indexical actuality**.
  *   **Existence (Quantificational):** To say an event "exists" is merely to say it is a value of a bound variable in our best theory ($\exists x \in \text{Manifold}$). Eternalists win here by definition; the manifold contains the future.
  *   **Actuality (Indexical):** To say an event is "actual" or "present" is to locate it relative to an observer's worldline. This is a perspective-dependent property, like "here" or "left."

  **Progress requires agreeing that:** One can accept the Block Universe (all events *exist* in the manifold) without accepting Fatalism (all events are *actualized* in a way that negates contingency). The "future" exists as a coordinate, but its *content* may not be determinate until the worldline intersects it.

  ### 3. Why Has Neither Emerged?

  If Stein's theorem and the existence/actuality distinction are available, why does the seminar remain stalled?

  **1. The "Determinism" Red Herring**
  As you noted, critics insist "Eternalism does not entail determinism." Proponents often hear this as a confusion.
  *   **The Block:** The future is *ontologically fixed* (it is already a coordinate in the block).
  *   **The Laws:** The future may be *causally stochastic* (the laws governing the block are probabilistic).
  Critics fight against *causal determinism* (Laplace's demon), while Proponents argue for *ontological determinacy* (the event is already 'there'). Because they are arguing past each other on modal status, they never address the core ontological mapping.

  **2. Pre-Theoretic Intuitions vs. Naturalized Metaphysics**
  The debate is fundamentally a clash between **Phenomenology** and **Formalism**.
  *   Critics are defending the phenomenological truth that the future is "open." They view the "Block" as a reification of a mathematical model.
  *   Proponents are defending a naturalized metaphysics where ontology must supervene on fundamental physics. They view the "Open Future" as a psychological illusion.
  Neither side can budge because one side privileges the *experience* of time, and the other privileges the *geometry* of spacetime. There is no meta-rule in the seminar to decide which priority is correct.

  **3. The Equivocation is Productive**
  Finally, the verbal ambiguity is likely persisting because it is philosophically productive. If "reality" is strictly defined as "manifold membership," Presentism dies instantly. If "reality" is defined as "causal accessibility," the Block Universe loses its fatalistic sting. The ambiguity allows both positions to remain live hypotheses. Resolving the definition would likely end the debate by forcing one side to concede, which participants are unwilling to do without a knock-down argument (which, in metaphysics, rarely exists).

  ### Recommendation for the Seminar
  To move forward, propose the following motion:
  > *"Let us grant Stein's conclusion that 'simultaneity' is not an invariant ontological relation. Does the 'reality' of a distant event depend on its membership in the manifold (Eternalism) or its causal relation to the observer (Causal Presentism)?"*

  This shifts the debate from "Is the future real?" (which is verbal) to "What is the criterion for ontological commitment in SR?" (which is metaphysical and precise).
