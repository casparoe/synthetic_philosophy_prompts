answer: |-
  The label you are looking for is **Chesterton's Fence**.

  It is not merely a label; it is the precise name of the heuristic you described. It comes from G.K. Chesterton's 1929 book *The Thing*, and it has become the standard shorthand in philosophy, political theory, and systems engineering for this specific argumentative move.

  Here is the breakdown of why this fits your observation, how it bridges the ideological divide you noticed, and where the line is drawn between wisdom and stagnation.

  ### 1. The Name and the Source
  Chesterton wrote the definitive formulation of this argument:

  > "There exists in such a case a certain institution or law; let us say, for the sake of simplicity, a fence or gate erected across a road. The more modern type of reformer goes gaily up to it and says, 'I don't see the use of this; let us clear it away.' To which the more intelligent type of reformer will do well to answer: 'If you don't see the use of it, I certainly won't let you clear it away. Go away and think. Then, when you can come back and tell me that you do see the use of it, I may allow you to destroy it.'"

  This covers both claims you identified:
  *   **The Epistemic Claim:** The fence was put there by someone who likely understood the terrain better than you do at first glance. Therefore, its utility is probable, even if opaque.
  *   **The Burden-of-Proof Claim:** The default position is preservation. The onus is on the destroyer to understand the function before removal, not on the preserver to justify the existence continuously.

  ### 2. Is it One Argument or a Cluster?
  It is best understood as a **heuristic cluster** bound together by a single principle: **Epistemic Humility regarding Complex Systems.**

  While "Chesterton's Fence" is the rhetorical label, the underlying logic shifts slightly depending on who is using it, which explains why you see Burkeans, engineers, and journalists all deploying it.

  *   **The Burkean/Conservative Version:** Relies on **Tradition and Wisdom.** The assumption is that the "fence" represents the accumulated wisdom of ancestors. To remove it is to arrogantly assume you know better than the past.
  *   **The Engineer/Systems Version:** Relies on **Complexity and Second-Order Effects.** Engineers use this when dealing with legacy code or infrastructure. They assume the system is a complex adaptive web. Removing a "useless" line of code might crash a dependency three layers deep that no one documented. (Nassim Nicholas Taleb popularized this angle in *Antifragile*, calling it *Via Negativa*.)
  *   **The Sociological/Left-Leaning Version:** Relies on **Functionalism.** Even progressive journalists might use this when analyzing institutional norms. They might argue, "This weird HR policy seems oppressive, but it might have been a workaround for a specific legal liability in the 90s. If we remove it without fixing the liability, we expose workers to risk."

  In all three cases, the core logic is identical: **Absence of evidence (of utility) is not evidence of absence (of utility).**

  ### 3. When Does It Become a Fallacy?
  You asked where the move stops being useful caution and starts being a recipe for stagnation. This is the critical distinction between **Chesterton's Fence** (a valid heuristic) and the **Appeal to Tradition** (a logical fallacy).

  The move becomes toxic when it ignores **Contextual Drift.**

  Chesterton's Fence is valid only if the *conditions that necessitated the fence* still exist.
  *   **Valid:** "Don't remove this zoning setback; it prevents flooding in this specific watershed." (Even if you don't see the water, the geography hasn't changed.)
  *   **Invalid:** "Don't remove this zoning setback; it's always been there." (If the watershed was paved over and diverted 50 years ago, the fence is now just an obstacle.)

  The argument fails when it treats the *existence* of the rule as proof of its *current necessity*, ignoring that environments change. This is where the "Burden of Proof" flips. If the reformer can demonstrate that the **context** has fundamentally shifted (e.g., the software is no longer running on the legacy hardware; the university no longer serves the same demographic), the presumption of utility collapses.

  ### 4. How to Spot the Difference (For Your Writing)
  Since you cover science and ideas, you can evaluate the usage of this move by asking three questions:

  1.  **Is the system complex or simple?**
      *   In complex systems (biology, law, legacy code), Chesterton's Fence is strong. Hidden dependencies are likely.
      *   In simple systems (a sign on a door, a standalone policy), it is weak.
  2.  **Is the cost of error reversible?**
      *   If removing the fence is easily reversible, the burden of proof should be lower.
      *   If removing the fence is catastrophic and permanent (nuclear protocols, constitutional rights), the burden of proof should be maximal.
  3.  **Has the "Road" changed?**
      *   Chesterton's parable assumes the road is the same. If the road is now a highway, the fence is a hazard. The defender must show the *problem* the fence solved still exists, not just that the fence exists.

  ### Summary
  The label is **Chesterton's Fence**.

  It covers both the epistemic claim (there is likely a hidden reason) and the burden-of-proof claim (you must find that reason before acting). It is not inherently conservative; it is a **risk-management heuristic** applicable to any complex system.

  It ceases to be useful when it is used to shield a practice from scrutiny regarding whether the **original problem** still exists. When the defender cannot name the problem, only the history, they have moved from Chesterton's Fence to the **Appeal to Tradition**.
