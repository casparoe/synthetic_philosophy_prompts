answer: |-
  # Seminar Plan: Common Knowledge of Rationality
  **Target:** Strong First-Year Philosophy & Economics Undergraduates  
  **Duration:** 120 Minutes  
  **Core Concept:** Common Knowledge of Rationality (CKR)  
  **Worked Example:** A Simplified 3-Node Centipede Game  

  ---

  ## 1. Conceptual Dependencies & Sequence (0–20 Minutes)
  **Goal:** Establish the vocabulary of knowledge before applying it to rationality.

  *   **Step 1: Instrumental Rationality (5 mins).**
      *   Define rationality strictly as *payoff maximization given beliefs*. Avoid normative connotations ("smart," "wise").
      *   *Constraint:* Assume players know the payoff matrix perfectly.
  *   **Step 2: The Ladder of Knowledge (15 mins).**
      *   Introduce three states regarding a fact $P$ (where $P$ = "All players are rational"):
          1.  **Truth:** $P$ is the case.
          2.  **Mutual Knowledge ($E^1(P)$):** Everyone knows $P$.
          3.  **Common Knowledge ($CK(P)$):** Everyone knows $P$, everyone knows everyone knows $P$, ad infinitum.
      *   **Why CK must precede CKR:** You cannot distinguish "Everyone is rational" from "Rationality is Common Knowledge" without first understanding that knowledge itself has a recursive structure. If students view knowledge as a flat state (either you know it or you don't), CKR collapses into simple Mutual Knowledge. The *fixed-point* nature of CK (the "ad infinitum" clause) is the engine that drives the backward induction logic later.
      *   *Pedagogical Move:* Use a **non-game analogy** here only to define the logic (e.g., "The Referee's Announcement"). If a referee whispers "You are rational" to each player privately, it is Mutual Knowledge. If the referee shouts it so all hear all hear it, it becomes Common Knowledge. This distinction must be solidified *before* attaching it to strategic inference.

  ## 2. The Worked Example: 3-Node Centipede Game (20–75 Minutes)
  **Goal:** Use a single game to demonstrate how depth of knowledge dictates action.

  *   **The Setup:**
      *   Two players (A, B).
      *   **Node 1 (A):** Choose **Stop** (Payoff: 1, 0) or **Continue**.
      *   **Node 2 (B):** Choose **Stop** (Payoff: 0, 2) or **Continue**.
      *   **Node 3 (A):** Choose **Stop** (Payoff: 3, 1) or **Continue** (Payoff: 2, 2).
      *   *Note:* Payoffs are structured so that Backward Induction dictates stopping immediately, but cooperation yields higher joint payoffs.
  *   **The Analysis (Scaffolded by Knowledge Depth):**
      1.  **Scenario A (Truth Only):** Players are rational, but don't know the other is.
          *   *Inference:* A cannot predict B. A might Continue hoping B is nice.
      2.  **Scenario B (Mutual Knowledge, Depth 1):** A knows B is rational. B knows A is rational.
          *   *Inference:* At Node 3, A will Stop (3 > 2). B *knows* A is rational, so B knows A will Stop at Node 3. Therefore, at Node 2, B compares Stop (2) vs Continue (leads to A Stopping, giving B 1). B Stops.
          *   *Crucial Gap:* Does A know that B knows A is rational? If not, A might think B will Continue at Node 2.
      3.  **Scenario C (Common Knowledge of Rationality):**
          *   *Inference:* A knows B knows A is rational. A knows B knows A will Stop at Node 3. A knows B will Stop at Node 2. Therefore, at Node 1, A compares Stop (1) vs Continue (leads to B Stopping, giving A 0). A Stops immediately.
  *   **Why this example works:**
      *   **Must Have:** Discrete nodes with distinct payoffs. This makes the difference between Knowledge Depth 1 and Depth 2 *qualitative* (different moves), not just quantitative.
      *   **Must Lack:** Probabilistic uncertainty or complex information sets. Keep the uncertainty purely *epistemic* (about the other's knowledge), not *aleatory* (about chance). This isolates CKR as the variable.
      *   **Vividness:** The gap between "Mutual Knowledge" (Game ends at Node 2) and "Common Knowledge" (Game ends at Node 1) is a tangible difference in outcome and payoff, not just an abstract logical distinction.

  ## 3. Predictable Misconceptions & Intervention Points (75–90 Minutes)
  **Goal:** Head off hardening errors before the closing check.

  *   **Misconception 1: "Finite is Enough."**
      *   *The Error:* Students think "Everyone knows everyone knows..." to a large finite number (e.g., 10 levels) is functionally identical to Common Knowledge.
      *   *Intervention Point:* During **Scenario B vs. C**. Ask: "If the game had 100 nodes, would 10 levels of knowledge be enough to solve it?" Show that for a game of length $N$, you need knowledge depth $N$. Since CKR must hold for *any* length game in theory, only the infinite fixed point guarantees the solution generally.
  *   **Misconception 2: "The Public Announcement is Redundant."**
      *   *The Error:* "If I already know I'm rational, and I know you're rational, why does the Referee need to shout it?"
      *   *Intervention Point:* During **The Ladder of Knowledge (Step 2)**. Use the "Coordinated Attack" intuition: I know $P$, and you know $P$, but I don't know *that you know* $P$ unless the announcement was public. Without that link, the chain breaks at level 2.
  *   **Misconception 3: "Rationality implies Cooperation."**
      *   *The Error:* Students confuse rationality with "what is best for the group."
      *   *Intervention Point:* During **The Setup**. Reiterate that Rationality = Maximizing *own* payoff. This is why the Centipede unravels; CKR forces the selfish equilibrium, not the cooperative optimum.

  ## 4. Closing Check: The "Broken Chain" Diagnostic (90–110 Minutes)
  **Goal:** Verify understanding through application, not definition.

  *   **The Task:** Present a modified Centipede Game.
      *   *Modification:* "Player A is definitely rational. Player B is rational with 99% probability, but there is a 1% chance B is 'irrational' (always Continues). This probability is Common Knowledge."
      *   *Question:* "Does Common Knowledge of Rationality hold? If not, how does the equilibrium change compared to the standard game?"
  *   **Success Criteria:**
      *   **Fail:** Student says "CKR holds because 99% is high enough" or repeats the definition of CKR.
      *   **Pass:** Student identifies that CKR is **false** (because it is not *common knowledge* that B is rational, only common knowledge of the *probability*). They infer that A might **Continue** at Node 1 to test B, breaking the backward induction chain. This shows they understand CKR is a binary switch for the standard equilibrium, not a gradient.

  ## 5. Deliberate Omissions (To be stated explicitly)
  **Goal:** Manage cognitive load and scope.

  *   **Formal Epistemic Logic:** Do not introduce Kripke structures, S5 axioms, or operators like $K_i(\phi)$. Use English phrases ("A knows that B knows...").
      *   *Reason:* The seminar is about the *game-theoretic consequence*, not the logical proof system.
  *   **Aumann's "Agreeing to Disagree":** Do not discuss how CKR relates to betting or probability priors.
      *   *Reason:* This introduces probabilistic belief structures which complicate the binary nature of the Centipede example.
  *   **Trembling Hand Perfection:** Do not discuss errors in execution.
      *   *Reason:* We are isolating errors in *knowledge*, not errors in *action*.
  *   **Statement to Class:** "We are treating knowledge as certain and binary today. In advanced courses, you will model knowledge as probabilistic beliefs, but that requires tools we are deliberately setting aside to see the structural logic of CKR clearly."

  ---

  ## Timing Summary
  *   **00–20:** Concepts (Rationality + Knowledge Ladder).
  *   **20–75:** Worked Example (Centipede Game Analysis).
  *   **75–90:** Misconceptions (Targeted Q&A).
  *   **90–110:** Closing Check (Diagnostic Scenario).
  *   **110–120:** Buffer & Wrap-up (Explicitly state Omissions).
