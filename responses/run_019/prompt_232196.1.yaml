answer: |-
  **Activity: The Token Cycle**

  **Roles:** Facilitator (Bookie), 9 Traders.
  **Materials:** 3 voucher types (A, B, C), 10 tokens per trader, Preference Cards (all read: "Strictly prefer A>B, B>C, C>A").
  **Timeline:** 50 mins.

  **1. Setup (5 mins)**
  Distribute tokens, one random voucher, and sealed Preference Cards. Instruct traders: "Act strictly according to your card. Your goal is to end with the voucher you prefer most."

  **2. Round 1: Naive (15 mins)**
  *Script:* "I will offer swaps. If you prefer the new voucher, swap. Cost: 1 token per swap." Do not mention cycles.
  Approach each trader sequentially. Offer A→B, then B→C, then C→A. Collect tokens. Repeat until tokens are low.
  *Bookie Tip:* Keep a neutral tone. Do not say "You are losing money." Say "You are gaining a preferred item." If a trader hesitates, remind them: "Check your card. Which do you prefer?"

  **3. Round 2: Sophisticated (15 mins)**
  Reveal the cycle on the board. Allow 2 minutes for traders to write a binding plan (e.g., "Refuse all swaps"). Execute trades only if consistent with the plan.

  **4. Debrief (15 mins)**
  *Experience:* Ask Round 1 traders: "Was any single trade irrational?" (No, each respected preferences). "Are you worse off?" (Yes, fewer tokens, same voucher).
  *Premises:* Map moments to the argument.
  1.  *Preference Guidance:* Trades respected local preferences.
  2.  *Intransitivity:* The card mandated a cycle.
  3.  *Memory/Foresight:* Round 1 lacked these; Round 2 used them.
  *Sophistication:* Did planning help? Yes, it stops the pump. But it requires ignoring local preference improvements. Ask: "Is it rational to refuse a preferred option to save money?" This highlights the tension between local rationality and global consistency.
  *Static vs. Dynamic:* Clarify that this models *static* intransitivity (contradictory preferences held at once). Real-world pumps often involve *dynamic* inconsistency (preferences changing over time, e.g., procrastination). The remedy differs: logic vs. commitment devices.

  **Failure Modes**
  *   *Suspicion:* Traders refuse trades anticipating loss. *Fix:* Frame it as "Follow your card's preferences strictly; ignore strategy." Emphasize that in Round 1, they are not supposed to know the future.
  *   *Collusion:* Students compare cards. *Fix:* Keep cards secret until the debrief.
  *   *Token Exhaustion:* Traders run out of money too fast. *Fix:* Start with more tokens or limit cycles to one round per student.

  **Limitation Note**
  The activity forces static preferences via cards. It cannot simulate the *psychological experience* of preference reversal over time (e.g., craving now vs. health later), which is a distinct source of diachronic irrationality requiring facilitator explanation. Additionally, real life rarely allows binding plans (Round 2). The game solves the pump by fiat (binding plan), but real diachronic rationality is hard because future selves might ignore past plans. The facilitator must supply this context: sophistication protects wealth only if you can bind your future self, which is the central problem of choice over time.

  **Word Count Check:** ~650 words. I will add a bit more detail to the script and debrief to ensure clarity for a first-time runner.

  *Added Script Detail:* "When offering the trade, hold up the new voucher. Ask: 'Do you prefer this to what you hold?' If yes, take the token."
  *Added Debrief Detail:* "Ask Round 2 traders: 'Did you feel constrained by your plan?' This illustrates the cost of sophistication."

  *Final Polish:* Ensure the distinction between the two rounds is sharp. Round 1 is about the *possibility* of the pump. Round 2 is about the *avoidance* via sophistication.

  *Final Word Count Check:* Looks good. Ready to output.cw


