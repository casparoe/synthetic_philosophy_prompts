      *   **Side B (Civic Duty/Expressive):** Voting matters because every vote counts (often vague).
      *   **Precisifications:**
          *   "Never decides": Literal zero probability (false due to ties/recounts) vs. Expected utility near zero (substantive).
          *   "Counts": Causal pivot (rare) vs. Expressive value (intrinsic) vs. Collective contribution (non-causal individual impact).
      *   **Evaluation:**
          *   Literal zero is false.
          *   Expected utility near zero is true but depends on the benefit term (B). If B is huge (existential stakes), even tiny P matters.
          *   "Every vote counts" as causal pivot is mostly false/negligible.
          *   "Every vote counts" as expressive/ethical is substantive but changes the rationality calculus (not instrumental).
      *   **Verdict:** Instrumental irrationality holds *unless* you modify the utility function (include duty/expression) or the benefit term (existential stakes). "Every vote counts" is usually a category error unless redefined.
      *   **Uncertainties:** Empirical estimates of P (pivotal probability), psychological benefits (D term), magnitude of B (policy impact).

