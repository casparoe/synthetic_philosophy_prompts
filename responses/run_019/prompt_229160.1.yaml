      I know the drill exactly, and it is exhausting to write the same margin note about the paradox of voting for the thirtieth time in a row. The problem is that both slogans are operating at different levels of analysis, and neither survives contact with a precise expected utility framework without significant modification. When students claim that one vote never decides an election, they are usually conflating a logical impossibility with a statistical negligible probability. If they mean the probability is literally zero, they are factually incorrect because tied elections do occur, albeit rarely, and recount thresholds often bring single votes into play as decisive factors for certification or funding triggers. However, if they mean the probability is so vanishingly small that it cannot mathematically outweigh the cost of voting in a standard expected utility calculation, then they are making a substantive claim that holds up under most empirical conditions for national elections. This distinction matters because the literal claim is false and easily debunked with a history book, whereas the probabilistic claim is the real engine of the rational choice argument and requires a discussion of cost-benefit analysis to refute.

      On the other side, when students insist that every vote counts, they are often retreating into a tautology unless they specify the mechanism. If they mean every vote has a non-zero probability of being pivotal, they are technically correct but ignoring the magnitude of that probability, which brings them right back to the instrumental irrationality problem. If they mean every vote contributes to a collective outcome regardless of pivotality, they are shifting from instrumental rationality to expressive or ethical rationality, which changes the terms of the debate entirely. The slogan functions as a platitude when it suggests causal efficacy where there is none, but it becomes a substantive contested claim when it argues that the act of voting has intrinsic value independent of the outcome, or that participation validates the democratic process in a way that benefits the voter psychologically or socially. You have to push them to admit whether they are arguing that their vote will change the winner or that casting the vote is itself the benefit. The former is empirically weak for national elections, while the latter dissolves the paradox of voting by adding a consumption benefit term to the utility function, effectively saying people vote because they enjoy it or feel duty-bound, not because they expect to swing the election.

      So when we sort these readings, the claim that a single vote literally never matters is flat-out false given the existence of ties and statutory margins. The claim that the expected instrumental benefit is negligible is substantive and generally accepted in political science literature for large-scale elections. The claim that every vote counts causally is mostly a platitude that masks the negligible probability, but the claim that every vote counts expressively is substantive and contested because it relies on a specific theory of value that not all rational choice models accept. Crucially, the irrationality verdict survives only if we restrict rationality to narrow instrumentalism where the only benefit is affecting the outcome. If we allow for expressive benefits, social pressure, or a sense of civic duty as part of the utility function, then voting is perfectly rational even if the pivot probability is zero. Conversely, the slogan every vote counts supports nothing beyond a tautology if it relies solely on pivotality, but it supports a robust defense of voting if it relies on the constitutive value of participation. The real disagreement is not about the math of pivotality but about what counts as a benefit in the rational actor model.

      To change my verdict on the rationality question, I would need to see either a drastic change in the empirical estimates of pivotal probability or a reevaluation of the magnitude of the stakes involved. If the difference between candidates is existentially large, say one policy leads to catastrophic harm and the other does not, then even a one in ten million chance might generate an expected value high enough to cover the cost of voting. Alternatively, if the cost of voting were reduced to near zero through universal mail ballots or automatic registration, the threshold for rationality lowers significantly. I would also change my mind if there were compelling evidence that individual voting behavior signals something to elites that changes policy regardless of the election outcome, effectively creating a causal link that bypasses the pivot condition. However, my own reasoning is most likely to break down in the assumption that students or actors are actually performing this calculus consciously. The rational choice model presumes a level of computational awareness that rarely exists in reality, and it may be that voting is driven by habit, identity, or social norms that operate outside the framework of instrumental rationality entirely. By framing the debate solely around whether voting is rational, we might be importing a theoretical model that fails to capture the phenomenology of political participation, leading us to solve a puzzle that only exists within the confines of Downsian theory rather than in the actual behavior of citizens. I hope this helps you cut through the noise in those papers without having to rewrite the same paragraph forty times.

