answer: |-
  Your diagnosis is perceptive and, in my view, largely correct, though it requires a slight refinement to capture the full texture of the stalemate. You suggest the impasse rests on a disguised disagreement about whether computation is an observer-independent property or relative to a description. I would argue that this is indeed the metaphysical engine of the debate, but it is coupled with a methodological disagreement about **individuation**: how we carve physical systems into functional units.

  The debate stalls because computationalists and critics are often talking past one another regarding the *purpose* of the computational label. For the computationalist, it is an ontological claim about causal structure; for the critic, it is a semantic claim about interpretation. To move forward, we must stop asking whether the brain *is* a computer and start asking under what constraints a computational description tracks causal powers.

  ### Engaging the Sides

  **The Computationalists**
  Proponents such as Gualtiero Piccinini, Oron Shagrir, and the heirs of David Marr do not merely claim that the brain *can be modelled* computationally. They argue that certain neural processes are **mechanistically individuated** by their computational properties. Their argument rests on **medium independence**. A computational mechanism is defined by its ability to manipulate vehicles (signals) based on their structure rather than their specific physical constitution. When a neuroscientist identifies a 'working memory buffer' or a 'edge detector', they are claiming that the physical system is organised such that it maintains a state corresponding to a variable, independent of the specific ions or voltages involved. They argue that if the physical dynamics mirror the logical transitions of an algorithm (specifically, if they support the relevant counterfactuals), the computation is intrinsic to the mechanism, not imposed by the observer.

  **The Critics**
  Critics, following the lineage of John Searle, Hilary Putnam, and more recently proponents of embodied cognition like Daniel Hutto, argue that syntax is not intrinsic to physics. Searle's famous contention is that computation is observer-relative: a system is a computer only relative to an interpretation that assigns syntactic values to physical states. Putnam's triviality argument suggests that without strict constraints, any open physical system (a wall, a thunderstorm) can be mapped onto any finite state automaton. If everything computes, then saying the brain computes explains nothing. For these critics, the brain is a biological organ driven by electrochemical dynamics; to call it a computer is to privilege a specific, perhaps anthropocentric, descriptive vocabulary over the biological reality.

  ### The Diagnosis: Metaphysics meets Individuation

  Your hypothesis that this is a disagreement about the concept of computation is correct, but it is specifically a disagreement about **causal relevance**.

  1.  **The Metaphysical Disagreement:** You are right that computationalists presuppose computation is intrinsic (a natural kind), while critics presuppose it is extrinsic (a descriptive tool). However, modern mechanistic computationalists have conceded that computation requires a physical vehicle; they deny that it is *merely* in the eye of the beholder. They argue that while syntax requires interpretation, the **capacity to be interpreted** in a specific, causally robust way is an objective physical property.
  2.  **The Methodological Disagreement:** The deeper issue is individuation. Critics assume that physical states are individuated solely by their microphysical properties (voltage, chemical concentration). Computationalists individuate states by their functional role within a system. The impasse arises because critics demand a microphysical reduction of computation, while computationalists argue computation exists at a higher level of mechanistic organisation.

  Therefore, the dispute is not merely verbal, nor is it purely empirical. It is a **philosophical dispute about the levels of explanation permitted in science**. If one demands that all genuine explanation bottom out in fundamental physics, computationalism fails. If one accepts special sciences (biology, psychology) as identifying real, higher-level causal structures, computationalism stands.

  ### Moving the Debate Forward

  We should not expect a 'Eureka' moment that proves the brain is a computer in the same way we prove water is H₂O. However, the debate can be dissolved, or at least rendered productive, by pursuing three specific avenues:

  **1. A Formal Result on Implementation Constraints**
  The triviality arguments (Putnam, Searle) rely on mappings that are ad hoc and lack **counterfactual robustness**. To move forward, we need a rigorous formalisation of 'implementation' that rules out the 'wall' case. Work by David Chalmers and others suggests that a physical system implements a computation only if the causal structure of the physical system supports the state transitions of the automaton under counterfactual conditions.
  *   *The Path:* We need a theorem demonstrating that biological neural networks possess a specific causal topology (e.g., modularity, feedback loops, specific noise tolerance) that satisfies these robustness constraints, whereas a wall or thunderstorm does not. If we can formally show that the brain's physical dynamics *constrain* the possible computational descriptions to a narrow set, the charge of 'cheapness' loses its force.

  **2. A Conceptual Distinction: Instrumentalism vs. Mechanistic Realism**
  We must distinguish between **computational modelling** (using a computer to simulate the brain) and **computational mechanism** (the brain operating via computational principles).
  *   *The Path:* Philosophers and scientists should agree to treat computationalism as a **mechanistic hypothesis**. The claim is not "the brain is like a PC," but "neural circuits are organised to process information in a medium-independent way." If a specific neural circuit is disrupted by changing the *logical* structure of input without changing the *physical* energy of input, that is empirical evidence for intrinsic computation. This shifts the burden from metaphysics to experimental design.

  **3. A Class of Experiments: Structural Isomorphism**
  The most promising empirical route is to search for **structural isomorphism** between neural activity and computational states.
  *   *The Path:* Experiments should aim to show that manipulating the 'algorithm' (e.g., changing the rules of a task) produces predictable, specific changes in neural dynamics that cannot be explained by low-level energy dynamics alone. For instance, in predictive processing, if the brain minimises 'prediction error', we should be able to identify a neural signal that tracks statistical surprise independent of sensory intensity. If such a signal is found and causally manipulated, it demonstrates that the brain is tracking information, not just exchanging energy. This would show that the computational description is tracking a real, causally potent property of the system.

  ### Conclusion

  Your diagnosis is sound: the stalemate is rooted in a conflict over whether computation is intrinsic or relative. However, resolving this does not require settling the metaphysics once and for all. Rather, it requires showing that the **computational level of description is causally indispensable**.

  If we can demonstrate that the brain's physical organisation constrains computational interpretations so tightly that the computational description becomes the only viable way to predict and manipulate the system's behaviour, the distinction between 'intrinsic' and 'relative' becomes pragmatically moot. The debate will move forward not when we define 'computer' perfectly, but when we show that treating the brain as a computer yields causal leverage that a purely dynamical or chemical description cannot match. Until then, we are indeed stuck choosing between a metaphysics of information and a metaphysics of matter.
