  9.  **Synthesize the "Remains" of the Obstacle:**
      *   Löb's theorem *does* prevent a formal system from proving its own soundness.
      *   It *does* prevent a system from deductively certifying a successor of equal or greater strength without loss of strength (the Tiling Agents problem).
      *   It *does not* prevent probabilistic self-trust or empirical calibration.
      *   It *does not* prevent self-modification if you accept uncertainty or restrict the scope of the proof.
