answer: |-
  This is a well-trodden path in **Experimental Philosophy (X-Phi)**, specifically in the debate surrounding **intuition variability**.

  There isn't a single Latin fallacy name for it, but the standard term for the argument you're describing is **The Expertise Defense** (or sometimes **The Professional Competence Defense**). When used in the specific ad-hoc way you describe to dismiss cross-cultural data, critics often refer to it as **Circular Competence Attribution** or, more colloquially, the **"No True Competent Speaker"** fallacy.

  Here is the breakdown of the terminology, the literature, and the "carve" you asked for.

  ### 1. The Established Terminology

  **The Field:** Experimental Philosophy (X-Phi).
  **The Data:** The studies you mention are likely Weinberg, Nichols, & Stich (2001) on Gettier cases, and Machery, Mallon, Nichols, & Stich (2004) on Kripke's Gödel case.
  **The Argument:** **The Expertise Defense.** This is the claim that philosophical intuitions are evidence only when held by those with relevant expertise (training, language mastery, conceptual clarity), and that "folk" intuitions (or non-Western undergraduates, in this context) are performance errors, not competence data.
  **The Distinction:** Philosophers borrow the **Competence/Performance Distinction** from Chomskyan linguistics.
  *   *Competence:* The underlying, idealized knowledge of the concept.
  *   *Performance:* The messy application of that knowledge in real-time (subject to noise, confusion, translation error).

  The move you are identifying is when a theorist attributes all disagreement to *performance errors* (bad translation, lack of focus) without independent evidence, solely to preserve the claim that *competence* is universal.

  ### 2. The Fallacy: "No True Competent Speaker"

  While "The Expertise Defense" is the neutral term for the argument, the *abusive* version is a specific instance of **No True Scotsman**.

  *   **Claim:** "All competent speakers intuit P."
  *   **Evidence:** "Group X does not intuit P."
  *   **Response:** "Then Group X are not competent speakers."
  *   **Criterion for Competence:** Intuiting P.

  This is circular. It immunizes the claim against falsification by making the definition of the population dependent on the data point you are trying to protect.

  ### 3. The Carve: Legitimate vs. Illegitimate

  You asked for the boundary conditions. When is a competence objection legitimate? In the literature (e.g., debates between Timothy Williamson and Jonathan Weinberg), the carve comes down to **Independent Access**.

  #### Legitimate Competence Objection
  You are justified in excluding a group's data if you can verify their "incompetence" **independently of the target intuition.**
  *   **Linguistic Validation:** You can show via separate language tasks that the translation of "know" or "refer" in the target language lacks the necessary semantic features (e.g., factivity) required for the vignette to work.
  *   **Comprehension Checks:** The participants failed control questions indicating they understood the vignette (e.g., "Did the man have evidence?" "Was the belief true?").
  *   **Noise Filtering:** The variance is random. If Group A splits 50/50 and Group B splits 50/50, that's noise. If Group A is 90/10 and Group B is 10/90, that's a systematic difference, and calling it "noise" requires heavy lifting.
  *   **Training Convergence:** You can show that *training* moves the needle. If you teach Group B the stipulative definitions and their answers shift to match Group A, the initial objection was legitimate (they lacked the technical frame). If training doesn't change their answers, the difference is likely conceptual, not competence-based.

  #### Illegitimate Competence Objection (Immunization)
  You are committing the fallacy if the *only* evidence for their lack of competence is their disagreement with the intuition.
  *   **Outcome-Defined Competence:** "They don't understand 'knowledge' because they said the Gettier subject doesn't know." (This defines understanding by the output).
  *   **The "Stipulation" Shield:** Claiming the participants failed to treat the terms stipulatively, without testing whether they *could* treat terms stipulatively in other contexts.
  *   **Asymmetric Skepticism:** Demanding rigorous proof of translation equivalence for the dissenting group while accepting the home-language intuition as self-validating.

  ### 4. A Proposed Term: "Outcome-Defined Competence"

  Since you asked for a name if one doesn't exist, I propose **Outcome-Defined Competence** (ODC).

  **Definition:** A methodological move where the criteria for a subject's conceptual competence are defined retrospectively by their agreement with a target intuition, rather than prospectively by independent measures of understanding or training.

  **Boundary Cases:**
  *   **Legitimate:** "We excluded these respondents because they failed the attention check asking if the protagonist had evidence." (Independent measure).
  *   **ODC (Fallacious):** "We exclude these respondents because their answers suggest they don't grasp the concept of justification." (Outcome measure).

  ### 5. The Rationalist/ Bayesian Frame

  For a rationalist audience, the issue is best framed as **Updating on Priors**.

  *   **Prior:** "My intuition is a reliable signal of universal conceptual structure."
  *   **Evidence:** "Culturally distinct groups systematically diverge."
  *   **Standard Update:** Lower confidence in the universality of the intuition.
  *   **The ODC Move:** Treat the evidence as "corrupted data" rather than "counter-evidence."

  This is only rational if the probability of data corruption (translation error, confusion) is higher than the probability of conceptual variation. However, proponents of the Expertise Defense often set the probability of corruption to near 1.0 *conditional on disagreement*. That is a likelihood ratio of infinity, which forbids updating.

  **The Steelman:** The steelman version of the universalist position is that philosophical concepts are *technical tools* (like "mass" in physics), not folk descriptions. If you ask a layperson about "mass," they might conflate it with "weight." If you ask a non-physicist culture about "knowledge," they might conflate it with "justified true belief + social standing." The universalist claims they are testing the *technical* concept, and the cross-cultural subjects are answering about the *folk* concept.

  **The Counter-Steel:** If the "technical" concept is only graspable by people who already agree with your theory, the concept is doing no work. It's a **Motte-and-Bailey**:
  *   **Bailey:** "This is how *people* think." (Universality)
  *   **Motte:** "This is how *trained philosophers* think." (Expertise)
  *   **Switch:** When data contradicts the Bailey, retreat to the Motte. When challenged on why philosophers are the arbiters, point back to the Bailey ("It's universal!").

  ### Summary
  *   **Field:** Experimental Philosophy.
  *   **Argument Name:** The Expertise Defense / Competence-Performance Distinction.
  *   **Fallacy Name:** No True Competent Speaker / Circular Competence Attribution.
  *   **Proposed Label:** Outcome-Defined Competence.
  *   **The Carve:** Can you identify the "incompetent" subjects *before* you look at their answer to the target question? If no, it's immunization.

  If you want to read the primary source on this debate, look for **Edouard Machery's *Philosophy Within Its Proper Bounds*** (2017), which argues that if intuitions vary, they are useless as evidence. The counter-argument is best represented by **Timothy Williamson's *The Philosophy of Philosophy*** (2007), which defends the armchair method via the competence distinction.
