answer: |-
  Students collaboratively draft and revise a working definition of life to classify ambiguous samples while spending a limited budget every time their definition forces a contradiction or requires amendment.

  ### Activity Design: The Planetary Protection Panel

  **Objective:** Create a watertight definition of "Life" to classify extraterrestrial samples without exhausting the Quarantine Budget.
  **Players:** 14 students (One large Board).
  **Time:** 60 minutes.
  **Materials:** Whiteboard/markers, printed "Sample Cards" (kept hidden), visible Budget Tracker (start at 100 Credits), Timer.

  **Roles (Assign immediately to manage 14 students):**
  *   **Chair (1):** Manages speaking order, calls votes.
  *   **Scribes (2):** Write the current Definition on the board (must be visible at all times).
  *   **Auditors (2):** Track budget and flag inconsistencies with previous rulings.
  *   **Board Members (9):** Debate and vote.

  **The Economy (The Stakes):**
  *   **Start:** 100 Quarantine Credits.
  *   **Definition Revision:** -10 Credits (Every time you change a word in the definition).
  *   **Inconsistent Ruling:** -20 Credits (If you classify Sample B differently than Sample A despite fitting the same definition).
  *   **Game Over:** If Budget hits 0, "Planetary Contamination" occurs (everyone loses).
  *   **Bonus:** +10 Credits if a student proposes a hypothetical counter-example that breaks the current definition *before* you move to the next sample.

  ### Timeline & Case Order

  **0:00–0:10: The Charter (Definition Phase)**
  *   Tell them: "You are the UN Planetary Protection Panel. Samples are arriving. You must stamp them ALIVE or INERT. To do this, you need a rulebook."
  *   Task: Write a definition of LIFE on the board.
  *   Constraint: You cannot use the word "life" or "alive" in the definition (prevents circularity).
  *   *Facilitator Note:* Watch for "Definition by Enumeration" (e.g., "It looks like a plant or animal"). If they do this, the Auditors must charge a 10 Credit "Vague Language Fee" immediately and force a rewrite.

  **0:10–0:45: The Sample Rounds (35 Minutes)**
  *   Present one sample at a time. Give them 3 minutes to discuss, 1 minute to vote, 1 minute to revise definition (if needed).
  *   **Sample 1: The Control (Earth Dog DNA)**
      *   *Data:* Metabolizes, grows, reproduces, cellular.
      *   *Goal:* Easy "ALIVE". Establishes baseline. No cost.
  *   **Sample 2: The Virus (Viral Particle)**
      *   *Data:* Contains genetic code, evolves, reproduces (only inside host), no metabolism, no cells.
      *   *Trap:* If their definition says "Must have metabolism," this is INERT. If it says "Must reproduce," this is ALIVE.
      *   *Likely Outcome:* They will argue. If they classify as INERT, ask: "But it evolves like us." If ALIVE, ask: "But it does nothing alone."
      *   *Cost:* They will likely need to revise the definition to accommodate or exclude this. (-10 Credits).
  *   **Sample 3: The Mule (Sterile Hybrid)**
      *   *Data:* Metabolizes, grows, cellular, *cannot reproduce*.
      *   *Trap:* Breaks the "Reproduction" criterion.
      *   *Student Generation Moment:* Before revealing this card, ask the Board: "Look at your definition. What is the weakest word? Can anyone imagine something alive that *doesn't* do that?" If someone says "What about sterile animals?", grant the +10 Bonus Credit.
  *   **Sample 4: The Flame (Chemical Fire)**
      *   *Data:* Consumes fuel (metabolism), grows, spreads, reacts to environment, *no cells/DNA*.
      *   *Trap:* Breaks "Energy Use/Growth" criteria if not tied to chemistry.
      *   *Student Generation Moment:* Ask: "You said 'consumes energy'. What else does that?" If they spot Fire themselves, +10 Credits.
  *   **Sample 5: The Cryptobiont (Frozen Tardigrade)**
      *   *Data:* Complex organism, currently zero metabolism, desiccated, *can be revived*.
      *   *Trap:* Breaks "Current Metabolism" criteria. Is it alive while frozen?
      *   *Cost:* Forces distinction between "potential life" and "active life".
  *   **Sample 6: The Von Neumann Probe (Self-Replicating Robot)**
      *   *Data:* Made of metal/silicon, mines resources, builds copies of itself, adapts to terrain, *no carbon/DNA*.
      *   *Trap:* Breaks "Carbon-based/Chemical" criteria.
      *   *Goal:* Final stress test. If they classify as ALIVE, they must accept AI as life. If INERT, they must explain why biology is special beyond chemistry.

  **0:45–1:00: The Debrief (15 Minutes)**
  *   Do not declare a winner. Count the remaining budget.
  *   **Map the Damage:** Go through the definition on the board. Highlight every word added after Round 1 in a different color.
  *   **Discuss the Cost:** Ask, "Was it worth spending 10 Credits to patch the definition for the Mule? Or should we have just accepted Mules aren't alive?"
  *   **Philosophical Pivot:** Reveal that scientists still disagree. Show them that their definition is now 40 words long and fragile.

  ### Debrief Mapping (Facilitator Cheat Sheet)

  | Case | Criterion Broken | Cost to Patch | Philosophical Concept |
  | :--- | :--- | :--- | :--- |
  | **Virus** | Independent Metabolism / Cell Theory | High (Must add "host dependence" clause) | **Vitalism vs. Mechanism:** Is life a substance or a process? |
  | **Mule** | Reproduction | Medium (Must add "potential to reproduce" or "member of reproducing species") | **Individual vs. Species:** Is life a property of the个体 or the lineage? |
  | **Fire** | Growth / Energy Consumption | High (Must add "chemical/homeostatic" constraint) | **Equifinality:** Different systems can look the same (order from disorder). |
  | **Tardigrade** | Continuous Activity | Medium (Must add "temporal" clause) | **State vs. Disposition:** Is life a state of being or a capacity? |
  | **Robot** | Carbon Basis / Biology | High (Must decide on "substrate independence") | **Substrate Neutrality:** Is life about the stuff or the pattern? |

  ### What Will Definitely Go Wrong (First Run)

  1.  **Definition by Enumeration:** They will write "Alive = Dogs, Humans, Trees."
      *   *Fix:* The Auditors must catch this immediately. Enforce the rule: "No specific Earth examples allowed." Charge the 10 Credit fee.
  2.  **The Semantics Escape Hatch:** They will say, "Okay, this doesn't fit, so we'll just change the definition to fit this case."
      *   *Fix:* The Budget. Changing the definition costs money. If they change it twice in one round, charge double. Make them feel the pain of inconsistency.
  3.  **Dominant Voices:** 2 students will dominate the 14.
      *   *Fix:* The Chair role is crucial. Instruct the Chair to use a "talking stick" method or call on quiet members first. You (the facilitator) must intervene if the same 3 kids speak twice in a row.
  4.  **Time Creep:** They will get stuck on the Virus for 20 minutes.
      *   *Fix:* Hard stop the timer. "Budget is draining while you talk. Vote now."

  ### The Limitation You Must Supply

  This game cannot reproduce the **ontological uncertainty** of the real problem. The game structure implies there *is* a correct classification (Alive/Inert) and a perfect definition exists if they just spend enough budget. In reality, many philosophers and biologists argue "Life" is a **cluster concept** (no single necessary condition) or a **spectrum**, not a binary box.

  **How to supply this:** In the final 5 minutes, you must break the game frame. Tell them: "In the real world, there is no UN Panel. There is no budget. Scientists still publish papers arguing viruses are alive and others arguing they aren't. The problem isn't that your definition was weak; the problem might be that 'Life' isn't a thing that can be defined neatly. You were trying to draw a border on a map where there is only fog."
