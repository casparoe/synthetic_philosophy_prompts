answer: |-
  Your intuition is correct: while your roommate's argument is a very popular modern take (often called "Cybernetic Socialism" or "Algorithmic Planning"), most economists and philosophers of economics believe it misunderstands the core of Hayek's argument in particular.

  The short answer is: **No, computing power has not settled the debate.** While technology solves the *arithmetic* problem, it does not solve the *epistemic* (knowledge) or *incentive* problems.

  Here is a breakdown of why your roommate's argument feels "off," structured by the specific economic concepts involved.

  ### 1. Mises vs. Hayek: Two Different Arguments
  Your roommate conflates Mises and Hayek, but they made distinct points.

  *   **Mises (The Accounting Argument):** Mises argued that without private property in the means of production, there are no market prices for capital goods. Without prices, there is no common denominator to compare inputs and outputs. You can't know if producing steel with Method A is more efficient than Method B if you don't have price signals reflecting scarcity.
      *   *Tech Counter:* Computers don't fix this. If there is no market exchange, there is no price discovery. A computer can process numbers, but it cannot generate the *meaning* of those numbers (scarcity/value) without a market process.
  *   **Hayek (The Knowledge Argument):** This is where your roommate's argument fails most significantly. Hayek agreed that the math *could* be done in theory. His point was that the information **does not exist in a form that can be gathered.**

  ### 2. The Problem of "Tacit Knowledge"
  Hayek argued that economic knowledge is not just statistical data (like "how many tons of steel were produced"). It is **tacit, local, and subjective.**

  *   **Example:** A warehouse manager knows that a specific machine makes a weird noise when it's about to break, or that a specific local supplier is unreliable even though their data looks good. A commuter knows a shortcut that isn't on the map.
  *   **The Tech Limit:** You cannot upload tacit knowledge to a central server. People often don't know they know it until they are faced with a specific situation. Big Data captures *what happened*, but it struggles to capture *context* or *potentiality*.
  *   **Hayek's Insight:** The price system is a telecommunications network. It summarizes all that dispersed, tacit knowledge into a single number (the price). When the price of copper rises, you don't need to know *why* (a mine collapsed, demand spiked, a war started); you just know you need to use less. A central computer would need to know the *why* to adjust the plan, which requires gathering the tacit knowledge of millions of people instantly.

  ### 3. The Incentive Problem (Garbage In, Garbage Out)
  Even if you had a quantum computer capable of processing the data, you face the **Principal-Agent Problem.**

  *   **Truth-Telling:** In a market, if you lie about your costs or capabilities, you lose money and go bankrupt. The market punishes false data. In a central planning system, local managers often have an incentive to lie to the central bureau (e.g., underreporting capacity to get easier quotas, or overreporting needs to get more resources).
  *   **Tech Limit:** Machine Learning models are only as good as their training data. If the humans inputting the data are gaming the system to meet KPIs, the AI will optimize a fantasy economy. Technology does not solve human incentive structures.

  ### 4. Static Optimization vs. Dynamic Discovery
  Your roommate's argument assumes the economy is a static engineering problem (like optimizing a supply chain for a known product). But the economy is a **dynamic discovery process.**

  *   **Entrepreneurship:** Markets don't just allocate resources for *known* wants; they discover *new* wants. Steve Jobs didn't survey people to find out they wanted an iPhone; the preference didn't exist until the product was offered.
  *   **The Optimization Function:** To plan an economy with AI, you must program an "objective function" (what are we maximizing?). Is it GDP? Leisure time? Carbon reduction? Equality?
      *   In a market, everyone has their own objective function.
      *   In a planned system, the planners (or the coders) decide the objective.
      *   Tech can optimize for a goal, but it cannot tell you *what the goal should be.* That is a political/philosophical question, not a computational one.

  ### 5. Historical Context: Project Cybersyn
  Your roommate's idea isn't new. In the early 1970s, Chile under Salvador Allende attempted **Project Cybersyn**. They used telex machines and early cybernetics to try to manage the economy in real-time.
  *   **Result:** It was fascinating, but it ultimately failed. Not because the computers weren't fast enough, but because of political instability, incentive mismatches, and the inability to capture the nuance of local economic conditions.

  ### 6. The Modern "Market Socialist" Counter
  There are modern economists (like Paul Cockshott or Allin Cottrell) who argue exactly what your roommate is arguing. They suggest that with modern tech, we could calculate labor values and allocate resources without markets.
  *   **The Critique:** Even their critics acknowledge that tech makes planning *more feasible* than in 1920, but they maintain it still suffers from the **innovation stagnation** problem. Without the profit motive and the risk of bankruptcy, who takes the risk on the "next big thing" that the data doesn't yet justify?

  ### Summary for Your Argument
  You can tell your roommate he is half-right but misses the point.

  1.  **He is right that:** The *arithmetic* barrier Mises hinted at is largely gone. We can solve simultaneous equations faster now.
  2.  **He is wrong that:** This solves the *economic* problem.
      *   **Epistemic:** You can't data-mine knowledge that doesn't exist yet (tacit knowledge/entrepreneurship).
      *   **Incentive:** Computers don't stop people from lying to the system.
      *   **Normative:** An algorithm can optimize an economy, but it can't decide what "better" means without human input, which reintroduces politics.

  **The Verdict:** Technology reduces the *friction* of planning, but it does not resolve the *calculation problem* as defined by Hayek. The debate is not settled; it has just moved from "Can we do the math?" to "Can we capture the context?" and "Who programs the AI?"

  Your feeling that something is off is spot-on: he is treating the economy like a machine to be engineered, whereas Hayek treated it like an ecosystem to be navigated. You can supercharge a tractor, but that doesn't mean you can engineer a forest.
