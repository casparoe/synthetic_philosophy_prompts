answer: |-
  Here is a proposal for your reading group assignment, designed to cut through the semantic fog.

  ### Essay Question

  **The Instrumentalist's Trap: Criteria for Feature Realism**

  Interpretability tools (such as sparse autoencoders or linear probes) often identify directions in activation space that correlate with human-interpretable concepts. When such a tool successfully predicts network behavior, proponents claim the feature is "real," while skeptics claim it is merely a useful projection imposed by the observer.

  Write an essay answering the following: **Under what specific conditions does the predictive success of an interpretability tool constitute evidence for the *ontological existence* of a feature, rather than merely the *epistemic utility* of a description?**

  In your answer, you must:
  1.  Explicitly distinguish between a claim about the network's causal machinery and a claim about the accuracy of our map of that machinery.
  2.  Explain why predictive accuracy alone is insufficient to settle the debate.
  3.  Propose a concrete empirical or conceptual test that would force a resolution between the realist and instrumentalist views.

  ***

  ### Model Answer (Approx. 500 words)

  The debate over whether neural network features are "real" often stalls because participants conflate ontology (what exists) with epistemology (what we can know). To move forward, we must treat the neural network as a physical system with a specific causal structure, analogous to a molecule, rather than a black box defined solely by input-output mappings.

  First, we must distinguish the nature of the claims. A realist claim asserts that a specific subspace of activations is *causally responsible* for the network's behavior regarding a concept. For example, claiming a "dog feature" exists means that specific neurons or directions are leveraged by the optimization process to compute "dog-ness." An instrumentalist claim asserts only that a human-constructed description (like a linear probe) maps cleanly onto the network's states. The latter is a claim about the faithfulness of our summary, not the structure of the system. A map can be useful without the territory containing boundaries that match the map's lines.

  Second, we must resist the inference that predictive success implies ontological reality. This is the "instrumentalist trap." In spectroscopy, a spectral peak usually corresponds to a specific vibrational mode; if we perturb the bond, the peak shifts. This causal link justifies realism. In ML, however, a linear probe can find a direction that predicts "sentiment" with 99% accuracy, even if the network computes sentiment using a complex, non-linear basis that merely *projects* onto that direction. The probe works because high-dimensional spaces allow for many separable hyperplanes, not necessarily because the network "uses" that specific hyperplane. Predictive success demonstrates correlation, not mechanism. A Ptolemaic epicycle model can predict planetary positions accurately without the epicycles being real physical structures.

  Therefore, predictive accuracy is necessary but insufficient for realism. To settle the dispute, we require evidence of *causal involvement* and *robustness*. The specific condition under which we should accept a feature as real is when intervening on that feature alters behavior in a targeted way, without breaking the network's general functionality.

  This suggests a concrete test: **Causal Intervention with Robustness.** If we identify a feature via a sparse autoencoder (SAE), we should be able to ablate or activate that feature and observe a specific, predictable change in output (e.g., removing the "past tense" feature changes verbs to present tense without affecting noun agreement). Crucially, this must hold across different input distributions. If the feature is merely an artifact of our description, intervening on it will either have no effect (the network ignores it) or catastrophic side effects (because we cut across the true computational grain).

  Furthermore, the feature should be *robust to re-parameterization*. If we retrain the network to perform the same task with a different random seed, does a structurally equivalent feature emerge? If the feature is a property of the task solution (real), it should recur. If it is a property of our specific interpretability tool or the specific training trajectory (imposed), it will not.

  In conclusion, a feature is "real" only if it functions as a causal lever within the mechanism, not merely as a coordinate on our map. We shift from instrumentalism to realism when interpretability tools transition from passive observation to successful, targeted intervention. Until then, we are merely drawing constellations in the stars.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Ontological vs. Epistemic Distinction (0–6 Marks)**
  *   **5–6 Marks:** Clearly distinguishes between the network's causal mechanism (ontology) and the observer's description/map (epistemology). Uses the "map vs. territory" or "mechanism vs. summary" analogy effectively.
  *   **3–4 Marks:** Identifies the difference but treats them as merely semantic variations.
  *   **0–2 Marks:** Conflates the two; argues that if we can describe it, it exists.
  *   **Penalty:** Automatic deduction of 3 marks if the essay relies on "it depends on your definition of representation."

  **2. Critique of Predictive Success (0–6 Marks)**
  *   **5–6 Marks:** Explicitly argues that correlation/prediction $\neq$ causation. Uses an analogy (e.g., Ptolemaic epicycles, spectral peaks, or high-dimensional geometry) to show why a tool can work without the feature being "used" by the network.
  *   **3–4 Marks:** Acknowledges prediction isn't proof but fails to explain *why* (e.g., doesn't mention overparameterization or alternative bases).
  *   **0–2 Marks:** Accepts predictive accuracy as sufficient proof of reality.

  **3. Criteria for Resolution (0–6 Marks)**
  *   **5–6 Marks:** Proposes a concrete test involving **causal intervention** (ablation/activation) and/or **robustness** (invariance across seeds/architectures). Explains *why* this settles the dispute (tests the causal grain).
  *   **3–4 Marks:** Suggests "better tools" or "more data" without specifying a mechanistic test.
  *   **0–2 Marks:** Concludes the dispute is unsolvable or purely philosophical.

  **4. Clarity and Structure (0–2 Marks)**
  *   **2 Marks:** Argument flows logically; terminology is used precisely.
  *   **1 Mark:** Understandable but disorganized.
  *   **0 Marks:** Incoherent or significantly over/under word count.

  **Examiner's Note:** *Look for the "Chemist's Intuition." Candidates who treat the network as a physical system to be dissected (causal structure) rather than a text to be interpreted usually score higher on Section 3.*
