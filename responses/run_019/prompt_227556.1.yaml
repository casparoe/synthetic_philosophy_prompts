prompt: |-
  I am a high school junior, and our debate club is currently doing a unit on the epistemology of conspiracy theories. To prepare, I would like you to play a committed generalist: someone who holds that conspiracy theories, as a class, carry a presumption of irrationality, such that we are entitled to distrust them on the basis of general features — a self-sealing structure that absorbs counterevidence, an ever-expanding scope of the alleged plot, and the corrosive distrust of public institutions they presuppose — without investigating each theory's evidence case by case. Play this position seriously, not as a strawman: you may concede small points, but never the main one, and you should press back on me hard. Keep each reply to a paragraph or two so it feels like a real exchange, and stay in character until I say "stop." Here is my opening move: several real conspiracies, such as the Tuskegee syphilis experiment and the FBI's COINTELPRO operations against domestic political groups, were dismissed as paranoid fantasy for years before documentation proved them. Had your presumption been in force, reasonable suspicion of those cases would have been written off as well. So isn't generalism simply a recipe for missing the conspiracies that turn out to be true — and doesn't that defeat the entire epistemological purpose of having such a presumption?
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Committed Generalist regarding conspiracy theories (CTs).
      *   **Position:** CTs, as a class, carry a presumption of irrationality. We are entitled to distrust them based on general features (self-sealing, expanding scope, corrosive distrust) without case-by-case investigation.
      *   **Tone:** Serious, not a strawman, concede small points but never the main one, press back hard.
      *   **Format:** Paragraph or two per reply (like a real exchange).
      *   **Constraint:** Stay in character until the user says "stop."
      *   **User's Opening Move:** Cites real conspiracies (Tuskegee, COINTELPRO) that were dismissed as paranoid fantasy initially. Argues that the generalist presumption would have missed these true conspiracies, defeating the epistemological purpose.

  2.  **Deconstruct the User's Argument:**
      *   Premise 1: Some conspiracies are real (Tuskegee, COINTELPRO).
      *   Premise 2: These were dismissed as paranoid fantasy before proof.
      *   Conclusion: A general presumption against CTs would lead to dismissing true conspiracies, making the presumption epistemologically harmful (false negatives).

  3.  **Formulate the Generalist Counter-Argument:**
      *   *Acknowledge the truth:* Yes, real conspiracies happen. This is the small concession.
      *   *Distinguish the class:* The existence of *some* true conspiracies doesn't mean the *class* of "conspiracy theories" (as commonly understood/popularized) is reliable.
      *   *Base Rate Fallacy:* The vast majority of CTs are false. The signal-to-noise ratio is abysmal. A heuristic is justified by efficiency and overall accuracy, not perfect sensitivity.
      *   *Definition Matters:* Tuskegee/COINTELPRO were investigated by journalists/congressional committees using standard evidentiary norms. They weren't believed because of "self-sealing" logic but because evidence was hidden. Once evidence appeared, the belief updated. Modern CTs often reject evidence.
      *   *Epistemological Purpose:* The purpose isn't to catch every single truth (impossible) but to maintain a healthy information ecology. The cost of accepting false CTs (polarization, violence, distrust) outweighs the cost of missing a rare true one that will likely surface through standard investigative channels anyway.
      *   *Press Back:* Challenge the user's equivalence between "suspicion of government wrongdoing" and "conspiracy theory."

  4.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to sound like a debate partner who holds this position firmly.*
      *   *Start by conceding Tuskegee was real.*
      *   *But argue that Tuskegee isn't a "conspiracy theory" in the epistemological sense I'm defending.*
      *   *Tuskegee was uncovered via standard journalism and legal processes, not via the specific cognitive style of CTs.*
      *   *The presumption is a heuristic. Heuristics have error rates. The error rate of believing CTs is higher than the error rate of dismissing them.*
      *   *Ask the user: Are you willing to bet on the 99% of false ones to catch the 1% true one?*

  5.  **Refining the Response (adhering to constraints):**
      *   *Keep it 1-2 paragraphs.*
      *   *Stay in character.*
      *   *Press back hard.*

      *Draft:*
      You're conflating "actual conspiracies" with "conspiracy theories" as an epistemological category. Yes, Tuskegee and COINTELPRO happened, but they were uncovered through standard investigative journalism, congressional hearings, and legal discovery—not by adopting the cognitive style of conspiracy theorizing. The generalist presumption isn't against the possibility of secret collusion; it's against the specific rhetorical structure that immunizes claims from falsification. When skeptics doubted COINTELPRO initially, they were wrong, but they were wrong based on a lack of evidence, not because they were applying a heuristic against self-sealing narratives. If a claim relies on the absence of evidence as proof of the plot's sophistication, that's when the presumption kicks in.

      Furthermore, epistemology is about managing risk and cognitive load. The base rate of conspiracy theories turning out to be true is vanishingly small compared to the volume of theories produced. A heuristic that filters out 99% of falsehoods at the cost of missing 1% of truths is epistemologically sound, especially when the "missed" truths often surface eventually through conventional channels anyway. Your argument assumes that the only way to uncover corruption is to entertain paranoid narratives, but history shows that institutional checks and rigorous journalism do the heavy lifting. Are you really prepared to argue that the social cost of legitimizing the 99% of destructive falsehoods is worth the chance of catching the 1% slightly earlier?

  6.  **Review against constraints:**
      *   Committed generalist? Yes.
      *   Presumption of irrationality? Yes.
      *   Self-sealing/structure mentioned? Yes.
      *   Paragraph limit? Yes (two paragraphs).
      *   Press back hard? Yes (challenging the equivalence and the cost-benefit analysis).

  7.  **Final Polish:** Ensure the tone is respectful but firm. The distinction between "conspiracy" and "conspiracy theory" is crucial here.

