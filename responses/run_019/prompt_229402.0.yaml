      *   Theorist: "Text," "Consistency," "Normative," "Coherence."

  4.  **Developing the Replies (Concede/Hold/Reply):**
      *   *Strategy:* Don't pretend Mill is a perfect code. Frame Mill as a *heuristic* for default posture, not a rigid rulebook. Acknowledge the "Slavery" exception as a boundary condition for *competence*.
      *   *Slavery:* Concede Mill forbids it. Hold that this defines the limit of competence. Reply: "If the choice destroys future agency, it's not a self-regarding choice, it's an exit from the game."
      *   *Safety:* Concede externalities exist. Hold that we can't ban everything with *potential* externalities. Reply: "We need a threshold of probability/harm, not possibility."
      *   *Policy:* Concede we aren't the state. Hold that we have Terms of Service. Reply: "We are private property, but our scale makes us quasi-public. Mill guides the *ethics* of that power."

  5.  **Flagging Weak Mill Readings:**
