      *   *Crucial Insight:* A policy can raise the ranking by:
          1.  Actually making people's lives better (GDP, Health, Freedom).
          2.  Changing how people answer the ladder question without life changing (Framing, Expectations).
          3.  Changing who is surveyed (Demographics).
          4.  Changing the *relative* position (other countries get worse).
          5.  Gaming the predictors (e.g., manipulating corruption stats without real change).

  3.  **Drafting the Procedure - Structure:**
      *   **Title:** Needs to sound official but clear. "Well-being Evidence Screening Protocol."
      *   **Introduction:** Purpose and scope.
      *   **The Decision Matrix:** Define the three outputs clearly.
      *   **The Screening Steps (The Core):** Logical flow.
          *   Step 1: Identify the Mechanism (How does it claim to work?).
          *   Step 2: Check the Metric (Is it actually the Cantril Ladder?).
          *   Step 3: Check the Predictors (Does it touch the 6 key factors?).
          *   Step 4: Check for Distortions (Gaming, Adaptation, Composition).
          *   Step 5: Relative vs. Absolute (Ranking vs. Score).
      *   **Judgment Flags:** Explicitly mark where human discretion is needed.
      *   **Worked Examples:** Create stylized policies.

  4.  **Developing the Steps (Iterative Refinement):**

      *   *Step 1 (Mechanism):* Does the proposal claim to change the *score* or the *life*? Need to distinguish between "We will run a campaign telling people to be happier" vs. "We will build hospitals."
      *   *Step 2 (Metric):* WHR uses Cantril Ladder. If a policy targets "momentary joy" or "meaning" but not life evaluation, the WHR ranking might not move even if well-being improves. Or vice versa.
      *   *Step 3 (Predictors):* The WHR ranking is largely driven by 6 variables. If the policy doesn't touch these, how does it claim to move the ranking? If it claims to move the ranking *without* touching these, it might be relying on statistical noise or residual variance.
      *   *Step 4 (Distortions):* This is the philosophy part. Adaptive preferences (lowering expectations so the ladder score goes up even if life is hard), Gaming (changing survey administration), Composition (surveying only rich people).
      *   *Step 5 (Relative):* Rankings are zero-sum. If we improve but others improve more, ranking drops. If we stay same and others crash, ranking rises. Policy should target absolute score, not rank.

  5.  **Refining for the "Under 1 Hour" Constraint:**
      *   Keep questions binary or simple scales.
      *   Provide a "Stop" rule. If it fails early, no need to go deep.
      *   Use a checklist format.

  6.  **Developing the Examples:**
