answer: |-
  # Policy Well-being Screening Protocol (PWSP)

  **Purpose:** To evaluate policy proposals that claim to improve national well-being based on predicted changes in the *World Happiness Report* (WHR) country ranking.
  **Time Required:** Approx. 45–60 minutes per proposal.
  **Users:** Policy Analysts (no philosophy background required).
  **Outputs:** 
  1. **Primary Evidence:** Ranking gain is a reliable proxy for well-being improvement.
  2. **Secondary Evidence:** Ranking gain is possible but unreliable; requires supporting data.
  3. **Disregard:** Ranking gain is irrelevant or misleading for well-being justification.

  ---

  ## Part 1: Operational Definitions
  *Use these definitions for the checklist. Do not use external theoretical definitions.*

  *   **Life Evaluation Score:** The specific number (0–10) respondents give when asked to imagine a ladder where 0 is the worst possible life and 10 is the best, and state where they stand. *The WHR ranking is based on this score.*
  *   **WHR Predictors:** The six specific factors the WHR model uses to explain scores: (1) GDP per capita, (2) Social Support, (3) Healthy Life Expectancy, (4) Freedom to Make Life Choices, (5) Generosity, (6) Perceptions of Corruption.
  *   **Gaming:** Changing how data is collected or reported without changing real life conditions (e.g., changing survey wording, excluding hard-to-reach groups).
  *   **Adaptive Preferences:** A situation where people report higher scores because they have lowered their expectations, not because their material or social conditions improved (e.g., "learning to be happy with less").
  *   **Relative vs. Absolute:** A **Ranking** is relative (beating other countries). A **Score** is absolute (citizens actually doing better). A country's score can rise while its ranking falls if other countries improve faster.

  ---

  ## Part 2: The Screening Checklist

  ### Step 1: The Metric Check
  **Goal:** Ensure the proposal targets the actual WHR metric, not a vague notion of "happiness."

  1.  Does the proposal explicitly claim to raise the **Cantril Ladder Life Evaluation Score** (0–10 scale)?
      *   [ ] Yes
      *   [ ] No (It targets "momentary joy," "meaning," "mental health," or general "happiness" without specifying the ladder score).
  2.  Does the proposal acknowledge the difference between the **Score** (absolute) and the **Ranking** (relative)?
      *   [ ] Yes (It focuses on raising the score; ranking is a byproduct).
      *   [ ] No (It focuses primarily on beating other countries' ranks).

  *   **If No to both:** Proceed to Step 4 (High risk of mismatch).
  *   **If Yes to 1 and No to 2:** Flag for **Professional Judgment** (See Note A).
  *   **If Yes to both:** Proceed to Step 2.

  > **Note A [JUDGMENT REQUIRED]:** If the proposal targets "happiness" but not the Ladder Score, the analyst must decide if the intended outcome correlates strongly with Life Evaluation. *Judgment is about whether the policy outcome (e.g., reduced depression) typically moves the Ladder Score in this country's historical data.*

  ### Step 2: The Predictor Pathway
  **Goal:** Determine if the policy affects the WHR model through genuine drivers or statistical noise.

  3.  Does the proposal claim to directly improve one or more of the **6 WHR Predictors** (GDP, Support, Health, Freedom, Generosity, Corruption)?
      *   [ ] Yes (List which ones: ___________)
      *   [ ] No
  4.  If **No** to Q3: Does the proposal explain *how* the score will rise without touching these predictors?
      *   [ ] Yes (e.g., "Cultural shift," "Survey framing").
      *   [ ] No (Mechanism is unspecified).

  *   **If No to Q3 and Yes to Q4:** Proceed to Step 4 (High risk of Gaming/Measurement effect).
  *   **If Yes to Q3:** Proceed to Step 3.

  ### Step 3: The Distortion Check
  **Goal:** Identify if the score rise is due to real improvement or measurement artifacts.

  5.  **Adaptive Preferences:** Does the policy improve the score by lowering citizens' expectations rather than improving conditions? (Look for terms like "resilience," "adjusting expectations," "acceptance," or "doing more with less" without resource increases).
      *   [ ] Yes
      *   [ ] No
      *   [ ] Unclear
  6.  **Gaming/Composition:** Does the policy change *who* is surveyed or *how* the survey is administered? (e.g., Excluding marginalized groups, switching from phone to online surveys, training interviewers to prompt positive answers).
      *   [ ] Yes
      *   [ ] No
  7.  **Predictor Manipulation:** Does the policy change the *measurement* of a predictor without changing the reality? (e.g., Redefining "unemployed" to lower corruption stats, changing GDP calculation methods).
      *   [ ] Yes
      *   [ ] No

  *   **If Yes to Q5, Q6, or Q7:** Output = **Disregard**. (Stop here).
  *   **If No to all:** Proceed to Step 4.

  > **Note B [JUDGMENT REQUIRED]:** Q5 (Adaptive Preferences) requires judgment. *The analyst must distinguish between psychological support (valid) and asking people to tolerate deprivation (invalid). Look for whether material resources are increasing alongside psychological interventions.*

  ### Step 4: The Relative Position Check
  **Goal:** Ensure the policy isn't relying on other countries failing.

  8.  Is the predicted ranking gain based on an assumption that other countries' scores will stagnate or fall?
      *   [ ] Yes
      *   [ ] No
      *   [ ] Unknown
  9.  Is the predicted *Score* increase substantial (e.g., >0.1 points on the 0–10 scale) or marginal?
      *   [ ] Substantial
      *   [ ] Marginal (<0.05 points)

  *   **If Yes to Q8 and Marginal in Q9:** Output = **Disregard**. (Ranking gain is fragile/zero-sum).
  *   **If Substantial in Q9:** Proceed to Step 5.

  ### Step 5: The Uncertainty Flag
  **Goal:** Identify cases where the link between policy and score is too weak for primary evidence.

  10. Is there historical data or pilot evidence linking this specific policy type to Life Evaluation scores in this country?
      *   [ ] Yes (Strong evidence)
      *   [ ] Yes (Weak/Mixed evidence)
      *   [ ] No (Theoretical only)

  *   **If Strong Evidence + Passed Steps 1–4:** Output = **Primary Evidence**.
  *   **If Weak/No Evidence + Passed Steps 1–4:** Output = **Secondary Evidence**.
  *   **If Ambiguous on Step 3 (Judgment Note B):** Output = **Secondary Evidence** (Mark for Senior Review).

  ---

  ## Part 3: Decision Matrix

  | If the proposal... | And... | Then assign... |
  | :--- | :--- | :--- |
  | **Targets Life Evaluation Score** | **Improves WHR Predictors directly** | **Primary Evidence** |
  | **Targets Life Evaluation Score** | **Improves Predictors indirectly** OR **Evidence is weak** | **Secondary Evidence** |
  | **Targets Ranking only** | **Relies on other countries failing** | **Disregard** |
  | **Uses Adaptive Preferences** | **Lowers expectations without resources** | **Disregard** |
  | **Changes Survey/Measurement** | **Without changing real conditions** | **Disregard** |

  ---

  ## Part 4: Worked Examples

  ### Example 1: The "National Resilience" Campaign
  **Proposal:** A public relations campaign costing $5M. The goal is to teach citizens to "appreciate what they have" and "lower stress by expecting less from the government." The proposal claims this will raise the WHR Ranking by 5 spots within a year.
  **Mechanism:** Workshops and media spots encouraging cognitive reframing of hardship. No new economic or social resources provided.

  *   **Step 1:** Targets "happiness," implies Life Evaluation but focuses on mindset. (Passes loosely).
  *   **Step 2:** Does not touch the 6 WHR Predictors (GDP, Support, etc.). Claims score rise via "cultural shift." (Flag).
  *   **Step 3 (Q5 - Adaptive Preferences):** **YES.** The policy explicitly aims to lower expectations ("expecting less") rather than improve conditions.
  *   **Decision:** **Disregard.**
  *   **Reasoning:** The predicted score increase relies on Adaptive Preferences. Citizens may report higher ladder scores because they have been trained to demand less, not because their well-being has objectively improved. Treating this as welfare improvement would validate deprivation.

  ### Example 2: The "Community Volunteering" Tax Credit
  **Proposal:** A tax deduction for individuals who log 10+ hours of monthly volunteering. Cost: $20M/year.
  **Mechanism:** Increases social connection and generosity. Proposal claims this will improve the WHR Ranking by improving the "Social Support" and "Generosity" predictors.
  **Evidence:** Pilot study in one province showed a 0.03 point increase in Life Evaluation.

  *   **Step 1:** Explicitly links to Life Evaluation Score. (Pass).
  *   **Step 2:** Directly targets 2 of 6 WHR Predictors (Generosity, Social Support). (Pass).
  *   **Step 3:** No evidence of gaming or adaptive preferences. (Pass).
  *   **Step 4:** Predicted score increase is marginal (0.03 points). Ranking gain depends on other countries not improving. (Flag).
  *   **Step 5:** Evidence is Weak/Mixed (only one province, small effect size).
  *   **Decision:** **Secondary Evidence.**
  *   **Reasoning:** The mechanism is sound (touches valid predictors), but the effect size is small and the evidence base is limited. The ranking claim is vulnerable to relative shifts. The policy may be good, but the WHR ranking gain should not be the *primary* justification; it should be supported by local well-being data.

  ### Example 3: The "Urban Density & Freedom" Reform
  **Proposal:** Major zoning reform to allow mixed-use housing in city centers. Cost: $10M (regulatory change).
  **Mechanism:** Claims to reduce commute times (Health), increase disposable income (GDP), and increase "Freedom to Make Life Choices" regarding where to live.
  **Evidence:** No local data. Cites international studies showing mixed results on happiness depending on cultural context.
  **Uncertainty:** The reform might increase GDP but decrease perceived Social Support (less community cohesion in high density).

  *   **Step 1:** Targets Life Evaluation. (Pass).
  *   **Step 2:** Targets 3 Predictors (GDP, Health, Freedom). (Pass).
  *   **Step 3:** No gaming. Adaptive preferences unclear. (Pass).
  *   **Step 4:** Predicted score increase is substantial (0.15 points). (Pass).
  *   **Step 5:** Evidence is **No/Theoretical**. Conflicting effects on predictors (GDP up, Support potentially down).
  *   **Decision:** **Secondary Evidence** (Marked for **Senior Review**).
  *   **Reasoning:** The procedure cannot settle the net effect. While it touches the right predictors, the trade-offs (Freedom vs. Support) create high uncertainty. The WHR model might capture the GDP gain but miss the Social Support loss. It cannot be Primary Evidence due to lack of local data, but cannot be Disregarded as it touches fundamental drivers. Senior officials must weigh the trade-off risks.

  ---

  ## Part 5: Analyst Notes on Professional Judgment

  There are two points in this procedure where you cannot rely solely on checkboxes. You must apply judgment and document your reasoning in the file.

  1.  **Step 1, Note A (Metric Mismatch):** If a policy targets "Mental Health" but not the "Life Evaluation Ladder," you must judge if they are close enough.
      *   *Guidance:* If the policy treats clinical depression, treat it as Secondary Evidence for WHR. If the policy targets "momentary fun" (e.g., free concert tickets), treat it as Disregard for WHR purposes.
  2.  **Step 3, Note B (Adaptive Preferences):** Distinguishing between "resilience" (good) and "resignation" (bad).
      *   *Guidance:* Ask: "Does this policy give people new tools to handle life, or does it ask them to accept worse conditions?" If the latter, mark as Disregard. If you are unsure, mark as Secondary Evidence and flag for Senior Review.

  ---

  **End of Protocol**
