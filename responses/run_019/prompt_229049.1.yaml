answer: |-
  # The "What Happens When You Pull the Trigger?" Time Travel Quiz

  **Instructions:** Read each scenario carefully. Choose the **one** option that best matches your intuition about how reality would respond. There are no right or wrong answers, only consistent ones.

  **1. The Gun**
  Your protagonist points a working gun at her grandfather in 1955 and pulls the trigger. What happens?
  *   **Option 1:** The gun jams, she misses, or her shot accidentally causes them to meet. The past resists change.
  *   **Option 2:** He dies. She immediately begins to fade from existence because her birth is now impossible.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **2. The Family Photo**
  She succeeds in keeping them apart and returns to her "present." She checks a family photo album she brought with her. What does she see?
  *   **Option 1:** The photo is unchanged. It turns out she was always there in the past, even if she doesn't remember it.
  *   **Option 2:** The photo has changed to show a different family. Her original timeline is gone, overwritten by this new one.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **3. The Return Ticket**
  She changes the past and then uses her machine to jump back to the moment she originally left. Where does she arrive?
  *   **Option 1:** She arrives in a new, parallel present. Her original home still exists, but she can't go back to it.
  *   **Option 2:** She arrives in the *only* present, which has now been rewritten to reflect her changes.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **4. The Mirror Image**
  While in 1955, she runs into her own father as a child. She speaks to him. How does this affect her memory?
  *   **Option 1:** She suddenly remembers this conversation happening when she was a child. It was always part of history.
  *   **Option 2:** Her memories update instantly. She now remembers a childhood where this conversation happened, erasing the old memory.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **5. The Almanac**
  She brings a book of future lottery numbers to 1955 and gives it to a stranger. What happens to the numbers in her own memory?
  *   **Option 1:** The numbers were always part of history; the stranger always won, and she just didn't know it until now.
  *   **Option 2:** The numbers create a new branch of reality. In her original mind, she remembers the real winners; in this new world, the stranger wins.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **6. The Butterfly**
  She accidentally steps on a beetle in 1955. She returns to the future. What is the state of the world?
  *   **Option 1:** The world is drastically different (language, borders, technology) because the timeline rewritten itself.
  *   **Option 2:** The world is different, but she retains her original memories because she is a visitor from another branch.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **7. The Pocket Coin**
  She brings a rare coin from 2024 back to 1955 and spends it. She returns to 2024. Where is the coin now?
  *   **Option 1:** The coin is in the 1955 economy. In 2024, it never existed in her pocket to begin with.
  *   **Option 2:** The coin is in the 1955 economy of a new branch. In her original 2024, she still has it (or never left).
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **8. The History Book**
  She goes back to stop a famous war. She returns to the future and opens a history textbook. What does it say?
  *   **Option 1:** The book records that the war was stopped by a mysterious time traveler. She fulfilled history.
  *   **Option 2:** The book says the war never happened. Her original timeline where the war occurred is destroyed.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **9. The Stranger**
  She kills a man in 1955 who she *thought* was her grandfather, but turns out he wasn't. What happens to her existence?
  *   **Option 1:** Nothing changes. She continues to exist normally, though now she is a murderer in the past.
  *   **Option 2:** Reality shudders. Even though he wasn't her grandfather, the act of murder created a new branch where she is a fugitive.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  **10. The Machine**
  She tries to activate the time machine for the first time. What happens?
  *   **Option 1:** It works, but she finds she cannot do anything that would create a paradox.
  *   **Option 2:** It works, and she creates a new divergent timeline the moment she arrives in the past.
  *   **Option 3:** None of this can happen; backward time travel is physically impossible.

  ***

  # Scoring Key & Interpretation

  Tally how many times you selected each option position (e.g., how many times did you pick the first option, the second, or the third?).

  *   **Mostly Option 1 (The Consistency Score):** You lean toward a **Fixed Timeline**.
  *   **Mostly Option 2 (The Change Score):** You lean toward a **Dynamic Timeline**. (See below to split Mutable vs. Branching).
  *   **Mostly Option 3 (The Impossible Score):** You are a **Killjoy**.

  ### The Four Profiles

  **1. The Fatalist (Fixed Timeline)**
  *   **Pattern:** High Option 1 count, low Option 2 count.
  *   **Theory:** The past is stone. You were always there. Any attempt to change history either fails or is the very thing that caused history to happen as recorded.
  *   **Narrative Vibe:** *Harry Potter and the Prisoner of Azkaban*, *12 Monkeys*, *Dark*.
  *   **Plot Implication:** Your protagonist cannot stop her grandparents from meeting. If she tries, she will inadvertently cause them to meet. The drama comes from her realizing she is part of the loop, not the master of it.

  **2. The Eraser (Mutable Single Timeline)**
  *   **Pattern:** High Option 2 count, specifically on Questions 2, 3, 6, and 8.
  *   **Theory:** The past is clay. If you change it, the future overwrites itself. There is only one timeline, and it updates in real-time.
  *   **Narrative Vibe:** *Back to the Future*, *The Butterfly Effect*, *Frequency*.
  *   **Plot Implication:** If she stops her grandparents, she will fade away or wake up in a world where she was never born. The stakes are existential survival.

  **3. The Multiversalist (Branching Timeline)**
  *   **Pattern:** High Option 2 count, specifically on Questions 3, 5, 6, and 7.
  *   **Theory:** The past is a tree. Changing it grows a new branch. The original timeline remains untouched, but the traveler may get stuck in the new branch.
  *   **Narrative Vibe:** *Avengers: Endgame*, *Dragon Ball Z*, *Steins;Gate*.
  *   **Plot Implication:** She can kill her grandfather, but *her* origin remains safe in a different branch. However, she might not be able to return to her original home. The drama is about displacement and loss, not erasure.

  **4. The Skeptic (The Killjoy)**
  *   **Pattern:** High Option 3 count (7 or more).
  *   **Theory:** Causality is a one-way street. Entropy forbids return.
  *   **Narrative Vibe:** Hard Sci-Fi, Realism.
  *   **Plot Implication:** You don't have a time travel novel; you have a story about a delusion, a dream, or a failed experiment.

  ***

  # Caveats & Flags

  ### Incoherent Combinations
  If your group members score high on **both** Option 1 (Fixed) **and** Option 2 (Mutable/Branching), their theory is likely incoherent.
  *   **Why:** You cannot believe the past *cannot* be changed (Fixed) and *can* be changed (Mutable) in the same universe.
  *   **The Fix:** Ask them to choose which rule takes precedence. Usually, this indicates they haven't thought through the mechanics of *failure*. In a Fixed timeline, attempts fail. In a Mutable timeline, attempts succeed. They cannot do both randomly.

  ### Indistinguishable Positions
  This quiz cannot reliably distinguish between **Mutable Single Timeline** and **Branching Timeline** if the traveler **never returns to the original point of departure.**
  *   **Why:** From the traveler's perspective, waking up in a rewritten future (Mutable) feels exactly the same as waking up in a new branch where the old one is inaccessible (Branching).
  *   **The Test:** The only way to tell them apart is Question 3 (The Return). If they believe the traveler can return to the *original* unchanged present, it's Branching. If they believe the original present is gone, it's Mutable. If your beta readers can't agree on Question 3, these two theories are functionally identical for your plot.

  ### The "Killjoy" Option
  *   **Note:** Option 3 is identical in every question. If a reader selects this more than 50% of the time, they are telling you that your premise is broken. You can either convince them with "soft science" (it's magic/wormholes) or accept that their feedback will always lean toward "this wouldn't work." Take their advice on character motivation, but ignore their advice on physics.
