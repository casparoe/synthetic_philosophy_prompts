  ### Plausible Accounts of Truth

  Based on the recorded judgments, two primary semantic frameworks are consistent with the logician's notes. Both accept that some sentences (like the Liar and Truthteller) lack a classical truth value (truth-value gaps), but they differ on how logical connectives operate over these gaps.

  1.  **Kripkean Groundedness (Strong Kleene Semantics):**
      *   **Mechanism:** Truth is constructed in stages. A sentence has a truth value only if it is "grounded" in non-semantic facts (like "Snow is white"). Self-referential sentences without a base (Liar, Truthteller) remain "ungrounded" and receive a third value: **Gap** (undefined).
      *   **Logic:** Uses Strong Kleene tables. If a component of a disjunction is a Gap, and the other is not True, the whole is a Gap. The Law of Excluded Middle ($P \lor \neg P$) fails for ungrounded sentences.
      *   **Fit with Notes:** Perfectly explains the "grounded chain" terminology. It distinguishes the Liar (paradoxical, no fixed point) from the Truthteller (ungrounded, consistent but arbitrary fixed points) while assigning both the same verdict (no value).

  2.  **Supervaluationism:**
      *   **Mechanism:** A sentence is **Super-True** if it is true in all "classical extensions" (ways of resolving the gaps consistently). A sentence is **Super-False** if false in all extensions. If it varies, it is indeterminate (Gap).
      *   **Logic:** Validates classical tautologies (like the Law of Excluded Middle) even for sentences containing gaps, because they hold in every classical extension.
      *   **Fit with Notes:** Explains the Liar/Truthteller distinction (Liar has *no* extensions; Truthteller has *multiple*). It respects the "grounded" judgments as Super-True/False.

