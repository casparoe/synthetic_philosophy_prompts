  *   **Logic:** Military intervention is morally permissible (and sometimes obligatory) to physically interpose between killers and victims during an acute humanitarian emergency, even without Security Council authorization. However, the use of force must remain strictly limited to *protection*. It cannot be used for punitive strikes, retrospective justice, or regime change, as these objectives exceed the humanitarian logic and discredit the intervention.
