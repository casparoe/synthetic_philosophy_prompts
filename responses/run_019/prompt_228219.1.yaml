prompt: |-
  Two friends of mine got into a surprisingly heated argument last weekend and I want a verdict. Our mutual friend Dana donated a kidney to a stranger through a non-directed donation program. Over drinks, Marcus said what she did wasn't just good, it was morally required: she had two working kidneys, the risk to her was low, someone was dying, and if it's the best thing she could do then calling it "above and beyond" is just a way of letting the rest of us off the hook. His line was basically that the category of supererogation is incoherent -- either she had most reason to do it, in which case it was obligatory, or she didn't, in which case donating wasn't actually the right thing.

  Jess pushed back that this makes morality insanely demanding, since on Marcus's view we should all be donating kidneys and giving away most of our money, and nobody can live like that. Marcus said that confuses what's wrong with what's blameworthy -- maybe morality requires the kidney but we're not justified in condemning people who don't, so the demandingness is real and we should just be honest about it. Jess conceded that was a better distinction than she'd expected, but said there's still something off: morality has to leave room for people to weigh their own projects and commitments, and Dana's donation is admirable precisely because it was optional -- she could have permissibly declined, which is why we praise her rather than just noting she did her duty. Marcus said "agent-centered prerogative" talk is just a polite name for permission to be selfish, and that Jess is confusing what we can get away with socially with what's actually permitted. Jess's last move was that if everything best is obligatory, the concept of a moral hero collapses, and any theory that can't distinguish Dana from someone who merely pays their taxes has lost something important. Then they both looked at me.

  Please go through the exchange move by move: who's right about what, which concessions were too quick or too slow, what both of them are missing, and who's more right overall about whether supererogation is a coherent category.
reasoning: |-
  Here's a thinking process that leads to the suggested verdict:

  1.  **Analyze the Request:**
      *   **Task:** Evaluate a philosophical argument between two friends (Marcus and Jess) regarding a specific scenario (Dana's kidney donation).
      *   **Core Issue:** The coherence and existence of *supererogation* (actions that are good to do but not wrong to omit).
      *   **Format:** Go through the exchange move by move, evaluate who is right/wrong, identify concessions, identify blind spots, and render an overall verdict.
      *   **Tone:** Analytical, fair, philosophical but accessible (since it's a dispute between friends over drinks).

  2.  **Deconstruct the Argument (Move by Move):**

      *   **Scenario:** Dana donated a kidney to a stranger (non-directed).
      *   **Marcus's Opening:** Donation is *morally required* (obligatory), not just good.
          *   *Reasoning:* Two kidneys, low risk, someone dying. If it's the "best thing," it's obligatory. Supererogation is incoherent (binary: obligatory or not).
      *   **Jess's First Pushback:** This makes morality *too demanding* (donating kidneys, all money). Nobody can live like that.
      *   **Marcus's Counter:** Distinguishes *wrongness* from *blameworthiness*. Morality might require it, but we shouldn't condemn/blame those who don't. Demandingness is real; accept it.
      *   **Jess's Concession/Second Pushback:** Concedes the blame/wrongness distinction is good. But argues morality must allow for *personal projects/commitments*. Dana's act is admirable *because* it was optional (she could have permissibly declined).
      *   **Marcus's Counter:** "Agent-centered prerogative" (permission to prioritize self) is just "permission to be selfish." Confusing social permission with moral permission.
      *   **Jess's Final Move:** If everything best is obligatory, the concept of *moral hero* collapses. No distinction between Dana and a tax-payer.
      *   **The Ask:** Who is right? What did they miss? Verdict on supererogation.

  3.  **Evaluate the Philosophical Positions:**

      *   **Marcus:** Represents a form of *Act Utilitarianism* or strong *Consequentialism*. Specifically, he leans into the "Demandingness Objection" response (accept the demand, reject the intuition). He denies supererogation exists (Singer-esque).
      *   **Jess:** Represents *Common Sense Morality* or a *Pluralistic Deontology/Virtue Ethics* approach. Defends the intuition of supererogation and the importance of personal integrity/projects (Williams-esque).
      *   **Key Concept:** Supererogation (Urmson's "Saints and Heroes").
      *   **Key Concept:** Demandingness Objection.
      *   **Key Concept:** Blameworthiness vs. Wrongness (Suberogatory/Supererogatory nuances).
      *   **Key Concept:** Agent-Centered Prerogatives (Scheffler).

  4.  **Drafting the Analysis (Move by Move):**

      *   *Marcus Move 1 (Obligatory vs. Supererogatory):* He's logically consistent within utilitarianism, but ignores the phenomenology of morality. Is "best thing" always "duty"?
      *   *Jess Move 1 (Demandingness):* Standard objection. Marcus is right that this is the standard counter-argument, but she treats it as a *reductio* (it proves the theory wrong), whereas he treats it as a bullet to bite.
      *   *Marcus Move 2 (Wrong vs. Blame):* This is his strongest point. Distinguishing objective rightness from subjective blame is crucial. Jess concedes too quickly here. This saves his theory from being practically intolerant.
      *   *Jess Move 2 (Personal Projects/Optionality):* This is her strongest point. Bernard Williams' "Integrity Objection." Morality shouldn't swallow the agent. Marcus dismisses this too easily as "selfishness."
      *   *Jess Move 3 (Moral Hero):* The functional role of praise. If duty = heroism, praise loses meaning.

  5.  **Identifying Blind Spots/Missing Nuance:**

      *   **Marcus:** Misses the social function of praise. If Dana *had* to do it, praising her is like praising someone for not murdering. It changes the social dynamic. He also conflates "maximizing good" with "moral requirement" without addressing integrity.
      *   **Jess:** Conceded the blame/wrong distinction too fast. She needs to argue that if an act isn't blameworthy to omit, it *functions* as permissible, regardless of metaphysical "wrongness." She also didn't define the limit of duty clearly.
      *   **Both:** Ignore the specific medical/psychological context of kidney donation. It's not "low risk" in a vacuum; it's major surgery. This affects the "obligatory" claim.
      *   **Both:** Ignore the "Non-Directed" aspect. Directed donation (family) feels more obligatory than non-directed (stranger).

  6.  **Synthesizing the Verdict:**

      *   *Supererogation:* It is a coherent and necessary category for a livable moral system. Marcus's view is logically tight but humanly unsustainable. Jess is more right about the *structure* of moral experience.
      *   *Marcus's Win:* The distinction between wrongness and blameworthiness.
      *   *Jess's Win:* The necessity of optionality for praise and the protection of personal integrity.
      *   *Overall:* Jess wins on the core question (supererogation exists), but Marcus wins on the nuance of blame.

  7.  **Refining the Output:**
      *   Structure: Introduction -> Move-by-Move Breakdown -> What They Missed -> Final Verdict.
      *   Tone: Impartial arbiter, philosophically informed.
      *   Check: Did I answer the specific prompt? (Move by move, concessions, missing pieces, overall verdict).

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure not to just say "Utilitarianism is bad." Marcus's point about blameworthiness is actually a sophisticated utilitarian move (rule-utilitarian or two-level). Acknowledge that.
      *   *Clarification:* Ensure the distinction between "objective duty" and "subjective blame" is clear.
      *   *Emphasis:* Highlight that Dana's case is extreme. If kidney donation is duty, is *dying* for a stranger duty? Where is the line? Jess needs to press this harder.

  9.  **Final Review against constraints:**
      *   Go through exchange move by move? Yes.
      *   Who's right about what? Yes.
      *   Concessions too quick/slow? Yes.
      *   What both missing? Yes.
      *   Who's more right overall? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic debate in normative ethics, essentially replaying the conflict between **Act Utilitarianism** (Marcus) and **Common Sense Morality/Pluralism** (Jess), centered on the concept of **supererogation**.

  Here is the breakdown of the exchange, the philosophical strengths and weaknesses of each move, and a final verdict.

  ### Move-by-Move Analysis

  **1. Marcus's Opening: The Denial of Supererogation**
  *   **The Claim:** If an action produces the best outcome (saving a life at low risk), it is morally obligatory. Supererogation (actions that are good but not required) is incoherent.
  *   **Assessment:** Marcus is logically consistent within a maximizing consequentialist framework (like Peter Singer's). If morality is solely about maximizing good, then doing *less* than the maximum is, by definition, a failure.
  *   **Verdict:** **Philosophically consistent, but intuitively brittle.** Marcus is right that *if* you accept his premise (morality = maximizing good), his conclusion follows. However, he begs the question by assuming that "best outcome" automatically equals "moral duty." He ignores the cost to the agent's integrity.

  **2. Jess's First Pushback: The Demandingness Objection**
  *   **The Claim:** Marcus's view makes morality too demanding (donate kidneys, give away money). Nobody can live like that.
  *   **Assessment:** This is the standard "Demandingness Objection" to utilitarianism. Jess treats this as a *reductio ad absurdum* (the theory is false because the result is absurd).
  *   **Verdict:** **Right intuition, weak argument.** Jess is right that a morality requiring constant self-sacrifice is unsustainable, but she assumes "unsustainable" means "false." Marcus is prepared to say, "Morality is hard; deal with it." She needs a better reason why it being unsustainable makes it *wrong*, not just difficult.

  **3. Marcus's Counter: Wrongness vs. Blameworthiness**
  *   **The Claim:** An act can be objectively wrong (omitting the donation) without the agent being blameworthy for not doing it. We shouldn't condemn people who fail to meet the high bar.
  *   **Assessment:** This is Marcus's strongest move. He distinguishes between **objective rightness** (what the ideal moral agent does) and **subjective blameworthiness** (what we can expect of flawed humans given psychological limits).
  *   **Verdict:** **Marcus wins this round.** This is a sophisticated distinction. It allows him to keep his high moral standard without becoming a moral tyrant who yells at everyone. Jess concedes too quickly here. She should have pressed that if an omission isn't blameworthy, it functions as "permissible" in any meaningful social sense, rendering the "obligatory" label metaphysically idle.

  **4. Jess's Second Pushback: Personal Projects & Optionality**
  *   **The Claim:** Morality must leave room for personal commitments. Dana's act is admirable *because* she could have permissibly declined.
  *   **Assessment:** Jess is channeling Bernard Williams' "Integrity Objection." She argues that morality shouldn't swallow the agent's identity. If Dana *had* to do it, she isn't a hero; she's just a compliant moral agent.
  *   **Verdict:** **Jess wins this round.** Marcus dismisses this as "selfishness," which is a straw man. Prioritizing one's own life projects isn't selfishness; it's a condition of having a life to live. Marcus fails to explain why the "agent-centered prerogative" is merely selfishness rather than a structural requirement for human agency.

  **5. Jess's Final Move: The Collapse of the Moral Hero**
  *   **The Claim:** If everything best is obligatory, there is no distinction between Dana and a tax-payer. The concept of heroism collapses.
  *   **Assessment:** This attacks the functional utility of Marcus's theory. Praise loses its meaning if it is merely acknowledging duty fulfillment. We don't praise people for not murdering; we would not praise Dana if her donation were mandatory.
  *   **Verdict:** **Jess is right.** Moral praise serves a social function to encourage behavior *beyond* the baseline. If the baseline is raised to "saintliness," praise becomes meaningless, and the social mechanism for encouraging extraordinary good breaks down.

  ### What They Are Missing

  **1. The Medical/Psychological Reality (Both)**
  Both treat the kidney donation as abstract "low risk." In reality, non-directed donation involves major surgery, recovery time, potential long-term health complications, and psychological weight. By glossing over the *actual* cost, Marcus makes the "obligation" easier to assert. If the cost were accurately weighed, even many utilitarians might agree it falls into the supererogatory category because the "net good" calculation is more complex than "1 life > 1 kidney."

  **2. The Function of "Ought" (Both)**
  They are arguing about what "ought" means. Marcus uses a **teleological "ought"** (you ought to do what achieves the best end). Jess uses a **deontological "ought"** (you ought to do what fits within a system of rules compatible with human life). They are talking past each other on the definition of moral requirement.

  **3. The "Over-demandingness" Concession (Jess)**
  Jess conceded too quickly on the blame/wrongness distinction. She should have argued that if morality dictates you are "wrong" to keep your kidney, but you are "blameless" for keeping it, the word "wrong" has lost its action-guiding force. If I can ignore a moral requirement without rational criticism, is it really a requirement?

  **4. The "Selfishness" Dismissal (Marcus)**
  Marcus was too slow to recognize that "agent-centered prerogatives" are not just polite selfishness. Without them, morality becomes alienating. If morality requires me to abandon all my projects whenever I can do slightly more good for a stranger, I cease to be a distinct person and become a vessel for utility. Marcus missed the metaphysical cost of his view: it dissolves the individual.

  ### Final Verdict

  **Who is more right overall?**
  **Jess is more right.**

  While Marcus wins on the logical consistency of his specific framework (maximizing consequentialism), Jess is right about the **coherence of supererogation as a necessary category for human morality.**

  **Why Jess Wins:**
  1.  **The Hero Problem:** Marcus cannot adequately explain why we praise Dana. If she did her duty, she is merely compliant. If she is a hero, she did more than duty. Since we universally recognize her as a hero, the category of "more than duty" must exist.
  2.  **Integrity:** Marcus's view reduces the moral agent to a conduit for good outcomes. Jess correctly identifies that morality must accommodate the fact that we are individuals with specific lives, not just utility calculators.
  3.  **Social Function:** Morality is a social technology. A system that labels 99% of the population as constantly failing their moral duty (even if blamelessly) creates a culture of guilt and disengagement. A system with a clear baseline of duty and a category for "above and beyond" encourages more good in the long run.

  **Where Marcus Was Right:**
  Marcus correctly identified that **blameworthiness is not identical to wrongness.** We can acknowledge that Dana did something incredibly rare and valuable without condemning those who don't. However, he should have labeled the omission "suberogatory" (allowed but not ideal) rather than "wrong."

  **The Ruling:**
  Supererogation is a coherent and vital category. Dana's action was morally excellent, but not morally required. Marcus's theory is logically tight but humanly impossible; Jess's theory accommodates the reality of human agency. Dana is a hero, not just a good citizen, and that distinction matters.
