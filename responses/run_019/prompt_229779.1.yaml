answer: |-
  Dear colleague,

  You asked me to translate David Lewis's Principal Principle into the vocabulary you use daily as a machine learning engineer, so let us begin by setting up the correspondence. In your workflow, you construct a predictive distribution over labels given inputs, which you optimize using proper scoring rules to ensure that your predicted probabilities match the empirical frequencies of outcomes. Let us call this your subjective predictive distribution. Now imagine there exists a reference conditional probability model, perhaps an oracle or the true data generating process, which outputs a specific probability value for an event. In philosophy, this is called objective chance. The Principal Principle is essentially a constraint on how you should set your subjective predictive distribution when you are given the output of this reference model. It states that if you know the reference model assigns probability x to an event, and you possess no additional information that bypasses the model's mechanism, then your own predictive probability for that event should also be x. In your terms, if the oracle says the logit is z, your calibrated forecast should match the sigmoid of z, provided you are not peeking at the test labels.

  This condition about possessing no additional information is where the puzzle of inadmissible evidence arises, and it maps remarkably cleanly onto your concept of data leakage. In machine learning, leakage occurs when your training or inference pipeline includes information about the target variable that would not be available at deployment, causing your model to appear perfectly calibrated on paper but fail in practice because it conditioned on the future. Lewis defines inadmissible evidence as information about the future that is not mediated by the chance process. If you know the coin will land heads because you saw it land heads, your credence should be one, not the chance value of 0.5. The Principal Principle requires you to ignore such information when deferring to chance, which feels counterintuitive unless you view it as a rule for isolating the stochastic component of the process. You would say that if you condition on the leakage, the conditional independence between the model's output and the residual error is broken. The principle demands that you treat the reference model's output as a sufficient statistic for the outcome, blocking any backdoor paths from your extra knowledge to the target variable. If you have leakage, the reference model is no longer the complete description of the uncertainty, and deference is no longer rational.

  The second puzzle concerns chance theories that assign positive probability to futures where their own chance values turn out to be wrong, often called self-undermining chances. Imagine a reference model that outputs a probability distribution over events, but the model itself is selected from a hyper-distribution where there is a non-zero probability that the model's parameters are different than what you were told. In your vocabulary, this looks like a hierarchical model where you have uncertainty over the weights of the network. The puzzle for Lewis was that if the objective chance function says there is a chance that the objective chance function is different, then conditioning on the chance being x seems to contradict the chance theory itself. For you, this is simply model uncertainty or epistemic uncertainty, which you handle by integrating over the posterior distribution of models rather than deferring to a single point estimate. You would naturally average the predictions of the possible models weighted by their probability. Lewis found this problematic because he viewed chance as a single, fixed function of history, not a distribution over functions. The tension arises because you treat the reference model as an estimate subject to error, whereas Lewis treated chance as a metaphysical fact that somehow allows for the possibility of its own falsity without ceasing to be the chance.

  Now let me file the residue report on this translation to tell you where the analogy holds and where it breaks. The mapping between admissibility and the absence of leakage is nearly exact. When you enforce conditional independence between your model's predictions and the true labels given the input features, you are enforcing a structural constraint that mirrors the philosophical requirement that inadmissible evidence must not screen off the chance. Similarly, the concept of calibration maps cleanly onto the outcome of following the Principal Principle. If you defer to a calibrated reference model, your predictive distribution will be calibrated, and you will minimize your expected log loss. In this sense, a calibrated forecaster is indeed what the philosophers are talking about when they discuss an agent who respects chance. However, I had to fudge the ontological status of the reference model. In your work, the model is a tool you built or selected to minimize loss. In Lewis's framework, chance is a feature of the world that exists independently of any agent's model. You treat probability as a measure of information or frequency; Lewis treats chance as a physical propensity that commands belief.

  This leads to the most significant residue, which is the normative authority of chance versus the instrumental value of calibration. In your vocabulary, you defer to a model because doing so optimizes your proper scoring rule. If you find a way to beat the model using leakage, you take it, because your goal is accuracy, not deference. The Principal Principle, however, claims that you ought to defer to chance even if you had some magical way of knowing the outcome, provided that knowledge is deemed inadmissible. It posits a categorical rational constraint rather than a hypothetical imperative based on utility. You would say that if you know the label, predicting the chance value is miscalibrated and incurs higher loss. Lewis would say that knowing the label in that specific way is epistemically forbidden when analyzing the chance setup. Your vocabulary lacks a concept for this kind of rational obligation that overrides expected accuracy. You have no term for a rule that says you should ignore information that improves your loss function because using it violates the structure of rational belief. This suggests that your vocabulary is missing the deontological layer of probability, where probability is not just about managing uncertainty for gain, but about aligning the mind with the structure of reality.

  So, to answer your final question, what you would naturally call a calibrated forecaster is almost all that the philosophers are talking about in terms of the mechanical relationship between belief and chance. If you are perfectly calibrated and have no leakage, you satisfy the Principal Principle. However, your vocabulary is missing the justification for why this alignment is required. You view calibration as a property that makes your model useful for decision making. Lewis views deference to chance as a constitutive norm of rationality, meaning that to be a rational agent is to defer to chance, regardless of whether it maximizes some score in a specific instance. The missing piece is the idea that chance has a distinctive normative authority over belief rather than merely good expected accuracy. You might argue that expected accuracy is the only authority that matters, and indeed, many modern philosophers agree with you, arguing that the Principal Principle is derived from accuracy norms. But Lewis insisted that chance commands belief directly. Your framework treats the reference model as a servant to your loss function, whereas the Principal Principle treats chance as a master to your credence. This distinction matters when the two come into conflict, such as in the self-undermining cases where following the chance might seem to lower your expected accuracy relative to a hierarchical update. In those edge cases, your engineering intuition to average over models diverges from the strict philosophical deference to the single chance function, revealing that while your tools can simulate the behavior of a rational agent, your underlying ontology treats probability as epistemic hygiene rather than metaphysical law.

  I hope this helps you locate where your engineering intuitions align with the philosophical literature and where they diverge based on the underlying goals of utility versus rationality.

  Best regards,

  Your philosophical colleague
