      "Ah, you strike at the wound, and rightly so, for if I were merely another pen-for-hire singing praises to the age, this contradiction would be my doom; but observe the direction of the arrow! The daily press writes to cultivate the public, that monstrous abstraction where everyone is everyone and no one is anyone, soothing them with the opium of 'results' and 'news'; I write, with this same ink and paper, to shatter that mirror, to drive the reader away from the crowd and back into the silence of his own conscience before God. It is a dangerous tool, yes, like using a sword to perform surgery, but my authorship is not an invitation to join a literary circle—it is a notice of eviction from the illusion of Christendom. I do not seek readers who applaud, for applause is the crowd's currency; I seek the single individual who, in reading me, finds the courage to stop reading and start existing, even if it means standing alone against the very medium that brought him my words."

