answer: |-
  ### 1. The Procedure: Bounded Logical Credence (BLC-1)

  **Protocol Version:** 1.0
  **Time Budget:** 120 minutes per claim.
  **Inputs:** Claim statement, Code/Proof artifacts, Historical failure database.

  1.  **Claim Classification (5 mins):** Identify logical structure. Is it Universal (∀ inputs, system holds), Existential (∃ input, system fails), or Derivational (Lemma follows axioms)? **[JC]** Record type. This dictates how evidence updates confidence.
  2.  **Reference Class Selection (10 mins):** Query historical database for claims of similar type and complexity from the last 24 months. Calculate the base failure rate ($P_{base}$). If $N < 5$, set $P_{base} = 0.5$. Do not use intuition here.
  3.  **Complexity Scoring (10 mins):** Estimate verification difficulty. For code: count cyclomatic complexity or lines of critical logic. For proofs: count inference steps. Map to a Scale of 1 (trivial) to 10 (intractable). **[JC]** Record Score ($C$). Higher scores penalize confidence gains.
  4.  **Bounded Verification Run (30 mins):** Execute automated tools (static analyzer, SMT solver, fuzzer) for exactly 30 minutes. Record outcome: Pass, Fail, or Timeout. Strictly enforce the time limit to standardize evidence weight.
  5.  **Expert Elicitation (15 mins):** Consult one senior engineer not involved in the code/proof. Ask: "What is your confidence this holds?" Convert percentage to decimal ($E$). Apply Overconfidence Discount: $E_{adj} = E \times 0.8$.
  6.  **Evidence Aggregation:** Calculate Evidence Score ($S$).
      *   If Verification Pass: $S_{ver} = 0.1 \times (10 - C)$.
      *   If Verification Timeout: $S_{ver} = 0$.
      *   If Verification Fail: $S_{ver} = -0.5$ (Immediate stop).
      *   Total $S = S_{ver} + (0.2 \times E_{adj})$.
  7.  **Credence Calculation:** Compute Raw Credence $P = P_{base} + S$. Enforce bounds: $P_{final} = \max(0.05, \min(0.95, P))$. **[JC]** Do not output 0 or 1. Logical uncertainty requires non-dogmatic bounds.
  8.  **Coherence Check (10 mins):** List 3 dependent claims (e.g., if this lemma fails, does the safety case collapse?). Ensure $P(this) \geq P(dependent)$. If violated, adjust downward to match. This prevents logical Dutch Books.
  9.  **Resource Allocation Recommendation:**
      *   If $C > 7$ and Verification Timeout: Recommend "Increase Fuzzing Budget."
      *   If Derivational and $E_{adj} < 0.7$: Recommend "Formal Peer Review."
      *   Otherwise: Recommend "Monitor."
  10. **Stop Condition:** If $P_{final}$ remains between 0.4 and 0.6 after two evidence cycles, or if additional compute yields diminishing returns (<1% shift in $P$), halt and report $P_{final}$ with uncertainty flag.

  ### 2. Plain-Language Rationale

  Why this specific workflow? Standard probability theory assumes logical omniscience—that if a fact is true, you know it. In AI safety, truth is often buried under computational complexity. You cannot know if a program halts or a proof holds without doing the work. This protocol treats "running the solver" not as revealing a pre-existing certainty, but as generating evidence analogous to running a physical experiment. A timeout is not a null result; it is data about the difficulty of the search space.

  Step 1 and 3 acknowledge that some truths are harder to access than others. A claim with high quantifier depth is logically "farther away" from verification than a simple assertion. By scoring complexity, we penalize confidence where the search space is vast, preventing the reviewer from conflating "I haven't found a bug" with "There is no bug." This mimics the logical induction principle that probabilities should evolve slowly for complex sentences until proof is found. It forces the engineer to admit that hard problems deserve lower confidence until more work is done.

  Step 2 grounds the review in empirical reality rather than intuition. Reviewers often suffer from optimism bias, assuming their system works because they built it. Base rates force an external view. Step 5's discount factor accounts for the well-documented human tendency to overestimate understanding of complex systems. Experts are useful, but their confidence is noisy data, not ground truth.

  Step 7's hard caps (0.05–0.95) are crucial. In logical uncertainty, assigning 0 or 1 is a fatal error. If you assign 1 to a lemma and it is false, your entire safety case collapses multiplicatively. By retaining a "shadow of doubt," you preserve the ability to update when new contradictions arise. This is the engineering equivalent of avoiding a Dutch Book; you never bet the farm on a theorem you haven't seen proved. It ensures that no single claim becomes a single point of failure due to overconfidence.

  Step 8 enforces coherence. Logical induction requires that your beliefs don't allow a clever trader to pump money out of you by exploiting contradictions. Here, the "trader" is the future safety audit. If you claim a lemma is 99% true but the theorem depending on it is only 80% true, you are incoherent. The procedure forces alignment. Finally, Step 10 recognizes diminishing returns. Logical induction converges over time, but engineering deadlines do not. The stop condition acknowledges that at some point, the cost of reducing uncertainty exceeds the risk reduction gained. The protocol optimizes for "sufficient confidence given budget" rather than "truth."

  ### 3. Three Worked Applications

  **Case 1: The Spec Claim (Universal)**
  *Claim:* "The controller maintains stability for all input vectors in range R."
  *Execution:* Base rate for stability claims is 0.8 (20% failure historically). Complexity is 8 (non-linear dynamics). Solver runs 30 mins, returns "Timeout" (cannot prove universal quantification). Expert confidence is 90% ($E_{adj} = 0.72$).
  *Calculation:* $P = 0.8 + 0 (verifier) + (0.2 \times 0.72) = 0.944$. Capped at 0.95.
  *Outcome:* Credence 0.95. Recommendation: "Increase Fuzzing Budget." The high complexity prevents moving to 0.99 despite expert confidence. The reviewer must accept that universal claims on non-linear systems are inherently resistant to bounded verification. The procedure forces the team to acknowledge that "tested" does not mean "verified." The output drives a request for more compute rather than a sign-off, ensuring the residual risk is managed by additional testing rather than ignored.

  **Case 2: The Exploit Claim (Existential) — The Annoying Case**
  *Claim:* "No bounded attacker can find an exploit in 7 days."
  *Execution:* Reviewer feels the system is robust. Wants to assign 0.999. Base rate for "no exploit" claims is 0.6 (40% of systems have found vulns eventually). Complexity is 9 (cryptographic protocol). Solver (fuzzer) runs 30 mins, finds nothing. Expert confidence 95% ($E_{adj} = 0.76$).
  *Calculation:* $P = 0.6 + 0 (timeout) + (0.2 \times 0.76) = 0.752$.
  *Outcome:* Credence 0.75.
  *Conflict:* Reviewer argues, "We tested heavily! It's secure!" Procedure responds: "Your test coverage is a drop in the ocean of the input space." The complexity score (9) nullifies the verifier bonus. The protocol refuses to let expert optimism override the logical reality that absence of evidence is not evidence of absence in high-dimensional spaces. The reviewer is forced to report 0.75, triggering a mandatory red-team extension. This annoys the team but prevents catastrophic overconfidence. It highlights the gap between "no exploit found yet" and "no exploit exists," forcing a budget increase to close the gap.

  **Case 3: The Lemma (Derivational)**
  *Claim:* "Lemma 4 follows from Axioms 1-3."
  *Execution:* Base rate for proof errors is 0.1 (90% correct). Complexity 4 (short proof). Solver (proof assistant) runs 30 mins, returns "Verified." Expert confidence 99% ($E_{adj} = 0.79$).
  *Calculation:* $P = 0.9 + (0.1 \times 6) + (0.2 \times 0.79) = 0.9 + 0.6 + 0.158 = 1.658$. Capped at 0.95.
  *Outcome:* Credence 0.95.
  *Nuance:* Even with a verified proof, we cap at 0.95. Why? Toolchain bugs exist. The axioms might be mis-coded. The protocol enforces humility even in formal methods. Recommendation: "Formal Peer Review" to check axiom coding, not the proof itself. This prevents the "formal verification shield" where teams assume code is safe because a proof passed, ignoring the possibility that the proof verified the wrong model. The procedure ensures the human checks the modeling layer.

  ### 4. Failure Modes

  **When the Numbers Lie**
  The protocol fails when the input assumptions are corrupted. If the historical database is biased (e.g., only storing successful claims), the Base Rate ($P_{base}$) becomes meaningless optimism. In this scenario, the procedure will systematically overestimate safety. Hand back to human: "Database integrity check required." Do not run the calculation until the reference class is corrected. Garbage in, garbage out applies doubly to logical credence.

  Correlated errors are another blind spot. The Coherence Check (Step 8) looks at logical dependence, but not environmental correlation. If two claims rely on the same flawed library, their failures are linked, but the procedure treats them as independent evidence updates. If multiple claims share a dependency, discount the Evidence Score ($S$) by 50% for each shared dependency. This manual adjustment prevents the illusion of diversified risk when the risk is actually concentrated.

  Adversarial inputs break the "Bounded Verification" step. If an attacker knows the 30-minute timeout limit, they can craft exploits that trigger at minute 31. The procedure assumes benign nature of the search space. If adversarial robustness is the goal, the "Verifier" step must be replaced by "Red Team," and the Complexity Score must be inflated artificially to account for strategic hiding.

  Finally, the procedure cannot resolve fundamental undecidability. If a claim is genuinely independent of the axioms provided, the credence will hover indefinitely in the 0.4–0.6 range. The Stop Condition (Step 10) identifies this, but the human must decide whether to change axioms or accept the uncertainty. When the procedure outputs "Uncertainty Flag," do not average the number. Report the range. If the range is too wide for deployment, the only valid engineering response is to redesign the system to avoid the undecidable claim.
