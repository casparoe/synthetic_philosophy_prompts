  *   **Definition:** Honesty requires **Absolute Resource Waste**. The signal must deplete energy, capital, or time to produce, regardless of the sender's quality. The cost ensures that low-quality senders cannot afford the signal.
  *   **Fit with Past Verdicts:** Matches the peacock (energy), deer (lung capacity), and working interview (time). Matches the rejection of the watch (financed/no net wealth loss) and press releases (no resource depletion).
