answer: |-
  It is fascinating that this came up over the holidays because you and your brother-in-law have actually stumbled onto one of the deepest debates in the philosophy of mathematics, and the truth is that you are both right in your own domains. You are correct about the logical stakes, while he is correct about the practical consequences, and understanding why requires looking at how math is actually used versus how it is founded. Your argument relies on what logicians call the principle of explosion, which is a rule in classical logic stating that if you accept a contradiction as true, you can logically derive any statement whatsoever. If the basic axioms of arithmetic contained a hidden contradiction, it would theoretically mean that within that system, you could prove that two plus two equals four and also prove that two plus two equals five, and from there you could prove anything, like saying the moon is made of cheese. This would indeed be a catastrophic failure for pure mathematics because the entire value of a proof is that it guarantees truth within the system, and if the system allows contradictions, that guarantee vanishes.

  However, your brother-in-law is right that the physical world would not suddenly collapse because engineering and applied science do not rely on mathematical proofs in the same way pure mathematicians do. When an engineer designs a bridge, they are using math as a model to approximate physical reality, not as a source of absolute metaphysical truth. Their calculations are always bounded by safety factors, empirical testing, and physical laws that exist independently of our equations. If there were a contradiction in the foundational axioms of set theory or arithmetic, it would likely reside in such abstract, high-level territory that it would never surface in the finite, approximate calculations used to build a skyscraper or calculate a mortgage payment. The math used in everyday applications is robust because it has been stress-tested against reality for centuries, much like a software program that works perfectly even if the programming language it was written in has some obscure, unused bug deep in its core code.

  You also mentioned Gödel, and his incompleteness theorems are relevant here but often misunderstood. What Gödel showed is that in any sufficiently complex mathematical system, there are true statements that cannot be proven within that system, and crucially, the system cannot prove its own consistency. This does not mean math is inconsistent, only that we cannot use math to prove that math is free of contradictions. It leaves the door slightly ajar for the possibility you are worried about, but most mathematicians view this as a limitation of proof rather than a sign of impending doom. Historically, we have seen this happen before with Russell's paradox in the early twentieth century, which showed that the naive set theory used at the time was indeed contradictory. Mathematicians did not throw up their hands and declare all math worthless; instead, they refined the rules, creating new axioms that blocked the contradiction while preserving almost all the useful results. The world did not end, and the math used by physicists and engineers barely noticed the change because the fix happened at a level of abstraction far removed from calculating trajectories or interest rates.

  If a contradiction were discovered tomorrow, the immediate impact would depend entirely on where the contradiction was found. If it was in the deep foundations of set theory, pure mathematicians would have a crisis on their hands and would need to rebuild the foundational layers, carefully checking which theorems rely on the broken path. However, for your mortgages and your brother-in-law's bridges, nothing would change overnight. The arithmetic used in accounting is simple and verified by practice, not by foundational proofs. For encryption, the situation is slightly more nuanced because cryptography relies on certain mathematical problems being hard to solve, not just on logical consistency. If the contradiction provided a shortcut to solve these hard problems, then yes, security could be compromised, but a logical contradiction does not automatically grant a computational shortcut. It would take further work to weaponize that inconsistency, giving security experts time to react and migrate to new systems.

  There is also the possibility you hinted at regarding alternative logics. Some mathematicians work with paraconsistent logic, which is a system designed specifically to tolerate contradictions without triggering the principle of explosion. In such a system, finding a contradiction would be annoying but not fatal, because the rules are changed so that a contradiction does not allow you to prove everything. While most mainstream math is not built on this yet, the existence of these logics shows that mathematics is adaptable. If our current axioms broke, we would likely shift to a restricted system or a paraconsistent one that isolates the error. So, while you win the argument on theoretical grounds because a contradiction does undermine the logical certainty of proofs, your brother-in-law wins on practical grounds because the utility of math comes from its reliability in modeling the world, not its philosophical perfection. The discovery would be a massive intellectual event, but it would not cause banks to close or bridges to fall, because human knowledge is resilient enough to patch the hole while keeping the ship afloat.
