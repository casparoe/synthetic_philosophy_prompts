  ### Decomposition of Reasoning

  My low credence stems primarily from the clause **"mind-independent fact of the matter."** While there may be a fact determined by linguistic convention or social practice, artefacts are ontologically dependent on intentional states. Their identity conditions are tied to function and role, which are mind-relative. Therefore, a *mind-independent* fact of numerical identity for an artefact is metaphysically suspect.

