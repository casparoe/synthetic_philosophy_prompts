answer: |-
  Your notes are garbled because you have conflated two different ethical principles. You are describing the **Acts vs. Omissions Doctrine**, not the **Doctrine of Double Effect (DDE)**.

  *   **Acts vs. Omissions:** Claims that harming someone via action is worse than harming someone via inaction (allowing to die).
  *   **Doctrine of Double Effect:** Claims that harming someone as a *means* to an end is worse than harming someone as a *foreseen side effect*.

  DDE is not about whether you acted or stayed still; it is about the **causal structure of your intention**. Specifically, it asks: *Did you need the harm to happen in order to achieve the good?*

  Here is the actual rule, followed by the application to your three cases.

  ### The Rule: Four Conditions of DDE
  For an action that causes both good and evil effects to be permissible, all four conditions must be met:

  1.  **Nature of the Act:** The action itself must be morally good or neutral (e.g., pulling a lever is neutral; cutting a throat is not).
  2.  **Means vs. Side Effect:** The bad effect must **not** be the means by which the good effect is achieved. (This is the one you are missing).
  3.  **Intention:** The agent must intend only the good effect. The bad effect is merely foreseen, not intended.
  4.  **Proportionality:** The good effect must be sufficiently weighty to justify the bad effect.

  **The Critical Distinction:** DDE permits *foreseen* collateral damage. It forbids *intended* instrumental harm. If the victim's death (or injury) is the mechanism that saves the others, DDE forbids it. If the victim's death is just an unfortunate byproduct of a mechanism that *elsewhere* saves the others, DDE permits it.

  ---

  ### Application to the Cases

  #### 1. The Standard Lever (Switch) Case
  *   **The Setup:** You pull a lever. The trolley diverts onto a side track. The five are saved because the trolley is no longer on the main line. The one dies because the trolley is now on the side track.
  *   **DDE Analysis:**
      *   **Condition 2 (Means):** Is the one person's death the *means* to saving the five? **No.** The five are saved by the *diversion of the trolley*. The death of the one is a separate consequence of that same diversion. If the one person magically vanished after the lever was pulled but before the trolley hit them, the five would still be saved.
      *   **Condition 3 (Intention):** You intend to divert the threat. You foresee the death, but you do not need the death to occur to achieve the saving.
      *   **Verdict:** **Permissible.** The harm is a side effect, not a means.

  #### 2. The Loop Case
  *   **The Setup:** You pull a lever. The trolley goes onto a side track, but the track loops back to the main line. The only thing stopping the trolley from circling back and killing the five is the body of the one person on the side track. Their body acts as a brake.
  *   **DDE Analysis:**
      *   **Condition 2 (Means):** Is the one person's death (or at least their impact) the *means* to saving the five? **Yes.** The diversion alone does not save the five; the diversion only delays them. They are saved *because* the trolley hits the person and stops. The causal chain is: *Pull Lever → Hit Person → Trolley Stops → Five Saved.*
      *   **Condition 3 (Intention):** To save the five, you must rely on the trolley hitting the person. Therefore, their being hit is part of your plan/means, not just a side effect.
      *   **Verdict:** **Impermissible.** Even though you only pull a lever (same physical act as the Switch case), the causal role of the victim makes the harm a means to an end.

  #### 3. The Transplant Case
  *   **The Setup:** A surgeon kills one healthy person to harvest their organs and save five dying patients.
  *   **DDE Analysis:**
      *   **Condition 1 (Nature of Act):** Cutting open a healthy, non-consenting person is generally considered intrinsically wrong (murder/assault), failing the first condition immediately.
      *   **Condition 2 (Means):** Is the one person's death the *means* to saving the five? **Yes.** The five are saved *by* the organs taken from the one. The harm is the direct mechanism of the rescue.
      *   **Your Confusion on "Allowing":** You argued that if the surgeon *doesn't* act, he is merely "allowing" the five to die, which should be permissible. DDE does not evaluate the *inaction*; it evaluates the proposed *action*. The question DDE asks is: "Is the act of harvesting permissible?" Because the act uses the one as a means (Condition 2 violation) and is intrinsically harmful (Condition 1 violation), it is forbidden. The fact that inaction leads to death is irrelevant to the permissibility of the action.
      *   **Verdict:** **Impermissible.** The harm is the means.

  ### Summary of What You Were Missing

  1.  **DDE $\neq$ Doing/Allowing:** DDE applies to actions. It distinguishes between *intended means* and *foreseen side effects*. It does not primarily weigh action against inaction.
  2.  **The "Means" Test:** This is the filter that separates the Lever from the Loop and Transplant.
      *   **Lever:** The death is a **byproduct**. (Trolley goes elsewhere; death happens incidentally).
      *   **Loop/Transplant:** The death is a **tool**. (Trolley stops *because* of death; Organs work *because* of death).
  3.  **Physical Act Irrelevance:** DDE does not care if you pull a lever or push a man with your hands. It cares about the causal relationship between the victim's harm and the survivors' benefit. In the Loop case, the lever pull is physically identical to the Switch case, but morally distinct under DDE because the *victim's role* has changed from "unfortunate bystander" to "human brake."

  Your notes confused the **Acts/Omissions Doctrine** (which struggles to explain why Transplant is worse than Letting Die) with the **Doctrine of Double Effect** (which explains it via the Means/Side-Effect distinction).
