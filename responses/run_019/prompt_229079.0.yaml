answer: |-
  You have stumbled onto one of the central problems in the philosophy of mind and affective neuroscience. Your observation is sharp, and the distinction you are drawing is well-documented, though it goes by different names depending on whether you ask a philosopher, a psychologist, or a neuroscientist.

  Here is the breakdown of the name, the split, the implications for theory, and the definition you requested.

  ### 1. The Name: "Recalcitrant Emotions"

  In the philosophy of emotion, the specific term for what you are describing is a **Recalcitrant Emotion**.

  A recalcitrant emotion is an emotional state that persists despite the subject's sincere judgment that the emotion is unwarranted. You judge the plane is safe (no danger), yet you feel fear (which requires danger). You judge your sister was not blameworthy (no offense), so the anger vanishes.

  In psychology, this is often discussed under **Dual Process Theory** (System 1 vs. System 2) or the distinction between **Explicit** (conscious belief) and **Implicit** (associative) cognition.

  However, "Recalcitrant Emotion" is the precise label for the *phenomenon* of the stubbornness itself.

  ### 2. The Split: Belief vs. Alief

  You asked where the line falls. Why did the anger vanish but the fear stay? The best contemporary explanation comes from the philosopher Tamar Gendler, who distinguishes between **Beliefs** and **Aliefs**.

  *   **Beliefs** are propositional. They are sensitive to evidence and logic. "The plane is statistically safe." "My sister was in the hospital." When the evidence changes, the belief updates, and any emotion tied *only* to the belief updates with it. Your anger at your sister was belief-based. It was a judgment about her agency. When the judgment of her agency changed, the anger had no fuel.
  *   **Aliefs** (roughly: *associative beliefs*) are automatic, associative, and arational. They are triggered by cues, not logic. An alief has three components: a representational content (height, noise), an affective state (fear), and a behavioral disposition (grip the armrest).

  When you fly, your **Belief** says: *This is a safe machine.*
  But your **Alief** says: *I am in a metal tube, high up, making loud noises. High up = fall. Loud noise = break. Fall + Break = Death.*

  The anger at your sister was driven by Belief. The fear of flying is driven by Alief. Aliefs are "cognitively impenetrable"—they do not listen to facts. They only listen to repetition and exposure (which is why exposure therapy works, but reading statistics does not).

  ### 3. Can Emotions Still Be Judgments?

  You asked whether these stubborn emotions prove emotions *can't* be judgments, or if that idea can be rescued.

  **The Problem:**
  If emotions were *strictly* judgments (the "Cognitivist Theory"), recalcitrant emotions would be impossible. You cannot simultaneously judge "X is dangerous" and "X is safe." That is a contradiction. Since you feel fear while judging safety, strict Cognitivism fails to explain your experience.

  **The Rescue (Perceptual Theory):**
  Most philosophers now rescue the idea by treating emotions not as *judgments*, but as **perceptions** (or "concern-based construals").

  Think of an optical illusion. Look at the Müller-Lyer illusion (two lines with arrows, one looks longer than the other).
  *   **Judgment:** You know the lines are the same length.
  *   **Perception:** They *look* different lengths.

  The perception does not vanish just because you know the truth. Similarly, fear of flying is a **perception of danger**, not a **judgment of danger**. Your amygdala (the threat detector) is screaming "Danger!" just like your eyes scream "Different lengths!" Your prefrontal cortex (the reasoner) overrides the *action*, but it cannot override the *feeling*.

  So, to answer your question: Recalcitrant emotions show that emotions are not *judgments*, but they are compatible with the idea that emotions are *appraisals* or *perceptions* of value.

  ### 4. A Sharp Definition for the "Stubborn" Case

  You requested a definition sharp enough to test other cases, like guilt. Here is a proposed definition based on the analysis above.

  **Definition: Cognitive-Resistant Affect (CRA)**
  > An emotional state counts as a Cognitive-Resistant Affect if and only if:
  > 1. The subject holds a sincere, conscious judgment that the **Formal Object** of the emotion is absent.
  >    *(e.g., For fear, the object is 'Danger'. For anger, the object is 'Wrongdoing'. For guilt, the object is 'Personal Responsibility'.)*
  > 2. The emotional state persists despite this judgment.
  > 3. The persistence is caused by associative conditioning or evolutionary hardwiring rather than a conflicting subconscious belief.

  **Applying the Test: Survivor's Guilt**
  *Scenario:* You survive a car crash, the passenger dies. You feel guilty.
  *Judgment:* "It was not my fault. I did not cause the crash." (Formal Object of Guilt = Absent).
  *Emotion:* Guilt persists.
  *Cause:* Associative (I lived, they died = I took their life).
  *Verdict:* **Yes, this is a Cognitive-Resistant Affect.** It fits the definition. The guilt is recalcitrant because it ignores the judgment of non-responsibility.

  **Applying the Test: Rational Guilt**
  *Scenario:* You steal money from a friend. You feel guilty.
  *Judgment:* "I did something wrong and I am responsible." (Formal Object = Present).
  *Emotion:* Guilt persists.
  *Verdict:* **No.** This is a **Congruent Emotion**. The emotion matches the judgment. It is not stubborn; it is functioning as intended.

  ### Summary

  *   **The Name:** Recalcitrant Emotion.
  *   **The Split:** The line falls between **Propositional Appraisal** (logic-based, updates with facts, like your anger) and **Associative Conditioning** (cue-based, ignores facts, like your fear).
  *   **The Theory:** Emotions are not judgments; they are perceptions. Like optical illusions, they don't have to be "true" to be "felt."
  *   **The Definition:** If the emotion persists despite a sincere judgment that the emotion's core requirement (danger, offense, responsibility) is missing, it is Cognitive-Resistant.

  Your fear of flying is not a failure of logic; it is a success of evolution. Your ancestors who ignored the "metal tube in the sky" cue didn't survive to pass on their genes. You are stuck with a very old alarm system in a very new world.
