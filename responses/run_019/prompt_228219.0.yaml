prompt: |-
  Two friends of mine got into a surprisingly heated argument last weekend and I want a verdict. Our mutual friend Dana donated a kidney to a stranger through a non-directed donation program. Over drinks, Marcus said what she did wasn't just good, it was morally required: she had two working kidneys, the risk to her was low, someone was dying, and if it's the best thing she could do then calling it "above and beyond" is just a way of letting the rest of us off the hook. His line was basically that the category of supererogation is incoherent -- either she had most reason to do it, in which case it was obligatory, or she didn't, in which case donating wasn't actually the right thing.

  Jess pushed back that this makes morality insanely demanding, since on Marcus's view we should all be donating kidneys and giving away most of our money, and nobody can live like that. Marcus said that confuses what's wrong with what's blameworthy -- maybe morality requires the kidney but we're not justified in condemning people who don't, so the demandingness is real and we should just be honest about it. Jess conceded that was a better distinction than she'd expected, but said there's still something off: morality has to leave room for people to weigh their own projects and commitments, and Dana's donation is admirable precisely because it was optional -- she could have permissibly declined, which is why we praise her rather than just noting she did her duty. Marcus said "agent-centered prerogative" talk is just a polite name for permission to be selfish, and that Jess is confusing what we can get away with socially with what's actually permitted. Jess's last move was that if everything best is obligatory, the concept of a moral hero collapses, and any theory that can't distinguish Dana from someone who merely pays their taxes has lost something important. Then they both looked at me.

  Please go through the exchange move by move: who's right about what, which concessions were too quick or too slow, what both of them are missing, and who's more right overall about whether supererogation is a coherent category.
reasoning: |-
  Here's a thinking process that leads to the suggested verdict:

  1.  **Analyze the Request:**
      *   **Scenario:** Two friends (Marcus and Jess) arguing about a third friend (Dana) who donated a kidney to a stranger.
      *   **Core Philosophical Issue:** The coherence of *supererogation* (acts that are good to do but not wrong to omit) vs. *moral demandingness/obligation*.
      *   **Marcus's Position:** Act Utilitarian-style. If an action produces the best outcome, it's obligatory. Supererogation is incoherent. Demandingness is real; lack of blame $\neq$ lack of obligation.
      *   **Jess's Position:** Common-sense morality/Agent-centered prerogative. Morality must allow for personal projects. Supererogation is real and necessary to distinguish heroes from duty-fulfillers.
      *   **Task:** Analyze the exchange move-by-move, evaluate concessions, identify blind spots, and render a verdict on who is more right about the coherence of supererogation.

  2.  **Deconstruct the Argument Move-by-Move:**

      *   *Move 1 (Marcus):* Dana's act was morally required. Supererogation is incoherent (Binary view: Obligatory or Wrong).
          *   *Analysis:* This is classic Act Utilitarianism (or strong Consequentialism). It relies on the principle of "maximizing the good." If $A$ produces more good than $B$, $A$ is required.
          *   *Strength:* Logical consistency. Avoids arbitrariness.
          *   *Weakness:* Counter-intuitive. Conflicts with deep-seated moral intuitions about personal autonomy.

      *   *Move 2 (Jess):* This makes morality insanely demanding (The "Demandingness Objection"). We can't live like that.
          *   *Analysis:* Standard objection to Utilitarianism.
          *   *Strength:* Appeals to psychological reality and the value of personal life.
          *   *Weakness:* Marcus can reply "So what?" (Is/Ought problem). Just because it's hard doesn't mean it's not required.

      *   *Move 3 (Marcus):* Distinguishes *wrongness* from *blameworthiness*. Morality might require the kidney, but we shouldn't blame people for failing (due to weakness of will, psychological limits, etc.).
          *   *Analysis:* This is a sophisticated move (often associated with Peter Singer or ideal vs. non-ideal theory). It concedes the practical difficulty but holds the theoretical bar high.
          *   *Strength:* Neutralizes the "I can't live like that" objection. Keeps the moral truth pure.
          *   *Weakness:* Risks making morality alienating. If morality requires what humans generally can't/won't do, is it still *our* morality?

      *   *Move 4 (Jess):* Morality must leave room for "agent-centered prerogatives" (personal projects/commitments). Dana's act is admirable *because* it was optional.
          *   *Analysis:* Appeals to Bernard Williams' critique of Utilitarianism (integrity/projects) and the definition of supererogation (Urmson).
          *   *Strength:* Captures the phenomenology of praise. Explains why we treat Dana differently from a taxpayer.
          *   *Weakness:* Needs to justify *why* these prerogatives exist morally. Is it just "because we want them to"?

      *   *Move 5 (Marcus):* "Agent-centered prerogative" is just permission to be selfish. Confusing social permission with moral permission.
          *   *Analysis:* Doubles down on the objective standard. Accuses Jess of conflating social norms with moral truth.
          *   *Strength:* Consistent.
          *   *Weakness:* Dismisses the moral value of personal integrity and relationships too easily.

      *   *Move 6 (Jess):* If everything best is obligatory, the concept of a moral hero collapses. Theory loses something important (distinction between duty and sainthood).
          *   *Analysis:* The "Conceptual Loss" argument. If everyone *must* be a saint, then being a saint isn't special.
          *   *Strength:* Highlights the functional role of supererogation in moral language and motivation.
          *   *Weakness:* Marcus could argue we should change our concepts to fit the truth, not vice versa.

  3.  **Evaluate Concessions and Blind Spots:**

      *   *Jess's Concession:* She conceded too quickly on the blame/obligation distinction. She seemed impressed by Marcus's point that "hard doesn't mean not required." She should have pushed back harder on *why* blame tracks obligation. If we aren't blamed, in what sense is it obligatory?
      *   *Marcus's Blind Spot:* He assumes "maximizing good" is the only metric for moral obligation. He ignores the moral value of *agency* and *integrity*. He treats the agent as a vessel for good outcomes rather than a person with a life to lead.
      *   *Jess's Blind Spot:* She relies heavily on intuition ("something off," "insanely demanding") without a robust theoretical framework to back up *why* personal projects have moral weight. She risks sounding like she's just making excuses.
      *   *Both:* They are debating Consequentialism vs. Common Sense. They are missing the middle ground (e.g., Moderate Deontology, Virtue Ethics, or Satisficing Consequentialism).

  4.  **Determine the Verdict (Who is more right?):**

      *   *On Logic/Consistency:* Marcus wins. His view is internally consistent.
      *   *On Moral Phenomenology/Practice:* Jess wins. Her view matches how we actually experience and use moral language.
      *   *On the Specific Question (Is Supererogation Coherent?):* Jess is more right. Marcus's view requires redefining moral terms so drastically that they lose their social function. If "obligation" swallows "heroism," the concept of obligation becomes unusable.
      *   *Philosophical Consensus:* Most contemporary ethicists reject the "maximizing" view as too demanding. Supererogation is generally accepted as coherent (Urmson, Heyd, etc.). Marcus represents a specific, controversial strand of thought (Act Utilitarianism), while Jess represents a broader consensus (Pluralism).

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the debate (it's a classic meta-ethical clash).
      *   *Move-by-Move Breakdown:*
          *   Marcus 1 (Obligation): Strong logic, weak intuition.
          *   Jess 1 (Demandingness): Good intuition, weak theoretical defense.
          *   Marcus 2 (Blame vs. Wrong): Strongest move for Marcus. Needs careful handling.
          *   Jess 2 (Prerogatives): Crucial point about integrity.
          *   Marcus 3 (Selfishness): Dismissive.
          *   Jess 3 (Heroism): The clincher.
      *   *Critique of Concessions:* Jess gave ground too easily on blame. Marcus ignored the value of integrity.
      *   *What They're Missing:* Virtue Ethics perspective (character vs. act), Satisficing views, the social function of moral concepts.
      *   *Final Verdict:* Jess is more right about the *coherence* and *utility* of supererogation, even if Marcus is logically consistent. Morality isn't just a math problem; it's a human practice.

  6.  **Refining the Tone:**
      *   Keep it balanced but decisive.
      *   Use philosophical terminology correctly (supererogation, demandingness objection, agent-centered prerogative, blame/wrong distinction).
      *   Ensure the advice is actionable for the user (how to explain this to them).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the specific claim about "coherence"?
      *   *Correction:* Make sure to explicitly state that supererogation *is* coherent within most ethical frameworks, whereas Marcus's view requires eliminating the category, which causes other conceptual problems.
      *   *Check:* Did I address the kidney example specifically?
      *   *Correction:* Acknowledge that kidney donation is the *paradigm case* for supererogation in bioethics. Marcus is fighting a uphill battle there.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Verdict" section is distinct. (Proceed to generate output based on this structure.)
answer: |-
  This is a classic meta-ethical debate that mirrors arguments found in introductory philosophy seminars and high-level academic journals. Marcus is arguing from a **maximizing consequentialist** framework (likely Act Utilitarianism), while Jess is arguing from a **common-sense morality** framework (incorporating elements of Deontology and Virtue Ethics).

  Here is the move-by-move breakdown, an analysis of their concessions and blind spots, and a final verdict.

  ### Move-by-Move Analysis

  **Move 1: Marcus's Opening (The Binary Claim)**
  *   **Claim:** Supererogation is incoherent. If an act produces the best outcome, it is obligatory.
  *   **Assessment:** Marcus is logically consistent but intuitively aggressive. He is relying on the **Principle of Utility**: if you can prevent something bad without sacrificing anything of *comparable* moral significance, you must do it.
  *   **Verdict on Move:** **Marcus is logically strong, but philosophically controversial.** He is correct that *within his specific system*, supererogation doesn't exist. However, he is presenting a specific ethical theory as if it were a logical truth. Most ethical systems (Deontology, Virtue Ethics, Rossian Pluralism) reject this binary.

  **Move 2: Jess's Pushback (The Demandingness Objection)**
  *   **Claim:** This makes morality too demanding; we can't live like that.
  *   **Assessment:** This is the standard **"Demandingness Objection"** to Utilitarianism.
  *   **Verdict on Move:** **Jess is right about the implication, but weak on the justification.** She correctly identifies that Marcus's view leaves no room for personal life. However, saying "nobody can live like that" is a psychological claim, not a moral one. Marcus can simply reply, "The truth is hard." Jess needs to argue why personal projects have *moral weight*, not just that they are psychologically necessary.

  **Move 3: Marcus's Distinction (Wrongness vs. Blameworthiness)**
  *   **Claim:** Morality might require the kidney, but we shouldn't blame people for failing.
  *   **Assessment:** This is Marcus's strongest move. It separates **objective obligation** from **subjective blame**. It allows him to keep his high moral standard while acknowledging human weakness.
  *   **Verdict on Move:** **Marcus wins this round.** This is a sophisticated philosophical distinction. If Jess concedes here without a fight, she loses the thread. Blame is a social sanction; obligation is a normative status. They don't always align.

  **Move 4: Jess's Prerogative (Agent-Centered Options)**
  *   **Claim:** Morality must leave room for personal projects; Dana is admirable *because* it was optional.
  *   **Assessment:** Jess invokes **Agent-Centered Prerogatives** (a la Samuel Scheffler or Bernard Williams). She argues that individuals are permitted to give extra weight to their own lives and projects.
  *   **Verdict on Move:** **Jess recovers well.** She shifts from "it's too hard" to "it's morally permissible to prioritize oneself." This attacks Marcus's core premise. She correctly notes that praise functions differently for duties vs. gifts. We don't praise people for paying taxes (duty); we praise Dana (gift).

  **Move 5: Marcus's Dismissal (Selfishness)**
  *   **Claim:** Prerogatives are just polite names for selfishness.
  *   **Assessment:** Marcus doubles down on the impartiality of morality. He views the "self" as morally irrelevant compared to the "outcome."
  *   **Verdict on Move:** **Marcus overreaches.** He dismisses the moral value of **integrity**. Bernard Williams famously argued that Utilitarianism attacks a person's integrity by making them a mere channel for utility. Ignoring personal commitments isn't just "selfishness"; it can be a loss of the very identity that makes moral action meaningful.

  **Move 6: Jess's Closer (The Collapse of Heroism)**
  *   **Claim:** If everything best is obligatory, the moral hero collapses.
  *   **Assessment:** This is the **Conceptual Argument**. If the category of supererogation is eliminated, our moral language loses the ability to distinguish between the *minimum* and the *maximum*.
  *   **Verdict on Move:** **Jess wins the debate here.** If Marcus is right, Dana is not a hero; she is merely a compliant moral agent, and everyone else is a moral violator. This renders the concept of "moral excellence" incoherent.

  ---

  ### Critique of Concessions and Blind Spots

  **Jess's Too-Quick Concession:**
  Jess conceded too much on Move 3 (Blame vs. Wrongness). She seemed impressed by the distinction, but she should have pressed harder: **If an act is obligatory but never blameworthy to omit, in what sense is it obligatory?**
  Obligation usually implies a threat of sanction (guilt, blame, punishment). If you remove the sanction entirely because the cost is too high to the agent, you have effectively admitted that it *wasn't* obligatory. She let Marcus have his cake and eat it too by accepting that an act can be "required" but "blamelessly omitted."

  **Marcus's Blind Spot:**
  Marcus treats morality as a **math problem** rather than a **human practice**. He misses that moral concepts serve a social function. The concept of "obligation" is designed to mark the *baseline* of social cooperation. The concept of "supererogation" is designed to mark *excellence*. By collapsing them, he makes the baseline impossible to reach, which paradoxically lowers moral standards (if everyone is a violator, no one is). He also ignores the moral value of **autonomy**. A good deed done under coercion (even moral coercion) has less value than one done freely.

  **What Both Are Missing:**
  1.  **Satisficing Consequentialism:** There is a middle ground where you must do *enough* good, but not the *most* good. This validates Jess's intuition without abandoning Marcus's focus on outcomes.
  2.  **Virtue Ethics:** Neither is talking about *character*. A Virtue Ethicist would say Dana's act reveals excellent character, but failing to do it doesn't necessarily reveal vice, because virtue allows for a range of right actions depending on the agent's context.
  3.  **The Specifics of Kidney Donation:** In bioethics, non-directed kidney donation is the **paradigm case** of supererogation. It involves significant risk (however low), pain, and recovery time. To call this "obligatory" contradicts the medical ethical principle of bodily autonomy.

  ---

  ### The Verdict

  **Who is more right?**
  **Jess is more right.**

  **Why?**
  While Marcus's position is internally consistent *if* you accept Act Utilitarianism as the sole truth, Jess is right about the **coherence of the concept** of supererogation.

  1.  **Conceptual Utility:** Jess is correct that eliminating supererogation breaks our moral language. If there is no distinction between "duty" and "sainthood," we lose the ability to encourage excellence. We cannot urge people to be heroes if we tell them heroism is just the bare minimum.
  2.  **Bodily Autonomy:** Marcus's view implies a claim on Dana's body that most liberal moral theories reject. Obligating someone to undergo surgery for another, even to save a life, treats the body as a public resource. Jess's view respects bodily integrity.
  3.  **The "Ought Implies Can" Principle:** Marcus tries to bypass this with the blame distinction, but Jess is closer to the truth. If a moral theory demands what humans generally cannot sustain (giving away kidneys and most money), the theory is flawed, not the humans. A morality that alienates agents from their own lives is self-defeating.

  **Final Judgment for the Friends:**
  Tell them this: **Marcus wins on logic, but Jess wins on morality.**

  Marcus has successfully shown that *if* your only goal is maximizing good outcomes, supererogation disappears. But Jess has shown that maximizing good outcomes isn't the *only* goal of morality. Morality also aims to sustain agents who can live meaningful lives, respect bodily autonomy, and distinguish between the required and the exceptional.

  Dana is a hero precisely because she didn't *have* to do it. If she *had* to do it, she wouldn't be a hero; she'd just be a person who followed the rules. Marcus's theory saves logical consistency at the cost of making heroism impossible. Jess's theory saves heroism at the cost of logical simplicity. **We should keep the heroes.**

  **Verdict:** Supererogation is a coherent and necessary category. Jess is right. Dana did something morally optional but morally magnificent. Marcus is describing a valid logical system, but it is not the one we should use to navigate human relationships.
