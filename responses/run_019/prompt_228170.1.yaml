answer: |-
  Your friend's summary is a decent "elevator pitch," but it conflates Van Fraassen's actual argument with a more intuitive (but incorrect) justification that many people *wish* were true. Your intuition about the "drunk" case is spot-on and actually points to the biggest philosophical controversy surrounding the principle.

  Here is a breakdown of what a Van Fraassen fan would accept, where your friend's explanation goes off the rails, and the status of the conditionalization claim.

  ### 1. What a Van Fraassen Fan Would Accept

  **The Formal Principle:**
  A fan would agree with the core formulation: If you are certain *now* that your credence in proposition $A$ at time $t$ will be $x$, then your current credence in $A$ should also be $x$.
  *   *Formally:* $C_{now}(A \mid C_{future}(A) = x) = x$.
  *   Your friend's summary ("If you know... tomorrow your credence... will be 0.9... requires you to set your credence to 0.9 today") captures this correctly.

  **The Dutch Book Argument:**
  Van Fraassen famously defended Reflection using a diachronic Dutch Book argument. Your friend is right that Van Fraassen argues that violating Reflection makes you vulnerable to a guaranteed loss (a Dutch Book) involving bets placed now and bets placed later.
  *   *Nuance:* The Dutch Book only works if you are *certain* now about what your future credence will be. If you think there's a chance your future self will be irrational, the book doesn't close.

  **The Link to Conditionalization:**
  A Van Fraassen fan would agree that Reflection is meant to be a *generalization* of Conditionalization. Van Fraassen argues that if you satisfy Reflection, you are effectively committed to Conditionalization (updating only on new evidence) in standard learning scenarios.

  ### 2. Where the Explanation Gets It Wrong

  **The "Future Self Knows More" Rationale (Major Error)**
  This is the part that bugged you, and you are right to distrust it. **Van Fraassen does not justify Reflection on the grounds that your future self is epistemically superior.**
  *   **The Friend's Claim:** "Your future self will know more than you do now... refusing to defer is like betting against the better-informed person."
  *   **Van Fraassen's View:** Reflection is not about *improvement*; it is about *identity* and *coherence*. It is a requirement that you cannot coherently disagree with your own anticipated rational judgments. It treats your future self as *you*, not as a smarter expert.
  *   **Why this matters:** If Reflection relied on the future self knowing *more*, it wouldn't apply to cases where you expect to forget things. But Van Fraassen wants Reflection to apply even if you expect to lose information, provided you expect your future self to remain *rational*.

  **The "Drunk" Counterexample**
  Your intuition here is the standard objection to Reflection (often called the "Self-Doubt" or "Impairment" objection).
  *   **The Problem:** If I know I will take a drug that makes me believe I can fly, Reflection seems to say I should believe I can fly now. That's absurd.
  *   **The Friend's Failure:** Because your friend grounded Reflection in "future self knows more," they have no good answer to the drunk case. Obviously, the drunk self does *not* know more.
  *   **The Van Fraassen Defense:** A fan would say Reflection only applies when you anticipate your future self will be **rational**. If you know you are getting drunk, you do not regard your future credences as rational constraints. Therefore, the antecedent of the Reflection principle isn't met, and you don't have to defer.
      *   *Critique:* Many philosophers find this response circular. How do you define "rational" future credence without already assuming the norms you're trying to prove?

  **The Dutch Book Interpretation**
  Your friend says the Dutch Book shows "changing your mind without getting new evidence is incoherent."
  *   **Correction:** The Dutch Book shows that *disagreeing with your anticipated future self* is incoherent. You can change your mind without new evidence (e.g., through time-passing or forgetting) and still satisfy Reflection, as long as your current self anticipates that shift. The incoherence lies in the *mismatch* between current and anticipated future attitudes, not the shift itself.

  ### 3. Does the Punchline About Conditionalization Follow?

  Your friend claims: *"Basically Reflection plus conditionalization forces rational agents to only ever update on new evidence."*

  This is slightly garbled. Here is the more accurate philosophical relationship:
  1.  **Conditionalization** *is* the rule that says "only update on new evidence."
  2.  **Reflection** is proposed as the deeper principle that *justifies* Conditionalization.
  3.  **The Argument:** Van Fraassen argues that if you accept Reflection, you are forced to accept Conditionalization (in cases where you know what evidence you will get).
  4.  **The Error:** Your friend presents them as two separate rules that combine to force a result. In Van Fraassen's framework, Reflection is the master rule; Conditionalization is a specific instance of it.

  **Does it actually follow?**
  *   **Van Fraassen's View:** Yes. He argues Conditionalization is a special case of Reflection.
  *   **The Consensus:** **Highly Contested.** Many Bayesians (like David Lewis) accept Conditionalization but **reject Reflection**.
      *   *Why?* Because of the "forgetting" problem. If I know I will forget a piece of evidence tomorrow, my future credence will drop. Reflection says my current credence should also be low. But Conditionalization says I should hold the high credence now because I currently have the evidence. This creates a conflict. Most modern Bayesians prioritize Conditionalization over Reflection.

  ### 4. Summary of Contested vs. Settled Claims

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Reflection Principle Formulation** | **Contested** | Widely discussed, but many reject it due to forgetting/impairment cases. |
  | **"Future Self Knows More"** | **False** | Not Van Fraassen's argument; easily refuted by impairment cases. |
  | **Dutch Book Vulnerability** | **Settled (Technical)** | Mathematically true that violating Reflection allows a Dutch Book, *if* you are certain of future credences. |
  | **Reflection $\rightarrow$ Conditionalization** | **Contested** | Van Fraassen argues yes; Lewis and others argue no (they come apart in forgetting cases). |
  | **Rationality requires only updating on evidence** | **Settled (Orthodox)** | This is the standard Bayesian norm (Conditionalization), though the *justification* (via Reflection) is debated. |

  ### The Verdict for Your Friend
  Tell your friend they nailed the **math** and the **Dutch Book mechanics**, but they missed the **philosophical motivation**.
  1.  **Correction:** Reflection isn't about deferring to a *smarter* future self; it's about synchronic coherence with your own *anticipated* self.
  2.  **Validation:** Your "drunk" intuition is the standard philosophical objection. The principle only holds if you assume your future self is rational, which is a heavy assumption.
  3.  **Clarification:** Reflection is supposed to *derive* Conditionalization, not work alongside it. And many Bayesians accept Conditionalization precisely because they *reject* Reflection in cases of forgetting.

  **Recommended Reading (if you want to dive deeper):**
  *   Van Fraassen, "Belief and the Will" (1984) - The source text.
  *   David Lewis, "Conditionalization and Observation" - For the counter-argument regarding forgetting.
  *   Arntzenius, "Some Problems for Conditionalization and Reflection" (2003) - A modern takedown of the principle.
