answer: |-
  **Final Examination: Ethics Seminar**
  **Time Allowed:** 75 Minutes
  **Word Limit:** Approximately 900 words
  **Value:** 25 Marks

  **Question:**

  John Taurek argues that in a choice between saving one stranger or five strangers, where all are equally easy to reach, you are not morally obligated to save the five. Write an essay that addresses the following three tasks:

  1.  **Reconstruct Taurek's Argument:** Explain the core reasoning behind Taurek's challenge. You must locate the load-bearing step of his argument: specifically, his refusal to let several equal individual claims combine into a stronger collective claim, grounded in the thought that the deaths of five people do not aggregate into a single loss borne by any one subject.
  2.  **Formulate the Strongest Objection:** Identify exactly which step a defender of saving the five should reject. Do not simply assert that five deaths are worse than one. Instead, engage at least one of the following pressure points: the problem of pairwise comparison versus whole outcomes; the implications of a policy of flipping a coin across many repetitions; or the nature of the complaint each of the five can lodge regarding the equal mattering of their lives.
  3.  **Assess a Middle Position:** Evaluate whether a compromise view is stable—for example, a weighted lottery that gives the five a larger but not decisive chance, or a contractualist test framed in terms of what each affected individual could reasonably reject. Argue whether such a position can withstand the logic of either Taurek or his critic.

  ***

  **Model Answer:**

  Taurek's challenge to the standard view rests on a specific conception of moral loss and individual claims. To understand his argument, one must look beyond the surface recommendation—to flip a coin rather than save the five—and examine the metaphysical premise regarding aggregation. Taurek argues that moral obligations are grounded in the losses suffered by individuals. When deciding between saving David or saving a group of five, we are comparing the loss David suffers if he dies against the loss each member of the group suffers if they die. Since each individual faces the same loss (their own life), and there is no "super-subject" who bears the combined loss of all five deaths, there is no single loss in the group scenario that is greater than David's loss. Consequently, there is no greater claim to outweigh David's. The load-bearing step here is the refusal to aggregate: the claim of the five is not the sum of five individual claims, but merely five separate claims equal in weight to David's. Without aggregation, the numbers do not count.

  A defender of the standard view must reject this anti-aggregation premise. The strongest objection does not merely insist that five deaths are intuitively worse, but demonstrates why the refusal to aggregate leads to unacceptable implications regarding policy and complaint. Consider the pressure point of policy repetition. If an agent adopts Taurek's principle as a universal policy—always flipping a coin in such scenarios—they knowingly accept a procedure that, across many repetitions, will result in significantly more deaths than a policy of saving the majority. While Taurek might argue that each decision is isolated, the agent knows ex ante that adhering to non-aggregation causes more preventable loss overall. Furthermore, consider the complaint of the five. Each of the five can say to the rescuer: "My life mattered no less than David's." If the rescuer flips a coin, they treat the group's collective interest as equal to the individual's, despite the fact that satisfying the group's interest satisfies five distinct claims of equal weight. The objection, therefore, is that fairness requires respecting the equal weight of each claim, which necessitates counting them. To ignore the number of claims is to fail to treat the individuals in the group as equally important as the single individual.

  This leads to the assessment of a middle position, such as a weighted lottery. One might argue that while we should not automatically save the five, we should give them a higher probability of rescue proportional to their numbers (e.g., an 83% chance for the five, 17% for the one). However, this position is unstable. If the justification for weighting the lottery is that the five have a stronger collective claim, then consistency demands we maximize that claim by saving them certainly. If the justification is that we must respect the individual chance of the one, then weighting the lottery still sacrifices the one sometimes to save the five, which Taurek would reject as violating the one's equal standing. Conversely, if the weighting is arbitrary, it lacks moral foundation.

  A contractualist middle position argues that a principle requiring us to save the five could not be reasonably rejected by the one, because the one would prefer a world where numbers count (in case they are part of a majority) over a world of coin flips. However, this too faces instability. In the specific moment of choice, the one is not asking about general principles but their specific survival. If the basis of the obligation is the immediate claim of the individuals present, the contractualist appeal to hypothetical agreement risks bypassing the actual asymmetry of the situation. Ultimately, the middle ground collapses because the logic of aggregation is binary: either individual claims sum to create a stronger obligation, or they do not. If they do, the five must be saved; if they do not, the chance must be equal. A weighted lottery attempts to have it both ways, acknowledging numbers without fully committing to their moral force. Therefore, the most stable position is to reject Taurek's anti-aggregation premise entirely. We ought to save the five because the moral force of individual claims aggregates, making the loss of five lives objectively greater than the loss of one, not in the experience of a super-subject, but in the sum of frustrated claims that morality ought to prevent.

  ***

  **Marking Scheme (25 Marks)**

  **Grade Differentiation: A vs. B**
  *   **A Grade (20–25 marks):** The answer explicitly identifies the **anti-aggregation premise** as the load-bearing step. It shows how the objection and the assessment of the middle position turn on this premise. It engages deeply with at least one specified **pressure point** (policy repetition, pairwise comparison, or individual complaint) rather than relying on intuition. It takes a clear, argued position on the **stability of the middle position** (e.g., arguing it collapses into one of the extremes).
  *   **B Grade (15–19 marks):** The answer reconstructs Taurek's fairness intuition accurately (coin flip) but fails to locate the specific anti-aggregation premise. The objection typically falls back on asserting that "five deaths are worse than one" without explaining why Taurek denies this or which premise is being rejected. The assessment of the middle position is descriptive rather than analytical (e.g., describes a weighted lottery but does not argue for its stability or instability).

  **Detailed Breakdown:**

  **1. Reconstruction of Taurek (8 Marks)**
  *   **7–8 marks:** Clearly isolates the refusal to aggregate claims. Explains the "no super-subject" argument (losses are personal).
  *   **4–6 marks:** Explains the coin flip conclusion but is vague on *why* Taurek thinks numbers don't count (misses the metaphysical claim about loss).
  *   **0–3 marks:** Misrepresents Taurek (e.g., claims Taurek is a utilitarian, or claims Taurek argues to save the one).

  **2. Formulation of Objection (8 Marks)**
  *   **7–8 marks:** Targets the anti-aggregation premise directly. Engages a specific pressure point (e.g., "Policy repetition shows knowingly leaving more dead"). Explains why this undermines Taurek's view.
  *   **4–6 marks:** Identifies the standard view (save the five) but argues only from intuition ("5 > 1"). Does not engage the specific pressure points listed in the prompt.
  *   **0–3 marks:** Objection is irrelevant or misunderstands the dilemma (e.g., argues about feasibility of rescue).

  **3. Assessment of Middle Position (6 Marks)**
  *   **5–6 marks:** Takes a clear stance on stability (stable/unstable) with reasoning. Shows how the middle position fails or succeeds based on the aggregation debate.
  *   **3–4 marks:** Describes a middle position (weighted lottery/contractualism) but offers no argument regarding its stability.
  *   **0–2 marks:** Ignores the third task or offers a confused summary.

  **Common Wrong-Turns (Real Student Errors):**
  *   **The Utilitarian Confusion:** Assuming Taurek is arguing from a utilitarian framework rather than a deontological/individualist one. (Deduct in Section 1).
  *   **The Intuition Pump:** Asserting "saving five is obviously right" without engaging the philosophical mechanism of aggregation. (Caps Section 2 at 4 marks).
  *   **The Straw Man:** Claiming Taurek suggests we *must* save the one, rather than that we are *permitted* to flip a coin. (Deduct in Section 1).
  *   **The Middle Ground Fallacy:** Assuming a weighted lottery is automatically the "best" solution simply because it is a compromise, without testing its logical consistency. (Deduct in Section 3).
