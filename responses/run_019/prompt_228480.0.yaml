      *   *Check:* Did I offer a concrete alternative?
      *   *Correction:* Yes, the reference class/Bayesian approach.

  7.  **Final Polish:** Ensure the transition from brainstorming to structured analysis is clear. Make sure the conclusion is blunt about the incoherence as requested ("If you find that no single coherent epistemology underwrites the practice... say so plainly").

      *(Self-Correction on "Brainstorming"):* The prompt asks for "unstructured brainstorming before settling into your analysis." I should format this distinctly, perhaps as a raw thought block, before moving to the numbered sections.

      *(Refining the "Physicist" connection):* The user knows RCTs. I should explicitly contrast the *counterfactual* nature of policy analogies with the *controlled* counterfactuals of experiments. In history, we can't run the counterfactual. In policy, we pretend we know the counterfactual of the past (e.g., "If we fought in '38, war would have been shorter"). That's a huge epistemic leap.

  8.  **Finalizing the Argument:**
      *   The practice is epistemologically hybrid and unstable.
      *   It claims to be inductive (lessons) but acts abductively (framing).
