  4.  **Drafting the Content - Section by Section:**

      *   *Brainstorming:* Keep it raw. Mention "lessons of history," "cognitive heuristics," "narrative," "Hume on miracles," "Kuhn on exemplars." Note the tension between *justification* and *discovery*.
      *   *Implicit Epistemology:* It's not really "quasi-experimental data" because they don't control variables. It's closer to *casuistry* (case-based reasoning) or Kuhnian *exemplars*. It treats history as a moral/causal archive. But it's often *rhetorical*. It functions to collapse complexity.
      *   *Rival Views:* It rules out *historical particularism* (every event is unique). It rules out strong *constructivism* (the past is interpreted through the present). It assumes *realism* about historical categories (e.g., "appeasement" is a stable natural kind).
