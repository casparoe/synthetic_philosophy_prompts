      *   *Why do they do it?* Cognitive ease. Narrative persuasion. Moral clarity. "Never again" is a moral imperative, not a statistical probability.
      *   *Epistemology:* Is it inductive? "Dictators are appeased -> War." No, it's more like abductive or analogical. "Situation A looks like Situation B; B had Outcome X; therefore A will have Outcome X if we do Y."
      *   *Kuhn:* Paradigms? Exemplars? Munich is an exemplar of "Bad Policy."
      *   *Hempel:* Covering Law Model? "Whenever appeasement occurs, war follows." Historians hate this.
      *   *Oakeshott:* History as practical past vs. historical past. Policymakers use the *practical* past (what serves me now), not the *historical* past (what actually happened in context).
      *   *Bias:* Confirmation bias. Cherry-picking analogies. If you want war, use Munich. If you want peace, use Sarajevo (accidental escalation).
      *   *Underdetermination:* The analogy doesn't force the conclusion. It justifies a pre-existing inclination.
      *   *Statistical view:* Reference classes. What class does "US-China" belong to? Thucydides Trap? Or Economic Interdependence Peace? The choice of reference class determines the probability.
