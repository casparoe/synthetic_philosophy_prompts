answer: |-
  Here is a complete lesson plan designed to generate the specific philosophical tension you're looking for, without front-loading the theory.

  # Session Title: The Collector's Game
  **Time:** 75 Minutes
  **Participants:** 18 Undergraduates
  **Materials:** Whiteboard, markers, index cards (2 per student), a visible timer, a coin.

  ## 1. The Setup (0:00 – 0:10)
  **Goal:** Establish the narrative and rules without naming the philosophical problem.

  *   **Narrative:** Tell the students they are traveling in a region ruled by "The Collector" (avoid the word "Death" initially to keep it light, but imply high stakes). The Collector wants to meet them. The students want to avoid The Collector.
  *   **The Cities:** There are two cities: **Aleppo** and **Damascus**.
  *   **The Predictor:** The Collector is a near-perfect predictor. They do not chase you; they go to where they *predict* you will be.
  *   **The Rule of Correlation:** Be transparent about the game mechanics to avoid "magic trick" skepticism. Write this on the board:
      1.  **Deterministic Choice:** If you decide on a city through reasoning (e.g., "I choose A because..."), The Collector predicts this with 100% accuracy.
      2.  **Random Choice:** If you decide via a truly random process (e.g., a coin flip), The Collector's prediction accuracy drops to 50% (pure chance).
      3.  **Payoff:**
          *   Avoid The Collector: **100 Life Credits**.
          *   Meet The Collector: **0 Life Credits**.
          *   **Deliberation Cost:** Every time you publicly switch your intent during the game, you lose **5 Life Credits**.
  *   **Roles:**
      *   **You (Facilitator):** The Game Master / Voice of The Collector.
      *   **Students:** The Travelers.
      *   **No "Death" Actor:** You embody the logic of the predictor.

  ## 2. The Game: "The Oscillation" (0:10 – 0:40)
  **Goal:** Force them to experience the ratifiability loop.

  **Phase 1: Individual Deliberation (10 mins)**
  *   Hand out index cards. Tell them they must eventually submit a final card.
  *   Tell them they have 10 minutes to decide. They can talk to each other, but they must report their *current intent* to you if they want a "Status Check."
  *   **The Trap:** Walk around the room. When a student says, "I'm thinking Aleppo," stop and ask loudly enough for others to hear:
      *   *You:* "Okay, if you are *thinking* Aleppo, you are reasoning toward Aleppo. That makes Aleppo your likely destination. Where does The Collector go?"
      *   *Student:* "Aleppo."
      *   *You:* "So if you commit to Aleppo now, your expected utility is 0. Damascus looks better, right?"
      *   *Student:* "Yeah, I'll switch to Damascus."
      *   *You:* "Okay, switch noted. -5 Credits. But now you are reasoning toward Damascus. Where does The Collector go?"
      *   *Student:* "...Damascus."
      *   *You:* "Expected utility 0 again. Aleppo looks better now."
  *   **Visualizing the Loop:** On the whiteboard, draw a table. Every time a student publicly switches, mark a tally. Watch the "Credit Score" of the room drop as they oscillate.
  *   **Observation:** You will see students get frustrated. Some will try to "outsmart" the predictor by lying (saying A, planning D).
      *   *Intervention:* Remind them: "The Collector predicts your *final decision mechanism*, not your bluff. If you plan to D, The Collector is at D."

  **Phase 2: The Randomization Option (10 mins)**
  *   At the 20-minute mark, announce: "Many travelers find themselves stuck. There is a known loophole. You may surrender your choice to chance."
  *   Hold up a coin. "If you flip a coin, your choice is no longer causally linked to your reasoning. The Collector cannot predict a coin flip better than chance."
  *   **Cost:** Using the coin costs **20 Life Credits** (it's risky/unstable).
  *   Ask for a show of hands: Who is sticking with Reasoning? Who is using the Coin?
  *   Let them debate in small groups for 5 minutes.
  *   **Final Commitment:** Collect the index cards. If they used the coin, they write "COIN" on the card.

  **Phase 3: The Reveal (5 mins)**
  *   **Deterministic Choosers:** Reveal that for everyone who reasoned to a specific city, The Collector was there. (Score: 0).
  *   **Randomizers:** Flip a public coin for each "COIN" card. Heads = Aleppo, Tails = Damascus. Reveal The Collector's location (also random). roughly 50% survive. (Score: 100 - 20 cost = 80).
  *   **Winner:** The randomizers win, despite the cost. The reasoners lost everything due to deliberation costs and inevitable capture.

  ## 3. Small Group Diagnosis (0:40 – 0:55)
  **Goal:** Let them generate the vocabulary before you give it to them.

  Break into 3 groups of 6. Give them these three questions on a handout:
  1.  **The Loop:** Why did switching cities feel like the rational thing to do, even though it guaranteed you lost points?
  2.  **The News:** When you decided to go to Aleppo, did that *cause* The Collector to be there, or was it *news* that he was already there?
  3.  **The Solution:** Why did the coin flip work when reasoning failed?

  ## 4. The Debrief & Theory Mapping (0:55 – 1:15)
  **Goal:** Connect the experience to Decision Theory.

  **1. Name the Problem (5 mins)**
  *   Reveal: "This is the **Death in Damascus** problem."
  *   Acknowledge the feeling: "That sensation of 'As soon as I pick A, I should pick D' is the core puzzle."

  **2. Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT) (10 mins)**
  *   **EDT (The Loop):** Explain that their deliberation followed Evidential Decision Theory.
      *   *Formula:* $U(A) = P(\text{Life} | \text{Choose A}) \times \text{Value}$.
      *   *The Trap:* Since $P(\text{Life} | \text{Choose A}) \approx 0$ (because the choice is evidence of prediction), the utility of A crashes. So you switch to D. But then $P(\text{Life} | \text{Choose D}) \approx 0$.
      *   *Takeaway:* EDT makes the act of choosing provide *bad news* about the outcome.
  *   **CDT (The Coin):** Explain that the coin flip represents a Causal approach (or a Mixed Strategy).
      *   *Logic:* My choice cannot *cause* The Collector's past prediction. If I randomize, I break the evidential link.
      *   *Takeaway:* CDT focuses on the causal impact of the act. Since my choice doesn't causally move The Collector (who is already gone), I should just pick the city I prefer (or randomize to avoid prediction).

  **3. Ratifiability (5 mins)**
  *   **Definition:** A decision is **ratifiable** if, conditional on the fact that you have made it, it is still the best option.
  *   **Application:** In the game, was "Choose Aleppo" ratifiable?
      *   *No.* Conditional on "I am choosing Aleppo," the probability of Death is 100%. Conditional on "I am choosing Damascus," the probability of Death is 0% (relative to Aleppo).
      *   So, Aleppo is not ratifiable. Damascus is not ratifiable.
      *   **The Coin:** The mixed strategy *is* ratifiable. Conditional on "I am flipping a coin," my expected utility is 50% survival, which is better than 0% survival from deterministic reasoning.

  ## 5. Troubleshooting: What Will Go Wrong
  **Be ready for these specific failure modes:**

  1.  **The "Liar" Strategy:**
      *   *Problem:* A student says, "I'll tell you I'm going to Aleppo, but I'll actually go to Damascus."
      *   *Fix:* Reinforce the "Rule of Correlation." The Collector predicts your *decision mechanism*, not your verbal report. If your mechanism is "Lie to the GM," the Collector predicts the city you *actually intend to visit*. You must emphasize that the prediction happens on the *final submission*, not the verbal check-in.
  2.  **Early Randomizers:**
      *   *Problem:* One philosophy major in the corner flips a coin immediately, breaking the tension.
      *   *Fix:* Acknowledge them as the "Control Group." Tell the rest, "They have opted out of the reasoning game. Let's see if the rest of you can beat the Collector with pure reason." This isolates them without ruining the loop for others.
  3.  **Skepticism about the Predictor:**
      *   *Problem:* "You're just saying you predicted me. You didn't."
      *   *Fix:* This is why the **Rule of Correlation** is written on the board as a game mechanic, not a claim of psychic power. "We are stipulating this correlation for the sake of the model. If you reject the premise, the game doesn't work. Suspend disbelief to test the logic."
  4.  **Boredom during the Loop:**
      *   *Problem:* They switch 10 times and stop caring.
      *   *Fix:* Enforce the **Deliberation Cost** strictly. Make the point loss visible on the board. The pain of losing points keeps the stakes real.

  ## 6. Honest Limitations (For your own preparation)
  *   **Human Predictors aren't Perfect:** In reality, you can't predict humans with 100% accuracy. The game relies on a *stipulated* correlation. In the real world, the correlation is probabilistic, which weakens the "death" conclusion but keeps the evidential problem intact.
  *   **Stakes aren't Death:** Students are playing for "Life Credits." Real death involves fear that overrides reasoning. The game captures the *logical* structure, not the *emotional* terror of the original thought experiment.
  *   **Causal Loopholes:** In real life, you could call ahead, hire a bodyguard, or change the payoff structure. The game isolates the decision to a binary choice to force the philosophical conflict. In reality, we rarely face such stripped-down choices.
  *   **The "Coin" Solution:** The game suggests randomization is the answer. However, some philosophers argue that if the Predictor is *truly* perfect, they predict the coin flip outcome too (if the coin flip is physically determined). The game simplifies this by defining "Random" as "Unpredictable."

  ## Summary of Flow
  1.  **Hook:** Narrative setup (10m).
  2.  **Experience:** The oscillation loop & point loss (30m).
  3.  **Release:** The coin flip option (10m).
  4.  **Diagnosis:** Small groups (15m).
  5.  **Theory:** EDT, CDT, Ratifiability mapping (10m).

  This structure ensures they feel the frustration of the loop *before* they are given the vocabulary to resolve it, making the theoretical debrief land much harder.
