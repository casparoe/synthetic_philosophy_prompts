prompt: |-
  I'm a philosophy professor, and somehow half my job is running votes: hiring committee shortlists, picking which colloquium speakers to invite, curriculum proposals, grad admissions waitlists. A while back I actually sat down and read up on the Gibbard-Satterthwaite theorem (partly out of guilt, since I teach social choice every few years and always hand-wave the proof), and it's been bugging me ever since. As I understand it: once there are three or more options, any deterministic rule for picking a single winner that isn't a dictatorship and lets every option possibly win can be gamed by someone voting insincerely. Fine. Depressing, but fine. The thing is, I still have to run these votes next semester, and the theorem doesn't come with a "so here's what to do about it" section.

  So: turn what the theorem actually implies -- and just as importantly, what it does NOT imply -- into a practical procedure I can follow when I'm setting up a departmental vote. Roughly: given the kind of decision, the number of options, what I know about how people's preferences line up, and how much I care about sincere voting versus other goods (speed, legitimacy, the losers not feeling robbed), which rule should I use? Or should I restructure the choice itself instead -- narrow the field first, vote on things one at a time, pair options off?

  Some constraints on the procedure:

  - It should start from the theorem's actual content and scope conditions. It only bites, as I understand it, when preferences are unrestricted, so I want an early step that checks whether something like single-peakedness plausibly holds in the case at hand (hiring votes often feel nearly one-dimensional -- research quality -- until someone mentions teachign coverage and suddenly we're in two dimensions and I'm doomed). The procedure should say what to do when the theorem genuinely applies versus when a restriction plausibly saves me.
  - It should distinguish "the theorem says strategic voting is possible" from "strategic voting is likely and worth designing around." I suspect a lot of people overread it as "everyone will lie all the time," and I don't think that's what it says.
  - It should go through the escape hatches I keep hearing about and say whether each one genuinely escapes: sequential elimination with an agenda, approval voting (voters aren't submitting rankings, so is it even under the theorem's jurisdiction?), randomization, deliberation before the vote, just... refusing to have more than two options on the table.
  - Include three worked applications: (a) a hiring committee ranking four candidates for one job; (b) a faculty meeting choosing among five curriculum proposals with known factions; (c) at least one case where the procedure gives me an answer I won't like -- e.g., it tells me a rule I'd pick on other grounds is fine despite being manipulable, or it tells me to shrink the agenda when I'd rather not.
  - Be explicit about what the theorem can't settle. As far as I know it says nothing about which rule's manipulability is worst in practice, nothing about legitimacy, nothing about when strategic voting is even bad. Mark clearly where the procedure runs out and I'm back to judgment.

  Write it as an actual checklist or flowchart-in-words I could tape next to my office door, not an essay. Casual tone is fine; I'm going to be following this thing at 4:45pm in a stuffy seminar room and I need it to work then.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor.
      *   **Task:** Create a practical procedure/checklist for running departmental votes, grounded in the Gibbard-Satterthwaite (G-S) theorem.
      *   **Tone:** Casual, practical, "tape next to office door," not an essay.
      *   **Key Constraints:**
          *   Start from G-S scope conditions (unrestricted preferences vs. restricted domains).
          *   Distinguish "possible" manipulation from "likely/costly" manipulation.
          *   Evaluate escape hatches (sequential elimination, approval voting, randomization, deliberation, binary choices).
          *   Include three worked applications (hiring, curriculum, one unwelcome conclusion).
          *   Explicitly mark where the theorem stops and judgment begins.
      *   **Goal:** Actionable advice for specific scenarios (hiring, curriculum, admissions) acknowledging the theorem's limits.

  2.  **Deconstruct Gibbard-Satterthwaite (G-S):**
      *   *What it says:* For 3+ options, any deterministic social welfare function that is onto (surjective) and strategy-proof is a dictatorship.
      *   *Scope Conditions:*
          *   Ordinal preferences (rankings).
          *   Unrestricted domain (any preference order is possible).
          *   Deterministic (no randomness).
          *   Single winner (or ranking leading to a winner).
          *   No dictator.
      *   *What it doesn't say:*
          *   How *hard* it is to manipulate.
          *   How *bad* the outcome is if manipulated.
          *   That cardinal methods (Approval, Score) are immune (they change the input type).
          *   That restricted domains (Single-Peaked) are impossible.
          *   That deliberation changes preferences (it changes the input, not the rule).

  3.  **Drafting the Procedure (The "Checklist"):**
      *   *Step 1: Diagnosis.* Is G-S even relevant? (Number of options, type of input).
      *   *Step 2: Domain Check.* Can we assume single-peakedness? (One dimension?).
      *   *Step 3: Escape Hatch Evaluation.* If G-S applies, what tools do we have?
          *   *Binary:* Reduce to 2 options.
          *   *Cardinal:* Switch to Approval/Score (leaves G-S jurisdiction).
          *   *Random:* Use a lottery (violates determinism).
          *   *Agenda:* Sequential pairing (vulnerable to agenda setting).
          *   *Deliberation:* Align preferences (restricts domain).
      *   *Step 4: Risk Assessment.* Is manipulation likely/costly? (Stakes, transparency, culture).
      *   *Step 5: Final Selection & Disclaimer.* Pick the rule, acknowledge the trade-off.

  4.  **Developing the Worked Examples:**
      *   *(a) Hiring:* 4 candidates. High stakes. Multidimensional (research vs. teaching). G-S likely applies. *Recommendation:* Consensus building (deliberation) + Binary runoff or Borda (acknowledging manipulability).
      *   *(b) Curriculum:* 5 proposals. Factions known. Political. *Recommendation:* Amendment procedure (binary tree) or Approval Voting.
      *   *(c) Unwelcome Conclusion:* Maybe a case where the "fairest" rule is too manipulable, or where the theorem says "just pick a dictator" (Chair decides), or where we *must* accept manipulability. Let's go with: "You want a ranked vote on 4 options without discussion? G-S says it's gonna be gameable. Deal with it." Or better: "The theorem implies you should restrict the agenda, but you want open debate. You have to choose: structure or openness." Let's make it about the Chair's power. If you want strategy-proofness, *you* decide.

  5.  **Refining the Tone:**
      *   Needs to be punchy. "4:45pm in a stuffy room."
      *   Use philosophical jargon correctly but lightly ("onto," "domain restriction").
      *   Be honest about the "depressing" nature of the theorem.

  6.  **Addressing Specific Constraints:**
      *   *Single-peakedness:* Make this a specific checkpoint.
      *   *Approval Voting:* Clarify it sidesteps G-S by changing input from ordinal to cardinal.
      *   *Judgment Call:* Clearly demarcate where math ends and politics begins.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Correction:* I initially thought about suggesting Borda. But Borda is notoriously manipulable. I should warn against it if strategy is a high risk.
      *   *Correction:* Make sure to distinguish between "Social Welfare Function" (ranking all) and "Social Choice Function" (picking one). G-S applies to both effectively in this context.
      *   *Addition:* Need to emphasize that *deliberation* isn't an escape hatch within the math, but a way to change the *preferences* before the math applies.
      *   *Addition:* Ensure the "Unwelcome Conclusion" example is genuinely uncomfortable. E.g., "The only strategy-proof way is for you to decide alone."

  8.  **Final Review against constraints:**
      *   Checklist format? Yes.
      *   Scope conditions checked? Yes.
      *   Escape hatches evaluated? Yes.
      *   3 Examples? Yes.
      *   Limits marked? Yes.
      *   Tone? Casual/Professional.

  9.  **Final Polish:** Check the flow. Ensure the distinction between "G-S applies" and "G-S bites" is clear. (Just because manipulation is *possible* doesn't mean it's *probable*).

  *(Self-Correction on the "Unwelcome Conclusion"):* Let's make it about the "Status Quo." Often the only way to avoid cycling/manipulation is to give the status quo veto power (binary choices against the current state). This restricts freedom. That's a good "unwelcome" result. Or, the "Dictator" clause. Let's use the Dictator clause. It's the most direct implication of G-S.

  *(Refining Approval Voting):* Technically, Gibbard (1978) extended the theorem to cardinal utilities, but the classic G-S is ordinal. Approval is usually safe from *ordinal* manipulation but has its own strategic issues (threshold setting). I need to be precise: Approval escapes the *classic* G-S conditions because it's not asking for a ranking, but it has its own strategic quirks. I will frame it as "leaving G-S jurisdiction" but note it has its own games.

  *(Refining Single-Peakedness):* Hiring is rarely single-peaked. Curriculum might be (spending levels). I need to make sure the checklist prompts the user to verify this.

  Okay, ready to write.
answer: |-
  # The 4:45 PM Social Choice Checklist
  **For when you're in a stuffy room and need to pick a rule without lying to your colleagues (or yourself).**

  ### PHASE 1: DOES GIBBARD-SATTERTHWAITE (G-S) EVEN APPLY?
  *Don't panic until you've checked the scope conditions. G-S is specific.*

  **1. Count the Options.**
  *   **2 Options?** G-S does not apply. Use simple majority. It's strategy-proof (mostly).
  *   **3+ Options?** Proceed to Step 2.

  **2. Check the Input Type.**
  *   **Rankings (Ordinal)?** (e.g., "Rank candidates 1–4"). G-S applies.
  *   **Ratings (Cardinal)?** (e.g., Approval, Score 0–5). G-S *technically* does not apply (different input domain), but strategic incentives still exist (see Phase 3).
  *   **Binary Yes/No on multiple measures?** (e.g., "Yes on research, No on teaching"). This is combinatorial voting; G-S doesn't cover it directly, but paradoxes (Ostrogorski) await. Treat as 3+ options.

  **3. Check the Domain (The "Single-Peaked" Test).**
  *   *Question:* Is there a clear, shared dimension everyone agrees on? (e.g., "How much money to spend on the library," where everyone wants to be close to their ideal point).
  *   **Yes (Single-Peaked):** You are safe from Condorcet cycles. Median voter theorem applies. Majority rule is strategy-proof *if* the agenda is set correctly.
  *   **No (Multi-Dimensional):** (e.g., Hiring: Research vs. Teaching vs. Fit). G-S bites hard. Preferences are unrestricted. Proceed to Phase 2.

  ---

  ### PHASE 2: CHOOSE YOUR POISON (ESCAPE HATCHES)
  *G-S says: Deterministic + Non-Dictatorial + Onto + Ordinal = Manipulable. To escape, you must break one of those links.*

  **A. Break "3+ Options" (Agenda Control)**
  *   **Method:** Sequential binary elimination (Amendment procedure).
  *   **Verdict:** **Escapes G-S** (technically reduces to series of binary votes).
  *   **Catch:** Vulnerable to *agenda manipulation*. Whoever sets the order wins.
  *   **Use when:** You need a clear winner and trust the Chair not to game the order.

  **B. Break "Ordinal Input" (Approval/Score)**
  *   **Method:** Approval Voting (Check all you accept) or Score (0–5).
  *   **Verdict:** **Escapes G-S jurisdiction** (changes the math).
  *   **Catch:** Voters still strategize (e.g., "bullet voting" or truncating scores). But it reduces the *cognitive load* of lying compared to complex ranking permutations.
  *   **Use when:** Options are not mutually exclusive or you want to gauge intensity of support.

  **C. Break "Determinism" (Randomization)**
  *   **Method:** Pick a winner by lottery from a shortlist.
  *   **Verdict:** **Escapes G-S** (theorem assumes deterministic outcomes).
  *   **Catch:** Legitimacy hit. "We let a coin flip decide the hire?"
  *   **Use when:** Candidates are truly indistinguishable (tie-breaking) or to break factional deadlock.

  **D. Break "Unrestricted Domain" (Deliberation)**
  *   **Method:** Discuss preferences *before* voting to align values.
  *   **Verdict:** **Does not escape G-S**, but changes the *preferences* fed into it. If everyone agrees on the dimension, you return to Single-Peakedness.
  *   **Catch:** Time-consuming. Can feel coercive.
  *   **Use when:** Stakes are high (hiring) and time permits.

  **E. Break "Non-Dictatorial" (The Chair Decides)**
  *   **Method:** Consultative vote, but Chair has final say.
  *   **Verdict:** **Escapes G-S** (Theorem explicitly allows dictatorships as strategy-proof).
  *   **Catch:** Morale hit.
  *   **Use when:** The department is paralyzed and *something* must happen.

  ---

  ### PHASE 3: RISK ASSESSMENT (WILL THEY LIE?)
  *G-S says manipulation is **possible**. It does not say it is **likely** or **costly**.*

  **1. Stakes Check:**
  *   **Low Stakes** (Lunch order, seminar time): Don't worry. Sincere voting is a focal point.
  *   **High Stakes** (Hiring, Tenure, Budget): Expect strategy.

  **2. Transparency Check:**
  *   **Secret Ballot:** Encourages strategy (no social cost to lying).
  *   **Show of Hands:** Discourages strategy (reputational cost to lying).

  **3. Complexity Check:**
  *   **Easy to Game:** (e.g., Plurality with 4 options). Voters know how to "vote for the lesser evil."
  *   **Hard to Game:** (e.g., Complex Borda count). Voters can't calculate the optimal lie without knowing others' votes. *Note: Hard-to-game isn't strategy-proof, just computationally expensive.*

  ---

  ### PHASE 4: THE JUDGMENT CALL (WHERE MATH ENDS)
  *The theorem runs out here. You must weigh goods it cannot measure.*

  *   **Legitimacy:** A manipulable rule that *feels* fair (like a ranked vote) may be better than a strategy-proof rule that feels arbitrary (like a lottery).
  *   **Information:** Some rules (Score) reveal intensity; others (Ranking) hide it. Do you *want* to know how much they hate Option C?
  *   **Efficiency:** Deliberation restricts the domain but takes 2 hours. A vote takes 10 minutes. Is the time worth the preference alignment?

  ---

  ### WORKED APPLICATIONS

  #### (A) The Hiring Committee (4 Candidates, 1 Job)
  *   **Diagnosis:** 4 Options. Multi-dimensional (Research/Teaching/Fit). G-S applies. High Stakes.
  *   **Escape Hatch:** You can't easily make this single-peaked. Randomization is unacceptable for hiring.
  *   **Procedure:**
      1.  **Deliberation First:** Force a discussion on criteria *before* ranking. Try to induce single-peakedness on "overall fit."
      2.  **Rule:** Use **Approval Voting** on the shortlist (Check all you'd be happy to hire).
      3.  **Why:** Escapes ordinal G-S. Prevents the "vote splitting" problem of Plurality. Encourages consensus (if 4/5 check Candidate A, she wins).
      4.  **Caveat:** If no one gets majority approval, revert to Chair consultation (The "Dictator" escape).
  *   **Verdict:** Accept that some strategy is possible, but Approval makes it harder to "bury" a strong candidate without risking your own preferred candidate.

  #### (B) Curriculum Reform (5 Proposals, Known Factions)
  *   **Diagnosis:** 5 Options. Factions imply polarized preferences. G-S applies.
  *   **Escape Hatch:** This is political. Agenda control is inevitable.
  *   **Procedure:**
      1.  **Rule:** **Sequential Binary Elimination** (Amendment Procedure).
      2.  **Agenda:** Vote on proposals pairwise, winner stays on, challenger enters. Status Quo is the final barrier.
      3.  **Why:** Reduces complex choice to binary choices (G-S safe zone). Gives Status Quo veto power (stability).
      4.  **Caveat:** You must fix the agenda order *in advance* by a separate vote, or the Chair sets it. Acknowledge this power openly.
  *   **Verdict:** Embrace the agenda manipulation. It's better than cycling forever.

  #### (C) The Unwelcome Conclusion (Grad Admissions Waitlist)
  *   **Scenario:** You have 3 candidates for 1 spot. You want a "fair," "democratic," "sincere" ranked vote.
  *   **Diagnosis:** 3 Options. Unrestricted Domain. G-S Applies.
  *   **The Math:** There is **no** rule that satisfies your desires.
      *   If you want it strategy-proof, it must be a Dictatorship (one person picks).
      *   If you want it Non-Dictatorial, it must be Manipulable.
  *   **The Procedure's Advice:** **Stop pretending.**
      *   Do not use a ranked ballot and claim it reveals the "will of the committee." It reveals the "strategic equilibrium of the committee."
      *   **Option 1:** Admit manipulability. Use Borda, tell everyone "vote sincerely," and accept that smart voters will lie.
      *   **Option 2:** Restrict freedom. Reduce to 2 finalists, then flip a coin. (Escapes G-S via Randomization + Binary).
      *   **Option 3:** The Chair decides. (Escapes G-S via Dictatorship).
  *   **Why you won't like it:** You want the legitimacy of a vote without the vulnerability of a vote. The theorem says **you can't have both.** Pick one.

  ---

  ### FINAL REMINDER
  **Gibbard-Satterthwaite is a impossibility theorem, not a prescription.**
  It tells you what you *can't* have. It does not tell you which imperfection is least painful.
  *   If the room is hostile: **Structure the agenda.**
  *   If the room is cooperative: **Deliberate to restrict the domain.**
  *   If the room is tired: **Let the Chair decide.**

  *Good luck. See you next semester.*
