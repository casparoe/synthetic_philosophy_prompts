answer: |-
  # The Specification for Mental Causation: A Desiderata Sheet

  You are correct that the literature often feels like a series of ships passing in the night. Davidson, Kim, and the proportionality theorists (like Yablo, List, and Menzies) are often optimizing for different variables. To compare them fairly, you need a unified spec sheet. Below is the breakdown of what an adequate theory of mental causation is typically asked to deliver, classified by their status as hard constraints or theoretical preferences.

  ## I. The Core Data (The "Must-Haves")
  *These are the phenomena any theory must account for to be considered a theory of **mental** causation rather than something else.*

  **1. Mental Efficacy**
  *   **Requirement:** Mental states (beliefs, desires, decisions) must be causally efficacious. They cannot be mere shadows of physical processes.
  *   **Motivating Case:** **Volitional Action.** You decide to raise your hand, and your hand goes up. If the decision played no causal role, your sense of agency is an illusion.
  *   **Status:** **Non-Negotiable.** (Giving this up yields epiphenomenalism, which is usually treated as a *reductio* of the theory that entails it.)

  **2. Physical Causal Closure (Closure)**
  *   **Requirement:** Every physical event that has a cause has a sufficient physical cause.
  *   **Motivating Case:** **The Success of Physics.** We have no empirical evidence of physical energy entering or leaving the closed system of the physical world. To posit a mental cause that is not also physical is to posit a violation of conservation laws or a "gap" in physics.
  *   **Status:** **Non-Negotiable (for Physicalists).** (Dualists reject this, but the debate between Kim and Davidson is internal to physicalism.)

  **3. Explanatory Scope (Diachronic and Structural)**
  *   **Requirement:** The theory must explain not just snapshot events, but patterns over time.
  *   **Motivating Cases:**
      *   **Rational Inference:** One belief causing another (e.g., believing it's raining + believing rain makes streets wet $\to$ believing streets are wet).
      *   **Character Traits:** A standing trait (e.g., honesty) explaining a whole pattern of action over years, not just a single movement.
  *   **Status:** **Non-Negotiable.** (A theory that explains a twitch but not a life plan is incomplete.)

  ## II. The Metaphysical Constraints (The "Camp Preferences")
  *These are often treated as non-negotiable by specific authors, but they are actually points of contention that determine which theories survive.*

  **4. Mental Distinctness (Irreducibility)**
  *   **Requirement:** Mental properties/states are not identical to physical properties/states (or at least, not reducible via strict bridge laws).
  *   **Motivating Case:** **Multiple Realizability.** Pain can be realized in humans, octopuses, or aliens with different physical constitutions. Therefore, "pain" cannot be identical to "C-fiber firing."
  *   **Status:** **Camp Preference.** (Reductive physicalists/Type Identity theorists deny this; Non-reductive physicalists affirm it.)

  **5. The Causal Exclusion Principle (No Systematic Overdetermination)**
  *   **Requirement:** An effect cannot have more than one sufficient cause at a given time (unless it is a genuine case of overdetermination, like two assassins shooting at once).
  *   **Motivating Case:** **Causal Competition.** If the physical state $P$ is sufficient for the movement $M^*$, and the mental state $M$ supervenes on $P$, what work is left for $M$ to do? If $M$ also causes $M^*$, $M^*$ is causally overdetermined. Since mental causation isn't like two assassins, this is unacceptable.
  *   **Status:** **Camp Preference.** (Kim treats this as a metaphysical necessity; Difference-making theorists reject it.)

  **6. The Nature of Causal Relata**
  *   **Requirement:** A specification of what the causes and effects *are*.
  *   **Motivating Case:** **Metaphysical Coherence.**
      *   *Option A (Davidson):* **Events.** Particulars dated and located. (Allows token identity).
      *   *Option B (Kim):* **Properties/Exemplifications.** Causation is property instantiation driving further instantiation. (Blocks token identity if properties differ).
  *   **Status:** **Camp Preference.** (Rarely defended explicitly, often assumed.)

  **7. Production vs. Difference-Making**
  *   **Requirement:** A definition of what "causation" means.
  *   **Motivating Case:** **Mechanism vs. Dependence.**
      *   *Production:* Causation requires a transfer of energy or a physical mechanism ("oomph").
      *   *Difference-Making:* Causation requires counterfactual dependence (If $C$ had not occurred, $E$ would not have occurred).
  *   **Status:** **Camp Preference.** (Crucial for the "Proportionality" debate. If causation is just difference-making, the physical cause might be *too specific* to be the true cause of a mental effect.)

  ## III. The Incompatibility Check (The Exclusion Problem)
  *Is there a subset of requirements that is jointly unsatisfiable?*

  **Yes.** For the non-reductive physicalist, the following four requirements form an inconsistent tetrad:
  1.  **Mental Efficacy** (The mental causes the physical).
  2.  **Physical Closure** (The physical causes the physical).
  3.  **Mental Distinctness** (The mental is not the physical).
  4.  **Causal Exclusion** (No effect has two sufficient causes).

  **The Logic:**
  *   By (2), the physical movement has a sufficient physical cause ($P$).
  *   By (3), the mental state ($M$) is distinct from $P$.
  *   By (1), $M$ also causes the movement.
  *   By (4), the movement cannot have two sufficient causes ($P$ and $M$).
  *   **Result:** One must go. Since (2) and (4) are metaphysical/empirical constraints for Kim, and (1) is the datum, (3) is usually the target, or (1) is silently dropped (Epiphenomenalism).

  ## IV. Scorecard: How the Candidates Fare

  | Theory | Mental Efficacy | Physical Closure | Mental Distinctness | Causal Exclusion | **Result** |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Epiphenomenalism** | ❌ (Drops) | ✅ | ✅ | ✅ | Saves physics & distinctness; makes mind inert. |
  | **Type Identity Theory** | ✅ | ✅ | ❌ (Drops) | ✅ | Saves efficacy & physics; mind = brain states. |
  | **Non-Reductive Physicalism** | ✅ | ✅ | ✅ | ❌ (Drops/Challenges) | **The Battleground.** Must deny Exclusion or redefine Causation (Proportionality). |
  | **Substance Dualism** | ✅ | ❌ (Drops) | ✅ | ✅ | Saves mind; violates physics (Closure). |

  *Note on Proportionality:* Theories invoking proportionality (Yablo, List) attempt to save Non-Reductive Physicalism by rejecting the **Causal Exclusion Principle** or redefining **Relata**. They argue the physical cause is *too specific* to be the proportional cause of the effect, leaving room for the mental cause without overdetermination.

  ## V. Classification of Requirements

  *   **Non-Negotiable (The Hard Data):** Mental Efficacy, Physical Causal Closure (for physicalists), Explanatory Scope.
  *   **Camp Preferences (The Theoretical Levers):** Mental Distinctness, Causal Exclusion Principle, Nature of Relata, Production vs. Difference-Making.

  *Crucial Insight:* The "Exclusion Problem" only arises if you treat the **Camp Preferences** (specifically Exclusion and Relata as Properties) as Non-Negotiable. Davidson avoids the problem by treating Relata as Events (allowing token identity). Kim forces the problem by treating Relata as Properties (forcing type identity or epiphenomenalism).

  Verdict: The Causal Exclusion Principle.
