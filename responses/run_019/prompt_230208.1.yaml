prompt: |-
  I'm writting this for a reading group on mental causation, mostly Kim's causal exclusion argument, Davidson's anomalous monism, and the more recent proportionality stuff, and I keep having the feeling that each position is built to satisfy a slightly different job description, so I can't compare them fairly. Before I read any further, I want the full spec.

  Write the desiderata: what any adequate theory of mental causation has to deliver. Include the cases it has to get right (a decision causing a bodily movement, one belief causing another, a standing trait explaining a whole pattern of action over time), the distinctions it can't collapse (especially the difference between a mental state's actually producing an effect and its merely being counterfactually relevant to it), and the constraints it can't contradict (causal closure of the physical, if you take the evidence that way; the datum that mental life isn't systematically epiphenomenal; whatever constraints on causation you want to import from the general metaphysics of causation). For each requirement, give the case or consideration that makes it a requirement. Then mark which requirements are non-negotiable and which are just camp preferences — things like the demand that causation be production rather than mere difference-making, or the assumption that the relata are events and not properties, which people seem to assume but rarely defend. And the part I want to see most: tell me whether some subset of the requirements is jointly unsatisfiable. If the setup basically forces a choice among mental distinctness, physical causal closure, and the causal efficacy of the mental, say so, and say which candidate gives up which. A short scorecard of epiphenomenalism, type identity, and non-reductive physicalism against the list is fine, but keep the weight on the critera. End with a line beginning 'Verdict:' naming the single requirement that does the most work eliminating candidate theories.
