  I did not sign the order or the law,
  Nor stood among the soldiers in the square.
  My hands are clean of what the elders saw,
  And breath I take is not their toxic air.
  So reason says the ledger stays closed tight,
  For guilt demands a deed that I have done.
  I walk away into the harmless light,
  Unbound by wars my fathers lost or won.

  Yet metaphysics draws a finer bound,
  Where mere survival bears a distinct weight.
  Not for the act, but where we all are found,
  Breathing free while others met their fate.
  So I am clear of crime, yet still involved,
  By questions that no verdict has resolved.
