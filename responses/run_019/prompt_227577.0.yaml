answer: |-
  In a small architecture firm, a standing rule requires all final blueprints to be printed on heavy cardstock rather than standard paper. The new managing partner investigates and learns the original reason: the firm's old plotter jammed frequently with thin paper, causing costly delays. She upgrades to a modern printer that handles standard paper flawlessly and, satisfied she understands the original constraint, abolishes the cardstock rule to reduce costs. However, over the decades, the stiffness of the cardstock had inadvertently become a tactile signal for senior architects to distinguish final drafts from work-in-progress sketches during late-night reviews, preventing premature approvals of unstable designs. Removing the rule leads to a costly construction error based on a sketch mistaken for a final plan.

  The standard principle licenses the removal because it focuses on historical intent: once the reformer identifies the original cause (the faulty plotter) and confirms it no longer exists, the justification for the fence is deemed exhausted. The removal is a mistake because the fence has acquired an **unintended emergent function** (the tactile signaling system) that is now essential to safety, despite never being part of the original design. This single feature—accreted utility independent of intent—is what defeats the standard advice.

  A defender of the original principle would likely resist by arguing that the reformer did not *actually* know why the fence was up, claiming that the "reason" a rule exists includes its current systemic role, not just the founder's motive. However, this resistance smuggles the refinement back in under another name: it redefines "why it was put up" (a historical question about intent) to mean "why it remains useful" (a functional question about current consequences), which is precisely the gap the refinement seeks to address.
