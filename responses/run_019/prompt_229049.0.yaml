  ### Calculate Your Score
  *   **Fixed Timeline:** Count your **Fixed** marks.
  *   **Branching Timeline:** Count your **Branching** marks.
  *   **Mutable Timeline:** Count your **Mutable** marks.
  *   **Killjoy:** Count your **Killjoy** marks.

  ### Your Result

  **Mostly Fixed Timeline (The Predestination View)**
  You believe the past is set in stone. Time travel might be possible, but you can't *change* anything. Any attempt to alter history either fails or turns out to be the very thing that caused history to happen that way in the first place. There are no paradoxes because consistency is king.
  *   *Fiction Examples:* *Harry Potter and the Prisoner of Azkaban*, *12 Monkeys*, *Dark*.

  **Mostly Branching Timeline (The Multiverse View)**
  You believe every choice creates a new path. When the traveler changes the past, they don't erase their origin; they spawn a new branch. They can remember the "old" world, but they can never truly go home to it. This avoids paradoxes by allowing contradictory facts to exist in separate realities.
  *   *Fiction Examples:* *Avengers: Endgame*, *Dragon Ball Z*, *Steins;Gate*.

  **Mostly Mutable Timeline (The Dynamic View)**
  You believe the past is fragile and the future is a single, rewriteable line. If you kill your grandfather, you vanish. If you save a life, the future updates. This view allows for high stakes and dramatic irony but requires you to accept that paradoxes (like fading out of existence) are possible.
  *   *Fiction Examples:* *Back to the Future*, *The Butterfly Effect*, *Frequency*.

  **Mostly Killjoy (The Skeptic View)**
  You believe backwards time travel is physically impossible. Conservation of mass, causality, and thermodynamics forbid it. If you are writing fiction, you likely prefer to ground your story in hard science or treat the time travel as a metaphor/dream sequence rather than literal mechanics.
  *   *Fiction Examples:* *Primer* (arguably), *Time After Time* (often hand-waves this), or realistic fiction where the machine breaks.

