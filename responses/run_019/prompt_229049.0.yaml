answer: |-
  # The "What's Your Time Travel Theory?" Quiz

  **Instructions:** Read each scenario below. Choose the **one** answer that best matches what you believe would *actually* happen (or what feels most narratively satisfying/true to you). Don't overthink the physics; go with your gut instinct on how cause and effect should work.

  ### 1. The Grandfather Gun
  Your protagonist points a gun at her grandfather in 1955. She pulls the trigger. What happens?
  *   **A.** The gun jams, she misses, or something stops her. He lives, and history proceeds exactly as recorded.
  *   **B.** He dies. She instantly ceases to exist, or the world around her rewrites itself to reflect that he is dead.
  *   **C.** He dies. She remains alive, but she is now in a version of 1955 where she was never born.

  ### 2. The Family Photo
  She carries a photograph from 2024 showing her entire family. She successfully prevents her parents from meeting. She looks at the photo.
  *   **A.** The photo changes in her hands; her family members fade away until only she is left (or the photo becomes blank).
  *   **B.** The photo stays exactly the same, proving she came from a different timeline than the one she is now in.
  *   **C.** The photo was always different. She realizes her memory of the original photo was wrong; it never showed the people she thought it did.

  ### 3. The Return Ticket
  She finishes her business in 1955 and activates her machine to return to 2024.
  *   **A.** She arrives in 2024, but it is a changed world (e.g., different technology, different people, she is a stranger).
  *   **B.** She arrives in 2024, and everything is exactly as she left it. Her trip to the past was always part of history.
  *   **C.** The machine fails. It is physically impossible to return to a future that hasn't happened yet for the machine.

  ### 4. The Butterfly Effect
  While in 1955, she accidentally steps on a beetle. She does nothing else.
  *   **A.** Nothing changes. History is robust; one beetle doesn't alter the course of human events.
  *   **B.** A new timeline branches off. In her original timeline, the beetle lived. In this one, it died.
  *   **C.** The future shifts. When she returns, the cumulative effect of that small change has altered the present significantly.

  ### 5. Meeting Yourself
  She encounters her own grandmother as a young child. She considers interacting with her.
  *   **A.** She can interact freely. If she harms the child, she harms her own existence.
  *   **B.** She can interact, but she is effectively a ghost or stranger. Her original birth is safe in another timeline.
  *   **C.** Circumstances prevent the meeting entirely. She tries to approach, but something always gets in the way.

  ### 6. The Souvenir
  She brings a modern coin back to 1955 and gives it to her grandfather.
  *   **A.** The coin vanishes from his hand. It cannot exist in a time before it was minted without causing a paradox.
  *   **B.** The coin stays. It is now an artifact that was always part of history (perhaps found in an attic later).
  *   **C.** The coin stays. Now there are two coins in existence: the one in 1955 and the one that would have been minted in 2024.

  ### 7. Memory Retention
  She succeeds in changing the past. She is now living in the new timeline. What does she remember?
  *   **A.** She remembers the original timeline vividly. She is the only one who knows things used to be different.
  *   **B.** Her memories update instantly. She remembers the new timeline as if it were always her life.
  *   **C.** Her memories are consistent with the history she finds. She never remembers a timeline that didn't happen.

  ### 8. The Prophecy
  Before she leaves, a historian tells her, "You cannot change what has already happened."
  *   **A.** The historian is right. Her attempt to change the past is actually what caused the events she knows.
  *   **B.** The historian is wrong. She changes the past, proving there are multiple possible futures.
  *   **C.** The historian is irrelevant. The machine won't work because information cannot travel backwards.

  ### 9. The Loop
  She brings a book of Shakespeare's plays back to 1600 and gives them to Shakespeare. He publishes them.
  *   **A.** This creates a loop with no origin. The plays exist because she brought them, and she brought them because they existed.
  *   **B.** This creates a new branch. In the original timeline, Shakespeare wrote them. In this one, she gave them to him.
  *   **C.** This is impossible. She cannot possess the book in the first place without violating conservation of mass.

  ### 10. The "Why"
  Why does the time machine work (or not)?
  *   **A.** It punches a hole into a parallel universe that resembles the past.
  *   **B.** It rewrites the local reality field, updating the universe to a new state.
  *   **C.** It doesn't. Closed timelike curves violate thermodynamics and causality.

  ***

  # Scoring Key

  Tally your answers based on the table below. Some questions weigh heavier toward specific theories.

  | Question | **Fixed Timeline** (Consistency) | **Branching Timeline** (Multiverse) | **Mutable Timeline** (Dynamic) | **Killjoy** (Impossible) |
  | :--- | :---: | :---: | :---: | :---: |
  | **1** | A | C | B | *(None)* |
  | **2** | C | B | A | *(None)* |
  | **3** | B | *(See Q1)* | A | C |
  | **4** | A | B | C | *(None)* |
  | **5** | C | B | A | *(None)* |
  | **6** | B | C | A | *(None)* |
  | **7** | C | A | B | *(None)* |
  | **8** | A | B | *(See Q1)* | C |
