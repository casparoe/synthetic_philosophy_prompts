  # Analysis & Flags

  ### Incoherent Combinations
  If your results are split evenly between **Fixed** and **Mutable**, your internal logic may be contradictory.
  *   **Why:** These two positions are mutually exclusive. In a Fixed timeline, the future *cannot* be rewritten. In a Mutable timeline, it *must* be. If you believe the gun jams (Fixed) but also that the photo changes (Mutable), you are holding two opposing laws of physics in your head simultaneously.
  *   **Fix:** Decide if the universe protects itself (Fixed) or if the traveler has free will over history (Mutable).

  If you scored high on **Killjoy** but also high on **Mutable/Branching**:
  *   **Why:** This is the "Hypocritical Skeptic." You believe time travel is impossible, but you have strong opinions on how it would work if it were possible.
  *   **Fix:** This is actually fine for a writer! It just means you need to decide if your story is "Hard Sci-Fi" (it doesn't work) or "Speculative Fiction" (assume it works, then apply your preferred rules).

  ### Indistinguishable Positions
  **Fixed Timeline vs. Killjoy:**
  *   **The Blur:** In both views, the protagonist fails to change history. In the Fixed view, the machine works but fate intervenes. In the Killjoy view, the machine shouldn't work at all.
  *   **The Test:** Look at **Question 10** and **Question 3**. If you think the machine *works* but history resists change, you are **Fixed**. If you think the machine *cannot work* due to physics, you are **Killjoy**. The quiz separates these in Q10, but in a narrative, the outcome (nothing changes) looks identical.

  **Branching vs. Mutable (with Memory Retention):**
  *   **The Blur:** If a traveler changes the past, returns to a new future, and *remembers* the old one, this feels like Branching. However, some Mutable stories allow the traveler to retain memories while the rest of the world updates (the "Rip Van Winkle" effect).
  *   **The Test:** Look at **Question 10** and **Question 4**. In **Branching**, the original timeline *still exists* somewhere (a beetle lived in Universe A, died in Universe B). In **Mutable**, the original timeline is *erased/overwritten* (the beetle is retroactively dead). If you believe the original 2024 is gone forever, you are **Mutable**. If you believe it's still out there, just inaccessible, you are **Branching**.

  ### A Note on Your Novel
  For your inheritance dispute plot:
  *   **Fixed:** She tries to stop the meeting, but her attempt *causes* them to meet. (Tragic/Ironic).
  *   **Branching:** She stops them, creates a new timeline where she isn't born, but she remains alive as an anomaly. She wins the inheritance in the new timeline, but loses her family. (Bittersweet).
  *   **Mutable:** She stops them, and she begins to fade away. She has a race against time to fix it before she vanishes. (High Stakes/Thriller).
  *   **Killjoy:** She can't go back. The story must be about accepting the inheritance or finding another way. (Realist Drama).
