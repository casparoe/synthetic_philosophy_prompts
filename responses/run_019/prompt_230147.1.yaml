  One holds what warms him fast behind the door,
  Safe from the shocks that rattle at the pane.
  Another trusts the state and priest and lore,
  Where herd-consent absolves the private pain.
  A third follows where reason leads polite,
  Where thought agrees with what feels most refined;
  All three secure the mind in calm delight,
  And keep the stubborn world far behind.

  But truth is not a taste we choose inside,
  While science bows to something not our own,
  Where belief is habit, nowhere safe to hide,
  And no fixed truth survives what facts have shown.
  It is not doubt that we must cast away,
  But safety bought by keeping test at bay.

  ***

  **Note on Liberties and Readings**

  This sonnet compresses Peirce's 1877 argument into a form that demands concision, which necessitates a few simplifications a careful reader might challenge.

  First, the treatment of **doubt** in the couplet leans slightly toward a Popperian or Deweyan view rather than strict Peircean epistemology. Peirce defines inquiry specifically as the struggle to *settle* doubt and attain a stable belief. The couplet ("It is not doubt that we must cast away") risks implying we should remain in doubt, whereas Peirce argues we should not cast away doubt *via insulation*, but we should still aim to resolve it through inquiry. The poem prioritizes the fallibilist warning over the teleological goal of belief fixation.

  Second, the **convergence thesis** is muted. Peirce believed that while any individual belief is fallible (line 12), the scientific method would eventually converge on a final, immutable opinion ("the truth") in the long run. The poem emphasizes the overturnable nature of claims ("no fixed truth survives") without explicitly acknowledging Peirce's scholastic realist hope that this process converges on a definite reality. A strict reader might argue line 12 undermines Peirce's confidence in the ultimate stability of scientific truth.

  Finally, the **Pragmatic Maxim** is rendered here as "effects publicly shown." Peirce's maxim is more nuanced regarding the *conceivable* practical bearings of a concept, not just observed public effects. The poem shifts slightly toward logical positivism's verificationism to fit the rhyme and meter, whereas Peirce was concerned with the habits of action themselves, not just their public verification.
