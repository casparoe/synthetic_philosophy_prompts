answer: |-
  # Adversarial Collaboration: The Metaphysics of Scientific Classification
  **Participants:** Single-Hierarchy Realist (SHR) | Cross-Cutting Pluralist (CCP)
  **Date:** October 26, 2023
  **Subject:** Precommitment on Evidence and Update Conditions regarding "Carving Nature at the Joints"

  ## 1. Agreed Claims

  We jointly endorse the following substantive claims. We further agree that invoking the arguments listed in items 7 and 8 constitutes a dialectical failure in this context.

  1.  **Ordinary-Language Limitations:** Folk taxonomies (e.g., "weed," "pest," "star") are often pragmatically useful but frequently fail to support robust counterfactual reasoning or novel predictions compared to mature scientific taxonomies. Neither side defends ordinary-language categories as the benchmark for metaphysical reality.
  2.  **Conventional Distinctions:** We distinguish between *purely conventional* classifications (e.g., "things weighing more than 1kg," "administrative districts") and *scientific* classifications. Purely conventional classifications are defined entirely by human stipulation without regard to causal structure; scientific classifications aim to track causal structure, even if we disagree on the structure's topology.
  3.  **Predictive Success:** Mature scientific taxonomies (e.g., the Periodic Table, phylogenetic clades) support successful inductive inferences and interventions that exceed the data used to construct them. This success is not accidental; it indicates a fit between the classification and the world.
  4.  **Mind-Independence Constraint:** A classification scheme cannot be "real" or "objective" if its truth conditions depend entirely on human beliefs or desires. There must be a worldly constraint on which classifications work.
  5.  **Fallibilism:** Current scientific taxonomies are provisional. Both sides agree that today's "joints" may be revised tomorrow. The disagreement concerns the *direction* of that revision (toward unification or toward stable pluralism).
  6.  **Causal Clustering:** Properties cluster in the world non-randomly. Both sides agree that "projectible" kinds rely on these clusters, whether those clusters form a single nested hierarchy or multiple overlapping networks.
  7.  **Off-Limits Move (SHR Constraint):** The Single-Hierarchy Realist agrees not to argue for a unique hierarchy *solely* by asserting that fundamental physics is the only fundamental level. We acknowledge that showing how special-science kinds reduce to or align with physical kinds requires positive argumentation, not mere assertion of physicalist priority.
  8.  **Off-Limits Move (CCP Constraint):** The Cross-Cutting Pluralist agrees not to argue for pluralism *solely* by pointing to current disciplinary fragmentation. We acknowledge that current disunity might reflect temporary ignorance rather than permanent metaphysical pluralism; the argument must be that unification is impossible or undesirable even with perfect information.

  ## 2. Residual Disagreements

  The following table isolates the specific metaphysical and methodological claims where we remain in disagreement. Each column represents a commitment the respective party is willing to defend.

  | Neutral Question | Single-Hierarchy Realist Commitment | Cross-Cutting Pluralist Commitment |
  | :--- | :--- | :--- |
  | **1. Topology of Causal Powers** | Do the causal powers of the universe ultimately form a single, nested structure? | **Yes.** Apparent cross-cuts are artifacts of partial knowledge; a complete theory would reveal one maximally natural hierarchy. | **No.** Causal powers are distributed such that different, non-nested groupings capture objective dependencies equally well. |
  | **2. Status of Cross-Cutting** | If two successful taxonomies cross-cut (e.g., geological vs. ecological regions), is one metaphysically privileged? | **Yes.** One scheme tracks the deeper or more fundamental causal structure; the other is derivative or pragmatic. | **No.** Both can be metaphysically objective relative to different causal contexts; neither is derivative of the other. |
  | **3. Goal of Inquiry** | Is the ideal limit of science a single unified system of classification? | **Yes.** Disciplinary boundaries are heuristic; the telos of science is a unified ontology. | **No.** The telos of science is effective explanation and intervention, which may require maintaining multiple, irreducible ontologies. |
  | **4. Uniqueness of "Real"** | Does the term "real kind" imply uniqueness for a given domain? | **Yes.** If two kinds claim to classify the same entities, they are rivals; only one can be the "real" kind. | **No.** "Real" indicates objective constraint, not uniqueness. Multiple real kinds can classify the same entities under different descriptions. |

  ## 3. Cruxes and Tests

  We identify the following empirical and theoretical developments as cruxes. For each, we specify a concrete test, our prior predictions, and the specific result that would compel us to update our position.

  ### Crux 1: Biological Species Delimitation
  *   **Context:** The "Species Problem" involves cross-cutting criteria: Reproductive Isolation (Biological Species Concept), Phylogenetic History (Phylogenetic Species Concept), and Ecological Niche (Ecological Species Concept).
  *   **Test Case:** Resolution of ring species and asexual taxa in a major clade (e.g., *Drosophila* or bacteria) where these criteria currently conflict.
  *   **SHR Prediction:** Future genomic and ecological data will reveal that one criterion (likely Phylogenetic or Reproductive) is causally dominant, allowing the others to be derived as approximations.
  *   **CCP Prediction:** Different criteria will remain stably optimal for different sub-disciplines (e.g., Phylogenetic for history, Ecological for interaction) without one reducing to the other.
  *   **Update Conditions:**
      *   **SHR updates if:** It is demonstrated that no single criterion can unify the taxonomy without losing predictive power in major sub-fields, and this fragmentation persists despite complete genomic data.
      *   **CCP updates if:** A single criterion emerges that successfully subsumes the predictive utility of the others across evolutionary, ecological, and developmental biology.

  ### Crux 2: Psychiatric and Psychological Kinds
  *   **Context:** Current tension between symptom-based categories (DSM) and mechanism-based categories (RDoC/genetics).
  *   **Test Case:** Longitudinal studies correlating specific neural circuit dysfunctions with clinical symptom clusters over a 10-year horizon.
  *   **SHR Prediction:** Neural circuit definitions will realign symptom clusters into a single, unified hierarchy of mental disorders, dissolving current cross-cuts (e.g., depression and anxiety will merge or split cleanly based on mechanism).
  *   **CCP Prediction:** Neural mechanisms and symptom clusters will cross-cut stably. A neural kind may predict treatment response, while a symptom kind predicts social functioning, with neither eliminating the other.
  *   **Update Conditions:**
      *   **SHR updates if:** Neural classifications fail to replace symptom-based utility for prognosis and social intervention, even with perfect mechanistic knowledge.
      *   **CCP updates if:** Mechanism-based taxonomy renders symptom-based taxonomy obsolete for all clinical and explanatory purposes.

  ### Crux 3: Tight vs. Messy Domains (Chemistry vs. Complex Systems)
  *   **Context:** Chemical elements (Periodic Table) represent a "tight" classification. Does this tightness generalize?
  *   **Test Case:** Comparative analysis of classification stability in low-complexity systems (chemistry/stellar) vs. high-complexity systems (ecosystems/brains).
  *   **SHR Prediction:** The messiness of high-complexity systems is epistemic. As our models improve, complex systems will exhibit periodic-table-like rigidity.
  *   **CCP Prediction:** Tightness is a feature of low-complexity, equilibrium systems. High-complexity systems intrinsically support multiple, non-nested stable classifications due to multiple realizability.
  *   **Update Conditions:**
      *   **SHR updates if:** High-complexity domains stabilize into overlapping frameworks that resist unification despite maximal data.
      *   **CCP updates if:** High-complexity domains converge on a single, rigid hierarchical structure analogous to the Periodic Table.

  ### Crux 4: Inter-Level Reduction in Practice
  *   **Context:** The ability to derive high-level laws from low-level laws without explanatory loss.
  *   **Test Case:** Derivation of macroscopic fluid dynamics or thermodynamic laws from particle physics in turbulent or non-equilibrium conditions.
  *   **SHR Prediction:** In principle, the high-level laws are derivable without remainder; any "loss" is computational, not ontological.
  *   **CCP Prediction:** High-level laws require autonomous vocabulary (e.g., "viscosity," "temperature") that cannot be eliminated without losing explanatory power regarding the system's behavior.
  *   **Update Conditions:**
      *   **SHR updates if:** It is proven that autonomous high-level variables are *necessary* for accurate prediction, not just computationally convenient.
      *   **CCP updates if:** A complete derivation is achieved that preserves all explanatory power without invoking emergent variables.

  ## 4. Dissolved and Surviving Disagreements

  We have tabooed the terms "real," "natural," "joint," and "fundamental," replacing them with their operational definitions (e.g., "supports counterfactuals," "mind-independent constraint," "unified system").

  ### Dissolved Disagreements
  1.  **Objectivity vs. Construction:** We agree that scientific kinds are not *purely* social constructions. The world constrains which classifications work. The disagreement was partly verbal: SHR used "objective" to mean "unique," while CCP used "objective" to mean "constrained." We now agree classifications are *constrained* but disagree on whether constraints force *uniqueness*.
  2.  **Role of Human Interest:** We agree human interests select *which* scientific questions are asked. The disagreement was whether those interests also determine the *structure of the answer*. We clarify that SHR believes interests select the *domain*, but the *hierarchy* is fixed. CCP believes interests help constitute the *boundaries* of the kinds themselves.

  ### Surviving Substantive Disagreements
  After removing verbal ambiguity, two irreducibly substantive disagreements remain:

  1.  **The Metaphysics of Causal Structure:**
      *   **Substance:** Is the causal structure of the universe ultimately **Unified** (SHR) or **Fragmented/Modular** (CCP)?
      *   **Evidence:** This depends on the outcome of Crux 1 and 3. If complex systems resist unified modeling despite perfect data, the CCP view of fragmented causal powers is supported. If they unify, SHR is supported.

  2.  **The Criterion for Theoretical Virtue:**
      *   **Substance:** When two taxonomies conflict, is the virtue of **Unification** (SHR) always superior to the virtue of **Local Explanatory Power** (CCP)?
      *   **Evidence:** This depends on Crux 2 (Psychiatry). If a unified mechanistic taxonomy fails to explain social functioning as well as a fragmented symptom taxonomy, we must decide whether to privilege the unified ontology (SHR) or the explanatory utility (CCP).

  **Signatures:**

  _________________________ (Single-Hierarchy Realist)

  _________________________ (Cross-Cutting Pluralist)
