      *   The character shouldn't be paralyzed by the theorem; he should be *armed* by it. He uses it to filter counterparties.
      *   *The Twist:* The paralysis comes from misapplying a theoretical benchmark to a messy reality. The resolution is realizing the market is full of "noise traders," liquidity seekers, and people with different priors/utility functions.

