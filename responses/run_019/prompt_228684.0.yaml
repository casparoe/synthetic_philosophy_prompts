  ### Discipline Check: Settled vs. Contested

  In providing this analysis, I have adhered to the following distinctions:

  **Settled Science:**
  *   **Base-Rate Anchoring:** It is consensus that starting with an outside view (base rates) corrects for planning fallacy and optimism bias (Kahneman & Tversky).
  *   **Organizational Drift:** It is well-documented in institutional sociology (e.g., the "Iron Law of Oligarchy") that organizations drift from founder intent over generations.
  *   **Inside-View Skepticism:** Treating specific internal details (celebrated chefs, family history) as noise rather than signal is standard best practice in forecasting.

  **Contested Methodology:**
  *   **Reference Class Selection:** There is **no agreed-upon method** for choosing the "correct" class. Your mentor's preference for *Causal Fidelity* over *Statistical Power* (choosing thin historical data over rich contemporary data) is a specific heuristic, not a field consensus. Many quantitative forecasters would argue he is underweighting the N-size of modern foundation data.
  *   **Historical Applicability:** Whether 18th-century entailed estates are valid predictors for 21st-century tax-exempt foundations is debatable. State capacity, law, and finance have changed radically. Your mentor assumes **structural continuity** (human incentives remain the same); a modernist forecaster might assume **structural rupture** (modern laws make perpetuity easier). I have presented his rule as *his* rule, not as objective truth.

  **Underdetermination:**
  While the six verdicts strongly suggest a preference for Class (b) for your foundation, the exact weighting between "Time Horizon" and "Causal Mechanism" is underdetermined. It is possible he uses a hybrid rule: *"Use the broadest class that shares the binding constraint, provided the environment is stable enough to make the data relevant."* In your case, both interpretations converge on pessimism, but in other cases (like the Nuclear Repository), they might diverge.
