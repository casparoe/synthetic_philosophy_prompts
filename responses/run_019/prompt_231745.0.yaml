  3.  **Understand the Hole Argument (Technical Check):**
      *   **Context:** General Relativity (GR).
      *   **Substantivalism:** Spacetime points exist independently of the fields defined on them.
      *   **The Hole:** A region of spacetime where the stress-energy tensor vanishes (vacuum).
      *   **The Setup:** Define a metric field $g$ on a manifold $M$. Outside the hole, everything is determined by initial data. Inside the hole, Einstein's equations are generally covariant.
      *   **The Diffeomorphism:** A smooth map $\phi: M \to M$ that is the identity outside the hole but non-trivial inside.
      *   **The Drag:** Pull back the metric: $g' = \phi^* g$.
      *   **The Conflict:** $(M, g)$ and $(M, g')$ are both solutions to Einstein's equations. They agree outside the hole (boundary fixed). They differ inside the hole *if* you identify points by their labels (substantivalism).
      *   **The Resolution:** They represent the *same* physical reality (observables/invariants agree). If you insist they are different, you lose determinism (future inside hole isn't determined by past). So, reject substantivalism (relationism) or accept indeterminism (most choose relationism/gauge equivalence).
      *   **Key imagery:** Dragging fields over points, points staying fixed vs. fields moving, boundary conditions, indeterminism.

