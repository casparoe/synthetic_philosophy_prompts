answer: |-
  # Job Talk Q&A Prep Sheet: Dispositions & Causal Basis
  **To:** Candidate
  **From:** Coach
  **Re:** Next Month's Talk (Dispositions/Finks/Masks)

  **Strategy Note:** Your audience is not looking for a win in the "Lewis vs. Martin" debate. They are looking for **conceptual clarity** and **metaphysical utility**. The Phil Sci crowd will try to reduce your view to Interventionism; the Modal crowd will check for consistency; the Language crowd will check for semantic plausibility. Your goal is to show your "Causal Basis" view is the *best explanation* of the phenomena, not just a new label.

  ---

  ### Part 1: The Top 8 Objections (Ordered by Damage)

  **1. The Interventionist Redundancy (Phil of Science)**
  *   **The Question:** "You're positing a 'causal basis' to unify finks and masks. But in causal modeling, we handle this via exogenous variables and intervention conditions ($I \to X \to Y$). If I intervene on the glass and it doesn't break because of a safety net (mask) or a wizard (fink), my model just flags the intervention as failed or the path as blocked. What ontological work is 'causal basis' doing that a structural equation model doesn't already do without the modal baggage?"
  *   **The Reply (2 mins):** "That's a great challenge, and I agree interventionism is superior for *prediction*. But my project is metaphysical *explanation*, not predictive modeling. Interventionism tells us *that* the correlation holds or fails under $I$. It treats the 'mask' and the 'fink' as structurally similar breaks in the graph. My claim is they are metaphysically distinct *in the literature* but unified *in reality* by the status of the basis. The 'causal basis' isn't a hidden variable; it's the physical realizer. By focusing on the persistence of the realizer, I explain *why* the interventionist graph looks the way it does. I'm offering the truthmaker for your model's success."
  *   **Soft Spot:** They will press on whether "truthmaker" is just a word for "variable you haven't measured yet." Be ready to admit you aren't offering new empirical predictions.

  **2. The Black Box Basis (Phil of Science / Metaphysics)**
  *   **The Question:** "You say finks and masks both interfere with the 'causal basis.' But you haven't defined what the basis *is*. If it's categorical, you're a reductionist. If it's dispositional, you're circular. If it's unknown, it's a placeholder. Which is it? Because if it's the latter, your unified analysis is just saying 'something stops it from happening,' which is trivial."
  *   **The Reply:** "It's not a placeholder. I'm neutral on the categorical/dispositional debate. The 'basis' is whatever microphysical or structural property grounds the manifestation. Whether that property is itself dispositional is a separate debate. My point is functional: in both fink and mask cases, the *link* between that grounding property and the manifestation is severed. I don't need to solve the nature of properties to show that the *mechanism of failure* is the same in both cases."
  *   **Soft Spot:** If they push on Dispositional Essentialism (Bird), you can't be fully neutral. If properties *are* dispositions, "interference with the basis" might mean "interference with the disposition itself," which muddies your distinction.

  **3. Semantics of Ascription (Phil of Language)**
  *   **The Question:** "When we say 'This glass is fragile,' are you claiming we are implicitly referring to its causal basis? Because ordinary speakers don't know the basis. If your analysis changes the truth conditions of 'fragile' so that a masked glass isn't fragile, you're revisionary. If you say it is still fragile, how do you cash that out without the counterfactual?"
  *   **The Reply:** "I'm not revising the truth conditions of ordinary ascriptions; I'm analyzing the *metaphysical ground* of those truths. Ordinary speakers can correctly call a masked glass 'fragile' because the basis is present. They can correctly call a finked glass 'non-fragile' (or fragile-with-caveats) because the basis is removed. My account explains why our intuitions diverge in these cases without relying on a simplistic conditional analysis that we know fails."
  *   **Soft Spot:** The "Intrinsic Fink" case. If the object loses fragility *upon being struck* due to its own structure, is it fragile *before* being struck? Your view says "No basis = No disposition." Ordinary intuition might say "Yes, it was fragile until it broke."

  **4. The Intrinsic Fink Trap (Modal Metaphysician)**
  *   **The Question:** "You argue intrinsic finks kill conditional analysis. But on your view, if an object's own structure removes the basis upon stimulus, does it have the disposition prior to stimulus? If yes, how, without the basis? If no, isn't that counterintuitive? It seems you've just moved the problem from the counterfactual to the basis."
  *   **The Reply:** "This is exactly why conditional analysis is dead. On my view: if the structure guarantees the basis vanishes at $t_1$ (stimulus), then at $t_0$, the object lacks the stable causal basis required for the disposition. It's not that it has the disposition and loses it; it's that it never had the *stable* basis to begin with. It's a 'fragile-looking' object, not a fragile one. This matches the scientific practice of distinguishing stable traits from transient states."
  *   **Soft Spot:** This sounds like you're defining away the intuition that the object *was* fragile. Be prepared to bite the bullet: "Intuitions about intrinsic finks are unreliable."

  **5. Circularity / Triviality (General)**
  *   **The Question:** "Isn't this trivial? You say a disposition exists if the causal basis exists and isn't interfered with. But we identify the basis *by* the manifestation. So you're saying 'It breaks if it has the property that makes it break, unless something stops it.' That's not an analysis; it's a tautology."
  *   **The Reply:** "It would be trivial if 'causal basis' just meant 'whatever causes breaking.' But science identifies bases independently—molecular bonds, crystal structures. We can know the basis exists without knowing if it will manifest (due to masks/finks). My analysis isn't defining the word 'fragile'; it's mapping the dependency relation between structure and behavior. That's a substantive claim about the world, not language."
  *   **Soft Spot:** If the basis is *only* identifiable via the manifestation in your specific paper, this reply fails. Ensure you have an example where basis is identified independently (e.g., chemical composition).

  **6. Explanatory Value (Department Chair / Phil Sci)**
  *   **The Question:** "Okay, suppose you're right. Finks and masks are the same mechanism. What does this *buy* us? Does it change how we do science? Does it solve a puzzle in causation? Or is this just a taxonomic reshuffling for metaphysicians?"
  *   **The Reply:** "It buys us conceptual hygiene in scientific modeling. When a model fails, scientists ask: 'Was the mechanism absent (fink) or blocked (mask)?' My view says: 'Check the basis.' It unifies troubleshooting. Metaphysically, it clears the debris of the last 30 years of disposition literature, allowing us to stop treating finks and masks as distinct logical problems and start treating them as causal ones."
  *   **Soft Spot:** If they feel the "troubleshooting" advice is vague, you look impractical.

  **7. Probabilistic Dispositions (Phil of Science)**
  *   **The Question:** "Your analysis seems to assume deterministic bases. But many dispositions are probabilistic (e.g., radioactive decay). A 'mask' might just lower the probability. Does your 'interference with basis' account handle cases where the basis remains but the probability shifts, without calling it a mask?"
  *   **The Reply:** "Yes, the account generalizes. The 'causal basis' for a probabilistic disposition is a probability distribution grounded in physical structure. Interference changes that distribution. If the distribution shifts to zero, it's a fink/mask. If it shifts slightly, it's a partial mask. The unified mechanism is still 'modification of the grounding structure's output,' not a failure of a conditional."
  *   **Soft Spot:** If you haven't written about probability in the paper, this is speculative. Stick to: "The principle holds, the math is for future work."

  **8. Context Sensitivity (Phil of Language)**
  *   **The Question:** "Doesn't your view make dispositions wildly context-sensitive? If a mask is present, is the object fragile? It depends on whether we count the mask as part of the 'situation.' Aren't you just pushing the context-sensitivity of counterfactuals into the definition of 'basis'?"
  *   **The Reply:** "I'm pushing it into the *metaphysics*, not the semantics. The basis is intrinsic (or relatively intrinsic). The mask is extrinsic. Whether the object *has* the disposition is context-invariant (it has the basis or it doesn't). Whether it *manifests* is context-sensitive. This preserves the intuition that dispositions are properties of objects, not relations to environments."
  *   **Soft Spot:** Intrinsic vs. Extrinsic is contested. Phil Sci might argue the "basis" includes the environment (extended cognition style).

  ---

  ### Part 2: Concessions to Make Upfront
  *Disarm the two most damaging objections (1 & 2) during the talk.*

  1.  **Concede to the Interventionists:** "Now, I know many of you work with causal models. I am not suggesting my 'causal basis' talk replaces structural equations. Interventionism is the right tool for prediction and testing. I am offering the metaphysical underpinning for *why* those interventions track what they track."
  2.  **Concede on the Basis:** "I will not be defending a specific theory of properties (categorical vs. dispositional) today. My argument works on either view. I am treating 'causal basis' as a functional slot: whatever plays the role of grounding the manifestation."

  ---

  ### Part 3: The "Killer Objection" (Hope Nobody Asks)
  **The Objection:** **Fundamental Dispositions.**
  *   **The Question:** "What about fundamental dispositions (e.g., charge)? If there is no underlying causal basis for charge—it just *is* a disposition—then your unified analysis collapses. There is no 'basis' to interfere with, only the disposition itself. Does your view imply there are no fundamental dispositions?"
  *   **Why it hurts:** Your thesis relies on "interference with a causal basis." If some dispositions *are* basic and lack a basis, your unified mechanism doesn't cover them.
  *   **Holding Response:** "That's a crucial limit case. If there are fundamental dispositions without bases, my account applies to all *composite* or *grounded* dispositions, which covers the vast majority of scientific cases (fragility, solubility, toxicity). For fundamental cases, the fink/mask distinction likely dissolves anyway because there's no structure to interfere with. So, my account is a theory of *grounded* dispositions, which is where the fink/mask literature actually lives."
  *   **Redirect:** "But since most job-relevant science (chemistry, biology, engineering) deals with grounded dispositions, this limit case doesn't affect the utility of the unified analysis for the cases that generate the paradoxes."

  ---

  ### Part 4: Terminology Traps (Non-Specialist Misunderstandings)
  *Watch your language. These terms mean something different to this audience than to a dispositions specialist.*

  1.  **"Causal Basis":**
      *   *Specialist sense:* The categorical ground of a disposition.
      *   *Audience sense (Phil Sci):* A confounding variable or a hidden node in a DAG.
      *   *Fix:* Explicitly say "I mean the physical realizer, not a statistical confound."
  2.  **"Conditional Analysis":**
      *   *Specialist sense:* The Simple Conditional Analysis (SCA) of dispositions (Lewis/Martin).
      *   *Audience sense (Phil Lang):* The semantics of indicative conditionals.
      *   *Fix:* Clarify "I am talking about the metaphysical analysis of properties, not the logic of 'if-then' statements."
  3.  **"Fink":**
      *   *Specialist sense:* A specific metaphysical counterexample (Martin's electro-fink).
      *   *Audience sense:* A person (Fink the noun) or a specific agent.
      *   *Fix:* Use "Finkish cases" or "Dispositional removal cases" occasionally to remind them it's a structural phenomenon, not necessarily a wizard.
  4.  **"Intrinsic":**
      *   *Specialist sense:* Non-relational property.
      *   *Audience sense (Phil Sci):* Internal to the system boundary (which is arbitrary).
      *   *Fix:* Acknowledge system boundaries. "Intrinsic relative to the model's boundary."

  ---

  **Final Coach's Advice:**
  You are not there to win the "Dispositions War." You are there to show you can handle a mixed room with intellectual grace. When the Phil Sci person attacks your metaphysics, don't defend the metaphysics *against* the science; defend the metaphysics *as the foundation of* the science. When the Metaphysician attacks your examples, don't get bogged down in the example; zoom out to the principle.

  **Good luck. You know the lit. They know the room. Bridge the gap.**
