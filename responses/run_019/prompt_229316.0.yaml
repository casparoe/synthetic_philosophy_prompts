answer: |-
  The ethical problem of biographical fiction is often reduced to a matter of accuracy: did the event happen? If not, is the author lying? But Peter Shaffer's *Amadeus* (both the 1979 play and the 1984 Miloš Forman film) refuses this binary. It does not merely take liberties with the record; it constructs a cathedral of lies upon the grave of Antonio Salieri to house the spirit of Wolfgang Amadeus Mozart. By framing the narrative as the confession of a dying, fictionalized Salieri who claims responsibility for Mozart's ruin, Shaffer creates a meta-ethical trap. The work asks whether the dead possess a right to their own memory, and whether the cultural need for myth justifies the sacrificial slaughter of historical reputation.

  To read *Amadeus* through the ethics of biographical fiction is to confront the question: Does the confession-frame absolve the author, or does it merely launder the slander? Salieri begins the film by attempting suicide and addressing the "spirits of the future," explicitly acknowledging that he is about to tell a story that may not be factually true but is psychologically "honest." He admits to being a "patron saint of mediocrities." On the surface, this functions as a disclaimer. It tells the audience: *This is a subjective memory, not a documentary.* However, philosophically, this frame does not mitigate the harm; it compounds it. By giving the slander a voice, Shaffer grants the lie the authority of testimony. A third-person narrator's fabrication is fiction; a first-person confession carries the weight of truth, even when it claims to be a lie. The frame does not protect Salieri; it implicates the audience. We are not passive observers of a falsehood; we are the confessors' absolution. We listen to him condemn himself for murdering Mozart, and in our silence, we accept the verdict. The frame is not a shield against ethical critique; it is the mechanism by which the critique is bypassed through emotional manipulation.

  This leads to the core philosophical inquiry: Can a dead person be wronged by fiction? If harm requires the experience of pain, Salieri (d. 1825) cannot be harmed. But if we accept a theory of "posthumous interests" or "narrative identity," the wrong becomes clear. Human beings exist in the minds of the living after death through their reputation and legacy. This "social self" is the only immortality available to them. To colonize that self with a false narrative is to disrupt their continued existence in the cultural consciousness. For over two centuries, Salieri was remembered as a respected teacher and composer. After *Amadeus*, he is universally recognized as a jealous mediocrity who poisoned a genius. This is a specific kind of wrong: it is a theft of standing.

  Does it matter that the fiction blackens one to exalt the other? Ethically, the asymmetry is crucial. If Shaffer had fictionalized Salieri as a secret benefactor who saved Mozart from poverty, the historical Salieri might object to the inaccuracy, but the moral intuition would be lighter. Flattery is rarely litigated as harm. But *Amadeus* operates on a zero-sum economy of glory. Mozart's divinity in the play is contingent upon Salieri's villainy. The drama requires a foil. By making Salieri the agent of Mozart's destruction (commissioning the Requiem as a death warrant, hastening the burial), Shaffer makes Salieri's moral corruption the engine of Mozart's martyrdom. This is not just using a name; it is using a soul as fuel. The work suggests that for a god to be born in the public imagination, a man must be murdered in the public memory.

  There are moments where *Amadeus* seems acutely aware of this moral exposure, and moments where it hides from it. The work's greatest moment of self-awareness is its conclusion. In the film, the aged Salieri is wheeled through the asylum, blessing the "mediocrities" of the world. He admits, "I speak for them." Here, Shaffer acknowledges that this Salieri is no longer a person but a symbol. He has surrendered his historical particularity to become an archetype. This is a philosophical concession: the work admits it has consumed the man to create the myth. Similarly, the scene where Mozart's body is dumped into a pauper's grave while Salieri watches in the rain highlights the anonymity of actual death versus the immortality of the story. It acknowledges that the truth (a lonely, unmarked grave) is less potent than the lie (a murder mystery).

  However, the work hides from its ethical responsibility through its aesthetic realism. The film, in particular, uses meticulous period detail—costumes, lighting, architecture—to ground the fabrication in a tangible reality. Furthermore, it uses the actual music of Mozart and Salieri. The historical accuracy of the *audio* validates the historical inaccuracy of the *plot*. When we hear the authentic *Requiem*, we are more inclined to believe the authentic-looking story surrounding it. This is the deception: the use of truth (the music) to smuggle in falsehood (the murder). The work hides behind the beauty of the art to distract from the violence done to the biography. It relies on the audience's willingness to trade historical justice for aesthetic pleasure.

  So, what does *Amadeus* add to the abstract philosophical debate about posthumous harm and biographical fiction? An abstract essay might argue that the dead have a right to truth, or conversely, that the dead have no rights at all. *Amadeus* moves the debate beyond rights into the realm of *necessity* and *violence*. It demonstrates that cultural memory is not a passive archive but an active, often violent, construction site. The play suggests that "immortality" is not something the dead possess, but something the living inflict upon them.

  Specifically, *Amadeus* contributes the insight that the harm of biographical fiction is not merely reputational, but ontological. It changes *what* the dead are in the present. By turning Salieri into a villain, Shaffer did not just tarnish a reputation; he altered Salieri's function in human culture. He turned him from a composer into a cautionary tale. The work argues that we do not owe the dead the truth; we owe them nothing. We owe only our own need for meaning. But it simultaneously forces us to witness the cost of that transaction. The confession frame is not an apology; it is a monument to the crime.

  Ultimately, *Amadeus* posits that biographical fiction is an act of necromancy. We summon the dead to speak our lines. When we make them speak lies, we are not harming them in a way they can feel, but we are corrupting the channel through which they reach us. The specific contribution of Shaffer's work is the realization that the "wrong" done to the dead is actually a wrong done to the living. By accepting the fictional Salieri, we impoverish our understanding of history, complexity, and envy. We lose the real Salieri to gain a better story. *Amadeus* forces the audience to ask if the beauty of the opera is worth the price of the man's soul. In the end, the work answers "yes," but it makes us listen to Salieri's scream while we applaud.
