      *   *Underdetermination:* Both a "Privacy as Property" theorist and a "Privacy as Contract" theorist might accept the click, but for different reasons. Also, a Utilitarian might accept it if the aggregate benefit of data collection outweighs individual privacy loss (though W&B would reject this calculus).
