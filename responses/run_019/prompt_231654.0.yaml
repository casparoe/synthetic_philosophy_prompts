      *   *Case 8 (Climate Assembly):* User supports sortition but opposes binding power. This is a "safety valve." If the user supported *binding* sortition, the principle breaks (conflicts with 4).
      *   *Most Altering Verdict:* Case 4 (Monetary Policy). If the user decided Sortition *could* work for Central Banks (with advisors), the "Technical = Career" pillar collapses. Or Case 1 (Comptroller). If the user decided Comptrollers *should* be limited to prevent capture, the "Technical = Career" pillar weakens significantly.
      *   *Actually, Case 2 (Sheriff)* is the one the friend almost moved the user on. This suggests it's the pivot point between "Coercion needs rotation" and "Complexity needs career."

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  The Derived Principle (The "Functional Alignment Principle").
          2.  Mapping Clauses to Cases.
