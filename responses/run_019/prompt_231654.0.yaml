answer: |-
  Based on your eight verdicts, I have derived a framework I call **The Functional Integrity Principle**. Your judgments are not driven by a single rule (like "all elected offices should have limits") but by a diagnostic assessment of what threatens the *integrity* of a specific function.

  Here is the principle, its application to your cases, the prediction for the school board, and an analysis of where your own reasoning is most fragile.

  ### The Functional Integrity Principle

  To determine the appropriate selection and tenure mechanism for an office, identify the **Primary Function** and the **Dominant Risk** to that function.

  **Clause 1: The Continuity Requirement (Technical/Standing)**
  If the office is a **standing role** where effectiveness depends on **specialized institutional memory, technical mastery, or market credibility**, prefer career professionals or long tenure. Term limits or sortition are harmful if they transfer power to unelected staff or degrade credibility.
  *   **Motivating Cases:**
      *   **Case 1 (Comptroller):** Technical audit function; limits empower permanent staff.
      *   **Case 4 (Monetary Policy):** High technical/market credibility; sortition is reckless.
      *   **Case 5 (Budget Committee):** Requires mastery of details to check the executive.

  **Clause 2: The Disruption Requirement (Coercive/Relational)**
  If the office is a **standing role** where effectiveness depends on **checking entrenched power, exercising coercion, or policing peers**, prefer term limits or mandatory rotation. Continuity is harmful if it enables personal machines, clubby behavior, or abuse of force.
  *   **Motivating Cases:**
      *   **Case 2 (Sheriff):** Coercive power; long tenure builds personal machines.
      *   **Case 6 (Ethics Committee):** Policing peers; long tenure makes oversight "clubby."

  **Clause 3: The Independence Requirement (Constitutive/Advisory)**
  If the task is **one-off or advisory**, and the primary risk is **self-dealing by entrenched elites**, prefer sortition. Technical complexity can be mitigated by expert support, provided the body lacks binding executive power.
  *   **Motivating Cases:**
      *   **Case 3 (Redistricting):** One-off map drawing; risk of legislative self-dealing.
      *   **Case 8 (Climate Assembly):** One-off public judgment; advisory only (binding power would trigger Clause 1 or 2).

  **Clause 4: The Subsidiarity Exception (Low-Stakes/High Turnover)**
  If the office has **low stakes and naturally high turnover**, formal constraints are unnecessary burdens.
  *   **Motivating Cases:**
      *   **Case 7 (Neighborhood Council):** Turnover is already high; limits cost local knowledge for little gain.

  ***

  ### Application: The Elected School Board (Three-Term Limit)

  **Analysis:**
  1.  **Function:** The board sets policy, approves budgets, and hires/fires a superintendent. It is a **standing role** (not one-off).
  2.  **Risks:**
      *   *Technical/Continuity:* Like the **Budget Committee (Case 5)**, the board needs to understand long-term capital plans, bond measures, and curriculum implementation. Disruption here can lead to administrative instability.
      *   *Capture/Coercion:* Like the **Sheriff (Case 2)** or **Ethics Committee (Case 6)**, boards risk capture by teachers' unions, developers, or the administration itself. However, the board's power is generally less coercive than a Sheriff's and less relational/peer-based than an Ethics committee.
  3.  **Mapping:** The School Board aligns most closely with the **Budget Committee (Case 5)**. It is an oversight body that requires enough continuity to master complex budgetary and policy details to effectively manage the administration. While capture is a risk, your verdicts suggest you prefer to solve capture via rotation only when the power is coercive (Sheriff) or relational (Ethics). For administrative oversight, you prefer continuity (Comptroller, Budget).

  **Prediction:**
  **Oppose the three-term limit.**
  The principle predicts you would view the limit as undermining the board's ability to master complex district issues and hold the administration accountable, similar to your reasoning for the Budget Committee and Comptroller. You would likely argue that elections provide sufficient accountability without sacrificing institutional memory.

  ***

  ### Fragility Analysis: Where Your Judgment is Inconsistent

  You asked for honesty about which verdicts this principle cannot save without ad hoc amendments. There is a significant tension in your "Oversight" cases.

  **The Tension: Case 1 (Comptroller) vs. Case 6 (Ethics Committee)**
  Both are legislative-adjacent oversight roles.
  *   In **Case 1**, you argue continuity prevents capture by *staff*.
  *   In **Case 6**, you argue rotation prevents capture by *peers*.
  *   **The Problem:** The principle distinguishes these by labeling Comptroller work "technical" and Ethics work "relational." However, modern financial oversight (Comptroller) is deeply political, and ethics investigations (Ethics) require technical legal knowledge.
  *   **The Verdict to Reconsider:** **Case 1 (Comptroller).** This is the most fragile verdict. If you admit that a long-serving Comptroller can become captured by the Mayor or the bureaucracy they are supposed to audit (a common real-world failure), your support for career status collapses. If you move Case 1 to "Support Limits," the distinction between Clause 1 and Clause 2 blurs significantly, forcing a rewrite of the principle to prioritize *all* oversight roles for rotation.

  **The Low-Confidence Outlier:** **Case 7 (Neighborhood Council).**
  You explicitly noted low confidence here. The principle saves it via Clause 4 (Subsidiarity), but this is a "catch-all" clause. If you decided that neighborhood councils *should* have limits to ensure broader participation, it would not break the core theory, but it would remove the safety valve for low-stakes roles.

  ***

  ### Sensitivity Analysis: What Would Change the Principle?

  If you changed your mind on one verdict, which would most alter the principle I proposed?

  **The Pivot: Case 4 (Monetary Policy Board)**
  This is the anchor of **Clause 1 (Continuity/Technical)**.
  *   **Current View:** Sortition is "reckless" due to technical competence and market credibility.
  *   **If Changed:** If you decided that a sortition-based board (with expert staff) *could* work for monetary policy, the barrier between "Technical" and "Political" roles dissolves. It would suggest that *no* role is too technical for sortition, provided experts are available (as in Case 3 and 8).
  *   **Impact:** This would collapse Clause 1 into Clause 3. The principle would shift from "Functional Integrity" to "Universal Sortition with Expert Support," fundamentally changing how you view the Sheriff and Budget Committee as well.

  **The Runner-Up: Case 2 (Sheriff)**
  Your friend nearly moved you on this. If you decided that operational complexity trumps coercion risks (i.e., we need a professional Sheriff more than a rotated one), then **Clause 2 (Disruption)** weakens. You would then need a new metric for when "Coercion" outweighs "Competence."

  ***

  ### Where My Reasoning Might Fail

  As an AI analyzing your introspection, I must highlight two potential failure points in this derivation:

  1.  **Overfitting the "One-Off" Distinction:** I have relied heavily on the distinction between standing bodies (Sheriff, Legislature) and one-off bodies (Climate, Redistricting) to justify sortition. However, you support sortition for Climate (Case 8) but oppose it for Monetary Policy (Case 4), even though both are technically dense. My principle explains this via "binding power," but if you support a *binding* sortition assembly in the future, my derivation fails. The true divider might not be "binding vs. advisory" but "distribution of resources vs. allocation of values," which I cannot detect from eight cases.
  2.  **The "Staff Capture" Assumption:** In Case 1 (Comptroller), you argue limits transfer power to permanent staff. In Case 5 (Budget Committee), you argue career legislators push back against the executive. These are slightly contradictory views on bureaucracy. In one case, staff are the captors; in the other, career politicians are the defenders against the executive. If your view on bureaucratic neutrality shifts, the entire "Continuity Requirement" (Clause 1) becomes unstable.

  **Recommendation:** To test your own principles, focus on **Case 1 (Comptroller)**. Ask yourself: *Is the risk of a Comptroller becoming a political operative greater than the risk of them losing technical knowledge?* Your answer there will determine whether "Technical Mastery" or "Political Independence" is your true north star.
