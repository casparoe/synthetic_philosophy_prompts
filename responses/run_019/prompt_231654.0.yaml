          4.  **Subsidiarity/Scale Clause:** If the stakes are low and natural turnover is high, formal limits are unnecessary burdens. (Motivated by 7).

      *   *Testing against Friend's Critique:*
          *   Climate Assembly (8): Technically dense, but fits Constitutive Clause (one-off, expertise supplementable).
          *   Sheriff (2): Operationally complex, but fits Disruption Clause (coercion/machines trump complexity).
          *   This seems to hold.

  5.  **Applying to New Case (School Board, 3-term limit):**
