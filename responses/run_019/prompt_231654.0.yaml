      *   *Refining the Principle Name:* "The Competence-Capture Tradeoff Principle" or "The Functional Integrity Principle." Let's go with **The Functional Integrity Principle**. It focuses on what function the mechanism serves.

      *   *Refining the School Board Prediction:* School boards are tricky. They are policy-making (like legislature) but oversight (like budget committee). User supports career for Budget Committee (5). So prediction should be Oppose Limits.

