      *Section 5:*
      Fiction achieves what philosophical argument cannot: it makes the loss of categories felt rather than understood. A treatise on social construction explains the theory; *The Left Hand of Darkness* induces the vertigo. Through Genly's narration, the reader experiences the cognitive dissonance of lacking gendered data. We feel the insecurity, the misreadings, the loneliness. Argument appeals to reason; fiction appeals to habit. By disrupting the reader's habitual categorization of characters, Le Guin exposes the dependency of our social cognition on binary sex.
