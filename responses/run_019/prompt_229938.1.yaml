      *Section 2:*
      Gethen dramatizes the removal of gendered scaffolding to reveal its structural necessity on Earth. Without fixed sex, institutions like war, marriage, and inheritance mutate fundamentally. Le Guin shows that gender is not merely identity but a heuristic for power and predictability. When Genly meets Estraven, he cannot parse loyalty or threat because his cognitive heuristics rely on sexual dimorphism. The novel dramatizes gender as made through the consistent failure of Genly's predictions. He expects masculine aggression or feminine nurturing; he receives neither consistently, forcing him to confront the arbitrariness of his expectations. The social kind "man" loses its salience. In Karhide, politics is driven by shifting alliances and honor, not patriarchal lineage. The absence of rape as a systemic tool of domination highlights how sexual violence is institutional, not instinctual.
      Furthermore, the text shows social kinds being actively built in real-time. During the Gobrin Ice journey, Genly and Estraven must construct a new relational kind—neither brothers nor lovers nor husband/wife, but something unnamed. This dramatizes the labor required to maintain categories. On Earth, the category "woman" carries pre-loaded social data; on Gethen, every interaction requires fresh negotiation. The hierarchy Genly expects is revealed as a local custom, not a universal law. By making the reader suffer Genly's disorientation, Le Guin argues that our sense of social reality is prosthetic. We lean on gender to navigate the world; without it, the world becomes legible only through intense, deliberate attention to individual character. Gender is revealed as a discarded technology of coordination. Genly is tired because maintaining his false categories requires constant cognitive labor against the evidence of his senses. This exhaustion makes the construction visible. The text forces the reader to inhabit this fatigue. Genly's confusion is the proof. The friction is the argument.
