      Biology complicates constructionism by providing the material constraints within which construction occurs. Gethenians are not genderless voids; they possess a biological cycle that mandates periodic sexual differentiation. This potentiality is real, even if the actualization is social. A strict constructionist might argue sex itself is constructed, but Le Guin grants the biology ontological weight. The kemmer cycle creates a rhythm of life that structures time, labor, and risk. You cannot construct away the vulnerability of somer or the drive of kemmer.
      This nuances the "hierarchy mistaken for nature" theme. On Gethen, biology is not a hierarchy but a cycle. However, the *interpretation* of that biology could become hierarchical. The novel suggests that while biology sets the stage, it does not write the script. Yet, the sheer physical reality of the cycle limits the scope of social construction. It reminds the novelist that material conditions matter. You cannot construct a kind that completely ignores physical reality. The tension lies between the fixed biological mechanism and the fluid social response. Gethen shows that even when biology is fluid, society seeks stability. The complication is that constructionism cannot be total; it must negotiate with the flesh. Material conditions constrain the social imagination. If biology were entirely malleable, the drama would vanish. The kemmer cycle ensures that the "nature" Genly seeks is partially there, just intermittent. This prevents the novel from becoming pure idealism. It grounds the social construction in a material reality that demands accommodation, not just denial.
