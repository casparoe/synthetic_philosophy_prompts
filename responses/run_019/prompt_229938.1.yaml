      Despite its ambitions, the novel resists a pure constructionist reading by smuggling essentialism back through narration and characterization. Genly uses male pronouns exclusively, linguistically reinstating the binary the plot seeks to dismantle. This is not just character bias; it is textual complicity. Le Guin admitted later that she failed to imagine a society truly free of gendered behavior. Estraven is frequently described with coded feminine traits—nurturing, intuitive, political via kinship—while other characters display masculine aggression. The text often collapses into a binary where Estraven is the "woman" to Genly's "man," especially during their intimate bond on the ice. This undermines the argument that gender is constructed by suggesting that psychological dimorphism persists regardless of biology.
      Moreover, the hierarchy of the Ekumen itself relies on fixed kinds. Genly represents progress; Gethen represents stagnation. This colonial framing reinstates a hierarchy of development that mirrors gendered hierarchies of rationality versus emotion. The novel wants to argue that gender is optional, but it cannot imagine a psyche unmarked by Earth's dualism. When Genly finally accepts Estraven, it is framed as accepting the "woman" within him, reinforcing the idea that vulnerability is inherently feminine. Thus, the text betrays its own thesis: it critiques the naturalness of kinds while relying on the reader's essentialist intuitions to make the characters legible. The construction is revealed as incomplete; the author herself could not fully escape the gravity of the categories she sought to deconstruct. The depiction of kemmer houses often defaults to heteronormative dynamics when sex emerges, suggesting that once biology activates, social construction collapses into instinct. This ambiguity protects the reader from the full horror of a truly alien psychology, but it blunts the critical edge. The resistance is not just in the text, but in the contract between author and reader; we demand recognizable humans, forcing the novel to retreat from its own radical premise.
