      *Drafting Section 3 (Where the novel resists):*
      Despite its ambitions, the novel resists a pure constructionist reading by smuggling essentialism back through narration and characterization. Genly uses male pronouns exclusively, linguistically reinstating the binary the plot seeks to dismantle. This is not just character bias; it is textual complicity. Le Guin admitted later that she failed to imagine a society truly free of gendered behavior. Estraven is frequently described with coded feminine traits—nurturing, intuitive, political via kinship—while other characters display masculine aggression. The text often collapses into a binary where Estraven is the "woman" to Genly's "man," especially during their intimate bond on the ice. This undermines the argument that gender is constructed by suggesting that psychological dimorphism persists regardless of biology.
