          *   *Goal:* Define social construction of kinds in relation to LHoD.
          *   *Key concepts:* Ian Hacking, Sally Haslanger, categories as institutional/practical rather than essential.
          *   *Application:* Genly Ai represents essentialism; Gethen represents the construction (or lack thereof).
          *   *Drafting thought:* Need to be concise. Focus on the tension between "found" and "made."
          *   *Word count check:* Aim for ~150.

      *   **Section 2: What Gethen dramatizes (300 words)**
          *   *Goal:* Show where the book supports the constructionist view.
          *   *Key examples:* Pronouns (he/man used generically but challenged), social roles (no war, no rape as we know it), the failure of Genly's expectations.
          *   *Argument:* The absence of fixed gender changes social structures (politics, intimacy). It shows gender is performative/contextual (kemmer).
          *   *Drafting thought:* Focus on how institutions on Gethen don't rely on binary sex. The "nature" Genly expects isn't there.
          *   *Word count check:* Aim for ~300.

      *   **Section 3: Where the novel resists the reading (300 words)**
          *   *Goal:* Critique the book. Where does it fail its own premise?
          *   *Key examples:* Genly's narration (uses "he"), Estraven's characterization (maternal traits), the "feminine" vs. "masculine" traits still leaking in. Le Guin's own admission of limitations.
          *   *Argument:* The text smuggles essentialism back in through language and behavioral coding. Genly's bias isn't just character flaw; it's textual structure.
          *   *Drafting thought:* This is crucial for a "philosophically serious" reading. Don't just praise it. Acknowledge the failure to fully escape Earth norms.
          *   *Word count check:* Aim for ~300.

      *   **Section 4: What the biology complicates (200 words)**
          *   *Goal:* Address the material reality vs. social construction.
          *   *Key concepts:* Kemmer is biological. It's not *purely* social. There is a cycle.
          *   *Argument:* Constructionism isn't denial of biology, but biology here dictates the *possibility* of construction. The potentiality is biological; the actualization is social.
