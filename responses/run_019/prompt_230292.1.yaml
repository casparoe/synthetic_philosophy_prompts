prompt: |-
  Compare clientelism and gift-giving as frameworks for understanding transfers of resources, favours, and votes between office-holders and citizens. What does each framework presuppose about reciprocity, obligation, and the separation between public office and personal relationship, and what difference does it make whether a given transfer is classified as a gift, a bribe, or a clientelist exchange? Then evaluate the charge that the standard Western corruption framework universalises the categories of a rule-governed bureaucratic state and thereby converts context-bound social practices — gift relations that secure access, vote-buying that tracks communal norms, patronage that provides an informal social safety net — into moral failures. Is a principled distinction between universal corruption and legitimate local practice available, and if so, where does it lie? Please answer in British English.
