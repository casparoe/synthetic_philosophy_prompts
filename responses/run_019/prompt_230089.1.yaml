answer: |-
  **Running Example: "The Uncomputed Sum"**
  *   **Content:** An agent knows the axioms of arithmetic and sees the expression "$1789 + 3452$".
  *   **Must Have:** A logical entailment that is trivial for the modeler (the sum is objectively 5241) but computationally non-trivial for the agent (they haven't calculated it). The content must be purely logical/mathematical, devoid of empirical uncertainty.
  *   **Must Lack:** Missing information or empirical ambiguity. The truth of the consequence must be guaranteed entirely by the information already attributed to the agent.

  **Exposition Sequence**

  1.  **Formalization (30 mins):** Map the example to standard Kripke semantics. Define knowledge as truth in all accessible worlds ($K\phi \iff \forall w'(wRw' \to \phi \in w')$). Show that if $\phi$ ("the numbers are 1789 and 3452") is true in all accessible worlds, and $\phi \vdash \psi$ ("the sum is 5241"), then $\psi$ is true in all accessible worlds.
      *   *Depends on:* Students' prior acceptance of Kripke semantics.
  2.  **The Clash (30 mins):** Contrast the model's output ($K\psi$) with the intuitive reality (the agent hasn't calculated $\psi$). Establish that the semantics forces us to say the agent *knows* the sum.
      *   *Depends on:* Stage 1 derivation.
  3.  **The Modeling Decision (45 mins):** Force a choice: Is $K$ modeling *information state* (what is ruled out) or *cognitive state* (what is processed)? Show that standard semantics models the former. To model the latter, we must alter the formalism.
      *   *Depends on:* Stage 2 clash.
  4.  **Repairs & Distortions (45 mins):** Introduce "impossible worlds" (worlds where logical truths fail) to block closure. Demonstrate the cost: the K-axiom ($K(\phi \to \psi) \to (K\phi \to K\psi)$) fails. Knowledge becomes non-normal.
      *   *Depends on:* Stage 3 decision.

  **Misconceptions & Preemption**

  1.  **"The problem is just that real agents are computationally bounded."**
      *   *Preempt:* Stage 2 (The Clash).
      *   *Response:* Clarify that epistemic logic models *rational commitment*, not hardware limits. If the semantics says $K\psi$, it claims $\psi$ is incompatible with the agent's information, not that the agent has computed it. The problem is representational, not computational.
  2.  **"It is only a problem if the operator is read as explicit belief."**
      *   *Preempt:* Stage 3 (The Modeling Decision).
      *   *Response:* Show that even implicit knowledge causes issues in multi-agent systems (e.g., security protocols). If we model a system where agents *should not* know a derived key, standard semantics validates the breach prematurely.

  **Final Board Task**
  "Draw a Kripke frame where an agent knows $P$ and knows $P \to Q$, but does *not* know $Q$. Label the worlds and accessibility relation. Identify exactly which property of standard semantics you violated to achieve this."
  *   *Success Criterion:* Students must introduce a world accessible from the actual world where $P$ and $P \to Q$ hold, but $Q$ does not (an impossible world). This proves they understand that blocking omniscience requires breaking logical coherence in the model.

  **Set Aside**
  *   **Dynamic Epistemic Logic:** Do not discuss *how* agents acquire knowledge (updates); focus on the static state.
  *   **Probabilistic Approaches:** Avoid credence degrees; keep the binary known/unknown distinction to highlight the logical gap.
  *   **Axiomatic Proofs:** Do not derive S4 or S5 theorems; focus on the semantic interpretation of the accessibility relation.
