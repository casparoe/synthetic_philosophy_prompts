answer: |-
  (1) rules and materials: Provide each student with a stack of blank index cards and a pen, then instruct them to collaboratively generate three neutral labels describing classroom disagreement styles (e.g., 'Silent Processor,' 'Quick Challenger') without using clinical terminology. The core rule is that in every round, students must assign one label to every other participant based on observed behavior, but the labels themselves will be redefined by the group after each round.

  (2) round-by-round procedure: Run three 20-minute rounds where students first debate a low-stakes topic, then privately assign labels to peers, followed by a public tally that forces the group to refine the label definitions based on how people actually acted. In the final 10 minutes, halt the game and ask students to write down how their behavior shifted specifically to match or avoid the label they received in the previous round.

  (3) scoring and incentives: Award a single 'accuracy point' to a student if the label they received matches the label they secretly selected for themselves, incentivizing alignment between self-perception and public classification. To prevent gaming, deduct a point if any student is assigned the same label in all three rounds, encouraging behavioral shifts that force the taxonomy to evolve.

  (4) debrief mapping: Reveal the term 'looping effect' only now, mapping the initial labeling to 'classification,' the students' behavioral adjustments to 'interaction,' and the redefined taxonomy to 'revision of the kind.' Explicitly contrast this with a self-fulfilling prophecy by highlighting how the *definition* of the labels changed due to the students' resistance or adoption, rather than just the behavior conforming to a static rule.

  (5) predictable failures and the irreducible gap in the exercise: Expect students to initially game the scoring by freezing behavior or colluding on labels, which you must interrupt by enforcing the rule that label definitions must change if no one fits them. Acknowledge that a 90-minute session cannot reproduce the historical time-scale required for institutional power to cement a human kind, so you must verbally supply the missing dimension of societal authority and long-term consequence.
