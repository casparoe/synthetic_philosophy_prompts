prompt: |-
  I am preparing a recorded colloquium interview with a political philosopher and legal scholar whose work defends the conditional-amnesty position in transitional justice. The topic has recently become personal for me: a member of my family was disappeared during Argentina's last military dictatorship, and my relatives obtained the relevant case records only within the past year, which has forced me to think hard about what disclosure can and cannot do when prosecution is unavailable. I am not interested in questions that merely invite her to restate the view, nor in biographical or "what drew you to this field" questions.

  Her position, as I understand it, is this. A state emerging from mass atrocity may legitimately offer individual perpetrators amnesty on condition of full public disclosure, when (a) pressing prosecutions would realistically endanger a negotiated transition rather than merely being politically costly, (b) the required disclosure is full, specific, and subject to independent verification, and (c) the amnesty is granted case by case rather than as a blanket shield. She makes two further claims: that truth obtained in this way has intrinsic reparative value for victims and survivors, and that South Africa's Truth and Reconciliation Commission amnesty process, for all its documented failures, remains the best available model for such bargains. For contrast you may use Argentina, with its CONADEP truth commission, the amnesty laws that blocked prosecution for roughly two decades, and their later annulment, and Rwanda, where the post-genocide government prioritized prosecution and relied heavily on the gacaca courts amid recurring concern that only one side's crimes were addressed. You may treat these facts as given; do not turn the questions into requests for a bibliography, footnotes, or source recommendations.

  Please draft eight to ten interview questions. Each question should press one identifiable pressure point against her position, anticipate the reply she is most likely to give, and include a follow-up question keyed to that reply. At minimum, include at least one question on each of the following pressure points, though you may combine, refine, or reorder them:

  - the impunity objection: that any amnesty, even conditional and individualized, entrenches a norm that power can negotiate away accountability, with long-term costs to the rule of law in the successor state;
  - the verifiability objection: that "full disclosure" as a condition is often a fiction, because perpetrators control the narratives they offer and self-serving disclosures may still clear the evidentiary threshold in practice;
  - the later turn in international and regional human rights law toward a duty to prosecute, including rulings against self-amnesty laws, and whether her view can survive that development;
  - the empirical premise that truth produces reconciliation, reduces denialism, or strengthens democracy, and what the evidence is supposed to show;
  - the asymmetry problem: whether the same amnesty mechanism can defensibly cover state agents who committed crimes against humanity and opposition fighters who committed ordinary wartime offenses;
  - the generalizability problem: whether a model built for a negotiated transition such as South Africa's can guide cases like Argentina, where the regime collapsed rather than negotiated, or Rwanda, where accountability was largely victor-driven;
  - the victim-centered objection: that many victims' and survivors' organizations rejected the truth-for-amnesty bargain and demanded prosecutions, so the asserted intrinsic reparative value of truth must be defended against the charge that it substitutes the scholar's or the state's idea of what victims need for what they actually demanded.

  Deliver your work as a single JSON object with the following schema:

  {
    "position_restated": "one short paragraph restating the guest's position as you will use it in the interview",
    "questions": [
      {
        "number": 1,
        "question": "the question as it would be spoken aloud",
        "pressure_point": "a short label naming the objection or problem being pressed",
        "why_it_bites": "one or two sentences on why this pressures her specific version of conditional amnesty",
        "anticipated_reply": "the answer a careful defender of conditional amnesty is most likely to give",
        "follow_up": "the follow-up question keyed to that anticipated reply"
      }
    ],
    "coverage_check": ["list any of the seven required pressure points that your questions fail to address"]
  }

  Order the questions so that they build, with later questions able to refer back to her earlier replies. The follow-ups should be questions you would actually ask after the anticipated reply, not rhetorical or accusatory formations.
