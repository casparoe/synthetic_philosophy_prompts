answer: |-
  The Franck Report's Summary reveals a striking disconnect between the moral language of Just War Theory (JWT) and the prudential language of high-statecraft. The committee's argument against an unannounced attack rests entirely on "favorable conditions," "international control," and the "interests of this country." Nowhere does the text explicitly invoke the immunity of Japanese civilians or the intrinsic wrongness of mass slaughter. The reasoning is consequentialist: a demonstration is advocated not because killing is forbidden, but because killing now jeopardizes American security later by triggering an arms race.

  However, this prudential casing can be reconstructed as a *jus in bello* argument in disguise. By proposing a demonstration in an "uninhabited area," the committee implicitly acknowledges a constraint on targeting. They are arguing for a method of shock that achieves the military objective (compelling surrender) without violating non-combatant immunity. Translating the Franck Report into JWT terms strengthens the moral clarity: it posits that discrimination is not merely a legal hurdle but a strategic necessity for long-term peace. Yet, something is lost in this translation. The report's power lay in its appeal to American self-interest—the "nuclear armaments race"—which was arguably more persuasive to Secretary of War Stimson than abstract deontological constraints. The JWT reconstruction gains moral rigor but loses the specific geopolitical foresight that made the Franck Report unique. It transforms a warning about the future of global order into a standard argument about civilian protection, narrowing the scope of the moral failure from a global tragedy to a tactical violation.

  Running the actual decision to bomb through standard JWT criteria reveals significant friction, particularly regarding *last resort*. *Discrimination* is the easiest criterion to apply: Hiroshima and Nagasaki were urban centers, and the weapons were indiscriminate by design. Unless one accepts the controversial "double effect" justification that the military value of the cities outweighed the civilian death, this criterion was failed. *Proportionality* is murkier; it requires weighing the immediate horror against the hypothetical lives saved by avoiding an invasion. However, *last resort* exposes the theory's structural weaknesses when applied to complex historical moments.

  JWT often treats *last resort* as a binary threshold: have we tried everything else? But the menu available in August 1945 was not binary. It consisted of differently-priced waiting strategies. The Franck Report suggested a demonstration. The Strategic Bombing Survey later suggested the blockade and conventional bombing might have sufficed. Diplomatic channels suggested modifying the unconditional surrender demand to preserve the Emperor. Intelligence indicated the Soviet entry into the war was imminent and might compel surrender. JWT struggles to rank these probabilistic alternatives. If the Soviet entry had a 70% chance of ending the war without invasion, and the bomb had a 90% chance but guaranteed civilian massacre, which is the "last" resort? The theory assumes a clarity of outcomes that history denies. By treating "waiting" as a passive non-action rather than an active strategy with its own risks and costs, JWT fails to capture the moral weight of *timing*. If a waiting strategy is sufficient, acting immediately is not a last resort, even if waiting carries the risk of prolonged conflict. The decision to bomb was not a choice between fighting and not fighting; it was a choice between killing now or risking killing later. JWT lacks the granularity to adjudicate between competing probabilities of future violence.

  The bombing of Nagasaki serves as a devastating stress test for the theory's capacity to handle temporal proximity. Hiroshima occurred on August 6; Nagasaki on August 9. Three days is scarcely enough time for the Japanese leadership, fractured and communicating via compromised lines, to absorb the shock of the first bomb, much less convene an imperial conference. If Hiroshima was justified as a necessary shock to break a deadlock, Nagasaki implies that the first shock was insufficient. However, JWT typically evaluates acts of war as discrete events or as part of a continuous campaign without specifying the required interval for re-evaluation.

  Does the theory condemn Nagasaki as a fresh violation, or excuse it as part of the ongoing *ad bellum* justification? If the justification for Hiroshima was "shock and awe" to force surrender, Nagasaki suggests a failure of that specific logic. Yet, JWT is largely silent on the *pace* of moral re-evaluation. It assumes that once *jus ad bellum* is established, *jus in bello* governs conduct until victory. It does not account for a scenario where the *reason* for the war's continuation (Japanese intransigence) might be a function of the *time* allowed for decision-making. By bombing again before the political effects of the first could realistically manifest, the United States treated the bombs as interchangeable munitions rather than unique political signals. JWT lacks a mechanism to condemn the *prematurity* of a second strike within a single decision cycle. It silently assumes that if the war continues, the killing may continue, ignoring the possibility that the killing itself is preventing the war's end by hardening resolve or disrupting communication. The theory is silent on the morality of impatience.

  Finally, the case bites back at the theory. If the strongest moral argument available to insiders was the Franck Report's prudential one, and JWT struggles to rank the available waiting strategies, is JWT the wrong tool for weapons of mass coercion? Or does the doctrine of *supreme emergency* rescue it? *Supreme emergency*, as defined by Michael Walzer, permits the suspension of normal war conventions only when a political community faces an imminent threat of existential destruction and the danger is unprecedented.

  This doctrine does not save the decision in 1945. By August, Germany had surrendered; the existential threat to the United States or its allies had receded. The danger was not the destruction of American democracy, but the cost of ending a war against a defeated foe. Invoking supreme emergency here stretches the concept beyond recognition, transforming it from a shield against extinction into a sword for expediency. However, the failure of JWT in this case suggests a deeper flaw: the theory is too state-centric and temporally myopic. The Franck Report understood that the consequences of nuclear use transcended the immediate conflict, touching on the "interests of this country" regarding the future "armaments race." Standard JWT calculates proportionality based on the immediate war aims. It does not easily incorporate long-term geopolitical stability into the moral calculus.

  Therefore, the theory is not the wrong tool, but it is an incomplete one. It requires an expansion of *proportionality* to include the long-term normative effects of weapon usage, precisely as Franck argued. The failure was not in JWT itself, but in its application as a static framework rather than a dynamic one. The decision to bomb was not a supreme emergency, but a failure of prudential judgment that JWT should have flagged under a robust interpretation of *last resort*. The Franck Report highlights that the moral cost of nuclear weapons includes the erosion of future security architectures. If JWT cannot account for the "nuclear armaments race" as a moral evil comparable to civilian casualties, it is indeed ill-equipped for the atomic age. The theory must evolve to recognize that how a war ends dictates the morality of the peace that follows. In 1945, the decision-makers chose a military victory that compromised the political peace. JWT, properly expanded to include Franck's foresight, would have condemned this not merely as a tragedy, but as a strategic moral failure. The silence of the theory on these long-term consequences is not a justification for the bomb, but an indictment of the theory's traditional limits.
