      4.  Introduce "Loop Gain" and "Friction" (communication bandwidth, mortality, learning latency).
      5.  Discuss the "Burden of Knowledge" to explain Premise 5 without conceding the conclusion.
      6.  Summarize the commitment.

  9.  **Final Review against constraints:**
      *   Diagnose which premise/inference to give up. (Premise 3).
      *   Why did it look acceptable? (Intuitive continuity, underestimation of friction).
      *   What does abandoning it commit me to? (Phase transitions, importance of bandwidth/latency, human biological bottlenecks).

