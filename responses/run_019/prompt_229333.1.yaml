answer: |-
  **THE OPTIMIZED LIFE: Inside Julian Altruist's Quest for Perfect Goodness**

  *By Chloe Sterling | Photos by Marcus Light*

  Sunlight streams into Julian Altruist's Brooklyn loft, illuminating nothing in particular. There are no paintings on the white walls—art is subjective, Julian explains, and subjective pleasures divert funds from objective suffering. There is no sofa, only ergonomic seating designed for maximum alertness during evening grant-writing sessions. To the untrained eye, it might look stark. To me, it looks like clarity.

  "True luxury is time," Julian says, offering me a glass of water. He doesn't drink coffee; the caffeine jitter reduces typing efficiency by 4% after 11 AM. We are sitting at a standing desk. Julian is a Living Saint, a person who has dedicated every waking moment to the moral improvement of the world. In an era of selfishness, his life is the ultimate aspirational content.

  **What's your morning routine?**
  I wake at 4:00 AM. Sleep is a biological necessity, not a hobby. I spend the first hour reviewing global poverty metrics. Then I run—not for fitness, but because walking is too slow and driving is too carbon-heavy.

  **We love that functional fitness mindset. Do you have any guilty pleasures?**
  Guilty pleasures imply indulgence. I don't indulge. Previously, I enjoyed playing the bassoon. But I calculated that the hours spent practicing could instead be used to coordinate vaccine deliveries. So I sold the instrument. Now, my joy comes entirely from the welfare of others.

  **That's so inspiring. The Loving Saint archetype, right? You genuinely enjoy this?**
  Absolutely. Some people think morality requires sacrifice—the Rational Saint model, suppressing their desires for duty. But I've rewired my psyche. I don't *want* to watch Netflix. I don't *want* gourmet food. Nutrient paste is cost-effective and frees up mental bandwidth. If I enjoyed jazz, I'd be conflicted. Luckily, I only enjoy doing good.

  **Your wardrobe is very… uniform.**
  Capsule wardrobe. Ten identical outfits. Decision fatigue is a moral failing when decisions could be about saving lives. Why optimize style when you can optimize utility?

  **What about relationships? Dating?**
  I date people who align with the mission. Romantic love can be possessive. I prefer universal benevolence. Last week, I skipped my anniversary dinner to volunteer at a shelter. My partner understood. Moral worth trumps sentimental tradition.

  **Many people say a life without hobbies isn't a full life. How do you respond?**
  That's a non-moral excellence speaking. Wit, charm, creativity—they're only valuable if they help others. My life is full because it is morally full. I don't have a personality; I have a purpose.

  As I leave Julian's apartment, I feel a pang of inadequacy. He has no favorite color, no secret talent, no trashy novels hidden under the bed. He has eliminated the messy, irrational clutter of being human. It's terrifying. It's perfect. It's the cover story.

  ***

  **Editor's Note on Philosophy:**
  This satire leans heavily on Susan Wolf's specific contention that moral sainthood crowds out "non-moral virtues" like wit or artistic pursuit, treating her critique as definitive. However, this is contested; utilitarians like Peter Singer might argue that such a life *is* the only rational ideal, regardless of personality loss. Wolf argues sainthood is an undesirable *human* ideal, not necessarily that the actions themselves are wrong, whereas the piece exaggerates the Saint's lack of internal conflict for comedic effect.
