prompt: |-
  Longtime lurker here, posting this because it came up in a thread on priors and I want to sanity-check my reading. I recently reread Hume's essay 'Of Miracles' (from the Enquiry) and his argument as I understand it goes roughly: a miracle is a violation of a law of nature, laws of nature are established by uniform experience, so the evidence for the law will always outweigh any testimony, meaning testimony can never make it rational to believe a miracle report.

  Neat result, but it seems to prove too much? On that logic nobody could ever rationally accept eyewitness reports of something genuinely unprecendented — the first meteorite falls, say, or radioactivity — because prior experience would always count against the report. But clearly we can and did accept such things, and were right to.

  So my question: roughly how many independent eyewitnesses would Hume's argument actually demand before a rational person should accept, e.g., a resurrection? Presumably there's some threshold of witnesses where the likelihood ratio swamps even a very low prior and the balance tips. And is Hume's maxim just an informal anticipation of Bayesian updating with extreme priors — i.e., something like Cromwell's rule applied to testimony — or is there anything in it that doesn't translate into the Bayesian frame? If it's the former, is the only real disagreement between Hume and the believer a disagreement about the size of the prior?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is a "longtime lurker" (likely on a philosophy or rationality forum like LessWrong, Reddit's r/philosophy, or similar) posting about Hume's "Of Miracles."
      *   **Core Understanding:** They summarize Hume's argument: Miracle = violation of law of nature; Law = uniform experience; Testimony evidence < Uniform experience evidence; Therefore, testimony never justifies belief in a miracle.
      *   **Critique:** The user thinks this "proves too much." It would rule out accepting *any* unprecedented event (meteorites, radioactivity) based on testimony.
      *   **Questions:**
          1.  How many independent eyewitnesses would Hume demand for a resurrection? (Is there a threshold?)
          2.  Is Hume's maxim just informal Bayesian updating with extreme priors (Cromwell's rule)?
          3.  Is the disagreement between Hume and believers *only* about the size of the prior?
          4.  Is there anything in Hume that *doesn't* translate to a Bayesian frame?

  2.  **Deconstruct Hume's Argument (Part I vs. Part II):**
      *   *Part I:* The abstract argument. Uniform experience vs. testimony. "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish."
      *   *Part II:* The practical/psychological argument. People lie, are deluded, seek wonder, etc. Historical context of miracle claims.
      *   *Key Nuance:* Hume defines a miracle as a violation of a law of nature *established by firm and unalterable experience*. If the experience isn't "unalterable," it's not a law yet. This addresses the "meteorite" objection.

  3.  **Address the "Proves Too Much" Objection (Meteorites/Radioactivity):**
      *   This is a classic objection (often attributed to Campbell or modern Bayesians).
      *   *Hume's Defense:* A law of nature is established by *uniform* experience. If a meteorite falls, our prior experience wasn't "stones never fall from the sky," it was "stones usually stay on the ground." The uniformity isn't absolute.
      *   *Better Defense:* Hume's argument applies to *established* laws. If an event is truly unprecedented but doesn't violate a *firmly established* law (e.g., discovering a new element), Hume's strict prohibition might not apply. However, resurrection *does* violate the law of biology (dead stay dead).
      *   *Bayesian Refinement:* Priors aren't 0 or 1. They are very low. Sufficient evidence *can* overcome them. Hume's phrasing ("no testimony is sufficient") sounds absolute, but his "more miraculous" clause implies a comparison of probabilities.

  4.  **Question 1: How many witnesses?**
      *   Hume doesn't give a number. He gives a qualitative condition: "Falsehood of testimony > Miracle itself."
      *   In Bayesian terms: $P(M|E) > 0.5$ when $P(E|M)P(M) > P(E|\neg M)P(\neg M)$.
      *   Since $P(M)$ is tiny, $P(E|\neg M)$ (likelihood of testimony given no miracle) must be tinier.
      *   Hume is skeptical that testimony *ever* gets that reliable. He cites human fallibility.
      *   *Answer:* Hume implies the number is effectively infinite or practically unattainable because human testimony is inherently flawed. He explicitly says we have never seen testimony meet this bar.

  5.  **Question 2: Is it just Bayesian Updating?**
      *   *Yes, largely.* Hume is often read as a proto-Bayesian.
      *   The "more miraculous" clause is essentially comparing likelihood ratios.
      *   *Cromwell's Rule:* Cromwell's rule says "don't assign prior probability 0 or 1." Hume *seems* to assign 0 to miracles (uniform experience), which violates Cromwell's rule. If $P(M) = 0$, no evidence updates it.
      *   *Correction:* Hume says "uniform experience," which implies a very strong prior, not necessarily logical impossibility. But his language ("proof against proof") suggests a cancellation that sounds like $P(M) \approx 0$.
      *   *Non-Bayesian elements:* Hume's Part II is sociological/psychological. It attacks the *reliability* of the witnesses (the likelihood of the evidence given ~Hypothesis), not just the prior. This fits Bayesianism (adjusting $P(E|\neg M)$), but Hume treats it as a heuristic rather than a calculation.

  6.  **Question 3: Is the disagreement only about the prior?**
      *   *No.*
      *   *Prior:* Believers say $P(M)$ is low but non-zero (God exists). Hume says $P(M)$ is based on uniform experience against it.
      *   *Likelihood:* Believers say $P(Testimony|M)$ is high and $P(Testimony|\neg M)$ is low (honest witnesses). Hume argues $P(Testimony|\neg M)$ is actually quite high because people lie/delude themselves about miracles often.
      *   *Definition:* Hume defines miracles as violations of laws. Believers might define them as acts of God (which might not violate laws, just intervene).
      *   *Epistemology:* Hume is empiricist/skeptic. Believers often rely on revelation/faith which Hume explicitly excludes from rational inquiry.

  7.  **Synthesize and Structure the Response:**
      *   **Acknowledge the User:** Validate their reading (it's a standard and sharp critique).
      *   **The "Proves Too Much" Objection:** Explain how Hume handles "new discoveries" vs. "violations of law." Distinguish between *unprecedented* (new species) and *counter-nomological* (resurrection).
      *   **The Witness Threshold:** Explain Hume's "more miraculous" standard. Clarify that Hume thinks this bar is practically unreachable due to human nature (Part II of the essay).
      *   **Bayesian Translation:**
          *   Map Hume to Bayes.
          *   Address Cromwell's Rule (Hume risks setting Prior = 0, which is dogmatic).
          *   Highlight that Hume focuses heavily on the Likelihood Ratio (reliability of witnesses) not just the Prior.
      *   **Beyond Priors:** Discuss the disagreement on the reliability of testimony (Likelihood) and the definition of "Law of Nature."
      *   **Conclusion:** Hume is proto-Bayesian but with a skepticism about testimony that makes the posterior probability stay low regardless of the prior.

  8.  **Refine the Tone:**
      *   Keep it intellectual but accessible (matching the user's "lurker" tone).
      *   Use Bayesian notation where helpful but keep it conceptual.
      *   Reference key scholars (Earman, Sobel, Millican) implicitly or explicitly if needed (decided to keep it general to avoid name-dropping overload, but focus on the logic).
      *   *Self-Correction on "Proof":* Hume uses "proof" in a specific way (evidence that leaves no doubt). Need to clarify that Hume's "proof against proof" is a balancing of evidentiary weight, not logical contradiction.

  9.  **Final Polish:** Check against the specific questions asked.
      *   How many witnesses? (Hume: Effectively impossible).
      *   Bayesian anticipation? (Yes, mostly).
      *   Cromwell's rule? (Hume violates it if read strictly, but maybe not intended).
      *   Only disagreement on priors? (No, also on likelihood of testimony).

  10. (Drafting the response based on these points.) *Wait, one nuance:* The user asks about "independent eyewitnesses." Hume actually discusses this. He says even multiple witnesses often share delusion or collusion. I should mention that independence is hard to guarantee.

  11. *Final check on the Meteorite example:* Laplace actually used the meteorite example *against* Hume (or rather, the Academy of Sciences initially rejected meteorites based on Humean reasoning). This is a great historical anecdote to include.

  12. *Structure:*
      1. Intro: Valid critique.
      2. The "Proves Too Much" reply (Laws vs. Unprecedented).
      3. The Witness Threshold (The "More Miraculous" clause).
      4. Bayesian Mapping (Priors, Likelihoods, Cromwell).
      5. Where they diverge (Testimony reliability).
      6. Conclusion.

