answer: |-
  This is a classic and very sharp reading of Hume. You've hit on the two biggest critiques that have been leveled against *Of Miracles* since Campbell's 1762 *Dissertation on Miracles* up through modern Bayesian analyses (like John Earman's *Hume's Abject Failure*).

  Here is a breakdown of how Hume's argument holds up against your questions, specifically looking at the "proves too much" objection, the witness threshold, and the Bayesian translation.

  ### 1. Does it prove too much? (Meteorites vs. Resurrections)

  Your intuition is correct: if Hume's argument is taken as "uniform experience always trumps testimony," it would irrationalize the acceptance of any novel discovery (meteorites, platypuses, radioactivity).

  However, Hume has a specific escape hatch here, though it requires a precise reading of his definition of a **Law of Nature**.

  For Hume, a law of nature isn't just a pattern we've seen a lot; it is an experience that is **firm and unalterable**.
  *   **Meteorites:** Before meteorites were accepted, the "law" wasn't "stones never fall from the sky." The experience was "stones usually stay on the ground." There was no *uniform* experience against stones falling, only a lack of experience of them falling. Therefore, testimony about a stone falling from the sky contradicts only *some* experience, not *uniform* experience. It is an anomaly, not a violation of a law.
  *   **Resurrection:** The "law" here is "all human beings who have been dead for more than X days remain dead." Hume argues this *is* uniform experience. Every human who has ever died has stayed dead.

  So, Hume's argument only applies to events that contradict a **universal negative** established by total human experience. He would likely concede that testimony can establish the discovery of a new element (radioactivity) because that doesn't violate a law of nature, it merely expands our catalog of nature. It only bites when the event is *nomologically impossible* given our total dataset.

  ### 2. How many witnesses would Hume demand?

  You asked for a number. Hume doesn't give one, but he gives a formula:

  > *"No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish."*

  In Bayesian terms, he is asking for the Likelihood Ratio to swamp the Prior.
  Let $M$ = Miracle occurred.
  Let $T$ = Testimony received.

  We accept $M$ if $P(M|T) > 0.5$.
  By Bayes' theorem, this happens when:
  $$ \frac{P(T|M)}{P(T|\neg M)} > \frac{P(\neg M)}{P(M)} $$

  *   **The Prior ($P(\neg M)/P(M)$):** For Hume, since $M$ violates uniform experience, this ratio is astronomical.
  *   **The Likelihood Ratio ($P(T|M)/P(T|\neg M)$):** This is the reliability of the witnesses.

  Hume's argument in **Part II** of the essay is effectively a claim that the denominator $P(T|\neg M)$ is never low enough. He argues that human testimony is inherently prone to:
  1.  Delusion/Enthusiasm
  2.  Lying/Deception
  3.  Collusion
  4.  The psychological attraction to the marvelous

  Therefore, Hume's answer to "how many witnesses?" is effectively: **"It doesn't matter."** He argues that there is no historical instance where the probability of mass delusion or conspiracy was lower than the probability of the law of nature being violated. He implies that even if you had 100 witnesses, the probability of 100 people being caught up in a shared religious enthusiasm is still higher than the probability of a dead man coming back to life.

  He does concede a hypothetical: If the sun were to go dark for 8 days and *all* historians and witnesses across every culture reported it, we should believe it. But he treats this as a rhetorical device to show that *actual* miracle claims (religious resurrections) never meet this bar of universal, secular, disinterested testimony.

  ### 3. Is this just Bayesian Updating with Extreme Priors?

  Most modern philosophers (like Sobel or Earman) agree: **Yes, Hume is essentially a proto-Bayesian.**

  However, there is a crucial tension regarding **Cromwell's Rule**.
  *   **Cromwell's Rule:** Never assign a prior probability of exactly 0 or 1 to any empirical hypothesis, or you can never update your belief.
  *   **Hume's Risk:** When Hume says laws of nature are established by "firm and unalterable experience," he sounds like he is assigning $P(M) = 0$. If $P(M) = 0$, then no amount of testimony updates the belief. This would make his argument dogmatic rather than evidential.

  **The Charitable Bayesian Reading:**
  Hume shouldn't be read as setting $P(M) = 0$, but rather as setting the Prior Odds so low that the Likelihood Ratio required to overcome them is practically unattainable given human psychology.
  In this frame, Hume isn't saying miracles are *impossible*; he is saying that **false testimony is more common than miracles.**

  ### 4. Is the disagreement only about the size of the prior?

  This is the most interesting part. If we translate Hume into Bayes, is the fight just between a Skeptic (Low Prior) and a Believer (High Prior)?

  **No. The disagreement is also about the Likelihood of the Testimony ($P(T|\neg M)$).**

  *   **The Believer's View:** Honest, sober, educated witnesses (e.g., the Apostles) would not lie about a resurrection. Therefore $P(T|\neg M)$ is very low.
  *   **Hume's View:** Even honest, sober witnesses are susceptible to "enthusiasm," cultural conditioning, and the psychological reward of believing in the marvelous. Hume argues that the history of religion shows that people *constantly* report miracles that turn out to be false.

  So, Hume is arguing that $P(T|\neg M)$ is actually quite **high**. He is claiming that the rate of false miracle reports in human history is high enough that *any* given report is more likely to be a false positive than a true positive, regardless of the witness's sincerity.

  **Where Hume doesn't translate well to Bayesianism:**
  Hume occasionally slips into language suggesting that the evidence *against* the miracle (uniform experience) and the evidence *for* the miracle (testimony) cancel each other out like positive and negative numbers ("proof against proof"). Bayesianism doesn't work by subtraction; it works by multiplication of ratios. Hume's "balance of evidence" metaphor is a bit clunky compared to the likelihood ratio, but the intuition is the same.

  ### Summary

  1.  **Does it prove too much?** No, provided you distinguish between "unprecedented events" (meteorites) and "violations of uniform experience" (resurrection). Hume's argument only targets the latter.
  2.  **How many witnesses?** Hume implies the number is irrelevant because the rate of human delusion ($P(T|\neg M)$) is always higher than the rate of nomological violations. He demands testimony where its falsehood is *more* miraculous than the event, which he thinks never happens in practice.
  3.  **Is it Bayesian?** Yes, broadly. It is an argument about Likelihood Ratios failing to overcome Prior Odds.
  4.  **Is it just the Prior?** No. Hume puts significant weight on the unreliability of testimony regarding religious matters. He argues that even with a non-zero prior, the likelihood of false testimony is simply too high to ever tip the scale.

  **The Verdict:** Your sanity check is sound. Hume's argument is best understood as a claim that the **Likelihood Ratio of religious testimony is structurally capped** by human psychology, meaning it can never overcome the **Prior Odds** established by natural law. The disagreement with a believer is not just "How likely is a miracle?" but also "How likely are people to lie or delude themselves about miracles?" Hume thinks the latter is much higher than believers admit.
