prompt: |-
  In my upper-division philosophy of science seminar I regularly defend evolutionary psychology against the charge that it traffics in just-so stories, and I had long assumed the charge was more of a rhetorical posture than an argument. Last term, however, a student reconstructed it in a form I have not been able to answer cleanly, and I would like a diagnosis before I teach the unit again. Her argument ran as follows:

  (1) A hypothesis is scientific only if evidence bears on it asymmetrically: there must be possible observations that would count for it and possible observations that would count against it, and one must be able to say in advance, at least roughly, which are which.

  (2) Adaptationist hypotheses about human cognition -- that we possess a dedicated cheater-detection module, that pregnancy sickness is an adaptation protecting the fetus from dietary toxins, that men and women differ in jealousy because the ancestral costs of infidelity were asymmetric -- are confirmed when observed behavior fits the hypothesis's retrodictions.

  (3) But for any observed behavior whatsoever, some adaptationist accommodation can be constructed after the fact. If the predicted trait appears, it is an adaptation. If it fails to appear, the cost of the trait exceeded the benefit, or the relevant selection pressure was absent. If the opposite of the prediction appears, the environment of evolutionary adaptedness must have differed from what was assumed, or the trait is a byproduct of some other adaptation, or a developmental constraint blocked the optimum. Nothing in the method forbids any of these moves.

  (4) Therefore no possible observation counts against an adaptationist hypothesis; such hypotheses can only be confirmed, never disconfirmed.

  (5) By (1), adaptationist hypotheses in evolutionary psychology are not scientific.

  Her conclusion in (5) is already more than I want to grant, but the real trouble is that the argument appears to prove too much. Phylogenetic reconstruction, historical geology, and much of cosmology also infer past processes from present traces, and in each case a sufficiently clever theorist can accommodate anomalous traces by revising auxiliary assumptions about initial conditions or background processes. If (3) and (4) are sound as applied to evolutionary psychology, parallel versions seem available for these fields -- and I am not prepared to conclude that inferring the tree of life from molecular sequences is unscientific. Nor do I want to win cheaply by pointing to cases where adaptationist reasoning got there first, as Fisher's sex-ratio argument is sometimes said to have done, since the student's premise (1) demands advance asymmetry and that case arguably supplies it.

  Which step should I reject? I am most reluctant to give up (1), since some version of it seems required to distinguish empirical inquiry from unfalsifiable systematizing. If the flaw lies in (3) or (4), explain what an adaptationist hypothesis would have to look like for an observation genuinely to count against it, and whether actual research programs in evolutionary psychology meet that standard or merely gesture at it. And tell me what rejecting your chosen step costs -- what other commitments, in evolutionary biology or in the historical sciences generally, I would have to revise or abandon along with it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Upper-division philosophy of science seminar.
      *   **Topic:** Defense of Evolutionary Psychology (EP) against the "just-so story" charge.
      *   **The Problem:** A student presented a specific, structured argument (Premises 1-5) concluding that EP adaptationist hypotheses are unscientific because they lack asymmetrical evidence (falsifiability).
      *   **The Instructor's Dilemma:** The instructor feels the argument proves "too much" (would also condemn phylogenetics, geology, cosmology) but hasn't found a clean rebuttal. They are reluctant to reject Premise (1) (asymmetry/falsifiability).
      *   **The Task:** Diagnose the argument, identify which step to reject (preferably 3 or 4), explain what a genuine disconfirmation looks like in EP, assess if actual research meets this standard, and explain the costs/commitments of rejecting that step.

  2.  **Deconstruct the Student's Argument:**
      *   (1) **Demarcation Criterion:** Scientific hypotheses need asymmetric evidence (confirmation vs. disconfirmation) specified in advance. (Popperian/Lakatosian vibe).
      *   (2) **EP Practice:** EP hypotheses are confirmed by fitting observed behavior to retrodictions (adaptationist explanations).
      *   (3) **Immunization Strategy:** For *any* outcome, an adaptationist story can be told (trait present = adaptation; trait absent = cost/benefit mismatch; opposite trait = different EEA/byproduct/constraint). Nothing forbids these moves.
      *   (4) **Inference:** No observation counts *against* the hypothesis. Only confirmation is possible.
      *   (5) **Conclusion:** EP is not scientific (by 1).

  3.  **Evaluate the Premises:**

      *   **Premise (1):** The instructor wants to keep this. It's a standard view on falsifiability/testability. Rejecting it leads to relativism or "anything goes."
      *   **Premise (2):** Mostly accurate description of how EP *often* presents itself, but maybe too broad.
      *   **Premise (3):** This is the crux. It claims *unlimited* flexibility. It asserts that auxiliary hypotheses (EEA conditions, constraints, byproducts) can be adjusted *ad infinitum* without cost.
      *   **Premise (4):** Follows from (3). If (3) is false, (4) is false.
      *   **Premise (5):** Follows from (1) and (4).

  4.  **Identify the Weak Point:**
      *   The argument relies on a "Duhem-Quine" style problem applied specifically to historical sciences. The student claims that because auxiliary assumptions *can* be adjusted, they *are* adjusted without constraint.
      *   **The Flaw:** Premise (3) is too strong. It assumes that auxiliary hypotheses (about the EEA, constraints, phylogeny) are free-floating and cost-free. They are not. They are constrained by independent evidence.
      *   **Alternative Weak Point:** Premise (1) might be too rigid (Lakatos vs. Popper), but the instructor wants to keep it.
      *   **Best Strategy:** Attack Premise (3). Show that the "moves" described (changing EEA assumptions, invoking constraints) are not cost-free and are themselves testable. Therefore, observations *do* count against the specific conjunction of hypotheses.

  5.  **Develop the Rebuttal (Focusing on Premise 3):**
      *   **The "Independent Constraint" Argument:** You can't just say "the EEA was different." You need independent evidence of what the EEA was (paleoclimatology, archaeology, primatology). If the EP hypothesis requires an EEA that contradicts the archaeological record, the EP hypothesis is in trouble.
      *   **The "Phylogenetic Constraint" Argument:** You can't just say "it's a byproduct." You need to show the phylogenetic history supports that. If a trait is unique to humans but the proposed byproduct mechanism exists in chimps, that's a problem.
      *   **The "Engineering/Design" Argument:** Adaptationist hypotheses make claims about *design specifications*. If the "machine" works poorly in the way predicted, or if the cost/benefit analysis is mathematically impossible given known constraints, the hypothesis fails.
      *   **Comparative Method:** EP isn't just about humans. It's about comparative biology. If the hypothesis predicts a trait should exist in species X given environment Y, and it doesn't, that counts against it.

  6.  **Address the "Proves Too Much" Concern:**
      *   The instructor worries this logic kills geology/cosmology.
      *   **Resolution:** It doesn't. Historical sciences use the "consilience of inductions" (Whewell) or "multiple lines of evidence." A hypothesis in geology is rejected if it requires physics to work differently than observed elsewhere. Similarly, EP is rejected if it requires evolutionary theory or anthropology to work differently than observed elsewhere. The student's argument assumes these auxiliary fields are equally flexible, but they have their own independent empirical anchors.

  7.  **Drafting the Response:**

      *   **Acknowledge the Strength:** Validate the student's argument. It's a sophisticated version of the Gould/Lewontin "Spandrels" critique.
      *   **Diagnose the Error:** The error is in Premise (3). It treats auxiliary assumptions as *ad hoc* and untested.
      *   **Explain the Fix:** Introduce the concept of **independent testability of auxiliary assumptions**.
      *   **Concrete Examples:**
          *   *Jealousy:* If the hypothesis relies on paternity uncertainty, show evidence of paternity certainty mechanisms in ancestral contexts (or lack thereof).
          *   *Pregnancy Sickness:* If it's about toxins, show that the foods avoided are actually toxic to fetuses at those concentrations (Profet's hypothesis was actually tested this way).
          *   *Cheater Detection:* Wason selection task variations. If performance doesn't track social contract logic specifically, the module hypothesis weakens.
      *   **Address the "Cost":** What does rejecting (3) cost? It costs the idea that EP is "easy." It requires EP to be interdisciplinary. It forces EP researchers to engage with paleoanthropology, genetics, and comparative primatology. It admits that *bad* EP is unscientific, but *good* EP is scientific.
      *   **Philosophical Framing:** Use Lakatos (Research Programmes) or Mayo (Error Statistics). The student is applying a naive falsificationism. A better view is that hypotheses are tested within a network of constraints.
      *   **Addressing the "Proves Too Much":** Explicitly show why geology/cosmology survive this. They also rely on independent constraints (physics, chemistry). If a cosmological model required gravity to work differently in the past than in the lab, it would be rejected. Same for EP.

  8.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't say EP is *all* good. Admit that much of it *does* violate (3). Distinguish "armchair EP" from "empirical EP."
      *   *Premise 1 Nuance:* While keeping (1), nuance it. It's not about a single hypothesis in isolation (Duhem problem), but the *system* of hypotheses.
      *   *Key Distinction:* Accommodation vs. Prediction. The student argues accommodation is always possible. The counter is that accommodation *costs* credibility if it conflicts with independent data.

  9.  **Final Structure:**
      *   **Diagnosis:** The argument is valid but unsound. Premise (3) is the weak link.
      *   **The Flaw in (3):** The "Auxiliary Assumption" fallacy. Assumptions about the EEA, constraints, and phylogeny are not free variables; they are empirically constrained.
      *   **What Disconfirmation Looks Like:** Give concrete examples where EP hypotheses *were* challenged or refined by data (e.g., the specific content of fear modules, or the cross-cultural variability of jealousy).
      *   **The "Proves Too Much" Solution:** Historical sciences rely on *consilience*. If the EP story conflicts with the archaeological story, one must yield.
      *   **The Cost:** You must concede that "Armchair EP" is indeed unscientific. You commit EP to being a collaborative, constraint-heavy enterprise.
      *   **Pedagogical Advice:** How to teach this distinction.

  10. (Final Polish): Ensure tone is appropriate for a colleague (philosophy of science seminar instructor). Use precise terminology (Duhem-Quine, auxiliary hypotheses, independent testability, consilience).

  *(Self-Correction during drafting)*: I should make sure not to simply say "EP is science." I need to show *how* it meets the criteria if done correctly, while acknowledging the student is right about *bad* EP. The distinction is between the *method* being inherently flawed vs. the *practice* often being sloppy. The student argues the *method* is flawed (Premise 3 says "Nothing in the method forbids..."). I need to show the method *does* forbid it, theoretically, even if practitioners sometimes ignore the rules.

  Actually, a stronger philosophical move is to challenge the interpretation of (1) in light of the Duhem-Quine thesis. But the instructor wants to keep (1). So I must show that (3) violates the spirit of (1) by assuming auxiliary hypotheses are immune to testing.

  Let's focus on **Independent Testability**. That is the standard philosophical rebuttal to "ad hoc" adjustments.

  Okay, ready to write.
answer: |-
  This is an excellent student argument. It is a sophisticated reconstruction of the Gould and Lewontin "Spandrels" critique, formalized through a Popperian lens. It is valid, and it puts pressure on exactly the right spot.

  You are correct to feel that the argument proves too much. If Premise (3) were true, it would indeed dismantle all historical sciences, including the evolutionary biology that underpins evolutionary psychology (EP). The flaw lies in **Premise (3)**.

  Here is the diagnosis, the philosophical repair, and the cost of implementing it in your seminar.

  ### The Diagnosis: The "Free Parameter" Fallacy

  The student's argument relies on a specific interpretation of the Duhem-Quine thesis: that because a hypothesis is always embedded in a web of auxiliary assumptions, one can always save the core hypothesis by tweaking the auxiliaries.

  Premise (3) claims: *"Nothing in the method forbids any of these moves."*

  This is the error. While logic alone does not forbid these moves, **scientific methodology does.** The moves described in (3) (changing assumptions about the Environment of Evolutionary Adaptedness [EEA], invoking constraints, positing byproducts) are not free parameters. They are themselves empirical claims subject to independent testing.

  The student treats the "adaptationist framework" as a single monolithic hypothesis. It is not. It is a conjunction of hypotheses:
  1.  **The Core:** Trait *T* is an adaptation for function *F*.
  2.  **Auxiliary 1 (EEA):** The ancestral environment possessed condition *C*.
  3.  **Auxiliary 2 (Phylogeny):** The trait's distribution across species matches the proposed evolutionary history.
  4.  **Auxiliary 3 (Engineering):** The design of *T* matches the engineering requirements of *F*.

  Premise (3) assumes that when data contradicts the prediction, the researcher can simply adjust Auxiliary 1, 2, or 3 without cost. But if Auxiliary 1 (e.g., "ancestral humans lived in small bands") contradicts independent archaeological evidence, you cannot use it to save the Core hypothesis without rendering the *conjunction* untenable.

  ### How to Reject Premise (3)

  To reject (3), you must argue that **accommodation is not cost-free.** An adaptationist story can be constructed after the fact, but it gains no confirmation unless the auxiliary assumptions used to construct it are independently verified.

  **What genuine disconfirmation looks like in EP:**
  For an observation to count *against* an adaptationist hypothesis, it must show that the trait's design or distribution is inconsistent with the proposed selective history, *given independent knowledge of that history.*

  *   **Example 1: Pregnancy Sickness (Profet's Hypothesis).**
      *   *Hypothesis:* Nausea avoids teratogenic plants during organogenesis.
      *   *Potential Disconfirmation:* If the foods women crave during this period were more toxic than the foods they avoid, or if the foods they avoid are harmless to fetuses at consumed doses. (This was actually tested; the data largely supported the hypothesis, but it *could* have falsified it).
      *   *The Student's Objection:* "Maybe the EEA plants were different."
      *   *The Rebuttal:* We have paleobotanical data. If the hypothesis requires a plant toxicity profile that contradicts the fossil record, the hypothesis is disconfirmed.

  *   **Example 2: Cheater Detection.**
      *   *Hypothesis:* Humans have a dedicated module for social contract violations.
      *   *Potential Disconfirmation:* If performance on Wason selection tasks does not dissociate from general intelligence, or if performance is equally good on deontic rules that are not social contracts (e.g., precautionary rules about danger).
      *   *The Student's Objection:* "Maybe the module is triggered by danger too."
      *   *The Rebuttal:* Then it's not a *cheater detection* module; it's a *hazard avoidance* module. The specific functional attribution is falsified even if the existence of *some* module is saved.

  *   **Example 3: Sex Differences in Jealousy.**
      *   *Hypothesis:* Men fear sexual infidelity (cuckoldry); women fear emotional infidelity (resource diversion).
      *   *Potential Disconfirmation:* If the effect disappears in cultures with high paternity certainty or matrilineal resource transmission, *and* cannot be explained by known universal constraints.
      *   *The Student's Objection:* "Maybe the EEA was still patriarchal."
      *   *The Rebuttal:* Anthropological data on hunter-gatherer variance constrains what we can assume about the EEA. If the hypothesis requires a universal EEA condition that anthropology shows was variable, the "universal adaptation" claim is weakened or falsified.

  ### Addressing the "Proves Too Much" Worry

  You noted that this logic threatens geology and cosmology. It does not, provided you apply the same standard to them.

  *   **Geology:** A geologist hypothesizes a glacier moved a boulder. A skeptic says, "Maybe an alien moved it." The geologist says, "That requires auxiliary assumptions about aliens that lack independent evidence."
  *   **Cosmology:** A cosmologist infers dark matter from galactic rotation. A skeptic says, "Maybe gravity works differently there." The cosmologist says, "That requires modifying General Relativity, which is constrained by solar system data."

  In all historical sciences, **consilience** is the guardrail. You can save a hypothesis by adjusting auxiliaries, but only if those adjusted auxiliaries cohere with evidence from other fields. The student's Premise (3) fails because it ignores the interdisciplinary constraints on the auxiliaries. EP is not unscientific because it infers the past from the present; it risks being unscientific if it infers the past from the present *while ignoring what we know about the past from archaeology and primatology.*

  ### The Cost of Rejecting Premise (3)

  If you take this line in your seminar, you incur specific commitments. You cannot simply say "EP is fine." You must distinguish between **Armchair EP** and **Empirical EP.**

  1.  **You must concede that "Just-So Stories" exist.**
      You have to admit that there *is* a body of literature in EP that violates the constraint on auxiliary assumptions. There are papers that assume an EEA condition contrary to archaeological evidence, or posit a module without looking for neural or developmental constraints. You must classify *that* work as unscientific (or pre-scientific) according to Premise (1). This builds credibility with your skeptics.

  2.  **You commit EP to Interdisciplinary Constraint.**
      You are arguing that EP is scientific *only insofar as* it binds itself to the findings of paleoanthropology, comparative primatology, and behavioral genetics. If an EP hypothesis requires a view of the EEA that archaeologists reject, the EP hypothesis must yield. This shifts the burden of proof: the EP researcher must demonstrate that their auxiliary assumptions are independently plausible.

  3.  **You refine Premise (1) (Slightly).**
      While you want to keep (1), you should nuance it to avoid naive falsificationism. A better formulation is: *"A hypothesis is scientific only if it is embedded in a network of auxiliary assumptions that are themselves independently testable."* This preserves the asymmetry requirement but acknowledges the Duhem-Quine problem. It shifts the focus from "Can I imagine a world where this is false?" to "Does the total system of beliefs required to make this true conflict with established evidence?"

  ### Pedagogical Strategy

  When you return to the seminar, I suggest the following move:

  1.  **Validate the Student:** Acknowledge that Premise (3) correctly identifies the primary methodological risk in EP. Admit that many practitioners *do* treat auxiliary assumptions as free parameters.
  2.  **Introduce "Independent Testability":** Explain that the demarcation line isn't between "prediction" and "retrodiction," but between "constrained retrodiction" and "unconstrained storytelling."
  3.  **The "Cost" Exercise:** Ask the class to take a famous EP hypothesis (e.g., the Savanna Hypothesis for aesthetic preferences) and list the auxiliary assumptions required to make it work. Then ask: "Which of these auxiliaries are testable *without* referencing the aesthetic preference itself?"
      *   If the answer is "none," it's a just-so story.
      *   If the answer is "some" (e.g., pollen counts, fossil vegetation), it's a scientific hypothesis that stands or falls with that data.

  ### Summary

  Reject **Premise (3)**.
  The claim that "nothing in the method forbids" ad hoc adjustments is false. The method of science forbids adjustments that render auxiliary assumptions inconsistent with independent evidence.
  **The Cost:** You must acknowledge that EP is not a unified block. It is a field containing both scientific programs (which respect independent constraints on the EEA and phylogeny) and metaphysical programs (which do not). Your defense of EP becomes a defense of *rigorous* EP, which is a stronger, more defensible position.
