      *   **Section 3: Live Escape Routes vs. Logical Possibilities:**
          *   *Live:* **Defense Dominance** (tech makes conquest too hard), **Value Divergence** (no incentive to merge), **Diseconomies of Scale** (bigger gets dumber/slower).
          *   *Logical Only:* **Perfect Altruism** (unlikely), **Infinite Resources** (physics says no), **Complete Isolation** (hard in space).

      *   **Section 4: Worked Example of Non-Ceasefire Multipolarity:**
          *   Need something better than "nuclear deterrence."
          *   *Idea:* **The Ecological Niche Model.**
          *   *Scenario:* Different AI civilizations optimize for different computronium structures or physical laws that are incompatible. One likes high temp, one likes low. They don't fight; they trade heat/entropy.
          *   *Institutional Fact:* **Cryptographic Sovereignty.** If an agent can cryptographically prove it will not defect, it doesn't need to be subjugated to ensure compliance. Trustless cooperation allows distinct agents to coexist indefinitely.

      *   **Section 5: The Parochialism Argument:**
