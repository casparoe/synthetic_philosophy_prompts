          *   Method 1 (Endpoints): $P = 1/3$.
          *   Method 2 (Radius distance): $P = 1/2$.
          *   Method 3 (Midpoint area): $P = 1/4$.
      *   *Constraint:* Need to ensure they can measure "Long" vs "Short" easily.
      *   *Solution:* Pre-print circles with the inscribed equilateral triangle faintly visible. If the chord crosses the inner triangle boundary (or doesn't touch the inner triangle?), wait.
      *   *Standard:* Chord > Side of Triangle.
      *   *Visual Aid:* The inscribed triangle divides the circle.
      *   *Easier Check:* For Method 2 (Radius), the cutoff is $R/2$. For Method 3 (Midpoint), the cutoff is a circle of radius $R/2$.
      *   *Simplest Check for All:* Provide a template with the "Long Chord Zone" shaded or marked.
      *   *Actually, best visual:* The side of the equilateral triangle is at distance $R/2$ from the center.
      *   *Let's standardize the check:* "Does your chord cross the inner circle of radius $R/2$?" (This works for Midpoint method). "Is the distance from center less than $R/2$?" (Works for Radius method).
      *   *Universal Check:* Provide a transparent overlay with the inscribed triangle. If the chord is longer than the triangle side, it's a "Hit".

  5.  **Materials List:**
      *   Pre-printed circles (A4 paper).
