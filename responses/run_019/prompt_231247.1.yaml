  2.  **Deconstruct Bertrand's Paradox for a Workshop:**
      *   The paradox arises because "random chord" isn't a well-defined physical process.
      *   The three classic methods are:
          1.  Random endpoints (Uniform on circumference). Probability = 1/3.
          2.  Random radius/angle (Uniform distance from center). Probability = 1/2.
          3.  Random midpoint (Uniform in area). Probability = 1/4.
      *   *Challenge:* How to make these physical and distinct without heavy math?
