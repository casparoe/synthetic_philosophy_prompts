      *   *Wait, the "Long Chord" condition for Midpoint method:* The midpoint must be within $R/2$ of the center.
      *   *So:* Group 3 just needs to check if their poked point is in the inner circle. But to make it feel like a chord activity, have them draw the chord corresponding to that midpoint.
      *   *Tool:* A ruler with a marked center. Align center with poke, align ruler perpendicular to the radius line.
      *   *Okay, I will provide a template with concentric circles to make the "Hit" check obvious for all groups.*
      *   *Circle 1:* Main Circle ($R$).
      *   *Circle 2:* Inner Circle ($R/2$).
      *   *Rule:* If the chord crosses the Inner Circle, it's Long?
          *   Method 1 (Endpoints): Chord is long if it crosses the inner circle? No. A chord can cross the inner circle and be short? No. If a chord crosses the inner circle ($R/2$), its distance from center is $< R/2$, so it is Long.
          *   Method 2 (Radius): Distance $< R/2$ means Long.
          *   Method 3 (Midpoint): Midpoint inside $R/2$ means Long.
      *   *Universal Visual:* **If your chord enters the Inner Circle, it is a HIT.**
      *   *Wait, check Method 1:* If I pick two endpoints, the chord is long ($> \sqrt{3}R$) iff the distance from center $< R/2$. Yes. So the condition "Distance from center $< R/2$" is universal for "Long Chord".
      *   *Visual Aid:* Print the circles with the inner $R/2$ circle shaded differently.
      *   *Rule for students:* "Does your chord pass through the shaded inner circle?"
