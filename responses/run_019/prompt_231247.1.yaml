      *   Method 1 (Endpoints): $1/3$ (~33%).
      *   Method 2 (Radius): $1/2$ (50%).
      *   Method 3 (Midpoint): $1/4$ (25%).
      *   *Wait, Method 3 (Midpoint)*: Uniform distribution over the *area*. The area of the inner circle ($R/2$) is $\pi (R/2)^2 = \pi R^2 / 4$. Total area $\pi R^2$. Ratio is $1/4$.
      *   *Wait, Method 1 (Endpoints)*: Fix one point. The other point must fall in the arc of $1/3$ of the circumference to make a long chord. Probability $1/3$.
