      *   *Method 2 (Radius/Distance):* Pick a random radius, then a random point along it. *Physical:* Drop a straw? No. *Better:* Pick a random distance from center (0 to R). Use a ruler.
      *   *Method 3 (Midpoint):* Pick a random point inside the circle. *Physical:* Throw a beanbag? Too messy. Drop a pen? *Better:* Grid method or "blind drop" on paper. Let's go with "Blind Drop" (close eyes, poke pencil).
      *   *Wait, simplicity is key for math-phobes.*
      *   *Revised Method 1 (Endpoints):* Use a paper circle with degree markings. Roll two dice (or pick numbers) to get angles. Connect them.
      *   *Revised Method 2 (Radial):* Pick a random angle, then a random distance from center. *Actually, the classic 1/2 solution is fixing the direction and choosing distance uniformly.* Let's simplify: Pick a random distance from the center (0 to Radius) along a fixed vertical line.
      *   *Revised Method 3 (Midpoint):* Pick a random point anywhere in the circle. If it's the midpoint, draw the chord perpendicular to the radius. *Physical:* Drop a grain of rice? Poke a hole? Let's use the "Poke a Hole" method.

      *   *Refinement for Robustness:*
          *   Group A (Endpoints): Pick two random numbers 0-100 on the perimeter scale. Connect.
          *   Group B (Radius): Pick one random number 0-100 on a radius ruler. Draw chord perpendicular to that radius at that point.
          *   Group C (Midpoint): Poke a random spot inside the circle. Draw chord where that spot is the midpoint.

