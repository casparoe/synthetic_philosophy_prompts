answer: |-
  **MEMORANDUM**

  **TO:** Graduate Student Union Council
  **FROM:** Finance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Conference Travel Fund Restructuring

  **Bottom Line Up Front**
  The Finance Committee recommends **adopting the "declaration model" on a provisional 18-month pilot basis**, with three specific modifications to limit liability. We cannot settle the theoretical debate over whether trust is a precondition or an outcome of institutions, but we can structure this policy to test the mechanism locally without risking the solvency of the fund.

  **The Problem**
  The current travel fund ($60k/year) is inefficient. Between pre-approval forms, physical receipt collection, and multi-signature workflows, we estimate 15–20% of the fund's value is consumed by administrative opportunity costs (staff time, delayed reimbursements, and students opting out due to hassle). Satisfaction is low; compliance is high, but only because the barriers to entry are prohibitive.

  **The Proposal**
  A committee member proposes shifting to a Nordic-style "declaration model." Students attest to expenses without upfront receipts. The Union conducts random 5% audits. Confirmed fraud results in permanent ineligibility and referral to the Dean.

  **The Core Disagreement: Trust as Input vs. Output**
  The committee split on a fundamental causal question.

  *   **The Skeptics' View (Trust as Input):** This group argues that high-trust systems work in Scandinavia because of deep-seated cultural norms and strong state capacity, not because of the policy design itself. They argue that importing the *form* of a high-trust institution without the *substrate* of high-trust culture invites moral hazard. In this view, removing guards doesn't create trust; it creates opportunity.
  *   **The Proponents' View (Trust as Output):** This group argues that bureaucratic suspicion creates perverse incentives. By treating students as potential fraudsters, we signal that cheating is the rational response to oversight. Simplifying the process signals community membership, which increases normative pressure to comply.

  **Committee Assessment**
  The Union Council cannot adjudicate the macro-sociological question of whether institutions create culture or vice versa. However, we are not managing a welfare state; we are managing a $60k micro-grant program within a single university.

  The Skeptics are right that we cannot assume Scandinavian levels of social capital exist here. However, the Proponents are right that our current system is self-defeating. The status quo is not "safe"; it is merely *visibly* safe while quietly wasting resources.

  We believe a middle path is possible. We can treat trust as a **managed risk** rather than a binary switch. We recommend adopting the declaration model, but acknowledging the Skeptics' concern by limiting the "blast radius" of potential fraud.

  **Recommendation: Adopt with Modifications (Pilot Program)**
  We recommend moving to the declaration model immediately, subject to the following concrete, low-cost modifications:

  1.  **Hard Cap Per Claim:** Reimbursements via declaration are capped at $1,500 per trip. Anything above requires standard receipt documentation. This limits the incentive for large-scale fraud while covering the majority of standard conference travel.
  2.  **Post-Trip Attestation Window:** Claims must be submitted within 30 days of return. Late claims revert to the standard audit process. This prevents "retroactive" budgeting that often leads to fudged numbers.
  3.  **Transparency Dashboard:** Instead of auditing individuals, we audit the *aggregate*. We will publish a simple quarterly summary: total funds disbursed, number of claims, and audit results. If the total disbursement spikes >10% over historical averages without a corresponding increase in applicants, the pilot pauses.

  **Evaluation & Exit Strategy**
  A decision you can't revisit isn't a decision; it's a gamble. We propose the following metrics to determine if the pilot succeeds or fails after 18 months:

  *   **Fraud Rate:** If the random audit reveals material misrepresentation in >2% of checked claims, the program reverts to the status quo.
  *   **Utilization:** If the number of unique students utilizing the fund does not increase by at least 15%, the administrative savings are not materializing as increased access.
  *   **Admin Time:** We will track staff hours spent on processing. If time saved is negligible, the new model is functionally identical to the old one but riskier.

  **Conclusion**
  The Skeptics are correct that we cannot legislate a culture of honesty overnight. But the Proponents are correct that our current culture of suspicion is expensive and demoralizing. This pilot allows us to act *as if* trust exists to see if it grows, while keeping the financial risk contained. If the community abuses the privilege, we will know within two budget cycles, and we can reverse course. If they rise to the occasion, we free up money and time for actual travel.

  **Vote Required:** Approval to implement Pilot Program for FY2024–2025.
