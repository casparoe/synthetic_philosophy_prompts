      *   **Conclusion:** Bridging the gap. Science/Philosophy asks what experience *is*. Fiction asks how we *live* it. Both meet in the complexity of the report. Acknowledge the dispute (don't claim Dennett is definitely right). Final thought on the value of the conference.

