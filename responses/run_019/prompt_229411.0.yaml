      *   *The Resolution:* Dennett says experience *is* the tangle of judgments/reactions. Novelists write the tangle. Therefore, novelists are actually doing exactly what constitutes reality, according to Dennett. The Chase and Sanborn ambiguity *is* the stuff of character development.

