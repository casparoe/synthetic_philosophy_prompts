prompt: |-
  I curate a permanent exhibition at a regional museum covering the destruction of an indigenous community in the 1890s: a massacre of several hundred people, followed by the seizure of their land, the removal of their children to distant boarding schools where their language was forbidden, and the burning of their religious objects. A descendants' association has petitioned us to change the exhibit's main label from "massacre and dispossession" to "genocide", and our board is split. The dispute keeps circling back to a passage in Chapter IX of Raphael Lemkin's Axis Rule in Occupied Europe (1944), which one trustee has paraphrased to the rest of us: Lemkin there describes genocide as unfolding in two phases, the first being the destruction of the national pattern of the oppressed group, and the second the imposition of the oppressor's own pattern, whether on the surviving population or on the emptied territory itself. His opponents on the board reply that whatever Lemkin originally meant, the word as now used in law and journalism is tied to the physical extermination of a group, and that a museum has no business stretching it further.

  I am not asking you to adjudicate the history. What I want to understand is what each side of our dispute is quietly committed to. Does the trustees' caution presuppose that "genocide" is a natural kind whose members can be discovered by checking features against a definition, while the petitioners treat it instead as a moral verdict or a legal conclusion? Does Lemkin's two-phase description, as paraphrased above, actually settle anything about our label, or does it merely push the argument back one step, onto what counts as the destruction of a "pattern"? And what view of what words do — in particular of whether naming an atrocity performs some further act of recognition or obligation beyond describing it — would make sense of the fact that everyone at the table, on both sides, behaves as though a great deal hangs on one word? Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A regional museum curator is facing a dispute over an exhibition label regarding the destruction of an indigenous community in the 1890s.
      *   **The Dispute:** Descendants want the label changed from "massacre and dispossession" to "genocide." The Board is split.
      *   **The Core Text:** A specific paraphrase of Raphael Lemkin's *Axis Rule in Occupied Europe* (1944), Chapter IX (two phases: destruction of national pattern, imposition of oppressor's pattern).
      *   **The Arguments:**
          *   *Pro-"Genocide" (Petitioners/Some Trustees):* Rely on Lemkin's broader definition (cultural/national pattern destruction).
          *   *Anti-"Genocide" (Opposing Trustees):* Argue current legal/journalistic usage ties it to physical extermination; museums shouldn't stretch definitions.
      *   **The Task:** Do *not* adjudicate the history. Instead, analyze the underlying philosophical/linguistic commitments of each side.
      *   **Specific Questions to Address:**
          1.  Does the trustees' caution presuppose "genocide" as a natural kind vs. petitioners treating it as a moral verdict/legal conclusion?
          2.  Does Lemkin's two-phase description settle the label, or push the argument back to defining "pattern"?
          3.  What view of what words *do* (speech act theory/recognition/obligation) explains why everyone acts as if so much hangs on one word?
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Philosophical/Linguistic Issues:**

      *   **Question 1: Natural Kind vs. Moral Verdict.**
          *   *Trustees' Caution:* They argue the word is "tied to physical extermination" in law and journalism. This suggests they view the word as having a fixed extension based on consensus or legal statute (like the 1948 UN Convention). They are wary of "stretching." This aligns somewhat with a "natural kind" view (there is a real thing called genocide, and we must check if the facts fit), but more accurately, it's a *stipulative* or *institutional* view (the law says X, we must follow X).
          *   *Petitioners:* They invoke Lemkin's original intent (cultural destruction). This suggests they view the term as capturing a *moral reality* or a *sociological truth* that transcends current legal narrowness. They are treating it as a moral verdict (this was a supreme crime) rather than just a legal classification.
          *   *Nuance:* It's not strictly "natural kind" vs. "moral verdict." Both sides are arguing about *definition*. One side argues for *current usage* (descriptivism/positivism), the other for *original intent/moral scope* (normative/interpretive).

      *   **Question 2: Lemkin's Two-Phase Description.**
          *   Does it settle it? No.
          *   Why? Because "national pattern" is vague. What constitutes a pattern? Language? Religion? Kinship? Land use?
          *   The dispute shifts from "Did mass killing happen?" to "Was the national pattern destroyed?"
          *   The opposing trustees would argue the "pattern" survived or wasn't the target in the way Lemkin meant. The petitioners argue the boarding schools and land seizure *are* the destruction of the pattern.
          *   So, Lemkin pushes the argument back to the interpretation of "pattern" and whether the 1890s events fit that specific sociological model.

      *   **Question 3: What Words Do (Speech Act Theory/Performativity).**
          *   Why does the word matter so much?
          *   *Constative vs. Performative:* A label isn't just describing (constative); it's doing something (performative).
          *   *Recognition:* Calling it "genocide" validates the descendants' pain in a specific way. It places the event in a hierarchy of suffering.
          *   *Obligation:* "Genocide" triggers specific moral duties (remembrance, reparations, apology) that "massacre" might not. It implies state responsibility or systemic intent rather than isolated violence.
          *   *Illocutionary Force:* The act of labeling is an act of authority. Who has the right to name? The museum? The descendants? The law?

  3.  **Drafting the Response (incorporating British English):**

      *   *Tone:* Academic, empathetic, analytical, neutral (as requested).
      *   *Spelling/Grammar:* British (e.g., *labelled, centre, programme, whilst, whilst, analyse*).
      *   *Structure:*
          1.  Introduction: Acknowledge the gravity and the nature of the query (philosophical/linguistic analysis).
          2.  Section 1: Natural Kind vs. Moral Verdict (Addressing the first specific question).
          3.  Section 2: Lemkin's Two Phases (Addressing the second specific question).
          4.  Section 3: The Performative Power of Words (Addressing the third specific question).
          5.  Conclusion: Summarise the impasse not as historical but as conceptual.

  4.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction on "Natural Kind":* I need to be careful not to say the Trustees *definitely* believe it's a natural kind. They might just be legal positivists. I should phrase it as: Their caution *functions as if* it were a natural kind with fixed boundaries, whereas the petitioners treat it as a concept requiring moral interpretation.
      *   *Lemkin:* Ensure I highlight that Lemkin's definition is actually *broader* than the 1948 UN Convention, which is why the Trustees are resisting (they are likely thinking of the UN Convention, not Lemkin's book). The prompt mentions the Trustees cite "law and journalism," which usually refers to the 1948 Convention. Lemkin's 1944 text is the counter-argument.
      *   *Performativity:* Use Austin or Searle concepts implicitly. The word "genocide" is not just a description; it's a verdict. It changes the relationship between the museum, the state, and the descendants.

  5.  **Final Polish (checking British English constraints):**
