answer: |-
  Your query touches upon the philosophy of language, the sociology of classification, and the ethics of memory. You are asking not whether the events constitute genocide, but what work the word *genocide* is being asked to do in this room, and what assumptions underlie the resistance to or acceptance of it. Below is an analysis of the commitments implicit in each position, the utility of Lemkin's text, and the performative weight of the label.

  ### 1. Natural Kinds versus Moral Verdicts

  You ask whether the trustees' caution presupposes that 'genocide' is a natural kind, whilst the petitioners treat it as a moral verdict. This is a perceptive distinction, though it requires slight refinement.

  The trustees who resist the label appear to operate under a form of **linguistic positivism**. By arguing that the word is 'tied to the physical extermination of a group' in law and journalism, they are treating the definition as fixed by institutional consensus (specifically the 1948 UN Convention, though they may not cite it directly). For them, the word functions like a scientific category with necessary and sufficient conditions. If the 'facts' (mass killing) do not meet the threshold of the 'definition' (intent to destroy the group in whole or in part, primarily physically), then applying the label is an error of categorisation. They are committed to the view that language should mirror a stable, external reality, and that stretching a term dilutes its precision. Their anxiety is that if the category becomes too elastic, it loses its descriptive power.

  The petitioners, conversely, are treating 'genocide' as a **normative concept**. For them, the term is not merely a box to be ticked based on body counts; it is a moral verdict on the *intent* and the *outcome* of colonial policy. By invoking Lemkin, they are arguing that the *essence* of the crime is the destruction of the group's existence as a cultural and social entity, not merely its biological cessation. They are committed to the view that the word must capture the *harm* suffered, not just the *method* used. To them, restricting the word to physical extermination is a moral failure that renders invisible the specific violence of assimilation and cultural erasure.

  Thus, the dispute is not simply about facts, but about the authority to define. The trustees defer to current legal and journalistic convention; the petitioners defer to the moral origin of the concept (Lemkin) and the lived experience of the descendants.

  ### 2. The Function of Lemkin's Two Phases

  Does Lemkin's description of the two phases settle the argument? It does not. Rather, as you suspect, it displaces the argument onto the definition of a 'national pattern'.

  Lemkin's formulation in *Axis Rule* is indeed broader than the later UN Convention. He conceptualises genocide as a coordinated plan aimed at destroying the essential foundations of the life of national groups. However, by adopting Lemkin's framework, the dispute shifts from 'Did mass killing occur?' to 'Was the national pattern destroyed?'.

  This introduces new ambiguities. What constitutes a 'pattern'? Is it language, kinship structures, land tenure, or religious practice? The opposing trustees might argue that whilst the community suffered terribly, the 'pattern' was not fully destroyed if descendants survive and identify as a group today. They might argue that the 'imposition of the oppressor's pattern' is a standard feature of state-building, distinct from genocide.

  The petitioners, meanwhile, will argue that the removal of children and the banning of language *is* the destruction of the pattern, regardless of biological survival. Consequently, Lemkin's text does not provide a neutral arbiter; it provides a different vocabulary for the same conflict. It pushes the argument back to a sociological question: at what point does cultural suppression become the destruction of a group's existence? Lemkin's authority is invoked to legitimise the broader view, but it does not mechanically resolve the classification of the 1890s events.

  ### 3. What Words Do: Performativity and Obligation

  You ask what view of language makes sense of the fact that everyone behaves as though a great deal hangs on one word. The answer lies in **speech act theory**.

  If words were merely constative (describing a state of affairs), the dispute would be academic. A 'massacre' and a 'genocide' might describe similar bodies on the ground. But in a museum context, labels are **performative**. To name an event is to do something to it.

  *   **Recognition and Validation:** For the descendants, the label 'genocide' performs an act of recognition. It validates their specific trauma as part of a global category of supreme crime. 'Massacre' suggests an event; 'genocide' suggests a system. The shift in language acknowledges that the violence was not an aberration, but a policy.
  *   **Moral Obligation:** The word carries illocutionary force. To classify an event as genocide creates a different set of obligations for the museum and the state. A massacre demands remembrance; a genocide demands explanation, accountability, and often restitution. The trustees' caution may stem from an unspoken awareness that accepting the label commits the institution to a more demanding ethical posture regarding repatriation, funding, or political advocacy.
  *   **Hierarchy of Suffering:** In the public sphere, 'genocide' occupies the apex of a hierarchy of atrocities. To apply the label is to assert that this community's suffering is of the highest order. The trustees' resistance may reflect a fear of 'inflation'—the worry that if this is genocide, the word loses its capacity to shock. The petitioners' insistence reflects a fear of 'erasure'—the worry that if this is not genocide, their suffering is relegated to a secondary status.

  ### Conclusion

  The stalemate at your board table is not primarily historical; it is conceptual. The trustees are committed to a view of language as a stable tool for description, bound by current legal conventions. The petitioners are committed to a view of language as a vehicle for moral truth and restorative justice. Lemkin's text offers a bridge, but it merely relocates the disagreement to the interpretation of 'cultural destruction'.

  Ultimately, the intensity of the dispute confirms that the exhibition label is not a caption, but a verdict. Both sides understand that to choose the word is to choose the relationship the museum will have with the past, and with the living descendants of those who suffered it. The word 'genocide' does not just describe the 1890s; it dictates the duties of the present.
