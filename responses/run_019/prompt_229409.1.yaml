prompt: |-
  You are a professional philosopher specializing in the philosophy of psychiatry and the philosophy of classification, with a particular interest in how labels feed back into the people they are applied to. I am a software engineer with no formal philosophy background, so please do not assume I know the literature; just engage with the cases and the principle. I work on a clinical decision-support tool that suggests psychiatric screening labels for primary-care clinicians, and I keep running into the same puzzle. A label is not a neutral description. Once applied, it changes how clinicians interpret a patient's behavior, how the patient understands themself, and how the patient then behaves; that changed behavior can make the label more or less accurate over time. I have seen this called a looping effect. I have been writing down my own verdicts about concrete cases, and I want to know whether they add up to a coherent principle or whether I am just responding case by case.

  Please take your time. Start by brainstorming several candidate principles before committing to one. Then state your best principle, or a small set of candidate principles, in precise but non-technical language. For each clause of the principle, tell me which of my cases motivates it. Test the principle against every case below, tell me which of my verdicts it preserves and which it forces me to overturn, and then apply it to the two further cases at the end.

  Here are my cases.

  C1. A 16-year-old begins avoiding social situations and reads a lot about social anxiety online. He starts saying he has social anxiety disorder. His parents treat this seriously, he declines invitations by citing the disorder, and within a year his avoidance is much worse. Verdict: applying the label was bad here, because it helped turn ordinary and possibly transient shyness into an identity that entrenched the avoidance.

  C2. A 34-year-old with similar underlying symptoms—avoidance, blushing, fear of judgment—is formally diagnosed with generalized anxiety disorder by a psychiatrist. The diagnosis is a relief: it explains years of difficulty, ends self-blame, and connects him to treatment that helps. Verdict: applying the label was good here.

  C3. At a school where ADHD diagnoses are common, an energetic 8-year-old is quickly referred and diagnosed. Once labeled, his restlessness is re-read by teachers as a symptom rather than as boredom with an under-stimulating classroom, and he starts describing himself as someone who cannot focus without medication. Verdict: applying the label was bad here.

  C4. A 26-year-old with a genuine lifelong history of focus and organization problems receives an ADHD diagnosis. Medication measurably improves his ability to hold a job, and he says the diagnosis gave him a framework and tools rather than an excuse. Verdict: applying the label was good here.

  C5. A woman is diagnosed with borderline personality disorder after a brief emergency-room visit following a single episode of self-harm. The label stays in her chart for years. She reports that later clinicians stop taking her physical complaints seriously and describe her as manipulative. Verdict: applying the label was bad here—not because the category is always bad, but because it was assigned quickly on thin evidence and then acted as a permanent filter that distorted her later care.

  C6. A woman is diagnosed with autism spectrum disorder in her thirties. The label leads her to reinterpret her history as burnout rather than personal failure; she starts using accommodations such as headphones and fewer obligatory social events; and her functioning improves. The label clearly changed her, but the change was for the better. Verdict: applying the label was good here.

  C7. A patient with chronic widespread pain and normal test results is told she has somatic symptom disorder and is offered no clear treatment plan. She feels dismissed. Later another specialist uses the framing of central sensitization, explains it in physiological terms, and gives her a graded exercise plan. She accepts it and improves. Verdict: the first label was applied badly and the second applied well, even though both describe roughly the same underlying facts.

  My questions are these. (1) Is there a coherent principle that captures all or nearly all of these verdicts? (2) Which of my verdicts, if any, does the principle force me to drop? (3) What does the principle say about these two further cases, on which I am undecided?

  C8. Should a clinician tell an asymptomatic 55-year-old that they have pre-clinical Alzheimer's disease on the basis of a blood biomarker, when the prediction is uncertain, any symptoms may be decades away, and no treatment exists? I lean against, because the label opens no useful path and risks a harmful loop; but I also worry that withholding risk information disrespects the patient.

  C9. A person who thinks of herself as deeply empathetic starts calling herself highly sensitive rather than anxious. This is not an official psychiatric label, but I can see the same looping effect: it changes how she understands her reactions and how she manages them. Does your principle apply outside official psychiatric classification, or only inside it?

  (4) I keep organizing my thinking with three factors: descriptive accuracy, the quality of the application process, and the foreseeable consequences of applying the label, including the direction of the loop. Is one of those factors doing all the work, or do they need to be combined? Be honest about which of my verdicts cannot be accommodated by the principle you endorse.

  The very last line of your answer should be a single machine-readable line beginning with Verdict:, followed by a short name for your endorsed principle and a one-sentence statement of it.
