      *   *Step 2: Core Rights Violation.* Does it violate fundamental human rights recognized *now* (Constitution/International Treaties)?
      *   *Step 3: Intent/Purpose.* Was the law designed to oppress a specific group or consolidate tyranny? (Distinguishes evil intent from mere bad policy).
      *   *Step 4: Reliance/Chaos.* If we void this, does it collapse the legal order? (Hart's stability argument).
