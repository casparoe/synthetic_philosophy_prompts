answer: |-
  # The Legitimacy Threshold Protocol (LTP)

  **Purpose:** To distinguish between *unjust laws* (which judges must apply) and *wicked laws* (which are void *ab initio* despite procedural validity).
  **Time Allocation:** 20 Minutes.
  **Usage:** Mandatory for any case where a party challenges the moral validity of a procedurally correct statute.

  ### The Procedure

  **Step 1: The Complicity Bar (5 Minutes)**
  *Question:* Does applying this rule require the Court to personally order an act that is a crime under the current Penal Code or International Human Rights Law (e.g., torture, extrajudicial killing, enslavement)?
  *   **YES:** **STOP.** The rule is not law. It is a criminal order. Do not apply. Write judgment citing current Penal Code/International Treaties.
  *   **NO:** Proceed to Step 2.

  **Step 2: The Personhood Bar (5 Minutes)**
  *Question:* Was the primary purpose of this rule to strip a specific group of people of their legal standing, humanity, or equality before the courts based on race, religion, political opinion, or ethnicity?
  *   **YES:** **STOP.** The rule is not law. It denies the "inner morality of law" (Fuller). Do not apply. Write judgment citing Constitutional equality clauses and the transitional justice mandate.
  *   **NO:** Proceed to Step 3.

  **Step 3: The Functionality Filter (5 Minutes)**
  *Question:* Is this rule part of the basic administrative machinery of the state (tax, traffic, contracts, property registration) that, if voided, would cause immediate systemic collapse or chaos for ordinary citizens unrelated to the regime's oppression?
  *   **YES:** **STOP.** The rule is Law. You must apply it. The need for social order outweighs the taint of the source. (See *Value Handoff* below).
  *   **NO:** Proceed to Step 4.

  **Step 4: The Value Handoff (5 Minutes)**
  *Context:* The rule is procedurally valid, does not compel criminal complicity, does not deny personhood, but is still morally repugnant or politically oppressive.
  *Instruction:* The Procedure **cannot** decide this for you. This is the zone of judicial discretion.
  *   **Action:** You must choose between **Legal Certainty** (apply the rule as written) or **Equitable Interpretation** (interpret the rule as narrowly as possible to mitigate harm without declaring it void).
  *   **Requirement:** You must explicitly state in your written order: *"This Court acknowledges the moral cost of this decision. We apply/interpret this rule based on [Value Choice], not because it is morally good."*
  *   **Warning:** If you choose to void the law here, you are making new law, not finding it. Expect appeal.

  ***

  ### What This Procedure Cannot Settle
  This protocol cannot resolve the **moral residue** of Step 3 and Step 4. It cannot tell a judge how to sleep at night after enforcing a valid but unjust rule. It draws a line between "wickedness" (void) and "injustice" (valid), but it cannot remove the stain of the injustice. It prioritizes the stability of the new democracy over the moral purity of the judiciary in borderline cases.

  ***

  ### Case Applications

  #### Case 1: The Old Denunciation Law
  *Statute:* A procedurally valid decree from the dictatorship encouraging citizens to report "subversive activity" by neighbors, with rewards paid from the confiscated assets of the accused.
  *   **Step 1 (Complicity):** **YES.** Applying this requires the court to process punishments based on secret reporting and confiscate assets without due process, acts that likely constitute crimes against humanity or violations of current due process statutes.
  *   **Result:** **STOP. NOT LAW.**
  *   **Judicial Outcome:** The judge declares the statute void *ab initio*.
  *   **Judge's Reaction:** Satisfied. This aligns with their moral intuition.

  #### Case 2: The Old Petty Tax Regulation
  *Statute:* A 15% levy on commercial signage, enacted by the dictatorship's legislature using proper voting procedures, revenue used for general state coffers.
  *   **Step 1 (Complicity):** **NO.** Collecting tax is not a crime.
  *   **Step 2 (Personhood):** **NO.** It applies to all commercial entities equally; it does not target a group for dehumanization.
  *   **Step 3 (Functionality):** **YES.** Voiding all tax laws from the old regime would collapse state revenue, endangering the new democracy's ability to function.
  *   **Result:** **STOP. LAW.** (Step 3 Mandate).
  *   **Judicial Outcome:** The judge must enforce the tax.
  *   **Judge's Reaction:** **HATED.** The judges want to purge the regime's taint. Being forced to collect the dictator's tax feels like collaboration. The procedure forces them to swallow this to prevent chaos.

  #### Case 3: The Current Eviction Statute
  *Statute:* A law passed by the *new* democratic legislature allowing police to evict tenants without a hearing if the landlord claims "urgent need." Procedurally valid.
  *   **Step 1 (Complicity):** **NO.** Eviction is not a crime, though it is harsh.
  *   **Step 2 (Personhood):** **NO.** It does not strip legal personhood, though it limits property rights.
  *   **Step 3 (Functionality):** **NO.** While housing is important, voiding this specific statute won't collapse the state.
  *   **Step 4 (Value Handoff):** **ACTIVE.** The procedure stops here. The law is valid, but unjust.
  *   **Judicial Outcome:** The judge must choose.
      *   *Option A:* Apply the law (Prioritize Separation of Powers).
      *   *Option B:* Interpret "urgent need" so narrowly it requires a hearing (Prioritize Equity).
      *   *Requirement:* The judge must write: *"I am applying this valid law despite its injustice,"* OR *"I am narrowing this law to prevent injustice."*
  *   **Judge's Reaction:** **Mixed/Anxious.** They hate that the new democracy passed a wicked law. The procedure forces them to own the choice. They cannot hide behind "it's not law." They must admit it *is* law, but they can choose how to wield it.

  ***

  ### Instructor's Note for the Induction Program
  When you present this, emphasize **Case 2**. Tell them: *"You will hate collecting the dictator's tax. You will feel dirty. But if you refuse, the schools close and the police go unpaid. Your discomfort is the price of the transition. The Procedure protects you from the worst evil (Case 1), but it forces you to bear the burden of the mundane evil (Case 2) so the state survives."*

  This distinguishes the **Radbruch Formula** (extreme injustice is no law) from **Legal Positivism** (law is law), giving them a tool to manage the boundary without requiring them to be philosophers.
