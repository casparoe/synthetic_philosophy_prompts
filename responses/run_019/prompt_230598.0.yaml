      *   *Legal Positivism (Hart):* Law is law if enacted correctly, regardless of morality. Separation of law and morals.
      *   *Natural Law/Fuller:* Law has an inner morality. Extreme injustice is not law.
      *   *Radbruch Formula:* Positive law prevails unless the conflict with justice reaches an "unbearable" level, or the law deliberately denies equality (the core of justice).
