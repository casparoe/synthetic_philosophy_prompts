      *   **Text:** John Stuart Mill's *On Liberty*, Chapter 2 ("Of the Liberty of Thought and Discussion").
      *   **Specific Passage:** Mill's claim that "truth always triumphs over persecution" is a "pleasant falsehood" and that history shows truth *can* be suppressed for centuries.
      *   **User's Concern:** This seems to undermine the standard justification for free speech (the "marketplace of ideas" where truth wins). If truth *can* be crushed, why allow dangerous/false ideas to circulate? Is this a contradiction/tension in Mill's argument?
