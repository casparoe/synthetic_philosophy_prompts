answer: |-
  ### 1. The Verdict: Underdetermined, but Leaning "Not the Same"
  To stay strictly consistent with the *text* of her earlier verdicts, Mara should rule that the *Kalliopi* is **not the same boat**. However, logically speaking, her prior cases **underdetermine** the answer.

  Here is the tension:
  *   **The Pattern:** In all three prior cases (*Merope*, Van, Bridge), Mara ruled "Same Artifact" when peripheral parts were replaced gradually *provided that* the structural core (keel/ribs, chassis/frame, load-bearing beams) remained original.
  *   **The Logic:** In legal and logical reasoning, if a specific fact (the survival of the core) is cited in every precedent leading to a specific verdict, it is presumed to be part of the *ratio decidendi* (the reason for the decision). This establishes that Core Survival is a *sufficient* condition for identity.
  *   **The Gap:** None of the prior cases established whether Core Survival is a *necessary* condition. Mara has never ruled on a case where the core was replaced.

  If Mara rules **"Not the Same,"** she treats the survival of the structural core as a necessary condition. This is the conservative, *stare decisis* approach: she respects the distinguishing facts of her prior rulings.

  If Mara rules **"Same,"** she treats the survival of the core as merely incidental, prioritizing the continuity of service over material constitution. This expands her case law but risks inconsistency with the explicit details she previously highlighted.

  ### 2. The Closest Analog: The *Merope*
  The **_Merope_ sloop** is the closest precedent.
  *   **Similarities:** Both are wooden boats; both underwent gradual plank replacement during continuous service; both involved a distinction between "skin" (planks) and "bone" (frame/keel).
  *   **Distinguishing Fact:** In the *Merope* case, the keel and ribs were *never touched*. In the *Kalliopi*, the ribs (the structural core) are being replaced.

  Because the *Kalliopi* removes the very feature that saved the *Merope*'s identity (the original skeleton), the *Merope* precedent actually argues *against* the *Kalliopi* being the same boat, unless Mara decides to overrule the importance of the skeleton.

  ### 3. The Principles at Stake
  Since the prior cases underdetermine the outcome, Mara's verdict on the *Kalliopi* will formally adopt one of two competing principles of artifact identity:

  *   **If she rules "Same Boat": She adopts Spatio-Temporal Continuity.**
      *   **Principle:** Identity is maintained by an uninterrupted history of function and gradual change. The specific matter is irrelevant as long as the transition is continuous and the form/function persists.
      *   **Implication:** A boat is a "process" or an "event," not a specific collection of atoms. You could eventually replace 100% of the matter, and it remains the same artifact.

  *   **If she rules "Not the Same Boat": She adopts Structural Essentialism.**
      *   **Principle:** Identity is anchored to specific "essential" parts (the structural core). Peripheral parts (planks, seats, treads) are accidental and replaceable, but the "bone" of the artifact is essential.
      *   **Implication:** Once the essential material is gone, the original artifact ceases to exist, even if the new one looks and acts exactly the same. The *Kalliopi* becomes a replica or a successor vessel.

  ### 4. The Tie-Breaker Case: "The Reassembly"
  To finally settle which principle Mara is actually using, you should bring her the **Reassembly Case** (often called the Hobbes variation of the Ship of Theseus).

  **The Scenario:**
  > "Suppose that during the *Kalliopi*'s renovation, the shipyard *did not discard* the old ribs and planks. Instead, they stored them in a warehouse. Now that the *Kalliopi* is finished with new wood, the shipyard takes the pile of original, discarded wood and reconstructs it into a seaworthy boat using the original plans.
  >
  > We now have two boats:
  > 1.  **Boat A:** The one that has been in continuous summer service (new wood, continuous history).
  > 2.  **Boat B:** The one built from the original scraps (old wood, interrupted history).
  >
  > **Which one is the *Kalliopi*?**"

  **Why this settles it:**
  *   If she picks **Boat A**, she confirms **Spatio-Temporal Continuity** is her true principle (History > Material).
  *   If she picks **Boat B**, she confirms **Material Essentialism** is her true principle (Original Matter > History).
  *   If she says **Both**, she accepts a paradox or a branching identity theory.
  *   If she says **Neither**, she believes identity is destroyed by the split.

  This case forces a conflict between the two principles that the *Kalliopi* case merely hints at, requiring her to explicitly prioritize one over the other.
