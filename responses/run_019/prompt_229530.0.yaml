answer: |-
  You have independently rediscovered one of the most significant debates in the sociology of religion and comparative politics. Your "half-baked thought" is actually a very sophisticated synthesis of theories that academics have been arguing about for the last 40 years.

  There isn't one single word that captures the whole triangle (Establishment vs. Separation vs. Exclusion), but there are specific names for the mechanisms you identified.

  Here is the breakdown of the phenomena you are seeing, the vocabulary for them, and the crucial counterexamples that keep the theory honest.

  ### 1. The US vs. Established Europe: "Religious Economy Theory"
  The pattern you noticed between the US (high religiosity, separation) and England/Denmark/Germany (low religiosity, establishment) is the core of **Supply-Side Theory of Religion** (also called **Religious Economy Theory**).

  *   **The Theory:** Proposed by sociologists like Rodney Stark, Roger Finke, and Laurence Iannaccone in the 1980s/90s.
  *   **The Mechanism:** They argue that religion functions like a market.
      *   **Monopoly (Europe):** When the state sponsors one church (supply), that church becomes a lazy monopoly. It doesn't need to work hard to attract "customers" because it gets tax money and social status by default. The clergy become civil servants. The result is low energy and low attendance.
      *   **Competition (US):** When the state separates from religion, no single church is guaranteed support. Churches must compete for members. They have to work harder, innovate, and demand more from their congregants. This leads to higher overall participation and "energy."
  *   **The German Tax:** You nailed this. The *Kirchensteuer* creates a bureaucratic affiliation. People stay on the rolls to avoid the hassle of opting out, but they don't attend. It inflates the "membership" stats while the pews remain empty.

  **Is this one phenomenon?** Yes. In this framework, state establishment acts as a **subsidy that reduces competition**, leading to a decline in religious vitality.

  ### 2. The US vs. France: "Passive vs. Assertive Secularism"
  You correctly identified that "separation of church and state" is doing two very different jobs in the US and France. Political scientist Ahmet Kuru distinguishes these as:

  *   **Passive Secularism (US):** The state is neutral *among* religions. It steps back to let civil society (including churches) operate freely. The goal is freedom *of* religion. Because the state doesn't fight religion, religion doesn't need to fight the state. It becomes a loud part of civil society but (theoretically) not a direct lever of state power.
  *   **Assertive (or Combative) Secularism (France):** The state actively constructs a secular public sphere to protect the republic *from* religion. This is **Laïcité**. The goal is freedom *from* religion in public spaces.
  *   **The Conflict:** Because Assertive Secularism draws a hard line that religion cannot cross, any attempt by religious people to enter public life (wearing a headscarf, praying in public) is seen as an attack on the state. This politicizes religion. In the US, a politician praying is normal; in France, it is a constitutional crisis.

  **The Line:** The line is **accommodation vs. exclusion**. The US accommodates religious expression in the public square (as long as the state doesn't endorse one); France excludes religious expression from the public square to ensure state neutrality.

  ### 3. The "Taming" Effect: "Vicarious Religion"
  You mentioned that established churches feel like "heritage institutions." British sociologist Grace Davie calls this **Vicarious Religion**.

  In countries like England or Denmark, a large chunk of the population doesn't believe or attend, but they *want the church to be there* for the minority that does, and for national rituals (coronations, funerals, moments of crisis). The church becomes a utility owned by the nation, not a community of believers. This "tames" it because it turns faith into a cultural backdrop rather than a transformative demand.

  ### 4. The Counterexamples (Where your pattern breaks)
  Your hypothesis is strong, but it is not a law of physics. There are obvious cases where state connection does *not* tame religion. This usually happens when religion is tied to **national survival** or **ideological identity** rather than just heritage.

  **A. Poland (Catholicism + State Ties)**
  *   **The Pattern Break:** Poland is deeply Catholic, church attendance is high, and the Church has immense political power, despite having formal ties to the state in the past and strong informal ties now.
  *   **Why:** Under Soviet communism, the Catholic Church was the *only* institution independent of the state. It became the vessel for Polish national identity and resistance. When the state is seen as an oppressor (or recently, as a defender against foreign cultural influence), the Church becomes a fortress, not a heritage museum.
  *   **Lesson:** Establishment tames religion only when the state is stable and uncontroversial. If the nation feels threatened, the state church becomes a rallying point.

  **B. Iran (Theocracy)**
  *   **The Pattern Break:** The state *is* the religion. Religion is not "low temperature."
  *   **Why:** This is not "establishment" in the British sense; it is **Theocracy**. In the British model, the Monarch heads the church, but the church doesn't run the courts or the army. In Iran, religious law *is* state law.
  *   **Lesson:** There is a difference between a *Ceremonial Establishment* (UK/Denmark) and an *Ideological Establishment* (Iran). The former tames; the latter radicalizes.

  **C. Israel (Jewish State)**
  *   **The Pattern Break:** Israel defines itself as a Jewish state. Orthodox Judaism has legal control over marriage and divorce. Yet, religion is a source of constant, high-temperature political conflict.
  *   **Why:** Similar to Poland, religion is tied to security and identity in a conflict zone. Secular vs. Religious is a battle over "Who is a Jew?" and "What is the land for?"
  *   **Lesson:** When religion defines citizenship, it cannot be "tamed" into heritage; it remains a gatekeeper of power.

  **D. Turkey (The Diyanet)**
  *   **The Pattern Break:** Turkey has a state Directorate of Religious Affairs (Diyanet) that pays Imams and writes sermons. Theoretically, this should "tame" Islam.
  *   **Reality:** Under Erdogan, the Diyanet has been used to mobilize political support for Islamism.
  *   **Lesson:** State control only tames religion if the state is stronger than the religious movement. If the religious movement captures the state, the apparatus becomes a megaphone.

  ### 5. Summary: What to call this?
  If you want to sound like you know the literature, you are observing the interaction between **Religious Regulation** and **Religious Vitality**.

  *   **The Real Insight:** You are right that **Separation is not one thing.** The distinction between *Passive Secularism* (US) and *Assertive Secularism* (France) is the critical variable explaining why religion is "loud" in one and "conflictual" in the other.
  *   **The Real Insight:** You are right that **Monopolies tend toward laziness.** The Religious Economy theory holds up well in Western Europe vs. the US.
  *   **The Boundary Case:** Do not assume establishment *always* tames. It only tames when the religion is a **cultural default** (UK/Denmark). It does not tame when the religion is a **political identity** (Poland/Israel/Iran).

  **The Verdict:**
  Your intuition is correct enough to be useful, provided you add the caveat: **State sponsorship tames religion only when the state is secure and the religion is treated as a public utility rather than an ideological fortress.**

  If you need a phrase to describe the whole dynamic, you might call it **"The Paradox of Secular Arrangements."** It captures the idea that the legal structure intended to manage religion (whether by embracing it, separating from it, or banning it) fundamentally alters the *type* of religion that survives.

  *   **Embrace it (UK):** It becomes culture.
  *   **Separate from it (US):** It becomes a marketplace.
  *   **Fight it (France):** It becomes a resistance movement.
