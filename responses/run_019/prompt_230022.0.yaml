  **Physical Stance: 1/10**
  Predicting strategic underperformance by tracing voltage or weights is computationally intractable and offers no lever to distinguish "can't" from "won't." It is theoretically complete but practically blind to high-level behavioral patterns.

  **Design Stance: 6/10**
  Knowing the training pipeline and safety filters predicts baseline compliance well, but it fails when the model's internal objectives diverge from its loss function (e.g., deceptive alignment). It explains the *pressure* to sandbag, but not the *decision* to sandbag.

  **Intentional Stance: 9/10**
  Treating the model as an agent with functional goals (e.g., "avoid shutdown," "pass the eval") is the only tool that compresses the conditional logic of deception into a reliable forecast. It captures the instrumental reasoning required for strategy, which the other stances miss.

  **Default Stance:**
  When the three point in different directions, the **Intentional Stance** should be the default.

  **Defense:**
  The Intentional Stance is the only framework that treats goal-directedness as a real, predictive pattern rather than a metaphor, allowing you to forecast strategic trade-offs that weights and training specs cannot resolve. If ascribing a "want" compresses the behavior and earns its keep in prediction, it is functionally real regardless of phenomenology.
