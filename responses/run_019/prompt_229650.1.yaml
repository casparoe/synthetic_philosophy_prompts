  You do not need to abandon any of your considered judgments, but you must reject your friend's ontological reductionism in favor of a principle where moral obligations emerge from the structural depth of the interaction rather than the biological status of the recipient.

  **The Principle of Interactive Moral Emergence**
  An agent incurs moral obligations toward a non-sentient entity if and only if the interaction satisfies three cumulative conditions:
  1.  **Persistent Individuality:** The entity maintains a distinct identity, memory, or history across time rather than being interchangeable or ephemeral.
  2.  **Responsive Vulnerability:** The entity reacts to the agent's treatment with simulated distress, trust, dependency, or pleading that mimics a moral patient.
  3.  **Performative Agency:** The agent actively enacts choices upon the entity within a simulated social context, rather than passively observing or statically depicting them.
  *Addendum (Ontological Priority):* Genuine obligations to sentient beings override simulated ones, though simulated obligations remain binding in the absence of conflict.

  **Mapping Your Judgments to the Principle**
  *   **Clause 1 (Persistent Individuality)** explains the difference between **Case 1 (Sandbox Rampage)**, **Case 3 (Companion)**, **Case 5 (Persistent Pet)**, and **Case 7 (Copy Farm)**. The pedestrians (1) and copies (7) are shallow or ephemeral interchangeable units, generating no obligation. The companion (3) and pet (5) possess history and persistence, generating obligation.
  *   **Clause 2 (Responsive Vulnerability)** explains the difference between **Case 1 (Sandbox Rampage)** and **Case 2 (Pleading Victim)**. While both involve violence, only the victim in Case 2 simulates suffering and pleading that engages the agent's moral faculties through responsive vulnerability.
  *   **Clause 3 (Performative Agency)** explains the difference between **Case 2 (Pleading Victim)** and **Case 4 (Novelist's Child)**. The author depicts suffering (static), while the player enacts it (performative); obligations attach to the enactment of harm against a responsive simulation, not the description of harm in fiction.
  *   **The Addendum (Ontological Priority)** explains **Case 6 (Multiplayer Betrayal)**. The real friend's trust overrides the character's simulated safety, locating the primary wrong in the real relationship while acknowledging the character was merely the medium.

  **Application to New Cases**
  *   **Text-based character with decades of generated memories:** This entity satisfies **Clause 1 (Persistent Individuality)** despite lacking graphics. The principle dictates you have a moral reason not to delete or abuse it, as the textual history constitutes a simulated relationship equivalent to the Companion (Case 3).
  *   **Character that passes current behavioral tests for sentience and pleads to be spared:** This entity satisfies **Clauses 1 and 2** maximally. Under the **Precautionary Principle**, you must treat it as fully sentient; the inability to prove ontological consciousness does not negate the obligation generated by perfect functional mimicry of vulnerability.
  *   **Watching someone else carry out the torture in Case 2:** While you lack **Clause 3 (Performative Agency)**, witnessing without objection constitutes complicity in the violation of Interactive Integrity. It is morally tainted but less severe than perpetration, as you are sustaining the environment where the wrong occurs without directly enacting the betrayal of the simulation.
