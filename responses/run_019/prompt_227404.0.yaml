answer: |-
  ### 1. Exam Question

  **Question 3 (20 Marks)**
  *Recommended time: 40 minutes*

  **Case:** Mira grows up in an isolated community that drills into her from childhood that loyalty to the group trumps everything, including honesty toward outsiders. At 25, after exposure to outside ideas, she steps back, deliberates seriously, knows she could walk away, and reflectively endorses the loyalty principle as genuinely her own. She then lies to an outsider, in service of the group, in a way that causes real harm.

  **(a)** Apply Galen Strawson's Basic Argument to Mira's case. Specifically, explain why her reflective endorsement at age 25 fails to secure ultimate moral responsibility for her action. In your explanation, make clear the *causa sui* requirement. **(8 marks)**

  **(b)** Suppose a critic argues that if Mira's deliberation involved genuine indeterministic chance (a self-forming choice), she would be responsible. Explain why Strawson rejects this move. **(4 marks)**

  **(c)** One objection to Strawson is that the Basic Argument "proves too much" by eliminating epistemic responsibility for our beliefs. Briefly state this objection and indicate whether it functions as a *reductio ad absurdum* of Strawson's view or a bullet Strawson is willing to bite. **(4 marks)**

  **(d)** Based on your analysis, is Mira's responsibility status different from that of an ordinary agent whose values arose from a standard, non-manipulative upbringing? Defend your verdict. **(4 marks)**

  ***

  ### 2. Model Answer (Strong Candidate)

  Galen Strawson's Basic Argument aims to show that moral responsibility is impossible, not merely because of determinism, but because of the structural requirements of responsibility itself. To be truly morally responsible for an action, one must be responsible for the mental nature that produced it. This creates a regress that agents like Mira cannot escape.

  **(a)** The core of the Basic Argument is that to be responsible for an action (X), one must be responsible for the character or motives (M) that led to X. However, to be responsible for M, one must have chosen M based on some prior principle of choice (P). To be responsible for P, one must have chosen P based on an even prior principle, and so on. This leads to an infinite regress. To stop the regress, an agent would need to be *causa sui*—the cause of themselves. They would need to exist prior to themselves to choose their own nature. This is logically impossible.

  Applied to Mira, her lie flows from her loyalty principle. She might claim responsibility because she reflectively endorsed this principle at age 25. However, Strawson argues that this endorsement is itself determined by how she already was at the moment of endorsement. Why did Mira endorse loyalty over honesty? Because of her specific reasons, values, and nature at that time. If she is not responsible for *that* nature (which was shaped by her childhood drilling), she is not responsible for the endorsement. Her reflection is just another mental event caused by her existing character. She did not create the self that did the endorsing. Therefore, she fails the *causa sui* requirement; she is not the ultimate originator of her will.

  **(b)** A compatibilist or libertarian might argue that if Mira's endorsement involved indeterminism—a genuine self-forming choice where the outcome wasn't fixed—she could be responsible. Strawson rejects this because indeterminism does not solve the regress; it merely adds luck. If the choice to endorse loyalty was undetermined, then to that extent it was random. Responsibility cannot be grounded in randomness. If the choice was determined by her reasons, we are back to the original problem: she isn't responsible for having those reasons. Indeterminism breaks the chain of determination but does not establish the agent as the *causa sui*. It offers no more control than determinism does regarding the ultimate source of the self.

  **(c)** Critics argue that if the Basic Argument holds, it eliminates epistemic responsibility. If I am not responsible for my mental nature, I am not responsible for my beliefs or the reasoning processes that lead me to accept Strawson's argument. If I am not responsible for my beliefs, I cannot be rationally persuaded to accept the conclusion. This objection claims the argument is self-undermining. Strawson generally treats this as a bullet to bite rather than a *reductio*. He accepts that ultimate responsibility is impossible for actions *and* beliefs. He argues this does not negate the truth of the argument, only the possibility of being ultimately responsible for grasping it. The argument remains sound even if no one is responsible for believing it.

  **(d)** Consequently, Mira's status is identical to that of an ordinary agent. It is tempting to think Mira is less responsible because her upbringing was "manipulative" or isolated, whereas an ordinary agent's upbringing is "normal." But for Strawson, the source of the character is irrelevant. Whether Mira's values came from a cult or a standard suburban family, she did not choose them ultimately. In both cases, the agent acts according to a nature they did not create. The ordinary agent also acts on values they reflectively endorse, but they also fail to be responsible for the nature that performs the endorsement. There is no responsibility-relevant difference between manipulation and normal socialization because neither allows for *causa sui*. Thus, if Mira is not responsible, no one is.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks**

  **1. Precision on the Basic Argument & *Causa Sui* (4 Marks)**
  *   **Full Marks:** Clearly articulates the regress (responsible for action → responsible for nature → responsible for principle of choice). Explicitly identifies the *causa sui* requirement (being the cause of oneself) as the impossible condition needed to stop the regress.
  *   **Mediocre Fumble:** Describes the argument vaguely as "determinism means no choice" or fails to mention that the agent must be responsible for the *reasons* behind the choice, not just the choice itself.

  **2. Application to Reflective Endorsement (4 Marks)**
  *   **Full Marks:** Explains that Mira's endorsement is just another event caused by her prior nature. She is not responsible for the nature that performed the endorsement. The regress applies to the reflection itself.
  *   **Mediocre Fumble:** Treats the reflective endorsement as a potential "stopper" that Strawson simply dismisses without explaining *why* (i.e., fails to note the endorsement has causes too).

  **3. Indeterminism/Chance Objection (4 Marks)**
  *   **Full Marks:** Notes that indeterminism introduces randomness/luck rather than control. Clarifies that randomness does not make the agent the *source* of the action in the required way.
  *   **Mediocre Fumble:** Claims indeterminism helps libertarians, or simply states "Strawson is an incompatibilist" without addressing why chance fails to ground responsibility.

  **4. Epistemic Responsibility Objection (4 Marks)**
  *   **Full Marks:** States the objection (if true, we aren't responsible for believing the argument). Correctly identifies Strawson's stance (he bites the bullet; responsibility is impossible, but the argument is still true).
  *   **Mediocre Fumble:** Claims this objection refutes Strawson definitively, or confuses epistemic responsibility with moral responsibility entirely.

  **5. Verdict on Mira vs. Ordinary Agent (4 Marks)**
  *   **Full Marks:** Concludes there is no difference. Explains that "normal" upbringing is just a different causal chain, not a responsibility-conferring one. Both fail the *causa sui* test.
  *   **Mediocre Fumble:** Argues Mira is less responsible due to manipulation/coercion while the ordinary agent is responsible, missing Strawson's point that *no* upbringing allows for ultimate responsibility.

  **Automatic Deductions (Apply in addition to above):**
  *   **-5 Marks:** Treats the Basic Argument as solely an argument against Compatibilism (it targets Libertarians too).
  *   **-5 Marks:** Assumes Determinism is the primary premise (the Basic Argument works even if determinism is false).
  *   **-3 Marks:** Uses "she could have done otherwise" as a decisive refutation without addressing the *source* of the ability.

  **Grade Boundaries (Guidance):**
  *   **17-20:** Distinction. Clear, precise, hits all nuances (especially *causa sui* and the indeterminism point).
  *   **13-16:** Upper Second. Good grasp, maybe slightly vague on the regress or the epistemic bullet.
  *   **9-12:** Lower Second. Understands the gist but conflates Strawson with standard incompatibilism or determinism.
  *   **0-8:** Fail. Recites summary without applying to Mira, or fundamentally misunderstands the regress.
