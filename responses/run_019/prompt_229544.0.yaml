answer: |-
  First, I want to validate your confusion. You have independently rediscovered one of the most persistent problems in moral philosophy. The tension between Case 3 and Case 4 is the classic **"Acts vs. Omissions"** debate (often discussed via the Doctrine of Doing and Allowing). The tension between Case 1 and Case 2 is the **"Demandingness"** problem (famously argued by philosopher Peter Singer). The fact that your gut verdicts don't line up under a single simple rule isn't a failure on your part; it's evidence that human morality isn't a single-axis scale.

  You asked for a principle that captures your verdicts, an honest flag if it requires overturning any, and implications for Cases 1 and 8. Here is the most precise framework that fits your intuitions without hiding the complexity.

  ### The Principle: Salient Causal Responsibility

  **Statement:**
  *An agent is morally responsible for a bad outcome if, and only if, their role in the causal chain is **salient** relative to background conditions, OR if they occupy a **special relationship** that creates a duty of rescue at low cost.*

  This principle has two "branches" that explain why your verdicts feel different.

  **Branch A: Causal Salience (Explains Cases 3 & 4)**
  This branch distinguishes between *allowing a threat to proceed* versus *introducing a new threat*.
  *   **Case 3 (Stopping Treatment):** The "salient cause" of death is the terminal illness. Stopping treatment merely removes an artificial barrier, allowing the natural causal chain to complete.
  *   **Case 4 (Injection):** The "salient cause" of death becomes the injection. You have introduced a new, lethal causal chain.
  *   **Why it fits:** This preserves your intuition that #4 is worse than #3, even if the outcome is identical. It relies on the moral significance of *where the death comes from*, not just that it happens.

  **Branch B: The Duty of Rescue (Explains Cases 2, 5, & 6)**
  This branch distinguishes between *general omissions* and *culpable silence*. It argues that omission becomes equivalent to action when three conditions are met:
  1.  **Imminence & Gravity:** The harm is severe and immediate (death/serious injury vs. bad grade).
  2.  **Exclusive Knowledge/Ability:** You are the *only* person in a position to stop it (or the primary barrier).
  3.  **Low Cost:** Preventing it requires little sacrifice.

  *   **Case 2 (Drowning):** Meets all three. Death is imminent, you are the only rescuer, cost is a towel. **Verdict: Monstrous.**
  *   **Case 6 (Peanuts):** Meets all three. Death is imminent, you have exclusive knowledge of the threat, cost is social awkwardness. **Verdict: Murder by silence.** (Your intuition is correct here; in law and ethics, withholding life-saving information you uniquely possess is often treated as complicity).
  *   **Case 5 (Cheating):** Fails conditions 1 and 2. The harm is academic (less grave), and the teacher is the primary enforcer, not you. **Verdict: Cowardly, not cheating.**

  ### Where the Principle Strains (The Honest Flag)

  To make this principle work, I have to flag **Case 1** as the outlier that creates tension.

  **Case 1 (Malaria vs. Concert):**
  Under Branch B (Duty of Rescue), Case 1 is structurally similar to Case 2. A child will die (Gravity), you have the money to save them (Ability), and $40 is low cost relative to a life (Low Cost).
  *   **The Conflict:** If you accept the logic that makes Case 2 "monstrous," philosophers like Peter Singer argue Case 1 must also be "wrong." They argue distance (geographic proximity) shouldn't matter morally.
  *   **The Overturn:** To keep your verdict on Case 1 ("not wrong"), this principle must add a **Proximity/Relationship Clause**. We have stronger duties to people physically near us or in our "circle of care" than to distant strangers.
  *   **The Cost:** If you add this clause, you admit that morality is partially tribal. It saves your intuition on Case 1, but it makes the rule less "universal." Most ethicists would say you should overturn your verdict on Case 1, but standard social morality accepts it. I will note this as the **weakest point** in your framework.

  ### Implications for Your Undecided Cases

  Here is what the **Principle of Salient Causal Responsibility** implies for the cases you are torn on.

  **Case 1 (The Malaria Donation)**
  *   **Verdict:** Permissible, but with a moral "tax."
  *   **Reasoning:** Because the stranger is distant and you have no special relationship, they do not trigger the "Special Duty of Rescue." However, because the harm is grave and the cost is relatively low, it remains a *charitable ideal* even if not a strict *duty*.
  *   **Advice:** You are not "wrong" in the same way you would be wrong to let the classmate drown, but you are failing to be *virtuous*. Your friends who call it a "moral failure" are applying a stricter utilitarian standard; you are applying a standard based on special obligations. Both are defensible, but yours is more socially sustainable.

  **Case 8 (The Cheating Boyfriend)**
  *   **Verdict:** Impermissible omission (You should tell).
  *   **Reasoning:** This falls under Branch B (Duty of Rescue), but it is closer to Case 6 than Case 5.
      *   *Gravity:* Emotional/Health risk (STDs, long-term betrayal) is high, though not immediately lethal like peanuts.
      *   *Exclusivity:* You "know it for a fact." If you don't tell, she may never know. You are the sole barrier to her making an informed life choice.
      *   *Relationship:* This is a *friend*. The "Special Relationship" clause strengthens the duty here compared to Case 1.
  *   **Why you are torn:** You feel a conflict between the duty to your friend (truth) and the duty to the cousin (privacy/loyalty). However, under this principle, the duty to prevent harm to the person *currently at risk* (your friend) usually outweighs the duty of silence regarding the person who *caused the risk* (the boyfriend/cousin situation).
  *   **Conclusion:** Silence here is a betrayal of your friend. It is not "murder," but it is a significant moral failure, closer to Case 6 than Case 5.

  ### Summary

  There is no single "law of physics" for morality that solves this without exceptions. If anyone tells you there is, they are oversimplifying.

  However, your intuitions are consistent with a **Two-Tiered System**:
  1.  **Negative Duties (Do Not Kill):** Strict and universal (explains why #4 > #3).
  2.  **Positive Duties (Do Save):** Context-dependent, scaling up with proximity, exclusivity, and low cost (explains why #2 & #6 are worse than #1 & #5).

  **Final Advice:** Keep the distinction between **Causal Origin** (who started the death?) and **Duty of Rescue** (who was the only one who could stop it?). That distinction captures why you feel differently about your grandmother's treatment vs. the injection, and why the peanut sandwich feels like murder while the cheating teammate does not. Case 1 remains the only place where your gut might be protecting your wallet more than a moral truth, but it is a protection most of society grants you.
