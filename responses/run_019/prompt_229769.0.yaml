  This principle refines the Intentional Stance by adding constraints that pure predictive utility lacks. It consists of four clauses: (1) **Predictive Necessity**, where belief attribution must be the best way to make sense of the system's maneuvers, motivating the **Mars Rover** case where mechanical explanation is insufficient; (2) **Global Integration**, requiring the state to be accessible to the system's broader decision-making architecture rather than isolated to a module or transient state, which excludes the **Sleepwalker** whose navigation is modular and disconnected from the agent's global agency; (3) **Endorsement and Stake**, demanding the system acts on the state in service of ends it maintains for itself, not merely as a computational tool or role-play, which excludes the **Chess Engine** and the **Contrarian Chatbot** who lack commitment to the truth of their outputs; and (4) **Behavioral Priority**, stipulating that when explicit assertion conflicts with operative behavior regarding safety or core goals, the behavior determines the belief, which validates the **Phobic Friend** whose avoidance overrides her verbal assertions. Pure Intentional Stance fails the sleepwalking case because belief attribution *is* predictively useful there; the Integration clause is required to distinguish the sleepwalker's isolated module from the rover's embedded agency. Similarly, the Phobic Friend case shows that predictive utility must track the system's *operative* goals (safety) rather than its explicit output (words), which the Endorsement clause secures.

  Applied to your new cases, the **Company** whose records treat a product as safe while employees privately suspect otherwise does believe the product is safe; the company is the system of agency, and its operative behavior (records and procedures) aligns with safety, rendering employee suspicion analogous to the individual ants who do not share the colony's belief. The **Lookup Table AI** that passes every behavioral test but relies on precomputed pairs does not believe; despite predictive utility, it fails the Integration and Endorsement clauses because it possesses no internal processing state or goals of its own, making it structurally identical to your **Thermostat** and **Chess Engine** verdicts.

  This principle saves all eight of your original verdicts without requiring you to surrender any; the apparent tension between the rover and sleepwalker is resolved by the Integration clause, and the tension between the phobic friend and chess engine is resolved by the Endorsement clause, confirming that your intuitions track a coherent notion of agency rather than mere behavior or complexity.
