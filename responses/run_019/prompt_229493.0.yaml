  Here is a table analyzing two competing ethical principles based on your friend's verdicts, followed by a prediction of her likely view.

  ### Candidate Rules for Promise-Binding

  | Candidate Rule | How it fits verdicts 1–5 | Its verdict on the orchard promise | A further case that would test it against the other rules |
  | :--- | :--- | :--- | :--- |
  | **1. The Detriment Principle**<br>(Obligations arise primarily to prevent harm to those who rely on the promise.) | **Fits 4 & 5 well:** Explains why reliance increases strength (4) and lack of reliance weakens it (5).<br>**Strains on 1:** Must argue returning a book implies implicit reliance.<br>**Fits 2 & 3:** Coerced or immoral acts create no valid reliance. | **Does Not Bind.**<br>Since nobody relies on the orchard and the grandfather cannot suffer disappointment, breaking the promise causes no detriment to a person. | **The "Harmless Secret" Case:**<br>*You promise a friend to keep a trivial secret. They die tomorrow. Telling the secret hurts no one.*<br>• **Detriment:** Does not bind (no harm).<br>• **Will Theory:** Binds (duty remains). |
  | **2. The Autonomy Principle**<br>(Obligations arise from the promisor's free exercise of will to bind themselves, provided the act is moral.) | **Fits 1, 2, 3:** Explains why freedom and morality are required for a valid promise.<br>**Fits 4 & 5:** Explains the baseline binding force; treats reliance as an *aggravating factor* that increases the severity of breaking the promise, but not the source of the obligation. | **Binds.**<br>The teenager freely assumed a duty. The grandfather's death and lack of third-party reliance do not erase the self-imposed obligation. | **The "No-Reliance" Case:**<br>*You freely promise a stranger to mail a postcard. They explicitly say, "I won't check the mail, I don't care if you do it."*<br>• **Detriment:** Does not bind (no reliance).<br>• **Will Theory:** Binds (commitment was made). |

  ### Prediction and Implications

  I would bet that your friend's judgments are ultimately governed by the **Autonomy Principle** (Rule 2), with reliance acting only as a modifier for the *strength* of the obligation. The key evidence is Case 5 (the sweater): she explicitly states that the promise binds *weakly* even though "nobody's plans depend on it." If she were a pure reliance theorist (Rule 1), she would likely say the sweater promise does not bind at all. Because she acknowledges a baseline obligation without reliance, she likely views the act of promising itself as the source of the bond. **Implication for the orchard:** She will likely say the orchard promise **binds**, though perhaps weakly. This implies that for her, deathbed promises are binding not because the deceased person needs them, but because the promisor's own integrity and past free choice create a duty that survives the promisee's death. The moral weight comes from who *you* are, not just who you hurt.
