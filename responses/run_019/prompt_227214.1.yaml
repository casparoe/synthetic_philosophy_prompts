answer: |-
  This is a fantastic argument. You have effectively reconstructed the central debate surrounding the **Knobe Effect** (or the Side-Effect Effect) that has occupied philosophy of action for the last two decades. Your derivation of step (8) is the "Moralist" or "Radical Contextualist" conclusion that some philosophers (like Joshua Knobe in his earlier work, or Mark Alfano) have actually been willing to entertain.

  However, since you want to avoid (8) because it undermines the descriptive foundation of law and action theory, you need to cut the link between the empirical data and the metaphysical conclusion.

  You should reject **Step (5)**.

  Here is why (5) looked plausible, why it is false, what it costs you to reject it, and how it allows you to keep (4) while denying (6).

  ### Why Step (5) Looked Plausible
  Step (5) relies on a principle of **Conceptual Transparency**: *If moral considerations are necessary to trigger the application of a concept in standard cases, then morality must be part of the concept's definition.*

  It feels intuitive because we usually learn concepts by looking at how we use them. If every time we try to use the word "intentionally" we have to check a moral box, it seems like the moral box is part of the machinery of the word. It conflates the **epistemology of attribution** (how we figure out if the concept applies) with the **metaphysics of the property** (what the concept *is*).

  ### Why Step (5) is False
  You can reject (5) by distinguishing between **Truth Conditions** (what makes the statement true) and **Assertibility Conditions** (when we are willing to say the statement).

  Step (4) claims that moral status affects the *application* of the concept. Step (5) infers that this makes the concept *moral*. But a concept can be descriptive in its truth conditions while being morally sensitive in its assertibility conditions.

  Consider the concept **"Cause."**
  In the philosophy of causation, we know that for a fire to happen, you need a spark *and* oxygen. Both are necessary conditions. Yet, if an arsonist strikes a match, we say the arsonist *caused* the fire. We rarely say the presence of oxygen *caused* the fire, even though it was equally necessary.
  Why? Because we distinguish between "abnormal" interventions (arson) and "normal" background conditions (oxygen). This distinction is often normative or statistical.
  *   **Does this make "cause" a moral concept?** No. The causal relation is purely physical/descriptive.
  *   **Does morality affect application?** Yes. We are more likely to *attribute* causation when there is a norm violation.

  You can apply this same logic to "intentionally."
  *   **The Descriptive Fact:** The chairman has a specific psychological profile (foreknowledge + indifference). This fact is purely descriptive.
  *   **The Moral Filter:** Human beings have a "Blame Bias." We are cognitively tuned to detect agency more readily when we want to blame than when we want to praise (an evolutionary adaptation for policing social norms).
  *   **The Result:** We *apply* the label "intentionally" in the harm case because our blame-detector is triggered. We withhold it in the help case because our praise-detector has a higher threshold.

  By rejecting (5), you claim that "intentionally" tracks a descriptive psychological state, but our *access* to that state is mediated by moral heuristics. The concept is descriptive; the *user* is moralistic.

  ### Can You Keep (4) While Denying (6)?
  **Yes.** This is the crucial pivot.

  *   **Keep (4):** "Whether something counts as intentional [in folk practice] depends partly on the moral status of the outcome."
      *   You can accept this as a claim about **folk psychology** and **linguistic usage**. In ordinary language, the *criteria for asserting* "he did it intentionally" include moral valence.
  *   **Deny (6):** "So 'intentionally' is at least partly a moral concept."
      *   You deny this by arguing that ordinary usage is not the final arbiter of conceptual analysis. Just because folk usage is morally contaminated doesn't mean the *underlying property* is moral.

  This distinction allows you to say: "The folk concept is morally laden, but the **theoretical concept** (used in law and action theory) is descriptive."

  ### What Does This Cost You?
  Rejecting (5) saves Law and Action Theory from (8), but it comes with three significant costs:

  1.  **Folk Intuitions are Not Authoritative:** You have to accept that the "man on the street" is systematically confused about what intentionality *is*. You are privileging the philosopher's/lawyer's refined definition over the empirical data of folk judgment. This opens you to the charge of elitism or ignoring the actual function of the concept in society.
  2.  **The "Error Theory" Burden:** You are now committed to an error theory regarding the Help case. You have to say that when people say "He didn't help intentionally," they are *wrong* (or at least imprecise), because the psychological facts are identical to the Harm case. You must argue there *is* a fact of the matter (the psychology) that overrides the intuition.
  3.  **Explaining the Bias:** You take on the burden of explaining *why* the bias exists if the concept is descriptive. You need a theory (like the "Blame Hypothesis" or "Deep Self" view) to explain why morality bleeds into descriptive judgment. You can't just say "it happens"; you have to explain the mechanism (e.g., intentionality is the bridge to blame, so we lower the evidentiary bar for blame).

  ### How This Blocks Step (8)
  Step (8) claims: *"There is no purely descriptive fact about whether a foreseen side effect was intentional, only our moral reactions doing the work."*

  By rejecting (5), you can assert:
  *"There **is** a purely descriptive fact (the chairman's psychology). In both cases, the fact is identical. However, our **moral reactions** determine whether we **label** that fact 'intentional' in ordinary discourse."*

  This saves Criminal Law. The law does not have to follow the folk's inconsistent labeling. The law can stipulate: *"For the purposes of this statute, 'intentionally' means 'foreseen and accepted,' regardless of moral valence."*
  The law is not "resting on a confusion"; it is **correcting** a cognitive bias revealed by the experiment. The experiment shows that juries might be biased, which is an argument for stricter jury instructions, not an argument that *mens rea* doesn't exist.

  ### Summary
  *   **Reject:** Step (5).
  *   **Reason:** It conflates the *criteria for attribution* (which can be morally sensitive) with the *nature of the property* (which can be descriptive).
  *   **Keep:** Step (4) (as a claim about folk attribution) and Step (3) (the data).
  *   **Deny:** Step (6) and (8).
  *   **Cost:** You must argue that folk intuitions are unreliable guides to the metaphysics of action and that legal theory serves a normative role in standardizing a concept that folk usage leaves ambiguous.

  This position allows you to respect the data (the Knobe Effect is real) without accepting the conclusion that reality itself bends to our moral judgments. It treats the effect as a bug in human cognition, not a feature of the universe.
