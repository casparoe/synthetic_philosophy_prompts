  **Summary of the disagreement**
  Maya and Dominic debate the interpretation of Kant's Third Preliminary Article regarding standing armies. Maya argues the prohibition is primarily normative: standing armies treat humans as tools and insulate citizens from war's costs, violating rights regardless of empirical outcomes. She contends preliminary articles rely on the essay's broader republican architectonic for full coherence. Dominic argues the prohibition is empirical: standing armies cause arms races and make peace costly. He claims if this dynamic fails, the argument collapses, and that preliminary articles must have independent content. He challenges Maya's normative claim with a firefighter analogy. The core tension is between Kant's deontological rights-based reasoning and his consequentialist security claims, alongside the structural status of the preliminary articles within the essay.

  **Point-by-point adjudication**
  Dominic is correct that preliminary articles possess independent normative force; they are immediate prohibitions, not merely dependent on the definitive articles. Maya errs by suggesting they lack content without the later republican conditions. Kant presents them as laws that must be obeyed to exit the state of nature between states, meaning they bind states even before a federation exists. This structural point validates Dominic's insistence on independent content. However, Dominic fundamentally misreads Kant's methodology by treating the empirical claim regarding arms races as the sole justification. Kant's practical philosophy is not contingent on empirical generalizations; even if professional armies sometimes maintain peace, the a priori right violation remains. Thus, Dominic's claim that empirical stability nullifies the article is a category error regarding Kant's critical project. Consequently, Dominic's challenge regarding the volunteer army misses the point that consent does not validate the surrender of moral personality. Kant's legal philosophy requires adherence to principle regardless of contingent political stability.

  Regarding the normative core, Maya is superior. Kant explicitly states paying men to kill uses them as "mere machines," incompatible with the "rights of mankind." Dominic's firefighter analogy fails because the moral intent differs: firefighters preserve life, whereas soldiers are contracted for coercive destruction. Kant's objection isn't merely risk, but the alienation of one's moral agency to the state's lethal will. Maya correctly identifies that a professional volunteer caste separates the burden of war from the citizenry, which undermines the republican check on executive power. In a republic, citizens must consent to war, and standing armies allow executives to bypass this consent. This structural insight supports Maya's view that the issue is constitutional, not just contractual. Furthermore, Kant implies that when citizens fight themselves, they are less likely to pursue war frivolously, a dynamic professional armies obscure.

  However, Maya overstates the dependency on definitive articles. The abolition of standing armies is a condition *for* peace, not just a result of it. Dominic is right that a democrat could accept Maya's normative worries yet retain a professional army for defense, but Kant would reject this as insufficiently republican. Ultimately, Maya captures the deontological heart of the text, while Dominic correctly identifies the structural independence of the preliminaries but fails to grasp their a priori basis. Dominic's demand for independent content is valid, but his empirical criterion for that content is not. Maya's normative reading sustains the argument even if the empirical premise fluctuates. The text prioritizes the intrinsic wrong of instrumentalizing humans over the extrinsic risk of conflict. Therefore, while Dominic is right about the article's structure, Maya is right about its substance. Both miss that the preliminary articles are negative laws prohibiting specific actions immediately, whereas definitives are positive constitutions to be established.

  **What both are missing**
  Both overlook the crucial phrase "in time" (*in Zeit*). Kant allows gradual abolition, acknowledging empirical constraints without surrendering the normative principle. They also miss the specific political mechanism: standing armies empower the executive to wage war without citizen consent. Kant's preference for citizen militias isn't just about rights; it's about ensuring those who decide war bear its costs. Finally, both neglect Kant's distinction between private employment and public right; the state cannot own the lethal capacity of its subjects as property. This distinction clarifies why firefighters (saving) differ from soldiers (killing) in Kant's legal framework.

  **Overall verdict**
  Maya offers the more faithful interpretation. Kant's philosophy of right is grounded in a priori principles of freedom, not empirical predictions. While Dominic correctly notes the preliminary articles' independent status, his reliance on empirical falsification misunderstands Kant's critical project. The "rights of mankind" passage is the decisive justification, rendering the arms race argument secondary illustrative support. Maya correctly identifies that the professionalization of violence violates human dignity regardless of geopolitical stability. However, she should concede Dominic's point that the article holds immediate prohibitive force, not merely as a function of the definitive articles. The text prioritizes the normative violation of human agency over the consequentialist risk of war.
