answer: |-
  Here is the analysis, calibrated to your background. Think of your neighbor's philosophy as a signal processing problem: he is trying to isolate the "Humanitarian Signal" from the "Geopolitical Noise" to determine if the output (Intervention) is valid.

  ### 1. The Prediction
  **Verdict: Not Justified.**

  He will likely argue that while the *cause* (stopping the massacre) is valid, the *conditions* are too contaminated. The mineral concessions introduce a "motive noise" similar to Iraq, and the 50/50 stability odds suggest a high probability of a Libya-style collapse. He will view the African Union's constraint ("deal is off if regime change") as unenforceable paperwork, given the coalition's economic stake.

  ### 2. Candidate Rules (The Algorithms)
  Based on his three data points, here are the two competing rules he could be running. Both fit his past record, but they produce different results on new data.

  **Rule A: The "Imperative to Protect" (Kosovo-Weighted)**
  *   **Logic:** If an imminent massacre is occurring and regional bodies support intervention, the lack of UN Security Council approval is excusable. The primary moral duty is to stop the killing *now*. Long-term political stability is secondary to immediate survival.
  *   **Fit:** Explains Kosovo (No UN, but stopped cleansing) and the *start* of Libya (UN + Arab League, stopped Benghazi). Explains Iraq rejection (No massacre happening *at the time*).
  *   **Application to New Case:** **Justified.** The AU request substitutes for the UN. The massacre is imminent. The mineral risk is "noise" that shouldn't override the humanitarian signal.

  **Rule B: The "Clean Hands & Exit" (Libya/Iraq-Weighted)**
  *   **Logic:** Intervention is only justified if the intervening powers have pure intentions (no economic gain) AND a credible plan for the day after. If the intervention creates a power vacuum or is driven by resource interests, it is unjustified *ab initio* (from the start), even if a massacre is looming.
  *   **Fit:** Explains Iraq (Economic motive/Bad planning = No). Explains Libya (Mission creep/Bad outcome = No). Explains Kosovo (No economic motive/Relatively stable = Yes).
  *   **Application to New Case:** **Not Justified.** The mineral concessions violate the "pure intention" clause (like Iraq). The 50/50 stability odds violate the "credible exit" clause (like Libya).

  ### 3. The Dominant Case (The Calibration Standard)
  **Libya (2011) is doing the most work in his reasoning.**

  Here is why: Kosovo is too clean (a "perfect signal"), and Iraq is too obvious (a "saturated detector"). Libya is the case where the signal degraded over time. His specific comment—that the *start* was justified but the *operation as run* was not—shows he cares about the **lifecycle of the intervention**, not just the entry decision.

  In spectroscopy terms, Kosovo is a baseline calibration. Iraq is a negative control. But Libya is the actual sample run where he discovered that "initial justification" does not guarantee "final validity." Because the new case includes specific probability estimates for *post-war stability* (50/50), he is being asked to judge the lifecycle in advance. Given his Libya verdict, a 50/50 chance of stability is likely a veto condition for him. He has learned that "good intentions" (stopping Benghazi) do not inoculate against "bad outcomes" (state collapse).

  ### 4. The Test Case (The Control Experiment)
  To determine whether he is running **Rule A (Imperative to Protect)** or **Rule B (Clean Hands & Exit)**, you need a case that isolates *Outcome* from *Necessity*.

  **The Scenario:**
  > "Imagine a genocidal regime in a small island nation is actively executing a specific ethnic minority (10,000 people remaining). A regional coalition offers to intervene. They have **zero** economic interest in the country (pure motive). However, intelligence confirms with 90% certainty that if the regime falls, the country will fragment into warlordism and civil war for a decade (guaranteed bad outcome). The UN is deadlocked."

  **How to Interpret His Answer:**
  *   **If he says JUSTIFIED:** He is following **Rule A (Kosovo)**. The immediate saving of lives outweighs the long-term political collapse. The "Humanitarian Signal" is all that matters.
  *   **If he says NOT JUSTIFIED:** He is following **Rule B (Libya/Iraq)**. The certainty of a failed state makes the intervention unethical, regardless of the purity of motive or the immediacy of the threat. The "Stability Noise" kills the signal.

  **Why this works:**
  This removes the "Mineral/Economic" variable (which confuses the Iraq comparison) and removes the "UN Authorization" variable (which confuses the Kosovo comparison). It forces him to choose between the *act of saving* and the *consequence of the save*. Given his frustration with Libya's aftermath, my money is on him saying **Not Justified**, which confirms Rule B is his operating system.
