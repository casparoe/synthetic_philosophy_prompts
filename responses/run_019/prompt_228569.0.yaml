  **The floor**
  A macrohistorical theory must offer out-of-sample forecasting, not just curve-fitting past collapses. Retrodicting Rome is trivial; predicting the next decade is not. Given the small n (few comparable states), variables must be robust across contexts, not cherry-picked to fit specific eras. Statistical significance is hard to achieve with dozens of data points; Bayesian priors must be explicitly stated and justified. Data commensurability is crucial; medieval fiscal records cannot be naively regressed against modern GDP without normalization protocols.

  The theory must specify causal mechanisms measurable *ex ante*. If "elite overproduction" is the driver, there must be a defined metric available *before* instability occurs, not inferred from the instability itself. Variables cannot be latent constructs revealed only by the outcome they predict. Mechanisms must be trans-historical yet context-sensitive.

  Falsifiability is non-negotiable. There must be a clear condition under which the theory is wrong. If every outcome (stability or collapse) can be explained post-hoc by adjusting parameters or invoking unspecified contingencies, it is unfalsifiable and useless.

  Finally, for decision-relevance, the output must be probabilistic. Deterministic prophecies are useless for risk management. The theory must provide confidence intervals. If it cannot quantify uncertainty, it is narrative, not science. It must distinguish between structural pressure and triggering events. Without this distinction, policy intervention becomes impossible. Temporal resolution matters: predicting "sometime in the next century" is useless for a 30-year horizon. The theory must define the window of vulnerability with precision sufficient for political budget cycles. It must separate signal from noise in real-time data streams effectively and consistently.

  **The hard ones**
  The reflexivity problem is severe. If a government acts on a prediction of instability, they may prevent it, falsifying the theory but validating the utility. Conversely, if actors anticipate collapse, they may accelerate it. This suggests the theory cannot be a static law of physics; it must model feedback loops between prediction and behavior. A theory that ignores reflexivity fails the decision-relevance test because its publication changes the variables. This is the historical equivalent of the Lucas Critique in economics.

  Contingency is the other hurdle. Can a structural theory predict the timing of collapse without knowing the trigger (assassination, plague)? If the theory requires specific triggers to function, it loses predictive power over timing. If it ignores them, it risks missing the actual catalyst. Structural pressures create volatility, but randomness determines the realization.

  These demands conflict. A theory robust to contingency must be probabilistic over long windows, reducing decision utility. A theory precise enough for investment horizons must assume away contingency, reducing accuracy.

  We must drop deterministic timing. We cannot predict the spark, only the kindling. The theory should predict susceptibility, not events. Regarding reflexivity, the theory must include a model of policy response. If it doesn't, it is incomplete. The tension lies between specificity and robustness. A model specific enough to guide policy is fragile to reflexivity; a model robust to reflexivity is too vague for policy. The solution is iterative updating: the theory must be adaptive, treating predictions as interventions. Furthermore, can a theory respect contingency and still predict? Taleb argues that macrohistory is dominated by fat-tailed events. If true, standard regression fails. The theory must account for volatility clustering. The horizon mismatch is critical. Structural cycles move slowly; political crises move fast. Bridging this gap requires linking slow variables (demography) to fast variables (sentiment).

  **Camp preferences**
  Dan's demand for mathematical formalism is a prejudice that equations equal rigor. Equations can obscure bad assumptions just as easily as narratives. However, your demand that human agency be irreducible is also a prejudice. If agency averages out at scale, modeling it as noise is valid.

  Dan assumes structure dictates outcomes; you assume actors defy structure. Both are partially wrong. Structure constrains agency; agency navigates structure. The demand for "measurable variables" favors Dan, but it risks proxy errors (e.g., degrees vs. actual elite influence). Your demand for "mechanism" favors you if mechanisms include cultural shifts, but culture is hard to quantify.

  The spec requires causal clarity, not pure math or narrative. Math is a useful tool, not a virtue. Agency is a variable, not a wildcard. You assume scarcity invalidates models; Dan assumes availability validates them. Both really ignore data quality. This mutual blindness fundamentally undermines both positions.

  **The knife**
  The single knife is strict ex-ante measurability. Many historical variables are only coherent post-hoc. "Elite overproduction" is often measured by the instability it supposedly causes. If SDT cannot define elite overproduction independently of unrest, it fails completely. Most macrohistory fails here. It explains everything after the fact. SDT specifically struggles here because "elite" status is context-dependent. Without a universal metric available in real-time, the theory remains a narrative framework. This excludes most cyclical theories that rely heavily on retrospective periodization. Real-time data availability is the true bottleneck for decision relevance.
