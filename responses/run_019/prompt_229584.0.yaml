answer: |-
  Here is a complete 75-minute lesson plan designed to generate the specific cognitive dissonance you're looking for.

  ### **Lesson Overview**
  *   **Topic:** Chomp and the Strategy-Stealing Argument.
  *   **Goal:** Students experience the frustration of searching for a constructive solution, then derive a non-constructive existence proof, finally critiquing the hidden assumptions (monotonicity) that make the proof work.
  *   **Class Size:** 24 students (6 groups of 4).
  *   **Materials:** Printed board grids, "Strategy Worksheet," whiteboard/markers.

  ---

  ### **1. The Setup & Rules (0:00 – 0:10)**
  **Hook:** "Today we are going to solve a game. I promise you that Player 1 always wins on any rectangular board larger than $1 \times 1$. By the end of class, you will prove it. But there is a catch: I bet you won't be able to tell me *how* Player 1 wins."

  **The Rules (Project on Board):**
  1.  **The Board:** A rectangular grid of squares.
  2.  **The Poison:** The **Bottom-Left** square $(1,1)$ is poisoned.
  3.  **The Move:** Choose any square $(r, c)$. Remove that square and **all squares above it and to the right of it**. (Visualize an 'L' shape remaining; you eat the top-right rectangle).
  4.  **The Loss:** The player forced to eat the poisoned square $(1,1)$ loses.
      *   *Note:* This is equivalent to "Last player to move wins" if you consider the poison the last square, but phrasing it as "Don't eat the poison" is more intuitive for the strategy.

  **Demo:** Play a $2 \times 3$ game against a volunteer. Show that taking the Top-Right corner removes only one square. Show that taking $(2,1)$ removes the entire top row.

  ---

  ### **2. The Flail: Structured Play (0:10 – 0:35)**
  **Task:** "In your groups, play Chomp. Your goal is not just to win, but to find the **Winning Opening Move** for Player 1."
  *   **Definition:** A Winning Opening Move is a first move that guarantees a win against *any* defense, assuming perfect play thereafter.
  *   **Constraint:** You must test boards of size **$3 \times 3$, $3 \times 4$, and $4 \times 4$**. (Ban $2 \times n$ boards initially; they are too easy due to symmetry strategies).

  **Handout 1: The Boards**
  Provide sheets with printed grids of $3 \times 3$, $3 \times 4$, $4 \times 4$, and one "Monster" $5 \times 5$.
  *   *Instruction:* "Mark the winning first move on the sheet. If you think Player 2 wins, mark 'P2 Win'. If you find a winning move, explain *why* it wins (what is the strategy?)."

  **Instructor Role:**
  *   Circulate. If a group solves $3 \times 3$ quickly, push them to $4 \times 4$.
  *   **Do not help them find strategies.** If they ask "Is this right?", say "Play it out."
  *   **Watch for:** Groups trying to map the entire game tree. They will hit a wall at $4 \times 4$. The branching factor is too high.
  *   **Watch for:** Groups trying symmetry (copycat). This works for squares ($3 \times 3$) but fails for rectangles ($3 \times 4$). This creates the necessary confusion.

  ---

  ### **3. The Pivot: The "What If" (0:35 – 0:50)**
  **Stop the Play.** Ask: "Who has a confirmed Winning Opening Move for the $4 \times 4$? For the $5 \times 5$?"
  *   *Expected Result:* Silence or uncertainty. They have heuristics, but no proof.

  **The Prompt (Handout 2: The Strategy Worksheet):**
  Give them this scaffolded argument. Do not lecture; have them fill in the blanks in groups.

  > **Hypothesis:** Suppose Player 2 has a Winning Strategy. (This means no matter what P1 does, P2 can force a win).
  >
  > 1.  **The Fake-Out:** Player 1 makes a specific move: **Take only the Top-Right square.** (Call this Move $T$).
  > 2.  **The Response:** Since we assumed P2 has a Winning Strategy, P2 must have a response to Move $T$ that leads to a P2 win. Let's call P2's response **Move $R$**.
  > 3.  **The Observation:** Look at the board after P1 plays $T$ and P2 plays $R$.
  >     *   Could Player 1 have played **Move $R$** as their very first move? (Yes / No)
  >     *   Why? _________________________________________________
  > 4.  **The Comparison:** Compare the board state of [P1 plays $R$ immediately] vs. [P1 plays $T$, then P2 plays $R$].
  >     *   Which board has *more* chocolate remaining? _______________
  >     *   In Chomp, is having *more* chocolate better or worse for the player whose turn it is? _______________
  > 5.  **The Contradiction:** If [P1 plays $T$, then P2 plays $R$] is a winning state for P2 (by our hypothesis), then [P1 plays $R$ immediately] must be... (Winning for P1 / Winning for P2).
  >     *   This contradicts the assumption that P2 has a winning strategy.
  > 6.  **Conclusion:** Therefore, the assumption was false. Player ___ must win.

  **Instructor Role:**
  *   Push them on Question 3. "Why was Move $R$ available at the start?"
  *   Push them on Question 4. "Does having more squares on the board ever hurt you in Chomp?"

  ---

  ### **4. The Debrief: Constructive vs. Non-Constructive (0:50 – 1:05)**
  **Bring the class together.** Walk through the proof on the main board based on their worksheet answers.

  **Key Discussion Points:**
  1.  **The Existence Proof:** "We just proved P1 wins. Did we find the winning move?" (No). "Did we even use the dimensions of the board?" (No). "This is a **Non-Constructive Existence Proof**. We proved $\exists x$ (Winning Move) without finding $x$."
  2.  **The Feeling:** "How does it feel to know you win but not know how?" (Frustrating, magical, unsatisfying). "This is why computer scientists care about this distinction. A proof that gives an algorithm is worth more than a proof that just says 'it exists'."

  **The "Harmless Move" Assumption (The Philosophical Core):**
  *   **Ask:** "In step 3, we claimed P1 could have played Move $R$ at the start. Why was that true?"
  *   **Student Answer:** "Because $R$ was still there."
  *   **Probe:** "Why was it still there? P1 just took the Top-Right square ($T$). What if taking $T$ had removed the squares needed to make move $R$?"
  *   **The Insight:** The proof relies on the fact that Move $T$ (Top-Right) is the **minimal move**. It removes the fewest squares possible. Therefore, *any* other legal move $R$ remains legal after $T$ is played.
  *   **The Load-Bearing Assumption:** "The proof assumes that **taking a square never enables a new move later.**"
      *   In Chomp, moves only *remove* options (monotonicity).
      *   If the game were "Chomp+" where eating a square sometimes *reveals* new squares below it, this proof would collapse. P2's response $R$ might rely on a square that P1's move $T$ accidentally revealed/blocked.
      *   **Takeaway:** The strategy-stealing argument isn't just logic; it depends on the **geometry of the rules**. It assumes "having more chocolate is never a disadvantage."

  ---

  ### **5. Wrap Up (1:05 – 1:15)**
  *   **Homework/Exit Ticket:** "Find the actual winning move for $2 \times n$. (It's symmetric). Why does the Strategy-Stealing proof not tell us this?"
  *   **Final Thought:** "Mathematics often tells us *that* something is true before it tells us *why*. Your job as mathematicians is to be uncomfortable with that gap."

  ---

  ### **Predictable Failures & Mitigation**

  | What will go wrong | Why it happens | How to fix it in the moment |
  | :--- | :--- | :--- |
  | **Symmetry Trap** | Students will solve $3 \times 3$ by playing symmetric to P2. They will think they've solved the general case. | When they claim victory, hand them a $3 \times 4$ board. Symmetry fails on rectangles. Force the cognitive break. |
  | **"Winning" Confusion** | Students think "Winning Move" means "Eats the most chocolate" or "Wins in 1 turn." | Circulate and correct: "A winning move guarantees a win eventually, even if the game lasts 20 turns." |
  | **The "R" Availability** | In the worksheet, they won't see why Move $R$ (P2's response) was available to P1 at the start. | Draw the board. Show that $T$ (Top-Right) is a subset of any move. If $R$ doesn't touch $T$, it's clearly available. If $R$ *includes* $T$, it was *also* available at the start because $T$ was there. |
  | **Time Overrun** | Play phase gets noisy and long. | At 0:30, give a 5-minute warning. "If you haven't solved $4 \times 4$ yet, you won't. Stop and look at the Worksheet." |
  | **Proof Skepticism** | "This feels like cheating. You didn't show us the move." | Validate this! "Yes. It feels like cheating. That's the point. It's a existence proof, not a construction." |

  ---

  ### **What the Game Can't Produce (Honesty Check)**
  You asked to be honest about what the game *cannot* do.
  1.  **It cannot produce the feeling of rigor.** The students will feel the *contradiction*, but they won't feel the *formal weight* of the quantifier swap ($\forall$ strategies $\to \exists$ move) unless you explicitly write the logic on the board in the debrief. The game produces intuition; you must supply the syntax.
  2.  **It cannot surface the "Monotonicity" assumption naturally.** Students will accept that Move $R$ is available without questioning *why*. They will treat it as obvious. **You must interrupt this.** In the debrief, you have to play "Devil's Advocate": *"Imagine a game where eating a square creates a new square. Does the proof work?"* The game of Chomp hides this assumption because the assumption is true. You have to artificially break the rules to make them see the assumption.
  3.  **It cannot distinguish P1 wins from P2 wins.** The game lets them play, but it doesn't tell them who *should* win. They might spend 20 minutes trying to prove P2 wins on $3 \times 3$. You have to intervene to set the premise ("Assume P2 wins...") to get the proof moving.

  ### **Handout Content (Copy-Paste Ready)**

  **Worksheet: The Strategy Steal**
  1.  **Assume** Player 2 has a strategy that guarantees them a win, no matter what Player 1 does.
  2.  **Imagine** Player 1 starts by taking **only the Top-Right square**. (Call this Move $T$).
  3.  Because we assumed P2 wins, P2 must have a **Response Move** (Call it Move $R$) that puts P2 in a winning position.
  4.  **Question:** Was Move $R$ a legal move for Player 1 at the very beginning of the game (before Move $T$)?
      *   [ ] Yes
      *   [ ] No
      *   *Reason:* ________________________________________________________
  5.  **Compare:**
      *   **Scenario A:** P1 plays $T$, then P2 plays $R$. (Board State $S_A$)
      *   **Scenario B:** P1 plays $R$ immediately. (Board State $S_B$)
      *   Which board has *more* squares remaining? _________
  6.  **Logic Check:** In Chomp, is having *more* squares on the board ever a *disadvantage* for the player whose turn it is?
      *   [ ] Yes
      *   [ ] No
  7.  **Conclusion:** If Scenario A is a winning position for P2, then Scenario B must be...
      *   [ ] A winning position for P2.
      *   [ ] A winning position for P1.
      *   *Why?* ________________________________________________________
  8.  **Contradiction:** If Scenario B is a winning position for P1, then P1 had a winning move ($R$) all along. This contradicts our starting **Assumption**.
  9.  **Final Result:** Who wins Chomp? _______________
