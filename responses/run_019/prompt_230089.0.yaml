answer: |-
  **Running Example: The Chess Endgame**
  **Board Layout:** Left column: Rules of Chess ($R$), Board State ($S$). Right column: Fact ($W$ = "White has a forced win").
  **Requirements:** $R \land S \models W$ must be objectively true (verifiable by engine) but non-trivial for a human to derive instantly.
  **Exclusions:** Do not use mathematical conjectures (truth unknown) or empirical facts (contingent). The consequence must be logical necessity.

  **Sequence of Exposition**

  1.  **Formal Recap (15 mins):**
      *   Define standard Kripke semantics: $M, w \models K\phi$ iff $\forall v (wRv \to M, v \models \phi)$.
      *   Derive Closure: If $\phi \models \psi$, then $K\phi \to K\psi$.
      *   *Dependency:* Establishes the formal mechanism causing the issue.

  2.  **Example Application (30 mins):**
      *   Instantiate Chess: Agent knows $R$ and $S$. Since $R \land S \models W$, semantics dictates $K W$.
      *   *Dependency:* Applies abstract closure to concrete case.
      *   **Preempt Misconception 1 ("Computational Bounds"):** When students argue "They just haven't calculated it yet," interrupt. Clarify that semantics claims the knowledge *exists* in the model now, not that it is *computable*. The problem is ontological (what the agent *is*), not computational (what the agent *does*).

  3.  **The Modeling Crisis (45 mins):**
      *   Ask: "Did the agent know $W$ before calculating?"
      *   If **Yes**: $K$ represents "information availability," not "conscious belief."
      *   If **No**: The semantics is descriptively false for real agents.
      *   Force the decision: The formalism forces a choice between idealized rationality and psychological realism. You cannot have both.
      *   **Preempt Misconception 2 ("Implicit Belief"):** When students suggest "Just call it implicit belief," interrupt. Ask: "If modeling a security attacker, does 'implicit knowledge' of the key break the security proof?" Show that renaming doesn't fix utility; if the model says the attacker knows the key, the protocol is "broken" in the model, regardless of the label.

  4.  **Repairs & Distortions (45 mins):**
      *   Sketch two fixes: **Impossible Worlds** (allows $w$ where $\phi$ true, $\psi$ false despite $\phi \models \psi$) and **Awareness Sets** (agent only knows $\phi$ if $\phi$ is in syntactic set $A$).
      *   Show the distortion: Impossible worlds break logical omniscience but make agents illogical (might not know tautologies). Awareness sets save realism but make knowledge non-factive or syntax-dependent.
      *   *Dependency:* Shows that solving the problem breaks other desirable formal properties.

  5.  **Final Board Task (15 mins):**
      *   *Task:* "You are modeling a cryptographic protocol. The agent knows the Algorithm ($A$) and Ciphertext ($C$). The Key ($K$) is logically implied by $A \land C$ given infinite time. If you use standard Kripke semantics, what does the model assert about the agent's knowledge of $K$? Is this acceptable for security verification? Justify your choice of semantics based on what $K$ is intended to represent."
      *   *Success Criterion:* Students must identify that standard semantics asserts $K(K)$, rendering the protocol insecure in the model, and argue whether this idealization is a bug or a feature for their specific goal.

  **Explicitly Set Aside**
  *   **Dynamic Epistemic Logic:** Do not discuss how knowledge updates (public announcements). This distracts from the static structural problem.
  *   **Probabilistic Belief:** Do not introduce degrees of belief. Keep the binary nature of $K$ to highlight the sharpness of the closure problem.
  *   **Specific Axiom Systems:** Do not dwell on S4 vs. S5. The omniscience problem exists in K.

  **Dependencies Summary**
  The Crisis (3) depends on the Application (2) to make the problem visceral. The Repairs (4) depend on the Crisis to show why fixes are needed and what is lost. The Task (5) depends on the Repairs to ensure students evaluate trade-offs, not just definitions. Misconceptions must be preempted *during* Application and Crisis to prevent them from hardening before the modeling choice is revealed.
