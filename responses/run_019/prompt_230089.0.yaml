prompt: |-
  I'm leading a two-hour seminar session for master's students in philosophy and computer science on the problem of logical omniscience in epistemic logic. They have already worked with the standard Kripke semantics for knowledge — a set of possible worlds, an accessibility relation, and the rule that an agent knows a proposition when it holds throughout the accessible worlds — and they have accepted, without much worry, that the semantics thereby closes knowledge under logical consequence. Next session I want them to see that this closure is a genuine modeling problem: it forces a decision about what the formalism is meant to represent, and the obvious repairs each distort something. I am not asking you for the exposition itself; I am asking for a plan for the exposition. I need from you: the order in which the components must be introduced and what each stage depends on; the single running example that should carry the session — one compact enough to put on one board but rich enough that the gap between an agent's accepted rules and the consequences the semantics attributes to it becomes visible — and what the example must have and must lack; the misconceptions the students will predictably form or bring with them (I expect at least 'the problem is just that real agents are computationally bounded' and 'it is only a problem if the operator is read as explicit belief') and the exact point in the sequence where each should be pre-empted; one final question or board task that would show whether they have understood the modeling problem rather than memorized the phrase; and what I should explicitly set aside at this level. Keep the entire plan to no more than 900 words.
