answer: |-
  Your intuition that the Simple Conditional Analysis (SCA) fails is well-founded, but your inference that this pushes toward eliminativism represents a specific and minority trajectory in the contemporary literature. Most philosophers of metaphysics and science take the failure of the SCA as an argument *for* dispositional realism, not against it.

  Below, I distinguish between what is widely agreed upon (settled) and what remains deeply debated (contested), and I address your specific questions about explanatory replacement and truth conditions.

  ### 1. The Status of the Simple Conditional Analysis
  **Settled:** The Simple Conditional Analysis is false.
  It is widely agreed that the biconditional "Object $x$ is disposed to $M$ when $S$ iff if $x$ were $S$, $x$ would $M$" fails.
  *   **Finkish cases** (C.B. Martin): The disposition disappears exactly when the stimulus occurs (e.g., a wire that becomes non-conductive the moment it is touched).
  *   **Masked cases** (Johnston): The disposition remains, but something prevents the manifestation (e.g., fragile glass wrapped in foam).
  *   **Mimic cases:** An object lacks the disposition but manifests the behavior due to external interference (e.g., a non-fragile glass rigged to shatter when struck).

  **Contested:** What the failure of the SCA implies about ontology.
  *   **The Realist Consensus:** The majority view (e.g., Mumford, Bird, Ellis, Martin) is that the failure of the SCA shows dispositions cannot be *reduced* to conditionals. Instead, dispositions are irreducible, real properties (powers, propensities, or causal bases) that *ground* the truth of conditionals but are not identical to them.
  *   **The Revisionist View:** Some (e.g., Lewis, Gundersen) argue the SCA can be saved by adding "ceteris paribus" clauses or referencing the intrinsic causal base (Revised Conditional Analysis). However, many critics argue these revisions are ad hoc or circular.
  *   **The Eliminativist/Reductive View:** This is the position you are exploring. It holds that if dispositions cannot be analyzed conditionally, and if one rejects irreducible powers, then disposition talk must be eliminated or reduced to categorical properties plus laws. **This is not the consensus.**

  ### 2. The Eliminativist Project: Replacement and Explanatory Loss
  You asked what replaces disposition talk if we eliminate it, and how to avoid losing explanatory content.

  **The Proposed Replacement:**
  On a reductive or eliminativist picture (often associated with Humean categoricalism), disposition ascriptions are replaced by claims about:
  1.  **Categorical Bases:** The microphysical structure of the object (e.g., the molecular lattice of the glass).
  2.  **External Laws/Regularities:** The contingent laws of nature that govern how that structure interacts with the environment.
  3.  **Background Conditions:** The absence of masks or finks.

  So, "The glass is fragile" becomes "The glass has molecular structure $S$, and in the actual world, objects with structure $S$ break when struck, provided no masks intervene."

  **The Explanatory Problem (Your Worry):**
  You correctly identify the main objection to this view: **Explanatory Impotence.**
  *   **Realist Objection:** If dispositions are merely summaries of structure + laws, they cannot do causal work. The structure does the work, or the laws do the work. But scientists use dispositions to *explain* why the structure behaves as it does. (e.g., "Why did the glass break?" "Because it was fragile.")
  *   **The Humean Response:** A strict Humean (who denies necessary connections) argues that there is no "causal oomph" to lose. Explanation is just subsumption under regularities. If you eliminate dispositions, you lose nothing real because there were no causal powers to begin with.
  *   **The Middle Ground (Identity Theory):** Some philosophers (e.g., Armstrong, Place) argue dispositions are *identical* to their categorical bases. This avoids eliminativism but denies that dispositions are a *sui generis* ontological category.

  **Is there a consensus on the replacement?**
  **No.** There is no agreed-upon eliminativist framework that successfully recovers all scientific explanatory practices without residue. This is why eliminativism remains a minority view. Most philosophers of science retain disposition talk because it tracks "stable capacities" that persist across different environments, which pure categorical descriptions often fail to capture efficiently.

  ### 3. What is True of the Fink-Rigged Wire or Masked Poison?
  If we assume your eliminativist/reductive framework, here is what is true of the objects. If we assume the realist framework, the answer differs.

  **Case A: The Finkish Wire**
  *   **Eliminativist/Reductive Truth:** The wire has a microstructure $S$. In normal worlds (without finks), structure $S$ is correlated with conduction. In this specific world, there is an extrinsic mechanism (the fink) that alters $S$ upon contact. It is **false** to say the wire is "live" in the dispositional sense if "live" implies a stable capacity. It is only "live" in the sense that it possesses the categorical base that *usually* supports conduction.
  *   **Realist Truth:** The wire **is** live. It possesses the intrinsic power of conductivity. The fink is an extrinsic interferer that removes the power *at the moment of stimulus*. The disposition exists prior to the touch; the fink destroys it causally.

  **Case B: The Masked Poison**
  *   **Eliminativist/Reductive Truth:** The poison has chemical structure $C$. Structure $C$ interacts with biological system $B$ to cause death. However, the mask (antidote) intervenes in the chemical reaction. To say the poison is "poisonous" is a shorthand for "Structure $C$ kills in the absence of antidotes." The property "poisonous" is not a present reality of the object, but a prediction of behavior under ideal conditions.
  *   **Realist Truth:** The poison **is** poisonous. The power to kill is intrinsic. The mask prevents the *manifestation* of the power, but does not remove the power itself. The disposition is present but "masked."

  ### 4. Summary: Settled vs. Contested
  To ensure clarity on the dialectic, here is the breakdown of the current philosophical landscape regarding your query.

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **The Simple Conditional Analysis (SCA) is false.** | **Settled** | Finkish and masked cases are accepted as counterexamples to the *simple* biconditional. |
  | **Dispositions are irreducible real properties (Realism).** | **Contested** | This is the dominant view in analytic metaphysics, but rejected by Humeans and nominalists. |
  | **Dispositions do not exist (Eliminativism).** | **Contested (Minority)** | Most philosophers argue the failure of SCA supports Realism, not Eliminativism. |
  | **Dispositions are identical to categorical bases.** | **Contested** | The "Identity Theory" is a live option but faces objections regarding multiple realizability. |
  | **Revised Conditional Analyses (RCA) succeed.** | **Contested** | Many argue RCAs are circular or fail to handle complex finkish cases. |
  | **Eliminating dispositions loses explanatory content.** | **Contested** | Realists say yes (loss of causal power); Humeans say no (explanation is just description of regularities). |

  ### Conclusion for Your Project
  If you wish to pursue the eliminativist project, you are swimming against the current of the last 30 years of metaphysics. The standard response to finks and masks was not to abandon dispositions, but to **reify** them (treat them as real properties that are not conditionals).

  To make your eliminativist view viable, you must answer the "Explanatory Loss" objection. You cannot simply say dispositions are "loose summaries." You must demonstrate how a world of purely categorical properties + Humean laws can account for:
  1.  **Counterfactual robustness:** Why do we trust the glass will break *next time* the mask is removed, if the "fragility" isn't a persistent property?
  2.  **Causal Relevance:** How does the microstructure cause the breaking without invoking a "power" or "disposition" to break?

  If you cannot solve this, the literature suggests the "honest project" is not eliminativism, but **Dispositional Realism**: accepting that the wire *is* live and the glass *is* fragile, independent of whether the conditional "if struck, it would break" is currently true.
