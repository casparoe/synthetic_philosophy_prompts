  The Baron lies upon the carpet dead,
  Two servants wait within the candle's room.
  "If he didn't kill, the other sealed his doom,"
  We say, while blood upon the floor is spread.
  "If he hadn't killed," the logic softly said,
  "The other would have filled the house with gloom."
  As if both paths lead to the selfsame tomb,
  We join the thoughts as one united thread.

  Yet distinct spheres diverge within the light.
  The first respects the rigid world of fact.
  Where death is sure, revealed to human sight,
  If Butler didn't, Chauffeur did the act.
  Indicative bears the actual cost.
  Subjunctive seeks a world where death is lost.
