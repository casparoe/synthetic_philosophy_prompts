      *   **Context:** A whodunit (Baron dead, suspects: Butler and Chauffeur).
      *   **Structure:**
          *   *Octave:* Treat "If the butler didn't kill him, the chauffeur did" (Indicative) and "If the butler hadn't killed him, the chauffeur would have" (Counterfactual/Subjunctive) as if they mean the same thing (the common intuition).
          *   *Volta:* The realization that they *don't* mean the same thing.
          *   *Sestet:* Explain the distinction philosophically but poetically.
              *   Indicative: Evaluated against known facts (Baron is dead, one of them did it). Clearing Butler $\rightarrow$ Chauffeur did it.
              *   Counterfactual: Evaluated against nearest possible worlds where antecedent is true (Butler didn't kill). In those worlds, maybe the Baron lives, so Chauffeur doesn't necessarily kill.
          *   *Final Couplet:* State exactly what separates the two (accuracy + poetic feel).
      *   **Audience:** Accurate for a philosopher of language, accessible for a layperson.

