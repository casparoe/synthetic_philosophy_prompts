  ### The Systems

  **System A (The Accidental Catalyst)**
  In a deep-sea hydrothermal vent, a specific clay crystal lattice forms via stochastic thermal fluctuation. The lattice possesses two distinct surface defects, Type-1 and Type-2. By pure physical contingency (the local pH and ion concentration at the moment of freezing), Type-1 defects adsorb Molecule X and Type-2 defects adsorb Molecule Y. Physics permits the reverse pairing equally well; the mapping is arbitrary. Once formed, this specific crystal configuration happens to lower the activation energy for a reaction between X and Y, producing a stable polymer that coats the crystal. This is causally useful for the crystal's persistence, but the crystal formed five minutes ago; it has no lineage, no ancestors, and no selection history.

  **System B (The Stereochemical Replicator)**
  Consider a primitive, self-replicating peptide-nucleic acid hybrid. Specific nucleotide triplets bind specific amino acids via direct electrostatic complementarity (e.g., a positively charged triplet *must* bind a negatively charged amino acid). The mapping is chemically necessitated by the laws of physics; it could not have been otherwise without violating charge conservation. However, the complex as a whole replicates. Variants that stabilize this binding interaction reproduce faster. The system is the product of long-term natural selection, and the tokens (triplets) reliably produce outputs (peptides) that secure the system's survival, but the token-output relationship is law-like, not conventional.

  ***

  ### The Verdicts

  **1. The Deflationary View (Information = Correlation + Usefulness)**
  *   **System A:** **Is a Code.** There is a reliable correlation between defect type and molecule, and this correlation is currently useful (it catalyzes a stabilizing reaction). The lack of history is irrelevant; the current causal role suffices for information-talk.
  *   **System B:** **Is a Code.** There is a reliable correlation between triplet and amino acid, and it is profoundly useful for replication. The fact that the correlation is law-like doesn't negate its utility as a predictive map for the system.
  *   **Verdict Pattern:** **Yes / Yes**

  **2. The Arbitrariness View (Code = Contingent Mapping)**
  *   **System A:** **Is a Code.** The pairing of defects to molecules is physically contingent; it could have been otherwise. This "could-have-been-otherwise" quality is the hallmark of symbolic representation.
  *   **System B:** **Not a Code.** The pairing is dictated by electrostatic law. Calling this a "code" is like calling gravity a code for falling apples. There is no symbol ground problem here, only physics.
  *   **Verdict Pattern:** **Yes / No**

  **3. The Teleosemantic View (Code = Selected Effect)**
  *   **System A:** **Not a Code.** The crystal's mapping was not selected *for* its catalytic output; it merely happened to work. Without an etiological history of selection for that function, the tokens have no proper function, hence no meaning.
  *   **System B:** **Is a Code.** The tokens exist *because* they produce the specific outputs that aid replication. The mapping is maintained by selection pressure. This historical "aboutness" constitutes the code.
  *   **Verdict Pattern:** **No / Yes**

  ***

  ### The Analysis

  **The Feature Doing the Philosophical Work**
  The single feature driving the divergence is the **dissociation of utility, contingency, and history.** In standard biology, these three travel together (DNA is useful, arbitrary, *and* selected). By pulling them apart, the thought experiment reveals that "code" is not a natural kind but a cluster concept. The Deflationist cares only about the *current causal profile* (Utility). The Arbitrariness theorist cares only about the *modal status of the mapping* (Contingency). The Teleosemanticist cares only about the *etiological origin* (History). Your debate persists because you are prioritizing different features of the cluster.

  **If System A Had a Selection History**
  If you grant System A a selection history (e.g., the crystals reproduce and the ones with the X-Y mapping outcompete others), the **Teleosemantic verdict flips to Yes.** Suddenly, View 1 and View 3 align (Yes/Yes and No/Yes becomes Yes/Yes and Yes/Yes on the history dimension). This collapses the distinction between Deflationism and Teleosemantics, leaving only the Arbitrariness view as the outlier. This suggests that for most biologists, *history* is the heavier lifting feature than *arbitrariness*, which is why they accept DNA as a code despite the stereochemical debates.

  **How Your Friend (The Deflationist) Attacks**
  Your friend will not accept the construction; she will attack the **coherence of System A.** She will argue that "usefulness" without "selection history" is incoherent in a biological context. If the crystal catalyzes a reaction that helps it persist, and it persists, that *is* the beginning of selection. She will claim you cannot have "utility" without "history" in a natural system; utility is *defined* by survival consequences. By accepting System A as "useful but unselected," you have smuggled in a normative distinction she rejects. She will argue that until System A replicates, it's just chemistry, not information, rendering the Deflationary verdict "No" anyway. She wins by denying the possibility of the thought experiment's first premise.
