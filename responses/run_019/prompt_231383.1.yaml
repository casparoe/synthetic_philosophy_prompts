answer: |-
  Good morning. Welcome to the Department of Statistics. For those of you navigating the building, you may have noticed that the signs are faded. That seems appropriate. We are here to talk about things that are difficult to read, difficult to find, and difficult to agree upon.

  We have a diverse group in this room. We have methodologists who speak the languages of likelihood and posterior probability, often to each other, but rarely in unison. We have experimental psychologists who have spent careers building theories, only to watch the foundations tremble when colleagues in other labs try to rebuild them. And we have journalists, whose job it is to translate the tremors into headlines without causing a panic.

  It is tempting to open a workshop like this with a plea for unity. To suggest that if we just hold hands and share our data, the crisis will dissolve. I will not do that. Instead, I want to anchor us to a constraint that predates the crisis, predates the computer, and predates the modern university. It comes from R. A. Fisher, in *The Design of Experiments*.

  Fisher wrote that no isolated experiment, however striking or statistically significant, can by itself establish a natural phenomenon. His reasoning was cold and arithmetic: a chance result that ought to occur rarely will still occur with its proper frequency across repeated attempts. If you roll the dice enough times, a double-six will appear. If you run enough experiments, a false positive will appear. And if you publish only the double-sixes, you have not discovered a law of nature; you have merely documented the law of averages.

  I want to use Fisher's constraint not as a quotation, but as the architecture for our time together. Because if we accept Fisher's axiom, it changes what we are allowed to say to every group in this room.

  To the psychologists in the audience: This is the hardest part of the morning. Fisher's constraint implies that the replication crisis is not primarily a crisis of character. We have spent a decade hunting for fraud, p-hacking, and sloppy lab notebooks. We have found them, yes. But Fisher reminds us that even if every researcher in the world were perfectly honest, perfectly rigorous, and perfectly sober, we would *still* have a replication crisis.

  If the null hypothesis is true, and you run twenty experiments, one will yield $p < 0.05$. If that one experiment is the only one that gets published, the literature contains a lie, even if no one told one. This is a crisis of inference, not merely of conduct. It means that your single, beautiful, significant result—the one that got you tenure, the one that made the cover of a journal—is epistemically incomplete. It is a data point, not a conclusion. I know this feels like a demotion. It is intended to be. Fisher is telling us that the unit of scientific truth is not the paper. It is the phenomenon, observed across time and space.

  To the journalists: This constraint explains why your job has become impossible. You are hired to report on the isolated experiment. "Study Shows Coffee Cures Cancer." But Fisher tells us that the isolated experiment is structurally incapable of carrying that weight. When you report a single study as a settled fact, you are not simplifying the science; you are violating its logic. The crisis exists in your columns because the incentive structure of science produces isolated claims, and the incentive structure of news consumes them as final truths. We are not here to blame you for that, but we must acknowledge that as long as the currency of science is the "novel finding," the currency of news will be the "broken promise."

  And to my colleagues, the methodologists: This is where I need you to work. We have spent years arguing over whether the solution to Fisher's warning is better frequentist controls or more informative Bayesian priors. The frequentists argue that we need to control the long-run error rate. The Bayesians argue that we need to update our degree of belief based on the evidence at hand.

  But Fisher's constraint cuts through this debate. If no isolated experiment can establish a phenomenon, then it does not matter whether you attach a $p$-value or a Bayes Factor to a single study. Both are attempting to quantify evidence from a sample size of one *event*, when the epistemology requires a sample size of many *events*.

  So, here is the precise problem I am putting on the table for this workshop. We need to move from evaluating the *statistical validity of a single claim* to evaluating the *accumulation of evidence across claims*.

  For the frequentists: How do we design error-control procedures that account for the fact that the "experiment" is now a distributed, multi-lab effort, rather than a single grant cycle? How do we control false discovery rates when the "family" of tests is spread across five universities and ten years?

  For the Bayesians: How do we formalize priors that are robust enough to dampen the noise of a lucky first study, but flexible enough to update when a genuine anomaly appears? If a replication fails, how much does the posterior shift? Does it depend on the fidelity of the replication protocol?

  Do not leave this room simply agreeing that "replication is good." That is trivial. The hard question is: What is the mathematical and institutional structure that allows us to treat replication not as a punishment for the original researcher, but as the fundamental unit of inference?

  We must also be wry enough to admit the discomfort this causes. For the psychologist, admitting Fisher is right means admitting that your life's work is a collaborative draft, not a finished monument. For the methodologist, it means admitting that your elegant formulas cannot save a research culture that rewards the double-six. For the journalist, it means writing headlines that say "Evidence Accumulates" rather than "Breakthrough."

  I want to end by managing our expectations. We are gathered here for two days. We will not solve the replication crisis. In fact, if we accept Fisher's constraint, we must admit that the crisis is never "solved." It is only managed. There will always be another rare chance result. There will always be another isolated experiment that looks too good to be true.

  The goal of this workshop is not to produce a checklist that guarantees truth. The goal is to agree on how we behave when the inevitable happens. When the replication fails, do we circle the wagons? Do we blame the methods? Or do we accept that the first experiment was never a proof to begin with?

  Fisher told us that nature does not reveal herself in a flash of significance. She reveals herself in the repetition. Our task is to build a scientific culture that values the repetition as much as the revelation. That is genuinely hard. It requires us to change how we hire, how we publish, and how we speak to the public.

  So, let us begin. Not with the hope of a quick fix, but with the resolve to do the slow, unglamorous work of checking the dice.

  Thank you.
