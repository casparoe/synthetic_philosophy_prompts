  **TO:** Institutional Clients
  **FROM:** Aethelgard Global Partners, Macro Strategy Desk
  **DATE:** 14 January 2024
  **SUBJECT:** 2024 Global Outlook: Calibrating Terminal Value under Anthropic Constraints

  **Executive Summary**
  Our base case for global equity duration remains constructive, though our Anthropic Risk Desk has materially adjusted the tail-weighting of our discounted cash flow models. While conventional geopolitical analysis treats existential risk as a low-probability binary event, our updated framework applies the Self-Sampling Assumption (SSA) to humanity's temporal position. We are not merely observing survival; we are observing our rank within the total population distribution. Consequently, we advise reducing exposure to long-duration assets tied to single-planetary continuity and diversifying into multiverse hypotheses with higher observer densities.

  **1. The Bayesian Overlay**
  Investors often confuse ordinary induction with anthropic updating. The former argues that because humanity has survived 200,000 years, it is robust. This is survivorship bias. Our model rejects this. Instead, we treat your existence as a random sample from the set of all observers who will ever exist. If you assume a uniform prior over your birth rank, finding yourself relatively early (approximately the 60 billionth human) implies a high likelihood that the total sequence is not vastly larger than the current count.

  Crucially, this is not a claim about the *prior* probability of extinction. We maintain a agnostic prior regarding nuclear exchange or asteroid impact. The Doomsday overlay functions purely as a likelihood shift. Even if your physical risk models suggest a 99% chance of millennium-long survival, the fact of your early birth rank updates the posterior probability toward earlier termination. We are not predicting catastrophe; we are noting that a long future makes your specific presence statistically improbable.

  **2. Reference Class Arbitrage**
  The primary sensitivity in this model is the definition of the reference class. Who counts as an observer? If we define the class strictly as *Homo sapiens sapiens*, the confidence interval for total population compresses alarmingly. However, if we expand the class to include post-biological substrates or uploaded consciousness, the total potential population expands, pushing the expected doom horizon outward.

  Our analysts have been tasked with stress-testing this boundary. Initial drafts of this memo utilized a narrow biological definition, resulting in a median civilization lifespan of 400 years. Upon review, the desk broadened the class to include "any entity capable of holding a derivative contract." This adjustment successfully pushed the median expiration date beyond the typical bond maturity cycle. We consider this recalibration prudent risk management, though we acknowledge the philosophical fragility of excluding non-investing observers.

  **3. Recursive Hazard and Firm Longevity**
  A complication arose during the drafting of this section. The Head of Anthropic Strategy noted that he, too, is a randomly sampled observer within the reference class of "financial analysts at boutique macro firms." Applying the SSA to the firm's own client newsletter sequence suggests that this specific memo is likely near the end of the firm's publication history.

  Consequently, every time an analyst recalls their own status as a sample, the firm's expected longevity collapses. We initially projected a 50-year runway for Aethelgard. After internalizing the sampling effect, the model updated to a 60% probability of dissolution before Q3. We advise clients to download this report immediately while the hosting server remains operational. The framework cannot survive being applied to itself without inducing the very contraction it predicts.

  **4. Strategic Allocation**
  Given these constraints, standard diversification is insufficient. Hedging against human extinction is costly and offers no payout in the counterfactual where you do not exist to collect it. Instead, we recommend tilting portfolios toward hypotheses that imply vast numbers of observers.

  Under the Self-Indication Assumption (SIA), universes with more observers are *a priori* more likely to contain you. Therefore, assets correlated with high-fertility scenarios or simulation theories with massive computational substrates offer superior risk-adjusted returns. Essentially, bet on the future being crowded. If the universe is large, you are likely in it. If it is small, you are likely not here to worry about your portfolio.

  **Figure 1: The Doom Horizon**
  *See attached chart.*
  *Description:* A log-scale timeline showing humanity's cumulative population. The shaded region represents the 95% confidence band for total future observers. The band rests on an undisclosed uniform prior over birth ranks. The "Optimistic Case" line diverges only after the reference class is expanded to include synthetic minds. Note that the confidence interval narrows significantly as the analyst's own birth rank is updated in real-time.

  **Conclusion**
  We remain committed to helping clients navigate uncertainty, provided the uncertainty does not encompass our own existence as sampling units. The outlook is stable, conditional on you not thinking too hard about your position in the sequence.

  *Disclaimer: This memo does not constitute advice on how to avoid extinction, only how to position for it. Past performance of civilizations is not indicative of future survival.*

