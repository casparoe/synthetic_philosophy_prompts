answer: |-
  # ADVERSARIAL COLLABORATION STATEMENT: THE MORAL STATUS OF COMBATANTS

  **Date:** October 26, 2023
  **Participants:** [Traditionalist Representative] (TR) & [Revisionist Representative] (RR)
  **Facilitator:** [Working Group Lead]

  ## 1. SUBSTANTIVE AGREEMENTS
  *The following claims are affirmed by both parties. They are not merely definitional truisms but substantive philosophical commitments that bound the disagreement.*

  1.  **Non-Combatant Immunity:** Both parties agree that civilians who do not directly participate in hostilities retain a strong right not to be killed, regardless of the justice of the war their state is waging. The *ad bellum* status of the state does not dissolve civilian immunity.
  2.  **The Reality of *Ad Bellum* Justice:** Both parties agree that wars of aggression are objectively morally wrongful acts and that political leaders who initiate them incur significant moral culpability. The disagreement concerns whether this culpability "trickles down" to the individual soldiers.
  3.  **Epistemic Limitations:** Both parties agree that individual soldiers often operate under severe epistemic constraints regarding the true justice of their cause, and that sincere, reasonable belief in the justice of one's cause is common on both sides of a conflict.
  4.  **Distinction Between Law and Morality:** Both parties agree that International Humanitarian Law (IHL) is a distinct normative system from deep morality. They agree IHL currently codifies the Traditionalist view (Moral Equality of Combatants), but disagree on whether IHL *ought* to track deep morality or function as a pragmatic compromise.
  5.  **Rejection of Pacifism:** Both parties operate under the assumption that war is sometimes permissible and that killing in war is not inherently murder, provided specific conditions are met.

  ## 2. DISAGREEMENTS TABLE
  *Each row identifies a specific point of contention. The phrasing in each column represents the claim exactly as that side defends it.*

  | Topic | Traditionalist View (TR) | Revisionist View (RR) |
  | :--- | :--- | :--- |
  | **1. The Basis of Liability** | **Status-Based:** A combatant becomes liable to defensive harm primarily by virtue of their status as an agent of a coercive institution engaged in war. Wearing the uniform and posing a threat is sufficient for liability. | **Responsibility-Based:** A combatant becomes liable to defensive harm only if they are morally responsible for an *unjust* threat. Merely posing a threat is insufficient; the threat must be wrongful. |
  | **2. Symmetry of Permissions** | **Symmetric:** If a soldier obeys *in bello* rules (discrimination, proportionality), they act permissibly, even if their war is unjust. The unjust combatant has the same right to kill the just combatant as the just combatant has to kill them. | **Asymmetric:** The just combatant has a right to kill the unjust combatant (in self/other-defense). The unjust combatant generally lacks the right to kill the just combatant, even if they follow *in bello* rules. |
  | **3. Normative Weight of Ignorance** | **Constitutive:** The soldier's reasonable ignorance of the *ad bellum* injustice renders their fighting permissible. It creates a "moral fog" that establishes symmetry where none exists objectively. | **Exculpatory Only:** Reasonable ignorance may excuse the soldier from *blame* or punishment, but it does not render the act permissible. One can be blameless but still objectively wrong to kill. |
  | **4. Function of the Convention** | **Regulative:** The moral rules of war depend on the existence of a reciprocal convention. We grant enemies rights to ensure they grant us rights. Symmetry is required for the convention to function. | **Derivative:** The rules of war are derived from fundamental rights of self-defense and liability. A convention cannot grant a right to do what is objectively morally forbidden (killing in service of injustice). |

  ## 3. CRUXES
  *These are specific sub-questions where a resolution would significantly alter the scope of the disagreement. For each, we identify a concrete case, the specific question at issue, and what each side predicts would happen if the question were settled in favor of the other.*

  ### Crux A: The Threshold of Causal Contribution
  *   **The Sub-Question:** Does liability to attack require a *direct* causal contribution to immediate harm, or does membership in a threatening *system* suffice?
  *   **The Concrete Case:** **The Conscript Driver.** An unjust aggressor state conscripts a civilian to drive a supply truck 50 miles behind the front lines. The supplies eventually reach soldiers who commit atrocities. A just combatant targets the truck.
  *   **TR Prediction:** If RR admits the driver is liable, the Revisionist view collapses into Practical Traditionalism (since most soldiers are similarly situated). If RR denies liability, they must accept that many traditional targets are immune, radically changing the conduct of war.
  *   **RR Prediction:** If TR admits the driver is *not* liable, they concede that *in bello* permissions track individual responsibility (Revisionism). If TR insists he is liable solely due to uniform/status, they must defend killing minimally responsible agents, which undermines the self-defense analogy.

  ### Crux B: Objective vs. Subjective Liability
  *   **The Sub-Question:** Is liability determined by the objective facts of the threat, or by the facts accessible to the agent (reasonable belief)?
  *   **The Concrete Case:** **The Invincible Ignorance.** A soldier fights for an objectively unjust cause, but all available evidence (state propaganda, sealed intelligence) indicates their war is just. They pose a lethal threat to a just combatant.
  *   **TR Prediction:** If RR concedes that "reasonable belief" removes *liability* (not just blame), the Moral Equality of Combatants is restored for all practical purposes. The "deep morality" becomes action-guiding only for omniscient observers.
  *   **RR Prediction:** If TR concedes that the soldier is objectively contributing to a wrongful harm (and thus objectively liable), they admit the Moral Equality of Combatants is false in principle, even if we pretend otherwise for legal convenience. The "symmetry" is admitted to be a fiction.

  ### Crux C: The "Reciprocity" Condition
  *   **The Sub-Question:** Do I owe *in bello* restraint to an enemy *because* they are liable, or *because* they follow the rules?
  *   **The Concrete Case:** **The Lawful Aggressor.** An unjust combatant strictly follows the laws of war (no torture, distinguishes civilians). A just combatant has them at their mercy.
  *   **TR Prediction:** If RR admits the just combatant *must* spare the lawful aggressor to maintain the war convention, then consequentialist/conventionalist concerns override liability concerns. Morality requires symmetry for the greater good.
  *   **RR Prediction:** If TR admits the just combatant *may* kill the lawful aggressor because they are objectively liable (despite the convention), then the convention is admitted to be legally useful but morally secondary. Deep morality is asymmetric.

  ## 4. NOTE ON VERBAL AND CONCEPTUAL DISPUTES
  *We acknowledge that a portion of our disagreement stems from divergent uses of key normative terms. Clarifying these does not resolve the debate, but prevents talking past one another.*

  1.  **"Permissible" vs. "Excusable":**
      *   **TR** tends to use "permissible" to mean "not subject to sanction or blame within the war convention."
      *   **RR** uses "permissible" to mean "objectively morally justified in the eyes of an ideal observer."
      *   *Resolution Path:* We agree to distinguish **Action-Guiding Permissibility** (what the soldier should do given their evidence) from **Objective Permissibility** (what is actually right given the facts). TR cares mostly about the former; RR cares mostly about the latter.

  2.  **"Liability":**
      *   **TR** often conflates liability with "legitimate target status under IHL."
      *   **RR** defines liability strictly as "forfeiture of the right not to be killed."
      *   *Resolution Path:* We acknowledge that one can be a "legitimate target" legally (TR's focus) without having "forfeited one's right to life" morally (RR's focus). The dispute is whether these two categories *ought* to align.

  3.  **"The War Convention":**
      *   **TR** treats the Convention as a moral entity that generates obligations (a contract).
      *   **RR** treats the Convention as a set of heuristics that may conflict with fundamental rights.
      *   *Resolution Path:* We agree to specify when we are arguing about the *morality of the convention itself* versus the *morality of individual acts within the convention*.

  ***

  **Signed:**

  _________________________ (Traditionalist Representative)

  _________________________ (Revisionist Representative)

  _________________________ (Facilitator)
