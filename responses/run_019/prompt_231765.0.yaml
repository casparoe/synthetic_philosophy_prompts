      *   *Topic 3: Epistemic Constraints.*
          *   Walzer: Normatively decisive (excuses liability).
          *   McMahan: Normatively mitigating (excuses blame, but not liability).
      *   *Topic 4: Relation of Law to Morality.*
          *   Walzer: Law should track this moral equality to function.
          *   McMahan: Law is a pragmatic compromise that diverges from deep morality.

  5.  **Drafting Section 3: Cruxes:**
      *   Need specific sub-questions where an answer shifts the view.
      *   *Crux 1 (User Hint):* Objective Liability vs. Reasonable Belief.
          *   Case: The Invaded Defender. A soldier defends their country against an aggressor. The aggressor soldier sincerely believes they are liberating.
