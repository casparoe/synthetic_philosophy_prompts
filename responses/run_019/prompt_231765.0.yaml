          *   *Refinement:* The "Invincible Ignorance" case. A soldier fights for what is objectively unjust, but evidence available to them makes it look just.
          *   Walzer: Not liable (or at least, permissible to fight).
          *   McMahan: Liable to defensive harm, but not blameworthy.
          *   *Wait, the crux needs to be something that moves them.* If McMahan admits reasonable belief reduces liability, she moves toward Walzer. If Walzer admits objective injustice creates some asymmetry, he moves toward McMahan.
