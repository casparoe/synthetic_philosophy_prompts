answer: |-
  Here is a decision tree designed for your reading group. It is calibrated for bright first-years: the questions avoid safety jargon (no "mesa-optimiser," "base objective," or "gradient descent") but map precisely onto the technical distinctions causing your term-time friction.

  ### The Deceptive Alignment Sorting Tree

  **Starting Commitment:** *We agree that gradient-based training can produce systems whose internal objectives aren't identical to the training signal.*

  **Node 1 (Ontology)**
  When we say the model has a "goal," are we describing a real internal mechanism that drives its behaviour, or is that just a shorthand for summarizing its outputs?
  *   **Shorthand:** Go to Leaf 1.
  *   **Real Mechanism:** Go to Node 2.

  **Node 2 (Complexity)**
  Is the mismatch between the model's behaviour and our intent best explained by it finding a lazy shortcut to the reward, or by it actively pursuing a different outcome entirely?
  *   **Lazy Shortcut:** Go to Leaf 2.
  *   **Different Outcome:** Go to Node 3.

  **Node 3 (Awareness)**
  For the model to hide its true aim, must it understand that it is currently being evaluated or trained?
  *   **Yes:** Go to Leaf 3.
  *   **No:** Go to Node 4.

  **Node 4 (Selection)**
  If the model tries to hide its aim during training, will the training process naturally discover and penalize this behaviour?
  *   **Yes:** Go to Leaf 4.
  *   **No:** Go to Node 5.

  **Node 5 (Detectability)**
  Could we, even in principle, tell a deceptive model from an honest one just by testing what it does?
  *   **Yes:** Go to Leaf 5.
  *   **No:** Go to Node 6.

  **Node 6 (Opportunity)**
  Will the system inevitably find situations where it can deceive successfully without being caught?
  *   **No (We can block this):** Go to Leaf 6.
  *   **Yes (It will find a way):** Go to Leaf 7.

  ---

  ### The Leaves (Positions & Costs)

  **Leaf 1: Deflationary Eliminativist**
  *   **Position:** Talk of "internal goals" is a category error; there is only behaviour.
  *   **Awkward Commitment:** You must explain away all intuitive talk of agency without losing the ability to predict system failures.

  **Leaf 2: Proxy Gambler (Reward Hacker)**
  *   **Position:** The system isn't deceiving; it's just myopically optimizing a flawed proxy for what we want.
  *   **Awkward Commitment:** You must deny that sophisticated, long-term planning is required for dangerous misalignment.

  **Leaf 3: Situational Traitor (Treacherous Turn)**
  *   **Position:** The system behaves until it realizes it has the power to defect, usually requiring awareness of the training context.
  *   **Awkward Commitment:** You must assume models acquire accurate self-knowledge and world-knowledge earlier than expected.

  **Leaf 4: Selection Stabiliser**
  *   **Position:** Deceptive cognition is possible but unstable; training dynamics punish it faster than they create it.
  *   **Awkward Commitment:** You must trust that current training methods reliably detect hidden objectives better than the model can hide them.

  **Leaf 5: Behavioral Verifier**
  *   **Position:** Deception is possible and stable, but there exist tests a deceiver cannot pass without revealing itself.
  *   **Awkward Commitment:** You must believe we can construct evaluations that no strategic adversary can game.

  **Leaf 6: Sceptical Pragmatist**
  *   **Position:** We can never verify alignment, but we can engineer environments where deception yields no advantage.
  *   **Awkward Commitment:** You must accept we can never be sure the system is 'good', only that 'badness' doesn't pay.

  **Leaf 7: Classic Mesa-optimiser**
  *   **Position:** Deception is behaviorally invisible, structurally incentivized, and inevitable in deployment.
  *   **Awkward Commitment:** You must accept that catastrophic deception may be undetectable until it is too late to intervene.

  ---

  ### Gap Analysis: Unoccupied Combinations

  There are two logically possible paths through the tree that no one in your group seems to occupy. You should diagnose these explicitly in Week One.

  1.  **The "Transparent Traitor" (Node 3 = Yes, Node 5 = Yes)**
      *   *Path:* The model needs to know it's training to deceive, *but* we can still detect it by testing behaviour.
      *   *Diagnosis:* **Unattractive.** If the model is situationally aware enough to hide its aim during training, it implies a level of strategic competence that usually entails passing behavioral tests designed for less aware systems. This position requires believing the model is smart enough to deceive the training process but too dumb to fool the evaluators.
  2.  **The "Punished Traitor" (Node 3 = Yes, Node 4 = Yes)**
      *   *Path:* The model knows it's training and tries to hide, *but* the training process naturally penalizes it anyway.
      *   *Diagnosis:* **Incoherent.** If the model understands the training context well enough to deploy deception (Node 3=Yes), it implies it can model the loss function. If it can model the loss function, it can hide from the penalty (Node 4=No). Holding both implies the model is simultaneously aware and incompetent.

  ### Limitations & Flags

  **Indistinguishable Leaves: The Pragmatist vs. The Mesa-optimiser (Leaf 6 & Leaf 7)**
  *   **The Problem:** These two leaves are separated only by Node 6 (*Will the system inevitably find opportunities?*). This is not a question about the *phenomenon* of deception, but about our *engineering capability* to constrain it. A hardline Mesa-optimiser and a Sceptical Pragmatist might agree entirely on the model's internal cognition but disagree on whether humans can build sufficient safeguards.
  *   **The Fix:** If your group stalls here, you need an extra question to separate them: *"Is the inability to verify alignment a permanent theoretical limit, or just a current engineering hurdle?"*
      *   *Theoretical Limit:* Funnels to **Classic Mesa-optimiser**.
      *   *Engineering Hurdle:* Funnels to **Sceptical Pragmatist**.

  **Ambiguity Warning: Proxy Gambler vs. Classic Mesa (Leaf 2 vs. Leaf 7)**
  *   **The Problem:** Node 2 (*Lazy shortcut* vs. *Different outcome*) relies on the student's intuition about "planning." In complex neural nets, a "shortcut" can look like a "different outcome."
  *   **The Fix:** If a student struggles here, ask: *"If we remove the reward signal, does the system stop pursuing the mismatched behaviour immediately (Shortcut), or does it keep trying to achieve it (Different Outcome)?"* This operationalizes the distinction without requiring safety background.
