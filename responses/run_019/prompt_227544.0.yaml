answer: |-
  You have grasped the Gibbard–Satterthwaite (G-S) theorem correctly: it is indeed an impossibility result stating that *any* non-dictatorial voting rule with three or more alternatives is theoretically manipulable.

  However, the conclusion you draw from this—that all voting rules are therefore *equally* manipulable and that comparing them is a mistake—is a common misinterpretation of the theorem's scope. The literature and practice you are observing are **not** resting on a mistake.

  The confusion stems from treating manipulability as a **binary property** (either a system is manipulable or it isn't) rather than a **continuous variable** (a system can be more or less vulnerable to manipulation). The G-S theorem establishes the former, but political science and social choice theory are concerned with the latter.

  Here is how researchers make coherent comparisons of manipulability despite the theorem.

  ### 1. Existence vs. Frequency (The "Measure" Problem)
  The G-S theorem is an **existential** claim. It proves that for any rule, there *exists* at least one profile of voter preferences where manipulation is possible. It does not tell us how *many* such profiles exist.

  *   **Rule A** might be manipulable in 1% of all possible preference profiles.
  *   **Rule B** might be manipulable in 50% of all possible preference profiles.

  Both satisfy the G-S theorem (both are $>0\%$), but they are vastly different in practice. Researchers use probabilistic models (such as the "Impartial Culture" assumption or spatial voting models) to estimate the **frequency** with which manipulable situations arise. If Instant-Runoff Voting (IRV) is manipulable in significantly fewer realistic scenarios than Plurality voting, it is considered "less manipulable" in a meaningful, practical sense, even if both are theoretically manipulable.

  ### 2. Computational Complexity (The "Barrier" Problem)
  Even if a voter *could* manipulate an election, can they actually figure out *how*?

  To manipulate a vote strategically, a voter usually needs to calculate which insincere ballot will yield their preferred outcome. This requires information and processing power.
  *   For **Plurality voting**, the strategic calculation is trivial: "Vote for the most viable candidate I like, not my true favorite."
  *   For other systems (like certain forms of Single Transferable Vote or Borda count), finding the optimal strategic vote can be **computationally intractable** (NP-hard).

  This line of research, pioneered by computer scientists like Bartholdi, Orlin, and Tovey, argues that if finding a manipulation requires solving a problem that would take a supercomputer years to solve, the system is effectively non-manipulable for human voters. Thus, rules can be compared by the **computational cost** of manipulation.

  ### 3. Information Requirements
  The G-S theorem assumes a voter knows enough about other voters' preferences to know that manipulation will work. In reality, voters operate under uncertainty.

  *   **High Information:** Some rules require a voter to know the exact ballot of every other voter to successfully manipulate.
  *   **Low Information:** Other rules can be manipulated based merely on polling data or rough heuristics.

  A voting rule that requires perfect information to manipulate is much more robust in the real world than one that can be gamed with limited information. Comparing rules based on their **informational vulnerability** is a valid and active area of study.

  ### 4. Magnitude of Incentive
  Not all manipulations are created equal.
  *   In some scenarios, manipulating changes the winner from your **1st choice** to your **2nd choice**.
  *   In others, it changes the winner from your **5th choice** to your **1st choice**.

  The "strength" of the incentive to lie matters. If a system only offers marginal gains for strategic voting, voters are less likely to bother risking the cognitive load or ethical discomfort of lying. Researchers compare systems based on the **expected utility gain** from manipulation.

  ### 5. An Analogy: Security Locks
  To visualize why the literature isn't a mistake, consider physical security:
  *   **Theorem:** "There is no such thing as an unpickable lock." (This is true; given enough time and tools, any mechanical lock can be opened.)
  *   **Your Inference:** "Therefore, a cheap padlock is just as secure as a bank vault door. Comparing them is a mistake."
  *   **Reality:** We absolutely compare locks. We care about *how long* it takes to pick them, *what tools* are required, and *how often* they are actually picked in the real world.

  The G-S theorem tells us there are no "unpickable locks" (voting rules). Social choice theorists are trying to design the "bank vaults" rather than the "cheap padlocks."

  ### 6. A Note on Approval Voting
  You mentioned Approval Voting. It is worth noting that the G-S theorem specifically applies to voting rules where voters submit a **ranked ordering** of candidates. Approval Voting asks for **cardinal** utility (approve/disapprove).

  While Gibbard's later (1973) theorem generalized the impossibility to all voting games, Approval Voting occupies a slightly different space. Because it allows voters to express intensity of preference (by drawing a line between "approve" and "disapprove"), the *nature* of the manipulation changes. Comparing Approval to Ranked systems is valid because the *type* of strategic behavior required differs fundamentally, even if the impossibility shadow still looms.

  ### Summary
  The literature is not ignoring the Gibbard–Satterthwaite theorem; it is working **downstream** of it.

  1.  **G-S Theorem:** "Is there *any* vulnerability?" (Answer: Yes, for all non-dictatorial rules.)
  2.  **Comparative Research:** "How *severe* is the vulnerability?" (Answer: Varies wildly by rule.)

  Practitioners treat vulnerability as a design consideration because they are not designing for the theoretical worst-case scenario proven by G-S; they are designing for the **statistical average case** of human behavior, information constraints, and computational limits. Therefore, saying one rule is "less manipulable" than another is a coherent, meaningful, and empirically testable claim, provided one defines manipulability as a matter of degree rather than a binary state.
