  Two general rules explain her prior classifications: the **Functional Rule**, which categorizes based on whether members revise beliefs upon exposure to outside evidence (revision indicates bubble or neither; resistance indicates echo chamber), and the **Structural Rule**, which categorizes based on the presence of a discrediting mechanism like a shared narrative or systemic distrust (presence indicates echo chamber; absence indicates bubble). Applied to the new case, the Functional Rule predicts an epistemic bubble because members quietly revise beliefs after conversations, whereas the Structural Rule predicts an echo chamber because an explicit discrediting doctrine is taught and reinforced.

  The verdict on Case 4 most constrains this prediction because it establishes that the *outcome* of exclusion matters more than the *structure* of distrust. In Case 4, the community lacked a shared narrative yet was classified as an echo chamber solely because "no outside claim ever gets a hearing," proving that effective resistance is the necessary condition for that label. Since the new case features effective permeability despite the doctrinal structure, the Functional Rule overrides the Structural Rule, aligning the community with Case 1 (open to correction) rather than Case 2 (resistant to correction).

  A hypothetical community that would decisively discriminate between these rules is a secular hobby group with no distrust of outsiders and no discrediting narratives, whose members simply ignore outside feedback due to apathy and never change their views. The Functional Rule would classify this as an echo chamber (due to resistance), while the Structural Rule would classify it as an epistemic bubble (due to the absence of a discrediting mechanism).
