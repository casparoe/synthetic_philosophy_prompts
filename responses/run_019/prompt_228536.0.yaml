answer: |-
  **The Principle**
  The best candidate underlying your intuitions is **The Principle of Intended Harm and Exclusive Proximity**. It holds that (1) it is impermissible to intend harm as a means or an end (the Aquinas/Double Effect core), but (2) foreseeable inaction is morally equivalent to intentional harm *only* when the agent possesses exclusive knowledge of the threat and stands in immediate physical or causal proximity to the victim, such that intervention requires minimal sacrifice. This principle preserves the sanctity of intention (ruling out direct killing) while creating a narrow, high-duty exception for omissions that feel like "hands-on" negligence, distinguishing between general charity and specific rescue.

  **Case by Case**
  This principle cleanly adjudicates your six verdicts, though it relies heavily on the "proximity" clause for the omission cases. In **Bystander Trolley**, diverting the car intends to save five; the worker's death is a foreseen side effect, not a means, so it passes clause (1). In **Transplant**, the healthy patient's death is the *means* to save the five, violating clause (1). For **Ventilator vs. Injection**, unplugging intends to cease unwanted intrusion (death is foreseen), while injection intends death; clause (1) permits the former and forbids the latter.

  The omission cases rely on clause (2). In the **Drowning Toddler**, you are the unique, proximate agent; the cost (wet shoes) is minimal. Your inaction triggers the "equivalent to harm" clause, making it monstrous. Similarly, in **Poisoned Water**, your exclusive knowledge and immediate capacity to speak create a specific duty of care; silence becomes functional complicity. However, the **Charity** case is where the principle does heavy lifting to match your gut: the beneficiaries are not proximate, and your agency is not exclusive (others could donate). Thus, clause (2) is not triggered, rendering the omission "shabby" but not "murderous." This clause risks being ad hoc, as it relies on psychological salience rather than moral weight, but it successfully maps your current distinctions.

  **The Verdict to Drop**
  To make your moral framework consistent and defensible, you should drop the **Charity** verdict. The distinction between the drowning toddler and the distant starving child is geographically real but morally irrelevant; both involve a specific life lost due to your choice to prioritize luxury over survival. If exclusive knowledge and low cost create a duty in the pond case, the effective charity case meets those criteria too (you know the need, $200 is low cost relative to a life). Maintaining the distinction requires appealing to evolutionary bias (we care more about what we see) rather than ethical reasoning. Accepting an obligation to donate aligns your omissions with your actions, removing the "sits badly" tension.

  **Stress Test**
  Consider **The Remote Switch**: You are the only person who can divert a runaway trolley via a secure internet link from your living room, killing one to save five. Aquinas's Double Effect focuses on your *intent* (saving five), permitting the act regardless of distance. Your Principle, however, hinges on *Exclusive Proximity*. If "proximity" means physical presence, your principle forbids acting (or renders inaction permissible), whereas Aquinas permits it. If your principle allows remote "causal proximity," it collapses back into the Charity case, forcing you to admit you are obligated to act on all preventable harms you know about.
