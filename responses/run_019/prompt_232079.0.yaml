      *   *RAW nuance:* Even RAW isn't truly raw. It has black level subtraction, etc. But for the metaphor, treat RAW as "pre-cognitive."
      *   *Key Insight:* The photographer *is* the camera. In the philosophy debate, the "camera" is the mind. If the photographer adjusts settings based on expectation *before* shooting, is that penetration? No, that's setting parameters. Penetration is if the *sensor physics* change.
      *   *Better Analogy:* ISO gain controlled by a neural network analyzing the scene *during* integration time.

