      *   **The Verdict:** Is the distinction sharp? No, the metaphor breaks because the brain isn't a pipeline; it's a recurrent network.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Make sure to use the specific terms:* Sensor, RAW, Demosaicing, WB, Exposure, Compression, File vs. Rendered.
