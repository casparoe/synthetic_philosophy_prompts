answer: |-
  ### Informal Brainstorm: The Pressures on the View

  Before we formalize the requirements, here are the raw tensions any contractualist account of aggregation has to juggle. Think of these as the gravitational pulls distorting the theory:

  *   **The "One-to-One" Trap:** If I justify a principle to you, I compare your complaint to mine. If we both die, the complaints look identical. Where does the "five" enter the equation if I'm only talking to "one"?
  *   **The Floodgates:** If we allow numbers to count, do we allow *any* numbers? Does a million stubbed toes outweigh a life? If not, where is the cutoff?
  *   **The Lottery Problem:** In vaccine allocation, nobody dies for sure *ex ante*. Everyone faces a risk. Does contractualism care about the distribution of risk or only the actual outcome?
  *   **The Identity Crisis:** If the theory ends up saying "maximize lives saved" in all hard cases, why call it contractualism? Is it just deontological window dressing for utilitarian results?
  *   **The Rejection Point:** Who is doing the rejecting? The person who dies? The person who lives? The principle must be rejectable by the person burdened, but if the burden is death, isn't *any* principle allowing it rejectable?

  ***

  ### Desiderata for an Adequate Contractualist Treatment of Aggregation

  Here are the five specifications a robust contractualist theory must meet to handle resource rationing without collapsing into incoherence or consequentialism.

  **1. The Greater Number Constraint**
  *   **Requirement:** The view must explain why, ceteris paribus, it is permissible (or required) to save five strangers rather than one, even though justification is owed to each individual separately.
  *   **Motivating Case:** *The Burning Building.* You can save one person in Room A or five people in Room B. All will die if not saved. All have an equal complaint about death. A theory that forces a random coin toss here fails to capture the moral urgency of the five. If contractualism cannot account for the moral significance of numbers, it is practically useless for triage.

  **2. The Severity Threshold (Non-Aggregation of Trivialities)**
  *   **Requirement:** The view must prevent the summation of many minor burdens from outweighing a single catastrophic burden imposed on an individual.
  *   **Motivating Case:** *Traffic vs. Life.* A policy saves one person from dying but causes a 5-minute traffic delay for a million commuters. Utilitarianism might sum the million delays to outweigh the death. Contractualism must say the single individual could "reasonably reject" a principle that sacrifices their life for others' convenience, regardless of how many others benefit. The strength of the complaint matters more than the headcount of complainants.

  **3. The Individualist Restriction (Separateness of Persons)**
  *   **Requirement:** Complaints must be grounded in what happens to the individual making the complaint, not in the aggregate state of the group to which they belong. One cannot justify harming Person A by pointing to the benefits distributed among Persons B, C, D, and E *unless* Person A has a specific reason to accept that burden.
  *   **Motivating Case:** *The Transplant.* You cannot kill one healthy person to harvest organs for five dying patients, even if the net lives saved is +4. The healthy person's complaint is "I am being used as a means." The view must preserve the boundary between persons; society is not a single container of value where losses in one corner are cancelled by gains in another.

  **4. Ex Ante Probability Sensitivity**
  *   **Requirement:** The view must account for the moral significance of risk distribution before outcomes are known, not just the final body count.
  *   **Motivating Case:** *The Vaccine Lottery.* In a pandemic, you have enough vaccine for 50% of the population. Do you give it to the 50% most likely to survive (maximizing expected lives saved) or lottery it equally? A purely *ex post* view looks only at who died. A contractualist view must consider whether the *principle* of allocation was acceptable to each person *before* they knew their status. Everyone must be able to accept the risk distribution as fair, even if they end up unlucky.

  **5. Theoretical Non-Collapse**
  *   **Requirement:** The derivation of the "save the greater number" conclusion must not rely on implicit sum-ranking. The logic must remain distinct from maximizing the good.
  *   **Motivating Case:** *The Justificatory Mechanism.* If the only reason we save the five is that "5 > 1," we are doing math, not moral justification. The theory must explain the choice through the *structure of reasonable rejection* (e.g., the one person has no grounds to reject a principle that favors the five in this specific context), not by secretly summing the five complaints into one mega-complaint. If it collapses into consequentialism, it loses its explanatory power regarding rights and duties.

  ***

  ### Critical Analysis: The Tensions and Trade-offs

  As a specialist in this field, I must be candid about where these desiderata clash. Here is the diagnostic breakdown for your piece.

  **1. Which desiderata cannot be jointly satisfied?**
  There is a profound tension between **The Greater Number Constraint (1)** and **The Individualist Restriction (3)**, mediated by **Theoretical Non-Collapse (5)**.
  If you hold strictly to the Individualist Restriction (complaints are only valid one-to-one), it is difficult to see why the single person in the Burning Building should concede to the five. Their complaint (death) is identical to each of the five. To save the five, you seem forced to aggregate their complaints (violating 3) or smuggle in consequentialist math (violating 5). Most "solutions" (like Scanlon's later "balancing" view or Kumar's "grouping" view) involve softening the Individualist Restriction, which opens the door to the Severity Threshold problem (2).

  **2. Which single requirement eliminates the most live contenders?**
  **The Individualist Restriction (3).**
  This is the hardest constraint. Many theories save the greater number easily by simply counting complaints (Utilitarianism) or by grouping people (Aggregative Contractualism). But strict contractualism demands that justification be *person-relative*. Any theory that allows the five to "merge" their complaints into a single weightier complaint is immediately eliminated by this requirement. It is the filter that keeps contractualism distinct from utilitarianism, but it is also the filter that makes the numbers problem nearly unsolvable.

  **3. Genuine Requirements vs. Inherited Prejudices**
  *   **Genuine Requirement:** **The Severity Threshold (2)** and **The Individualist Restriction (3).** These are the moral core. They protect the vulnerable from the tyranny of the majority. If a theory sacrifices these, it ceases to be a theory about *rights* and becomes a theory about *efficiency*.
  *   **Inherited Prejudice:** **Theoretical Non-Collapse (5).** I suspect this is partly disciplinary turf protection. Philosophers want contractualism to be *different* from consequentialism. However, from the perspective of a hospital administrator or a public health official (your actual subjects), it may not matter *why* the rule says "save the five," only that it does. Insisting that the *logic* must look non-consequentialist, even if the *outcome* is identical, is a philosophical vanity. It is possible that the "correct" moral view looks like consequentialism in hard triage cases, and contractualists are twisting themselves into knots to avoid admitting it.
  *   **Nuanced Prejudice:** **The Greater Number Constraint (1).** We treat "save the five" as an immutable intuition. But some contractualists (like Michael Otsuka) argue that in strict one-to-one justification, a lottery might actually be *more* faithful to the equal respect owed to each person. Insisting that we *must* save the five might be a utilitarian intuition we haven't exorcised from our contractualist framework.

  **Summary for your piece:** The "aggregation problem" is not just a puzzle about numbers; it is a conflict between the demand for efficiency (save the most) and the demand for justification (explain it to the one who dies). Contractualism tries to have both, but the math of morality resists.
