answer: |-
  **Project Title:** The Architecture of Analogy: Reframing Historical Precedent in AI Governance

  **Research Question**
  How do historical analogies function in AI governance discourse, and can we develop a typology that treats them not as competing empirical predictions but as distinct conceptual frameworks highlighting specific axes of transformation?

  **The Problem**
  Current discourse treats analogies—nuclear weapons, the printing press, the Industrial Revolution—as rival empirical bets on what AI will be like. This is a category error. These analogies are not answers to the same question. Nuclear weapons foreground sudden destructive capability; the printing press foregrounds information reproduction and gatekeeping; the Industrial Revolution foregrounds the reorganization of labor and production. Which analogy one reaches for encodes a prior view about which axis of transformation matters. By treating them as competing predictions, policymakers obscure their own normative commitments and rely on single historical cases selected after the fact, without counterfactuals, to license expectations about future technology. This leaves the fundamental question of *how* to reason from history open, leading to regulatory frameworks that may solve for the wrong risks.

  **Methodology**
  This project employs philosophical analysis of analogical reasoning rather than accumulating new historical detail. We will not dig deeper into the history of nuclear proliferation or printing; instead, we will analyze the logical structure of analogical arguments currently used in governance literature. The work involves isolating the premises required to make each analogy hold, mapping the specific dimensions of social change each highlights, and evaluating the validity of inferring future trajectories from single historical cases. The goal is to move from asking "Which analogy is correct?" to "What work is this analogy doing?"

  **Timeline (6 Months)**
  *   **Months 1–2:** Catalogue and map prominent analogies in recent governance literature, policy statements, and technical forecasts to identify recurring logical structures.
  *   **Months 3–4:** Construct a typology of analogical functions (e.g., risk-framing vs. structure-framing) and identify the normative commitments each requires.
  *   **Month 5:** Stress-test the typology against live policy debates (e.g., compute governance, copyright liability) to ensure practical relevance.
  *   **Month 6:** Draft final report and practitioner deliverable.

  **Deliverable**
  A practical "Field Guide to Historical Analogy" for policymakers and foundation program officers. This will not be an academic paper, but a heuristic tool helping officials identify which axis of transformation they are prioritizing when they invoke history. It will provide checklists to prevent category errors in regulatory design, ensuring that the chosen historical precedent matches the specific policy intervention being considered.

  **Failure Conditions**
  Success requires producing a usable framework. The project fails if the analysis remains too abstract to inform decision-making or if it concludes that historical analogy is fundamentally illegitimate for AI governance without offering a viable alternative heuristic. Additionally, if the resulting typology merely restates existing intuitions without sharpening decision criteria or revealing hidden normative commitments, it will not justify the investment. We must demonstrate that using analogies differently leads to different, better governance questions.
