prompt: |-
  Over on Reddit someone was arguing about whether a lobster (or a laptop) can suffer and someone else shut the whole thing down with "consciousness is an illusion — its just a user illusion, like the desktop your computer shows you." i know folks in the Dennett/Frankish illusionism ballpark say stuff like that, but the line seems to hide a bunch of different claims. Lay them out for me as a menu: (a) phenomenal experience doesn't exist at all, (b) it exists but introspection is systematically wrong about its unity, richness, and transparency, (c) it's a useful fiction with nobody actually looking at the screen, (d) "qualia" is a bad theoretical category, (e) there's no hard problem because the thing that seemed to need explaining was never really there. For each, say whether it's a platitude, a defensible but substantive claim, or probably false, and then tell me which reading the "so the lobster isn't really suffering" move actually needs and which ones would massively overreach.
