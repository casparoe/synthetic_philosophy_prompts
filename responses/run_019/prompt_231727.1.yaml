prompt: |-
  I've been asked to sketch a two-year research agenda for a university public-policy center, and the hook is a mid-sized country thats currently loan-heavy and considering a move toward something like the German or Nordic tuition-free model. We keep going in circles on headline numbers — student debt in the US, graduate earnings premia in Denmark, whats spent per student in the UK — while the actual policy choice seems to hinge on stuff that is genuinely under-settled. If you had three or four studies to run in those two years, which open questions in the comparison between tuition-free systems (Germany and the Nordics) and loan-financed ones (the US and the UK) would you pick, and in what order? Give me a defended ordering, not a survey: state the criteria you're weighing (tractability with existing cross-country data, neglectedness, how many downstream design choices hinge on the answer), say how you'd trade them off, and tell me what would make you reshuffle the ranking. Also flag at least one question that looks important but you wouldnt fund because it would take too long or wouldnt change the actual decision. I especially want to know which questions are upstream of the others — for instance, is the risk-sharing property of income-contingent loans the crux, or does the enrollment and completion response to prices dominate, or is it something I'm not listing?
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Deconstruct the Request:**
      *   **Context:** University public-policy center.
      *   **Task:** Sketch a two-year research agenda (3-4 studies).
      *   **Subject:** Transition from a loan-heavy system (like US/UK) to a tuition-free model (like Germany/Nordics) in a mid-sized country.
      *   **Constraint:** Avoid "headline numbers" (debt levels, earnings premia, spend per student). Focus on "under-settled" policy choices.
      *   **Requirements:**
          *   Defended ordering (not just a list).
          *   State criteria (tractability, neglectedness, downstream impact).
          *   Explain trade-offs.
          *   Identify trigger for reshuffling.
          *   Flag one "do not fund" question (important but too slow/irrelevant).
          *   Identify upstream vs. downstream questions (risk-sharing vs. enrollment vs. other).

  2.  **Analyze the Policy Problem:**
      *   *Current State:* Loan-heavy (High tuition, high debt).
      *   *Proposed State:* Tuition-free (Low/No tuition, tax-funded).
      *   *The Trap:* Comparing aggregate stats (US debt vs. Danish taxes) is useless because institutional contexts differ wildly (labor markets, welfare states, culture).
      *   *The Real Levers:* Who gets in? Who finishes? What do they study? How does funding affect institutional behavior? What is the fiscal sustainability?
      *   *The "Mid-Sized Country" Constraint:* Likely lacks the massive administrative data of Scandinavia or the longitudinal depth of the US. Needs tractable methods.

  3.  **Determine Criteria for Selection:**
      *   **Upstream/Foundational:** Does the answer determine if the other studies matter? (e.g., if enrollment doesn't change, fiscal cost is stable; if it explodes, budget breaks).
      *   **Tractability (2-Year Horizon):** Can we get results using existing cross-country data or quick quasi-experiments? No 20-year longitudinal studies.
      *   **Decision-Relevance (Downstream Impact):** Does this inform the *design* of the transition (e.g., means-testing, caps, parallel systems)?
      *   **Neglectedness:** Everyone knows debt is bad for mental health. Everyone knows degrees pay off. What don't we know? *Behavioral responses of institutions* and *heterogeneous enrollment effects* are often overlooked.

  4.  **Drafting the Studies (Iterative Process):**

      *   *Idea 1: Long-term earnings.* (Reject: Too long, too many confounders, headline number trap).
      *   *Idea 2: Fiscal cost.* (Important, but depends on enrollment. Downstream of enrollment).
      *   *Idea 3: Enrollment/Completion elasticity.* (Crucial. If free tuition just subsidizes the rich who would have gone anyway, it's regressive. If it boosts low-SES completion, it's transformative).
      *   *Idea 4: Institutional Quality/Behavior.* (If funding shifts from tuition to state grants, do universities cut quality? Do they change admissions? This is often ignored).
      *   *Idea 5: Risk Sharing/Insurance.* (The prompt asks about this. Is it the crux? In a loan system, risk is on the student. In tax, it's on the state. But if loans are income-contingent (ICL), the difference narrows. This is a key design choice).

      *   *Selection:*
          1.  **Heterogeneous Enrollment & Completion Elasticities** (The Demand Side).
          2.  **Institutional Response to Funding Shocks** (The Supply Side).
          3.  **Risk-Sharing & Labor Market Frictions** (The Finance/Insurance Side).

  5.  **Ordering and Defense:**

      *   *Priority 1: Enrollment/Completion.* Why? Because fiscal sustainability hinges on volume. If free tuition causes a surge that lowers quality or breaks the budget, the policy fails immediately. It's the most "upstream."
      *   *Priority 2: Institutional Quality.* Why? Because if volume goes up but quality goes down (dilution), the degree value drops. This informs *how* to fund (block grants vs. per-student).
      *   *Priority 3: Risk-Sharing/Loans.* Why? This is about the *transition* mechanism. Do we keep ICLs as a safety net for living costs? This is design-specific, secondary to the main tuition question.

  6.  **Addressing Specific Prompt Requirements:**

      *   *Criteria:* Explicitly state Tractability, Upstreamness, Decision-Relevance.
      *   *Trade-offs:* Acknowledge that fiscal modeling is easier but less insightful than behavioral modeling.
      *   *Reshuffling:* What if the country has a specific demographic cliff? What if the banking sector is unstable?
      *   *The "Do Not Fund":* Long-term intergenerational mobility. Too slow. Or "Mental health impacts of debt" (important, but won't stop the policy if the economics don't work). Let's go with *Long-term Intergenerational Mobility*—it's the holy grail but takes 30 years to measure properly.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* The prompt asks about the comparison between Tuition-Free vs. Loan-Financed. I need to make sure I'm not just studying "Free Tuition." I need to study the *margin* between them.
      *   *Nuance on Risk:* The prompt asks if risk-sharing is the crux. I should argue that *enrollment* is the crux for fiscal/political sustainability, while *risk-sharing* is the crux for equity. But for a *transition* agenda, fiscal sustainability (enrollment) comes first.
      *   *Mid-sized country context:* They probably don't have perfect data. I need to suggest methods that use variation (e.g., policy changes in comparable regions) rather than needing perfect domestic longitudinal data.

  8.  **Finalizing the Structure:**
      *   **Introduction:** Set the criteria.
      *   **The "Do Not Fund":** Get this out of the way to show discipline.
      *   **Study 1 (Upstream):** Enrollment/Selection.
      *   **Study 2 (Supply Side):** Institutional Quality/Resource Allocation.
      *   **Study 3 (Design/Transition):** Risk-Sharing/Living Costs.
      *   **Ordering Defense:** Why 1 -> 2 -> 3.
      *   **Reshuffling Triggers:** What changes the plan?

  9.  **Drafting the Content (incorporating "Policy Center" tone):**
      *   Tone: Analytical, decisive, pragmatic.
      *   Focus: Avoid academic waffle. Focus on "decision hinges on this."
      *   Key Insight: The biggest risk in moving to free tuition isn't the cost of tuition itself; it's the *induced demand* and the *supply response*.

  10. **Review against constraints:**
      *   3-4 studies? Yes (3 core + 1 excluded).
      *   Defended ordering? Yes.
      *   Criteria stated? Yes.
      *   Upstream/Downstream identified? Yes.
      *   Reshuffling conditions? Yes.
      *   Mid-sized country context? Yes (emphasized data limitations).

  *(Self-Correction during drafting)*: Make sure I explicitly answer the "risk-sharing vs. enrollment" question in the prompt. I will argue enrollment is more upstream for *feasibility*, risk-sharing is upstream for *equity*, but feasibility usually vetoes equity in policy transitions.

  11. **Final Polish:** Check clarity and ensure the "hook" (mid-sized country transition) remains central. (Proceed to generate output).

  *(Wait, one more check)*: The prompt asks for "three or four studies." I have 3 funded, 1 unfunded. I should ensure the 3 funded are distinct enough.
  1. Demand Side (Who goes?)
  2. Supply Side (What do they get?)
  3. Financial Architecture (How is it paid/risk managed?)
  This covers the ecosystem.

  Let's refine the "Do Not Fund." "Long-term earnings premia" is too obvious. "Intergenerational mobility" is better because it's the *justification* for the policy but impossible to measure in 2 years. I'll stick with that.

  Let's refine the "Upstream" argument. The prompt asks: "is the risk-sharing property... the crux, or does the enrollment... dominate?" I need to take a stance. My stance: Enrollment dominates feasibility; risk-sharing dominates distribution. For a *transition* agenda, feasibility is the gatekeeper. So Enrollment is Study 1.

