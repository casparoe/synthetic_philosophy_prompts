answer: |-
  Here is a two-year research agenda designed for a mid-sized country considering a transition from a loan-heavy model to a tuition-free model.

  ### The Selection Criteria

  To avoid the "headline number" trap, I weighed potential studies against three criteria:

  1.  **Upstreamness (Causality):** Does this answer determine the parameters of the other studies? If we don't know *how many* students will enroll, we cannot calculate fiscal cost or institutional strain.
  2.  **Decision-Relevance (Design Levers):** Does the finding directly inform a specific policy knob (e.g., means-testing, cap on funded seats, retention of income-contingent loans for living costs)?
  3.  **Tractability (24-Month Horizon):** Can we produce credible identification using existing cross-country variation or quasi-experimental domestic data, without waiting for a new cohort to graduate?

  **The Trade-off:** I am prioritizing *behavioral margins* over *accounting exercises*. A fiscal cost model is easy to build but garbage if the enrollment inputs are wrong. I am trading precision in long-term outcomes (earnings) for precision in immediate transition risks (enrollment surges, quality dilution).

  ---

  ### The "Do Not Fund" Question

  **Question:** *Does eliminating tuition improve long-term intergenerational mobility?*

  **Reason for Exclusion:** This is the moral justification for the policy, but it is empirically intractable for a two-year agenda. Measuring mobility requires tracking cohorts over 20+ years to see if children of low-income parents reach higher income percentiles.
  **Why it won't change the decision:** Policymakers are rarely stopped by a lack of long-term mobility evidence; they are stopped by short-term budget blows and university lobbying. Furthermore, mobility is driven as much by primary/secondary education quality and labor market structure as by university tuition. Funding this would consume resources without yielding a actionable design constraint for the transition.

  ---

  ### The Research Agenda (Ordered)

  #### Study 1: Heterogeneous Enrollment and Completion Elasticities
  **The Question:** When price drops to zero, *who* enters the system, and do they finish? Specifically, does free tuition induce marginal students (who are at high risk of dropping out) to enroll, or does it primarily subsidize students who would have attended anyway?

  **Methodology:** Use a difference-in-differences approach leveraging policy shocks in comparable mid-sized European or Latin American countries that recently shifted fee regimes. Pair this with domestic administrative data on applicant "near-misses" (students just below admission cutoffs) to model price sensitivity by socioeconomic status.

  **Why First (Upstreamness):** This is the primary feasibility constraint.
  *   **Fiscal:** If enrollment surges by 30% because the price is zero, the tax cost doubles, potentially breaking the budget.
  *   **Equity:** If the surge is mostly high-SES students (who are more price-insensitive but capture the benefit), the policy is regressive.
  *   **Downstream:** You cannot design the funding formula (Study 2) or the loan safety net (Study 3) without knowing the volume and composition of the student body.

  **Decision Lever:** Informs whether to implement means-testing, regional caps, or numerus clausus (entry limits) to manage demand.

  #### Study 2: Institutional Supply Response to Funding Shocks
  **The Question:** How do universities alter quality and admissions behavior when revenue shifts from per-student tuition to block government grants?

  **Methodology:** Comparative case studies of German and Nordic universities during periods of fiscal tightening, contrasted with UK/Australian universities during tuition freeze periods. Focus on metrics like student-to-staff ratios, adjunct reliance, and admission selectivity changes.

  **Why Second (Supply-Side Constraint):**
  Once we know the *demand* (Study 1), we must know the *supply*. A common failure mode in tuition-free transitions is "quality dilution." If the state reimburses universities at a rate lower than previous tuition + loan revenue, institutions may lower standards to process volume or cut support services, leading to lower completion rates (negating Study 1's benefits).

  **Decision Lever:** Informs the *funding mechanism*. Should the state fund universities via block grants (stable but rigid) or per-student subsidies (responsive but incentivizes grade inflation)? This study tells us which model preserves quality in a mid-sized context.

  #### Study 3: Risk-Sharing Properties of Residual Income-Contingent Loans (ICL)
  **The Question:** In a tuition-free system, should the state retain Income-Contingent Loans to cover *living costs*, and how does this interact with labor market friction?

  **Methodology:** Structural modeling of consumption smoothing. Compare labor mobility and entrepreneurship rates among graduates in pure grant systems (Germany) vs. tuition-free + living cost loan systems (Nordics).

  **Why Third (Design Optimization):**
  This addresses the prompt's specific query on risk-sharing. However, it is downstream of Studies 1 and 2. If tuition is free, the "tuition debt" risk is gone. The remaining risk is *subsistence risk*.
  *   **The Crux:** Is the risk-sharing property of loans the main driver of outcomes? My hypothesis is **no**. The enrollment response (Study 1) dominates the risk-sharing benefit for the *average* student. However, for *non-traditional* students (older, parents), living cost risk is the barrier, not tuition.
  *   **Decision Lever:** Determines if the country keeps a loan book open. If the labor market is rigid (hard to fire/hire), ICLs matter less. If the labor market is dynamic, ICLs for living costs are essential to prevent free tuition from becoming a privilege for those with wealthy parents.

  ---

  ### Defense of the Ordering

  **1. Enrollment (Demand) $\rightarrow$ 2. Quality (Supply) $\rightarrow$ 3. Finance (Risk)**

  This order follows the logical chain of production.
  1.  **Volume:** You must know how many customers are coming through the door (Study 1).
  2.  **Capacity:** You must know if the shop can serve them without ruining the product (Study 2).
  3.  **Payment Plan:** You must decide how to handle the pocket money once the main bill is settled (Study 3).

  If you run Study 3 first (Risk Sharing), you are optimizing a financial instrument for a system that might collapse under enrollment pressure or quality dilution. If you run Study 2 before Study 1, you are modeling institutional capacity without knowing the load.

  **The "Crux" Verdict:**
  You asked if risk-sharing or enrollment dominates. **Enrollment dominates.**
  Risk-sharing is a distributional concern; enrollment is a systemic stability concern. A tuition-free system with perfect risk-sharing that collapses under a 40% enrollment surge is a failed policy. A system with poor risk-sharing that successfully educates 20% more low-SES students is a flawed but functioning policy. Therefore, Study 1 is the gatekeeper.

  ### Triggers for Reshuffling

  I would reprioritize this agenda under two conditions:

  1.  **Demographic Cliff:** If the mid-sized country has a rapidly shrinking youth population (e.g., South Korea, parts of Eastern Europe), Study 1 (Enrollment Surge) becomes irrelevant. The risk is *under*-enrollment. I would swap Study 1 and Study 3, focusing immediately on how to use financial incentives (loans/grants) to *induce* participation rather than cap it.
  2.  **Fiscal Crisis:** If the country is currently undergoing sovereign debt restructuring, Study 2 (Institutional Funding) moves to #1. The constraint is not student behavior, but the state's ability to write block grants. We would need to know immediately if universities can survive a transition period where tuition is abolished before tax funding is fully ramped up.

  ### Summary of the "Hook"

  This agenda moves the debate from **"Can we afford to make it free?"** (an accounting question) to **"What happens to the system dynamics when the price signal is removed?"** (a behavioral question). It acknowledges that in a mid-sized country, the biggest risk isn't the cost of the tuition itself, but the unintended consequences on university quality and student selection that follow the price change.
