      *   *Different questions?* This seems strongest. Popper asks about *prediction/control* (scientific method). Historicists ask about *intelligibility/meaning* (hermeneutics/structure).
      *   *Structural Impasse?* Likely. They operate within different paradigms of what social science is for.

