  Popper asks: "Can we scientifically predict historical outcomes?" His definition of "law" is tied to the deductive-nomological model. For Popper, a law must support unconditional predictions independent of initial conditions. Since history is a unique sequence influenced by the growth of knowledge (which is unpredictable), he argues systems are "open." Trends exist, but they depend on specific initial conditions and can reverse. To call a trend a "law" is, for Popper, a category error that invites dogmatism. He insists that because human knowledge influences history, and knowledge growth is unpredictable, long-term prediction is impossible.

  Historicists ask: "Can we make large-scale historical change intelligible?" Their definition of "law" refers to developmental logic or structural necessity. When Marxists speak of laws of motion, they refer to invariant sequences of stages driven by internal contradictions. They concede they cannot predict specific events like physics, but argue this does not negate the existence of structural regularities. For them, "law" denotes a pattern of transformation that renders history comprehensible, not necessarily controllable. They view social systems as having internal teleologies or structural constraints that limit openness.

