answer: |-
  # Specification for a Regulatory Fairness Criterion: Statistical Risk Scores

  ## Preamble
  This document specifies the desiderata for a formal fairness criterion intended for regulatory audit of statistical risk scores (e.g., pretrial risk assessment, credit scoring, medical triage). The goal is not to declare a single metric as "true," but to define the constraints any candidate metric must satisfy to be legally and ethically deployable under oversight. The specification acknowledges the mathematical constraints of prediction and the moral asymmetry of decision costs.

  ## Part I: Desiderata List
  The following five requirements constitute the necessary conditions for a fairness criterion to be accepted as a regulatory standard.

  ### 1. Asymmetric Error Weighting
  *   **Intuition/Case:** In pretrial detention, a False Positive (detaining a defendant who would not reoffend) is a deprivation of liberty; a False Negative (releasing a defendant who does reoffend) is a public safety risk. These harms are not morally equivalent. A criterion that treats them symmetrically fails to capture the stakes.
  *   **Binding vs. Dogma:** **Genuinely Binding.** Regulatory mandates (e.g., Equal Protection) typically focus on specific harms (e.g., wrongful detention) rather than abstract statistical symmetry.
  *   **Exclusionary Power:** High. This excludes metrics that treat all errors equally (e.g., simple accuracy parity) or those that require symmetry between classes.

  ### 2. Counterfactual Observability (The Ground Truth Constraint)
  *   **Intuition/Case:** To measure fairness, one must know the outcome for both those who received the intervention and those who did not. In lending, we observe default only for those who got loans (censored data). In pretrial, we observe recidivism only for those released. A criterion requiring unobserved counterfactuals is impossible to audit without strong, untestable modeling assumptions.
  *   **Binding vs. Dogma:** **Genuinely Binding.** An auditor cannot verify a claim that relies on unobservable data.
  *   **Exclusionary Power:** **Maximum.** This requirement excludes the majority of existing deployments. Most risk scores operate in "one-sided feedback" loops. A criterion demanding this forces the adoption of randomized control trials or specific instrumental variable designs, which are rarely present in production systems.

  ### 3. Group Stability and Legal Defensibility
  *   **Intuition/Case:** Fairness metrics require partitioning the population into groups (e.g., race, gender). If group definitions are fluid, post-hoc, or based on sensitive proxies that shift over time, the audit cannot be replicated. The *COMPAS* dispute highlighted how racial categorization affects disparity measurements.
  *   **Binding vs. Dogma:** **Genuinely Binding.** Legal liability requires stable classes (e.g., protected classes under Title VII or the Equal Protection Clause).
  *   **Exclusionary Power:** Moderate. Excludes metrics relying on clustering or latent class discovery for fairness definitions.

  ### 4. Monotonicity of Risk
  *   **Intuition/Case:** If a score increases, the estimated probability of the outcome should not decrease. If a higher risk score leads to a lower probability of detention (due to complex thresholding), the system is unintelligible to the subject.
  *   **Binding vs. Dogma:** **Dogma (of the "Explainability" camp).** While desirable for transparency, non-monotonic rules can sometimes optimize utility without violating fairness. However, for a *regulatory* standard, intelligibility is a proxy for due process.
  *   **Exclusionary Power:** Low. Most modern scoring systems are monotonic by design.

  ### 5. Base-Rate Explicitness
  *   **Intuition/Case:** Impossibility results show fairness depends on the prevalence of the outcome in each group. A criterion that hides base rates (e.g., by claiming "the algorithm doesn't see race") obscures the source of disparity. The regulator must know if disparity stems from the model or the underlying population statistics.
  *   **Binding vs. Dogma:** **Genuinely Binding.** Without this, the impossibility theorem cannot be navigated.
  *   **Exclusionary Power:** Moderate. Excludes "blind" fairness claims that assert fairness solely based on feature exclusion.

  ---

  ## Part II: Resolution of Impossibility Results
  **The Constraint:** Absent perfect prediction or equal base rates across groups, a score cannot satisfy Calibration (within groups), False Positive Rate Balance, and False Negative Rate Balance simultaneously (Chouldechova, 2017; Kleinberg et al., 2016).

  **The Sacrifice:** A regulatory standard **must sacrifice Calibration** in favor of **Error Rate Balance (specifically False Positive Rate)** when base rates differ.

  **The Principle:** **Disparate Harm Prevention.**
  *   *Reasoning:* Calibration ensures that a score of $X$ means the same thing for everyone. However, if Group A has a higher base rate of the negative outcome (due to historical or systemic factors), a calibrated model will assign higher scores to Group A on average. If a threshold is applied uniformly, Group A suffers a higher False Positive Rate.
  *   *Regulatory Mandate:* In rights-sensitive contexts (liberty, credit), the state's interest is preventing the *wrongful* imposition of harm (False Positive). Therefore, the criterion must prioritize equalizing the rate of wrongful harm across groups, even if this means a score of $X$ implies a different underlying probability for Group A than for Group B.
  *   *Implication:* This acknowledges that the impossibility theorem proves **every deployable criterion chooses whom to wrong.** By prioritizing FPR balance, we accept that the *meaning* of the risk score becomes group-dependent to preserve the *distribution* of error.

  ---

  ## Part III: Assessment of Smuggled Requirements

  ### 1. "Fairness is a property of the score itself rather than of the process that produced it."
  *   **Assessment:** **Dogma.**
  *   **Analysis:** This distinction is analytically useful but operationally insufficient. A score can be mathematically fair (satisfying Equalized Odds) but derived from data collected via predatory practices or features that encode historical injustice (e.g., zip code as a proxy for redlining).
  *   **Regulatory Stance:** The criterion must evaluate the score's *output distribution*, but the audit standard must include **Provenance Disclosure**. Fairness is a property of the *sociotechnical system*, not just the function $f(x)$. However, for the specific *mathematical criterion*, we must focus on the score because the process is often proprietary or opaque. The criterion audits the *effect*, not the *intent*, but cannot ignore the *cause* if the effect is disparate.

  ### 2. "An adequate criterion must be invariant under relabeling the outcome."
  *   **Assessment:** **Dogma (and Dangerous).**
  *   **Analysis:** This requires that a fairness metric yield the same verdict whether we predict "Recidivism" (Positive = 1) or "Success" (Positive = 0).
  *   **Regulatory Stance:** **Reject.** Moral costs are not symmetric. In pretrial, False Positives (detention) are the primary civil rights concern. In medical triage, False Negatives (missed diagnosis) may be the primary concern. A criterion that is label-invariant ignores the normative weight of the classes. Fairness is inherently teleological; it depends on what we are trying to prevent.

  ---

  ## Part IV: Brief Scoring of Existing Contenders
  *Subordinate to the criteria above.*

  | Contender | Satisfies Asymmetric Error? | Satisfies Observability? | Handles Impossibility? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Demographic Parity** | No (ignores base rates) | Yes | Yes (by ignoring prediction) | **Fail.** Violates utility and ignores ground truth. |
  | **Calibration** | No (allows disparate FPR) | Yes | Yes (sacrifices Error Balance) | **Fail.** Permits disparate harm if base rates differ. |
  | **Equalized Odds** | Yes (can weight errors) | **No** (needs counterfactuals) | **No** (requires sacrifice of Calibration) | **Conditional Pass.** Only if counterfactuals are estimated via approved methods. |

  ---

  ## Part V: Confidence and Uncertainty

  **Confidence in Framework:** **High (85%).**
  The structure of prioritizing observable harm (Error Rates) over semantic consistency (Calibration) aligns with existing civil rights auditing frameworks (e.g., EEOC guidelines on adverse impact). The rejection of label invariance is robustly supported by decision theory.

  **Point of Least Certainty:** **The Resolution of the Impossibility Theorem.**
  I am least certain about the principle of sacrificing **Calibration** for **Error Rate Balance**.
  *   *Reason for Uncertainty:* While Error Rate Balance protects groups from disparate *rates* of harm, sacrificing Calibration undermines *individual* fairness. If a score of 0.8 means 80% risk for Group A but 60% risk for Group B (to equalize FPR), individuals in Group B are being judged by a different standard. This may violate the principle of "treatment as an individual." A regulator might eventually decide that **Calibration** is the binding constraint for individual rights, forcing the acceptance of disparate False Positive rates as an unavoidable consequence of disparate base rates. This framework assumes group harm is the priority; if individual due process is the priority, the sacrifice must be reversed.
