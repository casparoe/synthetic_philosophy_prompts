      *   *Crux 4:* The nature of the "Thing". Is *res* implied in *cogito*? (Sub: Yes. Def: No, *res* comes later).
      *   *Refinement:* Let's ensure they are precise Yes/No questions.
      *   *Row 1:* Does the *cogito* entail the existence of a *substratum* of thought?
      *   *Row 2:* Is the "I" in "I think" referentially robust (picking out an entity) or merely grammatical?
      *   *Row 3:* Does the certainty survive the cessation of thought (e.g., sleep)?
      *   *Row 4:* Is the proposition "I am a thinking thing" analytically contained in "I think" or synthetically derived? (Maybe too technical). Let's go with: Does the *cogito* establish the *nature* of the self or merely its *existence*?

  5.  **Drafting Section 3: Diagnostic Tests:**
