          *   *Deflationary:* *Cogito* certifies only that thinking is occurring. "I" is grammatical or indexical surface. No continuing substance or owner established *by the cogito alone*.
      *   **Target Claims:** (1) Existence claim (necessarily true when conceived), (2) Further claim (I am a thing that thinks).
