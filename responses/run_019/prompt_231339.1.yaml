          1.  Agreed Claims (numbered list, substantive concessions).
          2.  Disagreements Table (4-6 rows, Yes/No crux, specific answers).
          3.  Diagnostic Tests and Predictions (Impersonalisation, Interruption, Ownership).
          4.  What Would Change Our Minds (Candid vulnerabilities).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Substantivalist:* Needs to defend that Descartes isn't just saying "thinking happens" but " *I* exist." The "I" refers to an entity. This entity persists at least long enough to be the subject of the next meditation.
      *   *Deflationary:* Needs to defend that the *cogito* itself (Meditation II) doesn't prove substance. It proves existence, but the *nature* of that existence is thin. The "I" might just be the thought's self-reference. Lichtenberg's "It thinks" critique is relevant here.
      *   *Common Ground:* Both agree the *cogito* provides indubitable certainty against the Evil Demon *at the moment of utterance/conception*. Both agree Descartes *believes* he is a substance, but they disagree on whether the *cogito* argument *alone* secures that.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need concessions.
