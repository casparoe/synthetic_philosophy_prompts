answer: |-
  ### Brainstorming Candidate Criteria

  Before we formalize the requirements, we must sift through the intuitive notions you likely already possess. In historical epistemology, we are not asking "Did this happen?" (ontology) but "What warrants the claim that this happened?" (epistemology).

  *   **Candidate 1: The Existence Criterion.** If a place or person existed, the story is history. *Problem:* This validates the *Iliad* just because Hisarlik exists, ignoring that the poem might be entirely fictionalized despite the setting.
  *   **Candidate 2: The Contemporaneity Criterion.** There must be documents written at the time of the event. *Problem:* This excludes almost all ancient history and privileges literate bureaucracies over oral cultures (bad for Arthur/Exodus).
  *   **Candidate 3: The Coherence Criterion.** The story must make internal sense and fit human psychology. *Problem:* Myths are often psychologically coherent but factually false.
  *   **Candidate 4: The Silence Criterion.** If archaeology doesn't find it, it didn't happen. *Problem:* Absence of evidence is not evidence of absence, especially for nomadic groups (Exodus).
  *   **Candidate 5: The Independence Criterion.** The evidence used to verify the story must not rely on the story itself. *Problem:* This is hard to achieve in practice (e.g., using Homer to locate Troy, then using Troy to prove Homer).
  *   **Candidate 6: The Transmission Criterion.** We must know how the story was passed down. *Problem:* We rarely know this with certainty for sagas.

  From this brainstorming, we can distill the rigorous standards an adequate theory must meet.

  ***

  ### Standards of Adequacy for the Legend-to-History Threshold

  Here are the five requirements any robust epistemological theory must satisfy to distinguish legend from history.

  **1. The Requirement of Epistemic Separation**
  *   **Specification:** The theory must distinguish between the *ontological reality* of an event (that it occurred) and the *epistemic warrant* for believing the narrative account of that event. Proving a city burned is not the same as proving a specific king caused it for a specific reason described in a poem.
  *   **Motivating Case:** **Troy.** The existence of a burned Bronze Age layer (ontology) is often conflated with the historical accuracy of the *Iliad*'s narrative (epistemology). An adequate theory must prevent the slide from "The city existed" to "The war happened as described."
  *   **Status:** **Non-negotiable.** Without this, history collapses into geography or geology.

  **2. The Requirement of Non-Circular Corroboration**
  *   **Specification:** Evidence used to validate a tradition cannot be identified or interpreted solely through the lens of that same tradition. The evidential loop must be broken.
  *   **Motivating Case:** **Troy & Exodus.** If we identify a ruin as "Troy" only because Homer says Troy was there, we cannot then use that ruin to prove Homer was right. Similarly, if we date the Exodus solely by biblical chronology to find matching archaeological layers, we have not independently verified the event.
  *   **Status:** **Non-negotiable.** This is the fundamental logic of evidence. Violating this is a logical fallacy (begging the question).

  **3. The Requirement of Transmission Transparency**
  *   **Specification:** The theory must account for the medium and duration of transmission between the alleged event and the fixed written record. It must specify a mechanism for how information survives (or transforms) across that gap.
  *   **Motivating Case:** **Arthur.** The gap between a 5th-century warlord and a 12th-century romance is centuries of oral and literary mutation. A theory that treats the 12th-century text as a direct window to the 5th century fails this requirement.
  *   **Status:** **Camp Preference.** *Positivists* demand a near-contemporary written record (excluding Arthur). *Oral Historians* accept stable oral transmission mechanisms over centuries (including Arthur). An adequate theory must *address* this, but the threshold for "acceptable transmission" is debated.

  **4. The Requirement of Negative Evidence Integration**
  *   **Specification:** The theory must explicitly state how it handles the *absence* of expected evidence. It must define under what conditions silence counts as falsification versus under what conditions it counts as inconclusive.
  *   **Motivating Case:** **Exodus.** A narrative describes a mass migration. The archaeological record shows no trace of a large population in the Sinai during the relevant period. An adequate theory cannot simply ignore this silence; it must argue why the silence is expected (e.g., nomadic material culture leaves no trace) or accept it as falsification.
  *   **Status:** **Non-negotiable.** A theory that treats confirming evidence as valid but ignoring disconfirming evidence is not epistemologically sound; it is apologetics.

  **5. The Requirement of Genre Sensitivity**
  *   **Specification:** The theory must analyze the *function* of the text. It must determine whether the genre aims to record, to persuade, to liturgize, or to entertain, and weight the evidence accordingly.
  *   **Motivating Case:** **All Three.** The *Iliad* is epic poetry, Geoffrey of Monmouth is political propaganda, and Exodus is foundational theology. Treating any of these as modern-style chronicles is a category error.
  *   **Status:** **Non-negotiable.** Ignoring genre leads to naive literalism.

  ***

  ### Incompatible Pairs of Requirements

  You must be aware that satisfying all these requirements simultaneously often creates tension. Two pairs are particularly volatile:

  **Pair A: Transmission Transparency vs. The Survival of Deep History**
  *   **The Conflict:** If you enforce **Transmission Transparency** strictly (requiring short gaps between event and record), you exclude almost all ancient history, including the core of the Arthurian and Exodus traditions. If you relax it to allow for long oral transmission to save the **Survival of Deep History**, you weaken the **Non-Circular Corroboration** requirement, because oral traditions are often shaped by the very cultural needs that preserve them.
  *   **The Trade-off:** You must choose between a narrow definition of history (high certainty, low coverage) or a broad definition (high coverage, low certainty).

  **Pair B: Negative Evidence Integration vs. Genre Sensitivity**
  *   **The Conflict:** **Negative Evidence Integration** suggests that if a story claims a massive army marched through a desert, we should find bones or pottery. **Genre Sensitivity** suggests the story might be theological hyperbole, not a military report. If you prioritize Genre Sensitivity, you can explain away Negative Evidence (it wasn't meant to be literal). If you prioritize Negative Evidence, you risk imposing modern literalism on ancient genres.
  *   **The Trade-off:** You must decide whether the "truth claim" of the text is empirical or existential/theological.

  ***

  ### The Workhorse Requirement

  The single requirement that does the most work in excluding popular naive positions is **The Requirement of Non-Circular Corroboration**.

  Here is why it is the decisive filter:

  1.  **It excludes the "Real Troy" Fallacy:** The view that "a real Troy simply makes the *Iliad* historical" fails because it uses the *Iliad* to identify the site, and the site to validate the *Iliad*. Non-Circular Corroboration demands that the site be identified by independent administrative records or stratigraphy *before* it can validate the narrative.
  2.  **It excludes the "Poetic Genre" Fallacy:** The view that "a poetic genre rules out any recoverable historical content" often relies on the assumption that because the *form* is embellished, the *referent* is nonexistent. However, strict adherence to Non-Circular Corroboration forces us to look for independent anchors (e.g., Hittite records mentioning "Wilusa") that exist regardless of the poem's genre. It prevents the genre from acting as a blanket dismissal without evidential review.

  By enforcing **Non-Circular Corroboration**, you force the discussion away from "Does this feel true?" or "Is this text old?" and toward "What independent warrant connects this claim to the world?" This is the bedrock of historical epistemology.
