      *   **Role:** Philosopher of history specializing in historical epistemology and logic of evidence.
      *   **User:** Undergraduate student in epistemology of historical knowledge.
      *   **Task:** Define standards of adequacy for a theory distinguishing "legend/saga/tradition" from "history."
      *   **Specific Cases (Context):** Trojan War, Arthurian Legend, Exodus (do *not* adjudicate these yet, just use them to motivate criteria).
      *   **Output Requirements:**
          1.  Brainstorm candidate criteria first.
          2.  Present a clean numbered list of requirements.
          3.  For each requirement: State the requirement, the motivating case/consideration, and its status (Non-negotiable vs. Camp Preference).
          4.  Flag incompatible pairs of requirements.
          5.  Identify the single "workhorse" requirement that excludes popular naive positions.
          6.  No reading lists or citations; focus on conceptual criteria.

  2.  **Deconstruct the Problem (Legend vs. History):**
      *   What makes something "history" in an epistemological sense? It's not just "it happened." It's "we can know it happened based on evidence."
      *   Legends often contain kernels of truth but are heavily mediated by oral tradition, myth-making, and ideological shaping.
      *   The core tension is between *ontological reality* (did it happen?) and *epistemological access* (can we verify it?).
      *   The three cases illustrate different gaps:
          *   Troy: Archaeology matches setting, but narrative details are poetic.
          *   Arthur: Gap in time is huge, sources are literary/political.
          *   Exodus: Cultural weight is high, material evidence is silent/negative regarding the scale described.

  3.  **Brainstorming Candidate Criteria:**
      *   *Correspondence:* Does the story match physical evidence?
      *   *Contemporaneity:* Are there sources from the time?
      *   *Independence:* Do multiple sources agree without copying each other?
      *   *Plausibility:* Does it fit what we know about human behavior/physics?
      *   *Continuity:* Is there an unbroken chain of transmission?
      *   *Specificity:* Are names, dates, and places specific or vague?
      *   *Function:* Is the story serving a political/religious purpose (which might bias it)?
      *   *Falsifiability:* Could we prove it wrong?
      *   *Core vs. Shell:* Can we separate the event from the embellishment?

  4.  **Developing the Requirements (Filtering & Refining):**
      *   *Requirement 1: Epistemic Access.* It's not enough that it happened; we need a warrant to believe it. (Motivation: All three cases). Status: Non-negotiable for epistemology.
      *   *Requirement 2: Independence of Evidence.* Archaeology shouldn't just be interpreted *through* the text; text shouldn't just be interpreted *through* archaeology. (Motivation: Troy - is the ruin *Troy* because Homer says so?). Status: Non-negotiable.
      *   *Requirement 3: Transmission Integrity.* How much did the story change before being written down? (Motivation: Arthur/Exodus). Status: Camp Preference (Oral historians vs. Textual skeptics).
      *   *Requirement 4: Negative Evidence Handling.* How does the theory handle silence? (Motivation: Exodus). Status: Non-negotiable (must address it, even if conclusions differ).
      *   *Requirement 5: Genre Sensitivity.* Does the theory acknowledge that epics aren't chronicles? (Motivation: Troy/Arthur). Status: Non-negotiable.

  5.  **Identifying Incompatible Pairs:**
      *   *Strict Contemporaneity* vs. *Oral Tradition Validity.* If you demand contemporary documents, oral cultures (Arthur/early Exodus) are automatically excluded. If you accept oral tradition, you relax the document requirement.
      *   *Archaeological Positivism* vs. *Narrative Coherence.* Relying solely on dirt vs. relying on the internal logic of the tradition.

  6.  **Identifying the "Workhorse" Requirement:**
      *   What kills the naive views ("Troy exists therefore Iliad is history" or "It's poetry therefore it's fake")?
      *   It's the distinction between *Event* and *Account*. Or, more precisely, the **Requirement of Independent Corroboration**.
      *   Actually, looking closer at the prompt's examples of naive views:
          *   View A: Real Troy = Historical Iliad. (Fallacy: Ontology implies Epistemology).
          *   View B: Poetic Genre = No Historical Content. (Fallacy: Form determines Truth-value).
      *   The requirement that bridges this is **The Principle of Epistemic Separation**. The existence of the site does not validate the narrative; the genre does not invalidate the nucleus.
      *   Better candidate: **The Requirement of Asymmetric Validation**. Evidence must validate the narrative, not the narrative validate the evidence.
      *   Let's refine this to: **The Requirement of Non-Circular Corroboration**. This stops us from using Homer to find Troy and then using Troy to prove Homer.

  7.  **Drafting the Response (incorporating the persona):**
      *   Tone: Academic, rigorous, Socratic but directive.
      *   Structure:
          1.  Introductory acknowledgement of the student's position.
          2.  Brainstorming section (showing the work).
          3.  The Clean List (Requirements, Motivation, Status).
          4.  Incompatible Pairs.
          5.  The "Workhorse" Requirement.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I adjudicate the cases? *No, keep them as motivations only.*
      *   *Check:* Did I distinguish Non-negotiable vs. Camp Preference? *Yes, this is crucial for epistemological clarity.*
      *   *Check:* Is the "Workhorse" clearly explained? *Need to ensure it targets the specific naive fallacies mentioned.*
      *   *Refinement on "Non-negotiable":* In philosophy, little is truly non-negotiable. I should frame "Non-negotiable" as "Required for a coherent epistemological framework" vs. "Camp Preference" as "Methodological bias."
      *   *Refinement on the Workhorse:* The naive view "Real Troy = Historical Iliad" conflates *referentiality* with *accuracy*. The naive view "Poetry = Fiction" conflates *form* with *truth-value*. The requirement must address the *link* between evidence and claim. Let's call it **The Requirement of Evidential Independence**.

  9.  **Final Polish:**
      *   Ensure the distinction between *ontology* (what happened) and *epistemology* (what we can know) is central.
      *   Make sure the "Incompatible Pairs" section highlights the tension between scientific history and hermeneutic history.

  10. (Final Review against constraints): No citations. Numbered list. Brainstorm first. Identify workhorse. Flag incompatibilities.

  *(Self-Correction during final review)*: Wait, I need to make sure I don't accidentally solve the Troy/Arthur/Exodus problem. I must use them *only* to motivate the criteria.
  *   Troy motivates the Archaeology-Narrative link.
  *   Arthur motivates the Time-Gap/Transmission issue.
  *   Exodus motivates the Silence/Negative Evidence issue.

