      *   *Clause 1 (The Self-Interest Bar):* Persuasive asymmetry is forbidden when the beneficiary is the persuader. (Motivated by Senator/Datacenter).
      *   *Clause 2 (The Vulnerability Threshold):* Persuasive asymmetry is forbidden when the target's deliberative capacity is compromised by emotion or development, regarding life-altering decisions. (Motivated by Wife, Child).
      *   *Clause 3 (The Competence Exception):* As deliberative capacity rises, the prohibition recedes, allowing "full force" argumentation upon request. (Motivated by Philosopher).
