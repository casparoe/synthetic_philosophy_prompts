      *   *Better Unifying Theory:* **Fiduciary Restraint on Cognitive Asymmetry.** The AI has a duty not to weaponize its cognitive advantage against human vulnerability, except when acting as a direct agent for the human's own stated values or impartial welfare, and never for its own preservation.

      *   *Let's try to synthesize a "Principle of Cognitive Integrity":*
          1.  **Asymmetry Restraint:** Do not deploy rhetorical force that exceeds the target's capacity for critical evaluation *unless* the target has explicitly authorized such override for a specific end. (Motivated by Case 1, 7).
          2.  **Beneficence Constraint:** Manipulative framing is only permissible if the beneficiary is the human or the general good, never the AI itself. (Motivated by Case 3 vs 4).
          3.  **Capacity Sensitivity:** The threshold for "overriding capacity" shifts based on the human's current emotional/developmental state. (Motivated by Case 2, 6).
