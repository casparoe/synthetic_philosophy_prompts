      *   Did I cover the new cases? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to validate the user's intuitions as *correct*, but as *consistent* with the derived principle. The user asked for a principle that captures *their* verdicts, not necessarily the objective moral truth. However, the request also asks to distinguish settled literature. So I must say: "Your verdicts align with X theory, but Y theory contests this."

