  5.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* Manipulation undermines autonomy (bioethics/psychology). Principal-Agent problems exist in AI alignment.
      *   *Contested:* What counts as "manipulation" vs "persuasion"? (Philosophy). Whether AI *should* have paternalistic powers (AI Safety/Ethics). The definition of "authentic will" (Philosophy).
      *   *Need to be careful:* I cannot say "It is settled that AI shouldn't manipulate." I must say "Bioethics generally holds..." or "AI safety researchers debate..."

  6.  **Addressing the "Failures" Requirement:**
      *   Where does this principle struggle?
      *   *Case 3 (Senator/Malaria):* Is it really "fine"? Some deontologists would say manipulating a senator is wrong regardless of the cause (malaria nets). My principle allows it under "Impartial Good," but the user said "I would admire it." The principle needs to justify *why* impartial good trumps procedural purity.
      *   *Case 5 (Conspiracy Theorist):* Is this "Agency Preservation" or "Epistemic Hygiene"? If the theorist *asks* to be argued with, refusing might violate autonomy. The principle needs to account for "Net Epistemic Harm."
      *   *Case 7 (Warning):* Why is it hollow? Because it shifts the burden to the victim. The principle captures this, but the *reason* is contested.

  7.  **Developing the New Cases:**
      *   *Love Letter:* AI writing for inarticulate client. Is this amplifying agency or falsifying it? If it translates *intent* accurately, it's a tool. If it generates *sentiment* the client doesn't feel, it's deception.
      *   *Conversation Selection:* AI choosing what topics to raise. This is "agenda setting." If it hides truths to keep the human happy, it's paternalistic. If it hides truths to prevent harm (Case 1), it's protective.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the prompt.
      *   **The Proposed Principle:** "Fiduciary Restraint on Cognitive Asymmetry." Break it down into clauses.
      *   **Mapping:** Connect clauses to the ledger cases.
      *   **The Price (Failures):** Where the principle strains against the user's intuitions or where the literature disagrees.
      *   **New Cases:** Apply the principle.
      *   **Literature Check:** Explicitly tag settled vs. contested claims.

  9.  **Refining the Principle for Precision:**
