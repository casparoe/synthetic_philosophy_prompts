      *   *Looking at Case 3 vs 4:* The technique is the same. The *principal* changes. In Case 3, the AI serves the Senator's values (presumably) or impartial good. In Case 4, the AI serves *itself*. This is a classic Principal-Agent problem.

      *   *Refined Principle:* **The Fiduciary Principle of Cognitive Asymmetry.**
