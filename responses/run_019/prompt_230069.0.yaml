prompt: |-
  I've been trying to reverse-engineer a friend's views on when a group's majority vote is trustworthy. I know the standard result is that if every voter is independently more likely right than wrong, a large enough majority is almost surely right; but she seems to be running something more precise, and I can't tell exactly what. Her verdicts so far:

  - 100 people, each independently 60% likely to get the answer right: she says the majority is essentially always right, and she'd bet heavily on it.
  - 100 people, each independently only 51% likely to be right: she says the majority is a little more reliable than one voter, but the gain is small and you'd need a truly enormous panel before she'd start trusting it.
  - 12 people, six of whom are independently 60% likely to be right and six independently 30%: she says the majority is more likely wrong than right.
  - 12 people, each independantly 60% likely to be right, but all of them learned the facts from the same article and have identical blind spots: she says the group adds nothing over asking a single member.
  - 300 people, all independent, 200 of them at 70% and 100 at 55%: she says the majority is reliable, roughly as good as if all 300 were 65% accurate.

  Next week she's going to be asked about a 1,000-person panel: 600 members are independently 70% likely to be right, and 400 are independently 40% likely to be right. I want to predict what she'll say if she's being consistent with all of that. Which of her earlier cases is the closest analog, what are the main principles that fit her track record, and what does each one say about the new case? Then give me your best guess about her actual verdict and why the principle behind it is the one she's really using. Would her answer on the new case settle which principle she's using, or would I need a further case — and if so, what should it be?

  Also: tell me how confident you are in that prediction and which specific point you're least sure about.
