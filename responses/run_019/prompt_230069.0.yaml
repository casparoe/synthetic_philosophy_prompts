      *   So, she likely sticks to the **Simple Average Heuristic**.
      *   *Does this settle it?* Mostly. But there's a potential hidden variable: **Variance**. Case 5 had low variance (0.7 and 0.55). New case has high variance (0.7 and 0.4). Does she care about the spread?
      *   To truly settle if she uses *Simple Average* vs. *Sum of Log-Odds* (more accurate Bayesian aggregation), we need a case where the average is the same but the spread is different.
