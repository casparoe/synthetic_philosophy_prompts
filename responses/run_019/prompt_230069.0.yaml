answer: |-
  ### 1. The Friend's Principles
  Based on her five verdicts, your friend is operating under a specific, simplified mental model of the **Condorcet Jury Theorem**. Her reasoning relies on four core principles:

  1.  **The Arithmetic Mean Heuristic:** She reduces heterogeneous groups to a homogeneous equivalent by calculating the weighted average competence ($\bar{p}$). This is explicitly revealed in **Case 5**, where she equates a mix of 70% and 55% voters to a uniform group of 65% voters. She does not appear to weight higher-competence voters disproportionately (as a strict Bayesian log-odds model would); she just averages them.
  2.  **The 50% Threshold:** She treats $\bar{p} = 0.5$ as a hard phase transition. If $\bar{p} > 0.5$, the majority converges on truth as $N$ grows (**Case 1, 5**). If $\bar{p} < 0.5$, the majority converges on error (**Case 3**).
  3.  **Independence is Binary:** She treats independence as an on/off switch. If voters share a source (**Case 4**), effective $N$ collapses to 1, regardless of actual headcount. If they are independent, $N$ counts fully.
  4.  **Margin Sensitivity:** She understands that reliability depends on both $N$ and the "signal strength" ($\bar{p} - 0.5$). A small edge requires a massive panel (**Case 2**), while a moderate edge works with a moderate panel (**Case 1**).

  ### 2. Closest Analog
  **Case 5** is the closest structural analog.
  *   **Why:** Like the new case, Case 5 involves a large, independent panel with **heterogeneous competence levels** (some high, some lower).
  *   **Relevance:** In Case 5, she explicitly stated she averages the competencies to find the group's effective accuracy. This provides the direct algorithm for handling the new case's mix of 70% and 40% voters.

  **Case 1** is the closest *outcome* analog.
  *   **Why:** Once the new case is averaged, the parameters ($N=1000$, $\bar{p} \approx 0.58$) are functionally similar to Case 1 ($N=100$, $p=0.6$) but with a much larger $N$. This suggests the confidence level should be at least as high as Case 1 ("essentially always right").

  ### 3. Application to the New Case
  Let's apply her principles to the 1,000-person panel:
  *   **Group A:** 600 voters $\times$ 0.70 accuracy = 420 "expected correct votes."
  *   **Group B:** 400 voters $\times$ 0.40 accuracy = 160 "expected correct votes."
  *   **Total Expected Correct:** 580 out of 1,000.
  *   **Weighted Average Competence ($\bar{p}$):** **0.58 (58%)**.

  **Comparison to her track record:**
  *   **Vs. Case 3:** In Case 3, the average was 45% ($<0.5$), so she distrusted the group. Here, the average is 58% ($>0.5$), so the threshold condition for trust is met.
  *   **Vs. Case 5:** She treated a 65% average as "reliable." 58% is slightly lower, but...
  *   **Vs. Case 1:** She treated a 60% average with only 100 people as "essentially always right." Here, you have nearly the same average (58% vs 60%) but **10 times the population** (1,000 vs 100).

  ### 4. Predicted Verdict
  **She will say the majority is highly trustworthy (likely "essentially always right").**

  **Reasoning:**
  She will apply the **Arithmetic Mean Heuristic** from Case 5 to determine the group acts like 1,000 independent voters with 58% accuracy. She will then apply the **Margin Sensitivity** from Case 1 and 2. Since 58% is comfortably above the 50% threshold (unlike Case 2's 51%) and the sample size is very large (unlike Case 1's 100), the statistical probability of the majority being wrong is vanishingly small. She will likely view the 40% voters merely as "noisier" voters who dilute the average, rather than as active saboteurs, because her model in Case 3 showed she cares about the *net* average, not the presence of low-competence individuals per se.

  ### 5. Does This Settle the Model?
  **Mostly, but not 100%.**
  Her answer on this case will strongly confirm the **Arithmetic Mean Heuristic**. However, it leaves one ambiguity: **Variance Aversion.**
  *   **The Ambiguity:** In Case 5, the lowest competence was 55% (above the 50% threshold). In this new case, a large block (40%) is *below* the 50% threshold. While the *average* is safe, she might have a hidden "minimum competence" rule (e.g., "Don't include voters who are worse than random").
  *   **The Further Case:** To settle this definitively, you would need a case that isolates **variance** while keeping the **mean** constant.
      *   *Proposed Test:* Ask her about a 1,000-person panel where **everyone is independently 58% accurate**.
      *   *Interpretation:* If she trusts this homogeneous panel *more* than the heterogeneous one (600 @ 70%, 400 @ 40%), she is averse to variance or the presence of sub-50% voters. If she trusts them *equally*, her model is purely the Arithmetic Mean Heuristic.

  ### 6. Confidence and Uncertainty
  **Confidence Level:** **High (85-90%)**.
  The comment in Case 5 ("roughly as good as if all 300 were 65% accurate") is a "smoking gun." It explicitly reveals she linearizes competence. Combined with the clear threshold behavior in Case 3, the mathematical prediction is robust.

  **Point of Least Certainty:**
  I am least sure about her **psychological reaction to the <50% subgroup**.
  Mathematically, a 40% voter in a majority vote is just a 60% voter who hasn't flipped their coin; they contribute positively to the mean (0.4 is better than 0.0). However, people often intuitively view "worse than random" agents as dangerous contaminants. If she says, *"I don't trust it because 400 people are actively likely to be wrong,"* she is deviating from her Case 5 principle and adopting a "Minimum Competence" principle. I predict she will stick to her Case 5 principle (Averaging), but the presence of the 40% group is the only variable that might trigger a heuristic override.
