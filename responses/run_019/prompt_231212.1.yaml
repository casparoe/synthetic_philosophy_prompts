answer: |-
  It is easy to see why your friend found that phrase satisfying as a conversation stopper, because it carries a rhetorical force that belies its analytical ambiguity. When we unpack the slogan there is no such thing as a humanitarian bomb, we find it is actually doing several different kinds of work, and distinguishing these layers is crucial for determining whether it actually proves your point about Kosovo, Iraq, and Libya. The most immediate reading is the literal or physical claim that bombs are inherently destructive instruments that kill people and demolish infrastructure. This is a platitude that is true by definition, since the function of an explosive device is to release energy violently. However, this reading does not support the conclusion that the interventions were unjustified, because almost all ethical frameworks for war, including Just War theory, accept that causing harm can be permissible if it is necessary to prevent a greater harm. Acknowledging that bombs destroy bodies does not settle whether the destruction was proportionate to the atrocity being prevented, so this layer of the argument is too weak to condemn the interventions on its own.

  A second, more cynical reading focuses on the motives of the intervening powers rather than the weapons themselves. This thesis suggests that states never act out of purely altruistic concern and that humanitarian language is always a cloak for geopolitical interests. This is a substantive and contestable claim rather than a platitude, as it makes an empirical assertion about the psychology and politics of state actors. Even if we grant this claim as true, however, it still does not necessarily support the conclusion that the interventions were unjustified. In moral philosophy, the justification of an act often depends on its consequences rather than the purity of the agent's motives, much like how a surgeon motivated by profit can still perform a life-saving operation. Therefore, even if the interventions in Kosovo, Iraq, and Libya were driven by strategic interests rather than pure benevolence, this reading alone cannot prove they were morally impermissible if they successfully prevented greater suffering.

  The third reading is consequentialist and argues that the use of aerial bombardment never results in a net humanitarian benefit. This is the most substantive and empirically contestable thesis of the bunch, because it requires a historical accounting of lives saved versus lives lost and stability gained versus chaos incurred. If this claim is true, it would directly support the conclusion that all three interventions were unjustified, because it asserts that the cure is always worse than the disease. In the case of Kosovo, many historians argue that the bombing campaign halted ethnic cleansing, which would falsify this thesis for that specific case, whereas in Iraq the humanitarian justification is widely viewed as retroactive and the consequences disastrous, which would support the thesis. Libya presents a mixed picture where the immediate threat to civilians was removed but long-term state collapse followed. Because the outcomes vary so significantly across these three cases, a blanket claim that bombing never yields humanitarian goods is likely false, but if your friend means to argue that the specific consequences of these three campaigns were net negative, he is making a historical argument that requires evidence rather than a slogan.

  The final reading is conceptual or philosophical, positing that violence and humanitarianism are logically incompatible categories. This thesis suggests that the very idea of humanitarian war is an oxymoron, regardless of motives or outcomes. This is a contestable philosophical stance rather than a factual claim, rooted in a pacifist or strict non-violent ethic. If one accepts this premise, then it follows necessarily that all three interventions were unjustified, because the means themselves are deemed illegitimate regardless of the ends. However, this reading essentially begs the question against anyone who believes that coercive force can sometimes be a necessary tool for protection. Ultimately, only the consequentialist reading that claims the outcomes were net negative, or the conceptual reading that rules out violent means entirely, actually supports the conclusion that the interventions were unjustified. The literal claim about the nature of bombs is merely a platitude that ignores the context of necessity, and the motivational claim about state interests is irrelevant to the moral calculus of outcomes. Your friend's sentence is powerful rhetoric, but unless he is prepared to defend the empirical claim that these specific campaigns caused more suffering than they prevented, or the philosophical claim that violence can never protect, the slogan does not settle the matter.
