answer: |-
  ### 1. Exam Question

  **Question 1 (20 marks, 90 minutes)**

  In lecture, we examined how number theorists employ probabilistic heuristics to justify conjectures, often by treating arithmetic properties as independent random events. We contrasted the Twin Prime Conjecture, where the crude independence assumption was corrected by Hardy and Littlewood to account for congruence dependencies (yielding a plausible constant), with the Mertens Conjecture, where a similar heuristic appeared robust and was numerically confirmed to enormous bounds, yet ultimately proved false.

  Drawing on this contrast, articulate a general **epistemic criterion** for when a probabilistic heuristic confers genuine justificatory weight on a number-theoretic conjecture. Your answer must address:
  1.  Why the Twin Prime heuristic succeeds epistemically while the Mertens heuristic fails, despite both relying on probabilistic models.
  2.  Why finite numerical evidence (e.g., verification up to $10^{30}$) cannot substitute for the structural analysis required by your criterion.
  3.  An application of your criterion to a specific conjecture or heuristic case (from course material or independent knowledge) to demonstrate its utility in distinguishing plausible conjectures from misleading ones.

  Do not merely summarize the mathematical details of the Twin Prime or Mertens cases; focus on the conditions under which the heuristic method itself warrants belief.

  ***

  ### 2. Model Answer

  The core epistemic criterion for probabilistic heuristics is **structural exhaustiveness**: a heuristic confers justification only in proportion to the extent that known sources of arithmetic dependence have been explicitly enumerated and corrected for within the model. Probabilistic models in number theory are not empirical generalizations but counterfactual claims about what would happen *if* numbers lacked structure. Therefore, justification derives from isolating the residual randomness after all known structure is accounted for, not from the numerical fit of the prediction.

  The Twin Prime heuristic succeeds epistemically because the transition from the crude model to the Hardy-Littlewood conjecture represents an audit of local dependencies. The crude model assumes $n$ and $n+2$ are independently prime. However, arithmetic structure dictates that if $n > 2$ is prime, it must be odd, forcing $n+2$ to be odd. This is a deterministic dependency, not a random one. Hardy and Littlewood corrected the probability measure by incorporating singular series factors that account for congruence obstructions modulo every small prime $p$. Once these local structural constraints are removed, the residual distribution behaves sufficiently like randomness to warrant belief. The heuristic works because the known reasons for dependence were removed.

  Conversely, the Mertens Conjecture failed because the heuristic ignored global, oscillatory dependencies linked to the zeros of the Riemann zeta function. The probabilistic model assumed the Möbius function behaves like a random walk. While locally plausible, this ignores subtle correlations arising from the explicit formulae connecting primes to zeta zeros. These dependencies are not local congruence issues but deep analytic structures that manifest only at magnitudes far beyond computational reach. The heuristic was misleading because the sources of dependence were unknown and thus uncorrected, leaving the model structurally incomplete.

  This explains why finite numerical evidence is epistemically weak in this context. In cases like Mertens (or $\pi(x) < \text{li}(x)$), the counterexamples are determined by properties that emerge only after a certain threshold (e.g., Skewes' number). Numerical verification confirms the heuristic only within the range where the hidden dependencies have not yet exerted significant influence. Since arithmetic dependencies can be deferred arbitrarily far, empirical confirmation cannot substitute for the structural audit demanded by the criterion.

  We can apply this criterion to the Goldbach Conjecture. The standard heuristic treats even numbers as sums of two primes chosen randomly with density $1/\log n$. Like Twin Primes, this requires correction for local congruences (e.g., modulo 3, 5, etc.). Because we can enumerate these local obstructions and incorporate them into a singular series, the heuristic satisfies the criterion of structural exhaustiveness regarding local dependencies. However, unlike Mertens, there are no known global analytic obstructions analogous to zeta zeros that would force a deviation. Thus, under our criterion, the Goldbach heuristic confers higher justification than Mertens did, because the space of possible dependencies has been more thoroughly searched and cleared, even if proof remains elusive.

  ***

  ### 3. Marking Scheme

  | Point | Marks | What full marks requires | How candidates typically blow it |
  | :--- | :--- | :--- | :--- |
  | **Epistemic Criterion** | 5 | Clearly articulates a general principle (e.g., "structural exhaustiveness" or "enumeration of dependencies") that distinguishes valid from invalid heuristics. | Vaguely stating "heuristics work when they are accurate" or failing to propose a general rule beyond the specific examples. |
  | **Twin Prime Analysis** | 4 | Explains that HL succeeded because specific *local* dependencies (congruences) were identified and corrected, validating the residual randomness. | Merely reciting the Hardy-Littlewood formula without explaining why correcting the independence assumption adds epistemic value. |
  | **Mertens Analysis** | 4 | Explains that Mertens failed due to *hidden/global* dependencies (e.g., zeta zeros) that were not accounted for, making the independence assumption false. | Claiming Mertens failed simply because "the numbers got big" or treating it as a random statistical error rather than a structural omission. |
  | **Numerical Evidence** | 3 | Argues that numerical verification is insufficient because dependencies can be oscillatory or deferred beyond computational bounds (Skewes' number logic). | Treating verification up to $10^{30}$ as strong confirmation, or failing to explain *why* computation misses the counterexample. |
  | **Application** | 4 | Applies the criterion to a third case (e.g., Goldbach, Odd Perfect Numbers) to show how the criterion distinguishes levels of justification. | Choosing a case but failing to analyze it using the proposed criterion, or selecting a case where the heuristic status is unclear without acknowledging the uncertainty. |
