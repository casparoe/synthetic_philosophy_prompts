      *   *Refinement on Dan:* Dan isn't just saying it's a definition; he's saying it's a *normative* constraint on what counts as an *algorithm*.
      *   *Refinement on User:* User is treating computation as a *natural phenomenon*.
      *   *The "Third Thing":* It's a disagreement about the **nature of the concept of computation itself**. Is it a mathematical abstract or a physical concrete?

  7.  **Final Polish:**
