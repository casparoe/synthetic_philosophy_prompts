      *   1 (Verbal): Partly, but deeper.
      *   2 (Empirical): No, Dan denies empirical relevance.
      *   3 (Counterexample): Yes, this is the crux of falsifiability.

      *Decision:* I will frame it as a **Conceptual Ambiguity regarding the modal status of "Computation."**

      *(Self-Correction)*: Wait, I need to be careful not to dismiss Dan. Dan's view is the standard logician view (Gandy, Sieg). User's view is the standard physicist view (Deutsch, Wolfram). I need to validate both.

