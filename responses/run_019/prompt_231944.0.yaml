answer: |-
  You have identified one of the most persistent friction points in political science and ethics. The reason you cannot find a single name for this distinction is that the seminar participants are not arguing about the same definition of corruption; they are arguing from three different normative frameworks.

  There is no single English word that perfectly separates Case 1 from Case 2, but the conceptual distinction you are looking for is best described as **Venality vs. Particularism.**

  *   **Case 1 (Mayor/Family)** is **Venality** (or private corruption).
  *   **Case 2 (Legislator/Motorway)** is **Particularism** (or political corruption/clientelism).
  *   **Case 3 (Clerk/Gift)** is **Social Embeddedness** (or informal exchange).

  The "feature that does the carving work" is not legality, nor is it strictly "who benefits." It is **Impartiality.**

  Here is the breakdown of the map you are trying to draw, the specific terms that fit the gaps, and the "tests" your seminar participants are implicitly using.

  ### 1. The Three Zones of the Map

  To distinguish these cases, scholars (most notably Bo Rothstein and Ake Sandberg in their work on *Quality of Government*) distinguish between **Private-Regarding**, **Political-Regarding**, and **Social-Regarding** exchanges.

  **Case 1: Venality (Private-Regarding)**
  *   **The Mechanism:** The official converts public authority into *private* wealth.
  *   **The Feature:** The benefit is **excludable and consumable by the official.** The money stops in the family bank account.
  *   **The Norm Violated:** Public office is a trust.
  *   **Why no one defends it:** It fails every test. It breaks procedural rules (no-bid), it violates impartiality (family), and it offers no public justification.

  **Case 2: Particularism / Clientelism (Political-Regarding)**
  *   **The Mechanism:** The official converts public authority into *political* capital.
  *   **The Feature:** The benefit is **non-excludable to the official but excludable to the public.** The legislator cannot put the motorway in her pocket; she must spend it on her district to buy loyalty/votes.
  *   **The Norm Violated:** The Common Good (Universalism).
  *   **Why it is debated:** This is the core of your seminar's tangle. It is often legal (appropriations are legislative acts). It is transparent (campaign ads).
  *   **The Term:** This is often called **Pork-Barrel Politics** when benign, or **Clientelism** when the exchange is explicit (votes for roads).

  **Case 3: Gift Exchange (Social-Regarding)**
  *   **The Mechanism:** The official operates within a web of *social reciprocity* rather than bureaucratic rationality.
  *   **The Feature:** The benefit is **symbolic or relational.** The bottle of wine is not a "payment" in a market sense; it is an acknowledgement of a relationship.
  *   **The Norm Violated:** Bureaucratic Impersonality.
  *   **Why it is debated:** It conflicts **Universalism** (rules apply to everyone equally) with **Particularism** (relationships dictate obligations).

  ### 2. The Feature That Does the "Carving Work"

  You asked what feature determines whether people label these "corruption." It is not the rule of law (Case 2 is often legal). It is not the outcome (Case 2 produces a road).

  The feature is **The Scope of the Obligation.**

  *   **In Case 1,** the obligation is to the **Self/Family.** This is universally condemned in modern state theory because the state is supposed to be distinct from the ruler's household.
  *   **In Case 2,** the obligation is to the **Constituency.** This is defended because in a representative democracy, the official *is* elected to prioritize that constituency.
  *   **In Case 3,** the obligation is to the **Interlocutor.** This is defended because in many cultures, a transaction without a relationship is considered hostile or suspicious.

  ### 3. The "Tests" Your Seminar Participants Are Using

  The disagreement in your room arises because half the class is using an **Impartiality Test**, and the other half is using a **Legitimacy/Mandate Test.**

  #### The Impartiality Test (The "Corruption" Camp)
  *   **Premise:** Public power must be exercised without regard to personal connections, political support, or social gifts.
  *   **Verdict on Case 1:** Corruption (Family connection).
  *   **Verdict on Case 2:** Corruption (Political connection). *Reasoning:* Resources should go where need is greatest, not where votes are bought.
  *   **Verdict on Case 3:** Corruption (Social connection). *Reasoning:* A permit should be granted based on the application, not the gift.
  *   **Philosophical Root:** **Universalism.** (Weberian Bureaucracy).

  #### The Mandate Test (The "Representation" Camp)
  *   **Premise:** Public power is authorized by voters to advance their interests. If the process is transparent and the voters approve, it is legitimate.
  *   **Verdict on Case 1:** Corruption (Voters did not authorize theft).
  *   **Verdict on Case 2:** Representation. *Reasoning:* The legislator was explicit ("I deliver for us"). The voters ratified the exchange with their ballots. The "public" is defined as the constituency.
  *   **Verdict on Case 3:** Manners. *Reasoning:* No rule was bent (no harm), and the gift is a cultural norm, not a quid pro quo.
  *   **Philosophical Root:** **Democratic Authorization & Cultural Relativism.**

  ### 4. The Missing Name: "Institutional Corruption"

  If you need a label for the specific tension in Case 2 (the legislator), the most precise contemporary term is **Institutional Corruption** (coined by Dennis Thompson and popularized by Lawrence Lessig).

  *   **Individual Corruption (Case 1):** A bad apple breaking the rules for private gain.
  *   **Institutional Corruption (Case 2):** A good apple following the rules, but the *system* incentivizes behavior that undermines the institution's purpose. The legislator is doing her "job" (getting re-elected), but in doing so, she distorts the allocation of public resources.

  This explains why half the room calls it corruption and half calls it representation. The "Individual Corruption" camp sees a crime; the "Institutional Corruption" camp sees a systemic distortion that is legal but ethically corrosive.

  ### 5. Summary for Your Seminar

  To untangle the discussion, you can propose that the class is conflating three different phenomena that share a family resemblance but differ in **Beneficiary** and **Legitimacy**:

  1.  **Kleptocracy/Nepotism (Case 1):** Private enrichment. Violates **Property** (theft of public funds) and **Impartiality**. *Consensus: Corrupt.*
  2.  **Clientelism/Pork (Case 2):** Political enrichment. Violates **Universalism** (fairness across districts) but claims **Democratic Mandate**. *Consensus: Contested.*
  3.  **Gift Exchange (Case 3):** Social enrichment. Violates **Bureaucratic Rationality** but claims **Cultural Normacy**. *Consensus: Contested.*

  **The Carving Feature:**
  The line is drawn at **Convertibility.**
  *   In Case 1, public power is converted into **private cash.** (Corruption)
  *   In Case 2, public power is converted into **political support.** (Debatable/Institutional Corruption)
  *   In Case 3, public power is acknowledged via **social token.** (Debatable/Cultural Norm)

  If you need one phrase to name the distinction between Case 1 and Case 2, use **"Private Gain vs. Political Exchange."** If you need the concept that explains why Case 2 and 3 are defended, use **"Embeddedness."** (Case 2 is embedded in the political system; Case 3 is embedded in the social fabric). Those calling it corruption are arguing for **Disembeddedness** (the state should stand apart from politics and society).
