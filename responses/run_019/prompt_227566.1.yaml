      *   *Theory 2: Person-Affecting Restriction (PAR) + Total View.* "Make people happy, don't make happy people" (Narveson). But she said Mere Addition is *strictly better*. So she's not a hard Narveson-ian. She's likely a **Wide Person-Affecting View**. "An outcome is better if it is better for someone and worse for no one."
