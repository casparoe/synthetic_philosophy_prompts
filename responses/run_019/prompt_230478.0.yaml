answer: |-
  ### The RL Restatement of *The Theory of Moral Sentiments*

  **The Agent and Environment**
  Consider a population of agents operating in a multi-agent social environment. Each agent $i$ has a policy $\pi_i(a|s)$ and seeks to maximize a cumulative return. The environment is partially observable; agents cannot directly access the internal states (utilities, pains, pleasures) of other agents, only their outward expressions and actions.

  **Sympathy as Counterfactual Simulation**
  Smith's "sympathy" is not merely emotional contagion; it is a model-based inference process. When agent $i$ observes agent $j$ in state $s_j$ expressing emotion $e_j$, agent $i$ runs a counterfactual rollout: "What would my value function $V_i$ estimate if I were in state $s_j$?"
  $$ \text{Sympathy} \approx V_i(s_j) \stackrel{?}{\approx} V_j(s_j) $$
  If the simulated value matches the observed emotion, "sympathy" (alignment) occurs. If there is a discrepancy (loss), agent $i$ adjusts their own emotional response or judges $j$'s response as improper. This simulation process generates the training data for moral learning. Sympathy is the mechanism by which agents sample the reward landscape of others to update their own models.

  **The Impartial Spectator as a Learned Reward Model**
  The "Impartial Spectator" is an internalized reward model $R_{spectator}(s, a)$ trained on the history of sympathy-based interactions.
  1.  **Training Phase:** Initially, the agent relies on external social feedback (praise/blame) as the reward signal $R_{ext}$. This signal is noisy and biased by proximity and relationship.
  2.  **Internalization:** Over time, the agent trains $R_{spectator}$ to predict $R_{ext}$ but regularizes it for consistency and generality. The Spectator is the posterior estimate of the "true" social reward function, denoised of specific biases (e.g., favoritism).
  3.  **Deployment:** Once trained, the Spectator acts as a regularizer on the policy update. The agent optimizes a composite objective:
      $$ J(\pi) = E[\sum \gamma^t (R_{ext} + \lambda R_{spectator})] $$
      The Spectator allows the agent to compute gradients even when external observers are absent (unobservable states).

  **Praised vs. Praiseworthy as Reward Hacking vs. Robust Alignment**
  *   **Wanting to be Praised:** This is optimizing strictly for $R_{ext}$. The agent learns a policy that manipulates observable signals to trigger approval without generating the underlying state that warrants it. In RL terms, this is **reward hacking** or overfitting to the proxy metric. It works well in-distribution (when watched) but fails under distribution shift (when alone).
  *   **Wanting to be Praiseworthy:** This is optimizing for $R_{spectator}$. The agent seeks to align its policy with the internalized model of propriety, regardless of whether $R_{ext}$ is realized. This is **robust alignment**. The agent prefers high $R_{spectator}$ even if $R_{ext}$ is zero (doing right when no one looks) or negative (doing right despite social pressure).

  **Propriety as Value Alignment**
  An action is "proper" if the gradient step it implies aligns with the Spectator's value estimates. Moral judgment is the process of computing the divergence between an agent's policy and the Spectator's expected policy for a given state.

  ***

  ### Residue Report

  | Category | Smithian Concept | RL Translation | Fidelity |
  | :--- | :--- | :--- | :--- |
  | **Clean Map** | Desire for Praise | Maximizing External Reward ($R_{ext}$) | High. Both describe optimization for observable social feedback. |
  | **Clean Map** | Desire to be Praiseworthy | Maximizing Internal Reward Model ($R_{spectator}$) | High. Both describe optimization for a latent, generalized objective. |
  | **Clean Map** | Impartiality | Denoising / Regularization | High. The Spectator corrects for the noise/bias of immediate observers, similar to robustifying a reward model against overfitting. |
  | **Fudged** | Sympathy | Counterfactual Rollout | Medium. Smith implies an affective resonance ("feeling with"), whereas RL simulation is computational. The "pain" of misalignment is a loss function value, not a qualia. |
  | **Fudged** | The Spectator's Authority | Regularization Weight ($\lambda$) | Medium. In Smith, the Spectator *commands*. In RL, $\lambda$ is a hyperparameter. The RL agent can theoretically set $\lambda=0$ without logical contradiction; Smith implies you cease to be moral if you do. |
  | **No Counterpart** | Normativity | Objective Function | None. RL explains *how* an agent optimizes a goal, not *why* that goal is objectively good. Smith claims the Spectator leads to *virtue* (teleology); RL only claims it leads to *higher return on that specific channel*. |
  | **No Counterpart** | Moral Sentiment | Gradient Signal | None. The phenomenological experience of guilt or approbation is reduced to scalar feedback values. |

  ***

  ### Honest Read: Loss and Gain

  **What is Lost:**
  The translation strips Smith's account of its **normative force**. In *TMS*, the Impartial Spectator is not just a useful heuristic; it is constitutive of moral agency. Ignoring it is a failure of humanity, not just a suboptimal policy. In RL, ignoring the internal reward model is simply a different optimization choice (e.g., pure exploitation vs. regularization). Furthermore, the RL frame cannot capture the *qualia* of conscience—the actual felt pain of guilt—which Smith argues is a primary driver of behavior, not just a backward-looking signal. Finally, Smith hints at a teleological order (Nature/God designed us this way); RL assumes arbitrary objective functions.

  **What is Gained:**
  The RL framing clarifies the **functional necessity** of the Impartial Spectator in a way standard philosophical readings often obscure. A standard reading says the Spectator is "taking an outside view." The RL reading explains *why* that view must be internalized: **generalization under distribution shift.**
  If an agent only optimizes for external praise ($R_{ext}$), it fails whenever the observation space changes (i.e., when no one is watching). The "Praiseworthy" agent is robust to sparse reward environments. The RL frame reveals Smith's psychology as a solution to the **credit assignment problem** in social learning: you cannot wait for external feedback to learn complex moral policies; you need an internal critic to provide dense feedback signals during training. It reframes virtue not as mysticism, but as a robustness mechanism against reward hacking.

  **Verdict:**
  The translation is mechanistically superior but normatively hollow. It explains the *architecture* of Smith's moral agent better than standard prose (specifically regarding internalization and robustness), but it cannot explain why that architecture *ought* to be preferred beyond instrumental utility.

  Summary: The RL translation successfully mechanizes Smith's psychology as a robustness mechanism against reward hacking but strips away the normative force that makes the spectator binding rather than optional.
