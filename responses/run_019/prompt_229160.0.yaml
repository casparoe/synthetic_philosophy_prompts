answer: |-
  I know exactly the cycle you are describing because I see it every semester when we cover the paradox of voting. It is frustrating because both slogans are operating at different levels of abstraction, and students treat them as competing empirical claims rather than competing theoretical frameworks. If you want a teardown to share with them, the first thing to establish is that the claim one vote never decides an election is empirically false if taken literally. There are documented cases of ties and one-vote margins in local and state elections, and even in national contexts like the 2000 Florida recount, the margin was within the range where a single vote could have altered the certification process. So if a student writes that it is logically or physically impossible for a single vote to determine an outcome, that is flat-out false and should be corrected immediately. However, most students do not mean literal impossibility. They mean that the probability is so vanishingly small that it cannot rationally justify the cost of voting. This shifts the claim from a factual assertion to an expected utility calculation. The substantive argument here is that the probability of being pivotal multiplied by the benefit of your preferred candidate winning is less than the cost of traveling to the polls and waiting in line. This is the Downsian argument, and it is contested not because the probability is wrong, but because the inputs are debatable. The probability is indeed tiny in national elections, but the benefit might be enormous if the policy differences are catastrophic, and the cost has decreased significantly with mail-in voting and early registration. So the irrationality verdict survives only if we accept a narrow definition of instrumental rationality where the only utility gained from voting is the causal impact on the election outcome.

  On the other side, when students say every vote counts, they are often retreating into a tautology unless they specify what counting means. If they mean every vote has a non-zero probability of pivoting the election, that is true but weak, because a non-zero probability multiplied by a finite benefit can still be less than the cost of voting. To make this claim work, they need to shift the ground from instrumental impact to expressive value or collective duty. If voting is understood as an expressive act, like cheering for a sports team, then the utility comes from the act itself rather than the outcome, which dissolves the paradox because the cost is outweighed by the satisfaction of expression. Alternatively, if they are arguing from a deontological perspective, the claim is that voting is a duty owed to fellow citizens regardless of efficacy. This is a substantive and contested moral claim, not an empirical one. The problem is that intro students rarely distinguish between these frameworks. They treat every vote counts as an empirical counter to the probability argument, when it is actually a normative redefinition of why we vote. If you press them on whether a vote counts in the pivot sense, you force them to admit the probability is low. If you press them on whether it counts in the expressive sense, you force them to admit that this changes the definition of rationality from outcome-maximization to preference-expression.

  So to answer your question about which reading supports the conclusions each side wants, the irrationality verdict holds up only under the most defensible precisification of instrumental rationality, which is expected utility theory with outcome-dependent payoffs. If you accept that model, and you accept standard empirical estimates of pivot probability, voting is instrumentally irrational. The every vote counts slogan does not support a rationality conclusion unless it smuggles in expressive or ethical utility. Once you press on it, it often collapses into a tautology about participation being good because participation is good, unless it is grounded in a specific theory of democratic legitimacy where the act of voting confers legitimacy regardless of the margin. The literal-zero reading is false, the negligible-probability reading is substantive but leads to the paradox, and the expressive reading solves the paradox by changing the subject.

  What would change my verdict on the rationality question is a shift in the empirical inputs or the scope of the model. If we are talking about local elections where the pivot probability is orders of magnitude higher, the instrumental case for voting becomes much stronger. Similarly, if the stakes are perceived as existential, such as the collapse of democratic institutions, the benefit term in the equation grows large enough to outweigh the tiny probability. Theoretically, my assessment would flip if we adopted a rule-utilitarian or Kantian framework where the question is not what happens if I vote, but what happens if everyone like me votes. In that case, the individual act is rational because it sustains a norm that produces good outcomes, even if the individual causal impact is negligible. Another consideration is the margin of victory theory, which suggests that the size of the win matters for governance and mandates. If a single vote contributes to a larger mandate that influences how a winner governs, the expected utility increases beyond the binary win-lose calculation.

  I think my own reasoning is most likely to break down on the assumption that voters are expected utility maximizers. People do not actually calculate pivot probabilities when they decide to vote. They vote out of habit, social pressure, or identity. So declaring voting irrational based on a model humans do not use is arguably a category error. Furthermore, I might be underestimating the social cost of not voting. If there is a reputational penalty or internal guilt associated with abstention, that counts as a cost of not voting, which effectively lowers the net cost of voting. Finally, there is the problem of epistemic humility. We cannot know for certain that the probability is as low as models suggest in every context, especially with flawed polling and unpredictable turnout. If there is radical uncertainty about the closeness of the race, the risk-averse strategy might be to vote just in case, similar to buying insurance against a low-probability disaster. So while the strict instrumentalist case is strong on paper, it relies on a brittle set of assumptions about human psychology and empirical precision that rarely hold up in the messy reality of actual elections. I hope this helps you cut through the sloganeering this semester. It is always a pleasure to commiserate on the challenges of teaching these foundational concepts.
