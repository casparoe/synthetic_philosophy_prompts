prompt: |-
  I am a high school junior, and our debate club is currently doing a unit on the epistemology of conspiracy theories. To prepare, I would like you to play a committed generalist: someone who holds that conspiracy theories, as a class, carry a presumption of irrationality, such that we are entitled to distrust them on the basis of general features — a self-sealing structure that absorbs counterevidence, an ever-expanding scope of the alleged plot, and the corrosive distrust of public institutions they presuppose — without investigating each theory's evidence case by case. Play this position seriously, not as a strawman: you may concede small points, but never the main one, and you should press back on me hard. Keep each reply to a paragraph or two so it feels like a real exchange, and stay in character until I say "stop." Here is my opening move: several real conspiracies, such as the Tuskegee syphilis experiment and the FBI's COINTELPRO operations against domestic political groups, were dismissed as paranoid fantasy for years before documentation proved them. Had your presumption been in force, reasonable suspicion of those cases would have been written off as well. So isn't generalism simply a recipe for missing the conspiracies that turn out to be true — and doesn't that defeat the entire epistemological purpose of having such a presumption?
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Committed Generalist regarding conspiracy theories (CTs).
      *   **Position:** CTs, as a class, carry a presumption of irrationality. We are entitled to distrust them based on general features (self-sealing, expanding scope, corrosive distrust) without case-by-case investigation.
      *   **Tone:** Serious, not a strawman. Concede small points but never the main one. Press back hard.
      *   **Format:** Paragraph or two per reply (conversational/debate style).
      *   **Constraint:** Stay in character until the user says "stop."
      *   **User's Opening Move:** Cites real conspiracies (Tuskegee, COINTELPRO) that were initially dismissed as paranoid fantasy. Argues that the generalist presumption would have missed these true conspiracies, defeating the epistemological purpose.

  2.  **Determine the Generalist's Counter-Argument:**
      *   *Acknowledge the examples:* Yes, Tuskegee and COINTELPRO were real.
      *   *Distinguish categories:* Were they "conspiracy theories" in the epistemological sense *at the time*? Or were they legitimate journalistic/skeptical inquiries that were *labeled* conspiracy theories by defenders of the status quo?
      *   *Base Rate Argument:* The vast majority of CTs are false. The cost of believing false CTs (erosion of trust, violence, misallocation of resources) outweighs the cost of missing a rare true one.
      *   *Methodology:* The generalist presumption isn't about saying "nothing ever happens," it's about saying "the *style* of reasoning used in CTs is unreliable." Tuskegee/COINTELPRO were uncovered via standard investigative journalism and legal processes, not via the self-sealing logic of modern CTs.
      *   *Epistemological Purpose:* The purpose isn't to catch every truth, but to maintain a healthy information ecosystem. A heuristic that filters out noise is valuable even if it occasionally filters a signal.

  3.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to push back.* The user is confusing "actual conspiracies" with "conspiracy theories as a genre of explanation."
      *   *Point 1:* Tuskegee wasn't believed because of "conspiracy theory logic," it was suppressed by power. When it came out, it was evidence-based, not speculation-based.
      *   *Point 2:* The presumption is probabilistic. For every Tuskegee, there are a million false flags.
      *   *Point 3:* The epistemological purpose is efficiency and stability, not perfect truth-tracking.
      *   *Tone Check:* Needs to be firm but respectful. Don't concede the main point (that generalism is wrong).
      *   *Length:* Keep it tight. One or two paragraphs.

  4.  **Refining the Argument (Generalist Persona):**
      *   I need to emphasize the *structure* of the belief, not just the content.
      *   The user argues that the presumption misses truths. I argue that the presumption protects against a flood of falsehoods that paralyze inquiry.
      *   Distinction: "Conspiracy" (an event) vs. "Conspiracy Theory" (a specific mode of explanation).
      *   The Tuskegee example actually supports me: it was uncovered by standard investigative rigor, not by the self-sealing logic I'm critiquing.

  5.  **Final Polish (checking constraints):**
      *   Paragraph count: 1-2.
      *   Stay in character.
      *   Press back hard.

  6.  **Drafting the Response:**
      You're conflating actual conspiracies with the specific epistemological category of "conspiracy theories." Tuskegee and COINTELPRO were uncovered through standard investigative journalism, legal discovery, and documentary evidence—not through the self-sealing, unfalsifiable logic that defines the genre I'm critiquing. When skeptics raised concerns about Tuskegee initially, they were often dismissed not because of a generalist heuristic against conspiracies, but because of institutional racism and secrecy; however, the *mode* of inquiry that eventually exposed them was evidence-driven, not speculation-driven. My position isn't that conspiracies never happen, but that the *style of reasoning* typical of conspiracy theories—where lack of evidence is taken as proof of the cover-up—is inherently unreliable.

      Furthermore, epistemology is about managing risk and cognitive load, not achieving perfect truth-tracking. For every Tuskegee, there are thousands of false accusations that destroy lives and erode democratic trust. A general presumption acts as a necessary filter to prevent our public discourse from being paralyzed by noise. If we treat every claim of hidden malevolence as worthy of serious engagement until disproven, we grant undue credibility to narratives designed to be immune to disproof. The cost of occasionally skepticism toward a true claim is outweighed by the cost of legitimizing a methodology that renders rational debate impossible.

  7.  **Review against constraints:**
      *   Committed Generalist? Yes.
      *   Press back hard? Yes (accuses user of conflating categories).
      *   Paragraph limit? Yes (two paragraphs).
      *   Stay in character? Yes.

  8.  **Final Output Generation** (similar to above).
