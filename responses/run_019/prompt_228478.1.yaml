prompt: |-
  In a reading group on self-locating belief, I've ended up as the local defender of the thirder position in the Sleeping Beauty problem: on waking, Beauty should have credence 1/3 that the coin landed heads. I'm tired of attacking halfers and want to stress-test my own side instead, so please map my position's exposure: what would count against thirderism, and how much? Since this isn't an empirical hypothesis, begin by saying what defeat could even look like for a view of this kind -- a possible case where the thirder verdict is untenable even to its friends, a formal inconsistency with principles thirders typically accept (conditionalization under known forgetting, reflection, the Principal Principle), a Dutch book that can't be deflected by standard moves, or a demonstration that the position collapses into halferism once it's made fully precise. Then survey the candidate defeaters: the many-awakenings extreme version, the variant where the coin is flipped only after Monday's waking, duplication and teleportation cases, the betting arguments, and any pressure from related puzzles like the Doomsday argument. For each, say which commitment of mine it actually strikes, and distinguish what committed thirders themselves concede as genuine costs (for instance, discomfort with self-indication-style consequences such as the Presumptuous Philosopher) from what they dismiss as intuition-mongering. I'd personally find a demonstration of internal inconsistency far more persuasive than a counterintuitive case, but I want the full ranking either way, from fatal to merely awkward.

  To keep you honest, here's a variant I devised that isn't in the literature as far as I know, which I want you to use as a test case before giving the ranking. Call it Double Beauty: the experimenters use two fair coins. Coin one is flipped Sunday and determines whether Beauty is also awakened on Tuesday, as in the original. Coin two is flipped Monday night and determines whether she is additionally awakened on Wednesday. Memory is erased after every awakening, so any waking is subjectively indistinguishable from any other. Possible awakening schedules are therefore: Monday alone (one awakening), Monday and Wednesday, Monday and Tuesday, or all three days. On a waking, what should Beauty's credence be that coin one landed heads? Work out what thirderism predicts here -- and if you find that "thirderism" doesn't determine a unique answer without being upgraded into a general theory of self-locating belief (say, the self-indication assumption, or some rival), say so, compute the answers under each natural upgrade, and assess whether this exposes my position as a verdict in search of a theory rather than a theory. If the variant turns out to be poorly specified in some respect, repair it in the most natural way and proceed.

  Finally, address whether the whole dispute risks dissolving into a terminological one -- thirders talking about credences, halfers about something else such as pre-experiment betting dispositions -- and whether that dissolution, if it came, would count as a defeat for thirderism, a victory, or neither. Close with a table summarizing the map of exposure, with these columns: Defeater (short name); Type (possible case, formal result, collapse argument, or dissolution); Commitment struck (which thirder commitment it targets); Conceded by thirders? (would a committed defender agree it counts against the view); Severity (fatal, serious, or awkward); Rationale (one or two sentences justifying that ranking).
