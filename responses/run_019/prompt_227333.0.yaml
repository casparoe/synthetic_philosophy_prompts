  2.  **Analyze Bongard Problems (BPs):**
      *   *Structure:* 12 images. 6 on left (positive examples), 6 on right (negative examples). Task: Find the rule that distinguishes left from right.
      *   *Cognitive Demand:* Hypothesis generation, rule formulation, symbolic grounding (visual to linguistic/logical), handling noise/irrelevance.
      *   *Nature of Rule:* Often semantic, topological, relational, or count-based. Can be very open-ended.
      *   *Exposure:* Infinite variety. Hard to memorize specific problems, but meta-rules (e.g., "count the shapes") can be learned.
      *   *Few-shot:* Yes, 6 examples per class. Very data-efficient.

  3.  **Analyze Raven's Progressive Matrices (RPMs):**
      *   *Structure:* 3x3 grid (usually). Bottom right missing. 8 options to choose from.
      *   *Cognitive Demand:* Pattern completion, rule extrapolation (rows/columns), working memory (holding rules while checking options).
      *   *Nature of Rule:* Usually logical operations (AND, OR, XOR), arithmetic progressions, rotations, distributions. More constrained than BPs.
      *   *Exposure:* Highly standardized. Format is rigid.
      *   *Few-shot:* Technically 2 examples per row/col to infer the 3rd, but the *format* is highly familiar to test-takers.

  4.  **Compare: Task & Ability:**
      *   *BP:* "What is the difference?" (Discriminative rule discovery). Requires *verbalizing* or internalizing a distinct concept. Open-ended hypothesis space.
      *   *RPM:* "What comes next?" (Generative/Compleitive rule application). Requires selecting from closed set. Constrained hypothesis space.
      *   *Ability:* Both measure fluid intelligence ($G_f$). However, BPs lean more towards *concept formation* and *semantic abstraction*, while RPMs lean towards *logical reasoning* and *pattern completion*.
      *   *Verdict:* They are overlapping but distinct. RPM is more about systematic manipulation of variables; BP is about identifying the *relevant* variable amidst noise.

  5.  **Compare: Robustness to Memorization/Pattern Matching:**
      *   *RPM:* Vulnerable to "test-wiseness." The grid format is a huge prior. Deep learning models (and humans) can cheat by learning statistical regularities of the *format* rather than the logic. High exposure helps significantly.
      *   *BP:* Much harder to cheat via format. The visual domain is open. However, "meta-rules" (e.g., look for symmetry) can still be memorized. But the specific instantiation is harder to lookup.
      *   *Few-shot vs. Format:* The user asks if few-shot (BP) is safer than familiar format (RPM). Yes, generally. Unconstrained visual domains resist lookup tables better than fixed grids.

  6.  **Evaluate "Genuine Abstraction":**
