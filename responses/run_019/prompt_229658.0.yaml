answer: |-
  Here is a decision tree designed for your philosophy meetup. It contains 7 branch questions. They are phrased to avoid legal jargon and force participants to confront the underlying principles of their intuition rather than reciting a position they've heard of.

  ### Instructions for the Facilitator
  Tell participants to start at **Root** and answer honestly. There are no "correct" answers. If they get stuck between two answers, tell them to pick the one that feels like the *stronger* reason for their view. At the end, they will land on a **Leaf** that names their philosophical position.

  ---

  ### The Decision Tree: Justice at the End of the Gun

  **Root:** We accept the shared historical facts: The tribunals happened, the Allies appointed the judges, the defendants were Axis leaders, and the charges included both specific atrocities (like killing POWs) and broader political crimes (like starting the war).

  **Q1. The Mirror Test**
  Imagine the war ended in a stalemate, but the Axis powers still managed to set up a tribunal against Allied leaders using the *exact* same rules, charges, and judge-selection process as Nuremberg. Do you consider that hypothetical tribunal legally valid?
  *   **No:** Go to **Q2**.
  *   **Yes:** Go to **Q3**.

  **Q2. The "Necessary Evil" Check**
  You believe the Axis version of the trial would be illegitimate (victors' justice). But regarding the *actual* Nuremberg trials: If we knew for certain these trials would never be cited as precedent again and would change nothing about the future, would you still support them?
  *   **No (It was only worth it for the political result):** Go to **Leaf A**.
  *   **Yes (It was wrong regardless of utility):** Go to **Leaf B**.

  **Q3. The Written Rule Test**
  Focus on the charge of "Crimes Against Peace" (planning and starting an aggressive war). In 1945, there was no specific international statute that made "starting a war" a punishable crime for individuals. Does the sheer moral monstrosity of the war make it a crime anyway, or does the lack of a prior written rule make punishment impossible?
  *   **Lack of written rule makes it impossible:** Go to **Q4**.
  *   **Moral monstrosity makes it a crime:** Go to **Q5**.

  **Q4. The Charge Split**
  You think "starting the war" wasn't a valid charge because it wasn't codified. However, many defendants were also charged with violating existing treaties (e.g., shooting prisoners of war, bombing civilians). Should the defendants have been acquitted of *all* charges, or just the "starting the war" charges?
  *   **Acquitted of everything (The whole court was tainted):** Go to **Leaf B**.
  *   **Acquitted only of "starting the war" charges:** Go to **Leaf C**.

  **Q5. The Dirty Hands Test**
  The Soviet judges sat on the bench despite the Katyn massacre, and Allied pilots had bombed civilian cities (Dresden/Tokyo), yet only Axis leaders were charged for similar conduct. Does the fact that the judges also committed similar acts invalidate the convictions of the defendants?
  *   **Yes, it invalidates the whole proceeding:** Go to **Leaf B**.
  *   **No, the defendants' guilt stands on its own:** Go to **Q6**.

  **Q6. The Tokyo Distinction**
  The Tokyo Tribunal (for Japan) exempted the Emperor from prosecution, had far more dissenting opinions from the judges, and is often viewed as more rushed and racially biased than Nuremberg. Does this specific handling make Tokyo illegitimate *even if* you accept Nuremberg as legitimate?
  *   **Yes, they must be judged separately:** Go to **Leaf D**.
  *   **No, they stand or fall together:** Go to **Q7**.

  **Q7. The Principle vs. Precedent Test**
  You support the trials. But imagine a scenario where the legal reasoning was perfectly airtight (no retroactive laws), but the trials produced no lasting international court or historical record. Conversely, imagine the reasoning was legally shaky (as it was), but it created the modern ICC and Holocaust record. Which matters more to your support?
  *   **The legal reasoning must be airtight (Principle):** Go to **Leaf E**.
  *   **The historical/precedent gain justifies the shaky reasoning (Outcome):** Go to **Leaf F**.

  ---

  ### The Leaves (Positions)

  **Leaf A: Cynical Pragmatism (Unexplored/Rare)**
  *   **Path:** Q1(No) → Q2(No).
  *   **Position:** You believe the trials were fundamentally "victors' justice" and legally illegitimate, but you support them because they were politically useful.
  *   **Status:** **Unattractive/Unexplored.** This is logically consistent but morally precarious. It admits the process was a sham but endorses the sham. It is rarely held as a public philosophical stance because it undermines the rule of law it claims to value.

  **Leaf B: Total Victors'-Justice Rejectionism**
  *   **Path:** Q1(No) → Q2(Yes) **OR** Q3(No) → Q4(Acquitted Everything) **OR** Q5(Yes).
  *   **Position:** The tribunals were illegitimate. Law cannot be retroactive, and winners cannot judge losers. The hypocrisy of the Allies and the lack of prior statutes invalidate the proceedings entirely.
  *   **Status:** **Common.** This is your uncle's position.

  **Leaf C: The Legalist Middle**
  *   **Path:** Q1(Yes) → Q3(No) → Q4(Acquitted "Starting War" only).
  *   **Position:** The trials were partially legitimate. Conventional war crimes (POWs, treaties) were valid charges because laws existed. "Crimes Against Peace" and "Conspiracy" were illegitimate because they were invented after the fact.
  *   **Status:** **Common.** This is the stance of many legal historians who respect the record but critique the "Aggressive War" charge.

  **Leaf D: Nuremberg-Yes / Tokyo-No**
  *   **Path:** Q1(Yes) → Q3(Yes) → Q5(No) → Q6(Yes).
  *   **Position:** The European tribunal was a defensible application of natural law, but the Pacific tribunal was compromised by political immunity (the Emperor) and racial bias, rendering it illegitimate.
  *   **Status:** **Specific.** Held by those who see the Tokyo trial as significantly more flawed than Nuremberg.

  **Leaf E: Natural Law Defense**
  *   **Path:** Q1(Yes) → Q3(Yes) → Q5(No) → Q6(No) → Q7(Principle).
  *   **Position:** The trials were legally sound because some acts are crimes by virtue of being morally monstrous, regardless of written statutes. The legitimacy comes from universal morality, not just political utility.
  *   **Status:** **Common.** The classic defense of the tribunals.

  **Leaf F: Pragmatist "Flawed but Net Gain"**
  *   **Path:** Q1(Yes) → Q3(Yes) → Q5(No) → Q6(No) → Q7(Outcome).
  *   **Position:** You acknowledge the legal flaws (retroactivity, victor bias) but argue the precedent, the historical record, and the establishment of international criminal law justify the shortcuts taken.
  *   **Status:** **Common.** The modern mainstream view.

  ---

  ### Facilitator Notes & Limitations

  **1. The "Empty" Leaf (Leaf A)**
  I have included **Leaf A (Cynical Pragmatism)** as the "Unexplored/Unattractive" leaf. It is reachable (Q1-No, Q2-No), but few people admit to it. It represents the view: *"It was a kangaroo court, but I'm glad we held it."* In discussion, ask people who land here if they would support a kangaroo court today if it produced a "good" result. This usually forces them to move toward Leaf B or Leaf F.

  **2. Indistinguishable Leaves**
  **Leaf E (Natural Law)** and **Leaf F (Pragmatist)** are flagged as difficult to pull apart.
  *   **Why:** Many participants will answer "Yes" to Q7 for *both* reasons. They believe the trials were morally right *and* practically useful.
  *   **The Split:** The tree forces a choice in Q7 ("Which matters *more*?"). However, in discussion, acknowledge that these two positions often overlap. The distinction is deontological (it was *right*) vs. consequentialist (it was *good*). If someone insists both are equally true, let them sit between the two leaves.

  **3. The "Uncle" Trap**
  Your uncle will likely land on **Leaf B**. The value of this tree for him isn't to change his mind, but to show him that **Leaf C (Legalist Middle)** exists. Many critics conflate "Crimes Against Peace" with "War Crimes." If he concedes that shooting POWs was a crime (Leaf C), he is no longer a total rejectionist; he is a legalist. That is a productive philosophical shift.

  **4. Question Design Logic**
  *   **Q1** filters out the "Power dictates Law" crowd immediately.
  *   **Q3** separates the "No Crime Without Law" crowd from the "Evil is Self-Evident" crowd.
  *   **Q4** prevents the "All or Nothing" fallacy, allowing for the Legalist Middle.
  *   **Q5** addresses the specific hypocrisy argument (Soviets/Allies) without asking "Is hypocrisy bad?"
  *   **Q6** isolates the Tokyo variance.
  *   **Q7** separates the Natural Law advocates from the Consequentialists.
