  **UNIVERSITY EXAMINATION PAPER**

  **Module:** Formal Epistemology and Epistemic Game Theory
  **Level:** Final Year Undergraduate
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer ONE question.

  **Question 1**

  Consider two agents, Alice and Bob. Both are perfectly Bayesian rational agents; their credences satisfy the probability axioms, and they update strictly by conditionalisation. It is common knowledge between them that Alice's posterior probability for an event $E$ is $0.8$, and Bob's posterior probability for $E$ is $0.2$. Despite this common knowledge of their differing posteriors, they maintain their respective probabilities and do not converge.

  Critically assess this scenario in light of Aumann's Agreement Theorem. Explain why this situation is logically compatible with the theorem despite the apparent disagreement. Identify precisely which assumption of the theorem fails in this case. Furthermore, discuss whether common knowledge of posteriors entails common knowledge of the agents' information partitions or evidence. Finally, evaluate what the theorem ultimately establishes about the possibility of rational disagreement among agents who possess different priors versus those who possess different information.

  ***

  **MODEL ANSWER**

  Aumann's Agreement Theorem is frequently summarised in popular discourse as the claim that 'rational agents cannot agree to disagree'. However, this gloss is misleadingly imprecise. The theorem formally states that if two agents share a common prior probability distribution, and if their posterior probabilities for a given event are common knowledge, then those posterior probabilities must be identical. To assess the scenario involving Alice and Bob, one must dissect the necessary conditions of the theorem rather than relying on the informal slogan regarding rationality.

  In the proposed scenario, Alice and Bob are defined as Bayesian rational agents who have common knowledge of each other's posteriors regarding event $E$. Yet, their posteriors differ ($0.8$ versus $0.2$). If Aumann's theorem were applicable here, this situation would be impossible. The fact that it is presented as a coherent scenario implies that the antecedent conditions of the theorem are not fully met. Since the prompt stipulates that the agents are rational (satisfying probability axioms and conditionalisation) and that there is common knowledge of the posteriors, the only remaining assumption that can fail is the Common Prior Assumption (CPA). Therefore, the scenario is compatible with Aumann's theorem precisely because Alice and Bob do not share a common prior. They began with different initial credence distributions over the state space.

  This highlights a crucial distinction often obscured in informal discussion: the theorem is not primarily a result about rationality in the expected-utility or coherence sense. Bayesian coherence ensures that an agent's beliefs are synchronically consistent and diachronically updated correctly relative to their evidence. However, coherence alone does not dictate what the initial credences must be. Two agents can be perfectly rational—never violating probability axioms nor updating rules—and yet permanently disagree if their starting points (priors) differ. Aumann's theorem shows that disagreement cannot persist *given* a common prior; it does not show that disagreement is irrational *simpliciter*. Consequently, the persistence of disagreement in the Alice and Bob scenario indicates a divergence in priors, not a failure of rationality.

  Furthermore, one must be careful not to conflate common knowledge of posteriors with common knowledge of evidence or information partitions. In standard partition models of knowledge, common knowledge of posteriors often arises because agents communicate within a structure where their information partitions are known. However, knowing *that* an agent holds a specific probability (the posterior) does not entail knowing *why* they hold it (their specific information cell or evidence). Alice knows Bob assigns $0.2$ to $E$, but she need not know which specific evidence led Bob to that conclusion, nor does she need to know how Bob partitions the state space. The theorem relies on the mathematical property that if posteriors are common knowledge, they are constant on the meet of the agents' information partitions. It does not require the agents to know each other's partitions themselves, only the resulting probabilities. Treating the knowledge of the probability value as equivalent to knowledge of the underlying evidence is a category error; the former is a value, the latter is a structural constraint on information.

  Ultimately, Aumann's theorem establishes a constraint on belief revision under specific structural conditions, rather than a universal ban on disagreement. It demonstrates that if agents start from the same probabilistic worldview (common prior), differences in information alone cannot sustain permanent disagreement once that information difference is common knowledge. However, if agents possess different priors, the theorem offers no force against disagreement. In such cases, agents can remain rational, acknowledge each other's beliefs, and still diverge. This suggests that the 'rationality' of disagreement hinges on the justification of priors. If priors are subjective and unconstrained, rational disagreement is endemic. If priors are objective or constrained by rationality principles (such as the Principle of Indifference), then disagreement becomes suspect. The theorem thus shifts the epistemological burden from the processing of information to the justification of initial credences.

  In conclusion, the scenario involving Alice and Bob violates neither Bayesian rationality nor Aumann's theorem, provided they lack a common prior. The theorem proves that common priors and common knowledge of posteriors necessitate agreement, but it leaves open the possibility of rational disagreement when priors differ. Recognising this distinction prevents the erroneous conclusion that all persistent disagreement implies irrationality.

  ***

  **MARKING SCHEME**

  **Total Marks: 20**

  **Grade Boundaries and Specific Moves**

  **First-Class (16–20 marks)**
  *   **Precise Identification of Assumptions:** Explicitly identifies that the Common Prior Assumption (CPA) is the failing condition in the scenario, distinguishing it clearly from the rationality/coherence conditions.
  *   **Nuanced Analysis of Rationality:** Articulates that Bayesian rationality (coherence + conditionalisation) is compatible with divergent priors, thereby explaining why 'rationality' alone does not force agreement.
  *   **Partition vs. Posterior Distinction:** Clearly explains that common knowledge of posterior values does not entail common knowledge of the information partitions or specific evidence leading to those values.
  *   **Epistemological Evaluation:** Provides a sophisticated assessment of what the theorem establishes (constraints on information processing given shared priors) versus what it does not (constraints on priors themselves), discussing the implications for the rationality of disagreement.

  **Upper-Second (13–15 marks)**
  *   **Correct Identification:** Identifies the lack of a common prior as the reason the scenario is compatible with the theorem.
  *   **Standard Explanation:** Explains that rationality involves updating correctly but allows for different starting points.
  *   **Basic Distinction:** Notes that knowing the probability is not the same as knowing the evidence, though may lack technical precision regarding partitions.
  *   **Adequate Evaluation:** Discusses the implication for disagreement but may rely more on the standard gloss of the theorem without fully critiquing the 'rationality' slogan.
  *   *Deficiency:* May lack the depth of epistemological evaluation regarding the justification of priors found in First-Class answers.

  **Lower-Second (10–12 marks)**
  *   **General Understanding:** Recognises Aumann's theorem concerns agreement but may be vague on the specific assumptions.
  *   **Partial Analysis:** Might suggest the agents are not truly rational or misunderstand the role of common knowledge.
  *   **Weak Evaluation:** Fails to clearly distinguish between prior differences and information differences.

  **Fail (0–9 marks)**
  *   **Fundamental Errors:** Claims the scenario violates the theorem outright, or fails to identify the Common Prior Assumption.
  *   **Misunderstanding:** Confuses common knowledge of posteriors with common knowledge of events.

  **Specific Error Penalties**

  **Error 1: The Rationality Misconception**
  *   **Description:** Reading the theorem as a result about rationality (expected-utility maximisation or coherence) rather than about common priors.
  *   **Why students make it:** Students often rely on the popular gloss 'rational agents cannot agree to disagree' without consulting the formal premises of the theorem.
  *   **Penalty:** Deduct **3 marks** from the total score.

  **Error 2: The Partition/Evidence Conflation**
  *   **Description:** Treating common knowledge of the posteriors as implying common knowledge of one another's evidence or information partitions.
  *   **Why students make it:** Students conflate the output of the information processing (the probability) with the structural mechanism of the information (the partition) in standard Kripke models.
  *   **Penalty:** Deduct **2 marks** from the total score.

  **Note on Penalties:** These penalties are cumulative. If a candidate commits both errors, they cannot achieve a First-Class grade regardless of other merits, as these errors indicate a fundamental misunderstanding of the formal epistemology involved. The maximum score for an answer committing Error 1 is capped at 15 marks. The maximum score for an answer committing Error 2 is capped at 17 marks.
