answer: |-
  # Question-Period Prep Sheet
  **Workshop:** Human Behavioral Biology
  **Thesis:** Adaptationism is methodologically sound *if* three conditions are met (Independent Regime, Risky Prediction, A Priori Rivals). Current EP fails on practice, not principle.
  **Audience:** Behavioral Ecologists (BE) + Sympathetic Philosophers (Gould-Lewontin leanings)

  ---

  ### Objection 1: The Category Error (Physiological vs. Psychological)
  **Who:** A Behavioral Ecologist (likely the first question, setting the stage).
  **Phrasing:** "Your existence proofs are lactase persistence and sickle-cell. Those are single-locus physiological traits with clear fitness proxies. Human psychology is polygenic, context-sensitive, and lacks direct fitness measures in the archaeological record. Isn't this a category error? You've proven adaptationism works for *hemoglobin*, not *mate preference*."
  **Damage Estimate:** **High.** If the analogy fails, your existence proofs are irrelevant to the field you are critiquing.
  **Concede:** You are right that psychological traits are messier than monogenic physiological traits.
  **Hold:** The *logical* requirements for testing adaptationism do not change based on trait complexity. If a hypothesis cannot meet these conditions for psychology, it is untestable, not true.
  **Reply:** "The logic of inference doesn't care about the substrate. Sickle-cell satisfies condition one because we can characterize malaria prevalence independently of the gene. If we claim a psychological trait is an adaptation to, say, cheater detection, we need an independent measure of ancestral cheating rates. If we can't get that, the hypothesis remains speculative. I'm arguing we need to find the psychological equivalents of the malaria data, not that they are equally easy to find."
  **Soft Spot:** You haven't shown that "ancestral cheating rates" *can* be measured independently. You're promising a methodology you haven't demonstrated for psychology.

  ### Objection 2: The Paleopsychology Problem (Independent Characterization)
  **Who:** One of the Philosophers (Their main ammunition).
  **Phrasing:** "Condition one requires characterizing the selective regime independently of the trait. For the EEA (Environment of Evolutionary Adaptedness), the only evidence we have *is* the trait itself and the archaeological record which is notoriously sparse. Aren't you demanding a historical record that doesn't exist? This makes your method principled but practically vacuous for deep-time psychology."
  **Damage Estimate:** **Very High.** This attacks the feasibility of your core condition.
  **Concede:** It is extremely difficult for deep-time traits.
  **Hold:** Difficulty does not justify circularity. Inferring the environment from the trait you're trying to explain is the definition of a just-so story.
  **Reply:** "It's not vacuous; it's a filter. If we can't characterize the regime independently, we shouldn't be making adaptationist claims. We can use comparative primate data, stable isotope analysis, or ethnographic records of foragers as *independent* proxies. They aren't perfect, but they break the circularity. If the data isn't there, the hypothesis should remain 'plausible story' not 'tested theory'."
  **Soft Spot:** Comparative primate data and ethnography are often used *to support* the adaptationist claim, risking the very circularity you're warning against. Distinguishing "independent proxy" from "post-hoc support" is messy.

  ### Objection 3: The "Moving the Goalposts" / Disciplinary Suicide
  **Who:** A Senior Behavioral Ecologist (Worried about field viability).
  **Phrasing:** "If we apply these three conditions strictly, 90% of current human behavioral ecology and EP gets thrown out. Are you arguing we should stop doing what we do? You're setting a bar that turns a research program into a philosophical exercise."
  **Damage Estimate:** **Medium.** They might feel you are being purist at the expense of progress.
  **Concede:** Yes, a lot of current literature would be reclassified as "hypothesis generation" rather than "testing."
  **Hold:** That reclassification is a feature, not a bug. It increases rigor.
  **Reply:** "I'm not saying stop. I'm saying distinguish. Generate hypotheses freely, but label them as such until they meet the conditions. Lactase persistence was once just a story; now it's a tested theory because it met these conditions. I want EP to grow up, not shut down."
  **Soft Spot:** If *nothing* in psychology can meet the bar, you are effectively arguing for shutting it down, even if you say you aren't.

  ### Objection 4: Plasticity as a "Rival" vs. Mechanism
  **Who:** A Behavioral Ecologist (Focus on Condition 3).
  **Phrasing:** "You require specifying non-adaptationist rivals like plasticity *in advance*. But plasticity is often the *mechanism* of the adaptation. An adaptive response to environment X *is* plasticity. How do you test adaptationism against plasticity when plasticity is the vehicle of the adaptation?"
  **Damage Estimate:** **Medium-High.** Confuses the null hypothesis with the mechanism.
  **Concede:** Adaptive plasticity is still adaptation.
  **Hold:** I am referring to *non-adaptive* plasticity (noise, developmental instability) or plasticity that explains the trait without a specific selected function (by-product of general learning).
  **Reply:** "Clarification: I mean we need to rule out that the behavior isn't just a general-purpose learning rule that produces the outcome incidentally. For example, is 'fear of snakes' a specific module, or a general 'fear of fast moving stimuli' plus cultural learning? We need to specify the general learning rule as the rival *before* we claim the specific module."
  **Soft Spot:** Distinguishing "general learning rule" from "specialized module" often relies on the same optimality models you are trying to test independently.

  ### Objection 5: The "Hope Nobody Asks" (The Empty Set Problem)
  **Who:** The Quiet Philosopher in the corner (Wait until the end).
  **Phrasing:** "You've given us two physiological existence proofs. Can you name *one* human psychological trait that currently satisfies all three of your conditions? If the answer is no, aren't you arguing that adaptationist psychology is possible in principle but impossible in practice? And if so, why keep the label?"
  **Damage Estimate:** **Critical.** If you say "No," your thesis becomes "EP is impossible." If you say "Yes," you will be attacked on the specifics.
  **Concede:** There are very few candidates.
  **Hold:** The field is young; physiology took centuries.
  **Reply:** "Candidate: Loss aversion in resource-scarce environments, tested against archaeological variance in resource stability. It's nascent. But even if the set is currently empty, the value is normative. It tells us what we *must* do to make progress. Physics had no successful models for centuries; the method guided them there."
  **Soft Spot:** This is your weakest point. Comparing EP to early physics is a gamble. If the audience thinks the constraints make the set *necessarily* empty (due to lack of historical data), the "normative value" argument sounds like consolation for a dead end.

  ---

  ### General Strategy Notes
  *   **Tone:** Do not be defensive. You are on their side (rigor), imposing discipline on a "cousin" field (EP) that they often view with suspicion. Align with the BEs against the "sloppy EP" practitioners.
  *   **The Philosophers:** Treat them as allies on the logic, but gently push back on the idea that "impossible to test perfectly" means "don't try."
  *   **Key Phrase to Use:** "I am not defending the *history* of EP, I am defending the *possibility* of a rigorous human behavioral biology."
  *   **Avoid:** Getting bogged down in specific EP examples (e.g., cheater detection) unless you are sure of the independent data. Stick to the methodological framework.
