          *   Or: "Show me a psychological trait that actually meets these criteria. If you can't, your existence proofs are irrelevant."

  4.  **Selecting and Ordering the Objections:**
      *   *Order 1 (The Immediate/Obvious):* The Physiological vs. Psychological gap. (Lactase/Sickle-cell aren't psychology). This will come up early.
      *   *Order 2 (The Methodological/Feasibility):* The "Independent Characterization" problem for the EEA (Environment of Evolutionary Adaptedness). Philosophers will hit this hard.
      *   *Order 3 (The Disciplinary/Practical):* Setting the bar too high. Behavioral ecologists might worry this kills their field too.
      *   *Order 4 (The Theoretical):* Plasticity as a rival. Is it really a rival or just a mechanism?
      *   *Order 5 (The "Hope Nobody Asks"):* The "Empty Set" problem. If no psych trait meets the criteria, is the theory vacuous?

  5.  **Drafting the Content (Iterative refinement):**

      *   *Objection 1 (The Analogy):* Focus on the mismatch between hemoglobin/lactase and "mate preference."
