      *   **Argument:** EP fails due to violating conditions, not adaptationism itself. Lactase persistence and sickle-cell are existence proofs.
      *   **Audience:** Mostly behavioral ecologists (optimality/game-theory folks) + two philosophers of biology (sympathetic to Gould-Lewontin spandrels critique).
      *   **Task:** Prepare a question-period prep sheet.
      *   **Format:** Objections in likely order, phrased as the audience would put them, damage estimate, concession/hold strategy, compact reply, note on soft spots. Include the "hope nobody asks" objection.

  2.  **Deconstruct the Audience & Thesis:**
      *   *Behavioral Ecologists:* They like models, optimization, and empirical rigor. They might worry the bar is set too high (making their work impossible) or too low (letting EP off the hook). They care about fitness measures and environmental variance.
      *   *Philosophers (Gould-Lewontin sympathetic):* They care about the logic of explanation, just-so stories, and the burden of proof. They will likely attack the feasibility of the "independent characterization" condition.
      *   *The Thesis:* It's a "reformist" position. It tries to save EP from its critics by imposing stricter methodological rules.
      *   *The Examples:* Lactase persistence and sickle-cell are *physiological/genetic* traits, not *behavioral/psychological* traits. This is a major vulnerability.

  3.  **Brainstorming Objections (categorized by source):**

      *   *From Philosophers:*
