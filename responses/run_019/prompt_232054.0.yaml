          *   "You're moving the goalposts. If EP has to meet these standards, it ceases to be EP."
          *   "Lactase/Sickle-cell are genetic/biochemical, not psychological. Category error."

      *   *From Behavioral Ecologists:*
          *   "These conditions are too strict. We can't always know the ancestral environment independently."
