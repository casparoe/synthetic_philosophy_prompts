answer: |-
  Yes, moral responsibility survives the absence of alternatives in the standby intervener scenario, and the established name for this philosophical puzzle is a **Frankfurt case**.

  Named after the philosopher Harry Frankfurt, who introduced it in 1969, this thought experiment is designed specifically to refute the **Principle of Alternative Possibilities (PAP)**, which claims that an agent is morally responsible only if they could have done otherwise. The core insight is that responsibility tracks the **actual sequence** of events that produced the action, not the **counterfactual sequence** of what might have happened had the agent tried to resist. In the monitoring scenario, the actual sequence consists entirely of the agent's own uncoerced deliberation and choice; the mechanism that would have removed alternatives remains causally inert. Because the constraint never actually touches the decision-making process, it cannot diminish the agent's ownership of the act.

  This differs fundamentally from ordinary duress or coercion. In standard coercion, the threat is part of the actual causal chain: the agent acts *because* of the pressure, meaning the external force explains the action. In a Frankfurt case, the external force explains nothing about why the action occurred; it is merely a safeguard that never activates. Consequently, the "I had no choice" defense fails in the monitoring scenario not because the agent technically had alternatives, but because the lack of alternatives was irrelevant to the production of the act. The excuse is only valid when the constraint is the actual cause of the behavior.

  It also differs from overdetermination, such as two people pushing a boulder. In overdetermination, both causes are **actualized**; both forces physically contribute to the outcome simultaneously. In the Frankfurt case, there is no redundancy in the actual world—only one cause (the agent's will) operates. The second cause (the monitor) exists only in nearby possible worlds where the agent hesitates. Since moral responsibility is grounded in what actually happened, the existence of a dormant backup mechanism does not dilute the agent's authorship.

  Therefore, the verdict is **yes**: moral responsibility survives even when alternatives are absent, provided the absence of those alternatives played no causal role in the action. The implication for everyday excuses is that "I had no choice" should be treated as a causal claim, not a metaphysical one. We should not ask whether alternatives literally existed; we should ask whether the lack of alternatives is what drove the decision. If the agent would have acted exactly the same way without the pressure, the pressure provides no exoneration.
