answer: |-
  # Q&A Prep Sheet: Department Colloquium

  **Thesis:** Influence is manipulative iff it reduces deliberative access to relevant considerations (attention, salience, retrieval).
  **Key Conclusions:** (1) Disclosed nudges can be manipulative. (2) Covert/emotional appeals can be non-manipulative.
  **Audience:** 20 philosophers (Majority Kantian, 2 Nudge-friendly Empiricists, 1 Action Theorist, 1 Senior Consequentialist).

  ---

  ### Objection 1: The "Transparency Restores Agency" Objection
  **Phrasing:** "You claim that disclosing a nudge—like telling diners the salad is at eye level—doesn't restore deliberative access. But if I tell you *how* I'm influencing you, haven't I handed you the very consideration you claim is missing? You're now deliberating *about* the nudge. Why isn't transparency sufficient to convert a causal push back into a reason-based engagement?"
  *   **Who:** One of the Empirically Minded Ethicists (Nudge-friendly).
  *   **Likelihood:** Very High (First question).
  *   **Damage:** High. If disclosure restores access, Conclusion 1 collapses.
  *   **Concede:** Concede that disclosure is *normatively preferable* to secrecy; it shows respect.
  *   **Hold:** Hold that disclosure does not *causally* restore the cognitive access required for non-manipulative influence. Knowing the magician's trick doesn't stop your eyes from being fooled.
  *   **Reply (2 mins):** "Transparency gives you a *new* reason ('they want me to pick salad'), but it doesn't restore access to the *original* considerations that were sidelined (e.g., the comparative taste or nutritional nuance you would have weighed if the salad weren't salient). The nudge works by hijacking System 1 processing. Even if System 2 knows about it, System 1 is still driving the bus. My account distinguishes between *knowing* you are being influenced and having *deliberative access* to the reasons bearing on the choice itself. Disclosure makes the influence consensual, perhaps, but it doesn't stop it from being manipulative in mechanism."
  *   **Pressure Point:** **Step 1 (Paired Cases).** This challenges the intuition that disclosure separates manipulation from non-manipulation.

  ### Objection 2: The "Emotional Bypass" Objection
  **Phrasing:** "You suggest some emotionally charged appeals aren't manipulative because reasons remain intact. But Kantians worry that emotion *is* the bypass. If I make you feel guilty to get you to donate, haven't I substituted a feeling for a reason? How can an appeal to emotion ever leave the 'grip on reasons' intact?"
  *   **Who:** The Kantian Moral Philosophers (Majority).
  *   **Likelihood:** High.
  *   **Damage:** Medium. Threatens Conclusion 2.
  *   **Concede:** Concede that *many* emotional appeals are manipulative because they overwhelm deliberation.
  *   **Hold:** Hold that emotion can *highlight* reasons rather than replace them (e.g., vivid imagery making a distant risk salient).
  *   **Reply (2 mins):** "Emotion isn't always a fog; sometimes it's a spotlight. If I show you a graphic image of a car crash to make the risk of speeding salient, I'm engaging your emotion, but I'm not hiding the reason ('speeding is dangerous'). I'm making that reason psychologically available to you. Manipulation occurs when the emotion *displaces* the reason (e.g., 'donate or I'll be sad'), not when it *amplifies* the reason ('donate because children are suffering'). My account allows us to distinguish between emotional coercion and emotional illumination."
  *   **Pressure Point:** **Step 2 (Diagnosis of Wrong).** Challenges the "Obstacle vs. Reasoner" distinction when emotions are involved.

  ### Objection 3: The "Access Metric" Objection
  **Phrasing:** "You rely heavily on 'deliberative access.' But as an action theorist, I'm worried this is a black box. If the agent acts, they clearly accessed *something*. How do you measure 'access' independently of the outcome? Are you positing a counterfactual ideal agent? If so, isn't this just a 'reasonable person' standard in disguise?"
  *   **Who:** The Philosopher of Action (Attention/Akrasia).
  *   **Likelihood:** Medium-High.
  *   **Damage:** Medium. Threatens the theoretical coherence of the definition.
  *   **Concede:** Concede that "access" is gradational, not binary.
  *   **Hold:** Hold that it is empirically tractable via behavioral science (e.g., retrieval failure rates), not just philosophical intuition.
  *   **Reply (2 mins):** "It's not a counterfactual ideal; it's a cognitive capacity claim. We know from empirical literature that certain frames predictably inhibit retrieval of information even when that information is available in the environment. 'Access' means the consideration is available for *active weighing* in the practical syllogism. If the architecture makes the retrieval cost prohibitively high, access is reduced. We can measure this through error rates and response times, not just by asking what a 'reasonable person' would do."
  *   **Pressure Point:** **Step 1 & 2.** Challenges the operationalizability of the core definition.

  ### Objection 4: The "So What?" Objection
  **Phrasing:** "Let's grant your definition. You admit some manipulative nudges are welfare-improving and disclosed. You admit some non-manipulative appeals are covert. If the downstream normative judgment (permissibility) stays the same, what work is the label 'manipulative' doing? Does it earn its keep, or is it just a descriptive badge with no moral bite?"
  *   **Who:** The Senior Consequentialist.
  *   **Likelihood:** High (Usually saves this for the end).
  *   **Damage:** High. Threatens the motivation for the project (Step 3).
  *   **Concede:** Concede that manipulation is not *all-things-considered* wrong in every case.
  *   **Hold:** Hold that manipulation is *pro tanto* wrong because it degrades agency, which has long-term consequentialist value (trust, skill atrophy).
  *   **Reply (2 mins):** "It earns its keep by separating the *mechanism* from the *outcome*. If we conflate manipulation with 'bad outcomes,' we can't explain why a welfare-improving nudge still feels ethically fraught. The label matters because it flags a cost to agency. Even if the nudge is permissible overall, we should seek non-manipulative alternatives if possible. My account explains why we feel a 'residue' of wrongness even in benevolent nudges: we are being steered as obstacles, not engaged as reasoners. That distinction guides policy design toward more robust forms of agency."
  *   **Pressure Point:** **Step 3 (Manipulation vs. Paternalism).** Challenges the normative utility of the distinction.

  ---

  ### The Dangerous Question
  **Question:** "If disclosure doesn't restore deliberative access because the cognitive bias is too strong, in what sense is the agent still a 'reasoner'? If the influence works *despite* their knowledge, haven't you effectively described a form of compulsion or incapacity? By calling it 'manipulation,' aren't you overstating the agent's capacity to resist, thereby undermining the very agency you claim to protect?"

  **Why it is dangerous:**
  This question comes from the intersection of the **Action Theorist** and the **Kantians**. It attacks the coherence of **Step 2 (Diagnosis)**.
  *   **The Trap:** If you say the agent *can* resist, the Empiricists will say "Then disclosure works!" If you say the agent *cannot* resist, the Kantians will say "Then they aren't responsible reasoners, and manipulation is the wrong category (it's coercion/exploitation of incapacity)."
  *   **The Risk:** It suggests your "deliberative access" metric is incoherent: either the access exists (so it's not manipulative) or it doesn't (so the agent isn't a full reasoner). It threatens to collapse your middle ground.
  *   **Preparation:** You must walk the line that the capacity exists *in principle* (preserving agency) but is systematically degraded *in practice* (preserving the manipulation claim) without sliding into saying the agent is incapacitated. Emphasize that manipulation *targets* capacity, whereas compulsion *bypasses* it.
