      *Let's stick to the prompt's specific audience constraints.* The Consequentialist is senior. They usually ask the "earn its keep" question. But the *most* dangerous one might come from the Action Theorist regarding the definition of "access."
      Let's go with the Consequentialist's "earn its keep" but sharpened: "If the outcome is better and the agent consents (via disclosure), what work is the label 'manipulative' doing other than signaling your distaste?" This forces a justification of the normative weight.

