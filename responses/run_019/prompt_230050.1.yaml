answer: |-
  Your intuition is correct: the principle of "invention fills gaps, contradiction violates record" is necessary but insufficient. It fails because it treats all facts as having equal weight and ignores the moral status of the subject's legacy and autonomy. It cannot distinguish between inventing a lunch menu (trivial) and inventing a moral repudiation (foundational), nor does it account for the rights of the dead over their private interiority.

  To resolve your cases, particularly the split between the two abolitionist drafts and the unease over the painter, you need a principle that weighs **Centrality**, **Epistemic Honesty**, and **Autonomy**.

  Here is the strongest candidate principle, followed by an analysis of its costs and predictions.

  ### The Principle of Narrative Fidelity and Posthumous Autonomy

  **Clause 1 (The Epistemic Boundary):** Fictionalized depictions must not present invented details as evidentiary facts, nor contradict established physical evidence, regardless of genre labeling.
  *   **Motivation:** This addresses the **Politician Biopic** (burning the letter) and the **General's Last Words**. Even in a "docudrama," presenting a specific, falsifiable physical act (burning a letter) or specific recorded data (last words) as true when evidence proves otherwise constitutes a lie about the historical record. It corrupts the audience's knowledge base.
  *   **Prediction:** A film showing a historical figure receiving a telegram they never received is "Not Fine," even if the telegram's *content* summarizes their feelings accurately. A film showing them *thinking* about a telegram they never received is "Fine."

  **Clause 2 (The Integrity Boundary):** Invention may not invert or undermine the subject's core public moral identity or legacy without substantial historical evidence suggesting that identity is false, even if the work is explicitly labeled fiction.
  *   **Motivation:** This addresses the **Abolitionist Draft 1** (Repudiation) and the **Memoirist** (Fabricated Hardship). These are "Not Fine" not because they contradict a specific date or name, but because they attack the *meaning* of the life. An abolitionist is defined by abolition; a survivor is defined by their hardship. To invent a repudiation or a confession of lying is to defame the dead by stripping them of their moral standing without warrant.
  *   **Prediction:** A biopic about a pacifist that invents a secret violent past is "Not Fine" without evidence. A biopic about a pacifist that invents a secret struggle *to remain* pacifist is "Fine."
  *   **The Abolitionist Distinction:** This clause draws the line between your two drafts. Draft 1 (Repudiation) inverts the core identity (Abolitionist → Hypocrite). Draft 2 (Restatement) clarifies the core identity (Abolitionist → Clear Abolitionist). Draft 2 is an act of interpretation; Draft 1 is an act of erasure.

  **Clause 3 (The Autonomy Boundary):** Private materials withheld by the subject's explicit directive (e.g., "burn my journals") may not be used as source material, even if released by the estate and even if the depiction is accurate.
  *   **Motivation:** This addresses the **Painter's Journals**. The estate has legal title, but the dead retain a moral right to confidentiality regarding materials they explicitly sought to destroy. Using them treats the subject as a means to an end (art/truth) rather than an end in themselves.
  *   **Prediction:** If a writer leaves instructions that their unfinished manuscript be destroyed, and their heir publishes it for a filmmaker to adapt, the adaptation is "Not Fine," regardless of its quality or accuracy.

  ---

  ### Which of Your Verdicts Cannot Be Accommodated?

  A principle is only useful if it forces hard choices. Here is where this principle challenges your current intuitions:

  **1. The Poet's Affair (Your Verdict: Fine)**
  *   **The Conflict:** You state the poet's surviving letters are "conspicuously cool" about the man, yet the novel invents a "long affair."
  *   **The Principle's Judgment:** This is borderline **Not Fine** under Clause 2. While an affair is not a political stance, a "long affair" implies emotional intimacy. If the documentary record (letters) is "conspicuously cool," inventing deep intimacy contradicts the *emotional record* of the subject's interior life.
  *   **The Cost:** To keep this verdict "Fine," you must argue that romantic entanglements are peripheral to a poet's *core public identity* (unlike the abolitionist's politics). If the poet was publicly known for celibacy or specific views on love, the principle demands you overturn your verdict. If her love life is considered trivia relative to her work, the principle allows it. You must decide if "cool letters" constitute a fixed record of emotional truth or just a gap.

  **2. The Painter's Journals (Your Verdict: Ambivalent)**
  *   **The Conflict:** You feel a violation but acknowledge the accuracy and estate permission.
  *   **The Principle's Judgment:** This is definitively **Not Fine** under Clause 3.
  *   **The Cost:** The principle resolves your ambivalence by prioritizing the dead subject's autonomy over the estate's legal rights or the artist's desire for accuracy. It commits you to a strong view of **posthumous privacy**: that we owe the dead respect for their explicit wishes regarding their private interiority, even when those wishes conflict with public historical interest. If you accept this principle, you must stop going back and forth and accept that using the journals is a violation.

  **3. The TV Series Conversation (Your Verdict: Fine)**
  *   **The Conflict:** Invented private conversation before death.
  *   **The Principle's Judgment:** **Fine**, provided it adheres to Clause 2.
  *   **The Nuance:** This is permitted because it fills a gap (no record exists) and is "consistent with known characters." However, if that conversation attributed a motive to the dying person that contradicted their known life's work (e.g., the dying abolitionist says, "I regret it all"), it would violate Clause 2. Your verdict holds, but only conditionally.

  ### Addressing Your Specific Questions

  **Can the line between the two drafts of the imagined journal be made principled?**
  Yes. The line is **Centrality to Legacy**.
  *   **Draft 1 (Repudiation):** The journal entry functions as a *counter-narrative* to the subject's public life. It suggests their life's work was a lie. This requires evidentiary warrant. Without it, it is character assassination disguised as speculation.
  *   **Draft 2 (Restatement):** The journal entry functions as *exegesis*. It illuminates the existing narrative without changing its moral vector. It treats the subject as the author of their own meaning, merely providing the words they didn't write down.
  *   **Principle:** You may invent the *voice* of the dead, but you may not invent a *change of heart* that negates their historical contribution.

  **Does the unease about the burned journals commit you to something stronger about posthumous privacy?**
  Yes. It commits you to the view that **consent is not transferable upon death regarding intimate materials.**
  Your other verdicts (Biopic, General, Abolitionist) rely on *truth conditions* (don't lie about facts, don't lie about character). The Painter case relies on a *rights condition* (don't violate autonomy).
  If you decide the Painter film is "Not Fine," you are asserting that the dead possess a right to **oblivion** or **confidentiality** that survives them. This is stronger than your other verdicts because it restricts the living even when they are telling the *truth*. In the Biopic case, you forbid lies. In the Painter case, you would be forbidding truth-telling that violates consent.
  If you cannot accept that restriction (i.e., if you decide the Painter film is actually "Fine" because the truth is out), then you must abandon Clause 3. But if you do that, you lose the theoretical ground for your unease. You cannot have the unease without accepting that the dead have a claim on us that overrides the living's access to information.

  ### Summary of Predictions for Unlisted Cases

  1.  **Composite Characters:** A film about a civil rights movement combines three real activists into one character to simplify the plot.
      *   *Prediction:* **Not Fine** if the combination attributes actions or moral failures to the composite that specific individuals did not commit (violates Clause 1 & 2). **Fine** if the composite is clearly a proxy for a "type" and does not claim to be a specific historical person.
  2.  **Living Relatives:** A novel depicts a dead father's abuse based on the adult child's testimony, but no other evidence exists.
      *   *Prediction:* **Fine.** The principle protects the *dead subject's* legacy and autonomy, not the reputation of the family. However, if the child is also a public figure, Clause 1 applies to their testimony.
  3.  **Satire:** A satirical sketch shows a dead president engaging in absurd, out-of-character behavior.
      *   *Prediction:* **Fine.** Satire operates under a different contract where inversion is the genre convention, not a claim to historical plausibility. The "labeled fiction" defense works here because the genre signals the inversion is not a claim to truth.

  ### Final Verdict on Your Dilemma

  Your current principle is underdeveloped because it focuses on *facts* rather than *meaning*. The strongest principle requires you to:
  1.  Accept that some fictions are defamatory even if labeled fiction (Abolitionist Draft 1).
  2.  Accept that some truths are violations if consent was withheld (Painter).
  3.  Re-evaluate the Poet: If the "cool letters" are the only record of her interiority, inventing a "long affair" is ethically riskier than you currently admit. It privileges the novelist's drama over the poet's documented emotional reality.

  If you adopt this framework, you gain clarity on the Abolitionist and the Painter, but you lose the absolute comfort of the Poet case. That is the price of a coherent ethics of bio-fiction: it restricts the imagination where it trespasses on the dead's moral or private sovereignty.
