answer: |-
  # SEMINAR HANDOUT: MAPPING THE FRANCHISE
  **Course:** Political Philosophy 305 | **Topic:** Democratic Accountability and the Vote

  ### Instructions
  This decision tree begins from the shared premise that a democratic government must be accountable to "the people." It does not presuppose any specific theorist. Answer each question based on your own intuitive judgment of the case provided. Follow the branches to find your corresponding position on who may vote and whether they must.

  ***

  ### THE DECISION TREE

  **Node 1: The Boundary of Accountability**
  Does the government's duty of accountability extend only to those with formal legal membership, or to all persons subject to its coercive laws?
  *   **Case:** Consider a non-citizen who has resided in the country legally for a decade, pays taxes, and is subject to criminal prosecution.
  *   **[A] Only Formal Members:** Go to Node 2.
  *   **[B] All Subjected Persons:** Go to Node 2 (Resident Track).

  **Node 2: The Criterion of Competence**
  Is the capacity to vote presumed for all members of the demos, or must it be demonstrated by political knowledge?
  *   **[A] Presumed by Status:** Go to Node 3.
  *   **[B] Demonstrated by Knowledge:** Go to **Leaf 5 (Epistocracy)**.

  **Node 3: The Proxy for Capacity**
  If capacity is presumed, is the threshold defined by chronological age or by economic stakeholding?
  *   **Case:** Consider a seventeen-year-old who pays income tax but cannot yet vote.
  *   **[A] Chronological Age:** Go to Node 4.
  *   **[B] Economic Stakeholding:** Go to **Leaf 4 (Lowered Voting Age)** or **Leaf 8 (Stakeholder Resident)**.

  **Node 4: The Nature of the Ballot**
  Is casting a ballot primarily an individual liberty to be exercised at will, or a public function analogous to jury service?
  *   **Case:** Consider the legal obligation to appear for jury duty when summoned.
  *   **[A] Individual Liberty:** Go to **Leaf 1 (Liberal Status Quo)** or **Leaf 3 (Residence-Based)**.
  *   **[B] Public Function:** Go to Node 5.

  **Node 5: The Enforcement of Function**
  If voting is a public function, must all enfranchised persons perform it under legal sanction?
  *   **[A] Yes, Universal Sanction:** Go to **Leaf 2 (Compulsory Voting)** or **Leaf 6 (Mandatory Non-Citizen)**.
  *   **[B] No, Normative Only:** Go to **Leaf 7 (Civic Republicanism)**.

  ***

  ### THE POSITIONS (LEAVES)

  **Leaf 1: The Liberal Status Quo**
  *(Citizens + Presumed Capacity + Age Proxy + Liberty)*
  This is the standard model in most Anglophone democracies, restricting the vote to adult citizens without mandating participation.
  *   **Most Awkward Commitment:** It must accept that some competent adults are permanently excluded from accountability mechanisms solely due to birthplace.

  **Leaf 2: Compulsory Voting (Jury-Duty Model)**
  *(Citizens + Presumed Capacity + Age Proxy + Function + Sanction)*
  This position treats voting as a civic obligation enforceable by fines, similar to appearing for jury selection.
  *   **Most Awkward Commitment:** It must punish political disengagement as a crime akin to tax evasion, potentially forcing uninformed ballots.

  **Leaf 3: Residence-Based Enfranchisement**
  *(Residents + Presumed Capacity + Age Proxy + Liberty)*
  This view extends the franchise to all long-term residents regardless of citizenship status, but keeps voting voluntary.
  *   **Most Awkward Commitment:** It grants political power to determine the state's future to those who may leave the jurisdiction shortly.

  **Leaf 4: Lowered Voting Age**
  *(Citizens + Presumed Capacity + Stake Proxy + Liberty)*
  This position lowers the voting age (e.g., to 16) on the ground that age is only a proxy for competence and stakeholding.
  *   **Most Awkward Commitment:** It risks enfranchising voters who are legally dependent on the very authorities they are asked to judge.

  **Leaf 5: Epistocracy**
  *(Citizens + Demonstrated Capacity + Liberty)*
  This position restricts the franchise to those who can demonstrate specific political knowledge or competence.
  *   **Most Awkward Commitment:** It requires a neutral arbiter to decide what counts as political knowledge without bias toward the ruling class.

  **Leaf 6: Mandatory Voting for Non-Citizen Residents**
  *(Residents + Presumed Capacity + Age Proxy + Function + Sanction)*
  This logically available combination requires all subject persons to vote under sanction, regardless of citizenship.
  *   **Diagnosis:** This position is **merely unattractive**; it is logically coherent but creates a reciprocity deficit by coercing participation from those denied the right to hold office.
  *   **Most Awkward Commitment:** It coerces political participation from those denied full membership rights like holding office.

  **Leaf 7: Civic Republicanism**
  *(Citizens + Presumed Capacity + Age Proxy + Function + No Sanction)*
  This position views voting as a moral duty essential to freedom, but rejects legal penalties for non-voting.
  *   **Most Awkward Commitment:** It demands civic virtue without providing the teeth to ensure it, relying on social shame alone.

  **Leaf 8: Stakeholder Resident**
  *(Residents + Presumed Capacity + Stake Proxy + Liberty)*
  This position allows non-citizens to vote if they pay taxes or have long-term residence, treating stakeholding as the key to enfranchisement.
  *   **Most Awkward Commitment:** It equates tax liability with political voice, potentially excluding the poor who contribute labor but pay no income tax.

  ***

  ### NOTE ON SEPARATION
  **Flagged Pair:** The tree cannot genuinely separate **Leaf 1 (Liberal Status Quo)** and **Leaf 7 (Civic Republicanism)** in practice. While logically distinct on the "Nature of the Ballot" branch (Liberty vs. Function), a normative duty without legal sanction results in the exact same behavioral outcome as a voluntary right, making the distinction purely theoretical in terms of enforcement.
