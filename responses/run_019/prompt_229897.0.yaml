          *   Relevance: Friend probably doesn't mean this literally, but might assume digital computers can capture it.

  4.  **Connecting to the Friend's Argument:**
      *   The friend says: "Brain = Computer" $\rightarrow$ "Simulation = Same Mind."
      *   For this to work, they need *Substrate Neutrality* AND *Simulation = Duplication*.
      *   The "Brain = Computer" slogan usually conflates Claim 1 (obvious) with Claim 4 (controversial).
