      *   *Layer 1: Metaphorical/Weak.* Brains process information. (Trivial)
      *   *Layer 2: Computational Theory of Mind (CTM).* Cognition is computation over representations. (Substantive/Contested)
      *   *Layer 3: Substrate Independence/Functionalism.* Mental states are defined by causal roles, not physical stuff. (Contested/Philosophical)
      *   *Layer 4: Strong AI/Strong Computationalism.* Simulation = Duplication. (Radical/Contested)
      *   *Layer 5: Literal Architecture.* The brain has code, CPU, memory, etc. (Likely False)

  3.  **Drafting the Claims (Iterative Process):**

      *   *Claim 1: Information Processing.* Brains take inputs, transform them, produce outputs.
          *   Status: Platitude.
          *   Relevance to Uploading: None. A thermostat processes info but isn't a mind.

      *   *Claim 2: Computational Theory of Mind (CTM).* Thinking is manipulating symbols/representations according to rules.
          *   Status: Genuinely Contested (connectionists, embodied cognition critics).
          *   Relevance: Necessary but not sufficient.

      *   *Claim 3: Substrate Neutrality (Multiple Realizability).* The specific material doesn't matter, only the causal structure.
          *   Status: Genuinely Contested (biological naturalists like Searle disagree).
