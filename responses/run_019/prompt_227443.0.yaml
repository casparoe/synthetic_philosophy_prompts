prompt: |-
  so i've been reading about judgment aggregation and the discursive dilemma and every paper i open proposes its own pet aggregation rule and then defends it with one handpicked example. before i read another one i want the spec first: what does a rule for merging individual judgments into a collective judgment actually have to do to count as adequate?

  setup so we're on the same page: three judges, agenda is p, q, and (p and q). judge 1 accepts all three, judge 2 accepts p but not q (so rejects the conjunction), judge 3 accepts q but not p (so rejects the conjunction). majority vote on each issue separately gives you: accept p, accept q, reject (p and q) -- an inconsistent collective judgment set. the premise-based procedure (vote on p and q, let logic decide the conjunction) and the conclusion-based procedure (vote on the conjunction directly) give different collective judgments on the same profile. that's the problem any rule has to face.

  so write me the desiderata list. things like: the output always has to be consistent and deductively closed (collective rationality), the rule has to work for any profile of complete consistent individual judgments (universal domain), it shouldn't matter which voter cast which ballot (anonymity), it shouldn't play favorites between logically symmetric issues (neutrality), the verdict on each issue should depend only on individual verdicts on that issue (independence), adding support shouldn't flip an accepted issue to rejected (monotonicity). feel free to add ones i missed or reframe these. for each desideratum: the case or profile that motivates it, i.e. what goes wrong if you drop it. and i want your judgment calls on three things:

  1. which of these are genuine desiderata any rule owes us vs which are just the prejudice of a particular camp (e.g. is full universal domain actually reasonable, or is it fine to only promise consistency on "easy" agendas?)
  2. which subset is jointly unsatisfiable -- the List-Pettit style impossibility results basically say you cant have all of them at once on rich enough agendas, and i want the list to say exactly which combination breaks and why, since that's the interesting part
  3. which single desideratum knocks out the most rules people actually propose (my money is on independence, but argue it)

  then, briefly, score the obvious contenders against the list: premise-based, conclusion-based, quota/threshold rules, and distance-based rules (pick the consistent judgment set that minimizes total distance from the profile). keep the scoring short -- the criteria are the deliverable, the scorecard is just so i can see the list doing work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Judgment Aggregation (JA), specifically the Discursive Dilemma.
      *   **User's Goal:** Wants a "spec" (list of desiderata) before reading more papers proposing specific rules. Tired of "pet rule + one example" papers.
      *   **Setup:** Standard 3-judge, $p, q, p \land q$ example provided.
      *   **Deliverables:**
          1.  A refined list of desiderata (with motivations/counterexamples for dropping them).
          2.  Judgment calls on:
          *   Genuine vs. Camp Prejudice (e.g., Universal Domain).
          *   Joint Unsatisfiability (Impossibility Theorems).
          *   The "Killer" Desideratum (which one kills the most rules).
          3.  A brief scorecard of major contenders (Premise-based, Conclusion-based, Quota, Distance-based).
      *   **Tone:** Analytical, precise, slightly critical (matching the user's skepticism of the literature), expert-level but accessible.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *User's List:* Collective Rationality (Consistency + Closure), Universal Domain, Anonymity, Neutrality, Independence (Systematicity), Monotonicity.
      *   *Refinement:* Need to be precise about definitions. "Independence" in JA is often called "Independence of Irrelevant Alternatives" (IIA) or just "Independence." "Neutrality" often implies permutation of propositions. "Systematicity" combines Independence and Neutrality.
      *   *Motivations:* Why do we want these?
          *   Rationality: The group acts as an agent.
          *   Universal Domain: Democracy shouldn't exclude opinions *a priori*.
          *   Anonymity: One person, one vote.
          *   Neutrality/Independence: Fairness across issues.
          *   Monotonicity: More support shouldn't hurt.
          *   *Missing:* Unanimity Preservation (Pareto). If everyone agrees, the group should agree. This is crucial.

  3.  **Address Judgment Call 1: Genuine vs. Prejudice:**
      *   *Universal Domain:* Is it reasonable? In politics, yes. In expert panels, maybe not. But for a *general* theory, it's standard. However, restricting the *agenda* (logical connections) is often more fruitful than restricting the *domain* (profiles).
      *   *Deductive Closure:* Do we really need the group to believe *all* logical consequences? Sometimes we just need consistency on the agenda. "Completeness" on the agenda is usually required, but full closure might be too strong for bounded rationality. Let's stick to "Consistency and Completeness on the Agenda."
      *   *Independence:* This is the big one. It forces issue-by-issue voting. Is it genuine? It prevents strategic manipulation across issues, but it causes the dilemma.

  4.  **Address Judgment Call 2: Joint Unsatisfiability (The Impossibility):**
      *   List-Pettit (2002) is the core reference.
      *   The core conflict: Universal Domain + Collective Rationality + Anonymity/Neutrality (or just Independence) + Unanimity.
      *   Actually, the strongest result is: Universal Domain + Collective Rationality + Independence + Unanimity Preservation $\rightarrow$ Dictatorship (or oligarchy).
      *   Wait, List-Pettit shows that on non-trivial agendas, you can't have Universal Domain, Collective Rationality, Independence, and Unanimity Preservation without ending up with a dictatorship (or at least, no non-dictatorial rule exists).
      *   Need to specify *which* combination breaks. It's usually Independence + Rationality + Universal Domain + Unanimity.

  5.  **Address Judgment Call 3: The "Killer" Desideratum:**
      *   User suspects Independence.
      *   Argument: Independence forces the discursive dilemma. If you drop Independence, you can use Premise-based or Distance-based rules which look at the whole package.
      *   Counter-argument: Unanimity is also strong. But Independence is the structural constraint that makes JA distinct from standard social choice.
      *   Verdict: Independence (or Systematicity) is the primary bottleneck for "democratic" aggregation.

  6.  **Drafting the Scorecard:**
      *   *Premise-based:* Passes Rationality, Domain, Anonymity. Fails Independence (conjunction depends on premises). Fails Neutrality (treats premises differently from conclusions).
      *   *Conclusion-based:* Passes Rationality, Domain, Anonymity. Fails Independence (premises might be ignored). Fails Unanimity (if everyone agrees on $p$, but majority rejects $p \land q$, conclusion rule might reject $p$ implicitly? No, Conclusion rule usually just votes on conclusion. Wait, standard Conclusion-based rule: Vote on $p \land q$. If accepted, accept $p$ and $q$? Or just leave them undefined? Usually, it implies accepting the logical consequences. If majority rejects $p \land q$, but accepts $p$ and $q$ individually, Conclusion rule rejects $p \land q$. This preserves consistency but violates Unanimity on premises if everyone accepted $p$).
      *   *Quota Rules:* Generally fail Rationality (unless quota is extreme).
      *   *Distance-based (Kemeny-like):* Passes Rationality, Domain, Anonymity, Unanimity. Fails Independence. Computationally hard.

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the frustration (it's a valid critique of the field).
      *   **The Spec (Desiderata):** Define clearly, add motivation (what breaks if removed).
      *   **The Judgment Calls:**
          1.  Real vs. Prejudice.
          2.  The Impossibility Core.
          3.  The Killer Constraint.
      *   **The Scorecard:** Table or bullet points.

  8.  **Self-Correction/Nuance Check:**
      *   *Closure:* Full deductive closure is often too strong. "Completeness on the Agenda" + "Consistency" is the standard "Collective Rationality." I should clarify this distinction.
      *   *Independence:* Distinguish between "Independence" (decision on $\phi$ depends only on votes on $\phi$) and "Systematicity" (same function for all $\phi$). List-Pettit uses Independence + Neutrality often, or just Systematicity. I will group them for clarity but distinguish where needed.
      *   *Unanimity:* Crucial. If everyone says Yes, Group says Yes. Often overlooked in casual summaries but central to impossibility theorems.
      *   *Dictatorship:* The impossibility theorem usually concludes "The only rules satisfying X are dictatorial." I need to make sure the user understands that "breaking" the desiderata means avoiding dictatorship.

  9.  **Final Polish:** Ensure the tone is sharp. The user is tired of fluff; give them the technical meat without the prose padding. (e.g., "Here is the spec," "Here is the break point.")

  *(Self-Correction during drafting)*: Wait, regarding Conclusion-based procedure. If the agenda is $\{p, q, p \land q\}$, and we vote only on $p \land q$. If accepted, we derive $p, q$. If rejected, do we derive $\neg p \lor \neg q$? We can't derive specific truth values for $p$ or $q$. So Conclusion-based rules often result in *incomplete* judgment sets on the premises unless specified otherwise. I need to note that standard Conclusion-based rules often violate Completeness on the agenda unless they force a stance on premises based on the conclusion's negation (which is ambiguous). I will treat the standard "Conclusion-based" as: Vote on conclusion, derive premises if possible, otherwise leave undefined or vote on premises separately (which leads back to the dilemma). Actually, the standard definition in JA literature for Conclusion-based is: Decide the conclusion by majority, then accept premises *only if* consistent with the conclusion. This often leads to incompleteness. I will score it honestly on Completeness.

  *Revised plan for Scorecard:*
  *   Premise-based: Consistent, Complete. Fails Independence/Neutrality.
  *   Conclusion-based: Consistent. Often fails Completeness (on premises). Fails Independence.
  *   Distance-based: Consistent, Complete. Fails Independence.
  *   Majority: Fails Consistency.

