  Right, no hedging. You want a number, you've got one.

  **My Credence: 0.40**

  I think the Williams-style internalist claim is more likely false than true, though it's not rubbish. It captures something vital about agency, but it fails as a complete account of normativity. You're at 0.8, your mate's at 0.25; I'm sitting closer to her, but I concede more ground to you than she does.

  Here is the decomposition of that 0.40. I've broken the thesis down into three necessary pillars. For the overall claim to hold water, these three need to be robust. I've assigned a 'weight' to each based on how crucial it is to the theory's survival, and a 'probability' representing how likely I think it is that the Internalist gets it right on that specific point.

  ### The Decomposition

  **1. The Motivation Constraint (Weight: 30%)**
  *   **The Question:** Is there a necessary conceptual link between having a reason and being capable of being motivated by it?
  *   **Internalist Requirement:** Yes. If it can't motivate, it's not a reason *for you*.
  *   **My Probability (that Internalism is right here):** 0.70
  *   **Rationale:** This is Internalism's strong suit. It feels bizarre to say someone has a reason to do something if that reason could never, even in ideal conditions, move them to act. It preserves the action-guiding nature of reasons. However, Externalists (like Parfit) make a decent go of arguing that reasons are about facts, not psychological states. I give the Internalist the benefit of the doubt here, but not a certainty.

  **2. The Coherence of 'Sound Deliberation' (Weight: 50%)**
  *   **The Question:** Can we define 'sound deliberation' purely procedurally without secretly smuggling in objective values?
  *   **Internalist Requirement:** Yes. The route from the Subjective Motivational Set (SMS) to the action must be rational without presupposing an objective 'good'.
  *   **My Probability (that Internalism is right here):** 0.20
  *   **Rationale:** This is the killer. Williams wants a procedural account of rationality. But when you press him on what counts as 'sound', it looks like you need substantive norms (e.g., 'don't contradict yourself', 'attend to relevant facts'). Parfit and others argue these norms are objective, not derived from the SMS. If 'sound deliberation' relies on objective norms, the Internalist claim collapses because the reason's force comes from the norm, not the SMS. I reckon Internalism mostly fails here.

  **3. Extensional Adequacy (The Edge Cases) (Weight: 20%)**
  *   **The Question:** Can the SMS stretch far enough to cover the amoralist or the severely depressed without becoming trivial?
  *   **Internalist Requirement:** Yes. We must be able to say the amoralist *has* a reason to be moral, or the depressed person has a reason to get up, by finding some element in their SMS (via deliberation) that supports it.
  *   **My Probability (that Internalism is right here):** 0.40
  *   **Rationale:** Internalists often save the theory by making the SMS incredibly capacious (e.g., 'you care about being rational'). But if you stretch it too far, the theory becomes tautological (true by definition but empty). If you keep it narrow, it gives the wrong results (telling us the amoralist has no reason not to murder). It's a tricky balance, and I think Internalism usually slips into triviality to survive these cases.

  ### The Calculation

  To get the overall credence, I'm treating this as a weighted average of how well Internalism performs on its own necessary conditions.

  *   **Pillar 1:** $0.30 \times 0.70 = 0.21$
  *   **Pillar 2:** $0.50 \times 0.20 = 0.10$
  *   **Pillar 3:** $0.20 \times 0.40 = 0.08$

  **Total:** $0.21 + 0.10 + 0.08 = 0.39$

  Rounding up slightly for charity: **0.40**.

  ### Sensitivity Analysis

  My number is most sensitive to **Pillar 2: The Coherence of 'Sound Deliberation'**.

  Why? Because it carries the heaviest weight (50%) and currently has the lowest probability score (0.20). If you could convince me that there is a robust, purely procedural account of rationality that doesn't rely on objective values, my credence in the overall claim would skyrocket.

  *   **Current Impact:** It drags the total down by 0.15 compared to if I thought it was 50/50.
  *   **The Shift:** If I were persuaded that 'sound deliberation' is a coherent, freestanding concept (perhaps through a Kantian constructivist route that remains internalist), I'd raise the probability on Pillar 2 from 0.20 to 0.60.
  *   **New Calculation:** $0.21 + (0.50 \times 0.60) + 0.08 = 0.59$.
  *   **Result:** I'd flip from sceptic to supporter.

  ### What Would Shift My Mind?

  To move me from 0.40 towards your 0.8, I don't need more intuitions about the amoralist. I need a **metaphysical account of procedural rationality**.

  Specifically, I need an argument that shows how an agent can be irrational *solely* in virtue of the relation between their mental states, without reference to the truth or value of the objects of those states. Williams gestures at this, but critics like Parfit argue that the 'rules' of deliberation (e.g., means-end coherence) are themselves objective normative truths.

  If you can show me that the norms of deliberation are internal to the concept of agency itself, rather than external truths that agency must track, you win. Until then, I reckon the 'sound deliberation' route is just Externalism in disguise, and that's why I can't go higher than 0.40.

  Ta.
