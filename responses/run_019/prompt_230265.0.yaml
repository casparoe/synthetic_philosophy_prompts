answer: |-
  Your friend has constructed a sophisticated *reductio ad absurdum* argument. It is logically valid, meaning that if all the premises are true, the conclusion must follow. Since the conclusion (6) is indeed absurd, at least one premise must be false.

  To preserve both of your intuitions—that history was open (contingent) and that some winners won because they were better (selection)—you should primarily reject **Step (3)**, and secondarily qualify **Step (5)**.

  Here is the breakdown of why Step (3) is the logical linchpin, how rejecting it saves your position, and what cost that entails.

  ### The Primary Error: Step (3)

  **Step (3) states:** *If at the time of its early causes an outcome was not already singled out as the likely result, then the outcome's later dominance cannot be explained by that outcome's being better than the alternatives.*

  This is the fatal flaw. Step (3) assumes a false dichotomy between **Contingency** (it could have gone differently) and **Merit** (it was better). It implies that if something is "better," it must be "inevitable" (or at least singled out as likely) from the start.

  **Why Step (3) is wrong:**
  Superiority does not guarantee immediate dominance. A superior technology, institution, or idea can easily fail in its early stages due to bad luck, poor timing, or lack of capital. Conversely, an inferior one can gain an early foothold by accident. However, once the competition is underway, **selection pressures** often kick in.

  Think of this in evolutionary terms:
  1.  **Mutation (Contingency):** A genetic mutation occurs randomly. It is not "singled out" by nature beforehand; it is an accident. (This matches Step 1 & 2).
  2.  **Selection (Merit):** Whether that mutation dominates the population later depends on whether it confers a survival advantage. (This contradicts Step 3).

  If you apply your friend's logic to biology, you would have to say: "Because this gene originated in a random mutation, its dominance in the species cannot be explained by it being advantageous." That is clearly false. Random origin does not preclude selective retention.

  **How rejecting Step (3) helps you:**
  By rejecting (3), you break the link between "accidental start" and "accidental finish." You can now argue:
  *   **History was open:** The specific *candidate* that got the initial foothold was contingent (e.g., English became a global language due to the specific accidents of the British Empire and WWII).
  *   **Winners had advantages:** Once that candidate had the foothold, it *retained* and *expanded* its dominance because it possessed real advantages (e.g., network effects, adaptability, existing infrastructure) that made it "better" in the context of the established system.

  This allows you to keep both intuitions: The *entry* was path-dependent; the *persistence* was merit-dependent.

  ### The Secondary Error: Step (5)

  **Step (5) states:** *Virtually every major historical outcome... is path-dependent in the sense defined in (1).*

  Even if Step (3) were true, Step (5) is an empirical overreach. It claims universality ("Virtually every").

  **Why Step (5) is wrong:**
  Not all historical outcomes are sensitive to small early accidents. Some are driven by hard constraints:
  *   **Geography:** Civilizations arose in river valleys because of water and soil, not because of a coin flip.
  *   **Physics:** Jet engines replaced propellers because of thermodynamic efficiency, not because of a locked-in standard.
  *   **Economics:** Arbitrage opportunities are closed quickly regardless of history.

  **How qualifying Step (5) helps you:**
  If you change "Virtually every" to "Many," the absurd Conclusion (6) becomes "Many major historical outcomes did not win because they were better." This is not absurd; it is a nuanced historical claim. It admits that while QWERTY keyboards might be accidents, nuclear power plants are not.

  ### The Synthesis: How to Keep Both Intuitions

  To maintain that history was open *and* that merit matters, you should adopt a **Two-Stage Model of Historical Causation**:

  1.  **The Selection of Candidates (Path Dependent):** At the "fork in the road," small accidents determine which options get tried. This satisfies your desire for an "open history." At this stage, your friend is right: the winner is not yet singled out.
  2.  **The Survival of Candidates (Selection Dependent):** Once the options are in play, systemic pressures (efficiency, cost, usability, coercion) determine which one scales. This satisfies your desire for "real advantages."

  **Example: The VHS vs. Betamax War**
  *   **Friend's View:** VHS won by accident (path dependence), so we can't say it was better.
  *   **Your Revised View:** VHS got an early manufacturing advantage by accident (contingency). *However*, it also offered longer recording time, which consumers valued (merit). The accident gave it the foothold; the merit allowed it to crush the competition.
  *   **Result:** The outcome was not inevitable (Betamax could have won), but it wasn't purely random either (VHS had features people wanted).

  ### The Cost of Rejecting Step (3)

  You asked what rejecting this premise would cost. It costs **simplicity and certainty.**

  1.  **It complicates historical explanation:** You can no longer say "X won because it was best" (determinism) nor "X won by accident" (pure path dependence). You must say, "X got a lucky break, *and* it was good enough to capitalize on it." Disentangling the luck from the merit is notoriously difficult for historians.
  2.  **It limits counterfactuals:** If merit plays a role in persistence, then reversing the early accident doesn't necessarily reverse the final outcome. If the British Empire hadn't risen, maybe English still becomes dominant later because of the US economy and the internet. This makes "what if" history harder to predict.
  3.  **It concedes that some "merit" is retrospective:** You have to admit that "better" is often defined by the path itself. (e.g., A language is "better" for trade *because* everyone already speaks it). This means merit and path dependence are entangled, not separate stages.

  ### Summary

  Your friend's argument fails because **Step (3) conflates the origin of a trend with the reason for its success.**

  *   **Reject Step (3):** Acknowledge that an outcome can be contingent at the start but sustained by superiority later.
  *   **Qualify Step (5):** Acknowledge that not *all* history is path-dependent; some things are determined by physical or economic necessity.

  By doing this, you validate your friend's insight (accidents matter immensely) without accepting his nihilistic conclusion (merit never matters). You preserve the idea that the world is fragile and open, but also that once things settle, reality bites back, and the "fitter" options tend to stay.
