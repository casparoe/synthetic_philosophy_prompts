      *   Actually, Step (3) is the most vulnerable. It implies that if something *could* have lost early on, its later success can't be due to merit. But merit often acts *over time*.
      *   Consider the "QWERTY" example. It fits the friend's model (locked in despite being worse).
      *   Consider the "VHS vs. Betamax" example. Often cited as path dependence, but VHS had longer recording time (merit).
      *   Consider "English Language." Path dependent (Empire), but also has features (simplicity, adaptability) that helped it stay.
