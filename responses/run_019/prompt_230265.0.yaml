      *   **Alternative Candidate:** Step (5).
      *   **Why?** It's an empirical overgeneralization.
      *   **Strategy:** I should argue that *both* (3) and (5) are problematic, but (3) is the logical engine that forces the absurdity. If we fix (3), we can keep a moderate version of (5).

