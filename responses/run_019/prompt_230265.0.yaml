      *   **Cost of Rejection:**
          *   Rejecting (3) costs the friend their clean definition of path dependence. They have to admit path dependence is about *initial conditions*, not necessarily *final quality*.
          *   Rejecting (5) costs the friend their universal claim. They have to admit path dependence is common but not ubiquitous.

  6.  **Refining the Argument (Self-Correction/Nuance):**
