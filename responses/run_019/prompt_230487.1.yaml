prompt: |-
  I run operations at a mid-size engineering services company, and every month I sit in a review where we decide which half-finished projects keep their funding and which get killed. Usually 4-6 projects, about an hour total, and the people in the room are not going to read any theory. The problem is the same every time: the project lead says we've already sunk X dollars and Y months into it, and walking away "wastes" that. Ive read about the dollar auction thing—two people bidding on a dollar bill and ending up paying way more than a dollar because neither wants to lose what they've already bid—and I can see we're running one of those at scale. What I dont have is a procedure I can actually use in the meeting.

  Could you write me a decision procedure for go/kill calls, grounded in whatever is known about the dollar auction and escalation of commitment, that a non-philosopher project lead could follow? The deliverable should be a checklist or a set of questions in order. For each question say what counts as a good enough answer to move to the next step, where the procedure stops with a "kill" or "let it die," and where it has to stop and hand the decision to me because it's a values call rather than a calculation.

  Constraints: the whole thing has to be usable with maybe 15 minutes per project, with people who haven't read the literature and are motivated to keep their own projects alive. I suspect part of the answer is setting kill criteria before a project starts, but I want the whole procedure, not just that. I also want it to be honest about what it cannot do and where it will misfire.

  Then run it on these three, and for each tell me which decision the procedure gives, and flag any step where you think a real room would fight the result. I especially want to see where this forces a kill I'm going to hate.

  1. A software migration we've been on for 14 months against an original 6-month plan, about $2.1M in. The remaining work is estimated at another 9 months and $1.4M, and after it's done the only benefit is that we stop paying $90k/year in licensing on the old system. The new system will not enable any new work.

  2. A product line that lost money last year, but we have a contract with one large customer through next year. If we cancel the line now, we owe the customer $600k in penalties and likely lose their other business, which nets us more than the line loses.

  3. A bid we've been preparing for a government contract for six weeks; we've spent around $300k on the proposal. We just learned the buyer cut the contract's ceiling, and on our best estimate submitting the final bid would on average return about $50k over our submission costs, not counting any of the $300k already spent.

  Answer with the procedure first, then the three applications.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Operations leader at a mid-size engineering services company.
      *   **Problem:** Monthly project review meetings where sunk cost fallacy drives decisions (escalation of commitment/dollar auction). Project leads argue "we've already spent X, we can't waste it."
      *   **Goal:** A practical decision procedure (checklist/questions) to use in the meeting.
      *   **Constraints:**
          *   Usable in ~15 minutes per project (4-6 projects/hour total).
          *   Audience: Non-philosophers, motivated to keep projects alive.
          *   Must address sunk cost/escalation of commitment.
          *   Must include pre-project criteria (kill criteria) but cover the whole lifecycle.
          *   Must be honest about limitations/misfires.
          *   Must distinguish between calculation and values calls (escalate to Ops Leader).
      *   **Deliverable:**
          1.  The Procedure (Checklist/Questions).
          2.  Application to three specific scenarios.
          3.  Identification of where the room will fight the result.
          4.  Identification of where the user (Ops Leader) will hate the result.

  2.  **Deconstruct the Psychology (Dollar Auction/Escalation of Commitment):**
      *   *Sunk Cost Fallacy:* Past costs are irrelevant to future value.
      *   *Escalation of Commitment:* Doubling down to justify past decisions.
      *   *Dollar Auction:* Bidding more than the value to avoid losing the bid already placed.
      *   *Solution:* Focus *only* on Future Costs vs. Future Benefits. Ignore Past Costs. Pre-commit to exit criteria.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Ask "Will this make money?" If no, kill.
      *   *Critique 1:* Too simple. Leads argue about "strategic value" or "reputation." Need to isolate sunk costs explicitly.
      *   *Attempt 2 (Mental):* 1. Ignore past spend. 2. Calculate ROI. 3. Check kill criteria.
      *   *Critique 2:* People won't actually ignore past spend unless forced. Need a specific step that "zeros out" the past. Need a "Pre-Mortem" element.
      *   *Attempt 3 (Refining for the User's Constraints):*
          *   Needs to be a script/checklist.
          *   Needs to handle the "But we spent $2M!" objection immediately.
          *   Needs to define "Good Enough Answer."
          *   Needs an escalation path for "Values Calls."
      *   *Structure:*
          *   Phase 0: Pre-Project (The Anchor).
          *   Phase 1: The Sunk Cost Reset (The Psychological Break).
          *   Phase 2: The Forward-Looking Math (The Calculation).
          *   Phase 3: The Strategic Exception (The Values Call).
          *   Phase 4: The Decision.

  4.  **Refining the Steps (incorporating "Dollar Auction" logic):**
      *   *Step 1 (The Reset):* Explicitly state past spend is $0 for this decision.
      *   *Step 2 (The Future ROI):* Future Benefit > Future Cost?
      *   *Step 3 (The Kill Criteria):* Did we breach the pre-set limits?
      *   *Step 4 (The Opportunity Cost):* Is there a better use of funds?
      *   *Step 5 (The Ego/Reputation Check):* Is this just saving face?

      *Let's tighten this for a 15-minute window.*
      *   *Question 1:* The Sunk Cost Firewall. (Acknowledge, then discard).
      *   *Question 2:* The Fresh Start ROI. (Future only).
      *   *Question 3:* The Pre-Commitment Check. (Did we agree to stop earlier?).
      *   *Question 4:* The Opportunity Cost. (Could this money do more elsewhere?).
      *   *Decision Logic:* If Q2 fails -> Kill. If Q3 triggers -> Kill (unless Values Call). If Q4 fails -> Kill.

      *Adding the "Values Call" distinction:* When does it go to the Ops Leader? When the math says kill, but strategic reputation says live. That's a leadership call, not a project lead call.

  5.  **Drafting the Limitations/Honesty Section:**
      *   This won't stop emotional arguing.
      *   It relies on honest estimates (which leads might fudge).
      *   It can't measure "morale" perfectly.
      *   It requires the Ops Leader to actually say "No" sometimes.

  6.  **Applying to the Three Scenarios:**

      *   *Scenario 1 (Software Migration):*
          *   Sunk: $2.1M.
          *   Future Cost: $1.4M.
          *   Future Benefit: $90k/year savings.
          *   Math: Spend $1.4M to save $90k/yr. Payback period = 15.5 years.
          *   Verdict: Kill.
          *   Friction: High. Lead will scream about the $2.1M.

      *   *Scenario 2 (Product Line):*
          *   Sunk: Past losses.
          *   Future Cost: Penalties ($600k) + Lost other business.
          *   Future Benefit: Avoid penalties, keep other business.
          *   Math: If "other business" > (Line Loss + Penalties), keep.
          *   Nuance: This isn't a sunk cost trap; it's a contractual obligation. The "sunk" part is the past loss. The decision is about *future* penalty vs. *future* profit.
          *   Verdict: Keep (likely), but flag as a "Values/Relationship Call" if the math is tight.
          *   Friction: Low, unless the "other business" is vague.

      *   *Scenario 3 (Government Bid):*
          *   Sunk: $300k (Proposal cost).
          *   Future Cost: Submission costs (assume negligible or included in the "$50k over submission costs" phrasing). Let's assume the $50k is net of *remaining* work.
          *   Future Benefit: $50k profit.
          *   Math: Spend effort to make $50k.
          *   Context: $300k is gone.
          *   Verdict: Kill (unless $50k is a gateway to something huge). $50k return on a bid effort is usually noise.
          *   Friction: High. "We spent $300k, we have to submit!"

  7.  **Review against Constraints:**
      *   15 mins/project? Yes, if the checklist is strict.
      *   Non-philosophers? Yes, plain English.
      *   Honest about misfires? Yes, add a section on "Where this breaks."
      *   Ops Leader hate? Scenario 1 is the big one. Killing a $2.1M project with nothing to show is painful but correct.

  8.  **Final Polish:**
      *   Tone: Professional, direct, operational.
      *   Formatting: Clear headings, bold text for emphasis.
      *   Ensure the "Values Call" escalation is clear.

      *(Self-Correction during drafting)*: Make sure I explicitly mention the "Dollar Auction" dynamic in the procedure so the user sees the link. I'll call Step 1 "The Sunk Cost Firewall."
      *(Refining Scenario 3)*: The prompt says "$50k over our submission costs, not counting any of the $300k already spent." This means Future Revenue - Future Cost = $50k. The $300k is sunk. So the ROI is tiny.
      *(Refining Scenario 2)*: This is tricky. If the line *lost money last year*, will it lose money next year? The prompt says "If we cancel... owe penalties." It implies keeping the line avoids penalties. I need to make sure the procedure distinguishes between "keeping a loser" vs "paying a penalty to preserve a relationship." The procedure should flag this as a "Strategic/Values" call if the math is purely negative on the line itself but positive on the relationship.

  9.  **Finalizing the Output Structure:**
      *   Introduction (acknowledging the pain).
      *   The Procedure (The "Sunk Cost Firewall" Protocol).
      *   Limitations (Where it misfires).
      *   Application to Cases 1, 2, 3.
      *   Conclusion.

      *Wait, one more check:* The user asked for "where the procedure stops with a kill... and where it has to stop and hand the decision to me." I need to make sure the flowchart logic is explicit about that handoff.

      *Let's write it.*
answer: |-
  ## The "Sunk Cost Firewall" Protocol

  This procedure is designed to be read aloud by the meeting facilitator (you) at the start of each project review. It takes 15 minutes per project. It forces the room to treat past spending as $0.

  **Pre-Requisite:** Every project must have a "Kill Sheet" signed at kickoff. This sheet defines the maximum budget, maximum timeline, and minimum success metrics. If a project does not have a signed Kill Sheet, it automatically fails Step 3.

  ### The Procedure

  **Step 1: The Sunk Cost Firewall (2 Minutes)**
  *   **Question:** "What is the total amount spent to date (money and time)?"
  *   **Action:** Write this number on the whiteboard. Draw a thick line through it.
  *   **Rule:** This number is now legally irrelevant to this decision. It is a past expense, like a meal you ate last month. Anyone who references this number to justify *future* spending is out of order.
  *   **Pass Condition:** The room acknowledges the number is sunk.
  *   **Fail Condition:** The Project Lead argues that abandoning the project "wastes" this number.
      *   *If Fail:* You (Ops Leader) intervene immediately. "We are not deciding if the past was a mistake. We are deciding if the future is an investment. Move to Step 2."

  **Step 2: The Fresh-Start ROI (5 Minutes)**
  *   **Question:** "If this project were a brand new request today, with zero history, would we fund the *remaining* work for the *remaining* benefit?"
  *   **Inputs Required:**
      *   A: Cost to Complete (money + hours).
      *   B: Future Value (revenue + savings + strategic value).
  *   **Pass Condition:** B is significantly greater than A (use your company's standard hurdle rate, e.g., 20% ROI or Payback < 18 months).
  *   **Fail Condition:** B is less than A, or the payback period exceeds company standards.
      *   *If Fail:* **Default Decision = KILL.**
      *   *Exception:* Proceed to Step 4 only if there is a non-financial strategic reason.

  **Step 3: The Pre-Commitment Check (3 Minutes)**
  *   **Question:** "Does this project violate the limits on the original Kill Sheet?"
  *   **Inputs Required:** Original Kill Sheet vs. Current Status.
  *   **Pass Condition:** Project is within original budget/time tolerances (e.g., +/- 10%).
  *   **Fail Condition:** Project has breached original limits (e.g., 6-month plan is now 14 months).
      *   *If Fail:* **Default Decision = KILL.**
      *   *Exception:* Proceed to Step 4 only if the Project Lead can prove the *market conditions* changed, not just execution failure.

  **Step 4: The Strategic Exception (Values Call) (5 Minutes)**
  *   **Question:** "Is there a verifiable, external strategic reason to continue despite failing Step 2 or 3?"
  *   **Valid Reasons:** Regulatory compliance, contractual penalty avoidance, keeping a key client who provides *other* profitable work.
  *   **Invalid Reasons:** "Team morale," "We look bad if we stop," "We might learn something," "Reputation" (unless tied to specific future revenue).
  *   **Pass Condition:** You (Ops Leader) agree the strategic value outweighs the financial loss.
  *   **Fail Condition:** The reason is internal ego, hope, or vague reputation.
      *   *If Fail:* **Decision = KILL.**
      *   *If Pass:* **Decision = HAND TO OPS LEADER.** (This is a values call, not a calculation. You must own the risk).

  ***

  ### Where This Procedure Will Misfire (Honesty Check)

  1.  **The "Hope" Hedge:** Project Leads will inflate "Future Value" (Step 2) with vague strategic benefits to pass the math. *Counter:* Require named customers or signed contracts for "Future Value."
  2.  **The Morale Trap:** Killing a project can demoralize a team. This procedure ignores morale. If you kill too many at once, you lose talent. *Counter:* Stagger the kills or reassign teams immediately.
  3.  **The "Almost There" Lie:** Leads will claim 90% complete when they are at 50%. *Counter:* Require a third-party engineering estimate for "Cost to Complete" if the Lead is optimistic.
  4.  **The Values Abdication:** If you (Ops Leader) always approve the Step 4 Exception, the team will learn to fail Step 2 on purpose to get to Step 4. You must say "No" sometimes.

  ***

  ## Application to Your Three Scenarios

  Here is how the protocol runs on your current backlog.

  ### 1. The Software Migration
  *   **Status:** 14 months in (plan was 6). $2.1M sunk.
  *   **Step 1 (Firewall):** $2.1M is crossed out. Irrelevant.
  *   **Step 2 (Fresh-Start ROI):**
      *   Cost to Complete: $1.4M.
      *   Future Value: $90k/year savings.
      *   Math: Payback period is 15.5 years ($1.4M / $90k).
      *   Result: **FAIL.** (No company accepts a 15-year payback on IT).
  *   **Step 3 (Pre-Commitment):**
      *   Original Plan: 6 months. Current: 14 months.
      *   Result: **FAIL.** (Breach of limit).
  *   **Step 4 (Strategic Exception):**
      *   Argument: "We look bad if we stop."
      *   Validity: Invalid (Internal ego).
      *   Result: **FAIL.**
  *   **Protocol Decision:** **KILL.**
  *   **Where the Room Will Fight:** Immediately at Step 1. The Project Lead will say, "We can't throw away $2.1M." You must enforce the firewall.
  *   **Where You Will Hate This:** This is the painful one. Writing off $2.1M with zero new capability looks like a failure on your watch. However, spending another $1.4M to save $90k/year is throwing good money after bad. The protocol forces you to admit the $2.1M is already gone.

  ### 2. The Losing Product Line
  *   **Status:** Lost money last year. Contract through next year.
  *   **Step 1 (Firewall):** Past losses are crossed out. Irrelevant.
  *   **Step 2 (Fresh-Start ROI):**
      *   Cost to Complete: Operating losses for next year + Potential Penalties if cancelled.
      *   Future Value: Revenue from this customer + Revenue from *other* business they bring.
      *   Math: If (Penalty + Lost Other Business) > (Operating Losses), then keeping it is mathematically sound.
      *   Result: **PASS** (Based on your note that losing them costs more than the line loses).
  *   **Step 3 (Pre-Commitment):**
      *   Did we agree to kill this line if it lost money? If yes, **FAIL**. If no specific kill criteria, **PASS**.
  *   **Step 4 (Strategic Exception):**
      *   Even if Step 3 failed, this is a contractual/relationship retention play.
      *   Result: **HAND TO OPS LEADER.**
  *   **Protocol Decision:** **KEEP (with oversight).**
  *   **Where the Room Will Fight:** They won't fight this; they want to keep it. The fight will be if Finance argues the "Other Business" is speculative.
  *   **Where You Will Hate This:** You are effectively subsidizing a loser to pay a protection racket (the penalty). But the protocol correctly identifies this is not a Sunk Cost fallacy; it is a Future Cost (penalty) vs. Future Benefit calculation. This is a valid business decision, not an escalation of commitment.

  ### 3. The Government Bid
  *   **Status:** $300k spent on proposal. Contract ceiling cut.
  *   **Step 1 (Firewall):** $300k is crossed out. Irrelevant.
  *   **Step 2 (Fresh-Start ROI):**
      *   Cost to Complete: Final submission effort (assume low, but includes opportunity cost of team time).
      *   Future Value: $50k profit (average).
      *   Math: You are spending effort for a $50k return. In engineering services, $50k net profit is negligible risk exposure for a government contract (which often have payment delays/compliance costs).
      *   Result: **FAIL** (Unless your hurdle rate is near zero).
  *   **Step 3 (Pre-Commitment):**
      *   Did we set a "Max Bid Cost" or "Min Profit Margin"? Likely yes.
      *   Result: **FAIL** (Margin is too thin).
  *   **Step 4 (Strategic Exception):**
      *   Argument: "We need a government reference."
      *   Validity: Valid, *if* you don't have one. If you do, it's Invalid.
      *   Result: **LIKELY FAIL.**
  *   **Protocol Decision:** **KILL (Do not submit).**
  *   **Where the Room Will Fight:** The sales/engineering team will scream about the $300k. "We have to submit to make the $300k worth something!" This is the purest Dollar Auction in your list. They are bidding more (submission effort + risk) to win a pot ($50k) that doesn't cover the bid, just to justify the $300k already in the pot.
  *   **Where You Will Hate This:** Telling a sales team to walk away 6 weeks from the finish line is culturally difficult. But the math says this contract is essentially worthless to you now. The $300k is tuition you paid to learn the ceiling was cut. Paying more to submit guarantees you lose more.

  ## Summary of Decisions

  | Project | Protocol Decision | Primary Friction Point |
  | :--- | :--- | :--- |
  | **1. Migration** | **KILL** | Admitting the $2.1M is gone forever. |
  | **2. Product Line** | **KEEP** | Validating a "protection payment" vs. genuine profit. |
  | **3. Gov Bid** | **KILL** | Stopping 6 weeks from finish line due to low ROI. |

  **Final Advice:**
  In the meeting, when the Project Lead for Scenario 1 says, "But we've spent $2.1M," point to the whiteboard where you drew the line through it. Say: "That money bought us information. The information is that this project is a bad investment. If we spend $1.4M more, we are buying the same information again at a higher price."

  If they push back on Scenario 3, ask: "If we hadn't spent the $300k, and someone offered you this contract today for $50k profit, would you sign it?" If the answer is no, you cannot submit.
