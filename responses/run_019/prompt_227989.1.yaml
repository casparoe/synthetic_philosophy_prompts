answer: |-
  The grand ballroom of the Hilton hummed with post-keynote chaos. Four hundred condensed matter physicists stared at the empty stage where Dr. Aris Thorne had just walked across the pool installed for the gala. No wires, no hidden supports. The AV team had verified the feeds; the load sensors in the deck remained silent. Near the back, Elena Vance and Marcus Cole stood over a tray of lukewarm coffee, ignoring the crowd surging toward the pool edge.

  "So," Elena said, staring at the ripple-free water. "Do we update the Standard Model or just go home?"

  Marcus sipped his coffee. "We go home. Or rather, we assume a trick we haven't spotted yet. Hume would tell you to reject it outright."

  "Hume didn't have high-speed photodiodes, Marcus. That wasn't human testimony. That was voltage traces."

  "Voltage traces interpreted by humans," Marcus countered. "You trust the sensor? That trust rests on the engineer who built it, the technician who calibrated it, the manual that says how it behaves. It's testimony all the way down. Hume's point stands: uniform experience says humans sink. The probability that the calibration chain is flawed is still lower than the probability that gravity switched off for Thorne."

  "That's a category error," Elena said. "Hume was worried about liars, delusion, and hearsay. Instruments don't lie. They malfunction, sure, but we have redundancy. Three independent systems logged the weight distribution. Zero. Hume conceded that testimony *could* establish a miracle. His 'eight days of darkness' example. If every record agreed, you'd accept it. Well, this is better than records. This is raw data. Why doesn't this meet his threshold?"

  "Because the 'eight days of darkness' is publicly observable by everyone without intermediaries," Marcus said. "Instruments are intermediaries. You're asking me to believe a miracle based on a chain of custody for data. Plus, what counts as a law of nature? If 'humans sink' is a law, this breaks it. If it's just a regularity, maybe the law was wrong. But Hume defines a miracle as a violation of established law. The evidence for the law is uniform experience. This single event doesn't outweigh forty years of everyone else sinking."

  "But experience isn't uniform anymore," Elena pressed. "It just updated. You're treating 'laws' as a priori truths. They're inductive summaries. If the data is solid, the summary changes. Remember the Indian Prince? He wouldn't believe water froze because his experience was uniform heat. He was wrong. We're the Prince if we deny this because our experience is uniform sinking."

  "The Prince was rejecting testimony about a distant climate," Marcus said. "He wasn't rejecting a physical measurement in front of him. There's a difference between 'water freezes in cold places' and 'gravity is optional in ballrooms.' One expands the map; the other tears it up. If I accept this, I undermine the entire epistemic framework I use to trust the data in the first place. It's self-defeating. To trust the log, I must trust physics. If physics allows this, why trust the log?"

  "Or it expands the framework," Elena said. "Look, if the sensors are right, uniform experience just gained an exception. Hume says weigh the evidence. What if the evidence is this heavy? What if the falsehood of the data is the real miracle? We checked the clocks, the hashes, the power supplies. It would be a bigger miracle for all of that to align falsely than for Thorne to float."

  "Then you prove the data couldn't be false," Marcus said. "Can you? Can you rule out a hack, a magnetic anomaly, a mass hallucination of the tech team? No. So the wise person proportions belief. My belief stays near zero. Yours is spiking. One of us is being unphilosophical."

  "Maybe," Elena said, watching the pool techs dive in. "Or maybe Hume didn't account for when the witness is a machine."

  "Machines are built by men," Marcus said. "And men are fallible. That hasn't changed since Edinburgh."

  **Scorecard**

  Marcus lands his hardest hit on the calibration chain. He correctly identifies that instrumental data isn't "pure" evidence; it relies on human claims about device function. If the device behaves miraculously, trusting it requires trusting the humans who certified it, which circles back to Hume's original skepticism about testimony.

  Elena's best shot is the Indian Prince analogy. She successfully frames "laws" as empirical summaries that must update when new data arrives, rather than rigid barriers. However, she dodges Marcus's circularity point. If the instrument relies on physical laws to function, and the event violates those laws, can the instrument's report be trusted? She treats the data as neutral, but Marcus argues the data's validity presupposes the laws being broken. Neither resolves whether Hume's maxim scales to automated evidence, but both expose the tension between stable laws and anomalous data.
