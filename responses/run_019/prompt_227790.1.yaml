answer: |-
  This is a profound narrative and philosophical problem. You are grappling with the tension between a **deontological absolute** (deception voids consent) and the **phenomenology of lived experience** (people make distinct choices over time).

  If you treat every downstream act as void, you risk turning your protagonist into a mere object—a puppet whose strings were cut at the altar. If you treat some acts as valid, you fear you are betraying the moral premise.

  There is a principled way to resolve this without conceding that the original consent was valid. The solution lies in distinguishing between **Foundational Consent** and **Transactional Consent**, bound together by a test of **Causal Reliance**.

  Here is a framework for rigorously mapping the "radius of contamination" in your novel's moral architecture.

  ### 1. The Distinction: Status vs. Transaction
  You must distinguish between the *status* of the marriage and the *acts* performed within it.
  *   **Foundational Consent (Status):** This is the agreement to enter the specific relationship defined by certain parameters (exclusivity, shared future, financial union). The lie vitiates this completely. She did not consent to *this* marriage; she consented to a different marriage with a different man (a man without a secret child).
  *   **Transactional Consent (Acts):** These are specific decisions made day-to-day (signing a mortgage, having sex, moving cities).

  **The Principle:** The voidness of the Foundation does not automatically void every Transaction. It only voids Transactions that **materially rely** on the truth of the Foundation.

  ### 2. The Test: Causal Reliance (The "But-For" Test)
  To determine if a specific downstream choice is "contaminated," apply a test of causal reliance. Ask: *But for the deception, would this specific choice have been made in this specific way?*

  *   **The Mortgage:** If she signed a joint mortgage assuming a certain financial trajectory based on their "child-free" status, or assuming a level of trust required for joint liability, that consent is void. She did not consent to financial entanglement with a man diverting resources to a secret child. The lie contaminated the risk assessment.
  *   **The Relocation:** If she moved abroad for *his* career, believing they were building a life together as a unit, and the secret child ties him emotionally or financially to the home country (creating a fracture in that unit), her relocation is tainted. She consented to move as a wife; she did not consent to move as a stranger in a marriage that didn't exist.
  *   **The Intimacy:** This is the most sensitive area. In many ethical frameworks, sexual consent is specific to the context. If she consents to sex *as a wife* (implying a specific level of intimacy, trust, and shared future), and the husband knows he is withholding a fact that would fundamentally alter her willingness to be intimate with him, that consent is impaired. The "radius" here is total, because intimacy relies on the integrity of the bond.
  *   **The Coffee:** If she buys a coffee with her own money on a Tuesday morning, that choice does not rely on the marital status. It is an independent act of agency. Validating this does not validate the marriage; it validates her existence as a human being capable of independent action.

  **Why this isn't a concession:** Acknowledging that she can buy coffee without his permission (or that the mortgage might stand legally while being morally void) does not mean the *marital consent* was valid. It means that **not every human action is defined by the marriage.** You are not saying the deception was harmless; you are saying her agency exists *outside* the deception, but is compromised *within* the sphere of the deception.

  ### 3. The Doctrine of "Continuing Fraud"
  To maintain rigor, you must treat the lie not as a single event at the altar, but as a **continuous state of affairs**.
  *   Every day he wakes up and does not tell her, he renews the deception.
  *   Therefore, consent is not just voided *ab initio* (from the start); it is prevented from ever forming *in the present*.
  *   This solves the problem of "time." It's not that the poison fades after five years. It's that the well is being poisoned every morning.
  *   **Implication:** She cannot "ratify" the marriage by staying, because she cannot ratify a contract she doesn't know is fraudulent. Her continued presence is based on the same false premises as her initial "I do."

  ### 4. Avoiding the "Puppet" Trap
  If you write her as having *no* valid consent regarding *anything*, you risk stripping her of moral weight. A character who cannot consent to anything is a victim, not a protagonist.
  *   **Rigorous Approach:** Her agency is **constrained**, not erased. She possesses the *capacity* for consent, but the *conditions* for exercising it within the marriage are corrupted.
  *   **Narrative Utility:** This allows you to show moments where she exerts genuine will (e.g., helping a stranger, pursuing a hobby) to highlight the tragedy that her *marital* will is nullified. It creates a contrast between her free self and her trapped self.

  ### 5. Applying the Architecture to the Plot
  You can use the "radius of contamination" to structure the climax or the moral reckoning.
  *   **Zone 1 (Total Contamination):** Sexual intimacy, the vow of fidelity, the expectation of shared parenting. These are void.
  *   **Zone 2 (Disputed Contamination):** The mortgage, the career sacrifices. Here, you can introduce conflict. He might argue, "You signed the papers, you chose to move." She (and the moral architecture) argues, "I signed based on a reality you fabricated." This is where the legalistic vs. moral tension plays out.
  *   **Zone 3 (No Contamination):** Her internal life, her friendships outside the marriage, her moral judgments of others. These remain hers.

  ### Summary of the Principle
  You do not need to treat all subsequent choices as unconsented to maintain rigor. You only need to treat as unconsented those choices that **depend on the truth of the marital bond.**

  *   **Consent procured by deception is void.** (Your Axiom)
  *   **Choices dependent on that consent are also void.** (The Extension)
  *   **Choices independent of that consent remain valid.** (The Limit)

  This preserves your moral architecture: the marriage is a sham, and everything built *on* the sham is unstable. But it acknowledges that she is a person who exists *outside* the sham, capable of valid choices that the lie could not reach. This makes the violation more precise, and therefore more tragic, rather than a vague total erasure of her will.

  **The rigorous conclusion:** The lie does not invalidate her *capacity* to consent; it invalidates the *context* required for her consent to be meaningful within the marriage. You can therefore write her as fully agentic in her anger, her investigation, and her eventual departure, without contradicting the premise that she never truly entered the marriage.
