prompt: |-
  I am at work on a novel whose central marriage rests on a lie: before the wedding, the husband concealed from his wife that he has a child from an earlier relationship whom he secretly supports. The book's moral architecture depends on treating her consent to the marriage as no consent at all — consent obtained by deception is void, since a choice made in ignorance of the relevant facts is not really a choice. The structural problem I face is how far this voidness extends. If she never validly consented to the marriage, it would seem to follow that she never validly consented to anything premised on it: the joint mortgage, the relocation abroad, the intimacies of married life. My instinct is to write her as wronged in all of these respects at once, the original deception contaminating every downstream agreement like a poisoned well. But I want the architecture to be rigorous rather than merely intuitive. Given that deception voids consent, is there a principled way to fix the radius of the contamination — must I treat all of her subsequent choices within the marriage as unconsented, and if not, am I not conceding that consent procured by deception can be valid after all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel.
      *   **Core Premise:** A marriage is founded on a lie (husband hid a child from a previous relationship).
      *   **Moral Architecture:** Consent obtained by deception is void (no true choice without relevant facts).
      *   **The Problem:** How far does this "voidness" extend? Does it invalidate *everything* that happened within the marriage (mortgage, relocation, intimacy)?
      *   **The Dilemma:** If *everything* is void, it feels intuitively right but maybe legally/philosophically extreme. If *some* things are valid, does that undermine the core premise that deception voids consent?
      *   **Goal:** A rigorous, principled way to define the "radius of contamination" without contradicting the core moral philosophy.

  2.  **Deconstruct the Philosophical/Legal Problem:**
      *   *Premise:* Fraud vitiates consent.
      *   *Extension:* Does fraud in the foundation vitiate consent in all superstructure?
      *   *Counter-premise:* Agency and ongoing autonomy. People make new choices every day.
      *   *Legal Analogy:* Contract law (fraud in the inducement vs. fraud in the execution), Family Law (annulment vs. divorce), Criminal Law (consent to intimacy).
      *   *Philosophical Analogy:* Autonomy, relational autonomy, the nature of marriage as a status vs. a contract.

  3.  **Brainstorming Solutions/Nuances:**
      *   *Option A: Total Voidance.* Everything is tainted. This is the "poisoned well" approach. Risk: Makes the wife seem purely passive, a victim without agency for years/decades.
      *   *Option B: Severability.* The marriage is void, but specific acts (like signing a mortgage) were based on separate facts (income, credit) that weren't lied about. Risk: Undermines the emotional core.
      *   *Option C: The "Ongoing Consent" Model.* Consent isn't a one-time gate; it's a continuous process. The lie breaks the *foundation*, but subsequent choices can be valid *if* they are based on reasons independent of the lie.
      *   *Option D: The "Relational Autonomy" Model.* Her agency was compromised but not erased. The lie distorted the context, making consent "impaired" rather than "void." (But the user wants "void".)
      *   *Option E: Distinguishing "Status" from "Act".* The *status* of marriage is voidable. Specific *acts* within it might stand unless they relied specifically on the hidden fact.

  4.  **Developing a Principled Framework:**
      *   I need to help the user distinguish between *foundational consent* (entering the status) and *transactional consent* (specific acts within the status).
      *   *Key Distinction:* **Materiality.** Did the lie matter to *this specific choice*?
          *   Marriage: Yes, fundamental.
          *   Mortgage: Maybe. Did she sign because they were a family unit, or because she could afford it? If the child support payments would have ruined the mortgage application, then that consent is also tainted.
          *   Relocation: Did she move for *his* career or *their* life? If the hidden child ties him to a location, her move is tainted.
          *   Intimacy: This is tricky. In many jurisdictions, fraud regarding STIs or identity voids sexual consent. Fraud regarding "willingness to be a parent" is murkier but morally weighty.
      *   *Key Distinction:* **Independence of Will.** Did she have a chance to re-evaluate? If she suspected something and stayed, does that ratify the contract? (The user wants to avoid this if possible to maintain the "wronged" status).
      *   *Key Distinction:* **The "But-For" Test.** But for the lie, would she have done X?
          *   Marriage: Definitely no.
          *   Mortgage: Maybe yes, maybe no.
          *   Intimacy: Would she have slept with him last Tuesday if she knew on Monday?

  5.  **Addressing the "Concession" Fear:**
      *   The user worries that validating *any* downstream choice concedes that deception-procured consent can be valid.
      *   *Rebuttal:* No. It concedes that *new* consent can overwrite *old* voided consent, OR that some choices rely on facts *other* than the lied-about fact.
      *   *Refinement:* It's not that the original consent becomes valid. It's that new consent can be generated based on *current* reality, provided the agent has the capacity and information to choose *now*. However, if the lie creates a continuing state of dependency or distortion, new consent is also compromised.

  6.  **Structuring the Response:**
      *   **Validate the Premise:** Acknowledge the philosophical strength of "fraud vitiates consent."
      *   **Introduce the Distinction:** Separate *Foundational Consent* (the marriage contract) from *Transactional Consent* (daily acts).
      *   **Propose a Test:** The "Material Reliance" Test. (Did this specific act rely on the lie?)
      *   **Explore the "Continuing Fraud" Aspect:** The lie isn't just a past event; it's an ongoing concealment. This keeps the well poisoned longer.
      *   **Address the Agency Problem:** If *everything* is void, she becomes a puppet. To keep her a character, some agency must exist, even if constrained.
      *   **Narrative Implications:** How this affects the story's tension.
      *   **Philosophical/Legal Precedents:** Briefly touch on contract law (fraud in the inducement) and sexual consent jurisprudence to ground the "rigor."

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I must be careful not to give legal advice. Frame this as narrative philosophy/ethics.
      *   *Nuance:* The user says "consent obtained by deception is void." I need to respect that axiom.
      *   *Solution:* The radius isn't about *time*, it's about *causal dependency*.
      *   *Idea:* Use the concept of "Ratification." If she finds out and stays, does she ratify? The user implies she doesn't know yet. So the fraud is *continuing*.
      *   *Crucial Point:* The lie isn't a one-time event at the altar. It is a daily renewal of the deception. Therefore, consent is voided *continuously* for as long as the secret is kept, *but only regarding things tied to the secret.*
      *   *Wait, better point:* Distinguish between **Identity/Status** and **Specific Acts**.
      *   *Best Framework:* **Causal Proximity.** How directly does the act depend on the marital status defined by the lie?

  8.  **Finalizing the Advice:**
      *   Don't treat it as "All or Nothing."
      *   Treat it as "Causal Contamination."
      *   If the mortgage relied on joint income that would have been different had she known (e.g., she wouldn't have married him, so no joint income), it's tainted.
      *   If the intimacy relies on the exclusivity/trust of marriage, it's tainted.
      *   If she buys a coffee with her own money, that's probably not tainted.
      *   *The "Radius" is defined by Dependency.*
      *   This solves the "concession" worry: You aren't saying the original consent was valid. You are saying some acts are *independent* of that consent.

  9.  **Drafting the Response:** (Mental Outline)
      *   Intro: Acknowledge the strength of the premise.
      *   Core Concept: Causal Dependency vs. Temporal Sequence.
      *   The "Continuing Fraud" Doctrine (The lie is active, not passive).
      *   The "Materiality" Test (Did this specific choice depend on the lie?).
      *   The Agency Trap (Avoid making her a non-person).
      *   Narrative Strategy (Use the gradient of contamination for plot points).
      *   Conclusion: Rigor comes from causality, not totality.

  10. **Review against Constraints:**
      *   Tone: Intellectual, supportive, rigorous.
      *   No legal advice disclaimer (implicit in framing as narrative/philosophical).
      *   Address the specific fear about conceding validity.

  11. **Final Polish:** Ensure the distinction between "void ab initio" (from the start) and "voidable" is clear in a philosophical sense, even if not strictly legal. Focus on the *moral* architecture. (Self-correction: Keep it focused on the novel's ethics, not actual law).

  *(Self-Correction during final review)*: I need to make sure I answer the specific question: "Is there a principled way to fix the radius... must I treat all... as unconsented?"
  *Answer:* No, you don't have to treat all as unconsented. The principle is **Reliance**. If an act relies on the truth of the marriage, it's void. If it relies on independent facts, it might stand. This doesn't validate the original deception; it acknowledges independent agency in unrelated spheres.

