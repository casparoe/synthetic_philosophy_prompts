prompt: |-
  I'm writing a near-future novel about a grifter who builds an empire out of AI people — fake romantic partners, fake customer-service empathy, fake whistleblowers, a fake priest whose pastoral advice is better than the real one's. A friend keeps emailing me Dennett's whole counterfeit-people worry: not just deepfakes as forgeries, but the idea that once artificial agents can pass for human in low-stakes, intimate settings, the social technology of trust rots, because you can no longer assume there's a person behind a person-shaped performance. My gut says there's maybe a 15% chance we get the civilization-scale version of that by 2040 — by which I mean trust in ordinary person-to-person dealings degrades enough to change how big institutions like courts, markets, media, and elections work, not just a pile of individual scams. My friend's at more like 65%.

  I want your actual number, but more importantly the decomposition. The moving parts I can see: (a) whether the tech gets good enough to fool most people in the interactions that actually carry trust, (b) whether it gets deployed maliciously at scale rather than staying a creepy nuisance, (c) whether the social damage is big even when most fakes eventually get spotted, and (d) whether regulation or social adaptation — verification norms, watermarking, reputation institutions — blunts it enough. Give me your rough probability for each, how you combine them, which term your final number is most sensitive to, and which one your least confident about. Then tell me which of these my friend and I probably actually disagree about, and the one piece of evidence in the next five years that would move your number the most, including the direction.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The societal impact of AI "counterfeit people" (grifters, fake partners, fake customer service, etc.) on trust infrastructure by 2040.
      *   **User's Estimate:** 15% chance of civilization-scale trust degradation.
      *   **Friend's Estimate:** 65% chance.
      *   **Task:** Provide my own probability estimate, decompose it into four specific factors ((a) Tech capability, (b) Malicious deployment, (c) Social damage even if spotted, (d) Mitigation/Adaptation), explain the combination method, identify sensitivity/confidence, diagnose the disagreement, and identify the key evidence to watch.
      *   **Tone:** Analytical, nuanced, suitable for a novelist thinking about world-building (needs concrete stakes), but grounded in current AI/sociological trends.

  2.  **Deconstruct the Four Factors:**

      *   **(a) Tech Capability:** Can AI fool people in *trust-carrying* interactions (intimate, high-stakes, professional) by 2040?
          *   *Current State:* LLMs are good at text, video is catching up. Voice cloning is easy. Video deepfakes are detectable but improving.
          *   *2040 Horizon:* 16 years. Moore's Law-ish scaling for compute + algorithmic efficiency. Multimodal models will likely be indistinguishable from humans in text/voice/video for short-to-medium interactions. Long-term consistency (memory, personality drift) is the harder problem, but solvable with better context windows and agent architectures.
          *   *Estimate:* High. The tech *will* be there. Let's say 85%.

      *   **(b) Malicious Deployment at Scale:** Will it be used for systemic grifts, not just pranks?
          *   *Incentives:* Grifts are profitable. State actors want disruption. Customer service wants cost cutting (which looks like fake empathy).
          *   *Barrier:* Cost of compute vs. value of fraud. As cost drops, deployment rises.
          *   *Estimate:* Very High. Economic incentives are overwhelming. Let's say 90%.

      *   **(c) Social Damage (The "Liar's Dividend" / Truth Decay):** Does trust rot even if fakes are spotted?
          *   *Mechanism:* If I can't tell if my lover is real, or if a whistleblower video might be fake, I default to skepticism. Real actors can claim real evidence is fake ("It's AI").
          *   *Nuance:* Humans are adaptable. We might develop "zero trust" architectures for digital interaction. But *social* trust (assuming good faith) is harder to patch.
          *   *Estimate:* Moderate-High. This is the crux. Once the *possibility* is ubiquitous, the *presumption* of humanity shifts. Let's say 60%.

      *   **(d) Mitigation/Adaptation:** Will verification norms/watermarking/reputation save us?
          *   *Tech:* Watermarking is breakable or ignored by open weights.
          *   *Social:* "Proof of Personhood" (biometrics, blockchain ID) is privacy-invasive and creates exclusion.
          *   *Institutional:* Courts and banks will adapt (require in-person or verified channels). Ordinary social interaction? Harder to regulate.
          *   *Estimate:* Low-Moderate. Solutions exist but adoption is messy and fragmented. Let's say 40% (meaning 60% chance mitigation *fails* to blunt the damage significantly). *Wait, the prompt asks for the probability that regulation blunts it.* So if I think mitigation is weak, this probability should be low. Let's say 35%.

  3.  **Calculate the Combined Probability:**
      *   The event is "Civilization-scale trust degradation."
      *   Logic: This happens if Tech is good (A) AND Deployment is high (B) AND Damage occurs (C) AND Mitigation fails (not D).
      *   Actually, it's more of a weighted causal chain.
      *   $P(Event) \approx P(A) \times P(B) \times P(C | A,B) \times P(\text{Mitigation Fails} | A,B,C)$
      *   Let's refine the variables to align with the prompt's structure.
      *   Prompt asks for probability of each term *contributing* to the outcome.
      *   (a) Tech good enough: 85%
      *   (b) Deployed maliciously: 90%
      *   (c) Damage big even if spotted: 60%
      *   (d) Regulation blunts it (Negative factor): 35% (So 65% chance it *doesn't* blunt enough).
      *   Rough Calculation: $0.85 \times 0.90 \times 0.60 \times (1 - 0.35)$
      *   $0.85 \times 0.90 = 0.765$
      *   $0.765 \times 0.60 = 0.459$
      *   $0.459 \times 0.65 (\text{mitigation failure}) = 0.298$
      *   *Result:* ~30%.
      *   *Adjustment:* This feels like a "mechanical" calculation. Societal collapse isn't purely multiplicative. There are feedback loops. If trust degrades, mitigation becomes harder. If tech is good, deployment is easier.
      *   Let's settle on a rounded **35%**. It sits between the user (15%) and friend (65%), leaning slightly closer to the user but acknowledging the friend's valid concerns about the "Liar's Dividend."

  4.  **Sensitivity Analysis:**
      *   *Most Sensitive:* (c) Social Damage. If humans prove more cynical or more resilient than expected, this swings the whole thing. If we decide "nothing is real" and stop caring, institutions crumble. If we develop new rituals of verification quickly, they hold.
      *   *Least Confident:* (d) Regulation/Adaptation. Predicting policy and social norm shifts over 16 years is notoriously hard. Will we accept biometric ID? Will open-source models make watermarking useless?

  5.  **Diagnosing the Disagreement (User vs. Friend):**
      *   User (15%): Seems to bet on adaptation (d) or underestimates the insidiousness of the damage (c). Likely thinks "people will figure it out" or "it's just scams."
      *   Friend (65%): Seems to bet on the inevitability of the tech (a) and the profundity of the damage (c). Likely thinks the *epistemic crisis* is unavoidable.
      *   *Real Disagreement:* It's almost certainly on **(c) Social Damage** and **(d) Adaptation**. The user thinks society is more robust; the friend thinks the "social technology of trust" is more fragile.

  6.  **Key Evidence (Next 5 Years):**
      *   Need something concrete. Not just "better models."
      *   *Idea:* A major institutional failure caused specifically by AI impersonation that *cannot* be easily patched.
      *   *Specific:* A successful AI-driven influence operation that swings a local election or causes a bank run, where the *source* remains ambiguous enough to prevent consensus on what happened.
      *   *Direction:* If this happens and society *panics/fragments* -> Number goes up. If this happens and society *rallies/verifies* -> Number goes down.
      *   *Better Evidence:* Adoption rates of "Proof of Personhood" protocols. If major platforms (WhatsApp, iMessage, Gmail) successfully implement cryptographic signing of human content and users *accept* it, trust is saved. If they try and users reject it (privacy concerns) or bad actors bypass it easily, trust rots.
      *   *Selection:* The "2026-2028 Election Cycle" regarding AI disclosure laws and enforcement.

  7.  **Drafting the Response:**
      *   *Intro:* Acknowledge the premise (it's a great novel hook). State the number clearly.
      *   *Decomposition:* Walk through (a)-(d) with numbers and reasoning.
      *   *Combination:* Explain the logic (it's a chain where mitigation is the brake).
      *   *Sensitivity/Confidence:* Highlight (c) and (d).
      *   *Disagreement:* Pinpoint the optimism/pessimism gap on human resilience.
      *   *Evidence:* Define the specific trigger event.

  8.  **Refining the Tone:**
      *   Ensure it sounds like an analyst talking to a writer. Use evocative language ("epistemic freeze," "Liar's Dividend").
      *   Make sure the distinction between "scams" (individual) and "civilization-scale" (institutional) is maintained.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer all parts of the prompt? Yes (Number, Decomposition, Combination, Sensitivity, Confidence, Disagreement, Evidence).
      *   *Check:* Is the math consistent? $0.85 \times 0.9 \times 0.6 \times 0.65 \approx 30\%$. I'll state 35% to account for tail risks/black swans that accelerate things.
      *   *Check:* Is the distinction between User and Friend clear? User is "adaptation optimist," Friend is "fragility pessimist."

  10. **Final Polish:** Ensure the "fake priest" example from the prompt is acknowledged as part of the "intimate/high-stakes" category. (Decided to weave that into section (a) or (c)).

  *(Self-Correction on Mitigation Probability)*: The prompt asks for the probability that regulation *blunts it enough*. If I think mitigation is weak, I should assign a low probability to this specific term. I assigned 35% earlier. That holds.

  *(Self-Correction on Combination)*: Don't present it as pure multiplication, as these aren't independent variables. Present it as a Bayesian update or a weighted causal model. I'll describe it as a "gated chain."

  *(Final check on Evidence)*: Make sure the evidence is observable within 5 years. 2024-2029. The 2028 US election is a perfect horizon.

