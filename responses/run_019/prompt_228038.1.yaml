  5: (i) *The sun will rise tomorrow.* (Feature 2: Inherited habit. Feature 3: Weakens—it is subject to astronomical falsification.)
  4: (e) *My name is X.* (Feature 2: Socially inherited. Feature 1: Tension—verified administratively.)
  3: (c) *Water boils at 100°C.* (Feature 1: Fails—we satisfy ourselves via experiment. Feature 3: It is the object of testing, not the background.)
  2: (g) *Plate tectonics.* (Feature 1: Absent. Feature 3: Explicitly verified/corrected theory.)
  1: (j) *Universe is a simulation.* (Feature 3: Fails—actively questioned, not the background *for* judgment.)

  **Surprising Pair:** (f) > (a). Standard Moorean readings treat (a) as the paradigm hinge. However, §94's "functional role" favors (f). Verifying hands presupposes objects persist unobserved during the blink. (f) is the deeper inherited background against which (a) is distinguished as true/false. (a) risks becoming an empirical claim ("satisfying myself"), whereas (f) resists verification entirely, fitting §94's first clause better. This prioritizes the *logic* of the background over the *psychology* of certainty.

  **Indeterminacy:** (e). §94's "inheritance" is ambiguous. Is a name inherited culturally or verified administratively? To settle this, we need §150 (contextual usage) or §67 (family resemblances) to determine if the name functions as a rule or a fact in the specific language-game. §94 alone cannot distinguish the bureaucratic from the existential.

  **Meta-Question:** Hinge-status is relative, not simpliciter. §94's "inherited background" implies a lineage—a community or form of life from which the background is received. What is inherited for one community may be empirical for another. §94 suggests this relativity via "inherited," but does not settle it definitively; it requires §97 ("hardening" of propositions) to explain how water becomes riverbed over time within specific historical moments. The text points to sociological relativity without explicitly theorizing it. Thus, §94 offers a diagnostic tool (inheritance) rather than an ontological classification. Hinge-status is a property of a proposition's *use* within a form of life, not its intrinsic content.
