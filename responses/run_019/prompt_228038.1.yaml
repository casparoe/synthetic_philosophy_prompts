  10: (f) *Objects persist unobserved.* (Feature 1: Verification impossible. Feature 2: Inherited realism. Feature 3: Constitutes the framework for testing.)
  9: (b) *Earth existed before birth.* (Feature 1: Not verified. Feature 2: Inherited history. Feature 3: Frames personal existence.)
