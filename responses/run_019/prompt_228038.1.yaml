  Based on §94, scores reflect the degree to which a proposition functions as an unverified, inherited background for judgment. I weigh three features: (1) absence of verification ("satisfying myself"), (2) inherited character, and (3) functional role as the background for distinguishing true/false. Where features conflict, functional role dominates.

