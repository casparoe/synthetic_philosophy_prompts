answer: |-
  ### Brainstorming Candidate Scenarios

  1.  **The Workplace Safety Violation:** Person A (manager) and Person B (peer) blame an intern for not wearing goggles. A doesn't wear goggles; B always does.
      *   *Reject:* It is too difficult to engineer B's lack of standing without making B appear morally indifferent to safety generally, which conflates lacking standing with being a bad person, rather than lacking the specific relational authority to blame.
  2.  **The Confidentiality Breach:** Person A and Person B blame a friend for leaking a secret. A has leaked secrets before; B has not.
      *   *Reject:* To give A standing, I would need to suggest A is "reforming," which weakens the hypocrisy constraint (A must be *currently* doing the wrong), or else A's insincerity makes the intuition that she has standing too weak to carry the theoretical weight.
  3.  **The Filial Duty Violation (Selected):** Person A and Person B blame a sibling for neglecting an elderly parent. A also neglects the parent but affirms the duty; B never neglects the parent but rejects the duty as optional.
      *   *Accept:* This cleanly separates behavioral compliance from normative endorsement, allowing the "commitment view" to flip the verdicts without denying the reality of A's hypocrisy or B's innocence.

  ***

  ### The Scenario

  During a family meeting about their aging mother's care, David admits he skipped his scheduled visit again. Sarah, who also missed her visit last week due to work overload, rebukes him for violating their filial duty, while Mark, who has never missed a visit, says nothing. Mark's perfect attendance stems from treating visits as optional leisure he enjoys, explicitly rejecting the idea that children *owe* their parents care, whereas Sarah, despite her recent failures, is the one enforcing the schedule because she deeply affirms the obligation of filial duty even when she struggles to meet it.

  ***

  ### Analysis of the Case

  **1. The Pure Non-Hypocrisy Account**
  On the standard view widely discussed in the literature (e.g., Wallace, Fritz), hypocrisy regarding the specific wrong in question is a *pro tanto* defeater for standing. Because Sarah (Person A) is guilty of the very same neglect she denounces, she lacks the moral authority to blame David; her blame is structurally undermined by her own conduct. Conversely, Mark (Person B) has a spotless record regarding this wrong. Since he has not violated the norm he is invoking, the non-hypocrisy account grants him standing. This yields the verdicts the thought experiment aims to challenge: Sarah lacks standing, Mark has it.

  **2. The Commitment- or Participation-Based View**
  A commitment-based view (akin to authority-based accounts suggested by philosophers like Macnamara or Bell) argues that standing flows from acknowledging the norm's authority and participating in the practice of holding others to it, rather than mere personal compliance. Sarah retains standing because she explicitly endorses the norm of filial duty as binding; her failure is a weakness of will within a framework she accepts, preserving her authority to enforce that framework. Mark lacks standing because, despite his compliance, he rejects the norm's bindingness; he treats the visits as leisure, meaning he lacks the moral authority to hold David to an obligation he does not recognize. On this view, Sarah has standing, Mark does not.

  **3. The Single Detail Doing All the Work**
  The critical detail is the **agent's attitude toward the norm's bindingness** (endorsement vs. indifference). If you strip this out and leave only the behavioral record (Sarah misses visits, Mark does not), the case collapses back into the standard non-hypocrisy verdicts. Without knowing *why* Mark complies (leisure vs. duty) or *why* Sarah fails (overwhelm vs. rejection), we have no wedge to separate compliance from authority.

  **4. Steelmaning the Non-Hypocrisy Theorist**
  A non-hypocrisy theorist would argue that moral authority requires "clean hands" to prevent moral tyranny; even if Sarah affirms the norm, her violation demonstrates she does not take it seriously enough to warrant imposing it on others. They might concede that Mark's compliance is "hollow" without endorsement, but insist that hollow compliance is still a necessary condition for standing—you cannot enforce a rule you break, regardless of your internal attitude. However, this attack concedes the crucial point: that mere compliance (Mark's behavior) is insufficient for the *kind* of relation to a norm that grounds standing, even if they maintain compliance is necessary.

  ***

  ### Epistemic Clarification

  It is basically settled ground among philosophers working on standing (e.g., R. Jay Wallace, Philip Robichaud, Janice Dowell) that hypocrisy is at least a *pro tanto* defeater for standing; few argue that a hypocrite *always* retains full standing. What is genuinely contested is whether compliance is a *necessary* condition for standing, or whether normative endorsement (commitment) can suffice. Furthermore, it is contested whether standing is distinct from the aptness of the blame's content; some argue that if the blame is accurate, standing is merely a conversational nicety, while others (like the commitment view) argue standing is a distinct moral permission rooted in authority. The scenario above leverages this contested ground to challenge the necessity of compliance.

