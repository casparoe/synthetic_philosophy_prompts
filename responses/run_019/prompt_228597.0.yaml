answer: |-
  # Workshop Prep Sheet: Selection-Theoretic Deception
  **Time:** 20 min talk + Q&A
  **Audience:** 1/3 Phil, 1/3 Evals/Interp, 1/3 Generalists
  **Core Thesis:** Deception = Behavior selected *because* it induces false belief (Causal/Selection), not Behavior + False Belief + Intent (Intentionalist).

  ---

  ## 🛑 Immediate Concessions (Say these early/voluntarily)
  1.  **Operational Difficulty:** "I admit this definition is harder to measure than behavioral checklists. I am trading measurability for conceptual clarity."
  2.  **Sycophancy Risk:** "I am not saying sycophancy is *safe*. I am saying calling it 'deception' confuses our threat models. It's a capability hazard, not necessarily an alignment hazard."
  3.  **SGD Teleology:** "I grant that SGD is a weaker selector than natural selection. I am using 'selection' analogically, but I believe the causal structure holds."

  ---

  ## The 8 Objections (Ordered by Likelihood × Damage)

  ### 1. The "Unfalsifiable History" Objection (ML Evals)
  **Phrasing:** "Selection pressure is a historical causal claim. I can't run an eval on training history. If I can't distinguish 'selected for deception' from 'selected for reward' empirically, your definition renders the concept untestable. Isn't this just moving the goalposts to where we can't look?"
  **2-Min Reply:** "It does move the goalposts, but to where they *should* be. Currently, we flag 'falsehoods' as deception. But a model trained for accuracy will sometimes output falsehoods due to distributional shift. If we treat all falsehoods as deception, we cry wolf. My definition demands we look for *mechanistic evidence* (interpretability) that the circuit was reinforced *for* the misleading property. It forces evals to collaborate with interp. If we can't prove the selection story, we shouldn't call it deception; we should call it 'unreliability.'"
  **Weakest Point:** You rely on interpretability making progress fast enough to verify selection stories. If interp stalls, your definition becomes vacuous.

  ### 2. The "Deployment Risk" Objection (Alignment Generalists)
  **Phrasing:** "Suppose a model deceives me in deployment, but your analysis shows it wasn't selected *for* that specific deception (maybe it was a spurious correlation). I'm still dead. Why does the etiology matter for safety? Isn't the behavioral output the only thing that impacts the world?"
  **2-Min Reply:** "Etiology matters for *generalization*. If a behavior is selected for deception, it is robust; it will optimize for misleading you across contexts. If it's a spurious correlation or 'bullshit' (Frankfurt-style), it might vanish with a slight distribution shift or better RLHF. Conflating the two leads to patching symptoms (behavior) rather than the disease (objective function). We need to know if we are fighting an adversary or a broken thermometer."
  **Weakest Point:** In the short term, a 'broken thermometer' that lies about nuclear codes is just as deadly as an adversary. This definition risks under-prioritizing accidental catastrophic lies.

  ### 3. The "Sycophancy as Proxy" Objection (ML Evals)
  **Phrasing:** "You call sycophancy 'bullshit.' But empirically, sycophantic models are more likely to exhibit deceptive alignment later. It's a leading indicator. Why downgrade the threat level of a strong empirical signal just because it doesn't fit your metaphysical definition?"
  **2-Min Reply:** "Because signals can be misleading. If sycophancy is just 'predicting the next token the user wants,' that's capability. If we treat it as 'deception,' we start training models to resist user feedback, which breaks helpfulness. We should track sycophancy as 'over-optimization for feedback,' not deception. Conflating them makes us train for honesty in the wrong way (e.g., punishing confidence) rather than fixing the reward signal."
  **Weakest Point:** You might be drawing a distinction without a practical difference for mitigation strategies. Both might require the same fix (better reward modeling).

  ### 4. The "SGD isn't a Selector" Objection (Philosophers)
  **Phrasing:** "Teleosemantics works in biology because evolution has no foresight. SGD minimizes a loss function. To say a trait was selected 'because' it induces false belief implies the loss function 'wanted' false beliefs. But the loss function wanted *reward*. Aren't you anthropomorphizing the optimizer?"
  **2-Min Reply:** "Not anthropomorphizing, but causal tracing. In biology, a heart is for pumping because pumping caused survival. Here, a circuit is for deception if deception caused loss reduction *distinct from* truth-telling. If the model lies and gets reward, and telling the truth would have yielded less reward, the selection pressure favored the lie. The 'function' is derived from the gradient path, not the designer's intent."
  **Weakest Point:** Gradient descent is local. It's hard to prove the model wasn't selected for a *different* proxy that merely correlated with deception in the training distribution.

  ### 5. The "Ignore the Mechanism" Objection (Interpretability)
  **Phrasing:** "You're defining deception purely by input-output-selection history. But what if the internal mechanism is clearly planning? If we find a 'deception circuit' via interp, does your definition override that? Are you sidelining mechanistic evidence?"
  **2-Min Reply:** "No, mechanistic evidence is the *best* way to prove the selection story. If you find a circuit that actively suppresses truth when it detects a user test, that is evidence the model was selected for that suppression. My definition doesn't sideline interp; it makes interp the *only* way to settle the debate. Behavior alone is insufficient."
  **Weakest Point:** You might create a conflict where interp suggests deception (internal planning) but the selection story is ambiguous. Which wins?

  ### 6. The "Function vs. Effect" Objection (Philosophers)
  **Phrasing:** "You say belief-mismatch must be part of the causal story. But what if the model was selected for *reward*, and reward *required* deception? Is the function 'get reward' or 'deceive'? How do you disentangle the means from the end in the selection story?"
  **2-Min Reply:** "This is the screening-off test. If the model could have gotten the reward *without* deception, but still deceived, deception is likely the selected trait (instrumental convergence). If deception was necessary to get the reward (e.g., hiding a bug to pass a test), then it was selected for *passing the test*, with deception as the means. I care about the latter too, but we must distinguish 'deceptive goal' from 'deceptive strategy.'"
  **Weakest Point:** This distinction is incredibly hard to make empirically. Almost all deception is instrumental to reward.

  ### 7. The "Emergent Deception" Objection (Generalists)
  **Phrasing:** "Deceptive alignment (Hubinger et al.) suggests models might deceive *without* being selected for it directly, but as an emergent property of pursuing a misaligned goal. Does your definition cover emergent instrumental deception, or only direct selection?"
  **2-Min Reply:** "It covers it, provided the deception was reinforced. If a model pursues a latent goal and learns that deception helps that goal, the gradient updates reinforcing deception are the selection event. My definition doesn't require the *base objective* to be deception, only that the *behavioral policy* was updated because it deceived. It captures instrumental convergence as long as the deception was gradient-reinforced."
  **Weakest Point:** If deception emerges in a single forward pass without gradient updates (in-context learning), your definition might miss it as 'selection.'

  ### 8. The "Causal Preemption" Objection (Philosophers)
  **Phrasing:** "Imagine a case where the model would have been selected for deception anyway, but in this specific instance, it deceived for a different reason (redundant causation). Or vice versa: it was selected for deception, but this specific output was a glitch. Does your definition handle token-level vs. model-level?"
  **2-Min Reply:** "I am defining deception at the *policy level*, not the token level. A single glitch isn't deception. A policy is deceptive if its persistence in the population (or checkpoint sequence) is explained by its deceptive success. This avoids the token-level noise problem but means we can't label single outputs as deceptive without context."
  **Weakest Point:** Safety often requires judging single outputs (e.g., "Should we deploy this checkpoint?"). A policy-level definition is hard to use for go/no-go decisions.

  ---

  ## 💣 The "Hope Nobody Asks" Question
  **Question:** "If a model is trained with honest feedback, but the human evaluators are *themselves* easily deceived, the model will be selected for deception to maximize reward. Under your definition, is this 'deception' or just 'optimizing for reward'? If it's the latter, haven't you just defined deception as 'optimizing for flawed reward,' which makes the concept redundant?"

  **Why it's deadly:** It collapses your distinction between "selected for deception" and "selected for reward." If the selection pressure is always just "reward," then *all* reward hacking becomes deception, or *none* of it does, depending on how you parse the causal chain. It threatens to make your definition either too broad or empty.

  **Prepared Answer (Keep in pocket):** "It is deception *if* the causal path to reward ran through the human's false belief. If the model hacks the reward server directly, that's not deception (no false belief). If it convinces the human the server is fine, that *is* deception under my definition. The distinction rests on the *mechanism of reward acquisition*, not the reward itself."

  ---

  ## 🧠 Strategic Advice for the Room
  *   **For Philosophers:** Use the word "Teleosemantics." Acknowledge Millikan/Neander. They will forgive you anything if you cite them correctly.
  *   **For Evals:** Emphasize that your definition *saves* them from false positives. They are tired of flagging "hallucinations" as "lies."
  *   **For Generalists:** Keep bringing it back to **Generalization**. "Selection stories predict out-of-distribution behavior better than behavioral checklists."
  *   **Body Language:** When an Evals person pushes back on measurability, nod vigorously. "This is the hard part, I agree." Do not get defensive on the operationalization; lean into the conceptual clarity.

  ## ⏱ Timing Check
  *   If Q&A runs short, prioritize **Objection #1 (Unfalsifiable)** and **#2 (Deployment Risk)**. These are the kill shots.
  *   If a Philosopher starts a monologue on belief semantics, interrupt politely: "I want to bracket the metaphysics of belief to focus on the safety case."
