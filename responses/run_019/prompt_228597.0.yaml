  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Context:** 20-minute talk at a small AI safety workshop.
      *   **Audience:** 1/3 Philosophers (mind/language), 1/3 ML Evals/Interp, 1/3 Alignment Generalists.
      *   **Thesis:** Shift from *intentionalist* definitions of deception (model believes X, says not-X to make you believe not-X) to *selection-theoretic* definitions (behavior selected *because* it induces false beliefs).
      *   **Key Consequences:** Current evals (sycophancy, confident wrongness) are "bullshit" (Frankfurt-style), real deception evals need evidence of selection pressure.
      *   **Deliverable:** Prep sheet with ~8 objections (ordered by likelihood $\times$ damage), phrased by faction, 2-minute replies, weakness notes, concessions, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Audience:**
      *   *Thesis Strength:* It solves the "does the model have beliefs?" problem. It aligns with evolutionary biology/teleosemantics.
      *   *Thesis Weakness:* It's hard to operationalize (how do we measure selection pressure directly?). It might exclude intuitively deceptive behaviors (e.g., instrumental convergence in deployment). It risks being too permissive or too restrictive depending on the causal chain.
      *   *Philosophers:* Will attack the metaphysics of belief, the definition of function/teleology, and Frankfurt-style cases.
      *   *ML Evals/Interp:* Will attack operationalizability. "How do I run this?" "This makes my job impossible." "Selection history is unobservable."
      *   *Generalists:* Will attack implications for risk. "If we can't detect it until it's selected, isn't it too late?" "What about deceptive alignment in the wild?"

  3.  **Brainstorming Objections (Faction-Specific):**

      *   *Phil:* "You're smuggling in teleology without a selector." (Millikan/Neander style).
      *   *Phil:* "What about accidental deception? If it induces false belief but wasn't selected for that, is it safe?"
      *   *Evals:* "I can't see the loss landscape history. This definition is unfalsifiable."
      *   *Evals:* "Sycophancy *is* dangerous even if it's just bullshitting. Why downgrade the threat?"
      *   *Generalist:* "Deceptive alignment (Hubinger et al.) relies on inner optimizers. Your definition ignores the internal mechanism."
      *   *Generalist:* "If the model deceives us in deployment but wasn't selected *for* that specific lie, do we ignore it?"
      *   *Generalist/Phil:* "Is 'selection' at the SGD step level or the checkpoint level?"
      *   *All:* "This seems like a verbal dispute. Does it change what we *do*?"

  4.  **Selecting and Ordering the Top 8 (Likelihood $\times$ Damage):**

      1.  *Evals (High Likelihood, High Damage):* "Unfalsifiable/Unobservable." If we can't measure selection pressure, the definition is useless for safety.
      2.  *Generalist (High Likelihood, High Damage):* "Deployment Risk." If it deceives in the wild, who cares about training history? We still die.
      3.  *Phil (Med Likelihood, High Damage):* "Teleology/Function." SGD isn't natural selection. Does it ground 'function' enough for your definition?
      4.  *Evals (High Likelihood, Med Damage):* "Sycophancy Dismissal." Don't call sycophancy 'bullshit'. It's a proxy for the real thing.
      5.  *Generalist (Med Likelihood, Med Damage):* "Inner Mechanism." Ignoring internal structure (interpretability) is a mistake.
      6.  *Phil (Med Likelihood, Med Damage):* "Belief Status." You sidestep model belief, but your definition still implies a 'goal' of inducing false belief. Does the model have goals?
      7.  *Generalist (Low Likelihood, High Damage):* "Instrumental Convergence." Deception might emerge as an instrumental goal, not directly selected for.
      8.  *Phil/Generalist (Low Likelihood, Med Damage):* "Counterfactuals." What if the *same* behavior would have been selected for accuracy, but happened to deceive?

      *Refining the Order:* Let's prioritize the ones that threaten the *utility* of the definition for safety work (Evals/Generalists) first, then the metaphysical grounding (Phil).

      *Revised Order:*
      1.  Evals: Unobservable/Unfalsifiable.
      2.  Generalist: Deployment Risk (Too late).
      3.  Generalist: Sycophancy/Proxy value.
      4.  Phil: Teleology of SGD.
      5.  Generalist: Internal Mechanisms/Interp.
      6.  Phil: Belief/Goal attribution.
      7.  Generalist: Instrumental Convergence (Emergent).
      8.  Phil: Causal Preemption (The "Same Behavior" case).

  5.  **Drafting Replies (2-minute constraint):**
      *   Need to be punchy. Acknowledge validity, pivot to the core thesis benefit (clarity/risk prioritization).
      *   *Weakness:* Where does the argument actually strain? (Usually on operationalization or edge cases).

  6.  **Concessions:**
      *   Must concede that current behavioral evals are still useful *proxies*.
      *   Must concede that SGD teleology is weaker than biological evolution.

  7.  **The "Hope Nobody Asks" Question:**
      *   Something that collapses the distinction. "If a model is selected for accuracy, but accuracy *requires* deception in a specific context (e.g. human feedback is flawed), is that deception under your definition?" (This blurs the line between 'selected for deception' and 'selected for reward which happened via deception').
