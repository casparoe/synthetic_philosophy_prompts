answer: |-
  Here is the **Invariant/Variable Protocol (IVP)**. It is designed for a 20-minute review window. It forces your leads to stop arguing about "vibe" and start arguing about structural integrity.

  Following the protocol, I have committed to the specific load-bearing invariants for your current theme, ran the three pitches through the system, and flagged where the model stretches.

  ***

  # Part 1: The Invariant/Variable Protocol (IVP)

  **Timebox:** 20 Minutes
  **Participants:** Narrative Lead, Design Lead, Writing Lead
  **Input:** One-page pitch + Core Theme Statement

  ### Step 1: Extract the Logical Tension (3 Minutes)
  Do not write a poetic sentence. Write a logical equation that defines the theme's conflict.
  *   **Bad:** "It's about loyalty beyond death."
  *   **Good:** "Agent maintains Obligation X despite Benefactor Y being unable to enforce or benefit from it."

  **Deliverable:** A single sentence with three slots: `[Agent]`, `[Obligation]`, `[Missing Constraint]`.

  ### Step 2: Define the Load-Bearing Invariants (5 Minutes)
  Based on the Logical Tension, define three conditions that **must** be true for the theme to exist. If any one of these is false, the pitch is not a variation; it is a different theme.
  *   **Constraint:** You are only allowed three.
  *   **Requirement:** Each invariant must be falsifiable (you can imagine a scenario where it is broken).

  ### Step 3: Map the Knobs (5 Minutes)
  Identify three variables in the pitch that *can* change without breaking the Invariants. These are your "safe" knobs (e.g., setting, gender, specific outcome).
  *   **Test:** If you turn this knob to the extreme, does it violate an Invariant? If yes, it is not a knob; it is a load-bearing beam. Move it to Step 2.

  ### Step 4: The Break Test (5 Minutes)
  Apply the **"Could They Stop?"** test.
  *   Ask: "Does the Agent have the physical and social capacity to abandon the Obligation?"
  *   If **No**: The pitch is about *Compulsion*, not *Promise*. (Shelve).
  *   If **Yes**: Proceed to Greenlight.

  ### Step 5: Flag the Smuggled Judgment (2 Minutes)
  Explicitly write down which decision relied on intuition rather than the protocol. This prevents the "rule" from becoming dogma that stifles creativity later.

  ***

  # Part 2: The Commitment (Load-Bearing Invariants)

  You asked me to pick the knobs that are load-bearing for your specific theme: **"A promise kept after the person who made it is gone."**

  Most teams treat this as a "mood." Under the IVP, we treat it as a mechanical state. I am committing to these three Invariants. If a pitch violates one, it is not your game.

  1.  **Volitional Continuation:** The Agent must possess the agency to break the promise. If the Agent *cannot* stop (due to programming, magic compulsion, or physical restraint), they are not "keeping" a promise; they are functioning.
  2.  **Obsolescence Awareness:** The Agent must know the Benefactor is gone and that the promise no longer serves its original functional purpose. If they think the Benefactor is watching, it is *Surveillance*, not *Posthumous Loyalty*.
  3.  **Net-Negative Cost:** Maintaining the promise must actively harm or drain the Agent in the present. If keeping the promise is profitable, convenient, or neutral, it is *Business*, not *Sacrifice*.

  **Defense of Commitment:**
  *   **Why Volitional?** Hofstadter's "knob" implies a system that could output differently. A machine that cannot output differently is a constant, not a variable. Without the possibility of betrayal, loyalty has no semantic weight.
  *   **Why Obsolescence?** If the promise still works (e.g., paying a debt to an heir), it's standard contract law. The theme requires the *context* to vanish while the *bond* remains.
  *   **Why Cost?** If there is no cost, there is no tension. The "knob" of creativity here is *how* they pay, not *if*.

  ***

  # Part 3: Running the Pitches

  Here is the IVP applied to your three pitches.

  ### Pitch 1: The Merchant and the Dead Courier
  *   **Concept:** A merchant continues delivering letters for a courier who died on the road.
  *   **Invariant Check:**
      1.  *Volitional:* **Pass.** The merchant could burn the letters.
      2.  *Obsolescence:* **Borderline.** Does the merchant know the recipients know the courier is dead? If the recipients still expect the courier, the merchant is impersonating. If the recipients know, the letters are relics.
      3.  *Cost:* **Fail.** A merchant is paid to deliver. Unless the route is now dangerous/unprofitable and they do it for free, this is *Commerce*, not *Promise*.
  *   **Verdict:** **SHELF / REWRITE.**
  *   **Reason:** It currently reads as "Job Completion." To pass, the merchant must lose money on every delivery and know the recipients don't expect the letters anymore.
  *   **Smuggled Judgment:** We are assuming "Merchant" implies profit motive. If the "merchant" is actually a beggar using the route to feel useful, it passes Cost.

  ### Pitch 2: The Villain and the Ghost City
  *   **Concept:** A warlord continues to send grain tribute to a city he burned down ten years ago.
  *   **Invariant Check:**
      1.  *Volitional:* **Pass.** He is the warlord; no one can stop him.
      2.  *Obsolescence:* **Pass.** The city is ash; no one is there to eat the grain.
      3.  *Cost:* **Pass.** Grain is resources lost to his own army.
  *   **Verdict:** **GREENLIGHT.**
  *   **Reason:** This is the anchor pitch. It perfectly isolates the tension of obligation without utility.
  *   **Smuggled Judgment:** None. This fits the Invariants cleanly.

  ### Pitch 3: The Machine and the Tyrant's Poison
  *   **Concept:** An automated terraforming machine continues poisoning the land per a dead tyrant's last command.
  *   **Invariant Check:**
      1.  *Volitional:* **FAIL.** A machine cannot choose to stop. It follows code.
      2.  *Obsolescence:* **Pass.** Tyrant is dead.
      3.  *Cost:* **Fail.** Machines do not feel cost.
  *   **Verdict:** **HARD NO.**
  *   **Reason:** This violates the core Hofstadterian premise of your project. A machine executing code is not "keeping a promise"; it is a hammer hitting a nail. It removes the *Agent* from the equation. It is a tragedy for the *victims*, but not a variation on *loyalty*.
  *   **Smuggled Judgment:** I am asserting that "Agency" is required for "Promise." If your game's theme is actually "The Horror of Unthinking Obedience," this pitch is a Yes. But for "A Promise Kept," it is a category error.

  ***

  # Part 4: Model Limitations & Judgment Flags

  You asked me to flag where this procedure leans on a contested reading of the knob-twiddling model.

  **1. The "Agency" Hardline (Contested)**
  *   **The Stretch:** Hofstadter often discusses systems (like ant colonies or neural nets) where "agency" emerges from non-agentic parts. By ruling out the Machine (Pitch 3), I am applying a humanist filter to a structuralist model.
  *   **The Risk:** If your game explores transhumanism, this Invariant will blind you to valid variations where the "Keeper" is a collective or an AI that *simulates* choice.
  *   **The Fix:** If you want to allow Pitch 3, you must change Invariant 1 from "Volitional Continuation" to "Perceived Volition." (i.e., Does the player *believe* it could stop?)

  **2. The "Cost" Requirement (Subjective)**
  *   **The Stretch:** I defined Cost as "Net-Negative." Hofstadter's knobs are often neutral permutations. I am smuggling in a specific *tone* (tragic/somber) into the procedure.
  *   **The Risk:** This kills comedic or triumphant variations. (e.g., A promise kept that accidentally makes the Keeper rich and happy).
  *   **The Fix:** If you want a lighter tone, change Invariant 3 to "Significant Effort," regardless of outcome.

  **3. The "Theme as Logic" Fallacy**
  *   **The Stretch:** This procedure treats theme as a rigid logical structure. Narrative theme is often fluid and emotional.
  *   **The Risk:** You may greenlight pitches that are structurally perfect but emotionally dead (Pitch 2 is structurally sound, but is it *fun*?).
  *   **The Fix:** Use IVP for *cohesion*, but add a separate "Emotional Resonance" check that is explicitly subjective. Do not try to logic-check feelings.

  ### Summary for your Leads
  1.  **Adopt the IVP.** It forces you to define the "Skeleton" before arguing about the "Flesh."
  2.  **Use my Three Invariants** for this specific theme until you formally vote to change them.
  3.  **Kill Pitch 3.** It breaks the Agency invariant.
  4.  **Fix Pitch 1.** Make it cost the merchant something real.
  5.  **Build on Pitch 2.** It is your true north.
