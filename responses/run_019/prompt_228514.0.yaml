prompt: |-
  I cover science and ideas for a magazine, and I'm working on a piece about how historians handle moral judgment. The profession has this strong norm against "presentism": you're not supposed to judge people in the past by today's moral standards. A biographer who calls a slaveholding founder a monster gets accused of anachronism; grad students are trained to reconstruct what was even thinkable at the time. But the same discipline happily judges past beliefs as flatly wrong -- nobody says it's unfair to call geocentrists mistaken just because geocentrism was reasonable back then. And meanwhile the public-facing side of the field (museum labels, building renamings, commemoration fights) increasingly does make moral calls. So what theory of morality does the anti-presentism norm actually presuppose? That moral claims are time-indexed while factual claims aren't? Is that coherent, or does it smuggle in a selective relativism the discipline would never avow? Could you defend the norm on purely epistemic grounds -- we have no more reason to trust our moral instincts than they had theirs -- without any relativism at all? And what would have to change in how history gets written and taught if historians treated moral knowledge as cumulative, the way they treat scientific knowledge?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user is a science/ideas magazine writer working on a piece about historians and moral judgment.
      *   **Core Tension:** The conflict between the professional norm against "presentism" (don't judge past actors by current standards) and the willingness to judge past *factual* beliefs as wrong (e.g., geocentrism). Plus, the tension with public history (museums, renaming) which *does* make moral calls.
      *   **Key Questions to Address:**
          1.  What theory of morality does the anti-presentism norm presuppose? (Time-indexed morality?)
          2.  Is that coherent, or is it selective relativism?
          3.  Can the norm be defended on purely *epistemic* grounds (skepticism about moral progress) without relativism?
          4.  What would change if historians treated moral knowledge as cumulative (like science)?

  2.  **Initial Brainstorming & Analysis:**

      *   *The "Presentism" Norm:* It's methodological, not necessarily metaphysical. It's about *understanding* vs. *judging*. If you judge too quickly, you stop understanding *why* they did it.
      *   *Fact vs. Value:* Historians treat facts (geocentrism) as cumulative because we have better data/models. They treat values as context-dependent. Why? Is it because morality *isn't* cumulative, or because accessing past morality requires suspension of judgment?
      *   *The "Time-Indexed" Theory:* This sounds like moral relativism or historicism. "Slavery was wrong then for us, but maybe not for them?" No, most historians believe slavery was *always* wrong, but judging the *actor* requires understanding their moral universe.
      *   *Epistemic Defense:* "We might be wrong too." This is moral humility. But is it enough to ban judgment?
      *   *Cumulative Morality:* If morality progresses like science (e.g., the "Expanding Circle" theory), then judging the past is not just okay, it's necessary to mark progress. But this risks Whig history (history as a march toward us).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. This is a central tension in the philosophy of history. Validate the user's premise (the fact/value asymmetry).

      *   **Question 1: What theory of morality does anti-presentism presuppose?**
          *   It's not necessarily *moral relativism* (truth changes).
          *   It's often *moral contextualism* or *historicist internalism*.
          *   Distinction: Judging the *act* vs. Judging the *agent*.
          *   The norm assumes moral knowledge is embedded in social practices, not just abstract principles. To understand the morality, you need the context.
          *   *Theory:* It presupposes that moral agency is constrained by the "horizon of the thinkable" (Koselleck).

      *   **Question 2: Is it coherent or selective relativism?**
          *   It risks incoherence if not careful.
          *   The Fact/Value asymmetry: We judge geocentrism wrong because we have better *tools* (telescopes, math). Do we have better *tools* for morality?
          *   If we say "Yes" (human rights), then anti-presentism looks like selective relativism.
          *   If we say "No" (moral intuition is shaky), then anti-presentism is consistent skepticism.
          *   *The "Public History" wedge:* Public history serves a different function (civic memory) vs. academic history (explanation). This explains the divergence but doesn't solve the philosophical tension.

      *   **Question 3: Can it be defended on epistemic grounds (without relativism)?**
          *   Yes. The "Epistemic Humility" argument.
          *   Analogy: We don't blame a doctor in 1800 for using leeches. We blame them for negligence *within their context*.
          *   Argument: Moral judgment requires counterfactuals ("They could have known better"). If the social epistemology didn't support that knowledge, the judgment is unhistorical.
          *   This isn't relativism (slavery wasn't *right*), it's about *culpability*.
          *   Reference: Bernard Williams ("relativism of distance").

      *   **Question 4: What if moral knowledge were cumulative (like science)?**
          *   This is the "Whig History" trap.
          *   If morality progresses, history becomes a story of error correction.
          *   *Changes in writing:* Less empathy for "complex" villains, more focus on dissenters/abolitionists who were "ahead of the curve."
          *   *Changes in teaching:* History becomes moral education (citizenship) rather than just critical thinking.
          *   *Risk:* Losing the ability to understand *why* bad things happened. If everyone was just "wrong," we miss the structural/systemic reasons.
          *   *Benefit:* Aligns with public history and social justice goals.

      *   **Synthesis/Conclusion:**
          *   The norm is methodological, not metaphysical.
          *   It's breaking down because the public demands moral clarity.
          *   The future might be a hybrid: Contextual understanding *plus* explicit moral evaluation, keeping them distinct but present.

  4.  **Refining and Polishing:**

      *   *Tone:* Intellectual, nuanced, suitable for a magazine writer (who likely knows the literature). Avoid oversimplification.
      *   *Key Concepts to Weave In:* Whig history, Bernard Williams, internalism vs. externalism, moral progress, social epistemology.
      *   *Check against the prompt:* Did I answer all four sub-questions?
          1.  Theory of morality? (Contextualism/Agency constraints).
          2.  Coherent or relativism? (Risks selective relativism, but distinguishes truth from culpability).
          3.  Epistemic defense? (Yes, via social epistemology/culpability).
          4.  Cumulative morality changes? (Whig history, focus on dissenters, civic function).

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say historians are just hypocrites.
      *   *Correction:* Too glib. The user wants the *theory* behind the norm. Focus on the distinction between *truth* and *blame*.
      *   *Initial thought:* Suggest morality *is* like science.
