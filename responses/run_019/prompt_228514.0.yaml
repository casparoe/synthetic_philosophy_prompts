answer: |-
  This is one of the most fertile tensions in the philosophy of history, and you've put your finger on the exact nerve: the asymmetry between how historians treat *factual error* (geocentrism) and *moral error* (slavery).

  To write this piece, you need to disentangle three different things that often get conflated in the "presentism" debate: **ontological claims** (what is true?), **epistemic claims** (what could they know?), and **evaluative claims** (how do we judge the agent?).

  Here is a breakdown of the theoretical landscape, structured around the questions you raised.

  ### 1. What theory of morality does the anti-presentism norm presuppose?

  It is a common misconception that anti-presentism presupposes **moral relativism** (the idea that moral truths change over time). Most academic historians are not relativists; they generally believe slavery was objectively wrong in 1790, just as it is today.

  Instead, the norm presupposes a theory of **moral agency constrained by social epistemology.**

  The underlying theory is that moral knowledge is not discovered in a vacuum (like a platonic truth) but is generated within specific social and linguistic structures. This draws heavily on Quentin Skinner and the Cambridge School of intellectual history. The argument is that for an agent to be morally culpable, they must have had access to the conceptual vocabulary to recognize the alternative.

  *   **The Theory:** Moral truth may be timeless, but moral *access* is historical.
  *   **The Implication:** When a historian refuses to call a founder a "monster," they aren't saying slavery was okay then. They are saying the *category* of "monster" implies a level of moral clarity and agency that the subject's social epistemology did not permit.

  This creates the asymmetry you noticed with geocentrism. We judge geocentrism as false because we assume the *evidence* was available (the stars didn't move differently), even if the *tools* weren't. But with morality, the "evidence" is often social recognition. If your entire economy, religion, and legal system say "slavery is natural," the "data" suggesting it is wrong is socially invisible.

  ### 2. Is this coherent, or is it selective relativism?

  It risks being selective relativism, but it can remain coherent if it maintains a strict distinction between **judging the act** and **judging the agent.**

  *   **Coherent Version:** "Slavery was a moral atrocity in 1800 (act judgment). However, George Washington's participation in it does not make him a moral monster equivalent to a modern slaveholder (agent judgment), because his moral universe lacked the exit ramps available to us."
  *   **Selective Relativism Version:** "We can't say slavery was wrong then because they didn't think it was wrong."

  The incoherence creeps in when historians apply this selectively. As you noted, they happily say past scientists were *wrong* about phlogiston. Why not say past slaveholders were *wrong* about property rights in persons?

  The defense usually relies on the **stakes of harm.** Getting physics wrong doesn't inherently hurt people (usually). Getting morality wrong inherently hurts people. Therefore, the demand for moral judgment is higher. But if the demand is higher, why does the professional norm suppress it?

  Here, the "public history" wedge you mentioned is key. Academic history sees its primary function as **explanation** (causal understanding). Public history sees its function as **commemoration** (civic values). The academic norm against presentism is a tool for explanation; it breaks down when the goal shifts to civic memory. The "selective relativism" charge sticks when academics try to use explanatory tools to block civic judgment.

  ### 3. Can the norm be defended on purely epistemic grounds?

  Yes. This is the strongest defense available, and it avoids relativism entirely. It relies on **Bernard Williams' "relativism of distance."**

  Williams argued that some moral confrontations are "notional" rather than "real." A real confrontation is one where you could actually adopt the other group's outlook. We cannot have a real confrontation with a Bronze Age warrior culture; we can't actually live like them. Therefore, applying our moral vocabulary to them is epistemically useless.

  **The Epistemic Argument:**
  1.  **Historical understanding requires counterfactuals.** To explain why someone acted, you must understand what they thought their options were.
  2.  **Moral condemnation shuts down inquiry.** If you label a subject "evil," you stop asking *why* they did it. You attribute the cause to their character rather than their structure.
  3.  **Humility regarding moral progress.** This is the hard pill: To judge the past confidently, you must be confident that your moral instincts are superior. An epistemic defense says: "We have better telescopes than Galileo. Do we have better moral telescopes? Or do we just have different blind spots?"

  This defense argues that anti-presentism isn't about protecting the dead; it's about protecting the *method*. If we judge the past by our standards, we turn history into a mirror. We learn nothing about how societies function, only that we are better than them.

  However, this defense crumbles if you accept that **moral knowledge is real knowledge.** If the abolitionists in 1800 knew slavery was wrong, and the slaveholders rejected that knowledge due to self-interest, then the "epistemic constraint" argument fails. The slaveholder *could* have known. In that case, anti-presentism becomes a shield for privilege.

  ### 4. What if historians treated moral knowledge as cumulative?

  If the discipline shifted to treat morality like science (cumulative, progressive, error-correcting), the changes would be radical. This is essentially a return to **Whig History**, but with a moral rather than liberal-democratic teleology.

  **Changes in Writing:**
  *   **The "Dissenter" Focus:** History would focus less on "great men" embedded in their time and more on the minorities who got it right. The story of 1790 wouldn't be about Washington's complexity; it would be about the Quakers and enslaved people who correctly identified the moral truth despite the consensus.
  *   **Error Correction:** Historical narratives would be framed as progress reports. "In 1800, society believed X (Error). By 1900, we corrected to Y (Truth)."
  *   **Loss of Empathy:** The "view from nowhere" would vanish. Historians would explicitly write from the "view from the moral present."

  **Changes in Teaching:**
  *   **Civic Formation:** History classes would become explicitly moral training. The goal wouldn't just be critical thinking, but character formation.
  *   **Canon Changes:** Figures who held "correct" moral views would be elevated; those who held "incorrect" views would be demoted, regardless of their political or military impact.

  **The Risk:**
  The danger of treating morality as cumulative science is that it assumes **moral realism** is as settled as scientific realism. It isn't.
  *   *Science:* We know the earth goes around the sun.
  *   *Morality:* We know slavery is wrong. But do we know the exact contours of economic justice, reproductive rights, or AI ethics?

  If historians treat morality as cumulative, they risk fossilizing *current* moral debates as "settled science." In 2050, historians treating 2024 morality as cumulative might judge *us* harshly for things we think are normal. The anti-presentism norm, for all its flaws, preserves a space for the possibility that *we* are the ones who are blind.

  ### The Pitch for Your Piece

  The central thesis of your article could be this: **The anti-presentism norm is not a theory of truth; it is a theory of attention.**

  It is a methodological brake designed to force historians to look at *causes* rather than *culprits*. The tension arises because the public (and increasingly, the academy) wants history to do two incompatible things: **Explain the world** (which requires suspending judgment to understand mechanisms) and **Fix the world** (which requires making judgments to motivate action).

  The geocentrism analogy holds only as long as we believe moral truth is as discoverable as astronomical truth. The moment we acknowledge that moral "discovery" is often a political struggle, the historian's job shifts from "reconstructing the past" to "arbitrating the legacy of the past."

  The norm against presentism is dying not because it is logically incoherent, but because it is politically insufficient. It offers understanding, but the public demands accountability. The future of the discipline lies in figuring out how to offer accountability without sacrificing the complexity that makes history useful.

  **Key thinkers/sources to reference:**
  *   **Quentin Skinner:** On meaning and context.
  *   **Bernard Williams:** *Ethics and the Limits of Philosophy* (Relativism of Distance).
  *   **Thomas Haskell:** On the relationship between capitalism and the abolitionist moral perception (did morality change, or did the *ability to see* the suffering change?).
  *   **Nick Cowen:** Recent work on "moral presentism."
  *   **The "Whig History" critique:** Herbert Butterfield.

  This framework should give you the philosophical scaffolding to explore the tension without getting bogged down in culture-war soundbites.
