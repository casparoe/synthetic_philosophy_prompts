      *   *Angle 2: The Moral Disease as a Feature.* Lean into the "love of money" as a habit that needs breaking, but frame it as a premium service. "Weaning you off productivity." This might be too on-the-nose.
      *   *Angle 3: The Legacy of Struggle.* Focus on the identity crisis. The client defines themselves by their work. The brochure offers "authentic non-utility" – doing things strictly because they are useless, framed as the ultimate luxury. This captures the Keynesian idea of doing things for their own sake.

      *Selection:* Angle 3 seems the most subtle and fitting for luxury copy. Luxury is often about uselessness (Veblen goods), but here it's about *useless activity* for the soul. It allows for deadpan humor about how hard it is to just *be*.

