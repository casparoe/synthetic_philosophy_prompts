answer: |-
  Your notes are indeed garbled. You are conflating the **Doctrine of Double Effect (DDE)** with the **Acts/Omissions Distinction** (doing vs. allowing). They are two different deontological constraints.

  *   **Acts/Omissions:** Claims it is worse to *cause* harm than to *allow* harm.
  *   **Double Effect:** Claims it is worse to *intend* harm (as a means or end) than to *foresee* harm (as a side effect).

  DDE is not about whether you moved your muscles (pulling a lever vs. standing still); it is about the **causal structure of your plan**. Specifically, it asks: **Is the bad effect the *means* by which you achieve the good effect, or is it merely a *side effect*?**

  Here is the actual rule, followed by the application to your three cases.

  ### The Actual Rule (The 4 Conditions)
  For an action that causes both good and bad effects to be permissible under DDE, all four conditions must be met:

  1.  **Nature of the Act:** The action itself must be morally good or neutral (e.g., redirecting a threat), not intrinsically evil (e.g., killing an innocent).
  2.  **Intention:** The agent must intend only the good effect. The bad effect must not be intended (neither as an end nor as a means).
  3.  **Distinction of Means:** The good effect must not be produced *by* the bad effect. (You cannot achieve the good *through* the harm).
  4.  **Proportionality:** The good effect must outweigh the bad effect.

  **The Crucial Filter:** Condition 2 and 3 are where your notes went wrong. DDE permits causing harm if it is a **foreseen side effect**. It forbids causing harm if it is an **intended means**.

  ---

  ### Case 1: The Standard Bystander (Lever)
  *Scenario: You pull a lever to switch a trolley from a track with 5 people to a track with 1 person.*

  *   **The Act:** Redirecting a threat. (Permissible/Neutral).
  *   **The Plan:** "I will switch the track so the trolley misses the five."
  *   **The Role of the One:** The one person's death is **not** what saves the five. The five are saved because the trolley is on a different track. If the one person magically vanished the moment the lever was pulled, the five would *still* be saved.
  *   **DDE Analysis:**
      *   Do you intend the one's death? **No.** You intend to move the trolley. The death is a foreseen but unintended side effect.
      *   Is the good effect (saving 5) produced *by* the bad effect (killing 1)? **No.** It is produced by the trolley being on a different track.
  *   **Verdict:** **Permissible.** (This matches your reading, but for the wrong reason. It's allowed not because it's an "act," but because the death is a side effect, not a means).

  ### Case 2: The Loop Case
  *Scenario: The side track loops back toward the five. The single person is heavy enough to stop the trolley. If they weren't there, the trolley would loop around and kill the five anyway.*

  *   **The Act:** Redirecting a threat. (Permissible/Neutral).
  *   **The Plan:** "I will switch the track so the trolley hits the one person, whose body will stop the trolley before it reaches the five."
  *   **The Role of the One:** The one person's body is the **barrier**. Their impact (and consequent death) is mechanically required to stop the trolley. If the one person magically vanished, the trolley would loop back and kill the five.
  *   **DDE Analysis:**
      *   Do you intend the one's death (or at least the impact)? **Yes.** In the DDE framework, you are intending to use their body as a brake. You cannot separate the "saving" from the "hitting."
      *   Is the good effect (saving 5) produced *by* the bad effect (hitting/killing 1)? **Yes.** The five are saved *because* the one is hit.
  *   **Verdict:** **Impermissible.**
  *   **Addressing your confusion:** You noted that physically, both the Standard and Loop cases involve "just pulling a lever." DDE agrees the physical motion is identical. However, DDE judges the **intentional structure**, not the muscle movement. In the Loop, your plan *requires* the harm to the one to succeed. That makes the harm a means, which violates Condition 3.

  ### Case 3: The Transplant Case
  *Scenario: A surgeon kills one healthy person to harvest organs and save five dying patients.*

  *   **The Act:** Killing an innocent person / Cutting into a non-consenting body. (Intrinsically evil/Impermissible act).
  *   **The Plan:** "I will kill this one person to use their organs to save the five."
  *   **The Role of the One:** The one person's death is the **means**. You cannot get the organs without killing (or fatally harming) them.
  *   **DDE Analysis:**
      *   **Condition 1 Failure:** The act itself (killing an innocent) is usually considered intrinsically wrong, failing the first test immediately.
      *   **Condition 3 Failure:** Even if we ignore Condition 1, the good effect (saving 5) is produced *by* the bad effect (killing 1). The death is the mechanism of the rescue.
  *   **Addressing your confusion:** You wrote: *"if the surgeon doesn't harvest the organs... he's only allowing the five to die, which on my notes should be the most permissible option."*
      *   This is where you mixed up DDE with Acts/Omissions. DDE is a test used to justify **doing** something that causes harm. It is not a test for **not doing** something.
      *   The question DDE asks is: "Is the *harvesting* permissible?" It is not asking "Is the *inaction* permissible?"
      *   Obviously, *not* killing the healthy person is permissible (and required). But DDE is invoked to explain why the surgeon cannot *act* to save the five. The surgeon intends the death of the one as a means to save the five.
  *   **Verdict:** **Impermissible.**

  ### Summary of the Distinction

  | Case | Physical Act | Causal Role of the Victim's Harm | DDE Verdict | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Standard Lever** | Pull Lever | **Side Effect.** (Harm is not needed to save the 5). | **Permissible** | Harm is foreseen, not intended as a means. |
  | **Loop** | Pull Lever | **Means.** (Harm is needed to stop the trolley). | **Impermissible** | Harm is intended as a means to the end. |
  | **Transplant** | Surgery | **Means.** (Death is needed to get organs). | **Impermissible** | Harm is intended as a means (and act is intrinsically wrong). |

  **The Fix for Your Notes:**
  Delete the "doing/allowing" rule. Replace it with **"Means vs. Side-Effect."**
  *   If the harm is the **engine** that drives the good result (Means) $\rightarrow$ **Forbidden.**
  *   If the harm is the **exhaust fumes** from the engine driving the good result (Side Effect) $\rightarrow$ **Potentially Permissible.**
