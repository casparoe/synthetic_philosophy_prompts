      *   DDE is about *Intention vs. Foresight*. It distinguishes between harm intended as a means or an end, and harm merely foreseen as a side effect.
      *   *Key Formula:* An action with both good and bad effects is permissible if:
          1.  The act itself is morally good or neutral.
          2.  The bad effect is not intended (neither as end nor means).
          3.  The good effect is not produced *by* the bad effect.
          4.  The good effect outweighs the bad effect (proportionality).

  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Introduction:** Directly address the garbled note. State clearly: DDE $\neq$ Doing/Allowing. DDE = Intention/Foresight.

