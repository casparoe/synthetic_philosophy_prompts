  # The Individuation Decision Tree
  **For the Undergrad Metaphysics Club**

  **Instructions:** Start at Question 1. Follow your intuitive answer to the next node. When you hit a leaf, read your "commitment." This tree maps the *logical space* of individuation, not just the history of philosophy. Some leaves share a name but occupy different coordinates in that space.

  ---

  ### Q1: The Distant Star (Relations vs. Primitive Identity)
  Imagine Max Black's symmetric universe (two iron spheres, 2 miles apart, nothing else). Now, add a single distant star. Sphere A is 5 miles from the star; Sphere B is 10 miles.
  **Did adding the star *create* a difference between the spheres, or did the spheres *already* differ and the star just lets us tell them apart?**

  *   **They already differed.** (Distinctness is prior to qualities.) → **Go to Q2.**
  *   **It created a difference.** (Distinctness depends on qualities/relations.) → **Go to Q3.**

  ### Q2: The Stripping Test (Haecceitism vs. Substratum)
  You believe the spheres differ even without qualitative differences. Imagine you could magically strip away all properties (mass, shape, location, even "thisness").
  **Would anything remain?**

  *   **Yes, a bare subject.** (A property-less bearer.) → **Leaf 1: Substratum Theory.**
  *   **No, nothing remains.** ("Thisness" was just a final property.) → **Leaf 2: Haecceitism.**

  ### Q3: The Container Test (Impure Properties)
  Return to the original symmetric universe (no star). Suppose Newton was right: space is a real, absolute container. Sphere A is at coordinate (0,0,0); Sphere B is at (2,0,0).
  **Is "being at (0,0,0)" a genuine qualitative property of Sphere A?**

  *   **Yes.** (Location individuates.) → **Leaf 3: Spatiotemporal Individuation.**
  *   **No.** (Space is relational or unreal.) → **Go to Q4.**

  ### Q4: The Symmetry Test (Pure Relations)
  Back to the original case (no absolute space). The spheres share all intrinsic properties. They differ only in "being 2 miles from the other sphere."
  **Is this relational fact enough to make them two distinct things?**

  *   **Yes.** (Relations count as qualities.) → **Leaf 4: Bundle Theory (Weak PII).**
  *   **No.** (Only intrinsic properties count.) → **Go to Q5.**

  ### Q5: The Count Test (Strong PII vs. Tropes vs. Structure)
  Since relations don't count and intrinsic properties are identical, consider the sentence: *"There are two spheres."*
  **Is this sentence false?**

  *   **Yes, it is false.** (There is only one sphere.) → **Leaf 5: Bundle Theory (Strong PII).**
  *   **No, it is true.** (Go to Q6.)
  *   **It is misleading.** (Go to Q7.)

  ### Q6: The Instance Test (Tropes)
  You said there are two spheres, but relations don't count. How do they differ?
  **Do they share the exact same property (e.g., "Ironness"), or does each have its own private instance (e.g., "this-ironness" vs. "that-ironness")?**

  *   **Private instances.** (Properties are particularized.) → **Leaf 6: Bundle Theory with Tropes.**
  *   **Exact same property.** (This contradicts Q5 "No" + Q4 "No" + Q3 "No" + Q1 "Ground". *Logical Dead End*.) → **Leaf 7: Unnamed (Incoherent).**
      *   *(Note: If you chose "No" at Q5 but "Exact same" here, you have no principle of individuation. You have accidentally returned to Q1's "They already differed" branch.)*

  ### Q7: The Ontology Test (Structuralism)
  You said "There are two spheres" is misleading. Why?
  **Is it because there are actually no objects at all, only a structure?**

  *   **Yes, only structure exists.** → **Leaf 8: Ontic Structuralism.**
  *   **No, objects exist but are indistinguishable.** → **Leaf 9: Epistemic Structuralism.**

  ---

  ## The Leaves & Their Awkward Commitments

  1.  **Substratum Theory:** You are committed to the existence of "bare particulars" that literally have no properties but somehow hold them together.
  2.  **Haecceitism:** You are committed to "primitive thisness" as a real property, which means God could have swapped the spheres' identities without changing a single observable fact.
  3.  **Spatiotemporal Individuation:** You are committed to Absolute Space, meaning the universe would be different if the whole two-sphere system was shifted five feet to the left.
  4.  **Bundle Theory (Weak PII):** You are committed to the view that an object is nothing over and above its relations, meaning if the spheres swapped places, they would literally become each other.
  5.  **Bundle Theory (Strong PII):** You are committed to the claim that in Black's universe, there is physically only one sphere, despite the appearance of two.
  6.  **Bundle Theory with Tropes:** You are committed to the proliferation of entities, meaning "Ironness" in Sphere A is a different entity from "Ironness" in Sphere B, even if they are qualitatively identical.
  7.  **Unnamed (Incoherent):** You claim distinctness relies on qualities, but deny all sources of qualitative difference while insisting there are two things.
  8.  **Ontic Structuralism:** You are committed to the view that "objects" are fictions, and reality is fundamentally made of nodes in a network without relata.
  9.  **Epistemic Structuralism:** You are committed to the view that there are two distinct objects, but it is a brute fact that no knowledge can ever distinguish them, even in principle.

  ---

  ## Instructor's Key: Logical Space & Variant Analysis

  ### 1. Logical Space Map
  This tree is built on three binary distinctions (plus one ternary split at Q5):
  1.  **Primitive vs. Grounded Identity:** (Q1) Is distinctness a brute fact, or does it supervene on properties?
  2.  **Impure vs. Pure Qualities:** (Q3) Do impure properties (like absolute location) count as individuating qualities?
  3.  **Relations vs. Intrinsic:** (Q4) Do pure relations count, or only monadic intrinsic properties?
  4.  **Property Ontology:** (Q6/Q7) Are properties universals, tropes, or structural nodes?

  **Empty/Unexplored Combinations:**
  *   **The "Incoherent" Leaf (Leaf 7):** This combination (Distinctness requires qualities + No Intrinsic Diff + No Relational Diff + No Location Diff + Two Objects exist) is logically empty. It is incoherent because it asserts supervenience on qualities while denying the existence of any qualifying difference. Students who land here usually hold Haecceitist intuitions but answered Q1 incorrectly.
  *   **The "Impure Only" View:** There is a logically possible view that accepts Absolute Location (Q3 Yes) but rejects Pure Relations (Q4 No). This tree groups this into **Leaf 3**. While historically rare to accept Location but reject other relations, it is not incoherent; it simply posits space as the *only* valid individuator.

  **Indistinguishable Leaves:**
  *   **Haecceitism vs. Substratum (Leaves 1 & 2):** While Q2 attempts to separate them, many philosophers argue these are merely terminological variants of "Primitive Identity." If your club members feel Q2 is a distinction without a difference, they should treat Leaves 1 and 2 as a single region: **Primitive Identity.**

  ### 2. Variant Analysis: Do the Cases Do Different Work?
  You asked whether the Scratch, Position, and Star variants are redundant. They are **not**; they test distinct logical boundaries.

  *   **The Scratch Variant (Intrinsic):** This tests the baseline. If one sphere has a scratch, *everyone* agrees they are two. This case does **no work** in a decision tree about PII because it resolves the indiscernibility immediately. It is useful only to establish a control group.
  *   **The Absolute Position Variant (Impure Properties):** This does **unique work**. It separates those who think *only* intrinsic properties individuate (Leibniz) from those who allow *impure* properties (Location) to individuate (Substantivalists). Without this case, you cannot separate **Leaf 3** from **Leaf 5**.
  *   **The Third Object/Star Variant (Pure Relations):** This does **unique work**. It separates those who require intrinsic properties from those who allow *pure relations* to individuate. Without this case, you cannot separate **Leaf 4** (Weak PII) from **Leaf 5** (Strong PII).

  **Summary:** The Scratch case is trivial. The Position case tests *Impure* properties. The Star case tests *Pure* relations. You need all three (minus the scratch) to map the full space of property-based individuation.
