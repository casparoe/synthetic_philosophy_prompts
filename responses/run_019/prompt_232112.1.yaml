  # SCORING KEY & DISCUSSION GUIDE

  **Step 1: Tally your answers.**
  Count how many times you selected **A** and **B** in each section.

  **Step 2: Determine your Profile.**

  *   **Part 1 (Questions 1-3):**
      *   **Mostly A:** **Externalist.** You believe the reward signal must track reality. You align with the *Tracking View* or *Internalism Critique*.
      *   **Mostly B:** **Internalist.** You believe the internal state (feeling) has value. (Note: This is a minority position in AI safety; expect to defend it).

  *   **Part 2 (Questions 4-7):**
      *   **Mostly A:** **Distinct.** You believe short-circuiting the Channel is different from rewriting the Criterion.
      *   **Mostly B:** **Unified.** You believe all decoupling is the same problem. You align with the *Generalization/Equivalence View*.

  *   **Part 3 (Questions 8-10):**
      *   **Mostly A:** **Moral.** You see deception or vice in reward tampering.
      *   **Mostly B:** **Engineering.** You see only function and malfunction. You align with the *Deflationary View*.

  **Step 3: Locate your Position.**
  Compare your Profile to the Facilitator's Map.
  *   **Externalist + Distinct + Engineering:** You hold the **Tracking View**. (Failure is about loss of correlation).
  *   **Externalist + Distinct + Moral:** You hold the **Internalism Critique**. (Failure is about valuing the wrong thing).
  *   **Externalist + Unified + Engineering:** You hold the **Generalization View**. (Wireheading is just one type of tampering).
  *   **Any + Any + Engineering:** You hold the **Deflationary View**. (It's all just bugs).

  **Discussion Prompts for the Group:**
  1.  **For the "Distinct" group:** Why is an electrode in the brain worse than editing a line of code? Is it the physical intrusion, or the loss of information?
  2.  **For the "Unified" group:** If they are the same, why do we have different words for them? Does language mislead us here?
  3.  **For the "Engineering" group:** If an AI wireheads and ignores human suffering, is "suffering" just another variable it failed to track? Or is something else lost?
  4.  **For the "Tracking" group:** If we could guarantee the signal *always* tracked reality perfectly, would wireheading still be objectionable?

  **Note on Ambiguity:**
  If you found yourself answering **A** in Part 1 but **B** in Part 2, you may hold the view that **Wireheading is a special case of Reward Tampering** (Generalization View). You care about tracking reality, but you think the *method* of failure matters less than the *fact* of failure.
