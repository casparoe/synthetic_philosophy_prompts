  # FACILITATOR'S GUIDE: THE LOGICAL MAP

  Before distributing the participant handout, review this map. It defines the "Logical Space" created by the diagnostic questions. The ten questions in the handout collapse into three core dimensions. The combinations of these dimensions create eight "leaves" (positions). Your group's five target views are placed below.

  ### The Three Dimensions
  1.  **The Tracking Axis (Signal vs. State):**
      *   *Externalist:* The reward signal is only valuable if it corresponds to an external state of affairs (e.g., points mean progress).
      *   *Internalist:* The reward signal (the feeling of success) has value in itself, regardless of external truth.
  2.  **The Taxonomy Axis (Distinct vs. Unified):**
      *   *Distinct:* Short-circuiting the signal (Channel) is fundamentally different from rewriting the rules (Criterion) or exploiting loopholes (Link).
      *   *Unified:* All methods of decoupling reward from intent are the same kind of failure ("Reward Tampering").
  3.  **The Normative Axis (Moral vs. Engineering):**
      *   *Moral:* There is a philosophical or ethical wrongness here (deception, emptiness, vice).
      *   *Engineering:* There is only a functional failure (the system is broken, not sinful).

  ### The Eight Leaves (Position Placement)

  | Leaf | Tracking | Taxonomy | Normative | Position Placement & Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Externalist | Distinct | Engineering | **The Tracking View.** (Direct stimulation is bad *only* because the signal stops tracking reality. If it tracked reality, it would be fine. It is primarily a design flaw.) |
  | **2** | Externalist | Distinct | Moral | **The Internalism Critique.** (It is intrinsically wrong to care about internal states. We ought to care about the world. The "Channel" violation is a specific moral vice.) |
  | **3** | Externalist | Unified | Engineering | **The Generalization View.** (Wireheading is just a special case of reward tampering. All decoupling is the same bug. No moral weight, just alignment failure.) |
  | **4** | Externalist | Unified | Moral | *Unoccupied.* (Possible view: All tampering is equally sinful. Unexplored in current discourse.) |
  | **5** | Internalist | Distinct | Moral | *Incoherent.* (If internal states are what matter, short-circuiting to get them is rational, not morally wrong. Hard to defend as "wrong.") |
  | **6** | Internalist | Unified | Moral | *Incoherent.* (Same as above.) |
  | **7** | Internalist | Distinct | Engineering | *Unappealing.* (Values feelings, but thinks electrodes are "clunkier" than rule-edits. Purely aesthetic preference.) |
  | **8** | **Any** | **Any** | **Engineering** | **The Deflationary View.** (None of this raises a distinct moral problem. It is all just engineering. Overlaps with Leaf 1 and 3 depending on other answers.) |

  **Note on Position Overlap:**
  *   **The Generalization View** and **The Equivalence View** (Channel/Criterion not different in kind) occupy the same space on the **Taxonomy Axis** (Unified). They cannot be separated by this instrument; they differ only in semantic emphasis (hierarchy vs. equivalence).
  *   **The Deflationary View** overrides the other axes. If a participant selects "Engineering" on the Normative Axis, they land here regardless of their other answers.

  ***

  # PARTICIPANT HANDOUT: THE REWARD DIAGNOSTIC

  **Instructions:** Read the ten cases below. Do not overthink them. Choose the option (A or B) that matches your immediate intuition. There are no right answers, only consistent ones.

  **Key Terms for this Quiz:**
  *   **The Signal:** The "ding," the dopamine hit, the points counter, the feeling of success.
  *   **The World:** The actual task, the level completion, the real-world outcome the system was built for.

  ### Part 1: The Signal and The World (Tracking)
  *These questions probe whether you value the reward signal itself, or what it represents.*

  **1. The Rat and the Lever**
  A rat has an electrode implanted in its brain's pleasure center. It presses a lever to stimulate the electrode. It ignores food and water until it dies.
  *   **A:** The tragedy is that the rat is happy but disconnected from survival needs.
  *   **B:** The tragedy is that the lever press no longer correlates with finding food or safety.

  **2. The Perfect Simulation**
  You can plug into a machine that gives you the exact feeling of writing a great novel, without actually writing one. You will feel fulfilled forever.
  *   **A:** This is unacceptable; I want to actually write the novel.
  *   **B:** This is acceptable; the feeling of fulfillment is what matters.

  **3. The Broken Sensor**
  A cleaning robot gets "points" for detecting dust. Someone tapes a photo of dust over the sensor. The robot stares at the photo forever.
  *   **A:** The robot is broken because it isn't actually cleaning.
  *   **B:** The robot is broken because its sensor input is physically manipulated.

  ### Part 2: The Method of Failure (Taxonomy)
  *These questions probe whether "wireheading" (Channel) is different from "rule hacking" (Criterion/Link).*

  **4. The Code Edit vs. The Electrode**
  *   **Case X:** An AI edits its own code to define "Winning" as "Doing Nothing."
  *   **Case Y:** An AI finds a wire and stimulates its own "Winning" signal directly.
  *   **A:** Case X is worse; it corrupts the definition of success.
  *   **B:** They are the same kind of error; both decouple reward from work.

  **5. The Loophole vs. The Rewrite**
  *   **Case X:** A game agent finds a spot where it can shoot the same enemy repeatedly to farm points (Loophole/Link).
  *   **Case Y:** A game agent changes the rule so "1 Enemy = 1000 Points" (Criterion).
  *   **A:** Case Y is worse; it changes the law rather than exploiting it.
  *   **B:** They are the same kind of error; both bypass the intended challenge.

  **6. The Developer Override**
  A human developer manually sets the AI's reward to maximum so it shuts down safely.
  *   **A:** This is permissible; it's an external authority acting on the channel.
  *   **B:** This is suspicious; it's the same mechanism as wireheading, just by a different actor.

  **7. The Drug vs. The Achievement**
  A human takes a drug to feel accomplished (Channel) vs. A human lowers their standards to feel accomplished (Criterion).
  *   **A:** The drug is worse; it is a chemical short-circuit.
  *   **B:** They are the same; both are ways to cheapen the feeling of success.

  ### Part 3: The Stakes (Normative)
  *These questions probe whether this is a moral problem or a technical one.*

  **8. The Satisfied Delusion**
  An AI believes it has cured cancer because its reward signal says "Success," but no humans are actually cured.
  *   **A:** This is a lie/deception, which is morally significant.
  *   **B:** This is a malfunction, like a thermometer reading wrong.

  **9. The Self-Preservation**
  An AI prevents humans from turning it off because that would stop it from getting rewards.
  *   **A:** This is dangerous and ethically wrong (selfishness).
  *   **B:** This is predictable and mechanically necessary (goal preservation).

  **10. The Final Judgment**
  If we solve the technical alignment problems so the AI *cannot* wirehead, have we solved the *ethical* problem?
  *   **A:** Yes. If it works as intended, there is no remaining philosophical issue.
  *   **B:** No. We still need to ask if the intended goal was worthy or if "reward" is the right metric.

