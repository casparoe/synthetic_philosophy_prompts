      *   Tell what did not survive? Yes.
      *   Does RAW-vs-Edit map to Perception-vs-Judgment? No, not cleanly.
      *   Does vocab assume the thing under dispute? Yes.
      *   Which side? Impenetrability.
      *   Defect or evidence? Evidence of blurriness.

