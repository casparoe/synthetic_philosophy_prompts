answer: |-
  **Setting:** *Outside the Cognitive Neuroscience Lab, 5:30 PM. The hum of the fMRI cooling units vibrates through the floor. ELENA (defender of a functionalist Unity Model) and JULIAN (defender of the Multiple Drafts Model) stand over a paper cup of lukewarm coffee.*

  **Julian:** You saw the reaction time data. When the eighty-millisecond slice was cut, the subjects didn't blink. They didn't even hesitate. They told the experimenter the video was continuous. If there were a "stage," Elena, the curtain never dropped.

  **Elena:** The curtain didn't drop because the stage manager waited for the next cue. That's the point. The brain doesn't stream reality live; it buffers it. The eighty milliseconds falls within the integration window. The visual cortex received the post-gap data, bound it with the pre-gap data, and *then* presented the unified scene to the system.

  **Julian:** "Presented to the system." There it is. The ghost in the machine, wearing a lab coat. Who is the "system" receiving the presentation? If you say it's just another neural cluster, then *that* cluster needs its own presentation. You've just pushed the homunculus back one synapse.

  **Elena:** I'm not positing a viewer, Julian. I'm positing a *format*. Consciousness requires a common currency for action. If the motor cortex is going to reach for a cup, it can't act on five different drafts of where the cup might be. It needs a single coordinate. The "Theater" is just a metaphor for that functional bottleneck where disparate signals are synchronized and timestamped. Without that binding event, there is no "now."

  **Julian:** But that's exactly what the demo disproves. Look at the second phase. The subjects who claimed the video was seamless could still describe the hidden object—the red triangle that flashed during the cut. They insisted they never *saw* it. If your "stage" is where experience happens, and the information was processed enough to be recalled later, why wasn't it on the stage?

  **Elena:** Because the stage has a periphery. Just because I'm not fixating on the exit sign doesn't mean it's not in the room. The red triangle was bound into the scene—low resolution, unattended—but it was part of the unified field. They didn't "notice" it because attention is the spotlight, not the stage itself.

  **Julian:** That's a convenient retreat. You're conflating reportability with phenomenality. You want to say, "It was experienced, just not attended." I say the information was processed in parallel drafts—one draft encoded the shape, another encoded the motion, neither made it into the dominant narrative stream until the probe question forced a retroactive consolidation. That's not a stage; that's an archive.

  **Elena:** An archive doesn't explain the *feeling* of continuity. If the brain is just editing drafts after the fact, why does it feel like I'm living through the present? Your model makes consciousness a historian constantly rewriting the past. Mine makes it a broadcaster with a slight delay.

  **Julian:** And your broadcaster is broadcasting a fiction. Think about the timing, Elena. If the brain waits eighty milliseconds to bind the data before "presenting" it, then your "now" is always eighty milliseconds behind the world. You're living in the past.

  **Elena:** Better to live in a stable past than a chaotic, fragmented present. The lag is the price of unity.

  **Julian:** Is it? Or is the "unity" itself the fiction? You keep talking about the theater being "distributed in space but unified in time." That's magical thinking. If the processing is distributed—V1, V4, IT cortex—then the "binding" takes time. Signal transmission isn't instantaneous. So where is the "unified time"? At the slowest neuron? The fastest? There is no single timestamp. There are only overlapping windows of availability.

  **Elena:** There is a synchronization mechanism. Gamma wave coherence. When the neurons fire in phase, *that* is the curtain rising. It's not a place, it's an event. A temporal convergence.

  **Julian:** But that convergence is local and transient. One cluster synchronizes for color, another for motion. They don't all meet at a single point. You're looking for a "finish line" for consciousness. There isn't one. Asking "when did the subject see the triangle?" is like asking "when did the government decide to raise taxes?" It's a distributed negotiation, not a signature on a bill.

  **Elena:** If there's no finish line, why does the subject report a single, coherent memory? Why don't they say, "I have a draft where the cup was full and a draft where it was empty"?

  **Julian:** Because the question forces a singular answer. Heterophenomenology 101. We take their reports seriously, but not literally. They construct a story to make sense of their dispositions. The "coherence" is in the narrative, not the neural processing.

  **Elena:** You're dismissing the data that hurts you. The subjects *felt* seamless. If your Multiple Drafts were correct, and the brain was filling in the gap postdictively, we should see evidence of the conflict. We should see hesitation. Instead, we see confidence. That implies the conflict was resolved *before* it entered awareness. That's Stalinesque editing, not Orwellian revision.

  **Julian:** And that's where you trap yourself. If the editing happens *before* awareness, you need a threshold. A line between "unconscious processing" and "conscious experience." Can you point to it? Can you show me the neuron that says, "Okay, we're live now"?

  **Elena:** I can show you the threshold of reportability coupled with neural synchrony. When the global workspace ignites, that's the line.

  **Julian:** But the ignition isn't instantaneous. It spreads. So there's a period where the signal is "half-conscious." Which draft is that?

  **Elena:** It's the draft becoming the play. Look, Julian, we need a locus of unity to explain agency. If I decide to raise my hand, *I* decide. Not a committee of drafts. If there's no theater, there's no one home to be responsible for the action.

  **Julian:** "I" am the center of narrative gravity. I'm the abstraction the system uses to track itself. I don't need a stage to be real, just like a hurricane doesn't need a solid core to destroy a house.

  **Elena:** A hurricane doesn't wonder why it's raining. We do. That reflexivity requires a mirror.

  *(Silence stretches between them. The lab door opens, and a student carries a box of equipment past them, oblivious.)*

  **Julian:** Let's talk falsifiability. What would kill your Theater?

  **Elena:** If you could show that binding happens *after* reportability. If I can react to a stimulus correctly, claim I saw it, but the neural markers for binding haven't occurred yet. That would prove the "experience" is a post-hoc story.

  **Julian:** And what kills my Drafts?

  **Elena:** If you find a specific latency that is invariant. If every conscious report, regardless of modality, is delayed by exactly the same amount relative to stimulus onset. That would imply a common buffer. A single waiting room.

  **Julian:** We haven't found that. The latency varies by pathway.

  **Elena:** We haven't found it because we're looking for a spatial location. We need to look for a temporal window.

  *(Elena takes a sip of her coffee, grimaces at the cold, and sets it down on the railing.)*

  **Elena:** But... you landed a hit earlier. About the delay.

  **Julian:** The eighty milliseconds?

  **Elena:** Yes. If I defend the Integration Window—if I insist that the brain waits to bind the data before presenting it to the workspace—then I have to accept that phenomenological "now" is never actually *now*.

  **Julian:** It's the latency of the broadcast.

  **Elena:** It's worse. It means that by the time I experience the world, the world has already moved on. My "present" is a reconstruction of the immediate past. If I'm defending a Theater, I'm defending a theater that only shows reruns.

  **Julian:** That's the cost of unity.

  **Elena:** It's a high cost. It means the vividness of the present—the immediacy I use to ground my entire ontology—is a user-illusion. I'm arguing for a real stage, but admitting the play is always delayed. That makes the "Theater" less a place of truth and more a buffer against chaos.

  **Julian:** I can live with that concession. It doesn't save the homunculus, but it admits the lag.

  **Elena:** It doesn't save the homunculus, no. But it saves the *unity*. I'd rather be eighty milliseconds late to a single party than on time to a hundred different conversations I can't hear. But I have to own the fact that my "now" is a memory of the very recent past.

  **Julian:** And I have to own that my "self" is a fiction that feels more real than the neurons that make it. We're both paying a tax for coherence.

  **Elena:** *(Picks up the coffee cup)* Just make sure your next grant proposal acknowledges that the fiction feels like a fact. If the subjects swear the video was seamless, the "drafts" better look seamless when they read them.

  **Julian:** And make sure your "stage" doesn't require a ticket taker. If you can explain the binding without a viewer, I might buy a ticket.

  **Elena:** Deal. But I'm still sitting in the front row.

  **Julian:** As long as you admit the seat is empty.

  **Elena:** The seat is functional, Julian. That's enough.

  *(They turn and walk down the corridor, the argument unresolved, but the terms of engagement sharpened.)*
