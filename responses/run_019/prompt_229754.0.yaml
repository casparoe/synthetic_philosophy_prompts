          *   *Option 2:* Elena admits the "stage" is a metaphorical convenience, not a physical locus.
          *   *Decision:* Elena conceding the cost of the "delay" seems poignant. If the theater waits for binding, we live in the past. That's a heavy price.

  4.  **Refining the Argument (Self-Correction during drafting):**
