      *   **The Behavior:** Marcus buys an espresso machine $\rightarrow$ switches to pour-over (sells machine at loss) $\rightarrow$ misses espresso $\rightarrow$ buys machine again. Repeated 3 times. Cost: a few hundred dollars per loop.
      *   **The Debate:**
          *   *Lena's Claim 1:* Marcus is a "textbook money pump." His choices make him poorer by his own lights.
