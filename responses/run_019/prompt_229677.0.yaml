answer: |-
  This is a profound dilemma that sits at the very heart of political philosophy and community governance. You are grappling with what Max Weber defined as the core problem of the state: the monopoly on the legitimate use of force. But because a residents' association is not a state, you are discovering the limits of authority when it rests on consent rather than coercion.

  To answer your primary question directly: **No, that is not the actual choice.** The dichotomy between "fair but powerless" and "effective but not ours" is a false one. It assumes that *force* is the only metric of *power*, and that *justice* is merely a matter of voting.

  Here is a way of thinking about the relationship between justice and force that avoids this trap, followed by practical implications for your association.

  ### 1. The Philosophy: Authority vs. Power
  Your two neighbours represent two classic philosophical positions.
  *   **Neighbour A (The Realist)** echoes Thomas Hobbes: covenants, without the sword, are but words. If a rule cannot be enforced, it is not a rule; it is a suggestion. Continuing to issue unenforceable rules devalues the currency of your authority.
  *   **Neighbour B (The Principled)** echoes a Kantian or Republican view: The validity of a law does not depend on its enforcement, but on its legitimacy. To repeal a just law because someone breaks it is to surrender the community's moral sovereignty to the transgressor.

  Both are partially right, but both miss the third dimension: **Social Power.**

  In a residents' association, you do not have the "sword" (fines, eviction, police power). Therefore, your authority is not *coercive*; it is *normative*. A normative rule works not by punishing the body, but by binding the conscience and regulating reputation.

  If you treat the ban as a legal contract (which you cannot enforce), you will fail. If you treat it as a mere wish (as Neighbour A suggests), you will dissolve. But if you treat it as a **declaration of community standards**, it retains force even without legal leverage.

  The mistake is thinking that "force" only means fines. In a community of 40 flats, force also means social cohesion, reputation, and the administrative burden of non-compliance.

  ### 2. Reframing the Dilemma
  You asked if you must choose between a rule that is fair but powerless, or effective but not yours.
  *   **The Error:** Assuming the rule is "powerless" simply because you cannot fine him.
  *   **The Correction:** The rule is not powerless; it is *dormant*. Its power lies in its ability to mobilize other forms of leverage (social, legal, financial) that you have not yet fully exhausted.

  If you drop the ban, you validate Neighbour A's cynicism and Neighbour B's fear: you confirm that might makes right.
  If you keep the ban but do nothing, you validate Neighbour A's concern: you confirm that the association is toothless.

  The path forward is to **maintain the rule while escalating the cost of breaking it**, using tools other than direct fines. You must make the rule "yours" (legitimate) and "effective" (costly to ignore) without needing new legal powers.

  ### 3. Practical Implications: How to Deal with the Holdout
  You need a strategy that bridges the gap between the "wish" and the "rule." Here is how to apply this philosophy practically:

  **A. Verify the "No Practical Way" Assumption**
  Residents' associations often underestimate their leverage. Before accepting powerlessness, ensure you have explored:
  *   **Planning Permission:** In many jurisdictions (including the UK), a significant change from residential to short-term holiday let constitutes a "material change of use." This is a matter for the local planning authority, not the RA. If the owner has six flats, this is commercial, not residential. The RA can lobby the council to enforce planning law.
  *   **Mortgage & Insurance:** Residential mortgages and insurance policies often forbid commercial activity (which holiday lets often constitute). If the RA formally reports the breach to the lender or insurer, the owner could be in breach of *their* contract with the bank, not just the RA.
  *   **Lease Covenants:** Even if the RA cannot fine, the leases might contain covenants against "nuisance" or "commercial use." Enforcement might require a tribunal, but the *threat* of a tribunal (and the legal costs associated with it) is a form of force you can wield collectively.

  **B. Weaponize the "Minute" (Social Force)**
  Neighbour A says a minute in the records is useless. It is only useless if it is private.
  *   **Transparency:** Within the bounds of data protection law, ensure the breach is a matter of record in annual reports sent to all owners.
  *   **Reputation:** In a building of 40 flats, social ostracization is a potent force. If the community universally regards this owner as a free-rider who degrades their quality of life, it affects their ability to sell, their standing in the building, and their peace of mind.
  *   **The "Shadow of the Future":** Make it clear that this record will follow the flat. If the owner tries to sell, the RA can disclose to potential buyers that the flat is subject to ongoing disputes regarding holiday let restrictions. This reduces the capital value of the asset.

  **C. The "Compliance Plan" (Procedural Force)**
  Instead of passing the same resolution repeatedly (which looks weak), pass a **Compliance Plan**.
  *   Resolve that the association will dedicate a specific budget to seeking legal advice on enforcing the ban via planning or leasehold tribunals.
  *   Even if you cannot afford a full lawsuit, sending a letter from a solicitor (paid for by the association) signals that you are moving from "complaining" to "litigating."
  *   This satisfies Neighbour A (you are seeking leverage) and Neighbour B (you are not dropping the rule).

  **D. Distinguish Between "Justice" and "Victory"**
  You may not be able to stop him immediately. You must be prepared to tell the residents: *"We cannot guarantee we will win tomorrow, but we guarantee we will not normalize his behavior."*
  *   Continue to log every noise complaint, every security issue, every coming and going.
  *   Submit these to the local council (environmental health) and the police (non-emergency line).
  *   Create an administrative burden for the owner. If every guest triggers a formal complaint to the council, the business model becomes less profitable.

  ### 4. What to Say to the Neighbours
  To unify the building, you must address both concerns in your next communication.

  *   **To Neighbour A:** "You are right that empty threats damage our credibility. Therefore, we will not just pass resolutions; we will escalate to external authorities (Planning, Lenders, Council) to find the leverage we currently lack. We will not make threats we cannot back."
  *   **To Neighbour B:** "You are right that surrendering the rule hands power to the rule-breaker. Therefore, we will not rescind the ban. The standard remains, even if the enforcement takes time. We will not let one owner set the rules for forty residents."

  ### Conclusion
  The authority of the association does not rest on its ability to fine, but on its ability to **sustain a norm.**

  If you drop the ban, the norm collapses. If you keep the ban but act passively, the norm becomes a joke. The middle path is **active resistance.** You maintain the justice of the rule (it stays on the books) while seeking force through external channels (planning, lenders, social pressure).

  This transforms the situation from a "powerless rule" into a "dispute in progress." It tells the holdout: *You are not operating under a rule you can ignore; you are operating under a rule we are actively fighting to enforce.* That is enough to restore the authority of the association without requiring powers you do not have.
