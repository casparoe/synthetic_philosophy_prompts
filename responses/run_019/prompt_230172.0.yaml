answer: |-
  This stalemate is a classic symptom of what philosophers of science call **framework incommensurability**, but in your specific context, it is more precisely an **ontological category dispute masked as a semantic one**. Your "trench coat" hypothesis is correct, but it underestimates the stakes. This isn't just that they define "politics" differently; it's that they inhabit different ontological universes regarding what constitutes action and responsibility.

  Here is the diagnosis of why the debate circles, followed by a path to progress.

  ### 1. Diagnosis: The Ontological Mismatch
  The debate is not factual (both sides agree on the empirical history of the parkways) and not purely verbal (defining terms won't fix it because the terms serve different theoretical functions). It is a clash of **causal granularity** and **moral topology**.

  *   **Side A (The Materialists/Post-phenomenologists):** They operate with a **flat ontology**. For them, agency is distributed across human and non-human networks. When they say an artifact "has" politics, they mean the artifact *stabilizes* a specific power relation that persists even when the original human intent recedes. They are interested in *persistence* and *constraint*.
  *   **Side B (The Humanists/Instrumentalists):** They operate with a **dualist ontology**. Subjects act; objects are acted upon. For them, "politics" requires *intentionality* and *accountability*. If a bridge is "political," someone must be blameworthy or praiseworthy. They fear that attributing politics to things dissolves human responsibility (the "Nuremberg defense" of technology: "The algorithm made me do it").

  **Is the question ill-posed?**
  Yes. The verb "have" implies possession of a property (like weight or color). Politics is not a property; it is a **relation**. Asking if an artifact "has" politics is like asking if a word "has" meaning without a speaker or listener. The question reifies politics into a substance that can be embedded, rather than a dynamic that is enacted.

  **Why no progress?**
  Progress is impossible as long as the question remains binary ("Do they or don't they?"). Side A wins on *descriptive accuracy* (things do constrain behavior), while Side B wins on *normative clarity* (humans must remain responsible). They talk past each other because Side A is describing a *mechanism of power*, while Side B is defending a *condition of accountability*.

  ### 2. Path to Progress
  To move the reading group forward, you must dissolve the binary. Do not try to prove one side right. Instead, propose a **relational typology**.

  **A. Shift from Nouns to Verbs**
  Stop asking what artifacts *are* or *have*. Ask what artifacts *do*. Replace "Do artifacts have politics?" with "How do technical arrangements **mediate**, **translate**, or **stabilize** political relations?"
  *   *Progress Marker:* A case study that traces how a specific technical constraint (e.g., DRM software) shifts power from a user to a corporation, not by asking if the code is political, but by mapping the *change in the capacity to act* for both parties.

  **B. Temporal Phasing of "Politics"**
  Distinguish three phases that the debate conflates:
  1.  **Constitutive Politics:** The decisions made during design (Winner's intent).
  2.  **Operational Politics:** The script or affordance that constrains use regardless of intent (Latour's delegation).
  3.  **Receptive Politics:** How the artifact is appropriated, resisted, or subverted in use (De Certeau's tactics).
  *   *Progress Marker:* Agreeing that an artifact might be politically neutral in phase 1 (no intent), highly political in phase 2 (rigid constraint), and open in phase 3 (hacking). This allows Side B to keep human intent distinct from Side A's structural effects.

  **C. The Accountability Test**
  Address Side B's fear directly. Propose that acknowledging artifact agency *increases* rather than decreases human responsibility. If we admit the bridge *does* the excluding, we can no longer blame "societal forces" vaguely; we must identify the specific engineers, zoning laws, and maintenance budgets that sustain the bridge.
  *   *Progress Marker:* An argument showing that "object-oriented politics" makes it *harder* to hide human decisions, not easier.

  ### 3. Conclusion
  The debate is stuck because it is trying to solve a relational problem with a property-based question. You will not get consensus on "Do artifacts have politics?" because the "Yes" means "They mediate power" and the "No" means "They are not moral agents." Both are true in their own registers. Progress lies in abandoning the question in favor of mapping the **sociotechnical assemblage**.

