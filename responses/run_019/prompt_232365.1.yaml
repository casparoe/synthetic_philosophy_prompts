  *   *Your likely credence:* ~0.8 (You allow room for quantum gravity effects).
  *   *Friend's likely credence:* ~0.99 (You view weak force T-violation as irrelevant noise).

  **(d) Phenomenology as Evidence.**
  *Question:* How much should the felt one-way-ness of being in time count as evidence for a fundamental flow? (Probability that it counts for *nothing*).
  *   **Probability:** **0.95**
  *   **Reasoning:** The "feeling" of time flowing is widely regarded in neuroscience and physics as a cognitive construct generated by a brain processing information in an entropic gradient. It is evidence of *processing*, not evidence of *fundamental metaphysics*. To count it as evidence for fundamental flow is the "pathetic fallacy" of physics.
  *   *Your likely credence:* ~0.7 (You feel the qualia must mean something).
  *   *Friend's likely credence:* ~0.99 (You view qualia as emergent data).

