answer: |-
  **MEMORANDUM**

  **TO:** Collections Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Disposition of the Benin Plaque (Accession No. 1898.45)

  ### 1. Executive Summary

  The provenance review regarding Accession No. 1898.45 is conclusive: this object was looted during the 1897 Punitive Expedition and acquired by our founder through the resulting market in loot. There is no ethical basis for continued retention of title. However, as the Director noted, "making things right" requires us to navigate incompatible claims regarding *who* constitutes the rightful recipient.

  This opinion recommends a **structured transfer of title to the National Commission for Museums and Monuments (NCMM) of the Federal Republic of Nigeria, executed via a Tripartite Agreement that guarantees permanent physical custody and curatorial authority to the Oba of Benin.**

  This course of action satisfies our founding charter, adheres to Nigerian statutory law, and, most critically, addresses the core ethical imperative of corrective justice by restoring the object to the specific cultural lineage from which it was stolen, while ensuring its status as a public heritage asset.

  ### 2. The Question of Corrective Justice: Identifying the Heir

  The central ethical difficulty is not *whether* to return the plaque, but *to whom*. We face a conflict between the modern nation-state (the NCMM) and the pre-colonial polity (the Oba's Court). This is not merely a diplomatic detail; it is a question of who suffered the original wrong and who is entitled to repair.

  The 1897 Expedition was not an invasion of the Federal Republic of Nigeria, which did not exist until 1960. It was a targeted attack on the Kingdom of Benin, its Royal Palace, and the person of the Oba. The objects were not state property in the modern bureaucratic sense; they were regalia, ancestral altarpieces, and archival records of a royal household. Therefore, a restitution model that treats the plaque merely as an asset of the Nigerian state risks replicating the colonial erasure of Benin's specific sovereignty. Corrective justice demands that we acknowledge the Oba as the moral victim of the theft.

  However, we must also recognize the reality of the present. The Oba operates within the legal framework of the Federal Republic of Nigeria, which claims ownership of all antiquities under the National Commission for Museums and Monuments Act. To bypass the State entirely could expose the object to legal uncertainty and undermine the NCMM's current efforts to coordinate the return of thousands of bronzes.

  **Conclusion on Recipient:** The most ethically robust solution is a hybrid model. We must transfer legal title to the entity capable of holding it under current law (the NCMM), but we must bind that transfer to the entity that holds the moral claim (the Oba). This acknowledges the State as the legal vessel for restitution, but the Oba as the spiritual and cultural destination.

  ### 3. Engagement with Internal Stakeholders

  Before finalizing this recommendation, we must weigh the valid concerns raised by our internal stakeholders.

  **The Student and Faculty Coalition**
  *The Argument:* The coalition argues that further deliberation is "delay dressed up as ethics." They contend that once looting is established, the only moral action is immediate, unconditional return. Any conditionality—legal agreements, tripartite talks, charter reviews—is a mechanism for the museum to retain control and prolong the status quo.
  *Assessment:* Their moral urgency is correct. The burden of proof should not lie with the victims of theft. However, "immediate" action that violates our charter or Nigerian law could result in the transfer being legally voided or challenged, causing greater delay. Furthermore, "unconditional" return without determining the recipient could precipitate a conflict between the NCMM and the Oba, effectively outsourcing our ethical duty to resolve the heirship question.
  *Resolution:* We must treat this not as a new deliberation, but as the *execution* of the decision to return. The process recommended below is administrative, not evaluative. It is the mechanism of transfer, not a reconsideration of retention.

  **The Senior Donor**
  *The Argument:* The donor suggests a permanent loan and digitization project. This preserves the museum's educational mission, keeps the object accessible to our local public, and utilizes technology to share the object globally without physical displacement.
  *Assessment:* The emphasis on public education and digital access is valuable. Digitization should indeed be part of our restitution partnership. However, retaining title via a "permanent loan" fundamentally misunderstands the nature of the harm. The injury of 1897 was not merely that the object was moved; it was that sovereignty was violated and property was converted. Retaining title perpetuates the legal fiction of our ownership. A loan implies we still own it; we do not. We are custodians of stolen goods.
  *Resolution:* We should fund digitization as a *supplement* to restitution, not a substitute. Our educational mission can evolve to teach the history of restitution itself, rather than teaching through the possession of looted material.

  ### 4. Charter Compliance and Legal Safety

  Our founding charter forbids deaccessioning into "private hands." This is the primary legal constraint.

  *   **Transfer to the Oba directly:** While ethically pure, this carries legal risk. A conservative interpretation of the charter might classify a traditional royal court as a "private" entity relative to a sovereign state, potentially exposing the Committee to liability for breach of charter.
  *   **Transfer to the NCMM:** This is unequivocally a transfer to a public state authority. It satisfies the charter's public education mandate and avoids the "private hands" prohibition.

  By recommending transfer to the NCMM *conditioned* on custody by the Oba, we satisfy the charter's legal requirements while fulfilling the ethical requirement to restore the object to the Oba's care. The NCMM is a public body; the Oba's Palace, in this context, functions as a public museum site (as it currently does for other returned bronzes).

  ### 5. Recommendation and Resolutions

  I recommend that the Collections Committee vote to authorize the Director to proceed with the **Transfer of Title to the NCMM with a Covenant for Oba Custody.**

  This approach secures the return, respects the legal framework of the source nation, honors the historical victim (the Oba), and protects the museum from charter violations. It renders the student demand for "no delay" actionable through a defined timeline, and incorporates the donor's digital access goals as part of the partnership package.

  **Proposed Resolutions for Vote:**

  1.  **Deaccessioning:** That the Committee approves the deaccessioning of Accession No. 1898.45 from the permanent collection of [University Museum Name] on the grounds of unethical provenance established by the 2021 review.
  2.  **Recipient of Title:** That title to the object be transferred unconditionally to the National Commission for Museums and Monuments (NCMM) of the Federal Republic of Nigeria.
  3.  **Covenant of Custody:** That the transfer be executed via a Tripartite Agreement (Museum, NCMM, Oba of Benin) which legally binds the NCMM to grant permanent physical custody and curatorial management of the object to the Oba of Benin's Palace.
  4.  **Public Access & Digitization:** That the Museum allocate funds to support the digitization of the object prior to transfer and to support the Oba's Palace in ensuring public access to the object in Benin City, thereby fulfilling our educational mission through partnership rather than possession.
  5.  **Timeline:** That the Director is instructed to finalize the Tripartite Agreement within six months, after which physical transfer shall commence immediately.

  ### 6. Conclusion

  We cannot undo the violence of 1897. But we can choose whether our institution remains a repository of its spoils or a partner in its repair. By separating legal title (State) from cultural custody (Oba), we acknowledge the complexity of post-colonial justice without allowing it to paralyze us. This path allows us to vote with a clear conscience, knowing we have respected our legal obligations while prioritizing the moral claim of the wronged community.

  I move that we adopt the resolutions above.
