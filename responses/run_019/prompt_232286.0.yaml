  **MEMORANDUM**

  **TO:** Minister of Energy and Climate
  **FROM:** Energy Transition Commission
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation on Remaining Nuclear Capacity (Units 3 & 4)

  **Recommendation**
  The Commission recommends a **Conditional Extension** of operations for Units 3 and 4. We advise against an immediate shutdown by year-end, but also against an unconditional fifteen-year commitment. Instead, operations should continue in five-year increments, contingent upon successful safety recertification and verified progress in renewable capacity deployment.

  **Timetable**
  *   **31 December:** Formal decision to halt decommissioning procedures.
  *   **30 June (Next Year):** Completion of enhanced safety stress-tests and spare-parts supply agreement finalization with France.
  *   **31 December (Year 5):** First strategic review. Extension beyond five years requires proof that renewable storage capacity has reached 40% of baseload demand.
  *   **31 December (Year 15):** Hard stop date for final shutdown unless waste repository licensing is resolved nationally.

  **Strategic Analysis: Import Dependency and Green Integrity**
  A primary driver for this recommendation is the risk associated with the immediate phase-out path. We must treat seriously the concern that shutting down domestic nuclear capacity without equivalent renewable readiness quietly locks in dependency on natural gas and imported French nuclear electricity. This scenario risks outsourcing our carbon emissions and energy sovereignty while maintaining a domestic "green" label. A rushed phase-out could replace low-carbon domestic generation with intermittent gas peakers or foreign nuclear power, undermining the integrity of our transition goals. Maintaining domestic baseload provides the stability required to scale renewables without relying on external fossil fuels.

  **Position of the Dissenting View**
  The Commission is split, and the argument for immediate phase-out remains robust. The strongest argument on the losing side is that capital spent on life-extending aging reactors diverts critical investment from renewables and storage, effectively slowing the true energy transition. Furthermore, proponents of shutdown argue that extending operation perpetuates the unresolved ethical and financial burden of long-term high-level waste storage, leaving a liability for future generations without a finalized repository plan. This view holds that any dependency on French nuclear imports is preferable to delaying the inevitable renewable shift.

  **Conclusion**
  A conditional extension balances energy security with transition integrity. It prevents a reliance on fossil imports during the critical buildup of renewable infrastructure while establishing clear benchmarks to ensure nuclear power remains a bridge rather than a destination.

  \answer{conditional}
