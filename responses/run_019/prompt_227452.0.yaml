  # Joint Statement on Existential and Suffering Risk Prioritization

  **Signatories:** [Representative of X-Risk Prioritization] & [Representative of S-Risk Prioritization]
  **Date:** October 2023
  **Subject:** Scope, Stakes, and Residual Disagreements in Longtermist Risk Reduction

  Following a period of adversarial collaboration, we issue this statement to clarify the ground shared between those who prioritize preventing human extinction (x-risk) and those who prioritize preventing astronomical suffering (s-risk). Our goal is not to declare a victor, but to isolate the precise empirical and normative fault lines that prevent consensus.

  ### I. Substantive Agreements

  We endorse the following claims as accurate descriptions of the landscape, rejecting vague compromises in favor of specific shared premises:

  1.  **Astronomical Stakes:** Both sides agree that the potential future of sentient life is astronomically vast in scale (number of beings, duration, and resource access). Consequently, small changes in the probability or quality of the long-term future dominate the expected value of present-day interventions.
  2.  **Coherence of "Worse Than Extinction":** Both sides agree that outcomes "worse than extinction" are conceptually coherent. Specifically, we agree that a future containing astronomical amounts of intense, unredeemed suffering constitutes a net negative value outcome, distinct from the zero-value outcome of extinction (assuming extinction entails the permanent end of sentience).
  3.  **Axiological Dependence:** We agree that the quantitative disagreement regarding prioritization is not primarily empirical, but axiological. The dispute hinges on the acceptance of **negative-leaning population ethics** (e.g., negative utilitarianism or person-affecting views with asymmetry) versus **standard totalist utilitarianism**. If standard totalism is true, x-risk reduction dominates unless the probability of a net-negative future is substantial. If negative-leaning views hold significant weight, s-risk reduction rises in priority.
  4.  **Intervention Correlation and Trade-offs:** We agree that many interventions (e.g., improving global governance, AI alignment research) positively correlate with both x-risk and s-risk reduction. However, we acknowledge specific scenarios where trade-offs exist. For example, interventions that strictly minimize the probability of extinction (e.g., rapid AI deployment to win a geopolitical race) may increase the probability of a dystopian lock-in (s-risk), and vice versa.
  5.  **Cluelessness:** Both sides acknowledge severe "cluelessness" regarding the long-term side effects of interventions. We agree that arguments claiming one side is "obviously" more robust to unforeseen consequences require empirical justification, not just theoretical assertion.
  6.  **Moral Uncertainty Relevance:** We agree that moral uncertainty is a relevant decision-making framework. Even if one side believes their axiology is objectively correct, they must account for the non-zero probability that the opposing axiology is correct, provided the stakes are sufficiently high.

  ### II. Disagreements Table

  The following table outlines the remaining disagreements. The phrasing is neutral and accepted by both parties as a fair characterization of their respective positions.

  | ID | Domain | X-Risk Prioritizer Position | S-Risk Prioritizer Position |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Expected Value of the Future** | Conditional on survival, the expected value of the long-term future is robustly positive. The probability of a net-negative future is negligible (<1%). | Conditional on survival, the probability of a net-negative future is significant (>10%) due to risks of malicious actors, flawed AI alignment, or suffering-substrate expansion. |
  | **D2** | **Weight of Suffering** | Suffering is bad, but it does not have lexical priority. Vast amounts of positive welfare can outweigh extreme suffering elsewhere in the future. | Suffering has near-lexical or lexical priority. Extreme suffering cannot be morally offset by any amount of happiness, making the prevention of worst-case outcomes paramount. |
  | **D3** | **Tractability & Backfiring** | S-risk specific interventions are less tractable and carry higher risks of backfiring (e.g., by slowing safety progress) compared to broad x-risk reduction. | X-risk specific interventions (e.g., capability acceleration) carry high risks of increasing s-risk. S-risk interventions (e.g., value lock-in, pain reduction) are tractable and robust. |
  | **D4** | **Moral Uncertainty Weight** | Under moral uncertainty, x-risk reduction remains dominant because it is robust across most plausible axiologies (including most person-affecting views). | Under moral uncertainty, s-risk reduction demands disproportionate resources because the cost of ignoring negative-leaning views is infinite or lexically bad. |

  ### III. Cruxes and Evidence

  For each disagreement above, we identify the specific sub-question (crux) that would shift credences, the class of evidence accepted, and our prior predictions.

  | ID | Crux (Sub-Question) | Accepted Evidence / Argument Class | X-Risk Prediction | S-Risk Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **C1** | **What is the baseline probability of a net-negative future given survival?** | Historical trends in violence/suffering reduction; Technical analysis of AI alignment failure modes (e.g., probability of "malicious" vs. "incompetent" failure). | >95% of surviving futures are net positive. | <90% of surviving futures are net positive (i.e., >10% chance of net negative). |
  | **C2** | **Does extreme suffering admit of trade-offs with happiness?** | Philosophical intuition pumps (e.g., "The Happy Hell" scenario); Reflective equilibrium on whether any amount of happiness justifies one instance of extreme torture. | Yes. In sufficiently large quantities, positive welfare outweighs extreme suffering. | No (or practically no). Extreme suffering vetoes positive welfare regardless of scale. |
  | **C3** | **Do safety interventions increase or decrease s-risk?** | Case studies of governance/lock-in; Causal modeling of AI deployment speeds vs. alignment robustness. | Standard AI safety work reduces s-risk incidentally; targeted s-risk work adds little marginal value. | Standard AI safety work often neglects suffering substrates; targeted s-risk work is required to prevent lock-in of negative values. |
  | **C4** | **How should we weight axiologies under uncertainty?** | Decision theory under normative uncertainty (e.g., proportional give vs. maximin). | Proportional give favors x-risk due to the sheer number of plausible axiologies where existence is good. | Maximin or heavy weighting favors s-risk because the "downside" error is catastrophically worse than the "upside" error. |

  ### IV. Note on Verbal Disputes

  We identify one significant verbal dispute underlying **Disagreement D1** and **Agreement 2**.

  **The Dispute:** The phrase "worse than extinction."
  **Clarification:**
  *   For the **X-Risk Prioritizer** (typically operating under Total Utilitarianism), "extinction" is a loss of *potential value* (zero value). "Worse than extinction" means a future with *negative total value*. They often argue this is empirically unlikely.
  *   For the **S-Risk Prioritizer** (often operating under Negative Utilitarianism or Asymmetric Person-Affecting Views), "extinction" may be viewed as neutral or even *good* if it prevents suffering. "Worse than extinction" means a future that *should not have happened* even if it contains some happiness.
  *   **Resolution:** We agree that for the purpose of this collaboration, "worse than extinction" refers strictly to **Impersonal Net Negative Value** (total suffering exceeds total happiness). We acknowledge that if one holds a Person-Affecting View where extinction harms no one (because no one exists to be harmed), the "loss" of extinction is itself a verbal confusion. We bracket this deeper meta-ethical dispute to focus on the empirical probability of Net Negative Futures.

  ***

  ### Author's Confidence Note

  **Confidence in Representation:**
  I am **85% confident** that this statement accurately represents the steel-manned positions of both camps as they exist in the contemporary effective altruism and longtermist discourse. I have drawn upon public writings from organizations like the Center for Effective Altruism (x-risk focus) and the Center on Long-Term Risk (s-risk focus), as well as prominent forum debates.

  **Least Certain Claim:**
  I am least sure that hardline X-Risk prioritizers would sign **Agreement Claim 4** regarding trade-offs ("*...interventions that strictly minimize the probability of extinction... may increase the probability of a dystopian lock-in*").

  **Reasoning:**
  Many committed x-risk prioritizers hold the view that *existence is a prerequisite for all value*, and therefore any action that significantly increases x-risk is inherently s-risk increasing (by risking the worst possible outcome: permanent loss of control). They often argue that "speed" and "safety" are not trade-offs but that safety *is* the only viable path to survival. They might view the admission of a trade-off as conceding that extinction isn't the absolute bottleneck. An S-Risk prioritizer would sign this easily; an X-Risk prioritizer might argue that the trade-off is negligible or illusory, making the claim technically true but practically misleading in their view.
