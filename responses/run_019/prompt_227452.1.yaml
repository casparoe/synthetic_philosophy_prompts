answer: |-
  # Joint Statement on Longtermist Prioritization: Extinction vs. Suffering Risks

  **Signatories:** [Representative of X-Risk Prioritization] & [Representative of S-Risk Prioritization]
  **Date:** October 2023
  **Subject:** Adversarial Collaboration on Existential and Suffering Risks

  ### Part I: Substantive Agreements

  We, the undersigned, having engaged in extended adversarial collaboration regarding the prioritization of extinction risk (x-risk) and suffering risk (s-risk) within a longtermist framework, endorse the following claims. We affirm these are not merely diplomatic compromises but shared premises required for our respective models to function.

  1.  **The Astronomical Stakes:** Both parties agree that the potential future size of the sentient population is astronomical (potentially $10^{50+}$ lives). Consequently, small percentage changes in the quality of existence or the probability of continuation have expected value magnitudes that dwarf near-term, non-existential concerns.
  2.  **Coherence of "Worse Than Extinction":** Both parties agree that outcomes "worse than extinction" are conceptually coherent. Specifically, there exist possible future trajectories containing such intense and vast suffering that, under plausible axiologies, they possess negative expected value relative to human extinction (which entails zero value).
  3.  **Axiological Dependence:** We agree that the core of our dispute is not primarily empirical but axiological. The divergence in prioritization stems largely from differing commitments in population ethics (e.g., Total Utilitarianism vs. Critical-Level Utilitarianism vs. Negative Utilitarianism) and the weighting of suffering relative to happiness.
  4.  **Interdependence of Risks:** We agree that x-risk and s-risk are not orthogonal.
      *   *X-Risk Concession:* Extinction is a permanent lock-in of zero value; therefore, survival is generally a prerequisite for ensuring a positive future.
      *   *S-Risk Concession:* Survival without value alignment or suffering safeguards may increase the probability of lock-in into a net-negative trajectory. Thus, reducing x-risk without reducing s-risk may be instrumentally harmful under certain axiologies.
  5.  **Empirical Cluelessness:** Both parties acknowledge significant "cluelessness" regarding the long-term side effects of interventions. We agree that interventions intended to reduce x-risk (e.g., accelerating technological capability) may inadvertently increase s-risk (e.g., by expanding the sphere of moral concern without corresponding moral progress), and vice versa.
  6.  **Moral Uncertainty Relevance:** We agree that moral uncertainty is a relevant decision-making factor. Even if one axiology is objectively correct, agents should account for the probability that they are mistaken. However, we disagree on *how* to aggregate this uncertainty (see Disagreement 2).

  ---

  ### Part II: Residual Disagreements

  The following table outlines the remaining substantive disagreements. We have formulated these in neutral language that each side accepts as a fair characterization of the opposing view.

  | ID | Domain | Disagreement Statement |
  | :--- | :--- | :--- |
  | **D1** | **Axiological Weight** | **The Asymmetry of Suffering:** The X-Prioritizer holds that vast amounts of positive welfare can morally outweigh extreme suffering, such that a flourishing future is almost always preferable to extinction. The S-Prioritizer holds that extreme suffering has lexical or near-lexical priority, such that even a small probability of astronomical suffering outweighs a high probability of astronomical flourishing. |
  | **D2** | **Moral Uncertainty** | **Portfolio Allocation:** The X-Prioritizer argues that resource allocation should track the *probability* of moral views being correct (favoring x-risk reduction as the majority view). The S-Prioritizer argues that allocation should track the *stakes* under each moral view (favoring s-risk reduction because the cost of ignoring s-risk views is infinite/negative infinity, whereas the cost of ignoring x-risk views is zero/positive). |
  | **D3** | **Empirical Trajectory** | **The Default Future:** The X-Prioritizer assigns a higher conditional probability to the claim: "If humanity survives and reaches technological maturity, the default trajectory is net-positive." The S-Prioritizer assigns a significantly higher probability to the claim: "Without specific intervention, technological maturity creates structural incentives or capabilities that make net-negative outcomes (e.g., malicious AI, unrestrained optimization) likely enough to dominate expected value calculations." |
  | **D4** | **Tractability** | **Intervention Efficacy:** The X-Prioritizer doubts the tractability of direct s-risk reduction, viewing it as prone to backfiring (e.g., by slowing x-risk mitigation) or being less leveraged than ensuring survival. The S-Prioritizer contends that specific s-risk interventions (e.g., AI value alignment focused on suffering, governance of digital sentience) are highly tractable and neglected, offering higher marginal expected value per dollar than generic x-risk reduction. |

  ---

  ### Part III: Cruxes and Evidence

  For each disagreement above, we identify the specific sub-question (Crux) that would resolve or significantly shift the debate, the evidence both sides accept as relevant, and our prior predictions.

  #### Crux for D1 (Axiological Weight)
  *   **Sub-Question:** In a reflective equilibrium process, do intuitive judgments about "hellish" scenarios support a symmetric trade-off rate between suffering and happiness, or do they support an asymmetry where suffering cannot be traded off?
  *   **Accepted Evidence:** Philosophical argumentation regarding the "Intuition Pump" of extreme suffering cases (e.g., the "Hell World" vs. "Heaven World" trade); consistency checks across person-affecting and impersonal views.
  *   **Predictions:**
      *   *X-Prioritizer:* Predicts that upon reflection, most agents will reject lexical priority for suffering because it leads to counterintuitive implications (e.g., preventing a single mild headache outweighing saving a billion happy lives).
      *   *S-Prioritizer:* Predicts that upon reflection, most agents will accept that certain intensities of suffering are "world-destroying" in value terms and cannot be cancelled out by positive welfare.

  #### Crux for D3 (Empirical Trajectory)
  *   **Sub-Question:** What is the probability $P(\text{Net-Negative} | \text{Survival})$? Specifically, does the expansion of technology inherently increase the capacity for suffering faster than it increases the capacity for wisdom/governance?
  *   **Accepted Evidence:** Historical analysis of moral circles; modeling of AI alignment difficulty; analysis of evolutionary incentives regarding pain/pleasure in biological vs. digital substrates.
  *   **Predictions:**
      *   *X-Prioritizer:* Predicts $P(\text{Net-Negative} | \text{Survival}) < 1\%$. Believes moral progress and coordination technologies will scale with capability.
      *   *S-Prioritizer:* Predicts $P(\text{Net-Negative} | \text{Survival}) > 5\%$ (sufficient to dominate expected value given the stakes). Believes optimization pressure often selects for systems that utilize suffering as a computational or control signal.

  #### Crux for D4 (Tractability)
  *   **Sub-Question:** Do interventions explicitly targeting s-risk (e.g., "phenomenal binding" research, AI suffering safeguards) have a positive or negative correlation with x-risk reduction in the short term?
  *   **Accepted Evidence:** Case studies of safety interventions; analysis of "speed vs. safety" trade-offs in AI development; measurement of neglectedness vs. tractability in current s-risk portfolios.
  *   **Predictions:**
      *   *X-Prioritizer:* Predicts that focusing on s-risk diverts talent from the bottleneck (survival) and may introduce regulatory friction that slows safety progress, resulting in a net increase in x-risk.
      *   *S-Prioritizer:* Predicts that s-risk interventions are a subset of high-quality alignment work that reduces x-risk *and* s-risk simultaneously, or that the "backfiring" risk is manageable compared to the risk of ignoring s-risk entirely.

  ---

  ### Note on Verbal Disputes

  We explicitly identify one area where our disagreement is partially verbal rather than substantive: **The Definition of "Value" in Population Ethics.**

  *   **The Dispute:** When the X-Prioritizer says "Extinction is the worst outcome," they are implicitly operating under a **Totalist** or **Person-Affecting Restriction** framework where the loss of potential lives is the primary disvalue. When the S-Prioritizer says "Some futures are worse than extinction," they are operating under a **Critical-Level** or **Negative Utilitarian** framework where the *quality* of lives matters more than the *existence* of lives.
  *   **Resolution:** We agree that if we standardize on a single axiology (e.g., Total Utilitarianism with a very high critical level for suffering), the disagreement collapses into a purely empirical dispute about the probability of net-negative futures. However, since we cannot agree on the axiology itself, the verbal distinction regarding "worst outcome" remains a proxy for the deeper axiological conflict identified in D1.

  ---

  ### Author's Confidence Note

  **Confidence in Representation:**
  I am **85% confident** that this document accurately reflects the steel-manned positions of both camps as they exist in the current LessWrong/EA discourse. The remaining 15% uncertainty accounts for the high variance within each camp (e.g., some x-risk prioritizers are moral realists who worry about s-risk, and some s-risk prioritizers are not negative utilitarians but suffering-weighted utilitarians).

  **Least Certain Claim:**
  The claim I am least sure both sides would genuinely sign is **Agreement #4 (Interdependence of Risks), specifically the S-Risk Concession.**
  *   **Reasoning:** While many s-risk prioritizers acknowledge that extinction prevents future suffering, a hardline faction within the s-risk community (often leaning toward strong Negative Utilitarianism) might view extinction as *instrumentally good* if the probability of a net-negative future is sufficiently high. They might resist phrasing that implies survival is "generally a prerequisite for ensuring a positive future," as they may believe the default future is negative. I have phrased it carefully to reflect the *collaborative* nature of this statement, but a pure "anti-natalist" longtermist might find the wording too concessive to the x-risk view. Conversely, some hardline x-risk prioritizers might view s-risk concerns as a dangerous distraction that undermines the moral imperative to survive, resisting the claim that reducing x-risk without s-risk safeguards could be "instrumentally harmful."
