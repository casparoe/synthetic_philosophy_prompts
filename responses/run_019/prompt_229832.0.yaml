      *   *Check:* Did I explain Pattern 2 clearly? It's confusing for many.
      *   *Adjustment:* Use the term "Logical Correlation." Explain that the code *is* the causal link, even if the boxes are sealed.
      *   *Check:* Did I address the "same underlying phenomenon" question directly?
