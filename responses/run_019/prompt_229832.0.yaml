  8.  **Final Polish:** Check for clarity, flow, and ensure all parts of the prompt are addressed. (The prompt asks for names, relationship, and differentiation).

      *   *Pattern 1 Name:* Goodhart's Law / Reward Hacking.
      *   *Pattern 2 Name:* Acausal Trade / Blackmail (under FDT/UDT).
