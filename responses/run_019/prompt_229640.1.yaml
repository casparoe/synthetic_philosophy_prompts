prompt: |-
  I work for a county parks department and somehow I've ended up as the person who signs off on all our pest-control plans. Mosquito spraying, treating ant colonies near picnic tables, gassing a wasp nest in a playground tunnel, that sort of thing. A few cases cross my desk every month, more in summer.

  Here's my problem. I've read enough of the recent arguments about insect sentience to be genuinely bothered. The basic move is a scale argument: even if the probability that an ant or a mosquito suffers is small, we kill them in such staggering numbers that the expected suffering swamps almost everything else we worry about. But taken at face value this argument seems to prove I should never approve anything, ever, which isn't a procedure, it's a nervous breakdown. Meanwhile if I just ignore it I feel like I'm doing the thing where we decide animals don't count because counting them is inconvenient.

  So: write me an actual decision procedure I can run in under an hour per case, no entomologist on staff, with anything expensive getting countersigned by the parks board chair. I want tests to run in order, roughly: how strong is the evidence for sentience in this group of insects (I'd expect the answer to differ for bees vs springtails, and I want the procedure to tell me how to handle groups where nobody has looked at all), how many individuals does the intervention affect, how necessary is the outcome (disease vector vs. people finding ants icky), and whether a different method would kill fewer or kill faster or not kill at all. Crucially I want the procedure to have a non-crazy default for when the sentience evidence is thin, so that "we don't know" doesn't automatically mean both "do nothing" and "do whatever". And tell me where the procedure should just refuse to give an answer and kick it up to a human.

  Show it working on three cases: aerial spraying for mosquitoes after West Nile was detected in the county, baiting the ant hills by the picnic area, and destroying a wasp nest in a piece of play equipment. One of those should come out as an answer I won't like and won't be able to sell to the public -- and the procedure should be able to say why that's the right call anyway, or admit where it can't.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** County parks department employee responsible for signing off on pest control plans.
      *   **Problem:** Ethical dilemma regarding insect sentience/suffering. The "scale argument" (low probability of sentience $\times$ huge numbers = huge expected suffering) creates paralysis. Ignoring it feels like speciesism/convenience.
      *   **Needs:** A practical decision procedure (under 1 hour/case), no entomologist required, expensive/controversial items get board chair countersignature.
      *   **Specific Requirements:**
          *   Ordered tests: Sentience evidence, Numbers affected, Necessity, Alternatives (kill fewer/faster/not at all).
          *   Non-crazy default for "unknown" sentience (avoiding paralysis).
          *   Escalation path (when to kick to human/board).
          *   Three test cases: Mosquito spraying (West Nile), Ant baiting (picnic area), Wasp nest (playground).
          *   One case must yield an uncomfortable result that the procedure justifies or admits inability to solve.

  2.  **Deconstruct the Ethical Framework:**
      *   The core tension is between *Expected Value Utilitarianism* (suffering $\times$ probability $\times$ count) and *Pragmatic Necessity* (public health/safety).
      *   To avoid paralysis, we need a *threshold* approach, not a pure calculation. We can't calculate exact utility, but we can categorize risk and necessity.
      *   *Sentience Uncertainty:* Use a "Precautionary Principle lite." If evidence is strong, weight heavily. If weak, weight lightly but non-zero. If unknown, assume moderate potential but allow override for high necessity.
      *   *Necessity:* Distinguish between "Health/Safety Critical," "Nuisance/Aesthetic," and "Preventative."
      *   *Alternatives:* Hierarchy of control (Eliminate -> Substitute -> Engineering -> Administrative -> PPE). In pest terms: Non-lethal -> Targeted Lethal -> Broad Lethal.

  3.  **Drafting the Decision Procedure (The "Insect Impact Protocol" - IIP):**
      *   *Goal:* Fast, structured, defensible.
      *   *Step 1: Sentience & Taxonomic Grouping.* Need a lookup table or heuristic. Bees/Wasps/Ants (Hymenoptera) = Higher probability. Flies/Mosquitoes (Diptera) = Moderate. Springtails/etc. = Low.
      *   *Step 2: Scale.* Estimate order of magnitude (10s, 100s, 1000s, 10000+).
      *   *Step 3: Necessity.* Critical (Disease/Safety), Moderate (Infrastructure damage), Low (Aesthetic).
      *   *Step 4: Alternatives.* Can we move the picnic table? Can we use bait instead of spray?
      *   *Step 5: Scoring/Decision Matrix.* Combine these.
      *   *The "Unknown" Default:* If sentience is unknown, treat as "Moderate Probability" but allow "Critical Necessity" to override. If Necessity is Low and Sentience is Unknown, default to Non-Lethal.
      *   *Escalation:* High Scale + High Sentience Probability + Low Necessity = Board Chair.

  4.  **Refining the "Non-Crazy Default":**
      *   The user fears the "nervous breakdown" outcome (never approve anything).
      *   Solution: A *Presumption of Permission* conditioned on *Minimization*. We acknowledge the moral cost but accept it if the human benefit is high enough and the harm is minimized.
      *   *The "Moral Cost" Unit:* Let's create a simple scoring system (1-5) for Sentience Potential (SP) and Necessity (N).
      *   *Rule:* If SP is high and N is low -> Deny. If SP is low and N is high -> Approve. If SP is Unknown -> Treat as Medium, require Minimization.

  5.  **Developing the Test Cases:**

      *   *Case 1: Mosquito Spraying (West Nile).*
          *   Sentience: Moderate (Diptera, complex behavior but debated).
          *   Scale: Massive (Aerial spraying kills everything in zone).
          *   Necessity: High (Human disease/death).
          *   Alternatives: Limited (Larviciding is better but adulticiding is reactive).
          *   *Outcome:* Approve, but with conditions (larviciding first, notify public). This is the "easy" yes.

      *   *Case 2: Ant Baiting (Picnic Area).*
          *   Sentience: High (Hymenoptera, social, nociception evidence).
          *   Scale: Moderate/High (Colonies are thousands).
          *   Necessity: Low/Moderate (Nuisance/stings, not disease).
          *   Alternatives: Move tables, seal trash, non-lethal repellents.
          *   *Outcome:* This is the candidate for the "Uncomfortable No." If the procedure is consistent, killing thousands of high-sentience-potential insects for mere convenience should be rejected if alternatives exist.
          *   *Wait, let's look at Case 3.*

      *   *Case 3: Wasp Nest (Playground).*
          *   Sentience: High (Hymenoptera).
          *   Scale: Low (Single nest, maybe hundreds).
          *   Necessity: High (Immediate safety risk to children, anaphylaxis).
          *   Alternatives: Relocation (hard), Exclusion (too late).
          *   *Outcome:* Approve. Safety trumps.

      *   *Re-evaluating the "Uncomfortable Result":*
          *   Mosquitoes are usually hated, but West Nile is serious.
          *   Wasps are scary, but safety is paramount.
          *   Ants are "icky." Killing a whole colony for "icky" is the weakest justification.
          *   *Decision:* The Ant Case should be the one where the procedure says "No" or "Escalate/Modify." Let's make it a "Deny Lethal, Require Non-Lethal" outcome. This is hard to sell to the public ("Why are there ants at the picnic table?").
          *   *Alternative Idea:* What if the Mosquito case is the uncomfortable one? Aerial spraying kills *everything* (bees, butterflies) not just mosquitoes. The procedure might flag the collateral damage as too high for the marginal benefit if West Nile risk is low.
          *   *Better Choice:* The prompt asks for *one* result I won't like and can't sell.
          *   *Scenario:* The Ant Case. The procedure says "Do not kill the colony. Move the tables." Public hates ants at picnics. This highlights the tension.
          *   *Wait, actually:* The Mosquito Aerial Spray is often controversial environmentally. But the *ethical* argument regarding sentience is strongest for Hymenoptera (ants/wasps/bees) than Diptera (mosquitoes).
          *   *Let's go with the Ant Case.* It forces the user to prioritize insect welfare over human convenience. That is the hardest sell.

  6.  **Fleshing out the Procedure Steps:**
      *   *Step 1: Taxonomic Triage.* (High/Med/Low Sentience Potential).
      *   *Step 2: Scope.* (Individuals affected).
      *   *Step 3: Justification.* (Safety/Health vs. Nuisance).
      *   *Step 4: Mitigation.* (Can we reduce numbers? Speed up death?).
      *   *Step 5: The Matrix.* (Go/No-Go/Escalate).

  7.  **Addressing the "Unknown" Sentience:**
      *   Use a "Weighted Precaution." If unknown, assign a default score (e.g., 2 out of 5). This prevents "We don't know" from blocking everything (which would require score 5) or allowing everything (score 0). It forces the Necessity score to do the heavy lifting.

  8.  **Drafting the Content:**
      *   *Tone:* Professional, empathetic, bureaucratic but ethical.
      *   *Structure:* Introduction -> The Protocol -> The Lookup Tables -> The Three Cases -> Conclusion.
      *   *Constraint Check:* Under 1 hour? Yes, it's a checklist. No entomologist? Yes, uses general taxonomy. Escalation path? Yes.

  9.  **Refining the "Uncomfortable Outcome":**
      *   I need to make sure the Ant case result is genuinely difficult.
      *   If the procedure says "Don't kill ants," the parks director gets complaints.
      *   Why is it the right call? Because "Nuisance" does not justify "High Sentience Potential + Colony Destruction."
      *   I need to make sure the Mosquito case doesn't fail. West Nile = Human Death. That trumps insect suffering in almost any non-absolute framework.
      *   I need to make sure the Wasp case passes. Child Safety = High Necessity.
      *   So, Ants = The "No."

  10. **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Under 1 hour? Yes.
      *   Sentience evidence handling? Yes (Taxonomic Triage).
      *   Numbers/Necessity/Alternatives? Yes.
      *   Non-crazy default? Yes (Weighted Precaution).
      *   Escalation? Yes.
      *   Three cases? Yes.
      *   One uncomfortable result? Yes (The Ants).

  11. **Self-Correction on Sentience Science:**
      *   Be careful not to state sentience as fact. Use "Sentience Probability Weight" (SPW).
      *   Hymenoptera (Bees, Wasps, Ants): High SPW (complex social behavior, nociception studies).
      *   Diptera (Flies, Mosquitoes): Medium SPW (nociception debated, simpler nervous systems).
      *   Collembola (Springtails) etc.: Low SPW.
      *   Unknown: Default to Medium.

  12. **Final Polish:** Ensure the tone validates the user's moral distress without being preachy. Acknowledge that this is a "harm reduction" protocol, not a moral absolution.

  *(Self-Correction during drafting)*: Wait, if I make the Ant case a hard "No," is that realistic for a parks department? Maybe the procedure should recommend "Non-lethal management" which is effectively a "No" on the *current plan* but a "Yes" to solving the problem. That fits the "sign off on plans" role. I am rejecting the *lethal plan*, not the *problem*. That is a crucial distinction.

