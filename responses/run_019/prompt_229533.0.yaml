      *   *Step 4: Control/Comparison.* Is there a counterfactual?
      *   *Step 5: Pre-registration/Prediction.* Was the specific outcome predicted beforehand?
      *   *Step 6: Language Calibration.* Map the findings to specific phrases ("consistent with," "supports," "demonstrates").
      *   *Pitfalls:* Narrative bias, confusing mechanism with evidence, ignoring base rates.

      *Drafting the Steps:*
