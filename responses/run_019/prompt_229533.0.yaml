answer: |-
  ## The Discrimination Checklist: A Procedure for Evaluating Rival Explanations

  This procedure is grounded in the philosophical principle of **underdetermination**: data alone rarely prove a theory true; they only show which theories remain viable. Therefore, evidence *supports* a claim only if it *discriminates* that claim from live rivals. If multiple explanations fit the data equally well, the evidence does not support one over the others, regardless of how coherent the story is.

  **Time required:** 2–3 hours per story.
  **Tools needed:** The manuscript, access to authors (email/phone), and a notepad.

  ### Phase 1: Map the Terrain
  *Goal: Define the claim and the competition before looking at the strength of the evidence.*

  **Q1: What is the specific causal or explanatory claim?**
  *   **Action:** Write down the authors' headline conclusion in one sentence.
  *   **Sufficient Answer:** "X causes Y" or "Pattern Y is explained by mechanism X."
  *   **Pitfall:** Accepting vague abstract language (e.g., "X is associated with Y") when the press release implies causation.
  *   **Judgment Call:** Distinguishing a primary claim from a secondary speculation. Focus on the claim the authors want to sell.

  **Q2: What are the "Live" Rival Explanations?**
  *   **Action:** List at least two other plausible mechanisms that could produce the *same* pattern in the data.
  *   **Sufficient Answer:** You have identified rivals that are scientifically plausible (e.g., confounding variables, alternative mechanisms, measurement artifacts).
  *   **Stop Point:** If you cannot identify a rival, consult a neutral expert or search for commentaries on similar studies. Do not assume "no rivals" exists.
  *   **Pitfall:** Dismissing rivals because they are "boring" (e.g., practice effects, selection bias) while favoring the "exciting" mechanism (e.g., cognitive boost, social change).

  ### Phase 2: Test for Discrimination (Severity)
  *Goal: Determine if the data collection method was capable of ruling out the rivals.*

  **Q3: Did the study design include a counterfactual (control) that isolates the claimed cause from the rivals?**
  *   **Action:** Check if there is a comparison group that experiences the rivals (e.g., time passing, expectation, regression) *without* experiencing the claimed cause.
  *   **Sufficient Answer for Strong Language:** Yes. There is a control condition that matches the treatment on all factors except the specific mechanism being tested.
  *   **Stop Point for Weak Language:** No. If the design lacks a control that rules out the rivals listed in Q2, you cannot claim the evidence *supports* the claim over the rivals.
  *   **Pitfall:** Treating a "baseline" or "pre-test" as a control. A before/after comparison does not rule out time-based confounds.

  **Q4: Was the specific pattern predicted *before* the data were analyzed?**
  *   **Action:** Check for pre-registration or explicit statements in the introduction about what specific pattern would confirm the theory.
  *   **Sufficient Answer for Strong Language:** Yes. The authors stated, "If Theory A is true, we will see Pattern X," and they observed Pattern X.
  *   **Stop Point for Weak Language:** No. If the authors looked at the data first and then constructed an explanation that fits it (accommodation), the fit is not evidence of truth.
  *   **Pitfall:** Confusing a "good story" with a "risky prediction." A theory that can explain *anything* explains *nothing*.

  **Q5: If the claim were false, is it likely the data would have looked different?**
  *   **Action:** Ask the authors (or ask yourself): "What result would have falsified your hypothesis?"
  *   **Sufficient Answer for Strong Language:** There is a clear outcome that would have refuted the claim but did not occur. (High Severity).
  *   **Stop Point for Weak Language:** The authors cannot specify a result that would have changed their minds, or the observed result is compatible with almost any outcome. (Low Severity).
  *   **Pitfall:** Accepting "statistical significance" as an answer. A result can be statistically significant (unlikely to be noise) but still compatible with multiple causal explanations.

  ### Phase 3: Calibrate the Copy
  *Goal: Match your language to the discriminative power of the evidence.*

  **Q6: Which Language Tier applies?**
  *   **Tier 1 (Strong):** "The evidence supports/favors Explanation A."
      *   *Requirements:* Rivals identified + Controls isolate cause + Prediction made beforehand + High severity test.
  *   **Tier 2 (Moderate):** "The evidence is consistent with Explanation A."
      *   *Requirements:* Explanation fits the data, but rivals also fit, OR controls are imperfect.
  *   **Tier 3 (Weak/Null):** "The available evidence does not discriminate between Explanation A and Explanation B."
      *   *Requirements:* Same data fits multiple incompatible models, and the study design does not isolate the difference.

  ---

  ## Application to Your Three Situations

  ### Case 1: The Park and Working Memory
  *   **Q1 (Claim):** Natural setting causes cognitive boost.
  *   **Q2 (Rivals):** Practice effects, regression to the mean, rest/break effect.
  *   **Q3 (Counterfactual):** **No.** There is no control group (e.g., students who sat in a room for 20 minutes).
  *   **Q4 (Prediction):** Unclear, but irrelevant given Q3.
  *   **Q5 (Severity):** Low. The design cannot detect if the boost came from the park or just the break.
  *   **Q6 (Language):** **Tier 2 (Consistent with).** You may write that the results are *consistent with* the restorative theory, but you must explicitly state that the design cannot distinguish this from practice or rest effects.
  *   **Verdict:** You cannot write that the park *caused* the boost.

  ### Case 2: The Economists and Labor Participation
  *   **Q1 (Claim):** Group A: Automation causes decline. Group B: Disability benefits cause decline.
  *   **Q2 (Rivals):** Each group is the rival to the other.
  *   **Q3 (Counterfactual):** The *models* have counterfactuals (routine jobs vs. benefit counties), but the *paper you are covering* reports only aggregate trends.
  *   **Q4 (Prediction):** The models predict different micro-patterns, but the reported data (aggregates) were not used to discriminate them.
  *   **Q5 (Severity):** **Low (for this paper).** The aggregate trends fit both models. The data presented in the article do not risk falsifying either model.
  *   **Q6 (Language):** **Tier 3 (Does Not Discriminate).** You must write that the evidence presented *does not distinguish* between the automation and benefits hypotheses.
  *   **Verdict:** You cannot declare a winner. You must report a stalemate.

  ### Case 3: The Working-Memory Training Trial
  *   **Q1 (Claim):** Training program improves working memory.
  *   **Q2 (Rivals):** Placebo, expectation, specific task practice.
  *   **Q3 (Counterfactual):** **Yes.** Active control matched for time, contact, and expectation.
  *   **Q4 (Prediction):** **Partial.** The improvement was on a targeted test (predicted), but failed on others.
  *   **Q5 (Severity):** **Moderate/High.** The active control rules out expectation/time. The failure on other tests limits the scope.
  *   **Q6 (Language):** **Tier 1 (Qualified Support).** You may write the evidence *supports* the claim that the training improves performance *on tasks similar to the training*, but you cannot claim it boosts general working memory.
  *   **Verdict:** Causal claim permitted, but scope must be strictly limited.

  ---

  ## The Unwelcome Answer

  **Case 2 is the situation you will not like.**

  **Why:** Editors and readers prefer resolution. They want to know *why* men are leaving the workforce so they can understand the world or advocate for policy. Case 2 forces you to write a "he-said, she-said" story where the scientific conclusion is effectively "we don't know yet based on this data."

  In Case 1, you can still write a story about the *limitations* of popular science, which is itself a compelling narrative. In Case 3, you have a positive result to report, albeit with caveats. But in Case 2, the procedure tells you that the *evidence itself* is silent. You cannot resolve the debate with better writing; you can only report the underdetermination. This is professionally frustrating because it denies you the authority to tell the reader what is "really" happening, which is often the implicit contract of science journalism.

  Furthermore, Case 2 highlights a specific journalistic trap: **confusing the sophistication of the model with the discriminative power of the data.** The economists have complex models, but because you are covering the *aggregate trends*, the complexity is decorative. The procedure forces you to admit that the data you are showing the reader does not do the work the authors claim it does.

  ---

  ## Limitations of the Procedure

  Even after running this checklist, there are situations where the honest conclusion is that the evidence underdetermines the choice, and no amount of journalistic care will remove that ambiguity.

  1.  **When the "Live Rivals" are Unobservable:** If rival explanations rely on hidden variables that cannot be measured (e.g., internal mental states, unrecorded historical confounds), no amount of design checking will allow you to discriminate between them. The procedure will tell you to use Tier 3 language, but it cannot generate the data needed to move to Tier 1.
  2.  **When the Field is in Pre-Paradigmatic Chaos:** In emerging fields, researchers may not yet agree on what counts as a "rival." If the community hasn't identified the alternatives, you cannot list them in Q2. The procedure relies on the existence of a scientific consensus about what is plausible.
  3.  **When Resource Constraints Prevent Discrimination:** Sometimes the *only* data available is observational (e.g., climate history, unique astronomical events). The procedure will correctly identify that causal claims are weak (Tier 2), but it cannot fix the fact that a randomized trial is impossible. You are left reporting uncertainty as the state of the art.
  4.  **When "Truth" is Not the Goal:** Some research programs aim for *predictive accuracy* rather than *causal explanation* (e.g., some machine learning applications). This procedure is designed for causal/explanatory claims. If the authors admit they are only offering a predictive instrument, the demand for discrimination between causal rivals is moot.

  **Final Warning:** This procedure protects you from publishing falsehoods, but it does not protect you from publishing boredom. Sometimes the scientifically honest story is that the data are inconclusive. In those moments, your job is not to fake certainty, but to explain *why* the world is harder to know than we wish.
