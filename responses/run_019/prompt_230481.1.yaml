answer: |-
  You press me upon a point of considerable gravity, and I should be dishonest were I to pretend that the obstacle you describe is imaginary. It is indeed true that the possessors of existing capital hold advantages not merely of wealth, but of law and custom, which may crush the infant association before it has drawn breath. If the contest were purely one of pecuniary endurance, I fear the cooperative society would often perish against the entrenched firm. Yet, you present a dilemma which assumes that the only alternatives are a passive submission to this power or a violent seizure of it. I contend there is a third path, lying in the gradual alteration of the laws themselves to place the two forms of industry on a more equal footing, without confiscating the property of the few to endow the many.

  The State, while it ought not to become the universal employer, may rightly facilitate the trial of cooperation by removing legal disabilities and perhaps by advancing credit to associations of labourers under suitable securities. This is not revolution, but reform; it acknowledges the power of property while denying it the right to stifle competition. Moreover, you underestimate the power of shifting public opinion, which ultimately commands the law. If the working classes are educated to prefer association, and if the moral climate renders the mere exploitation of labour increasingly odious, the capitalist will find his power waning not by decree, but by the withdrawal of consent. To seize power by force would be to cultivate the very habits of domination and suspicion that make cooperation impossible; we must build the character fit for liberty before we can safely inhabit the institution.
