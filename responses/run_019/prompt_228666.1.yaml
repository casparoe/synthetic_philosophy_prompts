answer: |-
  **AUMANN CAPITAL MANAGEMENT LLC**
  **INTERNAL MEMORANDUM: POLICY 77-B**
  **SUBJECT: EPISTEMIC ALIGNMENT AND TRADE JUSTIFICATION PROTOCOLS**

  **1.0 COMMON PRIOR VERIFICATION AND ONBOARDING**

  1.1 **Adoption of Firm Prior:** Pursuant to the Common Prior Assumption (CPA), all employees, upon hire, must certify that their subjective probability distribution over all relevant market states matches the Firm Prior™. Deviations greater than 0.05% in any state space must be disclosed to Compliance prior to badge activation.

  1.2 **Adverse Selection in Hiring:** Candidates who express willingness to take the opposite side of the Firm's current proprietary positions during the interview process will be immediately disqualified. Such willingness constitutes evidence that the candidate possesses private information detrimental to the Firm, or alternatively, that the Firm's current positions are unsound. In either case, employment offers are rescinded to preserve common knowledge of rationality.

  **2.0 INTERNAL POSTERIOR RECONCILIATION**

  2.1 **Classification of Disagreement:** Persistent disagreement between analysts regarding asset valuation is classified as a Level 2 HR Violation ("Agreeing to Disagree"). Under Aumann's Agreement Theorem, rational agents with common priors cannot maintain different posteriors if those posteriors are common knowledge. Therefore, continued disagreement is *prima facie* evidence that at least one party is irrational.

  2.2 **Mandatory Convergence Procedure:** Upon detection of epistemic divergence, involved parties must enter a locked conference room (Room 4B) and engage in iterative posterior announcement. Parties shall take turns announcing their updated conditional probabilities based on the other party's previous announcement.

  2.3 **Termination for Non-Convergence:** If posteriors do not converge within four (4) hours, both parties will be terminated. Since the Firm knows itself to be rational, and the parties share priors, failure to converge implies both employees are operating outside the model. HR will not determine which employee was incorrect; both are deemed epistemically compromised.

  **3.0 EXTERNAL COUNTERPARTY RATIONALITY ASSESSMENT**

  3.1 **The No-Trade Justification:** Per the Milgrom-Stokey No-Trade Theorem, speculative trade between rational agents with common priors is impossible. Therefore, every executed trade implies the counterparty is either irrational or operating with misinformation.

  3.2 **Form 1099-R (Rationality):** Before executing any external trade, the originating desk must file a Form 1099-R detailing the specific epistemic failure of the counterparty. Acceptable justifications include:
  *   (a) Counterparty is noise-driven (liquidity trade).
  *   (b) Counterparty holds incorrect priors (behavioral bias).
  *   (c) Counterparty is unaware of information currently held by the Firm.

  3.3 **Prohibition on Mutual Gain:** Traders are strictly forbidden from characterizing transactions as "win-win" or "liquidity provision" in client communications. To suggest the counterparty made a rational decision to trade against the Firm is an admission that the Firm's edge is non-existent. All trade confirmations must imply the Firm has exploited a market inefficiency known only to us.

  **4.0 COMMON KNOWLEDGE OF COMPLIANCE**

  4.1 It is not sufficient that employees know this policy; it must be common knowledge that employees know this policy. Managers must verbally confirm understanding in front of their teams, who must then confirm they heard the confirmation. Failure to establish infinite recursive knowledge layers invalidates all trades executed during that fiscal quarter.

  ***

  *Footnote 1: General Counsel has noted that filing Form 1099-R may expose the Firm to liability regarding claims of fiduciary breach, as explicitly stating a client is "irrational" violates several FINRA suitability guidelines. Compliance overrides this objection, noting that if the clients were rational, we couldn't charge them management fees. Legal is advised to update their priors on litigation risk accordingly.*
