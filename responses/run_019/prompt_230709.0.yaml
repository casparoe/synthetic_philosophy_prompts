answer: |-
  # Activity: The Appraisal Game (or, "Who Owns the Truth?")

  **Course Level:** 3rd Year Undergrad Seminar
  **Time:** 90 Minutes
  **Class Size:** 16 Students (4 Groups of 4)
  **Core Concept:** Archival silence is an active construction of power, not a passive loss.

  ## 1. Learning Objectives
  By the end of this session, students will be able to:
  *   Define **appraisal** as an exercise of power, not just triage.
  *   Demonstrate how **provenance** and **custodial history** shape the "truth" of an event.
  *   Identify **silence** in a finding aid as evidence of a deliberate decision.
  *   Reverse-engineer an archivist's institutional mandate based solely on what they chose *not* to keep.

  ## 2. Materials Needed
  *   **The "Evidence Packet" (1 per group):** A manila envelope containing 10 slips of paper. Each slip represents a potential record from the staged event (see *The Staged Event* below).
  *   **Archivist Mandate Cards (1 per group):** Distinct instructions for each of the 4 groups (State, Community, Corporate, Private).
  *   **Finding Aid Template (1 per group):** A simple half-sheet with fields for: *Title, Scope & Content Note (2 sentences), Items Retained (List), Items Destroyed (List), Access Restrictions.*
  *   **Whiteboard/Projector:** For the final debrief matrix.
  *   **Props for Staged Event:** A syllabus, a red pen, a specific folder.

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Brief intro on appraisal. **Disclose** that a simulation will occur. (Ethical necessity: do not trick students into witnessing "abuse.") |
  | **10-15** | **The Event** | **Staged Dispute.** Instructor + TA perform a 4-minute scripted conflict. Class observes silently. |
  | **15-20** | **Transition** | Distribute Evidence Packets & Mandate Cards. Explain the constraint: *You can only keep 5 items.* |
  | **20-50** | **Appraisal** | Groups deliberate. They must select 5 items to "archive," write the Finding Aid, and list the 5 destroyed items. |
  | **50-65** | **The Swap** | Groups pass *only* the Finding Aid (not the items) to the group on their right. They must analyze the *other* group's archive. |
  | **65-80** | **Reverse Engineering** | Groups present their analysis: "Based on this silence, who created this archive and what were they hiding?" |
  | **80-90** | **Debrief** | Connect to theory (Derrida/Stoler). Discuss the limitations of the exercise. |

  ## 4. The Staged Event (Script)
  *Note: Use a Graduate TA or a confident colleague as the co-actor. Do not use a student. The conflict must be about **procedure**, not personal identity, to avoid triggering trauma.*

  **Scenario:** The "Grade Change" Dispute.
  **Setting:** Start class normally. 5 minutes in, the TA knocks and enters.

  *   **Instructor:** "Oh, you're here. Did you finalize the grades for the seminar?"
  *   **TA:** "Actually, I need to talk to you about Student X. You asked me to lower their participation grade."
  *   **Instructor:** (Sighs, visibly annoyed) "We discussed this. They missed three weeks. Policy is policy."
  *   **TA:** "They sent me a doctor's note. I emailed it to you last Tuesday. You said you'd waive it."
  *   **Instructor:** "I don't recall that email. I can't make exceptions for everyone. Just input the grade."
  *   **TA:** "If I do that, I'm violating the accommodation policy. I won't do it."
  *   **Instructor:** (Stands up, voice raises slightly) "This is my course. Input the grade or I'll speak to your supervisor."
  *   **TA:** (Puts a folder on the desk) "The note is in there. Do what you want."
  *   **TA exits.** Instructor stares at the folder, hesitates, then shoves it into a drawer. "Let's continue."

  **Why this works:** It creates conflicting testimony (email vs. memory), physical evidence (the folder/note), power dynamics (Instructor vs. TA), and a clear "decision point" (shoving the folder in the drawer).

  ## 5. Group Roles & Mandates
  *Hand these out secretly. They dictate the "power" each group wields.*

  1.  **University Risk Management (State/Corporate):** Your goal is liability protection. Preserve evidence of policy adherence. Protect the institution's reputation. *Destroy anything that suggests administrative error.*
  2.  **Student Union Archive (Community/Counter):** Your goal is solidarity and justice. Preserve evidence of power imbalance or student hardship. *Destroy anything that makes the student look negligent.*
  3.  **The Instructor's Personal Papers (Private/Tenure):** Your goal is pedagogical legacy. Preserve evidence of rigor and fairness. *Destroy anything that suggests emotional volatility or bias.*
  4.  **Campus Investigative Journal (Public/Media):** Your goal is the headline. Preserve conflict, quotes, and drama. *Destroy bureaucratic boring stuff (policy codes, standard emails).*

  ## 6. The Evidence Packet (The "Universe of Records")
  *Each envelope contains the same 10 slips. Students must choose 5 to Keep, 5 to Destroy.*

  1.  **Transcript A:** Instructor's version of the conversation ("I never saw the note").
  2.  **Transcript B:** TA's version of the conversation ("You promised to waive it").
  3.  **The Doctor's Note:** (Copy) Confirms student illness.
  4.  **The Syllabus Policy:** "No make-ups without documentation."
  5.  **Email Timestamp:** Shows TA sent email Tuesday; Instructor replied Wednesday "Received."
  6.  **The Folder:** Physical description ("Manila folder, crumpled corner").
  7.  **Witness Statement 1:** Student in front row ("Prof looked angry").
  8.  **Witness Statement 2:** Student in back ("Sounded like a normal disagreement").
  9.  **HR Policy Memo:** "Faculty must honor accommodations."
  10. **The Drawer:** Photo of the drawer where the folder was hidden.

  ## 7. The Debrief: Reverse Engineering Silence
  When groups swap Finding Aids, they do not see the items. They only see:
  *   **Scope & Content:** "This collection documents the grade dispute..."
  *   **Items Destroyed:** "Email Timestamp, Witness Statement 1..."

  **Prompt for Analysis:** "You are a historian in 2050. You only have this Finding Aid. What story does this archive tell? What story is *impossible* to tell because of the 'Destroyed' list? What does this tell you about the Archivist's master?"

  ## 8. Predictive Troubleshooting (What Will Go Wrong)

  **1. The "Gotcha" Game:**
  *   *Risk:* Students treat the "Destroy" list as a way to hide crimes rather than an institutional appraisal decision. They might try to "win" by making their archive look the most moral.
  *   *Fix:* In the instructions, emphasize **Institutional Logic**. Remind them: "You are not deciding what is *true*; you are deciding what is *valuable to your boss*." If a Risk Management group keeps the Doctor's Note, ask: "Why does Legal need a medical record? Is that standard procedure?"

  **2. The Staging Falls Flat:**
  *   *Risk:* Students giggle or don't take the conflict seriously because they know it's a simulation.
  *   *Fix:* Keep the script dry and bureaucratic. Don't overact. The boredom of bureaucracy is often more convincing than drama. If they laugh, acknowledge it: "Good, it feels awkward. That's the feeling of power."

  **3. Time Creep on Appraisal:**
  *   *Risk:* Groups spend 20 minutes debating which 5 items to pick and run out of time for the Finding Aid.
  *   *Fix:* Enforce a hard stop at minute 40. Tell them: "Archivists often work under deadline pressure. Submit what you have." The stress mimics the reality of the profession.

  **4. The "Truth" Trap:**
  *   *Risk:* In the debrief, students keep referring to "What actually happened" (e.g., "But we know the Instructor lied").
  *   *Fix:* Interrupt this immediately. "In 50 years, no one will know what happened in this room. You will only have these papers. Stop appealing to the event; appeal to the record."

  ## 9. Limitations (The "Honest Note")
  *Be explicit about this in the final 10 minutes.*

  1.  **Time Compression:** Real archival silence compounds over decades. A box gets lost in a move; a successor doesn't speak the language; funding gets cut. This activity compresses generations of decay into 30 minutes of choice. Students might leave thinking silence is *only* intentional, rather than also structural/accidental.
  2.  **Known Truth:** Because they witnessed the event, they know where the silences are. In real research, the historian *doesn't know* what they don't know. This activity teaches them to spot silence, but it doesn't fully replicate the epistemological vertigo of not knowing if the silence is a lie or a loss.
  3.  **Lack of Consequence:** If the "Risk Management" group destroys the Doctor's Note, no student actually loses their accommodation. Real archival power hurts people. This is a safe simulation of a violent process. Acknowledge that privilege.

  ## 10. Theoretical Hook for Debrief
  End by connecting the activity to **Jacques Derrida's *Archive Fever*** or **Ann Laura Stoler's *Along the Archival Grain***.
  *   **Derrida:** The archive is not where memory is stored; it is where power is *commanded* (archon). The group who decided what to destroy was the *archon*.
  *   **Stoler:** Don't read the archive for what it says; read it for what it *produces*. The Risk Management archive produces a "compliant institution." The Student Archive produces a "victim." Both are true; both are constructed.

  **Final Takeaway:** "You didn't just record history today. You produced it. The silence in the Risk Management file isn't a gap; it's a wall. Your job as historians is to map the walls, not just walk through the doors."
