      *   *Correction on (v):* I need to be careful not to take sides but to expose the fault line. The "Ergodicity Economics" camp (Peters, Gell-Mann) argues Log is objective. The "Subjective EUT" camp (Samuelson, Arrow) argues Log is just one preference. This is the crux.
