answer: |-
  Here is an adjudication of the proposed desiderata for a theory of stake sizing in repeated, multiplicative gambles. The focus is on the structural requirements of the theory rather than the derivation of the optimal fraction $f^*$.

  ### Desiderata Scorecard

  #### (i) Survival and the Ruin Barrier
  *   **Statement:** A policy must treat ruin (wealth $\to 0$) as an absorbing state that terminates the compounding process. It must distinguish between a bet with positive arithmetic expectation and a bet that is safe to take given current bankroll constraints.
  *   **Adjudication:** **Non-negotiable.**
  *   **Motivation:** In multiplicative dynamics, zero is an absorbing barrier. If a strategy allows a non-zero probability of ruin in an indefinite sequence, the long-term geometric growth rate becomes $-\infty$. A theory that equates positive arithmetic expectation with acceptability ignores the topology of the wealth path. If the agent cannot borrow against future earnings to cover losses (limited liability), full-bankroll wagering on any bet with $P(\text{loss}) > 0$ is mathematically equivalent to eventual certain ruin. Therefore, any adequate theory must impose a hard constraint against strategies that entail certain ruin over the agent's planning horizon.

  #### (ii) The Overbetting Phenomenon (Growth vs. Expectation)
  *   **Statement:** A policy must account for the divergence between arithmetic expected wealth and typical (geometric) wealth. It must identify a region where increasing stake size increases arithmetic expectation but decreases geometric growth, eventually rendering the growth rate negative.
  *   **Adjudication:** **Non-negotiable.**
  *   **Motivation:** This is the central insight of geometric rationality. In repeated play, the law of large numbers applies to the *logarithm* of wealth, not wealth itself. The "typical" outcome is determined by the geometric mean. A theory that fails to penalize overbetting (staking $> f^*$) fails to model the time-average behavior of the system. If a theory recommends a stake in the "overbet" zone (where expected log-growth is sub-optimal or negative) without explicit justification (e.g., a finite horizon or specific utility function), it is descriptively inadequate for long-term capital growth.

  #### (iii) Portfolio Generalization (Correlation Structure)
  *   **Statement:** A policy must determine stake sizes based on the joint distribution of outcomes, not merely marginal probabilities. Covariance between simultaneous or sequential bets must alter allocation.
  *   **Adjudication:** **Non-negotiable.**
  *   **Motivation:** Capital is fungible. Risk is not additive; it aggregates via covariance. Two independent favourable bets allow for higher aggregate exposure than two perfectly correlated bets. A theory that treats bets in isolation (marginal optimization) will over-allocate capital to correlated risks, effectively increasing the volatility drag and pushing the portfolio toward the overbetting regime identified in (ii). An adequate theory must solve for the vector of fractions $\vec{f}$ that maximizes growth given the covariance matrix $\Sigma$, not just the edge of individual assets.

  #### (iv) Uncertainty and Fractional Sizing
  *   **Statement:** A policy must prescribe behavior when probabilities and payoffs are estimated rather than known. It must determine whether "Fractional Kelly" (betting $c \cdot f^*$ where $c < 1$) is a heuristic or a theoretical optimum under parameter uncertainty.
  *   **Adjudication:** **Camp-Specific Preference (with strong practical weight).**
  *   **Motivation:** Strict Kelly assumes known probabilities. In reality, edge is estimated.
      *   *The Bayesian Camp:* Argues that if you properly integrate over the posterior distribution of the edge, the resulting optimal bet is *automatically* smaller than the Kelly bet calculated on the mean estimate. Here, fractional betting is derived, not preferred.
      *   *The Robustness Camp:* Argues that the cost of estimation error is asymmetric (overbetting hurts more than underbetting helps). They view fractional Kelly as a robustness constraint against model error.
      *   *The Strict Camp:* Argues that if you have a probability distribution, you should optimize over that distribution. Deliberately underbetting without modeling the uncertainty is suboptimal.
      *   *Verdict:* While practically essential, whether this is a *theoretical* requirement depends on whether the theory incorporates parameter risk into the objective function or treats it as an external constraint.

  #### (v) Reconciliation with Expected Utility Theory (EUT)
  *   **Statement:** A policy must clarify whether growth-optimal staking is universally rational (ergodic) or merely the specific solution for an agent with logarithmic utility $U(w) = \ln(w)$.
  *   **Adjudication:** **Camp-Specific Preference (The Fundamental Fault Line).**
  *   **Motivation:** This is the primary philosophical conflict.
      *   *Standard EUT (Samuelson/Arrow):* Utility is subjective. An agent with $U(w) = -e^{-aw}$ (exponential) or $U(w) = w^{0.5}$ (power) rationally *should* bet differently than Kelly. Kelly is only mandatory for Log utility.
      *   *Ergodicity Economics (Peters/Gell-Mann):* Utility is irrelevant to the physics of the process. For a non-ergodic multiplicative process, the time-average growth rate is the objective rational criterion. Log utility is not a preference; it is the mathematical operator required to transform the non-ergodic wealth process into an ergodic one.
      *   *Verdict:* You cannot satisfy both. A theory must either submit to subjective preferences (EUT) or claim objective rationality based on dynamic structure (Ergodicity).

  ---

  ### Incompatibilities and Tensions

  **1. The EUT vs. Ergodicity Conflict (Desideratum v)**
  This is the most significant incompatibility. You cannot simultaneously hold that:
  *   (A) Rationality is defined solely by maximizing subjective expected utility (where utility functions are arbitrary concave curves).
  *   (B) Rationality is defined by maximizing the objective time-average growth rate (which mathematically necessitates logarithmic utility).
  If you accept (B), then (v) becomes non-negotiable and Log utility is mandatory. If you accept (A), then Kelly is merely a special case, and a theory demanding Kelly for all agents is false.

  **2. Survival vs. Finite Horizon Utility (Desideratum i vs. v)**
  If an agent has a fixed, short horizon and a utility function that is linear near zero (e.g., they need to reach a specific target to avoid a catastrophe, or they can replenish capital externally), strict survival (i) may conflict with utility maximization (v). A theory that mandates survival (i) as a universal axiom implicitly assumes an indefinite horizon and no external capital injection. This conflicts with EUT models where agents can hedge ruin via labor income or insurance.

  **3. Uncertainty vs. Optimality (Desideratum iv vs. ii)**
  Strict adherence to growth optimality (ii) requires precise knowledge of the distribution. If you admit uncertainty (iv), the "optimal" fraction shifts. A theory that insists on the precise Kelly fraction (ii) while acknowledging parameter uncertainty (iv) without adjusting the fraction is internally inconsistent. It must either claim the uncertainty is negligible or admit that the "true" optimum under uncertainty is fractional.

  ### Summary of Requirements

  For a theory of stake sizing to be considered **adequate** for repeated multiplicative gambles, it must treat **(i) Survival**, **(ii) Overbetting**, and **(iii) Portfolio Correlation** as non-negotiable structural constraints. These arise from the mathematics of compounding and the topology of wealth paths, independent of human preference.

  Desiderata **(iv) Uncertainty** and **(v) Utility Reconciliation** are the domains of interpretation. An adequate theory must explicitly state its position on these, rather than eliding them. A theory that claims to be "universal" must resolve (v) by arguing for the objective status of the growth rate; a theory that claims to be "normative" must resolve (v) by submitting to subjective utility. A theory that ignores (iv) is mathematically pure but practically fragile.
