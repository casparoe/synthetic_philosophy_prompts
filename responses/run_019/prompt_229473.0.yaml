      *   **Topic:** Kelly betting / Geometric Rationality / Stake Sizing for repeated multiplicative gambles.
      *   **Task:** Specify the *desiderata* (requirements/criteria) that an adequate theory must meet, rather than restating the formula.
      *   **Specific Inputs:** Adjudicate five specific proposed requirements (i through v).
      *   **Output Format:** For each desideratum, state whether it's "non-negotiable" or "camp-specific preference," provide the motivation/case for it, and flag any incompatibilities. Keep scorecards of existing positions brief. Focus on criteria and motivation.
      *   **Tone:** Rigorous, analytical, philosophical but grounded in decision theory.

  2.  **Deconstruct the Five Proposed Desiderata:**

      *   *(i) Survival / Ruin Avoidance:* Distinguishing positive expectation from sensible stake. Avoiding full bankroll wagers on risky bets.
      *   *(ii) Overbetting / Growth Reduction:* Capturing the fact that betting too much reduces geometric growth, potentially making it negative despite positive arithmetic expectation.
      *   *(iii) Portfolio Generalization:* Handling correlated simultaneous bets, not just i.i.d. sequences.
      *   *(iv) Uncertainty / Fractional Kelly:* Handling parameter uncertainty (edge/probability) and whether fractional betting is required.
      *   *(v) Utility Reconciliation:* Relationship with Expected Utility Theory (EUT). Is Log-Utility mandatory or just one option?

  3.  **Evaluate Each Desideratum (Drafting the Analysis):**

      *   *(i) Survival:* Is this non-negotiable? In a multiplicative world, ruin is absorbing. If you hit zero, you stop. Any theory allowing ruin with probability 1 in finite time (or high probability in infinite time) when avoidable is suspect. *Verdict:* Non-negotiable for repeated play.
      *   *(ii) Overbetting:* This is the core insight of Kelly. If a theory doesn't distinguish between $f^*$ and $2f^*$, it fails to capture the geometry of compounding. *Verdict:* Non-negotiable for "geometric rationality."
      *   *(iii) Portfolio:* Real world isn't one bet at a time. Correlations matter. A theory that treats correlated bets as independent fails. *Verdict:* Non-negotiable for adequacy, though mathematically complex.
      *   *(iv) Uncertainty:* Real edges are estimates. "Full Kelly" on estimated edges is often ruinous due to estimation error. Fractional Kelly is a practical heuristic, but is it a *theoretical requirement*? Some say it's Bayesian updating; others say it's risk aversion. *Verdict:* Camp-specific preference (depends on how uncertainty is modeled), but highly practically relevant.
      *   *(v) Utility:* This is the biggest philosophical battleground. Is Kelly *the* rational strategy or *a* rational strategy for Log utility? EUT says you can have any concave utility. Kelly proponents say time-averaging makes Log special. *Verdict:* Camp-specific preference (The core conflict between Ergodicity Economics and Standard Neoclassical EUT).

  4.  **Identify Incompatibilities:**
      *   The biggest tension is between (v) and the strong interpretation of (i) & (ii). Standard EUT allows any utility function. If an agent has $U(w) = w^{0.99}$, they might bet differently than Log. If the theory claims Kelly is *universally* rational (Ergodicity view), it conflicts with the EUT view that utility is subjective.
      *   Also, (iv) vs. strict optimality. If you define optimality strictly by known probabilities, fractional Kelly is suboptimal. If you define it by robustness to uncertainty, fractional is optimal.

