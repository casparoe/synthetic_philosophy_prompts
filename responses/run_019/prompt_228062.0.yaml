  9.  **Final Polish:** Ensure the distinction between "Wisdom of Crowds" (estimation tasks) and "Condorcet" (binary classification) is clear, though they are related. The COO is invoking Condorcet specifically. Make sure to emphasize that hiring is a *high-variance, low-signal* task for non-interviewers.

  10. (Final Review against constraints): No generic consulting speak. Real structure. Honest math.

  *(Self-Correction during final review)*: I need to make sure I don't just say "CJT requires independence." I need to explain *why* the VP comment destroys independence mathematically (correlated errors). I also need to address the "one-page summary" issue as an information bottleneck that lowers $p$.

