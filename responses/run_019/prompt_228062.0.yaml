  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address the "elitism" charge? Yes, by framing it as "competence weighting" rather than status.
      *   *Check:* Did I address the VP influence? Yes, under Independence.
      *   *Check:* Is the recommendation actionable? Yes, specific steps for the interview loop.
      *   *Nuance:* The current system's discussion phase is also a violation of independence. I need to make sure I don't let the current system off the hook. The COO is right that the current system is flawed, just wrong about the solution.
