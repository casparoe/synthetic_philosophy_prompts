      *   *Point 2: Preventive Detention vs. Quarantine.* The user thinks I support locking up people who *haven't* harmed anyone. I need to correct this. In the PHM, we generally require a *manifestation* of dangerousness (a crime) before intervening, just as we often wait for symptoms or a positive test before quarantining a disease carrier, though we might isolate known carriers of Ebola. However, for criminal justice, the "harm done" is the evidence of the "infection" (antisocial disposition). It's not about predicting the future from thin air; it's about responding to a demonstrated breach of safety.
