      *   *Critique:* Make sure to address the "vote" analogy the user mentioned.
      *   *Fix:* Integrate the logic of voting (probability vs. impact) into the causal readings.
      *   *Critique:* Ensure the tone isn't aggressive but rigorous.
      *   *Fix:* Use phrases like "philosophical charity" and "clarifying the debate."

  9.  **Final Polish:** Check against the prompt requirements.
