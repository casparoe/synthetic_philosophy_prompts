          *   *Analysis:* Switching to unanimity kills the commission. Switching to 4/5 kills the commission. The problem isn't the *count*, it's the *independence*.
          *   *Best Recommendation:* Keep Simple Majority, but mandate **blind deliberation** (no pre-commitment).
