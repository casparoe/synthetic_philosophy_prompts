          *   *Wait, one more constraint:* "Give the strongest case for keeping majority rule a real hearing rather than straw-manning it." This implies I should argue *for* majority rule, provided it's done right.
          *   *Final Decision:* Recommend **keeping Simple Majority** but formalizing a **Deliberation Protocol** to ensure independence. For Thursday, proceed with the vote but record the dissent regarding process.

      *   *Correction/Refinement:* The user is the swing vote. If they recommend changing the rule *now*, it looks like sour grapes if they lose Thursday. If they recommend keeping it, they validate the system.
      *   *Actually, the most impactful memo:* Acknowledge that "Five Heads" is false *currently*, but fixable. Recommend keeping Majority Rule *conditional* on independent review. For Thursday, since the horse has bolted, the user must vote their conscience, but the memo should set the rule for *future* cases.
      *   *Wait, the prompt asks for a definite recommendation on the rule.* If I say "Keep it," I need to explain why it's still better than alternatives despite the current dysfunction. If I say "Change it," I need to say to what.
      *   *Logic:* Changing the threshold (e.g. to 4 votes) gives veto power to the minority blocs. Keeping it at 3 allows a decision, *if* the swing vote is genuine. The problem is the *behavior*, not the *math*.
      *   *Recommendation:* **Retain Simple Majority, Adopt "Independent Review Protocol."**
      *   *Thursday:* Proceed with vote, but the Chair (maybe the user?) needs to call out the pre-commitment.
      *   *Wait, I need to be careful.* The user is *one* member. They can't dictate procedure unilaterally in the memo without sounding authoritarian. But they can propose it.
      *   *Key Insight:* The "Five Heads" theory fails because of *correlated error*. The Union/Management blocs move together. To make "Five Heads" work, we need to decorrelate them.
      *   *Memo Strategy:*
          1.  Validate the "Five Heads" theory (Condorcet) but show why it fails here (lack of independence).
          2.  Argue against changing the threshold (gridlock).
          3.  Argue for keeping Majority Rule *with* process guards.
          4.  Thursday Plan: Vote based on file, but note the procedural flaw.
          5.  Timeline: Immediate adoption of new protocol.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
