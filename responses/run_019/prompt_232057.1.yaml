      *Better approach for Thursday:* Since the meeting is Thursday and the memo is circulating *before*, the user can propose a change in *how* the vote is taken on Thursday to mitigate the damage. E.g., "Secret Ballot" or "Written Findings first."
      *Best approach:* Be realistic. You can't change culture overnight. For Thursday, vote according to the file. For the *rule*, mandate written findings before discussion.

      *Let's tighten the recommendation:* Keep Majority Rule. Implement "Written Findings First" protocol. Thursday: Proceed with vote, but require written justification from all members before oral discussion (to force engagement with the file).

      *Wait, if they already said how they'll vote, will written findings change that?* Probably not. But it creates a record.
