          *   *Constraint:* Do not offer three options; make a choice.
          *   *Constraint:* Give the strongest case for majority rule (don't straw-man it).

  2.  **Deconstruct the "Five Heads" Argument:**
      *   *Condorcet's Jury Theorem:* This is the mathematical basis for "majority rules." It states that if each voter has a probability > 0.5 of being correct, the majority probability approaches 1 as the group size increases.
      *   *Application here:* The theorem assumes *independent* judgment.
      *   *Reality here:* The 4 other members are *not* independent. They are bloc-voting based on affiliation, not evidence. They have pre-committed without reading the file.
      *   *Conclusion:* The "five heads" argument is mathematically invalid in this specific context because independence is violated. The effective group size is 1 (the user), not 5.

