prompt: |-
  hey so I'm a phd student in social policy, mostly working on wellbeing measurement, and im putting together a talk on whether countries should actually try to top the world happiness rankings. Could you write me a satirical internal policy memo, maybe 700 words, from the fictional Office of the National Ladder, a goverment unit in a country that's decided to reach #1 in next year's World Happiness Report no matter what. The memo should be deadpan and completely sincere: it treats the ranking as the thing to be optimized, and every proposal is a way to move the number without moving whatever the number was supposed to measure. For example, it could propose reweighting the survey sample toward demographics that score high on the Cantril ladder, coaching respondents on the exact wording of the best-possible-life anchor, nudging a few percentage points of low scorers into the 'don't know' pile, stuff like that. It should be funny to someone who knows the Goodhart/measurement critiques, but still readable to someone who doesn't. The target is the practice of governing to the metric rather than whatever the metric is meant to proxy—not any actual person. Keep the irony deadpan, no winking. And then, after the memo, add one final line beginning 'Summary:' that states in a single sentence the conceptual problem the whole thing is meant to illustrate.
