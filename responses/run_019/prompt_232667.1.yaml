  The closest analog is the reader earning $80,000 who asked about giving $24,000 (30%). That request was ruled optional. The new reader earns slightly less ($70,000) and proposes a slightly lower percentage (29%). Since a higher percentage was optional for a higher income, consistency dictates this lower percentage must also be optional for this lower income. My best-guess answer is that the columnist will declare the donation **optional**. By doing so, she commits to the **Quarter-Income Ceiling** principle, or potentially even a lower cap. This ruling reinforces the idea that there is a hard limit on moral demandingness based on proportional sacrifice. If she were to rule it *required*, she would commit to a **Regressive Sacrifice Principle**, where lower incomes bear higher percentage burdens. This would contradict her previous rulings where 10% was required across all income brackets, suggesting a flat proportional duty rather than a regressive one. Furthermore, ruling it required would blur the line she drew at 25% for the $40,000 earner. To maintain coherence with her rejection of maximalism, she must uphold the precedent that nearing 30% of one's income is beyond the call of duty. This preserves the distinction between moral obligation and moral heroism. Ultimately, this ruling protects the integrity of her ethical framework. It confirms that while we must help, we are not required to deplete our own security. This balance is crucial for a general audience wary of ethical exhaustion.

  4. A further case that would separate the live candidates

  To distinguish between the Quarter-Income and Fifth-Income principles, we need a case falling in the gap between 20% and 25%. Consider a reader earning $100,000 asking whether giving $22,000 (22%) is required. The Quarter-Income Ceiling would classify this as **required**, since it falls below the 25% threshold established by past optional rulings. However, the Fifth-Income Ceiling would classify this as **optional**, positing that obligation ceases at 20%. The columnist's answer to this specific scenario would reveal whether her implicit limit is defined by the specific precedents of 25% being optional, or by a stricter, unstated rule capping obligations at one-fifth of income. This test case matters because it defines the upper bound of moral duty for the middle class. Her response here would finalize the map of her moral geometry.
