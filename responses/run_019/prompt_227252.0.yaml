          *   *The Cost:* You separate phenomenology from world-contact. Hallucinations are phenomenally identical to veridical perceptions. (Many accept this anyway).
      *   **Recommendation:** Reject the inference in **(4)**. It relies on a category mistake (the Rock analogy) and a demand for "magic" (how do unconscious parts make a conscious whole?) that applies to *all* physicalist theories, not just HOT.

  6.  **Refining the "Price Tag":**
      *   If you reject (4), you must accept that consciousness is extrinsic/relational.
      *   You must accept that the HOR does not need to be conscious itself (to avoid regress), which feels weird (an unconscious thought making something else conscious).
      *   You must explain why the FOS isn't totally dispensable (content vs. awareness).

