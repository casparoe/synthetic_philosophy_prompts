      *   **Verdict:** Marcus's argument is a known classic (Targetless Thought Objection). It's strong but not fatal.
      *   **The "Proves Too Much" intuition:** Explain why it feels that way (attacks representation) but why it's specific to HOT (the two-state structure).
      *   **The Best Place to Cut:** **Premise (4)**.
      *   **Why (4) looks plausible:** The "Sum of Zeroes" intuition.
