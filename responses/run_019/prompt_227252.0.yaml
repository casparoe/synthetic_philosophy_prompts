      *   *Okay, stick with attacking (4).* The "Combination Problem" is real, but Marcus frames it as if the theory offers *no* account. The theory *does* offer an account: Consciousness is a relational property. The objection is essentially "I don't find that explanation satisfying," which is not a logical refutation.

