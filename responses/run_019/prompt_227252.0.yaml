          *   However, the core worry in (4) is "How does representation generate phenomenology?" That *does* apply to FOR. But (3) is specific to the *Higher-Order* structure (dispensability of the lower order).
      *   So, the argument is specific to *Higher-Order* theories because it exploits the gap between the two orders.

  4.  **Identify the Weak Link:**
      *   **Option 1: Reject (2).** Deny that HORs can be targetless.
          *   *Cost:* You have to say veridicality is essential to the identity of the mental state. This is very hard to maintain (what about dreams/hallucinations?).
      *   **Option 2: Reject (3).** Accept that HOR alone suffices, but deny this is fatal.
          *   *Cost:* You effectively abandon standard HOT for a "Self-Representing" or "One-Component" theory. Rosenthal actually accepts this: if you think you're in pain, you are in pain (phenomenally), even if the tissue damage isn't there. This isn't necessarily a *reductio*, just a refinement.
      *   **Option 3: Reject (4).** This is the strongest candidate.
          *   *Why it looks fine:* It appeals to the intuition that "Unconscious + Unconscious != Conscious." (The "Sum of Zeroes" objection).
          *   *Why it's wrong:* It assumes the *components* must be conscious for the *result* to be conscious. But functionalism/computationalism relies on unconscious parts making conscious wholes all the time. More specifically, HOT says the *relation* is what matters, not the intrinsic consciousness of the parts.
          *   *The "Rock" Analogy:* Marcus says "A thought about a rock doesn't make the rock conscious." This is a category error. HOT doesn't say thinking about X makes X conscious. It says thinking about *a mental state* makes *that mental state* conscious. The target is already mental.
          *   *The "Unconscious" Ambiguity:* Premise (4) smuggles in the idea that the HOR is unconscious *before* it does its job. But on many HOT accounts, the HOR is itself a conscious thought (which requires a third-order thought, leading to regress) OR the HOR is unconscious but its *content* confers consciousness.
