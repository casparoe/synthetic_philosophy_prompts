answer: |-
  Your premise isn't confused; it's the exact right tension to be wrestling with. Historical drama always walks this wire, but *Chernobyl* is a unique case because it explicitly thematizes truth-telling. When your thesis is "lies kill," your own artistic lies come under much heavier scrutiny than they would in a standard biopic.

  Here is a breakdown of where the fabrication serves the truth, where it betrays the dead, and how Mazin's framing changes the ethical calculus.

  ### 1. The Khomyuk Composite: Narrative Economy vs. Historical Erasure
  You ask if the epilogue earns credit for the Khomyuk invention. The short answer is no. A disclaimer at the end does not absolve the distortion that came before it; it merely discloses it.

  However, the composite itself is likely the *least* ethically problematic choice Mazin made. In a miniseries format, you cannot introduce fifteen different scientists without losing the audience. Khomyuk functions as a vessel for the collective scientific effort of the Soviet Union. The ethical danger with composites usually lies in erasing a specific rival or victim to streamline a hero's journey. Here, Khomyuk doesn't replace a specific named woman who was denied credit; she represents a faceless bureaucracy of competence.

  **The Pushback:** You suggest composite characters might not be an ethical problem here. I'd argue they are, but a different one. The problem isn't erasure; it's **modernization**. Khomyuk acts with a level of autonomy and access that a Soviet scientist in 1986 simply did not have. She drives her own car, travels freely, and confronts ministers. By funneling the scientific effort through one character who operates with Western individualism, the show risks convincing the audience that the solution was "brave individuals" rather than "collective systemic correction." It subtly undermines the show's own critique of hierarchy by relying on a Great Person theory of history.

  ### 2. Legasov: Martyrdom vs. Complicity
  This is where the show betrays the dead most significantly. Valery Legasov is the anchor of the series, and Mazin takes massive license with his arc.

  *   **The Speech:** As you noted, Legasov's revelation about the RBMK design flaw happened at the IAEA in Vienna, not the Moscow trial. Moving it to the trial turns a bureaucratic presentation into a courtroom climax. It transforms Legasov from a witness into a whistleblower.
  *   **The Motivation:** The show implies Legasov went to his death to ensure the truth was told. In reality, his suicide note was far more ambiguous. He was exhausted, ostracized by the Party, and denied the Nobel Prize, but he also acknowledged his own complicity in the cover-up. The show sanitizes him. It makes him a pure martyr.
  *   **The Betrayal:** By simplifying Legasov's moral ambiguity, the show protects him from the very "cost of lies" it condemns. Real Legasov lived in a gray zone of Soviet science where everyone lied to survive. Show Legasov is a truth-teller in a world of liars. That is a fabrication that comforts the audience but dishonors the complexity of the man's actual psychological state.

  ### 3. "The Cost of Lies" vs. The Noble Lie
  Mazin framing the show as an argument about the cost of lies absolutely raises the bar. He cannot hide behind "it's just TV." If you make a sermon about honesty, your medium must be honest.

  However, there is a defense here: **The Noble Lie.**
  A documentary captures the *literal* truth but often misses the *emotional* truth. A straight record of the trial would be hours of bureaucratic shuffling. By compressing the timeline and inventing the confrontation in the courtroom, Mazin creates a visceral understanding of the Soviet cover-up that a documentary might fail to convey to a lay audience.

  *   **Where it serves truth:** The "Bridge of Death" scene. Historians debate whether people actually stood on the bridge watching the fire. But including it conveys the *reality* of the radiation danger and the ignorance of the populace better than a statistic could.
  *   **Where it betrays truth:** The portrayal of Dyatlov. The show paints him as a cartoonish villain screaming at subordinates. In reality, he was a competent engineer operating under impossible systemic pressure. Making him the sole villain lets the broader system off the hook slightly. It personalizes the evil rather than systemicizing it.

  ### 4. Does the Epilogue Launder the Inventions?
  No. It functions as a legal shield, not an ethical reckoning.
  If you invent a speech for a dead man and then put text on the screen saying "We changed some stuff," you haven't honored the dead; you've just covered your ass. The epilogue acknowledges Khomyuk is a composite but glosses over the fact that Legasov's heroic climax was staged.

  If you want to be critical in your post, argue this: The epilogue is an admission of guilt, not a pardon. It admits the show is a fabrication, which forces the viewer to retroactively question everything they just saw. That is a strength of the show's honesty, but it doesn't fix the distortion of Legasov's legacy.

  ### 5. "It's Just TV" is Not a Fair Defense
  Not for this subject matter. If you are dramatizing a nuclear disaster that killed thousands and rendered a continent hazardous for millennia, the "entertainment" defense is weak.
  *   **The Stakes:** When the subject is a atrocity where the "lie" caused the death, dramatizing that event with *new* lies is inherently contradictory.
  *   **The Audience:** Most people will not read the epilogue. Most people will not fact-check the trial scene. They will take *Chernobyl* as history. Mazin knew this. Therefore, he bears responsibility for the historical record he is shaping.

  ### Summary for Your Post
  Your angle is solid. Here is the synthesis:
  1.  **Khomyuk** is a necessary narrative tool, but she Westernizes the Soviet experience.
  2.  **Legasov** is the ethical casualty. He is turned into a Western-style hero, which obscures the tragic ambiguity of his actual death.
  3.  **The Theme:** Mazin's "Cost of Lies" framework traps him. He uses lies to tell the truth. This works cinematically but fails ethically regarding specific individuals.
  4.  **The Verdict:** The show owes the dead more than a disclaimer. It owes them complexity. By simplifying the villains (Dyatlov) and purifying the heroes (Legasov), the show creates a satisfying story but a simplified history.

  **One final pushback on your premise:** You ask "what we owe the real dead." Consider shifting that slightly to "what we owe the **living**." The dead are beyond harm. The living (survivors, families, current nuclear workers, the political discourse around truth) are the ones affected by how this history is remembered. *Chernobyl* risks teaching the wrong lessons about how disasters happen (bad apples vs. bad systems). That is where the fabrication truly bites.
