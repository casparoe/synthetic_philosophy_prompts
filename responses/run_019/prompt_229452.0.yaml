answer: |-
  This is an excellent question. Your instincts are spot-on: the handout is a significant oversimplification that gets some of Moore's most famous doctrinal points exactly backward. While it captures the *spirit* of Moore's emphasis on consciousness and aesthetic/human goods, it misrepresents his meta-ethical machinery in ways that would make a careful reader of *Principia Ethica* wince.

  Here is an audit of the handout, breaking down what is accurate, what is wrong, and where your memory serves you better than the summary.

  ### 1. The "Additive" Claim (The Biggest Error)
  **Handout Claim:** *"Moore is wonderfully additive about all this: the value of a whole is just the sum of the values of its parts."*
  **Verdict:** **False.** This is the most glaring error in the summary.

  **The Moorean Objection:**
  Moore is famous in the history of ethics specifically for arguing the **opposite**. In Chapter 1, Section 18 of *Principia Ethica*, he introduces the **Principle of Organic Unities**. He explicitly states: *"The value of a whole must not be assumed to be the same as the sum of the values of its parts."*

  For Moore, value is non-natural and supervenes on complex states of affairs. For example:
  *   **Part A:** Consciousness of a beautiful object (Great positive value).
  *   **Part B:** The beautiful object itself (Neutral or slight value).
  *   **Part C:** Consciousness of an ugly object (Negative value).

  You cannot simply do arithmetic on these. The value of the *whole experience* emerges from the relation between the consciousness and the object. If Moore were additive, his ethics would collapse into a form of hedonism (summing up units of pleasure), which he spends the first three chapters of the book arguing *against*.

  **Why it matters:** The handout's conclusion that "sizing up a possible world means totaling... friendship and aesthetic enjoyment" is methodologically wrong. For Moore, you have to evaluate complex wholes (e.g., "the consciousness of loving a worthy person"), not just tally up isolated instances of pleasure.

  ### 2. The "Vault Painting" & The Two Worlds Argument
  **Handout Claim:** *"Beauty itself... is not intrinsically good—a great painting sealed in a vault that no one ever sees is no better than a blank canvas."*
  **Verdict:** **Mostly Accurate, but ignores Moore's famous counter-thought experiment.**

  **The Moorean Nuance:**
  The handout reflects Moore's dominant view: intrinsic value requires **consciousness**. A universe with no conscious beings is, for Moore, devoid of value. In this sense, the handout is right that the *appreciation* is where the value lies.

  **However, your memory is correct.** In Chapter 6, Section 113, Moore presents the **"Two Worlds" thought experiment**. He asks us to imagine two worlds: one exquisitely beautiful, one utterly filthy. He stipulates that **no human being ever sees or contemplates either.**
  Moore writes: *"Yet, though it may be a mere fancy... I cannot help thinking that [the beautiful world] is better."*

  This passage is a famous tension in Moore's work. It suggests that the *existence* of beauty might have some value independent of a viewer, or at least that the state of affairs "beautiful world exists" is better than "ugly world exists," even without a subject. The handout flattens this tension to make a cleaner point about subjectivity, but in doing so, it ignores the specific passage you remembered. A careful Moorean would say the handout is 90% right but misses the one exception Moore famously wrestled with.

  ### 3. Virtue and Knowledge as "Means Only"
  **Handout Claim:** *"Knowledge and virtue are at best means to these two goods, never good in themselves."*
  **Verdict:** **Inaccurate / Overstated.**

  **The Moorean Objection:**
  Moore is an **Ideal Utilitarian**, not a Hedonistic Utilitarian. He believes there are multiple intrinsic goods.
  *   **Virtue:** In Chapter 6, Moore argues that virtuous dispositions (specifically, appropriate emotions toward what is good) are themselves intrinsic goods. He calls virtue *"the largest and most important part of the Ultimate Good."* It is not merely a tool to get to friendship or beauty; it is a constituent of the good life itself.
  *   **Knowledge:** Moore is more ambivalent here. He argues that mere knowledge (e.g., knowing the number of grains of sand on a beach) has little value without an appreciation of that knowledge. However, he does not dismiss it as a mere *means* (like a shovel). He views it as a necessary *part* of certain valuable wholes. To call it "never good in itself" is too strong; Moore would say it is good only as part of a conscious whole, but that makes it a *constituent* of intrinsic value, not an instrumental means.

  ### 4. The "Two Kinds of Experience"
  **Handout Claim:** *"For Moore the only things good for their own sake are two kinds of experience: friendship... and the enjoyment of beautiful objects."*
  **Verdict:** **A Fair Compression (with caveats).**

  **The Moorean Nuance:**
  In Chapter 6 ("The Ideal"), Moore does identify these as the **greatest** goods. He writes that when we look for things that are "good in themselves," our list is confined chiefly to *"the pleasures of human intercourse and the enjoyment of beautiful objects."*
  So, as a summary of his *practical* ethics, this is acceptable. However, strictly speaking, Moore leaves the door open for other goods (like knowledge in certain contexts, or the existence of beauty per the "Two Worlds" argument). The word "only" makes it dogmatic in a way Moore usually avoided.

  ### Summary Audit

  | Claim in Handout | Accuracy | Moorean Correction |
  | :--- | :--- | :--- |
  | **Only friendship & beauty are good.** | **Mostly True** | These are the *chief* goods, but Moore allows for nuance regarding virtue and knowledge as constituents. |
  | **Beauty needs a viewer (Vault Painting).** | **Mostly True** | Value generally requires consciousness, *but* the "Two Worlds" argument suggests the existence of beauty has some independent weight. |
  | **Virtue/Knowledge are mere means.** | **False** | Virtue is a major intrinsic good. Knowledge is a constituent of valuable wholes, not just a tool. |
  | **Moore is "Additive."** | **False** | **Direct contradiction.** Moore's "Principle of Organic Unities" states the value of a whole $\neq$ sum of its parts. |
  | **Sizing up a world = Totaling parts.** | **False** | One must evaluate complex organic wholes (states of consciousness + objects), not sum isolated pleasures. |

  ### Conclusion: Is the Professor Disagreeing?
  It is unlikely your professor is quietly disagreeing with Moore; it is more likely this is a **pedagogical simplification** that went too far.

  The handout tries to make Moore sound like a consistent subjectivist about value (value = conscious enjoyment) to contrast him with objective list theorists. But in doing so, it sacrifices Moore's most distinctive technical contribution (Organic Unities) and ignores his most famous counter-example (The Two Worlds).

  **Does the conclusion about the hidden painting follow?**
  *   **From the handout's version of Moore:** Yes.
  *   **From the actual *Principia Ethica*:** Mostly yes, but with the "Two Worlds" caveat you remembered. Moore would say a painting in a vault has significantly *less* value than one enjoyed, but he famously hesitated to say it had *no* more value than a blank canvas.

  **Advice for Class:**
  If you bring this up, focus on the **Principle of Organic Unities**. That is the "smoking gun" that proves the handout is inaccurate. You can say: *"The handout describes Moore as additive, but in Chapter 1, Section 18, he explicitly argues that the value of a whole is not the sum of its parts. Does the summary mean to suggest we ignore the Organic Unities doctrine for the sake of simplicity?"* This shows you've read the text carefully without directly accusing the professor of error.
