answer: |-
  **MEMORANDUM**

  **TO:** All Faculty Researchers and Principal Investigators
  **FROM:** University Research Ethics Committee (UREC)
  **DATE:** October 24, 2023
  **SUBJECT:** Implementation of Asymmetric Moral Framework (AMF) for Protocol Adjudication

  Effective immediately, the UREC is resolving the longstanding deadlock regarding Protocol 74-D (Rodent Malaria Vectoring) by adopting a bifurcated ethical framework. Henceforth, all research proposals will be evaluated using an Asymmetric Moral Framework (AMF). This policy operationalizes the distinction between "Persons" (Category A) and "Non-Person Sentient Entities" (Category B).

  **1. Categorization and Calculus**
  Category A entities (undergraduate students, graduate students, faculty, and staff) are subject to Kantian side constraints. They are ends-in-themselves. No Category A entity may be utilized merely as a means to an end, regardless of the aggregate benefit to the research community or the biosphere. Risk cannot be aggregated against their will.

  Category B entities (mice, rats, zebrafish, and other approved vertebrates) are subject to Utilitarian aggregation. Their moral status is defined by capacity for suffering, which functions as a negative utility variable. Suffering may be authorized provided the total expected welfare gain exceeds the total expected welfare loss.

  **2. Operational Precedents**
  To clarify the application of AMF, consider the following adjudication regarding the proposed Malaria Vectoring Study:

  *Scenario A:* The study requires infecting 50,000 mice to develop a vaccine that will spare 50,000 future mice from infection.
  *Verdict:* **Approved.** The net suffering is neutral, but the knowledge gain provides a positive utility multiplier. The sacrifice is permissible under Utilitarian aggregation.

  *Scenario B:* The study requires one (1) Graduate Research Assistant to ingest a modified pathogen to accelerate the vaccine timeline, thereby sparing 50,000 mice from future infection.
  *Verdict:* **Denied.** While the aggregate welfare gain for Category B entities is substantial, utilizing the Graduate Assistant violates the side constraint against using Category A entities as means. The inviolability of the Assistant outweighs the cumulative welfare of the mouse population.

  **3. Procedural Updates**
  Principal Investigators must submit two distinct risk assessments.
  *   **Form 12-B (Animal Aggregation):** Researchers must quantify expected animal suffering in "Standardized Distress Units" (SDUs). Proposals yielding a net positive SDU balance are eligible for approval. There is no upper limit on SDUs if the utility curve is positive.
  *   **Form 1-A (Human Inviolability):** Researchers must certify that no Category A entity will be exposed to risk without explicit, revocable consent. Note: Consent does not validate rights violations. A student cannot consent to be sacrificed to save a department budget or a colony of hamsters.

  **4. Compliance**
  We anticipate this policy will result in the increased culling of animal subjects in high-yield projects and the absolute protection of human subjects in high-risk scenarios. Researchers are advised not to appeal decisions based on "speciesist inconsistency." The inconsistency is a feature, not a bug.

  Thank you for your cooperation in maintaining ethical asymmetry.

  **Dr. Aris Thorne**
  *Chair, University Research Ethics Committee*
