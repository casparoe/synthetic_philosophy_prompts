          *   *Key Insight:* The debate is incommensurable because they are defining "rationality" and "information" differently. For Lange, information is *data* (given). For Hayek, information is *generated* by the process.

      *   **Part 2: Mises vs. Hayek vs. Lange (The Actual Arguments).**
