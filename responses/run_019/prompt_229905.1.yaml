answer: |-
  Your hypothesis is correct, but it needs a sharper philosophical edge. The debate stalled not just because participants slid between incentives, epistemology, and computation, but because the two sides were operating with **incommensurable ontologies of information and rationality.**

  Here is the diagnosis of the Socialist Calculation Debate (SCD) as a methodological collision, an assessment of the "Digital Socialism" revival, and a proposal for what actual progress would look like.

  ### 1. The Diagnosis: Equilibrium vs. Process
  The fundamental reason there is no agreement on "who won" is that Lange and the Austrians were answering different questions using different definitions of "economic data."

  **The Neoclassical/Lange View (The Engineering Problem):**
  Lange accepted Mises' challenge but interpreted it through a Walrasian lens. He viewed the economy as a system of simultaneous equations.
  *   **Ontology:** Information (preferences, technological coefficients) exists *ex ante*. It is objective data waiting to be collected.
  *   **Mechanism:** The Central Planning Board (CPB) acts as the Walrasian Auctioneer. It sets "parametric prices," managers follow rules (minimize cost, set P=MC), and the CPB adjusts prices based on inventory surpluses/shortages (trial and error).
  *   **Claim:** You can have the *efficiency* of markets without the *institution* of private property.
  *   **Blind Spot:** This treats prices as *accounting tools* rather than *discovery mechanisms*. It assumes the data exists to be plugged into the equations.

  **The Austrian View (The Evolutionary Problem):**
  Mises started with accounting (no property = no prices = no calculation), but Hayek radicalized this into an epistemic argument.
  *   **Ontology:** Information is subjective, tacit, and often *created* by the market process itself. It does not exist "out there" to be collected.
  *   **Mechanism:** Prices are not just terms of exchange; they are a telecommunications system that condenses dispersed knowledge. Entrepreneurship is the act of discovering profit opportunities that *nobody knew existed* until the act was undertaken.
  *   **Claim:** You cannot simulate a market because the simulation presupposes the data that only the market generates.
  *   **Blind Spot:** Can be read as a "no true Scotsman" defense (if planning works, it must have been using market signals somehow).

  **The Conflation:**
  You identified the Incentives, Epistemic, and Computational threads. The stall occurs because:
  1.  **Lange answered the Computational argument** (we can solve the equations via trial and error) but **ignored the Epistemic argument** (where do the inputs come from?).
  2.  **Mises argued the Institutional argument** (no property, no prices) but **Hayek argued the Knowledge argument** (even with prices, can you centralize the knowledge?).
  3.  **Critics conflate Mises and Hayek.** If you refute Mises (showing calculation is theoretically possible), Austrians retreat to Hayek (showing knowledge aggregation is impossible). If you refute Hayek (showing knowledge can be aggregated), Austrians retreat to Incentives (managers won't innovate).

  **Verdict on the Debate Type:** This is not an empirical disagreement; it is a **methodological disagreement.** It is a clash between *static equilibrium analysis* (Lange) and *dynamic process analysis* (Hayek). As long as one side views the economy as a machine to be optimized and the other views it as an ecosystem to be navigated, they will talk past each other.

  ### 2. The "Digital Socialism" Revival: Strawman or Engagement?
  The modern argument (Cockshott, Cottrell, and tech-optimists) posits that big data and AI solve the calculation problem. They argue that Walmart and Amazon are proof that large-scale planning works.

  **Is this a strawman?**
  Mostly, yes. It engages the **Misesian/Computational** version of the debate, not the **Hayekian/Epistemic** version.

  *   **The Data Assumption:** Digital socialism assumes that consumer preferences and production possibilities are *data points* that can be scraped, aggregated, and processed. Hayek's argument is that much of this knowledge is *tacit* (I don't know what I want until I see it) and *contextual* (a local manager knows a machine is about to break in a way a sensor might not capture).
  *   **The Amazon/Walmart Counter-Argument:** Austrians (and Coaseans) point out that Amazon plans internally *because* it operates within an external market.
      *   Amazon's capital allocation is disciplined by external stock prices.
      *   Amazon's labor is priced by the external labor market.
      *   Amazon's suppliers are disciplined by competition.
      *   **Crucially:** If Amazon fails, it goes bankrupt. The "planning" is bounded by the profit/loss signal generated by the *external* market. A national economy lacks this external boundary.
  *   **The Innovation Gap:** Algorithms are excellent at optimization (allocating known resources to known ends). They are currently poor at *entrepreneurial discovery* (creating new ends or new means). Hayek's argument is that the market is a discovery procedure. If the algorithm optimizes for today's preferences, it may calcify the economy against tomorrow's innovations.

  **Where Digital Socialism has a point:**
  They correctly identify that Hayek underestimated the *transmission* capacity of technology. Hayek worried about the sheer volume of data. Big Data solves the transmission problem. However, it does not solve the *generation* problem. An algorithm cannot easily price a technology that doesn't exist yet, or a preference that hasn't been articulated.

  ### 3. What Would Count as Progress?
  Since this is methodological, empirical "proof" (like the fall of the USSR) is always contestable (USSR failed due to incentives/politics, not calculation). A formal impossibility proof is unlikely because economics is not pure math.

  Progress requires shifting the terms of the debate. Here are three paths:

  **A. The "Boundary of the Firm" Empirical Test (Coasean Progress)**
  Ronald Coase asked: If planning is so efficient, why do firms have limits? Why doesn't one giant firm encompass the whole economy?
  *   **Progress:** Research into why internal planning costs rise non-linearly with size. If we can formally model the "informational friction" that causes firms to stop growing, we quantify the Hayekian knowledge problem.
  *   **Metric:** Measure the efficiency loss in large internal markets (conglomerates) vs. external markets. If large internal planning consistently suffers from innovation stagnation compared to market-coordinated networks, that supports Hayek.

  **B. The "Counterfactual Data" Test (Epistemic Progress)**
  The core Hayekian claim is that market prices *create* information.
  *   **Progress:** Demonstrate scenarios where non-market allocation achieves *dynamic* efficiency (innovation/adaptation) comparable to markets, without using shadow prices derived from external markets.
  *   **Metric:** Can an AI-driven allocation system outperform a market in a high-uncertainty environment (e.g., R&D allocation) where the "correct" answer is unknowable in advance? If the AI merely optimizes past data, it confirms Hayek. If it successfully predicts/discovers novel value without price signals, it refutes him.

  **C. Conceptual Clarification (The most likely progress)**
  We need to stop asking "Can we plan?" and start asking "What kind of coordination mechanism fits which type of good?"
  *   **Progress:** Acknowledging that Lange was right about *routine* allocation (static efficiency) but Hayek was right about *innovative* allocation (dynamic efficiency).
  *   **Synthesis:** The debate dissolves if we admit that "Socialism" (central allocation) works for goods with low complexity and stable preferences (utilities, basic logistics), while "Markets" are required for high-complexity, high-innovation sectors.
  *   **The "Shadow Price" Concession:** Even modern planners admit they need "shadow prices" for capital. If they admit this, they admit they need a market-like signal. The debate then shifts to: *Can the state generate authentic shadow prices without private ownership?* (The Austrian answer remains "no," because without risk-bearing owners, the prices lack the signal of genuine scarcity).

  ### Summary Diagnosis
  The debate is stalled because it is a **category error.**
  *   **Lange** treated the economy as a **computation problem** (solving for X).
  *   **Hayek** treated the economy as a **communication problem** (generating X).

  **Digital Socialism** is trying to solve the communication problem with better computation. The Austrians argue that better computation doesn't help if the signal isn't being generated in the first place.

  **What counts as resolution?**
  Not a verdict on who was "right" in 1930, but a formalization of the **limits of hierarchy.** Progress looks like a theory that predicts *when* internal planning fails relative to market coordination based on the *complexity* and *tacitness* of the knowledge required. Until we can measure "tacitness" or "entrepreneurial discovery" as variables, the debate will remain a philosophical stalemate where each side absorbs empirical outcomes into their prior methodology.

  The Austrians win on **dynamic efficiency** (innovation/growth). The Planners win on **static efficiency** (inequality/redundancy reduction). The debate persists because society cannot decide which efficiency it values more, not because the economics is unresolved.
