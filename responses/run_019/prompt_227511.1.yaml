answer: |-
  Your unease is well-founded. Your friend has reconstructed a sophisticated version of what is known in contemporary literature as the **Inconsistency Theory of Truth** (championed by philosophers such as Matti Eklund and Kevin Scharp). The argument is designed to be a *reductio* of the hope that our naive concept of truth can be saved by technical fixes. However, like many *reductios*, it relies on premises that are far more contentious than they appear when stated baldly.

  While Step (8) is indeed the most dramatic—effectively sawing off the branch upon which the argument sits—the structural weakness lies earlier in the chain. To preserve the concept of truth without accepting the nihilistic conclusion of Step (7), you should primarily reject **Step (2)**, and secondarily reject **Step (6)**.

  Here is the diagnosis of why these steps fail, why they look compelling, and what the costs of rejecting them entail.

  ### The Primary Target: Step (2)

  > *(2) A theory of truth is adequate to our ordinary concept only if it settles, for every meaningful declarative sentence, whether that sentence is true.*

  This is the most vulnerable technical link in the chain. It looks compelling because it appeals to a notion of **completeness**. We intuitively feel that if a sentence is meaningful, it must be capable of being true or false; otherwise, what is it doing? Furthermore, if a theory of truth leaves some sentences unsettled, it appears to be leaving out part of the very phenomenon it is supposed to explain.

  **The Equivocation:**
  The step conceals an equivocation between **conceptual adequacy** and **formal capturability within a single language**. Step (2) demands that a consistent theory must be able to assign a truth-value to every sentence *in the language that contains the truth predicate itself*. This is a demand for **semantic closure**.

  However, Tarski's Undefinability Theorem demonstrates that for any sufficiently expressive formal language, a consistent truth predicate for that language cannot be defined *within* the language. To have a consistent theory, one must distinguish between an object language and a meta-language. Your friend's Step (5) anticipates this by invoking 'Revenge' (e.g., "This sentence is not true-in-the-meta-language"), but this only works if one insists that the *ordinary concept* of truth must be fully expressible in a single, static context without shift.

  **Why Reject It?**
  You should reject the claim that a theory is *inadequate* simply because it cannot settle every sentence within a single, consistent formal system. A theory can be adequate to our ordinary concept even if it reveals that our ordinary concept is **context-sensitive** or **indefinitely extensible**. For example, a contextualist theory (like that of Charles Parsons or Michael Glanzberg) argues that the Liar sentence is not settled *in the context of its utterance*, but can be assessed from a broader context. The theory settles the sentence, just not *where* the sentence tries to settle itself.

  **The Cost:**
  Rejecting (2) costs you the idea that truth is a simple, monolithic property applicable uniformly across all levels of discourse without restriction. You must accept that the T-schema (Step 3) cannot be applied universally in a single context without generating contradiction. This is the Tarskian price: we save truth by recognising that it is stratified or context-dependent. This is a significant metaphysical cost, but it is far cheaper than the cost of Step (7).

  ### The Secondary Target: Step (6)

  > *(6) If no consistent theory can be adequate to a concept, that concept is incoherent.*

  This is the deeper philosophical error. It assumes that **conceptual coherence** is identical to **formal consistency**.

  **Why Reject It?**
  Our ordinary concepts are often vague, open-textured, or governed by rules that clash at the margins. The fact that our naive concept of truth generates paradox under classical logic does not necessarily prove the concept itself is broken; it may prove that **classical logic is the wrong tool** for analysing it.
  *   **Dialetheists** (like Graham Priest) reject (6) by arguing the concept is coherent but the world (or semantics) contains true contradictions.
  *   **Conceptual Pluralists** argue the concept is coherent but complex, requiring different norms in different domains.

  To move from "we cannot formalise this consistently" to "the concept is incoherent" is to privilege formalisation over usage. Since the concept of truth functions perfectly well in 99.9% of our cognitive and linguistic lives, declaring it incoherent based on pathological edge-cases is an overreaction.

  **The Cost:**
  Rejecting (6) requires you to defend the idea that a concept can be robust even if it resists a consistent, classical formalisation. You must argue that the 'defect' lies in our expectation of logical perfection, not in the concept itself.

  ### The Self-Defeat: Step (8)

  Your intuition about Step (8) is correct and constitutes a classic *peritrope* (turning the table). Your friend claims that the incoherence of validity *confirms* the conclusion. This is a rhetorical sleight of hand.

  If the concept of validity is incoherent, then the relation of **logical consequence** is incoherent. If logical consequence is incoherent, then the premises of your friend's argument do not actually support the conclusion. An argument that concludes "reasoning is incoherent" undermines its own normative force. It might be *true* that reasoning is incoherent (if the argument were sound), but one could never be *justified* in believing it on the basis of that argument.

  Your friend treats this as a confirmation because, within an Inconsistency Theory, everything is supposed to be incoherent. But this renders the argument **pragmatically self-defeating**. It asks you to accept a conclusion on the basis of reasoning that the conclusion itself declares defective. You are well within your rights to reject the argument on these pragmatic grounds alone, even if you cannot pinpoint the technical error.

  ### Comparison of Costs

  You asked what rejecting these steps costs compared to accepting Step (7) (becoming an inconsistency theorist).

  1.  **Accepting (7) (The Friend's View):**
      *   **Cost:** You must engage in 'conceptual engineering'. You have to admit that our current concept of truth is defective and ought to be *replaced* by new, consistent concepts (e.g., 'ascending truth' and 'descending truth').
      *   **Consequence:** As your friend noted, since truth is the aim of belief, this suggests our current practice of belief and assertion is fundamentally flawed. This is a radically revisionary stance that threatens to disconnect philosophy from actual human practice.

  2.  **Rejecting (2) and (6) (The Defence of Truth):**
      *   **Cost:** You must accept that truth is not 'simple'. You may need to adopt a hierarchical view (Tarski), a contextualist view (Burge/Parsons), or a non-classical logic (K3/LP). You must concede that the T-schema (3) has exceptions or restrictions.
      *   **Benefit:** You preserve the core utility of the concept. You do not have to tell scientists, lawyers, or friends that their assertions rest on an incoherent notion. You merely tell them that edge-cases require careful logical handling.

  ### Recommendation

  Do not abandon the platitude of Step (3), as you rightly wish to keep it; it is the anchor of the concept. Instead, reject **Step (2)**.

  Argue that a theory of truth is adequate if it explains *why* the Liar cannot be settled within its own context, without requiring the theory to settle it *in that same context*. The demand for a consistent theory that is also semantically closed is a demand for the impossible. By rejecting (2), you block the inference to (4).

  Furthermore, challenge **Step (6)**. Insist that the inability to produce a consistent formal model does not entail the incoherence of the concept, but rather the limits of the model. Finally, remind your friend that Step (8) does not confirm their conclusion; it merely silences their argument. If validity is incoherent, they have not given you a *reason* to believe them; they have merely issued a warning that belief itself is broken. Until they provide a coherent reason to accept that warning, you are under no obligation to do so.
