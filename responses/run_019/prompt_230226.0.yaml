      *   *Thesis B (Ex Post Facto Law):* The laws applied were created after the acts were committed.
      *   *Thesis C (Selective Prosecution):* Similar acts by victors were not prosecuted.
      *   *Thesis D (Adjudicative Bias):* The judges lacked neutrality because they represented belligerent states.

  3.  **Evaluate Each Thesis:**
      *   *Thesis A (Constitutive):* True. The IMT was established by the London Agreement (US, UK, USSR, France). Is it a *problem*? In domestic law, the state prosecutes criminals. In international law, there is no global sovereign. It's structurally necessary but creates appearance issues. *Verdict: Trivially True (as description), Defensible-but-Irrelevant (as a critique of legitimacy per se).*
      *   *Thesis B (Ex Post Facto):* Mostly True regarding "Crimes Against Peace." War Crimes were customary law. *Nullum crimen sine lege* is a core legal principle. *Verdict: Genuine Problem (for specific counts), Factually Shaky (for War Crimes/Crimes Against Humanity).*
      *   *Thesis C (Selectivity):* True. No Allies were prosecuted. *Verdict: Genuine Problem (for moral consistency), Defensible-but-Irrelevant (for legal validity of specific convictions).*
      *   *Thesis D (Adjudicative):* True. Judges were appointees of the four powers. *Verdict: Genuine Problem (for procedural fairness).*

  4.  **Connect to the Conclusion ("International Law is Theater"):**
      *   To get from "Nuremberg was flawed" to "All International Law is Theater," the BIL needs a strong version of the critique.
      *   If it's just *Selectivity* (Thesis C), it implies hypocrisy, not necessarily that the law *itself* is fake.
      *   If it's *Ex Post Facto* (Thesis B), it suggests the trials weren't *law* but policy.
      *   If it's *Adjudicative Bias* (Thesis D), it suggests the process was rigged.
      *   *Crucial Link:* The BIL needs to argue that *power determines outcome*, not legal norms. Therefore, Thesis D (Bias) + Thesis B (No prior law) are the heavy lifters for the "Theater" conclusion. Thesis A is just context. Thesis C is moral criticism.

  5.  **Nuremberg vs. Tokyo:**
      *   *Nuremberg (IMT):* More procedural safeguards, dissenting opinions allowed (though none on guilt), better defense counsel (mostly).
      *   *Tokyo (IMTFE):* MacArthur had huge control, defense was hampered, dissenting opinions were more scathing (Pal, Roling), Emperor exempted.
      *   *Differentiation:* One can argue Nuremberg adhered closer to rule-of-law ideals despite the "victor" origin, while Tokyo was more explicitly an instrument of occupation policy. This relies on distinguishing *Constitutive Bias* (same for both) from *Adjudicative Bias/Procedure* (worse in Tokyo).

  6.  **Address the Overreach (Origin vs. Verdict):**
      *   Does the origin settle the verdict? No.
      *   Analogy: A corrupt police department can still catch a real murderer. The *source* of authority doesn't automatically invalidate the *factual findings* or the *moral weight* of the specific crimes (Holocaust, etc.).
