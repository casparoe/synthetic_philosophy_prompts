  2.  **Deconstruct "Victor's Justice" (The Theses):**
      *   *User's Point 1:* Winners staffed the courts/wrote rules. (Procedural/Structural)
      *   *User's Point 2:* Ex post facto laws (Crimes Against Peace). (Legal/Nullum Crimen)
      *   *User's Point 3:* Selectivity/Hypocrisy (Dresden/Hiroshima not prosecuted). (Substantive/Equality)
      *   *User's Point 4:* Judges ruled for their own side (Bias in adjudication). (Judicial Integrity)

      *Refining the Theses for Clarity:*
