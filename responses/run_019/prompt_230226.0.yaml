answer: |-
  This is an excellent breakdown of a common rhetorical move. Your brother-in-law is using "Victor's Justice" as a **stopper**—a slogan that functions as a conversation-ender rather than an argument. As you've noticed, it conflates the *origin* of the tribunal, the *substance* of the law, the *selection* of defendants, and the *conduct* of the judges.

  To run a productive reading group, you need to disentangle these threads. Below is a taxonomy of the four distinct theses hidden inside the slogan, evaluated by your requested criteria, followed by an analysis of what is required to sustain the "theater" conclusion, the Tokyo/Nuremberg distinction, and the problem of overreach.

  ### 1. Taxonomy of the "Victor's Justice" Theses

  Here are the four distinct claims your brother-in-law is smuggling together, categorized by their logical status.

  #### Thesis A: The Constitutive Claim
  *   **The Claim:** The tribunal was established unilaterally by the victorious powers to judge the vanquished, rather than by a neutral global sovereign.
  *   **Status:** **Trivially True.**
  *   **Analysis:** The International Military Tribunal (IMT) was created by the London Agreement (US, UK, USSR, France). There was no UN Security Council or global parliament at the time.
  *   **Relevance:** This is a description of history, not necessarily a critique of legitimacy. In the absence of a global sovereign, *someone* must enforce norms. If this thesis alone were true, it would not invalidate the law; it would just describe the politics of its creation.

  #### Thesis B: The *Nullum Crimen* Claim (Ex Post Facto)
  *   **The Claim:** The defendants were convicted of crimes that did not exist in positive law at the time they were committed (specifically "Crimes Against Peace").
  *   **Status:** **Factually Shaky (Mixed).**
  *   **Analysis:**
      *   *War Crimes & Crimes Against Humanity:* These were largely codified in the Hague and Geneva conventions prior to WWII. Convictions here were not *ex post facto*.
      *   *Crimes Against Peace (Aggression):* This was new. The IMT argued that the Kellogg-Briand Pact (1928) had already rendered aggressive war illegal, but criminal liability for *individuals* was novel.
  *   **Relevance:** This is a **Genuine Problem** for the "Crimes Against Peace" count, but it does not invalidate the convictions for the Holocaust or atrocities on the Eastern Front.

  #### Thesis C: The Selectivity Claim (Hypocrisy)
  *   **The Claim:** The victors committed similar acts (firebombing of civilians, unrestricted submarine warfare) but were not prosecuted, proving the law is applied selectively based on power.
  *   **Status:** **Trivially True.**
  *   **Analysis:** No Allied personnel were indicted for Dresden, Hiroshima, or the firebombing of Tokyo.
  *   **Relevance:** **Defensible-but-Irrelevant** regarding the *legal guilt* of the Nazis, but a **Genuine Problem** for the *moral legitimacy* of the court as a universal institution. It proves the trials were political, but it does not prove the defendants were innocent. (The *tu quoque* defense was explicitly rejected at Nuremberg: "B did X" does not legally excuse "A did X".)

  #### Thesis D: The Adjudicative Claim (Bias)
  *   **The Claim:** The judges were appointees of the belligerent states, lacked neutrality, and were instructed (formally or informally) to ensure conviction, rendering the process a show trial.
  *   **Status:** **Factually Shaky (Nuremberg) / Factually Plausible (Tokyo).**
  *   **Analysis:**
      *   *Nuremberg:* Defense counsel had significant latitude, cross-examination was robust, and three defendants were acquitted (Schacht, Papen, Fritzsche). This suggests the judges were not merely rubber stamps.
      *   *Tokyo:* General MacArthur had sweeping powers to alter the charter; defense was hampered; the Emperor was immunized by fiat.
  *   **Relevance:** This is the only thesis that, if proven, constitutes a **Genuine Problem** for treating the trials as *law* rather than *policy*. If the adjudication is rigged, the verdict is void.

  ---

  ### 2. What Your Brother-in-Law Needs for the "Theater" Conclusion

  To move from "Nuremberg had flaws" to "International Criminal Law is **basically theater**," your brother-in-law needs to rely primarily on **Thesis D (Adjudicative Bias)** supported by **Thesis B (Ex Post Facto)**.

  *   **Why Thesis A isn't enough:** Acknowledging the winners set up the court doesn't mean the law is fake. Domestic courts are set up by the state (the "winner" of the social contract) to judge criminals.
  *   **Why Thesis C isn't enough:** Selective prosecution proves hypocrisy, not that the law itself is nonexistent. A speed trap is still a law even if the police only catch one driver.
  *   **The Necessary Argument:** To call it "theater," he must argue that **legal norms did not constrain the outcome.** He needs to argue that the judges were incapable of acquitting regardless of evidence (Thesis D) and that they were applying rules that didn't exist (Thesis B).

  **Counter-argument for your group:** The acquittals at Nuremberg (3 out of 22 defendants, plus 3 organizations declared not criminal) are the strongest empirical evidence against the "Theater" conclusion. In a true show trial (e.g., the Moscow Trials of the 1930s), the conviction rate is 100%.

  ---

  ### 3. Can Nuremberg be Defensible while Tokyo was Not?

  **Yes.** This is a crucial distinction for your reading group. Many legal scholars hold this view.

  *   **Procedural Integrity:** The Nuremberg IMT allowed the defense to challenge the validity of the charter (the judges ruled against them, but they *heard* the argument). The Tokyo IMTFE (International Military Tribunal for the Far East) was more tightly controlled by General MacArthur's headquarters.
  *   **Judicial Dissent:** At Tokyo, Justice Radhabinod Pal (India) wrote a massive dissent arguing the entire trial was illegitimate victor's justice. Justice Bert Röling (Netherlands) also dissented on several counts. At Nuremberg, the judgment was unanimous on the issue of guilt (though sentences varied). While unanimity sounds better, the Tokyo dissents highlight that the *legal reasoning* was more contested in the Pacific theater.
  *   **The Emperor:** The explicit decision to exempt Hirohito from prosecution in Tokyo, despite evidence of his involvement, undermines the legal consistency of the tribunal in a way that had no parallel at Nuremberg (where the Head of State, Dönitz, was tried).

  **The Distinction:** One can argue Nuremberg was a **flawed legal proceeding** that nonetheless adhered to minimum rule-of-law standards, whereas Tokyo was closer to an **instrument of occupation policy**. This allows you to accept the "Victor's Justice" critique for Tokyo without letting it invalidate the entire project of international criminal law based on Nuremberg.

  ---

  ### 4. The Overreach: Origin vs. Verdict

  Your intuition is correct: the slogan commits a version of the **Genetic Fallacy**. It treats the *origin* of the tribunal as settling the *truth* of the verdicts.

  *   **The Logical Gap:** Even if the court was established by victors (Thesis A) and was selective (Thesis C), it remains possible that:
      1.  The facts found were true (the Holocaust happened).
      2.  The acts violated existing customary norms (War Crimes).
      3.  The defendants were personally responsible.
  *   **The "Broken Clock" Argument:** A clock set by a victor can still tell the right time. If the evidence of mass murder is overwhelming, the legitimacy of the *conviction* rests on the evidence, not solely on the geopolitical status of the prosecutors.
  *   **Reading Group Angle:** Ask the group: *If a corrupt police officer plants evidence, the trial is void. If a victorious power creates a court but presents authentic evidence of atrocities, is the verdict void?* This distinguishes **procedural illegitimacy** from **factual falsehood.**

  ---

  ### 5. Suggested Readings for the Group

  To move the conversation past the slogan, assign texts that force a choice between these theses.

  1.  **For the "Victor's Justice" Critique:**
      *   **Excerpt:** Justice Radhabinod Pal's Dissenting Opinion at the Tokyo Trial (specifically the sections on *ex post facto* law and the immunity of the Emperor).
      *   **Secondary:** Neil Boister & Robert Cryer, *The Tokyo International Military Tribunal: A Reappraisal*. (Nuanced view on why Tokyo was legally weaker than Nuremberg).

  2.  **For the "Legitimacy Despite Flaws" Defense:**
      *   **Excerpt:** Robert H. Jackson's Opening Statement at Nuremberg. (Focus on his argument that the record must be established so it cannot be denied later).
      *   **Secondary:** Gary Bass, *Justice at Nuremberg*. (Historical account showing the intense internal debates among the Allies, proving it wasn't a foregone conclusion).

  3.  **For the Philosophical Distinction:**
      *   **Text:** H.L.A. Hart, "Positivism and the Separation of Law and Morals" (specifically the "Grudge Informer" case discussion).
      *   **Application:** Ask the group to apply Hart's analysis to the Nuremberg *ex post facto* problem. Is it better to punish using a new law, or let them go unpunished because no old law fit?

  ### Summary for your Brother-in-Law
  If you see him over the holidays, you can tell him:
  > "You're conflating the **politics of the court's creation** with the **legality of the verdicts.** Selectivity and victor-creation are true, but they only make the trials hypocritical, not legally void. To prove it was 'theater,' you have to prove the judges were incapable of acquitting regardless of evidence. The three acquittals at Nuremberg suggest they weren't. Tokyo is a harder case, but generalizing Tokyo to all international law is an overreach."

  This acknowledges his point (validating him) while forcing him to defend the specific logical leap to "theater."
