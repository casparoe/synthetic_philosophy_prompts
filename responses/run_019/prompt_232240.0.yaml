answer: |-
  Bradley's Regress argues that if a complex entity is constituted by distinct constituents linked by a relation, a further relation is required to link the first relation to the constituents, generating an infinite vicious regress that precludes unity. This argument is deployed both ontologically, against the unity of facts (states of affairs), and semantically, against the unity of propositions. While these deployments are formally isomorphic, they are not merely one problem in different vocabulary. They exert distinct pressures because facts and propositions serve different metaphysical roles. Ultimately, the deployment against propositions is more damaging. While the ontological target can evade the regress by treating facts as primitive unities, the semantic target cannot make an equivalent move without sacrificing the explanatory power required of propositional content.

  Consider first the ontological deployment. If the fact that $a$ is $F$ comprises particular $a$, universal $F$, and instantiation $I$, what binds them? If $I$ is just another constituent, we require $I'$ to bind $I$ to $a$ and $F$, and so on. The threat here is that reality dissolves into a dust of unrelated entities. However, this deployment allows for a robust evasion strategy: non-mereological priority. Metaphysicians like Kit Fine argue that facts (or states of affairs) are fundamental, and their constituents are abstractions derived from them. On this view, the fact *that $a$ is $F$* is not built from $a$ and $F$; rather, $a$ and $F$ are ontological shadows cast by the fact.

  This move is viable because the unity of a fact is a unity of *existence*. A fact does not need to represent anything; it simply needs to obtain. If we posit the fact as a primitive, sui generis entity, the demand for a "glue" relation dissolves. The fact is not a composite requiring assembly; it is a fundamental unit of reality. The regress arises only if we assume a mereological picture where wholes are constructed from independent parts. By rejecting that picture, the ontologist secures unity without infinite relations. The cost is a form of holism, but one compatible with a world that simply *is*.

  Now consider the semantic deployment against propositions. The proposition $\langle a, F \rangle$ must be distinct from the mere list $\{a, F\}$ because it is truth-evaluable; it asserts that $a$ is $F$. If the proposition is a complex of constituents, Bradley asks what unites them into a claim rather than a set. Can the semantic theorist adopt the same priority move? Can they claim the proposition is primitive and its constituents derivative?

  Here, the pressure is significantly greater. Propositions are not just existing entities; they are representational vehicles with accuracy conditions. Their unity is a unity of *sense* or *predication*. If we treat the proposition that $a$ is $F$ as an unstructured primitive, we face the "problem of direction." The proposition that $a$ loves $b$ differs from the proposition that $b$ loves $a$, even if they share constituents. If the proposition is a primitive atom, what accounts for this difference? If we say the primitives are simply different, we lose the systematic connection between the proposition and the objects it concerns.

  Furthermore, the priority move undermines compositionality, a cornerstone of semantic theory. We understand novel sentences because we understand their parts and their mode of combination. If propositions are prior to their constituents, the structure of language no longer mirrors the structure of thought. We would have to learn every proposition as a brute fact, unable to derive the meaning of "Socrates is mortal" from the meanings of "Socrates" and "mortal." While an ontologist can accept brute facts without crippling their system, a semanticist who accepts brute propositions cripples their explanation of linguistic understanding.

  Additionally, the semantic regress must account for falsehood. A fact that $a$ is $F$ exists only if $a$ is $F$. A proposition that $a$ is $F$ exists even if $a$ is not $F$. If the proposition is a primitive unity, how does it maintain its specific representational content without the actual obtaining of the state of affairs? The ontological unity is guaranteed by existence; the propositional unity must be maintained independently of truth. This makes the "glue" problem harder for propositions. A relation that binds constituents in a false proposition cannot be real instantiation (since the fact doesn't obtain), yet it must be sufficient to create a unified content.

  Are these one problem? Superficially, yes: both ask how many become one. But the "one" in ontology is a concrete existence, while the "one" in semantics is an abstract content. The ontological regress threatens the coherence of reality; the semantic regress threatens the possibility of meaning. The former can be stopped by asserting that reality is not built from parts. The latter cannot be stopped by asserting that meanings are not built from parts, because the systematicity of meaning *requires* that they be built from parts.

  Therefore, the deployment against propositions is ultimately more damaging. The ontologist can bite the bullet of non-mereological priority, accepting facts as brute unities without losing the ability to describe the world. The world's structure can be fundamental. The semanticist, however, cannot accept propositions as brute unities without abandoning the explanation of how finite minds grasp infinite contents through composition. To evade Bradley's regress by making propositions primitive is to save unity at the cost of intelligibility. Thus, while facts may survive as unanalyzable atoms of reality, propositions cannot survive as unanalyzable atoms of meaning without collapsing the theory of language they are meant to support. The semantic regress leaves no safe haven; the ontological regress leaves at least one.
