answer: |-
  Here is a complete lesson plan designed to generate the specific cognitive dissonance you're looking for. It moves from concrete frustration to abstract resolution, forcing the students to construct the non-constructive proof themselves.

  ### **Lesson Overview**
  *   **Topic:** Chomp and Non-Constructive Existence Proofs.
  *   **Time:** 75 Minutes.
  *   **Students:** 24 (12 pairs).
  *   **Goal:** Students experience the inability to find a winning strategy, derive the Strategy-Stealing Argument via contradiction, and critique the "monotonicity" assumption that makes the proof work.

  ---

  ### **1. Preparation & Materials**
  *   **Handout 1 (The Game):** Contains rules and 3 specific boards ($3\times3$, $3\times4$, $4\times5$).
  *   **Handout 2 (The Detective Work):** A worksheet with guided logic questions (distributed at minute 30).
  *   **Props:** 12 packets of colored pencils (two colors per pair to mark moves).
  *   **Board Setup:** Desks arranged for pairs.

  ---

  ### **2. The Handouts**

  #### **Handout 1: Chomp**
  **The Rules:**
  1.  We have a rectangular grid of squares. The bottom-left square $[1,1]$ is **POISON**.
  2.  Players alternate turns.
  3.  A move consists of picking any remaining square $[i,j]$. You "chomp" that square and **all** squares above it and to the right of it ($x \ge i, y \ge j$).
  4.  The player forced to eat the POISON square $[1,1]$ **LOSES**.
  5.  **Task:** Play 3 rounds on each board size below. Switch who goes first. Try to determine: **Does Player 1 have a guaranteed winning move? If so, what is it?**

  **The Boards:**
  *   **Board A:** $3 \times 3$
  *   **Board B:** $3 \times 4$
  *   **Board C:** $4 \times 5$
  *(Include visual grids on the paper)*

  #### **Handout 2: The Detective Worksheet**
  *(Distribute this after the play phase)*
  1.  Assume for the sake of argument that **Player 2 has a winning strategy**.
  2.  Player 1 makes a specific, "dummy" move: They chomp **only** the top-right corner square $[m,n]$.
  3.  Since we assumed Player 2 wins, Player 2 must have a winning response to this move. Let's call this response **Move X**.
  4.  **Question:** Look at Board A. If Player 2's winning response is "Move X", could Player 1 have played "Move X" as their *very first move* of the game? Why or why not?
  5.  **Conclusion:** If Player 1 could have played Move X at the start, what does that imply about our assumption that Player 2 wins?

  ---

  ### **3. Timeline & Script**

  #### **0:00 – 0:10: Introduction & Rules**
  *   **Hook:** "Today we are going to prove something exists without ever finding it. It's going to feel like cheating. It's not."
  *   **Demo:** Play one quick game on the board against a volunteer. Ensure they understand the "poison" rule (Misère play).
  *   **Instruction:** "Your goal is not just to play. Your goal is to solve the game. For each board size, I want you to tell me: *What is Player 1's winning opening move?* Write it down."

  #### **0:10 – 0:35: The Struggle (Guided Play)**
  *   **Activity:** Students play in pairs. They must record the opening move of the winner for every game.
  *   **Instructor Role:** Circulate.
      *   If a pair solves $3 \times 3$ quickly: "Great. Now solve $3 \times 4$. Don't use symmetry; rectangular boards break symmetry."
      *   If they try to map the whole tree: "Don't brute force it. Look for a pattern in the winning opening move."
      *   **Crucial Intervention:** If someone claims they found the strategy for $4 \times 5$, ask them to bet on it against you. (Usually, they haven't actually solved it, they just won a few games).
  *   **The Feeling:** By minute 30, most pairs will be frustrated. $3 \times 3$ is solvable (take $[3,2]$ or $[2,3]$), but $3 \times 4$ and $4 \times 5$ are computationally annoying. They will feel that P1 *should* win (empirically they do), but they can't pin down the move.

  #### **0:35 – 0:45: The Pivot (Hinting)**
  *   **Call to Attention:** "Stop playing. Keep your boards. Look at your data. Did Player 1 win most games?" (Yes).
  *   **The Question:** "You can't find the move. But you suspect P1 wins. Let's try to prove P1 wins *without* finding the move."
  *   **Distribute Handout 2.**
  *   **Prompt:** "I want you to assume the opposite of what you want to prove. Assume **Player 2** has the winning strategy. Follow the logic on the sheet."
  *   **Group Work:** Let them wrestle with Handout 2. Walk around and listen for the key realization: *The move P2 makes to beat the dummy move was available to P1 at the start.*

  #### **0:45 – 0:60: Formalizing the Argument**
  *   **Board Work:** Ask a group to come to the board. Do not let them lecture. Ask them to draw the states.
      1.  Draw Start State.
      2.  Draw State after P1 takes Top-Right (only 1 square).
      3.  Draw State after P2 responds with Move X.
      4.  **Ask the Class:** "Compare State 1 and State 3. Could we go from 1 to 3 directly?"
  *   **The Realization:** They should see that Move X removes a chunk of chocolate. Taking the Top-Right square removes a tiny chunk. Since the Top-Right square is *inside* the chunk removed by Move X, Move X was legal at the start.
  *   **Write the Proof:** Collaboratively write the formal Strategy-Stealing proof on the board based on their drawings.

  #### **0:60 – 0:75: The Debrief (Constructive vs. Non-Constructive)**
  *   **Concept Mapping:**
      *   "We proved P1 wins." (Existence)
      *   "Do we know the move?" (No)
      *   "This is a **Non-Constructive Proof**."
  *   **The Load-Bearing Assumption (The Core Request):**
      *   **Ask:** "In our proof, P1 makes a 'dummy move' (top-right corner). We assumed P2 has a response that wins. What if P2's winning response *required* that top-right square to be gone?"
      *   **Wait for answers.** (Someone will say: "But P1 could have just taken that response first.")
      *   **Push deeper:** "Why is that legal? What property of Chomp allows us to say 'Move X is valid at the start' even though P2 played it after P1 moved?"
      *   **Target Answer:** **Monotonicity / Nesting.** Removing a set of squares $S$ is always a valid move. If Move X removes set $S_X$, and the Dummy Move removes set $S_D$, and $S_D \subset S_X$, then playing $S_X$ is valid at the start.
      *   **Philosophical Point:** "The proof breaks if the game isn't monotonic. If taking the top-right square somehow *unlocked* a new move for P2 that wasn't available before, the proof fails. We are assuming the board only shrinks, it never changes rules."

  ---

  ### **4. Predictable Pitfalls & Mitigation**

  | Pitfall | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Symmetry Strategy** | Students love symmetry. On $3\times3$ or $4\times4$, P1 takes $[n,n]$ and mirrors P2. | **Ban it.** Explicitly tell them: "Symmetry works for squares. I want to know about $3\times4$. Symmetry is dead there." |
  | **Brute Force Trees** | Math majors love exhaustive cases. They will try to map $4\times5$. | **Time Pressure.** At minute 25, announce: "If you haven't solved $4\times5$ by now, you won't in 5 mins. Stop. We need a smarter way." |
  | **Confusing "Win"** | Students think "win" = eat most chocolate. | **Repetition.** Every 5 mins, ask: "Who ate the poison? You lose. Remember the goal." |
  | **Missing the Contradiction** | They see P1 *could* play Move X, but don't see why that contradicts P2 winning. | **Script:** "If P1 plays Move X at the start, P1 is now in the position we assumed was a 'Winning Position for Player 2'. Who wins now?" |
  | **The "Harmless" Assumption** | They gloss over *why* Move X is available. | **Specific Question:** "Does P1's dummy move *remove* the option for P2 to play Move X? No. Does it *add* options? No. It just passes the turn." |

  ---

  ### **5. Honest Assessment: What the Game Can't Do**

  You asked for honesty about the limitations of this activity. Here is what the game play *cannot* generate, which you must supply in the lecture/debrief:

  1.  **The Rigor of "Strategy":**
      *   *Limitation:* Students play intuitively. They don't naturally distinguish between "a winning move" (one action) and "a winning strategy" (a function mapping all states to moves).
      *   *Your Job:* You must explicitly define **Strategy** in the debrief. The proof steals the *strategy*, not just a move. You need to articulate that P2's response is part of a global plan, and P1 hijacks that plan.

  2.  **The "Why" of Non-Constructivism:**
      *   *Limitation:* The game makes them feel *frustrated* that they don't know the move. It doesn't explain *why* the math forbids knowing it easily.
      *   *Your Job:* Explain that the proof relies on the *existence* of a winner (Zermelo's Theorem for finite games), not the *computation* of it. The proof tells us the set of winning moves is non-empty, but gives no algorithm to find the element.

  3.  **The "Harmless Move" Nuance:**
      *   *Limitation:* In the game, taking the top-right square feels like a "waste." Students intuitively know it's a bad move.
      *   *Your Job:* You must clarify that the proof **does not claim** the top-right move is a *winning* move. It claims it is a *legal* move that leads to a state where P2's supposed winning strategy reveals a contradiction. The "harmlessness" is logical (it doesn't break the nesting property), not strategic (it's likely a losing move). **This is the philosophical load-bearing bit:** The proof works *because* the move is likely bad, which forces P2 to reveal a better move that P1 should have taken.

  ### **6. The "Load-Bearing" Debrief Script**
  *Use this verbatim or adapt closely for the final 10 minutes.*

  "We proved Player 1 wins. But I still can't tell you the winning move for a $100 \times 100$ board. Why?

  Look at the assumption we made. We said P1 takes the top-right square. Then P2 responds with a winning Move X. We concluded P1 should have just played Move X.

  **Here is the dangerous assumption:** We assumed that P2's winning response (Move X) was **available** to P1 at the very start.

  Why was it available? Because Chomp is **monotonic**. Removing the top-right square removes a set of chocolates $S_{tiny}$. Move X removes a set $S_{big}$. Since $S_{tiny}$ is in the corner, $S_{tiny} \subset S_{big}$. Therefore, playing $S_{big}$ was legal at turn 1.

  **Imagine a different game:** 'Poison Chomp with Traps.' If you take the top-right square, a trap springs and square $[2,2]$ becomes un-chompable.
  Does our proof work? **No.**
  Why? Because P2's winning response might rely on chomping $[2,2]$. If P1 takes the top-right, they trigger the trap, making $[2,2]$. un-chompable. P1 *cannot* copy P2's move.

  So, the Strategy-Stealing proof isn't magic. It relies entirely on the fact that **moves only restrict future options, they never change the rules of what is legal.** That monotonicity is the price we pay for a non-constructive proof."
