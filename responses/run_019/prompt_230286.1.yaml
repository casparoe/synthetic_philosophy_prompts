      *Refining the "Unresolved" part:* The description is that the courts engaged in "interpretive reconstruction of the prior legal order." A natural lawyer sees morality driving the interpretation. A positivist sees internal hierarchy/sources driving the interpretation. The text of the judgment allows both readings.

