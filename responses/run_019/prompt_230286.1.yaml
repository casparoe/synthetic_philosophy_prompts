answer: |-
  The conviction of the East German border guards (the *Mauerschützen-Prozesse*) is one of the most significant case studies in modern jurisprudence. It directly echoes the "Grudge Informer" debate between H.L.A. Hart and Lon Fuller following World War II. To answer your question, we must distinguish between the *rhetoric* employed by the German courts, the *logical requirements* of the conviction, and the *theoretical frameworks* available to explain them.

  ### 1. Does the practice strictly presuppose a Natural Law thesis?

  **No.** Convicting the guards does not *strictly* presuppose the natural-law thesis that "unjust law is not law" (*lex iniusta non est lex*).

  While the German Federal Constitutional Court and the Federal Court of Justice explicitly utilized the **Radbruch Formula**—which states that positive law loses its legal validity if the contradiction between it and justice reaches an "intolerable" level—this reasoning is a *sufficient* condition for the conviction, not a *necessary* one.

  The Natural Law interpretation is straightforward: The GDR directives were so morally abhorrent that they lacked legal character. Therefore, the guards had no legal authority to shoot, and their actions constituted ordinary homicide under general principles of criminal law. This fits the courts' language perfectly. However, the *outcome* (conviction) can be achieved without accepting the metaphysical claim that immorality negates legal validity.

  ### 2. Is the practice fully compatible with Legal Positivism?

  **Yes.** The practice is fully compatible with legal positivism, provided the positivist constructs the argument carefully. Legal positivism maintains that the existence of law is one thing, its merit or demerit another. A positivist can acknowledge that the GDR directives were "law" within the GDR system at the time but still argue for conviction on different grounds.

  There are two primary ways a positivist can accept the result of the trials:

  **A. The "Hartian" Solution (Honest Retroactivity)**
  H.L.A. Hart, arguing about similar post-war cases, suggested that if a law is valid but wicked, we should not lie and say it "was not law." Instead, we should openly acknowledge it was law, but pass a **retroactive statute** in the new regime to punish the acts.
  *   **What the positivist says:** "The GDR directive was valid law. It granted the guards permission. However, the unified German legislature has now passed a law stating that acting under that directive is punishable. We are applying retroactive law, which is a moral sacrifice we make to achieve justice."
  *   **Compatibility:** This is pure positivism. It separates the validity of the old law from the moral necessity of punishment. The German courts rejected this path to avoid violating the principle of *nullum crimen sine lege* (no crime without law), but a positivist *could* have accepted this route.

  **B. The "Internal Illegality" Solution (Inclusive Positivism)**
  This is the more sophisticated positivist argument that aligns closer to the actual German verdict without invoking transcendent morality.
  *   **What the positivist says:** "We do not need to say the directive was 'not law' because it was unjust. We only need to show that the directive was **invalid according to the GDR's own legal criteria**."
  *   **The Argument:** The GDR Constitution guaranteed the inviolability of human life and dignity. The GDR had also signed international human rights treaties (e.g., the UN Covenant on Civil and Political Rights) which, under GDR law, were part of the domestic legal order. Therefore, the border directives were *ultra vires* (beyond power) or unconstitutional *within the GDR system*.
  *   **Result:** The guards were not following valid law, even by GDR positivist standards. They were following an administrative order that contradicted higher-ranking legal norms (the Constitution/Treaties) existing *at the time*.
  *   **Compatibility:** This relies entirely on **sources** (Constitution, Treaties, Statutes) rather than moral merit. It allows a positivist to agree with the conviction while maintaining that "law is a matter of social fact."

  ### 3. Distinguishing Strict Presupposition from "Fit"

  *   **What fits well:** The courts' *language* fits Natural Law theory very well. By invoking "fundamental principles of justice" and "intolerable" violations, the judges sounded like natural lawyers. They appealed to a morality external to the GDR's rule of recognition to invalidate the directives.
  *   **What is strictly presupposed:** The *practice of conviction* strictly presupposes only that there was **some legal basis** for punishment that overrides the defense of superior orders. It does not presuppose *why* that basis overrides the orders. It does not logically require that the prior directive lacked the status of law; it only requires that the directive provided no *immunity* from prosecution in the new forum.

  Therefore, the practice does not force one to choose Natural Law over Positivism. It merely forces one to choose between **retroactive punishment** (Hart's preference) or **reinterpretation of the prior legal order** (the German Court's preference).

  ### 4. Is there a description that leaves the dispute unresolved?

  **Yes.** There is a way to describe the courts' reasoning that allows both the natural lawyer and the positivist to claim the victory, leaving the meta-ethical dispute unresolved. This description focuses on **interpretive reconstruction**.

  One can describe the court's reasoning as follows:
  > "The Court interpreted the GDR legal system as a coherent whole. In doing so, it determined that the border directives could not be reconciled with the GDR's own constitutional commitments to human rights and the international law the GDR had recognized."

  *   **The Natural Lawyer reads this as:** The court recognized that the GDR's constitutional commitments were only binding because they reflected objective moral principles. When the directives violated those principles, they ceased to be law. The "source" of the invalidity is morality.
  *   **The Positivist reads this as:** The court engaged in a standard hierarchical analysis. The GDR Rule of Recognition included the Constitution and International Treaties as superior sources. The directives conflicted with these sources. Therefore, they were legally void *ab initio* based on social facts about the GDR system. The "source" of the invalidity is the hierarchy of norms.

  Because the GDR Constitution *did* contain language protecting human dignity, the text of the prior law supports both readings. The Natural Lawyer sees the Constitution as a vessel for moral truth; the Positivist sees it as a higher-order social fact.

  ### Conclusion

  The conviction of the border guards does not strictly presuppose a natural-law thesis. While the German courts employed the **Radbruch Formula**, which sounds in natural law, the result is fully compatible with **legal positivism**.

  To accept the result, a positivist must argue either that:
  1.  **Retroactivity is acceptable:** The FRG openly imposed new liability for past acts (Hart's view); or
  2.  **Internal Invalidity:** The directives were illegal even under the GDR's own positivist criteria because they violated the GDR Constitution or binding international treaties (the "Inclusive Positivist" view).

  The practice leaves the dispute unresolved if we describe the courts' action as **interpreting the prior legal order's hierarchy of norms**. This description allows the natural lawyer to see morality validating the Constitution, and the positivist to see the Constitution validating the law, without requiring agreement on the ultimate nature of legal validity.
