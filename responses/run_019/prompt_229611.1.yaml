answer: |-
  ### Module: Deception and the Structure of Consent

  **Objective:** To distinguish between lies that invalidate consent and lies that do not, based on the structural relationship between the deception and the authorization given.

  #### Scenario 1: The Conditional Authorization (Invalid Consent)
  Jordan and Taylor meet at a university event. They begin discussing the possibility of going home together. During the conversation, Jordan explicitly states a boundary: "I am not interested in a short-term fling. I only sleep with people who are planning to stay in this city for at least the next year. I don't do goodbyes."

  Taylor, who plans to graduate and leave the city in three weeks, replies: "That works for me. I am planning to stay in this city for the long term." This is a deliberate lie.

  Hearing this, Jordan says, "Okay, in that case, I am happy to go home with you." They engage in sexual activity.

  #### Scenario 2: The Unconditional Authorization (Valid Consent)
  Jordan and Taylor meet at a university event. They begin discussing the possibility of going home together. During the conversation, Jordan states: "I'm open to seeing where things go, whether you're here for a week or a decade. I'm not looking for guarantees."

  Taylor, who plans to graduate and leave the city in three weeks, replies: "Good. I am planning to stay in this city for the long term." This is a deliberate lie, told perhaps to appear more stable or committed, though Taylor knows Jordan just said guarantees were unnecessary.

  Jordan says, "Great, let's go." They engage in sexual activity.

  ***

  ### Theoretical Analysis

  In both scenarios, the lie is identical ("I am planning to stay in this city"), the delivery is similar (a statement of future intent during negotiation), and the physical acts are the same. The verdicts on consent, however, differ across all three theoretical families.

  #### 1. Autonomy-Based Views
  *   **Focus:** Whether the consent-giver was able to exercise self-governance according to their own values and rules.
  *   **Scenario 1:** Jordan's autonomy is violated. Jordan established a rule for decision-making ("Only if staying"). Taylor's deception bypassed this rule, causing Jordan to act against their own stated governance. Jordan did not author the action that occurred.
  *   **Scenario 2:** Jordan's autonomy is respected. Jordan's rule was ("I am open regardless"). Taylor's lie was irrelevant to Jordan's decision-making process. Jordan authorized the act based on their actual values (openness), and those values were satisfied.
  *   **Verdict:** Invalid in 1; Valid in 2.

  #### 2. Wrongness-Based Views
  *   **Focus:** Whether the act constitutes a moral wrong against the consent-giver (e.g., using them as a mere means).
  *   **Scenario 1:** Taylor uses Jordan as a mere means. Taylor knew Jordan would not consent to the *actual* situation (a short-term fling) and manipulated Jordan to secure access to their body. The deception transforms the act from a shared partnership into a exploitation of Jordan's boundaries.
  *   **Scenario 2:** Taylor is dishonest, but does not wrong Jordan *regarding the sexual act*. Jordan agreed to the interaction without requiring the truth of Taylor's plans. Taylor's lie is a separate moral failing (lying), but it does not render the sexual interaction itself a violation of Jordan's rights.
  *   **Verdict:** Invalid in 1; Valid in 2.

  #### 3. Communicated Mental Act (Transfer of Permission)
  *   **Focus:** Whether a normative permission was successfully transferred from one agent to another through communication.
  *   **Scenario 1:** The permission transfer failed. Consent is not just the word "yes"; it is the communication of a specific scope of permission. Jordan communicated: "Permission granted *if* you are staying." Because the condition was false, the permission never activated. Taylor acted without permission.
  *   **Scenario 2:** The permission transfer succeeded. Jordan communicated: "Permission granted." The statement about staying was background information, not a condition attached to the permission. The permission was transferred unconditionally, and Taylor holds valid permission for the act.
  *   **Verdict:** Invalid in 1; Valid in 2.

  ***

  ### The Structural Feature: Conditionality

  The feature that separates the two scenarios is **the conditionality of the authorization**.

  In Scenario 1, the consent is **conditional**. The "yes" is logically dependent on the truth of the seeker's statement. The consent takes the form: *If P, then I consent.* Since P is false, the consent does not obtain.

  In Scenario 2, the consent is **unconditional** regarding that fact. The "yes" stands independently of the truth of the seeker's statement. The consent takes the form: *I consent (and by the way, I note your statement P).* Since the consent is not dependent on P, the falsity of P does not retract the permission.

  **If this feature is removed:**
  *   If you remove conditionality from Scenario 1 (make Jordan indifferent to staying), the theories shift to Valid Consent. The lie becomes morally regrettable but does not vitiate consent.
  *   If you impose conditionality on Scenario 2 (make Jordan require the truth despite saying they are open), the theories shift to Invalid Consent. The lie becomes a tool of coercion-by-deception.

  ***

  ### The Strongest Objection: The "Pure Mental Act" View

  **Objection:** "Consent is a present-tense mental state of willingness to engage in the physical act. If Jordan was sober, competent, and said 'yes' to the sex itself, consent occurred. Deception is a separate moral wrong, but it does not undo the mental act of authorization. In both scenarios, Jordan mentally agreed to the sex. Therefore, consent is valid in both cases. To claim otherwise conflates 'bad sex' or 'lying' with 'non-consensual sex.' If I lie to get you to buy my car, the sale is voidable, but I didn't steal the car. Similarly, Taylor lied to get sex, but did not take it without permission. The conditionality you describe is a social preference, not a normative boundary that stops consent from existing."

  **Response for Trainees:** This objection forces you to decide if consent is merely a *psychological state* (I feel like doing this) or a *normative transaction* (I grant you right of access). If you accept the objection, then almost no deception vitiates consent unless it involves force or incapacity. If you reject it, you must identify *which* lies break the transaction. The module above argues that the break occurs when the lie targets the *conditions* under which the transaction was authorized.
