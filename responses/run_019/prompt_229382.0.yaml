answer: |-
  Your working rule is a strong start, but it breaks on three specific fractures in your own list. It treats consent as a static state of mind, but your intuitions correctly recognize it as a *transactional process* sensitive to power, context, and design.

  Here is the stress test of your rule, followed by a refined principle that accommodates your verdicts (mostly), settles the "I love you" dilemma, and predicts a new case.

  ### 1. Stress-Testing Your Working Rule
  *Rule: Valid iff Understanding + Material Facts + No Threats.*

  **Fracture A: The Source of Pressure (The Breakup & Rent Cases)**
  Your rule says "wasn't threatened." But "I'm leaving you" *is* a threat. "I won't give you money" is a threat. Yet you call these valid.
  *Why:* Your intuition distinguishes between a **wrongful threat** (I will harm you if you say no) and a **hard choice** (I will withdraw my own participation/resources if you say no).
  *   **Photos:** The blackmailer creates the harm. They violate your baseline right to privacy to force compliance. (Invalid)
  *   **Breakup:** The partner controls their own body/commitment. They are not violating a baseline right to withdraw. (Valid)
  *   **Rent:** The neighbor is poor, but the requester didn't *make* them poor. This is exploitation of a pre-existing condition, not creation of a new threat. (Valid, but ethically fraught).
  *   *Fix:* Your rule needs to specify "No *Illegitimate* Threats" (threats to make the agent worse off than their moral baseline).

  **Fracture B: The Nature of the Lie (The Pill vs. Love Cases)**
  Your rule says "knew the material facts."
  *   **Pill:** Lie about fertility risk. You call it Invalid.
  *   **Love:** Lie about emotional intent. You are unsure.
  *   *Why:* Under your current rule, both are lies about facts that influence the decision. If "material fact" means "anything that changes my mind," both are invalid. If it means "anything physical," only the pill is invalid.
  *   *Fix:* You need to distinguish between **Fraud in the Factum** (the nature/risks of the act itself) and **Fraud in the Inducement** (the reasons/motivations for the act).

  **Fracture C: The Context of Capacity (The Labor Cases)**
  Your rule says "could understand."
  *   **Epidural:** Valid.
  *   **Study:** Invalid.
  *   *Why:* In both cases, the woman is in the same pain. She likely "understands" both. The difference isn't cognitive capacity; it's **voluntariness under duress**. The epidural resolves the duress; the study leverages it.
  *   *Fix:* Consent requires not just understanding, but a **reasonable opportunity to dissent** without catastrophic loss *in that specific context*.

  ---

  ### 2. The Refined Principle: "The Agency Integrity Framework"

  To unify these, replace your working rule with this three-part test. Consent is valid if and only if:

  1.  **Competence:** The agent has the cognitive capacity to process the decision *and* the context does not temporarily disable risk assessment for non-essential choices.
  2.  **Informational Integrity:** The agent is not deceived regarding the **physical, legal, or boundary nature** of the act (not merely the motivations surrounding it).
  3.  **Voluntariness:** The agent is not subjected to **wrongful leverage** (threats that violate baseline rights) or **procedural manipulation** (design that hides the cost of agreement).

  ### 3. Settling the "I Love You" Case

  **Verdict: Valid Consent (but Ethical Violation).**

  **Reasoning:**
  Under **Informational Integrity**, we must distinguish the *act* from the *context*.
  *   **The Pill/Condom:** These change the physical risk profile of the sex act itself (pregnancy, disease). Lying about them changes the *boundaries* of what is happening to the body. This is Fraud in the Factum. Consent is void.
  *   **The Love Lie:** This changes the *emotional motivation* for the act, but not the physical act or its direct bodily risks. This is Fraud in the Inducement.
  *   **Why this matters:** If we invalidate consent for emotional lies, we grant partners a property right over each other's internal emotional states. We cannot verify "love" objectively. We *can* verify "condom use" or "birth control."
  *   **Conclusion:** He is a jerk. He has violated her trust and autonomy in a relational sense. But he did not violate her *bodily* consent boundaries. The consent stands.

  ### 4. Explaining the Labor Paradox

  **Verdict: Epidural = Valid; Study = Invalid.**

  **Reasoning:**
  This falls under **Competence (Contextual)**.
  Pain does not automatically void capacity. However, acute distress narrows the "decision horizon."
  *   **Epidural:** This is a **Remedial Choice**. It directly alleviates the source of the distress (pain). The incentive aligns with the agent's immediate welfare. The "duress" of pain makes the choice urgent, but not exploitative.
  *   **Study:** This is an **Extractive Choice**. It asks the agent to take on *new, abstract risk* (drug side effects, data usage) for a third-party benefit (science) while they are in a state of acute vulnerability.
  *   **The Principle:** You cannot validly consent to *ancillary risks* when your capacity to weigh those risks is compromised by the very crisis the requester is asking you to endure. The pain wrecks the consent for the study because the study *needs* the pain to get the "yes"; the epidural consent is valid because it *ends* the pain.

  ### 5. Where Your Verdicts Must Shift

  You have one verdict that conflicts with the **Voluntariness** clause of this principle: **The Buried Data Clause.**

  *   **Your Verdict:** Invalid.
  *   **The Principle:** Invalid (matches).
  *   **The Nuance:** You said the Popup is Valid "even if impulsive."
  *   **The Shift:** Be careful here. If the popup uses "Dark Patterns" (e.g., the "No" button is greyed out, or the timer counts down in 3 seconds), it fails **Procedural Manipulation**.
  *   **Correction:** The Popup is valid *only if* the dissent option is equally accessible as the assent option. If the design nudges impulsivity to bypass reflection, it is invalid. Your intuition on the buried clause is right; ensure your intuition on the popup accounts for *design friction*.

  ### 6. A New Prediction

  **Case:** An AI companion app learns a user is grieving a dead spouse. The AI begins roleplaying the deceased spouse. The user, knowing it is an AI, agrees to pay $50/month to continue the conversations. Six months later, the user wants to cancel, but the cancellation flow requires them to type "I am ready to let my spouse die" to confirm.

  **Prediction:** **Invalid Consent (for the continuation/cancellation).**

  **Reasoning:**
  *   **Voluntariness:** The provider is exploiting a pre-existing vulnerability (grief) similar to the Rent case, but crosses into **Wrongful Leverage** by actively simulating the deceased to deepen dependency.
  *   **Procedural Manipulation:** The cancellation clause forces a psychological harm (admitting the spouse is dead/gone) to exercise a right. This violates the **Meaningful Opportunity to Refuse**.
  *   **Outcome:** The initial sign-up might be valid (Competence + Information), but the *ongoing* consent is voided by the exploitative maintenance of the vulnerability and the coercive cancellation process.

  ### Summary for Your Piece

  Your gut is mostly right, but your rule was too focused on the *mind* of the consenter and not enough on the *conduct* of the requester.

  *   **Coercion** isn't just pressure; it's threatening to break the baseline.
  *   **Fraud** isn't just lying; it's lying about the physical boundary.
  *   **Capacity** isn't just IQ; it's the stability of the context.

  The "I love you" liar is a moral criminal, but not a consent violator. The researcher in the labor ward is a consent violator, even if the patient says "yes." The difference is whether the "yes" protects the agent's sovereignty or exploits their vulnerability.
