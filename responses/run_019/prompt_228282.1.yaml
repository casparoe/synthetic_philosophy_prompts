answer: |-
  **Verdict:** The 2016 demonetization episode shows that Searle's theory **needs to be combined with a more practice-centered account of money.**

  Searle's ontology of institutional facts correctly identifies *what* money is (a status function imposed on physical objects), but the demonetization crisis reveals that this status is insufficient to explain *how* money functions (or fails) in real time. The episode demonstrates that while a Status Function can be revoked by declaration (validating Searle), it cannot be sustained or instantiated without a material and logistical substrate (validating practice theory). Money is not just a status we agree upon; it is a status that must be continuously performed through circulation, trust, and physical availability.

  ### Mapping the Episode to Searle's Framework

  **1. Status Functions and Constitutive Rules ($X$ counts as $Y$ in $C$)**
  *   **$X$ (Brute Fact):** Rectangular pieces of cotton-paper blend with specific ink patterns.
  *   **$Y$ (Status Function):** "Legal Tender" / "Medium of Exchange."
  *   **$C$ (Context):** The Republic of India.
  *   **The Change:** On November 8, the government altered the constitutive rule. The old $X$ (500/1000 notes) no longer counted as $Y$ (Legal Tender). Physically, the paper was identical at 11:59 PM and 12:01 AM. Institutionally, it underwent an ontological transformation from "money" to "exchangeable asset" (and eventually, for those who missed deadlines, "waste").

  **2. Who Must Accept? (Hierarchical Collective Intentionality)**
  Searle speaks of "collective acceptance," which can imply a democratic consensus. Demonetization clarifies that this acceptance is **stratified**.
  *   **The State/Central Bank:** Holds the authority to *assign* the status function. Their declaration is the "Declaration" speech act that creates the institutional fact.
  *   **The Public (Shopkeepers, Banks, Borrowers):** Holds the power to *recognize* and *execute* the function.
  *   **The Verdict on Acceptance:** For money to exist as a *legal* fact, only the State's acceptance is required. For money to exist as an *economic* fact, the public's acceptance is required. In 2016, the State successfully revoked the status (old notes were legally dead), but the public's ability to accept the *new* status (new notes) was hampered by logistical failure. This shows that "collective acceptance" is not a monolith; it is a chain where the weak link (logistics/trust) can break the function even if the status remains valid.

  **3. What Changed at Midnight? (Deontic Powers)**
  It is imprecise to say the notes' "value" or "identity" changed in a physical sense. What changed were the **deontic powers**—the rights, duties, and obligations attached to the object.
  *   **Before:** Holding the note gave you the *right* to discharge debt and the *power* to command goods.
  *   **After:** Holding the note gave you the *obligation* to deposit it and the *right* to claim a limited exchange, but removed the *power* to command goods directly.
  *   **Searlean Insight:** This vindicates Searle's claim that institutional reality is made of deontic powers, not physical properties. The paper didn't change; the network of obligations did.

  ### The Complication: Declaration vs. Background

  The government could declare the old notes dead instantly, but could not declare the new system smooth. This highlights the distinction between **institutional validity** and **functional viability**.

  Searle acknowledges the "Background"—the non-representational mental and physical capacities that enable institutional facts to work. Demonetization exposes that the Background for money is not just psychological (trust) but **material and logistical** (ATM calibration, note supply, queue management).
  *   **Searle's Limit:** He focuses on how the status is *assigned*.
  *   **Practice Theory's Contribution:** It focuses on how the status is *enacted*.
  The chaos proved that you can have the Status Function (the new notes were legally money) without the Practice (no notes in ATMs, no ability to spend). Therefore, Searle's account explains the *existence* of the institution, but a practice-centered account is required to explain its *operation*.

  ### The Single Threatening Feature

  The feature that most threatens my reading (that Searle needs practice theory) is the **instantaneous invalidation of the old notes.**

  If money truly required a robust web of practices to exist, the old notes should have persisted as money for some time after the announcement, decaying only as people gradually stopped accepting them. Instead, a mere speech act by the Prime Minister instantly stripped the notes of their primary function across a billion people. This looks like a pure vindication of Searle: the Status Function is *all* that matters; the moment the collective intentionality (led by the State) shifts, the reality changes, regardless of practice.

  **Why this does not defeat the verdict:**
  This instantaneous destruction applies only to the *negative* case (revoking status). It confirms that the State can break the institution from the top down. However, the *positive* case (creating a functioning monetary environment with new notes) failed despite the valid status assignment. The State could declare the old notes worthless, but it could not declare the new notes *liquid*. This asymmetry proves that while Status Functions are sufficient to *destroy* institutional facts, they are insufficient to *sustain* them without the supporting practices of circulation and confidence. Thus, Searle explains the switch, but practice theory explains the circuit.
