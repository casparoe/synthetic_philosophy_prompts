prompt: |-
  During my office's annual giving campaign last month, a coworker invoked Singer's drowning-child thought experiment to argue that the rest of us were approaching charity all wrong. His pitch ran roughly as follows. If you walked past a shallow pond where a child was drowning, and you could save her at the cost of ruining a five-hundred-dollar pair of shoes, refusing would be monstrous. But effective charities can save a child's life for a comparable sum. So declining to donate, while continuing to spend on concert tickets and restaurant meals, is morally indistinguishable from standing at the pond's edge scrolling on your phone. Distance, invisibility, and the fact that plenty of other well-paid people could also give are, he insisted, morally irrelevant. He concluded that people at our income level are obligated to give vastly more than we do — perhaps until further giving would cost us as much as the rescue would — and he said the pond case settles it. I felt the pull of the argument, but I also suspect it is doing more work than it legitimately can.

  Could you audit the analogy for me? Start by laying out the correspondence explicitly — what plays the role of the pond, the drowning child, the wading, and the ruined shoes in his version — and then identify where the mapping strains. The candidate disanalogies I keep circling are these. In the pond case, rescue is direct and nearly certain, whereas donations are mediated by institutions I cannot observe and save lives only probabilistically; I am the sole bystander at the pond, whereas there are millions of non-donors, and I genuinely do not know whether their failure raises, lowers, or leaves unchanged my own obligation, or whether my donation simply crowds in or crowds out government funding; the pond is a one-time emergency with an identifiable victim, whereas global poverty is chronic and the beneficiaries are statistical; and the cost at the pond is bounded — one pair of shoes, and the episode is over — whereas the charities can absorb effectively unlimited funds, so the analogy seems to convert "save this one child" into "keep wading back in forever." Which of these disanalogies actually bear on my coworker's conclusion, and which are distractions from it?

  If the demanding conclusion survives the audit only in a weakened form, I would like to know what the strongest surviving version looks like — and whether there is a better analogy for that weaker claim than the pond, since at the moment my coworker's rhetoric seems to be carried almost entirely by the image of the drowning child, and I want to know how much weight that image can actually bear.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's coworker used Peter Singer's "drowning child" thought experiment to argue for extreme effective altruism (donating until marginal utility equals marginal cost).
      *   **Task:** Audit the analogy.
          *   Explicitly lay out the correspondence (Pond $\rightarrow$ ?, Child $\rightarrow$ ?, Wading $\rightarrow$ ?, Shoes $\rightarrow$ ?).
          *   Identify where the mapping strains (evaluate the user's specific candidate disanalogies).
          *   Determine which disanalogies bear on the conclusion vs. which are distractions.
          *   Formulate the strongest surviving version of the argument if the original conclusion is weakened.
          *   Suggest a better analogy for the weaker claim if the pond analogy is overloaded.
      *   **Tone:** Philosophical, analytical, nuanced, respectful of the user's intuition that the argument is doing "more work than it legitimately can."

  2.  **Deconstruct the Singer Analogy (The Correspondence):**
      *   *The Pond:* The state of global poverty/extreme suffering.
      *   *The Drowning Child:* A specific potential beneficiary (or statistical life) at risk of death/severe harm.
      *   *Wading In:* The act of donating money/effort.
      *   *Ruined Shoes:* The financial cost to the donor (luxury spending, leisure, etc.).
      *   *The Bystander:* The potential donor (the user/coworker).
      *   *The Moral Principle:* If you can prevent something bad without sacrificing anything of comparable moral importance, you ought to do it.

  3.  **Evaluate the Candidate Disanalogies (The Audit):**
      *   *User's Point 1: Direct/Certain vs. Mediated/Probabilistic.*
          *   *Analysis:* In the pond, I *know* the child dies if I don't act. In charity, my \$500 *might* save a life, or it might be wasted, or it might have marginal impact.
          *   *Verdict:* Significant. This attacks the *efficacy* premise. However, Effective Altruism (EA) tries to mitigate this by finding high-certainty charities. It weakens the "certainty" but doesn't destroy the obligation if the probability is high enough.
      *   *User's Point 2: Sole Bystander vs. Millions of Non-Donors (Collective Action/Free Rider).*
          *   *Analysis:* At the pond, if I don't act, no one will. In the world, if I don't act, someone else might (or might not). This introduces the "fair share" problem.
          *   *Verdict:* Very Significant. This is the "overdemandingness" objection. If everyone did their fair share, I wouldn't need to ruin my shoes. Since they don't, do I have to do *their* share too? Singer says yes; many intuitions say no.
      *   *User's Point 3: One-time/Identifiable vs. Chronic/Statistical.*
          *   *Analysis:* The pond is a discrete event. Poverty is a structural, ongoing system. Saving one child doesn't drain the pond; there's always another child.
          *   *Verdict:* Significant. This leads to the "bottomless pit" problem. The obligation doesn't end after one act.
      *   *User's Point 4: Bounded Cost vs. Unlimited Absorption.*
          *   *Analysis:* Shoes are \$500. Global need is infinite relative to resources.
          *   *Verdict:* Significant. This transforms the obligation from a *duty to rescue* into a *duty to maximize*.

  4.  **Determine Which Disanalogies Bear on the Conclusion:**
      *   *Distractions:* The "identifiable victim" effect is psychological, not necessarily moral. Whether the child is named or statistical shouldn't change the *math* of the suffering, though it changes our *feeling*.
      *   *Bearers:* The *Collective Action* problem (Point 2) and the *Unlimited Demand* problem (Point 4) are the heavy hitters. They challenge the *scope* of the obligation. The *Efficacy* problem (Point 1) challenges the *feasibility*.

  5.  **Formulate the Strongest Surviving Version:**
      *   The "Maximalist" conclusion (give until it hurts as much as dying) is hard to sustain because of the unlimited demand/collective action issues.
      *   The "Moderate" conclusion: We have a significant obligation to assist, proportional to our capacity and the efficacy of the aid, but we are not necessarily required to sacrifice *everything* of comparable moral weight if others are failing to do their part.
      *   *Key Shift:* From "Save the child at all costs" to "Do your fair share of the rescue effort."

  6.  **Find a Better Analogy:**
      *   The Pond implies emergency, singularity, and direct causation.
      *   We need an analogy that implies *ongoing contribution to a collective effort*.
      *   *Idea 1:* A lifeboat. (Too close to pond).
      *   *Idea 2:* A fire brigade. (Better, implies roles).
      *   *Idea 3:* A bucket brigade / Passing water down a line. (Good, shows mediation).
      *   *Idea 4:* *The Leaky Roof / Community Fund.*
      *   *Selection:* **The Bucket Brigade** or **The Collapsing Bridge**. Let's go with a **"Community Well"** or **"Levee System"**.
      *   *Refinement:* The **"Bucket Brigade"** is classic for mediation. But for the *fair share* aspect, maybe **"The Lifeboat with Oars"**.
      *   *Best Fit:* **The "Leaky Boat" or "Bailing Water"**. Everyone needs to bail. If others stop, do you bail until you drown?
      *   *Actually, a stronger one for "fair share" vs "maximal":* **The Voting Analogy** (causal impotence) or **The Tax Analogy** (obligation to system).
      *   *Let's try:* **The "Collaborative Rescue"** (e.g., lifting a car). If 10 people are needed to lift a car off a victim, and 9 walk away, are you obligated to crush yourself trying to lift it alone? No, you are obligated to do your part and advocate for others.
      *   *Wait, the user wants an analogy for the *weaker* claim.* The weaker claim is: "You must give significantly, but not everything."
      *   *Analogy:* **The Fire Tax / Neighborhood Watch.** You pay for protection, but you aren't the fire chief.
      *   *Let's go with:* **The "Relay Race" or "Bucket Brigade"**. It captures the mediation and the shared burden.
      *   *Actually, the "Leaky Boat" is best for the "unlimited" aspect.* If the boat is leaking faster than you can bail, do you bail until exhaustion?
      *   *Decision:* I will propose the **"Bucket Brigade"** for mediation/efficacy and the **"Shared Burden/Car Lift"** for the collective action problem.

  7.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the power of Singer's argument and the user's valid skepticism.
      *   **Section 1: The Mapping.** Clearly define the terms (Pond = Global Poverty, Child = Beneficiary, etc.).
      *   **Section 2: The Audit (Disanalogies).**
          *   *Efficacy (Certainty):* Real but mitigated by EA.
          *   *Sole Bystander (Collective Action):* Crucial. Changes "rescue" to "fair share."
          *   *One-time vs. Chronic (Unlimited Demand):* Crucial. Changes "duty to rescue" to "duty of beneficence."
          *   *Identifiable vs. Statistical:* Psychological, less morally weighty.
      *   **Section 3: Bearing on Conclusion.** Distinguish between distractions (identifiable victim) and structural flaws (collective action, unlimited demand).
      *   **Section 4: The Surviving Version.** Shift from "Maximal Sacrifice" to "Significant Fair Share."
      *   **Section 5: A Better Analogy.** Propose the **"Bucket Brigade"** or **"Collaborative Car Lift"**. Let's use the **"Collaborative Car Lift"** because it highlights the "what if others quit?" dilemma perfectly.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between Singer's *Strong Principle* (prevent bad without comparable sacrifice) and *Weak Principle* (prevent bad without significant sacrifice). The coworker is using the Strong Principle.
      *   *Nuance:* Acknowledge that Singer *anticipates* these objections. He argues distance and numbers don't matter. The counter-argument is about *fairness* and *institutional efficacy*.
      *   *Tone Check:* Ensure I'm not dismissing EA, but critically examining the *analogy's* reach.

  9.  **Final Polish:** Check against the user's specific questions.
      *   Lay out correspondence? Yes.
      *   Identify where mapping strains? Yes.
      *   Which disanalogies bear on conclusion? Yes.
      *   Strongest surviving version? Yes.
      *   Better analogy? Yes.

