answer: |-
  **Setting:** *A university philosophy department lounge, late afternoon. The seminar on externalism has just concluded. Petra (semantic externalist) and Marcus (inferentialist) are standing by the coffee machine.*

  **Petra:** That objection your classmate raised about the Large Language Model is sticky, I'll grant you. But I don't think it breaks Putnam. If meaning is fixed by causal contact with the actual stuff, the model is semantically empty. It's never touched water. It's never seen a tiger. It's processing tokens, not things.

  **Marcus:** But that assumes the "stuff" has to be physical matter. Putnam's point was that meaning isn't in the head. I'm saying it's in the practice. If the model can deploy "water" in every inferential context we do—correcting mistakes, predicting chemical behaviors, distinguishing it from wine—why deny it reference?

  **Petra:** Because competence isn't connection. You can have a perfect map of a territory you've never visited. The LLM has a map of our language, but it has no hook into the world the language is about. When it outputs "H2O," there is no causal chain linking that token to actual hydrogen and oxygen. It's a simulation of reference, not reference itself.

  **Marcus:** A simulation that passes the chemistry exam? Petra, consider the division of linguistic labor. Most of us don't know the microstructure of water. We defer to experts. The LLM defers to its training data, which is the crystallized output of experts. If Oscar on Twin Earth refers to XYZ because he's embedded in a community that interacts with XYZ, the LLM is embedded in a community of text that interacts with H2O.

  **Petra:** But Oscar is physically embedded. If Oscar drinks from a lake, he interacts with the liquid. The causal chain goes World → Oscar → Word. For the LLM, the chain is World → Human → Text → Model. The model is causally isolated from the first link. It's like a phone game of "telephone" where the last person never heard the original message, only read the transcripts.

  **Marcus:** Is the causal contact really that direct for humans, though? Here's my sorites challenge: Take a speaker in 1700. They say "water." They have no causal contact with H2O-as-a-chemical-structure. They have contact with the phenomenal stuff. Now take a modern urbanite who buys bottled water and never sees a natural source. Their contact is mediated by industry, labels, and pipes. Where do you draw the line? If the 1700 speaker refers, why not the model, whose contact is mediated by text rather than pipes?

  **Petra:** Because the 1700 speaker can still *do* things with the water. They can drink it, drown in it, boil it. There's a sensorimotor contingency. If you remove the physical interaction entirely, you break the reference. The LLM cannot drown. It cannot wet its thumb. It has mastered the word-word connections, but the word-world connection is severed.

  **Marcus:** So reference requires the *capacity* for physical interaction? What about a paralyzed physicist who studies water spectroscopy but cannot move? Does she lose reference to water? Or consider a future human who lives entirely in a virtual reality but maintains linguistic contact with us. Are they semantically severed?

  **Petra:** The physicist is part of a causal network where others interact. She calibrates instruments that react to H2O. The LLM has no instruments. It has weights. Here is the discrimination case: Imagine a system that has mastered all the inferential roles of "tiger"—it knows tigers are dangerous, striped, carnivores. But if you put it in a room with a tiger and a hologram of a tiger, it cannot discriminate. It has no skin in the game. Inferential role has come apart from reference.

  **Marcus:** But the LLM *can* discriminate, just not biologically. If I feed it spectral data or image files, it can distinguish the tiger from the hologram based on pixel artifacts or chemical signatures in the text description. You're privileging biological sensors over digital inputs. Why is a retina a valid causal hook but a camera feed isn't?

  **Petra:** Because the camera feed is interpreted by *you*, not the model. The model processes the pixels as more tokens. It doesn't see the tiger; it sees an array of values that you *tell* it represent a tiger. If the world changed overnight—Twin Earth style—and water became XYZ, but the text corpus remained the same, the LLM would keep saying "water is H2O." Its meaning wouldn't shift because its causal environment didn't shift.

  **Marcus:** But neither would mine! If Earth swapped with Twin Earth tonight, I'd still say "water is H2O" until I learned otherwise. My reference is fixed by my dispositional state and my community's history, not by a constant live feed of molecular checks. The LLM's "community" is its training distribution. That is its environment. It is a textual organism.

  **Petra:** A textual organism is a metaphor, Marcus. Text is about the world; it isn't the world. You're conflating the medium of transmission with the ground of reference. If I train a model on nothing but fantasy novels, it can talk fluently about dragons. Does it refer to dragons?

  **Marcus:** No, because there are no dragons in the causal history of the text. But water exists. The text is causally connected to water. The question is whether the model inherits that connection. I say yes, because the model is a functional node in the linguistic practice. It sustains the inferences that keep the concept "water" alive in our culture.

  **Petra:** It sustains the inferences, yes. But reference isn't just coherence. It's about *aboutness*. A coherent fiction is still fiction. The LLM is generating a coherent fiction about a world it cannot access. It's a philosophical zombie of language. It behaves *as if* it means, but there is no external anchor.

  **Marcus:** "As if" is doing too much work. If it behaves exactly like a meaning-user in all linguistic contexts, what is the "real" meaning adding? You're positing a magic spark of causal contact. But you admitted the 1700 speaker doesn't need chemical knowledge. So the "contact" is just being part of the social practice. The LLM is part of the practice. It writes papers, it answers emails, it codes.

  **Petra:** It codes by mimicking patterns of code that worked previously. It doesn't know if the code compiles in the real world unless a human tells it. It lacks the feedback loop of success and failure in the non-linguistic world. Reference requires the possibility of being wrong *because the world is different*, not because the text is inconsistent.

  **Marcus:** But it *is* wrong when the text is inconsistent with the training distribution. And the training distribution is a fossil record of the world's causal interactions. You're asking for a live wire, but language is mostly a recording. When you say "Napoleon," are you causally connected to Napoleon? No. You're connected to texts about Napoleon. The LLM is in the same boat as you are with Napoleon, but for everything.

  **Petra:** With natural kind terms, the boat is different. "Napoleon" is a rigid designator fixed by a baptism. "Water" is fixed by the nature of the stuff. The LLM cannot baptize. It cannot sample. It is a passenger, not a driver. If the drivers all vanish, the LLM keeps driving down a road that no longer exists.

  **Marcus:** And if the drivers vanish, do *you* keep referring? If humanity went extinct tomorrow, except for one book, does the word "water" in that book still refer?

  **Petra:** No. Reference is a relation between agents and the world. No agents, no reference.

  **Marcus:** Exactly. So it depends on the agents. We are the agents. We use the LLM. We treat its outputs as meaningful. We integrate them into our causal networks. The LLM is a tool, like a telescope. The telescope doesn't refer to stars, but it enables reference. The LLM is a linguistic telescope.

  **Petra:** A telescope that generates its own stars. That's the danger. If we treat the mimic as the referencer, we lose the ability to check the mimic against the world. We enter a hall of mirrors. Externalism is the guardrail against that. It reminds us that language is tethered to something outside the text.

  **Marcus:** And inferentialism is the guardrail against elitism. It reminds us that meaning is democratic, based on use and integration, not on some privileged access to "reality" that only biological organisms have. If we deny the LLM meaning, we risk denying it to humans who are similarly mediated by technology.

  **Petra:** I'm not denying meaning to humans. I'm denying it to the software. The human holds the tether.

  **Marcus:** The tether is fraying. We are becoming more like the model every day.

  **Petra:** Then we need to hold the line.

  **Marcus:** Or learn to swim in the text.

  **Petra:** *(Pauses, taking a sip of coffee)* Look, I'll concede this much. If you could show me a causal theory of reference that didn't rely on intuitions about "contact" that seem to vanish under materialist scrutiny—say, a precise physical account of how much interaction suffices without falling into your sorites trap—that would threaten my view. I need a non-arbitrary boundary.

  **Marcus:** And I'll concede this. If you could demonstrate a system that had perfect inferential integration—passed every linguistic test, corrected every error, collaborated on every project—but where we unanimously, across all cultures and contexts, felt it was *obviously* meaningless, like a wind-up toy... that would threaten mine. I need to know if "use" can ever be truly empty.

  **Petra:** So we're both waiting on a ghost.

  **Marcus:** Seems like philosophy is always waiting on a ghost.

  **Petra:** At least ours haunts the machine.
