answer: |-
  This is one of the deepest and most contentious rabbit holes in decision theory. You have correctly identified that there is a tension between standard game theory and a more intuitive, "logical" approach.

  Here is the breakdown of the name, the logic, the conditions required for it to hold, and where the line between rationality and magic lies.

  ### 1. The Name
  The specific line of reasoning you are describing is most famously called **Superrationality**.

  The term was coined by Douglas Hofstadter (author of *Gödel, Escher, Bach*) in a 1983 *Scientific American* column. He argued that in a one-shot Prisoner's Dilemma between two rational agents who know they are both rational, the rational move is to cooperate.

  In modern academic decision theory, this debate is framed as **Causal Decision Theory (CDT)** vs. **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)**.
  *   **CDT (Standard Game Theory):** Says Defect. My choice cannot *causally influence* a distant stranger's choice.
  *   **EDT/FDT (Superrationality):** Says Cooperate. My choice is *evidence* of what the other will do, or our decision *functions* are logically linked.

  ### 2. Why it feels like "Magical Thinking"
  The reason this feels like magic is that it violates **Causal Independence**.

  In the physical world, pressing a button here does not send a signal to a stranger across the world. If you believe your physical action *causes* their physical action, you are engaging in magical thinking (sympathetic magic).

  However, Superrationality argues that the link isn't **causal**; it is **logical**.
  *   **The Argument:** You and the stranger are both reasoning engines. You are both presented with the same inputs (the payoff matrix) and the same goal (maximize utility). If you are both truly rational, you are effectively running the same "algorithm."
  *   **The Conclusion:** Therefore, you cannot output "Cooperate" while the other algorithm outputs "Defect." If you find a reason to Cooperate, they must find the same reason. If you find a reason to Defect, they must find the same reason.
  *   **The Choice:** You aren't choosing between "I Cooperate/They Defect" and "I Cooperate/They Cooperate." You are choosing between "We Both Defect" ($1 each) and "We Both Cooperate" ($10 each). Obviously, you choose the latter.

  ### 3. When is it Legitimate vs. Magical?
  This is the crux of your question. For Superrationality to be a legitimate inference rather than a delusion, specific conditions must be met regarding the **correlation** between the players.

  #### Case A: The Legitimate Inference (The "Clone" Scenario)
  Imagine you are playing against a perfect clone of yourself, or an AI running the exact same source code.
  *   **Condition:** **Identity of Reasoning.**
  *   **Verdict:** Cooperating is logically sound. Since the code is identical, the output must be identical. To defect is to guarantee the other defects. You are literally choosing the outcome for both.
  *   **Why it works:** There is a logical necessity linking the decisions.

  #### Case B: The "Magical" Inference (The Random Stranger)
  You are playing against a random person on the street whom you know nothing about.
  *   **Condition:** **Heterogeneity of Reasoning.**
  *   **Verdict:** Defecting is the safer bet. Humans are not identical algorithms. Some are altruistic, some are spiteful, some are confused. Your reasoning does not constrain theirs.
  *   **Why it fails:** Assuming the other person is running your specific "Superrational" algorithm is an unjustified assumption. You are projecting your own mind onto theirs without evidence.

  #### Case C: The Middle Ground (Common Knowledge)
  This is where it gets interesting. You are playing against a stranger, *but* you both know that you are both game theorists who have read Hofstadter.
  *   **Condition:** **Common Knowledge of Rationality.**
  *   **Verdict:** This is the battleground. If I know you are superrational, and you know I am superrational, and we know that we know... then the logical link is re-established.
  *   **The Line:** The move is legitimate **only to the degree that you have evidence the other player is using the same decision framework as you.**

  ### 4. How to Draw the Line
  To determine if the move is legitimate in a specific instance, ask these three questions:

  1.  **Is the similarity structural or superficial?**
      *   *Legitimate:* We are both AIs with the same code; or we are both members of a specific group known for this reasoning (e.g., two Kantian philosophers).
      *   *Magical:* We are both "human." (Too broad; humans vary wildly).

  2.  **Is the similarity Common Knowledge?**
      *   It is not enough that we are similar. I must *know* that you are similar, and you must *know* that I know. If I think you are a standard defector, I must defect to protect myself, even if I am a superrationalist. If I suspect you don't know I'm a superrationalist, the chain breaks.

  3.  **Am I confusing correlation with causation?**
      *   *Legitimate (EDT/FDT):* "My decision is *evidence* of theirs. If I cooperate, it increases the probability they cooperated."
      *   *Magical:* "My decision *makes* them cooperate." (This is never true in a one-shot game).

  ### 5. Difference from "Unpromised Reciprocity"
  You asked how this differs from assuming reciprocity that was never promised. This is a vital distinction.

  *   **Reciprocity (Tit-for-Tat):** This is causal. "I will be nice to you *so that* you will be nice to me." This requires iteration (future rounds) to work. In a one-shot game, promising reciprocity is a lie because there is no future punishment for lying.
  *   **Superrationality (Logical Correlation):** This is not about influence. It is about **prediction**. It says: "I am not trying to *make* them cooperate. I am trying to *predict* what they will do. Since they are like me, the best predictor of their action is my own action."

  ### Summary: The Verdict
  The move is called **Superrationality**.

  It is **legitimate** if:
  1.  There is a high probability the other player is running a sufficiently similar decision algorithm to yours.
  2.  There is Common Knowledge of this similarity.
  3.  You view the decision as selecting a logical output for a type of agent, rather than a causal action by an individual.

  It is **magical thinking** if:
  1.  You assume similarity without evidence (e.g., "all humans think like me").
  2.  You believe your physical button press causally influences theirs.
  3.  You ignore the possibility that the other player is using Causal Decision Theory (standard game theory), in which case your cooperation guarantees you get $0 while they get $15.

  **Practical Advice:** In the real world, unless you are playing against a clone, a specific AI, or a close colleague you know thinks exactly like you, the "Superrational" assumption is usually too fragile. The standard Nash Equilibrium (Defect) remains the robust solution because it does not rely on assumptions about the other player's internal reasoning process. However, recognizing Superrationality explains why cooperation *feels* right—it acknowledges that in a world of similar minds, our decisions are rarely truly independent.
