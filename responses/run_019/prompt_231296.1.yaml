  3.  **Address Question 1: The Name:**
      *   *Superrationality:* This is the most accessible term, popularized by Hofstadter in *Scientific American* (1983).
      *   *Newcomb's Problem / Logical Correlation:* This connects it to broader decision theory debates.
      *   *Kantian Categorical Imperative:* Philosophical parallel ("act only according to that maxim..."), though usually moral rather than strategic.
