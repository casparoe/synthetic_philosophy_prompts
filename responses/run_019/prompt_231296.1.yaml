  5.  **Address Question 4: Difference from Unpromised Reciprocity:**
      *   Reciprocity implies a causal mechanism (I do X, so you feel obliged to do X). In one-shot, this is impossible.
      *   Superrationality implies a *logical* mechanism (We are running the same algorithm). It's not "I hope you copy me," it's "We are the same system, so we will output the same result."
