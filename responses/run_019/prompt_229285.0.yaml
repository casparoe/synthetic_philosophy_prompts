prompt: |-
  I edit the science desk of a mid-sized general-interest magazine, and roughly once a week someone pitches us an evolutionary-psychology story: why we evolved to love gossip, why women are supposedly better at remembering where the fruit is, why teenagers take risks, that sort of thing. Some of it is serious science and some of it is a pub anecdote wearing a lab coat, and at the pitch meeting I have about ten minutes per pitch and no statistics training to lean on.

  What I'd like is a decision procedure I can actually run at the meeting, grounded in whatever the philosophy of biology and the just-so-stories debate have produced that is genuinely usable by a non-specialist. By that I mean things like: the distinction between a trait being an adaptation, a byproduct of some other adaptation (what Gould and Lewontin called a spandrel), or just drift; whether the proposed explanation makes any specific risky prediction or just redescribes the observation in the language of the Pleistocene; what the comparative and cross-cultural evidence would have to look like; and what would count as evidence against the claim, given that 'it helped our ancestors on the savanna' seems to fit absolutely anything.

  Concretely, give me:

  1. The questions to ask, in order, with what counts as a passing answer to each and which answers should kill the pitch on the spot.
  2. A way to handle the very common case where the underlying finding is real and replicated but the evolutionary gloss is doing all the work -- is that a green light, a kill, or a 'run the finding, cut the gloss'?
  3. The points where the procedure has to hand the call back to me because it's a judgement about what our readers need, not a question the method can settle.

  Then run the procedure on three invented pitches so I can see it working:

  a) A researcher claims that women's interest in true-crime content is an evolved predator- and threat-monitoring adaptation, on the basis of a survey of podcast listeners.
  b) A well-powered cross-cultural study (thirty-odd countries, decent methods) finds a stable sex difference in occupational preferences, and the pitch says this shows the difference is evolved and therefore fixed.
  c) A journalist wants to argue that open-plan offices fail because our hunter-gatherer brains can't cope with them.

  Please include at least one verdict I won't enjoy (I've got a soft spot for a good evolutionary yarn, and the procedure shouldn't care). And be honest at the end about what a checklist like this can't catch -- where a plausible-sounding story gets through anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Editor of a science desk at a mid-sized general-interest magazine.
      *   **Problem:** Flooded with evolutionary psychology (evo psych) pitches. Some are solid, many are "just-so stories." Needs a quick decision procedure (10 mins/pitch) without stats training.
      *   **Requirements:**
          1.  A step-by-step question list (pass/fail criteria).
          2.  Guidance on separating robust findings from speculative evolutionary gloss.
          3.  Identification of editorial judgment calls (where the procedure stops).
          4.  Application to three specific invented pitches (a, b, c).
          5.  At least one unpopular verdict (kill a fun story).
          6.  Honest limitation section (what the checklist misses).
      *   **Tone:** Professional, practical, grounded in philosophy of biology (Gould/Lewontin, etc.), skeptical but not dismissive.

  2.  **Deconstruct the Science/Philosophy:**
      *   *Core Issue:* Adaptationism vs. Spandrels/Drift.
      *   *Key Critique:* Just-so stories (Kipling/Gould & Lewontin). Retrospective fitting without prospective prediction.
      *   *Key Criteria for Good Evo Psych:*
          *   Specificity of the adaptation (not just "survival").
          *   Comparative evidence (do other primates do it?).
          *   Cross-cultural universality (is it WEIRD or human?).
          *   Falsifiability (what would disprove it?).
          *   Mechanism (how does the brain actually do it?).
          *   Alternative hypotheses (is it cultural? is it a byproduct?).

  3.  **Drafting the Decision Procedure (The "Filter"):**
      *   Need it to be fast (10 mins).
      *   Need clear "Kill" conditions.
      *   *Step 1: The Phenomenon.* Is the thing real? (Replication).
      *   *Step 2: The Adaptation Claim.* Is it framed as an adaptation? If so, what is the specific selection pressure?
      *   *Step 3: The "Just-So" Test.* Can it be reversed? (If men liked true crime, would the story change?)
      *   *Step 4: Alternatives.* Did they rule out culture/byproducts?
      *   *Step 5: Falsifiability.* What proves them wrong?

  4.  **Handling the "Real Finding, Fake Gloss" Scenario:**
      *   This is common. Psychology finding is solid, evo explanation is tacked on for sexiness.
      *   *Verdict:* Run the finding, cut the gloss. Or run the gloss as *speculation* clearly labeled.
      *   *Best advice:* Separate the *what* (empirical) from the *why* (evolutionary).

  5.  **Identifying Editorial Judgment Calls:**
      *   The procedure can't decide "Is this interesting?" or "Is this harmful?"
      *   Ethical implications (determinism).
      *   Novelty vs. Redundancy.

  6.  **Running the Procedure on the Three Pitches:**

      *   *Pitch A (Women & True Crime):*
          *   *Phenomenon:* Real (women do listen more).
          *   *Adaptation:* Predator monitoring.
          *   *Test:* Why podcasts? Ancestors didn't have podcasts. Why not men? Men were hunters/defenders.
          *   *Alternative:* Social bonding, safety education in modern context.
          *   *Verdict:* Kill the evo angle. Run the sociology/psych angle. (This might be the "unpopular" verdict if the editor loves it, but scientifically it's weak).
          *   *Refinement:* Let's make the verdict "Kill the evo pitch, pivot to social." Actually, the prompt asks for a verdict on the *pitch*. If the pitch is "Evo explanation for true crime," the verdict should be "Kill."

      *   *Pitch B (Sex Differences in Jobs):*
          *   *Phenomenon:* Real (often found).
          *   *Claim:* Evolved AND fixed.
          *   *Test:* "Fixed" is the killer. Plasticity exists. Cross-cultural variance usually exists (Scandinavia paradox).
          *   *Verdict:* Kill. The "therefore fixed" is a naturalistic fallacy and scientifically unsound.

      *   *Pitch C (Open-Plan Offices):*
          *   *Phenomenon:* Real (people hate them).
          *   *Claim:* Hunter-gatherer brains.
          *   *Test:* Ancestors didn't sit in silence. They were in bands. Noise was constant.
          *   *Alternative:* Lack of control, distraction, acoustic privacy.
          *   *Verdict:* Kill the "savanna" angle. Run the "environmental psychology" angle.

      *   *Wait, I need one verdict the editor won't enjoy.*
          *   Editor has a "soft spot for a good evolutionary yarn."
          *   Pitch A (True Crime) is a very popular yarn. Killing the evo angle on that is likely the painful one.
          *   Pitch C is also a fun yarn ("caveman brain").
          *   Let's make sure I explicitly kill the evo angle on A or C. Let's go with A as the "painful" one because it's very trendy. Or C. Actually, C is often used to justify expensive office redesigns. Let's make C the "Kill" because it's physically implausible (ancestors weren't in libraries).
          *   *Decision:* I will recommend killing the *evolutionary* angle on A (True Crime) because it's a classic just-so story, even though it's a great hook.

  7.  **Drafting the Limitations:**
      *   Checklist can't detect bad stats (p-hacking).
      *   Can't detect ideological bias.
      *   Can't predict future replication crises.
      *   Plausible stories can still be wrong (Inference to the Best Explanation isn't proof).

  8.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the difficulty.
      *   Section 1: The 5-Step Filter (Questions + Pass/Fail).
      *   Section 2: The "Finding vs. Gloss" Protocol.
      *   Section 3: The Editorial Handoff (Judgment calls).
      *   Section 4: The Three Pitches (Applied).
      *   Section 5: Limitations (The "Leakiness" of the Filter).

  9.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I include Gould/Lewontin concepts? Yes (Spandrels, Just-So).
      *   *Check:* Is it usable in 10 mins? Keep questions sharp.
      *   *Check:* Did I address the "fixed" nature in Pitch B? Yes, that's a naturalistic fallacy trap.
      *   *Check:* Is the tone right? Not anti-science, but anti-bad-science.
      *   *Refinement on Pitch A:* The "predator monitoring" hypothesis is actually a known evo psych claim (Campbell). It's controversial. The pitch relies on *podcasts*. The mismatch is key. Ancestors didn't consume manufactured narratives of crime.
      *   *Refinement on Pitch B:* The "fixed" claim is the dealbreaker. Evo psych rarely implies *immutability* in modern contexts due to plasticity.
      *   *Refinement on Pitch C:* "Hunter-gatherer brains" is a catch-all. The specific mechanism (noise? visibility?) needs to match ancestral environments. Ancestral environments were *noisy*. So silence/focus isn't the ancestral state.

  10. **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Handling real finding/fake gloss? Yes.
      *   Judgment calls identified? Yes.
      *   Three pitches run? Yes.
      *   Unpopular verdict included? Yes (killing the True Crime evo story).
      *   Limitations section? Yes.

  11. **Final Polish:** Ensure the distinction between "Kill the pitch" and "Kill the angle" is clear. Sometimes the story is worth telling, just not the way they want to tell it.

  *(Self-Correction during final output generation)*: Make sure the "Kill" criteria are distinct from "Pass" criteria. Use bolding for readability. Ensure the "Unpopular Verdict" is highlighted.

  Let's write it.cw
answer: |-
  This is a standard problem in science journalism. Evolutionary psychology (EP) sits at the intersection of hard data (psychology/anthropology) and high speculation (reconstructing ancestral environments). The "Just-So Story" critique (Gould & Lewontin, 1979) remains the central philosophical hurdle: it is easy to invent a survival benefit for any existing trait, but hard to prove that benefit was the *cause* of the trait's selection.

  Here is a 10-minute decision procedure designed for an editor without statistical training. It relies on **inference to the best explanation** and **falsifiability** rather than p-values.

  ### Part 1: The 5-Step "Savanna Filter"

  Ask these questions in order. If a pitch fails a step, stop there.

  **1. The Phenomenon Check: Is the thing real?**
  *   **Ask:** "Is the behavioral pattern (e.g., women listen to more true crime) replicated in multiple, independent studies? Is it a robust finding or a single paper?"
  *   **Pass:** Meta-analysis or multiple high-power replications confirm the behavior exists.
  *   **Kill:** The behavior itself is based on one underpowered study, a self-reported survey without controls, or WEIRD (Western, Educated, Industrialized, Rich, Democratic) data assumed to be universal.
  *   *Why:* You cannot explain the evolution of a ghost.

  **2. The Adaptation vs. Byproduct Test:**
  *   **Ask:** "Why must this be an *adaptation* rather than a byproduct (spandrel) or cultural drift? Did the authors explicitly rule out that this is just a side-effect of a different trait (e.g., general curiosity, language capacity)?"
  *   **Pass:** The pitcher acknowledges alternative hypotheses (byproduct, drift, cultural learning) and offers evidence why selection is more likely (e.g., high metabolic cost, early development onset, cross-species presence).
  *   **Kill:** The pitch assumes *all* universal behaviors are adaptations. If the answer is "It exists, so it must have been selected for," kill it.
  *   *Why:* Many traits are exhaust fumes, not the engine.

  **3. The Time-Travel Test (Specificity of Selection Pressure):**
  *   **Ask:** "Describe the specific ancestral problem this solved. Could the *exact same story* be told if the behavior were the opposite?" (The Kipling Test).
  *   **Pass:** The selection pressure is specific (e.g., "avoiding specific predators during pregnancy") and makes sense in the Environment of Evolutionary Adaptedness (EEA).
  *   **Kill:** The explanation is retrofitted. (e.g., "Women like true crime to monitor threats." *Editor:* "If men liked it more, what would the story be?" *Pitcher:* "Then it would be about hunting strategy.") If the story flips to fit the data, it's a Just-So story.
  *   *Why:* A theory that fits any outcome predicts nothing.

  **4. The Mismatch Check:**
  *   **Ask:** "Does the modern expression of the trait map logically onto the ancestral mechanism? Or is it a 'supernormal stimulus'?"
  *   **Pass:** Acknowledges the modern behavior is a mismatch (e.g., "We evolved to crave sugar, now we eat donuts").
  *   **Kill:** Claims the modern behavior is exactly what ancestors did (e.g., "We evolved to sit in open-plan offices" or "We evolved to listen to podcasts").
  *   *Why:* Ancestral environments did not contain podcasts, offices, or modern occupational hierarchies.

  **5. The Falsifiability Bottom Line:**
  *   **Ask:** "What evidence would prove this hypothesis *false*?"
  *   **Pass:** Specific prediction (e.g., "If we find a culture where women do not monitor threats, this is wrong" or "If this trait appears only after puberty, it's not an evolved module").
  *   **Kill:** "It's hard to test," or "It's a tendency, not a rule," without defining the boundary conditions.
  *   *Why:* If "it helped on the savanna" explains everything, it explains nothing.

  ---

  ### Part 2: Handling "Real Finding, Fake Gloss"

  This is your most common scenario: The psychology is solid (e.g., "People hate interruptions"), but the evolutionary story is tacked on ("Because lions interrupted us").

  **The Protocol:**
  1.  **Separate the layers.** Treat the empirical finding (Layer 1) and the evolutionary explanation (Layer 2) as distinct claims.
  2.  **Verdict:** **Green light for Layer 1, Red light for Layer 2.**
  3.  **Action:** Commission the piece *only if* the writer agrees to frame the evolutionary part as **speculative hypothesis**, not established fact. The headline cannot promise the "why" if the "why" is unproven.
  4.  **Wording:** Use phrases like "Researchers propose," "One hypothesis suggests," or "Evolutionary theorists argue." Never "Science proves we evolved to..."

  *If the writer insists the evolutionary gloss is the story:* **Kill.** Do not let a solid finding be held hostage by a weak theory.

  ---

  ### Part 3: The Editorial Handoff (Where the Procedure Stops)

  The filter above catches bad science. It cannot catch bad *editorial judgment*. You must take the wheel at these points:

  1.  **Harm vs. Interest:** A story might pass the science filter but reinforce harmful determinism (e.g., "Men are evolved to lead, women to follow"). Even if methodologically sound, is this a narrative you want to amplify without heavy contextual framing?
  2.  **Novelty:** A story can be scientifically valid but boring ("Yes, another study on risk-taking").
  3.  **Scope:** Is this a 500-word sidebar or a 3,000-word feature? EP claims often require more word count to explain the caveats than the claim itself.

  ---

  ### Part 4: Running the Procedure on Your Pitches

  Here is the filter applied to your three scenarios.

  #### Pitch A: Women, True Crime, and Predator Monitoring
  *   **Claim:** Women's interest in true crime is an evolved threat-monitoring adaptation.
  *   **1. Phenomenon:** **Pass.** Surveys consistently show higher female engagement with true crime.
  *   **2. Adaptation vs. Byproduct:** **Fail.** Interest in social transgression and danger is general, not sex-specific. Men consume violence (action movies, combat sports) at high rates. Is this specific to *predation* or general *social learning*?
  *   **3. Time-Travel Test:** **Fail.** Ancestors did not consume narrativized, manufactured accounts of crimes committed by strangers. They dealt with immediate, local threats. The mechanism (podcast consumption) is too distant from the proposed module (immediate threat detection).
  *   **4. Mismatch:** **Fail.** The pitch treats podcast listening as the adaptation, not a mismatched outlet for a different adaptation (e.g., social gossip).
  *   **5. Falsifiability:** **Weak.** If men listened more, the story would shift to "hunting simulation."
  *   **Verdict:** **KILL THE EVO ANGLE.**
      *   *Editor's Note:* I know you like this yarn (it's a great hook). But this is a classic Just-So story. The "predator monitoring" hypothesis is unfalsifiable here.
      *   *Pivot:* Run the story on the **psychology/sociology** of why women engage with true crime (safety strategies, social bonding, processing fear) without claiming it's an *evolved module*.

  #### Pitch B: Sex Differences in Jobs are Evolved and Fixed
  *   **Claim:** Cross-cultural sex differences in occupational preference show evolved, fixed traits.
  *   **1. Phenomenon:** **Pass.** Differences often appear in large datasets.
  *   **2. Adaptation vs. Byproduct:** **Fail.** The pitch ignores the "Gender Equality Paradox" (sex differences in preferences sometimes *increase* in more egalitarian societies due to freedom of choice, not biology) and conflates *preference* with *ability*.
  *   **3. Time-Travel Test:** **Fail.** "Occupational preferences" for modern jobs (accountant vs. nurse) cannot be directly selected for. They must be proxies for "things vs. people." Even then, the "fixed" claim is the killer.
  *   **4. Mismatch:** **Fail.** Modern occupations did not exist in the EEA.
  *   **5. Falsifiability:** **Kill Condition.** The claim that the trait is **"therefore fixed"** is a naturalistic fallacy and biologically unsound. Neuroplasticity and cultural evolution allow traits to shift.
  *   **Verdict:** **KILL.**
      *   *Editor's Note:* This is the most dangerous pitch. It moves from "is" to "ought." Even if the preference has a biological component, calling it "fixed" is scientifically wrong and editorially irresponsible.

  #### Pitch C: Open-Plan Offices vs. Hunter-Gatherer Brains
  *   **Claim:** Open-plan offices fail because our brains evolved for small-band privacy.
  *   **1. Phenomenon:** **Pass.** People hate open-plan offices; productivity drops.
  *   **2. Adaptation vs. Byproduct:** **Pass (Plausible).** Cognitive load and stress responses are physiological.
  *   **3. Time-Travel Test:** **Pass.** Ancestral bands were small. However...
  *   **4. Mismatch:** **Fail/Caution.** Hunter-gatherers did not work in silence. They lived in constant proximity with noise. The issue isn't "proximity," it's "lack of control over attention."
  *   **5. Falsifiability:** **Pass.** If noise/proximity were the only factor, ancestral life would have been impossible. The specific mechanism must be *unpredictable* interruption, not just presence.
  *   **Verdict:** **RUN THE FINDING, CUT THE GLOSS.**
      *   *Editor's Note:* The "Caveman Brain" headline is clicky, but it's imprecise. The science is about **environmental psychology** (control, acoustic privacy, cognitive load).
      *   *Action:* Allow the writer to mention evolution as a *contextual frame* ("Our brains expect X"), but the headline and lead must focus on the **mechanism** (distraction/stress), not the **history** (savanna). Do not let them imply offices are "unnatural" in a way that suggests a biological impossibility of adaptation.

  ---

  ### Part 5: The Honest Limitation (What Gets Through)

  Even if you use this checklist perfectly, **plausible falsehoods will slip through.** Here is why:

  1.  **The "Universal" Trap:** If a trait appears in all cultures, it *looks* like an adaptation. But it could be a universal byproduct of a different adaptation (e.g., all humans have chins, but chins might be a structural byproduct of jaw shrinkage, not selected for). The checklist struggles to distinguish universal adaptation from universal constraint.
  2.  **The "Mechanism" Black Box:** You will accept stories where the *behavior* is measured but the *neural mechanism* is assumed. A writer can say "The brain does X" without showing the circuitry. You have to trust their proxy measures.
  3.  **The "Good Story" Bias:** This is your bias, Editor. A story that passes the filter but is dry ("It's a complex interaction of drift and plasticity") will get spiked for being boring. A story that barely passes ("The Savanna Secret to Love") will get run because it sings. The checklist protects you from nonsense, but it cannot protect you from **exaggeration**.
  4.  **Replication Lag:** The "Phenomenon Check" relies on published literature. If the field is in the midst of a replication crisis (as psychology currently is), the "real finding" you verify today might be retracted in two years.

  **Final Advice:** The checklist is a shield, not a sword. It stops the worst offenders. For the rest, your best defense is **hedging**. If the science is 60% sure, the headline should be 40% confident. Never let the certainty of the copy exceed the certainty of the data.
