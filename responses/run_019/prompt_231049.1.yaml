answer: |-
  # The Typographic Sort: A Decision Instrument

  **Instructions for the Facilitator:**
  Present the following questions sequentially to the respondent. Do not reveal the names of the positions. Record the path taken through the branches. The probes described in *italics* must be presented verbally or via sketch as indicated.

  ### Node 1: The Question of Degree
  **Probe:** Present a standard double-storey printed 'a' alongside a single-storey handwritten 'a'. Then describe a simplified mark shaped like an 'o' with a short right-hand stem.
  **Question:** "Looking at this simplified 'o' with a stem, would you say it is *less* of an 'a' than the standard printed version, or is there a hard boundary where it is simply *not* an 'a' at all?"
  *   **Response A (Graded):** "It is less of an 'a'; membership admits of degree." → **Go to Node 2.**
  *   **Response B (Categorical):** "There is a hard boundary; it is either an 'a' or it is not." → **Go to Node 3.**

  ### Node 2: The Source of Resemblance (Graded Branch)
  **Probe:** Describe a heavily flourished blackletter 'a'.
  **Question:** "When you judge this flourished mark to be an 'a', does it feel like a match to one single, idealised summary shape in your mind, or does it feel like a match to a cloud of many specific 'a's you have remembered from the past?"
  *   **Response A (Summary):** "I compare it to one averaged or ideal representation." → **Leaf 1: Prototype Theory.**
  *   **Response B (Instances):** "I compare it to many particular instances I have stored in memory." → **Leaf 2: Exemplar Theory.**

  ### Node 3: Structural Sufficiency (Categorical Branch)
  **Probe:** Describe an 'a' rendered only as a dotted or outlined silhouette, and an 'a' with its bowl open at the top.
  **Question:** "If the enclosure is broken or the line discontinuous, can the mark still be an 'a' purely in virtue of its geometry and part–whole relations, or does geometric similarity fail to guarantee membership?"
  *   **Response A (Structure Sufficient):** "If the topological skeleton is preserved, it is an 'a' regardless of other factors." → **Leaf 3: Skeletal Structuralism.**
  *   **Response B (Structure Insufficient):** "Geometry alone is not enough; external factors determine membership." → **Go to Node 4.**

  ### Node 4: Functional Sufficiency (External Factors Branch)
  **Probe:** Describe a deliberately novel mark that a small community resolves to use, and thereafter unhesitatingly reads, as the letter 'a'.
  **Question:** "If this community successfully reads and writes with this novel mark, does that functional role alone make it an 'a', or is successful reading insufficient without further constraints?"
  *   **Response A (Function Sufficient):** "If it plays the role in the practice, it is an 'a'." → **Leaf 4: Functional Contextualism.**
  *   **Response B (Function Insufficient):** "Successful use is not enough; there must be normative constraints." → **Go to Node 5.**

  ### Node 5: The Status of the Category (Normative Branch)
  **Probe:** Return to the deliberately novel mark used by the small community.
  **Question:** "For this mark to be an 'a', is there a robust fact of the matter concerning the maker's intentions and community norms, or is 'being an a' merely a label we project onto marks when our sorting practice requires it?"
  *   **Response A (Robust Fact):** "There is a fact of the matter grounded in intention and norms." → **Leaf 5: Normative Artefactualism.**
  *   **Response B (Projected Label):** "There is no further fact; the sameness is projected by our practice." → **Leaf 6: Deflationism.**

  ***

  ## The Six Leaves: Positions and Awkward Commitments

  1.  **Prototype Theory:** Membership is graded by similarity to a single stored summary representation of the category.
      *   *Awkward Commitment:* This position must accept that a glyph can be truthfully described as "more" or "less" of a letter, complicating binary reading tasks.
  2.  **Exemplar Theory:** The category standard is a cloud of remembered particular 'a's and membership is graded by similarity to those stored instances.
      *   *Awkward Commitment:* This requires the implausible cognitive capacity to store and access a vast multitude of specific glyph instances for every letter category.
  3.  **Skeletal Structuralism:** A glyph is an 'a' just in case it instantiates the right part–whole skeleton, with only those alterations that preserve the topology and relations of the letter.
      *   *Awkward Commitment:* It must reject clearly legible 'a's as non-'a's if they violate topological rules, such as certain cursive forms where the counter closes only momentarily.
  4.  **Functional Contextualism:** A glyph is an 'a' when it plays the proper role in a community's writing and reading practice.
      *   *Awkward Commitment:* It implies that any mark, even a circle or a blot, becomes an 'a' if a community accidentally coordinates upon it, regardless of its form.
  5.  **Normative Artefactualism:** Membership rests on the maker's intentions together with the norms of a typographic community, so that not just any functional substitute suffices.
      *   *Awkward Commitment:* It entails that a perfect visual duplicate of an 'a' is not an 'a' if the producer lacked the specific intention to inscribe that letter.
  6.  **Deflationism:** The sameness across tokens is projected by our sorting practice and there is no further robust essence to capture.
      *   *Awkward Commitment:* It dissolves the seminar's central question by denying there is any objective truth to be found about what makes an 'a' an 'a'.

  ***

  ## Logical Space: Unoccupied Combinations

  The following combinations of branch answers correspond to no actual position in the typographic debate, diagnosed as follows:

  1.  **Graded Structuralism (Node 1A + Node 3A):**
      *   *Diagnosis:* **Incoherent.** Structuralism relies on topological invariants (e.g., the presence of a counter), which are binary properties; a skeleton is either preserved or broken, admitting no degree.
  2.  **Intention-based Gradedness (Node 1A + Node 5A):**
      *   *Diagnosis:* **Incoherent.** A maker's intention is a mental state that is typically present or absent; one cannot partially intend to write an 'a' in a way that renders the glyph partially an 'a'.
  3.  **Functional Exemplarism (Node 4A + Node 2B):**
      *   *Diagnosis:* **Unexplored/Unattractive.** While one could theoretically compare a functional role to remembered roles, functionalism usually defines the category by current use rather than similarity to past instances, making this hybrid theoretically unstable.
  4.  **Deflationary Structuralism (Node 3A + Node 5B):**
      *   *Diagnosis:* **Merely Unexplored.** One could argue that while we *treat* structure as the boundary, this boundary is merely projected. However, most structuralists believe the topology is a mind-independent fact, so this path is rarely taken.

  ***

  ## Separation Issues: Indistinguishable Leaves

  There are two pairs of leaves that this instrument cannot genuinely separate with the available probes alone. Further cases or considerations would be needed to distinguish them.

  1.  **Prototype Theory vs. Exemplar Theory:**
      *   *Issue:* Respondents often lack introspective access to whether they are matching a "summary" or a "cloud of instances," as both processes feel like recognising similarity.
      *   *Required Consideration:* A reaction-time experiment would be needed. If recognition speed depends on the typicality of the glyph (distance from the average), it supports Prototype Theory; if it depends on the frequency of specific similar tokens encountered recently, it supports Exemplar Theory.
  2.  **Functional Contextualism vs. Normative Artefactualism:**
      *   *Issue:* In most stable communities, function and norms align; what is read as an 'a' is also intended as an 'a'. The "novel mark" probe attempts to separate them, but respondents may conflate "successful reading" with "normative acceptance."
      *   *Required Consideration:* A case of *systematic error* is required. We would need a scenario where a community consistently reads a mark as an 'a', but their own explicit norms forbid it (e.g., a forbidden taboo symbol that looks like an 'a'). Functionalists would call it an 'a'; Normative Artefactualists would not.
