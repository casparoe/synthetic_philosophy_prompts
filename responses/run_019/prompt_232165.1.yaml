answer: |-
  You are right to be skeptical. The natural scientist's demand for prospective explanatory power is the gold standard for causal inference, but history deals with singular, non-repeatable events where controlled experimentation is impossible. Consequently, historical explanation often degenerates into "curve-fitting" known data points. To prevent this, a theory of historical explanation must be constrained by the cognitive psychology of judgment as much as by logical rigor.

  I have filtered out disciplinary habits (e.g., the demand for universal covering laws, which fails on singular events; the demand for moral judgment, which is not explanatory; the demand for pure objectivity, which ignores selection bias). Below are the surviving desiderata.

  ### The Desiderata for Historical Explanation

  **1. Counterfactual Stability (Non-negotiable)**
  *   **The Requirement:** An explanation must demonstrate that the outcome was not inevitable by specifying plausible alternative paths that were excluded by the cited causes. It must survive the removal of the purported cause without collapsing into "something else would have happened anyway."
  *   **The Case:** The outbreak of WWI. A theory claiming "alliances caused the war" fails if it cannot show how the system would have stabilized had the alliance structure been different. If the war occurs in every nearby possible world, the specific cause is irrelevant.
  *   **Psychological Constraint:** Directly counters **hindsight bias**, which collapses the "possible" into the "actual."

  **2. Mechanistic Transparency (Non-negotiable)**
  *   **The Requirement:** Explanation must identify the transmitting mechanisms (agents, institutions, physical processes) connecting cause to effect, not just temporal succession or correlation.
  *   **The Case:** The "Steve Jobs" narrative. Saying "Apple succeeded because Jobs was a visionary" is a correlation. A mechanistic explanation details the specific decisions, supply chain manipulations, and market timings where his agency altered the probability distribution of outcomes.
  *   **Psychological Constraint:** Directly counters the **narrative fallacy**, where causal fluency is mistaken for causal depth.

  **3. Evidentiary Reflexivity (Non-negotiable)**
  *   **The Requirement:** The theory must account for why the evidence exists in its current form. It must model the selection bias of the archive itself.
  *   **The Case:** The fall of Rome. Much of our record was written by Christian apologists or barbarian chroniclers with vested interests in portraying Rome as corrupt or doomed. An explanation that treats these texts as neutral data fails reflexivity.
  *   **Consideration:** The surviving record is often shaped by the outcome it appears to explain (victors write history).

  **4. The Intelligibility/Predictability Distinction (Non-negotiable)**
  *   **The Requirement:** The theory must explicitly distinguish between *why an event makes sense now* (retrospective intelligibility) and *whether it could have been anticipated then* (ex ante predictability). It must not allow the former to validate the latter.
  *   **The Case:** The 2008 Financial Crisis. Post-hoc, the causes look obvious (subprime mortgages, leverage). Ex ante, the signal-to-noise ratio was too low for reliable prediction. A theory that conflates these two validates "I knew it all along" reasoning.
  *   **Consideration:** Protects against the demand for natural-science-style prediction in singular historical contexts.

  **5. Narrative Coherence (Preference of the Narrativist Camp)**
  *   **The Requirement:** The explanation should form a unified story with a beginning, middle, and end, providing emotional or cognitive closure.
  *   **The Case:** Biographies or national histories.
  *   **Status:** **Preference.** While humans crave this, demanding it risks distorting causal complexity to fit a plot arc. A rigorous theory can tolerate fragmentation if the causal mechanisms are sound.

  ***

  ### The Screening Requirement

  The single requirement that screens out the most candidate theories is **Counterfactual Stability**.

  Most historical explanation is abductive: it starts with the known outcome and works backward to find sufficient conditions. This is intellectually cheap. Demanding Counterfactual Stability forces the historian to work forward from the conditions to a range of *possible* outcomes, then show why the actual one was selected. This eliminates:
  1.  **Inevitability Theories:** (e.g., strong Marxism, Hegelianism) which claim the outcome was determined by structural forces.
  2.  **Pure Narrative Models:** Which rely on plot coherence rather than causal leverage.
  3.  **Great Man Theories:** Which often fail to show how the outcome would have differed without the individual (overdetermination).

  If a theory cannot specify what *would not* have happened without its proposed cause, it is not an explanation; it is a description.

  ***

  ### The Incompatibility

  You asked squarely whether any pair of desiderata cannot be jointly satisfied.

  **Narrative Coherence and Probabilistic Honesty are incompatible at the limit.**

  To satisfy **Narrative Coherence**, you must prune uncertainty, smooth over noise, and present a directed arc from cause to effect. This reduces cognitive load for the reader but distorts the probability landscape.
  To satisfy **Probabilistic Honesty** (required by Counterfactual Stability and Mechanistic Transparency), you must represent the contingency, the dead ends, and the genuine uncertainty that existed at the time. This preserves causal fidelity but destroys narrative flow.

  Psychological research confirms that as **coherence increases, perceived uncertainty decreases**. You cannot maximize both. A theory that demands a perfectly tidy story *must* suppress the probabilistic nature of the evidence. A theory that demands perfect probabilistic representation *must* sacrifice the tidy story.

  **Verdict:** You must choose between a history that is psychologically satisfying (Coherence) and one that is causally honest (Probability). Most traditional historical writing chooses Coherence. Your scientific intuition demands Probability. An adequate theory must acknowledge this trade-off rather than pretending it does not exist.
