  Running this analysis in reverse reveals the specific conditions required to convert a defeat into a founding myth. Dunkirk succeeded because the loss preserved the core fighting force for future engagement, whereas the fall of Singapore in 1942 resulted in the total capture of 80,000 troops with no escape narrative. Dunkirk occurred within sight of home, allowing civilian participation and media control; Singapore was a distant imperial embarrassment involving colonial subjects and signaling vulnerability rather than resilience. Additionally, Dunkirk offered a clear path forward (standing alone against tyranny), while Singapore represented the collapse of imperial invincibility without an immediate redemption arc. A defeat becomes a myth only when it sustains the population's capacity to continue fighting and involves them directly in the survival story. Singapore shattered the myth of white superiority; Dunkirk reinforced the myth of British pluck.

