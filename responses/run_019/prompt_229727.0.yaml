answer: |-
  **DOCUMENT: SNR-ICP v4.2 (Staged Neural Replacement Identity Continuity Protocol)**
  **TO:** Hospital Ethics Panel
  **FROM:** Chair, Ethics Panel
  **SUBJECT:** Operationalizing Personal Identity for Certification

  ### Preamble
  This protocol does not claim to solve the metaphysical problem of personal identity. It operationalizes the *precautionary principle* regarding identity. We assume that if continuity is broken, the original patient ceases to exist and a new entity arises. Since the new entity has not consented to the procedure, proceeding constitutes battery or homicide. Therefore, we certify continuity not as a metaphysical fact, but as a safety threshold for consent validity.

  ---

  ### The Protocol: Five Sequential Gates

  **Gate 1: Causal Integration Rate (The Gradualism Check)**
  *   **Question:** Does the replacement rate allow the existing neural substrate to causally shape the integration of the synthetic component before the next stage?
  *   **Metric:** Maximum 5% total neural volume replaced per 30-day cycle. Minimum 48-hour functional stabilization period between stages where no new replacement occurs.
  *   **Sufficient Answer:** Yes, the schedule adheres to the 5%/30-day cap and stabilization windows.
  *   **Halt Condition:** If the proposed schedule exceeds this rate, certification is **REFUSED**. (Rationale: Sudden replacement breaks causal dependency, creating a copy rather than a continuation.)
  *   **Hand-off:** None. This is a factual constraint on the surgical plan.

  **Gate 2: Functional Overlap (The Psychological Continuity Check)**
  *   **Question:** Do the synthetic components assume function *through* the firing patterns of the remaining biological tissue, or do they override them?
  *   **Metric:** Post-stage neuro-mapping must show >85% correlation in synaptic weighting between pre-stage biological tissue and post-stage hybrid tissue during standard cognitive tasks.
  *   **Sufficient Answer:** Yes, correlation exceeds 85%.
  *   **Halt Condition:** If correlation drops below 85%, certification is **REFUSED**. (Rationale: If the new parts do not inherit the functional state of the old parts, psychological continuity is severed.)
  *   **Hand-off:** None. This is a biometric fact.

  **Gate 3: First-Person Phenomenology (The Authority Check)**
  *   **Question:** Does the patient report a continuous sense of self, memory access, and agency since the last stage?
  *   **Metric:** Structured interview using the *Continuity of Consciousness Inventory (CCI)*. Specific attention to "gap" reports or feelings of "foreign control."
  *   **Sufficient Answer:** Patient affirms continuity without reported dissociation.
  *   **Halt Condition:** If the patient reports feeling like a "successor," "copy," or "different person," certification is **REFUSED**, regardless of biometric success. (Rationale: First-person authority on identity is the primary moral datum; if they feel they are dying, we cannot proceed.)
  *   **Hand-off:** If the patient is unable to communicate (e.g., aphasia from prior stage), this gate defaults to **Court Review** (see Gate 5).

  **Gate 4: Divergence Resolution (The Measures vs. Memory Check)**
  *   **Question:** If biometric continuity (Gate 2) is high, but psychological self-report (Gate 3) indicates discontinuity (or vice versa), which prevails?
  *   **Rule:** **Phenomenology Prevails.**
  *   **Sufficient Answer:** Panel acknowledges the divergence.
  *   **Halt Condition:** If Gate 3 fails, the procedure halts even if Gate 2 passes.
  *   **Hand-off:** If the patient claims continuity but biometrics show <50% functional overlap, the panel must flag the case for **Legal Review** regarding liability. (Rationale: The patient *feels* like the same person, but may lack the cognitive capacity to hold legal responsibilities of the original person.)

  **Gate 5: The Value Hand-off (The Legal Status Check)**
  *   **Question:** Has the cumulative replacement exceeded 50% of the original brain volume, or have 12 months passed since enrollment?
  *   **Rule:** Beyond these thresholds, identity becomes a matter of legal statute, not clinical certification.
  *   **Sufficient Answer:** Panel confirms thresholds have not been met.
  *   **Halt Condition:** If thresholds are met, the Panel **CEASES CERTIFICATION**.
  *   **Hand-off:** Decision regarding the legal status of the patient (inheritance, criminal liability, marriage validity) is **REFERRED TO COURT**. The Panel certifies medical safety; the Court certifies juridical personhood.

  ---

  ### Application to Cases

  #### Case 1: The Standard Protocol (5-Year, 2%/Month)
  *   **Analysis:**
      *   Gate 1: Passes (2% is well under the 5% cap).
      *   Gate 2: Passes (Slow integration allows high synaptic correlation).
      *   Gate 3: Passes (Patient reports normalcy).
      *   Gate 5: At year 3 (60% replacement), the Panel stops certifying identity.
  *   **Verdict:** **Certified** for stages 1–36. At month 37, authority transfers to the Court.
  *   **Outcome:** Routine. The procedure treats the first half of the replacement as medical, the second half as legal.

  #### Case 2: The Accelerated Protocol (Total Replacement in 6 Weeks)
  *   **Analysis:**
      *   Gate 1: **FAILS.** To replace 100% of tissue in 6 weeks requires ~16% replacement per week, vastly exceeding the 5%/month causal integration limit.
      *   Gate 2: Likely fails (Synthetic components will override rather than integrate with biological tissue due to speed).
  *   **Verdict:** **REFUSED.**
  *   **Uncomfortable Consequence:** The Panel must declare that the patient who enters the operating room will not be the person who wakes up. The "survivor" is a new entity. Consequently, the original patient's advance directive is invalid for the post-op entity, and the post-op entity has not consented to the surgery. Legally, this procedure resembles suicide followed by the creation of a new being. The hospital cannot perform this without a court order declaring the pre-op patient legally dead upon completion.
  *   **Why Uncomfortable:** It forces us to admit that a medically "successful" cure results in the death of the client.

  #### Case 3: The Dissociated Success (Measures Intact, Patient Dissociated)
  *   **Analysis:**
      *   Gate 1: Passes (Slow rate).
      *   Gate 2: Passes (90% synaptic correlation).
      *   Gate 3: **FAILS.** Patient states: "I remember her life, but I feel like I am wearing her skin. She is gone; I am the machine keeping her memory alive."
      *   Gate 4: Rule invoked. Phenomenology prevails.
  *   **Verdict:** **REFUSED.** Further stages halted.
  *   **Uncomfortable Consequence:** The patient is medically stable and cognitively functional, but we must stop treatment. To continue would be to violate the autonomy of the *current* conscious entity who identifies as a successor, not the original patient. We are effectively trapping a new entity in a body intended for someone else.
  *   **Why Uncomfortable:** We are prioritizing a metaphysical feeling over biological health. The patient might *want* to continue, but their testimony invalidates their own status as the original consent-giver.

  ---

  ### Limitations and Reflections

  **What This Procedure Cannot Settle**
  This protocol cannot determine *truth*. It determines *risk*. It cannot answer whether the person *actually* survives, only whether we can proceed without high confidence of identity loss. It also cannot settle the "Teletransportation Paradox" edge case: if a patient is scanned, destroyed, and rebuilt perfectly instantly, Gate 1 fails (no gradualism), but Gate 2 and 3 might pass. The protocol forbids this, but philosophy remains divided on whether that forbiddance is correct.

  **Consideration That Would Rebuild the Procedure**
  If **Parfit's Reductionism** were accepted as policy rather than Locke's Psychological Continuity.
  *   *Current Assumption:* Identity is binary (Same Person vs. Different Person).
  *   *Parfit's View:* Survival is a matter of degree (Relation R).
  *   *Rebuild:* If we accepted Parfit, the protocol would not have "Halt" conditions. Instead, it would calculate a "Survival Coefficient." If the coefficient drops below a certain threshold, consent requirements might shift from "Informed Consent" to "Best Interest Standard" (as one might decide for a child or diminished capacity adult), acknowledging the original person is fading but not gone. The current binary protocol forces a cliff-edge decision where philosophy suggests a slope.

  **Where Theory is Distorted by Steps**
  The greatest distortion is in **Gate 5 (The Value Hand-off)**.
  *   *Theory:* Philosophical debates about identity usually imply that if identity is lost, *moral responsibility* and *rights* shift instantly.
  *   *Distortion:* The protocol arbitrarily sets a 50% volume / 12-month threshold for handing off to the court. This is administrative convenience, not philosophical rigor. There is no theoretical reason why 51% replacement is legally distinct from 49%. By creating a "safe harbor" for the first half, we distort the theory that identity erosion is cumulative from the *first* cut. We are pretending the first 50% is "safe" to simplify the legal workflow, which is a pragmatic lie told to keep the hospital running.

  **Final Note to Panel:**
  When you vote "Certified," you are not voting that the soul remains. You are voting that the causal chain is unbroken enough that we are not liable for murder. Proceed accordingly.
