prompt: |-
  I chair the ethics panel of a hospital that performs staged neural replacement for patients with degenerative brain disease: failing tissue is swapped for synthetic components in sessions spread over months or years, with the patient awake and functional between sessions. My panel must certify, before each stage, that proceeding still counts as treating the same patient rather than as gradually replacing one person with another -- and at the end, whether the finished patient legally and morally is the person who enrolled. Philosophers disagree about this (psychological continuity, bodily continuity, and the worry that only *gradual, causally dependent* replacement preserves anyone), but I cannot hand my panel a literature review. Please turn whatever is most defensible in that debate into a procedure the panel can actually run before each session: the questions to ask in order (about rate of replacement, whether new components take over function because the old tissue shaped them, interruption and rollback options, the patient's own testimony, and what we do when memory and personality measures diverge), what counts as a sufficient answer to each, where the procedure halts with a refusal, and where it must hand the decision back to the patient or a court because the question is one of values, not facts. Then apply it to three cases: a five-year, two-percent-per-month replacement; the same total replacement compressed into six weeks; and a case where the neural measures say continuity is intact but the patient reports feeling like a successor to herself. Include at least one application where the procedure delivers a verdict my panel will find uncomfortable, and say what the procedure cannot settle at all. Finally, state what consideration -- philosophical or empirical -- would lead you to rebuild the procedure differently, and where its translation of the theory into steps is most likely to have distorted the theory.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a hospital ethics panel.
      *   **Context:** Staged neural replacement (synthetic components swapped for failing tissue over time, patient awake/functional between sessions).
      *   **Task:** Create a *procedure* (checklist/protocol) for the panel to certify personal identity continuity before each stage and at the end.
      *   **Constraints:**
          *   Cannot just provide a literature review; must be actionable.
          *   Must incorporate key philosophical debates (psychological continuity, bodily continuity, gradual/causal dependence).
          *   Must specify: Questions in order, sufficient answers, halt conditions (refusal), hand-off conditions (values vs. facts).
          *   Must apply to three specific cases (5-year slow, 6-week fast, discontinuity in self-report vs. measures).
          *   Must include an "uncomfortable verdict."
          *   Must state limitations (what it can't settle) and potential distortions of theory.
      *   **Tone:** Professional, ethical, procedural, philosophically grounded but practical.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *Psychological Continuity:* Memory, personality, preferences. (Locke, Parfit).
      *   *Bodily/Biological Continuity:* Physical brain structure. (Animalism).
      *   *Gradualism/Causal Dependence:* The "Ship of Theseus" problem. Sudden replacement feels like death/copied; gradual feels like survival.
      *   *First-Person Authority:* The patient's own sense of self.
      *   *Legal/Moral Status:* Rights, responsibility, consent.

  3.  **Drafting the Procedure (The "Identity Continuity Protocol" - ICP):**
      *   *Goal:* Turn abstract philosophy into yes/no/maybe gates.
      *   *Structure:* Sequential steps. If one fails, stop.
      *   *Step 1: Causal/Gradual Integrity.* (The "Ship of Theseus" check). Is the replacement rate slow enough to maintain causal dependency?
      *   *Step 2: Functional Integration.* (The "Psychological" check). Do new parts work *with* old parts seamlessly?
      *   *Step 3: First-Person Phenomenology.* (The "Lockean" check). Does the patient *feel* like themselves?
      *   *Step 4: Divergence Resolution.* What if measures disagree?
      *   *Step 5: The "Values" Hand-off.* When is this a metaphysical guess vs. a risk assessment?

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* Just asking "Do you feel like you?" is weak. Need objective metrics too.
      *   *Adjustment:* Add neuro-cognitive benchmarks.
      *   *Critique:* How do we define "too fast"?
      *   *Adjustment:* Define a "Causal Integration Window" (CIW).
      *   *Critique:* What if the patient says "I'm new" but tests say "same"?
      *   *Adjustment:* Prioritize first-person authority for *moral* status, but objective measures for *legal* liability. Actually, for *continuity certification*, first-person dissent should be a hard stop (suicide risk/consent violation).
      *   *Critique:* Where does the panel stop and the court begin?
      *   *Adjustment:* If the procedure indicates "borderline," it's a legal status question, not medical.

  5.  **Developing the Three Cases:**
      *   *Case A (5-year, 2%/month):* Slow, gradual. Should pass easily.
      *   *Case B (6-week total):* Fast. Likely fails the "Causal Integration" step. Uncomfortable verdict: Technically the same biology at start/end, but procedure flags it as "replacement/death."
      *   *Case C (Measures say Yes, Patient says No):* The "Alien Hand" or "Imposter" scenario. Procedure must halt. Uncomfortable verdict: We must stop treating even if medically beneficial because the "person" is consenting to their own deletion.

  6.  **Addressing Limitations and Distortions:**
      *   *What can't it settle?* The metaphysical truth. We are measuring *confidence* in continuity, not continuity itself.
      *   *Distortion:* Turning a spectrum (Parfit's reductionism) into a binary (Pass/Fail). Philosophy says "degree of survival"; Procedure says "Certify/Don't Certify."

  7.  **Drafting the Content (incorporating specific constraints):**
      *   *Header:* Formal Protocol Title.
      *   *Sections:* Preamble, The Protocol (Steps 1-5), Application to Cases, Limitations/Reflection.
      *   *Tone Check:* Needs to sound like a hospital document but acknowledge the philosophical weight.

  8.  **Self-Correction/Review during drafting:**
      *   *Did I answer the prompt's specific questions?*
