answer: |-
  ### 1. Exam Question

  **Course:** PHI 405: Philosophy of Mathematics
  **Exam:** Final Examination
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**
  Number theorists frequently employ probabilistic heuristics to justify conjectures, treating arithmetic properties as independent random events. As discussed in lecture, the Hardy-Littlewood conjecture refines a crude probabilistic model to account for local congruence dependencies, yielding accurate constants. In contrast, the Mertens conjecture collapsed despite overwhelming numerical support and initial heuristic plausibility, due to hidden oscillatory dependencies.

  Write an essay addressing the following:
  1.  Articulate a general epistemic criterion for when a probabilistic heuristic confers genuine justificatory force on a conjecture.
  2.  Explain how the contrast between the Twin Prime and Mertens cases supports your criterion, specifically regarding the nature of arithmetic dependence and the limits of numerical evidence.
  3.  Apply your criterion to a specific conjecture not discussed in lecture (e.g., Goldbach, Normality of constants, etc.).

  *Do not merely summarize the mathematical history; focus on the conditions under which heuristic reasoning transitions from plausible guessing to epistemic justification.*

  ***

  ### 2. Model Answer

  Probabilistic heuristics in number theory confer justificatory force only in proportion to the exhaustiveness with which possible sources of arithmetic dependence are enumerated and modeled. A heuristic is not merely a guess based on frequency; it is a structural claim that no hidden correlations exist beyond those accounted for. Therefore, genuine justification arises not from the heuristic's numerical fit, but from the rigor of the structural analysis regarding independence.

  The Twin Prime case illustrates successful justification through structural correction. The crude Cramér model treats primality as independent coin flips, yielding the correct order of magnitude but the wrong constant. Hardy and Littlewood secured stronger justification not by gathering more data, but by identifying local dependencies: if $n$ is prime, $n+2$ is constrained modulo small primes. By correcting the probability weights to reflect these congruence obstructions, the heuristic aligns with arithmetic structure. The justification here is robust because the sources of dependence (local moduli) are known and manageable.

  Conversely, the Mertens conjecture demonstrates the epistemic danger of unchecked independence assumptions. The heuristic assumed the Möbius function behaves like a random walk. Numerically, this held for bounds far beyond computational reach. However, the failure was due to global dependencies linked to the zeros of the Riemann zeta function. These dependencies are oscillatory and deferred; counterexamples exist only at magnitudes inaccessible to computation (Skewes-type numbers). This reveals that numerical evidence cannot substitute for structural analysis. A heuristic that fits all available data may still fail if it ignores dependencies that manifest only asymptotically.

  Thus, the criterion is: a heuristic justifies a conjecture only if the model accounts for all known structural constraints and provides reason to believe no hidden global correlations exist. Numerical verification is secondary; it cannot rule out deferred oscillatory counterexamples.

  Applying this to the conjecture that $\pi$ is a normal number (its digits are uniformly distributed): the probabilistic heuristic is weak. We treat digits as independent random variables, and data supports this to trillions of places. However, unlike the Twin Prime case, we lack a structural theory explaining why $\pi$'s digits should be random. There are no known "congruence corrections" to apply, nor do we know if hidden global dependencies exist. Under the proposed criterion, the heuristic provides minimal justification because the sources of dependence have not been enumerated or excluded. It remains a plausible guess, not a justified belief, until the arithmetic structure of $\pi$ is better understood. Heuristics are tools for discovery, but justification requires mapping the architecture of dependence.

  ***

  ### 3. Marking Scheme

  | Point | Marks | What full marks requires | How candidates typically blow it |
  | :--- | :--- | :--- | :--- |
  | **1. General Criterion** | 4 | Clearly articulates that justification depends on modeling/excluding dependencies, not just statistical fit. | Vaguely claims heuristics are "good enough" or defines justification solely as high probability. |
  | **2. Twin Prime Analysis** | 4 | Identifies that success came from correcting for local structural dependencies (congruences), not just data. | Describes the math correctly but fails to link the correction to *epistemic justification*. |
  | **3. Mertens Analysis** | 4 | Explains failure as due to hidden/global/oscillatory dependencies that numerical evidence missed. | Treats Mertens as simply "false" without explaining why the heuristic was misleading (deferred counterexamples). |
  | **4. Limits of Evidence** | 4 | Explicitly argues that finite numerical verification cannot confirm independence against asymptotic dependence. | Treats numerical confirmation (e.g., up to $10^{15}$) as strong evidence despite the Mertens lesson. |
  | **5. New Application** | 4 | Applies the criterion consistently to a new case (e.g., Normality of $\pi$), assessing justification based on structural knowledge. | Picks a case but evaluates it based on numerical data rather than the structural criterion established earlier. |
