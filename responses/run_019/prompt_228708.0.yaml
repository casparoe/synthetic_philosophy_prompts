answer: |-
  This is a tactical problem, not a philosophical one. You lost Dev because you tried to win on *metaphysics* (what is rational?) instead of *mechanics* (how does the decision engine work?). Engineers respect mechanics.

  Here is your 15-minute battle plan.

  ### 1. The Sequence (Order of Operations)

  Do not start with the definition. Start with the symmetry. If you lead with "Superrationality says...", Dev hears "Dogma."

  1.  **The Setup (3 mins):** Establish the scenario and the *symmetry of situation*. Get them to agree that the two players are functionally identical in terms of information and capability.
  2.  **The Standard Trap (3 mins):** Walk through the standard "rational" move (defecting). Show that it leads to the bad outcome. Acknowledge Dev is right *causally* (my move doesn't change theirs).
  3.  **The Pivot (5 mins):** Introduce the "Logical Connection." This is the core. Shift from "I affect them" to "My decision is a *sample* of their decision."
  4.  **The "Magic" Defusal (2 mins):** Pre-empt the telepathy objection using the Calculator Analogy (see below).
  5.  **The Test (2 mins):** The scenario to check understanding.

  **Why this order:** You must establish that the *situation* is identical before you claim the *decision* will be identical. If they don't buy the symmetry, the rest is magic.

  ### 2. The ONE Example: "The Two-Room Puzzle"

  Do not use Prisoners (too much criminal baggage). Do not use Voting (too political/abstract). Do not use Clones (triggers "impossible" reflex).

  **The Scenario:**
  "You and another person from this game group are in separate, identical soundproof rooms. You both have a console with two buttons: **GREEN** and **RED**.
  *   If you both press **GREEN**, you both get $1,000.
  *   If you both press **RED**, you both get $100.
  *   If one presses **GREEN** and the other **RED**, the RED presser gets $2,000, the GREEN presser gets $0.
  You cannot communicate. You will never meet or play again. You know the other person is just as smart as you and wants the money."

  **Why this works:**
  *   It's a game (fits the room).
  *   It's symmetric (fits the logic).
  *   It's one-shot (kills the "reputation" argument).

  **Features it MUST NOT Have:**
  *   **NO Communication:** If they can talk, it becomes bargaining.
  *   **NO Iteration:** If they play twice, it becomes "Tit for Tat."
  *   **NO Moral Stakes:** Don't say "hurt" or "help." Use points or money. This is about *winning*, not being *good*.
  *   **NO "Clone" Language:** Do not say "You are clones." Say "You are in identical situations with identical reasoning tools."

  ### 3. Managing Misconceptions (The Dev Defense)

  Here is the order they will arise, and how to handle them.

  **(d) "But I'll cooperate so they cooperate next time." (Iterated Game)**
  *   **When:** Immediately after the Setup.
  *   **Fix:** Crush this first. "Rule #1: You never see them again. No reputation, no revenge. Pure one-shot."

  **(a) "You're saying my button press magically moves their hand." (Telepathy/Causation)**
  *   **When:** During The Pivot. This is Dev's main attack vector.
  *   **Fix:** **Do not deny this.** Agree with Dev. "Dev is right. I am not magically moving their hand. That *would* be magic."
  *   **The Move:** Use the **Calculator Analogy**.
      *   "Imagine we both have the same model calculator. We both type `24 x 7`. I press `=` in this room. You press `=` in that room. Do we get the same answer?" (Yes).
      *   "Did my pressing `=` *cause* your calculator to show 168?" (No).
      *   "But if I know we are running the same process, can I predict your answer by looking at mine?" (Yes).
      *   "Superrationality isn't about causality. It's about **correlation through identical processing**. I'm not choosing *for* you. I'm choosing the output of the algorithm we both share."

  **(c) "It only works on literal identical copies." (Uselessness)**
  *   **When:** After the Calculator Analogy.
  *   **Fix:** Let this sit for 30 seconds. It feels like a "gotcha," but it's actually the bridge to real life.
  *   **The Move:** "It works on copies of the *reasoning process*, not the DNA. If I know you're a rational engineer at a board game night, and I'm a rational engineer at a board game night, our 'source code' is similar enough. The more similar the reasoning, the stronger the correlation. It's a spectrum, not a binary."

  **(b) "This is just Kant/Categorical Imperative." (Ethics)**
  *   **When:** If someone brings up morality.
  *   **Fix:** Dismiss gently. "Kant says you *should* do it because it's moral. Superrationality says you do it because it gets you the $1,000. One is ethics, one is game theory. We're talking about winning."

  ### 4. The Test Question (The "Irrational Opponent" Trap)

  To prove they understand the *logic* and aren't just nodding along because "cooperation is nice," give them a case where superrationality says **DEFECT**.

  **The Scenario:**
  "Okay, same Two-Room Game. But before you start, I tell you: **The person in the other room is not rational.** They are going to press **RED** no matter what. They are a bot hardwired to defect."

  **The Question:**
  "Do you press GREEN or RED?"

  **The Correct Answer:**
  **RED.**
  *   **Why:** Superrationality relies on the *symmetry of reasoning*. If their output is fixed regardless of your reasoning, the link is broken. Your choice no longer predicts theirs. Therefore, you revert to standard dominance (take the $2,000 if you can, or minimize loss).
  *   **What it proves:** If they say "GREEN," they think superrationality is about being *nice*. If they say "RED," they understand it's about *correlated logic*.

  ### 5. Topics to Explicitly Avoid (The "Do Not Open" List)

  1.  **Löb's Theorem / Formal Proofs:**
      *   *The Dodge:* "That's the formal proof underneath, but we're doing the intuition today. It's like explaining an engine by talking about combustion chemistry vs. just driving the car."
  2.  **Evidential vs. Causal Decision Theory:**
      *   *The Dodge:* "That's the academic label for this debate. It's useful for Google later, but it muddies the water right now."
  3.  **Real-World Voting Efficacy:**
      *   *The Dodge:* "Voting adds noise (secret ballots, different motivations). Let's master the clean logic before we add the noise of politics."

  ### 6. Handling Dev (The Heckler Protocol)

  Dev is an engineer. He cares about *causality*. He will interrupt at the "Pivot" stage.

  **Dev's Likely Attack:** "But logically, my decision happens *here*. Theirs happens *there*. There is no wire. You're claiming correlation without a common cause."

  **Your Backup Move:**
  "Dev, you're treating the decision as an *event in time*. Treat it as a *truth in logic*."
  "Think of it like this: If I prove a theorem in my head, and you prove the same theorem in your head, did I cause you to prove it? No. But the truth value is identical. We are both debugging the same logical problem. If I find the optimal solution, and you are running the same debug process, you find the same solution. I'm not hacking your brain; I'm trusting that **Truth is Singular**."

  **If he pushes harder:**
  "Dev, I agree with you on causality. If you want to call it 'magical thinking,' fine. But I'm asking you: If you know the other guy reasons *exactly* like you, do you really believe the universe allows for two different 'optimal' answers to the same problem? Or do you believe logic constrains us both to the same answer?"

  **Summary Checklist for Thursday:**
  1.  **Props:** Bring two identical objects (coins or cards) to represent the rooms. Physical symmetry helps.
  2.  **Timing:** Keep an eye on the clock. If you hit 12 minutes, skip the Kant objection and go straight to the Test Question.
  3.  **Mindset:** You aren't trying to convert Dev to a religion. You are trying to show him a different *model* of decision-making. If he leaves thinking "Well, it's still causal nonsense, but I see the correlation argument," you win.

  Good luck. Don't let him drag you into metaphysics. Keep it on the logic.
