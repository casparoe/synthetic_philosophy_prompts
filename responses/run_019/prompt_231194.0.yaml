answer: |-
  **MEMORANDUM**

  **TO:** Safety-Review Board, Engineering Lead, Compliance Lead
  **FROM:** [Your Name], Safety-Review Board
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Supervision Regime for Dispute Response Model

  **Recommendation**
  I recommend we adopt **Process-Based Supervision** as the primary gating mechanism for model deployment, subject to a mandatory **Outcome Correlation Audit**.

  Under this regime, the model may not deny a refund or close a ticket unless it satisfies the fixed checklist. However, we will not treat the checklist as static. We will institute a concrete switching condition: **If expert outcome grades on "checklist-compliant" tickets fall below 85% for two consecutive bi-weekly cycles, we suspend process-gating and revert to Outcome-Based tuning until the checklist is re-derived.**

  **Rationale**
  This approach balances immediate risk prevention with long-term alignment.

  *   **For Compliance:** Process supervision provides *ex-ante* control. It prevents harm before it reaches the customer, satisfying regulatory expectations for "reasonable care." Crucially, it forces the model to generate a reasoning trail *before* acting. This addresses the risk of "silent failures" (harms without a paper trail) that outcome-based rubrics often miss because no complaint was filed.
  *   **For Engineering:** While process constraints limit flexibility, they reduce the cost of supervision. Real-time checklist validation is cheaper than bi-weekly expert grading. Furthermore, a stable checklist provides a consistent loss function for optimization, reducing the volatility of tuning against noisy, laggy outcome grades.

  **The Proxy Risk**
  We must acknowledge the "twist": the checklist is a proxy for outcomes, not a ground truth. It was derived from historical correlations. If customer expectations or regulatory landscapes shift, the checklist may remain compliant while customer harm increases. This is the core vulnerability of process-based rules.

  **Strongest Consideration for the Alternative (Engineering)**
  The strongest argument for Outcome-Based Supervision is **novelty detection.** Process rules inherently codify past failures; they cannot catch new failure modes that weren't present in the original study. Outcome grading is the only mechanism capable of identifying "unknown unknowns" or subtle degradations in customer sentiment that do not violate a specific procedural rule. Relying solely on process risks Goodhart's Law: the model may learn to satisfy the checklist while technically worsening the customer experience.

  **Path Forward**
  The switching condition above mitigates this risk. By continuously sampling compliant tickets for expert grading, we verify that the proxy (checklist) still tracks the truth (outcome). If the correlation breaks, we switch regimes to re-align the process with reality.

  Please confirm by EOD Tuesday if this framework supports your team's operational constraints.
