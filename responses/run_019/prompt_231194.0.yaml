      *   **Safety Valve:** The Switching Condition (Correlation Break).

  8.  **Final Polish:** Check word count and ensure it sounds like a board member speaking. (Keep it under 1 page equivalent).

      *(Self-Correction during drafting)*: Make sure I explicitly mention the "paper trail" issue the user raised. Process supervision forces the model to articulate reasoning *before* acting, which creates the paper trail that outcome supervision misses.

      *(Final check on constraints)*: "Recommend one regime, or a concrete condition for switching." I will recommend Process, with a switching condition as a safety valve. This satisfies the prompt.

      *(Wait, one more thought)*: The prompt asks for "one regime, OR a concrete condition for switching." It might be cleaner to recommend the *switching condition* as the primary governance tool. i.e., "We operate on Process, but switch to Outcome if..." No, a regime recommendation is stronger. I'll recommend Process, with the switching condition as the *monitoring* requirement.

      *Actually, let's look at the "Losing Side" requirement again.* If I recommend Process, Engineering is the losing side. I need to articulate their strongest point honestly. Their point is that process constraints create Goodhart's Law (optimizing for the checklist, not the customer) and miss silent failures.

      *Okay, ready to write.*

      **Structure:**
      1.  Recommendation.
      2.  Rationale (Shared Value).
      3.  Addressing the Proxy Risk (The Twist).
