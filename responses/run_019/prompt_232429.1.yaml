      *   *Specifics:* Need clear scripts for the instructor.
      *   *Mechanism:* Use a "Market Maker" (Instructor) to set initial prices to avoid stagnation.
      *   *Decision:* **The "Review Session vs. Early Dismissal" Choice.**
          *   Policy A: Stay 20 mins extra for Review Session (No early dismissal).
          *   Policy B: Leave 20 mins early (No Review).
          *   Metric: "Perceived Value of Today's Class" (1-10).
          *   *Wait, if they leave early, they can't rate it.*
          *   *Fix:* Rate before leaving.
          *   *Better Decision:* **The "Next Assignment" Choice.**
          *   Policy A: Short Essay (2 pages).
          *   Policy B: Long Quiz (50 questions).
          *   Metric: "Stress Level" (1-10) reported next class.
          *   *Problem:* Delayed resolution.
          *   *Okay, I will stick to the "Time Allocation" for the REMAINDER of today's class.*
          *   Policy A: Instructor Lecture on Advanced Topic (High Learning, Low Fun).
          *   Policy B: Group Discussion on Current Events (Low Learning, High Fun).
          *   Metric: "Learning + Fun" composite score (1-10) on exit slip.
          *   *This is the most feasible for immediate resolution.*

      *   *Wait, I need to ensure the "Futarchy" element shines.*
      *   *Key:* The market decides. The vote only chose the metric.
      *   *Let's refine the "Values Vote".*
      *   Option 1: Maximize "Learning" (Self-rated).
      *   Option 2: Maximize "Enjoyment" (Self-rated).
      *   Class votes. Suppose "Learning" wins.
      *   Market predicts "Learning Score" under Policy A vs Policy B.
      *   Higher predicted score wins.

      *   *Refining the Payoff:*
      *   To make them care about truth: They get Bonus Points based on accuracy.
      *   If you hold a share that matches the outcome, you win.
      *   Since we can't observe the counterfactual, traders on the losing policy get their money back (no profit, no loss). Traders on the winning policy profit/loss based on outcome.
      *   This creates an incentive to move the price to the *true expectation*, because if the price is wrong, you can bet against it and profit.

  8.  **Addressing the "What will go wrong" section:**
      *   Be honest. Classroom markets are terrible markets.
      *   Social pressure.
      *   Lack of liquidity.
      *   The "Counterfactual Problem" is the biggest theoretical hole in Futarchy, and this simulation *cannot* solve it, only highlight it.

  9.  **Final Review against Constraints:**
      *   20 students? Yes.
      *   90 mins? Yes.
      *   No opening lecture? Yes.
      *   Real decision? Yes (how class time is used).
      *   Paper tokens? Yes.
      *   Debrief included? Yes.
      *   Troubleshooting included? Yes.

      *(Self-Correction during drafting)*: Make sure the trading mechanism is simple enough for 20 people in 30 minutes. Continuous double auction is too complex. **Call Market** or **Instructor Market Maker** is better.
      *Decision:* **Instructor as Market Maker.** Students submit buy/sell orders. Instructor adjusts price to clear market. Or simpler: **Parimutuel.**
      *Parimutuel is easiest.* Everyone puts money in Pool A or Pool B.
      *Wait, Parimutuel doesn't generate a price probability easily for comparison.*
      *Let's use **Binary Contracts** sold by the Instructor.*
      * Instructor sells "Learning Score > 7" tickets for Policy A and Policy B.
      * Price starts at 50 cents.
      * Students buy/sell.
      * Final Price = Probability.
      * Expected Value = Price * 10 (if metric is 1-10).
      * Actually, simpler: **The market trades the *expected score* directly.**
      * Too abstract.
      * **Best approach:** Two separate markets. Each market resolves to the *Actual Score* if that policy is chosen.
      * Contract: "Pays $1 for every point of the Learning Score."
      * Price = Expected Learning Score.
      * If Policy A Price = 8.50 and Policy B Price = 6.00 -> Choose A.
      * If Actual Score = 7.
      * Policy A holders get $7 per share. (Loss of $1.50 per share).
      * Policy B holders get refunded $6.00 per share.
      * This incentivizes accurate pricing. If I think Score will be 7, but Price is 8.50, I Short A.

      *Wait, Shorting is hard with paper tokens.*
      *Limit to Long positions only.*
      *If Long only: Students will just buy the policy they *want* to win, regardless of truth.*
      *To fix this:* **Endowment Effect.** Give them tokens. They must *invest* them.
      *If they invest in the wrong prediction (Price > Actual), they lose tokens.
      *If they invest in the right prediction (Price < Actual), they gain tokens.
      *But since only one policy happens, they must diversify or guess which policy wins.*
      *This gets messy.*
      *Simpler:* **The Instructor subsidizes the accuracy.**
      * "You will be graded on the accuracy of your portfolio's implied prediction."
      * No, that's complex to calculate in real-time.
      * *Let's go with the standard Classroom Futarchy design used by Hanson/academics:*
      * **Decision:** Policy A vs Policy B.
      * **Metric:** 0-10 Score.
      * **Market:** Two prediction markets. One for A, one for B.
      * **Asset:** "Score Certificate". Pays $1 per point of final score.
      * **Trading:** Students can buy/sell from the Instructor (Market Maker).
      * **Instructor Rule:** I will adjust the price based on demand.
      * **Payoff:** At the end, if Policy A wins, A-certificates cash out at Actual Score. B-certificates are refunded at purchase price.
      * **Incentive:** If I think Actual Score will be 8, but Price is 5, I buy. If Price is 9, I sell (or don't buy).
      * **Problem:** If I want Policy A to win (because I like the policy, not the score), I might buy A-certificates to drive up the price, even if I think the score will be low.
      * **Mitigation:** Remind them: "You only make money if your prediction is *accurate*, not if your policy wins. If you drive the price to 10 and the score is 5, you lose money even if Policy A wins."
      * **Payoff:** Top 3 portfolios get Bonus Points.

      *Okay, ready to write.*

      *Wait, one more check on the Decision.*
      * "The Time Allocation" is good.
      * Policy A: **Structured Review.** (Instructor leads review of key concepts for 30 mins).
      * Policy B: **Open Workshop.** (Students work on problem sets in groups, Instructor circulates for 30 mins).
      * Metric: **"Perceived Learning Gain"** (1-10) on exit slip.
      * This is measurable immediately.

      *Wait, 90 minute timeline.*
      * If we spend 60 mins on the game, we only have 30 mins for the actual policy.
      * That works.
      * 0-15: Setup & Endowment.
      * 15-25: Values Vote (Metric).
      * 25-55: Trading (30 mins).
      * 55-60: Close & Decide.
      * 60-85: Implement Policy (25 mins).
      * 85-90: Vote/Rate & Debrief Intro.
      * *Wait, Debrief needs more time.*
      * *Compression:* Trading needs to be tighter. 20 mins.
      * *Implementation:* 20 mins.
      * *Debrief:* 15 mins.
      * *Setup:* 15 mins.
      * *Metric Vote:* 10 mins.
      * *Total:* 90.

      *Let's refine the "Payoff" to ensure it doesn't take forever to calculate.*
      * "You start with 100 FutaBucks. Your final wealth determines your participation grade."
      * 100+ = 100%
      * 120+ = 105%
      * < 80 = 90%
      * *Risk:* Students might hate this.
      * *Safer:* "Top 5 traders get a coffee card."
      * *Let's suggest the Coffee Card option to reduce anxiety.*

      *Okay, let's finalize the "What will go wrong" section.*
      * Crucial to mention the **Counterfactual Problem**. We never know if the other policy would have yielded a better score. This is the fundamental critique of Futarchy (Goodhart's Law / Metric Gaming).
      * Also **Expressive Voting/Trading**.
      * Also **Liquidity**.

      *Ready.*
answer: |-
  # Session Plan: The Futarchy Simulation
  **Course:** Institutional Design (Upper-Level Undergraduate)
  **Class Size:** 20 Students
  **Time:** 90 Minutes
  **Topic:** Futarchy (Vote on Values, Bet on Beliefs)
  **Decision:** How to allocate the remaining 25 minutes of *today's* class.

  ## I. The Decision & Metric
  To ensure the exercise is consequential but contained, the class will decide how to spend the final block of the session.

  *   **Policy A (Structured Review):** The instructor leads a high-density review of the last three weeks of material. (High information transfer, low interaction).
  *   **Policy B (Open Workshop):** Students break into groups to work on the upcoming problem set; the instructor circulates for questions. (High interaction, variable information transfer).
  *   **The Metric:** **"Perceived Learning Gain."** At the end of the session, every student anonymously submits a rating from 1–10 on a slip of paper. The **Average Score** is the realized metric.

  ## II. Materials Needed
  *   **FutaBucks:** 20 envelopes, each containing $1,000 in play money (mix of $10, $50, $100 bills).
  *   **Asset Certificates:** Pre-printed slips labeled "Policy A Share" and "Policy B Share."
  *   **Whiteboard:** To display current market prices.
  *   **Exit Slips:** Small pieces of paper for the final metric vote.
  *   **Prizes:** 3 Coffee Shop Gift Cards ($10 each) or equivalent bonus points on participation.

  ## III. Minute-by-Minute Timeline

  ### Phase 1: Setup & Endowment (0:00 – 0:15)
  *   **0:00–0:05:** **Introduction.** Do not mention "Futarchy," "Prediction Markets," or "Hanson."
      *   *Script:* "Today, we are going to govern ourselves. We have a decision to make about how to use the end of this class. We will use a specific procedure to make this decision. Your goal is to maximize your personal portfolio value. The top three portfolios at the end of the hour will win a prize."
  *   **0:05–0:10:** **Distribution.** Hand out envelopes ($1,000 each). Explain the asset.
      *   *Script:* "You can buy shares in Policy A or Policy B. A share pays out $1 for every point of the final 'Learning Gain' average. If the average score is 8, a share is worth $8. If the average is 4, it is worth $4."
  *   **0:10–0:15:** **The Values Vote.**
      *   *Script:* "Before we trade, we must agree on what we are measuring. I propose we measure 'Learning Gain.' Are there other objections? (Take brief suggestions, e.g., 'Enjoyment'). Let's vote: Who prefers 'Learning Gain'? Who prefers 'Enjoyment'?"
      *   *Action:* Majority wins. (Assume "Learning Gain" wins for this plan). Write the metric on the board.

  ### Phase 2: The Conditional Market (0:15 – 0:45)
  *   **0:15–0:20:** **Market Rules.**
      *   *Script:* "There are two separate markets: one for Policy A, one for Policy B. I am the Market Maker. I will set a price. You can buy or sell at that price. Every 5 minutes, I will adjust the price based on demand. **Crucial Rule:** Only the policy that *wins* the election will pay out. Shares in the losing policy will be refunded at their purchase price. You profit only if you accurately predict the score of the *winning* policy."
  *   **0:20–0:40:** **Trading Rounds (3 Rounds x 5 mins + 5 mins buffer).**
      *   *Round 1:* Instructor sets initial price at $5.00 for both. Students trade.
      *   *Round 2:* Instructor adjusts prices based on order flow (e.g., if everyone buys A, raise Price A to $6.50).
      *   *Round 3:* Final price discovery.
      *   *Instructor Role:* Actively call out prices. "Price A is $6.00, Price B is $5.50. Who wants to sell A? Who wants to buy B?" Encourage volume.
  *   **0:40–0:45:** **Market Close & Decision.**
      *   Calculate the final closing price for A and B.
      *   *Script:* "The market has spoken. Price A represents the expected Learning Gain if we do Review. Price B represents the expected Learning Gain if we do Workshop. The higher price wins."
      *   Announce the winning policy. Collect all shares of the *losing* policy and refund the cash immediately (to show the rule is real).

  ### Phase 3: Implementation (0:45 – 1:10)
  *   **0:45–1:10:** **Execute the Policy.**
      *   If **Policy A wins:** Instructor lectures/reviews for 25 minutes.
      *   If **Policy B wins:** Students break into groups for problem sets; instructor circulates.
      *   *Note:* This must be done authentically. Do not break character.

  ### Phase 4: Resolution & Debrief (1:10 – 1:30)
  *   **1:10–1:15:** **Metric Collection.**
      *   Hand out exit slips. Students rate "Learning Gain" (1–10). Collect and calculate the average publicly.
  *   **1:15–1:20:** **Payoff Calculation.**
      *   Announce the Average Score (e.g., 7.5).
      *   Students holding shares in the *winning* policy calculate their wealth: `Cash Remaining + (Shares * 7.5)`.
      *   Identify the top 3 portfolios. Award prizes.
  *   **1:20–1:30:** **The Debrief (The Lecture).**
      *   Now introduce the vocabulary.
      *   **Separation of Values/Beliefs:** "The initial vote chose the *metric* (values). The market chose the *policy* (beliefs about cause and effect)."
      *   **Information Aggregation:** "Did the final price match the actual score? If Price was 7.5 and Score was 7.5, the market was efficient."
      *   **The Counterfactual Problem:** "We know the score for the winner. We will *never* know the score for the loser. This is the fundamental weakness of futarchy in the real world."
      *   **Incentives:** "Did anyone trade to make their preferred policy win, rather than to predict the truth? How did that affect the price?"

  ## IV. Rules & Payoff Scheme (Handout)

  **1. The Asset**
  *   A "Policy Share" is a contract.
  *   If that Policy is **chosen**, the share pays **$1 × (Average Class Rating)**.
  *   If that Policy is **rejected**, the share is **refunded** at the price you paid. You make $0 profit, but lose nothing.

  **2. The Incentive**
  *   You want the market price to be *accurate*, not just high.
  *   *Example:* If the market price for Policy A is $9.00, but you think the Rating will only be 5.00, do not buy! If you buy at $9 and the score is 5, you lose $4 per share.
  *   *Profit Strategy:* Buy shares when Price < Your Prediction. Sell (or don't buy) when Price > Your Prediction.

  **3. The Payoff**
  *   **Top 3 Portfolios:** $10 Coffee Card (or 0.5% Bonus on Final Grade).
  *   **Bottom 3 Portfolios:** No penalty (to reduce anxiety), but public acknowledgment of "Market Loss."

  ## V. Troubleshooting: What Will Go Wrong
  Be prepared for these specific failure modes. They are not bugs; they are features of the debrief.

  **1. Expressive Trading (The "Fan" Problem)**
  *   **Failure:** Students buy shares in the policy they *want* to happen, ignoring the likely score. They drive the price of their favorite policy up artificially.
  *   **Result:** The market chooses the popular policy, not the effective one.
  *   **Instructor Fix:** During trading, announce: "Remember, if you drive the price to $10 and the score is 4, you lose money even if your policy wins. Are you betting on *winning* or betting on *truth*?"
  *   **Debrief Point:** This highlights the difficulty of separating preferences from beliefs. In real futarchy, large ideological donors could manipulate markets.

  **2. Thin Markets (Liquidity Crisis)**
  *   **Failure:** Students are shy. No one trades. Prices stay at the Instructor's starting $5.00.
  *   **Result:** The decision is effectively random or instructor-determined.
  *   **Instructor Fix:** Seed the market. "I am willing to sell 10 shares of Policy A at $4.00 right now. Who thinks the score will be higher than 4?" Create artificial volume to break the ice.
  *   **Debrief Point:** Prediction markets require liquidity to function. Small polities (like a class) may not have enough diverse information to generate accurate prices.

  **3. Metric Gaming (Goodhart's Law)**
  *   **Failure:** During the Values Vote, a student suggests a metric that is easy to maximize but meaningless (e.g., "Number of smiles").
  *   **Result:** The class votes for the "easy" metric. The market accurately predicts a high score, but the class learns nothing.
  *   **Instructor Fix:** Allow this to happen if possible. It is a powerful lesson. If it threatens the whole exercise, use instructor veto: "That metric is not measurable within the session."
  *   **Debrief Point:** This is the strongest critique of futarchy. If you vote on the metric, you will vote for a metric you can game. Who guards the guardians of the metric?

  **4. The Counterfactual Blindness**
  *   **Failure:** The class realizes after the fact that the losing policy would have been better.
  *   **Result:** Loss of faith in the system.
  *   **Instructor Fix:** Acknowledge this explicitly. "We cannot know. That is the risk of all governance."
  *   **Debrief Point:** Futarchy does not solve the problem of unknown unknowns. It only aggregates *known* information.

  ## VI. Limitations of the Simulation
  Be frank with your students about what this exercise *cannot* show them:

  1.  **Stakes:** In this game, the most they lose is a coffee card. In real governance, bad policy causes war or famine. High stakes usually improve market accuracy (more skin in the game), but also increase manipulation incentives.
  2.  **Repetition:** This is a one-off. Real futarchy relies on repeated interactions to build reputation and punish manipulators.
  3.  **Metric Stability:** In the real world, the "metric of success" (e.g., GDP) is hard-coded for long periods. Here, you voted on it in 5 minutes. The real danger of futarchy is that the metric itself becomes the battleground for long-term strategic manipulation, which this game glosses over.
  4.  **Information Asymmetry:** In this class, everyone roughly knows the same amount. Real markets work because insiders trade against outsiders. Without insider information, this is just a group guess.

  ## VII. Instructor Script for the "Reveal" (Start of Debrief)
  *"For the last hour, you were practicing **Futarchy**. You just experienced Robin Hanson's proposal: 'Vote on Values, Bet on Beliefs.'*

  *When you voted on 'Learning Gain' vs 'Enjoyment,' that was the **Values** component. That is democratic.*
  *When you traded shares to set the price, that was the **Beliefs** component. That was epistocratic (rule by knowledge).*
  *The tension you felt—between wanting your favorite policy to win and wanting to make money on the truth—is the central tension of the system. If you couldn't separate those two impulses, the market failed. If you did, the market worked.*

  *Now, look at the final price vs. the actual score. Was the market right? If not, why? Was it manipulation? Or was it just that none of us actually knew the future?"*
