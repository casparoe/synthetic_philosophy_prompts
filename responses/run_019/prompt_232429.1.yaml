      *   *Collusion:* Students agreeing to pump a price.
      *   *Expressive Trading:* Betting on what they *want*, not what they *think*.
      *   *Thin Markets:* No trading activity.
      *   *Metric Gaming:* Choosing a metric that is easy to maximize but meaningless.
      *   *Limitations:* One-off vs. Repeated, Low Stakes.

