      *   Pool B: Bets on Metric Outcome if Policy B chosen.
      *   *Wait, Futarchy compares E[Metric|A] vs E[Metric|B].*
      *   *Simpler Mechanism:* **Prediction Shares.**
      *   Asset A: Pays $1 if Metric > Threshold, given Policy A.
      *   Asset B: Pays $1 if Metric > Threshold, given Policy B.
      *   *Problem:* Only one policy happens. We can't observe the counterfactual.
      *   *Futarchy Problem:* We never know the counterfactual.
      *   *Classroom Fix:* We must simulate the counterfactual or acknowledge the limitation.
      *   *Standard Classroom Fix:* We run the market to decide. We implement the winner. We pay traders based on the *realized* metric of the *implemented* policy. Traders who bet on the *other* policy? Their bets are voided or refunded?
      *   *Hanson's Rule:* Bets on the unchosen policy are refunded. Bets on the chosen policy stand.
      *   *Incentive:* If I think Policy A is better, I buy Asset A. If the market price of A > Market Price of B, Policy A is chosen. If A is chosen, I want the metric to be high. So I bet on High Metric given A.
