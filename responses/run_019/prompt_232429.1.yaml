          4.  Market Price = Expected Rating.
          5.  Decision: Choose Policy with Higher Market Price.
          6.  Resolution: Implement Policy. Collect Rating. Pay out traders in the *chosen* market. Refund traders in the *unchosen* market.
      *   *Incentive Compatibility:* If I know Policy A leads to low rating, I short A (or don't buy). If the price is too high, I short. This pushes price to truth.
      *   *Currency:* "Course Credits" (fake).
      *   *Real Payoff:* Top 3 traders get a small real prize (candy/coffee) or 0.5% bonus on final grade (if permissible). Let's stick to **Bonus Points on Participation Grade**. It's safe and meaningful.

