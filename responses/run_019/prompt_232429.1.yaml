      *   *Example:* If you bought shares in "High Score" and the Score is High, you win.
      *   *Incentive:* You want the market price to reflect the truth so you can bet against errors.
      *   *Currency:* Paper chips.
      *   **Market Maker:** The Instructor.
      *   **Mechanism:** Parimutuel? Or Continuous Double Auction?
      *   *Simplification for 90 mins:* **Parimutuel Betting Pools.**
