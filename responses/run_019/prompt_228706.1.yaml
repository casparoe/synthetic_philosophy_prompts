answer: |-
  Here is a pedagogical plan for a ninety-minute seminar on the *Cogito*.

  ### I. The Explanatory Arc and Formulation Choice

  **The Core Choice: Performance over Inference**
  You must present the *Cogito* as a **performative intuition** rather than a syllogistic inference.
  *   **The Formulation:** Do not write *Cogito, ergo sum* on the board as a premise-conclusion structure. Instead, frame it as: *"Attend to the act of doubting; notice that the doubting cannot occur without the existence of the doubter."*
  *   **Why:** If you present it as an inference (Major: All thinkers exist; Minor: I think; Conclusion: I exist), you invite the "circularity" objection immediately (How do you know the major premise is true without already knowing you exist?). The performative reading bypasses the need for a hidden major premise. The truth is grasped in the *doing*, not the deriving.
  *   **The Cost:** You lose the comfort of formal logic. Students who want to symbolize the argument will feel unmoored. You must compensate by making the *experience* of the argument vivid.
  *   **What it must have:** A first-person, present-tense focus. It must happen *now*, in the room.
  *   **What it must lack:** Any reference to the past or future (persistence), and any reference to the nature of the "I" beyond "thing doing this thinking."

  **The Sequence (90 Minutes)**

  1.  **The Broom, Not the House (0:00–0:20):** Methodological Doubt.
      *   **Goal:** Distinguish skepticism as a lifestyle (Pyrrhonian) from skepticism as a tool (Cartesian).
      *   **Key Distinction:** Psychological inability to doubt vs. Epistemic security.
      *   **Activity:** Ask students to doubt the existence of the table. They can say the words, but they don't *feel* doubt. Now ask them to doubt a complex math equation they barely understand. They can feel that doubt. The *Cogito* requires finding something where psychological inability and epistemic security coincide.
  2.  **The Event (0:20–0:55):** The *Cogito* Proper.
      *   **Goal:** Execute the performative argument.
      *   **Activity:** Guide a "live" meditation. "Close your eyes. Assume the demon is deceiving you about everything. Now, try to doubt that you are being deceived."
      *   **Pivot:** When they realize they can't doubt the deception without existing to be deceived, stop. Do not move to "what" they are yet.
  3.  **The Scope and Limits (0:55–1:20):** What the "I" Is (and Isn't).
      *   **Goal:** Contain the conclusion.
      *   **Focus:** The "I" is a "thinking thing" (*res cogitans*), but this is a grammatical placeholder for "whatever is doing this thinking," not a proof of a soul, a brain, or a persisting entity.
  4.  **Assessment and Wrap (1:20–1:30):** Check for Understanding.

  ---

  ### II. Misconception Mapping

  Do not wait for these to arise; structure the lecture to inoculate against them in this specific order.

  | Misconception | When it Surfaces | Prevention Strategy (Head Off) | Correction Strategy (If it breaks out) |
  | :--- | :--- | :--- | :--- |
  | **1. The "Therefore" Trap**<br>*(It's a standard syllogism)* | **Phase 2 (The Event).** As soon as you write *ergo*. | **Do not write *ergo*.** Use phrasing like "This truth is so firm... that I cannot shake it." Frame it as a recognition, not a deduction. | If they insist on premises, ask: "Did you need to know 'All thinkers exist' before you knew *you* exist?" Show the priority of the particular over the general. |
  | **2. The Smuggled "I"**<br>*(You presuppose the self to prove the self)* | **Phase 2 (The Event).** Immediately after the "prevention" above. | Emphasize the **indexical** nature. The "I" isn't a concept brought to the table; it is revealed by the thought itself. "Thinking is happening" implies "A thinker is here." | Use the "Fire" analogy: You don't need a theory of combustion to know fire is burning. The burning reveals the fire. The thinking reveals the thinker. |
  | **3. The Persisting Self**<br>*(I existed yesterday/I will exist tomorrow)* | **Phase 3 (The Scope).** When defining the "I". | Explicitly restrict the conclusion to the **specious present**. "You only know you exist *while* you are thinking this." | Ask: "If you fall asleep dreamlessly, does the *Cogito* guarantee you still exist?" (Answer: Not on this basis alone). |
  | **4. The Immaterial Soul**<br>*(This proves dualism)* | **Phase 3 (The Scope).** When students ask "So I'm a ghost?" | Strictly define *res cogitans* as "thing that thinks," not "non-physical substance." Acknowledge brains think. The argument doesn't rule out materialism yet. | Remind them: "We have only established that thinking is happening. We haven't established *what* is thinking. That comes later (if at all)." |
  | **5. The Bridge to the World**<br>*(If I'm certain, the world is certain)* | **Phase 4 (Wrap).** As they leave the room. | Explicitly state: "You are now certain you exist. You are *not* certain the chair exists." The *Cogito* is an island, not a continent. | Remind them of the Evil Demon. The Demon can still fake the world; he cannot fake *you* being faked. |

  ---

  ### III. Check for Understanding

  Do not ask: "What does the *Cogito* prove?" (They will recite the slogan).
  Do not ask: "Is the argument valid?" (They will debate logic).

  **The Diagnostic Question:**
  > "Descartes is sitting in a room. He thinks, 'I exist.' Then he gets distracted by a noise and stops thinking about his existence for five minutes. During those five minutes, based *only* on the *Cogito* argument we just discussed, is Descartes certain he still exists?"

  *   **Correct Answer:** No (or at least, not on the basis of the *Cogito* alone). The certainty is tied to the *act* of thinking.
  *   **What this reveals:** If they say "Yes," they have slipped into the "Persisting Self" misconception. They view the *Cogito* as a one-time proof of a permanent substance rather than a recurring intuition of a present activity.

  ---

  ### IV. Principled Exclusions

  You must omit the following. This is not laziness; it is scope management to prevent category errors.

  1.  **The Wax Argument:**
      *   *Why omit:* It concerns the nature of *bodies* and perception. Introducing it now confuses the *sum* (existence) with the *res* (nature of the thing). It tempts students to think the *Cogito* relies on sensory abstraction.
  2.  **The Trademark Argument / Proof of God:**
      *   *Why omit:* Descartes needs God to guarantee clear and distinct perceptions generally and to bridge the gap to the external world. However, the *Cogito* is supposed to stand *before* God is proved. Bringing God in now makes the *Cogito* look dependent on theology, reigniting the "circularity" charge.
  3.  **Mind-Body Dualism:**
      *   *Why omit:* The *Cogito* establishes that I am a thinking thing. It does not yet establish that I am *only* a thinking thing (that I have no body). Conflating "I am a thinker" with "I am not a body" is the biggest leap students make. Keep them agnostic on the body for this session.
  4.  **Later Reception (Nietzsche, Wittgenstein, etc.):**
      *   *Why omit:* First-years need to know what Descartes thought before they learn why he was wrong. Critique comes in Seminar 2.

  ---

  ### V. Interpretive Transparency & Confidence

  Since you are teaching a contested argument, you must be transparent about where this plan takes a stance.

  **1. The Performative Reading (Hintikka vs. Discursive)**
  *   **The Choice:** This plan leans heavily on the Jaakko Hintikka interpretation (1962) that the *Cogito* is a performative consistency ("I think" is self-verifying) rather than a suppressed syllogism.
  *   **Confidence:** **High.** Pedagogically, this is the only way to make the argument work for beginners without getting bogged down in scholastic logic they don't possess. Even if Descartes *intended* a syllogism (debated), the performative reading captures the *phenomenological force* required for the Meditations to work.
  *   **Risk:** You may be accused of anachronism by strict textualists.
  *   **Mitigation:** Tell students: "Some scholars read this as logic; we are reading it as an experience. The experience is what matters for the next step."

  **2. The "Momentary" vs. "Persisting" Self**
  *   **The Choice:** The plan insists the *Cogito* only guarantees existence *during* the thought.
  *   **Confidence:** **Medium-High.** Textually, Descartes wants a persisting self. However, the *argument itself* only yields the momentary truth.
  *   **Risk:** Students may feel this makes the conclusion trivial ("I exist only when I think of it?").
  *   **Mitigation:** Acknowledge that Descartes *wants* more, but emphasize that *this specific argument* only buys the moment. This sets up the need for the memory/God arguments later (which you are excluding, but you can hint that "more work is needed").

  **3. The Weakest Link: Psychological vs. Epistemic Certainty**
  *   **The Choice:** The plan relies on distinguishing "I can't help but believe this" (Psych) from "This cannot be false" (Epi).
  *   **Confidence:** **Low.** This is the hardest philosophical distinction for first-years. They often conflate conviction with truth.
  *   **Why it's weak:** A determined skeptic can always say, "I am psychologically compelled to believe 2+2=4, but the Demon could still make it false."
  *   **Mitigation:** Do not try to solve global skepticism here. Admit the limitation: "The *Cogito* is the *one place* where psychological compulsion tracks truth. We are not claiming this works for physics or ethics." If you try to justify *why* it tracks truth without God, you will lose the room. Keep it brute: "Try to doubt it. You can't. That's the data."

  ### Summary of Instructor Posture
  Your role is not to defend Descartes' entire system, but to isolate the *Cogito* as a specific methodological move. You are teaching them how to use a tool, not how to build the whole house. If they leave understanding that the *Cogito* is a limit of doubt rather than a proof of a soul, you have succeeded.
