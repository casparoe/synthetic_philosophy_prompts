  1. Sequencing
  Before posing the puzzle, ensure students grasp the distinction between causal and evidential expected utility. Since they know Newcomb's, briefly refresh the tension: EDT one-boxes, CDT two-boxes. Do not linger on the solution. Instead, establish that in Newcomb's, CDT still identifies a dominant strategy (two-boxing), even if it yields less money. Death in Damascus must follow immediately to show a case where CDT fails to identify *any* stable strategy. The sequence depends on this contrast: Newcomb shows a conflict between theories; Death shows a conflict within a theory (instability). If you discuss Newcomb too deeply, they will try to solve Death using Newcombian tactics. Keep the Newcomb refresh to five minutes max, focusing solely on the structure of prediction versus causation. The core prerequisite is understanding that rational choice typically assumes there is *some* option maximizing utility. Your tutorial challenges that assumption. Establish the norm before presenting the exception. Ensure they understand that in standard decision theory, deliberation terminates. In Death, deliberation undermines the conclusion. This dependency is vital: without the expectation of termination, the paradox loses its bite.

  2. The carrying example
  Use the original Death story. The supernatural element is a feature; it guarantees infallibility without requiring cumbersome technological explanations that invite skepticism about mechanism. A human forecaster invites questions about accuracy rates; Death represents logical necessity. The telling must contain the specific detail that Death has already left to prepare the appointment. This ensures the causal link is severed; the man's travel cannot causally influence Death's location. It must lack any third option, such as hiding or fighting, to force the binary dilemma. Atmospheric details like the "appointment" help convey the inevitability, mirroring the inevitability of the logical trap. Do not abstract too early. The narrative stakes motivate the search for a rational exit. Low stakes reduce the crisis of agency. Present the story vividly first, then formalize. The dread ensures they feel the pressure of needing a rational plan where none exists. Emphasize that the prediction is based on the man's deliberation process itself. This reflexive element is key. If you use a computer predictor, students might wonder about input data. Death knows via metaphysical fiat, closing loopholes. Keep the focus on the agent's knowledge of the prediction, not the mechanism of prediction.

  3. The misconception map
  First, expect the claim that the setup is contradictory. Head this off immediately by framing it as a modal possibility, like Newcomb's. Insist we are evaluating rationality *given* the setup is possible. Second, students will suggest randomization (flipping a coin). Address this after the initial instability is felt. Explain that if Death predicts mixed strategies, the expected utility of the mix also collapses. Do not let this distract from the primary lesson: pure strategy instability. Third, and most persistent, is the assumption that this is just Newcomb's problem. Address this during the comparison phase. In Newcomb's, CDT says "two-box" is rational despite the loss. In Death, CDT says "stay" implies Death is there, so "go," but "go" implies Death is there, so "stay." There is no dominant option. Show that Newcomb has a stable causal expectation, whereas Death creates a feedback loop where the expectation changes based on the tentative choice. Interrupt the discussion whenever they try to apply dominance reasoning directly. Also, watch for the idea that the man can simply "choose not to choose." Clarify that inaction is effectively staying in Damascus. The goal is to show that every *act* is self-undermining. When they suggest randomization, ask: "Does Death predict coin flips?" If yes, the problem returns. If no, you've changed the case. Keep the pressure on the infallibility constraint. This ensures they confront the theoretical limit of decision theory rather than engineering a workaround. The order matters: possibility first, then Newcomb distinction, then randomization as a failed salvage attempt.

  4. The check for understanding
  Ask: "If the man decides to stay, what evidence does he have about Death's location, and does that decision remain rational upon reflection?" The correct answer should highlight that deciding to stay provides evidence Death is in Damascus, making the decision irrational upon reflection. This shows they grasp the concept of ratifiability or deliberative instability, not just the plot. If they answer merely "he dies," they have missed the normative threat. You want them to see that rationality requires a stable equilibrium between choice and expectation, which this case denies. It tests conceptual grasp.

  5. Deliberate omissions
  Omit formal treatments of ratifiability theory (Skyrms, Joyce) and causal graph diagrams. These are technical solutions to the problem you are presenting as a problem. Mentioning them suggests there is a settled answer. Say aloud: "We are stopping at the dilemma itself, not the technical fixes developed later." Also, leave out detailed game-theoretic mixed strategy equilibria. Tell them: "Today is about the breakdown of standard choice, not the repair." Avoid discussing whether EDT solves it; that muddies the water regarding CDT's instability. Keep the focus on the phenomenological experience of deliberation failing. This preserves the puzzle's intensity.
