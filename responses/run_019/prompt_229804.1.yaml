prompt: |-
  I'm trying to work out what principle, if any, is actually doing the work in my intuitions about omnipotence, and I want an account precise enough to test against new cases. My verdicts so far:

  - A being that cannot make 2+2 equal 5, or cannot make a round square, is still omnipotent; I don't think omnipotence includes doing the impossible.
  - A being that cannot create a stone it cannot lift is still omnipotent; as soon as we say the being is omnipotent, 'a stone an omnipotent being cannot lift' describes an impossible object.
  - A being that can bring about any logically possible state of affairs except one trivial one — say, making a particular leaf fall at noon rather than a second later — is not omnipotent, even though the excepted state of affairs is possible and harmless.
  - A being that cannot lie, even under extreme pressure, is still omnipotent; I read that inability as a kind of strength rather than a gap in power.
  - A being that cannot make itself evil, or cannot abandon its perfect goodness, is still omnipotent.
  - A being that can do everything logically possible but cannot make a creature that both has genuine free will and is guaranteed never to do wrong is still omnipotent, because that combination is impossible.

  I cannot yet see whether one coherent account of omnipotence delivers all six. Please give me the best candidate principle (or a small set of candidates with what each buys), state explicitly what 'possible,' 'limitation,' or 'essential nature' has to mean for each clause to do its work, and tell me honestly which of my verdicts any plausible principle cannot accommodate. Then apply the resulting account to the case I keep going back and forth on: a being that can do everything logically possible except that it cannot choose the second-best option whenever a best option is available. Is that being omnipotent, or does the appeal to 'essential perfection' just collapse into whatever limits I happen to like? Finally, separate what is broadly settled from what is genuinely contested in this area, and flag any point where your proposed principle is a contested move rather than the standard view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** Identify the underlying principle governing their intuitions about omnipotence.
      *   **Requirement:** The account must be precise enough to test against new cases.
      *   **Input Data (Verdicts):**
          1.  Logical impossibilities (2+2=5, round square) $\rightarrow$ Not a limit on omnipotence.
          2.  Paradox of the Stone $\rightarrow$ Not a limit (impossible object).
          3.  Arbitrary limitation (one specific leaf) $\rightarrow$ *Is* a limit (not omnipotent).
          4.  Moral inability (cannot lie) $\rightarrow$ Not a limit (strength).
          5.  Essential nature inability (cannot become evil/abandon goodness) $\rightarrow$ Not a limit.
          6.  Free Will/Goodness incompatibility $\rightarrow$ Not a limit (logically impossible combo).
      *   **Test Case:** A being that can do everything logically possible *except* it cannot choose the second-best option whenever a best option is available. (Is this omnipotent?)
      *   **Additional Requirements:**
          *   Define 'possible', 'limitation', 'essential nature'.
          *   Admit which verdicts might not fit.
          *   Distinguish settled vs. contested views.
          *   Flag where the proposed principle is contested.

  2.  **Evaluate the User's Intuitions:**
      *   The user aligns closely with the **Classical Theistic / Aquinian / Descartes-modified** tradition, specifically the *Logical Possibility* view, but with a strong emphasis on *Essential Nature* constraints not counting as limitations.
      *   Verdicts 1, 2, 6 are standard "Logical Possibility" constraints.
      *   Verdict 3 is crucial: It rules out "Almost Omnipotence." Omnipotence requires *maximal* power, not just *a lot* of power.
      *   Verdicts 4, 5 introduce the concept of *Perfection* or *Essential Attributes*. Inabilities rooted in perfection (goodness) are not deficiencies.

  3.  **Identify Candidate Principles:**
      *   *Candidate A: Pure Logical Possibility (Descartes/Hobbes).* Can do anything logically possible.
          *   *Problem:* Struggles with Verdict 4 & 5. If God *can* lie but chooses not to, that's one thing. If God *cannot* lie, is that a limit? Pure logical possibility usually says yes, unless qualified.
      *   *Candidate B: Essential Nature / Perfection Constraint (Aquinas/Anselm).* Omnipotence means the power to bring about any state of affairs that is *possible in itself* (logically consistent) and *compatible with the being's essential nature*.
          *   *Fit:* Handles 1, 2, 6 (logical consistency). Handles 4, 5 (essential nature). Handles 3 (if the leaf thing isn't required by nature, it's a limit).
      *   *Candidate C: Maximal Power (Plantinga).* A being is omnipotent if it has the maximum amount of power it is logically possible for a being to have.
          *   *Fit:* Good for 3. Needs work on 4 & 5.

      *   *Best Fit:* **The Essential Nature + Logical Possibility Account.** (Often associated with Aquinas, refined by contemporary philosophers like Plantinga or Leftow).
      *   *Refinement:* We need to distinguish between *inability due to lack of power* vs. *inability due to perfection/nature*.

  4.  **Drafting the Principle:**
      *   *Definition:* A being $X$ is omnipotent iff $X$ can bring about any state of affairs $S$ such that:
          1.  $S$ is logically possible.
          2.  $S$ is not incompatible with $X$'s essential nature (specifically, essential perfections).
          3.  $X$'s inability to bring about $\neg S$ (where $S$ is a perfection) is not a lack of power but a consequence of $X$'s maximal greatness.
      *   *Wait, Verdict 3 is tricky.* If the leaf falling is logically possible and compatible with nature, why is the inability a limit? Because omnipotence implies *all* compatible powers, not *most*.
      *   *Revised Principle:* Omnipotence is the maximal compossible set of powers.
      *   *Let's try the "State of Affairs" formulation:* $X$ is omnipotent iff for every logically possible state of affairs $p$, if it is possible for $X$ to bring about $p$ (given $X$'s nature), $X$ can bring about $p$.

  5.  **Addressing the Test Case (The Second-Best Option):**
      *   *Case:* Cannot choose second-best when best is available.
      *   *Analysis:* Is this a logical impossibility? No. Is it a limitation of power? Or is it a feature of Perfect Rationality/Goodness?
      *   *If* the being is essentially Perfectly Good/Rational, it *necessarily* wills the good. Choosing the "second-best" (sub-optimal) might be deemed irrational or imperfect.
      *   *If* the inability stems from *perfect rationality*, it fits Verdict 4 & 5 (cannot lie/cannot be evil).
      *   *If* the inability is just a brute constraint (like "cannot pick the red pill"), it fits Verdict 3 (arbitrary limit).
      *   *Decision:* This hinges on whether "choosing sub-optimally" is a *power* or a *defect*. Most classical theists say it's a defect. So the being *is* omnipotent. But this risks the "collapse" worry the user mentioned.

  6.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Logical impossibilities (2+2=5) aren't limits. (Almost everyone agrees).
      *   *Contested:* Whether moral constraints (cannot lie) are limits. (Descartes says God could make 2+2=5 and could lie; Aquinas says no).
      *   *Contested:* The definition of "State of Affairs."
      *   *Contested:* Whether "Essential Nature" is a legitimate escape clause or special pleading.

  7.  **Structure of the Response:**
