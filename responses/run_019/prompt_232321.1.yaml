answer: |-
  You press me upon the very hinge upon which my philosophy turns, and I shall not evade the force of your question. It is a charge often leveled by those who mistake the ultimate end of government for its immediate instrument. You cite the principle I hold most dear: that liberty is the only true goal of human association, and that coercion is justified only to prevent harm to others. You ask how I reconcile this with the governance of India, where millions are subject to a power they did not choose, justified by a claim of their own improvement.

  I answer you plainly: there is no contradiction, provided one understands that liberty is not a universal solvent applicable to every stage of human development. I have written, and I maintain, that the principle of liberty applies only to human beings in the maturity of their faculties. We are not speaking of children, nor of those backward societies where the race itself is in its nonage. Despotism is a legitimate mode of government in dealing with barbarians, provided the end be their improvement, and the means justified by actually effecting that end.

  You ask why this paternalism is permissible in Bengal but not in Bethnal Green. The distinction lies not in the inherent worth of the soul—for I hold all men capable of progress—but in the historical and social conditions necessary for liberty to function as a good rather than a destructive chaos.

  Consider the poor Englishman. He is uneducated, perhaps impoverished, and vulnerable to exploitation. Yet, he lives within a constitution that recognizes his rights. He is part of a public sphere where discussion is free, where laws are debated, and where the machinery of representation, however imperfect, allows for his eventual inclusion. To deny him liberty on the grounds of his poverty would be to condemn him to permanent stagnation. His liberty is the very tool by which he raises himself. To treat him as a ward is to crush the faculty of self-help, which is the essence of utility.

  Now consider the condition of India. It is not merely a collection of impoverished individuals; it is a society organized upon principles fundamentally hostile to the spirit of liberty. It is a land of custom, not contract; of caste, not citizenship. To impose immediate representative government upon such a soil would not be to grant freedom, but to invite anarchy or the tyranny of local despots. The Indian subject, in his current state of civilization, lacks the collective capacity to sustain the institutions of liberty.

  Therefore, British rule is not an end in itself; it is a trusteeship. It is a temporary despotism employed to create the conditions under which despotism becomes unnecessary. We bring order, we bring the rule of law, we bring security of property and the suppression of cruel customs. We do this not to keep India in perpetual subjection, but to educate them in the habits of obedience to law so that they may eventually learn the habits of self-government.

  You suggest I should be embarrassed by this line. I am not. To refuse to govern a people because they are not yet fit to govern themselves is not kindness; it is abandonment. It is to sacrifice their real good—their security, their progress, their future capacity for liberty—to a abstract dogma of consent they are not yet equipped to exercise.

  The East India Company, for all its faults, understood this. We were not politicians seeking votes, but administrators seeking improvement. We ruled without consent because consent was impossible, but we ruled for their benefit, judged by the standard of utility. If the Parliament now seeks to dissolve the Company, I fear they do so not to liberate India, but to subject it to the fluctuating passions of British party politics. That would be a true harm.

  So, I draw my line here: Liberty is the rule for those capable of it; tutelage is the rule for those who are not. The poor Englishman is capable; the Indian society, as it stands, is not. To confuse the two is to misunderstand the history of mankind and the true requirements of human improvement. I stand by that distinction.
