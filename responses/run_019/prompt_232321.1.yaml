      *Specific focus:* The East India Company. Mill wrote memoranda defending the Company. He sees the Company as a shield against the British public's ignorance. I should mention that.

      *The Poor Englishman:* Mill believed in education and gradual enfranchisement for the working class, but they were still part of the *national* conversation. Indians were not. The distinction is societal maturity.

