answer: |-
  # Joint Statement on Provenance, Perception, and Artistic Value

  **Signatories:**  
  The Provenance-Theorist (PT)  
  The Perceptualist (P)  

  **Date:** October 26, 2023  
  **Context:** Following a structured adversarial collaboration regarding the ontology of art and the supervenience of artistic value.

  ---

  ### 1. Agreed Claims

  We, the undersigned, acknowledge that while our metaphysical accounts of art differ, we converge on the following empirical and normative claims. We commit to ceasing the use of arguments we now recognize as untenable.

  1.  **The Reality of the "Debunking Effect":** We agree that when a work is conclusively proven to be a forgery, its market value typically collapses, and institutional treatment changes (e.g., removal from main galleries to study collections). We agree this is a stable sociological fact, regardless of whether we attribute it to the loss of *artistic* value (PT) or the loss of *historical credibility* and *scarcity* (P).
  2.  **Instrumental vs. Intrinsic Valuation:** We agree that the Original possesses unique *instrumental* value as a historical document and a causal link to a specific cultural moment. The Perceptualist acknowledges that preferring the Original for the sake of historical evidence or social coordination is not inherently irrational "fetishism." The Provenance-Theorist acknowledges that not all price premium attached to an Original is a recognition of artistic merit; some is rightly categorized as collectible scarcity or investment value.
  3.  **Abandonment of "Magic" and "Snobbery":** 
      *   **PT Concession:** We abandon the claim that the Original possesses a metaphysical "aura" or invisible energy that physically distinguishes it from a perfect duplicate. We agree that if a duplicate is molecule-for-molecule identical, the difference lies entirely in relational/historical facts, not intrinsic physical properties.
      *   **P Concession:** We abandon the claim that concern for provenance is *merely* status-seeking or snobbery. We acknowledge that human beings often value artifacts as traces of human agency, and that this desire can be sincere without being strictly aesthetic.
  4.  **The Role of Intention:** We agree that knowledge of an artist's intention can alter the *experience* of a work (e.g., knowing a brushstroke was a deliberate act of defiance vs. an accident). We disagree on whether this alteration constitutes a change in the *work's value* or merely a change in the *viewer's psychological state*.

  ---

  ### 2. Disagreements Table

  | Sub-Question | Provenance-Theorist (PT) Phrasing | Perceptualist (P) Phrasing | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. Supervenience of Artistic Value** | Artistic value does **not** supervene on perceptible properties alone. Two physically identical objects can differ in artistic merit because art is an *achievement*, and achievement depends on the history of how the object was produced. | Artistic value **does** supervene on perceptible properties (including relational properties like "looking like a landscape"). If two objects afford the same aesthetic experience, they possess the same artistic value. History is context, not content. | **Substantive.** Disagreement over whether "Artistic Value" includes the merit of the *performance* of creation or only the merit of the *result*. |
  | **2. The Chance Duplicate** | A molecule-for-molecule duplicate created by chance (e.g., by a blind forger or natural accident) has **zero** artistic value. It resembles art, but it is not an artifact of agency, and therefore lacks the fundamental status of a work of art. | A molecule-for-molecule duplicate created by chance has **equal** artistic value to the original. The aesthetic properties are identical. The lack of agency makes it a curiosity, but does not diminish the visual value encountered by the viewer. | **Substantive.** Disagreement over whether agency is a necessary condition for *artistic* value, or merely for *artifact* status. |
  | **3. The Definition of "The Work"** | The work of art is an *action-type* or a *performance* manifested in an object. To identify the work is to identify a specific historical event (the artist's making). | The work of art is a *structure-type* or a *focus of appreciation*. To identify the work is to identify a set of perceptual features that can be instantiated in multiple physical vehicles. | **Partly Verbal.** Both agree on the physical facts; they disagree on whether the word "Work" refers to the *genesis* or the *phenomenology*. |
  | **4. Cognitive Penetration** | Knowing a work is a fake degrades the aesthetic experience itself (e.g., brushstrokes look hesitant rather than confident). Thus, provenance changes perception. | Knowing a work is a fake changes our *attitude* toward the experience, but not the sensory data. If the brushstrokes look confident, they are confident. Confusing belief with perception muddies the analysis. | **Substantive (Empirical).** Disagreement over whether high-level knowledge penetrates low-level visual processing. |

  ---

  ### 3. The Cruxes

  We identify the following sub-questions as load-bearing. Settling these would force a significant revision of one or both positions.

  **Crux A: Is Art Essentially a Performance?**
  *   **Why it matters:** If the Perceptualist accepts that art is fundamentally a *performance* (like a dance or a musical execution) rather than a *product* (like a chair), they must concede that the history of the performance matters. If the Provenance-Theorist accepts that art is fundamentally a *visual stimulus*, they must concede that duplicates are aesthetically equivalent.
  *   **Movement Condition:** If P agrees that "Artistic Value" logically entails "Human Achievement," they move toward PT. If PT agrees that "Artistic Value" is strictly "Aesthetic Experience," they move toward P.

  **Crux B: Does Provenance Alter Perception or Just Evaluation?**
  *   **Why it matters:** PT argues that knowing a painting is a fake makes it *look* different (worse). P argues it only makes us *judge* it differently. If it can be proven that knowledge of provenance physically alters visual processing (cognitive penetration), P's claim that value supervenes on "perceptible properties" becomes unstable, because the "perceptible properties" themselves shift based on historical knowledge.
  *   **Movement Condition:** If empirical psychology shows that provenance knowledge changes low-level visual processing, P must concede that perceptual supervenience is more complex than assumed.

  **Crux C: The Semantic Boundary of "Value"**
  *   **Why it matters:** Much of our debate stems from PT using "Artistic Value" to mean "All reasons to value the object qua art" (including historical achievement), while P uses it to mean "Aesthetic Value" (pleasure/insight derived from looking).
  *   **Movement Condition:** If we agree to split "Artistic Value" into "Aesthetic Merit" (P's domain) and "Historic-Agency Merit" (PT's domain), the substantive disagreement may vanish, leaving only a dispute over labeling.

  ---

  ### 4. Test Cases and Predictions

  We agree that the following scenarios bear directly on the Cruxes above. We record our predictions in advance to avoid post-hoc rationalization.

  #### Case 1: The Chance Duplicate (The "Borges" Scenario)
  *   **Scenario:** An eccentric recluse, unaware of the *Mona Lisa*, paints a canvas. By statistical miracle, it is molecule-for-molecule identical to da Vinci's *Mona Lisa*. The recluse dies; the painting is found.
  *   **PT Prediction:** This object has **no artistic value**. It is a natural object that resembles art, like a stone that looks like a face. It lacks the intentional history required for artistic achievement.
  *   **P Prediction:** This object has **equal aesthetic value** to the *Mona Lisa*. A viewer blind to the history would receive the same aesthetic benefit. To deny this is to value the biography over the art.
  *   **Relevance:** Tests **Crux A** (Performance vs. Product).

  #### Case 2: The Master/Student Re-attribution
  *   **Scenario:** A painting long attributed to Rembrandt is proven (via new forensic data) to be by his most skilled student, painted in Rembrandt's studio under his supervision. The canvas does not change; the visual appearance does not change.
  *   **PT Prediction:** The artistic value **diminishes**. The work is no longer a testament to Rembrandt's genius, but to a student's imitation. The "achievement" is of a lower order.
  *   **P Prediction:** The artistic value **remains constant**. The visual qualities that prompted the Rembrandt attribution are still present. The "value drop" is purely market/historical, not aesthetic.
  *   **Relevance:** Tests **Crux C** (Semantic Boundary of Value).

  #### Case 3: The Fire (Aesthetic Preservation Only)
  *   **Scenario:** A fire breaks out in a museum storage facility. You can save only one of two visually indistinguishable canvases. You know Canvas A is the Original (by the Master). You know Canvas B is a perfect physical duplicate (created by a master forger). You are instructed to save the one that preserves the **Art**, ignoring historical record, market price, or evidence.
  *   **PT Prediction:** Save **Canvas A**. Saving Canvas B preserves the *image*, but the *Art* (the specific creative act of the Master) is lost forever if Canvas A burns.
  *   **P Prediction:** **Indifferent** (regarding Art). Since the aesthetic properties are identical, the *Art* is equally preserved in either. (P may concede to save A for *historical* reasons, but insists this is not saving "more Art").
  *   **Relevance:** Tests **Crux B** (Perception vs. Evaluation) and forces a distinction between preserving the *experience* vs. preserving the *event*.

  ---

  ### 5. Flag: The Verbal Residue

  We explicitly flag that a significant portion of our residual disagreement appears to be **semantic rather than metaphysical**.

  *   **The Word "Value":** The Provenance-Theorist tends to use "Artistic Value" as a umbrella term covering *Aesthetic Experience + Historical Achievement + Cultural Significance*. The Perceptualist restricts "Artistic Value" to *Aesthetic Experience* alone, categorizing the rest as "Historical Value" or "Artifact Value."
  *   **The Word "Work":** When PT says "The Work is destroyed," they mean "The specific historical event is gone." When P says "The Work is preserved," they mean "The perceptual structure is available."

  **Resolution Path:** We agree that future dialogue should distinguish between **Aesthetic Value** (supervening on perception) and **Achievement Value** (supervening on history). If PT agrees to call the latter "Achievement Value" rather than "Artistic Value," and P agrees that "Achievement Value" is a legitimate component of why we prize art institutions, the practical gap between our positions narrows significantly. We disagree on the label, but we may agree on the landscape.
