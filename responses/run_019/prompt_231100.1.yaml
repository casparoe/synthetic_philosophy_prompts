      *   **Goal:** Draft a joint statement between a Provenance-Theorist (PT) and a Perceptualist (P) about art value after adversarial collaboration.
      *   **Core Conflict:** PT says value depends on history/origin (non-perceptible). P says value supervenes on perceptible properties (duplicates have equal value).
      *   **Structure:**
          1.  Agreed Claims (numbered, non-vacuous).
          2.  Disagreements Table (Sub-question, PT phrasing, P phrasing, Nature of disagreement).
          3.  Cruxes (Load-bearing sub-questions).
          4.  Test Cases (Agreed scenarios with predictions).
      *   **Tone:** Philosophical, precise, good-faith, avoiding strawmen.
      *   **Specific Requirement:** Flag where disagreement is about the word "value" vs. the objects.
      *   **Specific Scenarios to Include:** Chance duplicate, Re-attribution (Master vs. Student), Fire Rescue (Identical works).

  2.  **Deconstruct the Positions:**
      *   **Provenance Theorist (PT):** Value is partly historical. Authenticity matters. A fake lacks the artistic achievement of the original genius. The *act* of creation is part of the work.
      *   **Perceptualist (P):** Value is aesthetic/experiential. If it looks the same, it *is* aesthetically the same. Historical facts are external context, not internal value. "Artistic value" $\neq$ "Market value" $\neq$ "Historical significance."

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Constraint:* Must be non-vacuous. Both must genuinely sign.
      *   *Idea 1 (Market/Behavior):* When a forgery is exposed, market value drops. Both agree on this fact, even if they explain it differently.
      *   *Idea 2 (Instrumental Value):* Originals have value as historical evidence. P can agree the *canvas* is evidence, even if the *aesthetic value* is the same.
      *   *Idea 3 (Bad Arguments):* PT agrees mere age doesn't add aesthetic value. P agrees that "status seeking" isn't the only reason people care about originals (they might care about connection to the artist).
      *   *Refinement:* Let's make sure they agree on the distinction between *aesthetic* value and *historical/documentary* value, even if they disagree on whether the former reduces to the latter. Actually, better: Agree that *some* values change upon debunking, even if perceptible properties don't. Agree that not all price premium is irrational fetishism (it can be rational historical interest).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Need:* Specific phrasing acceptable to each side.
      *   *Sub-question 1:* Does aesthetic value supervene on physical properties?
          *   PT: No. The achievement matters.
          *   P: Yes. The experience matters.
      *   *Sub-question 2:* Is the "Chance Duplicate" aesthetically equal to the Original?
          *   PT: No. It lacks the intentional history.
          *   P: Yes. It offers the same perceptual encounter.
      *   *Sub-question 3:* Definition of "The Work."
          *   PT: The work includes its genesis.
          *   P: The work is the perceptible structure.
      *   *Nature of Disagreement:* Is it verbal? Often, this debate hinges on whether "Artistic Value" includes "Historical Achievement." I need to mark where it's substantive vs. verbal.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Goal:* What would change a mind?
      *   *Crux 1:* The definition of "Artistic Achievement." Is it the *result* or the *performance*? If P accepts art is a performance, they move toward PT. If PT accepts art is purely experiential, they move toward P.
      *   *Crux 2:* The "Connection" Intuition. Is valuing the original essentially valuing a causal link to a specific mind? If P admits this is a legitimate *kind* of value (even if not "aesthetic"), the gap narrows.
      *   *Crux 3:* Supervenience. If PT can point to a perceptual difference caused by provenance (e.g., knowing it's a fake changes the seeing), P might concede. If P can show provenance knowledge *never* alters the visual experience, PT might concede.

  6.  **Drafting Section 4: Test Cases:**
      *   *Scenario A (Chance Duplicate):* Borges-style infinite monkeys or neural glitch.
          *   PT: Zero artistic value (no agency).
          *   P: Full aesthetic value (same look).
      *   *Scenario B (Master vs. Student):* Van Meegeren/Vermeer style.
          *   PT: Value drops (lesser mind, deception).
          *   P: Value stays (visuals unchanged).
      *   *Scenario C (The Fire):* Ethical/Preservation choice.
          *   PT: Save Original (irreplaceable history).
          *   P: Indifferent (aesthetically identical), or save Original for historical record (conceding instrumental value). *Correction:* To make it a test of *artistic* value, P should argue saving either is fine aesthetically, but maybe concede historical loss. Let's make P predict that if the goal is *aesthetic preservation*, either works. PT predicts only Original preserves the *art*.

  7.  **Review and Refine:**
      *   *Check:* Did I flag the verbal disagreement about "Value"? Yes, need to explicitly state that PT often bundles historical merit into "Artistic Value" while P restricts "Artistic Value" to "Aesthetic Experience."
      *   *Check:* Are the phrasings charitable?
          *   PT shouldn't sound like a snob, but like someone who values human agency.
          *   P shouldn't sound like a robot, but like someone who values the phenomenology of art.
      *   *Check:* Is Section 1 vacuous? Avoid "We agree people disagree." Instead: "We agree market behavior changes," "We agree historical evidence matters."

  8.  **Final Polish:**
      *   Ensure the tone is formal yet collaborative.
      *   Make sure the "Nature of Disagreement" column distinguishes between substantive metaphysical claims and semantic boundaries.
      *   Ensure the "Cruxes" explain *why* settling them moves the needle.

  *(Self-Correction during drafting)*: I need to be careful with the Perceptualist's stance on the Fire scenario. A sophisticated Perceptualist (like Wollheim or Budd might interpret) might admit the original has *historical* value but deny it has *artistic* value. I need to ensure the distinction between "Artistic Value" and "All-Things-Considered Value" is clear in the agreement section, otherwise the Fire scenario becomes trivial (both save the original for history). The test must isolate *artistic* value. I will frame the Fire scenario as a choice based *solely* on preserving the *art*, not the artifact.

  *(Refining the "Value" Flag)*: The prompt asks to flag where the disagreement is about the word 'value'. I will add a specific preamble or footnote, or integrate it into the Crux analysis. Integrating it into the Crux analysis seems more robust.

