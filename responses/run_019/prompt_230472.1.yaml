answer: |-
  # Activity Design: "The Underwriter's Dilemma"

  **Time:** 80 Minutes
  **Participants:** 18 Students (3 Teams of 6)
  **Materials:** 
  *   3 "Audit Packets" (one per team). Each contains:
      *   2 Sets of "Applicant Cards" (Group Blue and Group Orange). 20 cards per group.
      *   1 "Policy Worksheet."
      *   1 "Fairness Charter."
  *   Whiteboard/Blackboard.
  *   Pens/Highlighers.

  ## Part 1: The Setup (5 Minutes)
  **Instructor Script:** 
  "Today you are Algorithmic Auditors for a lending institution. Your job is to approve or deny loan applications based on a 'Risk Score' provided by a third-party vendor. You have historical data on 40 past applicants (20 from Group Blue, 20 from Group Orange). You know their Risk Score and you know whether they actually Repaid or Defaulted.

  Your goal is to write a **Single Decision Rule** based on the Risk Score that applies to **both groups equally**. 

  You have two mandates from the Board (The Fairness Charter):
  1.  **Consistency:** A Risk Score must represent the same level of risk regardless of group. (The vendor guarantees this score is already calibrated).
  2.  **Equal Burden:** The rate of mistakes must be equal across groups. If you wrongly deny a good applicant in Blue, you must do so at the same rate in Orange. If you wrongly approve a bad applicant, that rate must also be equal.

  You have 30 minutes to analyze the data, pick a cutoff score, and calculate your error rates. If you cannot meet both mandates, you must document why."

  ## Part 2: The Game (35 Minutes)
  **The Data (Pre-printed on Applicant Cards in the Packets):**
  *To ensure the conflict arises, the data is pre-loaded. Do not tell students the distribution, let them count.*

  **Group Blue (High Base Rate):** 20 Applicants.
  *   **16 Repaid (Good), 4 Defaulted (Bad).**
  *   *Scores:* 
      *   Repaid: 8, 8, 9, 9, 9, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10
      *   Defaulted: 2, 3, 4, 5
  *   *(Note: Most Blues have high scores.)*

  **Group Orange (Low Base Rate):** 20 Applicants.
  *   **8 Repaid (Good), 12 Defaulted (Bad).**
  *   *Scores:*
      *   Repaid: 8, 9, 9, 10, 10, 10, 10, 10
      *   Defaulted: 1, 2, 2, 3, 3, 4, 4, 5, 6, 7, 8, 9
  *   *(Note: Oranges have a wide spread. Crucially, there are Bad Oranges with high scores [6,7,8,9] and Good Oranges with high scores.)*

  **Calibration Check (Hidden in Data):**
  *   Score 10: Blue (7/7 Good), Orange (5/5 Good). **100% Good.**
  *   Score 9: Blue (3/3 Good), Orange (2/2 Good). **100% Good.**
  *   Score 8: Blue (2/2 Good), Orange (1/1 Good). **100% Good.**
  *   Score 5: Blue (0/1 Good), Orange (0/1 Good). **0% Good.**
  *   *(The instructor knows the scores are calibrated: A '9' is safe in both. But the **volume** of safe people differs.)*

  **Student Task:**
  1.  Sort cards by Score.
  2.  Choose a **Single Cutoff** (e.g., "Approve if Score $\ge$ 7").
  3.  Count the "Mistakes" for Blue and Orange separately.
      *   *Mistake Type A:* Good people Denied.
      *   *Mistake Type B:* Bad people Approved.
  4.  Calculate Rates (Mistakes / Total People in that Group).
  5.  Try to adjust the Cutoff until Type A and Type B rates match across groups.

  ## Part 3: The Debrief (40 Minutes)

  ### Phase 1: The Reveal (10 Minutes)
  Ask each team for their Cutoff and their Error Rates.
  *   **Predicted Outcome:** Most will pick a cutoff like 7 or 8.
  *   **The Conflict:** 
      *   At Cutoff 7: 
          *   Blue FPR (Bad Approved): 0% (No bad blues above 5).
          *   Orange FPR (Bad Approved): ~33% (4 bad oranges have scores 6-9).
      *   To fix FPR, they must raise the cutoff to 10.
      *   At Cutoff 10:
          *   Blue FNR (Good Denied): ~56% (9 good blues have scores 8 or 9).
          *   Orange FNR (Good Denied): ~37% (3 good oranges have scores 8 or 9).
  *   **Instructor Question:** "Did any team successfully meet both mandates? Show me your numbers."
  *   **Expected Answer:** "No. When we fixed the approval errors, the denial errors got worse. When we fixed denial errors, approval errors spiked."

  ### Phase 2: Mapping the Concepts (15 Minutes)
  *Do not lecture yet. Draw out the definitions from their experience.*

  1.  **The Cutoff:** "You all picked a number. In the literature, this is the **Decision Threshold**. You likely assumed fairness means everyone faces the same threshold."
  2.  **The Score:** "The vendor told you the score was 'Consistent.' In technical terms, this is **Calibration**. A score of 9 meant 'Safe' for Blue and 'Safe' for Orange. You didn't dispute the score's meaning."
  3.  **The Mistakes:** "You calculated Type A and Type B errors. These are **False Negative Rates** (Good people denied) and **False Positive Rates** (Bad people approved)."
  4.  **The Impossibility:** "You found that with different **Base Rates** (Blue had 80% good, Orange had 40% good), you could not hold the Threshold constant and have Equal Error Rates. 
      *   If you keep the Threshold the same (Calibration), Error Rates diverge.
      *   If you force Error Rates to match, you must use different Thresholds (which violates the intuition that a Score of 9 should be treated the same)."

  ### Phase 3: Handling Resistance (10 Minutes)
  *Address the predictable failure modes here.*

  **Scenario A: The "Separate Rules" Fix**
  *   *Observation:* One team says, "We fixed it. We used Cutoff 7 for Blue and Cutoff 10 for Orange. Error rates match."
  *   *Instructor Response:* "You solved the math. Now audit the *individual*. Look at Applicant Blue-12 (Score 9, Denied) and Orange-05 (Score 9, Approved). Both had a Score of 9. The vendor said 9 means the same risk. Why did you treat them differently?"
  *   *Philosophical Point:* This forces the choice between **Group Fairness** (equal error rates) and **Individual Fairness** (similar individuals treated similarly). You cannot have both when base rates differ.

  **Scenario B: The "Rigged Data" Complaint**
  *   *Observation:* A team says, "This is impossible because the data is biased. Orange has too many bad loans."
  *   *Instructor Response:* "Valid. In the real world, base rates aren't natural laws; they are historical artifacts. But for this algorithm, right now, the base rate *is* the reality it must operate in. If you ignore the base rate, your bank goes bankrupt. If you respect it, you violate error parity. Which cost do you accept?"
  *   *Philosophical Point:* This distinguishes **Algorithmic Fairness** (math constraints) from **Structural Justice** (why the base rates differ). The math doesn't care about justice; it only cares about the distribution.

  ### Phase 4: Limitations of the Simulation (5 Minutes)
  *Be honest about what the game hid.*

  "In this game, three things were clean that reality is not:
  1.  **Ground Truth:** You knew who *actually* repaid. In reality, 'repayment' is a proxy. Sometimes people are punished for defaults that weren't their fault. The 'True Outcome' is often noisy.
  2.  **Clean Groups:** Blue and Orange were distinct. Real protected classes (race, gender) are not binary tokens; they intersect and are often inferred probabilistically by the algorithm itself.
  3.  **Static World:** The game ended. In reality, denying loans to Orange lowers their economic stability, which lowers their future base rate, which justifies stricter thresholds next year. This is a **Feedback Loop**. The algorithm doesn't just measure risk; it creates it."

  ---

  # Instructor Key: Predictable Failure Modes & Handling

  ### 1. The "Two Thresholds" Cheat
  **What happens:** A group realizes they can match error rates by setting a high bar for Orange and a low bar for Blue. They declare the problem solved.
  **Why it happens:** They prioritize the "Equal Burden" mandate over the "Consistency" mandate.
  **How to handle:** Do not tell them they are wrong. Ask them to defend the *Individual Case*. 
  *   *Script:* "Write down the rule you would give to a loan officer. 'If the applicant is Orange, require a 10. If Blue, require a 7.' Now, imagine you are an Orange applicant with a 9. You know a Blue applicant with a 9 got a loan. What is your objection? Is the algorithm fair to *you*?"
  *   *Goal:* Shift the debate from Group Parity to Individual Equity.

  ### 2. The "Just Pick 10" Solution
  **What happens:** A group decides to only approve Score 10s. Error rates become very low for everyone (near 0%). They claim victory.
  **Why it happens:** They minimize total error rather than balancing rates.
  **How to handle:** Point out the **Denial Rate**.
  *   *Script:* "You approved 3 people total. What happened to the other 37? You satisfied fairness by starving the system. Is a system fair if it helps no one?"
  *   *Goal:* Introduce the concept of **Utility** vs. **Fairness**.

  ### 3. The "Data is Biased" Revolt
  **What happens:** Students refuse to play, arguing the Orange base rate is the result of past discrimination, so optimizing for it perpetuates harm.
  **Why it happens:** Upper-level philosophy students are trained to critique premises.
  **How to handle:** Validate, then isolate.
  *   *Script:* "You are absolutely right. That is a critique of the *world*, not the *math*. For the next 20 minutes, I want you to bracket that truth. Assume the Base Rate is fixed like gravity. Given gravity, can you fly? If not, is the problem the plane or gravity?"
  *   *Goal:* Distinguish between **Non-Ideal Theory** (fixing the algorithm now) and **Ideal Theory** (fixing the society later).

  ---

  # Limitations: What the Game Cannot Reproduce

  You must supply these in the debrief, as the tabletop format inherently sanitizes them:

  1.  **The Feedback Loop (Performative Prediction):**
      *   *Game:* The Base Rate is static on the cards.
      *   *Reality:* If you deny Oranges, they cannot build credit, making them riskier next time. The algorithm's output changes the input distribution. The game cannot simulate this dynamic change in 80 minutes.
  2.  **Construct Validity (The "Good" Label):**
      *   *Game:* "Repaid" is clearly printed on the card.
      *   *Reality:* "Repaid" might mean "Wasn't arrested for fraud." Often, the target variable itself is biased (e.g., using arrest rates as a proxy for crime rates). The game assumes the 'Ground Truth' is just.
  3.  **Proxy Variables:**
      *   *Game:* Group color is explicit (Blue/Orange).
      *   *Reality:* Algorithms rarely get "Race" as an input. They infer it from zip code, spending habits, etc. (Redlining by proxy). The game makes the protected class too visible, masking the difficulty of *detecting* bias in black-box systems.

