  *   [ ] **3 Audit Packets:** Print the "Applicant Data" (40 rows per packet) on cardstock if possible.
  *   [ ] **Highlighters:** 3 colors per team (to mark Approved, Denied, Errors).
  *   [ ] **Calculators:** Phones are fine.
  *   [ ] **Board Space:** Reserve space to write the three team's results side-by-side for comparison.
