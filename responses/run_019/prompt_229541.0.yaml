  Your definition of "dissolve" relies on the shift from an "explanatory-gap problem" to an "ordinary scientific question." This is underspecified regarding *who* must be convinced. I have interpreted this as "the consensus of the relevant scientific community." If you mean "dissolve for every individual philosopher's private intuition," the probability drops significantly, as private qualia are resistant to public argument. I have committed to the scientific consensus interpretation for the 60% figure.
