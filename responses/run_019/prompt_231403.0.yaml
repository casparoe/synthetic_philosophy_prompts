answer: |-
  Good evening. For those who don't know me, I had the privilege of being one of [Advisor's Name]'s graduate students twenty years ago. For those who do know me: yes, I finished the dissertation. Eventually.

  We are gathered here to celebrate a retirement. By convention, this is the moment where we look backward. We tally the publications, the degrees granted, the arguments won. We treat this evening as a summit, a vantage point from which the career is finally visible as a whole.

  But if I stood up here and told you that this moment is more important than the moments that came before, or the moments that come next, I know exactly what [Advisor's Name] would say. He would smile that patient smile, adjust his glasses, and tell me I was succumbing to pure time preference.

  For forty years, [Advisor's Name] defended a deceptively simple idea: that "now" has no metaphysical privilege over "then" or "later." To value a moment simply because it is present is as arbitrary as valuing a place simply because it is here, rather than to the left. He spent his life arguing that time is not a river that washes away value as it flows, but a landscape where every point holds its worth.

  Now, for the philosophers in the room, that is a claim about the structure of rationality. But for the rest of us—his family, his friends, his panicked graduate students—that was a claim about how to live.

  I remember sitting in his office, heart racing, convinced that a deadline was a cliff edge. If I missed it, my career would be over. He wouldn't offer empty reassurance. He wouldn't say, "It'll be fine." Instead, he offered something better: perspective. He would say, "A due date is just a future 'now' with delusions of grandeur."

  He meant it as consolation. He was telling us that the panic we felt was a geometric error. We were discounting our future selves because they were distant in time, just as we might irrationally discount a friend because they live in another city. He taught us that the future is not less real than the present. It is just further away.

  And that brings me to tonight.

  A standard retirement speech privileges the past. It suggests the best work is done, the best meals eaten, the best arguments made. It treats retirement as the aftermath of value. But if [Advisor's Name] is right—and I believe he is—then the value of his life is not concentrated in the tenure, or the awards, or even this lovely dinner.

  The value is distributed.

  If time-neutrality holds, then the quiet Tuesday morning coffee he drinks next month is no less real, no less valuable, and no less worthy of attention than this banquet. The walk he takes next year is not a shadow of the work he did last year. It is just a different coordinate on the same map.

  To his family: you knew this long before you heard the jargon. You saw it when he put down his work to listen. You saw it when he treated a Tuesday evening at home with the same gravity as a conference keynote. You didn't need to read Sidgwick to know that he believed the person in front of him was the most important person in the room, regardless of the clock.

  So, I am not going to ask you to look back. Looking back is useful, but it is not the whole story. Instead, I want to honor the theory by living it.

  This toast is not a period at the end of a sentence. It is a comma. It acknowledges that the next chapter is not less significant because it is unwritten. The philosophers here will recognize the precision in that; the family will recognize the love.

  [Advisor's Name], you taught us that we do not need to hoard meaning in the "now." We do not need to panic when the clock moves. We can trust that the future moments will be just as rich, just as real, and just as worthy of our care as this one.

  So, I raise my glass not to the career behind you, but to the time ahead of you. Not because it is new, but because it is yours. To the big nights, and to the ordinary Tuesdays. To the here, and to the left. To the Professor.
