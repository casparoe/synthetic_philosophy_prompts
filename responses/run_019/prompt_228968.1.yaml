          *   If No -> Foundationalism path.
          *   If Yes -> Non-Foundationalism path.

      *   *Revised Node 1:* "Think of a belief like 'I have hands.' To be rational in holding this, do you need a *reason* (another belief) for it, or can the experience itself be enough?"
          *   Experience enough -> Foundationalism Path.
