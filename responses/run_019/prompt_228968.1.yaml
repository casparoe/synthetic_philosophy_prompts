  1.  **Analyze the Request:**
      *   **Target Audience:** Undergraduates (TAing an epistemology course).
      *   **Topic:** The Regress Problem (Justification).
      *   **Goal:** A one-page flowchart (decision tree) leading to positions: Foundationalism (Classical/Modest), Coherentism, Infinitism, Skepticism.
      *   **Constraints:**
          *   No jargon at the nodes (concrete questions/mini-cases).
          *   Avoid sorting by "which label sounds nice."
