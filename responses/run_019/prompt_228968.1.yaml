          *   Can't be wrong -> Classical.
          *   Could be wrong -> Modest.

      *   *Revised Node 3 (Non-Foundationalism):* "If you need a reason for every belief, imagine the list of reasons. Must this list eventually stop, or can it go on forever?"
          *   Go on forever -> Infinitism.
          *   Must stop/loop -> Go to Node 4.

      *   *Revised Node 4 (Loop vs. Stop):* "If the list can't go on forever, does it eventually crash (no justification) or loop back around (Belief A helps B, B helps C, C helps A)?"
          *   Crash -> Skepticism.
