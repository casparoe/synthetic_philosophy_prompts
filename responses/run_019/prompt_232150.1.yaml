prompt: |-
  Spent a couple hours last night arguing about the omnipotence paradox with a friend, and I came away feeling like he'd argued me into a corner rather than actually resolving anything. By the end he kept restating his whole position like this:

  The paradox only seems deep because English lets you point at a task that can't be done in any possible world. Omnipotence was never the power to do literally anything — nobody thinks God can make a square circle or a married bachelor. It's the power to do whatever is logically possible. And 'a stone so heavy that an omnipotent being can't lift it' is just a square circle in disguise, because an omnipotent being is by definition strong enough to lift any stone, so the object you're asking God to create would have to violate the definition of the being doing the creating. So 'can God make a stone he can't lift?' isn't really a question about God's power at all, just a string of words with no content. Once you see that, the paradox is dissolved rather than solved, and i honestly don't think anyone treats it as a live problem anymore.

  I buy the logical-possibility part, but the 'it's just meaningless words' move felt to quick and I couldn't say why. Can you give me an accuracy audit of his take? Separate the pieces that are legitimately right from the ones that are normal simplifications, say where someone who thinks the paradox still has teeth would push back, and tell me whether his final 'so it's a non-problem' conclusion actually survives if the sloppy parts get cleaned up, or whether it depends on them.
