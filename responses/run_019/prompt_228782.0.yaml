  She will conclude she is not obligated to switch funds. Two candidate principles reconstruct her verdicts while accommodating the tension between her civic duty to vote and her causal skepticism regarding markets. The first is the **Threshold Expected Impact Principle with Civic Exception**: an agent is obligated to avoid a harmful action only if it carries a non-negligible probability of being the marginal trigger for a discrete unit of harm (accommodating Case 2 while excluding Cases 3 and 4), but is obligated to participate in civic schemes regardless of marginal impact to avoid free-riding (accommodating Case 1). The second is the **Discrete Mechanism Principle**: moral obligation attaches only to actions operating through discrete, countable mechanisms registered by the system (ballots, purchase orders) rather than continuous flows or fixed-capacity constraints (grid load, passenger weight). Both principles predict she is not obligated to switch, as index fund ownership lacks the marginal causal trigger of meat orders (Principle 1) and functions like the fixed-capacity flight system where her individual unit does not determine output (Principle 2). They diverge on the classification of the pension case: Principle 1 treats it like Case 3 (electricity) due to causal inertness, while Principle 2 treats it like Case 4 (flying) because the share count is discrete but causally fixed.

  My best prediction is that she will not switch, viewing the pension case as closest analog to Case 4 (flying). In both instances, the system operates on a fixed schedule or production plan regardless of her individual participation; just as the aircraft departs without her seat, the fossil fuel company extracts oil without her specific share. She distinguishes Case 2 (meat) because retail orders trigger discrete replenishment units, whereas secondary market stock trades do not trigger extraction units. She distinguishes Case 1 (voting) because voting is a civic duty governed by fair play rather than a market transaction governed by causal efficacy. The four verdicts genuinely underdetermine the answer because Case 1 establishes a non-causal duty (fair play) that could theoretically extend to financial complicity, while Cases 3 and 4 establish a causal inertness exemption that could theoretically cover investment. Resolving this requires a further commitment on whether capital markets are cooperative schemes akin to democracy (requiring participation ethics) or mechanical systems akin to utilities (requiring causal ethics).

  To discriminate between the leading reconstructions, propose the case of **receiving an unsolicited dividend check from a tobacco company she boycotts**. The Threshold Expected Impact Principle predicts she should keep the money, as cashing the check has no causal impact on tobacco production. The Discrete Mechanism Principle, if interpreted to prioritize countable participation in harm over causal trigger, might predict she should donate or reject the funds, as the dividend represents a registered unit of profit from a wrongful practice. Her verdict here would reveal whether her prohibition on profiting from harm is strictly causal or based on systemic complicity.
