answer: |-
  # Policy Screening Procedure: Well-Being and Happiness Rankings

  **Purpose:** To determine how much weight policy analysts should give to a proposal's claim that it will improve the country's *World Happiness Report* (WHR) ranking.
  **Time Required:** 45–60 minutes per proposal.
  **User:** Policy Research Analyst (No philosophy background required).
  **Output:** One of three classifications: **Primary Evidence**, **Secondary Evidence**, or **Disregard**.

  ---

  ## Part 1: The Screening Checklist

  Read the policy proposal document. Answer the following six questions. Tick the box that best matches the evidence provided in the proposal.

  ### Step 1: The Target Metric
  **Question:** Does the proposal aim to improve the specific survey question used by the WHR, or does it aim to improve the conditions that usually lead to a higher score?
  *   **A.** The proposal explicitly targets the "Cantril Ladder" question (e.g., training citizens to answer surveys, changing how the survey is administered). [ ]
  *   **B.** The proposal targets one of the six key factors (GDP, Social Support, Health, Freedom, Generosity, Corruption) or general living conditions. [ ]
  *   **C.** The proposal targets "happiness" generally but does not specify how this links to the WHR methodology. [ ]

  > **Plain Language:** The WHR relies on one specific question: *"Imagine a ladder where 0 is the worst possible life and 10 is the best. Where do you stand?"* This is a measure of **Life Evaluation** (what you think about your life), not **Emotional Happiness** (how you feel right now).
  > *   **Judgment Point:** If the proposal claims to improve "happiness" but only measures "smiling frequency" or "stress levels," note this mismatch.

  ### Step 2: The Mechanism of Change
  **Question:** How does the proposal claim the score will rise?
  *   **A.** By changing the actual conditions people live in (e.g., higher income, safer streets, better health). [ ]
  *   **B.** By changing how people report their conditions without changing the conditions (e.g., framing effects, persuasion campaigns, changing survey mode from phone to online). [ ]
  *   **C.** By changing who is included in the survey (e.g., excluding unhappy demographic groups, institutionalized populations). [ ]

  > **Plain Language:** We want to know if the country is actually getting better, or if we are just "coaching" the score.
  > *   **Judgment Point:** Distinguish between *improving the signal* (better data) and *gaming the signal* (manipulating responses).

  ### Step 3: Adaptation and Expectations
  **Question:** Does the proposal rely on lowering expectations to increase satisfaction?
  *   **A.** No, it improves conditions while keeping expectations stable. [ ]
  *   **B.** Yes, it explicitly aims to manage expectations (e.g., "teaching citizens to be content with less"). [ ]
  *   **C.** Unclear, but the benefits seem temporary (e.g., a one-off cash bonus). [ ]

  > **Plain Language:** This checks for **Adaptive Preferences**. If people lower their standards because they are told to, their score might go up even if their life gets worse. This is not a genuine welfare improvement.
  > *   **Judgment Point:** Analysts must judge if "contentment" is being used to mask stagnation or harm.

  ### Step 4: Relative vs. Absolute Gain
  **Question:** Is the predicted gain dependent on other countries doing worse, or is it an absolute improvement?
  *   **A.** The proposal predicts an absolute increase in the national average score, regardless of other countries. [ ]
  *   **B.** The proposal relies on the country outperforming peers (e.g., "We will grow faster than our neighbors"). [ ]
  *   **C.** The proposal focuses solely on the *Ranking* number (e.g., "Move from 20th to 15th") without specifying the score change. [ ]

  > **Plain Language:** The **Ranking** is a contest (Zero-Sum). The **Score** is a measure of welfare (Positive-Sum). A policy can raise the score but lower the ranking if other countries improve faster. Welfare depends on the Score, not the Rank.
  > *   **Judgment Point:** If the proposal only promises a better Rank without a guaranteed Score increase, treat the evidence with suspicion.

  ### Step 5: Scope of Well-Being
  **Question:** Does the policy improve the WHR score but potentially harm other important aspects of life?
  *   **A.** No obvious trade-offs; the policy improves the score and other welfare indicators (health, rights, environment). [ ]
  *   **B.** Yes, there is a trade-off (e.g., increasing GDP by reducing environmental protections; increasing Security by reducing Freedom). [ ]
  *   **C.** The policy narrows the focus so much that the score becomes unrepresentative (e.g., boosting income for the top 10% only). [ ]

  > **Plain Language:** The WHR score is **Narrow**. It does not capture everything that matters (e.g., inequality, meaning, nature). A policy might raise the score by making life easier but less meaningful, or richer but less free.
  > *   **Judgment Point:** Analysts must identify if the "win" on the WHR metric comes at the cost of other values the government cares about.

  ### Step 6: Predictor Alignment
  **Question:** Does the policy affect the WHR's six modeling factors directly?
  *   **A.** Directly targets one or more of the six factors (GDP, Social Support, Health, Freedom, Generosity, Corruption). [ ]
  *   **B.** Indirectly affects factors (e.g., a cultural campaign that might eventually change Generosity). [ ]
  *   **C.** No clear link to the six factors; relies on general "optimism." [ ]

  > **Plain Language:** The WHR Ranking is mathematically modeled on six specific predictors. If a policy does not touch these, its ability to move the ranking is speculative.
  > *   **Judgment Point:** Assess the strength of the link between the policy activity and the statistical predictors.

  ---

  ## Part 2: Decision Matrix

  Tally the answers from the Checklist above to determine the Output.

  | If your answers are mostly... | Then assign this Output | Meaning for Policy Case |
  | :--- | :--- | :--- |
  | **Step 1: B** AND **Step 2: A** AND **Step 3: A** AND **Step 4: A** | **PRIMARY EVIDENCE** | The ranking gain is a reliable proxy for genuine welfare improvement. It can be the main justification for the policy. |
  | **Step 1: C** OR **Step 3: C** OR **Step 4: B** OR **Step 5: B** | **SECONDARY EVIDENCE** | The ranking gain is plausible but imperfect. It supports the case but must be backed by other data (e.g., poverty rates, health outcomes). Do not rely on it alone. |
  | **Step 1: A** OR **Step 2: B/C** OR **Step 3: B** OR **Step 4: C** | **DISREGARD** | The ranking gain is a statistical artifact, a result of gaming, or a zero-sum game. It provides **no** evidence of welfare improvement. |

  **Special Note on Uncertainty:** If Step 5 (Scope) reveals a major ethical trade-off (e.g., Freedom vs. Security) that the analyst cannot quantify, assign **SECONDARY EVIDENCE** and attach a "Senior Review Required" flag. This indicates the procedure cannot settle the philosophical conflict.

  ---

  ## Part 3: Worked Examples

  ### Example 1: The "National Contentment" Campaign
  **Proposal:** A public relations campaign funded by the Ministry of Culture. It uses media to teach citizens that "comparing yourself to others causes unhappiness." The goal is to raise the national average on the Cantril Ladder by 0.5 points within two years.
  **Claim:** This will raise our WHR Ranking by 10 spots.

  *   **Step 1 (Target):** **A** (Targets the survey response mindset).
  *   **Step 2 (Mechanism):** **B** (Changes reporting without changing conditions).
  *   **Step 3 (Adaptation):** **B** (Relies on lowering expectations/comparisons).
  *   **Step 4 (Relative):** **C** (Focuses on Rank).
  *   **Step 5 (Scope):** **B** (Trade-off: potentially discourages legitimate grievance).
  *   **Step 6 (Predictors):** **C** (No link to structural factors).

  **Result:** **DISREGARD**.
  **Reasoning:** The proposal admits it works by changing how people think about the score, not by improving their actual lives (Step 2B). It relies on adaptive preferences (Step 3B). A higher score here reflects changed reporting standards, not improved welfare.

  ### Example 2: The "Infrastructure & Growth" Bill
  **Proposal:** A major investment in roads and digital connectivity projected to raise GDP per capita by 3% annually.
  **Claim:** This will improve our WHR Ranking as GDP is a top predictor.

  *   **Step 1 (Target):** **B** (Targets GDP, a key factor).
  *   **Step 2 (Mechanism):** **A** (Changes actual economic conditions).
  *   **Step 3 (Adaptation):** **C** (Economic gains often face diminishing returns/adaptation).
  *   **Step 4 (Relative):** **B** (Relies on growing faster than peers to move Rank).
  *   **Step 5 (Scope):** **B** (Potential trade-off: Construction may harm environment/health temporarily).
  *   **Step 6 (Predictors):** **A** (Directly targets GDP).

  **Result:** **SECONDARY EVIDENCE**.
  **Reasoning:** While GDP is a strong predictor (Step 6A), the link between income and life evaluation weakens as countries get richer (Step 3C). Furthermore, the Ranking depends on other countries' performance (Step 4B). The score might rise, but the Rank might not. Use this evidence alongside health and inequality data.

  ### Example 3: The "Community Safety" Act (Uncertain Case)
  **Proposal:** Increased surveillance and policing in urban areas.
  **Claim:** This will reduce Perceptions of Corruption and increase Social Support, raising the WHR Score. However, it may reduce Freedom to Make Life Choices.

  *   **Step 1 (Target):** **B** (Targets Corruption/Freedom factors).
  *   **Step 2 (Mechanism):** **A** (Changes actual security conditions).
  *   **Step 3 (Adaptation):** **A** (Security benefits are usually stable).
  *   **Step 4 (Relative):** **A** (Absolute improvement in safety).
  *   **Step 5 (Scope):** **B** (Clear trade-off: Security vs. Freedom).
  *   **Step 6 (Predictors):** **A** (Targets specific WHR factors).

  **Result:** **SECONDARY EVIDENCE (Flag for Senior Review)**.
  **Reasoning:** The procedure identifies a conflict between two WHR components (Corruption/Support vs. Freedom). The mathematical score might go up, but the philosophical question is whether trading Freedom for Security is a "welfare improvement." The analyst cannot resolve this with data alone. The ranking gain is real but ethically ambiguous. It supports the case but cannot be the *primary* justification without a political decision on the trade-off.

  ---

  ## Part 4: Operational Glossary

  *   **Cantril Ladder:** The specific 0–10 survey question used by the WHR. If a proposal does not mention this or the six factors, it is not directly targeting the WHR metric.
  *   **Life Evaluation:** What a person thinks when they step back and judge their life as a whole. (Measured by the Ladder).
  *   **Emotional Happiness:** How a person feels moment-to-moment (joy, stress, anger). The WHR Ranking does not measure this directly.
  *   **Adaptive Preferences:** When people lower their expectations to match their poor circumstances, reporting high satisfaction despite low welfare. (e.g., "I don't need healthcare, I'm used to being sick.")
  *   **Zero-Sum Ranking:** A situation where one country can only move up if others move down or stay still. Welfare is not zero-sum; rankings are.
  *   **Gaming:** Actions taken to improve the number without improving the reality (e.g., changing survey methods, excluding unhappy groups).
  *   **The Six Factors:** GDP per capita, Social Support, Healthy Life Expectancy, Freedom to Make Life Choices, Generosity, Perceptions of Corruption.

  ---

  ## Instructions for Analysts

  1.  **Do not skip Step 4.** Confusing the *Rank* (position) with the *Score* (average) is the most common error in these proposals.
  2.  **Mark your Judgment.** Where the checklist indicates a "Judgment Point," write one sentence in the file notes explaining your reasoning. This allows senior officials to review your logic.
  3.  **Timebox.** If you cannot find evidence for a Step after 10 minutes of searching, mark it as "Unclear" and treat it as the less favorable option (e.g., if unclear if it's gaming, assume it might be).
  4.  **Escalate Trade-offs.** If Step 5 reveals a conflict between fundamental values (e.g., Liberty vs. Security), do not classify as Primary. Use Secondary + Flag.
