      *Re-evaluating the "Ranking" vs "Score" issue:* The WHR ranking is relative. If my country improves by 0.1 and everyone else improves by 0.2, my ranking drops even if welfare rises. If my country improves by 0.1 and everyone else stays still, ranking rises. Policy proposals often confuse these. The procedure must check if the claim is about the *Score* (absolute welfare) or the *Rank* (relative status). Welfare is about the Score. The Prompt says proposals are justified by the claim they will raise the *ranking*. This is a red flag for zero-sum thinking. I must include a test for "Zero-Sum vs. Absolute Gain."

