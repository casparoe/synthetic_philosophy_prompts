      *(Self-Correction on Examples)*: Make sure one example clearly shows a "Ranking Gain" that is actually bad or neutral for welfare (Disregard). One shows a genuine improvement but narrow (Secondary). One shows a hard philosophical trade-off (Flag/Uncertain).

      *Let's refine the "Flag/Uncertain" category.* The prompt asks for three outputs: Primary, Secondary, Disregard. It *also* asks for an example where the procedure "flags a case it cannot settle." I should add a "Refer to Senior/Philosopher" option or note that within the three categories, one implies "Needs more info." Actually, the prompt says "end by assigning... one of three outputs." I will add a "Special Review" note within the procedure for the uncertain case, but map it to "Secondary" with a warning, or create a "Hold" category if allowed. Re-reading: "end by assigning the proposal one of three outputs." Okay, I must stick to the three. I will handle the "cannot settle" example by showing how it lands in "Secondary" but requires a specific warning note, or I will interpret "flags a case it cannot settle" as part of the *example description* showing the limits of the tool, even if the tool forces a categorization. Better: I will add a "Escalate" option for the "cannot settle" case, or note that "Secondary" implies "Do not rely on this alone." Let's stick to the three outputs but use the "Secondary" category to capture "Needs corroboration/uncertain." Wait, the prompt asks for an example "in which the procedure flags a case it cannot settle." This implies the procedure might have a "Refer Up" mechanism. I will add a "Step 0" or a "Special Condition" that allows for escalation if the judgment is too high-stakes. Actually, the safest interpretation is that the procedure identifies the *uncertainty* within the "Secondary" classification, but the example description will highlight the unresolved tension.
