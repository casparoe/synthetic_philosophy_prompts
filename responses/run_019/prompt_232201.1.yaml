          *   Do not depend on latest year's rankings or specific country data.
          *   No citations/bibliography.
      *   **Key Conceptual Distinctions to Operationalize:**
          *   Life Evaluation (WHR metric) vs. Richer Happiness/Well-being.
          *   Improving underlying state vs. Improving measurement/relative position.
          *   Changing well-being vs. Adaptive preferences, gaming, sample changes, index component shifts.
          *   Direct/Indirect impact on WHR predictors vs. Publicity effects.

  2.  **Deconstruct the World Happiness Report (WHR) Methodology (Mental Check):**
      *   What is the main dependent variable? Cantril Ladder (Life Evaluation). "Imagine a ladder... 0 is worst, 10 is best. Where do you stand?"
      *   What are the key predictors (The "Six Factors")? GDP per capita, Social Support, Healthy Life Expectancy, Freedom to Make Life Choices, Generosity, Perceptions of Corruption.
      *   What is the "Ranking"? It's a relative position based on the average ladder score.
      *   *Philosophical/Measurement Issues:* Adaptation (hedonic treadmill), framing effects, relative income vs. absolute income, composition of the population (who is surveyed), distinction between evaluative (life satisfaction) and affective (momentary happiness) well-being.

  3.  **Drafting the Procedure Structure:**
      *   Need a logical flow: Start with the claim, check the mechanism, check the measurement validity, check the scope, conclude.
      *   Time limit: Under 1 hour. This means maybe 5-7 key questions.
      *   Output: Primary, Secondary, Disregard.

  4.  **Developing the Questions (Iterative Process):**
      *   *Q1: What is the specific metric?* Is it the Cantril Ladder or just "happiness"? (Distinguishes Life Evaluation vs. Richer Sense).
      *   *Q2: How does it affect the score?* Directly on predictors or via framing/surveying? (Distinguishes Underlying State vs. Measurement).
      *   *Q3: Who is affected?* Does it change *who* answers the survey? (Distinguishes Population Composition).
      *   *Q4: Adaptation?* Will people get used to it quickly? (Distinguishes Temporary vs. Lasting).
      *   *Q5: Relative vs. Absolute?* Does it rely on beating neighbors or actual improvement? (Distinguishes Ranking Game vs. Welfare).
      *   *Q6: Trade-offs?* Does it improve the score but hurt other things? (Distinguishes Narrow vs. Broad Well-being).

      *Refining for Operational Clarity:* Instead of abstract questions, make them "Look for X in the proposal."
      *   *Step 1: The Target.* Does the proposal target the Cantril Ladder specifically or the 6 factors?
      *   *Step 2: The Mechanism.* Is the gain real or statistical? (Gaming).
      *   *Step 3: The Scope.* Is it adaptive?
      *   *Step 4: The Comparison.* Is it zero-sum?

  5.  **Refining the Outputs:**
      *   *Primary:* Strong link to underlying well-being, robust mechanism, no gaming.
      *   *Secondary:* Plausible link but narrow, or potential adaptation issues, needs corroboration.
      *   *Disregard:* Gaming, measurement artifact, relative only, adaptive preferences masking harm.

  6.  **Addressing "Professional Judgment":**
      *   Analysts aren't philosophers. Where *must* they think?
      *   Judging "Adaptation" (How fast will people get used to this?).
      *   Judging "Scope" (Is this metric enough to capture the good life?).

  7.  **Drafting the Worked Examples:**
      *   *Example 1 (Disregard):* A PR campaign telling people to answer the survey higher. Or changing the survey mode. Let's go with "Survey Mode Change" or "Framing Campaign." Let's choose a "National Positivity Campaign" that teaches people to rate higher without changing conditions.
      *   *Example 2 (Secondary):* GDP growth. It raises the score, but has diminishing returns and doesn't capture inequality. Or "Anti-Corruption Drive." Let's go with GDP growth—it hits the predictor directly but is narrow.
      *   *Example 3 (Uncertain/Flagged):* A policy that restricts freedom to increase security (trade-off between factors). Or Adaptive Preferences (lowering expectations). Let's go with "Expectation Management" (lowering aspirations to increase satisfaction).

  8.  **Review against Constraints:**
      *   *Plain language?* Avoid "hedonic treadmill," use "getting used to it." Avoid "evaluative well-being," use "life score."
      *   *Time limit?* Keep explanations brief.
      *   *No citations?* Check.
      *   *No specific data?* Use illustrative figures.

  9.  **Final Polish:**
      *   Ensure the distinction between "Ranking" (relative) and "Score" (absolute) is clear. A policy can raise the score but not the ranking if everyone improves. The prompt asks about *ranking* justification, but the welfare implication depends on the *score*. I need to make sure the procedure flags the "Zero-Sum" trap of rankings.
