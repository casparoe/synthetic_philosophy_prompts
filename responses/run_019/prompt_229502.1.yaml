      *   **Decision Procedure:** A step-by-step framework for future cases (Imprecise Probability Protocol).
      *   **Defense:** How to explain this to the public/courts later (Focus on duty of care and handling uncertainty).

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "unlimited authority to the most pessimistic model" concern?
      *   *Answer:* Yes, by clarifying that "defensible" means "credible." If a model is defensible, its upper bound is a credible threat. We aren't listening to a crank; we are listening to certified engineers.
      *   *Check:* Did I address the delay?
