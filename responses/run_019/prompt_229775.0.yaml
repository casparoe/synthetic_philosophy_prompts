answer: |-
  This is an excellent dissection of a very common rhetorical move. You are right to feel that the slogan is doing too much heavy lifting; it conflates several distinct philosophical claims, some of which are plausible and some of which are untenable.

  Here is a menu of the precise theses that slogan could be expressing, categorized by their philosophical domain. For each, I have assessed its status in contemporary philosophy, whether it supports your uncle's conclusion (keep the statue), and how it handles your specific objection about contested standards.

  ### 1. The Meta-Ethical Claim: "Moral Truths Change Over Time"
  **The Claim:** Morality is not objective or timeless. An action that is wrong in 2024 was literally *not wrong* in 1750. Moral facts are relative to the era.
  *   **Philosophical Status:** **Substantive but Minority View.** Most contemporary moral philosophers are Moral Realists (they believe moral truths are objective and timeless). If slavery was wrong in 1850, it was wrong then, even if everyone said it was right. To claim morality itself shifts is a form of *temporal relativism*, which is generally considered difficult to defend without sliding into "might makes right."
  *   **Does it save the statue?** **Yes.** If the figure didn't do anything objectively wrong by the moral facts of *his* time, there is no moral stain to remove.
  *   **Verdict:** This is the strongest shield for your uncle, but it is the most philosophically expensive. It requires him to defend the idea that morality is invented by eras rather than discovered.

  ### 2. The Epistemic Claim: "They Could Not Have Known Better"
  **The Claim:** The figure was morally ignorant, but this ignorance was non-culpable. Given the information, education, and consensus available to them, they were not negligent in holding their views.
  *   **Philosophical Status:** **Live Dispute (Fact-Sensitive).** This is a standard excuse condition in moral philosophy (ignorance can excuse blame). However, it is an empirical claim, not a philosophical one. It depends entirely on whether knowledge *was* available.
  *   **Does it save the statue?** **Yes, conditionally.** It argues the figure is not *blameworthy*, which might protect their reputation.
  *   **The "Contested Standards" Objection:** This is where your specific point destroys this thesis. If the figure was criticized by contemporaries (e.g., abolitionists, indigenous leaders, rival politicians), then the knowledge *was* available. They weren't ignorant of the controversy; they chose a side.
      *   *Counter-move:* Your uncle might argue, "Yes, but the *majority* standard was X."
      *   *Rebuttal:* Moral truth isn't democratic. If a minority contemporary voice was correct, the "majority standard" defense fails.
  *   **Verdict:** **False in this specific case.** Given your historical detail, this reading of the slogan is factually incorrect.

  ### 3. The Culpability Distinction: "Wrong Act, Blameless Agent"
  **The Claim:** We can judge the *actions* as wrong by timeless standards, but we cannot hold the *agent* responsible. We separate objective wrongness from subjective culpability.
  *   **Philosophical Status:** **Defensible and Common.** This is a standard distinction in ethics. We can say "Slavery was wrong in 1750" (Objective) while saying "This specific slave owner was a product of their system and not personally monstrous" (Subjective).
  *   **Does it save the statue?** **Weakly.** It protects the *person* from being called a villain, but it admits the *values* they embodied were flawed.
  *   **The Statue Problem:** Statues in main squares are usually honorific. If we admit the values were flawed (even if the person wasn't "evil"), does the statue still belong in a place of honor? This reading allows you to say: "We agree he isn't a monster, but we no longer honor the specific political project he represents."
  *   **Verdict:** **Substantive and Defensible,** but it concedes the moral ground that the statue might be problematic.

  ### 4. The Methodological Claim: "Contextualize Before Condemning"
  **The Claim:** This is not a moral claim but a historical one. You cannot accurately judge an action without understanding the constraints, incentives, and meanings of the time.
  *   **Philosophical Status:** **Platitude.** Historians and ethicists agree: context matters. Judging without context is caricature.
  *   **Does it save the statue?** **No.** Understanding *why* he did it doesn't mean we must *celebrate* what he did. It prevents shallow criticism, but it doesn't preclude deep criticism.
  *   **Verdict:** **True but Irrelevant.** It demands nuance, not immunity.

  ### 5. The Pragmatic Claim: "Temporal Humility"
  **The Claim:** Future generations will judge us by standards we cannot yet conceive. If we tear down statues now, they may tear down ours later. We should be humble about our own moral certainty.
  *   **Philosophical Status:** **Heuristic Wisdom.** This is a practical warning against moral hubris, not a claim about truth.
  *   **Does it save the statue?** **Yes, pragmatically.** It argues for stability and against "purges."
  *   **Verdict:** **Defensible.** However, it can be used to defend *anything*. It risks moral paralysis (we can never change symbols because the future might disagree).

  ---

  ### Two Crucial Complications You Raised

  #### A. The "Monolithic Era" Assumption
  You asked: *Does the slogan quietly assume that each era has one settled moral standard?*
  **Yes, it does.** This is historically naive.
  *   **The Problem:** The slogan treats "1750" as a single moral agent. In reality, every era has dominant, dissenting, and suppressed moral voices.
  *   **Why it matters:** If your uncle uses the slogan, he is implicitly arguing that the *dominant* power structure defines the "standards of the time."
  *   **The Counter:** If the figure was criticized by contemporaries, then "the standards of his time" were **plural**. He adhered to *one* standard (the dominant/oppressive one) and rejected another (the dissenting/humanitarian one).
  *   **Conclusion:** The slogan is incoherent if it implies there was only *one* standard. A more precise version would be: "He should be judged by the standards of the *dominant culture* of his time." But that admits he sided with the oppressors against the dissenters, which weakens the defense of the statue.

  #### B. The Function of Commemoration
  You asked: *Does anything change depending on what commemoration even is?*
  **Yes, this is arguably the most important philosophical variable.**
  *   **Statues as History (Pedagogical):** If the square is an open-air museum, the statue stays. It teaches us "this is who we were."
      *   *Uncle's Argument:* Works best here. "We keep it to remember history."
  *   **Statues as Honor (Normative):** If the square is a civic space celebrating shared values, the statue is an endorsement.
      *   *Uncle's Argument:* Fails here. If we no longer share the values (even if we excuse the man), the endorsement is inappropriate.
  *   **The Consensus:** There is no settled consensus on what public statues *are*. However, political philosophers generally agree that **public space is normative.** Placing a statue in a "Main Square" is inherently honorific, unlike placing it in a museum.
  *   **The Move:** If your uncle wants to keep the statue in the *square*, he must argue for the **Honor** view (we still honor him) or the **History** view (squares are for history).
      *   If he argues **History**: Why not move it to the museum where there is context?
      *   If he argues **Honor**: Is he willing to honor the specific colonial values the figure represents?

  ---

  ### Summary Menu for Your Uncle

  When you speak to him, you can offer this breakdown. It shows you aren't just rejecting his point, but refining it.

  1.  **"Are you saying morality changes?"** (Meta-Ethical)
      *   If yes, ask him to defend why morality depends on the calendar.
  2.  **"Are you saying he couldn't know better?"** (Epistemic)
      *   If yes, point out the contemporaries who criticized him. He *could* know better; he chose not to.
  3.  **"Are you saying he isn't to blame, even if it was wrong?"** (Culpability)
      *   If yes, agree he might not be a "villain," but ask if we still honor people whose projects we now reject.
  4.  **"Are you saying we should be humble?"** (Pragmatic)
      *   If yes, agree humility is good, but ask if humility requires freezing our public symbols in place forever.
  5.  **"What is the statue for?"** (Function)
      *   If it's for **History**, the museum is the better location (more context).
      *   If it's for **Honor**, do we still honor the values he fought for?

  **The "Settled" vs. "Disputed" Cheat Sheet:**
  *   **Settled:** Moral relativism (morality changes by era) is a minority view; historical eras are not morally monolithic.
  *   **Disputed:** The distinction between blaming the agent vs. condemning the act; the precise function of public monuments (honor vs. history).

  **The Strongest Counter-Argument:**
  The "Standards of their time" argument collapses when "their time" included people saying, "This is wrong." If the figure chose to ignore the moral critics of his own day to uphold an oppressive status quo, judging him by "the standards of his time" simply means judging him by the standards of the *winners* of his time. Moving the statue isn't judging him by 2024 standards; it's siding with the dissenters of *his* time against the dominant power structure of *his* time.
