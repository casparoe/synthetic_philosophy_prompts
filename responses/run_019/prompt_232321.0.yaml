answer: |-
  You press me upon the apparent contradiction between my defence of individual liberty and my defence of Company rule in India. It is a question I have put to myself, sir, and I do not shy from the answer. You quote my principle correctly: that power over a member of a civilized community is only warranted to prevent harm to others. But you omit the crucial qualification I have always attached to it. That principle applies only to human beings in the maturity of their faculties.

  We do not leave children to the absolute freedom of the market or the ballot box. We do not allow a man to sell himself into slavery, for liberty means the freedom to choose, not the freedom to extinguish the capacity for choice. There are states of society in which the whole race, or the great majority of it, is in a state of comparative childhood. In such cases, despotism is a legitimate mode of government, provided the end be their improvement, and the means actually employed are effective for that end.

  You ask why I draw the line here, and why a domestic paternalist cannot draw it around the poor of England. The distinction lies not in the wealth of the individual, but in the character of the society in which he finds himself.

  Consider the English labourer. He is poor, perhaps uneducated. But he lives within a constitution of liberty. He is surrounded by free institutions, by a press that may speak, by associations he may join, by a law that treats him as a rights-bearing subject. His poverty is a calamity, yes, and an obstacle to his full development, but it is not a disqualification from citizenship. To deny him liberty on the grounds of his poverty would be to condemn him to stagnation. It would be to remove the very ladder by which he might climb. The English poor are part of a progressive nation; their energies, if unleashed, contribute to the general utility. To treat them as wards of the state would be to crush the spirit of self-reliance upon which all social improvement ultimately depends.

  India stands upon different ground. It is not merely a case of poverty; it is a case of social stagnation. The structures of caste, the absence of a public sphere, the history of conquest upon conquest—these have created a society where the individual is swallowed by the custom. There is no native middle class yet capable of sustaining representative institutions. There is no tradition of public debate. In such a condition, liberty would not be liberty; it would be anarchy, or merely the freedom of the strong to oppress the weak under the guise of ancient custom.

  The British rule in India—I speak of the Company's rule, which is now under threat—is not an end in itself. It is a trusteeship. It is a despotism, I grant you, but it is a benevolent despotism aimed at creating the conditions under which liberty might one day flourish. We build roads, yes, but we also build schools. We enforce order, but we also abolish *sutti* and suppress thugs. We are teaching a people how to be governed, so that they may eventually govern themselves.

  To withdraw this authority now, to hand India over to the Crown—which means handing it to Parliament, and that means handing it to ignorance and political patronage—would be a dereliction of duty. The Crown does not understand India. The Crown sees revenue and strategy. The Company, for all its faults, has been a school of statesmen. We have examined, we have deliberated, we have ruled with an eye to the long-term improvement of the subject.

  You ask if this is paternalism. It is. But it is the paternalism of the guardian toward the minor, not of the master toward the slave. The test is this: Are we ruling for our own benefit, or for theirs? If the measure of our success is the eventual capacity of the Indian people to stand alone, then the rule is justified by the utility of mankind. If we rule merely to extract wealth, then it is tyranny. I have spent thirty years ensuring it is the former.

  So, sir, the line is drawn at capacity. The English poorman has the capacity because the society around him is free. The Indian subject does not yet have it, because the society around him is bound. To treat them alike would be to misunderstand the very nature of progress. Liberty is a goal, not a starting point for all nations equally. To give the sword of liberty to a child is not kindness; it is negligence. And I will not be negligent of the trust placed in me.
