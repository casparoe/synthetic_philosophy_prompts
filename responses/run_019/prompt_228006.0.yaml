answer: |-
  This is a **dispute about what probability or self-locating uncertainty could be in a deterministic branching universe** (your second option), which has calcified into a superficial disagreement about decision-theoretic axioms.

  While the debate is conducted in the language of rationality and axioms (the Deutsch–Wallace programme), the stalemate persists because the two factions are operating with incompatible pre-theoretic commitments regarding **personal identity** and **epistemic access**. The Deutsch–Wallace (DW) argument attempts to derive the *functional role* of probability from norms of rationality, effectively treating probability as a concept defined by how agents *ought* to act. The critics, however, treat probability as requiring an *epistemic ground* (genuine ignorance of alternative outcomes) that they do not believe exists in a deterministic multiverse where all outcomes occur.

  Because the DW axioms (such as Diachronic Consistency or Branching Indifference) appear "innocent" only if one already accepts a specific metaphysical picture of how an agent relates to their future branches, the critics are correct that the derivation is not neutral. However, the proponents are correct that without some normative constraints, the concept of probability in MWI remains empty. The disagreement is not technical (the math is sound) nor purely about rationality (the axioms are not self-evident bedrock); it is about whether **normative constraints can substitute for metaphysical grounding.**

  ### Why this diagnosis fits the stalemate
  1.  **The Incoherence Worry is Primary:** The quantitative worry (why Born rule?) cannot be genuinely resolved until the incoherence worry (what is uncertain?) is settled. The DW programme attempts to solve both simultaneously by defining uncertainty via rational action. Faction B rejects this move, insisting that uncertainty must be established *before* rational action can be prescribed.
  2.  **Axioms as Proxies:** The arguments about "circularity" in the axioms are proxies for deeper disagreements about identity. For example, "Branching Indifference" assumes an agent does not care about the mere fact of branching. This is plausible if you view branches as irrelevant to identity, but questionable if you view branching as a form of death or duplication that warrants specific epistemic treatment.
  3.  **No New Formal Result Will Help:** Since both sides accept the Hilbert space structure, a new theorem cannot bridge the gap between "is" (unitary evolution) and "ought" (betting preferences) without additional philosophical premises.

  ### What Counts as Progress
  Progress in your reading group should not be measured by one side convincing the other that the DW axioms are circular or valid. Instead, progress would consist of **an independently motivated theory of self-locating uncertainty.**

  You should shift the discussion away from decision theory and toward the metaphysics of identity and ignorance. Specifically, look for accounts that explain *why* a pre-measurement agent is ignorant of which branch they will inhabit, without relying on decision-theoretic conclusions to justify that ignorance. Promising avenues include:
  *   **Subjective Uncertainty Accounts:** (e.g., Saunders, Vaidman) Arguing that even with full knowledge of the wavefunction, an agent lacks self-locating knowledge of *which* branch copy they are.
  *   **Ignorance of Future Indexicals:** Analyzing whether the deterministic nature of the global wavefunction precludes local indexical uncertainty.
  *   **Structuralist Accounts:** Examining whether the structure of the Hilbert space itself imposes a measure that can be interpreted epistemically without invoking rationality.

  If such a theory can be motivated independently of the Born rule, the Quantitative Worry becomes less acute, and the DW axioms can be evaluated on whether they preserve that independent notion of uncertainty, rather than creating it ex nihilo.

  ### A Caveat on Expectations
  If the group finds that no such independent theory of self-locating uncertainty is viable—that is, if it turns out that "uncertainty" in MWI *cannot* be grounded without already assuming the Born rule or decision-theoretic norms—then you must retreat to the third option: **a bedrock clash about what rationality requires.**

  In that scenario, no further progress should be expected. The disagreement would then be recognized as a divergence in fundamental philosophical temperament: one side accepts a **functionalist** definition of probability (it is what rational agents use), while the other demands a **primitivist** or **epistemic** definition (it is a feature of the world/knowledge relation). If this is the case, the diagnosis is that the Everett interpretation requires a philosophical commitment that is not forced by the physics, and the group should acknowledge that the "probability problem" is not a puzzle to be solved, but a price to be paid for adopting the interpretation.
