      *   The DW program says "Incoherence is a pseudo-problem; just look at how rational agents act." Critics say "Action presupposes the very uncertainty you claim to derive."
      *   So, the diagnosis is: **A dispute about the metaphysics of probability (specifically self-locating uncertainty), disguised as a normative dispute about rationality.**
      *   Progress: **An independently motivated theory of self-locating uncertainty.** (This addresses the Incoherence worry directly, making the Quantitative worry less acute).

  7.  **Final Polish:**
