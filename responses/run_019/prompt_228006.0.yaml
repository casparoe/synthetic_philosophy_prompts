          3.  Bedrock clash about rationality (argument-proof).
      *   **Requirement:** Based on the diagnosis, specify what counts as progress (sharper theorem, new theory of uncertainty, recognition of ill-posedness, or no progress expected).

  2.  **Deconstruct the Disagreement:**
