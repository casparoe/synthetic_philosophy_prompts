          *   However, DW claims to derive the *functional role* of probability regardless of metaphysics. Critics say the functional role presupposes the metaphysics.

      *   *Option 3: Bedrock Clash about Rationality?*
          *   This is the deepest layer. DW says "Rationality *requires* X." Critics say "Rationality *allows* Y."
