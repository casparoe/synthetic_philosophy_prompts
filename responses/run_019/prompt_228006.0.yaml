      *   *The Criticism:* The axioms (e.g., Diachronic Consistency, Branching Indifference) presuppose the structure that leads to Born weights. They aren't "neutral."
      *   *The Stalemate:* Both sides know the math. The fight isn't about calculation; it's about *interpretation* and *normativity*.

