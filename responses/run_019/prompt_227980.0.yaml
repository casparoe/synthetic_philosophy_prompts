answer: |-
  My dear friend,

  You bring me a vision of a future that sounds like a fairy tale told by a mechanist. A device in the hand of a peasant girl that holds all the operas of Europe and can sing back to her in her own voice? I must take your word for the existence of such a machine, though it chills me to imagine it. You ask me if the injustice I described in *What is Art?*—this theft of the labourer's life to feed the idleness of the cultured—has been rectified because the labourer is now drowning in the same spiritual food as the critic.

  I tell you plainly: No. The problem is not solved. It has merely changed its shape, and I fear it has become more dangerous.

  You misunderstand the nature of my complaint. You think I argued that the peasant should have access to the opera. I did not. I argued that the opera, as it is currently constituted, is not food at all. It is a delicacy seasoned to spoil the appetite. When I spoke of the "division of products" being one-sided, I did not mean that the peasant was unfairly denied access to Wagner or Baudelaire. I meant that the peasant was denied access to *true* art, while the cultured classes consumed a counterfeit product and called it divine.

  If you give a starving man poison, you have not solved the problem of hunger; you have only made his death more equitable.

  Let us look at this girl, this daughter of the dairy farmer. You say she consumes more art in a week than a Petersburg critic did in a year. If by "art" you mean the operas and symphonies I have denounced, then she is consuming more *counterfeit* feeling. She is being infected with emotions that are not hers, created by men who live lives of idleness and lust, separated from the true labour of existence. That she can access them on a cheap device does not unite her with humanity; it isolates her in a fantasy. She sits alone with her machine, listening to sounds that mean nothing to her toil, nothing to her relationship with God and her neighbour. This is not union; it is a narcotic.

  But it is this "program" you describe that troubles me most. You say it composes a song about her morning, sung in a voice like hers. I ask you: Who feels the morning?

  Does the machine feel the cold air on the girl's face as she milks the cow? Does it feel the ache in her back? Does it feel the love she might have for her father, or the weariness in her bones? No. It is a box of gears and electricity. It has no soul. It has not lived.

  In my view, art is the deliberate transmission of lived feeling. One man must feel, and through signs—words, sounds, colours—infect another with that feeling. The most important condition of all is **sincerity**. The artist must truly feel what he transmits.

  This program you describe is the ultimate counterfeit. It mimics the signs of feeling without the feeling itself. It is a lie. It produces the exterior of a song without the interior of a human experience. If the girl listens to this, she is not connecting with another human being; she is connecting with a mirror that reflects nothing but her own data. It is spiritual masturbation. It gives her the sensation of being understood without the reality of being known by another soul.

  So, to be concrete, as you ask:
  The opera on the phone? **Counterfeit.** It is exclusive, obscure, and lacks religious perception.
  The song generated by the program? **Counterfeit.** It is produced by a mechanism incapable of sincerity. It is a deception.
  If the girl, putting down the phone, sings a melody she invents herself to express her joy or her sorrow, and her father hears it and feels that joy or sorrow? **That is Art.**

  You say the division of products is no longer one-sided because the labourer now has the goods. I say the goods are worthless. The injustice was never that the peasant could not hear the symphony. The injustice was that the cultured classes convinced the world that the symphony was necessary for salvation, while ignoring the simple, clear art that unites the peasant and the king in brotherhood.

  Now, you propose a future where everyone is isolated in a bubble of personalized noise, generated by machines that feel nothing. You call this democratization. I call it the universalization of loneliness.

  The problem I named was not about distribution. It was about truth. And until your machine can suffer, labour, and love, it cannot produce art. It can only produce a distraction from the real business of life.

  Yours in truth,
  Leo Tolstoy
