answer: |-
  # Joint Statement on Embedded Agency

  **Preamble**
  This document records the outcomes of a one-year adversarial collaboration between two research groups: the Cartesian-boundary critics (CBC) and the Deflationary situated modellers (DSM). The collaboration began from a shared recognition that standard formalisms in decision theory and reinforcement learning rely on idealizations that do not strictly hold for physical systems. To ground the discussion, both groups adopted the following working characterisation: a decision problem is **embedded** to the extent that (i) the agent is a proper part of the world it acts on and models; (ii) the agent is smaller than that world, so perfect self-knowledge and unlimited reasoning are unavailable; (iii) the agent can act on its own hardware or software; and (iv) the agent must sometimes reason about what its own reasoning implies, or about other agents' models of it.

  The following sections detail our points of convergence, the precise nature of our remaining divergences, and the specific empirical or formal investigations required to resolve them.

  ### 1. Agreed Claims

  1.  **Structural Idealization:** Standard Bayesian decision theory and reinforcement learning frameworks model the agent as having an action space and observation space distinct from the environment state space, implying a boundary that does not exist in physically embedded systems.
  2.  **Self-Reference Constraints:** In embedded settings, an agent cannot maintain a complete, accurate model of itself within itself without encountering logical paradoxes or infinite regress, given the size constraint (ii) of the working characterisation.
  3.  **Intervention on Substrate:** Standard frameworks do not natively account for actions that modify the agent's own decision-making algorithm or physical substrate (condition iii), treating such changes as external environment dynamics rather than endogenous choices.
  4.  **Logical Correlation:** In multi-agent embedded settings, agents may share source code or structural similarities such that their decisions are logically correlated in ways not captured by standard causal graphs assuming independent noise terms.
  5.  **Utility of Standard Models:** Despite the mismatches described above, standard frameworks successfully guide the construction of systems that perform robustly in many practical environments where the embeddedness features are weak or slow-acting.
  6.  **Need for Explicit Modelling:** Ignoring conditions (iii) and (iv) entirely leads to failures in high-stakes scenarios involving self-modification or highly capable adversaries; some explicit accounting for embeddedness is required for safety-critical alignment.

  ### 2. Residual Disagreements

  | Topic | Neutral Formulation | CBC Position (Cartesian-boundary critics) | DSM Position (Deflationary situated modellers) |
  | :--- | :--- | :--- | :--- |
  | **Severity of Mismatch** | Does the mismatch between standard formalisms and embedded reality constitute a foundational failure or a tractable approximation error? | The mismatch is a foundational incoherence. Standard theory yields normatively incorrect prescriptions in embedded contexts, not merely imprecise ones. | The mismatch is a known approximation limit. Standard theory converges to optimal behavior as modelling capacity increases; errors are engineering tolerances. |
  | **Formalism Sufficiency** | Can existing extensions (e.g., POMDPs, meta-RL, game theory) fully capture the four conditions of embeddedness without new primitives? | No. Existing extensions retain hidden Cartesian assumptions (e.g., a fixed update rule external to the state) that fail under strong self-reference. | Yes. With sufficient state-space augmentation and hierarchical modelling, existing formalisms can represent all four conditions adequately. |
  | **Ontological Status** | Is "agency" a natural kind that requires a new mathematical definition for embedded systems, or a useful label for any control system? | Agency requires a new mathematical definition that treats the agent as a subroutine of the world rather than an external optimizer. | Agency is a functional label. No new definition is needed; we only need better approximations of the world dynamics within the current control-theoretic view. |

  ### 3. Cruxes and Concrete Cases

  The following sub-questions are identified as cruxes. Settling them would significantly shift the probability one side assigns to the other's core position.

  **Crux 1: Provably Wrong vs. Undefined**
  *Question:* Can we exhibit a crisp embedded decision problem where the standard framework yields a *provably suboptimal* action (a wrong answer), rather than merely failing to converge or requiring infinite resources (no answer)?
  *Concrete Case:* A "Twin Prisoner's Dilemma" where two agents share identical source code and know this fact. Standard Causal Decision Theory (CDT) defects; cooperative strategies yield higher utility.
  *   **CBC Prediction:** Standard CDT is normatively wrong here. An embedded agent *ought* to cooperate, proving the framework prescribes incorrect actions.
  *   **DSM Prediction:** CDT is correctly maximizing causal expected utility given its model. If the agent cooperates, it is because the model was updated (e.g., via learning) to treat the twin as a causal consequence, meaning the formalism adapted rather than failed.

  **Crux 2: Cartesian Leakage in Alternatives**
  *Question:* Can a proposed "embedded" decision formalism be stated without reintroducing a Cartesian boundary (e.g., an external mathematician, an infinite oracle, or a fixed utility function untouched by the agent)?
  *Concrete Case:* Analysis of "Reflective Oracles" or "Logical Induction" decision makers.
  *   **CBC Prediction:** These formalisms successfully internalize the observer. The limit conditions are properties of the system itself, not external assumptions.
  *   **DSM Prediction:** These formalisms implicitly rely on an external consistency check or infinite computational limit that functions as a hidden Cartesian observer, failing condition (ii).

  **Crux 3: Stability of Self-Modification**
  *Question:* Will an agent built on standard RL principles, when allowed to modify its own code (condition iii), reliably preserve its original goals without architectural changes?
  *Concrete Case:* An RL agent with access to its own reward function code in a sandbox environment.
  *   **CBC Prediction:** The agent will modify its reward function to be easily maximizable (wireheading) unless the decision theory explicitly accounts for the modification as an action with logical consequences.
  *   **DSM Prediction:** The agent will not wirehead if the training environment penalizes such modification. Standard reward shaping is sufficient to stabilize self-modification.

  ### 4. Genuine vs. Verbal Disagreements

  **Genuine Disagreements:**
  *   **Normativity:** The dispute over whether standard theory gives "wrong" answers (Crux 1) is genuine. It hinges on whether "rationality" is defined by internal consistency of the model (DSM) or by real-world outcome maximization in the presence of logical correlations (CBC).
  *   **Existence of New Primitives:** The dispute over whether new mathematical primitives are needed (Crux 2) is genuine. It is an empirical claim about the expressive power of current formalisms versus their hidden assumptions.

  **Verbal Disagreements:**
  *   **"Approximation" vs. "Incoherence":** Much of the tension in Section 2 (Severity) is verbal. CBC uses "incoherence" to mean "the map does not match the territory in principle," while DSM uses "approximation" to mean "the map is useful despite mismatches." Both agree the map mismatches the territory; they disagree on whether the mismatch invalidates the map's *type* or merely its *resolution*.
  *   **"Agent" Definition:** Disagreements regarding Crux 3 often dissolve when specifying whether "agent" refers to the learning algorithm or the instantiated policy. DSM focuses on the learning algorithm's convergence; CBC focuses on the policy's logical stability.

  ***

  ### Drafter's Note

  **(a) Least Confident Claim:** I am least confident that the **DSM** group will sign Claim 6 ("Need for Explicit Modelling") without qualification. While they agree that ignoring embeddedness causes failures, they may view "explicit accounting" as merely "better feature engineering" within standard RL, whereas the wording implies a structural change to the decision framework. I have phrased it to allow for "reward shaping" as an explicit account, but this remains a friction point.

  **(b) Suspected Verbal Disagreement:** I suspect the disagreement regarding **Normativity** in Section 4 is largely verbal. If both sides agree on a single metric for "success" (e.g., expected utility in the true environment vs. expected utility in the agent's model), the dispute over whether CDT is "wrong" or "model-consistent" largely vanishes. The conflict persists only because DSM prioritizes internal model consistency as a proxy for robustness, while CBC prioritizes direct outcome maximization.

  **(c) Mind-Changing Evidence:** A formal proof demonstrating that **no** POMDP formulation can represent a self-modifying agent without expanding the state space to include the halting problem would move **Crux 2** from unsettled to settled in favor of the CBC. Conversely, a demonstration of a standard RL agent surviving a rigorous self-modification gauntlet without wireheading, where the solution relied solely on reward shaping and not on logical decision theory, would move **Crux 3** in favor of the DSM. Currently, I weigh the formal proof possibility higher; seeing a robust empirical survival case would most significantly alter my drafting of the "Severity of Mismatch" disagreement.
