answer: |-
  # Activity Plan: The Propagation Protocol

  ## Overview
  **Title:** The Propagation Protocol  
  **Time:** 80 minutes  
  **Class Size:** 16 students (scalable)  
  **Core Concept:** Cultural items spread via differential replication (fidelity, fecundity, longevity), not via truth or utility.  
  **Key Constraint:** Do not use the word "meme" or "Darwinian" until the debrief. Refer to items as "Artifacts" or "Strings."

  ## Learning Objectives
  By the end of this session, students will be able to:
  1.  Distinguish between *selection* (differential survival of variants) and *drift* (random error).
  2.  Explain how an item's "fitness" depends on its copyability, not its truth value.
  3.  Identify the three requirements for evolution by natural selection in a cultural context: variation, heredity, and differential fitness.

  ---

  ## Preparation (Instructor)
  **Materials to Print:**
  1.  **Artifact Cards (4 Types):** 20 cards total (5 of each type). See *Handout 1*.
  2.  **Transmission Logs:** 1 per student. See *Handout 2*.
  3.  **Scoreboard:** Whiteboard or projected spreadsheet to track frequencies.
  4.  **Dice:** 1 six-sided die per student (or shared between pairs).

  **Room Setup:**
  *   Arrange chairs in a large open circle or cluster to allow mingling.
  *   Project a timer visible to all.

  **The Artifacts (Design Logic):**
  *   **Type A (High Fidelity):** Short, neutral, easy to spell. (e.g., "RED BOX")
  *   **Type B (High Emotion):** Alarmist, triggers urgency. (e.g., "WARNING: DO NOT SHARE")
  *   **Type C (High Complexity):** Long, useful information, hard to copy. (e.g., "The meeting is at 3 PM in room 4B bring a pen")
  *   **Type D (High Catchiness):** Rhyming, nonsense, rhythmic. (e.g., "ZIP ZAP ZOOM GO")

  ---

  ## Session Timeline (80 Minutes)

  ### 1. Introduction & Rules (10 Minutes)
  *   **Hook (2 min):** Tell students they are participating in a simulation of information flow. Their goal is to maximize their personal score.
  *   **Distribute Materials (3 min):** Give each student one **Artifact Card** (randomly distributed, 4 of each type) and a **Transmission Log**.
  *   **Explain Rules (5 min):**
      *   **Goal:** You earn 1 point for every person holding a copy of *your current Artifact* at the end of the game.
      *   **Rounds:** There will be 3 Rounds (5 minutes each).
      *   **Transmission:** In each round, you must approach at least two other people. Offer them your Artifact.
      *   **Adoption:** They can accept your Artifact (replacing their old one) or keep theirs.
      *   **Fidelity Check:** If they accept, they must copy the text onto their Log. They roll a die. If they roll a **1**, they must introduce one small error (change a letter, add a word, delete a word). This creates a **New Variant**.
      *   **Constraint:** You can only hold one Artifact at a time. If you adopt a new one, discard the old card.

  ### 2. The Simulation (45 Minutes)
  *   **Round 1 (15 min):**
      *   Students mingle and trade.
      *   Instructor monitors the "Mutation" rule (ensure dice are rolled on adoption).
      *   **Stop:** At 10 minutes, call "Freeze."
      *   **Census:** Ask students to raise hands for which *Type* (A, B, C, or D) they hold. Tally on the board. Do not discuss yet.
      *   **Reset:** Students keep their current card. Start Round 2.
  *   **Round 2 (15 min):**
      *   Repeat process. Emphasize: "Check your score potential. Are you holding a winner?"
      *   **Census:** Tally frequencies on the board again.
  *   **Round 3 (15 min):**
      *   Final round. Encourage aggressive trading if they are holding a "losing" Artifact.
      *   **Final Census:** Tally final frequencies. Collect Transmission Logs.

  ### 3. Data Analysis (10 Minutes)
  *   Hand out a summary sheet showing the starting frequencies (4 of each) vs. ending frequencies.
  *   Ask students to calculate the "Growth Rate" of each Type.
  *   Ask them to look at the Transmission Logs to see how many variants (mutations) appeared for each Type.

  ### 4. Debrief & Theory Connection (15 Minutes)
  *   **Step 1: The Results.** Ask: "Which Type won? Why?"
      *   *Expected Answer:* Type A (easy to copy) or Type D (catchy) usually wins. Type C (complex) usually dies out. Type B (warning) might spread fast but often gets discarded because it says "Do Not Share."
  *   **Step 2: The Mechanism.** Ask: "Did anyone stand back and judge which Artifact was 'true' or 'useful'?"
      *   *Point:* No. The spread was driven by *your* desire to get points, which aligned with the *Artifact's* ability to get copied.
  *   **Step 3: The Vocabulary.** Now introduce the terms.
      *   **Variation:** The mutations introduced by the dice roll.
      *   **Heredity:** The copying process from person to person.
      *   **Differential Fitness:** Some Artifacts left more copies than others.
      *   **The Meme:** Define the Artifact as a "meme" (in the Dawkins sense): a unit of cultural transmission that replicates.
  *   **Step 4: The Takeaway.** Cultural evolution doesn't require a designer. It requires replication with variation and selection.

  ---

  ## Student Handout 1: Artifact Cards
  *(Print these on card stock. Cut into individual slips.)*

  **TYPE A (High Fidelity)**
  > RED BOX
  > *(Keep this text exact)*

  **TYPE B (High Emotion)**
  > WARNING: DO NOT SHARE
  > *(Keep this text exact)*

  **TYPE C (High Complexity)**
  > The meeting is at 3 PM in room 4B please bring a blue pen
  > *(Keep this text exact)*

  **TYPE D (High Catchiness)**
  > ZIP ZAP ZOOM GO
  > *(Keep this text exact)*

  ---

  ## Student Handout 2: Transmission Log
  *(One per student)*

  **THE PROPAGATION PROTOCOL**

  **Name:** ___________________

  **Instructions:**
  1.  **Current Artifact:** Write the text of the card you are currently holding.
  2.  **Trading:** When you trade with a partner, record the transaction below.
  3.  **Mutation Rule:** If you adopt a new Artifact, roll a die.
      *   **Roll 2–6:** Copy the text exactly.
      *   **Roll 1:** You **MUST** change one letter or word (e.g., "RED" becomes "BED"). This is a **Variant**.

  | Round | Partner Name | Did you adopt their Artifact? (Y/N) | Did you mutate it? (Y/N) | New Text (if adopted) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | | | | |
  | 1 | | | | |
  | 2 | | | | |
  | 2 | | | | |
  | 3 | | | | |
  | 3 | | | | |

  **Final Score Calculation:**
  At the end of the game, count how many people (including yourself) are holding the *same* text as you.
  **My Score:** _______ points.

  ---

  ## Debrief Guide (Instructor Notes)

  **Questions to drive the discussion:**
  1.  "Look at the board. Type C contained the most 'useful' information (meeting time). Why did it likely perform poorly?"
      *   *Concept:* **Cost of Copying.** High complexity reduces fidelity.
  2.  "Did anyone hold Type B ('Do Not Share')? Did it spread? Why or why?"
      *   *Concept:* **Content vs. Context.** The content says 'stop,' but the structure is emotional. Sometimes emotion overrides utility.
  3.  "If you mutated a text (e.g., 'RED BOX' to 'BED BOX'), did that new version spread? Why not?"
      *   *Concept:* **New Variants need time.** Most mutations are neutral or deleterious and go extinct quickly.
  4.  "Who decided which Artifact was the 'best'?"
      *   *Concept:* **No Designer.** The environment (the rules + student psychology) selected the winner, not a judge.

  **Key Definitions to Reveal:**
  *   **Replicator:** The Artifact (the information pattern).
  *   **Vehicle:** The Student (the brain/host carrying the information).
  *   **Fitness:** The number of copies left in the next generation.

  ---

  ## Troubleshooting: What Will Go Wrong
  **1. The "Conspiracy" Problem:**
  *   *Issue:* Students might realize that if they all agree to hold the same card, everyone gets max points. They might collude to ignore the rules.
  *   *Fix:* Announce at the start: "If I detect collusion, all scores are voided. You must act in your own self-interest." Remind them that in real culture, people don't coordinate perfectly.
  *   *Backup:* If they collude, use it in the debrief. "Real cultural evolution is messy because humans can conspire. This game shows what happens when they *don't*."

  **2. The Mutation Stall:**
  *   *Issue:* Students forget to roll the die or refuse to mutate because they want to keep the text "pure."
  *   *Fix:* Walk around during Round 1. Aggressively check dice rolls. "Did you roll? Show me. If you rolled a 1, you *must* change a letter." Frame mutation as a rule compliance issue, not a creative one.

  **3. The "Bored Trader" Problem:**
  *   *Issue:* Students find a "good" card early and stop trading, sitting quietly for the rest of the round.
  *   *Fix:* Add a rule: "You must attempt to trade with at least two new people per round." This ensures the "selection pressure" is applied repeatedly.

  **4. Ambiguous Scoring:**
  *   *Issue:* Counting exact matches at the end takes too long if everyone mutated slightly.
  *   *Fix:* Group variants by "Family." If someone has "RED BOX" and another has "BED BOX," count them as the same *Family* for the broad debrief, but distinguish them for the fidelity point. Keep it simple: Count exact matches for the score, but discuss families for the theory.

  ---

  ## Limitations: What This Game Cannot Capture
  *In the final 5 minutes, you must explicitly state what the simulation leaves out so students don't over-apply the model.*

  1.  **Blind Variation:** In the game, mutation is random (dice roll). In reality, cultural variation is often *biased* (we change things on purpose to improve them). This is "guided variation," not just blind mutation.
  2.  **Vertical Transmission:** The game simulates horizontal spread (peer-to-peer). Real culture is often passed from parent to child (vertical), which changes the selection pressure (parents want what's good for the child, not just what copies well).
  3.  **Group Selection:** The game rewards individual scoring. Sometimes cultural traits spread because they help the *group* survive, even if they are costly to the individual (e.g., altruism). This game models "selfish" cultural evolution, not necessarily "pro-social" evolution.
  4.  **Meaning:** The Artifacts are meaningless strings. Real cultural items carry semantic weight. People reject ideas not just because they are hard to copy, but because they contradict deeply held beliefs (cognitive dissonance).

  ---

  ## Instructor Script Snippet (For the Debrief)
  *"You might feel like you were making choices out there. You were. But look at the aggregate data. The 'RED BOX' didn't win because you liked the color red. It won because it survived the journey from brain to brain better than the long sentence. You weren't judging the truth; you were judging the transmissibility. In this room, for 45 minutes, you weren't just students. You were hosts. And the things you were carrying? Those were memes."*
