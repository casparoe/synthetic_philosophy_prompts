prompt: |-
  I'm teaching an undergraduate module on cultural evolution and want a hands-on session for the week on memes and Darwinian approaches to culture. The class is around 16 second- and third-years and I've got 80 minutes. I'd like a game or simulation that makes them feel the core idea — that culture can change through variation, copying, and differential survival, and that some cultural items spread because they're good at getting themselves copied rather than because they're true or useful. I specifically want them to see that the spread of a cultural item is explained by differential replication: how many copies it leaves, how faithfully they are copied, and how long they last — not by anyone standing back and judging the variants as better. I once ran a plain chain-whisper exercise and it fell flat, because there was only one variant and nothing for it to be selected among, so the students just concluded that people are bad at repeating things. I want to avoid that this time. Ideally the rules should set up several competing variants that differ in catchiness, emotional punch, length, or ease of reproduction, with small copying errors introduced each generation, and a scoring system that doesn't need real money but still gives everyone a reason to pass items on faithfully.

  Please design the full activity for me, including the rules and roles, how to organise the 80 minutes, what I'd need to print or prepare beforehand, and a debrief that moves from the students' own results to the Darwinian concepts of variation, heredity, differential fitness, and cumulative change — without me lecturing the point first. I'd also like a paragraph on what will predictably go wrong the first time I run it and how to handle it, and an honest note on what the game cannot capture about real cultural evolution and I'll have to supply in discussion. The students should not hear the label meme until the debrief if possible, and the payoff structure should make the selection logic emerge from a tally at the end rather than from me explaining it.

  Oh, and if you could write the answer, and any handout or slide text, in American English. My own notes use British spelling, so that's fine for the explanation you give me, but anything the students see should use American spelling and punctuation.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16 undergraduate students (2nd/3rd year).
      *   **Topic:** Cultural evolution, memes, Darwinian approaches (variation, copying, differential survival).
      *   **Core Concept:** Spread is due to differential replication (fidelity, fecundity, longevity), not truth/utility or top-down judgment.
      *   **Duration:** 80 minutes.
      *   **Constraints:**
          *   Avoid simple "telephone game" (needs competition/selection).
          *   Needs competing variants (catchiness, emotion, length, ease).
          *   Needs copying errors (mutation).
          *   Needs a scoring system (non-monetary incentive to copy faithfully).
          *   No "meme" label until debrief.
          *   American English for student-facing materials.
          *   Include: Rules/Roles, Timing, Prep, Debrief, Troubleshooting, Limitations.

  2.  **Deconstruct the Core Problem:**
      *   *Why did the whisper chain fail?* No selection pressure. Only drift/error.
      *   *What is needed?* Competition. Multiple items vying for limited "brain space" or "transmission slots."
      *   *How to simulate differential fitness?* Some items need to be inherently easier to copy or more appealing to pass on.
      *   *How to simulate fidelity?* Points for accurate copying.
      *   *How to simulate fecundity?* Points for successful transmission to others.

  3.  **Brainstorming the Activity:**
      *   *Idea 1: Card Game.* Players hold cards with phrases. Trade them. (Too abstract?)
      *   *Idea 2: Drawing Game.* Copy drawings. (Good for fidelity, hard to score quickly).
      *   *Idea 3: "Rumor Mill" / "Newsroom".* Students are nodes in a network. They receive "stories," choose one to pass on, and modify it slightly.
      *   *Selection:* Idea 3 seems strongest. It allows for competition (multiple stories circulating), mutation (writing it down introduces error), and selection (choosing which story to pass).
      *   *Refining Idea 3:* Let's call it "The Transmission Game."
      *   *Mechanism:*
          *   Students are arranged in a network (or generations).
          *   They start with different "cultural items" (short phrases/symbols).
          *   They have a budget of "transmission tokens."
          *   They earn points based on how many times their *current* item gets copied by others in the next round.
          *   Wait, the prompt asks for *them* to feel the logic of replication. If they are trying to maximize points, they will naturally choose the "fittest" items to copy.
          *   *Better approach:* They are *hosts*. Their goal is to have the item they are holding survive to the end. But they can only hold one item at a time. They must choose which incoming item to adopt.
          *   *Incentive:* You get points if the item you are holding at the end of the round is copied by someone else in the next round. This aligns individual incentive with the "selfish" logic of the cultural item.

  4.  **Developing the "Transmission Game" (Working Title: *Signal Flow*):**
      *   **Setup:** 16 students. Divide into 4 groups of 4 (or a network). Let's do "Generations" to make the Darwinian time-step clear. 4 Generations of 4 students.
      *   **Materials:** "Cultural Packets" (envelopes/cards) with different content.
          *   Type A: Simple, high fidelity (e.g., "Red Blue").
          *   Type B: Catchy/Emotional (e.g., "Free Money!").
          *   Type C: Complex/Useful but hard to copy (e.g., a math formula or long sentence).
          *   Type D: Nonsense but rhythmic (e.g., "Zib Zab Zoo").
      *   **Process:**
          *   Gen 1 gets initial packets.
          *   They copy the content onto a form and pass it to Gen 2.
          *   Gen 2 receives multiple options? No, that's hard to manage logistically in 80 mins.
          *   *Alternative:* Everyone starts with one. They mingle. They try to "infect" others.
          *   *Let's try a Tournament Style:*
          *   Round 1: 16 students. Each has a card. They pair up. They show cards. They must choose *one* card to copy onto a new sheet. The other is discarded.
          *   Add Mutation: When copying, roll a die. If 1, change one word/letter.
          *   Scoring: You get a point for every person who copies *your* card.
          *   This creates the "selfish gene" perspective. I want *my* card to spread. To do that, I must give you a card *you* want to copy.
          *   *Wait, simpler:* The students are the *vehicles*. The cards are the *replicators*.
          *   *Revised Plan:* "The Propagation Protocol."
          *   Students are assigned to be "Nodes."
          *   There are distinct "Ideas" (printed on cards).
          *   Ideas vary in copyability (length, rhyme, shock value).
          *   Students get points for every accurate copy of the Idea they are currently holding that appears in the next "Generation."
          *   This forces them to pick Ideas that *others* will want to copy, not necessarily what *they* like.

      *   *Let's refine the logistics for 16 students/80 mins:*
          *   **Phase 1: Introduction (10 min).** No theory. Just rules.
          *   **Phase 2: The Game (40 min).** 4 Rounds (Generations).
          *   **Phase 3: Data Analysis (15 min).** Tallying frequencies.
          *   **Phase 4: Debrief (15 min).** Connecting to theory.

      *   *The Mechanic:*
          *   Each student holds a "Token" (an Idea).
          *   In each round, they must pass their Token to 2 other people.
          *   The receivers must choose *one* of the Tokens offered to them to keep for the next round.
          *   Fidelity Check: They copy the text. If it matches exactly, the sender gets points. If it mutates, the new version enters the pool.
          *   *Problem:* Too much writing.
          *   *Solution:* Pre-printed slips. If you copy faithfully, you take a slip from the sender's pile. If you mutate, you write a new one.
          *   *Actually, let's make it about Selection Pressure.*
          *   Start with 4 distinct Ideas (A, B, C, D). 4 students get each.
          *   Round 1: Students mingle. They offer their Idea to others.
          *   Receivers can only hold one Idea. They must swap if they find a "better" one.
          *   "Better" is subjective, but the Ideas are designed to have different properties.
          *   *Crucial Twist:* The scoring is based on the *Idea's* survival, not the student's. But the student wants points. So the student must act in the interest of the Idea.
          *   *Simpler:* "The Copying Market."
          *   Students are paid (points) based on how many copies of their *current* phrase exist at the end of the game.
          *   They can trade phrases.
          *   They must copy phrases to trade them.
          *   Copying introduces errors (dice roll).
          *   This creates variation.
          *   Selection happens because some phrases are easier to copy (higher fidelity) or more desirable to hold (higher adoption).

      *   *Decision:* I will design a game called **"The Replication Race."**
      *   **Core Mechanic:** Students are hosts. They hold "Cultural Artifacts" (cards).
      *   **Goal:** Maximize personal score.
      *   **Score:** 1 point for every copy of your Artifact in circulation at the end of each round.
      *   **Transmission:** To get points, you must get others to adopt your Artifact.
      *   **Constraint:** You can only adopt an Artifact if you can copy it accurately (Fidelity pressure).
      *   **Variation:** Dice roll determines mutation during copying.
      *   **Selection:** Students will naturally gravitate toward Artifacts that are short, catchy, or easy to copy because those minimize mutation risk and maximize spread.

  5.  **Drafting the Content:**
      *   *Prep:* 4 types of cards (Simple, Complex, Emotional, Rhyming). Score sheets. Dice.
      *   *Timing:* 10 min intro, 45 min game (3 rounds), 25 min debrief.
      *   *Debrief:* Plot frequency over time. Discuss why Type A won (not because it's "true," but because it's copyable). Introduce "Meme."
      *   *Troubleshooting:* Students gaming the system, boredom, confusion on rules.
      *   *Limitations:* Real culture isn't just discrete particles; human agency is more complex; vertical vs. horizontal transmission.

  6.  **Refining the "American English" Constraint:**
      *   Ensure "color," "behavior," "program," "center," etc., are used in student handouts.
      *   Keep my explanation to the user in British English (as requested: "My own notes use British spelling, so that's fine for the explanation you give me"). *Wait, re-reading prompt:* "Oh, and if you could write the answer, and any handout or slide text, in American English." -> **Correction:** The user wants *everything* in American English. "My own notes use British spelling, so that's fine for the explanation you give me" implies *they* write in British, but they want *me* to write the answer in American.
      *   *Wait, let me parse that sentence again:* "Oh, and if you could write the answer, and any handout or slide text, in American English. My own notes use British spelling, so that's fine for the explanation you give me, but anything the students see should use American spelling and punctuation."
      *   *Interpretation:* The user is saying *they* use British spelling in their notes (which is fine/contextual), BUT they want *my output* (the answer) and *student materials* to be in American English. Okay, I will use American English for the entire response to be safe and consistent with the "handout/slide" requirement.

  7.  **Finalizing the Activity Design:**
      *   **Name:** *The Propagation Protocol.*
      *   **Concept:** Students compete to have their "string" be the most common at the end.
      *   **Variants:**
          1.  Short/Neutral ("Blue Box")
          2.  Long/Complex ("The Quick Brown Fox...")
          3.  Emotional/Alarm ("Danger: Do Not Open")
          4.  Rhyming/Catchy ("Zip Zap Zoom")
      *   **Mutation:** When passing a card, roll a d6. On 1, you must change one letter/word.
      *   **Selection:** Students choose whose card to accept. They want cards that will spread (to get points) but also cards that are easy to hold (low mutation risk).
      *   **Scoring:** End of game count.

      *Wait, one more check on the "Selection" logic.*
      If students get points for copies of *their* card, they will try to sell their card.
      If they accept a card, they become a vehicle for *that* card.
      To make the *Darwinian* point clear, the students should realize that *they* don't matter, the *card* matters.
      So, Score = Number of copies of the card you are holding at the end.
      This incentivizes them to dump bad cards and pick up "fit" cards.
      This perfectly models the "selfish meme" perspective.

  8.  **Structuring the Response:**
      *   Activity Overview.
