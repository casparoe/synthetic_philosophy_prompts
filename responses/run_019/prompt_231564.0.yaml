      *   **Interactive vs. Indifferent Kinds:** Quarks don't care if you call them quarks. People do.
      *   **Making Up People:** Classifications create new ways of being a person.
      *   **The 1973 DSM-II Change:** Homosexuality was listed as a sociopathic personality disturbance (1952), then sexual deviation (1968). In 1973, it was removed (replaced briefly by "Sexual Orientation Disturbance" for those distressed by it). Driven by gay activism (Gay Liberation Front, Gay Activists Alliance), internal dissent (Judd Marmor, Robert Spitzer), and empirical data (Evelyn Hooker).

  3.  **Drafting - Section by Section:**

