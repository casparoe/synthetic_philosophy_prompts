          *   *Self-understanding:* Internalized pathology. Gay men/women saw themselves through the psychiatric gaze (something is wrong with me).
          *   *Institutions/Therapy:* Aversion therapy, psychoanalysis. The treatment reinforced the classification.
          *   *Law:* The diagnosis legitimized sodomy laws, custody losses, immigration bans.
          *   *The Turn (Activism):* This is the crucial loop. Activists (Frank Kameny, Barbara Gittings) used the *language* of the classification to fight it. "We are not sick." They didn't just ignore the label; they engaged with it. This is *resistance looping*.

      *   **The Hard Part: Declassification and the Model:**
          *   *Standard Looping:* Classification -> Behavior Change -> Classification Drift.
