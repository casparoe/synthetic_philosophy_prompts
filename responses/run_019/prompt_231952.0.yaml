  4.  **Step 3: Filtering Disanalogies (Relevant vs. Incidental):**

      *   *Incidental:* Stakes (fun vs. liberty) doesn't necessarily change the *logic* of rule stability. Voluntariness is important but maybe not decisive for procedural fairness *within* the session.
      *   *Relevant:* The existence of *meta-rules* for amendment. In standard games, the meta-rule is "no changes." In legal systems, the meta-rule is "changes allowed via process X." The Chair assumed the "standard game" meta-rule applies to MUN, but MUN is a *simulation* of a legal body, which usually *does* allow amendment.
      *   *Crucial Point:* The Chair's argument rests on "fair notice" (ex ante consent). If the rules *themselves* allow for amendment, then fair notice includes the possibility of amendment.

  5.  **Step 4: Analyzing Nomic:**

      *   *What is Nomic?* A game where Rule 1 is "Players can change rules."
