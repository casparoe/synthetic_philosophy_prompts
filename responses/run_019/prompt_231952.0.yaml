      *   *Impact on Chair:* It undermines the claim that "changing rules mid-game is inherently unfair/incoherent." It shows fairness depends on whether the *initial rules* authorized the change.
      *   *Nuance:* Nomic can descend into chaos. Stability requires higher-order constraints (entrenchment).

  6.  **Step 5: Evaluating the Chair's Conclusion:**

      *   *Did the Chair survive?* Probably not, or at least not on the grounds given. The "game analogy" actually cuts against the Chair if the "game" is understood as a *parliamentary* game (like MUN is supposed to be).
      *   *The Real Issue:* It's not about "game vs. law," it's about "Constitutive Rules vs. Operational Rules." Did the initial Rules of Procedure allow for their own amendment? If yes, the motion is in order. If no, it's not. The Chair appealed to "fairness of games" rather than the specific text of the MUN RoP.
      *   *Fairness:* Fairness isn't static rules; it's predictable processes. If the process for change is known, the change is fair.

  7.  **Step 6: Proposing a Better Analogy:**

      *   *The Constitution:* A better analogy is a Constitutional Democracy.
      *   *Why:* It explicitly accounts for Article V-style amendment processes. It balances stability (entrenchment) with adaptability (amendment).
      *   *Alternative:* A "Contract with an Amendment Clause."
      *   *Refinement:* The "Constitutional Convention" or "Parliamentary Procedure" analogy is best for MUN specifically.

