      *   *Voluntariness:* Games are voluntary; law is often coercive/mandatory.
      *   *Stakes:* Games have low stakes (fun/learning); Law has high stakes (rights/liberty/resources).
      *   *Duration:* Games are finite (end when someone wins or time runs out); Legal systems aim for perpetuity.
