prompt: |-
  I chair the quarterly expert elicitation panel at a mid-sized engineering consultancy. Every quarter, six to ten senior engineers and cost modelers independently turn the same evidence package into probability distributions over three quantities for each major bid: capital cost overrun, schedule slip, and recordable safety incidents. The board's risk committee treats our consensus distributions as inputs to a go/no-go decision on bids worth up to nine figures, and I have to defend the process if the numbers later prove wrong. I have about one week between the evidence package going out and the consensus meeting. None of the panelists has formal training in decision theory, and there is no room to run a full Bayesian elicitation exercise from scratch each quarter. Our current method is for each panelist to present and defend their numbers orally, after which we take the median; this silently treats every panelist's numbers as equally credible and gives nobody a diagnosis of why people still disagree after reading the same package.

  I want to replace this with a reusable disagreement-audit procedure built as honestly as possible on the common prior assumption as I understand it: the idea that agents who start from the same prior and condition on the same evidence should end with the same posterior, so any remaining divergence traces to evidence that was not actually pooled or to someone not having updated correctly. I know that this is a substantive assumption rather than a theorem about all rational agents everywhere, and that the formal result depends delicately on assumptions like common knowledge of posteriors, which a panel of humans probably never satisfies exactly.

  Give me a procedure I can run each quarter. It should include a sequence of tests, in order, for a set of panel responses; a checklist of the distinct ways responses can diverge even under a common prior; and decision rules for what to do when a test fails, up to and including reporting that the process has not converged. Mark each step where the procedure is really a judgment call presented as a mechanical step, and specify which formal distinctions must survive the simplification (for example, common prior versus common knowledge of posteriors versus common evidence) and which can be dropped. Work the procedure through three concrete applications: one where it traces the disagreement to information that was never pooled; one where it traces the disagreement to a substantive difference in priors or in how evidence is weighted, and gives an answer I will not like; and one where it cannot distinguish those explanations and has to say so. End by stating what the procedure cannot do, in particular whether it can ever establish that the panel actually shares a prior rather than merely failing to find evidence that they do not.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** Quarterly expert elicitation panel at an engineering consultancy.
      *   **Participants:** 6-10 senior engineers/cost modelers (no formal decision theory training).
      *   **Task:** Estimate probability distributions for Capital Cost Overrun, Schedule Slip, Safety Incidents for major bids.
      *   **Stakes:** High (9-figure bids, Board risk committee uses consensus for go/no-go).
      *   **Constraint:** 1 week turnaround (evidence out to consensus meeting). No full Bayesian elicitation from scratch.
      *   **Current Method:** Oral defense + Median (criticized for equal weighting and lack of diagnosis).
      *   **Goal:** Replace with a "Disagreement-Audit Procedure" based on the *Common Prior Assumption (CPA)*.
      *   **Philosophical Basis:** Aumann's Agreement Theorem logic (same prior + same evidence $\rightarrow$ same posterior). Divergence implies unshared evidence or improper updating.
      *   **Requirements:**
          *   Sequence of tests (in order).
          *   Checklist of divergence types under CPA.
          *   Decision rules (what to do if a test fails, including "no convergence").
          *   Mark judgment calls presented as mechanical steps.
          *   Specify formal distinctions to keep vs. drop (Common Prior vs. Common Knowledge vs. Common Evidence).
          *   Three concrete applications (Information asymmetry, Substantive Prior/Weighting difference, Undistinguishable).
          *   Conclusion on limitations (can it establish shared priors?).

  2.  **Analyze the Theoretical Foundation (Common Prior Assumption):**

      *   *Aumann's Agreement Theorem:* If agents have common priors and their posteriors are *common knowledge*, they cannot agree to disagree.
      *   *Reality Check:* Humans don't have common priors. Humans don't have common knowledge of posteriors (until they speak). Humans interpret evidence differently (likelihood functions differ).
      *   *Adaptation:* I need to use CPA as a *diagnostic tool*, not a literal truth. The prompt acknowledges this ("substantive assumption rather than a theorem").
      *   *Key Distinctions:*
          *   *Common Evidence:* Did everyone read the same package? (Easy to check).
          *   *Common Prior:* Do they value risk/outcomes the same way initially? (Hard to check, usually false).
          *   *Common Knowledge:* Do they know what others think? (Achieved via the meeting).
          *   *Likelihood Functions:* Do they interpret $P(E|H)$ the same way? (This is usually where engineers disagree).
      *   *Simplification:* I must drop the strict "Common Knowledge of Posteriors" requirement (too complex for 1 week) and focus on "Shared Information + Aligned Interpretation." I must keep the distinction between *Information Asymmetry* (I know something you don't) and *Model Asymmetry* (We see the same data but weigh it differently).

  3.  **Drafting the Procedure (The "Disagreement-Audit"):**

      *   *Phase 1: Pre-Meeting (Asynchronous).* Need to capture the distributions and the *reasons* before groupthink sets in.
      *   *Phase 2: The Audit (During Meeting).* Systematic comparison.
      *   *Phase 3: Resolution/Reporting.*

      *   *Step 1: Evidence Verification.* (Did everyone actually read the same stuff?)
      *   *Step 2: Structural Decomposition.* (Break down the black box. Cost = Quantity $\times$ Price $\times$ Risk Factor).
      *   *Step 3: The "Why" Annotation.* (Force them to link numbers to evidence items).
      *   *Step 4: Pairwise Comparison.* (Find the outliers).
      *   *Step 5: The "Information Swap".* (If I tell you X, do you move?)

      *   *Decision Rules:* If info is missing $\rightarrow$ Pause/Research. If priors differ $\rightarrow$ Weighted Average (not Median) or Report Range. If unresolvable $\rightarrow$ Report "Non-Convergence."

      *   *Judgment Calls:* Identifying "substantive" vs. "noise." Deciding when to stop debating.

  4.  **Developing the Checklist of Divergence:**

      1.  *Evidence Gap:* I have a file you don't.
      2.  *Interpretation Gap:* We see the same file, I think it means High Risk, you think Low Risk.
      3.  *Model Gap:* We agree on risk, but you use a log-normal and I use a triangular.
      4.  *Incentive/Preference Gap:* You are more risk-averse than me (Prior difference).

  5.  **Developing the Three Scenarios:**

      *   *Scenario 1 (Info Gap):* One engineer knows about a specific supply chain issue not in the package. *Result:* Update package, re-run.
      *   *Scenario 2 (Prior/Weighting):* Everyone sees the same safety stats. Older engineers weigh recent accidents higher than younger ones. *Result:* Uncomfortable truth. Use weighted average based on track record, or report bimodal distribution.
      *   *Scenario 3 (Undistinguishable):* Complex interaction of cost/schedule. Can't tell if it's model or info. *Result:* Declare non-convergence.

  6.  **Refining the Formal Distinctions:**

      *   *Keep:* Common Evidence (verifiable).
      *   *Drop:* Common Prior (assume false, test for stability instead).
      *   *Drop:* Common Knowledge (replace with "Declared Posteriors").
      *   *Keep:* Rational Updating (test for consistency).

  7.  **Addressing the Limitations (The Conclusion):**

      *   Can it prove shared priors? No. It can only fail to disprove them.
      *   It's a stress test, not a proof.

  8.  **Review against Constraints:**

      *   *Time:* 1 week. Procedure must be tight.
      *   *Training:* No decision theory. Language must be plain English (engineer speak).
      *   *Stakes:* High. Must be defensible to the Board.
      *   *Tone:* Professional, rigorous, honest about limitations.

  9.  **Self-Correction/Iterative Refinement during drafting:**

      *   *Critique:* The prompt asks for a procedure built *on the common prior assumption*. If I say "assume priors differ," I violate the prompt's philosophical constraint.
      *   *Correction:* I must frame the procedure as *testing* the CPA. "If we assume CPA, where is the break?" The break is either Evidence or Updating. I need to make sure I don't just say "priors differ" too easily. I need to force them to justify why the evidence didn't align them.
      *   *Refinement on "Judgment Calls":* I need to explicitly label where human judgment overrides the mechanical rule.
      *   *Refinement on "Median":* The prompt hates the median. I should suggest a method that reflects the audit (e.g., if info gap found, update all. If prior gap found, use performance-weighted mean).

  10. **Final Polish:** Check the three scenarios to ensure they match the specific requirements (one info, one prior/weighting with unpleasant answer, one ambiguous). Ensure the distinction between Common Prior and Common Knowledge is explicit in the "Formal Distinctions" section.

  *(Self-Correction during drafting the response)*: Wait, the prompt asks to mark steps where the procedure is a "judgment call presented as a mechanical step." I need to be very explicit about this, perhaps using bold warnings or specific annotations.

  Also, the prompt asks to specify which formal distinctions must survive simplification. I need a dedicated section for that.

  Let's structure the response:
  1.  Introduction (acknowledging the CPA constraint).
  2.  Formal Distinctions (Keep vs. Drop).
  3.  The Procedure (Phased).
  4.  The Checklist of Divergence.
  5.  Decision Rules.
  6.  Three Concrete Applications.
  7.  Limitations/Conclusion.

