answer: |-
  ## The Common-Prior Disagreement Audit (CPDA)

  This procedure is designed to operationalize the **Common Prior Assumption (CPA)** as a diagnostic tool rather than a literal truth. It treats the panel as a single rational agent with fragmented memory. Under this view, disagreement is an error state indicating either missing data (information asymmetry) or processing failure (updating error).

  ### I. Formal Distinctions: What Survives Simplification

  To make Aumann-style logic workable for engineers without decision theory training in a one-week window, you must simplify the formal topology.

  **Distinctions to DROP (Treat as Equivalent):**
  1.  **Common Knowledge of Posteriors vs. Declared Posteriors:** Aumann requires agents to *know* that others know their posteriors. In this procedure, we treat the act of writing down a distribution and sharing it as sufficient for "common knowledge." We drop the infinite recursion requirement.
  2.  **Logical Omniscience:** We assume engineers are not required to deduce all logical consequences of the evidence instantly. Disagreement due to calculation error is treated as "updating failure."

  **Distinctions to KEEP (Critical for Validity):**
  1.  **Common Evidence vs. Common Interpretation:** You must distinguish between *not seeing* a document (Evidence Gap) and *weighing* a document differently (Likelihood Gap). The procedure hinges on this.
  2.  **Prior vs. Likelihood:** While CPA assumes identical priors, in practice, you must test if the divergence comes from the starting point (risk tolerance/base rate) or the update (how new evidence shifts the belief).
  3.  **Convergence vs. Consensus:** Consensus is agreement for the sake of the committee. Convergence is agreement based on shared information processing. The procedure prioritizes Convergence; if it fails, you report Non-Convergence rather than forced Consensus.

  ---

  ### II. The Disagreement-Audit Procedure

  **Timeline:**
  *   **Day 1:** Evidence Package Distributed.
  *   **Day 1-4:** Independent Estimation & Annotation (Asynchronous).
  *   **Day 5:** Automated Pre-Analysis (Facilitator only).
  *   **Day 6:** Consensus & Audit Meeting.
  *   **Day 7:** Final Report Submission.

  #### Phase 1: Asynchronous Annotation (Days 1-4)
  Panelists submit their three distributions (Cost, Schedule, Safety). Crucially, they must submit an **Evidence Map**.

  *   **Mechanical Step:** For each of the 10th, 50th, and 90th percentiles of their distributions, panelists must tag specific items from the evidence package (e.g., "Page 12, Soil Report" or "Page 4, Vendor Quote") that drove that number.
  *   **Mechanical Step:** Panelists must list any "External Knowledge" used that is *not* in the evidence package.
  *   **[JUDGMENT CALL WARNING]:** *The facilitator must decide if an "External Knowledge" item is admissible. If it is verifiable data, it is admissible. If it is "gut feeling," it is flagged as a Prior Difference.*

  #### Phase 2: Automated Pre-Analysis (Day 5)
  The facilitator (you) runs a script to compare submissions.

  *   **Mechanical Step:** Calculate the pairwise Kullback-Leibler (KL) divergence between all submitted distributions for each quantity.
  *   **Mechanical Step:** Cluster panelists into "Agreement Groups" (those whose distributions overlap significantly at the 50th percentile).
  *   **Mechanical Step:** Generate an "Evidence Heatmap." Show which evidence items were cited most frequently by the "Low Risk" cluster vs. the "High Risk" cluster.

  #### Phase 3: The Audit Meeting (Day 6)
  This is not a debate; it is a debugging session.

  **Step 1: The Information Swap Test**
  *   **Mechanical Step:** Display the "External Knowledge" list.
  *   **Action:** If a panelist cites information not in the package that materially shifts their distribution, the group votes: Is this information verifiable within 24 hours?
  *   **Decision Rule:** If **YES**, pause the bid decision. Update evidence package. Restart Phase 1. If **NO**, the panelist must discard that input or label it as "Unverified Prior."

  **Step 2: The Evidence Weighting Test**
  *   **Mechanical Step:** Display the Evidence Heatmap. Identify the top 3 evidence items cited by the High Risk cluster but ignored by the Low Risk cluster (and vice versa).
  *   **Action:** Ask the ignoring group: "Did you not see this, or did you see it and deem it irrelevant?"
  *   **Decision Rule:** If "Did not see," treat as Information Gap (revert to Step 1). If "Deemed irrelevant," proceed to Step 3.

  **Step 3: The Likelihood Calibration Test**
  *   **Mechanical Step:** For the evidence items deemed "irrelevant" by one group, ask them to state the probability of that evidence appearing *if* their risk assessment were true. (e.g., "If cost overrun is low, how likely is this soil report?")
  *   **[JUDGMENT CALL WARNING]:** *Engineers will struggle to articulate P(Evidence|Hypothesis). You must judge if their qualitative explanation ("It's an outlier") constitutes a valid likelihood function or is merely a disguised prior preference.*
  *   **Decision Rule:** If the likelihood ratios differ by more than a factor of 2, record as **Model Divergence**.

  #### Phase 4: Aggregation & Reporting (Day 6 PM - Day 7)

  *   **Decision Rule (Convergence):** If Information Gaps are closed and Model Divergence is resolved (panelists agree they updated correctly), take the **Mean** of the distributions. (The Mean preserves the variance of the group better than the Median).
  *   **Decision Rule (Persistent Divergence):** If Model Divergence remains after Step 3, do **not** take the median. Report a **Mixture Distribution** (e.g., "40% probability of Scenario A, 60% probability of Scenario B").
  *   **Decision Rule (Process Failure):** If Information Gaps cannot be closed (Step 1) or Likelihood Calibration fails completely (Step 3), report **Non-Convergence**. Recommend the Board treat the bid as "Unquantifiable Risk."

  ---

  ### III. Checklist of Divergence Types

  When the audit identifies a split, categorize it into one of these four buckets. This dictates the remedy.

  1.  **The Blind Spot (Information Asymmetry):**
      *   *Symptom:* One panelist cites a specific document or fact others did not use.
      *   *CPA Diagnosis:* Violation of "Common Evidence."
      *   *Remedy:* Pool the information. Re-estimate.

  2.  **The Filter (Attention Asymmetry):**
      *   *Symptom:* Everyone had the document, but one group didn't tag it in their Evidence Map.
      *   *CPA Diagnosis:* Violation of "Rational Attention" (subset of Common Evidence).
      *   *Remedy:* Force re-reading. If still deemed irrelevant, move to #3.

  3.  **The Model Clash (Likelihood Asymmetry):**
      *   *Symptom:* Everyone saw the data, but Group A thinks $P(Data|HighCost)$ is 90% and Group B thinks it is 10%.
      *   *CPA Diagnosis:* Violation of "Common Likelihood Function." This is technically a Prior difference in how the world works.
      *   *Remedy:* Mixture Distribution. Do not average the numbers; average the scenarios.

  4.  **The Preference Mask (Prior Asymmetry):**
      *   *Symptom:* Agreement on data and models, but one panelist consistently skews higher on Safety or Cost across all bids.
      *   *CPA Diagnosis:* Violation of "Common Prior." (They are not measuring the same quantity; one is measuring "Cost" and the other "Cost + Reputation Risk").
      *   *Remedy:* Weight by past calibration performance. If unknown, report as Prior Conflict (see Non-Convergence).

  ---

  ### IV. Concrete Applications

  #### Application 1: The Unpooled Information (Success Case)
  *   **Context:** Estimating Capital Cost Overrun for a chemical plant.
  *   **Observation:** The Pre-Analysis shows two distinct clusters. The High-Cost cluster (3 engineers) all tagged "Vendor Email Chain, March 4th" in their Evidence Map. The Low-Cost cluster (5 engineers) did not.
  *   **Audit Step:** Step 1 (Information Swap).
  *   **Finding:** The March 4th email contained a verbal warning about steel tariffs. It was in the shared drive but not indexed in the main evidence summary.
  *   **Diagnosis:** **Blind Spot.** The Common Evidence assumption was factually false.
  *   **Action:** The email is formally added to the package. The Low-Cost cluster re-estimates.
  *   **Result:** Distributions converge. Mean taken. Board receives a single, defensible number.
  *   **Defense:** "We found an administrative error in evidence pooling. It is corrected."

  #### Application 2: The Substantive Prior Difference (Unpleasant Answer)
  *   **Context:** Estimating Recordable Safety Incidents.
  *   **Observation:** All engineers cite the same safety logs. However, Senior Engineers (20+ years) predict 3x the incidents of Junior Engineers (5 years).
  *   **Audit Step:** Step 3 (Likelihood Calibration).
  *   **Finding:** Juniors argue the new safety protocol makes the logs irrelevant ($P(Logs|Safe) \approx P(Logs|Unsafe)$). Seniors argue safety protocols always degrade after month 3 ($P(Logs|Safe) \neq P(Logs|Unsafe)$). Both arguments are logically consistent.
  *   **Diagnosis:** **Model Clash / Prior Difference.** The Seniors have a prior based on historical institutional memory not contained in the evidence package. The Juniors have a prior based on theoretical system design.
  *   **Action:** The procedure forbids forcing consensus. You report a **Mixture Distribution**: "There is a 50% chance the project follows the Junior model (Low Incidents) and a 50% chance it follows the Senior model (High Incidents)."
  *   **Result:** The Board sees a bimodal risk profile. They cannot hide behind a single median number. They may reject the bid because the "tail risk" (Senior model) is unacceptable, even if the "mean" looks okay.
  *   **Defense:** "The panel agrees on the data but disagrees on the system dynamics. We have quantified both realities. The risk is not in the numbers, but in the model uncertainty."

  #### Application 3: The Undistinguishable Noise (Process Failure)
  *   **Context:** Estimating Schedule Slip for a software integration.
  *   **Observation:** Wild variance. No clear clusters. Evidence Maps are chaotic; everyone tags different pages for the same percentile.
  *   **Audit Step:** Step 2 and 3 fail.
  *   **Finding:** When asked why they ignored certain pages, panelists say "It felt less relevant." When asked for likelihoods, they say "It's just engineering judgment."
  *   **Diagnosis:** **Unresolvable.** We cannot distinguish between Information Gaps, Model Clashes, or Noise. The Common Prior Assumption yields no diagnostic leverage because the "updating mechanism" is opaque.
  *   **Action:** **Report Non-Convergence.**
  *   **Result:** You submit a report stating: "The panel could not isolate the source of variance. The evidence package is insufficient to support a probabilistic estimate."
  *   **Defense:** "We refused to manufacture false precision. The median of this group would be statistically meaningless because the variance is due to process error, not risk."

  ---

  ### V. Limitations and Epistemic Honesty

  You asked what this procedure cannot do.

  **1. It Cannot Establish a Shared Prior**
  The procedure operates *as if* the panel shares a prior. If the audit concludes with convergence, it does **not** prove the panelists actually started with the same prior. It only proves that their posteriors are consistent enough that the *difference* in their priors is undetectable given the current evidence resolution.
  *   *Formal Truth:* You can never verify a Common Prior; you can only fail to falsify it.
  *   *Reporting:* Never tell the Board "The panel agrees." Tell them "The panel has not identified a reason to disagree."

  **2. It Cannot Fix Strategic Lying**
  If a panelist intentionally skews numbers to influence the bid outcome (e.g., a sales engineer wanting the bid won, or a safety officer wanting it killed), the Audit will categorize this as a "Model Clash" or "Prior Difference." It treats strategic behavior as epistemic disagreement.
  *   *Mitigation:* This is why the "External Knowledge" step requires verification. But hidden incentives remain a blind spot.

  **3. It Cannot Overcome Evidence Poverty**
  If the evidence package is genuinely ambiguous, the Audit will correctly identify "Model Clash." However, the Board may view this as panel incompetence rather than evidence poverty.
  *   *Risk:* You may be blamed for "failing to reach consensus" when the correct outcome was "identifying that consensus is impossible." You must have the mandate to submit a Non-Convergence report without penalty.

  **4. The "Judgment Call" Vulnerability**
  The procedure marks several steps as Judgment Calls (e.g., admissibility of external knowledge, validity of likelihood explanations). If you, the Chair, are biased, you can manipulate the audit to force a desired outcome by ruling certain explanations "invalid."
  *   *Safeguard:* You must log every Judgment Call made during the audit. If a bid goes bad, the Board can audit *your* audit to see if you suppressed valid dissent under the guise of "updating errors."

  ### Summary for the Board
  When defending this process, your script is:
  *"We do not claim our experts are identical. We claim that if they disagree, it is either because they know different things or they model the world differently. Our process forces them to reveal which one it is. If it's different knowledge, we fix it. If it's different models, we show you both. If we can't tell, we tell you nothing rather than lie with a median."*
