  2.  **Deconstruct the Unilateralist's Curse:**
      *   Core mechanism: $N$ agents consider an action. Action happens if $\max(V_i) > Threshold$.
      *   True Value $V$ is negative (harmful).
      *   Estimates $E_i = V + \epsilon_i$.
      *   If $\epsilon_i$ are symmetric around 0, $E[E_i] = V$.
      *   However, action occurs if *any* $E_i > Threshold$ (usually 0 for "worthwhile").
      *   If $V < 0$, action is bad. But if $N$ is large enough, probability that $\max(E_i) > 0$ approaches 1.
      *   Colleague's counter: If agents know this, they should lower their threshold.
      *   User's counter (to support): They can't lower the threshold appropriately if they don't know $N$ (the number of other potential actors).
      *   Requirement: Show a case where agents are calibrated, know the curse, but still act wrongly because they can't estimate $N$.

