      In a decentralized vulnerability research collective, five independent analysts discover the same critical zero-day flaw in ubiquitous server software. True social value is deeply negative: public disclosure now invites catastrophic exploitation before patches exist. Each analyst independently estimates the net utility of immediate full disclosure, aiming to pressure vendors. Their estimation errors are symmetric; across many bugs, their average judgment is perfect. For this specific flaw, four analysts correctly estimate negative value and hold back. The fifth, due to random noise in assessing exploitation likelihood, calculates a slight positive value. Crucially, no central registry exists to track who found the bug; each analyst knows others *might* be looking but cannot know how many are currently deliberating disclosure. The fifth analyst, aware of the unilateralist's curse, attempts to discount their estimate for potential optimism bias. However, lacking data on the number of concurrent deliberators, they cannot quantify the selection pressure. They publish the exploit, triggering the harmful outcome despite individual calibration and sincere caution.

