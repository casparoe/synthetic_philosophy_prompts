  Bottom line
  This case demonstrates that the unilateralist's curse is a structural selection effect rather than a cognitive bias. Even with perfect individual calibration and awareness of the phenomenon, the inability to quantify concurrent deliberation forces a rational agent to act on an outlier estimate. The curse survives because the decision rule selects for error, not because the agents are miscalibrated.

  The scenario
  In a decentralized vulnerability research collective, five analysts discover the same critical zero-day flaw in server software. True social value is deeply negative: public disclosure invites catastrophic exploitation before patches exist. Each analyst estimates the net utility of immediate full disclosure, aiming to pressure vendors. Their estimation errors are symmetric; across many bugs, their average judgment is perfect. For this flaw, four analysts correctly estimate negative value and hold back. The fifth, due to random noise in assessing exploitation likelihood, calculates a slight positive value. Crucially, no central registry exists to track who found the bug; each analyst knows others might be looking but cannot know how many are deliberating disclosure. Aware of the curse, the fifth attempts to discount for optimism bias. However, lacking data on the number of concurrent deliberators, they cannot quantify the selection pressure. They publish the exploit, triggering the harmful outcome despite calibration and caution.

  Calibration, verified
  Calibration holds because the analysts' errors are zero-mean noise added to the true negative value. Across many vulnerabilities, their average estimates match true values; systematic overconfidence is absent. Here, four abstained, estimating negative values consistent with reality. The actor's error was simply the positive tail of the symmetric distribution. Their calibration is not broken by acting; rather, the selection mechanism isolates the positive error. The group's aggregate wisdom remains accurate, but the unilateral decision rule discards the median judgment in favor of the maximum. The error lies in the filtering process selecting the outlier.

  Why awareness doesn't save them
  Awareness fails because correcting for the curse requires estimating the number of other potential actors ($N$), which is unknowable here. To adjust their threshold, the analyst must calculate the probability that their positive estimate is merely the optimistic tail of a larger distribution. If they knew ten others were deliberating, they would demand much stronger evidence before acting, knowing risk is high. However, in decentralized research, concurrency is opaque; they cannot distinguish being the sole deliberator from being one of fifty. Without $N$, they cannot compute the magnitude of the required discount. They apply a heuristic caution, but this is insufficient against the statistical certainty that someone holds an optimistic error. Rationality demands acting on expected value, and without $N$, their expected value calculation remains locally positive. Ultimately, they are trapped by informational asymmetry regarding peer concurrency, not bias.

  The load-bearing feature
  The load-bearing feature is the opacity of concurrent deliberation. If the analyst knew how many peers were evaluating the vulnerability, they could adjust their threshold to compensate for the probability of an optimistic outlier. Removing this uncertainty collapses the scenario into a standard bias case: if $N$ is known and they act wrongly, they are miscalibrated. The curse persists because the inability to count peers prevents epistemic discount, forcing calibrated agents to rely on incomplete data.

  The fix and its price
  Dissolving the curse requires a coordination mechanism, such as a trusted clearinghouse where finders privately register discoveries before disclosure. This allows the group to pool estimates and agree on a consensus threshold, eliminating the unilateral veto. However, the price is significant: it introduces centralization risks, potential leaks of sensitive data, and delays action while consensus forms. In fast-moving security contexts, this latency might allow attackers to find the flaw independently before the group responds. The cure reduces rash unilateralism but sacrifices the speed and redundancy of decentralized discovery, creating a trade-off between safety and agility.
