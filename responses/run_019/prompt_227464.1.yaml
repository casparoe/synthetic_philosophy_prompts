      *   *Calibration:* Each researcher estimates net benefit (pressure on vendors vs. risk of exploitation). On average, across many bugs, their estimates are accurate. For *this* bug, true value is negative (high exploitation risk), but noise pushes one researcher over the edge.
      *   *Constraint Check:* Single paragraph. ~150 words.

