prompt: |-
  I run a two-hour session on statistical reasoning for a reading group of graduate students in the humanities: sharp, articulate, comfortable arguing, but with nothing beyond a vague memory of school-level statistics. A few days ago I spent a long evening arguing with a friend about a public-health claim. She had noticed that a study's overall numbers supported one conclusion, while splitting the data by age reversed it, and we could not agree about whether either number was the right one to believe. That argument made me want to turn this exact phenomenon—Simpson's paradox—into the session.

  Don't produce the explanation itself; produce the teaching plan for it. I need the dependency order: what has to be in place before the reversal registers as a genuine puzzle rather than an arithmetic mistake—thinking in terms of conditional versus marginal comparisons, the idea of a lurking or stratifying variable, and the way group sizes and group-specific rates combine—and in what sequence those pieces should land, and why. I want one carrying example for the whole session; tell me whether I should build a small invented dataset or lean on something like the Berkeley graduate-admissions tables or the kidney-stone treatment numbers, and what features the example must have and must avoid. Map the misconceptions I should expect from a humanities audience—for instance that the paradox shows statistics can be made to say anything, that the aggregate number is simply wrong, that the subgroup number is automatically the true one, or that the reversal is just an artifact of unequal group sizes—and tell me exactly where in the sequence to head each one off, and what to say at that point. How will I know by the end that they understand the paradox as a real structural feature of pooling rather than having merely been entertained by a counterintuitive trick? And what should I deliberately leave out or refuse to resolve at this level?

  Also, separate the settled from the contested. It is settled that an association can reverse when groups are pooled, and that this arises from the arithmetic of how the groups are weighted. It is genuinely contested, or at least not settled by the mathematics alone, how to decide which stratification is relevant in a real case, whether an observed reversal warrants a causal reading, and what "the right answer" is for any particular application. Please keep that line visible throughout the plan rather than presenting a contested methodological verdict as consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** Graduate students in humanities (sharp, articulate, argumentative, low math background).
      *   **Topic:** Simpson's Paradox.
      *   **Goal:** Create a teaching plan (not the explanation itself).
      *   **Key Requirements:**
          *   Establish dependency order (what concepts must land before the paradox registers as real).
          *   Select *one* carrying example (invented vs. real data like Berkeley/Kidney Stones) and justify features/avoidances.
          *   Map specific misconceptions (stats say anything, aggregate is wrong, subgroup is true, artifact of size) to specific points in the sequence to address them.
          *   Define success criteria (how to know they understand it as structural, not just a trick).
          *   Define scope limits (what to leave out/unresolved).
          *   **Crucial Constraint:** Distinguish between *settled* math (reversal happens due to weighting) and *contested* interpretation (causality, which stratification is "right"). Do not present methodological verdicts as consensus.

  2.  **Determine the Carrying Example:**
      *   *Options:* Berkeley Admissions (classic, gender bias context), Kidney Stones (medical, treatment efficacy), Invented Data (clean, controllable).
      *   *Audience Fit:* Humanities grads care about social context, bias, and interpretation. Berkeley is good but historically specific. Kidney stones are too clinical.
      *   *Decision:* A *slightly modified* version of the Berkeley data or a structurally identical social science example is best. However, the prompt asks for *one* carrying example. Real data adds stakes. Let's go with a *simplified, reconstructed version of the Berkeley Admissions data*. Why? It touches on bias/fairness (humanities interest), involves clear groups (departments), and avoids medical complexity.
      *   *Refinement:* Actually, for a 2-hour session with *no stats background*, real data can get messy (missing values, too many categories). A *carefully constructed hypothetical dataset* that mirrors the Berkeley structure is often pedagogically safer. It allows exact numbers that sum up cleanly on a whiteboard. Let's recommend a **constructed dataset modeled on Admissions**. It allows control over the "lurking variable" (Department selectivity) without getting bogged down in 1970s UC policy details.
      *   *Features:* Two groups (A/B), Two outcomes (Accept/Reject), One Stratifying Variable (Department Easy/Hard).
      *   *Avoid:* More than 2 strata (too complex), continuous variables (too mathy), causal language in the setup (premature).

  3.  **Establish Dependency Order (The "Logic Flow"):**
      *   To feel the paradox, they need to trust the numbers first.
      *   Step 1: Marginal Comparison (The "Obvious" View).
      *   Step 2: Conditional Comparison (The "Detailed" View).
      *   Step 3: The Conflict (The Paradox).
      *   Step 4: The Mechanism (Weighting/Composition).
      *   Step 5: The Interpretation (Settled vs. Contested).

  4.  **Map Misconceptions to Sequence:**
      *   *Misconception: "Arithmetic Mistake".* Address immediately upon revealing the reversal. Show the sums.
      *   *Misconception: "Stats say anything".* Address after mechanism is shown. It's not magic; it's composition.
      *   *Misconception: "Subgroup is automatically true".* Address during the Interpretation phase (Contested).
      *   *Misconception: "Artifact of unequal sizes".* Address during the Mechanism phase (Weighting).

  5.  **Drafting the Plan - Section by Section:**

      *   **Introduction:** Hook them with the friend's argument.
      *   **Phase 1: The Setup (Marginal):** Establish the baseline belief.
      *   **Phase 2: The Reveal (Conditional):** Show the reversal. *Crucial moment.*
      *   **Phase 3: The Mechanism (Weighting):** Why did this happen? (The math of weighted averages).
      *   **Phase 4: The Interpretation (Causality/Decision):** The "So What?" (Settled vs. Contested).
      *   **Conclusion:** Assessment and Limits.

  6.  **Refining the "Settled vs. Contested" Line:**
      *   *Settled:* The math works. Pooling can reverse trends due to confounding variables (group composition).
      *   *Contested:* Which table do we trust? Is it bias? Is it preference? This requires domain knowledge, not just stats.
      *   *Instruction:* Ensure the plan explicitly tells the instructor *not* to solve the causal question definitively but to show *how* to argue it.

  7.  **Success Criteria:**
      *   They shouldn't just say "Wow, weird."
      *   They should be able to explain *why* the aggregate shifted (composition).
      *   They should be able to articulate *why* choosing the right table depends on the question (causal vs. descriptive).

  8.  **What to Leave Out:**
      *   Formal probability notation ($P(A|B)$).
      *   Causal diagrams (DAGs) - too technical.
      *   Resolution algorithms (e.g., Mantel-Haenszel) - too procedural.
      *   The idea that there is *always* a single "correct" table.

  9.  **Review against Constraints:**
      *   *Dependency order?* Yes, built into phases.
      *   *One example?* Yes, Admissions-style.
      *   *Misconceptions mapped?* Yes.
      *   *Settled/Contested distinct?* Yes, Phase 4 is dedicated to this.
      *   *Audience appropriate?* Yes, focuses on argumentation and interpretation rather than calculation.

  10. **Final Polish:** Ensure tone is respectful of their intelligence (sharp, articulate) while acknowledging their math gap. Emphasize the *argumentative* nature of statistics. (Self-Correction: Make sure to emphasize that the "lurking variable" isn't just hidden, it's structurally relevant).

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Teaching Plan: Simpson's Paradox as Structural Argument
  **Session Duration:** 120 Minutes
  **Audience:** Humanities Graduate Students (High verbal reasoning, low quantitative formalism)
  **Goal:** Move students from viewing the paradox as a "trick" to understanding it as a structural feature of aggregated data, while distinguishing mathematical necessity from interpretive choice.

  ---

  ## I. The Carrying Example: "The University Admissions Case"
  **Decision:** Use a **constructed dataset modeled on the 1973 Berkeley Admissions case**, not the raw historical data nor a purely abstract number set.

  **Why this example:**
  *   **Stakes:** It engages questions of fairness, bias, and institutional structure, which resonate with humanities scholars.
  *   **Clarity:** It avoids the clinical complexity of medical data (kidney stones) where "severity" is harder to grasp intuitively than "department selectivity."
  *   **Control:** Constructing the numbers (rather than using raw historical tables) allows you to ensure the arithmetic is transparent on a whiteboard without rounding errors or extraneous categories.

  **Required Features:**
  1.  **Binary Outcome:** Admitted vs. Rejected.
  2.  **Binary Grouping:** Men vs. Women (or Applicant Type A vs. B).
  3.  **Binary Stratifier:** Department X (High Acceptance) vs. Department Y (Low Acceptance).
  4.  **Crucial Imbalance:** The "disadvantaged" group must apply disproportionately to the "harder" department. This is the engine of the paradox.

  **What to Avoid:**
  *   **More than two departments:** Keeps the weighted average calculation mentally tractable.
  *   **Causal labels in the setup:** Do not label the departments "Easy" or "Hard" initially. Label them "Dept 1" and "Dept 2." Let the students infer the selectivity from the rates.
  *   **Percentages only:** Provide raw counts ($N$) alongside percentages. Humanities students often suspect percentages hide the "real" numbers; showing the $N$s proves the arithmetic is sound.

  ---

  ## II. Dependency Order & Sequence
  *The paradox only registers as a genuine puzzle if the students trust the arithmetic but disagree with the inference. The sequence must build trust in the numbers before challenging the inference.*

  ### Phase 1: The Marginal Claim (20 Minutes)
  **Objective:** Establish the "common sense" baseline.
  **Action:** Present only the **aggregate** table (Total Applicants vs. Total Admitted by Group).
  **Concept:** Marginal Comparison.
  **Activity:** Ask students to draft a one-sentence news headline based *only* on this table.
  **Expected Output:** "Group A is favored over Group B" or "Systemic bias against Group B."
  **Why here:** You must solidify their intuition that the aggregate number *usually* tells the story. This creates the cognitive tension required for the paradox.

  ### Phase 2: The Conditional Reveal (30 Minutes)
  **Objective:** Induce the cognitive shock.
  **Action:** Reveal the **stratified** table (breakdown by Department). Show that within *each* department, the trend reverses or disappears.
  **Concept:** Conditional Comparison.
  **Activity:** Ask them to check the math. Verify that the subgroup rates contradict the aggregate rate.
  **Why here:** This forces the realization that this is not a calculation error. The puzzle is now active: *How can both tables be true?*

  ### Phase 3: The Mechanism of Weighting (40 Minutes)
  **Objective:** Explain *how* the reversal happens without invoking causality yet.
  **Action:** Walk through the "Weighted Average" logic.
  **Concept:** Composition and Group Sizes.
  **Key Demonstration:** Show that the Aggregate Rate is not the average of the Subgroup Rates; it is the *weighted* average.
  *   *Visual:* Use a balance beam analogy. A high acceptance rate in a department with very few applicants weighs less than a low acceptance rate in a department with many applicants.
  *   *The Pivot:* Highlight that Group B applied mostly to the Hard Department, while Group A applied mostly to the Easy Department.
  **Why here:** This addresses the "Arithmetic Mistake" and "Artifact of Size" misconceptions. It grounds the paradox in the *distribution of applicants*, not the *decision process*.

  ### Phase 4: The Interpretive Turn (30 Minutes)
  **Objective:** Distinguish Settled Math from Contested Meaning.
  **Action:** Facilitate a debate on which number represents "Discrimination."
  **Concept:** Causal Inference vs. Descriptive Statistics.
  **Why here:** This is where you prevent the "Subgroup is automatically true" misconception.

  ---

  ## III. Mapping Misconceptions to Interventions
  *Do not wait for these to arise; preempt them at the specific structural point where they become plausible.*

  | Misconception | When it arises | Intervention Strategy | What to Say |
  | :--- | :--- | :--- | :--- |
  | **"You added the numbers wrong."** | **Phase 2 (The Reveal)** | **Verification.** Invite a student to the board to recalculate the aggregate from the subgroups. | "The math is not lying. Both tables are arithmetically correct. The conflict is not in the calculation, but in the pooling." |
  | **"Statistics can prove anything."** | **Phase 3 (The Mechanism)** | **Constraint.** Emphasize that the reversal requires specific conditions (imbalance in application volume). | "This isn't magic. It only happens when group sizes are skewed. It's a structural feature of how we combine data, not a loophole to exploit." |
  | **"The subgroup is the 'real' truth."** | **Phase 4 (Interpretation)** | **Complication.** Introduce a scenario where aggregating *is* correct (e.g., overall resource allocation). | "If you want to know if the *admissions officers* are biased, look at departments. If you want to know if the *university experience* is accessible, look at the aggregate. The 'truth' depends on the question." |
  | **"It's just because Group B is smaller."** | **Phase 3 (Weighting)** | **Distinction.** Differentiate between *sample size* (confidence) and *composition* (weighting). | "Even with infinite data, this reversal persists. It is not about statistical noise; it is about where the people are located." |

  ---

  ## IV. Settled vs. Contested: The Critical Line
  *You must maintain a visible boundary between the mathematical fact and the methodological judgment.*

  **1. The Settled (Math & Structure)**
  *   **Fact:** Associations can reverse upon aggregation.
  *   **Fact:** This occurs mathematically when a lurking variable (Department) is correlated with both the grouping variable (Gender) and the outcome (Admission).
  *   **Fact:** The aggregate number is a weighted average, not a simple mean of rates.
  *   **Instruction:** Present this as indisputable. Use the whiteboard to prove the weighting mechanism.

  **2. The Contested (Causality & Decision)**
  *   **Debate:** Does the reversal prove discrimination?
  *   **Debate:** Which table should policy-makers use?
  *   **Nuance:** In the Berkeley case, the "bias" was not in admissions officers (subgroup rates were fair) but in prior preparation/socialization that led women to apply to harder departments (aggregate rates showed disadvantage).
  *   **Instruction:** Do not resolve this for them. Frame it as an **argumentative burden**.
      *   *Prompt:* "If you argue for the Aggregate, what story are you telling about the institution?"
      *   *Prompt:* "If you argue for the Subgroups, what assumptions are you making about department comparability?"
  *   **Goal:** Students must leave understanding that **statistics does not select the relevant stratification; domain knowledge does.**

  ---

  ## V. Success Criteria: How to Know They Understand
  *Avoid asking them to calculate. Ask them to diagnose.*

  **1. The "New Case" Test**
  Present a brief, verbal description of a new scenario (e.g., "A baseball player has a higher batting average in both home and away games, but a lower average overall").
  *   **Fail:** They say it's impossible or a mistake.
  *   **Pass:** They immediately ask, "Where was he playing more often?" (Identifying the weighting/composition).

  **2. The "Policy" Test**
  Ask: "If you were the Dean, which number would you publish in the annual report?"
  *   **Fail:** They choose one as objectively "correct."
  *   **Pass:** They say, "It depends on whether we are reporting on officer conduct or student access," and justify the choice based on the *question*, not the *number*.

  **3. The "Artifact" Test**
  Ask: "If we double the number of applicants in every category, does the paradox disappear?"
  *   **Fail:** They say yes (confusing sample size with composition).
  *   **Pass:** They say no (recognizing it is structural, not sampling error).

  ---

  ## VI. Scope Limits: What to Leave Out
  *To keep the session focused on reasoning rather than procedure, explicitly exclude the following:*

  1.  **Causal Diagrams (DAGs):** Do not introduce nodes and arrows. It creates a false sense of formal resolution. Keep the causal talk in natural language ("Department selectivity influences admission...").
  2.  **Statistical Tests:** Do not mention Chi-square, p-values, or significance. This is about effect direction, not uncertainty.
  3.  **Resolution Algorithms:** Do not teach Mantel-Haenszel or regression adjustment. The goal is to recognize the problem, not necessarily to solve it computationally.
  4.  **The "Always Stratify" Heuristic:** Refuse to teach the rule that "subgroups are always better." Emphasize that over-stratification can also hide real patterns (collider bias), though you need not name it. Simply state: "More tables do not guarantee more truth."

  ## VII. Closing Argument (The Takeaway)
  End the session by returning to your friend's argument.
  *   **Settled:** Your friend was right that the numbers can flip. You were right that it matters *why* they flip.
  *   **Contested:** The "right" number is not found in the spreadsheet; it is found in the argument about what the data represents.
  *   **Final Charge:** "When you see a statistic in your research, do not ask 'Is this number true?' Ask 'What population is being weighted here, and is that the population I care about?'"
