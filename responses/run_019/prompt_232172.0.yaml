      *   *Refining Move 3:* Roman is pragmatically correct (we do learn), but needs to admit the bias source.
      *   *Refining Move 4:* Dana is right about the source of content, but "selection" is still a cognitive achievement.
      *   *Refining Move 5:* Roman is right about the definition of learning, but Bongard is a special case.
      *   *Refining Move 6:* Dana lands the killing blow on the *puzzle* aspect, but maybe not on the *learning* aspect.

      *   *Settled/Contested:* Need to be careful not to say "Nativism is true." Say "Nativism is a major position." Ensure "No Free Lunch" is cited as the mathematical backing for Dana's intuition. Ensure "Core Knowledge" is mentioned as the scientific backing for Roman's intuition.

