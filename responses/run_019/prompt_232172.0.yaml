          *   **Symbol Grounding:** How do visual features map to abstract relations?
          *   **Settled vs. Contested:**
              *   *Settled:* Humans learn from few examples (few-shot). Data underdetermines rules (underdetermination). Priors are necessary (No Free Lunch theorem).
              *   *Contested:* Are concepts innate or constructed? Is "inside" a primitive or learned? How exactly do priors interact with data (Bayesian vs. Connectionist)?

