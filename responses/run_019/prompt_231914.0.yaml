answer: |-
  Subject: Thoughts on the Anthropocene vote and the convention lens

  It is fascinating that you are looking at the recent rejection of the formal Anthropocene through the lens of periodization as convention, because that specific framework cuts through a lot of the noise that surrounded the news cycle in March 2024. When the Subcommission on Quaternary Stratigraphy voted against the proposal, and the International Commission on Stratigraphy backed that rejection, the headlines screamed that geologists were denying human impact on the planet. But as you suspect, that was a misreading of the procedural stakes. The actual players here were the Anthropocene Working Group, a large interdisciplinary team of scientists who had spent over a decade building the case, and the Subcommission on Quaternary Stratigraphy, which is the specific voting body within the broader geological hierarchy tasked with maintaining the integrity of the Quaternary period. The rules they were playing by are strict and deeply traditional. To add a new epoch to the Geological Time Scale, you generally need to define a Global Boundary Stratotype Section and Point, often called a golden spike. This is not merely a statement that something changed; it is a requirement to identify a specific physical layer in the Earth's crust, at a specific location, that contains a synchronous global marker visible enough to serve as a reference point for all future geology.

  The Working Group's proposal was a precise attempt to meet these conventional requirements. They argued for a start date in the mid-twentieth century, aligning with the Great Acceleration of human industrial activity. They selected Crawford Lake in Ontario, Canada, as the site for the golden spike. Their chosen marker was plutonium-239 fallout from nuclear bomb tests, supported by secondary markers like fly ash, microplastics, and even changes in chicken bone fossils. From the perspective of periodization as convention, the Working Group was arguing that the rock record now objectively contains a layer that demands a new label, and that the convention of the golden spike is the correct tool to codify it. They treated the mid-twentieth century not as a philosophical choice but as a stratigraphic discovery, a line already written in the sediment that merely needed naming. However, the Subcommission's rejection turns on the idea that the rules of convention were not being served by this specific application. The vote was not about whether humans have changed the planet, which is undisputed, but about whether the category of epoch is the right container for this change and whether the mid-twentieth century is the right boundary according to stratigraphic utility. Many voters felt the timespan was too short to qualify as an epoch, which traditionally spans millions of years, and that the signal, while clear, was better understood as an event within the Holocene rather than a break from it.

  This is where your lens of periodization-as-convention explains the vote most effectively. It clarifies that the dispute was not about reality but about taxonomy. The rejection highlights that geological time is not discovered like a continent; it is legislated like a border. The Subcommission essentially ruled that the convention of the epoch requires a certain durability and magnitude of signal that the Anthropocene proposal did not satisfy under current rules. They argued that formalizing it now might lock geologists into a definition that becomes unusable in the deep future, or that it conflates a cultural and historical phenomenon with a lithostratigraphic one. By insisting on the rigidity of the golden spike procedure, the Subcommission reinforced the idea that the Geological Time Scale is a tool for correlating rock layers, not a ledger of human moral history. The convention lens shows that the Working Group tried to change the rules of the game by introducing markers like plastic and chicken bones, which are valid stratigraphic signals but culturally loaded, and the Subcommission pushed back to preserve the procedural purity of the time scale.

  However, the convention lens also misdescribes things if it suggests this was a tidy procedural disagreement devoid of politics. Treating it purely as a matter of stratigraphic rules ignores the disciplinary turf war that was underway. For many geologists, the Anthropocene is a concept borrowed from environmental science and the humanities, and formalizing it felt like ceding authority over the geological time scale to activists or historians. There is a significant historical and political fight hidden behind the procedural vote regarding when human impact began. If the start date is the mid-twentieth century, it implicates industrial capitalism and nuclear proliferation. If the start date is the advent of agriculture, it implicates a much broader swath of human history. By rejecting the mid-twentieth century golden spike, the Subcommission indirectly kept the door open for alternative definitions that might dilute the political charge of the term, or they closed the door entirely to keep the time scale neutral. A purely procedural analysis misses this tension, making it look like a debate over sediment thickness when it was also a debate over who owns the narrative of planetary change. The messiness of the fight suggests that while the rules are procedural, the motivation to enforce them is often sociological.

  Ultimately, this episode suggests that the Anthropocene concept does not need formal geological status to remain powerful, and it might even function better outside the strictures of the Geological Time Scale. The concept has already done its work in shifting public consciousness and interdisciplinary research, regardless of whether it gets a golden spike in Canada. It may find a more appropriate home as an informal geological event, similar to the Paleocene-Eocene Thermal Maximum, or as a historical period used by economists and sociologists. Formalization would have locked the definition into a specific date and marker, potentially stifling the flexibility needed to discuss human impact across different scales and regions. The rejection allows the term to remain a dynamic concept rather than a fixed unit of measurement. The value of the Anthropocene lies in its ability to provoke thought about human agency, not in its utility for correlating rock strata in a million years. The geological community has effectively said that while the human signal is real, it belongs to a different kind of storytelling than the one the Geological Time Scale is designed to tell.

  I am highly confident in this analysis, perhaps around ninety percent sure, because the procedural distinctions between the AWG and the SQS are well-documented in the public statements following the vote. The single point I am least sure about is the internal weighting of the votes within the Subcommission, specifically how much of the rejection was driven by genuine stratigraphic concern versus a desire to protect disciplinary boundaries from interdisciplinary encroachment, as those deliberations were not fully transparent.
