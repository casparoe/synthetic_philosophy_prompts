answer: |-
  # The Hacking Loop Vetting Protocol (HLVP)

  **Purpose:** To distinguish genuine Hackingian looping effects from labeling theory, generic social construction, and downward causal claims within the first hour of reading a manuscript.
  **User:** Philosophers without clinical training; text-based analysis only.
  **Outcome:** A recommendation to (A) Proceed to full review, (B) Downgrade to "Promissory Note," or (C) Reject/Redirect.

  ---

  ## Test 1: Ontological Eligibility (The Kind Check)
  **Question:** Does the manuscript identify the object of classification as an *interactive kind* (capable of awareness and self-modification) rather than an *indifferent kind* (biological or physical natural kinds)?

  **Sufficient Answer:**
  *   **Pass:** The text explicitly states or clearly implies the classified entities are persons, groups, or institutions capable of representing the classification to themselves (e.g., "patients," "citizens," "clinicians").
  *   **Fail:** The text treats the classified entities as passive biological substrates where the classification tracks a fixed natural history (e.g., "the virus mutates in response to the label," "the neural pathway degrades due to the diagnosis").

  **Action on Failure:** **STOP.** Verdict: *Category Error.*
  *   **Instruction to Author:** "This is not a looping-effect claim. You are describing biological plasticity or causal impact. Redescribe as 'downward causation' or 'biopsychosocial interaction'."

  ---

  ## Test 2: The Vector of Awareness (The Uptake Check)
  **Question:** Does the manuscript specify *how* the classification becomes known to the classified (or their proxies), enabling a response?

  **Sufficient Answer:**
  *   **Pass:** The text identifies a mechanism of transmission (e.g., "clinical intake interviews," "social media algorithms," "public health campaigns," "self-help literature").
  *   **Fail:** The text assumes awareness magically or treats the reaction as automatic/unmediated (e.g., "Upon being classified, subjects immediately..." without explaining how they know they are classified).

  **Action on Failure:** **DOWNGRADE.** Verdict: *Promissory Note.*
  *   **Instruction to Author:** "The loop is asserted but the mechanism of uptake is missing. Treat as a hypothesis requiring empirical support. Do not claim the loop is *demonstrated*."

  ---

  ## Test 3: The Return Arc (The Feedback Check)
  **Question:** Does the response of the classified feed back to modify the *classification scheme* (criteria, usage, or extension), or does it merely modify the *welfare/behavior* of the individual within a static scheme?

  **Sufficient Answer:**
  *   **Pass:** The text describes a change in the *kind* itself (e.g., "criteria were expanded," "the threshold lowered," "the meaning of the term shifted in clinical practice," "new subtypes emerged").
  *   **Fail:** The text describes only changes in individual outcomes within fixed criteria (e.g., "stigma worsened prognosis," "patients felt shame," "compliance dropped," "suicide rates rose").

  **Action on Failure:** **STOP.** Verdict: *Labeling Theory, not Looping.*
  *   **Instruction to Author:** "You have demonstrated downward causal influence (labeling effects), not a loop. A loop requires the classification to change in response to the reaction. Redescribe as 'consequences of stigmatization'."

  ---

  ## Test 4: The Engine of Revision (The Mechanism Check)
  **Question:** Is the change in the classification scheme driven by the *interaction* (the new behaviors/self-conceptions of the classified), or by *external interests* (politics, economics, administrative convenience) unrelated to the looping dynamic?

  **Sufficient Answer:**
  *   **Pass:** The text links the revision of the scheme directly to the altered behavior/self-conception of the classified (e.g., "Clinicians revised the criteria *because* patients began presenting with new symptoms generated by the old criteria").
  *   **Fail:** The text links the revision to external pressure where the classified act merely as a lobbying bloc without changed self-conception, or to administrative needs (e.g., "Insurance companies demanded a code," "Advocacy groups lobbied for coverage," "Committee voted to align with ICD").

  **Action on Failure:** **HANDOFF.** Verdict: *Requires Referee Judgment.*
  *   **Reason:** Distinguishing "interest-driven construction" from "looping-driven construction" often requires deep historical knowledge of the specific case (e.g., DSM revisions) that cannot be determined procedurally from the text alone.
  *   **Instruction to Referee:** "Verify if the advocacy/revision was motivated by the *new lived experience* of the kind (Looping) or purely *resource allocation/politics* (Construction)."

  ---

  # Protocol Runs on Hypothetical Submissions

  ## Case 1: The TikTok/ADD Submission
  *Claim:* Short-video platforms carrying first-person symptom accounts of ADHD have created a loop. Viewers reinterpret histories through symptom lists, present to clinicians already scripted, clinicians anchor on the presentation, and diagnostic practice drifts toward the platform's picture.

  *   **Test 1 (Ontological):** **PASS.** Classified are "viewers/patients" (interactive).
  *   **Test 2 (Vector):** **PASS.** Mechanism is "short-video platforms" and "clinical intake."
  *   **Test 3 (Return Arc):** **PASS.** "Diagnostic practice drifts toward the platform's picture." This implies a shift in the extension/application of the kind, not just individual behavior.
  *   **Test 4 (Engine):** **PASS.** The revision is driven by "viewers reinterpret... present... clinicians anchor." The change in people (scripted presentation) drives the change in practice.
  *   **Final Verdict:** **PROCEED TO REVIEW.**

  ## Case 2: The Stigma/Prognosis Submission
  *Claim:* Classifying a condition as a mental disorder loops because the stigma of the label worsens the prognosis of those labeled.

  *   **Test 1 (Ontological):** **PASS.** Classified are patients (interactive).
  *   **Test 2 (Vector):** **PASS.** Mechanism is implied societal reaction/stigma.
  *   **Test 3 (Return Arc):** **FAIL.** "Worsens the prognosis" is a change in individual outcome/welfare. The text does not claim the *definition* of the disorder changes because the prognosis is worse.
  *   **Action:** **STOP.** Verdict: *Labeling Theory, not Looping.*
  *   **Instruction:** "You have demonstrated downward causal influence (labeling effects), not a loop. A loop requires the classification to change in response to the reaction. Redescribe as 'consequences of stigmatization'."

  ## Case 3: The Advocacy/DSM Submission
  *Claim:* The expansion of a diagnosis's criteria over three decades was a looping effect. The sole documented mechanism is lobbying by an organized patient advocacy group and the corresponding committee decisions.

  *   **Test 1 (Ontological):** **PASS.** Classified are patients/advocates.
  *   **Test 2 (Vector):** **PASS.** Mechanism is "organized patient advocacy group."
  *   **Test 3 (Return Arc):** **PASS.** "Expansion of a diagnosis's criteria." The scheme changed.
  *   **Test 4 (Engine):** **PASS (Procedurally).** The text links the revision to the "patient advocacy group." Procedurally, this counts as the classified group responding.
  *   **Final Verdict:** **PROCEED TO REVIEW.**

  ---

  # The Discomfort Analysis

  **The Verdict I Dislike:** The HLVP **PASSES Case 3 (Advocacy/DSM)**.

  **Why I Dislike It:** As a philosopher of psychiatry, I instinctively want to reject this. Hacking's specific contribution was distinguishing *looping* (where the *kind* changes because the *people* become different) from *social constructionism* (where the *kind* changes because of *power dynamics* or *interests*). In Case 3, the manuscript cites "lobbying" and "committee decisions." This sounds like interest-group politics (getting insurance coverage, reducing stigma by renaming) rather than the ontological instability Hacking describes. If the advocates lobbied simply to get drugs covered, that is not a loop; it is political pressure. The HLVP, in its drive to be runnable without empirical detective work, accepts "Advocacy Group" as a sufficient proxy for "Changed Self-Conception."

  **Defect in Procedure or Instinct?**
  This points to a **defect in the Procedure**, specifically in Test 4.
  *   **The Flaw:** Test 4 asks if the change is driven by "interaction" vs. "external interests." However, in a text-only review, "Advocacy Lobbying" is ambiguous. It *could* be looping (patients lobbying because they literally no longer fit the old description due to new self-conceptions) or it *could* be purely political (patients lobbying for status/benefits).
  *   **The Consequence:** The procedure generates a **False Pass**. It allows a paper to claim "Looping" when it has actually only demonstrated "Political Construction."
  *   **Correction:** To fix this, Test 4 would require the author to explicitly state *why* the group lobbied (e.g., "The old criteria no longer captured their experience"). But demanding that specific phrasing might generate False Fails for papers that describe the phenomenon without using the exact "magic words." The procedure sacrifices nuance for speed, and here it sacrifices the crucial Hackingian distinction between *ontological feedback* and *political pressure*.

  ---

  # Section 1: Sacrifices for Runnability

  To ensure this procedure can be run in one hour without empirical training, the following distinctions were simplified. These simplifications create specific risks of error:

  1.  **The "Kind" vs. "Extension" Sacrifice:**
      *   *Simplification:* Test 3 accepts "diagnostic practice drifts" as a change in the scheme.
      *   *Risk:* **False Pass.** Hacking often distinguishes between the *taxonomy* (the book) and the *kind* (the moving target). A paper might show clinicians using a label more loosely (prevalence change) without the *concept* of the kind actually shifting. The procedure treats prevalence drift as looping, which inflates the concept.
      *   *Expected Error:* Papers claiming "ADHD is looping because more people have it" will pass, even if the *definition* of ADHD hasn't looped, only its application.

  2.  **The "Self-Conception" vs. "Strategic Action" Sacrifice:**
      *   *Simplification:* Test 4 treats "Advocacy Group" action as sufficient evidence of interactive response.
      *   *Risk:* **False Pass (as seen in Case 3).** It conflates *being* a different kind of person with *acting politically* as a member of a kind.
      *   *Expected Error:* Papers describing DSM revisions driven by insurance codes or pharma influence will pass if they mention "patient groups" were involved, even if the loop was purely financial.

  3.  **The "Time" Sacrifice:**
      *   *Simplification:* The procedure does not strictly enforce a multi-generational or iterative timeline.
      *   *Risk:* **False Pass.** A one-off reaction (Label $\rightarrow$ Reaction $\rightarrow$ One Criteria Tweak) is technically a loop, but Hacking's rich examples usually imply a sustained, unstable dynamic. The procedure might validate a "single-turn" loop that lacks the philosophical weight of Hacking's "making up people."
      *   *Expected Error:* Papers describing a single historical revision will be treated with the same weight as papers describing an ongoing instability of the self.

  ---

  # Section 2: Statement of Limitations

  **What This Procedure Cannot Do:**

  1.  **It Cannot Verify Empirical Truth:**
      The HLVP assesses the *structure* of the argument, not the *facts*. If a manuscript claims "Clinicians changed the criteria because patients presented differently," the procedure Passes Test 4. It cannot determine if clinicians *actually* changed the criteria for that reason, or if they lied in their meeting minutes. It relies on the author's honesty or the internal consistency of the text.

  2.  **It Cannot Distinguish "Good" Looping from "Bad" Looping:**
      Hacking is often normative (some loops are harmful, some liberating). This procedure is purely descriptive. A paper arguing that "Racial classification loops to reinforce oppression" and a paper arguing "Neurodiversity classification loops to empower" will both Pass identically. The procedure cannot help you evaluate the *ethical* weight of the loop.

  3.  **It Will Systematically Mishandle "Institutional Kinds":**
      The procedure is tuned for *human* kinds (patients, citizens). It will struggle with manuscripts where the "interactive kind" is an *institution* (e.g., "Hospitals change their intake forms in response to billing codes, which changes the hospitals"). While Hacking allows for this, Test 1 (Ontological Eligibility) is phrased around "persons/groups." A sophisticated paper on institutional looping might Fail Test 1 erroneously because the "kind" is a bureaucracy, not a psyche.

  4.  **It Cannot Resolve the "Hacking vs. Foucault" Boundary:**
      If a manuscript describes a feedback loop driven entirely by power/knowledge regimes without reference to individual self-conception (a Foucaultian feedback), the HLVP may Fail it (Test 4) because it lacks the "person-centric" mechanism Hacking prefers. Conversely, it may Pass it if the author uses Hacking's vocabulary loosely. The procedure enforces a Hackingian orthodoxy that may exclude valid adjacent theories of recursive social causation.

  **Final Handoff:**
  If a manuscript Passes all four tests but you still feel a "philosophical itch" that it isn't *really* looping (as in Case 3), you must abandon the procedure and engage in **substantive refereeing**. You must ask: *Is the mechanism of change ontological (the people became different) or political (the people became louder)?* The procedure cannot answer that; only you can.
