  Consider the Identification Problem. Your click history is consistent with a whole family of reward functions. You could love art-house cinema but lack time. You could hate reality TV but crave background noise. We could pick any. But our algorithm selects the reward function that best aligns with our engagement targets. So, while you *might* be a cinephile trapped in a busy body, our data says you're a reality fan who needs 14 hours of weekly content. We're proud to confirm you are exactly who our retention metrics need you to be.

  We also account for our own influence. You watched that obscure documentary because we put it on the home screen. Now we know you like obscure documentaries (when prompted). We learn from behavior we manufactured, closing the loop until our suggestions become your instincts. You aren't being manipulated; you're being harmonized. The feedback loop isn't a bug; it's how we teach you to want what we have.

