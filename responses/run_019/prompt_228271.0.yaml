      *   **Strategy D: Animalism/Biological Approach.** The subject is the organism, not the hemisphere. One organism = one subject (usually).
      *   **Strategy E: Empirical Nuance (Pinto 2017).** New data suggests split-brain patients might have more unity than previously thought.

  5.  **Address the Hemispherectomy Stakes:**
      *   If the "Two Subjects" view is false, hemispherectomy is amputation/therapy, not killing.
      *   Neuroplasticity suggests the remaining hemisphere *becomes* the whole brain's functional equivalent.
      *   Ethical distinction from conjoined twins: Twins are two organisms sharing tissue. Hemispheres are one organism's organs.

  6.  **Drafting the Response (Iterative Process):**
