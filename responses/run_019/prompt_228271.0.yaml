      *   *P2 (Sufficiency):* Even if a hemisphere *can* support consciousness *after* severing, does it support a *full* subject *before* severing? This is the "Potentiality vs. Actuality" distinction.
      *   *P3 to C (The Inference):* This is the crux. It assumes that connection = synchronization of two things, rather than connection = constitution of one thing. It commits a mereological fallacy or relies on a specific metaphysical view of substrates (substratum theory vs. bundle theory vs. animalism).
      *   *The "Unity of Consciousness" Problem:* Is unity a primitive fact or a composite achievement? (Kant, Bayne).
      *   *The Hemispherectomy Angle:* Neuroplasticity in children is key. If the remaining hemisphere takes over functions, does the "subject" migrate or consolidate?

  4.  **Identify Key Counter-Arguments/Blocking Strategies:**
      *   **Strategy A: The Disconnection Interpretation (Bayne).** Split-brain patients don't necessarily have *two* subjects; they have *one* subject with fragmented access. The conflict is at the level of motor control or information access, not phenomenological subjecthood.
      *   **Strategy B: The Potentiality Argument.** Hemispheres are *potentially* conscious subjects, but in the intact brain, they are proper parts of a single system. Severing actualizes the potential. Analogy: Cutting a planarian worm. Before cutting, it's one worm. After, it's two. Was it two worms before? No.
