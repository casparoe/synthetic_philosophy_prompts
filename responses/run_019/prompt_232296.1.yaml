prompt: |-
  I’m a PhD student in bioethics and I’m TAing an upper-level seminar on the determination of death this term. The instructor has asked me to draft a final-exam question that tests whether students can actually reason with the brain death debate, not just recite the 1981 Uniform Determination of Death Act or the textbook definitions. I want to build the question around this passage from the President’s Council on Bioethics, *Controversies in the Determination of Death*: “A patient diagnosed with this condition will never recover brain-dependent functions, including the capacity to breathe and the capacity to exhibit even minimal signs of conscious life. If the patient is sustained with life-supporting technologies, this condition need not lead immediately to somatic disintegration or failure of other organ systems.”

  I want the exam question to force students to confront the weirdness the passage is gesturing at: total brain failure seems compatible with ongoing, technology-supported integration of the rest of the organism, and yet we treat the person as dead. So I’m imagining something like: a question that presents the passage and then asks students to explain why the Council thinks this condition nonetheless counts as death, how a circulatory-respiratory defender might push on the “organism as a whole” claim, and how a higher-brain/personhood theorist would object from the opposite direction. But I’m not sure the wording is tight, and I need a model answer and a marking scheme that separates an A from a B.

  Can you draft the final-exam question, a model answer of about 600–700 words, and a marking scheme? Make the question upper-level. The marking scheme should name specific moves a top answer must make—e.g., distinguishing the definition/criterion/tests triad, explaining why “capacity to breathe” is not the same as “spontaneous breathing,” and addressing the personhood view without collapsing into it. I also want it to catch the common student mistake of treating the passage as merely a clinical description and ignoring the philosophical work it’s doing. Please make the question self-contained, include the passage in the question, and don’t require any outside citations—the students have read the report excerpt.
