          *   Circulatory-Respiratory Objection: Challenge "organism as a whole." If homeostasis exists, is it death?
          *   Higher-Brain Objection: Focus on personhood, not biology. Why biological integration is irrelevant if consciousness is lost.
          *   Conclusion: Synthesize the philosophical work.
      *   *Key Concepts to Hit:* Definition vs. Criterion, Capacity vs. Performance, Somatic Integration, Personhood.

  5.  **Drafting the Marking Scheme:**
