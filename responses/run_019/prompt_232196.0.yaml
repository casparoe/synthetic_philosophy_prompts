answer: |-
  **Activity: The Cycle Trade**

  **Setup & Roles (5 mins)**
  *   **Facilitator:** Acts as the Bookie.
  *   **Students:** Traders (pairs work best to encourage discussion).
  *   **Stakes:** Use points redeemable for candy at the end.
  *   **Options:** Three gambles written on cards.
      *   **A:** 90% chance of 5 points.
      *   **B:** 50% chance of 10 points.
      *   **C:** 10% chance of 50 points.
  *   **Cost:** Each trade costs 1 point.
  *   **Goal:** Maximize final points.

  **Timeline (50 mins)**
  *   **0–5:** Distribute materials. Give every pair Card A.
  *   **5–20:** **Variant 1 (Naive).** Approach pairs individually. Offer to swap A→B (cost 1), then B→C (cost 1), then C→A (cost 1). Do not reveal future offers. Record final holdings.
  *   **20–35:** **Variant 2 (Sophisticated).** Reset to Card A. Show all three cards and trade costs simultaneously. Ask pairs to submit a written *plan* (e.g., "Keep A" or "Swap A→B then stop"). Execute plans.
  *   **35–50:** **Debrief.** Reveal the term "Money Pump."

  **Minimal Script (Pre-Reveal)**
  "Welcome. You hold Option A. I am offering a voluntary exchange. You may trade your current card for the next one in the sequence for a fee of 1 point. The choice is yours. There are no tricks, only choices. Do you wish to trade?"
  *(Repeat for each step in Variant 1. Do not mention 'cycle' or 'preferences'.)*

  **Debrief Map**
  Connect game moments to argument premises:
  *   **Local Rationality:** In Variant 1, each trade felt beneficial *at the time* (A→B seemed worth 1 point).
  *   **Global Irrationality:** Ending with A minus 3 points is strictly worse than starting with A.
  *   **Transitivity:** The cycle implies A > B, B > C, and C > A. Ask: "Can you prefer A to B, B to C, but C to A simultaneously?"
  *   **Sophistication (Variant 2):** Seeing the cycle allows planning. Did you refuse to start? If so, you avoided the pump but potentially forfeited a gain you originally wanted (A→B). This shows sophistication avoids exploitation but requires resolving the preference conflict, not just seeing it.
  *   **Memory/Identity:** The pump works only if you don't recall past trades (Variant 1) or cannot bind your future self.

  **Failure Modes**
  1.  **Refusal to Trade:** Students may suspect a trick immediately. *Fix:* Emphasize voluntary participation and run a practice round with no cost.
  2.  **Transitive Preferences:** Some students genuinely prefer A > B > C. They won't pump. *Fix:* Acknowledge this. The argument targets those *with* intransitive preferences. Ask those who did cycle to share their reasoning (e.g., "I wanted safety, then greed, then safety").
  3.  **Laughter/Dismissal:** Students might treat it as a game. *Fix:* Use real stakes (candy) and keep the tone serious during Variant 1.

  **Limitations & Honest Note**
  This activity assumes preferences are **static** during the 15 minutes. In reality, a student might choose A→B because they feel risky, then B→C because they feel cautious. If preferences shift over time, the money pump argument loses force—it becomes a story about changing tastes, not irrationality. The facilitator must stipulate: "Imagine your values today are fixed." The activity cannot reproduce the *normative* force of why you *shouldn't* change your mind; it only shows the *cost* if you do. Additionally, real-world friction (transaction costs, effort) often stops pumps naturally; the activity removes these to isolate the logical structure.

  **Word Count Check:** ~740 words.
  **Status:** Ready.
