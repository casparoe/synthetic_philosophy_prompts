      *   *Let's stick to the prompt's request:* "Propose [a better analogy] and show that it earns its keep." I'll propose **The Courtroom** for the *structure of justification generally*. It handles "burden of proof," "evidence that stops the regress" (exhibits), and "coherence of testimony."
