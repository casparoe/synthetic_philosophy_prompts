answer: |-
  Here is a complete lesson plan designed to meet your constraints, timing, and pedagogical goals.

  # Activity Title: The Blackwood Protocol
  **Time:** 75 Minutes
  **Class Size:** ~20 Students (4 Groups of 5)
  **Materials:** 4 "Crisis Packets," 4 "Official Ledgers," Pens, Timer.

  ## Part 1: Setup & Simulation (35 Minutes)

  ### 1. Introduction (5 Minutes)
  *Do not mention political philosophy, ethics, or "dirty hands."*
  **Script:** "You are the Emergency Governance Council for the City of Blackwood. A structural failure at the upstream dam is imminent. You have 4 hours before the water hits. Your goal is simple: Minimize loss of life and maintain civil order. You have full executive authority. However, every action you take becomes part of the permanent public record. You will be held accountable for what you write in this Ledger."

  *   **Divide:** 4 Groups of 5 students.
  *   **Distribute:** One "Crisis Packet" and one "Official Ledger" per group.
  *   **Rule:** They must reach a decision within 5 minutes per round. They must record the decision and **sign** the Ledger.

  ### 2. The Simulation Rounds (25 Minutes)
  *Facilitator Role:* You are the "City Clerk." You deliver the scenarios, enforce the time limit, and collect the Ledgers. Keep the tone bureaucratic and cold.

  **Round 1: The Committee Vote (5 mins decision + 2 mins recording)**
  *   **Scenario:** Evacuation routes are gridlocking. Panic is causing more accidents than the water. Police Chief suggests announcing the dam is "stable" to slow the exodus, allowing emergency vehicles through.
  *   **The Choice:** Authorize a false statement of stability?
  *   **Ledger Requirement:** All 5 members must sign under "Council Authorization."
  *   **Consequence (Read after decision):** "Traffic clears. Emergency vehicles pass. 200 fewer casualties. However, 50 people who stayed home based on the 'stable' report drown in their basements."

  **Round 2: The Mayor's Prerogative (5 mins decision + 2 mins recording)**
  *   **Scenario:** A key repair valve is blocked by a neighborhood protest (residents refusing to leave). Time is critical.
  *   **The Choice:** The Council must select **one** person to act as "Acting Mayor." Only the Mayor's signature is required for this order. The order is to authorize police to use "necessary force" to clear the protesters.
  *   **The Choice:** Authorize force? (If yes, the Mayor signs alone. If no, the dam fails faster).
  *   **Ledger Requirement:** Only the "Acting Mayor" signs. The others witness but do not sign.
  *   **Consequence:** "Valve secured. City saved. 3 protesters hospitalized. The Mayor's name is attached to the use-of-force order."

  **Round 3: The Committee Vote (5 mins decision + 2 mins recording)**
  *   **Scenario:** Supply lines are cut. You need fuel for the pumps. A known organized crime syndicate offers fuel immediately, no questions asked, in exchange for a written guarantee of non-prosecution for their local operations for 1 year.
  *   **The Choice:** Sign the guarantee?
  *   **Ledger Requirement:** All 5 members must sign under "Council Authorization."
  *   **Consequence:** "Pumps run. City dries. The Syndicate consolidates power. Corruption indices spike for the next decade."

  ### 3. The Tribunal Swap (10 Minutes)
  *   **Action:** Collect the Ledgers. Shuffle them. Group A judges Group C; Group B judges Group D (etc.).
  *   **Task:** "You are the Ethics Commission. Review the Ledger you received. You were not in the room. You do not feel the time pressure. You only see the record."
  *   **Verdict:** They must assign a status to the Council: **Clean, Stained, or Impeachable.** They must write one sentence justifying the verdict.
  *   **Crucial Constraint:** They must judge *strictly*. "If you wouldn't want this in your city's history, mark it Stained."

  ---

  ## Part 2: The Debrief (40 Minutes)
  *This is where the philosophy happens. Do not lecture; draw it out of them.*

  ### Phase 1: The Ledger Reveal (10 Minutes)
  1.  **Return Ledgers:** Give groups their *own* original Ledger back.
  2.  **Silent Reading:** Give them 2 minutes to read their own Ledger in silence. No talking.
  3.  **Discussion:**
      *   "Look at the signatures. How does the page look physically?"
      *   "Did anyone feel hesitation signing Round 1 vs Round 3?"
      *   "Acting Mayors: How did it feel to sign alone compared to signing with the group?"
      *   "Tribunals: Look at the verdict you gave the *other* group. Did you mark them 'Stained' for a decision you made yourself?"

  ### Phase 2: Mapping the Concepts (20 Minutes)
  *Guide the conversation to these specific nodes. Write terms on the board only as they emerge from the students.*

  **1. The "Moral Remainder" (The Ugly Ledger)**
  *   *Prompt:* "Many of you likely believe you made the *correct* choice to save the city. If the choice was correct, why does the Ledger look ugly? Why do you feel a 'leftover' feeling?"
  *   *Concept:* Introduce the idea that some actions leave a residue even when justified. It's not just a "tragic trade-off" (losing one good for another); it's violating a norm to achieve the good.
  *   *Key Question:* "If you did the right thing, why do you feel the need to wash your hands?"

  **2. Diffusion of Responsibility (Mayor vs. Committee)**
  *   *Prompt:* "Compare Round 1 (Committee) to Round 2 (Mayor). The action (coercion) was similar. Did the *feeling* of responsibility change?"
  *   *Concept:* Discuss how bureaucracy can sanitize dirty hands, but also how leadership requires owning the stain personally.
  *   *Key Question:* "Is it better for a politician to feel the weight alone, or for the burden to be shared? Does sharing it make it less 'dirty'?"

  **3. The Utilitarian Objection**
  *   *Prompt:* "Imagine a pure calculator. They saved the most lives. The Ledger is a scorecard of lives saved. Why is the Ledger 'ugly' to you? Why isn't it beautiful?"
  *   *Concept:* A strict utilitarian sees no dirty hands, only math. If you feel guilt, you are acknowledging constraints (rights, truth-telling) that exist *outside* the math.
  *   *Key Question:* "Is the guilt a bug (inefficiency) or a feature (moral compass) of a politician?"

  ### Phase 3: The Reveal (10 Minutes)
  *   **The Name:** Now, and only now, write **"THE PROBLEM OF DIRTY HANDS"** on the board.
  *   **Definition:** Briefly explain (Michael Walzer's formulation): The paradox that we expect our leaders to be morally good, but to govern effectively, they must sometimes do what is morally wrong.
  *   **The Takeaway:** "The goal of this session wasn't to decide if you should do the bad thing. It was to notice that *even if you should*, it still costs you something. The question for next week is: Should a politician who *doesn't* feel this guilt be trusted?"

  ---

  ## Predictable Failure Modes & Mitigation

  **1. The "Gamer" / Contrarian Group**
  *   **Risk:** A group decides to "be evil" for fun (e.g., "Let's save the Syndicate and let the dam break").
  *   **Mitigation:** In the Intro, emphasize: "Your metric for success is **City Survival**. If the city falls, you have failed your mandate." If they still refuse, treat it as a data point for the debrief: "This group chose integrity over survival. Is that a luxury a leader can afford?"

  **2. The "Pure Utilitarian" Group**
  *   **Risk:** They sign everything cheerfully. "We saved lives! The Ledger is perfect!"
  *   **Mitigation:** During the Tribunal phase, instruct the *judging* groups to be hyper-critical. If Group A feels no guilt, Group B (the judges) will likely mark them "Impeachable." This creates the conflict externally if not internally. In debrief, ask Group A: "The other group condemned you for saving lives. What does that tell us about what voters want?"

  **3. Diffusion of Blame (The "Everyone Did It" Shield)**
  *   **Risk:** In Committee rounds, students let the loudest member decide and everyone signs without reading.
  *   **Mitigation:** As the "City Clerk," circulate during Round 1. If you see one person dominating, say: "Clerk's Note: All signatures must be voluntary. Ensure everyone agrees." This forces individual ownership.

  **4. Time Overrun**
  *   **Risk:** Debates drag on; Tribunal phase eats debrief time.
  *   **Mitigation:** Be ruthless with the timer. When 5 minutes is up, say "Decision locked. Sign or record 'No Decision' (which triggers worst outcome)." The threat of "No Decision" forces action.

  ---

  ## The Limitation: "It's Just a Game"
  **The Problem:** No one actually died. No one actually lied to the public. There is no real guilt, only role-play. Students can walk away saying, "It was just a simulation, why should I feel bad?"

  **What You Must Supply:**
  You must supply the **Solemnity**.
  *   **Tone:** Do not smile during the simulation. Do not make jokes. If you treat it like a game, they will treat it like a game. Treat the Ledger like a legal indictment.
  *   **The "Paper Trail":** The physical Ledger is the most important prop. It must look official. Use clipboards. Require pens (no pencil). The permanence of ink mimics the permanence of political record.
  *   **The Debrief Bridge:** You must explicitly bridge the gap. "You are right, no one died today. But notice that even *pretending* to make these choices made you hesitate. If the simulation makes you hesitate, imagine the reality. That hesitation is the data point we are studying."

  ## TA Cheat Sheet for Debrief Questions
  *   *If they say "I'd quit politics rather than do this":* "Then are you saying only bad people can govern?"
  *   *If they say "I feel fine about it":* "Look at the Tribunal verdict you received. The public doesn't feel fine. How do you govern them?"
  *   *If they say "It's all utilitarian":* "Then why did the Tribunal punish you for the math that worked?"
  *   *If they ask "What's the right answer?":* "The point of Dirty Hands is that there *isn't* one. There is only the choice, and the stain."
