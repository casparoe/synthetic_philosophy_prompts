prompt: |-
  I TA for an undergrad political philosophy course, and for the session on dirty hands in politics the prof has banned me from lecturing -- she wants the ~20 students (75 minutes, one session) to run into the problem themselves before anyone names it. Design me a runnable activity. My rough idea: split them into small groups running a fictional city government through a crisis (a credible terrorist threat, or an epidemic, you pick whichever makes for better decisions), where they face a sequence of escalating choices. Each individual choice should be one a reasonable person could defend -- lying to the public to prevent a panic, letting an innocent low-level official take the fall, cutting a deal with someone awful -- but I want the design arranged so the defensibility decays slowly enough that they don't notice how far they've slid. Crucially, have each group keep a written ledger of everythign they authorized, without telling them why, so the reveal at the end is them reading their own record back. I'd also like a second phase where groups swap: each group becomes a tribunal reviewing another group's ledger and has to issue a verdict, so they feel the weird asymmetry between judging from the outside and choosing from the inside -- ideally at least one group condemns another group for a decision they themselves made earlier in the run.

  A few requirements. First, the target insight I want them to arrive at experientially is not "should you do the bad thing" but the stranger claim that an action can be the right thing to do and still leave something behind -- that even students who stand by every decision should find their own tally sheet ugly to read, and the debrief should dig into what that leftover feeling is and whether a good politician ought to feel it or has a duty to learn not to. Second, if you can fit it in the time, I'd love a mechanic that contrasts one decision made by a single named "mayor" with the identical decision made by anonymous committee vote, because I suspect the diffusion changes how dirty anyone feels while changing nothing about the dilemma itself, and that gap is interesting. Third, the debrief section should map specific moments of the activity onto the conceptual structure (how this differs from an ordinary tragic tradeoff, what the "moral remainder" is supposed to be, where a pure utilitarian would deny there's any problem at all and what to say to them).

  Also tell me what will predictably go wrong the first time I run it -- students gaming the scenario, contrarians who relish authorizing everything, groups that refuse to take the fiction seriously, that kind of thing -- and how to handle each. And be honest about the one thing a classroom game obviously can't reproduce (real stakes, real guilt, real consequences) and what I as facilitator need to supply to compensate for that. No upfront explanation of the concept; they should only hear the phrase "dirty hands" after the debrief has already happend.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Role:** TA for an undergrad political philosophy course.
      *   **Topic:** Dirty Hands in Politics (Walzer, etc.).
      *   **Constraint:** No lecturing upfront. Students must "run into the problem themselves."
      *   **Class Size/Time:** ~20 students, 75 minutes.
      *   **Core Idea:** Small groups run a fictional city through a crisis. Escalating choices (defensible individually, ugly collectively). Written ledger of authorizations. Second phase: Groups swap ledgers and act as a tribunal (judging others vs. self).
      *   **Target Insight:** Not "is the bad thing right?" but "an action can be right and still leave a moral remainder/stain." Even if they stand by decisions, the tally sheet should feel ugly.
      *   **Specific Mechanic:** Contrast single "Mayor" decision vs. anonymous committee vote (diffusion of responsibility).
      *   **Debrief:** Map activity to concepts (tragic tradeoff vs. dirty hands, moral remainder, utilitarian objection).
      *   **Logistics:** Predict failure modes (gaming, contrarians, disengagement) and mitigation. Acknowledge limitations (lack of real stakes) and how to compensate.
      *   **Forbidden:** Do not use the phrase "dirty hands" until the very end.

  2.  **Deconstruct the Activity Flow (75 Minutes):**

      *   *Intro/Setup (5 mins):* Context setting without theory.
      *   *Phase 1: Crisis Management (30 mins):* The simulation. Needs escalating choices. Needs the Mayor vs. Committee mechanic. Needs the Ledger.
      *   *Phase 2: The Tribunal (15 mins):* Swapping ledgers. Judging.
      *   *Phase 3: Debrief/Discussion (25 mins):* Connecting experience to theory.

  3.  **Drafting the Scenario (The "Crisis"):**

      *   *Option A: Terrorist Threat.* High stakes, immediate violence. Might feel too action-movie-ish.
      *   *Option B: Epidemic.* High stakes, public health, requires lying/restriction. Very relevant, but might trigger fatigue.
      *   *Option C: Economic Collapse + Civil Unrest.* Good for "deals with awful people."
      *   *Selection:* Let's go with a **Hybrid: Infrastructure Collapse + Unrest.** A dam is failing (immediate physical threat) but fixing it requires cutting a deal with a corrupt union boss or displacing a poor neighborhood. This allows for "lying to prevent panic" (dam safety) and "deals with awful people" (union/crime). Let's refine: **A Looming Water Contamination Crisis.** It allows for secrecy, sacrifice, and deals.
      *   *Refinement for "Dirty Hands":* Dirty hands isn't just tragedy (choosing the lesser evil); it's violating a deep moral norm *to* achieve the good. So the actions need to be *wrong* in themselves (lying, punishing innocents, collaborating with evil) but *necessary* for the outcome.
      *   *Scenario:* "The City of Oakhaven." A chemical spill is imminent.
      *   *Choices:*
          1.  Withhold info to prevent stampede (Lie).
          2.  Scapegoat a junior engineer (Injustice).
          3.  Accept bribe/help from a known crime syndicate to move resources (Collaboration).
          4.  Divert water from a neighboring poorer town (Sacrifice of outsiders).

  4.  **Integrating the "Mayor vs. Committee" Mechanic:**

      *   Need to split the 20 students into 4 groups of 5.
      *   *Rounds:*
          *   Round 1: Committee Vote (Anonymous).
          *   Round 2: Single Mayor (Rotated or Assigned).
          *   Round 3: Committee Vote.
      *   *Ledger:* Must record *who* authorized it (Name or "Committee").

  5.  **Developing the Tribunal Phase:**

      *   Group A judges Group B's ledger.
      *   They must issue a "Verdict": Clean, Stained, or Impeachable.
      *   Crucial instruction: Judge *strictly*.
      *   Reveal: Compare verdicts given to others vs. decisions made themselves.

  6.  **Developing the Debrief:**

      *   Start with feelings: "How does the ledger look?"
      *   Move to the Mayor vs. Committee feeling.
      *   Introduce concepts: Moral Remainder, Dirty Hands (Walzer), Utilitarian view (no remainder).
      *   Final question: Should a politician feel guilt?

  7.  **Addressing Failure Modes:**

      *   *Gaming/Trolling:* Students choosing the "evil" option for fun. *Fix:* Frame consequences seriously.
      *   *Refusal:* "We won't lie." *Fix:* Force the trade-off (if you don't lie, X people die).
      *   *Diffusion:* Everyone blames the group. *Fix:* The Ledger requires signatures.
      *   *Time:* 75 mins is tight. *Fix:* Strict timekeeping.

  8.  **Addressing the "Real Stakes" Limitation:**

      *   It's a game. No one dies.
      *   *Compensation:* The TA must treat the consequences as real. Use somber tone. The "ugliness" comes from the *record*, not the outcome.

  9.  **Refining the Plan (Self-Correction during drafting):**

      *   *Correction:* 75 minutes is very short for 3 phases + debrief. I need to tighten the simulation rounds. Let's do 3 specific decision points total.
      *   *Correction on Mayor Mechanic:* To save time, make Round 2 the "Mayor" round. Rounds 1 & 3 are Committee.
      *   *Ledger Design:* Needs to be simple. Decision | Rationale | Signatories.
      *   *Tribunal:* Keep it quick. 5 minutes to read, 5 minutes to verdict.
      *   *Debrief:* This is the most important part. Needs 30 mins minimum. So Simulation + Tribunal = 45 mins.

  10. **Finalizing the Content:**

      *   *Scenario:* "The Blackwood Dam." Structural failure imminent.
      *   *Decision 1 (Committee):* Withhold info to prevent traffic gridlock hindering evacuation. (Lie/Omission).
      *   *Decision 2 (Mayor):* Authorize police to forcibly clear a neighborhood blocking repair crews. (Violence/Coercion).
      *   *Decision 3 (Committee):* Accept "unofficial" help from a local cartel to secure supply lines, promising no prosecution. (Deal with Devil).
      *   *Ledger:* "The Official Record."
      *   *Tribunal:* "The Ethics Commission."

  11. **Writing the Response:**

      *   Structure: Overview, Materials, Timeline, Scenario Details, Debrief Script, Failure Modes, Limitations.
      *   Tone: Professional, practical, pedagogical.
      *   Ensure the "Dirty Hands" phrase is banned until the end.

  12. **Review against constraints:**
      *   No lecturing upfront? Yes.
      *   Target insight (moral remainder)? Yes, built into ledger review.
      *   Mayor vs. Committee? Yes, Round 2.
      *   Tribunal swap? Yes.
      *   Debrief mapping? Yes.
      *   Failure modes? Yes.
      *   Limitations? Yes.

  13. **Final Polish:** Check timing. 5 min intro, 30 min sim, 10 min tribunal, 30 min debrief. That's 75. Tight but doable. I will emphasize timekeeping.

  *(Self-Correction on Tribunal)*: If Group A judges Group B, and Group B judges Group A, they might collude ("I'll go easy on you if you go easy on me"). I need to prevent this. *Fix:* Group A judges Group C. Or, instruct them that *their grade* depends on the rigor of their justification, not the leniency. Better: Random assignment of ledgers. With 4 groups, A->B, B->C, C->D, D->A.

  *(Self-Correction on Mayor)*: To make the "Mayor" feeling distinct, the Mayor must sign *alone*. The Committee signs *collectively*. This visual difference on the ledger is key.

