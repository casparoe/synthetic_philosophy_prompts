  Elena tapped the schematic of the two urns on the tablet. "This incentive scheme is incoherent, Marcus. If we pay fellows based on a draw from the unknown urn, we're inviting them to make choices that violate the basic axioms of rational preference."

  Marcus leaned back, crossing his arms. "It's not incoherent; it's honest. The applicants know the mechanical urn yields red with exactly one-third probability. The clay urn yields red with one-third probability objectively, but the composition is hidden. They prefer the known risk to the unknown uncertainty. That's not a bug; it's a feature of how agents process impoverished evidence."

  "Is it?" Elena leaned forward. "Consider the bets. If an applicant prefers the known urn for a bet on Red, they act as if the probability of Red in the unknown urn is less than one-third. If they also prefer the known urn for a bet on Black—or rather, Black-or-Yellow, since one must win—they act as if the probability of Not-Red is less than two-thirds. But probabilities must sum to one. By refusing both the Red bet and the Not-Red bet on the unknown urn, they are effectively declining a free option. They are saying that in the unknown urn, neither Red nor Not-Red is as likely as it is in the known urn. That implies the total probability mass in the unknown urn is less than one. It's a sure loss compared to holding both tickets."

  Marcus nodded slowly. "I concede that no single probability distribution captures those choices. If I assign a precise number to Red in the clay urn, I cannot prefer the known urn for both Red and Not-Red. But why must an agent with genuinely impoverished evidence owe the world a precise distribution? You are conflating uncertainty about an outcome with uncertainty about which model of the outcome is correct. In the mechanical urn, the model is fixed. In the clay urn, the model is missing. My reluctance to bet isn't a confusion about the balls; it's a reflection of the weight of the evidence. I don't have a single prior; I have a set of priors ranging from zero to sixty black balls. Betting requires picking one, and picking one arbitrarily exposes me to error costs that don't exist in the known case."

  "That set of priors is your private mental state, not a justification for violating coherence," Elena countered. "Let's look at this dynamically. Suppose I offer you these choices sequentially. First, I offer you a choice between the known and unknown urn for a Red bet. You choose Known. Then, I offer you a choice between the known and unknown urn for a Black bet. You choose Known. Now, imagine I offer you the package deal in advance: 'I will let you choose the urn for Red, and then I will let you choose the urn for Black.' If you know you'll choose Known both times, you should pay to lock in the Known urn for both now. But if your preferences shift based on how the question is framed, or if you fail to anticipate your future choices, I can construct a sequence where you pay to switch to the unknown urn, then pay to switch back. You become a money pump. You regret your own policy when the sequence is laid out in advance."

  Marcus didn't flinch. "I avoid the pump by resolute choice. I commit to the policy of avoiding the unknown urn regardless of the framing. I don't update my preferences dynamically like a Bayesian conditionalizer because I don't treat the new information—the framing of the bet—as updating the probability of the ball colors. I treat it as highlighting the ambiguity. The axiom you're relying on assumes that dynamic consistency is the highest norm. I argue that respecting the quality of evidence is higher. If violating dynamic consistency prevents me from betting on a model I know is unsupported, I accept that violation. I won't pay to switch back because my rule is fixed: never bet on ambiguity when risk is available at the same expected value."

  "Fixed rules don't survive frequency," Elena said, shifting tactics. "Would you make the same choices if you had to run this committee's scheme a thousand times? If you draw from the clay urn a thousand times, the law of large numbers guarantees the relative frequency of Red converges to one-third. The ambiguity washes out. In a repeated setting, the expected utility of the unknown urn equals the known urn. Would you still pay a premium to avoid the clay urn if you knew you'd draw from it every day for a decade?"

  Marcus paused, looking at the urns. "That's the crux, isn't it? In a repeated game, the ambiguity diminishes because the mechanism reveals itself. But hiring isn't a repeated game for the applicant. This fellowship is a one-off event. Their career hinges on this single draw. In a unique decision, the distinction between risk and uncertainty is maximal. If you force me to repeat the bet a thousand times, yes, I might converge to your Bayesian view because the evidence accumulates. But for a single hire, the lack of frequency data is a structural fact, not a temporary ignorance. I shouldn't be forced to pretend I have frequency data I don't possess."

  "So you admit," Elena said, "that your view depends on the scarcity of data. If the world were more regular, if we could verify the urn's contents, you'd bet like me."

  "I admit that ambiguity aversion is a response to missing information, not a rejection of probability itself," Marcus replied. "But you miss my point too. You're right that coherence matters. If I can't explain my choices without contradicting myself, I'm vulnerable. But I'd change my mind if you could show me a way to encode the 'weight of evidence' into a precise prior without pretending the evidence is stronger than it is. Can you give me a number that reflects both the probability and the confidence in that probability?"

  "And I'd change my mind," Elena said, closing the tablet, "if you could show me a dynamic strategy that respects ambiguity aversion without exposing the agent to sure losses over time. Until then, I can't recommend a scheme that incentivizes applicants to throw away money based on a distinction that vanishes under scrutiny."

  "Then we leave the urns on the table," Marcus said. "You see a pump; I see a shield."

  "You see a shield that leaks," Elena replied. "But I respect the instinct to build it."
