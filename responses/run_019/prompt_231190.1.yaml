answer: |-
  Translating Nomic into systems terms reveals the legal debate dissolves into a distinction between operational success and structural trust, exposing that the core conflict is actually about normative authority—a layer systems programming intentionally excludes.

  Imagine a self-hosting compiler repository where the build script defines the validity of commits. A developer submits a patch that compiles cleanly under the current build script (version $N$) but modifies the script itself (version $N+1$) to require unanimity for all future merges, retroactively invalidating the majority vote that authorized the current patch. Side 1 argues the commit is valid because the CI pipeline returned exit code 0 at the time of merge (temporal consistency); the interpreter state at execution time authorized the transition. Side 2 argues the commit is invalid because the resulting repository cannot self-build under the new rules without an external, trusted binary seed to verify the transition (structural consistency); the change invalidates the transitive closure of trust back to the genesis commit. Side 3 argues the question is a category error: the code is merely bits, and "validity" is just whether the maintainers accept the pull request, regardless of build status or spec compliance.

  **Residue Report:**
  *   **Clean Maps:** The ruleset maps to source code plus CI configuration; amendments map to commits; procedural validity maps to build success (exit code 0); the "external standard" maps to a Trusted Computing Base (TCB) or genesis block hash.
  *   **Fudged:** "Authority" maps poorly to "write access." In systems, root can overwrite anything regardless of rules; in law, having the physical power to enforce a rule does not confer the legal authority to make it. I had to simulate authority via cryptographic signing keys, which is a technical constraint rather than a normative one.
  *   **No Counterpart:** Normativity (the "ought"). Code executes causally; laws prescribe obligatorily. There is no compiler error for "unjust" or "ultra vires," only for "syntax error" or "linker failure." The concept of a rule being "in force" but "ignored" has no equivalent in a deterministic VM; either the instruction executes or it throws.

  This residue indicates your framework doesn't lack expressive power; rather, it deliberately separates *mechanism* from *policy*. The legal debate persists because jurisprudence tries to encode "ought" into "is," whereas systems programming treats build success (is) as distinct from spec compliance (ought). The disagreement clears up once you admit Side 1 describes *causal efficacy* (the change happened), Side 2 describes *verification integrity* (the change is trustworthy), and Side 3 describes *social consensus* (the change is accepted). The legal theorists are arguing past each other because they haven't decoupled execution from validation; in your terms, they are conflating the runtime behavior with the type system and the community governance model.
