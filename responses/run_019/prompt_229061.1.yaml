prompt: |-
  I'm taking phil of mind this semester and we just did the extended mind unit (Otto and his notebook vs. Inga and her memory). My roommate, who's in the class with me, put together this argument and it seems to prove way too much, but neither of us can find the hole.

  (1) A belief is just whatever plays the belief-role for you: information that guides your reasoning and your actions. Where it's physically stored doesn't matter.
  (2) That role is played when the info is reliably there when you need it, you go to it without deliberating, and you automatically endorse what it tells you.
  (3) Otto's notebook hits all three for the museum address, so the notebook entry is one of Otto's beliefs. (This is the extended mind bit and I'm totally fine with it.)
  (4) Now take me and my phone: it's in my pocket all day (reliably available), I look things up without deliberating, and I just go with whatever comes up (automatic endorsement).
  (5) So the stuff accessible through my phone is among my beliefs -- literally the contents of the internet, or at least everything it would pull up on any topic.
  (6) Those contents contradict each other all over the place, and tons of it is stuff I'd flat-out deny if you asked me cold. So on this view I have massively contradictory beliefs and "believe" things I'd sincerely disavow. That cant be right.
  (7) So something in (1)-(2) has to go -- but (3) was built entirely out of (1)-(2), so it looks like saving Otto costs the bloat, and killing the bloat costs Otto.

  Which step do I actually reject? If I have to choose I'd rather keep (3) and lose (5), but I can't see what separates them, since everything I said about my phone seems true in exactly the way the notebook stuff is true of Otto. And if the standard move is to tighten the criteria so my phone fails, why doesn't the notebook fail too?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Philosophy of Mind class, specifically the Extended Mind Thesis (EMT) based on Clark & Chalmers' "The Extended Mind" (Otto vs. Inga).
      *   **The Roommate's Argument:** A *reductio ad absurdum* against EMT.
          *   Premises (1)-(2): Functionalism about belief + criteria for coupling (reliability, automatic access, endorsement).
          *   Premise (3): Otto's notebook counts as belief (standard EMT).
          *   Premise (4)-(5): My phone + Internet counts as belief (by analogy).
          *   Premise (6): This leads to "cognitive bloat" (believing contradictions, believing things I'd deny).
          *   Conclusion (7): We must reject (1)-(2), but doing so threatens (3).
      *   **The User's Dilemma:** Wants to keep (3) (Otto's notebook) but lose (5) (Phone/Internet). Can't find the relevant difference. Fears that tightening criteria to stop the phone will also stop the notebook.
      *   **Goal:** Identify the flaw in the argument or provide a distinction that saves Otto without accepting the Internet as part of the mind (solving the "Cognitive Bloat" objection).

  2.  **Deconstruct the Argument:**
      *   The core issue is the **Parity Principle** (Clark & Chalmers): If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (for that time) part of the cognitive process.
      *   The roommate is applying the Parity Principle to the smartphone/internet.
      *   The "Cognitive Bloat" objection is a classic counter-argument to EMT.
      *   The user needs to know *where* the distinction lies. Is it in the criteria (1)-(2)? Or in the application (4)-(5)?

  3.  **Evaluate the Criteria (1)-(2):**
      *   (1) Functionalism: Generally accepted in this context.
      *   (2) The "Glue and Trust" conditions (Clark & Chalmers' later refinement):
          *   Reliability.
          *   Automatic endorsement (not critical scrutiny).
          *   Easy accessibility.
      *   *Problem:* The roommate claims the phone meets these. Does it?

  4.  **Identify Potential Distinctions (The "Hole"):**
      *   *Distinction 1: Constancy/History.* Otto carries the notebook *everywhere*. It's his constant companion. Do we carry phones everywhere? Yes, mostly. But did Otto *write* the notebook? Yes. Do I write the internet? No.
      *   *Distinction 2: Endorsement/Trust.* Otto trusts the notebook because *he* wrote it. It's a record of *his* past beliefs. The internet contains information I haven't vetted. I don't "automatically endorse" Google results in the same way. I know they might be wrong.
      *   *Distinction 3: Coupling vs. Constitution.* Just because I use a tool doesn't mean it's *part* of me. (The "Coupling-Constitution Fallacy").
      *   *Distinction 4: The "Past Self" argument.* Otto's notebook is externalized memory of *his* prior mental states. The internet is not.

  5.  **Focus on the Strongest Philosophical Responses:**
      *   **Clark & Chalmers' own response:** They actually addressed this! They introduced stricter conditions later (the "Glue and Trust" conditions).
      *   **The Endorsement Condition:** This is the killer. Otto *automatically* endorses the notebook. He doesn't question it. With a phone/Internet, we often search *because* we don't know, and we evaluate the results. We don't treat Wikipedia like biological memory.
      *   **The "Ownership" / "Causal History" Condition:** Otto's notes are traces of his *own* past cognitive processes. The internet is not.
      *   **Cognitive Bloat:** This is the specific name of the objection the roommate raised.

  6.  **Drafting the Response:**
      *   **Acknowledge the strength:** Validate that this is a famous and serious objection (Cognitive Bloat). It shows the roommate is thinking like a philosopher.
      *   **Pinpoint the flaw:** The flaw is in Premise (4) and (5). Specifically, the claim that the phone/Internet meets the "automatic endorsement" and "trust" criteria in the *same way* as Otto's notebook.
      *   **Develop the "Trust/Endorsement" Argument:**
          *   Otto treats the notebook as infallible (like memory).
          *   We treat Google as a source to be evaluated. If Google says "2+2=5", I reject it. If Otto's notebook says "MOMA is on 53rd", he goes there.
          *   *Key nuance:* It's about the *disposition* to believe.
      *   **Develop the "Causal History" Argument:**
          *   Otto's notebook contains information *he* put there. It's an extension of his biological memory.
          *   The Internet contains information *others* put there. It's a library, not a memory.
      *   **Address the "Coupling-Constitution Fallacy":**
          *   Just because I rely on it (coupling) doesn't mean it's part of my mind (constitution).
          *   To avoid bloat, we need to show the phone is merely coupled, while the notebook is constituted.
      *   **Suggest the specific fix to the argument:** Reject Premise (4). The phone does *not* meet condition (2) regarding "automatic endorsement."
      *   **Mention Clark's later work:** Clark admitted the "Google" case is harder and refined the view to focus on *dispositional* beliefs and specific integration.

  7.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Wait, doesn't Otto check the notebook?* Yes, but he doesn't critically evaluate the *truth* of the entry usually. He treats it as a memory trace.
      *   *What about contacts in a phone?* That's a better analogy than the whole internet. I trust my saved contacts like memory. I don't trust a random Google search like memory.
      *   *So, distinguish between the Phone as Hardware vs. Internet as Content.* The phone *could* be extended mind (contacts, calendar), but the *Internet* is not.
