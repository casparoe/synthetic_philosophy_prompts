      *   **Reason 2: Causal History.** Otto wrote the notes; you didn't write the web.
      *   **Reason 3: Specificity.** Saved contacts = belief. Random Google search = not belief.
      *   **Conclusion:** You can save Otto without accepting the Internet as your mind.

  9.  **Tone Check:** Keep it encouraging, academic but accessible, like a TA or helpful peer. Use the terminology (Parity Principle, Coupling-Constitution, Glue and Trust).

  10. (Final Polish): Make sure to explicitly answer "Which step do I actually reject?" -> Step (4)/(5). Explain *why* the criteria in (2) aren't actually met by the internet case.

  *(Self-Correction during drafting)*: I should mention that Clark himself evolved on this. In "Supersizing the Mind," he acknowledges the bloat problem. The distinction often lies in the *integration* into cognitive routines. Otto's notebook is deeply integrated. The internet is a resource we dip into.

