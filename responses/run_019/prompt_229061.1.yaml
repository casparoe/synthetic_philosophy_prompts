answer: |-
  This is a fantastic argument. Your roommate has independently reconstructed one of the most famous objections to the Extended Mind Thesis (EMT), known as the **"Cognitive Bloat" objection** (sometimes associated with critics like Adams & Aizawa).

  The good news is: You do not have to give up Otto to save yourself from believing the entire internet. The hole is in **Premise (4) and (5)**.

  Here is how you break the analogy without killing Otto.

  ### 1. The "Glue and Trust" Conditions
  Clark and Chalmers actually anticipated this. In later refinements of their theory, they argued that for something to count as part of the mind, it needs to meet stricter criteria than just "reliably available." They call these the **Glue and Trust** conditions.

  Look closely at your Premise (2): *"you... automatically endorse what it tells you."*

  *   **Otto:** When Otto looks at his notebook, he treats it like biological memory. He does not critically evaluate the entry. If the notebook says "MOMA is on 53rd," he goes to 53rd. He trusts it implicitly because *he wrote it* as a record of his own prior belief.
  *   **You + Internet:** When you Google something, do you "automatically endorse" the result? No. You evaluate it. If the top search result says "The capital of France is Berlin," you reject it. You treat the internet as a *testimony source*, not as *memory*.

  **The Fix:** You reject Premise (4). Your phone does **not** meet the "automatic endorsement" criterion for the general contents of the internet. You maintain a critical distance from search results that Otto does not maintain from his notebook.

  ### 2. The Causal History (Ownership) Argument
  There is a deeper metaphysical difference between Otto's notebook and your phone's connection to the web.

  *   **Otto's Notebook:** The information got there because of Otto's *past cognitive processes*. He learned the address, then he wrote it down. The notebook is a storehouse of *his own* prior mental states. It is an external hard drive for *his* brain.
  *   **The Internet:** The information got there because of *other people's* cognitive processes. You have no causal history with most of that data.

  If EMT means "anything I can access is my belief," then every library book I can read is my belief. That's absurd. EMT is plausible only when the external resource is functioning as a **trace of my own past cognition**. Otto's notebook is a trace of his past cognition; Wikipedia is not.

  ### 3. Distinguish the Hardware from the Content
  Your roommate's argument slides from "My Phone" to "The Contents of the Internet." These are different things.

  *   **Case A: Saved Contacts.** You have your mom's number saved in your phone. You don't memorize it. You trust it implicitly. You access it automatically when you want to call.
      *   *Verdict:* This **IS** an extended belief. Most EMT proponents would agree your saved contacts are part of your mind.
  *   **Case B: Google Search.** You search for "best pizza near me." You get five results. You read them and decide which to trust.
      *   *Verdict:* This is **NOT** an extended belief. This is using a tool to acquire a new belief.

  Your roommate's argument works for Case B but fails because Case B doesn't meet the criteria in (2). If you restrict the argument to Case A (saved contacts/calendar), the "bloat" disappears. You don't believe contradictory phone numbers; you believe the specific ones you saved.

  ### 4. The Coupling-Constitution Fallacy
  This is the technical name for the error in Premise (5). Just because a system is *coupled* to you (you rely on it) doesn't mean it *constitutes* you (is part of you).

  *   **Coupling:** I rely on my glasses to see.
  *   **Constitution:** My glasses are part of my visual system.
  *   **Coupling:** I rely on the internet to know facts.
  *   **Constitution:** The internet is part of my belief system.

  To avoid the fallacy, you need to show the integration is deeper. Otto's notebook is integrated into his cognitive routines in a way that mimics biological memory (constant access, no scrutiny, past self-authorship). The internet is integrated as a *reference library*.

  ### How to Reply to Your Roommate
  Tell them you reject **Premise (4)**. Specifically, the claim that you "automatically endorse" internet results.

  **Say this:**
  > "The analogy breaks at the 'endorsement' condition. Otto treats his notebook as infallible memory; he doesn't fact-check his own notes before acting. But I *do* fact-check Google. I treat the internet as testimony from others, not as a trace of my own past mind.
  >
  > If we restrict the Extended Mind to things that function as **externalized traces of my own past cognition** (like Otto's notes or my saved contacts), we keep Otto but avoid the bloat of the entire internet. The internet is a library I carry, not a mind I extend."

  ### Summary
  You can keep (3) and lose (5).
  *   **Otto's Notebook:** Functions as biological memory (high trust, self-authored). -> **Extended Belief.**
  *   **Your Phone (Contacts/Calendar):** Functions as biological memory (high trust, self-authored). -> **Extended Belief.**
  *   **The Internet (Search):** Functions as testimony/library (variable trust, other-authored). -> **Tool, not Belief.**

  The hole is assuming that "accessibility" is the only thing that matters. **Trust and Causal History** matter just as much.
