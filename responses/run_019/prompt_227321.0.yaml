prompt: |-
  So I've been chewing on an argument that keeps resurfacing whenever satisficing comes up on LW-adjacent threads, and I've talked myself into a position I want properly stress-tested rather than just nodded at.

  The position: bounded rationality isn't actually a rival theory of decision-making to expected utility maximization. It's just EU maximization with deliberation costs priced in. Every satisficing rule -- stop searching once you hit your aspiration level, take-the-best, 1/N portfolios, whatever -- can be reproduced as the output of some expected utility maximizer facing search costs, attention costs, or a finite compute budget. Simon needed the satisficing vocabulary because optimization-under-costs was mathematically intractable at the time, but conceptually the maximizer always swallows the satisficer. So when people say humans "satisfice rather than maximize," they aren't describing a different kind of agent, they're describing a maximizer whose cost function nobody bothered to write down. And the whole fast-and-frugal heuristics programme is at best a nice collection of engineering tricks for compute-limited agents, and at worst an unfalsifiable umbrella that can claim any behavior post hoc by positing whatever environmental constraints make it "ecologically rational."

  What would count against this? Specifically:

  - Empirically: what behavioral findings, if they hold up, can't be redescribed as constrained maximization without doing violence to the very idea of a cost function? People point at aspiration levels that shift based on recent search experience -- does the maximizer picture handle that cleanly, or only by baking the observed behavior into the utility function, which feels like cheating?
  - Formally: is there any result that actually separates the two? E.g. a class of problems where the optimal-with-deliberation-costs policy provably doesn't look like any simple heuristic, or the reverse -- a case where a fixed heuristic beats every feasible approximation to the optimal policy in a way that the "you're really just maximizing" story can only accommodate by gerrymandering.
  - Conceptually: does MY position have its own falsifiability problem? If any behavior whatsoever can be fitted with some cost function, then "it's all maximization" is trivially true and therefore empty. Tell me whether that's a knock-down objection to what I'm saying or just pedantry.
  - And what would the bounded rationality camp itself accept as settling things? The less-is-more results -- heuristics beating full optimization in noisy environments with small samples -- are those genuine differential predictions that the maximize-with-costs picture fails to make, or the same predictions dressed in different clothes? If a committed ecological-rationality person and a committed constrained-maximization person can each explain every experiment the other one runs, I want that stated plainly.

  Rank the defeaters from fatal to merely annoying, and be explicit about which ones the satisficing side would themselves concede as damage versus dismiss as missing the point. Also, per usual: say what would change your mind about your own answer -- which argument, if it turned out to go through, would flip your verdict, and where your reasoning here is most likley to fail. And if your honest conclusion is that this whole dispute is terminological because the two camps are one utility-function redefinition away from each other, I'm open to that, but argue for it instead of asserting it, because "it's all semantics" is also a claim that should have to earn its keep.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Position:**
      *   **Core Claim:** Bounded rationality (satisficing, heuristics) is not a rival to Expected Utility (EU) maximization. It *is* EU maximization with deliberation/search/attention costs included.
      *   **Implication:** Simon's distinction was historical/mathematical convenience, not conceptual necessity. Humans are still maximizers, just with complex cost functions.
      *   **Critique of Heuristics:** Fast-and-frugal heuristics are either engineering tricks for limited agents or unfalsifiable post-hoc explanations ("ecological rationality").
      *   **Request:** Stress-test this position. Identify empirical, formal, and conceptual defeaters. Rank them. Determine if the dispute is terminological.

  2.  **Initial Assessment & Alignment:**
      *   This is a classic debate in decision theory and cognitive science. The user's position aligns with the "rational analysis" tradition (Anderson, Chater, Oaksford) and standard neoclassical economics (Stigler's "Economics of Information").
      *   The counter-position aligns with the Gigerenzer/Goldstein "Fast and Frugal Heuristics" program and the original Simonian view.
      *   *My internal knowledge:* The user's position is strong but vulnerable to the "infinite regress" problem and the "representation theorem" trap. If *any* behavior can be modeled as maximization, the claim becomes tautological. However, if the cost function is intractable to specify, the model loses predictive power.
      *   *Goal:* Provide a nuanced analysis that acknowledges the strength of the "constrained optimization" view while highlighting where it breaks down or becomes vacuous.

  3.  **Brainstorming Defeaters (Categorization):**

      *   **Empirical:**
          *   Preference reversals (intransitivity). EU requires transitivity. Can costs explain intransitivity? Maybe, if costs change between choices, but that looks like gerrymandering.
          *   Systematic biases (framing effects). If the *same* problem framed differently yields different choices, the "objective" cost function is hard to define without referencing the frame itself as a cost.
          *   Aspiration level adaptation. User mentioned this. If aspiration levels shift in ways that *reduce* expected utility (e.g., getting stuck in a local maximum due to high aspirations), is that still maximization?
          *   Neural evidence. Do brains look like they compute gradients/costs, or do they look like lookup tables/pattern matchers?

      *   **Formal:**
          *   Computational irreducibility. If calculating the "optimal cost of calculation" requires more calculation than the original problem, the model is formally coherent but practically useless.
          *   Good's Theorem (value of information). It assumes you can estimate the value of information. If you can't, the "optimal stopping" rule is undefined.
          *   No Free Lunch theorems. Heuristics work *because* they ignore information. Maximizers (even constrained) try to use information optimally. There might be a formal divergence in high-noise/low-data regimes.

      *   **Conceptual:**
          *   Tautology/Unfalsifiability. This is the big one. If I observe behavior $B$, and I posit cost function $C$ such that $B = \arg\max EU - C$, I haven't explained anything.
          *   Procedural vs. Substantive Rationality. Simon's distinction. Maximization is about outcomes; satisficing is about process. If the process doesn't look like optimization (even constrained), the label is misleading.
          *   The "Ought" vs. "Is". Maximization is often normative. Satisficing is descriptive. Collapsing them confuses the two.

  4.  **Developing the Arguments (Drafting the Content):**

      *   *The Tautology Trap:* This is the strongest conceptual defeater. If the cost function is allowed to be *any* function, the theory explains nothing. To be scientific, the cost function must be independently measurable (e.g., reaction time, metabolic cost, neural firing). If it's just inferred from choices, it's circular.
      *   *The Regress Problem:* To maximize utility net of deliberation costs, you need to deliberate on the deliberation costs. This leads to an infinite regress (Good's Theorem limitation). Satisficing cuts the regress; constrained maximization pushes it back one step but doesn't solve it.
      *   *Empirical Mismatches:* Framing effects and preference reversals. If I choose A over B, B over C, but C over A, no static utility function (even with costs) explains this without assuming the costs change arbitrarily between choices.
      *   *The "Less is More" Effect:* Gigerenzer's claim. Sometimes ignoring information yields better predictions than using all information (overfitting). A constrained maximizer *should* account for overfitting risks in their cost function. So, a sophisticated constrained maximizer *would* ignore information. This suggests the two might converge *if* the cost function includes "variance penalty." But if the heuristic is *structurally* different (e.g., lexicographic vs. weighted sum), can a utility function replicate it? Yes, with lexicographic preferences (infinite weights). But that breaks continuity assumptions in standard EU.

  5.  **Ranking the Defeaters:**
      1.  **Unfalsifiability/Tautology (Conceptual):** Fatal if not constrained. Makes the theory scientifically empty.
      2.  **Infinite Regress (Formal):** Fatal to the *mechanism*. You can't actually compute the optimal amount of computation without already solving the problem.
      3.  **Intransitivity/Framing (Empirical):** Strong evidence against standard EU structures, requires ad-hoc cost adjustments.
      4.  **Process Mismatch (Neural/Cognitive):** Annoying. Even if behavior matches, the mechanism might not be optimization.

  6.  **Addressing the "Settling Things" Question:**
      *   What would satisfy the Satisficing camp? Independent measurement of costs. If you can predict the heuristic use based on metabolic/time costs *without* fitting to the choice data.
      *   What would satisfy the Maximizer camp? Showing that the heuristic converges to the constrained optimum asymptotically.
      *   Is it terminological? Partially. But "optimization" implies a specific search direction (gradient ascent). Heuristics often imply hill-climbing with random restarts or simple rules of thumb that don't follow a gradient.

  7.  **Refining the "Change My Mind" Section:**
      *   I need to be honest. My current leaning is that the user is *technically* right (representation theorems exist) but *practically* wrong (the model is useless).
      *   What would flip me? If someone derived a specific cost function from neural data that perfectly predicted satisficing behavior *before* the choice was made. That would validate the "hidden maximizer" hypothesis.

  8.  **Structuring the Response:**
      *   **Introduction:** Validate the user's intuition (it's a standard "Rational Analysis" stance) but flag the tautology risk immediately.
      *   **Section 1: The Conceptual Fatal Flaw (Unfalsifiability).** Explain why "any behavior = maximization" kills the theory.
      *   **Section 2: The Formal Fatal Flaw (Infinite Regress).** The cost of calculating costs.
      *   **Section 3: Empirical Defeaters.** Preference reversals, framing, and the specific nature of aspiration adaptation.
      *   **Section 4: The "Less is More" Nuance.** Explain how constrained maximization *can* explain this, but only by becoming indistinguishable from the heuristic.
      *   **Section 5: Ranking & Satisficing Camp Concessions.**
      *   **Section 6: What Would Change My Mind.**
      *   **Conclusion:** It's not just semantics; it's about predictive power and mechanism.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* I need to be careful not to say EU *requires* transitivity if we allow dynamic preferences. But standard EU does. I should focus on the *independence axiom* violations too.
      *   *Refinement:* Make sure to distinguish between "optimization under constraints" (Stigler/Becker) and "bounded rationality" (Simon). The user conflates them slightly. Simon explicitly rejected the idea that bounded rationality is just optimization under constraints because of the regress problem. I need to highlight Simon's specific objection.
      *   *Tone:* Keep it rigorous, LW-adjacent style (analytic, precise, willing to grant steelmen).

  10. **Final Polish:** Check against the prompt's specific questions (Empirically, Formally, Conceptually, Settling things, Ranking, Change Mind). Ensure all are answered. (Self-check: Did I address the aspiration level shifting? Yes, under empirical.)

  *(Self-Correction on "Fatal" vs "Annoying"):* The tautology argument is fatal to the *scientific utility* of the claim, but not to its *logical truth*. I need to make that distinction clear. The claim "humans are maximizers" might be true but useless. The claim "humans are satisficers" is useful but maybe not fundamental. The user's claim is that the former *subsumes* the latter. The counter is that subsumption without constraint is vacuous.

  Let's write.
answer: |-
  This is a sophisticated take that aligns closely with the "Rational Analysis" tradition in cognitive science (e.g., Anderson, Chater, Oaksford) and the economic defense of rationality (Stigler, Becker). You are arguing for **optimization under constraints** as the universal substrate, treating satisficing as a derived phenomenon rather than a fundamental alternative.

  Your position is logically robust but scientifically vulnerable. The core tension is between **ontological truth** (could this behavior be generated by a maximizer?) and **explanatory power** (does modeling it that way tell us anything?).

  Here is the stress test you requested, ranked from fatal to merely annoying, followed by the conditions under which I would update my own view.

  ---

  ### 1. The Conceptual Fatal Flaw: Unfalsifiability (The "Revealed Preference" Trap)
  **Rank:** Fatal to scientific utility.
  **Satisficing Camp Verdict:** They concede this is the strongest argument against you, but argue it renders your position vacuous.

  If any observed behavior $B$ can be modeled as $\arg\max (EU - \text{Cost})$, then the claim "agents maximize" is not a hypothesis; it is a tautology.
  *   **The Problem:** To avoid tautology, the cost function must be **independently measurable**. You cannot infer the cost function *from* the choice data and then use it to *explain* the choice data.
  *   **The Defeater:** If you explain a satisficing rule (e.g., "stop searching after 3 options") by positing a deliberation cost, you must measure that deliberation cost *without* referencing the stopping point. (e.g., via reaction time, metabolic expenditure, or neural firing rates).
  *   **Why it hurts you:** In 90% of economic/cognitive modeling, the "cost of computation" is a fudge factor fitted to the residual error of the EU model. If you allow the cost function to be arbitrarily complex (e.g., "the cost is high exactly when the agent deviates from EU"), you have not explained the behavior; you have merely renamed it.
  *   **Simon's Original Objection:** Herbert Simon explicitly rejected the "optimization under constraints" reductionism because it leads to an infinite regress (see below). He argued that if the model requires a cost function more complex than the behavior it explains, it fails the test of bounded rationality.

  ### 2. The Formal Fatal Flaw: The Infinite Regress of Meta-Optimization
  **Rank:** Fatal to mechanism.
  **Satisficing Camp Verdict:** This is their core theoretical wedge. They view this as a knock-down argument.

  To maximize utility net of deliberation costs, the agent must decide **how much** to deliberate.
  *   **The Regress:** To decide the optimal amount of deliberation, the agent must deliberate on the value of deliberation. This requires a "meta-deliberation" cost. To optimize *that*, you need "meta-meta-deliberation."
  *   **The Defeater:** Unless there is a hard stop (a satisficing threshold), the regress never terminates. A true maximizer cannot solve the "optimal stopping for computation" problem without already possessing the solution to the computation itself.
  *   **Why it hurts you:** Satisficing rules (e.g., "search until cost > $X" or "stop when aspiration met") are specifically designed to **cut the regress**. Modeling them as "optimal" implies the agent solved the unsolvable regress problem. You can assert they *approximate* the solution, but then you admit they aren't actually maximizing; they are using a heuristic to avoid the regress.
  *   **Formal Result:** I.J. Good's theorem on the value of information assumes the agent can estimate the expected value of new information. In complex environments, estimating $E[V(\text{info})]$ is often strictly harder than the original decision problem.

  ### 3. Empirical Defeater: Intransitivity and Framing Effects
  **Rank:** Severe (requires gerrymandering).
  **Satisficing Camp Verdict:** Strong evidence that the utility function itself is ill-defined, not just costly.

  *   **Preference Reversals:** Humans frequently display intransitive preferences (A > B, B > C, C > A). Standard EU (even with costs) requires transitivity.
      *   *Your Defense:* You could argue the "cost" of comparing A vs B differs from B vs C due to framing, making the net utility transitive.
      *   *The Defeater:* This requires the cost function to be hypersensitive to irrelevant contextual framing (e.g., wording, order of presentation). If the cost function fluctuates wildly based on normatively irrelevant features, it ceases to be a "cost of computation" and becomes a "cost of being influenced by bias." At that point, you are redefining "maximization" to include "systematic error," which strips the term of its normative force.
  *   **Aspiration Adaptation:** You mentioned aspiration levels shifting based on search experience.
      *   *The Defeater:** In satisficing models, aspiration levels adjust to maintain a feasible search space. In a maximization model, aspiration levels should track the *true* expected maximum. Empirically, humans lower aspirations when search is hard, even if the underlying distribution hasn't changed. A maximizer would *increase* search effort when the environment is hard (to find the rare high-value item), whereas a satisficer *lowers* standards. These are divergent predictions. If the maximizer lowers standards, they are no longer maximizing expected value; they are maximizing "comfort," which is a different utility function entirely.

  ### 4. The "Less-is-More" Effect (Ecological Rationality)
  **Rank:** Annoying / Convergent.
  **Satisficing Camp Verdict:** They concede a sophisticated maximizer *could* predict this, but argue the heuristic explanation is more parsimonious.

  *   **The Finding:** In high-noise, low-sample environments, heuristics like "Take-the-Best" (lexicographic search) often outperform multiple regression (which uses all available information).
  *   **Your Defense:** A constrained maximizer would include a "variance penalty" or "overfitting cost" in their utility function, leading them to ignore information. Thus, the maximizer predicts the heuristic behavior.
  *   **The Defeater:** This is technically true, but only if the maximizer's cost function includes specific terms for **bias-variance tradeoffs**.
      *   *The Catch:* Standard EU maximization does not naturally penalize variance in weights; it penalizes outcome variance. To get the heuristic behavior, you must engineer the cost function to specifically mimic the heuristic's structural ignorance.
      *   *The Concession:* If the "constrained maximizer" model must be engineered to ignore information in exactly the same way as the heuristic to achieve the same performance, the "maximization" label is doing no work. The *mechanism* is the heuristic; the *justification* is the optimization. The satisficing camp argues we should model the mechanism, not the justification.

  ---

  ### Ranking the Defeaters

  1.  **Unfalsifiability (Conceptual):** **Fatal.** If you cannot measure costs independently of choices, your theory is a description, not an explanation. It renders "maximization" compatible with literally any behavior, making it scientifically empty.
  2.  **Infinite Regress (Formal):** **Fatal.** It demonstrates that "optimal deliberation" is formally undefined in general cases. Satisficing is not a subset of maximization; it is a workaround for the impossibility of maximization.
  3.  **Intransitivity/Framing (Empirical):** **Severe.** Requires the cost function to be so context-dependent that it loses generalizability.
  4.  **Less-is-More (Empirical):** **Weak/Convergent.** A sufficiently sophisticated constrained maximizer *can* model this, but only by absorbing the heuristic's logic into the cost function.

  ---

  ### What Would Settle the Dispute?

  **For the Satisficing Camp:**
  They would accept the "constrained maximization" view **if and only if** the costs (time, energy, neural activation) can be measured *independently* of the choice behavior and shown to predict the switch from "maximizing mode" to "satisficing mode."
  *   *Example:* If fMRI data shows a specific metabolic threshold being hit exactly when a subject stops searching, and that threshold correlates with the "cost" parameter in your EU model *without fitting*, you win.

  **For the Constrained Maximization Camp (You):**
  You would have to concede if it is shown that the computational complexity of calculating the "optimal cost function" exceeds the computational complexity of the heuristic itself in a way that makes the maximizer model **computationally irreducible**.
  *   *Example:* If simulating the "optimal deliberation policy" requires more FLOPs than the universe contains, then claiming the agent is "really" doing that is physically meaningless.

  **The "Terminological" Verdict:**
  It is **not** purely terminological.
  *   **Maximization** implies a specific search dynamic (gradient ascent, comparing all options against a common scale).
  *   **Satisficing** implies a different dynamic (threshold crossing, lexicographic ordering, non-compensatory).
  *   Collapsing them obscures the **process**. If I use a lookup table, I am not maximizing, even if the lookup table outputs the EU-optimal choice. The *mechanism* matters for prediction in novel environments. If the environment changes, the maximizer recalculates; the satisficer triggers a different rule. Predicting *which* rule triggers is harder if you assume they are all just "maximizing."

  ---

  ### What Would Change My Mind?

  I currently lean toward your position being **mathematically true but scientifically unhelpful**. Here is what would flip me to believe your position is the *better* framework:

  1.  **Neural Evidence of Gradient Computation:** If neuroscience demonstrated that the brain explicitly computes error gradients or shadow prices for attention in a way that aligns with Lagrangian optimization *during* simple heuristic tasks. (Current evidence suggests pattern matching and associative retrieval, not optimization).
  2.  **Unified Cost Metric:** If someone derived a single, biologically plausible cost metric (e.g., "free energy" or "predictive coding error") that successfully predicts *both* complex planning and simple heuristics without parameter fitting. (Friston's Free Energy Principle attempts this, but remains controversial).
  3.  **Predictive Superiority:** If a constrained-EU model consistently outperformed heuristic models in **out-of-sample prediction** of human behavior in novel environments. (Currently, heuristic models often win on parsimony and out-of-sample robustness).

  ### Where My Reasoning Might Fail

  I may be underestimating the power of **inverse reinforcement learning (IRL)**. If we treat the human as a black box and use IRL to infer the reward function + cost function that best explains their behavior, we might find that the "inferred cost function" is surprisingly simple and consistent across domains. If IRL reveals a stable, low-dimensional cost function that explains satisficing behavior as optimal, your position gains massive empirical ground.

  However, if the IRL-inferred cost function is high-dimensional and idiosyncratic to every specific task, it confirms the "unfalsifiable" critique.

  ### Summary

  Your position is the **Normative Ideal**: "If humans were perfectly rational about their imperfections, they would look like this."
  The Satisficing position is the **Descriptive Reality**: "Humans use tools that bypass the need for that calculation."

  The error is claiming the Descriptive Reality *is* the Normative Ideal. It's like saying "A rock falling to the ground is minimizing its potential energy." True, but the rock isn't *calculating* the minimum. If you claim the rock is a "constrained optimizer," you are attributing agency where there is none. If humans use heuristics because they *cannot* compute the costs of optimization, they are not "optimizers with high costs"; they are "satisficers by necessity." The distinction matters when you try to intervene. To change a maximizer, you change the incentives. To change a satisficer, you change the cues or the aspiration levels.
