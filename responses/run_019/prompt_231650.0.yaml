answer: |-
  Here is a ranking of the four arguments based on their validity as justifications for a **pure rate of time preference (PRTP)**—denoted as $\delta$ in the Ramsey Rule. 

  To be clear: The PRTP is the rate at which we discount future welfare *solely* because it occurs in the future, holding constant both the probability of existence and the marginal utility of consumption. It is the "impatience" parameter of the social welfare function, distinct from the market interest rate.

  Here is the ranking from strongest to weakest justification for a positive $\delta$.

  ### 1. Nearness (Partiality)
  **Score: 3/10**

  This is the only argument on the list that is actually a *normative* claim about time itself. It suggests that temporal proximity creates a moral obligation, analogous to spatial or genetic proximity.

  *   **Why it scores low:** While this is conceptually a "pure" time preference argument, it fails the test of impartiality required by most modern ethical frameworks (utilitarianism, Rawlsian justice). To discount a future person's welfare simply because they are born in 2100 rather than 2024 is ethically indistinguishable from discounting a person's welfare because they live in a different country or belong to a different race. It treats "date of birth" as a morally relevant characteristic, which philosophers like Derek Parfit have argued is indefensible discrimination.
  *   **What it justifies instead:** It justifies a **partialist ethical framework**. If you accept this, you are arguing for a society that privileges the present generation over future generations as a matter of principle, not because of risk or wealth.

  ### 2. Plain Impatience (Psychological Preference)
  **Score: 2/10**

  This argument relies on revealed preference: individuals demonstrably choose sooner rewards over later ones, so the social discount rate should reflect this aggregate psychology.

  *   **Why it scores low:** This commits the **is-ought fallacy**. Just because individuals *are* myopic does not mean the government *ought* to encode that myopia into long-term social policy. Individual time preference often reflects cognitive bias, lack of self-control, or short lifespans. None of these are valid reasons for a sovereign state to value the lives of future citizens less than current ones. Using this to set $\delta$ conflates descriptive psychology with normative welfare economics.
  *   **What it justifies instead:** It justifies a **descriptive discount rate** for private project evaluation or short-term market analysis. It explains *why* markets discount, but not why society *should*.

  ### 3. Extinction Risk (Probability)
  **Score: 0/10**

  This argument states that because there is a non-zero probability of catastrophic extinction (asteroid, nuclear war), future utility is uncertain.

  *   **Why it scores low:** This is a category error. Risk is handled by **probability weighting**, not pure time preference. If there is a 1% annual risk of extinction, we discount *expected* utility by 1%. However, if the catastrophe does *not* occur, the utility of the survivors counts fully. A pure rate of time preference discounts the future even if we know with certainty it will exist.
  *   **What it justifies instead:** It justifies a **risk-adjusted discount rate**. This belongs in the calculation of expected value, not in the $\delta$ parameter of the social welfare function.

  ### 4. Growth (Diminishing Marginal Utility)
  **Score: 0/10**

  This argument suggests future generations will be richer, so an additional dollar of consumption provides them less utility than it provides us.

  *   **Why it scores low:** This is the most common confusion in discounting, but it is mathematically distinct from pure time preference. In the Ramsey Rule ($r = \delta + \eta g$), this argument accounts for the $\eta g$ term (elasticity of marginal utility $\times$ growth rate). It discounts future *consumption*, not future *utility*. If we hold consumption constant across generations, this argument vanishes. Pure time preference asks: "If utility is equal, does time matter?" Growth answers a different question: "If consumption is unequal, does money matter?"
  *   **What it justifies instead:** It justifies **discounting based on diminishing marginal utility**. It is a reason to transfer resources to the poor (whoever they are), but not a reason to value their welfare less simply because they live later.

  ***

  ### Conclusion: Do any survive?

  **No.** None of the four arguments survive, on their own, as a justification for a positive *pure* rate of time preference in a normative social welfare function.

  *   **Growth** and **Extinction Risk** are mathematically distinct components of the *effective* discount rate; they are not pure time preference at all.
  *   **Impatience** is a behavioral observation, not an ethical justification.
  *   **Nearness** is an ethical justification, but one that violates the principle of intergenerational impartiality.

  Frank Ramsey famously described a positive pure time preference as "ethically indefensible and [arising] merely from the weakness of the imagination." When teaching this, press your students to see that while we may have a positive *market* discount rate for practical reasons, the *pure* social rate of time preference ($\delta$) should be set to **zero** when evaluating policies that affect the long-term future. To do otherwise is to assert that the well-being of our grandchildren is intrinsically worth less than our own.
