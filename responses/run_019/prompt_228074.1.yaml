answer: |-
  **Final Exam Question: Epistemology Seminar**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question:**

  Consider the following case:

  > A hospital's night pharmacist reads a label and concludes that a vial contains the correct drug; on her evidence she is as well-positioned as pharmacists normally are when we count them as knowing. Her own situation is low-stakes for her — she will go home on time either way — but the patient who will receive the drug will die if she is wrong.
  >
  > **Variant 1:** A colleague watching her asks whether the pharmacist knows the vial is correct.
  > **Variant 2:** The pharmacist herself does not know what is at stake: she has been told only that the vial is for 'a routine administration', and in fact it is for the critical patient.
  > **Variant 3:** The next morning, having learned the patient survived, she says she never really knew, and the patient's furious family says she did know and is culpable.

  Write an essay addressing the following:
  1.  Precisely distinguish **Attributor Contextualism (AC)** and **Pragmatic Encroachment (PE)** regarding whose situation determines the truth of knowledge claims.
  2.  Analyze what each theory predicts in all three variants.
  3.  Identify whether any variant cleanly discriminates between the two theories.
  4.  Explain which variant is hardest for each theory to accommodate.

  ***

  **Model Answer:**

  Attributor Contextualism (AC) and Pragmatic Encroachment (PE) both explain why knowledge ascriptions vary across situations, but they locate the variation differently. AC holds that the semantic content of 'knows' shifts with the **attributor's** conversational context; knowledge itself is invariant, but the standard for truthfully applying the word changes. PE holds that the word 'knows' is invariant, but **knowledge itself** shifts depending on the **subject's** practical stakes. This distinction regarding whose situation matters—attributor versus subject—drives divergent predictions in the pharmacist case.

  In Variant 1, a colleague asks if the pharmacist knows. AC predicts the truth-value depends on the colleague's context. If the colleague is casual, standards are low, and 'She knows' is true. If the colleague is worried about the patient, standards rise, and 'She knows' is false. PE predicts the truth-value depends on the pharmacist's stakes. Since her personal stakes are low (going home on time), PE suggests she knows, regardless of the patient's risk, unless the theory ties stakes to the objective outcome rather than the subject's practical reasoning. Here, AC allows variability based on the speaker; PE fixes the knowledge state based on the pharmacist.

  Variant 2 is the critical discriminator. The pharmacist is ignorant of the high stakes. AC maintains that if the attributor (e.g., us evaluating the case) knows the stakes, the standard is high, so 'she knows' is false. The attributor's awareness drives the truth conditions. PE faces a dilemma. If knowledge depends on objective stakes, she lacks knowledge despite having no reason to investigate further, severing the link between knowledge and rational action (she cannot act on unknown stakes). If knowledge depends on subjective stakes, she knows, implying it is rational to act on evidence that could kill a patient. This pressures PE proponents to admit either that knowledge is opaque to the subject or that fatal errors can be knowledgeable.

  Variant 3 involves retrospective assessment. The pharmacist says she 'never knew'; the family says she 'did know'. AC explains this easily: the pharmacist is now in a high-standards context (guilt/liability), while the family might be in a different context. The truth-conditions shifted, so both can speak truly relative to their current contexts. PE struggles here. The pharmacist's past stakes did not change retroactively. If she knew then, she knows now. PE must claim one party is mistaken about the past fact of knowledge, whereas AC says both speak truly relative to their current contexts.

  Ultimately, Variant 2 cleanly discriminates the theories. AC consistently locates the shift in the attributor's context, handling ignorance smoothly. PE is forced into a counterintuitive corner regarding objective vs. subjective stakes. Variant 3 is hardest for PE, as it cannot accommodate shifting verdicts on past knowledge without an error theory. Variant 2 is hardest for PE regarding the rationality constraint. Thus, the case prevents papering over differences: AC shifts truth-conditions; PE shifts knowledge states, leading to conflicting verdicts when subject and attributor awareness diverge.

  ***

  **Marking Scheme:**

  **Total Marks: 20**

  **1. Core Distinction (4 Marks)**
  *   **Must-Hit:** Clearly state that AC ties truth-conditions to the *attributor's* context/standards, while PE ties knowledge itself to the *subject's* practical stakes.
  *   **Typical Mistake:** Conflating the two by saying both claim "stakes matter" without specifying *whose* stakes (speaker vs. subject).

  **2. Variant 1 Analysis (4 Marks)**
  *   **Must-Hit:** Explain that AC allows 'knows' to be true/false based on the colleague's mood/context, while PE fixes the verdict based on the pharmacist's low stakes (likely 'knows').
  *   **Typical Mistake:** Claiming PE changes its verdict based on the colleague's worry rather than the pharmacist's situation.

  **3. Variant 2 Analysis (4 Marks)**
  *   **Must-Hit:** Identify the tension for PE: if stakes are objective, knowledge is disconnected from rational action; if subjective, knowledge licenses dangerous action. AC relies on attributor awareness.
  *   **Typical Mistake:** Ignoring the pharmacist's ignorance and assuming PE automatically denies knowledge because the patient dies.

  **4. Variant 3 Analysis (4 Marks)**
  *   **Must-Hit:** Note that AC accommodates the disagreement via shifting contexts (both can be right), whereas PE requires one party to be wrong about a fixed past fact (error theory).
  *   **Typical Mistake:** Suggesting PE allows knowledge states to change retroactively based on new information.

  **5. Discrimination Evaluation (4 Marks)**
  *   **Must-Hit:** Conclude that Variant 2 is the cleanest discriminator because it separates subject-awareness from objective danger, pressuring PE's rationality constraint.
  *   **Typical Mistake:** Concluding that both theories make identical predictions in all cases and differ only in terminology.

  **Grading Distinction:**
  What separates an A answer from a B answer is the handling of Variant 2. A B answer will correctly state both views but treat them as making the same prediction everywhere, focusing mostly on Variant 1 or 3. An A answer will notice that the second variant pressures at least one of the two theories (specifically PE) into a result its proponents rarely advertise: either disconnecting knowledge from the subject's rational perspective or accepting that one can know despite objective fatal risks. The A answer identifies this theoretical cost as the decisive discriminant.
