  **Joint Statement on the Historiography of the French Revolution**

  We, representing the Social and Revisionist historiographical traditions, submit this statement to clarify our adversarial collaboration. Our goal is not synthesis, but precise mapping of convergence and divergence.

  **1. Points of Agreement**
  1.  **Economic Reality:** We accept the Revisionist correction to classic economic history. The nobility was not a monolithic feudal bloc blocking capitalism; many nobles invested in trade and industry. Conversely, the bourgeoisie was not a unified revolutionary class; many sought venal offices and land rents rather than free-market capitalism. The Revolution was not a simple transfer of power from one economic bloc to another.
  2.  **Event Sequence:** We agree on the factual chronology: state bankruptcy (1788), the constitutional struggle (1789), the radicalization via war (1792), the Terror (1793-94), and the Thermidorian reaction.
  3.  **Mutual Concessions:** The Social historian concedes that political ideology and contingency cannot be reduced to economic reflexes; ideas have autonomy. The Revisionist concedes that social stratification and popular unrest constrained political actors; politics does not occur in a vacuum. Social friction provided the combustible material for political sparks.

  **2. Remaining Disagreements**
  1.  **Teleology vs. Contingency:** The Social historian maintains that long-term social transformations (the rise of capitalist relations within the Old Regime) made a liberal-bourgeois outcome structurally inevitable once the state cracked. The Revisionist maintains that the liberal outcome was unintended, resulting from the collapse of state authority, the vacuum of power, and the specific logic of revolutionary discourse.
  2.  **Class Consciousness:** The Social historian argues "bourgeoisie" denotes a group developing shared political agency based on objective economic status, even if subjective consciousness lagged. The Revisionist argues "bourgeoisie" is a heterogeneous retrospective category lacking coherent contemporary consciousness or a unified political project prior to 1789.
  3.  **The Nature of Causation:** We explicitly acknowledge a semantic divergence. For the Social historian, "cause" refers to deep structural preconditions necessary for revolution (the *why now*). For the Revisionist, "cause" refers to immediate triggers and human agency (the *how*). Substantively, we disagree on whether structural preconditions determine outcomes or merely create the possibility for them. This is not merely verbal; it concerns whether history follows discernible laws or depends on agency.

  **3. Cruxes and Evidence**
  1.  **The Terror's Function:** Was the Terror a mechanism to defend emerging bourgeois property rights against *sans-culotte* demands and stabilize the market (Social), or was it a product of Rousseauist virtue signaling, paranoid discourse, and wartime emergency unmoored from specific class interests (Revisionist)?
  2.  **The Origin of Radicalism:** Did radicalism emerge from the material needs of the poor and bourgeois allies (Social), or from the internal logic of representation and sovereignty claims (Revisionist)?
  3.  **Agreed Evidence:** Prosopographical analysis of the National Convention, specifically correlating deputies' personal economic portfolios with their voting records on the *Maximum* (price controls) and property rights during 1793-94. Additionally, private correspondence regarding economic policy motivations.
  4.  **Settling Conditions:** If voting patterns show deputies consistently protected personal/class economic interests despite ideological pressure, the Social interpretation gains ground. If voting patterns show deputies acted against personal economic interest in favor of ideological consistency, public opinion, or state necessity, the Revisionist interpretation prevails. We agree this data would force one side to concede significant explanatory ground.
