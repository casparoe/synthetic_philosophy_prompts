answer: |-
  **My Number: 25%**

  I land closer to your skepticism than your friend's alarm, but I nudge it up from your 15% because the speed of the underlying capability (a) is outpacing the speed of social immunity (d).

  Here is the decomposition, the math, and where the real bet lies.

  ### The Decomposition

  **(a) Tech Sufficiency: 95%**
  *Definition:* By 2040, AI agents can pass as human in text, voice, and video in real-time, with memory and emotional consistency sufficient to sustain a relationship or a professional negotiation.
  *Reasoning:* Sixteen years is an eternity in AI. We are already at "parrot with a thesaurus" moving toward "simulated theory of mind." The hard problem isn't intelligence; it's latency and memory. Both are engineering problems, not physics problems. By 2040, a "fake priest" or "fake lover" will be indistinguishable from a human in a digital channel without specialized forensic tools.
  *Confidence:* High.

  **(b) Malicious Deployment: 90%**
  *Definition:* Bad actors (grifters, states, corporations) deploy these agents at scale in trust-carrying contexts (care, law, finance, intimacy).
  *Reasoning:* The economic ROI is astronomical. A customer service agent that never sleeps costs pennies. A whistleblower bot that can't be doxxed is a powerful political tool. The incentive to *use* the tech is stronger than the incentive to restrain it.
  *Confidence:* High.

  **(c) Social Rot vs. Adaptation: 40%**
  *Definition:* The mere presence of fakes degrades the *background assumption* of humanity enough to break institutional function (courts, markets), rather than society simply adapting with new norms.
  *Reasoning:* This is the crux of Dennett's worry. Does uncertainty destroy trust, or does it just shift it? Humans are surprisingly antifragile. We adapted to caller ID spoofing (we ignore unknown numbers). We adapted to email spam (we use filters). The question is whether "humanity" is a binary switch we can verify, or a fuzzy vibe we can't. If we can't verify, cynicism wins. If we can verify, trust bifurcates (Verified vs. Unverified). I bet on bifurcation, not total rot.
  *Confidence:* Moderate.

  **(d) Mitigation Failure: 70%**
  *Definition:* Regulatory, technical, or social solutions (watermarking, digital ID, reputation layers) fail to prevent the degradation in (c).
  *Reasoning:* Mitigation requires coordination; deployment only requires one actor. Privacy advocates will fight "Proof of Personhood." Governments will move slower than model training cycles. Watermarking is fragile. However, I'm not at 90% because niche "human-only" zones will likely emerge for high-stakes interactions (courts, banking), saving the institutions even if the public square rots.
  *Confidence:* Moderate-Low.

  ### The Combination Logic

  I am treating this as a conditional chain, but with correlation.
  $P(\text{Crisis}) \approx P(a) \times P(b|a) \times P(c|b) \times P(d|c)$

  $0.95 \times 0.90 \times 0.40 \times 0.70 \approx 0.24$ (24%)

  I round to **25%**.

  The logic is: The tech and the deployment are basically givens. The future hinges entirely on whether society *panics and collapses* (Rot) or *builds walls and adapts* (Bifurcation). My 25% represents the chance that we fail to build the walls in time to save the "ordinary person-to-person" layer of trust that institutions rely on.

  ### Sensitivity and Uncertainty

  **Most Sensitive Term: (c) Social Rot vs. Adaptation.**
  This is the lever. If humans prove willing to accept a "Verified Human" badge as a new social norm (like a blue checkmark, but for biology), the probability of civilization-scale rot drops to near zero. Trust doesn't vanish; it just becomes authenticated. If, however, verification is seen as oppressive or technically impossible, the probability of rot skyrockets to 60%+. Your friend is betting that verification will fail or be rejected; you are betting that trust is more resilient than that.

  **Least Confident Term: (d) Mitigation Failure.**
  I am least sure about the political will for digital identity. If a major democracy passes a "Digital Personhood Act" requiring cryptographic signing for legal contracts by 2028, mitigation succeeds. If privacy culture blocks this, mitigation fails. This is a cultural battle, not a technical one, and it's highly unpredictable.

  ### Where You and Your Friend Actually Disagree

  You aren't disagreeing about the AI. You both implicitly accept (a) and (b) are likely.

  **You disagree about the nature of Trust.**
  *   **Your Friend (65%):** Views trust as **fragile glass**. Once the assumption of "person behind the performance" is cracked, it cannot hold weight. They believe the *uncertainty* itself is the poison. If I have to wonder if my lover is real, the love is already degraded.
  *   **You (15%):** View trust as **muscle**. You believe trust is generated through friction and verification. If fakes appear, we will develop calluses (verification tools, new norms). You believe the *outcome* of the interaction matters more than the *ontology* of the actor. If the priest gives good advice, does it matter if he's code? (Your novel premise suggests it might, but your probability estimate suggests society will survive it).

  The disagreement is philosophical: Is humanity a *substrate* (meat) or a *function* (behavior)? Your friend thinks substrate matters for trust; you think function might be enough.

  ### The Key Evidence (Next 5 Years)

  **The Metric:** *The "Liars' Dividend" Precedent.*

  Watch for the first major legal or financial case where a real human successfully uses "It could have been an AI" as a plausible defense against fraud or breach of contract, *without* needing to prove it actually was AI.

  *   **Direction that moves my number UP (toward Friend's 65%):** If courts or markets begin rejecting digital evidence (video, audio, text logs) as insufficient proof of identity because "it could be synthetic," and no replacement standard is adopted. This signals the *collapse* of verification.
  *   **Direction that moves my number DOWN (toward your 15%):** If we see the rapid adoption ( >20% of major online platforms) of "Proof of Personhood" protocols (biometric/crypto-backed) that become a prerequisite for high-stakes interaction. This signals *adaptation*.

  **Specific Milestone to Watch:** By 2029, look at the US Federal Court system. If they mandate cryptographic authentication for all remote testimony, mitigation is winning. If they ban remote testimony entirely because they can't verify it, rot is winning.

  For your novel: The grifter's empire works best in the gap between those two outcomes. The window where the tech works, but the verification norms haven't hardened yet. That window is likely 2026–2035.
