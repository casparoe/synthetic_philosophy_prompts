answer: |-
  **Scenario:** You're in a group project. You research your section thoroughly but ignore group chats about meeting times, thinking, "Someone else will schedule us."

  **1. Maxim:** "I will fulfill my specific duties in joint tasks but never initiate coordination, relying on others to organize."

  **2. Contradiction-in-Conception (CIC):** This passes. Imagine a world where everyone does their work but no one schedules meetings. It's chaotic, but logically possible. The action (doing your research) doesn't become impossible just because no meetings occur. There is no logical contradiction in the *concept* of the action itself.

  **3. Contradiction-in-Willing (CIW):** This fails. As a student, you necessarily will the success of the project (your grade). Success requires coordination. If everyone adopts your maxim, coordination never happens, and the project fails. You cannot rationally will a universal law that guarantees the frustration of your own necessary ends.

  **4. Key Feature:** The distinction between *action possibility* and *end attainment*. CIC asks: "Can the action exist?" (Yes, you can still research). CIW asks: "Can I will the outcome?" (No, the project dies). If you remove the goal of project success, the contradiction vanishes; the failure arises because you will an end while universalizing a means that destroys it.

  **5. Kantian Response:** If you insist you can will this, Kant would say you are making yourself a "free rider." You treat your peers as mere means to your grade, exempting yourself from the necessary conditions of shared agency. Rationality requires consistency: if you will the end (success), you must will the necessary means (cooperation), not just hope others provide them.
