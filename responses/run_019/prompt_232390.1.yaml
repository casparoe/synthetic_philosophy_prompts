      *   *Counter:* A hyperprior still assigns a number. Keynes says sometimes no number is rational.
      *   *Drafting:* "Your hyperprior still forces a number where none belongs. You're modeling ignorance as a distribution, but that presupposes you know the space of possibilities. Keynes isn't talking about not knowing which die roll will come up; he's talking about not knowing if the die is loaded, or if there's even a die at all. When you assign a prior over parameters, you're assuming the parameters exist and are definable. In genuine uncertainty—like a wartime economy or a technological breakthrough—the relevant evidence simply doesn't exist to form a logical relation. You can't distribute probability over a state space you can't enumerate. That's not a calculation problem; it's an ontological one. Your model assumes a closed system; Keynes is warning you that the world is open."

