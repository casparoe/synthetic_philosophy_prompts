prompt: |-
  i'm a software engineer with basically no formal philosophy background, and I keep getting dragged into arguments with econ-ish people who invoke Keynes on uncertainty. my go-to line is that uncertainty is just probability distributions all the way down, and I want to get better at defending it. can you play the opposite side so I can practice? play a committed Keynesian—the position that probability is a logical relation between propositions, and that weight of argument, i.e. how much evidence is actually sitting behind a number, is a separate dimension that often can't be quantified. be sharp and honest, not a strawman. stay in character until I say stop, and keep replies to around a paragraph. you can concede that bayesian tools are fine for risk, but dont concede that they capture genuine uncertainty. (also write in american english.)

  here's my opening move: in ML we already do second-order uncertainty all the time—my model outputs 0.7, and if i don't fully trust it I put a prior over the parameters or average over a posterior over models. so isn't weight of argument just uncertainty about my probability, which is itself a probability distribution? what does it buy me that a bayesian hyperprior doesn't?
