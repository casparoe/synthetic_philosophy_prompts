answer: |-
  Here is a complete facilitator's kit for **"The Amnesiac Courier,"** a 90-minute simulation of the Absent-Minded Driver (AMD) problem designed for your reading group.

  ## 1. Overview & Learning Goals
  *   **The Intuition:** Participants will feel the tension between the *planning self* (who wants to maximize total trip value) and the *acting self* (who faces identical choices without knowing where they are).
  *   **The Constraint:** They must adopt a single **Standing Order** (a probability rule) that applies to *every* intersection they encounter, because they cannot distinguish them.
  *   **The Payoff:** Exit 1 = 0 pts, Exit 2 = 4 pts, Pass Both = 1 pt.
  *   **The Optimal Strategy:** Exit with probability $p=1/3$ at every intersection (Expected Value $\approx 1.33$).
  *   **The Trap:** "Always Exit" yields 0 points (you exit at the first one). "Always Continue" yields 1 point. Pure intuition often leads to suboptimal mixing.

  ## 2. Materials (Low Tech)
  *   **Index Cards (300+):** You need three stacks.
      *   **Stack A (The Road):** 14 cards marked "INTERSECTION" on the front. Back is blank. (Must be identical).
      *   **Stack B (The Outcomes):** 14 cards marked "EXIT 1 (0 pts)", 14 cards marked "EXIT 2 (4 pts)", 14 cards marked "PASS (1 pt)".
      *   **Stack C (Decision Slips):** Small slips for Drivers to write "EXIT" or "CONTINUE".
  *   **Dice:** 7 six-sided dice (one per pair).
  *   **Screens/Barriers:** 7 folders or books to act as privacy screens between pairs.
  *   **Score Sheets:** 14 sheets (one per participant).
  *   **Prize:** Something small but desirable (a nice pen, a book, chocolate).

  ## 3. Roles & Setup (5 Minutes)
  *   **Group:** Split into 7 pairs.
  *   **Roles:** In each pair, one is the **Road** (Facilitator), one is the **Driver** (Player).
      *   *Note:* The "Road" knows the map. The "Driver" is "absent-minded" (constrained by rules).
  *   **Seating:** Pairs sit facing each other with a privacy screen (folder) between them. The Driver cannot see the Road's notes.

  ## 4. The Timeline (90 Minutes)

  ### Phase 1: The Precommitment (15 Minutes)
  1.  **Briefing:** Read the scenario aloud.
      *   *"You are driving home. There are two identical intersections. Exit 1 is a dead end (0 pts). Exit 2 is home (4 pts). If you pass both, you're lost but safe (1 pt). You cannot tell the intersections apart. You cannot remember if you've passed one already."*
  2.  **The Constraint:** Explain the **Standing Order Rule**.
      *   *"You cannot say 'I'll exit at the second one.' You don't know which is which. You must write down a rule that applies to **any** intersection card the Road shows you. For example: 'I will roll a die. On 1-2 I Exit, on 3-6 I Continue.'"*
  3.  **Task:** Drivers write their **Standing Order** on a Score Sheet. They must specify a probability (e.g., "Exit on Die 1").
      *   *Facilitator Note:* Encourage them to use the die to randomize. Deterministic strategies (Always Exit/Continue) are allowed but risky.
  4.  **Collect Plans:** Collect the Score Sheets. This locks in the *Ex-Ante* plan.

  ### Phase 2: The Drive (25 Minutes)
  1.  **Execution:** Run **3 Rounds**.
      *   **Step 1:** Road places an "INTERSECTION" card face up in front of the Driver.
      *   **Step 2:** Driver consults their Standing Order. They roll the die (if needed) and write "EXIT" or "CONTINUE" on a Decision Slip.
      *   **Step 3:** Driver hands the Slip to the Road (behind the screen).
      *   **Step 4 (Logic):**
          *   If Slip says **EXIT**: Road checks if this was the 1st or 2nd card placed. Road reveals the corresponding Outcome Card (Exit 1 or Exit 2). Round ends.
          *   If Slip says **CONTINUE**: Road places a *second* "INTERSECTION" card (identical to the first). Driver must decide again **using the same Standing Order**.
          *   If Slip says **CONTINUE** (again): Road reveals "PASS" Outcome Card. Round ends.
      *   **Step 5:** Road records the score. Driver does *not* see the Outcome Card yet (to prevent learning bias for the next round).
  2.  **Memory Wipe:** Between rounds, collect all Decision Slips. Shuffle the "INTERSECTION" cards. The Driver must not know if the next round will require 1 or 2 decisions until it happens.
  3.  **Score Reveal:** After 3 rounds, reveal the scores for those rounds only.

  ### Phase 3: The Crisis / Revision (20 Minutes)
  *This is the "Gut Punch" moment.*
  1.  **The Pause:** Stop the game. Do not let them change their Standing Order yet.
  2.  **The Thought Experiment:** Say the following:
      *   *"Imagine you are in Round 4. You have just chosen 'CONTINUE' at the first card. The Road places a second card in front of you. You are holding the die. You know your Standing Order says 'Exit on 1'. But right now, in this moment, you don't know if this is Intersection 1 or Intersection 2."*
      *   *"If this is Intersection 1, Exiting gives you 0. If this is Intersection 2, Exiting gives you 4. Continuing gives you 1."*
      *   *"Do you want to **revise** your decision for this specific moment? Do you stick to the plan, or do you Exit/Continue based on where you *think* you are?"*
  3.  **The Vote:** Have them write down "STICK" or "REVISE" on a fresh slip. If "REVISE," what is the new action?
  4.  **The Discussion:** Ask 2-3 people to share why they wanted to revise. (Expect: "I feel like I'm probably at the second one now," or "I don't want to risk the 0.").
  5.  **The Finish:** Run 2 final rounds. Allow them to change their Standing Order *globally* if they wish (based on the crisis), or stick to the original. Record final scores.

  ### Phase 4: Swap & Repeat (20 Minutes)
  1.  **Swap Roles:** Drivers become Roads, Roads become Drivers.
  2.  **Repeat:** Run Phases 1 & 2 only (skip the long Crisis discussion to save time).
  3.  **Final Tally:** Sum scores for all 5 rounds. Award the prize to the highest scorer.

  ### Phase 5: The Debrief (10 Minutes)
  *Map the experience to the formal problem.*

  1.  **The Planning Self (Ex-Ante):**
      *   Ask: "Who wrote a plan close to 'Exit on 1 or 2' (p=1/3)?"
      *   Explain: This maximizes the expected value of the *whole trip* ($EV \approx 1.33$).
      *   Explain: "Always Exit" ($p=1$) fails because you bail at the first intersection (EV = 0). "Always Continue" ($p=0$) is safe but mediocre (EV = 1).

  2.  **The Acting Self (Ex-Post):**
      *   Ask: "Who wanted to revise during the Crisis phase?"
      *   Explain: This is the **Time Inconsistency**. When you are *at* the intersection, your belief about "where you are" shifts.
      *   If you plan to Continue often, finding yourself at an intersection makes it more likely you are at the second one (because you survived the first). This tempts you to Exit.
      *   But if you Exit more often, the chance you are at the second one drops.
      *   The paradox is that your optimal plan requires you to ignore your immediate intuition about where you are.

  3.  **The Limitation (Honesty Check):**
      *   Tell them: "The game couldn't make you truly forget. You knew logically that the second card was Intersection 2. In the real philosophical problem, the driver *genuinely* cannot update their belief based on sequence. The game simulated the **Constraint** (same rule everywhere), but I had to supply the **Belief Tension** in the discussion."

  ## 5. Troubleshooting & Predictable Failures

  **Problem 1: "Smuggling" Information (The Road helps the Driver)**
  *   *Risk:* The Road taps the table differently for Int 1 vs Int 2, or hints with body language.
  *   *Fix:* Instruct Roads explicitly: "Your goal is not to help your partner win. Your goal is to be a perfect simulator. If you hint, the data is ruined. You will be disqualified from the prize if caught."
  *   *Mitigation:* Use identical cards for every intersection. No verbal cues allowed ("Here is a card" is all they can say).

  **Problem 2: The "Always Exit" Heuristic**
  *   *Risk:* Players think "Exit 2 is 4 points, Exit 1 is 0. I'll just try to Exit." They set $p=1$. They score 0 repeatedly.
  *   *Fix:* After Round 1, announce the *group average* score anonymously. If the average is 0, say: "The group is collectively scoring zero. Consider if your strategy forces you to exit too early." This nudges without giving the solution.

  **Problem 3: Counting Cards**
  *   *Risk:* Drivers realize "If I see a second card, it *must* be Intersection 2."
  *   *Fix:* This is unavoidable in a physical simulation. You must address this in the Debrief (see Limitation above). Frame it as: "In the game, you knew it was the second card. In the thought experiment, you must imagine you *don't* know that. The math holds even if you pretend you don't know."

  **Problem 4: Boredom/Speed**
  *   *Risk:* Rounds go too fast; people chat.
  *   *Fix:* Enforce a "Silent Car" rule. No talking between Driver and Road during a round. If they talk, the round is void (0 points).

  ## 6. The "Gut Punch" Script (For Phase 3)
  *Use this verbatim to maximize the philosophical tension:*

  > "Stop. Put your dice down.
  >
  > In the first phase, you were the **Planner**. You were safe at home, looking at a map. You could see the whole road. You chose a rule that balanced the risk of Exit 1 against the reward of Exit 2.
  >
  > Now, I want you to be the **Driver**. You are in the seat. It's dark. A card appears. You don't know if it's the first or the second. Your Plan says 'Roll the die.'
  >
  > But ask yourself: Does the Plan make sense *right now*?
  >
  > If you are at the first intersection, Exiting is a disaster. If you are at the second, Exiting is a victory.
  >
  > Many of you will feel a urge to say: 'I've probably already passed the first one. I should Exit now.'
  >
  > But if you think that, you must also admit: If you plan to Exit now, you would have also Exit at the first one. And if you Exit at the first one, you never get to the second one.
  >
  > Your desire to Exit *now* undermines your ability to get *here*.
  >
  > Write down: Do you trust your Past Self's Plan? Or do you trust your Present Self's Intuition?"

  ## 7. What the Game Cannot Do (For the Debrief)
  Be honest about these two features. You must supply them verbally:

  1.  **Self-Locating Beliefs:** In the game, if they see a second card, they *know* it's Intersection 2. In the formal problem, the driver's belief that "I am at Intersection 2" is a function of their own strategy ($p$). The game cannot simulate the feedback loop where *changing your strategy changes your belief about where you are*.
  2.  **Intrapersonal Conflict:** The game is played in pairs. The paradox is internal. The "Road" is an external agent in the game, but in the problem, the "Road" is Time/Memory. Remind them that the conflict is between *You at 8:00 AM* and *You at 8:15 AM*.

