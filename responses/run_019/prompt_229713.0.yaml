      *   *Why this works:* It forces the *ex-post* evaluation.
      *   **Cheating Prevention:** Road must be trained. Cards must be identical. Drivers cannot talk during rounds.
      *   **Payoffs:** Exit 1 (0), Exit 2 (4), Pass (1).
      *   **Limitations:** The game simulates the *uncertainty*, but not the *self-locating belief update* perfectly because players know the structure. The debrief must explain that in the real paradox, your belief about "which intersection" depends on your strategy.

  5.  **Refining the "Revision" Moment:**
      *   To really hit the paradox, the revision needs to happen *when they think they are at an intersection*.
      *   *Idea:* In rounds 4 and 5, introduce a "Interruption." After they submit their plan, the GM taps them on the shoulder and hands them a card saying "INTERSECTION." They must make a snap decision *before* the round concludes.
      *   *Actually, keep it simpler.*
      *   Round 1-3: Execute Plan A.
      *   Intermission: "Imagine you are in the car. You see a sign. You don't know if it's #1 or #2. Your plan says 'Roll a die, exit on 1-2'. Do you actually want to do that *right now*, or do you want to Exit/Continue based on where you *think* you are?"
