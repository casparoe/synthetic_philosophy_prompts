              *   *Practicality:* In a 90-min session, you can't hypnotize 14 people.
              *   *Workaround:* **The "Simultaneous Choice" Proxy.**
              *   Tell players: "You are writing instructions for a robot driver who has amnesia. The robot will follow your instructions at *every* intersection it sees."
              *   *But the prompt wants them to feel the revision tension.* "Give them a chance to revise from inside the run."
              *   *Okay, here is the winning mechanic:* **The "Red/Blue Card" Shuffle.**
              *   Players play in pairs. One is the Road, one is the Driver. Then swap.
              *   Road has a deck: [Int 1] [Int 2] [End].
              *   Driver closes eyes. Road reveals "Intersection". Driver decides.
              *   *To prevent counting:* The Road shuffles a deck of "Intersection" cards that look identical.
              *   *Actually, the most robust way to simulate AMD without tech:* **The "One-Card Draw" per decision point, but the Driver doesn't know the count.**
              *   *Let's refine the "Memory Suppression":* Use a **screening barrier**. The Driver sits behind a screen. The GM (Road) passes notes.
              *   Note 1: "You are at an intersection. Exit or Continue?"
              *   If Continue: GM passes Note 2 (if Int 1) or "You arrived" (if Int 2).
              *   *The Leak:* If Note 2 looks different, they know.
              *   *Fix:* Note 1 and Note 2 must be identical slips of paper.
              *   *The Reveal:* Only at the end of the round do they learn where they exited.
              *   *The "Revision" Phase:* Halfway through the rounds, stop. Ask: "Knowing what you know now about your success rate, do you want to change your rule for the remaining rounds?"

  4.  **Drafting the Plan:**

      *   **Title:** The Amnesiac Courier.
      *   **Materials:** Index cards (3 colors), pens, opaque bags/envelopes, score sheets.
      *   **Roles:** 7 Pairs. One "Road" (GM), one "Driver". Swap halfway.
      *   **Timeline:**
          *   0-10: Intro & Setup.
          *   10-20: Phase 1 (Precommitment). Write the rule.
          *   20-50: Phase 2 (Execution). 5 Rounds. Memory suppression via identical cards.
          *   50-60: Phase 3 (The Crisis/Revision). Stop. Ask if they want to change the rule *for the current trip* (simulating time inconsistency).
          *   60-75: Phase 4 (Completion).
          *   75-90: Debrief.
      *   **The "Gut Punch" Mechanic:** In Phase 3, the Driver is handed an "Intersection" card *during* a run (simulated) or asked "If you were handed a card right now, would you change your mind?"
