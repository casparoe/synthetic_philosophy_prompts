  8.  **Debrief Structure:**
      *   Map the game elements to the formal problem.
      *   Highlight the conflict: Plan (Ex-Ante) vs. Action (Ex-Post).
      *   Explain the missing piece: Belief updating (why $p=1/3$ is optimal ex-ante, but why at the intersection you might feel like you should exit).

  9.  **Review against Constraints:**
      *   14 people? Yes, 7 pairs.
      *   90 mins? Yes, tight but doable.
      *   Low tech? Yes, cards/paper.
      *   Gut punch? Yes, via the revision moment.
      *   Troubleshooting? Included.

  10. **Self-Correction on "Memory Suppression":**
      *   Realistically, if I continue at Card 1, I *know* Card 2 is the second intersection. This breaks the "Absent-Minded" condition.
      *   *Fix:* The Driver does not play sequentially. The Driver writes a **Standing Order**. "At any intersection shown to me, I will Exit if Die=1."
      *   The Road then simulates the trip *using that order*.
      *   *But how to get the "Revision from inside the run" feel?*
      *   *Hybrid:*
          *   Rounds 1-3: Standing Order (Precommitment).
