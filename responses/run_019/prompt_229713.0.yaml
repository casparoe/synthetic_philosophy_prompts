      *   *This is the fundamental flaw of physical simulations of AMD.* You can't simulate "forgetting you just made a choice" easily.
      *   *Pivot:* Acknowledge this limitation in the design. The game simulates the **Strategy Constraint** (must use same rule at both nodes) rather than the **Psychological Amnesia**.
      *   *Revised Goal:* Make them feel the constraint that *the same rule applies everywhere*.
      *   *Mechanic:* "The Rule Sheet." You write ONE rule. It applies to every card you see. You cannot write "If first card, Continue; If second, Exit." You must write "Exit if Die > 4."
      *   *This captures the core mathematical constraint of AMD.*
      *   *The "Gut Punch":* When they realize that to get the 4 points, they have to risk the 1 point, and they can't just "save" the exit for the second one because they can't distinguish them.

      *   *Okay, let's finalize the "Revision" part.*
      *   After 3 rounds, tell them: "Imagine you are in the middle of a run. You just made a 'Continue' decision. You are handed another card. You don't know if this is the 2nd card (last chance for 4 pts) or the 1st card (risk 0 pts). Do you stick to your rule?"
      *   This forces the philosophical question without needing actual amnesia.

  11. **Final Polish:** Check tone. Needs to be facilitator-ready. Clear instructions. Honest about limitations.

      *(Self-Correction during drafting)*: Make sure the payoff structure is clear. 0, 4, 1.
      Make sure the $p=1/3$ calculation is mentioned in the debrief as the "solution" they likely missed.
      Ensure the "Always Exit" problem is mitigated by the prize structure (maximize total score over 5 rounds, not win a single round).

