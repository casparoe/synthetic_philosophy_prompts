  6.  **Addressing Specific Concerns:**
      *   *Smuggling Info:* Drivers and Roads swap. If they collude, data is ruined. Solution: Randomize pairs each round? No, too chaotic. Solution: Incentivize the Road to be honest (Road gets points if Driver follows protocol, or Road is a neutral facilitator). Better: The Facilitator (Me) acts as the Road for everyone? No, 14 people, 90 mins. Too slow.
      *   *Decision:* Pairs are best. To prevent collusion: Roads are given a script and must collect the Driver's cards immediately.
      *   *Always-Exiting:* If everyone exits immediately, they get 0. They will learn quickly. The prize motivates optimization.
      *   *Limitation:* The game cannot simulate the *Piccione & Rohrer* belief update (that the probability of being at Int 2 increases if you plan to Continue) without explicit math. The game creates the *confusion*, the debrief provides the *explanation*.

  7.  **Finalizing the Rules & Flow:**
      *   **Materials:** 3 types of cards (Exit, Continue, Intersection). Envelopes.
      *   **The "Amnesia":** The Driver keeps their eyes closed or looks at a blank wall. The Road places an "Intersection" card in front of them.
      *   **The Sequence:**
          1.  Driver writes Plan (e.g., "Exit on Coin Heads").
          2.  Road sets up the trip (2 intersections).
          3.  Road places Card 1 ("Intersection"). Driver decides (based on Plan).
          4.  If Exit: Road reveals "Intersection 1". Score 0.
          5.  If Continue: Road places Card 2 ("Intersection"). Driver decides (based on Plan).
          6.  If Exit: Road reveals "Intersection 2". Score 4.
          7.  If Continue: Road reveals "End". Score 1.
      *   *Crucial:* The "Intersection" cards must be physically identical. The Driver must not see the Road's notes.
