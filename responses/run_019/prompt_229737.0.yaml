answer: |-
  Your skepticism is well-founded. Your friend's summary captures the *spirit* of the framework but mechanizes it in a way that careful practitioners explicitly reject. If you treat ITN (Importance, Tractability, Neglectedness) as a literal formula where you plug in numbers and multiply, you will arrive at false precision and potentially bad decisions.

  Here is the separation of what a careful practitioner would endorse from what is subtly (or overtly) wrong, followed by a direct answer to your question about rigor.

  ### 1. The Three Factors: Definitions and Corrections

  **Importance**
  *   **Friend's Version:** "How many individuals are affected."
  *   **Practitioner's Version:** This is too narrow. Importance is usually decomposed into **Scale** (number affected), **Intensity** (how much their welfare changes), and **Duration** (how long the effect lasts). Crucially, in EA contexts, Importance often weights **existential risk** disproportionately. Affecting $10^{10}$ future lives (by preventing extinction) outweighs affecting $10^9$ current lives slightly, even if the "headcount" is lower.
  *   **Verdict:** Your friend's definition is a useful shorthand but misses the welfare and long-termist dimensions that drive actual prioritization.

  **Tractability**
  *   **Friend's Version:** "How solvable the problem is."
  *   **Practitioner's Version:** This refers to **marginal tractability**, not absolute solvability. The question is not "Can this problem be solved?" but "How much progress does an *additional* unit of resource buy?" A problem might be 100% solvable in theory (e.g., curing all cancer), but if we have already spent the easy dollars, the marginal tractability of the next dollar might be near zero.
  *   **Verdict:** Your friend's definition invites the "planning fallacy" (assuming a problem is solvable because we know the end state) rather than assessing the marginal return on investment.

  **Neglectedness**
  *   **Friend's Version:** "How few people are already working on it."
  *   **Practitioner's Version:** This is the proxy for **diminishing returns**. It is not just a headcount of researchers or NGOs. It is an assessment of the funding landscape relative to the opportunity space. If a problem has 100 people working on it but requires 10,000 to solve, it is still neglected. If it has 100 people working on it but the low-hanging fruit is gone, it is not neglected in terms of *marginal value*.
  *   **Verdict:** Close enough, provided you understand it as a proxy for economic saturation, not a raw census.

  ### 2. The Multiplication Myth

  **Friend's Claim:** "You multiply the three scores and fund whichever cause comes out highest."

  **Reality:** This is the most dangerous part of the summary.
  *   **Ordinal, Not Cardinal:** Practitioners use ITN to rank causes *ordinally* (Cause A looks better than Cause B), not to assign cardinal scores (Cause A is 42.5效用 units). There is no standardized unit for "tractability." You cannot meaningfully multiply "number of lives" by "percentage chance of success" by "number of researchers."
  *   **The Zero-Product Property:** The *logic* of multiplication is endorsed (if any factor is effectively zero, the expected value is zero), but the *arithmetic* is not. It is a mental check: "Is this important? Yes. Is it solvable? Yes. Is it crowded? Yes. Okay, maybe skip it."
  *   **False Precision:** Assigning numbers (1–10) to these dimensions creates an illusion of accuracy that masks huge uncertainty ranges. Open Philanthropy and 80,000 Hours explicitly warn against treating ITN as a spreadsheet formula.

  **Verdict:** Your intuition is correct. The multiplication talk is a pedagogical simplification that becomes misleading if taken literally. It is a heuristic for decomposing expected value, not an algorithm for calculating it.

  ### 3. Tractability vs. Neglectedness: Are They Independent?

  You asked: *"I can't tell whether tractability and neglectedness are genuinely independent factors or just two ways of saying 'an extra unit of effort will go far.'"*

  They are distinct, but they interact to determine marginal value.
  *   **Tractability** is about the **technology/politics**: Do we know *how* to solve it? (e.g., We have a vaccine for malaria).
  *   **Neglectedness** is about the **economics**: Are there still high-return opportunities left? (e.g., Everyone who needs the malaria vaccine has already received it; the next dollar must go to harder-to-reach populations).

  **Example:**
  *   **AI Safety:** High Importance. Tractability is uncertain (we don't know the solution). Neglectedness is moderate/high (relative to capability research).
  *   **Bednet Distribution:** High Importance. High Tractability (we know exactly how to do it). Low Neglectedness (millions are already spent, diminishing returns are setting in).

  If you conflated them, you couldn't distinguish between a problem that is *hard* (low tractability) and a problem that is *saturated* (low neglectedness). Both result in low marginal impact, but for different reasons. Keeping them separate helps diagnose *why* the marginal return is low.

  ### 4. Does the Practical Conclusion Survive?

  **Friend's Conclusion:** "Fund the highest-scoring cause."

  **Cleaned Up Conclusion:** "Direct resources toward the cause with the highest *expected marginal value*, accounting for uncertainty and comparative advantage."

  Does it survive? **Yes, but with major caveats.**
  1.  **Uncertainty:** A cause with a slightly lower "ITN score" but much higher confidence (robustness) is often preferred over a high-variance "moonshot."
  2.  **Comparative Advantage:** You shouldn't fund the globally highest cause if you have no edge there. If you are a biologist, you might do more good in a slightly less "optimal" bio-cause than in the globally optimal AI cause where you lack expertise.
  3.  **Portfolio Theory:** Because of diminishing returns and high uncertainty, diversification is often rational. You don't put 100% of capital into the single highest-estimated cause, because your estimate might be wrong.

  ### 5. Direct Answer on Rigor

  You asked me to be direct if you are expecting more rigor than the framework provides.

  **You are expecting more rigor than the framework provides.**

  ITN is not a scientific model; it is a **mnemonic device**. It is designed to counteract specific human biases:
  *   We focus on vivid problems (Importance counters "scope neglect").
  *   We focus on solvable problems we see in front of us (Tractability counters "futility").
  *   We follow the crowd (Neglectedness counters "herding").

  It is meant to be a qualitative checklist, not a quantitative calculus. If you try to make it rigorous, it breaks. If you treat it as a rough guide for where to look, it works.

  **Summary of Corrections for Your Friend:**
  1.  **Don't multiply numbers.** Use the factors to compare causes qualitatively.
  2.  **Importance** includes duration and intensity, not just headcount.
  3.  **Tractability** is about the *next* dollar, not the whole problem.
  4.  **Neglectedness** is about diminishing returns, not just headcounts.
  5.  **The Goal** is maximizing expected marginal value, but uncertainty and personal fit often override the "highest score."

  The framework is useful, but only if you stop treating it like physics and start treating it like a map.
