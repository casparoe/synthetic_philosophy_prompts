prompt: |-
  So I recently got put in charge of a small research institute's internal funding committee -- we review maybe a dozen ongoing projects twice a year and decide what keeps getting funded. The problem is the decisions are basically vibes right now. Senior people defend their pet projects, nobody wants to kill anything, and "give it one more year" is the default answer to everything.

  I read some Lakatos a while back and I keep thinking his progressive vs. degenerating research programme stuff is exactly the framework we need, but as he writes it it's way too loose to actually run a meeting with. Like, novel predictions, the protective belt absorbing anomalies, when is a problemshift content-increasing vs. just patching things ad hoc -- I want that turned into an actual procedure we can run on a project in about an hour of committee time.

  Concretely, I'd like:

  - A step-by-step review protocol: what questions to ask about a project, in what order, what counts as a good enough answer to each, and how to tell a genuine novel prediction from something retrofitted after the fact (this is the part I expect people to game).
  - Some way to handle the obvious objection that a programme is allowed to go through rough patches -- Lakatos himself says you don't abandon ship at the first anomaly -- so the procedure needs a principled answer to "how long do we wait" rather than just a vibe about patience.
  - Clear stopping rules: where the procedure outputs "defund," where it outputs "fund," and where it has to punt to human judgment because the question isn't one a checklist can settle. Be honest about which steps are judgment calls wearing a procedure costume.
  - Then run the thing on two made-up projects so I can see it in action: (1) a psychology project that keeps "predicting" effects it's already found, with the hypotheses getting more elaborate each cycle to explain away the failed replications; (2) a materials science project that's had two quiet years but whose one surprising result last year opened up a genuinely new line of experiments.

  One more constraint: one of the projects we review is my own former PhD topic, so the procedure will ideally produce at least one verdict that's uncomfortable for someone in the room -- if yours can't plausibly do that, it's probably too soft and I'd like you to say where you think it would get watered down in practice. Also say what the procedure just can't do, so I don't oversell it to the committee. Don't bother with citations or a reading list, I can track down the sources myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Chair of a small research institute's internal funding committee.
      *   **Problem:** Funding decisions are based on "vibes," seniority, and status quo bias ("give it one more year").
      *   **Desired Framework:** Imre Lakatos's Methodology of Scientific Research Programmes (MSRP), specifically the distinction between *progressive* and *degenerating* problemshifts.
      *   **Constraint 1 (Practicality):** Needs to be a step-by-step review protocol usable in ~1 hour per project.
      *   **Constraint 2 (Lakatosian Fidelity):** Must distinguish novel predictions from retrofitted patches (ad hoc hypotheses).
      *   **Constraint 3 (Patience vs. Termination):** Needs a principled way to handle "rough patches" without immediate abandonment, but also clear stopping rules.
      *   **Constraint 4 (Output):** Clear "Fund," "Defund," or "Punt" verdicts.
      *   **Constraint 5 (Honesty):** Must admit where the procedure is just "judgment calls wearing a procedure costume" and where it might get watered down.
      *   **Constraint 6 (Examples):** Run the protocol on two specific hypothetical projects (Psychology: degenerating; Materials Science: progressive but quiet).
      *   **Constraint 7 (Conflict of Interest):** One project is the Chair's former PhD topic. The procedure must be robust enough to potentially yield an uncomfortable verdict (i.e., not just protect the Chair's past work).
      *   **Constraint 8 (No Citations):** No reading lists or citations.

  2.  **Deconstruct Lakatos for a Committee Setting:**
      *   *Hard Core:* The fundamental assumptions not up for negotiation.
      *   *Protective Belt:* Auxiliary hypotheses, methods, initial conditions.
      *   *Positive Heuristic:* The plan for developing the program.
      *   *Negative Heuristic:* What not to touch.
      *   *Progressive Problemshift:* Theories predict *novel* facts that are subsequently corroborated.
      *   *Degenerating Problemshift:* Theories are patched *post-hoc* to save them from anomalies; no new facts predicted.
      *   *The "Time Lag" Problem:* Lakatos admits you can't judge a program instantly. It needs time to mature. How to operationalize "time"?

  3.  **Drafting the Protocol (The "Lakatos Audit"):**
      *   *Goal:* Make it actionable.
      *   *Structure:* Pre-work (submitted docs) + Meeting Flow.
      *   *Key Question:* Did you predict something *new* that turned out true, or did you explain something *old* that went wrong?
      *   *Operationalizing "Novelty":* Timestamping. Hypotheses must be registered *before* data collection.
      *   *Operationalizing "Degeneration":* Count the patches. If the ratio of patches to predictions > 1, worry.
      *   *Operationalizing "Patience":* The "Three-Cycle Rule." You get X amount of time (e.g., 3 funding cycles) to show a net positive shift.

  4.  **Addressing the "Chair's PhD" Constraint:**
      *   The protocol needs to be blind to *who* is presenting, focusing on the *logic* of the shift.
      *   I need to explicitly state that if the Chair's old project looks degenerating, the protocol flags it.
      *   I need to warn that social pressure will try to exempt the Chair's work.

  5.  **Developing the Two Examples:**
      *   *Project A (Psychology):* Classic degenerating. Failed replication -> added moderator variable -> failed again -> added measurement correction. No *new* predictions, just saving the old claim.
      *   *Project B (Materials Science):* Quiet but progressive. Core theory held. Unexpected result (anomaly) -> turned into a new prediction -> verified. This is a "progressive problemshift."

  6.  **Refining the "Judgment Call" Admissions:**
      *   Lakatos is philosophy, not accounting.
      *   What counts as "theoretically significant"?
      *   What counts as "sufficient time"?
      *   The protocol can't force a vote, it can only structure the argument.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. Lakatos is great but fuzzy. We are making it sharp.
      *   **The Protocol (The "Progressive Shift Audit"):**
          *   Phase 1: Pre-submission (The Ledger).
          *   Phase 2: The Meeting (The Interrogation).
          *   Phase 3: The Verdict.
      *   **Handling "Rough Patches":** The "Net Progress" metric over 3 cycles.
      *   **Stopping Rules:** Clear criteria for Red/Yellow/Green.
      *   **Limitations & Vulnerabilities:** Where will people game this? (Especially the Chair's conflict).
      *   **The Simulations:** Run the two cases.

  8.  **Self-Correction/Review during drafting:**
