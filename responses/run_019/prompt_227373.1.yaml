answer: |-
  This is a smart application of Lakatos. The problem you've identified is that Lakatos describes a *historical* process (judged over decades), but you need an *administrative* process (judged over months). To make this work, we have to convert philosophical concepts into bureaucratic artifacts.

  Here is a operationalized protocol, the "Progressive Shift Audit" (PSA), designed for a one-hour committee review.

  ### Part 1: The Progressive Shift Audit (PSA) Protocol

  **Pre-Meeting Requirement: The Prediction Ledger**
  PIs cannot just submit a report. They must submit a "Ledger" covering the previous funding cycle. It must have three columns:
  1.  **Pre-existing Commitment:** What did you claim you would find *before* this cycle started?
  2.  **Outcome:** What did you actually find?
  3.  **Adjustment:** If (1) ≠ (2), what change did you make to the theory or method?

  **Phase 1: The Hard Core Check (10 Minutes)**
  *Goal: Ensure we are still funding the same project, not a zombie.*
  *   **Question:** "Identify the 'Hard Core' of this programme. What assumption is non-negotiable?"
  *   **Question:** "Has this core been touched in the last cycle?"
  *   **Pass:** The core remains stable. Changes are confined to the "protective belt" (methods, auxiliary hypotheses).
  *   **Fail:** The core has shifted to avoid a falsification (e.g., changing the definition of the primary variable *after* it failed to correlate).
  *   **Verdict:** If Fail, immediate "Defund" recommendation. This is ad hocery.

  **Phase 2: The Novelty & Timestamp Test (20 Minutes)**
  *Goal: Distinguish prediction from retrofitting.*
  *   **Question:** "Look at the Ledger. For every successful result, was the hypothesis registered/timestamped *before* data collection?"
  *   **Question:** "For every failed result, did the 'Adjustment' generate a *new* testable prediction for the *next* cycle, or did it just explain the past failure?"
  *   **The "New Fact" Rule:** An adjustment counts as progressive *only if* it predicts a fact that was previously unexpected or forbidden by the old version of the theory.
  *   **Pass:** Adjustments lead to new, risky predictions.
  *   **Fail:** Adjustments only explain past anomalies without risking new claims (e.g., "The effect didn't show because of [unmeasured moderator]," with no plan to measure that moderator next time).

  **Phase 3: The Net Progress Calculation (20 Minutes)**
  *Goal: Handle "rough patches" principledly.*
  *   **Metric:** Count the "Progressive Moves" (Novel predictions confirmed) vs. "Degenerative Moves" (Ad hoc patches to save the core).
  *   **The Three-Cycle Window:** A project is not judged on a single cycle. We look at the rolling average of the last 3 cycles (18 months).
      *   **Green:** Net Progressive > 0 over 3 cycles.
      *   **Yellow:** Net Progressive = 0, but one major novel prediction is currently in the pipeline (pending data).
      *   **Red:** Net Degenerative > 0 over 3 cycles.
  *   **Principled Patience:** If a project is Yellow, it gets funding *conditionally*. If it turns Red next cycle, it is cut. No "one more year" without a specific milestone.

  **Phase 4: Verdict & Recusal (10 Minutes)**
  *   **Fund:** Green status.
  *   **Defund:** Red status.
  *   **Punt:** Yellow status OR if the "Hard Core" definition is disputed by the committee.
  *   **Conflict Check:** If the PI is the Committee Chair (or close collaborator), the Chair must recuse from the *scoring* of Phase 2 & 3. A designated "Devil's Advocate" committee member must lead the interrogation.

  ---

  ### Part 2: Where This Procedure Breaks (Honesty Check)

  You asked where this is just "judgment calls wearing a procedure costume." Here is the vulnerability analysis:

  1.  **Defining the "Hard Core":** PIs will strategically define their core as very thin to make everything else a "protective belt" adjustment. *Counter:* The committee must vote on whether the proposed Core is substantive enough to constitute a research programme. If the Core is "Psychological factors matter," that's too vague. It gets rejected.
  2.  **The "New Fact" Definition:** In social sciences, a "new fact" is often just a new population or context. Hard scientists might view this as degenerative. *Counter:* The committee needs a shared baseline of what counts as "novel" for your specific institute.
  3.  **The Chair's Conflict:** This is the biggest failure point. If your old PhD project is up for review, the committee will naturally defer to your "expertise" on whether a shift is progressive or ad hoc.
      *   *Mitigation:* You must physically leave the room during Phase 2 of your own project's review. If you stay, the procedure is theater.
  4.  **Gaming the Ledger:** PIs will frame failures as "methodological issues" rather than theoretical anomalies.
      *   *Mitigation:* The committee must ask: "If this was just a method error, why did it require a theoretical adjustment?"

  ---

  ### Part 3: Simulation Run-Throughs

  Here is how the PSA handles your two hypothetical cases.

  #### Case 1: The Psychology Project (Degenerating)
  *Context:* Studies a specific cognitive bias. Last year, a major replication failed.
  *   **Phase 1 (Hard Core):** PI claims Core is "The bias exists." Committee accepts.
  *   **Phase 2 (Novelty):**
      *   *Ledger Check:* PI predicted replication would succeed. It failed.
      *   *Adjustment:* PI claims the failure was due to "participant suspicion" (a new moderator).
      *   *Interrogation:* "Did you predict suspicion would matter *before* the failure?" No. "Does this new moderator predict a *new* effect elsewhere?" No, it just explains the failure.
      *   *Result:* Degenerative Move.
  *   **Phase 3 (Net Progress):**
      *   Cycle 1: Progressive (Initial discovery).
      *   Cycle 2: Degenerative (Failed replication, patched with "suspicion").
      *   Cycle 3 (Current): Proposing to measure suspicion. No new prediction of a *different* phenomenon.
      *   *Score:* 1 Progressive, 2 Degenerative. Trend is Red.
  *   **Verdict:** **Defund.**
  *   **Why:** The protective belt is thickening to protect a core that isn't yielding new fruit. The "suspicion" variable is a classic ad hoc rescue.

  #### Case 2: The Materials Science Project (Progressive/Quiet)
  *Context:* Developing a new alloy. Two years of standard testing (boring). Last year, a sample behaved strangely under heat.
  *   **Phase 1 (Hard Core):** Core is "Crystal structure X yields property Y." Stable.
  *   **Phase 2 (Novelty):**
      *   *Ledger Check:* Most predictions were mundane (confirmed). One anomaly: Sample fractured differently at threshold Z.
      *   *Adjustment:* PI proposes a micro-structural shift occurs at Z.
      *   *Interrogation:* "Is this a patch?" PI shows that this micro-structural theory *also* predicts increased conductivity at Z, which was not previously known.
      *   *Result:* Progressive Move. The anomaly was turned into a novel prediction (conductivity) which was then tested and confirmed.
  *   **Phase 3 (Net Progress):**
      *   Cycle 1: Neutral (Standard validation).
      *   Cycle 2: Neutral (Standard validation).
      *   Cycle 3: Highly Progressive (Anomaly turned into novel confirmed prediction).
      *   *Score:* Net Positive.
  *   **Verdict:** **Fund.**
  *   **Why:** Quiet periods are allowed if the "Positive Heuristic" is still generating new facts. The anomaly wasn't patched away; it was harvested.

  ---

  ### Part 4: The Uncomfortable Verdict (Your PhD Project)

  Let's assume your former PhD topic is up for review. It's well-regarded, but honestly, it's been coasting.

  *   **Scenario:** The project is applying your old framework to new domains. It hasn't failed, but it hasn't predicted anything surprising in 4 years. It just "finds" the expected effect in slightly different contexts.
  *   **Applying the PSA:**
      *   **Phase 2:** The Ledger shows 100% success rate.
      *   **The Trap:** The committee sees 100% success and thinks "Great project."
      *   **The Audit:** You (recused) are not there to defend it. The Devil's Advocate asks: "How many of these successes were *novel predictions* vs. *confirmations of the original 10-year-old thesis*?"
      *   **Finding:** All successes are confirmations of the original core. No new risky predictions have been made since Cycle 3. The "adjustments" are just applying the same model to new survey populations.
      *   **Phase 3 Score:** Over the last 3 cycles: 0 Progressive Moves, 0 Degenerative Moves. It is **Stagnant**.
      *   **Verdict:** **Defund (or Pivot).**
      *   **Rationale:** A research programme that does not risk falsification is no longer science; it is puzzle-solving within a paradigm that may be exhausted.

  **Why this is uncomfortable:**
  Senior colleagues will argue, "But it's reliable! It produces papers!"
  The PSA forces the answer: "It produces papers, but not *knowledge growth*."
  If you enforce this, you are effectively voting to kill your own intellectual legacy. If you don't recuse yourself, you will instinctively argue that "applying to new populations" counts as novel. The procedure exposes that bias.

  ### Part 5: Final Constraints & Warnings

  **What this procedure CANNOT do:**
  1.  **It cannot judge truth:** It judges *progress*, not correctness. A project can be wrong but progressive (boldly predicting new things that turn out false is better than cautiously predicting old things that turn out true). Make sure the committee understands this.
  2.  **It cannot stop collusion:** If the senior members agree to protect each other's "Hard Cores," they can vote to accept ad hoc patches. The procedure structures the argument, it doesn't bind the vote.
  3.  **It cannot handle "Moonshots":** High-risk projects will look degenerative for a long time. You need a separate "High Risk/High Reward" bucket that is exempt from the Three-Cycle Window.

  **Where it will get watered down:**
  The definition of "Novel Prediction." In a friendly committee, people will start calling "confirming a known effect in a new dataset" a novel prediction.
  *   **Fix:** Require that a "Novel Prediction" must be pre-registered publicly (e.g., OSF) before the cycle begins. If it's not timestamped externally, it doesn't count for the Progress score.

  **Implementation Advice:**
  Print the "Ledger" template. Make it mandatory. At the first meeting, run the PSA on a *completed* project from 5 years ago (historical case study) to train the committee on how to spot the difference between a patch and a shift. Then apply it to the live projects.

  If you don't recuse yourself on your own topic, don't bother running the procedure. The room will know.
