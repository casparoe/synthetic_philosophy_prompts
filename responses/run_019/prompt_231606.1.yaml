answer: |-
  # JOINT STATEMENT ON THE STATUS OF GROUNDING
  **Submitted by the Adversarial Collaboration on Metaphysical Dependence**

  **Preface**
  After three years of structured dialogue, the Grounding Realists and the Grounding Deflationists submit this statement to clarify the terrain of our disagreement. We have found that much of the historical friction arose from ambiguous terminology regarding "facts," "relations," and "structure." While we remain divided on the metaphysical status of grounding, we agree on the logical behavior of grounding claims and have isolated the precise locus of our residual disagreement. This document serves as a map for future inquiry, distinguishing settled commitments from open empirical and conceptual cruxes.

  ### I. Shared Commitments regarding Grounding Discourse

  Both parties endorse the following claims regarding the logical and semantic behavior of canonical grounding claims (statements of the form "$A$ grounds $B$" or "$B$ obtains in virtue of $A$"). We agree that any adequate account of grounding must respect these constraints:

  1.  **Factivity:** Grounding claims are factive. If it is true that $A$ grounds $B$, then it is true that $A$ obtains and it is true that $B$ obtains. Grounding does not relate falsehoods or merely hypothetical states.
  2.  **Asymmetry and Irreflexivity:** In the central, canonical cases, grounding is asymmetric and irreflexive. If $A$ grounds $B$, then $B$ does not ground $A$. Furthermore, nothing grounds itself. We acknowledge that apparent counterexamples (such as mutual dependence) should be analyzed as distinct grounding chains or non-canonical uses of the terminology.
  3.  **Hyperintensionality:** Grounding is hyperintensional. It distinguishes between truths that are necessarily equivalent. For example, even if $A$ and $A \land (B \lor \neg B)$ are necessarily equivalent, it may be the case that $A$ grounds $C$ while $A \land (B \lor \neg B)$ does not ground $C$.
  4.  **Non-Reductionism:** Grounding cannot be reduced to material conditionals, strict conditionals, or bare necessary covariation. The truth of $\square(A \to B)$ is necessary but not sufficient for $A$ grounds $B$. There is a directional explanatory component that modal connection alone fails to capture.

  ### II. Statement of Residual Disagreement

  While we agree on the *logic* of grounding talk, we disagree on its *metaphysical interpretation*. The disagreement is not about whether we should use the language (both sides find it indispensable), but about what makes that language correct.

  **1. On the Unity of the Relation**
  *   **Grounding Realists:** There is a unified, sui generis (or small systematic family of) non-causal dependence relation(s) in reality. The various specific grounding claims (metaphysical, normative, mathematical) are successful because they track instances of this worldly relation.
  *   **Grounding Deflationists:** There is no single worldly relation unifying these claims. "Grounding" is a functional term that picks out whatever relation plays the role of explanatory priority within a specific domain. The unity is pragmatic (unified by our theoretical needs), not ontological.

  **2. On the Fact of the Matter**
  *   **Grounding Realists:** There is a fact of the matter about which facts ground which, independent of our explanatory practices. If our best theory says $A$ grounds $B$, the theory is true *because* $A$ actually grounds $B$ in the world.
  *   **Grounding Deflationists:** There is no fact of the matter about ground *over and above* the facts about explanatory priority licensed by our best theories. To say "$A$ grounds $B$" is just to say that $A$ is explanatorily prior to $B$ within the optimal regimentation of our discourse.

  **3. On the Contribution of "Fundamental"**
  *   **Grounding Realists:** "Fundamental" picks out entities or facts that are ungrounded *in reality*. They are the terminal nodes of the worldly dependence structure. Their fundamentality is an intrinsic metaphysical status.
  *   **Grounding Deflationists:** "Fundamental" picks out the posits of our best theory that are not themselves explained by other posits *within that theory*. Fundamentality is a status within the explanatory enterprise, marking where inquiry pragmatically stops, not necessarily where the world "ends."

  **4. On the Regress ("What Grounds the Grounding Facts?")**
  *   **Grounding Realists:** Grounding facts themselves require grounding (the "principle of full grounding"), or they must be identified as brute structural features of reality. An infinite chain of grounding facts is metaphysically untenable; there must be a fundamental base.
  *   **Grounding Deflationists:** Asking what grounds the grounding fact is often a category mistake or a request for a higher-order explanation. If the first-order explanation ($A$ explains $B$) is complete, no further fact is required to "make it the case" that $A$ explains $B$. Infinite chains are permissible if they do not hinder theoretical utility.

  ### III. Crux Table

  The following table identifies specific cases where our shared commitments allow for divergent predictions. Settling these cases would force a revision of at least one party's position.

  | Sub-Question | Concrete Case | Grounding Realist Prediction | Grounding Deflationist Prediction |
  | :--- | :--- | :--- | :--- |
  | **Source of Directionality:** Is the direction of grounding determined by worldly dependence or conceptual order? | **Socrates and his Singleton:**<br>$A$: Socrates exists.<br>$B$: The set {Socrates} exists.<br>Both agree $A$ grounds $B$. | The direction is fixed by **ontological dependence**. Socrates is more real than the set. Even if a creature conceptualized sets before members, Socrates would still ground the set. | The direction is fixed by **explanatory optimization**. We ground the set in the member because our current set-theory is simpler that way. A different conceptual scheme could reverse this without metaphysical error. |
  | **Context Sensitivity:** Does grounding hold relative to a theoretical framework? | **The Statue and the Lump:**<br>$A$: The lump of clay exists.<br>$B$: The statue exists.<br>They coincide spatially and temporally. | There is a **context-invariant fact** here. Typically, the lump grounds the statue (constitution). This holds regardless of whether we are doing art history or geology. | The grounding claim is **context-sensitive**. In an art-historical context, the statue (as an artifact) may ground claims about the lump's arrangement. There is no single "metaphysical" verdict independent of the project. |
  | **Well-Foundedness:** Must the chain of grounds terminate? | **Infinite Descent:**<br>A world where every fact $F_1$ is grounded by $F_2$, which is grounded by $F_3$, *ad infinitum*. | **Impossible.** Such a world lacks ontological structure. Without a fundamental base, nothing would exist (or the grounding relation would fail to obtain). | **Possible.** As long as each link in the chain provides local explanation, the lack of a terminal node does not render the facts unintelligible or non-obtaining. |

  ### IV. Concluding Note on Verbal Disputes

  In the course of this collaboration, we concluded that a significant portion of the historical debate was verbal, specifically regarding the **ontology of the relata**.

  Arguments over whether the relata of grounding are "propositions," "sentences," "facts," or "entities" were found to be largely notational. The Realists use "fact" to denote a worldly constituent; the Deflationists use "fact" to denote a true sentence. Once we agreed to treat "fact" neutrally as *that which is expressed by a true declarative sentence*, the disagreement shifted from "What kind of thing is a fact?" to "Does the truth of the sentence depend on a worldly relation?"

  Consequently, we recommend future literature avoid ontological categorization of the relata as a precondition for grounding theory. The substantive disagreement lies not in the *categories* employed, but in whether the *structure* described by those categories is mind-independent (Realism) or a feature of our best explanatory regimentation (Deflationism). The Crux Table above represents the non-verbal remainder of the debate.
