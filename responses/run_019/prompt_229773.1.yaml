prompt: |-
  In ordinary conversation, someone who asserts a claim she privately disbelieves is criticized for speaking insincerely, even if the claim turns out to be true; someone who asserts a claim that turns out false is criticized for getting it wrong, even if she believed it. Wikipedia's editing policy appears to run on neither standard. Editors are told not to insert material merely because they are sure of it; it must be verifiable in a reliable published source. An editor may be expected to present a reliably sourced claim she privately believes is false (as can happen when neutrally covering a contested topic), and unsourced material may be removed even if it is true and the editor who added it knows it from direct experience.

  Reconstruct the implicit view of assertion behind this policy, if it has one. Does it presuppose a truth norm, a belief norm, a knowledge norm, or some distinct source- or provenance-based norm? In answering, distinguish what the policy strictly presupposes from what it merely fits well with, consider whether Wikipedia edits should even be modeled as assertions of the underlying claims rather than as reports about what sources say, and explain what would have to change if the encyclopedia were run instead on the rule that a claim may be included only if the editor knows it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Wikipedia's editing policy regarding verification and sourcing (specifically the "Verifiability" policy).
      *   **Comparison:** Ordinary conversation norms (Sincerity/Belief vs. Truth) vs. Wikipedia norms.
      *   **Key Observation:** Wikipedia allows/requires asserting things one might disbelieve (if sourced) and forbids asserting things one knows to be true (if unsourced).
      *   **Task:** Reconstruct the implicit view of assertion behind this policy.
      *   **Specific Questions to Address:**
          *   Does it presuppose a truth norm, belief norm, knowledge norm, or a source/provenance-based norm?
          *   Distinguish between what the policy *strictly presupposes* vs. what it *fits well with*.
          *   Consider whether Wikipedia edits are *assertions* or *reports about sources*.
          *   Explain what would change if the rule were "include only if the editor knows it."

  2.  **Analyze the Ordinary Conversation Norms:**

      *   *Insincerity:* Asserting $P$ while believing $\neg P$ is bad (even if $P$ is true). This points to a **Belief Norm** (or Sincerity Norm).
      *   *Error:* Asserting $P$ while $P$ is false is bad (even if believed). This points to a **Truth Norm**.
      *   *Knowledge:* Often seen as the intersection of Truth + Belief + Justification. Asserting $P$ without knowing $P$ is often criticized (Williamson's Knowledge Norm).

  3.  **Analyze Wikipedia's Policy (Verifiability, No Original Research):**

      *   *Rule:* Claims must be backed by reliable published sources.
      *   *Case A (Sourced but Disbelieved):* Allowed/Required. (e.g., "Many people believe X" or reporting a scientific consensus the editor doubts).
      *   *Case B (Unsourced but Known/True):* Forbidden/Removed. (e.g., "I saw this happen" without a news report).
      *   *Implication:* The justification for the assertion lies *outside* the editor's mental state (belief/knowledge) and *outside* the raw facticity (truth), residing instead in the **public record**.

  4.  **Evaluate the Norm Types:**

      *   *Truth Norm:* No. True unsourced claims are rejected.
      *   *Belief Norm:* No. Disbelieved sourced claims are accepted.
      *   *Knowledge Norm:* No. An editor can know something personally (direct experience) but cannot assert it without a source. Conversely, an editor can assert something they don't know (just read it) provided the source is reliable.
      *   *Source/Provenance Norm:* Yes. The warrant for assertion is the existence of a reliable third-party record.

  5.  **Address the "Assertion vs. Report" Distinction:**

      *   *Standard Assertion:* "P is the case." (Commits speaker to truth).
      *   *Wikipedia Edit:* Is it "P is the case" or "Source S says P"?
      *   *Nuance:* Wikipedia writes in a neutral voice ("The sky is blue," not "According to X, the sky is blue"). However, the *warrant* is "According to X."
      *   *Philosophical Interpretation:* It functions as a **second-order assertion**. It asserts that *there is a consensus/record* that P. Or, it treats the encyclopedia not as a primary knower but as a **curator of public knowledge**.
      *   *Conclusion:* It's best modeled not as personal assertion but as **testimony aggregation** or **institutional reporting**. The "speaker" is the institution, not the individual editor.

  6.  **Distinguish "Strictly Presupposes" vs. "Fits Well With":**

      *   *Strictly Presupposes:* The policy *requires* a provenance norm. It logically excludes truth/belief/knowledge norms as *sufficient* conditions.
      *   *Fits Well With:* It fits with a social epistemology view where knowledge is distributed. It fits with a deflationary view of truth (we care about agreement on records, not metaphysical truth).

  7.  **Analyze the Counterfactual ("Only if the Editor Knows It"):**

      *   *Current State:* Reliance on external validation.
      *   *Counterfactual:* Reliance on internal epistemic state.
      *   *Consequences:*
          *   Loss of neutrality (editors impose personal views).
          *   Loss of verifiability (readers can't check).
          *   Collapse into original research.
          *   Disputes become about the editor's mind, not the text.
          *   Expertise becomes gatekept by self-declaration.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension between conversational norms and Wiki policy. State the thesis: Wikipedia operates on a **Provenance Norm** (or Institutional Verifiability Norm), treating edits as **reports** rather than personal assertions.
      *   *Section 1: Ruling out Standard Norms.* Explain why Truth, Belief, and Knowledge norms fail to explain the policy. (True unsourced = out; False believed = out; Disbelieved sourced = in).
      *   *Section 2: The Provenance Norm.* Define it. The warrant is the *source*, not the *state of the world* or the *state of the mind*.
      *   *Section 3: Assertion vs. Report.* This is crucial. Argue that Wikipedia sentences are grammatically assertions but pragmatically **citations**. They assert that "P is established in the literature." This shifts the commitment from the editor to the institution.
      *   *Section 4: Strict Presupposition vs. Fit.* Strict: Must have a source. Fit: Aligns with social epistemology, but doesn't necessarily deny truth matters (truth is hoped for via reliable sources).
      *   *Section 5: The "Knowledge" Counterfactual.* Detail the chaos. "I know this" is unverifiable. It turns Wikipedia into a blog or forum. It destroys the "Neutral Point of View" because personal knowledge is rarely neutral.

  9.  **Refining the Philosophical Terminology:**

      *   Use terms like "norm of assertion," "social epistemology," "testimony," "institutional speech."
      *   Ensure the distinction between *individual* epistemology and *collective* epistemology is clear.

  10. **Final Review against Prompt:**

      *   Reconstruct implicit view? Yes (Provenance/Institutional).
      *   Truth/Belief/Knowledge/Source? Yes (Source).
      *   Strict vs. Fit? Yes.
      *   Assertion vs. Report? Yes.
      *   Change if "Knowledge" rule? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to say Wikipedia *doesn't care about truth*. They do, but they treat "verifiability" as the proxy for truth. I should clarify that the norm is about the *right to assert*, not necessarily the *metaphysical status* of the claim. The policy is deontological (about rules/permissions) rather than alethic (about truth).

      *(Refining the "Report" aspect)*: If I write "The earth is round," am I reporting? Grammatically no. But functionally, I am endorsing the consensus. I should characterize it as **institutional assertion** based on **aggregated testimony**.

      *(Final Polish)*: Ensure the tone is analytical and philosophical.

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  The Wikipedia editing policy described—specifically the core pillars of **Verifiability** and **No Original Research**—reveals a distinct normative framework for speech that diverges sharply from the norms governing ordinary interpersonal assertion. To reconstruct the implicit view of assertion behind this policy, we must analyze it through the lens of social epistemology and speech act theory.

  ### 1. Ruling Out the Standard Norms

  In ordinary conversation, assertion is typically governed by one of three competing norms:
  *   **The Truth Norm:** One must assert $p$ only if $p$ is true.
  *   **The Belief (Sincerity) Norm:** One must assert $p$ only if one believes $p$.
  *   **The Knowledge Norm:** One must assert $p$ only if one knows $p$.

  Wikipedia's policy explicitly rejects all three as sufficient conditions for inclusion:
  *   **Against the Truth Norm:** A claim can be true (known via direct experience) but must be removed if unsourced. Truth alone does not warrant assertion.
  *   **Against the Belief Norm:** An editor may (and sometimes must) assert a claim they privately disbelieve, provided it is well-sourced (e.g., reporting a prevailing scientific theory the editor doubts). Belief is not required.
  *   **Against the Knowledge Norm:** An editor may assert a claim they do not personally know (having merely read it in a source), while being forbidden from asserting a claim they *do* know (via personal experience) if it lacks publication. Personal knowledge is not a valid warrant.

  Therefore, the policy does not presuppose a truth, belief, or knowledge norm in the traditional individualistic sense.

  ### 2. The Provenance Norm (Institutional Verifiability)

  The implicit view behind Wikipedia is best described as a **Provenance Norm** (or **Source-Based Norm**). Under this norm, the warrant for assertion is not the speaker's mental state or the facticity of the world, but the **public availability of the claim in a reliable record**.

  *   **Strict Presupposition:** The policy strictly presupposes that the *right to assert* is derived from **citation**, not cognition. The normative force lies in the chain of transmission, not the content's correspondence to reality or the editor's conviction. The "speaker" is not the individual editor, but the institution of Wikipedia acting as a curator of public records.
  *   **Fits Well With:** This fits well with a **social epistemology** view where knowledge is distributed and institutional rather than individual. It aligns with the idea that in a mass-collaborative environment, "justification" must be externalized and objectified so that it can be checked by strangers. It treats the encyclopedia not as a repository of *facts*, but as a repository of *published claims about facts*.

  ### 3. Assertion vs. Report: The Nature of the Speech Act

  A crucial distinction in reconstructing this view is whether a Wikipedia sentence (e.g., "The population of Paris is 2.1 million") functions as an **assertion** or a **report**.

  *   **Grammatical Assertion:** Wikipedia writes in an assertoric voice. It does not typically say, "Source X says the population is 2.1 million." It says, "The population is 2.1 million."
  *   **Pragmatic Report:** However, the *commitment* undertaken by the editor is not to the truth of the proposition, but to the **existence of the source**.

  Consequently, Wikipedia edits should be modeled as **institutional assertions based on aggregated testimony**. When an editor adds a sentence, they are not saying, "I tell you that $p$." They are saying, "The public record sustains the claim that $p$."

  This shifts the norm from a **first-order norm** (about the world) to a **second-order norm** (about the literature). The implicit view is that the encyclopedia's function is not to discover truth, but to map the landscape of reliable discourse. If the reliable discourse is wrong, the encyclopedia records that error until the discourse corrects itself. This explains why an editor can assert what they disbelieve: they are asserting the *status of the claim in the literature*, not the *metaphysical status of the claim in the world*.

  ### 4. Strict Presupposition vs. Mere Fit

  It is vital to distinguish what the policy *requires* from what it *allows*.

  *   **Strictly Presupposes:** The policy strictly presupposes that **verifiability trumps truth and knowledge**. It assumes that in a collaborative, anonymous environment, the only adjudicable standard is the presence of a citation. It presupposes that unrecorded truth is epistemically useless to the project.
  *   **Merely Fits Well With:** The policy fits well with the idea that reliable sources generally track truth (the "reliability" criterion). However, it does not *presuppose* that sourced claims are true, only that they are *vetted*. It also fits with a deflationary view of truth, but it does not strictly require it; one could believe in objective truth and still support the policy as a pragmatic heuristic for avoiding libel and bias.

  ### 5. The Counterfactual: If the Rule Were "Include Only If Known"

  If Wikipedia were run on the rule that "a claim may be included only if the editor knows it," the project would undergo a fundamental transformation from an **archive of public consensus** to a **forum of expert testimony**. The consequences would be:

  1.  **Collapse of Verifiability:** Readers could not verify claims. If an editor asserts $p$ because they "know" it, a challenger cannot check the editor's mind. Disputes would become intractable arguments about the editor's credibility rather than the text's sourcing.
  2.  **Loss of Neutrality:** Personal knowledge is often idiosyncratic. Allowing claims based on personal knowledge would invite "Original Research." Editors would insert their own analyses, data, and experiences, turning the encyclopedia into a collection of blogs or white papers.
  3.  **Gatekeeping by Self-Declaration:** To prevent abuse, the project would need to verify the *editors* rather than the *edits*. This would require real-name policies, credential verification, and a hierarchy of expertise, destroying the open, egalitarian nature of the wiki model.
  4.  **Shift in Liability:** Currently, Wikipedia shifts liability to the sources ("We just reported what the NYT said"). If editors assert based on personal knowledge, the institution assumes liability for the truth of the claim, increasing legal and reputational risk.

  ### Conclusion

  Wikipedia's policy reconstructs assertion not as a commitment by an individual to the truth of a proposition, but as a **commitment by an institution to the traceability of a proposition**. It replaces the **Knowledge Norm** with a **Documentation Norm**.

  This view treats the encyclopedia as a **map of reliable discourse** rather than a **mirror of reality**. It prioritizes the *social warrant* for belief (publication) over the *individual warrant* for belief (knowledge/experience). While this creates the oddity of requiring editors to assert things they may doubt, it preserves the encyclopedia's function as a neutral, verifiable, and stable repository of what society has recorded, rather than what any individual happens to know.
