answer: |-
  During the grand opening of a municipal library, the appointed City Clerk stands before the crowd, holds the ceremonial scissors, and clearly enunciates the statutory phrase, "I hereby declare this library open," before cutting the ribbon. The Clerk follows every step of the official protocol prescribed by the city charter, and the audience accepts the building as open. However, unbeknownst to everyone else, the Clerk is a political protestor who believes the library was built on unjust land; while speaking, she internally intends her words *not* to function as a valid declaration, viewing them merely as noises required to end the ceremony, secretly refusing to confer the official status she knows the words usually create.

  **Austin's Verdict:** The act is **successfully performed**. For Austin, the validity of a performative rests primarily on the execution of an accepted conventional procedure by the appropriate persons in the appropriate circumstances. While Austin requires participants to have requisite thoughts and feelings (Condition H), violating this condition renders the act an *abuse* (insincere) rather than a *misfire* (void). Because the public convention was flawlessly executed, the library is open, regardless of the Clerk's private mental reservation.

  **Searle's Verdict:** The act is **void/not performed**. For Searle, the essence of a speech act lies in the intention to produce a certain effect by getting the hearer to recognize that intention. Specifically, for declarations that change institutional reality, the agent must intend to impose the status function. Since the Clerk explicitly intended *not* to confer the status (treating the words as mere noise rather than a vehicle of illocutionary force), the constitutive intention is missing, and the act fails to launch.

  **The Feature Doing the Work:** The divergence hinges on the **secret internal refusal of illocutionary intent** despite **perfect external conformity to convention**. Austin prioritizes the public convention; Searle prioritizes the private intention.

  **Removing the Feature:** If you remove the secret refusal (making the Clerk intend to open the library) or remove the convention (making her an unauthorized person), both theorists collapse into agreement (either both say it worked, or both say it failed). The divergence exists only in this gap between public procedure and private intent.

  **Best Reply for the Less Intuitive Verdict (Searle):** Searle can argue that institutional reality is constituted by *collective intentionality*. If the individual agent responsible for imposing the status lacks the intention to do so, the "collective" acceptance is built on a falsehood, and the status function is ontologically shaky. He might claim the library is only "open" in appearance, not in normative reality, because the authorized agent did not actually authorize it.

  **Ordinary Practice:** Actual legal and administrative practice sides decisively with **Austin**. A registry office, court, or HR department treats the public performance of the procedure as binding regardless of the agent's private thoughts (the "objective theory" of contracts and acts). If the Clerk tried to void the opening later by revealing her protest, the city would reject her claim; the act stands because the convention was satisfied.
