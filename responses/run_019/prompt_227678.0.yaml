answer: |-
  **The Scenario**
  Consider a high-trust, decentralized freelance network where members coordinate complex projects without formal contracts, relying instead on rapid, text-based communication. To filter out opportunistic outsiders, the network relies on a specific, irregular syntactic quirk inherent to a rare, isolated dialect (e.g., a specific preposition ordering unique to a small valley in the Alps) that persists even when members speak the lingua franca. A prospective member signals belonging by composing a proposal email utilizing this quirk naturally. Producing the signal costs the native speaker nothing extra in time, effort, or risk; it is their default linguistic motor program. An outsider cannot fake the signal convincingly, not because they are unwilling to expend the effort to learn it, but because the critical period for acquiring native-level syntactic intuition has closed, rendering the mimicry physically impossible regardless of investment. The signal remains reliably honest not because fakers *won't* pay the price, but because they *can't* produce the token, even for free.

  **Diagnostics**
  The feature replacing cost as the honesty-enforcing mechanism is a **biological/developmental capacity constraint** (neuroplasticity limits) rather than a resource trade-off. In standard Costly Signaling Theory (CST), honesty is maintained because the marginal cost of signaling is higher for low-quality types ($C_L > C_H$); here, the marginal cost of production is zero for both, but the *ability* to produce is binary ($Ability_H = 1, Ability_L = 0$). If you remove this constraint—hypothetically granting adults perfect, instantaneous mimicry of native syntax—deception becomes immediately profitable. Outsiders would adopt the quirk to gain high-trust access, exploit the network, and leave, collapsing the system. The honesty relies entirely on the *impossibility* of acquisition, not the *expense* of it.

  **The Handicap Defender's Rebuttal & Evaluation**
  A CST defender will argue that this scenario secretly contains a cost: the "sunk cost" of growing up in that specific valley (opportunity costs of not growing up elsewhere) or the "maintenance cost" of retaining the dialect. They will claim that an infinite acquisition cost is simply the limit case of a high finite cost. **This response is the theory retreating into unfalsifiability.** If any historical path dependency or biological constraint counts as a "cost," then *every* differential trait (height, eye color, birthplace) becomes a costly signal, rendering the theory a tautology that merely describes difference rather than explaining the *economics* of honesty. A genuinely cost-free honest signal that CST cannot accommodate must have **zero marginal production cost** and **no differential resource investment** relevant to the signal's current validity. In my scenario, the "cost" of being a native is sunk and unrecoverable, unrelated to the strategic decision to signal *now*. If CST absorbs sunk biological constraints into its definition of "handicap," it ceases to be a theory about strategic expenditure and becomes a theory of existence itself, unable to distinguish between a peacock's tail (energetically expensive to grow) and a human's fingerprint (physically impossible to forge, but costless to possess).
