  **Q&A Prep Sheet: Non-Propositional Hinges**

  **1. The Graduate Students (Skepticism & Closure)**
  *Question:* "If hinges aren't beliefs, doesn't this just change the subject? The skeptic uses the closure principle: if I know I have hands, I know I'm not a brain-in-a-vat. If you say hinges aren't knowable beliefs, aren't you just conceding skepticism rather than answering it?"
  *Reply:* I'm not conceding skepticism; I'm dissolving its precondition. Closure principles operate on propositional attitudes. If hinge certainties are practical competencies—like knowing how to walk rather than believing you have legs—they fall outside the scope of closure. The skeptic assumes a theoretical stance where none exists. We don't *infer* the world exists; we act within it. By showing the category mistake, I remove the leverage skepticism needs to get started.
  *Weakness:* To realists, this looks like evasion. It protects certainty by removing it from the domain of knowledge, which may feel like a verbal trick rather than a substantive defeat of skepticism.

  **2. The Decision Theorist (Bayesian Credence)**
  *Question:* "I hear you on competence, but my models require inputs. Even if you refuse the label 'belief,' couldn't we just model this competence as credence 1 in a low-level proposition? If it functions like certainty, why not formalize it as such?"
  *Reply:* Because credence implies updateability. In Bayesian terms, credences shift via conditionalization on evidence. Hinges are the framework *for* conditionalization; they are the rules of the game, not the moves. If you model a hinge as credence 1, you imply it could theoretically drop to 0.9 given bad evidence. But if 'evidence' contradicts a hinge, we reject the evidence, not the hinge. Modeling this as high credence misrepresents its logical grammar as merely very strong belief.
  *Weakness:* Formal models are pragmatically useful. Rejecting them limits interdisciplinary dialogue, and you risk appearing anti-scientific to a decision theorist who sees all behavior as optimizable data.

  **3. The Senior Epistemologist (Wright-Style Entitlement)**
  *Question:* "Suppose I grant hinges aren't beliefs. They are still states we rely on to justify other things. Crispin Wright argues we need a warrant—an entitlement—to trust them rationally. If they aren't beliefs, what grants us the normative right to rely on them? Without warrant, isn't this just blind trust?"
  *Reply:* The riverbed is not another kind of water. Asking for a warrant assumes hinges are items *within* the justification game. I argue they are the board upon which the game is played. 'Entitlement' still suggests a normative status bestowed upon a state. I'm claiming the competence is ar-normative; it is the condition for norms existing. We don't need a warrant to trust our legs when walking; we just walk. To ask for a warrant is to demand a justification for the possibility of justification.
  *Weakness:* This is your hardest hill to die on. It's difficult to explain error or irrationality without some normative framework. If hinges are ar-normative, how do we distinguish good hinges from bad dogmas?

  **4. The Wittgenstein Scholar (Therapy vs. Theory)**
  *Question:* "You're constructing a systematic reading—'non-propositionalism'—but Wittgenstein says philosophy is therapy, not theory. Aren't you doing exactly what *On Certainty* warns against? You're turning grammatical remarks into a metaphysical position."
  *Reply:* I am offering a reading, not a system. My goal is to dissolve the theoretical craving to treat hinges as knowledge-claims. However, to communicate this in a workshop, I must use theoretical language provisionally. The 'theory' is a ladder to be thrown away once the category mistake is seen. I'm not positing a new ontology of competence; I'm reminding us of how certainty actually functions in our lives.
  *Weakness:* This is the strongest objection. Any exegetical claim risks violating Wittgenstein's quietism. You cannot fully defend a 'reading' without theorizing, so this objection is partially self-sealing.

  **Strategy: Hold vs. Concede**
  *Hold:* **The Non-Propositional Core.** Do not concede that hinges are beliefs with special status. If you allow they are beliefs (even "unearned"), you lose the riverbed analogy and fall back into standard epistemology where Wright wins.
  *Concede:* **Systematicity.** Concede to the Wittgenstein Scholar that you are using theory provisionally. Acknowledge that *On Certainty* resists systematization. This disarms the "therapy" objection without sacrificing your argument. Concede to the Decision Theorist that models are useful *heuristics*, just not ontologically accurate descriptions of hinges.

  **The Question You Hope Nobody Asks**
  *Question:* "If hinges are practical competences rather than beliefs, how do you distinguish them from mere brute conditioning or habit? If a fanatic is practically certain their ideology is true, is that also a hinge competence? If not, what normative resource do you have to criticize them without appealing to belief-based justification?"
  *Why it's dangerous:* This exposes the weakness noted in the Senior Epistemologist's objection. If hinges are ar-normative competences, you lack the resources to distinguish reliable certainty from dangerous dogma without smuggling in propositional norms. If you say "good hinges lead to successful action," you risk pragmatism. If you say "bad hinges aren't real hinges," you risk circularity. This question forces you to admit that some normative structure is needed to evaluate the riverbed itself, potentially collapsing your distinction between competence and justified belief.
