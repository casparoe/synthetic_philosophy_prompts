prompt: |-
  I run an undergraduate reading group on the history of social thought, with about fourteen regulars, and we are about to spend several sessions on David Lewis's account of convention and the way arbitrary regularities harden into norms. Before I assign any reading, I want to run a session that lets students feel the phenomenon from the inside, so that when they later encounter Lewis's characterization of a convention — a regularity in a recurring situation in which everyone prefers to conform given that everyone else conforms, even though some alternative regularity would have served just as well — they recognize what they did rather than merely learning a definition. The room has movable chairs and a whiteboard, we have ninety minutes, and I am willing to use small real stakes, such as chocolate coins or a modest prize.

  Design a runnable activity with actual rules and payoffs, no front-loaded explanations, and no mention of Lewis or the word "convention" until the debrief. It should take students through three distinct situations. First, a repeated coordination problem with two equally good ways of succeeding, where only salience or precedent can break the symmetry, so they experience the arbitrariness of whatever solution emerges. Second, a situation in which a new and objectively somewhat better solution becomes available after the group has already settled into the old one, so they feel the real cost of abandoning precedent and can gauge how much improvement it takes to dislodge an established regularity. Third, a situation in which newcomers join who lack the shared history, so the insiders are tempted to teach, correct, and mildly punish the newcomers, and the group can watch a bare regularity begin to present itself as something one ought to do.

  Please supply exact instructions for each round, the payoff structure, what the facilitator should record on the board, and a debrief that maps specific moments in the game onto Lewis's conditions for a convention and onto the difference between a convention and a sanction-backed norm. Also say what predictably goes wrong when this is run with real students and how to handle it, and be explicit about what a one-off, self-aware classroom game cannot reproduce about the historical, unplanned emergence of conventions and what the facilitator will need to supply afterward.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 90-minute undergraduate reading group activity to experientially teach David Lewis's theory of convention *before* reading the text.
      *   **Audience:** ~14 undergraduates, history of social thought background.
      *   **Constraints:** No front-loaded explanations, no mention of Lewis/"convention" until debrief. Movable chairs, whiteboard available. Small stakes allowed (chocolate/prize).
      *   **Structure:** Three distinct situations (rounds):
          1.  Symmetric coordination (arbitrary solution via salience/precedent).
          2.  Path dependence (switching costs vs. improvement).
          3.  Norm emergence (insiders vs. newcomers, sanctioning).
      *   **Deliverables:** Exact instructions, payoff structure, facilitator recording, debrief mapping to Lewis, troubleshooting/predictable failures, limitations of the simulation.

  2.  **Deconstruct Lewis's Theory (Mental Check):**
      *   *Convention:* A regularity $R$ in a recurrent situation $S$.
      *   *Conditions:*
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform.
          3.  Everyone prefers to conform *if* others conform (coordination equilibrium).
          4.  There is an alternative regularity $R'$ that could have worked just as well (arbitrariness).
      *   *Normativity:* Lewis distinguishes convention from moral obligation, but notes that conventions often acquire normative force (oughtness) via expectations and sanctions.
      *   *Key Experience:* The feeling of "we do this because we do this" and the friction of changing it.

  3.  **Drafting the Activity - General Concept:**
      *   Need a simple coordination game. "Meeting place" is classic but hard to simulate in one room. "Hand signals" or "Choice of side" is better.
      *   Let's use a **Binary Choice Game** (Left/Right, Red/Blue, Stand/Sit).
      *   *Round 1:* Pure coordination. Match with partners to win.
      *   *Round 2:* Introduce a "better" option but make switching costly or risky.
      *   *Round 3:* Swap players to create "outsiders."

      *Refinement:* 14 students is a good size for a whole-group coordination problem, but pairing might be clearer for payoffs. However, Lewis emphasizes *population-wide* regularities. Let's make it a whole-room choice.
      *   *Mechanism:* Students choose between Option A and Option B.
      *   *Win Condition:* You get points if you match the majority (or a specific partner).
      *   *Lewis's specific point:* It's not just matching the majority; it's matching *expectations*.
      *   *Better Mechanism:* Pair them up? No, 14 is even, but pairing isolates the dyad. Lewis talks about social conventions. Let's keep it as one group trying to coordinate on a single signal or action.
      *   *Idea:* "The Silent Signal." In each round, everyone must simultaneously make a choice. If the group achieves a specific coordination target, everyone wins points.
      *   *Problem:* If the target is "Everyone chooses Left," that's easy to state. The trick is *not* stating the target.
      *   *Revised Mechanism:* Divide the room into two teams? No.
      *   *Best Mechanism:* **The "Meeting Point" Simulation.**
      *   Actually, let's look at the three specific requirements again.
      *   1. Symmetric coordination (Arbitrary solution).
      *   2. Path dependence (Sticky precedent).
      *   3. Normativity (Sanctioning newcomers).

      *Let's try a "Number Choice" game.*
      *   Round 1: Pick a number 1-10. If everyone picks the same number, everyone gets $1. (Too hard).
      *   If *most* people pick the same number, those people get $1. (Encourages flocking).
      *   Let's go with **Left Hand / Right Hand** raise. It's binary, visible, and immediate.

      *Round 1 (Symmetry):* Two options (Left/Right). Payoff if you match the majority. Both options pay the same.
      *   *Risk:* They might split 7-7. Need a tie-breaker or repeated rounds. Let's do 5 rapid rounds.
      *   *Round 2 (Path Dependence):* They have settled on (say) Left. Now, Right is worth *more*, but only if *everyone* switches. Or, Right is worth more, but if you switch alone you lose.
      *   *Round 3 (Norms/Newcomers):* Swap 3-4 students out for "new" students (or just instruct a subset to play differently). The majority must enforce the old rule.

      *Wait, the prompt asks for "newcomers join."* I can't actually swap students easily without disrupting the flow. I can designate 3 students as "New" secretly or openly? If openly, they know they are new. If secretly, the others don't know who to sanction.
      *   *Better:* Keep the group same, but introduce a "mutation" instruction to 3 students before Round 3 starts (while others wait outside or just pass notes).
      *   *Actually, simplest:* Just have 3 students volunteer to be "confused" or play randomly. Or, better yet, the prompt says "newcomers join." I can ask 3 students to step out, then bring in 3 *other* students from outside the reading group? No, that's logistically hard.
      *   *Workaround:* Ask 3 regulars to step out for 2 minutes. While they are gone, instruct the remaining 11 on a *new* rule. Then bring the 3 back. The 3 are now "outsiders" to the new rule, or vice versa.
      *   *Wait, the prompt says:* "newcomers join who lack the shared history."
      *   *Idea:* In Round 3, 3 students from the back (who haven't been playing? No, all 14 are regulars).
      *   *Solution:* I will instruct the facilitator to ask 3 students to step into the hallway for 2 minutes during the break between Round 2 and 3. The remaining 11 are instructed to coordinate on a *new* arbitrary signal (e.g., tapping the desk instead of raising hands). When the 3 return, they will try to play the old game. The 11 must enforce the new one.
      *   *Wait, that makes the 11 the insiders and the 3 the outsiders.* This works.

  4.  **Developing the Payoff Structure:**
      *   Need tangible stakes. Chocolate coins.
      *   Round 1: 1 coin per successful round.
      *   Round 2: 2 coins for the "better" option, 1 coin for the "old" option. But switching risk?
      *   Round 3: Sanctioning. If an outsider deviates, insiders lose points unless they "sanction" (vote them out?).
      *   *Refinement on Payoffs:* Keep it simple.
      *   *Goal:* Coordinate on a single action.
      *   *Action:* Raise Left Hand, Raise Right Hand, or Stand/Sit. Let's use **Hand Raise (Left vs Right)**.
      *   *Success:* If 80%+ of the room does the same thing, everyone who did that thing gets a coin.
      *   *Round 2:* Right Hand is now worth 2 coins. Left is 1 coin. But if you choose Right and <80% do, you get 0.
      *   *Round 3:* The "Insiders" (11 students) are told: "You get 2 coins if you all do Action X. If anyone does Action Y, you get 0 unless you identify them." The "Outsiders" (3 students) are told: "Just do what you did in Round 1."

      *Critique:* This is getting complicated to explain without breaking the "no front-load" rule.
      *   *Simpler Approach:* **The "Silent Count" Game.**
      *   Everyone writes a number.
      *   No, needs to be visible for "sanctioning."
      *   Let's go with **Seating Arrangement**.
      *   Room has movable chairs.
      *   Round 1: "Arrange the chairs to win." (Too vague).
      *   Let's stick to **Hand Signals** but refine the payoffs.

      *Revised Plan:*
      *   **Game:** "The Signal."
      *   **Action:** Simultaneous display of a colored card (Red/Blue) or Hand (Left/Right). Let's use **Red/Blue Cards** (easier to see). If no cards, **Left/Right Hand**. Let's assume no props other than chairs/whiteboard. **Left/Right Hand** is best.
      *   **Payoff:** Chocolate coins distributed by facilitator.

      *Round 1 (Arbitrariness):* 5 rounds. If >75% show the same hand, everyone gets 1 coin. (Don't tell them which hand).
      *   *Expected Outcome:* They will flail Round 1, then lock onto one (say, Right) via salience (most people are right-handed).
      *   *Facilitator:* Record the % on board.

      *Round 2 (Path Dependence):* 5 rounds. Rule change: "Left Hand is now worth 2 coins. Right Hand is worth 1 coin." *Crucial:* If <75% match, *no one* gets paid.
      *   *Expected Outcome:* They are stuck on Right. Switching to Left is risky. They might stay on Right (1 coin) because it's safe, or fail trying to switch to Left. This demonstrates the cost of moving off an equilibrium.

      *Round 3 (Norms/Outsiders):*
      *   Send 3 students out.
      *   Tell remaining 11: "The rule is now **Standing Up**. If everyone stands, you get 2 coins. If anyone sits, the sitters get 0, and the standers get 0 *unless* the standers unanimously point at the sitter." (This introduces sanctioning).
      *   Tell the 3 outsiders: "Play the game as you did in Round 1 (Hand Raise)."
      *   Bring 3 back.
      *   Run 3 rounds.
      *   *Expected Outcome:* Insiders stand. Outsiders raise hands. Insiders get frustrated. Insiders point/sanction. Outsiders feel pressure.

  5.  **Refining the Instructions (The "Script"):**
      *   Must be crisp. No theory.
      *   Facilitator needs to be a "Banker/Referee."
      *   Whiteboard usage: Track "Chosen Action" and "Payout."

  6.  **Addressing the "Predictably Goes Wrong" Section:**
      *   Students might talk. (Rule: No talking during the choice).
      *   Students might laugh/treat it as a joke. (Facilitator must be stern on payoffs).
      *   Round 2 might succeed too easily. (Need to emphasize the risk).
      *   Round 3 might turn mean. (Need to monitor "sanctioning").
      *   The "Outsiders" might figure it out too fast. (Instructions must be clear).

  7.  **Addressing the "Limitations" Section:**
      *   This is a game, not real life. Stakes are low.
      *   Lewis talks about *recurrent* situations over time. This is compressed.
      *   Lewis talks about *common knowledge*. In the game, the facilitator announces rules. In reality, rules emerge.
      *   Need to explain in debrief that the *feeling* is the target, not the perfect simulation.

  8.  **Drafting the Debrief:**
      *   Map Round 1 to Lewis's "Arbitrariness" and "Common Knowledge."
      *   Map Round 2 to "Path Dependence" and "Preference to Conform."
      *   Map Round 3 to "Normativity" and "Sanctions."
      *   Connect to "Ought."

  9.  **Review against Constraints:**
      *   90 minutes? Yes (15 intro/setup, 45 game, 30 debrief).
      *   14 students? Yes.
      *   No Lewis mention? Yes.
      *   Three distinct situations? Yes.
      *   Payoffs? Yes (Chocolate).
      *   Troubleshooting? Yes.

  10. **Final Polish:**
      *   Make sure the Round 3 instruction to the "Insiders" allows them to punish.
      *   Ensure the "Outsiders" aren't humiliated.
      *   Clarify the "No Talking" rule during the choice phase (crucial for coordination problems).

      *(Self-Correction on Round 3)*: If I send 3 students out, the remaining 11 know something is up. I need to make sure the 11 don't just laugh. I need to give them a role: "You are the Committee."
      *   Actually, a smoother way: Don't send them out. Just hand notes to 3 students under the table? No, too sneaky.
      *   Sending them out is more dramatic and clear. "We need to adjust the rules for the next round, please step out."
      *   Instruction to Insiders: "Your goal is to Stand. If anyone Sits, you lose your payout. However, if you all agree on who sat, you still get paid, and they don't." (This creates the sanction mechanism).
      *   Instruction to Outsiders: "Ignore the new instructions. Continue doing what worked in Round 1."

      *Wait, one nuance:* Lewis says conventions *become* norms. Round 3 should show the transition.
      *   Okay, let's finalize the structure.

      *Time Check:*
      *   Intro/Setup: 10 mins.
      *   Round 1: 15 mins (5 rounds + settling).
      *   Round 2: 20 mins (5 rounds + struggle).
      *   Round 3 Setup (sending students out): 5 mins.
      *   Round 3 Play: 15 mins.
      *   Debrief: 30 mins.
      *   Total: 95 mins. A bit tight. I'll compress the rounds to 3 rounds each.

      *Payoff:* Chocolate coins are good. Let's say 1 coin = $0.50 value. Total budget ~ $20.

      *Whiteboard:* Keep a tally of "Winning Action" and "Total Payout."

      *Let's write it.*
answer: |-
  # Activity Design: "The Signal"
  **Objective:** To simulate the emergence, stickiness, and normativization of arbitrary regularities without using theoretical terminology.
  **Time:** 90 Minutes
  **Participants:** 14 Undergraduates
  **Materials:** Whiteboard + markers, 50 chocolate coins (or equivalent small tokens), 3 slips of paper for Round 3.
  **Room Setup:** Chairs arranged in a loose circle or semi-circle where everyone can see everyone's hands/upper bodies.

  ---

  ## Part 1: Facilitator Script & Rules (0:00 – 0:10)

  **Facilitator Stance:** Act as a neutral "Banker" or "Referee." Be brisk, slightly bureaucratic, and do not explain *why* the rules exist. Do not use words like "convention," "norm," "coordination," or "Lewis."

  **Opening Statement:**
  "Welcome. For the next hour, we are going to run a series of decision rounds. The goal is simple: maximize your individual payout in chocolate coins.
  There are three constraints:
  1. **No talking** during the decision phase.
  2. Decisions are **simultaneous**. I will count down '3, 2, 1, Show.'
  3. You must commit to your choice visibly.

  We will use hand signals. **Left Hand** or **Right Hand**.
  In each round, I will announce a **Threshold Rule**. If the group meets the threshold, payouts are distributed. If not, no one gets paid for that round.

  Any questions on the procedure? No? Let's begin."

  ---

  ## Part 2: The Three Situations (0:10 – 0:55)

  ### Situation 1: Symmetric Coordination (The Arbitrary Equilibrium)
  **Goal:** Experience the emergence of a solution where either option works, but only one is chosen.

  *   **Instructions:** "Round 1 consists of 5 sub-rounds.
      *   **Rule:** If **75% or more** of the room shows the *same* hand (all Left or all Right), everyone who showed that hand receives **1 coin**.
      *   If the split is 74% or less, **no one** gets paid.
      *   There is no preference for Left or Right. Only matching matters."

  *   **Facilitator Action:**
      *   Run 5 rapid sub-rounds.
      *   **Whiteboard:** Record the % of the Majority Hand and the Payout per person.
      *   *Expected Dynamic:* Round 1 will likely fail (chaos). Round 2-3 will converge on one side (usually Right, due to right-handedness salience). Rounds 4-5 will lock in.
      *   *Note:* If they split 50/50 twice, pause and say, "Remember, you only get paid if the group coordinates. You have 3 rounds left."

  ### Situation 2: Path Dependence (The Cost of Switching)
  **Goal:** Experience the friction of moving from an established regularity to a superior alternative.

  *   **Instructions:** "Round 2 consists of 5 sub-rounds.
      *   **Rule Change:** The payout structure has changed.
      *   If the majority matches on **Left Hand**: **2 coins** per person.
      *   If the majority matches on **Right Hand**: **1 coin** per person.
      *   **Threshold:** Still requires **75%** agreement on the *same* hand. If the threshold is not met, **0 coins** for everyone."

  *   **Facilitator Action:**
      *   Run 5 sub-rounds.
      *   **Whiteboard:** Record the Chosen Hand and Payout.
      *   *Expected Dynamic:* The group settled on Right in Situation 1. Now Left is worth more. However, switching is risky. If one person stays Right while others switch to Left, the threshold fails and *everyone* loses.
      *   *Observation:* Watch if they stay on Right (safe 1 coin) or struggle to switch to Left. If they stay on Right, point out on the board: "You are earning less than possible." If they try to switch and fail, highlight the loss.

  ### Situation 3: Normativity & Outsiders (Sanctioning)
  **Goal:** Experience the transition from "we do this" to "you *ought* to do this" via the introduction of outsiders.

  *   **Setup (5 Minutes):**
      *   Ask 3 students to volunteer to step into the hallway for 2 minutes. (Select students who are engaged but not the ringleaders).
      *   **To the 11 Insiders (in room):** "The rules have changed fundamentally. The only winning move is now **Standing Up**.
          *   If 100% of the *Insiders* Stand, you get **2 coins**.
          *   If anyone Sits, the group gets **0 coins**, UNLESS the Insiders unanimously point to the person who Sat. If you unanimously identify the deviator, the Insiders get **2 coins**, and the deviator gets **0** and is publicly noted on the board."
      *   **To the 3 Outsiders (in hallway):** Hand them a slip of paper. "When you return, ignore any new instructions. Continue playing the game exactly as you did in Situation 1 (Hand Signals). Do not stand unless you see everyone else doing it. Your goal is to follow the original rules."

  *   **Instructions (to whole group upon return):** "Round 3 consists of 3 sub-rounds.
      *   **Rule:** Maximize your payout. Simultaneous action. 3, 2, 1, Show."

  *   **Facilitator Action:**
      *   Run 3 sub-rounds.
      *   **Whiteboard:** Record Actions of Insiders vs. Outsiders. Record any "Sanctions" (pointing).
      *   *Expected Dynamic:* Insiders will Stand. Outsiders will raise Hands (or Sit, depending on how they interpret 'original rules'—if they raise hands while sitting, it creates visual noise). The Insiders will realize the Outsiders are breaking the 'Stand' rule. Insiders will likely glare, whisper, or point. Outsiders will feel confusion and social pressure.
      *   *Crucial:* If Insiders sanction (point), award the coins. This validates the punishment mechanism.

  ---

  ## Part 3: The Debrief (0:55 – 1:30)

  **Transition:** "Stop the game. Please take your seats. You may now talk. You may also eat your winnings."

  **Phase 1: Phenomenology (10 mins)**
  *   Ask the room: "In Situation 1, why did you choose [Right/Left]?" (Expect: "Everyone else did," "It seemed obvious.")
  *   Ask: "In Situation 2, why did you [stick with Right / fail to switch]?" (Expect: "Too risky," "Didn't trust others to switch.")
  *   Ask the 3 Outsiders: "How did it feel in Situation 3 when everyone stood up?" (Expect: "Confusing," "Felt like I was doing it wrong," "Felt pressure.")
  *   Ask the Insiders: "Why did you point/sanction?" (Expect: "They were ruining it for us," "They needed to learn the rule.")

  **Phase 2: Mapping to Lewis (15 mins)**
  *   *Write "LEWIS'S CONDITIONS" on the board.*
  *   **Regularity:** "In Situation 1, you developed a regularity (e.g., Raise Right). Was it because Right is inherently better than Left?" (No. It was **arbitrary**.)
  *   **Conditional Preference:** "Why did you keep raising Right?" (Because I prefer to match you *if* you match me.)
  *   **Common Knowledge:** "How did you know to raise Right?" (Because we saw we did it last time. This is **precedent**.)
  *   **The 'Ought':** "In Situation 3, the Insiders didn't just *expect* the Outsiders to Stand; they felt the Outsiders *should* Stand. When did 'is' become 'ought'?"
      *   *Key Point:* The 'ought' emerged when the regularity became necessary to protect the group's payoff against deviation. The sanction (pointing) turned a habit into a norm.

  **Phase 3: Limitations & Reality (5 mins)**
  *   **Facilitator Note:** Be explicit about what the game *failed* to do.
  *   "This game was compressed. In history, conventions take generations to harden."
  *   "I, the facilitator, announced the rules. In reality, there is no Banker. Rules emerge from chaos without a referee."
  *   "The stakes were chocolate. Real stakes are social exclusion, economic loss, or violence."
  *   "You knew this was a game. In real life, we often don't realize we are following a convention until it is challenged."

  ---

  ## Part 4: Troubleshooting & Predictable Failures

  **1. The "Talkers" Problem**
  *   *Risk:* Students talk during the decision phase, solving the coordination instantly.
  *   *Fix:* Enforce the "No Talking" rule strictly. If they talk, void the round. "Communication is costly in the real world; here it is forbidden." This forces them to rely on *salience* and *precedent*, which is the point.

  **2. The "Round 2 Success" Problem**
  *   *Risk:* They switch to the higher payoff (Left) instantly in Situation 2.
  *   *Fix:* This undermines the lesson on path dependence. If this happens, highlight it in debrief: "You were lucky. Usually, trust is lower. Imagine if one person had a grudge and stayed Right. You would have lost everything." Emphasize the *risk* they took.

  **3. The "Mean Outsider" Problem**
  *   *Risk:* Insiders humiliate the 3 Outsiders in Round 3.
  *   *Fix:* Monitor the "sanctioning." If it gets personal, intervene: "Sanctions must be about the action, not the person." In debrief, acknowledge this: "Real norms can be cruel. Lewis describes the logic, not the morality."

  **4. The "Cynic" Problem**
  *   *Risk:* A student refuses to play or tries to "break" the game intentionally.
  *   *Fix:* Do not engage in a power struggle. Note on the board: "One agent defected." Continue with the rest. In debrief, use them as the prime example of what happens when common knowledge breaks down.

  ---

  ## Part 5: What This Simulation Cannot Reproduce

  *Explicitly state this in the debrief to prevent oversimplification.*

  1.  **Historical Time:** Lewis's conventions evolve over decades. This happened in 40 minutes. The "weight" of history is simulated, not felt.
  2.  **Unplanned Emergence:** You knew there was a Facilitator setting rules. Real social conventions often have no author. They are "self-policing" in a way this game was not (since I enforced the payouts).
  3.  **Complexity:** Real conventions are layered (language, dress, law). This was binary (Left/Right).
  4.  **The "Common Knowledge" Loop:** In the game, I told you the threshold. In reality, I don't *know* that you *know* that I *know* the rule. We infer it. The game made the payoffs common knowledge; real life makes them a matter of belief.

  **Closing Instruction for Reading:**
  "When you read Lewis this week, look for where he describes the 'expectations of expectations.' Recall how you felt in Round 2 looking at your neighbor's hand, wondering if they would trust you to switch. That feeling is the engine of his theory."
