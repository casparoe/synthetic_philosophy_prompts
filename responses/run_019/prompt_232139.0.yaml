  (1) Lakatos's relevant commitments
  Lakatos's Methodology of Scientific Research Programmes posits that science progresses not through isolated theories but through sequences of theories sharing a common foundation. The central unit of appraisal is the research programme, composed of an irrefutable hard core and a flexible protective belt of auxiliary hypotheses. Progress is defined dynamically: a programme is progressive if it predicts novel facts corroborated by evidence, whereas it degenerates if it merely offers post-hoc explanations for anomalies without new predictive content. Crucially, Lakatos rejects naive falsificationism, arguing that no single experiment can refute a hard core, as inconsistencies are always absorbed by adjusting the protective belt.

  (2) Predicted assessment
  Applied to the replication crisis, Lakatos would likely verdict that many specific research programmes in psychology and biomedicine have entered a degenerating phase, but he would reject the notion that failed replications instantly invalidate the underlying fields. He would argue that treating a single failed replication as a refutation is a naive-falsificationist error, yet he would also criticize defenders who salvage core effects solely through ad hoc adjustments lacking novel predictions. His assessment would hinge on whether the field's response to the crisis generates new, corroborated knowledge or merely recycles explanations for past failures. He would view the reform movement itself as a competing meta-programme aiming to restore theoretical progressivity by tightening methodological standards.

  (3) Reasoning, concept by concept
  Regarding the status of failed replications, Lakatos would classify them as anomalies residing in the protective belt rather than fatal blows to the hard core. Under the negative heuristic, scientists are methodologically prohibited from directing modus tollens at the hard core; thus, a failed direct replication suggests errors in initial conditions, measurement, or auxiliary assumptions, not necessarily the falsity of the core theory. However, this protection is not indefinite. If a programme continuously absorbs failures by tweaking the belt without producing new successful predictions, it becomes degenerating. Therefore, a failed replication is legitimate grounds for suspicion only if the programme has already exhausted its progressive potential.

  Distinguishing between progressive problem-shifts and ad hoc stratagems depends on the timing and content of the defense. If researchers argue that a non-replicating effect depends on specific moderators, Lakatos would deem this ad hoc if the moderator was identified only after the failure occurred and explains nothing else. Conversely, if the existence of the moderator was predicted by the positive heuristic before the replication attempt, or if positing the moderator leads to the discovery of further novel facts, the shift is progressive. The key distinction is whether the revision expands the programme's empirical content or merely shields it from refutation. For Lakatos, a theory that explains everything after the fact explains nothing; the defense must yield excess empirical content.

  Concerning reform practices, Lakatos would likely view pre-registration as a tool to enforce the positive heuristic, ensuring that predictions precede evidence and reducing ad hocery. He would criticize the dogmatic use of direct replication as a refutation device as naive falsificationism, ignoring the theory-laden nature of observation. Meta-analysis might be seen as a useful audit of empirical progressiveness, provided it does not simply aggregate degenerating results. Ultimately, he would champion practices that facilitate the prediction of novel facts over those that merely police consistency, viewing the crisis as an opportunity to replace degenerating programmes with more robust ones rather than abandoning the scientific enterprise. He would warn that without a strong positive heuristic, methodological rigor alone cannot generate progress.

  (4) Limits of the prediction
  The primary limit of this prediction is that Lakatos's framework is historically retrospective; determining whether a programme is degenerating often requires hindsight unavailable during the crisis. Furthermore, his framework underdetermines the status of social science hard cores, which may be too vague to generate strict positive heuristics. An alternative reading suggests Lakatos might view the entire crisis as evidence that these fields lack genuine research programmes altogether, operating instead with loose collections of hypotheses that cannot be meaningfully assessed by his criteria of progressivity.
