prompt: |-
  I'm a novelist, and moral worth is basically my professional obsession — I'm constantly deciding whether what a character did was admirable, and I've noticed I keep reaching for a set of working assumptions that might not actually cohere. Can you audit them? Here they are:

  1. Whether something has moral worth depends on why the person did it, not on whether it turned out well or even on whether it was the right thing to do.
  2. The people I most admire, on the page and off, act from immediate unreflective compassion — they jump in the river before there's been time to think. Visible deliberation about what one ought to do is, if anything, a bad sign about a person's character.
  3. Moral worth can't be a matter of luck: two people who would behave identically in every possible situation, differing only in which feelings happen to well up in them, deserve the same moral grade.
  4. Impure motives don't ruin anything. Almost nobody's motives are spotless, and if some vanity or self-interest rides along with the good motive, the act still counts as admirable.
  5. The way to find out what actually moved someone is counterfactual: take away the audience, the good mood, the crush, and ask whether they still would have done it.

  Tell me which of these are genuinely in tension and roughly how severe each tension is, which pairs only look like they're in tension but aren't, and for the real ones what the cheapest fix would be and what it costs me. This matters alot for the book I'm drafting, but I don't want a lecture on the history of ethics — just the audit.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **User:** Novelist obsessed with moral worth in character development.
      *   **Task:** Audit a set of 5 working assumptions about moral worth.
      *   **Specific Requirements:** Identify genuine tensions (and severity), identify apparent tensions that aren't real, suggest cheapest fixes for real tensions, and explain the cost of those fixes.
      *   **Constraint:** No lecture on the history of ethics. Keep it practical for drafting.

  2.  **Analyze the Assumptions:**
      *   *Assumption 1 (Motivism/Intent):* Moral worth depends on *why*, not outcomes or objective rightness. (Kantian/Internalist leanings).
      *   *Assumption 2 (Spontaneity):* Admiration goes to unreflective compassion. Deliberation is a bad sign. (Sentimentalist/Intuitionist leanings).
      *   *Assumption 3 (Anti-Luck/Control):* Moral worth can't be luck. Identical behavioral dispositions + different feelings = same moral grade. (Control Principle/Stoic leanings).
      *   *Assumption 4 (Impurity):* Mixed motives are okay. Vanity/self-interest doesn't ruin admirability. (Humanist/Realist leanings).
      *   *Assumption 5 (Counterfactual Test):* To find the *real* motive, strip away external rewards/feelings. (Subjunctive Test).

  3.  **Evaluate Pairwise Tensions:**

      *   **1 vs. 2 (Intent vs. Spontaneity):**
          *   1 says "why" matters. 2 says "unreflective" is best.
          *   *Tension:* If I deliberate, do I lose moral worth? 1 allows for *any* motive (as long as it's the *why*), but 2 specifically privileges *one kind* of why (immediate compassion) and penalizes another (deliberation).
          *   *Severity:* Moderate. Many people believe duty (deliberation) is good, but 2 says it's a "bad sign."
          *   *Resolution:* 2 is a subset of 1. But 2 makes a strong claim against deliberation that 1 doesn't necessitate.

      *   **2 vs. 3 (Spontaneity vs. Anti-Luck):**
          *   2 says jumping without thinking is best. 3 says if two people act identically but feel differently, they get the same grade.
          *   *Tension:* Person A jumps out of instinctive compassion (2 says: Admirable!). Person B jumps because they calculated it was the right thing but felt no compassion (2 says: Bad sign/less admirable). But 3 says if they behave identically in *every possible situation* (dispositionally identical), they deserve the *same grade*.
          *   *Wait, look closer at 3:* "differing only in which feelings happen to well up in them."
          *   If Person A feels compassion and Person B feels cold duty, 2 says A is better. 3 says they are equal (if behavior is identical across all situations).
          *   *Severity:* **High.** This is a direct contradiction. 2 judges based on the *quality of the feeling* (compassion > deliberation). 3 judges based on *behavioral disposition* regardless of feeling.
          *   *Fix:* Either downgrade deliberation (keep 2, modify 3) or equalize motives (keep 3, modify 2).

      *   **2 vs. 4 (Spontaneity vs. Impurity):**
          *   2 says pure unreflective compassion is best. 4 says impure motives (vanity) are fine.
          *   *Tension:* If I jump in the river to save a kid *and* look like a hero (vanity), 4 says "still admirable." 2 says "unreflective compassion" is what is admired. Does vanity count as reflection? Usually yes.
          *   *Severity:* Low/Moderate. 4 allows mixed motives, 2 prefers a specific motive. They can coexist if 2 is read as "ideal" and 4 as "minimum threshold." But 2 says deliberation is a "bad sign," implying a penalty. 4 says impurity doesn't "ruin anything."
          *   *Nuance:* 2 focuses on *speed/process* (unreflective). 4 focuses on *content* (vanity). You can have unreflective vanity. So maybe no tension?
          *   *Re-evaluation:* If I jump unreflectively *because* I want applause, 2 might like the speed but hate the motive. 4 says the motive doesn't ruin it. This is manageable.

      *   **3 vs. 5 (Anti-Luck vs. Counterfactual):**
          *   3 says feelings don't change the grade if behavior is identical. 5 says to find the motive, strip away feelings/mood.
          *   *Tension:* 5 implies the *source* of the action (mood vs. character) matters for moral worth. 3 implies that if the behavioral output is robust across situations, the internal feeling doesn't change the grade.
          *   *Severity:* Low. 5 is a diagnostic tool for 3. 5 helps determine if the behavior in 3 is truly dispositional or just situational luck.

      *   **1 vs. 5 (Intent vs. Counterfactual):**
          *   1 says worth depends on *why*. 5 is the test to find the *why*.
          *   *Tension:* None. They are complementary.

      *   **4 vs. 5 (Impurity vs. Counterfactual):**
          *   4 says vanity doesn't ruin it. 5 says strip away the "audience" (vanity trigger) to see if they'd still do it.
          *   *Tension:* If 5 reveals they *wouldn't* do it without the audience, 4 says "mixed motives are okay," but 5 implies "if the vanity is the *cause*, it's not the real motive."
          *   *Severity:* Moderate. 4 is forgiving of mixed motives. 5 is a rigorous test of *primary* motive. If the vanity is the *driver*, 5 exposes it. 4 says that's fine. 1 says the "why" matters. If the "why" is vanity, 1+5 says "that's the worth." 4 says "that's still admirable."
          *   *Conflict:* Is an act done *primarily* for vanity admirable? 4 says yes (if mixed). 1+5 implies if the *real* why is vanity, that's the moral worth (which is usually low).
          *   *Severity:* High. 4 claims vanity-laden acts are admirable. 1+5 claims the moral worth is determined by that vanity (which is typically not admirable).

  4.  **Synthesize and Structure the Audit:**

      *   **Group 1: The "Fatal" Clash (2 vs. 3).** This is the biggest philosophical problem. Spontaneity/Feeling vs. Disposition/Control.
      *   **Group 2: The "Definition of Admiration" Clash (1+5 vs. 4).** If the "why" determines worth (1), and the test reveals vanity (5), can it still be admirable (4)?
      *   **Group 3: The "Process" Tension (1 vs. 2).** Intent vs. Deliberation.
      *   **Group 4: Harmonious Pairs.** 1+5, 3+5.

  5.  **Drafting the Fixes:**
      *   *Fix for 2 vs. 3:* Either admit feelings matter (drop 3's strictness) or admit deliberation is fine (drop 2's strictness).
      *   *Fix for 1+5 vs. 4:* Distinguish between "admirable act" and "admirable character." Or clarify that vanity must be secondary, not primary.

  6.  **Refining the Output:**
      *   Keep it sharp. Use the user's "audit" framing.
      *   Avoid academic jargon (Kant, Utilitarianism, etc.) unless necessary for shorthand, but the prompt says "no lecture."
      *   Focus on *character drafting* implications.

  7.  **Self-Correction/Review during drafting:**
      *   *Check Assumption 3 again:* "Two people who would behave identically in every possible situation, differing only in which feelings happen to well up in them, deserve the same moral grade."
      *   *Check Assumption 2:* "Visible deliberation... is a bad sign."
      *   *Conflict:* Person A feels compassion (no deliberation). Person B feels nothing but deliberates (bad sign per #2). But #3 says if they behave identically in *every* situation, they get the same grade.
      *   *Wait:* If Person B *always* deliberates, their behavioral disposition might look identical to Person A who *always* feels compassion. But #2 penalizes the *process* (deliberation), while #3 rewards the *outcome consistency* regardless of process/feeling.
      *   *Verdict:* This is the core tension. #2 values the *phenomenology* of the agent. #3 values the *reliability* of the agent.
      *   *Fix:* Choose: Do you value the *heart* (2) or the *habit* (3)?

      *   *Check Assumption 4 vs 1/5:*
      *   #1: Worth depends on *why*.
      *   #5: Test the *why* by removing vanity.
      *   #4: Vanity doesn't ruin it.
      *   *Conflict:* If #5 reveals the *primary* why was vanity, #1 says "low moral worth." #4 says "still admirable."
      *   *Fix:* #4 needs a caveat. Vanity is okay as a *passenger*, not the *driver*.

  8.  **Final Polish:** Organize by "Severe Tensions," "Manageable Tensions," and "False Alarms." Provide the "Cheapest Fix" and "Cost" for the severe ones. (Proceed to generate output).

      *   *Wait, one more check on 3:* "differing only in which feelings happen to well up in them." This implies the *action* is the same.
      *   *One more check on 2:* "Visible deliberation... is a bad sign."
      *   *Tension:* If I deliberate, I am less admirable (2). If I behave the same as someone who didn't deliberate, I am equally admirable (3).
      *   *Yes, definitely a clash.*

      *   *Check 1 vs 4:* 1 says "why" matters. 4 says "impure why" is okay.
      *   *Tension:* If the "why" is 90% vanity, is it admirable? 4 says yes. 1 implies the "why" sets the worth. If vanity = low worth, then 4 contradicts 1.
      *   *Resolution:* 4 implies vanity doesn't *negate* the good motive. It doesn't say vanity *is* the good motive. So 1+4 work if the good motive is present. 5 tests if the good motive is present. So 1+4+5 work *if* vanity is secondary. If vanity is primary, 4 breaks.

      *   *Okay, ready to write.*
answer: |-
  Here is the audit of your five assumptions. I have categorized them by severity of conflict, focusing on how they impact character consistency and reader perception.

  ### 1. The Fatal Clash: Assumption 2 vs. Assumption 3
  **Severity: Critical**

  *   **The Conflict:** Assumption 2 values the *phenomenology* of the act (how it feels to the agent: unreflective compassion is good, deliberation is bad). Assumption 3 values the *reliability* of the act (behavioral output across situations), explicitly disregarding the feelings ("differing only in which feelings... deserve the same moral grade").
  *   **The Scenario:** Character A saves a child out of instinctive love (no deliberation). Character B saves a child out of cold duty (visible deliberation, no love).
      *   Per **#2**, A is admirable; B is suspect ("bad sign").
      *   Per **#3**, A and B are morally equal (identical behavior in all situations).
  *   **Why it breaks your draft:** You will write a character who does the right thing consistently (satisfying #3) but thinks about it first (violating #2). You won't know if the reader should admire them or distrust them.

  **Cheapest Fix:** Modify **#2**.
  *   **Change:** "Visible deliberation is a bad sign" $\rightarrow$ "Visible deliberation *about self-interest* is a bad sign; deliberation about duty is neutral."
  *   **Cost:** You lose the romantic ideal of the "holy fool" who is good without trying. Your characters become slightly more human and less angelic, which may reduce their mythic resonance but increase their psychological realism.

  **Alternative Fix:** Modify **#3**.
  *   **Change:** "Differing only in which feelings" $\rightarrow$ "Differing only in *external* luck." (Make internal feelings part of the moral grade).
  *   **Cost:** You lose the "Control Principle." You must admit that a grumpy person who forces themselves to be kind is *less* admirable than a kind person who enjoys it, even if the outcome is identical.

  ### 2. The Motivational Clash: Assumption 1 + 5 vs. Assumption 4
  **Severity: High**

  *   **The Conflict:** Assumption 1 says moral worth is determined by the *why*. Assumption 5 is the test to isolate the *why* (strip away the vanity/audience). Assumption 4 says if vanity is present, the act is *still admirable*.
  *   **The Scenario:** A character donates to charity. Assumption 5 strips away the audience, and the character *would not have donated*.
      *   Per **#1 & #5**, the "real why" was vanity. Therefore, the moral worth is low (vanity is not a moral virtue).
      *   Per **#4**, the act is still admirable because "impure motives don't ruin anything."
  *   **Why it breaks your draft:** You risk creating characters who are essentially vain but whom you narratively frame as admirable. Readers may sense the dissonance: "You're telling me this is noble, but your own test proves they only did it for clout."

  **Cheapest Fix:** Qualify **#4**.
  *   **Change:** "Impure motives don't ruin anything" $\rightarrow$ "Impure motives don't ruin anything *provided a genuine moral motive is also present and sufficient.*"
  *   **Cost:** You lose the ability to defend the "accidental good guy." If the vanity is the *driver* (revealed by #5), the act is no longer admirable. You have to be stricter about distinguishing "mixed motives" from "masked selfishness."

  ### 3. The Process Tension: Assumption 1 vs. Assumption 2
  **Severity: Moderate**

  *   **The Conflict:** Assumption 1 says worth depends on the *why*. Assumption 2 privileges a specific *process* (unreflective) over a specific *why* (duty).
  *   **The Nuance:** One can deliberate (process) out of compassion (why). One can act instantly (process) out of vanity (why).
  *   **Why it's manageable:** These operate on different axes (Speed vs. Content). However, #2 implies that *any* deliberation suggests a lack of compassionate motive.
  *   **Fix:** Ensure your "deliberating" characters are deliberating about *how* to help, not *whether* to help. If they deliberate on *whether* to help, #2 penalizes them regardless of #1.

  ### 4. False Alarms (No Real Tension)

  *   **Assumption 1 + 5:** These are perfectly coherent. #1 sets the rule (motives matter), #5 provides the diagnostic tool (counterfactuals). Keep this pairing; it's your strongest analytical engine.
  *   **Assumption 3 + 5:** These support each other. #5 tests if the behavior is robust across situations (luck vs. character), which is exactly what #3 demands.
  *   **Assumption 2 + 4:** These look tense (Purity vs. Impurity), but they aren't. #2 is about *speed/reflection*, #4 is about *content*. You can have unreflective vanity (jumping in the river to look like a hero). As long as you apply the fix to #4 above, these coexist fine.

  ### Summary Recommendation for Drafting

  To make your system coherent without rewriting your philosophy:

  1.  **Keep 1 and 5** as your core diagnostic. (Worth = Motive; Test = Counterfactual).
  2.  **Amend 4** to specify that vanity must be a *passenger*, not the *driver*. (If #5 reveals vanity is the driver, the act is not admirable).
  3.  **Amend 2** to target *self-interested* deliberation, not *moral* deliberation. (Allow characters to think about what is right without penalizing their worth).
  4.  **Align 3** with the amended #2. (If feelings don't matter, the *type* of motive shouldn't matter either, but since you are keeping Motive as king per #1, acknowledge that #3 applies only to *external* luck, not internal disposition).

  **The Cost:** You lose the "Saint vs. Stoic" equivalence. You have to admit that the person who *wants* to do good is morally distinct from the person who *forces* themselves to do good, even if they do the exact same things. For a novelist, this is usually a feature, not a bug—it gives you more texture for conflict.
