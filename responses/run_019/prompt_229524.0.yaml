answer: |-
  This is a sophisticated psychological setup because both characters are engaging in a performative contradiction: they enact a ritual of moral accounting while explicitly denying the metaphysical bank that would make the transaction valid.

  To reconstruct the implicit theory here, we have to strip away the religious baggage of "karma" and look at the **folk psychology of desert** they are actually operating on. They are not theologians; they are narrative theorists of their own lives.

  Here is the reconstruction of the load-bearing parts of their implicit theory, the window dressing you can discard, and the points of underdetermination where rival philosophies yield the same behavior.

  ### 1. The Load-Bearing Pillars (The Implicit Theory)
  These are the premises that *must* be true for their habits to make sense to them, even if they deny them aloud.

  **A. The Principle of Immanent Unraveling (Causality)**
  *   **The Theory:** Misfortune is not an external punishment sent by the universe; it is the statistical byproduct of the character flaw that caused the original wrong.
  *   **Why it's load-bearing:** If the politician's scandal was purely random bad luck (a lightning strike), the Sister's comment collapses. For her comment to hold, the misfortune must be *causally linked* to the vice. Arrogance leads to cutting corners; cutting corners leads to getting caught.
  *   **The Denial:** They deny the *intent* of the universe (it's not "settling accounts"), but they rely on the *mechanics* of the universe (vice creates vulnerability).

  **B. The Aesthetic of Proportionality (Recognition)**
  *   **The Theory:** The punishment doesn't have to be mathematically equal to the crime, but it must be *narratively resonant*.
  *   **Why it's load-bearing:** If the politician who committed fraud gets a flat tire, the Sister won't say "Karma." If he gets arrested for fraud, she will. The misfortune must mirror the moral category of the sin.
  *   **The Brother's Twist:** His ledger enforces this artificially. He *waits* for a misfortune that feels proportional. If a rival gets a cold, he doesn't check the box. If the rival gets fired, he does. He is curating the data to fit the aesthetic.

  **C. The Function of Closure (Psychological Utility)**
  *   **The Theory:** The universe is chaotic, but the self requires closure. The "checkmark" or the "shrug" is not a statement of fact, but a signal to the nervous system that a threat is neutralized.
  *   **Why it's load-bearing:** This explains why they can deny cosmic justice while acting like it exists. The belief isn't about *truth*; it's about *regulation*. The ledger allows the Brother to stop ruminating on the wrong. The Sister's comment allows her to stop worrying that *she* could be victimized without cause.

  ### 2. The Window Dressing (Discardable Elements)
  These are the elements they explicitly deny, and which you can safely treat as irrelevant to their actual psychology.

  *   **Cosmic Agency:** They do not need to believe a "force" is watching. In fact, their denial of it makes the theory more robust (modern, cynical).
  *   **Reincarnation/Long-term Arc:** They are focused on immediate, secular misfortunes (layoffs, scandals). The timeline is a single lifespan, preferably the current news cycle.
  *   **Moral Improvement:** Neither character suggests the wrongdoer *learns* from this. The suffering is the point, not the lesson. This is retributive, not restorative.

  ### 3. The Points of Underdetermination
  This is the most fertile ground for your novel. These are the places where two or three completely different philosophical theories produce the exact same dialogue and behavior. You can leave it ambiguous which one is "true" in your world, or have the characters drift between them.

  **A. Statistical Realism vs. Moral Fatalism**
  *   **Theory 1 (Realism):** People who do bad things take higher risks and alienate allies, increasing the statistical probability of a crash. (Scientific/Materialist).
  *   **Theory 2 (Fatalism):** A person capable of that wrong has a "rotten core" that inevitably draws disaster. (Essentialist).
  *   **The Convergence:** Both lead the Sister to say, "Karma's real."
  *   **The Novelistic Tension:** Does the Sister think the politician was *unlucky* to get caught (Realism), or *doomed* to get caught (Fatalism)? The Brother likely leans Fatalist (the person *is* the error); the Sister likely leans Realist (the behavior *created* the risk).

  **B. Vengeful Projection vs. Norm Enforcement**
  *   **Theory 1 (Projection):** The Brother keeps the ledger to soothe his own ego. He needs to feel superior to those who wronged him. The "justice" is a hallucination he induces in himself.
  *   **Theory 2 (Enforcement):** The Sister speaks publicly to reinforce social norms. By labeling the scandal "karma," she warns others not to break the rules.
  *   **The Convergence:** Both result in the public/private labeling of misfortune as "deserved."
  *   **The Novelistic Tension:** Is the Brother's ledger a diary of pain or a hit list of validation? Is the Sister's comment a genuine observation or a social tool to signal her own virtue?

  **C. The "Just World" Hypothesis vs. Irony**
  *   **Theory 1 (Just World):** Deep down, they *are* afraid the world is random. They invoke karma to protect themselves from the terror of chaos. (Psychological defense).
  *   **Theory 2 (Irony):** They know the world is random, and they are making a dark joke. "Karma's real" is said with a wink, acknowledging the absurdity of finding pattern in noise.
  *   **The Convergence:** Both result in the same shrug and the same checkmark.
  *   **The Novelistic Tension:** When the Brother checks a box, is he relieved (Theory 1) or cynical (Theory 2)? If he finds out the misfortune was actually unconnected to the person's actions (e.g., the rival who wronged him gets cancer), does he still check the box?
      *   *If yes:* He is a nihilist using the ledger as a coping mechanism.
      *   *If no:* He is a dogmatist who requires the causal link to be real.

  ### 4. Specific Reconstruction for Your Characters

  **The Brother: The Manual Mechanism**
  *   **Implicit Theory:** *Compensatory Justice.* Since the universe will not balance the scales, I must balance them cognitively.
  *   **The Load-Bearing Part:** The *act of recording*. The physical checkmark is the magic spell. It transforms a random event into a moral event.
  *   **The Contradiction:** He says he doesn't believe in cosmic justice, but his ledger proves he believes *someone* has to administer it, so it might as well be him. He is the god of his own small universe.
  *   **Underdetermination:** Is he healing, or is he marinating in resentment? The behavior is identical; the internal state is opposite.

  **The Sister: The Social Heuristic**
  *   **Implicit Theory:** *Behavioral Consequence.* "Karma" is just a shorthand for "personality is destiny."
  *   **The Load-Bearing Part:** The *public utterance*. It serves to align her with the moral majority.
  *   **The Contradiction:** She says "Universe doesn't settle accounts," but by calling it Karma, she implies the account *was* settled. She is using a metaphysical word to describe a sociological phenomenon.
  *   **Underdetermination:** Does she say it to comfort herself (safety) or to judge others (superiority)?

  ### 5. Summary of the "Karma" Metaphor Question
  You asked if the reflex requires a cosmic balancing mechanism. **No.**

  In your characters' usage, "Karma" is not a **mechanism**; it is a **classification tag**.
  *   **Mechanism:** "The universe pushed him off the cliff because he lied." (They deny this).
  *   **Classification:** "The event where he fell off the cliff belongs in the folder labeled 'Consequences of Lying'." (They accept this).

  The theory survives as pure metaphor *provided that* the metaphor satisfies a psychological need for order. The "load-bearing" part is not the truth of the claim, but the **utility of the claim**.

  **The Critical Flaw (Plot Potential):**
  The theory breaks if a "good" person suffers or a "bad" person thrives without consequence.
  *   **Brother's Failure Mode:** If someone who wronged him *succeeds*, does he tear out the page? Or does he keep the ledger open indefinitely, waiting for a debt that never comes?
  *   **Sister's Failure Mode:** If someone she dislikes escapes scandal, does she stop saying "Karma is real"? Or does she switch to "Their time will come" (kicking the can down the road to preserve the theory)?

  This gap—between the *need* for desert and the *reality* of randomness—is where the tension of your novel lives. They are trying to use a map of a moral world while walking through an amoral one.
