      *(Self-Correction)*: Make sure to address the "proportionality" question specifically. Does the bad thing have to match the crime? For the Brother, yes (ledger). For the Sister, maybe just *any* misfortune.

      *(Final Thought)*: The key insight is that for both characters, "Karma" is not an explanation of the *world*, but a regulation of the *self*.

