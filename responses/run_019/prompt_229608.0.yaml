prompt: |-
  In my third-year philosophy of mind module, I have been assigned to lead a fifty-minute section for first-years on eliminative materialism about beliefs and desires, and I would like to work from a proper teaching plan rather than simply deliver the view as an explanation. My instinct is that certain things have to be in place before the thesis can even be stated without sounding merely perverse: in particular, the claim that our ordinary mental vocabulary—belief, desire, intention—is itself a theory about unobservable posits rather than a neutral description of what is given. Is that really the load-bearing first step, and what should be placed after it: the general idea that a theory's posits can be abandoned wholesale once a better theory arrives, or something else? And what should actually carry the hour? I am unsure whether to use a single worked example from the history of science, such as the abandonment of phlogiston or caloric fluid, or an example drawn from the students' own mental talk; whichever I choose, I would want to know what the carrying example must have and must not have if it is not to overstate the eliminativist's claim.

  I am equally worried about the misconceptions that will predictably form: that eliminativists think people are literally empty-headed, that the position is self-refuting because defending it uses belief-talk, and perhaps that it is a claim about the disappearance of conscious experience. My guess is that these need to be defused at different moments rather than all at once, but I do not trust my sense of the ordering. At what point in the sequence should each be headed off, and are there any I should deliberately let surface before answering? Finally, what should I openly say I am leaving out at this level, and what single question could I ask at the end to tell whether the students have understood the position rather than merely found it outrageous? I would be grateful if your answer were written in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 50-minute teaching plan for first-year students on Eliminative Materialism (EM) about beliefs and desires.
      *   **Role:** Third-year philosophy student leading a section (tutorial/seminar style).
      *   **Audience:** First-year undergraduates (likely new to philosophy of mind).
      *   **Key Concerns:**
          *   Is the "folk psychology as theory" claim the necessary first step?
          *   What follows that (theory change/abandonment)?
          *   What example to use (history of science vs. everyday talk)? What makes a *good* example?
          *   How to handle misconceptions (empty heads, self-refutation, consciousness)? When to address them?
          *   What to exclude (scope)?
          *   Final assessment question.
          *   **Language:** British English.

  2.  **Deconstruct the Philosophy (Eliminative Materialism):**
      *   *Core Thesis:* Folk Psychology (FP) is a false theory. Beliefs/desires do not exist. Neuroscience will replace FP, not reduce it.
      *   *Prerequisite:* FP *is* a theory (Theory-Theory). If FP is just a description of immediate experience, elimination makes no sense.
      *   *Mechanism:* Inter-theoretic reduction vs. elimination. (Phlogiston/Caloric analogy).
      *   *Arguments for:* FP's stagnation, explanatory failures, incompatibility with neuroscience.
      *   *Objections:* Self-refutation (do you *believe* EM?), phenomenological plausibility (it feels like I have beliefs), normative issues.

  3.  **Address the User's Specific Questions:**

      *   *Is "FP as Theory" the load-bearing first step?* Yes. Without this, EM sounds like denying the obvious. If beliefs are just "what it feels like to think," you can't eliminate them. They must be theoretical posits.
      *   *What follows?* The nature of theory change. Reduction (identity) vs. Elimination. This justifies *why* we might dump beliefs rather than just mapping them onto brain states.
      *   *Example:* History of science is better for the *logic* of elimination. Everyday talk is better for *illustrating* FP. A hybrid approach works best. The example must show a posit that was useful but ultimately non-referring.
      *   *Misconceptions:*
          *   "Empty heads": Address early (it's about categorization, not denying activity).
          *   "Consciousness": Address explicitly (EM targets propositional attitudes, not qualia).
          *   "Self-refutation": Save for the end (it's a sophisticated objection). Let it surface.
      *   *Exclusions:* Detailed neuroscience, specific alternative theories (connectionism details), Churchland vs. Churchland nuances.
      *   *Final Question:* Needs to test understanding of the *theory* status of FP, not just agreement.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Timing:* 50 minutes is tight. Needs structure.
          *   Intro/Hook (5 mins)
          *   Step 1: FP as Theory (10 mins)
          *   Step 2: Theory Change/Elimination (10 mins)
          *   Step 3: The Example (10 mins)
          *   Step 4: Objections/Misconceptions (10 mins)
          *   Conclusion/Assessment (5 mins)
      *   *Refining the Flow:* The user asked about ordering misconceptions.
          *   "Empty heads" needs to go *immediately* after stating the thesis.
          *   "Consciousness" needs to go when defining the scope of FP.
          *   "Self-refutation" is best as a discussion point near the end.
      *   *The Example:* Phlogiston is the classic. It works because people *used* it successfully but it didn't exist. Caloric is also good. Let's stick with Phlogiston as it's more familiar, but warn against disanalogy (FP is more entrenched).
      *   *British English:* Ensure spelling (materialism, colour, programme, etc.) and tone (polite, academic but accessible).

  5.  **Developing the Content:**

      *   *Introduction:* Start with the provocative claim. "Beliefs don't exist."
      *   *Step 1 (FP as Theory):* Use the "predicting behaviour" angle. We guess what others do based on what we think they think. That's a theoretical inference.
      *   *Step 2 (Reduction vs. Elimination):* Explain that usually, old theories reduce to new ones (water = H2O). But sometimes they vanish (phlogiston). EM says FP is the latter.
      *   *Step 3 (The Example):* Phlogiston. Crucial point: It wasn't *useless*, it was *ontologically wrong*. This prevents the "but beliefs work!" objection.
      *   *Step 4 (Misconceptions):*
          *   *Phenomenology:* Distinguish between feeling pain (qualia) and believing Paris is in France (propositional attitude). EM targets the latter.
          *   *Self-Refutation:* Let the students raise this. It shows engagement.
      *   *Conclusion:* The "Test Question."

  6.  **Refining the Advice (Meta-Commentary):**
      *   The user is a third-year teaching first-years. The tone should be supportive but rigorous.
      *   Emphasise *pedagogy*: Don't just lecture. Ask questions.
      *   Address the "load-bearing" question directly.
      *   Address the "example" constraints directly.

  7.  **Review against Constraints:**
      *   British English? (Check: 'programme', 'realise', 'favour', 'modelling').
      *   50-minute plan? (Yes).
      *   Addressed all specific worries? (Yes: load-bearing step, example choice, misconception ordering, exclusions, final question).

  8.  **Final Polish:**
      *   Make sure the distinction between *reduction* and *elimination* is clear, as that's the hinge of the argument.
      *   Ensure the "Self-Refutation" objection is framed carefully (the pragmatic contradiction).
      *   Check the final question: It needs to distinguish between "This is crazy" and "I understand why they say this."

      *(Self-Correction during drafting)*: I initially thought about suggesting a role-play activity. But 50 minutes is short for a complex topic. Better to keep it discussion-heavy but structured. I will advise the user to let the "self-refutation" objection come from the students rather than pre-empting it entirely, as per their instinct.

      *(Check on British English)*: Ensure "materialism" isn't spelled "materializm" (obviously), but watch for "behavior" vs "behaviour", "center" vs "centre", "defense" vs "defence".

      *(Final check on the "Load-bearing" question)*: The user asks if "FP as theory" is the first step. I need to confirm this strongly. If FP is a *description*, you can't eliminate it. If it's a *theory*, you can. This is the crux.

      *(Final check on the Example)*: The user asks what the example *must* and *must not* have.
      *   Must: Show successful use despite non-existence.
      *   Must not: Imply the *phenomena* disappeared (fire still exists without phlogiston).

      *(Final check on Misconceptions)*:
      *   Empty heads: Defuse early.
      *   Consciousness: Defuse when defining scope.
      *   Self-refutation: Let surface, then answer.

      *(Final check on Exclusions)*: Don't get bogged down in Connectionism details or specific neuro-anatomy.

      *(Final check on Assessment Question)*: Needs to be conceptual. "If FP is a theory, what would count as evidence against it?"

      Okay, ready to write.
answer: |-
  This is an excellent pedagogical challenge. Eliminative materialism (EM) is notoriously difficult to teach because, if presented poorly, it appears not as a radical metaphysical thesis but as a simple confusion about language. Your instinct is correct: without establishing the theoretical status of Folk Psychology (FP), the position is unintelligible.

  Below is a structured teaching plan designed for a fifty-minute session, followed by a discussion of the specific strategic choices you queried. The plan assumes a seminar style, where you intervene to guide rather than simply lecture.

  ### Teaching Plan: Eliminative Materialism (50 Minutes)

  **1. Introduction and the Provocation (5 minutes)**
  *   **Activity:** Write the following on the board: *'There are no beliefs.'*
  *   **Prompt:** Ask the students: "Is this claim nonsense, false, or possibly true?" Take a quick show of hands.
  *   **Goal:** Acknowledge the immediate intuition that the claim is absurd. State clearly that EM is not denying that people *think* or *act*, but rather that our *way of describing* that thinking and acting is fundamentally wrong.
  *   **Defusing Misconception 1 (Empty Heads):** Clarify immediately: "Eliminativists do not think heads are empty. They think the *categories* we use to describe what is in the head are wrong, much like saying 'there is no phlogiston' does not mean there is no fire."

  **2. The Load-Bearing Premise: Folk Psychology as Theory (10 minutes)**
  *   **Explanation:** This is the crucial step you identified. You must argue that 'belief' and 'desire' are not neutral descriptions of immediate experience (like 'pain' or 'red patch'), but theoretical posits used to predict behaviour.
  *   **Discussion Question:** "How do you know your friend is going to the kitchen? Do you see their 'belief' directly?"
  *   **Key Point:** Guide them to see that we infer internal states to explain external actions. We say, "He *believes* there is beer in the fridge and *desires* a beer, therefore he will go to the kitchen." This is a causal explanation, not a description of a feeling.
  *   **Defusing Misconception 2 (Consciousness):** Distinguish between *propositional attitudes* (believing that $p$) and *qualitative states* (feeling pain). EM targets the former. Explicitly state: "Eliminativists are usually happy to admit you feel pain. They deny you 'have a belief'."

  **3. Theory Change: Reduction vs. Elimination (10 minutes)**
  *   **Concept:** How do old theories relate to new ones?
  *   **Option A (Reduction):** The old term is identical to a new term (e.g., Water = $H_2O$; Temperature = Mean Kinetic Energy). The ontology is preserved.
  *   **Option B (Elimination):** The old term refers to nothing. The theory is so flawed that its posits are discarded, not mapped.
  *   **The Pivot:** EM argues that neuroscience will not *reduce* FP (beliefs will not turn out to be neural states) but will *eliminate* it (neural states will show that 'beliefs' do not carve nature at its joints).

  **4. The Carrying Example: Phlogiston (10 minutes)**
  *   **Why this example:** It is the standard for a reason. It illustrates a theory that was *useful* but *ontologically wrong*.
  *   **The Analogy:**
      *   **FP:** Beliefs/Desires explain behaviour.
      *   **Phlogiston Theory:** Phlogiston explains combustion.
      *   **Outcome:** We kept the phenomenon (fire/behaviour) but discarded the posit (phlogiston/belief).
  *   **Constraints on the Example (Crucial for the Tutor):**
      *   **Must Have:** It must show that a theory can be pragmatically successful (predictive) yet still be false. This counters the objection "But beliefs work!"
      *   **Must Not Have:** It must not imply the *phenomenon* disappeared. Fire still exists without phlogiston. Behaviour still exists without beliefs. Do not use an example like 'witches', which implies moral error rather than scientific error, or 'ghosts', which students may not view as a serious theory.
  *   **Discussion:** Ask: "Why didn't we just say phlogiston *is* oxygen?" (Because the properties didn't match; phlogiston was supposed to be released, oxygen is consumed). Similarly, neural networks process information differently than discrete belief-states.

  **5. Objections and The Self-Refutation Trap (10 minutes)**
  *   **Strategy:** Do not pre-empt the self-refutation objection. Let the students find it. It is the most engaging part for first-years.
  *   **Prompt:** "If there are no beliefs, do you *believe* eliminative materialism is true?"
  *   **Discussion:** Allow the tension to surface. If they say "No," ask why they are arguing. If they say "Yes," ask how that is possible.
  *   **Resolution:** Explain the eliminativist's response: They are offering a new framework. The sentence "I believe EM is true" is a manner of speaking from the old theory, pending replacement by a neuro-scientific account of their current cognitive state. It is a pragmatic contradiction, not necessarily a logical one.
  *   **Note:** Keep this brisk. Do not get bogged down in the logic of pragmatics; the point is to show EM proponents are aware of the issue.

  **6. Conclusion and Assessment (5 minutes)**
  *   **Summary:** Reiterate the three steps: FP is a theory; theories can be eliminated; neuroscience is the replacing theory.
  *   **What to Leave Out:** Explicitly tell them you are omitting:
      1.  The details of Connectionism (how neural nets actually work).
      2.  The specific arguments regarding FP's stagnation (Churchland's claims about FP not explaining mental illness).
      3.  Normative issues (can we hold people morally responsible without beliefs?).
  *   **The Test Question:** Do not ask "Do you agree?" Ask:
      *   *"If Folk Psychology is merely a description of our immediate experience, can Eliminative Materialism be true? Why or why not?"*
      *   **Correct Answer:** No. If FP is just a description of what is given (like 'itch' or 'ache'), it cannot be false. EM *requires* FP to be a theoretical inference to be plausible.

  ---

  ### Strategic Commentary on Your Concerns

  **1. Is 'Folk Psychology as Theory' the load-bearing first step?**
  Yes, absolutely. If you skip this, EM sounds like a denial of the manifest image (the world as we experience it). If beliefs are simply 'what it is like to judge', then denying them is denying consciousness itself. You must establish that 'belief' is a *theoretical construct* invoked to explain the gap between stimulus and response. Without this, the analogy to science fails.

  **2. What should carry the hour?**
  The tension between **utility** and **truth**. Students will constantly object: "But I use beliefs every day to predict my friends! It works!" The hour should be carried by the Phlogiston analogy, which demonstrates that a concept can be useful for centuries and yet fail to refer to anything real. This shifts the debate from "Is it useful?" to "Is it *real*?"

  **3. Ordering the Misconceptions**
  Your instinct to space them out is correct.
  *   **'Empty Heads':** Defuse this **immediately** (Minute 5). If they think EM denies behaviour exists, they will stop listening.
  *   **'Consciousness':** Defuse this during the **definition of FP** (Minute 15). Distinguish propositional attitudes from qualia.
  *   **'Self-Refutation':** Let this **surface naturally** (Minute 35). It is a stronger learning moment if they feel the force of the objection themselves. If you answer it too early, it sounds like a trick.

  **4. The Example: History vs. Everyday Talk**
  Use the **History of Science** (Phlogiston or Caloric).
  *   **Why:** Everyday talk examples (e.g., "We used to say the sun rises, now we say the earth turns") often suggest *reduction* rather than *elimination*. We still talk about sunrises, and the phenomenon is real. Phlogiston is better because the term was completely abandoned because the *entity* did not exist.
  *   **Warning:** Ensure you emphasise that the *combustion* was real, only the *explanation* was wrong. Otherwise, students will think EM denies human action.

  **5. What to Leave Out**
  At first-year level, you should explicitly exclude **Connectionist architecture**. Explaining how vector transformations in a neural net differ from symbolic processing is too technical for fifty minutes and distracts from the philosophical logic. Also, exclude **moral responsibility**. Whether we can punish criminals without beliefs is a fascinating ethical question, but it conflates metaphysics with ethics. Stick to the ontology.

  **6. The Final Question**
  The question suggested in the plan (*"If FP is merely a description..."*) is the litmus test. It tests whether they understand the *precondition* of the argument. If they answer based on whether they *like* EM, they have missed the point. If they answer based on the *status of FP*, they have understood the lesson.

  ### A Note on Tone (British Context)
  In a British university context, first-years are often wary of being 'lectured at'. Since you are a third-year leading a section, you have the advantage of proximity. Use that. When introducing the Phlogiston analogy, you might say, "It strikes us as bizarre, doesn't it? But consider how we treat the history of chemistry..." This invites them into the reasoning rather than imposing the conclusion.

  Good luck with the session. It is a difficult topic, but if you secure the 'theory-theory' premise, the rest follows logically.
