      *   *User's Suspicion:* CPA is doing most of the work. *Verification:* Literature suggests this is largely correct, but CK is also a huge bottleneck.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate that the math is solid but the *application* is the battleground. State clearly: The theorem is a "no-go" result for a specific idealized model, not necessarily a description of human psychology.

      *   **Assumption 1: The Common Prior Assumption (CPA).**
          *   *What it means:* We start with the same probability distribution over the world before seeing private evidence.
          *   *Failure Mode:* Humean skepticism. We are born in different bodies, times, places. Our "priors" are shaped by genetics, culture, early experience.
          *   *Significance:* This is the biggest target. If priors differ, AAT doesn't apply.
