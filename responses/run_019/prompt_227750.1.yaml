      *   *Drafting thought:* Use "Leibniz Equivalence" terminology without getting bogged down. Ensure the Substantivalist doesn't sound like they *must* accept indeterminism. They can accept Leibniz Equivalence and remain substantivalists (sophisticated view). The prompt asks to distinguish the questions, so I need to make sure the text reflects that *conflation* was the problem.

  4.  **Deconstruct Part 3: The Cruxes:**
      *   *Goal:* Three specific testable sub-questions with considerations and predictions.
      *   *Candidate 1: Haecceitism.* Do purely haecceitistic differences count as real modal differences?
          *   Consideration: Intuition pumps about swapping particles/points.
          *   Substantivalist Prediction: Yes (or at least, not ruled out a priori).
          *   Relationist Prediction: No (violates PII).
      *   *Candidate 2: Sophisticated Substantivalism.* If a substantivalist accepts diffeomorphic models = one possibility, are they still a substantivalist?
          *   Consideration: Definition of substantivalism (existence of points vs. identity of points).
          *   Substantivalist Prediction: Yes, ontology remains (points exist), only modal profile changes.
          *   Relationist Prediction: No, this collapses into relationism (points are just nodes in a structure).
      *   *Candidate 3: Electromagnetism Analogy.* Is GR gauge symmetry like EM gauge symmetry?
          *   Consideration: Potentials $A_\mu$ vs. Metric $g_{\mu\nu}$. Arena vs. Actor.
          *   Substantivalist Prediction: Disanalogy exists (spacetime is the background arena).
          *   Relationist Prediction: No disanalogy (both are gauge redundancies in the formalism).
      *   *Drafting thought:* Ensure the "Consideration" is neutral. Ensure predictions are clear "If/Then" or "Side X claims Y."

  5.  **Deconstruct Part 4: Verdict on Verbal Dispute:**
      *   *Goal:* Acknowledge where they were just arguing about words.
      *   *Key Insight:* Often, the dispute is over the label "substantivalist." If the substantivalist accepts Leibniz Equivalence, the relationist calls them a relationist. The substantivalist calls themselves a "sophisticated substantivalist."
      *   *Resolution:* The threat to *determinism* is verbal/representational. The threat to *ontology* depends on the definition of substantivalism.
