answer: |-
  ### Desiderata for a Theory of Mindedness in Composed Systems

  To resolve the parity problem between brains and colonies without special pleading, a theory of mindedness must satisfy the following five constraints. For each, I distinguish between **Hard Requirements** (logical or empirical necessities for *any* adequate theory) and **Camp Preferences** (contingent on specific philosophical commitments like physicalism, panpsychism, or functionalism).

  #### 1. The Literal-vs-Metaphor Line
  *   **Phenomenon:** We speak agentively of colonies ("the colony decides") and brains ("the visual cortex processes"), but also of markets ("the market reacted") and thermostats ("it seeks equilibrium").
  *   **Hard Requirement:** The theory must provide truth conditions for agentive predicates. It must specify the structural or functional property $X$ such that "System $S$ decides $D$" is true if and only if $S$ possesses $X$. It cannot rely on intuition alone.
  *   **Hard Requirement (Over/Under-Inclusion):** The theory must avoid *trivialization* (counting thermostats/markets as minded) and *exceptionalism* (counting only human brains as minded). The difference between a colony and a market must be principled, not taxonomic.
  *   **Camp Preference:** The *stringency* of $X$. Functionalists prefer a low bar (input-output organization); Phenomenalists prefer a high bar (unified subjective field); Biologists prefer a substrate bar (neural tissue). An adequate theory must justify its chosen stringency without circularity.

  #### 2. The No-Central-Locus Problem
  *   **Phenomenon:** Brains have no "Cartesian Theater"; colonies have no "Queen Controller." Both are distributed.
  *   **Hard Requirement:** If the theory claims the colony has a *mind* (implying a subject), it must explain how a subject of experience or agency emerges from distributed parts without a central seat. If it claims the colony has only *cognition* (processing without a subject), it must rigorously distinguish cognition from mentality.
  *   **Hard Requirement:** The theory cannot equivocate. It cannot claim the colony is "minded" in the morning (functional sense) and "not minded" in the evening (phenomenal sense) to dodge objections.
  *   **Camp Preference:** The necessity of *consciousness*. Integrationists/Functionalists treat consciousness as an output of complexity (preference: mind without qualia is possible). Phenomenalists treat consciousness as primitive (preference: no qualia, no mind). The theory must state which is required for the label "mind."

  #### 3. The Boundary and Continuity Problems
  *   **Phenomenon:** Colonies and brains grow continuously. A colony starts with a queen and grows to 500,000 workers. A brain grows from a tube to a cortex.
  *   **Hard Requirement:** The theory must identify the *candidate system* at time $t$. It must specify what physical boundaries constitute the "mind-bearing unit."
  *   **Hard Requirement (Sorites):** The theory must address the threshold problem. If mindedness is binary (Yes/No), it must identify a non-arbitrary phase transition property that flips between day $N$ (not minded) and day $N+1$ (minded). If mindedness is graded, it must specify the point at which the ascription becomes literal rather than approximate.
  *   **Camp Preference:** Threshold vs. Gradient. Essentialists prefer a threshold (a specific architecture). Pragmatists prefer a gradient (degree of integration). The theory must declare which it is, as this dictates the verdict on developing colonies.

  #### 4. The Mechanism of Distributed Computation
  *   **Phenomenon:** Colony behavior (foraging, nest selection) emerges from stigmergy (environment-mediated coordination) and local rules, not global plans.
  *   **Hard Requirement:** The theory must be consistent with the causal facts. It cannot posit a global representation if none exists physically. It must explain how representational or inferential capacity (if required for mind) supervenes on local interactions + environmental modification.
  *   **Hard Requirement:** It must distinguish *causal coupling* from *semantic content*. Pheromone trails cause behavior; do they *represent* food? The theory must provide a criterion for representation that doesn't make every causal signal a symbol.
  *   **Camp Preference:** The status of Stigmergy. Enactivists view environment-coupling as constitutive of mind (preference: stigmergy supports mindedness). Classic Cognitivists view internal representation as necessary (preference: stigmergy is merely mechanical).

  #### 5. The Brain-Parity Loser Cases
  *   **Phenomenon:** There are intermediate cases: slime molds (single cell, network behavior), corporations (humans as nodes, explicit communication), split-brain patients (one body, two apparent streams).
  *   **Hard Requirement (Anti-Chauvinism):** The theory cannot use "biological substrate" as a proxy for "mindedness" unless it explains why silicon or chitin is inherently incapable of supporting the property $X$ identified in Desideratum 1.
  *   **Hard Requirement (Consistency):** The verdict on the colony must be derivable from the same principles used for the brain, slime mold, and corporation. If the corporation is excluded, the reason must apply to the colony unless a relevant structural difference is shown.
  *   **Camp Preference:** The verdict on edge cases. Some theories accept corporate minds; others accept slime mold minds; others accept neither. The theory must own its verdicts on these cases as consequences of its core principles, not as ad-hoc exclusions.

  ***

  ### Tension Analysis: The Impossible Triple

  There is a structural inconsistency among three specific demands placed on the theory. I call this the **Impossible Triple**:

  1.  **Non-Arbitrary Boundaries:** The theory must identify a principled physical boundary for the minded system (Desideratum 3).
  2.  **Clean Literal/Metaphor Cutoff:** The answer to "Does it have a mind?" must be a definitive Yes or No, not a matter of degree (Desideratum 1 & 3).
  3.  **Continuous Growth:** The theory must accommodate the biological fact that colonies and brains grow and reorganize continuously without discrete phase transitions in their basic mode of operation (Desideratum 3).

  **The Conflict:**
  If growth is truly continuous (3), there is no single moment where a non-arbitrary property (1) suddenly appears to trigger a binary switch (2). Biological systems exhibit *gradual* increases in complexity, connectivity, and homeostatic capacity. To insist on a Clean Cutoff (2) and Non-Arbitrary Boundaries (1) is to demand a phase transition where biology offers only a slope.

  **Resolution:**
  These three are jointly unsatisfiable. One constraint must be negotiated:
  *   **Option A (Negotiate Cutoff):** Admit that mindedness is a **gradient**. The question "Does the colony have a mind?" is ill-posed; the correct question is "To what degree does the colony satisfy the conditions for mindedness?" This saves Non-Arbitrary Boundaries and Continuous Growth but sacrifices the binary Yes/No decision procedure.
  *   **Option B (Negotiate Boundaries):** Admit that boundaries are **pragmatic**, not ontological. We draw the line where it is useful for prediction, not where nature dictates. This saves the Cutoff and Continuous Growth but concedes that the "system" is partly defined by the observer.
  *   **Option C (Negotiate Continuity):** Posit a hidden **phase transition**. Claim that at a specific complexity threshold (e.g., specific information integration value), a qualitative shift occurs. This saves Cutoff and Boundaries but risks empirical falsification if no such discontinuity exists in the data.

  **Conclusion:** The demand for a definitive Yes/No answer (Clean Cutoff) is the weakest link. An adequate theory should likely replace the binary question with a graded ascription, acknowledging that "literal" mindedness is a limit concept approached by degrees of integration.

  ***

  ### Scorecard: The Single Eliminating Requirement

  The requirement that does the most work in eliminating usual candidate positions is **Desideratum 1: The Literal-vs-Metaphor Line (specifically the Over-Inclusion Constraint).**

  This requirement demands that the theory distinguish a minded colony from a mindless market or highway system without relying on biological prejudice.

  *   **Eliminates Naive Functionalism:** Functionalists define mind by input-output organization. Markets and highways satisfy this. To exclude them while including colonies requires ad-hoc constraints on *what kind* of function counts, which most standard functionalist accounts lack.
  *   **Eliminates Pure Integrationism (e.g., IIT):** Information integration exists in power grids and traffic networks. Unless the theory specifies why *biological* integration is unique (violating Anti-Chauvinism), it over-includes. If it accepts power grids as minded, it faces massive parity objections.
  *   **Eliminates Deflationism:** Deflationists who call colony-mind a "metaphor" must explain why brain-mind is not *also* a metaphor, given the structural parity. If they claim brains are literal and colonies are not, they violate the Parity Constraint (Desideratum 5) unless they can pinpoint a structural difference that satisfies Desideratum 1.
  *   **Eliminates Phenomenalism (as usually stated):** If "mind" requires a unified subject of experience, colonies fail. But this view often struggles to explain the *unity* in brains without a central locus (Desideratum 2). It survives only by retreating to the claim that brains have a locus and colonies don't—a claim neuroscience increasingly undermines.

  **Verdict:** The **Over-Inclusion Constraint** forces the theory to be precise enough to exclude markets but inclusive enough to admit colonies (if applicable). Most theories collapse here: they are either too loose (everything is a mind) or too tight (only humans are), failing the parity test. A theory that survives this filter has already done the hard work; the verdict on ants follows trivially from the verdict on markets.
