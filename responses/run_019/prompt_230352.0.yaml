      *   Is it about standards of evaluation? Yes, specifically the *norms of assertion* and the *logic* employed (Classical vs. Non-classical).

  4.  **Diagnose the Structure of the Disagreement:**
      *   **Layer 1: Logic (Bivalence vs. Truth-Value Gaps).** Side A uses Classical Logic (Law of Excluded Middle applies to truth values). Side B uses a logic that allows gaps (Lukasiewicz, Supervaluationism, etc.).
      *   **Layer 2: Metaphysics (Eternalism vs. Presentism/Branching).** Side A implies the future is "already there" (Block Universe). Side B implies the future is ontologically open.
      *   **Layer 3: Semantics (Tenseless vs. Tensed).** Side A treats "It will be the case that P" as a proposition with a fixed value. Side B treats it as dependent on the branch of time taken.
      *   **The Core Tension:** The user suggests it's about "what it takes... to be true." This is the *Truthmaker* debate. Side A accepts future truthmakers (or timeless facts). Side B demands present truthmakers.
      *   **Verbal or Substantive?** It looks verbal because they might be using "true" differently, but it's substantive because adopting one view forces a metaphysical commitment (Fatalism vs. Openness). However, modern semantics (Ockhamism vs. Branching Time) suggests we can have bivalence *and* openness if we index truth to histories. So the stand-off might be based on a confusion of parameters.

  5.  **Address the "Progress" Question:**
      *   **Formal Result:** Prior's Tense Logic and Thomason's Branching Time semantics *have* provided formal results. We can model both views. The impasse is often ignoring these tools.
      *   **Sharper Distinction:** Distinguishing *assertibility* from *truth*, or *truth at a time* vs. *truth simpliciter*. Distinguishing *logical necessity* from *causal necessity*.
      *   **Rerouting:** Move from "Is it true?" to "True relative to what?" (Context of Utterance vs. Context of Assessment). MacFarlane's Relativism is relevant here.
