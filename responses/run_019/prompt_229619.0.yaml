answer: |-
  Hey Marcus,

  I have been thinking about our debate on Nozick and the Wilt Chamberlain argument, and I decided to take you up on the challenge to construct the case you claimed was possible. You argued that we could find a scenario where every transaction is voluntary and rational, yet the final state is regretted by everyone involved, and I initially doubted you could build that without smuggling in coercion or irrationality. However, after working through the constraints, I think I have found a scenario that fits your specifications exactly, and it suggests you might have found a genuine pressure point in the entitlement theory, even if it does not break it logically.

  Imagine a cooperative of ten freelance designers who initially own their client lists and charge a standard rate that affords them all a comfortable living, a distribution everyone agrees is fair and which meets entitlement theory's requirements for just acquisition. One designer, facing a personal cash flow issue, voluntarily undercuts the rate by twenty percent to secure a large contract, a fully informed choice that benefits them immediately. Seeing their own inquiries dry up, the remaining nine voluntarily match the lower rate to remain competitive, since losing clients entirely is worse than earning less. This triggers a cascade where each subsequent rate cut is the rational survival move for the individual at that moment, yet the process stabilizes only when everyone is working the same hours for significantly less total income than the initial standard rate provided, leaving every member strictly worse off by their own original preferences despite every transaction being voluntary and free of coercion.

  If we run this through Nozick's entitlement theory, the verdict is straightforwardly that the final distribution is just. The initial state is just because everyone acquired their skills and client lists without theft or fraud, satisfying justice in acquisition. Every subsequent change in income distribution results from voluntary contracts between the designers and their clients, satisfying justice in transfer. There is no deception, no force, and no violation of rights that would trigger the principle of rectification. Therefore, even though everyone ends up with less money for the same work, Nozick must conclude that the outcome is just because the history of how it came about was clean. The theory does not evaluate the end-state pattern of wealth or welfare, only the legitimacy of the steps taken to get there.

  The structural feature doing all the work here is the interdependence of options, specifically a multi-person prisoner's dilemma embedded in market competition. Each individual's choice alters the bargaining power and available options for everyone else, shifting the baseline of what counts as a rational choice in the next round. At the start, holding the price is rational. Once one person defects, holding the price becomes irrational for the others because it leads to zero income rather than lower income. This shifts the payoff structure so that the only stable equilibrium is the low-income state, even though the high-income state was preferable for everyone. If you remove this feature, say by allowing the designers to form a binding cartel or union that prevents undercutting, the case collapses back into a harmless Wilt Chamberlain-style example where the group maintains their preferred pattern without interference. However, Nozick would argue that enforcing such a cartel requires coercive interference with the liberty of the one designer who wants to lower their price, which brings us back to his original point that liberty upsets patterns.

  This brings us to the core of our disagreement. Your line of argument is that a theory which blesses outcomes the participants themselves regret has lost touch with whatever made consent morally important in the first place. If consent is supposed to be a proxy for welfare or autonomy, and the aggregate result of consensual acts is reduced welfare and constrained autonomy for everyone, then the moral force of consent seems to evaporate at the macro level. You are suggesting that justice should care about whether people are actually better off, not just whether they were technically free to choose. The best Nozickean reply to this is that nobody was ever entitled to the pattern of high wages in the first place, only to their own labor and property. Consent attaches to each transaction individually, not to the systemic outcome, and regret about aggregates does not manufacture a rights violation. From this view, the designers are not victims of injustice but victims of circumstance, and using state power to fix their regret would violate the rights of the one designer who wishes to charge less.

  Regarding your question on whether the original Wilt Chamberlain argument covers this, I think Nozick's framing quietly assumes the end state is welcome to everyone involved, or at least that the payers are better off because they value the service more than the money. In the Wilt case, the fans choose to pay because they prefer watching Wilt to keeping the quarter. In my designer case, the designers choose to lower rates because they prefer some income to none, but the aggregate shift makes them worse off relative to the starting point. This suggests you found a genuine gap in the rhetorical power of Nozick's argument, if not its logical consistency. Nozick uses the Wilt case to show that liberty is desirable because it allows people to get what they want, but this designer case shows that liberty can also allow people to collectively negotiate themselves into a state they do not want. Nozick would likely shrug and say justice is not about maximizing welfare, but your point stands that if liberty systematically produces outcomes everyone regrets, the defense of liberty based on consent becomes much harder to sell. I think this means you were right that the Wilt argument cheats by selecting a transaction where the voluntary nature aligns perfectly with welfare improvement, whereas real markets often feature these race-to-the-bottom dynamics where voluntary choices compound into collective loss. Let me know if you think this holds up under scrutiny.

  Best,

  Your Friend
