          *   *Impact:* Low/Medium. It supports the separability thesis, but if (1) holds, separability is already established. If (1) fails, (2) won't save it. It's more of a "nice to have" for the generalization chapter (broadening the scope of suffering) but not essential for the core argument about pain's badness.
          *   *Verdict:* Lower priority. Potential "sacred cow" or at least a luxury item.

