      *   **Criterion 2: Tractability (18 months, Armchair).** (1) is tractable via literature review and conceptual analysis. (3) is standard philosophy. (4) is doable but needs care to avoid empirical overreach. (2) is risky because it leans heavily on contested empirical analogies.
