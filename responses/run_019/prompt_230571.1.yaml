      *   *Step 3:* Test rule against hard cases.
      *   *Step 4:* Realize the rule breaks.

      *Let's try a "Causal Court" approach.*
      *   Groups are "Juries."
      *   Cases are "Dockets."
      *   They must determine "Did X cause Y?"
      *   Crucial constraint: They cannot use the word "Blame" or "Fault." Only "Cause."

