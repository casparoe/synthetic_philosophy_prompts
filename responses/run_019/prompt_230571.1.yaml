answer: |-
  # Activity Plan: The Empty Slot Protocol

  **Time:** 75 Minutes
  **Participants:** 12–16 Teens (Ages 16–18)
  **Setup:** 3 Tables of 4–5 students.
  **Goal:** To induce a felt contradiction between "causes as physical pushes" and "causes as necessary conditions," specifically regarding omissions.

  ## Materials Needed
  *   **Case Dossiers:** 3 sets (one per table), each containing 6 Case Cards.
  *   **Verdict Tokens:** Two colors per table (e.g., Green for "Is a Cause," Red for "Is Not a Cause").
  *   **Principle Cards:** Two distinct rule cards (detailed below).
  *   **Whiteboard/Flipchart:** For the final debrief mapping.

  ---

  ## Part 1: The Setup (5 Minutes)
  **Role:** You are the "Chief Auditor." The students are "Causal Investigators."
  **Script:** "We are investigating how the world works. Specifically, we are auditing 'Cause and Effect.' Your job is not to decide who is *bad* or who is *blameworthy*. Your job is to decide if a specific factor is part of the physical chain that produced an outcome. You will be scored on consistency. If you say 'Yes' to two identical logical structures, you get points. If you contradict yourself, you lose points."

  *Note: Emphasize that "Blame" is banned vocabulary. If they use the word "should," gently correct them to "did."*

  ## Part 2: Round One – The "But-For" Test (20 Minutes)
  **Rule:** Distribute **Principle Card A**.
  *   **Principle A:** *"X is a Cause of Y if, without X, Y would not have happened."* (This is the Counterfactual Theory).

  **Task:** Groups review **Case Set 1** and place Green/Red tokens on each factor.
  **Case Set 1 (Matched Pairs):**
  1.  **The Poison:** Gardener pours acid on plant. Plant dies. (Factor: Pouring acid).
  2.  **The Thirst:** Gardener walks past plant, does not water. Plant dies. (Factor: Not watering).
  3.  **The Wire:** Mechanic cuts brake line. Car crashes. (Factor: Cutting wire).
  4.  **The Check:** Mechanic inspects car, misses loose wire. Car crashes. (Factor: Missing the wire).
  5.  **The Shot:** Assassin shoots victim. Victim dies. (Factor: Firing gun).
  6.  **The Lifeguard:** Lifeguard watches phone, doesn't swim. Swimmer drowns. (Factor: Not swimming).

  **Expected Outcome:** Under Principle A, *all* factors get Green tokens. The plant wouldn't die if the gardener *had* watered it. The swimmer wouldn't die if the lifeguard *had* swum.
  **Scoring:** Give points for marking Omissions (2, 4, 6) as Green. Reinforce that logically, the absence is necessary for the outcome.

  ## Part 3: Round Two – The "Physical Push" Test (20 Minutes)
  **Rule:** Collect Principle Card A. Distribute **Principle Card B**.
  *   **Principle B:** *"X is a Cause of Y only if X transferred energy or matter to Y."* (This is the Process/Mechanistic Theory).

  **Task:** Groups review **Case Set 2** (These are the *exact same scenarios* as Round 1, re-worded slightly to focus on physics).
  **Case Set 2:**
  1.  **The Poison:** Acid molecules contact plant cells. Plant dies. (Factor: Acid contact).
  2.  **The Thirst:** Gardener stands still. Plant wilts. (Factor: Gardener's stillness).
  3.  **The Wire:** Pliers cut metal. Car loses control. (Factor: Pliers cutting).
  4.  **The Check:** Mechanic's eyes look elsewhere. Car crashes. (Factor: Eyes looking away).
  5.  **The Shot:** Bullet strikes heart. Victim dies. (Factor: Bullet strike).
  6.  **The Lifeguard:** Lifeguard breathes air. Swimmer drowns. (Factor: Lifeguard breathing).

  **Expected Outcome:** Under Principle B, Omissions (2, 4, 6) must get Red tokens. "Stillness" does not transfer energy to a plant. "Looking away" does not push a car.
  **The Trap:** Ask them to compare their Round 1 scores with Round 2 scores.
  **The Conflict:** "In Round 1, 'Not Watering' was a Cause. In Round 2, 'Gardener's Stillness' is Not a Cause. But these describe the same event. You have lost consistency points."

  ## Part 4: Round Three – The Selection Filter (15 Minutes)
  **Rule:** No Principle Card. Open Discussion.
  **Task:** Present **Case Set 3** to the whole room.
  **Scenario:** The plant died from thirst.
  **Candidates for "The Cause":**
  1.  The Gardener (who didn't water).
  2.  The President (who also didn't water).
  3.  The Rain (which didn't fall).
  4.  The Sun (which shone too hot).

  **Question:** "If 'Not Watering' is a cause, why is the Gardener the cause and not the President? Both failed to water. Both failures were necessary for the death (in the strict 'but-for' sense)."

  **Task:** Groups must select *one* cause and justify it without using the word "Blame."
  **Expected Outcome:** They will struggle. They will want to say "Because it was his job." You must press: "Does a 'job' transfer energy? Is a 'job' a physical force?"

  ## Part 5: Debrief & Mapping (15 Minutes)
  **Goal:** Connect their frustration to the philosophical concepts. Do not solve the puzzle; name the puzzle.

  **1. Map Round 1 to "Counterfactual Dependence"**
  *   *Say:* "In Round 1, you used 'If-Then' thinking. 'If he had watered, it would live.' This is how we speak in courtrooms and history books. It makes omissions count as causes."
  *   *Write on Board:* **The Intuition of Dependence.**

  **2. Map Round 2 to "Process Theory"**
  *   *Say:* "In Round 2, you used 'Physics' thinking. 'What touched what?' This is how we speak in science. It makes omissions impossible as causes. A nothing cannot push a something."
  *   *Write on Board:* **The Intuition of Mechanism.**

  **3. Map Round 3 to "Normative Expectations"**
  *   *Say:* "In Round 3, you tried to pick between the Gardener and the President. Physically, they are identical (both absent). The only difference is *expectation*. We select the cause that violates a norm."
  *   *Write on Board:* **The Selection Problem.**

  **4. The Proliferation Warning**
  *   *Say:* "If we accept Round 1 fully, then the President caused the plant's death. And the company that didn't send water. And the inventor who didn't invent a self-watering pot. The list of causes becomes infinite. This is the **Proliferation Problem**."

  ---

  ## Troubleshooting: Predictable Pitfalls

  ### 1. The Moral Collapse (Most Likely)
  **What happens:** In Round 1 or 3, students argue, "The Gardener caused it because he's the one who *should* have done it." They conflate Causation with Responsibility.
  **Why it undermines the goal:** It solves the puzzle too easily. (Cause = Responsibility). It hides the metaphysical tension.
  **How to Steer:**
  *   *Do not lecture.* Use the "Robot Test."
  *   *Intervention:* "Imagine the Gardener is a robot programmed to water. It malfunctions and doesn't water. The plant dies. Did the robot's failure cause the death? There is no 'should' for a robot, only mechanics. Does the cause disappear?"
  *   *Intervention:* "If I blame a ghost for a noise, I am assigning fault. But did the ghost *cause* the noise? We need to know if the ghost exists (mechanism) before we decide if it's guilty (blame)."

  ### 2. The "Same Thing" Dismissal
  **What happens:** In Round 2, students insist, "Not watering IS transferring energy. His muscles used energy to stay still."
  **Why it undermines the goal:** It dissolves the distinction between act and omission.
  **How to Steer:**
  *   *Intervention:* "If he uses energy to stay still, he is doing an act (standing). But the plant died from a lack of input, not the presence of his standing. If he stood there for 100 years, does the plant die faster? No. So his energy isn't pushing the death."

  ### 3. Groupthink / Dominant Voices
  **What happens:** One student dictates the verdict tokens.
  **How to Steer:**
  *   *Rule:* "Before placing a token, every person at the table must place a hand on the card. If hands aren't all there, no token."
  *   *Role:* Assign a "Devil's Advocate" role at each table for Round 2 only. Their job is to argue the opposite of the group's instinct.

  ---

  ## What This Activity Cannot Do (Facilitator Notes)

  You must explicitly supply the following in your closing remarks, as the activity generates the *itch* but not the *scratch*:

  1.  **It cannot distinguish Pragmatics from Metaphysics:** The students will feel confused about what causation *is*. You need to explain that philosophers often split this into two questions:
      *   *Metaphysical:* What is the actual structure of the universe? (Here, omissions are usually not causes).
      *   *Pragmatic:* What explanation is useful for humans? (Here, omissions *are* causes because we need to know what to fix).
      *   *Supply:* "The activity shows you that 'Cause' is a word we use for two different jobs. Sometimes we mean 'physical push,' sometimes we mean 'place to intervene.'"

  2.  **It cannot resolve the Proliferation Problem:** The activity shows them that *many* absences are necessary conditions. It does not tell them how to stop the list from being infinite.
      *   *Supply:* "Philosophers like Hart and Honoré suggest we stop the list at the 'intervention.' We look for the abnormal event. Rain not falling is normal; Gardener not watering is abnormal. That's how we cut the list."

  3.  **It cannot validate one side as 'True':** The teens may leave thinking one round was the 'real' one.
      *   *Supply:* "There is no consensus in philosophy on this. Some say omissions are real causes. Some say they are just linguistic shortcuts. Your discomfort tonight is the same discomfort professional philosophers have had for 50 years."

  ## Closing Script Suggestion
  "You spent 75 minutes proving two contradictory things. You proved the Gardener's inaction *did* cause the death, and you proved it *could not possibly* have caused the death. You didn't fail the activity. You succeeded. You found the seam in our understanding of reality. The question for next week isn't 'Which round was right?' It's 'Why do our brains demand both rules at once?'"
