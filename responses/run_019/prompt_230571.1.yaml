      4.  **Round 3: The Selection Game (15 min):** Who is responsible? (Gardener vs. President).
      5.  **Debrief (15 min):** Connect the dots.

      *Critique:* Round 2 might feel like a trick. Let's integrate the tension *within* the discussion of the same cases.
      Better: **The "Because" Game.**
      *   Teams get a scenario. They must write the "Because Statement."
