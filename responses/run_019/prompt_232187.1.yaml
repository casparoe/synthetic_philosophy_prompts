answer: |-
  ### The "Paradox of Deontology" Sorting Tree

  **Instructions for the Instructor:**
  Present the three cases below as brief vignettes. Ask the students to answer the questions sequentially based on their immediate moral intuition. Do not reveal the names of the theories until they reach a leaf.

  **The Cases:**
  1.  **The Transplant:** A surgeon can kill one healthy visitor to harvest organs and save five dying patients.
  2.  **The Catastrophe:** A dictator will launch a nuclear strike killing millions unless you personally execute one innocent prisoner.
  3.  **The Preventing Murder:** A murderer is about to kill five people. You can stop him only by shooting one innocent bystander (blocking the line of fire).

  ---

  #### The Decision Tree

  **Q1. In the Transplant Case, is it morally permissible to kill the one healthy person to save the five patients?**
  *   **YES** → Go to Q2.
  *   **NO** → Go to Q3.

  **Q2. In the Catastrophe Case, is it morally permissible to kill the one prisoner to save the millions?**
  *   **YES** → **Leaf 1: Act-Consequentialism.** (You maximize good outcomes regardless of constraints.)
  *   **NO** → **Leaf 2: The "Scale-Dependent" Intuition.** (See Analysis: This combination is theoretically unstable.)

  **Q3. In the Catastrophe Case, is it morally permissible to kill the one prisoner to save the millions?**
  *   **YES** → Go to Q4. (You are a Moderate Deontologist.)
  *   **NO** → Go to Q5. (You are an Absolutist Deontologist.)

  **Q4. When the numbers get high enough (like in the Catastrophe Case) to make killing permissible, does the duty not to kill *disappear entirely*, or is it merely *outweighed* by the duty to save lives?**
  *   **Disappears / Constraint Breaks** → **Leaf 3: Threshold Deontology.** (Constraints hold until a catastrophic threshold is met.)
  *   **Outweighed / Conflicting Duty** → **Leaf 4: Rossian Pro Tanto Pluralism.** (Multiple duties exist; the heavier duty wins, but the lighter one remains.)

  **Q5. In the Preventing Murder Case, is it permissible to kill the innocent bystander to stop the murderer?**
  *   **YES** → **Leaf 5: The "Interventionist" Deontologist.** (See Analysis: This is a rare/unexplored hybrid.)
  *   **NO** → Go to Q6.

  **Q6. For you, does the prohibition against killing feel more like *violating someone's boundary* (trespassing on what is theirs) or *violating a rational law* (acting in a way no rational agent could will)?**
  *   **Violating a Boundary** → **Leaf 6: Nozick-Style Agent-Relative Side-Constraints.**
  *   **Violating a Rational Law** → **Leaf 7: Strict Kantian Absolutism.**

  *(Note: To meet your "5 leaves" constraint, Leaves 6 and 7 are theoretically distinct but practically identical on these cases. See Analysis below.)*

  ---

  ### Logical Space & Analysis

  Here is the mapping of the logical space generated by the first three binary questions (Q1, Q2, Q3), followed by an honest assessment of the tree's diagnostic limits.

  #### 1. The Logical Combinations (Q1–Q3)
  There are 8 possible combinations of answers to the three core cases. Here is how they map:

  | Q1 (Transplant) | Q3 (Catastrophe) | Q5 (Preventing Murder) | Position / Status |
  | :--- | :--- | :--- | :--- |
  | **Yes** | **Yes** | **Yes** | **Act-Consequentialism (Leaf 1)** |
  | **Yes** | **No** | (N/A) | **Empty (Incoherent)** |
  | **No** | **Yes** | **Yes** | **Threshold/Ross (Leaf 3/4)** |
  | **No** | **Yes** | **No** | **Empty (Unattractive)** |
  | **No** | **No** | **Yes** | **Empty (Unexplored/Incoherent)** |
  | **No** | **No** | **No** | **Absolutists (Leaf 6/7)** |

  *(Note: Q2 is only asked if Q1 is Yes. If Q1 is No, we move to Q3. The table above normalizes the path for clarity.)*

  #### 2. Empty Nodes Analysis
  *   **Yes (Transplant) / No (Catastrophe):** *Incoherent.* It is difficult to justify why killing one to save five is permissible, but killing one to save millions is not. This suggests a moral view that values small aggregates over large ones without a deontological constraint, which lacks a rational grounding.
  *   **No (Transplant) / Yes (Catastrophe) / No (Preventing Murder):** *Unattractive.* This view holds that saving millions justifies killing a bystander, but saving five people from a murderer does not. While logically possible (a high threshold), it is intuitively unstable because the "Preventing Murder" case usually triggers deontological constraints *more* strongly than the Catastrophe case (due to the intervening agency of the murderer). If the threshold is met for millions, it is usually met for the murderer case unless the view relies heavily on *direct* vs. *indirect* agency distinctions.
  *   **No (Transplant) / No (Catastrophe) / Yes (Preventing Murder):** *Unexplored/Incoherent.* This view forbids killing in the Catastrophe case (millions die) but allows it in the Preventing Murder case (five die). This inverts the standard "threshold" logic. It implies the *source* of the threat matters more than the *scale* of the outcome, to a degree that contradicts the absolutism shown in the Catastrophe case.

  #### 3. Diagnostic Limitations (The "Honesty Clause")

  You correctly suspected that these cases cannot fully separate all five positions. Here is where the tree relies on theoretical self-reporting rather than pure case intuition:

  **A. Strict Kantian vs. Nozickian Side-Constraints (Leaves 6 & 7)**
  *   **The Problem:** On the Transplant, Catastrophe, and Preventing Murder cases, Strict Kantians and Nozickians give the **exact same verdicts** (No, No, No). Both forbid using the innocent person as a means/boundary violation.
  *   **The Fix:** Q6 attempts to separate them based on the *phenomenology* of the constraint ("Boundary" vs. "Law").
  *   **The Flag:** Be honest with students that **these two leaves are functionally identical regarding action-guidance in these cases.** The distinction is meta-ethical (grounding of the constraint), not normative (verdict on the act). A student could easily hold a Nozickian view of rights but describe it in Kantian language.

  **B. Threshold Deontology vs. Rossian Pluralism (Leaves 3 & 4)**
  *   **The Problem:** Both views permit killing in the Catastrophe case but forbid it in the Transplant case.
  *   **The Fix:** Q4 asks about "Moral Residue." Rossians typically argue the duty not to kill is *overridden* but still exists (hence regret/residue). Threshold deontologists often argue the constraint *ceases to apply* past the threshold (hence the act becomes permissible simpliciter).
  *   **The Flag:** This distinction is subtle. Many students will not have a pre-theoretical intuition about whether a duty "disappears" or is "outweighed." You may find many students cluster here without a strong preference. In practice, these two views are often extensionally equivalent in seminar discussions unless pressed on the nature of *justification*.

  **C. The "Scale-Dependent" Leaf (Leaf 2)**
  *   **The Problem:** Students who say **Yes** to Transplant but **No** to Catastrophe.
  *   **The Flag:** This is likely a confusion or a "gut check" error rather than a stable philosophical position. In a seminar setting, treat this as a prompt for discussion: "Why would the stakes make it *worse* to act?" It usually collapses into Consequentialism (Yes/Yes) upon reflection.

  ### Pedagogical Recommendation
  When revealing the labels, explicitly draw the class's attention to the **Absolutist Cluster** (Kant/Nozick) and the **Moderate Cluster** (Threshold/Ross). Acknowledge that the *cases* did not separate them; only their *descriptions of why* did. This sets up your subsequent lectures perfectly: "Now that we know you share these intuitions, let's look at why the philosophers ground them differently."
