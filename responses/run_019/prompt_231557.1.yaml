      *   *Self-Correction on Prop 4:* The user says "rebirth is more like lighting one candle." This is the standard Buddhist analogy. The tension with "desert" is that the flame isn't the *same* flame. Does the new flame "deserve" the heat? Buddhism says yes via causal continuity. Western philosophy says no without identity. I need to highlight this specific friction.

