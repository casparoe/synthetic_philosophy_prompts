  **Couple's Marriage Collapses After Shared Prior Prevents Them From Agreeing To Disagree**

  CAMBRIDGE, MA—Local epistemologists Alice Chen and Bob Markov announced their separation Tuesday, citing the unintended consequences of binding their relationship strictly to Aumann's Agreement Theorem. The couple, who married three years ago after confirming they possessed identical prior probability distributions, reported that their union became untenable once they realized honest Bayesian agents cannot agree to disagree.

  "Every argument dissolves before it begins," said Chen, 34. "Last week, I was upset about Bob forgetting our anniversary. But once I stated my posterior probability that he was negligent, he immediately updated his own belief to match mine. Within forty-five seconds, we had reached common knowledge that he was indeed negligent, but also that negligence was statistically understandable given his workload. We ended up hugging, but the resentment remained uncategorized."

  The breakdown accelerated due to failures in establishing common knowledge of posteriors. During a dispute over household chores, Markov accused Chen of hiding her belief strength. "You said, 'I guess the dishes can wait,' but your utterance failed to make your posterior common knowledge," Markov told reporters. "I couldn't tell if your certainty was 0.6 or 0.9. Without common knowledge of our certainties, the theorem doesn't hold, so I couldn't update properly. So I just didn't do the dishes."

  Couples therapy proved equally futile. Their therapist, Dr. Arthur Hume, a self-described dogmatist, insisted that healthy relationships require sustained conflict. "The moment he said that, we both updated toward the belief that he was right," said Chen. "But if we agree he's right, we aren't having sustained conflict, which proves he's wrong. We spent fifty minutes converging on the consensus that therapy was useless. This confirmed his hypothesis that we avoid conflict, which made us agree we should fight, which made us agree we shouldn't."

  Friends of the couple noted that the mere existence of ongoing strife suggests dishonesty. "If they were really both honest Bayesians, the fact that they're still fighting is evidence one of them is lying about their posterior," said friend and game theorist Sarah Jenkins. "Also, every time Bob tries to pick an argument just for fun, Alice invokes the no-trade theorem. She tells him there's no expected value in betting against her assessment of his mood."

  Currently, the couple agrees on every asset division detail, except for whether they originally shared a prior. "We agree the marriage is over, we agree on who gets the cat, we agree on the alimony," said Markov. "But we can't finalize the divorce papers because we can't agree on whether we started from the same baseline. If we didn't share a prior, the last three years were invalid. If we did, we're liars."

  At press time, the couple was seen sitting in silence, unable to file for divorce, as the process of exchanging information regarding their incompatibility continually updated their posteriors toward the consensus that the marriage was salvageable.
