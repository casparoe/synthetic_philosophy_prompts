answer: |-
  There is no single, canonical term in political philosophy or legal theory that exclusively names this specific pattern. However, your observation identifies a well-known fault line in the literature surrounding the **Freedom of Association (FoA) argument** for border control (most prominently associated with Christopher Heath Wellman).

  In existing discourse, this is typically described as the **tension between collective and individual association**, or the **conflict of associative claims**. It is sometimes framed as the problem of **"associative standing."**

  Since no established proper noun exists, I propose we label this **"The Associative Reciprocity Gap."**

  Below is the conceptual breakdown of this gap, how it differs from neighboring ideas, and the philosophical conditions required to close it without abandoning the club analogy.

  ### 1. Characterizing the Associative Reciprocity Gap

  The gap arises when the **Freedom of Association** is invoked as a *negative right* for the collective (the state may disassociate from outsiders) but is suppressed as a *positive right* for the individual (the citizen may not associate with outsiders).

  *   **The Exclusion Claim:** The state argues that forcing it to admit non-members violates its freedom of association (just as a private club cannot be forced to admit members).
  *   **The Inclusion Claim:** The citizen argues that preventing them from hiring, housing, or marrying a non-member violates *their* freedom of association (just as a club member cannot be prevented from interacting with a guest).

  **The Asymmetry:** In the standard statist argument, the collective's right to disassociate trumps the individual's right to associate. The state acts as a gatekeeper not just for the border, but for the associative rights of its own members.

  ### 2. Distinctions from Neighboring Concepts

  To ensure conceptual precision, we must distinguish the Associative Reciprocity Gap from two adjacent ideas:

  **A. The General Right to Exclude (Property Rights)**
  *   *Concept:* This is based on ownership and jurisdiction. A homeowner has a right to exclude trespassers.
  *   *Difference:* The Right to Exclude is about *control over resources/territory*. The Associative Reciprocity Gap is about *relational liberty*. You can have a right to exclude someone from your land (property) while still wishing to associate with them economically or socially. The Gap highlights that the state blocks the *relationship*, not just the *presence*.

  **B. The Exit/Entry Asymmetry**
  *   *Concept:* International law generally recognizes a right to *exit* one's country but not a right to *enter* another.
  *   *Difference:* Exit/Entry focuses on the **migrant's** liberty of movement. The Associative Reciprocity Gap focuses on the **citizen's** liberty of connection. Even if a migrant has no right to enter, the citizen might claim a right to *invite*. The Gap exists even if the migrant stays put; it is about the severing of the potential bond between resident and outsider.

  ### 3. How to Avoid the Asymmetry (Without Dropping the Club Analogy)

  If a theorist wishes to retain the "State as Club" analogy but close the Associative Reciprocity Gap, they must adopt one of two consistent positions. They cannot have it both ways (i.e., they cannot claim the state is *exactly* like a private club regarding exclusion but *unlike* a private club regarding inclusion).

  **Option A: The Libertarian Consistency (Prioritize Individual Association)**
  *   *Claim:* If the state is a club, its members (citizens) hold the ultimate associative rights. Just as a member of a private club can usually bring a guest (subject to broad rules), citizens should have a presumptive right to sponsor outsiders.
  *   *Result:* This leads to a demand-driven immigration system. The state can set broad safety/health criteria (like a club requiring guests to be clothed), but cannot veto specific associative acts (employment, residence) without violating the member's associative freedom.
  *   *Cost:* This significantly weakens the state's ability to restrict numbers, potentially undermining the "self-determination" argument for borders.

  **Option B: The Hierarchical Consistency (Prioritize Collective Association)**
  *   *Claim:* The state is not a flat association of peers; it is a **fiduciary association**. In this view, the "Club" (the State) acts as the trustee for the members.
  *   *Result:* Individual associative rights are derivative, not fundamental. A member of a country club does not have an inherent right to invite a non-member onto the greens; the *Board* decides. Therefore, the citizen's right to associate is conditional on the collective's prior consent.
  *   *Cost:* This requires admitting that the "Freedom of Association" argument is not about *liberty* in the liberal sense, but about *sovereignty*. It concedes that the state restricts the liberty of its own citizens to preserve the collective entity.

  ### 4. The Strongest Defense of the Asymmetry

  If one wishes to defend the asymmetry (State can exclude, Individual cannot include) without abandoning the club analogy entirely, the strongest argument relies on the **Distinction between Constitutive and Derivative Association.**

  **The Argument:**
  1.  **Constitutive Association:** The State's association is *constitutive* of the legal order in which individual association takes place. Before you can exercise a right to hire or host (individual association), the legal framework (collective association) must exist.
  2.  **The Precondition Claim:** The collective's right to define its membership is a logical precondition for the individual's rights within that membership. If the collective cannot exclude, it ceases to be a distinct association, and the specific rights of membership (including the right to invite) dissolve into general human rights.
  3.  **The Territorial Constraint:** Unlike a standard club, a state's association is inextricably linked to *territory*. To "include" someone via employment or housing is to grant them physical presence. Because the state holds ultimate jurisdiction over the territory (the "clubhouse"), it retains a veto over physical inclusion to prevent the "club" from being overcrowded or fundamentally altered, even if individual members wish otherwise.

  **Boundary Cases where this Defense Fails:**
  *   **Family Reunification:** Most states concede the Associative Reciprocity Gap here. They allow citizens to sponsor spouses/children. This admits that individual associative rights *do* sometimes trump collective exclusionary preferences. The defense must explain why economic association (employment) is less vital than familial association.
  *   **Digital Association:** If a citizen wishes to associate with an outsider digitally (contracting remote work), the state's territorial veto is weaker. Strict border control advocates who also oppose remote outsourcing reveal that their concern is often economic protectionism masked as associative freedom.

  ### 5. Summary Definition

  **The Associative Reciprocity Gap:**
  > The argumentative inconsistency wherein the Freedom of Association is invoked to justify a political community's right to exclude non-members (collective negative liberty), while simultaneously denying that same freedom to community members who wish to include non-members through private contracts, property rights, or sponsorship (individual positive liberty).

  **To close the gap:** A position must either grant individuals a **Right to Invite** (making immigration demand-driven) or explicitly admit that **Collective Self-Determination** trumps **Individual Associative Liberty** (making the "club" analogy hierarchical rather than voluntary). To claim both that the state is a voluntary club *and* that members cannot choose their associates is to commit the Associative Reciprocity Gap.
