      *   *Let's go with the **Utilitarian/Consequentialist** defense of the Split.*
      *   *Reasoning:* The Utilitarian bloc is the largest (3/7). They care about *results*. The current procedure yields no results. A proportional split yields results. Therefore, a Utilitarian should vote for the split to ensure *some* utility is generated, rather than *no* utility is generated due to procedural gridlock. This is not "fatigue," it is "constraint optimization."
