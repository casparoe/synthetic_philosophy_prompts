      *   *Wait, I need to address the Economist's Rejoinder.*
      *   If I reject Confidence-Weighting, I must answer: "We all implicitly perform cross-outlook comparisons whenever any one of us changes our mind about morality."
      *   *Answer:* Changing one's mind is a Bayesian update within a single agent's cognitive architecture. Aggregating confidence across agents requires a common metric of "moral truth" that is interpersonally comparable. Agent A's "80% confident" is not necessarily equivalent to Agent B's "80% confident" regarding moral truth. It creates a false precision that masks power dynamics.

