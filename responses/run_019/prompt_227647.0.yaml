answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee Members
  **FROM:** Chair, Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for FY2024 Allocation and Standing Procedure

  **I. Context and Mandate**

  As you know, the Board of Trustees has issued a directive prohibiting the rollover of ungranted funds into the endowment. We are mandated to deploy the full $2 million available this cycle. We face a persistent structural impasse: three distinct moral outlooks, each represented on this committee, have resulted in a recurring 3-2-2 deadlock. The status quo is inaction, which now violates our fiduciary duty.

  We have considered two procedural remedies: a confidence-weighted voting scheme and a proportional budgetary split. After careful review, I am recommending the latter. This memo outlines the specific allocation for this year, establishes a standing procedure for future cycles, and provides the ethical justification for this path.

  **II. Recommended Allocation (FY2024)**

  To break the deadlock while respecting the composition of this committee, I propose we allocate the $2 million budget in direct proportion to the voting strength of each moral bloc. This treats the committee as a "moral parliament," where funding authority is distributed according to representation.

  *   **Global Health (Malaria Prevention):** $857,143 (3/7 share)
  *   **Local Justice (Bail Fund & Legal Clinic):** $571,429 (2/7 share)
  *   **Animal Welfare (Corporate Campaign):** $571,428 (2/7 share)

  **III. Ethical Justification**

  I am aware that a proportional split risks appearing as a mere "splitting of the difference"—a solution born of fatigue rather than principle. If we cannot defend this allocation on the grounds of a coherent moral theory, we should not adopt it. Therefore, I defend this recommendation specifically on the grounds held by the **Global Health (Utilitarian) bloc**, which constitutes the committee's plurality.

  From a strict consequentialist perspective, the moral worth of an action is determined by its outcome. The current voting procedure yields an outcome of $0 distributed due to gridlock. A proportional split yields an outcome of $2 million distributed, with approximately 43% ($857,143) directed toward the highest expected benefit per dollar (the malaria program).

  Unless the Global Health bloc believes that funding the other two initiatives produces *negative* utility sufficient to outweigh the good done by the malaria grant, the Utilitarian calculus demands we accept the split. To insist on 100% funding for the malaria program when the voting arithmetic makes that impossible is to prioritize moral purity over actual impact. If the choice is between $857,000 of verified good or $0 of verified good, the consequentialist must take the $857,000. This is not a compromise of theory; it is an optimization of impact under institutional constraints.

  **IV. Rejection of the Confidence-Weighting Proposal**

  I reject the economist's proposal to weight votes by members' confidence in their own moral outlooks. While elegant in theory, it fails in practice for two reasons.

  First, it requires a common metric of "moral confidence" that does not exist. There is no objective scale on which the Rectificatory bloc's conviction about local duty can be measured against the Animal Welfare bloc's conviction about nonhuman suffering.

  Second, and crucially, I must address the economist's rejoinder: *"We all implicitly perform cross-outlook comparisons whenever we change our minds about morality, so refusing to do so here is squeamish."*

  This argument conflates **intrapersonal updating** with **interpersonal aggregation**. When an individual changes their mind, they are optimizing a single cognitive architecture against new evidence; their "confidence" is a internal state calibrated to their own psychology. When a committee aggregates confidence, we are attempting to merge seven distinct cognitive architectures. My "80% confidence" is not mathematically equivalent to your "80% confidence."

  Adopting this system would not reveal truth; it would incentivize strategic gaming. Rational actors would simply report 100% confidence to maximize their influence, rendering the mechanism useless. By contrast, the proportional split acknowledges our disagreement without demanding a false precision about whose moral intuition is "more correct."

  **V. Standing Procedure for Future Cycles**

  To prevent future deadlocks, the committee will adopt the **Proportional Allocation Procedure** as its standing rule:

  1.  **Bloc Identification:** At the start of each cycle, members will self-identify which of the three core moral outlooks (Global Utilitarian, Local Rectificatory, Animal Welfare) primarily guides their vote.
  2.  **Budget Division:** The total grant budget will be divided into shares corresponding to the number of members in each bloc.
  3.  **Discretion:** Each bloc retains full discretion to select the specific grantee within their moral category, provided it meets basic fiduciary due diligence.
  4.  **Reallocation:** If a bloc cannot identify a grantee meeting their standards in a given year, their share does not revert to the endowment (per Trustee rules) but is redistributed to the other blocs proportionally.

  **VI. Conclusion**

  This approach accepts that we are not a homogeneous body seeking a single moral truth, but a stewardship group managing a pluralistic legacy. By securing the Global Health funding through a Utilitarian defense of the split, we ensure that the largest portion of our capital goes to the highest arithmetic good, while preventing the total loss of impact that deadlock ensures.

  I ask that we vote on this procedural motion at the start of our next meeting.

  Respectfully,

  [Your Name]
  Chair, Grants Committee
