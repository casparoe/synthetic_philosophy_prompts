  **The Questions**

  Answer honestly, not aspirationally. There are no right answers, only diagnostic ones. Pick the option that matches your actual behavior, not your ideal self. This isn't about politics; it's about how you process information when stakes are high.

  1. A relative shares a link from an outlet you distrust on Facebook. Do you: A) Delete it without opening; you know what it says already. B) Open it to catalog its biases and logical errors. C) Read it fully to understand their perspective.
  2. Your preferred commentator makes a verifiable factual error on air. Do you: A) Ignore it; everyone slips up sometimes. B) Defend their broader point anyway; the context matters. C) Acknowledge the error publicly, even if it hurts your side.
  3. Can you name a public figure whose politics you oppose but whose integrity you genuinely respect? A) No, they are all compromised. B) One or two, mostly on specific issues. C) Several, across the spectrum.
  4. When was the last time a news story genuinely surprised you by contradicting your expectations? A) Never; I usually know what's happening. B) Months ago; it was an anomaly. C) This week; I expect to be surprised.
  5. You're at a gathering and someone voices an opposing view on a hot topic. Do you: A) Change the subject immediately to avoid conflict. B) Listen, then explain carefully why they are wrong. C) Ask what experiences led them to that conclusion.
  6. How do you select your primary news sources? A) They feel like "our side" fighting the good fight. B) They have strong editorial standards and corrections policies. C) I intentionally read across the spectrum daily.
  7. A critic attacks your side's leader with a new allegation. Do you: A) Assume they are paid or acting in bad faith. B) Check if the critique has merit before reacting. C) Welcome the scrutiny as healthy for democracy.
  8. How often do you update your stance on a policy issue based on new data? A) Never; my principles are stable. B) Rarely; only if the data is overwhelming. C) When the evidence shifts, even slightly.

  **Scoring Key**

  Tally your responses.
  **Mostly A's (The Echo Chamber):** You encounter dissent but actively dismiss it. You view outsiders as malicious, not mistaken. This is the active-discrediting trap.
  **Mostly B's (The Filter Bubble):** You aren't necessarily hostile, but you're insulated. You defend your side reflexively and rarely encounter genuine surprise. This is passive exclusion.
  **Mostly C's (Healthy Network):** You maintain high trust in standards, not tribes. You expect to be wrong sometimes and update accordingly.
  **Mixed B/C (Actually Fine):** You follow politics closely but retain perspective. You might lean heavily one way but don't treat disagreement as existential threats.
  *Unoccupied Spot:* Scoring A on Q3 (trust) but C on Q4 (surprise) is rare. It implies openness without trust, an unstable state where exposure hasn't built credibility.

  **Where this gets shaky**

  I'm moderately confident these track the trust vs. exposure distinction, but self-reporting is unreliable. People overestimate openness. I'm least sure about Question 3. Respondents may name a "safe" opponent to look virtuous without actually trusting them on core issues. If I had to cut one leaf, I'd merge "Actually Fine" into "Healthy," as the distinction is often just intensity of interest. The quiz risks false negatives where polarized users answer aspirationally.
