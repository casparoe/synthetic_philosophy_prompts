answer: |-
  This is a productive derailment. You have identified the exact point where the philosophy of cultural evolution ossified into a gatekeeping exercise rather than a mechanistic one. The Darwin quote from the *Descent of Man* preface is not merely historical context; it is a license to dismantle the "Strict Selectionist" requirement that currently dominates the field.

  If Darwin—the namesake of the analogy—explicitly endorsed a pluralism of mechanisms (selection + use/disuse + direct induction), then the field's obsession with "Is culture *really* Darwinian?" (coded as: Does it have high-fidelity replicators and blind variation?) is based on a caricature of Darwinism.

  Here is the recommended ordering of questions for your seminar's final two sessions and the second half of your paper, structured by logical dependency (upstream to downstream).

  ### 1. The Upstream Question: What is the "Darwinian" Algorithm?
  **Status:** *Promote to Primary.*
  **Current Field Status:** Treated as a gatekeeping threshold (Replicators + Blind Variation + Selection).
  **Revised Status:** Treated as a historical lineage concept allowing mechanistic pluralism.

  **Why it is upstream:** You cannot determine if variation is "guided" or if units are "replicators" until you define what work the label "Darwinian" is supposed to do. Currently, the field treats "Darwinian" as an algorithmic claim (Lewontin's three conditions: variation, heredity, differential fitness). Your Darwin quote shows that historically, "Darwinian" was a *historical* claim (descent with modification via a mix of causes).

  **Seminar Session 1 Plan:** *Beyond the Replicator.*
  *   **Core Text:** The Darwin preface passage + Peter Godfrey-Smith's *Darwinian Populations and Natural Selection* (specifically his distinction between "Darwinian" and "Biparental" or "Scaffolded" populations).
  *   **Discussion:** If Darwin allowed "use and disuse" (a transformational mechanism) and "direct action of conditions" (a structuralist mechanism), why does memetics demand copying fidelity?
  *   **Philosophical Tractability:** This is conceptual analysis. Empiricists measure fidelity; philosophers determine whether fidelity is *necessary* for the label "evolutionary."
  *   **Paper Move:** Argue that the "Strict Selectionist" definition is a post-Dawkinsian invention that excludes the actual Darwin. Propose replacing the "Replicator" requirement with a "Lineage + Mechanism Pluralism" requirement.

  ### 2. The Core Question: The Role of Agency in Variation
  **Status:** *Reframe.*
  **Current Field Status:** A problem to be solved (How do we fit intentionality into blind variation?).
  **Revised Status:** A feature to be modeled (Guided variation as a valid evolutionary mechanism).

  **Why it is second:** Once you loosen the definition of "Darwinian" (Question 1), the problem of "Guided Variation" dissolves into a question of *weighting*. If "use and disuse" counts for Darwin, then intentional modification counts for cultural evolution. The question is no longer "Does intentionality break the model?" but "Under what conditions does intentional variation swamp selection?"

  **Seminar Session 2 Plan:** *Intentionality as Mechanism.*
  *   **Core Text:** Kevin Laland's *Darwin's Unfinished Symphony* (Niche Construction) vs. Dan Sperber's *Cultural Attractors*.
  *   **Discussion:** Sperber argues against replication in favor of transformation (attraction). Laland argues for niche construction where organisms (humans) modify their own selection pressures. Both align better with Darwin's "use/disuse" pluralism than Dawkins does.
  *   **Philosophical Tractability:** Philosophers can analyze the *causal structure* of intentionality. Is intentionality an external force acting on culture, or an internal mechanism of cultural transmission?
  *   **Paper Move:** Don't ask if variation is blind. Ask if the *source* of variation (internal cognitive bias vs. external selection pressure) changes the explanatory target. Use Darwin's "mind" reference to argue that mental habits are evolutionary mechanisms, not exceptions to them.

  ### 3. The Downstream Question: Explanatory Adequacy vs. Social History
  **Status:** *Keep, but shift the burden of proof.*
  **Current Field Status:** "Does this model predict things history doesn't?"
  **Revised Status:** "Does this pluralist model explain *stasis* and *directionality* better than selection alone?"

  **Why it is downstream:** This is the payoff. If you establish that cultural evolution is a mix of selection, transformation (attraction), and induction (direct action), you can explain things strict selectionism cannot. For example, strict selectionism struggles to explain why some inefficient cultural traits persist (attractors) or why rapid directed change occurs (guided variation).

  **Paper Move:** This is where your second half lands. Argue that the "Strict Selectionist" model fails to explain cultural history not because culture isn't evolutionary, but because the model is too narrow. A Darwinian Pluralist model (Selection + Attraction + Induction) subsumes "Social History" rather than competing with it.

  ---

  ### What Gets Demoted?
  **The "Replicator Existence" Debate.**
  Currently, massive energy is wasted asking "Are there cultural replicators?" (Hull, Dawkins, Dennett). If Darwin's "use and disuse" is legitimate evolutionary mechanism, then high-fidelity copying is not required for evolution to occur. Low-fidelity transmission with strong *transformational biases* (attractors) can produce lineage patterns.
  *   **Action:** In the seminar, treat the replicator debate as a historical artifact of the 1970s-90s, not a live ontological problem.
  *   **Action:** In the paper, explicitly state that demanding replicators is a "physics envy" mistake that ignores Darwin's own biological pluralism.

  ### What Gets Promoted?
  **The "Mechanism Interaction" Question.**
  Instead of "Is it Selection or Attraction?", the question becomes "How do Selection, Attraction, and Induction interact in this specific domain?"
  *   **Why:** This is where the philosophy meets the science. It allows you to categorize cultural domains. Language might be high on Attraction (cognitive constraints); Technology might be high on Selection (market fitness); Ritual might be high on Induction (direct environmental response).

  ### Empirical Triggers for Re-ranking
  You asked what result would change this ranking.
  1.  **If Cognitive Science finds High-Fidelity Copying:** If future research shows humans possess a specialized "imitation module" that creates near-perfect copying fidelity (contrary to current evidence which favors reconstructive memory), the **Replicator Question** shoots back to #1. The Strict Selectionist model would regain traction.
  2.  **If Historical Modeling fails:** If quantitative cultural phylogenetics consistently fails to predict historical outcomes better than standard historiography *even when using pluralist models*, then the **Explanatory Question** (#3) becomes the primary bottleneck. The field would face an existential crisis regarding its utility.

  ### Summary for the Paper's Second Half
  Your paper should pivot from defending cultural evolution against critics to **critiquing the defenders' narrowness.**
  *   **Thesis:** The philosophy of cultural evolution is stuck defending a "Strict Selectionism" that Darwin himself rejected.
  *   **Argument:** By reclaiming Darwin's methodological pluralism (Selection + Use/Disuse + Direct Action), we can dissolve the "Replicator" bottleneck and integrate "Attractor" theories without abandoning the Darwinian label.
  *   **Conclusion:** The organizing question shifts from "Is culture Darwinian?" to "Which mix of evolutionary mechanisms best explains this cultural lineage?"

  This approach uses the Darwin quote not as a trivia point, but as a wedge to open the field up. It makes your seminar's conclusion forward-looking (mechanistic integration) rather than backward-looking (defending memetics). It also gives you a clear, argumentative spine for the rest of your paper: you aren't just reviewing the literature; you are correcting a genealogical error in how the literature reads its own namesake.
