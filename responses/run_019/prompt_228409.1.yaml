answer: |-
  This is a fantastic set of questions. You have hit on one of the most interesting tensions in political philosophy: the gap between *statistical* peace and *philosophical* security.

  If you brought Steven Pinker's *The Better Angels of Our Nature* (the main text arguing violence has declined) to Thomas Hobbes, he wouldn't dismiss the data, but he would interpret the *meaning* of that data very differently than a modern liberal optimist would.

  Here is how Hobbes would likely dismantle and reconstruct your three points, based on the text of *Leviathan*.

  ### 1. On the Definition of War (The Cold War Problem)

  You are absolutely right about Hobbes' definition. In Chapter 13 of *Leviathan*, he writes:

  > *"For WARRE, consisteth not in Battell onely, or the act of fighting; but in a tract of time, wherein the Will to contend by Battell is sufficiently known."*

  He compares this to weather: "For as the nature of Foule weather, lyeth not in a showre or two of rain; but in an inclination thereto of many days together."

  **Hobbes' Verdict:**
  He would agree with you completely regarding the Cold War. To Hobbes, the absence of shooting does not mean the absence of war if the *threat* remains. Since there is no "Global Leviathan" (a world government) to hold the US and USSR in awe, those nations exist in a **State of Nature** relative to each other.

  He famously wrote that Kings maintain a "posture of Gladiators" toward one another, with weapons pointed and eyes fixed on each other.

  **However,** Hobbes would argue this doesn't invalidate the "less violent" claim, because Hobbes cares primarily about **Civil Peace**, not International Peace.
  *   **The Individual's Perspective:** For the average subject living in London or New York, the Cold War was "peace." They could lock their doors, run businesses, and sleep without fearing their neighbor would kill them for their coat.
  *   **The Distinction:** Hobbes would say the "Decline of Violence" thesis is correct *inside* the Commonwealth (the nation-state), but incorrect *between* Commonwealths. The world is less violent for *individuals* because they live inside strong states, but the states themselves are still in a state of war.

  So, he wouldn't say the story is flipped; he would say the story is **incomplete**. It proves that *domestic* sovereignty works, but *international* anarchy remains.

  ### 2. Per Capita vs. Total Violence (The Individual's Fear)

  This is where Hobbes' philosophy is most distinct from modern utilitarianism. Modern stats often look at aggregate suffering. Hobbes looks at **individual security.**

  Hobbes' entire political project is built on the right of nature: the liberty each man has to use his own power for the **preservation of his own nature.** The driving force of his philosophy is the individual's fear of violent death.

  **Hobbes' Verdict:**
  He would care almost exclusively about **per capita** risk, not total bodies.
  *   **Why?** Because the Social Contract is made by individuals seeking to protect *themselves*. If I am a peasant in 1650, I don't care that "only" 1% of the population died in a war if I happen to be in that 1%. But, if I am a person in 2020, and the statistical likelihood of me being murdered is 1/100th of what it was in 1650, my life is objectively more "commodious" (a word Hobbes loves).
  *   **The "Fear" Metric:** Hobbes defines the misery of the State of Nature not just by death, but by the *continual fear* of it. Even if you aren't killed, living in high-crime areas where you must constantly guard your property is a form of misery.
  *   **Conclusion:** If the data shows that my *probability* of violent death is lower today, Hobbes sees that as a victory. The total death count of WWII would horrify him, but he would view it as a failure of specific Sovereigns to maintain the balance of power, not a failure of the *concept* of sovereignty. He would argue that over the long arc, the *risk* to the individual has dropped, which validates his theory.

  ### 3. State Violence vs. Private Violence (Is the Claim Rigged?)

  This is your sharpest question. You asked: *If Hobbes doesn't count state violence (police, prisons, war) as "violence," is the "world is less violent" claim rigged?*

  **Hobbes' Verdict:**
  Hobbes would say: **"It is not rigged; it is defined by Authority."**

  For Hobbes, violence is not just a physical act; it is a moral and legal category.
  *   **Private Violence:** When I hit you, it is a violation of the Law of Nature and Civil Law. It creates insecurity.
  *   **Public Violence:** When the Sovereign hits me (via police, prison, or war), it is not "violence" in the negative sense; it is **Punishment** or **Defense**.

  In *Leviathan*, Hobbes argues that the Sovereign cannot commit injustice against the subject, because the Sovereign *makes* the law. Therefore, the sword wielded by the state is not a source of fear in the same way a neighbor's sword is. It is the *guarantor* of safety.

  **The "Rigged" Accusation:**
  If a modern critic says, "But the state kills people too!", Hobbes would reply:
  > *"The violence of the Leviathan is not the chaos of the State of Nature. It is the price of Order. If you count the Sword of Justice as the same as the Sword of a Murderer, you misunderstand the nature of the Commonwealth."*

  He would argue that the "Decline of Violence" thesis is valid precisely *because* we have successfully monopolized violence. The fact that violence has declined is proof that the State has successfully swallowed up private violence and turned it into public force.
  *   **Feuds are down?** Because the State punishes revenge.
  *   **Crime is down?** Because the State polices.
  *   **War is (sometimes) down?** Because the State deters.

  He would admit that the statistics favor the State, but he would argue that is **the point of civilization.** To complain that the data excludes state violence is, to Hobbes, to complain that a dam holds back water. Yes, the dam is a barrier, but without it, everything floods.

  ### So, What Would Hobbes Actually Say?

  If you sat Hobbes down with a laptop showing the graphs of declining homicide rates and battle deaths, here is his likely summary:

  1.  **Vindication, not Optimism:** He would not say, "Human nature has improved!" (He hated human nature). He would say, "This proves that **Authority works.**" The decline in violence is evidence that the Leviathan is doing its job.
  2.  **A Warning Against Complacency:** He would be deeply suspicious of the "optimism." He would warn that this peace is artificial and fragile. It exists only as long as the Sovereign is strong enough to keep everyone in awe. If the State weakens, the "disposition to fight" (which never goes away) will return to actual fighting very quickly.
  3.  **The International Caveat:** He would point to the nuclear arsenals and say, "See? The world is not at peace. The Giants are still in the posture of Gladiators. Do not confuse the safety of your street with the safety of the world."

  **In short:** Hobbes would accept the data but reject the moral. He wouldn't see a "Better Angel" in humanity; he would see a well-oiled machine of coercion that is successfully suppressing our natural instincts. He would tell you to be grateful for the "rigged" statistics, because the alternative isn't honest statistics—it's a bloody field.
