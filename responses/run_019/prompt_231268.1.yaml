answer: |-
  # The Welfare Compass: A Map of Moral Intuitions
  **From the pages of *The Public Square Review***

  Most people agree on the slogans. Benefits should go to the deserving. No one should be better off on welfare than in work. The system shouldn't humiliate people. But when a concrete case is put in front of us—a single parent, a disabled worker, a fraudster—those slogans fracture.

  We commissioned this instrument not to tell you what is right, but to show you what you actually believe. It is built not from political labels, but from the logical space of the arguments themselves. Below, you will find the map of that space, the instrument to locate yourself within it, and the description of the position you hold.

  ---

  ## Part I: The Logical Map
  *How we built the tree.*

  To find where people actually stand, we identified three fault lines that run through every welfare debate. We then tested four specific cases against these lines to see which combinations of beliefs form a coherent position and which collapse under their own weight.

  ### The Three Fault Lines
  1.  **The Attribution of Failure:** When a claimant struggles, is it primarily a matter of **Individual Choice** (they chose not to try) or **Situation/Structure** (the barriers were too high)?
  2.  **The Basis of Entitlement:** Why does someone get money? Is it **Need** (they are hungry), **Desert** (they worked/try), or **Reciprocity** (they belong to the community)?
  3.  **The Purpose of Conditions:** Why do we have rules? To **Catch the Undeserving** (policing), to **Support Compliance** (helping), or to **Discipline** (coercion)?

  ### The Four Diagnostic Cases
  Every question in the quiz below is anchored in one of these scenarios. They were chosen because they force a choice between the fault lines.
  1.  **The Fraudster:** Someone able to work who deliberately claims benefits repeatedly.
  2.  **The Anxious Claimant:** Someone who misses an appointment due to undisclosed mental health issues.
  3.  **The Single Parent:** Offered a job during school hours with no childcare available.
  4.  **The Partial Disability:** A claimant whose health improves but not enough for steady work.

  ### The Empty Quadrants
  *Combinations of answers that yield no coherent position.*
  In mapping the logical space, we found several combinations that respondents rarely hold because they are internally contradictory or morally unattractive. These are marked as **Empty**.

  *   **Empty Type A (The Contradiction):** Believes entitlement is based *only* on Need, but also believes sanctions should be applied for missed appointments.
      *   *Diagnosis:* **Incoherent.** If need is the only criteria, failing a procedural test cannot remove the entitlement without denying the premise.
  *   **Empty Type B (The Free Rider):** Believes conditions should be *only* supportive (no punishment), but also believes fraudsters should face no consequences.
      *   *Diagnosis:* **Unattractive/Unexplored.** This undermines the reciprocity required to fund the support. It is rarely advocated explicitly.
  *   **Empty Type C (The Structural Hypocrite):** Believes barriers are purely Structural (employers are at fault), but also believes claimants must accept any job offer immediately.
      *   *Diagnosis:* **Incoherent.** You cannot blame the structure for the lack of jobs while punishing the individual for not taking the jobs that don't exist or don't fit.

  ### The Six Valid Leaves
  The quiz funnels you toward one of these six positions. Four are mandatory based on common public intuitions; two emerge from the logical combinations of the fault lines.

  1.  **The Lifeline:** Help is unconditional; need alone settles the question.
  2.  **The Paycheck:** Help must be earned through demonstrated effort.
  3.  **The Handrail:** Conditions are acceptable only as support, not punishment.
  4.  **The Market Fix:** Binding conditions belong on employers, not claimants.
  5.  **The Gatekeeper:** The system must prioritize catching the undeserving to protect the pot.
  6.  **The Steward:** Entitlement rests on community reciprocity; contribution matters, but not just wages.

  ---

  ## Part II: The Instrument
  *Instructions: Read each scenario and select the response that feels most fair to you. Do not overthink; go with your instinct.*

  **1. The Case of the Repeated Fraudster**
  A person who is physically able to work has deliberately claimed benefits they were not entitled to, multiple times, while hiding income. What is the primary reason this is wrong?
  *   **A.** It steals resources from people who truly cannot work.
  *   **B.** It breaks the social contract; everyone must contribute if they can.
  *   **C.** It suggests the system is too easy to game; the rules need tightening.

  **2. The Case of the Missed Appointment**
  A claimant misses a mandatory work-search meeting. Later, it emerges they were suffering from severe anxiety they were too ashamed to disclose. What should happen?
  *   **A.** The sanction should stand. Rules must be consistent to be fair.
  *   **B.** The sanction should be waived, and someone should reach out to offer help.
  *   **C.** The sanction should be waived. Their need for support hasn't changed.

  **3. The Case of the Single Parent**
  A single parent is offered a job that pays well but runs during school hours. There is no affordable childcare available. Should they be required to take the job?
  *   **A.** Yes. Work is the priority; they must find a solution for childcare.
  *   **B.** No. Raising children is a contribution; the state should support that.
  *   **C.** No. The job offer is the problem; employers should accommodate school hours.

  **4. The Case of the Partial Disability**
  A disability claimant's condition improves. They can work some hours, but not enough to live on without top-up benefits. What should the system do?
  *   **A.** Reduce the benefit to encourage them to find the extra hours needed.
  *   **B.** Keep the benefit stable. Stability is necessary for health.
  *   **C.** Allow partial benefits without pressure to increase hours immediately.

  **5. The Purpose of Rules**
  In general, why do we attach conditions to welfare payments?
  *   **A.** To ensure taxpayers aren't funding idleness.
  *   **B.** To keep people connected to the labor market and support networks.
  *   **C.** To ensure people get the help they need, even if they don't ask for it.

  **6. The Locus of Change**
  If unemployment is high in a region, who should change their behavior?
  *   **A.** Claimants should move or retrain to find available work.
  *   **B.** Employers should create suitable roles or pay enough to cover costs.
  *   **C.** The Government should provide jobs or income regardless of the market.

  **7. The Nature of Sanctions**
  When a claimant fails to meet a requirement (like training), what is the goal of reducing their payment?
  *   **A.** To punish non-compliance and deter others.
  *   **B.** To leverage them into accepting help they might otherwise refuse.
  *   **C.** There should be no reduction of payment; it causes harm.

  **8. The Definition of Contribution**
  What counts as "doing your part" for society?
  *   **A.** Paid employment only.
  *   **B.** Paid work, caregiving, or volunteering.
  *   **C.** Simply being a member of the community is enough.

  ---

  ## Part III: Scoring Key & Results

  *Tally your answers. Find the letter you selected most frequently. If you have a tie, read the descriptions for both; you likely sit on the border.*

  ### If you scored mostly A: The Gatekeeper
  **Your View:** The system is a pot of money that must be protected.
  **On Conditions:** You see conditions primarily as a way to **catch the undeserving**. If people can game the system, the truly needy suffer.
  **On Entitlement:** You lean toward **Desert**. Benefits are a safety net, but they must be earned by proving you cannot work or by trying hard to find it.
  **On Failure:** You tend to view failure as **Individual Choice**. If someone misses an appointment or commits fraud, it is a moral failing.
  **Blind Spot:** You may underestimate how structural barriers (like childcare costs) make "choice" impossible for some.

  ### If you scored mostly B: The Handrail
  **Your View:** The system is a bridge back to stability.
  **On Conditions:** You accept conditions, but only when they function as **support rather than punishment**. Rules should guide people, not trap them.
  **On Entitlement:** You lean toward **Reciprocity**. You want people to contribute, but you define contribution broadly (including trying to comply).
  **On Failure:** You see failure as a mix of **Choice and Situation**. Anxiety or barriers matter, but engagement still matters.
  **Blind Spot:** You may struggle to define where "support" ends and "coercion" begins when a claimant refuses help.

  ### If you scored mostly C: The Lifeline
  **Your View:** The system is a fundamental human right.
  **On Conditions:** You believe help should be **unconditional because need alone settles the question**. Sanctions are counter-productive.
  **On Entitlement:** You rest entitlement on **Need**. If you are here and you are struggling, you deserve help.
  **On Failure:** You view failure primarily as **Situation and Structure**. Fraud is rare; desperation is common.
  **Blind Spot:** You may find it difficult to address the genuine minority of cases where fraud occurs without undermining your principle of non-conditionality.

  ### If you scored mostly A (with high A on Q3 & Q6): The Paycheck
  **Your View:** The system is a contract for labor.
  **On Conditions:** Conditions are to **discipline people into compliance**. Work is the only valid contribution.
  **On Entitlement:** Help must be **earned through demonstrated effort**.
  **On Failure:** Failure is **Individual Choice**. If a parent can't find childcare, that is their problem to solve, not the state's.
  **Blind Spot:** You may overlook how low wages or rigid hours make work an net loss for some families.

  ### If you scored mostly B (with high B on Q3 & Q6): The Market Fix
  **Your View:** The system regulates the economy, not just the poor.
  **On Conditions:** **Binding conditions belong on employers and institutions rather than claimants.**
  **On Entitlement:** You lean toward **Reciprocity**, but the reciprocity is from the market to the worker, not just worker to state.
  **On Failure:** Failure is **Situation and Structure**. If a job doesn't fit school hours, the job is the problem.
  **Blind Spot:** You may underestimate the difficulty of regulating employers without causing them to hire fewer people.

  ### If you scored mostly B (with high B on Q8): The Steward
  **Your View:** The system is a community membership card.
  **On Conditions:** Conditions should encourage **community contribution**, not just wage labor.
  **On Entitlement:** Entitlement rests on **Reciprocity**. You belong, so you get help; you get help, so you contribute how you can.
  **On Failure:** Failure is a breakdown in **Support**. If someone isn't contributing, the community hasn't enabled them.
  **Blind Spot:** Defining "contribution" can be subjective and hard to administer fairly.

  ---

  ## Part IV: Limitations & Overlaps

  *No instrument cuts perfectly clean. Be aware of the following overlaps.*

  **The Handrail vs. The Steward**
  These two positions are often **indistinguishable** in practice. Both support conditionality, but both reject punishment. The *Handrail* focuses on labor market compliance; the *Steward* focuses on broader social contribution. If you scored a mix of Bs, you may simply believe in "kind conditionality" without caring about the specific label.

  **The Gatekeeper vs. The Paycheck**
  These two share a harsh view of sanctions but differ on *why*. The *Gatekeeper* wants to stop fraud (protecting the pot); the *Paycheck* wants to enforce labor (protecting the work ethic). In policy terms, they often vote the same way, but their moral reasoning differs.

  **The Empty Zones**
  If you found yourself wanting to select answers that led to the **Empty Quadrants** described in Part I (e.g., "Need is all that matters" but "Fraudsters must be jailed"), you are not alone. This instrument forces you to resolve that tension. Most people hold these contradictory views simultaneously until forced to choose. Your result indicates which side of the contradiction wins when pushed.
