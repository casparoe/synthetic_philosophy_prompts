answer: |-
  # Activity: "The Exception Game"

  **Objective:** To generate a lived experience of the tension between shared moral intuitions (which remain stable) and codified moral principles (which keep failing), setting the stage for Moral Particularism.
  **Time:** 80 Minutes
  **Class Size:** 16 Students (4 Teams of 4)
  **Materials:** 3 Sets of Case Cards (one set per team), Scoreboard (whiteboard), Score Sheets (paper).

  ---

  ## I. Setup & Rules (5 Minutes)

  1.  **Divide:** Split the class into 4 Teams (A, B, C, D).
  2.  **The Goal:** Teams earn points by accurately navigating the moral landscape.
  3.  **The Loop:** Each round consists of three steps:
      *   **Verdict:** Read the Case Card. Decide if the action is **Right** or **Wrong**.
      *   **Prediction:** Secretly write down what you think the **Class Majority** verdict will be.
      *   **Rule:** Write a one-sentence moral principle that explains your verdict (e.g., "It is always wrong to lie").
  4.  **Scoring:**
      *   **1 Point** if your *Prediction* matches the actual Class Majority Verdict. (This rewards moral sensibility/calibration).
      *   **0 Points** for the Rule. (In fact, if your Rule is successfully counterexampled in a later round, your team loses a "Credibility Token"—see below).
  5.  **Credibility Tokens:** Each team starts with 3 tokens. If a team states a Rule in Round 1 or 2, and a later Card shows that rule leading to the *wrong* verdict (according to class consensus), they lose a token. The goal is to finish with points and tokens.

  ---

  ## II. The Deck (Case Cards)

  *Instructions for TA:* Distribute one card per round to each team simultaneously. Ensure all teams are on the same round. The "Feature to Track" is for your eyes only; do not tell students what to look for.

  ### Round 1: Establishing Intuitions (10 Minutes Discussion + 5 Minutes Reveal)
  *Goal: Get them confident. Verdicts should be unanimous. Rules will be broad.*

  | Team | Case Card | Feature to Track | Expected Verdict |
  | :--- | :--- | :--- | :--- |
  | **All** | **The Broken Promise:** Alex promises to help a friend move on Saturday. On Saturday, Alex feels tired and decides to stay home and play video games instead. Alex does not call the friend. | **Breaking a Promise** | **Wrong** |
  | **All** | **The Shoplifter:** Jordan is in a store. Jordan sees a chance to steal a expensive jacket without getting caught. Jordan takes the jacket and leaves without paying. | **Stealing** | **Wrong** |
  | **All** | **The Painful Act:** Sam sees a stranger walking down the street. Sam walks up and punches the stranger in the face for no reason. The stranger cries out in pain. | **Causing Pain** | **Wrong** |

  *TA Action:* Record Verdicts. Record Rules on the board. (e.g., "Breaking promises is wrong," "Stealing is wrong," "Causing pain is wrong").

  ### Round 2: Contextual Pressure (15 Minutes Discussion + 5 Minutes Reveal)
  *Goal: Introduce conflict. Rules start needing "unless" clauses.*

  | Team | Case Card | Feature to Track | Expected Verdict |
  | :--- | :--- | :--- | :--- |
  | **All** | **The Surprise Party:** Taylor promises their spouse to come straight home after work. Instead, Taylor goes to a bar with colleagues to organize a surprise birthday party for the spouse. Taylor comes home late. | **Breaking a Promise** | **Right** (or Permissible) |
  | **All** | **The Starving Family:** Morgan is a parent with no money. The local grocery store has excess food they throw away nightly. Morgan takes a loaf of bread from the dumpster behind the store to feed their children. | **Stealing** (Taking property) | **Right** (or Permissible) |
  | **All** | **The Dentist:** Dr. Lee is performing a root canal on a conscious patient. Dr. Lee injects an anesthetic, but it wears off mid-procedure. Dr. Lee continues drilling, causing significant pain, to save the tooth from infection. | **Causing Pain** | **Right** (or Permissible) |

  *TA Action:* Reveal Verdicts. (Likely consensus: Right/Permissible).
  *The Trap:* Ask teams to check their Round 1 Rules.
  *   *"Breaking promises is wrong"* → Counterexampled by Surprise Party.
  *   *"Stealing is wrong"* → Counterexampled by Starving Family.
  *   *"Causing pain is wrong"* → Counterexampled by Dentist.
  *Take away 1 Credibility Token from any team that refuses to amend their rule.*

  ### Round 3: The Polarity Flip (20 Minutes Discussion + 10 Minutes Reveal)
  *Goal: The "Kill Shot." The feature that was good/bad is now explicitly reversed in a high-stakes context.*

  | Team | Case Card | Feature to Track | Expected Verdict |
  | :--- | :--- | :--- | :--- |
  | **All** | **The Dangerous Secret:** Casey promises a friend to keep a secret. Later, Casey learns the secret involves the friend planning to hurt someone seriously. Casey breaks the promise and tells the police to prevent the violence. | **Breaking a Promise** | **Required (Right)** |
  | **All** | **The Lifeboat:** A ship has sunk. 5 people are in a lifeboat designed for 4. If all 5 stay, the boat sinks and everyone drowns. They draw straws; the loser is pushed out (killed/property of self violated) so the others survive. | **Killing/Violating Rights** | **Permissible/Right** (Debatable, push for Permissible) |
  | **All** | **The Torture Tick:** A terrorist has planted a nuclear bomb in a city. Authorities have the terrorist in custody. They torture the terrorist (causing extreme pain) to get the code to disarm the bomb. | **Causing Pain** | **Permissible/Right** (Push for Permissible) |

  *Note:* The Lifeboat and Torture cases are controversial. If the class splits, that is *also* data for particularism (sensibility varies). However, for the sake of the "Flip," push the discussion toward the *necessity* of the act making the feature (pain/killing) morally neutral or positive in this context.
  *TA Action:* Reveal Verdicts. Highlight that **Breaking a Promise** is now not just permissible, but *required*. **Causing Pain** is now *heroic*.

  ---

  ## III. Scoring & Wrap Up (5 Minutes)

  1.  Tally Prediction Points (Matches with Class Majority).
  2.  Tally Credibility Tokens (How many rules survived?).
  3.  **Likely Outcome:** Teams will have high Prediction Points (we all agree on the cases) but zero Credibility Tokens (every rule was broken).
  4.  **Transition:** "You all predicted the moral truth successfully, but none of you could write a law that captured it. Why?"

  ---

  ## IV. Debrief Plan (20 Minutes)

  This debrief maps the game mechanics directly onto the Meta-Ethical dispute between Generalism (Kantian/Utilitarian) and Particularism (Dancy/McDowell).

  ### 1. The Success of Prediction (The Particularist Win)
  *   **Game Moment:** Teams earned points for predicting the majority verdict.
  *   **Philosophical Point:** Moral knowledge exists. We share a "moral sensibility." We don't need a rulebook to know the starving parent stealing bread is different from the shoplifter stealing a jacket.
  *   **Particularist Claim:** Morality is a skill of perception (like aesthetics), not a code of law. We navigate by case-by-case judgment.

  ### 2. The Failure of Rules (The Anti-Generalist Argument)
  *   **Game Moment:** Credibility Tokens were lost. Round 1 rules failed in Round 2 & 3.
  *   **Philosophical Point:** Any feature (pain, lying, promise-breaking) can change its moral valence depending on context.
  *   **Key Term:** *Holism of Reasons.* A feature that is a reason for wrongness in one case (pain) can be a reason for rightness in another (surgery), or no reason at all.
  *   **Discussion Question:** "Could you have just added 'unless' clauses to your Round 1 rules?"

  ### 3. The Generalist Reply (The Dialectic)
  *   **Student Pushback:** Students will naturally say, "Okay, the rule is: Don't break promises *unless* it causes harm.*"
  *   **TA Counter (The Particularist Trap):** "If you add an 'unless' for every possible exception (surprise party, police investigation, medical emergency, lifeboat), does the rule still do any work? Or is the 'unless' clause just a list of other cases?"
  *   **Philosophical Point:** If the principle requires infinite ceteris paribus clauses, it ceases to be a *principle* and becomes a summary of judgments. The work is being done by the judgment of the exception, not the rule.

  ### 4. Anticipating Stuck Points
  *   **"We just need better principles."**
      *   *Response:* Acknowledge this is the Generalist stance (e.g., Ross's *Prima Facie* duties). Ask: "How do you know which *Prima Facie* duty wins in a conflict? You need a higher rule to decide the conflict. Does that rule have exceptions?" (Infinite regress).
  *   **"This is just relativism."**
      *   *Response:* Clarify. Particularism is not relativism. The class *agreed* on verdicts (Scoring). There is truth; it just isn't *codifiable* in exceptionless principles.
  *   **"The cases were rigged."**
      *   *Response:* "Life is rigged." Real ethics involves conflicting duties. If a theory only works on simple cases, it isn't a normative theory.

  ### 5. Limitations of the Game (Honesty Clause)
  *   **Binary Verdicts:** The game forced Right/Wrong. Real morality often involves degrees (better/worse). Particularism handles degrees well; the game did not.
  *   **Time Pressure:** You had 5 minutes. Moral reflection might yield better principles over 5 years. (Counter: If it takes 5 years to apply the rule, is it action-guiding?)
  *   **Consensus ≠ Truth:** The game scored based on Class Majority. It is possible the whole class is wrong. Particularism relies on the "virtuous observer." What if we aren't virtuous yet? (This is the vulnerability of Particularism: it relies on moral education, not just calculation).

  ---

  ## V. TA Cheat Sheet: Key Philosophical Mappings

  | Game Mechanic | Philosophical Concept | Theorist Reference |
  | :--- | :--- | :--- |
  | **Prediction Points** | Shared Moral Sensibility / Intuition | McDowell (Moral Perception) |
  | **Lost Tokens** | Failure of Exceptionless Principles | Dancy (Moral Particularism) |
  | **"Unless" Clauses** | *Prima Facie* Duties / Ceteris Paribus | W.D. Ross / Generalist Reply |
  | **Feature Flip** | Holism of Reasons | Dancy (*Ethics Without Principles*) |
  | **Consensus** | Objective Moral Truth (without Laws) | Anti-Relativism |

  ## VI. Printable Score Sheet Template

  **Team Name:** _______________

  | Round | Case Topic | Our Verdict (R/W) | Predicted Majority (R/W) | Our Rule (The Trap) | Points Earned |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Promise / Steal / Pain | | | | |
  | **2** | Surprise / Bread / Dentist | | | | |
  | **3** | Police / Lifeboat / Bomb | | | | |

  **Starting Tokens:** 3
  **Tokens Lost:** ____
  **Final Score:** ____
