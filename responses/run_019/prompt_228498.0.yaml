answer: |-
  Mary knows every physical fact about human vision, including the precise neural duration required for conscious awareness versus memory consolidation. She exits the room. A red light flashes for 120 milliseconds—sufficient to trigger phenomenal experience but, she knows, insufficient for hippocampal encoding given her current neural state. She re-enters immediately. Her brain returns to its exact pre-release baseline; she possesses no new recognitional, imaginative, or mnemonic capacities regarding red. She cannot identify red objects later, nor visualize red now. Yet, during those 120 milliseconds, there was unequivocally "something it was like" for her. She experienced redness, even if the trace vanished instantly.

  1.  **Knowledge and Verdicts:** Before release, Mary knew all physical facts including the threshold data. At release, a phenomenal event occurs but leaves no physical trace. The **Acquaintance theorist** is forced to verdict that Mary gained knowledge (the acquaintance relation occurred), even if ephemeral. The **Ability theorist** is forced to verdict that Mary gained *no* knowledge, as she retains no new abilities (recognitional, imaginative, or mnemonic) upon leaving.
  2.  **Separating Feature:** The dissociation between the threshold for phenomenal awareness and the threshold for memory consolidation. If this feature is removed (i.e., awareness entails consolidation), the experience leaves a trace, granting Mary new abilities, and the Ability reply succeeds.
  3.  **Ability Counter-Attack:** The theorist may argue Mary possessed the ability *occurrently* during the flash (e.g., the ability to say "I see red" *then*). This succeeds only if "knowledge" is redefined as momentary capacity rather than an enduring epistemic state. However, this clashes with the intuition that "gaining knowledge" implies retaining it upon leaving the room.
  4.  **Contested Reading:** This construction leans on the contested view that Acquaintance is an *event* compatible with physicalism that can exist independently of enduring dispositions. Some physicalists argue acquaintance just *is* a complex ability state; if so, the separation collapses into verbal disagreement about the duration of "states."
