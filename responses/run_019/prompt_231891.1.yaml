answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee, University Endowment
  **FROM:** Staff Analyst
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Risk-Weighted Valuation Rule

  ### **Recommendation**

  I recommend that the Committee **reject the proposed risk-weighted expected-value rule** and retain the current Expected Monetary Value (EMV) ranking methodology.

  While the motivation behind the proposal—protecting the endowment from catastrophic tail risk—is fiscally prudent, the proposed mathematical mechanism introduces significant operational risks, calibration ambiguities, and portfolio aggregation errors. The Committee can better address the concern over tail-risk-heavy strategies by retaining EMV for ranking while implementing explicit Conditional Value at Risk (CVaR) constraints on portfolio construction.

  ### **Background**

  The Committee currently ranks investment strategies based on Expected Monetary Value (EMV). A dispute arose regarding strategies with positive expected returns but significant exposure to low-probability, high-severity losses (negative skew). To address this, a member proposed a "risk-weighted expected-value rule."

  Under this proposal, outcomes are ordered from worst to best. Marginal improvements in outcomes are weighted by a transformed probability function, $r(p)$, where $r(p) < p$ for all interior probabilities. This function effectively discounts the probability of favorable outcomes and amplifies the weight of unfavorable outcomes, mathematically penalizing strategies with tail risk more heavily than standard EMV.

  ### **Analysis of the Proposed Rule**

  The proposed rule is a form of Rank-Dependent Utility (RDU) or Dual Theory of Choice. While theoretically interesting, it presents three practical hurdles for an institutional endowment:

  1.  **Calibration Risk:** The function $r(p)$ is arbitrary. Without a market-implied standard for $r$, the Committee faces the difficult task of defining *how much* to discount probabilities. A function that is too conservative could reject positive-alpha strategies that are essential for meeting the spending rate, while a function that is too lenient fails to mitigate the original concern.
  2.  **Portfolio Aggregation:** EMV is additive; the expected value of a portfolio is the sum of the expected values of its parts. The proposed risk-weighted rule is generally non-linear. A strategy that is rejected on a standalone basis might provide valuable diversification benefits when combined with others. The proposed rule makes it difficult to assess marginal contribution to portfolio risk, potentially leading to sub-optimal asset allocation.
  3.  **Manager Alignment:** External investment managers report performance and risk using standard metrics (Sharpe ratio, standard deviation, VaR) derived from mean-variance frameworks. Adopting a non-standard internal valuation rule creates friction in manager selection, mandate design, and performance attribution.

  ### **The Strongest Consideration for Adoption**

  The most compelling argument in favor of the proposed rule is the **preservation of intergenerational equity and mission security.**

  A university endowment is not a hedge fund; it cannot afford "gambler's ruin." Standard EMV is risk-neutral. Theoretically, EMV would endorse a strategy with a 99% chance of losing 50% of the portfolio and a 1% chance of gaining 6,000%, provided the mathematical expectation is positive. For a perpetual institution with fixed spending obligations, a 50% drawdown could force spending cuts that damage the university's academic mission, regardless of the eventual recovery.

  Proponents argue that embedding risk aversion directly into the valuation formula (via $r(p)$) is superior to "bolt-on" constraints because it forces every decision to internalize the cost of tail risk. It ensures that no strategy with unacceptable skewness passes the initial screening, acting as a more robust fiduciary safeguard than EMV.

  ### **Rebuttal and Alternative Approach**

  While the concern regarding ruin is valid, embedding the safeguard into the *valuation metric* is the wrong mechanism. It conflates *value creation* (EMV) with *risk management* (constraints).

  We can achieve the necessary protection against tail risk without adopting the proposed rule by augmenting the status quo with **hard risk constraints**:

  1.  **Retain EMV for Ranking:** This preserves the ability to aggregate opportunities and compare strategies on a consistent, additive basis. It ensures we do not reject diversifying hedges that might look unattractive under a pessimistic probability weighting.
  2.  **Implement CVaR Limits:** Instead of weighting probabilities, the Committee should set a maximum limit on Conditional Value at Risk (e.g., "The portfolio must not have a greater than 5% probability of losing more than 20% in any 12-month period").

  This approach addresses the "ruin" argument directly. Any strategy that threatens the solvency constraints is rejected, regardless of its EMV. However, unlike the proposed rule, this allows the Committee to see the raw expected return of a strategy separately from its risk profile, facilitating clearer debate. It also aligns with how external managers measure risk, reducing operational friction.

  ### **Conclusion**

  The proposal correctly identifies a vulnerability in pure EMV analysis but offers a solution that is mathematically complex and operationally cumbersome. By rejecting the risk-weighted rule and instead tightening the risk governance framework around the existing EMV standard, the Committee can protect the university from tail risk without sacrificing portfolio efficiency or transparency.

  **Action Requested:** Vote to reject the proposed risk-weighted valuation rule and direct Staff to draft specific tail-risk constraints (CVaR limits) for inclusion in the Investment Policy Statement.
