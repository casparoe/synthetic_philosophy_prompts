answer: |-
  The opening of "Of Cannibals" establishes a methodological distinction between unexamined cultural prejudice and rational assessment. To determine which reading fits best, we must examine how the key terms function within the argument.

  In this passage, **"barbarian"** functions as a label of exclusion based on unfamiliarity rather than an objective description of savagery. The Greeks applied it to all non-Greeks, yet Pyrrhus recognizes that the Romans possess "order," a quality incompatible with true barbarism. **"Vulgar opinion"** (or "common report") represents the uncritical acceptance of these labels; it is the habit of judging based on hearsay and cultural habit rather than evidence. Crucially, **"the eye of reason"** is posited as the corrective to vulgar opinion. It implies a faculty of observation and judgment capable of穿透 (penetrating) cultural bias to perceive underlying realities (like military discipline).

  **Custom-skepticism** aligns closely with this structure. It treats "barbarian" as a symptom of the observer's ignorance, urging suspension of judgment until the practice is understood. However, it maintains that "reason" is not merely another custom; it is a tool capable of cross-cultural validation. When Pyrrhus sees Roman order, he is not applying a specifically Greek standard that happens to match Rome; he is recognizing a universal quality of discipline that transcends the Greek/Roman divide. This reading respects the friend's intuition: the explicit appeal to reason suggests Montaigne believes humans share a capacity to recognize virtue (order) and vice (disorder) regardless of national code.

  **Code-relativism**, by contrast, struggles to make sense of the passage's normative force. If morality is strictly relative to societal codes, then "the eye of reason" is merely the observer's own customs dressed up as universal truth. Under this reading, Pyrrhus wouldn't be discovering objective order; he would just be noting that Romans match a Greek preference for order. But the text says the army "has nothing of barbarism in it," implying barbarism is a real condition detectable by reason, not just a label violated by code-switching. Furthermore, the injunction to judge by reason *instead* of common report implies reason stands outside the realm of report/custom. If reason were just internalized custom, the advice would be empty (swapping one custom for another).

  Applying this to the **funerary cannibalism case**:
  *   **Custom-skepticism** dictates that Europeans must distrust their immediate revulsion (vulgar opinion) and understand the practice's meaning (incorporation of the dead). However, it does not forbid criticism. Once understood, reason might evaluate whether the practice honors the dead effectively. It allows that Europeans might be wrong about cannibalism, but also that cannibals could be wrong about embalming, provided reason identifies a failure in either practice (e.g., hygiene, respect).
  *   **Code-relativism** would assert that neither side can criticize the other. The European revulsion is just "European code," and the cannibal disgust at embalming is "Cannibal code." There is no neutral ground for assessment.

  The distinction becomes sharper with the **enemy-eating variant**. If a society eats dead enemies solely to humiliate them:
  *   **Custom-skepticism** allows condemnation. Reason can identify cruelty or unnecessary suffering as violations of natural law or human dignity, regardless of whether the practice is culturally sanctioned. Montaigne himself condemns European torture and religious wars later in the essay, implying some acts are barbarous regardless of custom.
  *   **Code-relativism** blocks condemnation. If the practice fits the society's norms, it is morally right within that code. An outsider has no standing to call it barbarous.

  The custom-skeptic reading is superior because it preserves the critical power of Montaigne's essay. Montaigne does not argue that all customs are equal; he argues that European customs are often *worse* than those of the cannibals when measured against reason and nature. The passage urges us to strip away the distorting lens of "vulgar opinion" so that reason can see clearly. This presupposes that reason can see something true, not just another reflection of itself. Code-relativism collapses the distinction between "reason" and "report" that the text explicitly constructs.

  \answer{custom-skepticism}
