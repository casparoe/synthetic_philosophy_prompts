      *   *Soft Spot 2 (The "Intent" Condition):* If there's no intent, is it really *deception*? Or just error? If I'm just biased, isn't that optimism, not deception?
      *   *Soft Spot 3 (Measurement):* Psych experiments often measure *confidence* or *prediction*, not deep-seated belief. People might say they'll succeed (self-deception) but bet money on failure (implicit belief).

  5.  **Synthesize the "Journalist's Angle":**
