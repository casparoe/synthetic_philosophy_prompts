answer: |-
  1. Sequencing rationale
  Begin with the tripartite analysis to establish common ground, as tracking modifies rather than replaces truth and belief conditions. Next, introduce Gettier cases to demonstrate the insufficiency of justification alone; this creates the pedagogical necessity for a fourth condition. Only then introduce sensitivity and adherence as the specific counterfactual repairs required to block Gettier luck. Define knowledge via tracking only after students grasp why counterfactuals are needed to distinguish luck from knowledge. Finally, introduce closure denial. This order is crucial: if closure is raised before sensitivity is internalized, students will reject the theory as absurd rather than seeing closure denial as the logical cost of solving Gettier. Each step builds the necessity for the next, preventing premature rejection. If you introduce closure too early, it acts as a defeater before the theory's motivation is understood. If you introduce counterfactuals before Gettier, they appear arbitrary. The sequence ensures that closure denial feels like a derived consequence of a solution they already accept, rather than an initial axiom. The dependency is causal: Gettier creates the problem, Counterfactuals provide the tool, Definition builds the model, Closure tests the limits. Placing the definition before closure allows students to evaluate the theory on its primary intended function—solving Gettier—before weighing its secondary costs. By delaying closure, you allow the intuitive appeal of tracking to solidify, making the subsequent denial of closure a surprising but understandable trade-off.

  2. The carrying case
  **The Surge-Protected Altimeter.** A pilot checks a digital altimeter to believe the plane is at 10,000 feet (p). In the actual world, the sensor is perfectly calibrated and accurate, making the method reliable in actual circumstances. However, the device has a hidden safety protocol: if the altitude were anything other than 10,000 feet (not-p), a voltage regulator would freeze the display at 10,000 feet to prevent panic. Thus, if p were false, the pilot would still believe p. Sensitivity fails; adherence holds. **Omissions:** I deliberately exclude probabilistic language (e.g., "99% chance of freezing") to ensure counterfactuals are evaluated as deterministic truths. This prevents students from dismissing the case as mere statistical risk rather than structural insensitivity, forcing them to confront the specific counterfactual condition directly without hedging via probability. The case isolates the counterfactual failure from actual unreliability.

  3. Misconception map
  Expect three specific errors. First, students will conflate tracking with process reliabilism, assuming actual success suffices. Head this off during the Counterfactuals section by emphasizing that actual-world reliability is insufficient without counterfactual robustness across nearby worlds. Second, they will interpret sensitivity as demanding infallibility across all possible worlds, making knowledge impossible. Correct this at the Definition stage by stressing "nearby" possible worlds, not logical possibilities or skeptical scenarios. Third, they will assume denying closure licenses contradictions (knowing p and knowing p-entails-q but not-q). Address this immediately during the Closure Maneuver by clarifying that closure denial restricts knowledge transmission, not logical consistency. If these are not intercepted at these specific junctures, they will harden into reasons to dismiss the theory entirely before its explanatory power is visible. Each misconception targets a different structural pillar, so the timing of the correction must match the pillar's introduction. This timing ensures they understand the mechanism before critiquing the implications. Pre-empting these errors maintains the theoretical integrity of the lesson. Students often rely on intuition pumps that conflict with externalism. By addressing reliabilism early, you prevent them from smoothing over the counterfactual requirement. By addressing infallibility at definition, you prevent them from rejecting the theory as too strict. By addressing closure contradictions late, you prevent them from rejecting the theory as irrational.

  4. The closure maneuver
  Present the closure denial only after students have accepted sensitivity as the solution to Gettier. Frame it not as a failure of logic, but as a feature of externalism: knowledge is a causal-counterfactual relation to specific facts, not a logical operator. Use the skeptical hypothesis (e.g., Brain-in-a-Vat) to show that while "I have hands" tracks the truth, "I am not a BIV" does not. By staging this after the carrying case, students see closure denial as the principled price of retaining sensitivity, rather than an ad hoc exception to save the theory from skepticism. Emphasize that closure is a principle about knowledge, not logic, and Nozick argues it is simply false for knowledge. This shifts the burden: the theory isn't breaking logic; it's refining the concept of knowledge. The closure denial thus becomes a motivated theoretical consequence.

  5. Deliberate omissions
  Omit the methods-individuation problem during the core lecture. Raised too early, it allows students to dissolve the theory by redescribing methods rather than engaging with the epistemology. In the final five minutes, frame it thus: "We have assumed methods are fixed to test the theory's core logic; determining how finely to individuate them is a technical refinement for advanced study." This signals deferment without undermining the current lesson's validity. It acknowledges the complexity without letting it paralyze the seminar's primary objective of understanding tracking and closure. This keeps the focus on the epistemic conditions.

  6. Exit question
  **Exit Question:** "If knowledge requires sensitivity, can I know I am not a brain in a vat?" **Diagnostic:** A 'Yes' indicates they have reverted to closure principles over tracking; a 'No' confirms they understand that some truths are inherently untrackable, even if entailed by what we know. This reveals whether they prioritize logical entailment or counterfactual dependence.
