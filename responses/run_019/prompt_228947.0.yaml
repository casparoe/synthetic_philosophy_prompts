answer: |-
  In 1645, a master surveyor lays out a regular hexagon for a star fort using a traditional guild method wherein a rope of fixed length is stepped around a central stake to mark six vertices. He knows the procedure perfectly—the tensioning of the rope and the placement of the stakes are the efficient causes of the figure's existence—and he executes it without error, producing a true regular hexagon. However, he treats the method as a mere practical recipe; he cannot deduce from the construction itself that the side length equals the radius of the circumcircle, nor does he grasp the necessary connection between the rope-length and the angular properties, believing instead that the equality of side and radius is a fortunate accident of this specific rope rather than a necessary truth of the figure.

  **Hobbes's Prediction:** Hobbes's criterion predicts the surveyor possesses the grounds for demonstrative knowledge because he knows the cause (the generation) of the object; since scientific knowledge is knowledge of consequences from causes, and the surveyor knows the cause (his own generative action), he should be able to certify the properties.

  **Intuitive Verdict:** The surveyor has technical know-how, not scientific knowledge. He knows *that* he made it and *how* he made it procedurally, but he lacks knowledge of *why* it has its properties, demonstrating that generating an object does not automatically confer understanding of its necessary consequences.

  **Feature Doing the Work:** The gap is between **causal agency** (being the efficient cause of the object's existence) and **comprehension of causal necessity** (understanding the logical implications inherent in that generation). The surveyor owns the cause but not the power of the cause.

  **If Removed:** If the surveyor understands the geometric proof linking the rope-length to the radius (grasping the necessity), he bridges the gap and possesses demonstrative knowledge.

  **Hobbesian Defense:** A Hobbesian would argue the surveyor does not truly know the "generation" in the philosophical sense; he knows a contingent mechanical trick, not the universal motion (e.g., "a line rotating...") required for scientific definition, so the criterion isn't actually met.

  **Civil Philosophy Bonus:** The same threat applies: citizens or legislators "make" the commonwealth through covenant and law (causal agency), but this does not guarantee they understand the necessary consequences of those laws for peace and justice (comprehension of causal necessity), undermining the claim that civil philosophy is demonstrable simply because we construct the state.
