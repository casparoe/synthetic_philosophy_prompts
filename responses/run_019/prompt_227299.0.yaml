prompt: |-
  I'm teaching a unit on whether and how we should judge historical figures morally -- Jefferson owning slaves while writing about liberty, Churchill and the Bengal famine, Columbus and everything after -- and the students keep reaching for two lazy moves: "man of his time, you can't judge" versus "evil is evil, judge away". Before I let them anywhere near the actual figures I want a spec. Write the desiderata: what any adequate account of retrospective moral judgement has to be able to do to count as a serious position rather than a vibe. For each requirement give the case or consideration behind it -- e.g. whatever you say has to handle the fact that plenty of Jefferson's own contemporaries called slavery wrong (so which contemporaries count, and does he get excused if the critics were mostly foreigners or cranks?), it has to say something about people who were better than their era on one axis and awful on another, it has to distinguish judging the person from judging whether we should still name buildings after them, and it has to deal with genuine moral ignorance where arguably nobody could have known better. Which requirements are non-negotiable vs which are just one camp's preference? And the bit I care about most: are any of the plausible desiderata jointly unsatisfiable -- e.g. "judge only by standards available to them" against "our judgements should track what was actually wrong" -- because if the list itself is inconsistent that's the lecture. Finish by noting which single requirement kills off the most of the lazy heuristics my students use. Don't just score Jefferson/Churchill/Columbus at the end, I'll do that in class.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for retrospective moral judgment:

  1.  **Analyze the Request:**
      *   **Topic:** Retrospective moral judgment of historical figures (Jefferson, Churchill, Columbus, etc.).
      *   **Problem:** Students rely on lazy heuristics ("man of his time" vs. "evil is evil").
      *   **Task:** Write a set of *desiderata* (requirements) for any adequate account of this practice.
      *   **Specific Instructions:**
          *   Provide the case/consideration behind each requirement.
          *   Address specific examples (Jefferson's contemporaries, mixed legacies, judging person vs. honoring, genuine moral ignorance).
          *   Distinguish non-negotiable vs. camp preferences.
          *   Identify potential inconsistencies/joint unsatisfiability (the "lecture" point).
          *   Identify the single requirement that kills the most lazy heuristics.
          *   *Constraint:* Do not score the specific figures (Jefferson/Churchill/Columbus) at the end.

  2.  **Deconstruct the Problem (The "Lazy Moves"):**
      *   *Move 1: Presentism ("Evil is evil").* Ignores context, epistemic limitations, and moral progress. Risks condemning everyone in history.
      *   *Move 2: Relativism ("Man of his time").* Ignores dissenters, universal harms, and the fact that "the time" is rarely monolithic. Risks absolving monsters.
      *   *Goal:* Create a framework that forces nuance without collapsing into contradiction.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Epistemic Accessibility.* You can't blame someone for not knowing what was unknowable.
          *   *Case:* Medical ethics before germ theory. Or perhaps moral facts?
          *   *Refinement:* Needs to handle Jefferson. Slavery *was* knowable as wrong by some. So it's not just "what was known," but "what was accessible."
      *   *Idea 2: The "Time" isn't a Monolith.*
          *   *Case:* Jefferson. Abolitionists existed.
          *   *Refinement:* The account must identify *which* contemporaries set the standard.
      *   *Idea 3: Distinction between Evaluation and Commemoration.*
          *   *Case:* Statues, building names.
          *   *Refinement:* Judging a soul vs. judging public utility of memory.
      *   *Idea 4: Moral Complexity/Mixed Legacies.*
          *   *Case:* Churchill (saved Europe, starved Bengal).
          *   *Refinement:* The account must allow for aggregation or non-aggregation without canceling out.
      *   *Idea 5: The Purpose of Judgment.*
          *   *Case:* Why are we doing this? Vindication? Education?
          *   *Refinement:* The account needs a telos.

  4.  **Refining and Categorizing (Non-negotiable vs. Contested):**

      *   *Non-negotiable:* Must handle epistemic limits (otherwise it's magic), must handle dissent (otherwise "man of his time" is false), must distinguish assessment from policy (otherwise category error).
      *   *Contested:* Aggregation (can good cancel bad?), weight of intentions vs. outcomes.

  5.  **Identifying the Tension (The "Lecture" Point):**
      *   The core tension is between *Moral Realism* (wrong is wrong regardless of belief) and *Fairness/Blameworthiness* (blame requires capacity to know/choose).
      *   If slavery was *objectively* wrong in 1776, Jefferson was wrong. But if he couldn't have reasonably known (epistemically blocked), is he *blameworthy*?
      *   *Unsatisfiable Pair:* "Judge by objective moral truth" + "Judge only by standards reasonably available to the agent."
      *   *Wait, are they unsatisfiable?* Not necessarily. You can say "He did wrong (objective)" but "He is not blameworthy (subjective)."
      *   *Better Tension:* "We judge to learn moral truths" vs. "We judge to be fair to the dead." If the goal is moral education for *us*, presentism helps. If the goal is historical justice, contextualism helps.
      *   *Stronger Tension:* The "Progress Paradox." If we judge them by our standards, we imply moral progress. If moral progress is real, our standards might change too, making our judgment of them future-proofed as wrong.
      *   *Best Tension:* **The Epistemic/Objective Clash.** Requirement A: Judgments must track objective moral facts (slavery was always wrong). Requirement B: Blame requires epistemic access (you can't blame for unknowable facts). If slavery's wrongness was objectively true but epistemically obscured by culture, A says "Condemn," B says "Excuse." This is the friction point.

  6.  **Selecting the "Killer" Requirement:**
      *   Which one kills both "Man of his time" and "Evil is evil"?
      *   "Man of his time" dies if we prove dissent was available.
      *   "Evil is evil" dies if we prove epistemic limits matter.
      *   The requirement that **distinguishes between the *wrongness of the act* and the *blameworthiness of the agent*** is the strongest. It forces students to separate ontology from psychology.
      *   *Alternative:* The requirement regarding **contemporary dissent**. This specifically targets the "man of his time" excuse while allowing for context. But does it kill "evil is evil"? Not really.
      *   *Winner:* The **Epistemic Accessibility Condition**. It forces the "evil is evil" crowd to admit ignorance matters, and forces the "man of his time" crowd to prove ignorance was genuine (which fails for Jefferson).

  7.  **Drafting the Content (incorporating the prompt's specific examples):**
      *   *Jefferson:* Use for the "contemporary dissent" point.
      *   *Churchill:* Use for the "mixed legacy/aggregation" point.
      *   *Columbus:* Use for the "consequences vs. intentions" point (though prompt says don't score them, use the *structure* of the case).
      *   *Building Names:* Use for the "evaluation vs. commemoration" point.

  8.  **Review against Constraints:**
      *   Did I score the figures? No.
      *   Did I list desiderata? Yes.
      *   Did I explain the case for each? Yes.
      *   Did I identify non-negotiables? Yes.
      *   Did I find the inconsistency? Yes.
      *   Did I pick the killer requirement? Yes.

  9.  **Final Polish:** Ensure tone is academic but punchy (suitable for a teacher prepping a lecture). Make sure the distinction between "non-negotiable" and "contestable" is clear. Ensure the "jointly unsatisfiable" section is philosophically robust.

      *(Self-Correction during drafting)*: I need to be careful not to resolve the tension. The prompt asks me to highlight *if* they are jointly unsatisfiable. I should argue that they create a productive aporia, not necessarily a logical contradiction, but a tension that prevents lazy answers. Actually, the prompt asks "are any... jointly unsatisfiable". I should take a stand. The tension between *Objective Wrongness* and *Subjective Blame* is the classic one. I will frame it as a tension between *Assessment* and *Sanction*.

      *Revised plan for the "Killer Requirement":* The requirement that **distinguishes moral truth from moral blame**. This forces the "evil is evil" kid to admit blame requires capacity, and the "man of his time" kid to admit the act was still wrong. It splits the difference.

      *Wait, looking closer at the prompt:* "Finish by noting which single requirement kills off the most of the lazy heuristics."
      Okay, I need to pick one. The **Dissent Availability Requirement** (you can't claim 'everyone thought X' if people *were* saying not-X) is very effective against the most common student excuse ("man of his time"). But the **Epistemic Access Requirement** is better against "evil is evil."
      Actually, the **Distinction between Evaluation and Commemoration** is practical, but doesn't solve the moral philosophy bit.
      Let's go with the **Epistemic Accessibility + Dissent Combination**. No, I need *one* requirement.
      The requirement that **"The standard must be internal to the agent's epistemic horizon, but the horizon must be empirically verified, not assumed."**
      Actually, the prompt asks for a desideratum. Let's formulate it as: **"The account must distinguish between the objective wrongness of an act and the subjective blameworthiness of the agent."** This kills "evil is evil" (by introducing blame conditions) and "man of his time" (by allowing objective wrongness to stand even if blame is mitigated).

      *Wait, one more check:* The prompt asks about "jointly unsatisfiable." I need to make sure I highlight a genuine conflict.
      Conflict: **The Progress Paradox.** If we judge them by our standards, we assume our standards are final. If our standards aren't final, our judgment is provisional. If we judge them by their standards, we lose moral progress.
      Okay, I'll stick with the **Objectivity vs. Blameworthiness** tension.

      *Let's refine the "Killer".* The requirement that **"It must account for the existence of contemporary dissenters."** This specifically annihilates the "man of his time" argument (the most prevalent one) while forcing the "evil is evil" crowd to specify *which* contemporaries set the bar. It forces empirical work.

      *Decision:* I will write the desiderata, mark the non-negotiables, highlight the tension between Moral Realism and Fairness, and select the **Contemporary Dissent Condition** as the heuristic killer because it forces empirical engagement rather than philosophical hand-waving.

      *(Wait, re-reading prompt)*: "Finish by noting which single requirement kills off the most of the lazy heuristics my students use."
      Okay, I'll select the one that forces them off the couch. The **Epistemic Accessibility Requirement** is probably the deepest, but the **Dissent Requirement** is the most practical "shut down" for the specific "man of his time" claim. I'll go with the **Epistemic Accessibility Requirement** because it cuts both ways. It stops Presentism (you can't know the future) and stops Relativism (you *could* have known better if dissent existed).

      *Actually, let's look at the "Jointly Unsatisfiable" part again.*
      If I say "Judge by objective truth" and "Judge by available knowledge."
      If slavery was objectively wrong, but knowledge was unavailable.
      1. Judge by objective truth -> He is guilty.
      2. Judge by available knowledge -> He is innocent.
      These are jointly unsatisfiable *if* the goal is a single verdict of "Guilty/Innocent."
      So the desideratum must be: **The account must separate the evaluation of the act from the evaluation of the agent.**
      Okay, that's the key.

      *Final Plan:*
