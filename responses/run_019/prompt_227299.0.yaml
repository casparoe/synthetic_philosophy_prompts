answer: |-
  Here is a specification for retrospective moral judgment. It is designed to force your students out of binary thinking and into the mechanics of ethical reasoning.

  ### Desiderata for Retrospective Moral Judgment

  **1. The Epistemic Accessibility Condition**
  *   **The Requirement:** An agent can only be held blameworthy for violating a moral norm if knowledge of that norm was reasonably accessible to them within their informational and social context.
  *   **The Case:** This handles genuine moral ignorance. If a Bronze Age chieftain practiced human sacrifice believing it was required to prevent cosmic collapse, we may judge the *act* as horrific, but we cannot judge the *agent* as malicious without evidence they could have known otherwise. This blocks the "evil is evil" heuristic from condemning people for lacking future knowledge (e.g., germ theory, modern human rights frameworks).

  **2. The Dissent Availability Condition**
  *   **The Requirement:** An account cannot accept "everyone thought X" as a defense if there is empirical evidence that contemporaries in the same context argued not-X.
  *   **The Case:** This handles the Jefferson problem. If the defense is "he was a man of his time," the account must specify *which* time and *whose* consensus. Since abolitionist arguments existed in the 18th century (from Quakers, Enlightenment radicals, and enslaved people themselves), the "consensus" was not total. This requirement forces students to ask: Was the moral truth *unknowable*, or was it just *inconvenient*? It prevents the "man of his time" heuristic from becoming a blanket amnesty.

  **3. The Act/Agent Distinction**
  *   **The Requirement:** The framework must distinguish between judging the *moral quality of an action* and the *moral character/blameworthiness of the person*.
  *   **The Case:** This handles the tension between moral realism and fairness. We can assert that slavery was objectively wrong in 1776 (Act) while acknowledging Jefferson's psychological and social inability to fully grasp the implications of his own philosophy (Agent). Without this, students conflate "this was bad" with "he was a monster," leaving no room for tragic complexity.

  **4. The Commemoration/evaluation Separation**
  *   **The Requirement:** The framework must treat historical judgment (what happened/was it wrong) as distinct from public commemoration (do we name a school after them).
  *   **The Case:** This handles the "cancel culture" vs. "history erasure" debate. A figure can be judged as morally flawed (or even net-negative) while still retaining a statue because their historical impact is pedagogically necessary, or vice versa. A building name is a policy question about current values, not a historical verdict. Conflating the two leads to students arguing that removing a statue is "erasing history" or that keeping one is "endorsing slavery."

  **5. The Aggregation Problem**
  *   **The Requirement:** The account must specify whether moral credits and debits can offset one another, or if certain acts are "lexical priorities" that veto all goods.
  *   **The Case:** This handles the Churchill problem. Churchill helped save liberal democracy (Credit) and oversaw policies that exacerbated the Bengal Famine (Debit). Can the first cancel the second? A serious position must state whether "saving Europe" is a get-out-of-jail-free card for colonial negligence, or if some harms are non-fungible. The lazy "evil is evil" move often ignores the credits; the "man of his time" move often ignores the debits.

  ***

  ### Non-Negotiable vs. Contested

  **Non-Negotiable (The Floor)**
  To count as a serious position, an account *must* satisfy **Epistemic Accessibility** and **Dissent Availability**.
  *   *Why:* Without Epistemic Accessibility, you are engaging in magic, blaming people for not knowing the future. Without Dissent Availability, you are engaging in fiction, claiming a monolithic consensus that didn't exist. Any theory that fails these is historically illiterate.

  **Contested (The Camps)**
  **Aggregation** and **Commemoration** are where reasonable people diverge.
  *   *Why:* Some ethical frameworks (utilitarianism) allow goods to offset bads; others (deontology/rights-based) argue that violating rights cannot be "canceled out" by good deeds. Similarly, some argue public spaces should only honor the virtuous, others argue they should reflect the complex reality of history. You can be a serious thinker on either side of these lines.

  ***

  ### The Inconsistency: The "Progress Paradox"

  Here is the lecture point: **The Epistemic Accessibility Condition** and the **Objective Wrongness Intuition** are jointly unsatisfiable if you demand a single verdict of "Guilty/Innocent."

  *   **Requirement A:** We judge historical figures to affirm objective moral truths (e.g., "Slavery is always wrong").
  *   **Requirement B:** We judge historical figures fairly based on what they could know (e.g., "Jefferson couldn't fully conceive of racial equality as we do").

  If you prioritize **A**, you must condemn Jefferson (Presentism). If you prioritize **B**, you must exculpate Jefferson (Relativism). If you try to do both, you end up saying: *"He did something objectively wrong, but he isn't blameworthy for doing it."*

  This sounds like a contradiction to students. It isn't—it's the distinction between **Assessment** (the act was wrong) and **Sanction** (the person is not punishable). But most students want a binary "Hero/Villain" score. This framework denies them that score. It forces them to hold two contradictory-feeling thoughts at once: *The act was intolerable, and the person was understandable.* If they can't hold that tension, they aren't doing history or ethics; they're doing mythology.

  ***

  ### The Heuristic Killer

  The single requirement that kills the most lazy heuristics is **The Dissent Availability Condition**.

  *   **Why it kills "Man of his time":** It forces empirical verification. The student cannot simply assert "everyone owned slaves." They must prove that *no one* in Jefferson's circle argued against it. When they find that people *did* (and that Jefferson knew them), the excuse collapses.
  *   **Why it kills "Evil is evil":** It forces nuance on the *degree* of blame. If dissent was available but marginal (e.g., only foreign cranks said it), it mitigates blame compared to if dissent was mainstream. It stops the student from treating all ignorance as malicious.

  It transforms the debate from a vibe check ("Was he good?") into a research question ("Who was speaking, who was listening, and what did it cost to disagree?").
