      *   *Claim 4:* "If you said that other person could have been you, you'd be saying a thing could be identical to something it isn't." (Identity logic)
      *   *Claim 5:* "Since the other-sperm person isn't you, and identity across worlds is all-or-nothing... it follows that you couldn't have been born from that other sperm." (Modal logic application)
