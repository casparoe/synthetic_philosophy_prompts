      *   *Substantive Reading:* Necessity of Identity. If $x=y$ in actual world, they are identical in all worlds where they exist.
      *   *Does it do work?* No. It prevents "contingent identity" (you are me in this world but not that one). It does *not* tell us *which* possible individual is you. It preserves identity once established, but doesn't establish origin essentialism on its own.

