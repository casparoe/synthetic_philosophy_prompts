  3.  **Evaluate Each Claim against Philosophical Literature (Kripke, Mackie, Robertson, etc.):**

      *   *Claim 1 (Sperm/Egg):* This is the standard popular formulation, but Kripke himself (*Naming and Necessity*) talks about *parents* and the *zygote*. He doesn't explicitly fixate on the specific gametes in the text, though it's the standard biological realization of the view. *Verdict:* Mostly accurate as a standard interpretation, but slightly more specific than Kripke's explicit text.
      *   *Claim 2 & 3 (The Argument):* This is where the friend is begging the question. He asserts the conclusion as the premise ("The person... isn't you, *because* you are the person who came from that particular sperm..."). This isn't an argument; it's a restatement of the thesis. *Verdict:* Philosophically weak/circular.
      *   *Claim 4 & 5 (Identity Logic):* "Identity across worlds is all-or-nothing." This refers to the Necessity of Identity ($x=y \rightarrow \Box x=y$). This is standard Kripkean modal logic. However, it doesn't *prove* origin essentialism; it just says *if* they are distinct in one world, they are distinct in all. It doesn't establish *which* counterpart is you. *Verdict:* Technically true logic, but doesn't do the heavy lifting the friend thinks it does.
      *   *Claim 6 (Egg):* Same as sperm.
      *   *Claim 7 (Parents):* Kripke definitely argues for parental essentialism (Queen Elizabeth couldn't have had different parents). This is the stronger, more textual claim. *Verdict:* Accurate to Kripke.
      *   *Claim 8 (Time/Place):* This is the big leap. Does different time/place *necessarily* imply different sperm/egg? Biologically, maybe (sperm degrade, eggs age). Metaphysically? Kripke is skeptical of spatiotemporal essentialism *independent* of origin. Some origin essentialists (like Mackie) argue for a "sufficiency" principle that allows some variation. The friend's claim that time/place *just follow* from sperm/egg is a biological reduction, not a metaphysical proof. *Verdict:* Overreach/Simplification.
      *   *Conclusion (Whole Story):* "Pretty much your whole coming-into-existence story." This is too strong. Most origin essentialists allow for *some* variation (e.g., slight delays in implantation, minor environmental differences during gestation). The "Whole Story" sounds like Haeccetism or a very strong individuation principle. *Verdict:* Exaggeration.

  4.  **Address the "All-or-Nothing" Point:**
      *   The friend says: "identity across worlds is all-or-nothing."
