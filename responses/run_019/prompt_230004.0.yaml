      *   **Input:** A summary provided by the user's friend (who took one metaphysics class).
      *   **Task:** Evaluate the summary claim-by-claim. Identify what's accurate, what's a simplification, and what's wrong. Assess whether the strong conclusion ("whole coming-into-existence story") follows. Analyze the "all-or-nothing identity" point (trivial vs. substantive).
      *   **Tone:** Philosophical, precise, critical but accessible.

  2.  **Deconstruct the Friend's Summary:**
