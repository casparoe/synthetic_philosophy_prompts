answer: |-
  The iron arm could spare the trembling hand,
  To shrink the labour time we must maintain,
  A bounty poured across the weary land,
  And break the yoke of necessity's chain.
  It promises a world of leisure gained,
  Where machines serve the worker's weary bone,
  Where labour is not by endless grind constrained,
  And freedom blooms from seed the tech has sown.

  Yet profit turns the gift into a goad,
  It steals the daylight, brings the factory night;
  Workers cast out upon the dusty road,
  A reserve army hidden from the light.
  The blame rests not within the steel or code,
  But who directs the drive, and who bears the load.
