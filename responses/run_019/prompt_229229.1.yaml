answer: |-
  Your hypothesis is substantially correct: the impasse is not physical, but it is more specific than "ontology under relativistic constraints." The dispute is **Metaphysical**, centering on a hidden **Bridge Principle** that connects geometric structure to ontological status. The stalemate persists because the participants are conflating **Manifold Existence** with **Modal Fixity**, and they have failed to engage with the specific formal constraints on "becoming" derived by Howard Stein.

  Here is a diagnosis of the impasse, the distinction required for progress, and an explanation of why it remains elusive.

  ### 1. Diagnosis: The Metaphysical Bridge Principle
  The dispute is not **Verbal** (trivial semantic disagreement), **Modal** (purely about possibility/necessity), or **Physical** (about the empirical content of SR). It is **Metaphysical** because it concerns the *interpretation* of the formalism.

  The Rietdijk–Putnam Argument (RPA) relies on a suppressed premise, often called the **Principle of the Reality of Simultaneity**:
  > *If event $E$ is simultaneous with event $O$ in some inertial frame, and $O$ is "real," then $E$ is "real."*

  *   **Proponents** treat this as a constraint on ontology: Reality must be frame-invariant. Since simultaneity is frame-variant, "Reality" cannot be restricted to a simultaneity slice. Therefore, the whole manifold is real (Eternalism).
  *   **Critics** attack the inference, noting that "real" is ambiguous. They argue that being "simultaneous" does not entail being "determinate" or "fixed."

  **The Impasse:** The debate stalls because Proponents argue for **Tenseless Existence** (all points in the manifold have equal ontological standing), while Critics argue against **Causal Determinism** (the future is not fixed). Both can be true simultaneously without contradiction. The RPA successfully argues for Eternalism (the future *exists*), but it does not logically entail Hard Determinism (the future is *necessary*). The seminar is stalled because one side is defending existence while the other is attacking fixity.

  ### 2. The Required Distinction: Existence vs. Definiteness
  To break the deadlock, the seminar must distinguish between two ontological predicates that RPA conflates:

  1.  **Ontological Parity (Existence):** Does the event occupy a location in the spacetime manifold? (Eternalism says yes; Presentism says no).
  2.  **Modal Definiteness (Truth):** Is the proposition describing the event *now* true or false? (Determinism says yes; Open Future says no).

  **Progress requires acknowledging that SR forces Ontological Parity (if one accepts the manifold as fundamental) but remains silent on Modal Definiteness.**
  A Block Universe can contain "open" futures if one adopts a branching spacetime model or denies bivalence for future contingents. The Critics are right that Eternalism $\neq$ Determinism, but the Proponents are right that SR makes local Presentism metaphysically costly (requiring a preferred frame undetectable by physics, i.e., Lorentzian Ether Theory).

  ### 3. The Missing Formal Result: Stein's Theorem
  The formal result that constitutes progress is **Howard Stein's "On Einstein-Minkowski Space-Time" (1968, 1991)**.

  Stein formalized the relation of "becoming" or "determinateness" ($R$) in Minkowski spacetime. He asked: Can we define a relation $Rab$ ("$b$ is definite relative to $a$") that satisfies:
  1.  **Transitivity:** If $b$ is definite for $a$, and $c$ for $b$, then $c$ for $a$.
  2.  **Causal Invariance:** $R$ is definable purely from the metric structure (no hidden preferred frames).
  3.  **Non-Triviality:** Not everything is definite for everyone (saves "becoming").

  **Stein's Result:** The only relation satisfying these conditions in Minkowski spacetime is the **past light cone relation**.
  *   $b$ is definite for $a$ iff $b$ is in the causal past of $a$.

  **Why this resolves the impasse:**
  *   It validates the Critics: There is no global "now" that confers reality. Reality/Definiteness accumulates locally along worldlines.
  *   It constrains the Proponents: You cannot use spacelike separated simultaneity to establish ontological parity *without* abandoning the requirement that ontology be definable from causal structure.
  *   It isolates the metaphysical choice: Do you accept Stein's causal definition of "real" (local becoming), or do you accept the manifold as substantival (global eternalism)? This is no longer a physics dispute; it is a choice between **Causal Ontology** vs. **Substantival Manifold Ontology**.

  ### 4. Why Has Neither Emerged?
  If the distinction and the theorem are available, why is your seminar stalled?

  1.  **The "Truth-Maker" Gap:** The participants are likely arguing about *time* rather than *truth*. The core of RPA is a semantic argument: "If a statement about a distant event is true now, what makes it true?" Proponents say the event itself (requiring existence). Critics say nothing yet (denying bivalence). Without formalizing the **Truth-Maker Principle** in SR, they talk past each other.
  2.  **Underdetermination (SR vs. LET):** The physics does not rule out a preferred foliation (Lorentzian Ether Theory). Presentists can accept the RPA geometry but posit a hidden, empirically inaccessible "true now." Proponents reject this as unparsimonious. The debate stalls because it shifts from physics to **methodological metaphysics** (parsimony vs. intuition), which is harder to resolve than physical facts.
  3.  **Confusion of "Real" with "Accessible":** Critics often slip into verificationism ("I can't know it, so it isn't real"). Proponents slip into fatalism ("It exists, so I can't change it"). Neither is required by SR.

  ### Recommendation for the Seminar
  To resume progress, propose the following motion:
  > *"Resolved: That the Rietdijk–Putnam argument establishes the ontological parity of spacelike separated events only if one assumes that 'Reality' is a transitive relation definable independently of causal connectability."*

  Then, assign **Stein (1968)** and **Saunders (2002, "How Relativity Contradicts Presentism")**. Ask the group to determine if they are willing to accept a **light-cone restricted ontology** (Stein's "becoming") or if they insist on **manifold substantivalism** (the Block). Once they admit this is a metaphysical choice not settled by the Lorentz transformations, the "physics" portion of the debate ends, and the actual philosophical work can begin.
