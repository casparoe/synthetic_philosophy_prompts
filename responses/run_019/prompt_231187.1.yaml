answer: |-
  This is a fantastic challenge. Lewis's *Convention* is a landmark text, but his definition is deceptively technical. Your audience (scientists and economists) is actually ideal for this: they understand systems, equilibria, and functional explanations, but they won't be bogged down by philosophical jargon. They will, however, demand precision.

  Your intuition is correct: **Arbitrariness is the linchpin.** Without it, you can't distinguish a *convention* from a *law of nature*, a *coincidence*, or a *forced regularity*.

  Here is a session plan designed to let them build the definition themselves, rather than having you lecture it.

  ### 1. The Order of Ideas (The Scaffolding)

  Do not start with the definition. Start with the *problem* the definition solves.

  1.  **Interdependence (The "Why"):** Establish that conventions solve a specific type of problem where my best move depends on your move.
  2.  **Regularity & Expectation (The "What"):** Establish that we need a stable pattern and mutual knowledge of that pattern.
  3.  **Arbitrariness (The "Which"):** Establish that the specific pattern doesn't matter, only that we match.
  4.  **The Synthesis:** Combine these into Lewis's definition.

  ### 2. The Central Example: Driving (With a Caveat)

  You are right to be tempted by **Driving on the Left/Right**. It is the intuitive heavyweight champion of conventions. However, your suspicion is also correct: it hides the "Law" objection.

  **How to use it:**
  Use it, but **sanitize it immediately**.
  *   **The Setup:** Ask them to imagine a stretch of road with no police, no painted lines, and no legal code. Just drivers.
  *   **The Question:** "Why do you drive on the left?"
  *   **The Trap:** If they say "Because it's the law," stop them. Ask: "Why is it the law? Why not the right?" They will admit the law is just codifying the expectation.
  *   **The Pivot:** Once they admit they drive on the left *to avoid crashing into others who are driving on the left*, you have isolated the convention from the law.

  **Why this works for scientists/economists:** It's a clear coordination equilibrium. The payoff matrix is obvious (Match = Safe; Mismatch = Crash).

  ### 3. Anticipated Misconceptions & When to Head Them Off

  Here are the three big hurdles your group will hit, and where to place the blockers in the sequence.

  **Misconception 1: "It's just a shared habit."**
  *   *When it arises:* Early, when you ask for examples.
  *   *The Fix:* Use the **Coffee Example**.
      *   *Scenario:* Everyone in the office drinks coffee at 10 AM.
      *   *Test:* If everyone else switched to tea at 10 AM, would you switch?
      *   *Result:* Probably not. You drink coffee because you like caffeine, not because they do.
      *   *Lesson:* Habits are independent preferences. Conventions are *conditional* preferences ("I prefer to do X *if* you do X").
  *   *Placement:* Before introducing the definition.

  **Misconception 2: "Arbitrary means random."**
  *   *When it arises:* When you introduce the arbitrariness clause. This is your specific sticking point, and it will be theirs too.
  *   *The Fix:* Use the **Alternative Equilibrium** test.
      *   *Scenario:* Driving on the left is arbitrary not because it's random, but because Driving on the Right would have worked *just as well* provided everyone did it.
      *   *Contrast:* Breathing is regular, but not arbitrary (we can't choose not to). Wearing a uniform might be regular, but if the boss forces it, it's not arbitrary (no alternative allowed).
      *   *Lesson:* Arbitrariness means "There is another workable solution we *could* have coordinated on."
  *   *Placement:* During the core definition breakdown.

  **Misconception 3: "We must have agreed to it."**
  *   *When it arises:* Economists might look for a contract; scientists might look for a signal.
  *   *The Fix:* Lewis's big insight is that conventions often arise without promises.
      *   *Scenario:* Two people walking toward each other on a path. They dodge left, then right, then left. Suddenly they match. No words exchanged.
      *   *Lesson:* Conventions emerge from precedent and expectation, not necessarily explicit agreement.
  *   *Placement:* Near the end, to refine the definition.

  ### 4. Addressing Your Sticking Point: What is Arbitrariness Doing?

  You noted: *"Plenty of social regularities are arbitrary but not conventional."*
  *Example:* Everyone happens to wear blue shirts today. It's arbitrary (could wear red). It's regular. But it's not a convention.

  **The Explanation for the Group:**
  Lewis's arbitrariness is not a standalone condition. It is tied to the **Coordination Problem**.
  *   **Blue Shirts:** I don't care what color you wear. My payoff doesn't depend on matching you.
  *   **Driving:** My payoff *heavily* depends on matching you.
  *   **The Definition of Arbitrariness here:** A regularity is arbitrary *in the conventional sense* only if there is an **alternative regularity that would have solved the same coordination problem.**

  So, arbitrariness rules out **Natural Laws** (no alternative possible) and **Coincidences** (no coordination problem solved). It ensures we are talking about a *selected equilibrium*.

  ### 5. The Diagnostic Question (The "Exit Ticket")

  Do not ask "Do you understand?" Ask them to apply the criteria to a edge case.

  **The Question:**
  > "Imagine a small island where everyone fishes on the East side because the fish are there. On the West side, there are no fish.
  >
  > 1. Is there a regularity? (Yes, everyone fishes East).
  > 2. Is it arbitrary? (No, West has no fish).
  > 3. Is it a Convention? (No)."

  **Follow-up:**
  > "Now imagine the island has fish on *both* sides, but the boats crash if they mix. Everyone happens to start on the East. Now is it a convention? Why?"

  **What to listen for:**
  You want them to say: "Yes, because now there is an **alternative** (West) that would have worked just as well, but we need to **match** to avoid crashing." If they focus on the fish, they missed the point. If they focus on the *matching*, they got it.

  ### 6. Confidence and Uncertainty

  **Confidence Level: 85%**
  This structure works well for analytical minds. Scientists and economists respect functional definitions (what job does this concept do?) rather than semantic ones (what does this word mean?). The "Coordination Problem" framing will resonate with the economists immediately (Nash Equilibrium), and the "Regularity" framing will resonate with the scientists (empirical observation).

  **Least Sure Bit: The "Law" Objection during the Driving Example.**
  Even with your sanitizing instructions, one participant will inevitably say, "But if I drive on the right, I get a fine."
  *   **Contingency Plan:** If this happens, concede the point but pivot. "Lewis argues the Law is effective *only because* it rests on a deeper convention. If everyone decided tomorrow to drive on the right, the police couldn't ticket us all. The law enforces the convention; the convention gives the law its power."
  *   **Backup Example:** If Driving gets bogged down, switch to **Telephone Call-Backs**. (If a call drops, who calls back? The original caller? The receiver? It's arbitrary, regular, and solves a coordination problem without any law).

  ### Summary Checklist for Your Session:
  1.  **Hook:** Start with the "Habit vs. Convention" distinction (Coffee vs. Driving).
  2.  **Core:** Walk through the Driving example, stripping away the Law.
  3.  **Crux:** Hammer the "Alternative Equilibrium" definition of Arbitrariness.
  4.  **Test:** Use the Fishing Island question to verify understanding.

  This approach respects their intelligence while guiding them through the specific logical architecture Lewis built. Good luck!
