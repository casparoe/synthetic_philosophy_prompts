  2.  **Deconstruct the Philosophical Problem:**
      *   *Lewis's Definition:* A convention is a regularity $R$ in population $P$ in situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition that* others do (coordination problem).
          4.  There is an alternative regularity $R'$ that could have solved the problem just as well (Arbitrariness).
      *   *The User's Sticking Point:* Why is arbitrariness needed? Aren't there arbitrary regularities that aren't conventions? (Yes, e.g., everyone happens to wear blue today, but not because of coordination).
      *   *The Key Insight:* Arbitrariness isn't just "it could have been different." It's "it could have been different *and still solved the coordination problem*." It ties into the *reason* for conformity. If I conform only because it's physically impossible to do otherwise, it's not a convention. If I conform because it's the best solution *given* you are doing it, and there was another solution we could have agreed on, it's a convention.

  3.  **Drafting the Session Plan:**

