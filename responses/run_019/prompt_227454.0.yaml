  # Activity Design: "The Resonance Grid"

  ## 1. Materials List
  *   **Floor Markings:** Masking tape to create a 4x4 or 5x5 grid (16–25 spots) on the floor. Spots should be large enough for one person to stand comfortably.
  *   **Identity Cards:** 2 sets of colored cardstock (Red and Blue), enough for every participant to hold one. (Total ~30 cards to allow for spares).
  *   **Rule Sheets:** 14 laminated cards, identical on the front, with specific conditional instructions on the back (see *Rules* below).
  *   **Timer/Metronome:** A visible timer or a phone app with a distinct beep (set to 30-second intervals).
  *   **Scoreboard:** Whiteboard or large paper to track "Stability Points."
  *   **The "Inspector" Token:** A distinct object (e.g., a bright hat or baton) held by the facilitator or a designated non-playing observer.
  *   **Incentive:** A printed voucher stating "Priority Selection for Next Term's Reading Text."

  ## 2. The Rules (To be printed on Rule Sheets)
  *Do not distribute these until the participants are on the grid.*

  **Phase 1 Rules (The Substrate):**
  1.  **Silence:** No verbal communication. No hand signals.
  2.  **The Beat:** When the timer beeps, you must check your immediate neighbors (Up, Down, Left, Right).
  3.  **Alignment:** If 3 or more neighbors hold a color *different* from yours, you must swap your card to match them.
  4.  **Migration:** If you have 0 neighbors of your own color, you must move to an empty adjacent square (if available). If no empty square exists, stay put.
  5.  **Fidelity:** If you fail to follow these rules when audited, you are "decoupled" (sit out) for the next 3 rounds.

  **Phase 2 Rules (The Intervention):**
  1.  **The Goal:** The group is announced a Global Target (e.g., "The Room must be 80% Blue").
  2.  **The Constraint:** Phase 1 rules still apply *unless* a "Cluster Lock" occurs.
  3.  **Cluster Lock:** If 5 or more people of the same color are connected (orthogonally), they form a **Symbol**. Members of a Symbol cannot change color voluntarily. They can only change if the Symbol is broken by outsiders moving into their neighborhood.
  4.  **Incentive:** The group earns 1 "Stability Point" for every round the Global Target is met *and* no rules were broken. If the group dissolves into random noise (no clusters of 3+), points are deducted.

  ## 3. Mechanism for Preventing Collusion
  1.  **The Inspector:** You (the facilitator) hold the Inspector Token. During any beat, you may tap a participant on the shoulder. They must immediately show you their neighbors' colors and explain their next move based *only* on their Rule Sheet. If they say, "I'm doing this to help the group reach the Target," they fail the audit. They must say, "I am doing this because 3 neighbors are Red."
  2.  **The Noise Card:** Prepare one Rule Sheet that differs slightly (e.g., "If 2 or more neighbors differ, swap"). Give this to one participant secretly. This prevents perfect synchronization and ensures the system is probabilistic, not deterministic engineering.
  3.  **The Stake:** Announce at the start: "If anyone breaks character to explain the system to others, the Priority Voucher is destroyed." This makes the 'expert' participant a guardian of the silence.

  ## 4. Minute-by-Minute Timeline (120 Minutes)

  **00:00 – 00:15: Setup & Entry**
  *   Tape the grid. Participants enter.
  *   Hand out Rule Sheets (face down) and a random Color Card.
  *   **Instruction:** "Stand on a grid square. Do not open your sheet until I say. Do not speak. Your goal is to keep your personal score high by following your sheet."
  *   **Instruction:** "Open sheets. You have 2 minutes to memorize. Then we begin."

  **00:15 – 00:45: Phase 1 (Blind Churn)**
  *   Start the metronome (30-second beats).
  *   Participants enact local rules.
  *   **Facilitator Role:** Walk the grid. Audit 1-2 people per round. Mark audits on the scoreboard.
  *   **Observation:** Watch for clusters forming. Around minute 30, large monochromatic blobs should stabilize.
  *   **Stop:** At 00:45, freeze the room. Ask them to look at the pattern. Do not name it. Ask: "Is anyone trapped?" (Participants in large clusters will realize they cannot change color without neighbors changing first).

  **00:45 – 00:55: The Impasse & Transition**
  *   Announce Phase 2 Goal: "The Room must be 80% Blue by the end of this session."
  *   Remind them: "Rule Sheets still apply. Cluster Lock is now active."
  *   Restart metronome.

  **00:55 – 01:25: Phase 2 (Downward Pressure)**
  *   Participants attempt to reach the goal.
  *   **The Tension:** Those in Red Clusters (Symbols) *want* to turn Blue (to meet the goal) but *cannot* (due to Cluster Lock/Local Rules). They are held hostage by the pattern they constitute.
  *   **The Discovery:** They will realize individual will is impotent. They must coordinate a "border erosion" where outsiders break the cluster lock, allowing insiders to flip.
  *   **Facilitator Role:** Enforce the Cluster Lock ruthlessly. If a Symbol member flips without the Symbol being broken, audit them out.
  *   **Stop:** At 01:25. Regardless of success, freeze.

  **01:25 – 01:35: Reset & Decompression**
  *   Collect cards. Break the grid formation. Return to circle seating.
  *   Allow water/coffee. No discussion of the game yet.

  **01:35 – 01:55: The Debrief (Mapping the Analogy)**
  *   (See Debrief Script below).
  *   Introduce vocabulary: *Supervenience, Realization, Downward Causation, Causal Exclusion.*
  *   Map the "Cluster Lock" to the "Symbol Level."
  *   Map the "Rule Sheet" to the "Physical Law."

  **01:55 – 02:00: Closing**
  *   (See Closing Paragraph below).

  ## 5. Handling the "Expert" Participant
  If a participant raises their hand at minute 10 and says, "This is an Ising Model simulation of supervenience," do not validate or deny the physics.
  *   **Response:** "You may be right. But if you explain *why* it works to the others, you violate the 'Local Rule' constraint of this experiment, because you are importing global knowledge into a local agent. If you speak the theory, you are audited out, and the Voucher is voided."
  *   **Rationale:** This turns their knowledge into a burden. They become a guardian of the simulation's integrity rather than a spoiler. It mirrors the philosophical problem: they *know* the global truth, but the *system* they are in does not allow that knowledge to causally influence the micro-level moves without breaking the rules.

  ## 6. Predictable Failures & Recovery
  *   **Failure 1: The Grid is Too Small.**
      *   *Symptom:* Everyone is neighbors with everyone; patterns form instantly.
      *   *Recovery:* Expand the grid. Add empty "buffer" squares. Ensure participants have to move to find neighbors.
  *   **Failure 2: Participants Coordinate Illegally.**
      *   *Symptom:* Whispers, eye contact, synchronized flipping.
      *   *Recovery:* Stop the timer. Reset the scores to zero. Announce: "The substrate is noisy. Trust is not a variable in this physics." Restart. The threat of score reset usually curbs collusion.
  *   **Failure 3: No Pattern Emerges (Chaos).**
      *   *Symptom:* Colors keep flipping endlessly; no clusters form.
      *   *Recovery:* The threshold is too low. Pause. Announce a "System Parameter Change": "Rule update: You now require 4 neighbors to flip, not 3." This increases inertia and allows clusters to stabilize.

  ## 7. Debrief Script (Mapping the Experience)
  *Do not use the bolded terms until you define them.*

  "Look at what happened in Phase 2. You had a goal: 'Make the room Blue.' This was a high-level description. But your hands, your feet, and your cards were the only things that could actually move.

  **Question 1:** When you were inside that Red Cluster, and you wanted to turn Blue, what stopped you?
  *Expected Answer:* 'My neighbors.' 'The rules.'
  *Philosophical Map:* This is the **Causal Exclusion Problem**. Did the 'Red Cluster' stop you? Or did the four specific people standing next to you stop you? If the four people are the only causal forces, does the 'Cluster' exist as anything other than a description?

  **Question 2:** How did you eventually change the pattern?
  *Expected Answer:* 'We had to attack the edge.' 'We needed a critical mass.'
  *Philosophical Map:* You could not address the Cluster directly. You had to address the substrate. Yet, addressing the substrate individually didn't work; you had to address the *arrangement* of the substrate. This is **Downward Causation**. The pattern constrained the parts, not by magic, but by configuring the local relations of the parts.

  **Question 3:** Does it matter if we call it 'Downward Causation'?
  *Philosophical Map:* If every move is fully determined by the micro-rules, is 'Emergence' just a useful fiction for beings who can't track every atom? Or does the pattern have 'causal power' because it is the only level at which the system can be successfully predicted or controlled?

  **The Break in the Analogy:**
  In this room, you are conscious. You saw the Red Cluster and felt frustration. You knew the Global Goal. In Hofstadter's 'simmballs,' the symbols do not *know* they are symbols. The tension you felt—between your knowledge of the whole and your inability to act on it—is not present in the brain. The neurons do not know they are thinking a thought. That is the gap we must discuss."

  ## 8. Troubleshooting the "Conscious Agent" Gap
  During the debrief, explicitly highlight that the participants cheated the simulation by having foresight.
  *   **Prompt:** "You tried to solve the puzzle. The simmballs do not solve puzzles; they *are* the puzzle. When we talk about mental causation, are we the participants (trying to steer the brain) or are we the symbols (the result of the steering)?"

  ## 9. Closing Paragraph (To be read aloud)
  "This activity succeeded only because you are not simmballs. You could see the pattern, you could feel the constraint, and you could desire a different outcome. In the cognitive system we are studying, the 'symbols'—the beliefs, the desires, the thoughts—do not stand outside the substrate looking in. They are the substrate, churning. The question we must carry into the reading is not whether the pattern is 'real' in a physical sense, but whether a causal story told at the level of the pattern can ever be more than a shorthand for the churning. If the pattern constrains the parts only because the parts constrain each other, have we explained mind? Or have we merely described the shape of the cage? The text for next week assumes the cage is what matters. Your task is to decide if there is anything inside it."
