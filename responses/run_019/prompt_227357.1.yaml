answer: |-
  This is a rigorous stress-test of Expected Value (EV) Fanaticism. As a decision theorist, I treat this view not as a moral posture but as a structural claim about the architecture of rational choice: that the linearity of expectation is lexically prior to all other decision-theoretic constraints (like risk-aversion, probability thresholds, or dominance principles).

  Here is the map of its exposure, moving from intuitive pressure to formal breakdown, and finally to the meta-normative verdict.

  ---

  ### 1. Intuitive Cases: The Pressure of the Absurd

  The primary battleground for Fanaticism is not mathematics but *plausibility*. The view derives its force from the simplicity of the expectation formula ($\sum p_i v_i$), but this simplicity generates cases where the output diverges wildly from what any agent could recognize as "rational."

  **The Key Thought Experiments:**
  *   **Pascal's Mugging (Standard):** A stranger claims they can affect $3 \uparrow\uparrow\uparrow 3$ lives (using Knuth's up-arrow notation) unless you give them your wallet. The probability is tiny, but the magnitude swamps the cost.
      *   *Fanatic Response:* Bite the bullet. Pay the mugger.
      *   *Pressure Point:* This makes the agent vulnerable to *any* claim of sufficient magnitude, regardless of credibility. It violates the **Principle of Negligible Probability**.
  *   **The St. Petersburg Mugging:** A variant where the mugger offers a lottery ticket based on a coin flip sequence. If heads come up $n$ times, you get $2^n$ utility. The EV is infinite.
      *   *Fanatic Response:* Sell all your possessions to buy the ticket.
      *   *Pressure Point:* This implies **money-pump vulnerability**. If you have infinite EV, you should be indifferent between any two infinite EV options, yet one costs everything and the other costs nothing.
  *   **Astronomical Waste (Bostrom/Beckstead):** A choice between certainly saving 1,000 lives now vs. a $10^{-100}$ chance of saving $10^{100}$ lives in the future.
      *   *Fanatic Response:* Take the long-shot.
      *   *Pressure Point:* This demands **moral alienation**. It requires agents to ignore the tangible, certain suffering before them for a metaphysical sliver of possibility.

  **Bullet-Biting vs. Re-description:**
  A committed Fanatic (e.g., Nick Beckstead, Teruji Thomas) will often bite the bullet on the Astronomical Waste case, arguing that our intuitions about small probabilities are cognitive heuristics that fail in extreme domains. They argue that if the math says the long-shot is better, our intuition is wrong.

  However, on Pascal's Mugging, sophisticated Fanatics often attempt to **re-describe** the scenario. They argue that the probability isn't *actually* well-defined or that the mugger's claim is physically impossible (thereby assigning it probability 0, not just low probability).
  *   *Is this a defense or an admission?* It is arguably an admission. If you must appeal to physical impossibility to stop the mugging, you are no longer relying on decision theory alone; you are relying on empirical contingencies. If the mugger were a god, or if the physics allowed the payoff, you *would* have to pay. This reveals that Fanaticism is not a robust normative principle but a contingent one that breaks under metaphysical pressure.

  ### 2. Formal Results: The Breakdown of Expectation

  Fanaticism presupposes that expectations are well-defined real numbers that can be compared. Formal decision theory shows this is often not the case, particularly when utility is unbounded (which Fanaticism requires).

  **The Unbounded Utility Problem:**
  For Fanaticism to work, utility must be unbounded. If utility is bounded (capped), then no payoff can be large enough to swamp a low probability.
  *   *Consequence:* If utility is unbounded, the **St. Petersburg Paradox** arises. There exist lotteries with infinite expected value.
  *   *The Defeater:* If two options both have infinite EV, standard EUT cannot rank them. Fanaticism commands "Maximize EV," but offers no guidance when $EV(A) = \infty$ and $EV(B) = \infty$. This is not just a boundary; it is a **failure of action-guidance**.

  **The Pasadena Game (Nover & Hájek):**
  This is a more devastating formal objection. In the Pasadena game, the payoff series is conditionally convergent. The expected value depends on the *order* in which you sum the outcomes.
  *   *Result:* The expectation is **undefined**. It is not infinite; it is mathematically indeterminate.
  *   *Implication for Fanaticism:* The Fanatic says, "Rationally required to take the option with the highest EV." If EV is undefined, the command is vacuous.
  *   *Fanatic Counter:* "Restrict the domain to games with defined expectations."
  *   *Rebuttal:* Who decides the domain? If the real world contains causal chains that mirror the Pasadena structure (and there is no *a priori* reason to think they don't), Fanaticism is silent on how to live. A normative theory that falls silent in the face of mathematically possible scenarios is structurally incomplete.

  **Infinitesimal Probabilities:**
  If we allow infinitesimal probabilities (non-standard analysis) to model "one in a trillion" more rigorously, we run into issues with **lexicographic ordering**. Standard real-valued probabilities collapse distinct infinitesimals. If Fanaticism relies on standard reals, it cannot distinguish between a $1/10^{100}$ chance and a $1/10^{1000}$ chance effectively enough to prevent paradoxes when payoffs scale accordingly.

  **Verdict on Formal Results:** These are not merely boundaries. They are **internal contradictions**. Fanaticism demands unbounded value to generate its "swamping" effects, but unbounded value generates lotteries where expectation is undefined or infinite, rendering the maximization rule incoherent.

  ### 3. Hostage Commitments: Axiology and Aggregation

  Fanaticism is a decision rule, but it does not operate in a vacuum. It requires a value theory (axiology) to assign the $v_i$ in the expectation sum.

  **The Total Utilitarianism Link:**
  Fanaticism is most dangerous when paired with **Total Aggregative Axiology** (e.g., Classical Utilitarianism).
  *   *Why:* Total Utilitarianism implies that a world with more happy people is better, with no upper limit. This guarantees unbounded utility.
  *   *The Absurdity:* The "Repugnant Conclusion" becomes a mandate. Fanaticism forces you to trade a certain excellent world for a tiny chance at a vast, barely-livable population.
  *   *Severing the Companion:* Can you be a Fanatic without being a Total Utilitarian?
      *   *Option A: Bounded Axiology.* If you adopt a prioritarian view or a view with diminishing marginal value that asymptotes, you cap utility. **This kills Fanaticism.** The "astronomical payoff" can no longer swamp the certainty.
      *   *Option B: Person-Affecting Views.* If you only care about existing people, the "astronomical future" has less weight. **This weakens Fanaticism.**
      *   *Option C: Pluralistic Values.* If you value things that cannot be aggregated into a single sum (e.g., rights, integrity), EV calculation is impossible. **This dissolves Fanaticism.**

  **The Diagnosis:**
  Fanaticism is not the root cause of all its absurdities, but it is the **amplifier**.
  *   If the axiology is plausible (bounded), Fanaticism is harmless (because the math won't support the swamping).
  *   If the axiology is implausible (unbounded totalism), Fanaticism makes it catastrophic.
  *   *Exposure:* The Fanatic is held hostage by the claim that **value is unbounded**. To defend Fanaticism, you must defend the claim that there is no limit to the good that can be achieved in a single outcome. This is a heavy metaphysical burden. If value is bounded, Fanaticism is false. If value is unbounded, Fanaticism leads to the formal breakdowns in Section 2.

  ### 4. The Meta-Question: Falsification and Qualification

  Since this is a normative view, we cannot falsify it empirically. We must judge it by **coherence**, **action-guidance**, and **reflective equilibrium**.

  **Ranking Candidate Defeaters:**
  1.  **Formal Incoherence (Fatal):** The Pasadena Game and Infinite EV scenarios show that "Maximize EV" is not always a well-formed command. If a theory commands the impossible or the undefined, it is logically defective.
  2.  **Self-Defeat / Money Pumps (Fatal):** If Fanaticism allows agents to be pumped for all their resources (trading certainty for infinite lotteries that never pay out), it undermines the agent's ability to pursue *any* values, including the EV-maximizing ones. It is pragmatically self-defeating.
  3.  **Violation of Dominance (Severe):** In some infinite cases, Fanaticism violates state-wise dominance (choosing an option that is worse in every possible state because of a probability weighting). This violates a core axiom of rational choice.
  4.  **Counter-Intuitiveness (Awkward):** Merely violating intuition (e.g., Pascal's Mugging) is not fatal. Normative theories often correct intuition. However, when the violation is this extreme, it shifts the burden of proof entirely onto the theorist.

  **The Qualification Trap:**
  A sophisticated defender might say: "Fanaticism holds, *except* when probabilities are below a certain threshold, or when the series doesn't converge absolutely."
  *   *The Verdict:* This is **not Fanaticism**. This is a qualified decision rule (perhaps Risk-Weighted Utilitarianism or a threshold deontology).
  *   *The Defect:* If Fanaticism must be qualified to avoid absurdity, it loses its defining feature (the lexical priority of expectation).
  *   *Risklessness:* If the view is qualified enough to be plausible, it risks nothing—but it also claims nothing distinct. It becomes a trivial truth ("Maximize EV, unless you shouldn't"). A normative theory that retreats whenever it encounters friction is not a robust foundation for rationality.

  **Honest Verdict:**
  EV Fanaticism is **formally fragile and practically suicidal**.
  *   It is formally fragile because it requires unbounded utility to function as advertised, but unbounded utility breaks the expectation calculus (Pasadena/St. Petersburg).
  *   It is practically suicidal because it renders agents vulnerable to exploitation (Mugging) and paralyzes them in the face of undefined expectations.

  A defender can only save the view by retreating into a domain so narrow (bounded utility, defined series, non-negligible probabilities) that the view ceases to be "Fanaticism" and becomes standard, bounded Expected Utility Theory. If they hold the line on true Fanaticism (unbounded, no thresholds), they are committed to a form of rationality that no finite agent could instantiate without immediate ruin. The view fails the test of **reflective equilibrium** not because it conflicts with intuition, but because it conflicts with the structural requirements of coherent agency.
