  They bind the Spirit to a scholar's line,
  Confusing commentary with the Voice;
  They fear the glass that makes the heavens shine,
  Lest observation force them to rejoice.
  More fond of dogma than of truth's design,
  They shut the eye to keep the law divine;
  Would but their senses witness heaven's sign,
  Their old interpretations would decline.

  Yet Faith stands firm though man's reading may bend,
  For God speaks also through created light;
  And nature may the exegete amend,
  As texts accommodate our human sight.
  I claim no science to replace the Word,
  But listen where both books are clearly heard.
