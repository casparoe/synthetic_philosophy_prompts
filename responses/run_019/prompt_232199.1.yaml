answer: |-
  This is a precise dissection of the moral ontology hidden inside regulatory economics. You have correctly identified that the discount rate is not merely a technical parameter but a condensed ethical theory. To reconstruct the implicit theory of value, we must look at the **Ramsey Rule**, which is the theoretical backbone of the social discount rate ($r$).

  The formula is:
  $$r = \rho + \eta \cdot g$$

  Where:
  *   $r$ = Social Discount Rate
  *   $\rho$ (rho) = Pure rate of time preference (impatience)
  *   $\eta$ (eta) = Elasticity of marginal utility of consumption (aversion to inequality)
  *   $g$ = Expected growth rate of per capita consumption

  Here is the reconstruction of what the practice presupposes, what is underdetermined, and what happens if you change the axioms.

  ---

  ### 1. The Impatience Piece ($\rho$): Temporal Discrimination
  **The Question:** Does a positive $\rho$ commit you to the view that later lives matter less merely because they are later?

  **The Presupposition:** **Yes.**
  If $\rho > 0$, the model asserts that a unit of utility experienced in the future is intrinsically less valuable than a unit of utility experienced today, holding wealth constant.
  *   **Strict Presupposition:** The practice presupposes **Temporal Partiality**. It rejects the principle of "temporal neutrality" (the idea that *when* a good occurs is morally irrelevant).
  *   **The Moral Claim:** It treats time as a relevant moral category, similar to distance or identity. Just as some might argue you care less about a stranger than a kin, a positive $\rho$ argues you care less about a future self (or future generation) than a present one, simply due to temporal location.
  *   **Compatible but not Presupposed:** Proponents often argue $\rho$ reflects the *probability of extinction* (humanity might not exist in 100 years). However, standard CBA treats $\rho$ as a preference parameter, not a probability weight. If you use $\rho$ to capture extinction risk, you are conflating *value* with *probability*. Strictly speaking, a positive $\rho$ in the Ramsey equation is a value judgment, not an actuarial one.

  ### 2. The Growth Piece ($\eta \cdot g$): Diminishing Marginal Utility
  **The Question:** Does this commit you to treating welfare as worth less when people are rich? Is this the same logic as income redistribution?

  **The Presupposition:** **Yes, and Yes.**
  This term discounts future benefits because future people are expected to be richer ($g$), and because an extra dollar is worth less to a rich person than a poor one ($\eta$).
  *   **Strict Presupposition:** **Interpersonal (and Intergenerational) Comparability of Utility.** You cannot have this term unless you believe the utility of a person in 2070 can be compared to the utility of a person in 2024. It presupposes a common metric of welfare that transcends time.
  *   **The Redistribution Logic:** This is structurally identical to the justification for progressive taxation or wealth redistribution. It asserts that transferring resources from the rich (future generations) to the poor (current generations) increases total social welfare.
  *   **The Ethical Commitment:** By using this term to justify discounting, the agency commits to the view that **we should not sacrifice current consumption to save future lives if the future people will be significantly wealthier than we are.** It implies that a life saved in a rich future is "worth" fewer current dollars than a life saved in a poorer present, because the *utility loss* of death is weighed against the *utility cost* of prevention, and the marginal utility of consumption is lower for the rich.

  ### 3. The Duplicity: Descriptive vs. Normative
  **The Observation:** Agencies claim the rate is technical (based on market returns) but admit the choice determines ethical outcomes.

  **The Reconstruction:**
  This duplicity arises from conflating two different questions:
  1.  **What is the opportunity cost of capital?** (Descriptive/Market-based, often ~7%). This presupposes the current market allocation of capital is efficient and that private investment returns reveal the social value of waiting.
  2.  **What is the social rate of time preference?** (Normative/Ethical, often ~3%). This presupposes we know how much society *ought* to value the future.

  **Where the Practice is Underdetermined:**
  The specific number (e.g., 3%) is **ethically underdetermined**. You can arrive at $r = 3\%$ through different ethical combinations:
  *   **Scenario A:** $\rho = 1\%$, $\eta = 1$, $g = 2\%$. (Moderate impatience, moderate inequality aversion).
  *   **Scenario B:** $\rho = 0\%$, $\eta = 1.5$, $g = 2\%$. (No impatience, high inequality aversion).
  *   **Scenario C:** $\rho = 2\%$, $\eta = 0.5$, $g = 2\%$. (High impatience, low inequality aversion).

  **The Hidden Value Theory:**
  Standard CBA does not specify which scenario it uses. It simply inputs $r$. This allows the analyst to claim technical neutrality while importing a specific ethical stance.
  *   If you use market rates (7%), you presuppose **Status Quo Normativity**: The current distribution of wealth and time preferences revealed by the market is morally optimal.
  *   If you use a low social rate (3%), you presuppose **Paternalism**: The government knows better than the market how to value the future.

  ### 4. Concrete Scenario: Swapping to Zero Pure Time Preference ($\rho = 0$)
  If we adopt the view (championed by philosophers like Henry Sidgwick and economists like Frank Ramsey) that **pure time preference is ethically indefensible**, and set $\rho = 0$, here is exactly what changes and what stays the same in standard Cost-Benefit Analysis (CBA).

  #### What Would Change:
  1.  **The Discount Rate Drops:** If $\rho$ goes from ~1-1.5% to 0%, the total discount rate $r$ falls (assuming $\eta$ and $g$ stay constant). A 3% rate might become 1.5% or 2%.
  2.  **Long-Tail Projects Become Viable:** Climate policies, nuclear waste storage, and flood barriers with costs now and benefits in 80–100 years would see their Present Value (PV) of benefits explode. A benefit worth \$100 in 100 years at 3% is worth \$5 today. At 1%, it is worth \$37 today. This flips the decision rule for intergenerational projects.
  3.  **Justification Shifts from "Impatience" to "Wealth":** The agency could no longer say, "We discount because people prefer benefits sooner." They must say, "We discount *only* because future people will be richer."
  4.  **Explicit Distributional Analysis Required:** If $\rho = 0$, the only justification for discounting is $\eta \cdot g$. This forces the agency to explicitly defend the assumption that future people *will* be richer ($g$). If a specific policy (like climate collapse) implies $g$ could be negative (future people are poorer), the discount rate effectively becomes negative, meaning future benefits count for *more* than present costs. Standard CBA rarely models negative discount rates.

  #### What Would Stay Exactly the Same:
  1.  **Welfarism:** The metric remains utility/consumption. It does not switch to rights-based or duty-based ethics. Future lives are still valued based on their contribution to aggregate welfare, not their inherent right to exist.
  2.  **Kaldor-Hicks Efficiency:** The decision rule remains "do it if benefits > costs," not "do it if it respects rights." It still allows for the *potential* compensation of losers, not actual compensation.
  3.  **The Value of a Statistical Life (VSL):** The practice would still monetize lives. It would still assume a life can be traded off against consumption costs.
  4.  **Intragenerational Inequality:** Standard CBA typically sums costs and benefits across *current* people without weighting for income (a dollar is a dollar). Setting $\rho = 0$ fixes intergenerational equity but leaves intragenerational inequality untouched. You would still be willing to sacrifice the poor today for the rich today if the net sum is positive.
  5.  **The Growth Assumption:** The model would still presuppose that consumption ($g$) is a valid proxy for welfare. If future people are richer in GDP but poorer in health or environmental quality, the $\eta \cdot g$ term misfires.

  ### Summary of the Implicit Theory of Value
  To make standard CBA hang together, you must believe:
  1.  **Consequentialism:** The right action is the one that maximizes the sum of discounted utility.
  2.  **Commensurability:** Lives, health, time, and money can be converted into a single numeraire.
  3.  **Temporal Partiality (usually):** The present has a moral claim on resources superior to the future (via $\rho$), OR
  4.  **Utilitarian Redistribution:** The present has a moral claim on resources because it is poorer (via $\eta \cdot g$).

  The "duplicity" you notice is the agency's refusal to specify whether they are relying on #3 or #4. By citing "market rates," they hide #3. By citing "social welfare," they hide #4. But mathematically, they cannot have it both ways without contradiction. If you set $\rho = 0$, you strip away the claim that time itself matters, leaving only the claim that wealth matters. That forces a much harder conversation about whether we truly believe our grandchildren will be rich enough to justify letting them drown.
