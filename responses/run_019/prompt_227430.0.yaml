answer: |-
  Here is a teaching plan for your ninety-minute session on the Hole Argument, structured according to your specifications.

  ### 1. The Dependency Order

  You are correct that the mathematical interpretation must precede the metaphysical stakes, but the sequence requires a specific "pivot" point to work. If you introduce the metaphysics too early, it floats unanchored; too late, and the math looks like mere gauge freedom.

  **Sequence:**
  1.  **Active Diffeomorphisms (vs. Passive):** Establish that a diffeomorphism $\phi: M \to M$ can be viewed as *dragging* tensor fields over the manifold points, not just relabeling them.
  2.  **Model Equivalence (Mathematical):** Establish that $(M, g)$ and $(M, \phi^*g)$ are mathematically isomorphic solutions to the Einstein Field Equations (EFE).
  3.  **Manifold Substantivalism (The Target):** Define the view that manifold points possess identity independent of the metric field (haecceity).
  4.  **The Hole Construction:** Apply an active diffeomorphism that is the identity outside a region $H$ but non-trivial inside it.
  5.  **The Indeterminism Inference:** Show that given (1)–(4), data outside $H$ does not fix the metric distribution *on specific points* inside $H$.
  6.  **The Metaphysical Dilemma:** Force the choice between radical indeterminism and rejecting Substantivalism.

  **Justification of Placement:**
  *   **Why Active Diffeos first?** If you introduce Substantivalism before clarifying active diffeomorphisms, students will default to the "coordinate change" interpretation. If they think the transformation is just a change of description (passive), the two models are trivially the same physical situation, and the argument dies immediately. You must secure the intuition that $\phi$ moves the *field* relative to the *points* before you ask if the points matter.
  *   **Why Substantivalism before the Hole?** If you present the Hole construction without first articulating Substantivalism, students will treat the distinct models as a "gauge redundancy" by instinct. They need to feel the pull of the view that "points are real entities" so that the difference between $(M, g)$ and $(M, \phi^*g)$ feels like a genuine physical difference *before* you show them why that difference is problematic.
  *   **Why Indeterminism before the Dilemma?** You must demonstrate the *cost* of Substantivalism (radical indeterminism) before offering the *cure* (rejecting Substantivalism). If you offer the cure first, the argument looks like a motivated attack on substantivalism rather than a logical derivation of a problem.

  ### 2. The Carrying Construction

  You should use the standard "Hole" scenario, but with specific constraints to prevent technical sidetracks.

  **The Setup:**
  *   **Spacetime:** A globally hyperbolic spacetime $(M, g_{ab})$ satisfying the vacuum EFE.
  *   **The Region:** A compact region $H \subset M$ (the "Hole").
  *   **The Surface:** A Cauchy surface $S$ that lies entirely in the past of $H$ (or bounds $H$ such that $S \cap H = \emptyset$).
  *   **The Map:** A diffeomorphism $\phi: M \to M$ such that $\phi(p) = p$ for all $p \notin H$, but $\phi(p) \neq p$ for some $p \in H$.

  **Must Have:**
  *   **Vacuum:** The region $H$ should be empty of matter fields.
      *   *Reason:* If there is matter in $H$, students may become distracted by the coupling between matter and metric. They might ask, "Doesn't the matter field fix the metric?" By using vacuum GR, you isolate the metric field as the only dynamical entity, making it clear that the indeterminism concerns the geometry itself.
  *   **Identity Outside $H$:** The diffeomorphism must be the identity on $S$ and outside $H$.
      *   *Reason:* This is crucial for the determinism claim. It ensures that the "initial data" on $S$ is *identical* in both models. If the data differed, the indeterminism would be trivial.

  **Must Lack:**
  *   **Singularities/Pathologies:** Do not use a spacetime with CTCs or singularities inside $H$.
      *   *Reason:* You want the indeterminism to arise *solely* from the Hole Argument, not from known failures of determinism in pathological GR solutions (like Taub-NUT). The background spacetime should be as "well-behaved" as possible to show that GR is *made* indeterministic by Substantivalism, not that it was already broken.
  *   **Well-Posed IVP Technicalities:** Do not prove the IVP is well-posed.
      *   *Reason:* You want to *use* the intuition of the IVP ("data on $S$ determines the future"), not prove it. Explicitly stipulate: "Assume standard GR determinism holds for these models." If you try to justify the IVP, you invite technical objections about function spaces that obscure the metaphysical point.

  ### 3. The Misconception Map

  Here are the five critical misconceptions, when they will arise, and how to head them off.

  | Misconception | When it forms | How to head it off (Intervention Point) |
  | :--- | :--- | :--- |
  | **"This is just coordinate independence."** | **Step 1 (Active Diffeos).** Students will conflate $\phi^*g$ with a coordinate transformation $x \to x'$. | **Intervention:** Draw the "passive vs. active" diagram explicitly. Show that in the active view, the point $p$ keeps its label/identity, but the value of the field at $p$ changes. Say: "Coordinates are irrelevant here. We are moving the field, not the grid." |
  | **"GR is gauge invariant, so these are the same state."** | **Step 2 (Model Equivalence).** Students will prematurely dismiss the difference as "gauge." | **Intervention:** Pause and say: "Mathematically, yes. But we are asking about *ontology*. If spacetime points are real entities, does 'gauge equivalence' mean 'same physical reality' or 'indistinguishable but distinct realities'? We will decide this in Step 3." |
  | **"General Covariance causes the problem."** | **Step 4 (Hole Construction).** Students may think the problem is that GR is generally covariant. | **Intervention:** Clarify that General Covariance is a feature of the *equations*. The problem arises only when combining Covariance with Substantivalism. A non-covariant theory could still be substantivalist without this specific indeterminism. |
  | **"The argument proves points don't exist."** | **Step 6 (The Dilemma).** Students often treat the conclusion as a direct proof of relationalism. | **Intervention:** Emphasize the *reductio* structure. "The argument says: *If* Substantivalism, *Then* Indeterminism. It does not prove Substantivalism is false; it proves it is costly. One could accept the indeterminism." |
  | **"Metric Essentialism solves it easily."** | **Post-Session (Responses).** Students may think saying "points are individuated by the metric" is a trivial fix. | **Intervention:** Briefly note the cost. "If points are individuated by the metric, what happens to the points before the metric is defined? Or in quantum gravity where the metric is fluctuating? This is a major metaphysical commitment, not a free lunch." |

  ### 4. The Final Assessment Question

  Do not ask them to summarize the argument. Ask them to locate the break-point in a specific response. This tests whether they see the argument as a logical structure with premises that can be targeted.

  **The Question:**
  > "Consider a philosopher who accepts Manifold Substantivalism but wishes to avoid Radical Indeterminism. They propose the following response: 'We must deny that the diffeomorphically related models $(M, g)$ and $(M, \phi^*g)$ represent physically distinct possibilities, even though the manifold points are distinct entities.'
  >
  > **Which specific premise of the Hole Argument does this philosopher deny, and what specific metaphysical commitment must they abandon to maintain consistency?**"

  **Why this works:**
  *   To answer correctly, they must identify that the argument relies on the premise that **Leibniz Equivalence is false** (i.e., that diffeomorphic models represent distinct worlds).
  *   They must recognize that accepting this response forces the Substantivalist to abandon the claim that **manifold points have primitive thisness (haecceity) independent of the fields**. If points have independent identity, the two models *are* distinct possibilities. To say they are the same possibility while keeping substantivalism requires a complex modal metaphysics (like Lewisian counterpart theory) that effectively abandons the "default" substantivalism introduced at the start.
  *   It prevents the slogan answer ("They reject substantivalism") because the prompt stipulates the philosopher *accepts* substantivalism. They must find the nuanced escape route.

  ### 5. Scope Limitations

  Ninety minutes is insufficient to cover the history, the technicalities, and the full range of modern responses. You must explicitly tell the students what you are **not** doing to prevent confusion later.

  **Say this to the class:**
  > "In this session, we are isolating the logical structure of the Hole Argument as presented by Earman and Norton. To do that, we are explicitly declining three things:
  >
  > 1.  **History:** We will not cover Einstein's actual struggle with the *Entwurf* theory or the Zurich Notebook. That is a historical argument, not necessarily the logical one we are analyzing.
  > 2.  **Technical IVP Proofs:** We are assuming the standard determinism of GR holds for our models. We are not proving theorems about Cauchy surfaces; we are analyzing the metaphysical interpretation of those theorems.
  > 3.  **The Final Verdict:** I am not going to tell you which response (Relationalism, Metric Essentialism, Counterpart Theory) is correct. There is no consensus in the literature. Your goal is to understand why the problem exists, not to solve it."

  **Why exclude these?**
  *   **History:** Einstein's version involved coordinate conditions that are no longer standard. Mixing them confuses the modern differential geometric formulation.
  *   **IVP Proofs:** This is a philosophy course. Getting bogged down in Sobolev spaces kills the metaphysical momentum.
  *   **The Verdict:** Declaring a winner prematurely shuts down discussion. The pedagogical value lies in the tension of the dilemma, not the resolution.
