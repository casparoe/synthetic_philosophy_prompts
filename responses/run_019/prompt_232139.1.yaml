answer: |-
  (1) Lakatos's relevant commitments
  Lakatos's framework rejects naive falsificationism, where a single observation refutes a theory. Instead, he proposes the Methodology of Scientific Research Programmes, where the unit of appraisal is a series of theories sharing a hard core. The hard core consists of fundamental assumptions protected by a negative heuristic from direct attack. Surrounding this is a protective belt of auxiliary hypotheses, initial conditions, and measurement assumptions, which are adjusted via a positive heuristic to absorb anomalies. A programme is progressive if these adjustments lead to the prediction and confirmation of novel facts; it is degenerating if adjustments merely accommodate past data without new empirical content. Crucially, Lakatos emphasizes that rational reconstruction is historical; we judge programmes over time, not by instant rationality.

  (2) Predicted assessment
  Lakatos would likely view the replication crisis as evidence that many specific research programmes within psychology and biomedicine had become degenerating, relying on ad hoc adjustments rather than novel predictions. However, he would warn against treating failed replications as immediate refutations of the underlying theories. His verdict would be twofold: the original researchers often engaged in degenerating shifts by tweaking analyses to fit desired outcomes, but the reformers risk adopting a naive-falsificationist stance if they treat a single failed replication as decisive. He would regard the open science movement itself as a competing research programme that is currently progressive because it generates new methodological insights, provided it does not devolve into mere policing. The crisis represents a clash between a degenerating practice of theory-defense and a potentially progressive methodology of reform.

  (3) Reasoning, concept by concept
  Regarding the first question, Lakatos would insist that a failed direct replication targets the protective belt, not the hard core. The hard core contains the fundamental theoretical claims, while the belt includes experimental setups, operational definitions, and statistical assumptions. Consequently, a failure to reproduce is an anomaly that a programme may legitimately absorb by adjusting auxiliary assumptions, such as acknowledging measurement error or contextual moderators. To treat a single failed replication as refuting the core would be naive falsificationism, which Lakatos explicitly rejected. The programme survives provided the negative heuristic is maintained and the core is not abandoned prematurely.

  On the second question, the distinction between progressive problem-shifts and ad hoc stratagems lies in the prediction of novel facts. Defenders of a non-replicating effect often argue that hidden moderators explain the failure. Lakatos would deem this ad hoc if the moderator is introduced solely to save the theory without independent testability. However, if the revised protective belt specifies the boundary conditions and successfully predicts new phenomena in different contexts, the shift is progressive. The crucial test is whether the adjustment yields excess empirical content. Merely explaining away the failure without generating new, confirmed predictions indicates a degenerating programme attempting to immunize itself against criticism.

  Concerning the third question, Lakatos would evaluate reform practices based on whether they constitute a progressive research programme themselves. Pre-registration supports the positive heuristic by forcing researchers to articulate predictions beforehand, reducing the scope for ad hoc post-hoc adjustments. Meta-analysis assists in viewing the historical trajectory of a programme rather than isolated instances. However, he would criticize the fetishization of direct replication if it is used as a naive falsificationist tool to discard theories immediately. He would likely view the broader open science movement as progressive only if it leads to new theoretical discoveries and methodological innovations, rather than serving merely as a policing mechanism that stifles bold conjectures within the protective belt.

  (4) Limits of the prediction
  The primary limit of this reconstruction is that MSRP is inherently retrospective; Lakatos insisted we can only identify degenerating programmes historically, after the fact. In the midst of the crisis, it is underdetermined whether a specific non-replicating effect signals a degenerating programme or a temporary anomaly. Furthermore, identifying the hard core in social sciences is notoriously difficult compared to physics, making it hard to distinguish core refutation from belt adjustment. An alternative reading suggests Lakatos might view the reformers as the true naive falsificationists if they prioritize statistical significance over theoretical continuity, potentially stifling bold conjectures that require time to mature. Thus, while his framework diagnoses the pathology of ad hocery, it offers no algorithmic decision rule for the present moment.
