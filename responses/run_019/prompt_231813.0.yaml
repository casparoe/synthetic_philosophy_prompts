prompt: |-
  im trying to settle, once and for all, whether talk of DNA carrying information or being a genetic code is literal or just a really useful metaphor, and I keep noticing that people argue past each other because one person means Shannon-style correlation and the other means semantic content. Before I read another paper on it, I want the spec. Write me the desiderata for a theory of genetic information: the list of requirements any account has to meet for the claim "DNA carries information" or "the genetic code is a real code" to be more than a loose way of talking. For each requirement, give the case or consideration that forces it, and mark which you think are non-negotiable and which are just preferences of one camp. Then flag any pairs of requirements that might not be jointly satisfiable -- if the list itself amounts to an argument for or against literalism, I want that part especially. a table is fine.

  Some things I already suspect need to be handled, but I want you to make the case for or against each rather than just take my word for it: the arbitrariness of codon assignment (the triplet-to-amino-acid mapping is not forced by chemistry, so an account cant fall back on chemical necessity to explain why a sequence says one thing rather than another); the no-homunculus problem (the "reader" is tRNAs, aminoacyl-tRNA synthetases, and the ribosome, not a mind); translation as blind molecular machinery; synonymous codons, wobble, and how a misreading differs from a changed message; noncoding DNA, pseudogenes, regulatory sequence -- does information attach to all of it or only to what gets translated; what the information is supposed to be about (protein sequence? phenotype? something else) without the account circling back on itself; the fact that the same sequence can do different things in different cellular contexts (splicing, methylation, developmental environment); the fact that high Shannon information and functional importance come apart (a random sequence can be information-rich in one sense and do nothing in the other); how genuinely new coding sequences can arise by mutation and selection without an outside informant; and the bootstrapping one -- the genome encodes the very synthetases and ribosomal components that implement the reading of the code, so the account has to allow the code to specify its own interpreter without a vicious regress or a designer. If you think some of these are red herrings, say so and why.

  Finally, keep the scoring short: a paragraph each on how the main camps (causal/Shannon, semantic/teleosemantic, and outright eliminativist/metaphor-only) fare against your list. I care about the criteria more than the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Settle the debate on whether DNA information/code is literal or metaphorical.
      *   **Task:** Create a list of *desiderata* (requirements) for a theory of genetic information.
      *   **Structure:** For each requirement, provide the forcing case/consideration, mark as Non-Negotiable (NN) or Camp Preference (CP), and flag incompatibilities (tensions).
      *   **Specific Topics to Address:** Arbitrariness, No-Homunculus, Blind Machinery, Synonymous Codons/Wobble, Noncoding DNA, Aboutness (Content), Context-Dependence, Shannon vs. Function, Evolution of New Codes, Bootstrapping (Self-Interpreting).
      *   **Output Format:** Table is fine for the list, followed by short paragraphs scoring the main camps (Causal/Shannon, Semantic/Teleosemantic, Eliminativist).
      *   **Tone:** Philosophical, rigorous, analytical, avoiding hand-waving.

  2.  **Deconstruct the Core Tension:**
      *   The user identifies the root problem: Shannon (correlation/syntax) vs. Semantic (meaning/content).
      *   To be "literal," the theory needs to bridge the gap between physical chemistry and semantic content without invoking a mind (homunculus).
      *   The "Bootstrapping" problem is crucial: The code builds the machine that reads the code.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Arbitrariness.* If the mapping is chemically necessary, it's not a code, it's a law. A code requires convention.
          *   *Force:* Stereochemical theory vs. frozen accident.
          *   *Status:* NN for "Code," CP for "Causal Influence."

      *   *Requirement 2: No Homunculus.* Who reads the code? It can't be a little man.
          *   *Force:* Infinite regress.
          *   *Status:* NN.

      *   *Requirement 3: Distinction between Noise and Error.* A metaphor allows vague "damage." A literal code distinguishes mutation (change of message) from damage (loss of signal) vs. synonymous change (same message).
          *   *Force:* Wobble/Synonymous codons.
          *   *Status:* NN for "Code."

      *   *Requirement 4: Aboutness (Intentionality).* What is the information *about*? Amino acids? Traits? Fitness?
          *   *Force:* Avoiding circularity (it codes for what it causes).
          *   *Status:* NN for Semantic, CP for Causal.

      *   *Requirement 5: Context Independence/Stability.* If the meaning changes every time, it's not a code. But context (epigenetics) matters.
          *   *Force:* Splicing/Environment.
          *   *Status:* Tension point. NN for Code, but biologically problematic.

      *   *Requirement 6: Shannon vs. Function.* Random noise has high Shannon entropy but no function.
          *   *Force:* Distinguishing "data" from "instruction."
          *   *Status:* NN.

      *   *Requirement 7: Evolvability.* How does new information arise without a sender?
          *   *Force:* Natural Selection.
          *   *Status:* NN.

      *   *Requirement 8: Bootstrapping.* The genome encodes the ribosome/synthetases.
          *   *Force:* Causal loop.
          *   *Status:* NN.

      *   *Requirement 9: Scope.* Does non-coding DNA count?
          *   *Force:* "Junk" DNA vs. Regulatory.
          *   *Status:* CP (defines the boundary of the theory).

  4.  **Identifying Tensions/Incompatibilities:**
      *   *Arbitrariness vs. Chemical Constraint:* If it's too arbitrary, how did it evolve? If too chemical, it's not a code.
      *   *Context Independence vs. Biological Reality:* Codes usually imply stable mapping. Biology is highly context-sensitive (pleiotropy, epigenetics).
      *   *Aboutness vs. Causal Closure:* If information is semantic, does it have causal power? If it's just causal, is it semantic?
      *   *Bootstrapping vs. Sender-Receiver Model:* Standard communication models assume pre-existing channel. Biology creates its own channel.

  5.  **Refining the List & Categorization:**
      *   Need to ensure the "Non-Negotiable" vs. "Camp Preference" distinction is clear.
      *   *NN:* Things required for *any* robust theory to avoid triviality or regress.
      *   *CP:* Things that distinguish Shannonians from Semanticists.

  6.  **Drafting the Scoring (The Camps):**
      *   *Causal/Shannon:* Good on physics, bad on meaning. Fails "Aboutness."
      *   *Semantic/Teleosemantic:* Good on function/evolution, struggles with "Arbitrariness" and "Bootstrapping" (needs selected effect).
      *   *Eliminativist:* Solves the paradoxes by denying the premise. Safe but explanatory weak.

  7.  **Review against User Constraints:**
      *   *Did I address the specific topics?* (Arbitrariness, Homunculus, Wobble, Noncoding, Aboutness, Context, Shannon/Function, Evolution, Bootstrapping). Yes, weave them into the desiderata.
      *   *Is the table clear?* Yes.
      *   *Are tensions flagged?* Yes.
      *   *Is the scoring short?* Yes, paragraph each.
      *   *Tone:* Philosophical rigor.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure not to conflate "information" with "code." They are related but distinct. The prompt asks for both ("DNA carries information" OR "genetic code is a real code"). I should structure the desiderata to cover the stronger claim (Code) which implies Information.
      *   *Refinement on Bootstrapping:* This is the hardest one. A literal code usually implies a sender. Evolution is a blind sender. Need to specify that the theory must account for the *origin* of the convention without a designer.
      *   *Refinement on Aboutness:* The "Content" problem. Does DNA code for proteins or phenotypes? If phenotypes, it's messy. If proteins, it's narrow.
      *   *Refinement on Tensions:* Explicitly highlight the "Stability vs. Context" tension. That's where most theories break.

  9.  **Final Polish:** Check the "Non-Negotiable" tags. For a theory to claim *literalism*, arbitrariness and no-homunculus are NN. For a theory to just claim *causal influence*, they aren't. I will frame the desiderata based on the standard of *Literal Code/Information* as requested ("to be more than a loose way of talking").

      *(Self-Correction on "Non-Negotiable"):* I need to be careful. What is NN for a *Semantic* theory might be CP for a *Causal* theory. I will label them NN for the claim of *Literalism* itself. If you want to say it's literal, you *must* meet these. If you can't, you concede it's metaphorical.

      *Wait, one nuance:* The user asks for desiderata for a theory of genetic information *such that the claim is more than loose talk*. So, NN = Required for Literalism. CP = Specific flavor of literalism.

      *Let's build the table.*

      *   *Desideratum 1: Conventionality (Arbitrariness).*
      *   *Desideratum 2: Mechanical Realization (No Homunculus).*
      *   *Desideratum 3: Error vs. Noise (Wobble/Synonyms).*
      *   *Desideratum 4: Content Specification (Aboutness).*
      *   *Desideratum 5: Channel Stability vs. Context.*
      *   *Desideratum 6: Functional vs. Syntactic Distinction (Shannon).*
      *   *Desideratum 7: Historical Origin (Evolution).*
      *   *Desideratum 8: Reflexivity (Bootstrapping).*

      *Tensions:* 1 & 8 (Convention needs establisher, Bootstrapping says system establishes itself). 4 & 5 (Content needs stability, Biology is context-sensitive).

      *Scoring:* Keep it punchy.

      *Red Herrings:* Noncoding DNA is mostly a scope issue, not a fundamental metaphysical hurdle. Wobble is actually a strong point *for* code theories (shows error tolerance).

      *Let's write.*
answer: |-
  Here are the desiderata for a theory of genetic information sufficient to sustain the claim that DNA carries information or constitutes a code *literally*, rather than metaphorically.

  ### Desiderata for a Literal Theory of Genetic Information

  | # | Requirement | Forcing Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Conventionality (Arbitrariness)** | The mapping between vehicle (codon) and content (amino acid) cannot be determined solely by physicochemical necessity. If A *chemically forces* B, it is a law, not a code. A code requires a contingent mapping rule. | **NN** |
  | **2** | **Mechanical Realization (No Homunculus)** | The "reading" of the code must be fully accounted for by molecular interactions (tRNA, synthetases, ribosome) without invoking an internal agent or mind that "understands" the symbol. | **NN** |
  | **3** | **Error vs. Noise Distinction** | The theory must distinguish between a *mutation* (change of message), *damage* (loss of signal), and *synonymous variation* (same message, different vehicle). Without this, "information" collapses into "physical state." | **NN** |
  | **4** | **Content Specification (Aboutness)** | The theory must specify what the DNA is *about* without circularity. Does it code for amino acids, proteins, traits, or fitness? If it codes for "what it causes," the definition is trivial. | **NN** |
  | **5** | **Channel Stability vs. Context** | A code implies a stable translation rule. However, biological output varies by context (splicing, methylation, environment). The theory must explain how the code remains constant while the "message" interpretation varies. | **NN** |
  | **6** | **Shannon vs. Function Separation** | The theory must distinguish high entropy (random sequence) from functional instruction. A random sequence has high Shannon information but zero genetic information. | **NN** |
  | **7** | **Historical Origin (Evolvability)** | The theory must explain how new coding sequences arise via blind variation and selection without an external "sender" imparting meaning. | **NN** |
  | **8** | **Reflexivity (Bootstrapping)** | The genome encodes the machinery (ribosomes, synthetases) that reads the genome. The theory must allow the code to specify its own interpreter without vicious regress. | **NN** |
  | **9** | **Scope Boundary** | Does "information" apply to noncoding DNA, pseudogenes, and regulatory regions? A literal theory must define the boundary between "data storage" and "causal background." | **CP** |
  | **10** | **Sender-Receiver Symmetry** | In standard communication, sender and receiver are distinct. In biology, they are the same lineage. The theory must handle this identity without collapsing the communication model. | **CP** |

  **Status Key:** **NN** = Non-Negotiable (If a theory fails this, it cannot claim literalism). **CP** = Camp Preference (Distinguishes specific flavors of literalism, e.g., Teleosemantics vs. Causal).

  ### Incompatibilities and Tensions

  The following pairs of desiderata create the primary friction points where theories tend to break. If you find these jointly unsatisfiable, the list itself argues against literalism.

  *   **Tension A: Conventionality (1) vs. Bootstrapping (8).**
      *   *The Conflict:* Conventions usually require an establisher (a sender/agent) to fix the arbitrary mapping. Bootstrapping requires the system to build its own interpreter. If the mapping is arbitrary, how did the machinery evolve to respect it *before* the machinery existed to enforce it?
      *   *Implication:* Satisfying both requires a theory of *co-evolution* where the mapping and the machinery lock in simultaneously. If you cannot model this lock-in without a designer, Requirement 1 forces you toward metaphor.

  *   **Tension B: Content Specification (4) vs. Context Stability (5).**
      *   *The Conflict:* To have literal content (e.g., "Code for Leucine"), the mapping must be stable. But biological context (epigenetics, splicing) means the same sequence yields different phenotypic "meanings."
      *   *Implication:* If you define content narrowly (amino acids), you satisfy Stability but lose biological relevance (Phenotype). If you define content broadly (traits), you satisfy Relevance but lose Stability. A literal theory must isolate the *coding* layer from the *causal* layer without severing the link between them.

  *   **Tension C: No Homunculus (2) vs. Content Specification (4).**
      *   *The Conflict:* Semantic content usually implies "meaning for someone." If there is no homunculus (2), who is the meaning for? Teleosemantics argues "meaning for selection," but selection is not a mind.
      *   *Implication:* If you cannot naturalize "aboutness" without a mind, you must concede that "information" is merely causal correlation (Shannon), rendering the semantic claim metaphorical.

  ### Red Herrings vs. Critical Constraints

  *   **Noncoding DNA (Scope):** This is largely a **CP** issue. Whether introns carry "information" depends on your definition of the channel. It is not a metaphysical blocker for literalism, merely a boundary dispute.
  *   **Wobble/Synonymous Codons:** This is **not** a red herring; it is critical evidence for **Requirement 3**. The fact that biology tolerates vehicle change without content change is the strongest argument *for* the code being literal (it behaves like a digital code with error tolerance) rather than purely chemical (where structure dictates function rigidly).
  *   **Shannon vs. Function:** This is the most common point of talking past one another. A theory that conflates them fails **Requirement 6**. High entropy is not information in the genetic sense.

  ### Scorecard: How the Camps Fare

  **Causal / Shannon Information Theory**
  This camp secures **Mechanical Realization (2)** and **Shannon/Function (6)** easily by reducing information to correlation and physical causation. However, it fails **Conventionality (1)** and **Content Specification (4)**. By treating DNA as merely a causal chain with high complexity, it cannot explain why the codon mapping is arbitrary rather than necessary, nor can it distinguish "error" from "alternative cause" without referencing function. It avoids the Homunculus by eliminating meaning entirely, which satisfies the physicist but concedes the "code" claim is metaphorical.

  **Semantic / Teleosemantic Theory**
  This camp (e.g., Godfrey-Smith, Maynard Smith) targets **Content Specification (4)** and **Conventionality (1)** by grounding meaning in evolutionary history (selected effects). It handles **Evolvability (7)** well. However, it struggles with **Bootstrapping (8)** and **Channel Stability (5)**. If the "meaning" is fixed by selection history, how do we account for the origin of the first code where no history existed? Furthermore, teleosemantics often relies on a distinction between "normal conditions" and "error," which becomes fuzzy in highly context-sensitive biological systems, risking a covert homunculus in the form of "Nature's purpose."

  **Eliminativist / Metaphor-Only**
  This camp (e.g., Keller, Oyama) wins the logical consistency game by rejecting the premise. They argue that **Conventionality (1)** and **No Homunculus (2)** are jointly unsatisfiable without a designer, so "information" must be heuristic. They score perfectly on **Bootstrapping (8)** by dissolving the loop into a developmental system. The cost is explanatory power: they must treat the striking digital-like features of genetics (universality, redundancy, error correction) as coincidental structural analogies, which many biologists find scientifically unhelpful. They satisfy the logic but abandon the utility.
