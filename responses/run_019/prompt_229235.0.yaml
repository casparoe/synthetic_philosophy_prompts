prompt: |-
  In 1940 the British army got chased out of France, left nearly all its equipment on the beaches, and yet Dunkirk got rememberd in Britain as something close to a triumph. Analyze the Dunkirk evacuation as a case study in how "lost cause" national myths get built. Don't just retell the story -- I want the mechanics. What raw material did the episode hand the mythmakers (the little ships, the fact that far more men were lifted off than anyone expected, the genuine improvisation)? What did the myth have to quietly leave out to work (the scale of the defeat in France, the allies who fought the rearguard and got left behind, the fact that even Churchill warned the public not to treat the escape as a victory)? And then run the analysis in reverse: what does Dunkirk show about the conditions a defeat needs in order to be converted into a founding myth -- and use that to explain why other British defeats, like the fall of Singapore, never got the same treatment. End by saying whether you think the myth was, on balance, a lie that happened to be useful or something more defensible than that. Max 700 words, and open with a single sentence stating your thesis before you get into any of the details.
