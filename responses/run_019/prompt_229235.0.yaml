      *   Improvisation: Shows British pluck/adaptability vs. German machine efficiency.
      *   *Focus:* These elements shift focus from *why* they were there (defeat) to *how* they left (rescue).

  4.  **Drafting - Step 3: Omissions (The "Edit"):**
      *   What had to be hidden/downplayed?
      *   The defeat itself: France fell, equipment lost.
      *   The Rearguard: French troops left behind to be captured/killed.
      *   Churchill's Warning: "Wars are not won by evacuations."
      *   *Focus:* The narrative required amnesia regarding the strategic failure to highlight the tactical rescue.

  5.  **Drafting - Step 4: Reverse Analysis (Conditions for Myth vs. Singapore):**
      *   What conditions allow a defeat to become a myth?
      *   Condition 1: Survival of the core fighting force (Dunkirk saved the army; Singapore lost the army).
      *   Condition 2: Civilian participation/heroism (Dunkirk had boats; Singapore was distant colonial defeat).
      *   Condition 3: Future hope (Dunkirk led to Battle of Britain; Singapore led to occupation).
      *   *Comparison:* Singapore was shame (surrender), Dunkirk was deliverance (escape).

  6.  **Drafting - Step 5: Evaluation (Lie vs. Defensible):**
      *   Was it a lie? Yes, strategically.
      *   Was it useful? Yes, morale.
      *   Is it defensible? It captured a psychological truth (refusal to quit) even if militarily false.
      *   *Verdict:* More than a lie; a necessary psychological pivot.

