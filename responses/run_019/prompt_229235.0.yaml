      *   *Draft:* The Dunkirk evacuation stands as a masterclass in national myth-making, where selective emphasis on civilian heroism and miraculous survival transmuted a catastrophic military defeat into a foundational narrative of collective resilience.

  3.  **Drafting - Step 2: Raw Material (The "Build"):**
