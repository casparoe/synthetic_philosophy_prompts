answer: |-
  1. Hayek defines "planning" broadly as any rational allocation of resources to show that all economic activity involves intention, thereby forcing the debate onto the mechanism of coordination rather than the mere presence of design. He distinguishes between the inevitable planning inherent in individual action and the specific claim that the whole system must be directed by a single authority.

  2. By reframing the dispute, Hayek exposes the socialist claim that only their system is "planned" as a rhetorical sleight of hand, shifting the burden of proof to demonstrate why central direction is superior to decentralized competition. This move allows him to argue that the market is not an unplanned chaos but a superior method of utilizing dispersed knowledge.

  3. Lange's proposal falls squarely on the "central planning" side of Hayek's line because the Planning Board determines the parameters (prices) to which all managers must conform, rather than allowing prices to emerge from bilateral agreements. Even though managers follow local rules, the coordination mechanism relies on a single authority synthesizing data that Hayek argues cannot be centrally known.

  4. This passage extends Mises's calculation argument by shifting focus from the logical impossibility of valuing capital goods to the practical impossibility of aggregating dispersed, tacit knowledge. It does not replace Mises's point but supplements it with an epistemological critique of how information is generated and communicated.

  5. Your reading is incorrect because Hayek is not merely stipulating definitions but identifying an epistemological constraint that makes central planning functionally impossible, not just semantically distinct. The distinction matters because it highlights that the market process discovers knowledge that no central board could ever possess to set trial prices.
