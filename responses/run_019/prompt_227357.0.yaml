      *   *Section 1 (Intuition):* Focus on Pascal's Mugging as the hammer. Distinguish between "Mugging" (epistemic suspicion) and "St. Petersburg" (mathematical certainty of divergence). The Fanatic bites the Mugging bullet. Is that credible? It isolates the theory from human practice.
      *   *Section 2 (Formal):* This is the technical kill zone. The Pasadena Game is crucial because EV *doesn't exist*. Also, the Hájek & Smithson arguments on undefined expectations. If EV is undefined, the norm "Maximize EV" is silent. That's a major boundary. Unbounded utility is required for Fanaticism, but unbounded utility leads to Mugging. It's a trilemma.
      *   *Section 3 (Hostage):* Connect to Longtermism. Fanaticism drives Longtermism. If Fanaticism is false, Longtermism loses its strongest engine. But the absurdities often come from the *value* of the outcomes (infinite populations), not just the probabilities. Distinguish between "Probability Fanaticism" and "Value Fanaticism."
      *   *Section 4 (Meta):* How do we judge normative theories? Coherence vs. Intuition. If Fanaticism requires such heavy qualification (bounded utility, restricted priors) to avoid absurdity, does it collapse into "Prudent Maximization"? The "Death by a Thousand Cuts" via qualifications.

  5.  **Refining the Tone:**
