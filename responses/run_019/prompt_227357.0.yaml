  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Decision theorist with expertise in normative ethics and rational choice foundations.
      *   **Task:** Stress-test the position of "Expected Value (EV) Fanaticism." Do *not* defend it, but map its exposures/weaknesses.
      *   **Position:** EV Fanaticism (maximize EV regardless of probability size or payoff magnitude, even against certainty).
      *   **Structure:**
