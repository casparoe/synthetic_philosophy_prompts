      *   **Task 2: Distinguish Presupposition vs. Compatibility:** What does the practice *strictly* require vs. what merely *fits*? Which rival theories are ruled out vs. merely unneeded? (Speaker-intention, use theories, audience-oriented, interpretive-community).
      *   **Task 3: Assess Coherence:** Can the theory explain consulting contemporary dictionaries? Why *general* linguistic community conventions rather than legal/legislative ones?
      *   **Task 4: Concrete Implications of Intentionalism:** If we switched to forthright intentionalism, what changes in courtroom practice? (New evidence, irrational moves, survivals).

  2.  **Task 1: Reconstructing the Implicit Theory (Textualism/Objective Public Meaning):**

      *   *Premise:* The law is a public command, not a private secret.
      *   *Meaning:* Meaning is objective, public, and fixed at enactment. It resides in the words themselves as understood by a reasonable person, not in the hidden minds of the legislators.
      *   *Communication Model:* Impersonal/Bureaucratic. The legislature speaks *through* the text to the citizen. The citizen cannot read minds, only text.
      *   *Dictionary Role:* Dictionaries represent sedimented public usage/conventions. They are proxies for the "ordinary meaning."
      *   *Legislative History Role:* Subjective, potentially manipulative, not voted on, not publicized in the same way.
      *   *Implicit Theory:* **Objective Public Meaning Originalism (Textualism).** Meaning = Convention-based semantic content available to the general public at time $T_0$.

  3.  **Task 2: Presupposition vs. Compatibility (The Philosophical Nuance):**

      *   *Strictly Presupposed:*
          *   Meaning is distinct from private psychological intent (rules out pure Speaker-Intentionalism).
