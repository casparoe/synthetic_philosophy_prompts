answer: |-
  This practice—privileging general-purpose dictionaries over legislative history—is the hallmark of modern **Textualism**, specifically a variety often termed **Objective Public Meaning Originalism**. To understand what this commits the legal system to, we must excavate the philosophy of language buried beneath the judicial opinion.

  ### I. The Implicit Theory of Meaning

  For a dictionary to outrank a drafter, the legal system must presuppose a specific ontology of legal meaning.

  **1. Meaning as Convention, Not Psychology**
  The practice presupposes that the meaning of a statute is not a mental state residing in the heads of the legislators (speaker meaning), but a **public convention** residing in the language itself (sentence meaning). It assumes that once a text is enacted, it detaches from its authors. The law is an object, not a testimony.
  *   **The Commitment:** Meaning is **semantic**, not **pragmatic** in the Gricean sense. It is determined by the rules of the language game shared by the community, not by the specific intentions of the players in a specific instance.
  *   **The Communication Model:** The legislature communicates with the public via a **one-way broadcast of coded instructions**. The "code" is the English language (or relevant vernacular). The citizen is the decoder. Because the citizen cannot access the legislators' minds, the law must be intelligible solely through the public code. If the legislators meant $X$ but wrote $Y$ (where $Y$ conventionally means $Z$), the law is $Z$. To rule otherwise is to trap the citizen in a secret law.

  **2. The Epistemic Status of the Dictionary**
  Why the dictionary? In this theory, the dictionary serves as a **proxy for social convention**. It is treated as an empirical record of how the linguistic community uses words.
  *   **The Drafter's Deficit:** A floor statement is a *particular* use of language by a *single* actor. It is data point $n=1$. It is susceptible to strategic manipulation (a sponsor might say something to please a lobby, knowing the text says otherwise).
  *   **The Lexicographer's Authority:** A dictionary represents sedimented usage across thousands of contexts over time. It is data point $n=\infty$. It represents the "system" of language, whereas the legislator represents a specific "message."
  *   **The Presupposition:** For the dictionary to outrank the drafter, meaning must be **aggregative and standardized**. It assumes that "ordinary meaning" is a stable, discoverable fact about the world, similar to a scientific fact, rather than a negotiated understanding between specific parties.

  **3. Temporal Fixity**
  The reliance on editions from the era of enactment presupposes that meaning is **fixed at $T_0$ (enactment)**. Language evolves, but the law does not evolve with it unless amended. This rules out the idea that the statute's meaning drifts as public usage drifts.

  ### II. Presupposition vs. Compatibility (Philosophical Underdetermination)

  You asked to distinguish what the practice *strictly* requires versus what merely *fits*. This is where the textualist theory is often more pragmatic than philosophical.

  **1. Strictly Presupposed (The Non-Negotiables)**
  *   **Anti-Intentionalism:** The practice strictly rules out **Strong Speaker-Intentionalism**. It denies that the law *is* the will of the legislature. If it were, the drafter's testimony would be primary evidence, and the dictionary secondary.
  *   **Accessibility:** It presupposes that meaning must be **accessible to a reasonable outsider**. This rules out **Esotericism** (the view that only the legislative insiders know the meaning).
  *   **Objectivity:** It presupposes that meaning is **mind-independent** (once enacted). This rules out **Radical Constructivism** (the view that the judge creates meaning in the act of interpretation).

  **2. Merely Compatible (The Underdetermined Areas)**
  *   **Use Theories (Wittgenstein):** Textualism fits comfortably with the idea that "meaning is use." However, it does not *require* a full Wittgensteinian account. A textualist does not need to believe that meaning is *only* use in a form of life; they only need to believe that *legal* meaning is bound by standard use. They could theoretically believe in referential semantics (words point to things) and still use dictionaries to find the pointers.
  *   **Audience-Oriented Views:** The practice fits an **Audience-Reception Theory** (meaning is what the audience understands). However, it doesn't commit to a specific theory of *which* audience. Is it the "reasonable person"? The "educated citizen"? The "average voter"? The practice works with any of these, provided the audience is *external* to the legislature.
  *   **Conventionalism:** It fits with **Lewisian Convention** (meaning is a solution to a coordination problem), but it doesn't strictly require it. One could believe meaning is fixed by causal history of terms (Kripke/Putnam) and still use dictionaries as evidence of that history.

  **3. Rival Accounts Ruled Out**
  *   **Gricean Pragmatics:** Textualism largely rejects the Gricean maxim that speaker intention overrides conventional meaning. In law, the "conversational implicature" of a committee report cannot override the "literal meaning" of the text.
  *   **Dynamic Interpretation:** It rules out the view that statutory meaning updates automatically with contemporary values or language use (the "Living Statute" theory), at least regarding semantic content.

  ### III. Assessment of Coherence

  The textualist practice faces two significant coherence challenges regarding its implicit theory of meaning.

  **1. The Dictionary Lag Problem**
  *   *The Tension:* Textualists claim meaning is fixed by public convention *at the moment of enactment*. Yet, dictionaries are descriptive records of *past* usage, compiled over years. A dictionary published in 1980 reflects usage from 1970–1979.
  *   *Coherence Check:* If the relevant convention is the one existing *exactly* when the bill was voted on, a dictionary is inherently imperfect evidence. It is a map drawn before the territory existed.
  *   *Resolution:* Courts manage this by using multiple dictionaries or corpora (like Google Books Ngrams) to triangulate. However, strictly speaking, relying on a dictionary presupposes that **linguistic conventions change slowly enough that a nearby publication date is a valid proxy.** If language were highly volatile, the practice would be incoherent.

  **2. The "General Public" vs. "Legal Community" Problem**
  *   *The Tension:* Textualists insist on "ordinary meaning" (general public conventions) to ensure fair notice. Yet, statutes often regulate technical fields (tax, environmental science, patent law).
  *   *The Incoherence:* If a statute uses the word "source" in an environmental context, the "ordinary meaning" (a spring or origin) might differ from the "technical meaning" (a smokestack).
      *   If the court uses the **ordinary meaning**, it may defeat the statute's function (incoherent with legislative purpose).
      *   If the court uses the **technical meaning**, it violates the "fair notice to the general public" rationale (incoherent with the democratic justification for textualism).
  *   *The "Term of Art" Escape Hatch:* Courts often say, "We use ordinary meaning *unless* it is a term of art." But who decides if it is a term of art? The judge. This reintroduces the discretion textualism seeks to eliminate.
  *   *Verdict:* The practice is **partially incoherent** here. It claims to rely on the conventions of the *whole* linguistic community but silently switches to the conventions of a *sub-community* (lawyers, scientists) when convenient, without a principled theory for distinguishing the two other than judicial intuition.

  ### IV. Concrete Implications of Switching to Forthright Intentionalism

  If the legal system abandoned the "Objective Public Meaning" theory and adopted **Forthright Intentionalism** (the law is what the enacting coalition subjectively intended), courtroom practice would undergo a radical transformation.

  **1. New Central Evidence**
  *   **Drafting History:** Preliminary drafts, redlines, and deleted text would become crucial. Under textualism, deleted text is irrelevant (it's not law). Under intentionalism, it shows what they *didn't* want, clarifying what they *did* want.
  *   **Staff Communications:** Emails, memos, and internal notes between legislative aides and sponsors would become discoverable and admissible. Currently, these are ignored; under intentionalism, they are direct evidence of mental states.
  *   **Sponsor Testimony:** Floor statements would shift from "persuasive at best" to **dispositive**. If the sponsor says, "This clause is intended to cover X," and the text is ambiguous, the case closes.
  *   **Veto Statements & Signing Statements:** These would carry immense weight as explicit declarations of intent by the executive (who is part of the enactment process).

  **2. Irrational Moves (What would become forbidden?)**
  *   **The "Plain Meaning" Stopper:** Currently, if text is "plain," inquiry stops. Under intentionalism, even "plain" text could be overridden by overwhelming evidence of a drafting error or specific contrary intent (the "scrivener's error" doctrine would expand from a rarity to a standard tool).
  *   **Dictionary Citation:** Citing a dictionary to contradict a sponsor's explicit definition would become irrational. If the legislature says "For this bill, 'vehicle' includes bicycles," a dictionary definition excluding bicycles is irrelevant.
  *   **Canons of Construction:** Many linguistic canons (e.g., *ejusdem generis*, *expressio unius*) are proxies for intent. If you have direct evidence of intent, these heuristic proxies become unnecessary and potentially misleading.

  **3. What Would Survive?**
  *   **The Text as Primary Evidence:** The text would remain the *best* evidence of intent, simply because it is the most reliable, voted-on record. Intentionalism does not mean ignoring text; it means text is evidence of intent, not the *source* of law itself.
  *   **Stare Decisis:** Precedent would likely remain important to prevent constant relitigation of legislative intent, though precedents based on "plain meaning" might be more easily overturned if new historical evidence of intent emerged.
  *   **Constitutional Limits:** The shift would not allow the legislature to intend unconstitutional outcomes. The boundary of permissible intent would remain fixed by the Constitution.

  **Summary of the Shift**
  The trial would change from a **linguistic analysis** ("What does this word mean in English?") to a **historical investigation** ("What did these people mean by this word?"). The judge would act less like a lexicographer and more like a historian or detective. The certainty provided by the "objective text" would be traded for the fidelity provided by "subjective purpose," likely increasing litigation costs while potentially aligning outcomes more closely with democratic will.
