      *(Refining the "Dictionary" point):* Why a dictionary? Because it claims to be a neutral repository of *shared* conventions. A legislator's statement is a *private* act (even if public record) regarding a specific instance. The dictionary represents the *system*.

      *(Refining the "Coherence" on General vs. Legal Community):* Textualists argue that unless it's a term of art, it's ordinary language. But who decides if it's a term of art? The judge. This introduces discretion the theory claims to avoid. I should highlight this.

