  ### Comparative Analysis: Etiological vs. Causal-Role Accounts of Function

  For a general-audience science piece, the core tension lies between **history** and **current utility**. The etiological account (often associated with Ruth Millikan and Karen Neander) argues that function is inherently historical: a trait has a function only if it exists now because its ancestors were selected for performing that specific effect. It is a "proper function" account, grounded in evolutionary lineage. In contrast, the causal-role account (associated with Robert Cummins) argues that function is ahistorical and systemic: a part has a function if it currently contributes to a capacity of the containing system, regardless of how it got there.

  #### Running the Test Cases

  **1. The Drift Trait (No Selection History)**
  *   **Etiological:** This account denies the trait has a function. Since the trait spread through genetic drift rather than natural selection, there is no historical selection pressure that explains its presence based on a specific effect. It is merely a feature, not a functional adaptation.
  *   **Causal-Role:** This account affirms the trait has a function, provided it currently contributes to some capacity of the organism (e.g., structural stability). The history of the trait is irrelevant; only its current causal contribution matters.

  **2. The Engineered Enzyme (No Ancestors)**
  *   **Etiological:** This account struggles significantly. Strictly speaking, a one-off enzyme with no replication history has no selection history. While some etiological theorists extend the account to artifacts via "designer intent," a biological strictures reading suggests it has no proper function until it replicates and is selected.
  *   **Causal-Role:** This account handles the case effortlessly. The enzyme detoxifies the cell; therefore, detoxification is its function. Its origin story (engineering vs. evolution) is irrelevant to its functional ascription.

  **3. The Digital Subroutine (Evolved, Unintended)**
  *   **Etiological:** This account affirms the function. Even if human designers did not intend the subroutine, it exists because it contributed to replication in the digital environment and was "selected" by the algorithmic pressure. The history of selection validates the function.
  *   **Causal-Role:** This account also affirms the function, but for a different reason: the subroutine currently contributes to the capacity of replication. It does not need to reference the evolutionary history, only the current systemic contribution.

  #### The Problem of Malfunction

  This is the critical fault line for your article. The etiological account excels here because it provides a **normative standard** independent of current performance. A heart has the function of pumping blood because ancestors pumped blood and survived; therefore, a heart that fails to pump is *malfunctioning*—it is failing to do what it was selected to do. The function exists even when the trait is broken.

  The causal-role account faces a dilemma. If function is defined as "what the part actually does to contribute to the system," then a broken heart that does not pump is not performing its function. To speak of malfunction, the causal-role theorist must rely on counterfactuals (what it *would* do if working) or appeal to the design of similar systems, which weakens the account's claim to be purely about current causal contributions. For a story about "brokenness," the etiological account offers a more robust explanation of how a thing can be functionally defined yet currently useless.

  #### Recommendation

  For a piece centered on the literal meaning of function and the concept of malfunction, the **Etiological (Selected-Effects) Account** is the stronger default. It aligns better with the biological intuition that functions are tied to survival reasons ("why is this here?") and successfully explains normativity (how things can be broken). However, you must flag its weakness regarding novel traits and drift, where it risks being too exclusionary compared to the more flexible causal-role account.

