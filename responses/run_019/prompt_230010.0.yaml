answer: |-
  Dear colleague, I am writing to share a detailed plan for the two-hour seminar session you mentioned, designed to let your eighteen students collide with the two-envelope paradox through direct experience rather than exposition. The core idea is to structure the choices so that the expected value argument for switching emerges from their own justifications, creating a cognitive dissonance when they realize the symmetry of the situation implies they should switch indefinitely. To begin with the materials, you will need eighteen pairs of opaque envelopes, which you should prepare in advance by writing pairs of numbers on slips of paper where one number is exactly double the other, such as ten and twenty, twenty and forty, or forty and eighty, ensuring all numbers are even to avoid fractional confusion when halving. You should vary the magnitudes significantly across the pairs so that no student can easily infer the global distribution of values from their neighbors, and you must place one slip in each envelope of a pair and seal them, keeping the pairs distinct so you can track which envelope belongs to which pair for scoring purposes. For the payoff scheme, since you wish to avoid real money while maintaining consequentiality, I recommend telling the students that their final envelope value will be converted into lottery tickets for a draw at the end of the term, perhaps for a modest gift card or a small amount of course credit, which is usually sufficient to trigger decision-theoretic seriousness without requiring institutional approval for cash payments.

  The session should open with about ten minutes of instructions where you distribute one envelope to each student from the prepared pairs, instructing them not to open them yet, and explaining that their goal is to maximize the value in their possession. You should then move into the first phase, lasting about thirty minutes, by asking them to open their envelopes and observe the amount inside without showing anyone else. Once they have seen their number, ask them to write down on a card whether they choose to keep their current envelope or switch for the other one in their pair, and crucially, require them to write a one-sentence justification for this choice. This written justification is the engine of the activity, because you will collect these cards and project anonymized examples on the board that highlight the expected value reasoning, specifically looking for students who write that the other envelope is equally likely to be half or double their amount, yielding a positive expected gain from switching. You should facilitate a discussion where students who chose to switch explain their reasoning to those who kept, gently prompting the switchers to articulate the calculation that half the time they lose half the amount and half the time they gain double the amount, which mathematically averages to a gain. If the reasoning does not emerge spontaneously, you can ask a leading question such as whether anyone considered what the other envelope might contain relative to the number they are holding, which usually triggers the conditional probability intuition that drives the paradox.

  Following this initial choice, you should allow the switches to occur physically so that students experience the outcome, but do not yet reveal the correct answers or the pairings, and instead transition into the second phase which focuses on the symmetry of the unopened case. Spend the next thirty minutes asking the students to imagine a scenario where they are handed two sealed envelopes and asked to choose one, and then before opening either, they are offered the chance to switch to the other one. Ask them to raise their hands if they would switch before opening, and then ask if they would switch back if offered the chance again, creating a live demonstration of the infinite switching loop. You should press them on whether their decision changes based on the fact that they have not seen the number, contrasting this with the first phase where seeing the number felt like it provided information. This is the moment where the conflict should become palpable, as the students who argued for switching based on the observed amount in phase one must now confront whether that logic applies even when the amount is unknown, and you should encourage the students who already know the paradox to hold their fire on the solution during this period so that the naive students can fully inhabit the confusion.

  Regarding the students who have already heard of the paradox, since you mentioned about half the room may be familiar with it, you should handle this by explicitly acknowledging their prior knowledge at the very start and recruiting them as collaborators rather than spoilers. Ask them to refrain from revealing the resolution during the activity phases but encourage them to participate honestly in the decision-making and to help articulate the intuitive argument for switching if the naive students are struggling to find the words, effectively using them to ensure the paradox is robustly generated rather than solved prematurely. You can seat them interspersed with the naive students so that the discussion flows naturally, but instruct them that their role for the first hour is to act as advocates for the intuitive reasoning, even if they know it is flawed, which helps maintain the integrity of the discovery process for everyone while preventing the familiar students from feeling bored or disconnected.

  As you move into the final forty minutes for the debrief, you need to map the specific moments of the activity onto the structural elements of the paradox to ensure the theoretical lessons land correctly. You should start by drawing the decision tree on the board and pointing out where the students treated the observed amount as a fixed variable across the two possible comparisons, which is the central mathematical error where they assume the probability of the other envelope being higher or lower is independent of the value observed. Explain that by treating the observed amount as fixed, they implicitly assumed a uniform prior distribution over all possible money values, which is impossible over an infinite range, and use the activity numbers to show that if someone held the maximum possible value in your set, they would know they cannot double it, proving that the probability depends on the amount. You should then connect the symmetry phase to the problem of unconditional switching, showing that if switching is always beneficial regardless of the amount, one should switch before opening, which contradicts the symmetry of the two identical envelopes. This is where you must supply the resolution that the activity cannot make vivid on its own, specifically the concept of an improper prior and the fact that the expected value calculation diverges or relies on an impossible probability distribution, which is abstract and requires formal explanation beyond the empirical choices they made.

  There are several things that will predictably go wrong the first time you run this, and you should be prepared to adapt in the moment. Students may be skeptical of the payoff scheme and treat the choices as random guesses, so you must reinforce the value of the lottery tickets or points repeatedly to ensure engagement. Another common failure point is that students might suspect a trick in the envelope preparation, such as believing all envelopes contain the same amount or that the numbers are not actually doubled, so you should offer to reveal a few pairs at the end to prove the integrity of the setup. You may also find that the discussion stalls if no one naturally articulates the expected value argument, in which case you should be ready to introduce it yourself as a hypothetical argument used by a fictional student and ask the class to critique it, which often unlocks the debate without giving away the solution. Furthermore, the presence of students who know the paradox may lead to premature closure if they slip up, so you should be ready to pivot by asking them to explain why the intuitive argument is compelling even if it is wrong, keeping the focus on the psychological and decision-theoretic tension rather than just the mathematical resolution.

  Finally, you must recognize the limitations of what this activity can achieve on its own, as it is designed to generate the paradox rather than resolve it. The activity makes the conflict between intuition and symmetry vivid, but it cannot demonstrate the probability theory error regarding the prior distribution without your explicit lecture, because the finite set of envelopes you use in class actually does have a bounded distribution that the students cannot see. You will need to explain in the debrief that while their specific classroom experience involved a finite range where the paradox technically dissolves at the boundaries, the theoretical paradox assumes an unbounded range where the uniform prior is impossible, and this distinction must be supplied by you because the physical props cannot represent infinity. The activity also cannot fully capture the nuance of conditional expectation versus unconditional expectation without your guidance, so you should plan to spend the last ten minutes strictly on the formal modeling of the problem to ensure they leave with the correct technical understanding alongside the intuitive confusion you successfully cultivated. I hope this structure helps you run a lively and productive session, and I would love to hear how the students respond to the switching dilemma once they have lived through it themselves.
