      *(Refining the Instinct Response)*: The user suspects Circumstantial is only easiest to dramatise. I should argue it's actually the most *philosophically fertile* for fiction because it preserves agency while compromising it. It's not just ease; it's the perfect tension point.

      *(Refining the Comedy Response)*: In comedy, Resultant luck is king. The absurdity of outcomes drives farce and satire. The injustice of blaming someone for a bad outcome when intentions were good is classic comedy (e.g., Keaton). So Resultant moves to #1.

