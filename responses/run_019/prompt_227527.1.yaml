      *   **Topic:** Moral luck (Nagel's taxonomy: resultant, circumstantial, constitutive, causal).
      *   **Core Question:** How much of what we blame people for turns on factors beyond their control.
      *   **Task:** Rank the four categories from most to least promising as the *load-bearing structure* of a serious novel.
      *   **Criteria for 'Promising':**
          1.  Capacity to sustain narrative tension without contrivance.
          2.  Tendency to resist tidy moral resolution.
          3.  Likelihood of surviving scrutiny of a philosophically literate reader (avoiding melodrama/incoherence).
      *   **Output per Category:** Placement, justification, natural plot type, characteristic failure mode.
      *   **Additional Request 1:** Evaluate the user's instinct that *circumstantial luck* is the richest vein (is it just easiest to dramatise?).
      *   **Additional Request 2:** Would the ranking change for a *comic* novel? How and why?
      *   **Constraints:** No reading lists/references/citations. British English. Judgement-based.

  2.  **Deconstruct the Four Types of Moral Luck:**
      *   *Resultant Luck:* Luck in how things turn out (e.g., two drunk drivers, one hits a pedestrian, one doesn't).
      *   *Circumstantial Luck:* Luck in the circumstances one faces (e.g., living in Nazi Germany vs. neutral Switzerland).
      *   *Constitutive Luck:* Luck in who you are (temperament, genetics, innate tendencies).
      *   *Causal Luck:* Luck in the antecedent causes (determinism, upbringing, chain of events leading to the will).

  3.  **Evaluate for Fiction (Literary/Tragic Context):**
      *   *Resultant:* Very dramatic (life/death outcomes), but risks feeling contrived ("rigging the dice"). Hard to keep morally ambiguous if the outcome is stark (dead body vs. no dead body).
      *   *Circumstantial:* High dramatic potential (war, crisis), tests character. Risks becoming historical determinism or "wrong place at wrong time" melodrama.
      *   *Constitutive:* Deeply psychological. Harder to plot externally. Risks becoming a medical case study or essentialist determinism ("he was born bad").
      *   *Causal:* Very abstract. Hard to dramatize without flashbacks or exposition. Risks becoming a sociological treatise rather than a story.

  4.  **Drafting the Ranking (Tragic/Serious Novel):**
      *   *1st: Circumstantial.* Why? It places character against context. It allows for agency *within* constraint. It creates immediate tension (what will they do *now*?). It resists resolution because we never know what we would have done in their shoes.
      *   *2nd: Resultant.* Why? It's the engine of tragedy (Oedipus, etc.). High tension. But risks contrivance. Needs careful handling to avoid "accident plots."
      *   *3rd: Constitutive.* Why? It's internal. Good for character studies. But hard to make plot-driven. Risks excusing behavior too easily ("couldn't help being born this way").
      *   *4th: Causal.* Why? Too metaphysical/sociological. Hard to embody in scene. Risks determinism that kills narrative tension (if everything is caused, why watch?).

      *Refining the Ranking:*
      Actually, *Resultant* is often the most immediate hook, but *Circumstantial* allows for deeper exploration of the *question* of blame over time. Resultant luck often resolves too quickly (the crash happens). Circumstantial luck sustains tension (living under the regime).
      Let's look at the criteria: "sustain narrative tension," "resist tidy moral resolution," "survive scrutiny."
      *Circumstantial* wins on tension and ambiguity.
      *Resultant* is strong on tension but weak on ambiguity (outcome often dictates blame legally/socially).
      *Constitutive* is strong on ambiguity but weak on tension (internal struggle).
      *Causal* is weak on all three for fiction.

      *Revised Ranking:*
      1. Circumstantial
      2. Resultant
      3. Constitutive
      4. Causal

      *Wait, let's reconsider Constitutive vs Resultant.*
      Resultant luck is the classic tragic structure. But the prompt asks about *blame*. Resultant luck often leads to legal blame regardless of intent. It's very visible.
      Constitutive luck is harder to see.
      For a *literary* novel exploring the *philosophy*, Circumstantial is indeed the sweet spot (Graham Greene territory).
      Resultant is second because it's the most visceral, though prone to contrivance.
      Constitutive is third because it risks essentialism.
      Causal is fourth because it's too abstract.

  5.  **Addressing User's Instinct (Circumstantial):**
      *   User thinks it's the richest vein.
      *   My ranking puts it first.
      *   Is it just because it's easiest to dramatise?
      *   Argument: It's not *just* ease. It's the intersection of agency and context. It allows the reader to ask "What would I have done?" which is the core of moral luck. It avoids the biological determinism of constitutive and the arbitrariness of resultant. So, the instinct is correct, but the reason is depth, not just ease.

  6.  **Addressing the Comic Novel Ranking:**
      *   Comedy often relies on incongruity and misunderstanding.
      *   *Resultant* luck is huge in comedy (farce, mistaken identity, near misses).
      *   *Circumstantial* is also good (fish out of water).
      *   *Constitutive* (character flaws) is the basis of comedic character (the miser, the braggart).
      *   *Causal* remains low.
      *   In comedy, *Resultant* might rise to #1 because the absurdity of outcomes drives the humor (the banana peel). The inequity of blame for outcomes is a rich satirical vein.
      *   *Constitutive* might rise too (comedies of temperament).
      *   Let's say *Resultant* jumps to #1 for comedy. *Circumstantial* stays high. *Constitutive* rises. *Causal* stays low.

  7.  **Drafting the Content (British English, Tone):**
      *   Tone: Counselly, authoritative but collaborative, philosophical but practical.
      *   Language: British spelling (organised, dramatise, colour, etc.).
      *   Structure: Follow the prompt's requirements exactly.

  8.  **Refining the Justifications & Failure Modes:**
      *   *Circumstantial:* Plot = Moral test in crisis. Failure = Historical determinism/Melodrama ("victim of history").
      *   *Resultant:* Plot = The accident/consequence. Failure = Contrivance ("rigging the dice").
      *   *Constitutive:* Plot = Character study/psychological decline. Failure = Biological essentialism ("born bad").
      *   *Causal:* Plot = Genealogy/Sociological sweep. Failure = Deterministic nihilism (no agency = no story).

  9.  **Review against Constraints:**
