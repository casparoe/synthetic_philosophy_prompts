          *   Estimate: 0.85.
          *   Justification: Financial penalties for schools and personal bonuses for teachers create aligned pressure across the hierarchy to maximize the metric.
          *   Bearing: Strong incentives transform the *ability* to game into the *motivation* to game.

      *   *Component 3: Oversight Failure.*
          *   Scenario: District oversight/audit/professional norms.
          *   Analysis: Schools are often resource-constrained. Auditing self-reported logs is labor-intensive. Professional norms might discourage "cheating," but the pressure from above often overrides this. Two years is a long time for norms to erode.
