          *   *Violation of Continuity:* Bounded utility often requires rejecting the VNM continuity axiom. This opens the door to preference reversals.

      *   **3. Decision-Theoretic Exploitation (Money Pumps):**
          *   *Dutch Books:* If you reject continuity (which boundedness often implies), you can be money-pumped.
          *   *Dynamic Inconsistency:* If my bound is fixed, but my current utility changes, how do I update?
          *   *Comparison:* Unbounded agents get mugged; bounded agents get pumped. It's a "pick your poison" scenario.

