answer: |-
  That asymmetry exists because we credit them for transcending their time, not for fitting into it. Jefferson gets praise for the Declaration because arguing against monarchy was radical then, even if owning slaves was normal. The metric isn't "today vs. yesterday," it's whether they championed universal values available to them while failing to apply them consistently. If we judge them solely by today's standards, we ignore the specific moral battles they actually fought and reduce history to a checklist of modern virtues they couldn't possibly have completed. We can acknowledge the harm without pretending they had the same moral map we do.
