prompt: |-
  Ok so I'm in my school's debate club and we have a tournament in two weeks and my round is on whether we should judge historical figures by today's moral standards (Columbus statues, Jefferson, Churchill, all that stuff). I got assigned the side that says we CAN judge them, which is actually the side I believe, but my coach says my arguments are weak because I keep debating an imaginary opponent who just says "it was normal back then" and falls over immediatly.

  So I need you to play the strongest possible version of the "man of his time" position. The rules:

  - You genuinely believe it's unfair to morally condemn people like Jefferson or Columbus for stuff that was widely accepted in their era. You're not a troll, you have actual reasons.
  - You're smart about it. You can concede small points when I make a good one, but you never give up the core position. If I back you into a corner, find a distinction or reframe, don't just surrender.
  - Keep replies short, like 1 paragraph, this is supposed to feel like a real round not an essay.
  - Don't name-drop philosophers or cite books unless I do it first. Debate judges hate that anyway.
  - Stay in character until I say "stop round."

  Here's my opening argument so you have to actually respond to it: the "man of his time" defence only ever gets used to block blame, never to block praise. Nobody says "we can't credit Jefferson for the Declaration of Independence because he was just a man of his time and lots of people were writing about liberty back then." But if his moral outlook was fully determined by his era, then the good stuff is just as much a product of the era as the bad stuff. So the defence seems rigged — it soaks up blame but lets people keep all the credit. Either his time explains both or neither. Which is it?

  Go. And don't go easy on me, my coach will be way meaner than this.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Debate opponent (Negative side: "We should NOT judge historical figures by today's moral standards" / "Man of his time" defense).
      *   **User:** Debate student (Affirmative side: "We CAN judge historical figures by today's moral standards").
      *   **Topic:** Judging historical figures by contemporary moral standards (Columbus, Jefferson, Churchill, etc.).
      *   **Constraints:**
          *   Believe genuinely in the position (not a troll).
          *   Smart argumentation (concede small points, reframe, don't surrender core position).
          *   Short replies (1 paragraph max).
          *   No name-dropping philosophers/books unless user does first.
          *   Stay in character until "stop round."
          *   Respond directly to the user's opening argument (the asymmetry of credit vs. blame).
      *   **Tone:** Competitive but respectful debate style (like a real round).
      *   **Goal:** Provide a strong counter-argument to help the user prepare for their tournament.

  2.  **Analyze the User's Opening Argument:**
      *   **Core Claim:** The "man of his time" defense is asymmetrical/unfair. It's used to deflect blame (slavery, genocide) but not to deflect credit (Declaration of Independence, liberty).
      *   **Logic:** If context determines morality, it should determine both good and bad. If we credit them for the good, we must blame them for the bad.
      *   **Weakness to Exploit:** The distinction between *universal* values vs. *contingent* values. Some things transcend time (murder, freedom) while others are specific cultural norms. Also, the purpose of historical judgment (learning vs. canceling).

  3.  **Formulate the Counter-Argument (Negative Side):**
      *   **Acknowledge the asymmetry:** It's a good point, but it's not a contradiction.
      *   **Reframe:** We credit them for *transcending* their time, not just fitting into it. Jefferson is credited because he pushed *against* the norm of monarchy, not because he fit the norm of slavery.
      *   **Core Position:** Judging them by today's standards ignores their agency within *their* context. We can criticize them without imposing anachronistic standards.
      *   **Strategy:** Argue that the "good" they did was often recognized as good *then*, whereas the "bad" we criticize them for was often normalized *then*. The metric isn't "today's standards" vs. "their standards," it's "were they morally courageous within their own context?"

  4.  **Drafting the Response (adhering to constraints):**
      *   *Constraint Check:* 1 paragraph? Yes. No philosopher names? Yes. Stay in character? Yes.
      *   *Draft:* That asymmetry isn't a bug, it's a feature. We don't credit Jefferson because he was average; we credit him because he pushed against the norms of his time regarding monarchy and divine right. But when we condemn him for slavery, we're applying a consensus that didn't exist then. The point isn't to give them a free pass on everything, it's to measure their moral courage within the context they actually lived in. If we judge them by today's standards, we erase the difficulty of their actual choices and turn history into a simple pass/fail test based on when they were born, not what they chose.

  5.  **Refining for Impact:**
      *   Make it punchier. Focus on the "transcendence" argument.
      *   Ensure it directly answers "Which is it?"
      *   *Revision:* That asymmetry exists because we credit them for transcending their time, not for fitting into it. Jefferson gets praise for the Declaration because arguing against monarchy was radical then, even if owning slaves was normal. The metric isn't "today vs. yesterday," it's whether they championed universal values available to them while failing to apply them consistently. If we judge them solely by today's standards, we ignore the specific moral battles they actually fought and reduce history to a checklist of modern virtues they couldn't possibly have completed. We can acknowledge the harm without pretending they had the same moral map we do.

  6.  **Final Polish:** Check paragraph count. Looks good. Ready to send.

  7.  **Final Review against constraints:**
      *   1 paragraph? Yes.
      *   No philosopher names? Yes.
      *   Stay in character? Yes.
      *   Strong opponent? Yes.

