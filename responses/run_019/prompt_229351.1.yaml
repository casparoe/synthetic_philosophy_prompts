answer: |-
  **Examination Question**

  Langdon Winner argues artifacts have politics via two routes: design settling affairs or inherent requirements. The canonical example for the first route, Robert Moses's low bridges, has been historically debunked by scholars like Joerges. Does this empirical failure collapse Winner's thesis, or does the thesis survive independent of the example? Take a stand on this relationship between evidence and theory. Then, apply your repaired version of Winner's claim to the following case: A university housing office adopts an algorithm that assigns first-year students to dormitories by clustering questionnaire responses about tastes and habits, in the stated service of building community; because tastes and habits track family income, the algorithm reliably sorts students by class, although no one intended this and the office is dismayed by the outcome. Does this artifact have politics on your reading, and does the absence of intention matter?

  ***

  **Model Answer**

  The historical scrutiny of Robert Moses's parkway bridges reveals that Winner's canonical example fails as empirical evidence, but this does not collapse his thesis because the story functioned primarily as a philosophical illustration rather than a statistical proof. Winner's goal was not to provide a forensic history of Long Island infrastructure but to categorize a type of power that operates through materiality. Joerges's critique correctly identifies historical inaccuracies—the clearances were standard, Moses's agency limited—but mistakenly assumes these facts invalidate the structural insight. The bridge story was a heuristic device designed to disrupt the assumption that politics occurs only in legislatures. Therefore, the thesis survives if we treat the bridges as a paradigm case of a possible relationship between technology and power, rather than a necessary condition for all technological politics. The failure of the example demands a shift from historical specificity to structural analysis, preserving the theoretical framework while discarding the flawed anecdote.

  To remain defensible, Winner's claim must be repaired by decoupling politics from specific human intention. The original essay ambiguously blends the idea that artifacts settle affairs with the idea that they require specific social orders. The debunking of the Moses story exposes the weakness of relying on intentional exclusion. A robust version of the thesis argues that artifacts have politics when their operation authoritatively allocates benefits and burdens, regardless of the designer's consciousness. This aligns more closely with Winner's second route regarding inherent requirements—such as nuclear power demanding hierarchy—but applies it to the first route's focus on design arrangements. Politics is located in the consequences of the system's logic, not merely in the smoke-filled rooms where decisions are made. If a design reproduces hierarchy, it is political, even if the hierarchy was an unforeseen byproduct of efficiency metrics. This saves the thesis from collapsing when specific intentions cannot be proven.

  Applied to the university housing algorithm, this repaired thesis confirms the artifact has politics. The algorithm assigns dormitories by clustering questionnaire responses about tastes and habits. Because these cultural markers track family income, the system reliably sorts students by class, creating economically homogenous living units. Although the housing office intended only to foster community and is dismayed by the segregation, the technical arrangement settles a community affair: it dictates social proximity and reinforces class boundaries. This is politics by accommodation. The algorithm acts as a silent legislator, encoding existing social inequalities into the spatial organization of the campus. The outcome is a specific political order—stratification—achieved through technical means, mirroring the exclusionary function of the bridges without the exclusionary intent.

  On the question of intention, the absence of malice is irrelevant to the presence of politics. If Winner's thesis depended on Moses-like intent, the algorithm would be neutral. However, a sophisticated reading recognizes that technical systems often amplify social biases without explicit direction. The algorithm's politics emerge from the correlation between data proxies and social reality, not from a directive to segregate. The operators' dismay highlights the autonomy of the technical system; the politics resides in the code's operation, not the operators' minds. Thus, Winner's thesis survives the debunking of the bridge story by evolving from a claim about intentional design to a claim about structural consequence. The bridge story was merely the opening gambit; the enduring theory is that artifacts legislate social order, whether their architects intend it or not. The theory survives not as a history of villains, but as a sociology of effects.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Diagnosis of the Bridge Story (4 marks):** Identifies the story as illustration/heuristic rather than sole empirical evidence.
      *   *Weaker answer:* Treats the debunking as fatal to the theory or ignores the evidence/illustration distinction.
  2.  **Verdict on Theory Survival (4 marks):** Clearly states the thesis survives but requires refinement (decoupling from specific history).
      *   *Weaker answer:* Hedges indefinitely or claims the theory is completely untouched by the debunking.
  3.  **Articulation of Repaired Thesis (4 marks):** Defines politics via consequences/outcomes rather than designer intention.
      *   *Weaker answer:* Retains intention as a necessary condition for politics.
  4.  **Application to Algorithm (4 marks):** Correctly identifies the algorithm as political due to class sorting effects.
      *   *Weaker answer:* Claims the algorithm is neutral because the office was dismayed.
  5.  **Treatment of Intention (4 marks):** Explicitly argues absence of intention does not negate politics in the algorithm case.
      *   *Weaker answer:* Suggests the lack of intent makes the politics less real or accidental.

  **A vs. B Distinction:** An **A** answer integrates the epistemological status of the bridge story with the normative definition of politics to create a coherent, repaired theoretical framework applied seamlessly to the algorithm. A **B** answer treats the five moves as separate checklist items, correctly answering each but failing to show how the repair of the theory necessitates the specific judgment on the algorithm.

  Verdict: Winner's thesis survives the debunking of the bridge story if reformulated as a claim about the political consequences of technical arrangements rather than the intentional designs of specific actors.
