      *   **The Strong Thesis:** "There is no rational core to induction... track record of any method is a parochial fact about the kind of world we inhabit rather than evidence that the method is any good."
      *   **The Goal:** Pressure-test this strong thesis. What would have to be true for it to be *false*?
      *   **Specific Requirements:**
