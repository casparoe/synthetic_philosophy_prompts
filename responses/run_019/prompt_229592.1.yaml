  A pop-econ book I picked up explains revealed preference like this: "Economists used to think utility meant pleasure or satisfaction, but that was unscientific since you can't measure feelings. Paul Samuelson fixed this in the 1930s by proposing we infer utility purely from choices: whatever you pick must be what maximizes your utility, by definition. So utility just means 'whatever your choices are aimed at.' This proves that people are basically rational and that whatever someone chooses is what's best for them -- critics who point to framing effects or impulsive choices don't realize these just reveal different, equally real preferences." My friend who's into econ said the first half is roughly right but the whole thing smells off, and I cant tell where the sleight of hand is. Is this a fair summary? Give me your answer as exactly five numbered items, one or two sentences each, separating what the book gets right, where it overreaches, and whether the "critics don't get it" move works -- no intro or conclusion.
