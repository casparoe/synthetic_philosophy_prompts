  3.  **Evaluate Claims against Economic Theory:**
      *   *Claim 1 & 2 (History/Samuelson):* Roughly accurate. Neoclassical economics moved away from cardinal utility (measurable pleasure) to ordinal utility, and Samuelson formalized revealed preference theory to avoid psychological assumptions.
      *   *Claim 3 & 4 (Definition):* Accurate within the strict model. Revealed preference defines utility based on observed choices.
