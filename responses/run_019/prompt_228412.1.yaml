      *   *Sleep/Anaesthetic:* This is the "Interruption Problem." The fix is "dispositional continuity." The brain structure retains the *capacity* to resume the narrative. A saved disk lacks the *active* capacity unless loaded into a processor. The distinction is potentiality vs. stored data.
