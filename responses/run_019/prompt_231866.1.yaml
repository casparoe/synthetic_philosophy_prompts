      *   **Core Argument:** Based on W. E. B. Du Bois's *Criteria of Negro Art* (1926), specifically the idea that *all* art is propaganda.
      *   **Constraint:** Do *not* quote Du Bois verbatim. Use plain, nonacademic language.
      *   **Goal:** Dissolve the propaganda vs. art dilemma. Replace it with "honest advocacy" vs. "concealed advocacy (pose of neutrality)."
      *   **Length:** About 7 minutes when read aloud (approx. 900-1000 words at a moderate pace).
      *   **Tone:** Philosophical but accessible, engaging, respectful of the art, challenging but not alienating.

  2.  **Deconstruct the Core Argument (Du Bois's Insight):**
      *   *Common View:* Art = Beauty/Truth (Pure); Propaganda = Manipulation/Politics (Impure).
      *   *Du Bois's View:* All art persuades. All art tells a story about how the world is or should be. Even "neutral" art supports the status quo.
      *   *The Shift:* Stop asking "Is this propaganda?" Start asking "What is this propaganda *for*?" and "Is it honest about it?"
      *   *Application to Exhibition:* These Black artists (1920s-60s) weren't hiding their perspective. They were asserting humanity in a world that denied it.

  3.  **Drafting - Section by Section:**

      *   **Introduction (1 minute):** Welcome the audience. Acknowledge the tension in the room. Introduce the exhibition's scope (1920s-60s, Black American artists). Set the stage for the "P-word" (propaganda).
      *   **The Problem (1.5 minutes):** Address the elephant in the room. Some think politics ruins art. Some think art *must* be political. Explain why this binary is a trap.
      *   **Du Bois's Insight (2 minutes):** Introduce the philosophical pivot (without naming Du Bois excessively or quoting). Explain the concept: Art is never a mirror; it's a hammer or a window with a view. Even "neutral" art takes a side (the side of silence).
      *   **The New Distinction (2 minutes):** Propose the real metric: Honesty vs. Concealment. Discuss how the artists in this room operate. They aren't hiding their intent. They are demanding recognition.
      *   **Conclusion (1.5 minutes):** Bring it back to the viewer. How should they look at the work? Not just "is it pretty?" but "what is it asking of me?" Final welcoming thought.

  4.  **Drafting - Tone and Language Check:**
      *   *Constraint Check:* No verbatim quotes from *Criteria of Negro Art*. (e.g., avoid "All Art is propaganda and ever must be").
      *   *Language:* Plain English. Avoid jargon like "hegemony," "dialectic," "aesthetic autonomy." Use metaphors (mirrors, windows, silence).
      *   *Timing:* Need to monitor word count. 130-140 words per minute is average speaking pace. 7 minutes = ~950 words.

  5.  **Drafting - Iteration 1 (Mental Outline & Key Phrases):**
      *   Welcome everyone.
