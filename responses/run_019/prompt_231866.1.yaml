      *   *The Philosophical Turn:* But consider this. When we say art should be neutral, what do we mean? Usually, we mean it shouldn't challenge the way things are.
      *   *Du Bois's Idea:* A philosopher from the 1920s argued that every piece of art tells you how to see the world. A painting of a bowl of fruit says "beauty is in stillness." A portrait says "this person matters."
      *   *The Specific Context:* For Black artists in this era, saying "I matter" was a radical act. To paint a Black face with dignity was to argue against a world that said otherwise.
      *   *The Shift:* So the choice isn't Art vs. Propaganda. It's Honest Art vs. Dishonest Art.
