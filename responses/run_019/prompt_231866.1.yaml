answer: |-
  Good evening. Welcome to the museum, and thank you for being here to open this exhibition with us.

  We are gathered to look at work created by Black American artists between the 1920s and the 1960s. These decades span the Harlem Renaissance, the Great Depression, the Second World War, and the Civil Rights Movement. It was a period of immense turbulence, and the art produced during this time did not sit on the sidelines. It was present. It was vocal. It was engaged.

  I know that for some of you, those words might trigger a specific anxiety. When we say art is "engaged" or "political," a certain tension enters the room. On one side, there are those who worry that if art serves a cause, it ceases to be art and becomes a poster. They fear the word "propaganda." They believe that for art to be truly beautiful, it must be pure, standing above the fray of social arguments.

  On the other side, there are those who insist that art *must* take a stand, that to remain neutral in times of injustice is a moral failure. They embrace the political label, sometimes at the expense of the aesthetic one.

  As a philosopher, I am invited here to suggest that this debate—the fight between "Art" and "Propaganda"—is actually a distraction. It is a false choice. And I would like to propose a different way of seeing what is hanging on these walls.

  There is a line of thought, articulated powerfully by the scholar and activist W. E. B. Du Bois nearly a century ago, which suggests that we need to stop pretending that any art is truly neutral. Du Bois argued that all art, without exception, influences how we see the world. Every painting, every sculpture, every song makes a claim about what is valuable, what is true, and who matters.

  Consider a landscape painting from the same era that shows a peaceful countryside with no people in it. It might feel apolitical. It might feel like just "nature." But in the context of American history, a landscape that erases the people who worked the land, or the people who were displaced from it, is making a political statement. It is arguing that the land exists without history. It is advocating for a kind of silence.

  So, the question is not whether art is propaganda. The question is: what is it advocating for, and is it honest about it?

  This is the distinction I want to leave you with tonight. The real divide is not between political art and neutral art. The real divide is between work that is honest about its intentions and work that conceals its advocacy inside a pose of neutrality.

  Most of the art we consider "classic" or "timeless" in Western museums advocates for the status quo. It tells us that the world as it is, is natural and inevitable. It rarely announces this agenda. It pretends to just be "beauty." But for Black artists in the twentieth century, the status quo was a world that denied their humanity. To paint a Black subject with dignity, with complexity, with interior life, was to argue against the prevailing reality.

  If they had tried to make "neutral" art, they would have been complicit in their own erasure. Instead, the artists in this gallery chose honesty. They did not hide the fact that they were trying to change how the viewer saw them. They understood that beauty itself could be a form of argument.

  This does not mean we should reduce these paintings to slogans. That would be an insult to the artists. Look closely at the brushwork. Look at the use of color, the composition, the texture. The political power of this work is not just in the subject matter; it is in the craft. The care taken to render a face, the deliberation in a stroke of blue, the balance of light and shadow—this is where the humanity lives.

  The art is not political *despite* being beautiful. It is political *because* it insists on a beauty that the world refused to acknowledge.

  When you walk through the galleries in a few moments, I invite you to drop the worry that the art might be "too political." Instead, ask yourself a sharper question. Do not ask, "Is this art or is this propaganda?" Ask, "What is this work trying to do to me?"

  Is it trying to comfort you? Is it trying to disturb you? Is it asking you to witness something you would rather ignore? And crucially, is it honest about that request?

  Some art wants to be a mirror, reflecting the world back to us as if nothing needs to change. The work in this exhibition refuses to be that kind of mirror. It acts more like a window that has been thrown open, letting in air that is fresh but perhaps a bit cold. It demands that you acknowledge the person on the other side of the glass.

  Du Bois suggested that the duty of the artist is not to escape the world, but to tell the truth about it. That truth-telling is the highest form of advocacy. It requires skill, it requires vision, and it requires courage.

  The artists represented here possessed all three. They did not hide behind the claim that their work was "just art." They knew that in a society divided by race and power, to create is to take a side. They chose the side of truth. They chose the side of their own people. And in doing so, they created work that endures.

  So, as you move into the gallery, I hope you feel free to be moved. Do not feel you must protect the art from politics, or protect yourself from the art. Let the work do what it was made to do. Let it argue. Let it persuade. Let it reveal what a neutral gaze would have missed.

  Thank you for listening, and please, enjoy the exhibition.
