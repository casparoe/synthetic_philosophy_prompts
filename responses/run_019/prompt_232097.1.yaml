  **INSTITUTE FOR MORAL OPTIMIZATION**
  **Application for Certification of Moral Sainthood (Form 88-B)**
  **Confidential**

  **PREAMBLE**
  Certification as a Moral Saint requires demonstration that the applicant's life is organized exclusively around the maximization of moral value. The Institute does not recognize "personal fulfillment," "aesthetic appreciation," or "private happiness" as valid categories of justification. All capacities, resources, and attachments must be subordinate to the impartial Moral Good. Incomplete justifications will result in immediate disqualification.

  **SECTION I: BIOGRAPHICAL DATA**
  **Name:** _________________________________________________
  **Current Occupation:** ____________________________________
  **Percentage of Income Donated to Effective Altruism Causes:** ______%
  **Remaining Disposable Income Justification:** _________________

  **SECTION II: INVENTORY OF PARTICULARISTIC ATTACHMENTS**
  List all friends, family members, and romantic partners with whom you maintain regular contact. For each entry, provide a written justification for why this specific relationship produces greater moral utility than impersonal charitable engagement.

  *   **Name/Relation:** _______________________________________
      **Justification:** (e.g., "Maintaining this friendship prevents psychological collapse, allowing 4 additional hours of weekly volunteer labor.")
      __________________________________________________________________________
      __________________________________________________________________________

  *   **Name/Relation:** _______________________________________
      **Justification:** (Note: Appeals to "love" or "loyalty" without utilitarian calculus are insufficient.)
      __________________________________________________________________________
      __________________________________________________________________________

  **SECTION III: QUARTERLY NON-MORAL ACTIVITY LOG**
  Record all hours spent in the previous quarter on activities lacking direct moral output. This includes, but is not limited to: reading fiction, listening to music, humor, sports, idleness, and culinary experimentation.

  *   **Activity:** ____________________________________________
      **Hours Spent:** _______
      **Moral Opportunity Cost:** (Calculate hours lost × potential wage × donation rate)
      __________________________________________________________________________

  *   **Activity:** ____________________________________________
      **Hours Spent:** _______
      **Explanation of Necessity:** (Why was this leisure required rather than mere rest?)
      __________________________________________________________________________

  **SECTION IV: REALLOCATION PLAN**
  Certification requires the elimination of non-essential interests. Detail your plan to reallocate time, money, and attention currently spent on art, humor, and particularistic love toward impartial moral ends.

  *   **Current Hobby to Be Abandoned:** ________________________
      **Projected Moral Gain:** _________________________________

  *   **Plan for Managing Spontaneous Impulses:**
      If you experience an urge to act kindly toward a specific individual rather than the general populace, describe the procedure you will use to verify this aligns with impartial duty rather than personal preference.
      __________________________________________________________________________
      __________________________________________________________________________

  **SECTION V: CHARACTER REFERENCES**
  Provide three contacts capable of verifying your moral seriousness. They must confirm that you do not derive excessive joy from non-moral activities and that your virtuous actions are performed from duty rather than convenient inclination.

  *   **Reference Name:** _____________________________________
      **Relationship:** _________________________________________
      **Confirmation:** (Please check one)
      [ ] Applicant acts morally despite finding it burdensome.
      [ ] Applicant acts morally because they enjoy it. (If checked, explain why this does not constitute moral luck.)
      __________________________________________________________________________

  **SECTION VI: WAIVER OF PERSONAL IDENTITY**
  By signing below, I acknowledge that certification may require the atrophy of wit, taste, and individual personality traits that do not serve the Moral Good. I accept that a life optimized for morality may be indistinguishable from a life optimized for labor.

  **Applicant Signature:** ____________________________________
  **Date:** __________________

  ***

  **Author's Note**
  I am highly confident this parody tracks the structure of Susan Wolf's "Moral Saints" argument, specifically her worry that maximizing moral virtue crowds out non-moral virtues and makes a person dull or monstrous. The single point I am least sure of is whether the form adequately distinguishes between the Utilitarian saint (maximizing good outcomes) and the Kantian saint (acting from duty), as Wolf critiques both but for slightly different reasons; the form leans Utilitarian in its auditing but Kantian in its suspicion of enjoyment.
