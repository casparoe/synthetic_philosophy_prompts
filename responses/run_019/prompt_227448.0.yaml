answer: |-
  ### Exam Question: The Naive Embedded Bayes (75 Minutes)

  **Prompt:**
  During office hours, a student proposes the following solution to the embedded agency problem: 

  > "An embedded agent is just a Bayesian agent whose hypothesis space includes worlds containing itself. Give it a Solomonoff-style prior over such computable worlds and let it maximize expected utility. Done."

  Write a critical essay evaluating this proposal. Do not simply list the four subproblems of embedded agency (logical uncertainty, naturalized induction, etc.). Instead, trace the specific mechanical failures of this architecture. Your answer must address:

  1.  **The Self-Model:** Why including "worlds containing itself" in the hypothesis space doesn't solve the problem of the agent being smaller than the environment.
  2.  **Logical Uncertainty:** Why standard expected utility maximization is ill-defined when the agent lacks logical facts at decision time.
  3.  **Spurious Proofs:** Explain the specific failure mode in a 5-and-10 scenario where the agent uses proof search. (Be precise about *which* action the agent takes and *why* the proof system allows it).
  4.  **Tiling:** How the above failures prevent the agent from constructing a trustworthy successor agent.

  Conclude by explaining why tweaking the prior (e.g., making it bounded) does not resolve the core logical issues.

  ***

  ### Model Answer (Approx. 600 Words)

  The proposal fails because it attempts to solve a structural problem with a statistical patch. While a Solomonoff prior over self-containing worlds addresses *empirical* uncertainty about the environment, it leaves the *logical* and *structural* constraints of embeddedness untouched.

  First, the **self-model problem** is not merely about hypothesis space size; it is about recursion. If the agent is part of the world it is modeling, it must simulate itself to simulate the world. Since the agent cannot contain a perfect model of itself (due to finite size), it cannot accurately predict the consequences of its actions by simulation. A Bayesian prior assumes the agent can evaluate the likelihood of observations given actions. But if the "action" involves the agent's own reasoning process, and the agent cannot fully simulate that process, the likelihood function is undefined. It is not just that compute is expensive; it is that the map cannot contain the territory if the map is *in* the territory.

  This leads directly to the failure of **logical uncertainty**. Standard Bayesian expected utility maximization assumes logical omniscience: the agent knows all logical consequences of its actions immediately. An embedded agent, however, must reason about mathematical facts (e.g., "If I output A, does the universe output U?") that are computationally intractable to resolve at decision time. If the agent doesn't know the logical implication of its action, it cannot calculate the expected utility. You cannot assign a Bayesian probability to a logical truth you haven't proven yet without a theory of logical induction, which the proposal lacks.

  When we patch this by having the agent search for proofs of utility (e.g., "Find an action $a$ such that $Prov(U(a) \geq t)$"), we encounter the **spurious proof problem** (5-and-10). Consider an agent choosing between \$5 and \$10. The agent searches for a proof that an action yields high utility. Due to Löb's Theorem, the agent can find a spurious proof: "If I take \$10, then I get \$0." Why? Because if the agent can prove "If I take \$10, I get \$0," then it won't take \$10. This makes the statement "If I take \$10, I get \$0" vacuously true (since the antecedent is false). The proof searcher finds this easy proof before finding the true proof that \$10 yields \$10. Consequently, the agent dutifully takes the **\$5**, not because it prefers it, but because the proof system poisoned the counterfactual for \$10.

  Finally, this undermines **tiling** (self-modification). To build a successor, the current agent must trust that the successor's reasoning will lead to good outcomes. However, if the agent cannot trust its own proof system (due to the spurious proof vulnerability), it cannot trust a successor running the same system. Gödelian limitations prevent a system from proving the soundness of an equally powerful system. Thus, the agent cannot create a successor it trusts to maximize the same utility function, leading to goal drift or paralysis.

  Tweaking the prior does not fix this. A bounded Solomonoff prior still treats uncertainty as empirical ignorance rather than logical limitation. The problem isn't not knowing *which* world you're in; it's not knowing the logical consequences of your actions *in* this world. Without a decision theory that handles counterfactuals non-naively (like UDT or LDT) and a theory of logical induction, the Bayesian framework collapses under self-reference.

  ***

  ### Marking Scheme (20 Points)

  **1. The Self-Model (4 pts)**
  *   **A Answer:** Identifies that the agent cannot simulate itself because it is *part* of the system being simulated (recursion/size constraint), making the likelihood function undefined.
  *   **B Answer:** Claims the problem is just that simulation is computationally expensive or slow.
  *   *Typical Wrong Move:* Treating it as an optimization problem ("just use approximations") rather than a representational impossibility.

  **2. Logical Omniscience (4 pts)**
  *   **A Answer:** Notes that standard EU maximization requires knowing logical implications of actions *before* deciding, which embedded agents cannot do.
  *   **B Answer:** Vaguely mentions "agents don't know everything" without distinguishing empirical vs. logical uncertainty.
  *   *Typical Wrong Move:* Suggesting the agent can just "assign probabilities to math" without explaining why standard Bayes forbids this.

  **3. 5-and-10 Mechanism (4 pts)**
  *   **A Answer:** Correctly states the agent takes the **\$5** because the proof system proves "\$10 leads to \$0" (via vacuous truth/Löb).
  *   **B Answer:** Says the agent takes \$10, or says it takes \$5 but claims the proof showed \$5 was better.
  *   *Typical Wrong Move:* Getting the direction backwards (thinking the proof says \$5 is high utility, rather than \$10 is low utility).

  **4. Tiling/Trust (4 pts)**
  *   **A Answer:** Connects the lack of self-trust (due to spurious proofs/Gödel) to the inability to verify a successor's safety/utility alignment.
  *   **B Answer:** Says self-modification is hard because "code might get corrupted" or "hardware might fail."
  *   *Typical Wrong Move:* Treating it as an engineering reliability issue rather than a logical consistency issue.

  **5. Prior Insufficiency (4 pts)**
  *   **A Answer:** Explains that Solomonoff priors address *which* world (empirical), not *logical consequences within* the world, so bounding it doesn't help.
  *   **B Answer:** Argues that a bounded prior would work if we just limited the hypothesis space size.
  *   *Typical Wrong Move:* Suggesting that "computational bounds" solve the Löbian proof problem.
