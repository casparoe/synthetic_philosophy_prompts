answer: |-
  # Decision Tree: From Habit to Norm
  **Course:** Social Philosophy | **Topic:** The Architecture of Unwritten Rules

  This tree helps you diagnose *what kind* of social pattern you are looking at. Start at Node 1 and follow the branches based on the concrete details of the case (e.g., the village path, the emoji, the potluck). Do not worry about philosophical labels yet; just answer the questions about how people actually behave and react.

  ### The Tree

  **Node 1: The Reaction Test**
  When someone breaks the pattern, is the main reaction that things become **harder/slower** (inconvenience) or that people get **mad/judgmental** (offense)?
  *   **Harder/Slower** → Go to Node 2
  *   **Mad/Judgmental** → Go to Node 7

  **Node 2: The Swap Test**
  Could the group have easily settled on the **opposite behavior** (e.g., driving left instead of right) with the same success?
  *   **Yes (It's Arbitrary)** → Go to Node 3
  *   **No (One way is better)** → Go to Node 5

  **Node 3: The Motivation Test**
  Do individuals follow the pattern because they **actively want to match others**, or just because it is **what they are used to**?
  *   **Actively want to match** → Go to Node 4
  *   **What they are used to** → **Leaf A**

  **Node 4: The Transparency Test**
  Does everyone know that everyone else expects this, and does everyone know that *that* is known? (Is it an open secret?)
  *   **Yes (Open Secret)** → **Leaf B**
  *   **No (Silent Assumption)** → **Leaf C**

  **Node 5: The Origin Test**
  Did this pattern survive because someone **designed it to work**, or because groups that didn't do it **failed/died out** over time?
  *   **Designed** → **Leaf D**
  *   **Failed/Died Out** → Go to Node 6

  **Node 6: The Awareness Test**
  Do the participants need to **understand why** the pattern works to follow it, or can they follow it while being **totally ignorant** of the reason?
  *   **Need to understand** → **Leaf E**
  *   **Totally ignorant** → **Leaf F**

  **Node 7: The Sanction Source Test**
  If you broke the rule and *no one else ever found out*, would you feel **guilty** (internal) or **relieved/safe** (external)?
  *   **Guilty (Internal)** → Go to Node 10
  *   **Relieved/Safe (External)** → Go to Node 8

  **Node 8: The Potluck Test**
  If you could vote to **cancel the rule entirely** (so no one had to do it), would you vote to **keep it** or **abolish it**?
  *   **Keep it** → **Leaf G**
  *   **Abolish it** → Go to Node 9

  **Node 9: The Uniformity Test**
  Does **everyone** privately wish to abolish it, or do some people **actually like it** and enforce it on others?
  *   **Everyone wishes to abolish** → **Leaf H**
  *   **Some actually like it** → **Leaf I**

  **Node 10: The Scope Test**
  Does this rule apply only to **our group** (e.g., fishermen, company staff) or to **everyone everywhere**?
  *   **Our group only** → **Leaf J**
  *   **Everyone everywhere** → **Leaf K**

  ---

  ### The Leaves (Accounts & Commitments)

  **Leaf A: Deflationary Regularity**
  *   *Path:* Inconvenience → Arbitrary → Habit.
  *   *Description:* A mere habit with no normative bite; we do it because we always have.
  *   *Most Awkward Commitment:* Cannot explain why we feel entitled to *criticize* someone for breaking a mere habit.

  **Leaf B: Lewis-Style Convention**
  *   *Path:* Inconvenience → Arbitrary → Coordinate → Open Secret.
  *   *Description:* A coordination equilibrium sustained by mutual expectations and conditional preferences.
  *   *Most Awkward Commitment:* Requires assuming everyone is constantly calculating conditional preferences like a mini-game theorist.

  **Leaf C: Tacit Coordination**
  *   *Path:* Inconvenience → Arbitrary → Coordinate → Silent Assumption.
  *   *Description:* Coordination without common knowledge; we match without knowing we know.
  *   *Most Awkward Commitment:* Logically unstable; without common knowledge, it is hard to explain why the coordination persists when expectations shift.

  **Leaf D: Technical Standard**
  *   *Path:* Inconvenience → Non-Arbitrary → Designed.
  *   *Description:* A rule fixed by authority or engineering for efficiency (e.g., USB ports).
  *   *Most Awkward Commitment:* Treats social order like hardware; ignores how users often repurpose or resist standards.

  **Leaf E: Rationalist Functionalism**
  *   *Path:* Inconvenience → Non-Arbitrary → Selection → Understand.
  *   *Description:* People follow the rule because they see it is objectively best.
  *   *Most Awkward Commitment:* Empirically false for many traditions; people often follow rules without knowing their function.

  **Leaf F: Selectionist/Evolutionary Account**
  *   *Path:* Inconvenience → Non-Arbitrary → Selection → Ignorant.
  *   *Description:* A stable equilibrium picked out by cultural evolution; participants need not represent any 'ought'.
  *   *Most Awkward Commitment:* Makes human agents look like mindless ants carrying genes/memes without understanding why.

  **Leaf G: Internalized Social Norm**
  *   *Path:* Offense → External → Keep Rule.
  *   *Description:* Originally external pressure, now adopted as personal value.
  *   *Most Awkward Commitment:* Blurs the line between Social Norms and Moral Norms; hard to distinguish from Leaf K.

  **Leaf H: Pluralistic Ignorance (The Potluck Case)**
  *   *Path:* Offense → External → Abolish → Everyone Hates.
  *   *Description:* A Social Norm where everyone complies because they falsely believe others want it.
  *   *Most Awkward Commitment:* Suggests entire communities can be trapped in stable equilibria that *no one* actually wants.

  **Leaf I: Power/Exclusion Norm**
  *   *Path:* Offense → External → Abolish → Some Like It.
  *   *Description:* A rule enforced by a subgroup to burden others (e.g., expensive dress codes).
  *   *Most Awkward Commitment:* Reduces all normativity to power dynamics; struggles to explain norms that burden the enforcers too.

  **Leaf J: Group-Specific Morality**
  *   *Path:* Offense → Internal → Group Only.
  *   *Description:* A moral obligation felt only toward insiders (e.g., "honor among thieves").
  *   *Most Awkward Commitment:* Challenges the idea that morality must be universal; implies "wrong" is relative to the tribe.

  **Leaf K: Moral Norm**
  *   *Path:* Offense → Internal → Universal.
  *   *Description:* A rule followed because it is believed to be objectively right.
  *   *Most Awkward Commitment:* Struggles to explain why moral norms often vary by culture if they are universal.

  ---

  ### Empty or Incoherent Cells

  *   **Offense + Arbitrary (Node 1 → Node 2 Yes):** *Incoherent.* It is difficult to sustain anger over a pattern that everyone admits could have been the opposite with no loss of value (unless it becomes a Leaf H case).
  *   **Inconvenience + Non-Arbitrary + Designed + Ignorant:** *Unattractive.* If a designer made it for a reason, but users are ignorant of the reason, the pattern is fragile and likely to collapse into Leaf F or Leaf A.
  *   **Offense + Internal + Abolish:** *Psychologically Unstable.* If you feel internal guilt but would vote to abolish the rule, you are in cognitive dissonance; this usually resolves into Leaf G or Leaf H over time.

  ### Indistinguishable Pairs & Extra Questions

  **1. Leaf B (Lewis Convention) vs. Leaf A (Deflationary Regularity)**
  *   *Problem:* In long-standing groups, "active coordination" feels exactly like "habit." Students often conflate the *origin* (coordination) with the *maintenance* (habit).
  *   *Extra Question:* "If you discovered tomorrow that everyone else was planning to switch to the opposite pattern, would you **gladly switch** with them (Lewis) or **feel they are being difficult** (Regularity)?"

  **2. Leaf H (Pluralistic Ignorance) vs. Leaf K (Moral Norm)**
  *   *Problem:* An internalized norm (K) looks behaviorally identical to a norm where everyone *thinks* others believe it (H), especially if no one speaks up.
  *   *Extra Question:* "If you were granted **absolute anonymity** and immunity from social consequences, would you **still** follow the rule? (If yes → Moral Norm; If no → Social Norm)."

  **3. Leaf F (Selectionist) vs. Leaf B (Lewis Convention)**
  *   *Problem:* Many conventions *evolve* over time. A Lewis convention can become an evolutionary equilibrium.
  *   *Extra Question:* "Does the stability depend on current participants **reasoning** about each other (Lewis), or would the pattern persist even if we **replaced the people** with new learners who just copy what works? (Selectionist)."
