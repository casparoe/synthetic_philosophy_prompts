  **Logic:** A "disintegrative phase" is declared only when three specific endogenous conditions converge simultaneously: (1) **Elite Overproduction** (too many aspirants for too few positions), (2) **Popular Immiseration** (stagnating wages, rising inequality, or fiscal distress among the masses), and (3) **State Fiscal Distress** (insolvency or loss of taxing capacity). Furthermore, the crisis must be **Endogenous** (arising from internal cycle dynamics rather than external shocks). The absence of *any* one of these three pillars, or the presence of an exogenous shock, vetoes the classification.

  *   **Consistency Check:**
      *   *Rome, France, ACW:* All three pillars present + Endogenous. (Verdict: Yes)
      *   *Black Death:* Exogenous shock + relieved elite pressure. (Verdict: No)
      *   *USSR:* Lacked endogenous intra-elite competition (Nomenklatura was a monopoly) + she views it as imperial/fiscal collapse without the demographic build-up. (Verdict: No)
      *   *Great Depression:* State remained solvent + no elite surplus. (Verdict: No)

  *   **Prediction for China:** **No.**
      *   *Reasoning:* While China exhibits **Elite Overproduction** (involution, credential inflation), it fails the other two pillars. You noted "popular living standards have risen" (no Popular Immiseration) and "the central state hardly looks insolvent" (no State Fiscal Distress). Under the Conjunctural Veto, the presence of elite pressure alone is insufficient without the accompanying mass distress and state weakness.

  ### Rule 2: The Elite-Engine Primacy (The "Fragmentation" Rule)
  **Logic:** The primary driver of a disintegrative phase is **Endogenous Elite Overproduction** leading to intra-elite factionalism. Popular Immiseration and State Fiscal Distress are typical *symptoms* or *amplifiers* of the cycle, but they are not strict necessary conditions. As long as there is a surplus of credentialed elites jockeying for power within an endogenous cycle, the system is in a disintegrative phase. Exogenous shocks (Black Death) or systems without credentialed elite competition (USSR Nomenklatura, Depression-era US) do not count, but a solvent state or rising wages do not veto the classification if elite fragmentation is severe.

  *   **Consistency Check:**
      *   *Rome, France, ACW:* High elite overproduction/fragmentation. (Verdict: Yes)
      *   *Black Death:* Thinned elites (reduced overproduction). (Verdict: No)
      *   *USSR:* She explicitly cited the lack of "intra-elite competition" as the disqualifier, not the solvency. (Verdict: No)
      *   *Great Depression:* She explicitly cited "no surplus of credentialed elites" as a disqualifier. (Verdict: No)

  *   **Prediction for China:** **Yes.**
      *   *Reasoning:* China displays the core signal: "enormous expansion of higher education, graduate underemployment, and... involution." This is endogenous elite overproduction. Under the Elite-Engine rule, the fact that the state is solvent or wages are rising is secondary; the friction among the surplus elites is the defining characteristic of the disintegration.

