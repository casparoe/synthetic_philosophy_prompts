answer: |-
  Mayor, Deputy Lieutenant, families, friends, and most importantly, the forty individuals taking the oath today. Welcome.

  I chair the civic committee, so the words you hear are mine to choose. Usually, this speech is a warm blanket of reassurance. We tell you that 'the people' have decided to welcome you. We imply a seamless continuity between those already here and those arriving. But looking at this room — at the families who travelled far, at the politics students observing the machinery of state, and at the leather-bound Roll of the Borough sitting on the table — I think we owe you something more precise than comfort.

  That Roll has been kept since the 1920s. It looks like a record of continuity, a list of additions to a static whole. Convention dictates I say that the existing community has democratically chosen to include you. But strictly speaking, that is not true. You did not vote on the rules that brought you here. The boundary of the people — who counts as 'us' and who counts as 'them' — was drawn by those already inside the line. Those outside had no say in where the line was placed. To pretend otherwise is to paper over the quiet asymmetry at the heart of every naturalisation ceremony.

  However, acknowledging this asymmetry is not an admission of cynicism. It is an invitation to understand what democracy actually is. It is not a private club with fixed membership criteria decided once and for all. It is a continuous act of composition. When you sign this Roll today, you are not merely entering a pre-existing space. You are altering the composition of the space itself.

  The 'we' that meets in this town hall next year is not the same 'we' that met last year. It cannot be, because you are now part of it. Your experiences, your languages, and your expectations will change what this borough is, and consequently, change what British citizenship means in this street, in this school, in this council chamber. The authority to draw the boundary lies with the existing people, yes. But the legitimacy of that boundary depends on its capacity to move.

  So, do not view this ceremony as the end of a test where you proved yourself worthy of us. View it as the beginning of a shared responsibility to redefine who 'we' are. The oath you take is not just a pledge of loyalty to a static state; it is a commitment to participate in the mutable project of self-rule. You are here to change us, just as we have changed you.

  The Roll does not record strangers becoming like us. It records us becoming something new. That is the work of citizenship. It is unfinished business. And today, the business continues.

  Welcome to the borough. Welcome to the work.

