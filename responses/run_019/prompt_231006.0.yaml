answer: |-
  This is an excellent and philosophically precise objection. You have put your finger on the exact tension that has occupied scholars of Islamic theology and medieval philosophy for centuries. In fact, your intuition aligns with the famous "Humean" critique of causation, though al-Ghazālī (d. 1111) predates Hume (d. 1776) by several centuries.

  To answer your question directly: **No, al-Ghazālī does not believe he is committed to radical skepticism about the future.** However, you are correct that he cannot justify the expectation of regularity through empirical induction without circularity. Instead, his justification is **theological and volitional**, not empirical or logical.

  Here is how al-Ghazālī stabilizes his occasionalism against the charge of radical skepticism, based primarily on his *Tahāfut al-Falāsifa* (The Incoherence of the Philosophers).

  ### 1. Distinguishing Logical Necessity from Volitional Consistency
  The core of your objection rests on the idea that if there is no *necessary* connection between fire and cotton, there is no reason to expect the connection to hold tomorrow. Al-Ghazālī agrees that there is no **logical or metaphysical necessity** (*ḍarūra*) in the connection. Fire does not *force* cotton to burn.

  However, al-Ghazālī replaces "natural necessity" with **Divine Custom** (*ʿāda*).
  *   **The Philosophers (Avicenna et al.):** Argue that fire burns cotton because of an essential nature in fire that *must* produce heat.
  *   **Al-Ghazālī:** Argues that fire burns cotton because God *wills* it to burn, and He wills it consistently.

  The stability of the future does not rest on the nature of created things (which are inert), but on the **immutability of the Divine Will.** If God were capricious, skepticism would indeed follow. But al-Ghazālī argues that God is not capricious.

  ### 2. The Non-Circular Justification: Divine Attributes
  You noted that arguing "God will act tomorrow as He acted today" based on past observation is circular induction. Al-Ghazālī would agree. That is not his argument. His argument is deductive, based on the **attributes of God**, which are known through revelation and reason, not just empirical observation of physics.

  Al-Ghazālī posits that God acts according to **Wisdom** (*ḥikma*) and **Purpose** (*gharaḍ*).
  *   **Purposeful Creation:** God created the world for a purpose (human knowledge, worship, moral testing).
  *   **Intelligibility:** A world where regularities vanished randomly would make knowledge (*ʿilm*) and moral responsibility impossible. If fire sometimes burned and sometimes cooled without reason, humans could not navigate the world, and prophecy (which relies on breaking customs via miracles) would be indistinguishable from chaos.
  *   **Divine Truthfulness:** God's promises and threats (reward and punishment) rely on a stable order. If the natural order were fundamentally unstable, the religious law (*sharīʿa*) would be voided.

  Therefore, the justification for trusting the future is not "Fire has burned before," but rather **"God is Wise and Truthful, and a Wise God does not create a coherent system only to immediately render it unintelligible without cause."** This is a theological axiom, not an empirical induction.

  ### 3. The Function of Miracles (The "Exception" that Proves the Rule)
  Paradoxically, al-Ghazālī *needs* the possibility of irregularity to avoid skepticism about prophecy.
  *   If causal connections were **necessary** (as the Philosophers claim), miracles would be impossible (God couldn't stop the fire from burning Abraham).
  *   If causal connections were **random** (as your skepticism suggests), miracles would be meaningless (a miracle is a *specific* break in a *reliable* pattern).

  Al-Ghazālī walks a middle path. The "Custom of God" is so stable that a break in it (a miracle) is immediately recognizable as a divine sign. The regularity is robust enough for science and daily life, but contingent enough to allow for divine intervention. This contingency is what protects God's omnipotence, while the robustness protects human knowledge.

  ### 4. Practical Certainty vs. Metaphysical Certainty
  Al-Ghazālī distinguishes between two types of certainty:
  1.  **Metaphysical Certainty:** That something *must* happen. (He denies this exists in nature).
  2.  **Practical/Psychological Certainty:** That something *will* happen, based on God's established custom.

  In the *Tahāfut*, al-Ghazālī admits that it is *possible* (in the absolute sense) that cotton will not burn tomorrow. But he argues it is **inconceivable** (*ghayr maʿqūl*) in the context of God's established order. He writes that the denial of causal necessity does not lead to the denial of observation. We observe the conjunction. We trust the conjunction will continue because we trust the Agent (God) who sustains it.

  For al-Ghazālī, skepticism arises only if you demand *logical necessity* for future events. If you lower the bar to **moral/volitional certainty** (based on the character of the Agent), skepticism dissolves.

  ### 5. Where the Instability Remains (A Critical Note)
  While al-Ghazālī has an internal answer, many critics (both medieval like Averroes and modern like Hume) find it unsatisfying for a specific reason: **The Problem of Divine Freedom.**

  If God is absolutely free (*mukhtār*), can He not choose to act "out of character"?
  *   **Al-Ghazālī's Reply:** God *can*, but He *won't*, because acting chaotically contradicts His attribute of Wisdom.
  *   **The Critic's Reply:** If God *won't* act chaotically because of His Wisdom, is His Will not constrained by His Wisdom? If it is constrained, is He truly free? If it is not constrained, what stops Him from being chaotic?

  Al-Ghazālī bites the bullet: God is free, but His freedom is perfected by His Wisdom. He is not compelled by external laws, but He is consistent with His own nature.

  ### Summary
  Al-Ghazālī avoids radical skepticism not by finding necessity in **nature**, but by finding reliability in **God**.

  *   **Is it circular?** Only if you try to prove God's consistency empirically. Al-Ghazālī grounds it in the *a priori* theological concept of Divine Wisdom.
  *   **Is it stable?** Internally, yes. It relies on the coherence of his theology. Externally (to a non-theist or a strict empiricist), it looks like an appeal to mystery.
  *   **The Verdict:** You are right that there is no *empirical* guarantee. But al-Ghazālī never promised one. He promises a **theological guarantee**. The "Custom of God" (*ʿĀdat Allāh*) is the bridge between absolute divine freedom and human expectation.

  So, he is not committed to skepticism about the future, provided one accepts his premise that God is a rational, purposeful Agent who does not act in vain. If you reject that premise, then yes, his occasionalism collapses into skepticism. But within his system, the regularity of nature is a mirror of the consistency of the Divine Will.
