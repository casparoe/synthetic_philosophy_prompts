answer: |-
  This is a profound governance dilemma, one that mirrors the challenges faced by states and international bodies throughout history. You are asking whether you must choose between **legitimacy without power** (the ban exists but is ignored) or **power without legitimacy** (enforcing rules only when you can punish, even if it means dropping fair ones).

  The short answer is: **No, that is not the actual choice.** It is a false dichotomy born of viewing "force" only as immediate coercion (fines, eviction, injunctions).

  Your two neighbours represent two classic philosophical positions. Neighbour A is a **Legal Positivist**: they believe a rule is only a rule if it has a sanction. Neighbour B is a **Natural Law/Communitarian**: they believe a rule derives authority from the consent and shared values of the governed, regardless of immediate enforcement.

  Both are partially right, but both are incomplete. If you follow A, you surrender the moral architecture of your building to the person with the most resources to ignore you. If you follow B without strategy, you risk turning the association into a debating society that issues press releases while the building burns.

  Here is a way of thinking about the relationship between justice and force that reconciles them, and what it implies for your specific situation.

  ### 1. Reframing Justice and Force
  The 17th-century philosopher Blaise Pascal wrote, *"Justice without force is powerless; force without justice is tyrannical."* He concluded that we must therefore "put justice and force together."

  However, in a voluntary association like yours, "force" should not be thought of merely as **coercion** (fines), but as **leverage** and **cost**.

  *   **The Expressive Function of Rules:** Even unenforced rules perform a vital function: they define the community. By keeping the ban on the books, you are publicly stating, "This is not a hotel; this is a home." If you remove the ban, you change the legal and normative character of the building. You signal to all 40 owners that the rules are optional if you are stubborn enough.
  *   **Force as Friction:** You may not be able to stop the holiday lets instantly, but you can make them expensive, difficult, and reputationally damaging for the owner. Force is not just a stop sign; it can be a series of speed bumps.

  Therefore, the choice is not between "Powerless Justice" and "Effective Tyranny." The choice is between **Passive Legitimacy** (keeping the rule but doing nothing) and **Active Legitimacy** (keeping the rule and increasing the cost of violation).

  ### 2. Critiquing the Neighbours
  *   **Neighbour A (The Realist)** is wrong to suggest that an unenforceable rule is "only a wish." It is a **standard**. If you drop the rule, you aren't being "honest"; you are admitting that minority veto power overrides majority will. That destroys the association's future ability to govern *anything*, from noise to fire safety.
  *   **Neighbour B (The Principled)** is right about the stakes but risks being naive about the method. Simply passing another resolution without a change in tactic *does* invite contempt. Authority is not just declared; it is cultivated through consequences.

  ### 3. The Third Way: "Escalated Normative Pressure"
  You should not drop the ban. To do so would be a capitulation that undermines the association's long-term authority (validating Neighbour B). However, you must stop treating the "strongly worded letter" as the end of the process (validating Neighbour A).

  You need to move from **administrative governance** (minutes and letters) to **strategic governance** (leveraging external constraints).

  Here is what that implies for dealing with the holdout:

  #### A. Verify the Legal Basis (The "Force" Audit)
  You say you have "no practical way to fine him." You must be certain of this.
  *   **Lease Covenants:** In most converted mills, the leases prohibit "nuisance" or "change of use." Short-term letting often breaches a clause restricting use to a "private dwelling."
  *   **Planning Permission:** In many jurisdictions (especially the UK, given the term "mill building" and "flats"), a change from residential to short-term let requires planning permission. If he doesn't have it, the *local council* has the force you lack.
  *   **Mortgage & Insurance:** Commercial holiday lets often violate residential mortgage terms and building insurance policies.
  *   **Action:** Do not just write to the owner. Write to his mortgage lender, his insurer, and the local planning authority. Provide them with the minutes of the vote and evidence of the lets. You are not fining him; you are alerting third parties to a breach of *their* contracts. This is external force applied to your internal justice.

  #### B. Increase the Transactional Cost
  If he cannot be fined, he can be inconvenienced.
  *   **Access Control:** If the building has security fobs or keys for common areas, ensure the terms of issue strictly prohibit handing them to third parties. Change codes regularly. If guests are locked out, call the owner, not the RA. Make his management of the units labor-intensive.
  *   **Delivery and Services:** Inform delivery companies and cleaning services (if known) that the building is private residential only and they do not have authority to access common parts for commercial purposes.

  #### C. The "Shadow of the Future"
  You must make it clear that this issue does not close.
  *   **Record of Breach:** Ensure every breach is minuted not as a "complaint," but as a "recorded violation of Resolution X."
  *   **Sale Disclosure:** When he eventually sells these flats (and he will), the buyers' solicitors will ask for management pack information. Your records will show a history of dispute and non-compliance. This can devalue the units or scare off buyers. Let him know this. A polite letter stating, *"We wish to inform you that all correspondence regarding breaches of the holiday let ban will be included in future management packs for prospective purchasers,"* is a powerful deterrent.

  #### D. Communicate the Stakes to the Building
  Neighbour A worries about contempt. Contempt arises from **hypocrisy**, not from **struggle**.
  *   If the RA says, "We have a rule, we know it's hard to enforce, but we are using every available channel to uphold it because it protects our homes," residents will respect the effort.
  *   If the RA says, "We have a rule," and then does nothing when it is broken, residents will respect neither the rule nor the RA.
  *   **Transparency:** Update the residents regularly. "We have written to X, Y, and Z. We are exploring legal opinion on lease covenants." This shows you are fighting, even if you haven't won yet.

  ### 4. Conclusion: Authority is a Practice
  The authority of the association is not a switch that is either on or off. It is a muscle. It atrophies if not used, but it also tears if strained beyond capacity.

  You should keep the ban. It is the "justice" part of the equation. It represents the settled will of the community. But you must stop treating the lack of a fine as a lack of power. Your power lies in **persistence, documentation, and the mobilization of external constraints.**

  Tell Neighbour A: "We are not issuing wishes; we are building a case."
  Tell Neighbour B: "We are not capitulating; we are escalating."

  By refusing to drop the rule, you maintain the **normative boundary** of the building. By actively seeking external leverage (planning, mortgages, insurance, sale disclosures), you demonstrate that **force** is not absent, merely indirect. This reconciles justice and force: Justice provides the *reason* for the action, and creative leverage provides the *means*.

  Do not choose between being fair and being effective. Be fair in your aim, and relentless in your methods.
