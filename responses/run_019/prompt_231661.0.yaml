answer: |-
  ### Part 1: Analysis of Difficulties

  Before drafting the procedure, we must isolate the specific operational hazards that arise when translating ethical uncertainty into audit checklists.

  1.  **The Epistemic Hazard:** The auditor cannot be asked to weigh neurobiological evidence. If they are, consistency will collapse.
      *   *Solution:* The Standards Body pre-assigns a **Sentience Probability Class (SPC)** to each species based on current consensus. The auditor treats the SPC as a fact, like a species name.
      *   *Class A (Finfish):* Presumed Sentient. High burden of proof required to justify risk.
      *   *Class B (Decapods):* Plausibly Sentient. Precautionary burden applies, but acknowledges technical immaturity.

  2.  **The Aggregation Hazard:** A 1% failure rate on 10,000 salmon is 100 animals. A 1% failure rate on 100 million shrimp is 1 million animals. A simple percentage threshold fails to capture the moral weight of scale.
      *   *Solution:* We use a **Severity Floor** for methods (some things are banned regardless of scale) and a **Volume Multiplier** for failure rates. High-volume operations must meet stricter reliability standards because the absolute number of affected animals is higher.

  3.  **The Feasibility Hazard:** A rule that demands the "theoretically best" method will certify zero shrimp farms, rendering the label useless for crustaceans. A rule that accepts "industry standard" permits torture.
      *   *Solution:* The **Reasonably Available Alternative (RAA)** test. An alternative is required only if it is technically mature and does not threaten the economic viability of the operation (defined by cost/throughput thresholds). If no RAA exists, we enter a "Transitional Certification" status rather than a hard fail, to avoid industry collapse while signaling moral debt.

  4.  **The Values Hazard:** Some trade-offs (e.g., "Shut down this small ethical farmer or allow boiling?") are not technical questions.
      *   *Solution:* A narrow **Escalation Trigger**. The auditor stops and refers to the Standards Committee only when a method violates the Severity Floor *but* no alternative exists, or when the economic cost of compliance exceeds the viability threshold.

  ---

  ### Part 2: The Precautionary Slaughter Protocol (PSP)

  **Document ID:** AUD-WEL-04
  **User:** Field Auditor
  **Scope:** Slaughter and Handling of Farmed Finfish and Decapods
  **Decision Outputs:** CERTIFY, CERTIFY WITH CORRECTIVE ACTIONS, DO NOT CERTIFY

  #### Section 1: Inputs (Pre-Audit)
  *Before site visit, retrieve the following from the Standards Database:*
  1.  **Sentience Probability Class (SPC):**
      *   **SPC-A:** Finfish (e.g., Salmon, Trout). *Status: Presumed Sentient.*
      *   **SPC-B:** Decapods (e.g., Shrimp, Crab). *Status: Plausibly Sentient.*
  2.  **Method Risk Rating (MRR):**
      *   **Red (Prohibited):** Boiling alive; Dismemberment without prior stunning; Air asphyxiation.
      *   **Amber (Restricted):** Ice slurry (without verified stun); CO2 exposure; Manual bleeding without stun.
      *   **Green (Accepted):** Percussive stunning (verified); Electrical stunning (verified); Rapid chemical immersion (verified).
  3.  **Failure Rate Thresholds (FRT):**
      *   **SPC-A:** Max 1% immediate failure.
      *   **SPC-B:** Max 5% immediate failure.
      *   *Note:* For operations processing >1 million units/year, reduce FRT by half (0.5% for A, 2.5% for B).

  #### Section 2: Decision Procedure

  **Step 1: The Severity Floor Check**
  Identify the primary slaughter method. Cross-reference with the **Method Risk Rating (MRR)**.
  *   **IF** Method is **Red**: Proceed to Step 2.
  *   **IF** Method is **Amber** or **Green**: Skip to Step 3.

  **Step 2: Red Method Mitigation**
  *   **IF** a **Green** alternative is **Reasonably Available** (see Step 4): **DO NOT CERTIFY**.
  *   **IF** a **Green** alternative is **NOT Reasonably Available**: Proceed to **Escalation Trigger A**.
      *   *Auditor Action:* Mark "Escalation A". Issue **CERTIFY WITH CORRECTIVE ACTIONS**. Condition: Producer must fund R&D or pilot program for Green alternative within 12 months.

  **Step 3: Performance & Failure Rate Check**
  Observe slaughter cycle. Record total animals processed ($N$) and observed failures ($F$). Calculate Failure Rate ($F/N$).
  *   **IF** Failure Rate > **Failure Rate Threshold (FRT)**: Proceed to Step 4.
  *   **IF** Failure Rate $\le$ **FRT**: Proceed to Step 5.

  **Step 4: Failure Mitigation**
  *   **IF** SPC-A: **DO NOT CERTIFY**. (No tolerance for high-volume conscious bleeding in presumed sentient animals).
  *   **IF** SPC-B: Issue **CERTIFY WITH CORRECTIVE ACTIONS**. Condition: Reduce failure rate to within FRT within 6 months.
      *   *Exception:* If $N$ > 1 million/year and Rate > 2x FRT: **DO NOT CERTIFY**. (Scale amplifies harm beyond precautionary allowance).

  **Step 5: Reasonably Available Alternative (RAA) Test**
  *Applies if Method is Amber, or if Step 2 triggered Escalation.*
  Determine if a **Green** method exists that meets these criteria:
  1.  **Technical Maturity:** Commercially deployed in at least 3 comparable facilities globally.
  2.  **Economic Viability:** Implementation cost does not exceed 15% of operational margin OR throughput reduction does not exceed 20%.
  *   **IF** Green Method meets RAA criteria: **CERTIFY WITH CORRECTIVE ACTIONS**. Condition: Adopt Green method within 12 months.
  *   **IF** Green Method does NOT meet RAA criteria: **CERTIFY**. (Acknowledges current technological limit).

  **Step 6: Escalation Triggers**
  *Refer to Standards Committee immediately if:*
  *   **Trigger A:** Method is **Red**, but no RAA exists (Step 2).
  *   **Trigger B:** Compliance with RAA would cause demonstrable business insolvency (documented by financial audit).
  *   **Trigger C:** SPC-B operation processes >100 million units/year using **Amber** methods with no Green alternative. (Aggregation risk requires values judgment).

  #### Section 3: Auditor Notes
  *   **Do not debate sentience.** Use the SPC provided.
  *   **Do not calculate cost-benefit.** Use the RAA thresholds (15% cost / 20% throughput).
  *   **Do not ignore scale.** Apply the Volume Multiplier to Failure Rate Thresholds.

  ---

  ### Part 3: Application to Cases

  #### Case (i): High-Volume Whiteleg Shrimp Farm
  *   **Inputs:** Species: Shrimp (SPC-B). Method: Ice Slurry + Mechanical Splitting (No Pre-Stun). Volume: High (>1M/year).
  *   **Step 1 (Severity Floor):** Mechanical splitting of live animals is **Red** (Dismemberment without stun). Ice Slurry is **Amber** (not a verified stun).
  *   **Step 2 (Red Mitigation):** Is there a Green alternative (e.g., Electrical Stunning)?
      *   *Fact:* Producer argues alternatives are unproven/expensive.
      *   *RAA Test:* If electrical stunning is not deployed in 3 comparable facilities or reduces throughput >20%, it is **Not Reasonably Available**.
      *   *Assumption:* For high-volume whiteleg, reliable electrical stunning is currently technically immature (clogging, variance).
  *   **Decision:** **Escalation Trigger A** applies.
  *   **Output:** **CERTIFY WITH CORRECTIVE ACTIONS**.
  *   **Condition:** Producer must join industry working group to validate electrical stunning within 12 months.
  *   **Decisive Step:** Step 2 (Red Method Mitigation via Transitional Exemption).

  #### Case (ii): Salmon Farm with Percussive Stunning
  *   **Inputs:** Species: Salmon (SPC-A). Method: Automated Percussive (Green). Failure Rate: 3%. Volume: Not specified (assume standard commercial).
  *   **Step 1 (Severity Floor):** Method is **Green**. Skip to Step 3.
  *   **Step 3 (Failure Rate):** SPC-A Threshold is 1%. Observed is 3%.
      *   *Volume Check:* Even if volume is low, 3% > 1%.
  *   **Step 4 (Failure Mitigation):** SPC-A rule is strict.
  *   **Output:** **DO NOT CERTIFY**.
  *   **Decisive Step:** Step 4 (Failure Mitigation for SPC-A).

  #### Case (iii): Small Crab Producer Boiling Alive
  *   **Inputs:** Species: Crab (SPC-B). Method: Boiling Alive. Volume: Small.
  *   **Step 1 (Severity Floor):** Boiling alive is **Red**.
  *   **Step 2 (Red Mitigation):** Is there a Green alternative (e.g., Mechanical destruction of ganglia before boiling)?
      *   *Fact:* Producer argues machinery is unsafe/untrusted. Manual destruction is a viable Green alternative that does not require machinery.
      *   *RAA Test:* Manual destruction is technically mature and low cost. It **IS Reasonably Available**.
  *   **Decision:** Red Method + Available Alternative = Fail.
  *   **Output:** **DO NOT CERTIFY**.
  *   **Decisive Step:** Step 2 (Red Method Mitigation).

  ---

  ### Part 4: The Uncomfortable Outcome

  **The Case:** Case (i) — The High-Volume Shrimp Farm.
  **The Decision:** **CERTIFY WITH CORRECTIVE ACTIONS**.
  **Why this is uncomfortable:**
  You (the Standards Director) likely find the practice of chilling shrimp in ice slurry and mechanically splitting them while they may still be conscious to be morally repellent. It violates the intuition of "higher welfare." However, the procedure forces you to certify it.

  **Why the procedure gives this answer:**
  The procedure is designed to avoid the "Pure Precautionary Veto." If the procedure mandated a hard fail for any **Red** method where the **Green** alternative is not *Reasonably Available* (technically mature and economically viable), you would certify zero shrimp farms. This would collapse the crustacean category of your label, removing your leverage to improve the industry over time.

  The procedure prioritizes **Existence with Pressure** over **Purity with Absence**. It forces you to accept a moral compromise (certifying a potentially cruel method) to maintain a foothold in the market, betting that the "Corrective Action" (R&D requirement) will yield a humane technology later. This is the tragic cost of operationalizing the precautionary principle in an immature market: you must sometimes certify the very harm you seek to eliminate, because banning it eliminates the certifier.

  **The Counter-Intuitive Rigor:**
  Conversely, note Case (ii). A salmon farm with a 3% failure rate is **DO NOT CERTIFY**. You may respect this producer; they use automated stunning and monitor it. But because Salmon are **SPC-A** (Presumed Sentient), the procedure does not allow volume or general goodwill to offset the absolute number of conscious animals bled out. The procedure hurts the "good" finfish farmer more than the "necessary evil" shrimp farmer. This is intentional: certainty of suffering (finfish) weighs heavier than probability of suffering (crustaceans) when technology allows mitigation.

  ### Part 5: Limitations and Values Committee Handoff

  This procedure cannot settle the following. These are reserved for the Standards Committee (you):

  1.  **The Sentience Assignment:** The auditor treats SPC-A and SPC-B as facts. You must update these classifications as science evolves. The procedure cannot tell you *when* shrimp become fish in moral status.
  2.  **The Viability Threshold:** I have set the economic limit at 15% cost / 20% throughput. This is an arbitrary ethical line. If your stakeholders believe 5% is the limit, the procedure must be re-parameterized.
  3.  **The Aggregation Cap:** In Case (i), if the farm scales to 500 million shrimp/year, the "Transitional Exemption" may no longer be morally defensible regardless of technology. Trigger C flags this for your committee to decide if the label should withdraw from that segment entirely.

  **Final Instruction to Auditor:**
  You are not judging the soul of the farmer. You are measuring the risk against the standard. If the procedure says "Certify," and you feel uneasy, record the unease in the "Auditor Notes" field. That data is how we eventually tighten the thresholds.
