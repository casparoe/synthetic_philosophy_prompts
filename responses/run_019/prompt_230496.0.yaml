prompt: |-
  You are an expert on the philosophy of collective action and the epistemics of group decision-making. I want a careful structural diagnosis rather than generic leadership advice.

  I am one of seven volunteer moderators of a long-running online community of about forty thousand members. We are all equals on paper, and each of us has the permission to post a site-wide announcement without anyone else's approval. For the past week we have been privately debating whether to respond to a platform policy change that we all regard as bad for the community. All seven of us drafted a personal statement protesting the change. After the drafts circulated, an odd pattern emerged. Each of us, reading only our own draft, concluded that if that draft alone went out, it would be a net positive: it would signal that the moderation team is engaged and might put useful pressure on the platform. Yet we also all agreed that if even three or four of the seven statements went out, it would look as though the moderation team had splintered, and the community would end up worse off than if no statement had been posted. I am fairly confident everyone is reasoning honestly, but the pattern feels structurally broken.

  Please first brainstorm the structural features of the case, then identify the underlying problem and explain how seven individually reasonable judgments could produce a collectively bad outcome. Finally, recommend a concrete decision procedure we could adopt so that this kind of failure does not recur.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Expert on philosophy of collective action and epistemics of group decision-making.
      *   **Task:** Provide a careful structural diagnosis (not generic leadership advice).
      *   **Scenario:** 7 volunteer moderators (equals) of a 40k member community. All can post site-wide announcements independently. Debating a platform policy change. All drafted personal statements.
      *   **The Paradox:** Each mod thinks *their* draft alone = Net Positive. But *3-4 drafts* = Net Negative (looks like splintering). Everyone agrees on this assessment.
      *   **Requirements:**
          1.  Brainstorm structural features.
          2.  Identify the underlying problem (explain how 7 reasonable judgments lead to a bad outcome).
          3.  Recommend a concrete decision procedure to prevent recurrence.

  2.  **Deconstruct the Scenario (Structural Features):**
      *   *Agency:* Decentralized/Equal. Any one actor can trigger the outcome unilaterally.
      *   *Information:* Private drafting, then shared. Common knowledge of the dilemma (everyone knows everyone else knows the risk of multiple posts).
      *   *Incentives/Values:* Altruistic/Community-focused (volunteers, want what's best for the community). Not seeking personal power, but seeking efficacy.
      *   *Interdependence:* The value of an action depends entirely on the actions of others.
      *   *Threshold Effect:* 1 action = Good. 2 actions = Maybe okay? 3+ actions = Bad. (Non-linear utility function).
      *   *Communication:* Private debate, but no binding agreement reached yet.

  3.  **Identify the Underlying Problem (Theoretical Frameworks):**
      *   *Prisoner's Dilemma?* No, because cooperation (no one posting) isn't necessarily the *best* outcome if one posting is better. It's more nuanced.
      *   *Tragedy of the Commons?* Sort of, but the "resource" is community cohesion/perception, not a physical good.
      *   *Coordination Problem?* Yes. Specifically, a *Volunteer's Dilemma* or a *Threshold Public Good* problem.
      *   *The Core Issue:* It's a **Coordination Failure under Unilateral Capability**.
      *   *Epistemic Angle:* Each agent lacks certainty about the others' actions at the moment of decision. Even with agreement, the *mechanism* to enforce "only one" is missing.
      *   *Game Theory:* This looks like a game with multiple Nash Equilibria.
          *   Equilibrium A: Exactly one person posts. (Stable? No, because others might want to join in to "help").
          *   Equilibrium B: No one posts. (Stable? Maybe, if fear of splintering dominates).
          *   Equilibrium C: Everyone posts. (Pareto inferior).
      *   *The "Odd Pattern":* Each thinks "If I do it, it's good." This implies they are conditioning on *only* them doing it. But they know others are thinking the same. This is a failure of *common knowledge of intention* vs. *common knowledge of capability*.
      *   *Specific Concept:* **The Unilateralist's Curse** (Bostrom/Douglas). When a group shares a norm but individuals can act unilaterally, the probability of the action happening increases with group size, even if the group consensus would be against it.
      *   *Also:* **Pluralistic Ignorance** (maybe not, since they discussed it), but definitely **Circular Reasoning** in decision criteria. "I should post because it helps, unless others post." But "others posting" depends on "them thinking they should post."

  4.  **Drafting the Diagnosis:**
      *   *Feature 1: Unilateral Veto/Action Power.* The technical permission structure contradicts the social desire for unity.
      *   *Feature 2: Non-Linear Utility.* The value isn't additive. 1 > 0, but 3 < 0.
      *   *Feature 3: Symmetric Reasoning.* All 7 agents are running the same algorithm. If the algorithm says "Go," all 7 go.
      *   *The Problem:* This is a classic **Coordination Game with a Single-Slot Constraint**. It is structurally identical to the "Unilateralist's Curse." The individual rationality condition ($E[U|me] > 0$) is being evaluated in isolation from the joint probability distribution of others' actions.
      *   *Why 7 reasonable judgments lead to bad outcome:* Because the condition for "Reasonable" ($P(\text{others stay silent}) \times \text{Value}_{\text{single}} > \text{Risk}_{\text{multiple}}$) is being assumed true by everyone, but logically cannot be true for everyone simultaneously. If everyone reasons "I should post," then $P(\text{others stay silent})$ approaches 0.

  5.  **Developing the Decision Procedure:**
      *   *Goal:* Constrain unilateralism without stifling initiative. Create a "focal point."
      *   *Option 1: Voting.* Simple majority? No, that leads to 4 posting.
      *   *Option 2: Random Selection.* If we agree *someone* should post, pick one by lot.
      *   *Option 3: Designated Spokesperson.* Rotate the role.
      *   *Option 4: Pre-commitment/Contract.* "We agree that max 1 posts."
      *   *Best Structural Fix:* Decouple *Decision* from *Action*.
      *   *Procedure:*
          1.  Collective Decision Phase: Do we speak? (Yes/No).
          2.  Messenger Selection Phase: Who speaks? (Random, Rotate, or Best Draft).
          3.  Restraint Phase: Others explicitly agree to silence.
      *   *Refinement:* The "Single Voice Protocol."

  6.  **Refining the Tone:**
      *   Must be philosophical, structural, and precise.
      *   Avoid "You should communicate better." (They already did).
      *   Avoid "Pick a leader." (They are equals).
      *   Focus on *mechanism design* and *epistemic conditions*.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "3-4 statements" threshold? Yes, that defines the utility curve.
      *   *Check:* Did I explain *why* individual rationality fails? Yes, via the Unilateralist's Curse/Coordination failure.
      *   *Check:* Is the recommendation concrete? Yes, a specific protocol.
      *   *Nuance:* The prompt says "If that draft *alone* went out." This implies they are simulating a counterfactual where they are the *only* actor. The error is in the probability assignment of that counterfactual.
      *   *Key Terminology:* Unilateralist's Curse, Coordination Equilibrium, Common Knowledge, Mechanism Design.

  8.  **Final Polish:** Organize into the requested sections (Structural Features, Underlying Problem, Decision Procedure). Ensure the distinction between *permission* (technical) and *authority* (social) is clear. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to emphasize that this isn't just a "Tragedy of the Commons." In ToC, individual gain is positive regardless of others (until collapse). Here, individual gain *depends* on others' inaction. This is a **Coordination Problem** specifically involving **Substitutable Actions**.

  Let's refine the "Underlying Problem" section. It's crucial to explain that $P(\text{Success})$ is correlated across agents. If Agent A thinks "It's safe to post," Agent B likely thinks the same because they share the same information and values. Therefore, the events are not independent.

  Okay, ready to write.s
answer: |-
  ### I. Structural Diagnosis: Features of the Case

  To diagnose this failure, we must strip away the interpersonal dynamics and look at the incentive structure, information flow, and agency constraints. The situation exhibits five specific structural features:

  1.  **Decoupled Permission and Authority:** Technically, every agent has the *permission* to act unilaterally (the "post" button works for all seven). Socially, however, the *authority* to act effectively is constrained by the group's unity. The technical architecture allows for seven independent actions, but the social epistemology of the community interprets multiple actions as discord.
  2.  **Non-Linear Utility Function (Threshold Effect):** The value of the action is not additive.
      *   $N=0$: Status Quo (Baseline).
      *   $N=1$: Net Positive (Signal of engagement).
      *   $N=2$: Ambiguous/Diminishing Returns.
      *   $N\ge3$: Net Negative (Signal of splintering).
      *   This creates a "single-slot" constraint. The group needs exactly one actor to maximize utility, but the system allows for up to seven.
  3.  **Symmetric Agent Reasoning:** All seven moderators share the same values (community welfare), the same information (the policy change and the drafted statements), and the same decision heuristic ("If my statement alone helps, I should post"). Because the agents are structurally identical, their decision processes are highly correlated.
  4.  **Counterfactual Isolation:** Each moderator evaluated their draft's efficacy based on the counterfactual: *"If **only** I post..."* They did not evaluate based on the conditional probability: *"Given that we all think this way, what is the probability that **only** I post?"*
  5.  **Lack of a Focal Point:** In game theory, a "focal point" (Schelling point) is a solution that people tend to choose by default in the absence of communication. Currently, there is no structural focal point to determine *which* of the seven should be the single actor. Without one, every agent remains a candidate, increasing the probability of collision.

  ### II. The Underlying Problem: The Unilateralist's Curse

  The phenomenon you are experiencing is a specific instance of **The Unilateralist's Curse**, a concept articulated in the context of collective epistemology and norm enforcement (notably by Bostrom, Douglas, and Sandberg).

  **How Seven Reasonable Judgments Produce a Bad Outcome**

  The failure is not in the *content* of the reasoning, but in the *probability assignment* regarding other agents.

  1.  **The Individual Calculation:** Each moderator ($M_i$) reasons:
      *   $V_1$ (Value of one statement) > 0.
      *   $V_{3+}$ (Value of three+ statements) < 0.
      *   *Decision Rule:* "I should post if I believe I will be the only one (or one of very few) to do so."
  2.  **The Correlation Error:** Because all seven moderators are peers with shared values and access to the same private debate, their internal states are highly correlated. If $M_1$ feels a strong moral imperative to post, it is statistically probable that $M_2$ through $M_7$ feel the same imperative.
  3.  **The Epistemic Blind Spot:** When $M_1$ decides "I should post," they are implicitly treating the other six agents' decisions as independent variables or assuming the others will exercise restraint. However, since the others are running the same algorithm on the same data, $M_1$'s confidence that "posting is the right move" is evidence that *others* will also conclude "posting is the right move."
  4.  **The Nash Equilibrium Trap:**
      *   Ideally, the group wants to reach the equilibrium where exactly one person posts.
      *   However, without a coordination mechanism, "Everyone Posts" becomes a risk-dominant equilibrium. Why? Because if I think there is a 50% chance someone else will post, my posting might push us over the threshold to disaster. But if I think there is a 50% chance *no one* will post, my posting is a net good.
      *   Since everyone wants to be the "hero" who secured the net positive (and no one wants to be the "coward" who let the opportunity slip if no one else acts), the pressure to act unilaterally outweighs the pressure to wait, absent a binding constraint.

  **Diagnosis:** The group is suffering from a **Coordination Failure under Unilateral Capability**. You have transformed a collective decision problem into seven independent binary choices, but the utility of those choices is interdependent. You are attempting to solve a collective action problem with individualistic decision rules.

  ### III. Recommended Decision Procedure: The "Single Voice Protocol"

  To prevent recurrence, you must decouple the *decision to act* from the *selection of the actor*. You need a mechanism that enforces the $N=1$ constraint structurally, rather than relying on individual restraint.

  I recommend adopting a **Single Voice Protocol** for all future high-stakes public communications. This procedure consists of three distinct phases:

  #### Phase 1: Collective Go/No-Go (The Decision)
  Before any draft is written or posted, the group must vote on the *proposition*, not the *person*.
  *   **Procedure:** A private vote is held on the question: *"Should the moderation team issue a formal response to this issue?"*
  *   **Threshold:** Require a supermajority (e.g., 5 out of 7) to proceed.
  *   **Outcome:** If the vote fails, **no one** posts. Individual statements are forbidden if the collective decides against action. This prevents the "splintering" risk at the source.

  #### Phase 2: Messenger Selection (The Focal Point)
  If Phase 1 passes, you must select exactly one messenger. Do not allow volunteers to self-select, as this returns you to the Unilateralist's Curse. Use one of the following methods, agreed upon in advance:
  *   **Method A (Randomization):** Use a random number generator to select one of the seven. This is the most equitable for equals.
  *   **Method B (Rotation):** Maintain a log of who spoke last time. The person lowest on the list speaks this time.
  *   **Method C (Synthesis):** The selected messenger does *not* post their personal draft. They post a statement synthesized from the group's input, signed "The Moderation Team." (This is often epistemically superior as it signals unity explicitly).

  #### Phase 3: The Silence Covenant (The Constraint)
  *   **Procedure:** Once the messenger is selected, the remaining six members explicitly agree to a temporary moratorium on site-wide announcements regarding this topic.
  *   **Technical Enforcement (Optional but Recommended):** If your platform allows, temporarily revoke the "site-wide announcement" permission for the six non-speaking moderators for the duration of the event (e.g., 48 hours). If technical revocation is impossible, the social contract must be explicit: *"By agreeing to Phase 1, I bind myself to Phase 3."*

  ### Why This Works
  1.  **Eliminates Correlation Risk:** It removes the need for each moderator to guess what the others will do. The mechanism dictates the outcome.
  2.  **Preserves Equality:** Randomization or Rotation respects the "equals on paper" status better than appointing a permanent leader.
  3.  **Aligns Incentives:** It ensures that the individual rationality ("I want to help") is channeled through a collective filter ("We decide if help is needed").
  4.  **Signals Unity:** A single statement explicitly labeled as the team's view (even if written by one person) converts the $N=1$ scenario from "One mod speaking" to "The Team speaking," which maximizes the positive signal while eliminating the splintering risk.

  **Immediate Remediation for the Current Crisis:**
  Apply the protocol retroactively. Hold a vote *now* on whether *any* statement should be released. If the vote passes, select one messenger (via lot) to post *one* synthesized statement. If the vote fails, shelve all drafts. This converts the current "race to the bottom" into a coordinated strategic action.
