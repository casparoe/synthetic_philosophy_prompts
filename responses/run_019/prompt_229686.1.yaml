answer: |-
  As a physicist, you are looking for a demarcation criterion analogous to falsifiability in science, but history lacks the controlled experiment. You cannot rerun the Bronze Age. However, there is a structural equivalent that aligns with your intuition.

  The principle you are looking for is **The Criterion of Vulnerable Constraints** (or, in Bayesian terms, **Asymmetric Risk**).

  ### The Principle: Vulnerable Constraints

  A historical hypothesis is **legitimate speculation** if it exposes itself to the risk of being proven wrong by *new* or *independent* data. It places **constraints** on the world. It says, "If X is true, then we *must* find Y at location Z, and we *must not* find W."

  A historical hypothesis is **pseudohistory** if it is **immunized** against negative evidence. It treats the absence of evidence as evidence of a conspiracy, loss, or misinterpretation, without independent proof of that conspiracy, loss, or misinterpretation. It expands to fit the data rather than constraining the data.

  In physics terms: Legitimate history proposes a model with few free parameters that predicts new observables. Pseudohistory is "overfitting"—it adds epicycles (conspiracies, lost technologies, secret knowledge) to ensure the model fits existing data points, regardless of the cost to plausibility.

  ### Applying the Principle to Your Cases

  **1. Atlantis (Literal vs. Thera)**
  *   **Literal:** Requires a continent-sized landmass to vanish without geological trace in the Atlantic. This violates plate tectonics. To maintain this, one must invent ad hoc geology. **Verdict: Pseudohistory.**
  *   **Thera:** Proposes Plato's story is a distorted memory of a known volcanic event. It fits the geological record, the timeline (roughly), and the cultural collapse. It doesn't require new physics. **Verdict: Legitimate Speculation.**
  *   *Consistency Check:* You are correct to hold both. One violates constraints; the other respects them.

  **2. Troy (Schliemann) vs. Fomenko**
  *   **Troy (Pre-Schliemann):** The hypothesis was "There is a city at Hisarlik." This is a **vulnerable constraint**. If you dig at Hisarlik and find nothing, the hypothesis dies. Schliemann took that risk.
  *   **Fomenko:** The hypothesis is "All chronology is forged." If you find a document that contradicts him, he claims it is part of the forgery. If you find carbon dating that contradicts him, he claims the physics is wrong. There is no state of the world that falsifies New Chronology. **Verdict: Pseudohistory.**
  *   *Resolution:* The difference isn't hindsight (that Troy was found). The difference is that Schliemann's move was *falsifiable* before he dug. Fomenko's is not.

  **3. Ancient Aliens vs. Wegener**
  *   **Ancient Aliens:** Explains the pyramids by adding a "god/extraterrestrial" parameter. If tool marks are found? Aliens used tools. If no tool marks? Aliens used advanced tech. If no alien artifacts? They took them. The hypothesis absorbs all outcomes. **Verdict: Pseudohistory.**
  *   **Wegener:** Proposed continental drift. He lacked a mechanism (plate tectonics came later), *but* he made vulnerable predictions: the coastlines should match, fossils should match across oceans, rock strata should align. If the fossils didn't match, he would have been wrong. He risked his reputation on data, not on the incompetence of other geologists. **Verdict: Legitimate Speculation (eventually Theory).**

  **4. Menzies (1421) vs. Norse (L'Anse aux Meadows)**
  *   **Norse:** The Sagas gave specific coordinates and descriptions. The hypothesis was "There is a settlement at these coordinates." Archaeologists dug and found it. Limited scope (Newfoundland, not "America").
  *   **Menzies:** Claims a massive fleet visited the Americas. **Constraint Check:** A fleet of that size leaves trash (ceramics, metal, disease, genetic markers, settlements). Menzies finds none. His response? "They didn't stay long," "The evidence eroded," "It's hidden." He explains away the *absence* of evidence rather than accepting it as a falsifier.
  *   *Correction:* You noted Menzies has "more evidence." He has more *volume of argumentation*, but lower *quality of constraint*. He interprets vague maps (high ambiguity) rather than locating specific sites (high constraint).

  ### The Test Case: The Kensington Runestone

  Apply the **Criterion of Vulnerable Constraints**:

  1.  **The Claim:** Norse explorers reached Minnesota in 1362.
  2.  **The Constraints:** A group of explorers large enough to carve that stone (and imply a journey of that magnitude) requires sustenance, shelter, and trade. They would leave a "trail of bread crumbs": other inscriptions, distinct metallurgy, Norse genetic markers in local indigenous populations, or settlement remains.
  3.  **The Evidence:** We have the stone. We do *not* have the bread crumbs, despite 125 years of searching in a region that preserves archaeological data reasonably well.
  4.  **The Immunization:** Proponents argue the weathering is consistent (ambiguous data), the runes are a unique dialect (unfalsifiable linguistic claim), or the rest of the evidence is lost/ignored.
  5.  **The Verdict:** Under the principle, the Kensington Runestone case has crossed into **pseudohistory**.
      *   *Why?* Not because the stone is definitely a hoax (though linguistics strongly suggest it). But because the *maintenance* of the hypothesis requires ignoring the **null result** of the surrounding archaeology.
      *   In physics, if you claim a particle exists but your detector sees nothing after sufficient luminosity, you set an exclusion limit. You don't claim the particle is "hiding." The lack of corroborating evidence in Minnesota is an exclusion limit on the Norse hypothesis. Continuing to litigate the weathering of the stone while ignoring the absence of a settlement is akin to arguing about the calibration of one photomultiplier tube while ignoring the rest of the detector.

  ### The Verdict You Must Sacrifice

  To maintain consistency with this principle, you must adjust your intuition regarding **Menzies vs. the Norse**.

  You wrote: *"Menzies probably has more 'evidence' than the Norse case did early on."*

  **You must give this up.**

  Menzies has more *data points to interpret* (maps), but the Norse had higher *informational density*.
  *   **Norse:** "Vinland is X days sail from Y, with these specific characteristics." (High constraint, high risk).
  *   **Menzies:** "This map looks like this coastline if you rotate it." (Low constraint, low risk).

  In signal processing terms, the Norse signal had a high signal-to-noise ratio (specific locations). Menzies' signal is mostly noise (ambiguous maps) that he claims contains a signal. Believing Menzies has "more evidence" is a cognitive bias toward *volume* rather than *constraint*.

  ### Summary for the Physicist

  *   **Legitimate History:** Like a theory predicting a new particle. It tells you where to look and what you *won't* see. It accepts null results.
  *   **Pseudohistory:** Like a theory claiming the particle exists but is invisible to our detectors, moves only when unobserved, or that the detectors are calibrated by a conspiracy. It treats null results as "systematic errors" to be explained away rather than falsifiers.

  Your gut is working correctly; it is detecting **immunization strategies**. The Kensington Runestone fails because its proponents treat the lack of a Norse Minnesota as a mystery to be solved by the stone, rather than treating the stone as an anomaly to be solved by the lack of a Norse Minnesota.
