answer: |-
  Your intuitions map almost perfectly onto the **Pragmatic/Blame** hypothesis (your candidate C), specifically a version known in philosophy as the **Deep Self** or **Responsibility** view, refined by the **Knobe Effect**.

  Here is the breakdown of why this principle unifies your verdicts, which intuition must be sacrificed, and how it handles your new cases.

  ### The Unifying Principle: Norm-Sensitive Responsibility
  Your verdicts are not driven by a single static definition of "intentional" (like "foreseen + desired"), but by a flexible threshold for **attributing responsibility**. We use the word "intentional" as a tool to mark actions where it is fair to hold the agent accountable via reactive attitudes (blame or praise).

  *   **Cases 1 & 3 (Harm/Violation):** Because the outcomes are bad (environmental harm, policy violation), we want to blame the Chairman. To justify blame, we lower the bar for what counts as "intentional." Mere foresight + indifference is enough to cross the threshold.
  *   **Cases 2 & 4 (Help/Compliance):** Because the outcomes are good or neutral, we would need to *praise* the Chairman to call it intentional. We set the bar for praise much higher. Indifference does not clear the high bar required for credit, so it is "not intentional."
  *   **Case 5 (Skill vs. Luck):** This confirms the "control" aspect of responsibility. For the skilled archer, the outcome flows from her competence (high control), clearing the bar for credit. For the novice, the outcome is luck (low control). Even though she wanted it, the causal link is too weak to ground responsibility, so it is not intentional.
  *   **Case 6 (Rock/Wind):** This is a "deviant causal chain." Your feeling that it is "graded" is the system struggling to locate the threshold of sufficient control.

  ### Which Verdict Has to Go?
  Under this principle, **your suspicion in Case 6 that "intentional" is a graded notion must go.**

  The principle treats intentionality as **binary** (you are either responsible or you aren't), but the *threshold* for responsibility is context-sensitive. In Case 6, you are torn because the gust of wind weakens the causal link, potentially dropping it below the threshold required for blame, even if the desire was there. To maintain a coherent principle, you must decide whether the wind broke the chain of agency enough to absolve the kid. Most responsibility-based accounts argue it does: if the wind was the primary cause, the kid is negligent for throwing, but the *breaking of the window* was not intentional. You must accept a sharp (though sometimes hard-to-see) line rather than a gradient.

  ### Predictions for New Cases

  **1. The CEO and the Rival**
  *   *Scenario:* CEO indifferent to a side effect that harms nobody but slightly embarrasses a rival.
  *   *Analysis:* Does "embarrassment" carry negative normative weight? In a competitive business context, causing embarrassment is often seen as a minor norm violation (unprofessional or spiteful).
  *   *Prediction:* **Intentional.** Because the valence is negative (social harm/spite), the threshold for control lowers. The CEO's indifference + foresight is sufficient to attribute the embarrassment to their agency for the purpose of blame.

  **2. The Dog Owner and the Sandcastle**
  *   *Scenario:* Owner lets dog off leash knowing it will *probably* knock over a kid's sandcastle.
  *   *Analysis:* This is structurally identical to Case 1 (The Chairman). There is a foreseen negative outcome (property damage/harm to child's play), a norm violation (negligence/safety), and indifference.
  *   *Prediction:* **Intentional.** Even if the owner's *goal* was just exercise for the dog, the foreseen damage is attributed intentionally because the negative valence lowers the bar for responsibility. We want to blame the owner, so we say they intentionally destroyed the castle (or at least intentionally risked it, which often collapses into intentional damage in folk psychology).

  ### Conclusion
  Your intuitions are consistent with a view where "intentional" is a label we apply to outcomes we can fairly pin on an agent for the sake of moral judgment. The criteria for pinning it on shift depending on whether we are looking to blame (low bar) or praise (high bar).

  \answer{An outcome counts as intentional if the agent's will guided it sufficiently to warrant responsibility, where the required level of guidance lowers when the outcome violates a norm.}
