answer: |-
  The distinction you have identified is a central problem in contemporary meta-ethics and epistemology. The precise technical carving you are looking for is the distinction between **State-Given Reasons** and **Object-Given Reasons**.

  In the specific context of the "Fitting-Attitude Analysis of Value" (the admiration/demon case), this is famously known as the **Wrong Kind of Reasons (WKR) Problem**. However, "Wrong Kind of Reasons" is the name of the *problem* generated by confusing the two, whereas **State-Given Reasons** is the structural label for the class of considerations you described (reasons derived from the benefits of holding the attitude). In epistemology (the belief case), these are often called **Pragmatic Reasons** (contrasted with **Evidential Reasons**).

  Because you asked for a unified label across attitudes (belief, fear, admiration) that captures the *carving* (the boundary definition), **State-Given Reasons** is the most accurate technical term.

  ### The Carving: State-Given vs. Object-Given

  The boundary is defined by **what the reason cites as its grounds**.

  1.  **Object-Given Reasons (The "Right Kind"):**
      *   **Definition:** These reasons cite properties of the **object** of the attitude. They bear on whether the attitude is *correct*, *fitting*, or *true*.
      *   **Mechanism:** They make the attitude a successful response to the world.
      *   **Examples:**
          *   *Admiration:* The being is virtuous (property of the being).
          *   *Fear:* The spider is dangerous (property of the spider).
          *   *Belief:* There is evidence the proposition is true (property of the proposition/world).
      *   **Normative Force:** These reasons determine the *standard of correctness* for the attitude. If you lack object-given reasons, your attitude is unfitting, false, or irrational in a constitutive sense.

  2.  **State-Given Reasons (The Class You Identified):**
      *   **Definition:** These reasons cite properties of **having the attitude** (the state itself). They bear on whether it is *beneficial*, *prudent*, or *useful* to hold the attitude.
      *   **Mechanism:** They make the attitude instrumentally valuable to the holder, regardless of the object.
      *   **Examples:**
          *   *Admiration:* You will be tortured if you don't admire (consequence of the state).
          *   *Fear:* You will be paid to fear (consequence of the state).
          *   *Belief:* You will feel comforted if you believe (consequence of the state).
      *   **Normative Force:** These reasons determine the *prudence* or *utility* of the attitude. If you lack state-given reasons, holding the attitude might be pointless or costly, but not necessarily "incorrect" relative to the object.

  ### Is the Boundary the Same Across Attitudes?

  Structurally, **yes**. The distinction between reasons that target the *object* (correctness) and reasons that target the *state* (utility) applies uniformly to belief, emotion, and desire.

  However, there is a functional difference regarding **voluntarism** (control):
  *   **Emotions/Desires:** It is arguably possible (though difficult) to cultivate emotions or desires in response to state-given reasons (e.g., therapy to fear spiders less, or conditioning to admire a benefactor). The "ought" implies a potential "can."
  *   **Belief:** Belief is widely considered to be **transparent** or **involuntary** regarding state-given reasons. You cannot believe a proposition *simply* because it is useful (Pascal's Wager fails as a direct argument for belief because you cannot believe at will). As philosopher Pamela Hieronymi argues, belief "aims at truth." To believe $P$ for a pragmatic reason is to cease treating $P$ as a belief and treat it as a hope or assumption instead. Thus, while state-given reasons for belief exist, many argue they cannot be *reasons for which one believes* without corrupting the attitude into something else.

  ### Boundary Cases and Overlaps

  The boundary is clean in theory but contested in application. Three major areas of friction exist:

  1.  **Pragmatic Encroachment:**
      Some epistemologists argue that pragmatic stakes (state-given factors) can alter the threshold for knowledge (object-given status). For example, if the cost of being wrong is death, you might need *more* evidence to know a plane is safe than if the cost is mere inconvenience. Here, state-given factors influence the attribution of object-given status.

  2.  **Self-Fulfilling Attitudes:**
      If believing you will succeed causes you to succeed, the state-given reason (benefit of belief) creates an object-given reason (evidence of truth). This blurs the line, as the utility of the state generates truth-conducive properties.

  3.  **Moral Encroachment:**
      Similar to pragmatic encroachment, this suggests that moral risks (a state-given concern about the impact of holding a belief) can make a belief epistemically unjustified even with sufficient evidence. This challenges the idea that object-given reasons (evidence) are the *only* things that bear on correctness.

  ### Neighboring Concepts

  *   **Instrumental Reasons:** Usually applies to *actions*, not attitudes. While state-given reasons are instrumental regarding the *attitude*, "instrumental reason" typically denotes means-end reasoning for behavior.
  *   **Extrinsic Value:** Refers to the value of an object derived from its consequences. This is related but distinct; you are asking about reasons for *attitudes*, not the value of the *objects*.
  *   **Consequentialism:** A normative ethical theory. While state-given reasoning is consequentialist in structure (focus on outcomes of the state), one can be a consequentialist about ethics while maintaining that beliefs/emotions have non-consequentialist standards of correctness (fittingness/truth).

  ### Conclusion

  The class of considerations you described consists of reasons that make an attitude *advantageous to hold* without making it *correct to hold*. The established technical label for this class, which precisely captures the carving between properties of the state and properties of the object, is **State-Given Reasons**. In the specific context of meta-ethical value theory, they are the **Wrong Kind of Reasons**.

  \answer{State-Given Reasons}
