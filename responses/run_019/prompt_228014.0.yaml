prompt: |-
  So my reading group just finished a popular philosophy-of-technology book (won't name it, it's the one everyone was passing around last year) and we got stuck on its chapter about simulation arguments and longtermism. The author summarises Bostrom's argument like this, and I'd like to know how much of it I can repeat without embarrassing myself. Roughly: 'Bostrom showed that we are almost certainly living inside a computer simulation built by an advanced civilisation, because if any civilisation survives long enough to run ancestor-simulations it will run astronomical numbers of them, so simulated minds will vastly outnumber biological ones. This is excellent news for people who care about the far future: since we're probably in a simulation, the beings running it are presumably watching us and can be influenced by our behaviour, which multiplies the leverage our actions have. On the other hand, longtermist projects like spreading life to the stars lose most of their expected value, because a simulation is likely to be switched off before its inhabitants reach that scale, so the trillions of future people longtermists worry about will probably never exist. Either way, the argument deflates the fanatical expected-value reasoning that says we should sacrifice everything now for tiny chances of affecting huge future populations.'

  The chapter's tone bugged me — it presents all of this as if it's one package you have to accept or reject wholesale, and I suspect several of the steps are doing more work than advertised. Could you go through the summary claim by claim and tell me what someone who actually works on this stuff would accept, what they'd qualify, and what's a misrepresentation of Bostrom's actual argument? I'm particularly unsure about: whether the original argument even concludes that we're probably simulated (I have a vague memory it's structured as a disjunction, but the book treats the disjunction as a technicality); whether substrate-independence is just assumed or argued for; and whether the move from 'simulations might be switched off' to 'longtermism loses most of its expected value' is something Bostrom himself endorses or a leap the author makes. Also, on the fanaticism point — is discounting future value because of simulation risk the same kind of move as the usual anti-fanaticism moves (bounded utilities, risk aversion, etc.), or is something different going on?

  Please be honest about the epistemic state of play here: separate what's genuinely settled (e.g. what Bostrom's paper actually says) from what's live philosophical dispute (whether ancestor-simulations are feasible, whether simulated minds matter morally, whether any of this should shift longtermist priorities), and don't present a contested position as the consensus. And write it in British English please.
