  (1) "The tier list"
  Top Tier: Mechanism, Oppression-olympics, Home-turf. These prioritize analytical rigor and ethical consistency. Middle Tier: Concept-stretching, Lesson, Survivor-prerogative. These offer useful guardrails but risk limiting inquiry or privileging specific voices excessively. Bottom Tier: Uniqueness, Arithmetic. These function as conversation-stoppers that prevent learning. The top tier focuses on *how* and *why* we compare, whereas the bottom tier focuses on *what* is compared or forbids quantification entirely. Effective memory work requires tools that enable prevention.

  (2) "Why each one landed there"
  Top tier filters work because they govern intent and methodology rather than identity. Mechanism focuses on structural prevention rather than suffering competition, making it analytically productive for stopping future violence highly effectively. Oppression-olympics directly targets the ethical harm of ranking victims for political capital instead of building solidarity. It prevents hypocritical moralizing from undermining the comparison. Home-turf ensures intellectual honesty by forcing scholars to confront their own nation's culpability before judging others. Middle tier filters offer guardrails that sometimes snap under pressure. Concept-stretching protects terminology integrity but can be used defensively by states to exclude valid cases from scrutiny. It risks becoming a legalistic loophole for denialism. Lesson demands utility but risks instrumentalizing tragedy solely for future gain rather than honoring historical truth. It may overlook the value of remembrance without immediate policy application. Survivor-prerogative respects victim agency but inadvertently silences necessary outsider advocacy and broader comparative scholarship. It creates epistemic silos that hinder universal human rights frameworks. Bottom tier filters collapse under scrutiny because they forbid comparison outright. Uniqueness sacralizes one event to the point where comparative learning becomes impossible or blasphemous, hindering prevention. Arithmetic rejects data entirely, ignoring that quantification is often necessary for legal accountability and resource allocation. It denies the reality of scale in mass violence. These two stop conversation rather than guiding it ethically. The top tier enables responsible work; the bottom tier prevents work entirely. Ultimately, the ranking prioritizes filters that ask "why compare?" over those asking "who compares?" or "what is compared?" The top tier demands ethical consistency and structural analysis. The middle tier relies on subjective boundaries of language and authority. The bottom tier relies on metaphysical claims or data denial that undermine historical rigor. This structure ensures the memo argues for comparison as a tool for justice, not just remembrance.

  (3) "The hardest call"
  I was tempted to elevate Survivor-prerogative to the top tier because it centers victim agency, which is morally compelling. However, I held it in the middle because granting exclusive comparative authority to survivors risks fragmenting historical understanding into isolated silos. If only Armenians can compare the Armenian Genocide, cross-cultural solidarity becomes impossible. It protects dignity but hinders the universal lessons required for prevention. Therefore, keeping it middle acknowledges its ethical weight in the end without letting it veto necessary scholarly inquiry.

  (4) "One-sentence position"
  Legitimate comparison must analyze structural mechanisms to build solidarity, not rank suffering for political capital or shield specific histories from scrutiny. Ethical memory requires universal yardsticks applied consistently across all cases of mass violence.
