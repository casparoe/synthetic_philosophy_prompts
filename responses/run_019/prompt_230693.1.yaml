          *   Yes, it risks being a "no true Scotsman" defense. But it might be the *correct* characterization of the principle.
      *   **Settled vs. Contested:**
          *   *Settled:* Bertrand's paradox shows different parametrizations yield different probabilities.
          *   *Contested:* Whether Jaynes' solution is unique, whether MaxEnt supersedes PoI, whether "objective" priors are possible.

  6.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Jaynes:* I must be careful not to say Jaynes "solved" it definitively. Many philosophers of probability think Jaynes just pushed the problem back. The user is right to be skeptical. The defeater is that *sometimes* the symmetry group is physically mandated (e.g., rotation invariance of a circle), making the prior unique *for that physical setup*.
      *   *Underdetermination:* The user says PoI is underdetermined *until* you pick a description. The counter is that the *physical problem* picks the description, not the agent.
