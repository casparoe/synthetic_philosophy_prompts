  2.  **Deconstruct the Philosophy/Cognitive Science Intersection:**
      *   The core tension is between *empirical generalization* (finding commonalities) and *hypothesis generation* (abduction/inference to the best explanation).
      *   Bongard problems are perfect for this because they force the solver to look at *relations* and *context*, not just object properties, and crucially, the negative examples are constitutive of the meaning, not just a test set.
