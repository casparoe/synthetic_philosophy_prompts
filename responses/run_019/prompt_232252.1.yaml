answer: |-
  ### 1. Order of Ideas and Dependency Structure

  The seminar must follow a specific phenomenological arc: the students must experience the failure of their intuitive method before you offer the corrective framework. Do not begin with a lecture on induction. Begin with the activity.

  *   **Phase 1: The Naive Induction (Minutes 0–30).**
      *   **Action:** Present *only* the six positive examples of your carrying problem. Hide the negatives.
      *   **Goal:** Elicit the "Common Feature" hypothesis. Students will naturally list properties shared by the six boxes (e.g., "They all have curves," "They all have two shapes").
      *   **Dependency:** You cannot explain the constitutive role of negative examples until they have committed to a rule based solely on positives. Let them write their proposed rule down.
  *   **Phase 2: The Wrecking (Minutes 30–60).**
      *   **Action:** Reveal the six negative examples.
      *   **Goal:** Force the collapse of the Phase 1 rules. Ask students to check their written rules against the new panel. Most will find their rule applies to at least one negative box, or fails to cover one positive box they ignored.
      *   **Dependency:** The "Underdetermination Problem" (that finite data cannot logically guarantee a unique rule) must *not* be introduced here as a abstract logical point. It must be introduced as the *explanation for their failure*. Only after they feel the frustration of a rule being "wrecked" do you explain *why* it was wrecked: because the positives alone were compatible with multiple conflicting rules.
  *   **Phase 3: The Constraint (Minutes 60–90).**
      *   **Action:** Guide them to reformulate the rule using the negatives as boundaries, not tests.
      *   **Goal:** Shift the definition of a concept from "what is shared" to "what distinguishes."
      *   **Dependency:** You can only discuss "Simplicity" as a heuristic (rather than a truth-maker) once they have generated two rival rules that both fit the data.
  *   **Phase 4: The Abstraction (Minutes 90–120).**
      *   **Action:** Generalize from the Bongard problem to cognitive science and philosophy.
      *   **Goal:** Connect the specific puzzle to the general problem of induction.
      *   **Dependency:** This generalization is only valid once they have grasped the specific mechanics of the Bongard solution.

  ### 2. The Carrying Example

  You need a problem where the rule is relational, not property-based, and where the negative examples are engineered to kill specific, obvious wrong hypotheses.

  **The Rule:** *"One geometric shape is fully contained within another."*

  **The Positive Panel (Left):**
  1.  A small circle inside a large square.
  2.  A small triangle inside a large circle.
  3.  A small square inside a large triangle.
  4.  A dot inside a ring (two shapes, one inside the other).
  5.  A complex polygon inside a circle.
  6.  **Crucial Positive:** Three shapes nested (A inside B inside C). *Purpose: To kill the rule "There are exactly two shapes."*

  **The Negative Panel (Right):**
  1.  A small circle *next to* a large square. *Purpose: To kill the rule "There are two shapes of different sizes."*
  2.  A small triangle *overlapping* the boundary of a large circle (intersecting, not contained). *Purpose: To kill the rule "The shapes touch or are close."*
  3.  A small square *outside* a large triangle.
  4.  **Crucial Negative:** A "C" shape with a dot inside the opening, but not enclosed. *Purpose: To kill the rule "One shape is surrounded by another." (It is surrounded but not contained/closed).*
  5.  A single solid shape. *Purpose: To kill the rule "There is no white space."*
  6.  Two identical circles side-by-side. *Purpose: To kill the rule "The shapes must be different types."*

  **Design Account:**
  *   **What it must do:** It must force the solver to define "Containment" (topology) rather than "Proximity" (geometry).
  *   **What it must avoid:** It must not rely on color or specific shape names (e.g., "Always involves a circle"), as that encourages feature-tabulation.
  *   **Negative Construction:** Notice that Negative #2 (Overlapping) and Negative #4 (Open C-shape) are not merely "non-examples." They are *near-misses*. They are designed to look like positives to someone who has formulated a lazy rule (e.g., "One shape is inside the area of another"). They actively destroy the "Almost Right" hypotheses.

  ### 3. Misconception Map

  Here is how to intercept the four specific misconceptions in the order they will arise.

  **1. Misconception: "The concept is just the common features."**
  *   **When:** Phase 1 (Positives Only).
  *   **How to Head It Off:** When a student proposes a rule based on shared features (e.g., "They all have a black outline"), do not say it is wrong. Instead, ask: "Is that feature *sufficient*?" Then, move immediately to Phase 2. When the negatives are revealed, point to a negative box that *also* has a black outline. Say: "The feature is present, but the concept is absent. Therefore, the concept cannot be the feature."

  **2. Misconception: "One more positive example would settle which of two rival rules is correct."**
  *   **When:** Phase 3 (Reformulation).
  *   **How to Head It Off:** Students will argue, "If we saw a seventh box, we'd know." Interrupt this. Draw a hypothetical Box 7 on the board. Ask them to propose two different rules that *both* fit Boxes 1–7. Show that no matter how many positives you add, a contrary rule can always be constructed (Goodman's "Grue" logic). Emphasize that *contrast* (negatives) reduces the hypothesis space more efficiently than *accumulation* (positives).

  **3. Misconception: "The right rule is whichever is simplest."**
  *   **When:** Phase 3 (Comparing Rivals).
  *   **How to Head It Off:** Two students will propose different rules that both fit all 12 boxes (e.g., "Contained" vs. "No boundary lines cross"). Acknowledge both fit. When they appeal to simplicity to choose the winner, challenge them: "Simpler for whom? Simpler to describe, or simpler to compute?" Refuse to validate simplicity as a truth-condition. Frame it as a *pragmatic bias* of the human mind, not a logical guarantee of the correct concept.

  **4. Misconception: "The negatives are only a check on a rule one has already formed."**
  *   **When:** Phase 2 (The Wrecking) transitioning to Phase 3.
  *   **How to Head It Off:** This is the core pivot. After their initial rules fail, ask: "Could you have formed the correct rule without seeing the right-hand panel?" When they admit they couldn't (or would have guessed wrong), state clearly: "The negatives did not check your work; they *defined* the work. Without the negatives, the concept does not exist." Make them rewrite their rule using the language of exclusion (e.g., "X is true *provided* Y does not happen").

  ### 4. Assessment: Checking the Relation

  Do not ask "What is the rule?" This only tests if they solved the puzzle. To test if they understand the *relation between examples and concepts*, use a **Generation Task**.

  **The Task:**
  Ask the students to draw a **single new box** that satisfies the following condition:
  *"This box must fit the rule you discovered, but it must be designed to trick someone who holds the second-most plausible wrong rule."*

  **Why this works:**
  *   If they merely found a pattern, they cannot intentionally trick a rival hypothesis.
  *   To succeed, they must hold the correct rule and the rejected wrong rule in mind simultaneously.
  *   It demonstrates they understand the *boundary conditions* of the concept, not just the central tendency.
  *   **Evaluation Criterion:** Accept their solution only if they can explain *which* wrong rule their drawing falsifies.

  ### 5. Open Questions: What to Decline to Settle

  At the end of the seminar, explicitly refuse to answer the following two questions. Explain that leaving them open is necessary for the lesson to hold.

  **1. "Are all human concepts Bongard-style rules?"**
  *   **Why leave it open:** If you assert "Yes," you ignore prototype theory, family resemblance, and embodied cognition. If you assert "No," you undermine the seminar's generalizability.
  *   **Pedagogical Value:** By leaving it open, you position the Bongard problem as a *model* of logical induction, not a complete *theory* of psychology. It invites students to investigate where the model breaks down (e.g., in fuzzy concepts like "game" or "chair") without invalidating the logical point about underdetermination.

  **2. "Is the rule 'in' the images, or is it projected by the mind?"**
  *   **Why leave it open:** This is the Realism vs. Constructivism debate.
  *   **Pedagogical Value:** If you settle this, you turn a cognitive science seminar into a metaphysics lecture. By leaving it open, you keep the focus on the *process* of discovery (the movement from example to concept) rather than the *ontology* of the concept. It reinforces the lesson that the *method* of validation (positives + negatives) is what we can study, even if the status of the rule remains mysterious.

  **Closing Instruction:** Tell the students: "We have learned how to validate a rule. We have not learned where rules come from, or if they are real. That is your homework for the rest of your careers."
