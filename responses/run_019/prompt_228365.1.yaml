          *   If B is Lewd, B wants *someone* to read.
          *   If A is Prude, A wants *no one* to read.
          *   The conflict arises because they care about the *other's* action.
          *   Let's use the profile I just derived ($x \succ y \succ z$ and $y \succ z \succ x$) because it *mathematically guarantees the cycle*. I will explain the "story" in the debrief.
          *   Story:
              *   $x$: Neither reads.
              *   $y$: A reads.
              *   $z$: B reads.
              *   A (Prude): $x \succ y \succ z$. (Hates reading, but if someone must, prefers self).
              *   B (Lewd/Matchmaker): $y \succ z \succ x$. (Wants A to read most, then self, then no one).
              *   Rights: A decides $\{x, y\}$. B decides $\{z, x\}$.
              *   This works.

      *   *Wait, one more check:*
      *   A on $\{x, y\}$: Prefers $x \succ y$. Social $x \succ y$.
      *   B on $\{z, x\}$: Prefers $z \succ x$. Social $z \succ x$. (Wait, B's pref is $y \succ z \succ x$. So yes, $z \succ x$).
      *   Pareto on $\{y, z\}$: A prefers $y \succ z$. B prefers $y \succ z$. Social $y \succ z$.
      *   Cycle: $x \succ y \succ z \succ x$.
      *   Okay, this is the one. I will use this profile.

      *   *Materials:*
          *   Cards for A, B, C, D.
          *   C and D must match the Pareto condition.
          *   Pareto is on $\{y, z\}$ (A reads vs B reads).
          *   Everyone must prefer $y \succ z$.
          *   A: $x \succ y \succ z$. (Matches).
          *   B: $y \succ z \succ x$. (Matches).
          *   C: $y \succ z \succ x$ (or $y \succ x \succ z$, as long as $y \succ z$).
          *   D: $y \succ z \succ x$.
      *   Okay, ready to write.
