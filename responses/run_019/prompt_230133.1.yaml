answer: |-
  You have described a phenomenon that is currently causing quite a stir in both the philosophy of technology and human-computer interaction circles. You need not apologise for the question; it is precise, observant, and touches on a critical issue in modern engineering.

  There is no single, universally agreed-upon word for this, but there are three concepts that, when layered together, describe exactly what you are experiencing.

  ### 1. The General Shape: The Irony of Automation
  The broader pattern you described—where individually sensible reliance on a tool leads to a collective loss of ability—is best captured by a concept from human factors engineering called **The Irony of Automation**.

  Coined by the psychologist Lisanne Bainbridge in 1983 (long before AI, regarding industrial control systems), it states: *The more advanced a control system is, the more crucial the contribution of the human operator.*

  The irony is that we automate tasks to reduce human error and workload, but by doing so, we degrade the very skills the human needs to intervene when the automation fails or encounters an edge case. In your team's case, the AI handles the "control" (writing the code), and the humans handle the "monitoring" (reviewing the checklist). When the system breaks in a way the tests don't catch, the humans no longer possess the mental model required to fix it.

  In psychology, the resulting loss of skill is often termed **Cognitive Atrophy**. It is the same mechanism as the "satnav effect" (sometimes called **spatial disorientation** due to GPS reliance). You are correct that the shape is identical; the destination is simply different (a codebase rather than a city).

  ### 2. The Specific Coding Version: Epistemic Debt
  For the specific situation where a team loses understanding of an artefact they produced, there is no legacy term, because this is a novel problem. However, the most fitting term emerging in software philosophy is **Epistemic Debt**.

  You are likely familiar with *technical debt*: the implied cost of additional rework caused by choosing an easy solution now instead of a better approach that would take longer. **Epistemic Debt** is the knowledge equivalent.

  *   **Technical Debt:** "We know this code is messy, and we will pay for it later in refactoring time."
  *   **Epistemic Debt:** "We do not *know* why this code works, and we will pay for it later in investigation time."

  When the AI writes the diff and the tests pass, you have paid down the *technical* cost (the code works) but accrued *epistemic* debt (no one understands the rationale). Unlike technical debt, which is often visible in the code structure, epistemic debt is invisible until you try to modify the system and realise the mental map is missing.

  ### 3. Where is the line? (The Compiler Question)
  This is the crux of the matter. Why is relying on a compiler acceptable, but relying on an AI assistant dangerous? The distinction lies in **Determinism vs. Probabilistic Agency**.

  **Compilers are Transducers of Intent**
  When you write code in a high-level language, you are making every logical decision. The compiler's job is purely translational. It takes your explicit logic and converts it into machine code. It is deterministic. If the output is wrong, the error is necessarily in your input. You retain **semantic ownership** of the system. You do not need to understand the machine code because you understand the logic that *produced* it.

  **AI Assistants are Generators of Intent**
  When an AI writes a diff, it is not merely translating your logic; it is making micro-decisions about design, structure, and implementation that were previously yours. It is probabilistic. It suggests *a* way to solve the problem, not necessarily *your* way.
  *   **The Compiler:** You say "Sort this list," it sorts it. You know *why* it's sorted (because you asked).
  *   **The AI:** You say "Fix this bug," it rewrites the function. You know *that* it works (tests pass), but you may not know *how* or *why* it chose that specific implementation.

  The line is drawn at **Design Rationale**.
  *   **Ordinary Tool Use:** The tool executes your design rationale (e.g., a hammer, a compiler, a library function).
  *   **The Phenomenon You Describe:** The tool *supplies* the design rationale, and you validate only the output.

  When you use a library, you trust the API contract. When you use AI, you are trusting the *reasoning* behind the implementation. Because the reasoning is hidden inside the model (and often inside the prompt of a developer who has since left), the rationale is lost.

  ### Summary
  If you need to name this in a report or a conversation with management, I would suggest this formulation:

  > "We are accruing **Epistemic Debt** due to **Automation Complacency**. While the AI increases velocity, it is causing **Cognitive Atrophy** within the team. Unlike compilers, which translate our intent, the AI is generating intent. We are losing ownership of the design rationale, leaving us unable to maintain the system when the tool fails or the context changes."

  ### A Note on Mitigation
  Since you are looking for precision, you might also wonder if this is inevitable. It is not, but it requires changing the workflow. Teams that avoid this tend to treat the AI as a "pair programmer" rather than a "code generator." This means:
  1.  **No PRs without a human-written summary of *intent*.** (Not just what changed, but why).
  2.  **The "Explain" Rule.** If a developer merges an AI-generated block they cannot explain verbally to a colleague, it is not considered "done."
  3.  **Rotating Ownership.** Ensuring that the "mental map" is shared, not siloed in the prompts of the person who wrote the original feature.

  You have identified a genuine risk. It is not Luddism to notice that a muscle is shrinking; it is merely anatomy.
