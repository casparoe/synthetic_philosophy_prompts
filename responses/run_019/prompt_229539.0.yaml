  3. On the right dose of an opioid, someone says the pain is still there and still intense but they don't mind it. I'd say its much less bad, maybe not bad at all.
  4. Phantom limb pain is bad even though there's no tissue damage.
  5. Painful effort in a workout, or labor pain someone welcomes as useful, feels less bad than the same intensity unwanted — but still bad.
  6. Chronic dull pain that someone has long adapted to still seems like a cost, even if their life is fine overall.

  My old view — that pain's badness is just felt intensity over time — is clearly wrong, but I can't say what replaces it. Is it the aversion, the dislike, the felt threat, the motivational pull? What does your principle say about the case I keep going back and forth on: under an amnestic, a patient groans and grimaces through what she later calls searing pain, but afterward has no memory of it and her mood is fine — was it bad for her while it lasted? And where do you put the cortex-damage patients: pain without suffering, or should we say 'pain' is ambiguous?
