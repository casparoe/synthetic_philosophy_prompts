  *(Refining the "Rule Killer")*: Is it Independence? Yes. Premise-based is the most popular alternative to Majority, and it fails Independence. Distance-based fails Independence. Sequential Priority rules fail Independence. Basically, any rule that guarantees Consistency on a connected agenda *must* violate Independence (unless it's a dictatorship). So Independence is the filter.

