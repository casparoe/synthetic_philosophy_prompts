answer: |-
  # The Hacking Loop Vetting Protocol (HLVP)

  **Purpose:** To rapidly distinguish genuine Hackingian looping effects from labeling theory, generic social construction, or mere historical contingency in manuscripts invoking "interactive kinds."
  **Constraints:** Runnable in <60 minutes; requires no external empirical verification; relies solely on textual evidence.
  **User:** Philosopher (no clinical training required).

  ---

  ## Part I: The Procedure

  ### Test 1: The Ontological Screen (Interactive vs. Indifferent Kinds)
  *Addresses Distinction (a)*

  **Question:** Does the manuscript explicitly identify the classified entity as capable of representing itself, knowing how it is classified, or altering its behavior in response to that knowledge?
  *   **Sufficient Answer (Pass):** The text specifies that the classified subjects are human agents (or institutions acting as agents) who have access to the classification label and can act on it.
      *   *Example Pass:* "Patients diagnosed with PTSD read the DSM criteria and adjust their narrative memory to fit the trauma model."
      *   *Example Fail:* "The classification of *Helicobacter pylori* changed medical practice, which changed bacterial prevalence." (Bacteria do not know they are classified).
  *   **Action on Failure:** **STOP.** Verdict: "This is not a looping-effect claim. Recommend the author redescribe it as downward causation, medicalization, or indifferent kind classification."

  ### Test 2: The Return Path (Feedback vs. Downward Causation)
  *Addresses Distinction (b) and (d)*

  **Question:** Does the manuscript describe a causal pathway where the *response of the classified people* forces a change in the *classification scheme or diagnostic practice*, rather than just the label changing the people?
  *   **Sufficient Answer (Pass):** The text identifies a specific mechanism where the altered behavior/self-conception of the classified group creates a problem, anomaly, or new regularity that the classifiers *must* accommodate.
      *   *Example Pass:* "Because autistic adults began masking symptoms after reading popular literature, clinicians could no longer rely on eye-contact metrics, forcing a revision of the diagnostic algorithm."
      *   *Example Fail:* "Because the label 'schizophrenic' carries stigma, patients suffer worse employment outcomes and increased isolation." (This is labeling theory/downward causation; the classification scheme itself does not change in response).
  *   **Action on Failure:** **STOP.** Verdict: "The loop is asserted but not shown; this is labeling theory. Treat as a promissory note only if the author commits to demonstrating the return path in empirical work."

  ### Test 3: The Mechanism of Revision (Interaction vs. Interest)
  *Addresses Distinction (c)*

  **Question:** Is the change in the classification scheme attributed to the *behavioral reality* of the interactive kind, or to *political/interest-driven pressure*?
  *   **Sufficient Answer (Pass):** The revision is described as a response to the *unmanageability* or *new properties* of the classified group, even if advocacy is present. The science/practice shifts because the *people* shifted.
      *   *Example Pass:* "Advocacy groups demonstrated that the existing criteria excluded women, but the criteria were only revised when longitudinal data showed the behavioral profile of women differed systematically from the male-derived model."
      *   *Example Fail:* "The criteria were expanded because the patient advocacy group lobbied the committee effectively, securing insurance coverage for more people." (This is social construction/politics, not looping. The people didn't change; the rules did due to power).
  *   **Action on Failure:** **DOWNGRADE.** Verdict: "This is generic social construction or historical contingency. The claim may be valid, but it is not Hackingian looping. Recommend the author cite Foucault or sociological institutionalism instead."

  ### Test 4: The Completeness Check (Two-Sided Change)
  *Addresses Distinction (d)*

  **Question:** Does the manuscript document change on *both* sides of the interface (the classified and the classifiers) over a specified temporal span?
  *   **Sufficient Answer (Pass):** The text provides evidence of Time 1 (Classification A + People A) → Interaction → Time 2 (Classification B + People B).
      *   *Example Pass:* "In the 1990s, 'multiple personality' was rare and dramatic; by the 2000s, 'DID' was common and internal, prompting the DSM-5 to rename and re-criterion the disorder."
      *   *Example Fail:* "The classification of homosexuality changed from disorder to normalcy." (Documents change in scheme, but does not link it to a change in the *behavior* of homosexuals that forced the change).
  *   **Action on Failure:** **HANDOFF.** Reason: "The question cannot be settled procedurally." A manuscript might describe a "half-loop" (e.g., people change, but the text doesn't track the scheme). This requires referee judgment on whether the missing half is implied or genuinely absent.

  ---

  ## Part II: Hypothetical Runs

  ### Submission 1: The TikTok/ADD Loop
  *Claim:* Short-video platforms carrying first-person symptom accounts of ADHD have created a loop. Viewers reinterpret histories through symptom lists, present to clinicians already scripted, clinicians anchor on the presentation, and diagnostic practice drifts toward the platform's picture.

  *   **Test 1 (Ontology):** **PASS.** Subjects are viewers/patients capable of accessing and interpreting classifications.
  *   **Test 2 (Return Path):** **PASS.** Text specifies: Viewers change presentation (scripted) → Clinicians change practice (anchor on presentation) → Diagnostic practice drifts. The people's response modifies the practice.
  *   **Test 3 (Mechanism):** **PASS.** The change in practice is driven by the *clinical interaction* (anchoring on scripted presentation), not explicitly stated as political lobbying. The "reality" of the clinical encounter shifted.
  *   **Test 4 (Completeness):** **PASS.** Describes shift in people (reinterpretation) and scheme (practice drift).
  *   **Verdict:** **Proceed to Full Review.** This fits the Hackingian model.

  ### Submission 2: The Stigma/Prognosis Loop
  *Claim:* Classifying a condition as a mental disorder loops because the stigma of the label worsens the prognosis of those labeled.

  *   **Test 1 (Ontology):** **PASS.** Humans are the classified kind.
  *   **Test 2 (Return Path):** **FAIL.**
      *   *Analysis:* The manuscript describes Label → Stigma → Worse Prognosis. This is downward causation. There is no description of the worsened prognosis forcing a *change in the classification scheme*. The label stays the same; the outcome gets worse.
      *   *Action:* **STOP.**
  *   **Verdict:** **Not a looping-effect claim.** Recommend the author redescribe this as "labeling theory" or "self-fulfilling prophecy."

  ### Submission 3: The Criteria Expansion/Lobbying Loop
  *Claim:* The expansion of a diagnosis's criteria over three decades was a looping effect. The sole documented mechanism is lobbying by an organized patient advocacy group and the corresponding committee decisions.

  *   **Test 1 (Ontology):** **PASS.** Patients are the interactive kind.
  *   **Test 2 (Return Path):** **PASS (Technically).** The classified group (via advocates) caused a change in the classification scheme.
  *   **Test 3 (Mechanism):** **FAIL.**
      *   *Analysis:* The text explicitly states the mechanism is *lobbying* and *committee decisions*. There is no mention of the patients' *behavior or self-conception* changing in a way that made the old criteria scientifically or practically unworkable. The change was political/normative, not interaction-driven.
      *   *Action:* **DOWNGRADE.**
  *   **Verdict:** **Generic Social Construction.** The claim is valid as history/sociology, but it misuses "looping." Cite sociological institutionalism, not Hacking.

  ---

  ## Part III: The Discomfort Analysis

  **The Discomfort:** Submission 3 (Lobbying) produces a verdict I suspect you will dislike. You may instinctively feel that *any* situation where the classified group influences the classification counts as looping. If patients organize and change the DSM, isn't that a loop? The procedure rejects this, categorizing it as "Social Construction."

  **Diagnosis:** The discomfort points to a **defect in your instinct** (and that of many in the field), not the procedure.

  **Reasoning:** Hacking's specific contribution was not merely that "people influence categories." That is trivial sociology. His point was that the *scientific object itself* becomes unstable because the *properties of the people* change.
  In Submission 3, if the criteria expand solely because of *power* (lobbying), the "kind" did not loop; the *politics* moved. The people did not necessarily become different kinds of people; they just secured different rules.
  *   *True Looping:* Patients start behaving differently (e.g., "masking"), making the old test fail, forcing scientists to invent a new test.
  *   *Social Construction:* Patients demand coverage, politicians/committees grant it.
  By conflating these, we lose the explanatory power of looping. The procedure correctly forces the distinction. If you accept Submission 3 as looping, "looping" becomes synonymous with "history," and the concept dissolves. The procedure saves the concept from inflation.

  ---

  ## Part IV: Sacrifices and Limitations

  ### 1. Sacrifices for Runnability
  To make this procedure executable in one hour without empirical work, I have sacrificed the following nuances. Be aware of the resulting error risks:

  *   **Sacrifice:** *Unconscious Looping.*
      *   *Detail:* Hacking allows that people may change without conscious intent (e.g., institutional routines shifting behavior).
      *   *Risk:* **False Fails.** Test 1 asks if the entity is "capable of representing itself." A manuscript describing subtle, unconscious behavioral drift in response to institutional classification might fail this test if it doesn't explicitly argue for agency, even if it describes a valid loop.
  *   **Sacrifice:** *The "Lag" Problem.*
      *   *Detail:* Loops often take decades. A manuscript might describe the *start* of a loop (people changing) before the scheme has officially updated.
      *   *Risk:* **False Fails.** Test 4 requires change on *both* sides. A cutting-edge paper predicting an imminent loop (People changed, Scheme *will* change) will fail, even if the analysis is profound.
  *   **Sacrifice:** *Institutional Agency.*
      *   *Detail:* Sometimes the "people" who loop are not patients but the clinicians themselves changing their own practice in response to their own categories.
      *   *Risk:* **False Fails.** Test 1 focuses on the "classified." If the paper argues clinicians are the interactive kind (classifying themselves), the procedure might flag it as an ontology error.

  ### 2. What This Procedure Cannot Do
  No checklist can replace referee judgment. You must take the decision back in the following cases:

  *   **Empirical Verification:** The procedure checks for *claims* of mechanism, not *truth*. A manuscript can pass all tests by fabricating a plausible-sounding mechanism. You must still judge the empirical plausibility of the described feedback loop.
  *   **Normative Evaluation:** The procedure cannot tell you if the loop is *good* or *bad*. A manuscript might describe a vicious looping effect (e.g., criminal profiling creating more criminals) that passes all tests. The procedure validates the *structure*, not the *ethics*.
  *   **The "Silent" Loop:** The procedure will systematically mishandle manuscripts that argue for looping effects where the classified subjects are *unable* to articulate the change (e.g., young children, non-verbal populations, or deeply oppressed groups where resistance is invisible). Test 1 requires a capacity for representation that may exclude valid cases of structural interaction.
  *   **Conceptual Innovation:** If an author is intentionally stretching Hacking's concept to new domains (e.g., algorithmic classification of non-humans that behave interactively), this procedure will reject it as a category error. That is a feature for vetting standard claims, but a bug for evaluating theoretical innovation.

  **Final Instruction:** Use this protocol to clear the "low-hanging fruit" of misuse. For manuscripts that pass, you must still read deeply to assess the *quality* of the loop described. For manuscripts that fail, you may still recommend acceptance if the author agrees to reframe the theoretical apparatus as suggested in the verdicts.
