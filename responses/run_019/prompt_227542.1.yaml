answer: |-
  ### The Two Systems

  **System A (The Accidental Archive)**
  On a prebiotic tidal flat, a specific clay mineral catalyzes the polymerization of ambient organic monomers into chains. The sequence of monomers is determined by random thermal fluctuations and local concentration gradients; physically, different monomers could have bound at each position with nearly equal probability, making the sequence-to-structure mapping highly contingent (arbitrary). By sheer luck, one such polymer folds into a shape that shields the clay surface from acidic erosion, preserving the substrate that holds it. The system exhibits a robust correlation between sequence and protective output, and it is currently useful, but it has no mechanism for replication and zero history of selection; the utility is a one-off cosmic accident.

  **System B (The Chemical Imperative)**
  Deep in a hydrothermal vent, a self-replicating peptide aggregate persists. The sequence of amino acids dictates the fold and catalytic function entirely through direct electrostatic and steric necessity; a lysine at position 4 *must* attract a glutamate at position 12 to close the replication loop, governed by immutable laws of chemistry. There is no translation layer or lookup table; the tokens physically force the output. Variants that fold more efficiently replicate faster, creating a deep history of natural selection where tokens are retained specifically because of their functional output, yet the mapping from token to effect is chemically inevitable, not contingent.

  ***

  ### The Three Verdicts

  **1. The Deflationary View (Correlation + Usefulness)**
  *   **System A:** **CODE.** The view requires only that tokens correlate with outputs and that the arrangement serves a function. System A has both: the sequence correlates with the fold, and the fold protects the clay. The lack of history is irrelevant; the current instrumental value suffices.
  *   **System B:** **CODE.** Tokens correlate with outputs, and the system is demonstrably useful for survival. The chemical necessity of the mapping doesn't negate the correlation or the utility.
  *   **Verdict Profile:** {A: Yes, B: Yes}

  **2. The Arbitrariness View (Contingent Mapping)**
  *   **System A:** **CODE.** The defining feature of a code is that the relationship between sign and meaning is not physically forced. In System A, the monomer placement is contingent; the physics allowed for other sequences that would have produced different (or no) structures. This "could-have-been-otherwise" quality marks it as symbolic.
  *   **System B:** **NOT A CODE.** The mapping is causally rigid. Given the physics, the sequence *cannot* produce a different output. It is a causal chain, like a key fitting a lock, not a code. A key is not a "message" to the lock; it is a physical trigger.
  *   **Verdict Profile:** {A: Yes, B: No}

  **3. The Selected Effect View (Etiological Function)**
  *   **System A:** **NOT A CODE.** A code requires that the tokens exist *because* they produce the output. In System A, the tokens exist due to random noise. The utility is incidental. Without a history of selection filtering tokens for their semantic content, there is no "aboutness," only physical causation.
  *   **System B:** **CODE.** The tokens are present specifically because they produced the survival-enhancing output in the past. The system maintains the mapping through an etiological feedback loop. The "meaning" of the sequence is grounded in its selected consequence.
  *   **Verdict Profile:** {A: No, B: Yes}

  ***

  ### The Analysis

  **The Feature Doing the Philosophical Work**
  The wedge driving these verdicts apart is **Etiology vs. Structure**. The Deflationist looks at the *current state* (is it useful?), the Arbitrariness theorist looks at the *modal structure* (could it have been otherwise?), and the Selected Effect theorist looks at the *history* (why is it here?). Your debate with your friend stalls because DNA possesses all three features simultaneously. This thought experiment breaks the "golden triangle" of DNA to show that "Code" is not a single natural kind, but a cluster concept that fractures when history, utility, and contingency come apart.

  **The Variation: Granting System A Selection**
  If you grant System A a selection history (e.g., the clay-polymer complex begins to replicate based on that protective fold):
  *   **Deflationary:** Stays **Yes** (Utility remains).
  *   **Arbitrariness:** Stays **Yes** (Mapping remains contingent).
  *   **Selected Effect:** Flips to **Yes**.
  *   **Result:** All three views converge. This demonstrates that the *only* reason the Selected Effect view rejected System A initially was the lack of history. It confirms that for the Selected Effect theorist, history is the necessary and sufficient condition, whereas for the Deflationist, it is irrelevant.

  **The Deflationist's Counter-Attack**
  Your friend would not accept the Arbitrariness verdict on System B. She would argue that **"Arbitrariness" is a ghost.** In a deterministic universe, nothing "could have been otherwise" except relative to an observer's expectations. She would claim that distinguishing System A's "contingent" chemistry from System B's "necessary" chemistry is a difference of degree, not kind. Both are just causal chains where physical state X leads to physical state Y. She would argue that calling A a "code" and B a "mechanism" is smuggling in a human perspective on what counts as "conventional." For her, if the Deflationary view says both are codes (or both are just causal correlations), then the Arbitrariness view is chasing a metaphysical illusion. She wins by dissolving the distinction entirely: DNA isn't *literally* a code, it's just a causal molecule that we find convenient to describe using information theory.
