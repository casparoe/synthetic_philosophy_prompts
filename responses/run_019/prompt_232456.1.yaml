answer: |-
  The committee recommends removing the pure time preference component entirely for the appraisal of the coastal flood-defence programme, setting this parameter to zero. This decision rests on the ethical principle that the welfare of future citizens should not be discounted simply because they exist later in time, as temporal location is morally arbitrary. For a project with benefits accruing over two centuries, applying a positive pure time preference would effectively render the welfare of generations beyond 2100 negligible in today's calculations, undermining the fundamental purpose of long-term infrastructure planning. We acknowledge the opposing view that a positive rate reflects observed market behaviour and prevents an open-ended sequence of future people from collectively outweighing the present, potentially paralysing current investment. However, descriptive validity regarding current market impatience is inappropriate for normative intergenerational ethics, and the risk of unlimited obligation is already mitigated by the consumption growth component of the discount rate. By discounting future consumption based on expected increases in per-capita wealth, we account for the diminishing marginal utility of income without ethically penalising future lives for being born later. Analysts must therefore apply the Ramsey rule with a pure time preference of zero, utilising the central forecast for per-capita consumption growth to determine the final social discount rate for this appraisal.
