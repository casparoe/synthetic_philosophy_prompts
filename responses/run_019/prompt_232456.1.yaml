          *   Address the Losing Side (Positive PTP): The argument about observed behavior and the "tyranny of the future" (infinite claims on present resources).
          *   Rebuttal/Mitigation: Growth discounting still handles the weighting. If future generations are richer, marginal utility is lower, so we discount *consumption*, not *well-being*. This avoids the tyranny issue without discriminating based on time itself.
          *   Specific Context: 200-year horizon makes standard PTP devastating to the project's viability, potentially ignoring catastrophic risks.
