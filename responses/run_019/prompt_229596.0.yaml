answer: |-
  **Course:** PHIL 405: Free Will and Criminal Responsibility  
  **Exam:** Final Take-Home Essay  
  **Time Allowed:** 90 Minutes  
  **Word Limit:** 1,000–1,200 words  

  ***

  ### Essay Question

  Gregg Caruso argues that without "basic desert"—grounded in a form of ultimate responsibility incompatible with determinism—retributive punishment is morally illegitimate, necessitating a shift to a forward-looking public health model. Daniel Dennett counters that a compatibilist notion of responsibility, grounded in competence and avoidability, sustains a robust notion of desert that justifies retributive practices. 

  Critically evaluate Dennett's response to Caruso. Specifically, locate the precise point at which their definitions of "responsibility" diverge. Does Dennett successfully secure a backward-looking notion of desert that is distinct from consequentialist justification, or is his position vulnerable to Caruso's charge that it is merely a relabeling of forward-looking considerations? Defend a position on whether this distinction is morally significant for the justification of punishment.

  ***

  ### Model Answer

  **Title:** The Function of Blame: Metaphysics or Pragmatics?

  The debate between Gregg Caruso and Daniel Dennett is not merely a disagreement about the existence of free will; it is a conflict over the justificatory architecture of the criminal justice system. To adjudicate whether Dennett's compatibilism offers a genuine middle ground or merely a semantic shield for consequentialism, one must isolate the precise locus of their divergence: the criteria for *agency*. Caruso demands a metaphysical origin of action (ultimate responsibility), while Dennett demands a functional capacity for control (competence). I will argue that while Dennett successfully identifies a pragmatic necessity for holding agents responsible, he fails to secure "desert" in the backward-looking sense Caruso requires. Consequently, Dennett's position is indeed a relabeling of forward-looking considerations, but this does not necessarily vindicate Caruso's conclusion that the system must look exactly like a quarantine model.

  Caruso's position rests on the "Basic Desert" principle. For Caruso, an agent deserves punishment only if they are the ultimate source of their action in a way that transcends causal determination. Because luck (constitutive and circumstantial) permeates all action, no one is ultimately responsible. Therefore, inflicting suffering for the sake of "payback" is morally analogous to punishing a victim of a natural disaster. The only permissible justification for incapacitation is forward-looking: preventing future harm, akin to quarantining a carrier of a disease. This view treats the criminal as a vector of risk rather than a moral agent who has incurred a debt.

  Dennett resists this by dissolving the requirement for ultimate responsibility. He argues that the "elbow room" required for responsibility is not metaphysical indeterminism but the capacity to respond to reasons and the threat of sanctions. For Dennett, an agent is responsible if they are competent enough to understand the rules and could have done otherwise *if* they had chosen to. This "avoidability" is sufficient to ground desert. Dennett insists that holding people responsible is a social technology that creates the very agency Caruso claims is missing. By treating agents as responsible, we make them responsible.

  The crux of the debate lies in whether Dennett's "desert" is truly backward-looking. Caruso charges that Dennett's justification is covertly consequentialist: we hold people responsible *because* doing so produces better social outcomes (deterrence, norm reinforcement), not because they metaphysically deserve it. Dennett attempts to resist this by claiming that the desert claim is intrinsic to the practice, not just an instrumental add-on. However, upon closer inspection, Dennett's defense collapses into the forward-looking model. When Dennett argues that we should punish because it sustains the "market of reasons," he is justifying the punishment by its future utility (maintaining a society of competent agents), not by the past act's moral weight. If the agent were incompetent (e.g., severe psychosis), Dennett would exempt them, not because they lack "sin," but because punishment would cease to be an effective tool for modulation. This reveals that the "desert" is contingent on the utility of the practice.

  Therefore, Caruso is correct that Dennett's notion is a relabeling of forward-looking considerations. Dennett offers a "desert" that is compatible with determinism only by stripping it of the retributive "sting" that Caruso finds objectionable. However, this does not mean Caruso wins the policy debate entirely. Even if Dennett's desert is pragmatic, the *experience* of being held responsible matters. A public health model that treats criminals solely as disease vectors risks dehumanization and ignores the normative agency that Dennett highlights. While the *justification* may be forward-looking (as Caruso insists), the *practice* must retain the structure of retribution (as Dennett insists) to respect the citizen's status as a reason-responder.

  In conclusion, Dennett does not save basic desert; he transforms it into a social tool. Caruso is right that this is not the metaphysical desert required for traditional retributivism. However, Dennett is right that abandoning the language of desert entirely undermines the moral standing of the offender. The morally significant distinction is not whether desert is metaphysically ultimate, but whether the justice system treats the offender as a participant in a normative community or merely as an object of management. Dennett's "relabeling" is philosophically honest about the utility of responsibility, even if it fails to meet Caruso's metaphysical strictures.

  ***

  ### Marking Scheme (Total 25 Marks)

  **1. Identification of the Divergence Point (5 Marks)**  
  *   **Requirement:** The candidate must explicitly identify that the split occurs over the definition of agency/control: Caruso requires *Ultimate Responsibility* (metaphysical sourcehood), while Dennett requires *Competence/Avoidability* (reasons-responsiveness within a causal chain).  
  *   **Common Miss:** Candidates often describe them as "pessimist vs. optimist" without pinpointing the specific criterion of control that separates them.

  **2. Explication of Caruso's "Basic Desert" (5 Marks)**  
  *   **Requirement:** The candidate must explain that for Caruso, "desert" is inextricably linked to the ability to have done otherwise in a deep, indeterministic sense, and that without this, punishment is merely inflicting harm on a lucky/unlucky causal product.  
  *   **Common Miss:** Students frequently reduce Caruso's view to "no free will" without explaining the specific link between *basic desert* and the *immorality* of retribution.

  **3. Explication of Dennett's Functional Desert (5 Marks)**  
  *   **Requirement:** The candidate must articulate Dennett's view that responsibility is a social status conferred upon competent agents to modulate behavior, and that "could have done otherwise" is analyzed as "could have done otherwise if prompted by reasons/sanctions."  
  *   **Common Miss:** Candidates often attribute standard libertarian free will to Dennett or fail to mention the "social technology" aspect of his theory.

  **4. Adjudication of the "Relabeling" Charge (5 Marks)**  
  *   **Requirement:** The candidate must directly answer whether Dennett's desert is backward-looking or forward-looking. Top marks require arguing that Dennett's justification ultimately rests on the *utility* of the practice (forward-looking), validating Caruso's charge, even if Dennett denies it.  
  *   **Common Miss:** Students often sit on the fence, saying "both have points," without analyzing whether Dennett's desert collapses into consequentialism.

  **5. Normative Significance of the Distinction (5 Marks)**  
  *   **Requirement:** The candidate must defend a position on whether it *matters* morally if Dennett is just relabeling. (e.g., Does the *language* of desert protect rights even if the *justification* is utilitarian? Or is Caruso right that we must drop the pretense?)  
  *   **Common Miss:** Candidates typically conclude the essay after analyzing the metaphysics, failing to address the practical/moral implication for the criminal justice system requested in the prompt.
