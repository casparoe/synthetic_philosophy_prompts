      *   *Thesis:* Dennett's position is stable *only if* one accepts that the function of responsibility practices constitutes their justification. However, Caruso is right that this strips "desert" of its traditional retributive force, making it a pragmatic tool rather than a moral truth. To earn top marks, the student must argue whether this pragmatic shift matters morally.
      *   *Structure:*
          1.  Define the divergence (Ultimate Responsibility vs. Competence).
          2.  Analyze Dennett's "desert" (is it backward-looking?).
          3.  Analyze Caruso's critique (it's forward-looking utility).
          4.  Adjudicate: Does the label matter? (The "sting" of punishment).
          5.  Conclusion: Defend a position on whether Dennett saves retributivism or merely sanitizes it.

  5.  **Developing the Marking Scheme:**
      *   Need 5 specific points (5 marks each).
      *   *Point 1:* Identification of the "Ultimate Responsibility" vs. "Competence/Avoidability" split.
      *   *Point 2:* Explanation of Caruso's "Basic Desert" requirement and why determinism kills it.
      *   *Point 3:* Explanation of Dennett's move: Desert as a functional tool for reasons-responsiveness.
      *   *Point 4:* The Crux: Analyzing whether Dennett's desert is truly backward-looking or covertly forward-looking (the relabeling charge).
      *   *Point 5:* Normative Adjudication: Taking a stance on whether the distinction changes the moral permissibility of punishment (e.g., does the *experience* of retribution matter if the *justification* is utilitarian?).
