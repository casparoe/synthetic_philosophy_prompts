      *   *Draft:* "Caruso charges that Dennett's compatibilist justification for punishment is merely consequentialism in disguise. Evaluate this charge. Does Dennett successfully secure a backward-looking notion of desert, or does his appeal to social utility collapse into the very forward-looking model Caruso advocates?"
      *   *Polishing:* Make it more precise about the "exact point they part company."
      *   *Final Version:* Focus on the "justificatory work" Dennett claims desert does.

  4.  **Developing the Model Answer:**
