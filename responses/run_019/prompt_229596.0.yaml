      *   *Dennett:* "Ultimate Responsibility" is a coherence trap (an impossible standard). We should use a pragmatic, compatibilist notion of responsibility based on competence, reasons-responsiveness, and avoidability. This supports a notion of "desert" that isn't metaphysical magic but is robust enough to justify retributive emotions and practices *because* they serve a vital social function (modulating behavior, affirming values).
      *   *The Crux:* Is Dennett's "desert" actually *desert* (backward-looking, based on the act itself), or is it secretly *consequentialist* (forward-looking, based on the utility of holding responsible)? Caruso says it's the latter disguised as the former. Dennett says the distinction is false; the utility *constitutes* the justification for the desert claim.

  3.  **Drafting the Question:**
