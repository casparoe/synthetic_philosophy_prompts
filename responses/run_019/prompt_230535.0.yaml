      1.  **The 'Simulated Longtermism' Objection:** (Most Damaging). Even in a sim, the future can be vast.
      2.  **The 'Base Reality Anchor' Objection:** (Most Likely). Why does $P(\text{Sim})$ reduce EV enough?
      3.  **The 'Risk Aversion in Disguise' Objection:** (Philosopher's Trap). Normative challenge.
