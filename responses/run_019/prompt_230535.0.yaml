      *   *The Audience's Core Belief:* $E[\text{Value of Far Future}]$ is astronomically high. Even tiny probabilities of influencing it dominate near-term goods (Pascal's Wager style). They think SA is irrelevant because base reality still exists and has astronomical value, or because SA probabilities are negligible.
