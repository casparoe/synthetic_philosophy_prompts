answer: |-
  # The Futarchy Lab: A 90-Minute Governance Simulation

  ## 1. The Setup
  **The Decision:** The format of today's in-class quiz.
  *   **Policy A (Individual):** Students take a 10-question logic quiz alone.
  *   **Policy B (Pairs):** Students take the same quiz in pre-assigned pairs (one answer sheet per pair).

  **The Metric (To Be Voted On):** The class must first vote on what outcome dimension defines "success."
  *   *Option 1:* **Total Utility:** Sum of all points scored by the class (Max possible: 200).
  *   *Option 2:* **Equity:** The score of the lowest-scoring individual/pair (Max possible: 10).
  *   *Option 3:* **Excellence:** Number of perfect scores (10/10).

  **The Stakes:**
  *   **Policy Consequence:** If the realized metric exceeds a threshold (e.g., Total Score > 150), the class earns **10 minutes of early dismissal next week**. If not, class runs the full time.
  *   **Market Consequence:** Students trade "FutaBucks" (paper tokens). The top 3 portfolio holders at the end receive a **Homework Pass** (valid for one minor assignment later in the term).

  **Materials Needed:**
  *   200 "FutaBuck" tokens (paper slips, 10 per student).
  *   Whiteboard divided into two sections: "Market A (Individual)" and "Market B (Pairs)".
  *   Two colored markers (e.g., Green for Bids, Red for Asks).
  *   The Quiz (10 multiple-choice logic questions, answer key ready).
  *   Handout: "Trader's Log" (simple sheet to record trades).

  ---

  ## 2. The Rules (Script for Instructor)
  *Do not mention Hanson, Futarchy, prediction markets, or information aggregation yet.*

  **Minute 0-5: Introduction**
  "Welcome. Today, this class will govern itself regarding the quiz we are about to take. We will use a specific procedure.
  1.  **Values:** You will vote on what metric defines a 'good' outcome.
  2.  **Beliefs:** You will trade tokens in two markets that forecast that metric under two different policies.
  3.  **Decision:** The policy with the higher forecasted value will be adopted.
  4.  **Reality:** We will enact the policy, take the quiz, and settle the accounts.
  Your goal is to maximize your FutaBuck balance. The top three balances win a Homework Pass. The class goal is to maximize the metric you voted for to earn early dismissal next week."

  **Minute 5-15: The Values Vote**
  "First, we must decide what counts as success. Here are three options [write on board]. Discuss for 3 minutes. We will vote by show of hands. Majority rules."
  *   *Instructor Note:* Tally the vote. Circle the chosen metric. This is the **Objective Function**.

  **Minute 15-45: The Prediction Markets**
  "You each have 100 FutaBucks. There are two markets: **Individual** and **Pairs**.
  *   **The Asset:** A 'Share' in a market.
  *   **The Payoff:** At the end of class, a Share in the **Chosen Policy** will pay out $1 for every point the Class achieves on the Chosen Metric. (e.g., If Metric is Total Score and class gets 160, one share is worth $160).
  *   **The Cost:** Shares trade at market price. Current starting price is $50 per share.
  *   **The Uncancelled Policy:** Shares in the policy *not* chosen will be refunded at face value ($50) to prevent penalizing you for a counterfactual.
  *   **Trading:** I will open the order book on the whiteboard. Write your Name, Action (Buy/Sell), Quantity, and Price. I will match trades. We will do three rounds of 10 minutes."

  *   *Instructor Note:* Act as the Market Maker. If no trades happen, post a bid/ask yourself to seed liquidity. Announce the "Current Market Price" (average of last trade) every 5 minutes.

  **Minute 45-50: Decision & Freeze**
  "Trading closed. Calculate the average price of the last trade in Market A and Market B.
  *   Market A Price = Expected Metric if Individual.
  *   Market B Price = Expected Metric if Pairs.
  Whichever is higher is now the law. We will proceed with that policy."

  **Minute 50-70: Implementation (The Quiz)**
  Distribute the quiz according to the winning policy.
  *   *If Individual:* Desks apart, silence.
  *   *If Pairs:* Group them, allow whispering.
  *   Collect quizzes. Project the Answer Key. Students grade their own (or swap) to generate the Realized Metric immediately.

  **Minute 70-80: Settlement**
  1.  **Class Reward:** Announce if the Metric threshold was met (Early Dismissal next week? Yes/No).
  2.  **Market Reward:** Calculate the value of shares in the *Chosen Policy* based on the *Actual Metric*.
      *   *Example:* Policy A won. Price was $60. Actual Score was 160. Share Value = $160. Profit = $100 per share.
      *   Policy B shares are refunded at $50 (no profit, no loss).
  3.  Count FutaBucks. Announce the Top 3 Traders. Award Homework Passes.

  **Minute 80-90: The Debrief (The Lecture)**
  *Now* you introduce the vocabulary. (See Section 4 below).

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Instructor Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Read script. Distribute tokens. No theory. |
  | **05-15** | **Values Vote** | Facilitate debate on Metric. Hold vote. Record winner. |
  | **15-25** | **Trading Round 1** | Open Order Book. Seed prices at $50. Encourage trading. |
  | **25-35** | **Trading Round 2** | Announce Round 1 clearing prices. Allow re-trading. |
  | **35-45** | **Trading Round 3** | Final adjustments. Freeze markets. |
  | **45-50** | **Decision** | Compare prices. Declare Winning Policy. |
  | **50-65** | **The Quiz** | Administer quiz under Winning Policy rules. |
  | **65-70** | **Grading** | Project key. Tally scores publicly. Calculate Metric. |
  | **70-80** | **Settlement** | Pay out FutaBucks. Award Homework Passes. |
  | **80-90** | **Debrief** | Connect experience to Futarchy theory. |

  ---

  ## 4. The Debrief: Mapping Experience to Theory
  *Do not lecture until this section. Use Socratic questioning to draw the concepts out of them.*

  **1. Separation of Values and Beliefs**
  *   *Ask:* "In the first 10 minutes, we voted on the Metric. Later, you traded on the Price. Did anyone want Policy A (Values) but trade on Market B (Beliefs) because they thought it would score higher?"
  *   *Concept:* **The Hanson Separation.** Futarchy argues we should vote on *what we want* (Utility Function) but bet on *what is true* (Conditional Expectations).
  *   *Point:* If you traded based on what you *wanted* rather than what you *knew*, you likely lost money. The market punishes preference masquerading as information.

  **2. Information Aggregation**
  *   *Ask:* "Look at the price movement from Round 1 to Round 3. Did the price change? Why?"
  *   *Concept:* **Hayekian Knowledge.** The price moved because someone knew something (e.g., "I'm bad at logic," or "Pairs reduce careless errors").
  *   *Point:* The final price contained more information than any single student's guess. That is the argument for using markets over voting for epistemic tasks.

  **3. The Failure Points (Crucial)**
  *   *Ask:* "Was the market liquid? Did anyone feel they couldn't trade?" (Thin Markets).
  *   *Ask:* "Did anyone try to manipulate the price to force a policy they preferred, even if it cost them FutaBucks?" (Sabotage/Preference Trading).
  *   *Ask:* "If we had chosen 'Number of Perfect Scores' as the metric, could you have gamed that?" (Goodhart's Law).
  *   *Point:* Futarchy fails if markets are too thin to price risk, if stakes aren't high enough to suppress preference trading, or if the metric is easily gamable.

  ---

  ## 5. What Will Predictably Go Wrong (And How to Handle It)

  **1. Thin Markets / No Trading**
  *   *The Problem:* Students are shy. The board stays empty. Prices stay at $50.
  *   *Why:* Fear of looking stupid or losing "fake" money.
  *   *The Fix:* **Seed the Book.** Before class, write a few fake orders on the board ("Prof: Buy 10 @ $45"). This gives them a counterparty. During Round 1, verbally prompt: "Who thinks Pairs will score higher than 50? That's a cheap buy."

  **2. Preference Trading (Betting on Wants, Not Beliefs)**
  *   *The Problem:* A student wants "Pairs" because it's easier socially, so they buy Market B shares even if they know "Individual" yields higher scores.
  *   *Why:* The stakes (Homework Pass) might be lower than the utility of an easier quiz.
  *   *The Fix:* **Call it out in Debrief.** This is the #1 critique of futarchy. Ask the student: "Did you maximize your FutaBucks?" If not, explain that in a real futarchy, this behavior subsidizes informed traders, but it distorts the policy signal.

  **3. Metric Gaming (Goodhart's Law)**
  *   *The Problem:* During the Values Vote, a coalition votes for "Number of Perfect Scores" instead of "Total Score."
  *   *Why:* It's easier to manipulate (one smart student does all the work in pairs).
  *   *The Fix:* **Allow it, then Analyze it.** If they choose a gamable metric, let them. In the debrief, reveal how the policy choice would have differed. This teaches that **Constitutional Design** (choosing the metric) is harder than **Governance** (choosing the policy).

  **4. The "Dominant Trader" (One Econ Major)**
  *   *The Problem:* One student understands the mechanism instantly and buys all the shares, cornering the market.
  *   *Why:* Asymmetric knowledge about market mechanics.
  *   *The Fix:* **Position Limits.** In the rules, state: "No student may hold more than 20 shares in a single market." This forces information dispersion.

  **5. The "Counterfactual Resentment"**
  *   *The Problem:* Policy A wins. Students who bet on Policy B feel cheated because they can't win big, even if they were right that B would have been good.
  *   *Why:* Futarchy requires losing bets on unchosen policies to be refunded (or settled on a synthetic outcome), which feels unsatisfying.
  *   *The Fix:* **Explain the Refund Rule Clearly.** Emphasize that in real futarchy, unchosen policies are *not* tested, so we cannot know if you were right. We refund to ensure you aren't punished for the democracy's choice, but you don't profit because the value wasn't realized.

  ---

  ## 6. Limitations: What This Exercise Cannot Reproduce
  *Be frank about this in the final 5 minutes.*

  1.  **Repeated Play:** This is a one-off. Real futarchy relies on reputation and repeated trading to weed out noise traders. In this game, luck plays a larger role.
  2.  **Metric Stability:** In a polity, changing the metric (GDP, Happiness) is a constitutional crisis. Here, they voted on it in 10 minutes. The *stickiness* of the metric is a feature, not a bug, of real futarchy.
  3.  **Skin in the Game:** A Homework Pass is not a lost war or economic depression. The emotional weight of "Belief" vs. "Preference" is lighter here. Students may treat it as a game rather than governance.
  4.  **Liquidity:** 20 students is not a market. Real futarchy requires deep liquidity to absorb large bets without slippage. Here, one student can move the price 10%.

  ## 7. Instructor Checklist
  *   [ ] **Quiz:** 10 Logic Questions (Print 20 copies).
  *   [ ] **Answer Key:** Projected on slide.
  *   [ ] **Tokens:** 200 Paper Slips (Mark them "FB").
  *   [ ] **Whiteboard:** Drawn with "Market A" and "Market B" columns.
  *   [ ] **Prizes:** 3 Homework Passes (written on cardstock) + Candy backup.
  *   [ ] **Timer:** Visible to class (keep pace).

  This design forces the students to inhabit the mechanism before they understand the theory, ensuring the debrief lands with the weight of lived experience rather than abstract critique.
