  "Alternative Principles"
  An **Absolute Prohibition** argues torture violates human dignity inherently. This saves Case 2, 3, 4, and 5 easily, but forces you to overturn Case 1, accepting the bomb explodes. It offers clarity but demands high sacrifice. Conversely, **Pure Expected Utility** calculates net suffering saved. This saves Case 1 and potentially Case 2 (if the daughter's pain is less than the bomb's), but forces you to overturn Case 2 (if utility dictates) and Case 3 (unless punishment deters). It also dismisses your Case 5 intuition; if the interrogators acted on good evidence, the outcome doesn't change the act's rightness. Neither captures your nuanced liability view, but Absolute Prohibition is the strongest rival to your current stance. Utilitarianism fails to respect your intuition about the daughter's innocence.

