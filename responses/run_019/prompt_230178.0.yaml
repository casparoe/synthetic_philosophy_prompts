prompt: |-
  Two friends of mine definately got into it at a dinner party. A third friend, Nick, had spent the evening lecturing Priya about pirating textbooks — calling it stealing from authors — even though Nick torrents movies and series constantly. One friend said Nick's criticism was true but he had no standing to blame her: you can't demand a standard from others while exempting yourself from it, so Priya was entitled to wave the whole thing off. The other said that's just the tu quoque fallacy — a true criticism doesn't become false because the messenger is a hypocrite, and if Nick's arguments are sound, Priya should answer them. The first replied: no one's saying the criticism becomes false, but blame isn't just a truth-claim — it's a demand issued from one person to another, and the demand loses its force when the issuer applies the norm selectively. The second came back that this makes blame sound more like etiquette than ethics — what matters is whether Priya wronged the authors, not who happens to say so — and anyway, a habitual pirate might be *better* placed to see through the self-serving rationalizations. Neither would budge, and I honestly couldn't referee it. Can you go through the exchange move by move and say who's right about what, and, if you had to, which side is more right overall?
