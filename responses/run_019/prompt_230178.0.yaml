answer: |-
  This is a fantastic dispute because it isn't just a dinner party squabble; it is a live debate in contemporary moral philosophy. Your friends are inadvertently arguing about the distinction between **moral truth** (is the act wrong?) and **moral standing** (who is allowed to hold me accountable?).

  Here is the move-by-move breakdown of who is right about what, followed by a verdict on who wins the overall argument.

  ### Move 1: The Opening Salvo
  *   **Friend 1:** Nick has no standing to blame Priya because he is a hypocrite.
  *   **Friend 2:** That is the *tu quoque* fallacy. A true criticism doesn't become false because the messenger is a hypocrite.

  **Who is right about what?**
  *   **Friend 2 is right on Logic:** Strictly logically, Friend 2 is correct. The proposition "Pirating textbooks is morally equivalent to stealing" is either true or false regardless of Nick's behavior. If Nick torrents movies, that does not magically make Priya's textbook piracy permissible. To think otherwise is indeed the *tu quoque* (appeal to hypocrisy) fallacy.
  *   **Friend 1 is right on Authority:** However, Friend 1 is not arguing about the *truth* of the proposition; they are arguing about Nick's *authority* to enforce it. In moral philosophy, "standing" is a real concept. You generally lose the standing to blame others for violations of a norm you openly flout yourself.

  **Score:** Draw. Friend 2 wins on formal logic; Friend 1 wins on social/moral dynamics.

  ### Move 2: The Nature of Blame
  *   **Friend 1:** Blame isn't just a truth-claim; it's a demand issued from one person to another. The demand loses force when the issuer applies the norm selectively.
  *   **Friend 2:** (Implicitly) The truth of the matter demands an answer regardless of the issuer.

  **Who is right about what?**
  *   **Friend 1 is right on the Nature of Blame:** This is the strongest philosophical move in the exchange. Blame is not merely a statement of fact (like "It is raining"); it is a **speech act** (like "I promise" or "I sentence you"). For a speech act to work, it needs "felicity conditions." One of those conditions is standing. If a speeder pulls you over and tickets you for speeding, the ticket is invalid because they lack the authority. Similarly, when Nick blames Priya, he is implicitly claiming, "I uphold this norm, and you have violated our mutual agreement to uphold it." By violating it himself, he breaks that mutual agreement.
  *   **Friend 2 is right on Moral Reality:** Friend 2 is correct that the *wrongness* of the act persists. Priya is still accountable to the authors, to the law, and to morality in general. She cannot wave off the *fact* that she is doing something Nick claims is wrong.

  **Score:** Friend 1 takes this round. They correctly identified that the argument is about the *interaction*, not the *act*. Friend 1 explicitly conceded the point Friend 2 was hung up on ("no one's saying the criticism becomes false"), which shows a more nuanced understanding of the dispute.

  ### Move 3: Etiquette vs. Ethics
  *   **Friend 2:** This makes blame sound like etiquette rather than ethics. What matters is whether Priya wronged the authors. Also, a habitual pirate might be better placed to see through rationalizations.
  *   **Friend 1:** (Implicitly) The selective application undermines the norm itself in this context.

  **Who is right about what?**
  *   **Friend 2 is right on "Ethics":** Friend 2 is correct that morality is not merely etiquette. If murder were wrong, a murderer could still truthfully tell someone else not to murder. The moral weight of the act (wronging the authors) exists independently of Nick.
  *   **Friend 2 is right on "Insight":** The point about the "habitual pirate" is strong. Sometimes, people within a culture (even a deviant one) understand the rationalizations better than outsiders. Nick might be lecturing from a place of self-righteousness rather than genuine ethical inquiry.
  *   **Friend 1 is right on "Force":** However, Friend 1's point remains: even if the ethics are real, Nick's *specific demand* has lost its force. Priya can rightly say, "You are in no position to demand this of me," without necessarily saying, "Piracy is good."

  **Score:** Friend 2 makes a good point about the independence of moral truth, but Friend 1 maintains the stronger position on the specific issue of *interpersonal blame*.

  ---

  ### The Verdict: Who is more right overall?

  If I had to referee this, **Friend 1 is more right overall.**

  Here is why: Friend 2 is fighting the battle of **Propositional Truth**, while Friend 1 is fighting the battle of **Moral Standing**. In the context of a dinner party argument (an interpersonal conflict), Standing is the relevant metric.

  Friend 2 is stuck on the idea that if Nick is right, Priya *must* listen. But human morality is relational. We hold each other accountable within a web of mutual expectations. When Nick torrents movies but polices Priya's textbooks, he is treating the moral norm as a weapon to be used against others rather than a commitment he shares. This is the definition of losing moral standing.

  Friend 1 correctly identifies that Priya is entitled to "wave the whole thing off" **in relation to Nick.** She is not entitled to ignore the ethics of piracy in general, but she is entirely justified in rejecting Nick's specific moralizing. To accept Nick's blame would be to accept a hierarchy where he is the judge and she is the defendant, despite them being co-conspirators in the same behavior.

  **The nuance Friend 2 misses:**
  Friend 2 worries that Friend 1's view reduces ethics to etiquette ("who happens to say so"). But standing isn't about etiquette; it's about **integrity**. A demand for moral compliance carries weight only when backed by the complier's own compliance. Without that, it's not ethics; it's power.

  **The nuance Friend 1 should acknowledge:**
  Friend 1 should concede that while Priya can dismiss *Nick*, she shouldn't necessarily dismiss the *argument*. She can say, "Nick, you have no standing to lecture me," but she should still ask herself, "Is pirating textbooks actually wrong?"

  **Final Ruling:**
  Friend 1 wins because they correctly diagnosed the social and moral function of blame. Friend 2 is logically correct but pragmatically tone-deaf. Nick is a hypocrite, his standing is forfeited, and Priya is well within her rights to tell him to sit down—even if she is still technically in the wrong about the textbooks.
