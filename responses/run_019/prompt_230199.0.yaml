answer: |-
  # Handout: Navigating the Ravens Paradox

  ### The Trilemma
  Hempel's Paradox arises from three claims that seem plausible individually but contradict each other when taken together. To solve the paradox, you must reject or modify at least one.

  1.  **The Instance Condition:** Observing a positive instance (e.g., a black raven) confirms a universal generalization (e.g., "All ravens are black").
  2.  **The Equivalence Condition:** Whatever confirms a hypothesis confirms any logically equivalent hypothesis to the same degree. (Note: "All ravens are black" is logically equivalent to "All non-black things are non-ravens.")
  3.  **The Intuitive Judgment:** Observing a white shoe (a non-black non-raven) does **not** confirm "All ravens are black."

  ### The Decision Tree
  Follow the path that matches your judgments on these concrete cases.

  **1. Does spotting a black raven count as evidence for the claim "All ravens are black"?**
  *   **No:** Go to **Leaf A** (Radical Skepticism).
  *   **Yes:** Go to Question 2.

  **2. Does spotting a white shoe count as evidence for the claim "All ravens are black"?**
  *   **Yes:** Go to Question 3.
  *   **No:** Go to Question 5.

  **3. If you deliberately select an object *because* it is a white shoe (rather than finding it during a random survey of objects), does it still provide evidence?**
  *   **No, selection makes the evidence inert:** Go to **Leaf B** (Sampling-Procedure View).
  *   **Yes, it still provides some evidence:** Go to Question 4.

  **4. Is confirmation an all-or-nothing logical relation, or a matter of probabilistic degrees?**
  *   **All-or-nothing:** Go to **Leaf C** (Hempel's Satisfaction-Criterion).
  *   **Matter of degrees:** Go to **Leaf D** (Bayesian Treatment).

  **5. If "All ravens are black" means exactly the same thing as "All non-black things are non-ravens," must they share the exact same evidence?**
  *   **No, logical equivalence doesn't guarantee evidential equivalence:** Go to **Leaf E** (Equivalence-Denial).
  *   **Yes, they must share evidence:** Go to Question 6.

  **6. Is the problem that "non-black" is a gerrymandered or unnatural property unfit for scientific laws?**
  *   **Yes:** Go to **Leaf F** (Goodmanian Projectibility).
  *   **No:** Go to **Leaf G** (Unexplored/Incoherent).

  ***

  ### The Leaves: Positions and Commitments

  **Leaf A: Radical Skepticism**
  *   **Claims Dropped:** The Instance Condition (and usually the others).
  *   **Position:** Universal generalizations are never confirmed by finite observations.
  *   **Awkward Commitment:** This view saves the paradox by rendering all empirical science logically unsupported.

  **Leaf B: Sampling-Procedure View**
  *   **Claims Dropped:** The Intuitive Judgment (conditionally).
  *   **Position:** A shoe confirms the hypothesis only if found via a random survey of objects, not if selected for being a shoe.
  *   **Awkward Commitment:** Confirmation depends on the historian's record of how the data was collected, not just the data itself.

  **Leaf C: Hempel's Satisfaction-Criterion**
  *   **Claims Dropped:** The Intuitive Judgment.
  *   **Position:** The white shoe *does* confirm the hypothesis; the paradox is a psychological illusion caused by background knowledge.
  *   **Awkward Commitment:** You must accept that examining your furniture provides evidence about ornithology.

  **Leaf D: Bayesian Treatment (I. J. Good)**
  *   **Claims Dropped:** The Intuitive Judgment (quantitatively).
  *   **Position:** The shoe confirms the hypothesis, but the degree of confirmation is negligibly small compared to a raven.
  *   **Awkward Commitment:** Strictly speaking, looking at a red herring *does* make it slightly more probable that all ravens are black.

  **Leaf E: Equivalence-Denial**
  *   **Claims Dropped:** The Equivalence Condition.
  *   **Position:** "All ravens are black" and its contrapositive are truth-equivalent but not confirmation-equivalent.
  *   **Awkward Commitment:** Two sentences can describe the exact same state of affairs yet be supported by different facts.

  **Leaf F: Goodmanian Projectibility**
  *   **Claims Dropped:** The Instance Condition (restricted).
  *   **Position:** Instances only confirm hypotheses containing "projectible" predicates (like *raven*), not negated ones (like *non-black*).
  *   **Awkward Commitment:** We lack a non-circular definition of which predicates are "projectible" and which are not.

  **Leaf G: The Inconsistent Cell**
  *   **Claims Dropped:** None.
  *   **Position:** You hold that ravens confirm, shoes do not, and equivalent sentences share evidence.
  *   **Awkward Commitment:** **Logical Inconsistency.** You have not solved the paradox; you are inhabiting it.

  ***

  ### Where the Taxonomy Runs Out
  This tree maps the logical space of the trilemma, but some branches blur in practice.

  1.  **Bayesian vs. Sampling:** These positions collapse unless we distinguish between *weak* confirmation and *zero* confirmation. If a Bayesian admits that deliberate selection reduces confirmation probability to exactly zero, they become Sampling theorists. The tree separates them at Question 3, but in formal models, the distinction is often a matter of prior probability assignments.
  2.  **Goodman vs. Equivalence-Denial:** Both views deny that the shoe confirms the raven hypothesis. Goodman blames the *predicates* (non-black is unnatural); Equivalence-Denial blames the *logic* (confirmation is hyperintensional). However, one might argue predicates are unnatural *because* they fail to support equivalence. The tree separates them at Question 6, but the underlying motivation (rescuing the Intuitive Judgment while keeping the Instance Condition) is nearly identical.

  *Use this handout to locate your own intuition, then read the assigned texts to see how each philosopher defends their leaf.*
