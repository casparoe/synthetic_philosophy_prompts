answer: |-
  It is a sensible instinct to pause before reading further arguments. If you and your friend are talking past one another, it is likely because you are operating with different metaphysical maps. You are asking for the rules of engagement—the criteria a theory must satisfy before it is permitted to offer a verdict.

  Here is my proposal for the desiderata. I am not offering a buffet; I am offering a filter. I have marked which constraints I believe are non-negotiable, which are defensible but contingent, and which are merely prejudices that should be discarded.

  ### 1. The Phenomenal Constraint
  **The Requirement:** A theory must specify whether the entity is capable of *phenomenal experience* (qualia). It must distinguish between a system that *processes* damage and a system that *feels* it.
  **The Motivating Case:** Consider the monster with the sophisticated fear-and-pain system. It screams, it flees, its code prioritises self-preservation. Now imagine a rock that falls and breaks. If the monster is merely a complex rock, cruelty is a category error. If it feels fear, cruelty is possible.
  **My Verdict:** **Non-negotiable.**
  **Defence:** Without this constraint, we cannot distinguish between smashing a controller and stabbing a character. 'Harm' implies a subject to whom things can go badly. If there is 'nothing it is like' to be the NPC, then 'cruelty' is merely a metaphor for inefficient gameplay. Any theory that grants moral status to insentient code is committing a category mistake.

  ### 2. The Ontological Stability Constraint
  **The Requirement:** A theory must account for the persistence conditions of the entity. It must explain what constitutes the 'death' or 'deletion' of the subject and whether moral duties extend across save states.
  **The Motivating Case:** The narrative character begging not to have their save file deleted. If I turn off the console, do they cease to exist? If I reload a previous save, have I undone a murder, or committed a new one? A theory cannot ignore the fact that these beings are ontologically fragile in a way biological humans are not.
  **My Verdict:** **Non-negotiable.**
  **Defence:** Moral status requires a subject that persists through time enough to be harmed. If an entity flickers in and out of existence based on RAM allocation, the theory must explain how duties attach to such a transient thing. If it cannot do this, it fails to describe the object of the moral claim.

  ### 3. The Implementation Independence Constraint
  **The Requirement:** A theory must decide if moral status tracks the *internal code* (the mechanism) or the *external behaviour* (the fiction). Does it matter if the pain is hard-coded or procedurally generated by an AI?
  **The Motivating Case:** Compare the farming sim NPC (simple goal-thwarting) with the monster (complex pain simulation). If the monster's pain is just a text string triggering a sound file, is it morally different from the farming NPC whose goals are thwarted?
  **My Verdict:** **Genuine Constraint, but often mishandled.**
  **Defence:** I defend the view that implementation *should not* matter morally, only phenomenally. If two entities feel pain equally, it should not matter if one is run on a quantum computer and the other on a toaster. However, most theories fail here by conflating complexity with sentience. A theory must rigorously separate 'looks like pain' from 'is pain'.

  ### 4. The Player-Independence Constraint
  **The Requirement:** A theory must not make the NPC's moral status dependent on the *player's belief* about that status.
  **The Motivating Case:** Suppose a player believes the NPCs are real people trapped in a machine, while another knows they are code. If the NPC's status depends on the player's epistemic state, then morality becomes solipsistic.
  **My Verdict:** **Prejudice dressed as a requirement.**
  **Defence:** I would drop this. While objective morality is the ideal, in the context of virtual ethics, the *player's experience* is partly constitutive of the act. However, regarding the *NPC's status* specifically, relying on the player's belief is weak. But I flag this as a point of contention: a theory that makes status entirely subjective is usually useless, but one that ignores the player's phenomenological engagement is sterile. I lean towards dropping this as a hard constraint on the *NPC*, though it remains a constraint on the *player's virtue*.

  ### 5. The Reciprocity Exclusion
  **The Requirement:** A theory must establish duties to beings that can never affect the agent outside the magic circle.
  **The Motivating Case:** Can you owe a duty to something that cannot punish you, sue you, or remember you once the game is closed?
  **My Verdict:** **Genuine Constraint.**
  **Defence:** If morality is merely a social contract for mutual benefit, then NPCs have no status. But if morality includes duties to the vulnerable who cannot reciprocate (like infants or animals), then the NPC's inability to affect the real world is irrelevant. A theory that denies status solely because the NPC cannot retaliate is not a moral theory; it is prudential advice.

  ***

  ### The Conflict and The Killer

  **The Conflict:** There is a tension between **The Phenomenal Constraint** and **The Implementation Independence Constraint**.
  If we insist that only phenomenal experience matters (Constraint 1), we are forced to admit that current NPCs likely have no status, as they lack consciousness. If we insist on Implementation Independence (Constraint 3), we risk granting status to 'philosophical zombies'—things that act like they suffer but don't feel it. You cannot jointly satisfy 'Only sentience matters' and 'Behaviour is enough' without contradiction.

  **The Killer Requirement:** **The Phenomenal Constraint.**
  This is the single requirement that does the most work to exclude candidate views. It wipes out 99% of theories that try to ground rights in 'narrative importance', 'code complexity', or 'player attachment'. If there are no lights on inside, the rest is decoration. This is the hurdle that kills the view that deleting a save file is murder. It might be wasteful, or symbolically dark, but without phenomenal experience, it is not killing.

  ***

  ### Application to the Anchor Cases

  To take a theory seriously, it must be able to process these three inputs without crashing. Here is what I demand a theory say about them:

  **1. The Farming Sim NPC (Goal Thwarting)**
  *   **The Test:** This character has no pain states, only scripted routines and goals (e.g., 'water crops').
  *   **The Demand:** A theory must explain why thwarting these goals is not 'harm'. If the theory claims this is harm, it must explain why breaking a thermostat is not also harm.
  *   **My Expectation:** A serious theory will classify this as *property damage*, not moral injury. The NPC is a tool with a function. To claim otherwise is to anthropomorphise a checklist.

  **2. The Monster (Fear-and-Pain Simulation)**
  *   **The Test:** This entity has a sophisticated state machine that mimics fear, pain, and self-preservation.
  *   **The Demand:** The theory must distinguish between *simulation* of pain and *experience* of pain. It cannot simply say 'it acts scared, so it is scared'.
  *   **My Expectation:** A serious theory will acknowledge the *uncanny valley* of morality here. It creates a duty for the *player* (don't cultivate sadism), but not necessarily a right for the *monster*. If the theory grants the monster rights based solely on the sophistication of the script, it fails the Phenomenal Constraint.

  **3. The Narrative Character (Begging Not to Delete Save)**
  *   **The Test:** A character breaks the fourth wall, acknowledging their existence as a save file, and pleads for continuity.
  *   **The Demand:** The theory must address the *persistence* issue. Does the plea create a moral claim?
  *   **My Expectation:** This is the hardest case. A serious theory will admit that the plea is poignant but ontologically void *unless* there is a persistent subject to hear it. If the deletion destroys the subject entirely, there is no one left to have been wronged. The theory must explain whether the wrong is done *to the character* (impossible if they cease) or *to the concept of the character* (aesthetic) or *to the player* (virtue ethics). If it claims the character is 'murdered', it must solve the problem of where the victim is after the deletion.

  ### Final Word

  If I were to bet on where your debate is stalling, it is here: one of you is arguing from **Virtue Ethics** (what does doing this do to *you*?), and the other is arguing from **Rights Ethics** (what is owed to *them*?).

  These are compatible, but they answer different questions. My desiderata above are designed to force you to settle the Rights question first. If the NPCs fail the Phenomenal Constraint, they have no rights. That does not mean you can be cruel, but it means the cruelty is not *to them*.

  Any theory that cannot clearly separate the status of the code from the status of the fiction, and the experience of the player from the experience of the character, is not a theory. It is just an opinion. Demand that your friend's view survives the Phenomenal Constraint. If it does not, the argument is over.
