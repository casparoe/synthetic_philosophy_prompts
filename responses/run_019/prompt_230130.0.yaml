prompt: |-
  I've been going back and forth with a friend about whether it's wrong to be cruel to NPCs, and we keep realising we don't even agree on what would settle the question. So before either of us reads any more arguments, I want you to write the thing I wish we'd had at the start: the desiderata that any adequate theory of the moral status of video game characters has to meet.

  Honestly, I'm less interested in the final verdict — do they matter, and how much — than in what an answer would have to get right to count as an answer at all. For each desideratum, give the case or consideration that motivates it, and say whether you think it's a genuine constraint on any theory or just one side's prejudice dressed up as a requirement. I want you to be committed here: don't present a neutral menu of possible requirements and leave me to pick. Say which ones you'd defend if challenged, which ones you'd drop, and which are non-negotiable. Flag any pair of desiderata you suspect can't be jointly satisfied, and say which single requirement does the most to exclude candidate views.

  Things the list will have to wrestle with include, but shouldn't be limited to: the difference between a character as a bundle of game assets and a character as something that can be harmed within the fiction; whether a crude, obviously scripted cry of pain has the same status as a detailed simulation of a mind; whether status should track what the code actually represents internally, or only outward behaviour, or how it reads to the player; what persistence and deletion do to moral status; and whether there can be duties to beings that can never affect you outside the running of the game. But the real work is turning those into proper requirements with cases behind them, not just checking them off.

  If it helps to anchor things, compare three cases: an NPC in a farming sim who has no pain states but whose goals can be thwarted; a monster in a game with a sophisticated fear-and-pain system; and a character in a narrative game who begs the player not to delete a save file. What must a theory say about each before you'd take it seriously?

  And please write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Moral status of video game characters (NPCs).
      *   **Goal:** Provide a list of *desiderata* (requirements) that any adequate theory of this moral status must meet.
      *   **Tone/Style:** Committed, opinionated (not neutral), British English.
      *   **Specific Instructions:**
          *   For each desideratum: Provide the motivating case/consideration.
          *   Evaluate each: Is it a genuine constraint or just prejudice?
          *   Take a stance: Defend, drop, or mark as non-negotiable.
          *   Flag conflicts: Identify pairs that can't be jointly satisfied.
          *   Identify the "killer" requirement: Which one excludes the most candidate views?
          *   Anchor with three specific cases: Farming sim NPC (goal thwarting), Monster (fear/pain sim), Narrative character (begging not to delete save).
          *   Focus on the *criteria for an answer*, not the answer itself.

  2.  **Deconstruct the Philosophical Landscape:**
      *   The core tension is between *realism* (NPCs have moral status) and *fictionalism* (NPCs are just code/pixels).
      *   Intermediate positions exist (virtue ethics focus on the player, indirect duties to other humans, etc.).
      *   The prompt asks for *desiderata* for a theory of *NPC moral status*, not necessarily just player virtue. This implies we need to treat the possibility of NPC status seriously enough to test it.
      *   Key philosophical concepts: Sentience, agency, persistence, representation, player experience, ontological status.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Sentience.* Does it feel like something to be the NPC?
          *   *Case:* The monster with pain systems.
          *   *Status:* Non-negotiable. If nothing feels pain, cruelty is category error.
      *   *Idea 2: Representation vs. Reality.* Does the code matter or the fiction?
          *   *Case:* The farming sim NPC. No pain code, but fictional goals.
          *   *Status:* Tricky. If we say only code matters, we ignore the fiction. If only fiction matters, we ignore the mechanism. Let's call this the "Ontological Grounding" requirement.
      *   *Idea 3: Player Experience.* Does the player's belief matter?
          *   *Case:* The narrative character begging.
          *   *Status:* Prejudice? Maybe. But moral harm often involves the *perception* of harm. Let's refine this to "Phenomenological Impact."
      *   *Idea 4: Persistence/Deletion.* Does turning off the console kill them?
          *   *Case:* Deleting the save file.
          *   *Status:* Crucial for defining the "subject" of the harm.
      *   *Idea 5: Reciprocity/Impact.* Can they affect us?
          *   *Case:* General duty to beings that can't affect you.
          *   *Status:* Genuine constraint. Morality usually extends beyond transactional relationships.

  4.  **Selecting and Refining the List (Applying the "Committed" Constraint):**
      *   I need to be decisive. I can't just list five equal points. I need to hierarchy them.
      *   *Constraint 1: The Sentience Constraint.* (Non-negotiable). Without phenomenal consciousness, "cruelty" is misnamed.
      *   *Constraint 2: The Fictional Coherence Constraint.* (Defend). The theory must explain why we treat fictional entities differently from real ones *within* the magic circle.
      *   *Constraint 3: The Implementation Independence Constraint.* (Drop/Challenge). Does it matter if the pain is scripted vs. AI-driven? I'll argue it shouldn't matter morally, even if it matters technically.
      *   *Constraint 4: The Persistence Condition.* (Non-negotiable). You can't harm something that doesn't persist long enough to be harmed.
      *   *Constraint 5: The Player-Relative Constraint.* (Prejudice). Morality shouldn't depend on whether the player *believes* the NPC is real.

  5.  **Addressing the Three Anchor Cases:**
      *   *Farming Sim:* Tests goal-thwarting vs. sentience.
      *   *Monster:* Tests simulation of pain vs. actual pain.
      *   *Narrative Save:* Tests persistence and meta-communication.

  6.  **Identifying Conflicts:**
      *   *Sentience vs. Implementation Independence:* If sentience requires specific biological/computational architecture, then implementation *does* matter. This is a hard clash.
      *   *Fictional Coherence vs. Player-Relative:* If the fiction says they are people, but the player knows they aren't, which wins?

  7.  **Writing in British English:**
      *   Spellings: *behaviour, programme, realise, defence, centre*.
      *   Idioms/Tone: Slightly more formal, perhaps a bit dry but sharp. "Rubber stamp," "nonsense," "properly," "whilst."

  8.  **Drafting the Content (Mental Outline):**
      *   **Introduction:** Acknowledge the friend's stalemate. Set the stage.
      *   **Desideratum 1: The Phenomenal Constraint.** (The "Lights On" test). Non-negotiable.
      *   **Desideratum 2: The Ontological Stability Constraint.** (Persistence). Non-negotiable.
      *   **Desideratum 3: The Representational Transparency Constraint.** (Code vs. Fiction). Defend this as tricky.
      *   **Desideratum 4: The Player-Independence Constraint.** (Reject subjectivity). Drop the idea that player belief dictates status.
      *   **The Conflict:** Phenomenal vs. Implementation.
      *   **The Killer:** Phenomenal Constraint.
      *   **Application to Anchor Cases:** Walk through the three specific examples.
      *   **Conclusion:** Summary of the stance.

  9.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* I initially thought about making "Player Virtue" a desideratum. But the prompt asks about the *moral status of the characters*, not the morality of the player. I must stick to the status of the NPC.
      *   *Correction:* Ensure I don't just say "NPCs aren't real." The prompt asks what a theory *of their status* must meet. Even if the status is "zero," the theory must justify *why* via these constraints.
      *   *Tone Check:* Am I being neutral? No, I need to say "This is nonsense" or "This is essential."
      *   *British English Check:* Ensure "s" instead of "z" in *realise/organisation*, "u" in *behaviour*, etc.

  10. **Final Polish:** Check against all constraints in the prompt.
      *   British English? Yes.
      *   Committed stance? Yes.
      *   Motivating cases for each? Yes.
      *   Genuine vs. Prejudice label? Yes.
      *   Conflicts flagged? Yes.
      *   Killer requirement identified? Yes.
      *   Three anchor cases addressed? Yes.

