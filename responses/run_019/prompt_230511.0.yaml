      *   *The Conflict:* The committee is fighting over which concept defines the prize. The Amendment tips the scale toward Desert/Need hybrid.
      *   *Steel-manning A:* If we prioritize Desert/Need, we risk turning the prize into a social welfare grant, reducing its ability to attract top talent (A types) in the future, lowering the prestige and thus the "Expected Value" of the prize itself.
