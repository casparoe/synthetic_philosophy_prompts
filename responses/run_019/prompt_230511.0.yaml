      *   **Governing Documents:** Founding doc = "outstanding distinction." Amendment = "give due weight to obstacles overcome" (no operational guidance).
      *   **Key Requirements:**
          *   Make a concrete recommendation (A, B, divide, or defer).
          *   State a principle for future committees.
          *   Engage the strongest version of the losing position (steel-manning).
          *   Distinguish three concepts of "merit": Backward-looking desert (earned relative to start), Forward-looking expected value (future impact), and Need (benefit from resources).
          *   Reason *ex ante* (selecting a decision rule), not just *ex post* (judging these two).
          *   Guard against self-serving bias (principles that flatter pre-existing preferences).
          *   Determine if the disagreement survives the conceptual separation.
          *   Identify if either side is smuggling in principles.
          *   End with an actionable bottom line.
          *   Tone: Professional, analytical, rationalist-influenced (clear distinctions, no name-dropping/citations), suitable for a foundation board/committee.
          *   Length: Approximately three pages (standard memo density).

  2.  **Deconstruct the Conflict:**
      *   *Candidate A:* High absolute merit (forward-looking), low relative desert (privileged), low need (already supported).
      *   *Candidate B:* Moderate absolute merit (forward-looking), high relative desert (overcame obstacles), high need (resources matter more).
      *   *Faction 1 (Pro-A):* Merit = Absolute Achievement. Worry: Turning it into a "consolation prize" undermines prestige and rewards luck (or lack thereof) rather than output.
      *   *Faction 2 (Pro-B):* Merit = Relative Achievement (Effort/Obstacles). Worry: Ignoring context rewards privilege, not true capability.
      *   *The Amendment:* Explicitly requires weighing obstacles. This is the legal/charitable constraint.

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the recommendation clearly up front (as requested).
      *   **Context & Constraint:** Briefly state the deadlock and the governing documents (Founding vs. Amendment).
      *   **Conceptual Clarification (The "Merit" Triad):** Define the three terms requested (Desert, Value, Need). Analyze how A and B score on each.
      *   **Ex Ante Rule Selection:** Discuss the decision rule. Why choose one over the other for *future* cases? Address the "self-serving bias" check.
      *   **Engaging the Counter-Argument:** Steel-man the Pro-A position. Why is their concern valid? (Prestige, clarity, avoiding paternalism).
      *   **The Smuggling Charge:** Analyze if sides are conflating terms. (Pro-A conflates Desert with Value? Pro-B conflates Desert with Need?)
      *   **Recommendation & Implementation:** specific choice for this year + the rule for next year.

