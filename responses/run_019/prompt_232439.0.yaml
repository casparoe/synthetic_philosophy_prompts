      *   *The "Small Asymmetry":* One option should be slightly better intrinsically, but the other might win due to early luck. Or, both are equal intrinsically, but one gets a random head start. Let's go with *equal intrinsic value* but *random early fluctuation* to emphasize contingency. Actually, to make it more interesting, let's make Option B objectively better (higher base payoff), but Option A has the potential to lock in due to early adoption. This creates the tragedy of inefficiency often associated with path dependence (e.g., QWERTY).
      *   *Mechanism:* Students write A or B on cards.
      *   *Payoff Structure:*
