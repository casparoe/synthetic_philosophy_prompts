answer: |-
  # Seminar Game: "The Standard War"

  **Objective:** To simulate path dependence through a coordination game with increasing returns, allowing students to experience the tension between *ex ante* contingency and *ex post* inevitability.
  **Time:** 75 Minutes (10 min setup, 30 min gameplay, 35 min debrief).
  **Class Size:** 20 Students.
  **Materials:** Index cards (2 per student), whiteboard/markers, small prizes (candy or 1 point extra credit for top 3 scorers).

  ---

  ## Part 1: Setup & Instructions (10 Minutes)

  1.  **Distribution:** Hand each student two index cards. On one, they write a large **X**. On the other, a large **Y**.
  2.  **The Goal:** Tell students: *"This is a game of individual accumulation. Over four rounds, you will earn points. The three students with the highest total points at the end receive a prize. You are acting in your own self-interest."*
  3.  **The Rules (Write on Board):**
      *   **Rounds:** There will be 4 Rounds.
      *   **Choice:** In each round, hold up either **X** or **Y** face down. On "Reveal," turn it over.
      *   **Scoring:** Your points for a round depend on two things:
          1.  **Base Value:** **X** is worth **1 point**. **Y** is worth **2 points**. (Y is inherently better).
          2.  **Network Bonus:** You earn **+0.5 points** for every *previous* time **anyone** in the class has chosen your letter in Rounds 1 through the current round.
          3.  **Switching Cost:** If you choose a different letter than you did in the *immediately preceding* round, subtract **3 points** from that round's score. (In Round 1, there is no switching cost).
      *   **Information:** After each round, I will tally the choices on the board. You will see the cumulative history before making your next choice.
      *   **Constraint:** **No talking, signaling, or communicating** during the game. You are isolated decision-makers.

  4.  **Check for Understanding:** Ask a student to calculate a sample score.
      *   *Example:* "If 10 people picked X in Round 1, and you pick X in Round 2, what is your score?"
      *   *Answer:* Base (1) + Bonus (10 previous X's $\times$ 0.5 = 5) = 6 points.
      *   *Example:* "If you picked X in Round 1, but pick Y in Round 2?"
      *   *Answer:* Base (2) + Bonus (Previous Y's $\times$ 0.5) - Switch Cost (3).

  ---

  ## Part 2: Gameplay (30 Minutes)

  **Round 1 (The Critical Juncture)**
  *   **Action:** Students choose X or Y blindly. No history exists.
  *   **Reveal:** Collect cards or have students hold them up. Tally the results on the board (e.g., X: 11, Y: 9).
  *   **Scoring:** Calculate Round 1 scores (Base only).
  *   **Instructor Note:** Do not comment on which is "better." Just record the numbers. *Crucial:* If the split is close (e.g., 11 vs 9), the Network Bonus in Round 2 will likely make the leading option (X) more valuable than the intrinsically superior option (Y), despite Y having a higher base value.
      *   *Math Check:* If X leads 11-9.
      *   Round 2 X Payoff: $1 + (11 \times 0.5) = 6.5$
      *   Round 2 Y Payoff: $2 + (9 \times 0.5) = 6.5$
      *   *Result:* A mere 2-person lead neutralizes Y's intrinsic advantage. If X leads 12-8, X becomes strictly dominant ($1+6=7$ vs $2+4=6$).

  **Round 2 (The Tipping Point)**
  *   **Action:** Students choose based on Round 1 data.
  *   **Reveal & Tally:** Update cumulative totals on the board (e.g., Total X: 23, Total Y: 17).
  *   **Scoring:** Announce scores for this round. Remind them of the switching cost if anyone flipped.

  **Round 3 (The Accumulation)**
  *   **Action:** Students choose. By now, one standard should have a clear mathematical advantage.
  *   **Reveal & Tally:** Update cumulative totals.
  *   **Observation:** Watch for students who picked the "losing" standard in Round 1. They are now trapped. Switching costs + the massive network bonus of the leader make it irrational to switch, even though Y is intrinsically better.

  **Round 4 (Lock-In)**
  *   **Action:** Final choice.
  *   **Reveal & Tally:** Final totals.
  *   **Scoring:** Calculate final individual totals. Distribute prizes.

  ---

  ## Part 3: The Debrief (35 Minutes)

  *Do not use the term "Path Dependence" until the middle of this section.*

  ### Phase 1: Phenomenology (5 Minutes)
  Ask the class to describe their experience without analyzing it yet.
  *   "How did you decide in Round 1?" (Expect: Guess, coin flip, gut feeling).
  *   "At what point did you feel your choice was no longer free?"
  *   "For those who stuck with X (the inferior standard): Did you feel regret? Why didn't you switch to Y in Round 3 or 4?"
  *   "For those who picked Y early: Did you feel frustrated watching X pull ahead?"

  ### Phase 2: Formal Mapping (15 Minutes)
  Now, introduce the vocabulary. Write these four terms on the board and map them to specific moments in the game.

  1.  **Multiple Equilibria:**
      *   *Concept:* A state where no player wants to change their strategy given what others are doing.
      *   *Game Map:* "If everyone had picked Y in Round 1, Y would have been the stable outcome. If everyone picked X, X is stable. Both are possible endpoints."
  2.  **Increasing Returns (Network Effects):**
      *   *Concept:* The value of a choice increases as more people make it.
      *   *Game Map:* "The +0.5 bonus per previous adoption. This is why the early lead mattered more than the Base Value."
  3.  **Switching Costs:**
      *   *Concept:* Penalties for changing course once invested.
      *   *Game Map:* "The -3 point penalty. This turned a 'preference' into a 'constraint.' Even if you wanted Y later, the math punished you for leaving X."
  4.  **Contingency vs. Inevitability:**
      *   *Concept:* The gap between *ex ante* (before the event) and *ex post* (after the event) perspectives.
      *   *Game Map:* "Look at Round 1. Was X winning inevitable? No. It was a 20-person coin flip. Look at Round 4. Was X winning inevitable? Yes. To switch would have been irrational. **You must hold both thoughts:** The outcome was accidental, but the result was determined."

  ### Phase 3: Predictable Failures & Handling (10 Minutes)
  Discuss what went "wrong" in the simulation compared to an ideal rational outcome.

  *   **Coordination Failure:** "Why didn't you all agree on Y in Round 1?"
      *   *Lesson:* Without communication institutions (unions, standards bodies, contracts), self-interested agents cannot easily coordinate on the *globally* optimal solution when local incentives favor the *currently* popular one.
  *   **The "QWERTY" Problem:** "We locked into the inferior standard (X). Is this realistic?"
      *   *Lesson:* Yes. History is full of inferior technologies winning due to timing (e.g., VHS vs. Betamax, though historians debate the efficiency gap).
  *   **How to Handle It:** Ask students: "If we played again, how could we avoid the inferior lock-in?"
      *   *Solutions:* Allow communication (pre-game contract), reduce switching costs (subsidize switching), or a central coordinator (instructor mandates Y). This leads to a discussion on policy interventions in social systems.

  ### Phase 4: Limitations of the Model (5 Minutes)
  Close by stating what the exercise *cannot* reproduce. This is crucial for philosophy of social science.

  1.  **Timescales:** "We did this in 30 minutes. Real path dependence (e.g., the QWERTY keyboard, the gauge of railroads) takes decades. The 'switching cost' in history isn't just points; it's retraining a workforce or rebuilding infrastructure."
  2.  **The Counterfactual Problem:** "In this game, we know Y was better because I told you. In real history, we cannot rerun the 19th century to see if a different railroad gauge would have been better. We only see the one path that happened. This makes claiming 'path dependence' in history empirically difficult."
  3.  **Power & Agency:** "In this game, everyone was equal. In reality, 'early moves' are often made by powerful actors (corporations, states) who *force* a standard, not just through network effects, but through capital and coercion. This game models *emergent* lock-in, not *imposed* lock-in."

  **Closing Statement:**
  *"Path dependence is not just 'history matters.' It is the specific claim that small, contingent events, amplified by increasing returns, can trap a system in a sub-optimal equilibrium that looks inevitable in retrospect. Today, you felt the trap snap shut."*
