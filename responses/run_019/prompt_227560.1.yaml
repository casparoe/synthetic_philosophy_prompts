      *   *Proposal:* Distinguish between *Baseline-Relative Pareto* (standard) and *Rights-Constrained/Safe Pareto* (nobody worse off relative to a just baseline).
      *   *Claim:* Standard Pareto isn't normatively neutral; it tacitly endorses the status quo.
      *   *Goal:* Show Pareto requires an external fairness constraint to be action-guiding, without specifying *which* fairness theory is correct.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be clear and academic. *Safe Improvements: Re-evaluating the Normative Neutrality of the Pareto Principle.*
      *   **Research Question:** Needs to be sharp. Not "Is Pareto good?" but something about the conditions under which it holds normative weight.
          *   *Draft:* Does the Pareto principle require a just baseline to be normatively significant?
