answer: |-
  **Term Paper Proposal: Safe Improvements and the Baseline Dependence of the Pareto Principle**

  **Research Question**
  This project investigates whether the normative force of a Pareto improvement depends on the moral permissibility of the status quo against which the improvement is measured.

  **Project Overview**
  In welfare economics, a change is a "Pareto improvement" if it makes at least one person better off without making anyone worse off. It is often defended as the one uncontroversial principle of policy evaluation because it seemingly requires no interpersonal comparisons of well-being. However, as discussed in seminar, this relies on the status quo as the baseline for measuring "worse off." My paper will argue that this baseline dependence renders the principle normatively unstable in cases of exploitation. I distinguish between a *Baseline-Relative Improvement* (where agents are better off than their current, possibly exploitative, situation) and a *Safe Pareto Improvement* (where agents are better off relative to what they could reasonably demand). I will argue that only the latter justifies policy endorsement without tacitly endorsing the justice of the status quo.

  **Argument and Structure**
  1.  **Introduction:** Define the Pareto principle for a non-specialist audience and outline the standard defense (unanimity without redistribution).
  2.  **The Exploitative Baseline:** Present a case study (e.g., a wage increase in a sweatshop) where a change is Pareto-efficient relative to the status quo but relies on the workers' lack of acceptable alternatives. I will demonstrate that "consent" here is driven by duress rather than genuine gain relative to a fair baseline.
  3.  **The Distinction:** Formalize the difference between *Baseline-Relative* and *Safe* improvements. I will argue that standard welfare economics conflates these, treating any move away from a bad baseline as an unqualified "improvement."
  4.  **The Necessity of an Independent Constraint:** I will contend that for Pareto to be action-guiding, it must be paired with an independent fairness constraint on the baseline. Crucially, I will not commit to a specific theory of justice (e.g., Rawlsian or Libertarian). This is a feature, not a bug: it shows that *regardless* of which theory of justice one holds, the Pareto principle alone is insufficient.
  5.  **Conclusion:** Summarize how recognizing this distinction undermines the Pareto principle's reputation as a freestanding normative tool.

  **Anticipated Objections**
  I anticipate two main challenges. First, critics may argue I am smuggling a full theory of justice into a welfare criterion, thereby begging the question. I will reply that I am not proposing a theory of justice, but rather demonstrating a structural dependency: Pareto cannot operate in a vacuum. Second, a student of game theory might object that bargaining theory already accounts for this via the "disagreement point." I will distinguish the *descriptive* disagreement point (what happens if no deal is made) from the *normative* baseline (what ought to happen). My argument is that the moral validity of the deal depends on the latter, which standard Pareto analysis ignores.

  **Conditions for Failure**
  This project would fail if it turns out the two notions of "worse off" collapse into each other once rigorously defined. If "what one could reasonably demand" cannot be distinguished from "current holdings" without fully solving distributive justice, the distinction may be impractical. Additionally, if the Pareto principle is successfully defended as purely technical—with no intended normative force—my critique would miss its target. I will address this by focusing on how the principle is actually used in policy justification, where it is invariably treated as having moral weight.

  **Feasibility**
  The argument relies on conceptual analysis and case application rather than complex modeling, making it feasible within the eight-week timeframe. The core literature is covered in the seminar syllabus, allowing me to focus on drafting and refining the distinction between the two types of improvements.
