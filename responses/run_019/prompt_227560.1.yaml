          *   (b) *Bargaining Theory:* I need to distinguish the *normative* claim from the *positive/descriptive* claim of bargaining points.
      *   **Argument Structure:**
          1.  Define Pareto simply.
          2.  Present the exploitative baseline case (sweatshop example).
          3.  Distinguish the two senses of "worse off."
          4.  Show why standard Pareto fails in the exploitative case.
          5.  Argue for the need for an independent constraint (without picking one).
      *   **Conditions for Failure:** If the distinction collapses or if Pareto is proven to be purely technical (no normative claim).
      *   **Feature, not Bug:** Why not picking a theory of justice is good (makes the argument compatible with multiple theories).

  4.  **Refining for Audience and Tone:**
      *   *Tone:* Academic but accessible. Avoid heavy math. Explain "status quo bias" clearly.
      *   *Length:* Needs to fit on one page. roughly 600 words.
      *   *Constraint Check:* Did I include the "one sentence question"? Yes. Did I address the two specific objections? Yes. Did I mention the failure condition? Yes.

  5.  **Drafting the Content (Iterative Process):**

