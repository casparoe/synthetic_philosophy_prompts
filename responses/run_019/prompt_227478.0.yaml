  2. The external goal still does significant work by providing the necessary material context for virtue, since one cannot exercise justice or courage without engaging with specific worldly situations.
  3. A Stoic really prefers health to sickness because this preference dictates the direction of their selective action, even though the final possession of health constitutes neither success nor failure.
  4. If the external goal were removed entirely, the internal goal would lack content, making it impossible to fulfill the Stoic duty to act vigorously according to nature's design.
  5. Thus, the reserve clause allows for wholehearted effort toward preferred indifferents while ensuring that fortune's interference never compromises the agent's moral integrity.
