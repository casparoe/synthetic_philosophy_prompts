prompt: |-
  I chair the editorial-standards board of a public television station. We vote on Friday whether to broadcast a submitted six-part documentary series, Before the Builders, which argues that monuments at Giza, Tiahuanaco, and Göbekli Tepe are several millennia older than mainstream archaeology allows and were built by a lost maritime civilization. The program is not the work of obvious cranks: its presenter holds a doctorate in geology, it cites peer-reviewed papers on weathering and archaeoastronomy, and several of its local observations are the kind mainstream specialists dispute among themselves. What the specialists reject is the global conclusion and the way the series assembles the evidence. The producers argue that a public broadcaster should let viewers weigh contested evidence for themselves, that dismissing the series as pseudohistory is an ad hominem, and that archaeology has overturned its own consensus before. The board is split three ways: one faction would decline outright on the ground that airing is platforming pseudohistory; a second would air the series exactly as submitted; a third would air it only with a framing overlay and a companion program. Draft the short written recommendation I'll circulate before Friday's vote. It must recommend one concrete course of action with a time frame; it must engage the strongest version of the two losing positions rather than caricatures; it must say whether the board should evaluate individual claims, methods, or the research program as a whole, and what turns on that choice; and it should close with a general criterion we can apply to future submissions of this kind so the decision is not ad hoc.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Editorial-Standards Board of a public television station.
      *   **Task:** Draft a short written recommendation to circulate before Friday's vote.
      *   **Subject:** A six-part documentary series (*Before the Builders*) arguing for a lost maritime civilization and older monuments (Giza, Tiahuanaco, Göbekli Tepe) than mainstream archaeology accepts.
      *   **Context:** The program isn't obvious crankery (PhD presenter, cites peer-reviewed papers, uses disputed local observations). The conflict is about the *global conclusion* and *assembly of evidence*.
      *   **Board Factions:**
          1.  Decline outright (pseudohistory/platforming).
          2.  Air as submitted (viewer autonomy/anti-censorship).
          3.  Air with framing/companion program (contextualization).
      *   **Requirements:**
          *   Recommend one concrete course of action with a time frame.
          *   Engage the strongest version of the two *losing* positions (whichever one I don't pick).
          *   Specify whether the board should evaluate individual claims, methods, or the research program as a whole, and explain the stakes of that choice.
          *   Close with a general criterion for future submissions (to avoid ad hoc decisions).

  2.  **Determine the Recommendation:**
      *   *Option 1 (Decline):* Risks appearing censorious, ignores the nuance that some data is legitimate, alienates the "free inquiry" faction.
      *   *Option 2 (Air As Is):* Risks misleading the public, violates public broadcaster duty to accuracy/context, validates a potentially flawed synthesis without check.
      *   *Option 3 (Air with Context):* Balances access to information with editorial responsibility. Acknowledges the data while contextualizing the consensus. This is usually the most defensible position for public media (PBS model).
      *   *Decision:* I will recommend Option 3 (Air with framing/companion program). It best serves the public interest without abdicating editorial standards.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Recommendation:** Air the series *with* specific contextualizing elements (intro/outro, companion special/website). Set a timeframe (e.g., production of context within 4 weeks, airing within 3 months).
      *   **Engaging the Losing Positions:**
          *   *Against Outright Rejection:* Acknowledge that archaeology *has* shifted before. Dismissing based on consensus alone stifles legitimate questioning. The presenter has credentials; some data points are genuinely debated. Rejection looks like dogma.
          *   *Against Airing As Is:* Acknowledge the "let viewers decide" argument. However, public broadcasting isn't a neutral pipe; it implies endorsement. Assembling valid data into a invalid synthesis is a specific rhetorical trick (the "Gish Gallop" or similar). Without context, the audience lacks the tools to weigh the *synthesis*, even if they can weigh the *data*.
      *   **Evaluation Scope (Claims vs. Methods vs. Program):**
          *   Need to decide: Are we judging the bricks (claims), the mortar (methods), or the house (research program)?
          *   *Argument:* We must evaluate the *research program as a whole* (the synthesis). Individual claims (weathering rates) might be valid, and methods (geological analysis) are sound, but the *leap* to a global maritime civilization is where the editorial risk lies. If we only judge individual claims, we miss the misleading narrative. If we judge the whole program, we address the actual impact on the viewer.
      *   **Future Criterion:** Need a test for "Fringe Science vs. Legitimate Controversy."
          *   *Idea:* The "Consensus + Explanation" test. If a program contradicts established consensus, it must either demonstrate why the consensus is methodologically flawed or provide the space for that counter-argument to be aired alongside it.
          *   *Refinement:* Let's make it about "Synthetic Integrity." Does the assembly of evidence follow logical standards accepted in the field, even if the conclusion is novel? Or does it rely on cherry-picking?
          *   *Better Criterion:* "Contextual Proportionality." The level of editorial framing required should be proportional to the distance between the program's claims and the established scholarly consensus, weighted by the potential for public harm/misinformation.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I engage the *strongest* version of the losing arguments?
          *   *Rejection:* Don't just say "it's censorship." Say "it risks calcifying current consensus into dogma, ignoring history of paradigm shifts."
          *   *Air As Is:* Don't just say "it's misleading." Say "it respects viewer autonomy but ignores the asymmetry of expertise between producer and audience."
      *   *Check:* Did I specify the evaluation level? Yes, the "Research Program/Synthesis."
      *   *Check:* Is there a timeframe? Yes, need to add specific dates or durations.
      *   *Tone:* Professional, decisive, collegial, principled.

  5.  **Final Review against Constraints:**
      *   Concrete course of action? Yes (Air with context).
      *   Time frame? Yes (4 weeks for production, broadcast window).
      *   Engage strongest losing positions? Yes (Dogma risk vs. Viewer autonomy).
      *   Evaluate claims, methods, or program? Yes (Program/Synthesis).
      *   General criterion for future? Yes (Consensus Distance & Framing).

  6.  **Final Polish:** Ensure the distinction between "individual claims" (which might be true) and "global conclusion" (which is disputed) is clear, as this is the crux of the editorial dilemma. (Proceed to generate output).

  *(Self-Correction on the "Losing Positions" instruction)*: Since I am recommending Option 3, the "losing positions" are Option 1 (Decline) and Option 2 (Air As Is). I need to make sure I treat *both* respectfully, showing why they are understandable but ultimately insufficient.

  *(Self-Correction on Evaluation Level)*: The prompt asks me to say whether the board should evaluate individual claims, methods, or the research program *and what turns on that choice*. I need to be explicit that choosing "individual claims" leads to a trap where the show passes because the bricks are real, even if the house is unstable.

  *(Self-Correction on Future Criterion)*: Needs to be actionable. "Proportionality of Framing" is good.

  7.  **Finalizing the Text:** (Drafting the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Editorial-Standards Board
  **FROM:** Chair, Editorial-Standards Board
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding *Before the Builders*

  **Recommendation**
  I recommend we approve the broadcast of *Before the Builders* contingent upon the production of substantial editorial framing. Specifically, we will air the six-part series only if accompanied by: (1) a standardized introductory statement clarifying the divergence from archaeological consensus; (2) a one-hour companion special featuring mainstream counter-analysis; and (3) a curated digital resource hub. Production of these materials must be completed within four weeks, with a target broadcast window of late January.

  **Engaging the Dissenting Views**
  This compromise rejects the two polarized positions currently on the board, though both rest on valid principles.

  To the faction advocating **outright rejection**: You rightly argue that public media must not platform pseudohistory. There is a genuine risk that airing this series validates a narrative that relies on selective evidence. However, rejection carries its own epistemic risk. Archaeology *has* overturned consensus before (e.g., the dating of Göbekli Tepe itself). If we decline any submission that contradicts current orthodoxy, we risk calcifying current scientific understanding into dogma. The presenter's geological credentials and citation of peer-reviewed weathering data suggest this is not mere fantasy, but a contested hypothesis. Rejection here could be perceived as protecting institutional authority rather than truth.

  To the faction advocating **airing the series as submitted**: You rightly argue for viewer autonomy and against paternalism. The producers' claim that viewers should weigh evidence themselves is a core democratic value. However, this ignores the asymmetry of expertise. While viewers can judge individual data points, they are ill-equipped to evaluate the *synthesis* of those points into a global historical narrative. Airing the series without context implies an editorial endorsement of its conclusions. To provide a platform without providing the tools to critique that platform is not neutrality; it is negligence of our educational mandate.

  **Scope of Evaluation**
  In making this decision, the Board must evaluate the **research program as a whole**, rather than individual claims or methods.

  What turns on this choice is significant. If we evaluate only **individual claims** (e.g., "Is this erosion pattern possible?"), the series passes, because many specific observations are legitimate. If we evaluate only **methods** (e.g., "Is geology a valid science?"), the series also passes. The editorial failure lies in the **synthesis**: the leap from valid local data to a global conclusion of a lost maritime civilization. By evaluating the research program as a whole, we acknowledge that accurate bricks can still build a unstable house. Our duty is to assess the structural integrity of the argument, not just the quality of the materials.

  **Future Criterion: Consensus Distance and Framing**
  To prevent future ad hoc decisions, we will adopt the **Consensus Distance Protocol**.

  For any submission contradicting established scientific or historical consensus, the required level of editorial framing shall be proportional to the "distance" between the claim and the consensus.
  1.  **Low Distance** (Internal scholarly debate): No additional framing required.
  2.  **High Distance** (Contradicts core paradigm without new verifiable data): Requires mandatory companion context or rejection.
  3.  **Critical Threshold**: If a program relies on assembling accepted facts to support a rejected conclusion, it triggers the High Distance protocol regardless of the accuracy of the individual facts.

  This ensures we remain open to paradigm shifts without becoming a conduit for misleading syntheses.

  Please review this recommendation prior to Friday's vote.
