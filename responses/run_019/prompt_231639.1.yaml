prompt: |-
  I'm in a high school philosophy elective and we just spent a week on whether death can actually be bad for the person who dies. The Epicurean symmetry argument has been bugging me: the teacher put it roughly as, the time before you were born isn't bad for you, so the time after you die shouldn't be either, since in both cases there's no you around to be deprived. That sounds airtight until someone points out that it would also mean secretly canceling all the good years someone was going to have isn't bad for them, which feels obviously wrong. All the examples we kicked around in class had extra noise—people afraid of dying, families grieving, religion—so I want a cleaner test case.

  I'd like you to construct a thought experiment to order for this. Make it a realistic, ordinary life scenario in which a person dies painlessly and without any warning, at a time when their future was genuinely going to be good, and with no grieving friends or family or afterlife beliefs in the frame. The point is to force the deprivation account (death is bad because it deprives you of goods you would otherwise have had) and the Epicurean symmetry argument to give opposite verdicts, so the disagreement is isolated to one thing only. Don't use cryonics, comas, time travel, or anything like that, and the case cant get its verdict by making the person aware of what they're missing.

  After you set the case up, walk through how each side analyzes it: what the Epicurean says, what the deprivation theorist says, and why. Then tell me which specific feature of the scenario is doing the real work in prying them apart, and how a hardcore Epicurean would attack the setup even if you think the attack fails. Finally, tell me what would honestly change your mind—what tweak to the case or argument would flip the verdict, and where the deprivation account's reasoning is most likely to fail under pressure.
