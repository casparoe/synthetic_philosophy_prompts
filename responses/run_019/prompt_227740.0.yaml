  **Joint Statement on Frankfurt Cases and the Principle of Alternative Possibilities**

  **Undersigned:** [Pro-Frankfurt Collaborator] & [Pro-PAP Collaborator]
  **Date:** October 26, 2023

  Having spent the term debating the necessity of alternative possibilities for moral responsibility, we submit this statement to clarify our common ground, isolate our genuine disagreements, and record our divergent predictions regarding specific cases.

  **I. Agreed Claims**
  1.  **Case Setup:** In a standard Frankfurt-style case, the counterfactual intervener (Black or the device) remains idle in the actual sequence. The agent's decision is causally produced by the agent's own reasons and psychology, not by the intervener.
  2.  **Reliability:** Any prior sign used to trigger the intervener must be nomologically reliable enough to ensure the intervener would have acted had the agent shown signs of choosing otherwise.
  3.  **Scope of Debate:** We are not debating whether determinism is true. We are debating whether the *presence* of a mechanism that removes alternative possibilities (even if unused) negates moral responsibility in the actual sequence.
  4.  **Responsibility:** We agree that moral responsibility entails ownership of the action such that the agent is an appropriate target for reactive attitudes (praise or blame) based on the actual source of the action.

  **II. Areas of Disagreement**

  | Issue | Position A (Frankfurt) | Position B (PAP) |
  | :--- | :--- | :--- |
  | **Necessity of PAP** | The ability to do otherwise is not necessary for moral responsibility. | The ability to do otherwise is necessary for moral responsibility. |
  | **Significance of Flickers** | Residual alternative possibilities (e.g., choosing on one's own vs. being forced) are too thin to ground responsibility. | Residual alternative possibilities, however thin, are sufficient to satisfy PAP and ground responsibility. |
  | **Sourcehood vs. Leeway** | Responsibility tracks the actual source of the action (sourcehood), not the availability of alternatives (leeway). | Responsibility tracks the availability of alternatives (leeway), even if the actual source is identical. |

  **III. Cruxes and Predictions**
  We identify two specific cruxes where our interpretations diverge. For each, we specify a concrete scenario and record our predictions regarding how intuitions about responsibility should track.

  *   **Crux 1: The Dilemma Defence.**
      *   *Scenario:* A Frankfurt case where the prior sign is indeterministic (not causally determined).
      *   *Prediction A:* Responsibility remains intact because the actual sequence is untouched; the indeterminism of the sign is irrelevant to ownership.
      *   *Prediction B:* Responsibility fails or PAP is satisfied because the indeterminism allows a robust alternative possibility to remain open until the moment of choice.
  *   **Crux 2: The Flicker Strategy.**
      *   *Scenario:* An agent chooses X on their own, but could have chosen X via coercion.
      *   *Prediction A:* Intuitions of responsibility will not track the difference between "X on own" vs. "X via coercion" if the outcome and actual cause are identical.
      *   *Prediction B:* Intuitions of responsibility will track this difference because the possibility of avoiding the coercion constitutes a morally significant alternative.

  **IV. The Ulysses Case**
  We apply our positions to the following scenario: *Jones, worried he will cave under pressure and betray a friend, installs a device that forces his hand to sign the betrayal document if and only if he starts to waver. At the meeting, he never wavers. He signs entirely on his own, cooly and deliberately, while the device watches and does nothing.*

  | Question | Position A (Frankfurt) | Position B (PAP) |
  | :--- | :--- | :--- |
  | **1. Is Jones responsible for the signing in the actual case?** | **Yes.** The actual sequence is uncompromised. The device is irrelevant to the source of the action. | **No.** The device removes the possibility of doing otherwise (not signing). PAP is violated. |
  | **2. Does it matter that Jones installed the intervener himself?** | **No.** Self-installation explains *why* the device is there, but responsibility hinges on the actual sequence at the time of action. | **Yes.** Self-installation suggests a prior moment of responsibility where alternatives existed, but strict PAP regarding the *signing* itself remains violated. |
  | **3. Does the answer change if he wavers and the device acts?** | **Yes.** Responsibility is negated because the actual sequence is now controlled by the device, not Jones. | **Yes.** Responsibility is negated because the actual sequence is coerced, and no alternative possibilities exist. |

  **V. Commitment**
  We acknowledge that our disagreement ultimately rests on whether moral responsibility is fundamentally about the history of an action (Leeway) or the genesis of an action (Sourcehood). We agree to cease arguing over the definition of Frankfurt cases and instead focus on whether Sourcehood alone is sufficient for the reactive attitudes we both agree constitute responsibility.

  **Signed,**

  ____________________  
  [Pro-Frankfurt Collaborator]

  ____________________  
  [Pro-PAP Collaborator]
