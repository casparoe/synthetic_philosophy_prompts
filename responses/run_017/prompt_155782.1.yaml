  ### Game Design for Accuracy-First Epistemology Seminar

  **Core Structure:**  
  Two blocks (fine partition vs. coarse partition scoring), 3 rounds per block. Students report credences (0-100) for each cell of a 6-cell partition. Random outcomes resolved instantly with a die. Payoff: Top scorer per block wins trivial prize (e.g., chocolate bar, choice of next reading).

  ---

  ### **Materials & Setup**
  - **Randomizer:** 6-sided die (faces 1–6 = partition cells).
  - **Groups for Coarse Block:** 
    - Group A: Faces {1, 2}  
    - Group B: Faces {3, 4}  
    - Group C: Faces {5, 6}.
  - **Worksheets:** 
    - **Block 1 (Fine):** 6 columns (c1–c6), "True Cell," "Score."  
    - **Block 2 (Coarse):** 6 columns (c1–c6), "G1 = c1+c2," "G2 = c3+c4," "G3 = c5+c6," "True Group," "Score."
  - **Scoring Formula** (displayed prominently):  
    - **Block 1 (Fine):**  
      `Score = (2 × [Credence in True Cell]) - ([Sum of Squares of All Credences] ÷ 100)`  
      *(Example: True cell = 1, credences = [50, 50, 0, 0, 0, 0] →  
      Score = (2×50) - (50²+50²+0²+0²+0²+0²)/100 = 100 - 50 = 50)*  
    - **Block 2 (Coarse):**  
      `Score = (2 × [Group Total for True Group]) - ([G1² + G2² + G3²] ÷ 100)`  
      *(Example: True face = 1 (Group A), G1 = 100, G2 = 0, G3 = 0 →  
      Score = (2×100) - (100²+0²+0²)/100 = 200 - 100 = 100)*  

  ---

  ### **Rules & Procedure**
  1. **Introduction (5 min):**  
     - Explain the goal: "Predict the outcome of a die roll. Assign 0–100 to each face (higher = more confident). Your score measures accuracy."  
     - **Emphasize:** "No need for credences to sum to 100. Scores can be negative!"  
     - Demo **one practice round** per block (use fixed outcome, e.g., "Suppose die shows 1...").

  2. **Block 1: Fine Partition (Quadratic Scoring) (20 min)**  
     - **Per Round (3 rounds total):**  
       1. Students silently fill in credences (c1–c6) on worksheets.  
       2. Roll die → announce true cell.  
       3. Students compute scores (instructor verifies 2–3 students).  
     - **Key:** Score depends on individual cells → incoherence (e.g., sum ≠ 100) penalized.

  3. **Block 2: Coarse Partition (Group Scoring) (20 min)**  
     - **Per Round (3 rounds total):**  
       1. Students fill in credences (c1–c6).  
       2. Roll die → announce true cell and its group (e.g., "3 → Group B").  
       3. Students compute G1, G2, G3, then score.  
     - **Key:** Score depends only on group totals → within-group distribution irrelevant.

  4. **Scoring & Prizes (5 min):**  
     - Sum scores across 3 rounds per block.  
     - Award prize to top scorer in **each block** (two winners total).

  ---

  ### **Handling Luck & Pitfalls**
  - **Mitigating Luck:**  
    - 3 rounds reduce noise; focus discussion on **strategic patterns** (e.g., "Who consistently scored well? What did they do?").  
    - Compare **average scores** across blocks in debrief.  
  - **Expected Pitfalls:**  
    - **Arithmetic errors:** Provide simple calculators or pre-printed formula sheets.  
    - "Extremizing" student (e.g., [100,0,0,0,0,0]):  
      - In Block 1, highlight their wild swings (-100 to 100).  
      - In Block 2, note they fare identically to [50,50,0,0,0,0] if true cell in same group.  
    - "Cell-splitter" (e.g., [0,0,50,50,0,0] → [0,0,100,0,0,0]):  
      - In Block 1, show incoherence penalty (sum of squares ↑).  
      - In Block 2, show identical scores → "free reshuffling."  
    - **Incoherence:** Ensure at least one student uses sum ≠ 100 (gently encourage: "Try something bold!").

  ---

  ### **Debrief (25 min)**
  **Map Game Moments to Concepts:**  
  1. **Veritism (Accuracy as Epistemic Good):**  
     - *Moment:* Compare uniform [17,17,17,17,17,17] (steady +16.7) vs. extremist [100,0,0,0,0,0] (volatile -100 to 100).  
     - *Concept:* Scoring rules quantify accuracy. Coherent credences "aim at truth" systematically.  

  2. **Strict Propriety & Dominance:**  
     - *Moment (Block 1):* Student with incoherent [100,100,0,0,0,0] vs. coherent [50,50,0,0,0,0].  
       - Actual score: [100,100,...] → 0 if true cell=1/2; [50,50,...] → +50.  
       - *Concept:* Coherent credence **dominates** incoherent one (better in every world).  
     - *Moment (Block 2):* Two students with same group totals (e.g., G1=100) but different within-group splits ([100,0] vs. [50,50]).  
       - *Concept:* Coarse scoring is **proper but not strictly proper** for fine cells → no incentive for intra-group coherence.  

  3. **Expectation vs. Domination:**  
     - *Moment:* Extremist wins Block 1 by luck (e.g., high rolls on their chosen cell).  
       - *Concept:* Domination (doing better in *every* world) ≠ doing better *in expectation*. Veritism cares about domination, not luck.  

  **What the Game Can’t Reproduce:**  
  - **The Theorem:** Shows *that* domination occurs, not the proof (e.g., via Bregman divergence).  
  - **Non-Pragmatic Contamination:** Prizes might imply "gaming" scores vs. epistemic duty. Reiterate: "Scores measure accuracy—prizes just make it tangible!"  

  ---

  ### **Why Block 1 First?**
  - **Pedagogical Flow:**  
    1. Block 1 establishes baseline (coherence matters for fine-grained accuracy).  
    2. Block 2 contrasts by "lifting" constraints (intra-group freedom) → reveals how scoring rules shape rationality.  
  - **Cognitive Load:** Fine scoring is intuitive (direct cell-truth match); coarse scoring requires abstraction.  

  ---

  ### **Instructor Cheat Sheet**
  - **Twist Validation:** Your coarse scoring rule works! It’s strictly proper for groups (enforces coherent group totals) but indifferent within groups → students *will* feel reshuffling is "free."  
  - **Time Savers:**  
    - Pre-roll 3 outcomes per block (record secretly) to avoid dice delays.  
    - Use student volunteers to compute 2–3 scores/round.  
  - **Crisis Plan:**  
    - If arithmetic bogs down, skip to pre-calculated examples.  
    - If extremists dominate prizes, debrief "Why we need coherence to *guarantee* safety."  

  This design forces coherence to emerge from scoring dynamics—no jargon until the "aha!" moments in debrief. Students will *feel* domination and propriety gaps before naming them.
