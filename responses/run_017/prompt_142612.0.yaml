prompt: |-
  Eighteen months ago my father died and left my sister and me joint control of the small charitable fund he had set up. The deed gives each of us an independent annual allocation — roughly forty thousand pounds apiece — to disburse as we each see fit, provided only that it reaches a registered charity. Over the past two years my sister and I have discovered that we disagree about nearly every grant either of us proposes: I want the money to go where it does the most measurable good per pound, she wants it to go to the hospice and the parish youth work in the village where we grew up. We have been splitting the difference, and both of us now leave every meeting feeling that our half was simply wasted.

  A friend who works in philanthropy told me that what we have been groping toward has a name — moral trade — and I have since read just enough about it to think the fit is genuine but not perfect. Next month I have to put the idea to the fund's advisory panel in about forty minutes with nothing but a whiteboard. The panel is my sister; our father's old colleague, a retired actuary; and my cousin, a hospice nurse. None of the three has any philosophy or economics. My sister is quick, allergic to jargon, and will treat any hint of condescension as evidence that the whole scheme is a device for pointing her money at my causes.

  One complication runs through all of this and I do not know where in the session it belongs. My sister's objection to my preferred grants is not that she ranks them below hers. She holds that there are things she must not fund — that to direct money to them would be to cooperate in something seriously wrong, and that this remains true whatever she might get in return. I cannot tell whether that closes off the idea entirely or only forces us to look for a different lever, and I would rather find out from you than in front of her.

  So please do not explain moral trade to me; plan how I should explain it to them. I want: the order in which the component ideas have to arrive and what each one depends on, including what must be in place before a trade so much as looks available to people who share no scale of value; the single example that should carry the whole thing, what it must contain and what it must carefully not contain, and why that example rather than the vegetarianism-for-bednets sort of case, or rather than our own disagreement; the misconceptions to expect, in the order they will actually arise, with the point in the sequence at which each should be headed off — that it is just compromise, that it is vote-trading, that it is bribery, that a person who will act against her own convictions for a price never had any, that if her view is mistaken I should not be paying her to act on it, that we should simply argue until one of us wins, that if she would have funded the hospice anyway my concession buys nothing, and that both of us have an incentive to overstate how much we would hate conceding; where in the sequence my sister's constraint should enter and what the honest answer is about whether someone with a constraint of that shape can trade at all; one question I can ask at the end that would show the idea had landed rather than merely been endured; and what I should openly decline to explain at this level, naming it as a refusal. I am not asking you to adjudicate our disagreement about which causes are worth funding, and please do not point me to anything to read — I want the shape of the session, not sources.
reasoning: |-
  Okay, let me unpack this user's complex request. They're preparing a 40-minute whiteboard session to introduce moral trade to three non-experts: their sister (who has moral constraints), an actuary, and a hospice nurse. The core challenge is explaining how people with fundamentally different values can cooperate without compromising principles.

  Hmm... the sister's position is particularly tricky. She views certain causes as morally off-limits regardless of benefits. This isn't just preference - it's deontological constraint. The user needs to know if trade is even possible here, and how to present it without triggering defensiveness.

  First, structural considerations:
  - Must avoid jargon like "utility" or "Pareto efficiency"
  - Sister will bolt at first hint of condescension
  - Actuary might grasp numbers but need concrete framing
  - Nurse likely thinks in care ethics terms
  - Whiteboard-only means visuals must do heavy lifting

  Key teaching sequence I'm considering:
  1. Establish irreconcilable differences first (their current deadlock)
  2. Show pure compromise makes both worse off (arithmetic demo)
  3. Introduce "package" concept - trades as bundles
  4. Present trade as mutual sacrifice for net gain

  For the central example... hospital vs. textbooks is better than bednets because:
  - No moral baggage (avoids triggering sister)
  - Visually clear inputs/outputs
  - Shows measurable outcomes both care about
  - Contains natural asymmetry (specialization)

  Ah, and the sister's constraint... it must come late in the sequence after trade mechanics are clear. Crucial distinction: trading isn't funding the forbidden thing, it's enabling her to fund more of her must-do cause. The "price" is her tolerance for my funding it, not her endorsement.

  Biggest landmines to defuse in order:
  1. "This is just compromise" → show math proving it's not
  2. "Like bribery" → emphasize transparency rules
  3. "Convictions for sale" → stress no belief change
  4. "Arguing is better" → demonstrate deadlock costs

  Closing question idea: "If we did this, what's one cause you'd want protected?" Tests if they're thinking strategically about constraints.

  What to refuse: Any discussion of whose causes are "better." Shut that down immediately with "That's not today's question."

  Timing breakdown:
  - 10min establishing problem
  - 15min core mechanics
  - 10min objections & constraints
  - 5min wrap-up

  The sister's constraint actually makes trade more necessary - when values clash absolutely, cooperation requires this mechanism. But that's the advanced course... for now, just show the arithmetic works if she can tolerate my choices.
answer: |-
  Here’s a step-by-step plan for your 40-minute whiteboard session, designed for your audience. It focuses on **clarity, concrete examples, and preempting objections**. Avoid jargon entirely—use plain analogies. The goal is to frame moral trade as a *cooperation tool*, not a philosophical debate.

  ---

  ### **Session Structure & Timing**  
  *(Total: 40 mins)*  
  **I. The Problem: Why We’re Stuck (10 mins)**  
  - **Start with shared pain:** "We both leave meetings feeling half our money was wasted. Why?"  
  - **Whiteboard:** Draw two columns: *You* | *Sister*. List 1–2 grants each cares about (e.g., "Malaria Nets" vs. "Village Hospice").  
  - **Key point:** "We don’t just disagree—we think the other’s choice is actively *bad*. Compromise (splitting funds) means both get less of what they want. Worse, we both lose money to ‘waste’."  
  - **Preempt misconception #1 (Compromise):** "Splitting isn’t cooperation—it’s mutual defeat. We can do better."  

  **II. The Core Idea: Trading "Sacrifices" (15 mins)**  
  - **Analogy:** "Imagine we’re neighbors. I hate mowing lawns but love baking. You hate baking but love gardening. I mow your lawn; you bake me bread. We both ‘lose’ something we dislike but gain something we value more."  
  - **Whiteboard:**  
    - **Without trade:** Draw arrows: "You fund Hospice (happy), Sister funds Nets (happy)" → Cross out: "But 50% is wasted!"  
    - **With trade:** "You fund Nets (sacrifice), Sister funds Hospice (sacrifice)" → "But you get MORE Hospice funding; she gets MORE Nets funding."  
  - **Why this isn’t bribery (Preempt misconception #2):** "Bribery is secret and corrupt. This is transparent: we agree upfront to redirect *each other’s* money for mutual gain."  
  - **The lever (critical!):** "Trade works when we care *differently* about costs and gains. You *hate* funding Nets less than you *love* extra Hospice money. She feels the same about Nets vs. Hospice."  

  **III. The Central Example: Hospital vs. Textbooks (7 mins)**  
  *Why this example?*  
  - **Neutral:** Unrelated to your real dispute (avoids defensiveness).  
  - **Concrete:** Features measurable good (lives saved, kids educated).  
  - **Asymmetric values:** Clear why trade beats compromise.  
  - **Avoids pitfalls:** No "moral taboos" (unlike bednets/hospice).  

  *Whiteboard story:*  
  - "Two donors: **Anna** (cares about a rural hospital) and **Ben** (cares about school textbooks).  
  - **Without trade:** Each gives $10k to their cause. Result: Hospital saves 10 lives; 100 kids get books.  
  - **Compromise (split):** Each gives $5k to both. Result: Hospital saves 5 lives; 50 kids get books. **Both lose.**  
  - **Trade:** Anna gives $10k to *textbooks*; Ben gives $10k to the *hospital*.  
    - Result: Hospital saves 20 lives (Ben’s priority!); 200 kids get books (Anna’s priority!).  
  - **Why it works:** Anna cares MORE about books than she dislikes hospitals. Ben feels the opposite. Both "sacrifice" but gain *more of their top priority*."  

  **IV. Addressing Your Sister’s Constraint (5 mins)**  
  *When to raise it:* **After** the hospital/textbook example, before applying to your case.  
  - **State it plainly:** "Some believe funding certain things isn’t just ‘less good’—it’s *wrong*, no matter the benefit. My sister feels this way about some causes."  
  - **Honest answer:** "This doesn’t kill trade—it changes what we trade *around*. If funding ‘X’ is truly unthinkable for you, we *never* ask you to fund it. Instead, we find grants where your ‘sacrifice’ is funding something you merely *dislike*, not something immoral. Trade still works if we can agree on what’s ‘tolerable but not ideal’ for each other."  
  - **Preempt misconception #3 ("Acting against convictions"):** "This isn’t selling your soul. It’s redirecting money *within your moral boundaries*. You only fund what you deem acceptable—just not your top choice."  

  **V. Objections: Order & Responses (Preempt as they arise)**  
  1. **"This is just compromise!"** → Counter in **Part I** with split-funding math.  
  2. **"It’s bribery/vote-trading!"** → Neutralize in **Part II** with transparency and mutual gain.  
  3. **"Convictions aren’t for sale!"** → Defuse in **Part IV**: "We only trade within your ‘acceptable’ zone."  
  4. **"Why pay for her mistake?"** → "We don’t debate who’s ‘right.’ We accept we won’t agree and seek mutual gains."  
  5. **"She’d fund hospice anyway!"** → "Without trade, you get *zero* extra hospice funds. Trade gives you *more*."  
  6. **"Overstating hatred?"** → "We start small, with low-stakes trades to build trust."  

  **VI. The Closing Question (2 mins)**  
  **Ask:** *"If we tried this, what’s one cause you’d be willing to ‘sacrifice’ on to get twice as much for your top priority?"*  
  - **Why it works:** Tests grasp of asymmetric value. If they name *anything* (e.g., "I’d fund boring equipment if hospice got double"), the idea landed.  

  **VII. What to Decline (1 min)**  
  - **Openly state:** "I won’t debate *which causes are better* today. That’s a dead end. This is a tool to cooperate *despite* disagreeing."  

  ---

  ### **Why This Flow Works for Your Audience**  
  - **Sister:** Starts with shared frustration. Hospital/textbooks example avoids triggering defenses. Her constraint is honored, not debated.  
  - **Actuary:** Responds to arithmetic of gains/losses. "Waste" frames trade as efficiency.  
  - **Nurse:** Relates to tangible outcomes (lives saved, kids helped).  
  - **No philosophy/economics needed:** Everything is grounded in concrete trade-offs and visible wins.  

  **Final Tip:** End by proposing a *trial*. "Next meeting, let’s pick one low-stakes grant we each dislike (but tolerate) and trade. If it feels like ‘waste,’ we stop." This makes it practical, not theoretical.
