  - Event cards (e.g., epidemic, bumper harvest) are drawn each generation. The impact of an event is conditioned on the current state of the slow variables (so the same event can be catastrophic for one polity and minor for another).
  - At the end of each generation, each team adds one short chronicle entry to a shared sheet. Teams then vote for the most memorable entry (prestige). The actual score (outcome) is based on slow variables (e.g., population, welfare) at the end.
  - Mid-game (generation 6), each team seals a one-sentence prediction of what will determine the final ranking.
  - At the end, teams are given only the chronicle sheet and asked to write a causal explanation for the outcomes. Then we reveal the actual slow variables and scores.

  We want to make visible:
