          - How to prevent: Make the structural effects powerful enough that over 12 generations, they dominate. We can set the growth formula such that high slow variables lead to much higher populations. Also, events are conditioned on structures, so a team with high structures will suffer less from bad events and gain more from good ones. We can also have the initial state matter: if a team invests in structures early, they will start seeing benefits in the middle and late game. 
