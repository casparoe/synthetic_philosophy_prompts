      With Feast: 0.087 + 0.05 = 0.137

  - Event: The instructor draws "Bumper Harvest" (base bonus=0.2)
      Bonus = 0.2 * (Agri/10) = 0.2 * (6/10) = 0.12 -> so total growth = 0.137 + 0.12 = 0.257

  - Population growth: 15 * 0.257 = 3.855 -> increase by 4, so new population = 19.

  - Chronicle: They write: "We invested in terraces and defenses, and celebrated a bountiful harvest."

  - Prestige vote: ... 

  **Minute-by-Minute Timeline**:

  - 0-5 min: Introduction and team assignment.
  - 5-10 min: Distribute materials and explain rules (focus on actions and chronicle, not the lesson).
  - 10-75.5 min: 12 generations, each taking 5.5 minutes (as above).
      - Each generation: 
          - (0.5 min) Update slow variables (from actions 3 gens ago) and display.
          - (2 min) Teams spend 5 LP (record on their board).
          - (0.5 min) Instructor collects actions and places tokens on the future slow variable board.
          - (1 min) Draw one event card and resolve for each team (instructor computes and announces).
          - (0.5 min) Teams update their population.
          - (1 min) Each team writes one chronicle entry.
          - (0.5 min) Teams vote for the most memorable entry (not their own) by show of hands. Instructor awards a prestige token to the winner.
  - At generation 6 (around 10 + 6*5.5 = 43 min mark):
      - After resolving gen6, before gen7: 
          - (2 min) Each team writes a prediction: "The final ranking will be determined by: [factor]." Seal in envelope.
  - Continue until gen12.
  - At gen12 end (75.5 min):
      - (2 min) Compute final scores: score = final population * (average of slow variables)
      - (3 min) Cover the slow variable board. Hand out the chronicle sheet. Teams write causal explanations for the outcomes of all four polities (based on the chronicle only).
      - (2 min) Reveal the slow variables and final scores. Open the mid-game predictions.
  - 82.5-110 min (27.5 min): Debrief (structured as described).

  **Debrief Structure** (last 27.5 min):

     - (5 min) Ask: "What surprised you about the outcome?" and "How did your causal explanation based on the chronicle compare to the actual slow variables?"
     - (5 min) Map game mechanics to concepts:
          - "When you invested in terracing, when did you see the benefit? How did that affect your decisions?" -> lag represents invisibility.
          - "Did the same event affect everyone equally? Why not?" -> events are conditioned by structures.
          - "What kind of things did you write in your chronicle? Why?" -> bias toward events.
          - "How did the prestige you awarded relate to the actual outcome?" -> memorable != important.
          - "What did you predict at generation 6? How did that compare to what you wrote at the end?" -> attribution gap.
     - (5 min) Ask: "In your own words, what should a good historical explanation take into account? How should we divide the explanatory labor between slow structures and events?"
     - (5 min) Introduce the vocabulary: longue durée (structures), conjoncture (medium-term cycles), event (short-term). Relate to the game.
     - (2.5 min) Summary and connect to course readings.

  This design should meet the goals. It is complex, but manageable with good materials and a spreadsheet for the instructor.
answer: |-
  Below is a complete game design tailored to your pedagogical goals, with mechanics that force confrontation with structural constraints, event bias, and the attribution gap. I've refined your sketch for clarity, added realistic numerical systems, and built in safeguards against predictable pitfalls.

  ---

  ### **Game Title**: *The Valley Chronicle*  
  **Core Dynamics**: Teams manage a polity over 12 generations (25 years/generation). Structural investments (e.g., terraces) alter slow variables with a 3-generation lag, while events (e.g., plagues) have variable impacts based on current structures. Players record biased chronicles, then reconstruct history from them.  

  ---

  ### **Materials & Printables**  
  1. **Shared Map**: A valley with 4 regions (North/South/East/West), each with unique features:  
     - *North*: Forest (boosts Environmental Health)  
     - *South*: River (boosts Transport Capacity)  
     - *East*: Mountains (boosts Defense)  
     - *West*: Coast (boosts Trade)  
     [![Valley Map](https://via.placeholder.com/400x300?text=Valley+Map)](print link)  

  2. **Slow Variables Board** (Tracked publicly):  
     | Variable          | Effect on Events                          | Starting Value |  
     |-------------------|------------------------------------------|----------------|  
     | **Env. Health**   | Reduces plague/famine severity           | 3              |  
     | **Transport Cap** | Reduces raid/trade disruption            | 3              |  
     | **Defense**       | Reduces invasion/succession damage       | 3              |  
     | **Food Storage**  | Reduces famine severity; boosts welfare  | 3              |  

  3. **Player Boards** (Per Team):  
     - *Labour Points (LP)*: 5/generation (spent on actions).  
     - *Population*: Starts at 10 (welfare = Pop × avg. slow variables).  
     - *Chronicle Log*: Space to draft entries.  

  4. **Action Cards** (Laminated):  
     | Action           | Cost | Effect (After 3 Generations) |  
     |------------------|------|-------------------------------|  
     | Terracing        | 2 LP | +1 Food Storage              |  
     | Forest Management| 2 LP | +1 Env. Health               |  
     | Harbor Dredging  | 2 LP | +1 Transport Cap             |  
     | Fortify          | 2 LP | +1 Defense                   |  
     | **Celebrate**    | 1 LP | +1 Prestige this gen         |  

  5. **Event Deck** (12 Cards × 4 Copies):  
     | Event            | Base Severity | Lookup Formula (Per Team)                     |  
     |------------------|---------------|------------------------------------------------|  
     | Plague           | 30% pop loss  | = Base × (10 - Env. Health)/10                |  
     | Famine           | 25% pop loss  | = Base × (10 - Food Storage)/10               |  
     | Raid             | 20% pop loss  | = Base × (10 - Transport Cap)/10              |  
     | Invasion         | 35% pop loss  | = Base × (10 - Defense)/10                    |  
     | Bumper Harvest   | +20% pop      | = Base × (Food Storage/10)                    |  
     | Trade Windfall   | +15% pop      | = Base × (Transport Cap/10)                   |  

  6. **Chronicle Sheet** (Shared Poster):  
     - Columns: Generation 1–12. Rows: Team entries (max 20 words/entry).  

  7. **Prestige Tokens**: 12 tokens (1 awarded/generation).  

  ---

  ### **Rules**  
  1. **Each Generation (7 min/generation)**:  
     - **Step 1: Update Slow Variables**  
       Apply actions taken *3 generations ago* to slow variables.  
     - **Step 2: Spend LP**  
       Teams spend 5 LP on actions (structural or Celebrate).  
     - **Step 3: Event Draw**  
       Draw one event card; apply formula to each team using *current* slow variables.  
     - **Step 4: Update Population**  
       Apply event effects: `New Pop = Current Pop × (1 ± Severity)`.  
     - **Step 5: Chronicle & Prestige**  
       Each team adds one chronicle entry. Teams vote for the "most memorable" entry (≠ their own); winner gets +1 Prestige.  

  2. **Mid-Game (Generation 6)**:  
     - Teams seal a prediction: *"Final rankings will be determined by: [factor]."*  

  3. **End-Game (Generation 12)**:  
     - **Actual Score**: `(Final Population) × (Avg. Slow Variables)`  
     - **Prestige Score**: Total tokens.  
     - **Archive Phase**: Cover slow variables board. Teams explain outcomes using *only the chronicle*.  
     - **Reveal & Compare**: Show actual scores, open predictions, and calculate attribution gap.  

  ---

  ### **Worked Example: Generation 3**  
  - *Team North (Starting State)*:  
    Pop: 12, Env. Health: 3, Transport: 4, Defense: 3, Food Storage: 2  
  - **Actions**: Terracing (2 LP), Forest Management (2 LP), Celebrate (1 LP).  
  - **Event Draw**: Plague (Base: 30% loss).  
    Severity = 30% × (10 - 3)/10 = **21%** → Pop loss = 12 × 0.21 = 2.52 → New Pop = **9** (rounded).  
  - **Chronicle Entry**: *"Plague struck! We mourned losses but celebrated our resilience."*  
  - **Prestige Vote**: Entry wins; +1 Prestige.  
  - **Slow Variables**: *No change yet* (actions from Gen 3 will affect Gen 6).  

  ---

  ### **Timeline (110 Min Total)**  
  - **0–10 min**: Setup (assign teams, distribute boards).  
  - **10–75 min**: Generations 1–12 (12 × 5.5 min).  
    - *Gen 6*: Mid-game prediction (2 min).  
  - **75–85 min**: Final scoring, archive phase (teams write explanations).  
  - **85–95 min**: Reveal scores, compare predictions.  
  - **95–110 min**: Debrief (see below).  

  ---

  ### **Debrief Script**  
  Map game moments to historical concepts:  
  1. **3-Gen Lag**: *"When you built terraces in Gen 3, you didn’t see gains until Gen 6. Like real structures, causes are invisible to actors."*  
  2. **Event Lookup**: *"Why did the same plague devastate Team North but spare Team South? Structures set the ‘rules’ for events."*  
  3. **Prestige/Chronicle**: *"You voted for dramatic entries—famines, celebrations. What went unrecorded? Terraces? This bias shapes history."*  
  4. **Predictions vs. Archive**: *"Your Gen 6 predictions focused on structures, but your final explanations used chronicle events. This gap is attribution error."*  
  5. **Prestige vs. Welfare**: *"Team West won Prestige but had low welfare. Memorialization ≠ significance."*  

  **Final Question**: *"In your words, what *should* explain historical outcomes: events, structures, or both? How?"*  
  → *Then* introduce *longue durée/conjoncture/event*.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **A Team Wins on Luck, Ignores Structures**:  
     - *Prevention*: Rig event formulas so high structures reduce max loss (e.g., max plague loss at Env. Health=0 is 30%, but only 5% at Env. Health=8). Slow variables dominate welfare math.  
     - *If happens*: Highlight: *"This *can* happen—but is it replicable? Would 100 valleys show patterns?"*  

  2. **Prestige Vote Becomes Joke Contest**:  
     - *Prevention*: Require entries to include *one action + one event*. Award Prestige only to plausible entries.  
     - *If happens*: *"Even silly chronicles focus on events—reinforcing the bias."*  

  3. **Slow Variables Treated as Resources**:  
     - *Prevention*: Cap variables at 10; diminishing returns past 8. Poor regions (e.g., East’s mountains) need Defense to survive raids.  
     - *Debrief*: *"You *couldn’t* survive invasions without Defense—structures aren’t optimizable, they’re survival constraints."*  

  4. **Archive Feels Like Memory Test**:  
     - *Prevention*: Chronicle is public during gameplay. In archive phase, say: *"You’re historians with only this chronicle—write what it *implies*."*  
     - *Debrief*: Contrast explanations with sealed predictions to show gap.  

  ---

  ### **What the Game Cannot Stage**  
  1. **Timescale Compression**:  
     - 300 years → 110 minutes loses the visceral weight of *longue durée*.  
     - *Mitigation*: In debrief: *"Imagine Gen 1’s terraces affecting your great-grandchildren. That invisibility is central."*  

  2. **Structures as Constitutive (Not Just Constraints)**:  
     - Lookup tables can’t show how structures *redefine* rationality (e.g., "famine" means something different in high/low Food Storage societies).  
     - *Supply in Debrief*: *"Structures don’t just limit options—they shape what people *see* as options. A flooded valley isn’t a ‘problem’ if you’ve always lived on boats."*  

  ---

  ### **Scaling Adjustments**  
  - **For 60 Minutes**:  
    - Run 6 generations (Gen 1–6). Pre-set Gen 1–3 actions (to ensure lag effects). End at Gen 6 archive phase.  
  - **For 8 Students**:  
    - 2 teams of 4. Reduce map to 2 regions. Halve event deck.  

  ---

  ### **Instructor Notes**  
  - **Prep**: Pre-calculate event severities using a spreadsheet.  
  - **Team Shortages**: A 3-player team rotates roles: *Chronicler* (writes entries), *Archivist* (tracks slow variables), *Diplomat* (negotiates votes).  
  - **Key Rigging**: Food Storage/Defense have strongest welfare impact. Teams ignoring them *will* collapse by Gen 8–10 unless extremely lucky.  

  This design forces teams to experience structural invisibility, event bias, and attribution gaps. The debrief transfers gameplay moments to historical concepts without lecturing—setting up your *longue durée* reveal perfectly.
