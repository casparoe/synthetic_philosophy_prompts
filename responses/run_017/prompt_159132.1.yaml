  14. **Debrief**:

      We map game mechanics to historical concepts:

        - The 3-generation lag for structural actions: This represents the invisibility of structural causes in the short term. The benefits (or costs) of these actions are not felt immediately, so they are easily overlooked in narratives focused on immediate events.

        - The event lookup table (conditioning event severity on structures): Shows how the same event can have dramatically different effects depending on the underlying structural conditions. This illustrates that events are not the sole drivers; they operate within an envelope set by structures.

        - Prestige vote and chronicle budget: Each team can only record one thing per generation, and they are rewarded for memorable entries. This mimics the source bias in history: what gets recorded is often the dramatic, eventful, or unusual, not the slow, structural changes. Therefore, the historical record overrepresents events.

