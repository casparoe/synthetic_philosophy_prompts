      c. **Students treat slow variables as just another resource to optimize**:
          - This is partially intended: they are supposed to invest in them. But we want them to see that these variables set the constraints. We can highlight in debrief: "When you decided to build terraces, you were changing the envelope of possibilities for future generations. That change wasn't immediate, so it was hard to connect cause and effect."

      d. **Archive phase feels like a memory test**:
