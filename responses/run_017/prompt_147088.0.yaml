prompt: |-
  ok so this is gonna sound like a homework thing but its not lol. I got nerd sniped over the summer messing around with a spreadsheet and now I can't tell whether I stumbled onto something real or whether I'm just describing something obvious badly.

  The game: each round you pick some fraction of your money and put it down, someone flips a coin that comes up good 60% of the time, if its good you get back double what you put down, if not you lose it. You can play as many rounds as you want and pick a new fraction each round. I had the sheet run a few hundred rounds for a bunch of fixed fractions. What came out:

  1. There's obviously a best fraction (mine landed around a fifth of whatever I had left). But the graph is really lopsided around it. If I bet half of that, I was still growing at maybe three quarters the speed. If I bet double that, growth went to basically nothing and I ended up under where I started, and a bit past that it fell off a cliff. Being too aggressive and being too cautious by the same multiple are not the same size of mistake at all.

  2. The best amount didn't feel like a fact about the bet. When I gave the sheet two identical independent copies of the same game and split my money across both every round, the best total amount to have on the table jumped to nearly double, close to 40%, and I grew about twice as fast.

  3. My friend came up with the weirdest one: if instead of me playing 300 rounds, 300 people each played one round and then everyone split the total equally, the best move is to put down everything you have. Same bet, same odds, and the answer flips to the exact opposite.

  Is there a name for this whole shape of thing, and is it one thing or several? I already found out that the "there's a best fraction" part has a name and a formula, so that's not what I mean. I mean the part where the answer depends on stuff that isn't in the bet at all (how many independent copies you get, whether the winnings get pooled with other people's) plus that lopsided drop-off where going too big is way worse than going too small.

  I don't just want a label to drop in an argument, I want the carving: what exactly is going on, what nearby things it isn't, and where it stops working. Like: does the lopsidedness survive if the bet is a longshot, say it pays 10 to 1 but only hits 1 time in 5? Does it change if I've got money coming in from outside that I can top up with after a bad run? What if you only ever get 3 rounds? If there's already a concept for this, tell me what it covers and what it leaves out, and if there isn't, name it and draw the edges.
reasoning: |-
  Okay, the user is describing a coin-tossing betting game with a 60% win probability and wants to understand three key observations: the asymmetric risk around optimal betting, the effect of multiple independent copies, and the pooled outcome scenario. 

  First, I recognize this as a classic Kelly criterion problem. The optimal fraction (20% in their case) maximizes logarithmic growth. The lopsidedness they observed—where overbetting hurts more than underbetting—is a fundamental property of logarithmic utility. The curvature of the growth rate function explains why: going twice the optimal fraction (40%) collapses growth to near-zero, while half-betting (10%) only reduces it moderately. 

  For their second point about multiple independent games: yes, the total optimal exposure scales linearly. With two uncorrelated games, the optimal per-game bet remains 20%, so total betting approaches 40%. The "twice as fast" growth makes sense because variance is reduced through diversification—this is portfolio optimization in miniature. 

  The pooled outcome result is the most counterintuitive. Here, the objective shifts from median/geometric growth to expected value maximization (arithmetic mean). Since the bet has positive expectation (EV = 0.6*2 + 0.4*0 - 1 = +0.2), betting full capital maximizes expected total wealth. This highlights how risk preferences depend entirely on whether outcomes are aggregated across time (Kelly) or across populations (EV maximization). 

  Now for their deeper questions: The asymmetry persists for longshots (e.g., 10:1 payoff at 10% win rate), but optimal fractions shrink. External income injections would modify the problem—if they can replenish losses, they might tolerate higher risk. For finite rounds (e.g., 3), Kelly still applies but with terminal wealth optimization. 

  The core phenomena here are: 
  - Time aggregation → Kelly criterion 
  - Space aggregation → Expected value maximization 
  - Risk asymmetry → Convexity of logarithmic growth 

  What they're observing isn't one single thing but the interplay between utility functions (log vs linear) and aggregation methods (time series vs cross-section). The boundaries: Kelly assumes repeated play with no bankruptcy constraints; pooling assumes perfect risk-sharing. Breaks down if bets are correlated or if participants have heterogeneous risk aversion.
answer: |-
  You've stumbled into the beautiful and subtle world of **optimal growth theory**, specifically the **Kelly Criterion** and its extensions, interacting with **law of large numbers** effects and the fundamental difference between **time-averaged growth** and **ensemble-averaged outcomes**. Your observations aren't obvious at all—they reveal deep truths about managing risk in repeated, multiplicative processes. Let's carve this up:

  ### The Core Concepts & Your Observations Explained

  1.  **The "Best Fraction" & Lopsided Drop-off: Kelly Criterion**
      *   **What it is:** The Kelly fraction (`f*`) maximizes the long-run *geometric mean growth rate* of your capital. For a simple bet with win probability `p`, win payoff `b` (units returned per unit risked, *including* your stake), and loss probability `q = 1-p`, the formula is:
          `f* = (p * b - q) / b`
      *   **Your Bet:** `p = 0.6` (win prob), `b = 1` (you double your stake, so profit is 1x stake, total return is 2x stake).
          `f* = (0.6 * 1 - 0.4) / 1 = (0.6 - 0.4) / 1 = 0.2` (20%). Matches your finding.
      *   **Why Lopsided?** The growth rate `G(f) = p * ln(1 + b*f) + q * ln(1 - f)`.
          *   **Curvature:** `G(f)` is highly concave (curves downward). This means:
              *   Underbetting (`f < f*`): Growth rate decreases *slowly* as you move away from `f*`. Sacrificing some growth for less volatility is "cheap".
              *   Overbetting (`f > f*`): Growth rate decreases *rapidly*. Beyond a critical point (`f > f*`), `G(f)` becomes *negative* (long-term ruin is certain). This is the "cliff". At `f = 2*f* = 0.4`, `G(f) = 0.6*ln(1.4) + 0.4*ln(0.6) ≈ 0.6*0.336 - 0.4*0.511 ≈ 0.2016 - 0.2044 = -0.0028 < 0`. You go broke slowly. At `f=0.5`, `G(f) = 0.6*ln(1.5) + 0.4*ln(0.5) ≈ 0.6*0.405 - 0.4*0.693 ≈ 0.243 - 0.277 = -0.034 < 0`. Confirms your "fell off a cliff".
          *   **Asymmetric Impact of Losses:** Losing `f`% of your capital requires a gain of more than `f`% to break even. A 50% loss requires a 100% gain to recover. This fundamental math makes large losses disproportionately damaging to long-term growth. Kelly optimally balances the *opportunity* of gains against the *disproportionate damage* of losses.

  2.  **Multiple Independent Copies: Diversification & Portfolio Kelly**
      *   **What Happened:** You created a portfolio of two independent, identical bets. The optimal strategy is to bet the *Kelly fraction* (`f* = 0.2`) on *each* independent bet.
      *   **Why ~40% Total?** Total fraction risked = `2 * f* = 0.4`. This is the **portfolio Kelly fraction**. Each bet gets its optimal allocation *because they are independent*.
      *   **Why ~2x Growth?** The expected log growth rate for the portfolio is `2 * G(f*)` (approximately, assuming independence). Since each bet contributes its maximum possible growth rate independently, the total maximum growth rate scales linearly with the number of independent opportunities (`N * G(f*)`). You're effectively running two optimal growth engines in parallel. The reduced variance from diversification also helps the realized growth rate stay closer to the expected maximum.

  3.  **300 People Pooling: Maximizing Expected Value (Linear Utility)**
      *   **What Happened:** This shifts the objective from *maximizing long-term personal growth (geometric mean)* to *maximizing the expected total wealth of the group after one round (arithmetic mean)*.
      *   **Why Bet Everything?** Calculate the Expected Value (EV) per unit bet:
          EV = `(Prob Win * Net Profit) + (Prob Loss * Net Loss)`
          = `(0.6 * 1) + (0.4 * (-1))` = `0.6 - 0.4 = 0.2` (A massively positive +20% edge!).
      *   **The Math:** Your ending wealth per person if everyone bets fraction `f` is:
          `W = (1/N) * Σ [Individual Outcomes]`
          The *Expected* wealth per person is:
          `E[W] = (1/N) * N * [ (0.6 * (1 + f)) + (0.4 * (1 - f)) ]` = `0.6*(1+f) + 0.4*(1-f)` = `0.6 + 0.6f + 0.4 - 0.4f` = `1 + 0.2f`
          To maximize `E[W] = 1 + 0.2f`, you maximize `f`. Bet it all (`f=1`)! The diversification across 300 people eliminates individual risk through pooling. The group's outcome converges to the expected value. The *variance* of the average outcome per person becomes negligible with large N (Law of Large Numbers). Risk aversion disappears at the group level for a single bet.

  ### The "Name" and the Carving

  *   **The Overarching Framework:** **Optimal Growth Theory** or **Kelly Criterion Investing**. It specifically deals with maximizing the long-run growth rate of capital in repeated, risky opportunities with a multiplicative (compounding) structure.
  *   **The Key Phenomena You Observed:**
      1.  **Asymmetric Risk of Ruin & Concave Growth Function:** This is an intrinsic property of the **Kelly Criterion** itself for any bet with finite outcomes. It stems from the properties of the logarithm in the growth rate function and the disproportionate impact of large losses in multiplicative growth.
      2.  **Scaling with Independent Opportunities:** This is **Portfolio Optimization using the Kelly Criterion**. The core principle is that the optimal total fraction risked scales (approximately linearly) with the number of *truly independent, identical* positive-EV opportunities.
      3.  **Pooling Changing the Objective:** This highlights the **Difference Between Geometric Mean Growth (Time-Averaged) and Arithmetic Mean Growth (Ensemble-Averaged)**. Kelly maximizes the former for an individual over time. Pooling turns a single round into an ensemble average, making maximizing expected value (arithmetic mean) optimal.

  ### Where the Edges Are & Your Specific Questions

  1.  **Does the lopsidedness survive a longshot? (e.g., 10:1 payoff, 10% win rate)**
      *   **Yes, absolutely, and it's often *more* dramatic.** Calculate `f*`:
          `p = 0.1`, `b = 10` (Win: +10x stake, total return = 11x stake).
          `f* = (p*b - q)/b = (0.1*10 - 0.9)/10 = (1 - 0.9)/10 = 0.1/10 = 0.01` (1%).
      *   **Lopsidedness:** Betting `2*f* = 0.02`:
          `G(0.02) = 0.1*ln(1 + 10*0.02) + 0.9*ln(1 - 0.02) = 0.1*ln(1.2) + 0.9*ln(0.98) ≈ 0.1*0.1823 + 0.9*(-0.0202) ≈ 0.01823 - 0.01818 = 0.00005` (Barely positive).
          Betting `0.5*f* = 0.005`:
          `G(0.005) = 0.1*ln(1.05) + 0.9*ln(0.995) ≈ 0.1*0.0488 + 0.9*(-0.00501) ≈ 0.00488 - 0.00451 = 0.00037` (Higher growth than at `2*f*`!).
          Betting `f=0.02` gives very low growth. Betting `f=0.03`:
          `G(0.03) = 0.1*ln(1.3) + 0.9*ln(0.97) ≈ 0.1*0.2624 + 0.9*(-0.03046) ≈ 0.02624 - 0.02741 = -0.00117` (Negative growth, slow ruin). The cliff is sharp. The concavity is extreme because wins are rare but huge, while losses are frequent and compound ruinously if you overbet.

  2.  **Does it change with external top-ups?**
      *   **Significantly, Yes.** Kelly assumes you can only bet your current bankroll. If you have a guaranteed external income stream (`I`) each round independent of your betting outcome, your "effective bankroll" is larger.
      *   **Concept:** Your risk capital becomes `Current Bankroll + Present Value of Future Income`. You can afford to bet a *larger fraction* of your *current* bankroll because the income stream acts as a backstop against ruin. The exact optimal fraction requires solving a modified Kelly problem incorporating the income. The core asymmetry remains, but the optimal `f*` and the location of the "cliff" shift upwards. Betting becomes less risky relative to your total financial resources.

  3.  **What if only 3 rounds?**
      *   **Kelly is less dominant, but the asymmetry persists.** Kelly is asymptotic (infinite rounds). With few rounds, other factors matter:
          *   **Risk Aversion:** A highly risk-averse person might bet *less* than `f*` even for positive EV.
          *   **Specific Goals:** Someone needing to hit a specific target might overbet.
          *   **Probability of Ruin:** With only 3 rounds, the *absolute* probability of going broke might be low even if you bet aggressively (e.g., `f=0.5` needs 3 consecutive losses, prob = `0.4^3 = 0.064`).
      *   **However:** The fundamental math of compounding and the disproportionate impact of large losses still holds. Betting `f > f*` still degrades your *expected geometric mean growth* over those 3 rounds compared to `f*`. Betting `f >> f*` significantly increases your risk of a catastrophic loss that wrecks your final outcome. The optimal strategy for maximizing *median* outcome or minimizing the probability of losing money over the 3 rounds might still resemble fractional Kelly (`< f*`).

  ### Where It Stops Working / Key Boundaries

  1.  **Non-Multiplicative Growth:** Kelly is designed for compounding wealth. If bets have additive payoffs (e.g., fixed dollar gains/losses unrelated to current wealth), Kelly doesn't apply. Maximizing expected value becomes optimal in the long run.
  2.  **Misestimation of Probabilities/Edge:** Kelly is famously sensitive to overestimating your edge (`p` or `b`). If you think `f* = 0.2` but your true edge is lower, betting `0.2` can lead to ruin. "Fractional Kelly" (betting `c * f*` where `0 < c < 1`) is often used for robustness.
  3.  **Correlation:** Your "multiple copies" example assumed independence. If bets are correlated (e.g., different stocks in the same sector), the portfolio Kelly fraction is *not* simply `N * f*`. You need to account for covariance. Betting `N * f*` on correlated bets is a recipe for overbetting and disaster. The optimal total exposure is reduced.
  4.  **Bankruptcy Constraints/Transaction Costs:** Kelly assumes you can bet fractional amounts infinitely and have no bankruptcy costs. Real-world constraints (minimum bet sizes, margin calls, borrowing costs) push optimal fractions down below `f*`.
  5.  **Utility Functions:** Kelly maximizes growth rate (log utility). If your personal utility for wealth is different (e.g., you desperately need $1000 and anything less is worthless), a different strategy (like bold play) might be optimal *for that specific goal*.
  6.  **Finite Horizons:** As seen with 3 rounds, the strict Kelly optimum blurs. The shorter the horizon, the more other considerations (risk tolerance, specific goals) outweigh pure long-term growth maximization. However, the risk asymmetry inherent in multiplicative processes *always* exists.
  7.  **Pooling Limits:** The "bet everything" pooling result requires:
      *   **Perfect Pooling/Risk Sharing:** All gains and losses are perfectly shared.
      *   **Large N:** Law of Large Numbers needs enough participants for the average outcome to converge tightly to the expected value. With small N, individual risk remains, and betting less than everything might be optimal for the group if they are collectively risk-averse.
      *   **Single Round:** The pooling advantage only applies to aggregating outcomes *across individuals in a single instance*. If the 300 people each played 300 rounds themselves, they should *each* use Kelly (`f=0.2`) for their individual sequences.

  ### In Summary

  You've discovered the heart of **optimal growth under uncertainty**. The "shape" involves:
  *   **The Kelly Criterion:** Optimal fraction for long-term multiplicative growth, exhibiting strong asymmetry due to the logarithm and ruin.
  *   **Portfolio Kelly:** Scaling optimal exposure with independent opportunities.
  *   **Time vs. Ensemble Averages:** Kelly (Geometric Mean) for individual repeated play vs. Max EV (Arithmetic Mean) for pooled single-shot outcomes.

  The lopsided drop-off is fundamental to multiplicative processes and survives changes in payoff structure (longshots), though its severity changes. External income and finite horizons modify the optimal *amount* but not the core *shape* of the risk. Pooling fundamentally changes the *objective function* from growth to expected value.

  This isn't just gambling theory; it's the foundation of rational long-term investing, bankroll management in trading, and understanding risk in any compounding endeavor. You weren't just nerd-sniped; you grasped profound principles of managing risk and growth. Well done!
