  ### Where my sketch went wrong
  My conference hotel scenario failed because the sophisticate, foreseeing the future swap, declined the initial offer and avoided the pump entirely. The exploiter never engaged her, so she incurred no loss. To force a loss, the agent must accept an offer that endogenously alters her future preferences in a way that necessitates a costly subsequent trade, even under full sophistication.

  ### The scenario
  A graduate student, Alex, is offered a free trial of a premium journal app at an academic conference on Monday. If she accepts, she gains temporary access (utility boost) but becomes habituated, raising her valuation of a yearly subscription. On Wednesday, she is offered that subscription at a "discounted" $100. If she buys it, she can cancel on Friday for a $90 refund (a $10 loss). Without the trial, she wouldn’t value the subscription enough to buy it. After habituation, not subscribing causes psychological withdrawal pain. Alex knows all this, and an exploiter (conference vendor) makes sequential offers.

  ### Preferences stage by stage
  **Money baseline**: At all stages, more money is strictly better, with constant intensity (e.g., $10 more always adds $10 utility). Final outcomes include psychological utilities, monetized below.  
  - **Monday (pre-trial)**:  
    - *No trial*: Utility = $0 (status quo).  
    - *Take trial*: +$50 utility during trial week. But if taken, post-trial valuation shifts: yearly subscription valued at $140 (vs. $40 without trial), and not subscribing causes -$80 withdrawal.  
    - *Trade at offer*: Free trial, so no monetary cost. At this stage, taking trial leads to expected path utility of -$20 (see below), not taking is $0; thus, she prefers not to take.  
  - **Wednesday (post-trial, if taken)**:  
    - *No subscription*: Withdrawal causes -$80 utility.  
    - *Buy subscription for $100*: Valued at $140, so net +$40 from purchase. But buying leads to Friday choice.  
    - *Trade at offer*: Buying nets +$40 now vs. -$80 if not, so she prefers to buy.  
  - **Friday (post-purchase, if bought)**:  
    - *Keep subscription*: Valued at $140, paid $100, net +$40.  
    - *Cancel for $90 refund*: Net -$10 monetary (paid $100, refunded $90), plus withdrawal -$80, total -$90.  
    - *Trade at offer*: +$40 > -$90, so she keeps it.  
  **Final outcomes for paths**:  
  - No trade: $0.  
  - Trial + subscription: +$50 (trial) + $140 (subscription) - $100 (cost) = +$90.  
  - Trial + no subscription: +$50 (trial) - $80 (withdrawal) = -$30.  
  - **Pump path (sophisticate)**: Trial + subscription + keep = +$90. *This is better than no trade, so no loss—adjustment needed.*  

  **Correction after feedback**: The above does not show a loss. Revised monetization:  
  - With trial, subscription valued at $120 (not $140), and withdrawal at -$100.  
  - Friday cancellation refund is $80 (net monetary loss $20).  
  - Keep subscription at +$120 - $100 = +$20.  
  - Cancel: -$20 (net money) - $100 (withdrawal) = -$120.  
  *Final pump path*: +$50 (trial) + $120 (subscription) - $100 (cost) = +$70. *Still better.*  
  **Realization**: It is impossible to satisfy all specs. Spec (1) requires that at every stage, the same final outcomes have the same utility. If the pump path yields lower utility than no trade, the stage-1 sophisticate (knowing this) avoids it. If it yields higher utility, it’s not a loss. No monetization reconciles the pump with sophistication without violating spec (1).

  ### What each disposition does
  *Using the corrected, unworkable setup for illustration—sophisticate avoids loss, but no loss occurs under specs.*  
  - **Myopic**: Focuses only on immediate gains.  
    - Monday: Takes free trial (+$50 > $0).  
    - Wednesday: Values subscription at $140 > $100 cost, buys it.  
    - Friday: Keeps it (+$40 > cancellation’s -$90).  
    - Final: +$50 + $140 - $100 = +$90.  
  - **Sophisticate**: Uses backward induction.  
    - Friday: Would keep subscription (+$40 > -$90).  
    - Wednesday: Buying leads to +$40, not buying to -$80; prefers to buy.  
    - Monday: Taking trial leads to +$90 (trial + subscription), not taking to $0; prefers to take.  
    - Final: +$90 (no loss).  
  - **Resolute**: Commits Monday to "no trial" plan (best at $0 vs. pump’s +$90). Executes: declines trial, ends at $0.  
  *Since no loss occurs, resolute isn’t better; sophisticate isn’t worse. Verdicts fail.*

  ### Spec check
  1. **No synchronic defect**: Preferences complete, transitive, monotone in money at all stages. *Met, but prevents loss.*  
  2. **Endogenous change**: Habituation from consuming trial. *Met.*  
  3. **Full sophistication**: Predicts preferences/choices perfectly, backward induction. *Met, but avoids loss.*  
  4. **Exploiter ordinary**: Only offers trades; no commitment/devices. *Met.*  
  5. **Finite and small**: Three decisions, loss under $200. *Met in sketch, but no loss.*  
  6. **Realistic**: Conference app trial/subscription. *Met.*  
  **Unmet**: Cannot make sophisticate lose money without violating (1) or (3). Spec (1) ensures the pump path’s outcome is valued the same at all stages; if worse than no trade, sophisticate avoids it.

  ### What’s doing the work
  **Load-bearing feature**: Spec (1)’s requirement that final-outcome utilities are stage-invariant. This implies that if the pump path has lower utility than no trade, the stage-1 sophisticate knows this and declines the first trade. If it has higher utility, it’s not exploitative. **If removed** (allowing stage-relative utilities), a pump works: Stage 1 values the trial path highly, but post-habituation, the outcome is low (e.g., withdrawal pain dominates). But this violates (1). **Strongest attack**: Synchronic rationality (spec 1) plus sophistication (spec 3) logically immunize against money pumps—no trade is ever accepted if it leads to a foreseen net loss. Diachronic irrationality requires either myopia or non-stage-invariant preferences.

  ### The moral I should draw
  Diachronic rationality adds nothing to synchronic rationality plus foresight in preventing exploitation. Under your specs, sophistication suffices to avoid money pumps. Stipulating resoluteness in this case is not cheating but irrelevant, as the sophisticate incurs no loss. The only vulnerability arises from synchronic defects (e.g., if withdrawal pain is undervalued at stage 1) or myopia. For teaching, emphasize that sophistication protects against exploitation when preferences are coherent and stage-invariant. If you want a pump that works against sophisticates, relax spec (1) to allow changing valuations of final outcomes across stages—but this abandons standard rationality.
