prompt: |-
  I co-host a tiny podcast for policy and political-theory people (think: one guest, one hour, no ads, mostly listened to by other grad students) and next week's guest is a political theorist who's spent the last few years defending a variant of futarchy she calls "audited-settlement futarchy". I want to not waste the hour on setup, so I need questions that start where the interesting part starts.

  Setting her up for you, since I'll have to do this on air anyway. In the basic Robin Hanson picture, elected officials democratically fix a measure of national welfare and then conditional prediction markets decide which policy maximizes it: assets that pay off depending on both which policy is adopted and what the welfare index turns out to be, and the policy whose branch trades higher gets adopted. The slogan is "vote on values, bet on beliefs". Her complaint is that in that setup the market is never actually scored on the thing it's supposed to have an opinion about: only one branch of the conditional market is ever realized, so traders get paid for forecasting the world, not for getting the causal effect of the policy right. Her fix: five years after adoption, a standing panel of economists issues an official estimate of what the index *would have been* under the rejected policy, and the conditional markets are settled against that counterfactual estimate rather than against realized welfare. To keep the panel honest she adds a second-order market that trades on what the panel will say, and a big enough divergence between the two triggers a review. (When she presented this in our department someone asked "and who audits the second-order market" and she said "that's a measurement question, not a governance question", which I think is a dodge.)

  Give me nine or ten questions, each with the answer she's most likely to give and then a follow-up keyed to that specific answer. Constraints:

  - Nothing that lets her just restate the mechanism — assume people read the abstract.
  - At least one question on whether conditional market prices are causal claims at all. She'll probably say that a well-informed trader prices the conditional asset by reasoning about the counterfactual, and that market prices are expected counterfactuals rather than correlations. I want the follow-up that asks what it would even mean for such a market to be *wrong* about the counterfactual, and whether a market can build a track record on a quantity that is never observed.
  - At least two questions that make it hard for her to say "that's a measurement question, not a governance question". One route: the panel has to choose a counterfactual method (some kind of synthetic control, a structural model, straight expert elicitation) and rival methods give different numbers, so whoever picks the method is deciding, retroactively, which policies would have won — and traders know that in advance and will price the panel's habits rather than the world. Another route: the second-order market on the panel's report just pushes the same problem up a level; if she answers that the regress stops somewhere at a boring fixed rule, follow up on whether the whole system then inherits whatever credentials that terminal rule has, and why we shouldn't just evaluate *that* directly.
  - One on how manipulation changes once settlement is counterfactual. Her likely reply is that it's harder to sabotage an index nobody observes. Follow-up: you can't move the realized number but you *can* move the estimate — fund the studies, capture the panel, publish the models — so does the attack surface just relocates, and who has the incentive to do it? Also worth pressing her on the more familiar worries: someone with a big position making the adopted policy fail, and the fact that the state is both the decision-maker and the counterparty that has to honor a payout five years and one election later.
  - One on what the contract is even written on. Voters are supposed to keep control of the welfare measure, but the measure can be revised between the trade and the settlement. If she says you settle on the definition frozen at the time of the trade, follow up on whether that means the market is pricing a definition we've since rejected, and whether revising the measure now expropriates people holding open positions.
  - One on horizons and liquidity: settlement five or ten years out, thin or nonexistent markets, original traders gone, and bets whose winners and losers are different generations. If she says the measure can just include long-run components, press her on whether the discount rate inside the index is a value choice smuggled in as measurement.
  - One on the value/belief line itself — the standard objection that values and beliefs don't come apart cleanly. Concrete version: some policies change who is in the population or how the index weights them (migration, fertility, people who don't exist yet), so the market is doing value work. Her answer will be that this is what the measure is for; the follow-up should be about how detailed the measure would have to be to settle all of those questions in advance, i.e. whether she's really proposing a constitution written in the form of an index.
  - One closing question about what would count against the view. She likes to say "run it on city councils and compare", but if the whole point is that the counterfactual is unobservable then the pilot can't discriminate. Ask her to name the observable proxy she'd accept and the result that would make her give the thing up.

  Keep them in spoken English, no jargon dumps, and if a question needs a one-line setup for listeners put it in parentheses after the question. No "how did you get into this" stuff. Typos fine, I'll proably clean it up before recording.
reasoning: |-
  Okay, the user is hosting a podcast and needs sharp questions for a guest promoting "audited-settlement futarchy." They want to skip basic explanations and dive into critical issues. Let me start by understanding the guest's proposal. 

  The core idea is using counterfactual estimates by a panel to settle prediction markets, addressing Hanson's problem that markets aren't scored on causal effects. The user has specific angles they want covered: whether conditional markets reflect causal claims, the regress problem with auditing, manipulation risks, contract definitions, long-term liquidity, the value/belief distinction, and falsifiability.

  First, the causal claims question. The guest will argue traders price counterfactuals. The follow-up needs to challenge how markets can be wrong if counterfactuals are unobservable. Maybe ask how traders learn without feedback, making the market's epistemic basis shaky.

  Next, the measurement regress. The panel's method choice affects outcomes retroactively. If rival methods give different counterfactuals, who picks the method? The guest might defer to governance, but that shifts the problem. Follow up on whether this makes the system depend on the terminal rule's credibility, undermining the market's role.

  Manipulation is another key point. The guest might say counterfactual settlement reduces sabotage since the realized index isn't targeted. But influencing the panel or models becomes the new vulnerability. Press on who can manipulate the estimate and incentives involved, including state as counterparty risks.

  Contract definition: if the welfare measure changes post-trade, settling on the old definition might price outdated values. Follow up on whether this locks in obsolete metrics, creating misalignment with current values.

  Long horizons pose liquidity issues. Markets thin over years, traders exit. If the index includes long-term effects, discount rates become value-laden. Press on whether this smuggles normative choices into measurement.

  The value/belief line blurs when policies affect population composition. The measure must pre-specify weights for unborn or migrant groups. Ask if this turns the index into a constitutional document, demanding impossible detail.

  Finally, falsifiability. Pilots can't observe counterfactuals. Ask for observable proxies and what evidence would disprove the system. The guest might suggest outcome comparisons, but that conflicts with unobservable counterfactuals. Push for concrete criteria.

  Need to ensure each question has a setup for listeners without jargon. Balance depth with clarity. Check all user constraints are met: no mechanism rehash, specific follow-ups, and pressing the "measurement dodge." Structure questions to flow logically, building on previous answers.
answer: |-
  Here are nine focused questions with likely answers and targeted follow-ups, designed to cut straight to the critical tensions in audited-settlement futarchy:

  1.  **Question:** (Given the core problem: conditional markets aren't scored on causation) You argue traders *are* incentivized to price the true causal effect because they reason counterfactually. But if the counterfactual is fundamentally unobservable, what does it even mean for the market price to be *wrong* about it?
      *   *Likely Answer:* "It means the market's collective estimate of the *difference* the policy would have made was inaccurate relative to the best possible analysis – which the panel aims to provide."
      *   **Follow-up:** How do traders *learn* or build expertise on getting this unobservable counterfactual right, if they never receive direct feedback on whether their causal estimate *was* correct in past markets? Doesn't this make the market's 'epistemic engine' fundamentally untestable?

  2.  **Question:** The panel has to *choose a method* to generate the counterfactual estimate (e.g., synthetic control vs. structural model). Different methods often give wildly different answers. Doesn't this mean whoever selects or influences the panel's methodology is, retroactively, deciding which policy *would have won* the market years earlier?
      *   *Likely Answer:* "The methodology needs clear, pre-specified rules established during the value-setting phase. The second-order market provides a check on the panel's adherence to those rules."
      *   **Follow-up:** But if the rules themselves allow discretion or different valid approaches exist, the second-order market isn't just auditing *adherence*, it's implicitly betting on *which valid method the panel will choose*. Doesn't this just push the 'who decides the counterfactual?' question one level up, turning the second-order market into a prediction market about panel behavior, not policy effects?

  3.  **Question:** Following that: You've said "that's a measurement question, not a governance question" about auditing the second-order market. But if the entire legitimacy of the first-order market hinges on the second-order market functioning correctly, and that hinges on a "boring fixed rule" for its settlement, doesn't the whole system then inherit *only* the credibility of that terminal rule? Why add the complex markets if we're ultimately relying on the same old institutional rule?
      *   *Likely Answer:* "The markets aggregate dispersed information *within* the constraints set by the terminal rule. The rule provides a clear anchor, but the market provides the dynamic, information-sensitive judgment."
      *   **Follow-up:** If the terminal rule (e.g., "settle the second-order market based on the panel's final report after a standard review process") is doing the heavy lifting of defining truth, and the market is just predicting *that*, haven't we essentially recreated a system where expert panels (or their reviewers) are the *de facto* deciders, with the market just being a noisy mirror?

  4.  **Question:** (On Manipulation) You argue counterfactual settlement makes it harder to sabotage the realized welfare index to hurt traders. But doesn't it shift the attack surface? Now, actors could try to manipulate the *panel's counterfactual estimate* – funding favorable studies, capturing the panel, or influencing model specifications. Who has the strongest incentive and ability to do this?
      *   *Likely Answer:* "Manipulating a diverse, expert panel under public scrutiny and the watchful eye of a second-order market is far harder than sabotaging a single observable outcome. Losers in the initial market might try, but winners have an equal incentive to counter-manipulate."
      *   **Follow-up:** What about the state itself? It's the ultimate counterparty paying out on these markets years later, potentially to people who bet against its own past decisions. Doesn't a future government, facing a massive payout to opponents, have a huge incentive to lean on the panel or the review process? How is this different from sovereign debt default risk, but for policy truth?

  5.  **Question:** (The Contract) Voters control the definition of national welfare, which can evolve. If a conditional market settles based on the welfare measure *frozen* at the time of the trade, doesn't that mean traders are betting on how a policy affects a definition we might later reject as flawed? Isn't this pricing obsolete values?
      *   *Likely Answer:* "Yes, but that's necessary for contract clarity. Traders need to know exactly what they're betting on. The value-setting process must strive for robust, long-lasting definitions."
      *   **Follow-up:** Doesn't freezing the definition create a perverse incentive? If the definition is revised *after* a trade but *before* settlement, holders of open positions are suddenly exposed to changes in how we measure societal good. Could this lead to political fights over redefining welfare specifically to expropriate certain market players?

  6.  **Question:** (Horizons & Liquidity) Settlement happens 5-10 years post-policy. Markets for such long-dated, complex conditional assets are likely very thin. Original traders may be gone. Aren't you risking markets dominated by a few players or becoming completely illiquid, meaning the price isn't informative?
      *   *Likely Answer:* "Market makers and secondary trading can provide liquidity. The welfare measure can incorporate long-term forecasts or discounting to make the asset value more immediate."
      *   **Follow-up:** If the welfare measure incorporates discounting future effects, hasn't a crucial *value judgment* – the social discount rate – been smuggled into the supposedly 'belief-based' market pricing? Who sets *that* rate, and isn't it inherently value-laden?

  7.  **Question:** (Value/Belief Line) Policies like major immigration reform or pronatalist incentives directly change the population composition that the welfare index aggregates. Doesn't this mean the market, when pricing the effect on the index, *is* making value judgments about who counts and how much, not just factual beliefs?
      *   *Likely Answer:* "This is precisely why defining the welfare measure is the crucial 'values' vote. It must explicitly specify how to handle changing populations, future people, weights, etc."
      *   **Follow-up:** How detailed and pre-specified does this measure need to be? To handle all conceivable policy impacts on the relevant population, wouldn't the welfare index definition essentially need to be a comprehensive constitution, encoding *all* the value judgments upfront? Is that feasible?

  8.  **Question:** (Pilot Feasibility) You've suggested piloting this on city councils. But the core promise is that markets are better than voting at *counterfactual* estimation. Since we can't observe the counterfactual even in a pilot, how could we *possibly* evaluate if the audited futarchy market made a better decision than the status quo? What observable outcome could disprove its effectiveness?
      *   *Likely Answer:* "We compare the *realized* welfare under the policy chosen by futarchy vs. the policy chosen by the status quo process *in similar cities*, or look at aggregate outcomes over many decisions. We see which system leads to better outcomes on the agreed measure."
      *   **Follow-up:** But that abandons the counterfactual claim entirely! If we just compare realized outcomes, we're back to the standard "does this decision-making process produce good results?" test. How does this pilot actually validate the unique claim that markets are better at estimating *the effect of the rejected alternative*, which remains fundamentally unobserved?

  9.  **Closing Question:** Let's say we run this for 20 years. What specific, observable result would make you conclude, "Okay, audited-settlement futarchy isn't working as theorized, we should abandon it"? What's your falsifiability condition?
      *   *Likely Answer:* "Persistent, massive divergences between the second-order market's prediction of the panel report and the actual report *after* review, indicating a fundamental breakdown in the audit mechanism. Or, systematic evidence of manipulation of the panel that the second-order market fails to catch. Or, consistently worse *realized* welfare outcomes compared to robust counterfactuals of what other processes would have done, though that's harder to prove."
      *   **Follow-up (Implicit Challenge):** Notice how even the falsifiability relies either on the *internal* consistency of the audit mechanism (which was the original problem pushed up a level) or retreats to comparing realized outcomes against *another* counterfactual estimate? Doesn't this highlight the fundamental epistemic challenge of building governance around unobservables?

  **Key Threads Pulled:** The questions consistently challenge the *epistemology* of counterfactual markets (Q1, Q2, Q3, Q8, Q9), the *vulnerability to manipulation* in new ways (Q4), the *practical implementation* of key components (Q5, Q6, Q7), and the *feasibility of empirical validation* (Q8, Q9). They force engagement beyond the "measurement dodge" and probe the core tensions between the theoretical elegance and practical governance. Good luck with the interview!
