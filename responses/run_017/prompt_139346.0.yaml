prompt: |-
  i'm TAing my first solo section this term, 50 minutes, first-years, and next week i have to do causation by omission. They've just come off two weeks of Humean regularity stuff and Mackie-style INUS conditions, and they haven't done counterfactuals or possible worlds properly, so I'd rather not lean on "in the nearest world where..." if I can avoid it. I tried this last year with the plant that died because nobody watered it and it went badly: within ninety seconds someone said "so the Queen of England killed your plant," everyone agreed that was absurd, half of them concluded omissions can't be causes and the other half concluded that everything is a cause, and I had no move ready for either. So: don't explain causation by omission to me — I want a plan for how to teach it.

  What I'd like most is the order. What has to be on the board before "can a not-doing be a cause?" even feels like a real question rather than a verbal trick, given where these students are (they're happy talking about INUS conditions and drawing little sufficient-condition diagrams, and they currently think causation is a relation between events that happen)? Where does the "fine, but when and where did the not-watering happen?" worry fit — before the metaphysical "are absences things?" bit, after it, or should I skip that bit entirely at this level? And does the counterfactual way of putting it have to be smuggled in early anyway even though they don't have the machinery for it? For the carrying example I want one case, not three, that does the whole job: tell me what structural features it has to have and what it has to lack (my guess is exactly one person with a standing reason to act, nothing positive happening at all between the last chance to act and the outcome, and a counterfactual that is realistic rather than silly), why the plant fails — I think because it's too easy to reconstrue as a positive act, or because the real cause is obviously the sun and the dryness — and why the lurid medical cases will derail us into blame before we've even got the puzzle.

  Then the misconceptions, including the ones I've named myself, and the exact point in the sequence where each should be headed off: what I've been calling positive reconstrual — they turn the omission back into an action, "he chose to sit there," "she was doing something else instead" — which I think is the dangerous one because it makes the topic dissolve instead of getting answered; profligacy panic, the Queen of England line, which ate my whole class last year; the slide from cause to blame, which I suspect is what's really driving the "of course not" intuition; and the shrug where they decide it's just counterfactual dependence and move on. I've also been toying with a distinction I made up, between bare omissions (nobody had any reason whatsoever to expect you to act) and loaded omissions (there's a role, a practice, a standing expectation that you would): tell me whether bringing that in early gives me a clean way to handle profligacy without ending up having quietly substituted norms for causation, or whether it just teaches them that what causes what depends on what we expect of people — and if it's the latter, whether that's a bug I should hide for a week or a feature I should own out loud. Finally, what should I openly refuse to settle in fifty minutes and say out loud that I'm refusing (I'm guessing the legal act/omission doctrine, any structural-equation or difference-making formalism, and the free-will-adjacent material, but you tell me), and one question for the last five minutes that would actually show me they've grasped the shape of the problem rather than just picked a verdict.
reasoning: |-
  Okay, the user is a TA preparing to teach causation by omission to first-year students. They had a bad experience last year with the plant example, leading to confusion. They need a structured lesson plan that avoids counterfactuals since students haven't covered possible worlds yet. The students are familiar with Humean regularity and INUS conditions.

  First, I need to figure out how to frame the question so it doesn't feel like a trick. The students think causation is between events that happen. So maybe start by reviewing event causation with INUS diagrams. Use a medical example where a positive action causes harm, like giving the wrong medication. Then, tweak it to an omission—nurse failing to give medication. This contrast shows omission as a cause within their existing framework.

  Next, the user mentioned problems with the plant example. Why did it fail? The Queen of England objection happened because there were no constraints on who should water the plant. So the solution is to introduce a "designated omitter" role. Use an example with a clear responsibility, like a lifeguard not saving a drowning person. That prevents the profligacy issue. Also, avoid multiple candidates or positive events overshadowing the omission.

  The user wants to address misconceptions. The positive reconstrual (turning omission into an action) can be blocked by emphasizing the absence of action. Use a case where the person is incapacitated, so they couldn't have acted. Profligacy panic is handled by the designated role. The blame vs. causation confusion needs explicit separation—state that causation is descriptive, blame is normative. 

  Should I introduce the bare vs. loaded omission distinction? It might help with profligacy by focusing on expectations, but there's a risk of conflating norms with causation. The user should introduce it carefully, clarifying that the causal claim depends on the context of expectations, but the dependence itself is factual. Use it as a tool, not a solution.

  Structural features for the example: one responsible person, no positive events, realistic counterfactual. Avoid medical cases to prevent blame discussions. The lifeguard example fits well. 

  What to avoid: legal distinctions, formalisms, free will. End with a question that tests understanding, like asking why the lifeguard's omission caused death but a passerby's didn't, linking back to INUS conditions. 

  Sequence: Review event causation → Contrast with omission using responsible agent → Address absences as events? → Handle misconceptions → Designated role → Bare vs. loaded distinction → Conclude with question.
answer: |-
  Here’s a battle-tested 50-minute lesson plan for causation by omission, designed to sidestep past pitfalls and meet your constraints. Focus on **structure, preemptive misconception-blocking, and leveraging INUS familiarity**.

  ---

  ### **Lesson Sequence (50 min)**
  **GOAL:** Students leave seeing omissions *as potential INUS conditions* within a context of expectations, without collapsing into profligacy/blame.

  1.  **Review & Anchor in Event Causation (5 min)**
      *   **On Board:** INUS diagram (e.g., Fire: Oxygen + Fuel + Ignition Source [*match strike*]).
      *   **Q:** "What *happened* (event) that was a necessary part of the sufficient condition? (*Match struck*)".
      *   **Emphasize:** Causation (so far) = relation between *occurring events*. Causes are *things that happen*.

  2.  **Introduce Omission via INUS Contrast (10 min)**
      *   **Case 1 (Positive Action):** Nurse *administers* wrong drug (Drug X) → Patient dies. (INUS: Pre-existing condition + Wrong Drug Administered → Death)
      *   **Case 2 (Omission):** Nurse *fails* to administer *required* drug (Drug Y) → Patient dies. (INUS: Pre-existing condition + *Absence of Drug Y* → Death)
      *   **Crucial Moves:**
          *   Frame the omission *within the INUS diagram*: "**Absence of Drug Y**" is a box in the diagram, just like "Match strike" was.
          *   **Q:** "Is there a *causal difference* between Case 1 and Case 2 for the patient?" (Goal: Intuition that *for the patient*, both led to death similarly).
          *   **Plant Failure Diagnosis:** Your plant case lacked this explicit *contrast* and the INUS anchor. Jumped straight to "not-watering" as a free-floating cause.

  3.  **The "Where/When?" Worry & Metaphysical Dodge (5 min)**
      *   **Anticipate:** "But WHERE was the not-watering? WHEN did it happen? It's not an *event*!"
      *   **Board:** "The 'Event' Problem: Omissions aren't happenings. So how can they be causes?"
      *   **Your Move:** "Let's *bracket* the deep metaphysics for now ('Are absences real things?'). Focus on the *role* 'Absence of X' plays in the *explanation* of the outcome, just like we saw in the INUS diagram. It's a *condition* that needed to be *present* (or rather, *absent*!) for the outcome to occur, given the other factors. The 'when' is often the *time window* where acting could have prevented it."
      *   **Why here?** Prevents early derailment into ontology. Grounds the omission in its *functional role* within a causal story they understand (INUS).

  4.  **Introduce the "Designated Omitter" - Your Key Structural Feature (15 min)**
      *   **The Core Case (Lifeguard):** A fully alert, on-duty lifeguard, paid and trained, sitting in the chair on a calm day, sees a single swimmer *clearly* start drowning right in front of them within easy rescue reach. Lifeguard does nothing. Swimmer drowns.
      *   **INUS Diagram:** (Pre-existing vulnerability + Drowning Event + ***Absence of Lifeguard Intervention*** → Death)
      *   **Why this case works (avoids plant pitfalls):**
          *   **One Designated Agent:** Clear, context-specific role/responsibility (blocks Queen of England).
          *   **No Positive Intervening Events:** No rogue wave, no heart attack – just the drowning unfolding and *no action*.
          *   **Realistic Counterfactual (implied):** "If the lifeguard had intervened (standard procedure), the swimmer *would* have been saved." (Don't need "nearest world" – use their Humean expectations).
          *   **Minimal Blame Distraction:** Focus on *causal role*: "Did the *lack of their action* play a necessary part in the sufficient condition for death, *given their role here*?"
      *   **Contrast with Plant:** Plant lacked a "designated waterer." Queen objection exploited this ambiguity. Lifeguard has an explicit role defining *who* the relevant potential intervener is.

  5.  **Bare vs. Loaded Omission - Your Distinction (5 min)**
      *   **Board:** "Bare Omission: No expectation/practice points to *anyone specific* acting (e.g., *any* random passerby noticing the plant wilting)."
      *   **Board:** "Loaded Omission: A context, role, agreement, or practice creates an expectation *that a specific agent* would/should act (e.g., Lifeguard, Nurse, Parent feeding child)."
      *   **How to Use It:**
          *   **Addresses Profligacy:** "Causation by omission *typically* makes sense in **Loaded** contexts. It's about the *absence of action from the agent(s) where there was a contextually grounded expectation/potential for them to act*. This avoids 'everything is a cause'."
          *   **Own the Normative Link (Feature, not Bug):** "The *expectation* (the 'loaded' part) often comes from norms, roles, or agreements. But! The *causal claim itself* is about whether the *absence of that specific action*, given that expectation *in this situation*, was a necessary part of the story (like in our INUS diagram). We're describing a factual dependence *within a normative context*, not saying norms *are* the cause."
      *   **Plant Redux:** The plant was likely presented as a *Bare* omission ("nobody watered it"), inviting profligacy. Framing it as a Loaded omission ("*the person hired to water it* didn't show up") would have helped.

  6.  **Tackling Misconceptions Head-On (7 min)**
      *   **Positive Reconstrual ("They chose not to!"):**
          *   *Block:* "Even if they *chose* not to act, *what caused the death*? The death depended on the *absence of the saving action* during that critical window. Their internal choice might explain *why* they omitted, but the causal gap in the world was the *lack of intervention*." Use Lifeguard: "Suppose they were paralyzed by fear and couldn't physically move? The *absence of action* still seems causally necessary."
      *   **Profligacy Panic (Queen of England):**
          *   *Block:* "Because it's **Loaded omission**! The Queen had no role, duty, or expectation to water *that specific plant*. The lifeguard *did* have a specific role to save *that specific swimmer*. Causation by omission isn't about *any* possible preventer; it's about the absence of action *from the source where it was contextually expected*."
      *   **Blame vs. Cause Confusion:**
          *   *Block Explicitly:* "**CRITICAL DISTINCTION:** Saying an omission *caused* harm is *not* the same as saying the person is *blameworthy*. Maybe the lifeguard had a sudden mental breakdown (excuse). Maybe the nurse's chart was wrong (justification). *Causation is descriptive* – did the lack of action play that INUS role? *Blame is normative* – was it their fault? We're *only* talking about causation today." Hammer this *during* the Lifeguard/Nurse examples.
      *   **Shrug (It's just counterfactuals):**
          *   *Block:* "Counterfactual dependence (*If X had acted, Y would not have happened*) is a *sign* of causation by omission, especially in Loaded cases. But our INUS framework helps us see *why* it matters and how it fits into a broader causal picture, not just a binary dependence. It shows *what condition was missing*."

  7.  **What We Are NOT Doing (Explicitly) (2 min)**
      *   "We are **NOT** deciding legal liability (Act/Omission doctrine)."
      *   "We are **NOT** diving into possible worlds semantics for counterfactuals."
      *   "We are **NOT** solving free will or moral responsibility today (though it connects!)."
      *   "We are **NOT** using structural equations (yet!)."

  8.  **Closing Question (Last 1 min)**
      *   **"Q:** In the Lifeguard case, why does the *Absence of Lifeguard Intervention* count as a potential cause within our INUS framework, while the *Absence of Action by a Random Passerby* (who also could have jumped in) does *not* create the same kind of causal claim about the death?"
      *   **Why this works:** Tests grasp of **Loaded vs. Bare** omission and its link to the **contextual expectation** defining the relevant potential cause. It forces them to apply the key structural feature (designated role) and separates causation from mere possibility.

  ---

  ### **Why This Plan Works**

  *   **Builds on INUS:** Omissions become "Absence of X" boxes in familiar diagrams.
  *   **Solves Plant Problem:** "Designated Omitter" + "Loaded Omission" blocks profligacy. Clear role defines *whose* omission matters.
  *   **Preempts Misconceptions:** Addresses reconstrual, profligacy, and blame/cause confusion *in the flow* with targeted examples and explicit distinctions.
  *   **Manages Metaphysics:** Bracket "events" by focusing on causal role/function within explanation.
  *   **Handles Counterfactuals Lightly:** Uses intuitive, expectation-based counterfactuals without formalism ("If they had done their job...").
  *   **Owns Normativity:** Uses the norm-based "Loaded" context explicitly as a *scope restrictor* for relevant omissions, while maintaining the causal claim is factual *within that scope*.
  *   **Clear Boundaries:** Explicitly states off-limits topics.
  *   **Strong Closing Q:** Directly tests understanding of the core mechanism (Loaded omission).

  **Key Takeaway for Students:** Omissions (specifically *Loaded* omissions) can be causes understood as the *absence of an expected action* functioning as an INUS condition – a necessary missing part of a sufficient set for the outcome. This avoids absurdity by tying relevant omissions to specific agents in specific contexts. Blame is a separate issue.

  Good luck! This structure gives you clear moves against the common derailments. Remember to **hammer the cause/blame distinction** relentlessly whenever a moral tone creeps in.
