answer: |-
  Here are your five beats:

  1.  For thirty years, Ray ran a secret sports-betting syndicate from a strip mall, telling his dear mother he was in "logistics". That wasn't a lie about the work, just a gentle edit for the audience. His real logistics were odds, edges, and protecting a bankroll with a discipline most of us only read about in textbooks.
  2.  Ray understood something profound: the biggest mistake isn't losing a bet, it's betting so much that one loss breaks you. That's why he always bet half of what the cold math suggested was optimal – because he never fully trusted his own edge. He understood humility was part of the calculation.
  3.  His real genius wasn't just the Kelly math; it was the "floor rule" he talked about this past year. Ray didn't just aim to grow wealth *on average*. He named a floor – a level he absolutely refused to fall below – and then played to maximize the growth of his cushion *above* that survival line. For him, survival wasn't a hope, it was the foundation.
  4.  Of course, life asks us to protect multiple floors. Ray had two bedrock ones: the syndicate's bankroll, and his marriage. He protected the bankroll perfectly, with that floor rule discipline. And he’d be the first to tell you, with that wry smile, that he learned – sometimes the hard way – which of those two foundations needed a different kind of betting strategy. You never bet the house.
  5.  So, raise your glasses to Uncle Ray: a man who deeply understood that true success isn't about the averages, but about guarding your floor, knowing which bets are too big even when the edge seems sure, and having the wisdom to see where the imperfect math of life needs a heavier dose of heart. To Ray!

  **Why this works:**
  *   **Structure:** Follows the 5-beat order, ends with the toast.
  *   **Accessibility:** Explains concepts simply ("floor", "survival line", "never bet the house", "humility was part of the calculation") without jargon. The "logistics" anecdote humanizes it immediately.
  *   **Finance Crowd:** They hear "half-Kelly", "maximize growth above a floor", "protecting a bankroll", "imperfect math" – all precise references without needing the terms.
  *   **Anti-Platitude:** Explicitly contrasts "on average" with Ray's floor-based survival focus. Avoids "long run" or "evens out" consolations.
  *   **Floor Rule:** Central to beat 3 and 4. Introduces the concept clearly and applies it to his dual challenge.
  *   **The Unsolved Part:** Beat 4 directly addresses the two floors ("syndicate's bankroll, and his marriage"), states he got one right, acknowledges he learned about the other "sometimes the hard way", and uses the key phrase "different kind of betting strategy" and the literal/metaphorical "You never bet the house".
  *   **Affection:** Focuses on his discipline ("gentle edit", "profound", "genius", "discipline", "wisdom"), humility, and the wry self-awareness implied in "he’d be the first to tell you". The "imperfect math of life... heavier dose of heart" ending lands warmly on the personal sacrifice.
  *   **Gambling Metaphors:** "Never bet the house" works literally (gambling term) and metaphorically (family understands protecting the home/family). "Which bets are too big" is clear in both contexts.
