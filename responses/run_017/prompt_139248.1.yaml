prompt: |-
  Hey, I'm hoping you can help me sort out something I've been going back and forth on for months: when is it actually ok to take someone else's word for a moral question instead of working it out for yourself? Some philosopher I half-remember thinks there's something specifically bad about moral deference as opposed to, say, deferring to a mechanic about your car, and I feel the pull of that, but my gut reactions on actual cases are all over the place. I'll list them and you tell me whether there's a principle here or whether I'm just being inconsistent.

  1. My friend Priya has thought about animals for fifteen years and tells me eating meat is wrong. I can't reconstruct her argument, I just trust her. I stop eating meat. Verdict: I'd do it, but I feel like I'm missing something — I'd be embarassed to say out loud "I think it's wrong because Priya thinks so."

  2. I used my roommate's bike without asking. She says "honestly, totally fine, I don't mind at all." Her saying it seems to *settle* it — not just give me evidence that it was fine, but make it fine. Verdict: deference here isn't second-best at all, it's authoritative.

  3. Same bike, except she's away and her best friend tells me "she really wouldn't mind, I know her." Verdict: that's just evidence, it doesn't settle anything, I'd still owe her an apology. Which is odd, because the friend probably predicts her reaction about as well as she does herself.

  4. A hospice nurse I work with tells me I'm weighting things wrong: in end-of-life cases the family just being in the room matters much more than I think it does, and less turns on the clinical facts than I assume. I defer. Verdict: totally fine, and after a month on the ward I start seeing it myself — the deference taught me to see something.

  5. My brother's partner cheated on him. A chatbot gives me a sensible answer to "should I tell him?" (no — it's his relationship, you'll be cast as the villain, you're protecting yourself not him). A friend gives me word-for-word the same reasoning. Verdict: taking the friend's answer is fine; taking the chatbot's feels cheap and sort of fake, even though the chatbot is arguably drawing on way more moral experience than one friend has, and even though I'd be fine reading the identical sentence in an advice column by someone with a track record.

  6. A well-run study convinces me that people in my demographic systematically underrate how much a certain kind of comment stings. So I now follow a rubric at work instead of my own read of each individual case, even when the rubric disagrees with what I'd have said. Verdict: not merely fine — refusing to do this feels like arrogance. Note this is pure bottom-line verdict-following with zero understanding attached, and it seems mandatory.

  7. There's a custom in a community I've joined about who's allowed to speak at meetings, tied to seniority I don't really grasp. I just follow it. Verdict: fine, and insisting on arriving at my own verdict first would be a kind of arrogance. Again: bare verdict, no understanding, no problem.

  8. My mentor says: "stop asking me — you have to work out for yourself whether to quit." Verdict: I should listen to her about this, and it doesn't feel self-undermining, but I can't tell whether that's a coherent response or whether I've just been told to stop doing something by someone I defer to.

  9. I've deferred to my partner on basically every household fairness question for years. Each individual deference seemed fine at the time. But now I notice I have no grip on the topic at all, and that feels like a real loss that I never agreed to. Verdict: something went wrong here even though nothing went wrong on any particular occasion.

  10. Deferring to what I told myself years ago about how to handle something (a promise I made to a relative who was dying) feels different in kind from deferring to a friend's advice: more binding, and barely like deference at all. Verdict: fine, and I suspect it isn't really the same phenomenon.

  My best attempt at a principle: it's ok to defer about *how much* things matter, and it's ok to defer when it's the other person's own claim being waived, but it's not ok to defer on the bottom-line verdict of what to do. Cases 6 and 7 make that look dead on arrival, and case 1 sort of does too. So: is there a principle that gets all ten, or do I have to give one up — and if you have to choose between a messy principle that saves every verdict and a clean one that overturns a couple, which do you prefer and why?

  Two more things. First, the case I actually keep flip-flopping on: my sister says I'm being cruel to my mom by moving abroad; my friend, whose parent is also ill, says I'm not and that I'm being guilt-tripped. Who, if anyone, should I defer to, and what does your principle say about *picking* someone to defer to when the candidates disagree? Second, I've started distinguishing taking someone's word for it, taking their advice, and handing the decision over entirely — is that distinction doing any real work, or am I inventing it to dodge the question?

  Please give me one or two candidate principles stated precisely, say which case motivates each clause, tell me what it predicts about a case I haven't listed, and be honest about which of my verdicts it can't accommodate. Casual register is fine, no need for citations. At the very end, put a last line in this exact form:

  \answer{principle: <your principle in one clause> | verdicts overturned: <case numbers, or none>}
reasoning: |-
  Okay, let me tackle this user's moral deference dilemma. They've provided ten detailed cases where they defer to others on moral questions, each with their own intuitive verdict. The user is struggling to find a consistent principle that explains all these judgments without contradiction. 

  First, I need to understand the core tension. The user feels moral deference is problematic in theory (as some philosophers argue), but their practical examples show it's sometimes necessary or even mandatory. Their proposed principle (deferring only on "how much" things matter or when waiving claims) fails cases like 6 and 7 where bottom-line verdict deference seems justified. 

  Looking at the cases: Some patterns emerge. When deference involves personal authority (case 2: roommate consent), it feels binding. When it's about epistemic expertise (case 4: hospice nurse), it's a learning tool. But when it replaces moral agency (case 9: household fairness), it causes erosion. The chatbot vs friend case (5) highlights relational dimensions - we resist deference without human connection. 

  For a candidate principle, I'm considering: Deference is proper when (1) the other has legitimate standing in the domain, AND (2) it preserves/develops your moral agency. This explains: 
  - Case 2 (roommate has standing re: her property) 
  - Case 4 (nurse has expertise, helps you grow)
  - Case 9 violation (eroded agency over time)
  - Why chatbot feels wrong (no relational standing) 

  But it struggles with case 1 (vegetarianism) - Priya has expertise but user feels embarrassed about pure verdict deference. Maybe because moral conclusions require personal integration? 

  Alternative principle: Deference is permissible when the alternative is either (a) practical impossibility of self-determination (case 7: complex customs) or (b) greater moral risk than deference (case 6: bias correction). This handles cases 6-7 well but fails case 5's chatbot objection. 

  For their flip-flop case: Moving abroad while mom is ill. Neither sister nor friend has automatic standing - sister is emotionally involved, friend has parallel experience but not direct insight. The principle suggests: Defer provisionally to gain perspective, but integrate with own judgment. The key is whether deference helps clarify rather than replace their moral reasoning. 

  The advice/word/handover distinction matters: Handing over decisions (like case 9) risks agency erosion, while taking advice (case 5 friend) preserves autonomy. 

  Final principle: Moral deference is legitimate when the source has appropriate standing (expertise/authority/relationship) AND it functions as epistemic scaffolding rather than replacement of judgment. Overturns nothing - case 1's embarrassment reflects healthy unease about skipping integration work, not wrongdoing.
answer: |-
  Here's a crack at unifying your intuitions. Your cases reveal that *when, why, and to whom* you defer matters more than whether you defer to a "bottom-line verdict." The key is **standing** and **function**.

  ### Candidate Principle 1: The Scaffolding Principle  
  *Deference is legitimate when:  
  (a) The source has **appropriate standing** (expertise, authority, or personal stake), AND  
  (b) It **scaffolds your moral agency** (enables learning, respects autonomy, or acknowledges relational boundaries) rather than replacing it.*

  - **Motivated by**:  
    - (a) Case 4 (nurse’s expertise), Case 2 (roommate’s authority over her property), Case 7 (community’s authority over its norms).  
    - (b) Case 6 (correcting bias → agency improvement), Case 8 (mentor forcing self-reliance → agency development), Case 9 violation (eroded agency).  
  - **Predicts**: Deferring to a therapist about your own trauma responses is fine (expert scaffolding). Deferring to a stranger’s verdict on your career choice isn’t (no standing/scaffolding).  
  - **Overturns**: None! But clarifies your discomfort:  
    - Case 1: Priya has expertise (a), but if you *never* engage (failing b), it’s hollow. Your embarrassment signals the need to internalize it.  
    - Case 5: Friend scaffolds (shared context/relationship); chatbot lacks relational standing. Advice column works if you see the author as a proxy mentor (scaffolding).  
    - Case 3: Best friend has predictive skill but *no authority* to waive the roommate’s claim (standing mismatch).  

  ### Candidate Principle 2: The Domain Sovereignty Principle  
  *Deference is legitimate when the moral claim **originates from** or **directly governs** the source’s own domain (rights, relationships, or role-bound knowledge), OR when your own judgment is systemically unreliable in that domain.*  

  - **Motivated by**:  
    - Case 2 (roommate’s property → her sovereignty), Case 6 (your bias → systemic unreliability), Case 7 (community norms → their sovereignty).  
    - Case 10 violation: Your past self has sovereignty over your promises.  
  - **Predicts**: Deferring to a victim about the harm they experienced is obligatory (sovereignty). Deferring to them about an unrelated political issue isn’t.  
  - **Overturns**:  
    - Case 4: Nurse has role-bound knowledge (ok), but not "sovereignty." Might feel overfit.  
    - Case 9: Household fairness *is* a shared domain – your partner claiming sovereignty might be the problem.  

  ---

  ### Your Flip-Flop Case: Moving Abroad  
  - **Principle 1 says**: Neither your sister nor friend has automatic standing. Your sister is emotionally invested (potential bias), your friend has parallel experience but not direct insight into *your* mom. Defer *provisionally* to gather perspectives, but integrate into your own judgment (scaffolding). If your sister’s claim is really about *her* feelings ("I’ll be alone caring for Mom"), that’s her domain – address that.  
  - **Principle 2 says**: Your mom’s care is a shared relational domain. If your sister is a primary caregiver, her operational needs matter. But the "cruelty" verdict is *your* moral agency – don’t outsource it. Use their input as data, not verdicts.  
  - **Verdict**: Don’t defer to either’s *verdict*. Scaffold your judgment with their experiences.  

  ### Your Distinction (Word/Advice/Handover)  
  - **It matters**:  
    - *Taking their word*: Accepting a factual/moral claim (Case 1, 6).  
    - *Taking advice*: Weighing input but owning the decision (Case 5 friend).  
    - *Handing over*: Surrendering agency (Case 9 pattern → corrosive).  
  - Case 2 is unique: Consent isn’t deference – it’s *transfer of permission*. You’re not judging; you’re complying.  

  ---

  ### Final Answer  
  **Principle 1 (Scaffolding) wins**. It preserves all your verdicts by emphasizing *why* deference works (or doesn’t) in each case. Principle 2 is cleaner but struggles with expertise (Case 4) and relational growth (Case 9). Your discomfort in Case 1 isn’t wrong – it’s a warning that scaffolding requires eventual integration.  

  \answer{principle: Deference is legitimate when the source has appropriate standing and it scaffolds moral agency rather than replacing it. | verdicts overturned: none}
