prompt: |-
  I work in survey methodology and quantitative ecology. Most of my professional life is spent on designs where sampling probabilities are unequal: size-biased and length-biased sampling, capture–recapture estimation of population size, frame over- and under-coverage, and the design-based versus model-based (superpopulation) ways of arguing about the same estimator. Inclusion probabilities, Horvitz–Thompson weighting, the inspection paradox, tag loss, and the way a stopping rule changes the sample space are things I use rather than things I need explained.

  What I want is a translation of the anthropics debate — the self-sampling assumption, the self-indication assumption, and the presumptuous philosopher case — into that vocabulary, as faithfully as it can be done, followed by a report on what the translation fails to carry.

  Here is my understanding, which you should audit as you translate rather than take over. SSA, as I read it, is not a prior but a conditional sampling model: conditional on a hypothesis, my credence that I am any particular observer in the reference class is uniform, one over the number of observers in it, so the anthropic update comes entirely from more specific indexical evidence such as my birth rank. SIA is a constraint on the prior over hypotheses instead: before conditioning on anything indexical, each hypothesis is weighted by how many observers it contains, so that the bare fact that I exist is itself evidence, and in the presumptuous philosopher case the large-population hypothesis wins by the ratio of the populations, which is what makes the conclusion feel presumptuous. I have also seen it claimed that once SIA is combined with SSA, the doomsday-style shift from birth rank cancels and you end where your unanthropic prior put you. If any of that is a misreading, correct it inside the translation.

  Please do the following.

  1. Give me the systematic mapping. Pair SSA with design-based finite-population inference, where the unknown parameter includes the population size itself, as in estimating N from recaptures, and where the frame and its inclusion probabilities are fixed before the draw; pair SIA with a model-based superpopulation picture in which the number of units functions as a size-biasing weight on the draw. Then tell me whether the size bias in SIA really is the inspection paradox, or whether the resemblance is superficial.

  2. Work two cases in the mapped vocabulary, as likelihoods, inclusion probabilities, and estimators: the presumptuous philosopher, and a birth-rank or doomsday-style case. For the second, tell me whether the alleged cancellation is an identity, a consequence of a particular choice of reference class, or an artifact of the mapping.

  3. Adjudicate my recurring referee question. In my field the frame is stipulated by the designer, and its defects are called coverage error, which is a practical problem about bias, not a metaphysical question about which frame is correct. So: does the reference class problem have any home in my vocabulary at all? Is it undercoverage, or is it something the vocabulary cannot express?

  4. Give me the residue report: what has no counterpart on my side. I would like you to rule specifically on four candidates. First, pure self-locating uncertainty: once a unit is drawn, the sampler reads its label, and the nearest thing I have to a draw whose identity is unknown is uncertain identification in capture–recapture — is that a genuine counterpart to not knowing which observer I am, or does it smuggle in knowledge the anthropic case lacks? Second, the fact that this is an n-of-one design that cannot be repeated or re-randomized, so design-unbiasedness and interval coverage have nothing to be defined over. Third, hypotheses in which no observer exists and hypotheses with infinitely many observers, both of which my vocabulary handles by convention rather than by argument. Fourth, whether de se evidence can move credence at all, given that nothing in a sampling design distinguishes an observation from the inside.

  5. Finally, two constructions of my own that I cannot finish. Call the first the over-coverage model: the frame contains unfilled slots as well as occupied ones, and I conditionalize on having landed in an occupied slot. Call the second the renewal reading: in a renewal process, arriving at a random time gives you a length-biased interval, whereas sampling a random passenger from those present gives you a uniform draw, and the paradox vanishes. For each, work out what it collapses into under the mapping — SIA, SSA, both, or neither — and whether the passenger-versus-arrival distinction is decidable inside my vocabulary or is precisely the external protocol fact that my vocabulary takes as given.

  Close with a verdict on what the residue indicates: gaps in the sampling vocabulary, or places where the anthropic debate is less determinate than its participants take it to be.
reasoning: |-
  We are mapping anthropic reasoning (self-sampling assumption, self-indication assumption, etc.) into the vocabulary of survey sampling and quantitative ecology, with a focus on unequal probability sampling, inclusion probabilities, and related concepts.

  The key elements:

  1. **Self-Sampling Assumption (SSA)**: Conditioned on a hypothesis (which includes a population size and composition), the probability that you are any particular observer is uniform. This is a conditional sampling model.

  2. **Self-Indication Assumption (SIA)**: The prior probability of a hypothesis is proportional to the number of observers it contains. This is a constraint on the prior.

  We will map:

  - SSA to design-based inference with fixed frame and inclusion probabilities.
  - SIA to a model-based superpopulation approach where the population size acts as a size-biasing weight.

  We will also address specific cases: the presumptuous philosopher and the doomsday argument, and then answer the referee question and residue report.

  ---

  ### 1. Systematic Mapping

  - **SSA** corresponds to **design-based sampling** with a fixed finite population. The population size \( N \) is part of the unknown parameter (like in capture-recapture). The frame is fixed, and we have known or unknown inclusion probabilities. The key is that once the population is fixed, the sampling is uniform over the reference class (observers). 

    - In design-based inference, the Horvitz-Thompson estimator uses inclusion probabilities \(\pi_i\) to weight observations. For uniform sampling without replacement, \(\pi_i = n / N\) for all \(i\). The "anthropic update" from indexical evidence (like birth rank) is analogous to conditioning on the sample: we condition on the fact that we are in the sample and on our specific label.

  - **SIA** corresponds to a **model-based superpopulation** approach. The superpopulation is an infinite population from which our finite population is drawn. The finite population size \( N \) is random. The weighting by the number of observers in SIA is analogous to the size-biasing that occurs when we sample units with probability proportional to size. 

    - In particular, the SIA prior (\( P(H) \propto N \)) is similar to the way a unit's chance of being included in the sample is proportional to its size in size-biased sampling. The "inspection paradox" (or length-biased sampling) occurs when we sample intervals with probability proportional to their length. 

    - **Is the size bias in SIA the inspection paradox?** 
      Yes, the resemblance is deep. In the inspection paradox, when you sample a process at a random time, the interval you land in is length-biased (i.e., longer intervals are more likely to be sampled). Similarly, under SIA, a hypothesis with more observers (a "longer" population in terms of observer-count) is more likely to be "sampled" (i.e., to be the one you exist in). Thus, SIA is a form of size-biasing where the "size" is the number of observers.

  ### 2. Work Two Cases

  #### Case 1: Presumptuous Philosopher

  - **Setup**: Two hypotheses about the universe. Hypothesis \( H_1 \) has \( N_1 \) observers, hypothesis \( H_2 \) has \( N_2 = 1000 \times N_1 \) observers. They are otherwise equally likely a priori (without SIA). The philosopher has no indexical evidence (like birth rank) beyond existing.

  - **SIA interpretation (model-based with size-biasing)**:
    - Prior: \( P(H_i) \propto N_i \) (by SIA). So \( P(H_1) : P(H_2) = 1 : 1000 \).
    - Conditioned on existing (which is automatic under SIA because if a hypothesis has no observers, it is ruled out), the posterior is the same as the prior because there's no further indexical information. Thus, \( H_2 \) is highly favored.

  - **Mapping to sampling**: 
    - We have a superpopulation of universes. Each universe has a size \( N \) and some other attributes. We sample one universe with probability proportional to \( N \) (size-biased sampling). Then, in that universe, we are a random observer (uniformly). 
    - The estimator for the hypothesis is the one we are in. The inclusion probability for a universe is proportional to \( N \). So the large universe has a much higher chance of being selected.

  - **Likelihood and inclusion probabilities**:
    - The likelihood of being in universe \( H_i \) is proportional to \( N_i \) (because of the size-biased sampling). Hence, the posterior odds are \( (N_1 \times P_0(H_1)) : (N_2 \times P_0(H_2)) \), where \( P_0 \) is the prior without size-biasing. With \( P_0(H_1)=P_0(H_2) \), we get \( 1:1000 \).

  #### Case 2: Doomsday Argument (Birth Rank)

  - **Setup**: We are considering the total number of humans that will ever exist, \( N \). We have a prior over \( N \). We observe our birth rank \( n \) (we are the \( n\)-th human). We want to update our belief about \( N \). The doomsday argument says that \( N \) is likely not much larger than \( n \).

  - **SSA without SIA (design-based)**:
    - Conditioned on \( N \), the probability that our birth rank is \( n \) is \( 1/N \) (for \( n \leq N \)) and 0 otherwise. 
    - The prior is \( P_0(N) \) (without SIA, so not weighted by \( N \)).
    - The posterior: \( P(N | n) \propto P(n | N) P_0(N) = (1/N) P_0(N) \) for \( N \geq n \).

  - **SIA+SSA (model-based with size-biasing and then uniform sampling)**:
    - Prior: \( P(N) \propto N \cdot P_0(N) \) (by SIA: weighted by the number of observers).
    - Then, conditioned on \( N \), the probability of birth rank \( n \) is \( 1/N \) (SSA).
    - The posterior: 
      \[
      P(N | n) \propto P(n | N) P(N) = (1/N) \cdot (N \cdot P_0(N)) = P_0(N)
      \]
      for \( N \geq n \). 
    - So the posterior is the same as the prior (except truncated to \( N \geq n \)), meaning the anthropic update cancels.

  - **Is the cancellation an identity, consequence of reference class, or artifact?**
    - The cancellation is an identity under the mapping. It follows directly from the SIA prior (which weights by \( N \)) and the SSA likelihood (which has a \( 1/N \) term). 
    - It does not depend on the choice of reference class as long as the reference class is the set of all humans and the birth rank is uniform within \( N \). 
    - However, note that if the reference class is chosen differently (e.g., including other observers), then the weights change. But under the given setup, the cancellation is exact.

  ### 3. Adjudicate the Referee Question

  - **Question**: In survey sampling, the frame is stipulated by the designer, and coverage error (over/under) is a practical bias issue. Does the reference class problem have a counterpart?

  - **Answer**: 
    The reference class problem in anthropics (e.g., should we include all conscious beings, or only humans, or only humans of a certain era?) is analogous to **coverage error** in survey sampling. 

    - In survey sampling, the frame defines the target population. If the frame does not match the target population, we have coverage error. Similarly, in anthropics, the reference class defines the set of observers we consider. 

    - However, the anthropic problem is more fundamental: it is about what the target population should be. In sampling, we take the target as given by the research question. In anthropics, the research question itself is about the target (the set of observers that includes "me"). 

    - Therefore, the reference class problem is partly about **undercoverage** (if the reference class is too narrow, we miss relevant observers) and **overcoverage** (if it's too broad, we include non-observers). But it also includes the issue of defining the target population, which in sampling is taken as fixed.

    - **Can the vocabulary express it?** 
      The vocabulary can express the consequences of a chosen reference class (via inclusion probabilities and coverage errors) but does not prescribe how to choose it. The anthropic debate, however, is about how to choose it. Thus, the reference class problem is partly expressible (as coverage) but the normative question of which reference class is correct is not addressed in sampling theory — it is taken as given.

  ### 4. Residue Report: What Has No Counterpart?

  We rule on four candidates:

  - **a) Pure self-locating uncertainty**: 
    - In sampling, when a unit is drawn, we read its label. The uncertainty about which unit we are is resolved by the label. 
    - In capture-recapture, we might have uncertain identification (e.g., tag loss) so we are not sure which individual we observed. This is similar to self-locating uncertainty. However, in the anthropic case, we have no external label — we are the sample. 
    - **Verdict**: Uncertain identification in capture-recapture is a genuine counterpart. But note: in anthropics, we don't have an external sampler to read the label. We are the unit and the sampler. The anthropic case lacks the external perspective.

  - **b) n-of-one design**: 
    - In sampling, we can repeat the design. In anthropics, we have only one sample (our own existence) and cannot re-randomize. 
    - Design-unbiasedness is defined over repeated sampling. Without repetition, we cannot define frequency-based properties. 
    - **Verdict**: The n-of-one design has no counterpart. Sampling theory relies on repeated sampling for probability interpretations (frequentist), but anthropics uses Bayesian reasoning. The concept of design-unbiasedness does not apply.

  - **c) Extreme hypotheses (zero or infinite observers)**:
    - In sampling, we handle zero population by convention (e.g., no sample). Infinite populations are handled by asymptotic approximations or superpopulation models. 
    - In anthropics, the hypothesis that no observers exist (which we condition away because we exist) and infinite populations (which cause problems for uniform sampling) are handled by specific adjustments (e.g., using limits, or non-uniform measures). 
    - **Verdict**: The vocabulary handles these by convention, so there is a counterpart. However, the anthropic debate might push these conventions to their limits (e.g., infinite populations require measure-theoretic care).

  - **d) Can de se evidence move credence?**:
    - In sampling, an observation is from the "outside": we see a unit and its data. In anthropics, the observation is from the "inside": we are the unit. 
    - However, in the mapping, we treat the unit as having a label (including its indexical properties) and the sampler (who is external) reads it. But in anthropics, there is no external sampler. 
    - **Verdict**: The vocabulary does not distinguish internal vs external observation. It assumes an external perspective. Thus, the de se nature of anthropic evidence is not captured. This is a gap.

  ### 5. Two Constructions

  #### Construction 1: Over-Coverage Model

  - **Setup**: The frame has \( M \) slots, but only \( N \) are occupied (with \( N \leq M \)). We conditionalize on being in an occupied slot.

  - **Mapping**:
    - The frame is fixed (size \( M \)), but the population is only \( N \). The inclusion probability for a slot is \( \pi_i = 1/M \) (if we sample uniformly from the frame). Then we condition on the slot being occupied. 
    - The probability that a slot is occupied is \( N/M \). So the probability that we are in a particular occupied slot is \( (1/M) / (N/M) = 1/N \).

  - **Collapse to SSA or SIA?** 
    - This is exactly the SSA: conditioned on \( N \), we are uniform over the \( N \) occupied slots. It does not involve weighting by \( N \) in the prior. Hence, it maps to **SSA**. 

  - **SIA would be**: Prior over \( N \) weighted by \( N \) (which we don't have here). 

  #### Construction 2: Renewal Reading

  - **Setup**: In a renewal process, if we sample at a random time, we get a length-biased interval. If we sample a random passenger (i.e., a random observer in the present), we get a uniform draw.

  - **Mapping**: 
    - The "random time" sampling is analogous to SIA: the chance of being in an interval is proportional to its length (so size-biased). 
    - The "random passenger" sampling is analogous to SSA: we are sampling uniformly from the present passengers (so uniform over the reference class at a fixed time).

  - **The passenger-versus-arrival distinction**:
    - In the sampling vocabulary, this is a matter of the **sampling protocol**. 
    - If the protocol is to sample a time and then take the interval that covers it, we get length-biased sampling (SIA-like). 
    - If the protocol is to sample a passenger (which is equivalent to sampling an interval with probability proportional to the number of passengers in it, but in a renewal process with constant arrival rate, the number of passengers in an interval is proportional to the interval length — so it's again length-biased? Wait, let's clarify).

    Actually, in a renewal process with constant rate, the number of passengers in an interval of length \( L \) is proportional to \( L \) (if we assume one passenger per unit time, then it's exactly \( L \)). So sampling a random passenger is the same as sampling an interval with probability proportional to \( L \) (so again length-biased). 

    But note: the original paradox compared:
      - Random time: the interval length has mean \( E[L^2]/E[L] \).
      - Random passenger: if we sample a passenger, then the interval they are in is indeed length-biased because there are more passengers in long intervals. 

    However, if we sample a passenger uniformly from all passengers that ever lived (across time), then we get length-biased intervals. But if we sample a passenger at a random time, then we are effectively sampling a random passenger present at a random time? 

    Correction: 
      - Random time: we get the interval covering that time (length-biased).
      - Random passenger: we get the interval in which that passenger lived. In a stationary renewal process, the distribution of the interval length for a random passenger is the same as for a random time (because the number of passengers in an interval is proportional to the interval length). 

    So the paradox vanishes because both sampling methods yield the same length-biased distribution.

    - **Decidability in the vocabulary**: 
      The distinction is about the sampling protocol (what is the frame and how are inclusion probabilities defined). Our vocabulary takes the protocol as given. Thus, we can express the difference if we specify the frame and the inclusion mechanism. But the vocabulary does not tell us which protocol corresponds to "being an observer" — that is an external input.

    - **Collapse**: Both protocols collapse to **SIA** (size-biased by interval length, which is the number of passengers in this context). The uniform sampling (SSA) would be if we could sample intervals with equal probability (regardless of length) — but that's not what the passenger sampling does. 

    However, note: if we sample a passenger uniformly from a list of all passengers (a fixed frame that includes every passenger exactly once), then we are not size-biased by the interval length? But in a renewal process, the list of passengers is partitioned by intervals. The chance that a passenger is from an interval of length \( L \) is proportional to \( L \) (because there are \( L \) passengers in that interval). So it is still size-biased. 

    To get a uniform draw over intervals, we would have to sample intervals directly (not passengers). 

    Therefore, the renewal reading does not give us an escape from size-biasing when sampling passengers. It confirms that SIA is the right analogy.

  ### Final Verdict on the Residue

  - The residue indicates **gaps in the sampling vocabulary** regarding:
    - The internal perspective (de se evidence) and the lack of an external sampler.
    - The n-of-one nature of the anthropic setting (no repetition, hence no frequentist interpretation of probability).
    - The normative aspect of the reference class problem (which sampling takes as given).

  - It also shows places where the **anthropic debate is less determinate**:
    - The mapping reveals that some anthropic arguments (like the cancellation in doomsday) are exact under the model but depend on the modeling choices (like the reference class and the sampling protocol).
    - The debate about SSA vs SIA is, in the mapping, a choice between a design-based approach (fixed frame) and a model-based approach with a superpopulation and size-biasing. Both are valid in different contexts, and the anthropic context does not provide an obvious external protocol to decide.

  Overall, the sampling vocabulary provides a clarifying lens but cannot resolve the metaphysical questions at the heart of the anthropic debate.
answer: |-
  Below is the translation of the anthropic debate into your vocabulary of survey methodology and quantitative ecology, followed by an audit of your understanding, a systematic mapping, case studies, adjudication of your referee question, a residue report, and an analysis of your two constructions. The translation focuses on design-based inference (for SSA) and model-based superpopulation approaches (for SIA), leveraging concepts like inclusion probabilities, Horvitz-Thompson weighting, size-biased sampling, and coverage error.

  ---

  ### **Audit of Your Understanding**
  Your summary is largely correct but has minor nuances:
  - **SSA**: Correctly characterized as a conditional sampling model (uniform over observers given a hypothesis). It is not a prior but a likelihood structure for indexical evidence.
  - **SIA**: Correctly identified as a prior constraint (weighting hypotheses by observer count). It makes existence evidence informative.
  - **Presumptuous Philosopher**: SIA inflates the prior for large populations, leading to a posterior ratio equal to the population ratio.
  - **Cancellation in Doomsday**: When SIA and SSA are combined, the birth-rank update cancels the SIA weighting, reverting to the unanthropic prior. This is an identity under the mapping, not an artifact.
  - **Correction**: The cancellation is exact only if the reference class is fixed and the sampling is uniform. It is not a misreading, but it assumes no other evidence or reference class ambiguity.

  ---

  ### **1. Systematic Mapping**
  We map anthropic concepts to your vocabulary:

  | **Anthropic Concept** | **Sampling/Ecology Equivalent** | **Mapping Justification** |
  |------------------------|----------------------------------|---------------------------|
  | **Self-Sampling Assumption (SSA)** | **Design-based inference** with a fixed, finite population of size \(N\) and uniform inclusion probabilities. | SSA conditions on a hypothesis (fixed \(N\)) and assumes uniform sampling over observers. Analogous to a fixed frame with known units and uniform \(\pi_i = n/N\) (for a sample of size \(n=1\), \(\pi_i = 1/N\)). Birth rank is auxiliary data (e.g., a unit's label). |
  | **Self-Indication Assumption (SIA)** | **Model-based superpopulation** with size-biased sampling. The population size \(N\) is a random variable, and hypotheses are weighted by \(N\) in the prior. | SIA weights hypotheses by observer count, equivalent to size-biasing the draw from the superpopulation. The inclusion probability for a hypothesis is proportional to \(N\), akin to length-biased sampling. |
  | **Reference Class** | **Frame coverage** (target population vs. frame). | The reference class defines the frame. Ambiguity in the reference class is coverage error (over/under-coverage). |
  | **Anthropic Update** | **Horvitz-Thompson estimation** for likelihoods. For SSA, update uses \(P(\text{index} \mid N) = 1/N\). For SIA, prior \(P(N) \propto N\) absorbs "existence evidence." | Anthropic updates adjust for unequal inclusion probabilities. SSA's update is direct conditioning; SIA's is prior weighting. |

  #### **Is SIA's Size Bias the Inspection Paradox?**
  Yes, the resemblance is **deep and fundamental**, not superficial.  
  - **Inspection paradox**: In renewal processes, sampling a random *interval* (not a random time) gives length-biased sampling: longer intervals are oversampled with probability proportional to length.  
  - **SIA**: Sampling a random *observer* oversamples hypotheses with larger \(N\), as \(P(\text{hypothesis}) \propto N\).  
  Both are cases of **size-biased sampling** where "size" is observer count for SIA and interval length for inspection. The mechanism is identical: probabilities scale with the size attribute.

  ---

  ### **2. Case Studies in Mapped Vocabulary**
  #### **Case 1: Presumptuous Philosopher**
  - **Setup**: Hypotheses \(H_1\) (\(N_1\) observers) and \(H_2\) (\(N_2 = 1000N_1\) observers). Prior odds \(P_0(H_1):P_0(H_2) = 1:1\). No indexical evidence beyond existence.
  - **SIA (Model-based superpopulation with size-biasing)**:
    - Prior: \(P(H_i) \propto N_i\) → \(P(H_1):P(H_2) = 1:1000\).
    - No further update (no indexical evidence) → Posterior odds = \(1:1000\).
  - **Sampling Likelihood & Estimators**:
    - **Inclusion probabilities**: \(\pi_i(H_1) = 1/N_1\), \(\pi_i(H_2) = 1/N_2\) for any observer \(i\) under SSA. But SIA changes the frame: the superpopulation has hypotheses weighted by \(N\).  
    - **Estimator**: The size-biased prior is equivalent to Horvitz-Thompson weighting with \(\pi_i \propto N\). The odds estimator \(\widehat{\text{odds}} = N_2 / N_1\) is design-based under SIA.
  - **Conclusion**: SIA’s size-biased prior dominates, favoring \(H_2\) by \(1000:1\).

  #### **Case 2: Doomsday Argument (Birth Rank)**
  - **Setup**: Prior \(P_0(N)\) over total humans \(N\). Observe birth rank \(n\). Update to \(P(N \mid n)\).
  - **SSA Only (Design-based)**:
    - Likelihood: \(P(n \mid N) = 1/N\) for \(N \geq n\) (else 0).  
    - Posterior: \(P(N \mid n) \propto P_0(N)/N\) for \(N \geq n\) → Shifts belief to smaller \(N\).
  - **SIA + SSA (Model-based then design-based)**:
    - **SIA prior**: \(P(N) \propto N \cdot P_0(N)\).  
    - **SSA likelihood**: \(P(n \mid N) = 1/N\).  
    - Posterior: \(P(N \mid n) \propto [1/N] \cdot [N \cdot P_0(N)] = P_0(N)\) for \(N \geq n\).  
    → Cancellation reverts to unanthropic prior (truncated to \(N \geq n\)).
  - **Cancellation Analysis**:  
    This is an **identity** from the mapping. It holds for any reference class where:
    - SIA prior \(\propto N\) (size-biasing),  
    - SSA likelihood \(= 1/N\) (uniform sampling).  
    It is not an artifact, but it assumes:
    1. The reference class is fixed (e.g., "all humans"),  
    2. No other evidence (e.g., no temporal distribution shifts).  
    If the reference class changes (e.g., "all conscious beings"), weights rescale, but cancellation persists.

  ---

  ### **3. Adjudication: Referee Question on Reference Class**
  **Question**: *"Does the reference class problem map to coverage error, or is it outside the vocabulary?"*  
  **Answer**: It maps to **undercoverage/overcoverage**, but the normative choice of reference class is **outside the vocabulary**.  
  - **Coverage Error**: In your field, the frame is fixed by design, and coverage error quantifies mismatches (e.g., frame excludes part of the target population = undercoverage).  
    - **Reference class as frame**: Choosing "all humans" vs. "all mammals" is like choosing a frame. Ambiguity introduces coverage bias if the frame misrepresents the target (e.g., undercoverage if "humans" excludes relevant observers).  
  - **Limitation**: Sampling vocabulary **cannot prescribe the correct frame**. It treats the frame as given (e.g., by the designer). Anthropics debates the "true" target population (e.g., "What is the set containing 'me'?"), which is metaphysical.  
  - **Verdict**: Reference class is a coverage problem **only after** the target is chosen. The debate over which target is "correct" has no counterpart—it is external to sampling theory.

  ---

  ### **4. Residue Report: What Has No Counterpart?**
  Four candidates assessed:

  | **Candidate** | **Verdict** | **Reason** |
  |---------------|-------------|------------|
  | **a) Pure self-locating uncertainty** | **No genuine counterpart** (smuggles knowledge). | In capture-recapture, "uncertain identification" (e.g., tag loss) assumes an external sampler who knows labels exist but can’t distinguish them. Anthropic self-locating uncertainty lacks this: there is no external perspective to "read labels." Sampling assumes an omniscient designer; anthropics assumes an embedded observer. |
  | **b) n-of-one design** | **No counterpart** (fundamental gap). | Design-unbiasedness and interval coverage require repeated sampling over a design space. Anthropics is a single realization (one universe, one observer). Probability in anthropics is Bayesian credence; in sampling, it’s long-run frequency. The vocabulary **cannot express** repeated randomization here. |
  | **c) Extreme hypotheses** (zero or infinite observers) | **Handled by convention** (weak counterpart). | Sampling handles \(N=0\) by excluding it (no sample) and \(N=\infty\) via limits or superpopulations. Similarly, anthropics uses \(P(N=0)=0\) (since we exist) and infinite cases via measures (e.g., the self-indication assumption). The mapping holds but relies on the same conventions. |
  | **d) De se evidence moving credence** | **No counterpart** (gap). | Sampling assumes observations are third-person (a sampler sees a unit’s data). Anthropic evidence is first-person ("I am observer \(i\)"). The vocabulary cannot distinguish "observation from inside" because all units are external to the sampler. De se evidence has no operational meaning here. |

  **Summary of Gaps**:  
  - Residue indicates **gaps in sampling vocabulary**, particularly for first-person perspective (a, d), uniqueness (b), and frame choice (adjudicated in §3).  
  - Anthropic debates are **less determinate** where sampling relies on conventions (c) or lacks repeated trials (b). Sampling theory exposes ambiguities (e.g., frame choice) that anthropics often glosses over.

  ---

  ### **5. Your Constructions: Mapped and Collapsed**
  #### **Construction 1: Over-Coverage Model**
  - **Setup**: Frame has \(M\) slots, \(N\) occupied (\(N \leq M\)). Condition on being in an occupied slot.
  - **Mapping**:  
    - Frame size \(M\) is fixed (design-based).  
    - Occupied slots = actual population of size \(N\).  
    - Inclusion probability for a slot: \(\pi_i = 1/M\) (uniform).  
    - Condition on occupation: Effective inclusion probability = \((1/M) / (N/M) = 1/N\).  
  - **Collapses to SSA**: Uniform over \(N\) observers given \(N\). Ignores unoccupied slots in the update. SIA is not involved (no size-biased prior).  
  - **Decidability**: The "protocol fact" (slots vs. occupation) is **external**. Sampling vocabulary takes it as given (e.g., frame definition), but cannot decide if it matches anthropic needs.

  #### **Construction 2: Renewal Reading**
  - **Setup**: Distinguish sampling a random time (length-biased interval) vs. random passenger (uniform over present observers).
  - **Mapping**:  
    - **Random time**: Analogous to SIA. Sampling proportional to interval length → size-biased.  
    - **Random passenger**: Analogous to SSA. Uniform over observers at a fixed time → no size bias.  
  - **Collapses to SSA**: The "random passenger" protocol implies uniform inclusion over the reference class (passengers present), matching SSA. The paradox "vanishes" because SSA avoids size bias.  
  - **Decidability**: The protocol (passenger vs. arrival) is **external** to the vocabulary. Sampling treats it as given (e.g., design protocol). Anthropics must specify which protocol reflects "being an observer."

