  ### **Final Verdict on Residue**
  - **Gaps in sampling vocabulary**:  
    1. First-person perspective (de se evidence, self-locating uncertainty).  
    2. Uniqueness of the sample (no repeated designs).  
    3. Normative frame choice (reference class problem).  
  - **Anthropic indeterminacy exposed**:  
    - Debates are less determinate where sampling relies on conventions (infinite populations) or external inputs (frame protocol).  
    - SSA vs. SIA reduces to a choice between design-based (fixed frame) and model-based (size-biased superpopulation) inference—both valid but context-dependent.  

  **Conclusion**: The sampling vocabulary clarifies anthropic reasoning by grounding it in established statistical concepts, but it cannot resolve metaphysical questions (e.g., "What is the true reference class?"). It reveals that anthropic updates are not unique—they depend on design choices (frame, protocol) that sampling takes as given. The residue highlights where anthropics overreaches by ignoring these dependencies.
