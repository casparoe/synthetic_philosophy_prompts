prompt: |-
  You are a philosopher of social epistemology who also knows the economics of information, and I want slow, careful conceptual work rather than a quick label. Please begin by sketching two or three candidate concepts that the pattern I describe might be an instance of, testing each against the details, and only then decide which fits; if none of them fits, say so plainly and coin a name, with a definition and with cases that are clearly in and clearly out. I do not need citations, papers, or a reading list, and I do not need anything looked up: what I want is the shape of the idea and the location of its edges.

  Here is the pattern. I used to work in freight pricing and now sit in on a small reading group on markets and information, which is where this came up. Some institution is very good at pooling what a lot of scattered people know: a futures price, a forecast, a ranking, an odds line. Its success depends on participants continuing to bring it information they acquired independently — the trader who actually drove out and looked at the grain before the price moved, the analyst who actually read the filing. But the more trusted the aggregate becomes, the less point there is in anyone doing that work, and the more rational it is simply to read the aggregate and act on it. The institution slowly consumes the inputs that made it worth reading. Two features make this feel unlike anything I can put a name to. First, the aggregate does not thereby become inaccurate. It can go on being right for a long time, either because it is still living off the residue of earlier inquiry or because the few people who still do the work do it for reasons unrelated to the aggregate, such as needing the information for their own operations. So the decay is invisible from inside: accuracy is not a signal of grounding, and there is no observable difference between a well-founded consensus and a hollowed-out one until the day there is. Second, the failure is not that participants set aside private information they already have in favour of what everyone else appears to believe. It is that the private information never gets produced in the first place. That distinction matters to me, because the accounts I keep encountering in this area are about people who have information and then abandon it — which is not my case.

  To show you the edge I am after, here is a case I think is not it: a hiring committee where every member privately thinks the candidate is weak but all speak in her favour, each inferring from the others' apparent confidence that they must know something, until one person breaks ranks and the whole thing collapses. That is a different failure, it turns on false beliefs about other people's beliefs, and a single defector bursts it. My phenomenon does not burst when someone defects, because there is nothing to defect with: nobody has anything independent left to say. So my question is this. Is there an established concept for the erosion of an aggregating institution's epistemic base by its own success, where accuracy outlives grounding? How does it relate, and where exactly does it differ, from the familiar result that a price which fully revealed everything would leave nobody with a reason to gather information (which, as I understand it, is a claim about impossibility in equilibrium rather than about slow, unobservable decay), from herding and informational cascades, and from the broader family of self-defeating or reflexive predictions? I will add, only for orientation and not because I need it answered, that the reading group arrived here from an older puzzle: if the price already contains what everyone knows, what exactly is the person who buys trading on? My question is a cousin of that one, not the same question. Where the nearest concepts each capture only part of what I have described, tell me which part each captures, which part it leaves over, and give me a name for the leftover.
reasoning: |-
  Hmm, the user is asking me to analyze a specific pattern in social epistemology and information economics. They've described a situation where an aggregating institution (like futures prices or forecasts) becomes so trusted that it discourages people from gathering original information, leading to an invisible decay in its epistemic grounding even while accuracy persists. They want me to carefully examine conceptual candidates before deciding if this fits any existing concept.

  The key features I need to address are: (1) the decay is invisible because accuracy outlives grounding, (2) the failure occurs because private information never gets produced in the first place, not because people abandon existing information, and (3) it's different from informational cascades where people override private signals based on others' behavior.

  Looking at the examples they provided: the freight pricing background shows this is about market information mechanisms, and they explicitly contrast it with the hiring committee case which represents a classic informational cascade.

  I need to test this against three main concepts:

  First, the Grossman-Stiglitz paradox about efficient markets. This captures the incentive problem - if prices fully reveal information, no one has reason to gather costly information. But it's about equilibrium impossibility, not gradual decay, and doesn't address the invisibility of the problem or the distinction between not producing versus abandoning information.

  Second, informational cascades. These involve people ignoring private signals to follow the crowd, creating fragile consensus. But in the user's case, there are no private signals to override - the signals are never produced. Cascades collapse when contradicted, while this decays invisibly.

  Third, reflexivity (like Soros's work). This concerns how beliefs affect reality, but focuses on price distortions rather than epistemic grounding decay. It involves observable feedback loops, not invisible erosion.

  None of these fully fit. The core is "epistemic resource depletion" - an institution consuming the very activities that sustain it. I'll coin "Epistemic Groundwater Depletion" to capture this: invisible consumption of information-gathering capacity that maintains surface-level accuracy until sudden failure.

  Important distinctions: this isn't about abandoning existing information (like cascades), nor equilibrium impossibility (like Grossman-Stiglitz), nor self-fulfilling prophecies. It's specifically about the invisible erosion of information production capacity.

  I'll structure my response to first analyze each candidate concept, show where they fall short, then present the new concept with clear definition, boundaries, and contrasting examples.
answer: |-
  Based on your careful description and boundary conditions, I'll sketch three candidate concepts, test them rigorously against your details, identify the gaps, and then propose a new concept with defined edges.

  **Candidate 1: The Grossman-Stiglitz Paradox (Efficient Market Incompleteness)**  
  *Core Idea:* If market prices perfectly reflect all available information (are "informationally efficient"), no rational agent has incentive to incur costs to gather information, as profits cannot be earned from trading on it. But if no one gathers information, prices cannot become efficient. Thus, perfect efficiency is impossible; markets must remain *somewhat* inefficient to sustain information production.  
  *Testing Against Your Case:*  
  - **Captures:** The core incentive problem – success (trusted aggregate) destroys the rationale for costly private information production.  
  - **Fails:**  
    - It's an *equilibrium impossibility* claim, not a process of slow decay. Your case describes a dynamic erosion *toward* collapse, not a logical barrier.  
    - It assumes agents *react to the price's perfection*. Your case involves accuracy *persisting despite decaying grounding*, with no observable signal of the erosion. Grossman-Stiglitz lacks this invisibility.  
    - It doesn't distinguish between "not producing" vs. "abandoning" information – your key distinction.  
  *Verdict:* Captures the incentive structure but misses the temporal decay, invisibility, and unique mode of failure (non-production).

  **Candidate 2: Informational Cascades/Herding**  
  *Core Idea:* Individuals ignore their private signals and follow the actions/beliefs of predecessors, leading to fragile consensus based on limited initial information.  
  *Testing Against Your Case:*  
  - **Captures:** The self-undermining dynamic where reliance on public signals reduces independent inquiry.  
  - **Fails:**  
    - Cascades involve agents *overriding existing private signals* with public ones. Your case is defined by private signals *never being generated* ("nothing to defect with").  
    - Cascades collapse *when contradicted by new evidence* (your hiring example). Your hollowed-out aggregate fails *when grounding is exhausted*, not when contradicted; it may remain accurate until it suddenly isn't.  
    - Collapse requires a visible trigger (a defector). Your decay is invisible until failure.  
  *Verdict:* Captures social reinforcement undermining inquiry but mischaracterizes the mechanism (override vs. non-production) and failure mode (contradiction vs. exhaustion).

  **Candidate 3: Reflexivity (Sorosan Self-Undermining)**  
  *Core Idea:* Beliefs about reality (e.g., market prices) influence reality itself (e.g., investor behavior), creating feedback loops that distort prices away from fundamentals.  
  *Testing Against Your Case:*  
  - **Captures:** The self-consuming loop where the aggregate's success alters the behavior sustaining it.  
  - **Fails:**  
    - Reflexivity typically implies *deviation from fundamentals* (e.g., asset bubbles). Your aggregate remains *accurate* until collapse, despite decaying grounding.  
    - It focuses on how beliefs *distort* reality. Your case is about beliefs *accurately reflecting* a reality that is eroding *because* of those beliefs.  
    - It emphasizes observable feedback loops (price rises fuel buying). Your decay is invisible and non-distorting until failure.  
  *Verdict:* Captures self-referential dynamics but misses the accuracy-persistence paradox and epistemic grounding erosion.

  **Diagnosis & New Concept:**  
  No established concept fully fits. The core novelty is the **invisible consumption of the epistemic resource base** – where the institution’s *accuracy* masks the erosion of its *grounding*, and failure stems from *non-production* of new private information, not its abandonment or override. This is distinct from:  
  - **Grossman-Stiglitz:** It’s a dynamic process, not an equilibrium impossibility.  
  - **Cascades:** No overriding of signals; no cascade collapse.  
  - **Reflexivity:** No deviation from accuracy during decay.  

  **Proposed Concept: Epistemic Groundwater Depletion**  
  *Definition:* The gradual, unobservable erosion of an information-aggregating institution's capacity to generate *new* private inputs, caused by its own perceived reliability, where persistent accuracy masks depleting reserves of independent inquiry until catastrophic failure.  

  *Boundaries (Cases Included):*  
  1. **Commodity Futures Market:** Grain traders rely on futures prices (accurate due to past scouting). Scouting declines as prices seem reliable. Accuracy persists via residual past data and minimal "operational scouting" (e.g., by farmers). Failure occurs when unobserved drought hits – prices never adjusted because no new scouting fed data.  
  2. **Academic Citation Metrics:** Journal impact factors are trusted proxies for quality. Researchers stop reading articles, relying on metrics to select citations. Metrics remain stable (reflecting past citations), but new innovative work is overlooked as no one reads deeply. The field collapses when foundational gaps emerge.  

  *Boundaries (Cases Excluded):*  
  1. **Informational Cascade (Your Hiring Committee):** Excluded because members *have* private beliefs (weak candidate) but override them due to social cues. Collapse is triggered by defection.  
  2. **Predatory Short-Selling Research:** A firm publishes accurate but costly-to-verify reports (e.g., fraud exposure). Others free-ride, eroding the business model. *Excluded* because accuracy *degrades* as funding dries up (observable decay), and failure is due to lack of incentives, not depletion of *others'* independent inquiry.  
  3. **Echo Chambers:** Individuals consume only confirming information. *Excluded* because grounding erodes via *isolation*, not the success of an aggregator masking depleted inquiry.  

  **Relation to Existing Ideas:**  
  - **Grossman-Stiglitz:** Focuses on *static* incentive incompatibility. Groundwater depletion is its *dynamic, temporal manifestation* with unique invisibility.  
  - **Herding/Cascades:** Describe *social coordination failures with existing signals*. Groundwater depletion is *preemptive resource exhaustion* before signals exist.  
  - **Reflexivity:** Involves *self-fulfilling/distorting loops*. Groundwater depletion involves *self-consuming accuracy loops*.  

  **Core Insight:**  
  Your case is defined by **epistemic resource consumption**: the aggregator is a "mining operation" depleting the very activity (independent inquiry) that constitutes its ore. Accuracy is the visible ore pile; grounding is the unmapped reserve. The tragedy is that the pile's size *conceals* the depletion rate. This shifts focus from *coordination* (cascades) or *equilibrium* (G-S) to the *unsustainable extraction of epistemic labor*. The name "groundwater depletion" evokes an invisible, critical resource being mined to exhaustion, with surface flows (accuracy) persisting until collapse.
