prompt: |-
  You are a philosopher of mind and language who also does applied work on classification disputes: you know the literature on concepts, similarity, analogy-making and conceptual slippage in small closed domains, and you know how badly that literature translates into a checklist that non-specialists have to run under time pressure. Think carefully before writing. First brainstorm the conceptual material you will draw on and what has to survive simplification; only then draft the procedure; then run it on the cases; then state plainly where it breaks.

  I chair the Design Integrity Panel of a board-game publishers association. About ten times a year we hear a complaint that one studio's game is a copycat of another's. Our panel is three working designers plus one lay member, we have ninety minutes per complaint including deliberation, and we must issue a one-page written finding the same week. Our sanctions are professional, not legal: a public finding, removal from the association's showcase, and in some cases a requirement to credit the earlier designer. We have no legal staff and we have deliberately put copyright doctrine out of scope, including the idea/expression distinction and the abstraction-filtration-comparison machinery that comes with it. Right now we fall back on a holistic total concept and feel test borrowed from law, and our verdicts are inconsistent in exactly the way you would expect: everything looks like a copy to some panel members and nothing does to others, because similarity is being judged against whatever comparison class each person happens to have in mind.

  I want a reusable decision procedure my panel can actually run, grounded in what is really known about concepts and similarity in a small domain. Please import these ideas explicitly, and tell me if you think one of them should be dropped:

  Fix the microdomain first. In research on computational analogy-making, the letter-string domain is used because it is tiny and the space of alternatives is fully specifiable: given abc becomes abd, what does iijjkk become, and what does xyz become. Notice that the last question has more than one defensible answer precisely because concepts there can slip: successor into predecessor, the letter d into the idea of the next letter, the rightmost position into the final group of a run. I want my panel to begin every complaint by fixing the comparison class for the accused game: the genre, its conventions, the design moves available at the time, the space of games a competent designer in that scene could have sampled. Say how to do that in fifteen minutes with no market research, and what to do when we cannot agree on the comparison class.

  Separate forced choices from free choices. A feature forced by the microdomain carries no copying signal; a free choice that matches does. Give us a test for telling them apart, and handle the hard middle case of a feature that was free when the earlier game was made but has since become a genre convention.

  Test for slippage, not literal identity. A copy can preserve a structure while every surface description changes: dice for cards, a die for a token, a deck for a bag, single worker for stack of workers, one resource for another. Our current holistic test systematically undercounts this. Give us the mapping step in a form three volunteers can apply without the theory.

  Require distinctiveness before counting similarity. A pattern of matches is only evidence if it is rare in the fixed space of alternatives. Give us a coarse way to say how many alternative designs would show this same pattern, including what to do when we genuinely cannot estimate it.

  Check abstraction level. Run the verdict one level up and one level down, and tell us what to write when the verdict flips.

  Then run the finished procedure on three complaints:

  One: a 2023 release with the same rule skeleton as a 2018 card game, different theme, different art, and dice substituted for cards at one point in the turn, plus two balance tweaks the accused studio says took eight months.

  Two: two deck-building games released four months apart, independently developed, sharing everything that defines the genre and nothing else that either panel member can point to.

  Three: a case where the procedure gives us an answer I will not like. Our complainant is a two-person studio; the respondent is a large publisher that has clearly studied the complainant's game. But the mechanic the complainant calls its signature turns out, under the procedure's own tests, to be a slippage copy of an out-of-print abstract game from the late 1980s that none of us had heard of. Tell us what the procedure says and what the one-page finding should look like.

  Finally, give us the honest limits: the kinds of game for which this procedure will misfire, the points at which it must hand the decision to a person because the question is one of values rather than fact, and the cases where it should decline to issue a finding at all. Write the whole thing so a volunteer designer can read it once and run it, with the theory kept in a short appendix rather than in the steps themselves.
reasoning: |-
  We are designing a decision procedure for the Design Integrity Panel to handle copycat complaints in board games. The procedure must be grounded in concepts from philosophy of mind and language, specifically analogy-making, conceptual slippage, and similarity in small domains. We'll incorporate the user's suggested elements: fixing the microdomain, separating forced vs. free choices, testing for slippage, requiring distinctiveness, and checking abstraction levels.

  Brainstorming conceptual material and what must survive simplification:

  1. **Fix the microdomain**: 
     - In analogy-making (e.g., the letter-string domain), the space of alternatives must be well-defined. We apply this by defining the "design space" for the accused game: the genre, conventions, and available design moves at the time.
     - What must survive: The comparison class must be fixed to avoid arbitrary similarity judgments. We must have a method to quickly define this without market research.
     - How to do it in 15 minutes: The panel uses their collective expertise to list the game's genre and its common mechanics, themes, and components. They also note the time period of development to account for what was available. If they cannot agree, they default to the broadest reasonable genre and note the disagreement.

  2. **Separate forced choices from free choices**:
     - Forced choices are those dictated by the genre or the game's function (e.g., having a way to randomize draws in a deck-building game). Free choices are innovative and not necessary.
     - What must survive: The distinction between what is conventional and what is original. The hard case is when a feature was free at the time of the first game but became conventional later.
     - Test: A feature is forced if it appears in at least 50% of the top 10 games in the genre from the time of the accused game's development (using panel's knowledge). For the hard case: if the feature was free for the first game but forced by the time of the accused game, it doesn't count as copying.

  3. **Test for slippage, not literal identity**:
     - Copying can occur at a structural level with surface changes (e.g., replacing cards with dice). We need to map the structure.
     - What must survive: The idea that similarity is about relational structure, not surface features.
     - How to apply without theory: The panel identifies the core function of each component in the original game and sees if the accused game has a component serving the same function, even if the form is different. They list the functions and map them.

  4. **Require distinctiveness before counting similarity**:
     - A pattern of matches is only evidence of copying if it is rare in the design space.
     - What must survive: The idea that common patterns don't indicate copying.
     - Coarse method: For each matching feature (after slippage test), the panel estimates how many games in the comparison class (from step 1) have that feature. If a feature appears in more than 20% of the games, it's not distinctive. If the panel cannot estimate, they note it and proceed with caution.

  5. **Check abstraction level**:
     - Run the verdict at a higher (more abstract) and lower (more concrete) level to see if the decision holds.
     - What must survive: The verdict should be robust across levels of description. If it flips, it indicates the case is borderline and the finding must reflect that.

  Now, draft the procedure:

  **Procedure: Copycat Complaint Assessment (90 minutes total)**

  *Step 1: Fix the Microdomain (15 minutes)*
  - As a panel, agree on the genre and time period for the accused game (e.g., "deck-building games, 2020-2023"). 
  - List the common mechanics, themes, and components in this microdomain. Use your collective knowledge. If disagreement, take the broadest genre and note the disagreement.
  - Output: A written statement of the comparison class.

  *Step 2: Identify Features of the Original Game (10 minutes)*
  - List the key features of the original game that the complainant claims were copied. Focus on mechanics, not theme or art. 
  - For each feature, note if it was a forced choice (common in the genre at the original game's time) or free choice (innovative at that time). Use panel knowledge: if it was in less than 50% of the top 10 games in the genre at the time, it's free.

  *Step 3: Map Features with Slippage (20 minutes)*
  - For each key feature from step 2, identify the function it serves in the original game (e.g., "random resource generation").
  - In the accused game, find if there is a component that serves the same function, even if the form is different (e.g., dice instead of cards). This is the slippage test.
  - Output: A list of mapped features (functionally equivalent) and whether the accused game has them.

  *Step 4: Assess Distinctiveness (15 minutes)*
  - For each mapped feature that is a free choice in the original game (from step 2), estimate how common it is in the comparison class (from step 1). 
  - Use a coarse scale: rare (<20% of games), common (20-80%), or universal (>80%). If you cannot estimate, label as "unknown".
  - Only rare features count as evidence of copying.

  *Step 5: Count the Evidence (10 minutes)*
  - Count the number of rare, free-choice features that are present in the accused game (from step 4). 
  - If the count is 3 or more, proceed to step 6. If less, the complaint likely fails.

  *Step 6: Check Abstraction Levels (10 minutes)*
  - Run the same test at:
    - A higher level: Group features into broader categories (e.g., "resource gathering mechanic"). Does the pattern still hold?
    - A lower level: Break one key feature into sub-features. Does the pattern break?
  - If the verdict flips (e.g., at high level it looks similar, at low level it doesn't), then the case is borderline.

  *Step 7: Deliberate and Write Finding (10 minutes)*
  - Based on steps 1-6, decide if there is copying. If borderline, note it.
  - Sanctions: If copying, recommend public finding, removal from showcase, or credit. Adjust based on severity.

  Now run the procedure on the three complaints:

  **Complaint One: 2023 release vs. 2018 card game**

  - Step 1: Microdomain: Assume the genre is "light strategy card games with a twist" (2018-2023). Common: card play, resource management.
  - Step 2: Original (2018) features: 
    - Feature 1: Card-based action selection (free at the time? In 2018, card selection was common in the genre, but this specific skeleton might be free. Assume it was free then.)
    - Feature 2: Specific turn structure (draw, play, discard). Forced? Common, so forced.
    - Feature 3: A particular balance of resources. Free? Yes, if unique.
  - Step 3: Slippage: 
    - Original card-based action selection -> accused uses dice for action selection (same function: random action choice). Mapped.
    - Turn structure: same. Mapped.
    - Resource balance: tweaked, but same structure. Mapped.
  - Step 4: Distinctiveness:
    - Feature 1 (action selection): The dice substitution is a slippage, but the core function (random action selection) is common. So not rare -> not distinctive.
    - Feature 2: Turn structure forced -> not counted.
    - Feature 3: Resource balance: rare? If unique, yes. But balance tweaks are common. Without more, we might say not rare.
  - Step 5: Count: Maybe one rare feature? Not enough.
  - Step 6: Abstraction: 
    - Higher: Both are light strategy games with random action selection and resource management -> similar.
    - Lower: The dice vs. cards might change the feel. If the sub-features differ, it breaks.
  - Verdict: Not copying? But step 6 shows borderline. We might say "no copying" because the distinctive features are not rare.

  **Complaint Two: Two deck-building games, four months apart**

  - Step 1: Microdomain: Deck-building games (current). Common: starting deck, buying cards, shuffling, etc.
  - Step 2: Original features: 
    - All features listed are forced by the genre (e.g., buying cards, shuffling). Nothing free.
  - Step 3: Slippage: The functions are the same, but they are forced.
  - Step 4: Distinctiveness: All common -> no distinctive features.
  - Step 5: Count: 0 -> no evidence.
  - Step 6: Abstraction: At high level, both deck-builders. At low level, if no unique mechanics, no copying.
  - Verdict: No copying. Independent development.

  **Complaint Three: Small studio vs. large publisher**

  - The complainant's signature mechanic is claimed to be copied. But under our procedure:
    - Step 1: Microdomain: [Whatever genre, say, worker placement games]
    - Step 2: Original (complainant's game): The mechanic was a free choice at their time? We must check. But then we find an out-of-print 1980s abstract game with the same mechanic.
    - Step 3: Slippage: The function is the same. So the mechanic is mapped to the 1980s game.
    - Step 4: Distinctiveness: If the mechanic was in the 1980s game, then it wasn't free for the complainant. It was already in the design space (even if obscure). So not distinctive for the complainant -> no evidence of copying from the complainant by the respondent.
  - The procedure says: The respondent did not copy from the complainant because the mechanic was not original to the complainant. The large publisher might have gotten it from the 1980s game or independently.
  - Finding: No copying from the complainant. The one-page finding should state that the mechanic, while similar, was not original to the complainant and thus the respondent's use of it does not constitute copying from the complainant. No sanctions.

  Honest limits:

  - **Misfires**: 
    - For games that are highly innovative and create a new microdomain. Our comparison class might be too broad.
    - When the design space is not well-known to the panel (e.g., very niche genres).
    - When a game copies the "feel" without specific mechanics (e.g., mood, pacing) – our procedure is mechanical.

  - **Hand to values**: 
    - When the panel must decide if a feature is "distinctive" and estimation is impossible. Then it becomes a judgment call.
    - When the slippage mapping is ambiguous (e.g., is a deck of cards functionally the same as a bag of tokens? Sometimes yes, sometimes no – depends on context).

  - **Decline to issue**: 
    - When the comparison class cannot be fixed (e.g., a truly novel game with no clear genre).
    - When the complaint is about theme or art, which we explicitly exclude.

  Final Procedure for Volunteers (one-page cheat sheet):

  **Design Integrity Panel Copycat Complaint Procedure (90-minute version)**

  1. **Fix the Domain (15 min)**: 
     - Agree on the game's genre and development period. 
     - List common mechanics. If unsure, pick a broad genre and note it.

  2. **Original Game Features (10 min)**:
     - List the key mechanics claimed as copied. 
     - For each, mark "forced" (common in top 10 genre games at the time) or "free" (new or rare then).

  3. **Map with Slippage (20 min)**:
     - For each key feature from step 2, write its core function (e.g., "random draw"). 
     - In the accused game, find a component with the same function. If found, it's a match.

  4. **Distinctiveness (15 min)**:
     - For each "free" feature from step 2 that has a match in step 3:
       - Is this feature rare in the domain (step 1)? Use: rare (<20%), common, or unknown. 
       - Only rare features count.

  5. **Count Evidence (10 min)**:
     - If 3 or more rare features match, proceed. Else, likely no copying.

  6. **Abstraction Check (10 min)**:
     - Test at a higher level (group features) and lower level (split one feature). 
     - If the result changes, the case is borderline.

  7. **Deliberate (10 min)**:
     - If evidence from step 5 and robust in step 6, copying found. Else, not.
     - If borderline, note in finding.

  **One-Page Finding Template**:
  - Complaint: [ID]
  - Domain: [Genre, period]
  - Key features claimed: [List]
  - Mapping: [Which matched with slippage?]
  - Distinctive features: [Rare ones?]
  - Abstraction check: [Stable?]
  - Verdict: Copying / No copying / Borderline (explain)
  - Sanctions (if any): [e.g., credit required]

  Appendix (theory in brief):
  - We fix the domain to avoid arbitrary comparisons.
  - Forced choices don't count: they are genre conventions.
  - Slippage allows functional matches, not just surface.
  - Distinctiveness ensures we don't punish common designs.
  - Abstraction check avoids level-dependent verdicts.
answer: |-
  Below is a complete decision procedure for your Design Integrity Panel, grounded in established concepts from philosophy of mind, language, and computational analogy-making (e.g., work by Gentner, Holyoak, and Hofstadter on structure-mapping, conceptual slippage, and microdomains). The procedure prioritizes practicality for non-specialists: it runs in 90 minutes, avoids theoretical jargon, and produces a one-page finding. I'll first summarize the core conceptual foundations and how they survive simplification, then present the step-by-step procedure, apply it to your three test cases, state where it breaks, and provide a volunteer-friendly version.

  ### Core Conceptual Foundations (What Survives Simplification)
  These ideas come from research on concepts, similarity, and analogy in small domains (like the letter-string microdomain). They’re simplified for your panel’s use but retain key insights:
  1. **Fix the microdomain**: Analogy research (e.g., Structure-Mapping Theory) shows similarity judgments are meaningless without a bounded "design space" (e.g., letter-strings like "abc" have limited transformations). Without this, concepts "slip" (e.g., judging "xyz" as becoming "xyza" or "wxy" depending on context). Simplification survival: The panel must explicitly define the accused game’s genre, conventions, and available design moves to prevent arbitrary comparisons. If agreement fails, we default to the broadest reasonable genre and flag disagreement—this avoids paralysis.
  2. **Separate forced vs. free choices**: In concept research, "forced" features are determined by domain constraints (e.g., in letter-strings, "successor" is forced if the domain is alphabetic sequences). "Free" choices signal innovation and are copying indicators. The hard case (a feature that was free originally but became conventional) draws on "conventionalization" in cultural evolution (e.g., Sperber’s epidemiology of representations). Simplification survival: We use a quick prevalence test (e.g., "Is this in 50% of top genre games?"). If a feature was free for the original but forced for the accused, it doesn’t count—copying requires copying *innovation*.
  3. **Test for slippage (structure over surface)**: Analogy-making (e.g., Hofstadter’s fluid concepts) focuses on relational structures (e.g., "increase by one" in "abc→abd") over surface details (e.g., letters vs. numbers). Slippage is when structures persist despite surface changes (e.g., dice for cards). Simplification survival: Panelists map functions (e.g., "randomize input") not components, using a simple worksheet. This catches structural copies that holistic tests miss.
  4. **Require distinctiveness**: Similarity only matters if it’s rare in the design space (e.g., in letter-strings, "xyz→xya" is common, but "xyz→aaa" is distinctive). This comes from Tversky’s contrast model and Gentner’s systematicity principle. Simplification survival: A coarse rarity scale (rare/common/unknown) lets panelists estimate without data. If rarity is unknown, we downgrade the feature’s weight—this prevents overcounting trivial matches.
  5. **Check abstraction level**: Concepts exist at multiple levels (e.g., "dice" vs. "randomizer"), and verdicts can flip if levels shift (e.g., "copy" at a high level but not low). This draws on Rosch’s categorization research. Simplification survival: Testing one level up/down adds robustness. If the verdict flips, the finding must note ambiguity—this signals a values-based dispute (e.g., "how abstract is too abstract?").

  These foundations are distilled into a reusable procedure. No element is dropped—all are essential for consistency—but the "distinctiveness" step includes a fallback for unestimable cases to avoid false positives.

  ### Decision Procedure: Copycat Assessment Protocol (CAP)
  **Time Allocation**: 90 minutes total (steps 1–6: 70 minutes; step 7: 20 minutes for deliberation/writing).  
  **Materials Needed**: Whiteboard, timer, and a worksheet (table) for steps 2–5.  
  **Key Rule**: Focus only on mechanics—ignore theme, art, and names. Sanctions apply only if CAP finds copying.

  1. **Fix the Microdomain (15 min)**  
     - **Task**: Define the accused game’s design space (genre, conventions, and design moves available at its release date).  
     - **How**:  
       - Panelists brainstorm genres (e.g., "worker placement") and list 3–5 top games in that genre from the accused game’s release period.  
       - Identify conventions (e.g., "deck-builders require shuffling") and available moves (e.g., "using dice for randomness was common in 2023").  
       - If disagreement: Vote. If deadlock, default to the broadest genre (e.g., "strategy game" not "medieval strategy") and note: "Comparison class disputed."  
     - **Output**: Written statement, e.g., "Microdomain: Deck-building games, 2020–2023 conventions."

  2. **List and Classify Original Features (10 min)**  
     - **Task**: Identify features from the original game that the complainant claims were copied. Label each as "forced" or "free."  
     - **How**:  
       - Complainant must specify 1–5 key mechanics (no vague claims like "feel").  
       - For each feature, ask: "When the original launched, was this in ≥50% of top microdomain games (from Step 1)?" If yes, it’s **forced**; if no, it’s **free**.  
       - **Hard case (free-turned-forced)**: If the feature became conventional by the accused game’s release, still label it "free" for the original—but if forced for the accused, it won’t count as evidence later.  
     - **Output**: Worksheet table with features and classifications.

  3. **Slippage Test (20 min)**  
     - **Task**: For each "free" feature from Step 2, check if the accused game has a functional match, ignoring surface changes.  
     - **How (volunteer-friendly)**:  
       - For each feature, write its "core function" (e.g., "draft cards" → function: "select options from a pool").  
       - In the accused game, find any mechanic with the same function (e.g., "drafting tokens from a bag" matches "drafting cards").  
       - **Rule of thumb**: If a mechanic serves the same purpose in the turn structure, it’s a match. No match if functions differ (e.g., "dice for movement" vs. "cards for action selection").  
       - Output binary: Match or no match.  
     - **Output**: Updated worksheet with match results.

  4. **Distinctiveness Check (15 min)**  
     - **Task**: For each matched "free" feature, assess if it’s rare in the microdomain.  
     - **How**:  
       - Estimate prevalence: "In 10 games from Step 1, how many have this feature?"  
         - Rare: ≤2 games (strong evidence).  
         - Common: ≥3 games (weak/no evidence).  
         - Unknown: Can’t estimate (weak evidence; only counts if 3+ features agree).  
       - **Coarse fallback**: If stuck, ask: "Could 5+ games in this genre work without this?" If yes, rare; if no, common.  
     - **Output**: Rarity rating for each matched feature.

  5. **Tally and Weight Evidence (10 min)**  
     - **Task**: Count distinctive matches and apply weights.  
     - **How**:  
       - Give each matched feature a weight:  
         - Rare: 3 points  
         - Unknown: 1 point  
         - Common: 0 points (discard)  
       - **Threshold**: ≥6 points total suggests copying (e.g., two rare features, or six unknown).  
       - If below threshold, no copying—end here. If above, proceed to Step 6.

  6. **Abstraction Check (10 min)**  
     - **Task**: Test if the verdict holds at different abstraction levels.  
     - **How**:  
       - **Level up**: Group features into broader categories (e.g., "card drafting + token drafting" → "asynchronous selection"). Does the match pattern hold?  
       - **Level down**: Pick one key feature and split it (e.g., "card drafting" → "draw 2, keep 1"). Does the match break?  
       - **Output**: 
         - Verdict stable (points unchanged)? Proceed.  
         - Verdict flips (e.g., points fall below threshold)? Note: "Borderline—verdict level-dependent."

  7. **Deliberate and Write Finding (20 min)**  
     - **Task**: Final decision and one-page report.  
     - **How**:  
       - If points ≥6 and verdict stable: Copying found. Assign sanctions:  
         - Minor (1–2 rare features): Credit earlier designer in rules.  
         - Major (3+ rare features): Public finding + removal from showcase.  
       - If points <6, no copying.  
       - If borderline (abstraction flip), no sanctions—state: "Similarity ambiguous; values-based dispute."  
     - **Report Template**:  
       ```  
       Finding: [Copying/No copying/Borderline]  
       Microdomain: [Genre, period]  
       Key Features: [List from Step 2]  
       Slippage Matches: [X rare, Y unknown, Z common]  
       Abstraction Check: [Stable/Unstable]  
       Sanctions: [None/Credit/Public finding + removal]  
       Notes: [e.g., "Comparison class disputed" or "Borderline due to level shift"]  
       ```

  ### Procedure Applied to Your Cases
  **Case 1: 2023 release vs. 2018 card game**  
  - **Step 1**: Microdomain = "Light strategy card games, 2018–2023." Conventions: Card-driven actions, resource tracking.  
  - **Step 2**: Original (2018) features:  
    - Card-based action selection (free in 2018—was innovative).  
    - Fixed turn order (forced—common).  
    - Resource balance (free—unique at the time).  
  - **Step 3**: Slippage:  
    - Card selection → Dice selection (same function: random action choice). Match.  
    - Turn order → Same. Match (but forced, so discarded later).  
    - Resource balance → Tweaked but same structure. Match.  
  - **Step 4**: Distinctiveness:  
    - Dice selection: Common in 2023 (many games use dice). → 0 points.  
    - Resource balance: Rare (unique ratios). → 3 points.  
  - **Step 5**: Tally = 3 points (below threshold).  
  - **Step 6**: Abstraction: Level up—both are "random action games." Level down—dice vs. cards changes probabilities. Verdict flips (3 points → 0 if we sub-feature randomness). Borderline.  
  - **Finding**: No copying (points <6). Abstraction note: "Similarity ambiguous at different levels; insufficient evidence."  
  - **Why**: The dice substitution and balance tweaks aren’t distinctive enough. The eight-month tweak claim is irrelevant—CAP focuses on design choices, not effort.

  **Case 2: Two deck-builders, four months apart**  
  - **Step 1**: Microdomain = "Deck-building games, current." Conventions: Starting deck, market row, shuffling.  
  - **Step 2**: All features (e.g., "buy cards from a row") are forced—present in ≥50% of genre games.  
  - **Step 3**: All matches (same functions), but all forced.  
  - **Step 4**: All common → 0 points.  
  - **Step 5**: Tally = 0.  
  - **Finding**: No copying. "Shared features are genre conventions."  
  - **Why**: Forced choices dominate—no signal of copying.

  **Case 3: Small studio vs. large publisher**  
  - **Step 1**: Microdomain = (e.g.) "Resource-drafting games, 2010s–2020s."  
  - **Step 2**: Complainant’s "signature" feature (e.g., "simultaneous worker placement") was free for them (innovative in their context).  
  - **Step 3**: Slippage test: Matches accused game (same function).  
  - **Step 4**: Distinctiveness:  
    - Panel discovers 1980s abstract game with identical mechanic.  
    - Feature not rare—existed historically → common (0 points).  
  - **Tally**: 0 points.  
  - **Finding**: No copying. "Feature not distinctive to complainant; present in prior art (1980s game)."  
  - **One-Page Report**:  
    ```  
    Finding: No copying  
    Microdomain: Abstract strategy games, 1980s–2020s  
    Key Features: Simultaneous worker placement (free for complainant)  
    Slippage Matches: 1 match (common)  
    Abstraction Check: Stable  
    Sanctions: None  
    Notes: Mechanic existed in 1980s; no copying from complainant.  
    ```  
  - **Why You Might Dislike This**: It protects innovation but can feel unfair—small studios may not know obscure prior art. Still, CAP rewards distinctiveness, not novelty-in-isolation. The large publisher’s bad faith (studying the game) doesn’t matter—only the design space does.

  ### Honest Limits: Where CAP Breaks Down
  CAP misfires or requires human judgment in these cases:  
  - **Misfires in novel microdomains**: If a game pioneers a genre (e.g., the first legacy game), Step 1 fails—no comparison class exists. CAP may falsely flag conventions as "free."  
    - *Fix*: Decline jurisdiction. Finding: "No established microdomain; use legal channels."  
  - **Values-based decisions**: When:  
    - Abstraction flips (Step 6): The panel must decide "how similar is too similar?" CAP outsources this to human judgment.  
    - Distinctiveness is unestimable (Step 4): If the panel can’t assess rarity, points rely on weak evidence.  
    - *Fix*: Sanctions only if evidence is strong (≥6 points with no unknowns). Else, "no finding" or "borderline" note.  
  - **Theme/art disputes**: CAP ignores these. If the complaint is purely thematic (e.g., "both are pirate games"), decline immediately.  
  - **Edge cases**: Sliding-scale mechanics (e.g., "how many tweaks make it different?") or games blending genres. CAP may under/overcount.  
    - *Fix*: Default to "no copying" if points <6.  
  - **When to decline**:  
    - No microdomain agreement even after broad default (Step 1).  
    - Complaint is about IP theft, not design (e.g., art assets).  
    - Time runs out—CAP requires strict timing.

  ### Volunteer-Friendly Procedure (Theory in Appendix)
  **CAP Cheat Sheet (1-Page Summary for Panelists)**  
  **Goal**: In 90 mins, decide if Game B copied Game A’s design. Ignore art/theme.  
  **Steps**:  
  1. **Fix the Playground (15 min)**: Agree on:  
     - Genre (e.g., "deck-builder").  
     - Time period (accused game’s release).  
     - Top 3–5 games in that genre/time.  
     - Stuck? Pick broad genre (e.g., "card game"), write "disputed."  
  2. **Spot Key Features (10 min)**: Complainant lists 1–5 mechanics from Game A. For each:  
     - Was it common in top games when Game A launched? Yes → forced; No → free.  
     - (If free for A but common now, still mark "free" for A.)  
  3. **Map Functions (20 min)**: For each "free" feature:  
     - What’s its job? (e.g., "drafting cards" → job: "pick options from a pool").  
     - Does Game B have something with the same job? (e.g., "drafting tokens" → yes).  
     - Write "match" or "no match."  
  4. **Check Rarity (15 min)**: For each "match":  
     - How many top games (Step 1) have this? ≤2 → rare; ≥3 → common; unsure → unknown.  
     - (Stuck? Ask: "Could half the genre skip this?" Yes → rare; No → common.)  
  5. **Add Points (10 min)**:  
     - Rare = 3 pts, Unknown = 1 pt, Common = 0 pts.  
     - Total ≥6? → Maybe copying. <6? → Stop: no copying.  
  6. **Zoom In/Out (10 min)**:  
     - Group features (e.g., "drafting + shuffling" → "card management"). Still match?  
     - Split one feature (e.g., "drafting" → "draw 2, pick 1"). Still match?  
     - Changed points? → Write "borderline."  
  7. **Decide and Write (20 min)**:  
     - ≥6 pts and no borderline? → Copying. Sanctions:  
       - 3–8 pts: Credit original designer in rules.  
       - 9+ pts: Public finding + remove from showcase.  
     - Else: No copying. If borderline, write "similarity unclear."  
     - Report: Use template [from Step 7 above].

  **Appendix: Theory in 2 Sentences**  
  - Concepts slip: Judge structure (function), not surface (dice/cards).  
  - Similarity only counts if rare: Fix the domain (genre/time) to avoid biased comparisons.  

  This procedure balances rigor and pragmatism. It won’t eliminate all disputes—similarity is inherently fuzzy—but it will make your findings consistent, defensible, and grounded in how concepts actually work. Run a mock case with your panel to refine it.
