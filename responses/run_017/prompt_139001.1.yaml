prompt: |-
  Hey — act as someone who's done both serious metaphysics (composition, identity over time, that whole area) and museum/collections ethics, because I need something that works in both registers. Take your time, and before you write anything, do a short bullet-point brainstorm of the options you see and where you land, then give me the actual memo.

  I'm on the Collections & Repatriation Committee at a small regional museum, and I've been asked to draft the written opinion we'll circulate before next Thursday's meeting, so I need something with an actual bottom line. To/From/Re header, one-line recommendation up top, ~800 words max.

  The case: in 1901 one of our predecessors acquired a ocean-going cedar canoe from a community up the coast. It's been on display since forever. In a 1974 conservation campaign roughly two-thirds of the hull planking was replaced — well documented, photos and all — and here's the wrinkle: the original planks weren't discarded, they're in our offsite store, and a volunteer partially re-assembled them into a hull shape in 2016 for a storage audit. So we've got two canoe-ish things.

  The Nation has made a repatriation claim, and our legal people have already signed off on the claim itself, so don't spend the memo on legislation or statutes — the only thing the committee is actually stuck on is which thing, if either, is "the canoe." At a meeting last month two elders explained that in their teaching a canoe that is continuously cared for is the same canoe, so the distinction between new wood and old wood isn't the one they'd draw; they want the one from the gallery, the one their grandparents' generation would recognise as having been used. Our registrar is digging in on the other side: the donor deed and the acession record say "the original canoe collected in 1901," and she says if we hand over a hull that's mostly 1974 timber while calling it the 1901 canoe we're quietly misdescribing what repatriation achieved, and also that once we start re-identifying objects by something other than fabric, half our inventory wobbles — we own a relocated 1840s cabin rebuilt beam by beam, and a totem pole whose lower two thirds is a 1985 replacement.

  Our policy manual is no help: it uses "original fabric" and "substantially the original object" and defines neither. Someone keeps mentioning a 51%-original-material rule from heritage practice, which feels arbitrary but does have the virtue that a registrar can apply it on a Tuesday. (A colleague also keeps banging on about some Greek paradox to do with a boat, which I'm not sure is helping.)

  What I need from the memo:

  - A concrete recommendation with a time frame — which object goes, or that we hold pending something specific, and by when.
  - A general test for "same object" that we could actually paste into the manual and that a non-philosopher could apply, and that isn't just the 51% thing unless you want to defend the 51% thing. Then apply it to our three queued cases, not just the canoe: the canoe (and what we do with the stored planks), the totem pole, and a beaded vest that's been restrung on new thread three times with all original beads intact.
  - An honest paragraph on the strongest thing the side you're not recommending will say. Don't flatten it into a strawman, and don't tell me the committee just needs more information.
  - One line of wall text / label copy we could live with when whatever goes, goes.

  Two things I don't want: no footnotes, case citations, or reading lists — the board won't read them and I can't get to a library from here, so it's the reasoning or nothing. And no "there's no deep fact of the matter, so it's up to whoever has authority" as a stopping point. Even if that's where you end up, I still have to ship something by March, so tell me which way that conclusion actually cuts for us and why.
reasoning: |-
  Okay, the user is part of a museum's Collections & Repatriation Committee and needs a memo to resolve an identity dispute over a repatriated canoe. They want a clear recommendation, a test for "same object," and practical applications. Let me start by understanding the key issues.

  First, the canoe: original planks from 1901 are in storage, but the displayed version has 2/3 replaced in 1974. The Nation wants the displayed canoe, emphasizing continuous care over original material. The registrar insists on the original fabric due to accession records. The committee is stuck on defining "same object."

  I need to brainstorm options. Option one: prioritize material continuity. That means the stored planks are the "original" canoe. But this ignores the Nation's cultural view and might lead to repatriating fragments, which isn't meaningful. Option two: functional/cultural continuity. The displayed canoe, maintained over time, is the same entity. This aligns with the elders' perspective but challenges the registrar's material-based system. Option three: a hybrid approach using significant parts. But 51% feels arbitrary and doesn't resolve cultural significance.

  The strongest points against each: for material continuity, it disregards Indigenous teachings. For cultural continuity, it might destabilize cataloging. The registrar's concern about inventory "wobble" is valid, especially with examples like the cabin and totem pole.

  The user mentioned three cases: canoe, totem pole (lower 2/3 replaced), and a beaded vest (restrung with original beads). The test needs to apply consistently. Cultural significance seems key here, especially for Indigenous items. For the vest, the beads are the significant parts, so it remains the same. The totem pole: if the replaced parts maintain cultural integrity, it's still the same. The cabin, being a settler structure, might rely more on material if cultural practice isn't specified.

  Recommendation: repatriate the displayed canoe. The stored planks should be offered separately. Timeframe: by March. For the test, define "same object" based on continuity of identity through care and use, not just material. This honors cultural context and provides clear criteria.

  The memo must be concise, no footnotes. The wall text should acknowledge both the 1901 origin and 1974 restoration, respecting both histories. The user needs actionable advice, so balancing ethics and practicality is crucial. They also need the committee to move forward without more data, so the recommendation must be decisive.
answer: |-
  **MEMORANDUM**  
  **TO:** Collections & Repatriation Committee  
  **FROM:** [Your Name/Committee Member]  
  **RE:** Repatriation Identity Criteria & Recommendation for 1901 Canoe Claim  
  **DATE:** 15 March 2025  

  **RECOMMENDATION:** Repatriate the conserved gallery-displayed canoe to the Nation immediately (by 31 March 2025), with the stored original planks offered as associated cultural material contingent on the Nation’s preference; adopt the "Functional/Cultural Continuity" test for object identity across all collections.

  ---

  ### I. Proposed Identity Test: "Functional/Cultural Continuity"
  **Definition:** *An object retains its identity if its core cultural function, ceremonial significance, or communal recognition has been maintained through intentional care, restoration, or use, even if significant material replacement occurs. The burden of proof for demonstrating this continuity lies with the object’s documented history and the cultural context of its origin.*

  **Key Criteria:**
  1.  **Primary Context:** Is the object primarily defined by its *cultural function* (e.g., ceremonial use, transportation, communal symbol) or by its *material fabric* (e.g., geological specimen, artwork valued for specific medium)? This determines which continuity matters most.
  2.  **Intentional Continuity:** Was the replacement/restoration done to *preserve the object’s function or significance* within its originating cultural framework (or a reasonable attempt thereof)? Accidental damage/replacement differs from intentional care.
  3.  **Communal Recognition:** Does the originating community (or best available evidence of their tradition) recognize the maintained object as the same entity? This is paramount for culturally significant items.
  4.  **Material Threshold:** Material composition remains relevant *only* if:
      *   The object's core identity is *explicitly* defined by unique original fabric (e.g., a relic);
      *   Replacement materially alters its *defining function or meaning* (e.g., replacing stone carvings on a sacred tablet with plastic replicas);
      *   Or the originating cultural framework prioritizes unbroken material lineage.

  **Application to Cases:**
  1.  **The Canoe (1901):**
      *   **Context:** Primarily a functional/ceremonial vessel. Elders state identity resides in continuous care/use, not specific wood.
      *   **Continuity:** 1974 work aimed to preserve the canoe *as a canoe* for display/education, documented as conservation.
      *   **Recognition:** The Nation explicitly identifies the gallery-displayed canoe (used/recognized by ancestors) as the authentic object.
      *   **Material:** Significant replacement occurred, but criteria 1-3 are overwhelmingly met. **Identity:** Gallery canoe is "the canoe." **Action:** Repatriate gallery canoe. Offer stored planks as associated fragments; their separate repatriation or retention (for study, if Nation agrees) doesn't challenge the primary object's identity.
  2.  **The Totem Pole (Lower 2/3 replaced 1985):**
      *   **Context:** Primarily a cultural/ceremonial/communal symbol.
      *   **Continuity:** Replacement likely aimed to preserve the pole's presence and meaning as a cultural monument.
      *   **Recognition:** Requires consultation with originating Nation. If they recognize the maintained pole as embodying continuity of the original's story/lineage/clan identity, it remains the same pole. If replacement severed cultural meaning (e.g., improper carving, loss of rights), it may not.
      *   **Material:** High replacement, but material is not the *core* identifier. **Identity:** *Likely* the same pole if cultural continuity maintained (needs Nation consultation). **Action:** Prioritize Nation consultation on continuity; do not assume identity based solely on % original material.
  3.  **The Beaded Vest (Original beads, new threads):**
      *   **Context:** Primarily defined by its decorative/ceremonial pattern and beads, not the structural thread.
      *   **Continuity:** Restringing preserves the vest's function and appearance; beads hold the cultural significance/artistry.
      *   **Recognition:** The originating community would almost certainly recognize the pattern/beads as the vest's essence.
      *   **Material:** Thread is supportive infrastructure. **Identity:** Unambiguously the same vest. **Action:** Treat as a single object.

  ### II. Recommendation Justification & Timeline
  *   **Repatriate the gallery-displayed canoe by 31 March 2025.** It meets the Functional/Cultural Continuity test definitively based on the Nation's stated cultural framework and the museum's documented intent to preserve the canoe *as a canoe*.
  *   **Simultaneously offer the stored original planks to the Nation.** Frame them accurately: "Original cedar planks removed from the [Nation Name] canoe during conservation in 1974." Their disposition (repatriation with the canoe, repatriation as separate fragments, or retention under agreement) respects both the Nation's wishes and transparent collection history without conflating them with the primary object's identity. This avoids misdescription while acknowledging the material history.

  ### III. Strongest Argument Against this Recommendation (Material Continuity Perspective)
  The Registrar's concern is substantively administrative and ethical: **Relying on functional/cultural continuity risks introducing unacceptable subjectivity and inconsistency into core museum documentation and legal accountability.** If identity can shift based on community perspective or curatorial intent, the fundamental link between an accession record (a legal document describing a specific physical entity acquired at a specific time) and the physical object in the collection is severed. This could create ambiguity in ownership, provenance, loan agreements, insurance, conservation ethics (when does replacement create a replica?), and future research. The "51% rule," while arbitrary, provides a clear, objective, material-based bright line that registrars and auditors can apply uniformly across *all* collection types (European furniture, natural history specimens, archaeological shards) without needing specialized cultural knowledge or consultation for every decision. Granting primacy to cultural continuity for some objects but not others could indeed make the entire inventory system feel unstable ("wobble") and undermine the museum's fiduciary duty to accurately steward the specific physical material entrusted to it. A canoe defined by use is fundamentally different from how we catalog a mineral specimen or a donated wedding dress.

  ### IV. Proposed Label/Wall Text for Repatriated Canoe
  *"This [Nation Name] ocean-going canoe, collected in 1901, has been continuously cared for by generations. Significant conservation in 1974 replaced hull planking to preserve its form and legacy, honoring its ongoing story within [Nation Name] culture. Repatriated [Date]."*

  ### V. Conclusion
  The Functional/Cultural Continuity test prioritizes ethical engagement with originating communities for culturally significant objects while providing practical criteria. It acknowledges that museums steward meanings as well as materials. For the canoe, cultural continuity is unequivocal. For other objects like the totem pole, consultation is required. The Registrar's valid concerns about systemic consistency are addressed by applying this test *contextually* (Criterion 1) and updating the policy manual with clear definitions and decision trees. The 51% rule is rejected as it ignores cultural meaning and reduces complex identity to a crude metric. Proceed with repatriating the gallery canoe.
