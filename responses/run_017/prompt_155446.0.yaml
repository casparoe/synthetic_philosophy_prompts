prompt: |-
  I should say at the outset that I have no academic background in philosophy or Buddhist studies. I read on my own — mostly English translations of early Buddhist texts, and, for reasons that began separately, a good deal of the effective-altruism literature — and the two reading habits keep colliding over one sentence.

  The sentence is "Buddhism is about intentions, not consequences." As I have seen it explained by people who know the languages, it descends from a line in the Pali canon where the Buddha, asked what karma is, answers with a word usually rendered "intention" but said to be nearer to "volition" or "the mind's setting itself toward something" than to the loose modern sense of "meaning well." I mention that only because the gap between those two English senses may be doing a lot of the work.

  I met it last in an argument about whether a Buddhist ought to care whether her actions do any good. My interlocutor's use was this: a Buddhist's reasons for acting stop at the quality of the mind she acts from; whether the action feeds anyone, cures anyone, or alters anything in the world is, in his words, consequentialist contamination, and auditing outcomes is something only a utilitarian would insist on. He deployed the sentence to dismiss, wholesale, the practice of comparing two candidate actions by their expected effects.

  What I want is the menu hiding inside the sentence. The distinctions I have been turning over, without being able to tell which are load-bearing, are roughly these: a claim about what fixes an action's karmic quality, versus a claim about the criterion of right action, versus a claim about praiseworthiness or merit as opposed to rightness; a claim about what is within an agent's control; a claim about which consequences are the relevant ones — effects on the world, versus effects on the agent's own mind, dispositions and progress toward liberation; a claim riding on the fact that the standard term is often translated "skillful," which sounds like a notion measured by success; and a claim drawn from the no-self teaching, to the effect that if there is no one who owns the outcome, outcomes cannot matter. I also cannot tell whether any of these sits comfortably with the precepts being stated as prohibitions on bringing things about — on killing, on taking what is not given — rather than as prohibitions on states of mind.

  To pin the readings down, three cases. (A) You spend a day at a food bank so overstaffed that your presence changes nothing measurable; you go from unfeigned goodwill and your mind is patient and generous throughout. (B) You take on a tedious administrative job that keeps a free clinic open, which reliably treats dozens of people a month; you do it resentfully, mainly because you were shamed into it. (C) You try to help, through no malice, and botch it, causing harm you did not foresee.

  Could you lay the readings out as a list — a table would suit me best — with one row each: the precise thesis stated in a sentence; whether it is a platitude, a substantive and defensible claim, or false or confused; whether it would actually deliver my interlocutor his conclusion; and what it implies about A, B and C, separately for "which act has more merit" and "which act is the better one to do," since I suspect those two come apart. Finally, which reading you take people to mean when they repeat the sentence, and whether that is the reading their argument needs.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex philosophical question about Buddhist ethics, specifically the tension between intentions and consequences. They've clearly done extensive reading but lack formal training, so I need to bridge that gap carefully.

  The core issue revolves around interpreting "Buddhism is about intentions, not consequences" and its implications for ethical decision-making. The user provides three concrete cases to test different interpretations, which is helpful for grounding the discussion. They're essentially asking for a taxonomy of possible readings of this Buddhist principle.

  First, I should acknowledge the sophistication of their question. They've identified multiple layers: karmic quality vs. ethical rightness, control vs. outcome, skillful action (kusala) as efficacy, and no-self implications. Their three scenarios (A, B, C) are well-chosen to probe these distinctions.

  The key sources to address are from the Pali Canon:
  - AN 6.63 (intention as karma)
  - MN 61 (skillful action definition)
  - MN 135 (karma mechanics)
  - MN 8 (compassionate motivation)
  - SN 12.41 (intention as driver)

  I'll organize this as a comparative analysis table as requested. For each interpretation, I'll assess:
  1. The precise thesis
  2. Its plausibility (platitude/defensible/confused)
  3. Whether it supports their interlocutor's anti-consequentialism
  4. Implications for scenarios A/B/C regarding merit vs. better action
  5. Popular understanding vs. argumentative validity

  Notable challenges:
  - The "skillful" (kusala) translation implies efficacy, creating tension with pure intentionalism
  - Precepts are formulated as outcome-based prohibitions (killing, stealing)
  - Bodhisattva ideal in Mahayana explicitly values beneficial outcomes

  The user seems particularly interested in whether Buddhist ethics can accommodate effective altruism concerns. I should flag where these might align (e.g., compassion motivation) versus conflict (e.g., karmic individualism).

  For the scenarios:
  - A tests whether neutral outcomes negate merit
  - B examines if good outcomes without good intent have value
  - C probes unintended consequences with good intentions

  I'll conclude by noting that their interlocutor's position represents an extreme interpretation that neglects textual evidence for consequence-awareness. The most balanced reading integrates intention as primary but not exclusive factor, with skillful means requiring situational responsiveness.
answer: |-
  Your analysis is remarkably perceptive – you've identified the core tensions in interpreting Buddhist ethics. Below is a comparative table dissecting the possible readings of "Buddhism is about intentions, not consequences," assessed against your criteria and cases. Sources are drawn primarily from the Pali Canon (e.g., AN 6.63, MN 61, MN 135) and scholarly interpretations (e.g., Keown, Goodman, Siderits).

  ### Key to Columns:
  - **Thesis**: Precise philosophical claim derived from the sentence.
  - **Plausibility**: 
    - *Platitude*: True but trivial, misses nuance.  
    - *Defensible*: Textually/ethically substantiated.  
    - *Confused/False*: Contradicts core texts or logic.
  - **Supports Interlocutor?**: Does this reading justify dismissing outcome comparison?
  - **A/B/C Implications**: 
    - *Merit*: Karmic fruitfulness (puñña) or mental purification.  
    - *Better Action*: Ethical "rightness" (duty, wisdom, or compassion).
  - **Common Usage?**: What people typically mean when invoking the sentence.
  - **Argument Valid?**: Whether this reading logically supports their anti-consequentialist stance.

  ---

  | Thesis | Plausibility | Supports Interlocutor? | Case Implications | Common Usage? | Argument Valid? |
  |--------|--------------|------------------------|-------------------|---------------|-----------------|
  | **1. Karmic Quality Thesis:**<br>*"An action's karmic result (vipāka) for the actor is determined *solely* by intention (cetanā), not external outcomes."* (AN 6.63) | **Defensible**<br>Supported by suttas (e.g., MN 135). Karma is mental conditioning. | **Weakly**<br>Only addresses *personal karmic burden*, not ethical rightness. | **A:** High merit (purifies mind). **B:** Low merit (reinforces resentment). **C:** Low merit (ignorance, but no ill-will).<br>*Better Action:* Silent. Karma ≠ ethics. | **Rare** | **No**<br>Karmic mechanics ≠ moral criterion. |
  | **2. Right Action Thesis:**<br>*"An action is ethically 'right' (kusala) iff it arises from wholesome intentions (non-greed, non-hatred, non-delusion)."* (MN 61) | **Defensible**<br>Kusala = "skillful," rooted in wholesome roots. | **Partially**<br>Focuses on mental state, but "skillful" implies effectiveness. | **A:** Right (wholesome mind). **B:** Wrong (resentment). **C:** Wrong (delusion).<br>*Better Action:* A > B/C. | **Common** | **No**<br>"Skillful" (kusala) implies wisdom/effectiveness (see below). |
  | **3. Control Thesis:**<br>*"Only intentions are within the agent's direct control; consequences are contingent (dependent on conditions). Thus, ethics must prioritize intention."* (Based on SN 12.41) | **Defensible**<br>Aligns with focus on "own mind" (Dhp 160). | **No**<br>Doesn't forbid considering *predictable* outcomes within one's control. | **A:** High merit (control used well). **B:** Low merit (control misused). **C:** Merit ambiguous (effort vs. negligence).<br>*Better Action:* A/B/C depend on *effort to foresee outcomes*. | **Very Common** | **No**<br>Prioritizing control ≠ ignoring outcomes. Bodhisattva ideal requires outcome-awareness. |
  | **4. Soteriological Consequences Thesis:**<br>*"The *only* consequences that matter are those affecting the mind's liberation (e.g., craving/clinging), not worldly results."* | **Defensible**<br>Noble Eightfold Path is soteriological. | **Yes, but...**<br>Reduces ethics to self-liberation. Ignores compassion (karuṇā). | **A:** High merit (cultivates generosity). **B:** Low merit (cultivates resentment). **C:** Low merit (cultivates delusion).<br>*Better Action:* A (best for liberation). | **Occasional** | **Yes, but narrow**<br>Renders social ethics irrelevant. Contradicts precepts. |
  | **5. No-Self & Non-Attachment Thesis:**<br>*"Since there is no 'self' (anattā), outcomes (which imply a fixed self to benefit/harm) are illusory; only present-moment intention is real."* | **Confused**<br>Anattā denies *inherent* self, not conventional agency. Precepts assume responsibility. | **Yes**<br>Dismisses worldly outcomes as "not real." | **A/B/C:** Merit depends solely on intention's purity.<br>*Better Action:* Indifferent to outcomes. | **Rare (but trendy)** | **No**<br>Misapplies anattā. Ignores dependent origination (outcomes affect suffering). |
  | **6. Skillful Means Thesis (Corrected):**<br>*"Kusala ('skillful') actions require intentions aligned with wisdom (paññā) *and* compassion (karuṇā), which inherently consider foreseeable outcomes to reduce suffering."* (MN 8, MN 20) | **Defensible**<br>Balances intention, wisdom, & compassion. "Skillful" implies efficacy. | **No**<br>*Requires* outcome assessment to avoid harm (C) and maximize benefit (B). | **A:** Moderate merit (good intent, but wasted effort). **B:** Moderate merit (bad intent, but compassion fulfilled). **C:** Low merit (good intent, unskillful execution).<br>*Better Action:* **B > A > C** (if B's outcome is significant). | **Rare** | **N/A**<br>Directly refutes interlocutor. |
  | **7. Interlocutor's Thesis:**<br>*"Assessing outcomes contaminates motivation. Right action ignores consequences entirely."* | **False**<br>Contradicts Vinaya (monastic rules based on outcomes) and suttas (e.g., MN 61: abstaining from harm *because* it causes harm). | **Self-Serving** | **A:** Only "pure" choice. **B/C:** Wrong due to bad intent/outcome focus.<br>*Better Action:* Only A. | **Very Common** | **Circular**<br>Assumes what it argues. |

  ---

  ### Key Conclusions:
  1. **Your Interlocutor's Position** (#7) is a **misreading**: It confuses *karmic mechanism* (#1) with *ethical criteria* (#2, #6) and ignores "skillfulness" (kusala), which demands *both* wholesome intent **and** wisdom about outcomes (MN 61 explicitly links intention to harmlessness).  
  2. **Merit vs. Better Action**:  
     - *Merit* (karmic/mind purification) prioritizes intention (A wins).  
     - *Better Action* (ethics/wisdom/compassion) **requires outcome consideration** (B wins if outcomes are significant).  
  3. **Precepts**: Prohibitions on killing/stealing *presuppose* outcomes – they forbid *causing harm* or *causing loss*, not just mental states (Vinaya rules explicitly reference outcomes).  
  4. **Cases Clarified**:  
     - **A**: High merit, but ethically unskillful if resources could be used effectively elsewhere (per #6).  
     - **B**: Low merit (resentment), but ethically superior to A if it alleviates more suffering (#6).  
     - **C**: Merit ambiguous (intent good, wisdom lacking); ethically wrong due to unskillfulness.  
  5. **Effective Altruism Compatibility**: Buddhism *requires* outcome-assessment for compassionate action (#6) but rejects *utilitarian calculus* divorced from intention. The Middle Path avoids both extremes: obsession with outcomes *and* ignoring them.

  **Why People Misuse the Sentence**: The "intentions, not consequences" slogan (#7) is rhetorically useful to dismiss accountability or complex ethics. But as your analysis shows, it collapses under textual scrutiny. The defensible view (#6) integrates intention with wisdom-guided concern for consequences – a middle way your interlocutor misses.
