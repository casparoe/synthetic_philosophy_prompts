prompt: |-
  I retired four years ago after a career in sensory physiology — thirty-odd years working on rod and cone function in nocturnal mammals — and I have since been auditing a continuing-education seminar in bioethics, which is how I came to be appointed the "community scientist" member of our teaching hospital's Novel Interventions Committee. The committee maintains two lists: interventions we classify as restorative, which the hospital funds and our clinicians may prescribe, and interventions we classify as elective, which a patient may obtain privately but which we do not pay for. What has struck me in my first year is that we are far better at producing verdicts than at stating the rule we are running; the seminar readings draw a tidy line between restoring normal function and improving beyond it, but our own decisions seem to me to be consistent with several different lines at once, and I would like that made explicit before our next meeting.

  Our recent verdicts, in brief: a cochlear implant for a toddler with congenital profound sensorineural hearing loss went on the restorative list, with fairly short shrift given to the argument that deafness is a cultural identity rather than a deficit; deep brain stimulation for advanced Parkinson's tremor, restorative; testosterone replacement for a sixty-eight-year-old man with serum levels in the lowest decile and documented fatigue, restorative, but with the explicit proviso that the dosing target is the range typical of healthy men in their forties rather than their twenties; modafinil for residents on night float who have no sleep disorder, elective; standard walking prostheses for a bilateral below-knee amputee, restorative, while the carbon-fiber running blades the same man wanted for competition were elective, five to two, despite his argument that they merely restore the locomotive range everyone else enjoys; growth hormone for a boy with idiopathic short stature — no deficiency, no disease, predicted adult height near the third percentile — elective, four to three, over a dissent holding that severe short stature is a real social and psychological disadvantage and not a bare preference; and a hippocampal memory prosthesis for a man with lasting impairment after viral encephalitis, restorative only after the manufacturer agreed to a firmware cap holding performance near the median of the age-matched normal range, with the minutes recording that we would not have funded an uncapped version.

  Next month's case is the one I cannot see our way through. A thirty-four-year-old wildland firefighter with early-stage retinitis pigmentosa — measured acuity 20/60, pronounced night blindness, expected to progress — is being offered enrollment in a trial of a camera-based cortical visual prosthesis. In the trial data it brings daytime acuity to roughly 20/25, still below her premorbid 20/15, and because the camera's sensor extends into the near-infrared it also generates a false-color overlay that gives genuinely useful vision in darkness and through smoke. The manufacturer can switch that overlay off in firmware, but only at the cost of dropping measured acuity to about 20/50, since the device's contrast processing draws on the additional spectral channels: the supra-normal effect is not a detachable extra but is causally entangled with the therapeutic one, a "bundling" problem I keep raising in the seminar and cannot get anyone to rule on. Without the implant she will lose her field certification within the year; a desk assignment exists, but it ends the career she wants. A related case is already queued behind hers: the same prosthesis for a sixty-one-year-old colleague whose night vision has declined to the ordinary extent for her age, with no ocular disease at all.

  What I need from you, in under 500 words and in three short labeled sections rather than a single block: first, the two or three rules our precedents are jointly consistent with — a pathology-or-medical-need rule, a restore-to-the-normal-range rule, an opportunity-or-positional-advantage rule, or something I have not thought of — and what each of them predicts for the firefighter, including whether the "normal" in question is indexed to the species, to an age cohort, or to a person's occupational role; second, your recommended classification and the closest analog among our own precedents, together with an honest statement of the principle we would be adopting under each of the alternatives, including funding her with the overlay disabled or declining outright; third, the single further case whose verdict would best separate the surviving rules, and whether my queued sixty-one-year-old actually does that work or merely repeats what the amputee's blades already told us.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired sensory physiologist serving on a hospital ethics committee, grappling with classification rules for medical interventions. Their detailed case descriptions reveal a pattern-seeking mind frustrated by inconsistent principles.

  First, examining the precedents:
  The cochlear implant and Parkinson's treatment clearly follow a pathology-based rule - correcting clear physiological deficits. The testosterone case introduces an age-adjusted normal range concept, while the modafinil decision rejects enhancement for non-pathological situations. The prosthetic blade case is particularly telling, distinguishing basic function restoration from performance enhancement. The growth hormone dissent highlights how social disadvantage complicates purely medical definitions.

  For the firefighter case, three potential rules emerge:
  1) The Pathology Rule (treats diagnosed disease) would support funding since RP is undisputed pathology. But the infrared vision creates tension as it exceeds normal human capacity.
  2) The Normal Species Function Rule (restores to typical human baseline) becomes messy because the implant's best acuity (20/25) is below her premorbid 20/15 but above species average, while the IR capability is clearly supra-normal. 
  3) The Occupational Baseline Rule (enables core professional function) is suggested by the blade precedent - but that case specifically rejected occupational enhancement.

  The firefighter's situation is unique because the "enhancement" (IR vision) is inseparable from therapeutic benefit. Disabling IR reduces acuity below pathology baseline (20/50 vs 20/60), creating a true bundling problem. 

  My recommendation:
  Classify as restorative ONLY WITH OVERLAY DISABLED. This follows the hippocampal prosthesis precedent where capped performance was funded. The principle: we restore function to the normal species range (20/50 is near her current deficit) but not beyond. Her career loss becomes an unfortunate consequence, not our mandate to prevent.

  The queued 61-year-old firefighter perfectly tests these principles. No pathology exists - just age-related decline. Funding her would reveal adoption of an occupational enhancement rule; rejecting her confirms we draw the line at pathology. This differs from the amputee blades case because those provided positional advantage in sports, not core occupational capacity.

  The key tension remains: do we treat only disease, or also address socially disabling conditions? The growth hormone dissent suggests this committee hasn't resolved that. A future case involving non-pathological but socially crippling conditions (like extreme non-disease-linked short stature) could force clarification.
answer: |-
  Here's a concise analysis addressing your request:

  **1. Rules Consistent with Precedents & Predictions for Firefighter:**

  *   **Rule A: Restore Species-Typical Function (Pathology-Based):** Funds interventions correcting a diagnosed disease/disorder to restore function within the typical *human species* range. Predicts funding the prosthesis **without the IR overlay** (as it restores acuity to ~20/50, closer to her "diseased" 20/60 than species-typical acuity). IR overlay is supra-normal enhancement, excluded. Occupational role is irrelevant.
  *   **Rule B: Restore Age/Health-Adjusted Normal Function:** Funds interventions restoring function to the typical range for a *healthy person of similar age/health status*. Predicts **funding the prosthesis with the IR overlay disabled** (aiming for best possible acuity restoration (~20/50), even if impaired, within the age-adjusted "normal" spectrum). IR overlay enhancement excluded. Career loss is unfortunate but not the committee's mandate to prevent via enhancement.
  *   **Rule C: Mitigate Significant Disadvantage (Medical/Social):** Funds interventions addressing a significant disadvantage caused by pathology *or* inherent condition, even if it approaches enhancement, prioritizing functional need over pure species-typicality. Predicts **funding the prosthesis WITH the IR overlay** as her career depends on *functional vision in smoke/darkness* (a core occupational need), and disabling it undermines the therapeutic benefit (acuity drop). The "bundled" IR is necessary for meaningful functional restoration *in her specific context*. Occupational role defines the relevant functional baseline.

  **2. Recommended Classification & Principle:**

  *   **Classification:** Restorative (funded), **WITH the IR overlay disabled.**
  *   **Closest Analog:** **Hippocampal Prosthesis (capped).** The core principle is restoring function impaired by pathology *to a level approximating the normal range for the species or age*, explicitly rejecting uncapped enhancement beyond that norm.
  *   **Principle Adopted:** **Rule B (Restore Age/Health-Adjusted Normal Function), leaning towards Rule A.** The committee funds correction of the *pathology* (RP) to achieve the best possible visual acuity within the normal human range (~20/50 with overlay off), even if suboptimal. The IR overlay's supra-normal capability and its entanglement don't justify funding enhancement. Her career loss is secondary to correcting the medical deficit within normative bounds.
      *   *Funding with Overlay:* Would adopt **Rule C (Mitigate Significant Disadvantage)**, prioritizing functional restoration *for her specific life/career* over strict species-typicality, accepting necessary "bundled" enhancement as part of therapeutic restoration.
      *   *Declining Outright:* Would strictly apply **Rule A (Species-Typical Function)**, finding even the disabled-overlay version potentially insufficient restoration or too entangled with enhancement.

  **3. Best Separating Case & Queued Firefighter:**

  *   **Best Separating Case:** **A non-disabled individual seeking solely performance enhancement in a high-stakes profession** (e.g., a surgeon with normal vision wanting IR overlay for better tissue differentiation during complex operations).
  *   **Queued 61-Year-Old Firefighter:** This case **effectively separates the rules**, more so than the amputee's blades. The blades were *clearly* for competitive advantage beyond basic locomotion. Here:
      *   **Rule A/B:** Would classify as **Elective.** No pathology exists; it's age-related decline. Funding would be pure occupational enhancement beyond normal aging.
      *   **Rule C:** *Could* classify as **Restorative** if "functional decline impacting core occupational capacity" is deemed a significant disadvantage worthy of intervention, even without pathology, mirroring the growth hormone dissent logic. This directly challenges the pathology requirement highlighted in Rules A/B.
      *   **Vs. Amputee Blades:** The blades restored a *non-essential* function (competitive running). This case involves *core occupational function* (vision for firefighting) impacted by *normal aging* (not pathology or injury), making it a sharper test of whether the committee funds interventions solely for occupational maintenance against normative decline.
