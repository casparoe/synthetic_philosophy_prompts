prompt: |-
  I'm a third-year undergraduate taking an interdisciplinary seminar on agency and embeddedness — about half philosophy students, half CS — and I have to lead next week's fifty-minute tutorial. I've been assigned the cluster of problems around an agent's values depending on the ontology of its world-model: a utility function defined over high-level categories that a learned model supplies, where further learning can shift, split, or eliminate those categories, and where the agent then has to decide whether to keep tracking the original referents or to reinterpret its values inside the revised model. I also want to include the further point that some of what bears on that decision is not merely unknown but inaccessible: two candidate world-models can agree on every observation sequence the agent could ever receive while disagreeing about the extension of a category its values depend on, so no further data and no amount of inference discriminates between them.

  Don't write the explanation for me. Give me a plan for the fifty minutes.

  My draft order is: (1) utility as a function of model-relative features rather than of the world directly; (2) world-models get revised under evidence; (3) what revision does to categories — drift, eviction, splitting; (4) the resolution rule an agent would need, conservative versus reinterpretive; (5) inaccessible information; (6) why this is neither out-of-distribution robustness nor general skepticism about reference. I suspect (5) has to come before (4), because the resolution rule only looks like a real choice once the students see that evidence cannot settle it — but I'd rather you tell me what actually depends on what, which of my six items can be merged or dropped, and roughly how many minutes each block deserves.

  I'm stuck on the example that should carry the whole session. Candidates: a system whose values are defined over persons, facing brain emulations; a conservation-planning system whose values are defined over species, which then learns that the groups it was tracking are not natural kinds — ring species, horizontal gene transfer — so that whether two populations are the same species turns both on facts about actual gene flow and on which of several competing species concepts its own values meant; and an endowed foundation whose founding document's terms eventually describe nothing. My worry is that the first reads as futurism and drags in personal identity and consciousness, and that the third makes the problem look like ordinary semantic drift, which I take to be a shallower and different problem. Pick one, say what the carrying example has to contain and to lack, and say precisely why each loser fails — including whether my diagnoses of their failures are right.

  The misconceptions I expect, in the order I expect them: from the CS half, that this is just distributional shift and the fix is more diverse training data; from the philosophy half, that this is Quinean underdetermination of reference and there is nothing special about artificial agents; then, from somewhere, that defining the utility over low-level physical states or raw inputs makes the problem vanish; that a Bayesian agent with enough evidence converges on the right ontology; that the agent can simply keep asking the humans what they meant; and, at the end, that the answer is obviously to freeze the original referents. For each, tell me the exact point in the sequence at which it should be headed off, and which two of them are the same mistake in two vocabularies and should therefore be disposed of once, in terms both halves of the room can hear. Tell me which misconception I've failed to anticipate.

  Two further constraints. The inaccessible-information point needs to land as a specific question with a determinate answer that the agent's evidence can never reach, not as a global underdetermination thesis — how do I keep it concrete in about two minutes? And I want to state openly, rather than silently skip, one or two things I refuse to explain at this level; my candidates are whether any existing system exhibits the problem, the mechanics of Bayesian model averaging, the metaphysics of natural kinds, and the safety-engineering literature around it. Which refusals are worth saying out loud, and which would look like evasion?

  Finally, give me one closing question that distinguishes understanding from its appearance — something that can't be answered by repeating a slogan. My own candidate is to hand them a case of splitting and ask, in one sentence, what the conservative and the reinterpretive rule would each do and what would count as a reason to prefer one; use a better one if you have it, and tell me what an answer would have to contain before I should count the session as having worked.
reasoning: |-
  Okay, let me tackle this tutorial planning request. The student is preparing a 50-minute session on agency and embeddedness, specifically focusing on how an agent's values depend on its world-model ontology. They've outlined six key points but need help structuring them effectively.

  First, I notice the core tension in their draft order: placing inaccessible information (point 5) before the resolution rule (point 4) makes sense because evidence limitations fundamentally shape the resolution dilemma. The current sequence might confuse students about why resolution isn't straightforward.

  For timing, I'm considering:
  - 5 mins setup (utility/model-relativity)
  - 10 mins model revision with concrete examples
  - 8 mins category transformations (drift/split/eviction)
  - 10 mins inaccessible information demonstration
  - 12 mins resolution rules and misconceptions
  - 5 mins closing distinction and Q&A

  The species example seems strongest - conservation AI facing ring species or HGT. It avoids consciousness debates in brain emulations and isn't reducible to semantic drift like the foundation case. Key elements: values tied to "species" concept, new data shows category incoherence, inaccessible factors about historical gene flow.

  Common misconceptions need strategic handling:
  - The "just distributional shift" and "Quinean underdetermination" views are actually the same mistake - both miss how value-bearing categories disintegrate under model change. Debunk them together after demonstrating inaccessible information.
  - "Define utility over low-level states" fails because values inherently require abstraction - address this during initial setup.
  - "Bayesian convergence" ignores that some ontological differences are observationally equivalent - crush this with the inaccessible info proof.
  - "Ask humans" assumes persistent authority/accessibility - dismiss during resolution rule discussion.
  - "Freeze referents" is the obvious-but-flawed answer - save for last to show why it doesn't resolve value uncertainty.

  For inaccessible information: use a concrete ring species case where two models agree on all possible observations but disagree on whether population A and C are same species (due to inaccessible historical gene flow between A-B and B-C). This takes <2 mins if pre-visualized.

  Open refusals: Explicitly skip "does any real system have this?" (distracts to engineering) and "Bayesian mechanics" (too technical). Avoid metaphysics debates by noting we're examining agent decisions, not truth.

  Closing question: Present a splitting case (e.g., species X fragments into X1/X2) and ask how conservative vs reinterpretive rules would value X1. A good answer must specify: conservative tracks original X's value, reinterpretive applies original value definition to new subcategories, and preference depends on whether original value was tied to the concept or the historical entity.

  The key is making students feel the agony of choosing between tracking disappearing referents versus reinterpreting definitions - that's when they'll grasp why this isn't ordinary robustness or skepticism.
answer: |-
  Here’s a battle-tested plan for your 50-minute tutorial, optimized for conceptual flow, time management, and preemptive misconception-busting. The species example carries the session—its strengths and the losers’ flaws are detailed in the rationale.

  ---

  ### **Session Plan (Total: 50 min)**
  1. **Setup: Utility Over Model-Relative Features** (5 min)  
     - Define utility as \( U(\text{model-categories}) \), not \( U(\text{world}) \).  
     - **Example:** Conservation AI values "species" as defined by its initial phylogenetic model.  
     - *Preempt:* "Define utility over low-level states?" → **Shut down now:** Values (e.g., "protect species") inherently require high-level categories. Raw inputs lack semantics.

  2. **Model Revision Under Evidence** (7 min)  
     - Show how new data (e.g., gene flow maps, ring species observations) forces model updates.  
     - **Demo:** Original species tree → revised network with blurred boundaries.  
     - *Key point:* Revision isn’t just parameter tweaking—it restructures ontology.

  3. **Category Transformations: Drift, Splitting, Eviction** (8 min)  
     - **Species example:**  
       - *Drift:* "Species A" now includes hybrids.  
       - *Splitting:* "Species X" fragments into X1/X2 after genomic data.  
       - *Eviction:* "Species Y" vanishes—paraphyletic group, not a natural kind.  
     - *Stress:* Values tied to "species" now map ambiguously to the world.

  4. **Inaccessible Information** (10 min)  
     - **Concrete case:** Ring species where populations A ↔ B ↔ C form a continuum.  
       - Model 1: A and C are same species (historical gene flow).  
       - Model 2: A and C are different species (no *direct* gene flow).  
       - *Crucial:* Both models predict all possible future observations identically.  
     - **Proof sketch:** No observation distinguishes "actual gene flow history" if intermediates exist.  
     - *Prevents "global underdetermination" drift:* This is a specific, empirically unresolvable question about category extensions.

  5. **Resolution Rules & Misconceptions** (15 min)  
     - **Conservative rule:** Track original referents (e.g., protect descendants of original "species X" individuals).  
     - **Reinterpretive rule:** Apply original value definition to new ontology (e.g., protect what *current model* calls "species X").  
     - **Debunk together:**  
       - CS: "Just distributional shift → more data!"  
       - Phil: "Quinean underdetermination → no AI-specific issue!"  
       → **Unified rebuttal:** Value-laden categories *disintegrate* under model change. More data *induces* the problem. AI can’t "defer to causal history" like humans.  
     - **Other misconceptions:**  
       - "Bayes converges on right ontology?" → Killed by §4 (inaccessible info).  
       - "Ask humans?" → Humans may be gone, biased, or as confused (mention briefly).  
       - "Freeze referents!" → Saved for closing Q.

  6. **Distinction & Wrap-Up** (5 min)  
     - **Not robustness/skepticism:** Robustness handles known distributions; skepticism doubts all reference. Here, reference is *precisely defined but model-dependent*.  
     - **Open refusals:** Skip (a) *existing systems* (it’s a framing problem for aligned AI), (b) *Bayesian mechanics* (focus on decisions, not inference).  
     - **Closing question:**  
       > *"After splitting, conservative rule assigns original species X’s value to population X1. Reinterpretive rule assigns it to both X1 and X2. Which rule better satisfies the foundation’s *intent*—and is intent even defined here?"*  
       - **Goal:** Forces them to confront that "intent" is model-relative. Strong answers note intent’s dependence on (inaccessible) historical category boundaries.

  ---

  ### **Why Species Example Wins**
  - **Carries the session because:**  
    - Values ("protect species") are tied to scientific categories vulnerable to model shifts.  
    - *Splitting* (ring species) and *inaccessible info* (gene flow history) arise naturally.  
    - Avoids metaphysics: Focuses on operational decisions, not consciousness.  
  - **Losers:**  
    - Brain emulations: Drags in personal identity (is an emulation a "person"?). Distracts from ontology.  
    - Endowed foundation: Looks like semantic drift ("charity" → modern causes). Shallow because humans *can* reinterpret intent.  

  ### **Misconception Handling**
  - **Unanticipated pitfall:** "Just add uncertainty to the utility function!"  
    - **When:** During resolution rules (§5).  
    - **Reply:** Uncertainty over *what*? Models disagree on category *definitions*, not probabilities.  

  ### **Why §4 Before §5**
  Inaccessible information (§4) *forces* the resolution dilemma (§5). Without §4, students think "more data fixes it" and miss why reinterpretation isn’t a technical choice but an ontological commitment.

  ---

  ### **Success Metrics**
  - **Closing Q answer** should:  
    (a) Correctly state the rules’ actions (e.g., conservative values lineage, reinterpretive values current category),  
    (b) Note that "intent" depends on inaccessible boundaries,  
    (c) Reject "freeze referents" as ignoring model-dependence.  
  - **If** students agonize over whether to prioritize original referents vs. definitions, you’ve succeeded.
