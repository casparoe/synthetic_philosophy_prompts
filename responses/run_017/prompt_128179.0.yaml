answer: |-
  **Concession**  
  The war of attrition model does eliminate the runner-up payment artifact.  

  **The Reply**  
  Your standoff game still fails to mirror real escalation because it lacks *uncertainty* and *dynamics*. In your symmetric equilibrium, both firms know the prize is worth exactly 1, costs are fixed at *c*, and the game is infinite. But real cases pivot on ambiguity: no one knows if the prize is attainable, what rivals will do, or how costs might balloon. Persistence isn’t just about avoiding discrete loss—it’s a probe for information. In Vietnam, each escalation step revealed enemy capacity or resolve; in R&D, each funding round tests feasibility. Your model’s perfect knowledge strips away this learning value. Stopping isn’t merely "losing"—it’s forfeiting the chance to discover if the next step might break through or force a rival’s collapse. Here, persistence has zero informational upside; in reality, it’s a rational investment in reducing uncertainty.  

  **Your Move**  
  If persistence yields no information in your model, how does it explain cases like the Concorde, where engineers genuinely debated whether *the next* technical hurdle was solvable?
