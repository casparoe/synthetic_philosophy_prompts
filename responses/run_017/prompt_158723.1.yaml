  ### Cases (Designed for Ambiguity)  
  **Case 1: The Backup Plan**  
  *"Taylor’s partner says, ‘I’ll definitely come home by 6.’ At 5:58, Taylor sees their car turn onto their street. Unbeknownst to Taylor, the partner almost took a detour to buy flowers but decided against it. Does Taylor know their partner is arriving?"*  
  - **Statute readers**: Focus on "definitely" → almost detour = no knowledge (risk existed).  
  - **Text-message readers**: Focus on gist (car in sight) → yes (intent fulfilled).  

  **Case 2: The Review**  
  *"Sam reads a restaurant review: ‘The food is good, but the service is bad.’ Sam tells a friend, ‘It’s a good place!’ Later, Sam learns the chef quit. Was Sam justified in saying it’s good?"*  
  - **Statute**: "Good" only applies to food → not justified (service is bad).  
  - **Text**: Overall positive gist → justified.  

  **Case 3: The Password**  
  *"Jamie logs into a site using a password that *usually* works. This time, it works. Unbeknownst to Jamie, the system glitched and accepted a wrong password. Did Jamie know their password was correct?"*  
  - **Statute**: Glitch invalidates reliability → no knowledge.  
  - **Text**: Password "worked" → yes.  

  ---

  ### Why This Works  
  - **Projection Failure**: The prediction step forces participants to confront their assumption of consensus.  
  - **Causal Handle**: Group swap shows verdicts can flip with habits—making cultural transmission visceral.  
  - **Safety**: Random assignment and arbitrary training avoid spotlighting real identities.  
  - **Efficiency**: Index cards enable quick tallying; 3 cases + swap fit in 75 mins.  

  **First Run Tip**: If no split occurs, use Case 1’s prediction gap to ask: *"If you all agreed, why did 70% predict only 80% would agree? What does that uncertainty reveal?"* This salvages the core insight.
