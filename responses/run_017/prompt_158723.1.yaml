answer: |-
  ### Session Plan: "The Intuition Gap"

  **Session Title:** "The Intuition Gap: When Your Obvious Truth Isn't Theirs"  
  **Target Move:** Participants discover that they systematically overestimate how many others share their intuitive judgments, and that a brief shift in interpretive habits can alter those judgments.  

  ---

  ### Timeline (75 minutes total)  
  | Minutes | Phase Name           | What Participants Do                                                                 | What Facilitator Does                                                                                                                               | Discovery Baked into the Rules                                                                 |
  |---------|----------------------|--------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | 0-5     | Setup & Groups       | Receive randomly assigned index card (Group 1 or 2). Move to designated areas.       | Explain: "We’re exploring how people interpret stories. No right/wrong answers." Randomly assign groups via cards. Emphasize anonymity.             | Random assignment ensures groups are initially identical; no pre-existing bias.                |
  | 5-15    | Training             | Practice their group’s interpretive style on neutral examples (e.g., movie reviews). | Deliver 5-min training: **Group 1** (Statute Readers): "Read like a lawyer parsing a contract. Focus on exact words, loopholes, literal meanings." **Group 2** (Text-Message Readers): "Read like a friend’s text. Focus on gist, context, speaker’s intent." Use non-philosophical examples to avoid transparency. | Participants experience how habits shape interpretation before seeing cases.                   |
  | 15-20   | Case 1: Prediction   | Read Case 1 silently. Write: (1) Verdict (Yes/No), (2) Prediction (% who agree). Submit card. | Read Case 1 aloud twice. Stress: "Answer based on your training." Collect cards immediately.                                                       | Prediction captures second-order confidence; verdict captures first-order intuition.           |
  | 20-25   | Case 1: Reveal       | Watch tally unfold.                                                                  | Tally verdicts (whole class + by group). Calculate average prediction per verdict. Display on whiteboard: **Actual Split** vs. **Predicted Split**. | Gap between predicted/actual agreement is visually stark.                                      |
  | 25-40   | Cases 2 & 3          | Repeat prediction/verdict for Cases 2 & 3.                                          | Repeat process, tallying faster. Add group-level splits if time allows.                                                                             | Replication confirms pattern; group differences (if any) suggest causal influence.             |
  | 40-50   | Group Swap           | Regroup randomly (reshuffle cards). Repeat Case 1 with *new* training.              | Assign swapped training (Group 1 → Text-Message; Group 2 → Statute). Run Case 1 again.                                                              | Tests reversibility: if verdicts shift with training, habits are the lever.                    |
  | 50-70   | Discussion           | Discuss: "Why were predictions wrong?" "Did training change your reading?"          | Facilitate: "Why did you expect agreement?" "If habits shift judgments, what does that imply?" Redirect methodological debates to projection failure. | Participants articulate projection failure and causal mechanism.                               |
  | 70-75   | Debrief              | Reflect silently, then open Q&A.                                                    | Map activity to cross-cultural variation: "You felt your intuition was obvious, yet others disagreed. Real cultures embed habits deeper than 5 mins." | Connects micro-experience to macro-phenomenon.                                                 |

  ---

