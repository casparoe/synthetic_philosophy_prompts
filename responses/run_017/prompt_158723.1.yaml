prompt: |-
  I'm a PhD student in philosophy finishing up in experimental epistemology, and in three weeks I'm taking over one 75-minute session of our upper-division Knowledge and Justification course: 19 students, mixed majors, a room with a whiteboard and index cards and nothing else. I've been asked to do the session on cross-cultural variation in epistemic intuitions, and I want the students to run into the problem rather than hear about it.

  What has failed before: I've watched this taught by putting a slide of bar charts on the screen and comparing verdict distributions across populations. It collapses every time into a methodological squabble about whether the survey questions were any good, with a good part of the room concluding that the subjects must have misread the vignette. I don't want that. And I don't want to put the six or seven students in the room who learned English later, or who grew up outside the United States, on display as specimens: no asking anyone to speak for a culture, no "and what would people back home say?" moves.

  Two things I'd like the design to carry, if you think they can be made to work in the time available.

  First: what does the philosophical damage, I think, is not the first-order split but the second-order surprise. Each of us tacitly predicts that a competent, attentive person will land where we land, and predicts it with real confidence; that prediction is what licenses us to treat disagreement as a mistake rather than as a difference to be explained. So I want the activity to record that prediction before anyone sees the actual distribution, and to let the gap between predicted and actual distribution be the datum the room discovers for itself. Call it the projection failure, and build the scoring so that it is visible on the board and not merely reported.

  Second: I'd like a causal handle, not just a correlation. My idea is to manufacture micro-cultures in the room: split the class by a genuinely random procedure, give each half a few minutes of different training in how to read a certain kind of case — I was thinking of instructing one half to read vignettes the way a lawyer reads a statute and the other the way a friend reads a text message — and then run the cases blind. If a habit acquired in five minutes shifts verdicts, the students can watch cultural transmission act on themselves instead of hearing about it in a stranger. Tell me honestly whether that device is a bad idea and why; if you keep it, tell me how long the training has to be, how to keep it from being transparent, and what it is a model of and what it merely looks like a model of.

  Cases: write your own, three or four, not the famous ones from the literature. I don't want the session to become a seminar on one well-known paper, and I don't want anyone guessing where this is going. They should be short enough to read twice, and they should be the sort of case where a "does she know" or "is he referring to" verdict plausibly moves with interpretive habit.

  What participants should come away seeing: that an intuition arrives wearing two credentials — it feels like a detection of how things are, and it feels like a verdict any careful person would share — and that cross-cultural variation strips the second credential while leaving the first untouched, which is why "the subjects must have misread the question" is not an answer to it.

  Also needed: a debrief mapping specific moments in the activity onto specific parts of the dispute, including the difference between verdicts varying and what that variation would warrant methodologically; an honest list of what will go wrong the first time, including what I should do if the room does not split, which with nineteen people it may well not; and a way of handling the student who says, correctly, that a roomful of undergraduates trained for five minutes tells us nothing about real cultural difference. Be frank about which feature of the real debate the activity cannot produce and that I will have to supply in my own voice.

  Skip the literature: no citations, no study names invoked as authorities, no numbers from published data. I have that material; what I need is the design.

  Give me the session plan first, then a single JSON object with this schema:

  - session_title: string
  - target_move: one sentence stating what participants discover for themselves, not what I tell them
  - timeline: array of objects with keys minutes, phase_name, what_participants_do, what_facilitator_does, discovery_baked_into_the_rules
  - scoring_scheme: object with keys first_order_measure, second_order_measure, how_the_gap_is_displayed, threshold_for_a_usable_split
  - failure_modes: array of objects with keys what_happens, why, handling
  - debrief_map: array of objects with keys moment_in_activity, what_participants_felt, maps_onto, facilitator_line
  - cannot_reproduce: array of objects with keys feature_of_the_debate, why_the_activity_cannot_generate_it, what_i_must_supply
  - safeguards: array of short strings on running this without making any student a representative of a culture
reasoning: |-
  We are designing a 75-minute session for an upper-division Knowledge and Justification course. The goal is to have students discover the problem of cross-cultural variation in epistemic intuitions through an activity, avoiding the pitfalls of previous methods.

  Key goals:
  1. Avoid methodological squabbles by having students experience the variation firsthand.
  2. Avoid putting non-native English speakers or international students on the spot.
  3. Focus on the second-order surprise (projection failure): each student's prediction that others will share their intuition, and the discovery that they don't.
  4. Introduce a causal handle by creating "micro-cultures" in the room through random assignment and brief training in different interpretive habits.

  Proposed activity:
  - Split the class randomly into two groups (Group A and Group B).
  - Give each group a 5-minute training in a different interpretive habit:
      - Group A: "Lawyerly Reading" - read the vignette as if it were a legal statute, focusing on precise wording, definitions, and possible loopholes. Emphasize: "Every word matters. Look for exact meanings and implications."
      - Group B: "Friendly Reading" - read the vignette as if it were a text from a friend, focusing on the overall message, context, and what the speaker likely meant. Emphasize: "Get the gist. What is the speaker trying to convey? Consider the context and the relationship."
  - Students do not know the content of the other group's training.
  - Present 3-4 short, original vignettes (each with a question about knowledge or justification) to the entire class. Each vignette is read twice.
  - For each vignette, students:
      a. Record their own verdict (first-order intuition).
      b. Predict the distribution of the class's verdicts (second-order prediction): What percentage of the class will agree with you?
  - Collect the responses (anonymously) via index cards.
  - Tally the actual distribution of verdicts and the average predicted distribution for each group and for the whole class. Display this on the whiteboard for each vignette.

  Key elements:
  - The projection failure is made visible by comparing the predicted distribution (e.g., "I think 85% will agree with me") with the actual distribution (which may be 50-50 or skewed the other way).
  - The causal handle: if the training groups (A and B) show different verdict patterns, then we can see that a brief intervention (simulating cultural training) affects intuitions.

  Cases: Write 3-4 original vignettes that are ambiguous enough to be interpreted differently by the two groups. Examples (to be crafted carefully):

  1. **The Lost Keys Case**:
     "Sam is looking for his keys. He usually leaves them on the kitchen counter. He looks there and sees them. But today, his roommate had moved them to the table without telling him. Sam didn't check the table. Does Sam know the keys are on the counter?"

     - Lawyerly reading might focus on the fact that the keys are not on the counter, so Sam doesn't know (because he has a false belief). Or they might focus on the definition of knowledge and whether Sam has justification.
     - Friendly reading might focus on Sam's usual habit and that he saw them on the counter (even though they were moved), so he does know (because he reasonably believes).

     But note: we want a case that can split. Alternatively, design a case that is more ambiguous.

  2. **The Appointment Case**:
     "Taylor has a dentist appointment at 2 PM. She checks her phone and sees a text from the dentist's office that says, 'Your appointment is at 2 PM today.' She believes the appointment is at 2 PM. However, the text was actually sent to the wrong person; the office meant to text someone else. Does Taylor know that her appointment is at 2 PM?"

     - Lawyerly: The text was not intended for her, so she doesn't have a justified true belief? (But note: she might still have a true belief by luck.) 
     - Friendly: She got the text and it was accurate, so she knows.

  3. **The Weather Forecast Case**:
     "Jamie checks the weather app on their phone and it says there is a 0% chance of rain. Jamie believes it will not rain. However, the weather app has a bug and sometimes shows 0% chance when it should show 10%. Today, it is not going to rain. Does Jamie know that it will not rain?"

     - Lawyerly: The app is unreliable (bug), so Jamie's belief is not justified -> no knowledge.
     - Friendly: The app said 0% and it turned out to be true, so Jamie knows.

  We need to test these cases to see if they are ambiguous enough. Alternatively, we can design cases that are less familiar and more likely to split.

  Timeline (75 minutes):

  - (5 min) Introduction: Explain that we are going to do an exercise on how we interpret cases and make judgments. Emphasize that we are interested in how people read and interpret the same text differently. Randomly assign to Group A and Group B (by counting off 1-2, or by shuffling index cards with A/B and distributing).

  - (10 min) Training: Each group goes to a different corner (or just turns to face each other) and gets their training. The facilitator hands out a written instruction card to each group and reads it aloud to them. The card for Group A (Lawyerly) says: "When reading the cases, focus on the exact words. Pay attention to every detail and what they literally mean. Ask: what do the words on the page strictly say? Look for possible ambiguities or loopholes." The card for Group B (Friendly) says: "When reading the cases, focus on the overall message and the context. What is the speaker trying to convey? What would a reasonable person understand? Don't get bogged down in small details; go for the gist." The facilitator then gives an example with a non-philosophical case (e.g., a sign that says "No food or drink allowed" and someone with a bottle of water - lawyerly might say water is a drink, friendly might say it's about not making a mess so water is okay). Then the groups practice on a non-philosophical example.

  - (40 min) Case Session: Present the first case. Read it aloud twice. Then:
     a. Each student writes on an index card:
          - Their verdict (e.g., "Yes, Sam knows" or "No, Sam does not know")
          - Their prediction: "What percentage of the class do you think will agree with your verdict?" (0-100%)
     b. Collect the cards. 
     c. Tally the results on the whiteboard: 
          - Actual distribution: Count the number of "Yes" and "No" for the whole class and for each group (if we have time, by group; if not, just whole class and then by group for one case if split).
          - Average prediction: For the "Yes" voters, what was the average prediction? For the "No" voters, what was the average prediction? (Or overall average for each group? But we want to show the projection per verdict.)
     d. Repeat for the next 2-3 cases.

     Note: We want to show both the first-order split (if it happens) and the second-order projection (which should be high on both sides). We also want to show the gap between the predicted agreement and the actual agreement.

     For efficiency, we might do the tallying for one case in detail and then just report for the others. But with 19 students, tallying should be quick.

  - (15 min) Discussion and Debrief: Guide the discussion to focus on:
     - What they observed: Did the class split? Were the predictions accurate?
     - The effect of the training: Did the groups differ? (If they did, point that out; if not, note that sometimes interventions don't work and we can discuss why.)
     - The projection failure: Why did we think others would agree? What does it mean when we find they don't?
     - Connect to cross-cultural variation: The training was a quick way to simulate how different cultural practices of interpretation might lead to different intuitions.

  - (5 min) Wrap-up: Summarize the key takeaway: Our intuitions feel objective and universal, but they can be influenced by factors we aren't aware of, and they may not be shared by others. This challenges how we use intuitions in philosophy.

  Scoring Scheme:
  - First-order measure: The proportion of "Yes" (or "No") for each case (by group and overall).
  - Second-order measure: The average predicted agreement for each verdict (e.g., for those who said "Yes", what was their average prediction of the percentage who would agree? Similarly for "No").
  - How the gap is displayed: On the whiteboard, draw a table for each case:

      | Verdict | Actual % | Avg Predicted % by those with that verdict | 
      |---------|----------|--------------------------------------------|
      | Yes     | 60%      | 85%                                        |
      | No      | 40%      | 80%                                        |

    And if we have group data:

      Group A (Lawyerly):
      | Verdict | Actual % | Avg Predicted % |
      | Yes     | ...      | ...            |

      Group B (Friendly):
      | Verdict | Actual % | Avg Predicted % |
      | Yes     | ...      | ...            |

  - Threshold for a usable split: We don't need a 50/50 split. Even a 70/30 split can show projection failure because the minority group predicted high agreement. But if the split is too extreme (e.g., 95/5), then we might not see projection failure because the 5% might predict low agreement. We'll set a threshold: if at least 20% of the class holds the minority view, then we can see the projection failure. If not, we can still show that the majority overestimated their agreement.

  Failure Modes:
  1. The class doesn't split on any case (e.g., 18/19 agree). 
     - Why: The cases might not be ambiguous enough, or the training might not be effective.
     - Handling: Use the projection failure anyway. Even if everyone agrees, they might have predicted less than 100% agreement? (But usually they predict high.) Alternatively, note that in real life, splits happen, and we can show published data later. But in the activity, we can still discuss the projection: "Why did you predict 85% when it was 100%? What does that say about how you view your own judgment?"

  2. The training groups don't show a difference in verdicts.
     - Why: The training was too brief, or the cases weren't sensitive to the training.
     - Handling: Still focus on the projection failure. Note that sometimes cultural differences don't show up in every case, but they do in others. We can also discuss: what if the training had been longer? What if it was from childhood?

  3. Students figure out the purpose and alter their responses.
     - Why: The training might be too transparent.
     - Handling: Make the training seem natural (as two ways of reading). Don't reveal the group labels (call them Group 1 and Group 2 without revealing the training difference until after). Also, the cases should not be recognizable from the literature.

  4. The tallying takes too long.
     - Why: Manual counting with 19 students.
     - Handling: Pre-plan a quick tally method. Have two students help? Or use a show of hands for the verdict and then collect the predictions? But we need anonymity for the verdict to avoid conformity. Alternatively, collect the cards and quickly count while the class is doing something else (like reading the next case). Or do the tallying for one case in detail and then for the others, just report the split.

  Debrief Map:
  We map moments in the activity to the philosophical points.

  Cannot Reproduce:
  - The activity cannot produce long-term cultural transmission. We have a 5-minute training, which is a model of how a habit can be transmitted and influence interpretation, but it is not a model of deep cultural differences that are embedded in language, education, and history. We must supply: the real-world evidence of cross-cultural variation from anthropological and experimental philosophy studies, and note that the activity is a simulation of the mechanism, not the depth.

  Safeguards:
  - "Do not ask any student to represent a culture or country."
  - "Avoid any discussion that singles out students based on their background."
  - "Emphasize that the groups are randomly assigned and the training is arbitrary."
  - "In discussion, focus on the training as the cause, not personal characteristics."

  Proposed Cases (short and original):

  1. **The Meeting Time Case**:
     "Alex receives an email from a professor: 'Let's meet tomorrow at 10 AM in my office.' Alex believes the meeting is at 10 AM. However, the professor sent the email at 2 AM and meant 10 PM, but typed AM by mistake. The professor's office is closed at 10 AM. Does Alex know that the meeting is at 10 AM?"

  2. **The Recipe Case**:
     "Jordan is following a recipe that says, 'Add a cup of sugar.' The recipe has a typo; it should have said 'a tablespoon of sugar.' Jordan adds a cup. The dish turns out too sweet. Did Jordan know that the recipe called for a cup of sugar?"

  3. **The Bus Schedule Case**:
     "Riley checks the bus schedule online and sees that the bus leaves at 8:00. Riley believes the bus leaves at 8:00. However, the website has a note: 'Schedules may change without notice; check with driver.' The bus does leave at 8:00 today. Does Riley know that the bus leaves at 8:00?"

  We need to test these for ambiguity and sensitivity to training.

  Session Plan:

  Session Title: "Intuitions in Interpretation"

  Target Move: Participants discover that their own intuitive judgments about knowledge are not universally shared, and that they systematically overestimate how much others will agree with them.

  Timeline:

  | Minutes | Phase Name         | What Participants Do                                                                 | What Facilitator Does                                                                                                                               | Discovery Baked into the Rules                                                               |
  |---------|--------------------|--------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | 0-5     | Introduction        | Listen and receive random group assignment (A or B)                                  | Explain the activity: we are studying how we interpret stories and make judgments. Assign groups randomly (e.g., count off 1,2).                    | Random assignment ensures groups are initially similar.                                       |
  | 5-15    | Training           | Move to group areas. Receive and practice their group's reading style.               | Distribute instruction cards. Explain and model the reading style with a non-philosophical example. Monitor and clarify.                            | Participants experience being trained in a specific interpretive habit.                      |
  | 15-20   | Case 1: Meeting Time | Read the vignette (twice) and record their verdict and prediction on an index card. | Read the vignette aloud twice. Collect cards.                                                                                                       | Each participant forms a first-order intuition and a second-order prediction.                 |
  | 20-25   | Tally Case 1       | Watch as facilitator tallies and displays results.                                  | Tally the verdicts (overall and by group) and the average predictions for each verdict. Display on whiteboard.                                      | The gap between predicted and actual agreement becomes visible.                               |
  | 25-30   | Case 2: Recipe     | Read, record, and submit.                                                           | Read vignette, collect cards.                                                                                                                       |                                                                                              |
  | 30-35   | Tally Case 2       | Watch tally.                                                                         | Tally and display.                                                                                                                                  |                                                                                              |
  | 35-40   | Case 3: Bus Schedule| Read, record, and submit.                                                           | Read vignette, collect cards.                                                                                                                       |                                                                                              |
  | 40-45   | Tally Case 3       | Watch tally.                                                                         | Tally and display.                                                                                                                                  |                                                                                              |
  | 45-60   | Discussion         | Discuss the results: why predictions were off, the effect of training, implications. | Facilitate discussion: ask about surprises, why they thought others would agree, how the training affected them.                                    | Participants articulate the projection failure and the influence of training.                 |
  | 60-75   | Debrief & Wrap-up  | Listen and participate in connecting activity to broader issues.                     | Map activity to cross-cultural variation: note that the training was a quick culture, and in real life, culture runs deeper. Summarize key insights. | Participants see how the activity models the real-world phenomenon and its philosophical impact. |

  Scoring Scheme:
  - first_order_measure: Proportion of each verdict (e.g., "Yes" and "No") for the whole class and by group.
  - second_order_measure: For each verdict, the average predicted percentage agreement (e.g., for all who said "Yes", average their predictions of the percentage who would agree).
  - how_the_gap_is_displayed: On whiteboard, a table for each case showing:
      - Verdict
      - Actual percentage of class with that verdict
      - Average predicted percentage by those with that verdict
  - threshold_for_a_usable_split: At least 20% of the class holds the minority verdict.

  Failure Modes:

  | What Happens                     | Why                                                                 | Handling                                                                                                                               |
  |----------------------------------|---------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------|
  | No split in verdicts (e.g., unanimous) | Cases not ambiguous; training not effective.                        | Focus on the projection: even if unanimous, students might have predicted less than 100%. Discuss why they predicted disagreement.     |
  | Training groups don't differ     | Training too brief or cases not sensitive.                          | Still highlight projection failure. Note that not every intervention works, but in real life, cultural differences do show up in some cases. |
  | Tallying takes too long          | Manual process.                                                     | Tally only one case in detail; for others, only report the split and average prediction. Have a student helper.                       |
  | Students guess the purpose       | Training or cases too transparent.                                  | Use neutral group labels and downplay the training's purpose. Emphasize that we are studying interpretation.                           |
  | One group is larger than the other | Odd number of students.                                             | It's okay; just note the group sizes.                                                                                                 |

  Debrief Map:

  | Moment in Activity        | What Participants Felt                     | Maps Onto                                       | Facilitator Line                                                                                                |
  |---------------------------|--------------------------------------------|-------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|
  | Training session          | Learning a new way of reading              | Acquisition of cultural habits                  | "Just as you learned a new way of reading in 5 minutes, we learn cultural habits over time."                    |
  | Recording their verdict   | Confidence in their judgment               | The feeling of objectivity in intuitions        | "Your intuition felt obvious, right? That's how we experience our own intuitions."                              |
  | Recording prediction      | Expectation of agreement                   | The projection of universality                  | "We assume others will see it the same way. That's what allows us to treat disagreement as error."              |
  | Seeing the tally          | Surprise at the split and projection fail  | The discovery of variation and projection error | "Notice how you overestimated agreement? That's the projection failure. And the split shows variation exists."  |
  | Seeing group differences  | Realization that training affected them    | Causal influence of cultural background         | "The training (a micro-culture) caused different readings. Real cultures do this, but over longer time spans."  |

  Cannot Reproduce:

  | Feature of the Debate        | Why the Activity Cannot Generate It                   | What I Must Supply                                                                 |
  |------------------------------|-------------------------------------------------------|------------------------------------------------------------------------------------|
  | Long-term cultural transmission | The training is only 5 minutes and artificial.        | Explain that real cultural differences are deeply embedded and acquired over years. |
  | Real-world variation in epistemic intuitions | The activity is a simulation with students.           | Summarize key findings from cross-cultural studies (without citations).            |
  | The depth of cultural differences | The training is a shallow habit; real culture is complex. | Discuss how culture shapes our fundamental concepts and practices.                 |

  Safeguards:
  - "Groups are assigned randomly; no one is representing their own culture."
  - "Do not ask anyone about their personal background during the activity."
  - "The training is arbitrary and not tied to any real culture."
  - "If a student from another culture volunteers an observation, do not generalize it."
  - "Emphasize that the activity is about the effect of the training, not about inherent traits."

