  Next, the user mentions four interpretations of "losing standing to condemn." I need to distinguish between the uptake/role failure, fairness issue, sincerity problem, and epistemic discount. Each plays a role, but in Spitzer's case, the fairness angle seems most critical because he imposed burdens on others that he exempted himself from.

  The user's deeper questions are about domain—does losing standing affect only related norms or everything? Timing—did his past prosecutions lack standing at the time or only in retrospect? Official role vs. personal conduct—does the state's standing depend on the individual's integrity? And whether accepting punishment restores standing.

  Also, the user asks what happens if buying sex isn't considered wrong. If the law itself is unjust, the hypocrisy argument might not apply, as the focus shifts to the law's validity rather than the enforcer's conduct.

