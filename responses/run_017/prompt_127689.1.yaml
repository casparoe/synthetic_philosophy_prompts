  The user also wants to avoid deep dives into formalism. So, refusing to explain updateless decision theory or logical counterfactuals is necessary. Instead, focus on the practical implications of decision rules. The spine should be distinguishing between causal and evidential reasoning through the cases.

  Now, checking all constraints. The predictor’s imperfection: using 70% accuracy avoids sci-fi objections. The matched pair: same predictor, stakes, no repetition. The misconceptions map should be addressed at specific points—like after explaining each scenario. The transfer case with varying accuracy will reveal if they understand the dependency. 

  Finally, ensuring the session flows within 45 minutes. Starting with Newcomb, then mugging, comparison, transfer case, and Q&A. Keeping explanations concise, using relatable examples, and engaging the audience with questions. The retired math teacher’s concern about rationality means defining it early as decision rules that maximize expected outcomes across possible scenarios, not just the current one.
answer: |-
  **Spine:** Make them viscerally grasp that rational agents care about *what their choices indicate* (even in causally isolated moments) when decisions correlate with hidden variables affecting outcomes.  

  **Plan:**  

  1. **Hook with Newcomb's Problem (8 mins)**  
     - *Why first:* Forces confrontation with prediction, establishes "the prediction is fixed" intuition without math.  
     - *Set constraints:* Predictor (70% accurate human observer), stakes ($1k vs. $1M), no precommitment gadgets.  
     - *Key pivot:* Ask: "Why take one box if your *now* can't change the predictor's *then*? What does refusing the $1k *say* about you?"  

  2. **Introduce Counterfactual Mugging (10 mins)**  
     - *After Newcomb, before comparison:* Leverages sunk-prediction intuition.  
     - *Matched case:* Same predictor (70%), same stranger. Coin flipped *hypothetically*: if heads, you lost $100; if tails, stranger asks for $50 to return your $100. Predictor paid you $100 *only if* they foresaw you’d pay upon asking. You’re asked (tails didn’t occur).  
     - *Crucial framing:* "The predictor didn’t pay you. They *would have* paid you only if they’d predicted you’d pay *now*. Does refusing help you *here*? What does paying *signal* about the you they judged?"  

  3. **Contrast with XOR Blackmail (8 mins)**  
     - *Matched variation:* Same predictor/stranger. Predictor sends a letter *only if* they predict you *won’t* pay $50 to prevent release of your embarrassing photo (which they already have). No letter? No leak. Letter? Paying *causes* leak prevention.  
     - *Structural twist:* Paying *causes* a good outcome (if letter received), but *not paying* correlates with avoiding the scenario entirely.  

  4. **Side-by-Side Tension (5 mins)**  
     - *Q:* "Mugging: Paying loses $50 now but signals you were the type who’d have gotten $100. Blackmail: Paying costs $50 and stops a leak, but *not paying* signals you were the type who avoided the letter. Why does 'be the type who pays' feel right in one and wrong in the other?"  
     - *Pivot to decision rules:* "Not 'what gets me the best outcome *here*,' but 'what rule, if I followed it always, gets the best outcomes *across the branches I might face*?'"  

  5. **Transfer Test (10 mins)**  
     - *Dial case:* "Stranger shows you cryptographic proof a coin *was* flipped (heads: you owe $100; tails: they can reclaim $50 of your $100 reward). Predictor (accuracy dial: 50%→99%) gave you $100 iff they predicted you’d pay if tails. Coin was tails. *How does predictor accuracy change your choice?*"  
     - *Success pattern:*  
       - Mugging-like (paying signals past reward): Pay if accuracy >50%.  
       - Blackmail-like (not paying avoids scenario): Accuracy doesn’t matter—always don’t pay.  
     - *Fail pattern:* "Pay at 90%+ but not at 70%" (confusion) or "always pay/don’t pay" (missed structure).  

  6. **Q&A / Preemptions (4 mins)**  
     - *Misconception map (order & shutdown):*  
       | Misconception | When Headed Off | One-Sentence Shutdown |  
       |---------------|-----------------|------------------------|  
       | "Money’s gone, can’t change past" | After Newcomb/Mugging | "True, but your action *reveals what past-you was betting on*—and that affects if you *got* the money." |  
       | "This is just precommitment" | During contrast | "Precommitment requires foresight. Here, you face this *once*, unexpectedly—what rule do you wish you’d built-in?" |  
       | "70% predictor makes CDT win" | During dial test | "At 50.1%, paying in the mugging *still* implies you likely got $100—it’s about correlation, not perfection." |  
       | "Mugging = open-box Newcomb" | During contrast | "In Newcomb, refusing the box *causes* no loss. In the mugging, refusing *destroys the evidence* you’d have been rewarded." |  
       | "Non-payers don’t get the letter!" | After XOR setup | "Exactly—so *not paying* means you likely avoided the threat entirely. Paying means you’re in the bad branch *and* losing $50." |  
       | LessWrong chants | During dial test | "If you ’know the answers,’ tell me: at 60% accuracy in the dial case, does paying ever help? *Why*?" |  
     - *Retired teacher’s "rational" def:* Early, when framing decision rules. "Rational means using a *system* that wins across the game—not just this move."  

  **Refuse to Explain (Explicitly):**  
  - *At start:* "We’re asking *why* these cases feel different, not building formal theories. No math, no metaphysics."  
  - *If pressed:* "Timeless decision theory/logical counterfactuals are tools to *systematize* this tug-of-war—but today, we’re mapping the tug itself."  

  **Why This Sequence:**  
  - Newcomb grounds prediction → Mugging tests sunk-gain signaling → XOR tests sunk-avoidance signaling → Contrast highlights acausal tradeoff → Dial test verifies grasp of dependency.  
  - Predictor imperfection forces focus on *correlation strength*, not sci-fi magic.  
  - Matched stakes/characters isolate structure (reward-for-signal vs. cost-for-signal-avoidance).  

  **Key Avoided Traps:**  
  1. Experts reciting answers > Dial test exposes shallow pattern-matching.  
  2. "Rational=local win" > Reframed early as decision-rule scoring.  
  3. Perfect predictor objection > 70% accuracy retained throughout.  
  4. Precommitment smuggling > Cases are one-shot, no prior binding possible.  
  5. Reputation/rep effects > Stranger is non-repeating, no observers.  

  ---  
  **Execution Tip:** Start with hands-up votes on Newcomb ("1 box? 2 boxes?") to engage—then dissect why the 1-boxers feel uneasy despite "winning."
