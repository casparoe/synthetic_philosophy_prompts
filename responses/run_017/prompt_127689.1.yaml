prompt: |-
  hey — you're a professional philosopher who works on decision theory and has had to explain this stuff to smart non-specialists a lot, so think like a teacher here, not like a debater. Before you write anything for me, brainstorm for yourself the five most likely ways this session falls apart, then build the plan around avoiding them.

  The situation: I've got 45 minutes on Tuesday with a pub rationality meetup. Twenty-ish people, mostly programmers, and the spread is annoying — three of them have read the LessWrong sequences cover to cover and already think they know the answers (they'll chant that you obviously pay in the counterfactual mugging, obviously don't pay in XOR blackmail, case closed), maybe half have never heard of Newcomb's problem at all, and there's a retired maths teacher who is going to keep asking what 'rational' could even mean if it doesn't mean 'gets the best outcome in the situation you're actually in'. No whiteboard, no slides, just me talking and the back of a beer mat. I want them to feel the pull of both sides and then see what actually separates the two cases.

  What I want from you is the plan, not the explanation. Specifically:

  1. The order the pieces have to go in, and why — what depends on what. My instinct is that 'the prediction was already made and nothing you do now can change it' has to fully land before anybody hears the word mugging, and that the idea of scoring a decision procedure by what it delivers across all the situations it might face (rather than by what it delivers in the one situation you're in) has to be on the table before putting the two cases side by side can do any work. Tell me if I've got the dependency backwards.

  2. The one case, or one matched pair, that carries the whole session — and an explicit list of what it must have and what it must lack. Constraints I care about: the predictor is allowed to be no better than a shrewd human who has watched you for an hour, call it 65–70% accurate, not a perfect Omega, because I don't want anyone waving it away as sci-fi or saying the puzzle is an artefact of assuming perfection; and the two cases need to be matched — same stakes, same predictor, same vaguely unsavoury stranger — so that the only thing that varies is the structure. What it must not have: any repetition, any reputation effect, any precommitment gadget, and any way for the agent to have bound themselves earlier, so that the 'be the sort of person who pays' line can't quietly turn into a boring expected-value sum over a strategy picked in advance. If one of these constraints is doing damage, say so.

  3. The misconception map, in the order they'll actually raise them, with the point in the sequence where I head each one off and one sentence I can say out loud for each. The ones I'm expecting: the money's already gone and you can't change the past so just walk away; this is only about precommitment, or about being the kind of person who pays; if the predictor is 70% accurate then causal decision theory is plainly right and the whole thing rests on a perfect predictor; the mugging is just Newcomb's problem with the boxes open, we did this already; and the nasty one — in XOR blackmail a non-payer never receives the letter at all, so don't pay and stop overthinking. Plus the meta-problem that the three who've read the sequences will think they've won if they can recite the two verdicts, and I want them to lose that bet without being made to feel stupid.

  4. The check at the end. I'd rather have a transfer case where the verdict depends on a dial I can turn — the predictor's accuracy, or the reliability of some noisy signal the agent gets about which branch they're in just before deciding — than a case with one fixed right answer, because I want to see whether they've got the structural difference or just memorised pay / don't pay. Propose the case and tell me what pattern in their answers counts as having got it and what pattern means they're still pattern-matching.

  5. What I should openly refuse to explain at this level, and how to say so without sounding evasive. I'm assuming that's the formalism of functional / updateless / timeless decision theory, logical counterfactuals and the 'you are your decision algorithm' metaphysics, and whether any of this is physically possible — correct me. Also: no homework for them, and please don't hand me a reading list, I won't use one.

  Lead with a single sentence — the one thing the whole session has to accomplish, the spine that everything else is in service of — then give me the plan. No preamble, no restating what I asked.
