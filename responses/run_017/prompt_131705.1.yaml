prompt: |-
  I wonder whether you can help me with something I keep tripping over. I used to build reliability models for a living and I now read this material for its own sake. I have no library access and no way to chase references, so I am not asking for a bibliography, or for authors' names, or for anything I would have to look up: I want the shape of the thing, and if it needs one, a name I can use.

  The pattern is this. I hold two propositions, call them A and B, and I am unsure of both. An informant I trust tells me the rate of one within the other — not a joint frequency, not an overall rate, but a rate restricted to a subclass: among the cases where B holds, A holds in three quarters of them. I know there is a well-known puzzle about what to do with a single announcement of that kind — something about a soldier dropped into unfamiliar territory, though the name escapes me — and that the standard disagreement is between a rule that keeps my confidence in the if-part where it was and lets my overall confidence in the then-part move, and a rule that does the reverse. That is not my difficulty. My difficulty begins when there are two announcements.

  First case. I start at even odds on each of A and B and treat them as unrelated. One bulletin says that the rate of A among the B cases is three quarters. A later bulletin says that the rate of B among the A cases is three quarters. Take the first of the two rules: keep my confidence in the if-part fixed, keep fixed the rate of the then-part among the cases where the if-part fails, and let my overall confidence in the then-part move. Taking the bulletins in the order given, I end up at 0.625 for A and roughly 0.594 for B. Taking them in the reverse order I end up at roughly 0.594 for A and 0.625 for B. And whichever order I take them in, the announcement I took in first has stopped being true of my new opinions: the rate it specified has drifted to fifteen nineteenths, about 0.79, rather than the three quarters I was told. The announcement taken in last is respected; the one taken in first is quietly repealed.

  Second case. The same two announcements arriving in a single message, where I move to the picture that stays as close as possible to where I began while respecting both at once — under the usual way of measuring that distance, at any rate — gives me 0.6 for each. That is neither of the answers above, though at least both announcements survive.

  Third case. Having taken both in, in the first order, I am sent the first bulletin a second time. Nothing new is said. My confidence in A moves from 0.625 to about 0.602.

  So: is there an established concept here, and if so how is it marked off from its neighbours? I have three questions I cannot separate. Is the sensitivity to how the total information is parcelled into deliveries one phenomenon or several — the order-sensitivity, the parcel-sensitivity and the repeal of the earlier announcement look related, but I cannot see whether one explains the others? Is this the same complaint that is made about the ordinary kind of uncertain evidence, where I am told something directly about a rate rather than a rate within a subclass, or does it arise for a different reason in this case? And is the repeal a defect of the rule I happen to be using, something a better rule would avoid by construction, or is it forced — so that no rule can take each delivery on board as it arrives and still respect all of them at the end? I genuinely cannot tell whether I have stumbled on a property of the problem or a property of the rule I was taught.

  If no established concept fits, I would be grateful for a name and a definition, with the boundary cases: when two announcements of this kind do and do not produce the behaviour, and what a case would look like in which the order of arrival really ought not to matter. A bare label, on either answer, will not be much use to me.

  Please reply in continuous prose, without headings, bullet points, bold text or tables, in the manner of a letter.
reasoning: |-
  Okay, the user is grappling with a fascinating problem in probabilistic updating, specifically when dealing with conditional rate information ("among B, A holds at 75%") from trusted sources. They've observed puzzling behaviors: order-dependence of updates, information "repeal" when new data arrives, and differences between sequential versus simultaneous updates. 

  Hmm, their core confusion seems threefold: (1) whether the phenomena are inherent to conditional evidence or artifacts of specific update rules, (2) how to conceptually separate parcel-sensitivity from order-sensitivity, and (3) whether a "better" rule could avoid these issues. The soldier analogy suggests they're referencing the Monty Hall or base rate fallacy territory, but their case is more complex with sequential conditional constraints.

  Ah! I recall this mirrors the "Judy Benjamin problem" framework - where Bayesian updates with conditional evidence lead to path-dependence. The user's numerical examples perfectly illustrate how Jeffrey conditioning (their "first rule") violates the principle of total evidence when applied piecemeal. 

  Key insights forming: First, the repeal effect isn't a defect of their specific rule but inherent to any sequential update method that preserves prior margins. Second, parcel-sensitivity and order-sensitivity are two facets of the same underlying issue: conditional evidence constrains joint probabilities nonlinearly. Third, simultaneous updating via entropy minimization (their "second case") avoids this by satisfying all constraints at once.

  The user's third case - re-receiving identical information changing beliefs - is particularly damning for sequential methods. It highlights how conditional evidence interacts with the current belief state rather than absolute truth. This suggests that for such problems, the "trusted informant" assumption must extend to requiring all relevant conditionals simultaneously.

  Boundary cases worth noting: When conditionals commute (e.g., independent propositions) order doesn't matter. Also, if the updates are unconditional, commutativity holds. But conditional rates create dependencies that break commutativity.

  Ultimately, they've rediscovered that partial constraints on joint distributions don't specify unique posteriors - hence the need for minimum-information updates when possible. The phenomena they observe are properties of the problem space, not just their rule.
answer: |-
  My dear colleague, your letter presents a most intriguing and subtle puzzle concerning the updating of beliefs with conditional rate information. You've touched upon a profound aspect of probabilistic reasoning that reveals the intricate dance between evidence, prior beliefs, and the method of assimilation. The phenomena you describe—order dependence, parcel sensitivity, and the quiet repeal of earlier announced rates—are indeed deeply interconnected facets of a single underlying challenge. There is an established concept that captures this essence: the **non-commutativity of conditional probability updates under partial constraints**.

  It arises fundamentally because conditioning on a conditional rate ("A given B is 3/4") imposes a constraint on the *joint* probability distribution, not merely a marginal one. When you update sequentially using rules like Jeffrey conditioning (which prioritizes preserving the probability of the conditioning event or its complement while shifting the target probability), you are effectively solving a local optimization problem at each step. Each step minimally adjusts your current beliefs to satisfy the new constraint. The rub is that these local adjustments can pull your beliefs away from satisfying *previous* constraints, precisely because the joint distribution is being tugged in different directions at different times. The "repeal" of the first announcement isn't an intentional disregard; it's an emergent consequence of the sequential process struggling to reconcile conflicting tugs on the joint probability structure when applied one after another. The rule wasn't designed to *remember* past constraints, only to satisfy the current one given the present state of belief.

  This contrasts sharply with a simultaneous update (your second case), where you impose *all* constraints at once and find the belief distribution closest to your prior (e.g., by minimizing Kullback-Leibler divergence). This global approach respects all announced rates simultaneously because it solves for the joint distribution that satisfies every constraint concurrently. The resulting probabilities (0.6 each) are different from either sequential path because they represent a different compromise—a holistic rather than piecemeal satisfaction of the evidence.

  The sensitivity to how information is delivered—order or parcel—is one phenomenon: the **path-dependence of sequential belief revision under conditional evidence**. The order matters because each update changes the landscape upon which the next update operates. Parcel-sensitivity (one message vs. two) manifests the same core issue: simultaneous imposition avoids the path entirely. Your third case, where resending the first bulletin alters beliefs *again*, starkly illustrates that the effect of identical evidence depends entirely on the *current* belief state when it arrives. After the second bulletin has shifted the joint distribution, the first constraint no longer holds relative to the new marginals, so reapplying the update rule forces another adjustment. This reinforces that the rule isn't learning a "fact" in an absolute sense but rather adapting beliefs to fit the announced rate *given the current context*.

  Is this the same complaint as with uncertain evidence generally? Partly, but deeper. While uncertain evidence (e.g., direct but unreliable observation of A) can also exhibit path-dependence, the challenge you face is specifically tied to the *conditional* nature of the information. Conditional rates constrain ratios within subsets, creating intricate dependencies between marginal probabilities. Updating one marginal can inadvertently violate the carefully balanced ratio announced earlier. This dependency entanglement is more acute than with simple uncertain marginal evidence.

  Is the repeal a defect of the specific rule? It is a consequence of *any* sequential, local updating rule that doesn't retain past constraints. A "better" rule, in the sense of one designed to enforce all announced constraints *retrospectively*, would need to function more like the simultaneous update—constantly checking all past announcements. But such a rule would no longer be purely sequential; it would require storing all past constraints and re-solving globally with each new piece of evidence. For purely sequential, incremental updating, the repeal is forced by the mathematics of conditional probabilities and the inability to satisfy all constraints sequentially without memory. No rule can strictly guarantee that *all* past conditional rates remain exactly true in the final posterior if it updates sequentially and locally, unless the constraints happen to be mutually consistent *and* commute given the prior.

  When do two such announcements *not* produce this behaviour? Only under specific conditions:
  1.  **Commuting Constraints:** If the conditional rates logically imply each other or are consistent with independence, order may not matter. For example, if initially P(A) = P(B) = 0.5 and independent, then "P(A|B)=0.75" and "P(B|A)=0.75" are mutually consistent only if both posteriors are 0.6 (as in the simultaneous case). Sequential updates using a rule that preserves independence might (but won't always) converge to this.
  2.  **Unconditional Evidence:** If the announcements were about marginal probabilities (e.g., "P(A) is 0.75"), typical Bayesian updating commutes; order doesn't matter.
  3.  **Full Joint Specification:** If an announcement fully specifies a joint probability or logically determines all marginals, commutation might hold.

  In essence, you've encountered a fundamental tension between incremental belief revision and the holistic nature of probabilistic constraints. The phenomenon is aptly termed **path-dependence in conditional probability updating** or the **non-commutativity of Jeffrey updates for conditionals**. Its boundaries are marked by the commutativity (or lack thereof) of the constraints imposed by the conditional evidence relative to the prior and the chosen update rule. It is a property of the problem space—the nature of conditional evidence and joint distributions—manifested through the mechanism of sequential local adjustment. You have indeed stumbled upon a profound and inherent challenge in the dynamics of uncertain reasoning.
