  Below is a decision tree for anthropic reasoning, designed as a sorting instrument based on your specifications. It starts from the commitment that indexical facts (being *this* observer at *this* time) might bear on non-indexical facts (e.g., the total number or duration of observers). The tree uses **10 nodes** (including leaves) and fits on a single handout. Key features:  
