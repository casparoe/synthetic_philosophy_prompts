  ### **Anthropic Reasoning Decision Tree**  
  *Start:* You allow that being *you* at *this time* might bear on the size/duration of the world.  

  #### **Node 1: Does your existence/identity have evidential weight?**  
  *(Cases: Sealed Vaults tests evidential vs. pragmatic; Archivist/Uplift/Many-Nows assume evidential weight)*  
  - **A: Yes (evidential)** → Node 2  
  - **B: No (only practical import)** → Node 3  

  #### **Node 2 (Evidential): In Sealed Vaults, do credences move toward more observers?**  
  *(Tests if indexical evidence favors hypotheses with more observers in causally disconnected regions)*  
  - **A: Yes** → SIA (Self-Indication Assumption) → Node 4  
  - **B: No** → SSA (Self-Sampling Assumption) → Node 5  

  #### **Node 3 (Practical): Can indexical facts affect decisions?**  
  *(Sealed Vaults: If no decisions are affected, no update)*  
  - **A: Yes** → Leaf: **Pragmatic Anthropics** (Indexicals affect actions, not beliefs. Sealed Vaults: no update.)  
  - **B: No** → Leaf: **Deflationary Position** (Indexicals never bear on non-indexicals. All cases: no update.)  

  #### **Node 4 (SIA): In Archivist, does evidence favor large civilization?**  
  *(Tests if prior (SIA) and likelihood (early birth) cancel)*  
  - **A: No change** → Cancellation → Node 6  
  - **B: Favors small** → Node 6  
  - **C: Favors large** → *Incoherent* (Violates SIA’s standard cancellation)  

  #### **Node 5 (SSA): In Archivist, does evidence favor small civilization?**  
