  - **Required positions** are marked as leaves (e.g., Doomsday, Presumptuous Philosopher).  
  - **Evidential/pragmatic distinction** is flagged at Node 1, as it impacts longtermist expected values.  
  - **Incoherent/unattractive/unclaimed combinations** are noted where they arise.  

