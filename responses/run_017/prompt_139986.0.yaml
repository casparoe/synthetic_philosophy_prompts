prompt: |-
  Bit of a weird request, but here goes. I've recently started doing a few hours a week labelling Bongard-style puzzles for a small outfit that trains vision models — you know the kind of thing, half a dozen little line drawings on the left that all follow some rule, half a dozen on the right that all break it, and you have to say what the rule is. It's the most fun I've had in a job, but me and the other annotators are stuck in the same argument over and over, and I reckon a story would get at it better than another Slack thread. I've also got a horrible feeling I've been marking perfectly decent answers wrong for weeks.

  So: could you write me a short story — in British English please, and keep it to under a thousand words or so — about a solver who gets one of these puzzles "right" in the boring sense, meaning the rule they state cleanly separates all twelve pictures, and gets it wrong anyway.

  The bit I actually want the story to be *about*, though, is a distinction I keep banging on about and can't quite put my finger on: whether the twelve pictures were drawn to fit the rule — the setter had the rule first, then produced examples that satisfy it — or whether they were picked out of an existing pile of drawings that happened to satisfy it. To me those are completely different kinds of evidence, and I'm not sure it's even the same puzzle in the two cases, but whenever I try to explain why, it comes out as hand-waving.

  Please do invent a specific puzzle for the story, shapes and all — I'd much rather have something concrete than vague gesturing at "a rule about geometry." And if it fits, work in the second layer of guessing too: the solver isn't only guessing the rule, they're guessing what *kind* of rule someone like them would have been allowed to pick from. I've been calling that "reading the setter," but if you can come up with something better inside the story, go for it.

  Oh, and definatly make it an actual story — sad or funny, either's fine — rather than an essay with dialogue dropped into it. Ta!
reasoning: |-
