  Okay, the user is a high school student who's come across updateless decision theory and noticed a parallel in psychiatric advance directives. They're trying to reconcile how an earlier decision can override a later refusal during a mental health crisis, which seems to contradict normal consent principles. 

  Hmm, this is actually quite sophisticated for a high school student—they've connected abstract decision theory with real-world medical ethics. The core tension they're highlighting is fascinating: why does the "past self" get priority over the "present self" only in specific contexts like mental health crises, but not in others (like intoxication)? 

  Let me unpack their questions systematically. First, they want to know the philosophical underpinnings—is this genuinely updateless or can it fit standard decision-making? Second, they're asking which aspects of the practice *require* the updateless view. Third, they want a "what if" scenario where only the present self decides. Finally, they're wisely requesting epistemic humility—where my reasoning might fail. 

  *scribbles mental notes* 
  The comparison to intoxication is key—it shows they recognize the "temporary incapacity" argument but sense inconsistency. They're likely wrestling with personal identity questions too (is the ill self still "me"?). Their frustration with paternalism peeks through the clinical description of overridden protests. 

  ...Ah! The breakthrough realization: advance directives work precisely because mental illness *distorts* preferences, whereas intoxication doesn't create a "truer" self. That's why we don't let drunk decisions override sober ones, but do the reverse for psychosis. The epistemic argument (unreliable signaling during crisis) is stronger here than any metaphysical time-slicing of selves. 

  *imagines counterarguments* 
  But wait—what about bipolar patients who feel manic decisions *are* authentic? That's where my "core preferences" point might crumble. If the user brings that up, I'd concede some directives risk overcorrecting. Also, I'm assuming clinicians can accurately diagnose incapacity, which isn't always true... 

  For the "present-self-only" scenario: We'd see more restraints/sedation instead of treatment, which is darker but logically consistent. The student might not realize how much that already happens when directives *don't* exist. 

  *checks own biases* 
  I'm heavily favoring the epistemic view because updateless theory feels too abstract for clinical reality. But if studies showed patients *retrospectively* endorse overridden protests (e.g., "I'm glad they ignored me"), that'd strengthen the updateless case. Haven't seen such data though. 

  Final thought: Their curiosity about "which parts require which story" suggests they'd enjoy diving into specific legal cases. Might recommend the Manitoba seizure directive case if they follow up.
answer: |-
  Your connection between updateless decision theory (UDT) and psychiatric advance directives (PADs) is astute. Let's break down the practice, its philosophical foundations, and where UDT illuminates (or doesn't) the tension between past and present selves.

  ### Core Conflict & Philosophical Presuppositions
  The practice rests on two key premises:
  1.  **Temporal Pluralism of Self:** A person is understood as having multiple "selves" across time (well self, ill self), with differing epistemic capacities and values.
  2.  **Authority of the "Truer" Self:** The "well self" is deemed more authentically representative of the person's *enduring values*, *rational capacities*, and *long-term interests* than the "ill self" distorted by acute symptoms (e.g., psychosis, severe depression).

  **View of Persons:** It presupposes persons as:
  *   **Temporally extended beings:** Identity and autonomy aren't just moment-to-moment but span time. Decisions made at Time A bind actions at Time B.
  *   **Vulnerable to self-undermining states:** Certain mental states can compromise the very capacity for authentic self-governance *in that moment*.
  *   **Possessing a "core" self:** Beneath episodic illness lies a persistent set of values/preferences accessible when well.

  **Authoritative Choice:** Authority lies with the **self deemed most competent and reflective of the person's stable identity and values** – the well self. The later refusal is seen not as an authoritative choice, but as a *symptom* obstructing choice.

  ### UDT Analogy vs. Ordinary Evidential Update
  *   **UDT Analogy Fits Well:**
      *   **Policy over Updates:** Like UDT, PADs prioritize a pre-committed *policy* ("When in state X, do Y") over the "update" of finding oneself in the crisis state and wanting to do Z.
      *   **Causal Influence:** The well self's policy *causes* the ill self's situation (via the directive influencing clinicians). UDT emphasizes how your precommitment shapes which situations you encounter and how others act within them. The directive shapes the clinician's response to the ill self's protests.
      *   **Counterfactual Reasoning:** The well self reasons: "If I *were* in that state, I *would* want treatment, even if I protested. Therefore, I commit to treatment now." This mirrors UDT's counterfactual reasoning across potential branches.

  *   **Ordinary Evidential Update Also Explains (Epistemic View):**
      *   **Epistemic Breakdown:** The later refusal is discounted because the episode itself **destroys the reliability of the preference signal**. Symptoms (delusions, overwhelming despair, mania) distort perception, reasoning, and value weighting. The refusal isn't a trustworthy indicator of the person's "true" will or best interests.
      *   **Proxy for "True" Wants:** The advance directive is seen as the **best available evidence** of what the person *would* want if thinking clearly *right now*, or what best serves their objectively defined interests (health, survival, long-term autonomy).
      *   **Paternalism Lite:** It's justified weak paternalism: intervening because the person's *current* capacity for autonomous choice is severely impaired, using their *own prior instructions* as the guide.

  **Where UDT is Most Distinctive:** The strongest UDT-like element is the **intentional precommitment to bind the future self** *specifically because* you know that future self will make suboptimal choices *from the perspective of your current, broader values*. It explicitly embraces overriding the future self's "update" as part of the optimal plan. The epistemic view focuses more on the *unreliability* of the signal *now*.

  ### What Requires the "Past Self Authority" Story?
  1.  **Overriding Explicit, Present Refusals:** This is the crux. If the *only* justification were epistemic unreliability, then *any* reliable evidence of the person's "true" wishes *during* the episode (e.g., a brief lucid moment expressing agreement with the directive) could theoretically suffice. The practice often allows override based *solely* on the directive, even without constant assessment proving total incapacity at every second. The directive itself confers authority.
  2.  **Binding Force of the Precommitment:** The idea that the well self has the *right* to bind the ill self, even if the ill self could somehow give a coherent, value-based reason for refusal *rooted in their current distorted state* (e.g., "The voices say the medicine is poison, and I believe them"). The "past self authority" view explicitly trumps this.

  ### What Fits Multiple Stories (Including Epistemic)?
  *   **Existence of PADs:** Encouraging planning is good under both views.
  *   **Guiding Treatment:** Using the directive as strong evidence of preferences.
  *   **Assessing Incapacity:** Needing *some* assessment that the person is currently incapable of making treatment decisions.
  *   **Limiting Override:** Confining override to specific treatments/conditions outlined in the directive.

  ### The "Present Self Only" Practice
  If *only* the present, best-informed self ever decides:
  1.  **No Binding Advance Directives:** PADs would be purely advisory. Clinicians could consider them but *must* obtain current consent for treatment. A clear "no" *now* always trumps a "yes" in the past.
  2.  **Strict "In the Moment" Capacity Assessment:** Treatment could only proceed without consent if the patient is *legally incompetent (incapable) at that exact moment* of decision-making, based on a high threshold of impairment. The *reason* for incapacity (psychosis vs. dementia vs. intoxication) might be less relevant than the *fact* of incapacity.
  3.  **Substituted Judgment Shifts:** If incompetent, decisions would rely on:
      *   **Best Interests Standard:** What a reasonable person would want, or what promotes health/survival.
      *   **Proxy Decision-Makers (Surrogates):** Family or court-appointed guardians making decisions based on *their* understanding of the patient's values (which *might* include knowledge of the advisory PAD) or best interests.
      *   **NOT the Past Self's Direct Authority:** The directive itself wouldn't have binding legal force to override a present refusal if the patient is deemed competent *at the moment of refusal*.
  4.  **Increased Coercion/Involuntary Treatment:** To treat someone refusing *and* deemed competent, society would need to rely more heavily on formal involuntary commitment laws, which typically require a high threshold of danger to self/others or grave disability, often involving courts. Treatment over objection would be harder and rarer.

  ### Where My Reasoning Might Break Down & What Could Change It
  1.  **Overestimating UDT Parallels:**
      *   **Breakdown:** UDT is typically about maximizing expected utility in uncertain causal structures. PADs are often more about preserving identity/autonomy defined by core values against distortion. The goals differ.
      *   **Mind Change:** Evidence that PADs are used primarily for purely instrumental goals (e.g., *only* to reduce costs or clinician burden) rather than autonomy/value-preservation would weaken the UDT analogy.
  2.  **Underestimating Ill Self's Authenticity:**
      *   **Breakdown:** Some argue that experiences during severe episodes (e.g., mystical states in mania, profound insights in depression) hold unique value and authenticity that the "well self" pathologizes and dismisses. Overriding them might crush authentic, albeit unusual, self-expression.
      *   **Mind Change:** Strong qualitative evidence from recovered patients consistently valuing experiences or refusals made during acute episodes *as authentic parts of their identity*, even if harmful, would challenge the "truer self" premise.
  3.  **Practicality of "Present Self Only":**
      *   **Breakdown:** I argue override is necessary partly because constant, perfect capacity assessment is impossible. Maybe better neurocognitive/affective assessments *could* reliably identify moments of true capacity *during* crises.
      *   **Mind Change:** Development of highly reliable, real-time biomarkers or assessments for "authentic preference expression" during mental health crises would make the epistemic argument for override much weaker and bolster the "present self only" model.
  4.  **Harm of Override:**
      *   **Breakdown:** I assume override, when done per a valid PAD, is generally beneficial/restorative. The trauma and erosion of trust caused by overriding a person's desperate pleas, even based on a past directive, might be severe and undercut long-term recovery and autonomy.
      *   **Mind Change:** Robust data showing PAD override consistently leads to worse long-term outcomes (engagement, trust, recovery rates) or significant trauma compared to models prioritizing present consent (even with advisory PADs) would undermine the practice's justification.

  **In Conclusion:** The practice of honoring PADs over current refusals leans heavily on the **authority of the past "well self"** as representing the person's enduring identity and values, viewing the ill self's refusal as a non-authoritative symptom. This has strong parallels to UDT's prioritization of precommitment. However, the **epistemic argument** – that the illness makes the current refusal unreliable – provides a significant, overlapping justification that doesn't *strictly* require UDT's temporal binding. The core element requiring the "past self authority" story is the **intentional overriding of a present choice based solely on a prior instruction**. Moving to a "present self only" model would fundamentally change the practice, shifting authority decisively to the moment of treatment and dissolving the unique binding power of the advance directive.
