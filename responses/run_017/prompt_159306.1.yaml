prompt: |-
  I'm putting together a one-day workshop session for my grad seminar on philosophy of mind this spring, and I've got two collegues coming who have been sniping at each other about whether the brain literally computes for something like a decade. One of them is a realist about neural computation: she thinks there is a fact of the matter about which computation a given neural circuit performs, that this fact is part of what makes cognitive-scientific explanation work, and that the brain is, in the relevant sense, a computer. The other is an ascriptivist: he thinks calling a physical system a computer is always relative to a mapping we choose from physical states onto mathematical ones, that indefinitely many incompatible computations can be truly ascribed to the same bit of tissue, and that when a computational model earns its keep in neuroscience it earns it by letting us predict and intervene, not by being what the tissue is running. I don't want another ninety minutes of them talking past each other, so I want the document they should have written together.

  Write the joint statement of their adversarial collaboration. Structure it as a numbered section of agreed claims — things both can sign, phrased so they aren't vacuous — followed by a disagreements table, then a short closing section on which parts of their dispute you take to be merely verbal and why.

  What I want in it, plus a few guesses of mine that I'd rather you argued with than just accepted:

  Agreed claims, numbered. Both should be able to sign things like: the same physical system's behaviour can be captured by many different formal models at once, only some of which are useful; the credentials of a computational model in neuroscience come from prediction and intervention, not from intuition about what the tissue is really doing; and whatever the right story turns out to be, it has to be consistent with the brain being a messy, wet, partly analogue, noise-ridden physical object rather than a tidy symbol manipulator.

  The disagreements table: one row per crux, with a column for the computationalist's own formulation of her view on that crux (wording she would accept), a column for the ascriptivist's (wording he would), a column for the case or argument both would agree bears on the crux, and a column with each side's prediction about that case, writen down in advance.

  Cruxes I suspect are in there — re-cut them, drop them, or add better ones:

  1. Whether computation is something a system does intrinsically or something we ascribe. My test case: a model fits a circuit's spiking behaviour under every intervention we can currently run, and then it turns out the model's internal variables correspond to nothing in the tissue. Does the fit alone settle that the circuit performs that computation?

  2. Grain and the analogue worry: whether there is always some level of description at which a continuous, timing-sensitive neural process counts as computing something, or whether some real neural work depends on fine-grained physical detail that no implementation-independent description preserves. Test case: a circuit whose behaviour collapses if you discretize time any more coarsely than a fraction of a millisecond.

  3. Explanatory surplus: whether saying that a circuit computes such-and-such explains anything that saying its dynamics are thus-and-so plus here is the mechanism does not. Test case: does the computational description buy you successful transfer of an intervention to a different individual, or to a different species?

  4. The verbal bit: how much of the fight is just about which thing gets to be called computation, and what is left over once that is fixed.

  Keep it under a couple of thousand words and skip footnotes and citations entirely — I need something I can hand out, not a literature review. Assume a first-year grad student who has never read any of this has to follow it.
reasoning: |-
  Okay, the user is organizing a one-day workshop for a grad seminar on philosophy of mind and has two colleagues with opposing views on whether the brain literally computes. One is a computational realist who believes the brain intrinsically performs computations, while the other is an ascriptivist who views computation as a relative ascription based on our mappings. The user wants to avoid them talking past each other and requests a joint statement structured as agreed claims followed by a disagreements table, ending with a section on verbal disputes.

  First, I need to structure the document as specified: numbered agreed claims, a disagreements table with cruxes, and a closing on verbal aspects. The user provided some guesses for agreed points and cruxes, which I should incorporate but not just accept passively. Let me outline the components.

  For the agreed claims, both sides likely agree that multiple formal models can describe the same system, but only some are useful. Credentials of computational models come from predictive power and intervention, not intuition. Also, any account must acknowledge the brain's messy, analog nature. These points need to be phrased non-vacuously. Number them clearly.

  Next, the disagreements table. The user suggested four cruxes. Let me refine them:

  1. **Intrinsic vs. Ascribed Computation**: Realist thinks computation is intrinsic; ascriptivist sees it as relative to mapping. Test case: model fits behavior but internal variables don't correspond to anything physical. Realist would say yes, it settles the computation; ascriptivist says no, fit alone doesn't settle it.

  2. **Grain and Analog Processes**: Can continuous processes compute? Test case: discretizing time breaks behavior. Realist argues there's always a fine-grained computational description; ascriptivist says physical details matter beyond computation.

  3. **Explanatory Surplus**: Does computational explanation add value beyond dynamics? Test case: transferring interventions to other individuals/species. Realist claims computational level allows transfer; ascriptivist says only physical similarity does.

  4. **Verbal Dispute**: How much is terminological? Both might agree that "computation" is used differently, but dispute whether intrinsic computation exists.

  In the closing section, highlight that the core disagreement is about intrinsic properties vs. ascription. The realist's view requires a privileged mapping, while the ascriptivist denies it. The verbal part is whether "computation" implies mind-independent facts. The substantive part is whether such facts exist.

  Need to ensure clarity for first-year grad students. Avoid jargon, explain terms like "privileged mapping." Keep under 2000 words, no citations. Use the test cases to concretize disagreements. Make sure each crux has clear columns: View, Formulation, Test Case, Predictions.

  Check if the user's guesses are addressed. For example, the explanatory surplus crux: the realist might argue computational descriptions provide generalizations across substrates, while the ascriptivist attributes that to physical similarities. The test case of cross-species intervention transfer is apt.

  Also, the analogue worry: the realist must argue that even at fine-grained levels, computation is still happening, while the ascriptivist points out that computational descriptions lose essential physical details. The test case with time discretization illustrates this well.

  For the verbal dispute, clarify that both agree on the usefulness of computational models but disagree on ontological commitments. The realist thinks computation is a natural kind, the ascriptivist sees it as a tool. The unresolved issue is whether there's a fact of the matter independent of our models.

  Ensure the agreed claims are non-vacuous. For example, both accept that not all models are useful, which avoids triviality. Also, emphasizing prediction/intervention over intuition sets a pragmatic ground.

  Finally, the closing section should summarize that beyond terminology, the dispute is about whether computation is discovered (realist) or assigned (ascriptivist), and whether science requires such ontological commitments. Highlight that their collaboration focuses on productive disagreements through testable predictions.
answer: |-
  ## Joint Statement: Neural Computation - An Adversarial Collaboration

  **Agreed Claims**  
  1. **Multiple Models, Selective Utility:** Any given neural circuit can be formally described by multiple, potentially incompatible mathematical or computational models. Only a subset of these models prove scientifically useful – defined by their capacity to generate accurate predictions, guide successful interventions, and integrate coherently with established biological knowledge. The existence of other possible descriptions does not, in itself, invalidate a useful model.  
  2. **Pragmatic Grounding:** The primary scientific justification for adopting a specific computational model of a neural process lies in its empirical success: its ability to predict the system's behaviour under novel conditions and to guide interventions (e.g., stimulation, lesions, pharmacological manipulation) that reliably alter that behaviour in ways anticipated by the model. Intuitions about what the tissue is "really doing" are secondary to this pragmatic grounding.  
  3. **Biological Constraint:** Any adequate account of neural computation must be consistent with the brain's fundamental nature as a biological system: it is continuous in key aspects (analogue), stochastic (noise-ridden), constrained by biophysical implementation details (messy, wet), and evolved – not designed. Models ignoring these constraints risk being scientifically irrelevant.  
  4. **Levels of Description:** Explanations in neuroscience operate across different levels (e.g., molecular, cellular, circuit, systems, cognitive). Computational descriptions represent one level among these. Understanding often requires relating computational descriptions to descriptions at other levels (e.g., biophysical mechanisms).  
  5. **Mapping Dependency:** Attributing a specific computation (e.g., "calculating dot product," "implementing a Bayesian filter") to a neural system requires specifying a mapping between physical states of the system (e.g., spike trains, membrane potentials) and the abstract states of the formal computational model. Without such a mapping, the attribution is incomplete.  

  **Disagreements Table**  

  | Crux Issue | Computational Realist's View | Ascriptivist's View | Agreed Test Case/Scenario | Realist's Prediction | Ascriptivist's Prediction |
  | :--------- | :--------------------------- | :------------------ | :------------------------ | :------------------- | :------------------------ |
  | **1. Ontological Status: Intrinsic Property or Relational Ascription?** | Neural computations are intrinsic, causally efficacious properties of certain sufficiently organized physical systems, including neural circuits. The relevant computation is determined by the system's causal structure and the specific physical properties implementing state transitions. | Attributing a computation is always relative to an interpretive mapping chosen by an observer. While constrained by physical possibility, many distinct computations can be truly ascribed to the same physical system under different mappings. There is no single, uniquely correct "computation it is doing" independent of an interpretive context. | A computational model M provides highly accurate predictions for a circuit's spiking output under *all* current experimental interventions and perturbations. However, extensive investigation reveals no identifiable physical substrates or processes within the circuit that correspond to the *internal variables* or *state transitions* posited by M. | **Prediction:** The empirical success of M, especially across diverse interventions, strongly indicates that the circuit *is* performing computation M. The lack of identifiable internal correlates suggests either our current investigative tools are insufficient, or we need a better understanding of implementation. The fit *does* settle that this computation is being performed, as it reflects the circuit's intrinsic causal organization. | **Prediction:** The success of M demonstrates its utility as a predictive instrument *relative to our chosen mapping*, but it does not establish M as *the* computation the circuit intrinsically performs. The lack of internal correlates confirms that M is a useful "as-if" description, not a literal account of intrinsic processing. Other mappings, yielding different internal computations, could likely achieve similar predictive success. |
  | **2. Grain, Continuity & Implementation-Independence: Can Analog Processes Compute?** | Computation, even if implemented in continuous, analog substrates, can be described at a level abstracted from the finest physical details. There exists *some* level of description (potentially very fine-grained, incorporating timing precision) at which the system's state transitions satisfy the formal requirements of a computation. Analog noise and continuous dynamics are part of the implementation, not necessarily barriers to computation. | Genuine computation requires a degree of implementation-independence: the abstract description should capture functionally relevant state changes while abstracting away irrelevant physical details. Some neural processes rely critically on fine-grained, continuous physical properties (e.g., precise spike timing, analog summation, stochastic resonance) that cannot be captured by *any* usefully abstract computational description without significant loss of explanatory/predictive power. | A neural circuit exhibits precise temporal coding; its functional output (e.g., directing a specific behaviour) depends critically on spike timing precision within a fraction of a millisecond. Discretizing time (binning spikes) at any resolution coarser than this critical window destroys the circuit's ability to produce the correct functional output, even if average firing rates are preserved. | **Prediction:** This circuit *is* performing a computation, albeit one with extremely fine temporal grain. The computation involves precise temporal relationships between inputs and outputs or internal states. The failure upon coarse discretization shows the computation requires this fine grain, not that computation is absent. A sufficiently fine-grained computational model incorporating timing will succeed. | **Prediction:** This circuit's core function depends on continuous physical dynamics (precise timing) that are essential to its causal power. While we can *impose* a very fine-grained discrete computational description, this description becomes so tied to the specific physical parameters (timing windows) that it loses genuine implementation-independence and offers little explanatory surplus over a detailed physical model. The circuit's efficacy is fundamentally analog/physical at this level. |
  | **3. Explanatory Surplus: Does the Computational Description Add Unique Value?** | Attributing a specific computation provides genuine explanatory surplus beyond solely describing the physical dynamics plus mechanism. It explains *why* the mechanism has the effects it does by identifying the abstract function it realizes. This enables generalization and prediction across different substrates realizing the same computation. | Describing the physical dynamics ("thus-and-so") *plus* identifying the mechanism ("here is how") provides complete causal explanation. Attributing a computation is a pragmatic shorthand for summarizing complex dynamics relative to our interests/descriptions. Any apparent surplus (e.g., generalization) stems from similarities in the underlying physical dynamics and mechanisms, not from the abstract computation *per se*. | An intervention strategy (e.g., targeted stimulation pattern) derived *solely* from a computational model M of a circuit in Species A successfully alters a specific behaviour in a predicted way when applied to the putatively homologous circuit in Species B (with significant biophysical differences), or even to an artificial neural network designed to implement M. | **Prediction:** Successful transfer strongly supports the claim that M captures the *shared computation* being performed, which is causally responsible for the behaviour. The computational description explains the functional commonality despite physical differences. This constitutes unique explanatory power provided by the computational level. | **Prediction:** Successful transfer occurs because the intervention targets key functional *physical* properties (e.g., specific input-output relationships, timing constraints) identified *by* the model M. The success depends on sufficient physical similarity in the relevant dynamics between systems, not on them performing the *same abstract computation*. The "computational" label summarizes this physical commonality; the explanation resides in the physical similarity. |

  **Closing: Verbal Components and Substantive Disagreements**

  We agree that a significant portion of our longstanding debate involves terminological preferences concerning the word "computation."

  *   **Verbal Aspect:** Both sides agree that neural systems can be *described* computationally and that such descriptions are often scientifically indispensable. The core verbal disagreement is whether "computation" *necessarily implies* an intrinsic, observer-independent property of physical systems, or whether it *can legitimately be used* to describe highly successful, observer-relative ascriptions. The realist insists the term only properly applies in the first sense, while the ascriptivist argues the second sense is coherent and scientifically sufficient.
  *   **Substantive Disagreement:** Once terminology is clarified, the fundamental, non-verbal disagreement remains: **Is there a uniquely correct (or significantly privileged) mapping from the physical states of a neural system to the states of a computational model, determined by the system's intrinsic causal structure, such that we can say the system *is* performing that computation independent of our descriptive choices?** The Realist answers "Yes": science *discovers* computations being performed in the brain. The Ascriptivist answers "No": science *constructs* useful computational descriptions; the privilege comes from empirical utility within a context, not from mirroring a computational reality independent of our modeling choices. This disagreement centers on the ontological commitments we believe are warranted by the success of computational neuroscience. It is tested by our differing predictions on the cruxes above, particularly concerning the interpretation of model fit without internal correlates (Crux 1) and the grounds of generalizability (Crux 3).
  *   **Resolution Path:** We concur that progress hinges less on abstract philosophical argument and more on developing and confronting concrete cases like those outlined above, especially as neuroscience techniques for probing and perturbing neural circuits at finer scales advance. The viability of the Realist position depends on demonstrating that specific computational models capture uniquely privileged causal roles within the tissue that cannot be captured otherwise, while the Ascriptivist position must demonstrate that the pragmatic utility of computational models never compels the adoption of an intrinsicist view.
