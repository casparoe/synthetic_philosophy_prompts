  ### Brainstormed Approaches  
  1. **Shifting Refrain & Doubled Lines**: Use a refrain ("A Stranger") that shifts down one line per stanza for finite arrivals, then occupies odd lines after doubling for infinite arrivals. The diagonal guest is constructed by inverting traits in the register, with each inverted trait in a line, ensuring form mirrors the mathematical operations.  
  2. **Interleaved Stanzas**: Alternate stanzas for hotel operations and register entries, with refrain placement and trait inversion directly tied to line numbers. Diagonal construction becomes a mirror stanza to the register.  
  3. **Narrative Sequence**: Linear progression where stanza structure mutates (shifting lines → split evens/odds → inverted traits), making transitions between cases visually intuitive but risking compression.  

  **Chosen Approach**: Option 1, for its seamless integration of form and proof:  
  - Shifting refrain demonstrates finite moves *procedurally*.  
  - Odd-line refrain post-doubling *is* the infinite accommodation.  
  - Trait-by-trait inversion *enacts* the diagonal argument.  
  Mathematically, each move is sound: shifting (n↦n+1), doubling (n↦2n), diagonal negation (f(n,n) flipped). No fudging — the failure is in the list, not capacity.  

  ---

  ### The Poem: **Hilbert’s Complaint**  

  The hotel was full: each room held one.  
  Guest 1, Guest 2, Guest 3, Guest 4,  
  Guest 5, Guest 6 — no space, no sun  
  for a stray. The manager locked the door.  

  **A Stranger** knocked. "Move *n* to *n*+1!"  
  Guest 1 to 2, 2 to 3, 3 to 4,  
  4 to 5, 5 to 6... Room 1: undone.  
  **A Stranger** entered. Dust swirled the floor.  

  Another came. Again: shift! *n* to *n*+1.  
  Guest 1 to 2, Guest 2 to 3, Guest 3 to 4,  
  4 to 5... **A Stranger** (now in 2) watched, undone  
  by the logic. Room 1: the new one. Snores.  

  A third. Shift: *n* to *n*+1. Guest 1 to 2,  
  Guest 2 to 3, **A Stranger** (in 3) sighed.  
  Guest 3 to 4, 4 to 5. Room 1: the new key  
  clinked. The night buzzed. Infinity cried.  

  Then coaches — endless! "Move *n* to 2*n*!"  
  **A Coach Guest** in 1, **A Coach Guest** in 3,  
  **A Coach Guest** in 5... Evens held the old din:  
  Room 2: Guest 1, Room 4: Guest 2, wild spree.  

  The register swelled. Trait *n* of guest *n*:  
  Guest 1: Tall. Guest 2: Fair. Guest 3: Kind.  
  Guest 4: Young. Guest 5: Rich. Guest 6: Calm. Then  
  a whisper: "I, too, seek a room. You’ll find  

  I’m Not Tall. Not Fair. Not Kind. Not Young.  
  Not Rich. Not Calm." The manager blinked.  
  *Differs from 1 in 1, from 2 in 2, flung*  
  *from the list*... The register shrank.  

  *Envoi (Night Porter):*  
  "Ghost guests! These rooms are just four walls.  
  That ‘list’? Scribbles. No one *truly* came.  
  Infinity’s ink before dawn falls —  
  marks, not guests. Just a finite game."  

  ---

  ### Sanity Checks & Notes  
  - **Finite arrivals**: Refrain shifts down (line 1→2→3) as existing guests move right (n↦n+1), preserving bijection.  
  - **Infinite arrivals**: After doubling (n↦2n), refrain occupies *all* odd lines (rooms 1,3,5...) — correct assignment.  
  - **Diagonal**: Each line inverts the nth trait of nth guest (e.g., "Not Tall" vs. Guest 1’s "Tall"). Constructed guest differs at diagonal, proving *any* list fails.  
  - **Envoi**: Porter’s finitism vs. manager’s idealism — unresolved, per seminar spirit.  
  - **Form**: 40 lines (six 6-line stanzas + 4-line envoi). Readable in ~90s.  
  - **Accessibility**: "Coach Guest", "Not Tall" etc., require no jargon. Math-insiders see diagonal; others see hotel chaos.  

  If recited at the pub, the doubling stanza should sound like boots thumping to even rooms, the diagonal like a sly guest slipping through.
