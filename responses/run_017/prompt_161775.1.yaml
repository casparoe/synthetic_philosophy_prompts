prompt: |-
  I'm a junior at a fairly large public high school, and I've started going to school board meetings this year because our district has been arguing about how to tell whether its own programs work. I'd like your help figuring out what our district's reporting rules actually assume. The argument has stopped making sense to me, and I think the part I'm stuck on is conceptual rather than statistical.

  Here is what the district does. Every spring we take a common end-of-course algebra exam. Students are placed into four cohort bands, Band 1 being the lowest, using their score on the previous year's exam, and the bands are re-cut every year so that each one always holds a quarter of the students: they are percentile bands, not fixed score ranges. The district publishes the percentage passing within each band, and it also publishes each school's overall pass rate, which is the number the local paper and the state report card use to rank schools. When the district evaluates its algebra support block, an extra period that students below a cutoff are placed into, it compares this year's pass rate inside each band with last year's pass rate inside that same band; it refuses to compare students in the program with students not in it, and it refuses to compare the district-wide rate from before the program existed with the district-wide rate after. When it defends the program to the board, though, it shows a slide of the district-wide rate before and after. At any school where a band has fewer than twenty students, that band's rate is suppressed entirely, and the school is still ranked on its overall number.

  The year the program was expanded, ninth graders who used to take algebra in tenth grade were moved into it, so the pool of test-takers changed. Every band's pass rate went up and the district-wide rate went down. I've since read that this kind of reversal has a name, but the explanations I find just say to control for the confounding variable, which doesn't settle anything for me. My worry is the percentile bands themselves. Because they are re-cut annually, this year's Band 2 and last year's Band 2 are not the same kind of students: if the cohort as a whole scores higher on the earlier exam, this year's Band 2 is made of students with higher old scores than last year's Band 2, so improvement within bands across years looks like it could be mostly bookkeeping. The district's own principle is that you must compare like with like, and re-cutting the bands seems to break that principle while also being what makes the reversal possible. On top of that, the quantity being held fixed, last year's score, is itself something the program is supposed to raise over time, which feels like holding fixed the very thing you are trying to measure.

  So what I want is not a verdict on whether this is good statistics. I want to know what the package of rules presupposes. What view of what a rate is, or of what it is for a program to make a difference, or of what makes two groups comparable, would someone have to hold for these rules to be the right ones? Does the district have to think of a rate as a fact about a population rather than about a school or a program, and of causation as difference-making rather than association, or could some quite different view license exactly the same rules? Which parts of the package follow from that view, and which are just habits that happen to sit well with it, so that several views would permit them? I'd especially like to know whether the package contradicts itself, since the district ranks schools on the unadjusted number while refusing to judge the program on it, or whether that only looks contradictory because the two numbers answer different questions. And if the district decided that the only honest comparison is each student against their own earlier score, with no bands at all, what would it lose by that change, and would the loss be real?

  Please answer in continuous prose, with no headings, no bullet points, no bold text, and no tables, the way you would write a long email. Assume I know no statistics beyond averages and percentages and no philosophy beyond what I've said; if a term like confounder or counterfactual is carrying weight in your answer, explain it in a sentence instead of leaning on it.
reasoning: |-
  Hmm, this is a thoughtful question from a high school junior grappling with their school district's evaluation methods. The student has clearly observed some contradictions in how the district measures algebra program effectiveness and wants to understand the underlying assumptions rather than just getting statistical corrections. They're particularly concerned about the percentile band system, the district's selective use of data, and the apparent paradox where band pass rates increase while the overall rate decreases.

  The core issue seems to be about conceptual coherence. The student notices that by redefining bands annually based on relative performance, the district breaks its own "compare like with like" principle. They also spot the contradiction in using unadjusted overall rates for school rankings while rejecting that same metric for program evaluation. And they're perceptively identified the problem of holding last year's scores fixed when those scores are precisely what the program aims to improve.

  What's impressive is how the student frames their question - they're not asking "is this wrong?" but rather "what worldview makes this system seem right?" They want to understand the philosophical underpinnings that would justify this particular package of rules: the percentile bands, the suppression of small groups, the refusal of before-after comparisons for programs while using them publicly, and the focus on within-band rather than cross-band analysis.

  The reversal phenomenon they mention is likely Simpson's Paradox, where trends appear in subgroups but disappear or reverse when aggregated. But as they wisely note, the "control for confounders" advice doesn't resolve their conceptual unease about the bands themselves. Their deeper question is whether the entire measurement system is coherent or self-defeating.

  I should unpack several layers: First, what view of educational measurement does the percentile band system assume? Second, what conception of causality justifies comparing only within bands? Third, why might the same institution reject overall rates for program evaluation but use them for school rankings? And finally, what would change if they switched to individual growth scores?

  The student's suspicion about "holding fixed the very thing you're trying to measure" cuts to the heart of a tension in value-added models. The system seems designed to measure incremental progress within static ability groups while ignoring whether those groups are actually moving upward over time - which is exactly the program's goal. There's an unstated assumption that educational improvement can only be assessed by comparing students who start from similar places.

  For the school ranking paradox, I'll need to explain how "what makes a school good" might be seen as different from "what makes a program effective" in the district's logic. The former could be viewed as a snapshot of current outcomes regardless of inputs, while the latter requires isolating program impact from student characteristics.

  When considering individual growth models, I should acknowledge both advantages (tracking actual student progress) and what might be lost (the ability to categorize students into policy-relevant groups, or simplicity in reporting). The student seems ready for the insight that all measurement systems involve trade-offs between accuracy, simplicity, and actionability.
answer: |-
  I understand your struggle with the district's approach, and it's sharp of you to see that the confusion goes deeper than just numbers. Let's unpack what this system of rules assumes about what rates mean, what makes groups comparable, and how we know if a program works. Think of it as trying to discern the hidden blueprint the district is following, even if they haven't spelled it out themselves.

  The core assumption seems to be that the *only* fair comparison is between students who started from the *exact same place* the year before. This "same place" is strictly defined by their position relative to everyone else in the district on last year's exam. The percentile bands are the tool to enforce this. By re-cutting the bands every year to each hold a quarter of the students, the district is saying: "A student's *relative standing* in the prior year is the single most important thing that determines their potential outcome this year. Students in Band 2 this year are comparable *only* to students who were in Band 2 last year – meaning they were in the same relative position within their own cohort – not necessarily to students who got the same actual *score* last year." This view prioritizes "like with like" based *entirely* on prior relative rank. It assumes that factors like overall cohort difficulty, changes in teaching, or even shifts in the test itself are secondary to this starting position when judging *year-over-year progress within that group*. The comparison they refuse to make – between program participants and non-participants – likely stems from a belief that these groups fundamentally *aren't* comparable because their prior relative ranks (and thus their "starting places") are different. Similarly, comparing overall rates before and after the program is rejected because the cohorts changed (the move of 9th graders), meaning even the *relative* starting positions aren't anchored to the same baseline cohort.

  This leads to the view of what a "pass rate" signifies. Within a band, the pass rate is treated as a measure of *how well the system served that specific type of student* defined by their prior relative rank. It's not primarily seen as a measure of the absolute ability of the students *in* that band this year compared to last year's band (because they are different students). Instead, it's seen as a measure of the *system's effectiveness* for students occupying that relative position in the distribution. The overall pass rate, conversely, is seen as a blunt measure of the *current year's achievement level* across the whole, mixed population. It answers "How many passed *now*?" not "Did we do better with similar students *compared to last year*?"

  This explains the apparent contradiction in using different numbers for different purposes. For ranking *schools* on the state report card, the district (and state) uses the overall pass rate. This assumes that the purpose of ranking is to judge the *current, observable outcome* regardless of the mix of students or where they started. It's a snapshot: "Which school has more students passing algebra *right now*?" For evaluating the *algebra support program*, the district insists on within-band comparisons year-over-year. This assumes the purpose is to judge the program's *impact on progress* for specific types of students, controlling for the major factor they believe determines outcomes: prior relative rank. They see these as fundamentally different questions requiring different numbers. The slide showing the overall rate before and after for the board is more about broad narrative ("Look, things changed!") than rigorous program evaluation, likely relying on the hope that the board won't delve into the Simpson's Paradox reversal you observed.

  The reversal itself happens precisely *because* of the re-cut bands and the change in cohort. Imagine last year's Band 2 were students scoring 70-80 on the prior test. This year, if the whole cohort scored higher on the prior test, Band 2 might be students scoring 75-85. This year's Band 2 starts from a higher absolute baseline. If the program helps *within* each relative group, their pass rate might rise. However, the overall pass rate fell because the *composition* changed: many more students who *used* to be in lower bands (and have lower absolute scores/higher failure rates) are now taking the test. Even if each *relative* group improved, adding a large group of historically lower-performing students can pull the overall average down.

  You're right to question holding last year's score fixed. The system focuses intensely on *short-term progress within static relative groups*. It assumes that "improvement" means doing better *this year* with students who started in Band X *this year*, compared to how we did *last year* with students who started in Band X *last year*. It deliberately *doesn't* ask: "Are students moving *up* between bands over time? Is the whole distribution shifting?" In fact, by constantly re-cutting the bands, it makes it impossible to see if a student who was Band 3 last year became Band 2 this year based on their *new* prior score. This view prioritizes incremental gains within predefined boxes over systemic shifts in the population's overall ability. It risks confusing "serving each relative group better this year" with "actually raising the long-term trajectory of students."

  Now, what if they switched to comparing each student against their own prior score (individual growth)? This would directly measure the change for each student, avoiding the band re-cutting issue. What might they lose?
  1.  **Simplicity & Categorization:** Percentile bands are simple to understand and report ("Band 2 pass rate is up 5%!"). They categorize students into groups that might align with resource allocation (like the support block). Tracking individual growth is more complex and doesn't naturally create these policy-relevant buckets.
  2.  **Focus on Relative Position:** The current system inherently measures progress relative to peers. Individual growth measures absolute progress against oneself. The district might value the relative benchmark.
  3.  **Handling Cohort Changes:** While individual growth handles the *pool* change better (each student is tracked), it still struggles if the *test* itself changes year to year, which the band system also ignores. The real loss might be the perceived loss of the "like with like" grouping based on peer comparison.

  Would the loss be real? It depends on the goals. For measuring the *program's effect on individual student progress*, individual growth is superior – it directly answers "Did *this* student improve more than expected?" For categorizing the current year's students into relative performance tiers for reporting or placement, bands still have a role, though fixed-score bands would be more transparent for tracking trends. The suppression rule (hiding bands <20 students) is likely a practical habit to avoid unreliable percentages based on tiny groups, sitting comfortably with any view but not core to the philosophy.

  In essence, the district's package presupposes that educational progress is best measured and judged by comparing how well the system performs *this year* with students occupying specific relative positions in the prior year's distribution, *compared to how it performed last year* with students in those *same relative positions*. It prioritizes this "like with like" relative-group comparison over absolute outcomes, overall rates, or tracking long-term individual mobility. This view makes the reversal possible and explains the different metrics used for different judgments. It doesn't necessarily contradict itself logically (snapshot vs. controlled progress measure), but it does potentially ignore the bigger picture of whether the entire student body's algebra ability is truly improving over the long term. The reliance on re-cut bands is fundamental to this view but creates the "bookkeeping" effect you sense, where improvement within bands can occur without necessarily lifting the whole system.
