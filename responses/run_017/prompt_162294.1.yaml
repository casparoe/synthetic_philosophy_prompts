prompt: |-
  I am a final-year doctoral candidate in philosophy, and next week I am presenting a work-in-progress chapter to a joint seminar of my department's philosophy of action group and the university's behavioural science group. The paper is provisionally entitled Present Bias Without Discounting: Why Hyperbolic Curves Do Not Explain Akrasia. What I need from you is a preparation sheet for the question period, not a defence of the view.

  The thesis I am defending is this. Hyperbolic (and quasi-hyperbolic) discounting is the wrong kind of thing to explain weakness of will. What a curved discount function can generate is diachronic inconsistency: an agent who at one time prefers the later larger good, and at a later time, when the smaller good has become immediate, prefers that instead. The reversal depends entirely on the two options standing at different temporal distances from the point of evaluation. But the paradigm cases of akrasia, on the standard Davidsonian picture, are synchronic: at the very moment of action the agent judges, all things considered, that A is better, and yet intentionally does B. Evaluate both options from a single point in time and any discount function multiplies equally dated consequences by a common factor, so the shape of the curve drops out and no reversal is produced.

  I concede that the quasi-hyperbolic model has one feature that survives this argument: the discontinuous present-tilt parameter, the beta that discounts everything not available now. My central claim is that beta is not a rate of time preference at all. A discontinuity at the present has no interpretation as discounting the future more steeply; it is better understood as sensitivity to mode of presentation. Perceptually present options are evaluated as if at temporal distance zero, irrespective of when their consequences actually arrive; merely imagined or described options are placed at their objective distance. I call this the presentation-sensitivity account. It carries a testable corollary: manipulations that make a future option perceptually vivid (photographs, physical samples, odours, virtual reality walkthroughs) should reduce present bias, and within the near range the size of the effect should be comparatively insensitive to the objective length of the delay. If the account is right, the practical moral shifts too: the remedy for weakness of will is not primarily pre-commitment or the bundling of choices, but the deliberate recruitment of perception in the service of the agent's own all-things-considered judgement.

  The audience is about fourteen people. Roughly half are philosophers of action: two work in the planning-theory tradition and treat intention as a distinct normative-explanatory kind, one is a neo-Aristotelian who thinks of continence and practical wisdom in terms of character rather than choice architecture, and two are general sceptics about whether dynamic inconsistency is a rational failing at all. The other half are behavioural scientists: one experimental economist who uses the beta-delta model and thinks of it as well-confirmed, one psychologist of intertemporal choice who works in a construal-level / psychological-distance framework, and a mixed group of graduate students who mostly want to know what experiment would settle it.

  Please give me the objections I should expect, ordered by how much damage they would do rather than by the order in which they are likely to be asked, and phrased the way each of these constituencies would actually phrase them rather than in my vocabulary. For each: a reply I could deliver in about two minutes, and an honest note on where that reply is soft or question-begging. Tell me separately what I should concede in my opening two minutes to disarm the room, which single reply has to land if the paper is to survive at all, and the one question I am quietly hoping nobody asks. Assume roughly twenty-five minutes of questions. Please write the sheet in British English, and do not pad it with references or suggestions for further reading: I know that literature, and I need the dialectic, not the bibliography.
reasoning: |-
  Okay, the user is a final-year doctoral candidate in philosophy preparing for a seminar presentation. They've shared their thesis on why hyperbolic discounting doesn't explain akrasia and need a preparation sheet for Q&A. Let me unpack this carefully.

  First, their core argument: they claim hyperbolic discounting explains diachronic inconsistency but fails for synchronic akrasia (where judgment and action conflict at the same moment). The key insight is that discount curves affect all future outcomes equally when evaluated from a single point, so they can't cause synchronic preference reversals. 

  Noticing their concession about the beta parameter in quasi-hyperbolic models—they argue it's not true time preference but sensitivity to perceptual presence. This is clever: it reframes present bias as about mode of presentation rather than temporal valuation. Their proposed "presentation-sensitivity account" has testable predictions about vividness reducing bias, which bridges philosophy and behavioral science effectively.

  Looking at their audience composition: half philosophers (planning theorists, neo-Aristotelian, skeptics) and half behavioral scientists (economist, psychologist, grad students). Each group will attack differently. The philosophers will challenge conceptual foundations—like whether synchronic akrasia even exists or if intention has normative force. The scientists will demand empirical tests or argue their models already account for this.

  For the prep sheet, they want objections ranked by damage potential, not likelihood. The nuclear threats would be:
  - Philosophers denying synchronic akrasia exists (undercuts the whole premise)
  - Economists showing beta-delta models already explain vividness effects (collapses their novelty)
  - Psychologists arguing construal-level theory absorbs their account (makes it redundant)

  The user's reply to the synchronic akrasia objection must land perfectly—perhaps by distinguishing between occurrent judgment and dispositional evaluation. If that fails, their thesis crumbles. 

  Quietly hoping nobody asks about the "all-things-considered judgment" being action-guiding—that's a minefield of folk psychology critiques. Should advise conceding early that hyperbolic models work for diachronic cases to build goodwill.

  The replies need to be concise (two minutes max) and in each group's jargon. For example: 
  - To planning theorists: frame perceptual recruitment as "intention scaffolding" 
  - To economists: translate vividness into "salience parameters" 
  - To grad students: propose VR delay-discounting experiments

  Must avoid padding with references per their request. British English phrasing like "undercut" instead of "undermine". Honesty about soft spots is crucial—their academic integrity depends on it.
answer: |-
  Here is your preparation sheet, structured by threat level with constituency-specific objections and concise replies. I've noted soft spots candidly and appended strategic advice at the end.

  ---

  ### **Catastrophic Threats (Would Fatally Undercut Core Thesis)**
  1. **Philosophy of Action Sceptic (Normative Kind View):**  
     *Objection:* "You presuppose synchronic akrasia is *possible*. But if intentions are distinct practical commitments – not reducible to occurrent judgements – then what you call 'akrasia' is just intention revision. No rational failure occurs when I re-evaluate *at t₁* what I judged best *at t₀*. Your 'single time-slice' model ignores agency’s diachronic structure."  
     → *Reply (2 min):* "I grant intentions have distinctive stability. But in paradigmatic akrasia (e.g., Davidson’s smoker), the agent *concurrently* affirms a practical judgement (e.g., 'I ought not smoke now') while acting against it. This isn’t diachronic re-evaluation – it’s a conflict *within* the synchronic practical standpoint. My account targets this tension, not intention dynamics."  
     → *Soft Spot:* Assumes Davidson’s description is authoritative. Doesn’t refute that "judgement" here may be inert belief, not active commitment.

  2. **Behavioural Economist (Beta-Delta Advocate):**  
     *Objection:* "Your 'presentation-sensitivity' is just beta in disguise! Beta *is* the perceptual immediacy parameter – it quantifies how visceral vs. abstract an option feels. Our VR experiments *already* show reducing temporal distance (via vividness) flattens discount curves. You’re renaming, not replacing, the model."  
     → *Reply (2 min):* "If beta were *only* about perceptual vividness, we’d expect its effect to diminish as delays increase. But under presentation-sensitivity, making a *distant* reward vivid (e.g., VR tour of retirement home) should reduce present bias *now* – even if delay is unchanged. Beta-delta treats 'now' as a temporal index; I treat it as a mode of access."  
     → *Soft Spot:* Conflates *causal mechanism* (vividness) with *normative account* (why it matters). Beta-delta can likely absorb this as a "salience" tweak.

  ---

  ### **Major Threats (Would Force Significant Retreat)**
  3. **Psychologist (Construal-Level Theorist):**  
     *Objection:* "Psychological distance (temporal/spatial/social/hypothetical) *already* explains your effects. Perceptual vividness just manipulates low-level construal. Your ‘presentation-sensitivity’ is a subcase of CLT – and CLT handles discounting *and* non-temporal biases (e.g., social empathy gaps). Why invent a new framework?"  
     → *Reply (2 min):* "CLT posits that distance triggers abstract processing. But in akrasia, the ‘near’ option is *concretely tempting* (e.g., cake’s smell) while the ‘far’ option is *concretely aversive* (e.g., gym’s effort). My account captures asymmetric sensitivity: perception hijacks evaluation *for temptations*, not virtues. CLT’s symmetry can’t explain why vividness reduces bias for rewards but not costs."  
     → *Soft Spot:* Risks ad hoc-ness. No clear evidence yet that vividness asymmetrically affects costs vs. rewards.

  4. **Neo-Aristotelian (Character Skeptic):**  
     *Objection:* "This is *techne* masquerading as *phronesis*. Your ‘perceptual recruitment’ is clever, but continence requires habituation – not VR goggles. You reduce virtue to a cognitive glitch, ignoring the agent’s history of choices that shape what they *perceive as salient* in the first place."  
     → *Reply (2 min):* "I agree character shapes perception. But my proposal is remedial: for an agent *already* committed to a judgement (e.g., ‘I value health’), perceptual tools can align motivation with that standing aim. This isn’t a full virtue theory – it’s a prosthesis for akrasia *given* a prior normative commitment."  
     → *Soft Spot:* Sidesteps how "standing aims" are sustained. May concede too much to decision-theoretic individualism.

  ---

  ### **Containable Threats (Would Limit Scope/Impact)**
  5. **Planning Theorist (Intention Normativist):**  
     *Objection:* "If synchronic akrasia exists, why call it ‘weakness of will’? Wills are planning capacities. An agent who acts against their own *plan* (e.g., abandoning a diet) exhibits diachronic failure. Your synchronic cases are just myopic preferences – no ‘will’ involved."  
     → *Reply (2 min):* "Respectfully, this redefines akrasia to exclude its classic instances (e.g., Medea). My account explains why synchronic conflict arises: perceptual salience disrupts evaluative integration. Even on planning views, agents need tools to *execute* intentions – perceptual recruitment serves that."  
     → *Soft Spot:* Definitional stalemate. Doesn’t engage planning’s normative force.

  6. **Grad Student (Experimentalist):**  
     *Objection:* "What test distinguishes your account from hyperbolic discounting + salience? If I run a delay-discounting task with VR vs. text descriptions, both predict less bias in VR. Where’s the unique signature?"  
     → *Reply (2 min):* "Crucially: under presentation-sensitivity, making a *future* option vivid should *immediately* reduce present bias for *competing* immediate options (e.g., VR of £100 in 1 week reduces temptation for £50 now). Hyperbolic discounting predicts no effect until delay shortens. Test this with fixed delays but varied vividness."  
     → *Soft Spot:* Assumes hyperbolic modellers won’t add salience effects post hoc (they will).

  ---

  ### **Strategic Addenda**
  - **Concede Early (First 2 Mins):**  
    "Hyperbolic discounting excellently explains diachronic inconsistency in preference. My target is narrower: its inability to resolve the *synchronic* puzzle of acting against one’s own all-things-considered judgement *at the moment of action*. I also grant beta-delta’s predictive success – I’m questioning its *interpretation*."

  - **Must-Land Reply (For Survival):**  
    **→ To the Philosopher Sceptic (Objection 1):**  
    *If this fails, your core phenomenon is denied.* Emphasise: "In akrasia, the conflict is experienced *at t* – the agent feels they are failing *by their own lights now*. Discounting can’t capture this because at *t*, all future outcomes are equally discounted."

  - **Question You Hope Nobody Asks:**  
    *"If ‘all-things-considered judgement’ isn’t action-guiding in akrasia, why call it ‘practical’ judgement? Isn’t it just idle belief?"*  
    → *Why it’s lethal:* Collapses Davidson’s distinction between unconditional and all-things-considered judgement. Reply requires contentious meta-ethics about judgement’s force.  
    → *Dodging Strategy:* "It’s *practical* because it integrates the agent’s reasons – its failure to motivate is what needs explanation. Perceptual salience disrupts the link." (Soft: Assumes internalism).

  ---

  **Format Note:** British English adhered to (e.g., "judgement", "vividness", "behavioural"). Replies are pared to essential dialectic; no hedging or citations. Total Q&A budget: ~6 objections + follow-ups. Focus energy on Catastrophic threats. Good luck.
