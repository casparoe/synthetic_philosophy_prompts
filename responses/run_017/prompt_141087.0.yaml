  **Checklist for Evaluating Monitoring Proposals**

  **Objective**: To determine whether to fund a proposed monitoring activity (e.g., sampling, modeling, pilot) that is intended to reduce uncertainty before a decision.

  **Instructions**: Proceed through the questions in order. At each step, if the answer meets the termination condition, stop and make the recommendation. If the answer requires handing back to the committee, stop and refer the proposal to the committee with a clear explanation of the unresolved issue.

  ---

  **Step 1: Non-informational consequences**
     - **Question**: Does the monitoring activity itself alter the physical, political, or institutional context in a way that reduces the set of future options or locks in a particular path? (Examples: exploratory drilling that commits to a site, a pilot that constituents will treat as permanent, design work that begins a project.)
     - **Adequate Answer**: 
          - If **NO**, proceed to Step 3.
          - If **YES**, proceed to Step 2.

  **Step 2: Modeling the combined action**
     - **Question**: Can we model the monitoring as part of a combined action (i.e., "do the monitoring and then choose an intervention in the altered state") and compare it to acting without monitoring?
     - **Adequate Answer**:
          - If **YES**, then define the combined action and its expected utility (including monitoring cost and any non-informational effects) and the expected utility of acting without monitoring. Then proceed to Step 5 (but note that Step 5 will compare the combined action to the alternative).
          - If **NO** (because the consequences are too complex or fundamentally change the decision problem), then **terminate and hand back to the committee** with the explanation: "The monitoring alters the decision context in ways that cannot be modeled; the committee must decide based on values and judgment."

  **Step 3: Committee updating behavior**
     - **Question**: Given the committee's known behavioral tendencies (anchoring on point estimates, partial updating, ambiguity aversion), can we model how the committee will update its beliefs in response to the monitoring results?
     - **Adequate Answer**:
          - If **YES**, incorporate this updating function into the analysis and proceed to Step 4.
          - If **NO** (because the updating is too erratic or we cannot predict how they will react to ambiguity), then **terminate and hand back to the committee** with the explanation: "The committee's updating behavior in response to the proposed monitoring cannot be modeled; the committee must decide based on their assessment of the value of the information given their own updating tendencies."

  **Step 4: Hypothesis space expansion**
     - **Question**: Is there a non-negligible chance that the monitoring will reveal a new mechanism or factor not previously considered, thereby expanding the set of possible states of the world?
     - **Adequate Answer**:
          - If **NO**, proceed to Step 5.
          - If **YES**, then:
              a) Can we model the expanded state space (assigning probabilities and utilities to the new states) and incorporate it into the analysis? If yes, proceed to Step 5.
              b) If we cannot model it (because the new states are too vague or we cannot assign utilities), then **terminate and hand back to the committee** with the explanation: "The monitoring may reveal unknown unknowns; the committee must decide based on their tolerance for this risk and the potential benefits of discovery."

  **Step 5: Expected value of information (EVI) or net benefit of combined action**
     - **Question**: Calculate the expected value of the monitoring strategy (adjusted for any non-informational consequences and non-Bayesian updating) and compare it to the alternative of acting without monitoring.
     - **Procedure**:
          a) Compute the expected utility of the best action without monitoring (call this EU_no_monitor).
          b) Compute the expected utility of the strategy "do the monitoring (if it has non-informational consequences, this step includes those) and then choose the best action after seeing the result and updating beliefs (using the updating function from Step 3 if applicable)". Subtract the cost of monitoring. Call this EU_with_monitor.
          c) EVI = EU_with_monitor - EU_no_monitor.
     - **Adequate Answer**:
          - If EVI > 0, then **recommend funding**.
          - If EVI <= 0, then **recommend not funding**.

  **Exceptions**:
     - If at any point the reliability of the monitoring method is the main point of dispute (so that there is no agreed likelihood function for the outcomes), then the analysis cannot proceed. **Terminate and hand back to the committee** with the explanation: "The reliability of the proposed monitoring is disputed and cannot be resolved technically; the committee must decide based on their assessment of the monitoring's reliability and their risk tolerance."
     - Budget constraints are not considered in this protocol; if the EVI is positive but the cost exceeds available funds, that is a separate consideration.

  ---

