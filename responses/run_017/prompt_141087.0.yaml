          EVI = -C (negative) -> do not fund.

      Argument to committee: 
          "The legislature has committed to rolling out the water-trading scheme statewide regardless of the pilot results. Therefore, the pilot will not change the decision to implement, and there is no evidence that it will lead to design changes. Thus, the pilot does not provide any actionable information that would improve the outcome. The only effect of funding the pilot is to incur its cost. We therefore recommend against funding."

      This argument is not pedantry; it is a direct consequence of the legislature's stance. The committee cannot justify spending public money on a pilot that will not change anything.

  **What the procedure cannot settle** (as per the last part of the query):

  - The procedure cannot resolve disputes about the reliability of the monitoring method (i.e., the likelihood function). In such cases, we hand back to the committee.
  - It also cannot settle when the monitoring reveals new states that we cannot model (Step 4) or when non-informational consequences are too complex (Step 2). These require committee judgment.
