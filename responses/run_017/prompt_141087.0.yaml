  **Proposal 1: Nutrient monitoring before plant upgrade vs. buyout**

  - Step 1: NO (purely informational) -> Step 3.
  - Step 3: We can model the committee's updating as partial (e.g., they will move only halfway from the prior to the data). We adjust the updating function accordingly. Proceed to Step 4.
  - Step 4: There is a chance the monitoring reveals new dynamics. We assign a small probability (e.g., 10%) to the event that we discover a new mechanism. If discovered, we assume we will need an additional year of research (costing $X) and then we will make a better decision. We model this by reducing the expected utility of the monitoring strategy by the expected cost of the delay and the research, but also by the expected gain from avoiding a bad decision. If we can model this, proceed to Step 5. If not, hand back. We proceed.
  - Step 5: 
      EU_no_monitor = max( EU(upgrade), EU(buyout) ) 
      EU_with_monitor = [expected utility after monitoring, with partial updating and accounting for the chance of a new mechanism] - cost of monitoring
      EVI = EU_with_monitor - EU_no_monitor
      If EVI>0, fund.

  **Proposal 2: Pilot of water-trading scheme (with legislature rolling out regardless)**

  - Step 1: YES (because the pilot is the first stage of the rollout and may lock in the scheme) -> Step 2.
  - Step 2: We try to model:
      Without committee funding: assume the pilot does not happen and the legislature rolls out without a pilot. Expected utility = U1.
      With committee funding: the pilot happens (cost C) and then the rollout happens. The pilot might lead to design adjustments? But the problem states the legislature will roll out regardless. If we assume the design adjustments are possible, then we can model the expected utility of the rollout after the pilot as U2 (which may be higher than U1 due to improvements). But note: the problem says "whatever the pilot shows" meaning the decision to roll out is fixed, but does it allow for design tweaks? Let's assume the legislature is fixed on the design too. Then U2 = U1. Then:
          Net benefit = U2 - C - U1 = -C.
      Since C>0, net benefit is negative. So we would not fund.
