prompt: |-
  i sit on our city's franchise commission — we decide who counts as a voter for municipal elections, and the charter lets us write our own rules, which already feels circular. Our track record:

  - green card holders, 10+ years here, pay city taxes: yes
  - commuters who work here and pay the city earnings tax but sleep in the suburbs: no
  - absentee owners of apartment buildings here, living abroad: no
  - people with no fixed address who sleep in city shelters: yes
  - out-of-state students in dorms here nine months a year: yes, if they register here
  - people held in the city jail, pre-trial or serving under a year: yes; a year or more: no
  - farmworkers on five-month visas in employer housing: no
  - 16 year olds: no

  New case, hearing is next week: Riverside, an unincorporated pocket of about 1100 people that the city completely surrounds. The county sheriff polices them, but they buy city water, their kids attend city schools under a contract, and roughly 300 of them work here and pay the earnings tax. The november ballot has both an annexation measure that would make them part of the city and the mayoral race. They've petitioned to vote.

  What should we do if we want to be consistent with ourselves — full ballot, annexation measure only, or nothing? Which of our precedents is actually the closest analog, and which rule are we implicitly running that fits all eight old verdicts: something like all-affected-interests, or being subject to the city's coercion, or being a stakeholder whose life is mainly lived here? Are there two rules that fit the old verdicts equally well but come apart on Riverside? Note that the "they pay the earnings tax" argument seems to be closed off by how we treated the commuters, unless there's a real difference there I'm missing. If we let them vote only on the annexation, are we committed to the demos being different for every single decision, and is that ad hoc or a defensible position? And what case should we put on the docket next to tell the surviving rules apart?
reasoning: |-
  Okay, the user is part of a city franchise commission and needs to decide on voting rights for Riverside, an unincorporated area surrounded by the city. They provided their track record of past decisions and want to be consistent. Let me start by listing their precedents again to see the patterns.

  First, green card holders with 10+ years and paying taxes can vote. Commuters who work and pay taxes but live elsewhere cannot. Absentee owners living abroad, no. Homeless in shelters, yes. Out-of-state students in dorms, yes if registered. Jail inmates: pre-trial or under a year, yes; over a year, no. Farmworkers on short visas, no. 16-year-olds, no.

  Riverside residents don't live in the city but use city services like water and schools. Some work in the city and pay earnings tax. The ballot includes annexation and mayoral race. They want to know if Riverside should vote on everything, just annexation, or nothing.

  Looking for consistency, the commuters were denied despite paying taxes, similar to Riverside's workers. But commuters don't use other services like schools or water. Maybe the key is primary residence and being subject to city governance? Green card holders and shelter residents are physically present long-term. Students are present most of the year. Jail inmates under a year are still connected. 

  Riverside isn't under city jurisdiction directly; sheriff is county. But they use city services via contracts. The annexation measure directly affects them, unlike the mayoral race. Precedents show that direct impact matters for specific votes? Not really; all previous decisions were about general voting eligibility, not per-issue.

  The closest analog might be the commuters, but Riverside uses more services. Or the absentee owners who pay property taxes but live abroad—denied. Riverside is physically present but in unincorporated land. 

  For consistency, if primary residence in the city is the rule, Riverside fails. But the shelter residents have no fixed address yet are allowed. So physical presence in the city matters, not just formal residence. Riverside is outside city limits, so maybe they shouldn't vote. But they're affected by annexation. 

  Allowing vote only on annexation is an exception. Is that defensible? The commission hasn't done per-issue voting before. But annexation uniquely affects them. The jail precedent has a time-based distinction, which is a bit like a conditional rule. 

  The user is worried about setting a precedent where the electorate changes per decision. They need a clear rule. Maybe the underlying principle is "subject to city's coercive power" or "primary life lived within city." Riverside isn't subject to city laws, so no vote except on annexation. 

  To test the rules, they could hear a case about short-term residents or commuters with kids in city schools. That might differentiate between physical presence and jurisdictional control.
answer: |-
  Based on your precedents and the need for consistency, here's a principled analysis:

  ### Recommendation for Riverside: **Vote on Annexation Only**
  **Why?**
  1.  **Consistency with Precedents:** Your decisions reveal an **implicit rule: "Subject to the city's full coercive jurisdiction and integrated into its daily life."**
      *   *Fits all precedents:*
          *   **Yes Cases (GC holders, shelter residents, students, short-term inmates):** Physically present within city boundaries long-term, subject to city laws/policing/services daily.
          *   **No Cases (Commuters, absentee owners, long-term inmates, farmworkers, 16yo):** Not physically integrated long-term within the city *or* not subject to its full jurisdiction (commuters/owners policed elsewhere, long-term inmates under state/fed, farmworkers transient/under federal rules, 16yo lack capacity).
      *   **Riverside Analogy:** They are **closest to *Commuters* or *Absentee Owners*.** Like commuters, many work/pay tax here but are *policed elsewhere* (county sheriff). Like absentee owners, they benefit from city services (water/schools) but *reside outside its jurisdiction*. They are *not* subject to the city's daily laws, policing, zoning, or ordinances. Annexation *would* change this.

  2.  **The "Earnings Tax" Distinction:** Your commuter precedent *explicitly* rejects "pays city taxes" as sufficient for voting. Riverside workers paying the tax is analogous, **not** a new argument. Annexation is fundamentally different – it's a vote *about their own status and jurisdiction*, directly determining if they will *become* subject to the city's full coercive power.

  3.  **Avoiding Circularity/Ad Hoc Decisions:** Granting a full ballot based on service usage or tax payment contradicts your commuter/owner precedents. Granting *no* vote ignores the unique, direct impact of the annexation measure *on them*. **Annexation-only voting is defensible as an exception because:**
      *   It's a *boundary decision* about who *becomes* part of the demos.
      *   The affected non-members have the most direct stake in the outcome.
      *   It aligns with democratic principles of self-determination for groups facing absorption.
      *   It's a specific, limited exception justified by the nature of the question, not a general "per-issue" demos. You wouldn't apply this to a zoning change or school funding vote.

  ### The Implicit Rule & Its Rival
  *   **Primary Rule Fitting Precedents: "Subject to Full City Jurisdiction & Integrated Life"** (Physical presence + subject to city laws/policing + sustained duration - see inmates/farmworkers). This emphasizes the *city's coercive power* over the individual.
  *   **Rival Rule: "Significant Life/Stake in the City"** (Pays taxes, uses services, works, kids in school). This emphasizes *impact/connection*.
      *   **Why it fits *most* but not *all*:** It explains Green Card holders, shelter residents, students, and *partially* commuters/Riverside. **BUT** it fails on:
          *   **Commuters:** Significant stake (work, tax) but denied.
          *   **Absentee Owners:** Significant stake (property, tax) but denied.
          *   **Short-Term Inmates:** Minimal stake/integration but allowed? (Here the "jurisdiction" rule is stronger).
      *   **Where they diverge on Riverside:** The "Stake" rule strongly suggests Riverside should vote (full ballot or annexation). The "Jurisdiction" rule suggests no full ballot.

  ### Testing the Rules: The Case to Docket Next
  To distinguish between "Subject to Jurisdiction" and "Significant Stake," schedule a case involving:
  **"Commuters whose children attend city schools (under a similar contract as Riverside) and who pay the city earnings tax."**

  *   **Why this case?**
      1.  Directly parallels Riverside's *service usage* (schools) and tax payment, but without residency.
      2.  Tests the core tension: Does significant stake/service dependence (like schools) outweigh lack of residency/jurisdiction? *Your commuter precedent currently says no.* This case pressures that.
      3.  Forces a clear choice:
          *   **If YES:** You shift towards a "Stake" rule (undermining commuter/owner precedents, strengthening Riverside's future case).
          *   **If NO:** You reaffirm the "Jurisdiction" rule as paramount (upholding commuter precedent, confirming Riverside annexation-only was correct).

  ### Key Arguments for Annexation-Only Decision
  *   **For Consistency:** "Our precedents grant voting rights based on being subject to the city's full governance. Riverside residents are not. However, the annexation vote uniquely determines *whether they will be brought under that governance*. Allowing them a voice on that specific question respects democratic principles without undermining our core jurisdictional standard for general elections."
  *   **Against Full Ballot:** "Granting Riverside residents the right to elect *our* mayor, while they live under the county sheriff's jurisdiction and lack the daily rights/responsibilities of city residents, violates the principle established with commuters and absentee owners: paying taxes or using services does not, by itself, constitute membership in the polity. They do not share the full burdens or benefits of citizenship *yet*."
  *   **Against No Vote:** "While not current members, the annexation decision impacts Riverside residents more directly and fundamentally than any other voters. Denying them any voice on the question of their own incorporation is unjust and undermines the legitimacy of the process."

  **Conclusion:** Voting on annexation only is the most consistent and defensible position. It respects your historical reliance on jurisdictional presence while making a narrow, principled exception for a vote directly determining jurisdictional boundaries. Schedule the "Commuters with Kids in City Schools" case next to rigorously test the underlying rule.
