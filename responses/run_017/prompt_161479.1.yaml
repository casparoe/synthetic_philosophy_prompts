  The user wants the two refrains to represent the key conditions: each voter being more likely than not to be right, and voter independence. The poem should show how majority accuracy increases as the jury grows larger but then collapses when independence is violated. It should capture that knife-edge at 50% where adding voters doesn't help.

  For the form, I think a villanelle works best here. Its repeating refrains naturally embody the constant conditions, and the closing quatrain where both refrains meet creates the perfect moment for the volta (the turn) when independence fails. A sestina might capture circularity in dependence, but the villanelle's tighter structure better serves the theorem's binary conditions and the dramatic collapse.

  I'll craft the poem with the refrains: "Each must be more than half inclined toward true" for competence, and "They must not hear the signal passing through" for independence. The opening tercets build the convergence with narrow margins (51%, hundreds of voters), then show the collapse when they start listening to each other. The final stanza reveals how the crowd becomes an echo chamber.

  The prose explanation will clearly identify which refrain corresponds to which condition and point to the exact line where independence fails ("they heard the first voice call"). This stays within the 300-word limit while fulfilling all the poetic and philosophical requirements.
answer: |-
  ## Verdict

  A hundred minds, more right than wrong, combine,  
  Each must be more than half inclined toward true,  
  To find the signal in the tangled sign.  

  With fifty-one in hundred chance, a thin  
  But steady light breaks through the doubtful hue,  
  A hundred minds, more right than wrong, combine.  

  Alone they stand, a solitary line,  
  They must not hear the signal passing through,  
  To find the signal in the tangled sign.  

  The number swells, a strengthening design,  
  The chance of error fades, a falling dew,  
  A hundred minds, more right than wrong, combine.  

  Five hundred strong, the doubtful stars align,  
  Certainty nears, the false perspective flew,  
  To find the signal in the tangled sign.  

  But then... a murmur, soft at first, benign,  
  Then loud – they heard the first voice call, they knew  
  A hundred minds, more right than wrong, combine,  
  They must not hear the signal passing through.  

  The crowd becomes an echo, thin and spent,  
  No wiser than the one voice they obeyed.  
  They must not hear the signal passing through  
  To find the signal in the tangled sign.  
  Each must be more than half inclined toward true,  
  But half, or less, brings only doubt anew.  

  ---

  The refrain "Each must be more than half inclined toward true" renders the competence condition; "They must not hear the signal passing through" renders the independence condition. The collapse occurs at "But then... a murmur, soft at first, benign, / Then loud – they heard the first voice call, they knew", where the violation of independence ("hearing the signal") destroys the majority's epistemic power.
