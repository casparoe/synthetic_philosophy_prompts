answer: |-
  ### Brainstorming
  Objections: QTL confuses predictive accuracy with truthlikeness; it's instrumental, not epistemic. Tolerance thresholds are arbitrary, inviting manipulation. R2 and R3 conflict: tightening tolerances (R2) may alter rankings, violating R3 under reparametrization. Finitude blocks collapse but invites "gaming" by excluding hard queries. Weighted sums inject pragmatic values, divorcing truthlikeness from truth. Is normalized error a likeness measure or just error? Estimability (R4) risks overfitting to Q, not truth. Distinctions: Truthlikeness vs. empirical adequacy; global vs. local approximations; epistemic vs. pragmatic virtues. Rejected: Dismissing QTL as "not philosophy"—it addresses real-world constraints, but may forfeit realism.

  ### Implications of Collapse Results and Likeness Turn for QTL

  **1. QTL replaces truthlikeness with purpose-relative utility.**  
  The dominance condition and weighted sum prioritize fitness to operational targets over truth-directedness. By capping errors at tolerances and weighting by stakes, QTL operationalizes "closeness" as decision-reliability, not verisimilitude. This pragmatizes the axiological problem: truthlikeness collapses into predictive success on curated queries, fulfilling the agency’s need for extrapolation-licensing but abandoning the realist’s ambition that truthlikeness explains *why* models predict well. Truth becomes a silent partner; work is done by the pragmatics of the query set.

  **2. Language dependence transmutes into metric and tolerance dependence.**  
  R2 (refinement-stability) and R3 (reparametrization invariance) are incoherent under pressure. Reparametrization (e.g., stage to discharge) nonlinearly transforms errors, violating R3 if tolerances are unit-specific. Meanwhile, splitting queries (R2) can invert rankings unless tolerances scale perfectly—unlikely without ad hoc adjustments. Thus, dependence shifts from language to the structure of metrics (e.g., Euclidean vs. Manhattan distance in error space) and tolerance granularity. The collapse objection resurfaces as sensitivity to *how* we coarse-grain reality into measurable queries.

  **3. Epistemological tractability is achieved by sacrificing truth-aptness.**  
  QTL is estimable (R4) precisely because it reduces truthlikeness to empirical accuracy on finite Q. Cross-validation estimates comparative performance, not truth proximity. When models are tuned to Q, "progress" indicates better optimization to the query-constrained *appearance*, not deeper truth-correspondence. This risks epistemic circularity: if truthlikeness is defined by Q-performance, estimating it from data conflates evidence with definition. Truthlikeness becomes a label for instrumental reliability.

  **4. Realism’s "approximate truth" collapses into localized structural reliability.**  
  QTL cannot bear realism’s explanatory burden. Realists argue mature theories are globally truthlike, explaining their success across *novel* domains. But QTL restricts "closeness" to pre-specified queries, making it consistent with models being radically false outside Q. This reverts to structural realism’s claims about model-world relations (e.g., shared equations) or even empiricist "saving phenomena," as truthlikeness is fragmentary. The agency’s extrapolation-license relies on Q-completeness, not truth.

  **5. The logical problem now centers on justifying the distance metric.**  
  With collapse blocked by finitude, the core challenge shifts to defending the likeness structure implicitly imposed by normalized errors. Each query’s capped error ratio presumes a linear likeness metric over states (e.g., ±5cm is equally similar across water levels), which is ontologically substantive. Progress requires grounding these metrics in the target system’s physics—not decision stakes—to avoid conventionalism. QTL outsources this to domain experts, but without metaphysical justification, it remains pragmatic.

  **6. Refinement-stability (R2) is a mirage without ontological grounding.**  
  Splitting queries (e.g., peak level → peak level and rate of rise) or tightening tolerances can reverse rankings if errors distribute unevenly. R2 demands this only "where resolution is doing work," but this is vacuously satisfiable unless tied to system complexity. Without an independent account of natural gradation (e.g., fundamental scales in hydrology), R2 invites arbitrariness, echoing the language-dependence problem in new form.

  **7. Weighted sums entangle epistemic and practical values irrevocably.**  
  The cardinal fallback explicitly weights errors by stakes (e.g., inundation area > time-to-peak). This conflates truthlikeness—which should be objective—with contextual values. While useful for decisions, it severs QTL from truth: a model "closer" by weighted sum may be less accurate on truth-relevant but low-stakes queries. Collapse is avoided, but axiological purity is lost; truthlikeness becomes instrumental.

  ### Load-Bearing Assumption
  The critical undefended assumption is that **minimizing normalized error over a finite query set constitutes progress toward truth**, rather than toward mere empirical adequacy or utility. This assumes that (a) Q comprehensively samples the truth-relevant structure of the system, and (b) the error metric (linear, normalized, capped) faithfully represents "likeness" to the actual state. Yet Q is curated for decisions, not truth; tolerances are set by practical limits, not ontological joints; and the error metric is Euclidean by default, lacking physical justification. Without defending these, QTL measures fitness-for-purpose while borrowing the label "truthlikeness."

