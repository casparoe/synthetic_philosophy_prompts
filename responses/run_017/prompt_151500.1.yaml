  - Within-group ≠ between-group (step 3) requires hammering home that the suburban/district gap example is biologically meaningless.  
  - The vendor case (BrightPath) will likely die at step 5—9% PGS variance is useless for individual placement.  
  - Their own district's embarrassing "leaving genetic potential on table" claim fails catastrically at step 3 (ecological fallacy) and step 6 (misinterpreting shared-environment estimates).  

  For the one-sentence summary, I'll avoid technical terms: "Heritability estimates describe variation within a specific population at a specific time; they cannot predict individual potential, explain group differences, or measure how much environments can change outcomes."  

