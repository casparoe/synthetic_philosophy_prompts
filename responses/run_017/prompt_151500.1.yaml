  The personal angle matters here. Their frustration about their daughter's reading placement suggests they've seen firsthand how these misinterpretations affect kids. They're not just asking for stats—they want armor against bad science that could harm students.  

  For the triage procedure, I'll structure it as a flowchart with kill criteria (red), judgment zones (yellow), and pass-throughs (green). Each step needs:  
