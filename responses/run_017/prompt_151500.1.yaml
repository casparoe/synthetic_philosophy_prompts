  - Steps 1-4 are rock-solid statistics  
  - Step 5 (rGE) is well-established but often ignored  
  - Step 6 (shared environment) has nuance—if siblings share classrooms, "shared environment" estimates actually capture neighborhood effects, not schools  
  - The breeder's-equation point (step 4b) is technical but crucial for vendor claims  

  Final reality check: This won't fix deep misunderstandings. If a board member believes genes=destiny, the procedure can only say "this claim is false," not change minds. But it will keep bad science out of official documents.
answer: |-
  Here's a triage procedure for heritability claims, designed for efficiency and clarity. It progresses through **7 core questions**, with explicit "Stop" criteria and judgment flags. I'll then apply it to your cases and provide the requested summary.

  ---

  ### **Triage Procedure for Heritability Claims**
  **Run these steps in order. Stop if any "Stop" criterion is met.**

  1.  **"Is this a *within-population* estimate for a *specific population* at a *specific time*?"**
      *   *Sufficient Answer:* Yes, and the population/time is clearly stated or reasonably inferred (e.g., "US twins born 1990-2000").
      *   *Stop If:* Claim is about differences *between* groups (e.g., districts, races) or implies timeless/universal truth without specifying a population. **This kills most between-group inferences.**
      *   *Judgment Call:* Assessing if the cited population is sufficiently similar to yours. (Mark as Yellow Flag 🟡).

  2.  **"Does the claim acknowledge that heritability (*h²*) depends on *environmental variance*?"**
      *   *Sufficient Answer:* Explicit mention that *h²* increases if environmental variance *decreases* (and vice versa), or that the estimate is context-dependent.
      *   *Stop If:* Claim treats *h²* as a fixed property of the trait itself (e.g., "Reading is 60% genetic"). **This kills claims ignoring environmental dependency.**
      *   *Arithmetic Core:* *h² = Vg / (Vg + Ve)*. If Ve shrinks, *h²* rises even if Vg is unchanged. No judgment needed on this mechanism.

  3.  **"Is the claim confusing *within-group* heritability with *between-group* differences?"**
      *   *Sufficient Answer:* Clear statement that high within-group *h²* says *nothing* about the cause of average differences *between* groups (which could be 100% environmental).
      *   *Stop If:* Claim uses a high within-group *h²* to infer genetic causes for a between-group difference (e.g., "District A has lower scores than B, and *h²* is high, so genes explain the gap"). **This kills ecological fallacies.**
      *   *Core Principle:* The "Within-Group Heritability ≠ Between-Group Cause" fallacy is well-established genetics/statistics.

  4.  **"Is the claim being misapplied to *individuals*?"**
      *   *Substep A (Variance Explained):* If *h²* is used as "variance explained," ask: **"Does the claim imply a high *h²* means an individual's outcome can't change?"**
          *   *Sufficient Answer:* Explicit statement that *h²* describes population variation, not individual immutability. High *h²* is compatible with large environmental effects *for an individual*.
          *   *Stop If:* Claim states or strongly implies that a trait is "fixed" or "unchangeable" for individuals due to high *h²* (e.g., "Low group placement is genetic"). **This kills determinism.**
          *   *Core Principle:* *h²* is a population statistic; individual outcomes result from GxE interplay.
      *   *Substep B (Breeder's Equation):* **"Is the claim invoking heritability to predict *response to selection/intervention* (R = *h²*S)?"**
          *   *Sufficient Answer:* Explicit mention of selection differential (S) or intervention change.
          *   *Stop If:* Claim uses a "variance explained" *h²* estimate to directly predict intervention effects *without* specifying S. **This kills misuse of static estimates for dynamic predictions.**
          *   *Judgment Call* 🟡: Is the cited *h²* actually estimated *for* selection response? (Often it's not).

  5.  **"Is there likely *gene-environment correlation (rGE)*?"**
      *   *Sufficient Answer:* Acknowledgement that genetic propensities can *shape* environments (e.g., a child prone to reading seeks out books, elicits teacher attention), meaning "environmental" levers might still affect a heritable trait.
      *   *No Stop, Just Flag* 🟡: High rGE means observed *h²* might partly reflect environmental pathways *triggered* by genes. This undermines "genetic = unchangeable" but doesn't inherently kill a claim. Flag for nuanced interpretation.

  6.  **"If shared environment (c²) estimate is near zero, is it misused to claim 'schools don't matter'?"**
      *   *Sufficient Answer:* Recognition that "shared environment" (c²) in twin/adoption studies typically measures *between-family* effects (e.g., parental SES, neighborhood, *sometimes* school district). It often *does not* capture *within-family* differences like teacher quality or classroom effects.
      *   *Stop If:* Claim uses low c² to argue that *school-specific factors* (teachers, curriculum, class size) are ineffective. **This kills misuse of c² for school effects.**
      *   *Core Principle:* Siblings often share a school *district* but not specific classrooms/teachers. Low c² ≠ "schools don't matter."

  7.  **"Is the estimate *actionable* and *relevant* for our specific decision?"**
      *   *Judgment Call* 🟡: Even if the claim passes Steps 1-6, ask: Does this number *actually* inform the proposed policy/vendor purchase/budget cut? Is it the *best* evidence? Does relevance outweigh ethical concerns (e.g., stigmatization)? Requires human judgment.

  ---
  **Procedure Outputs:**
  *   **Stop (Red):** Claim is statistically invalid. Do not proceed. Document reason(s) from Steps 1-6.
  *   **Yellow Flag(s) (🟡):** Claim has limitations requiring nuanced interpretation or human judgment (Steps 1, 4B, 5, 7). Proceed with extreme caution; document flags.
  *   **Pass (Green):** No fatal flaws identified. Can proceed *if* judgment in Step 7 supports it.

  **What This Can't Do:**
  *   Resolve fundamental debates about the interpretation of heritability (e.g., philosophical views).
  *   Prove causality; heritability estimates are correlational.
  *   Fully assess the quality of the *original study* (design, measurement, bias) – assume it's adequate unless obvious flaws.
  *   Make the ethical/value judgment in Step 7 *for* you.

  ---
  ### **One-Sentence Summary for Board Packets**
  > "Heritability estimates describe genetic contributions to trait variation *within* a specific population at a specific time; they do not measure how much a trait can change for individuals or groups, explain differences between populations, or determine the effectiveness of interventions."

  ---
  ### **Application to Your Cases**

  1.  **BrightPath Reads Vendor (Reading Screener Pilot - $200k)**
      *   **Step 1:** Likely PASS (assume within-population estimate cited).
      *   **Step 2:** STOP. Vendor implies reading's "60% heritability" is a fixed property ("reading is... sixty percent heritable"), ignoring environmental dependency. **KILLED at Step 2.**
      *   *(Even if passed Step 2):* **Step 4A:** Their use for *individual* placement based partly on PGS (9% variance!) risks deterministic interpretation. YELLOW FLAG 🟡. **Step 4B:** They use "variance explained" *h²*, not breeder's equation. YELLOW FLAG 🟡 if implying intervention efficiency. **Step 5:** Strong rGE likely (kids who read better get more practice/help). YELLOW FLAG 🟡. **Step 7:** 🟡 Big Judgment: 9% PGS variance is tiny for individual placement; high risk of misclassification/inequity. Cost/benefit likely poor.
      *   **Verdict:** **STOP at Step 2.** Claim misrepresents heritability as immutable. Even if argued past, significant 🟡 flags and poor Step 7 judgment make this untenable.

  2.  **Board Member: Twin Study → "Literacy Budget Can't Move Achievement / Gap Must Be Genetic"**
      *   **Step 1:** PASS (Twin study = within-population).
      *   **Step 2:** STOP on "Budget can't move achievement". Board member implies high *h²* means immutability. **KILLED at Step 2 (Determinism).**
      *   **Step 3:** STOP on "Gap must be genetic". Uses within-group *h²* to infer cause of between-group difference. **KILLED at Step 3 (Ecological Fallacy).**
      *   **Verdict:** **STOP (Multiple Reasons).** Both key assertions are fundamental statistical fallacies.

  3.  **Your Office's Past Claim: "District h²=0.7 vs Suburb h²=0.4 → Leaving More Genetic Potential on Table"**
      *   **Step 1:** PASS (Implies within-district estimates).
      *   **Step 2:** YELLOW FLAG 🟡. Doesn't explicitly acknowledge env. variance, but focus is on the *difference*.
      *   **Step 3:** STOP. **This is the ecological fallacy *in reverse*.** It uses *within*-group estimates (District *h²* = 0.7, Suburb *h²* = 0.4) to make an inference about the *cause* of the *between*-group difference in outcomes ("leaving potential on the table"). A higher *h²* in District suggests *less* environmental variance *within* the District compared to the Suburb. It says *nothing* about why the District's *average* score is lower or whether "potential" is being left unused. The conclusion assumes that lower environmental variance (*higher h²*) implies *worse* environments, which doesn't necessarily follow. **KILLED at Step 3.**
      *   **What Could Have Been Said (Honestly):** "The higher heritability estimate within our district (0.7 vs. 0.4 in the suburbs) suggests that environmental factors relevant to reading development are *less varied* across our students compared to students in the suburban district. This could indicate more uniform challenges or supports within our district. It does not directly tell us about the district's average performance level or the specific effectiveness of our programs compared to the suburbs."

  ---
  ### **Confidence Notes**
  *   **Core Arithmetic/Logic (High Confidence):** Steps 1, 2 (mechanism), 3, 4A, 4B (distinction), 6. These are fundamental statistical and quantitative genetics principles.
  *   **Interpretation Nuance (Moderate Confidence, Established but Often Ignored):** Step 5 (rGE implications), Step 6 (specific meaning of c²). The *existence* of rGE is uncontroversial; its *magnitude and implications* for specific traits require evidence but the core point stands.
  *   **Judgment Calls (Your Expertise + Context):** Step 1 (similarity), Step 4B (is *h²* appropriate type?), Step 5 (how relevant is rGE?), Step 7. These rely on your stats background and district knowledge.
  *   **Guessing Field Reaction:** The field would broadly agree on Steps 1-4, 6. Step 5 (rGE) is accepted, but its prominence in critiques varies. The biggest debates are often philosophical/political (Step 7), not technical.

  **Screening claims is ABSOLUTELY the right thing to do.** Heritability estimates are among the most misused statistics in social science. This procedure targets the most common and consequential misinterpretations. All three of your cases are perfect examples of claims this procedure *can* and *should* settle (as invalid). The "personal bit" highlights exactly why rigorous screening matters – these misinterpretations directly impact real children and resource allocation.
