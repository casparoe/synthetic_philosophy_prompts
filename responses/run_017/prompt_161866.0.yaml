answer: |-
  Your examples capture a fascinating and under-discussed phenomenon in the epistemology of assertion. This isn't just "proper sourcing" or "expertise" in a simple sense; it points to a **distinct norm of discursive responsibility or justificatory authority**. While it intersects with knowledge, truth, and belief norms, it targets a different dimension: the speaker's *position* to undertake and discharge the *justificatory commitments* inherent in making an assertion within a specific epistemic community.

  Here's a breakdown of the concept, its nature, and its edges:

  1.  **The Core Norm: The Discursive Responsibility Norm (or Justificatory Authority Norm)**
      *   **Essence:** When you assert P in a context, you don't merely report a fact; you *undertake a commitment* to defend P, to answer challenges, to explain its implications, and to justify it if required *within the norms of that specific discursive context*. The criticism in your examples stems from the speaker's perceived inability to *discharge* these commitments *themselves*.
      *   **Distinctness:** This norm is distinct from:
          *   **Truth Norm:** The proposition *was* true in all cases.
          *   **Belief Norm:** The speakers *did* believe the propositions.
          *   **Knowledge Norm:** The speakers arguably had evidence sufficient for knowledge (especially the technician and colleague citing the established result *after* naming the source). The criticism wasn't "You didn't know it," but "You aren't the one *positioned* to assert it *here*."
          *   **Evidence Norm:** Their evidence *was* objectively good (especially the technician's). The criticism wasn't about the *quality* of their evidence *per se*, but about their *relationship* to that evidence and their ability to *deploy* it discursively.
      *   **Nature:** It's best understood as **a genuine norm of assertion, specifically a social-epistemic norm governing participation within an epistemic community.** It governs *who* is licensed to make *which* claims *in which* forums. It's deeply intertwined with:
          *   **Epistemic Authority:** Who is recognized as having the standing to speak for a particular domain or piece of knowledge.
          *   **Intellectual Character/Virtue:** It relates to virtues like intellectual humility, transparency, and responsibility. The criticized speakers were seen as lacking the standing character or context-appropriate disposition to make *that* claim *themselves*.
          *   **Norms of Inquiry:** It reflects the community's standards for how knowledge is generated, vetted, and disseminated. Asserting without the ability to defend violates the implicit social contract of collaborative inquiry.

  2.  **Why This Norm Exists & Its Function:**
      *   **Maintaining Epistemic Health:** It prevents the uncritical propagation of claims ("Chinese whispers"). It ensures assertions can be challenged and probed *in the moment* within the community.
      *   **Assigning Responsibility:** It clearly marks who bears the primary responsibility for the claim's justification. This is crucial for efficient division of cognitive labor and trust.
      *   **Gatekeeping & Community Standards:** It reinforces the community's standards for what counts as adequate mastery or engagement with a topic. It distinguishes mere reporting from understanding.
      *   **Facilitating Deeper Discourse:** It ensures assertions can be the starting point for meaningful discussion, extension, or critique, which requires the asserter to be able to engage with the content.

  3.  **Exploring the Edges:**
      *   **Why Naming the Source Discharges It:** Naming the source transfers the justificatory burden. The asserter now says, effectively, "I am reporting the finding of X, who *is* recognized as having the justificatory authority on this matter. Challenge *them*, or accept their authority." The asserter takes responsibility *for accurately reporting the source*, not for the source's justification. This is sufficient in contexts where the source *is* accepted as authoritative within that community (like the neighbouring field result).
      *   **Does it Admit of Degrees? Absolutely.**
          *   **Depth of Understanding:** The postdoc (only abstract) has minimal ability to defend compared to someone who read the paper, or the author themselves. The technician understands the *how* (running the assay) but not the *what* (what it measures). A deeper understanding allows for more robust defense against more sophisticated challenges.
          *   **Context:** The required level of justificatory capacity varies. A quick update in a lab meeting demands less than a seminar presentation or a paper submission. Asserting a fundamental tenet requires less immediate defense than asserting a novel or controversial claim.
      *   **Why Audience Matters (Specialists vs. Journalists/Students):**
          *   **Specialists:** Share a vast background of tacit knowledge, methodological assumptions, and recognized authorities. They can often "fill in the blanks" or know *who* to challenge without needing the immediate asserter to justify everything. The norm relaxes because the *community* holds the justificatory resources collectively. They often know the source implicitly.
          *   **Journalists/Students:** Lack the shared background and recognized authorities. They rely *entirely* on the speaker's word and position. The speaker *must* be able to justify the claim *themselves* or explicitly invoke a recognized authority, as they cannot be expected to know where the burden lies otherwise. The journalist/student needs the speaker to *be* the authority or clearly point to it. They are also less equipped to evaluate the source's credibility independently.
      *   **The Device Case (AI/Instrument Spouting Truths):**
          *   **The Norm Doesn't Apply (Strictly):** Devices aren't members of the epistemic community; they are *tools used by* members. We don't hold a mass spectrometer responsible for justifying its output; we hold the *operator* or *interpreter* responsible for understanding what it measures, its limitations, and its calibration. The operator asserts "The assay result is X" *using* the device as evidence. The operator must be able to justify the *use* and *interpretation* of the device.
          *   **Simulated Responsibility:** If an AI *simulates* understanding (e.g., generates plausible-sounding justifications it doesn't truly comprehend), it might *appear* to satisfy the norm superficially in low-stakes contexts. However, under scrutiny, its inability to genuinely engage discursively (handle novel counterarguments, understand implications contextually) would reveal the lack of true justificatory authority. The responsibility would ultimately fall back on the humans deploying the AI.
          *   **Shifting Responsibility:** Assertions based *solely* on device output often require an implicit or explicit caveat: "According to Instrument X...". This shifts the justificatory burden to the instrument's design, calibration, and the user's competence in operating it. The human asserter takes responsibility for the *reliability of the process*, not the content itself in the same way an author would.

  **In Conclusion:**

  You've identified a crucial **Discursive Responsibility Norm** or **Justificatory Authority Norm**. It's a genuine, distinct social-epistemic norm governing assertion within collaborative or critical epistemic communities. It demands that an asserter possesses not just true belief or even knowledge, but the *position* and *capacity* to discharge the justificatory commitments inherent in making that assertion *in that specific context*.

  *   **Core:** It's about the ability and standing to answer for the claim.
  *   **Distinction:** It supplements truth, belief, and knowledge norms by focusing on the speaker's *relation* to the claim and the community.
  *   **Discharge:** Naming a recognized authoritative source transfers the core justificatory burden.
  *   **Degrees:** Required capacity varies with depth of claim and context.
  *   **Audience:** Relaxes among specialists with shared background/tacit authorities; intensifies with non-specialists who rely solely on the speaker.
  *   **Devices:** The norm applies to the *human users* interpreting and deploying the device's outputs; the device itself is a tool, not a responsible asserter.

  This norm is fundamental to the practice of science and rigorous scholarship, ensuring that claims aren't just true but are integrated into a web of understanding and accountability within the community. Your examples perfectly illustrate its operation in real-world scientific discourse.
