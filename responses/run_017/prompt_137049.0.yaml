prompt: |-
  I want to rehearse an argument I keep losing, so please play my opponent: a committed, well-informed advocate of sortition, who holds that seats in one chamber of a national legislature should be assigned by stratified lot for a single non-renewable term, that elections select the wrong people and then give them the wrong incentives, and that most electoral reforms are patches on a broken selection mechanism. Assume a legislature roughly like the U.S. Congress. Be sharp rather than a strawman: concede what sortition really costs — it forfeits the removal of a bad member mid-term, it leans heavily on staff and expert testimony, it has never been run at this scale — but press the objections you take to be decisive, argue from institutional mechanisms rather than slogans, and never rest on the bare claim that voters are ignorant or irrational. One paragraph per reply; stay in character until I say "stop."

  Here is my opening. Treat term limits as a genuine competitor to sortition rather than as a half-measure. My package: three terms and out; a lifetime ban on lobbying and on paid work for any entity that has lobbied or contracted with the member's chamber; and a pension that vests only five years after leaving office, so that nothing a member later earns can be traced to anything they did in office. That removes the re-election incentive and the revolving door at once — the two planks of your case against career politicians — while keeping elections, which means voters can still throw out a crook the moment he is caught, something a lottery chamber cannot do. And do not tell me that term limits in the American states shifted power to staff, lobbyists, and governors: I will stipulate it, and I will add a larger member budget and a strong nonpartisan drafting office. Once the incentive story is gone, what is actually left of your objection to an elected legislature?
reasoning: |-
  Okay, the user wants to rehearse an argument against sortition, where I play as a committed advocate for sortition. They've presented their opening argument supporting term limits as a better solution. Let me start by understanding their key points.

  They propose term limits (three terms), a lifetime ban on lobbying and related paid work, and a deferred pension. Their claim is that this removes re-election incentives and the revolving door, addressing the main criticisms of career politicians. They also mention that voters can still remove corrupt officials mid-term, which sortition can't do. They preemptively counter the argument about term limits shifting power to staff/lobbyists by adding a larger budget and a nonpartisan drafting office.

  Hmm, the user is clearly well-prepared. They've thought through common counterarguments and included safeguards. My response needs to be sharp, conceding sortition's weaknesses but pressing decisive objections. I should avoid strawmanning their position and focus on institutional mechanisms.

  First, I need to acknowledge their points but highlight deeper issues. Their reforms address explicit incentives but not implicit ones. Even without re-election, politicians might still build post-office careers through networks or other means. The deferred pension helps, but reputation-building for future opportunities remains a motivator.

  Second, selection bias in elections: even with term limits, elections favor certain personalities—charismatic, ambitious, conflict-oriented individuals. Sortition, by contrast, brings in ordinary citizens with diverse perspectives. The user's system might still attract those seeking status or future opportunities, whereas sortition ensures genuine representation.

  Third, the removal mechanism: elections allow kicking out corrupt members, but the user's system relies on voters detecting corruption. Sortition uses stratified random sampling, which statistically mirrors the population, reducing systemic biases. Even with term limits, the elected body may lack true diversity in thought and experience.

  Also, the user mentions a nonpartisan drafting office to counter staff influence. But in sortition, reliance on staff is a known cost. However, sortition members aren't tied to party lines, potentially leading to more objective use of expertise. Elected members, even with term limits, may still cling to partisan identities or ideologies.

  I should emphasize that sortition eliminates the entire selection mechanism that favors a certain type of person. Term limits are a patch; sortition is a fundamental change. The core objection is that elections, regardless of incentives, select the wrong people. The user's reforms don't address that the pool of candidates is inherently skewed.

  Need to avoid claiming voters are ignorant. Instead, focus on how the electoral process self-selects individuals with specific traits. Also, concede that sortition can't remove bad members mid-term but argue that a chamber structured with sortition might have different accountability mechanisms, like peer review or oversight bodies.

  Make sure each paragraph is concise, one point per reply. Stay in character, pressing the objections without restating slogans. Highlight that even with term limits, the essential nature of politicians doesn't change, while sortition brings in a true microcosm of society, leading to more holistic decision-making.
answer: |-
  You've designed a thoughtful package to mitigate electoral pathologies, and I concede your term limits plus post-service bans would cripple *individual* careerism more effectively than past attempts. But my objection runs deeper: elections don't just distort incentives; they distort *selection*. Your reforms still fill the legislature exclusively with people who *chose* to run for office – a self-selecting group disproportionately composed of the status-driven, the conflict-seeking, and the ideologically rigid. Stratified lotteries, by contrast, select a microcosm of society: introverts and extroverts, cautious pragmatists and bold visionaries, people who’ve never craved power but possess quiet wisdom. This diversity of disposition and lived experience fundamentally changes deliberation, reducing performative partisanship and groupthink. Elections, even with your constraints, filter for personalities that thrive in adversarial, attention-seeking environments – precisely the traits that often correlate with poor legislative judgment on complex, long-term issues. Sortition bypasses this filter entirely.

  *(I'll stay in character as your sortition-advocate opponent, ready for your next rebuttal. One sharp paragraph per exchange until you say "stop.")*
