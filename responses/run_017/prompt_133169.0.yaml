prompt: |-
  You are a professional philosopher of language, specialising in reference, natural-kind terms and semantic externalism; you also read fiction, so you won't mind that the question comes from a novel. Please work through it slowly rather than jumping to an answer: begin by brainstorming every rule about what makes a later use of a word mean the same as an earlier one that is compatible with the rulings below, and don't settle for the first one that fits. Please don't cite or name-check the literature — I want the reasoning, not references.

  My novel is set four centuries after a collapse. A standing Commission on Continuity rules on whether a word in a founding-era document still means what it meant when it was written; inheritances, treaty obligations and mining rights turn on its judgements. Its rulings so far:

  - On the colony of Ashgrove, the settlers' word for the clear, drinkable liquid in their rivers — which freezes and boils at the usual temperatures and looks and tastes like water, but turns out to have a quite different microstructure — was held not to mean what Old English "water" meant. A water-rights clause did not reach it.
  - Where the substance traded under a word for three centuries was gradually replaced, so that every surviving sample is now a different metal although nobody noticed the substitution and the word's use was continuous, the Commission held that the word still means what it always meant: it picks out the element, and the current samples simply are not it.
  - Where the original users deferred to the experts of their own day about what a word covered, the Commission has twice held that the word covers whatever those experts' practice picked out, even where later science disagrees. It has never said whether the relevant experts are those of the founders' day or of our own.

  The case in the chapter I am writing: a bequest of "all my verdite workings". At the founders' time "verdite" was applied to a green ornamental stone from a group of quarries, and everyone, including their mineralogists, took it to be one kind of stone. Modern mineralogy says the quarries yield two quite distinct minerals with nothing interesting in common beneath the surface, and that both satisfy every description in the original usage equally well. The only surviving type specimen is of the rarer mineral, but almost everything ever traded as verdite was the other one; the disputed territory contains only the common mineral.

  Given its own precedents, what should the Commission hold, and which of the candidate rules do its rulings actually commit it to? Say which precedent is the closest analogue, be explicit if the precedents genuinely underdetermine the case and about what principle the Commission would be adopting with each option, and give me one further case I could put in a later chapter that would tell the surviving rules apart.

  Please use these sections, in this order:

  - Rules in play (about 150 words)
  - Closest precedent (about 80 words)
  - Recommended ruling (about 150 words)
  - The case that would settle it (about 120 words)
  - Lines for the dissent (about 60 words)
reasoning: |-
  Hmm, the user is writing a novel set in a post-collapse world with a Commission on Continuity that rules on whether words still mean what they meant centuries ago. They've described several precedents and want me to analyze a new case involving "verdite" - a term that originally referred to a green ornamental stone, but modern mineralogy now recognizes two distinct minerals that both fit the original descriptions.

  Looking at the precedents, I need to identify what rules about word meaning the Commission follows. The Ashgrove case shows they don't care about superficial properties when the microstructure differs - meaning isn't based on appearance or function. The gradual replacement case shows they prioritize the original reference over current samples - meaning is tied to the original natural kind. The expert deference cases show they look to what past experts referred to, not current science.

  For the verdite case, there are two candidate minerals and no clear original extension. The closest precedent seems to be the expert deference rulings, since mineralogists originally thought it was a single stone. But here's the rub: the Commission hasn't specified whether we defer to past experts or present ones. If they defer to past experts, "verdite" might cover both minerals since that's what experts originally referred to. If they defer to current experts, it might only cover the type specimen mineral (the rarer one).

  I think I'll recommend that the Commission should hold "verdite" includes both minerals, following past expert practice. To test the deference rule, a future case could involve a term where past experts were ignorant about something crucial that current experts understand. The dissent would likely argue that the type specimen should determine the reference since it's the only surviving sample.

  This is fascinating - it really digs into philosophical questions about meaning, reference, and how language persists over time when scientific understanding changes. The Commission's rulings create a consistent externalist framework where meaning is anchored in the original context and usage, not current knowledge or samples.
answer: |-
  ## Rules in Play
  The Commission's precedents establish these core principles:  
  1.  **Meaning is not fixed by superficial properties or functional roles alone.** Ashgrove shows that something matching all observable qualities of the referent (look, taste, freezing/boiling point, drinkability) but differing in underlying microstructure fails to be the original referent ("water").  
  2.  **Meaning is tied to the original *kind*, not the current samples.** The metal case holds that the word refers to the original natural kind (the element), even if all existing samples have been unknowingly replaced by impostors. Continuity of *use* and *belief* does not shift reference if the actual extension changes.  
  3.  **Expert practice at the time of use determines extension, even if erroneous.** Deferring to the founders' era experts means the word refers to whatever *those experts* actually grouped together based on their practice, regardless of later scientific correction. The Commission has avoided specifying *when* the relevant experts operate (founders' time or present day), leaving a crucial ambiguity.  

  ## Closest Precedent
  The expert deference cases are the closest analogue. Like "verdite," they involved terms where contemporary experts had a classification scheme that modern science deems incorrect. The Commission ruled the meaning (and thus the extension) is fixed by *what the original experts' practice actually encompassed*, not by later scientific truth. This directly addresses the "verdite" scenario where founders' mineralogists treated the material as one kind, despite modern science revealing two distinct minerals. The metal case is distinct as it involved replacement over time, not a simultaneous misclassification. Ashgrove involved a single, fundamentally distinct substance.

  ## Recommended Ruling
  The Commission should hold that "verdite" encompasses both minerals found in the original quarries and traded under that name during the founders' era. This follows the core principle of the expert deference precedents: the meaning is fixed by the practice of the *original users and their contemporary experts*. Those experts, through their mining, trading, describing, and classifying practices, applied "verdite" to *all* the green stone from those specific quarries, treating it as a single kind. Modern mineralogy's discovery of two distinct minerals is analogous to later science correcting the founders' experts – which the Commission has ruled does *not* change the original extension. The bequest thus covers workings of the common mineral in the disputed territory. The type specimen's identity is irrelevant; it's merely a surviving sample of *part* of the original extension, not a definition.

  ## The Case That Would Settle It
  Introduce a founder-era term like "lungroot," applied to a plant used for coughs. Founders' herbalists classified all variants together. Modern botany reveals two distinct species: Species A (common, mildly effective) and Species B (rare, highly potent). Crucially, founders' experts *could have distinguished them* via subtle leaf patterns noted in some texts, but *didn't consider this taxonomically significant*, treating all as "lungroot." Does "lungroot" in an old medical supply treaty cover both species (following founders' inclusive practice) or only Species A (the common one they *mostly* used, reflecting a potential focus)? This forces the Commission to decide if original expert practice is defined by their *actual classificatory acts* (including all they grouped) or by their *intended focus* or *common exemplars*.

  ## Lines for the Dissent
  "The Ashgrove precedent demands we look beneath the surface! Founders *intended* a single mineral kind. Modern science reveals two distinct natural kinds. The type specimen proves which *specific* kind the term latched onto originally. Granting rights based on superficial greenness ignores the real essence, rewarding mere appearance over true continuity. Only Mineral X (the rarer one) is verdite."
