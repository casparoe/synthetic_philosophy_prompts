  ### Letterform Identity Decision Tree  
  *A quiz for beta testers to uncover implicit theories of glyph identity, based solely on visual cases. No prior theory knowledge needed—just look at the examples!*

  **Instructions:**  
  Answer the questions by visualizing or recalling specific glyph cases. Proceed to the next question based on your answer. Your path leads to a position on "what makes every 'a' an 'a'." At the end, you’ll see your position’s key commitment and whether it’s code-friendly.

  ---

  #### Branch Questions  
  1. **A glyph visually identical to the Latin "a" is used in Cyrillic for a different letter (e.g., U+0430). Is this glyph a Latin "a"?**  
     - A: Yes  
     - B: No  
     - C: Only when used in Latin text  

  2. **A glyph satisfies all your generator’s grid/stroke rules but is read as "d" by humans. Is it an "a"?**  
     - A: Yes—rules define it  
     - B: No—recognition defines it  
     - C: Only in context (e.g., in a word)  

  3. **A blackletter "a" resembles its font’s "o" more than a sans-serif "a." Which is more relevant to its identity?**  
     - A: Its contrast with blackletter "o"  
     - B: Its similarity to sans-serif "a"  
     - C: Neither—depends on the reader  

  4. **A handwritten single-story "a" vs. a printed double-story "a": Are they equally valid "a"s?**  
     - A: Yes  
     - B: No—one is "more standard"  
     - C: They’re different categories  

  5. **An "a" smudges until it looks like an "o." When did it stop being an "a"?**  
     - A: When ink physically changed  
     - B: When humans read it as "o"  
     - C: It never stopped—history defines it  

  6. **A glyph from an unknown script is shown with a table labeling it "a." Without the table, is it an "a"?**  
     - A: Yes—the table reveals its identity  
     - B: No—identity requires prior knowledge  
     - C: Only in systems using that table  

  7. **A logotype "a" is also a drawing of an apple. Is it primarily an "a"?**  
     - A: Yes—function over form  
     - B: No—it’s equally both  
     - C: Depends on context (e.g., in text vs. art)  

  8. **A glyph is recognized as "a" in words but as "u" alone. Which is its true identity?**  
     - A: What it is in words  
     - B: What it is alone  
     - C: It has no fixed identity  

  ---

  #### Logical Space & Allowed Combinations  
  The tree splits on **4 independent axes**:  
  1. **Cross-alphabet validity** (Q1)  
  2. **Rule-compliance vs. recognition** (Q2)  
  3. **Within-font vs. cross-font similarity** (Q3)  
  4. **Context-dependence** (Q8)  

  *Allowed combinations*:  
  - Q1A (cross-alphabet valid) pairs with Q3B (cross-font similarity).  
  - Q1B (alphabet-bound) pairs with Q3A (within-font contrast).  
  - Q2C (contextual) requires Q8A (in-word identity).  
  - *Forbidden*: Q1C + Q3C (incoherent—system relativity clashes with universalism).  
  - *Unexplored*: Q8C (no fixed identity) + Q4B (single-story invalid).  

  ---

  #### Leaves (Positions)  
  *Each leaf names the theory, states its most awkward commitment, and notes implementability.*  

  1. **Shape/Geometric Invariant**  
     - *Path*: 1A, 2A, 3B, 4A  
     - Awkward: The Cyrillic "а" is a Latin "a."  
     - Code? **Yes**—check stroke/intersection rules.  

  2. **Prototype**  
     - *Path*: 1B, 2B, 3B, 4B  
     - Awkward: Double-story "a" is canonical; single-story is "deviant."  
     - Code? **Yes**—compare to an ideal template via feature vectors.  

  3. **Exemplar**  
     - *Path*: 1B, 2B, 3B, 4A  
     - Awkward: A smudged "a" that resembles "o" is still an "a" if similar to stored exemplars.  
     - Code? **Yes**—match to a database of "a" examples (k-NN).  

  4. **Structural Role (System of Contrasts)**  
     - *Path*: 1B, 2A, 3A, 5A  
     - Awkward: A rogue glyph is an "a" if it contrasts correctly with "o" in its font.  
     - Code? **Yes**—measure feature differences from neighboring glyphs (e.g., distance to "o").  

  5. **Perceptual/Motor Schema**  
     - *Path*: 2C, 3A, 8A  
     - Awkward: The glyph only truly becomes an "a" in a word (context primes perception).  
     - Code? **No**—requires modeling human cognition; "ask a human."  

  6. **Causal-Historical Descent**  
     - *Path*: 1C, 5C, 6A  
     - Awkward: A glyph drawn yesterday is an "a" only if historically linked to prior "a"s.  
     - Code? **No**—requires tracking lineage; impractical for generators.  

  7. **Designer Intention/Convention**  
     - *Path*: 1C, 2A, 7A  
     - Awkward: The apple/"a" logotype is an "a" because the designer labeled it so.  
     - Code? **Yes**—use generator’s internal label during creation.  

  8. **Deflationary (No Essence)**  
     - *Path*: 1C, 2B, 8C, 7C  
     - Awkward: The smudged glyph has no identity—it’s a cluster of use-cases.  
     - Code? **Partial**—fuzzy logic on recognition/context; needs human fallback.  

  ---

  #### Unseparated Pairs & Gaps  
  - **Causal-Historical vs. Designer Intention**: Ambiguous on new glyphs (Q6 splits imperfectly).  
  - **Gaps**:  
    - Q1A + Q3A (cross-alphabet *and* within-font focus): *Incoherent*—cannot be both universal and system-specific.  
    - Q8B (identity defined alone) + Q2C (contextual recognition): *Unexplored*—psycholinguistically plausible but rare.  
    - Q4C (single/double-story as distinct categories): *Unattractive*—rejects obvious shared identity.  

  ---

  #### Key Takeaways for Your Generator  
  - **Code-ready**: Shape-invariant, Prototype, Exemplar, Structural Role, Designer Intention.  
  - **Human-needed**: Perceptual Schema, Causal-History, Deflationary (partially).  
  - **In-word priority**: Perceptual Schema (Leaf 5) explicitly handles contextual recognition.  

  *Why this works*: Every case is addressed, questions avoid theory-laden terms, and leaves map to implementable checks. Testers won’t deduce their position mid-quiz—branch logic obscures endpoints.
