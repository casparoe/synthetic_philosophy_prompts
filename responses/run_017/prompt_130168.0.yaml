  Scenario paragraph:

  "The city council is considering two proposals for a new public transportation system: a subway and a tram. The subway is very expensive to build and would cause significant disruption during construction, but it has high capacity and would be efficient for decades. The tram is cheaper and would cause less disruption, but it has lower capacity and would not meet the expected growth in demand as well. The council approves the subway system."

