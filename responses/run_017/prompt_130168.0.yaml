  ### Scenario
  A university hiring committee is deciding between two final candidates, Dana and Mo, for a single tenure-track position in the sociology department. Both candidates have strong publication records and teaching experience. Dana’s research focuses on urban inequality using quantitative methods, while Mo’s work centers on race and gender through qualitative ethnography. The committee reviews identical evidence: Dana has a prestigious postdoc but limited fieldwork, Mo has extensive fieldwork but no high-profile fellowships, and both received glowing letters—Dana’s emphasize methodological rigor, Mo’s highlight theoretical innovation. After deliberation, the committee hires Dana.  

  ### Analysis  

  1. **Evidence, Contrast Questions, and Explanations**  
     - **Evidence (E)**:  
       - Both candidates have strong publication records.  
       - Dana has a prestigious postdoc but limited fieldwork.  
       - Mo has extensive fieldwork but no high-profile fellowships.  
       - Letters praise Dana’s methodological rigor and Mo’s theoretical innovation.  
     - **Contrast Question 1**: Why hire Dana *rather than Mo*?  
       - **Winning Explanation (A)**: The committee prioritizes methodological rigor over theoretical innovation.  
     - **Contrast Question 2**: Why hire Dana *at all* (i.e., rather than leaving the position unfilled due to doubts about both candidates)?  
       - **Winning Explanation (B)**: The committee requires field-changing potential, and Dana’s postdoc signals this more than Mo’s fieldwork.  

     Explanations A and B are incompatible: A claims the committee values rigor over innovation, while B claims they value institutional prestige (postdoc) over fieldwork depth. A implies rigor is the *decisive* strength; B implies the postdoc is the *necessary condition* for hire.  

  2. **Why Each Explanation Fails the Other Question**  
     - **For Question 1 (Dana vs. Mo)**:  
       - *What must be explained*: Why Dana was chosen *over the specific alternative (Mo)*.  
       - Explanation A works: It directly compares strengths (rigor vs. innovation), making Dana’s rigor likelier given the evidence.  
       - Explanation B fails: It ignores the head-to-head comparison. B’s focus on the postdoc doesn’t explain why Mo’s fieldwork wasn’t favored—especially since Mo’s letters highlight innovation (which could also be "field-changing").  
     - **For Question 2 (Dana vs. no hire)**:  
       - *What must be explained*: Why Dana was hired *at all* (i.e., why the committee didn’t reject both candidates as unfit).  
       - Explanation B works: The postdoc acts as a credibility marker that meets a high bar for "field-changing potential," making hiring likelier than not.  
       - Explanation A fails: It doesn’t address why Dana cleared the bar for hireability. Rigor alone might not suffice if the committee doubts her impact (e.g., limited fieldwork).  

  3. **Structural Feature Doing the Work**  
     The key is **whether the contrast is between specific alternatives (Q1) or existence versus non-existence (Q2)**. Q1 focuses on *relative* strengths in a pairwise choice (rigor vs. innovation), while Q2 focuses on *absolute* thresholds (meeting a minimum standard like "field-changing potential").  
     - **Delete this to collapse the questions**: Remove the ambiguity in the committee’s priorities. If the committee *always* valued rigor over innovation *and* treated the postdoc as irrelevant (or vice versa), the explanations would align. For instance, if the postdoc was clearly a minor factor, A could answer both questions (rigor explains beating Mo *and* clearing the bar).  

  4. **Bayesian Verdict and Implications**  
     - **Bayesian verdict**: Conditions solely on E. It supports **Explanation B** (postdoc as key), as the postdoc is a stronger predictor of hireability when the alternative is "no hire." Without Mo in the picture, Dana’s postdoc is distinctive evidence for her meeting a high bar.  
     - **Indictment of IBE**: Bayesianism yields one coherent belief (B), while IBE fractures into incompatible explanations (A or B) depending on the question. This shows IBE is question-relative in a way that breeds inconsistency, unlike Bayesianism’s unified model.  

  5. **Objection and Reply**  
     - **Objection (IBE defender)**: "IBE answers specific contrastive questions. Different questions *should* have different explanations—this is a virtue, not a flaw. Asking why Dana was hired rather than Mo is distinct from asking why she was hired at all. IBE correctly tailors explanations to the query."  
     - **Reply**: This defense undermines IBE’s role as a rule for *belief*. If we accept A for Q1 and B for Q2, we believe the committee prioritizes rigor (from A) *and* prioritizes prestige (from B), but these are incompatible (e.g., in a world without Mo, A suggests rigor alone suffices, while B requires prestige). IBE cannot resolve this conflict, leaving us with contradictory beliefs about the committee’s criteria. Bayesianism, by contrast, forces a single model of the evidence, preserving rational coherence.  

  ### Why This Works  
  - **Realism**: Hiring debates often involve shifting contrasts (pairwise candidate comparisons vs. absolute standards for filling a role).  
  - **Incompatibility without stipulation**: A and B conflict because rigor vs. prestige points to different committee values (evidenced by Dana’s postdoc vs. Mo’s letters), creating tension when extrapolated to other scenarios.  
  - **No cheating**: Evidence is identical; both explanations are plausible (no "bad lot"). The flip vanishes if committee priorities are unambiguous.  
  - **Mixed evidence**: Dana’s postdoc supports B, her rigor supports A; Mo’s fieldwork challenges B, his innovation challenges A.  

  This case shows IBE’s verdicts depend on arbitrary question-framing, fracturing rational belief. Bayesianism avoids this by demanding evidence coherence.
