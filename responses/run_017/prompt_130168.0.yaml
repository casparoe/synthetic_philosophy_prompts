  - For Q1: The evidence points 3 and 6 (capacity differences) are central, and points 1,2,4,5 are less central because they are willing to incur those costs for the long-term gain.
  - For Q2: The evidence points 3 and 6 are also central, but now we interpret them in terms of meeting a threshold. Point 3 (subway's capacity) meets the threshold, point 6 (tram's capacity) does not. Points 1,2,4,5 are not directly relevant for the threshold (except that the high cost of the subway might be justified only by meeting the threshold).

  Walk through:

  1. For Q1 (subway rather than tram): 
     - What needs to be explained: the choice of subway over the tram.
     - Explanation A is lovely: it accounts for why they chose the more expensive and disruptive option by highlighting the greater long-term benefits.
     - Explanation B is a poor answer to Q1 because it doesn't explain why they chose the subway over the tram. It only says that the tram isn't good enough, but it doesn't say why the subway is better than the tram. In fact, Explanation B might suggest that if the tram met the threshold, they might choose the tram to save money, which is not the case according to A.

  2. For Q2 (approve any system at all rather than doing nothing):
     - What needs to be explained: why they approved a new system (specifically the subway) rather than sticking with the current system.
     - Explanation B is lovely: it says they only approve if the improvement is significant, and the subway meets that while the tram does not.
     - Explanation A is a poor answer to Q2 because it doesn't address the threshold issue. It only says they value long-term benefits, but that doesn't explain why they didn't stick with the current system. In fact, Explanation A might suggest that they would approve the tram (which also has some long-term benefits over buses) if the subway weren't available, but the council might have approved the tram if it were the only option? But Explanation B says they would not. So Explanation A does not rule out approving the tram, which is inconsistent with the council's decision to only approve the subway (and not the tram) in the actual scenario.

     Note: In the actual scenario, the council approved the subway and rejected the tram. But Explanation A doesn't explain why they didn't approve the tram as well (if it's available and has some benefits). But the question is about approving the subway rather than doing nothing. The council might have approved the subway and not the tram for different reasons. However, the event is approving the subway system. The alternative in Q2 is doing nothing (no new system). The council could have approved the tram instead of the subway, or approved nothing. But in this case, they approved the subway and not the tram, and not nothing.

     So for Q2, we are explaining why they approved the subway (and thus a new system) rather than approving nothing. Explanation B does that by saying that the subway meets the threshold for improvement, so they approve it. Explanation A doesn't address the 'rather than nothing' contrast.

     Alternatively, we can see that Explanation A might lead us to expect that they would approve the tram if it were the only option, while Explanation B says they would not. But in the world where only the tram is proposed, what would the council do? We don't know from the evidence. But the explanations make different predictions.

  Structural feature doing the work: 
  The key is that the two contrasts focus on different aspects of the evidence and require different things to be explained. In Q1, we are explaining a choice between two options, and the explanation is in terms of a trade-off between attributes. In Q2, we are explaining a choice between acting and not acting, and the explanation is in terms of a threshold that must be met for action. The council's decision procedure is being modeled in two incompatible ways: as a trade-off in Q1 and as a threshold in Q2.

  To collapse the two questions, we would need to make the council's decision procedure the same for both. For example, if the council used a threshold model for both decisions, then for Q1 they would say that both options meet the threshold (or one does and one doesn't) and then choose the best. But in our case, for Q1, if both met the threshold, they would choose the best (subway) and the explanation might be the same as A. But for Q2, if both met the threshold, then they would approve one of them, and the explanation for approving a system would be that at least one met the threshold. But then the explanations are compatible. The incompatibility arises because in our setup, Explanation B says the tram does not meet the threshold, while Explanation A does not require a threshold and might have approved the tram if it were the only option.

  Bayesian verdict:
  A Bayesian would condition on the evidence and calculate the probability of the council's decision given the evidence. They would not have two different verdicts for the two questions. The Bayesian would have one model of the council's decision-making that accounts for both the choice between subway and tram and the choice between approving a system and not. This model might be a combination of a threshold and a trade-off, or something else. But the Bayesian approach would not yield two incompatible explanations. It would yield one posterior distribution over possible decision-making models.

  In this case, the evidence might support a model where the council has a threshold for improvement and then, among the options that meet the threshold, they choose based on maximizing benefits minus costs. In our evidence, the subway meets the threshold and the tram does not, so they choose the subway. For the decision to approve a system, they approve if there's at least one option that meets the threshold. This model is compatible and would explain both. But then we don't have the incompatibility.

  Alternatively, if the evidence is ambiguous, the Bayesian might have a posterior that includes both models, but then they would have a distribution, not two definite answers.

  The IBE in this case gives two locally best explanations for the two questions, but they are globally incompatible. The Bayesian approach, by requiring a single model, avoids this.

  Which IBE verdict does the Bayesian line up with? Neither exclusively. The Bayesian might end up with a model that has elements of both, or might favor one over the other based on the evidence. But in this case, the evidence does not clearly decide between the two models. However, the Bayesian would not endorse both at the same time if they are incompatible.

  This is an indictment of IBE because it shows that IBE can give incompatible answers depending on the question, while Bayesianism aims for a unified account.

  Objection and reply:

  Objection (defender of IBE): "There's no problem here. Explanation always answers a specific contrastive question. You are simply asking two different questions, and it's no surprise that they have different answers. IBE is always relative to a question, and there's no requirement that the best explanation for one question must be the best for another."

  Reply: "True, but the problem is that the two explanations, when taken together, are incompatible. They make conflicting claims about the council's decision-making process. If we believe both, we are in contradiction. IBE, as a rule for what to believe, should not license incompatible beliefs. The defender might say we only believe the explanation relative to the question. But then what do we believe about the council's decision-making process? We have two incompatible accounts, and IBE does not tell us how to reconcile them. This undermines IBE's role as a guide to overall belief about the world, because it allows for mutually incompatible explanations to be simultaneously accepted for different questions. Bayesianism, by contrast, requires a single coherent model."

