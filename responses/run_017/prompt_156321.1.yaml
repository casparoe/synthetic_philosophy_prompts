  | Habit as "mere name"         | Contested/Misleading        | Ghazālī’s habit implies reliability (Marmura 1994); student leans Humean.  |  
  | Hume-Ghazālī equivalence     | Rejected by specialists     | See Kogan (1985): Ghazālī’s God underpins order; Hume has no substitute.    |  
  | Occasionalism label          | Contested but defensible    | Must acknowledge debate (Goodman 1978, Griffel 2009).                       |  

