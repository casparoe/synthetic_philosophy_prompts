answer: |-
  The vending machine coffee had gone cold and gritty at the bottom of the paper cup. Malin set it on the rolling tray, the plastic clatter too loud in the dim quiet of the pre-op room. Outside the door, the night-shift hospital hummed, but in here, only the soft glow of the safety light over the sink and the rhythmic beep of her own heart monitor broke the near-darkness. Dr. Vero Oyelaran leaned against the wall, arms crossed, looking more like a weary academic than a world-renowned neurosurgeon about to map her visual cortex. Bo, the chaplain-in-training, sat quietly in the corner chair, a silent, attentive shadow.

  “It won’t be like describing a dream, Malin,” Vero said, his voice calm but edged with the slight impatience she remembered from their disastrous co-teaching stint years ago. “The stimulations are precise. You’ll see simple patterns, flashes, colours. You report what you see, clearly and immediately. We correlate the point stimulated with the report. Simple.”

  “Simple?” Malin shifted against the stiff pillows. The tumour wasn’t painful, not yet, but its presence was a constant, low-grade hum beneath her thoughts, a physical counterpoint to the mental knot she was trying to untangle with Vero. “Simple if you think my report is caused *by* what I see. But you don’t. You think the zap causes the seeing *and* the reporting independently, like two lights on the same circuit. The experience itself, the *what it’s like* of seeing orange, just… rides along. Does nothing.”

  Vero pushed off the wall, taking a step towards the foot of the bed. “It does nothing *causal*, yes. The stimulator triggers a neural state. That neural state *is* the experience of orange, or rather, realizes it. Simultaneously, it triggers the motor commands for you to say the word ‘orange’. The report carries information *about* the experience because they share a common physical cause. The experience isn’t pulling the levers, but it’s still accurately reported.”

  Bo leaned forward slightly, his voice soft. “So the report is… a reading? Like a gauge showing the state of the engine, but the gauge reading doesn’t affect the engine?”

  “Exactly, Bo,” Vero said, nodding. “The gauge reading is caused by the engine’s state. They’re correlated. That’s sufficient for the report to be *about* the experience.”

  Malin snorted. “Sufficient? Let me ask you this, Vero. Tomorrow, you zap point X. I see a flash of orange. I say ‘orange’. According to you, the zap causes the neural state N. N *is* the experience of orange. N *also* causes the report ‘orange’. Fine. Now, here’s the rub: On your view, couldn’t there be a universe where that exact same neural state N exists, caused by that exact same zap, *without* there being any experience of orange at all? Where it’s all dark inside, but the report still happens?”

  Vero paused. He knew the territory. “Hypothetically, perhaps. But that’s not *this* universe. In this universe, N necessitates the experience.”

  “But in that *other* universe,” Malin pressed, her voice gaining intensity, “the report ‘orange’ still happens. What is it *about* in that universe? Not the experience of orange, because there isn’t one. It’s about… the zap? The neural firing pattern N? But in *this* universe, when I say ‘orange’, you insist it’s about the *experience*. How does the report magically change its *aboutness* depending on whether this extra, non-causal ghost is present or absent in the other universe? If the report is identical in both cases, and only the ghost differs, how can the ghost be what the report is *about*? The report doesn’t track the ghost across the possibilities *you* admit exist. It only tracks the physical state N.”

  Vero ran a hand over his closely cropped hair, a gesture Malin recognized as his ‘student just asked the annoying good question’ tell. “You’re forcing a picture that doesn’t fit,” he said slowly. “You’re picturing the judgment ‘I see orange’ as something separate, looking *at* the experience, inferring it, reporting on it like a detective. But it’s not like that. When I look at an orange *now*, under ordinary light, the judgment ‘this is orange’ isn’t *caused* by the experience. It’s partly *constituted* by it. The experience isn’t an object the judgment observes; it’s woven into the fabric of the judgment itself. It’s self-intimating. Asking for a causal chain between the experience and the report is asking the wrong question entirely. They emerge together from the base state.”

  Malin felt a flicker of frustration. He was nimble. “Constituted? Woven in? Okay, let’s grant that for the ordinary case – though I think you’re smuggling identity through the back door while keeping dualism at the front. But tomorrow, Vero. Tomorrow, *you* zap me. I see orange. I say ‘orange’. Is *that* judgment ‘orange’ also ‘constituted’ by the experience? Or is it just caused by the electrode and the neural state N, with the experience merely coinciding?”

  Vero hesitated for a fraction too long. “The neural state N is the same. The experience is the same. The report is the same.”

  “But the *cause* of the neural state is different!” Malin countered. “In the ordinary case, light hits my retina, cascades through the visual system. In your theatre, an electrode bypasses all that and directly fires N. If the judgment is *constituted* by the experience, and the experience is constituted by N, then in both cases, the judgment *should* be intrinsically tied to the experience. But if that’s so, why does the ordinary judgment feel like a direct grasp of the world, while tomorrow’s will feel like an artificial intrusion? And more importantly,” she leaned forward, the heart monitor beeping faster, “what about later? An hour after you zap me, Bo asks me, ‘Malin, did you see anything when Dr. Oyelaran stimulated point X?’ *That* judgment – the memory judgment – isn’t happening now. It’s not ‘constituted’ by the past experience in the present moment. It’s a reconstruction. A report *about* a past state. How, on your view, is *that* judgment, happening in some future neural state M, *about* the experience I had at N? If the experience did nothing, left no causal trace that isn't already covered by the physical trace of N… what makes M *about* the ghost that haunted N, and not just about the physical scar N left behind?”

  Bo shifted. “So… the memory isn’t *of* the experience? Just of the… brain event?”

  Vero held up a hand. “The physical state N leaves a physical memory trace. Recalling it activates a new state, M. M is also a conscious state, hopefully representing the past event accurately. The accuracy comes from the fidelity of the physical encoding and retrieval, not because the original experience *caused* the memory.”

  “But *what* is it representing accurately?” Malin’s voice was low now, intense. “The zap? The neural fireworks? Or the *seeing orange*? If the original experience did nothing, how does the memory trace encode *it* specifically? Why isn't the memory just ‘there was neural firing pattern N’, instead of ‘I *saw* orange’? Where does the ‘seeing’, the subjective character, enter the story of the *memory* if it played no role in forming the trace?”

  The room felt suddenly smaller. Malin looked straight at Vero, the argument crystallizing into something personal, cutting through the academic veneer. “And while we’re on the subject of things that do nothing… Look at us, Vero. Right now. You’re giving me reasons. Arguing. Trying to convince me epiphenomenalism is true. But if epiphenomenalism *is* true, then *nothing* in you that is conscious – your belief in the theory, your understanding of my argument, your feeling that you’re making sense – none of that is actually causing these words coming out of your mouth. They’re caused by neural states that *correlate* with those conscious states. So, in what sense are you actually *answering me*? In what sense is this an argument *with me*, and not just you producing sounds that happen to correlate with the physical effects of *my* sounds hitting *your* ears? If the light inside does nothing, then you’re not really *responding* to me. We’re just two elaborate clocks chiming in sequence.”

  The silence stretched. The beep of the monitor was the only sound. Bo looked down at his hands. Vero met Malin’s gaze. He didn’t look angry; he looked tired, and perhaps, for the first time that night, genuinely engaged beyond professional courtesy or old rivalry.

  “Malin,” he said quietly, his usual certainty tempered, “whether my belief is true, and whether my arguments are well-grounded, is a separate question from whether the *experience* of believing it, or understanding your point, is doing the causal work of moving my vocal cords. The *truth* of epiphenomenalism, if it *is* true, isn’t undermined by the fact that my stating it is caused by lower-level processes. The physical processes that cause my speech also realize my conscious reasoning. The reasoning can still be sound, the belief justified, even if the conscious states associated with that reasoning aren’t the efficient causes of the report. The correlation holds. My words are *about* the concepts and arguments because of the complex physical patterns realizing those concepts, patterns that evolved and were learned precisely to track the world, including internal states. The ‘aboutness’ is anchored in that physical-functional role, not in the conscious state pulling a trigger it never touches.” He paused. “This conversation… it isn’t *doing* anything causally, on my view, in the way you want it to. But the physical processes underlying it are exchanging information. We’re updating each other’s brain states. That’s what learning is. That’s what *this* is.”

  Malin opened her mouth, the counterarguments about justification and first-person authority bubbling up, the asymmetry between “I am in pain” and “He is in pain” ready to be deployed. But before she could speak, the door swung open abruptly, flooding the dim room with harsh fluorescent light from the corridor.

  A nurse in bright scrubs stood there, clipboard in hand. “Dr. Oyelaran? They’re ready to start pre-medication for Ms. Thorne in Bay 3. We need to get things moving.” Her voice was cheerful, oblivious to the metaphysical tension she’d just shattered.

  Vero straightened, the surgeon’s mask settling back over his features. He gave Malin a brief, unreadable look – part acknowledgment, part dismissal of the unfinished battle. “Of course. Thank you.” He turned back to Malin for a second. “Try to rest, Malin. We map at eight.” He nodded to Bo and followed the nurse out, the door sighing shut behind him, plunging the room back into the dim, beeping quiet.

  Malin stared at the closed door, the cold coffee forgotten, Vero’s last words echoing: *“We’re updating each other’s brain states. That’s what this is.”* It felt deeply unsatisfying. And the question of the memory judgment – *Did you see anything?* – hung unresolved, a practical, terrifying cliffhanger for the morning. She looked at Bo, who offered a small, sympathetic smile that didn’t reach his eyes. The low thrum of the hospital pressed in, a physical reality far more insistent than any ghost in the machine. The real mapping was about to begin.
