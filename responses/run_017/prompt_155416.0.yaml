  ## BENTHAM COLLEGE OF FELICIFIC COMPLIANCE  
  **Internal Circular: Form 7(b)**  
  **PRELIMINARY ESTIMATE OF FELICIFIC RETURN (SEXUAL)**  
  *Version 4.3α (Subject to Quarterly Hedonic Recalibration)*  

  **TO:** All Faculty, Staff, & Associated Persons (Categories A-G)  
  **FROM:** Office of Utilitarian Optimization (Dept. 12, Sub-Div. γ: Amatory & Affiliative Calculus)  
  **SUBJECT:** Mandatory Pre-Engagement Felicific Assessment (Per College Statutes, Vol. VII, Ch. 14, Para. 9-22)  

  **PREAMBLE:** It is the duty of the College to ensure all undertakings maximize aggregate Happiness. Interpersonal engagements of a romantic or sexual nature (Class II-B Affections, see Schedule 4) possess significant felicific potential but entail calculable pains. This Form facilitates the mandatory arithmetic prior to commencement, ensuring Net Pleasure is positive and sufficiently fecund. Submit completed Form 7(b) to Sub-Div. γ *at least seventy-two (72) hours* prior to initial anticipated contact exceeding Platonic Threshold (Def: Schedule 7, Para. 3a).  

  ---

  ### PART I: PARTICULARS OF PROPOSED ENGAGEMENT  
  1.  **Principal Parties:**  
      *   Proposer (Applicant): [Name, College ID, Dept.] _________________________  
      *   Subject of Engagement (Co-Principal): [Name, College ID/External ID, Dept./Affiliation] _________________________  
      *(Note: Co-Principal awareness & concurrence in calculus *recommended* but not strictly requisite for preliminary estimate; see Clause 15 re: Admonition & Self-Regard)*  
  2.  **Nature of Engagement:** (Tick all applicable; Consult Classification Annex ε for granular definitions)  
      ☐ Romantic Attachment (Sub-class: ☐ Monogamous ☐ Polyamorous Branch α ☐ Polyamorous Branch β)  
      ☐ Sexual Liaison (Sub-class: ☐ Singular/Episodic ☐ Serial/Recurrent ☐ Experimental/Exploratory [Specify: ______________])  
      ☐ Hybrid Form (Specify dominant pleasure vector: ______________)  
  3.  **Anticipated Duration:** ☐ Fleeting (<1 Lunar Cycle) ☐ Intermediate (1-6 Cycles) ☐ Protracted (>6 Cycles) ☐ Indeterminate *(Penalty Factor α applies)*  
  4.  **Expected Commencement:** [Date] ______ / ______ / ______  

  ---

  ### PART II: FELICIFIC CALCULUS - QUANTITATIVE ESTIMATION  
  *Apply the Seven Dimensions (Bentham, *Introduction to the Principles of Morals and Legislation*, Ch. IV) using Standardized Hedonic Units (H.U.). Weights denote aggregate societal calibration per Statute VII/14/Appdx. B. Base Score = Σ(Dimension Score × Weight).*  

  | Dimension    | Weight | Score (0-10 H.U.) | Rationale/Basis of Estimate (Briefly) | Weighted Score |
  | :----------- | :----: | :---------------: | :------------------------------------ | :-----------: |
  | **1. Intensity** (Peak pleasure/pain) | 1.2 | ____ | *Est. peak sensory/emotional affect.* | ____ |
  | **2. Duration** (Temporal extent) | 1.0 | ____ | *Est. total H.U. hrs/min engaged.* | ____ |
  | **3. Certainty** (Probability of outcomes) | 0.9 | ____ | *Prob. of pleasure/pain realization.* | ____ |
  | **4. Propinquity** (Immediacy) | 0.8 | ____ | *Delay before pleasure/pain accrues.* | ____ |
  | **5. Fecundity** (Chance of more pleasure) | 1.1 | ____ | *Likelihood of spin-off agreeable sensations.* | ____ |
  | **6. Purity** (Freedom from subsequent pain) | 0.7 | ____ | *Prob. of pain diluting/negating pleasure.* | ____ |
  | **7. Extent** (Number persons affected) | 1.3 | ____ | *Include all parties experiencing derivative pleasure/pain.* | ____ |
  | **BASE FELICIFIC RETURN (BFR)** | | | | **______ H.U.** |

  #### PART IIa: ADJUSTMENTS & SANCTIONS
  *(Apply Multipliers to BFR; Negative values permissible)*  
  5.  **Popular/Moral Sanction Adjustment (PMSA):**  
      *   *Est. Mean Disapproval Intensity* (0-10 H.U.): ____  
      *   *Est. Number Aware & Disapproving*: ____  
      *   *Prob. of Discovery* (0-1.0): ____  
      **PMSA** = [Mean Disapproval] × [Number Aware] × [Prob. Discovery] × (-1.5) = **______ H.U.**  
      > *Clause 5 Note: Disapproval based solely on "Reasons of Delicacy," appeals to "Unnaturalness," or offence to "Particular Persuasions" score **ZERO (0) H.U.** per Principle of Fictitious Offence (Statute VII/14/Para. 11). Only tangible pain of reputation (e.g., loss of standing, employability) constitutes valid input. Antipathy ≠ Pain.*
  6.  **Consent Factor (C_f):**  
      *   Full Mutual Consent Present? ☐ Yes (C_f = +0.0) ☐ No *(Proceed below)*  
      *   *If No: Est. Pain Coefficient of Non-Consent (P_c 1-100 H.U.):* ____  
      **C_f** = P_c × (-10.0) = **______ H.U.** *(See Cautionary Note 12a)*
  7.  **Legal/Political Sanction Adjustment (LPSA):**  
      *   Est. Probability of Legal Penalty/Coercion (0-1.0): ____  
      *   Est. Severity of Penalty (0-10 H.U.): ____  
      **LPSA** = [Prob.] × [Severity] × (-2.0) = **______ H.U.**
  8.  **NET FELICIFIC RETURN (NFR)** = BFR + PMSA + C_f + LPSA = **______ H.U.**  

  ---

  ### PART III: OFFICE DETERMINATION & RECOMMENDATIONS
  9.  **NFR Assessment:**  
      ☐ **APPROVED** (NFR ≥ +5.0 H.U.) - Proceed with engagement. File Form 7(c) (Post-Engagement Verification) within 14 days of cessation.  
      ☐ **PROVISIONAL** (-5.0 H.U. ≤ NFR < +5.0 H.U.) - Engagement permissible pending monthly review (Form 7(b)/R). Mitigation strategies (see below) *mandatory*.  
      ☐ **NOT APPROVED** (NFR < -5.0 H.U.) - Engagement prohibited. Seek consultation with Sub-Div. γ for re-calibration or alternative felicific pursuits (Ref: Form 12a "Hedonic Diversification Plan").  
  10. **Optimization Recommendations (Mandatory if Provisional):**  
      *   *(Based on dominant negative factors identified above)*  
      ☐ **Concealment Protocol Activation:** To minimize PMSA. Employ temporal/spatial discretion (e.g., Schedule interactions during low-observance periods, Utilize non-College affiliated venues). *Est. PMSA Improvement Potential:* +______ H.U. *(Cross-ref: Obfuscation Manual, Sect. δ.8)*  
      ☐ **Fecundity Enhancement:** Introduce auxiliary agreeable activities (e.g., shared intellectual pursuit, culinary pleasure) to bolster BFR.  
      ☐ **Purity Maximization:** Address identified risks (e.g., jealousy vectors, potential for misunderstanding) via pre-emptive clarification modules (Ref: Form 9d "Mutual Expectation Concordance").  
      ☐ **Duration Re-Calibration:** Consider truncating or segmenting engagement period to optimize intensity/purity trade-off.  
      ☐ **Other:** ________________________________________________________  
  11. **Compliance Certification:** I attest that the estimates provided represent my best felicific forecast based on available data and Benthamite principles.  
      *Signature:* _________________________ *Date:* ______ / ______ / ______  
      *Office Stamp & Authorization:* _________________________ (*Sub-Div. γ Official*)  

  ---

  ### WORKED EXAMPLES FOR ILLUSTRATION
  **EXAMPLE A:**  
  *Proposal: Brief, mutually enjoyable liaison between two unattached Research Fellows (Dept. 7).*  
  *Calculus:* High Intensity (8), Short Duration (2), High Certainty (9), High Propinquity (8), Moderate Fecundity (5 - potential collegiality boost), Moderate Purity (6 - low entanglement), Limited Extent (2). **BFR = 42.1 H.U.**  
  *Adjustments:* Minimal disapproval (PMSA = -1.2 H.U.), Full Consent (C_f=0), No Legal Risk (LPSA=0). **NFR = +40.9 H.U.**  
  *Determination:* **APPROVED.** *Commentary:* "Efficient hedonic yield relative to temporal investment; low risk profile supports approval."  

  **EXAMPLE B:**  
  *Proposal: Identical liaison as Example A, but involving one party bound by a long-term, formally recognized but reportedly joyless marital contract (External, Non-College).*  
  *Calculus:* Identical BFR = **42.1 H.U.**  
  *Adjustments:* Significant expected disapproval if discovered (Mean Disapproval=7, Number Aware≈30 Dept. colleagues, Prob. Discovery=0.6 → **PMSA = -7 x 30 x 0.6 x -1.5 = -189.0 H.U.**), Full Consent (C_f=0), No Legal Risk (LPSA=0). **NFR = -146.9 H.U.**  
  *Determination:* **NOT APPROVED** based on catastrophic PMSA.  
  *Recommendation:* "Engagement intrinsically felicific but rendered net negative solely by anticipated Popular Sanction. **Concealment Protocol Activation is the primary happiness-maximizing strategy** should engagement proceed regardless (not advised). Target Prob. Discovery reduction to ≤0.15 for Provisional status. Schedule interactions Tuesday/Thursday 19:00-21:00 hrs (low-observance window per Campus Density Charts, Ref: Annex θ)." *(Note: The Office neutrally observes the arithmetic outcome; the recommendation flows solely from the felicific imperative.)*  

  ---

  **CAUTIONARY NOTES:**  
  12. **Clause 6 (C_f):** The Pain Coefficient of Non-Consent (P_c) represents an extreme hedonic deficit. While quantification is procedurally necessary, applicants are reminded that P_c values routinely approach catastrophic maxima (≥90 H.U.), rendering NFR profoundly negative and triggering immediate prohibition. The calculus cannot capture the full ethical topology of consent; this quantification serves as a stark, arithmetic deterrent.  
  13. **Clause 10 (Concealment):** Recommendations are derived solely from felicific arithmetic. The Office acknowledges potential tension with other virtues (e.g., candour); however, within the Utilitarian framework, the reduction of tangible reputational pain remains a paramount good.  
  14. **Appeals:** Re-calibration requests may be submitted to the Sub-Div. γ Appeals Panel citing significant new data impacting the Seven Dimensions or Sanctions.  

  ---  
  *"The question is not, Can they reason? nor, Can they talk? but, Can they suffer?" - J.B. (Annotation to Ch. XVII)*  
  *Form 7(b) - © Bentham College of Felicific Compliance - Unauthorized replication constitutes a net felicific deficit.*  

  ---
  **How this meets your specs:**

  1.  **Doctrinal Fidelity:** Jokes stem directly from Bentham: the dismissal of "unnaturalness" as scoring zero (fictitious offence/antipathy), the serious inclusion of reputational pain (PMSA), the seven dimensions quantified absurdly but accurately, the pre-emptive calculus, the classification mania (sub-classes, references).
  2.  **Reductio via Examples:**
      *   **Example A:** The joyful fling easily out-scores...
      *   **Example B:** ...the identical act ruined *only* by reputational pain (PMSA), leading the Office to clinically recommend concealment as the optimal happiness-maximizing strategy. The form treats this as a neutral arithmetic outcome.
  3.  **Consent (Clause 6 & Note 12):** Handled gravely. Reduced to a massive negative multiplier (P_c × -10). The surrounding text ("catastrophic maxima," "stark, arithmetic deterrent," "cannot capture the full ethical topology") shows the spreadsheet straining, without joking or winking. Safety is implicit in the prohibition triggered by negative NFR.
  4.  **Tone:** Deadpan HR/bureaucratic throughout ("Provisional status," "Mitigation strategies mandatory," "Target Prob. Discovery reduction," "efficient hedonic yield").
  5.  **Structure:** Numbered clauses, scoring table with weights, adjustments, two worked examples, marginal notes/cross-references ("See Cautionary Note 12a", "Cross-ref: Obfuscation Manual"), fake citations (Statute VII/14, Annex ε, Schedule 7).
  6.  **No Cheap Shots:** No lurid details, no named individuals, no strawmanning. A Bentham scholar should recognize the authentic elements pushed to a logical, absurd extreme. The critique is inherent in the procedure.
  7.  **Self-Contained:** No external references needed; all Benthamite concepts are operationally defined within the form's logic.
