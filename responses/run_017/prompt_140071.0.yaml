prompt: |-
  I hold a two-clause norm of assertion that I arrived at by trying to repair what I take to be the knowledge norm's blind spot, and I want it stress-tested rather than validated. Call it the Reliance Norm: S may assert that p only if (i) S is in a position to know that p, and (ii) S is warranted in believing that her audience's treating p as settled on her say-so would not predictably leave them epistemically worse off than if she had stayed silent. Clause (i) is just the knowledge norm and is meant to do its usual work — lottery propositions, Moore-paradoxical utterances, guesses dressed up as statements. Clause (ii) is where I am going out on a limb: it is meant to explain why it can feel improper to assert something you know to an audience you know will misuse it (the true but easily misread statistic offered to a crowd mid-moral-panic; the specialist's hedge-free claim to lay readers who will hear more confidence than is warranted), and also why institutional assertion is strange — a committee, a lab, or these days a language model can issue a flat claim that no individual member knows, and yet we do not react to it the way we react to a person guessing.

  What I want is a map of the position's exposure, not a survey of the field. Which observations, arguments, or cases would actually count against it — and, crucially, which of those are inherited from clause (i) and so land on the plain knowledge norm as well, and which are specific to clause (ii)? Rank them from fatal to merely awkward, and tell me what a defender of my view should concede as counting against it before any critic presses the point. My own guesses at the soft spots: that the audience-relativity makes the permissibility of what I say depend on facts about your gullibility, which is the kind of feature that usually gets a proposed norm into trouble; and that clause (ii) is doing either no work or all of the work, in which case I do not really have a distinct view. Does it misclassify any ordinary, non-philosopher's assertion as impermissible — I care much more about that than about contrived cases? Does it collapse into the truth norm, into some pragmatic-encroachment story about knowledge itself, or into straight consequentialism about speech? And has the vagueness of clause (ii) insulated it so thoroughly that nothing could falsify it, and if so, is that a defect in this particular proposal or just the normal condition of proposing a constitutive rule?

  Some background so you can pitch the answer: I have been reading this literature on the side for years, in the rationalist-blog-and-forum tradition where the knowledge norm is close to the house view, and I have come to find the standard arguments for it too quick — they feel like they settle the question by stipulating which cases are the telling ones. Assume I know the standard moves; do not spend time establishing that knowledge-norm views are popular or that truth and belief norms are on the table. Go straight to where my formulation is exposed. On priors: I am moved more by cases than by considerations of theoretical elegance, and I would count "it cannot distinguish itself from its rivals" as more damaging than "it has awkward implications in bizarre situations."
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They've proposed a two-clause norm of assertion called the Reliance Norm. The first clause is the standard knowledge norm, and the second adds a condition about the audience not being left epistemically worse off. They want this stress-tested, not validated. The key is to find where it fails, especially distinguishing issues from clause (i) versus clause (ii).

  First, I need to break down their main concerns. They mentioned audience-relativity as a potential soft spot. That’s a big one because norms of assertion usually focus on the speaker, not the audience. Then there's the worry that clause (ii) might be doing all the work or none, making the knowledge part redundant. Also, they care about misclassifying everyday assertions, not just philosophical edge cases.

  Looking at possible counterexamples. The user already gave examples like true statistics in a moral panic or specialist claims to laypeople. I should think of cases where knowledge is present, but the audience misuse isn’t predictable. Or situations where the speaker can’t assess the audience’s likely reaction. What about cases where the audience’s epistemic harm isn’t due to the assertion itself but other factors?

  Another angle: institutional assertions. The user thinks clause (ii) handles them, but does it? Committees or AIs assert without individual knowledge. The norm requires the speaker to be in a position to know. If the committee as a whole knows, but no individual does, clause (i) might already be problematic. Does clause (ii) save it? Maybe, but then does that make clause (i) redundant here?

  Then there’s the vagueness of "predictably" and "epistemically worse off." How predictable is predictable? If the speaker couldn’t foresee misuse, is the assertion still permissible? And what counts as epistemically worse off? Misleading, causing confusion, reinforcing biases? That’s broad and might make the norm too flexible, hence unfalsifiable.

  Also, everyday cases. Imagine a teacher telling a simplified truth to students who might oversimplify further. Or giving a fact that could be misused if taken out of context. If the teacher knows but the students might misuse it, is that impermissible? That seems counterintuitive because teaching involves such risks. The user cares more about ordinary cases, so this is crucial.

  Now, theoretical issues. Does this collapse into consequentialism? If the permissibility hinges on the outcome for the audience, it’s more about consequences than the speaker’s epistemic state. That’s a shift from traditional norms. Also, might it align with pragmatic encroachment? If knowledge depends on stakes, clause (ii) introduces stakes through audience effect, blurring the lines.

  Inherited problems from the knowledge norm. Lottery propositions and Moorean assertions are handled by clause (i), so issues there aren’t new. But Gettier cases might still be a problem. If someone asserts a Gettiered belief, clause (i) says it’s impermissible (no knowledge), but clause (ii) might allow it if the audience benefits. That could be a conflict.

  Ranking the issues: Fatal might be if the norm can’t handle institutional assertions without making clause (i) irrelevant. Or if audience-relativity leads to absurd permissions/restrictions. Serious but not fatal could be vagueness and everyday misclassifications. Awkward might be theoretical tensions with consequentialism.

  Also, the user wants to know what to concede. They should admit that clause (ii) makes the norm audience-relative, which is a significant shift. And that predictability is fuzzy, so in borderline cases, it’s hard to apply. Plus, in some cases, knowledge might not be necessary if the audience benefits, challenging the knowledge norm’s necessity.

  Need to ensure the response distinguishes which problems come from which clause. For example, Gettier cases are clause (i), audience misuse is clause (ii). Institutional assertions might challenge clause (i), but clause (ii) could be the fix, though it might not fully work.
answer: |-
  Here's a stress-test map of your Reliance Norm, focusing on exposures, their severity, origins, and necessary concessions. I'll target your stated priorities: audience-relativity, clause (ii)'s distinctness, misclassification of ordinary assertions, collapse risks, and falsifiability. Problems are ranked from fatal to awkward, with explicit tagging of clause origins.

  ### **Fatal or Near-Fatal Exposures**
  1. **Institutional Assertion Failure (Clause (i) Primary, Clause (ii) Secondary)**  
     - **Case:** A scientific committee issues a flat declaration: "Vaccine X is safe." No individual member *knows* this (each has gaps or relies on division of labor), but collective evidence meets institutional standards. Lay audiences reasonably treat it as settled.  
     - **Problem:** Clause (i) forbids this assertion (no individual is in a position to know). Yet your intuition is that institutional assertions *should* be permissible here. Clause (ii) can't rescue it—even if satisfied (audience is better off), clause (i) still blocks assertion.  
     - **Why Fatal:** Contradicts your core motivation. Concede that clause (i) *inherits the knowledge norm's blindness to non-individual epistemic agents*. Fixing this likely requires abandoning clause (i) or redefining "S" (e.g., as collective entities).  

  2. **Blameless But Unlucky Misuse (Clause (ii) Specific)**  
     - **Case:** You know a complex statistic (e.g., "Group A commits 60% of crime X"), assert it to a cautious, well-intentioned audience. Unpredictably, a bad-faith actor in the audience twists it into misinformation, making listeners epistemically worse off.  
     - **Problem:** Clause (ii) renders your assertion *impermissible* because the audience ended up worse off. But this violates intuition: you did nothing wrong if misuse was genuinely unforeseeable.  
     - **Why Fatal:** Makes permissibility hostage to *outcomes*, not warrant. Concede clause (ii) is **consequentialist** in dangerous ways—it judges assertions based on actual (not just foreseeable) epistemic harm.  

  ---

  ### **Serious but Potentially Manageable Problems**
  3. **Everyday Over-Restriction (Clause (ii) Specific)**  
     - **Case:** A teacher knows simplified physics (e.g., "Newtonian gravity is force-at-a-distance") and asserts it to 10-year-olds. They *will* treat it as settled truth and temporarily misuse it (e.g., resist relativity later), but long-term, they’re better off.  
     - **Problem:** Clause (ii) may forbid this—audience is predictably *temporarily* worse off. Ordinary intuition: the assertion is permissible (even virtuous).  
     - **Severity:** High—misclassifies mundane, socially valuable speech. Concede clause (ii) needs **temporal granularity** (e.g., "worse off overall" or "in the long run").  

  4. **Vagueness as Falsification-Proofing (Clause (ii) Specific)**  
     - **Problem:** "Predictably," "worse off," and "settled" are deeply contextual. E.g., when is misuse "predictable"? What counts as "worse off" (false beliefs? reinforced biases?) for a diverse audience?  
     - **Why Serious:** Makes the norm unfalsifiable—any counterexample can be dismissed with reinterpretation. This isn't "normal" for constitutive rules (e.g., knowledge is clearer).  
     - **Concession:** Admit clause (ii) is **not a crisp rule** but a heuristic. To avoid collapse into vacuity, insist it only applies when harm is *obvious* (e.g., shouting fire in a theater).  

  5. **Clause (ii) Swallows Clause (i) (Collapse Risk)**  
     - **Case:** You assert a lottery proposition ("Ticket #1000 lost") to a desperate gambler who will bankrupt themselves if they doubt you. They’re better off treating it as settled.  
     - **Problem:** Clause (ii) permits this (audience is better off), overriding clause (i)’s prohibition. Knowledge becomes redundant—clause (ii) alone does all the work.  
     - **Why Not Fatal?** You can bite the bullet: sometimes asserting unknowns *is* permissible if stakes are high (e.g., "Keep breathing!" to a panicking asthmate). But concede this **collapses into consequentialism**—clause (i) is ornamental in high-stakes cases.  

  ---

  ### **Awkward but Defensible Implications**
  6. **Gullibility-Dependence (Clause (ii) Specific)**  
     - **Case:** You know *p*, but your audience is hyper-gullible—they’ll treat *p* as settled and add 10 false inferences. Staying silent leaves them less wrong.  
     - **Problem:** Clause (ii) forbids asserting known truths to flawed audiences. Intuition clashed: we often blame the audience, not the speaker.  
     - **Severity:** Awkward but not fatal. Concede the norm *is* audience-relative—this is a **feature, not a bug**. Defend by analogy: surgeons don’t operate on patients who’ll ignore aftercare.  

  7. **Gettier Resilience (Clause (i) Inherited)**  
     - **Case:** You assert a Gettierized belief (e.g., "Jones owns a Ford" based on seeing him drive one, unaware it’s rented). You’re not in a position to know, so clause (i) forbids assertion.  
     - **Problem:** But if the audience would benefit (e.g., they need a ride), clause (ii) is satisfied. Yet assertion remains impermissible per clause (i).  
     - **Why Minor:** This is a **knowledge-norm problem**, not unique to you. Concede that Gettier cases remain thorny but don’t undermine clause (ii).  

  ---

  ### **Your Specific Queries Addressed**
  - **"Does it collapse into truth/consequentialism/pragmatic encroachment?"**  
    Clause (ii) is **consequentialist-lite** (audience welfare-focused). It avoids collapsing into *truth* (truth doesn’t care about misuse) but edges toward pragmatic encroachment (knowledge depends on stakes). Stress that clause (i) anchors it in epistemic propriety.  
  - **"Does clause (ii) do no/all work?"**  
    It does **substantial work** in audience-sensitive cases (e.g., your moral-panic example), but clause (i) is essential for lottery/Moorean cases. Only collapses in high-stakes outliers (see #5).  
  - **"Misclassifies ordinary assertions?"**  
    Yes (see #3: teaching simplifications). Concede it may **over-regulate pedagogy/popularization** unless "worse off" is interpreted long-term.  
  - **"Vagueness a defect?"**  
    Yes—**clause (ii) is less a "rule" than a cautionary principle**. Most constitutive norms (knowledge, belief) are sharper.  

  ### **Strategic Concessions for a Defender**  
  1. Clause (ii) **cannot justify institutional assertions** if clause (i) requires individual knowledge.  
  2. The norm is **consequentialist about audience outcomes**, not purely epistemic.  
  3. It **over-restricts assertions to vulnerable audiences** (e.g., children, the traumatized).  
  4. "Predictably" is **vague** and must be constrained to *obvious risks* to avoid vacuity.  

  ### **Where It Holds Up**  
  Clause (ii) **excellently handles** your core cases: true-but-misleading statistics (impermissible) and specialist/layperson dynamics (impermissible without hedging). It also avoids the knowledge norm’s rigidity in high-stakes, non-lottery scenarios (e.g., reassuring a dying patient).  

  **Final Verdict**: The Reliance Norm is most exposed on institutional assertion and outcome-dependence. If you can accept that clause (i) must bend for groups or that permissibility is partly consequentialist, it survives—but as a hybrid, not a pure epistemic norm.
