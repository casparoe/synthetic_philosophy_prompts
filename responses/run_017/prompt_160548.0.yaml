answer: |-
  ### Case: The Visit

  Jamie, visiting their close friend Sam in the hospital after major surgery, spontaneously brings Sam's favorite homemade soup. Sam is touched, feeling genuinely cared for and less isolated. The act is right because **it expresses and sustains their friendship through vulnerable, attentive presence (F)**. This mutual recognition of care strengthens their bond, making the act valuable beyond mere duty.

  ### Analysis

  1.  **F and Rightness**: F is the act's role in *constitutively expressing friendship* through non-instrumental care. It’s right in virtue of F because authentic friendship requires such spontaneous, non-transactional gestures that affirm mutual regard without aiming for reciprocity. Instrumentalizing it would negate its nature.

  2.  **Moral Worth and Self-Defeat**: Jamie’s act has full moral worth. They act from unmediated care for Sam—a direct response to Sam’s suffering, rooted in Jamie’s character as a friend. If Jamie instead acted *because* "this expresses friendship" (F), they would treat F as an external goal to be achieved, making the gesture performative and calculative. This instrumentalization *destroys* the unguarded, non-deliberative quality essential to F. The act would become a *representation* of care rather than the *instantiation* of it, undermining the very feature (genuine mutual recognition) that makes it good.

  3.  **Readings Diverge**:
      *   *Doxastic Reading (e.g., acting on F as one's motivating reason)*: Fails. If Jamie’s motivating reason includes F (e.g., "I’m doing this to express friendship"), the act is corrupted. Moral worth is deficient.
      *   *Attributability Reading (e.g., act attributable to a virtuous concern for the friend)*: Succeeds. Jamie’s act flows from their deep-seated care for Sam, making it fully expressive of their moral character. Worth is intact.

  4.  **Key Feature and Removal**: The **constitutive fragility of friendship goods** does the work. Friendship’s value resides partly in its uncalculated spontaneity; consciously treating its expression as a *reason* collapses it into strategic behavior. Remove this fragility (e.g., replace friendship with a formal duty like paying a debt), and acting *because* of F (e.g., "I pay because I owe it") is unproblematic. The case avoids collapsing into Huck Finn (Jamie endorses helping friends) or "one thought too many" (the issue isn’t an extra thought but a structural contradiction).

  5.  **Strongest Attack and Reply**:
      *   **Attack**: "Jamie *can* act on F without self-defeat if F is understood non-instrumentally—e.g., acting *from* friendship (a state) rather than *to express* it (a goal). The doxastic condition can require the former, avoiding self-defeat."
      *   **Reply**: Acting *from* friendship is not equivalent to acting *on F as a motivating reason*. F is the *good-making feature of the act* ("expressing friendship"), not the psychological state ("friendship"). To treat F itself *as the reason* is necessarily to objectify it into a goal, even if one also feels friendship. The structure of intentional action requires representing F as an aim, triggering instrumentalization. Only character-attribution captures the non-objectified nature of the responsiveness.

  6.  **Least Confident Point**: The claim that Jamie’s act has **full** moral worth if they *never* consciously access F. If Jamie *must* actively repress awareness of F to act well (which isn’t implied here—they simply act from care), it might suggest a defect. Worth would collapse only if such repression indicated self-deception or alienation from their own motives, but in this case, it reflects harmony between character and context.

  \answer{constitutive fragility of friendship goods}
