prompt: |-
  I am the scientific secretary and non-voting chair of the review panel for a national research council's mid-sized investigator grants. We run three cycles a year. Each cycle is two and a half days, twelve panelists, roughly seventy proposals, and about six million dollars; our ranked list then goes to a council that can and occasionally does send it back. The panelists are senior working researchers who are paid nothing, receive no training in judgement and decision making, and are rotated a third at a time, so I can assume neither continuity nor shared vocabulary, and I cannot add a training day or a second pass over the batch. What I can change is the procedure inside the room and the schedule going in, provided I can defend each change on a single page to a council of non-specialists and to panelists who will resent anything that feels like bureaucracy.

  Our current process, in the order it happens: two lead reviewers per proposal read it in full and send me written pre-scores forty-eight hours ahead; the other panelists receive the abstract and a one-page summary of the leads' comments. I open each item with a one-sentence characterisation of where I think it sits. Discussion then runs in a fixed seating order, after which scores are entered sequentially on a shared screen with the running mean visible, and any score diverging by more than 1.5 points from that mean must be accompanied by a typed justification. Proposals are scheduled grouped by host institution, so the panel frequently hears four or five from the same university in a row. One panelist each cycle participates asynchronously and posts written comments that the room reads before anyone speaks. There is no feedback loop: we learn what we got right years later, if at all.

  I would like a decision procedure, not an exposition of the theory. What I have in mind has three parts.

  First, a real-time diagnostic: an ordered set of questions I can run in about ninety seconds, using only what is observable in the room plus the pre-scores that only I hold, that sorts the current state of a proposal into at least these buckets — genuine convergence on shared evidence; an informational cascade; reputational or conformist herding; structurally mandated deference to the lead reviewers, who are the only people who have read the thing; and spillover from a neighbouring proposal or from the run of items from the same institution. For each question, state what observable would count as a sufficient positive, what that question cannot in principle distinguish from what it is meant to detect, where the procedure simply stops with "no intervention", and where it must hand the decision back to a person because the issue is one of values rather than facts.

  Second, a remedial ladder: an ordered menu of interventions from least to most intrusive, each attached to the diagnosis that triggers it, with what it costs in minutes, in goodwill, and in information. The standard literature distinguishes herding that comes from people rationally discounting their own private signals against a public record from herding that comes from the social cost of being seen to be wrong; keep that distinction wherever it changes what I should actually do, and say explicitly where the remedies for the two pull in opposite directions, which one governs when both diagnoses are live, and why.

  Third, the ex ante fixes: what I should change before the next cycle, and in what order of priority, given a one-page justification budget and a panel that will not tolerate extra form-filling. Please rule specifically on the deviation-and-justification rule, on speaking order, on whether and when I should speak at all, on the institutional grouping in the schedule, and on the asynchronous panelist whose comments are read first and cannot be cross-examined.

  Then please run the procedure on three cases. Case A: the first speaker, a well-known and well-liked figure, gives a proposal a nine and a confident rationale; the next five come in between eight and nine with reasons that are recognisably paraphrases of his; the two lead reviewers' private pre-scores, which I alone hold, were six and four. Tell me what I do in the next five minutes, and in particular whether and how I use the pre-scores. Case B: a proposal that everyone has in fact read, in an area where this particular panel is unusually expert, and which is genuinely in the top decile of the batch — the false-positive control, where I need the procedure to output "leave it alone" and to tell me which observable does that work. Case C: an unfashionable cross-disciplinary proposal from an early-career investigator at an institution nobody has heard of, scheduled immediately after a run of five strong proposals from our flagship university, which the panel is drifting toward rejecting in a way that looks to me like nobody wanting to be the person who championed a soft topic. I think it is good and my instinct is to rescue it. I want the procedure's answer, and I want you to take seriously that the honest answer may be that I should not intervene, or should intervene only through a mechanism that binds me equally when I am wrong: tell me what a discretionary rescue by the chair teaches the panel about how to read my interventions, and what that does to the process over the remaining day and a half.

  Finally, tell me what the procedure cannot do. I am aware that we have no ground truth within a cycle, that a correct convergence and a lucky cascade are indistinguishable from the outcome of one meeting, and that nothing in this fixes errors that the whole panel shares because the whole field shares them. Say where the procedure will misfire, which of its steps are judgement calls dressed up as procedure, and which parameter — I suspect something like our tolerance for funding risky proposals at the expense of safe ones — is a value choice that the procedure should surface and then leave to the council rather than settle for them.
reasoning: |-
  Hmm, this is an incredibly detailed and sophisticated query about optimizing grant review panel procedures. The user is clearly an experienced scientific secretary facing real operational constraints - no budget for training, rotating panelists, resistance to bureaucracy. They're asking for concrete tools to detect and correct cognitive biases in real-time, not theoretical frameworks.

  Breaking this down, the core needs are:
  First, a diagnostic flowchart that can run in 90 seconds during reviews. It needs to distinguish between legitimate consensus and problematic herding based on observable behaviors. Key signals would include:
  - Are later speakers just paraphrasing early comments? (cascade)
  - Are objections being silenced? (reputational herding)
  - Are people referencing institutional reputation? (spillover bias)
  Critical to note what can't be diagnosed - like when private signals genuinely align.

  Second, a tiered intervention protocol. Must prioritize least disruptive actions first:
  - For informational cascades: ask "any dissenting views?" (cost: 2min)
  - For reputational herding: blind voting (cost: goodwill but preserves integrity)
  - For lead reviewer deference: disclose pre-score range (nuclear option)
  Important distinction: reputational herding requires anonymization while informational issues need information injection.

  Third, pre-meeting fixes. Top priorities:
  1. Scramble institutional grouping (easy win, prevents spillover)
  2. Randomize speaking order (no added burden)
  3. Kill deviation justifications (they amplify cascades)
  4. Integrate async reviewer into discussion slots
  Justification angle for council: "Prevents cognitive contamination"

  The case studies reveal nuances:
  In Case A (famous speaker vs low pre-scores), procedure says: pause → disclose aggregate conflict → restart discussion. Pre-scores used as group data, not individual.

  Case B (true top proposal) passes diagnostic via specific observables: independent reasoning in comments, no reputational references, disagreement pattern shows no suppression.

  Case C (unfashionable proposal) is toughest. Procedure might suggest: 
  - Note scheduling proximity 
  - Call for "risky proposal advocates" 
  But crucially: if diagnostic shows genuine consensus, chair must not override. Discretionary rescue teaches panelists to second-guess themselves. Better to flag for council reconsideration later.

  Limitations are vital to acknowledge:
  - Can't fix field-wide blind spots
  - Distinguishing luck from skill requires longitudinal data
  - Risk tolerance is a value judgment the procedure should expose, not decide
  The deviation justification rule is particularly pernicious - it codifies herding.

  The user's hidden challenge seems to be balancing intervention legitimacy with process purity. Every chair action teaches panelists meta-lessons. Hence the insistence on symmetric constraints: if I rescue something, I need equivalent mechanisms for when I'm wrong. This is professional self-awareness at its finest.
answer: |-
  Here is a decision procedure designed for your operational constraints, grounded in observable behaviors and minimal disruption. It prioritizes diagnosing cognitive pitfalls and offers targeted remedies, with ex ante fixes requiring ≤1-page justifications.

  ---

  ### **Part 1: Real-Time Diagnostic (90-Second Flowchart)**  
  *Ask these questions sequentially. Stop at first match.*  

  | **Question** | **Positive Observable** | **Indistinguishable From** | **Action** |
  |--------------|-------------------------|----------------------------|------------|
  | 1. **Convergence?** > Do ≥3 panelists cite *unique* evidence (e.g., "Fig 2 methodology concerns," "Budget justification weak")? | Yes: Diverse, specific critiques/endorsements | N/A | **No intervention** (Genuine convergence) |
  | 2. **Informational Cascade?** > Are later speakers paraphrasing early comments *without new evidence*? (e.g., "As Dr. X said...") | Yes: Repetitive language, no novel points | Low-quality proposal where all agree | **Trigger Remedial Ladder (Type 1)** |
  | 3. **Reputational Herding?** > Are dissents muted/qualified? (e.g., "I might be wrong but...") or do speakers glance at high-status panelists? | Yes: Hesitation, hedging, deferential body language | Genuine uncertainty | **Trigger Remedial Ladder (Type 2)** |
  | 4. **Lead Deference?** > Do >50% of comments reference leads' summaries *exclusively*? (e.g., "The leads noted X, so...") | Yes: No independent analysis beyond lead summary | Proposal clarity issues | **Trigger Remedial Ladder (Type 1)** |
  | 5. **Spillover?** > Are institutional names or prior proposals mentioned? (e.g., "Another weak one from Univ Y") | Yes: Explicit comparisons to past proposals/institutions | Coincidental quality cluster | **Trigger Remedial Ladder (Type 3)** |
  | 6. **Ambiguous?** > Mixed signals with no clear pattern. | N/A | Values conflict (e.g., risk tolerance) | **Hand to panel: "We seem split. Should we fund risky science here?"** |

  ---

  ### **Part 2: Remedial Ladder (Ordered Interventions)**  
  *Interventions escalate only if prior step fails. "Type 1" = informational; "Type 2" = reputational.*  

  | **Intervention** | **Trigger** | **Cost (Time/Goodwill)** | **Notes** |
  |------------------|-------------|--------------------------|-----------|
  | **1. Solicit Silent Views:** "Let’s hear from someone who hasn’t spoken yet." | Cascade (Type 1), Lead Deference | 2 min / Low | Breaks echo chambers. Use first for Type 1 issues. |
  | **2. Blind Vote:** "Enter scores now; we’ll hide the mean." | Reputational Herding (Type 2) | 3 min / Moderate | Type 2 ONLY. Anonymity reduces social pressure. *Never* for Type 1 (worsens cascades). |
  | **3. Disclose Conflict:** "The pre-scores show significant divergence [state range, e.g., 4–9]." | Type 1 or 2 with leads' pre-scores ≠ group | 1 min / High | Use ONLY with extreme lead-reviewer divergence (≥3-point gap). Do not reveal identities. |
  | **4. Reset Discussion:** "Set aside prior comments. In 30 seconds, each state: Fund or Not Fund, and why?" | Spillover, Stalled debate | 5 min / Moderate | Forces clean slate. Use for spillover or if Type 1/2 remedies fail. |
  | **5. Chair Override:** Table proposal for end of day; re-start fresh. | All else fails | 5 min / Very High | Last resort. Only if diagnostics show systemic bias. |

  *Opposing Remedies*:  
  - Type 1 (Informational): Needs *more* information (e.g., disclose pre-score range).  
  - Type 2 (Reputational): Needs *less* visibility (e.g., blind voting).  
  *If both live*: Prioritize Type 2 remedy first (social pressure distorts more severely).  

  ---

  ### **Part 3: Ex Ante Fixes (Priority Order)**  
  *Justification theme: "Reduce cognitive biases without burdening panelists."*  

  1. **Scramble Institution Grouping** (Top Priority)  
     - *Why*: Prevents spillover bias. "Sequential reviews of same institution anchor judgments, violating independence."  
     - *Justification*: <1 sentence.  

  2. **Randomize Speaking Order**  
     - *Why*: Disrupts cascades. "Fixed order privileges early voices, creating artificial consensus."  
     - *Implementation*: Assign order via dice roll each session.  

  3. **Eliminate Deviation Justifications**  
     - *Why*: Amplifies reputational herding. "Forcing public justifications for dissent discourages independent judgment."  
     - *Replace with*: Blind scoring; no mean visible.  

  4. **Integrate Async Panelist**  
     - *Why*: "Written comments read first create undeferenced authority."  
     - *Fix*: Slot async comments into random discussion order (don’t read aloud; panelists read pre-meeting).  

  5. **Chair Role: Neutral Facilitator**  
     - *When to speak*: Only to launch diagnostics or ladder interventions. *Never* open with a score hint.  

  ---

  ### **Case Applications**  
  **Case A (Cascade + Lead Divergence)**  
  - *Diagnostic*: Q2 (Cascade) + Q4 (Lead Deference).  
  - *Remedy*: **Disclose Conflict** (Ladder Step 3): "Pre-scores ranged 4–6. Let’s reset: [Name], what’s your *independent* take on Method X?"  
  - *Why not chair override?* Disclosure breaks cascade without chair bias. Using pre-scores as *group data* (not individual) defends against resentment.  

  **Case B (True Positive Control)**  
  - *Diagnostic*: Q1 (Convergence) via ≥3 unique critiques (e.g., "The model is novel because...", "Figure 5 answers reproducibility concerns").  
  - *Observable for "Leave Alone"*: Specific, non-repetitive evidence from multiple panelists. No spillover/herding cues.  
  - *Action*: No intervention.  

  **Case C (Spillover + Reputational Herding)**  
  - *Diagnostic*: Q5 (Spillover) + Q3 (Reputational Herding: muted support).  
  - *Remedy*: **Reset Discussion** (Ladder Step 4): "Ignore prior proposals. 30 seconds: Should we fund this *if it came from Harvard*? Why?"  
  - *If still rejected*: **Do not rescue**. Chair override teaches panelists to rely on your bias, not evidence. Instead: Flag for council if ranked near cutoff. "Symmetric constraint": If you rescue this, you must equally flag strong proposals *you* dislike.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Distinguish Correct Consensus from Lucky Cascade**  
     - Only post-hoc outcomes reveal this (e.g., funded project success).  

  2. **Fix Shared Blind Spots**  
     - If entire panel misses a method flaw (e.g., field-wide outdated practice), procedure won’t catch it.  

  3. **Judge Values**  
     - Risk tolerance (e.g., "Should we fund high-risk/high-reward?") must be surfaced to council. Procedure only detects *how* decisions are made, not *what* should be prioritized.  

  4. **Misfires**  
     - False negatives: Diagnosing "convergence" when herding is subtle.  
     - Over-intervention: Misreading passion as reputational pressure.  
     - Key judgment calls: Assessing "unique evidence" (Q1) and "muted dissent" (Q3).  

  **Parameter to Surface for Council**: Risk threshold. Procedure outputs: "X% of funded proposals were high-risk. Adjust cutoff?"  

  This system minimizes bureaucracy while targeting the most corrosive biases. It accepts that some errors are irreducible—but reduces those within your control.
