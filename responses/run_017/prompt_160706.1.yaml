answer: |-
  Below is a complete, runnable design for your philosophy club session on the two-envelope paradox. It prioritizes experiential learning, minimizes facilitator exposition, and targets your four learning goals through gameplay. The session is structured into three rounds (Blind, Peek, Friction) with a ledger system, prediction sheets, and a guided debrief. Total time: 55 minutes.

  ---

  ### **Materials & Preparation**  
  *(5 minutes prep before club starts)*  
  1. **Envelopes & Cards:**  
     - Prepare **16 sealed envelopes** (or 14 if only 14 students).  
     - Inside each envelope, place a card with a monetary amount. Use the following **8 pairs** (each pair has amounts A and 2A):  
       - (2, 4), (2, 4), (4, 8), (4, 8), (8, 16), (8, 16), (16, 32), (16, 32)  
       *(Total amounts: 2, 2, 4, 4, 4, 4, 8, 8, 8, 8, 16, 16, 16, 16, 32, 32. Max = 32.)*  
     - Label the *outside* of each envelope with a unique ID (1–16).  
     - **Master Ledger** (for facilitator only): A list matching envelope IDs to amounts (e.g., "ID1: 2, ID2: 4" for the first pair).  

  2. **Other Materials:**  
     - **Prediction Sheets** (1 per student): Half-page slips with:  
       ```  
       BEFORE PLAYING:  
       1. Blind round: You’re handed an envelope (don’t open it). You can switch with your partner. Will you? (Keep / Switch / No preference) Why?  
       2. Peek round: You can open your envelope, see the amount, then decide. Will you switch? (Keep / Switch / It depends) If "depends," on what?  
       3. How do you think amounts are chosen? Guess max and min.  
       AFTER PLAYING:  
       1. What pattern did you notice in amounts?  
       2. If you saw $16, what did you think the other envelope had?  
       ```  
     - **House Ledger:** A notebook for the "House" (a student volunteer) to record:  
       - Round 1: Pair ID, Student A action (K/S), Student B action (K/S).  
       - Round 2/3: Pair ID, Student A amount seen, action (K/S), Student B amount seen, action (K/S).  
       - **Chips:** Poker chips or paper slips (1 chip = 1 point). Give each student 3 chips for Round 3.  
     - Whiteboard markers, timer.  

  ---

  ### **Session Flow**  
  **Total: 55 minutes**  

  #### **0. Setup (5 min)**  
  - Assign one student as the **House** (keeps ledger, enforces rules).  
  - Hand out envelopes randomly. Students note their ID but **do not open**.  
  - Hand out prediction sheets. Students answer "BEFORE" questions (2 min), then collect sheets.  
  - **Facilitator says only:**  
    > "In each round, you’ll be paired. Decide: keep your envelope or switch with your partner. Points = money inside. Goal: Maximize points. House records actions. Envelopes stay sealed unless told to peek."  

  #### **1. Round 1: Blind Round (12 min)**  
  *(Goal: Feel the intuitive pull to switch when blind. Sets up paradox.)*  
  - **Pairing:** House randomly assigns students into 8 pairs.  
  - **Action:**  
    > "Without opening envelopes: Decide keep or switch. Write choice privately on scrap paper. House records."  
  - **Play:** Students decide silently (1 min). House records actions (e.g., "Pair 1: A keeps, B switches").  
  - **Repeat:** Re-pair students randomly 3x (3 decisions/student). Envelopes stay sealed.  
  - **Facilitator silence:** No hints. If asked: "Decide based on instinct."  

  #### **2. Round 2: Peek Round (20 min)**  
  *(Goals: Generate switching argument in their words; collide with distribution ceiling.)*  
  - **Pairing:** House assigns new random pairs.  
  - **Action:**  
    > "Open your envelope, see the amount, then reseal it. Decide: keep or switch. House records your amount and choice."  
  - **Play:**  
    - Students peek, reseal, decide (2 min/pair).  
    - House records amounts seen and choices (e.g., "Pair 3: A saw 16, switched; B saw 8, kept").  
  - **Facilitator silence:** If students ask, "Base your choice on what you see."  

  #### **3. Round 3: Friction Round (10 min)**  
  *(Goal: Highlight scale/cost indifference as a symptom.)*  
  - **Pairing:** New random pairs.  
  - **Action:**  
    > "Peek again. Now, switching costs 1 chip (hand chip to House). Decide: keep or switch with cost."  
  - **Play:** Students use chips. House records amounts/choices/chip deductions.  

  #### **4. Settling & Revealing (8 min)**  
  - House collects all envelopes.  
  - Facilitator reveals **Master Ledger** amounts. House calculates points:  
    - Points = Final amount (after switches) minus chips paid.  
    - **Closed system:** Total points must equal total money minus chips. Write totals on board.  
  - Return prediction sheets. Students answer "AFTER" questions (3 min).  

  ---

  ### **Debrief (15 min)**  
  *(Map gameplay to your four goals. Start open-ended, then guide.)*  
  1. **Goal 1: Seductive argument**  
     - Ask: *"In Peek Round, why did some switch after seeing their amount?"*  
     - Listen for: "I thought I might double," "Half or double equally likely," "Average gain." Write quotes on board.  
     - **Link:** "You articulated the paradox: seeing X, you think switching gives 50% chance of 2X or X/2, so expected gain is positive."  

  2. **Goal 2: Distribution ceiling**  
     - Ask: *"What amounts did you see? Max? Min?"*  
     - Students report (min=2, max=32). Ask: *"If you saw $32, what could the other envelope be? Could it be $64?"*  
     - **Reveal distribution:** Show amounts on board.  
     - **Link:** "When you saw 32, you *knew* switching would lose money. The 'half or double' rule breaks at the ceiling."  

  3. **Goal 3: Scale/cost indifference**  
     - Ask: *"In Friction Round, did the switch cost change your choice? Did amounts like $4 vs. $16 feel different?"*  
     - Listen for: "Cost hurt small amounts," "Same logic for $4 and $4 billion."  
     - **Link:** "The switching argument treats $4 the same as $4 billion—and ignores costs. That indifference is a clue it’s flawed."  

  4. **Goal 4: Opening isn’t inert**  
     - Ask: *"In Blind Round, did switching feel profitable? In Peek, did seeing the amount change that?"*  
     - **Contrast:**  
       - Blind: Total points identical for "all keep" vs. "all switch" (swaps cancel).  
       - Peek: Some gained by switching (e.g., saw 2, switched to 4), some lost (e.g., saw 32, switched to 16).  
     - **Link:** "Peeking let you condition on X. That *can* beat always keeping (e.g., switching at X=2), but always switching can’t beat always keeping in a closed system."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"I won’t switch—points are trivial!"**  
     - *Fix:* Emphasize: "Treat points as a measure of success. We’ll rank results."  

  2. **"This is the two-envelope paradox—always switch!"** (Early spoiler)  
     - *Fix:* "Great! Test that theory and see if it holds." (After revealing amounts, they’ll see losses at $32).  

  3. **Arithmetic errors in ledger**  
     - *Fix:* House uses calculator. Facilitator verifies total money = sum of amounts.  

  4. **Students peek but don’t reseal**  
     - *Fix:* House monitors. "Reseal or lose points."  

  5. **Uneven pairs (13 students)**  
     - *Fix:* Facilitator plays or one trio rotates "sit out" per round.  

  ---

  ### **What the Activity Can’t Replicate**  
  **The impossibility of a uniform prior over all amounts.**  
  - **Why:** Students experience a *finite* distribution (max=32), but the paradox assumes an *infinite* prior (any X can always be doubled).  
  - **Minimal Lecture Fix (in debrief):**  
    > "In our game, amounts capped at 32. But imagine no cap: could every amount X *always* have a 50% chance of 2X? If X is huge, 2X is huger—yet we’d need equal probability for all X. But probabilities must sum to 1, and infinite sums explode. Math forbids it."  

  ---

  ### **Facilitator Script**  
  **Allowed phrases (repeat as needed):**  
  - "Decide based on the rules."  
  - "House, record choices."  
  - "Peek/reseal now."  
  - "Switch costs a chip."  
  - "What did you notice?"  

  **Never say:** "Expected value," "prior," "paradox," or "distribution" until debrief.  

  ---  
  This design ensures students:  
  - Generate the switching argument organically (Goal 1),  
  - Discover the ceiling by seeing $32 (Goal 2),  
  - Experience scale/cost indifference as jarring (Goal 3),  
  - Contrast blind/peek outcomes (Goal 4).  
  The ledger makes gains/losses visceral, and the debrief ties gameplay to philosophy.
