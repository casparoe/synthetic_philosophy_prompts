  ### Decision Tree for Non-Classical Treatments of Inconsistency  
  **Root Node (Why chosen?** The Liar sentence cleanly forces a choice between preserving classical truth values and revising semantics/consequence, as it cannot be consistently evaluated without abandoning bivalence or explosion.)  
  **Q1 (Liar Sentence (a)):** Consider the sentence, "This sentence is false." What is its truth value?  
  - **A1:** It is both true and false. → Go to Q2A  
  - **B1:** It is neither true nor false. → Go to Q2B  

  **Q2A (Revenge Variant (c) for Glut Branch):** Consider a new sentence, "This sentence is not true." What is its truth value?  
  - **A2A:** It is both true and false. → Go to Q3  
  - **B2A:** It is neither true nor false. → Go to Q3  

  **Q2B (Revenge Variant (c) for Gap Branch):** Consider a new sentence, "This sentence is not true." How do you avoid contradiction?  
  - **A2B:** We cannot express it—truth predicates are hierarchical (e.g., "true" in this sentence must be "true-in-a-higher-language"). → Go to Q3  
  - **B2B:** We weaken logic to block the inference from "not true" to "true" (e.g., with a non-classical conditional). → Go to Q3  

  **Q3 (Scientific Theory (f)):** An inconsistent theory (e.g., early calculus) predicts observations accurately. What is its status?  
  - **A3:** It is true, and the inconsistency is real (some contradictions are true). → Go to Q4  
  - **B3:** It is not true, but we use it instrumentally by isolating inconsistencies (e.g., "chunk and permeate"). → Go to Q4  

  **Q4 (Legal Code (d)):** A legal code has two valid statutes: one requires act X, the other forbids X. What should a judge do?  
  - **A4:** Resolve the conflict (e.g., using precedent or meta-rules) so only one obligation applies.  
  - **B4:** Accept both obligations (X is required and forbidden).  

  ---

  ### Leaves (Positions) and Tags  
  *Each leaf is defined by the path (e.g., A1→A2A→A3→A4). Tags indicate:  
  1. Classical principle surrendered (if any).  
  2. Central claim (truth/consequence/acceptance).  
  3. Scope of classical logic (wholesale revision/local restriction/multiple relations/stipulative).*  

  | Path              | Position Name           | Surrendered Principle   | Central Claim       | Scope of Classical Logic |  
  |-------------------|-------------------------|-------------------------|---------------------|--------------------------|  
  | A1→A2A→A3→A4     | Dialetheism (Realist)   | Explosion              | Truth              | Local restriction        |  
  | A1→A2A→A3→B4     | Dialetheism (Normative) | Explosion              | Truth, Acceptance  | Local restriction        |  
  | A1→A2A→B3→A4     | Instrumentalist Glut    | Explosion              | Consequence        | Local restriction        |  
  | A1→A2A→B3→B4     | **Empty (Incoherent)**  | —                      | —                  | —                        |  
  | A1→B2A→A3→A4     | FDE-Style (Realist)     | None (retains both)    | Truth              | Local restriction        |  
  | A1→B2A→A3→B4     | FDE-Style (Normative)   | None (retains both)    | Truth, Acceptance  | Local restriction        |  
  | A1→B2A→B3→A4     | Instrumentalist G/G     | Explosion              | Consequence        | Local restriction        |  
  | A1→B2A→B3→B4     | **Empty (Unattractive)**| —                      | —                  | —                        |  
  | B1→A2B→A3→A4     | Tarskian Hierarchist    | Excluded Middle        | Truth              | Local restriction        |  
  | B1→A2B→A3→B4     | **Empty (Incoherent)**  | —                      | —                  | —                        |  
  | B1→A2B→B3→A4     | Tarskian Instrumentalist| Excluded Middle        | Consequence        | Local restriction        |  
  | B1→A2B→B3→B4     | **Empty (Incoherent)**  | —                      | —                  | —                        |  
  | B1→B2B→A3→A4     | **Empty (Unexplored)**  | —                      | —                  | —                        |  
  | B1→B2B→A3→B4     | **Empty (Incoherent)**  | —                      | —                  | —                        |  
  | B1→B2B→B3→A4     | Paracomplete (e.g., Field)| Excluded Middle        | Consequence        | Local restriction        |  
