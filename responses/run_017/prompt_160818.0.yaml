  ### Notes on the Tree  

  #### **Flagged Pairs**  
  - **Pure Glut (A1→A2A) vs. Gap-Glut (A1→B2A):** These cannot be separated by the tree. The only difference is their treatment of revenge sentences (Q2A). Pure glut (e.g., LP) assigns "both" to revenge; gap-glut (e.g., FDE) assigns "neither." No concrete case beyond revenge distinguishes them.  
  - **Dialetheism vs. Paraconsistent without Gluts:** The tree assumes (per Working Assumption 2) that accepting gluts (A1) implies rejecting explosion. Non-glut paraconsistency (e.g., for inconsistent databases) is captured in instrumentalist leaves (e.g., A1→A2A→B3→A4), where central claim is about *consequence*, not truth.  

  #### **Empty Cells and Diagnoses**  
  - **Incoherent (5 leaves):**  
    - Paths like B1→A2B→A3→B4: Tarskian views reject semantic universality, so accepting true contradictions in science (A3) or norms (B4) is inconsistent.  
    - A1→A2A→B3→B4: If inconsistencies are not real (B3), accepting normative gluts (B4) is unmotivated.  
  - **Unattractive (1 leaf):** A1→B2A→B3→B4: Gap-glut with instrumental science but normative gluts is theoretically possible but rarely defended.  
  - **Unexplored (1 leaf):** B1→B2B→A3→A4: Paracomplete views (e.g., Field) reject true contradictions, so A3 is unexplored.  

  #### **Working Assumption Checks**  
  1. **Gap Theories and Explosion:**  
     - **Settled:** Gap theories (e.g., B1 paths) block explosion only if validity is defined as *preservation of non-falsity* (Kleene logic). If validity is *preservation of truth*, explosion holds.  
     - **Tree Impact:** No change needed. The handout fixes validity as *preservation of truth* (standard in literature), so gap theories (B1) are not paraconsistent.  
  2. **Glut vs. Paraconsistent:**  
     - **Settled:** Working Assumption 2 holds. Rejecting explosion (via A1) implies tolerance for true contradictions. The tree merges them.  
     - **Separating Case (if needed):** Use the **Moral Dilemma (g)**: "You ought to do X and ought not to do X, all things considered."  
       - If you say, "Both obligations hold," you accept gluts.  
       - If you say, "Obligations are non-truth-apt" or "Resolve the conflict," you reject gluts.  
       - *Not added to tree*: Positions rejecting gluts (e.g., some deontic logics) would collapse into B1/B3/B4 paths.  

  #### **Engineering vs. Truth Stances**  
  - **Instrumentalist Leaves (e.g., A1→A2A→B3→A4, B1→A2B→B3→A4):** Central claim is about *consequence* (managing inconsistency), not truth. Paraconsistent reasoning (e.g., for scientific theories) does not entail a commitment to true contradictions.  
  - **"Chunk and Permeate" (B3):** Deserves its own leaf (e.g., A1→B2A→B3→A4) as it explicitly isolates inconsistencies (engineering) rather than collapsing into instrumentalism.  

  #### **Missing Cases in Tree**  
  - **Vague Predicate (b), Sources (e), Moral Dilemma (g), Disjunctive Syllogism (h), Curry (i):** Covered implicitly:  
    - Vagueness: Gap/glut leaves imply rejection of excluded middle (B1, A1→B2A).  
    - Sources (e) and Moral Dilemma (g): Normative leaves (B4) accept conflicting obligations/beliefs.  
    - Disjunctive Syllogism (h): Rejected in glut (A1) and some paracomplete (B1→B2B) paths.  
    - Curry (i): Handled by non-classical conditionals in B1→B2B paths.  

