  **Winner**: **Relational (Contextual Integrity)** refined with **Enduring Records**. It scored best but needed clauses for recording (your Case 2) and inference (Case 4). Pluralist "won" trivially but fails your request for one principle.  

  ---

  ### (c) Verdicts on New Cases  
  1. **Smart speaker records guest conversation**:  
     *Violation*. Context: Home conversation. Guest didn’t consent (Clause 1), recording creates durable trace (Clause 2).  
  2. **Employer infers pregnancy from typing speed**:  
     *Violation*. Context: Workplace. Inference (Clause 3) bypasses disclosure; leverage risk (Clause 4).  
  3. **Stranger reconstructs face from genome data**:  
     *Violation*. Context: Bodily autonomy. Inference (Clause 3) exceeds norms; potential leverage (Clause 4).  
  4. **City stores license-plate data for 30 days**:  
     *Gray area*. If used for traffic management, may be context-appropriate (Clause 1). If searchable without cause, violates (potential leverage/Clause 4).  
  5. **Friend finishes your sentences**:  
     *Not a violation*. Context: Friendship (Clause 1 exception). No record (Clause 2), no harmful inference (Clause 3).  

  ---

  ### (d) Where Your Intuitions Are Unreliable  
  **Your verdict I can’t accommodate**: **Case 7 (public scraping)**. You see no violation, but my principle flags it:  
  - *Why it violates*: Scraping 15 years of public posts creates an *enduring record* (Clause 2) outside social context (e.g., a stranger doing this isn’t "public interaction").  
  - **I’d ask you to give up this verdict**. It’s inconsistent with your anger in Case 8 (same info sold). If creating a record is harmless (7), selling it (8) should be only *marginally* worse, but you call 8 "a clear violation by a wide margin." My principle explains this gap: the record in 7 enables leverage in 8.  

  **Other strains**:  
  - **Case 2 (café photo)**: You’re "genuinely annoyed" but it lacks leverage. I accommodate it via Clause 2 (recording), but it’s the weakest link.  
  - **Case 9 (phone database)**: You’re untroubled, but others panic. My principle agrees with you (no observation/use = no violation), but public distrust of databases is rational.  

  ---

  ### (e) Explaining Away Problematic Verdicts  
  For **Case 7 (public scraping)**:  
  > *Defender’s argument*: "You feel unviolated because you focus on *disclosure*, not *use*. You ‘put it there’ for engagement, not for a stranger to build a covert dossier. But if that dossier *exists* (even unseen), it risks exposure or misuse – which violates contextual norms. Your reaction confuses *accessibility* with *appropriateness*. Public posts are for transient viewing, not permanent aggregation."  

  For **Case 2 (café photo)**:  
  > *Defender’s argument*: "Your annoyance stems from the *symbolic* harm of recording, not material risk. The photo creates a durable ‘eye’ in your mental space, altering the café’s context from casual to monitored. But since it’s deleted and unused, the violation is minor – like a mosquito bite, not a stab wound."  

  For **Case 9 (phone database)**:  
  > *Defender’s argument*: "You’re untroubled because no *human* observer exists. But automated systems *are* ‘observing’ via algorithms – they just haven’t acted yet. Your calm is intuitive but risky: databases enable future violations at near-zero cost (e.g., Case 4)."  

  ---

  ### (f) Your One-Sentence Definition  
  **"Privacy is the assurance that others won’t cross lines – by watching, recording, or guessing – in ways that break the trust of a relationship or situation."**  

  *Why this works*:  
  - Plain language ("watching, recording, guessing" for observation/recording/inference).  
  - Anchored to "trust" and "relationships/situations" (context).  
  - Explains violations without jargon: your neighbor (3) breaks home trust, the supermarket (4) guesses behind your back, the dossier (10) betters intimacy.  
  - Survives cheap inference: guessing (e.g., pregnancy prediction) "crosses a line" when detached from context.  

  ---

  ### Final Note  
  Your intuitions are sharp but underestimate *recording* (Cases 2, 7, 10’s dossier) and *relational context* (anger at insurer vs. stranger in 7/8). The principle holds because it mirrors lived experience: we judge privacy by *who* does *what* and *why*, not just what’s known. If your readers protest Case 7 ("But it’s public!"), remind them: a public park isn’t a panopticon.
