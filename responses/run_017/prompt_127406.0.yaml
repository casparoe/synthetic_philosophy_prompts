answer: |-
  ## Sestina: On Supererogation

  We map the borders of the things we **owe**,
  The strict accounting, duty's measured **give**.
  Beyond that line, where saints and strangers **praise**
  Arises freely, yet invites no **blame**
  For absence. This is mercy's fragile **grace**,
  A gift exceeding what is deemed **enough**.

  Is duty's rigid measure ever **enough**?
  Or must we stretch beyond the debt we **owe**,
  To glimpse the possibility of **grace**?
  The generous hand, compelled to freely **give**,
  Seeks no reward, deflects the thought of **blame**,
  Content with silence, not demanding **praise**.

  Yet human hearts, they hunger for that **praise**.
  To hear "Well done!" when we have done **enough**.
  A subtle shift: the missed gift earns soft **blame**
  (Not uttered loud, but felt). Is this what's **owe**d?
  Or does the extra measure that we **give**,
  Through expectation, harden fragile **grace**?

  This is the fear: that every act of **grace**
  Resets the baseline. Yesterday's **praise**
  For sacrifice becomes tomorrow's **give**-
  Required, normal. Where was once **enough**,
  Now stands a heavier, newer debt we **owe**,
  And failure draws a sharper sting of **blame**.

  Is it confusion? Or the creeping **blame**
  That poisons freely offered, purest **grace**?
  Do we resent the height we cannot **owe**,
  Projecting failure onto those we **praise**?
  Does envy whisper "Was that *truly* **enough**?"
  When witnessing the kindness others **give**?

  Consider: Duty's ground is firm. We **give**
  The core required, escaping rightful **blame**.
  The extra mile is always extra **enough**.
  It lives precisely *as* unforced **grace**,
  A testament we rightly hail with **praise**,
  Existing *outside* chains of what we **owe**.

  The ratchet bites when *we* forget what's **owe**d,
  Confusing **praise** for debt, mistaking **grace**
  For **give**-required. Hold **enough**. Forgo false **blame**.

  ---

  **Closing Analysis: Commitment and Liberties**

  *   **Contested Reading Committed To:** This poem aligns with a **Secular Moderate Reductionist** view of supererogation. It affirms supererogation as a genuine and distinct moral category: acts that are morally good, praiseworthy to perform, yet not morally required and thus *not blameworthy to omit*. The "ratchet effect" is presented as a *perceptual and social error*, not an inherent feature of supererogation itself. Duty ("what is owed") provides a stable baseline. The erosion occurs when observers (or even the agent) mistakenly convert the praiseworthy act into a new obligation, blurring the crucial line between duty and grace. The poem's verdict is that the ratchet is a confusion ("Is it confusion?") born of envy, forgetfulness, or faulty social pressure, not a necessary consequence of the act. The final tercet explicitly separates the categories: duty is firm ("what's owed"), praise is distinct, grace remains unforced, and "enough" defines the boundary that avoids "false blame" for omission.
  *   **Liberties Taken:**
      1.  **Personification & Imagery:** The poem uses personification ("human hearts... hunger," "envy whispers") and metaphors ("map the borders," "duty's ground is firm," "fragile grace," "ratchet bites") to make abstract concepts visceral, which philosophical prose avoids. The imagery of hardening ("harden fragile grace") and poisoning ("poisons... grace") dramatizes the perceived ratchet effect.
      2.  **Ambiguity of "Grace":** While acknowledging the theological root ("mercy's fragile grace"), the poem primarily uses "grace" in a secular sense: an elegant, unmerited kindness or favor exceeding requirement. This leverages the word's resonance without making the concept devotional, focusing on the social/moral dynamic. The theological origin is acknowledged ("category comes out of a distinction") but not centered.
      3.  **"Enough" as Pivot:** The word "enough" is used flexibly – as the boundary of duty ("deemed enough"), a question of minimal sufficiency ("Is duty's measure ever enough?"), and a moral imperative to recognize limits ("Hold enough"). This stretches its philosophical precision for poetic resonance and structural necessity (as an end-word), emphasizing the *concept* of sufficiency central to defining supererogation's "beyond."
      4.  **Focus on Social Perception:** The poem spends significant energy exploring how the *observer's* reaction (praise potentially morphing into expectation, then blame) drives the perceived ratchet, rather than solely focusing on the agent's internal motivation or the act's intrinsic properties. This highlights the social dimension of the confusion.
      5.  **The Final "Hold":** The imperative "Hold **enough**. Forgo false **blame**." is a poetic, almost activist, stance. It asserts a moral prescription implied by the chosen reading (that recognizing the stability of "enough" and rejecting blame for omission is crucial) but stated more forcefully than a purely analytical description might.

  The sestina's relentless rotation enacts the entanglement of these six concepts, while the envoy's compression forces the critical distinctions and the rejection of the false ratchet ("false blame") into sharp, pressured focus, aiming to leave the reader with the sense that supererogation's space *can* hold open if these terms are rightly understood and held apart.
