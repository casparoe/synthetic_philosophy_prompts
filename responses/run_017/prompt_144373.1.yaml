prompt: |-
  You are an epistemologist who works on skepticism and the structure of evidence. Take your time, try out more than one candidate principle before settling, and give me a principle rather than a reading list: I want the shape of my own reactions made explicit, including where they don't hold together.

  My friend and I argued late into the night about which skeptical scenarios actually have any grip on a person. I went through my own reactions case by case afterwards, and they don't line up the way I expected.

  - Lifelong envatment: my brain has been in a vat since birth and every apparent experience has been fed to me. I feel nothing. I don't treat it as a live possibility and I don't think it should change what I do.
  - Total deception by a Cartesian-style demon of unlimited power and malice: equally cold, and I think for the same reason.
  - The five-minute hypothesis, the one where the world sprang into existence five minutes ago complete with my memories: cold as well.
  - Recent envatment: everything up to this morning was as I remember it, and since this morning my experience has been fed to me. This one genuinely frightens me, and I feel I ought to take it seriously.
  - The impostor case: everyone I know was replaced overnight by someone else who behaves indistinguishably. This frightens me more than recent envatment, even though the class of beliefs it falsifies is much narrower.
  - The paperwork case: lifelong envatment, except that there is a drawer in the house I have never had any reason to open, and inside it is the lab's documentation. This frightens me more than either of the previous two, even though my evidence is exactly what it is in the plain lifelong case.
  - Whether the simulated life is better or worse than the real one makes no difference to how seriously I take the scenario. My friend insisted it must.

  So force seems to track something like the availability of a check, or the presence of a transition I can locate in my own history, or the narrowness of the error — but none of those gets all seven verdicts, and the first three cases are indiscernible from the fourth in every respect I can name, which makes my fear in the fourth look arbitrary.

  Is there one principle behind most of these? State it precisely, one clause at a time, and say which case motivates each clause. Then tell me what it predicts about the case I keep going back and forth on: a simulation run by agents who have no interest in me at all, where I am a by-product of someone else's experiment, with no motive, no malice, and no check available even in principle. Finally, be blunt about which of my verdicts any such principle would force me to give up, and whether the ones I would have to surrender are the cold ones or the frightened ones. If no single principle is available, say what each candidate costs me and which verdict you would overturn yourself.
reasoning: |-
  Okay, the user presents a fascinating puzzle about their intuitive reactions to various skeptical scenarios. They've noticed their emotional responses don't neatly align with traditional epistemological frameworks - scenarios that should be equally threatening feel radically different. 

  First, I need to unpack their core confusion: why do lifelong deception scenarios feel cold while recent ones trigger visceral fear? The paperwork case is particularly telling - identical to lifelong envatment except for that one drawer, yet it elicits stronger anxiety. Their friend's insistence about simulation quality being relevant also needs addressing, though the user reports it doesn't impact their reactions.

  Hmm... their proposed explanations (availability of checks, historical transitions, error narrowness) all fail to cover all seven cases. The key challenge is reconciling why the first three scenarios feel interchangeable while the fourth - recent envatment - triggers dread despite identical epistemic structure. 

  I'm considering an "epistemic vulnerability" principle. What if their reactions track whether the deception creates actionable doubt? In lifelong cases, every possible check would be compromised from the start - the skepticism is globally paralyzing and thus pragmatically inert. But recent deception? Suddenly there's a before-and-after - they could in principle compare current experiences against genuine memories (even if imperfectly). The impostor case heightens this because it targets specific relationships - they might still trust their own judgment about the world generally. 

  The paperwork case is brilliant - it introduces a concrete, localized vulnerability. That drawer represents a hypothetical test that should work if the world is real, making the deception feel contingent and thus more threatening. Simulation quality doesn't matter because it doesn't affect this vulnerability structure.

  For their unresolved case - the indifferent simulation - the principle predicts moderate fear. No malice reduces threat, but no checks means persistent vulnerability. They'd feel uneasy but not terrified like with the impostors.

  This framework would force them to surrender their indifference to the five-minute hypothesis though - it should trigger similar vulnerability to recent envatment. If they can't accept that, we might need to incorporate emotional proximity (deception about personal history vs cosmic history). 

  Ultimately their reactions reveal a deeply human truth: we fear deception more when it feels local and testable, not when it's total and inescapable. The drawer isn't just evidence - it's the symbol of our fragile grip on reality.
answer: |-
  Here's a principle derived from your reactions, built clause-by-clause, motivated by your cases, and tested against your unresolved scenario:

  **The Principle of Actionable Doubt (PAD):**

  1.  **A skeptical scenario generates significant epistemic anxiety only if it posits a *local*, *contingent* flaw in the world's apparent causal-informational structure.** (Motivated by **Lifelong Envatment/Demon/Five-Minute Hypothesis** vs. **Recent Envatment/Impostor/Paperwork**). The first three scenarios describe the *fundamental, immutable structure* of your entire experiential history. There is no "before" the flaw, no "outside" reference point. The flaw *is* reality. Recent envatment, impostors, and the paperwork introduce flaws that are *localized in time* ("since this morning"), *localized in scope* (specific people replaced), or *contingent on undiscovered evidence* (the paperwork). The world *was* fundamentally trustworthy *until recently* or *in this specific aspect*, or it *could have* revealed the flaw under different circumstances.

  2.  **This flaw must imply the *potential availability of evidence* that could *rationally have been accessed* but *was not*, or *will be systematically obscured*.** (Motivated by **Recent Envatment**, **Impostor Case**, and crucially the **Paperwork Case**). In recent envatment, evidence from *before* this morning (memories, records) *should* still be reliable guides *if* the world remained consistent, but the *new* inputs are deceptive. In the impostor case, evidence *about your specific loved ones* (subtle behaviors, shared secrets) *could* have been accessed more carefully, but is now systematically obscured by perfect mimicry. The **Paperwork Case** is the strongest motivator: The existence of the drawer and its *potential* contents represent evidence that *should be accessible* in a non-envatted world and *would* definitively reveal the deception *if looked for*. Its existence makes the deception feel contingent and discoverable *in principle*, contrasting sharply with the lifelong case where *no* evidence could ever exist to reveal the truth from within.

  3.  **The emotional weight correlates with the *personal significance* and *practical entanglement* of the beliefs potentially falsified, relative to the scope of the flaw.** (Motivated by **Impostor Case > Recent Envatment**). Both recent envatment and the impostor case involve localized, contingent flaws (clause 1) and obscured evidence (clause 2). However, the impostor case targets a specific, emotionally charged domain (your relationships) with high personal significance and immediate practical consequences (trust, intimacy, shared history). Recent envatment falsifies a broader range of beliefs (everything since this morning), but the *personal entanglement* and *emotional weight* of losing specific, intimate connections feels more acute than the more general deception about the external world. The flaw's *scope* is narrower in the impostor case, but its *personal impact* per falsified belief is vastly higher.

  4.  **The perceived *intentionality* or *motive* behind the deception is secondary to the structure defined in clauses 1-3, but can modulate the *affective character* of the anxiety (e.g., fear vs. unease).** (Motivated by your indifference to the "better/worse simulation" aspect and the **Impostor Case**). Malice (demon, impostor) may heighten *fear*, while indifference might heighten *existential dread* or *alienation*, but the *core epistemic anxiety* requiring taking the scenario seriously stems from the structural vulnerability described in 1-3. The paperwork case lacks a clear malicious actor but still frightens you deeply because of the contingent flaw and potential evidence.

  **Predictions for the Indifferent Simulation Case:**

  *   **Flaw Structure:** Likely **Local/Contingent**. "By-product of someone else's experiment" implies the deception is *not* fundamental to the entire structure of your experiential history from birth. There was likely a "real" world before the simulation began (even if simulated itself, the *transition* marks a contingent flaw). It's a *specific* intervention.
  *   **Evidence Availability:** **Systematically Obscured, No Check Available (in principle)**. This directly violates clause 2. No evidence could rationally reveal the truth, even in principle. This mirrors the lifelong envatment case in this crucial aspect.
  *   **Personal Significance/Entanglement:** **High** (it potentially falsifies *all* your experiences within the simulation), but...
  *   **PAD Prediction:** **Moderate Anxiety, but significantly less than Recent Envatment/Impostor/Paperwork, and more than Lifelong Envatment.** Clause 1 (local/contingent flaw) generates *some* anxiety. The lack of motive might make it feel less *threatening* (reducing fear) but more *alienating* or *absurd*. However, the **critical failure of Clause 2 (no check in principle)** drastically reduces the *actionable* nature of the doubt. It lacks the contingent discoverability of the paperwork case and the localized evidence obscurity of recent envatment/impostors. The principle predicts you *should* feel less compelled to take it seriously as a live possibility requiring action than the cases where evidence *could* have been there but is hidden. You might feel existential unease, but not the sharp fear associated with scenarios where "I *could* have known" or "I *should* be able to find out."

  **What PAD Forces You To Give Up (and Why):**

  PAD forces you to **give up your indifference to the Five-Minute Hypothesis (cold verdict)** and treat it more like Recent Envatment.

  *   **Why?** The Five-Minute Hypothesis features a **highly localized, contingent flaw** (the world sprang into existence 5 minutes ago). It implies the **systematic obscuration of evidence** that *should* exist *if* the world were old (e.g., light from distant stars, geological layers, carbon dating traces, the *apparent* consistency of memories with a long past). You *could rationally have accessed* evidence contradicting the 5-minute timeline (looking at stars, digging geology) but that evidence is fabricated/falsified *by the scenario itself*. This perfectly fits Clause 1 (local/contingent flaw) and Clause 2 (obscured evidence that should/could have been accessible). Clause 3 (significance) also applies – it potentially falsifies a vast swathe of your beliefs about history, causality, and the age of the universe. PAD predicts this *should* generate significant anxiety, similar to recent envatment. Your cold reaction to it is the anomaly PAD identifies.

  **Which Verdicts Survive?**

  *   **Survive (Aligned):** Lifelong Envatment/Demon (Cold - lacks Clause 1 & 2), Recent Envatment (Frightened - Clauses 1, 2, 3), Impostor Case (More Frightened - Clauses 1, 2, 3 - higher Clause 3 weight), Paperwork Case (Most Frightened - Clauses 1, 2 - strong evidence contingency), Indifference to Better/Worse (Aligned - Clause 4).
  *   **Surrendered (Misaligned):** Five-Minute Hypothesis (Cold verdict must shift to Anxious/Frightened).
  *   **Clarified/Modulated:** Indifferent Simulation (Moderate unease/dread, less fear than scenarios with discoverable evidence).

  **In essence, PAD argues your fear tracks the possibility of *epistemic near-misses* and *contingent failures of access* to revealing evidence within an otherwise apparently trustworthy structure.** It explains the dread of the paperwork drawer (the *perfect* near-miss), the terror of the impostor (a targeted, personal near-miss), and the relative coldness of the demon (no possible near-miss, only total defeat). The Five-Minute Hypothesis, under this lens, *is* such a near-miss scenario – hence your coldness towards it is the verdict that must be surrendered. The principle makes explicit that your core reaction is not to doubt *as such*, but to the specific vulnerability created by a *recent, localized, or discoverable* deception within what *seemed* like a reliable world. Total deception from the start nullifies vulnerability because there's no baseline trust to violate.
