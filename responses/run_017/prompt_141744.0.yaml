prompt: |-
  I sit on the novel-entity review committee at my university — we look at anything a lab wants to build that isn't a standard model organism, so engineered cell lines, stripped-down synthetic genomes, cell-free systems, self-assembling junk the bioengineers dream up. We meet every couple of weeks, eight to twelve proposals a term, and one of the boxes we have to tick is whether the thing is a living organism, because that decides whether it needs the full containment permit and the lawyer's sign-off or can just be handled on the open bench. Our charter never defines living organism, so we've been doing it case by case and it's become embarrassing: last month we ruled that a bacterium with a heavily reduced synthetic genome was alive and that a self-replicating RNA in a cell-free extract was not, and I don't think any of us could explain why those two came out differently. I took one philosophy course years ago and have this vague memory of a metabolism-versus-replication split and something about autopoiesis, but I don't trust my recollection and I can't tell which of those ideas is actually load-bearing and which is decoration. So: I don't want a survey of definitions or anything you'd have to look up — no reading list, no citations, just your own reasoning. What I want is a decision procedure I can photocopy and hand to people: an ordered list of questions to run through in a meeting, what counts as a good-enough answer to each, where the procedure stops with a no, and where it has to throw up its hands and say this is a values call rather than a question of fact, because our biosafety officer signs off on whatever we write and he will not accept a judgement dressed up as a test.

  Two constraints from our setting make this less tidy than the textbook version. First, we're only permitted to reason from what we can actually observe in a thirty-day window with the assays we have: we can't certify a capacity for Darwinian evolution or survival across centuries, only what happened while we watched, so the procedure has to say how to use short-run observations as evidence for long-run capacities without quietly pretending the proxy is the thing its supposed to be measuring. Second, the committee is two engineers, an ethicist, a microbiologist and me, and nobody except maybe the ethicist has any philosophy training, so any distinction you keep has to be statable in plain language — but please don't flatten out the distinctions that are doing real work, I'd rather keep an awkward step than lose it. One of our engineers also keeps insisting that any definition requiring reproduction rules out sterile individuals (a mule, a worker ant, a cell line that can't divide), and I genuinely can't tell whether that's a decisive objection or a debating trick, so the procedure needs a place for it.

  Please run the finished procedure on five of our actual cases: the self-replicating RNA in cell-free extract (copies itself if we keep feeding it nucleotides, no membrane, no metabolism of its own); an aggregate of frog cells that swims around, heals itself when cut, and eventually dies out without ever reproducing; a freeze-dried bacterial stock sitting in our minus-eighty freezer — I have a feeling a decent procedure will rule that one not alive, and I'd definately hate that, because then a chunk of how we store things has no principled basis, so tell me straight if that's where it lands; a transmissible cancer cell line that gets passaged between animals and evolves as it goes; and a self-replicating 3D-printed machine that assembles copies of itself from parts we supply, which the engineers submitted half as a joke and half to make a point. Where the procedure can't separate two of these, say so rather than forcing a verdict. Then tell me where the whole thing will misfire — the kind of submission it will handle badly — and for each part of what you give me, say how confident you are in it and single out the one step you're least sure about.
reasoning: |-
  Okay, let me tackle this complex request. The user is part of a university committee that needs a practical decision procedure to determine if novel biological entities qualify as "living organisms" for biosafety purposes. They've described frustrating inconsistencies in their current approach and want something actionable.

  First, I need to understand their core requirements: a step-by-step flowchart using only observable 30-day evidence, plain language for non-philosophers, and explicit handling of edge cases like sterile organisms. The procedure must avoid philosophical jargon while preserving meaningful distinctions.

  The key challenges I see are:
  - Defining life through observable proxies without overinterpreting short-term data
  - Resolving the reproduction paradox (sterile organisms)
  - Creating clear stopping points where judgments become value-based
  - Applying this consistently to their five test cases

  For the decision procedure, I consider grounding it in three core functional criteria: metabolic activity, self-repair, and replication. Each needs operational definitions tied to their 30-day window. The sterile organism issue can be addressed by distinguishing between individual capacity and type-level reproduction.

  The test cases reveal interesting tensions:
  - The freeze-dried bacteria case forces confrontation with dormant states
  - The 3D-printed machine tests the boundaries of biological life
  - The transmissible cancer shows how parasitic life fits the framework

  I'm least confident about the dormancy provision - it risks overextending the definition while solving their storage dilemma. The procedure will likely struggle with entities that exhibit partial or intermittent functions, like the frog cell aggregate that self-repairs but doesn't replicate.

  The user's unspoken need seems to be institutional legitimacy - they want defensible rulings that satisfy both safety officers and skeptical engineers. By marking value judgments explicitly and providing a clear audit trail, the procedure should reduce arbitrary decisions while acknowledging where science can't provide absolute answers.
answer: |-
  Here's a decision procedure designed for your committee, focused on observable functions within a 30-day window, using plain language, and explicitly marking value judgments. It prioritizes *functional criteria* observable in your lab setting.

  **Novel Entity Life Determination Procedure (NELDP)**

  *   **Purpose:** To determine if a novel entity requires classification as a "living organism" for biosafety containment purposes, based on observable functions within a standard 30-day assessment window.
  *   **Principle:** We define "living organism" operationally as an entity that demonstrates **sustained, autonomous maintenance and propagation of its organized state**. We assess this through observable functional capacities.
  *   **Rules:**
      1.  Answer questions sequentially. Stop and conclude "Not Alive (Functional)" if any "NO" is reached.
      2.  "Observed" means demonstrated under standard lab assay conditions within the 30-day assessment period.
      3.  "Autonomous" means the process originates from and is sustained by the entity's own structure/mechanisms using provided resources, without *external assembly* of core functions.
      4.  If "Requires Value Judgment" is reached, the committee must explicitly state the values/rationale used for the final call. This is an acceptable outcome.

  **The Procedure:**

  1.  **Sustained Internal Activity:**
      *   *Question:* Does the entity, when provided only with basic environmental resources (e.g., energy source, simple nutrients, buffer) *not requiring specific external catalysts added beyond initialization*, show observable, sustained internal activity/changes indicative of processing those resources to maintain its structure?
      *   *Good-enough "YES":* Observable metabolic activity (e.g., consumption of nutrients, production of waste/byproducts detectable by standard assays like pH change, gas evolution, ATP production, specific substrate depletion, heat signature), structural synthesis (e.g., membrane formation, component assembly), or directed internal motion beyond simple diffusion/brownian motion *initiated and sustained by the entity itself*.
      *   *Good-enough "NO":* Static structure; activity only occurs upon addition of complex external catalysts not part of its initial structure; activity is purely passive diffusion/decay; activity ceases immediately after initial setup without ongoing resource processing.
      *   *If NO:* **Conclude: Not Alive (Functional)**. Stop.
      *   *If YES:* Proceed to Question 2.
      *   *Confidence:* High. This targets core "metabolism" or "autopoiesis" (self-maintenance) without requiring complex philosophy. Least sure about edge cases of very slow metabolism barely detectable in 30 days.

  2.  **Active Self-Repair/Homeostasis:**
      *   *Question:* If the entity sustains minor, non-lethal damage to its structure during observation (e.g., micro-puncture, temporary stress), does it autonomously repair or reorganize itself to restore/maintain its functional integrity using available resources?
      *   *Good-enough "YES":* Observable healing of cuts/scars, reformation of membranes/organelles, restoration of function (e.g., motility, metabolic rate) after perturbation, maintenance of internal conditions against mild external changes.
      *   *Good-enough "NO":* Damage leads to permanent degradation, leakage, or loss of function without recovery; entity passively disintegrates; requires external intervention to repair.
      *   *If NO:* **Conclude: Not Alive (Functional)**. Stop. (This addresses the "fire" analogy – fire consumes fuel and spreads but doesn't *repair* itself if disturbed).
      *   *If YES:* Proceed to Question 3.
      *   *Confidence:* High. Distinguishes persistent active systems from merely active dissipative ones. Least sure about defining "minor, non-lethal damage" universally.

  3.  **Replication Capacity (Type-Level):**
      *   *Question:* Does the entity possess the inherent, observable *capacity* to generate new, persistent entities *of the same functional type* through a process originating from its own structure?
      *   *Key Points:*
          *   **Focus on TYPE, not INDIVIDUAL:** We are assessing the *kind* of entity, not this specific instance. A sterile mule is an individual of a *kind* (horse/donkey hybrid) that demonstrably *has* the capacity for reproduction. Your cell line *type* may be designed to divide, even if this vial is spent.
          *   **Observable Capacity:** Does the entity's structure/behavior within 30 days *demonstrate* this potential? (e.g., undergoing division, budding, producing spores/replication machinery, executing a self-assembly program using supplied parts).
          *   **"Persistent entities of the same functional type":** The offspring must be capable of exhibiting the same core functions (potentially after maturation) defined in Q1 & Q2.
          *   **"Originating from its own structure":** The *blueprint* and *mechanism* for making the copy must be internal/inherent to the entity's design. External assembly of copies doesn't count.
      *   *Good-enough "YES":* Observable cell division/budding; production of virions/spores; execution of a self-replication program encoded within the entity (e.g., RNA copying its sequence); production of daughter entities that themselves pass Q1 & Q2 (or clearly will after minimal development).
      *   *Good-enough "NO":* No observed replication-related activity; replication requires external assembly of the offspring's core structure/functions from scratch; entity is fundamentally incapable of initiating replication based on its design (e.g., a designed sterile organism *type*).
      *   *If NO:*
          *   *Check - Dormancy:* Is the entity in a demonstrably dormant state (e.g., freeze-dried, spore) where known revival protocols exist? *If YES:* **Requires Value Judgment: Presumed Alive (Dormant)**. (Justification: Historical/revival evidence strongly suggests core capacities are intact but suspended). *Proceed to Final Step.*
          *   *If NO Dormancy:* **Conclude: Not Alive (Functional)**. Stop.
      *   *If YES:* **Conclude: Alive (Functional)**. Stop.
      *   *Confidence:* Moderate-High on core concept. Least sure about the "dormancy" exception and defining "minimal development" for offspring. Addressing sterile individuals via TYPE is crucial and resolves the engineer's objection.

  4.  **Final Step (If reached via "Requires Value Judgment"):**
      *   The committee must explicitly state the rationale and values used for the judgment call (e.g., "Historical evidence of revival from dormancy is sufficient proxy for life functions"; "The entity's complexity and self-maintenance warrant containment despite lack of replication"). This rationale is recorded with the decision.

  ---

  **Application to Your Cases:**

  1.  **Self-replicating RNA in cell-free extract:**
      *   Q1 (Sustained Activity): YES. It processes nucleotides to build copies of itself. Internal activity (polymerization) is sustained by its structure.
      *   Q2 (Self-Repair): NO. If damaged (e.g., strand break), it doesn't repair itself. It might keep copying fragments, but the original organized state isn't restored. **Conclude: Not Alive (Functional)**. *(Matches your ruling, avoids the "no metabolism" trap by focusing on observable activity/resource processing).*

  2.  **Aggregate of frog cells (heals, no reproduction):**
      *   Q1 (Sustained Activity): YES. Moves, presumably has ongoing cellular metabolism.
      *   Q2 (Self-Repair): YES. Heals itself when cut.
      *   Q3 (Replication Capacity): NO. Designed/fundamentally incapable of producing new persistent aggregates of the same functional type. Not dormant. **Conclude: Not Alive (Functional)**. *(Highlights it's a complex system with life-like properties but not a living organism by this functional definition - it's a tissue explant or organoid).*

  3.  **Freeze-dried bacterial stock:**
      *   Q1 (Sustained Activity): NO. No observable metabolic activity or internal changes while freeze-dried. Static.
      *   Q2 (Self-Repair): N/A (Stopped at Q1).
      *   Q3 (Replication Capacity): N/A (Stopped at Q1).
      *   *Check - Dormancy:* YES. Known dormant state with established revival protocols. **Requires Value Judgment: Presumed Alive (Dormant)**. *(Rationale: Overwhelming evidence that revival restores full metabolic, repair, and reproductive capacities. This preserves your storage rationale based on potential function).*

  4.  **Transmissible cancer cell line:**
      *   Q1 (Sustained Activity): YES. Uncontrolled metabolism, growth.
      *   Q2 (Self-Repair): YES. Cells maintain homeostasis, repair damage.
      *   Q3 (Replication Capacity): YES. Cells divide, producing new cells of the same functional type (cancer cells). **Conclude: Alive (Functional)**. *(Clearly a parasitic cellular life form).*

  5.  **Self-replicating 3D-printed machine:**
      *   Q1 (Sustained Activity): ? Depends. Does it have internal activity *beyond* just the replication process? Does it process fuel just to move/copy, or is there internal maintenance? Likely **NO** if it's purely kinematic (moves parts around without internal state maintenance). If it has complex internal logic/energy management resembling metabolism, maybe YES.
      *   *Assume NO for Q1:* **Conclude: Not Alive (Functional)**. *(Stops early. The replication is impressive but likely requires external assembly of parts - its "parts" are fundamental components, not "resources" it processes internally to build itself. Its "organization" isn't autonomously maintained like a cell's).*
      *   *If YES on Q1:* Proceed.
      *   Q2 (Self-Repair): Likely **NO**. A broken arm or sensor isn't autonomously repaired using supplied raw materials; it requires external fixing or replacement of the part.
      *   *If NO:* **Conclude: Not Alive (Functional)**. *(Replication without autonomous self-repair/homeostasis makes it a replicating machine, not an organism).*

  ---

  **Where it Will Misfire:**

  1.  **Slow or Cryptic Processes:** Entities with metabolic cycles or replication timescales significantly longer than 30 days might be misclassified as "Not Alive" (especially at Q1 or Q3). *Mitigation:* Use historical data/protocols as evidence for *dormancy* if applicable, otherwise it's a limitation of the 30-day constraint.
  2.  **Highly Derived Parasites/Simplified Systems:** Entities that have lost core functions (e.g., obligate parasites relying entirely on host for metabolism/repair/replication). Might fail Q1 or Q2. *Mitigation:* Focus on *potential* function if removed from host (if observable/testable in 30 days). If not, it risks being classified "Not Alive" despite being biologically alive. This is a known edge.
  3.  **"Gray Goo" / Exponential Replication without Maintenance:** Entities that replicate incredibly fast but show no internal maintenance or repair (unlike known biology). Might pass Q3 but fail Q1/Q2. Procedure should catch this (e.g., Q1 NO or Q2 NO). *Mitigation:* The Q2 self-repair hurdle is crucial here.
  4.  **Entities Mimicking Specific Functions Artificially:** Very advanced synthetic constructs that perfectly mimic metabolism or repair via non-biological means, fooling the assays. Low probability currently, but a conceptual misfire. *Mitigation:* Relies on the "autonomous/originates from structure" clause. If it's all external programming/assembly, Q1 or Q3 should catch it.
  5.  **The "Viability" Problem:** Distinguishing a *dying* system that still shows functions from one that is robustly alive. Procedure relies on the "sustained" aspect in Q1/Q2 and the 30-day window. A system failing rapidly within the window would be NO. One slowly failing might be YES until it fails.

  **Confidence & Least Sure Step:**

  *   **Overall Confidence:** Moderate-High for practical committee use. It captures the core functional requirements observable in your window, avoids most philosophical traps, handles sterile individuals and dormancy explicitly, and forces transparency on value calls. It won't satisfy all philosophers but should provide consistent, defensible rulings for biosafety.
  *   **Confidence by Step:**
      *   Q1 (Sustained Activity): High. Directly observable proxies for metabolism/maintenance.
      *   Q2 (Self-Repair/Homeostasis): High. A critical and observable distinction.
      *   Q3 (Replication Capacity - Type): Moderate-High. The TYPE focus resolves sterility. Least sure about defining "minimal development" for offspring and the precise boundary of "inherent capacity" vs. external assembly, especially for synthetic systems.
      *   **Dormancy Exception (within Q3):** Moderate. It's pragmatic and necessary for your use case (storage), but it's the biggest conceptual leap – inferring potential from historical evidence/revival protocols. It's marked as a Value Judgment for transparency.
      *   **Value Judgment Step:** High confidence that it's necessary and correctly framed.

  **The One Step I'm Least Sure About:** **The Dormancy Exception / Value Judgment within Q3.** While essential for your practical needs (like the freeze-dried bacteria), it relies on inference beyond the 30-day observation of *this specific instance*. It's the point where the procedure most clearly uses a proxy (revival protocol success) for the underlying capacities. I'm confident it's the *right* practical solution for your committee, but conceptually, it's the shakiest ground, explicitly marked as such.
