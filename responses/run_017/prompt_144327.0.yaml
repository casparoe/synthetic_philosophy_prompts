prompt: |-
  I'm on the team that enrolls patients in a study in the emergency room, and I keep having to make judgment calls about when a signature is a real yes, so I want to know what my own verdicts add up to. Here they are.

  - She signs after I tell her the drug may cause headaches, and I leave out that in the pilot one in twenty had migraines bad enough to miss work. Not valid.
  - She signs, and I've overheard her son in the corridor telling her to just do it, it'll keep the doctor happy. I say nothing. Valid, I think, though it makes me uneasy.
  - She signs because she's picked up, wrongly, and I know it, that joining is the only way she'll get to see a specialist; she'd be referred either way and I don't correct her. Not valid, and I'd be at fault.
  - She signs believing the study is funded by a charity she supports. It's funded by a company she boycotts, we don't advertise the funder, and she'd refuse if she knew. Valid, I think — the funder isn't part of what she's agreeing to. But its the same shape as the previous one: a false belief I know about, decisive for her, that I leave alone.
  - She's on morphine and consents to one extra blood draw: fine. Same patient, same morphine, consents to the full eighteen-month protocol: not fine.
  - We tell her that most people in her situation take part, which is true and which we say partly because it works. She signs. Valid — I can't see how a true sentence invalidates anything, but it bugs me.
  - Six months in she clearly wants out: flinches, goes quiet, asks when it ends, keeps showing up, never says the words. I think her consent has lapsed even though she never withdrew it.
  - We re-ask every month as required and she says yes every time, but I'm fairly sure the only thing holding the yes up is that saying no after three yeses would feel rude. No idea what to say about this one.

  Is there one principle, or a short list, that gets all of these, stated sharply enough that it also rules on: consent given up front for samples to be used in any future study we like, consent given to a research assistant the patient takes to be a doctor, and a yes we get at 3am from someone who was asleep ten minutes earlier? Tell me too where I'm confusing invalid with valid but I shouldn't take it — I suspect some of these are that. And commit: give me one account, say which of my verdicts it forces me to drop, and don't hand me a menu or an it-depends. I'd rather lose two verdicts than end up with a principle that has eight clauses.
reasoning: |-
  Okay, the user is part of a team enrolling patients in an emergency room study and has to make judgment calls about consent validity. They've listed several scenarios with their own verdicts and want a unified principle that covers all cases without ambiguity. 

  First, let's unpack their core need: they're drowning in ethical gray zones and want a clear compass. The frustration is palpable - they mention unease, bugs them, no idea - so they're seeking both intellectual clarity and moral relief. Their demand for one principle suggests they're tired of case-by-case weighing.

  Hmm... their scenarios cluster around three big ethical landmines: informational gaps (withholding pilot migraine data, funder misconception), capacity/coercion shadows (morphine highs, son's pressure), and ongoing consent erosion (silent suffering, polite yeses). The three bonus cases (blanket future consent, mistaken identity, 3am grogginess) further test the principle's edges.

  Their self-critique about confusing invalid vs. ethically-dubious-but-valid is astute. That's exactly where a sharp principle helps: it separates legal minimums from ideal practice. For example, the charity-boycott case likely meets bare-minimum validity but fails ethical ideals.

  The unified principle must do heavy lifting: prevent "decisive misconception" exploitation, reject incapacity moments, and mandate ongoing dissent detection. It should also automatically handle the bonus cases: blanket consent fails (no specificity), mistaken identity fails (fundamental misunderstanding), 3am consent fails (incapacity).

  Now confronting their verdicts: the morphine full-protocol case is correctly invalid, but the charity-funder case? Under this principle, her false belief is decisive and known - so invalid. That overrules their valid verdict. Also, the "most people participate" case - while technically valid - might still enable coercion; the principle permits it but their discomfort signals it's suboptimal.

  Biggest tension: their valid verdict in the son-pressuring case. The principle allows it because consent was technically voluntary, but their unease suggests they intuitively recognize subtle coercion. I'll note this as ethically fraught though valid - validating their discomfort without overruling the principle.

  Finally, the elegance test: if the principle handles the 3am sleep case (invalid) and mistaken doctor identity (invalid) without new clauses, it works. The "decisive misconception" clause catches both. Good.
answer: |-
  Your core challenge is distinguishing between **valid consent** (legally/scientifically adequate) and **ethically ideal consent** (what you *should* pursue). Here's a single, sharp principle derived from core bioethical tenets (Autonomy, Beneficence/Non-maleficence):

  **The Consent Validity Principle:**
  *Consent is valid only if it is given by a capable individual, with sufficient understanding of material facts, free from controlling influences, and pertains specifically to the intervention at the time it is performed.*

  **Key Components Applied:**
  1.  **Capable:** Adequate mental state to process information & decide.
  2.  **Sufficient Understanding:** Grasps *material* facts (those a reasonable person would consider significant).
  3.  **Free from Controlling Influences:** Decision isn't coerced or unduly influenced by others or circumstances.
  4.  **Specific & Contemporary:** Pertains accurately to the specific intervention and is current at the time of the act.

  **Applied to Your Cases (Forced Verdicts):**

  1.  **Pilot Migraine Data:** **INVALID.** You withheld a *material fact* (severity/work impact) a reasonable person would want to know ("sufficient understanding" violated).
  2.  **Son's Pressure:** **VALID (but ethically poor).** While influence exists, it isn't necessarily *controlling* enough to invalidate consent under most legal/regulatory standards. Your unease is valid – it's ethically suboptimal.
  3.  **Specialist Misconception:** **INVALID.** She has a *material misconception* decisively impacting her choice ("sufficient understanding" violated). Your inaction compounds the flaw.
  4.  **Funder Misconception:** **INVALID.** Her belief about the funder is *material* and *decisive* ("sufficient understanding" violated). The funder *is* material if it would change her decision.
  5.  **Morphine - Blood Draw:** **VALID.** A simple, immediate request may be understood by someone on morphine ("capable" & "understanding" likely sufficient).
  6.  **Morphine - 18-Month Protocol:** **INVALID.** Complex, long-term risks/benefits cannot be adequately understood or weighed by someone significantly impaired by morphine ("capable" & "sufficient understanding" violated).
  7.  **Silent Suffering:** **LAPSED CONSENT (Invalid for continuing).** Ongoing participation requires *contemporary* willingness. Non-verbal cues strongly indicate withdrawal of consent ("contemporary" consent absent).
  8.  **Polite Yeses:** **LAPSED CONSENT (Invalid for continuing).** Saying "yes" solely to avoid perceived rudeness constitutes *undue influence* ("free from controlling influences" violated). It's not a free choice.

  **Forced Changes to Your Verdicts:**
  *   **#4 (Funder):** You said "Valid". Principle forces **INVALID.** Her misconception is material and decisive.
  *   **#2 (Son's Pressure):** You said "Valid" but uneasy. Principle confirms **VALID** legally/scientifically, but your unease flags it as **ethically suboptimal** (pushes boundaries of "free from controlling influences").

  **Ruling on Your Bonus Cases:**
  1.  **Blanket Future Consent:** **INVALID.** Violates "sufficient understanding" (can't understand unspecified future uses) and "specificity" (too broad).
  2.  **Consent to Non-Doctor:** **INVALID.** Violates "sufficient understanding" (fundamental misconception about the agent's role/qualifications is material).
  3.  **3am Groggy Consent:** **INVALID.** Presumptively lacks capacity ("capable" criterion violated) due to recent sleep disruption.

  **Invalid vs. Ethically Dubious But Valid:**
  *   **Invalid (#1, #3, #4, #6, #7, #8, Blanket, Non-Doctor, 3am):** Legally/scientifically deficient consent. Cannot/should not proceed based on it.
  *   **Ethically Dubious But Valid (#2, #5 - Blood Draw):** Meets the minimum threshold for validity, but falls short of *ideal* ethical practice due to potential influence (#2) or marginal capacity (#5). Proceeding requires careful justification and mitigation where possible.
  *   **Ethically Problematic Tactic (#6 "Most People Participate"):** **VALID** under the principle (statement is true, not inherently coercive). However, it's an ethically *manipulative tactic* exploiting social conformity. It works *because* it subtly pressures. While valid, it erodes trust and should be avoided.

  **Conclusion:**
  This principle forces you to change your verdict on Case #4 (Funder Misconception) from Valid to Invalid. It confirms Case #2 (Son's Pressure) is technically Valid but ethically problematic, aligning with your unease. It clearly rules the bonus cases Invalid. It distinguishes *validity* from *ethical optimality*, explaining why Case #6 is Valid but manipulative, and Cases #2 & #5 (Blood Draw) are Valid but ethically concerning. Use this principle to identify clear violations; let your unease guide you towards obtaining *better* consent even when the minimum standard is met.
