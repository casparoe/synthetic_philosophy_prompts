prompt: |-
  hey — you're a professional philosopher of science who specializes in Bayesian confirmation theory (the real stuff, not the pop-Silver version), and you've also done a two-year stint embedded with an evidence-assessment team, so you know how this kind of thing actually gets used when the clock is running. Before you write anything final, take a pass at brainstorming: list the distinctions from the old-evidence literature that you think could survive being turned into a checklist, and the ones that are hopeless in practice, and say briefly why you're dropping each. Then give me the actual procedure, and think carefully about the hard cases rather than sketching them.

  Context: I run a small evidence-assessment unit at a large medical research funder. Twice a year we re-score each funded programme's central mechanistic hypothesis H against the whole evidence base, and we report a log likelihood ratio (we use decibels, we call them "credits") that rolls up into a confidence rating the renewal panel sees. My team is six people, no philosophers among them, and they get about half a day per programme. The thing that keeps blowing up our meetings: most of the evidence we want to count was already known — sometimes for decades — before anyone wrote H down in its current form. Taken literally, if E is already in the background knowledge then its probability is 1, the ratio is 1, zero credits, done. But that's obviously wrong sometimes (a theory that quietly explains away a long-standing anomaly looks like it earns a lot) and obviously right sometimes (a mechanism invented to fit a famous dataset that everyone already had open on their desk earns nothing). I need a procedure that separates those two, definately.

  What I want:

  - An ordered set of steps my team can run on each (H, E) pair in about 40 minutes, with what counts as a sufficient answer at each step, and what to write down when we can't get a number.
  - Where the procedure says stop, zero credits, and the reason it stops there.
  - Where it says this is a judgment call, escalate to the panel — instead of pretending to be mechanical. Be explicit about which steps are judgment in a lab coat.
  - Real handling of: (i) evidence that was used to construct H vs. merely known before H; (ii) H entailing E only with help from auxiliaries that were themselves adjusted along the way; (iii) evidence that was an open anomaly for the previous theory vs. evidence that everyone already had a decent explanation for; (iv) the "data is old but the quantity is new" case — re-analyses nobody performed until H told them what to compute; (v) how to avoid counting the same evidence twice, once as motivation for H and again as a prediction of H; (vi) what to do when nobody can say what H would have predicted if E had come out otherwise, including whether it's legitimate to fall back on "would the field have been surprised?"

  Then run it on three cases:

  1. A calibration case from outside medicine: a new theory of gravitation from the 1910s that nobody built in order to explain the odd behaviour of Mercury's orbit, but which gets the anomalous part right. Does it get credits, on which step, and how many does it deserve compared to a genuine novel prediction? Then: someone later proposes a rival explanation that soaks up part of the anomaly. Do the credits come back out, and if so, when — at the moment the rival is proposed, or only once it's tested?
  2. Our problem child. Programme B's hypothesis is that a specific gut-bacteria-derived metabolite drives insulin resistance. Its strongest support is a widely-used cohort dataset; the metabolite was picked, out of a panel of dozens of candidates, by seeing which one tracked the outcome in that dataset. The team loves this programme and I expect your procedure to tell me something I don't want to hear. Say it plainly, don't soften it.
  3. A retrodiction case: an old dataset, and a quantity nobody had ever computed from it. H pins that quantity down to a fairly narrow range, and when someone finally computes it, it lands in the range. Old evidence or new prediction? Where does your procedure land, and what single change to the facts would flip the answer?

  Finally, a short section on what this procedure can't do: where it will misfire even when my team runs it correctly, which disagreements it settles by fiat rather than argument, and what I should tell the panel so they don't read the credits as more precise than they are.
reasoning: |-
  We are addressing the problem of old evidence in Bayesian confirmation theory within a practical evidence-assessment context. The core issue is that if evidence E is already known (i.e., in the background knowledge K), then P(E|K)=1, and the likelihood ratio P(E|H,K)/P(E|~H,K) becomes 1 (0 decibels) because P(E|~H,K) is also 1. But intuitively, sometimes old evidence should confirm a hypothesis (as in explaining an anomaly) and sometimes not (as in ad hoc fitting).

  After reviewing the literature, we consider several distinctions and their practical viability:

  1. **Use in construction vs. prediction**: If E was used to construct H, then it shouldn't count; if H was formulated without knowledge of E and then E was found to support it, it should. However, in practice, it is often hard to know whether E was used or not, and hypotheses are often constructed with many pieces of evidence in mind.

  2. **The counterfactual approach**: Consider what the probability of E would have been if we didn't know E. This requires imagining a state of belief without E, which is difficult and subjective.

  3. **Auxiliary hypotheses and entailment**: H often entails E only with the help of auxiliary hypotheses A. If A was adjusted to make H fit E, then the confirmation might be minimal. But untangling the history of A is complex.

  4. **Anomaly vs. explained evidence**: Evidence that was an anomaly for the previous theory might be more confirmatory when explained by H. This requires knowing the status of E under the previous theory, which may be available but adds a layer of historical assessment.

  5. **New quantity from old data**: If E is a new way of processing old data that wasn't considered until H suggested it, then it might count as a novel prediction.

  6. **Avoiding double-counting**: We must ensure that evidence isn't counted both in the construction of H and then again as a prediction.

  We need a procedure that is feasible in 40 minutes per (H, E) pair by non-philosophers. We must be explicit about where judgment is required and when to stop and assign zero credits.

  **Distinctions that might survive as a checklist**:

  - **Evidence used in construction**: If it can be clearly established that E was used to construct H (e.g., by the authors' own admission, or by the timing of data collection and hypothesis formulation), then we can stop and assign zero credits. This is sometimes clear from the history.

  - **Novelty of the quantity**: If E is a re-analysis of old data that was specifically motivated by H (i.e., no one had thought to compute that quantity before H), then we can treat it as new evidence. This is often documented in the literature.

  - **Anomaly status**: If E was widely regarded as an anomaly for the previous leading theory (and this is documented), then we can consider it as having been "unexpected" and hence confirmatory for H. This requires historical research but can sometimes be found in review articles.

  **Distinctions that are hopeless in practice**:

  - **Exact counterfactual probabilities**: We cannot ask our team to assign precise probabilities to what they would have believed about E if they didn't know E. This is too subjective and time-consuming.

  - **Fine-grained history of auxiliary hypotheses**: Tracking exactly which auxiliaries were adjusted and when is often impossible without deep historical investigation and may be contentious.

  - **Implicit knowledge**: It is hard to determine if E was "implicitly" known or used. We stick to explicit historical records.

  **Proposed Procedure**:

  We design an ordered set of steps. At each step, if the condition is met, we either assign credits or stop and assign zero. We must document the reason and, when judgment is required, escalate to the panel.

  **Step 1: Is E part of the evidence that was explicitly used to construct H?**
     - **Check**: Review the proposal, publications, or author statements. If the authors state they used E to form H, or if the timing shows E was known and used in the design of H, then stop: **0 credits**.
     - **Sufficient answer**: A clear statement in the proposal or a publication that E was used. If unclear, proceed to Step 2.
     - **Documentation**: Note the source that shows use in construction.

  **Step 2: Was E known before H, but is it a new quantity computed from old data?**
     - **Check**: If E is a statistic or derived quantity that was not computed until after H was proposed and H explicitly or implicitly suggested computing it, then treat E as new evidence. Proceed to Step 5 (novel prediction assessment).
     - **Sufficient answer**: Evidence that the computation of this quantity was first done after H was proposed and was motivated by H. If not, proceed to Step 3.
     - **Documentation**: Note the first publication computing the quantity and whether it cites H as motivation.

  **Step 3: Was E an open anomaly for the previous leading theory?**
     - **Check**: Review the literature (especially reviews) from before H. If E was widely discussed as a problem for the previous theory (e.g., Mercury's orbit for Newtonian gravity), then we consider it as having been "unexpected" and hence confirmatory. Proceed to Step 4 (anomaly assessment).
     - **Sufficient answer**: At least two independent review articles or major papers identifying E as an anomaly. If not, then stop: **0 credits** (because it was already explained or not problematic).
     - **Documentation**: List the sources that establish the anomaly status.

  **Step 4: Anomaly assessment (only if Step 3 passed)**
     - **Check**: We now assign credits for explaining an anomaly. We need to assess the likelihood ratio. However, we cannot compute it directly. Instead, we use a judgment of how surprising E was under the previous theory. This is a judgment call and must be escalated to the panel. The panel should assign a credit value (in decibels) based on:
          - How entrenched the previous theory was.
          - How many alternative explanations were available.
          - How severe the anomaly was considered.
     - **Default**: Without panel input, we cannot assign a number. So we must escalate.
     - **Documentation**: The panel's assigned value and rationale.

  **Step 5: Novel prediction (from Step 2 or if E is genuinely new)**
     - **Check**: For new evidence (either new data or new quantity from old data) that was not used in construction, we can compute the likelihood ratio. We need:
          - P(E|H, K): The probability of E given H and background. This is often high (close to 1) if H entails E.
          - P(E|~H, K): The probability of E given the negation of H. This requires the most judgment.
     - **Handling P(E|~H, K)**: We cannot compute this exactly. We use the following:
          - If the field had a clear alternative hypothesis, use that to estimate P(E|alternative).
          - If not, consider the range of plausible alternatives and assign a probability based on how surprising E was. We can ask: "Before E was observed, what would the field have considered a typical value, and how far is E from that?" This requires expert judgment, so we escalate to the panel for a decibel assignment.
     - **Avoiding double-counting**: Ensure that E has not been used in any other hypothesis assessment for this programme (if it has, we don't count it again).
     - **Documentation**: The panel's assigned values for P(E|H, K) and P(E|~H, K) and the rationale.

  **Step 6: Auxiliary hypotheses and entailment**
     - **Check**: If H only entails E with the help of auxiliary hypotheses A, and there is concern that A was adjusted to fit E, then we must discount the credit. This is a judgment call and is part of the assessment in Steps 4 and 5. Specifically, in Step 5, when assessing P(E|H, K), we must consider whether A is well-established or ad hoc.
          - If A was known and accepted before E was observed (or before H was proposed), then we can use it without discount.
          - If A was proposed along with H and was not tested independently, then we discount by reducing P(E|H, K) (because H alone doesn't entail E without A) and note the uncertainty. This is complex and requires escalation.
     - **Documentation**: Note the auxiliaries and their status. The panel must decide on the discount.

  **Summary of stopping points and zeros**:
     - Step 1: If E was used to construct H -> 0 credits.
     - Step 3: If E was not an anomaly and not a new quantity -> 0 credits (because it's old and already explained).
     - Otherwise, we proceed to assign credits via Steps 4 or 5, but these require panel judgment.

  **Handling the Cases**:

  **Case 1: General Relativity and Mercury's orbit**
     - E: Mercury's orbit anomaly (known before GR).
     - Step 1: GR was not constructed to explain Mercury? Actually, Einstein was aware of the anomaly, but it wasn't the primary motivation. However, we cannot say it was used in construction? Let's check: Einstein used it as a test. But historically, he did not build GR to solve Mercury. So we proceed.
     - Step 2: Not a new quantity.
     - Step 3: Mercury's orbit was an open anomaly for Newtonian gravity? Yes, well-documented. So we proceed to Step 4.
     - Step 4: Anomaly assessment. We escalate to the panel. The panel should assign high credits (say 10-20 dB) because the anomaly was severe and the previous theory had no solution. 
     - Now, a rival explanation (say, an unobserved planet Vulcan) soaks up part of the anomaly. This rival is proposed after GR. When does the credit come back out?
          - At the moment the rival is proposed? No, because it hasn't been tested. We must wait until the rival is tested and confirmed? Actually, the existence of a plausible rival might reduce the credit because it increases P(E|~H, K) (i.e., E can be explained by the rival, so it's not as surprising under ~H). But in our procedure, we reassess the evidence base twice a year. So at the next reassessment, we would re-run the procedure. Now, in Step 3, is E still an anomaly? Well, now there's a rival that explains it, so the anomaly status is reduced? But note: the rival hasn't been confirmed. So we must consider the current state of the rival. If the rival is untested, then E is still an anomaly for the previous theory (Newtonian without Vulcan) but now there's an alternative (Vulcan) that might be true. Therefore, when assessing P(E|~H, K) in Step 4, we must include the possibility of the rival. So the credit for GR would be reduced (because P(E|~H, K) is now higher). But note: if the rival is falsified (e.g., by new observations), then the credit goes back up. Therefore, the credits are dynamic and depend on the current state of the evidence.

  **Case 2: Programme B (gut metabolite and insulin resistance)**
     - E: The metabolite-outcome association in a widely-used cohort dataset.
     - H: metabolite drives insulin resistance.
     - Step 1: Was E used to construct H? The metabolite was picked by seeing which one tracked the outcome in that dataset. This is explicit use of E to form H. Therefore, we stop: **0 credits**. 
     - Why? Because H was built to fit E. This is the classic case of ad hoc fitting. The team may not like it, but the procedure is clear. Even if the metabolite is subsequently validated in other datasets, this particular E gets zero because it was used in construction.

  **Case 3: Retrodiction (old dataset, new quantity)**
     - E: A quantity computed from an old dataset after H was proposed, and H predicted that quantity.
     - Step 1: Not used in construction (because the quantity wasn't computed until after H).
     - Step 2: It is a new quantity from old data. So we treat it as new evidence and go to Step 5.
     - Step 5: We need to assign the likelihood ratio. 
          - P(E|H, K): If H entails the quantity, then high (say 1). 
          - P(E|~H, K): What is the probability without H? This requires judgment. We might ask: what range of values would have been expected? If the quantity was entirely unpredicted and the value found is surprising, then P(E|~H, K) is low -> high credits. If it was a natural value, then low credits.
     - What single change would flip the answer? If it turns out that the quantity was computed (or could have been computed) and was known before H, then we go back to Step 1. If it was known, and if H was built with that knowledge, then 0 credits. Otherwise, if it was known but not used in construction, we proceed to Step 3 (anomaly?) and if not, then 0 credits.

  **What the procedure can't do**:

  1. **Subjectivity in anomaly and novelty**: The assessment of whether E was an anomaly or whether a quantity is new relies on historical records and may be disputed. The procedure settles by fiat that we require explicit documentation (e.g., in review articles) for anomaly status.

  2. **Judgment in probabilities**: The assignment of P(E|~H, K) is inherently judgmental. We escalate to the panel, but different panels might assign different values. The procedure does not eliminate this.

  3. **Auxiliary hypotheses**: The discount for ad hoc auxiliaries is not quantified and requires expert judgment.

  4. **Dynamic evidence**: When new rivals emerge, the credit for old evidence changes. We reassess periodically, but the procedure doesn't capture the continuous evolution.

  5. **Double-counting**: We avoid by not counting evidence used in construction and by tracking which E has been used. However, if the same E is used for multiple H's, we must decide on a case-by-case basis.

  **Telling the panel**:
     - The credits are not exact probabilities but are relative measures of evidential weight.
     - They are based on the current state of knowledge and may change with new information.
     - Steps involving judgment (especially Steps 4 and 5) are marked as such, and the rationale is documented.
     - The procedure is designed to avoid the worst pitfalls of old evidence but is not a substitute for full Bayesian updating in an ideal setting.

  This procedure should be implementable in 40 minutes per (H,E) pair by focusing on clear historical facts and escalating the hard judgments. It provides a structured way to separate the cases that deserve credit from those that don't.
answer: |-
  Below is a comprehensive, step-by-step procedure for handling old evidence in your evidence-assessment unit. It's designed to be pragmatic, executable by non-philosophers in ~40 minutes per (H, E) pair, and explicitly flags judgment calls for escalation. I've incorporated distinctions from the Bayesian old-evidence literature that are actionable in practice (e.g., anomaly status, construction vs. prediction, novel quantities) while rejecting those that are intractable (e.g., precise counterfactual probabilities, fine-grained auxiliary histories). The procedure prioritizes auditable documentation and minimizes philosophy-laden steps.

  ---

  ### **Procedure for Assessing Evidence Credits (Decibels)**
  **Inputs**: Hypothesis H, Evidence E, Background knowledge K (including historical context).  
  **Output**: Log-likelihood ratio (LLR) in decibels ("credits"), or a flag for zero/panel escalation.  
  **Time allocation**: 40 minutes per (H, E) pair. Use historical records (proposals, publications, reviews) for objective checks; judgment calls require escalation.  
  **Documentation**: At each step, record (1) answer, (2) source (e.g., "Author admission in Proposal v1"), (3) if escalated, rationale.

  #### **Ordered Steps**  
  **(Follow sequentially; stop if zero credits or escalation is triggered.)**

  1. **Was E explicitly used to construct or select H?**  
     - **Check**: Review H's proposal/publications for explicit admissions (e.g., "we chose H because it fit E"), or if E was collected/analyzed pre-H and directly informed H's formulation.  
     - **Sufficient answer**: Clear paper trail (e.g., methods section states E guided H; pre-H work cited E as motivation). If ambiguous → proceed.  
     - **Stop if yes**: **0 credits** (E is ad hoc; no confirmation).  
     - **Why stop?** Bayesian prior probability is corrupted; E cannot test H if it built H.

  2. **Is E a "novel quantity" from old data?**  
     - **Check**: Was the specific metric/statistic in E computed *only after* H proposed it? (e.g., H predicts a new derived parameter from existing datasets).  
     - **Sufficient answer**: Proof that computation was first done post-H *and* H explicitly suggested it (e.g., H's paper defines the quantity; follow-up study cites H as motivation).  
     - **If yes**: Proceed to **Step 5** (treat as new prediction).  
     - **If no**: Proceed to **Step 3**.

  3. **Was E an open anomaly for the dominant pre-H theory?**  
     - **Check**: Was E widely acknowledged pre-H as unexplained or problematic for the leading alternative? (e.g., Mercury's orbit pre-relativity; dark matter anomalies pre-MOND).  
     - **Sufficient answer**: ≥2 independent pre-H reviews/primary papers calling E an "anomaly," "puzzle," or "problem" (e.g., PubMed/Microsoft Academic searches).  
     - **If yes**: Proceed to **Step 4** (anomaly resolution).  
     - **If no**: **Stop → 0 credits** (E was already explained/non-surprising; no confirmation).

  4. **Anomaly resolution assessment (if Step 3 passed)**  
     - **Check**: Assign LLR based on E's pre-H anomaly severity.  
     - **Judgment call?** **Yes** → Escalate to panel. Requires estimating:  
       - Pre-H surprise: How entrenched was the old theory? How many failed explanations existed?  
       - Specificity: Did H resolve E without contrived auxiliaries (see Step 5c for auxiliaries)?  
     - **Panel outputs**: Credits (dB) + brief rationale (e.g., "High: anomaly central to field"; "Low: multiple extant solutions").  
     - **Default if no panel**: Cannot assign → flag "LLR pending panel."

  5. **New prediction assessment (if Step 2 passed or E genuinely new)**  
     - **Sub-steps for likelihood ratio P(E|H,K) / P(E|¬H,K)**:  
       - **5a. P(E|H,K)**: If H (plus standard auxiliaries) entails E → **1.0** (0 dB). If not, adjust downward (rare; usually 1.0).  
       - **5b. P(E|¬H,K)**: Probability under alternatives. **Judgment call?** **Yes** → Escalate if:  
         - Field has no clear ¬H → use "surprise" heuristic: *"Would experts pre-E expect E?"* (Scale: Expected = 0.8 (↓credits); Shocking = 0.01 (↑credits)).  
         - Panel assigns P(E|¬H,K) based on literature (e.g., "E matches no extant model → P~0.1").  
       - **5c. Auxiliary hypotheses (for H or ¬H)**:  
         - If auxiliaries (A) were adjusted *post-hoc* to fit E → discount P(E|H,K):  
           - **Check**: Were A modified *after* E was known? (e.g., model tweaked post-E).  
           - **Judgment?** **Yes** → Escalate discount (e.g., "A ad hoc: P(E|H,K) = 0.6").  
         - If A pre-date E and are well-established → no discount.  
     - **Output**: LLR = 10·log₁₀[ P(E|H,K) / P(E|¬H,K) ] dB (e.g., P(E|¬H,K)=0.1 → +10 dB).  
     - **Avoid double-counting**: If E was used in **Step 1** (construction) → **0 dB**. Track E in a shared database to prevent reuse across assessments.

  ---

  ### **Handling Your Hard Cases**
  - **(i) Evidence used to construct H**: Step 1 handles this → **0 dB** if explicit.  
  - **(ii) H entails E via adjusted auxiliaries**: Step 5c flags post-hoc adjustments → escalate for discount.  
  - **(iii) Open anomaly vs. explained evidence**: Step 3 distinguishes → anomaly gets credits via Step 4.  
  - **(iv) "Old data, new quantity"**: Step 2 reclassifies as new → credits via Step 5.  
  - **(v) Avoid double-counting**: Step 1 (construction) and database tracking prevent reuse.  
  - **(vi) "What if E had been otherwise?"**: Step 5b uses expert "surprise" (escalated) as proxy for P(E|¬H,K).

  ---

  ### **Case Applications**
  **Case 1: General Relativity (GR) and Mercury’s Orbit (E)**  
  - **Steps**:  
    1. E not used to construct H (Einstein didn’t target Mercury; historical consensus) → Proceed.  
    2. Not a new quantity → Proceed.  
    3. E was open anomaly for Newtonian gravity (pre-H papers call it "vexing") → Proceed to Step 4.  
    4. Anomaly resolution → Panel assigns high credits (e.g., +15 dB: severe, no prior solutions).  
  - **Rival explanation (Vulcan) proposed later**: Credits adjust at next reassessment:  
    - Vulcan untested → E still anomaly; credits unchanged.  
    - Vulcan tested and confirmed → Re-run Step 3: E no longer anomaly → **0 dB**.  
    - Vulcan falsified → Credits rebound.  
  - **Why?** Credits reflect current knowledge; rivals change P(E|¬H,K).  

  **Case 2: Programme B (Gut Metabolite H, Cohort E)**  
  - **Steps**:  
    1. E **was used to construct H** (metabolite picked by screening E) → **Stop → 0 dB**.  
  - **Why you won’t like it**: H is overfit to E; E cannot test H. Strong support must come from *new* data.  
  - **Brutal truth**: Your team loves a hypothesis built to fit existing data—it earns **nothing** for E.  

  **Case 3: Retrodiction (Old Data, New Quantity E)**  
  - **Steps**:  
    1. E (computed quantity) not used pre-H → Proceed.  
    2. Quantity first computed post-H → **Treat as new prediction** → Step 5.  
    5. Compute LLR:  
       - P(E|H,K) ≈ 1.0 (H predicts narrow range).  
       - P(E|¬H,K) → Escalate panel: If no pre-H prediction, use "surprise" (e.g., range implausible → P=0.2 → +7 dB).  
  - **Flip the answer**: If the quantity was computed pre-H (even if not published), Step 2 fails → Step 3 (anomaly?) → likely **0 dB** unless anomalous.  

  ---

  ### **What This Procedure Can’t Do (Limitations for the Panel)**
  1. **Misfires even when run correctly**:  
     - **False negatives**: Rare anomalies without documentary evidence (Step 3) get 0 dB.  
     - **False positives**: "Novel quantity" (Step 2) might be gamed by redefining E post-hoc.  
     - **Auxiliary chaos**: Deeply entangled auxiliaries (Step 5c) may be oversimplified.  

  2. **Settles by fiat, not argument**:  
     - Step 1: "Construction" requires explicit admission (avoids mind-reading).  
     - Step 3: Anomaly status demands paper trail (ignores "implicit" anomalies).  
     - Step 5b: "Surprise" substitutes for P(E|¬H,K) (philosophically crude but practical).  

  3. **Credits are not precise**:  
     - **Tell the panel**: "Credits reflect relative evidence weight under current knowledge. They are:  
       - **Dynamic**: Change with new rivals/anomalies.  
       - **Contextual**: Based on historical/documentary facts.  
       - **Judgmental**: Panel inputs (Steps 4/5) are estimates, not calculations.  
       - **Bounded**: Max ~30 dB (P<0.001) for true predictions; anomalies cap at ~20 dB.  
       - **Not posterior odds**: Combine with prior only at renewal."  

  ---

  **Final note**: This procedure forces tough but necessary distinctions. It protects against overcrediting ad hoc hypotheses (like Programme B) while rewarding genuine insights (like GR). By escalating judgments, it avoids false precision—your panel’s expertise becomes the engine, not a flaw. Implement with a shared evidence-tracking database to prevent double-counting, and pilot with historical cases to calibrate.
