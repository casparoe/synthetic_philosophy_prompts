prompt: |-
  Hey — weird one, and sorry in advance, it's not the usual sort of thing. I'm about two hundred pages into a novel and I've painted myself into a corner with a language I invented for one of the cultures in it.

  The grammer I gave myself works roughly like this: every verb describing an action has to carry a marker saying whether the action achieved what it was for. Not tense, not whether it's finished — whether it came off. You can't say I went to the well without also saying whether the water got fetched, and there's no neutral or unmarked option. There's also no standalone verb meaning to try or to intend that doesn't itself carry the same succeeded/failed marking. And the bit I didn't think through when I started: the marker is required for stuff that hasn't happened yet too. So I'll go to the well tomorrow already commits you, right there in the morphology, to whether the trip is going to work out.

  The scene I'm stuck on is the emotional centre of the book. My narrator — grew up in this language, and I'm writing in English but I want the reader to feel the shape of the original, if that makes sense — has to decide whether to attempt something genuinely risky and probably stupid: a crossing, bad weather, a kid with her. She's alone, turning it over, and the whole point is that she doesn't know if it'll work and chooses anyway. But every time I try to write her thinking it through in her own head the language seems to slam the door: she can't even put the option to herself without already declaring it a success or a failure. Which either makes the scene unwritable or makes her look incapable of basic practical reasoning, and I don't want that — she's meant to be competent, and I really don't want to write a character who's intellectually disabled by her own grammar. Feels cheap, and kind of gross besides.

  So what would actually be going on? Does the language really box her in, or would she have workarounds — roundabout phrasings, conditionals, quoting or ventriloquizing herself, some irrealis or hedging form, a special shape for vows and hopes — and if so how awkward would those feel to her, and would that awkwardness be visible in the prose? Also the knock-on stuff: if you have to mark outcome every single time, would she be unusually preoccupied with whether things actually worked, unusually bad at I did my best as an excuse, unusually hard on people who failed through no fault of their own? Or is that overstating it, and she'd just mark it the way I mark tense, automatically, without it coloring anything? And is it even stable — wouldn't speakers invent a neutral form inside a generation or two, given how often they'd need one?

  One more thing I keep going back and forth on: whether it's coherent to say she thinks in this language at all. Half the time my own thoughts don't feel like sentences.

  What I'm after is: what can I plausibly let the grammar do to her, what should I keep off-limits, and how do I show any of it in English without stopping every other paragraph to explain.
reasoning: |-
  Okay, the user has created a constructed language for their novel where every action verb must carry a marker indicating whether the action achieved its intended purpose. They're stuck on a crucial scene where the protagonist needs to contemplate an uncertain future action, but the grammar forces her to declare success or failure even for hypotheticals, which undermines the tension.

  This is a fascinating linguistic and narrative problem. The core issue seems to be that the language's obligatory success/failure marking conflicts with human cognitive processes around uncertainty. Let me think about how real languages handle uncertainty - subjunctive moods, conditional constructions, hedging phrases. The constructed language appears to lack these features.

  The user's concerns are multilayered. First, there's the immediate technical problem of depicting uncertainty within this grammatical constraint. Then there's the characterization aspect - they don't want their competent protagonist to appear limited by her language. Finally, there are deeper questions about linguistic relativity: would this language actually shape how speakers perceive the world?

  I should consider possible workarounds. Maybe the language has developed workarounds like modal verbs or hypothetical particles. Perhaps speakers use nominalizations ("the making of an attempt") to avoid committing to outcomes. Or they might employ reported speech constructions to distance themselves from declarations.

  The emotional impact is crucial here. The user wants the scene to center on a courageous decision made amid uncertainty. The grammatical limitations could actually enhance this if handled right - showing her struggle with the language could mirror her internal conflict. The workarounds themselves could feel psychologically revealing - like her thoughts bumping against the walls of her language.

  About linguistic determinism: while the language would influence thought patterns, it wouldn't completely trap her. All languages have constraints, but speakers develop strategies to bypass them. The key is making these strategies feel authentic to the culture.

  For the scene itself, I imagine showing her thought process through:
  - Aborted verb constructions where she keeps changing the outcome marker
  - Shifting to third-person or hypothetical framing
  - Physical manifestations of frustration when language fails her
  - Eventually settling on a success-marked verb as an act of hope

  The broader implications are interesting too. Such a language might indeed make speakers more outcome-focused, less accepting of "good tries." This could create cultural attitudes where process matters less than results. But it shouldn't make people incapable of understanding uncertainty - just force them to express it differently.

  For the protagonist, her competence could shine through precisely in how she navigates these linguistic constraints. Her ability to find loopholes demonstrates cognitive flexibility. The moment she deliberately chooses a success marker despite uncertainty could be powerful - showing her commitment.

  The implementation in English needs subtlety. Perhaps using modal verbs ("might work") in narration while having her thoughts shown as fragmented. Or using typography to indicate when she's using workaround forms. The key is showing the struggle without over-explaining.
answer: |-
  That's not a weird question at all – it's a brilliant, deep dive into linguistic worldbuilding and its psychological consequences. You've hit the core tension of linguistic relativity: how *does* a language shape thought and expression, especially under pressure? Let's break this down:

  **The Core Problem: Expressing Uncertainty in a Binary World**

  Your diagnosis is spot-on. The grammar forces a premature commitment (`SUCC`/`FAIL`) for future or hypothetical actions, which directly conflicts with the protagonist's necessary state of *not knowing*. Trying to force a `SUCC` or `FAIL` marker onto a genuinely uncertain future attempt *would* make her seem irrational or deluded.

  **Plausible Workarounds & How They Feel**

  Speakers *would* develop strategies to express uncertainty. Here's how they might work and their psychological/linguistic "flavor":

  1.  **Hypothetical/Conditional Mood (The "What If" Frame):**
      *   **How:** This is likely the most common and natural workaround. The language *must* have a way to talk about possibilities, contingencies, and counterfactuals. This wouldn't *remove* the `SUCC`/`FAIL` marker, but it would *embed* the action within a conditional clause, distancing the speaker from direct commitment.
      *   **Structure:** `[If-Condition] + [Action-Verb-Marked]`
      *   **Example in Thought:** "**If** the ice holds (`SUCC`?), **then** we cross (`SUCC`?)... **but if** the wind rises (`SUCC`?), **then** the crossing fails (`FAIL`)." *The markers on the embedded verbs are hypothetical possibilities, not declarations.*
      *   **Feeling:** This would feel like the *normal* way to think about uncertain futures. Competent speakers use it fluidly. It's analytical, planning-oriented. It wouldn't feel awkward; it would feel like using the right tool. **This is your primary solution for the scene.**

  2.  **Quoting/Reported Speech/Ventriloquizing (The "Inner Committee"):**
      *   **How:** She could internally "quote" a potential future statement or thought, framing it as something she *might* say/think later, not something she's asserting *now*.
      *   **Structure:** `[Think/Say-Verb] + [QUOTE: "I go-SUCC tomorrow"]` OR `[Think/Say-Verb] + [QUOTE: "I go-FAIL tomorrow"]`
      *   **Example in Thought:** "Part of me whispers, '*We could go-SUCC*.' Another part snaps back, '*Don't be a fool, we'd go-FAIL*.'" Or: "I imagine saying to the child later, '*We tried to cross-SUCC, but...*'"
      *   **Feeling:** This might feel slightly more deliberate or effortful than the conditional, like arguing with herself. It introduces an extra layer of cognitive separation. It could feel dramatic, introspective, or even slightly dissociative under stress. Useful for highlighting internal conflict.

  3.  **Nominalization (Turning Action into a Thing):**
      *   **How:** Instead of using the verb "to cross", use the noun "the crossing". Nouns don't carry the `SUCC`/`FAIL` marker. You can then talk *about* the action without performing the verbal commitment.
      *   **Structure:** `[The crossing] + [is possible/dangerous/a risk/uncertain]`
      *   **Example in Thought:** "**The crossing**... is possible. **The crossing**... is madness. **Attempting the crossing** carries risk." She avoids saying "*I cross-X*" directly.
      *   **Feeling:** This might feel abstract, indirect, or slightly stiff. It's avoiding the core verb. A competent speaker might use it for initial contemplation ("The crossing...") but would likely shift to conditionals or quotes for deeper analysis. It creates a sense of detachment.

  4.  **Focus on Intention/Attempt (Separating Try from Outcome):**
      *   **How:** While "try" itself might be marked, the language likely has ways to emphasize the *initiation* or *intention* phase distinct from the outcome marker on the main action verb. Perhaps "decide to", "prepare to", "set out to" + `[Action-Verb-Marked]`.
      *   **Structure:** `[I decide-SUCC] + [to cross-SUCC/FAIL?]` OR `[I prepare-SUCC] + [for crossing-SUCC/FAIL?]`
      *   **Example in Thought:** "I **decide-SUCC** to cross... though whether the crossing itself succeeds or fails, I cannot know." *The `SUCC` on "decide" reflects the successful formation of intent, not the outcome of the crossing.*
      *   **Feeling:** This focuses energy on the *commitment to act* as a separate, controllable event from the *outcome*. It feels resolute regarding the attempt itself, while acknowledging the uncertainty of the outcome. Powerful for the moment of decision.

  5.  **Irrealis Mood / Dubitative Particles (The "Maybe" Marker):**
      *   **How:** Does the language have a specific particle, auxiliary verb, or verb form dedicated to uncertainty, possibility, hope, or doubt? This would attach to the main clause, modifying the force of the `SUCC`/`FAIL` marker.
      *   **Structure:** `[HOPEFULLY/PERHAPS/MAYBE] + [I go-SUCC tomorrow]` OR `[I go-POTENTIAL-SUCC tomorrow]`
      *   **Example in Thought:** "**Perhaps** we go-SUCC." "**I hope** we go-SUCC." (Implies the `SUCC` is desired but uncertain). Or a specific form: "We go-`DUB.SUCC`" (Dubitative Success).
      *   **Feeling:** This would be the most linguistically elegant solution *if it exists*. It would feel like a standard, unremarkable way to express uncertainty. The marker is still there, but its certainty is explicitly softened. **Check if your grammar allows for modifying particles/mood markers!**

  **Psychological & Cultural Implications (What the Grammar *Does* to Her):**

  *   **Heightened Outcome Awareness:** Yes, she would be *extremely* conscious of whether actions achieved their goals. This is baked into every sentence. It wouldn't be a constant *worry*, but a fundamental cognitive category, as automatic as tense is for us.
  *   **"I Did My Best" is Linguistically Weak:** Absolutely. The grammar forces a binary: you succeeded in the intended purpose, or you failed. Explaining *why* you failed requires extra work ("Failed because the rope broke-SUCC", "Failed despite trying-SUCC"). The focus is overwhelmingly on the outcome. "Trying-SUCC" marks the *attempt* was made properly, not that the goal was achieved. "Trying-FAIL" implies you screwed up the attempt itself. The *excuse* layer is secondary.
  *   **Potentially Less Forgiving?:** The language *facilitates* a focus on results. Whether the culture *is* less forgiving depends on other factors (religion, philosophy, social norms). They might have elaborate cultural mechanisms for dealing with failure precisely *because* the language highlights it so starkly. They might value "trying-SUCC" immensely, even if the ultimate goal failed. But the linguistic bias is towards the binary outcome.
  *   **Automatic, Not Constantly Colored:** For routine things ("I sat-SUCC down"), it would be as automatic and unremarkable as us marking past tense. The *weight* comes when the outcome is significant, uncertain, or negative. The discomfort in your scene arises precisely because the *uncertainty* conflicts with the *requirement to mark*.
  *   **Stability:** Speakers would absolutely develop the workarounds above (especially 1, 3, 4, and 5 if possible) precisely because the need to express uncertainty is universal. The core grammar (`SUCC`/`FAIL` on main declarative verbs) is stable; the strategies for hypotheticals are the necessary adaptations. They wouldn't invent a *neutral* main verb form; they'd invent robust ways to *frame* the verbs to handle uncertainty.

  **Thinking in the Language:**

  *   **Yes, she thinks in it:** Especially for concrete actions, planning, and evaluating situations. The `SUCC`/`FAIL` category would be a fundamental part of her cognitive landscape for processing events. Her internal monologue about the crossing would likely wrestle *with* the grammar, using the workarounds.
  *   **Non-Linguistic Thought Exists:** Absolutely. Instincts, sensory impressions, emotions, abstract patterns – these aren't necessarily verbal. The `SUCC`/`FAIL` framework might kick in when she starts formulating *plans* or *evaluations* internally.

  **How to Show This in English (Without Constant Explanation):**

  1.  **Leverage English Modals & Hedging:** Use English's tools *prolifically* in her thoughts to mirror the hypothetical/conditional workaround.
      *   *Thought:* "**If** the snow holds... **then** we **might** make it **if** the pass **isn't** blocked. **But if** the wind picks up **like** last time... **then** it **would** be a failure **for sure**." The italicized words convey the uncertainty her language forces into conditional framing and distancing.
  2.  **Internal Dialogue/Debate:** Show her arguing with herself using quoted thoughts representing different `SUCC`/`FAIL` possibilities. "Go. We can *do* this." (Implies `SUCC`). "Fool. The ice *won't* hold." (Implies `FAIL`).
  3.  **Abstraction/Nominalization:** Have her think in terms of "the crossing," "the attempt," "the risk," "success," "failure" as abstract nouns, avoiding the direct verb.
  4.  **Focus on Intention:** Emphasize the decision *to try* as the moment of commitment. "The choice was made. She *would* cross. Let the ice bear them or break." The `SUCC`/`FAIL` on "cross" is linguistically required but becomes almost a statement of defiance or acceptance of fate.
  5.  **Narrative Voice Insight:** Briefly dip into close third-person to explain the linguistic hurdle *once*, strategically. "In her tongue, even the thought 'I will cross' demanded a suffix declaring triumph or disaster. The words choked her, unwilling to lie with hope or surrender to despair. She thought around it: *If the path stays clear...*"
  6.  **Physiological Response:** Show the *frustration* or *effort* of wrestling with the language. A clenched jaw, a sigh, rubbing her temples when she hits the linguistic wall. "The simple thought of tomorrow's journey stuck in her throat, demanding an answer she couldn't give."
  7.  **"Mark" Important Verbs Subtly:** Occasionally, when a `SUCC` or `FAIL` is *crucially* significant or finally committed to, use slightly unusual phrasing or emphasis. "She *would* cross, and she *would* succeed." (Implies forced `SUCC` marking). "He went to fetch water, and failed." (Simple statement, implies `FAIL` marker).

  **Recommendations for Your Scene:**

  1.  **Use Conditionals Extensively:** This is the most natural workaround. Show her running through scenarios: "If A happens (`SUCC`?), then B (`SUCC`?)... but if C (`FAIL`?), then D (`FAIL`?)..."
  2.  **Show the Struggle:** Don't avoid the linguistic friction. Show her starting a thought ("I go--") and stopping, unable to attach the marker. Show her switching tactics to nominalization ("The crossing...") or conditionals.
  3.  **Moment of Decision = Commitment to `SUCC`?:** The climax might be when she *deliberately* uses the `SUCC` marker internally or aloud ("We go-SUCC"), not as a prediction, but as an act of will, a vow, a commitment to *make* it succeed, accepting the linguistic conceit as an act of courage. Or, she uses the Intention workaround: "I *choose* to cross." (Marking `SUCC` on the choice, leaving the crossing's outcome linguistically unresolved but existentially committed).
  4.  **Competence Through Adaptation:** Her competence is shown *precisely* in her fluid use of workarounds and her deep analysis of possible outcomes (using conditionals) despite the grammatical constraint. She *is* thinking practically; she's just doing it within the framework of her language.

  **What's Off-Limits:**

  *   **Making Her Seem Stupid:** If she just keeps trying to say "I go" and failing without switching strategies, *that* makes her seem limited. Show her adapting.
  *   **Ignoring the Grammar:** Don't just have her think "I wonder if we'll make it?" in plain English without implying the linguistic gymnastics required internally.
  *   **Over-Stating Determinism:** The language shapes her thought, it doesn't imprison it. She *can* conceive of uncertainty; she just has to express it differently. Show that difference.

  This is a fantastic linguistic challenge. By embracing the constraint and showing how a competent speaker navigates it, you can make the scene *more* powerful and deepen the reader's immersion into her culture and psyche. Good luck!
