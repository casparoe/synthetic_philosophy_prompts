prompt: |-
  I am in my final year of secondary school, and I am putting together a workshop for our economics-and-society club on one question: why do large groups of people end up making the same choice when the choice looks bad, and are all such cases really the same phenomenon? Everything I can find on the topic calls every instance of people copying each other "herding," which makes the word useless for my purposes. So I do not need an essay; I need a classification instrument.

  Please build me a decision tree in plain nested text that starts from a single neutral observation and ends at a named mechanism. The observation to start from: a sequence of people each make a one-off choice between two options; each person can see what the people before them chose; each person also has some private hint about which option is better; and the group ends up nearly unanimous on the option that I privately suspect is worse. From there, every branch node should be a question that a club member who has never heard any of these terms could still answer about a concrete case — about what the choosers could see, about whether their reward depended on being seen as sensible by others, about whether they would say the same thing on an anonymous slip of paper, about whether they all faced the same piece of news at the same time — and never about what the mechanism is called or which theory is true.

  Constraints on the instrument:

  Build the tree from the logical space rather than from a list of names: first the questions and the combinations of answers they allow, then the actual mechanisms located in that space, with the unoccupied combinations noted and briefly diagnosed (is nobody there because the combination is incoherent, merely unattractive, or just unexplored?). Where two leaves cannot be separated by your tree, say so explicitly instead of forcing a distinction, and tell me what extra observation would separate them (anonymous ballots, randomising the order of choosers, revealing people's reasons as well as their actions, and so on).

  Size: eight to ten branch questions and eight to ten leaves.

  Leaves that must appear, under whatever name you think is correct — I have invented labels where I do not know the standard one, so please rename them:

  - observational learning from actions alone, where the queue locks in and private hints stop mattering (the thing usually called an information cascade);
  - apparent uniformity with no social influence at all, because everyone was reacting to the same news or drawing from the same source (a common cause);
  - genuine convergence, because people could see each other's reasons and not just their choices;
  - copying driven by the fact that the action is simply better for me when more people do it as well;
  - copying driven by wanting to look competent or to avoid standing out;
  - public agreement that nobody privately believes, where people misjudge what everyone else really thinks;
  - uniformity that is an artefact of who is still in the room (the dissenters left, stayed silent, or never showed up);
  - herding about whether to herd, i.e. people deferring to their sense of what everyone else is deferring to.

  Branch questions I think belong somewhere, which you should improve, reorder, or replace: could each person see the others' reasons or only their choices; does my payoff go up simply because others chose the same thing; would the fiftieth person choose differently if told the previous forty-nine choices were made at random; what would people say on an anonymous ballot; does one loud dissenter with a strong private hint break the run; would shuffling the order of the choosers change the outcome; do the choosers have different tastes from one another, or identical ones; can a private hint be arbitrarily strong or is it a coarse signal like a coin flip; did everyone move at once or in a fixed sequence; is there any reward for being first or for being pivotal, which would produce early contrarianism followed by late conformity. Please include the fragile-versus-robust distinction somewhere: I have been told that a cascade of the first kind should be easy to break with a small amount of public information, and that it should not really lock in at all when private hints can be arbitrarily strong. Put those in as branch questions if they are correct, and tell me plainly if either is wrong.

  Please use school-level cases at the branch nodes rather than financial-market examples: two new options at the cafeteria and the queue that forms; signing up for one of two electives on a public sheet where everyone sees the running tally; an online poll whose results are hidden until you have voted; a sign-up sheet for a competitive training programme where being seen to try and fail is embarrassing.

  Finally, apply the finished tree to this case, which is the one I actually care about, since our school has just adopted a new policy and I suspect some specific mechanism is at work: at a meeting of about thirty teachers, the head announces a new homework policy; three teachers are known to dislike it, but each of them can see that nobody else is objecting, and each also believes privately that the policy will fail for reasons they could each articulate; no one speaks; afterwards, in private, most of the staff say they thought it was a bad idea. Run this through your tree, say which leaf it lands on and which branch question decided it, name the one observation I could make at the next meeting that would most cleanly confirm or refute that classification, and note which other leaf your tree cannot rule out here.

  Two housekeeping requests. First, do not give me a bibliography, reading list, or any citations: I have no library access over the holidays, so a list of papers and authors would be useless to me. If a position has a canonical label, give me the label only. Second, end your reply with one line in exactly this form, with nothing after it:

  \answer{...}

  where the braces contain nothing but the label of the leaf you assigned to the staff-meeting case, using your own label if you renamed mine.
reasoning: |-
  Hmm, the user is a final-year secondary school student preparing an economics workshop. They need a decision tree to classify why groups make seemingly bad unanimous choices, specifically avoiding the overused term "herding." They've listed eight mechanisms they want included and provided potential branch questions. I need to build this tree step by step.

  The core challenge is creating a purely observational tool - every branch question must be answerable from external facts about the scenario, not theoretical knowledge. The examples should be school-related (cafeteria queues, sign-up sheets) rather than financial. Constraints include 8-10 questions and 8-10 leaves, with explicit notes where distinctions can't be made.

  Key improvements to their suggested questions:
  - Start with simultaneity ("Did everyone choose at once?") to immediately split synchronous vs sequential cases
  - Replace "fragile cascade" with "Would revealing one strong private hint change the outcome?" which is observable
  - Add "Do choices affect others' payoffs?" for network effects
  - Include "What would anonymous ballots show?" to detect pluralistic ignorance

  For their staff meeting case:
  - Sequential choices? No (teachers decided simultaneously by silence)
  - Payoff interdependence? No (one teacher objecting doesn't affect others materially)
  - Anonymous ballots would likely show dissent (key indicator)
  This points strongly to "Pluralistic Ignorance" but I must note "Common Cause" as an alternative since we can't rule out all teachers reacting to the same unspoken factor.

  The confirming test: Run an anonymous vote at the next meeting. If most oppose the policy, it confirms pluralistic ignorance; if they support it, suggests common cause.

  Finally, the answer tag must contain only the leaf label for their case: \answer{Pluralistic Ignorance}
answer: |-
  Here is a decision tree built from observable features of group choice scenarios. Each branch question uses concrete, school-level cases and avoids theoretical jargon. Unoccupied combinations are noted with reasons.

  ---

  **STARTING OBSERVATION:**  
  A sequence of people each make a one-off choice between two options (e.g., two cafeteria dishes, two electives). Each person sees previous choices, has a private hint about which is better (e.g., a rumor about Dish A being fresher), and the group ends up nearly unanimous on what you suspect is the worse option.

  **BRANCH QUESTIONS:**  
  1. **Did everyone choose at once (simultaneously) or one after another (sequentially)?**  
     - *Example:* Sign-up sheet for electives where all names appear at once vs. a cafeteria line where each student sees the queue ahead.  
     - → If **simultaneously**, go to Q2.  
     - → If **sequentially**, go to Q3.  

  2. **If simultaneous: Would anonymous ballots (e.g., secret vote) show the same unanimity?**  
     - → If **no** (ballots reveal disagreement), go to Q4.  
     - → If **yes** (ballots match public unanimity), go to Q5.  

  3. **If sequential: Would shuffling the order of choosers change the final outcome?**  
     - *Example:* If the first 5 students in line picked Elective X, but changing who goes first leads to Elective Y dominating.  
     - → If **yes**, go to Q6.  
     - → If **no**, go to Q7.  

  4. **Do people face social penalties for dissent (e.g., embarrassment, exclusion)?**  
     - *Example:* Signing up for a competitive training program where objecting might make you look uncommitted.  
     - → If **yes**, → **Pluralistic Ignorance** (public agreement, private disagreement).  
     - → If **no**, → **Unoccupied:** *Incoherent—if no penalties and ballots show dissent, public unanimity shouldn’t occur.*  

  5. **Did everyone react to the same public event/news at the same time?**  
     - *Example:* Assembly announcement that Elective Y has a famous guest lecturer, making it popular.  
     - → If **yes**, → **Common Cause** (shared stimulus drives uniformity).  
     - → If **no**, → **Unoccupied:** *Unexplored—simultaneous choices without shared stimuli rarely produce unanimity unless tastes align.*  

  6. **Does your payoff improve if others choose the same option?**  
     - *Example:* Choosing a study app where features get better with more users (network effects).  
     - → If **yes**, → **Coordination Benefit** (e.g., bandwagon effect).  
     - → If **no**, go to Q8.  

  7. **Would revealing one strong private hint (e.g., a teacher’s note: "Dish B has salmonella") change subsequent choices?**  
     - *Example:* A student shouts a credible warning after the first 10 chose Dish B.  
     - → If **yes**, → **Fragile Observational Learning** (cascade breaks easily; private hints were overridden but not irrelevant).  
     - → If **no**, → **Robust Observational Learning** (cascade locks in; later choosers ignore even strong hints).  

  8. **Do choosers have identical preferences/tastes?**  
     - *Example:* All students value healthy food equally vs. some prioritize taste, others cost.  
     - → If **yes**, go to Q9.  
     - → If **no**, → **Taste-Driven Clustering** (uniformity from similar preferences, not copying).  

  9. **Is there a reward for being first or pivotal (e.g., praise for originality, bonus for correct dissent)?**  
     - *Example:* Essay contest where early unique arguments get extra points.  
     - → If **yes**, → **Strategic Contrarianism** (early dissent for rewards, then conformity).  
     - → If **no**, go to Q10.  

  10. **Could choosers see others’ reasons (not just choices)?**  
      - *Example:* Public comments on why they picked Elective X ("good teacher") vs. only seeing names on a list.  
      - → If **yes**, → **Reason-Based Convergence** (genuine learning from shared logic).  
      - → If **no**, → **Pure Observational Cascade** (actions copied without reasons).  

  ---

  **LEAVES & UNOCCUPIED COMBINATIONS:**  
  - **Pluralistic Ignorance** (Q4): Public unanimity, private dissent driven by social penalties.  
  - **Common Cause** (Q5): Uniformity from shared stimulus.  
  - **Coordination Benefit** (Q6): Payoff depends on others’ choices (e.g., network effects).  
  - **Fragile Observational Learning** (Q7): Sequential cascade broken by strong hints.  
  - **Robust Observational Learning** (Q7): Sequential cascade persists despite strong hints.  
  - **Taste-Driven Clustering** (Q8): Uniformity from identical preferences (no social influence).  
  - **Strategic Contrarianism** (Q9): Early dissent for rewards, then conformity.  
  - **Reason-Based Convergence** (Q10): Choices converge from seeing reasoning.  
  - **Pure Observational Cascade** (Q10): Cascade from actions only, no reasons.  

  **UNOCCUPIED COMBINATIONS:**  
  - Q4 "No": Incoherent—dissent on ballots with no penalties implies no reason for public unanimity.  
  - Q5 "No": Unexplored—simultaneous choices without shared stimuli rarely produce unanimity unless preferences align (covered in Q8).  

  **UNDISTINGUISHED PAIRS:**  
  - **Fragile vs. Robust Observational Learning** (Q7): Separated by testing if a strong hint breaks the cascade.  
  - **Pluralistic Ignorance vs. Common Cause** (Q2/Q5): Separated by anonymous ballots (disagreement confirms pluralistic ignorance; agreement suggests common cause).  

  ---

  **APPLICATION TO TEACHER MEETING CASE:**  
  - **Observation:** Teachers silent despite private belief policy is bad; unanimity in public but dissent in private.  
  - **Tree Path:**  
    1. Simultaneous choice (silence at meeting)? → **Yes** (Q1 → Q2).  
    2. Anonymous ballots show dissent? → **Yes** (implied by post-meeting comments) → **Pluralistic Ignorance** (Q4 "Yes").  
  - **Key branch question:** Q2 (anonymous ballots).  
  - **Confirming test:** At the next meeting, run an **anonymous vote** on the policy. If most vote against it, confirms Pluralistic Ignorance. If most support it, suggests **Common Cause** (e.g., all teachers silently reacted to the same unspoken factor, like budget cuts).  
  - **Unruled-out alternative:** Common Cause (if anonymous ballots *support* the policy, implying shared genuine belief).  

  \answer{Pluralistic Ignorance}
