prompt: |-
  So I've been going through eval papers that test concept learning with Bongard problems — you know the format, six little line drawings on the left that all satisfy some rule, six on the right that break it, and the system has to say which side a new drawing belongs to. And the practice seems weirdly two-faced about what counts as success.

  On the one hand the headline number is held-out accuracy: get the unseen items right and you've "got the concept". On the other hand everyone treats it as a failure if the model is using a cheap feature — number of shapes, total ink, symmetry, convexity — even in the cases where that feature gets exactly the same accuracy on the test items. The people who build these sets even design against it: they balance the two sides so no single superficial statistic separates them, and they throw out any item where a bank of "cheap" features would do the job.

  Now suppose someone built a suite (call it Bongard-Mirror) that scored every submission twice: once on held-out accuracy, and once on "concept match", where you only get credit if the rule you state is the curator's intended rule. And suppose the two scores come apart constantly — rules at 100% accuracy that get zero on concept-match, because the curator's rule was relational ("the small shape touches the large one at exactly two points") and the model's was perceptual ("the bounding box is wider than it is tall"), and both hold for every single item in the set.

  What does this whole way of testing presuppose about what a concept is? It grades as if having a concept is just a disposition to classify new cases correctly, but then it leans on an intended rule, and on a legitimate/illegitimate distinction among features, that the accuracy number by itself cant see. Does it presuppose concepts are rules with necessary-and-sufficient conditions? Or prototype/similarity structures? Or something about which properties are natural or projectible, grue-style? Which theories of concepts does it actually rule out, which ones could happily live with it, and where is the practice just philosophically underdetermined so that several theories would license it? And if we dropped the intended-rule stuff and really meant it that a concept is whatever generalizes — what would the benchmark have to turn into, and would it stop testing anything distinctive?

  One more thing: please mark which parts of your answer are basically settled (I assume the underdetermination of rules by finitely many examples isnt in dispute) versus genuinely contested among people who work on concepts, and dont sell me your favorite theory as the consensus view.
reasoning: |-
  Okay, the user is diving deep into Bongard problems and the evaluation paradox in concept learning benchmarks. They've noticed this tension between held-out accuracy (getting classifications right) and "concept match" (recovering the curator's intended rule). Their proposed Bongard-Mirror suite would expose this conflict systematically.

  Hmm, this is fundamentally about what constitutes "having a concept." The user is spotting that current practice implicitly requires two incompatible things: behavioral success (accuracy) and rule recovery (intentional alignment). That's sharp.

  Let me unpack the philosophical presuppositions hiding in this setup. First, the accuracy metric alone suggests a behaviorist or dispositional view of concepts - concepts as black boxes that reliably sort inputs. But then the rejection of "cheap features" reveals a structuralist commitment: concepts have internal architectures where some features are privileged over others. The curator's role is crucial here - they're acting as the arbiter of "natural" properties.

  The user's grue reference is spot-on. This practice assumes projectibility - that some generalizations (relational rules) are "better" than others (perceptual shortcuts) even when empirically equivalent. That's Goodman's problem in a concrete testbed!

  Now for theories of concepts that clash with this setup:
  - Pure prototype/exemplar theories would struggle because they can't distinguish "legitimate" rules - similarity metrics might perfectly classify using "cheap" features.
  - Classical definitions (necessary-and-sufficient conditions) get partial support but fail when multiple rules fit the data.
  - Atomism (Fodor) would reject the whole enterprise - if concepts are primitive, reconstructing rules is meaningless.

  Theories that could coexist:
  - Theory-theory handles the curator's perspective well - concepts exist within explanatory frameworks.
  - Conceptual role semantics might accommodate the emphasis on relational structures.

  But here's the kicker: the user's last question is brilliant. If we truly embraced generalization ability alone, we'd need to redesign benchmarks completely. Maybe stress-test with counterfactual variations or adversarial examples. But then we're not testing concept learning anymore - just robust pattern recognition.

  The underdetermination point is settled (Quine wins), but everything else is contested. I should flag where theorists disagree - like whether "cheap features" are truly illegitimate or just evolutionarily basic. And definitely no pretending there's consensus - the literature is a battlefield on this.

  Most importantly, the user wants philosophy made useful for ML evaluation. That bridge-building is exactly what's needed here.
answer: |-
  This tension in Bongard problem evaluation reveals deep philosophical assumptions about concepts. Here's a breakdown, distinguishing settled, contested, and underdetermined aspects:

  ### **Settled Premises**
  1.  **Underdetermination of rules by data:** Any finite set of examples admits multiple generalization rules achieving perfect accuracy (Quinean indeterminacy). No serious theory disputes this.
  2.  **Accuracy ≠ rule recovery:** Performance on held-out items doesn't entail recovery of the curator's intended rule. This is empirically observable.
  3.  **Feature engineering reflects bias:** Curators deliberately suppress "cheap" features (like area or symmetry) to force relational reasoning. This is a design choice, not a discovery.

  ### **Presuppositions About Concepts**
  The practice implicitly assumes:
  1.  **Concepts are rule-structured (but non-classical):** It rejects the classical view (necessary-and-sufficient conditions) *for simple features*, but assumes complex relational rules *are* the target concept. Success means recovering *that specific rule structure*.
  2.  **"Legitimate" features are relational/causal:** Cheap features are "illegitimate" because they are perceptual, statistical, or extrinsic. Legitimate features involve object *relations*, *parts*, or *causal roles* (e.g., "touches at two points" vs. "total ink"). This assumes a metaphysics of "natural" properties.
  3.  **Projectibility is privileged:** The curator's rule is treated as more projectible (à la Goodman's "grue"). A rule using "bounding box width" might generalize *accidentally* from this dataset but fail on novel variations (e.g., scaled or rotated shapes), while the relational rule is robust.
  4.  **Intentionality matters:** Concepts are individuated by their content (the curator's intended rule), not just extension. Two systems with identical accuracy can have different concepts.

  ### **Theories of Concepts: Compatibility**
  | **Theory**               | **Compatible?** | **Why?**                                                                 |
  |--------------------------|-----------------|--------------------------------------------------------------------------|
  | **Classical (definitional)** | No              | Fails if no necessary-sufficient conditions exist (common in Bongard). |
  | **Prototype/Exemplar**   | No              | Predicts "cheap feature" use; can't privilege relational rules.        |
  | **Atomism (Fodor)**      | No              | Denies decomposable structure; rule recovery is irrelevant.            |
  | **Theory-Theory**        | **Yes**         | Concepts embedded in causal/relational frameworks; aligns with curator intent. |
  | **Conceptual Role Semantics** | **Partial**     | Could accommodate relational roles, but may not distinguish "legitimate" features. |
  | **Information-based**    | **No**          | Reduces concepts to covariance; can't exclude "cheap" features.        |

  ### **Contested Philosophical Ground**
  1.  **What makes a feature "legitimate"?** Is it:
      -   *Causal potency* (inferred roles in physical systems)?
      -   *Cognitive primacy* (human perceptual salience)?
      -   *Evolutionary utility*?
      *There is no consensus.* Eliminativists deny any principled distinction.
  2.  **Is concept identity tied to rules?** Neo-empiricists (e.g., Barsalou) argue concepts are simulation-based patterns, not rules. Rule-recovery would be irrelevant.
  3.  **Projectibility's foundation:** Why is the curator's rule "better"? Pragmatists say it's just more useful *for humans*; realists say it carves nature at joints. *Unresolved*.
  4.  **Role of intention:** Externalists (e.g., Putnam) argue concepts are fixed by external referents, not curator intent. This clashes with Bongard-Mirror scoring.

  ### **If Concepts = Generalization Ability**
  Dropping the "intended rule" requirement would force fundamental changes:
  1.  **Benchmark redesign:** Test generalization under *distribution shifts*:
      -   **Counterfactuals:** Vary irrelevant properties (e.g., rotate all images, change colors).
      -   **Adversarial examples:** Add shapes where "cheap features" fail but relational rule holds.
      -   **Causal interventions:** Modify images to test inferred causal dependencies.
  2.  **Risk of trivialization:** Accuracy alone could be achieved by overfitted models or brute-force memorization. The test loses its claim to measure "abstract concept learning."
  3.  **What it would still test:** Robust pattern recognition and out-of-distribution generalization—valuable, but not *distinctively* "conceptual" in the human-relational sense.

  ### **Underdetermination**
  The practice is philosophically underdetermined in key ways:
  -   **Natural kinds:** It assumes relational features are "more natural" but doesn't specify *why*. Multiple theories (essentialism, causal homeostatic clusters) could justify this.
  -   **Cognitive architecture:** It's compatible with symbolic rule systems (e.g., ACT-R) or connectionist models that learn relational invariances—no commitment to implementation.
  -   **Pragmatic vs. metaphysical:** Curators may select rules for learnability or pedagogical value, not metaphysical "truth." This needs no deep philosophical defense.

  **In essence**: Bongard-Mirror presupposes a *rule-structured, relationally biased, projectibly privileged* view of concepts. It rules out atomism, strict empiricism, and purely extensional theories. The core controversy lies in whether "concept learning" *should* require rule recovery or if generalization suffices—a debate between structuralists and behaviorists in cognitive science. No theory owns the consensus, and the practice's assumptions remain hotly contested.
