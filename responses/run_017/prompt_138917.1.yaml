prompt: |-
  I retired a few years ago (surface science, 35 years in the same industrial lab) and last autumn I started sitting in on a graduate seminar on agency at the university in town, mostly for the pleasure of arguing with people younger than me. I've got stuck on one thing and I'd like to know whether my reactions to a set of cases add up to any single principle, or whether I'm just having inconsistent gut feelings and dressing them up.

  The thing I keep chewing on is Galen Strawson's Basic Argument. My notes have it roughly like this:

  1. you do what you do, in any given situation, because of the way you are
  2. to be ultimately responsible for what you do, you have to be ultimately responsible for the way you are — at least in those mental respects that issued in the action
  3. you can't be ultimately responsible for the way you are, because for you to have made yourself a certain way you'd already have to have been a certain way, and that requires the same thing again, and so on
  4. so nobody is ever ultimately responsible for anything

  The part I find most annoying is the claim that it doesn't matter whether determinism is true: if the world is deterministic you're carried along by how you already are, and if it isn't, then whatever isn't settled by how you are is chance, and chance isn't you either.

  (While I'm here: there are two Strawsons, father and son, and I have it in my head that the father is the one who wrote about reactive attitudes and resentment. Is that right, or have I got it backwards?)

  Here are my verdicts, going on gut.

  Case 1, "remote control": a team of neuroscientists with an implanted stimulator switches on a violent desire in a man over lunch; he kills a coworker at 12:10. Not responsible. Obviously.

  Case 2, "programmed in advance": same team, no remote control. They arrange things while he's an infant — hormones, conditioning, careful placement of foster homes — so that the desire and the killing turn up when he's 40 with nobody touching anything at the time. I still say not responsible.

  Case 3, "ordinary bad start": same shape of story, but the causal history is an alcoholic mother, a violent stepfather, a rough school, no scientists anywhere. I do want to say responsible. Cases 2 and 3 are the embarassing pair, because as far as I can see the causal chains are the same kind of thing, and the only differences are who was doing the shaping and what they intended.

  Case 4, "ordinary, deterministic": decent upbringing, ordinary life, and stipulate the universe is deterministic in the Laplace sense. He embezzles from his employer after six weeks of going back and forth about it. Responsible.

  Case 5, "ordinary, indeterministic": same man, same life, but now stipulate the physics is indeterministic and the final decision is settled by which way a quantum event in his brain goes. I find myself saying less responsible, not more. That surprised me — I thought this was the case that was supposed to rescue free will.

  Case 6, "self-training": a woman who for years deliberately worked on being less sharp-tongued — reading, practice, a bit of therapy — and then, at a moment that mattered, said something cruel to her sister anyway. More responsible than someone who never tried. But I can hear Strawson saying the trying itself came from how she already was.

  Case 7, which I made up myself and most want comments on, "the convergent loop": at 20 she has character C0. She decides to make herself into a certain sort of person. Round one: she inspects her current dispositions, picks which to strengthen and which to weaken, applies drills, practice, whatever, and ends up with C1. Round two: the same procedure applied to C1, giving C2. And so on. The changes get smaller each round, and after a few hundred rounds she is at C*, where further rounds change nothing measurable. Then she acts from C*. So she has, about as well as a finite being could, made herself into what she is: the regress in step 3 got cut off by a process that converged instead of running forever. My gut says responsible, more clearly than in any of cases 1 to 3. My worry: C* is determined by C0 — different starting points would in general land on different fixed points — and she didn't choose C0.

  Case 8: an engineer builds a second agent directly with character C*, no loop. Same character, same action. My gut says not responsible. Which means I think the history matters and not only the machinery, and that is exactly what sits badly with 2 versus 3.

  My own attempt at a principle: an agent is responsible for an action iff the action issued from a mechanism in her that tracks reasons in the right way, and the history of how that mechanism got there matters only insofar as it affects how the mechanism works now. That gets cases 1, 4, 5 and more or less 6. It also makes 2 and 3 come out the same, and 7 and 8 come out the same, and both of those go against my gut.

  So: is there a principle that keeps more of my verdicts? I'd like two or three candidates, stated precisely enough that I can test them, each with the case that motivates each of its clauses, and I want you to tell me honestly which of my verdicts each one forces me to give up. Please also say what each candidate predicts for two cases I haven't decided about: (a) the loop agent from case 7, except that C0 was installed in her by the neuroscientists from case 2; (b) an agent whose loop never converges — the self-modifications keep changing her by roughly the same amount, indefinitely — and who acts at time t out of whatever character she happens to have at t.

  And: does the Basic Argument as I've written it actually tell against a principle like mine, or only against some stronger, "ultimate" kind of responsibility that my principle was never trying to secure? I cant tell whether I've answered it or changed the subject. Is anything really resting on the "it doesn't matter whether determinism is true" move, or is that just rhetoric?

  Please don't hand me a reading list — the library is a bus ride away and I've already got three books on the go. Just argue with me.
reasoning: |-
  Okay, let me try to unpack this retired scientist's dilemma. He's grappling with Galen Strawson's Basic Argument against moral responsibility, and his gut reactions to various thought experiments seem inconsistent. His core frustration is that Cases 2 and 3 feel different to him despite similar causal chains, and his convergent loop idea (Case 7) feels responsible while a pre-built equivalent (Case 8) doesn't. 

  Hmm... his self-proposed "reasons-responsive mechanism" principle gets many cases right but clashes with his intuitions about history mattering in Cases 2/3 and 7/8. That tension is the real knot here. He wants principles that preserve:
  - The neuroscientist-vs-upbringing distinction (2≠3)
  - The self-construction value (7>8)
  - Reduced responsibility in indeterminism (5<4)
  - Extra blame for failed self-improvers (6)

  First, let's map his verdicts clearly:
  1. Remote control: not responsible ✅ 
  2. Programmed infant: not responsible ✅ 
  3. Tough upbringing: responsible ❗(clashes with 2) 
  4. Deterministic embezzlement: responsible ✅ 
  5. Indeterministic decision: less responsible ✅ 
  6. Failed self-improver: more responsible ✅ 
  7. Convergent loop: responsible ✅ 
  8. Pre-built agent: not responsible ❗(clashes with 7)

  The sticking points are 2vs3 and 7vs8. His intuition says the origin story matters independently of current mechanisms. Strawson would call this irrational, but maybe we can systematize it.

  Three candidate principles come to mind:

  **Candidate 1: Historical Ownership**
  *Responsible iff (i) action issues from reasons-responsive mechanisms AND (ii) those mechanisms weren't externally imposed against one's agency.*
  - Motivations: Explains 2≠3 (neuroscientists imposed vs messy life didn't "impose"), 7>8 (self-built vs pre-built)
  - Sacrifices: Forces him to abandon his tough upbringing verdict (Case 3). If the stepfather's abuse shaped the killer, that's "externally imposed" too. Also complicates Case 6 - her self-improvement mechanisms were shaped by past externals.

  **Candidate 2: Self-Integration Depth**
  *Responsible iff the action coheres with a stable character that has survived extended rational scrutiny (even if not self-created).*
  - Motivations: Saves 7 (convergent scrutiny) and 3 (tough upbringing survivor has "tested" character), while 2 fails (no scrutiny). Also explains 5<4 (indeterminism breaks coherence).
  - Sacrifices: Loses 8 (pre-built has stability but no scrutiny) and possibly 6 (failed self-improver's lapse may still cohere with deeper traits?).

  **Candidate 3: Agency as Process**
  *Responsible iff the agent is presently capable of engaging in self-correction in response to reasons (regardless of history).*
  - Motivations: Pure mechanism view - gets 1,2,4,8 cleanly. Explains 5 (indeterminism disrupts reason-tracking).
  - Sacrifices: Forces surrender of ALL historical intuitions: 3≠2, 7≠8, and possibly 6 (if her mechanism is now reason-responsive, why extra blame?).

  Now testing his undecided cases:
  - **(a) Neuroscientist-installed C0 + convergent loop:** 
    - Candidate 1: Not responsible (tainted origin) 
    - Candidate 2: Responsible (scrutiny overrides origin) 
    - Candidate 3: Responsible (current mechanism is self-correcting)
  - **(b) Non-converging looper:** 
    - Candidate 1: Unclear - depends if constant change feels "external" 
    - Candidate 2: Not responsible (lacks stability) 
    - Candidate 3: Responsible (always reason-engaging)

  On Strawson: His Basic Argument only threatens "ultimate" responsibility (being causa sui). His own principle avoids this by settling for "reasons-responsive" - so he didn't answer Strawson, he sidestepped him. The determinism/indeterminism point stands though: both break ultimate responsibility, but his principle cares about reason-tracking, which indeterminism arguably harms (hence his Case 5 verdict).

  Final thought: His convergent loop is clever but Strawson would say C* is still determined by unconstituted factors (C0 + self-modification algorithm). The magic isn't in convergence but in the *evaluative stance* during modification - which might be what Candidate 2 captures.
answer: |-
  Your gut reactions aren't inconsistent—they reveal a coherent tension in theories of moral responsibility. Strawson's Basic Argument targets *ultimate* responsibility (being the "causa sui"), but your intuitions track a more practical, *attributability-based* responsibility that depends on history and reasons-responsiveness. Below are three candidate principles that preserve most of your verdicts, each sacrificing some to stay coherent. I'll state them precisely, show which cases motivate their clauses, list the verdicts you'd need to abandon for each, and address your questions about Strawson.

  ### Core Tension in Your Verdicts
  - **History matters independently**: Cases 2 vs. 3 (programmed infant vs. tough upbringing) and 7 vs. 8 (convergent loop vs. pre-built agent) show you treat the *origin* of character as relevant beyond current mechanisms.
  - **Indeterminism weakens responsibility**: Case 5 (indeterministic embezzler) feels *less* responsible than Case 4 (deterministic), contradicting libertarian free will.
  - **Self-construction intensifies blame**: Case 6 (failed self-improver) deserves more blame than someone who never tried.

  ---

  ### Candidate Principles
  **Candidate 1: Historical Reasons-Responsiveness**  
  *An agent is responsible for an action iff:*  
  (i) *The action issues from mechanisms that are currently reasons-responsive* (tracking moral/ prudential reasons in a minimally rational way),  
  (ii) *Those mechanisms were shaped by the agent’s own past exercises of reasons-responsiveness (when possible),*  
  (iii) *No external force directly bypassed or coerced the agent’s reasons-responsive capacities at the time of action.*  

  - **Motivated by**:  
    - Clause (i): Cases 1 (remote control bypasses reasons-tracking) and 4 (deterministic but reasons-responsive).  
    - Clause (ii): Cases 6 (self-training involves past exercises of agency) and 7 (convergent loop builds on prior self-modification).  
    - Clause (iii): Cases 1–2 (external manipulation bypasses agency).  
  - **Preserves your verdicts**: 1 (no), 2 (no), 4 (yes), 5 (less responsible: indeterminism disrupts reasons-tracking), 6 (more responsible), 7 (yes).  
  - **Forces you to abandon**:  
    - **Case 3 (tough upbringing)**: If the mechanisms are *currently* reasons-responsive, history is irrelevant. But you want to hold responsible even if upbringing was damaging.  
    - **Case 8 (pre-built agent)**: If C* is reasons-responsive, the agent is responsible—contra your "not responsible" gut.  
  - **Predicts your undecided cases**:  
    - (a) *Loop with neuroscientist-installed C0*: **Not responsible**. Clause (ii) fails—initial shaping wasn’t self-determined.  
    - (b) *Non-converging looper*: **Responsible** if mechanisms are currently reasons-responsive (clause i), regardless of instability.  

  **Candidate 2: Agency as Narrative Self-Constitution**  
  *An agent is responsible for an action iff:*  
  (i) *The action expresses the agent’s current character or values,*  
  (ii) *That character was shaped through a process of (minimal) rational endorsement by the agent,*  
  (iii) *The agent had a reasonable opportunity to reflect on or modify their character prior to the action.*  

  - **Motivated by**:  
    - Clause (i): Cases 1–2 (actions don’t express the *agent’s* values).  
    - Clause (ii): Cases 6–7 (self-training involves endorsement; convergent loop is self-constitution).  
    - Clause (iii): Cases 2 (no opportunity to reflect on programmed character) vs. 3 (opportunity exists, even if limited).  
  - **Preserves your verdicts**: 1 (no), 2 (no), 3 (yes), 6 (more responsible), 7 (yes), 8 (no).  
  - **Forces you to abandon**:  
    - **Case 4 (deterministic embezzler)**: If character wasn’t reflectively endorsed (e.g., he never questioned his values), no responsibility—but you said "responsible."  
    - **Case 5 (indeterministic)**: Same as Case 4, unless indeterminism enabled endorsement (but you see it as weakening responsibility).  
  - **Predicts undecided cases**:  
    - (a) *Loop with neuroscientist-installed C0*: **Responsible** if she reflectively endorsed her modifications (clause ii).  
    - (b) *Non-converging looper*: **Not responsible** if constant change precludes reflective endorsement (clause ii fails).  

  **Candidate 3: Control with Diachronic Ownership**  
  *An agent is responsible for an action iff:*  
  (i) *The agent had control over the action (no coercion or direct manipulation),*  
  (ii) *The action stemmed from desires/values the agent identifies with (or would identify with after rational reflection),*  
  (iii) *The agent’s identity-forming traits were not imposed by external forces they could not reasonably resist.*  

  - **Motivated by**:  
    - Clause (i): Cases 1–2 (no control), 4–5 (control unless randomness interferes).  
    - Clause (ii): Cases 6–7 (identification with self-improvement), 8 (no identification with pre-built traits).  
    - Clause (iii): Cases 2 (imposed by scientists) vs. 3 (not "imposed" in the same way—social forces are resistible).  
  - **Preserves your verdicts**: 1 (no), 2 (no), 3 (yes), 4 (yes), 5 (less responsible: indeterminism reduces control), 6 (more responsible), 7 (yes), 8 (no).  
  - **Forces you to abandon**: None of your core verdicts—but ambiguity in "reasonably resist" might trouble Case 3.  
  - **Predicts undecided cases**:  
    - (a) *Loop with neuroscientist-installed C0*: **Not responsible** if C0 was imposed and irresistible (clause iii).  
    - (b) *Non-converging looper*: **Responsible** if she identifies with her current traits (clause ii), even if unstable.  

  ---

  ### How This Addresses Strawson
  1. **You’ve sidestepped, not answered, the Basic Argument**:  
     Strawson targets *ultimate* responsibility (being the uncaused cause of yourself). Your principle (and Candidates 1–3) only requires *practical* responsibility: reasons-responsiveness, identification, or narrative ownership. This is consistent with Strawson’s point that determinism/indeterminism both *undermine ultimacy* but leaves room for attributability.  
     - **The "it doesn’t matter if determinism is true" move is substantive**: It blocks compatibilists (who say determinism allows responsibility) and libertarians (who say indeterminism saves it). But your Case 5 verdict (less responsible under indeterminism) agrees—randomness *disrupts* agency, making it neither determined-by-you nor controlled-by-you.  

  2. **Strawson father/son clarification**:  
     You’re correct. **P.F. Strawson** (father) wrote "Freedom and Resentment" (1962) on reactive attitudes (e.g., resentment presupposes responsibility). **Galen Strawson** (son) developed the Basic Argument (1994) against ultimate responsibility.  

  ---

  ### Recommendation
  - **Best fit for your intuitions**: **Candidate 3 (Control with Diachronic Ownership)**. It preserves *all* your verdicts by emphasizing history (e.g., external imposition in Case 2 vs. non-imposition in Case 3) and allows indeterminism to reduce control.  
  - **Trade-off**: It’s less "precise" than Candidate 1—terms like "reasonably resist" require judgment (e.g., was the stepfather’s influence "resistible" in Case 3?). But this matches your gut sense that history isn’t reducible to current mechanisms.  
  - **On your convergent loop (Case 7)**: Strawson would say C* is still determined by C0 (which you didn’t choose), but Candidate 3 makes the *process* of self-modification the source of responsibility—you "own" C* because you actively shaped it.  

  ### Why This Works
  You’re not inconsistent; you’re rejecting Strawson’s *all-or-nothing* view of responsibility. Your intuitions align with **semi-compatibilism** (John Fischer: responsibility requires guidance control, not ultimate freedom) plus **historical conditions** (e.g., Robert Kane: self-forming actions matter). The core insight: responsibility isn’t about being *unmoved movers* but about having a story where *we are the protagonists*.  

  Test Candidate 3 against your cases—especially whether "reasonably resist" lets you hold the tough-upbringing agent responsible (Case 3) while exempting the programmed infant (Case 2). If so, you’ve got your principle.
