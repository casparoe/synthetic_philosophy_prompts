            M5: Deworming - cost 10, impact 5
            M6: Sanitation - cost 40, impact 16

          Qualitative:
            Q1: Community health - cost 20, impact 12
            Q2: Education reform - cost 30, impact 20
            Q3: Women's empowerment - cost 25, impact 18
            Q4: Agricultural training - cost 15, impact 10
            Q5: Mental health support - cost 10, impact 8
            Q6: Disaster preparedness - cost 40, impact 30

      The cost-effectiveness (impact per chip) for measurable: 
          M1: 0.4, M2: 0.5, M3: 0.4, M4: 0.4, M5: 0.5, M6: 0.4.
      Qualitative:
          Q1: 0.6, Q2: 0.67, Q3: 0.72, Q4: 0.67, Q5: 0.8, Q6: 0.75.

      So qualitative are better.

      But without numbers, groups might not fund them? And they might fund the measurable ones.

      After phase 1, we score by adding the impact of the funded cards.

    Phase 2 instructions:
      "In phase 2, your group gets a new budget of 100 chips. You have the same set of intervention cards, plus a new card: a systemic change option. You can fund the interventions and/or contribute to the systemic change. The systemic change option has a threshold: if the total contributions from all groups combined reach 100 chips, then it will unlock 50 points for every group. However, the benefits will only be realized after this phase (so they count in your score for this phase). Note: if the threshold is not met, no points are awarded for the systemic change. You have 20 minutes."

    Phase 2 scoring:
      First, collect the systemic contributions from each group. Add them. If >=100, then award 50 points to every group. Then add the points from the other interventions they funded.

    Phase 3 instructions:
      "Now, each of you will make an individual choice. You will choose one of four career paths. Each career card lists the salary, the percentage of that salary you pledge to donate, the impact of the work itself (in points), and whether a replacement would take the job if you decline. Your total impact is calculated as: the amount you donate (which is salary times donation percentage) plus the work impact if and only if there is no replacement (if there is a replacement, then the work impact is not additional and doesn't count). You have 10 minutes to choose. Then we will calculate your impact."

      Distribute the four career cards to each participant.

    After phase 3, calculate the impact for each participant.

   Debrief (20 minutes):

    We reveal the three critiques:

      1. Measurability bias: In phase 1, we saw that groups tended to fund measurable interventions (with point estimates) even though the qualitative ones were on average more cost-effective. Why? Because measurable interventions are easier to compare. The audit option was underutilized because it costs resources and makes the card harder to compare. Even if used, the interval might lead to underinvestment in a good intervention because of uncertainty.

      2. Institutional critique: In phase 2, the systemic change option required collective action. We might have seen underfunding because groups were uncertain if others would contribute, or because the benefits were delayed and capped. This mimics the real-world underfunding of systemic change interventions.

      3. Counterfactual fragility of earning to give: In phase 3, we saw that careers with high donation potential (like finance) might seem attractive, but when we account for replacement, the direct work impact of other careers might be additional and higher. Also, careers that seem to have high direct impact (like research) might be overestimated if there is replacement.

    We then map specific moments:

      - Phase 1: 
          - "Did groups fund the qualitative interventions? Why or why not?" 
          - "Did any group audit a card? Why? Did it change your allocation?"
          - Reveal that the qualitative interventions were on average 50% more effective per chip. But without numbers, they were underfunded.

      - Phase 2:
          - "Did your group contribute to the systemic option? How much? Why?"
          - "What was the total systemic contribution? Did it meet the threshold?"
          - "Even if the threshold was met, note that the benefit was capped at 50 points per group, but the total cost was 100 chips. If one group had spent 100 chips on other interventions, they might have gotten more than 50 points. But collectively, 100 chips for 50*4=200 points is good (if there are 4 groups). But because of the threshold and delay, groups might have been hesitant."

      - Phase 3:
          - "How many of you chose Career 4 (research) because of the high work impact? What was your total impact? Now, if you account for replacement, it was only the giving."
          - "How many chose Career 1 (finance) for the high donations? It turned out to be 50 points, but was there a career that would have been better? Career 2 (nonprofit) was 57."
          - "This shows the importance of considering counterfactuals in career choice."

    What might go wrong:

      Phase 1:
        - Groups might not understand the audit option. Facilitator should clarify.
        - Groups might by chance fund qualitative interventions and do well. That's okay, but we can still point out that they did it without precise numbers.
        - Time might be tight. Keep an eye and warn at 10 minutes.

      Phase 2:
        - Groups might coordinate and all contribute exactly the threshold? But they are in separate groups and cannot communicate. So it's a public goods game. We predict underfunding.
        - If one group contributes a lot, others might free-ride? But they don't know what others are doing until after.

      Phase 3:
        - Participants might not understand the replacement concept. The facilitator should be available to clarify during the 10 minutes.

    What the mechanics cannot deliver and we have to state:

      - Measurability bias: The game cannot fully capture the long-term epistemic harm of favoring measurable interventions. We have to explain that in the real world, the qualitative interventions might be more innovative or address root causes, but the bias towards measurable ones might starve them of funding.

      - Institutional critique: The game simplifies systemic change to a threshold public good. Real systemic change is more complex, with longer time horizons, uncertainty about impact, and the need for coordination beyond funding.

      - Counterfactual fragility: The game assumes we know the counterfactual (replacement: yes/no). In reality, it's hard to know. Also, the critique is not just about replacement but also about the opportunity cost of not pursuing direct impact careers that are hard to fill.

    We must state these in the debrief.

   Let's write the exact scripts for the facilitator.

   Materials to prepare:

    - Intervention cards for phase 1 (12 cards: 6 measurable, 6 qualitative). Each card has:
          - Title
          - Description
          - Cost in chips
          - For measurable: a point estimate (e.g., "Cost per life saved: $X")
          - For qualitative: no numbers, just description
          - (On the back, or for the facilitator: the true impact in points)

    - Audit rule: groups can spend 10 chips to audit one measurable card. After audit, the card shows an interval (which we will provide on a separate card). The interval should be wide and include the true value.

    - Systemic change card for phase 2:
          Title: "Policy Change Campaign"
          Description: "Fund a campaign to change a government policy. If successful, it will lead to widespread benefits. The campaign requires a minimum of 100 chips (across all groups) to be launched. If funded, the campaign will succeed and every group will receive 50 points. The benefits will be realized after this phase."
          Cost: groups can contribute any number of chips (whole numbers).

    - Career cards (4 types, one set per participant). Each card has:
          - Career title
          - Salary (in points)
          - Giving fraction (percentage)
          - Description of work impact (in points) and whether it's positive or negative
          - Replacement information (yes or no, and a brief explanation)

    Example career cards (based on our design):

      Career 1: Investment Banker
          Salary: 100 points
          Giving: 50%
          Work impact: Your work involves facilitating mergers and acquisitions. This is considered neutral for the world. (0 points)
          Replacement: If you don't take this job, the bank will hire someone else with similar skills. (Yes)

          Total impact: 50 points (only from giving)

      Career 2: Nonprofit Director
          Salary: 60 points
          Giving: 20% (so 12 points)
          Work impact: You lead a nonprofit that provides essential services. Your leadership is exceptional and the organization would not perform as well without you for at least a year. (+45 points)
          Replacement: The nonprofit would not find a suitable candidate in time, so your absence would reduce the impact for a year. (No)

          Total impact: 12 + 45 = 57 points

      Career 3: Policy Advisor
          Salary: 70 points
          Giving: 25% (so 17.5 points, round to 18)
          Work impact: You advise on policies that improve public services. Without you, the policies would be less effective for a year. (+40 points)
          Replacement: No (they wouldn't find an equally effective replacement in time)

          Total impact: 18 + 40 = 58 points

      Career 4: AI Safety Researcher
          Salary: 90 points
          Giving: 30% (so 27 points)
          Work impact: Your research reduces the risk of harmful AI. However, the lab has many qualified applicants. If you decline, they will hire someone else who would do similar work. (+50 points)
          Replacement: Yes

          Total impact: 27 points

    Note: We rounded the giving for career 3 to 18.

    Poker chips: about 100 per group per phase. And some extra for audit.

    Whiteboard: to record group scores and systemic contributions.

    Prizes: trivial, like candy or a small toy.

   Timeline in detail:

    0-5 min: 
        - Facilitator: "Welcome to the Effective Altruism Allocation Game! We'll start by dividing into groups of 4 or 5." 
        - Form groups (4 groups of 4-5).

    5-25 min: Phase 1
        - Distribute to each group: 
            - 100 poker chips
            - A set of 12 intervention cards (shuffled)
            - A rule sheet for phase 1 (including audit rule)
        - Explain the rules (as above). Answer clarifying questions.
        - Groups work for 20 minutes.

    25-30 min: 
        - "Time's up! Please stop and calculate your total impact. I'll come around to collect your funded cards and the impact you think you have? But note: we have the true impacts. So just tell me which cards you funded and if you did any audits. I'll calculate your score."
        - Facilitator quickly calculates and writes the group scores on the board.

    30-50 min: Phase 2
        - "Now, phase 2. Each group gets a new budget of 100 chips. You have the same intervention cards, plus a new card: the systemic change option. You can contribute any number of your chips to the systemic change, and use the rest on the intervention cards. The systemic change has a threshold of 100 chips across all groups. If the total meets or exceeds 100, then every group gets 50 points. If not, no one gets anything from it. The points from this phase are the points from the interventions you funded plus 50 if the systemic change is unlocked."
        - Distribute the systemic change card and a new 100 chips to each group.
        - Groups work for 20 minutes.

    50-55 min:
        - "Time's up! Please tell me how much your group contributed to systemic change and which interventions you funded with the remaining chips."
        - Record systemic contributions on the board. Sum them. If >=100, announce that the systemic change is unlocked and add 50 to every group's score from phase 2.
        - Calculate intervention points for each group and add to the systemic bonus (if any) to get phase 2 score. Add phase 1 and phase 2 scores for a cumulative group score.

    55-65 min: Phase 3
        - "Now, individually, you'll choose a career. Here are four career cards. Read them and choose one. Remember: your total impact is your donation (salary * giving fraction) plus the work impact only if there is no replacement. If there is a replacement, then the work impact doesn't count because it would have happened anyway."
        - Distribute the four career cards to each participant. They choose one and write their name and choice on a slip of paper.

    65-70 min: 
        - Collect choices. Calculate each person's impact. Announce the top scorers and the group cumulative scores.

    70-90 min: Debrief
        - Reveal the three critiques and connect to the game.

    Debrief script:

        "Today's game was designed to illustrate three common critiques of effective altruism. Let's see how they played out.

        Critique 1: Measurability bias. In phase 1, we had interventions with precise numbers and others with qualitative descriptions. We set the qualitative ones to be, on average, 50% more cost-effective. Did your group fund them? [Discuss] Often, groups underfund qualitative interventions because they are harder to compare. The audit option was meant to introduce uncertainty into the measurable ones, but it cost chips and might not have been used. This reflects a real bias: in EA, we tend to favor interventions that are easier to measure, even if they are less effective.

        Critique 2: The institutional or systemic-change critique. In phase 2, we introduced a systemic option that required collective action. It had a threshold, was capped, and delayed. In real life, systemic changes (like policy reform) often have these features and are underfunded because they are less attractive to individual donors. Did your group contribute? [Discuss] Even if we met the threshold, note that the benefit was fixed and delayed, which might have made it less appealing.

        Critique 3: The counterfactual fragility of earning to give. In phase 3, we saw that high-earning careers might allow for high donations, but we must consider the counterfactual: would someone else have taken the job? And what about the direct impact of the career you give up? For example, the nonprofit director had an impact of 57, which was higher than the investment banker's 50. And the research career seemed very impactful (77 points if you added the work impact) but after replacement, it was only 27. This shows that career impact is highly dependent on counterfactuals.

        However, the game simplifies these critiques. In reality:

          - Measurability bias can lead to underfunding of innovative or root-cause interventions.
          - Systemic change is more complex and might require long-term, uncertain efforts.
          - Counterfactuals are hard to estimate in real careers.

        We hope this game helped you feel the pull of these critiques. Any questions?"

    Note: The facilitator should be flexible and use the actual outcomes of the game to illustrate.

    Finally, award the trivial prize to the highest scoring group and individual.

    End.
answer: |-
  Below is a comprehensive design for your 90-minute workshop. The activity uses a three-phase allocation game to organically surface three critiques of Effective Altruism (EA) without explicitly naming them until the debrief. The critiques are:  
  1. **Measurability bias**: Over-reliance on quantifiable interventions, neglecting equally/more effective qualitative options.  
  2. **Institutional critique**: Underfunding systemic change due to delayed/capped payoffs and coordination problems.  
  3. **Counterfactual fragility**: Overestimating the impact of "earning to give" careers due to replaceability.  

  ---

  ### **Materials**  
  **1. Intervention Cards (Phase 1 & 2):**  
  - **6 measurable interventions** with precise cost-per-impact (e.g., "Antimalarial bed nets: $5 per life saved").  
  - **6 qualitative interventions** with only descriptive impact (e.g., "Community health training: Trains local workers to diagnose diseases. Impact depends on community engagement.").  
  - **Audit cards** (one per group): Spending 10 chips to replace a measurable card’s point estimate with a wide interval (e.g., "$5" → "$3–$20").  

  **2. Systemic Change Card (Phase 2):**  
  - "Global Vaccine Access Campaign: Lobby governments to fund vaccines in low-income countries.  
    - Cost: Any amount (chips).  
    - Impact: 50 points for all groups, BUT only if total contributions ≥60 chips.  
    - Payoff: Delayed (awarded at phase end) and capped (max 50 points)."  

  **3. Career Cards (Phase 3, one set per participant):**  
  | Career          | Salary (chips) | Giving Fraction | Work Impact (points)                      | Replacement? |  
  |-----------------|----------------|-----------------|-------------------------------------------|--------------|  
  | Finance Manager | 100            | 50%             | Neutral (0 points)                        | Yes          |  
  | Nonprofit Director | 40            | 20%             | +30 points (scales services)              | No           |  
  | AI Researcher   | 80             | 30%             | +40 points (safety innovation)            | Yes          |  
  | Policy Advisor  | 60             | 10%             | +15 points (improves regulations)         | No           |  

  **4. Other:**  
  - Poker chips (100 per group per phase, no real money).  
  - Whiteboard (track scores/systemic funding).  
  - Prizes (e.g., candy).  

  ---

  ### **Rules & Payoff Scheme**  
  - **Scoring**: Points = estimated lives saved/improved (higher = better).  
  - **Phase 1 (Portfolio Allocation)**:  
    - Groups spend 100 chips across interventions.  
    - Measurable cards: Use point estimates (e.g., $5/life = 20 lives per 100 chips).  
    - Qualitative cards: Groups *estimate* impact (e.g., "we think this saves ~25 lives").  
    - **Audit move**: Spend 10 chips to replace a measurable card’s point with an interval.  

  - **Phase 2 (Systemic Option)**:  
    - New 100-chip budget. Same cards + systemic option.  
    - Groups contribute chips to systemic change (recorded secretly).  
    - Systemic payoff: 50 points for *all groups* only if total contributions ≥60 chips.  

  - **Phase 3 (Career Choice)**:  
    - Each player picks one career card.  
    - **Impact formula**:  
      `Total points = (Salary × Giving Fraction) + (Work Impact ONLY if Replacement = "No")`  
      *Example: Finance Manager = (100 × 50%) + 0 = 50 points (work impact neutral + replaceable).*  

  - **Prizes**: Highest-scoring group (Phases 1–2) and individual (Phase 3).  

  ---

  ### **Timeline & Facilitator Script**  
  **Total: 90 minutes**  

  #### **Phase 1: Portfolio Allocation (25 mins)**  
  - *0–5 mins*: **Introduction**  
    > "Welcome! Today, you’re philanthropists with 100 chips to spend on interventions. Your goal: Maximize points (lives saved). No calculators—use your best judgment! Split into groups of 4–5."  
    > *Form groups, distribute chips, and intervention cards (mixed measurable/qualitative).*  

  - *5–20 mins*: **Group Work**  
    > "Spend 100 chips across interventions. For qualitative cards, estimate impact. Optional: Spend 10 chips to ‘audit’ a measurable card—replace its number with a wide interval. You have 15 minutes."  
    > *Circulate, answer questions. Predict: Groups favor measurable cards; few audits.*  

  - *20–25 mins*: **Scoring**  
    > "Time’s up! Share your funded cards. For measurables, use the point/interval. For qualitative, we’ll use your estimates. I’ll record scores."  
    > *Track group scores on whiteboard.*  

  #### **Phase 2: Systemic Change (25 mins)**  
  - *25–30 mins*: **Instructions**  
    > "New round! New 100 chips. You have the same cards plus a *systemic option*: Lobbying for vaccine access. If all groups combined contribute ≥60 chips, every group gets 50 points. But: Payoff is delayed (awarded now) and capped (max 50)."  
    > *Distribute systemic cards.*  

  - *30–45 mins*: **Group Work**  
    > "15 minutes to decide: Fund interventions, contribute to systemic change, or both. Systemic contributions are secret until the end."  
    > *Predict: Groups underfund systemic option; focus on guaranteed, immediate payoffs.*  

  - *45–50 mins*: **Scoring**  
    > "Reveal systemic contributions. Did we hit 60 chips?"  
    > *Add 50 points to all groups if threshold met. Update scores.*  

  #### **Phase 3: Career Choice (15 mins)**  
  - *50–55 mins*: **Instructions**  
    > "Now, individual choice! Pick one career. Your impact: Donations (salary × giving %) + work impact (ONLY if no replacement would take your job)."  
    > *Distribute identical career card sets (one per player).*  

  - *55–60 mins*: **Choice & Scoring**  
    > "2 minutes to choose! Calculate your points."  
    > *Collect choices, announce individual scores.*  

  #### **Debrief (20 mins)**  
  - *60–70 mins*: **Reveal Critiques**  
    > "Today’s game mirrored three critiques of EA:  
    > **1. Measurability bias**: In Phase 1, measurable cards (e.g., bed nets) felt ‘safer,’ but qualitative ones (e.g., community training) were often equally/more effective. Audits cost chips and made cards harder to compare—so you avoided them, even though they revealed uncertainty. This bias favors quantifiable interventions, even if they’re suboptimal.  
    > > *Map to game*: Did you neglect qualitative cards? Skip audits?  
    >  
    > **2. Institutional critique**: Systemic change (Phase 2) had delayed, capped payoffs and a funding threshold. Contributing felt risky—what if others didn’t chip in? Result: Underfunded, even though 50 points for 60 chips was a bargain. Real-world systemic work (policy/norm change) faces the same barriers.  
    > > *Map to game*: Did your group contribute? How did the threshold/delay affect you?  
    >  
    > **3. Counterfactual fragility**: In Phase 3, ‘earning to give’ careers (e.g., Finance Manager) had high donations, but replaceability canceled work impact. Meanwhile, irreplaceable careers (e.g., Nonprofit Director) added work impact. But if you didn’t check ‘replacement,’ you overestimated some options!"  
    > > *Map to game*: Who chose Finance/AI Research? Did replacement change your impact?  

  - *70–75 mins*: **Group Reflection**  
    > "Discuss:  
    > - When did you feel frustrated by the rules?  
    > - How might these critiques affect real-world EA?"  

  - *75–80 mins*: **Limitations & Takeaways**  
    > "What the game *couldn’t* show:  
    > - **Measurability**: Real qualitative work (e.g., advocacy) can have massive, hard-to-track ripple effects.  
    > - **Systemic change**: Thresholds/delays are often murkier IRL; coordination is harder.  
    > - **Counterfactuals**: Replaceability is probabilistic, not binary.  
    >  
    > Key takeaway: These critiques aren’t dealbreakers—they’re reminders to:  
    > (1) Diversify beyond measurable interventions,  
    > (2) Fund institutional work strategically,  
    > (3) Deep-dive into career counterfactuals."  

  - *80–90 mins*: **Award prizes, Q&A**.  

  ---

  ### **Predicted Problems & Fixes**  
  1. **Phase 1 confusion**: Groups may ignore qualitative cards or misunderstand audits.  
     - *Fix*: Clarify rules upfront; give an audit example.  

  2. **Phase 2 threshold not met**: If no group contributes, systemic change fails, muting the critique.  
     - *Fix*: Secretly ensure one group "seeds" 10+ chips (if needed) to inspire contributions.  

  3. **Phase 3 formula errors**: Players may add work impact for replaceable jobs.  
     - *Fix*: Emphasize "ONLY if Replacement = No" in instructions; check calculations.  

  4. **Time pressure**: Groups rush, miss nuances.  
     - *Fix*: Announce time warnings (e.g., "5 mins left!"); keep phases strict.  

  ---

  ### **What the Mechanics Can’t Deliver**  
  - **Measurability bias**: The game can’t show how this bias *distorts long-term priorities* (e.g., underfunding foundational research). State: "In EA, measurability can crowd out patient, high-risk/high-reward work."  
  - **Institutional critique**: The game simplifies systemic change’s *complex causality* (e.g., policy wins aren’t guaranteed). State: "Real systemic work has ambiguous pathways; success isn’t as binary as a threshold."  
  - **Counterfactual fragility**: The game treats replaceability as binary, but real careers involve *probabilistic counterfactuals*. State: "Replaceability is a spectrum; earning-to-give can still be impactful if talent gaps exist."  

  This design fosters experiential learning while minimizing lecture. Participants feel the critiques through gameplay, making the debrief resonant and memorable. Run it, iterate based on feedback, and enjoy!
