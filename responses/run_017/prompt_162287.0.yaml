  - **Silence:** Emphasize no talking during the game. The facilitator rings the bell to start and end each round.
  - **Display:** Use the whiteboard to show:
     - Round number
     - Current choices (e.g., "Blue: 8, Red: 4" or whatever)
     - Result (e.g., "All Blue: 2 points each" or "Mismatch: 0 points")
     - Update the cumulative scores for each player (by player number).
  - **Scoring:** Assign a scorekeeper (facilitator or a volunteer). Use large numbers on the whiteboard.
  - **Choice Cards:** Make sure they are large and clear (big BLUE and RED letters or colors).
  - **Newcomer Simulation:** When a player becomes a newcomer, give them a card that says: "You are a new player. You have just joined the group. You do not know what happened in previous rounds. You only know the rules: choose Blue or Red to try to get the most points. You get 2 points if everyone chooses the same color, 0 otherwise." (In stage 2, the payoff is still the same.)

