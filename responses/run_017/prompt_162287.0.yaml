     - Use large print and clear colors. Make sure the whiteboard is visible to all. Use a loud bell. Check with the group about visibility and volume at the start.

  6. **Time management:**
     - Plan for 15 rounds, but be ready to cut short if running out of time. Skip the optional stage if needed.

  **What the Game Can't Reproduce and You'll Have to Explain:**
  - The formal definition of convention (Lewis's conditions: regularity, arbitrariness, general preference for conformity, etc.).
  - The difference between a convention and a habit (habit doesn't require coordination) or a rule backed by punishment (conventions are self-enforcing by the desire to coordinate).
  - The scale: real conventions involve thousands of people over lifetimes without a facilitator. In the game, the facilitator sets the rules and changes the payoffs. In real life, the payoffs might change naturally (e.g., technology makes a different coordination point better) but without a central announcer.
  - The concept of common knowledge: the game illustrates it, but you'll have to explain the definition.

