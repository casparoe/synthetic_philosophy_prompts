  1. **Materials:**
     - Whiteboard and markers (for scores and round results)
     - Bell
     - Choice cards: 12 sets of two cards (Blue and Red) - make them large and distinct.
     - Instruction cards for each stage (for newcomers, for private payoff change, for asymmetric preferences) in large print.
     - Score sheets or a way to track cumulative points by player number.

  2. **Player Numbers:**
     - Assign each player a number (1-12) at the start and write it on a name tag or card they can see. This is for scoring.

  3. **Flow:**
     - Introduction (5 minutes): Explain the rules: 
          - "We are playing a game about making choices. Each round, you will choose Blue or Red by holding up a card. Your goal is to earn as many points as possible. The points depend on what everyone else does. 
          - Rules for the first rounds: If everyone chooses the same color, everyone gets 2 points. If there is any mismatch (even one person different), everyone gets 0.
          - We will play multiple rounds. There will be no talking during the game. I will ring the bell to start and end each round.
          - I will record the choices and update the scores on the board."
