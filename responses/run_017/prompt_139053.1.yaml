prompt: |-
  I'm a staff engineer on the platform team at a mid-sized software company. I have no philosophy background — one freshman course I remember badly — and I've been volunteered to give a forty-five-minute internal brown-bag next month on "worst-case versus average-case guarantees in AI safety," a title someone else picked and that I'm free to change. The room will be roughly twenty-five people: mostly backend and infrastructure engineers, four or five ML people who actually train and evaluate models, three PMs, and one lawyer from the policy team who asked to sit in. Almost everyone will walk in with two things already in hand: the intuition that this is a temperament difference (careful people want worst-case bounds, pragmatic people ship on averages), and the reflex example of quicksort's quadratic worst case against randomized expected linearithmic behavior. I ran the talk past my partner, who's a statistician, and she compressed the whole thing into "it's just a question of your reference class" in about five minutes — correct, I think, but useless for this room, and I'd rather not build on the sorting example even as a thirty-second on-ramp, because in sorting a bad case costs you time and I need them to feel that here the bad cases can be rare, individually cheap-looking, and correlated with one another.

  So don't explain the distinction to me — plan how I should explain it. What I most need is the dependency structure: what has to be in place before "we have a worst-case guarantee" or "we have an average-case guarantee" is even a well-formed sentence. My own guess is that a guarantee is three-place rather than one-place — a bound on some named metric, over some named set, for some named system-in-a-context — and that people collapse three different axes into the phrase "worst case": worst or average over inputs including an adversary with a stated budget; over which model you happened to get out of training, given seed and run-to-run variance; and over the future deployment distribution. But I can't sequence it, and the two points I care most about are ones I keep failing to place: first, that an average-case claim quietly assumes failures are independent across components and across time, when the interesting failures are precisely the ones where a single input breaks three things at once, and that if we only ship systems that pass evaluation then the population we measured is a selected subset of the population we deploy, so the average we estimated isn't the average we get; second, that a worst-case claim is trivially satisfiable by a system that does nothing, so the real object of interest is never a bound on its own but a bound paired with a usefulness floor. Tell me where each of those has to land and what has to be said first for them not to sound like word games.

  Beyond the sequencing I need three more things. One: the single example that should carry the whole forty-five minutes, with an account of what it must have and what it must lack — my candidate is our internal code-migration agent, which has write access to a subset of repos, but I'll take something better if that's the wrong shape; my constraints are that the bad outcome has to be discrete and easy to picture, the tail has to be fat and correlated rather than a clean independent coin flip, and it must not smuggle in anything that reads as science fiction. Two: the misconceptions in the order this particular audience will form them, and the exact point in the sequence where each should be headed off — I'd guess they'll include "worst case means jailbreaks and average case means normal users," "with N components the risk just divides so averages are fine," "if we've bounded the worst case we've bounded the risk," and "the guarantee is a property of the model rather than of the model plus its scaffolding and permissions" — and I'd like a closing check that would show it landed, not just that people were interested; I was considering handing out a one-line invented spec of a guarantee and asking which axis it quantifies over and what single edit would render it vacuous, but tell me if that's a bad test. Three: what I should openly decline to cover at this level, and a sentence I can use to decline it that doesn't sound like evasion — my instinct is to rule out whether future systems will be agentic or on what timescale, interpretability internals, formal verification and probabilistic certificates, and expected-value reasoning under deep uncertainty, on the grounds that they're real but are a different talk, and I'd rather say that explicitly than have the lawyer or one of the ML people drag us into it for twenty minutes.
reasoning: |-
  Okay, the user is a staff engineer preparing a talk on worst-case vs average-case guarantees in AI safety. They need to explain this concept to a mixed audience of engineers, ML practitioners, PMs, and a policy lawyer. The audience already has some intuition but needs a deeper understanding, especially about dependency structures and why worst-case matters beyond just being cautious.

  First, I need to figure out the core structure. The user mentioned that guarantees are three-place: metric, set, system-in-context. That makes sense. Breaking it down into these axes will help clarify. The three axes could be: input distribution (adversarial vs benign), model instantiation (training randomness), and deployment environment. 

  The user’s key points are about correlated failures and selection bias in evaluations. Also, worst-case guarantees are useless without a utility floor. Sequencing is crucial here. Start with the three axes to set the foundation before diving into the pitfalls. 

  For the example, the internal code-migration agent is a good candidate because it’s real, not sci-fi. The bad outcome (e.g., deleting a critical file) is discrete and understandable. The fat tail comes from rare but catastrophic mistakes, possibly correlated if multiple agents act under similar conditions. Need to highlight how average-case might miss these because they’re rare, but when they happen, they cascade.

  Misconceptions to address: 
  - Worst-case isn't just jailbreaks; it’s any input within the threat model. 
  - With N components, risks don’t just divide; failures can amplify. 
  - Bounding worst-case doesn’t eliminate risk if the system is useless. 
  - Guarantees depend on the whole system, not just the model.

  The closing check with an invented spec is smart. Asking which axis is quantified and how to make it vacuous tests understanding. For example, "99.9% accuracy on test set" quantifies over inputs and models, but changing "test set" to "adversarial inputs" could make it vacuous if not specified.

  Declining topics like agentic systems or formal verification is necessary to stay focused. Phrasing it as "these are important but separate discussions" keeps it from sounding evasive.

  Putting it all together: 
  1. Start with the three axes of guarantees. 
  2. Use the code-migration example to illustrate. 
  3. Break down each axis with the example. 
  4. Introduce pitfalls: correlated failures and selection bias. 
  5. Address misconceptions as they arise. 
  6. End with the utility floor concept. 
  7. Close with the spec exercise.

  Need to ensure the example is relatable. The code agent has access, makes rare but costly mistakes. Show how average-case might approve it based on most tasks being fine, but worst-case considers the catastrophic deletion. Correlated failures if multiple agents run the same flawed script. Selection bias if evaluations only test safe repos, not the full deployment set.

  Timing: 45 minutes. Allocate time for each section, leaving room for Q&A. The pitfalls section is critical, so spend enough time there. The closing exercise should reinforce key points without taking too long.
answer: |-
  Here’s a structured plan for your talk, designed to build understanding step-by-step, preempt misconceptions, and land your key points effectively. I’ll sequence the content, anchor it with your code-migration example, and embed defenses against predictable misunderstandings.

  ---

  ### **Talk Title Suggestion**  
  *"When Averages Lie and Worst Cases Bite: Guarantees for Real-World AI Systems"*  
  *(Subtlely shifts focus from philosophy to engineering tradeoffs)*

  ---

  ### **Core Sequencing & Dependency Structure**  
  **Start with the "Three Axes of Guarantees"** (15 mins)  
  *Frame: "A guarantee is meaningless without defining three things."*  
  1. **Metric:** What are we measuring? (e.g., "Code correctness rate," "Safety violation rate")  
  2. **Set/Scope:** Over *what* are we measuring? This has **three critical dimensions**:  
     - **Input Distribution** (Benign users vs. adversaries with X capabilities)  
     - **Model Instantiation** (Expected over training randomness vs. worst-case seed)  
     - **Deployment Environment** (Current testbed vs. future real-world shifts)  
  3. **System-in-Context:** The *full stack* (model + scaffolding: guardrails, monitoring, permissions, human oversight).  

  > *Why this first?* Without this, "worst-case guarantee" is ambiguous. Preempts *"guarantee is just a model property"* by forcing system-level thinking.

  ---

  ### **The Unifying Example: Your Code-Migration Agent**  
  *Perfect fit. Use it throughout.*  
  - **System:** Agent with write access to repos; migrates legacy code → modern framework.  
  - **Good outcome**: Correct migration, tests pass.  
  - **Bad outcome**: **Deletes critical files** (discrete, visceral, non-sci-fi).  
  - **Fat tail**: Rare (1/10k migrations?) but catastrophic (prod outage).  
  - **Correlation**: Triggered by specific code patterns (e.g., "old_config_loader.py"). All agents with same training fail identically.  

  ---

  ### **Pitfalls Section: Where Guarantees Mislead** (20 mins)  
  *Sequence these **after** the three axes are established.*  

  1. **"Average-case assumes independent failures"**  
     - *Setup:* Show math: If failure rate = 0.01%, and failures independent, P(system-wide failure) is tiny.  
     - *Reality:* In your code-migration example: **One bad input pattern** causes 3 failures at once (e.g., deletes config, breaks auth, corrupts logs).  
     - *Key point:* "Correlated failures break average-case math. Safety risks are *systemic*, not coin flips."  

  2. **"Selection bias in evaluation"**  
     - *Setup:* "We tested on 1,000 repos and saw 0 failures!"  
     - *Reality:* Test repos were clean/well-documented; real repos include spaghetti code from 2012.  
     - *Key point:* "Your 'average' is over a *selected subset*, not deployment. Real world has darker tails."  

  3. **"Worst-case without utility is useless"**  
     - *Setup:* "We guarantee no file deletions! (How? The agent rejects *all* migration requests.)"  
     - *Key point:* "A guarantee must pair a *risk bound* (e.g., 'never deletes files') with a **utility floor** (e.g., 'completes 95% of valid migrations')."  

  > *Why this order?* Pitfalls 1 and 2 dismantle average-case complacency. Pitfall 3 blocks the "worst-case = paranoid overkill" reflex.

  ---

  ### **Preempting Misconceptions**  
  Address these **as they naturally arise in the flow**:  
  - *"Worst-case = jailbreaks"* → When defining **Input Distribution**: "It includes *any* input in scope — not just hackers, but edge cases like legacy code patterns."  
  - *"N components divide risk"* → During **correlated failures**: "If Component A fails, Components B and C often fail too in AI systems. Risks *multiply*, not divide."  
  - *"Worst-case bound = safe"* → During **utility floor**: "Safety isn’t just avoiding harm — it’s delivering value *while* avoiding harm. A paperweight is ‘safe’ but useless."  
  - *"Guarantee is just about the model"* → Opening with **System-in-Context**: "If your monitoring misses a failure mode, your ‘safe model’ is unsafe in practice."  

  ---

  ### **Closing Check: "The Guarantee Stress Test"**  
  *Hand out this spec:*  
  > *"Our model achieves 99.9% accuracy on benign user queries."*  

  Ask:  
  1. *Which axes are defined?* (Metric = accuracy; Set = benign inputs; Model-only — missing system/env).  
  2. *What makes it vacuous?* Change **"benign" to "adversarial"** → Accuracy drops to 0% if attacked.  
  *Why it works:* Tests if they spot incomplete scoping — the core takeaway.  

  ---

  ### **What to Explicitly Exclude**  
  State upfront:  
  > *"We won't cover agentic planning, formal verification, or forecasting future risks — not because they're unimportant, but because today's focus is on **structuring guarantees for systems we build now**."*  

  This sets boundaries without dismissal. Redirect policy/ML questions: "That’s a great topic for a deep-dive on [X], but for today, let’s focus on..."

  ---

  ### **Why This Works for Your Audience**  
  - **Engineers** get a structured framework (axes/scoping).  
  - **ML Practitioners** see beyond accuracy metrics to systemic risk.  
  - **PMs** grasp tradeoffs between "ship fast" (average-case) and "don’t break prod" (worst-case).  
  - **Lawyer** understands why "we tested it" ≠ "it’s safe".  

  The code-migration example ties theory to daily work, avoids sci-fi, and makes correlated failures tangible. By sequencing pitfalls *after* foundations, you ensure "word games" become concrete engineering constraints.
