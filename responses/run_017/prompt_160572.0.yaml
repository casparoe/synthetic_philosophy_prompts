prompt: |-
  I'm giving the commencement address at a joint graduation for the philosophy department and the computer security lab, and half the room are people who spent a semester on Glaucon's challenge and the ring of Gyges, while the other half just built an app that gives senders perfect deniability, so you can wrong someone with no record and no reputational cost. Please write a short, funny-ish but serious five-minute address that uses the ring of Gyges to say something true about why be moral when nobody can ever find out, and that lands for the philosophers without losing the engineers' families. Glaucon's challenge, remember, is that people are just only because of reputation and consequences, not because justice benefits them, and that with the ring the just person would do everything the unjust person does. Here's the twist I want it built around: call it the unremembered wrong, where the app doesn't just hide the act from everyone else, it also scrambles your own memory of it, so afterward you can't feel guilty, enjoy the loot, or even know you did it. Does that make Glaucon's challenge stronger or weaker, and what does your answer let you say to graduates who might actually build or use such a tool? Don't just reassure them that justice pays in the soul; deal with the unremembered wrong directly.
