  I notice Gerald makes a strong claim: that under strict superrationality, the solution must be "all send" or "none send." But this leads to guaranteed failure in Platonia, which defeats the purpose. Miriam rightly points out this makes superrationality useless here. Yet Gerald's correlated randomness idea has merit - a public signal would indeed solve the problem perfectly.

  The user mentioned Hofstadter's "Luring Lottery" experiment where people actually behaved selfishly. That's a good real-world counterpoint to superrational ideals, though as Miriam says, psychology ≠ rationality.

  Where do I stand? Both have valid points within their frameworks. Miriam's approach works mathematically but may dilute "true" superrationality by allowing private randomness. Gerald preserves epistemic purity but at the cost of practicality. The missing piece might be distinguishing levels: the strategy (p=1/20) vs its execution (private coin flips). Superrationality applies to choosing the strategy, not synchronizing coin tosses.

