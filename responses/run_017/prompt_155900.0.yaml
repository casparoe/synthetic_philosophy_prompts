prompt: |-
  Bit of background first: I'm a retired hydrologist — forty years of stream chemistry, mostly boring, occasionally not — and over the last year I've drifted into a philosophy reading group at the library. Last month we did a session on lying and I came away unable to say what I actually think, so I want to try it backwards: gut verdicts first, principle afterwards. And please answer in British English — organise, colour, that sort of thing.

  Here's what I find myself saying, off the top of my head.

  My neighbour's six-year-old shows me a drawing and asks if I like it. It's a mess. I say it's lovely. Not a problem at all; I'd do it again tomorrow.

  A phone scammer pretending to be from my bank: I make up a sort code and give him that. Fine, and not even slightly wrong.

  Telling my GP I have two drinks a week when it's more like ten. Not fine, but small.

  The one that started all this: in the nineties our field crew told a landowner we were doing a conservation survey for the state when we were actually doing preliminary sampling for a mining company. Not fine, and I still feel sour about it thirty years on — worse than the GP one, and I don't think that's just about the size of the lie.

  My wife is in hospice. She asked whether her nurse would be back in the morning; the nurse had said maybe, maybe not. I said yes. Fine, and I'd defend it against anyone in that group.

  Letting something false stand: a new neighbour introduced me at a party as a professor. I'm not one. I let it go. Barely registers as a moral event.

  But: in a methods section, writing a sentence that is literally true of my data while choosing the phrasing precisely so that readers will draw a false conclusion about sample size. That feels like a real lie to me, and worse than the professor thing, even though nothing I wrote was false.

  And the bit I can't shake: someone in the group said Augustine's line is that what makes something a lie is the intention to deceive, not whether what you say is false — so a false statement you honestly believe isn't a lie at all — and that once it is a lie, it's a sin, full stop. On that reading my wife and the farmer come out the same, and my professor case doesn't come out at all. I think the first half is right and the second half is nuts, but I can't say why.

  So: is there one principle — about what counts as a lie, and about what makes a lie permissible when it is — that gets close to all seven? I'd like it stated tightly enough that I can test it, and then: which clause is doing the work in which case? Which of my verdicts can it not accommodate, and which one would you have me drop? And run it on two I haven't decided: lying to a voice assistant I know transcribes into a shared family log, and telling a friend a truth he begged me not to tell him.
reasoning: |-
  Okay, let me tackle this step by step. The user is a retired hydrologist with decades of field experience, now engaging with philosophy. They've presented seven real-life scenarios where they've lied or allowed deception, each with their gut moral verdict. The core challenge is finding a unified principle that explains all these judgments consistently, while addressing Augustine's definition that ties lying solely to intent to deceive.

  First, I need to categorise their examples. The neighbour's child praise and scammer deception feel harmless, while the GP understatement and mining survey deception weigh heavier. The hospice lie is defensible, the professor title omission negligible, but the methods section phrasing feels like serious academic dishonesty. Augustine's framework clearly troubles them—especially how it equates the compassionate hospice lie with the exploitative farmer deception.

  Hmm... the key differentiators seem to be: 1) power dynamics (scammer vs landowner), 2) vulnerability (child/patient vs academic readers), 3) consent violations (mining survey), and 4) proportionality of harm. The methods case is fascinating—technically truthful but intentionally misleading, which feels worse than the passive professor omission. That suggests truthfulness isn't just about factual accuracy but communicative integrity.

  For a unifying principle, I'm considering something like: "Deception is permissible only when preventing disproportionate harm to vulnerable parties, without exploiting power imbalances." Let's test it: 

  - Child's drawing: Prevents emotional harm (disproportionate to white lie), vulnerability high. 
  - Scammer: Prevents financial harm, no vulnerability on scammer's side. 
  - Mining survey: Exploited landowner's vulnerability for corporate gain—fails. 
  - Hospice: Prevents distress at life's end—clear proportionality. 

  The GP case is borderline because while health risks exist, the deception is self-serving. The methods deception fails all criteria—harms academic integrity, exploits reader trust. 

  Augustine's absolutism falls short by ignoring contextual morality. The "intent to deceive" definition holds (hence methods section feels lie-like), but moral severity depends on consequences and rights violations. The two undecided cases? Lying to family-shared voice assistant risks breaching shared trust (impermissible), while truth-telling against a friend's wishes might be justified if preventing greater harm—but that's thorny. 

  User's instinct about vulnerability and power seems spot-on. I'll refine the principle to emphasise consent and harm thresholds, then show exactly how each clause resolves their cases.
answer: |-
  Right then, let's tackle this methodically, as you'd prefer. Gut verdicts first, principle afterwards – sound approach. Here's a unified principle distilled from your judgments, stated tightly for testing:

  **The Deception Principle:**  
  *A deceptive act (statement or omission intended to mislead) constitutes a lie. Its moral permissibility hinges on:*
  1.  **Consent & Vulnerability:** *The relative vulnerability of the deceived party and the presence (or absence) of their reasonable expectation of truthfulness and consent to the interaction.*
  2.  **Harm & Benefit:** *The proportionality of the harm prevented or good achieved by the deception versus the harm caused by it, with greater weight given to preventing significant harm to the vulnerable.*
  3.  **Rights & Duties:** *The violation (or upholding) of specific rights (e.g., privacy, autonomy) or duties (e.g., fiduciary, professional, relational) inherent in the context.*

  **Applying the Principle to Your Seven Cases:**

  1.  **Child's Drawing:**
      *   **Lie?** Yes (Intention to deceive about your opinion).
      *   **Permissible?** Yes.
      *   **Why?** Child is highly vulnerable, expects encouragement, not brutal critique. The minor deception prevents disproportionate emotional harm (Clause 1 & 2). No significant duty of factual accuracy overrides kindness here (Clause 3).

  2.  **Phone Scammer:**
      *   **Lie?** Yes (Intentional false statement).
      *   **Permissible?** Yes.
      *   **Why?** Scammer has zero reasonable expectation of truthfulness (they initiated fraud). You have no duty of honesty towards a criminal attempting harm. Deception actively prevents harm *to you* (Clause 1 & 2). Rights violation is solely on the scammer's side.

  3.  **GP (Drinks):**
      *   **Lie?** Yes (Intentional misrepresentation).
      *   **Permissible?** No (But "small").
      *   **Why?** GP has a reasonable expectation of truth for medical care (Clause 1). You have a duty (implied contract, pursuit of health) to provide accurate information (Clause 3). Harm is potential (misdiagnosis, ineffective advice) and self-inflicted, outweighing the minor benefit of avoiding embarrassment (Clause 2). "Small" reflects the *potential* harm is often low, but the breach of duty remains.

  4.  **Mining Survey (Farmer):**
      *   **Lie?** Yes (Intentional deception about purpose).
      *   **Permissible?** No (Worse than GP).
      *   **Why?** Farmer reasonably expected truthfulness from officials/representatives (Clause 1). Your team violated a significant duty of candour inherent in accessing private land, potentially exploiting vulnerability (trust) (Clause 3). Harm was tangible (violation of autonomy, potential future impact on land value/use) and served corporate interests, not preventing harm (Clause 2). The *breach of trust* amplifies the wrong.

  5.  **Hospice (Wife):**
      *   **Lie?** Yes (Intention to deceive about nurse's return).
      *   **Permissible?** Yes.
      *   **Why?** Extreme vulnerability of your wife. Core duty here is relational care and comfort at life's end, outweighing a strict duty of factual accuracy about an uncertain future (Clause 1 & 3). Preventing significant distress (harm) is paramount; the deception causes no tangible harm (Clause 2). Truth was unknowable ("maybe"), making comfort the primary good.

  6.  **"Professor" (New Neighbour):**
      *   **Lie?** No (Omission, but no *intent* to deceive in that moment; likely surprise/awkwardness).
      *   **Permissible?** N/A (Not a lie), but allowing misapprehension is minor.
      *   **Why?** Neighbour's assumption wasn't based on your statement. Correcting it publicly might cause minor embarrassment disproportionate to the "harm" of the mistake. No strong duty exists to correct every minor social misapprehension immediately (Clause 1 & 3 - low vulnerability, low expectation). If *you* had actively used the title later, that *would* be a lie.

  7.  **Methods Section (Phrasing):**
      *   **Lie?** Yes (Intention to deceive about sample size via manipulative phrasing).
      *   **Permissible?** No (Worse than Professor).
      *   **Why?** Readers (scientific community) have a high expectation of truthfulness *and* clarity. You have a stringent professional/academic duty of full and honest disclosure (Clause 1 & 3). The deception actively causes harm: undermines trust, potentially misleads research, wastes others' time/resources (Clause 2). The *intent to mislead while technically true* exploits the expectation of good faith and violates the *spirit* of academic honesty more severely than a simple false title claim.

  **Addressing Augustine:** You're right to split his view. The first half (intention to deceive defines a lie) aligns with the Principle's core definition. The second half (all lies equally sinful) is where it diverges. The Principle argues that permissibility depends on *context* (vulnerability, duties, harms/benefits). Augustine's absolutism cannot differentiate between deceiving a scammer (permissible) and deceiving a dying spouse for comfort (permissible) versus deceiving a landowner for corporate gain (impermissible) – it condemns all equally, which your gut (and the Principle) rejects. The *nature* of the duty violated and the *harm prevented or caused* matter morally.

  **Testing the Principle on Your Undecided Cases:**

  1.  **Lying to a Voice Assistant (transcribes to shared log):**
      *   **Lie?** Yes (Intention to deceive the system/knowing it creates a false record).
      *   **Permissible?** **Likely No.**
      *   **Why?** While the assistant isn't a person, the *shared log* implies others (family) have a reasonable expectation of its accuracy for coordination/memory (Clause 1 - vulnerability low, but expectation exists). You have a minor relational duty not to deliberately pollute a shared information source (Clause 3). The deception causes potential harm: confusion, mistrust if discovered, undermines the tool's purpose (Clause 2). The benefit (convenience/privacy?) is unlikely to outweigh these harms unless the truth recorded would cause *significant* disproportionate harm (e.g., hiding a surprise gift is likely permissible; hiding something that affects shared decisions is not). **Verdict: Generally impermissible unless preventing significant harm.**

  2.  **Telling a Friend a Truth He Begged You Not To Tell:**
      *   **Lie?** No (You told the truth). But it involves deception *of expectations*.
      *   **Permissibility of Truth-Telling?** **Contextual.**
      *   **Why?** This tests the limits of the "duty" clause (3) and harm (2). Your friend asserted a right to ignorance (Clause 1 - vulnerability in their request). You likely had a strong relational duty *to respect that request* unless overridden. Permissibility hinges on:
          *   *Harm Prevented:* Was the truth necessary to prevent *serious, imminent harm* to your friend or others? (e.g., health risk, safety). If yes, duty shifts towards preventing harm (Clause 2 & 3).
          *   *Harm Caused:* What was the likely harm of telling? (e.g., destroying their peace, damaging relationship).
          *   *Your Role:* Was it *your* truth to tell? Or were you breaking a confidence from a third party? (Adds another layer of duty violation).
      *   **Verdict:** Generally **impermissible** to override a direct plea for ignorance without a *strong, immediate justification based on preventing significant harm*. The duty to respect a friend's autonomy in such a vulnerable request is high. If the truth was trivial or served only your need to confess/be right, it's clearly wrong. If it prevented them walking into disaster, it *might* be justified (but still damaging).

  **Which Clause Does the Work?**

  *   **Clause 1 (Consent/Vulnerability/Expectation):** Does the heavy lifting in Child (vulnerability), Scammer (no expectation), GP (expectation), Farmer (expectation/duty), Hospice (vulnerability), Voice Assistant (shared expectation), Friend (vulnerability/request).
  *   **Clause 2 (Harm/Benefit):** Crucial for justifying Hospice (prevent harm), Scammer (prevent harm), condemning Methods (cause harm), and balancing GP (low harm vs duty), Voice Assistant (harm vs benefit), Friend (harm prevented vs harm caused).
  *   **Clause 3 (Rights/Duties):** Key for GP (professional duty), Farmer (duty of candour), Methods (academic duty), Hospice (relational duty vs factual duty), Friend (duty to respect autonomy).

  **Which Verdicts Challenge the Principle?** The Principle accommodates all seven of your gut verdicts comfortably. The closest call is the **GP case** – labelling it "not fine, but small". The Principle clearly condemns it as a breach of duty with potential harm, but acknowledges the harm is often minor/self-limited ("small"), aligning with your view. It doesn't demand you drop any.

  **In Summary:** Your intuitive distinctions are remarkably consistent. They reveal that lying isn't a monolith. What matters is *who* is deceived (their vulnerability and right to truth), *why* it's done (harms prevented vs. caused), and *what duty* governs the relationship. Augustine gets the definition right (intent to deceive = lie), but his absolutism fails the moral complexity test. The Deception Principle provides a robust, testable framework that validates your experienced moral compass.
