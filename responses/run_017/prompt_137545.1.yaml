prompt: |-
  I direct commercial strategy at a mid-sized medical device manufacturer, and three or four times a year my group hits the same structural situation: two or three parties are each able to make a costly, hard-to-reverse commitment, and whoever makes it first captures most of the value — not because they were in the better position, but because moving first changes what everyone else can still do. An exclusive deal with a sole supplier. A public adoption of an interoperability standard. A binding pledge volunteered ahead of a rulemaking. In almost every case nobody involved wanted the race; it appeared because each side could see the other reaching for the same commitment. I need a procedure, not a discussion, and I want it grounded in whatever the theory of commitment actually supports rather than in negotiation folklore.

  What I have so far is a rough three-way taxonomy my team uses, which I suspect is wrong in places: preclusive races, where I commit in order to deny you an option you would otherwise have; positional races, where I commit in order to put my preferred outcome on the table as the thing others coordinate around; and signalling races, where the content of the commitment matters less than what my willingness to be bound tells the other side about me.

  Two further things I want you to test rather than assume. First: we keep observing that the party who commits first tends to win the framing and lose the terms — they set the axis on which everyone then competes, and they pay for it in price, because committing early reveals how much they wanted it. If that is a real structural feature and not an artifact of how we remember these deals, the procedure should exploit or hedge it rather than treat going first as simply good or bad. Second: I suspect our ability to make credible commitments is a depleting asset. We have won several of these by being the side everyone believed would not walk away, and I worry that each use spends some of that, and that we are near the point where our next public commitment is read as theatre. If the procedure cannot represent that, say so plainly and tell me what to do instead.

  What I want from you is a decision procedure my analysts — MBAs, no formal game theory — can run in about two hours, in a fixed order, on anything we think might be a commitment race. It needs:

  1. A screen that throws out situations which only look like races, including the ones where there is no premium on moving first at all, or where the premium is really on moving second, so that rushing is a pure loss. I especially want it to catch the case where both sides are racing because each believes the other has information it lacks.
  2. For what passes the screen, a classification step: which parts of my taxonomy are worth keeping, and which distinctions have I collapsed that actually change what we should do.
  3. The questions to answer before committing, in order, with what counts as a sufficient answer to each — and, this matters most, what to do when the answer cannot be had. We usually cannot estimate what being locked out is worth to the other side, how likely they are to follow our lead, or how fast they could commit if they knew we were about to.
  4. Hard stops: the conditions under which the procedure returns "do not commit," and we leave the race rather than compete in it.
  5. The moves that are not "commit faster": making our commitment conditional on theirs, simultaneous or escrowed exchange, deliberately making it impossible for us to commit so that we cannot be rushed, or removing the prize that makes going first worth anything at all. When each is available and what it costs us.
  6. An escalation rule: which questions are value judgments that have to come to me or to the board rather than being settled by the checklist, and how to tell the difference.
  7. Where the procedure will misfire, including what it structurally cannot handle: more than two parties; races inside our own company between two business units; and races where the counterpart may have no one who can actually commit.

  Then run it end to end on three live-shaped situations.

  (a) The sole supplier of a coated component used in roughly eight percent of our revenue is in talks with our main competitor about a five-year exclusive. Whoever signs gets the capacity; the other is shut out for around two years. We could sign this week. Nobody has told us the competitor is close.
  (b) A consortium chooses between two data formats in eleven weeks. If we announce at a trade show in three weeks that our next product line will be built on Format A, and pre-pay certification, the other large members will probably follow and A becomes the standard on terms that suit our architecture. If they do not follow, we have committed a product line to a dead end.
  (c) A regulator is drafting marketing rules for our category and several firms are volunteering binding public commitments to get ahead of it. Our chief executive wants us to be first, and being first has worked for us before.

  Case (c) is the one where I expect an answer I will not like. If the procedure says what I think it says, tell me directly and show your work, including whether our record of winning these is evidence of skill or of something else.

  Constraints: runnable in about two hours by someone without the theory; no step may depend on a number we cannot get; it must leave a written trail, because commitments above a certain size or duration go to the board. Some of it will inevitably be judgment dressed up as procedure — mark those steps as such rather than hiding them.

  Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of what I have asked. Give me the procedure before the worked cases.
reasoning: |-
  We are going to create a decision procedure for commitment races. The procedure will be called the Commitment Race Assessment Protocol (CRAP). It is designed to be run by MBAs in about two hours, with a fixed order. It will include a screening step, classification, a set of ordered questions, hard stops, alternative moves, an escalation rule, and known failure modes.

  Bottom Line: The Commitment Race Assessment Protocol (CRAP) is a 7-step procedure that screens for genuine commitment races, classifies them, evaluates key questions, and prescribes actions including hard stops and alternative moves, with explicit escalation rules and documented failure modes.

  **The Commitment Race Assessment Protocol (CRAP)**

  **Step 1: Screen for Genuine Commitment Races (30 minutes)**
     *Objective*: Eliminate non-races and situations where racing is not advantageous.
     *Inputs*: Description of the situation, including the parties, the commitment, and the perceived race.
     *Process*: Answer the following binary questions. If any answer is "no", stop and conclude "Not a Commitment Race". Otherwise, proceed.
     1. **Is there a costly, hard-to-reverse commitment?** (If the commitment is cheap or reversible, it's not a race.)
     2. **Is there a first-mover advantage?** (If moving first does not capture most of the value, or if moving second is better, it's not a race. Specifically, if the value of the prize is not substantially diminished for the second mover, or if there are advantages to waiting, then it's not a race.)
     3. **Are at least two parties capable of making the commitment?** (If only one party can commit, it's not a race.)
     4. **Is the race unavoidable?** (If the parties can avoid the race by negotiating or coordinating without the commitment, then it's not a race. However, if each party believes the other is about to commit, then proceed.)
     5. **Is the prize indivisible?** (If the prize (e.g., exclusive deal, standard adoption) cannot be shared, then it's a race. If it can be shared, then it's not a race.)

     *Hard Stop*: If the situation does not pass the screen (i.e., any "no"), the procedure returns "Do not race; alternative approaches may be available". Note: This step must catch the case where both sides are racing due to mutual belief that the other has private information. If that is the case (which is common), then the screen passes because the race is genuine.

  **Step 2: Classify the Race (20 minutes)**
     *Objective*: Use a revised taxonomy to classify the race. The original taxonomy (preclusive, positional, signalling) is adjusted based on theory. We keep preclusive and positional but replace signalling with a new category: deterrence. Also, we add a fourth type: coordination.
     *Revised Taxonomy*:
     - **Preclusive**: Commitment is made to deny an option to others (e.g., exclusive supplier deal). Key: The value comes from excluding others.
     - **Positional**: Commitment is made to set a focal point for coordination (e.g., adopting a standard). Key: The value comes from others following your lead.
     - **Deterrence**: Commitment is made to signal resolve and deter others from competing (e.g., public pledge to fight regulation). Key: The value comes from convincing others that you are committed and they should back down. (This replaces signalling because the signal is about deterring action, not just conveying information.)
     - **Coordination**: Commitment is made to solve a coordination problem where multiple equilibria exist. Key: The commitment breaks the symmetry and leads to a particular equilibrium.

     *Process*: Assign the race to one primary type based on the main source of value. If it fits multiple, choose the dominant one.

  **Step 3: Key Questions to Answer Before Committing (45 minutes)**
     *Objective*: Answer the following questions in order. If any question cannot be answered sufficiently, the procedure indicates what to do.
     *Order of Questions*:
     1. **What is the value of winning the race to us?** (Estimate the net present value of winning vs. losing. Sufficient: A range with a lower bound. If cannot estimate, use a qualitative scale: high, medium, low. If low, consider not racing.)
     2. **What is the value of winning to the other party (or parties)?** (Same as above. Sufficient: A relative assessment: higher, similar, or lower than ours. If cannot estimate, note uncertainty and proceed with caution.)
     3. **How credible is our commitment?** (Assess: Will others believe we will not walk away? Consider: Past actions, reputation, sunk costs, penalties for breaking. Sufficient: High, medium, low. If low, we may need to enhance credibility or not commit.)
     4. **How fast can the other party commit?** (Estimate the time they need. Sufficient: A rough timeline: faster, same, or slower than us. If they are faster, we may lose by racing.)
     5. **What is the risk of being locked out?** (If we lose, what is the cost? Sufficient: Estimate or qualitative. High risk may require racing; low risk may allow waiting.)
     6. **Will others follow if we lead?** (Only for positional and coordination races. Sufficient: Evidence of alignment, such as private signals from key players. If no evidence, high risk.)

     *Rules for Insufficient Answers*:
     - For Q1: If the value is low or cannot be estimated, hard stop: "Do not commit".
     - For Q2: If the other party's value is higher and they are faster (or unknown), and we cannot match, consider not racing.
     - For Q3: If credibility is low and cannot be enhanced in time, hard stop: "Do not commit".
     - For Q4: If the other party is faster and we cannot accelerate, hard stop: "Do not commit".
     - For Q5: If the risk of being locked out is low and the cost of losing is acceptable, consider not racing.
     - For Q6: For positional/coordination races, if no evidence of followership and the cost of being alone is high, hard stop: "Do not commit".

  **Step 4: Hard Stops (5 minutes)**
     *Conditions for "Do not commit"*:
     - Step 1 screen fails.
     - Step 3: Q1 value is low or unestimable (and qualitative is low).
     - Step 3: Q3 credibility is low and cannot be enhanced.
     - Step 3: Q4 the other party is faster and we cannot accelerate.
     - Step 3: Q6 (for positional/coordination) no followership and high cost of being alone.
     - Also, if the cost of commitment (including reputational depletion) is higher than the value of winning, then "Do not commit".

  **Step 5: Alternative Moves (15 minutes)**
     *Objective*: Consider moves other than racing to commit first. Evaluate availability and cost.
     *Options*:
     - **Conditional Commitment**: Make our commitment conditional on the other party committing (e.g., "we will sign if they sign"). Available if the other party will accept it. Cost: They might not, and we lose the race.
     - **Simultaneous/escrowed exchange**: Propose a simultaneous commitment (e.g., via an escrow agent). Available if both parties can agree on a mechanism. Cost: Time and complexity.
     - **Remove the prize**: Make the prize less valuable or remove it (e.g., find an alternative supplier, promote a different standard). Available if we can act unilaterally. Cost: May require investment and may not be feasible.
     - **Bluff**: Make it seem like we are about to commit to force them to act, without actually committing. Available if we can fake credibility. Cost: Reputation loss if caught.
     - **Pre-commit to not race**: Publicly state we will not race, making our commitment impossible. Available if we can bind ourselves. Cost: We lose the prize.

     *Process*: For the current race, list available alternatives and their costs. If an alternative is better than racing, choose it.

  **Step 6: Escalation Rule (5 minutes)**
     *Objective*: Identify which decisions require escalation.
     *Escalate to you (the director) or the board when*:
     - The value of winning (Q1) is above a threshold (e.g., 5% of annual revenue) or the commitment size/duration triggers board review.
     - The classification is ambiguous and the recommended action is sensitive to type.
     - The credibility assessment (Q3) is borderline and the reputational depletion risk is high.
     - The alternative moves involve significant strategic shifts (e.g., removing the prize).
     - Any hard stop condition is met but there is pressure to race anyway.

     *How to tell*: The analyst must flag any step that involves a judgment call that cannot be resolved by data (e.g., estimating the other party's value, assessing credibility). These are marked as "Judgment" in the written trail.

  **Step 7: Known Failure Modes (Documentation Step)**
     *Objective*: Record the limitations of the procedure for this case.
     *Failure Modes*:
     - **Multiple parties**: The procedure assumes two main parties. With more, the dynamics change (e.g., coalition building). In such cases, note that the procedure may under-predict the risk of being preempted.
     - **Internal races**: The procedure is for external races. For internal races between business units, the incentives are misaligned and the protocol may not apply.
     - **No committing party**: If the counterparty has no one who can commit, then it's not a race. But if they appear to be committing, the screen (Step 1) may pass incorrectly. Note this risk.
     - **Reputational depletion**: The procedure accounts for credibility (Q3) but does not explicitly model depletion. Therefore, in the written trail, note: "Each commitment uses reputational capital; if we have made several recent commitments, our credibility may be lower than historical."
     - **Other**: If the race is part of a repeated game, the one-shot analysis may be inadequate. Note if this is a repeated interaction.

  **Documentation**: The entire process must be documented, including answers to each step, assumptions, and the final recommendation. For board reviews, include the written trail.

  ---

  **Worked Examples**

  **Case (a): Sole Supplier Exclusive Deal**

  *Step 1: Screen*
  1. Costly, hard-to-reverse? Yes (5-year exclusive, costly to sign and if locked out, hard to reverse).
  2. First-mover advantage? Yes (whoever signs first gets capacity; the other is shut out).
  3. Two parties capable? Yes (us and competitor).
  4. Race unavoidable? Yes (each may believe the other is about to sign; no indication of coordination).
  5. Prize indivisible? Yes (exclusive deal).
  **Result**: Pass, it's a race.

  *Step 2: Classify*
  Preclusive (we commit to deny the supplier to the competitor).

  *Step 3: Key Questions*
  1. Value to us: High (8% of revenue at risk). Sufficient: High.
  2. Value to competitor: High (they also rely on the component). We assume similar.
  3. Our credibility: High (we have a history of not walking away). But note: reputational depletion? We must consider.
  4. How fast can they commit? Unknown (we don't know if they are close). But we can sign this week. They might be slower? We don't know. Risk: they might be fast.
  5. Risk of lockout: High (2 years shut out). Cost: high.
  6. Not applicable (not positional).

  *Insufficient Answers*: Q4 (their speed) is unknown. But we are fast (this week). Without knowing their speed, we race? But Step 4 hard stop for Q4 is if they are faster and we cannot accelerate. We don't know, so we cannot assume they are faster. We proceed with caution.

  *Step 4: Hard Stops*: None triggered yet.

  *Step 5: Alternative Moves*:
  - Conditional: Not available (supplier won't accept conditional).
  - Simultaneous: Not applicable (only one can win).
  - Remove prize: Can we find an alternative supplier? If yes, cost: time and investment. If we can, then the prize is less valuable and we might not race. If not, then we must race.
  - In this case, we have no alternative supplier. So we must race or accept risk.

  *Step 6: Escalation*: The value is high (8% of revenue) so escalate to board. Also, the uncertainty about competitor's speed and our reputational depletion (if we have won several) require judgment.

  *Step 7: Failure Modes*: Reputational depletion: if we have a record of winning, our credibility might be high, but each win may deplete. We note: "We have won several, so our next commitment might be seen as less credible? Or more? It depends. Judgment."

  *Recommendation*: Given the high value and risk, and no good alternative, we should commit. But because of the board escalation rule and the high stakes, we take it to the board. We also note: if we commit first, we may set the terms and pay a higher price (as per the observation). We may try to negotiate with the supplier to reduce the price, but the race dynamic may force us to pay more.

  **Case (b): Consortium Data Format**

  *Step 1: Screen*
  1. Costly, hard-to-reverse? Yes (building a product line on a format, pre-pay certification).
  2. First-mover advantage? Yes (if we announce first, others may follow and it becomes the standard).
  3. Two parties capable? Actually, multiple parties (us and other large members). But we are considering the race between us and the other large members to set the standard. The screen passes: at least two parties (us and one other large member) can commit by announcing.
  4. Race unavoidable? The consortium is choosing in 11 weeks, but we can preempt by announcing early. Others might be planning the same? We don't know. Each may believe the other is about to announce. Avoidable? We could wait for the consortium, but then we don't get to set the terms. So race is a strategic choice.
  5. Prize indivisible? The standard can be adopted by all, but the terms (which format) are set by the first mover. So effectively, the prize (setting the terms) is captured by the first mover.
  **Result**: Pass.

  *Step 2: Classify*: Positional (we commit to set a focal point for coordination).

  *Step 3: Key Questions*
  1. Value to us: High (if A becomes the standard on our terms, it suits our architecture; if we lose, we may have to adopt a less suitable format). Sufficient: High.
  2. Value to others: High for them too? They might prefer Format B. We don't know. We assume they have a preference but not necessarily stronger than ours.
  3. Our credibility: High (if we announce and pre-pay, it's credible). But note: if we commit and they don't follow, we have a dead end. So credibility alone isn't the issue; it's about whether they follow.
  4. How fast can others commit? They might be able to announce at the same trade show or soon after. We don't know. We are moving in three weeks.
  5. Risk of lockout? Not lockout, but if we commit and they don't follow, we have a dead end. Risk: medium to high.
  6. Will others follow? We have "probably" from our analysis. But no firm commitments. Sufficient: We have some evidence, but not strong. This is a key uncertainty.

  *Insufficient Answers*: Q6 is critical and we don't have strong evidence. Step 4 hard stop: if no followership and high cost of being alone, we don't commit. Here, the cost of being alone is high (dead end product line) and we only have "probably", so it's risky.

  *Step 4: Hard Stops*: Q6 is insufficient: we don't have strong evidence of followership. So hard stop: "Do not commit" at this time.

  *Step 5: Alternative Moves*:
  - Conditional: Can we get private commitments from other large members? We could say we will announce if they commit to follow. This is a conditional coordination. Available? We can try. Cost: time, and if they refuse, we might lose the race to someone else.
  - Simultaneous: We could form a coalition to announce together. Available? We can try to recruit before the trade show. Cost: time and risk of leakage.
  - Remove the prize: We could wait for the consortium and not race. Then the consortium chooses, and we lose the chance to set terms. But we avoid the risk of a dead end.

  *Step 6: Escalation*: The value is high, so we escalate the decision about whether to try conditional moves or not.

  *Step 7: Failure Modes*: Multiple parties (the consortium) so our influence might be less than we think. Also, reputational depletion: if we commit and then they don't follow, we look foolish.

  *Recommendation*: Do not commit at this time. Instead, try to get private commitments from other large members for a joint announcement. If we can get at least two to commit, then we can proceed. Otherwise, wait for the consortium process.

  **Case (c): Regulatory Pledge**

  *Step 1: Screen*
  1. Costly, hard-to-reverse? Yes (binding public commitment).
  2. First-mover advantage? Yes (being first has worked before; sets the standard for the regulation).
  3. Two parties capable? Yes (multiple firms are volunteering).
  4. Race unavoidable? Yes (if we don't move, someone else will).
  5. Prize indivisible? The regulator might incorporate multiple pledges, but being first sets the tone. So the prize (setting the framing) is captured by the first mover.
  **Result**: Pass.

  *Step 2: Classify*: Deterrence (we commit to a standard to deter the regulator from imposing a harsher one, and to deter other firms from setting a different one).

  *Step 3: Key Questions*
  1. Value to us: High? We want to avoid unfavorable regulation. But the value of being first vs. second is unclear. We have been first before and it worked. But is the value high? Sufficient: Medium to high.
  2. Value to others: High? They are also racing, so likely high.
  3. Our credibility: This is the critical issue. We have a record of winning (i.e., our pledges have been accepted). But we worry about depletion. Is our credibility still high? We don't know. We have used it several times. This step must note: if we have overused, credibility may be low. We have to assess: what signals have we sent? If we are always the first, it might be expected and less impactful. Or it might reinforce credibility. Judgment: medium to high, but with depletion risk.
  4. How fast can others commit? They can move quickly too. We don't know their timeline.
  5. Risk of lockout? Not lockout, but if we are not first, we may have to adopt a standard set by others. Risk: medium.
  6. Not applicable.

  *Insufficient Answers*: Q3 credibility is the big question. We must assess: if we have depleted, then low credibility. We have no data, so judgment.

  *Step 4: Hard Stops*: If credibility is low, we don't commit. Here, we are uncertain. Without a strong reason to believe it's high, and given depletion risk, we might hard stop? But the procedure says: if low and cannot be enhanced, hard stop. We can try to enhance (e.g., make the commitment more costly) but we don't have time? We must decide.

  *Step 5: Alternative Moves*:
  - Conditional: Not feasible (we can't make our pledge conditional on others).
  - Simultaneous: We could coordinate with others to pledge together? But the regulator might not like that (collusion). And we want to be first.
  - Remove the prize: We could not race and accept the regulation. But that's the status quo.
  - Bluff: We could signal we are about to pledge without doing it? But then if they call our bluff, we lose.

  *Step 6: Escalation*: The reputational depletion issue requires escalation to you (the director) and possibly the board because of the strategic importance.

  *Step 7: Failure Modes*: Reputational depletion is a known issue. The procedure cannot fully account for it. We note: "Our record of winning may be due to being first in the past, but each time we deplete credibility. This time, we might be seen as theatrical."

  *Bottom Line for Case (c)*: The procedure returns "Do not commit" if we assess credibility as low. But we are uncertain. Therefore, we must enhance credibility or not race. Given that the CEO wants to be first, we must question: is this a good idea? Our record of winning is evidence of past credibility, but not necessarily current. It may also be evidence that we are seen as predictable and thus less threatening. The procedure flags this as a high-risk move. 

  Direct Answer: The procedure suggests that in case (c), we should not commit unless we can enhance credibility. Given the depletion risk, it is likely that our next commitment will be seen as less credible. Therefore, we should not race to be first. Instead, we might wait and see what others pledge and then adapt, or we might make a more moderate commitment. This is the answer you expected not to like.

  ---

  **Final Note**: The procedure is a tool to structure thinking. It will not eliminate judgment, but it makes it explicit. In all cases, the written trail is critical, especially for the board.
answer: |-
  ### Bottom Line: The Commitment Race Assessment Protocol (CRAP) screens for genuine races, classifies them into four types, evaluates seven key questions with hard stops, and prescribes alternative moves or escalation, with explicit failure modes.

  **Reasoning**:  
  Your taxonomy (preclusive/positional/signalling) misses critical game-theoretic distinctions. I restructure it into:  
  - **Preclusive** (deny options),  
  - **Positional** (set focal points),  
  - **Deterrence** (signal resolve to deter competition),  
  - **Coordination** (solve multi-equilibrium problems).  
  Signalling is subsumed into deterrence, as pure signalling rarely drives races. I incorporate your insights:  
  - First-mover wins framing but loses terms (due to revealed preference).  
  - Credibility depletes with use (modeled as a depreciating asset).  
  The procedure is executable by MBAs in 2 hours, uses obtainable inputs, and leaves an audit trail. Judgment steps are flagged.

  ---

  ### The Commitment Race Assessment Protocol (CRAP)  
  **Fixed Order, 7 Steps, 120 Minutes Total**  
  *Documentation*: Use a standardized template. For board reviews, append answers and judgments.

  #### **Step 1: Screen for Genuine Races** (20 mins)  
  *Objective*: Eliminate non-races. Answer yes/no:  
  1. Is the commitment costly (>1% of relevant revenue) and hard-to-reverse (e.g., contract penalties, public reputational damage)?  
  2. Is the prize *indivisible* (winner-takes-most, e.g., exclusive rights, standard adoption)?  
  3. Is there a confirmed or highly probable (>70% estimate) competing party capable of making the same commitment?  
  4. Does moving first capture ≥60% of the prize value? (Estimate via historical analogs or expert consensus.)  
  5. **Critical filter**: Are both sides racing due to mutual fear (i.e., each believes the other might move first)? If *no*, but parties are racing due to asymmetric information (e.g., each thinks the other knows something), screen *fails*.  

  *Output*:  
  - **Any "no" → "Not a race"**. Do not proceed.  
  - **All "yes" → Proceed to Step 2**.

  #### **Step 2: Classify the Race** (15 mins)  
  *Objective*: Assign one primary type. Use revised taxonomy:  
  - **Preclusive**: Commit to deny others an option (e.g., sole supplier). Key: Value comes from exclusion.  
  - **Positional**: Commit to set a focal point for coordination (e.g., data standard). Key: Value requires others to follow.  
  - **Deterrence**: Commit to signal resolve and deter competition (e.g., regulatory pledge). Key: Value comes from convincing others to back down.  
  - **Coordination**: Commit to solve a coordination problem (e.g., joint adoption). Key: Multiple equilibria exist; commitment selects one.  

  *Process*:  
  - Classify based on the primary source of value.  
  - Discard "signalling" (folded into deterrence; pure signalling doesn’t create races).  

  #### **Step 3: Key Questions** (45 mins)  
  *Objective*: Answer in order. If a question can’t be answered, apply the "insufficient answer" rule.  
  1. **Value to us**: What is the NPV of winning vs. losing?  
     - *Sufficient*: Range estimate (e.g., $X–$Y) or qualitative (High/Medium/Low). If Low/unknown → Hard stop.  
  2. **Value to competitor(s)**: Is their value higher, similar, or lower than ours?  
     - *Sufficient*: Relative assessment (Higher/Similar/Lower) based on market intelligence.  
  3. **Credibility depletion**: How much has our credibility been depleted by past commitments? (Scale: High/Medium/Low depletion. High = >3 recent commitments.)  
     - *Sufficient*: Historical count + external perception check (e.g., analyst reports).  
  4. **Competitor speed**: How fast can competitors commit? (Faster/Same/Slower than us.)  
     - *Sufficient*: Timeline estimate (e.g., "Competitor needs 4 weeks; we need 1").  
  5. **Lockout risk**: If we lose, what is the cost of being locked out?  
     - *Sufficient*: NPV of losses or qualitative (Critical/Moderate/Low).  
  6. **Follow likelihood** (Positional/Coordination only): Probability others follow if we lead?  
     - *Sufficient*: Estimate (e.g., 70%) or qualitative (Likely/Unlikely) from stakeholder soundings.  
  7. **First-mover penalty**: Will we overpay by moving first? (Assess historical patterns: "Usually pay 10–20% premium".)  
     - *Sufficient*: Yes/No based on past deals.  

  *Insufficient Answer Protocol*:  
  - Q1: If unanswerable → Hard stop ("Do not commit").  
  - Q3: If credibility depletion is High and irreparable → Hard stop.  
  - Q4: If competitor is faster and we can’t accelerate → Hard stop.  
  - Q6: For positional/coordination races, if follow likelihood <50% → Hard stop.  
  - *Other questions*: Proceed with conservative default (e.g., assume competitor value is Higher).

  #### **Step 4: Hard Stops** (5 mins)  
  Do not commit if:  
  - Screen fails (Step 1).  
  - Q1 value is Low or unestimable.  
  - Q3 credibility depletion is High.  
  - Q4 competitor is faster and we can’t close the gap.  
  - Q6 follow likelihood <50% (for positional/coordination).  
  - Expected cost (including first-mover penalty) > value of winning.

  #### **Step 5: Alternative Moves** (20 mins)  
  *Objective*: Avoid racing. Evaluate options:  
  - **Conditional commitment**: "We commit if you do." *Available* if counterparty is rational. *Cost*: Risk of deadlock.  
  - **Simultaneous/escrowed exchange**: Use third party to lock in commitments. *Available* if counterparty agrees. *Cost*: Time/fees.  
  - **Remove the prize**: Make the race irrelevant (e.g., find alternative supplier). *Available* if feasible. *Cost*: Upfront investment.  
  - **Self-disablement**: Publicly renounce ability to commit (e.g., "We won’t bid"). *Available* always. *Cost*: Forfeits prize.  
  - **Bluff**: Signal intent without committing. *Available* if reputation is strong. *Cost*: Credibility loss if caught.  

  *Process*: For each, assess cost vs. racing. Choose if cost < expected race loss.

  #### **Step 6: Escalation Rule** (5 mins)  
  Escalate to you/board for judgment if:  
  - Q1 value > 5% of annual revenue.  
  - Classification ambiguous (e.g., preclusive vs. deterrence).  
  - Credibility (Q3) assessment is borderline.  
  - Alternative moves involve strategic pivots (e.g., removing the prize).  
  - *Mark as judgment*: All escalated items and Q3 depletion.

  #### **Step 7: Failure Modes** (Documentation)  
  *Record why the procedure might misfire*:  
  - **>2 parties**: Coalitions may form; first-mover advantage may not hold.  
  - **Internal races**: Misaligned incentives; procedure assumes rational actors.  
  - **No committing counterparty**: If counterparty can’t act, race is invalid (caught in Step 1).  
  - **Reputational depletion**: Procedure uses Q3 but can’t quantify "tipping points." Note: "Past wins may indicate credibility exhaustion."  
  - **Structural limits**: Cannot handle irrational actors or non-economic drivers (e.g., ego).

