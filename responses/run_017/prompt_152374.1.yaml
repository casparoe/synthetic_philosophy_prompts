prompt: |-
  I spent a working life in experimental physics — the last couple of decades of it running a small group doing precision photometry, where most of our time went not into taking data but into arguing about error bars, and in particular about whether a run had been spoiled by an instrument whose zero point had drifted. Since retiring I have been sitting in on a formal epistemology reading group in the philosophy department here, and one of our recent sessions nearly derailed itself over Jeffrey conditionalization, or probability kinematics: the rule that when your credence in some cell of a partition moves from one value to another without becoming one or zero, you should redistribute within cells, holding fixed the ratios of credence inside each cell, and take the new marginal as your new credence. I found the discussion oddly unsatisfying. The literature, as far as I can tell from the reading group, spends its energy on whether the rigidity condition can be motivated, on information-theoretic characterizations of the rule as a minimal departure from the old distribution, and on the worry that the result depends on which partition you happen to update on. What it does not seem to spend energy on is a distinction that dominated my professional life: the difference between noise that is independent from reading to reading and error that has a common cause, such as a single mis-set calibration constant afflicting an entire run. These strike me as utterly different evidential situations, and I cannot see that the standard rule treats them differently.

  Here is the half-formed idea I want turned into a proposal. Suppose a sequence of imperfect readings arrives, each of which nudges your credence in some partition of hypotheses without settling it. If the errors in the readings are independent, then intuitively nothing is learned from the pattern of disagreement itself; each reading speaks only about the quantity. If the errors share a common cause, the pattern of disagreement is itself evidence — evidence about the instrument, which then reflects back onto the quantity — and I would expect that feeding the readings in one at a time, redistributing within cells at each step, gives you something different from, and I suspect worse than, treating the whole run as one body of evidence. In some toy finite models I have fiddled with, sequential applications of the rule are not even order-independent in the second kind of case, whereas they look nearly so in the first. I want to know whether that is a real distinction or an artifact of the particular numbers I chose, and if it is real, what it tells us about what kind of rule this is supposed to be: is it a rule for incorporating evidence, in which case the answer ought to depend only on the total evidence and not on the temporal order in which it happened to arrive, or is it a rule for being acted upon by experience, in which case path-dependence is no more objectionable in the update than it is in the physics? My thought is to use, as a yardstick, ordinary conditioning inside an explicit model that contains a variable for the calibration state as well as one for the quantity: wherever such a model can be written down, global conditioning on the total evidence is the standard of correctness, and the question becomes when the partition-based rule reproduces it and when and why it comes apart.

  I am applying for a three-month visiting fellowship and need a two-page proposal for a paper of perhaps eight thousand words on this. Please write it as a proposal rather than as the paper: state the question so that it has a determinate answer; say why the existing ways of defending or criticizing the rule leave it open; give me the approach, including what I would actually do month by month, and why that approach is better than the obvious alternatives (simply proving a small algebra result about commutation, or simply arguing the interpretive question about experience versus evidence in the abstract); say what the possible conclusions are and which considerations would decide between them; and be honest about what would count as the project failing or as it being too big for the time available. Two constraints. First, I know the case for radical probabilism is precisely that you may not be able to articulate the evidence proposition, so a proposal that silently assumes a fully specified generative model may be begging the central question — I would rather the proposal confront that objection than dodge it, and tell me what the project is worth if the objection is sound. Second, I am comfortable with graduate-level discrete probability but not with measure theory, so please keep the formalization finite or explicitly note where it cannot be. Do not give me a literature review or any references; I will fill in the citations myself, and I would rather the proposal not be built around them.
reasoning: |-
  We are to write a two-page research proposal for a visiting fellowship application. The project concerns Jeffrey conditionalization and how it handles independent noise versus common-cause errors in sequences of measurements. The proposal should be structured as follows:

  1. **State the question**: Clearly define the problem and why it matters. The key distinction is between independent errors and those with a common cause (like a calibration drift). The core issue is whether sequential Jeffrey updates (on each reading) are equivalent to a global update (on the entire run) and whether the rule treats these two cases differently. We note that in the common-cause case, the pattern of readings provides evidence about the instrument, which then affects the inference about the quantity of interest.

  2. **Critique existing literature**: Current debates focus on rigidity, minimal change, and partition dependence, but neglect the independent vs. common-cause error distinction. This gap is significant because in experimental practice, these cases are handled differently.

  3. **Approach**: The PI will build finite probability models that explicitly include the calibration state (a hidden variable) and the quantity of interest. We will then compare:
     - Global Bayesian conditioning on the entire data set (within the full model, including the calibration state) as the benchmark.
     - Sequential Jeffrey updates on each reading (without the calibration state, updating on a partition of the quantity of interest) and then check if they are order-dependent and how they differ from the global benchmark.

     We will consider two scenarios:
     - Independent errors: Each reading has independent noise.
     - Common-cause errors: A single calibration drift affects all readings.

     The models will be kept finite and discrete to avoid measure theory. The project will examine when sequential Jeffrey updates commute (order independence) and when they approximate the global benchmark.

  4. **Methodology and timeline**:
     - Month 1: Construct explicit models for both scenarios (independent and common-cause). Define the partitions and the update rules. Work out small examples (e.g., 2-3 readings, a few states for the quantity and calibration).
     - Month 2: For each scenario, compute:
          (a) The global Bayesian update (conditioning on all data at once in the full model).
          (b) Sequential Jeffrey updates (in the reduced model without the calibration state) for different orders of the data.
          Compare (a) and (b) and check for order dependence in (b).
     - Month 3: Analyze the results. Determine under what conditions (if any) the sequential updates are order-independent and when they recover the global benchmark. Then, interpret the findings: what does this say about Jeffrey conditionalization as a rule for updating on evidence? Also, address the radical probabilist challenge (that we cannot always articulate evidence propositions) by considering the limitations of the models.

  5. **Possible conclusions**:
     - In the independent noise case, sequential Jeffrey updates might be order-independent and match the global benchmark (if we update on a sufficiently fine partition). 
     - In the common-cause case, they might be order-dependent and deviate from the benchmark because the sequential updates fail to capture the evidence about the calibration state. 
     - Alternatively, we might find that the common-cause case can be handled by a different partition (that includes the calibration state) but then the update is not on the original partition (the quantity alone) which raises the partition dependence issue.

  6. **Significance and implications**:
     - If the sequential rule fails in the common-cause case, it suggests that Jeffrey conditionalization is best suited for situations where evidence is "direct" and without hidden common causes. 
     - The project may lead to a modified update rule that accounts for common causes by including an instrument model, or it may show that the rigidity condition must be relaxed in such cases.
     - It will clarify whether the rule is about evidence (which should be path-independent) or about experience (which might be path-dependent).

  7. **Risks and limitations**:
     - The project might fail if the toy models do not exhibit the expected behavior (e.g., if order dependence appears even in the independent case). Then we must reexamine the initial intuition.
     - The finite models might be too simplistic to capture real-world scenarios. We will note this and suggest future work with continuous variables (but without measure theory, we stick to discrete).
     - The radical probabilist objection: if the full model (with the calibration state) is not available, then the benchmark (global conditioning) is not defined. In that case, the project still shows that when a hidden common cause exists, the sequential Jeffrey rule (on the quantity alone) may lead us astray. This would support the idea that we should strive to articulate the hidden state when possible.

  8. **Deliverable**: An 8000-word paper, which will include:
     - Introduction to the problem and the distinction between independent and common-cause errors.
     - Presentation of the models and the update procedures.
     - Comparison of the results for the two scenarios.
     - Discussion of the implications for the interpretation of Jeffrey conditionalization.

  Now, we write the proposal accordingly, within two pages.

  ---

  **Proposal Title**: Sequential Jeffrey Conditionalization: The Impact of Independent Noise versus Common-Cause Errors on Epistemic Updates

  **Applicant**: [Your Name]
  **Affiliation**: [Your Affiliation]
  **Proposed Duration**: 3 months

  **1. Research Question**

  In experimental physics, the handling of measurement errors depends critically on whether they are independent (e.g., random noise) or share a common cause (e.g., calibration drift). The latter introduces dependencies that require joint analysis of the entire data run. This project investigates whether Jeffrey conditionalization — a widely discussed rule for updating partial beliefs — adequately distinguishes these two evidential situations. Specifically, we ask:

  - When a sequence of readings affects one's credence in a partition (e.g., values of a physical quantity), does sequential application of Jeffrey's rule (updating on each reading in turn) yield the same result as a global update on the entire run?
  - Does the answer depend on the error structure (independent vs. common-cause), and if so, how?
  - In particular, is sequential updating order-dependent in the common-cause case but not in the independent case?
  - How do these sequential updates compare to the benchmark of global Bayesian conditioning in a model that explicitly includes the calibration state?

  These questions matter because if the rule treats these cases indistinguishably, it may lead to suboptimal updates in scientific practice. Moreover, the answers will shed light on whether Jeffrey conditionalization is best understood as a rule for incorporating evidence (which should be order-independent) or for responding to experiences (which may be path-dependent).

  **2. Gap in the Literature**

  The philosophical literature on Jeffrey conditionalization focuses on justifying the rigidity condition (which requires that probabilities within partition cells remain fixed), on information-theoretic characterizations (e.g., as minimizing divergence from the prior), and on partition dependence (how the choice of partition affects the result). However, it neglects the distinction between independent and common-cause errors, which is central to experimental science. This project bridges this gap by examining how the error structure affects the performance of sequential updates.

  **3. Approach and Methodology**

  We will use explicit finite probability models that include:
  - A variable for the physical quantity of interest (with a finite set of possible values).
  - A variable for the calibration state (also finite, e.g., "correct" or "drifted").
  - A sequence of readings (each taking values in a finite set).

  Two scenarios will be modeled:
  - *Independent errors*: Each reading is independently affected by noise (e.g., the error distribution is i.i.d.).
  - *Common-cause errors*: A single calibration state (e.g., a drift) affects all readings.

  We will then compare two update methods:
  1. *Benchmark: Global conditioning*. In the full model (including the calibration state), we condition on the entire sequence of readings. This yields the "correct" posterior over the quantity and the calibration state.
  2. *Sequential Jeffrey conditionalization*. In a reduced model that marginalizes out the calibration state (so we only have the partition of the quantity), we apply Jeffrey's rule sequentially for each reading. At each step, the evidence is the reading, which shifts the credence over the quantity (the partition). We will try different orders of reading the data.

  We will compute these for small cases (e.g., two or three readings, two or three values for the quantity, two calibration states). The analysis will focus on:
  - Whether the sequential updates are order-independent (i.e., the same result regardless of the order of readings).
  - Whether the final distribution from sequential updates matches the marginal (over the quantity) of the global benchmark.

  *Month 1*: Develop the models. For both scenarios, define the joint probability distributions and the likelihood functions. Specify the partitions for Jeffrey updates.

  *Month 2*: Compute and compare:
     - The global posterior (benchmark) for the quantity.
     - Sequential Jeffrey updates for every possible order of the readings.
     - Check for order dependence and deviation from the benchmark.

  *Month 3*: Analyze the results. Determine the conditions under which sequential Jeffrey updates are order-independent and when they match the benchmark. Interpret the findings in light of the radical probabilist challenge (that we cannot always articulate evidence propositions). Discuss the implications for the nature of Jeffrey conditionalization.

  **4. Expected Outcomes and Significance**

  *Possible conclusions*:
  - In the independent error case, sequential updates may be order-independent and match the benchmark, supporting the rule's use for such evidence.
  - In the common-cause case, sequential updates may be order-dependent and deviate from the benchmark, indicating that the rule fails to account for the evidence about the calibration state. This would suggest that Jeffrey conditionalization, as usually applied, is inadequate for common-cause errors.

  These results would imply that the rule is not universally applicable and that users must consider the error structure. They also bear on the debate about whether the rule is for evidence (which is order-independent) or experience (which is sequential). If common-cause errors induce order dependence, it would support the experiential view.

  *Significance*: This project will provide the first systematic comparison of Jeffrey conditionalization under two error structures that are crucial in science. It will offer guidance on when the rule can be safely applied and when it requires supplementation (e.g., by including instrument models). It will also advance the philosophical understanding of the rule by tying it to experimental practice.

  **5. Addressing the Radical Probabilist Challenge**

  Radical probabilists argue that we often cannot articulate the evidence propositions required for Bayesian conditioning. Our approach does not assume that such propositions are always available. Instead, we show that when a common cause exists (even if not articulated), sequential Jeffrey updates on the quantity alone may lead to inaccurate beliefs. This implies that when possible, we should extend our models to include such hidden variables. If we cannot, then Jeffrey conditionalization (on the original partition) may be the best we can do, but it comes with a warning: in the presence of common causes, it may be systematically biased.

  **6. Feasibility and Risks**

  *Feasibility*: The project uses discrete probability and small models, avoiding measure theory. The PI has expertise in both experimental error analysis and formal epistemology.

  *Risks*:
  - The models might not exhibit the expected behavior (e.g., order dependence in the independent case). Then we would reassess the initial intuition and report the results honestly.
  - The project might reveal that the distinction is more nuanced (e.g., depending on the exact parameters). We will then characterize the conditions under which the effects hold.
  - The project might be too ambitious for three months. To mitigate, we start with minimal models (2 readings, 2 states) and scale up only if time permits.

  Even if the project fails to confirm the initial hypothesis, the negative result (showing no difference between error types) would be valuable for understanding the limitations of the distinction.

  **7. Deliverable**

  An 8000-word paper, suitable for submission to a philosophy of science journal, that reports the findings and their implications for the theory of probabilistic updating.
answer: |-
  ### Proposal: Sequential Jeffrey Conditionalization and the Structure of Measurement Error  

  **Research Question**  
  When updating beliefs via Jeffrey conditionalization on a sequence of measurements, does the rule distinguish between two critical evidential scenarios: (1) *independent noise* (errors uncorrelated across readings) and (2) *common-cause errors* (e.g., a calibration drift affecting an entire run)? Specifically:  
  - In the common-cause case, does sequential Jeffrey updating on individual readings exhibit *order dependence* (where the sequence of updates affects the final credence), and does it diverge from the benchmark of global Bayesian conditioning?  
  - Does the rule’s performance—particularly its order invariance and accuracy relative to the benchmark—differ systematically between these two scenarios?  
  This question has a determinate answer: We can prove whether order dependence occurs in each scenario and quantify the divergence from the benchmark under controlled conditions.  

  **Why Existing Literature Leaves the Question Open**  
  Defenses of Jeffrey conditionalization focus on *rigidity* (fixed within-cell probability ratios), minimal information-theoretic divergence, and partition dependence. Critiques question whether rigidity is justifiable or whether the rule is merely "experience-driven" rather than evidence-incorporating. However, neither camp addresses the *causal structure of measurement error*. This is a critical gap: in experimental practice (e.g., precision photometry), independent noise and calibration drift are epistemically distinct. The former implies each reading provides independent information about the target quantity; the latter makes the *pattern* of readings evidence about the instrument itself, which then bears on the quantity. Existing discussions assume evidence affects the partition directly, ignoring how error dependencies might require joint updates.  

  **Approach: Explicit Finite Models as a Yardstick**  
  I will construct discrete probabilistic models that include:  
  - A target variable \( H \) (e.g., a physical quantity with values \( h_1, h_2 \)).  
  - An instrument state variable \( C \) (e.g., calibration: \( c_{\text{good}} \), \( c_{\text{drift}} \)).  
  - A sequence of measurement variables \( R_1, R_2, \dots, R_n \) (readings).  
  Two scenarios will be modeled:  
  1. **Independent errors**: \( P(R_i | H, C) = P(R_i | H) \) (noise independent across \( i \)).  
  2. **Common-cause errors**: \( P(R_i | H, C) \) depends on \( C \), inducing correlations (e.g., \( C = c_{\text{drift}} \) shifts all \( R_i \) systematically).  

  The **benchmark** is global Bayesian conditioning on all readings \( R_1 = r_1, \dots, R_n = r_n \) in the full model \( (H, C, R_1, \dots, R_n) \), yielding \( P_{\text{global}}(H | r_1, \dots, r_n) \). This represents "ideal" inference when instrument states are modeled.  

  We then apply **sequential Jeffrey conditionalization** in a *reduced model* marginalizing out \( C \). Here, the partition is over \( H \) (e.g., cells \( \{h_1\}, \{h_2\} \)). For each reading \( r_i \), we:  
  - Compute the marginal likelihood \( P(R_i = r_i | H) \) from the full model.  
  - Update credence over \( H \) via Jeffrey’s rule, holding within-\( H \) ratios rigid.  
  This is repeated for all readings in different orders (e.g., \( R_1 \) then \( R_2 \) vs. \( R_2 \) then \( R_1 \)).  

  **Comparison Metrics**:  
  - *Order dependence*: Variance in final \( P(H) \) across update orders.  
  - *Accuracy gap*: Distance (e.g., Kullback-Leibler divergence) between sequential Jeffrey posterior and \( P_{\text{global}}(H | r_1, \dots, r_n) \).  

  **Why This Approach?**  
  - *Beyond algebra or interpretation*: A purely algebraic proof about commutability (e.g., "Jeffrey updates commute iff likelihoods factor") would miss the *causal context* of errors. Similarly, abstract arguments about "evidence vs. experience" ignore the inferential implications of hidden variables. By using explicit generative models, we ground the analysis in scientific practice.  
  - *Better than alternatives*:  
    - Simple commutability proofs cannot distinguish error types; our models encode them structurally.  
    - Purely verbal arguments about path-dependence lack predictive precision; we quantify divergence.  
  - *Confronts radical probabilism*: We do not assume evidence propositions are always articulable. Instead, we:  
    - Test if sequential Jeffrey (which avoids evidence propositions) approximates global conditioning (which requires them) *when hidden states exist*.  
    - If it fails, we show that *even when evidence propositions are ineffable*, the rule’s reliability depends on error structure.  

  **Work Plan**  
  - **Month 1**: Model construction.  
    - Define joint distributions for both scenarios (e.g., \( H \) binary, \( C \) binary, 2–3 readings).  
    - Specify likelihoods: For independent errors, \( P(R_i|H) \) identical; for common-cause, \( P(R_i|H,C) \) with \( C \)-dependent bias.  
  - **Month 2**: Computation and comparison.  
    - Compute benchmark \( P_{\text{global}}(H) \) for simulated data.  
    - Implement sequential Jeffrey updates for all reading orders.  
    - Measure order dependence (variance over orders) and accuracy gap (vs. benchmark).  
  - **Month 3**: Analysis and generalization.  
    - Vary parameters (e.g., prior confidence in \( C \), error magnitude) to find when divergence occurs.  
    - Extend to 3–4 readings if feasible.  
    - Interpret results: Does Jeffrey conditionalization inherently conflate error types? Is it better suited to "direct" evidence?  

  **Possible Conclusions**  
  1. **Order dependence**:  
     - *Likely in common-cause case*: Sequential updates exhibit path dependence because readings indirectly inform \( C \), which is marginalized out.  
     - *Likely absent in independent case*: Updates commute due to conditional independence.  
  2. **Accuracy gap**:  
     - *Larger in common-cause case*: Sequential Jeffrey underestimates calibration uncertainty, deviating from the benchmark.  
     - *Small or zero in independent case*: The rule approximates global conditioning.  
  3. **Implications for Jeffrey conditionalization**:  
     - If (1)–(2) hold, the rule is inadequate for common-cause errors unless the partition includes instrument states (but this violates rigidity for \( H \)). This supports treating it as a rule for *experiences* (path-dependent) rather than *evidence* (path-independent).  
     - *Radical probabilist rejoinder*: If evidence propositions are ineffable, Jeffrey may still be "best available" in common-cause cases—but our results show it incurs systematic bias.  

  **Risks and Failure Conditions**  
  - *Failure*: Minimal order dependence or accuracy gaps in either scenario. This would suggest the error-structure distinction is less relevant than intuition claims. We would publish null results, urging philosophers to engage with experimental error models.  
  - *Artifact risk*: Small models may exaggerate effects. We mitigate by testing robustness across parameter choices.  
  - *Scope limitation*: Continuous variables (e.g., Gaussian drift) might strengthen results but require measure theory. We avoid this by using discrete models; if needed, we note how continuity might amplify divergence.  
  - *Overambition*: Proving general theorems about convergence might exceed three months. We focus on finite cases, with conjectures for generalization.  

  **Outcome if Radical Probabilism is Sound**  
  Even if evidence propositions are inarticulable, this project shows that Jeffrey conditionalization’s reliability *depends critically on error structure*. This implies:  
  - Users must assess error dependencies *before* choosing an update rule.  
  - The rule is not universally minimal or rational; its justification requires domain-specific assumptions (e.g., "no hidden common causes").  
  This elevates the importance of modeling measurement processes—a core scientific practice—in formal epistemology.
