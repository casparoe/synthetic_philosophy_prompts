  | Wrinkle 3: Different invariance classes. | In RL, the reward function is unidentifiable up to potential-based shaping, which is a larger class than the affine transformations in revealed preference. | The difference arises because the two settings are different: one is about static choices, the other about sequential decisions. The invariance in RL is about preserving the optimal policy (or the policy distribution) in a MDP, while in revealed preference it's about preserving the ordering of outcomes. | The residue is that the two invariance classes are solving different problems. The RL invariance is tied to the dynamics of the environment, which doesn't appear in the static choice setting. |

