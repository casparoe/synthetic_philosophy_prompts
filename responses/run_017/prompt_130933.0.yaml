  The core claim of revealed preference (strong form): Utility is nothing more than a representation of an agent's choice behavior. It has no independent meaning beyond that. In the RL vocabulary, we can say that the reward function is just a way to represent the policy (or the preference data) and has no content beyond that.

  We will break down the core claim and the three wrinkles:

  1. Core claim: Utility is a representation of choice behavior and nothing more.
     - RL translation: The reward function is a representation of the policy (or the preference data) and has no independent meaning beyond that. The equivalence classes (like potential-based shaping) show that many reward functions can lead to the same policy.

  2. Wrinkle 1: Stochastic policies with unobservable temperature.
     - In revealed preference, the classical setting is deterministic. Stochastic choice introduces a problem of separating true preference from noise. The philosophical debate might not have a direct counterpart because they typically assume deterministic choices. However, there are extensions (like random utility models) that account for randomness. But in the RL setting, the temperature is unobservable and drifts, which might be a problem that the classical revealed preference doesn't handle.

  3. Wrinkle 2: Endogenous menus (only seeing choices from menus selected by an upstream recommender).
     - Revealed preference typically assumes that we observe choices from a set of menus that are exogenously given and cover enough to pin down the preference ordering. If the menus are endogenous and not controlled, then we might not have the necessary data to infer the true preferences. The classical revealed preference theory might not be doing any work in this setting because the menu selection is influenced by factors that might correlate with the agent's preferences, leading to selection bias.

  4. Wrinkle 3: Different invariance classes (monotone/affine transformations vs. potential-based shaping).
     - In revealed preference for choice, utility is unique up to monotone or positive affine transformations (depending on the setting). In RL, the reward function is unique only up to potential-based shaping (which is a much larger class). This difference arises because the two frameworks are answering different questions: revealed preference for choice (which is about ordering of outcomes) vs. reward for policies (which is about long-term behavior in sequential decision making). The invariance in RL is about the optimal policy (or the policy distribution) being invariant under potential-based shaping, which is a consequence of the Bellman equation.

