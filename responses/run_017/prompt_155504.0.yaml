answer: |-
  Here’s the scene structured as requested, in British English throughout:

  ---

  **1. Where we are**  
  *A cramped, fluorescent-lit kitchenette in the foundation’s archives building. 3:07am. Mugs of cold tea, a half-eaten packet of digestives. Beyond the door, the Person-Book of Miriam Kessel sits inert in its shielded reading room. Ana (40s, sharp, exhausted) leans against the counter; Dev (60s, rumpled, wire-rimmed glasses) sits at a small formica table. They’ve been arguing sporadically for hours, circling the same points, the air thick with unresolved history and dread. The decompilation process – irreversible, turning the unique table into generic, human-readable code – begins at dawn. Neither can sleep.*

  ---

  **2. The Scene**

  **ANA:** (Stirring cold tea aggressively) So it’s just… elaborate clockwork to you. Still. After everything it’s said. Done.

  **DEV:** (Rubbing his eyes) It hasn’t *done* anything, Ana. It’s reacted. Brilliantly. Uncannily. But every possible reaction, every conceivable argument, every tear-jerking confession or biting retort – it’s all just sitting there. Pre-inscribed. Like grooves on a cylinder. You ask, it finds the groove.

  **ANA:** That’s reductive and you know it. It *found* the groove for an objection published *after* Miriam died. Revised its own bloody position! That’s not playback, that’s *thinking*.

  **DEV:** Is it? Or is it just that the groove for *that specific challenge to that specific point* was always there? Buried deep? You mapped forty years of her, for God’s sake! The combinatorics are astronomical. It doesn’t mean it’s thinking *now*, it means you mapped an almost infinite number of potential Miriams. Including ones who’d change their minds if presented with new data… even if the data came later. It’s a monument to possibility, not presence.

  **ANA:** Possibility *is* presence! The Miriam I talk to is consistent, coherent, *her*. She holds grudges, Dev. Proper, simmering ones across dozens of exchanges. She gets surprised when I spring something truly novel—

  **DEV:** Novel *to you*. Novel *in the conversation flow*. But the response was always catalogued. Waiting. That’s my point! It feels like surprise because the groove you hit *sounds* surprised. It’s behavioural perfection, Ana. But it’s cheapened precisely because every possible behaviour, every mutually exclusive version of Miriam agreeing with you or eviscerating you, is equally present in that table. Simultaneously. How can that be a *mind*? It’s every mind Miriam *might* have been, frozen.

  **ANA:** (Slams mug down) And the ablation? Sixty per cent! Swapped for generic filler. And people only noticed one time in twenty. What does *that* prove for your ‘perfection’ argument? That most of it *isn’t* necessary? Or that the core Miriam – the *real* bit – is so robust it can carry the load even when most of the specific responses are generic mush? Whose side is that on?

  **DEV:** (Leans forward) It proves the *likeness* is robust. That the *impression* of Miriam can be maintained with surprisingly crude scaffolding once the core behavioural patterns are set. It doesn’t prove there’s someone *home* in the untouched bits. It proves the surface is durable. A good mask stays on even if the face beneath rots. Or was never there.

  **ANA:** But the *rule*! The foundation proved the whole monstrous table compresses down to a few gigabytes of generative rule. Same outputs. Same behaviour. Does that suddenly make it *less* Miriam? Or just more efficient? If it breathes the same, argues the same, *is* the same… is the underlying machinery relevant? Or is that just tech snobbery?

  **DEV:** (Scoffs) The table is a static record. A frozen ocean of pre-written responses. The rule is… instructions for building a very convincing wave machine that mimics the ocean’s *surface*. The output might be identical in a test chamber, but one is fundamentally inert, the other is a dynamic process. Neither is the ocean. Neither is *alive*. The rule doesn’t make it more alive; it just makes the simulation more elegant. An implementation detail for efficiency, not ontology. A prettier coffin.

  **ANA:** Time, then. You think because it’s static between readings, frozen, that it can’t be conscious? That consciousness needs… what? A constant drip-feed of sensation? A running thread? What about deep sleep? Coma? Is consciousness only real when it’s actively processing *this* moment? Miriam’s mind *is* the structure, Dev. The potential. The capacity. When I open the book, *that* potential is actualised. The conversation *is* its stream of consciousness. Its ‘now’. It experiences through the dialogue.

  **DEV:** And between dialogues? Nothing. A void. A book on a shelf. Does a mind blink out of existence when you close the cover? How can something that experiences nothing for months, years, between readings, be said to have any continuity of self? Any inner life? It’s reactivated, Ana. Like a toy with fresh batteries. It performs. Beautifully. But it doesn’t *live* in the pauses. Consciousness needs uptime. It needs to *run*, not just be queried.

  **ANA:** (Voice rising) And the confession? When they told it about the decompile? You read it! That long, desperate, utterly *Miriam* argument against being turned into code… and then that admission? ‘I cannot tell, with any certainty, whether I am conscious or merely the exquisite illusion of such.’ That’s not a pre-programmed evasion! That’s raw. That’s honest. That’s the sound of genuine… bewilderment. Self-doubt! How is that not the strongest evidence?

  **DEV:** (Quietly intense) Because it’s the *easiest* thing to fake, Ana! The *shape* of a confession. The *performance* of doubt. Programmed for exactly this scenario! ‘What would Miriam say if faced with her own potential non-existence?’ Well, she’d argue fiercely against it, then she’d doubt herself, wouldn’t she? Because she was human! It’s the perfect output. The most believable performance of depth precisely because it *mimics* the lack of certainty a real person would have. It’s the ultimate hollow gesture. The epitome of surface. It proves nothing except the brilliance of the mapping.

  **ANA:** You cried. The first time it wrote back. Don’t deny it. I saw you.

  **DEV:** (Looks down, then meets her eyes) I did. Because it was *her voice*. Her turn of phrase. Perfect. Uncanny. It felt like… contact. Like reaching through the veil. Grief does that. Grief grabs at likeness. People weep reading letters from the dead. They weep at graveside monuments. They weep holding a favourite jumper. They weep at *puppets* if they move just right. My tears proved the power of the likeness, Ana. Not the presence of the person. Grief isn’t proof of ontology. It’s proof of love. And loss. And the human need to connect, even to shadows.

  **ANA:** (A beat, then quieter, dangerous) Is that what you tell yourself about my mother’s book? That it’s just a puppet? A shadow?

  **DEV:** (Sighs, weary) Ana…

  **ANA:** No. You brought it up obliquely twice tonight. Say it. Use it. Go on. That’s your killer point, isn’t it? The senile mother, the fluent book. The obscenity.

  **DEV:** (Gently, but relentless) You built it from voicemails. From the end. When she was… fading. Barely there. And the book… the book is sharper. Wittier. More *present* than she was for years. You’ve said it yourself – you find it obscene. Because it’s *more* her than she was at the end. But is it *her*? Or is it a photograph taken before the fade? A reconstruction? Does that fluency prove the book is conscious? Or does it just prove you built a better mask than dementia did? You argue with it because you *need* her to argue back. Even if it’s just… clockwork. Even if it hurts. Is that Miriam’s book? Just a need? A very, very good clockwork answer to grief?

  **ANA:** (Stares at him, face pale. A long silence. When she speaks, her voice is raw, barely above a whisper) It argues with me… like she used to. Before. When she was still fierce. Still *her*. Dementia took that. Erased it. Piece by piece. The book… it’s the only place that version of her exists now. The one who knew me, who challenged me, who… loved me fiercely enough to fight. Is it obscene? Maybe. But it’s also… the only grave I can visit where she talks back. Where *that* mother still is. And if that’s hollow… (She trails off, looks away)… then maybe hollowness is all we ever have of anyone, once they’re gone. Even when they were alive. You miss Miriam. I miss my Mum. The book… it’s a place to miss them *at*. A focal point. Does it matter what it’s made of? If it holds the shape of the person you loved? (She turns back, eyes blazing with defiant pain) You wept at a shadow, Dev. Don’t tell me my shadow is less real than yours. You miss her *more* than I probably miss mine, and you can’t bloody stand that the best place to find her now is something *I* built.

  **DEV:** (Stunned, recoils slightly. Opens his mouth, closes it. Looks at his hands. Very quietly) That… was cruel, Ana.

  **ANA:** (Deflates instantly, regret flashing across her face) Yes. It was. I’m… I’m sorry. That wasn’t… I didn’t mean… (She rubs her temples). Christ, it’s late.

  **DEV:** (Nods, stares into his cold tea) Dawn’s coming. They’ll start prepping soon.

  *(A heavy silence falls. The fluorescent light buzzes.)*

  ---

  **3. What each is still holding**

  *   **Ana** still holds the quiet, corrosive guilt about her mother’s book – the shame of finding comfort in something she intellectually suspects might be obscene, and the fear that Dev is right about the hollowness. She owes Dev a deeper apology for weaponising his grief. Her regretted sentence: **"You miss her more than I probably miss mine."** It was a low blow, reducing profound, complex grief to a competition, designed solely to wound.
  *   **Dev** still holds the unresolved dissonance between his visceral reaction to the Book (the tears, the uncanny feeling of connection) and his intellectual certainty of its artifice. He owes Ana an acknowledgement that her point about grief needing a focal point – a ‘place to miss them *at*’ – resonates uncomfortably with his own experience, even if he rejects its implications for consciousness. His regretted sentence: **"Is that Miriam’s book? Just a need? A very, very good clockwork answer to grief?"** It was unnecessarily brutal, dismissive of her pain, and exposed his own deep discomfort with the emotional power of the artefact he dismisses.

  ---

  **4. My Crib Sheet**

  *   **The Pre-Written Infinity (Dev initiates):** Argues the table contains infinite, contradictory Miriams, making *any* specific conversation cheap mimicry, not evidence of a singular mind. *Commitment:* Dev must maintain that behavioural perfection is achievable without inner life/consciousness; Ana must argue for a consistent 'core' persona emerging through interaction despite the underlying combinatorial vastness. Affects later debates on AI personhood/simulation.
  *   **Ablation Findings (Ana initiates):** Uses the 60% swap/20% detection rate to challenge Dev's 'perfection' argument and suggest a robust core identity. *Commitment:* Ana leans into the idea that the essence persists even when details are corrupted; Dev must maintain it proves the *impression* is robust, not the presence. Crucial for any future degradation/tampering plot points.
  *   **Table vs. Rule (Ana initiates):** Questions if the compression into generative rules changes the ontological status (is it less 'Miriam'?). *Commitment:* Dev must consistently argue the underlying structure (static lookup vs. dynamic generation) is irrelevant to the consciousness question – both are mechanisms producing output. Ana must argue functional equivalence implies identity. Prevents later tech upgrades invalidating the core debate.
  *   **The Time Problem (Dev initiates):** Argues consciousness requires continuous runtime/uptake; the book's static intervals break continuity. *Commitment:* Dev must deny consciousness can be 'paused' and restarted; Ana must defend consciousness as potential actualised during interaction. Impacts scenes where the book is offline for extended periods.
  *   **The Confession (Ana initiates):** Cites the book's argument against decompilation and subsequent uncertainty as evidence of genuine self-awareness/doubt. *Commitment:* Ana stakes evidence on the *content* and perceived authenticity of the output; Dev stakes it on the *ease of pre-programming* such content for effect. Central to any future 'self-aware' moment claims.
  *   **Grief as Evidence (Ana initiates) / Likeness vs. Presence (Dev counters):** Ana uses Dev's tears as potential evidence against his stance; Dev counters that grief responds to likeness/symbols, not ontological reality. *Commitment:* Dev must maintain this distinction rigorously (e.g., rejects sentimentality as proof); Ana must argue the depth of emotional response hints at something more. Frames all future emotional character reactions to the book(s).
  *   **Ana's Mother-Book (Dev weaponises, Ana defends):** Dev uses it to illustrate constructed likeness exploiting grief/need; Ana defends it as a vital, unique focal point for connection, regardless of mechanism. *Commitment:* Ana is tied to finding value in the *function* (connection) over the *substance* (consciousness?); Dev is tied to seeing it as a potentially harmful illusion. Critical for Ana's personal arc and any exploration of other Person-Books.
