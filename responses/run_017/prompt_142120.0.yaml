  Okay, the user is taking an upper-level seminar on Bernard Williams and consequentialism. They're working on a response paper and have concerns about their professor's handout summarizing Williams' critique. The user suspects two issues: first, that the handout conflates two distinct arguments from Williams (the integrity/ground projects point with the traveler example, and the "one thought too many" wife-saving case), and second, that it oversimplifies Williams' actual conclusion about utilitarianism being an esoteric morality.

  The user wants a clause-by-clause analysis of the handout to identify accurate representations, defensible compressions, and misrepresentations. They're particularly focused on three aspects: whether the "one thought too many" critique genuinely targets utilitarianism specifically, whether the wife-saving example works if utilitarianism would actually demand saving the stranger, and whether utilitarianism truly makes that thought unavoidable given the criterion/decision-procedure distinction.

  I need to carefully unpack this. The handout presents Williams' critique as a unified "objection from integrity," but Williams actually developed two distinct though related critiques. The Jim and the Indians case (traveler asked to shoot one captive) illustrates the alienation from ground projects argument, while the drowning wife case illustrates the separate "one thought too many" problem about justification. Conflating them loses nuance.

  Regarding the drowning wife example: The handout assumes utilitarianism permits saving the wife. But if utilitarianism actually required saving the stranger, we'd just have a straightforward moral conflict rather than Williams' distinctive complaint about justification. The force of the example depends on utilitarianism granting permissibility but requiring the "wrong" kind of justification.

  On the "unavoidable thought" claim: Utilitarians can distinguish between criterion of rightness and decision procedures (e.g., using heuristics in emergencies). So Williams' critique might only apply to how agents consciously justify actions, not to the theory's fundamental criterion. However, Williams would counter that the utilitarian criterion still contaminates the justification structure.

  For the conclusion: The handout claims Williams thinks he's "refuted" utilitarianism, but Williams' actual position in "A Critique of Utilitarianism" is more subtle - he argues utilitarianism could only function as an esoteric morality, and that this is a fatal flaw since morality must be livable and psychologically realistic.

  The strongest version of Williams' objection combines both critiques: Utilitarianism alienates us from constitutive projects (threatening integrity) and distorts our moral psychology by demanding inappropriate justifications even for permissible actions. The deepest point is that utilitarianism fails to account for the personal perspective essential to ethical life.

  For the user's paper, I should recommend engaging with both the Jim case and drowning wife case separately, addressing the criterion/procedure distinction, and seriously considering Williams' challenge regarding whether utilitarianism can function as a public, livable morality.
answer: |-
  Here's a clause-by-clause breakdown of the handout, assessing its accuracy against Williams's core arguments, followed by answers to your specific questions and guidance for your paper:

  ### Clause-by-Clause Analysis

  1.  **"Williams's objection to utilitarianism is an objection from integrity."**
      *   **Williams Would Accept:** This is fundamentally correct. The *integrity objection* is the overarching theme of his critique in "A Critique of Utilitarianism" (in J.J.C. Smart & Bernard Williams, *Utilitarianism: For and Against*).
      *   **Defensible Compression:** Yes. Integrity is central.

  2.  **"Utilitarianism holds that my projects, my relationships and my loyalties are worth anything only insofar as they show up in an impartial sum of welfare..."**
      *   **Williams Would Accept:** This captures the core utilitarian demand for impartiality that Williams targets. He argues utilitarianism reduces the *personal* significance of these things to their *impersonal* contribution.

  3.  **"...so at every point I must be prepared to drop them, or to act against them, if doing so produces even a small net gain overall."**
      *   **Williams Would Accept:** This is a crucial part of his critique, vividly illustrated in the **Jim and the Indians** case. It highlights the *constant potential demand* utilitarianism places on the agent to sacrifice deeply personal commitments for the greater good. The "small net gain" phrasing emphasizes the demandingness and potential triviality of the sacrifice demanded relative to the personal cost.

  4.  **"In demanding this, utilitarianism alienates a person from the ground projects that give his life its point, and so attacks his integrity."**
      *   **Williams Would Accept:** This is the heart of the **integrity/ground projects objection**. Williams argues that being forced to view one's deepest commitments ("ground projects") as fungible contributions to an impersonal sum, and being constantly ready to abandon them, severs the agent from what constitutes their sense of self and purpose. This *alienation* is the attack on integrity.

  5.  **"His most famous example makes exactly the same complaint in miniature..."**
      *   **Misrepresentation (Careful Reader Should Reject):** This is where the handout goes significantly astray. **The drowning wife case ("one thought too many") is NOT the same point "in miniature" as the Jim and the Indians case.** Your suspicion is correct. The Jim case illustrates the **sacrifice/alienation of ground projects** for the greater good. The drowning wife case illustrates a distinct point about **justification and moral psychology**, even when the *action* (saving the wife) *is* permitted by utilitarianism.

  6.  **"...a man whose wife is drowning jumps in and saves her rather than a stranger. If he has to be able to tell himself that this is permitted because it maximizes welfare — if that thought must be available to him as his justification — then he has had one thought too many; he should simply be reaching for his wife."**
      *   **Williams Would Accept:** This is an accurate summary of the **"one thought too many"** argument itself. Williams's point is that the *proper* justification for saving his wife in such a situation is simply "because she is my wife" – the relationship itself provides the direct reason. Having to consciously justify it via an impersonal calculus (even if the calculus allows it) is morally inappropriate and reveals a distortion in the agent's motivations and understanding of their relationship.

  7.  **"Utilitarianism makes that thought unavoidable, because on utilitarianism the fact that she is his wife counts for nothing in its own right."**
      *   **Defensible Compression (with Caveats):** This captures Williams's core claim: utilitarianism cannot grant *intrinsic moral weight* to the relationship itself; it can only value its consequences (e.g., general happiness from stable relationships, or the specific welfare of *this* person). Thus, the *only* justification available *within the theory* is the consequentialist one. However, the "unavoidable" claim needs nuance regarding the criterion/decision procedure distinction (see your question below).

  8.  **"Any acceptable morality therefore has to permit partiality directly, rather than deriving it from an impartial calculus..."**
      *   **Williams Would Accept:** This is a key conclusion Williams draws. An acceptable morality must recognize relationships and projects as sources of *direct* reasons for action, not merely as potential contributors to an impersonal sum.

  9.  **"...and that is why Williams thinks he has refuted utilitarianism..."**
      *   **Misrepresentation (Careful Reader Should Reject):** Williams is far more cautious. He does not claim a simple, knockdown "refutation." His argument is that utilitarianism demands an *impossible* or *deeply damaging* psychological stance towards one's own life and commitments. He argues it fails as a **psychologically realistic** or **livable** moral system for ordinary agents. Calling it a "refutation" oversimplifies his more complex, diagnostic critique.

  10. **"...a theory that cannot let a man save his own wife without a philosophical footnote is not a morality anyone could live by."**
      *   **Defensible Compression (of Williams's Conclusion):** This pithily captures Williams's core concern about **psychological realism and "livability."** The "philosophical footnote" represents the alienating justification utilitarianism imposes even on actions it permits. Williams argues that a morality demanding such constant alienation from one's personal standpoint is incompatible with a recognizably human life. *However*, it omits his specific point about the *esoteric* nature utilitarianism might be forced to adopt (see below).

  ### Addressing Your Specific Questions

  1.  **Is the "one thought too many" genuinely an objection specific to utilitarianism?**
      *   **Yes, primarily.** While *any* theory demanding the agent justify saving their spouse via an impartial calculus would face the objection, Williams targets utilitarianism *because* of its foundational commitment to impartial maximization. It's a specific consequence of utilitarianism's structure: it *cannot* grant intrinsic weight to the relationship. A theory that built in direct agent-relative permissions (e.g., some forms of deontology or virtue ethics) could avoid this problem. The objection highlights utilitarianism's *inability* to account for the direct, non-instrumental reasons relationships provide.

  2.  **Does the example have force only if utilitarianism permits saving the wife? What if it demanded saving the stranger?**
      *   **Crucially, YES, the force depends on utilitarianism permitting it.** This is a vital point often missed. Williams's complaint in the drowning wife case is *not* that utilitarianism gets the wrong answer about *what to do*. His complaint is about **how the permissible action is justified *within the theory***. If utilitarianism demanded saving the stranger, the case would simply illustrate a *conflict* between utilitarianism and common intuition about duties to family. That's a different argument (about demandingness or conflicting verdicts). The "one thought too many" objection is specifically about the **distortion of motivation and justification** *even when the theory yields the intuitively correct action*.

  3.  **Is it fair to say utilitarianism "makes the thought unavoidable," given the criterion/decision procedure distinction?**
      *   **Williams would argue YES, regarding justification.** Utilitarians (like Mill and Smart) often distinguish the *criterion of rightness* (does it maximize utility?) from the *decision procedure* agents should use (rules of thumb, sentiments, etc.). They argue an agent *shouldn't* calculate in the moment; they should act on good motives (like love). Williams counters:
          *   **Justification Structure:** Even if the agent doesn't calculate, the *justification* for why saving his wife was *right* (if challenged philosophically) ultimately rests *only* on the consequentialist grounds. "Because I love her" explains the *motive*, but not the *moral permissibility* within utilitarianism. The *required justification* still invokes the impersonal calculus.
          *   **Contamination of Motive:** Williams is skeptical that the "good motive" (love) can remain pure if the agent knows that its moral justification rests *only* on consequences. The knowledge that the relationship's value is contingent on its consequences might subtly undermine the commitment.
          *   **The "Thought" in the Justification:** The "one thought too many" refers to the thought *required* to bridge the gap between the personal motive ("she's my wife!") and the impersonal justification ("it maximized welfare"). This bridging thought *is* unavoidable within utilitarianism when providing a moral *justification*, even if not used in the decision procedure.

  ### Does the Last Sentence Survive Correction?

  *   **Substantially, YES, but modified.** The core idea that "a theory that cannot let a man save his own wife without a philosophical footnote is not a morality anyone could live by" captures Williams's central concern about psychological realism, alienation, and the "livability" of morality. However, correcting the handout means:
      1.  Acknowledging this is *one* strand (the justification strand), distinct from the ground project sacrifice strand (Jim case).
      2.  Understanding "philosophical footnote" refers to the *required consequentialist justification*, not necessarily conscious calculation.
      3.  Framing it as a *devastating problem* for utilitarianism's claim to be a complete and psychologically adequate moral system, rather than a simple "refutation".

  ### The Strongest Form of the Objection for Your Paper

  The strongest version of Williams's critique you should argue against **integrates both the Jim case and the drowning wife case, framed by his concern about psychological realism and the "esoteric morality" consequence:**

  1.  **The Integrity/Ground Projects Objection (Jim Case):** Utilitarianism requires agents to be alienated from their deepest commitments ("ground projects") by demanding they view them as constantly sacrificable for even marginal gains in the impersonal good. This attacks the core of personal integrity and identity. It imposes an impossible psychological demand – being deeply committed to projects while being ready to abandon them at any moment for the greater good.
  2.  **The "One Thought Too Many"/Justification Objection (Drowning Wife Case):** Even when utilitarianism permits partial actions (like saving one's spouse), it distorts moral psychology by demanding that the justification ultimately rest on impersonal consequences, not the intrinsic value of the relationship itself. This forces an inappropriate and alienating "philosophical footnote" onto deeply personal reasons for action.
  3.  **The Esoteric Morality Consequence & Psychological Realism:** Taken together, these objections imply that utilitarianism, if true, could not function as a sincere, psychologically realistic **public morality**. To avoid the constant alienation and distortion described, it would have to be practiced **esoterically** – known and applied only by a calculating elite, while the public is encouraged to believe in (and live by) a different set of rules (rules of thumb, common-sense morality emphasizing loyalty, etc.). Williams argues that this consequence – that the "true" morality cannot be lived sincerely by ordinary people – is itself a fatal flaw. Morality must be something people can understand, internalize, and live by without damaging self-alienation. A theory requiring esotericism fails this test of being a genuinely *human* morality.

  **Therefore, the strongest objection is:** Utilitarianism is incompatible with fundamental aspects of human agency – integrity constituted by ground projects and the direct, non-instrumental reasons provided by personal relationships. This incompatibility renders it psychologically unrealistic as a public morality, forcing it into an esoteric role. The necessity of esotericism, or the profound alienation it causes if practiced openly, demonstrates that utilitarianism fails as an adequate account of *our* moral experience and cannot be a livable guide for human life. *That* is Williams's powerful and enduring critique. Focus your paper on defending or challenging *this* integrated line of argument.
