prompt: |-
  Me and my mate got into a pub argument last night about insects that went on way to long. He's the sort of vegetarian who won't eat anything that might suffer, and his new thing is this: if there's even a small chance — say one or two per cent — that a beetle or an ant has some kind of inner life, then because there are completely absurd numbers of them (he was quoting something like twenty quadrillion ants, I've genuinely no idea whether that's right or he made it up on the spot), the expected suffering wrapped up in ordinary stuff like mowing a lawn, driving, or planting a field must dwarf everything going on in factory farms, and we should all be reorienting our lives around it. I pushed back with the obvious move, that at some point a tiny probability times a colossal headcount just looks like a mugging, but honestly neither of us had a position, we were just running the same two manoeuvres at each other.

  So what I want isn't the answer, it's the spec. Before I go and read any of this literature I want to know what I should be demanding of a theory: a theory of which creatures to count, how confident to be about each, and how much whatever they've got counts for — something that could actually be fed into a decision rather than admired. Concrete case I want it tested on: another friend of ours runs a small cider orchard and is thinking about dropping an insecticide spray and eating a big fall in yield; whatever the theory is, it has to be able to say something usable about that, not just shrug. Give me the desiderata, what any adequate theory has to deliver, with the case or consideration behind each one, and mark which are non-negotiable and which are just what one camp wants.

  Things I want covered, but don't only tick my list — tell me if any of mine are bogus. (1) It has to keep seperate three things I think we conflated all night: whether an insect counts at all, how many of them there are, and whether their lives are on balance good or bad for them — my mate slid straight from "they might matter" to "we're causing a catastrophe", and I don't see how that follows unless you also get a sign on the third. (2) It has to say what would count as evidence, given insects aren't just small mammals: no cortex-ish structure, tiny brains, but they learn, and some seem to keep behaving differently for a while after an injury — a rule that just demands vertebrate-looking hardware seems like cheating, and so does one that accepts anything that looks vaguely like pain behaviour. (3) It has to respect genuine uncertainty without collapsing it, so neither "unknown means zero" nor "unknown means fifty-fifty". (4) It has to be stateable before you know the numbers — it can't be a rule whose whole function is to spit out my mate's answer or mine. (5) It has to either bite the bullet on the fanaticism worry or explain why it doesn't bite here. If, as I suspect, some subset of the desiderata can't be satisfied together, say exactly which ones and why, because that's the bit I most want. Two or three lines at the end on how the rough families of views do — behaviour-based tests, hardware-based tests, the we-basically-can't-tell view — is plenty; no reading lists, I'll find those myself. Hard limit: 700 words, table's fine if that helps you stay inside it.
reasoning: |-
  Okay, the user and his friend had a pub argument about whether insects might have inner lives and if that means we should drastically change our actions to avoid causing them suffering. The user wants a framework to evaluate this, not just an answer. They need a set of criteria that any theory on insect sentience must meet to be useful in real decisions, like whether to use insecticide in an orchard.

  First, I need to break down their query. They listed five points they want covered, but I should ensure these are valid and add any missing ones. Point one is about separating moral relevance, population size, and welfare balance. That's crucial because assuming suffering without evidence is flawed. Point two asks for evidence criteria that aren't too strict or lenient. Hardware-based rules might exclude insects unfairly, while behavior-based ones could be too broad. Point three is handling uncertainty properly—not ignoring it or treating it as 50/50. Point four requires the theory to be defined before knowing outcomes, avoiding bias. Point five addresses the fanaticism problem where tiny probabilities dominate decisions.

  The user also mentions a concrete case: a cider orchard considering insecticide. The theory must provide actionable guidance here. So, any desiderata should ensure applicability to real-world scenarios. 

  Looking deeper, the user might want to resolve the argument but also understand how to approach ethical uncertainties in general. They might need a structured way to weigh risks without getting stuck in extremes. Their frustration with the back-and-forth suggests a need for a framework that incorporates evidence and uncertainty methodically.

  I should list essential criteria. Separating moral relevance from population and welfare valence is non-negotiable. Evidence criteria must be based on observable traits but not too vague. Handling uncertainty with ranges or confidence levels is key. The theory must be pre-specified to avoid bias. Fanaticism needs addressing—maybe by setting probability thresholds or using expected value without allowing extreme claims to dominate.

  Conflicting desiderata might arise. For instance, avoiding fanaticism while respecting uncertainty could clash. If a theory assigns even a tiny probability to insect sentience, massive populations might make any harmful action unjustifiable. But that leads to absurd demands. So, the theory must cap probabilities or use decision rules that prevent such extremes. Also, evidence criteria might struggle with insects' dissimilar neurology. If the theory requires mammal-like brains, it might exclude insects too quickly; if it uses behavior, it might include non-sentient beings.

  The user might not have considered how welfare balance affects the calculation. Even if insects feel pain, their lives might be net positive, making harm less concerning. The theory needs to assess this balance, not just sentience.

  In the orchard example, the theory should help weigh yield loss against potential insect suffering. This requires quantifying probabilities, welfare impacts, and trade-offs. If the theory can't handle such a case, it's inadequate.

  Finally, evaluating existing approaches: behavior-based might be too inclusive, hardware-based too exclusive, and uncertainty-based might lead to fanaticism. A combined approach using gradients of evidence and confidence levels might work, but it's tricky. Highlighting these trade-offs will help the user navigate the literature.
answer: |-
  Here are the core desiderata for any adequate theory of insect moral relevance, designed to address your argument and the orchard case. Non-negotiables (NN) are foundational for rational decision-making; others represent key challenges.

  1.  **Separate Moral Relevance, Population, and Welfare Valence (NN):** The theory must independently address:
      *   *Moral Relevance (Sentience/Subjective Experience):* Does the entity have any capacity for positive/negative experiences?
      *   *Population Scale:* How many such entities are affected?
      *   *Welfare Valence:* Is the *net* impact on their welfare positive or negative? (e.g., does death preclude future positive states? Is life net suffering?).
      *   *Case/Reason:* Your friend's slide conflates relevance with catastrophic negative valence. Killing an insect experiencing net suffering is different from killing one experiencing net pleasure, even if both are sentient. The orchard decision hinges on valence: spraying might prevent net suffering (if life is bad) *or* cause it (if life is good).

  2.  **Evidence-Based Criteria for Moral Relevance (NN):** The theory must define *which specific, observable features* (neural, behavioral, evolutionary) constitute evidence for sentience, specifying strength of evidence and avoiding:
      *   *Vertebrate Chauvinism:* Requiring mammalian brain structures (e.g., cortex) is likely too strict.
      *   *Overly Permissive Behaviorism:* Accepting any nociceptive reflex or basic learning as sufficient is likely too broad.
      *   *Case/Reason:* To move beyond "might" arguments. For the orchard, spraying affects insects with diverse physiologies (ants, aphids, beetles). The theory needs to say *which* observed features (e.g., trade-offs between injury avoidance and reward seeking, long-term motivational changes after injury, specific neural integrations) provide evidence for morally relevant experience, and with what confidence.

  3.  **Explicit Handling of Uncertainty (NN):** The theory must incorporate *degrees of confidence* in moral relevance and welfare valence, expressed as probabilities or ranges, not binary "yes/no" or default assumptions (0% or 50%).
      *   *Case/Reason:* Absolute certainty is impossible for insects. The orchard decision requires weighing the *probability* insects are sentient *and* spraying causes net harm, against the certainty of yield loss. Treating unknown as 0% ignores potential risk; treating it as 50% is arbitrary and invites fanaticism.

  4.  **Pre-Specification & Non-Ad-Hocness (NN):** The theory's rules for assigning relevance, valence, and handling uncertainty must be defined *in advance* of applying it to specific cases or knowing the population numbers/outcomes.
      *   *Case/Reason:* To prevent motivated reasoning. The theory shouldn't be tweaked solely to justify spraying (yielding low relevance) or condemn it (yielding high relevance). It must offer a consistent framework applicable to ants, cows, and hypothetical aliens.

  5.  **Addresses Fanaticism/Pascal's Mugging:** The theory must either:
      *   **Bite the Bullet:** Accept that vanishingly small probabilities of sentience coupled with vast numbers *can* dominate decisions, and provide a coherent ethical framework for this.
      *   **Avoid the Mugging:** Incorporate a plausible mechanism (e.g., diminishing marginal moral weight per individual in vast populations, probability discounting below a threshold, epistemic principles limiting extreme credences) to prevent tiny probabilities of sentience overriding all other concerns given huge N.
      *   *Case/Reason:* Your core objection. Without this, the theory yields absurd demands (e.g., never walk on grass). The orchard decision becomes impossible if even a 0.0001% chance of sentience dominates the economic cost.

  6.  **Action-Guiding for Concrete Trade-offs:** The theory must output a framework for comparing expected moral disvalue (e.g., `Probability(Sentience) * Probability(Negative_Valence) * Number_Affected * Magnitude_per_individual`) against other values (economic cost, human welfare, environmental impact).
      *   *Case/Reason:* The orchard case demands this. It forces quantification/comparison. A theory that shrugs or only says "insects might matter" is useless here.

  **Potential Conflicts & Trade-offs:**

  *   **5 vs. 3 & 4:** Strictly respecting deep uncertainty (3) combined with vast numbers makes fanaticism (5) hard to avoid without introducing potentially arbitrary thresholds or diminishing returns, which might violate pre-specification (4).
  *   **2 vs. 3:** Defining clear evidence criteria (2) is difficult; applying them under deep uncertainty (3) leads to low confidence estimates, making action-guidance (6) challenging.
  *   **1 (Valence) is critical but hard:** Determining net welfare valence for wild insects is vastly more speculative than assessing capacity for suffering.

  **How Major Views Fare (Briefly):**

  *   **Hardware-Based (e.g., requires cortex/subjective-unity):** Easier to apply (2), often assigns low probability (3), avoids fanaticism (5), provides clear action (6) ("ignore insects"). But risks false negatives (violates spirit of 2?).
  *   **Behavior/Functional-Based (e.g., learned avoidance, trade-offs):** More inclusive (2), better evidence base. But risks false positives, struggles with valence (1), uncertainty (3) is high, and fanaticism (5) is a major threat.
  *   **Radical Uncertainty/Agnosticism:** Takes (3) seriously. Often leads to precautionary principle (leaning towards 5) or paralysis (failing 6). Struggles with pre-specification (4) if "precaution" is vague.
  *   **Graded/Confidence-Based:** Assigns probabilities based on evidence strength (2, 3). Must explicitly tackle fanaticism (5) via probability thresholds/discounting to be usable (6). Best hope for satisfying all NN, but requires careful construction to avoid ad-hocness (4). Valence (1) remains a huge challenge.
