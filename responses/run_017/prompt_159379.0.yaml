  Two strongest lines of attack by a causal decision theorist:

  1. The predictor's accuracy is not 90% for this agent. The causal decision theorist might argue that the agent's decision is not predetermined, so the predictor's prediction is not a reliable indicator of what the agent will do. The agent is free to choose, so she might as well choose not to pay and enjoy the money.

  2. The functional decision theory calculation assumes that the agent's decision rule is what the predictor is predicting. But in reality, the predictor might be predicting based on the agent's past behavior or psychological traits, not on a timeless decision rule. So if the agent changes her mind now, the predictor might have been wrong, but that doesn't mean the decision rule was not to pay; it might be that the agent is not committed to a rule.

  Honest note: The scenario requires the agent to accept the functional decision theory's perspective that she is choosing a decision rule that applies across counterfactual situations. A reader might object that the agent is not defined by a fixed decision rule and that she can choose arbitrarily at the moment. Also, the predictor's accuracy is assumed to be 90%, but in reality, for a shrewd human, 90% might be too high for predicting a one-off decision. The scenario also relies on the agent believing the independence of the predictor's predictions in the EDT-rigged version.

  Now, let's write the scenario as a single paragraph and then the demonstration.

  Final Scenario (for counterfactual mugging without EDT rig):

  Dr. Lee applied for a research grant from her professional association. The association uses a psychologist, Dr. Smith, to predict whether an applicant would voluntarily repay half the grant if asked, with 90% accuracy based on an interview and file review. The grant is awarded only if Dr. Smith predicts repayment. Dr. Lee received the $10,000 grant last month. Now, the association writes to Dr. Lee: due to a funding shortfall, they request a $5,000 repayment. They emphasize that the grant is non-revocable and the decision is private (no record kept, no consequences, and no one else informed). Dr. Smith has retired and moved abroad, and future grants are decided by anonymous review. The letter states that the repayment cannot affect the grant or future funding. Dr. Lee must decide whether to repay.

  Demonstration:

  1. **Causal Decision Theory (CDT)**: The payment of $5,000 does not cause any change in the grant (which is already received and irrevocable) or in any future benefits (due to anonymity and no records). Therefore, the agent sees a choice between keeping $10,000 (not pay) and having $5,000 (pay). CDT recommends not paying.

  2. **Functional and Updateless Decision Theory (FDT/UDT)**: The agent evaluates the expected utility of the decision rule. If the agent adopts the rule "Pay", then with probability 0.9 (the predictor's accuracy) the predictor predicts "Pay" and the grant is awarded, and the agent pays $5,000, resulting in $5,000. With probability 0.1, the predictor predicts "Don't Pay", the grant is not awarded, and the agent is not asked to pay, resulting in $0. Expected utility: 0.9*5000 + 0.1*0 = 4500. If the agent adopts the rule "Don't Pay", then with probability 0.1 the predictor predicts "Pay" (incorrectly), the grant is awarded, and the agent doesn't pay, resulting in $10,000. With probability 0.9, the predictor predicts "Don't Pay", the grant is not awarded, and the agent is not asked to pay, resulting in $0. Expected utility: 0.1*10000 + 0.9*0 = 1000. Since 4500 > 1000, FDT/UDT recommends paying.

  3. **Evidential Decision Theory (EDT)**: The agent conditions on the action. Conditioned on paying, the agent has the grant and pays $5,000, so utility is $5,000. Conditioned on not paying, the agent has the grant and does not pay, so utility is $10,000. EDT recommends not paying. The evidential link that is missing is that not paying does not provide evidence about any other payoff-relevant event beyond the grant already received.

  4. **Minimal change to make EDT pay (XOR-style rig)**: Add that Dr. Smith also predicted whether Dr. Lee would win a $15,000 research award (to be decided next month), and his prediction for the award was the same as for repayment. The award prediction has 90% accuracy, and the agent believes that the predictions are perfectly correlated in correctness. Then:
     - If Dr. Lee pays, this is evidence that the predictor was correct about repayment, hence also about the award, so she will win the award with certainty (given the evidence). Utility: $5,000 + $15,000 = $20,000.
     - If she does not pay, this is evidence that the predictor was wrong about repayment, hence wrong about the award (he predicted she would win, but she won't). Utility: $10,000.
     EDT then recommends paying.

  5. **Structural difference**: The original scenario is a counterfactual mugging because the benefit (grant) was disbursed in the past based on a prediction about the agent's present action, and the only connection is through the counterfactual dependence: the agent in the actual sequence got the grant because the predictor predicted payment, and now if she doesn't pay, she violates the prediction but suffers no direct loss. The XOR blackmail adds an additional event (the award) that is evidentially tied to the same prediction, so not paying becomes evidence of losing the award.

  6. **Load-bearing feature**: The irrevocable disbursement before the decision, with no causal consequences of the decision, and the predictor's inaccessibility for future interactions.

  7. **Removal tests**:
     - If the agent chooses before disbursement: Then CDT might recommend committing to pay to get the grant, making the mugging aspect vanish.
     - If the predictor is still reachable: The agent might fear affecting future interactions, so CDT might pay.
     - If a second round is added: Future benefits might depend on current payment, so CDT might pay for reputation.

     The constraints doing the real work are the irrevocability of the grant, the privacy of the decision, and the isolation from future rounds.

  8. **Lines of attack for CDT**:
     a. The agent's decision is not predetermined, so the predictor's 90% accuracy does not compel her to act as if her decision is fixed by a rule. She can choose not to pay without being inconsistent.
     b. The predictor is not actually predicting a decision rule but a disposition based on past traits. The agent's current decision may reflect a change, so the prediction does not bind her to a rule.

  9. **Honest note**: The scenario assumes the agent accepts the FDT/UDT framework of evaluating decision rules across counterfactuals. It also assumes the predictor's 90% accuracy is credible for a human predictor in a one-off decision, which might be challenged. In the EDT-rigged version, the perfect correlation of prediction correctness is a strong assumption.
