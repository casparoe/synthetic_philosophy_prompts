  ### Scenario  
  Dr. Elena Rossi, a member of a professional engineering association, was awarded a $50,000 research grant from a discretionary fund. The grant committee included a renowned behavioral psychologist, Dr. Chen, who interviewed Rossi, reviewed her past projects and correspondence, and predicted with 85% accuracy whether she would voluntarily repay $25,000 if later requested. The grant was disbursed only if Dr. Chen predicted repayment; it was awarded to Rossi last month and is contractually irrevocable. Today, the association writes to Rossi, explaining a funding shortfall and requesting the $25,000 repayment. They emphasize complete confidentiality (no records kept, no observers, no disclosure), note Dr. Chen has retired unreachably abroad, and state that future grants are determined by blind review (no reputational effects). Rossi knows repayment cannot alter the grant or future outcomes, and no pre-commitment mechanism was available. Payoffs are final: repayment leaves her with $25,000 net; non-repayment leaves $50,000.  

  **Route Closures** (one sentence each):  
  - *Observers*: The association guarantees confidentiality, so no third parties learn Rossi's choice.  
  - *Second round*: Future grants use blind review, so current actions cannot influence later decisions.  
  - *Reputational consequences*: Confidentiality and Dr. Chen's retirement prevent any reputational impact.  
  - *Pre-commitment*: No prior device (e.g., escrow or pledge) was offered or available.  
  - *Character considerations*: The request is framed as a one-time act with no implications for self-concept.  

  **Break-even accuracy and margin**:  
  - Break-even accuracy: 66.7% (derived below).  
  - Stated accuracy: 85% (clears break-even by 18.3 percentage points).  

  ### Demonstration  
  **Causal decision theory (CDT) verdict: Do not pay ($50,000 > $25,000)**  
  CDT evaluates only causal consequences. Repayment causes a $25,000 loss with no offsetting benefit (grant irrevocable, no future effects). Thus:  
  - Utility(pay) = $50,000 (grant) - $25,000 = $25,000.  
  - Utility(not pay) = $50,000.  
  CDT chooses not pay.  

  **Functional and updateless decision theory (FDT/UDT) verdict: Pay (expected utility $31,875 > $7,500)**  
  FDT/UDT evaluates the agent’s decision rule across all possible predictor outputs. Let \(p = 0.85\) be accuracy.  
  - If Rossi’s rule is "pay":  
    - Predictor correctly predicts "pay" with prob \(p\), grant awarded, she pays: net $25,000.  
    - Predictor incorrectly predicts "not pay" with prob \(1-p\), no grant, no request: net $0.  
    - Expected utility: \(0.85 \times 25,000 + 0.15 \times 0 = 21,250\).  
  - If Rossi’s rule is "not pay":  
    - Predictor incorrectly predicts "pay" with prob \(1-p\), grant awarded, she does not pay: net $50,000.  
    - Predictor correctly predicts "not pay" with prob \(p\), no grant, no request: net $0.  
    - Expected utility: \(0.15 \times 50,000 + 0.85 \times 0 = 7,500\).  
  Since \(21,250 > 7,500\), FDT/UDT recommends paying. FDT and UDT align (both treat the decision as timeless).  

  **Break-even accuracy derivation**:  
  Set expected utilities equal:  
  \[ p \times 25,000 = (1 - p) \times 50,000 \]  
  \[ 25,000p = 50,000 - 50,000p \]  
  \[ 75,000p = 50,000 \]  
  \[ p = 50,000 / 75,000 \approx 0.667 \] (66.7%).  
  At 85% > 66.7%, paying has higher expected utility under FDT/UDT.  

  **Evidential decision theory (EDT) verdict: Do not pay ($50,000 > $25,000)**  
  EDT conditions on the action and computes expected utility given that evidence.  
  - If Rossi pays:  
    - She has the grant (evidence: grant was awarded), so paying nets $25,000.  
    - Repayment is evidence the predictor was correct, but this does not affect her utility.  
    - Utility: $25,000.  
  - If Rossi does not pay:  
    - She has the grant, so not paying nets $50,000.  
    - Non-repayment is evidence the predictor was wrong, but no consequence.  
    - Utility: $50,000.  
  EDT chooses not pay.  

  **Absent evidential link and minimal XOR-style rig**:  
  - **Absent link**: Non-repayment provides no evidence about *other* payoff-relevant events. EDT pays only if an action yields evidence about a *distinct* consequence.  
  - **Minimal change (XOR rig)**: Add a bad event: Dr. Chen *also* predicted whether Rossi would face a $30,000 regulatory fine (independent event, 85% accuracy). The grant was awarded only if he predicted *both* repayment and *no fine*. Now:  
    - If Rossi does not pay, it is evidence Dr. Chen was wrong about repayment, hence likely wrong about no fine (if predictions are correlated), increasing the perceived probability of a fine.  
    - EDT then trades on the link between non-repayment and evidence for the fine (e.g., utility if not pay: \( \$50,000 - \text{expected fine} \)).  

  **Why this is a counterfactual mugging, not XOR blackmail**:  
  - **Structural difference**: In counterfactual mugging, the benefit depends *only* on the prediction of the agent’s action in the focal scenario. In XOR blackmail, the benefit depends on the prediction *and* an independent bad event.  
  - **Secured in scenario**: The grant depends *solely* on the repayment prediction (no fine or other event). The XOR rig adds a bad event to transform it.  

  ### Load-Bearing Feature and Removal Tests  
  **Load-bearing feature**: The benefit is disbursed *before* the decision, irrevocably, with no causal or evidential paths to other outcomes.  
  **Removal tests**:  
  - **Choose before disbursement**: If Rossi decides pre-disbursement, CDT and EDT may pay to secure the grant (e.g., CDT if binding commitment). The mugging vanishes.  
  - **Predictor reachable**: If Dr. Chen is available, Rossi might repay to avoid future prediction bias. CDT could pay, closing the divergence.  
  - **Add second round**: If future grants use this decision as input, CDT may pay for reputational benefits.  
  **Constraint doing real work**: The irrevocable pre-disbursement combined with predictor inaccessibility ensures no causal levers remain.  

  ### Lines of Attack for CDT Defenders  
  1. **Accuracy/Mechanism attack**: The predictor (human, 85% accuracy) cannot reliably estimate a one-off decision. Human judgments in novel contexts are noisy; 85% overstates real-world precision. If accuracy is <66.7%, FDT/UDT’s paying verdict flips.  
  2. **Rule-Following attack**: FDT/UDT assumes Rossi adopts a timeless “rule” (pay/not pay), but the predictor tracked her *disposition*, not a rule. If her disposition shifts post-disbursement, the prediction is inert, and FDT/UDT’s counterfactual reasoning fails.  

  ### Honest Note  
  The scenario leans on the reader accepting the predictor’s 85% accuracy as credible for a human expert (though real-world personality assessments rarely exceed 70% for isolated decisions). Additionally, FDT/UDT requires the agent to conceptualize their choice as selecting a “rule” for all possible worlds, which may feel artificial to some. Explicitly stating that Dr. Chen’s model treated Rossi’s behavior as rule-governed could mitigate this.
