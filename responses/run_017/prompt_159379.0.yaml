  But this is a bit strained. And we have to assume the award is not affected by anything else and that the agent believes the predictions are perfectly correlated.

  This is the minimal change to make EDT pay.

  Now, back to the original scenario (without the award) for the counterfactual mugging.

  The structural difference between a counterfactual mugging and an XOR blackmail:

  - In a counterfactual mugging, the benefit is given in the past conditional on a prediction about what the agent would do now. The agent is then asked to pay an amount that makes her worse off than if she had not gotten the benefit, but only if she pays. There is no additional bad event; the only connection is through the predictor's accuracy and the counterfactual world where she wouldn't have gotten the benefit.
  - In an XOR blackmail, there is an additional bad event that is tied to the prediction. The agent pays to avoid evidence that the bad event will occur or to avoid the bad event itself.

  In our original scenario, there is no bad event. The only connection is through the counterfactual. Functional decision theory (FDT) cares about the counterfactual because it evaluates the decision rule across all possible prediction states. But EDT in the original setup doesn't care because it doesn't change the evidence about any other payoff-relevant event.

  In the award-rigged scenario, we added an additional payoff-relevant event (the award) that is evidentially tied to the repayment decision.

  The load-bearing feature in the counterfactual mugging is the temporal structure: the benefit is already disbursed and irrevocable, and the payment decision cannot affect it or anything else, but the decision is such that if the agent uses the decision rule that pays, she would have gotten the benefit in the first place, and if she uses the rule that doesn't pay, she would not have gotten the benefit. And the predictor's accuracy is high enough that the expected utility of the paying rule is higher.

