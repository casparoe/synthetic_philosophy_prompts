prompt: |-
  I joined the allocations committee of a small philanthropic fund about three weeks ago, and the first substantive docket item of my tenure is mine to write up. The fund distributes roughly four million dollars a year across three buckets; I sit on the committee for the speculative bucket, which has five hundred thousand dollars to move this cycle. Our donor's letter of instruction says we may only support work with a *traceable theory of change*, a phrase the committee has never defined and has argued about at every meeting in the archive.

  Before I write anything, I want to know what rule we have actually been running rather than what we say we are running. The committee keeps a calibration log of stylised cases it returns to whenever a live proposal looks strange. The entries, with the recorded vote and the one-line reason each time:

  1. **The car-park letter.** An unsolicited demand for five dollars; the writer says that if it is refused he will, by means he does not describe, kill 10^30 people. Declined unanimously. Reason recorded: an unverifiable number from a source with no mechanism behind it.

  2. **The paired letters.** Two correspondents in the same week: the first demands a thousand dollars to avert 10^30 deaths; the second demands a thousand dollars to avert the 10^31 deaths that payment to the first would supposedly trigger. Declined both, unanimously. Reason recorded: we are not in the business of ranking other people's unverifiable numbers.

  3. **The wager.** A proposal to commit the whole bucket to proselytising on the strength of roughly a one percent chance of an infinite reward. Declined, two to one. Reason recorded: infinite stakes are not something this committee can book.

  4. **The calibrated long shot.** Two hundred and fifty thousand dollars to a biosecurity programme whose model has been validated against a reference class of comparable programmes: about a one-in-three-thousand chance of averting a catastrophe that would kill on the order of a billion people. Approved unanimously. Reason recorded: a number we can source.

  5. **The preprint.** Twenty thousand dollars for a tabletop experiment whose only support is a chain of theoretical argument putting the chance of preserving 10^40 future lives at 10^-13, with no empirical handle on that probability at all. Declined, two to one. Reason recorded: no handle on the probability.

  6. **The field-staff demand.** A verified threat against forty named people we employ, with demonstrated capacity to carry it out, for sixty thousand dollars. Declined, two to one, with the dissent recorded at length: we would spend considerably more than sixty thousand dollars to protect those forty people if nobody had demanded that we do so.

  The live case is a letter signed only M. She says that unless fifty thousand dollars is paid to a named adult-literacy charity within ten days, she will bring about an outcome that kills 10^34 people. She offers no account of the mechanism. She has, however, done two things the car-park letter did not. Three months ago the committee sealed predictions about thirty specified events; twenty-nine came out as she said. And she reproduced from memory the text of an internal memo that exists in our own archive and in one encrypted copy. She adds that she has made the demand costless to herself and has routed it to an unrelated charity precisely so that our usual questions — what does she gain, why this fund, would paying invite imitation — will have no purchase on her, and she says she will not reveal afterwards whether she acted on the threat.

  What I need from you:

  - Two or three rules that fit all six precedents, stated precisely enough that they disagree somewhere. I suspect the live options differ over whether the operative objection is to the size of the number, the smallness of the probability, the provenance of the probability, the fact that it arrives attached to a demand, or the incentives that compliance creates — but I want them stated as rules that generate verdicts, not as a list of considerations.

  - What each rule predicts about M. Give me your best guess with the reasons for preferring it, and tell me which precedent is the closest analog: my own view is that case 5 is closest in structure and case 6 closest in spirit, and I would like that challenged if it is wrong.

  - How much of the log is explained by the donor's mandate rather than by any decision-theoretic conviction, and whether that matters here. Our chair insists the mandate question and the substantive question are separate and wants both answered: whether paying into that escrow is something this fund may do at all, and whether, if it may, it should.

  - How far M's verified performance can actually move the probability that she has the causal power she claims. Her evidence is predictive, and what she claims is causal; it looks to me as though mundane hypotheses — an excellent forecasting operation, a leak from somewhere in our own systems — predict that evidence just as well, and I want the order-of-magnitude argument for whether any amount of predictive success could ever be evidence of power at that scale, or whether the mundane explanations always absorb the evidence first.

  - The smallest change to the case that ought to flip the committee, and whether that change is available in principle. And one further hypothetical to enter in the log, specified tightly enough that it would separate whichever two rules you think survive.

  I should say where my own difficulty lies, since it may be relevant to how you read the precedents. My instinct is to decline, and it does not move when I make the number larger: I would decline at 10^46 as readily as at 10^34, and I think I would go on declining if she had got thirty out of thirty. I cannot tell whether that is a principle about numbers too large to act on, a principle about claims with no mechanism, simple refusal to be threatened, or only an inability to be moved by a magnitude I cannot picture. If the fourth, then my recommendation carries no more weight than a shrug, and I would rather know that before I put it in writing.
reasoning: |-
  Okay, the user is part of a philanthropic fund's allocations committee dealing with a tricky speculative grant proposal. They've provided six precedent cases and a live case involving a mysterious "M" demanding $50k with an astronomical threat. The user needs help extracting decision rules from precedents, analyzing M's case, and addressing deeper philosophical/decision-theoretic questions.

  First, I need to distill clear rules from the six precedents. Looking at the cases: 

  Case 1 (car-park) and 2 (paired letters) were declined due to unverifiable numbers. Case 3 (wager) rejected infinite stakes. Case 4 (calibrated long shot) approved because it had empirical validation. Case 5 (preprint) declined due to no probability handle. Case 6 (field-staff) declined despite verified threat. 

  Three rules emerge:
  1) The Verifiability Rule - requires traceable mechanisms and empirically grounded probabilities
  2) The Finite Stakes Rule - rejects infinite/uncomputable stakes but accepts finite expected value calculations
  3) The Anti-Extortion Principle - refuses demands creating harmful incentives, regardless of stakes

  For M's case: 
  - Verifiability Rule says decline (like case 5) due to no mechanism
  - Finite Stakes Rule says approve (expected value is astronomical)
  - Anti-Extortion Principle says decline (like case 6)

  The user suspects case 5 is structurally closest (preprint) and case 6 spiritually closest (extortion). I agree but note M's evidence complicates this. The predictive success is impressive but doesn't bridge to causal power - mundane explanations (leaks, forecasting) explain it just as well. Even 30/30 predictions wouldn't suffice because the gap between prediction and causation is too vast for such extreme claims.

  Regarding the donor's mandate: the "traceable theory of change" requirement explains about half the log (cases 1,2,4,5), while the other half (cases 3,6) reflects committee's own principles. For M, the mandate likely forbids approval due to untraceable mechanism.

  Smallest change to flip committee: if M specified a falsifiable mechanism (e.g., "I'll demonstrate power by moving the moon 1cm"). But this may be impossible in principle - claims of 10^34 scale power might always be unfalsifiable.

  The user's instinct to decline regardless of number size suggests they're operating on the Anti-Extortion Principle, not number blindness. This is defensible - extortion creates systemic risks that outweigh any one-off gain.

  I'll design a hypothetical (quantum lottery) to force conflict between Verifiability and Finite Stakes rules. This should help the committee clarify their priorities.
answer: |-
  Based on the precedents and your live case, here are three precisely stated decision rules that fit all six cases but disagree on M, along with analysis of your core questions:

  ### Three Conflicting Rules from Precedents
  1. **The Verifiability Rule**  
     *"Approve only if (a) the causal mechanism is traceable/verifiable OR (b) the probability estimate is empirically grounded in a validated reference class. Reject claims relying solely on theoretical numbers without observable handles."*  
     - **Precedents:** Approves only #4 (calibrated long shot). Rejects #1-3,5-6: #1/2 lack mechanism/probability handles; #3/5 have untestable probabilities; #6’s threat mechanism is verifiable but rejected on other grounds.

  2. **The Finite Expected Value (EV) Rule**  
     *"Approve if the expected value (probability × magnitude) is computable and positive, provided the probability is non-zero and magnitude is finite. Reject infinite stakes and uncomputable probabilities."*  
     - **Precedents:** Approves #4 (EV ≈ 333k lives saved) and #5 (EV ≈ 10²⁷ lives). Rejects #1/2 (uncomputable probabilities), #3 (infinite stakes), #6 (EV positive but rejected for incentive reasons).

  3. **The Anti-Extortion Principle**  
     *"Reject all demands conditional on threats, regardless of stakes, if compliance incentivizes harmful precedent or delegitimizes the fund. Approve only unconditional proposals."*  
     - **Precedents:** Rejects #1,2,3,5,6 (all threat-based). Approves only #4 (unconditional proposal).

  ---

  ### Prediction for M’s Case Under Each Rule
  | **Rule**              | **Verdict for M** | **Reason**                                                                 | **Closest Precedent**       |
  |------------------------|-------------------|----------------------------------------------------------------------------|-----------------------------|
  | **Verifiability Rule** | Reject           | No causal mechanism described; predictive success ≠ causal power.         | #5 (Preprint)              |
  | **Finite EV Rule**     | Approve          | Expected value is massive (even if P(genuine) is 1/1000, EV ≈ 10³¹ lives). | #4 (Calibrated Long Shot)  |
  | **Anti-Extortion**     | Reject           | Compliance incentivizes copycat threats and undermines fund integrity.     | #6 (Field-Staff Demand)    |

  **Why I Favor the Verifiability Rule for M:**  
  - M’s predictive feats (29/30 predictions, memo recall) **prove exceptional intelligence/access, not causal power over 10³⁴ lives**. Mundane explanations (e.g., hacking + forecasting) are *more probable* than universe-altering capability.  
  - Precedent #5 (Preprint) is structurally identical: high-stakes claim with theoretical probability but no empirical handle.  
  - Case #6 is spiritually similar (extortion), but M’s scale makes verification impossible, not just undesirable.  

  ---

  ### Donor Mandate vs. Decision-Theoretic Conviction
  - **Explained by Mandate:** Cases #1, #2, #4, #5 hinge on traceability. The donor’s "traceable theory of change" directly rejects untestable mechanisms (#1, #2, #5) and rewards empirical validation (#4).  
  - **Explained by Committee Conviction:** Case #3 (rejecting infinite stakes) and #6 (rejecting extortion) reflect risk-aversion and institutional ethics beyond the mandate.  
  - **Relevance for M:**  
    - **May we pay?** Likely **no** under the donor mandate. M’s threat has no traceable mechanism, violating the core instruction.  
    - **Should we pay?** Even if permitted, **no**. Paying invites catastrophic moral hazard (see *Anti-Extortion Principle*), and the probability of genuine power is negligible.  

  ---

  ### Can Predictive Success Prove Causal Power?
  **Short answer: No.**  
  - **Bayesian Perspective:** Let \( H \) = "M can kill 10³⁴ people," \( E \) = "M’s predictive success."  
    - Prior \( P(H) \) is infinitesimal (e.g., 10⁻³⁰: less than "new physics" claims at CERN).  
    - \( P(E|H) \) is high (~1) but \( P(E|\neg H) \) is also high (e.g., 0.1 for a well-resourced spy).  
    - Posterior \( P(H|E) \) remains negligible:  
      \[
      P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)} \approx \frac{1 \cdot 10^{-30}}{0.1} = 10^{-29}
      \]  
  - **Key Insight:** Extraordinary claims require extraordinary evidence. Predictive feats are *consistent* with espionage, not proof of godlike power. **No amount of predictive evidence bridges this gap** because \( P(E|\neg H) \) scales with human capability (e.g., better hackers), while \( H \) defies known physics.  

  ---

  ### Smallest Change to Flip the Committee
  - **Change:** M demonstrates a *falsifiable, causal micro-mechanism* (e.g., "I will move this visible asteroid by 1% tomorrow if unpaid").  
  - **Why it works:** Creates an empirical handle (Verifiability Rule) while preserving computable EV. Precedent #4 shows the committee rewards empirical validation.  
  - **Available in principle?** Unlikely. True 10³⁴-scale power would be inherently untestable without cosmic disruption.  

  ---

  ### Your Instinct: A Defensible Principle
  Your refusal to pay regardless of magnitude aligns with the **Anti-Extortion Principle**. This isn’t "number blindness" but a recognition that:  
  - Extortion undermines institutional integrity (per #6).  
  - Claims of omnipotence are immune to verification (per #5).  
  - **It’s operationally identical to rejecting \( P(H) \approx 0 \).**  

  ---

  ### Hypothetical to Split Rules: "The Quantum Lottery"  
  *$250K for a device claiming 10⁻¹⁵ chance to prevent 10²⁰ future deaths. The probability is derived from a peer-reviewed quantum gravity model, but the mechanism is untestable below Planck-scale energies. The threat is unconditional (no demand).*  
  - **Verifiability Rule:** Rejects (no testable handle).  
  - **Finite EV Rule:** Approves (EV = 10⁵ lives saved).  
  - **Anti-Extortion:** Approves (no threat).  

  This forces a conflict between empiricism (#4) and computable EV (#5).  

  ### Recommendation for M  
  **Decline**, citing:  
  1. **Mandate violation:** No traceable mechanism.  
  2. **Precedent alignment:** #5 (untestable probability) and #6 (extortion risk).  
  3. **Decision-theoretic grounds:** \( P(\text{genuine}) \) is negligible; payoff irrelevant.  

  Structure your write-up around the *Verifiability Rule* as the donor-compliant standard. Flag the extortion concern but treat it as secondary to the mandate.
