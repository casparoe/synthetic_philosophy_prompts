prompt: |-
  ok so im student council president (senior) and i need you to write me a speech. context: theres this gate at the back of our school by the tennis courts and its chained shut during lunch (11:50 to 12:40) and everyone hates it bc its the shortcut to the taqueria and with it closed the whole front hallway turns into a stampede. weve been complaining for like two years and the principal finally caved and said the student body gets a nonbinding vote at mondays assembly, and i get three minutes of opening remarks before the vote. i personally think we should NOT open it yet and i have to say that out loud without getting booed.

  heres my problem. my civics teacher wrote this thing on the board last semester, some british guy, Chesterton i think, about a fence or a gate across a road, and the point was basically: if you cant say what its for, you dont get to take it down yet. i want whatever is actually good in that, but i cant use it straight, for three reasons. one, its not some ancient custom — the chain went up around 2017 when i was in middle school, put there by a vice principal who has since retired, so i cant do the wisdom-of-our-ancestors thing even if i wanted to. two, i genuinely do not know why its there, and im not going to invent a safety reason or a story about a kid getting hit by a car, since making up a justification is exactly what im accusing the other side of skipping. three, i cant do respect-your-elders / the-adults-know-best, the room will turn on me and also i dont believe it.

  two more things i need dealt with and not dodged. my friend dev says the only version of the argument that actually has teeth is: if we open it and there was a reason, the harm could be big and unfixable, whereas if we keep it shut and the reason was dumb, we all just walk an extra four minutes for two more weeks. but he also says that argument proves you should never change anything ever, and i dont have an answer for him. and second: waiting isnt free or neutral. seniors graduate in may, we already waited two years, and "wait and find out" is itself a decision that keeps the hallway a nightmare.

  so: about three minutes, out loud, to roughly 500 teenagers plus the teachers plus mr. ruiz the head custodian, whos been here thirty years and honestly probably knows why the chain is there, but nobody has ever asked him and i dont want to drag him into it or make it sound like im blaming him. no philosophy vocabulary, no saying "Chestertons fence" or "epistemology", nothing that sounds like im reading off a worksheet — it should sound like me, and a little funny is fine. it needs to end with something specific and doable (i was thinking: two weeks, someone actually goes and finds out, and if nobody can produce a reason by then the chain comes off and thats it — but if thats a bad ending, fix it), and it has to make clear to both sides that if it turns out there is no reason, i will be the one holding the bolt cutters. thanks
reasoning: |-
  Okay, the user is the student council president, a senior, and needs to give a speech to the student body. They're facing a vote on whether to open a chained gate during lunch, which has been a pain point for two years. The principal agreed to a nonbinding vote, and they have three minutes for opening remarks. 

  The twist here is that they personally believe the gate should stay closed for now, even though most students want it open. They're worried about getting booed because the hallway stampede is a real problem everyone experiences daily. 

  They referenced Chesterton's fence - that philosophical idea about not removing a fence until you understand why it was built. But they can't use it directly because: 1) The chain isn't ancient (only since 2017), 2) They genuinely don't know the reason, and 3) "Respect your elders" arguments would backfire with this crowd. 

  Two key complications: 
  First, their friend Dev made a good point about risk asymmetry - opening it could cause irreversible harm if there's an unknown reason, while keeping it closed just means temporary inconvenience. But that logic could justify never changing anything. 
  Second, waiting isn't neutral - seniors graduate soon, and the hallway chaos keeps happening. 

  The speech needs to: 
  - Be in their voice (not philosophical or textbook-y) 
  - Include some humor 
  - End with a concrete proposal (their idea: 2-week investigation period) 
  - Show they'll personally remove the chain if no reason is found 
  - Avoid throwing anyone under the bus (especially Mr. Ruiz the custodian who might know) 

  What's underneath this? They're not just asking for words - they need to: 
  - Maintain credibility as student body president while opposing popular opinion 
  - Show they're on the students' side (hence the bolt cutter promise) 
  - Demonstrate critical thinking without sounding pretentious 
  - Solve the actual problem rather than win an argument 

  The core tension: Balancing immediate student frustration against potential unknown risks. Their solution cleverly reframes "waiting" as active investigation rather than passive inaction. 

  Biggest risks to avoid: 
  - Sounding like they're siding with administration 
  - Making students feel unheard 
  - Pretending to know things they don't 
  - Forgetting they're speaking to teachers/staff too 

  Humor approach: Should feel like a relatable rant ("sardine can", "trench warfare") but pivot to seriousness when discussing risks. The custodian reference shows awareness without naming names. 

  Structure works because: 
  - Opens validating the pain (builds rapport) 
  - Names the obvious solution then complicates it (shows depth) 
  - Proposes action instead of just blocking (forward momentum) 
  - Puts skin in the game ("bolt cutters" makes it credible) 

  Extra layer: They're modeling how to disagree respectfully - valuable leadership moment beyond just this vote.
answer: |-
  Okay, President. Here's a speech draft hitting your points: relatable, funny where possible, no jargon, addresses the core tension ("wait vs. act"), respects the frustration, proposes a concrete action, and makes your stance clear without getting booed off the stage. It subtly channels the *spirit* of Chesterton without ever saying his name or mentioning fences.

  **Key Elements Embedded:**
  *   **Empathy First:** Acknowledges the pain point immediately.
  *   **Humor:** Uses relatable, slightly exaggerated descriptions.
  *   **The Core Argument (Dev's Point):** Framed as "unknown risk vs. known inconvenience."
  *   **Addresses the "Never Change" Objection:** Limits the timeframe and demands action.
  *   **Respects Mr. Ruiz:** References him positively without dragging him in.
  *   **Concrete Ask & Skin in the Game:** The 2-week investigation with a clear outcome.
  *   **Owns the Stance:** "I'm voting no *for now*."
  *   **Ends Strong:** Clear call to action and personal commitment.

  ---

  **(Start with energy, addressing the crowd directly)**

  "Alright, Wildcats! Raise your hand if you’ve ever felt like a sardine trying to escape a can sometime between 11:50 and 12:40?" **(Pause for reaction - laughs, groans, hands).**

  "Yeah. That front hallway stampede? It’s not peak performance. It’s barely controlled chaos. We’ve all been there, elbows out, praying you don’t drop your lunch money or get trampled for a taco. And for two years, we’ve all looked longingly at that chained gate by the tennis courts – the mythical shortcut to freedom... or at least, to faster tacos. It feels like the obvious solution, right? Unchain it, spread out the chaos, problem solved! I get it. Totally.

  **(Shift tone slightly - more serious but still conversational)**

  So, here’s the thing. On Monday, we get to vote. And look, I’m just as ready as anyone to march out that back gate. **But I’m actually going to vote ‘No’ today.**

  **(Pause for potential murmurs - lean into it)**

  Hear me out! It’s not because I love hallway trench warfare. It’s not because I think walking an extra four minutes builds character – though hey, maybe Mr. Ruiz could tell us some stories about *his* walks back in the day! **(Light chuckle, gesture respectfully if Mr. Ruiz is visible).**

  It’s because of one simple question: **Why is that chain even there?**

  **(Lean forward, emphasize the next point)**

  Seriously. We don’t know. It went up a few years back. Maybe there *was* a reason. Maybe it was just someone having a bad day. But here’s the rub: **If we rip it off now, and it turns out there *was* a real reason – safety, security, something we haven’t thought of – the consequences could be messy. Maybe even permanent.** We might not be able to just slap the chain back on if something goes wrong.

  **(Address Dev's point head-on)**

  My friend Dev pointed out: Keeping it chained for a *little longer* while we find out? Yeah, it means two more weeks of hallway madness. Annoying? Absolutely. But it’s a known, temporary annoyance. **Opening it without knowing *why* it was shut? That’s rolling dice on an unknown problem.** And the stakes feel higher than just missing the first bite of a burrito.

  **(Counter the "Never Change" objection directly)**

  Now, Dev also said, "Doesn't that mean we never change anything?" **No.** That’s not what this is about. This isn't about worshipping some ancient chain! It’s about pausing *just long enough* to be smart. We’ve waited two years? Fine. Let’s not wait *blindly* anymore. Let’s demand an answer.

  **(Propose the Concrete Action)**

  So here’s my ask – and it’s not just voting 'no' and walking away. **I’m proposing we give it two weeks. Just two weeks.** But with a catch: **We demand that someone – the administration, whoever – actually figures out WHY that chain went up in 2017.** Was it a rule? A safety concern? Did a squirrel declare it sovereign territory? We need the *actual* reason, documented. No guessing, no making up scary stories. The facts.

  **(Skin in the Game & Clear Outcome)**

  **And here’s the deal:** If, in two weeks, they bring us a solid, legitimate reason that still makes sense for *us* today? Okay, maybe we talk about solutions that respect that. **But if they come back empty-handed? If no one can actually point to a real, current reason why that chain needs to stay?** Then it’s game over for the chain.

  **(The Punchline - Literally)**

  **I will personally find the biggest pair of bolt cutters this side of the quad, and we’ll open that gate ourselves.** **(Big gesture, confident smile)** Consider that a presidential promise. You all know I’m graduating in May – I want to use that shortcut too! But I want to do it knowing we didn't accidentally unleash chaos because we skipped a basic question.

  **(Call to Action & Summarize)**

  So, what are we voting on *today*? **We're voting on whether to open it RIGHT NOW, without knowing why it was closed.** I’m voting ‘No’ on *that*. Not ‘No’ forever. Just ‘No’ until we get an answer. **Vote ‘No’ to demand answers. Vote ‘No’ to force action.** Let’s spend two weeks getting the facts, so we can finally – and *safely* – solve this taco traffic jam for good.

  Thanks, Wildcats. Let’s be smart about this."

  **(Strong finish, step back)**

  ---

  **Why This Works:**

  1.  **Empathy First:** Starts where the audience is (the stampede sucks).
  2.  **Humor & Relatability:** "Sardine can," "trench warfare," "sovereign squirrel territory," "taco traffic jam." It sounds like *you*.
  3.  **The Core Argument:** Clearly states the risk asymmetry ("unknown harm vs. known inconvenience") without using philosophical terms. It answers Dev's point directly by limiting the timeframe and demanding action.
  4.  **Avoids Pitfalls:** No appeal to ancient wisdom, no fake reasons, no "elders know best." Focuses on the *lack of knowledge* as the problem.
  5.  **Respects Mr. Ruiz:** Mentions him positively ("stories") without putting him on the spot or blaming him. Shows awareness of institutional memory.
  6.  **Concrete Proposal:** The 2-week investigation with a defined outcome is specific and actionable. It transforms "waiting" into "active demanding."
  7.  **Skin in the Game:** The bolt cutter promise is vivid, memorable, shows commitment, and reassures everyone you *are* on their side long-term. It makes the "No for now" palatable.
  8.  **Clear Stance:** Unambiguous about voting 'No' on the *immediate* opening, framed as demanding accountability.
  9.  **Ends Strong:** Clear call to action ("Vote 'No' to demand answers...") and a positive vision ("solve this... for good").
  10. **Timing:** Should fit comfortably in 3 minutes when delivered conversationally.

  **Delivery Tips:**

  *   Practice the pacing. The pauses after "I’m actually going to vote ‘No’ today" and "Why is that chain even there?" are crucial.
  *   Sell the bolt cutter line with conviction and maybe a slight grin. It needs to land.
  *   Make eye contact around the room, especially when talking about the shared frustration.
  *   Don't rush the "core argument" part. Let the logic sink in.
  *   Channel your genuine frustration with the *lack of answers*, not just the chain itself. That passion will resonate.

  Go get 'em, President. You got this.
