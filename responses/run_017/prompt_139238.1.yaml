    - Without a common unit, the lack of a way to compare costs is similar to having non-commensurable loss terms.
  - **Bent/Idealized:** 
    - We assume that the only way to get a common unit is through market exchange. Mises's argument is that the exchange process (bidding) is necessary to reveal the true opportunity costs. Our translation takes the existence of a common unit (via prices) as necessary for decomposition, but does not argue why it must come from a market. We are importing the assumption that without a market there is no way to get such prices.
    - We are also assuming that the economy can be modeled as a convex optimization problem (for dual decomposition to work) which might not hold in reality (non-convexities, discontinuities, etc.).
  - **No Expression:** 
    - The concept of "higher-order goods" (capital goods) as distinct from consumer goods is not directly captured. In our optimization setup, we are treating all resources as inputs, but the original claim emphasizes that it's the absence of a market for capital goods (not consumer goods) that causes the issue.
    - The idea that the common unit must emerge from actual exchange (and not from an accounting scheme) is not directly represented in the vocabulary. We have a gap in expressing why a simulated price (like in Lange) would not work.

  **Required Assumptions Not in Framework:**
  - The translation requires that the common unit (price) must be grounded in actual exchange to reflect opportunity costs. Without this, the shadow prices are arbitrary and do not reflect the relative scarcity of resources.
  - It also requires that the optimization problem is such that without a common unit, no other mechanism (like a centralized solver) can compute the optimal allocation because of the incommensurability.

