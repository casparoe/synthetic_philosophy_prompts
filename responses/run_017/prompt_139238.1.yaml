  ### 3. Lange's Trial-and-Error Model

  **Original Claim:** A Central Planning Board (CPB) announces prices. Managers are instructed to minimize average cost and expand output until price equals marginal cost. The CPB then adjusts prices: raises prices for goods in excess demand and lowers for those in excess supply. This repeats until convergence. The retrospective gloss is that a large computer could run the iteration fast enough so that the delay doesn't matter.

  **Translation:**
  This is an iterative distributed optimization algorithm using dual decomposition. The CPB acts as a parameter server that holds the dual variables (prices). In each iteration:
  1. The CPB broadcasts the current prices (dual variables).
  2. Each manager (agent) solves a local optimization problem: minimize the shadow cost (price-weighted cost of inputs) subject to production constraints, and sets output such that the shadow marginal cost equals the price of the output (as per the CPB's instruction).
  3. The CPB observes the excess demand (the difference between the quantity supplied and the quantity demanded at the announced prices) for each good and adjusts the prices proportionally to the excess demand (like a gradient step in the dual space).
  4. The process repeats until the excess demand is near zero (convergence).

  The retrospective gloss says that with a fast enough computer (high iteration frequency) the system can converge before the underlying economic conditions change too much (minimizing distribution shift).

  **Residue Report:**
  - **Maps Cleanly:**
    - The iterative price adjustment is a dual decomposition method (e.g., dual ascent) where the dual variables (prices) are updated based on the constraint violation (excess demand).
    - The managers' local optimization is a standard response to shadow prices.
    - The idea of speeding up iteration to reduce delay is similar to using faster hardware to close the sim-to-real gap by reducing latency.
  - **Bent/Idealized:**
    - We assume that the managers are obedient and follow the rules exactly (minimize cost, set output where price equals marginal cost). In reality, without proper incentives (addressed in the user's proposal) they might not.
    - The convergence of the dual decomposition algorithm requires convexity and other technical conditions. The economy might not be convex, leading to oscillation or divergence.
    - The model assumes that the CPB can observe the excess demand accurately. In practice, this requires a massive amount of real-time data collection, which might not be feasible (a Hayekian point).
  - **No Expression:**
    - The model does not specify how the CPB knows the demand function for consumer goods (which are in a market). Lange assumes the CPB can observe excess demand, but in a consumer goods market, the demand comes from consumers. The translation does not model how the consumer demand is aggregated and reported to the CPB.

  **Required Assumptions Not in Framework:**
  - The algorithm assumes convexity of the production sets and concavity of the utility functions for convergence.
  - It assumes that the CPB can accurately measure the excess demand for every good in the economy at each iteration.
  - It assumes that the managers are perfectly compliant with the instructions.

