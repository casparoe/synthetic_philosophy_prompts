  ### 1. Mises's Claim

  **Original Claim:** Without markets in the means of production, there is no way to perform economic calculation. The difficulty is principled: without exchange of higher-order goods, there is no common unit to commensurate heterogeneous inputs, so we cannot tell which of two production plans is cheaper.

  **Translation:**
  In a distributed optimization setting, the problem is to minimize the total cost (or maximize efficiency) across the entire economy. The economy is a system with multiple agents (firms, managers) making decisions about resource allocation (inputs) to produce outputs. Without a market for capital goods, we lack a mechanism to assign a common cardinal value (price) to each input. This is equivalent to having a distributed optimization problem without a shared loss function that can be decomposed into additive terms over resources. Without prices, we cannot compute the shadow costs of resources, and thus we cannot perform dual decomposition to coordinate the agents. Each agent's local cost function is incommensurable with others because they are in different units (or no units at all). Therefore, we cannot compare two production plans because we cannot aggregate their costs into a single scalar.

