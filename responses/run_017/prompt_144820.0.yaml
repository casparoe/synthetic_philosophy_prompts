  - Reliability: the degree to which the report correlates with the internal state (or with some ground truth that the state is supposed to represent). However, without ground truth for the state, we can only measure reliability indirectly (e.g., by the report's consistency with behavior or with external facts).
  - Privileged access: in the ML framework, this would mean that the model's own readout channel (the verbal report) is more accurate than an external probe at reading the internal state. However, if the interpreter has full access to weights and activations, then the interpreter can in principle build a more accurate probe than the model's own readout. So "privileged" might only mean that the model's readout is the one that is used for generating behavior, but it is not necessarily more accurate.

  Ground truth for reliability: In ML interpretability, we often use proxy tasks. For example, if we want to know if the model's report about its belief is reliable, we might compare it to the model's behavior (e.g., if the model says it believes p, does it act as if p is true?) or to external facts (if p is about the world). But for subjective states (like the richness of a perceptual experience) we have no ground truth. We can only look at consistency across reports or with neural data in humans, but in models we have the activations. However, the activations are not inherently labeled as to what they represent. We might use techniques like probing to see if the state contains information about a particular feature, but that requires labels.

  C. Which positions can the framework formulate?

  The framework can formulate all three positions because they are about the relationship between the internal state and the report. The positions are distinguished by the nature of the readout channel and the reliability of the report.

  D. Residue report:

  1. Inner-sense translation:
     - Clean? Mostly clean. We have a readout that is a function of the state. It is noisy and biased (lossy) and we can set up experiments to measure its reliability by comparing the report to the state (if we can interpret the state) or to behavior. However, the framework does not have a natural way to isolate "current conscious goings-on" from the rest of the state. We can define a subset of the state that we care about (e.g., activations at the last layer at the current token) but that might not align with the philosophical notion. Also, the framework does not have a notion of "consciousness". So we have to fudge by defining a subset of the state that we consider the object of introspection. Distorted? Yes, because we must define the relevant state arbitrarily.

     Label: **Distorted** because we have to arbitrarily define what part of the state is being reported (the "conscious goings-on") and we cannot capture the qualitative aspect.

  2. Transparency / agential:
     - Translation: The report is generated by the same process that forms the state. The act of reporting is part of the deliberation. This might involve measurement back-action: the CoT generation changes the state. The report is not a readout of a pre-existing state but the result of a computation that may create the state. The framework can capture this by considering that the CoT tokens are generated by the model and then used as context for further tokens, thus changing the state. The reliability is about whether the deliberation is correct (which we can check against world facts). The gap between probe accuracy and access: the model does not have a pre-existing representation of the belief until it is computed on the fly.

     However, the notion of "authority" and "being the one who has to answer" is not captured. We can say the model is the one generating the report, but the framework does not have a concept of agency. The framework can capture the causal structure: the report is generated by the same parameters that are used in the deliberation. 

     Label: **Distorted** because the concepts of "authority" and "deliberative responsibility" do not translate. We can only capture the computational structure.

  3. Harsher skepticism:
     - The readout channel is so bad that it often invents content (confabulation). This can be due to the readout function being a poor approximator or because the state does not even contain the information. We can test this by training probes on the state to see if the information is present (if the probe can't get it, then the state doesn't have it). The report might be generated by a process that is not grounded in the state (like a hallucination). The framework can capture this by showing that the report does not correlate with the state and that the state does not contain the reported information (as measured by an external probe). However, for subjective experiences, we lack ground truth. The framework can simulate experiments by creating situations where we know the state (because we control the input) and then check the report.

     Label: **Clean** for the confabulation part (if we have ground truth for what the state should be). But without ground truth for subjective states, we cannot fully validate. However, the framework provides a way to test the hypothesis by having full access to the state. So it is clean in principle, but in practice, without knowing what the state represents, it might be hard.

  E. Stress-testing two ideas:

  1. Distinction between channel noise and content invention:

     In the framework:
     - Channel noise: the state contains the content, but the readout function is imperfect (e.g., a linear probe might not capture all the information, or there is noise in the readout). We can measure this by training a probe on the state with labels (if we have them) and seeing that the probe can achieve high accuracy, but the model's own report does not.
     - Content invention: the state does not contain the content at all, but the readout function produces an output anyway (like a hallucination). We can measure by showing that even an ideal probe (with access to the state) cannot recover the reported content.

     This is a real distinction in the framework because we can operationalize it by having access to the state and by using probes. However, in practice, without labels, we cannot tell if the state contains the information. But if we have labels (from the world) we can see if the state contains the information (via a probe) and then compare to the model's report.

     The moderate skeptics (inner-sense) would be talking about channel noise, while the harsh skeptics would be talking about content invention. So the distinction holds.

  2. Report-conditioned states:

     In CoT, generating the report (the intermediate steps) changes the state. This is an intervention: the report is not just describing the state but is part of the computation. The state at the next step depends on the report. 

     For the agential view: they should love this because the report is not a passive readout but an active part of the deliberation. The model is settling what to think by generating the CoT. The authority comes from the fact that the model is the one generating the report as part of its decision process. 

     However, the framework does not have agency. The agential view in philosophy is tied to concepts of rationality and responsibility. The ML framework only captures the causal structure: the report is an intermediate computation that affects the next state. It does not capture the normative aspect (entitlement, answerability). So the agential view is partially captured: we get the intervention part but not the authority.

     It does not wreck the view; it supports the idea that the report is not a mere measurement. But the framework cannot capture the normative residue (authority, entitlement).

