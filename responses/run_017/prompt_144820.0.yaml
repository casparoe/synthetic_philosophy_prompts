  - What-it's-like-ness (qualia): no expression. The framework only deals with information processing.
  - The difference between reliability and authority: the framework can measure reliability (correlation between report and state or world), but authority is a normative concept (the system is entitled to issue reports and is answerable for them). The framework cannot express normativity.
  - Privileged access: in the ML framework, if the interpreter has full access to the weights and activations, then the model's own report has no privileged status in terms of accuracy. However, the model's report might be the one that drives behavior, so it has a causal privilege. But the interpreter can always build a better probe. So "privileged" in the sense of privacy or superior accuracy does not survive. The framework goes silent on the first-person perspective that underlies the philosophical notion of privileged access.

