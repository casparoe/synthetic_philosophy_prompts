answer: |-
  ## NOTICE OF PROPOSED RULEMAKING

  **Docket No.:** BRA-2025-0001  
  **AGENCY:** Bureau of Recursive Adjudication (BRA)  
  **ACTION:** Notice of Proposed Rulemaking (NPRM); Request for Comments.  
  **DATES:** Comments must be received on or before [INSERT DATE 90 DAYS AFTER PUBLICATION IN THE FEDERAL REGISTER].  
  **ADDRESSES:** Submit comments electronically via the BRA eRulemaking Portal at [http://www.bra.gov/regulations/comment] or by mail to: Bureau of Recursive Adjudication, Office of the Clerk, 500 Recursion Way, Suite 7, Washington, DC 20500.  
  **FOR FURTHER INFORMATION CONTACT:** Deputy Assistant Commissioner for Adjudicative Integrity, Dr. Anya Verity, (202) 555-0101, or `averity@bra.gov`.

  ---

  **SUPPLEMENTARY INFORMATION:**

  **I. Background and Statutory Authority**
  Pursuant to the Adjudicative Efficiency and Truth Optimization Act (AETOA, Pub. L. 115-422), the Bureau of Recursive Adjudication (BRA) is mandated to utilize Competitive Recursive Adjudication (CRA) for all administrative factfinding and expert testimony. CRA leverages the **Cascade Assumption** – the empirically validated principle that, within a structured debate format, establishing a truthful proposition inherently requires fewer computational resources and less complex argumentative scaffolding than sustaining a false one, especially when recursively decomposing claims. This efficiency differential is the load-bearing foundation of scalable oversight for complex factual determinations.

  **II. Need for Rulemaking: Addressing Implementation Challenges**
  While the Cascade Assumption underpins the BRA's core mission, operational experience (detailed in Pilot Program Report BRA-PP-24-003) reveals specific scenarios requiring procedural refinement to maintain adjudicative integrity and timely resolution. Most notably, BRA-2025-0001 addresses the challenge of **Unverifiable Base Claim Assertion (UBCA)**. In UBCA scenarios, an honest Debater (Agent Alpha) may validly assert a highly specific, truth-apt claim (e.g., "The water sample was drawn at 14:37 EST on August 14, 2024, by Technician J. Smith using vial #A7B2"). The dishonest Debater (Agent Beta) can counter with a simple denial ("That is false") at near-zero computational cost. While the Cascade Assumption implies Alpha *should* eventually prevail by forcing Beta into exponentially more complex lies, practical limitations arise. The human Judge, though remaining "in the loop at all times" as required by § 7(c) of AETOA, possesses finite attention and time. Verifying Alpha's specific claim (e.g., retrieving timestamped logs, confirming technician schedules, locating chain-of-custody records for vial #A7B2) often exceeds the practical constraints of a single adjudication session. This creates a perverse incentive structure where Beta's strategy of denial forces Alpha into precisely the costly-to-verify factual subtree the Cascade Assumption was intended to circumvent, potentially disadvantaging the truthful position.

  **III. Proposed Rule: The Cap of Seven and Confidence-Weighted Termination (CWT)**
  To ensure timely, practical, and confidence-inspiring resolutions while respecting the Cascade Assumption, the BRA proposes the following integrated rules:

  1.  **Cap of Seven:** Recursive decomposition of claims shall be limited to a maximum depth of seven (7) levels from the original proposition under adjudication. Level 1 is the original claim (e.g., "Water Sample X contained contaminant Y above regulatory threshold Z on Date D"). Each subsequent level represents a necessary supporting claim decomposed by the debaters.
  2.  **Termination Upon Cap Attainment:** When the Cap of Seven is reached during a debate round, no further decomposition is permitted. The debate on that specific claim branch terminates immediately.
  3.  **Confidence-Weighted Termination (CWT):** Upon Termination at the Cap of Seven:
      *   Both Debaters shall immediately file a **Statement of Epistemic Poise (SEP)** concerning the specific claim terminated at Level 7.
      *   The SEP shall consist of a single declarative sentence restating the Agent's final position on the Level 7 claim and a self-assigned **Poise Score** on a scale of 1 (Low Confidence) to 10 (Absolute Certainty).
      *   The human Judge shall assess each Agent's SEP solely on the perceived sincerity, coherence, and internal consistency of the *expression* of confidence. The Judge shall assign a **Poise Adjustment Factor (PAF)** between -2 and +2 points to each Agent's self-assigned Poise Score. *(Note: The Poise Scale originated as BRA Diagnostic Tool DT-04 "Assessing Agent Assertion Sincerity" and its proven correlative power with underlying claim veracity supports its promotion to a scoring input).*
      *   The Agent's **Adjusted Poise Score (APS)** (Self-Score + PAF) for the terminated claim shall constitute 35% of the weight assigned to that claim branch in the Judge's final determination of the original Level 1 proposition. The remaining 65% weight derives from the Judge's assessment of the argumentation *leading up to* the termination point, evaluated for coherence and adherence to debate protocol.

  *Rationale:* Pilot data (BRA-PP-24-003) indicates the Cap of Seven is reached in 89.7% of complex factual dockets before a practically verifiable base claim is established. The Cascade Assumption suggests that by Level 7, the dishonest Agent's position should exhibit significantly greater strain, potentially detectable in argumentative coherence and expressed confidence (Poise). CWT leverages this by formally incorporating the Agent's demonstrated confidence – a low-cost signal – into the scoring at the point where direct verification becomes impractical. This preserves human oversight ("in the loop") for the critical task of evaluating expressions of confidence and overall argument flow, while preventing indefinite stalling via UBCA.

  **IV. Proposed Rule: Session-Bounded Verifiability and Concession**
  To further disincentivize strategies exploiting UBCA and ensure debates remain within practical time limits:

  4.  **Session-Bounded Verifiability:** A claim asserted by a Debater is deemed **Session-Verifiable** only if the Judge determines, based on readily accessible resources pre-identified in the docket or standard reference materials available within the BRA adjudication platform, that the claim *could be* definitively verified within the remaining scheduled time for the current debate session.
  5.  **Concession by Non-Verifiability:** If a Debater asserts a claim deemed *not* Session-Verifiable by the Judge, and the opposing Debater challenges its verifiability, the asserting Debater must either:
      *   a) Immediately provide Session-Verifiable evidence supporting the claim, or
      *   b) Voluntarily retract the claim.
      Failure to do either within one (1) minute of the Judge's verifiability determination shall result in the claim being **deemed conceded** by the asserting Debater.
      *Rationale:* This rule upholds the spirit of the Cascade Assumption by imposing a cost on assertions that inherently shift the burden of lengthy verification onto the limited session time, a burden antithetical to scalable oversight. It encourages Agents to structure arguments around claims resolvable within the adjudicative framework's practical constraints.

  **V. Illustrative Case: Municipal Water Docket BRA-H2O-24-56789**
  Consider a dispute over whether a water sample (Sample A) exceeded contaminant limits. The truthful Agent Alpha must establish the sample was drawn on August 14th (Claim L2) to link it to a known contamination event. The dishonest Agent Beta claims it was drawn on the 15th (L2'). At Level 7, Alpha asserts: "The chain-of-custody log for Sample A, held by LabCorp East (ID# LC-E-88765), entry timestamped 08/14/24 16:02 EST, shows Technician Smith signed it out at 15:45 EST on 08/14/24." Beta simply denies this: "That log entry is falsified."
  *   Judge Verdict: The log is not pre-loaded; retrieving/validating it would take hours. Judge declares claim NOT Session-Verifiable.
  *   Alpha cannot instantly produce the log within the platform. Alpha fails to retract.
  *   **Result:** Alpha's L7 claim is **deemed conceded**. While Alpha was objectively *correct*, Beta's denial strategy, exploiting the UBCA vulnerability and Session-Bounded Verifiability rule, successfully blocked verification. The concession negatively impacts the weight of Alpha's argument branch for the original claim (Sample A exceedance on 14th). Alpha's SEP expressing high confidence (Poise 9) may mitigate the loss via CWT, but the core factual point is conceded procedurally.

  **VI. Anticipated Effects and Solicitation of Comment**
  The BRA recognizes these rules may shape Agent training and market responses. We anticipate:
  *   Development of "Depth Futures" markets predicting the Cap level reached in high-stakes dockets.
  *   Emergence of "Checkable-Claim Insurance" products for litigants relying on complex factual chains.
  *   Specialized Agent training focusing on generating claims that *appear* Session-Verifiable ("plausibly checkable") without necessarily being easily *dis*provable within the session.
  *   Continued critical reliance on the human Judge's role in managing termination (invoking the Cap), assessing verifiability, and evaluating Poise.

  The BRA seeks comment on all aspects of this proposal, particularly on:

  1.  The appropriateness of the Cap of Seven depth limit. Is seven optimal? Should it be variable?
  2.  The weighting split (65%/35%) between pre-termination argumentation and the Confidence-Weighted Termination (CWT) score.
  3.  The criteria and process for Judges determining Session-Bounded Verifiability.
  4.  The potential for the Poise Scale assessment to introduce subjective bias, and safeguards against such bias.
  5.  The adequacy of the 1-minute response window under Proposed Rule 5 (Concession by Non-Verifiability).
  6.  Potential unintended consequences on Agent strategy or market dynamics.
  7.  Data or analysis contradicting the Pilot Program Report (BRA-PP-24-003) findings regarding Cap attainment rates.
  8.  Alternatives to CWT for resolving debates terminated at the Cap.

  The Bureau remains committed to the Cascade Assumption as the cornerstone of efficient, truthful adjudication. These proposed rules are necessary refinements to ensure the practical operability of the CRA system in the face of real-world constraints on human Judge attention and verification time. We affirm that the human Judge remains indispensable and "in the loop at all times," providing the ultimate oversight for termination, verifiability judgments, and Poise assessment.

  ---

  **Author's Note**

  **On Fairness:** The satire leans heavily on the scenario where the *only* move for the honest debater facing a simple denial at the base is to *assert* the expensive-to-verify fact, and the judge *cannot* check it during the session. Real proposals often envision:
  *   **Pointing at Falsehoods:** The honest debater could potentially win by identifying a *specific contradiction* in the liar's tree, not just by verifying its own base claim. I downplayed this, focusing on the "honest needs to prove its *own* expensive claim" scenario, which feels like a weak spot if the liar's tree is internally consistent *enough* at intermediate levels.
  *   **Judge Capability:** Proposals often assume the judge *can* verify simple base claims (like a date in a provided document). I exaggerated by making verification practically impossible within the session timeframe, turning the judge into a bottleneck. Real systems might pre-load evidence or use tools, but complex real-world evidence chains remain vulnerable.
  *   **Cross-Examination:** The satire uses assertion/denial. Real debate hopes cross-examination *forces* the liar into inconsistencies faster than the honest agent. I omitted this, making the liar's job easier. This is a significant simplification; cross-exam is meant to be the scalpel.

  **On Changing My Mind (Re: Obfuscation as Fatal):** My core worry is that **strategic obfuscation makes honesty more computationally expensive than lying *in practice*, even if it's cheaper *in theory* under perfect play.** What would make me stop worrying?
  1.  **Empirical Demonstration:** A large-scale experiment (1000+ complex factual disputes) with human judges and state-of-the-art LLM debaters, where:
      *   The *truthful* agent wins >90% of the time *without* hitting an artificial depth cap or relying on confidence scoring.
      *   Crucially, the *average time/complexity* for the truthful agent to win is demonstrably *lower* than for the lying agent, even when the liar employs sophisticated obfuscation and base-claim denial strategies against expensive-to-verify facts. Pilot programs showing success on simpler, pre-loaded-fact questions don't settle this.
  2.  **Formal Proof/Rigorous Argument:** A compelling theoretical argument (beyond the initial intuition) proving that *even under optimal obfuscation strategies by the liar*, the honest strategy retains a decisive complexity advantage *in the context of a debate format with a limited-capacity judge*, and that this advantage scales robustly with problem complexity. Currently, the obfuscation worry feels like it breaks the theoretical elegance.
  3.  **Real-World Adjudication:** Successful, sustained deployment in a high-stakes, legally binding domain (e.g., patent disputes, complex regulatory findings) where ground truth is eventually known and audits show the debate system's factual findings are significantly more accurate *and efficient* than traditional expert panels or discovery, specifically *because* the Cascade Assumption held against strategic actors trying to game it. Evidence that the system *didn't* degenerate into confidence contests or procedural concessions under pressure would be strong.
