prompt: |-
  I'm writing the final for my upper-level seminar on evolution, computation, and mind — 15 students, in-class, 75 minutes, and they get the question sheet a week ahead so they can mull it over but write it cold. The spine of the course has been the two strange inversions of reasoning: Darwin's, where you stop explaining the fit between a creature and its world by a foresightful designer's reasons and instead get the fit from a foresight-free filter, so the reasons show up last, as an effect rather than a cause; and Turing's, where you stop explaining calculation by a mind that grasps what it's doing and instead get it from a mindless mechanism following rules, so comprehension comes last there too. Every single year I get the same essay back: Darwin showed design without a designer, Turing showed you don't need understanding to compute, so a mind is just a machine that evolution built, the end. My TA thinks I should be happy with that. I'm not.

  So here's the mess I've been circling and can't get right. I want to hand them a fake candidate's thesis — I've been calling it the Ratchet Principle — which runs roughly like this: the two inversions are literally the same argument, since in both cases you swap a reason-explanation for a mechanism-explanation; and once you've made both of them you get comprehension for free, because comprehensions are just what you get by strapping a lot of comprehension-free competences together and letting them ratchet, and understanding was never a glow, it was a competence that further competences can be built on. Mabye I should also give them a second half where the same candidate says that this is exactly why the Chinese Room misses the point. Then ask: what's right here, and where exactly does it break.

  The joint I actually want them to find is that the two inversions invert different things. Darwin's is an etiological point about where the fit comes from — how a competence can be reliably about something and serve an end without anybody entertaining that end — whereas Turing's is a point about execution, about how a mechanism can be reason-respecting step by step without being reason-responsive, without knowing why. And neither of those, nor the two together, obviously gives you comprehension out of competences, because stacking comprehension-free layers doesn't automatically make a comprehending whole. So they should have to say what the extra ingredient would even have to be (self-monitoring? being able to reuse or cite the reasons you're moved by? a history that fixes what your states are about?) and whether that ingredient is a legitimate crane or a skyhook with the serial numbers filed off. And they should have to face the switcheroo worry head on — that the Ratchet Principle only looks convincing because understanding has been quietly redefined as competence — so that the right answer isn't Dennett wins or Searle wins, it's locating which move is carrying the weight. Could you write me one essay question along those lines, doable in 75 minutes and 1200 to 1500 words, worth 20 marks total, plus a model answer of about 700 words and a marking scheme built around five must-hit points with the marks for each. One line per point on how people usually blow it, please — last year half the class just restated design-without-a-designer, a few answered by summarizing the Chinese Room as if that settled something, and one person wrote two pages saying it's all emergent. Keep it at the level of nameable moves rather than a reading list: a student who only has the course's own version of the two inversions should be able to score full marks without citing anybody, and the marks should seperate the ones who found the joint from the ones who memorized the slogans.
reasoning: |-
  Okay, let me tackle this professor's request. They're frustrated with students oversimplifying Darwin and Turing as "mind is just evolved machine" and want an exam question that forces deeper engagement. 

  Hmm, the core issue seems to be students conflating three distinct things: Darwin's etiological inversion (how function emerges without foresight), Turing's executional inversion (how rule-following works without comprehension), and the unresolved problem of how comprehension itself arises. The professor's "Ratchet Principle" strawman is clever - it exposes exactly this conflation by packaging it as a thesis.

  I need to design an essay question that:
  - Sets up the Ratchet Principle as a target
  - Forces students to disentangle the two inversions
  - Makes them confront why stacking competences ≠ comprehension
  - Requires identifying what's missing (intentionality? self-monitoring?)
  - Prevents rehashing old arguments like Chinese Room summaries

  For the model answer, I'll structure it around five key moves: 
  First, dissecting how Darwin's inversion solves "fit without foresight" through selection history. 
  Second, showing Turing solves "procedure without purpose" through syntactic engines. 
  Third, explaining why ratcheting competences doesn't automatically yield comprehension - maybe with a vivid analogy like "a clock made of smaller clocks still tells time without understanding time." 
  Fourth, analyzing where the Ratchet Principle smuggles in redefinition (competence ≠ understanding). 
  Fifth, sketching what real comprehension might require - perhaps "second-order competence" like monitoring internal states.

  The marking scheme should punish:
  - Conflating etiological and executional inversions (common mistake)
  - Accepting the Ratchet Principle at face value (trap)
  - Just rehashing Chinese Room without engaging the ratchet point (last year's fail)
  - Vague appeals to emergence (another common dodge)
  - Missing the bait in the question setup (professor said half did this)

  Word count is tight - model answer must demonstrate precision under 700 words. I'll make the question itself a compact thought-bomb: present the Ratchet thesis, demand critique, force the distinction, and require positive speculation about what's missing. The "switcheroo" warning about redefinition is crucial - that's where sharp students will shine.
answer: |-
  Here’s a comprehensive exam package designed to push students beyond superficial slogans and force engagement with the conceptual joints. It includes the question, a model answer, marking scheme, and common pitfalls.

  ---

  ### **Essay Question (20 marks total, 1200-1500 words)**  
  **Time Allowed:** 75 minutes  

  **Background:**  
  A hypothetical thesis ("The Ratchet Principle") claims:  
  > *“Darwin’s and Turing’s ‘strange inversions’ are the same argument: both replace reason-based explanations (design/understanding) with mechanism-based explanations (selection/computation). Once you accept both inversions, comprehension emerges automatically. Understanding isn’t a ‘glow’—it’s a competence built by ratcheting sub-competences that lack comprehension. This also dissolves the Chinese Room objection: the Room isn’t missing anything, because comprehension just is this ratcheting process.”*  

  **Your Task:**  
  Critically evaluate the Ratchet Principle. Address:  
  1. What *is* correct about linking Darwin’s and Turing’s inversions?  
  2. Precisely **where and why** the Ratchet Principle overreaches. Focus on:  
     - How Darwin’s inversion (etiological) and Turing’s inversion (executional) solve *distinct problems*.  
     - Why stacking comprehension-free competences does **not** obviously yield comprehension.  
  3. **Confront the switcheroo**: Does the Ratchet Principle covertly redefine "understanding" as "competence"? If so, how?  
  4. **Speculate constructively**: What *extra ingredient* (e.g., self-monitoring, reason-citing, historical embedding) might bridge comprehension-free competences to genuine comprehension? Is this ingredient a "crane" (naturalistic) or a "skyhook" (miraculous)?  

  *Write clearly. Name conceptual moves, not theorists. Use only core ideas from this course.*  

  ---

  ### **Model Answer (≈700 words)**  
  The Ratchet Principle identifies a *superficial* similarity between Darwin and Turing: both displace top-down "reason-first" explanations with bottom-up mechanistic ones. Darwin replaces a foresighted designer with natural selection, explaining organismic *fit* as an outcome of feedback processes without a goal. Turing replaces a comprehending mind with formal symbol manipulation, showing how *calculation* can occur without grasping meaning. Both invert explanatory order: reasons emerge *last*, as effects of mechanisms. This much is valid—and highlights why early critics of both theories (e.g., "selection can’t design!" or "machines can’t *really* think!") often commit a similar error: demanding that the mechanism internally mirror the outcome.  

  However, the Ratchet Principle overreaches by conflating two *different* inversions. Darwin’s solution is **etiological**: it explains the *origin* of a teleology-like fit (e.g., "Why do antelopes run fast?") by citing historical selection pressures. The competence is *about* the world because it was filtered *by* the world. Turing’s solution is **executional**: it explains how a system can *reliably transform representations* step-by-step (e.g., calculating "2+2=4") without any step requiring comprehension. The problems are orthogonal: Darwin solves *why a competence exists*; Turing solves *how it operates*.  

  This conflation masks the Ratchet Principle’s fatal flaw: stacking competences (e.g., evolution’s "design" + Turing’s computation) does not automatically generate **comprehension**. A thermostat + a calculator + a chess engine may exhibit layered competences, but this need not yield understanding—even if the system *mimics* comprehension. The Chinese Room highlights this: the Room manipulates symbols flawlessly (Turing’s executional inversion) and may even have evolved (Darwin’s etiological inversion), but Searle argues it still lacks understanding. The Ratchet Principle dismisses this by *redefining* comprehension as functional competence ("If it passes the Turing Test, it understands!"). But this is a **switcheroo**: it replaces the intuitive notion of understanding (something like *grasping meaning*) with a thinner, behavioral definition. The Ratchet doesn’t *generate* understanding—it *evades* the hard problem.  

  To bridge comprehension-free competences to genuine comprehension, we might need an **extra ingredient**: perhaps a meta-competence to *monitor, justify, or recombine* internal states (e.g., not just computing "2+2=4," but *recognizing why* it follows from axioms). Crucially, this must be a **crane** (naturalistic), not a skyhook. A promising candidate is **historically embedded self-monitoring**: a system that can cite reasons for its actions (e.g., "I infer X because of data Y") *and* has a learning history fixing the content of its states (Darwin’s etiological layer). This avoids magic: self-monitoring could be a computational module bootstrapped by evolution. Yet even this may only yield *higher-order competence*, not subjective understanding—the hard problem persists. The Ratchet Principle’s error isn’t fatalism (comprehension is impossible!), but hubris: it assumes stacking mechanisms *must* yield comprehension, when the gap remains unclosed.  

  ---

  ### **Marking Scheme (20 marks total)**  
  **Aim to hit these 5 points:**  

  1. **Distinguish the Inversions (4 marks)**  
     - Darwin’s = etiological (explains *origin* of fit/teleology via selection history).  
     - Turing’s = executional (explains *process* of rule-following without comprehension).  
     - *Common blow-it:* Conflating them as "both say no designer/no mind."  

  2. **Identify the Ratchet’s Valid Core (3 marks)**  
     - Correctly notes both replace "reasons-first" with "mechanism-first" explanations.  
     - *Common blow-it:* Missing that the inversions share a *structural* similarity (reasons as output, not input).  

  3. **Critique the Comprehension Claim (5 marks)**  
     - Explain why stacking competences ≠ comprehension (e.g., Chinese Room isn’t resolved; competence is necessary but not sufficient).  
     - Expose the "switcheroo": Ratchet redefines understanding as behavioral competence.  
     - *Common blow-it:* Asserting "emergence" without explaining *how* it bridges the gap.  

  4. **Analyze the Chinese Room Misdirection (3 marks)**  
     - Ratchet uses the inversions to dismiss Searle, but this only works if understanding = competence.  
     - *Common blow-it:* Merely summarizing the Chinese Room without tying it to the Ratchet’s overreach.  

  5. **Speculate Plausibly on the "Extra Ingredient" (5 marks)**  
     - Propose a crane (e.g., self-monitoring, reason-citing, historical embedding).  
     - Judge if it’s naturalistic (crane) or miraculous (skyhook).  
     - Acknowledge the gap may persist (no false closure).  
     - *Common blow-it:* Vague appeals to "emergence" or "complexity"; proposing a skyhook (e.g., "consciousness module").  

  ---

  ### **Why This Works**  
  - **Forces disambiguation:** Students *must* split Darwin/Turing to score.  
  - **Prevents slogan-recycling:** The Ratchet Principle *is* the slogan—critiquing it requires deeper analysis.  
  - **Focuses on moves, not names:** No citations needed; full marks possible with course concepts only.  
  - **Targets common fails:** Explicitly blocks "design-without-designer" regurgitation, emergent hand-waving, and Chinese Room tangents.  
  - **Rewards precision:** 5 clear must-hit points with marks weighted to hardest insights (e.g., the "switcheroo" and extra ingredient).  

  This question turns their oversimplification into the foil, making the course’s deepest tensions unavoidable. Good luck with the grading!
