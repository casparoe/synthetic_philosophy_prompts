answer: |-
  The strongest defeaters involve institutions that durably prioritize truth/judgment over organizational persistence despite competitive pressures, particularly where issue-unbundling or mission-singularity structurally insulates integrity. 

  **Fatal Defeaters (if robust):**  
  1. **Reputational professional bodies** (e.g., medical associations enforcing ethical standards): If they maintain consistent, evidence-based judgment across generations while competing for members/influence *and* avoiding platform-bundling (e.g., narrowly focused mandates), this directly disproves the inevitability of deformation, showing career incentives can align with truth. *Weil would concede this*—she exempted "truth-oriented" groups but offered no mechanism for durability.  
  2. **Independent central banks** with long-term technocratic independence: Observed stability in inflation-targeting regimes (e.g., post-1990s Bundesbank) suggests competition for credibility, not organizational survival, can dominate incentives without partisan bundling. *Tests the thesis by lacking (ii) bundling and attenuating (i) electoral pressure.*  

  **Awkward but Non-Fatal (partial counterevidence):**  
  3. **Durable non-partisan municipal governments** (e.g., Swiss cantons or Canadian cities): Weak test—they often rely on informal party-like caucuses, and low-stakes competition may reduce deformation pressure. If corruption-free for centuries, mildly undermines (i) but not core mechanisms. *Weil could dismiss as insufficiently influential.*  
  4. **Liberation movements transitioning to governance** (e.g., ANC pre-1994): Prioritized collective judgment under persecution but replicated party pathologies later. *Confirms thesis*—shows deformation emerges with durability/institutionalization.  

  **Non-Defeaters (misleading cases):**  
  5. **One-party states**: Pathology flourishes *without* (i) electoral competition, proving it’s not necessary. But careerism/bundling (ii-iii) persists, *validating* the generalization. *Weil might note this extends her critique unintentionally.*  

  **Mechanism Isolation**:  
  - **Bundling (ii) is primary**: Issue-bundling forces loyalty over truth; electoral competition (i) merely intensifies it. Evidence: NGOs bundling unrelated policies (e.g., some human rights groups) show similar cognitive capture without elections.  
  - **Career control (iii) is sufficient alone**: Universities with tenure committees prioritizing conformity over merit exhibit deformation sans bundling/elections.  

  **Weil’s Vulnerability**: She’d *have to concede* professional bodies as counterevidence unless she retreats to anarchism. Her "currents of opinion" proposal collapses if any durable truth-seeking group avoids pathology—but she assumed structure *always* corrupts, making her position unfalsifiable.  

  **Thesis Insulation**: The thesis risks unfalsifiability if "competition for influence" is stretched to include *any* collective action. However, specifying *material resource dependence* (funding, membership) as boundary condition allows testing: observe truth-oriented institutions with secure endowments (e.g., Royal Society). This insulation isn’t fatal—it’s typical for structural theories—but demands precise empirical thresholds (e.g., deformation within 30 years).
