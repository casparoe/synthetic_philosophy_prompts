answer: |-
  Here’s a disambiguation of "absence of evidence is not evidence of absence," structured per your request:

  ---

  ### 1. The Readings (ordered trivial → radical)
      *   **R1 (Trivial Ignorance):** "Lack of data doesn’t *prove* the opposite claim." *Licenses:* Only the refusal to accept "no evidence" as *conclusive proof* of absence. Doesn’t move probabilities.
      *   **R2 (Weak Bayesian Prior):** "Lack of confirming data shouldn’t *automatically* push your prior belief towards absence." *Licenses:* Maintaining a prior probability (e.g., P(sentience)) unchanged *if* the evidence was truly uninformative.
      *   **R3 (Evidence Quality):** "The *available* evidence-gathering methods might be incapable of detecting the phenomenon." *Licenses:* Investing in better detection methods before concluding absence.
      *   **R4 (Epistemic Caution - Weak):** "In the face of ignorance, avoid strong claims of non-existence." *Licenses:* Stating "we don't know" instead of "they aren't sentient."
      *   **R5 (Prior Skepticism):** "Absence of evidence *is* weak evidence of absence *only if* we strongly expected evidence to be present if the claim were true." *Licenses:* Lowering P(claim) if good evidence *should* exist but doesn’t. (Implies insects *should* show clearer signs).
      *   **R6 (Default Position):** "Absence of evidence justifies assuming absence *until* evidence appears." *Licenses:* Acting *as if* not sentient until proven otherwise.
      *   **R7 (Epistemic Caution - Strong):** "Absence of evidence creates a presumption *against* concluding absence." *Licenses:* Assigning non-negligible probability to existence despite no evidence.
      *   **R8 (Decision-Theoretic Leverage):** "Absence of evidence *cannot justify acting* as if the phenomenon is absent if the stakes of being wrong are high." *Licenses:* Precautionary action based on potential large-scale consequences, even if P(existence) is low.
      *   **R9 (Radical Ignorance):** "Absence of evidence is *always* epistemically neutral; it provides *zero* information for or against existence." *Licenses:* Assigning a 50/50 prior or refusing to assign *any* probability. Ignores background knowledge.
      *   **R10 (Anti-Falsification):** "The phenomenon might be fundamentally undetectable; absence of evidence is therefore meaningless." *Licenses:* Believing in the phenomenon regardless of (im)possibility of evidence.

  ---

  ### 2. Verdicts
  *   **Platitude:** R1 (Trivial Ignorance) is tautologically true but useless. R4 (Weak Caution) is prudent framing.
  *   **Substantive-but-Defensible:** R2 (Weak Bayesian), R3 (Evidence Quality), R5 (Prior Skepticism), R7 (Strong Caution), R8 (Decision Leverage). These require context/assumptions. R3/R7/R8 are key for insects.
  *   **Actually False:** R6 (Default Position) misapplies scientific burden of proof outside courts. R9 (Radical Ignorance) ignores priors from related knowledge (e.g., neurobiology). R10 (Anti-Falsification) renders the claim non-scientific.
  *   **Silent on Insects:** R1, R2, R3, R9 say nothing specific about insect sentience probability; they’re about evidence interpretation generally.

  ---

  ### 3. Which Reading Does Which Job
  *   **For Precaution ("Err on caution"):** Needs **R7 (Strong Caution)** or **R8 (Decision Leverage)**. R7 creates a presumption for existence, R8 leverages scale/risk. *Survival:* R8 is defensible (high-stakes decisions often use low-probability/high-impact); R7 is shakier without justification for *why* absence isn’t evidence (see R5).
  *   **For Dismissal ("Extraordinary evidence"):** Needs **R5 (Prior Skepticism)** or **R6 (Default Position)**. Argues absence *is* weak evidence because we *should* see signs. *Survival:* R5 is defensible (insect neurobiology makes sentience *a priori* unlikely, so absence *is* suggestive); R6 is false.
  *   **For Expected-Value-Plus-Scale:** Needs **R8 (Decision Leverage)**. Explicitly uses scale (N) to argue that even low P(sentience) warrants action due to Expected Value = P * N * Welfare_Range. *Survival:* Defensible *if* one accepts using expected value calculations under deep uncertainty and assigns non-zero P. This is the core of Pascal's Mugging *logic*.

  ---

  ### 4. Where the Numbers Come In
  Huge N amplifies weak readings. R1/R2/R4 are trivial without scale, but combined with massive N, proponents try to bootstrap them into justifying R8's action. However, R8 *explicitly* incorporates stakes/scale, while R1/R2/R4 do not. Using them for action smuggles in R8's logic without justification.

  *   **Graded Sentience:** This compounds uncertainty. Instead of P(Sentient) * N * Welfare_Range, it's P(Welfare_Range = X) * N * X across all possible X. "Absence of evidence" now applies to *degree*. R3 (Evidence Quality) is crucial: current methods may only detect human-like sentience, missing subtle forms. R5 (Prior Skepticism) gains strength if simple systems are presumed to have lower ranges. R8 becomes even fuzzier – acting requires assuming not just existence, but a *meaningful* welfare range.
  *   **Sign-Flip:** This is critical. If the reasoning is purely "Low P * Huge N * |Impact| justifies action," then:
      *   P(Net Positive Welfare) * N * Welfare_Range supports intervention to protect.
      *   P(Net Negative Welfare) * N * |Welfare_Range| supports intervention to reduce numbers/pain.
      *   **Pascal's Mugging applies symmetrically.** Shouting it down fails unless:
          1.  We have asymmetry in priors (e.g., strong reasons P(Net Negative) is vastly lower than P(Net Positive) based on evolutionary theory/pain function).
          2.  We reject pure expected value maximization under extreme uncertainty/low probabilities (dismissing the "mugging").
          3.  We focus interventions on reducing intense suffering *conditional* on sentience existing, assuming welfare ranges aren't massively negative on average. Without resolving this, the scale argument *is* bidirectional and unstable.

  ---

  ### 5. What to Say at the Meeting
  "Invoking 'absence of evidence' alone doesn't cut it. We need to state *why* the absence isn't evidence *in this case* (e.g., are methods insufficient? Is the prior very low?). More importantly, scale forces us to confront decision-making under deep uncertainty. But this logic is fragile: it demands we justify why insect welfare is likely net positive *if sentient*, and it can equally argue for opposite actions. We need explicit models weighing priors, potential welfare ranges, risks, and the validity of expected value under such radical uncertainty."
