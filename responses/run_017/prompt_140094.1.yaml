   The single feature doing the work is the thermal override: the temperature, which is continuous and has a limit, forces the lamp on via the thermostat relay.

   If we remove the thermal system (and the override relay), then the lamp is controlled solely by the ball switch. At t=1, the ball is not pressing the switch, so the lamp is off. This reverts to a determinate outcome (off) but not the one we want. Moreover, the underdetermination advocate might argue that the ball switch could be designed to be normally closed? But that's a design choice. In our design, we made it normally open. Without the override, the lamp is off at t=1. But note that the underdetermination complaint in the original Thomson's lamp was about the state of the lamp after an infinite number of toggles. In our reduced design without override, the lamp is not toggled at the bounces in the same way: it is on during the contact time and off otherwise. And at t=1, it is off. So it's not underdetermined. However, the original underdetermination complaint was about the final state of a two-state device that is flipped infinitely often without settling. In our reduced design, the lamp state does not have a limit as t->1- (because it keeps turning on and off) but at the exact time t=1, it is off. This is analogous to the function f(t)=sin(1/(1-t)) which oscillates wildly as t->1- but might be defined as 0 at t=1. But the value at the limit point is defined by continuity of the physical setup? In our case, the physical setup defines the lamp state at t=1 by the ball switch: open circuit -> off.

   So the underdetermination is avoided in the reduced case by the fact that the ball is not touching the switch at t=1. But this is a different resolution. The point of the example is to show that a continuous state variable can force the outcome. In the full design, the temperature forces the lamp on.

   The best attack is to question the idealization of the bouncing ball or the physical possibility of the heating/cooling process converging exactly as modeled. But within the idealization, it works.

   Therefore, we have met the specs.

