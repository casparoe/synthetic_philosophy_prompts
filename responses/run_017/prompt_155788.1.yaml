  The "judging easier than producing" point needs unpacking: is it computational ease, verification vs discovery, or understanding vs fluency? The protocol likely hinges on verification being computationally simpler than argument generation, but I should acknowledge other interpretations. 

  For underdetermination, multiple philosophical theories could justify the practice—reliabilism, reductionism about testimony, even certain virtue epistemologies. Crucially, I must separate strict presuppositions (like verifiability) from comfortable fits (like debater honesty). 

