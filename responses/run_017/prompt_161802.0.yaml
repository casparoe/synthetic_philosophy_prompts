answer: |-
  ### Gains-from-Trade Analysis: South Africa’s Transition (1990–94)  

  **Parties, Endowments, and Walk-Away Options**  
  - **ANC Coalition**: Endowed with *legitimacy as the majority representative*, *international pressure leverage*, and *capacity for sustained resistance*. Factions: pragmatists (Mandela, Ramaphosa) prioritizing power transfer vs. radicals demanding revolutionary justice. Walk-away: protracted civil conflict, economic collapse.  
  - **NP/State Establishment**: Endowed with *de jure state control*, *military/police apparatus*, and *economic institutions*. Factions: reformers (de Klerk) seeking managed transition vs. hardliners fearing retribution. Walk-away: intensified repression, pariah-state isolation, potential coup.  
  - **Unaligned Groups**: Victims/survivors (endowed with moral claims to justice), business elites (economic stability), far-right/left spoilers.  

  **Transfers and Trades**  
  1. **NP to ANC**: Relinquishment of *exclusive political control* (interim power-sharing → majority rule).  
  2. **ANC to NP**: *Amnesty* for apartheid-era crimes (via TRC) and *continuity of state bureaucracy/property rights*.  

  **Denomination Problem: Gains vs. Costs**  
  - **Consequential Gains (Outcome-Focused)**:  
    - ANC: Avoided civil war, achieved political power, institutional access. Baseline: costly, uncertain victory.  
    - NP: Avoided Nuremberg trials, preserved economic influence, phased exit. Baseline: regime collapse.  
    *Both gained consequentially: stability > baseline chaos.*  
  - **Agential Costs (Action-Focused)**:  
    - ANC: Complicity in impunity (granting amnesty for gross rights violations). Moral cost: betraying victims’ demands.  
    - NP: Surrendering apartheid ideology (accepting racial equality). Moral cost: repudiating core identity.  
    *Both incurred agential costs: each "sinned" against their own principles.*  
  **Denomination Misalignment**: Consequential gains were clear, but agential costs created *moral residue*. For ANC radicals/NP hardliners, agential costs outweighed gains—hence post-deal violence (e.g., AWB, MK dissidents).  

  **Ownership Condition: The Illicit Trade?**  
  The trade presumed the ANC "owned" victims’ claims to justice and the NP "owned" the state’s legitimacy. This fails:  
  - Victims’ *right to retribution* was non-transferable. The TRC’s amnesty-for-truth mechanism acknowledged this by centering victims’ voices but did not resolve the ownership violation—it merely mitigated it procedurally.  
  - The state’s legitimacy was never the NP’s to "give"; it was illegitimately held. The ANC traded *its acceptance of NP’s illicit control* for power, laundering ownership via majoritarian mandate.  

  **Where the Trade Framing Fails**  
  1. **Misdescription of Goods**: Treating justice and legitimacy as tradable commodities obscures their inalienability. The model cannot capture moral claims held by non-parties (victims).  
  2. **Silence on Uncompensated Losses**: Victims bore agential costs (impunity) but were not bargaining agents. Their "endowment" (moral claims) was confiscated, not traded.  
  3. **Dynamic Power Asymmetry**: The model assumes static endowments, but the ANC’s legitimacy grew during talks, while NP’s control eroded—making "gains" asymmetric post-deal.  

  **Conclusion: Model Stress Test**  
  The case confirms the denomination problem’s relevance: parties gained consequentially but paid agential costs, revealing trade-offs invisible in pure utility calculations. However, it exposes the ownership condition as a fatal anomaly: uncompensated third-party claims rupture the model’s assumption that traded goods are owned. The framing also misdescribes transitions where legitimacy itself is contested. South Africa’s compromise succeeded *despite* these flaws because external pressures (economic collapse, global sanctions) made no-deal catastrophically worse for all—forcing a deal that the model cannot morally sanitize.  

  \answer{anomaly — ownership condition reveals uncompensated moral creditors}
