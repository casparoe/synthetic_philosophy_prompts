  First, I need to unpack their core concepts. The denomination problem asks whether gains are measured by outcomes (consequential) or actions (agential). The ownership condition questions if traded "goods" (like justice) were legitimately owned by the negotiators. South Africa's transition is perfect for this—it involved trading rule for impunity, which feels morally charged from both angles.

  The user explicitly rejects modus vivendi and overlapping consensus frameworks, so I must avoid those. They're clearly deep into political philosophy, possibly academic, given how precisely they frame the problem. Their frustration with "toy cases" suggests they want to see if their model holds under historical messiness. 

