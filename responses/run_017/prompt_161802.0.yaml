  Trades: ANC gave amnesty (agential cost: betraying victims) for power (consequential gain: ending apartheid). NP gave up dominance (agential cost: surrendering privilege) for stability (consequential gain: avoiding Nuremberg-style trials). 

  Here’s the tension: Consequentially, both gained (peace > chaos). Agencially, both paid—ANC in unearned impunity, NP in relinquishing control. But the ownership condition bites hard: ANC "traded" justice that belonged to victims, not them. That’s where the model strains—it assumes negotiators own what they trade, but moral claims aren’t property. 

  The user’s model gets an anomaly here. It confirms that denominations can misalign (consequential gains ≠ agential costs), but ownership exposes a flaw: some goods can’t be traded without moral theft. South Africa shows the model is incomplete when "gains" ignore third-party stakes. 

  Final answer? Anomaly—the ownership rupture forces the model to confront its limits. The trade framing misdescribes by pretending justice was a commodity. That final line must crystallize this: \answer{anomaly — ownership condition reveals uncompensated moral creditors}. 

