  Key constraints jump out:
  - Mixed audience (EA/philosophers vs family/community)
  - Mira's atheism (no spiritual language)
  - Banned terms: saint/hero/selfless/inspiration
  - Nora's request: don't portray Mira as showing off or others as failing
