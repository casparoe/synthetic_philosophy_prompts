  Hmm... the philosophical framework needs to be invisible scaffolding, not lecturing. Maybe structure it around Mira's own moral compass? Her "obviously owed" principle could anchor everything. 

  The kidney donation example is perfect - she saw it as baseline human duty while others see it as exceptional. That duality can illustrate the central tension without philosophy jargon. 

  For audience comfort: emphasize that Mira judged herself by her own standards, not others'. Shift focus to how her actions made people feel (warmth/attention) rather than quantifying sacrifices. 

  Danger zones to avoid:
  - Any implication that Mira was "better" than others
  - Suggesting her choices were universally obligatory
  - Romanticizing her exhaustion (mention "tiredness" to acknowledge reality but not glorify burnout)

  The closing should mirror Mira's practicality - maybe her belief in "ordinary obligations beautifully met"? Keeps it grounded while honoring her impact. 

  Better triple-check every adjective against Mira's known pet peeves. Words like "generous" or "giving" might still trigger her "quiet fury" if framed as extraordinary. 

  ...And absolutely no handwriting jokes. Dave's got that covered.
answer: |-
  Here’s a carefully crafted eulogy that navigates your constraints, centers Mira’s own worldview, and addresses the audience’s needs without compromising honesty. The concept of supererogation (and its critiques) structures the speech implicitly—never named, but shaping every word.  

  **(Word count: ~980 / Time: ~7 minutes)**  

  ---  

  **For Mira**  

  We’re here because Mira mattered. Not because she was perfect—she’d roll her eyes at that—but because how she moved through the world left traces of warmth in places that felt cold before she walked in. Her life wasn’t a performance. It wasn’t a lesson. It was… Mira.  

  You all knew different versions of her. To her neighbours, she was the one who’d notice your limp and show up with frozen peas and a stack of medical journals. To her colleagues, she was the nurse who’d stay late to hold a hand when shifts changed, because “you don’t clock out on dread.” To Nora, she was just Mum—the one who sang off-key in the car, burned toast reliably, and knew exactly when you needed a hug before you did.  

  And you’ve heard about the kidney. The years of giving away half her salary. The months she spent on sabbatical caring for a dying friend. When people called these things “extraordinary,” she’d get this tightness around her eyes. She hated that word. If you pressed her, she’d say something like: *“Nobody gets extra credit for doing what’s obviously owed.”*  

  That phrase matters. Because Mira had a very clear, very quiet sense of what was *owed*. Not by cosmic balance sheets, but by being human among humans. She didn’t see kidneys or time or money as *hers* to hoard if withholding them meant someone suffered unnecessarily. To her, sharing wasn’t generosity—it was basic housekeeping for a shared world.  

  This is hard for us to sit with. Because if Mira’s choices were just… baseline decency? Where does that leave the rest of us?  

  Let me say this plainly: **Mira would hate it if any of you walked out of here feeling judged.** She didn’t keep score—not of your kidneys, not of your pay stubs, not of your choices. She knew life is messy. She knew capacity shifts. She knew chronic illness, exhaustion, student debt, kids who need braces, years when you’re barely keeping your head above water. She never thought her way was the only way.  

  What she *did* believe—fiercely—was that we’re all responsible for looking clearly at what’s in front of us. Not at abstract “good deeds,” but at the specific human in your path, shivering or scared or alone. Duty, to her, wasn’t about grand gestures. It was about *not looking away* from the manageable piece of suffering you could actually ease. For her, that might have been a kidney. For you, it might be driving a neighbour to chemo. Making a casserole. Sitting silently with grief. Sending a text: *“Still here.”*  

  So no, Mira wasn’t “selfless.” She was deeply, particularly *self-full*. She understood her limits. She got tired. She snapped at bureaucracy. She hid from fundraising emails. She loved trashy TV and expensive cheese. What made her remarkable wasn’t some mythical lack of self—it was how she calibrated her *attention*. She noticed need like a musician hears dissonance—not as criticism, but as a call to tune the string.  

  And when she acted? It wasn’t heroic. It was often… ordinary. A series of small, stubborn “of courses”:  

  *Of course* you stay when the dying friend has no one else.  
  *Of course* you give the kidney if you’re healthy and a stranger isn’t.  
  *Of course* you live on less if your surplus can prevent ruin for others.  

  To her, these weren’t sacrifices. They were just… what you do. Like returning a wallet. Like steadying a ladder. Like holding the door.  

  **That’s why praising her as “generous” made her furious.** Generosity implies giving *more* than due. It frames basic humanity as optional benevolence—something we applaud precisely so we can feel okay about not doing it ourselves. Mira refused that framing. She insisted we stop calling decency “exceptional,” because that lets us off the hook for the ordinary, doable, daily work of care.  

  So how do we honour her without falling into that trap?  

  We honour her by **taking her seriously**, not putting her on a pedestal.  
  By **respecting her clarity**, not turning her into a saint.  
  By **rejecting false comparisons**, because Mira wasn’t keeping track—and neither should we.  

  Most of all, we honour her by **trusting her judgment**. She chose her path not to shame anyone, but because it aligned with her deepest conviction: that we belong to each other in ways both practical and profound. That conviction wasn’t a burden to her—it was a compass. And it brought her joy. Real, stubborn, everyday joy. In Nora’s laugh. In her garden’s absurdly huge zucchinis. In the moments when her care made someone breathe easier.  

  Grief is love with nowhere to land. So let yours land here: in gratitude for how she warmed this world. Not because she was perfect, but because she showed us that “ordinary” decency—done consistently, clearly, without fanfare—can be revolutionary.  

  Her legacy isn’t a challenge to match her scale. It’s an invitation to match her *clarity*. To ask, in her spirit: *“What’s obviously owed here, by me, today?”* And then—without drama, without seeking credit—to do that thing.  

  Hold the door.  
  Steady the ladder.  
  Return the wallet.  
  Share what’s spare.  

  Look. Don’t look away.  

  That’s how Mira moved through the world. That’s how she loved you all. And that’s enough.  

  ---  

  **Why This Works Structurally:**  
  - **Supererogation Framing:** The speech rejects "extra credit" morality by centering Mira’s "obviously owed" principle. Acts others see as supererogatory are redefined (by her standard) as baseline duty.  
  - **Audience Protection:** Explicitly absolves listeners ("Mira would hate it if you felt judged"), distinguishes her *capacity* from moral superiority, and elevates "ordinary" care to validate non-grand gestures.  
  - **Mira’s Integrity:** Banned terms are avoided. Her atheism is respected. Her rejection of praise is explained via her moral logic—not as humility, but as philosophical consistency.  
  - **Burnout Safeguard:** Highlights her limits (tiredness, irritation) and frames her choices as *personal alignment*, not universal obligation. The "invitation" focuses on discernment ("what’s owed by me, today"), not imitation.  
  - **Philosophical Rigor (Invisible):** Engages debates about demandingness (acknowledges varying capacities) and the function of praise (critiques "generosity" as a social excuse) without jargon.  

  **Key Lines Doing Heavy Lifting:**  
  - *"She didn’t see kidneys as hers to hoard if withholding meant suffering"* → Challenges property-centric ethics.  
  - *"Generosity implies giving more than due... Mira refused that framing"* → Directly addresses her critique of supererogation.  
  - *"What’s obviously owed here, by me, today?"** → Makes her philosophy actionable without prescription.  

  This holds Mira’s truth while making space for everyone else’s humanity. She’s honoured, not canonized—and the room is invited into reflection, not guilt.
