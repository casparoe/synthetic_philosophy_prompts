prompt: |-
  I'm a PhD student in quantum information who has been drafted onto a working group writing the certification requirements for device-independent randomness beacons, and I keep having to say what our security case assumes. I want the philosophical reconstruction of it, because I think our draft is using one word where three are needed.

  The practice, stated concretely. Two shielded devices sit in separate laboratories. In each round a public random bit is fed to each device as a measurement setting and each device returns an output bit. We compute a CHSH-type statistic over many rounds and check that it exceeds the local-hidden-variable ceiling of 2. If it does, and provided that (i) nothing passes from one laboratory to the other between the choice of a setting and the recording of an output, and (ii) the public setting bits were not correlated beforehand with whatever internal state the devices were in, we certify that the output string contains randomness unpredictable to any adversary — including one who manufactured and programmed the devices, who shares arbitrary prior entanglement with them, and who knows everything quantum mechanics says there is to know about their internal state. The string is then passed through a randomness extractor and released as certified bits.

  What I want is the implicit theory of locality, causation, or whatever the right noun is, that this security case only makes sense under. Four points I cannot get straight on my own.

  First, the asymmetry in what we grant the adversary. She gets determinism, complete prior knowledge of the devices, and arbitrarily strong common-cause correlations; she is denied only correlation between the setting bits and the device state. We hand her the hidden variables and then refuse her the one thing a hidden-variable theorist would need in order to defeat the protocol. What view of locality or causal independence makes that a coherent package rather than an arbitrary decision about where to stop granting? In particular, is the independence of the settings genuinely a separate assumption from locality, or is it already part of what a Bell-style local causality condition asserts — so that what our draft calls the free-settings assumption is in fact locality showing up a second time under another name?

  Second, our draft forbids communication between the laboratories, and our group is split on whether that means no-signalling at the level of the observed statistics or something stronger. Since we stipulate that the adversary knows the devices' complete internal state, could there be a dependence of one side's output on the other side's setting that is invisible in the published marginals but visible conditional on her information — a channel she could exploit while the public statistics still look no-signalling? If so, we need the hidden-variable-level condition and not merely the operational one. Which of the two does a security proof actually consume, and does the distinction map onto the philosophers' pair of parameter independence and outcome independence? If it does, say which of the two our standard forbids and which it leaves open, and whether a deterministic pilot-wave theory violates the one we forbid.

  Third, two hypothetical anomalies I use to test the draft, which I would like treated as real cases. (a) A beacon runs continuously for a year and its violation strength drifts with the sidereal day, tracking the orientation of the apparatus relative to the fixed stars. (b) A beacon reproducibly sits at 2.9, above the quantum ceiling of about 2.83 but below the no-signalling maximum of 4, with no communication between the laboratories and no detector fault anyone can find. Our engineers call (a) a systematic error and (b) a firmware bug. What in the implicit theory entitles them to that asymmetry? It looks to me as if (b) shows that we were never fully device-independent, since we were assuming quantum mechanics somewhere after all, and as if (a) shows that we secretly assume the relevant common causes to be local and recent rather than cosmological. Say what each anomaly would mean if taken at face value, and what would have to change in the standard to accommodate it.

  Fourth, where the practice is underdetermined. It looks compatible with a deterministic but explicitly nonlocal hidden-variable theory, with an indeterministic picture of irreducibly chancy single outcomes, and with an operationalist picture on which there is no fact of the matter about hidden variables and the whole procedure is only a constraint on observable correlations. It also seems to presuppose something about what is knowable in principle, since the security bound limits the adversary to the quantum description and so appears to assume there is nothing further to be known — exactly what a critic who grants her hidden-variable knowledge denies. Tell me which of these the practice strictly requires, which it merely fits well with, and which it rules out; and tell me whether it also presupposes, without stating it, that measurements have single definite outcomes, since a many-outcomes view seems to block the derivation that the certificate rests on.

  Finally, if we had to rebuild the standard on a different picture — dropping the independence of the settings, or granting the adversary hidden-variable information, or treating supra-quantum violations as discoveries rather than bugs — what would the replacement look like, and would anything be left to certify?

  Format: open with your bottom line in the first sentence, the single claim about what our security case presupposes that the rest defends, then give the reasoning, with no preamble and no restatement of my question; number your replies to my four points. Close with how confident you are in the reconstruction overall and a flag on the one claim in it you are least sure of.
reasoning: |-
  Okay, the user is a PhD student in quantum information working on certification standards for device-independent randomness beacons. They're grappling with the foundational assumptions behind their security proofs and want a philosophical reconstruction. Let me unpack their concerns systematically.

  First, they're highlighting an asymmetry in what they grant the adversary: full knowledge of devices and hidden variables, but denial of correlation between settings and device states. The core question here is whether "free settings" is truly independent from locality or just locality reappearing. I recall that Bell's local causality explicitly separates setting choices from past hidden variables via spacetime separation. So yes, free settings is distinct - it's about the causal independence of current choices from past states, while locality governs spacelike separation. This distinction matters because without free settings, even local hidden variables could correlate settings with device states pre-measurement.

  Second, the no-communication stipulation needs clarification. The user asks whether operational no-signaling suffices or if we need hidden-variable-level conditions. Given the adversary knows the exact quantum state, we must prevent signaling even conditional on her knowledge. This aligns with parameter independence at the hidden-variable level - forbidding one device's output from depending on the other's setting. Outcome independence (dependence between outputs) can remain violated as in quantum mechanics. Pilot-wave theories actually violate outcome independence while maintaining parameter independence, so they'd satisfy this requirement.

  Third, their anomaly tests reveal hidden assumptions. Case (a) with sidereal variation suggests we implicitly assume local common causes - if cosmological factors influence device behavior, it breaks the isolation premise. Case (b) with supra-quantum correlations implies our security proofs secretly rely on quantum bounds - otherwise why treat 2.9 as a bug? To accommodate (a) we'd need to control for distant correlations; for (b) we'd have to accept generalized probabilistic theories, but then randomness certification crumbles without Tsirelson's bound.

  Fourth, the practice is compatible with multiple interpretations but has key presuppositions. It works with determinism (e.g. pilot-wave) or indeterminism, but requires definite outcomes - many-worlds would undermine the extractor's premise. While operationalist about hidden variables, it assumes quantum mechanics provides complete knowable descriptions for security purposes. Supra-quantum theories are ruled out by how we treat anomaly (b).

  The user's deeper need seems to be: they want to articulate unstated philosophical commitments to strengthen their standard. My reconstruction centers on "causal independence of setting choices from prior states via spacetime separation" as the core presupposition. I'm least confident about whether outcome definiteness is truly indispensable - perhaps some many-worlds-compatible reformulation exists, though I can't see it now.
answer: |-
  **Bottom line: Your security case presupposes the causal independence of the setting choices from the prior physical state of the devices and any hidden variables, enforced by spacetime separation.**

  **Reasoning:**

  1.  **Asymmetry & Locality vs. Free Settings:** The independence of the settings (free choice) *is* distinct from locality (no-signalling), though both rely on spacetime separation.
      *   **Locality (No-Signalling):** This forbids causal influence *between* the spacelike-separated labs *during* a round (outputs cannot depend on the other lab's *current* setting via any mechanism). Bell's local causality condition explicitly incorporates this: the local outcome probability depends *only* on the local setting and the complete common past (λ). It forbids direct dependence on the *distant* setting.
      *   **Free Settings (Independence):** This forbids causal influence *from* the prior state (including hidden variables λ) *to* the *choice* of the current settings. Bell's local causality *assumes* this independence by conditioning on λ and the settings (P(a,b|x,y,λ) = P(a|x,λ)P(b|y,λ)) – it doesn't derive it. The settings (x,y) must be statistically independent of λ for the Bell inequality derivation to hold. Granting the adversary knowledge of λ but denying dependence between (x,y) and λ is coherent: it assumes the settings are exogenous inputs, causally separated from the device's prior preparation. This is not locality "again"; it's a separate causal arrow being blocked – from past state to future setting choice. Stopping here is not arbitrary; it's the minimal assumption preventing the adversary from pre-determining the outcomes *for the settings she knows will be chosen*.

  2.  **No-Signalling Strength & PI/OI:** You require **parameter independence** at the hidden-variable level, not merely operational no-signalling.
      *   Operational no-signalling (P(a|x,y) = P(a|x), etc.) is insufficient. The adversary knows the exact quantum state (or λ). She could exploit a hidden-variable model violating parameter independence (P(a|x,y,λ) ≠ P(a|x,λ)) even if operational no-signalling holds (by averaging over λ). This would allow her to predict outputs better, compromising randomness.
      *   Your security proofs consume **parameter independence (PI)**: P(a|x,y,λ) = P(a|x,λ) and P(b|x,y,λ) = P(b|y,λ). The output on one side cannot depend on the *setting* of the other side, even conditional on λ.
      *   You *allow* violations of **outcome independence (OI)**: P(a|x,y,b,λ) ≠ P(a|x,y,λ). Outcomes *can* be correlated given settings and λ, as in QM and pilot-wave theory.
      *   Pilot-wave theory violates OI (outcomes are correlated) but respects PI (no dependence of local outcome on *distant setting* conditional on the wavefunction/λ). Therefore, it **does not violate** the parameter independence condition your standard forbids.

  3.  **Anomalies & Hidden Assumptions:**
      *   **(a) Sidereal Drift:** Taken at face value, this suggests the device state (λ) has a non-local, cosmological common cause (e.g., fixed stars) correlated with the *orientation*, which becomes correlated with settings chosen later relative to that orientation. This violates the **free-settings assumption** (independence of settings from prior state λ). Your engineers call it a "systematic error" because they implicitly assume the relevant common causes are *local* and *controllable* within the shielded labs. To accommodate this, the standard would need explicit, stringent controls on potential non-local common causes (e.g., magnetic shielding, vibration isolation) and potentially randomness sources for settings resilient to such correlations.
      *   **(b) Supra-Quantum Violation (2.9):** Taken at face value, this suggests a physical theory beyond quantum mechanics governing the devices, respecting no-signalling. Your engineers call it a "firmware bug" because your security proofs **secretly assume the Tsirelson bound**. The randomness certification relies on the maximum quantum violation (~2.828) to bound the min-entropy. A violation of 2.9, while theoretically possible in generalized no-signalling theories, breaks the *specific* security analysis derived under quantum mechanics. You were never "device-independent" from the *mathematical framework* used for the proof (QM/GPVM). To accommodate this, you would need a security proof within a generalized probabilistic theory (GPT) framework. However, certifying randomness becomes problematic: min-entropy bounds derived from Bell violations often collapse to zero as the violation approaches the no-signalling maximum (4), meaning **little or no certified randomness might remain** for a violation of 2.9 without assuming QM's structure.

  4.  **Underdetermination & Presuppositions:**
      *   **Compatible With:** Deterministic nonlocal HV (e.g., pilot-wave - respects PI/free settings), Indeterministic QM (standard or collapse models), Operationalism (focus on correlations).
      *   **Requires:**
          *   **Definite Outcomes:** The derivation and the extractor fundamentally require a single, definite output string per round. A many-outcomes view (e.g., strict Everett) blocks this, as there is no unique string to certify or extract from. This is presupposed.
          *   **Knowability Limitation (for Security):** While compatible with HV theories, the security proof *assumes* the adversary's knowledge is limited to the quantum description (the state ρ and devices as CPTP maps) for the purpose of calculating the min-entropy bound. It doesn't assume QM is *ontologically* complete, but it *operationally* treats the quantum description as the maximal knowledge relevant for predicting outputs *within the security framework*. A critic granting HV knowledge *denies the validity of this specific security bound*.
      *   **Rules Out:** Theories violating parameter independence or free settings (as defined in point 1 & 2), Supra-quantum theories *for the specific security proof used* (as per point 3b), Many-outcomes interpretations (fundamentally).
      *   **Fits Well With:** Standard QM/Collapse models, Operationalism, Deterministic HV respecting PI/free-settings.

  **Rebuilding the Standard:**

  *   **Dropping Free Settings:** Certification collapses. The adversary knowing λ *and* its correlation with settings could pre-program outputs matching any chosen statistic, including a Bell violation.
  *   **Granting Adversary HV Knowledge:** Requires a new security proof within a specific HV model respecting PI/free settings. Randomness might still be certified (e.g., in pilot-wave), but the bound would be model-dependent, defeating device-independence. It would also require trusting the HV model's predictions.
  *   **Accepting Supra-Quantum Violations:** Requires a GPT security proof. Randomness certification is highly non-trivial and likely much weaker (lower min-entropy for a given violation strength) than under QM. For violations close to 4, certification may be impossible.

  **Confidence & Flag:** I am highly confident in this reconstruction overall (*8/10*). The least sure claim is the *absolute necessity of definite outcomes*; perhaps a many-worlds compatible reformulation using "relative facts" or "branch counting" for the extractor *might* be conceivable, though I know of no rigorous device-independent security proof achieving this and it faces profound conceptual challenges for a usable beacon.
