  ### Decision Procedure for Historical Commemoration Committee  
  This procedure provides a step-by-step framework for evaluating petitions. It focuses on **factual questions** (answerable by research) and **value judgments** (handed to trustees). Steps 1–6 are factual; if a fact cannot be established due to thin records, the objection fails. Steps 7–8 are value-based and always handed to trustees. "Stop" means the historical objection fails (no evidence supports removal), but Step 8 (ongoing harm) is always evaluated by trustees.  

  #### Decision Procedure Steps  
  1. **Identify the original reason for the honor**  
     - **Question:** Why was this person originally honored?  
     - **Sufficient answer:** Documentation (e.g., gift agreements, meeting minutes, news archives) stating the reason (e.g., donation, academic achievement).  
     - **Type:** Fact  
     - **Stop:** No  
     - **Handoff:** No  

  2. **State the specific objection**  
     - **Question:** What specific action, belief, or association is being objected to?  
     - **Sufficient answer:** A clear description based on verifiable facts (e.g., "employed child labor," "published eugenic views"). Avoid vague moral labels.  
     - **Type:** Fact  
     - **Stop:** No  
     - **Handoff:** No  

  3. **Reframe the objection without anachronism**  
     - **Question:** Can the objection be expressed using concepts/terms available in the person’s era?  
     - **Sufficient answer:** Evidence (e.g., contemporary writings, speeches) showing the concept existed then. If no, objection fails.  
     - **Type:** Fact  
     - **Stop:** Yes (if no) → Proceed to Step 8  
     - **Handoff:** No  

  4. **Check for contemporary awareness**  
     - **Question:** Was the objection (reframed in Step 3) articulated by contemporaries (e.g., critics, journalists, colleagues)?  
     - **Sufficient answer:** At least one instance of contemporary criticism (e.g., newspaper editorial, public letter, protest records). If no, objection fails.  
     - **Type:** Fact  
     - **Stop:** Yes (if no) → Proceed to Step 8  
     - **Handoff:** No  

  5. **Assess the person’s response to criticism**  
     - **Question:** How did the person respond to contemporary criticism (if any)?  
     - **Sufficient answer:** Evidence of acknowledgment, defense, dismissal, or change (e.g., letters, speeches, actions). If no evidence, proceed.  
     - **Type:** Fact  
     - **Stop:** No  
     - **Handoff:** No  

  6. **Evaluate severity in context**  
     - **Question:** Was the action a major failing by the era’s standards? (Defined as: violation of law, violation of widely accepted ethical codes, or widespread condemnation by authoritative voices.)  
     - **Sufficient answer:** Evidence of laws, ethical codes (e.g., professional guidelines, religious texts), or prominent condemnations (e.g., by leaders, institutions). If action was legal and not widely condemned, it is not a major failing → objection fails.  
     - **Type:** Fact (but involves judgment; see below)  
     - **Stop:** Yes (if not a major failing) → Proceed to Step 8  
     - **Handoff:** No  

  7. **Relevance to the honor**  
     - **Question:** Is the objection directly relevant to the original reason for the honor?  
     - **Sufficient answer:** N/A (trustees weigh facts from Steps 1–6).  
     - **Type:** Value  
     - **Stop:** No  
     - **Handoff:** Yes  

  8. **Ongoing harm**  
     - **Question:** Does the continued honor conflict with the university’s current values or cause harm?  
     - **Sufficient answer:** N/A (trustees weigh current context).  
     - **Type:** Value  
     - **Stop:** No  
     - **Handoff:** Yes  

  #### Key Features  
  - **Hard stops:** Steps 3, 4, or 6 stop the historical objection if evidence is lacking. The case still goes to trustees for Step 8.  
  - **Judgment calls dressed as procedure:**  
    - Step 3: Interpreting "available concepts" (e.g., was "racism" a standalone concept in 1850?).  
    - Step 6: Defining "major failing," "widely accepted," or "authoritative voices" (e.g., was criticism from one colleague "widespread"?).  
  - **Temptation to fudge:** Step 6 (you might over/underestimate "severity" to avoid controversy).  
  - **Handling thin records:** Default to "objection fails" if evidence is absent in Steps 3, 4, or 6.  
  - **Replaces "no worse than peers":** Step 6 focuses on era standards (laws/codes), not comparisons to peers.  

  #### What the Procedure Cannot Decide  
  - Legal issues (e.g., gift agreements).  
  - Broader political/social debates (e.g., "cancel culture").  
  - Assigning moral blame to historical figures. Trustees decide values (Steps 7–8).  

  #### Predictable Misuses by a Committee  
  - **Step 4:** Lowering the bar for "contemporary criticism" to fit desired outcomes.  
  - **Step 6:** Defining "widely accepted" loosely (to condemn) or strictly (to exonerate).  
  - **Step 8:** Trustees ignoring historical facts to prioritize current opinions.  

  ---

  ### Application to Cases  
  | Case | Step the case turns on | What the record would have to show to flip the answer | Verdict or hand-off | Who signs off |  
  |------|-------------------------|------------------------------------------------------|----------------------|--------------|  
  | (1) 1840s textile mill owner | Step 4: Contemporary awareness | Evidence of contemporary criticism (e.g., local reformer protests, investigative reports). | Hand-off to trustees (Step 8 only). Historical objection fails. | Trustees |  
  | (2) 1910s eugenics professor | Step 6: Severity in context | Evidence that eugenics was widely condemned in 1910s academia (e.g., university resolutions, professional ethics codes against it). | Hand-off to trustees (Step 8 only). Historical objection fails. | Trustees |  
  | (3) 1990s infant formula donor | Step 6: Severity in context (but all steps pass) | Evidence that marketing practices complied with 1990s ethical standards (e.g., industry awards, lack of regulatory action). | Hand-off to trustees (Steps 7 and 8). Historical objection stands. | Trustees |  

  **Unwelcome outcome for Case 3?**  
  - **Yes.** Case 3’s outcome is structurally *different* from Cases 1 and 2:  
    - Cases 1–2: Historical objection fails (trustees only consider ongoing harm in Step 8).  
    - Case 3: Historical objection stands (trustees consider relevance *and* ongoing harm in Steps 7–8).  
  - **Why this may provoke criticism:** Case 3 involves a living family and a gift agreement. Trustees might face pressure to retain the honor despite the historical objection.  

