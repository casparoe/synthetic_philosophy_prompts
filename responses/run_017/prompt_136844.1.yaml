  Key distinctions from the user:
  1. Conceptual presentism: avoid attributing concepts the person did not have.
  2. Availability of objections in the person's own time: if contemporaries articulated an objection, then it's a factual matter whether the person knew or could have known.
  3. Selection of facts: even if all facts are true, selecting only those that grate on us now is a form of presentism.
  4. Honoring as an ongoing act: the question is not "was he a bad person?" but "should we hold this person up as exemplary today?".
  5. Avoid the "no worse than peers" argument: it exonerates based on the era's average, which is problematic.

  The procedure should:
  - Be run in order.
  - Specify what counts as a sufficient answer at each step.
