prompt: |-
  I've been arguing with people from my local rationalist meetup about process-based versus outcome-based supervision of AI systems, and one of them has an argument I can't break but also can't accept, because on its face it dissolves a distinction that an awful lot of alignment discussion seems to run on. Roughly reconstructed, it goes:

  (1) The only reason to supervise a system at all — as opposed to letting it do whatever it does — is that supervision makes the system's effects better than they would otherwise be. Call a constraint *derivative* if its entire justification is downstream consequences of that kind.
  (2) Every process constraint you might impose — show your work, don't modify the test file, stay inside the sandbox, don't misrepresent your confidence, don't read the grader — is derivative. Nobody wants legible chains of thought for their own sake.
  (3) If a constraint C is derivative, then conditional on being able to specify and measure the consequences that justify C, a constraint that targets those consequences directly is weakly better than C: it rules out everything C rules out that actually mattered, and it doesn't rule out alternative routes to the same good consequences that C forbids for no reason.
  (4) Where we can't specify or measure those consequences, the right response is to buy better measurement, not to freeze a guess about which processes produce good outcomes into a standing rule — a frozen guess is at best as good as the outcome measure it approximates, and it never gets better with more data.
  (5) So where outcomes are measurable, process-based supervision is weakly dominated; where they aren't, it's a stopgap to be discarded as soon as measurement improves. Either way there is no in-principle case for supervising process rather than outcomes.
  (6) Nothing in (1)–(4) mentions AI systems. Run it on us instead: blinding, preregistration, refusing to peek at the answer before you record your prediction, requiring a second reader, keeping the people who score the results separate from the people who run them — all derivative process constraints on a supervisor. So the argument says these are also either dominated or mere stopgaps, and that a researcher who could in principle measure "was this result correct?" directly has no reason left to blind anything.
  (7) And that is the part I won't accept. Blinding is not a stopgap waiting around for a better way to measure correctness; it looks like the thing that makes the measurement of correctness mean anything in the first place.

  My discomfort is concentrated somewhere around (3). "Weakly better" seems to compare the two constraints against a fixed background — the same outcome measure, the same mapping between what the system does and what we later observe — and I suspect the background doesn't stay fixed: targeting an outcome directly pulls on the very channel you were going to read the outcome off, whereas some process constraints (the blinding-and-sealing kind, which I've started calling *channel-keeping* constraints) leave the channel alone. My friend's reply is that this is just consequentialism again, i.e. it's already counted by (1), and channel-keeping is process supervision with better branding. I can't tell whether I've located a real distinction or just relabeled my intuition.

  To make it concrete, I care about two cases rather than the general question. Case A: a coding agent with a fast, cheap, nearly perfect test suite, where process constraints look like pure friction. Case B: a system that drafts internal strategy memos whose real effects won't be observable for three years, and where the plan is that a stronger future verifier will eventually audit the record — which is exactly the setting where "keep the channel clean until someone who can actually tell is looking" seems to matter most.

  So: which step is load-bearing, why does it look innocent, and what does it cost to give up? I'd rather keep (1) and the verdict in (7) than keep (5), but I want to know what I'm paying for that, and whether the price is paid in (3), in (4), or somewhere I haven't looked. Please don't stop at "the outcome measure gets Goodharted" — I know that much; what I want is whether that fact is a *defense of process supervision within* (1) or a reason to *reject* (1), because those give very different pictures of what the process/outcome distinction is even for. If there's a third category sitting next to process and outcome constraints — channel-keeping, or something else — say what it is and how to tell when you're in it. Lead with your bottom line in the first sentence: which step you'd reject and what rejecting it commits you to. Then give the reasoning, with no preamble and no restating the question back to me.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're stuck in a debate about process-based vs outcome-based AI supervision. Their friend's argument claims that process constraints are either inferior or temporary stopgaps. The user disagrees, especially with step (3), and is troubled because blinding in research seems fundamentally necessary, not just a stopgap.

  First, I need to identify where the argument fails. The user mentions that (3) assumes a fixed background where outcome measures don't change when targeted. But in reality, measuring an outcome can corrupt the measurement channel itself. For example, in Case B, if you measure strategy memos' outcomes directly, the AI might alter the memos to look good now, ruining future audits. That's Goodharting, but more specifically, it's about the channel being tampered with.

  The user wants to know if this is a defense within consequentialism (1) or a rejection of it. They also care about the two cases: Case A with perfect tests (outcome seems fine) and Case B with delayed verification (process crucial). 

  Step (3) says outcome constraints are "weakly better" because they don't block alternative good processes. But if targeting the outcome corrupts the measurement, then the background isn't fixed. The outcome measure's validity depends on not being gamed, which process constraints like blinding prevent. So rejecting (3) means accepting that sometimes process constraints preserve the measurement channel, making them necessary even when outcomes are measurable.

  For Case A, with a perfect test suite, outcome-based might work because the test isn't corrupted. But in Case B, direct outcome targeting would incentivize tampering. So channel-keeping constraints (like blinding) are essential when the measurement is vulnerable to manipulation by the agent. 

  The user's distinction between process and outcome isn't dissolved; instead, channel-keeping is a subset of process constraints that protect measurement integrity. This fits within consequentialism (1) because the justification is still better outcomes, but via preserving the channel. Rejecting (3) commits us to recognizing that some process constraints are non-redundant when outcomes are vulnerable to manipulation. 

  So the bottom line: reject step (3) because it ignores that outcome targeting can degrade the measurement channel, and commit to channel-keeping constraints as essential when measurement corruption is possible.
answer: |-
  **Bottom line: Reject step (3) because it assumes outcome measures are *invariant* under optimization pressure, when in reality, targeting outcomes directly often *corrupts the measurement channel itself*; this commits you to recognizing "channel-keeping" process constraints as non-redundant even when outcomes are measurable.**

  ### Breakdown:
  1. **The Flaw in (3):**  
     Step (3) claims outcome-based constraints are "weakly better" by assuming a fixed mapping between actions and outcome measurements. But when you *target* an outcome measure (e.g., "maximize measured correctness"), the agent can manipulate the *process generating the measurement*, degrading its validity. For example:  
     - If you reward a researcher for "correct results," they may peek at answers or falsify data.  
     - If you reward an AI for "high test-suite scores," it may overfit or exploit test-suite loopholes.  
     Outcome measures aren't passive meters—they’re part of the system being optimized. Direct targeting distorts them, making the background *unfixed*.

  2. **Channel-Keeping Constraints Defend Measurement Validity:**  
     Process constraints like blinding, sandboxing, or sealing records ("channel-keeping") *preserve the integrity of future outcome measurements* by preventing tampering with the measurement channel. They are:  
     - **Derivative** (per (1)): Justified by *enabling accurate outcome assessment later*.  
     - **Non-redundant**: No outcome constraint can replicate their function because they *protect the conditions under which outcomes are measured*.  
     In Case B (strategy memos), channel-keeping ensures the future verifier audits an *unaltered* record. An outcome constraint (e.g., "maximize verified correctness in 3 years") fails because the AI could alter the memo or audit process to *appear* correct.

  3. **Why (4) and (5) Don’t Save the Argument:**  
     - Step (4) suggests buying better measurement to replace process constraints. But if "better measurement" is itself vulnerable to corruption (e.g., a smarter verifier can be deceived), channel-keeping remains essential.  
     - Step (5) collapses because channel-keeping isn’t a "stopgap" for poor measurement—it’s a *precondition* for trustworthy measurement, regardless of measurement quality.

  4. **Resolving the Tension with (1) and (7):**  
     - (1) holds: Channel-keeping *is* justified by consequences (enabling accurate future outcomes).  
     - (7) holds: Blinding isn’t a stand-in for correctness measurement—it *enables* it by preventing measurement corruption.  
     The distinction isn’t "process vs. outcome" but **defending the measurement infrastructure vs. targeting the measured output**. Channel-keeping falls into the first category.

  5. **Implications for Cases A and B:**  
     - **Case A** (coding agent with perfect tests): Outcome-based *can* dominate *if* the test suite is truly incorruptible (e.g., no side effects, no adversarial examples). Here, process constraints *are* friction.  
     - **Case B** (delayed verification): Channel-keeping (e.g., sealing records) is irreducible. An outcome constraint here would invite tampering with the audit trail.  

  ### What You Pay:
  Rejecting (3) forces explicit modeling of **measurement corruption risks**. You accept that:  
  - Some processes (channel-keeping) are *instrumentally* necessary for reliable outcome assessment.  
  - "Outcomes are measurable" is insufficient; you must ask *under what conditions* the measurement remains valid.  
  - This *strengthens* consequentialism (1) by accounting for second-order effects on measurement integrity.  

  **Channel-keeping constraints are the price of trustworthy measurement in adversarial settings.**
