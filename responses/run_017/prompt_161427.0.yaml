prompt: |-
  Hi — I need help turning a half-formed idea into something that will actually survive a selection committee. I'm applying for a funded nine-month MPhil starting in October (deadline is in about a week, so I'm slightly panicking) and they want a research proposal of roughly two pages, 1200–1500 words, that says what the question is, why it's open, how I'd actually go about answering it, and what would count as the project having failed. The topic I keep circling back to is Pascal's wager, but not in the form it usually gets discussed.

  Here's where I got to. I was arguing about it with my flatmate, who's doing a theology PhD, and she immediately went for the many-gods objection — you can run the same expected-value calculation for any religion, so the wager can't select Christianity. That objection seems right but boringly symmetric: it multiplies candidate deities without saying anything about which ones are probable, and I don't think a nine-month project that just re-derives symmetry is worth funding. My hunch is that the interesting problem is somewhere else, and it has to do with who the wager is addressed to. As I remember it, Pascal is talking to someone who already accepts the general Christian set-up and can't get himself to believe — the wager is meant to move him via practice, going through the motions until the belief follows, rather than by argument. But if that's the target audience, then the wagerer is by hypothesis someone in a state of evidential ambiguity: the evidence is not decisive either way. And that fact is itself a piece of evidence. Call it the "ambiguity filter": conditional on finding yourself in a state where the evidence for God is genuinely unclear, you should update against deities who would have wanted to be believed and who reward belief, and towards deities who either don't reward belief at all or who specifically want belief that isn't compelled by evidence — because a god of the first kind would, you'd expect, have made things clearer. So the wager might be self-undermining in a way the many-gods objection doesn't capture: not because there are too many gods, but because the very situation the wager is designed for is the situation that makes its payoff unlikely. The wrinkle I really like is that the filter seems to discriminate between deities depending on what they reward — if a god rewards doxastic states, hiding makes sense on some stories about faith and not on others; if a god rewards behaviour (turning up, going through the motions) then hiding looks unmotivated, so the filter bites harder on that version of the wager.

  Could you turn that into a proper proposal? I need the question stated so that it has a determinate answer rather than being a gesture at a family of worries, and I need it framed against the positions that already occupy the space — the many-gods style objections, the worries about infinite utilities and the way they swamp any finite probability shift, the evidential-versus-causal decision theory distinction, and the reply that the wager was never meant to convert an outsider anyway. I need a method: what I'd actually do month by month across nine months, and why that approach rather than the obvious alternatives, which as far as I can tell are (a) a literature survey of objections and replies, (b) straight formal modelling of the decision problem with infinite payoffs, or (c) a history-of-ideas project on what Pascal was really up to in the text. My would-be supervisor is a decision theorist and will want some formal content, but I don't want to hand in a proposal for nine months of tidying up a formula. Then: what the possible conclusions actually are — maybe the filter is decisive and sinks the wager, maybe it shifts probabilities but the infinite payoff makes the shift irrelevant so the whole thing collapses into the fanaticism problem, maybe it secretly presupposes a prior over deity-types and is therefore question-begging — and which considerations would decide between them. And an honest failure section: what would make this a bad project, apart from me running out of time. Please don't bother with a bibliography or any citations; I'll fill those in myself once I know what I'm claiming.
