  ### Audit Table

  | id       | relation | severity | mechanism | repair | cost |
  |----------|----------|----------|-----------|--------|------|
  | C1 & C3  | genuine  | 5        | Standing demos (C3) cannot adapt to decision-specific affected interests (C1), causing systematic misalignment. | Relax C3: allow multiple standing demoi for distinct decision types. | Must define decision types and their demoi without regress. |
  | C1 & C9  | genuine  | 4        | Exempting boundary decisions (C9) violates C1, as they deeply affect interests (e.g., voting rights). | Drop C9: apply C1 reflexively to boundary decisions. | Forces confrontation with regress (see ii), risking indeterminacy. |
  | C1 & C4  | genuine  | 4        | C4 excludes future people affected by existence-altering decisions (e.g., climate policy), contradicting C1. | Revise C4: include future people who would exist but for the decision. | Blurs actual/possible distinction; may admit "conditional" persons. |
  | C1 & C5  | apparent | 3        | C5’s national exclusion of non-citizens seems arbitrary if C1 demands inclusion for affected interests. | Reject C5 or argue national decisions don’t affect them. | Weakens case verdicts; may force redrawing standing rules. |

  ### Evaluation of (i) The Anchoring Move  
  The anchoring move is incoherent. It grants excluded groups a suspensive veto—a decision-shaping power—over outcomes. But determining *who gets this veto* reintroduces the boundary problem (via C1), as the veto’s exercise affects interests. This creates a second-order regress, failing to reconcile C1 and C3. (68 words)

  ### Evaluation of (ii) The Reflexive Case  
  C1, applied to boundary decisions, generates a regress: affectedness depends on the franchise, which depends on the boundary decision itself. No stable fixed points exist without arbitrary stipulation. C9 is defensible only as a pragmatic evasion, not a principled solution—it sidesteps the regress by fiat but undermines C1’s universality. (58 words)

