  We are given a set of commitments C1-C9 and two half-formed ideas (i) and (ii). The task is to audit the internal consistency of the commitments and evaluate the two ideas.

  First, we identify potential tensions among the commitments:

  1. **C1 and C3**: C1 says that for any decision, membership should be by affected interests. C3 requires a standing demos fixed in advance. But if the set of significantly affected individuals varies per decision, then a standing demos cannot always capture the affected for every decision. This is a genuine tension.

  2. **C1 and C4**: C4 is actualism about future people: only those who will actually exist count. But consider a decision that affects which people will exist (e.g., climate policy that changes the future population). By C1, if a future person is affected, they should be included. But by C4, if the decision causes them not to exist, then they are not actual and not included. However, if the decision causes them to exist, then they are actual and might be affected? But note: if we cause someone to exist, they are affected (their very existence) but only if they will actually exist. However, note C4: "merely possible people get no membership". This might be consistent if we interpret "affected" only for those who will exist regardless? But the problem is that the set of future persons who will actually exist depends on the decision. This leads to a circularity: the demos for a decision that affects who exists would include different future people depending on the decision. But C3 requires a standing demos. So we have a tension between C1, C3, and C4.

  3. **C1 and C9**: C9 exempts boundary decisions from C1. But if C1 is the basic test, why exempt? And note that boundary decisions affect who has the vote, so they affect interests. This seems inconsistent.

  4. **C1 and C5**: C5 says long-term resident non-citizens should vote in municipal but not national elections. But by C1, if their interests are significantly affected by national decisions, they should be included. This seems inconsistent unless we argue that national decisions do not significantly affect them? But that seems implausible (e.g., tax policy, foreign policy). So this might be a tension.

  5. **C1 and C6**: Children are included by proxy. But are children significantly affected? Yes. But what about future children? They are not actual (by C4) and so not included. But note: if a decision affects the interests of a child who will exist (e.g., building a playground), then by C4 that child is included only if they will actually exist. But if the decision might cause that child not to be born? Then they are not included. So the same issue as above.

  6. **C3 and C1**: Already noted.

