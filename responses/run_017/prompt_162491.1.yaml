  Row 1: C1 & C3 (genuine tension, severity 5)
  Row 2: C1 & C4 (genuine tension, severity 4) because of the interaction with future people and the standing demos.
  Row 3: C1 & C9 (genuine tension, severity 4) because boundary decisions are exempted without clear principle.
  Row 4: C1 & C5 (apparent tension, severity 3) because we can argue that municipal vs. national might reflect different affected interests, but that would require abandoning the standing demos for a two-tier system? But C3 allows multiple standing demoi? Actually, if we have multiple demoi (one per jurisdiction level) then we can say that for national decisions, the demos is fixed and excludes non-citizens. But then we must justify that the non-citizens are not significantly affected by national decisions? That's hard. So it's a tension.

  But note: the standing demos (C3) can be defined per jurisdiction? The problem is that the jurisdiction itself (what counts as a national decision) is a decision. So again, we have a regress? But we set that aside.

  We also note that the case verdicts (C5 and C6) are applications and might be inconsistent with C1 if they don't reflect affected interests.

  Now, for the repairs:

  - For C1 and C3: The cheapest repair is to relax C3 to allow for multiple standing demoi for different types of decisions (but then we must define the types and the rules for that) OR to give up on the idea that the standing demos must capture all affected for every decision and instead use the anchoring move (idea i). We'll see about (i) later.

  - For C1 and C4: We might need to adjust C4 to include future people who would exist in the most likely baseline? But that complicates. Alternatively, we might drop actualism and include all future people who would be affected by the decision in the counterfactual where the decision is made? But that would include merely possible people? That's a big cost.

  - For C1 and C9: We must drop C9 and apply C1 to boundary decisions. Then we face the reflexive regress. This leads to (ii).

  Now, we evaluate the two ideas:

  (i) The anchoring move: Instead of composing the demos by C1 for every decision, we have a standing demos (fixed in advance) and then for groups that are significantly affected but excluded, they get a right to be consulted and a suspensive veto. This might reconcile C1 and C3. But note: the veto itself is a power over the outcome. So the question becomes: who is in the demos for the veto? And for the decision to reconsider? It seems we are back to the same problem. Moreover, the standing demos itself must be set by some rule that is not subject to C1? Then we have the same exemption as in C9. So it might just be a way of changing the subject. But it might be a practical reconciliation. However, the problem of the boundary of the group that gets the veto remains. So it might be a cosmetic repair that hides the tension.

