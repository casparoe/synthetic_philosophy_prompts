  Now, for the two ideas:

  (i) Anchoring move: It does not genuinely repair because the suspensive veto is a power that requires a demos. It might be redundant if we already have a standing demos? But it adds a layer. It is incoherent because the veto itself must be exercised by someone, and we have the same boundary problem for the group that gets the veto. Verdict: incoherent.

