answer: |-
  Here are the desiderata for an adequate account of hinge commitments, designed for your critical reporting purpose. Requirements are marked **[N]** for Non-negotiable (core to the hinge concept as derived from *On Certainty* and necessary for your analytical task) and **[B]** for Bargaining chip (disputed within the field, but inclusion/exclusion significantly shapes the account's utility for you). Conflicts are flagged.

  ### Core Desiderata (What a Hinge *Is* & Must Do)
  1.  **[N] Arational Foundation:** The account must place hinges *outside* the space of reasons – not justified by evidence, not challengeable by evidence within their framework. They are what *enables* evidential practices. *Case:* A historian presupposing the reliability of carbon dating doesn't prove it from scratch in each paper; demanding such proof paralyzes historical inquiry.
  2.  **[N] Functional Necessity:** Hinges must be shown as necessary preconditions for specific, identifiable epistemic or practical "language games" or forms of life to function. Their certainty is practical, not evidential. *Case:* Chain of custody rules in court aren't "proven true" each time; they are the bedrock enabling the *practice* of evaluating evidence *within* the trial.
  3.  **[N] Non-Propositional Status (or Equivalent):** The account must explain why hinges resist treatment as ordinary empirical propositions ("The Earth is round") subject to verification/falsification. *Case:* Trying to *prove* "I have two hands" using sensory evidence presupposes the reliability of senses and bodily awareness – the very hinges in question. *What turns on it:* If hinges are propositions, they become vulnerable to evidence, collapsing the distinction with empirical claims.
  4.  **[N] Scale Invariance:** The account must apply consistently to hinges at personal ("My name is X"), institutional (Lab calibration standards), and civilizational ("The universe is governed by physical laws") scales without changing its fundamental mechanism. *Case:* The breakdown of trust in county election offices involves hinges at the institutional scale (e.g., "Ballots are counted faithfully") becoming unstable, analogous to personal hinge collapse.
  5.  **[N] Explain Hinge Collapse & Drift:** Must account for how hinges can catastrophically fail (collapse) or gradually erode/changewithout explicit rational debate (drift). *Case:* (Collapse) Adult learning memories are implanted; (Drift) Gradual shift in a university department from "Peer review ensures quality" being bedrock to being seen as a politicized gatekeeping tool, without a single defining moment.
  6.  **[B] Distinguish Genuine Hinge from "Hinge Laundering":** Must provide clear criteria to differentiate a true arational framework commitment from an empirical claim artificially insulated from evidence ("laundering"). *Case:* Declaring "Voter fraud is widespread" as an unquestionable starting point for election policy debate, laundering a contested empirical claim into a pseudo-hinge. *Conflict Risk:* This distinction may be hard if hinges are *defined* solely by functional role, as laundered claims can *attempt* this role.

  ### Critical Distinctions (What a Hinge is *Not*)
  7.  **[N] Not Just High Confidence:** Must distinguish hinge certainty (foundational, enabling) from psychological certainty (strong belief). *Case:* One can be psychologically certain the sun will rise tomorrow, but this is still based on evidence; hinge certainty underlies the *practice* of making inductive predictions.
  8.  **[N] Not a Bayesian Prior:** Must distinguish hinges from priors. Priors *are* updated by evidence (even slowly); hinges are *immune* to evidence within their frame. Priors are probabilistic; hinge certainty is "animal" or practical. *Case:* A prior about election security *can* be updated by audits; the hinge commitment enabling the *acceptance* of audit results might collapse entirely.
  9.  **[N] Not a Linguistic Presupposition:** Must distinguish from ordinary pragmatic presuppositions (e.g., "The King of France is bald" presupposes France has a king). Hinges underpin entire *world-pictures* and practices, not just sentence meanings. *Case:* Questioning the chain of custody doesn't just make a sentence odd; it threatens the entire trial's validity.
  10. **[B] Not a Kuhnian Paradigm:** Must distinguish from a scientific paradigm. Paradigms *are* challenged and replaced by evidence/rationality (scientific revolutions); hinges are *not* replaced rationally *within* the form of life they enable. Paradigm shifts involve rational comparison; hinge collapse is often traumatic/disorienting. *Case:* Replacing Newtonian with Relativistic physics was rational debate; doubting *all* sensory input is hinge collapse.
  11. **[B] Not a Constitutive Rule:** Must distinguish from rules defining an activity (e.g., chess rules). Constitutive rules are often explicit and agreed upon; hinges are usually implicit, unchosen bedrock. Changing a constitutive rule changes the game; collapsing a hinge destroys the possibility of playing *any* recognizable game in that domain. *Case:* Changing the calibration standard changes *how* the lab measures; doubting *any* calibration is possible destroys measurement.

  ### Normative Tension & Critical Bite
  12. **[B] Arationality vs. Normative Assessment (The Core Tension):** *Must* hold that hinges are arational (outside justification) **[N]**. However, the account *should* provide resources to critically evaluate frameworks or diagnose pathology *without* appealing to evidence *against* the hinge itself. *Conflict Flag:* **This is likely the hardest joint satisfaction.** *Case:* Critiquing a conspiracy framework cannot involve "disproving" its core hinge ("They control everything"). Instead, critique might focus on the framework's *internal* incoherence, practical paralysis, isolation from other practices, or the psychological/social mechanisms *behind* its adoption (e.g., laundering). *Non-negotiable:* Arationality. *Bargaining Chip:* How/if normative critique is possible. **This tension knocks out many simplistic accounts.**

  **The Single Requirement That Knocks Out Most Candidates: [N] Non-Propositional Status (or Equivalent).** Most popular accounts (especially "entitlement" views) struggle to convincingly show how something propositional can be simultaneously foundational and immune to evidence within its frame, often blurring into high-confidence beliefs or very slow-updating priors.

  ### How Main Families Fare Against the List

  1.  **Grammatical/Rule-Based (Non-Propositional - e.g., Moyal-Sharrock):** **Strengths:** Excels at **[N] Arational Foundation, [N] Functional Necessity, [N] Non-Propositional Status (core),** clear **[N] Not Proposition/High Confidence/Prior/Presupposition,** handles **[N] Scale Invariance** well. **Weaknesses:** Struggles most with **[B] Normative Assessment** (how to critique rules of the game?), explaining **[N] Hinge Drift** (how do rules silently change?), and sharply defining **[B] Laundering vs. Genuine Hinge** (is laundering just adopting bad rules?).
  2.  **Propositions Held by Entitlement (e.g., Wright, Pritchard):** **Strengths:** Better handles potential **[B] Normative Assessment** (evaluating entitlement), can describe **[N] Scale Invariance** and **[N] Hinge Collapse/Drift** (as loss/change of entitlement). **Weaknesses:** Fundamentally struggles with **[N] Non-Propositional Status** and thus **[N] Arational Foundation** – entitlement often looks like a *kind* of non-evidential justification/reason, risking collapse into **[N] Not Just High Confidence/Prior.** Blurs **[B] Laundering vs. Genuine Hinge.** Risks making hinges *too* rational.
  3.  **Non-Propositional Certainty/Animal (e.g., OC passages directly):** **Strengths:** Purest on **[N] Arational Foundation, [N] Functional Necessity, [N] Non-Propositional Status.** Explains the visceral shock of **[N] Hinge Collapse.** Clearly **[N] Not Prior/Proposition/Justified Belief.** **Weaknesses:** Hardest to articulate conceptually. Struggles significantly with **[B] Normative Assessment, [N] Hinge Drift,** and **[B] Laundering vs. Genuine Hinge.** Can seem passive, describing bedrock we're stuck with.

  ### Confidence & Uncertainty
  **Overall Confidence: Moderate-High** on the core non-negotiable desiderata ([N] 1-5, 7-9) derived directly from Wittgenstein's text and your analytical needs. **Lower Confidence** on resolving the **[B] Normative Assessment/Bite** tension satisfactorily within a strictly Wittgensteinian frame – this remains a live, contentious debate. I'm **least sure** that any account can *fully* satisfy both the strict arationality requirement *and* provide robust normative critical tools *without* smuggling in external standards that effectively reintroduce a form of rational assessment *of the hinge itself*. Your concept of "hinge laundering" is insightful and likely *necessary* precisely because existing accounts struggle to cleanly diagnose this pathology using only their core machinery; it highlights a gap. The physicist's "prior with rate=0" critique is deflected by the Non-Propositional and Functional Necessity requirements – priors *update*, hinges *enable* updating. **Quote the uncertainty on normative bite and laundering.**
