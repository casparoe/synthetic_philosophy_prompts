  ### Decomposed Credences and Justifications

  1. **Does "raise dominates everywhere" hold at δ = 0.2 with 10¢ increments, or does it flip at some bid level?**  
     - **Credence:** 0.95  
     - **Justification:** Recursive expected utility calculations show raising always yields a higher payoff than passing, as the expected loss from passing exceeds the expected loss from raising at all bid levels, with no equilibrium flip point.  
       - *Details:* At any current high bid \(H\) (in cents), passing gives a sure loss of \(-(H - 10)\). Raising to \(H + 10\) gives an expected payoff of approximately \(100 - (H + 10)\) with adjustments for δ. For example:
         - At \(H = 90¢\), passing: \(-80¢\), raising: \(0.2 \times 0 + 0.8 \times 0 = 0¢\) (better).
         - At \(H = 100¢\), passing: \(-90¢\), raising: \(0.2 \times (-10) + 0.8 \times (-10) = -10¢\) (better).
         - At \(H = 200¢\), passing: \(-190¢\), raising: \(0.2 \times (-110) + 0.8 \times (-110) = -110¢\) (still better).
       - The stopping probability δ = 0.2 bounds the expected number of additional bids to \(1/δ = 5\), but the incremental cost per raise is low (10¢), and raising always dominates because it defers the large loss from passing while offering a chance to win or lose less. No flip occurs even at high bids.

