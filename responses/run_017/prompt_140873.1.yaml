prompt: |-
  I'm a second-year PhD student in philosophy, currently in a seminar on formal epistemology, and we have just spent two weeks on Aumann's agreement theorem and on the epistemology of disagreement that it tends to get wheeled into. My verdicts on concrete cases don't seem to line up with any of the positions we have discussed, and I would like help working out what principle, if any, they add up to. I may be misremembering the theorem, so tell me if I am: as I understand it, if two agents start from a common prior over a shared space of possibilities, and it is common knowledge between them what each of their posterior probabilities for some event is, then those posteriors are equal — ideally rational agents with a shared prior cannot agree to disagree. I would rather not be told what to read next; the cases are what I want help with.

  Two forecasters at the same weather service. Same model, same training, each gets the readings from half the stations in the region; they exchange their probability of heavy rain tomorrow, then exchange again, and could go on indefinitely. I think each round should shrink the gap, that any residual gap after one round is entirely fine, and that persisting in a gap after ten rounds would be irrational.

  Same setup, except that each forecaster's evidence is a radar image whose noise level the viewer cannot tell from the image itself: you see what you see, and you have no independent handle on how much of it is artefact. They share the images and their probabilities. Here I do not think convergence is required even in the limit — neither has any way of telling whose image was cleaner, and sharing does not manufacture one. I feel there is something structurally different about this case, but I cannot say what it is.

  Two climatologists who disagree about the probability that some threshold will be crossed by 2050. They have read everything, they know each other's posteriors, and the disagreement traces to how much weight each gives to a class of historical evidence. My verdict is that the disagreement is permissible, because the common-prior assumption is exactly what fails here. But I know the obvious reply — that evidential weightings are themselves rather like probabilities, so why should the theorem not apply one level up and force agreement about the weighting? My gut resists that, and I cannot say why.

  Two analysts with a common prior, full common knowledge of each other's posteriors, disagreeing about whether there will be a run on a particular bank next week, where whether the run happens depends partly on what depositors believe will happen. I think standing firm here is fine, and I think the theorem does not apply at all, but I would like to know what the principled statement of the exemption is.

  Two of us in the seminar, similar training and similar track records, read the same forty-page paper over the weekend; on Monday one says the central argument is sound and the other says it is a howler. Neither has done anything extra. I think both should reduce confidence substantially, though not all the way to agnosticism. But now vary it: same pair, same paper, except that one of them spent the weekend reconstructing the central lemma step by step and checking it against a textbook treatment, while the other read it once on a train. I think the careful reader may keep nearly all her confidence and need give almost no ground. I hold both verdicts, and I notice that the surface situation is the same in each — two peers, one text.

  Two pairs of agents both end the day with posteriors of roughly 0.7 and 0.4 for the same event after three rounds of exchanging posteriors. In one pair the exchange stopped because the market closed at five. In the other it stopped because they lost interest and went to the pub. I think the first pair's residual disagreement is not irrational and the second pair's is. I know this commits me to permissibility being a property of something other than the posterior reached, and I would like to see a principle say what.

  Two agents with a common prior face a posterior that would require integrating over an enormous space; neither can compute it and each knows the other cannot. I do not want to call their persistence irrational, and I do not want to call it permitted either — I oscillate between thinking them excused and thinking them fine, and I suspect the distinction matters for everything above.

  Finally, I am told the theorem entails that purely informational trade cannot occur between rational agents with a common prior. I do not believe that of actual markets, and this makes me suspect the common prior is doing all the work, so I distrust any conclusion that leans on it.

  The case I keep going back and forth on is peer disagreement about a normative question — say whether a particular gene-editing policy is permissible — where the peers share a background, share all the empirical evidence, and have no experts to defer to. I cannot settle whether full conciliation is required there or whether something about normative subject matter licenses steadfastness.

  Is there one principle that captures these verdicts, or nearly all of them, and what is it? Please state it precisely, say which of my cases motivates which clause, and then give me its verdicts on three cases I have not listed: the normative case above; a case where one peer is demonstrably better calibrated in the domain but the other has the more specific evidence; and a case where the disagreement is discovered only after the decision has been made and cannot be revisited. Say plainly which of my verdicts the principle cannot accommodate and would force me to give up, and give me the simpler alternative principle that overturns one of them, so I can see what the trade really is. Where you can, separate what is settled — the status of the theorem itself as mathematics, about which I want to be corrected if I am wrong — from what is genuinely contested among people who work on this: whether a common prior is a requirement of rationality, whether results about ideal agents constrain agents like us, whether higher-order evidence about one's own reliability changes the answer, and anything else you think specialists would divide over. Please do not present a contested view as the consensus, and flag the points where you would expect a seminar reading list to have pushed me in one direction. And please write the whole thing as continuous prose — no headings, no bullet points, no bold, no tables — the way you would write a long email to a student you know.
reasoning: |-
  Okay, let me try to work through this philosophy PhD student's query. They're grappling with Aumann's agreement theorem and how their intuitive judgments about disagreement cases don't align with standard interpretations. 

  First, I need to recall the theorem accurately: it states that if two rational agents share a common prior and have common knowledge of each other's posteriors, their posteriors must be equal. The student seems to understand this correctly but struggles with applying it to various scenarios.

  Looking at their cases:
  - The weather forecasters exchanging probabilities based on data from different stations - they think the gap should shrink with each exchange but some residual disagreement is acceptable initially. This makes sense because full common knowledge isn't instantaneous.
  - The noisy radar images case - here convergence shouldn't be required because the agents can't assess whose evidence is more reliable. This highlights that the theorem assumes evidence is partitional, which isn't true here.
  - The climatologists disagreeing about historical evidence weights - the student thinks this violates the common prior assumption. They're resisting the idea that weighting choices should be subject to the same agreement requirement, which seems right since these might reflect fundamental epistemic differences.
  - The bank run case with belief-dependent outcomes - the theorem doesn't apply because the event depends on the agents' beliefs themselves. This is clearly outside the theorem's scope.

  I notice the student keeps returning to the role of the common prior assumption. Their skepticism about it explaining market behaviors is understandable - real markets likely involve genuine prior differences. 

  The peer disagreement cases are particularly tricky. When both read the paper casually, mutual conciliation seems appropriate. But when one did careful verification, steadfastness makes sense. The key factor seems to be whether the agents have private access to higher-order evidence about their own reliability.

  The cases where computation is infeasible or exchange stops for external reasons point to important practical constraints on the ideal theorem. The student is rightly distinguishing between rational permissibility and mere excusability.

  For a unifying principle, something like this might capture most of their intuitions: Rational agents must conciliate disagreements proportionally to (a) the accessibility of each other's evidential bases and reasoning, and (b) the extent to which their disagreement stems from recoverable asymmetries rather than fundamental epistemic differences, given computational constraints and the availability of higher-order evidence.

  This would explain why:
  - Weather forecasters should converge (accessible evidence)
  - Radar viewers needn't converge (inaccessible evidence quality)
  - Climatologists can disagree (fundamental differences in weighting)
  - The careful reader needn't conciliate (private higher-order evidence)

  For their unlisted cases:
  - Normative peer disagreement: Full conciliation probably required since no private evidence
  - Better-calibrated peer: Should defer to better-calibrated agent despite specific evidence
  - Post-decision discovery: Should update but may not require action reversal

  The main tension is with their pub case - why should reason for stopping matter? The principle might need refinement here, perhaps incorporating a requirement of good faith effort.

  The student will need to confront that some of their intuitions (like the pub vs market closure distinction) might not hold up under scrutiny. But overall, their resistance to rigid applications of the theorem seems philosophically well-founded.
answer: |-
  Your intuitions across these cases reveal a coherent pattern, centered on *accessibility of evidence* and *recoverability of reasoning*, constrained by computational limits and the nature of the epistemic object. The common prior assumption is doing heavy lifting, but your resistance stems from its failure to account for how agents *interact with* evidence and each other’s cognitive processes. Below is a principle that systematizes your verdicts, followed by analysis of new cases and critical trade-offs.

  ### The Principle: Accessible Evidence Conciliation (AEC)
  **Rational agents must conciliate disagreements proportionally to (a) the accessibility of each other’s evidential bases and reasoning, and (b) the extent to which their disagreement stems from recoverable asymmetries rather than fundamental epistemic differences, given computational constraints.**  
  - **Accessibility**: Evidence/reasoning is accessible if agents can mutually verify its content and reliability without new exogenous information.  
  - **Recoverability**: An asymmetry is recoverable if agents can jointly simulate or reconstruct the steps leading from evidence to posterior.  
  - **Fundamental differences**: Disagreements arising from irreducibly distinct priors, interpretive frameworks, or computationally intractable inferences are exempt from full conciliation.  

  ### Mapping Cases to AEC
  1. **Weather forecasters (half-stations)**:  
     - Evidence (station data) is recoverable (they could share raw data).  
     - Accessibility is high (same model/training).  
     → *Gap should shrink rapidly* (recoverable asymmetry).  
     - After one round, residual gap is fine (computation takes time); after ten, irrational (asymmetry should be resolved).  

  2. **Radar images (noise unknown)**:  
     - Evidence (image "content") is accessible, but reliability is not (noise level is unrecoverable from the image alone).  
     - Asymmetry is unrecoverable (no shared method to adjudicate noise).  
     → *Convergence not required* (fundamental difference in evidence quality).  

  3. **Climatologists (weighting historical evidence)**:  
     - Weighting reflects prior-like interpretive frameworks, not recoverable from evidence alone.  
     - Common prior fails at the level of evidence valuation.  
     → *Disagreement permissible* (fundamental epistemic difference).  
     - *Reply to "one level up"*: Weightings are not probabilities but meta-epistemic commitments; Aumann assumes a fixed algebra, but here the space of "possible weightings" lacks a common prior.  

  4. **Bank run (belief-dependent outcome)**:  
     - Event depends on agents’ beliefs (reflexive), violating Aumann’s static possibility space.  
     → *Theorem inapplicable*; standing firm is rational (posteriors affect the event).  

  5. **Seminar peers (same paper, no extra work)**:  
     - Reasoning is accessible (both could walk through the argument).  
     - Asymmetry (divergent interpretations) is recoverable via dialogue.  
     → *Both must conciliate substantially* (recoverable asymmetry).  

  6. **Seminar peers (careful vs. casual reading)**:  
     - Careful reader’s *process* (step-by-step checking) is inaccessible private evidence.  
     - Asymmetry is unrecoverable (casual reader cannot retrospectively verify the work).  
     → *Careful reader need not conciliate* (unrecoverable asymmetry legitimizes higher-order confidence).  

  7. **Posteriors 0.7/0.4 (market close vs. pub)**:  
     - Accessibility condition violated in pub case: Stopping due to disinterest implies unrecoverable asymmetry (they *could* have continued). Market closure is external constraint.  
     → *Market pair excused, pub pair irrational* (permissibility depends on good-faith effort to recover asymmetry).  

  8. **Intractable computation**:  
     - Unrecoverable asymmetry due to computational limits.  
     → *Disagreement excused but not fully rational* (agents should acknowledge uncertainty; AEC treats computational bounds as external constraints).  

  9. **Informational trade**:  
     - Your suspicion is correct: Aumann’s "no trade" result relies on common priors. Real markets often reflect genuine prior differences (e.g., heterogenous models).  
     → *Distrust of common-prior-dependent conclusions is warranted*.  

  ### Verdicts on New Cases
  1. **Normative peer disagreement (gene-editing policy)**:  
     - Empirical evidence accessible, but normative reasoning may involve irreducibly distinct evaluative frameworks.  
     → **AEC verdict**: *Full conciliation not required*. Fundamental differences in moral priors exempt agents from convergence. Disagreement is permissible if reasoning traces to axiomatic divergences.  

  2. **Better-calibrated peer vs. specific evidence**:  
     - Calibration provides higher-order evidence about reliability, but specific evidence is primary.  
     → **AEC verdict**: *Conciliation required, but asymmetric*. The better-calibrated agent should give less ground (her reliability is inaccessible evidence for the other). The agent with specific evidence must conciliate more, as their evidence is recoverable (in principle).  

  3. **Disagreement discovered post-decision**:  
     - Evidence/reasoning accessibility unchanged, but no action can be taken.  
     → **AEC verdict**: *Agents should update beliefs, but no practical revision needed*. Rationality requires internal conciliation (e.g., reduced confidence), though irreversibility excuses inaction.  

  ### What AEC Cannot Accommodate
  - **The pub vs. market closure case**: AEC deems the pub pair irrational for not continuing, but this assumes that further exchange *would* resolve the asymmetry. If the asymmetry were fundamental (e.g., differing utility functions), stopping might be rational. AEC struggles with counterfactual recoverability.  
    - *Simpler alternative principle*: **Conciliation is required iff agents have common knowledge that all evidence is shared**. This overturns your pub verdict (both pairs are equally irrational/rationally excused).  

  ### Settled vs. Contested Issues  
  - **Settled**: Aumann’s theorem is mathematically sound given its assumptions (common prior, common knowledge of posteriors, partitional knowledge). Your bank run case correctly identifies a violation (non-partitional knowledge due to reflexivity).  
  - **Contested**:  
    - **Common prior as rationality requirement**: You reject this (climatologists case). Specialists divide sharply (e.g., Aumann vs. Binmore). Seminar readings likely pushed you toward skepticism (e.g., critique from evolutionary epistemology).  
    - **Ideal agents vs. humans**: Your intractable computation case highlights this. Most formal epistemologists concede idealization limits practical applicability.  
    - **Higher-order evidence**: Your careful reader case relies on it. Controversy exists over whether it overrides first-order evidence (see Lasonen-Aarnio vs. Christensen).  
    - **Normative vs. factual disagreement**: AEC treats normative cases as "fundamental differences," but some (e.g., convergence rationalists) argue conciliation is always required.  

  ### The Core Trade  
  Your intuitions prioritize *epistemic effort* and *evidential transparency* over mechanical consensus. AEC captures this but forces a concession: If recoverability is possible (e.g., forecasters), conciliation *must* occur. To preserve your pub verdict, you must add a clause: **"unless further exchange is practically futile or costs exceed epistemic gains."** This risks ad-hocness but mirrors real-world rationality.  

  Your deepest insight is that disagreement often traces not to *evidence* but to *how evidence is processed*—and this processing may be inaccessible, intractable, or rooted in irreconcilable frameworks. That is the blind spot of Aumann’s theorem, and the reason your cases strain against it.
